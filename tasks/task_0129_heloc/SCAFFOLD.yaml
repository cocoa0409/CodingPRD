scenario: |
  HELOC Home Equity Line of Credit: lien position (typically 2nd lien on primary
  residence), Draw period (10 years with interest-only or minimum payments allowed),
  repayment period (10-20 years amortizing), variable rate calculated as Prime Rate
  + Margin with periodic and lifetime caps, annual fee (waivable in first year),
  default triggers (payment delinquency 90+ days, property insurance lapse, senior
  lien default, bankruptcy), early closure fee (typically applied if closed within
  3 years of origination).

domain_name: "heloc-servicing"
api_prefix: "/helocs"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation        # interest-only minimum vs amortizing payment
    - rate_threshold_triggers          # periodic/lifetime caps, 90-day delinquency, 3-year early-closure window
    - scheduled_deferred_actions       # rate resets, annual fee assessment, period rollover
    - cascading_side_effects           # default trigger -> account freeze -> fee accrual stop
  entity_topology: hybrid
  state_machine_shape: branching       # DRAW -> {REPAY, DEFAULT, CLOSED}; REPAY -> {DEFAULT, CLOSED}
  relationship_patterns:
    - one_to_many                      # Heloc -> Draws, Payments, RateResets, Fees
    - cross_aggregate                  # SeniorLien default cascades to Heloc default
  role_model: segregation_of_duties    # Originator cannot also Service; PlatformAdmin advances clock
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of borrower."
        constraints: "Length 1..200."
      - name: email
        type: string
        source: input
        description: "Contact email; used as login identity."
        constraints: "Unique across Borrowers; RFC-5322 shape."
      - name: bankruptcy_flag
        type: boolean
        source: computed
        description: "Set true when a BankruptcyEvent is filed; never resets to false."
        default: false
      - name: bankruptcy_filed_at
        type: datetime
        source: computed
        description: "Timestamp the first BankruptcyEvent was recorded; null otherwise."
        default: null

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "Owner of the property; must reference an existing Borrower."
      - name: address
        type: string
        source: input
        description: "Free-form U.S. property address."
        constraints: "Length 1..300."
      - name: appraised_value_cents
        type: integer
        source: input
        description: "Most recent appraisal in cents."
        constraints: ">= 100000 (i.e. $1,000)."
      - name: occupancy
        type: enum
        source: input
        description: "Property occupancy class."
        constraints: "{PRIMARY, SECONDARY, INVESTMENT}; HELOC only allowed on PRIMARY."
        default: PRIMARY
      - name: insurance_status
        type: enum
        source: computed
        description: "Whether property hazard insurance is currently in force."
        constraints: "{ACTIVE, LAPSED}; toggled by InsuranceEvent records."
        default: ACTIVE
      - name: insurance_lapsed_at
        type: datetime
        source: computed
        description: "Timestamp the latest LAPSE event was recorded; null while ACTIVE."
        default: null

  - name: SeniorLien
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "Property this senior mortgage is secured against."
      - name: holder_name
        type: string
        source: input
        description: "Name of the senior lienholder (informational)."
        constraints: "Length 1..200."
      - name: principal_balance_cents
        type: integer
        source: input
        description: "Outstanding senior lien balance in cents."
        constraints: ">= 0."
      - name: status
        type: enum
        source: computed
        description: "Senior lien state, set CURRENT at creation; flips to DEFAULTED on a SeniorLienDefaultEvent."
        constraints: "{CURRENT, DEFAULTED}."
        default: CURRENT
      - name: defaulted_at
        type: datetime
        source: computed
        description: "Timestamp the senior lien flipped to DEFAULTED; null otherwise."
        default: null

  - name: Heloc
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "Borrower obligated on the HELOC."
      - name: property_id
        type: string
        source: input
        description: "Collateral property; must have occupancy=PRIMARY and an existing SeniorLien (this is a 2nd lien)."
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum draw line on the HELOC, in cents."
        constraints: ">= 1000000 (i.e. $10,000) and <= 50000000 (i.e. $500,000)."
      - name: margin_bps
        type: integer
        source: input
        description: "Margin added to Prime Rate, in basis points."
        constraints: "0 <= margin_bps <= 1000."
      - name: periodic_cap_bps
        type: integer
        source: input
        description: "Maximum absolute change in fully-indexed rate between consecutive RateResets."
        constraints: "0 < periodic_cap_bps <= 500."
      - name: lifetime_cap_bps
        type: integer
        source: input
        description: "Maximum fully-indexed rate ever charged on this account."
        constraints: "lifetime_cap_bps > initial_rate_bps + periodic_cap_bps; <= 2500."
      - name: lifetime_floor_bps
        type: integer
        source: input
        description: "Minimum fully-indexed rate ever charged on this account."
        constraints: ">= 0 and < initial_rate_bps."
      - name: initial_rate_bps
        type: integer
        source: computed
        description: "Fully-indexed rate at origination: prime_rate_bps_at_origination + margin_bps, clamped to [lifetime_floor_bps, lifetime_cap_bps]."
      - name: current_rate_bps
        type: integer
        source: computed
        description: "Current fully-indexed rate; updated by RateReset records."
      - name: origination_date
        type: datetime
        source: system
        description: "Date HELOC was created (server clock at POST /helocs)."
      - name: draw_period_end_date
        type: datetime
        source: computed
        description: "origination_date + 10 years (exactly 3650 days)."
      - name: repayment_period_end_date
        type: datetime
        source: computed
        description: "draw_period_end_date + repayment_term_years * 365 days."
      - name: repayment_term_years
        type: integer
        source: input
        description: "Length of amortizing repayment period."
        constraints: "10 <= repayment_term_years <= 20."
      - name: principal_balance_cents
        type: integer
        source: computed
        description: "Outstanding principal on the line. Increased by Draw.amount_cents, decreased by Payment.principal_component_cents."
        default: 0
      - name: available_credit_cents
        type: integer
        source: computed
        description: "credit_limit_cents - principal_balance_cents; never negative while status in {DRAW}."
      - name: accrued_interest_cents
        type: integer
        source: computed
        description: "Interest accrued since the last billing cycle reset; cleared by Payment.interest_component_cents application."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state; transitions only through declared state machine."
        constraints: "{PENDING, DRAW, REPAY, DEFAULT, CLOSED}."
        default: PENDING
      - name: delinquency_days
        type: integer
        source: computed
        description: "Days past due on the minimum payment; recomputed by /_sweep/billing-cycle."
        default: 0
      - name: annual_fee_cents
        type: integer
        source: input
        description: "Yearly fee charged on the line."
        constraints: "0 <= annual_fee_cents <= 25000."
      - name: annual_fee_waived_first_year
        type: boolean
        source: input
        description: "If true, the first AnnualFee assessment (at origination_date + 365 days) is recorded as WAIVED."
        default: false
      - name: early_closure_fee_cents
        type: integer
        source: input
        description: "Flat fee assessed if account closes within 3 years (1095 days) of origination."
        constraints: "0 <= early_closure_fee_cents <= 50000."
      - name: defaulted_at
        type: datetime
        source: computed
        description: "Timestamp Heloc transitioned to DEFAULT; null otherwise."
        default: null
      - name: default_trigger
        type: enum
        source: computed
        description: "Reason for default."
        constraints: "{DELINQUENCY_90, INSURANCE_LAPSE, SENIOR_LIEN_DEFAULT, BANKRUPTCY, null}."
        default: null
      - name: closed_at
        type: datetime
        source: computed
        description: "Timestamp Heloc transitioned to CLOSED; null otherwise."
        default: null

  - name: Draw
    parent: Heloc
    common_fields: false  # immutable ledger entry
    fields:
      - name: heloc_id
        type: string
        source: input
        description: "HELOC the draw is taken against."
      - name: amount_cents
        type: integer
        source: input
        description: "Draw amount in cents."
        constraints: ">= 10000 (minimum $100) and <= available_credit_cents at request time."
      - name: drawn_at
        type: datetime
        source: system
        description: "Server clock at POST /helocs/{id}/draws."

  - name: Payment
    parent: Heloc
    common_fields: false  # immutable ledger entry
    fields:
      - name: heloc_id
        type: string
        source: input
        description: "HELOC the payment is applied to."
      - name: amount_cents
        type: integer
        source: input
        description: "Payment amount in cents."
        constraints: ">= minimum_payment_due_cents at request time (see minimum_payment_due calculation); allowed in any account state in {DRAW, REPAY, DEFAULT}."
      - name: interest_component_cents
        type: integer
        source: computed
        description: "Portion of amount_cents applied to accrued_interest_cents (interest paid first, capped at accrued_interest_cents)."
      - name: principal_component_cents
        type: integer
        source: computed
        description: "amount_cents - interest_component_cents; reduces principal_balance_cents."
      - name: posted_at
        type: datetime
        source: system
        description: "Server clock at POST /helocs/{id}/payments."

  - name: RateReset
    parent: Heloc
    common_fields: false  # immutable ledger entry
    fields:
      - name: heloc_id
        type: string
        source: input
        description: "HELOC the rate reset applies to."
      - name: prime_rate_bps
        type: integer
        source: input
        description: "Quoted Prime Rate (basis points) used for this reset."
        constraints: "0 <= prime_rate_bps <= 3000."
      - name: requested_rate_bps
        type: integer
        source: computed
        description: "prime_rate_bps + Heloc.margin_bps before any clamping."
      - name: applied_rate_bps
        type: integer
        source: computed
        description: "requested_rate_bps after applying periodic_cap_bps (against Heloc.current_rate_bps), then lifetime_cap_bps and lifetime_floor_bps clamping. This becomes the new Heloc.current_rate_bps."
      - name: reset_at
        type: datetime
        source: system
        description: "Server clock at POST /helocs/{id}/rate-resets."

  - name: Fee
    parent: Heloc
    common_fields: false  # immutable ledger entry
    fields:
      - name: heloc_id
        type: string
        source: input
        description: "HELOC the fee applies to."
      - name: fee_type
        type: enum
        source: computed
        description: "Type of fee."
        constraints: "{ANNUAL, EARLY_CLOSURE}."
      - name: amount_cents
        type: integer
        source: computed
        description: "For ANNUAL: Heloc.annual_fee_cents (or 0 if WAIVED). For EARLY_CLOSURE: Heloc.early_closure_fee_cents."
      - name: status
        type: enum
        source: computed
        description: "Settlement status."
        constraints: "{ASSESSED, WAIVED}; WAIVED only used for first ANNUAL fee when annual_fee_waived_first_year=true."
      - name: assessed_at
        type: datetime
        source: system
        description: "Server clock when this Fee was created."

  - name: DefaultEvent
    parent: Heloc
    common_fields: false  # immutable audit log
    fields:
      - name: heloc_id
        type: string
        source: input
        description: "HELOC affected."
      - name: trigger
        type: enum
        source: computed
        description: "Which default trigger fired."
        constraints: "{DELINQUENCY_90, INSURANCE_LAPSE, SENIOR_LIEN_DEFAULT, BANKRUPTCY}."
      - name: source_event_id
        type: string
        source: computed
        description: "For INSURANCE_LAPSE -> InsuranceEvent.id; SENIOR_LIEN_DEFAULT -> SeniorLienDefaultEvent.id; BANKRUPTCY -> BankruptcyEvent.id; DELINQUENCY_90 -> null (sweep-derived)."
        default: null
      - name: recorded_at
        type: datetime
        source: system
        description: "Server clock when the default was recorded."

  - name: InsuranceEvent
    parent: Property
    common_fields: false  # immutable audit log
    fields:
      - name: property_id
        type: string
        source: input
        description: "Property the event pertains to."
      - name: event_type
        type: enum
        source: input
        description: "Insurance state change."
        constraints: "{LAPSE, REINSTATE}."
      - name: recorded_at
        type: datetime
        source: system
        description: "Server clock at POST /properties/{id}/insurance-events."

  - name: SeniorLienDefaultEvent
    parent: SeniorLien
    common_fields: false  # immutable audit log
    fields:
      - name: senior_lien_id
        type: string
        source: input
        description: "Senior lien declared in default."
      - name: recorded_at
        type: datetime
        source: system
        description: "Server clock at POST /senior-liens/{id}/default-events."

  - name: BankruptcyEvent
    parent: Borrower
    common_fields: false  # immutable audit log
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "Borrower who filed."
      - name: recorded_at
        type: datetime
        source: system
        description: "Server clock at POST /borrowers/{id}/bankruptcy-events."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Heloc
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: DRAW
        trigger: "POST /helocs/{id}/activate"
        actor: Originator
        preconditions:
          - "Property.occupancy == PRIMARY"
          - "SeniorLien exists on Property with status == CURRENT"
          - "Heloc.principal_balance_cents == 0"
          - "Borrower.bankruptcy_flag == false"
        side_effects:
          - "Heloc.status -> DRAW"
          - "Heloc.origination_date -> server clock"
          - "Heloc.draw_period_end_date -> origination_date + 3650 days"
          - "Heloc.repayment_period_end_date -> draw_period_end_date + repayment_term_years * 365 days"
          - "Heloc.initial_rate_bps -> clamp(prime_rate_bps_at_origination + margin_bps, lifetime_floor_bps, lifetime_cap_bps) using the prime_rate_bps supplied in activation body"
          - "Heloc.current_rate_bps -> Heloc.initial_rate_bps"
          - "Heloc.available_credit_cents -> credit_limit_cents"
        note: "First and only transition out of PENDING."

      - from: DRAW
        to: REPAY
        trigger: "POST /_sweep/billing-cycle (system, when current clock time >= Heloc.draw_period_end_date)"
        actor: system
        preconditions:
          - "Heloc.status == DRAW"
          - "current clock time >= Heloc.draw_period_end_date"
        side_effects:
          - "Heloc.status -> REPAY"
          - "No further draws permitted; minimum payment switches from interest-only to amortizing schedule (see calculations.minimum_payment_due variant)"

      - from: DRAW
        to: DEFAULT
        trigger: "POST /_sweep/billing-cycle (system, delinquency check) OR cross-entity event (insurance lapse / senior lien default / bankruptcy)"
        actor: system
        preconditions:
          - "Heloc.status == DRAW"
          - "AT LEAST ONE OF: Heloc.delinquency_days >= 90 (after sweep); Property.insurance_status == LAPSED; SeniorLien.status == DEFAULTED; Borrower.bankruptcy_flag == true"
        side_effects:
          - "Heloc.status -> DEFAULT"
          - "Heloc.default_trigger -> the matching enum value (priority order: BANKRUPTCY > SENIOR_LIEN_DEFAULT > INSURANCE_LAPSE > DELINQUENCY_90)"
          - "Heloc.defaulted_at -> server clock"
          - "DefaultEvent created with matching trigger and source_event_id"
          - "Further Draw creation is rejected (ERR_HELOC_DEFAULTED)"
          - "No further Fee accrual: any AnnualFee assessment that would otherwise fire while status == DEFAULT is suppressed"

      - from: REPAY
        to: DEFAULT
        trigger: "POST /_sweep/billing-cycle (system) OR cross-entity event"
        actor: system
        preconditions:
          - "Heloc.status == REPAY"
          - "Same OR-list as DRAW->DEFAULT preconditions"
        side_effects:
          - "Same as DRAW->DEFAULT side_effects, with status REPAY -> DEFAULT"

      - from: DRAW
        to: CLOSED
        trigger: "POST /helocs/{id}/close"
        actor: Servicer
        preconditions:
          - "Heloc.status == DRAW"
          - "Heloc.principal_balance_cents == 0"
          - "Heloc.accrued_interest_cents == 0"
        side_effects:
          - "Heloc.status -> CLOSED"
          - "Heloc.closed_at -> server clock"
          - "If (Heloc.closed_at - Heloc.origination_date) < 1095 days AND Heloc.early_closure_fee_cents > 0: a Fee record of type EARLY_CLOSURE is created with status ASSESSED and amount_cents == Heloc.early_closure_fee_cents"

      - from: REPAY
        to: CLOSED
        trigger: "POST /helocs/{id}/close"
        actor: Servicer
        preconditions:
          - "Heloc.status == REPAY"
          - "Heloc.principal_balance_cents == 0"
          - "Heloc.accrued_interest_cents == 0"
        side_effects:
          - "Heloc.status -> CLOSED"
          - "Heloc.closed_at -> server clock"
          - "Early-closure fee never assessed from REPAY (origination_date is already > 3650 days in the past)."

      - from: DEFAULT
        to: CLOSED
        trigger: "POST /helocs/{id}/close"
        actor: Servicer
        preconditions:
          - "Heloc.status == DEFAULT"
          - "Heloc.principal_balance_cents == 0"
          - "Heloc.accrued_interest_cents == 0"
        side_effects:
          - "Heloc.status -> CLOSED"
          - "Heloc.closed_at -> server clock"
          - "Early-closure fee assessed iff (closed_at - origination_date) < 1095 days and early_closure_fee_cents > 0"

  - entity: SeniorLien
    initial_state: CURRENT
    terminal_states: [DEFAULTED]
    transitions:
      - from: CURRENT
        to: DEFAULTED
        trigger: "POST /senior-liens/{id}/default-events"
        actor: Servicer
        preconditions:
          - "SeniorLien.status == CURRENT"
        side_effects:
          - "SeniorLien.status -> DEFAULTED"
          - "SeniorLien.defaulted_at -> server clock"
          - "For every Heloc with property_id == this.property_id AND status IN {DRAW, REPAY}: trigger DRAW/REPAY -> DEFAULT with default_trigger = SENIOR_LIEN_DEFAULT and source_event_id = SeniorLienDefaultEvent.id (cascade hop 1)"
          - "Each cascaded Heloc DEFAULT in turn suppresses any future AnnualFee that would have been assessed on that Heloc (cascade hop 2)"

  - entity: Property
    initial_state: ACTIVE  # for insurance_status
    terminal_states: []     # property itself does not terminate; insurance toggles
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /properties/{id}/insurance-events with event_type=LAPSE"
        actor: Servicer
        preconditions:
          - "Property.insurance_status == ACTIVE"
        side_effects:
          - "Property.insurance_status -> LAPSED"
          - "Property.insurance_lapsed_at -> server clock"
          - "For every Heloc with property_id == this.id AND status IN {DRAW, REPAY}: trigger DRAW/REPAY -> DEFAULT with default_trigger = INSURANCE_LAPSE and source_event_id = InsuranceEvent.id (cascade hop 1)"
          - "Each cascaded Heloc DEFAULT also suppresses future AnnualFee assessments on that Heloc (cascade hop 2)"

      - from: LAPSED
        to: ACTIVE
        trigger: "POST /properties/{id}/insurance-events with event_type=REINSTATE"
        actor: Servicer
        preconditions:
          - "Property.insurance_status == LAPSED"
        side_effects:
          - "Property.insurance_status -> ACTIVE"
          - "Property.insurance_lapsed_at -> null"
          - "Helocs already in DEFAULT due to INSURANCE_LAPSE are NOT auto-reactivated (DEFAULT is sticky)."

  - entity: Borrower
    initial_state: SOLVENT  # for bankruptcy_flag
    terminal_states: [BANKRUPT]
    transitions:
      - from: SOLVENT
        to: BANKRUPT
        trigger: "POST /borrowers/{id}/bankruptcy-events"
        actor: Servicer
        preconditions:
          - "Borrower.bankruptcy_flag == false"
        side_effects:
          - "Borrower.bankruptcy_flag -> true"
          - "Borrower.bankruptcy_filed_at -> server clock"
          - "For every Heloc with borrower_id == this.id AND status IN {DRAW, REPAY}: trigger DRAW/REPAY -> DEFAULT with default_trigger = BANKRUPTCY and source_event_id = BankruptcyEvent.id (cascade hop 1)"
          - "Each cascaded Heloc DEFAULT also suppresses future AnnualFee assessments on that Heloc (cascade hop 2)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two activations of the same PENDING Heloc submitted simultaneously."
    guarantee: "At most one activation succeeds; the other is rejected because the Heloc is no longer in PENDING."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Heloc.status."

  - scenario: "Two draws on the same DRAW Heloc submitted simultaneously where together they would exceed available_credit_cents but individually they would not."
    guarantee: "At most one draw succeeds; the second is rejected for insufficient available credit."
    error_id: ERR_INSUFFICIENT_AVAILABLE_CREDIT
    http_status: 422
    serialization: "Available credit is decremented atomically per Draw insert; first-writer-wins."

  - scenario: "POST /helocs/{id}/close submitted concurrently with POST /helocs/{id}/payments where the close pre-check sees zero balance but the payment crosses it back above zero."
    guarantee: "Exactly one operation succeeds; if close commits first, payment is rejected with ERR_HELOC_CLOSED; if payment commits first, close is rejected because balance > 0."
    error_id: ERR_BALANCE_NOT_ZERO
    http_status: 409
    serialization: "First-writer-wins on Heloc.status / Heloc.principal_balance_cents."

  - scenario: "POST /helocs/{id}/close races with a system default trigger (insurance lapse / senior lien default / bankruptcy / sweep finding 90-day delinquency)."
    guarantee: "If the default cascade commits first, close still succeeds from DEFAULT (declared transition) but the early-closure fee window is evaluated as of the (later) close time. If close commits first, the cascade no-ops on this Heloc because status is CLOSED."
    error_id: ERR_HELOC_CLOSED
    http_status: 409
    serialization: "First-writer-wins on Heloc.status."

  - scenario: "POST /helocs/{id}/rate-resets submitted concurrently for the same Heloc."
    guarantee: "Both records persist sequentially; each reset's applied_rate_bps is computed against the most recent current_rate_bps at insert time, so the second reset sees the first reset's applied rate."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Optimistic concurrency on Heloc.version; loser must retry against the updated current_rate_bps."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: applied_rate_bps
    trigger: "On every POST /helocs/{id}/rate-resets that creates a RateReset (side effect: updates Heloc.current_rate_bps and Heloc.updated_at; bumps Heloc.version)."
    algorithm: constraint_propagation
    formula: |
      # Inputs: prime_rate_bps (from body), Heloc.margin_bps,
      #         Heloc.periodic_cap_bps, Heloc.lifetime_floor_bps,
      #         Heloc.lifetime_cap_bps, Heloc.current_rate_bps (pre-reset).
      requested = prime_rate_bps + Heloc.margin_bps
      # 1. Apply periodic cap against the CURRENT rate (not the initial rate).
      delta = requested - Heloc.current_rate_bps
      if delta >  Heloc.periodic_cap_bps:
          periodic_clamped = Heloc.current_rate_bps + Heloc.periodic_cap_bps
      elif delta < -Heloc.periodic_cap_bps:
          periodic_clamped = Heloc.current_rate_bps - Heloc.periodic_cap_bps
      else:
          periodic_clamped = requested
      # 2. Apply lifetime cap and floor (absolute bounds across all resets).
      applied = max(Heloc.lifetime_floor_bps,
                    min(Heloc.lifetime_cap_bps, periodic_clamped))
      return applied
    input_set: "The single RateReset request; reads Heloc.current_rate_bps as of the moment of insert (first-writer-wins under §1.2.1 rate-reset rule)."
    constants: {}
    precision: "Integer basis points; no rounding because all inputs are integers."

  - name: minimum_payment_due_cents
    trigger: "Read-only computation surfaced by GET /helocs/{id} as data.minimum_payment_due_cents, and used as the floor for POST /helocs/{id}/payments (see validations priority 24)."
    algorithm: forward_looking
    formula: |
      # Inputs: Heloc.status, Heloc.principal_balance_cents,
      #         Heloc.accrued_interest_cents, Heloc.current_rate_bps,
      #         Heloc.repayment_period_end_date, current clock time T.
      if Heloc.status == DRAW:
          # Interest-only minimum: just the accrued interest carried since last billing cycle reset.
          return Heloc.accrued_interest_cents
      elif Heloc.status == REPAY:
          # Standard amortizing monthly payment, computed once per call using months remaining.
          months_remaining = ceil((Heloc.repayment_period_end_date - T) / 30 days)
          if months_remaining <= 0:
              return Heloc.principal_balance_cents + Heloc.accrued_interest_cents
          monthly_rate = Heloc.current_rate_bps / 10000 / 12          # decimal monthly rate
          if monthly_rate == 0:
              monthly_pi = Heloc.principal_balance_cents / months_remaining
          else:
              monthly_pi = Heloc.principal_balance_cents * monthly_rate / (1 - (1 + monthly_rate) ** -months_remaining)
          return round_half_up(monthly_pi + Heloc.accrued_interest_cents)
      elif Heloc.status == DEFAULT:
          # Full payoff demand.
          return Heloc.principal_balance_cents + Heloc.accrued_interest_cents
      else:  # PENDING or CLOSED
          return 0
    input_set: "Single Heloc row; no cross-entity reads."
    constants:
      DAYS_PER_MONTH: 30
    precision: "Cents, integer. Final result rounded half-up to whole cents."
    variants:
      - name: interest_only_draw
        when: "Heloc.status == DRAW"
        difference: "Returns Heloc.accrued_interest_cents only; no principal repayment required."
      - name: amortizing_repay
        when: "Heloc.status == REPAY"
        difference: "Standard mortgage amortization formula on principal_balance_cents over months_remaining at current_rate_bps, plus accrued interest."

  - name: payment_split
    trigger: "On every POST /helocs/{id}/payments that creates a Payment (side effect: updates Heloc.principal_balance_cents, Heloc.accrued_interest_cents, Heloc.updated_at; bumps Heloc.version)."
    algorithm: waterfall_allocation
    formula: |
      # Inputs: Payment.amount_cents, Heloc.accrued_interest_cents (pre-payment).
      interest_component = min(Payment.amount_cents, Heloc.accrued_interest_cents)
      principal_component = Payment.amount_cents - interest_component
      # Step 1: settle interest bucket.
      Heloc.accrued_interest_cents -= interest_component
      # Step 2: settle principal bucket (cannot go negative).
      Heloc.principal_balance_cents = max(0, Heloc.principal_balance_cents - principal_component)
      return (interest_component, principal_component)
    input_set: "Single Payment; reads pre-payment Heloc.accrued_interest_cents and Heloc.principal_balance_cents."
    constants: {}
    precision: "Cents, integer; no rounding (waterfall over integer inputs)."

  - name: billing_cycle_accrual_and_delinquency
    trigger: "POST /_sweep/billing-cycle (testing endpoint, idempotent per (heloc_id, cycle_index) pair). Each invocation advances every active Heloc by ONE 30-day cycle from its last_cycle_end_date (initial value = origination_date)."
    algorithm: chronological
    formula: |
      # For every Heloc with status IN {DRAW, REPAY}:
      #   1. Accrue interest for the cycle:
      #        cycle_interest = round_half_up(
      #            Heloc.principal_balance_cents * Heloc.current_rate_bps / 10000 * 30 / 365 )
      #        Heloc.accrued_interest_cents += cycle_interest
      #   2. Recompute minimum_payment_due_cents for the new cycle (using calculation above).
      #   3. Sum cents paid since last_cycle_end_date: paid = sum(Payment.amount_cents WHERE posted_at IN (last_cycle_end_date, last_cycle_end_date + 30 days]).
      #   4. If paid >= prior_cycle_minimum_payment_due_cents: Heloc.delinquency_days = 0.
      #      Else:                                              Heloc.delinquency_days += 30.
      #   5. Advance Heloc.last_cycle_end_date by 30 days.
      #
      # AFTER step 4, check default triggers (this is where DELINQUENCY_90 fires):
      #   if Heloc.delinquency_days >= 90 and Heloc.status IN {DRAW, REPAY}:
      #       record DefaultEvent with trigger=DELINQUENCY_90 and transition Heloc to DEFAULT.
      #
      # AFTER cycle accrual, also check for period rollover:
      #   if Heloc.status == DRAW and current clock time >= Heloc.draw_period_end_date:
      #       transition Heloc DRAW -> REPAY.
    input_set: "All Helocs with status IN {DRAW, REPAY} at sweep time; ordered by id ascending for deterministic cascade."
    constants:
      DAYS_PER_CYCLE: 30
      DAYS_PER_YEAR_ACCRUAL: 365
    precision: "Cents, integer, round_half_up on cycle_interest before summing into accrued_interest_cents."

  - name: annual_fee_assessment
    trigger: "POST /_sweep/annual-fees (testing endpoint, idempotent per (heloc_id, anniversary_index)). For each Heloc, if current clock time >= origination_date + 365 * anniversary_index days AND no Fee exists for (heloc_id, fee_type=ANNUAL, anniversary_index), insert one."
    algorithm: threshold
    formula: |
      # For each (Heloc, anniversary_index n >= 1):
      if Heloc.status IN {DEFAULT, CLOSED}:
          # Suppressed: no Fee created.
          return None
      if n == 1 and Heloc.annual_fee_waived_first_year == true:
          insert Fee(fee_type=ANNUAL, amount_cents=0, status=WAIVED)
      else:
          insert Fee(fee_type=ANNUAL, amount_cents=Heloc.annual_fee_cents, status=ASSESSED)
    input_set: "All Helocs whose origination_date + 365 days <= clock time at sweep, restricted to status IN {DRAW, REPAY}."
    constants:
      ANNIVERSARY_DAYS: 365
    precision: "Integer cents; no arithmetic, fixed amount per fee."

  - name: early_closure_fee_assessment
    trigger: "Side effect of any close transition (Heloc.status -> CLOSED)."
    algorithm: threshold
    formula: |
      # Inputs: Heloc.closed_at (server clock at close), Heloc.origination_date,
      #         Heloc.early_closure_fee_cents.
      tenure_days = (Heloc.closed_at - Heloc.origination_date) in whole days
      if tenure_days < 1095 and Heloc.early_closure_fee_cents > 0:
          insert Fee(fee_type=EARLY_CLOSURE,
                     amount_cents=Heloc.early_closure_fee_cents,
                     status=ASSESSED)
      else:
          # No fee assessed.
          return None
    input_set: "Single Heloc at close time."
    constants:
      EARLY_CLOSURE_WINDOW_DAYS: 1095
    precision: "Integer cents."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  # ---- Authentication / Authorization ----
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty."
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role matches an entry in the RBAC matrix."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Acting role authorized for the endpoint per §1.7."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "For Borrower-acting role: X-User-ID equals Heloc.borrower_id (or Property.borrower_id) of the target resource for borrower-scoped reads."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "GET /helocs/{id}, GET /helocs/{id}/payments, GET /helocs/{id}/draws, GET /helocs/{id}/rate-resets, GET /helocs/{id}/fees, GET /helocs/{id}/default-events, GET /properties/{id}, GET /borrowers/{id}"

  - priority: 5
    category: auth
    check: "Segregation of duties: an Originator may not perform any Servicer-only endpoint, even if the same individual is registered under both roles."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "All Servicer-exclusive endpoints (close, insurance-events, default-events, bankruptcy-events, sweep, clock advance)."

  # ---- Existence (left-to-right path resolution) ----
  - priority: 6
    category: existence
    check: "Path parent resources exist in order: /borrowers/{id} -> Borrower, /properties/{id} -> Property, /senior-liens/{id} -> SeniorLien, /helocs/{id} -> Heloc; first missing yields the matching error."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 7
    category: existence
    check: "Body foreign keys reference existing resources: Heloc.borrower_id -> Borrower, Heloc.property_id -> Property, Draw.heloc_id -> Heloc, etc."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /helocs, POST /properties, POST /senior-liens, POST /helocs/{id}/draws, POST /helocs/{id}/payments, POST /helocs/{id}/rate-resets"

  # ---- State preconditions ----
  - priority: 10
    category: state
    check: "Activation requires Heloc.status == PENDING."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /helocs/{id}/activate"

  - priority: 11
    category: state
    check: "Close requires Heloc.status IN {DRAW, REPAY, DEFAULT}."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /helocs/{id}/close"

  - priority: 12
    category: state
    check: "Draw creation requires Heloc.status == DRAW."
    error_id: ERR_HELOC_DEFAULTED
    http_status: 409
    applies_to: "POST /helocs/{id}/draws"
    # If status is DEFAULT we return ERR_HELOC_DEFAULTED;
    # if status is REPAY/CLOSED we return the more specific code from priorities 13/14.

  - priority: 13
    category: state
    check: "Draw creation requires NOT REPAY (no new draws in repayment period)."
    error_id: ERR_DRAW_PERIOD_ENDED
    http_status: 409
    applies_to: "POST /helocs/{id}/draws"

  - priority: 14
    category: state
    check: "Mutation on a CLOSED Heloc is forbidden."
    error_id: ERR_HELOC_CLOSED
    http_status: 409
    applies_to: "POST /helocs/{id}/draws, POST /helocs/{id}/payments, POST /helocs/{id}/rate-resets, POST /helocs/{id}/close"

  - priority: 15
    category: state
    check: "RateReset on Heloc.status IN {PENDING, CLOSED} is forbidden (allowed in DRAW, REPAY, DEFAULT)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /helocs/{id}/rate-resets"

  - priority: 16
    category: state
    check: "InsuranceEvent of event_type=LAPSE requires Property.insurance_status == ACTIVE; REINSTATE requires LAPSED."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /properties/{id}/insurance-events"

  - priority: 17
    category: state
    check: "BankruptcyEvent requires Borrower.bankruptcy_flag == false."
    error_id: ERR_ALREADY_BANKRUPT
    http_status: 409
    applies_to: "POST /borrowers/{id}/bankruptcy-events"

  - priority: 18
    category: state
    check: "SeniorLienDefaultEvent requires SeniorLien.status == CURRENT."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /senior-liens/{id}/default-events"

  # ---- Business: safety / compliance (lien position, occupancy, KYC) ----
  - priority: 20
    category: business_safety
    check: "Heloc creation requires Property.occupancy == PRIMARY."
    error_id: ERR_OCCUPANCY_NOT_PRIMARY
    http_status: 422
    applies_to: "POST /helocs"

  - priority: 21
    category: business_safety
    check: "Heloc creation requires at least one existing SeniorLien on the same Property with status == CURRENT (this is the 2nd-lien position rule)."
    error_id: ERR_NO_SENIOR_LIEN
    http_status: 422
    applies_to: "POST /helocs"

  - priority: 22
    category: business_safety
    check: "Heloc creation requires Borrower.bankruptcy_flag == false."
    error_id: ERR_BORROWER_BANKRUPT
    http_status: 422
    applies_to: "POST /helocs"

  - priority: 23
    category: business_safety
    check: "Property.appraised_value_cents must exceed SeniorLien.principal_balance_cents + requested Heloc.credit_limit_cents (combined-loan-to-value <= 100% at origination); else origination is rejected."
    error_id: ERR_CLTV_EXCEEDED
    http_status: 422
    applies_to: "POST /helocs, POST /helocs/{id}/activate"

  # ---- Business: temporal ----
  - priority: 24
    category: business_temporal
    check: "Payment amount_cents must be >= minimum_payment_due_cents at request time."
    error_id: ERR_PAYMENT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /helocs/{id}/payments"

  - priority: 25
    category: business_temporal
    check: "Periodic cap: requested_rate_bps - current_rate_bps may exceed periodic_cap_bps; in that case applied_rate_bps is clamped and the request still succeeds (recorded in RateReset.applied_rate_bps != requested_rate_bps). This is informational — NO validation error is raised; the clamping is silent but recorded."
    error_id: null
    http_status: null
    applies_to: "POST /helocs/{id}/rate-resets"

  # ---- Business: referential ----
  - priority: 26
    category: business_referential
    check: "Heloc.property_id and Heloc.borrower_id must refer to the same Borrower (Property.borrower_id == Heloc.borrower_id)."
    error_id: ERR_BORROWER_PROPERTY_MISMATCH
    http_status: 422
    applies_to: "POST /helocs"

  # ---- Business: fiscal / capacity (LAST) ----
  - priority: 30
    category: business_fiscal
    check: "Draw amount_cents <= Heloc.available_credit_cents at request time."
    error_id: ERR_INSUFFICIENT_AVAILABLE_CREDIT
    http_status: 422
    applies_to: "POST /helocs/{id}/draws"

  - priority: 31
    category: business_fiscal
    check: "Close requires Heloc.principal_balance_cents == 0 AND Heloc.accrued_interest_cents == 0."
    error_id: ERR_BALANCE_NOT_ZERO
    http_status: 422
    applies_to: "POST /helocs/{id}/close"

  - priority: 32
    category: business_fiscal
    check: "Heloc.credit_limit_cents within [1000000, 50000000]; margin_bps within [0, 1000]; periodic_cap_bps within (0, 500]; lifetime_cap_bps > initial_rate_bps + periodic_cap_bps and <= 2500; lifetime_floor_bps < initial_rate_bps."
    error_id: ERR_RATE_BOUND_INVALID
    http_status: 422
    applies_to: "POST /helocs"

  - priority: 33
    category: business_fiscal
    check: "OCC: when request body includes `version`, Heloc.version must equal it."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "POST /helocs/{id}/payments, POST /helocs/{id}/draws, POST /helocs/{id}/rate-resets, POST /helocs/{id}/close, POST /helocs/{id}/activate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Borrower ----
  - method: POST
    path: "/borrowers"
    description: "Register a borrower."
    roles: [Originator, PlatformAdmin]
    code: 201
    input: [full_name, email]
    output: Borrower
    side_effects: []

  - method: GET
    path: "/borrowers/{id}"
    description: "Fetch a borrower."
    roles: [Originator, Servicer, Borrower, PlatformAdmin]
    code: 200
    input: []
    output: Borrower
    side_effects: []

  - method: POST
    path: "/borrowers/{id}/bankruptcy-events"
    description: "Record a bankruptcy filing for the borrower; cascades to default any DRAW/REPAY Helocs."
    roles: [Servicer, PlatformAdmin]
    code: 201
    input: []
    output: BankruptcyEvent
    side_effects:
      - "Borrower.bankruptcy_flag -> true; Borrower.bankruptcy_filed_at -> server clock"
      - "Every Heloc with borrower_id == path id AND status IN {DRAW, REPAY}: DRAW/REPAY -> DEFAULT with default_trigger = BANKRUPTCY"

  # ---- Property ----
  - method: POST
    path: "/properties"
    description: "Register a property owned by a borrower."
    roles: [Originator, PlatformAdmin]
    code: 201
    input: ["borrower_id", "address", "appraised_value_cents", "occupancy?"]
    output: Property
    side_effects: []

  - method: GET
    path: "/properties/{id}"
    description: "Fetch a property."
    roles: [Originator, Servicer, Borrower, PlatformAdmin]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: POST
    path: "/properties/{id}/insurance-events"
    description: "Record an insurance status change (LAPSE or REINSTATE); LAPSE cascades to default any DRAW/REPAY Helocs on the property."
    roles: [Servicer, PlatformAdmin]
    code: 201
    input: [event_type]
    output: InsuranceEvent
    side_effects:
      - "If event_type=LAPSE: Property.insurance_status -> LAPSED; cascade Helocs on this property to DEFAULT with default_trigger = INSURANCE_LAPSE"
      - "If event_type=REINSTATE: Property.insurance_status -> ACTIVE; DEFAULTed Helocs are NOT reactivated"

  # ---- SeniorLien ----
  - method: POST
    path: "/senior-liens"
    description: "Register a senior lien against a property."
    roles: [Originator, PlatformAdmin]
    code: 201
    input: [property_id, holder_name, principal_balance_cents]
    output: SeniorLien
    side_effects: []

  - method: GET
    path: "/senior-liens/{id}"
    description: "Fetch a senior lien."
    roles: [Originator, Servicer, Borrower, PlatformAdmin]
    code: 200
    input: []
    output: SeniorLien
    side_effects: []

  - method: POST
    path: "/senior-liens/{id}/default-events"
    description: "Declare the senior lien in default; cascades to default any DRAW/REPAY Helocs on the same property."
    roles: [Servicer, PlatformAdmin]
    code: 201
    input: []
    output: SeniorLienDefaultEvent
    side_effects:
      - "SeniorLien.status -> DEFAULTED; SeniorLien.defaulted_at -> server clock"
      - "Cascade Helocs on this property to DEFAULT with default_trigger = SENIOR_LIEN_DEFAULT"

  # ---- Heloc ----
  - method: POST
    path: "/helocs"
    description: "Create a HELOC in PENDING status. Validates 2nd-lien, occupancy, CLTV, bankruptcy gates."
    roles: [Originator, PlatformAdmin]
    code: 201
    input: ["borrower_id", "property_id", "credit_limit_cents", "margin_bps", "periodic_cap_bps", "lifetime_cap_bps", "lifetime_floor_bps", "repayment_term_years", "annual_fee_cents", "annual_fee_waived_first_year?", "early_closure_fee_cents"]
    output: Heloc
    side_effects: []

  - method: GET
    path: "/helocs/{id}"
    description: "Fetch a HELOC including computed minimum_payment_due_cents, available_credit_cents, and current_rate_bps."
    roles: [Originator, Servicer, Borrower, PlatformAdmin]
    code: 200
    input: []
    output: Heloc
    side_effects: []

  - method: GET
    path: "/helocs"
    description: "List HELOCs filtered by borrower_id, property_id, status (any combination)."
    roles: [Originator, Servicer, PlatformAdmin]
    code: 200
    input: ["borrower_id?", "property_id?", "status?", "limit?", "offset?"]
    output: "Heloc[]"
    side_effects: []

  - method: POST
    path: "/helocs/{id}/activate"
    description: "Activate a PENDING HELOC into DRAW state using a supplied prime_rate_bps."
    roles: [Originator, PlatformAdmin]
    code: 200
    input: ["prime_rate_bps", "version?"]
    output: Heloc
    side_effects:
      - "PENDING -> DRAW; sets origination_date, draw_period_end_date, repayment_period_end_date, initial_rate_bps, current_rate_bps, available_credit_cents"

  - method: POST
    path: "/helocs/{id}/close"
    description: "Close a HELOC; assesses an early-closure Fee if within 1095 days of origination."
    roles: [Servicer, Borrower, PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Heloc
    side_effects:
      - "Heloc.status -> CLOSED; Heloc.closed_at -> server clock"
      - "If (closed_at - origination_date) < 1095 days AND early_closure_fee_cents > 0: Fee(EARLY_CLOSURE, ASSESSED) created"

  - method: POST
    path: "/helocs/{id}/draws"
    description: "Take a draw against the line (only while status == DRAW)."
    roles: [Borrower, PlatformAdmin]
    code: 201
    input: ["amount_cents", "version?"]
    output: Draw
    side_effects:
      - "Heloc.principal_balance_cents += amount_cents; Heloc.available_credit_cents -= amount_cents"

  - method: GET
    path: "/helocs/{id}/draws"
    description: "List draws on a HELOC."
    roles: [Originator, Servicer, Borrower, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Draw[]"
    side_effects: []

  - method: POST
    path: "/helocs/{id}/payments"
    description: "Apply a payment; allocated interest-first then principal (waterfall)."
    roles: [Borrower, Servicer, PlatformAdmin]
    code: 201
    input: ["amount_cents", "version?"]
    output: Payment
    side_effects:
      - "payment_split calculation runs; Heloc.accrued_interest_cents and Heloc.principal_balance_cents updated"

  - method: GET
    path: "/helocs/{id}/payments"
    description: "List payments on a HELOC."
    roles: [Originator, Servicer, Borrower, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  - method: POST
    path: "/helocs/{id}/rate-resets"
    description: "Record a rate reset given a quoted prime_rate_bps; periodic/lifetime caps applied silently."
    roles: [Servicer, PlatformAdmin]
    code: 201
    input: ["prime_rate_bps", "version?"]
    output: RateReset
    side_effects:
      - "Heloc.current_rate_bps -> RateReset.applied_rate_bps (after periodic + lifetime clamping)"

  - method: GET
    path: "/helocs/{id}/rate-resets"
    description: "List rate resets on a HELOC."
    roles: [Originator, Servicer, Borrower, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "RateReset[]"
    side_effects: []

  - method: GET
    path: "/helocs/{id}/fees"
    description: "List fees (ANNUAL, EARLY_CLOSURE) on a HELOC."
    roles: [Originator, Servicer, Borrower, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Fee[]"
    side_effects: []

  - method: GET
    path: "/helocs/{id}/default-events"
    description: "List default events on a HELOC."
    roles: [Originator, Servicer, Borrower, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "DefaultEvent[]"
    side_effects: []

  # ---- Testing endpoints (required by §1.5 testability-completeness) ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server's logical clock by N seconds. Required so tests can reach time-gated states (10-year draw period rollover, 365-day anniversary fees, 1095-day early-closure window, 90-day delinquency)."
    roles: [PlatformAdmin]
    code: 200
    input: [seconds]
    output: "{ current_time: ISO8601 }"
    side_effects:
      - "Advances global clock used by every server-clock read; does NOT trigger any sweep on its own."

  - method: POST
    path: "/_sweep/billing-cycle"
    description: "Run one 30-day billing cycle for all Helocs in {DRAW, REPAY}: accrue interest, recompute delinquency, fire DELINQUENCY_90 defaults, and roll DRAW->REPAY when draw_period_end_date has passed. Idempotent per (heloc_id, cycle_index)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ cycles_run: integer, defaults_triggered: integer }"
    side_effects:
      - "Updates Heloc.accrued_interest_cents, Heloc.delinquency_days, Heloc.last_cycle_end_date, Heloc.status (rollover or default), creates DefaultEvent(DELINQUENCY_90) as needed"

  - method: POST
    path: "/_sweep/annual-fees"
    description: "Assess any due ANNUAL fees on all Helocs. Idempotent per (heloc_id, anniversary_index). Suppressed on Helocs in {DEFAULT, CLOSED}; first anniversary records WAIVED if annual_fee_waived_first_year=true."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ fees_created: integer }"
    side_effects:
      - "Creates Fee records of type ANNUAL"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH
    http: 401
    condition: "X-User-Role or X-User-ID header missing/empty."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not a recognized role."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for this endpoint, or borrower-scoped read of someone else's resource."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Originator role attempted a Servicer-exclusive operation (or vice versa where applicable)."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Referenced resource (path segment or foreign key in body) does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Operation not allowed in the resource's current state."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Supplied version does not equal current Heloc.version."
  - id: ERR_HELOC_DEFAULTED
    http: 409
    condition: "Cannot draw or rate-reset against a Heloc in DEFAULT (specific case of state error)."
  - id: ERR_HELOC_CLOSED
    http: 409
    condition: "Cannot mutate a Heloc in CLOSED."
  - id: ERR_DRAW_PERIOD_ENDED
    http: 409
    condition: "Draw attempted on a Heloc already in REPAY."
  - id: ERR_ALREADY_BANKRUPT
    http: 409
    condition: "Bankruptcy filing recorded on a borrower already flagged bankrupt."
  - id: ERR_BALANCE_NOT_ZERO
    http: 422
    condition: "Close attempted while principal_balance_cents > 0 or accrued_interest_cents > 0."
  - id: ERR_OCCUPANCY_NOT_PRIMARY
    http: 422
    condition: "Heloc requires Property.occupancy == PRIMARY."
  - id: ERR_NO_SENIOR_LIEN
    http: 422
    condition: "Heloc requires an existing SeniorLien with status == CURRENT on the Property (2nd-lien rule)."
  - id: ERR_BORROWER_BANKRUPT
    http: 422
    condition: "Heloc origination requires Borrower.bankruptcy_flag == false."
  - id: ERR_CLTV_EXCEEDED
    http: 422
    condition: "appraised_value_cents <= SeniorLien.principal_balance_cents + requested credit_limit_cents."
  - id: ERR_BORROWER_PROPERTY_MISMATCH
    http: 422
    condition: "Heloc.property_id refers to a Property whose borrower_id != Heloc.borrower_id."
  - id: ERR_PAYMENT_BELOW_MINIMUM
    http: 422
    condition: "Payment.amount_cents < minimum_payment_due_cents at request time."
  - id: ERR_RATE_BOUND_INVALID
    http: 422
    condition: "Configured rate bounds violate ordering (e.g. lifetime_cap_bps <= initial_rate_bps + periodic_cap_bps; lifetime_floor_bps >= initial_rate_bps)."
  - id: ERR_INSUFFICIENT_AVAILABLE_CREDIT
    http: 422
    condition: "Draw amount_cents > current available_credit_cents."
  - id: ERR_VALIDATION_FAILED
    http: 400
    condition: "Generic field-shape validation failure (missing required body field, wrong type, negative amount, etc.)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Originator
    description: "Sales/onboarding role; sets up Borrowers, Properties, SeniorLiens, and creates PENDING HELOCs. Cannot service or close accounts."
    identity: "opaque"
    exclusive_operations:
      - "POST /helocs (create PENDING)"
      - "POST /helocs/{id}/activate"
    shared_operations:
      - "POST /borrowers (with PlatformAdmin)"
      - "POST /properties (with PlatformAdmin)"
      - "POST /senior-liens (with PlatformAdmin)"
      - "GET endpoints on Borrower, Property, SeniorLien, Heloc, and child collections (with Servicer/Borrower/PlatformAdmin)"

  - name: Servicer
    description: "Operational role that handles in-life servicing: payments, rate resets, insurance/senior-lien/bankruptcy events, close, and may be assisted by sweep endpoints triggered by PlatformAdmin. May NOT originate."
    identity: "opaque"
    exclusive_operations:
      - "POST /helocs/{id}/rate-resets"
      - "POST /helocs/{id}/close"
      - "POST /properties/{id}/insurance-events"
      - "POST /senior-liens/{id}/default-events"
      - "POST /borrowers/{id}/bankruptcy-events"
    shared_operations:
      - "POST /helocs/{id}/payments (with Borrower, PlatformAdmin)"
      - "GET endpoints (with Originator/Borrower/PlatformAdmin)"

  - name: Borrower
    description: "End-user role; reads their own Helocs and child collections, takes draws, makes payments, may close their own Heloc. X-User-ID equals Borrower.id."
    identity: "entity_backed:Borrower"
    exclusive_operations: []
    shared_operations:
      - "POST /helocs/{id}/draws (with PlatformAdmin)"
      - "POST /helocs/{id}/payments (with Servicer, PlatformAdmin)"
      - "POST /helocs/{id}/close (with Servicer, PlatformAdmin)"
      - "GET /borrowers/{id}, GET /properties/{id}, GET /senior-liens/{id}, GET /helocs, GET /helocs/{id} and child collections (only when X-User-ID matches the resource's borrower_id chain)"

  - name: PlatformAdmin
    description: "Operator superuser; can call every endpoint including the testing endpoints /_clock/advance, /_sweep/billing-cycle, /_sweep/annual-fees. Used by tests to advance time and run sweeps."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/advance"
      - "POST /_sweep/billing-cycle"
      - "POST /_sweep/annual-fees"
    shared_operations:
      - "All other endpoints (with the role(s) listed above)."
