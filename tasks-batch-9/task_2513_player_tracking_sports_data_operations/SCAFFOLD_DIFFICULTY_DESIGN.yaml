              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { g_id: $.data.id }
            - call: "POST /games/${g_id}/rights-windows"
              payload: { rights_class: "BROADCAST_LIVE", holder_type: "LEAGUE", territory: "US", window_start_utc: "2026-08-01T18:00:00Z", window_end_utc: "2026-08-01T21:00:00Z", max_latency_ms: 400, allowed_scopes: ["POSITIONAL", "EVENT"] }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { rw_base: $.data.id, alloc_base: $.data.allocated_minutes }
          trigger:
            - call: "POST /games/${g_id}/rights-windows"
              payload: { rights_class: "BROADCAST_LIVE", holder_type: "LEAGUE", territory: "US", window_start_utc: "2026-08-01T21:10:00Z", window_end_utc: "2026-08-01T21:34:00Z", max_latency_ms: 400, allowed_scopes: ["POSITIONAL"] }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /games/${g_id}/rights-windows"
              payload: { rights_class: "BROADCAST_LIVE", holder_type: "LEAGUE", territory: "US", window_start_utc: "2026-08-01T21:10:01Z", window_end_utc: "2026-08-01T21:34:01Z", max_latency_ms: 400, allowed_scopes: ["POSITIONAL"] }
              as: LeagueDataOps
