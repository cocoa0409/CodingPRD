            - "load_5 == 19000 (shipment withdrew 6000 oldest-first)"
            - "p2_status == WITHDRAWN and p2_wd == 5000 (oldest placement drained first)"
            - "p3_wd == 1000 (remainder taken from the next-oldest)"
      - name: crew_capacity_conserved_across_assign_release
        grounds:
          - calculations.crew_daily_load
          - state_machines.CrewAssignment.SCHEDULED_to_RELEASED
          - validations[priority=24]
        distinguishing_aspect: |
          Conserved quantity: crew capacity-days (different quantity from stored seedlings). For every date,
          capacity_per_day == free_capacity + SUM(daily_load over SCHEDULED/CONFIRMED assignments covering
          the date); assigning 20000 over 4 days consumes all 5000/day, and releasing restores the full
          5000 so an identical assignment succeeds afterwards.
        test_recipe:
          setup:
            - "Crew capacity 5000/day; contract C1 exists (DRAFT)"
          setup_api_calls:
            - { call: "POST /reforestation/seed-zones", payload: { zone_code: "Z-DST", min_elevation_ft: 1400, max_elevation_ft: 2400 }, as: NurseryManager, captures: { z_dst: $.data.id } }
