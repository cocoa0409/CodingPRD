      - name: blank_contamination_four_hop_cascade
        grounds:
          - state_machines.FieldSample.ANALYZED_to_INVALIDATED
          - state_machines.SamplingPlan.LAB_COMPLETE_to_APPROVED
          - state_machines.ExposureAssessment
          - calculations.plan_sample_accounting
        distinguishing_aspect: |
          Depth-4 chain from ONE trigger (blank result entry): LabResult -> LabBatch.contaminated
          -> every ANALYZED sibling FieldSample INVALIDATED (BLANK_CONTAMINATION) -> SamplingPlan
          LAB_COMPLETE->APPROVED (analyzed_valid 0 < required 3) -> DRAFT ExposureAssessment VOID.
          Each hop is caused by the previous hop, not by the original request.
        test_recipe:
          setup:
            - "SEG H=3 plan with 3 PERSONAL samples (masses 12,10,8 ug) ANALYZED and plan LAB_COMPLETE; one FIELD_BLANK SEALED in the same batch (LOD 5)"
            - "DRAFT assessment created from the LAB_COMPLETE plan"
