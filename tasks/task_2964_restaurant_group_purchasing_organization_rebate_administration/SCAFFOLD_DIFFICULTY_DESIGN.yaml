  - rule_id: transitive_cascade
    instances:

      - name: dispute_upheld_four_hop_ledger_and_posture_cascade
        grounds:
          - state_machines.RebateDispute.OPEN_to_UPHELD
          - state_machines.RebateAccrual.DISPUTED_to_REVERSED
          - state_machines.Member.reconciliation_posture
          - entities.Member.fields.dispute_reversal_count
          - entities.PurchaseBatch.fields.payout_hold
          - endpoints["POST /disputes/{dispute_id}/decide"]
        distinguishing_aspect: |
          Cascade origin = a dispute decision, and the chain runs through four
          DIFFERENT entities: dispute (UPHELD) -> accrual (REVERSED) -> member
          money counters and dispute_reversal_count -> member posture RESTRICTED
          plus payout_hold, which in turn re-enters PurchaseBatch.payout_hold.
          Hop 4 only fires because the tier's reversal_posture_limit is 1, so the
          test proves the cascade depth is threshold-gated rather than automatic.
