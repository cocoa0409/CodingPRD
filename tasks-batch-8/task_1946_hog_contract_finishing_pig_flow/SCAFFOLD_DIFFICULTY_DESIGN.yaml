# =============================================================================
# Task 1946 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. Every recipe replays from empty DB.
# Shared fixture: contract terms base 4000c/head, bonus cap 1200c/head,
# fcr_target 2.60, adg_target 1.90, mortality_threshold 5.00, feed 650 lbs/head,
# splits structural 100 / equipment 50 / routine 0, window 2026-01-01..2026-12-31.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------- rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_divergence
        grounds:
          - calculations.settlement_pay
          - calculations.performance_bonus
          - calculations.performance_metrics
        distinguishing_aspect: |
          Entity domain = Settlement pay. The PROVISIONAL variant (preview, blends actuals
          with 1.85 lbs/day x PROJ_FCR 2.70 projection for the 580 unmarketed head) yields
          bonus 360000 / total 4360000, while the FINAL variant on the same group after
          close yields bonus 600000 / total 4600000 — different money from one dataset.
        test_recipe:
          setup:
            - "Contract A (terms above) ACTIVE on Site S with Barn B1 (capacity 1200, 9600 sqft)"
            - "Group G1 placed 2026-03-02, 1000 head @ 50.0 lbs, target 2026-07-13"
            - "Mortality/culls: single report (15 dead, 5 culled); feed delivered 520000 lbs total (220000 STARTER + 300000 GROWER)"
            - "Load L1: 400 head DELIVERED on slot 2026-06-10 (window 230-300), scale 110000 lbs"
            - "Clock at 2026-06-15 for the preview; then load L2 closes the group on 2026-07-13"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "GET /barns/${barn_id}", payload: {}, as: IntegratorAdmin, captures: { barn_v: $.data.version } }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "STARTER", diet_code: "ST-1", quantity_lbs: 220000, requested_delivery_date: "2026-03-05" }, as: FieldTech, captures: { fo1: $.data.id } }
            - { call: "POST /feed-orders/${fo1}/schedule", payload: { scheduled_delivery_date: "2026-03-05" }, as: FeedMill }
            - { call: "POST /feed-orders/${fo1}/deliver", payload: { delivered_lbs: 220000 }, as: FeedMill }
            - { call: "POST /pig-groups/${group_id}/advance-phase", payload: {}, as: FieldTech }
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "GROWER", diet_code: "GR-1", quantity_lbs: 300000, requested_delivery_date: "2026-04-20" }, as: FieldTech, captures: { fo2: $.data.id } }
            - { call: "POST /feed-orders/${fo2}/schedule", payload: { scheduled_delivery_date: "2026-04-20" }, as: FeedMill }
            - { call: "POST /feed-orders/${fo2}/deliver", payload: { delivered_lbs: 300000 }, as: FeedMill }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-10T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/mortality-reports", payload: { report_date: "2026-04-10", mortality_count: 15, cull_count: 5, reason_code: "DISEASE" }, as: Grower, as_user_id: "${grower_id}" }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-06-10", shift: "AM", capacity_head: 1000, min_weight_lbs: 230, max_weight_lbs: 300 }, as: IntegratorAdmin, captures: { slot1: $.data.id, slot1_v: $.data.version } }
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slot1}", head_count: 400, expected_slot_version: "${slot1_v}" }, as: FieldTech, captures: { load1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-09T08:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /truck-washes", payload: { truck_code: "T-1", washed_at: "2026-06-09T08:00:00Z", wash_type: "FULL_DISINFECT" }, as: TransportCoordinator, as_user_id: "tc_1", captures: { wash1: $.data.id } }
            - { call: "POST /truck-washes/${wash1}/verify", payload: {}, as: IntegratorAdmin, as_user_id: "adm_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /market-loads/${load1}/dispatch", payload: { truck_wash_id: "${wash1}" }, as: TransportCoordinator }
            - { call: "POST /market-loads/${load1}/deliver", payload: { live_weight_lbs_total: 110000 }, as: TransportCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "GET /pig-groups/${group_id}/settlement-preview", payload: {}, as: FieldTech, captures: { prov_total: $.data.total_pay_cents, prov_bonus: $.data.bonus_cents, prov_fcr: $.data.fcr, prov_adg: $.data.adg_lbs } }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-07-13", shift: "AM", capacity_head: 1000, min_weight_lbs: 240, max_weight_lbs: 310 }, as: IntegratorAdmin, captures: { slot2: $.data.id, slot2_v: $.data.version } }
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slot2}", head_count: 580, expected_slot_version: "${slot2_v}" }, as: FieldTech, captures: { load2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-11T08:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /truck-washes", payload: { truck_code: "T-2", washed_at: "2026-07-11T08:00:00Z", wash_type: "FULL_DISINFECT" }, as: TransportCoordinator, as_user_id: "tc_1", captures: { wash2: $.data.id } }
            - { call: "POST /truck-washes/${wash2}/verify", payload: {}, as: IntegratorAdmin, as_user_id: "adm_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-12T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /market-loads/${load2}/dispatch", payload: { truck_wash_id: "${wash2}" }, as: TransportCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-13T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /market-loads/${load2}/deliver", payload: { live_weight_lbs_total: 168200 }, as: TransportCoordinator }
          trigger:
            - { call: "GET /settlements", payload: { group_id: "${group_id}" }, as: IntegratorAdmin, captures: { sett_id: "$.data[0].id" } }
            - { call: "GET /settlements/${sett_id}", payload: {}, as: IntegratorAdmin }
          assert:
            - "Preview (PROVISIONAL): bonus_cents == 360000 (fcr 2.51 -> tier 0.60, adg 0.92 -> factor 0.5), total_pay_cents == 4360000, fcr == 2.51, adg_lbs == 0.92, mortality_pct == 1.5, head_projected_marketed == 980"
            - "Settlement (FINAL): base_pay_cents == 4000000, bonus_cents == 600000 (fcr 2.27 -> tier 1.00, adg 1.76 -> factor 0.5), deductions_cents == 0, adjustment_cents == 0, total_pay_cents == 4600000"
            - "FINAL total_pay_cents 4600000 != PROVISIONAL total_pay_cents 4360000 (same group, two valid algorithms)"
            - "Settlement.${sett_id}.settlement_status == FINALIZED and Settlement.fcr == 2.27 and Settlement.adg_lbs == 1.76"

      - name: feed_hard_cap_vs_phase_plan_divergence
        grounds:
          - calculations.feed_budget_gate
        distinguishing_aspect: |
          Entity domain = FeedOrder budget gating. With 280000 lbs already delivered of a
          650000 lbs budget, the hard_cap variant allows 370000 lbs more while the
          phase_plan variant allows only 5000 lbs more for GROWER — a 10000 lbs order is
          accepted (hard cap) yet flagged over_phase_plan=true (phase plan). Two valid
          budget algorithms on one order produce different allowable quantities.
        test_recipe:
          setup:
            - "Contract A ACTIVE; group placed 1000 head (feed budget 650000 lbs); phase plans: GROWER=195000"
            - "STARTER order 90000 delivered; phase advanced; GROWER order 190000 delivered"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "STARTER", diet_code: "ST-1", quantity_lbs: 90000, requested_delivery_date: "2026-03-05" }, as: FieldTech, captures: { fo1: $.data.id } }
            - { call: "POST /feed-orders/${fo1}/schedule", payload: { scheduled_delivery_date: "2026-03-05" }, as: FeedMill }
            - { call: "POST /feed-orders/${fo1}/deliver", payload: { delivered_lbs: 90000 }, as: FeedMill }
            - { call: "POST /pig-groups/${group_id}/advance-phase", payload: {}, as: FieldTech }
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "GROWER", diet_code: "GR-1", quantity_lbs: 190000, requested_delivery_date: "2026-04-01" }, as: FieldTech, captures: { fo2: $.data.id } }
            - { call: "POST /feed-orders/${fo2}/schedule", payload: { scheduled_delivery_date: "2026-04-01" }, as: FeedMill }
            - { call: "POST /feed-orders/${fo2}/deliver", payload: { delivered_lbs: 190000 }, as: FeedMill }
          trigger:
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "GROWER", diet_code: "GR-1", quantity_lbs: 10000, requested_delivery_date: "2026-04-10" }, as: FieldTech, captures: { fo3: $.data.id } }
          assert:
            - "HTTP 201: order accepted — hard_cap remaining = 650000 - 280000 = 370000 >= 10000"
            - "FeedOrder.${fo3}.over_phase_plan == true — phase_plan remaining = 195000 - 190000 = 5000 < 10000"
            - "The two variants disagree on this order: hard_cap allows (370000 remaining), phase_plan is exceeded (5000 remaining)"
            - "PigGroup.${group_id}.cumulative_feed_lbs == 280000"

  # ---------------------------------------------------------------- rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: performance_bonus_tier_adg_gate_combo
        grounds:
          - calculations.performance_bonus
          - calculations.performance_metrics
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — FCR tier selection (4 branches)
          multiplied by the ADG conditional factor and gated by the mortality comparison;
          fcr 2.49 (<= target-0.10=2.50) selects tier 1.00, adg 1.77 < 1.90 halves it,
          mortality 4.00 <= 5.00 keeps it: 1200 * 1000 * 1.00 * 0.5 = 600000.
        test_recipe:
          setup:
            - "Contract A ACTIVE; group 1000 head @ 50.0 placed 2026-03-02, target 2026-07-13"
            - "Report (40 dead, 10 culled); 555000 lbs feed delivered; one rejected 100-head load (penalty 150000); one NEGLIGENCE ticket cost 30000 completed in occupancy window"
            - "Marketed 950 head @ 285 avg via two 475-head loads on 2026-07-13 (gain 223250, fcr 2.49, adg 1.77)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "STARTER", diet_code: "ST-1", quantity_lbs: 555000, requested_delivery_date: "2026-03-05" }, as: FieldTech, captures: { fo1: $.data.id } }
            - { call: "POST /feed-orders/${fo1}/schedule", payload: { scheduled_delivery_date: "2026-03-05" }, as: FeedMill }
            - { call: "POST /feed-orders/${fo1}/deliver", payload: { delivered_lbs: 555000 }, as: FeedMill }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/mortality-reports", payload: { report_date: "2026-03-15", mortality_count: 40, cull_count: 10, reason_code: "STRESS" }, as: Grower, as_user_id: "${grower_id}" }
            - { call: "POST /maintenance-tickets", payload: { barn_id: "${barn_id}", category: "EQUIPMENT", description: "feeder motor" }, as: Grower, as_user_id: "${grower_id}", captures: { tick: $.data.id } }
            - { call: "POST /maintenance-tickets/${tick}/quote", payload: { cost_cents: 30000, cause: "NEGLIGENCE" }, as: FieldTech, as_user_id: "ft_1" }
            - { call: "POST /maintenance-tickets/${tick}/approve", payload: {}, as: FieldTech, as_user_id: "ft_2" }
            - { call: "POST /maintenance-tickets/${tick}/start-work", payload: {}, as: FieldTech, as_user_id: "ft_2" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /maintenance-tickets/${tick}/complete", payload: {}, as: FieldTech, as_user_id: "ft_2" }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-07-06", shift: "AM", capacity_head: 500, min_weight_lbs: 240, max_weight_lbs: 300 }, as: IntegratorAdmin, captures: { slotR: $.data.id, slotR_v: $.data.version } }
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slotR}", head_count: 100, expected_slot_version: "${slotR_v}" }, as: FieldTech, captures: { loadR: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-05T08:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /truck-washes", payload: { truck_code: "T-R", washed_at: "2026-07-05T08:00:00Z", wash_type: "FULL_DISINFECT" }, as: TransportCoordinator, as_user_id: "tc_1", captures: { washR: $.data.id } }
            - { call: "POST /truck-washes/${washR}/verify", payload: {}, as: IntegratorAdmin, as_user_id: "adm_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-06T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /market-loads/${loadR}/dispatch", payload: { truck_wash_id: "${washR}" }, as: TransportCoordinator }
            - { call: "POST /market-loads/${loadR}/deliver", payload: { live_weight_lbs_total: 31000 }, as: TransportCoordinator }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-07-13", shift: "AM", capacity_head: 500, min_weight_lbs: 240, max_weight_lbs: 320 }, as: IntegratorAdmin, captures: { slotA: $.data.id, slotA_v: $.data.version } }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-07-13", shift: "PM", capacity_head: 500, min_weight_lbs: 240, max_weight_lbs: 320 }, as: IntegratorAdmin, captures: { slotB: $.data.id, slotB_v: $.data.version } }
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slotA}", head_count: 475, expected_slot_version: "${slotA_v}" }, as: FieldTech, captures: { loadA: $.data.id } }
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slotB}", head_count: 475, expected_slot_version: "${slotB_v}" }, as: FieldTech, captures: { loadB: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-11T08:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /truck-washes", payload: { truck_code: "T-A", washed_at: "2026-07-11T08:00:00Z", wash_type: "FULL_DISINFECT" }, as: TransportCoordinator, as_user_id: "tc_1", captures: { washA: $.data.id } }
            - { call: "POST /truck-washes", payload: { truck_code: "T-B", washed_at: "2026-07-11T08:00:00Z", wash_type: "FULL_DISINFECT" }, as: TransportCoordinator, as_user_id: "tc_1", captures: { washB: $.data.id } }
            - { call: "POST /truck-washes/${washA}/verify", payload: {}, as: IntegratorAdmin, as_user_id: "adm_1" }
            - { call: "POST /truck-washes/${washB}/verify", payload: {}, as: IntegratorAdmin, as_user_id: "adm_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-12T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /market-loads/${loadA}/dispatch", payload: { truck_wash_id: "${washA}" }, as: TransportCoordinator }
            - { call: "POST /market-loads/${loadB}/dispatch", payload: { truck_wash_id: "${washB}" }, as: TransportCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-13T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /market-loads/${loadA}/deliver", payload: { live_weight_lbs_total: 135375 }, as: TransportCoordinator }
            - { call: "POST /market-loads/${loadB}/deliver", payload: { live_weight_lbs_total: 135375 }, as: TransportCoordinator }
            - { call: "GET /settlements", payload: { group_id: "${group_id}" }, as: IntegratorAdmin, captures: { sett_id: "$.data[0].id" } }
          trigger:
            - { call: "GET /settlements/${sett_id}", payload: {}, as: IntegratorAdmin }
          assert:
            - "Settlement.base_pay_cents == 4000000 (1000 * 4000)"
            - "Settlement.fcr == 2.49 and Settlement.adg_lbs == 1.77 and Settlement.mortality_pct == 4.0"
            - "Settlement.bonus_cents == 600000 (tier 1.00 x adg_factor 0.5 x cap 1200 x 1000 head)"
            - "Settlement.deductions_cents == 180000 (1500*100 reject penalty + 30000 negligence share)"
            - "Settlement.total_pay_cents == 4420000"

      - name: maintenance_split_rounding_order
        grounds:
          - calculations.maintenance_cost_split
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins owner-first
          rounding: owner = round_half_up(10001 * 0.50) = 5001, grower = remainder 5000.
          Grower-first rounding would give owner 5000 / grower 5001 — a different cent.
          NEGLIGENCE override bypasses the split entirely (grower takes all 10001).
        test_recipe:
          setup:
            - "Contract A ACTIVE (equipment_owner_pct 50, structural 100, routine 0); barn B1"
            - "Three tickets: EQUIPMENT/WEAR 10001c, STRUCTURAL/WEAR 10001c, ROUTINE/NEGLIGENCE 10001c"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
