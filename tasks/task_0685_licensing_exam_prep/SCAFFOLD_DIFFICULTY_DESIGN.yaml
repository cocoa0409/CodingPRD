          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_GUARANTEE_NOT_ELIGIBLE]
        distinguishing_aspect: |
          Category pair STATE (priority 7, ERR_INVALID_STATE) vs BUSINESS_SAFETY (priority 10,
          ERR_GUARANTEE_NOT_ELIGIBLE): deciding an already-DENIED (terminal) claim whose
          enrollment is also not guarantee-eligible returns ERR_INVALID_STATE (the lower
          priority number wins), not ERR_GUARANTEE_NOT_ELIGIBLE.
