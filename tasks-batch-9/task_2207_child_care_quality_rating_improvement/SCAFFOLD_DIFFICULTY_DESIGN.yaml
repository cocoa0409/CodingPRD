              payload: { decision: "CERTIFY", anchor_agreement_pct: 92.00, certified_until: "2027-06-30" }
              as: StateAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /rating-cycles/00000000-0000-4000-8000-0000000000ff/observation-visits"
              payload: { lead_observer_id: "${obs_a}", secondary_observer_id: "${obs_a}", window_start: "2026-08-10T13:00:00Z", window_end: "2026-08-10T09:00:00Z" }
              as: StateAdministrator
              as_user_id: "admin-1"
          assert:
            - "response HTTP status == 404"
            - "response error id == ERR_RATING_ARTIFACT_NOT_FOUND"
            - "response error id != ERR_VALIDATION"
            - "GET /observation-visits returns data array of length 0"

