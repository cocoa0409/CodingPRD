            - { call: "POST /plant/crane-slots", payload: { crane_id: "${cr}", purpose: "BUILD_PICK", start_at: "2026-08-12T08:00:00Z", end_at: "2026-08-12T09:30:00Z", expected_crane_version: "${cr_v3}" }, as: ProductionPlanner, captures: { s4: $.data.id } }
