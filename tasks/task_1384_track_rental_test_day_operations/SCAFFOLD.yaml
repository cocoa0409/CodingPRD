# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unknown X-User-Role header"

  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Role not permitted to invoke this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist within the parent scope"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, invalid type, invalid enum value, malformed id"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_<parent>_version does not match current parent version"

  - id: ERR_TRACK_DAY_NOT_LIVE
    http: 409
    condition: "TrackDay.status is CANCELLED or CLOSED; no forward progress allowed"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "State-machine precondition violated for the requested transition"

  - id: ERR_TRACK_SUSPENDED
    http: 409
    condition: "TrackDay.posture == SUSPENDED; forward-progress operation blocked"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Inspector equals booking organizer, or incident clearer equals reporter"

  - id: ERR_DRIVER_NOT_CLEARED
    http: 422
    condition: "Driver lacks signed waiver, passed inspection, approved booking, or captured payment"

  - id: ERR_COACH_CERT_INSUFFICIENT
    http: 422
    condition: "Coach cert_level below requirement for the run_group_class"

  - id: ERR_COACH_OVERLOADED
    http: 409
    condition: "Coach already at MAX_BOOKINGS_PER_COACH active bookings on this TrackDay"

  - id: ERR_BLOCK_OVERLAP
    http: 409
    condition: "RentalBlock interval [start_minute,end_minute) overlaps an existing block"

  - id: ERR_BAY_OCCUPIED
    http: 409
    condition: "GarageAssignment bay_number already ACTIVE on this TrackDay"

  - id: ERR_STALL_OCCUPIED
    http: 409
    condition: "PaddockAssignment stall_number already ACTIVE on this TrackDay"

  - id: ERR_GROUP_SIZE_EXCEEDS_TRACK_CAP
    http: 422
    condition: "RentalBlock.max_group_size exceeds Track.run_group_capacity"

  - id: ERR_INVALID_DRIVER_COUNT
    http: 422
    condition: "Booking.driver_count < 1 or exceeds RentalBlock.max_group_size"

  - id: ERR_BLOCK_FULL
    http: 409
    condition: "seats_available < driver_count at approval time"

  - id: ERR_INSURANCE_MISSING
    http: 422
    condition: "Booking.insurance_policy_ref empty or missing at approval"

  - id: ERR_NOISE_LIMIT_EXCEEDED
    http: 422
    condition: "Reserved for future reactive endpoint; posture recomputation happens server-side (informational)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TrackOps
    description: "Track operations operator — manages track day lifecycle, bookings approval, assignments, incidents"
    identity: opaque
    exclusive_operations:
      - "POST /tracks — Create track"
      - "POST /tracks/{tid}/coaches — Register coach"
      - "POST /tracks/{tid}/track-days — Create track day"
      - "POST /tracks/{tid}/track-days/{tdid}/open — Open track day"
      - "POST /tracks/{tid}/track-days/{tdid}/weather_hold / weather_clear"
      - "POST /tracks/{tid}/track-days/{tdid}/cancel / close / run_ops"
      - "POST /tracks/{tid}/track-days/{tdid}/rental-blocks — Create block"
      - "POST /tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/close_block"
      - "POST .../bookings/{bid}/approve / reject"
      - "POST .../bookings/{bid}/assign_coach"
      - "POST /tracks/{tid}/track-days/{tdid}/sessions — Start session"
      - "POST .../sessions/{sid}/checkered / lap_event"
      - "POST /tracks/{tid}/track-days/{tdid}/garage-assignments (and release)"
      - "POST /tracks/{tid}/track-days/{tdid}/paddock-assignments (and release)"
      - "POST /_clock/set_current_utc, /_payments/simulate"
    shared_operations:
      - "GET endpoints (with SafetyOfficer, Coach, Organizer)"
      - "POST .../bookings/{bid}/cancel (shared with Organizer)"
      - "POST /tracks/{tid}/track-days/{tdid}/incidents (shared with SafetyOfficer)"
      - "POST /tracks/{tid}/track-days/{tdid}/noise-readings (shared with SafetyOfficer)"
      - "POST .../drivers/{did}/waiver (shared with Organizer)"

  - name: SafetyOfficer
    description: "Safety official — incident investigation/clear, driver safety inspections, resume authority"
    identity: opaque
    exclusive_operations:
      - "POST .../incidents/{iid}/investigate / clear"
      - "POST .../drivers/{did}/inspect"
      - "POST /tracks/{tid}/track-days/{tdid}/resume"
    shared_operations:
      - "GET endpoints"
      - "POST /tracks/{tid}/track-days/{tdid}/incidents (report)"
      - "POST /tracks/{tid}/track-days/{tdid}/noise-readings"

  - name: Organizer
    description: "Renting-group organizer — creates bookings and drivers, signs waivers, cancels own bookings"
    identity: opaque
    exclusive_operations:
      - "POST .../bookings (create)"
      - "POST .../drivers (create)"
    shared_operations:
      - "GET endpoints"
      - "POST .../bookings/{bid}/cancel (own bookings; shared with TrackOps)"
      - "POST .../drivers/{did}/waiver (shared with TrackOps)"

  - name: Coach
    description: "Driving coach — read-only; coach assignment mutates Coach state but is performed by TrackOps"
    identity: entity_backed:Coach
    exclusive_operations: []
    shared_operations:
      - "GET endpoints"
