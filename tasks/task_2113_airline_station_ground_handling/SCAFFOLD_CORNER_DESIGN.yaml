# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over every testable claim SCAFFOLD.yaml §1.1-§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Section names and
# claim_type values come from references/claim-extraction-guide.md.
scaffold_corner_design:

  # =======================================================================
  - section: entities
    instances:

      - name: station_create_applies_declared_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - entities.Station.fields.status
          - entities.Station.fields.otp_target_pct
          - entities.Station.fields.otp_tolerance_minutes
          - entities.Station.fields.gse_reposition_buffer_minutes
          - entities.Station.fields.penalty_cap_cents
          - entities.Station.fields.damage_penalty_multiplier
          - endpoints[POST /stations]
        distinguishing_aspect: "A POST /stations body carrying only the four required fields yields status PLANNED, otp_target_pct 85.00, otp_tolerance_minutes 15, gse_reposition_buffer_minutes 20, penalty_cap_cents 5000000, damage_penalty_multiplier 1.00, oversight_posture NORMAL, otp_rolling_pct 100.00 and version 1."
        test_recipe:
          setup:
            - "Empty database; the logical clock has been pinned to 2026-04-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
          trigger:
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id, st_status: $.data.status, tgt: $.data.otp_target_pct, tol: $.data.otp_tolerance_minutes, buf: $.data.gse_reposition_buffer_minutes, cap: $.data.penalty_cap_cents, mult: $.data.damage_penalty_multiplier, posture: $.data.oversight_posture, otp: $.data.otp_rolling_pct, ver: $.data.version }
          assert:
            - "HTTP status is 201"
            - "${st_status} == PLANNED"
            - "${tgt} == 85.00"
            - "${tol} == 15"
            - "${buf} == 20"
            - "${cap} == 5000000"
            - "${mult} == 1.00"
            - "${posture} == NORMAL"
            - "${otp} == 100.00"
            - "${ver} == 1"
            - "Station.${st_id}.opened_at == null"
            - "Station.${st_id}.completed_turn_count == 0"
            - "Station.${st_id}.open_critical_incident_count == 0"

      - name: get_station_with_unknown_id_returns_station_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_STATION_NOT_FOUND]
          - validations[priority=3]
          - endpoints[GET /stations/{stationId}]
        distinguishing_aspect: "A syntactically valid but unknown UUID on GET /stations/{stationId} returns ERR_STATION_NOT_FOUND with HTTP 404 rather than an empty object."
        test_recipe:
          setup:
            - "Empty database apart from the pinned logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
          trigger:
            - call: "GET /stations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STATION_NOT_FOUND"
            - "HTTP status is 404"

      - name: station_list_honours_limit_and_offset_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /stations]
          - entities.Station.fields.iata_code
        distinguishing_aspect: "With three stations stored, GET /stations at limit 2 offset 0 returns two rows with total_count 3 and has_more true, and at limit 2 offset 2 returns one row with has_more false."
        test_recipe:
          setup:
            - "Three stations ZRH, GVA and BSL exist in PLANNED status."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "GVA", name: "Geneva", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "BSL", name: "Basel", handler_code: "MNZ", season_code: "SUMMER" }
              as: StationManager
          trigger:
            - call: "GET /stations"
              payload: { limit: 2, offset: 0 }
              as: ContractAuditor
              captures: { page1_first: "$.data[0].iata_code" }
            - call: "GET /stations"
              payload: { limit: 2, offset: 2 }
              as: ContractAuditor
              captures: { page2_first: "$.data[0].iata_code" }
          assert:
            - "the first response carries exactly 2 elements in data, total_count 3 and has_more true"
            - "the second response carries exactly 1 element in data, total_count 3 and has_more false"
            - "${page1_first} == ZRH"
            - "${page2_first} == BSL"
            - "both responses carry response_type array and a meta block with api_request_id and api_request_timestamp"

      - name: create_turn_missing_required_turn_type_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /turns]
        distinguishing_aspect: "Omitting the required turn_type field on POST /turns returns ERR_INVALID_REQUEST with HTTP 400 and persists no Turn."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with FlightBank AM1 in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
          trigger:
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status is 400"
            - "FlightBank.${fb_id}.turn_count == 0"
            - "FlightBank.${fb_id}.required_headcount == 0"

      - name: create_gse_unit_invalid_enum_gse_type_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.GseUnit.fields.gse_type
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "gse_type FORKLIFT is not a declared member of {PUSHBACK_TUG, BELT_LOADER, GPU, DEICER, STAIRS}, so POST /gse-units returns ERR_INVALID_REQUEST with HTTP 400."
        test_recipe:
          setup:
            - "Station ZRH is OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
          trigger:
            - call: "POST /gse-units"
              payload: { station_id: "${st_id}", asset_tag: "FL-01", gse_type: "FORKLIFT" }
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status is 400"

      - name: turn_requirement_counts_are_computed_from_turn_type
        claim_type: computed_fields
        grounds:
          - calculations.turn_requirement_matrix
          - entities.Turn.fields.required_agent_count
          - entities.Turn.fields.required_gse_count
          - entities.Turn.fields.scheduled_ground_minutes
        distinguishing_aspect: "A WIDEBODY turn scheduled 06:00-07:30 reports required_agent_count 4, required_gse_count 2 and scheduled_ground_minutes 90, and the bank's required_headcount becomes 4 even though nothing was supplied for those fields."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with FlightBank AM1 in DRAFT and planned_headcount 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 0 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
          trigger:
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX16", turn_type: "WIDEBODY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T07:30:00Z" }
              as: DutyOfficer
              captures: { t_id: $.data.id, ra: $.data.required_agent_count, rg: $.data.required_gse_count, sgm: $.data.scheduled_ground_minutes, st: $.data.status, otp: $.data.otp_result }
            - call: "GET /flight-banks/${fb_id}"
              payload: {}
              as: DutyOfficer
              captures: { req_hc: $.data.required_headcount, cov: $.data.staffing_coverage_pct, tc: $.data.turn_count }
          assert:
            - "${ra} == 4"
            - "${rg} == 2"
            - "${sgm} == 90"
            - "${st} == SCHEDULED"
            - "${otp} == PENDING"
            - "${req_hc} == 4"
            - "${tc} == 1"
            - "${cov} == 0.00"
            - "Turn.${t_id}.assigned_agent_count == 0"
            - "Turn.${t_id}.billed == false"

      - name: agent_employment_type_and_subcontractor_tier_are_derived
        claim_type: computed_fields
        grounds:
          - entities.Agent.fields.employment_type
          - entities.Subcontractor.fields.tier
          - entities.Subcontractor.fields.parent_subcontractor_id
        distinguishing_aspect: "An Agent created without subcontractor_id reports employment_type DIRECT; one created with it reports SUBCONTRACTED. A Subcontractor created without parent_subcontractor_id reports tier TIER_1; one created with a sponsor reports TIER_2."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with a tier-1 Subcontractor 'Alpine Ramp AG' in PENDING_VETTING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /subcontractors"
              payload: { station_id: "${st_id}", legal_name: "Alpine Ramp AG" }
              as: StationManager
              captures: { sc1_id: $.data.id, tier1: $.data.tier, sc1_status: $.data.status, sc1_score: $.data.compliance_score }
          trigger:
            - call: "POST /subcontractors"
              payload: { station_id: "${st_id}", legal_name: "Alpine Deicing GmbH", parent_subcontractor_id: "${sc1_id}" }
              as: StationManager
              captures: { sc2_id: $.data.id, tier2: $.data.tier }
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a_direct: $.data.id, emp_direct: $.data.employment_type, posture_direct: $.data.certification_posture }
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E010", full_name: "Cleo Marin", subcontractor_id: "${sc1_id}" }
              as: StationManager
              captures: { a_sub: $.data.id, emp_sub: $.data.employment_type }
            - call: "GET /subcontractors"
              payload: { station_id: "${st_id}", parent_subcontractor_id: "${sc1_id}" }
              as: StationManager
              captures: { child_id: "$.data[0].id" }
          assert:
            - "${tier1} == TIER_1"
            - "${tier2} == TIER_2"
            - "${sc1_status} == PENDING_VETTING"
            - "${sc1_score} == 100.00"
            - "${emp_direct} == DIRECT"
            - "${emp_sub} == SUBCONTRACTED"
            - "${posture_direct} == LAPSED"
            - "${child_id} == ${sc2_id}"
            - "the filtered list returns exactly 1 element"

      - name: create_turn_resource_with_unknown_agent_id_returns_agent_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_AGENT_NOT_FOUND]
          - entities.TurnResource.fields.agent_id
        distinguishing_aspect: "A body foreign key that resolves to nothing is caught at priority 5, so POST /turn-resources with an unknown agent_id returns ERR_AGENT_NOT_FOUND with HTTP 404 before any temporal or certification test runs."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with FlightBank AM1 in DRAFT and one SCHEDULED TOWING_ONLY turn."
            - "No Agent rows exist at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t_id: $.data.id, t_v: $.data.version }
          trigger:
            - call: "POST /turn-resources"
              payload: { turn_id: "${t_id}", resource_kind: "AGENT", agent_id: "11111111-2222-3333-4444-555555555555", role_on_turn: "RAMP", window_start: "2026-04-10T05:50:00Z", window_end: "2026-04-10T06:30:00Z", expected_turn_version: "${t_v}" }
              as: DutyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_AGENT_NOT_FOUND"
            - "HTTP status is 404"
            - "Turn.${t_id}.assigned_agent_count == 0"
            - "Turn.${t_id}.version == ${t_v}"

      - name: certification_currency_state_is_expiring_within_thirty_days
        claim_type: computed_fields
        grounds:
          - calculations.certification_currency
          - entities.Certification.fields.currency_state
          - entities.Agent.fields.certification_posture
        distinguishing_aspect: "At clock 2026-04-01 an endorsement expiring 2026-04-20 (19 days out) reports currency_state EXPIRING and drags Agent.certification_posture to EXPIRING, while one expiring 2027-01-01 reports CURRENT."
        test_recipe:
          setup:
            - "Station ZRH is OPEN; the logical clock reads 2026-04-01T00:00:00Z."
            - "Agent E001 exists with no endorsements yet, so certification_posture is LAPSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /certifications"
              payload: { agent_id: "${a_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2026-04-20T00:00:00Z" }
              as: StationManager
              captures: { c_soon: $.data.id, state_soon: $.data.currency_state }
            - call: "GET /agents/${a_id}"
              payload: {}
              as: StationManager
              captures: { posture_soon: $.data.certification_posture }
            - call: "POST /certifications"
              payload: { agent_id: "${a_id}", station_id: "${st_id}", cert_type: "PUSHBACK", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StationManager
              captures: { c_far: $.data.id, state_far: $.data.currency_state }
            - call: "GET /certifications"
              payload: { agent_id: "${a_id}", station_id: "${st_id}" }
              as: SafetyOfficer
              captures: { listed_first: "$.data[0].id" }
          assert:
            - "${state_soon} == EXPIRING"
            - "${state_far} == CURRENT"
            - "${posture_soon} == EXPIRING"
            - "${listed_first} == ${c_soon}"
            - "the filtered certification list returns exactly 2 elements"
            - "Certification.${c_far}.status == VALID"

      - name: certification_expires_at_not_after_issued_at_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Certification.fields.expires_at
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "expires_at equal to issued_at violates the strictly-after constraint, so POST /certifications returns ERR_INVALID_REQUEST with HTTP 400."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with Agent E001 registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /certifications"
              payload: { agent_id: "${a_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2026-01-01T00:00:00Z" }
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status is 400"
            - "Agent.${a_id}.certification_posture == LAPSED"

      - name: turn_resource_agent_payload_missing_role_on_turn_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.TurnResource.fields.role_on_turn
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "resource_kind AGENT without role_on_turn breaks the polymorphic payload rule, so POST /turn-resources returns ERR_INVALID_REQUEST with HTTP 400 and never reaches the certification check."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with one SCHEDULED TOWING_ONLY turn and a fully certified agent E001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a_id: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StationManager
          trigger:
            - call: "POST /turn-resources"
              payload: { turn_id: "${t_id}", resource_kind: "AGENT", agent_id: "${a_id}", window_start: "2026-04-10T05:50:00Z", window_end: "2026-04-10T06:30:00Z", expected_turn_version: "${t_v}" }
              as: DutyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status is 400"
            - "Agent.${a_id}.assigned_duty_minutes == 0"

      - name: turn_resources_reverse_lookup_by_gse_unit_id
        claim_type: retrieval
        grounds:
          - endpoints[GET /turn-resources]
          - entities.TurnResource.fields.gse_unit_id
        distinguishing_aspect: "GET /turn-resources filtered by gse_unit_id is the only discovery channel for occupations attached to a unit and returns exactly the one RESERVED row created for TUG-01."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with one SCHEDULED TOWING_ONLY turn and one AVAILABLE tug that carries a single 20-minute occupation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /gse-units"
              payload: { station_id: "${st_id}", asset_tag: "TUG-01", gse_type: "PUSHBACK_TUG" }
              as: StationManager
              captures: { g_id: $.data.id }
            - call: "POST /turn-resources"
              payload: { turn_id: "${t_id}", resource_kind: "GSE", gse_unit_id: "${g_id}", window_start: "2026-04-10T06:00:00Z", window_end: "2026-04-10T06:20:00Z", expected_turn_version: "${t_v}" }
              as: DutyOfficer
              captures: { tr_id: $.data.id }
          trigger:
            - call: "GET /turn-resources"
              payload: { gse_unit_id: "${g_id}", status: "RESERVED" }
              as: ContractAuditor
              captures: { found_id: "$.data[0].id", found_kind: "$.data[0].resource_kind", found_minutes: "$.data[0].occupied_minutes" }
          assert:
            - "${found_id} == ${tr_id}"
            - "${found_kind} == GSE"
            - "${found_minutes} == 20"
            - "the filtered list returns exactly 1 element with total_count 1 and has_more false"

  # =======================================================================
  - section: state_machines
    instances:

      - name: open_station_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.Station.PLANNED_to_OPEN
          - errors[ERR_INVALID_STATE]
          - validations[priority=10]
        distinguishing_aspect: "OPEN is only an edge out of PLANNED, so a second OPEN on an already-OPEN station returns ERR_INVALID_STATE with HTTP 409 and leaves opened_at unchanged."
        test_recipe:
          setup:
            - "Station ZRH has already been opened once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
              captures: { opened_at_first: $.data.opened_at, v_first: $.data.version }
          trigger:
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "HTTP status is 409"
            - "${opened_at_first} == 2026-04-01T00:00:00.000Z"
            - "Station.${st_id}.status == OPEN"
            - "Station.${st_id}.version == ${v_first}"

      - name: closed_station_rejects_every_further_lifecycle_action
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Station.terminal_states
          - state_machines.Station.OPEN_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CLOSED is terminal for Station, so both SUSPEND and RESUME on a CLOSED station return ERR_INVALID_STATE with HTTP 409."
        test_recipe:
          setup:
            - "Station ZRH was opened and then CLOSED with no turns and no billing periods outstanding."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /gse-units"
              payload: { station_id: "${st_id}", asset_tag: "TUG-01", gse_type: "PUSHBACK_TUG" }
              as: StationManager
              captures: { g_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: StationManager
              captures: { closed_status: $.data.status, closed_at: $.data.closed_at }
          trigger:
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "SUSPEND" }
              as: StationManager
              captures: { err_suspend: $.data.error_id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "RESUME" }
              as: StationManager
              captures: { err_resume: $.data.error_id }
          assert:
            - "${closed_status} == CLOSED"
            - "${closed_at} == 2026-04-01T00:00:00.000Z"
            - "${err_suspend} == ERR_INVALID_STATE"
            - "${err_resume} == ERR_INVALID_STATE"
            - "both responses carry HTTP status 409"
            - "GseUnit.${g_id}.status == RETIRED"
            - "Station.${st_id}.status == CLOSED"

      - name: start_turn_from_scheduled_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Turn.RESOURCED_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE]
          - validations[priority=10]
        distinguishing_aspect: "START is only an edge out of RESOURCED, so a SCHEDULED turn with no occupations returns ERR_INVALID_STATE with HTTP 409 and records no actual_in."
        test_recipe:
          setup:
            - "Station ZRH is OPEN, FlightBank AM1 is PUBLISHED with staffing APPROVED, and Turn LX318 is SCHEDULED with zero occupations."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t_id: $.data.id }
            - call: "POST /flight-banks/${fb_id}/lifecycle"
              payload: { action: "PUBLISH" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "SUBMIT" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "APPROVE" }
              as: StationManager
          trigger:
            - call: "POST /turns/${t_id}/lifecycle"
              payload: { action: "START", actual_in: "2026-04-10T06:00:00Z" }
              as: DutyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "HTTP status is 409"
            - "Turn.${t_id}.status == SCHEDULED"
            - "Turn.${t_id}.actual_in == null"

      - name: publish_flight_bank_with_no_turns_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.FlightBank.DRAFT_to_PUBLISHED
          - entities.FlightBank.fields.turn_count
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The PUBLISH precondition turn_count >= 1 fails on an empty bank, so the call returns ERR_INVALID_STATE with HTTP 409 and bank_status stays DRAFT."
        test_recipe:
          setup:
            - "Station ZRH is OPEN and FlightBank AM1 exists in DRAFT with turn_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z" }
              as: DutyOfficer
              captures: { fb_id: $.data.id, hc: $.data.planned_headcount, cov: $.data.staffing_coverage_pct }
          trigger:
            - call: "POST /flight-banks/${fb_id}/lifecycle"
              payload: { action: "PUBLISH" }
              as: DutyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${hc} == 0"
            - "${cov} == 100.00"
            - "${err} == ERR_INVALID_STATE"
            - "HTTP status is 409"
            - "FlightBank.${fb_id}.bank_status == DRAFT"
            - "FlightBank.${fb_id}.staffing_status == DRAFT"

      - name: station_suspend_cascades_bank_lock_turn_disruption_and_ledger_release
        claim_type: cascade_down
        grounds:
          - state_machines.Station.OPEN_to_SUSPENDED
          - state_machines.Turn.RESOURCED_to_DISRUPTED
          - state_machines.TurnResource.COMMITTED_to_CANCELLED
          - entities.GseUnit.fields.committed_occupation_minutes
          - entities.Agent.fields.assigned_duty_minutes
        distinguishing_aspect: "Suspending the station runs all four hops in one request: the PUBLISHED bank becomes LOCKED, its APPROVED staffing plan becomes REVISION_REQUIRED, its RESOURCED turn becomes DISRUPTED, and both resource ledgers return to 0 with cancel_reason STATION_SUSPENDED."
        test_recipe:
          setup:
            - "Station ZRH is OPEN, FlightBank AM1 is PUBLISHED with staffing APPROVED and planned_headcount 1."
            - "Turn LX318 is RESOURCED with a 40-minute agent occupation and a 30-minute tug occupation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
