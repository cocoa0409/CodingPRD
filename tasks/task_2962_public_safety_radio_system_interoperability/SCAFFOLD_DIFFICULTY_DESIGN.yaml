# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Machine-readable index of the nine §0.5 Difficulty Rules as this scaffold
# realises them. Every `grounds:` reference resolves into SCAFFOLD.yaml
# §1.1-§1.7. Every numeric literal in an `assert:` was executed against the
# named §1.3 `formula:` and its `constants:` before being written here.
#
# Fixed test-actor identities used throughout (X-User-ID header values):
#   SystemAdmin        -> "admin-1"
#   RFEngineer         -> "rf-1"
#   FleetEngineer      -> "fe-1"
#   ChangeControlBoard -> "ccb-1"
#   KeyCustodian       -> "kc-1"
#   SecurityOfficer    -> "so-1"
#   AgencyRadioManager -> the owning MemberAgency id (entity_backed)
#   Dispatcher         -> the owning MemberAgency id (entity_backed)
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: fee_basis_snapshot_versus_prorated_diverge_on_identical_fleets
        grounds:
          - calculations.agency_fee_assessment
          - calculations.unit_days_in_service
          - entities.MemberAgency.fields.fee_basis
          - entities.MemberAgency.fields.last_assessed_fee_cents
          - concurrency_rules[agency-fee-reassessment-stale]
        distinguishing_aspect: |
          Entity domain is MemberAgency fee accounting. Two agencies holding
          byte-identical fleets (3 units, each ASSIGNED on 2026-07-21) assessed
          over the same 31-day period produce 12600 cents under SNAPSHOT and
          4470 cents under PRORATED — the SNAPSHOT variant charges a full period
          per head while PRORATED weights each head by 11/31 days in service.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-07-21T00:00:00Z while the fleets are built, then advanced to 2026-08-01T00:00:00Z."
            - "MemberAgency A: agency_type LAW, fee_basis SNAPSHOT, interop_privilege MONITOR, recorder_retention_days 180."
            - "MemberAgency B: identical except fee_basis PRORATED."
            - "One PUBLISHED RadioTemplate with talkgroup_slot_count 8 targeting P25_PHASE1."
            - "Each agency owns exactly 3 SubscriberUnit rows, all provision_status ASSIGNED with assigned_at == 2026-07-21T00:00:00Z, key_status KEYLESS, no talkgroups."
            - "Neither agency has ever been assessed, so fee_balance_cents is 0 and no late fee applies."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-21T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Alpha County Sheriff", agency_code: "LAWA1", agency_type: "LAW", fee_basis: "SNAPSHOT", interop_privilege: "MONITOR", recorder_retention_days: 180 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_a_id: "$.data.id" }
            - call: "POST /radio-system/agencies"
              payload: { name: "Bravo County Sheriff", agency_code: "LAWB1", agency_type: "LAW", fee_basis: "PRORATED", interop_privilege: "MONITOR", recorder_retention_days: 180 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_b_id: "$.data.id" }
            - call: "POST /radio-system/templates"
              payload: { template_name: "REGION-BASE-1", target_standard: "P25_PHASE1", talkgroup_slot_count: 8, encryption_required: false }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_id: "$.data.id" }
            - call: "POST /radio-system/templates/${tpl_id}/publish"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_a_id}", serial_number: "SNA001", radio_id: 1001, model: "PORTABLE" }
              as: AgencyRadioManager
              as_user_id: "${agency_a_id}"
              captures: { unit_a1: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_a_id}", serial_number: "SNA002", radio_id: 1002, model: "PORTABLE" }
              as: AgencyRadioManager
              as_user_id: "${agency_a_id}"
              captures: { unit_a2: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_a_id}", serial_number: "SNA003", radio_id: 1003, model: "MOBILE" }
              as: AgencyRadioManager
              as_user_id: "${agency_a_id}"
              captures: { unit_a3: "$.data.id" }
            - call: "POST /radio-system/units/${unit_a1}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_a_id}"
            - call: "POST /radio-system/units/${unit_a2}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_a_id}"
            - call: "POST /radio-system/units/${unit_a3}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_a_id}"
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_b_id}", serial_number: "SNB001", radio_id: 2001, model: "PORTABLE" }
              as: AgencyRadioManager
              as_user_id: "${agency_b_id}"
              captures: { unit_b1: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_b_id}", serial_number: "SNB002", radio_id: 2002, model: "PORTABLE" }
              as: AgencyRadioManager
              as_user_id: "${agency_b_id}"
              captures: { unit_b2: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_b_id}", serial_number: "SNB003", radio_id: 2003, model: "MOBILE" }
              as: AgencyRadioManager
              as_user_id: "${agency_b_id}"
              captures: { unit_b3: "$.data.id" }
            - call: "POST /radio-system/units/${unit_b1}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_b_id}"
            - call: "POST /radio-system/units/${unit_b2}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_b_id}"
            - call: "POST /radio-system/units/${unit_b3}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_b_id}"
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "GET /radio-system/agencies/${agency_a_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_a_v: "$.data.version" }
            - call: "GET /radio-system/agencies/${agency_b_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_b_v: "$.data.version" }
          trigger:
            - call: "POST /radio-system/agencies/${agency_a_id}/fee-assessments"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", expected_agency_version: "${agency_a_v}" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies/${agency_b_id}/fee-assessments"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", expected_agency_version: "${agency_b_v}" }
              as: SystemAdmin
              as_user_id: "admin-1"
          assert:
            - "MemberAgency.${agency_a_id}.last_assessed_fee_cents == 12600"
            - "MemberAgency.${agency_b_id}.last_assessed_fee_cents == 4470"
            - "MemberAgency.${agency_a_id}.last_assessed_fee_cents - MemberAgency.${agency_b_id}.last_assessed_fee_cents == 8130"
            - "MemberAgency.${agency_a_id}.fee_balance_cents == 12600 and MemberAgency.${agency_a_id}.lifetime_assessed_cents == 12600"
            - "MemberAgency.${agency_b_id}.fee_balance_cents == 4470 and MemberAgency.${agency_b_id}.lifetime_assessed_cents == 4470"
            - "MemberAgency.${agency_a_id}.payment_due_at == 2026-08-31T00:00:00.000Z"
            - "MemberAgency.${agency_a_id}.billing_status == CURRENT and MemberAgency.${agency_b_id}.billing_status == CURRENT"
            - "SubscriberUnit.${unit_b1}.days_in_service_last_period == 11"
            - "SubscriberUnit.${unit_b2}.days_in_service_last_period == 11"
            - "SubscriberUnit.${unit_b3}.days_in_service_last_period == 11"
            - "MemberAgency.${agency_a_id}.billable_subscriber_count == 3 and MemberAgency.${agency_b_id}.billable_subscriber_count == 3"

      - name: migration_readiness_strict_versus_planned_diverge_on_identical_fleet
        grounds:
          - calculations.fleet_migration_readiness
          - entities.RadioTemplate.fields.target_standard
          - entities.SubscriberUnit.fields.provision_status
          - state_machines.ProgrammingChangeRequest.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Entity domain is SubscriberUnit / RadioTemplate fleet migration, not fee
          accounting. For one unchanged fleet of 2 ASSIGNED units still programmed
          to P25_PHASE1, basis STRICT reports readiness_pct 0.0 while basis PLANNED
          reports 100.0, because PLANNED additionally credits units whose agency
          holds an APPROVED change request pinning an NG_LMR template.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z throughout."
            - "MemberAgency C with 2 SubscriberUnit rows, both provision_status ASSIGNED, key_status KEYLESS, template_id pointing at a PUBLISHED P25_PHASE1 template."
            - "A second PUBLISHED RadioTemplate targeting NG_LMR exists."
            - "One ProgrammingChangeRequest in status APPROVED pins the NG_LMR template against agency C; deployment has NOT been run, so both units are still on the P25_PHASE1 template."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Charlie Fire District", agency_code: "FIRC1", agency_type: "FIRE", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_c_id: "$.data.id" }
            - call: "POST /radio-system/templates"
              payload: { template_name: "LEGACY-P1", target_standard: "P25_PHASE1", talkgroup_slot_count: 8 }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_legacy_id: "$.data.id" }
            - call: "POST /radio-system/templates/${tpl_legacy_id}/publish"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
            - call: "POST /radio-system/templates"
              payload: { template_name: "NEXTGEN-NG1", target_standard: "NG_LMR", talkgroup_slot_count: 16 }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_ng_id: "$.data.id" }
            - call: "POST /radio-system/templates/${tpl_ng_id}/publish"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_c_id}", serial_number: "SNC001", radio_id: 3001, model: "PORTABLE" }
              as: AgencyRadioManager
              as_user_id: "${agency_c_id}"
              captures: { unit_c1: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_c_id}", serial_number: "SNC002", radio_id: 3002, model: "MOBILE" }
              as: AgencyRadioManager
              as_user_id: "${agency_c_id}"
              captures: { unit_c2: "$.data.id" }
            - call: "POST /radio-system/units/${unit_c1}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_legacy_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_c_id}"
            - call: "POST /radio-system/units/${unit_c2}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_legacy_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_c_id}"
            - call: "POST /radio-system/change-requests"
              payload: { template_id: "${tpl_ng_id}", target_agency_id: "${agency_c_id}", title: "Cut Charlie fleet to NG_LMR" }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { cr_id: "$.data.id" }
            - call: "POST /radio-system/change-requests/${cr_id}/submit"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
            - call: "POST /radio-system/change-requests/${cr_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: ChangeControlBoard
              as_user_id: "ccb-1"
          trigger:
            - call: "GET /radio-system/migration-readiness"
              payload: { agency_id: "${agency_c_id}", basis: "STRICT" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "GET /radio-system/migration-readiness"
              payload: { agency_id: "${agency_c_id}", basis: "PLANNED" }
              as: SystemAdmin
              as_user_id: "admin-1"
          assert:
            - "STRICT response data.evaluated_unit_count == 2 and data.ready_unit_count == 0 and data.readiness_pct == 0.0"
            - "PLANNED response data.evaluated_unit_count == 2 and data.ready_unit_count == 2 and data.readiness_pct == 100.0"
            - "SubscriberUnit.${unit_c1}.template_id == ${tpl_legacy_id} and SubscriberUnit.${unit_c2}.template_id == ${tpl_legacy_id} (neither read mutated the fleet)"
            - "ProgrammingChangeRequest.${cr_id}.status == APPROVED and ProgrammingChangeRequest.${cr_id}.pinned_template_version == 1 and ProgrammingChangeRequest.${cr_id}.target_unit_count == 2"

  - rule_id: combinatorial_formula
    instances:
      - name: prorated_fee_rounds_per_unit_before_summing_mode_b
        grounds:
          - calculations.agency_fee_assessment
          - calculations.unit_days_in_service
          - entities.MemberAgency.fields.fee_basis
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order is outcome-bearing. Three
          units each worth 4200 * 11 / 31 = 1490.32258 cents round PER UNIT to
          1490 and sum to 4470; summing the fractions first (4470.96774) and
          rounding once yields 4471. The scaffold pins per-unit-then-sum, so 4470
          is correct and 4471 proves the rounding order was reversed.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-07-21T00:00:00Z during fleet build, then advanced to 2026-08-01T00:00:00Z."
            - "MemberAgency D: fee_basis PRORATED, agency_type EMS, interop_privilege MONITOR (so no surcharge), never assessed (fee_balance_cents 0, so no late fee)."
            - "Exactly 3 SubscriberUnit rows, all ASSIGNED with assigned_at == 2026-07-21T00:00:00Z, giving each 11 billable days inside the 31-day period."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-21T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Delta Regional EMS", agency_code: "EMSD1", agency_type: "EMS", fee_basis: "PRORATED", interop_privilege: "MONITOR", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_d_id: "$.data.id" }
            - call: "POST /radio-system/templates"
              payload: { template_name: "EMS-BASE-1", target_standard: "P25_PHASE1", talkgroup_slot_count: 4 }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_ems_id: "$.data.id" }
            - call: "POST /radio-system/templates/${tpl_ems_id}/publish"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_d_id}", serial_number: "SND001", radio_id: 4001, model: "PORTABLE" }
              as: AgencyRadioManager
              as_user_id: "${agency_d_id}"
              captures: { unit_d1: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_d_id}", serial_number: "SND002", radio_id: 4002, model: "PORTABLE" }
              as: AgencyRadioManager
              as_user_id: "${agency_d_id}"
              captures: { unit_d2: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_d_id}", serial_number: "SND003", radio_id: 4003, model: "MOBILE" }
              as: AgencyRadioManager
              as_user_id: "${agency_d_id}"
              captures: { unit_d3: "$.data.id" }
            - call: "POST /radio-system/units/${unit_d1}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_ems_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_d_id}"
            - call: "POST /radio-system/units/${unit_d2}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_ems_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_d_id}"
            - call: "POST /radio-system/units/${unit_d3}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_ems_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_d_id}"
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "GET /radio-system/agencies/${agency_d_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_d_v: "$.data.version" }
          trigger:
            - call: "POST /radio-system/agencies/${agency_d_id}/fee-assessments"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", expected_agency_version: "${agency_d_v}" }
              as: SystemAdmin
              as_user_id: "admin-1"
          assert:
            - "MemberAgency.${agency_d_id}.last_assessed_fee_cents == 4470"
            - "MemberAgency.${agency_d_id}.last_assessed_fee_cents != 4471"
            - "MemberAgency.${agency_d_id}.lifetime_assessed_cents == 4470 and MemberAgency.${agency_d_id}.fee_balance_cents == 4470"
            - "MemberAgency.${agency_d_id}.last_assessment_period_start == 2026-07-01T00:00:00.000Z"
            - "MemberAgency.${agency_d_id}.last_assessment_period_end == 2026-08-01T00:00:00.000Z"
            - "SubscriberUnit.${unit_d1}.days_in_service_last_period == 11 and SubscriberUnit.${unit_d2}.days_in_service_last_period == 11 and SubscriberUnit.${unit_d3}.days_in_service_last_period == 11"

      - name: coverage_derate_tier_selected_once_from_raw_pct_mode_c
        grounds:
          - calculations.site_coverage_reliability
          - entities.Site.fields.coverage_derate_tier
          - entities.Site.fields.coverage_class
          - entities.Site.fields.backup_power_type
          - concurrency_rules[site-coverage-resubmission-stale]
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency (tier -> derate -> value ->
          tier) whose evaluation order the scaffold pins to a single pass. Site
          COV-A submits 970/1000: raw_pct 97.00 selects tier A, the 0.5 pp derate
          lands the result on 96.5, which sits in tier B's band — yet
          coverage_derate_tier stays A and the value stays 96.5, not the 95.5 a
          second tier selection would produce. Sites COV-B/COV-C add the
          three-input interaction with backup_power_type on identical raw input.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Site COV-A: GENERATOR backup, never surveyed (coverage_class UNRATED, version captured at creation)."
            - "Site COV-B: BATTERY_ONLY backup, generator_fuel_hours 0."
            - "Site COV-C: GENERATOR backup with generator_fuel_hours 24."
            - "No SiteEvent, talkgroup or talkpath touches any of the three sites, so each site's version is still the creation version when its coverage is submitted."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/sites"
              payload: { site_code: "COV-A", name: "Ridge Alpha", channel_capacity: 8, backup_power_type: "GENERATOR", generator_fuel_hours: 24 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_a_id: "$.data.id", site_a_v: "$.data.version" }
            - call: "POST /radio-system/sites"
              payload: { site_code: "COV-B", name: "Ridge Bravo", channel_capacity: 8, backup_power_type: "BATTERY_ONLY", battery_runtime_minutes: 240 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_b_id: "$.data.id", site_b_v: "$.data.version" }
            - call: "POST /radio-system/sites"
              payload: { site_code: "COV-C", name: "Ridge Charlie", channel_capacity: 8, backup_power_type: "GENERATOR", generator_fuel_hours: 24 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_c_id: "$.data.id", site_c_v: "$.data.version" }
          trigger:
            - call: "PATCH /radio-system/sites/${site_a_id}/coverage"
              payload: { covered_test_points: 970, total_test_points: 1000, expected_site_version: "${site_a_v}" }
              as: RFEngineer
              as_user_id: "rf-1"
            - call: "PATCH /radio-system/sites/${site_b_id}/coverage"
              payload: { covered_test_points: 985, total_test_points: 1000, expected_site_version: "${site_b_v}" }
              as: RFEngineer
              as_user_id: "rf-1"
            - call: "PATCH /radio-system/sites/${site_c_id}/coverage"
              payload: { covered_test_points: 985, total_test_points: 1000, expected_site_version: "${site_c_v}" }
              as: RFEngineer
              as_user_id: "rf-1"
          assert:
            - "Site.${site_a_id}.coverage_reliability_pct == 96.5"
            - "Site.${site_a_id}.coverage_derate_tier == A"
            - "Site.${site_a_id}.coverage_class == GENERAL"
            - "Site.${site_a_id}.coverage_reliability_pct != 95.5 (a second tier selection from the derated value is forbidden)"
            - "Site.${site_b_id}.coverage_reliability_pct == 96.0 and Site.${site_b_id}.coverage_derate_tier == A and Site.${site_b_id}.coverage_class == GENERAL"
            - "Site.${site_c_id}.coverage_reliability_pct == 98.0 and Site.${site_c_id}.coverage_derate_tier == A and Site.${site_c_id}.coverage_class == MISSION_CRITICAL"
            - "Site.${site_b_id}.coverage_reliability_pct != Site.${site_c_id}.coverage_reliability_pct on identical 985/1000 input (BATTERY_ONLY_PENALTY_PP is 2.0)"
            - "Site.${site_a_id}.version == ${site_a_v} + 1"

  - rule_id: non_linear_state_machine
    instances:
      - name: subscriber_unit_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.SubscriberUnit.INVENTORY_to_ASSIGNED
          - state_machines.SubscriberUnit.ASSIGNED_to_SUSPENDED
          - state_machines.SubscriberUnit.SUSPENDED_to_ASSIGNED
          - state_machines.SubscriberUnit.KEYLESS_to_KEYED
          - state_machines.SubscriberUnit.KEYED_to_ZEROIZED
          - entities.SubscriberUnit.fields.provision_status
          - entities.SubscriberUnit.fields.key_status
        distinguishing_aspect: |
