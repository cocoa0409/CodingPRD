            - { call: "POST /awareness/phishing-templates/${t_ok}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { t_ok_v: "$.data.version" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Blocked Once Template", pretext_category: "PASSWORD_EXPIRY", difficulty_tier: "TIER_1_BASIC", theme_tags: ["URGENCY"], credential_capture_enabled: false }, as: ProgramAdmin, captures: { t_bad: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${t_bad}/block", payload: { blocked_reason: "Lure overlaps an active real-world campaign." }, as: ProgramAdmin }
