              as_user_id: "qi-1"
              captures: { tier_c: $.data.readiness_tier }
            - call: "GET /evfleet/suppliers/${sup_id}/battery-modules"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { m1_q: "$.data[0].quality_status", m2_q: "$.data[1].quality_status" }
            - call: "GET /evfleet/vehicle-orders/${ord_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { flag_c: $.data.supply_risk_flag, prom_c: $.data.promised_delivery_date }
            - call: "POST /evfleet/suppliers/${sup_id}/readiness-audits"
              payload: { on_time_pct: 90.0, first_pass_yield_pct: 93.0, open_corrective_actions: 1 }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { tier_b: $.data.readiness_tier }
            - call: "GET /evfleet/vehicle-orders/${ord_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { flag_b: $.data.supply_risk_flag, prom_b: $.data.promised_delivery_date }
          assert:
            - "tier_c == C (all three A-conditions and the B-conditions failed)"
            - "exactly one module quarantined: the IN_QA module shows QUARANTINED while the PASSED module stays PASSED (conditional cascade)"
            - "flag_c == true and prom_c == \"2026-10-20\" (35-day promise 2026-10-06 pushed +14)"
            - "tier_b == B after recovery; flag_b == false; the quarantined module is back IN_QA with failure_count preserved at 0"
            - "prom_b == \"2026-10-20\" — recovery never pulls the promised date back"

  # ===========================================================================
  - section: calculations
    instances:

      - name: supplier_readiness_tier_boundary_values
        claim_type: Constants Applied
        grounds:
          - calculations.supplier_readiness_scoring
        distinguishing_aspect: "Tier breakpoints are inclusive: exactly 95.0 / 98.0 / 0 corrective yields A, while 94.9 on-time (with otherwise A-grade numbers) drops all the way past B only if B also fails — here 94.9 / 98.0 / 0 yields B; 94.9 / 91.9 / 3 yields C."
        test_recipe:
          setup:
            - "Logical clock set; three suppliers registered."
          setup_api_calls:
            - *c_clock
            - *c_sup
            - call: "POST /evfleet/suppliers"
              payload: { name: "VoltBeta", contact_email: "s@voltbeta.test" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { sup_b_id: $.data.id }
            - call: "POST /evfleet/suppliers"
              payload: { name: "VoltGamma", contact_email: "s@voltgamma.test" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { sup_c_id: $.data.id }
          trigger:
            - call: "POST /evfleet/suppliers/${sup_id}/readiness-audits"
              payload: { on_time_pct: 95.0, first_pass_yield_pct: 98.0, open_corrective_actions: 0 }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { tier_a: $.data.readiness_tier }
            - call: "POST /evfleet/suppliers/${sup_b_id}/readiness-audits"
              payload: { on_time_pct: 94.9, first_pass_yield_pct: 98.0, open_corrective_actions: 0 }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { tier_b: $.data.readiness_tier }
            - call: "POST /evfleet/suppliers/${sup_c_id}/readiness-audits"
              payload: { on_time_pct: 94.9, first_pass_yield_pct: 91.9, open_corrective_actions: 3 }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { tier_c: $.data.readiness_tier }
          assert:
            - "tier_a == A (95.0 >= 95.0 and 98.0 >= 98.0 and 0 == 0 — inclusive boundaries)"
            - "tier_b == B (94.9 < 95.0 misses A; 94.9 >= 85.0 and 98.0 >= 92.0 and 0 <= 2 hits B)"
            - "tier_c == C (91.9 < 92.0 misses B as well)"
            - "audit fields persisted: Supplier.${sup_id}.last_on_time_pct == 95.0"

