          trigger:
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${e2}", type: PEER, points_requested: 200, reason_code: TEAMWORK, message: "dupe", idempotency_key: "val-dup-2" }, as: Employee, as_user_id: "${e1}", captures: { err: $.data.error_id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${e2}", type: PEER, points_requested: 200, reason_code: INNOVATION, message: "different reason", idempotency_key: "val-dup-3" }, as: Employee, as_user_id: "${e1}", captures: { ok_id: $.data.id } }
