              payload: { sku: "SH-B1", manufacturer_name: "Acme", color_code: "BLK", bundles_per_square: 4.0, base_price_per_bundle_cents: 3000 }
              as: PlatformAdmin
              captures: { prod_b1: $.data.id }
            - call: "POST /roofing/branches/${br_b1}/inventory-lots"
              payload: { product_id: "${prod_b1}", lot_code: "LOT-B", on_hand_bundles: 500 }
              as: WarehouseClerk
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "Boundary Co", credit_limit_cents: 10000000, pricing_tier: "STANDARD" }
              as: CreditAnalyst
              captures: { ca_b1: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_b1}/job-accounts"
              payload: { job_name: "Job B", site_address: "9 Maple St" }
              as: CreditAnalyst
              captures: { ja_b1: $.data.id }
            - call: "POST /roofing/job-accounts/${ja_b1}/takeoffs"
              payload: { product_id: "${prod_b1}", roof_squares: 10.0, waste_factor_pct: 0, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_b1: $.data.id }
            - call: "POST /roofing/takeoffs/${tk_b1}/quote"
              payload: {}
              as: SalesRep
            - call: "POST /roofing/takeoffs/${tk_b1}/convert"
              payload: { branch_id: "${br_b1}" }
              as: Contractor
              as_user_id: "${ca_b1}"
              captures: { ord_b1: $.data.id }
            - call: "GET /roofing/contractor-accounts/${ca_b1}"
              payload: {}
              as: CreditAnalyst
              captures: { ca_b1_v: $.data.version }
            - call: "POST /roofing/orders/${ord_b1}/confirm"
              payload: { expected_contractor_account_version: "${ca_b1_v}" }
              as: Contractor
              as_user_id: "${ca_b1}"
            - call: "POST /roofing/branches/${br_b1}/delivery-slots"
              payload: { slot_date: "2026-08-14", window: "AM", equipment_type: "ROOFTOP_CONVEYOR", capacity: 2 }
              as: Dispatcher
              captures: { slot_b1: $.data.id }
          trigger:
            - call: "POST /roofing/orders/${ord_b1}/deliveries"
              payload: { delivery_slot_id: "${slot_b1}", equipment_type: "ROOFTOP_CONVEYOR" }
              as: Dispatcher
              captures: { dlv_b1_fee: $.data.fee_cents, dlv_b1_crane: $.data.crane_fee_cents }
          assert:
            - "Delivery fee_cents == 22500 (exactly 40 bundles -> no heavy surcharge)"
            - "Delivery crane_fee_cents == 0 (equipment ROOFTOP_CONVEYOR, not CRANE)"

      - name: return_at_exactly_delivered_quantity_accepted
        grounds:
          - state_machines.Return.REQUESTED_to_APPROVED
          - entities.OrderLine.fields.returned_bundles
        distinguishing_aspect: |
          Metric = cumulative returned_bundles vs delivered_bundles; boundary
          is <= (inclusive), so returning the full delivered quantity is
          accepted while one more bundle would fail with
          ERR_RETURN_QUANTITY_EXCEEDED. Reached through POST
          /orders/{id}/returns then /approve.
        test_recipe:
          setup:
            - "Order with one line of 10 bundles, fully DELIVERED"
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-B2", name: "Boundary2", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_b2: $.data.id }
