              call: "POST /api/companies/${c_company2_id}/bank_connections/${c_bc_id}/transactions"
              payload: { posted_at: "2026-09-10T00:00:00Z", amount_cents: -1500, payee_raw: "X" }
              as: PlatformAdmin
              captures: { c_txn_d1_id: $.data.id }
            - call: "POST /api/companies/${c_company2_id}/bank_transactions/${c_txn_d1_id}/categorize"
              payload: { category_id: "${c_cat_a_id}" }
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
            - &c_recon_d
              call: "POST /api/companies/${c_company2_id}/reconciliations"
              payload: { company_id: "${c_company2_id}", bank_connection_id: "${c_bc_id}", statement_period_start: "2026-09-01T00:00:00Z", statement_period_end: "2026-09-30T00:00:00Z", statement_ending_balance_cents: -1500 }
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
              captures: { c_recon_d_id: $.data.id }
            - call: "POST /api/companies/${c_company2_id}/reconciliations/${c_recon_d_id}/start"
              payload: {}
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
          trigger:
            - call: "GET /api/companies/${c_company2_id}/reconciliations/${c_recon_d_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c_cleared1: $.data.cleared_cents, c_diff1: $.data.difference_cents }
            - call: "POST /api/companies/${c_company2_id}/bank_transactions/${c_txn_d1_id}/exclude"
              payload: {}
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
            - call: "GET /api/companies/${c_company2_id}/reconciliations/${c_recon_d_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c_cleared2: $.data.cleared_cents, c_diff2: $.data.difference_cents }
          assert:
            - "c_cleared1 == -1500 (one CATEGORIZED txn in window)"
            - "c_diff1 == 0 (statement_ending -1500 - (0 + -1500))"
            - "c_cleared2 == 0 (txn excluded -> removed from cleared set)"
            - "c_diff2 == -1500 (recomputed on read)"

