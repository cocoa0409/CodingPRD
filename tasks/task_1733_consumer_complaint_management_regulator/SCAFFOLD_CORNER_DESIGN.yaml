              captures: { tid: $.data.id }
            - call: "POST /complaint-office/response-templates/${tid}/publish"
              payload: {}
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-V8", channel_code: "WEB", product_code: "P-V8", category_code: "C.V8", narrative: "uses template" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /complaint-office/complaints/${cid}/triage"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${cid}/start_investigation"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${cid}/rcas"
              payload: { verdict: "SUBSTANTIATED", linked_product_code: "P-V8", process_step: "ST" }
              as: CaseHandler
              captures: { rid: $.data.id }
            - call: "POST /complaint-office/rcas/${rid}/complete"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${cid}/draft_response"
              payload: { response_text: "with template", response_template_key: "TPL-BUSY" }
              as: CaseHandler
          trigger:
            - call: "POST /complaint-office/response-templates/${tid}/retire"
              payload: {}
              as: ComplaintManager
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_TEMPLATE_IN_USE"
            - "ResponseTemplate.${tid}.status == ACTIVE (unchanged)"

      - name: error_complaint_not_remediable_from_intake
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors[ERR_COMPLAINT_NOT_REMEDIABLE]
        distinguishing_aspect: "Submit on a decision whose parent complaint is still INTAKE fails with ERR_COMPLAINT_NOT_REMEDIABLE — the decision exists (create is allowed with a matching version) but submit gates on complaint state."
        test_recipe:
          setup: ["Complaint INTAKE; decision created against it (create allowed) and still DRAFT"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-V9", display_name: "V9" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.V9" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-V9", channel_code: "WEB", product_code: "P-V9", category_code: "C.V9", narrative: "early remediation" }
              as: IntakeSpecialist
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /complaint-office/complaints/${cid}/remediation_decisions"
              payload: { decision_type: "RESTITUTION", line_items: [ { label: "fee", amount_cents: 3000 } ], expected_complaint_version: "${cv}" }
              as: CaseHandler
              captures: { did: $.data.id }
          trigger:
            - call: "POST /complaint-office/remediation-decisions/${did}/submit"
              payload: {}
              as: CaseHandler
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_COMPLAINT_NOT_REMEDIABLE"
            - "RemediationDecision.${did}.status == DRAFT (unchanged)"

