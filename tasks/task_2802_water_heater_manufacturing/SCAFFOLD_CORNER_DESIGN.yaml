      - name: foam_thickness_floor_beats_r_value_shortfall_rejected
        claim_type: priority_ordering
        grounds:
          - validations[priority 35]
          - validations[priority 36]
          - calculations.insulation_r_value_achieved
          - errors[ERR_FOAM_THICKNESS_BELOW_MINIMUM]
          - errors[ERR_INSULATION_R_VALUE_SHORTFALL]
          - state_machines.TankLot.LINING_VERIFIED_to_FOAMED
        distinguishing_aspect: >
          39 mm violates BOTH rules (it is under the 40 mm floor and yields only R-15.6 against a declared
          R-20), and priority 35 must win. 49 mm violates only the second and yields R-19.6, one tenth short, so
          the comparison is on the ROUNDED achieved value rather than the raw millimetres. 50 mm yields exactly
          R-20.0 and must pass, because the comparison is >=. foam_density_kg_m3 never enters the arithmetic.
        test_recipe:
          setup:
            - "Tank lot TL-001 is LINING_VERIFIED against fired batch GLB-001."
            - "Its ProductModel GX50-T declares insulation_r_value 20."
            - "R_VALUE_PER_MM is 0.4 and MIN_FOAM_THICKNESS_MM is 40."
            - "The lot has planned_quantity 120, wip_quantity 120 and rework_count 0."
          setup_api_calls:
            - call: "POST /mfg/product-models"
              payload: { model_code: "GX50-T", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
              as: ComplianceEngineer
