  # ===================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_card_monthly_cap_rollover_boundary
        grounds:
          - calculations.claim_amount_quote
        distinguishing_aspect: |
          Interval semantics: calendar-month aggregate window with an
          INCLUSIVE month boundary — approvals made in September consume the
          September cap; an approval on October 1st starts a fresh window and
          is NOT clamped by September's residue. A claim of 200 units (20000
          gross) against cap 25000 after a 20000 September approval clamps to
          5000 in September, but an identical claim approved after the clock
          crosses into October approves at the full 20000 — same resource
          (funder-month bucket), different window.
        test_recipe:
          setup:
            - "Rate card cap 25000, rate 100; two completed referrals with 200 units each; first claim approved in September; clock advanced to October before second approval"
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: NetworkCoordinator }
            - call: "POST /care-network/networks"
