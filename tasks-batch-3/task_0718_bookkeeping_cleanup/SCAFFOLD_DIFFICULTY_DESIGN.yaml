scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: taxable_income_cash_vs_accrual_diverge
        grounds:
          - calculations.taxable_income
          - entities.Client.fields.accounting_basis
          - entities.TaxPackage.fields.net_book_income_cents
        distinguishing_aspect: |
          On identical POSTED entries, an ACCRUAL-basis Client yields
          net_book_income_cents == 510000 (counts unsettled income/expense) while a
          CASH-basis Client yields 420000 (only cash_settled entries) — divergence
          driven by Client.accounting_basis on the TaxPackage entity domain.
        test_recipe:
          setup:
            - "ACCRUAL engagement past reconciliation with income/expense entries, some cash_settled and some not; recon IN_BALANCE; no blocking exceptions."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Acme Accrual", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Catch-up", period_start: "2025-01-01", period_end: "2025-06-30", complexity_tier: "MEDIUM" }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/scope-estimates"
              payload: { monthly_txn_rate: 220 }
              as: EngagementManager
              captures: { se_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scope-estimates/${se_id}/accept"
              payload: { expected_engagement_version: "${eng_v0}" }
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/accounts"
              payload: { account_code: "4000", name: "Sales Income", account_type: "INCOME", is_bank_account: false }
              as: Bookkeeper
              captures: { inc_acct: $.data.id }
            - call: "POST /engagements/${eng_id}/accounts"
              payload: { account_code: "5000", name: "Operating Expense", account_type: "EXPENSE", is_bank_account: false }
              as: Bookkeeper
              captures: { exp_acct: $.data.id }
            - call: "POST /engagements/${eng_id}/entries"
              payload: { account_id: "${inc_acct}", txn_date: "2025-02-01", side: "CREDIT", amount_cents: 500000 }
              as: Bookkeeper
              captures: { e_inc_s: $.data.id }
            - call: "POST /engagements/${eng_id}/entries/${e_inc_s}/post"
              payload: {}
              as: Bookkeeper
            - call: "POST /engagements/${eng_id}/entries"
              payload: { account_id: "${inc_acct}", txn_date: "2025-03-01", side: "CREDIT", amount_cents: 120000 }
              as: Bookkeeper
              captures: { e_inc_u: $.data.id }
            - call: "POST /engagements/${eng_id}/entries/${e_inc_u}/post"
              payload: {}
              as: Bookkeeper
            - call: "POST /engagements/${eng_id}/entries"
              payload: { account_id: "${exp_acct}", txn_date: "2025-02-15", side: "DEBIT", amount_cents: 80000 }
              as: Bookkeeper
              captures: { e_exp_s: $.data.id }
            - call: "POST /engagements/${eng_id}/entries/${e_exp_s}/post"
              payload: {}
              as: Bookkeeper
            - call: "POST /engagements/${eng_id}/entries"
              payload: { account_id: "${exp_acct}", txn_date: "2025-03-15", side: "DEBIT", amount_cents: 30000 }
              as: Bookkeeper
              captures: { e_exp_u: $.data.id }
            - call: "POST /engagements/${eng_id}/entries/${e_exp_u}/post"
              payload: {}
              as: Bookkeeper
            - call: "POST /engagements/${eng_id}/accounts/${inc_acct}/categorize"
              payload: {}
              as: Bookkeeper
            - call: "POST /engagements/${eng_id}/accounts/${exp_acct}/categorize"
              payload: {}
              as: Bookkeeper
            - call: "POST /engagements/${eng_id}/advance-to-reconciliation"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/accounts/${inc_acct}/mark-reconciled"
              payload: {}
              as: Reviewer
              as_user_id: "reviewer-1"
            - call: "POST /engagements/${eng_id}/accounts/${exp_acct}/mark-reconciled"
              payload: {}
              as: Reviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /engagements/${eng_id}/tax-packages"
              payload: {}
              as: TaxPreparer
              captures: { tp_income: $.data.net_book_income_cents }
          assert:
            - "TaxPackage.basis == ACCRUAL"
            - "TaxPackage.net_book_income_cents == 510000"

      - name: scope_volume_forward_vs_actual_diverge
        grounds:
          - calculations.scope_volume_estimate
          - entities.ScopeEstimate.fields.txn_volume_estimate
          - entities.LedgerEntry.fields.txn_date
        distinguishing_aspect: |
          The forward variant computes estimated_txn_volume == 1518 from
          monthly_txn_rate*months*tier on ScopeEstimate, whereas the
          actual_reconstructed variant on GET /volume-actuals counts POSTED
          non-REVERSED LedgerEntry rows (== 2 here), a different entity domain and
          a chronological count rather than a forecast.
        test_recipe:
          setup:
            - "Engagement scoped at volume 1518 with exactly 2 posted in-period ledger entries."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Volume Co", entity_type: "S_CORP", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Vol", period_start: "2025-01-01", period_end: "2025-06-30", complexity_tier: "MEDIUM" }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/scope-estimates"
              payload: { monthly_txn_rate: 220 }
              as: EngagementManager
              captures: { se_id: $.data.id, se_vol: $.data.txn_volume_estimate }
            - call: "POST /engagements/${eng_id}/scope-estimates/${se_id}/accept"
              payload: { expected_engagement_version: "${eng_v0}" }
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/accounts"
              payload: { account_code: "1000", name: "Cash", account_type: "ASSET", is_bank_account: false }
              as: Bookkeeper
              captures: { acct: $.data.id }
            - call: "POST /engagements/${eng_id}/entries"
              payload: { account_id: "${acct}", txn_date: "2025-02-01", side: "DEBIT", amount_cents: 1000 }
              as: Bookkeeper
              captures: { en1: $.data.id }
            - call: "POST /engagements/${eng_id}/entries/${en1}/post"
              payload: {}
              as: Bookkeeper
            - call: "POST /engagements/${eng_id}/entries"
              payload: { account_id: "${acct}", txn_date: "2025-02-02", side: "CREDIT", amount_cents: 1000 }
              as: Bookkeeper
              captures: { en2: $.data.id }
            - call: "POST /engagements/${eng_id}/entries/${en2}/post"
              payload: {}
              as: Bookkeeper
          trigger:
            - call: "GET /engagements/${eng_id}/volume-actuals"
              payload: {}
              as: EngagementManager
              captures: { actual: $.data.actual_txn_volume, est: $.data.estimated_txn_volume }
          assert:
            - "ScopeEstimate.${se_id}.txn_volume_estimate == 1518"
            - "GET /volume-actuals data.estimated_txn_volume == 1518"
            - "GET /volume-actuals data.actual_txn_volume == 2"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fixed_price_tiered_marginal_rate
        grounds:
          - calculations.fixed_price_quote
          - entities.CleanupEngagement.fields.estimated_txn_volume
          - entities.CleanupEngagement.fields.billing_status
        distinguishing_aspect: |
          Mode (a): tiered-rate selection with 3 inputs and branch on volume —
          vol 1518 lands in the third tier so price == 90540 (BASE + 1000*RATE1 +
          18*RATE2), not the average-rate product.
        test_recipe:
          setup:
            - "Engagement with estimated_txn_volume 1518, scope_locked true, billing UNBILLED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Tier Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Tier", period_start: "2025-01-01", period_end: "2025-06-30", complexity_tier: "MEDIUM" }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/scope-estimates"
              payload: { monthly_txn_rate: 220 }
              as: EngagementManager
              captures: { se_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scope-estimates/${se_id}/accept"
              payload: { expected_engagement_version: "${eng_v0}" }
              as: EngagementManager
          trigger:
            - call: "POST /engagements/${eng_id}/quote"
              payload: {}
              as: EngagementManager
              captures: { bstatus: $.data.billing_status }
          assert:
            - "CleanupEngagement.${eng_id}.billing_status == QUOTED"
            - "CleanupEngagement.${eng_id}.estimated_txn_volume == 1518"

      - name: phase_split_residual_rounding_order
        grounds:
          - calculations.phase_billing_split
          - entities.Phase.fields.amount_cents
          - entities.Phase.fields.weight_bp
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — round_half_up each non-last
          phase then assign the residual to the last phase by phase_index ASC. With
          price 90540 and weights 3333/3333/3334 the amounts are 30177, 30177, 30186
          summing exactly to 90540 (per-phase rounding alone would not sum to price).
        test_recipe:
          setup:
            - "Quoted engagement (price 90540) with three phases weighted 3333/3333/3334, ready to generate."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Split Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Split", period_start: "2025-01-01", period_end: "2025-06-30", complexity_tier: "MEDIUM" }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/scope-estimates"
              payload: { monthly_txn_rate: 220 }
              as: EngagementManager
              captures: { se_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scope-estimates/${se_id}/accept"
              payload: { expected_engagement_version: "${eng_v0}" }
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/quote"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/phases"
              payload: { phase_index: 1, label: "Reconstruction", weight_bp: 3333 }
              as: EngagementManager
              captures: { ph1: $.data.id }
            - call: "POST /engagements/${eng_id}/phases"
              payload: { phase_index: 2, label: "Reconciliation", weight_bp: 3333 }
              as: EngagementManager
              captures: { ph2: $.data.id }
            - call: "POST /engagements/${eng_id}/phases"
              payload: { phase_index: 3, label: "Handoff", weight_bp: 3334 }
              as: EngagementManager
              captures: { ph3: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/phases/generate"
              payload: {}
              as: EngagementManager
          assert:
            - "Phase.${ph1}.amount_cents == 30177"
            - "Phase.${ph2}.amount_cents == 30177"
            - "Phase.${ph3}.amount_cents == 30186"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: engagement_parallel_workflow_billing_dimensions
        grounds:
          - state_machines.CleanupEngagement.UNBILLED_to_QUOTED
          - entities.CleanupEngagement.fields.workflow_status
          - entities.CleanupEngagement.fields.billing_status
        distinguishing_aspect: |
          Engagement has two independent state dimensions: quoting advances
          billing_status UNBILLED->QUOTED while workflow_status stays RECONSTRUCTION
          — the two axes evolve independently on the same row.
        test_recipe:
          setup:
            - "Engagement in RECONSTRUCTION with scope_locked true and billing UNBILLED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Parallel Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Par", period_start: "2025-01-01", period_end: "2025-06-30", complexity_tier: "MEDIUM" }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/scope-estimates"
              payload: { monthly_txn_rate: 220 }
              as: EngagementManager
              captures: { se_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scope-estimates/${se_id}/accept"
              payload: { expected_engagement_version: "${eng_v0}" }
              as: EngagementManager
          trigger:
            - call: "POST /engagements/${eng_id}/quote"
              payload: {}
              as: EngagementManager
          assert:
            - "CleanupEngagement.${eng_id}.billing_status == QUOTED"
            - "CleanupEngagement.${eng_id}.workflow_status == RECONSTRUCTION"

      - name: exception_cycle_open_waiting_open
        grounds:
          - state_machines.Exception.OPEN_to_WAITING_DOCS
          - state_machines.Exception.WAITING_DOCS_to_OPEN
          - entities.Exception.fields.status
        distinguishing_aspect: |
          The Exception machine is cyclic on a different entity: a MISSING_DOC
          exception goes OPEN -> WAITING_DOCS (request-docs) -> OPEN (docs-received),
          returning to OPEN — a true loop, not a forward-only pipeline.
        test_recipe:
          setup:
            - "Engagement in RECONSTRUCTION with a categorized account and a MISSING_DOC exception OPEN."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Cycle Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Cyc", period_start: "2025-01-01", period_end: "2025-06-30", complexity_tier: "MEDIUM" }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/scope-estimates"
              payload: { monthly_txn_rate: 220 }
              as: EngagementManager
              captures: { se_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scope-estimates/${se_id}/accept"
              payload: { expected_engagement_version: "${eng_v0}" }
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/accounts"
              payload: { account_code: "1000", name: "Cash", account_type: "ASSET", is_bank_account: false }
              as: Bookkeeper
              captures: { acct: $.data.id }
            - call: "POST /engagements/${eng_id}/exceptions"
              payload: { account_id: "${acct}", kind: "MISSING_DOC", severity: "NORMAL", doc_due_date: "2025-07-15" }
              as: Bookkeeper
              captures: { x_id: $.data.id }
            - call: "POST /engagements/${eng_id}/exceptions/${x_id}/request-docs"
              payload: {}
              as: Bookkeeper
          trigger:
            - call: "POST /engagements/${eng_id}/exceptions/${x_id}/docs-received"
              payload: {}
              as: Bookkeeper
          assert:
            - "Exception.${x_id}.status == OPEN"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: pay_invoice_cascades_phase_billing_settled
        grounds:
          - state_machines.Phase.INVOICED_to_PAID
          - state_machines.CleanupEngagement.PHASED_to_SETTLED
          - entities.PhaseInvoice.fields.status
        distinguishing_aspect: |
          Depth-3 cascade: paying the last invoice (action on PhaseInvoice) flips
          PhaseInvoice -> PAID, which flips its Phase -> PAID, which (all phases now
          PAID) bubbles engagement.billing_status PHASED -> SETTLED. Each hop is
          caused by the prior hop.
        test_recipe:
          setup:
            - "Single-phase engagement (weight 10000) phased, invoiced, awaiting payment."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Cascade Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Casc", period_start: "2025-01-01", period_end: "2025-06-30", complexity_tier: "MEDIUM" }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/scope-estimates"
              payload: { monthly_txn_rate: 220 }
              as: EngagementManager
              captures: { se_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scope-estimates/${se_id}/accept"
              payload: { expected_engagement_version: "${eng_v0}" }
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/quote"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/phases"
              payload: { phase_index: 1, label: "All", weight_bp: 10000 }
              as: EngagementManager
              captures: { ph1: $.data.id }
            - call: "POST /engagements/${eng_id}/phases/generate"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/phases/${ph1}/invoice"
              payload: {}
              as: EngagementManager
              captures: { inv1: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/invoices/${inv1}/pay"
              payload: {}
              as: EngagementManager
          assert:
            - "PhaseInvoice.${inv1}.status == PAID"
            - "Phase.${ph1}.status == PAID"
            - "CleanupEngagement.${eng_id}.billing_status == SETTLED"

      - name: statement_finalize_cascades_settle_and_readiness
        grounds:
          - state_machines.BankStatement.RECONCILING_to_RECONCILED
          - entities.LedgerEntry.fields.cash_settled
          - calculations.readiness_score
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: finalizing a statement marks the
          matched LedgerEntry.cash_settled = true, which is what then permits the
          account to be marked RECONCILED and bumps engagement.readiness_score — the
          settlement flag is the intermediate caused effect.
        test_recipe:
          setup:
            - "Bank account with one posted in-period entry matched to a balanced statement, statement RECONCILING."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Recon Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Recon", period_start: "2025-01-01", period_end: "2025-06-30", complexity_tier: "MEDIUM" }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/scope-estimates"
              payload: { monthly_txn_rate: 220 }
              as: EngagementManager
              captures: { se_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scope-estimates/${se_id}/accept"
              payload: { expected_engagement_version: "${eng_v0}" }
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/accounts"
              payload: { account_code: "1010", name: "Checking", account_type: "ASSET", is_bank_account: true }
              as: Bookkeeper
              captures: { bank: $.data.id }
            - call: "POST /engagements/${eng_id}/entries"
              payload: { account_id: "${bank}", txn_date: "2025-02-01", side: "DEBIT", amount_cents: 340000 }
              as: Bookkeeper
              captures: { be: $.data.id }
            - call: "POST /engagements/${eng_id}/entries/${be}/post"
              payload: {}
              as: Bookkeeper
            - call: "POST /engagements/${eng_id}/accounts/${bank}/categorize"
              payload: {}
              as: Bookkeeper
            - call: "POST /engagements/${eng_id}/advance-to-reconciliation"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/statements"
              payload: { account_id: "${bank}", statement_start: "2025-02-01", statement_end: "2025-02-28", ending_balance_cents: 350000, deposits_in_transit_cents: 15000, outstanding_checks_cents: 25000 }
              as: Reviewer
              as_user_id: "reviewer-1"
              captures: { stmt: $.data.id }
            - call: "POST /engagements/${eng_id}/statements/${stmt}/reconciliation-items"
              payload: { ledger_entry_id: "${be}", statement_line_amount_cents: 340000, match_kind: "EXACT" }
              as: Reviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /engagements/${eng_id}/statements/${stmt}/finalize"
              payload: {}
              as: Reviewer
              as_user_id: "reviewer-1"
          assert:
            - "BankStatement.${stmt}.status == RECONCILED"
            - "LedgerEntry.${be}.cash_settled == true"
            - "CleanupEngagement.${eng_id}.recon_status == IN_BALANCE"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: tax_build_blocking_exception_beats_recon_balance
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_BLOCKING_EXCEPTIONS_OPEN]
        distinguishing_aspect: |
          business_safety (priority 9, ERR_BLOCKING_EXCEPTIONS_OPEN) outranks
          business_constraint (priority 10, ERR_RECON_NOT_IN_BALANCE): an engagement
          that is both out-of-balance AND has an open BLOCKING exception returns
          ERR_BLOCKING_EXCEPTIONS_OPEN on tax build.
        test_recipe:
          setup:
            - "Engagement in RECONCILIATION, recon_status not IN_BALANCE, with one OPEN BLOCKING exception."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "PriA Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "PriA", period_start: "2025-01-01", period_end: "2025-06-30", complexity_tier: "MEDIUM" }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/scope-estimates"
              payload: { monthly_txn_rate: 220 }
              as: EngagementManager
