  - rule_id: combinatorial_formula
    instances:
      - name: additionality_score_four_term_combination
        grounds:
          - calculations.additionality_screening
          - entities.Enrollment.fields.prior_adoption_pct
          - entities.Enrollment.fields.additionality_score
          - entities.Enrollment.fields.documented_years
          - constants.EVIDENCE_WEIGHT
        distinguishing_aspect: |
          additionality_score combines FOUR independent terms that cannot be collapsed into one:
          an evidence-weighted prior-adoption percentage (REMOTE_SENSING acres count at 0.8 and
          the denominator is mapped_acres x lookback, not acres alone), a -20 telemetry-gap
          penalty that is switched off only because ONE 2024 row happens to be
          EQUIPMENT_TELEMETRY even though that row has adopted == false, a +2-per-documented-year
          bonus capped at the lookback, and a post-rounding 0..100 clamp. Dropping any single
          term still yields a plausible-looking number: 12.00 pct prior adoption gives 92.00,
          but weighting REMOTE_SENSING at 1.0 gives 15.00 pct and 87.50, and missing the
          telemetry exemption gives 72.00.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; COVER_CROP standard v1 with lookback 5, max_prior_adoption_pct 20.00, min_documented_years 4, telemetry_required true."
            - "Grower G1 ACTIVE; field F1 (0,0)-(2000,2000) MAPPED with mapped_acres 1000.00, LOAM."
            - "Five PracticeHistory rows on F1 for 2021..2025: 2021 FARM_RECORD adopted 200.00 acres, 2022 REMOTE_SENSING adopted 500.00 acres, 2023 FARM_RECORD not adopted, 2024 EQUIPMENT_TELEMETRY not adopted, 2025 FARM_RECORD not adopted."
            - "A decoy PracticeHistory row on F1 for 2020 (outside the inclusive window 2021..2025) with REDUCED_TILLAGE adopted 900.00 acres, which must not enter either term."
            - "Enrollment E1 created in DRAFT on F1 with start_crop_year 2026 and enrolled_acres 1000.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /practice-standards"
              payload: { practice_code: "COVER_CROP", standard_version: 1, additionality_lookback_years: 5, max_prior_adoption_pct: 20.00, min_documented_years: 4, min_adoption_years: 3, uncertainty_base_pct: 15.00, sequestration_rate_per_acre: 0.3500, modeled_baseline_rate_per_acre: 0.2000, buffer_base_pct: 10.00, telemetry_required: true, effective_from: "2020-01-01" }
              as: ProgramAdmin
              captures: { std_cc_id: $.data.id }
            - call: "POST /growers"
              payload: { legal_name: "Northfield Farms LLC", operator_type: "LLC", tax_id: "91-1122334", mailing_state: "IA" }
              as: ProgramAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /growers/${g1_id}/fields"
              payload: { field_name: "North Quarter", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 2000, boundary_max_y: 2000, gross_acres: 1010.00, soil_group: "LOAM", county_code: "IA-113" }
              as: ProgramAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /fields/${f1_id}/map-confirm"
              payload: { surveyor_reference: "SUR-2026-0001" }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2021, practice_code: "COVER_CROP", adopted: true, evidence_source: "FARM_RECORD", acres: 200.00, observed_emissions_per_acre: 0.1000 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2022, practice_code: "COVER_CROP", adopted: true, evidence_source: "REMOTE_SENSING", acres: 500.00, observed_emissions_per_acre: 0.1200 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2023, practice_code: "COVER_CROP", adopted: false, evidence_source: "FARM_RECORD", acres: 0.00, observed_emissions_per_acre: 0.1400 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2024, practice_code: "COVER_CROP", adopted: false, evidence_source: "EQUIPMENT_TELEMETRY", acres: 0.00, observed_emissions_per_acre: 0.1600 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2025, practice_code: "COVER_CROP", adopted: false, evidence_source: "FARM_RECORD", acres: 0.00, observed_emissions_per_acre: 0.1800 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2020, practice_code: "REDUCED_TILLAGE", adopted: true, evidence_source: "FARM_RECORD", acres: 900.00, observed_emissions_per_acre: 0.5000 }
              as: ProgramAdmin
            - call: "POST /enrollments"
              payload: { field_id: "${f1_id}", practice_standard_id: "${std_cc_id}", commitment_years: 5, start_crop_year: 2026, enrolled_acres: 1000.00, payment_model: "PER_CREDIT", per_credit_share_pct: 60.00 }
              as: ProgramAdmin
              captures: { e1_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${e1_id}/submit"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response.status == 200"
            - "Enrollment.${e1_id}.prior_adoption_pct == 12.00"
            - "Enrollment.${e1_id}.documented_years == 5"
            - "Enrollment.${e1_id}.additionality_score == 92.00"
            - "Enrollment.${e1_id}.status == SCREENING"
            - "additionality_score is NOT 87.50 (which would mean REMOTE_SENSING was weighted 1.0 instead of 0.8)"
            - "additionality_score is NOT 72.00 (which would mean the telemetry-gap penalty fired despite the 2024 EQUIPMENT_TELEMETRY row)"
