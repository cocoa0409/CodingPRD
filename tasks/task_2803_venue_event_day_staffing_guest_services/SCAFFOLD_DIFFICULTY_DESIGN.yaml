            - "StaffingPlan.${plan_a}.total_required_headcount == 0 and projected_labor_cost_cents == 0 after the recompute over the now-CLOSED slot set"
            - "Event.${ev_id}.status is still PLANNED (a second activation does not re-run FORECAST -> PLANNED) and Event.version == ${ev_v1} + 1"
            - "re-issuing POST /staffing-plans/${plan_a}/activate with ${ev_v1} is refused: the plan is SUPERSEDED (ERR_PLAN_STATE_INVALID 409), and the stale version would independently have produced ERR_STALE_EVENT_VERSION"
            - "PositionSlot.${slot_a}.filled_headcount == 0 while status remains CLOSED"

  # =====================================================================================
  # Rule 5 - priority-pair validation conflicts, each instance a DIFFERENT category pair
  # =====================================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_fiscal_on_closed_issue_refund
        grounds:
          - validations[priority=10]
          - validations[priority=23]
          - state_machines.GuestIssue.RESOLVED_to_CLOSED
          - calculations.event_refund_budget_ledger
          - errors.ERR_ISSUE_STATE_INVALID
          - errors.ERR_REFUND_BUDGET_EXHAUSTED
        distinguishing_aspect: |
          Category pair state (priority 10) versus business_fiscal (priority 23), 13 priority levels
          apart. The event's refund budget is fully consumed AND the target issue is CLOSED, so both
          rules are violated by one request; priority 10 must win with ERR_ISSUE_STATE_INVALID. A
          second, control request on a still-IN_PROGRESS issue proves priority 23 is genuinely live
          rather than unreachable - the naive implementation that checks the budget first returns
          ERR_REFUND_BUDGET_EXHAUSTED for both and fails only the first assertion.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T18:00:00Z; Event IN_PROGRESS with refund_budget_total_cents 5000."
            - "One ACTIVE member holding a VALID CODE_OF_CONDUCT certification, used to assign every issue."
            - "Issue A (OTHER / MEDIUM) has consumed the whole budget: refund-request 5000, supervisor APPROVE (effective cap 5000 = min(5000 role cap, 0 uplift, 5000 available) so refund_status APPROVED and the issue stays IN_PROGRESS), then resolved as REFUND. Event.refund_budget_remaining_cents == 0."
            - "Issue B (OTHER / MEDIUM) has refund-request 4000 filed (refund_status PENDING), was resolved as NO_ACTION, and then closed after the clock advanced 1441 minutes past its resolved_at."
            - "Issue C (OTHER / MEDIUM) is IN_PROGRESS with refund-request 1000 filed and never decided."
            - "Three distinct X-User-IDs are used per issue so segregation of duties (priority 8) never fires: u-sup-report files the issue, u-sup-file files the refund ask, u-sup-decide or u-dir-decide decides."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T18:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Priority Pair Fixture A", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 20000, refund_budget_total_cents: 5000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /position-types"
              payload: { code: "GUEST_SERVICES_REP", display_name: "Guest Services Rep", base_hourly_rate_cents: 2400, attendance_ratio_per_1000: 0.35, min_headcount: 2, required_certifications: ["CODE_OF_CONDUCT"] }
              as: StaffingCoordinator
              captures: { pt_gsr_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_gsr_id}", zone_code: "Z410", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Nia Frost", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-01-01T00:00:00Z", hourly_rate_cents: 2400 }
              as: StaffingCoordinator
              captures: { sm_id: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${sm_id}", cert_type: "CODE_OF_CONDUCT", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v0}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "TEXT_LINE", category: "OTHER", severity: "MEDIUM", description: "Budget-consuming complaint" }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-report"
              captures: { gi_a: $.data.id }
            - call: "POST /guest-issues/${gi_a}/assign"
              payload: { staff_member_id: "${sm_id}" }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-report"
            - call: "POST /guest-issues/${gi_a}/refund-request"
              payload: { refund_requested_cents: 5000 }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-file"
            - call: "POST /guest-issues/${gi_a}/refund-decision"
              payload: { decision: "APPROVE" }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-decide"
            - call: "POST /guest-issues/${gi_a}/resolve"
              payload: { resolution_type: "REFUND" }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-decide"
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "TEXT_LINE", category: "OTHER", severity: "MEDIUM", description: "Second complaint, to be closed" }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-report"
              captures: { gi_b: $.data.id }
            - call: "POST /guest-issues/${gi_b}/assign"
              payload: { staff_member_id: "${sm_id}" }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-report"
            - call: "POST /guest-issues/${gi_b}/refund-request"
              payload: { refund_requested_cents: 4000 }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-file"
            - call: "POST /guest-issues/${gi_b}/resolve"
              payload: { resolution_type: "NO_ACTION" }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-decide"
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "TEXT_LINE", category: "OTHER", severity: "MEDIUM", description: "Third complaint, control for the budget rule" }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-report"
              captures: { gi_c: $.data.id }
            - call: "POST /guest-issues/${gi_c}/assign"
              payload: { staff_member_id: "${sm_id}" }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-report"
            - call: "POST /guest-issues/${gi_c}/refund-request"
              payload: { refund_requested_cents: 1000 }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-file"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:01:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /guest-issues/${gi_b}/close"
              payload: {}
              as: GuestServicesSupervisor
              as_user_id: "u-sup-report"
          trigger:
            - call: "POST /guest-issues/${gi_b}/refund-decision"
              payload: { decision: "APPROVE" }
              as: GuestExperienceDirector
              as_user_id: "u-dir-decide"
            - call: "POST /guest-issues/${gi_c}/refund-decision"
              payload: { decision: "APPROVE" }
              as: GuestExperienceDirector
              as_user_id: "u-dir-decide"
          assert:
            - "the first trigger returns 409 with data.error_id == ERR_ISSUE_STATE_INVALID, NOT ERR_REFUND_BUDGET_EXHAUSTED (priority 10 outranks priority 23)"
            - "GuestIssue.${gi_b}.status == CLOSED, refund_status == PENDING, refund_approved_cents == 0 and refund_decided_by_user_id == null after the refusal"
            - "the second trigger returns 409 with data.error_id == ERR_REFUND_BUDGET_EXHAUSTED, proving priority 23 is reachable on an issue whose own state is legal"
            - "GuestIssue.${gi_c}.status == IN_PROGRESS and refund_status == PENDING after that refusal"
            - "Event.${ev_id}.refund_approved_total_cents == 5000 and refund_budget_remaining_cents == 0 both before and after both triggers"
            - "GuestIssue.${gi_a}.refund_status == APPROVED, refund_approved_cents == 5000, status == RESOLVED, resolution_type == REFUND (the only issue that ever moved money)"

      - name: safety_beats_constraint_on_uncertified_full_slot
        grounds:
          - validations[priority=12]
          - validations[priority=17]
          - errors.ERR_CERTIFICATION_MISSING
          - errors.ERR_SLOT_CAPACITY_FULL
          - entities.PositionType.fields.required_certifications
        distinguishing_aspect: |
          A different pair - business_safety (priority 12) versus business_constraint (priority 17).
          The slot is already FILLED (capacity violated) and the candidate holds no VALID
          EVACUATION_PROCEDURES certification (safety violated); the safety refusal must be the one
          reported, because "we are full" would let an operator believe a certified candidate would
          have been accepted. A control call with a certified candidate on the same full slot returns
          ERR_SLOT_CAPACITY_FULL, pinning that priority 17 still fires when 12 is satisfied.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T17:00:00Z; Event IN_PROGRESS with a LOCKED plan."
            - "USHER PositionType with required_certifications [EVACUATION_PROCEDURES]."
            - "One slot with required_headcount_override 1, already FILLED by a SCHEDULED assignment for certified member M1."
            - "M2 is ACTIVE but holds no certification at all; M3 is ACTIVE and certified."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T17:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Safety Versus Capacity Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 20000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /position-types"
              payload: { code: "USHER", display_name: "Usher", base_hourly_rate_cents: 2200, attendance_ratio_per_1000: 1.5, min_headcount: 4, required_certifications: ["EVACUATION_PROCEDURES"] }
              as: StaffingCoordinator
              captures: { pt_usher_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_usher_id}", zone_code: "Z510", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ora Kelly", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-01-01T00:00:00Z", hourly_rate_cents: 2200 }
              as: StaffingCoordinator
              captures: { sm_1: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${sm_1}", cert_type: "EVACUATION_PROCEDURES", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /staff-members"
              payload: { full_name: "Pia Rowe", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-02-01T00:00:00Z", hourly_rate_cents: 2200 }
              as: StaffingCoordinator
              captures: { sm_2: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Rex Ulloa", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-03-01T00:00:00Z", hourly_rate_cents: 2200 }
              as: StaffingCoordinator
              captures: { sm_3: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${sm_3}", cert_type: "EVACUATION_PROCEDURES", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v0}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${sm_1}" }
              as: StaffingCoordinator
              captures: { asg_1: $.data.id }
          trigger:
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${sm_2}" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${sm_3}" }
              as: StaffingCoordinator
          assert:
            - "the first trigger returns 409 with data.error_id == ERR_CERTIFICATION_MISSING, NOT ERR_SLOT_CAPACITY_FULL (priority 12 outranks priority 17)"
            - "the second trigger returns 409 with data.error_id == ERR_SLOT_CAPACITY_FULL, proving priority 17 fires once the certification check passes"
            - "PositionSlot.${slot_id}.filled_headcount == 1 and status == FILLED after both refusals"
            - "GET /staff-members/${sm_2}/certifications returns total_count 0, so no certification row was created as a side effect of the refusal"
            - "only one StaffAssignment exists for ${slot_id}: StaffAssignment.${asg_1} with attendance_status == SCHEDULED"

      - name: constraint_beats_temporal_on_duplicate_assignment
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors.ERR_DUPLICATE_ASSIGNMENT
          - errors.ERR_SHIFT_REST_CONFLICT
          - constants.REST_BUFFER_MINUTES
        distinguishing_aspect: |
          A third pair - business_constraint (priority 13) versus business_temporal (priority 14),
          only one level apart, which is the pair most likely to be evaluated in the wrong order by an
          implementation that scans the member's existing assignments once and reports the first
          temporal clash it sees. Re-assigning the same member to the SAME slot violates both rules
          simultaneously (a duplicate necessarily overlaps its own shift window), so the duplicate
          error must win; a second call to a genuinely different slot 15 minutes after the first
          shift ends must still yield ERR_SHIFT_REST_CONFLICT.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T17:00:00Z; Event IN_PROGRESS with a LOCKED plan; TICKET_TAKER PositionType with no required certifications."
            - "Slot S1 18:00-22:00 with required_headcount_override 2, holding one SCHEDULED assignment for M1 (so capacity is NOT full and priority 17 cannot interfere)."
            - "Slot S2 22:15-23:00 on the same plan, empty - only 15 minutes after S1 ends, inside the 30-minute rest buffer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T17:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Duplicate Versus Rest Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:30:00Z", expected_attendance: 20000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_tt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "Z610", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:00:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_s1: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "Z611", shift_start: "2026-09-12T22:15:00Z", shift_end: "2026-09-12T23:00:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_s2: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Sol Vega", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { sm_1: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v0}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_s1}", staff_member_id: "${sm_1}" }
              as: StaffingCoordinator
              captures: { asg_1: $.data.id }
          trigger:
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_s1}", staff_member_id: "${sm_1}" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_s2}", staff_member_id: "${sm_1}" }
              as: StaffingCoordinator
          assert:
            - "the first trigger returns 409 with data.error_id == ERR_DUPLICATE_ASSIGNMENT, NOT ERR_SHIFT_REST_CONFLICT (priority 13 outranks priority 14)"
            - "the second trigger returns 409 with data.error_id == ERR_SHIFT_REST_CONFLICT: the gap 22:00 -> 22:15 is 15 minutes, under REST_BUFFER_MINUTES 30"
            - "PositionSlot.${slot_s1}.filled_headcount == 1 and status == PARTIALLY_FILLED after both refusals (capacity was never the binding constraint)"
            - "PositionSlot.${slot_s2}.filled_headcount == 0 and status == OPEN"
            - "exactly one StaffAssignment exists for ${sm_1} across the whole event: StaffAssignment.${asg_1}"

  # =====================================================================================
  # Rule 6 - boundary / precision checks on DIFFERENT metrics, each via a DISTINCT endpoint
  # =====================================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: overtime_threshold_exact_480_worked_minutes
        grounds:
          - calculations.assignment_worked_pay
          - constants.OVERTIME_THRESHOLD_MINUTES
          - constants.OVERTIME_MULTIPLIER
          - endpoints.POST_/staff-assignments/{id}/attendance
          - entities.StaffAssignment.fields.base_pay_cents
        distinguishing_aspect: |
          Metric: worked_minutes against the 480-minute overtime threshold, probed through
          POST /staff-assignments/{id}/attendance. All three sides of the boundary are exercised in one
          test on three members sharing one slot - 479, 480 and 481 worked minutes - and the pay is
          rounded per component rather than on the blended total, so 481 minutes must be
          20800 + 65 = 20865 and never 20865 computed as one quantization of 20864.9999.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T07:45:00Z; Event IN_PROGRESS with a LOCKED plan."
            - "TICKET_TAKER PositionType with no required certifications; one slot 08:00-16:00 with required_headcount_override 3."
            - "Three ACTIVE members M1, M2, M3, all at hourly_rate_cents 2600, each with a SCHEDULED assignment on that slot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T07:45:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Overtime Boundary Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T07:30:00Z", doors_close_at: "2026-09-12T17:00:00Z", expected_attendance: 20000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_tt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "Z810", shift_start: "2026-09-12T08:00:00Z", shift_end: "2026-09-12T16:00:00Z", required_headcount_override: 3 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Tam Ellis", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-01-01T00:00:00Z", hourly_rate_cents: 2600 }
              as: StaffingCoordinator
