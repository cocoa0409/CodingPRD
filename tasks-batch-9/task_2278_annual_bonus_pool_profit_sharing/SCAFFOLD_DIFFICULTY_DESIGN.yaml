# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2278 Annual Bonus Pool & Profit Sharing
# 9 rule_ids, 24 instances. Every literal in an `assert:` line was produced by
# executing the §1.3 formulas as code against the pinned setup inputs.
# Shared fixture facts used repeatedly (all verified by execution):
#   plan window 2026-01-01 .. 2027-01-01 (exclusive, 365 days), payment_date
#   2027-03-15, weights 50/30/20, discretionary budget 10.00%.
#   REVENUE (weight 60.00, band 900/1000/1200) actual 900 -> 50.00
#   EBITDA  (weight 40.00, band 90/100/130)   actual 95  -> 75.00
#   => company 60.00, BU 100.00, blended 80.00 (curve floor), multiplier 0.5000
#   L5 20.00% of 20,000,000 over the full year -> 4,000,000
#   L3 10.00% of 10,000,000 from 2026-07-01 (184 days) -> 504,110
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: provisional_forecast_pool_versus_certified_funded_pool
        grounds:
          - calculations.provisional_pool_funding
          - calculations.pool_funding_split
          - calculations.period_accrual_with_burden
          - entities.AccrualPeriod.fields.provisional_target_basis
          - entities.AccrualPeriod.fields.provisional_pool_cents
          - entities.BonusPlan.fields.funded_pool_cents
          - "state_machines.AccrualPeriod: OPEN -> POSTED"
          - "state_machines.BonusPlan: CERTIFIED -> ALLOCATION_OPEN"
        distinguishing_aspect: |
          Fed the identical company achievement (60.00), the provisional variant
          values the pool at 2,500,000 cents off un-prorated whole-year targets
          of currently-employed participants while the certified variant values
          it at 2,252,055 cents off per-segment-prorated award targets — a
          247,945-cent divergence produced by the input set, not by the curve.
        test_recipe:
          setup:
            - "One business unit, one plan (weights 50/30/20, discretionary 10.00%), L3 and L5 target rows, REVENUE and EBITDA metrics still DRAFT, one pool, two participants (Ada L5 20,000,000 hired 2025-03-01; Ben L3 10,000,000 hired 2026-07-01)."
            - "H1 accrual period 2026-01-01..2026-06-30 posted BEFORE any ParticipantAward exists, with forecast_company_achievement_pct 60.00 — exactly the company achievement the committee will later certify."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "EAST", name: "East Region" }
              as: PlanAdmin
              captures: { east_id: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Corporate Bonus", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00, discretionary_budget_pct: 10.00, termination_treatment_policy: "STRICT_PAYMENT_DATE" }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L3", target_bonus_pct: 10.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L5", target_bonus_pct: 20.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
            - call: "POST /company-metrics"
              payload: { plan_id: "${plan_id}", metric_code: "REVENUE", weight_pct: 60.00, threshold_value: 900, target_value: 1000, max_value: 1200 }
              as: PlanAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /company-metrics"
              payload: { plan_id: "${plan_id}", metric_code: "EBITDA", weight_pct: 40.00, threshold_value: 90, target_value: 100, max_value: 130 }
              as: PlanAdmin
              captures: { ebitda_id: "$.data.id" }
            - call: "POST /bu-pools"
              payload: { plan_id: "${plan_id}", business_unit_id: "${east_id}" }
              as: PlanAdmin
              captures: { pool_id: "$.data.id" }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", business_unit_id: "${east_id}", employee_code: "E001", full_name: "Ada Long", job_level: "L5", base_salary_cents: 20000000, hire_date: "2025-03-01" }
              as: PlanAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", business_unit_id: "${east_id}", employee_code: "E002", full_name: "Ben Short", job_level: "L3", base_salary_cents: 10000000, hire_date: "2026-07-01" }
              as: PlanAdmin
              captures: { p2_id: "$.data.id" }
            - call: "POST /accrual-periods"
