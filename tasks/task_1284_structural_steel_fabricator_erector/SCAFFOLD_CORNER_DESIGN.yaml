      - name: void_final_inspection_locked_on_load
        claim_type: precondition_enforcement
        grounds: ["state_machines.Inspection.PASSED_to_VOIDED", "errors[ERR_INSPECTION_LOCKED]"]
        distinguishing_aspect: "Once the piece sits on a load, voiding its passed final inspection is blocked with ERR_INSPECTION_LOCKED (downstream progress consumed the result)."
        test_recipe:
          setup: ["piece READY_TO_SHIP and added to a load"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job SM9", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { j9: $.data.id } }
            - { call: "POST /jobs/${j9}/award", as: FABRICATOR_ADMIN }
