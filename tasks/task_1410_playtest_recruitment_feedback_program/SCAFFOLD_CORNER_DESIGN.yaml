        claim_type: action_endpoint
        grounds: ["endpoints[\"POST /playtests/feedback-tickets/{id}/route\"]", state_machines.FeedbackTicket.TRIAGED_to_ROUTED]
        distinguishing_aspect: "Routing is a conditional action: only a TRIAGED ticket accepts route, and the response carries the chosen backlog_target."
        test_recipe:
          setup: ["study S exists; ticket filed and triaged"]
          setup_api_calls:
            - call: "POST /playtests/studies"
