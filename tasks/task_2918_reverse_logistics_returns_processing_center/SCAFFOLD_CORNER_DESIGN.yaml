      - name: corner_clock_advance_expires_issued_rma_and_books_receipt_variance
        claim_type: Valid Transition
        grounds:
          - state_machines.ReturnAuthorization.transitions[ISSUED -> EXPIRED]
          - endpoints[POST /_clock/set_current_utc]
          - calculations.shrink_ledger_entry_amount
        distinguishing_aspect: "Advancing the logical clock past expires_at moves an ISSUED authorization with nothing received to EXPIRED and appends one RECEIPT_VARIANCE row of -20000 == -((1 - 0) * 20000), which is a clock-driven transition rather than an operator action."
        test_recipe:
          setup:
