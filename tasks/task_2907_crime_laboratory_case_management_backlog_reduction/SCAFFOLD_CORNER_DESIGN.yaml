            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
              payload: { full_name: "Retire Case Analyst", disciplines: ["CHEMISTRY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a1: $.data.id }
            - call: "POST /lab/methods"
