            - "Coupon.${c1}.allocated_amount_minor == 50000 and Coupon.${c2}.allocated_amount_minor == 50000, both still allocation_basis STRAIGHT_RATE"
            - "Ticket.${t1}.unallocated_residual_minor == 0"
            - "GET /interline/tickets/${t1}/proration-runs returns exactly 1 run, of run_type PROVISIONAL"

      - name: ffp_tier_flips_at_exactly_ten_thousand_cumulative_miles
        grounds:
          - calculations.ffp_mileage_cost
          - entities.Coupon.fields.ffp_tier
          - entities.Carrier.fields.period_accrued_miles
          - state_machines.Coupon.OPEN_to_FLOWN
        distinguishing_aspect: |
          Boundary on the CUMULATIVE-MILES metric, reached through a third endpoint
          (POST /interline/coupons/{id}/fly): the second coupon is flown when BB's
          period_accrued_miles reads exactly 10000, and the >= comparison of the TIER_A
          ceiling must place it in TIER_B at 1150 per thousand (cost 11500), not in TIER_A
          at 1400 (which would give 14000).
        test_recipe:
          setup:
            - "Carriers AA and BB ACTIVE; BB has never accrued miles."
            - "A USD 100000 ticket validated by AA with two FIRST-class 5000-tpm coupons operated by BB."
            - "The first coupon has already been flown, awarding exactly 10000 miles at TIER_A."
