              as: ProjectManager
              captures: { poA_id: $.data.id }
            - call: "POST /procurement-orders"
              payload: { scope_option_id: "${so1_id}", item_type: "MACHINE", lead_time_days: 30, required_staging_sqft: 600 }
              as: ProjectManager
              captures: { poB_id: $.data.id }
            - call: "POST /procurement-orders"
              payload: { scope_option_id: "${so1_id}", item_type: "DOOR_OPERATOR", lead_time_days: 30, required_staging_sqft: 600 }
              as: ProjectManager
              captures: { poC_id: $.data.id }
