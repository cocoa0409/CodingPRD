          - calculations.sanction_cure_determination
          - validations[priority=26]
        distinguishing_aspect: "With a PROBATION snapshot of 75 and only two post-review CLEARED reports (score 50), CURE fails ERR_CURE_THRESHOLD_NOT_MET and both cure_status and sanction_status stay put."
        test_recipe:
          setup:
            - "Institution under PROBATION (panel-band 2026 report cascade escalated), cure review open with snapshot 75, exactly two subsequent reports evaluated CLEARED at 2026-09-02."
          setup_api_calls:
            - *k_clock
            - *k_inst
            - *k_rep1_new
            - *k_rep1_sub_pnl
            - *k_rep1_eval
            - *k_outs_inst
