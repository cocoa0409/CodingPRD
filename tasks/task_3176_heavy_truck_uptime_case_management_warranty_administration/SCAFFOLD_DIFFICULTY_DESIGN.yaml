  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: truck_decommission_cascades_coverage_and_campaign
        grounds:
          - state_machines.Truck.IN_SERVICE_to_DECOMMISSIONED
          - state_machines.CoverageContract.ACTIVE_to_CANCELLED
          - state_machines.CampaignCompletion.OPEN_to_EXEMPTED
          - calculations.coverage_proration
          - calculations.campaign_completion_pct
        distinguishing_aspect: |
          Trigger 1: POST /decommission on Truck. Cascade depth 3:
            Truck → DECOMMISSIONED
              → CoverageContract(s) → CANCELLED (each computes prorated_credit_cents)
              → CampaignCompletion(s) OPEN → EXEMPTED (each recomputes Campaign.completion_pct).
          Each step is CAUSED by the previous step's mutation, not by the original
          call (i.e., the decommission does NOT touch Campaign directly; the
          Campaign recompute is a downstream effect of the completion change).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Fleet with one Truck."
            - "CoverageContract ACTIVE on the Truck."
            - "Campaign OPEN whose affected_model_codes include the Truck's model_code → a CampaignCompletion row exists on this Truck in OPEN."
            - "Truck has zero open cases (so decommission is permitted)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "Cascade Fleet", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-cascade"
              captures: { fleet_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "1FUJGBDV8CLBP0030", model_code: "CASCADIA_126", in_service_on: "2026-01-01T00:00:00Z", odometer_miles: 80000, base_warranty_until_miles: 250000, base_warranty_until_on: "2028-01-01T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/coverage-contracts"
              payload: { contract_type: "EXTENDED_FULL", starts_on: "2026-01-01T00:00:00Z", ends_on: "2027-01-01T00:00:00Z", max_miles: 100000, premium_cents: 500000 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /campaigns"
              payload: { campaign_code: "RCL-2026-001", campaign_kind: "RECALL", affected_model_codes: ["CASCADIA_126"], fault_code: "SPN3216_FMI4", opens_on: "2026-08-01T00:00:00Z", closes_on: "2027-08-01T00:00:00Z" }
              as: UptimeCoordinator
              captures: { campaign_id: $.data.id }
            - call: "GET /campaigns/${campaign_id}/completions"
              payload: { truck_id: "${truck_id}" }
              as: UptimeCoordinator
              captures: { cc_id: "$.data[0].id" }
          trigger:
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/decommission"
              payload: {}
              as: FleetManager
              as_user_id: "${fleet_id}"
          assert:
            - "Truck.${truck_id}.truck_status == DECOMMISSIONED"
            - "CoverageContract.${contract_id}.contract_status == CANCELLED"
            - "CoverageContract.${contract_id}.prorated_credit_cents is a positive integer (min of time and mileage branches)"
            - "CampaignCompletion.${cc_id}.completion_status == EXEMPTED"
            - "CampaignCompletion.${cc_id}.exemption_reason == 'TRUCK_DECOMMISSIONED'"
            - "Campaign.${campaign_id}.completion_pct == 0.00 (EXEMPTED rows are excluded from numerator AND denominator)"

      - name: case_close_cascades_truck_fleet_bay_campaign
        grounds:
          - state_machines.Case.PENDING_CLOSE_to_CLOSED
          - state_machines.Truck.DOWN_to_IN_SERVICE
          - state_machines.ServiceBay.IN_USE_to_AVAILABLE
          - state_machines.CampaignCompletion.SCHEDULED_to_COMPLETED
          - calculations.truck_downtime_hours
          - calculations.reliability_score_update
        distinguishing_aspect: |
          Trigger 2 (different from truck_decommission_cascades): POST /close on
          a PENDING_CLOSE Case. Cascade depth 4:
            Case → CLOSED (downtime_hours computed)
              → Truck.open_case_count--; if 0: Truck.truck_status → IN_SERVICE
              → Fleet.total_downtime_hours += downtime_hours; Fleet.reliability_score updated
              → ServiceBay → AVAILABLE
              → CampaignCompletion SCHEDULED → COMPLETED (which itself recomputes
                Campaign.completion_pct — a 4th hop).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Fleet/Truck/Dealer/Bay; Case in PENDING_CLOSE."
            - "Campaign exists with affected_model_codes including the truck's model; the CampaignCompletion row on this truck is SCHEDULED (linked to the case)."
            - "Case opened at 2026-09-01T13:00:00Z; clock advanced to 2026-09-02T14:30:00Z (25.5 hours → >24h penalty applies)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "Cascade Close Fleet", home_region: "SE" }
