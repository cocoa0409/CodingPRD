            - "QualificationRequest.${req_j1_id}.effective_to == 2029-05-05T00:00:00Z (the predecessor window is truncated, not left overlapping)"
            - "Subscriber.${sub_j_id}.qualified_at == 2029-05-05T00:00:00Z and qualification_expires_at == 2032-05-05T00:00:00Z"

  - rule_id: compensating_invariant
    instances:
      - name: makegood_waiver_preserves_credit_pool_conservation
        grounds:
          - calculations.contract_makegood_ledger
          - state_machines.MakeGoodObligation.OFFERED_to_WAIVED
          - entities.AdvertiserContract.fields.makegood_credit_pool_cents
          - entities.AdvertiserContract.fields.makegood_credit_waived_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY (makegood_credit_pool_cents). The waiver is the compensating
          action for settlement: it moves 4808796 cents out of the committed bucket into the waived
          bucket without touching the pool or the available balance, so committed + waived +
          available equals the pool exactly both before and after, with no cent of drift.
        test_recipe:
          setup:
            - "publication with one qualified PAID recipient holding 1200 copies and an ACTIVE contract (12 insertions at 850000 cents, guaranteed rate base 1750, tolerance 2.00)"
            - "clock at 2026-10-01, statement for [2026-07-01, 2026-09-01) FILED with declared_total_copies 1200"
            - "guarantees settled and the resulting obligation moved to OFFERED"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Ledger Conservation Journal", frequency: "MONTHLY", industry_code: "MANUFACTURING", materiality_pct: 2.00 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "JOB_FUNCTION", allowed_values: ["ENGINEERING_MGMT"], points: 45, is_mandatory: true }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "INDUSTRY", allowed_values: ["MANUFACTURING"], points: 30, is_mandatory: false }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "PURCHASING_AUTHORITY", allowed_values: ["APPROVES"], points: 25, is_mandatory: false }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Acme Fabrication", contact_email: "a@acme.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "PAID", copies: 1200, paid_amount_cents: 24000 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_a_id: $.data.id, sub_a_ver: $.data.version }
            - call: "POST /circulation/subscribers/${sub_a_id}/source-documents"
              payload: { doc_type: "SIGNED_REQUEST_CARD", captured_at: "2026-07-15T00:00:00Z", storage_ref: "s3://circ/a-card" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { doc_a_id: $.data.id }
            - call: "POST /circulation/qualification-requests"
              payload: { subscriber_id: "${sub_a_id}", source_document_id: "${doc_a_id}", request_channel: "DIRECT_MAIL", signed_at: "2026-07-01T00:00:00Z", attested_job_function_code: "ENGINEERING_MGMT", attested_industry_code: "MANUFACTURING", attested_purchasing_authority: "APPROVES", expected_subscriber_version: "${sub_a_ver}" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { req_a_id: $.data.id }
            - call: "POST /circulation/qualification-requests/${req_a_id}/review"
              payload: { review_note: "ok" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
            - call: "POST /circulation/qualification-requests/${req_a_id}/verify"
              payload: { decision_reason: "qualified" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
            - call: "POST /circulation/advertiser-contracts"
              payload: { publication_id: "${pub_id}", advertiser_name: "Hydraulics International", insertion_count: 12, gross_rate_cents_per_insertion: 850000, guaranteed_rate_base: 1750, shortfall_tolerance_pct: 2.00 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { ac1_id: $.data.id, pool: $.data.makegood_credit_pool_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_ver_1: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver_1}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st1_id: $.data.id }
            - call: "POST /circulation/statements/${st1_id}/certify"
              payload: { certification_note: "filed" }
              as: PublisherExecutive
              as_user_id: "exec-01"
            - call: "POST /circulation/statements/${st1_id}/settle-guarantees"
              payload: { settlement_note: "shortfall settlement" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { mg1_id: "$.data[0].id", mg1_credit: "$.data[0].credit_cents" }
            - call: "GET /circulation/advertiser-contracts/${ac1_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { committed_before: $.data.makegood_credit_committed_cents, available_before: $.data.makegood_credit_available_cents }
            - call: "POST /circulation/make-goods/${mg1_id}/offer"
              payload: { offer_note: "credit offered to advertiser" }
              as: CirculationManager
              as_user_id: "mgr-01"
          trigger:
            - call: "POST /circulation/make-goods/${mg1_id}/waive"
              payload: { waiver_reason: "advertiser declined the credit in exchange for a schedule change" }
              as: PublisherExecutive
              as_user_id: "exec-01"
              captures: { mg1_status: $.data.status, mg1_reason: $.data.closed_reason }
          assert:
            - "${pool} == 10200000, ${committed_before} == 4808796 and ${available_before} == 5391204 (10200000 == 4808796 + 0 + 5391204 before the compensation)"
            - "${mg1_status} == WAIVED and ${mg1_reason} == advertiser declined the credit in exchange for a schedule change"
            - "AdvertiserContract.${ac1_id}.makegood_credit_committed_cents == 0"
            - "AdvertiserContract.${ac1_id}.makegood_credit_waived_cents == 4808796"
            - "AdvertiserContract.${ac1_id}.makegood_credit_available_cents == 5391204 — the waiver did NOT return credit to the available bucket"
            - "AdvertiserContract.${ac1_id}.makegood_credit_pool_cents == 10200000 == 0 + 4808796 + 5391204 after the compensation: zero drift"
            - "${mg1_credit} == 4808796 is unchanged on the obligation row itself"

      - name: subscriber_reclassification_round_trip_preserves_copy_conservation
        grounds:
          - calculations.publication_copies_ledger
          - entities.Publication.fields.copies_on_file_total
          - entities.Publication.fields.paid_copies_on_file
          - entities.Publication.fields.controlled_copies_on_file
          - validations[priority=73]
        distinguishing_aspect: |
          A different conserved quantity (COPIES on the class axis, not money) and a different
          compensating action (reclassify back): the class buckets move in opposite directions while
          copies_on_file_total and the whole delivery axis stay pinned, and the round trip restores
          every bucket to its exact starting value rather than merely to a consistent total.
        test_recipe:
          setup:
            - "publication with two recipients: SD with 950 PAID copies and SE with 50 CONTROLLED copies, both DELIVERABLE"
            - "clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Class Ledger Weekly", frequency: "WEEKLY", industry_code: "UTILITIES" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Sierra Grid", contact_email: "sd@sierra.test", job_function_code: "PLANT_MGMT", industry_code: "UTILITIES", purchasing_authority_level: "APPROVES", subscription_class: "PAID", copies: 950, paid_amount_cents: 19000 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_d_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Estuary Power", contact_email: "se@estuary.test", job_function_code: "PLANT_MGMT", industry_code: "UTILITIES", purchasing_authority_level: "SPECIFIES", subscription_class: "CONTROLLED", copies: 50 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_e_id: $.data.id }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { total_before: $.data.copies_on_file_total, paid_before: $.data.paid_copies_on_file, controlled_before: $.data.controlled_copies_on_file }
          trigger:
            - call: "POST /circulation/subscribers/${sub_e_id}/reclassify"
              payload: { subscription_class: "PAID", paid_amount_cents: 2500 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { e_class_mid: $.data.subscription_class }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { total_mid: $.data.copies_on_file_total, paid_mid: $.data.paid_copies_on_file, controlled_mid: $.data.controlled_copies_on_file }
            - call: "POST /circulation/subscribers/${sub_e_id}/reclassify"
              payload: { subscription_class: "CONTROLLED" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { e_class_after: $.data.subscription_class }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { total_after: $.data.copies_on_file_total, paid_after: $.data.paid_copies_on_file, controlled_after: $.data.controlled_copies_on_file, deliverable_after: $.data.deliverable_copies }
          assert:
            - "${total_before} == 1000, ${paid_before} == 950, ${controlled_before} == 50"
            - "${e_class_mid} == PAID; ${paid_mid} == 1000, ${controlled_mid} == 0, ${total_mid} == 1000"
            - "${e_class_after} == CONTROLLED; ${paid_after} == 950, ${controlled_after} == 50, ${total_after} == 1000"
            - "${total_after} == ${paid_after} + 0 + ${controlled_after} — the class axis reconciles exactly after the compensation"
            - "${deliverable_after} == 1000 and Publication.${pub_id}.undeliverable_pct == 0.00 — the delivery axis was never touched by either reclassification"
            - "Subscriber.${sub_e_id}.paid_amount_cents == 2500 is retained after reclassifying back to CONTROLLED, and version has advanced by exactly 2"
