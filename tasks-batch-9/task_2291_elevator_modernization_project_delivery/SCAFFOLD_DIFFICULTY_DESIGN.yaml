# §1.8 Scaffold Difficulty Design — 2291 Elevator Modernization Project Delivery
# 9 rule_ids, 19 instances. Every numeric literal in every `assert:` was computed
# by executing the referenced §1.3 formula with Decimal / ROUND_HALF_UP.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: condition_score_observed_only_vs_imputed_failed
        grounds:
          - calculations.car_condition_score
          - calculations.recommended_scope_tier
          - entities.EquipmentSurvey.fields.provisional_score
          - entities.EquipmentSurvey.fields.final_score
          - entities.ElevatorCar.fields.condition_score
        distinguishing_aspect: |
          The two bases divide by different denominators for the SAME three grades: OBSERVED_ONLY
          renormalises over the 0.70 of weight actually observed and returns 71.07 (tier
          CONTROLLER_DOOR), while IMPUTED_FAILED keeps the full 1.00 denominator and returns 49.75
          (tier CONTROLLER_MACHINE), so the survey carries two different scores and two different
          binding recommendations at once.
        test_recipe:
          setup:
            - "One jurisdiction with no code triggers armed (fire_service_required false, seismic_zone 0, door_protection_required false)."
            - "One project in status SURVEY with one group and one car in work_status SURVEY_PENDING."
            - "One EquipmentSurvey in status SUBMITTED whose machine_condition is NOT_OBSERVED, controller_condition GOOD and door_equipment_condition FAIR."
            - "Logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false, inspection_lead_days: 10, witness_test_required: false, reinspection_extension_hours: 24, permit_surcharge_pct: 0.0000 }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2, outage_buffer_hours: 4, tenant_notice_lead_hours: 72 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /elevator-groups"
              payload: { project_id: "${p_id}", group_label: "BANK-A", min_cars_in_service: 0 }
              as: ProjectManager
              captures: { g_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-1", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 1 }
              as: ProjectManager
              captures: { c1_id: $.data.id }
            - call: "POST /equipment-surveys"
              payload: { car_id: "${c1_id}", controller_condition: "GOOD", machine_condition: "NOT_OBSERVED", door_equipment_condition: "FAIR" }
              as: SurveyTechnician
              as_user_id: "tech-001"
              captures: { s1_id: $.data.id, prov: $.data.provisional_score }
          trigger:
            - call: "GET /equipment-surveys/${s1_id}/score-preview"
              payload: { basis: "OBSERVED_ONLY" }
              as: ProjectManager
            - call: "GET /equipment-surveys/${s1_id}/score-preview"
              payload: { basis: "IMPUTED_FAILED" }
              as: ProjectManager
            - call: "POST /equipment-surveys/${s1_id}/countersign"
              as: SurveyTechnician
              as_user_id: "tech-002"
          assert:
            - "score-preview basis=OBSERVED_ONLY returns score == 71.07, observed_weight_total == 0.70, recommended_scope_tier == CONTROLLER_DOOR"
            - "score-preview basis=IMPUTED_FAILED returns score == 49.75, observed_weight_total == 1.00, recommended_scope_tier == CONTROLLER_MACHINE"
            - "EquipmentSurvey.${s1_id}.provisional_score == 71.07"
            - "EquipmentSurvey.${s1_id}.final_score == 49.75"
            - "EquipmentSurvey.${s1_id}.recommended_scope_tier == CONTROLLER_MACHINE"
            - "ElevatorCar.${c1_id}.condition_score == 49.75"
            - "ElevatorCar.${c1_id}.recommended_scope_tier == CONTROLLER_MACHINE"
            - "EquipmentSurvey.${s1_id}.provisional_score != EquipmentSurvey.${s1_id}.final_score"

      - name: warranty_credit_thirty_360_vs_actual_calendar
        grounds:
          - calculations.warranty_unexpired_credit
          - calculations.maintenance_monthly_total
          - entities.WarrantyTransition.fields.provisional_credit_cents
          - entities.WarrantyTransition.fields.final_credit_cents
          - entities.MaintenanceContract.fields.total_final_credit_cents
        distinguishing_aspect: |
          The two bases count the SAME span 2027-03-15 -> 2028-09-01 as different day counts (526
          under 30/360 versus 536 actual calendar days across a leap year) and divide by different
          divisors (30 versus 365/12), so the provisional credit is 907350 cents and the final
          credit is 911934 cents on identical inputs — a 4584-cent reconciliation the contract must
          carry. This is a fiscal day-count divergence, unrelated to the weight-renormalisation
          divergence of condition scoring.
        test_recipe:
          setup:
            - "One jurisdiction with zero code triggers armed and inspection_lead_days 10."
            - "One car fully delivered: work_status IN_WARRANTY, compliance_status CODE_ACCEPTED, its APPROVED ScopeOption tier CONTROLLER_DOOR, its group holding exactly one car."
            - "WarrantyTransition in status ENROLLED with warranty_start 2026-09-01T00:00:00Z and warranty_end 2028-09-01T00:00:00Z."
            - "MaintenanceContract in status DRAFT with monthly_base_cents 45000 and coverage_start 2027-03-15."
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false, inspection_lead_days: 10, witness_test_required: false, reinspection_extension_hours: 24, permit_surcharge_pct: 0.0000 }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2, outage_buffer_hours: 4, tenant_notice_lead_hours: 72 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /elevator-groups"
              payload: { project_id: "${p_id}", group_label: "BANK-A", min_cars_in_service: 0 }
              as: ProjectManager
              captures: { g_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-1", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 1 }
              as: ProjectManager
              captures: { c1_id: $.data.id }
            - call: "POST /equipment-surveys"
              payload: { car_id: "${c1_id}", controller_condition: "GOOD", machine_condition: "GOOD", door_equipment_condition: "FAIR" }
              as: SurveyTechnician
              as_user_id: "tech-001"
              captures: { s1_id: $.data.id }
            - call: "POST /equipment-surveys/${s1_id}/countersign"
              as: SurveyTechnician
              as_user_id: "tech-002"
            - call: "GET /projects/${p_id}"
              as: ProjectManager
              captures: { pv1: $.data.version }
            - call: "POST /scope-options"
              payload: { car_id: "${c1_id}", tier: "CONTROLLER_DOOR", base_price_cents: 14000000, expected_project_version: "${pv1}" }
              as: ProjectManager
              captures: { so1_id: $.data.id }
            - call: "POST /scope-options/${so1_id}/submit"
              as: ProjectManager
            - call: "POST /scope-options/${so1_id}/approve"
              as: BuildingRepresentative
              as_user_id: "${p_id}"
            - call: "POST /procurement-orders"
              payload: { scope_option_id: "${so1_id}", item_type: "CONTROLLER", lead_time_days: 150, required_staging_sqft: 400 }
              as: ProjectManager
              captures: { po1_id: $.data.id }
            - call: "POST /procurement-orders/${po1_id}/issue"
              as: ProjectManager
            - call: "GET /projects/${p_id}"
              as: ProjectManager
              captures: { pv2: $.data.version }
            - call: "POST /staging-reservations"
              payload: { procurement_order_id: "${po1_id}", sqft: 400, hold_start: "2026-08-05T00:00:00Z", hold_end: "2026-08-20T00:00:00Z", expected_project_version: "${pv2}" }
              as: ServiceManager
              captures: { sr1_id: $.data.id }
            - call: "POST /procurement-orders/${po1_id}/receive"
              payload: { staging_reservation_id: "${sr1_id}" }
              as: ServiceManager
            - call: "POST /procurement-orders/${po1_id}/install"
              as: ServiceManager
            - call: "POST /outage-windows"
              payload: { car_id: "${c1_id}", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-12T18:00:00Z", temporary_service_plan: "ADJACENT_CAR" }
              as: ProjectManager
              captures: { ow1_id: $.data.id }
            - call: "POST /outage-windows/${ow1_id}/send-notice"
              as: ProjectManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
            - call: "POST /outage-windows/${ow1_id}/activate"
              as: ServiceManager
            - call: "POST /outage-windows/${ow1_id}/complete"
              as: ServiceManager
            - call: "POST /elevator-cars/${c1_id}/begin-testing"
              as: ServiceManager
            - call: "POST /inspection-appointments"
              payload: { car_id: "${c1_id}", requested_date: "2026-08-25" }
              as: ServiceManager
              captures: { ia1_id: $.data.id }
            - call: "POST /inspection-appointments/${ia1_id}/schedule"
              payload: { scheduled_at: "2026-08-25T13:00:00Z" }
              as: AHJInspector
              as_user_id: "${j_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T13:00:00Z" }
              as: SystemOperator
            - call: "POST /inspection-appointments/${ia1_id}/record-result"
              payload: { result: "PASSED" }
              as: AHJInspector
              as_user_id: "${j_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /warranty-transitions"
              payload: { car_id: "${c1_id}", warranty_months: 24 }
              as: ServiceManager
              captures: { wt1_id: $.data.id }
            - call: "POST /maintenance-contracts"
              payload: { project_id: "${p_id}", monthly_base_cents: 45000, coverage_start: "2027-03-15" }
              as: ServiceManager
              captures: { mc1_id: $.data.id }
            - call: "POST /warranty-transitions/${wt1_id}/enroll"
              payload: { maintenance_contract_id: "${mc1_id}" }
              as: ServiceManager
          trigger:
            - call: "GET /warranty-transitions/${wt1_id}/credit-preview"
              payload: { basis: "THIRTY_360" }
              as: ServiceManager
            - call: "GET /warranty-transitions/${wt1_id}/credit-preview"
              payload: { basis: "ACTUAL_CALENDAR" }
              as: ServiceManager
            - call: "POST /maintenance-contracts/${mc1_id}/activate"
              as: ServiceManager
          assert:
            - "credit-preview basis=THIRTY_360 returns day_count == 526, per_car_monthly_cents == 51750, credit_cents == 907350"
            - "credit-preview basis=ACTUAL_CALENDAR returns day_count == 536, per_car_monthly_cents == 51750, credit_cents == 911934"
            - "WarrantyTransition.${wt1_id}.provisional_credit_cents == 907350"
            - "WarrantyTransition.${wt1_id}.final_credit_cents == 911934"
            - "WarrantyTransition.${wt1_id}.provisional_credit_cents != WarrantyTransition.${wt1_id}.final_credit_cents"
            - "MaintenanceContract.${mc1_id}.total_final_credit_cents == 911934"
            - "MaintenanceContract.${mc1_id}.monthly_total_cents == 51750"
            - "MaintenanceContract.${mc1_id}.cars_covered == 1"
            - "WarrantyTransition.${wt1_id}.status == UNDER_CONTRACT"
            - "ElevatorCar.${c1_id}.work_status == UNDER_CONTRACT"
            - "ModernizationProject.${p_id}.status == COMPLETED"

  - rule_id: combinatorial_formula
    instances:
      - name: downtime_posture_ladder_service_floor_outranks_staging_pressure
        grounds:
          - calculations.project_downtime_posture
          - entities.ModernizationProject.fields.downtime_posture
          - entities.ElevatorGroup.fields.cars_in_service
          - entities.ElevatorGroup.fields.min_cars_in_service
          - endpoints["PATCH /elevator-groups/{group_id}"]
        distinguishing_aspect: |
          Mode (a) — conditional branch selection. The posture ladder is evaluated first-match-wins,
          so with BOTH the service-floor clause and the staging-pressure clause true at the same
          instant the result is FROZEN, never RESTRICTED; an implementation that evaluates the
          pressure clause first, or that ORs the clauses into a single "not OPEN" bucket, returns
          RESTRICTED and fails. No rounding and no evaluation order over arithmetic is involved.
        test_recipe:
          setup:
            - "One project with staging_area_sqft 1200, max_concurrent_outages 2 and one group whose min_cars_in_service is 1."
            - "Two cars in that group; car 1 has an APPROVED ScopeOption and is in work_status PROCURING."
            - "One StagingReservation in status HELD for 1100 sqft, so staging_committed_sqft is 1100 and 1100*100 > 1200*85 makes the pressure clause true."
            - "Car 1's outage window is ACTIVE, so cars_in_service is 1 and active_outage_count is 1 (still below the cap of 2)."
            - "Posture before the trigger is RESTRICTED."
            - "Logical clock at 2026-08-10T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false, inspection_lead_days: 10, witness_test_required: false, reinspection_extension_hours: 24, permit_surcharge_pct: 0.0000 }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2, outage_buffer_hours: 4, tenant_notice_lead_hours: 72 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /elevator-groups"
              payload: { project_id: "${p_id}", group_label: "BANK-A", min_cars_in_service: 1 }
              as: ProjectManager
              captures: { g_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-1", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 1 }
              as: ProjectManager
              captures: { c1_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-2", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 2 }
              as: ProjectManager
              captures: { c2_id: $.data.id }
            - call: "POST /equipment-surveys"
              payload: { car_id: "${c1_id}", controller_condition: "GOOD", machine_condition: "GOOD", door_equipment_condition: "EXCELLENT" }
              as: SurveyTechnician
              as_user_id: "tech-001"
              captures: { s1_id: $.data.id }
            - call: "POST /equipment-surveys/${s1_id}/countersign"
              as: SurveyTechnician
              as_user_id: "tech-002"
            - call: "GET /projects/${p_id}"
              as: ProjectManager
              captures: { pv1: $.data.version }
            - call: "POST /scope-options"
              payload: { car_id: "${c1_id}", tier: "CONTROLLER_ONLY", base_price_cents: 5000000, expected_project_version: "${pv1}" }
              as: ProjectManager
              captures: { so1_id: $.data.id }
            - call: "POST /scope-options/${so1_id}/submit"
              as: ProjectManager
            - call: "POST /scope-options/${so1_id}/approve"
              as: BuildingRepresentative
              as_user_id: "${p_id}"
            - call: "POST /procurement-orders"
              payload: { scope_option_id: "${so1_id}", item_type: "CONTROLLER", lead_time_days: 30, required_staging_sqft: 1100 }
              as: ProjectManager
              captures: { po1_id: $.data.id }
            - call: "GET /projects/${p_id}"
              as: ProjectManager
              captures: { pv2: $.data.version }
            - call: "POST /staging-reservations"
              payload: { procurement_order_id: "${po1_id}", sqft: 1100, hold_start: "2026-08-05T00:00:00Z", hold_end: "2026-08-30T00:00:00Z", expected_project_version: "${pv2}" }
              as: ServiceManager
              captures: { sr1_id: $.data.id }
            - call: "POST /outage-windows"
              payload: { car_id: "${c1_id}", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-12T18:00:00Z", temporary_service_plan: "ADJACENT_CAR" }
              as: ProjectManager
              captures: { ow1_id: $.data.id }
            - call: "POST /outage-windows/${ow1_id}/send-notice"
              as: ProjectManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
            - call: "POST /outage-windows/${ow1_id}/activate"
              as: ServiceManager
            - call: "GET /projects/${p_id}/posture"
              as: ProjectManager
          trigger:
            - call: "PATCH /elevator-groups/${g_id}"
              payload: { min_cars_in_service: 2 }
              as: ProjectManager
          assert:
            - "Before the trigger, GET /projects/${p_id}/posture returns downtime_posture == RESTRICTED, active_outage_count == 1, staging_committed_sqft == 1100, groups_below_floor == 0"
            - "ElevatorGroup.${g_id}.car_count == 2 and ElevatorGroup.${g_id}.cars_in_service == 1"
            - "After the trigger, ModernizationProject.${p_id}.downtime_posture == FROZEN"
            - "After the trigger, GET /projects/${p_id}/posture returns groups_below_floor == 1"
            - "After the trigger, ModernizationProject.${p_id}.active_outage_count == 1, which is still below max_concurrent_outages == 2"
            - "After the trigger, ModernizationProject.${p_id}.staging_committed_sqft == 1100 (unchanged by the PATCH)"
            - "ModernizationProject.${p_id}.downtime_posture != RESTRICTED"

      - name: code_upgrade_permit_surcharge_rounded_per_trigger_then_summed
        grounds:
          - calculations.code_upgrade_cents
          - calculations.code_trigger_synthesis
          - entities.Jurisdiction.fields.permit_surcharge_pct
          - entities.ScopeOption.fields.code_upgrade_cents
        distinguishing_aspect: |
          Mode (b) — rounding order. Two PRICED triggers of 1099970 and 899970 cents under a
          2.50% permit surcharge each carry a 0.25-cent residue: rounding per trigger line first
          gives 1127469 + 922469 = 2049938, while summing the un-rounded amounts (2049938.50) and
          rounding once gives 2049939. The pinned per-line order is 1 cent lower. Nothing about
          branch selection or step sequencing is at stake — only where the rounding step sits.
        test_recipe:
          setup:
            - "One jurisdiction with permit_surcharge_pct 0.0250, fire_service_required true, seismic_zone 3, door_protection_required false."
            - "One car with machine_type GEARLESS whose countersigned survey scores 38.75 and recommends CONTROLLER_MACHINE."
            - "One ScopeOption in status DRAFT with tier CONTROLLER_MACHINE and base_price_cents 8000000, carrying exactly two CodeTriggers in status REQUIRED: FIRE_SERVICE_PHASE_I_II then SEISMIC_RESTRAINT."
            - "No ProcurementOrder exists, so the escalation tier is the empty-set fallback 0.0000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "County of Marlow", code_edition_year: 2019, fire_service_required: true, seismic_zone: 3, door_protection_required: false, inspection_lead_days: 10, witness_test_required: false, reinspection_extension_hours: 24, permit_surcharge_pct: 0.0250 }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Marlow Center", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2, outage_buffer_hours: 4, tenant_notice_lead_hours: 72 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /elevator-groups"
              payload: { project_id: "${p_id}", group_label: "BANK-A", min_cars_in_service: 0 }
              as: ProjectManager
              captures: { g_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-1", rated_load_lbs: 4000, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 1 }
              as: ProjectManager
              captures: { c1_id: $.data.id }
            - call: "POST /equipment-surveys"
              payload: { car_id: "${c1_id}", controller_condition: "POOR", machine_condition: "POOR", door_equipment_condition: "GOOD" }
              as: SurveyTechnician
              as_user_id: "tech-001"
              captures: { s1_id: $.data.id }
            - call: "POST /equipment-surveys/${s1_id}/countersign"
              as: SurveyTechnician
              as_user_id: "tech-002"
            - call: "GET /projects/${p_id}"
              as: ProjectManager
              captures: { pv1: $.data.version }
            - call: "POST /scope-options"
              payload: { car_id: "${c1_id}", tier: "CONTROLLER_MACHINE", base_price_cents: 8000000, expected_project_version: "${pv1}" }
              as: ProjectManager
              captures: { so1_id: $.data.id }
            - call: "GET /code-triggers"
              payload: { scope_option_id: "${so1_id}" }
              as: ProjectManager
              captures: { ct_fire_id: "$.data[0].id", ct_seismic_id: "$.data[1].id" }
          trigger:
            - call: "POST /code-triggers/${ct_fire_id}/price"
              payload: { cost_cents: 1099970 }
              as: ProjectManager
            - call: "POST /code-triggers/${ct_seismic_id}/price"
              payload: { cost_cents: 899970 }
              as: ProjectManager
          assert:
            - "ElevatorCar.${c1_id}.condition_score == 38.75 and recommended_scope_tier == CONTROLLER_MACHINE"
            - "GET /code-triggers?scope_option_id=${so1_id} returns exactly 2 rows, trigger_type FIRE_SERVICE_PHASE_I_II then SEISMIC_RESTRAINT"
            - "CodeTrigger.${ct_fire_id}.status == PRICED and CodeTrigger.${ct_seismic_id}.status == PRICED"
            - "ScopeOption.${so1_id}.code_upgrade_cents == 2049938"
            - "ScopeOption.${so1_id}.code_upgrade_cents != 2049939"
            - "ScopeOption.${so1_id}.escalation_pct == 0.0000 and escalation_fee_cents == 0"
            - "ScopeOption.${so1_id}.volume_discount_pct == 0.0000 and volume_discount_cents == 0"
            - "ScopeOption.${so1_id}.total_price_cents == 10049938"
            - "ElevatorCar.${c1_id}.compliance_status == TRIGGERS_CLEARED"

