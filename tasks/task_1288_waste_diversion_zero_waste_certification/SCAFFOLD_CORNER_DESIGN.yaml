      - name: period_get_reflects_live_totals
        claim_type: computed_read
        grounds: [entities.ScorecardPeriod, calculations.diversion_rate]
        distinguishing_aspect: "Immediate consistency: the GET on an OPEN period reflects each mutation in the same sequence — after validating T1, certified 2000/2000 -> 100.00; after adding PENDING T2 (LANDFILL 1000), provisional becomes 66.67 while certified stays 100.00."
