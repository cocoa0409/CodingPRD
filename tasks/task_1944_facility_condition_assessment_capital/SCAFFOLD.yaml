    path: "/fca/refresh-cycles/{id}/close"
    description: Close a refresh cycle once all non-RETIRED systems are assessed in this epoch
    roles: [Consultant]
    code: 200
    input: []
    output: RefreshCycle
    side_effects:
      - "RefreshCycle OPEN -> CLOSED"
      - "set Facility.assessment_epoch to this epoch"
