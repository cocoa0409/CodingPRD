      - name: duplicate_report_period_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_DUPLICATE_REPORT]"]
        distinguishing_aspect: "One report per (well_id, water_year, month) across all statuses: a second June-2026 report for the same well fails with ERR_DUPLICATE_REPORT even while the first is only SUBMITTED."
        test_recipe:
          setup: ["Account WD-2 (ACTIVE) with ACTIVE PRODUCTION well; June-2026 report already SUBMITTED"]
          setup_api_calls:
