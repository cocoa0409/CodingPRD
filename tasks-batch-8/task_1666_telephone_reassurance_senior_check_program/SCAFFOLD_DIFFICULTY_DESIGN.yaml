            - { call: "POST /api/participants/${p_id}/call-schedules", payload: { weekday: "MON", window_start: "09:00", window_end: "11:00" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers", payload: { full_name: "Vol C", phone: "555-2702" }, as: ProgramCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /api/volunteers/${v_id}/begin-training", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "SAFETY_PROTOCOL", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "LISTENING_SKILLS", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "MANDATED_REPORTING", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/confidentiality-agreements", payload: { policy_version: "v2026.1", valid_until: "2027-08-01T00:00:00Z" }, as: VolunteerCaller, as_user_id: "${v_id}", captures: { ag1: $.data.id } }
            - { call: "POST /api/volunteers/${v_id}/certify", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/availability-windows", payload: { weekday: "MON", window_start: "08:00", window_end: "17:00", effective_from: "2026-08-01" }, as: ProgramCoordinator }
            - { call: "POST /api/confidentiality-agreements/${ag1}/revoke", payload: {}, as: QualityReviewer }
          trigger:
            - { call: "POST /api/call-assignments", payload: { participant_id: "${p_id}", volunteer_id: "${v_id}", scheduled_date: "2026-08-03", window_start: "09:00", window_end: "09:30" }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /api/volunteers/${v_id}/confidentiality-agreements", payload: { policy_version: "v2026.1", valid_until: "2027-08-01T00:00:00Z" }, as: VolunteerCaller, as_user_id: "${v_id}", captures: { ag2: $.data.id, ag2_status: $.data.status } }
            - { call: "POST /api/call-assignments", payload: { participant_id: "${p_id}", volunteer_id: "${v_id}", scheduled_date: "2026-08-03", window_start: "09:00", window_end: "09:30" }, as: ProgramCoordinator, captures: { a_ok: $.data.id, a_ok_status: $.data.status } }
          assert:
            - "err == ERR_CONFIDENTIALITY_NOT_CURRENT while the volunteer's only agreement is REVOKED (volunteer still status ACTIVE — the gate is agreement currency, not status)"
            - "ag2_status == ACTIVE and the retry succeeds: a_ok_status == SCHEDULED"

