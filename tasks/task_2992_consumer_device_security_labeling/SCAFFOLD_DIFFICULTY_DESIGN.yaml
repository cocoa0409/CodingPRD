            - call: "POST /labeling/enforcement-cases/${case_vac_id}/adjudicate"
              payload: { outcome: "UPHELD", adjudication_note: "Established on six units." }
              as: ProgramAdministrator
              as_user_id: "admin-adjudicate-1"
          trigger:
            - call: "POST /labeling/enforcement-cases/${case_vac_id}/vacate"
              payload: { vacate_reason: "Reconsideration: the reported units were counterfeit hardware, not the sponsor's." }
              as: ProgramAdministrator
              as_user_id: "admin-vacate-1"
          assert:
            - "EnforcementCase.${case_vac_id}.case_status == VACATED and penalty_status == VACATED"
            - "EnforcementCase.${case_vac_id}.penalty_cents is still 28980 (the assessed figure is preserved, not zeroed)"
            - "Manufacturer.${mfr_small_id}.outstanding_penalty_cents == 0"
            - "Manufacturer.${mfr_small_id}.vacated_penalty_cents == 28980"
            - "Manufacturer.${mfr_small_id}.paid_penalty_cents == 0"
            - "Manufacturer.${mfr_small_id}.total_assessed_penalty_cents == 28980, unchanged by the vacate"
            - "the invariant holds: 0 + 0 + 28980 == 28980"
            - "Manufacturer.${mfr_small_id}.upheld_case_count == 0 and standing == GOOD"
            - "LabelGrant.${grant_vac_id}.grant_status == ACTIVE with suspension_reason null and renewal_required false"
            - "RetailerDisplayAuthorization.${auth_vac_id}.status is still WITHDRAWN with withdrawal_reason GRANT_SUSPENDED, and Retailer.${retailer_id}.active_display_count == 0 with participation_tier BASELINE"

      - name: cancelled_engagement_restores_lab_bench_hour_ledger
        conserved_quantity: "TestLab bench capacity: reserved_bench_hours + available_bench_hours == total_bench_hours, with total_bench_hours immutable at 240"
        grounds:
          - state_machines.TestEngagement.transitions.SCHEDULED_to_CANCELLED
          - calculations.lab_bench_hour_ledger
          - validations.priority_61_ERR_LAB_BENCH_HOURS_EXCEEDED
          - entities.TestLab.fields.available_bench_hours
        distinguishing_aspect: |
          A different conserved quantity (hours, not money) restored by a different compensation: each
          cancellation credits exactly its own bench_hours back, the two-term identity holds after every
          step, and the released capacity is genuinely reusable — a 240-hour booking in the just-freed
          window succeeds, after which a 1-hour booking anywhere is refused because available is 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "TIER_2 tier, ELIGIBLE HOME_ROUTER category, five-criterion catalogue."
            - "Cascade Security Labs: ACCREDITED, total_bench_hours 240, concurrent_bench_capacity 2."
            - "One SMALL manufacturer with an ELIGIBLE router product carrying an UNDER_REVIEW third-party-route assessment."
            - "Two SCHEDULED engagements of 48 hours each: E1 [2026-09-01, 2026-09-03) and E2 [2026-09-10, 2026-09-12), so reserved is 96 and available is 144."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_2", required_route: "THIRD_PARTY_TEST", label_validity_days: 730, min_overall_score: 80.80, unverified_weight_factor: 0.60, issuance_base_fee_cents: 145000, max_deficiency_rounds: 1 }
              as: ProgramAdministrator
              captures: { tier2_id: $.data.id }
            - call: "POST /labeling/device-categories"
              payload: { category_code: "HOME_ROUTER", display_name: "Home Router", eligibility_status: "ELIGIBLE", program_tier_id: "${tier2_id}", min_support_period_days: 1095 }
              as: ProgramAdministrator
              captures: { cat_router_id: $.data.id }
            - call: "POST /labeling/security-criteria"
              payload: { criteria: [ { criterion_code: "AUTH-1", practice_area: "AUTHENTICATION", weight: 60, requires_lab_verification: true, criterion_text: "Unique per-device credentials or forced change at first use" }, { criterion_code: "AUTH-2", practice_area: "AUTHENTICATION", weight: 40, requires_lab_verification: false, criterion_text: "Brute-force resistant authentication with lockout" }, { criterion_code: "UPD-1", practice_area: "SOFTWARE_UPDATE", weight: 100, requires_lab_verification: true, criterion_text: "Signed automatic security updates for the declared support period" }, { criterion_code: "DATA-1", practice_area: "DATA_PROTECTION", weight: 100, requires_lab_verification: false, criterion_text: "Personal data encrypted in transit and at rest" }, { criterion_code: "VDP-1", practice_area: "VULN_DISCLOSURE", weight: 100, requires_lab_verification: false, criterion_text: "Published vulnerability disclosure policy with monitored contact" } ] }
              as: ProgramAdministrator
              captures: { crit_auth1_id: "$.data[0].id", crit_auth2_id: "$.data[1].id", crit_upd1_id: "$.data[2].id", crit_data1_id: "$.data[3].id", crit_vdp1_id: "$.data[4].id" }
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Northwind Devices LLC", contact_email: "compliance@northwind.example", enterprise_class: "SMALL", annual_us_revenue_cents: 250000000 }
              as: ProgramAdministrator
              captures: { mfr_small_id: $.data.id }
            - call: "POST /labeling/test-labs"
              payload: { lab_name: "Cascade Security Labs", accreditation_status: "ACCREDITED", total_bench_hours: 240, concurrent_bench_capacity: 2 }
              as: ProgramAdministrator
              captures: { lab_acc_id: $.data.id }
            - call: "POST /labeling/products"
              payload: { manufacturer_id: "${mfr_small_id}", device_category_id: "${cat_router_id}", model_name: "Northwind Router R7", sku: "NW-RTR-R7", firmware_version: "1.0.0", declared_support_period_end: "2030-01-01T00:00:00Z", update_policy_disclosed: true, retail_units_shipped: 40000 }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { prod_router_id: $.data.id, prod_router_v: $.data.version }
            - call: "POST /labeling/products/${prod_router_id}/assessments"
              payload: { expected_product_version: "${prod_router_v}" }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { asmt_ledger_id: $.data.id }
            - call: "POST /labeling/assessments/${asmt_ledger_id}/responses"
              payload: { responses: [ { criterion_id: "${crit_auth1_id}", self_declared_conformant: true, evidence_ref: "EV-AUTH1" }, { criterion_id: "${crit_auth2_id}", self_declared_conformant: true, evidence_ref: "EV-AUTH2" }, { criterion_id: "${crit_upd1_id}", self_declared_conformant: true, evidence_ref: "EV-UPD1" }, { criterion_id: "${crit_data1_id}", self_declared_conformant: true, evidence_ref: "EV-DATA1" }, { criterion_id: "${crit_vdp1_id}", self_declared_conformant: true, evidence_ref: "EV-VDP1" } ] }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/assessments/${asmt_ledger_id}/submit"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/test-engagements"
              payload: { assessment_id: "${asmt_ledger_id}", test_lab_id: "${lab_acc_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-03T00:00:00Z", bench_hours: 48 }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { eng_c1_id: $.data.id }
            - call: "POST /labeling/test-engagements"
              payload: { assessment_id: "${asmt_ledger_id}", test_lab_id: "${lab_acc_id}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-12T00:00:00Z", bench_hours: 48 }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { eng_c2_id: $.data.id }
          trigger:
            - call: "POST /labeling/test-engagements/${eng_c1_id}/cancel"
              payload: { cancellation_reason: "Sample shipment delayed." }
              as: TestLabOperator
              as_user_id: "${lab_acc_id}"
            - call: "POST /labeling/test-engagements/${eng_c2_id}/cancel"
              payload: { cancellation_reason: "Second window released as well." }
              as: TestLabOperator
              as_user_id: "${lab_acc_id}"
            - call: "POST /labeling/test-engagements"
              payload: { assessment_id: "${asmt_ledger_id}", test_lab_id: "${lab_acc_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-03T00:00:00Z", bench_hours: 240 }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { eng_c3_id: $.data.id }
            - call: "POST /labeling/test-engagements"
              payload: { assessment_id: "${asmt_ledger_id}", test_lab_id: "${lab_acc_id}", window_start: "2026-11-01T00:00:00Z", window_end: "2026-11-02T00:00:00Z", bench_hours: 1 }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
          assert:
            - "after cancelling E1: TestEngagement.${eng_c1_id}.status == CANCELLED with cancellation_reason set, TestLab.${lab_acc_id}.reserved_bench_hours == 48 and available_bench_hours == 192"
            - "after cancelling E2: TestEngagement.${eng_c2_id}.status == CANCELLED, reserved_bench_hours == 0 and available_bench_hours == 240, exactly the pre-scheduling values"
            - "the invariant reserved_bench_hours + available_bench_hours == 240 holds after every one of the four trigger calls"
            - "the 240-hour booking in E1's just-freed window returns 201: a CANCELLED engagement neither reserves hours nor occupies a concurrency slot"
            - "after the 240-hour booking reserved_bench_hours == 240 and available_bench_hours == 0"
            - "the trailing 1-hour booking in a completely free November window -> ERR_LAB_BENCH_HOURS_EXCEEDED (409), proving the ledger, not the calendar, is the binding limit"
            - "TestLab.${lab_acc_id}.total_bench_hours is still 240 throughout"
