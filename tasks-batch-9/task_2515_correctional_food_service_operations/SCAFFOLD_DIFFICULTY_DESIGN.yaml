          assert:
            - "${release_a} == 2026-08-01T12:30:00Z and ${release_b} == 2026-08-01T14:30:00Z (360 cook-chill minutes plus a 30-minute sanitation buffer)"
            - "${capacity_error} == ERR_CHILLER_CAPACITY_EXCEEDED with HTTP 409 - a start instant equal to batch A's buffered_release_at counts as an overlap under closed-interval semantics, so concurrent_occupancy is 2 and 2 < 2 is false"
            - "Facility.${facility_id}.version == ${facility_vc} immediately after the rejection (the rejected create bumped nothing)"
            - "${stage_d} == PLANNED and ProductionBatch.${batch_d}.scheduled_cook_start_at == 2026-08-01T12:30:01Z - one second later it overlaps only batch B, so concurrent_occupancy is 1"
            - "ProductionBatch.${batch_d}.buffered_release_at == 2026-08-01T18:30:01Z"
            - "Exactly three ProductionBatch rows exist for MealForecast.${forecast_id} (A, B and D), totalling 15 planned trays against the 22-tray budget"
            - "ProductionBatch.${batch_a}.production_stage == PLANNED and ProductionBatch.${batch_b}.production_stage == PLANNED (neither was disturbed)"

  # ===========================================================================
  # Rule 9 - compensating invariants over different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: supersede_verify_leaves_special_diet_census_unchanged
        grounds:
          - calculations.special_diet_census_invariant
          - state_machines.DietOrder.PENDING_VERIFICATION_to_ACTIVE
          - entities.Inmate.fields.active_diet_order_count
          - entities.Facility.fields.active_special_diet_count
        distinguishing_aspect: |
          The conserved quantity is the ACTIVE special-diet census, held on two denormalised counters
          at once (Inmate.active_diet_order_count and Facility.active_special_diet_count). A verify
          carrying supersedes_diet_order_id performs a +1 promotion and a -1 revocation inside one
          operation, so both counters must read exactly the same value after the trigger as before
          it, even though two DietOrder rows changed status. The falsifier is a second verify without
          supersedes_diet_order_id, which must raise both counters by exactly 1 - proving the test
          detects a naive implementation that either double-counts the supersede or forgets to
          increment at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ServiceContract CFS-2515-CI1 ACTIVE with Facility FAC-CI1."
            - "One IN_CUSTODY Inmate BK-0001 with religious_affiliation MUSLIM."
            - "Incumbent DietOrder A: RELIGIOUS / HALAL, window 2026-08-01T00:00:00Z to 2026-09-01T00:00:00Z, verified by ch-001 so ACTIVE. Both census counters read 1."
            - "Successor DietOrder B: RELIGIOUS / VEGETARIAN_RELIGIOUS over the identical window with supersedes_diet_order_id pointing at A, still PENDING_VERIFICATION (the exemption in calculations.diet_order_coverage_window is what makes the identical window legal)."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-CI1", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-CI1", name: "North Unit Kitchen", sharps_authorized_count: 12, satellite_site_count: 0, blast_chiller_capacity: 2 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/service-contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/inmates"
              payload: { facility_id: "${facility_id}", booking_number: "BK-0001", housing_unit: "GENERAL", religious_affiliation: "MUSLIM" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { inmate_id: $.data.id, inmate_v1: $.data.version }
            - call: "POST /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", order_type: "RELIGIOUS", diet_code: "HALAL", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_inmate_version: "${inmate_v1}" }
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { order_a: $.data.id }
            - call: "POST /cfs/diet-orders/${order_a}/verify"
              payload: { verification_note: "Chaplain interview completed" }
              as: ChaplainDesignee
              as_user_id: "ch-001"
            - call: "GET /cfs/inmates/${inmate_id}"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { inmate_v2: $.data.version, count_before: $.data.active_diet_order_count }
            - call: "POST /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", order_type: "RELIGIOUS", diet_code: "VEGETARIAN_RELIGIOUS", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_inmate_version: "${inmate_v2}", supersedes_diet_order_id: "${order_a}" }
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { order_b: $.data.id }
            - call: "GET /cfs/facilities/${facility_id}"
              payload: {}
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { facility_census_before: $.data.active_special_diet_count }
          trigger:
            - call: "POST /cfs/diet-orders/${order_b}/verify"
              payload: { verification_note: "Supersedes the halal order at the inmate's request" }
              as: ChaplainDesignee
              as_user_id: "ch-001"
              captures: { order_b_status: $.data.status }
            - call: "GET /cfs/inmates/${inmate_id}"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { count_after: $.data.active_diet_order_count, inmate_v3: $.data.version }
            - call: "POST /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", order_type: "MEDICAL", diet_code: "GLUTEN_FREE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_inmate_version: "${inmate_v3}", clinical_indication: "Biopsy-confirmed coeliac disease" }
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { order_c: $.data.id }
            - call: "POST /cfs/diet-orders/${order_c}/verify"
              payload: { verification_note: "Chart reviewed" }
              as: MedicalProvider
              as_user_id: "md-001"
            - call: "GET /cfs/inmates/${inmate_id}"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { count_final: $.data.active_diet_order_count }
          assert:
            - "${count_before} == 1 and ${facility_census_before} == 1 (creating the PENDING_VERIFICATION successor changed neither counter)"
            - "${order_b_status} == ACTIVE and DietOrder.${order_a}.status == REVOKED after the same single verify call"
            - "${count_after} == 1 - identical to ${count_before}, because the +1 promotion and the -1 revocation cancel"
            - "Facility.${facility_id}.active_special_diet_count == 1 after the supersede verify, identical to ${facility_census_before}"
            - "DietOrder.${order_a}.version and DietOrder.${order_b}.version both increased, so the unchanged counters are not the result of a no-op"
            - "${count_final} == 2 and Facility.${facility_id}.active_special_diet_count == 2 after the non-superseding MEDICAL verify (the falsifier: an ordinary verify moves both counters by exactly +1)"
            - "Exactly three DietOrder rows exist for Inmate.${inmate_id}: one REVOKED and two ACTIVE"

      - name: sharps_conservation_identity_holds_across_unaccounted_and_recovery
        grounds:
          - calculations.sharps_accountability_reconciliation
          - entities.Facility.fields.sharps_on_board_count
          - state_machines.ToolIssuance.UNACCOUNTED_to_RETURNED
          - endpoints[POST /cfs/facilities/{id}/sharps-audit]
        distinguishing_aspect: |
          A different conserved quantity - the sharps count identity
          sharps_on_board_count + sharps_issued_count + sharps_unaccounted_count ==
          sharps_authorized_count - must hold after every single mutation, including the
          declare-unaccounted that only moves a tool between two of the three buckets and the
          recovery return that undoes it. The compensation is asserted bucket by bucket at four
          checkpoints, and a NON_SHARP issuance is threaded through to prove it is excluded from all
          three counters rather than silently conserved. A closing audit of counted_on_board 12
          re-records a shortfall of exactly 0, confirming no drift accumulated.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ServiceContract CFS-2515-CI2 ACTIVE with Facility FAC-CI2 whose sharps_authorized_count is 12, so at creation sharps_on_board_count is 12, sharps_issued_count 0 and sharps_unaccounted_count 0."
            - "One IN_CUSTODY Inmate BK-0001 and one CLEARED, sharps_eligible InmateWorker ASSIGNED to SANITATION."
            - "One ISSUED NON_SHARP ToolIssuance (a plastic scoop) held by that worker."
            - "One ISSUED SHARP_KNIFE ToolIssuance held by that worker, so sharps_on_board_count is 11 and sharps_issued_count is 1."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-CI2", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-CI2", name: "North Unit Kitchen", sharps_authorized_count: 12, satellite_site_count: 0, blast_chiller_capacity: 2 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id, on_board_0: $.data.sharps_on_board_count }
            - call: "POST /cfs/service-contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/inmates"
              payload: { facility_id: "${facility_id}", booking_number: "BK-0001", housing_unit: "GENERAL" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { inmate_id: $.data.id }
            - call: "POST /cfs/inmate-workers"
              payload: { inmate_id: "${inmate_id}", facility_id: "${facility_id}", medical_clearance_expires_at: "2026-12-31T00:00:00Z", sharps_eligible: true }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { worker_id: $.data.id }
            - call: "POST /cfs/inmate-workers/${worker_id}/assign"
              payload: { work_area: "SANITATION" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/tool-issuances"
              payload: { facility_id: "${facility_id}", issued_to_worker_id: "${worker_id}", tool_class: "NON_SHARP", tool_serial: "SCOOP-001", shadow_board_slot: "B-1" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { nonsharp_id: $.data.id }
            - call: "GET /cfs/facilities/${facility_id}/sharps-summary"
              payload: {}
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { on_board_after_nonsharp: $.data.sharps_on_board_count, issued_after_nonsharp: $.data.sharps_issued_count }
            - call: "POST /cfs/tool-issuances"
              payload: { facility_id: "${facility_id}", issued_to_worker_id: "${worker_id}", tool_class: "SHARP_KNIFE", tool_serial: "KN-001", shadow_board_slot: "A-1" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { sharp_id: $.data.id }
            - call: "GET /cfs/facilities/${facility_id}/sharps-summary"
              payload: {}
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { on_board_1: $.data.sharps_on_board_count, issued_1: $.data.sharps_issued_count, unaccounted_1: $.data.sharps_unaccounted_count }
          trigger:
            - call: "POST /cfs/tool-issuances/${sharp_id}/declare-unaccounted"
              payload: { narrative: "KN-001 missing from shadow board slot A-1" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
            - call: "GET /cfs/facilities/${facility_id}/sharps-summary"
              payload: {}
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { on_board_2: $.data.sharps_on_board_count, issued_2: $.data.sharps_issued_count, unaccounted_2: $.data.sharps_unaccounted_count }
            - call: "POST /cfs/tool-issuances/${sharp_id}/return"
              payload: { returned_count_verified: 1 }
              as: CorrectionalOfficer
              as_user_id: "co-002"
              captures: { returned_status: $.data.status, recovered_flag: $.data.recovered }
            - call: "GET /cfs/facilities/${facility_id}/sharps-summary"
              payload: {}
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { on_board_3: $.data.sharps_on_board_count, issued_3: $.data.sharps_issued_count, unaccounted_3: $.data.sharps_unaccounted_count }
            - call: "POST /cfs/facilities/${facility_id}/sharps-audit"
              payload: { counted_on_board: 12 }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { audit_shortfall: $.data.sharps_audit_shortfall, posture_after_audit: $.data.kitchen_posture }
          assert:
            - "${on_board_0} == 12 and 12 + 0 + 0 == 12 (the identity holds at creation)"
            - "${on_board_after_nonsharp} == 12 and ${issued_after_nonsharp} == 0 (a NON_SHARP issuance touches none of the three sharps buckets)"
            - "${on_board_1} == 11, ${issued_1} == 1, ${unaccounted_1} == 0 and 11 + 1 + 0 == 12"
            - "${on_board_2} == 11, ${issued_2} == 0, ${unaccounted_2} == 1 and 11 + 0 + 1 == 12 (declare-unaccounted moved the tool between buckets without changing the total)"
            - "${returned_status} == RETURNED and ${recovered_flag} == true"
            - "${on_board_3} == 12, ${issued_3} == 0, ${unaccounted_3} == 0 and 12 + 0 + 0 == 12 (the recovery return fully compensated the declaration)"
            - "${audit_shortfall} == 0 - the closing audit of counted_on_board 12 confirms no drift accumulated across the four mutations"
            - "${posture_after_audit} == OPEN, because open_sharps_discrepancy_count is back to 0, sharps_audit_shortfall is 0 and the single auto-created ContrabandIncident is below CONTRABAND_RESTRICT_THRESHOLD 2"
            - "ToolIssuance.${nonsharp_id}.status is still ISSUED (the sharps workflow never touched it)"
