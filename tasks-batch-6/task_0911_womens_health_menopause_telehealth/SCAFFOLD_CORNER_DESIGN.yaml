      - name: visit_with_unknown_provider_returns_provider_not_found
        claim_type: FK integrity
        grounds: ["entities.Visit.fields.provider_id", "errors[ERR_PROVIDER_NOT_FOUND]"]
        distinguishing_aspect: "Scheduling a visit with a non-existent provider_id returns ERR_PROVIDER_NOT_FOUND (404)."
