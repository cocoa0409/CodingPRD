      - name: signing_off_a_second_package_supersedes_the_first_and_leaves_the_program_state_alone
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ExposureSubmission.transitions[SIGNED_OFF->SUPERSEDED]
          - state_machines.Program.transitions[DRAFT->SUBMISSION_READY]
          - endpoints.POST /exposure-submissions/{submission_id}/signoff
        distinguishing_aspect: |
          The DRAFT → SUBMISSION_READY cascade has a precondition of Program.placement_status ==
          DRAFT, so the SECOND signoff cannot re-fire it; what it does fire is the supersede side
          effect. After the second signoff the first package is SUPERSEDED (terminal), the second is
          SIGNED_OFF, and Program.placement_status is still SUBMISSION_READY — proof the side effect
          ran without the state transition.
        test_recipe:
          setup:
            - "One DRAFT program with two exposure packages; the first is signed off, moving the program to SUBMISSION_READY."
            - "The second package is created while the program is still DRAFT and is submitted for review before the program leaves DRAFT."
