          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PERMITTED with remedy_budget_cents 50000 and remedy_spent_cents 0"
            - "order O1 quoted at 850 with declared_value_cents 9000, settled_fee_cents null"
            - "the mission for O1 was aborted from PLANNED with DISPATCH_CANCELLED, so the order is EXCEPTION with exception_reason ROBOT_FAULT"
            - "the ROBOT_FAULT policy row is fee_refund_pct 0.35, declared_value_pct 0.6 and goodwill_cents 250"
