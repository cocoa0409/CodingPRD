            - "First validate (no ACTIVE NY registration): error_id == ERR_REGISTRATION_NOT_ACTIVE"
            - "After NY-WH registration ACTIVE: validate succeeds, election status == VALIDATED (effective_from 2026-09-01 > clock 2026-08-20)"

  # ---------------------------------------------------------------- Rule 8 ---
  - rule_id: resource_temporal_overlap
    instances:
      - name: election_half_open_adjacency_vs_overlap
        grounds:
          - validations[priority=16]
          - entities.WithholdingElection.fields.effective_to
          - errors[ERR_ELECTION_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = half-open [from, to): an election starting
          exactly at the prior election's effective_to is ADJACENT and allowed,
          while starting one day earlier overlaps and is rejected. Contrasts
          with the closed-interval agreement semantics in the sibling instance.
        test_recipe:
          setup:
            - "Employer; NJ office; employee resident PA working NJ; no supersede_existing flag used"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector }
            - { call: "POST /etax/work-locations", payload: { label: "Jersey Home", address_line1: "5 Grove St", city: "Jersey City", state_code: "NJ", postal_code: "07302", location_type: "REMOTE_HOME" }, as: NexusAnalyst, captures: { wl_nj: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-1201", full_name: "Z One", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_nj}" }, as: NexusAnalyst, captures: { e_id: $.data.id, e_v: $.data.version } }
          trigger:
            - { call: "POST /etax/withholding-elections", payload: { employee_id: "${e_id}", election_type: "RECIPROCITY_EXEMPTION", work_state_code: "NJ", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_employee_version: "${e_v}" }, as: Employee, as_user_id: "${e_id}", captures: { el_a: $.data.id } }
            - { call: "GET /etax/employees/${e_id}", payload: {}, as: TaxDirector, captures: { e_v2: $.data.version } }
            - { call: "POST /etax/withholding-elections", payload: { employee_id: "${e_id}", election_type: "RECIPROCITY_EXEMPTION", work_state_code: "NJ", effective_from: "2026-12-31T00:00:00Z", expected_employee_version: "${e_v2}" }, as: Employee, as_user_id: "${e_id}", captures: { el_b: $.data.id } }
            - { call: "GET /etax/employees/${e_id}", payload: {}, as: TaxDirector, captures: { e_v3: $.data.version } }
            - { call: "POST /etax/withholding-elections", payload: { employee_id: "${e_id}", election_type: "RECIPROCITY_EXEMPTION", work_state_code: "NJ", effective_from: "2026-12-30T00:00:00Z", expected_employee_version: "${e_v3}" }, as: Employee, as_user_id: "${e_id}", captures: { err: $.data.error_id } }
          assert:
            - "Election A [2026-08-01, 2026-12-31) created: ${el_a} exists"
            - "Election B starting exactly at A's effective_to (2026-12-31) is adjacent under half-open semantics: created (${el_b} exists)"
            - "Election C starting 2026-12-30 overlaps A by one day: error_id == ERR_ELECTION_OVERLAP"

      - name: agreement_closed_interval_boundary_overlap
        grounds:
          - validations[priority=17]
          - entities.ReciprocityAgreement.fields.effective_to
          - errors[ERR_AGREEMENT_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = CLOSED [from, to] (both ends inclusive, different
          from the election half-open rule): a new agreement whose from equals
          the prior agreement's inclusive to SHARES that day and is rejected;
          only from == prior.to + 1 day is disjoint.
        test_recipe:
          setup:
            - "Employer; existing PA-NJ agreement covering [2020-01-01, 2025-12-31] inclusive"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector }
            - { call: "POST /etax/reciprocity-agreements", payload: { state_a: "PA", state_b: "NJ", effective_from: "2020-01-01T00:00:00Z", effective_to: "2025-12-31T00:00:00Z", certificate_form_code: "NJ-165", scope: "FULL" }, as: TaxDirector, captures: { ag1: $.data.id, ag1_status: $.data.status } }
          trigger:
            - { call: "POST /etax/reciprocity-agreements", payload: { state_a: "NJ", state_b: "PA", effective_from: "2025-12-31T00:00:00Z", scope: "FULL" }, as: TaxDirector, captures: { err: $.data.error_id } }
            - { call: "POST /etax/reciprocity-agreements", payload: { state_a: "PA", state_b: "NJ", effective_from: "2026-01-01T00:00:00Z", scope: "FULL" }, as: TaxDirector, captures: { ag3: $.data.id, ag3_status: $.data.status } }
          assert:
            - "Agreement starting 2025-12-31 (the prior agreement's inclusive end day): error_id == ERR_AGREEMENT_OVERLAP (closed intervals share that date; unordered pair match NJ-PA == PA-NJ)"
            - "Agreement starting 2026-01-01 (first disjoint day): created, status == ACTIVE at default clock 2026-08-01"
            - "First agreement ${ag1} status == EXPIRED (effective_to 2025-12-31 < clock)"

  # ---------------------------------------------------------------- Rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: location_reversal_conserves_attribution_totals
        grounds:
          - state_machines.LocationChange.EFFECTIVE_to_REVERSED
          - calculations.nexus_threshold_evaluation
        distinguishing_aspect: |
          Conserved quantity = per-state attribution totals (employee_days_ytd
          and wages_ytd_cents on each NexusCase) plus the employee's location:
          EFFECTIVE followed by its compensating REVERSED returns OR days to
          exactly 20 and OR wages to exactly 164,384 cents — zero drift.
        test_recipe:
          setup:
            - "Employer; OR/NJ locations; employee hired 2026-08-01 in OR wage 3,000,000; OR NexusCase at 20 days (wages 164,384) on 2026-08-20; NJ NexusCase WATCH"
            - "LocationChange OR->NJ effective 2026-08-21 APPROVED, then effectuated by sweep at 2026-08-21"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector }
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Jersey Home", address_line1: "5 Grove St", city: "Jersey City", state_code: "NJ", postal_code: "07302", location_type: "REMOTE_HOME" }, as: NexusAnalyst, captures: { wl_nj: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-1301", full_name: "AA One", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst, captures: { e_id: $.data.id } }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "OR" }, as: NexusAnalyst, captures: { nc_or: $.data.id } }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "NJ" }, as: NexusAnalyst, captures: { nc_nj: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_or}/recompute", payload: {}, as: NexusAnalyst, captures: { or_days_pre: $.data.employee_days_ytd, or_wages_pre: $.data.wages_ytd_cents } }
            - { call: "POST /etax/location-changes", payload: { employee_id: "${e_id}", to_work_location_id: "${wl_nj}", effective_date: "2026-08-21T00:00:00Z", reason: "Relocating" }, as: Employee, as_user_id: "${e_id}", captures: { lc_id: $.data.id } }
            - { call: "POST /etax/location-changes/${lc_id}/approve", payload: {}, as: NexusAnalyst, as_user_id: "na-1" }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T00:00:00Z" }, as: TaxDirector }
          trigger:
            - { call: "POST /etax/location-changes/${lc_id}/reverse", payload: {}, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_or}/recompute", payload: {}, as: NexusAnalyst, captures: { or_days_post: $.data.employee_days_ytd, or_wages_post: $.data.wages_ytd_cents } }
            - { call: "GET /etax/employees/${e_id}", payload: {}, as: TaxDirector, captures: { e_loc: $.data.current_work_location_id } }
          assert:
            - "Pre-change snapshot: ${or_days_pre} == 20 and ${or_wages_pre} == 164384"
            - "After EFFECTIVE + REVERSED: OR employee_days_ytd == 20 and wages_ytd_cents == 164384 — identical to the snapshot (invariant holds, no drift)"
            - "Employee.${e_id}.current_work_location_id == ${wl_or} (restored from from_location_snapshot)"
            - "LocationChange.${lc_id}.status == REVERSED"

      - name: assess_then_full_abate_conserves_outstanding_penalty
        grounds:
          - state_machines.FilingObligation.LATE_to_WAIVED
          - state_machines.AbatementRequest.UNDER_REVIEW_to_GRANTED
          - calculations.abatement_eligibility
          - calculations.compliance_posture
        distinguishing_aspect: |
          Conserved quantity = Employer.outstanding_penalty_cents (money, a
          different quantity type from day/wage attribution): the LATE cascade
          adds 2500, and the compensating full FIRST_TIME abatement returns the
          employer-wide total to its pre-penalty value of 0.
        test_recipe:
          setup:
            - "Employer (outstanding_penalty_cents == 0); OR-WH 500bp; one OR employee wage 9,125,000 hired 2026-08-01; OR nexus CONFIRMED; MONTHLY registration ACTIVE; clock advanced to 2026-09-16 so the Aug deposit (38,750 cents, due 2026-09-15) is LATE with a provisional 2,500-cent notice"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /etax/tax-agencies", payload: { agency_kind: "STATE_WITHHOLDING", state_code: "OR", agency_name: "Oregon DOR", withholding_rate_bp: 500 }, as: TaxDirector, captures: { ag_or_wh: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-1311", full_name: "AB One", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 9125000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "OR" }, as: NexusAnalyst, captures: { nc_or: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_or}/recompute", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases/${nc_or}/confirm", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations", payload: { agency_id: "${ag_or_wh}", projected_annual_withholding_cents: 3000000, expected_employer_version: "${emp_v}" }, as: NexusAnalyst, captures: { reg_or: $.data.id } }
            - { call: "POST /etax/registrations/${reg_or}/submit", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations/${reg_or}/activate", payload: { account_number: "OR-00000006" }, as: NexusAnalyst }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: TaxDirector }
            - { call: "GET /etax/agency-notices", payload: { registration_id: "${reg_or}" }, as: PayrollComplianceLead, captures: { n_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /etax/abatement-requests", payload: { agency_notice_id: "${n_id}", abatement_type: "FIRST_TIME", requested_amount_cents: 2500, reason: "First penalty in three years" }, as: PayrollComplianceLead, as_user_id: "pcl-1", captures: { ab_id: $.data.id, ab_elig: $.data.eligible_amount_cents, ab_prior: $.data.prior_penalty_count_3yr } }
            - { call: "POST /etax/abatement-requests/${ab_id}/submit", payload: {}, as: PayrollComplianceLead, as_user_id: "pcl-1" }
            - { call: "POST /etax/abatement-requests/${ab_id}/review", payload: {}, as: TaxDirector, as_user_id: "dir-1" }
            - { call: "POST /etax/abatement-requests/${ab_id}/decide", payload: { decision: "GRANTED" }, as: TaxDirector, as_user_id: "dir-1", captures: { ab_granted: $.data.granted_amount_cents, ab_status: $.data.status } }
            - { call: "GET /etax/employers/${emp_id}", payload: {}, as: TaxDirector, captures: { out_post: $.data.outstanding_penalty_cents } }
            - { call: "GET /etax/agency-notices/${n_id}", payload: {}, as: TaxDirector, captures: { n_abated: $.data.abated_amount_cents } }
            - { call: "GET /etax/filing-obligations", payload: { registration_id: "${reg_or}", status: "WAIVED" }, as: TaxDirector, captures: { waived_amt: "$.data[0].amount_due_cents" } }
          assert:
            - "AbatementRequest.${ab_id}: prior_penalty_count_3yr == 0, eligible_amount_cents == 2500, granted_amount_cents == 2500, status == GRANTED"
            - "AgencyNotice.${n_id}.abated_amount_cents == 2500 (full outstanding)"
            - "Employer.outstanding_penalty_cents == 0 after the grant — identical to the pre-penalty baseline (invariant: assess 2500 + abate 2500 conserves the total)"
            - "The linked LATE obligation (38,750 cents) is WAIVED: waived row amount_due_cents == 38750"
