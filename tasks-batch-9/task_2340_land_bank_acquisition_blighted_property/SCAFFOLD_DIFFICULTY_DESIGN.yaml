            - call: "POST /land-bank/properties/${p_id}/list"
              payload: {}
              as: DispositionOfficer
              as_user_id: "disp-1"
            - call: "POST /land-bank/applicants"
              payload: { legal_name: "Foster Redevelopment LLC", applicant_type: "DEVELOPER", contact_email: "deals@foster-redev.example" }
