      - name: grade_routing_rules
        claim_type: conditional_validation
        grounds: ["validations[priority=8]", "errors[ERR_GRADE_NOT_REFURBISHABLE]", "errors[ERR_GRADE_NOT_HARVESTABLE]", "errors[ERR_SCRAP_CRITERIA_NOT_MET]"]
        distinguishing_aspect: "Routing is conditional on triage grade: REFURBISH rejects D; HARVEST rejects A; SCRAP requires D AND frame_damage (D without damage and C with damage both rejected)."
        test_recipe:
          setup: ["four TRIAGED bikes: D+damage, A, C+damage, D no damage"]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D GR", donor_type: "INDIVIDUAL", email: "dgr@x.org" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-G1", bike_type: "ROAD", wheel_size_inches: 27 }, as: ShopCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /bikes/${b1}/triage", payload: { condition_grade: "D", frame_damage: true }, as: ShopCoordinator }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-G2", bike_type: "ROAD", wheel_size_inches: 27 }, as: ShopCoordinator, captures: { b2: $.data.id } }
            - { call: "POST /bikes/${b2}/triage", payload: { condition_grade: "A", frame_damage: false }, as: ShopCoordinator }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-G3", bike_type: "MTB", wheel_size_inches: 29 }, as: ShopCoordinator, captures: { b3: $.data.id } }
            - { call: "POST /bikes/${b3}/triage", payload: { condition_grade: "C", frame_damage: true }, as: ShopCoordinator }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-G4", bike_type: "BMX", wheel_size_inches: 20 }, as: ShopCoordinator, captures: { b4: $.data.id } }
            - { call: "POST /bikes/${b4}/triage", payload: { condition_grade: "D", frame_damage: false }, as: ShopCoordinator }
          trigger:
            - { call: "POST /bikes/${b1}/route", payload: { destination: "REFURBISH", refurb_lead_volunteer_id: "00000000-0000-4000-8000-000000000000" }, as: ShopCoordinator, captures: { e1: $.data.error_id } }
            - { call: "POST /bikes/${b2}/route", payload: { destination: "HARVEST" }, as: ShopCoordinator, captures: { e2: $.data.error_id } }
            - { call: "POST /bikes/${b3}/route", payload: { destination: "SCRAP" }, as: ShopCoordinator, captures: { e3: $.data.error_id } }
            - { call: "POST /bikes/${b4}/route", payload: { destination: "SCRAP" }, as: ShopCoordinator, captures: { e4: $.data.error_id } }
            - { call: "POST /bikes/${b1}/route", payload: { destination: "SCRAP" }, as: ShopCoordinator, captures: { ok_st: $.data.status } }
          assert:
            - "REFURBISH on grade D -> ERR_GRADE_NOT_REFURBISHABLE (fails before the lead reference is even consulted)"
            - "HARVEST on grade A -> ERR_GRADE_NOT_HARVESTABLE"
            - "SCRAP on grade C with frame damage -> ERR_SCRAP_CRITERIA_NOT_MET"
            - "SCRAP on grade D without frame damage -> ERR_SCRAP_CRITERIA_NOT_MET"
            - "SCRAP on grade D with frame damage succeeds: status == SCRAP_PENDING"

      - name: helmet_recipient_reference_mismatch
