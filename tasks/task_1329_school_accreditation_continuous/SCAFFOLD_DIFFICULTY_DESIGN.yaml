              as: AccreditationOfficer
            - call: "POST /accreditation/visits/${visit_0}/confirm"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/terms/${term_id}/visits"
              payload: { campus_id: "${campus_2}", lead_reviewer_id: "${rev_1}", starts_on: "2027-05-01T00:00:00Z", ends_on: "2027-05-03T00:00:00Z" }
