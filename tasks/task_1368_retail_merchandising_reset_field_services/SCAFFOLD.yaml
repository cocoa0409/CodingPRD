errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role lacks permission for the endpoint, or entity_backed ownership check fails (rep acting on another rep's assignment; client acting on another client's project)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or body FK does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the entity's current state"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, bad type, out-of-range value, or enum outside declared set"
  - id: ERR_TEMPORAL_INVALID
    http: 422
    condition: "scheduled_end <= scheduled_start; due_date before scope date; photo captured_at outside visit window"
  - id: ERR_CROSS_ENTITY_MISMATCH
    http: 422
    condition: "Referenced entities do not belong to the declared parent chain (e.g., project_store not under project, assignment not owned by rep)"
  - id: ERR_REP_DOUBLE_BOOKED
    http: 409
    condition: "New assignment interval overlaps an existing SCHEDULED/EN_ROUTE/ON_SITE assignment of the same rep (half-open [start, end) semantics)"
  - id: ERR_DUPLICATE_STORE
    http: 409
    condition: "Same (project_id, store_id) already exists in a non-DROPPED ProjectStore row"
  - id: ERR_FIXTURES_NOT_DELIVERED
    http: 409
    condition: "FIXTURE_INSTALL project: departure or check-in attempted while a required shipment is undelivered per state-machine gating"
  - id: ERR_BILLING_MODEL_UNRESOLVABLE
    http: 422
    condition: "Scoping with neither project nor client billing model set, or the resolved model's rate field missing on the client"
  - id: ERR_OPEN_EXCEPTIONS
    http: 409
    condition: "Invoice finalize attempted while any exception on the project's visits is still OPEN"
  - id: ERR_CLASSIFICATION_FORBIDDEN
    http: 422
    condition: "C1099 rep assigned to a FIXTURE_INSTALL project"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not match project.version at scope time"
  - id: ERR_STALE_INVOICE_VERSION
    http: 412
    condition: "expected_invoice_version does not match invoice.version at finalize time"
  - id: ERR_REWORK_NOT_AUTHORIZED
    http: 409
    condition: "Rework assignment requested without an APPROVED authorization or while store not in REWORK_REQUIRED"
  - id: ERR_DUPLICATE_INVOICE
    http: 409
    condition: "Manual invoice creation attempted while an OPEN or FINALIZED invoice already exists for the project"
  - id: ERR_POSTURE_ESCALATED
    http: 409
    condition: "Client self-approval of rework attempted while project.posture == ESCALATED"

roles:
  - name: Anonymous
    description: "Unauthenticated caller placeholder used only by negative auth tests; the test harness omits X-User-Role and X-User-ID headers when this role is named"
    identity: "opaque"
    exclusive_operations: []
    shared_operations: []
  - name: ProjectManager
    description: "Merchandising company operations manager; owns scoping, scheduling, verification, and shipment coordination"
    identity: "opaque"
    exclusive_operations: [create/scope/cancel projects, manage project store lists, create assignments, verify/reject store visits, resolve exceptions, register/scan fixture shipments, drop project stores]
    shared_operations: [read most entities, file exception reports]
  - name: FieldRep
    description: "1099 or W-2 field merchandiser executing store visits"
    identity: "entity_backed:FieldRep"
    exclusive_operations: [depart, check-in, check-out on own assignments; upload photo evidence; submit own mileage logs]
    shared_operations: [read own assignments, visits, stores, mileage logs]
  - name: Client
    description: "Client (retailer/CPG manufacturer) contact approving rework and reviewing compliance"
    identity: "entity_backed:Client"
    exclusive_operations: [approve or deny rework authorizations for own projects]
    shared_operations: [read own projects, visits, exceptions, invoices, shipments]
  - name: PayrollAdmin
    description: "Payroll operator managing the field workforce and mileage/travel pay"
    identity: "opaque"
    exclusive_operations: [create field reps, approve/reject/pay mileage logs]
    shared_operations: [read reps, assignments, mileage logs]
  - name: BillingClerk
    description: "Billing operator managing client invoicing"
    identity: "opaque"
    exclusive_operations: [create, finalize, void invoices]
    shared_operations: [read projects, visits, exceptions, invoices, clients]
