  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: time_increment_six_vs_seven_minutes
        grounds:
          - calculations.time_entry_amount
          - entities.TimeEntry.fields.billable_amount_cents
        distinguishing_aspect: |
          Metric = 6-minute billing increment via ceil(minutes/6), reached through POST /firm/time-entries:
          exactly 6 minutes bills 0.1 hr (5000 cents) while 7 minutes rounds UP to 0.2 hr (10000 cents).
          The boundary is the ceil step, not a >= threshold.
        test_recipe:
          setup:
            - "Matter OPEN with matter_rate 50000."
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Fact Investigation" }
              as: PlatformAdmin
            - call: "POST /firm/billing-codes"
              payload: { code: "A101", kind: "ACTIVITY", label: "Plan and prepare" }
              as: PlatformAdmin
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "Acme Matter", matter_rate_cents: 50000 }
              as: BillingClerk
              captures: { m_id: $.data.id }
            - call: "POST /firm/matters/${m_id}/conflict-checks"
              payload: { adverse_party_name: "Opposing Co" }
              as: BillingClerk
            - call: "POST /firm/matters/${m_id}/open"
              payload: {}
              as: Attorney
          trigger:
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T09:00:00Z", minutes: 6, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
              captures: { te6: $.data.id, a6: $.data.billable_amount_cents }
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T10:00:00Z", minutes: 7, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
              captures: { te7: $.data.id, a7: $.data.billable_amount_cents }
          assert:
            - "TimeEntry.${te6}.billable_amount_cents == 5000 (6 min == exactly 0.1 hr)"
            - "TimeEntry.${te7}.billable_amount_cents == 10000 (7 min rounds UP to 0.2 hr)"

      - name: collection_aging_due_date_inclusive_boundary
        grounds:
          - calculations.collection_aging
          - entities.Invoice.fields.collection_status
        distinguishing_aspect: |
          A DIFFERENT metric (datetime threshold, reached through POST /_clock/set_current_utc + GET
          invoice) on a DIFFERENT endpoint: at clock == due_date exactly the invoice is DUE (inclusive
          boundary); one second past due_date it becomes OVERDUE (strict >). Distinct from the ceil
          increment boundary above.
        test_recipe:
          setup:
            - "ISSUED invoice total 50000, issue 2026-06-01, net 30 -> due 2026-07-01T00:00:00Z, unpaid."
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Fact Investigation" }
              as: PlatformAdmin
            - call: "POST /firm/billing-codes"
              payload: { code: "A101", kind: "ACTIVITY", label: "Plan and prepare" }
              as: PlatformAdmin
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "Acme Matter", matter_rate_cents: 50000 }
              as: BillingClerk
              captures: { m_id: $.data.id }
            - call: "POST /firm/matters/${m_id}/conflict-checks"
              payload: { adverse_party_name: "Opposing Co" }
              as: BillingClerk
            - call: "POST /firm/matters/${m_id}/open"
              payload: {}
              as: Attorney
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T09:00:00Z", minutes: 60, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
            - call: "POST /firm/invoices"
              payload: { matter_id: "${m_id}", issue_date: "2026-06-01T00:00:00Z", net_terms_days: 30 }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "POST /firm/invoices/${inv_id}/finalize"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /firm/invoices/${inv_id}"
              payload: {}
              as: BillingClerk
              captures: { c_at_due: $.data.collection_status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:01Z" }
              as: PlatformAdmin
            - call: "GET /firm/invoices/${inv_id}"
              payload: {}
              as: BillingClerk
              captures: { c_past_due: $.data.collection_status }
          assert:
            - "at clock == 2026-07-01T00:00:00Z: Invoice.${inv_id}.collection_status == DUE (inclusive boundary)"
            - "at clock == 2026-07-01T00:00:01Z: Invoice.${inv_id}.collection_status == OVERDUE (strictly past)"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: matter_open_requires_conflict_cleared
        grounds:
          - state_machines.Matter.CONFLICT_CLEARED_to_OPEN
          - validations[priority=8]
          - entities.ConflictCheck.fields.result
          - errors[ERR_CONFLICT_NOT_CLEARED]
        distinguishing_aspect: |
          Entity pair (Matter depends on ConflictCheck): a matter whose latest ConflictCheck.result ==
          FLAGGED (CONFLICT_BLOCKED) cannot be opened -> ERR_CONFLICT_NOT_CLEARED; Matter's valid
          transition depends on a different entity's (ConflictCheck) state.
        test_recipe:
          setup:
            - "Clients 'Acme Corp' and 'Rival Inc'; a matter for Acme with a FLAGGED conflict (CONFLICT_BLOCKED), not waived."
          setup_api_calls:
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Rival Inc", client_type: "ORGANIZATION" }
              as: BillingClerk
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/matters"
