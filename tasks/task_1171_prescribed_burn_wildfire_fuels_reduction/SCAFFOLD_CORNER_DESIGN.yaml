            - "ph2 == BRIEFED after cancel + reschedule re-pinned the current plan version"

      - name: clock_sweep_lapses_scheduled_execution
        claim_type: scheduled_actions
        grounds:
          - state_machines.BurnExecution.SCHEDULED_to_LAPSED
        distinguishing_aspect: "Setting the clock past scheduled_date (2026-05-12 -> 2026-05-13) flips the unbriefed execution to LAPSED; the plan (window to 2026-05-20) is untouched."
        test_recipe:
          setup: ["Plan APPROVED with execution SCHEDULED for 2026-05-12"]
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin }
