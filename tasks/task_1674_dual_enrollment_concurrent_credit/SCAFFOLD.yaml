scenario: 'Dual Enrollment & Concurrent Credit (community college dual credit office):

  course eligibility & prerequisite/placement verification, high school and

  college calendar mismatch handling, tuition responsibility

  (district/state/family) & billing, instructor credentialing for college

  credit, grade posting to both transcripts, drop/withdraw impact on GPA at

  both institutions, articulation & credit transferability, program capacity &

  seat allocation

  '
domain_name: dual-enrollment-concurrent-credit
api_prefix: /dual-credit
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: graph_constraint
  complexity_layers:
  - optimistic_concurrency
  - dual_variant_calculation
  - cascading_side_effects
  - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
  - many_to_many
  - self_referential
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
entities:
- name: HighSchool
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: High school name
  - name: district_code
    type: string
    source: input
    description: District identifier the school belongs to
  - name: status
    type: enum
    source: system
    default: ACTIVE
    description: ACTIVE | SUSPENDED; SUSPENDED blocks enrollment confirmation
    constraints: ACTIVE | SUSPENDED
- name: AcademicTerm
  parent: null
  common_fields: true
  fields:
  - name: institution_type
    type: enum
    source: input
    description: COLLEGE | HIGH_SCHOOL — which institution's calendar this term belongs to
    constraints: COLLEGE | HIGH_SCHOOL
  - name: high_school_id
    type: string
    source: input
    description: FK -> HighSchool.id; required iff institution_type == HIGH_SCHOOL, must be null for COLLEGE
  - name: name
    type: string
    source: input
    description: Term name, e.g. 'Fall 2026'
  - name: start_date
    type: datetime
    source: input
    description: Term start (ISO8601 UTC)
  - name: end_date
    type: datetime
    source: input
    description: Term end (ISO8601 UTC)
  - name: add_deadline
    type: datetime
    source: input
    description: Last instant a student may confirm enrollment under this calendar
  - name: drop_deadline
    type: datetime
    source: input
    description: Last instant for a no-record drop under this calendar
  - name: withdraw_deadline
    type: datetime
    source: input
    description: Last instant for a W-grade withdrawal under this calendar
  - name: status
    type: enum
    source: system
    default: SCHEDULED
    description: SCHEDULED | OPEN | CLOSED
    constraints: SCHEDULED | OPEN | CLOSED
  - name: date_ordering
    type: string
    source: system
    description: 'Invariant enforced at creation: start_date < add_deadline <= drop_deadline <= withdraw_deadline <= end_date
      (ERR_VALIDATION)'
- name: Student
  parent: null
  common_fields: true
  fields:
  - name: full_name
    type: string
    source: input
    description: Student full name
  - name: high_school_id
    type: string
    source: input
    description: FK -> HighSchool.id; the school the student attends
  - name: grade_level
    type: integer
    source: input
    description: HS grade level 9-12; dual-credit confirmation requires 11 or 12
    constraints: 9 <= grade_level <= 12
  - name: status
    type: enum
    source: system
    default: ELIGIBLE
    description: ELIGIBLE | SUSPENDED
    constraints: ELIGIBLE | SUSPENDED
  - name: college_gpa
    type: number
    source: computed
    default: 0.0
    description: Computed by gpa_recompute (college variant) over POSTED COLLEGE TranscriptEntries; 3 decimals round_half_up
  - name: hs_gpa
    type: number
    source: computed
    default: 0.0
    description: Computed by gpa_recompute (high-school variant) over POSTED HIGH_SCHOOL TranscriptEntries; 3 decimals round_half_up
- name: Course
  parent: null
  common_fields: true
  fields:
  - name: course_code
    type: string
    source: input
    description: College catalog code, e.g. 'MATH151'
  - name: title
    type: string
    source: input
    description: Course title
  - name: college_credit_hours
    type: integer
    source: input
    description: College credit hours granted
    constraints: '>= 1'
  - name: hs_credit_units
    type: number
    source: input
    description: High-school credit units recorded on the HS transcript
    constraints: '> 0'
  - name: placement_exam_code
    type: string
    source: input
    description: Placement exam subject code required, e.g. 'MATH'; ignored when min_placement_score == 0
  - name: min_placement_score
    type: integer
    source: input
    description: Minimum placement score; 0 means no placement required
    constraints: '>= 0'
  - name: status
    type: enum
    source: system
    default: ACTIVE
    description: ACTIVE | RETIRED; RETIRED courses cannot be used for new offerings
    constraints: ACTIVE | RETIRED
- name: Prerequisite
  parent: null
  common_fields: false
  fields:
  - name: course_id
    type: string
    source: input
    description: FK -> Course.id; the course that imposes the requirement
  - name: requires_course_id
    type: string
    source: input
    description: FK -> Course.id; the course that must already be satisfied
  - name: min_grade
    type: enum
    source: input
    default: C
    description: 'Minimum grade in requires_course: A | B | C (grade order A > B > C > D > F)'
    constraints: A | B | C
- name: PlacementRecord
  parent: null
  common_fields: false
  fields:
  - name: student_id
    type: string
    source: input
    description: FK -> Student.id
  - name: exam_code
    type: string
    source: input
    description: Placement exam subject code, e.g. 'MATH'
  - name: score
    type: integer
    source: input
    description: Exam score
    constraints: '>= 0'
  - name: taken_at
    type: datetime
    source: input
    description: When the exam was taken (ISO8601 UTC)
  - name: expires_at
    type: datetime
    source: computed
    description: taken_at + PLACEMENT_VALIDITY_DAYS (730) days; records at/past expiry are ignored by placement_recency
- name: Instructor
  parent: null
  common_fields: true
  fields:
  - name: full_name
    type: string
    source: input
    description: Instructor full name
  - name: high_school_id
    type: string
    source: input
    description: FK -> HighSchool.id; the school employing the instructor
- name: CredentialApplication
  parent: null
  common_fields: true
  fields:
  - name: instructor_id
    type: string
    source: input
    description: FK -> Instructor.id; applicant. The acting Instructor's X-User-ID must equal this value
  - name: course_id
    type: string
    source: input
    description: FK -> Course.id; course the instructor seeks credentialing for
  - name: qualification_summary
    type: string
    source: input
    description: Free-text summary of graduate credits / credentials
  - name: status
    type: enum
    source: system
    default: SUBMITTED
    description: SUBMITTED | UNDER_REVIEW | NEEDS_REVISION | APPROVED | DENIED
    constraints: SUBMITTED | UNDER_REVIEW | NEEDS_REVISION | APPROVED | DENIED
  - name: reviewed_by
    type: string
    source: system
    description: X-User-ID of the CredentialReviewer holding the review; set by begin-review, cleared by resubmit
  - name: decision_reason
    type: string
    source: input
    description: Optional rationale recorded on approve / deny / request-revision
- name: CourseOffering
  parent: null
  common_fields: true
  fields:
  - name: course_id
    type: string
    source: input
    description: FK -> Course.id
  - name: college_term_id
    type: string
    source: input
    description: FK -> AcademicTerm.id; referenced term must have institution_type == COLLEGE
  - name: hs_term_id
    type: string
    source: input
    description: FK -> AcademicTerm.id; referenced term must have institution_type == HIGH_SCHOOL and high_school_id equal
      to this offering's high_school_id
  - name: high_school_id
    type: string
    source: input
    description: FK -> HighSchool.id; site where the dual-credit section runs
  - name: instructor_id
    type: string
    source: input
    description: FK -> Instructor.id; must hold an APPROVED CredentialApplication for course_id before the offering may open
  - name: capacity
    type: integer
    source: input
    description: Maximum REGISTERED enrollments
    constraints: '>= 1'
  - name: delivery_mode
    type: enum
    source: input
    default: HS_CAMPUS
    description: HS_CAMPUS | COLLEGE_CAMPUS | ONLINE; STATE_PROGRAM funding covers only HS_CAMPUS
    constraints: HS_CAMPUS | COLLEGE_CAMPUS | ONLINE
  - name: seats_taken
    type: integer
    source: computed
    default: 0
    description: 'Computed by seat_availability: count of Enrollments with status REGISTERED for this offering'
  - name: seats_available
    type: integer
    source: computed
    description: capacity - seats_taken
  - name: status
    type: enum
    source: system
    default: DRAFT
    description: DRAFT | OPEN | IN_SESSION | GRADING | FINALIZED | CANCELLED
    constraints: DRAFT | OPEN | IN_SESSION | GRADING | FINALIZED | CANCELLED
- name: Enrollment
  parent: null
  common_fields: true
  fields:
  - name: student_id
    type: string
    source: input
    description: FK -> Student.id
  - name: offering_id
    type: string
    source: input
    description: FK -> CourseOffering.id
  - name: status
    type: enum
    source: system
    default: PENDING_VERIFICATION
    description: PENDING_VERIFICATION | REGISTERED | WAITLISTED | DROPPED | WITHDRAWN | COMPLETED | CANCELLED | EXPIRED
    constraints: see Enrollment state machine
  - name: grade
    type: enum
    source: system
    description: null until set; A|B|C|D|F via submit-grade, W via withdraw; cleared to null by reinstate
    constraints: A | B | C | D | F | W | null
  - name: waitlist_seq
    type: integer
    source: system
    description: Per-offering monotonic sequence assigned on entering WAITLISTED (max existing seq for the offering + 1);
      never reused; null unless the enrollment has been waitlisted
  - name: withdrawn_at
    type: datetime
    source: system
    description: Logical-clock timestamp of the WITHDRAWN transition; null otherwise; drives the HS transcript W-posting rule
- name: TranscriptEntry
  parent: null
  common_fields: true
  fields:
  - name: enrollment_id
    type: string
    source: system
    description: FK -> Enrollment.id
  - name: institution
    type: enum
    source: system
    description: COLLEGE | HIGH_SCHOOL — which transcript this entry belongs to
    constraints: COLLEGE | HIGH_SCHOOL
  - name: grade
    type: enum
    source: system
    description: A | B | C | D | F | W copied from the enrollment per the finalize posting rules
    constraints: A | B | C | D | F | W
  - name: credit_value
    type: number
    source: system
    description: Snapshot of Course.college_credit_hours (COLLEGE entry) or Course.hs_credit_units (HIGH_SCHOOL entry)
  - name: grade_points
    type: number
    source: computed
    description: quality_points(institution, grade) x credit_value per gpa_recompute scales
  - name: status
    type: enum
    source: system
    default: PENDING
    description: PENDING | POSTED | VOIDED
    constraints: PENDING | POSTED | VOIDED
- name: FundingAgreement
  parent: null
  common_fields: true
  fields:
  - name: high_school_id
    type: string
    source: input
    description: FK -> HighSchool.id
  - name: college_term_id
    type: string
    source: input
    description: FK -> AcademicTerm.id; term the agreement governs
  - name: funding_model
    type: enum
    source: input
    description: STATE_PROGRAM | DISTRICT_CONTRACT | FAMILY_RESPONSIBLE
    constraints: STATE_PROGRAM | DISTRICT_CONTRACT | FAMILY_RESPONSIBLE
  - name: tuition_cents_per_credit
    type: integer
    source: input
    description: Gross tuition rate per college credit hour
    constraints: '>= 1'
  - name: state_rate_cents_per_credit
    type: integer
    source: input
    default: 0
    description: State subsidy per credit (STATE_PROGRAM only)
    constraints: '>= 0'
  - name: district_cap_cents
    type: integer
    source: input
    default: 0
    description: Maximum district contribution per enrollment
    constraints: '>= 0'
  - name: uniqueness
    type: string
    source: system
    description: At most one FundingAgreement per (high_school_id, college_term_id) — ERR_DUPLICATE_FUNDING_AGREEMENT
- name: Invoice
  parent: null
  common_fields: true
  fields:
  - name: enrollment_id
    type: string
    source: system
    description: FK -> Enrollment.id
  - name: funding_agreement_id
    type: string
    source: system
    description: FK -> FundingAgreement.id used for the allocation
  - name: tuition_total_cents
    type: integer
    source: computed
    description: college_credit_hours x tuition_cents_per_credit (see tuition_allocation)
  - name: state_amount_cents
    type: integer
    source: computed
    description: 'Payer share: state (waterfall bucket 1)'
  - name: district_amount_cents
    type: integer
    source: computed
    description: 'Payer share: district (waterfall bucket 2)'
  - name: family_amount_cents
    type: integer
    source: computed
    description: 'Payer share: family (waterfall remainder)'
  - name: paid_state_cents
    type: integer
    source: computed
    default: 0
    description: Sum of Payments with payer == STATE for this invoice
  - name: paid_district_cents
    type: integer
    source: computed
    default: 0
    description: Sum of Payments with payer == DISTRICT
  - name: paid_family_cents
    type: integer
    source: computed
    default: 0
    description: Sum of Payments with payer == FAMILY
  - name: refund_pct
    type: integer
    source: system
    description: null until drop/withdraw; 100 on drop; 50 on withdraw at/before college drop_deadline; 0 otherwise
    constraints: null | 0 | 50 | 100
  - name: refund_estimate_cents
    type: integer
    source: computed
    description: 'Provisional variant of refund_settlement: round_half_up(tuition_total_cents x refund_pct / 100); null until
      pct set'
  - name: est_state_refund_cents
    type: integer
    source: computed
    description: round_half_up(state_amount_cents x pct / 100); pinned rounding step 1
  - name: est_district_refund_cents
    type: integer
    source: computed
    description: round_half_up(district_amount_cents x pct / 100); pinned rounding step 2
  - name: est_family_refund_cents
    type: integer
    source: computed
    description: refund_estimate_cents - est_state_refund_cents - est_district_refund_cents; pinned remainder to family
  - name: refund_paid_cents
    type: integer
    source: computed
    description: Settled variant computed at refund processing from PAID amounts; null until refund_status == PROCESSED
  - name: status
    type: enum
    source: system
    default: ISSUED
    description: ISSUED | PARTIALLY_PAID | PAID | VOIDED
    constraints: ISSUED | PARTIALLY_PAID | PAID | VOIDED
  - name: refund_status
    type: enum
    source: system
    default: NONE
    description: NONE | DUE | PROCESSED — independent axis from status
    constraints: NONE | DUE | PROCESSED
- name: Payment
  parent: null
  common_fields: false
  fields:
  - name: invoice_id
    type: string
    source: system
    description: FK -> Invoice.id; taken from the path
  - name: payer
    type: enum
    source: input
    description: STATE | DISTRICT | FAMILY
    constraints: STATE | DISTRICT | FAMILY
  - name: amount_cents
    type: integer
    source: input
    description: Payment amount
    constraints: '> 0'
  - name: note
    type: string
    source: input
    description: Optional remittance note
- name: ArticulationAgreement
  parent: null
  common_fields: true
  fields:
  - name: course_id
    type: string
    source: input
    description: FK -> Course.id
  - name: target_institution
    type: string
    source: input
    description: Receiving institution name, e.g. 'StateU'
  - name: transfer_credit_hours
    type: number
    source: input
    description: Credit hours the target institution grants; may differ from college_credit_hours
    constraints: '> 0'
  - name: min_grade_for_transfer
    type: enum
    source: input
    default: C
    description: 'Minimum grade for transfer recognition: A | B | C'
    constraints: A | B | C
  - name: effective_from
    type: datetime
    source: input
    description: Agreement active from (inclusive)
  - name: effective_to
    type: datetime
    source: input
    description: Agreement active through (inclusive); CLOSED-interval overlap on (course_id, target_institution) is rejected
state_machines:
- entity: HighSchool
  initial_state: ACTIVE
  terminal_states:
  - SUSPENDED
  transitions:
  - from: ACTIVE
    to: SUSPENDED
    trigger: POST /dual-credit/high-schools/{schoolId}/suspend
    actor: DualCreditAdmin
    preconditions:
    - HighSchool.status == ACTIVE (else ERR_INVALID_STATE)
    side_effects:
    - Existing enrollments are NOT modified; suspension only blocks future enrollment confirmations (ERR_SCHOOL_SUSPENDED)
    - increments HighSchool.version by 1
- entity: AcademicTerm
  initial_state: SCHEDULED
  terminal_states:
  - CLOSED
  transitions:
  - from: SCHEDULED
    to: OPEN
    trigger: POST /dual-credit/terms/{termId}/open-registration
    actor: DualCreditAdmin
    preconditions:
    - AcademicTerm.status == SCHEDULED (else ERR_TERM_INVALID_STATE)
    side_effects:
    - increments AcademicTerm.version by 1
  - from: OPEN
    to: CLOSED
    trigger: POST /dual-credit/terms/{termId}/close-registration
    actor: DualCreditAdmin
    preconditions:
    - AcademicTerm.status == OPEN (else ERR_TERM_INVALID_STATE)
    side_effects:
    - Every Enrollment with status == WAITLISTED whose offering has college_term_id == this term OR hs_term_id == this term
      transitions to EXPIRED (waitlist_seq is retained, never reused)
    - PENDING_VERIFICATION enrollments are NOT cancelled; they remain but any later confirm fails the terms-OPEN check (ERR_TERM_NOT_OPEN)
    - increments AcademicTerm.version by 1
- entity: Student
  initial_state: ELIGIBLE
  terminal_states:
  - SUSPENDED
  transitions:
  - from: ELIGIBLE
    to: SUSPENDED
    trigger: POST /dual-credit/students/{studentId}/suspend
    actor: DualCreditAdmin
    preconditions:
    - Student.status == ELIGIBLE (else ERR_INVALID_STATE)
    side_effects:
    - Existing enrollments are NOT modified; suspension blocks future enrollment confirmations (ERR_STUDENT_NOT_ELIGIBLE)
    - increments Student.version by 1
- entity: Course
  initial_state: ACTIVE
  terminal_states:
  - RETIRED
  transitions:
  - from: ACTIVE
    to: RETIRED
    trigger: POST /dual-credit/courses/{courseId}/retire
    actor: DualCreditAdmin
    preconditions:
    - Course.status == ACTIVE (else ERR_INVALID_STATE)
    side_effects:
    - increments Course.version by 1
- entity: CredentialApplication
  initial_state: SUBMITTED
  terminal_states:
  - APPROVED
  - DENIED
  transitions:
  - from: SUBMITTED
    to: UNDER_REVIEW
    trigger: POST /dual-credit/credential-applications/{appId}/begin-review
    actor: CredentialReviewer
    preconditions:
    - CredentialApplication.status == SUBMITTED (else ERR_CREDENTIAL_APPLICATION_INVALID_STATE)
    side_effects:
    - reviewed_by := acting CredentialReviewer's X-User-ID
    - increments CredentialApplication.version by 1
  - from: UNDER_REVIEW
    to: APPROVED
    trigger: POST /dual-credit/credential-applications/{appId}/approve
    actor: CredentialReviewer
    preconditions:
    - CredentialApplication.status == UNDER_REVIEW (else ERR_CREDENTIAL_APPLICATION_INVALID_STATE)
    - Acting reviewer X-User-ID == reviewed_by (else ERR_NOT_RESOURCE_OWNER)
    - Acting reviewer X-User-ID != instructor_id (segregation of duties; else ERR_CREDENTIAL_SELF_APPROVAL)
    side_effects:
    - decision_reason recorded when supplied
    - increments CredentialApplication.version by 1
  - from: UNDER_REVIEW
    to: DENIED
    trigger: POST /dual-credit/credential-applications/{appId}/deny
    actor: CredentialReviewer
    preconditions:
    - CredentialApplication.status == UNDER_REVIEW (else ERR_CREDENTIAL_APPLICATION_INVALID_STATE)
    - Acting reviewer X-User-ID == reviewed_by (else ERR_NOT_RESOURCE_OWNER)
    - Acting reviewer X-User-ID != instructor_id (else ERR_CREDENTIAL_SELF_APPROVAL)
    side_effects:
    - increments CredentialApplication.version by 1
  - from: UNDER_REVIEW
    to: NEEDS_REVISION
    trigger: POST /dual-credit/credential-applications/{appId}/request-revision
    actor: CredentialReviewer
    preconditions:
    - CredentialApplication.status == UNDER_REVIEW (else ERR_CREDENTIAL_APPLICATION_INVALID_STATE)
    - Acting reviewer X-User-ID == reviewed_by (else ERR_NOT_RESOURCE_OWNER)
    - Acting reviewer X-User-ID != instructor_id (else ERR_CREDENTIAL_SELF_APPROVAL)
    side_effects:
    - decision_reason recorded when supplied
    - increments CredentialApplication.version by 1
  - from: NEEDS_REVISION
    to: SUBMITTED
    trigger: POST /dual-credit/credential-applications/{appId}/resubmit
    actor: Instructor
    preconditions:
    - CredentialApplication.status == NEEDS_REVISION (else ERR_CREDENTIAL_APPLICATION_INVALID_STATE)
    - Acting Instructor X-User-ID == instructor_id (else ERR_NOT_RESOURCE_OWNER)
    side_effects:
    - reviewed_by := null (review ownership released)
    - increments CredentialApplication.version by 1
- entity: CourseOffering
  initial_state: DRAFT
  terminal_states:
  - FINALIZED
  - CANCELLED
  transitions:
  - from: DRAFT
    to: OPEN
    trigger: POST /dual-credit/offerings/{offeringId}/open
    actor: DualCreditAdmin
    preconditions:
    - CourseOffering.status == DRAFT (else ERR_OFFERING_INVALID_STATE)
    - college_term.status == OPEN and hs_term.status == OPEN (else ERR_TERM_NOT_OPEN)
    - Course.status == ACTIVE (else ERR_INVALID_STATE)
    - An APPROVED CredentialApplication exists with instructor_id == offering.instructor_id and course_id == offering.course_id
      (else ERR_INSTRUCTOR_NOT_CREDENTIALED)
    side_effects:
    - increments CourseOffering.version by 1
  - from: OPEN
    to: IN_SESSION
    trigger: POST /dual-credit/offerings/{offeringId}/start-session
    actor: DualCreditAdmin
    preconditions:
    - CourseOffering.status == OPEN (else ERR_OFFERING_INVALID_STATE)
    side_effects:
    - increments CourseOffering.version by 1
  - from: IN_SESSION
    to: GRADING
    trigger: POST /dual-credit/offerings/{offeringId}/begin-grading
    actor: DualCreditAdmin
    preconditions:
    - CourseOffering.status == IN_SESSION (else ERR_OFFERING_INVALID_STATE)
    - logical clock now >= college_term.end_date (else ERR_TERM_NOT_ENDED)
    side_effects:
    - increments CourseOffering.version by 1
  - from: GRADING
    to: FINALIZED
    trigger: POST /dual-credit/offerings/{offeringId}/finalize
    actor: CollegeRegistrar
    preconditions:
    - CourseOffering.status == GRADING (else ERR_OFFERING_INVALID_STATE)
    - Every Enrollment with status == REGISTERED for this offering has grade != null (else ERR_GRADES_MISSING)
    side_effects:
    - Every REGISTERED Enrollment -> COMPLETED
    - 'TranscriptEntry creation per finalize posting rules: COMPLETED enrollment -> one COLLEGE entry (credit_value = college_credit_hours)
      + one HIGH_SCHOOL entry (credit_value = hs_credit_units), both PENDING, grade copied'
    - WITHDRAWN enrollment -> COLLEGE PENDING entry with grade W always; HIGH_SCHOOL PENDING entry with grade W only when
      withdrawn_at > hs_term.drop_deadline
    - DROPPED / CANCELLED / EXPIRED enrollments produce no entries
    - increments CourseOffering.version by 1
  - from: DRAFT
    to: CANCELLED
    trigger: POST /dual-credit/offerings/{offeringId}/cancel
    actor: DualCreditAdmin
    preconditions:
    - CourseOffering.status == DRAFT (else ERR_OFFERING_INVALID_STATE)
    side_effects:
    - 'Conditional cascade: only non-terminal enrollments affected — PENDING_VERIFICATION -> CANCELLED; WAITLISTED -> CANCELLED;
      REGISTERED -> DROPPED'
    - Each enrollment DROPPED by this cascade voids its Invoice (status -> VOIDED) and sets refund_pct = 100 with estimate
      fields per refund_settlement; refund_status := DUE iff sum of payments > 0 else NONE
    - increments CourseOffering.version by 1
  - from: OPEN
    to: CANCELLED
    trigger: POST /dual-credit/offerings/{offeringId}/cancel
    actor: DualCreditAdmin
    preconditions:
    - CourseOffering.status == OPEN (else ERR_OFFERING_INVALID_STATE)
    side_effects:
    - Same conditional cascade as DRAFT -> CANCELLED
    - increments CourseOffering.version by 1
- entity: Enrollment
  initial_state: PENDING_VERIFICATION
  terminal_states:
  - DROPPED
  - COMPLETED
  - CANCELLED
  - EXPIRED
  transitions:
  - from: PENDING_VERIFICATION
    to: REGISTERED
    trigger: POST /dual-credit/enrollments/{enrollmentId}/confirm
    actor: HsCoordinator
    preconditions:
    - Enrollment.status == PENDING_VERIFICATION (else ERR_ENROLLMENT_INVALID_STATE)
    - 'OCC: expected_offering_version == offering.version (else ERR_STALE_VERSION, 412)'
    - Offering.status == OPEN (else ERR_OFFERING_INVALID_STATE)
    - Student.status == ELIGIBLE and Student.grade_level >= 11 (else ERR_STUDENT_NOT_ELIGIBLE)
    - Student's HighSchool.status == ACTIVE (else ERR_SCHOOL_SUSPENDED)
    - Logical clock now <= min(college_term.add_deadline, hs_term.add_deadline) (else ERR_ADD_WINDOW_CLOSED)
    - college_term.status == OPEN and hs_term.status == OPEN (else ERR_TERM_NOT_OPEN)
    - All Prerequisite rows of offering.course_id satisfied per prerequisite_satisfaction (else ERR_PREREQUISITE_NOT_MET)
    - Placement per placement_recency when course.min_placement_score > 0 (else ERR_PLACEMENT_MISSING / ERR_PLACEMENT_SCORE_INSUFFICIENT)
    - FundingAgreement exists for (offering.high_school_id, offering.college_term_id) (else ERR_NO_FUNDING_AGREEMENT)
    - 'seat_availability: seats_available >= 1 (otherwise the same request lands in WAITLISTED instead of failing)'
    side_effects:
    - seats_taken += 1; increments CourseOffering.version by 1
    - Invoice created via tuition_allocation (status ISSUED, refund_status NONE)
    - increments Enrollment.version by 1
  - from: PENDING_VERIFICATION
    to: WAITLISTED
    trigger: POST /dual-credit/enrollments/{enrollmentId}/confirm (same validation chain as REGISTERED; taken when seats_available
      == 0)
    actor: HsCoordinator
    preconditions:
    - All confirm preconditions above except the seat check
    side_effects:
    - waitlist_seq := max existing waitlist_seq for the offering + 1 (starts at 1)
    - No invoice is created for a WAITLISTED enrollment
    - increments Enrollment.version by 1
  - from: REGISTERED
    to: DROPPED
    trigger: POST /dual-credit/enrollments/{enrollmentId}/drop
    actor: HsCoordinator
    preconditions:
    - Enrollment.status == REGISTERED (else ERR_ENROLLMENT_INVALID_STATE)
    - Logical clock now <= min(college_term.drop_deadline, hs_term.drop_deadline) (else ERR_DROP_WINDOW_CLOSED)
    side_effects:
    - seats_taken -= 1; increments CourseOffering.version by 1
    - 'refund_settlement on the enrollment''s Invoice: refund_pct := 100; estimate fields computed; status -> VOIDED; refund_status
      := DUE iff sum of payments > 0 else NONE'
    - 'Waitlist promotion per waitlist_promotion: iff offering.status == OPEN and a WAITLISTED enrollment exists, the lowest
      waitlist_seq WAITLISTED enrollment -> REGISTERED and a new Invoice is created for it via tuition_allocation (this promotion
      itself bumps CourseOffering.version again)'
    - Dropped enrollments never produce TranscriptEntries
    - increments Enrollment.version by 1
  - from: REGISTERED
    to: WITHDRAWN
    trigger: POST /dual-credit/enrollments/{enrollmentId}/withdraw
    actor: HsCoordinator
    preconditions:
    - Enrollment.status == REGISTERED (else ERR_ENROLLMENT_INVALID_STATE)
    - Logical clock now > min(college_term.drop_deadline, hs_term.drop_deadline) (else ERR_ENROLLMENT_INVALID_STATE — the
      drop window is still open; drop must be used)
    - Logical clock now <= min(college_term.withdraw_deadline, hs_term.withdraw_deadline) (else ERR_WITHDRAW_WINDOW_CLOSED)
    side_effects:
    - grade := W; withdrawn_at := now
    - seats_taken -= 1; increments CourseOffering.version by 1
    - 'refund_settlement: refund_pct := 50 iff now <= college_term.drop_deadline else 0 (cross-calendar mismatch compensation:
      a withdraw forced only because the HS drop deadline passed still earns 50 pct); estimate fields set when pct > 0; refund_status
      := DUE iff pct > 0 and sum of payments > 0 else NONE; invoice status unchanged for pct == 50'
    - Same waitlist promotion rule as drop
    - increments Enrollment.version by 1
  - from: WITHDRAWN
    to: REGISTERED
    trigger: POST /dual-credit/enrollments/{enrollmentId}/reinstate
    actor: CollegeRegistrar
    preconditions:
    - Enrollment.status == WITHDRAWN (else ERR_ENROLLMENT_INVALID_STATE)
    - 'OCC: expected_offering_version == offering.version (else ERR_STALE_VERSION, 412)'
    - Offering.status in {OPEN, IN_SESSION} (else ERR_OFFERING_INVALID_STATE)
    - Logical clock now <= college_term.end_date (else ERR_WITHDRAW_WINDOW_CLOSED)
    - seats_available >= 1 (else ERR_NO_SEATS_AVAILABLE)
    side_effects:
    - grade := null; withdrawn_at := null
    - seats_taken += 1; increments CourseOffering.version by 1
    - A NEW Invoice is created via tuition_allocation (the previous invoice keeps its own state and refund fields)
    - increments Enrollment.version by 1
  - from: WAITLISTED
    to: REGISTERED
    trigger: system (waitlist promotion fired by a drop or withdraw side effect)
    actor: system
    preconditions:
    - offering.status == OPEN
    - seats_available >= 1
    - This enrollment holds the minimum waitlist_seq among WAITLISTED enrollments of the offering
    side_effects:
    - seats_taken += 1; increments CourseOffering.version by 1
    - Invoice created via tuition_allocation
    - increments Enrollment.version by 1
  - from: WAITLISTED
    to: CANCELLED
    trigger: POST /dual-credit/enrollments/{enrollmentId}/cancel-waitlist
    actor: HsCoordinator
    preconditions:
    - Enrollment.status == WAITLISTED (else ERR_ENROLLMENT_INVALID_STATE)
    side_effects:
    - increments Enrollment.version by 1
  - from: WAITLISTED
    to: EXPIRED
    trigger: system (close-registration on the offering's college_term or hs_term)
    actor: system
    preconditions: []
    side_effects:
    - increments Enrollment.version by 1
  - from: REGISTERED
    to: COMPLETED
    trigger: system (offering finalize, after a grade was recorded via submit-grade)
    actor: system
    preconditions:
    - grade != null
    side_effects:
    - TranscriptEntries created per finalize posting rules
    - increments Enrollment.version by 1
  - from: PENDING_VERIFICATION
    to: CANCELLED
    trigger: system (offering cancel cascade)
    actor: system
    preconditions: []
    side_effects:
    - increments Enrollment.version by 1
  - from: WAITLISTED
    to: CANCELLED
    trigger: system (offering cancel cascade)
    actor: system
    preconditions: []
    side_effects:
    - increments Enrollment.version by 1
  - from: REGISTERED
    to: DROPPED
    trigger: system (offering cancel cascade — administrative drop)
    actor: system
    preconditions: []
    side_effects:
    - Invoice voided with refund_pct := 100 per refund_settlement (refund_status := DUE iff sum of payments > 0 else NONE)
    - increments Enrollment.version by 1
- entity: Invoice
  initial_state: ISSUED
  terminal_states:
  - PAID
  - VOIDED
  transitions:
  - from: ISSUED
    to: PARTIALLY_PAID
    trigger: POST /dual-credit/invoices/{invoiceId}/payments (cumulative paid > 0 and < tuition_total_cents)
    actor: Bursar
    preconditions:
    - Invoice.status in {ISSUED, PARTIALLY_PAID} (else ERR_INVOICE_INVALID_STATE)
    - 'For the payment''s payer: paid_<payer>_cents + amount_cents <= <payer>_amount_cents (else ERR_OVERPAYMENT)'
    side_effects:
    - paid_<payer>_cents += amount_cents
    - increments Invoice.version by 1
  - from: PARTIALLY_PAID
    to: PAID
    trigger: POST /dual-credit/invoices/{invoiceId}/payments (cumulative paid == tuition_total_cents)
    actor: Bursar
    preconditions:
    - Same as ISSUED -> PARTIALLY_PAID
    side_effects:
    - paid_<payer>_cents += amount_cents
    - increments Invoice.version by 1
  - from: ISSUED
    to: VOIDED
    trigger: system (drop, withdraw-free drop, or offering-cancel cascade with refund_pct == 100)
    actor: system
    preconditions: []
    side_effects:
    - refund_status := DUE iff sum of payments > 0 else NONE
    - increments Invoice.version by 1
  - from: PARTIALLY_PAID
    to: VOIDED
    trigger: system (same as above)
    actor: system
    preconditions: []
    side_effects:
    - refund_status := DUE (payments exist)
    - increments Invoice.version by 1
  - from: PAID
    to: VOIDED
    trigger: system (same as above)
    actor: system
    preconditions: []
    side_effects:
    - refund_status := DUE
    - increments Invoice.version by 1
  note: 'refund_status (NONE | DUE | PROCESSED) is an independent axis: POST .../refund moves DUE -> PROCESSED and sets refund_paid_cents
    per refund_settlement''s settled variant; a second refund call fails ERR_REFUND_NOT_DUE.'
- entity: TranscriptEntry
  initial_state: PENDING
  terminal_states:
  - POSTED
  - VOIDED
  transitions:
  - from: PENDING
    to: POSTED
    trigger: POST /dual-credit/transcript-entries/{entryId}/post
    actor: CollegeRegistrar
    preconditions:
    - TranscriptEntry.status == PENDING (else ERR_TRANSCRIPT_ENTRY_INVALID_STATE)
    side_effects:
    - 'gpa_recompute runs for the entry''s student: college_gpa when institution == COLLEGE, hs_gpa when institution == HIGH_SCHOOL'
    - increments TranscriptEntry.version by 1; the owning Student.updated_at refreshes
  - from: POSTED
    to: VOIDED
    trigger: POST /dual-credit/transcript-entries/{entryId}/void
    actor: CollegeRegistrar
    preconditions:
    - TranscriptEntry.status == POSTED (else ERR_TRANSCRIPT_ENTRY_INVALID_STATE)
    side_effects:
    - gpa_recompute runs again for the student; the VOIDED entry is excluded from both numerator and denominator
    - increments TranscriptEntry.version by 1
concurrency_rules:
- rule_id: confirm-offering-stale-version
  parent_entity: CourseOffering
  write_endpoint: POST /dual-credit/enrollments/{enrollmentId}/confirm
  occ_field: expected_offering_version
  description: 'Confirming an Enrollment against a CourseOffering whose version has

    advanced since the client last observed it is rejected. This captures

    the case where another seat-allocating write (another confirm, a drop,

    a withdraw, a reinstate, or a waitlist promotion) has legitimately

    changed the seat counters and the current writer''s view of the

    offering is therefore stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: reinstate-offering-stale-version
  parent_entity: CourseOffering
  write_endpoint: POST /dual-credit/enrollments/{enrollmentId}/reinstate
  occ_field: expected_offering_version
  description: 'Reinstating a WITHDRAWN Enrollment against a CourseOffering whose

    version has advanced since the client last observed it is rejected.

    The seat the client believes is free may have been legitimately taken

    by an intervening write, so the stale request fails with 412.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: seat_availability
  trigger: Enrollment confirm / drop / withdraw / reinstate / waitlist promotion / offering cancel
  algorithm: aggregation
  formula: 'seats_taken = count of Enrollments with offering_id == offering.id AND status == REGISTERED

    seats_available = capacity - seats_taken

    Invariant: seats_taken + seats_available == capacity at all times.

    '
  input_set: Enrollments of the offering; only status == REGISTERED counts (PENDING_VERIFICATION, WAITLISTED, DROPPED, WITHDRAWN,
    COMPLETED, CANCELLED, EXPIRED never consume a seat)
  constants:
    MIN_SEATS_TO_REGISTER: 1
  precision: integer arithmetic, exact
- name: waitlist_promotion
  trigger: A REGISTERED Enrollment transitions to DROPPED or WITHDRAWN (seat release)
  algorithm: constraint_propagation
  formula: "Fire only when offering.status == OPEN (a seat released while IN_SESSION or later stays free).\ncandidate_set\
    \ = Enrollments with offering_id == offering.id AND status == WAITLISTED\nif candidate_set non-empty and seats_available\
    \ >= 1:\n  promote the enrollment with the minimum waitlist_seq (per-offering monotonic, never reused)\n  promoted enrollment\
    \ -> REGISTERED; a new Invoice is created for it via tuition_allocation\nEmpty candidate set: no-op (no error).\n"
  input_set: WAITLISTED Enrollments of the offering only
  constants: {}
  precision: integer sequence ordering; waitlist_seq ties are impossible by construction (max+1 assignment)
- name: effective_deadline
  trigger: Enrollment confirm (add), drop, withdraw
  algorithm: threshold
  formula: 'effective_add_deadline      = min(college_term.add_deadline,      hs_term.add_deadline)

    effective_drop_deadline     = min(college_term.drop_deadline,     hs_term.drop_deadline)

    effective_withdraw_deadline = min(college_term.withdraw_deadline, hs_term.withdraw_deadline)

    Boundaries are INCLUSIVE: now <= deadline passes; now == deadline passes.

    The stricter (earlier) of the two calendars governs the enrollment action.

    '
  input_set: The offering's college_term and hs_term
  constants: {}
  precision: ISO8601 UTC instants, second granularity
- name: refund_percentage
  trigger: Enrollment drop / withdraw
  algorithm: threshold
  formula: "if action == DROP:                       refund_pct = 100\nif action == WITHDRAW:\n    if now <= college_term.drop_deadline:\
    \ refund_pct = 50   # mismatch window: only reachable when hs drop_deadline < college drop_deadline\n    else:       \
    \                          refund_pct = 0\nNote the college calendar alone governs the 50 pct compensation even though\
    \ the HS calendar forced the withdraw.\n"
  input_set: The transitioning enrollment plus the offering's two terms
  constants:
    DROP_REFUND_PCT: 100
    MISMATCH_REFUND_PCT: 50
    PLAIN_WITHDRAW_REFUND_PCT: 0
  precision: integer percent
- name: tuition_allocation
  trigger: An Enrollment reaches REGISTERED (confirm, waitlist promotion, reinstate) — creates the Invoice
  algorithm: waterfall_allocation
  formula: "tuition_total_cents = course.college_credit_hours x agreement.tuition_cents_per_credit\n# Bucket 1 — state:\n\
    if agreement.funding_model == STATE_PROGRAM and offering.delivery_mode == HS_CAMPUS:\n    state_amount_cents = min(tuition_total_cents,\
    \ agreement.state_rate_cents_per_credit x course.college_credit_hours)\nelse:\n    state_amount_cents = 0\nremainder_1\
    \ = tuition_total_cents - state_amount_cents\n# Bucket 2 — district (skipped entirely for FAMILY_RESPONSIBLE):\nif agreement.funding_model\
    \ == FAMILY_RESPONSIBLE:\n    district_amount_cents = 0\nelse:\n    district_amount_cents = min(remainder_1, agreement.district_cap_cents)\n\
    # Bucket 3 — family (remainder):\nfamily_amount_cents = remainder_1 - district_amount_cents\nInvariant: state_amount_cents\
    \ + district_amount_cents + family_amount_cents == tuition_total_cents.\n"
  input_set: The enrolling offering's course, the FundingAgreement for (offering.high_school_id, offering.college_term_id)
  constants: {}
  precision: integer cents, exact
- name: refund_settlement
  trigger: 'Estimate variant: on drop/withdraw (stored on the Invoice). Settled variant: on POST /invoices/{invoiceId}/refund.'
  algorithm: waterfall_allocation
  formula: "Pinned rounding order (mode: per-payer rounding then family remainder):\nEstimate (billed-based, at drop/withdraw):\n\
    \  refund_estimate_cents   = round_half_up(tuition_total_cents x refund_pct / 100)\n  est_state_refund_cents    = round_half_up(state_amount_cents\
    \    x refund_pct / 100)\n  est_district_refund_cents = round_half_up(district_amount_cents x refund_pct / 100)\n  est_family_refund_cents\
    \   = refund_estimate_cents - est_state_refund_cents - est_district_refund_cents\nSettled (paid-based, at refund processing):\n\
    \  paid_total = paid_state_cents + paid_district_cents + paid_family_cents\n  refund_paid_cents = round_half_up(paid_state_cents\
    \ x pct/100) + round_half_up(paid_district_cents x pct/100)\n                    + ( round_half_up(paid_total x pct/100)\
    \ - round_half_up(paid_state_cents x pct/100) - round_half_up(paid_district_cents x pct/100) )\n  i.e. state and district\
    \ refunded by per-payer rounding of PAID amounts; family receives the remainder of round_half_up(paid_total x pct/100).\n\
    When fully paid, settled == estimate. When partially paid, settled <= estimate and the two diverge.\n"
  input_set: The Invoice (billed shares for estimate; paid_* fields for settled)
  constants: {}
  precision: integer cents; round_half_up at exactly the pinned steps
  variants:
  - name: estimate_billed
    when: At drop/withdraw — provisional, based on billed payer shares
    difference: Uses *_amount_cents (billed); overstates the refund when payers have underpaid
  - name: settled_paid
    when: At POST /invoices/{id}/refund — final, based on amounts actually paid
    difference: Uses paid_*_cents; identical to estimate only when fully paid
- name: gpa_recompute
  trigger: TranscriptEntry transitions PENDING -> POSTED and POSTED -> VOIDED
  algorithm: weighted_scoring
  formula: "College variant (writes Student.college_gpa):\n  quality points: A=4, B=3, C=2, D=1, F=0; W is EXCLUDED from numerator\
    \ and denominator\n  college_gpa = sum(grade_points of POSTED COLLEGE entries with grade in {A,B,C,D,F}) / sum(credit_value\
    \ of those entries)\nHigh-school variant (writes Student.hs_gpa):\n  dual-credit weighted scale: A=5, B=4, C=3, D=2, F=0,\
    \ W=0; W is INCLUDED with 0 points and its credit_value counts in the denominator\n  hs_gpa = sum(grade_points of POSTED\
    \ HIGH_SCHOOL entries with grade in {A,B,C,D,F,W}) / sum(credit_value of those entries)\nEmpty eligible set -> 0.000.\n\
    grade_points on the entry = quality_points(institution, grade) x credit_value.\n"
  input_set: All TranscriptEntries whose enrollment belongs to the student; ONLY status == POSTED rows are included (PENDING
    and VOIDED excluded)
  constants:
    COLLEGE_SCALE: A=4,B=3,C=2,D=1,F=0
    HS_SCALE: A=5,B=4,C=3,D=2,F=0,W=0
  precision: 3 decimal places, round_half_up
  variants:
  - name: college_scale
    when: institution == COLLEGE
    difference: 4.0 scale; W excluded entirely (does not move the GPA)
  - name: high_school_scale
    when: institution == HIGH_SCHOOL
    difference: 5.0 dual-credit weighted scale; W included as 0 points with units in the denominator (drags the GPA down)
- name: prerequisite_satisfaction
  trigger: Prerequisite creation (DAG validation) and Enrollment confirm (satisfaction check)
  algorithm: topological
  formula: 'The Prerequisite table is a DAG over Course nodes (edge course_id -> requires_course_id).

    Creation rejects: self-edges (ERR_SELF_PREREQUISITE), exact duplicate edges (ERR_DUPLICATE_PREREQUISITE),

    and any edge that would close a cycle (ERR_PREREQUISITE_CYCLE — detected by DFS reachability from

    requires_course_id back to course_id).

    Satisfaction at confirm: for EVERY Prerequisite row of the offering''s course, there must exist a

    TranscriptEntry with institution == COLLEGE, status == POSTED, whose enrollment belongs to this

    student and whose offering''s course_id == requires_course_id, with grade at least min_grade

    (grade order A > B > C > D > F; only grades A/B/C can satisfy any min_grade).

    '
  input_set: Prerequisite rows of the course; the student's POSTED COLLEGE TranscriptEntries
  constants: {}
  precision: exact set membership
- name: placement_recency
  trigger: Enrollment confirm when course.min_placement_score > 0
  algorithm: chronological
  formula: "records = PlacementRecords with student_id == student AND exam_code == course.placement_exam_code\n          AND\
    \ expires_at > now          # expired records are invisible\nif records empty -> ERR_PLACEMENT_MISSING\nlatest = records\
    \ ordered by taken_at DESC, created_at DESC; take the first\nif latest.score < course.min_placement_score -> ERR_PLACEMENT_SCORE_INSUFFICIENT\n\
    Note: an expired newer record does NOT mask an older still-valid record; the older one is evaluated.\n"
  input_set: Non-expired PlacementRecords of the student for the course's exam_code
  constants:
    PLACEMENT_VALIDITY_DAYS: 730
  precision: ISO8601 UTC instants; integer score comparison (>= passes)
- name: transfer_credit_evaluation
  trigger: GET /dual-credit/enrollments/{enrollmentId}/transfer-evaluation?target_institution=X
  algorithm: aggregation
  formula: "Requires the enrollment to be COMPLETED (else ERR_ENROLLMENT_INVALID_STATE).\nagreement = ArticulationAgreement\
    \ with course_id == enrollment's course AND target_institution == X\n            AND effective_from <= now <= effective_to\
    \ (active window, CLOSED interval)\neligible = agreement exists AND grade meets min_grade_for_transfer (order A > B >\
    \ C; F and W never eligible)\narticulated_credit_hours = eligible ? agreement.transfer_credit_hours : 0\nnative_credit_hours\
    \      = eligible ? course.college_credit_hours      : 0\ncredit_loss_hours        = native_credit_hours - articulated_credit_hours\n\
    Two readings of the same completed course: the articulated reading (what the target grants,\npossibly reduced) and the\
    \ native reading (full college hours) — they diverge whenever\ntransfer_credit_hours < college_credit_hours.\n"
  input_set: The COMPLETED enrollment, its course, and active ArticulationAgreements for (course, target)
  constants: {}
  precision: hours to 1 decimal place
  variants:
  - name: articulated_reading
    when: An active agreement covers (course, target)
    difference: Reports agreement.transfer_credit_hours — may be lower than native hours
  - name: native_reading
    when: Same inputs
    difference: Reports course.college_credit_hours in full; credit_loss_hours is the delta between readings
validations:
- priority: 1
  category: auth
  check: X-User-ID and X-User-Role headers must be present and X-User-Role must be a declared role
  error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http_status: 400
  applies_to: all
- priority: 2
  category: auth
  check: The role must be listed for the endpoint
  error_id: ERR_UNAUTHORIZED_ROLE
  http_status: 403
  applies_to: all
- priority: 3
  category: auth
  check: 'Entity-backed ownership: an Instructor may only create/resubmit CredentialApplications where instructor_id == X-User-ID,
    and may only submit grades for offerings where offering.instructor_id == X-User-ID; a CredentialReviewer''s decision calls
    require X-User-ID == reviewed_by'
  error_id: ERR_NOT_RESOURCE_OWNER / ERR_NOT_OFFERING_INSTRUCTOR
  http_status: 403
  applies_to: POST /dual-credit/credential-applications, POST .../resubmit, POST .../submit-grade, POST .../approve, POST
    .../deny, POST .../request-revision
- priority: 3
  category: auth
  check: 'Segregation of duties: on credential decisions the reviewer''s X-User-ID must differ from the application''s instructor_id
    (a person may not approve their own credential)'
  error_id: ERR_CREDENTIAL_SELF_APPROVAL
  http_status: 403
  applies_to: POST .../credential-applications/{id}/approve, .../deny, .../request-revision
- priority: 4
  category: existence
  check: 'Request shape: required fields present, types and enum members valid, numeric ranges honored, term date ordering
    (start_date < add_deadline <= drop_deadline <= withdraw_deadline <= end_date), high_school_id present iff institution_type
    == HIGH_SCHOOL and absent iff COLLEGE'
  error_id: ERR_VALIDATION
  http_status: 400
  applies_to: all write endpoints
- priority: 4
  category: existence
  check: 'Pagination parameters: 1 <= limit <= 100, offset >= 0'
  error_id: ERR_INVALID_PAGINATION_PARAMETERS
  http_status: 400
  applies_to: all list GET endpoints
- priority: 5
  category: existence
  check: Referenced resources exist — path ids left-to-right, then body FKs in declared input order
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all endpoints with resource ids
- priority: 6
  category: state
  check: Target resource is in a valid state for the operation (per its state machine); includes finalize's aggregate precondition
    that every REGISTERED enrollment is graded
  error_id: ERR_INVALID_STATE | ERR_TERM_INVALID_STATE | ERR_OFFERING_INVALID_STATE | ERR_ENROLLMENT_INVALID_STATE | ERR_CREDENTIAL_APPLICATION_INVALID_STATE
    | ERR_INVOICE_INVALID_STATE | ERR_TRANSCRIPT_ENTRY_INVALID_STATE | ERR_GRADES_MISSING
  http_status: 409
  applies_to: state transition endpoints
- priority: 6
  category: state
  check: 'OCC: expected_offering_version must equal the offering''s current version'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST .../enrollments/{id}/confirm, POST .../enrollments/{id}/reinstate
- priority: 7
  category: business_safety
  check: Student.status == ELIGIBLE and Student.grade_level >= 11
  error_id: ERR_STUDENT_NOT_ELIGIBLE
  http_status: 409
  applies_to: POST .../enrollments/{id}/confirm
- priority: 7
  category: business_safety
  check: Student's HighSchool.status == ACTIVE
  error_id: ERR_SCHOOL_SUSPENDED
  http_status: 409
  applies_to: POST .../enrollments/{id}/confirm
- priority: 8
  category: business_temporal
  check: 'Action window per effective_deadline: confirm requires now <= effective_add_deadline; drop requires now <= effective_drop_deadline;
    withdraw requires effective_drop_deadline < now <= effective_withdraw_deadline'
  error_id: ERR_ADD_WINDOW_CLOSED | ERR_DROP_WINDOW_CLOSED | ERR_WITHDRAW_WINDOW_CLOSED
  http_status: 409
  applies_to: POST .../enrollments/{id}/confirm, .../drop, .../withdraw
- priority: 8
  category: business_temporal
  check: begin-grading requires now >= college_term.end_date
  error_id: ERR_TERM_NOT_ENDED
  http_status: 409
  applies_to: POST .../offerings/{id}/begin-grading
- priority: 8
  category: business_temporal
  check: 'Term creation: HALF-OPEN [start_date, end_date) overlap with any existing term of the same institution_type (and
    same high_school_id for HIGH_SCHOOL) is rejected; adjacency (end == start) is allowed'
  error_id: ERR_TERM_OVERLAP
  http_status: 409
  applies_to: POST /dual-credit/terms
- priority: 8
  category: business_temporal
  check: 'Articulation creation: CLOSED [effective_from, effective_to] overlap with any existing agreement of the same (course_id,
    target_institution) is rejected; touching endpoints DO conflict'
  error_id: ERR_ARTICULATION_WINDOW_OVERLAP
  http_status: 409
  applies_to: POST /dual-credit/articulation-agreements
- priority: 9
  category: business_referential
  check: Both referenced terms have status == OPEN
  error_id: ERR_TERM_NOT_OPEN
  http_status: 409
  applies_to: POST .../enrollments/{id}/confirm, POST .../offerings/{id}/open
- priority: 9
  category: business_referential
  check: 'Offering term references: college_term_id must point to a COLLEGE term and hs_term_id to a HIGH_SCHOOL term (ERR_TERM_TYPE_MISMATCH);
    hs_term.high_school_id must equal offering.high_school_id (ERR_TERM_SCHOOL_MISMATCH)'
  error_id: ERR_TERM_TYPE_MISMATCH | ERR_TERM_SCHOOL_MISMATCH
  http_status: 409
  applies_to: POST /dual-credit/offerings
- priority: 10
  category: business_referential
  check: Prerequisite satisfaction per prerequisite_satisfaction
  error_id: ERR_PREREQUISITE_NOT_MET
  http_status: 409
  applies_to: POST .../enrollments/{id}/confirm
- priority: 11
  category: business_referential
  check: Placement record exists and is current per placement_recency
  error_id: ERR_PLACEMENT_MISSING
  http_status: 409
  applies_to: POST .../enrollments/{id}/confirm
- priority: 12
  category: business_referential
  check: Latest non-expired placement score >= course.min_placement_score
  error_id: ERR_PLACEMENT_SCORE_INSUFFICIENT
  http_status: 409
  applies_to: POST .../enrollments/{id}/confirm
- priority: 13
  category: business_referential
  check: A FundingAgreement exists for (offering.high_school_id, offering.college_term_id)
  error_id: ERR_NO_FUNDING_AGREEMENT
  http_status: 409
  applies_to: POST .../enrollments/{id}/confirm
- priority: 14
  category: business_referential
  check: Instructor holds an APPROVED CredentialApplication for the offering's course
  error_id: ERR_INSTRUCTOR_NOT_CREDENTIALED
  http_status: 409
  applies_to: POST .../offerings/{id}/open
- priority: 15
  category: business_constraint
  check: 'No duplicate enrollment: an enrollment for (student_id, offering_id) with status in {PENDING_VERIFICATION, REGISTERED,
    WAITLISTED} already exists'
  error_id: ERR_DUPLICATE_ENROLLMENT
  http_status: 409
  applies_to: POST /dual-credit/enrollments
- priority: 15
  category: business_constraint
  check: 'Prerequisite edge rules: self-edge, exact duplicate, cycle — evaluated in that sub-order'
  error_id: ERR_SELF_PREREQUISITE | ERR_DUPLICATE_PREREQUISITE | ERR_PREREQUISITE_CYCLE
  http_status: 409
  applies_to: POST /dual-credit/prerequisites
- priority: 15
  category: business_constraint
  check: At most one FundingAgreement per (high_school_id, college_term_id)
  error_id: ERR_DUPLICATE_FUNDING_AGREEMENT
  http_status: 409
  applies_to: POST /dual-credit/funding-agreements
- priority: 16
  category: business_fiscal
  check: Reinstate requires seats_available >= 1
  error_id: ERR_NO_SEATS_AVAILABLE
  http_status: 409
  applies_to: POST .../enrollments/{id}/reinstate
- priority: 16
  category: business_fiscal
  check: Payment must not exceed the payer's remaining share on the invoice
  error_id: ERR_OVERPAYMENT
  http_status: 409
  applies_to: POST .../invoices/{id}/payments
- priority: 16
  category: business_fiscal
  check: Refund requires refund_status == DUE
  error_id: ERR_REFUND_NOT_DUE
  http_status: 409
  applies_to: POST .../invoices/{id}/refund
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\"\
    : \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\"\
    \ } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
endpoints:
- method: POST
  path: /dual-credit/high-schools
  description: Create a partner high school
  roles:
  - DualCreditAdmin
  code: 201
  input:
  - name
  - district_code
  output: HighSchool
  side_effects:
  - status initialized to ACTIVE
- method: GET
  path: /dual-credit/high-schools
  description: List high schools (created_at ASC)
  roles:
  - Any
  code: 200
  input:
  - limit?
  - offset?
  output: HighSchool[]
  side_effects: []
- method: GET
  path: /dual-credit/high-schools/{schoolId}
  description: Get one high school
  roles:
  - Any
  code: 200
  input: []
  output: HighSchool
  side_effects: []
- method: POST
  path: /dual-credit/high-schools/{schoolId}/suspend
  description: Suspend a high school (ACTIVE -> SUSPENDED); blocks future enrollment confirmations
  roles:
  - DualCreditAdmin
  code: 200
  input: []
  output: HighSchool
  side_effects:
  - status -> SUSPENDED; increments HighSchool.version by 1
- method: POST
  path: /dual-credit/terms
  description: Create an academic term (college or high-school calendar); half-open overlap with a sibling term is rejected
  roles:
  - DualCreditAdmin
  code: 201
  input:
  - institution_type
  - name
  - high_school_id?
  - start_date
  - end_date
  - add_deadline
  - drop_deadline
  - withdraw_deadline
  output: AcademicTerm
  side_effects:
  - status initialized to SCHEDULED
- method: GET
  path: /dual-credit/terms
  description: List terms, optionally filtered
  roles:
  - Any
  code: 200
  input:
  - institution_type?
  - high_school_id?
  - limit?
  - offset?
  output: AcademicTerm[]
  side_effects: []
- method: GET
  path: /dual-credit/terms/{termId}
  description: Get one term
  roles:
  - Any
  code: 200
  input: []
  output: AcademicTerm
  side_effects: []
- method: POST
  path: /dual-credit/terms/{termId}/open-registration
  description: SCHEDULED -> OPEN
  roles:
  - DualCreditAdmin
  code: 200
  input: []
  output: AcademicTerm
  side_effects:
  - status -> OPEN; increments AcademicTerm.version by 1
- method: POST
  path: /dual-credit/terms/{termId}/close-registration
  description: OPEN -> CLOSED; expires WAITLISTED enrollments of offerings tied to this term (college_term_id or hs_term_id)
  roles:
  - DualCreditAdmin
  code: 200
  input: []
  output: AcademicTerm
  side_effects:
  - status -> CLOSED; matching WAITLISTED Enrollments -> EXPIRED; increments AcademicTerm.version by 1
- method: POST
  path: /dual-credit/students
  description: Register a student
  roles:
  - HsCoordinator
  code: 201
  input:
  - full_name
  - high_school_id
  - grade_level
  output: Student
  side_effects:
  - status initialized to ELIGIBLE; college_gpa and hs_gpa initialized to 0.000
- method: GET
  path: /dual-credit/students
  description: List students, optionally by school
  roles:
  - Any
  code: 200
  input:
  - high_school_id?
  - limit?
  - offset?
  output: Student[]
  side_effects: []
- method: GET
  path: /dual-credit/students/{studentId}
  description: Get one student (includes computed college_gpa / hs_gpa)
  roles:
  - Any
  code: 200
  input: []
  output: Student
  side_effects: []
- method: POST
  path: /dual-credit/students/{studentId}/suspend
  description: ELIGIBLE -> SUSPENDED; blocks future enrollment confirmations
  roles:
  - DualCreditAdmin
  code: 200
  input: []
  output: Student
  side_effects:
  - status -> SUSPENDED; increments Student.version by 1
- method: POST
  path: /dual-credit/courses
  description: Create a catalog course
  roles:
  - DualCreditAdmin
  code: 201
  input:
  - course_code
  - title
  - college_credit_hours
  - hs_credit_units
  - placement_exam_code
  - min_placement_score
  output: Course
  side_effects:
  - status initialized to ACTIVE
- method: GET
  path: /dual-credit/courses
  description: List courses
  roles:
  - Any
  code: 200
  input:
  - limit?
  - offset?
  output: Course[]
  side_effects: []
- method: GET
  path: /dual-credit/courses/{courseId}
  description: Get one course
  roles:
  - Any
  code: 200
  input: []
  output: Course
  side_effects: []
- method: POST
  path: /dual-credit/courses/{courseId}/retire
  description: ACTIVE -> RETIRED
  roles:
  - DualCreditAdmin
  code: 200
  input: []
  output: Course
  side_effects:
  - status -> RETIRED; increments Course.version by 1
- method: POST
  path: /dual-credit/prerequisites
  description: Create a prerequisite edge course_id -> requires_course_id; rejects self-edges, duplicates, and cycle-closing
    edges
  roles:
  - DualCreditAdmin
  code: 201
  input:
  - course_id
  - requires_course_id
  - min_grade?
  output: Prerequisite
  side_effects: []
- method: GET
  path: /dual-credit/prerequisites
  description: List prerequisite edges, optionally filtered by either side
  roles:
  - Any
  code: 200
  input:
  - course_id?
  - requires_course_id?
  - limit?
  - offset?
  output: Prerequisite[]
  side_effects: []
- method: GET
  path: /dual-credit/prerequisites/{prereqId}
  description: Get one prerequisite edge
  roles:
  - Any
  code: 200
  input: []
  output: Prerequisite
  side_effects: []
- method: POST
  path: /dual-credit/placement-records
  description: Record a placement exam result; expires_at computed as taken_at + 730 days
  roles:
  - HsCoordinator
  code: 201
  input:
  - student_id
  - exam_code
  - score
  - taken_at
  output: PlacementRecord
  side_effects:
  - expires_at computed
- method: GET
  path: /dual-credit/placement-records
  description: List placement records, optionally by student
  roles:
  - Any
  code: 200
  input:
  - student_id?
  - limit?
  - offset?
  output: PlacementRecord[]
  side_effects: []
- method: GET
  path: /dual-credit/placement-records/{recordId}
  description: Get one placement record
  roles:
  - Any
  code: 200
  input: []
  output: PlacementRecord
  side_effects: []
- method: POST
  path: /dual-credit/instructors
  description: Create an instructor
  roles:
  - DualCreditAdmin
  code: 201
  input:
  - full_name
  - high_school_id
  output: Instructor
  side_effects: []
- method: GET
  path: /dual-credit/instructors
  description: List instructors, optionally by school
  roles:
  - Any
  code: 200
  input:
  - high_school_id?
  - limit?
  - offset?
  output: Instructor[]
  side_effects: []
- method: GET
  path: /dual-credit/instructors/{instructorId}
  description: Get one instructor
  roles:
  - Any
  code: 200
  input: []
  output: Instructor
  side_effects: []
- method: POST
  path: /dual-credit/credential-applications
  description: Instructor applies for credentialing on a course (instructor_id must equal the caller's X-User-ID)
  roles:
  - Instructor
  code: 201
  input:
  - instructor_id
  - course_id
  - qualification_summary
  output: CredentialApplication
  side_effects:
  - status initialized to SUBMITTED; reviewed_by null
- method: GET
  path: /dual-credit/credential-applications
  description: List credential applications, optionally filtered
  roles:
  - Any
  code: 200
  input:
  - instructor_id?
  - course_id?
  - status?
  - limit?
  - offset?
  output: CredentialApplication[]
  side_effects: []
- method: GET
  path: /dual-credit/credential-applications/{appId}
  description: Get one credential application
  roles:
  - Any
  code: 200
  input: []
  output: CredentialApplication
  side_effects: []
- method: POST
  path: /dual-credit/credential-applications/{appId}/begin-review
  description: SUBMITTED -> UNDER_REVIEW; claims review ownership (reviewed_by := caller)
  roles:
  - CredentialReviewer
  code: 200
  input: []
  output: CredentialApplication
  side_effects:
  - status -> UNDER_REVIEW; reviewed_by := caller X-User-ID; increments CredentialApplication.version by 1
- method: POST
  path: /dual-credit/credential-applications/{appId}/approve
  description: UNDER_REVIEW -> APPROVED (review owner only; not the applicant)
  roles:
  - CredentialReviewer
  code: 200
  input:
  - decision_reason?
  output: CredentialApplication
  side_effects:
  - status -> APPROVED; increments CredentialApplication.version by 1
- method: POST
  path: /dual-credit/credential-applications/{appId}/deny
  description: UNDER_REVIEW -> DENIED (review owner only; not the applicant)
  roles:
  - CredentialReviewer
  code: 200
  input:
  - decision_reason?
  output: CredentialApplication
  side_effects:
  - status -> DENIED; increments CredentialApplication.version by 1
- method: POST
  path: /dual-credit/credential-applications/{appId}/request-revision
  description: UNDER_REVIEW -> NEEDS_REVISION (review owner only; not the applicant)
  roles:
  - CredentialReviewer
  code: 200
  input:
  - decision_reason?
  output: CredentialApplication
  side_effects:
  - status -> NEEDS_REVISION; increments CredentialApplication.version by 1
- method: POST
  path: /dual-credit/credential-applications/{appId}/resubmit
  description: NEEDS_REVISION -> SUBMITTED by the applicant; clears reviewed_by
  roles:
  - Instructor
  code: 200
  input: []
  output: CredentialApplication
  side_effects:
  - status -> SUBMITTED; reviewed_by := null; increments CredentialApplication.version by 1
- method: POST
  path: /dual-credit/offerings
  description: Create a course offering (section) at a high school under a pair of calendars; starts DRAFT
  roles:
  - DualCreditAdmin
  code: 201
  input:
  - course_id
  - college_term_id
  - hs_term_id
  - high_school_id
  - instructor_id
  - capacity
  - delivery_mode?
  output: CourseOffering
  side_effects:
  - status initialized to DRAFT; seats_taken := 0; seats_available := capacity
- method: GET
  path: /dual-credit/offerings
  description: List offerings, optionally filtered
  roles:
  - Any
  code: 200
  input:
  - course_id?
  - high_school_id?
  - college_term_id?
  - hs_term_id?
  - instructor_id?
  - status?
  - limit?
  - offset?
  output: CourseOffering[]
  side_effects: []
- method: GET
  path: /dual-credit/offerings/{offeringId}
  description: Get one offering (includes computed seats_taken / seats_available and OCC version)
  roles:
  - Any
  code: 200
  input: []
  output: CourseOffering
  side_effects: []
- method: POST
  path: /dual-credit/offerings/{offeringId}/open
  description: DRAFT -> OPEN; requires both terms OPEN, course ACTIVE, and an APPROVED credential for (instructor, course)
  roles:
  - DualCreditAdmin
  code: 200
  input: []
  output: CourseOffering
  side_effects:
  - status -> OPEN; increments CourseOffering.version by 1
- method: POST
  path: /dual-credit/offerings/{offeringId}/start-session
  description: OPEN -> IN_SESSION
  roles:
  - DualCreditAdmin
  code: 200
  input: []
  output: CourseOffering
  side_effects:
  - status -> IN_SESSION; increments CourseOffering.version by 1
- method: POST
  path: /dual-credit/offerings/{offeringId}/begin-grading
  description: IN_SESSION -> GRADING; requires logical clock >= college_term.end_date
  roles:
  - DualCreditAdmin
  code: 200
  input: []
  output: CourseOffering
  side_effects:
  - status -> GRADING; increments CourseOffering.version by 1
- method: POST
  path: /dual-credit/offerings/{offeringId}/finalize
  description: GRADING -> FINALIZED; requires every REGISTERED enrollment graded; completes enrollments and creates PENDING
    transcript entries per posting rules
  roles:
  - CollegeRegistrar
  code: 200
  input: []
  output: CourseOffering
  side_effects:
  - status -> FINALIZED; REGISTERED Enrollments -> COMPLETED; TranscriptEntries created (COLLEGE always for COMPLETED and
    WITHDRAWN; HIGH_SCHOOL for COMPLETED, and for WITHDRAWN only when withdrawn_at > hs_term.drop_deadline); increments CourseOffering.version
    by 1
- method: POST
  path: /dual-credit/offerings/{offeringId}/cancel
  description: DRAFT|OPEN -> CANCELLED; conditional cascade to non-terminal enrollments and their invoices
  roles:
  - DualCreditAdmin
  code: 200
  input: []
  output: CourseOffering
  side_effects:
  - status -> CANCELLED; PENDING_VERIFICATION/WAITLISTED enrollments -> CANCELLED; REGISTERED enrollments -> DROPPED with
    invoices VOIDED and refund_pct := 100; increments CourseOffering.version by 1
- method: POST
  path: /dual-credit/enrollments
  description: Create an enrollment in PENDING_VERIFICATION (no seat consumed yet)
  roles:
  - HsCoordinator
  code: 201
  input:
  - student_id
  - offering_id
  output: Enrollment
  side_effects:
  - status initialized to PENDING_VERIFICATION
- method: GET
  path: /dual-credit/enrollments
  description: List enrollments, optionally filtered
  roles:
  - Any
  code: 200
  input:
  - student_id?
  - offering_id?
  - status?
  - limit?
  - offset?
  output: Enrollment[]
  side_effects: []
- method: GET
  path: /dual-credit/enrollments/{enrollmentId}
  description: Get one enrollment
  roles:
  - Any
  code: 200
  input: []
  output: Enrollment
  side_effects: []
- method: POST
  path: /dual-credit/enrollments/{enrollmentId}/confirm
  description: Run eligibility (student, school, calendars, prerequisites, placement, funding) then allocate a seat (REGISTERED
    + Invoice) or waitlist (WAITLISTED + waitlist_seq)
  roles:
  - HsCoordinator
  code: 200
  input:
  - expected_offering_version
  output: Enrollment
  side_effects:
  - 'On REGISTERED: seats_taken += 1 and Invoice created via tuition_allocation; on WAITLISTED: waitlist_seq assigned; increments
    CourseOffering.version by 1; increments Enrollment.version by 1'
- method: POST
  path: /dual-credit/enrollments/{enrollmentId}/drop
  description: REGISTERED -> DROPPED at/before the effective drop deadline; 100 pct refund; releases the seat and may promote
    the waitlist head
  roles:
  - HsCoordinator
  code: 200
  input: []
  output: Enrollment
  side_effects:
  - status -> DROPPED; seats_taken -= 1; Invoice -> VOIDED with refund_pct := 100 per refund_settlement; waitlist_promotion
    may fire; increments CourseOffering.version by 1; increments Enrollment.version by 1
- method: POST
  path: /dual-credit/enrollments/{enrollmentId}/withdraw
  description: REGISTERED -> WITHDRAWN inside the withdraw window; grade W; refund 50 pct only at/before the college drop
    deadline
  roles:
  - HsCoordinator
  code: 200
  input: []
  output: Enrollment
  side_effects:
  - status -> WITHDRAWN; grade := W; withdrawn_at := now; seats_taken -= 1; refund_settlement per refund_percentage; waitlist_promotion
    may fire; increments CourseOffering.version by 1; increments Enrollment.version by 1
- method: POST
  path: /dual-credit/enrollments/{enrollmentId}/reinstate
  description: WITHDRAWN -> REGISTERED (registrar petition); requires a free seat and a fresh offering version
  roles:
  - CollegeRegistrar
  code: 200
  input:
  - expected_offering_version
  output: Enrollment
  side_effects:
  - status -> REGISTERED; grade := null; withdrawn_at := null; seats_taken += 1; a NEW Invoice is created via tuition_allocation;
    increments CourseOffering.version by 1; increments Enrollment.version by 1
- method: POST
  path: /dual-credit/enrollments/{enrollmentId}/cancel-waitlist
  description: WAITLISTED -> CANCELLED
  roles:
  - HsCoordinator
  code: 200
  input: []
  output: Enrollment
  side_effects:
  - status -> CANCELLED; increments Enrollment.version by 1
- method: POST
  path: /dual-credit/enrollments/{enrollmentId}/submit-grade
  description: Instructor of record records the final letter grade (A-F) while the offering is GRADING
  roles:
  - Instructor
  code: 200
  input:
  - grade
  output: Enrollment
  side_effects:
  - grade set (A|B|C|D|F only — W is system-set by withdraw); increments Enrollment.version by 1
- method: GET
  path: /dual-credit/enrollments/{enrollmentId}/transfer-evaluation
  description: 'Computed read: articulated vs native transfer credit for a COMPLETED enrollment toward a target institution'
  roles:
  - Any
  code: 200
  input:
  - target_institution
  output:
    target_institution: string
    eligible: boolean
    articulated_credit_hours: number
    native_credit_hours: number
    credit_loss_hours: number
  side_effects: []
- method: GET
  path: /dual-credit/transcript-entries
  description: List transcript entries, optionally filtered
  roles:
  - Any
  code: 200
  input:
  - enrollment_id?
  - institution?
  - status?
  - limit?
  - offset?
  output: TranscriptEntry[]
  side_effects: []
- method: GET
  path: /dual-credit/transcript-entries/{entryId}
  description: Get one transcript entry
  roles:
  - Any
  code: 200
  input: []
  output: TranscriptEntry
  side_effects: []
- method: POST
  path: /dual-credit/transcript-entries/{entryId}/post
  description: PENDING -> POSTED; recomputes the student's GPA for the entry's institution
  roles:
  - CollegeRegistrar
  code: 200
  input: []
  output: TranscriptEntry
  side_effects:
  - status -> POSTED; gpa_recompute updates Student.college_gpa or Student.hs_gpa; increments TranscriptEntry.version by 1
- method: POST
  path: /dual-credit/transcript-entries/{entryId}/void
  description: POSTED -> VOIDED (grade under appeal / correction); recomputes the GPA excluding this entry
  roles:
  - CollegeRegistrar
  code: 200
  input: []
  output: TranscriptEntry
  side_effects:
  - status -> VOIDED; gpa_recompute updates the student's GPA; increments TranscriptEntry.version by 1
- method: POST
  path: /dual-credit/funding-agreements
  description: Create the per-school per-term tuition responsibility rule; unique on (high_school_id, college_term_id)
  roles:
  - DualCreditAdmin
  code: 201
  input:
  - high_school_id
  - college_term_id
  - funding_model
  - tuition_cents_per_credit
  - state_rate_cents_per_credit?
  - district_cap_cents?
  output: FundingAgreement
  side_effects: []
- method: GET
  path: /dual-credit/funding-agreements
  description: List funding agreements, optionally filtered
  roles:
  - Any
  code: 200
  input:
  - high_school_id?
  - college_term_id?
  - limit?
  - offset?
  output: FundingAgreement[]
  side_effects: []
- method: GET
  path: /dual-credit/funding-agreements/{agreementId}
  description: Get one funding agreement
  roles:
  - Any
  code: 200
  input: []
  output: FundingAgreement
  side_effects: []
- method: GET
  path: /dual-credit/invoices
  description: List invoices, optionally filtered
  roles:
  - Any
  code: 200
  input:
  - enrollment_id?
  - funding_agreement_id?
  - status?
  - limit?
  - offset?
  output: Invoice[]
  side_effects: []
- method: GET
  path: /dual-credit/invoices/{invoiceId}
  description: Get one invoice (billed shares, paid amounts, refund fields, status, refund_status)
  roles:
  - Any
  code: 200
  input: []
  output: Invoice
  side_effects: []
- method: POST
  path: /dual-credit/invoices/{invoiceId}/payments
  description: Record a payment against one payer bucket; moves ISSUED -> PARTIALLY_PAID -> PAID
  roles:
  - Bursar
  code: 201
  input:
  - payer
  - amount_cents
  - note?
  output: Payment
  side_effects:
  - Invoice.paid_<payer>_cents += amount_cents; Invoice status recomputed; increments Invoice.version by 1
- method: GET
  path: /dual-credit/payments
  description: List payment events, optionally by invoice
  roles:
  - Any
  code: 200
  input:
  - invoice_id?
  - payer?
  - limit?
  - offset?
  output: Payment[]
  side_effects: []
- method: GET
  path: /dual-credit/payments/{paymentId}
  description: Get one payment event
  roles:
  - Any
  code: 200
  input: []
  output: Payment
  side_effects: []
- method: POST
  path: /dual-credit/invoices/{invoiceId}/refund
  description: Settle the refund from PAID amounts (refund_status DUE -> PROCESSED); sets refund_paid_cents
  roles:
  - Bursar
  code: 200
  input: []
  output: Invoice
  side_effects:
  - refund_paid_cents computed per refund_settlement settled variant; refund_status -> PROCESSED; increments Invoice.version
    by 1
- method: POST
  path: /dual-credit/articulation-agreements
  description: Create an articulation agreement; CLOSED-interval window overlap on (course_id, target_institution) is rejected
  roles:
  - DualCreditAdmin
  code: 201
  input:
  - course_id
  - target_institution
  - transfer_credit_hours
  - min_grade_for_transfer?
  - effective_from
  - effective_to
  output: ArticulationAgreement
  side_effects: []
- method: GET
  path: /dual-credit/articulation-agreements
  description: List articulation agreements, optionally by course
  roles:
  - Any
  code: 200
  input:
  - course_id?
  - target_institution?
  - limit?
  - offset?
  output: ArticulationAgreement[]
  side_effects: []
- method: GET
  path: /dual-credit/articulation-agreements/{agreementId}
  description: Get one articulation agreement
  roles:
  - Any
  code: 200
  input: []
  output: ArticulationAgreement
  side_effects: []
- method: POST
  path: /dual-credit/_clock/set_current_utc
  description: Set the server's logical clock (ISO8601 UTC). Startup default is exactly 2026-08-01T00:00:00Z; before any set
    call the clock reads that default and never falls back to wall-clock time.
  roles:
  - DualCreditAdmin
  code: 200
  input:
  - to_iso8601
  output:
    now_iso8601: string
  side_effects:
  - logical clock := to_iso8601
errors:
- id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http: 400
  condition: X-User-ID or X-User-Role header missing, or role not declared
- id: ERR_UNAUTHORIZED_ROLE
  http: 403
  condition: Role not permitted for this endpoint
- id: ERR_NOT_RESOURCE_OWNER
  http: 403
  condition: Entity-backed caller does not own the target resource (credential application applicant/reviewer mismatch)
- id: ERR_NOT_OFFERING_INSTRUCTOR
  http: 403
  condition: submit-grade caller is not the offering's instructor of record
- id: ERR_CREDENTIAL_SELF_APPROVAL
  http: 403
  condition: Reviewer's X-User-ID equals the application's instructor_id — segregation of duties violated
- id: ERR_VALIDATION
  http: 400
  condition: 'Malformed request: missing required field, bad enum member, out-of-range number, bad term date ordering, or
    high_school_id presence mismatch with institution_type'
- id: ERR_INVALID_PAGINATION_PARAMETERS
  http: 400
  condition: limit outside 1..100 or offset < 0
- id: ERR_NOT_FOUND
  http: 404
  condition: A referenced resource (path id or body FK) does not exist; path validated left-to-right, then body FKs in declared
    input order
- id: ERR_INVALID_STATE
  http: 409
  condition: Lifecycle transition invalid for the target's current state (HighSchool / Student / Course)
- id: ERR_TERM_INVALID_STATE
  http: 409
  condition: Term transition invalid for current term status
- id: ERR_TERM_NOT_OPEN
  http: 409
  condition: Operation requires both referenced terms (or the referenced term) to have status OPEN
- id: ERR_OFFERING_INVALID_STATE
  http: 409
  condition: Offering transition or offering-dependent operation invalid for current offering status (includes creating an
    enrollment against a non-OPEN offering)
- id: ERR_ENROLLMENT_INVALID_STATE
  http: 409
  condition: 'Enrollment transition invalid for current enrollment status (also: withdraw attempted while the drop window
    is still open; transfer-evaluation on a non-COMPLETED enrollment)'
- id: ERR_CREDENTIAL_APPLICATION_INVALID_STATE
  http: 409
  condition: Credential application transition invalid for current status
- id: ERR_INVOICE_INVALID_STATE
  http: 409
  condition: Payment or refund against an invoice in an incompatible status (VOIDED invoice cannot take payments)
- id: ERR_TRANSCRIPT_ENTRY_INVALID_STATE
  http: 409
  condition: Post/void invalid for the entry's current status
- id: ERR_GRADES_MISSING
  http: 409
  condition: Finalize attempted while at least one REGISTERED enrollment still has grade == null
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_offering_version does not match the offering's current version (OCC)
- id: ERR_STUDENT_NOT_ELIGIBLE
  http: 409
  condition: Student suspended or grade_level below 11 at confirm
- id: ERR_SCHOOL_SUSPENDED
  http: 409
  condition: Student's high school is SUSPENDED at confirm
- id: ERR_ADD_WINDOW_CLOSED
  http: 409
  condition: Confirm attempted after min(college_term.add_deadline, hs_term.add_deadline)
- id: ERR_DROP_WINDOW_CLOSED
  http: 409
  condition: Drop attempted after min(college_term.drop_deadline, hs_term.drop_deadline)
- id: ERR_WITHDRAW_WINDOW_CLOSED
  http: 409
  condition: Withdraw after min(withdraw_deadlines), or reinstate after college_term.end_date
- id: ERR_TERM_NOT_ENDED
  http: 409
  condition: begin-grading attempted before college_term.end_date
- id: ERR_TERM_OVERLAP
  http: 409
  condition: New term's half-open [start_date, end_date) overlaps an existing term of the same institution_type (and high
    school for HIGH_SCHOOL terms)
- id: ERR_ARTICULATION_WINDOW_OVERLAP
  http: 409
  condition: New articulation window [effective_from, effective_to] (closed) overlaps an existing agreement for the same (course_id,
    target_institution)
- id: ERR_TERM_TYPE_MISMATCH
  http: 409
  condition: college_term_id does not reference a COLLEGE term or hs_term_id does not reference a HIGH_SCHOOL term
- id: ERR_TERM_SCHOOL_MISMATCH
  http: 409
  condition: hs_term.high_school_id differs from the offering's high_school_id
- id: ERR_PREREQUISITE_NOT_MET
  http: 409
  condition: A Prerequisite of the course lacks a satisfying POSTED COLLEGE transcript entry for the student
- id: ERR_PLACEMENT_MISSING
  http: 409
  condition: Course requires placement (min_placement_score > 0) but no non-expired PlacementRecord exists for the exam_code
- id: ERR_PLACEMENT_SCORE_INSUFFICIENT
  http: 409
  condition: Latest non-expired placement score is below the course minimum
- id: ERR_NO_FUNDING_AGREEMENT
  http: 409
  condition: No FundingAgreement exists for (offering.high_school_id, offering.college_term_id)
- id: ERR_DUPLICATE_FUNDING_AGREEMENT
  http: 409
  condition: A FundingAgreement already exists for (high_school_id, college_term_id)
- id: ERR_INSTRUCTOR_NOT_CREDENTIALED
  http: 409
  condition: No APPROVED CredentialApplication for (offering.instructor_id, offering.course_id) at open
- id: ERR_DUPLICATE_ENROLLMENT
  http: 409
  condition: An enrollment for (student_id, offering_id) already exists in PENDING_VERIFICATION, REGISTERED, or WAITLISTED
- id: ERR_SELF_PREREQUISITE
  http: 400
  condition: course_id == requires_course_id
- id: ERR_DUPLICATE_PREREQUISITE
  http: 409
  condition: The exact prerequisite edge already exists
- id: ERR_PREREQUISITE_CYCLE
  http: 409
  condition: The edge would close a cycle in the prerequisite DAG
- id: ERR_NO_SEATS_AVAILABLE
  http: 409
  condition: Reinstate attempted while seats_available == 0
- id: ERR_OVERPAYMENT
  http: 409
  condition: Payment would push paid_<payer>_cents above <payer>_amount_cents
- id: ERR_REFUND_NOT_DUE
  http: 409
  condition: Refund attempted while refund_status != DUE (NONE or already PROCESSED)
roles:
- name: DualCreditAdmin
  description: 'College dual-credit office administrator; owns configuration: schools, terms, courses, prerequisites, offerings,
    funding and articulation agreements; drives the logical clock in tests'
  identity: opaque
  exclusive_operations:
  - POST /dual-credit/high-schools, POST /dual-credit/high-schools/{id}/suspend
  - POST /dual-credit/terms, POST /dual-credit/terms/{id}/open-registration, POST /dual-credit/terms/{id}/close-registration
  - POST /dual-credit/courses, POST /dual-credit/courses/{id}/retire
  - POST /dual-credit/prerequisites
  - POST /dual-credit/instructors
  - POST /dual-credit/offerings, POST /dual-credit/offerings/{id}/open, .../start-session, .../begin-grading, .../cancel
  - POST /dual-credit/students/{id}/suspend
  - POST /dual-credit/funding-agreements
  - POST /dual-credit/articulation-agreements
  - POST /dual-credit/_clock/set_current_utc
  shared_operations:
  - all GET endpoints
- name: HsCoordinator
  description: High-school-side dual credit coordinator; registers students, files placement records, creates/confirms/drops/withdraws
    enrollments and manages the waitlist
  identity: opaque
  exclusive_operations:
  - POST /dual-credit/students
  - POST /dual-credit/placement-records
  - POST /dual-credit/enrollments, POST .../confirm, .../drop, .../withdraw, .../cancel-waitlist
  shared_operations:
  - all GET endpoints
- name: Instructor
  description: High-school instructor teaching for college credit; applies for credentialing and submits grades for own offerings
  identity: entity_backed:Instructor
  exclusive_operations:
  - POST /dual-credit/credential-applications (instructor_id must equal X-User-ID)
  - POST /dual-credit/credential-applications/{id}/resubmit (applicant only)
  - POST /dual-credit/enrollments/{id}/submit-grade (offering instructor of record only)
  shared_operations:
  - all GET endpoints
- name: CredentialReviewer
  description: College academic reviewer for instructor credentialing; may never decide on their own application (segregation
    of duties)
  identity: opaque
  exclusive_operations:
  - POST /dual-credit/credential-applications/{id}/begin-review
  - POST /dual-credit/credential-applications/{id}/approve, .../deny, .../request-revision (review owner only)
  shared_operations:
  - all GET endpoints
- name: CollegeRegistrar
  description: College registrar; finalizes offerings, posts/voids transcript entries, decides reinstatements
  identity: opaque
  exclusive_operations:
  - POST /dual-credit/offerings/{id}/finalize
  - POST /dual-credit/transcript-entries/{id}/post, .../void
  - POST /dual-credit/enrollments/{id}/reinstate
  shared_operations:
  - all GET endpoints
- name: Bursar
  description: College bursar's office; records payments and settles refunds (segregated from DualCreditAdmin who sets funding
    terms)
  identity: opaque
  exclusive_operations:
  - POST /dual-credit/invoices/{id}/payments
  - POST /dual-credit/invoices/{id}/refund
  shared_operations:
  - all GET endpoints
- name: Any
  description: Marker for read endpoints shared by every declared role
  identity: opaque
  exclusive_operations: []
  shared_operations:
  - all GET endpoints
