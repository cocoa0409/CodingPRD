# ---------------------------------------------------------------------------
# §1.7 RBAC Table
#
# Every request carries `X-Role: <role name>`. Every request that records or checks an acting
# identity also carries `X-User-ID: <uuid>`. The role model is segregation_of_duties: two rules
# (inspector_is_not_the_operator, adjudicator_is_not_the_inspector) reject a correctly-roled
# request purely because the acting X-User-ID already performed a conflicting step.
# ---------------------------------------------------------------------------

roles:
  - name: StoreOptician
    identity: "X-User-ID is the optician's user id; recorded on RxOrder.created_by_optician_id."
    description: "Front-of-store dispensing staff: intake, verification, ordering, tracing, payments, dispensing, remake submission."
    exclusive_operations:
      - "POST /prescriptions"
      - "POST /prescriptions/{id}/verify"
      - "POST /prescriptions/{id}/reject"
      - "POST /prescriptions/{id}/resubmit"
      - "POST /rx-orders"
      - "POST /frame-layouts"
      - "POST /rx-orders/{id}/settle-patient-portion"
      - "POST /rx-orders/{id}/dispense"
      - "POST /rx-orders/{id}/cancel"
      - "POST /remake-cases"
    shared_operations:
      - "POST /prescribers (with LabManager)"
      - "POST /patients (with BenefitsAdministrator)"
      - "every GET listed in §1.5 that includes StoreOptician"
      - "POST /_clock/set_current_utc"
  - name: Prescriber
    identity: "X-User-ID must equal the Prescriber.id of the prescription being attested."
    description: "External prescribing eye-care professional; may only self-attest to their own prescriptions."
    exclusive_operations:
      - "POST /prescriptions/{id}/prescriber-attest"
    shared_operations:
      - "GET /prescribers/{id}, GET /prescribers, GET /prescriptions/{id}, GET /prescriptions, GET /rx-orders/{id}"
      - "POST /_clock/set_current_utc"
  - name: LabTechnician
    identity: "X-User-ID is recorded on LabOperation.performed_by_user_id when an operation starts."
    description: "Surfacing and finishing operator: job creation, operation booking and execution, release."
    exclusive_operations:
      - "POST /lab-jobs"
      - "POST /lab-jobs/{id}/release"
      - "POST /lab-operations"
      - "POST /lab-operations/{id}/start"
      - "POST /lab-operations/{id}/complete"
      - "POST /lab-operations/{id}/report-breakage"
      - "POST /lab-operations/{id}/cancel"
    shared_operations:
      - "every GET listed in §1.5 that includes LabTechnician"
      - "POST /_clock/set_current_utc"
  - name: QualityInspector
    identity: "X-User-ID is recorded on QualityInspection.inspector_user_id and is checked against every COMPLETED operation's operator."
    description: "Independent inspector who judges each eye against the effective tolerance standard."
    exclusive_operations:
      - "POST /quality-inspections"
    shared_operations:
      - "every GET listed in §1.5 that includes QualityInspector"
      - "POST /_clock/set_current_utc"
  - name: LabManager
    identity: "X-User-ID is the manager's user id and is checked against the inspector of a case being adjudicated."
    description: "Lab configuration and remake adjudication: designs, tolerance standards, blanks, machines, bays, prescriber standing, responsibility assignment."
    exclusive_operations:
      - "POST /lens-designs"
      - "POST /tolerance-standards"
      - "POST /lens-blank-lots"
      - "POST /lens-blank-lots/{id}/replenish"
      - "POST /lab-machines"
      - "PATCH /lab-machines/{id}/status"
      - "POST /finishing-bays"
      - "PATCH /finishing-bays/{id}/status"
      - "PATCH /prescribers/{id}/status"
      - "POST /remake-cases/{id}/adjudicate"
      - "POST /remake-cases/{id}/close"
    shared_operations:
      - "POST /prescribers (with StoreOptician)"
      - "every GET listed in §1.5 that includes LabManager"
      - "POST /_clock/set_current_utc"
  - name: BenefitsAdministrator
    identity: "X-User-ID is the benefits administrator's user id."
    description: "Insurance plan configuration and benefit adjudication on the order."
    exclusive_operations:
      - "POST /insurance-plans"
      - "POST /rx-orders/{id}/benefit-application"
      - "POST /rx-orders/{id}/benefit-void"
    shared_operations:
      - "POST /patients (with StoreOptician)"
      - "every GET listed in §1.5 that includes BenefitsAdministrator"
      - "POST /_clock/set_current_utc"




