              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { tx_id: $.data.id }
            - call: "POST /state-spec-profiles/${tx_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /dealers"
              payload: { dealer_code: "D-TX", dealer_name: "Lone Star Bus Sales", licensed_state_codes: ["TX"], training_capacity_per_month: 12 }
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { dealer_tx_id: $.data.id }
            - call: "POST /dealers/${dealer_tx_id}/legacy-fleet-records"
              payload: { bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", spec_profile_id: "${tx_id}", vin: "1TXDSL0000000801", delivered_at: "2026-05-10" }
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { legacy_1_id: $.data.id }
            - call: "POST /dealers/${dealer_tx_id}/legacy-fleet-records"
              payload: { bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", spec_profile_id: "${tx_id}", vin: "1TXDSL0000000802", delivered_at: "2026-06-02" }
