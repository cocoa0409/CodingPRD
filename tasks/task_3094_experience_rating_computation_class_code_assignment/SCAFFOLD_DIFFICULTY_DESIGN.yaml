        grounds:
          - state_machines.AssignedRiskEnrollment.ACTIVE_to_EXITED
          - state_machines.AssignedRiskTakeOut.PENDING_to_APPROVED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: approving the take-out
          flips the enrollment to EXITED with exit_reason TAKE_OUT, and that
          transition releases the 500,000-cent hold on the pool carrier's
          assigned_risk_current_load_cents, returning it from 500,000 to 0.
        test_recipe:
          setup:
            - "Bureau defaults; employer C; carrier1 quota 10,000,000 with one ACTIVE enrollment of 500,000 (load 500,000); voluntary carrier2."
            - "Take-out filed against the enrollment with exit_date 2026-07-01."
          setup_api_calls:
