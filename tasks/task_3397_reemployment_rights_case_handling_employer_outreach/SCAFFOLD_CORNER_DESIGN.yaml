  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_assign_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[case-assign-stale-version]
          - errors.ERR_STALE_CASE_VERSION
        distinguishing_aspect: "Assignment is OCC-guarded on ReemploymentCase.version: a first assign at version 2 succeeds and bumps the case to 3; a second assign carrying the stale expected_case_version 2 fails 412 ERR_STALE_CASE_VERSION even though the case is in a reassignable state."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. TRIAGE case at version 2; certified ombudsman."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_omb
            - *c_tra
            - *c_trb
            - *c_trc
            - *c_cert
            - *c_mem
            - *c_case
            - *c_triage
          trigger:
            - call: "POST /reemployment/cases/${case_id}/assign"
              payload: { ombudsman_id: "${omb_id}", expected_case_version: "${case_vt}" }
              as: ProgramCoordinator
            - call: "POST /reemployment/cases/${case_id}/assign"
              payload: { ombudsman_id: "${omb_id}", expected_case_version: "${case_vt}" }
              as: ProgramCoordinator
              captures: { err_occ: $.data.error_id }
            - call: "GET /reemployment/cases/${case_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { case_v3: $.data.version }
            - call: "POST /reemployment/cases/${case_id}/assign"
              payload: { ombudsman_id: "${omb_id}", expected_case_version: "${case_v3}" }
              as: ProgramCoordinator
          assert:
            - "the first assign returns 200 (case_vt == 2 at that point)"
            - "the replayed assign with the same expected_case_version returns 412 and err_occ == ERR_STALE_CASE_VERSION"
            - "case_v3 == 3, and a reassign carrying the fresh version succeeds (200)"
            - "Ombudsman.${omb_id}.active_caseload == 1 throughout (reassignment to the same ombudsman nets zero)"

      - name: occ_stale_version_on_analysis_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[case-analysis-stale-version]
          - errors.ERR_STALE_CASE_VERSION
        distinguishing_aspect: "Analysis creation is OCC-guarded on the case version because a new analysis supersedes the old: the STRICT run at version 1 succeeds and bumps the case to 2; a LENIENT run still carrying version 1 fails 412 ERR_STALE_CASE_VERSION."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer; member with one completed 45-day period (notice 216h); REEMPLOYMENT case applied 2026-04-20."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_mem
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", start_date: "2026-03-01T00:00:00Z", end_date: "2026-04-15T00:00:00Z", orders_type: "ACTIVE_DUTY", notice_given_at: "2026-02-20T00:00:00Z" }
              as: ServiceMember
              as_user_id: "${mem_id}"
            - *c_case
          trigger:
            - call: "POST /reemployment/cases/${case_id}/eligibility-analysis"
              payload: { variant: "STRICT", expected_case_version: "${case_v}" }
              as: ProgramCoordinator
            - call: "POST /reemployment/cases/${case_id}/eligibility-analysis"
              payload: { variant: "LENIENT", expected_case_version: "${case_v}" }
              as: ProgramCoordinator
              captures: { err_occ2: $.data.error_id }
          assert:
            - "the first analysis returns 201 (case version 1 at that point)"
            - "the second analysis with the stale version returns 412 and err_occ2 == ERR_STALE_CASE_VERSION"
            - "GET /reemployment/cases/${case_id}/eligibility-analyses returns exactly 1 row"

      - name: duration_band_30_vs_31_days_flips_deadline_and_escalator
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.application_deadline_window
        distinguishing_aspect: "One service day flips the band: 30 days is SHORT (1-day deadline, SAME_POSITION) while 31 days is MID (14-day deadline, SENIORITY_ESCALATED); applications exactly at those deadlines satisfy them (inclusive)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One employer; member A with a 30-day period (applied on the 1-day deadline), member B with a 31-day period (applied on the 14-day deadline)."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_mem
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T00:00:00Z", orders_type: "DRILL", notice_given_at: "2025-12-20T00:00:00Z" }
              as: ServiceMember
              as_user_id: "${mem_id}"
            - call: "POST /reemployment/cases"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", issue_type: "REEMPLOYMENT", description: "30-day band", application_submitted_at: "2026-02-01T00:00:00Z" }
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { ca30_id: $.data.id, ca30_v: $.data.version }
            - call: "POST /reemployment/members"
              payload: { full_name: "B B", email: "bb@example.com", branch: "NAVY", component: "NAVY_RESERVE" }
              as: Anonymous
              captures: { memb_id: $.data.id }
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${memb_id}", employer_id: "${emp_id}", start_date: "2026-01-01T00:00:00Z", end_date: "2026-02-01T00:00:00Z", orders_type: "DRILL", notice_given_at: "2025-12-20T00:00:00Z" }
              as: ServiceMember
              as_user_id: "${memb_id}"
            - call: "POST /reemployment/cases"
              payload: { member_id: "${memb_id}", employer_id: "${emp_id}", issue_type: "REEMPLOYMENT", description: "31-day band", application_submitted_at: "2026-02-15T00:00:00Z" }
              as: ServiceMember
              as_user_id: "${memb_id}"
              captures: { cb31_id: $.data.id, cb31_v: $.data.version }
          trigger:
            - call: "POST /reemployment/cases/${ca30_id}/eligibility-analysis"
              payload: { variant: "STRICT", expected_case_version: "${ca30_v}" }
              as: ProgramCoordinator
            - call: "POST /reemployment/cases/${cb31_id}/eligibility-analysis"
              payload: { variant: "STRICT", expected_case_version: "${cb31_v}" }
              as: ProgramCoordinator
          assert:
            - "member A: duration_band == SHORT, application_deadline_days == 1, application_deadline_date == 2026-02-01T00:00:00Z, escalator_position_class == SAME_POSITION"
            - "member B: duration_band == MID, application_deadline_days == 14, application_deadline_date == 2026-02-15T00:00:00Z, escalator_position_class == SENIORITY_ESCALATED"
            - "both deadline_satisfied == true (applications exactly at the deadline are timely) and both overall_eligible == true"

      - name: cascade_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: decertify_reverts_cases_rounds_notes
          rationale: "Depth-3 cascade asserted there; referral_submit_refers_case_and_moots_round covers the second cascade."

      - name: dual_variant_calculations_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: notice_excuse_strict_vs_lenient_eligibility
          rationale: "Variant divergence asserted there and in pension_credit_per_period_vs_aggregate_rounding."

      - name: cap_threshold_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds: [calculations.cumulative_chargeable_service_days]
        excluded_because:
          difficulty_instance: service_cap_1825_exactly_eligible
          rationale: "1825/1826 boundary asserted there; the caseload threshold is asserted in caseload_exactly_four_blocks_assign."

  - section: consistency_model
    instances:
      - name: immediate_visibility_after_create_and_error_envelope_shape
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
        distinguishing_aspect: "The create response and an immediate re-read agree exactly (immediate consistency), and a failure carries the fixed error envelope: response_type error with data.error_id and data.message plus meta.api_request_id."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer and member."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_mem
            - *c_case
          trigger:
            - call: "GET /reemployment/cases/${case_id}"
              payload: {}
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { reread_status: $.data.status }
            - call: "GET /reemployment/cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramCoordinator
              captures: { err_shape: $.data.error_id }
          assert:
            - "reread_status == INTAKE, identical to the create response with no delay or staleness"
            - "the error response has response_type error, err_shape == ERR_CASE_NOT_FOUND, a non-empty data.message, and meta.api_request_id present"
