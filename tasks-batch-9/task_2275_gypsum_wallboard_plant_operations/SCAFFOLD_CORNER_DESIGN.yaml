            - "${err_plant} == ERR_INVALID_REQUEST and ${err_spec} == ERR_INVALID_REQUEST"
            - "GET /plant-ops/plants returns total_count == 1"
            - "GET /plant-ops/product-specs?plant_id=${plant_id} returns total_count == 1"

      - name: create_product_spec_under_unknown_plant_returns_plant_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ProductSpec.fields.plant_id
          - errors[ERR_PLANT_NOT_FOUND]
          - endpoints[POST /plant-ops/plants/{plantId}/product-specs]
        distinguishing_aspect: |
          The SKU is addressed under its plant, so an unknown {plantId} path segment returns
          ERR_PLANT_NOT_FOUND (404) — not ERR_REFERENCE_NOT_FOUND, which is reserved for
          body-supplied foreign keys.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /plant-ops/plants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/product-specs"
              payload: { sku_code: "REG-050-4X12", thickness_in: 0.5, board_type: "REGULAR", fire_rated: false, board_width_in: 48.0, board_length_ft: 12.0, target_board_weight_lb_per_msf: 1600.0, stucco_lb_per_msf: 1350.0, slurry_water_stucco_ratio: 0.75, line_speed_max_fpm: 480, paper_tension_min_lb: 28.0, paper_tension_max_lb: 46.0, core_hardness_min_lbf: 15.0, nail_pull_min_lbf: 77.0, flexural_cross_min_lbf: 36.0, max_boards_per_bundle: 48, changeover_family: "STANDARD" }
              as: PlantAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 404 and ${err_id} == ERR_PLANT_NOT_FOUND"

      - name: feed_naming_a_lot_from_another_plant_returns_plant_scope_mismatch
        claim_type: cross_reference_integrity
        grounds:
          - errors[ERR_PLANT_SCOPE_MISMATCH]
          - state_machines.CalcinerBatch.status.PLANNED_to_FEEDING
          - endpoints[POST /plant-ops/calciner-batches/{batchId}/feeds]
        distinguishing_aspect: |
          The flat topology is held together by FK scope checks: an APPROVED lot belonging to plant B
          fed into a batch of plant A returns ERR_PLANT_SCOPE_MISMATCH (409) even though both rows
          exist and the lot is APPROVED with ample tonnage, and the batch stays PLANNED.
        test_recipe:
          setup:
            - "Plant GYP-1 with batch B1 PLANNED and no feeds."
            - "A second plant GYP-2 with its own APPROVED 100.000 t synthetic lot."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 80.000, calcination_temp_f: 320.0, feed_rate_tph: 25.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T12:00:00Z" }
              as: MaterialsController
              captures: { b1_id: $.data.id }
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-2", name: "Platte Valley Wallboard", calciner_capacity_tph: 45, stucco_silo_capacity_tons: 900, energy_price_per_mmbtu: 3.80, contribution_margin_per_msf: 41.25 }
              as: PlantAdmin
              captures: { plant2_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant2_id}", source_type: "SYNTHETIC", supplier_name: "Pawnee FGD", received_tons: 100.000, declared_free_moisture_pct: 10.00, declared_purity_pct: 90.0 }
              as: MaterialsController
              captures: { lot_x_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_x_id}/assay"
              payload: { free_moisture_pct: 10.00, purity_pct: 90.0, chloride_ppm: 100 }
              as: MaterialsController
              captures: { lot_x_v: $.data.version }
          trigger:
            - call: "POST /plant-ops/calciner-batches/${b1_id}/feeds"
              payload: { lot_id: "${lot_x_id}", tons_fed: 50.000, measured_free_moisture_pct: 10.00, expected_lot_version: "${lot_x_v}" }
              as: MaterialsController
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 409 and ${err_id} == ERR_PLANT_SCOPE_MISMATCH"
            - "CalcinerBatch.${b1_id}.status == PLANNED and feed_tons_total == 0.000"
            - "GypsumLot.${lot_x_id}.status == APPROVED with consumed_tons == 0.000 and remaining_tons == 100.000"
            - "GET /plant-ops/batch-feeds?batch_id=${b1_id} returns total_count == 0"

  - section: state_machines
    instances:

      - name: new_calciner_batch_starts_planned_with_pending_flag
        claim_type: initial_state
        grounds:
          - state_machines.CalcinerBatch.status
          - entities.CalcinerBatch
        distinguishing_aspect: |
          A freshly created batch enters PLANNED with every accumulator zeroed and quality_flag PENDING;
          no other status is reachable at creation even though the feed window already lies in the past
          or the future relative to the logical clock.
        test_recipe:
          setup:
            - "Plant GYP-1; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 80.000, calcination_temp_f: 320.0, feed_rate_tph: 25.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T12:00:00Z" }
              as: MaterialsController
              captures: { b_id: $.data.id }
          assert:
            - "response status == 201"
            - "CalcinerBatch.${b_id}.status == PLANNED and quality_flag == PENDING"
            - "CalcinerBatch.${b_id}.feed_tons_total == 0.000, feed_moisture_weighted_pct == null, feed_purity_weighted_pct == null"
            - "CalcinerBatch.${b_id}.stucco_yield_planned_tons == 0.000 and stucco_yield_actual_tons == 0.000"
            - "CalcinerBatch.${b_id}.sample_count == 0 and version == 1"
            - "Plant.${plant_id}.stucco_on_hand_tons == 0.000 (a PLANNED batch credits nothing)"

      - name: outage_lifecycle_propose_approve_start_close_walks_all_transitions
        claim_type: valid_transition
        grounds:
          - state_machines.MaintenanceOutage.status
          - state_machines.BoardLine.status
          - calculations.outage_seasonality_gate
        distinguishing_aspect: |
          The happy path PROPOSED -> APPROVED -> IN_PROGRESS -> CLOSED runs end to end on an October
          window (seasonality_index 0.90, exactly at the favourable ceiling), and each hop moves the
          line through AVAILABLE -> MAINTENANCE_SCHEDULED -> DOWN -> AVAILABLE, with the plant posture
          frozen only for the IN_PROGRESS leg.
        test_recipe:
          setup:
            - "Plant GYP-1 with LINE-1 AVAILABLE and no production runs at all."
            - "Logical clock advanced to 2026-10-05T06:00:00Z only after the outage is approved."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/board-lines"
              payload: { designation: "LINE-1", max_speed_fpm: 500, web_width_in: 54.0 }
              as: PlantAdmin
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /plant-ops/maintenance-outages"
              payload: { line_id: "${line_id}", outage_type: "PLANNED", window_start: "2026-10-05T06:00:00Z", window_end: "2026-10-07T06:00:00Z", scope_note: "kiln burner rebuild" }
              as: MaintenancePlanner
              as_user_id: "u_planner"
              captures: { outage_id: $.data.id }
            - call: "POST /plant-ops/maintenance-outages/${outage_id}/approve"
              payload: {}
              as: PlantManager
              as_user_id: "u_mgr"
            - call: "POST /plant-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T06:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant-ops/maintenance-outages/${outage_id}/start"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "u_planner"
            - call: "POST /plant-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-07T06:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant-ops/maintenance-outages/${outage_id}/close"
              payload: { close_note: "burner and drive replaced" }
              as: MaintenancePlanner
              as_user_id: "u_planner"
          assert:
            - "after propose: MaintenanceOutage.${outage_id}.status == PROPOSED, seasonality_index == 0.90, planned_downtime_hours == 48.00, at_risk_msf == 0.000, opportunity_cost_usd == 0.00, deferral_count == 0, BoardLine.${line_id}.status == AVAILABLE"
            - "after approve: status == APPROVED, approved_by_user_id == 'u_mgr', BoardLine.${line_id}.status == MAINTENANCE_SCHEDULED"
            - "after start: status == IN_PROGRESS, BoardLine.${line_id}.status == DOWN, Plant.${plant_id}.production_posture == FROZEN"
            - "after close: status == CLOSED, close_note == 'burner and drive replaced', BoardLine.${line_id}.status == AVAILABLE, Plant.${plant_id}.production_posture re-derived to RESTRICTED (silo empty)"
            - "every hop incremented MaintenanceOutage.${outage_id}.version, ending at version 4"

      - name: feed_after_close_feed_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.CalcinerBatch.status.FEEDING_to_CALCINING
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Once close-feed has moved the batch to CALCINING the feed transition is no longer declared,
          so an otherwise perfect feed (APPROVED lot, fresh version, tonnage available) returns
          ERR_INVALID_STATE (409) and neither the batch accumulators nor the lot balance move.
        test_recipe:
          setup:
            - "Plant GYP-1; 100.000 t lot assayed and 100.000 t fed into batch BM; close-feed already called, so BM is CALCINING with planned yield 77.340."
            - "A second APPROVED 50.000 t lot is on hand so tonnage is never the binding constraint."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Pawnee FGD", received_tons: 100.000, declared_free_moisture_pct: 10.00, declared_purity_pct: 90.0 }
              as: MaterialsController
              captures: { lot_m_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_m_id}/assay"
              payload: { free_moisture_pct: 10.00, purity_pct: 90.0, chloride_ppm: 100 }
              as: MaterialsController
              captures: { lot_m_v: $.data.version }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 80.000, calcination_temp_f: 320.0, feed_rate_tph: 25.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T12:00:00Z" }
              as: MaterialsController
              captures: { bm_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches/${bm_id}/feeds"
              payload: { lot_id: "${lot_m_id}", tons_fed: 100.000, measured_free_moisture_pct: 10.00, expected_lot_version: "${lot_m_v}" }
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${bm_id}/close-feed"
              payload: {}
              as: MaterialsController
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "NATURAL", supplier_name: "Loveland Quarry", received_tons: 50.000, declared_free_moisture_pct: 2.80, declared_purity_pct: 91.5 }
              as: MaterialsController
              captures: { lot_n_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_n_id}/assay"
              payload: { free_moisture_pct: 2.60, purity_pct: 91.5, chloride_ppm: 80 }
              as: MaterialsController
              captures: { lot_n_v: $.data.version }
          trigger:
            - call: "POST /plant-ops/calciner-batches/${bm_id}/feeds"
              payload: { lot_id: "${lot_n_id}", tons_fed: 20.000, measured_free_moisture_pct: 2.60, expected_lot_version: "${lot_n_v}" }
              as: MaterialsController
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 409 and ${err_id} == ERR_INVALID_STATE"
            - "CalcinerBatch.${bm_id}.status == CALCINING with feed_tons_total == 100.000 and stucco_yield_planned_tons == 77.340"
            - "GypsumLot.${lot_n_id}.consumed_tons == 0.000 and remaining_tons == 50.000 and status == APPROVED"
            - "GET /plant-ops/batch-feeds?batch_id=${bm_id} returns total_count == 1"

      - name: second_close_feed_returns_invalid_state_without_recomputing
        claim_type: idempotency
        grounds:
          - state_machines.CalcinerBatch.status.FEEDING_to_CALCINING
          - errors[ERR_INVALID_STATE]
          - calculations.stucco_yield_tons
        distinguishing_aspect: |
          close-feed is not idempotent-by-replay: the second call is rejected with ERR_INVALID_STATE
          rather than silently re-stamping the planned yield, so stucco_yield_planned_tons stays
          77.340 and the batch version does not advance a second time.
        test_recipe:
          setup:
            - "Plant GYP-1; batch BM fed once with 100.000 t and closed, so status is CALCINING at version 3."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Pawnee FGD", received_tons: 100.000, declared_free_moisture_pct: 10.00, declared_purity_pct: 90.0 }
              as: MaterialsController
              captures: { lot_m_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_m_id}/assay"
              payload: { free_moisture_pct: 10.00, purity_pct: 90.0, chloride_ppm: 100 }
              as: MaterialsController
              captures: { lot_m_v: $.data.version }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 80.000, calcination_temp_f: 320.0, feed_rate_tph: 25.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T12:00:00Z" }
              as: MaterialsController
              captures: { bm_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches/${bm_id}/feeds"
              payload: { lot_id: "${lot_m_id}", tons_fed: 100.000, measured_free_moisture_pct: 10.00, expected_lot_version: "${lot_m_v}" }
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${bm_id}/close-feed"
              payload: {}
              as: MaterialsController
          trigger:
            - call: "POST /plant-ops/calciner-batches/${bm_id}/close-feed"
              payload: {}
              as: MaterialsController
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 409 and ${err_id} == ERR_INVALID_STATE"
            - "CalcinerBatch.${bm_id}.status == CALCINING and stucco_yield_planned_tons == 77.340"
            - "CalcinerBatch.${bm_id}.feed_moisture_weighted_pct == 10.00 and feed_purity_weighted_pct == 90.00"
            - "CalcinerBatch.${bm_id}.version is unchanged by the rejected call"

      - name: start_run_before_window_returns_run_window_not_started
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ProductionRun.status.SCHEDULED_to_RUNNING
          - errors[ERR_RUN_WINDOW_NOT_STARTED]
        distinguishing_aspect: |
          A SCHEDULED run whose every other precondition is met still cannot start while the logical
          clock sits one second before window_start: ERR_RUN_WINDOW_NOT_STARTED (409) fires, and
          advancing the clock by that one second lets the same call through.
        test_recipe:
