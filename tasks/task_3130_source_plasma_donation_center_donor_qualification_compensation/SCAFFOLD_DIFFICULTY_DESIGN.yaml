# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 3130: Source Plasma Donation Center (donor qualification & compensation)
# Difficulty instruction at generation time: "Generate task much harder than expert level!"
# => 3 instances per rule (27 total), exceeding the §0.5 minimum of 2 per rule.
# All setup chains drive empty-DB -> precondition state using only §1.5 endpoints.
# Logical clock default is 2026-09-01T00:00:00Z; every chain sets it explicitly.
scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — dual_variant_calc: two calculations with two valid variants
  # producing different results, on DIFFERENT entity domains.
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: promo_optimistic_vs_pessimistic_variant_divergence
        grounds:
          - calculations.promo_compensation_cents
          - entities.CompensationPayment.fields.promo_cents
          - entities.CompensationPayment.fields.variant
        distinguishing_aspect: |
          Entity domain = CompensationPayment (fiscal). The PROVISIONAL variant is
          OPTIMISTIC (assumes the qualifying count will be reached: promo_cents == 2000
          at check-in of the donor's 2nd in-window visit), while the FINAL variant is
          PESSIMISTIC (requires actual completions): when the visit aborts before any
          collection, promo_cents collapses to 0 and net_cents goes 4500 -> 0 on the
          SAME visit with NO input change — the divergence is purely variant-driven.
        test_recipe:
          setup:
            - "Center with schedule (first=3000, second=2500, subsequent=2000, promo_code=OCTBOOST, promo_bonus_cents=2000, promo_qualifying_donation_count=2, window 2026-08-01..2026-12-01)"
            - "Donor (weight 72.5 kg) with one COMPLETED donation on 2026-09-01 (final net 3000, promo 0 because window count 1 < 2)"
            - "Second donation visit checked in on 2026-09-04 (IN_PROGRESS); its payment is PROVISIONAL with promo_cents=2000, net_cents=4500"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plasma-centers"
              payload: { center_code: "CSL-DAL-014", legal_name: "CSL Plasma Dallas 014", state_code: "TX", screening_lanes: 2, donor_floor_beds: 2, observation_chairs: 2 }
              as: PlatformAdmin
              captures: { c: $.data.id, cv: $.data.version }
            - call: "POST /plasma-centers/${c}/compensation-schedules"
              payload: { effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", base_cents_first_donation: 3000, base_cents_second_donation: 2500, base_cents_subsequent_donation: 2000, promo_code: "OCTBOOST", promo_bonus_cents: 2000, promo_qualifying_donation_count: 2, expected_center_version: "${cv}" }
              as: PlatformAdmin
            - call: "POST /donors"
              payload: { external_donor_ref: "DL-TX-000001", legal_first_name: "Jane", legal_last_name: "Doe", date_of_birth: "1990-04-12", weight_kg: 72.5, home_center_id: "${c}" }
              as: Recorder
              captures: { d: $.data.id }
            - call: "POST /donors/${d}/screening-visits"
              payload: { center_id: "${c}", scheduled_for: "2026-09-01T08:00:00Z" }
              as: Recorder
              captures: { s1: $.data.id }
            - call: "POST /screening-visits/${s1}/sub-records"
              payload: { record_type: "IDENTITY", payload: { document_number: "TXDL-883491" } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${s1}/sub-records"
              payload: { record_type: "HEALTH_HISTORY", payload: { risk_flags: [] } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${s1}/sub-records"
              payload: { record_type: "PHYSICAL_EXAM", payload: { weight_kg: 72.5, pulse_bpm: 72, systolic_mmhg: 118, diastolic_mmhg: 76, temperature_c: 36.7, hematocrit_pct: 43.0, total_protein_g_dl: 7.2 } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${s1}/sub-records"
              payload: { record_type: "VIRAL_MARKER", payload: { hiv_ag_ab: "NON_REACTIVE", hbv_surface_ag: "NON_REACTIVE", hcv_ab: "NON_REACTIVE" } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${s1}/clear"
              payload: {}
              as: MedicalScreener
              as_user_id: "ms-01"
            - call: "POST /donors/${d}/donation-visits"
              payload: { center_id: "${c}", screening_visit_id: "${s1}", scheduled_for: "2026-09-01T09:30:00Z" }
              as: Phlebotomist
              captures: { dv1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /donation-visits/${dv1}/check-in"
              payload: {}
              as: Phlebotomist
            - call: "POST /donation-visits/${dv1}/complete-collection"
              payload: { actual_volume_ml: 690 }
              as: Phlebotomist
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:46:00Z" }
              as: PlatformAdmin
            - call: "POST /donation-visits/${dv1}/discharge"
              payload: {}
              as: Phlebotomist
            - call: "POST /donors/${d}/screening-visits"
              payload: { center_id: "${c}", scheduled_for: "2026-09-04T08:00:00Z" }
              as: Recorder
              captures: { s2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /screening-visits/${s2}/sub-records"
              payload: { record_type: "IDENTITY", payload: { document_number: "TXDL-883491" } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${s2}/sub-records"
              payload: { record_type: "HEALTH_HISTORY", payload: { risk_flags: [] } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${s2}/sub-records"
              payload: { record_type: "PHYSICAL_EXAM", payload: { weight_kg: 72.5, pulse_bpm: 72, systolic_mmhg: 118, diastolic_mmhg: 76, temperature_c: 36.7, hematocrit_pct: 43.0, total_protein_g_dl: 7.2 } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${s2}/sub-records"
              payload: { record_type: "VIRAL_MARKER", payload: { hiv_ag_ab: "NON_REACTIVE", hbv_surface_ag: "NON_REACTIVE", hcv_ab: "NON_REACTIVE" } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${s2}/clear"
              payload: {}
              as: MedicalScreener
              as_user_id: "ms-01"
            - call: "POST /donors/${d}/donation-visits"
              payload: { center_id: "${c}", screening_visit_id: "${s2}", scheduled_for: "2026-09-04T09:30:00Z" }
              as: Phlebotomist
              captures: { dv2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T09:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /donation-visits/${dv2}/check-in"
              payload: {}
              as: Phlebotomist
            - call: "GET /donation-visits/${dv2}/compensation-payment"
              as: PlatformAdmin
              captures: { prov_promo: "$.data[0].promo_cents", prov_net: "$.data[0].net_cents", prov_variant: "$.data[0].variant", prov_status: "$.data[0].payment_status" }
            - call: "POST /donation-visits/${dv2}/adverse-reactions"
              payload: { severity: "MILD", reaction_code: "VASOVAGAL", observed_at: "2026-09-04T09:35:00Z", notes: "mild vasovagal before needle insert" }
              as: Phlebotomist
            - call: "GET /donation-visits/${dv2}/compensation-payment"
              as: PlatformAdmin
              captures: { fin_promo: "$.data[0].promo_cents", fin_net: "$.data[0].net_cents", fin_variant: "$.data[0].variant", fin_status: "$.data[0].payment_status" }
          assert:
            - "provisional variant: ${prov_variant} == PROVISIONAL and ${prov_status} == PROVISIONAL"
            - "provisional promo OPTIMISTIC: ${prov_promo} == 2000 (window excl. this visit = 1, +1 = 2 >= qualifying count 2, no prior FINALIZED promo)"
            - "provisional net: ${prov_net} == 4500 (base 2500 second-donation + promo 2000)"
            - "after abort before any collection (actual_volume_ml null): ${fin_variant} == FINAL, ${fin_status} == FINALIZED"
            - "final promo PESSIMISTIC: ${fin_promo} == 0 (aborted visit never COMPLETED; promo ALWAYS 0 for aborted visits)"
            - "final net: ${fin_net} == 0 — identical visit data, variant switch alone moved net_cents 4500 -> 0"

      - name: plasma_volume_snapshot_vs_live_weight_divergence
        grounds:
          - calculations.plasma_volume_ml
          - entities.DonationVisit.fields.programmed_volume_ml
          - entities.Donor.fields.weight_kg
        distinguishing_aspect: |
          Entity domain = DonationVisit/Donor clinical volume (NOT compensation). The
          programmed_at_check_in variant is a frozen snapshot (690 mL for 72.5 kg at
          check-in) while the hypothetical_at_read variant recomputes live from
          Donor.weight_kg; after a later PHYSICAL_EXAM refreshes weight to 80.0 kg the
          live band is 825 mL — the stored snapshot stays 690 mL on identical current
          donor state, which is exactly the dual-variant divergence §0.5 requires.
        test_recipe:
          setup:
            - "Center with schedule; donor with screening s1 (exam weight 72.5) cleared and donation dv1 checked in at 2026-09-01T09:30 -> programmed_volume_ml frozen at 690"
            - "Second screening s2 for the same donor cleared on 2026-09-04 with PHYSICAL_EXAM weight_kg 80.0 -> Donor.weight_kg refreshed to 80.0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plasma-centers"
              payload: { center_code: "CSL-DAL-014", legal_name: "CSL Plasma Dallas 014", state_code: "TX", screening_lanes: 2, donor_floor_beds: 2, observation_chairs: 2 }
              as: PlatformAdmin
              captures: { c: $.data.id, cv: $.data.version }
            - call: "POST /plasma-centers/${c}/compensation-schedules"
              payload: { effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", base_cents_first_donation: 3000, base_cents_second_donation: 2500, base_cents_subsequent_donation: 2000, expected_center_version: "${cv}" }
              as: PlatformAdmin
            - call: "POST /donors"
              payload: { external_donor_ref: "DL-TX-000001", legal_first_name: "Jane", legal_last_name: "Doe", date_of_birth: "1990-04-12", weight_kg: 72.5, home_center_id: "${c}" }
              as: Recorder
              captures: { d: $.data.id }
            - call: "POST /donors/${d}/screening-visits"
              payload: { center_id: "${c}", scheduled_for: "2026-09-01T08:00:00Z" }
              as: Recorder
              captures: { s1: $.data.id }
            - call: "POST /screening-visits/${s1}/sub-records"
              payload: { record_type: "IDENTITY", payload: { document_number: "TXDL-883491" } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${s1}/sub-records"
              payload: { record_type: "HEALTH_HISTORY", payload: { risk_flags: [] } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${s1}/sub-records"
              payload: { record_type: "PHYSICAL_EXAM", payload: { weight_kg: 72.5, pulse_bpm: 72, systolic_mmhg: 118, diastolic_mmhg: 76, temperature_c: 36.7, hematocrit_pct: 43.0, total_protein_g_dl: 7.2 } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${s1}/sub-records"
              payload: { record_type: "VIRAL_MARKER", payload: { hiv_ag_ab: "NON_REACTIVE", hbv_surface_ag: "NON_REACTIVE", hcv_ab: "NON_REACTIVE" } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${s1}/clear"
              payload: {}
              as: MedicalScreener
              as_user_id: "ms-01"
            - call: "POST /donors/${d}/donation-visits"
              payload: { center_id: "${c}", screening_visit_id: "${s1}", scheduled_for: "2026-09-01T09:30:00Z" }
              as: Phlebotomist
              captures: { dv1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /donation-visits/${dv1}/check-in"
              payload: {}
              as: Phlebotomist
              captures: { prog: $.data.programmed_volume_ml }
            - call: "POST /donors/${d}/screening-visits"
              payload: { center_id: "${c}", scheduled_for: "2026-09-04T08:00:00Z" }
              as: Recorder
              captures: { s2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /screening-visits/${s2}/sub-records"
              payload: { record_type: "IDENTITY", payload: { document_number: "TXDL-883491" } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${s2}/sub-records"
              payload: { record_type: "PHYSICAL_EXAM", payload: { weight_kg: 80.0, pulse_bpm: 72, systolic_mmhg: 118, diastolic_mmhg: 76, temperature_c: 36.7, hematocrit_pct: 43.0, total_protein_g_dl: 7.2 } }
              as: Recorder
              as_user_id: "rec-01"
          trigger:
            - call: "GET /donation-visits/${dv1}"
              as: PlatformAdmin
              captures: { prog_after: $.data.programmed_volume_ml, dv1_status: $.data.visit_status }
            - call: "GET /donors/${d}"
              as: PlatformAdmin
              captures: { w_now: $.data.weight_kg }
          assert:
            - "snapshot at check-in: ${prog} == 690 (72.5 kg in [68.0, 79.0) band)"
            - "snapshot is frozen: ${prog_after} == 690 even though the donor was re-weighed afterwards"
            - "live weight moved: ${w_now} == 80.0"
            - "hypothetical_at_read variant per plasma_volume_ml on current weight 80.0 kg yields 825 mL (79.0 <= 80.0 < 110.0) != stored 690 mL"
            - "dv1 unaffected otherwise: ${dv1_status} == IN_PROGRESS"

      - name: base_compensation_provisional_vs_final_cross_visit_divergence
        grounds:
          - calculations.base_compensation_cents
          - entities.CompensationPayment.fields.base_cents
          - state_machines.DonationVisit.OBSERVATION_to_COMPLETED
        distinguishing_aspect: |
          Entity domain = CompensationPayment base rate (fiscal, distinct from the promo
          component in instance 1). For the SAME visit A, the PROVISIONAL base is computed
          at check-in with ordinal 0 (base_cents_first_donation = 3000) but a different
          visit B of the same donor COMPLETES in between, so A's FINAL recomputation sees
          one prior monthly completion and drops to base_cents_second_donation = 2500 —
          provisional != final for identical visit-A inputs because the ordinal input set
          shifted under the cross-visit race the scaffold pins in the variant text.
        test_recipe:
          setup:
            - "Center (2 beds, 2 chairs) with schedule first=3000, second=2500, subsequent=2000, no promo"
            - "Donor with two cleared screenings sA and sB and two SCHEDULED donation visits dvA (09:30) and dvB (10:00)"
            - "dvA checked in at 09:30 (bed 0, PROVISIONAL base 3000); dvB checked in at 10:00 (bed 1, PROVISIONAL base 3000)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plasma-centers"
              payload: { center_code: "CSL-DAL-014", legal_name: "CSL Plasma Dallas 014", state_code: "TX", screening_lanes: 2, donor_floor_beds: 2, observation_chairs: 2 }
              as: PlatformAdmin
              captures: { c: $.data.id, cv: $.data.version }
            - call: "POST /plasma-centers/${c}/compensation-schedules"
              payload: { effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", base_cents_first_donation: 3000, base_cents_second_donation: 2500, base_cents_subsequent_donation: 2000, expected_center_version: "${cv}" }
              as: PlatformAdmin
            - call: "POST /donors"
              payload: { external_donor_ref: "DL-TX-000001", legal_first_name: "Jane", legal_last_name: "Doe", date_of_birth: "1990-04-12", weight_kg: 72.5, home_center_id: "${c}" }
              as: Recorder
              captures: { d: $.data.id }
            - call: "POST /donors/${d}/screening-visits"
              payload: { center_id: "${c}", scheduled_for: "2026-09-01T08:00:00Z" }
              as: Recorder
              captures: { sA: $.data.id }
            - call: "POST /screening-visits/${sA}/sub-records"
              payload: { record_type: "IDENTITY", payload: { document_number: "TXDL-883491" } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${sA}/sub-records"
              payload: { record_type: "HEALTH_HISTORY", payload: { risk_flags: [] } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${sA}/sub-records"
              payload: { record_type: "PHYSICAL_EXAM", payload: { weight_kg: 72.5, pulse_bpm: 72, systolic_mmhg: 118, diastolic_mmhg: 76, temperature_c: 36.7, hematocrit_pct: 43.0, total_protein_g_dl: 7.2 } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${sA}/sub-records"
              payload: { record_type: "VIRAL_MARKER", payload: { hiv_ag_ab: "NON_REACTIVE", hbv_surface_ag: "NON_REACTIVE", hcv_ab: "NON_REACTIVE" } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${sA}/clear"
              payload: {}
              as: MedicalScreener
              as_user_id: "ms-01"
            - call: "POST /donors/${d}/donation-visits"
              payload: { center_id: "${c}", screening_visit_id: "${sA}", scheduled_for: "2026-09-01T09:30:00Z" }
              as: Phlebotomist
              captures: { dvA: $.data.id }
            - call: "POST /donors/${d}/screening-visits"
              payload: { center_id: "${c}", scheduled_for: "2026-09-01T08:30:00Z" }
              as: Recorder
              captures: { sB: $.data.id }
            - call: "POST /screening-visits/${sB}/sub-records"
              payload: { record_type: "IDENTITY", payload: { document_number: "TXDL-883491" } }
              as: Recorder
              as_user_id: "rec-02"
            - call: "POST /screening-visits/${sB}/sub-records"
              payload: { record_type: "HEALTH_HISTORY", payload: { risk_flags: [] } }
              as: Recorder
              as_user_id: "rec-02"
            - call: "POST /screening-visits/${sB}/sub-records"
              payload: { record_type: "PHYSICAL_EXAM", payload: { weight_kg: 72.5, pulse_bpm: 72, systolic_mmhg: 118, diastolic_mmhg: 76, temperature_c: 36.7, hematocrit_pct: 43.0, total_protein_g_dl: 7.2 } }
              as: Recorder
              as_user_id: "rec-02"
            - call: "POST /screening-visits/${sB}/sub-records"
              payload: { record_type: "VIRAL_MARKER", payload: { hiv_ag_ab: "NON_REACTIVE", hbv_surface_ag: "NON_REACTIVE", hcv_ab: "NON_REACTIVE" } }
              as: Recorder
              as_user_id: "rec-02"
            - call: "POST /screening-visits/${sB}/clear"
              payload: {}
              as: MedicalScreener
              as_user_id: "ms-01"
            - call: "POST /donors/${d}/donation-visits"
              payload: { center_id: "${c}", screening_visit_id: "${sB}", scheduled_for: "2026-09-01T10:00:00Z" }
              as: Phlebotomist
              captures: { dvB: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /donation-visits/${dvA}/check-in"
              payload: {}
              as: Phlebotomist
            - call: "GET /donation-visits/${dvA}/compensation-payment"
              as: PlatformAdmin
              captures: { provA_base: "$.data[0].base_cents", provA_net: "$.data[0].net_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /donation-visits/${dvB}/check-in"
              payload: {}
              as: Phlebotomist
            - call: "POST /donation-visits/${dvB}/complete-collection"
              payload: { actual_volume_ml: 690 }
              as: Phlebotomist
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:16:00Z" }
              as: PlatformAdmin
            - call: "POST /donation-visits/${dvB}/discharge"
              payload: {}
              as: Phlebotomist
            - call: "POST /donation-visits/${dvA}/complete-collection"
              payload: { actual_volume_ml: 690 }
              as: Phlebotomist
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:32:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /donation-visits/${dvA}/discharge"
              payload: {}
              as: Phlebotomist
            - call: "GET /donation-visits/${dvA}/compensation-payment"
              as: PlatformAdmin
              captures: { finA_base: "$.data[0].base_cents", finA_net: "$.data[0].net_cents", finA_variant: "$.data[0].variant" }
            - call: "GET /donation-visits/${dvB}/compensation-payment"
              as: PlatformAdmin
              captures: { finB_base: "$.data[0].base_cents", finB_net: "$.data[0].net_cents" }
            - call: "GET /donors/${d}"
              as: PlatformAdmin
              captures: { ytd: $.data.ytd_compensation_cents }
          assert:
            - "visit A PROVISIONAL (captured at A's check-in): ${provA_base} == 3000 and ${provA_net} == 3000 (ordinal 0 — no prior September completions yet)"
            - "visit B FINAL: ${finB_base} == 3000 and ${finB_net} == 3000 (B completed first, ordinal 0)"
            - "visit A FINAL: ${finA_base} == 2500 — A's FINAL ordinal counts B's intervening completion, so A drops to base_cents_second_donation"
            - "divergence on identical visit-A inputs: ${finA_variant} == FINAL and ${finA_net} == 2500 != provisional 3000"
            - "ytd accumulator only sees FINAL nets: ${ytd} == 5500 (3000 + 2500)"

  # =====================================================================
  # Rule 2 — combinatorial_formula: three instances in DIFFERENT modes
  # (a) tiered-rate selection, (b) nested rounding order, (c) circular-looking
  # dependency with pinned evaluation order.
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: tiered_monthly_ordinal_base_rate_selection
        grounds:
          - calculations.base_compensation_cents
          - entities.CompensationSchedule.fields.base_cents_first_donation
          - entities.CompensationSchedule.fields.base_cents_second_donation
          - entities.CompensationSchedule.fields.base_cents_subsequent_donation
        distinguishing_aspect: |
