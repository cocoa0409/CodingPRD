            - call: "GET /deposit-fraud/deposit-items/${item_to1b}/holds"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { hold_to1b: "$.data[0].id", hold_to1b_v: "$.data[0].version" }
            - call: "POST /deposit-fraud/check-holds/${hold_to1a}/override-reviews"
              payload: { requested_release_cents: 7500, release_effective_at: "2026-08-01T00:00:00Z", release_window_end_at: "2026-08-03T00:00:00Z", justification: "First early-release window", expected_check_hold_version: "${hold_to1a_v}" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { rev_to1a: "$.data.id" }
          trigger:
            - call: "POST /deposit-fraud/check-holds/${hold_to1b}/override-reviews"
