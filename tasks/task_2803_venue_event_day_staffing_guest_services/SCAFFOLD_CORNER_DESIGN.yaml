              payload: { code: "ELEVATOR_OPERATOR", display_name: "Elevator Operator", base_hourly_rate_cents: 2400, attendance_ratio_per_1000: 0.2, min_headcount: 1, required_certifications: [], is_tip_eligible: true, is_contracted_position: true }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T23:05:00Z", required_headcount_override: 3 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ada Senior", employment_type: "CONTRACTED", seniority_date: "2020-01-01T00:00:00Z", hourly_rate_cents: 2400 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ben Middle", employment_type: "CONTRACTED", seniority_date: "2021-01-01T00:00:00Z", hourly_rate_cents: 2400 }
              as: StaffingCoordinator
              captures: { m2: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Cara Junior", employment_type: "CONTRACTED", seniority_date: "2022-01-01T00:00:00Z", hourly_rate_cents: 2400 }
              as: StaffingCoordinator
              captures: { m3: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
