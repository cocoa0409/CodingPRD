          - validations[priority=12]
          - errors[ERR_MODEL_VERSION_NOT_PUBLISHED]
        distinguishing_aspect: |
          Entity pair SponsorDistribution -> ModelVersion: the distribution's own
          PENDING -> ACTIVE edge is legal on its own row, and is rejected purely
          because the ModelVersion it points at slipped from PUBLISHED to
          SUPERSEDED while the distribution sat in PENDING.
        test_recipe:
          setup:
            - "ModelVersion v1 was PUBLISHED and a distribution to sponsor NRTH was created against it, still PENDING"
            - "ModelVersion v2 of the same model was then published, so v1 is now SUPERSEDED"
            - "The PENDING distribution was untouched by the publish cascade, which only lapses ACTIVE distributions"
          setup_api_calls:
