scenario: "Hunting & Fishing License: license/tag/stamp catalog, residency verification, limited-tag lottery draw, season/bag rules, harvest reporting, hunter-education prerequisite, preference-point accrual, duplicate/replacement"
domain_name: hunting-fishing-license
api_prefix: ""

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - optimistic_concurrency        # OCC on DrawPool.version for draw execution / late application
    - cascading_side_effects        # draw award -> license issuance -> preference-point reset; replacement -> void original -> reopen harvest budget
    - dual_variant_calculation      # license fee (resident vs non-resident) AND draw priority score (squared vs linear)
    - rate_threshold_triggers       # bag-limit boundary; preference-point cap; minimum-age boundary

  entity_topology: flat
  # Peer entities linked by foreign keys; URLs are flat collections keyed by id,
  # with FK fields carried in request bodies (no deep parent/child URL nesting).

  state_machine_shape: branching
  # DrawApplication forks at draw time: SUBMITTED -> {AWARDED, UNSUCCESSFUL} with
  # divergent side-effect sets. License has a revert (ISSUED -> VOIDED on replacement).
  # HarvestReport branches SUBMITTED -> {ACCEPTED, REJECTED}.

  relationship_patterns:
    - one_to_many        # Applicant -> DrawApplication, Applicant -> License, License -> HarvestReport
    - cross_aggregate    # DrawApplication references both Applicant and DrawPool; License references LicenseProduct + DrawApplication

  role_model: peer_roles
  # Applicant acts on own applications/harvests; LicenseAgent issues/replaces over-the-counter
  # licenses; DrawOfficer configures pools/products/seasons and executes draws;
  # GameWarden adjudicates harvest reports. Distinct resource ownership per role.

  consistency_model: immediate
  # All cascades (draw award -> issuance -> point reset; replacement -> void -> budget reopen)
  # complete atomically within the triggering request.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: legal name of the license holder
      - name: birth_date
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); used for minimum-age and youth-pricing rules"
      - name: declared_state_code
        type: string
        source: input
        description: "two-letter state code the applicant claims as primary residence (e.g. 'MT')"
      - name: residency_status
        type: enum
        source: computed
        description: "residency standing derived from the latest ResidencyVerification; one of UNVERIFIED, RESIDENT, NONRESIDENT"
        default: UNVERIFIED
        constraints: "enum: UNVERIFIED, RESIDENT, NONRESIDENT"
      - name: education_certified
        type: boolean
        source: computed
        description: "true when at least one EducationCertificate for this applicant has status VERIFIED; gates hunting-tag issuance"
        default: false
      - name: preference_points
        type: integer
        source: computed
        description: "accrued preference points for the limited-tag draw; +1 per UNSUCCESSFUL DrawApplication, reset to 0 when AWARDED; capped at MAX_PREFERENCE_POINTS"
        default: 0
        constraints: "0 <= preference_points <= 12"
      - name: bonus_points
        type: integer
        source: input
        description: "administratively granted bonus points added to the draw priority score; defaults to 0"
        default: 0
        constraints: ">= 0"

  - name: ResidencyVerification
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the applicant whose residency this submission proves"
      - name: proof_type
        type: enum
        source: input
        description: "kind of evidence submitted"
        constraints: "enum: DRIVERS_LICENSE, UTILITY_BILL, TAX_RECORD, TRIBAL_ID"
      - name: proof_state_code
        type: string
        source: input
        description: "two-letter state code shown on the proof document"
      - name: continuous_months
        type: integer
        source: input
        description: "number of continuous months of domicile attested by the proof"
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "adjudication result; PENDING on submit, then APPROVED or DENIED by a DrawOfficer"
        default: PENDING
        constraints: "enum: PENDING, APPROVED, DENIED"
      - name: resulting_residency
        type: enum
        source: computed
        description: "residency_status written onto the Applicant when this verification is APPROVED; RESIDENT when proof_state_code matches declared_state_code and continuous_months >= RESIDENCY_MIN_MONTHS, else NONRESIDENT"
        default: null
        constraints: "enum: RESIDENT, NONRESIDENT, null"

  - name: EducationCertificate
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the applicant who completed the hunter-education course"
      - name: course_code
        type: string
        source: input
        description: "identifier of the completed hunter-education course"
      - name: completion_date
        type: string
        source: input
        description: "ISO 8601 date the course was completed"
      - name: status
        type: enum
        source: computed
        description: "PENDING on submit; VERIFIED or REJECTED after DrawOfficer review; only VERIFIED sets Applicant.education_certified"
        default: PENDING
        constraints: "enum: PENDING, VERIFIED, REJECTED"

  - name: LicenseProduct
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "catalog stock-keeping unit; unique across active products"
        constraints: "unique among LicenseProduct rows whose status IN {ACTIVE}"
      - name: product_kind
        type: enum
        source: input
        description: "what the product authorizes"
        constraints: "enum: LICENSE, TAG, STAMP"
      - name: species_season_id
        type: string
        source: input
        description: "FK -> SpeciesSeason.id; the season/bag ruleset this product is bound to; null for general LICENSE/STAMP products"
        default: null
      - name: requires_education
        type: boolean
        source: input
        description: "when true, issuance requires Applicant.education_certified == true"
        default: false
      - name: residency_restriction
        type: enum
        source: input
        description: "who may purchase this product"
        default: ANY
        constraints: "enum: ANY, RESIDENT_ONLY, NONRESIDENT_ONLY"
      - name: base_fee_cents
        type: integer
        source: input
        description: "resident base price in cents before multipliers and surcharges"
        constraints: ">= 0"
      - name: min_age_years
        type: integer
        source: input
        description: "minimum applicant age in whole years on the issuance date"
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE on create; RETIRED after a DrawOfficer retires it (no new issuance)"
        default: ACTIVE
        constraints: "enum: ACTIVE, RETIRED"

  - name: SpeciesSeason
    parent: null
    common_fields: true
    fields:
      - name: species
        type: string
        source: input
        description: "regulated species (e.g. 'ELK', 'WALLEYE')"
      - name: season_open
        type: string
        source: input
        description: "ISO 8601 UTC datetime the season opens (inclusive)"
      - name: season_close
        type: string
        source: input
        description: "ISO 8601 UTC datetime the season closes (exclusive); harvests must fall in [season_open, season_close)"
      - name: bag_limit
        type: integer
        source: input
        description: "maximum total quantity an applicant may harvest in this season across all ACCEPTED + SUBMITTED reports"
        constraints: ">= 0"
      - name: draw_required
        type: boolean
        source: input
        description: "when true, a TAG for this season may only be issued by awarding a DrawApplication; over-the-counter issuance is forbidden"
        default: false
      - name: status
        type: enum
        source: computed
        description: "DRAFT on create; OPEN after a DrawOfficer opens it; CLOSED after close. Harvest reporting requires OPEN."
        default: DRAFT
        constraints: "enum: DRAFT, OPEN, CLOSED"

  - name: DrawPool
    parent: null
    common_fields: true
    fields:
      - name: species_season_id
        type: string
        source: input
        description: "FK -> SpeciesSeason.id; the season whose limited tags this pool allocates"
      - name: license_product_id
        type: string
        source: input
        description: "FK -> LicenseProduct.id; the TAG product issued to awarded applicants; must have product_kind == TAG"
      - name: quota
        type: integer
        source: input
        description: "number of tags available to award in the draw"
        constraints: ">= 0"
      - name: scoring_model
        type: enum
        source: input
        description: "priority-score variant used to rank applications in the draw"
        default: SQUARED
        constraints: "enum: SQUARED, LINEAR"
      - name: status
        type: enum
        source: computed
        description: "ACCEPTING on create (applications allowed); CLOSED after entry deadline passes; DRAWN after the draw is executed"
        default: ACCEPTING
        constraints: "enum: ACCEPTING, CLOSED, DRAWN"
      - name: awarded_count
        type: integer
        source: computed
        description: "number of DrawApplication rows for this pool currently in AWARDED state; recomputed on draw execution"
        default: 0
      - name: entry_deadline
        type: string
        source: input
        description: "ISO 8601 UTC datetime; applications are rejected once the clock is at or past this instant"

  - name: DrawApplication
    parent: null
    common_fields: true
    fields:
      - name: draw_pool_id
        type: string
        source: input
        description: "FK -> DrawPool.id; the pool this application competes in"
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the applicant entering the draw"
      - name: points_at_entry
        type: integer
        source: computed
        description: "snapshot of Applicant.preference_points captured at submission; frozen for the draw"
      - name: bonus_at_entry
        type: integer
        source: computed
        description: "snapshot of Applicant.bonus_points captured at submission; frozen for the draw"
      - name: priority_score
        type: integer
        source: computed
        description: "draw ranking score computed at draw time from points_at_entry and bonus_at_entry per the pool scoring_model"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "SUBMITTED on create; on draw execution becomes AWARDED (quota slot won) or UNSUCCESSFUL; WITHDRAWN if the applicant withdraws before the draw"
        default: SUBMITTED
        constraints: "enum: SUBMITTED, AWARDED, UNSUCCESSFUL, WITHDRAWN"
      - name: issued_license_id
        type: string
        source: computed
        description: "FK -> License.id; populated with the TAG License minted when this application is AWARDED; null otherwise"
        default: null

  - name: License
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the holder of this license/tag/stamp"
      - name: license_product_id
        type: string
        source: input
        description: "FK -> LicenseProduct.id; the catalog product instantiated"
      - name: draw_application_id
        type: string
        source: input
        description: "FK -> DrawApplication.id; set for draw-awarded TAGs, null for over-the-counter issuance"
        default: null
      - name: issued_via
        type: enum
        source: computed
        description: "OVER_THE_COUNTER for agent issuance, DRAW_AWARD for draw-minted tags"
        constraints: "enum: OVER_THE_COUNTER, DRAW_AWARD"
      - name: fee_charged_cents
        type: integer
        source: computed
        description: "final price charged, computed from the product and the applicant's residency_status per the license-fee calculation"
      - name: status
        type: enum
        source: computed
        description: "ISSUED on creation; VOIDED when superseded by a replacement"
        default: ISSUED
        constraints: "enum: ISSUED, VOIDED"
      - name: superseded_by_id
        type: string
        source: computed
        description: "FK -> License.id; the replacement License that voided this one; null while ISSUED"
        default: null

  - name: HarvestReport
    parent: null
    common_fields: true
    fields:
      - name: license_id
        type: string
        source: input
        description: "FK -> License.id; the TAG/LICENSE under which the harvest was taken; must be ISSUED"
      - name: harvest_datetime
        type: string
        source: input
        description: "ISO 8601 UTC datetime the animal/fish was taken; must lie in the bound season's [season_open, season_close)"
      - name: quantity
        type: integer
        source: input
        description: "number of animals/fish taken in this report"
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "SUBMITTED on create (counts against the bag budget); ACCEPTED or REJECTED after GameWarden adjudication; REJECTED releases its quantity from the budget"
        default: SUBMITTED
        constraints: "enum: SUBMITTED, ACCEPTED, REJECTED"

  - name: Replacement
    parent: null
    common_fields: true
    fields:
      - name: original_license_id
        type: string
        source: input
        description: "FK -> License.id; the lost/damaged license being replaced; must be ISSUED"
      - name: reason
        type: enum
        source: input
        description: "why a duplicate is requested"
        constraints: "enum: LOST, DAMAGED, STOLEN"
      - name: replacement_license_id
        type: string
        source: computed
        description: "FK -> License.id; the new License minted by this replacement; populated on success"
        default: null
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "flat duplicate-issuance fee charged for the replacement, per the replacement-fee calculation"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: ResidencyVerification
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /residency-verifications/{id}/approve"
        actor: DrawOfficer
        preconditions:
          - "ResidencyVerification.status == PENDING"
        side_effects:
          - "set resulting_residency = RESIDENT if proof_state_code == Applicant.declared_state_code AND continuous_months >= RESIDENCY_MIN_MONTHS, else NONRESIDENT"
          - "set Applicant.residency_status = this.resulting_residency (cross-entity write)"
          - "increment Applicant.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /residency-verifications/{id}/deny"
        actor: DrawOfficer
        preconditions:
          - "ResidencyVerification.status == PENDING"
        side_effects:
          - "Applicant.residency_status left unchanged"

  - entity: EducationCertificate
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /education-certificates/{id}/verify"
        actor: DrawOfficer
        preconditions:
          - "EducationCertificate.status == PENDING"
        side_effects:
          - "set Applicant.education_certified = true (cross-entity write)"
          - "increment Applicant.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /education-certificates/{id}/reject"
        actor: DrawOfficer
        preconditions:
          - "EducationCertificate.status == PENDING"
        side_effects:
          - "Applicant.education_certified left unchanged"

  - entity: SpeciesSeason
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /species-seasons/{id}/open"
        actor: DrawOfficer
        preconditions:
          - "SpeciesSeason.status == DRAFT"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /species-seasons/{id}/close"
        actor: DrawOfficer
        preconditions:
          - "SpeciesSeason.status == OPEN"
        side_effects: []

  - entity: DrawPool
    initial_state: ACCEPTING
    terminal_states: [DRAWN]
    transitions:
      - from: ACCEPTING
        to: CLOSED
        trigger: "POST /draw-pools/{id}/close-entries"
        actor: DrawOfficer
        preconditions:
          - "DrawPool.status == ACCEPTING"
          - "current clock is at or past DrawPool.entry_deadline"
        side_effects: []
      - from: CLOSED
        to: DRAWN
        trigger: "POST /draw-pools/{id}/execute-draw (expected_draw_pool_version)"
        actor: DrawOfficer
        preconditions:
          - "DrawPool.status == CLOSED"
          - "expected_draw_pool_version == DrawPool.version (OCC)"
          - "the bound SpeciesSeason.status == OPEN"
        side_effects:
          - "compute priority_score for every SUBMITTED DrawApplication in this pool using scoring_model"
          - "rank SUBMITTED applications by priority_score DESC, tie-break created_at ASC"
          - "award the top `quota` applications: set DrawApplication.status = AWARDED (cascade level 1)"
          - "for each AWARDED application: mint a License (issued_via=DRAW_AWARD) -> sets DrawApplication.issued_license_id, increments Applicant.version, resets Applicant.preference_points = 0 (cascade level 2 -> 3)"
          - "for each remaining SUBMITTED application: set status = UNSUCCESSFUL and increment Applicant.preference_points by 1 up to MAX_PREFERENCE_POINTS (cascade)"
          - "set DrawPool.awarded_count = number of AWARDED applications"
          - "increment DrawPool.version by 1 (OCC advance)"
        note: "branching fork SUBMITTED -> {AWARDED, UNSUCCESSFUL} with divergent side effects; AWARDED triggers a depth-3 cascade (award -> License mint -> Applicant point reset)."

  - entity: DrawApplication
    initial_state: SUBMITTED
    terminal_states: [AWARDED, UNSUCCESSFUL, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /draw-applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "DrawApplication.status == SUBMITTED"
          - "DrawPool.status == ACCEPTING (cross-entity: cannot withdraw after entries close)"
        side_effects:
          - "no point change"
      - from: SUBMITTED
        to: AWARDED
        trigger: "system: DrawPool execute-draw awards a quota slot"
        actor: system
        preconditions:
          - "DrawApplication ranks within DrawPool.quota by priority_score DESC, created_at ASC"
        side_effects:
          - "mint License (issued_via=DRAW_AWARD), set issued_license_id"
          - "reset Applicant.preference_points = 0, increment Applicant.version by 1"
      - from: SUBMITTED
        to: UNSUCCESSFUL
        trigger: "system: DrawPool execute-draw, application not within quota"
        actor: system
        preconditions:
          - "DrawApplication does NOT rank within DrawPool.quota"
        side_effects:
          - "increment Applicant.preference_points by 1, clamped to MAX_PREFERENCE_POINTS, increment Applicant.version by 1"

  - entity: License
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "system: POST /replacements voids the original"
        actor: system
        preconditions:
          - "License.status == ISSUED"
        side_effects:
          - "set superseded_by_id = replacement_license_id"
          - "release the original's harvest budget: all HarvestReport rows under this License whose status == SUBMITTED are migrated to the replacement License (cross-entity re-link)"

  - entity: HarvestReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /harvest-reports/{id}/accept"
        actor: GameWarden
        preconditions:
          - "HarvestReport.status == SUBMITTED"
        side_effects:
          - "quantity remains counted against the season bag budget"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /harvest-reports/{id}/reject"
        actor: GameWarden
        preconditions:
          - "HarvestReport.status == SUBMITTED"
        side_effects:
          - "release quantity from the season bag budget (no longer counted)"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: draw-execute-stale-pool
    parent_entity: DrawPool
    write_endpoint: "POST /draw-pools/{id}/execute-draw"
    occ_field: "expected_draw_pool_version"
    description: |
      Executing the draw against a DrawPool whose version has advanced since the
      officer last observed it is rejected. A prior execute-draw already moved the
      pool to DRAWN and bumped its version (legitimately superseding the officer's
      stale view in which the pool was still CLOSED); the second execute carrying
      the pre-draw version is rejected on the stale-version check before any award.
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: license_fee
    trigger: "POST /licenses (over-the-counter issuance) and License minting during draw award and replacement"
    algorithm: tiered_pricing
    formula: |
      # evaluation order is fixed: residency multiplier first, then agent surcharge.
      if product.residency_restriction == RESIDENT_ONLY and applicant.residency_status != RESIDENT: reject ERR_RESIDENCY_RESTRICTED
      if product.residency_restriction == NONRESIDENT_ONLY and applicant.residency_status != NONRESIDENT: reject ERR_RESIDENCY_RESTRICTED
      base = product.base_fee_cents
      if applicant.residency_status == NONRESIDENT:
          priced = round_half_up(base * NONRESIDENT_MULTIPLIER)   # step 1
      else:
          priced = base                                           # RESIDENT or (DRAW_AWARD path uses residency at award time)
      if issued_via == OVER_THE_COUNTER:                          # step 2
          priced = priced + AGENT_SURCHARGE_CENTS
      fee_charged_cents = priced
    input_set: "single LicenseProduct + the issuing Applicant's residency_status at issuance time"
    constants:
      NONRESIDENT_MULTIPLIER: 2.5
      AGENT_SURCHARGE_CENTS: 300
    precision: "integer cents; round_half_up applied once at step 1 (multiply before adding surcharge)"
    variants:
      - name: resident
        when: "Applicant.residency_status == RESIDENT"
        difference: "no multiplier applied; fee = base (+ agent surcharge if OVER_THE_COUNTER)"
      - name: nonresident
        when: "Applicant.residency_status == NONRESIDENT"
        difference: "base multiplied by NONRESIDENT_MULTIPLIER and rounded BEFORE the surcharge is added; multiply-then-add is pinned, so a resident and non-resident of the same product diverge"

  - name: draw_priority_score
    trigger: "system: DrawPool execute-draw, computed once per SUBMITTED DrawApplication"
    algorithm: weighted_scoring
    formula: |
      pp = draw_application.points_at_entry
      b  = draw_application.bonus_at_entry
      if pool.scoring_model == SQUARED:
          priority_score = pp * pp + b
      else:  # LINEAR
          priority_score = pp + b
      # ranking: ORDER BY priority_score DESC, then DrawApplication.created_at ASC (NOT id)
    input_set: "all DrawApplication rows for the pool whose status == SUBMITTED at draw time"
    constants:
      MAX_PREFERENCE_POINTS: 12
    precision: "integer score; no rounding"
    variants:
      - name: squared
        when: "DrawPool.scoring_model == SQUARED"
        difference: "preference points contribute pp^2; widens the gap between high- and low-point applicants"
      - name: linear
        when: "DrawPool.scoring_model == LINEAR"
        difference: "preference points contribute pp; same inputs (pp=3,b=2) yield 11 under SQUARED but 5 under LINEAR"

  - name: season_bag_budget_remaining
    trigger: "POST /harvest-reports (precondition check) and GET /licenses/{id}/bag-budget"
    algorithm: aggregation
    formula: |
      counted = sum(hr.quantity
                    for hr in HarvestReport
                    where hr.license_id IN {licenses held by this applicant for this SpeciesSeason}
                      and hr.status IN {SUBMITTED, ACCEPTED})   # REJECTED excluded
      remaining = season.bag_limit - counted
      # a new report of quantity q is admissible iff counted + q <= season.bag_limit
    input_set: "HarvestReport rows for the applicant under the season's licenses with status in {SUBMITTED, ACCEPTED}; REJECTED reports are excluded and release their quantity"
    constants: {}
    precision: "integer count; no rounding"

  - name: replacement_admin_fee
    trigger: "POST /replacements"
    algorithm: threshold
    formula: |
      # combinatorial: 3 inputs (reason, original product kind, residency) with conditional branches.
      # product_kind is resolved via LicenseProduct[original_license.license_product_id].product_kind;
      # applicant is resolved via Applicant[original_license.applicant_id].
      kind = LicenseProduct[original_license.license_product_id].product_kind
      applicant = Applicant[original_license.applicant_id]
      if reason == STOLEN:
          # stolen replacements are fully waived (police-report path) — short-circuit, no surcharges apply
          admin_fee_cents = 0
      else:
          base = REPLACEMENT_BASE_CENTS
          if kind == TAG:
              base = base + TAG_REPLACEMENT_SURCHARGE_CENTS
          if applicant.residency_status == NONRESIDENT:
              base = base + NONRESIDENT_REPLACEMENT_SURCHARGE_CENTS
          admin_fee_cents = base
    input_set: "the original License's product (via license_product_id).product_kind, the Replacement.reason, and the holder Applicant.residency_status (via original_license.applicant_id)"
    constants:
      REPLACEMENT_BASE_CENTS: 1500
      TAG_REPLACEMENT_SURCHARGE_CENTS: 1000
      NONRESIDENT_REPLACEMENT_SURCHARGE_CENTS: 500
    precision: "integer cents; no rounding"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the role in X-User-Role is permitted to perform this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every resource referenced in the path or body FK exists; validated left-to-right in path then body"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "the target resource is in a state from which this transition is defined (e.g. execute-draw requires DrawPool.status == CLOSED; accept/reject requires HarvestReport.status == SUBMITTED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_draw_pool_version equals the current DrawPool.version on execute-draw"
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412
    applies_to: "POST /draw-pools/{id}/execute-draw"

  - priority: 6
    category: business_referential
    check: "a TAG product bound to a SpeciesSeason with draw_required == true may NOT be issued over the counter; it must arrive via a draw award (draw_application_id present)"
    error_id: ERR_DRAW_REQUIRED
    http_status: 409
    applies_to: "POST /licenses"

  - priority: 7
    category: business_safety
    check: "issuing a product with requires_education == true demands Applicant.education_certified == true (hunter-education prerequisite)"
    error_id: ERR_EDUCATION_REQUIRED
    http_status: 409
    applies_to: "POST /licenses, POST /replacements"

  - priority: 8
    category: business_constraint
    check: "the applicant meets the product min_age_years computed from birth_date on the issuance date"
    error_id: ERR_MINIMUM_AGE
    http_status: 409
    applies_to: "POST /licenses"

  - priority: 9
    category: business_referential
    check: "the applicant's residency_status satisfies the product residency_restriction (RESIDENT_ONLY/NONRESIDENT_ONLY)"
    error_id: ERR_RESIDENCY_RESTRICTED
    http_status: 409
    applies_to: "POST /licenses, POST /replacements"

  - priority: 10
    category: business_temporal
    check: "a DrawApplication may only be created while DrawPool.status == ACCEPTING and the clock is strictly before entry_deadline; a duplicate application by the same applicant to the same pool is rejected"
    error_id: ERR_ENTRY_CLOSED
    http_status: 409
    applies_to: "POST /draw-applications"

  - priority: 11
    category: business_referential
    check: "an applicant may hold at most one non-VOIDED DrawApplication per DrawPool"
    error_id: ERR_DUPLICATE_ENTRY
    http_status: 409
    applies_to: "POST /draw-applications"

  - priority: 12
    category: business_temporal
    check: "harvest_datetime lies within the bound SpeciesSeason's [season_open, season_close) AND the season status == OPEN at report time"
    error_id: ERR_SEASON_NOT_OPEN
    http_status: 409
    applies_to: "POST /harvest-reports"

  - priority: 13
    category: business_constraint
    check: "the harvest report's quantity plus the already-counted (SUBMITTED+ACCEPTED) quantity does not exceed the season bag_limit"
    error_id: ERR_BAG_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /harvest-reports"

  - priority: 14
    category: business_constraint
    check: "request body field-level validation: required fields present, enums valid, numeric fields within declared constraints (quantity >= 1, quota >= 0, etc.)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Applicant ---
  - method: POST
    path: "/applicants"
    description: "register a new applicant"
    roles: [Applicant, DrawOfficer]
    code: 201
    input: [full_name, birth_date, declared_state_code, "bonus_points?"]
    output: Applicant
    side_effects: ["residency_status initialized UNVERIFIED, preference_points 0, education_certified false"]
  - method: GET
    path: "/applicants/{id}"
    description: "fetch an applicant including computed residency_status, preference_points, education_certified"
    roles: [Applicant, DrawOfficer, LicenseAgent, GameWarden]
    code: 200
    input: []
    output: Applicant
    side_effects: []
  - method: GET
    path: "/applicants"
    description: "list applicants (paginated)"
    roles: [DrawOfficer, LicenseAgent]
    code: 200
    input: ["declared_state_code?", "limit?", "offset?"]
    output: Applicant[]
    side_effects: []

  # --- ResidencyVerification ---
  - method: POST
    path: "/residency-verifications"
    description: "submit residency proof for an applicant"
    roles: [Applicant, DrawOfficer]
    code: 201
    input: [applicant_id, proof_type, proof_state_code, continuous_months]
    output: ResidencyVerification
    side_effects: ["status PENDING"]
  - method: GET
    path: "/residency-verifications/{id}"
    description: "fetch a residency verification including status and resulting_residency"
    roles: [DrawOfficer, Applicant]
    code: 200
    input: []
    output: ResidencyVerification
    side_effects: []
  - method: GET
    path: "/residency-verifications"
    description: "list residency verifications, filterable by applicant"
    roles: [DrawOfficer, Applicant]
    code: 200
    input: ["applicant_id?", "status?", "limit?", "offset?"]
    output: ResidencyVerification[]
    side_effects: []
  - method: POST
    path: "/residency-verifications/{id}/approve"
    description: "approve a residency verification; writes Applicant.residency_status"
    roles: [DrawOfficer]
    code: 200
    input: []
    output: ResidencyVerification
    side_effects: ["set resulting_residency", "set Applicant.residency_status (cross-entity)", "increment Applicant.version"]
  - method: POST
    path: "/residency-verifications/{id}/deny"
    description: "deny a residency verification"
    roles: [DrawOfficer]
    code: 200
    input: []
    output: ResidencyVerification
    side_effects: ["Applicant.residency_status unchanged"]

  # --- EducationCertificate ---
  - method: POST
    path: "/education-certificates"
    description: "submit a hunter-education completion record"
    roles: [Applicant, DrawOfficer]
    code: 201
    input: [applicant_id, course_code, completion_date]
    output: EducationCertificate
    side_effects: ["status PENDING"]
  - method: GET
    path: "/education-certificates/{id}"
    description: "fetch a hunter-education certificate including status"
    roles: [DrawOfficer, Applicant]
    code: 200
    input: []
    output: EducationCertificate
    side_effects: []
  - method: GET
    path: "/education-certificates"
    description: "list education certificates, filterable by applicant"
    roles: [DrawOfficer, Applicant]
    code: 200
    input: ["applicant_id?", "status?", "limit?", "offset?"]
    output: EducationCertificate[]
    side_effects: []
  - method: POST
    path: "/education-certificates/{id}/verify"
    description: "verify a hunter-education certificate; sets Applicant.education_certified"
    roles: [DrawOfficer]
    code: 200
    input: []
    output: EducationCertificate
    side_effects: ["set Applicant.education_certified = true (cross-entity)", "increment Applicant.version"]
  - method: POST
    path: "/education-certificates/{id}/reject"
    description: "reject a hunter-education certificate"
    roles: [DrawOfficer]
    code: 200
    input: []
    output: EducationCertificate
    side_effects: ["Applicant.education_certified unchanged"]

  # --- LicenseProduct ---
  - method: POST
    path: "/license-products"
    description: "create a catalog product (license/tag/stamp)"
    roles: [DrawOfficer]
    code: 201
    input: [sku, product_kind, base_fee_cents, "species_season_id?", "requires_education?", "residency_restriction?", "min_age_years?"]
    output: LicenseProduct
    side_effects: ["status ACTIVE"]
  - method: GET
    path: "/license-products/{id}"
    description: "fetch a catalog product"
    roles: [DrawOfficer, LicenseAgent, Applicant]
    code: 200
    input: []
    output: LicenseProduct
    side_effects: []
  - method: GET
    path: "/license-products"
    description: "list catalog products, filterable by bound season"
    roles: [DrawOfficer, LicenseAgent, Applicant]
    code: 200
    input: ["species_season_id?", "product_kind?", "status?", "limit?", "offset?"]
    output: LicenseProduct[]
    side_effects: []
  - method: POST
    path: "/license-products/{id}/retire"
    description: "retire a product so no new licenses can be issued from it"
    roles: [DrawOfficer]
    code: 200
    input: []
    output: LicenseProduct
    side_effects: ["status RETIRED"]

  # --- SpeciesSeason ---
  - method: POST
    path: "/species-seasons"
    description: "define a regulated species season with bag limit and window"
    roles: [DrawOfficer]
    code: 201
    input: [species, season_open, season_close, bag_limit, "draw_required?"]
    output: SpeciesSeason
    side_effects: ["status DRAFT"]
  - method: GET
    path: "/species-seasons/{id}"
    description: "fetch a species season"
    roles: [DrawOfficer, LicenseAgent, GameWarden, Applicant]
    code: 200
    input: []
    output: SpeciesSeason
    side_effects: []
  - method: GET
    path: "/species-seasons"
    description: "list species seasons"
    roles: [DrawOfficer, LicenseAgent, GameWarden, Applicant]
    code: 200
    input: ["species?", "status?", "limit?", "offset?"]
    output: SpeciesSeason[]
    side_effects: []
  - method: POST
    path: "/species-seasons/{id}/open"
    description: "open a season for harvest reporting and draws"
    roles: [DrawOfficer]
    code: 200
    input: []
    output: SpeciesSeason
    side_effects: ["status OPEN"]
  - method: POST
    path: "/species-seasons/{id}/close"
    description: "close a season"
    roles: [DrawOfficer]
    code: 200
    input: []
    output: SpeciesSeason
    side_effects: ["status CLOSED"]

  # --- DrawPool ---
  - method: POST
    path: "/draw-pools"
    description: "create a limited-tag lottery pool for a season"
    roles: [DrawOfficer]
    code: 201
    input: [species_season_id, license_product_id, quota, entry_deadline, "scoring_model?"]
    output: DrawPool
    side_effects: ["status ACCEPTING, awarded_count 0"]
  - method: GET
    path: "/draw-pools/{id}"
    description: "fetch a draw pool including awarded_count and version"
    roles: [DrawOfficer, Applicant]
    code: 200
    input: []
    output: DrawPool
    side_effects: []
  - method: GET
    path: "/draw-pools"
    description: "list draw pools, filterable by bound season or tag product"
    roles: [DrawOfficer, Applicant]
    code: 200
    input: ["species_season_id?", "license_product_id?", "status?", "limit?", "offset?"]
    output: DrawPool[]
    side_effects: []
  - method: POST
    path: "/draw-pools/{id}/close-entries"
    description: "close pool entry once the deadline has passed"
    roles: [DrawOfficer]
    code: 200
    input: []
    output: DrawPool
    side_effects: ["status CLOSED"]
  - method: POST
    path: "/draw-pools/{id}/execute-draw"
    description: "run the lottery draw: rank applications, award up to quota, mint tags, reset/accrue preference points"
    roles: [DrawOfficer]
    code: 200
    input: [expected_draw_pool_version]
    output: DrawPool
    side_effects:
      - "compute priority_score per SUBMITTED DrawApplication"
      - "award top quota -> DrawApplication.status AWARDED, mint License DRAW_AWARD, reset Applicant.preference_points"
      - "remaining SUBMITTED -> UNSUCCESSFUL, +1 Applicant.preference_points (clamped to MAX_PREFERENCE_POINTS)"
      - "set DrawPool.awarded_count, status DRAWN, increment DrawPool.version by 1"

  # --- DrawApplication ---
  - method: POST
    path: "/draw-applications"
    description: "enter an applicant into a draw pool; snapshots preference/bonus points"
    roles: [Applicant, DrawOfficer]
    code: 201
    input: [draw_pool_id, applicant_id]
    output: DrawApplication
    side_effects: ["status SUBMITTED", "points_at_entry/bonus_at_entry snapshot from Applicant"]
  - method: GET
    path: "/draw-applications/{id}"
    description: "fetch a draw application including priority_score and issued_license_id"
    roles: [DrawOfficer, Applicant]
    code: 200
    input: []
    output: DrawApplication
    side_effects: []
  - method: GET
    path: "/draw-applications"
    description: "list draw applications, filterable by pool, applicant, or issued license"
    roles: [DrawOfficer, Applicant]
    code: 200
    input: ["draw_pool_id?", "applicant_id?", "issued_license_id?", "status?", "limit?", "offset?"]
    output: DrawApplication[]
    side_effects: []
  - method: POST
    path: "/draw-applications/{id}/withdraw"
    description: "withdraw a draw application before the draw runs"
    roles: [Applicant, DrawOfficer]
    code: 200
    input: []
    output: DrawApplication
    side_effects: ["status WITHDRAWN"]

  # --- License ---
  - method: POST
    path: "/licenses"
    description: "issue an over-the-counter license/tag/stamp to an applicant"
    roles: [LicenseAgent, DrawOfficer]
    code: 201
    input: [applicant_id, license_product_id]
    output: License
    side_effects: ["issued_via OVER_THE_COUNTER", "compute fee_charged_cents via license_fee", "status ISSUED"]
  - method: GET
    path: "/licenses/{id}"
    description: "fetch a license including fee_charged_cents and status"
    roles: [DrawOfficer, LicenseAgent, GameWarden, Applicant]
    code: 200
    input: []
    output: License
    side_effects: []
  - method: GET
    path: "/licenses"
    description: "list licenses, filterable by applicant, product, draw application, or the license they supersede"
    roles: [DrawOfficer, LicenseAgent, GameWarden, Applicant]
    code: 200
    input: ["applicant_id?", "license_product_id?", "draw_application_id?", "superseded_by_id?", "status?", "limit?", "offset?"]
    output: License[]
    side_effects: []
  - method: GET
    path: "/licenses/{id}/bag-budget"
    description: "computed read: remaining bag budget for this license's season for the holder"
    roles: [DrawOfficer, GameWarden, Applicant]
    code: 200
    input: []
    output: "{ season_id: string, bag_limit: integer, counted: integer, remaining: integer }"
    side_effects: []

  # --- HarvestReport ---
  - method: POST
    path: "/harvest-reports"
    description: "report a harvest under a license/tag"
    roles: [Applicant, DrawOfficer]
    code: 201
    input: [license_id, harvest_datetime, quantity]
    output: HarvestReport
    side_effects: ["status SUBMITTED", "counts quantity against the season bag budget"]
  - method: GET
    path: "/harvest-reports/{id}"
    description: "fetch a harvest report"
    roles: [DrawOfficer, GameWarden, Applicant]
    code: 200
    input: []
    output: HarvestReport
    side_effects: []
  - method: GET
    path: "/harvest-reports"
    description: "list harvest reports, filterable by license"
    roles: [DrawOfficer, GameWarden, Applicant]
    code: 200
    input: ["license_id?", "status?", "limit?", "offset?"]
    output: HarvestReport[]
    side_effects: []
  - method: POST
    path: "/harvest-reports/{id}/accept"
    description: "warden accepts a harvest report (quantity stays counted)"
    roles: [GameWarden]
    code: 200
    input: []
    output: HarvestReport
    side_effects: ["status ACCEPTED"]
  - method: POST
    path: "/harvest-reports/{id}/reject"
    description: "warden rejects a harvest report (releases quantity from bag budget)"
    roles: [GameWarden]
    code: 200
    input: []
    output: HarvestReport
    side_effects: ["status REJECTED", "release quantity from bag budget"]

  # --- Replacement ---
  - method: POST
    path: "/replacements"
    description: "issue a duplicate/replacement for a lost/damaged/stolen license; voids the original and re-links open harvests"
    roles: [LicenseAgent, DrawOfficer]
    code: 201
    input: [original_license_id, reason]
    output: Replacement
    side_effects:
      - "compute admin_fee_cents via replacement_admin_fee"
      - "mint replacement License (same license_product_id/applicant_id, draw_application_id copied from original, issued_via OVER_THE_COUNTER, fee_charged_cents = 0 since the duplicate is not a re-purchase — the holder pays only Replacement.admin_fee_cents), set replacement_license_id"
      - "void original License (status VOIDED, superseded_by_id set)"
      - "re-link the original's SUBMITTED HarvestReport rows to the replacement License (budget preserved)"
  - method: GET
    path: "/replacements/{id}"
    description: "fetch a replacement record"
    roles: [DrawOfficer, LicenseAgent, Applicant]
    code: 200
    input: []
    output: Replacement
    side_effects: []
  - method: GET
    path: "/replacements"
    description: "list replacements, filterable by original or replacement license"
    roles: [DrawOfficer, LicenseAgent, Applicant]
    code: 200
    input: ["original_license_id?", "replacement_license_id?", "limit?", "offset?"]
    output: Replacement[]
    side_effects: []

  # --- Test-driving (clock) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving: set the server's current UTC clock for deadline/season/age evaluation"
    roles: [DrawOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["all subsequent now() reads use this instant"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role is authenticated but not permitted for this operation per §1.7"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path or FK-referenced resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, invalid enum, or numeric value outside declared constraint"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource is not in a state from which the requested transition is defined"
  - id: ERR_STALE_POOL_VERSION
    http: 412
    condition: "expected_draw_pool_version does not match the current DrawPool.version on execute-draw"
  - id: ERR_DRAW_REQUIRED
    http: 409
    condition: "attempt to issue a draw_required TAG over the counter instead of via a draw award"
  - id: ERR_EDUCATION_REQUIRED
    http: 409
    condition: "issuing a requires_education product to an applicant whose education_certified is false"
  - id: ERR_MINIMUM_AGE
    http: 409
    condition: "applicant's age on the issuance date is below the product's min_age_years"
  - id: ERR_RESIDENCY_RESTRICTED
    http: 409
    condition: "applicant residency_status does not satisfy the product residency_restriction"
  - id: ERR_ENTRY_CLOSED
    http: 409
    condition: "draw application submitted when the pool is not ACCEPTING or the clock is at/after entry_deadline"
  - id: ERR_DUPLICATE_ENTRY
    http: 409
    condition: "applicant already holds a non-WITHDRAWN DrawApplication in this pool"
  - id: ERR_SEASON_NOT_OPEN
    http: 409
    condition: "harvest_datetime outside the season window, or the season is not OPEN at report time"
  - id: ERR_BAG_LIMIT_EXCEEDED
    http: 409
    condition: "new harvest quantity plus already-counted quantity exceeds the season bag_limit"
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "creating a LicenseProduct with a sku already used by an ACTIVE product"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Applicant
    description: "an individual who registers, proves residency/education, enters draws, holds licenses, and reports harvests on their own resources"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /draw-applications/{id}/withdraw (own application)"
    shared_operations:
      - "POST /applicants"
      - "POST /residency-verifications (own)"
      - "POST /education-certificates (own)"
      - "POST /draw-applications (own)"
      - "POST /harvest-reports (under own license)"
      - "GET reads on own applicant, applications, licenses, harvests, catalog, seasons, pools"

  - name: LicenseAgent
    description: "over-the-counter sales agent who issues and replaces licenses but does not configure pools or seasons"
    identity: "opaque"
    exclusive_operations:
      - "POST /licenses (over-the-counter issuance)"
      - "POST /replacements"
    shared_operations:
      - "GET reads on applicants, licenses, products, seasons"

  - name: DrawOfficer
    description: "fish-and-game administrator who manages the catalog, seasons, residency/education adjudication, draw pools, and executes the lottery draw"
    identity: "opaque"
    exclusive_operations:
      - "POST /license-products and /license-products/{id}/retire"
      - "POST /species-seasons and open/close"
      - "POST /residency-verifications/{id}/approve and /deny"
      - "POST /education-certificates/{id}/verify and /reject"
      - "POST /draw-pools and /close-entries and /execute-draw"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /licenses (administrative issuance)"
      - "POST /replacements (administrative)"
      - "POST /applicants, /residency-verifications, /education-certificates, /draw-applications, /harvest-reports"
      - "all GET reads"

  - name: GameWarden
    description: "field enforcement officer who adjudicates harvest reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /harvest-reports/{id}/accept"
      - "POST /harvest-reports/{id}/reject"
    shared_operations:
      - "GET reads on harvests, licenses, seasons, applicants"
