      - name: second_bind_on_an_already_bound_policy_rejected_as_invalid_from_state
        claim_type: invalid_transitions
        grounds:
          - validations[priority=8]
          - errors[ERR_INVALID_POLICY_STATE]
          - state_machines.LeaguePolicy.QUOTED_to_BOUND
        distinguishing_aspect: "Replaying bind against a BOUND policy is the idempotency probe: the second call must fail 409 ERR_INVALID_POLICY_STATE rather than silently succeed, and the term-overlap rule at priority 28 must NOT fire against the policy's own term."
        test_recipe:
          setup: ["One league, one BASEBALL_U12 classification and one policy already driven QUOTED -> BOUND."]
          setup_api_calls:
