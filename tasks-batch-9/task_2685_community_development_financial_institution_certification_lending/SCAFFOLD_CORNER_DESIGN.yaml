  - section: calculations
    instances:
      - name: advisory_credit_stops_exactly_at_the_two_tenths_cap
        claim_type: constants_applied
        grounds:
          - calculations.accountability_representation_score
          - calculations.accountability_representation_score.constants.ADVISORY_CREDIT_CAP
          - calculations.accountability_representation_score.constants.ADVISORY_WEIGHT
        distinguishing_aspect: |
          The advisory ratio's denominator spans BOTH structures, so with 1 governing seat and
          3 advisory seats of which 1 represents the market the credit is 0.5 * 1/4 = 0.1250,
          and adding one more representing advisory seat takes it to 0.5 * 2/5 = 0.2000 - the
          cap value itself. A ratio-over-advisory-only denominator would read 0.5000 and be
          clamped to 0.2000 at the first step, so the pre-trigger 0.1250 is the discriminator.
        test_recipe:
          setup:
            - "One institution with one APPROVED INVESTMENT_AREA market."
            - "One ACTIVE GOVERNING_BOARD seat that does NOT represent the market."
            - "Three ACTIVE ADVISORY_BOARD seats, exactly one of which represents the APPROVED market."
          setup_api_calls:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000021", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
