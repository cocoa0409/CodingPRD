          - entities.RefundException.fields.shortfall_cents
        distinguishing_aspect: |
          Entity pair GoodwillCredit depends on RefundException: the credit
          cannot be issued while the exception is REQUESTED, and after approval
          the credit's own ceiling is derived from the exception's shortfall
          (6000 requested minus 3000 approved), so the dependency supplies both
          a gate and a numeric bound. Approving only part of the request is what
