          bumps Membership.visits_consumed AND, because a posted RECOVER drove
          current_charge_grams (300) below 10% of nameplate (400) (B), that derived-
          balance breach (C) cascades Equipment.operational_status OPERATIONAL ->
          NEEDS_SERVICE. Each link is caused by the previous.
