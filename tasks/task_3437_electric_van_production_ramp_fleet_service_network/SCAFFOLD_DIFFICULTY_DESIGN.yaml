              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ord1_v: $.data.version }
            - call: "POST /evfleet/vehicles"
              payload: { vehicle_order_id: "${ord1_id}", battery_module_id: "${mod1_id}", vin: "VIN-ACME-701", expected_vehicle_order_version: "${ord1_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { veh_id: $.data.id }
            - call: "POST /evfleet/vehicles/${veh_id}/transition"
              payload: { dimension: "TELEMATICS", to_state: "PROVISIONED" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - call: "POST /evfleet/vehicles/${veh_id}/transition"
              payload: { dimension: "TELEMATICS", to_state: "ACTIVE" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
          trigger:
            - call: "POST /evfleet/vehicles/${veh_id}/battery-health"
              payload: { measured_soh_pct: 70.0, measured_at: "2026-09-02T00:00:00Z" }
              as: TelematicsIngestion
              captures: { eol_at_70: $.data.battery_eol_status, val_ref_at_70: $.data.eol_valuation_refurbish_cents }
            - call: "POST /evfleet/vehicles/${veh_id}/battery-health"
              payload: { measured_soh_pct: 69.9, measured_at: "2026-09-03T00:00:00Z" }
              as: TelematicsIngestion
              captures: { eol_at_699: $.data.battery_eol_status }
          assert:
            - "eol_at_70 == NONE and val_ref_at_70 is null (70.0 is NOT below the strict 70.0 threshold)"
            - "eol_at_699 == EOL_REVIEW (69.9 < 70.0 crosses)"
            - "Vehicle.${veh_id}.current_soh_pct == 69.9 after the second report"
            - "a further report at 72.0 leaves battery_eol_status == EOL_REVIEW (sticky)"

      - name: requested_kw_equal_headroom_is_allowed
        grounds:
          - calculations.depot_capacity_allocation
          - endpoints.POST_/evfleet/charging-projects
        distinguishing_aspect: "Inclusive <= on the kW headroom metric via the charging-projects endpoint (different metric and endpoint than the SOH percent boundary): requesting exactly the 100 kW headroom succeeds; one more kW is rejected."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Customer with depot D (total 250 kW). Project P1 (150 kW, window 2026-10-01..2026-10-10, crew 1) created; headroom exactly 100."
