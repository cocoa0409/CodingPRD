            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-30T08:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "ON_DUTY_NOT_DRIVING", event_time: "2026-05-30T07:00:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
