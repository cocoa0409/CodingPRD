          rationale: "Activation issuing the INITIAL assessment and moving billing_status while coverage_status moves separately is asserted there."

  - section: errors
    instances:
      - name: corner_error_duplicate_society_code_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_SOCIETY_CODE]
          - entities.Society.fields.society_code
          - validations.priority_10_uniqueness
        distinguishing_aspect: "society_code is unique across all Society rows regardless of display_name or repertoire_share_bp, and the collision is a 409 rather than a 422 shape error."
        test_recipe:
          setup:
            - "Society BMI is registered with repertoire_share_bp 4600"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
          trigger:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "BMI Second Filing", repertoire_share_bp: 100 }
              as: LicensingAdmin
              captures: { err_a: "$.data.error_id" }
            - call: "POST /licensing/societies"
              payload: { society_code: "ASCAP", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { ascap_id: "$.data.id" }
          assert:
            - "The duplicate BMI filing returned HTTP 409 with data.error_id == ERR_DUPLICATE_SOCIETY_CODE"
            - "Society.${bmi_id} still has display_name 'Broadcast Music Inc' and repertoire_share_bp 4600, so the rejected call wrote nothing"
            - "GET /licensing/societies?society_code=BMI returns total_count == 1"
            - "The ASCAP filing with an identical display_name and share succeeded as ${ascap_id}, so only society_code is scoped by uniqueness"
            - "A fifth code outside the enum, such as PRSFORMUSIC, is refused with ERR_INVALID_REQUEST and not with ERR_DUPLICATE_SOCIETY_CODE"

      - name: corner_error_read_path_ids_each_return_their_own_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RATE_SCHEDULE_NOT_FOUND]
          - errors[ERR_COVERAGE_WINDOW_NOT_FOUND]
          - errors[ERR_WORK_NOT_FOUND]
          - errors[ERR_SETLIST_ENTRY_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
        distinguishing_aspect: "Each detail read reports the entity its own path segment names: five well-formed ids that match no row produce five distinct 404 error ids, never one generic ERR_NOT_FOUND and never a 200 with a null body."
        test_recipe:
          setup:
            - "One society exists so that the ids used below are the only rows in the system"
            - "Every id below is well formed but names no row"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
          trigger:
            - call: "GET /licensing/rate-schedules/${bmi_id}"
              payload: {}
              as: LicensingAdmin
              captures: { err_sched: "$.data.error_id" }
            - call: "GET /licensing/coverage-windows/${bmi_id}"
              payload: {}
              as: LicensingAdmin
              captures: { err_window: "$.data.error_id" }
            - call: "GET /licensing/repertoire-works/${bmi_id}"
              payload: {}
              as: LicensingAdmin
              captures: { err_work: "$.data.error_id" }
            - call: "GET /licensing/setlist-entries/${bmi_id}"
              payload: {}
              as: LicensingAdmin
              captures: { err_entry: "$.data.error_id" }
            - call: "GET /licensing/fee-assessments/${bmi_id}"
              payload: {}
              as: LicensingAdmin
              captures: { err_assessment: "$.data.error_id" }
          assert:
            - "The Society id ${bmi_id} is reused deliberately: it is a real id of the wrong entity, so a lookup that ignores the collection would find a row"
            - "${err_sched} is ERR_RATE_SCHEDULE_NOT_FOUND, ${err_window} is ERR_COVERAGE_WINDOW_NOT_FOUND, ${err_work} is ERR_WORK_NOT_FOUND, ${err_entry} is ERR_SETLIST_ENTRY_NOT_FOUND and ${err_assessment} is ERR_ASSESSMENT_NOT_FOUND"
            - "All five responses are HTTP 404 with response_type error and a non-empty data.message"
            - "GET /licensing/societies/${bmi_id} still returns HTTP 200, so the id itself is valid"
            - "The equivalent list calls, such as GET /licensing/coverage-windows?license_id=${bmi_id}, return HTTP 200 with total_count 0 instead of a 404"

      - name: corner_error_action_path_ids_resolve_before_state_checks
        claim_type: error_triggerable
        grounds:
          - errors[ERR_APPLICATION_NOT_FOUND]
          - errors[ERR_RATE_SCHEDULE_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - validations.priority_3_path_resolution
        distinguishing_aspect: "Action endpoints resolve their path id before any state or payload check, so a missing row yields the entity's 404 even when the body is also invalid and the action's state precondition could never hold."
        test_recipe:
          setup:
            - "A society exists; its id is reused as a deliberately wrong-collection path id"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
          trigger:
            - call: "POST /licensing/license-applications/${bmi_id}/submit"
              payload: {}
              as: LicensingAdmin
              captures: { err_submit: "$.data.error_id" }
            - call: "POST /licensing/license-applications/${bmi_id}/review"
              payload: { disposition: "NOT_A_DISPOSITION" }
              as: LicensingAdmin
              captures: { err_review: "$.data.error_id" }
            - call: "POST /licensing/rate-schedules/${bmi_id}/publish"
              payload: {}
              as: LicensingAdmin
              captures: { err_publish: "$.data.error_id" }
            - call: "POST /licensing/fee-assessments/${bmi_id}/pay"
              payload: { amount_cents: -5 }
              as: VenueOperator
              as_user_id: "${bmi_id}"
              captures: { err_pay: "$.data.error_id" }
          assert:
            - "${err_submit} is ERR_APPLICATION_NOT_FOUND and ${err_publish} is ERR_RATE_SCHEDULE_NOT_FOUND, both HTTP 404"
            - "${err_review} is ERR_APPLICATION_NOT_FOUND, not ERR_INVALID_REQUEST, even though the disposition is outside the enum: path resolution at priority 3 outranks payload validation at priority 5"
            - "${err_pay} is ERR_ASSESSMENT_NOT_FOUND, not ERR_INVALID_REQUEST for the negative amount and not ERR_UNAUTHORIZED for the operator's unrelated venue"
            - "No row was written by any of the four calls: GET /licensing/license-applications and GET /licensing/fee-assessments both return total_count == 0"
            - "Society.${bmi_id}.version is unchanged, so an action on the wrong collection never touches the row that does own the id"

  - section: rbac
    instances:
      - name: corner_rbac_venue_operator_cannot_touch_society_side_writes
        claim_type: role_denied
        grounds:
          - rbac.LicensingAdmin.exclusive_operations
          - rbac.VenueOperator.shared_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "A VenueOperator is denied every society-side write even on rows that concern its own venue, and the denial is a 403 role failure, not a 404, because the role check at priority 2 runs before path resolution at priority 3."
        test_recipe:
          setup:
            - "Society BMI and Venue V1 exist; V1's id is the operator's X-User-ID"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id", v1_v0: "$.data.version" }
          trigger:
            - call: "POST /licensing/societies"
              payload: { society_code: "SESAC", display_name: "SESAC", repertoire_share_bp: 500 }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { err_soc: "$.data.error_id" }
            - call: "PATCH /licensing/venues/${v1_id}"
              payload: { annual_cover_revenue_cents: 1 }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { err_patch: "$.data.error_id" }
            - call: "POST /licensing/venues/${v1_id}/exemption-analysis"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { err_exempt: "$.data.error_id" }
            - call: "POST /licensing/repertoire-works"
              payload: { society_id: "${bmi_id}", title: "Blue Horizon", writer_name: "A. Reed" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { err_work: "$.data.error_id" }
          assert:
            - "All four calls returned HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE: ${err_soc}, ${err_patch}, ${err_exempt} and ${err_work}"
            - "The PATCH and the exemption analysis address the operator's OWN venue ${v1_id} and are still denied, so ownership does not grant society-side rights"
            - "Venue.${v1_id}.version is still ${v1_v0} and annual_cover_revenue_cents is still 4200000, so no denied call wrote anything"
            - "GET /licensing/societies as the same operator returns HTTP 200, so reads are shared while writes are exclusive"
            - "The same four calls as LicensingAdmin all succeed, which proves the denial came from the role and not from the payloads"

      - name: corner_rbac_auditor_and_officer_cannot_cross_the_settlement_line
        claim_type: role_denied
        grounds:
          - rbac.ComplianceAuditor.exclusive_operations
          - rbac.SettlementOfficer.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "The two audit-side roles are peers, not a hierarchy: the auditor who may open a case and issue findings may not offer or accept money, and the settlement officer who negotiates may not open a case or issue findings."
        test_recipe:
          setup:
            - "Venue V2 has an AuditCase whose findings were issued by ComplianceAuditor auditor-1"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "CONCERT_HALL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_ch_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_ch_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Riverside Concert Hall", venue_category: "CONCERT_HALL", seating_capacity: 1200, standing_capacity: 0, occupancy_limit: 1300, music_use_profile: "LIVE_ONLY", weekly_live_performance_nights: 5, annual_cover_revenue_cents: 62000000 }
              as: LicensingAdmin
              captures: { v2_id: "$.data.id" }
            - call: "POST /licensing/audit-cases"
              payload: { venue_id: "${v2_id}", audit_trigger: "ROUTINE", lookback_start: "2025-01-01T00:00:00Z", lookback_end: "2026-05-01T00:00:00Z", society_ids: ["${bmi_id}"] }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { case_id: "$.data.id" }
            - call: "POST /licensing/audit-cases/${case_id}/findings"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { case_floor: "$.data.settlement_floor_cents", case_total: "$.data.settlement_total_cents" }
          trigger:
            - call: "POST /licensing/audit-cases/${case_id}/settlement-offer"
              payload: { offer_amount_cents: 1500000 }
              as: ComplianceAuditor
              as_user_id: "auditor-2"
              captures: { err_offer: "$.data.error_id" }
            - call: "POST /licensing/audit-cases/${case_id}/close"
              payload: {}
              as: SettlementOfficer
              as_user_id: "settlement-1"
              captures: { err_close: "$.data.error_id" }
            - call: "POST /licensing/audit-cases"
              payload: { venue_id: "${v2_id}", audit_trigger: "COMPLAINT", lookback_start: "2025-01-01T00:00:00Z", lookback_end: "2026-05-01T00:00:00Z", society_ids: ["${bmi_id}"] }
              as: SettlementOfficer
              as_user_id: "settlement-1"
              captures: { err_open: "$.data.error_id" }
            - call: "POST /licensing/audit-cases/${case_id}/settlement-offer"
              payload: { offer_amount_cents: 1500000 }
              as: SettlementOfficer
              as_user_id: "settlement-1"
              captures: { ok_status: "$.data.status" }
          assert:
            - "${err_offer}, ${err_close} and ${err_open} are all ERR_FORBIDDEN_ROLE with HTTP 403"
            - "auditor-2 is a different auditor from the one who issued findings, so the offer denial is about the role and not about segregation of duties"
            - "The same offer as SettlementOfficer settlement-1 succeeded and ${ok_status} is SETTLEMENT_PROPOSED, so only the role differed"
            - "AuditCase.${case_id}.findings_issued_by_user_id is still auditor-1 and no second case exists: GET /licensing/audit-cases?venue_id=${v2_id} returns total_count == 1"
            - "Both roles may still read the case: GET /licensing/audit-cases/${case_id} returns HTTP 200 for auditor-2 and for settlement-1"

      - name: corner_rbac_segregation_of_duties_blocks_the_findings_author
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_10_ERR_SEGREGATION_OF_DUTIES
          - entities.AuditCase.fields.findings_issued_by_user_id
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "Segregation is compared on X-User-ID and not on role: the same human acting as SettlementOfficer is refused with ERR_SEGREGATION_OF_DUTIES on the very case whose findings they issued, while any other user in that role is accepted."
        test_recipe:
          setup:
            - "Venue V2's AuditCase has FINDINGS_ISSUED with findings_issued_by_user_id == auditor-1 and settlement_floor_cents 1442293"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "CONCERT_HALL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_ch_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_ch_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Riverside Concert Hall", venue_category: "CONCERT_HALL", seating_capacity: 1200, standing_capacity: 0, occupancy_limit: 1300, music_use_profile: "LIVE_ONLY", weekly_live_performance_nights: 5, annual_cover_revenue_cents: 62000000 }
              as: LicensingAdmin
              captures: { v2_id: "$.data.id" }
            - call: "POST /licensing/audit-cases"
              payload: { venue_id: "${v2_id}", audit_trigger: "ROUTINE", lookback_start: "2025-01-01T00:00:00Z", lookback_end: "2026-05-01T00:00:00Z", society_ids: ["${bmi_id}"] }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { case_id: "$.data.id" }
            - call: "POST /licensing/audit-cases/${case_id}/findings"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { case_floor: "$.data.settlement_floor_cents", case_total: "$.data.settlement_total_cents" }
