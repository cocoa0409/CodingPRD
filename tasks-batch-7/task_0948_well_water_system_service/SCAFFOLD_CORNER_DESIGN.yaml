          setup:
            - "The same emergency work order as corner_calc_warranty_part_and_labor_windows_diverge_from_one_completion: completed 2026-06-01T12:00:00Z with one POSTED consumption row, so a PART coverage expiring 2027-06-01T12:00:00Z and a LABOR coverage expiring 2026-08-30T12:00:00Z exist."
