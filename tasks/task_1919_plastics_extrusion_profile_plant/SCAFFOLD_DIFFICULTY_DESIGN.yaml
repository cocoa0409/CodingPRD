# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1919 Plastics Extrusion & Profile Plant. 9 rules x >=2 instances = 21.
# Canonical fixture: index points 2026-06=100.00, 2026-07=120.00, 2026-08=140.00;
# profile "wall" dim nominal 2.00 tol ±0.10 ucl 2.05 lcl 1.95, subgroup 3,
# sample_every_m 2000, resin_content 0.8 kg/m, speed window [10, 40];
# die cost 500000 cents, committed 10000 m / 8000 kg, buffer 4 h, screw [40,90];
# formulation PVC/RED LDR 25.0 MAXP 20; lots V 3000kg, C 100kg, R 100kg;
# WO 5000 m, cut 2000 mm, bundle 25, base price 1000 cents/m.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: amortization_per_meter_vs_per_kg
        grounds:
          - calculations.tooling_amortization_credit
          - entities.Die.fields.amortization_mode
          - entities.Die.fields.remaining_balance_cents
        distinguishing_aspect: |
          Same tooling cost, same committed volumes, same run output (4000 m, 3000 kg):
          PER_METER credits 4000*50.0000=200000 cents while PER_KG credits
          3000*62.5000=187500 cents — the two modes diverge on identical run data
          because actual kg-per-metre (0.75) deviates from the committed ratio (0.8).
          Entity domain: Die tooling cost accounting.
        test_recipe:
          setup:
            - "Two dies on one profile, identical cost/commitments, die_a PER_METER, die_b PER_KG, both QUALIFIED"
            - "Two lines (60mm screw), one QC_RELEASED batch per run, two CONFIRMED work orders (5000 m each)"
            - "Each run completed with good_length_mm=4000000, good_weight_kg=3000, trim_scrap_kg=50 after 2 in-control samples"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlantManager }
            - { call: "POST /resin-index-points", payload: { month: "2026-06", index_cents_per_kg: 100.0 }, as: PlantManager }
            - { call: "POST /resin-index-points", payload: { month: "2026-07", index_cents_per_kg: 120.0 }, as: PlantManager }
            - { call: "POST /resin-index-points", payload: { month: "2026-08", index_cents_per_kg: 140.0 }, as: PlantManager }
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust}", profile_code: "P-100", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof: $.data.id }
            - call: "POST /dies"
              payload: { profile_id: "${prof}", die_code: "D-A", tooling_cost_cents: 500000, committed_length_m: 10000, committed_weight_kg: 8000, amortization_mode: "PER_METER", buffer_hours: 4, min_screw_mm: 40, max_screw_mm: 90 }
              as: ProcessEngineer
              captures: { die_a: $.data.id }
            - { call: "POST /dies/${die_a}/transition", payload: { to: "TRIAL" }, as: ProcessEngineer }
            - { call: "POST /dies/${die_a}/transition", payload: { to: "QUALIFIED" }, as: ProcessEngineer }
            - call: "POST /dies"
              payload: { profile_id: "${prof}", die_code: "D-B", tooling_cost_cents: 500000, committed_length_m: 10000, committed_weight_kg: 8000, amortization_mode: "PER_KG", buffer_hours: 4, min_screw_mm: 40, max_screw_mm: 90 }
              as: ProcessEngineer
              captures: { die_b: $.data.id }
            - { call: "POST /dies/${die_b}/transition", payload: { to: "TRIAL" }, as: ProcessEngineer }
            - { call: "POST /dies/${die_b}/transition", payload: { to: "QUALIFIED" }, as: ProcessEngineer }
            - call: "POST /lines"
              payload: { line_code: "L-1", screw_diameter_mm: 60 }
              as: ProcessEngineer
              captures: { line_a: $.data.id }
            - call: "POST /lines"
              payload: { line_code: "L-2", screw_diameter_mm: 60 }
              as: ProcessEngineer
              captures: { line_b: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_kind: "VIRGIN", resin_type: "PVC", color_family: "NATURAL", received_kg: 3000, supplier_lot_ref: "SUP-V1" }
              as: LineOperator
              captures: { lot_v: $.data.id }
            - { call: "POST /resin-lots/${lot_v}/qc", payload: { outcome: "PASS" }, as: QualityInspector }
            - call: "POST /resin-lots"
              payload: { lot_kind: "COLORANT", resin_type: "PVC", color_family: "RED", received_kg: 100, supplier_lot_ref: "SUP-C1" }
              as: LineOperator
              captures: { lot_c: $.data.id }
            - { call: "POST /resin-lots/${lot_c}/qc", payload: { outcome: "PASS" }, as: QualityInspector }
            - call: "POST /resin-lots"
              payload: { lot_kind: "REGRIND", resin_type: "PVC", color_family: "RED", received_kg: 100, supplier_lot_ref: "SUP-R1" }
              as: LineOperator
              captures: { lot_r: $.data.id }
            - { call: "POST /resin-lots/${lot_r}/qc", payload: { outcome: "PASS" }, as: QualityInspector }
            - call: "POST /formulations"
              payload: { profile_id: "${prof}", formula_code: "F-RED25", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 25.0, max_regrind_pct: 20 }
              as: ProcessEngineer
              captures: { form: $.data.id }
            - call: "POST /blend-batches"
              payload: { formulation_id: "${form}", virgin_lot_id: "${lot_v}", regrind_lot_id: "${lot_r}", colorant_lot_id: "${lot_c}", target_batch_kg: 1000 }
              as: LineOperator
              captures: { batch_a: $.data.id }
            - { call: "POST /blend-batches/${batch_a}/qc", payload: { action: "RELEASE" }, as: QualityInspector }
            - call: "POST /blend-batches"
              payload: { formulation_id: "${form}", virgin_lot_id: "${lot_v}", colorant_lot_id: "${lot_c}", target_batch_kg: 1000 }
              as: LineOperator
              captures: { batch_b: $.data.id }
            - { call: "POST /blend-batches/${batch_b}/qc", payload: { action: "RELEASE" }, as: QualityInspector }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust}", profile_id: "${prof}", formulation_id: "${form}", die_id: "${die_a}", ordered_length_m: 5000, cut_length_mm: 2000, pieces_per_bundle: 25, base_unit_price_cents_per_m: 1000 }
              as: SalesEngineer
              captures: { wo_a: $.data.id }
            - { call: "POST /work-orders/${wo_a}/confirm", payload: {}, as: SalesEngineer }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust}", profile_id: "${prof}", formulation_id: "${form}", die_id: "${die_b}", ordered_length_m: 5000, cut_length_mm: 2000, pieces_per_bundle: 25, base_unit_price_cents_per_m: 1000 }
              as: SalesEngineer
              captures: { wo_b: $.data.id }
            - { call: "POST /work-orders/${wo_b}/confirm", payload: {}, as: SalesEngineer }
            - call: "POST /line-assignments"
              payload: { work_order_id: "${wo_a}", die_id: "${die_a}", line_id: "${line_a}", planned_start: "2026-08-10T10:00:00Z", planned_end: "2026-08-10T12:00:00Z" }
              as: ProcessEngineer
              captures: { asg_a: $.data.id }
            - { call: "POST /line-assignments/${asg_a}/activate", payload: {}, as: ProcessEngineer }
            - call: "POST /line-assignments"
              payload: { work_order_id: "${wo_b}", die_id: "${die_b}", line_id: "${line_b}", planned_start: "2026-08-10T10:00:00Z", planned_end: "2026-08-10T12:00:00Z" }
              as: ProcessEngineer
              captures: { asg_b: $.data.id }
            - { call: "POST /line-assignments/${asg_b}/activate", payload: {}, as: ProcessEngineer }
            - call: "POST /runs"
              payload: { assignment_id: "${asg_a}", batch_id: "${batch_a}", line_speed_mpm: 25 }
              as: LineOperator
              captures: { run_a: $.data.id }
            - { call: "POST /spc-samples", payload: { run_id: "${run_a}", dimension_name: "wall", measurements: [2.0, 2.02, 1.98] }, as: LineOperator }
            - { call: "POST /spc-samples", payload: { run_id: "${run_a}", dimension_name: "wall", measurements: [2.01, 1.99, 2.0] }, as: LineOperator }
            - { call: "POST /runs/${run_a}/complete", payload: { good_length_mm: 4000000, good_weight_kg: 3000, trim_scrap_kg: 50 }, as: LineOperator }
            - call: "POST /runs"
              payload: { assignment_id: "${asg_b}", batch_id: "${batch_b}", line_speed_mpm: 25 }
              as: LineOperator
              captures: { run_b: $.data.id }
            - { call: "POST /spc-samples", payload: { run_id: "${run_b}", dimension_name: "wall", measurements: [2.0, 2.02, 1.98] }, as: LineOperator }
            - { call: "POST /spc-samples", payload: { run_id: "${run_b}", dimension_name: "wall", measurements: [2.01, 1.99, 2.0] }, as: LineOperator }
            - { call: "POST /runs/${run_b}/complete", payload: { good_length_mm: 4000000, good_weight_kg: 3000, trim_scrap_kg: 50 }, as: LineOperator }
          trigger:
            - { call: "GET /dies/${die_a}", payload: {}, as: PlantManager }
            - { call: "GET /dies/${die_b}", payload: {}, as: PlantManager }
          assert:
            - "Die.${die_a}.amortized_cents == 200000 (4000 m * 50.0000 cents/m)"
            - "Die.${die_a}.remaining_balance_cents == 300000"
            - "Die.${die_b}.amortized_cents == 187500 (3000 kg * 62.5000 cents/kg)"
            - "Die.${die_b}.remaining_balance_cents == 312500"
            - "Die.${die_a}.amortized_cents != Die.${die_b}.amortized_cents for identical run data"

      - name: pass_through_monthly_avg_vs_shipment_date
        grounds:
          - calculations.resin_price_pass_through
          - entities.Customer.fields.resin_index_basis
          - entities.WorkOrder.fields.pass_through_adj_cents_per_m
        distinguishing_aspect: |
          Same quote index (100.00 at 2026-06), same index history (100/120/140):
          repriced at clock 2026-08, MONTHLY_AVG averages the window {06,07,08} to
          120.00 giving adj 13.60, while SHIPMENT_DATE takes the single 2026-08
          point 140.00 giving adj 27.20. Entity domain: WorkOrder pricing.
        test_recipe:
          setup:
            - "Two customers differing only in resin_index_basis; one profile+formulation+die per customer"
            - "Two QUOTED work orders created at clock 2026-06 (quote_index 100.00), base price 1000 cents/m, resin_content 0.8 kg/m"
            - "Clock then advanced to 2026-08-01; index points 2026-06=100.00, 2026-07=120.00, 2026-08=140.00"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlantManager }
            - { call: "POST /resin-index-points", payload: { month: "2026-06", index_cents_per_kg: 100.0 }, as: PlantManager }
            - { call: "POST /resin-index-points", payload: { month: "2026-07", index_cents_per_kg: 120.0 }, as: PlantManager }
            - { call: "POST /resin-index-points", payload: { month: "2026-08", index_cents_per_kg: 140.0 }, as: PlantManager }
            - call: "POST /customers"
              payload: { name: "Avg Co", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust_ma: $.data.id }
            - call: "POST /customers"
              payload: { name: "Spot Co", resin_index_basis: "SHIPMENT_DATE", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust_sd: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust_ma}", profile_code: "P-MA", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof_ma: $.data.id }
            - call: "POST /dies"
              payload: { profile_id: "${prof_ma}", die_code: "D-MA", tooling_cost_cents: 500000, committed_length_m: 10000, committed_weight_kg: 8000, amortization_mode: "PER_METER", buffer_hours: 4, min_screw_mm: 40, max_screw_mm: 90 }
              as: ProcessEngineer
              captures: { die_ma: $.data.id }
            - call: "POST /formulations"
              payload: { profile_id: "${prof_ma}", formula_code: "F-MA", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 25.0, max_regrind_pct: 20 }
              as: ProcessEngineer
              captures: { form_ma: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust_sd}", profile_code: "P-SD", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof_sd: $.data.id }
            - call: "POST /dies"
              payload: { profile_id: "${prof_sd}", die_code: "D-SD", tooling_cost_cents: 500000, committed_length_m: 10000, committed_weight_kg: 8000, amortization_mode: "PER_METER", buffer_hours: 4, min_screw_mm: 40, max_screw_mm: 90 }
              as: ProcessEngineer
              captures: { die_sd: $.data.id }
            - call: "POST /formulations"
              payload: { profile_id: "${prof_sd}", formula_code: "F-SD", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 25.0, max_regrind_pct: 20 }
              as: ProcessEngineer
              captures: { form_sd: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_ma}", profile_id: "${prof_ma}", formulation_id: "${form_ma}", die_id: "${die_ma}", ordered_length_m: 5000, cut_length_mm: 2000, pieces_per_bundle: 25, base_unit_price_cents_per_m: 1000 }
              as: SalesEngineer
              captures: { wo_ma: $.data.id, wo_ma_v: $.data.version }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_sd}", profile_id: "${prof_sd}", formulation_id: "${form_sd}", die_id: "${die_sd}", ordered_length_m: 5000, cut_length_mm: 2000, pieces_per_bundle: 25, base_unit_price_cents_per_m: 1000 }
              as: SalesEngineer
              captures: { wo_sd: $.data.id, wo_sd_v: $.data.version }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /work-orders/${wo_ma}/reprice", payload: { expected_work_order_version: "${wo_ma_v}" }, as: SalesEngineer }
            - { call: "POST /work-orders/${wo_sd}/reprice", payload: { expected_work_order_version: "${wo_sd_v}" }, as: SalesEngineer }
          assert:
            - "WorkOrder.${wo_ma}.pass_through_adj_cents_per_m == 13.60 ((120.00-100.00)*0.8*0.85)"
            - "WorkOrder.${wo_ma}.current_unit_price_cents_per_m == 1013.60"
            - "WorkOrder.${wo_ma}.status == QUOTED (reprice self-loop)"
            - "WorkOrder.${wo_sd}.pass_through_adj_cents_per_m == 27.20 ((140.00-100.00)*0.8*0.85)"
            - "WorkOrder.${wo_sd}.current_unit_price_cents_per_m == 1027.20"
            - "WorkOrder.${wo_ma}.pass_through_adj_cents_per_m != WorkOrder.${wo_sd}.pass_through_adj_cents_per_m on identical index history"

  - rule_id: combinatorial_formula
    instances:
      - name: purge_transition_tiers
        grounds:
          - calculations.purge_scrap_estimate
          - entities.PurgeEvent.fields.transition_class
          - entities.ExtrusionLine.fields.screw_diameter_mm
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: a 4-way
          transition-class branch x 3-tier screw factor x grade multiplier.
          On a 60mm line (factor 1.6, STANDARD grade): RED->BLACK same resin is
          LIGHT_TO_DARK (rank 3<4) = 4.0*1.6 = 6.40 kg, while PVC->ABS is
          RESIN_CHANGE = 12.0*1.6 = 19.20 kg.
        test_recipe:
          setup:
            - "One extrusion line with screw_diameter_mm=60 (screw factor tier 2 = 1.6)"
          setup_api_calls:
            - call: "POST /lines"
              payload: { line_code: "L-1", screw_diameter_mm: 60 }
              as: ProcessEngineer
              captures: { line: $.data.id }
          trigger:
            - call: "POST /purge-events"
              payload: { line_id: "${line}", from_resin_type: "PVC", to_resin_type: "PVC", from_color_family: "RED", to_color_family: "BLACK", purge_grade: "STANDARD" }
              as: LineOperator
              captures: { pe_a_class: $.data.transition_class, pe_a_scrap: $.data.scrap_kg }
            - call: "POST /purge-events"
              payload: { line_id: "${line}", from_resin_type: "PVC", to_resin_type: "ABS", from_color_family: "RED", to_color_family: "RED", purge_grade: "STANDARD" }
              as: LineOperator
              captures: { pe_b_class: $.data.transition_class, pe_b_scrap: $.data.scrap_kg }
            - call: "POST /purge-events"
              payload: { line_id: "${line}", from_resin_type: "PVC", to_resin_type: "ABS", from_color_family: "RED", to_color_family: "RED", purge_grade: "HIGH_EFFICIENCY" }
              as: LineOperator
              captures: { pe_c_scrap: $.data.scrap_kg }
          assert:
            - "PurgeEvent A transition_class == SAME_RESIN_LIGHT_TO_DARK and scrap_kg == 6.40 (4.0*1.6*1.0)"
            - "PurgeEvent B transition_class == RESIN_CHANGE and scrap_kg == 19.20 (12.0*1.6*1.0)"
            - "PurgeEvent C scrap_kg == 13.44 (12.0*1.6*0.7) — grade multiplier branch"

      - name: blend_nested_rounding
        grounds:
          - calculations.blend_composition
          - entities.BlendBatch.fields.colorant_kg
          - entities.BlendBatch.fields.actual_regrind_pct
          - entities.ResinLot.fields.consumed_kg
        distinguishing_aspect: |
          Mode (b) — nested rounding with pinned order: colorant rounded FIRST to
          0.1 kg (1000/26 = 38.4615 -> 38.5), then regrind rounded and capped by
          availability (min(192.3, 100) = 100.0), virgin as unrounded remainder
          (861.5). A sum-then-round order would yield different draws.
        test_recipe:
          setup:
            - "Formulation F-RED25: PVC/RED, let_down_ratio 25.0, max_regrind_pct 20"
            - "Lots QC_PASSED: virgin PVC 3000 kg, colorant PVC/RED 100 kg, regrind PVC/RED 100 kg"
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust}", profile_code: "P-100", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof: $.data.id }
            - call: "POST /formulations"
              payload: { profile_id: "${prof}", formula_code: "F-RED25", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 25.0, max_regrind_pct: 20 }
              as: ProcessEngineer
              captures: { form: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_kind: "VIRGIN", resin_type: "PVC", color_family: "NATURAL", received_kg: 3000, supplier_lot_ref: "SUP-V1" }
              as: LineOperator
              captures: { lot_v: $.data.id }
            - { call: "POST /resin-lots/${lot_v}/qc", payload: { outcome: "PASS" }, as: QualityInspector }
            - call: "POST /resin-lots"
              payload: { lot_kind: "COLORANT", resin_type: "PVC", color_family: "RED", received_kg: 100, supplier_lot_ref: "SUP-C1" }
              as: LineOperator
              captures: { lot_c: $.data.id }
            - { call: "POST /resin-lots/${lot_c}/qc", payload: { outcome: "PASS" }, as: QualityInspector }
            - call: "POST /resin-lots"
              payload: { lot_kind: "REGRIND", resin_type: "PVC", color_family: "RED", received_kg: 100, supplier_lot_ref: "SUP-R1" }
              as: LineOperator
              captures: { lot_r: $.data.id }
            - { call: "POST /resin-lots/${lot_r}/qc", payload: { outcome: "PASS" }, as: QualityInspector }
          trigger:
            - call: "POST /blend-batches"
              payload: { formulation_id: "${form}", virgin_lot_id: "${lot_v}", regrind_lot_id: "${lot_r}", colorant_lot_id: "${lot_c}", target_batch_kg: 1000 }
              as: LineOperator
              captures: { batch: $.data.id }
          assert:
            - "BlendBatch.${batch}.colorant_kg == 38.5 (round_half_up(1000/26, 1) — first rounding)"
            - "BlendBatch.${batch}.regrind_kg == 100.0 (min(round_half_up(961.5*0.20,1)=192.3, available 100))"
            - "BlendBatch.${batch}.virgin_kg == 861.5 (remainder 961.5-100.0, not re-rounded)"
            - "BlendBatch.${batch}.actual_regrind_pct == 10.40"
            - "ResinLot.${lot_v}.consumed_kg == 861.5"
            - "ResinLot.${lot_r}.consumed_kg == 100.0 and ResinLot.${lot_r}.available_kg == 0"
            - "ResinLot.${lot_r}.status == DEPLETED (available_kg hit exactly 0)"

      - name: invoice_pinned_evaluation_order
        grounds:
          - calculations.closeout_invoice_total
          - entities.WorkOrder.fields.invoice_total_cents
          - entities.Die.fields.amortized_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency resolved by pinned order: the
          tooling surcharge (10% of product charges) is CAPPED by
          die.remaining_balance_cents, which was itself settled by per-run
          amortization credits on the same output being invoiced. Product
          charges first, surcharge cap second: 8,000,000 + min(100,000,
          800,000) = 8,100,000 cents, and the die ends fully amortized.
        test_recipe:
          setup:
            - "One MONTHLY_AVG customer (clock pinned at 2026-06 so adj=0; final unit price stays 1000 cents/m)"
            - "WO 5000 m confirmed; assignment activated; two runs of 4000 m each completed (die credited 2 x 200,000 = 400,000; remaining 100,000)"
            - "Second run's completion bubbles the order IN_PRODUCTION -> CLOSED (8000 >= 5000)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlantManager }
            - { call: "POST /resin-index-points", payload: { month: "2026-06", index_cents_per_kg: 100.0 }, as: PlantManager }
            - { call: "POST /resin-index-points", payload: { month: "2026-07", index_cents_per_kg: 120.0 }, as: PlantManager }
            - { call: "POST /resin-index-points", payload: { month: "2026-08", index_cents_per_kg: 140.0 }, as: PlantManager }
