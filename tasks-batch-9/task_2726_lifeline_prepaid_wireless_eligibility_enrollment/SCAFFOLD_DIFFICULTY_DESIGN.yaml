            - call: "GET /lifeline/providers/${prov_a_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { t0_total: $.data.devices_total_count, t0_stock: $.data.devices_in_stock_count, t0_issued: $.data.devices_issued_count, t0_reclaim: $.data.devices_reclaim_pending_count, t0_retired: $.data.devices_retired_count }
            - call: "POST /lifeline/enrollments/${enr1_id}/device-issuance"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { picked_device_id: $.data.id }
            - call: "GET /lifeline/providers/${prov_a_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { t1_total: $.data.devices_total_count, t1_stock: $.data.devices_in_stock_count, t1_issued: $.data.devices_issued_count, t1_reclaim: $.data.devices_reclaim_pending_count, t1_retired: $.data.devices_retired_count }
            - call: "POST /lifeline/enrollments/${enr1_id}/de-enroll"
              payload: { de_enrollment_reason: "SUBSCRIBER_REQUEST", note: "moving in with family" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
            - call: "GET /lifeline/providers/${prov_a_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { t2_total: $.data.devices_total_count, t2_stock: $.data.devices_in_stock_count, t2_issued: $.data.devices_issued_count, t2_reclaim: $.data.devices_reclaim_pending_count, t2_retired: $.data.devices_retired_count }
            - call: "POST /lifeline/devices/${picked_device_id}/return"
              payload: { return_condition: "GOOD" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
            - call: "GET /lifeline/providers/${prov_a_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { t3_total: $.data.devices_total_count, t3_stock: $.data.devices_in_stock_count, t3_issued: $.data.devices_issued_count, t3_reclaim: $.data.devices_reclaim_pending_count, t3_retired: $.data.devices_retired_count }
          assert:
            - "${picked_device_id} == ${dev1_id}"
            - "${t0_total} == 3 and ${t0_stock} == 3 and ${t0_issued} == 0 and ${t0_reclaim} == 0 and ${t0_retired} == 0"
            - "${t1_total} == 3 and ${t1_stock} == 2 and ${t1_issued} == 1 and ${t1_reclaim} == 0 and ${t1_retired} == 0"
            - "${t2_total} == 3 and ${t2_stock} == 2 and ${t2_issued} == 0 and ${t2_reclaim} == 1 and ${t2_retired} == 0"
            - "${t3_total} == 3 and ${t3_stock} == 3 and ${t3_issued} == 0 and ${t3_reclaim} == 0 and ${t3_retired} == 0"
            - "${t3_total} == ${t0_total} and ${t3_stock} == ${t0_stock} and ${t3_issued} == ${t0_issued} and ${t3_reclaim} == ${t0_reclaim} and ${t3_retired} == ${t0_retired}"
            - "at every one of the four sample points total == in_stock + issued + reclaim_pending + retired"
            - "Device.${dev1_id}.status == IN_STOCK"
            - "Device.${dev1_id}.return_condition == GOOD"
            - "Device.${dev1_id}.returned_at == 2026-08-01T00:00:00Z"
            - "Device.${dev2_id}.status == IN_STOCK"
            - "Device.${dev3_id}.status == IN_STOCK"
            - "Enrollment.${enr1_id}.device_status == AWAITING_DEVICE"
            - "Enrollment.${enr1_id}.device_issuance_count == 1"
            - "Enrollment.${enr1_id}.benefit_status == DE_ENROLLED"
