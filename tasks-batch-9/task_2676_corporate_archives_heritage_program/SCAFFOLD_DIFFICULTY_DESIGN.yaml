  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: preservation_budget_committed_restored_exactly_by_job_cancellation
        grounds:
          - calculations.preservation_budget_conservation
          - state_machines.MigrationJob.APPROVED_to_CANCELLED
          - entities.PreservationPlan.fields.budget_committed_cents
          - entities.PreservationPlan.fields.budget_spent_cents
        distinguishing_aspect: |
          Conserved quantity #1: MONEY on PreservationPlan. Approving two jobs commits
          46000 + 175266 = 221266; cancelling the larger one must subtract EXACTLY its
          committed_cost_cents and land back on 46000 with zero drift, while the
          cancelled job keeps its own committed_cost_cents of 175266 as a historical
          record and budget_spent_cents never moves off 0. The partner instance conserves
          physical units on an ArchivalItem instead, so the two conserved quantities are
          a money ledger and a custody triple.
        test_recipe:
          setup:
            - "A COMPLIANT StorageZone with max_overlapping_migration_jobs 3 holding two ACCESSIONED MAGNETIC_TAPE items: item-S (unit_count 10, GOOD) and item-L (unit_count 40, FAIR)."
            - "An ACTIVE PreservationPlan with budget_cents 300000 and budget_committed_cents 0."
            - "Job A on item-S costs 46000 (4200*10 -> no discount -> +4000 handling); job B on item-L costs 175266 (168000 -> 6% -> 157920 -> +9000 handling -> +8346 FAIR surcharge)."
            - "Both jobs are approved by preserv-b, so budget_committed_cents is 221266 before the trigger."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "INV-01", retention_years: 19, disposition_action: "TRANSFER", legal_citation: "Preservation Policy 5.25", min_appraisal_score_for_permanent: 74.00 }
              as: ArchivesDirector
