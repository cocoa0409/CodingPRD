            - "The cycle still advances to AWARDED, and the unsealing cascade leaves app1 at anonymity_status BREACHED (only SEALED and REDACTED applications unseal)"
            - "Release of installment 1 returns 409 ERR_CYCLE_POSTURE_FROZEN and the installment stays SCHEDULED with released_by null"
