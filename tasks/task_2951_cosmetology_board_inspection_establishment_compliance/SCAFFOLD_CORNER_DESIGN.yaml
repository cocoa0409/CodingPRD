          assert:
            - "both calls return HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "Establishment.${est_id}.station_count == 1"
            - "Workstation.${ws_id}.posted_practitioner_id is null and posting_status == MISSING_POSTING"
            - "GET /cosmetology/workstations?establishment_id=${est_id} returns total_count == 1"

      - name: rbac_owner_scope_is_confined_to_their_own_establishment_and_is_unauthorized_across_salons
        claim_type: ownership_scope
        grounds:
          - validations.priority_14.ERR_UNAUTHORIZED
          - validations.priority_4.ERR_UNAUTHORIZED
          - rbac.EstablishmentOwner.shared_operations
        distinguishing_aspect: "An entity_backed EstablishmentOwner is scoped by X-User-ID: owner A adding a station to salon B is 403 ERR_UNAUTHORIZED rather than 404, so a caller cannot probe for row existence, and an X-User-ID that resolves to no Establishment at all is likewise 403 and not 404."
        test_recipe:
          setup:
            - "Two establishments: 'Owner Salon A' and 'Owner Salon B', each with station_capacity 4 and no stations."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Owner Salon A", establishment_type: "SALON", county_code: "ADT", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_a_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Owner Salon B", establishment_type: "SALON", county_code: "ADU", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_b_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/establishments/${est_b_id}/workstations"
              payload: { station_number: 1, station_type: "STYLING_CHAIR" }
              as: EstablishmentOwner
              as_user_id: "${est_a_id}"
            - call: "POST /cosmetology/establishments/${est_a_id}/workstations"
              payload: { station_number: 1, station_type: "STYLING_CHAIR" }
              as: EstablishmentOwner
              as_user_id: "00000000-0000-4000-8000-0000000000c1"
            - call: "POST /cosmetology/establishments/${est_a_id}/workstations"
              payload: { station_number: 1, station_type: "STYLING_CHAIR" }
              as: EstablishmentOwner
              as_user_id: "${est_a_id}"
              captures: { ws_a_id: $.data.id }
          assert:
            - "the cross-salon call returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED and NOT ERR_ESTABLISHMENT_NOT_FOUND"
            - "the unresolvable-owner call returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED and NOT ERR_ESTABLISHMENT_NOT_FOUND"
            - "the own-salon call returns HTTP 201"
            - "Workstation.${ws_a_id}.establishment_id == ${est_a_id} and station_number == 1"
            - "Establishment.${est_a_id}.station_count == 1 and Establishment.${est_b_id}.station_count == 0"

      - name: rbac_absent_blank_or_unknown_role_headers_are_unauthenticated_before_authorization
        claim_type: authentication
        grounds:
          - validations.priority_1.ERR_UNAUTHENTICATED
          - validations.priority_2.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Authentication is settled before authorization and before existence: omitting X-User-ID, sending it as the empty string, and sending an X-User-Role that names no declared role all return 401 ERR_UNAUTHENTICATED — the unknown role is explicitly NOT the 403 ERR_UNAUTHORIZED that a declared-but-wrong role would earn."
        test_recipe:
          setup:
            - "Establishment 'Auth Salon' exists only so the target path resolves."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Auth Salon", establishment_type: "SALON", county_code: "ADV", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
          trigger:
            - call: "GET /cosmetology/establishments/${est_id}"
              payload: {}
              as: BoardAdmin
              as_user_id: "(X-User-ID header omitted entirely)"
            - call: "GET /cosmetology/establishments/${est_id}"
              payload: {}
              as: BoardAdmin
              as_user_id: ""
            - call: "GET /cosmetology/establishments/${est_id}"
              payload: {}
              as: "CountyHealthClerk (X-User-Role naming no role declared in §1.7)"
              as_user_id: "clerk-001"
            - call: "GET /cosmetology/establishments/${est_id}"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "the omitted-header call returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the empty-string X-User-ID call returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED (the header is present but blank, which priority 1 treats as absent)"
            - "the unknown-role call returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED and NOT 403 ERR_UNAUTHORIZED"
            - "the properly authenticated call returns HTTP 200 with the establishment body"
            - "every error body carries response_type == error and a non-empty data.message"

      - name: rbac_segregation_of_duties_between_inspector_and_presiding_officer
        claim_type: segregation_of_duties
        excluded_because:
          difficulty_instance: citation_amendment_cycle_loops_back_to_contested_until_rounds_exhausted
          rationale: "Segregation of duties is already exercised twice: the §1.8 cyclic instance schedules both rounds before officers distinct from the conducting inspector, and the §1.9 validations instance validation_presiding_officer_may_not_be_the_conducting_inspector pins the 403 ERR_SEGREGATION_OF_DUTIES refusal when the inspector is named as presiding officer."

  - section: cross_cutting_layers
    instances:
      - name: cross_cutting_stale_workstation_version_blocks_the_second_booth_rental_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.booth-rental-create-stale-workstation
          - errors.ERR_STALE_WORKSTATION_VERSION
          - endpoints.POST_/cosmetology/booth-rentals
        distinguishing_aspect: "Creating the first rental itself bumps Workstation.version, so a caller still holding the version it read before that create is refused with 412 ERR_STALE_WORKSTATION_VERSION — even though the second term is adjacent and therefore raises no ERR_BOOTH_RENTAL_OVERLAP — and the identical payload succeeds once the fresh version is re-read."
        test_recipe:
          setup:
            - "Establishment 'OCC Salon' with STYLING_CHAIR station 1 and a STUDENT practitioner 'Hana Brecht'."
          setup_api_calls:
            - call: "POST /cosmetology/practitioners"
              payload: { full_name: "Hana Brecht", license_type: "COSMETOLOGIST" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { prac_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "OCC Salon", establishment_type: "SALON", county_code: "ADW", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/establishments/${est_id}/workstations"
              payload: { station_number: 1, station_type: "STYLING_CHAIR" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { ws_id: $.data.id, ws_v1: $.data.version }
            - call: "POST /cosmetology/booth-rentals"
              payload: { workstation_id: "${ws_id}", practitioner_id: "${prac_id}", rental_type: "BOOTH_RENTER", term_start_at: "2026-08-01T00:00:00Z", term_end_at: "2026-09-01T00:00:00Z", monthly_rent_cents: 70000, expected_workstation_version: "${ws_v1}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { rental1_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/booth-rentals"
              payload: { workstation_id: "${ws_id}", practitioner_id: "${prac_id}", rental_type: "BOOTH_RENTER", term_start_at: "2026-09-01T00:00:00Z", term_end_at: "2026-10-01T00:00:00Z", monthly_rent_cents: 70000, expected_workstation_version: "${ws_v1}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "GET /cosmetology/workstations/${ws_id}"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { ws_v2: $.data.version }
            - call: "POST /cosmetology/booth-rentals"
              payload: { workstation_id: "${ws_id}", practitioner_id: "${prac_id}", rental_type: "BOOTH_RENTER", term_start_at: "2026-09-01T00:00:00Z", term_end_at: "2026-10-01T00:00:00Z", monthly_rent_cents: 70000, expected_workstation_version: "${ws_v2}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { rental2_id: $.data.id }
          assert:
            - "the stale-version call returns HTTP 412 with data.error_id == ERR_STALE_WORKSTATION_VERSION and NOT ERR_BOOTH_RENTAL_OVERLAP"
            - "the re-read version ${ws_v2} is exactly 1 greater than ${ws_v1}, the first rental create having bumped the station"
            - "the retried call returns HTTP 201"
            - "BoothRental.${rental2_id}.status == PROPOSED, term_start_at == 2026-09-01T00:00:00.000Z and term_end_at == 2026-10-01T00:00:00.000Z"
            - "BoothRental.${rental1_id}.status is still PROPOSED"
            - "GET /cosmetology/booth-rentals?workstation_id=${ws_id} returns total_count == 2"

      - name: cross_cutting_stale_inspection_version_blocks_citation_issuance
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.citation-create-stale-inspection
          - errors.ERR_STALE_INSPECTION_VERSION
          - endpoints.POST_/cosmetology/citations
        distinguishing_aspect: "The version captured at submit is already stale by the time finalize has run, so issuing the citation with it is refused with 412 ERR_STALE_INSPECTION_VERSION rather than 409 ERR_INSPECTION_NOT_FINALIZED — the inspection IS finalized, the caller's view of it simply predates the board's scoring."
        test_recipe:
          setup:
            - "One MINOR violation code REC-968 (base_points 2.0, fine_cents_base 3000)."
            - "Establishment 'OCC Citation Salon' has an inspection that has been submitted (version captured) and then finalized at 2.00."
          setup_api_calls:
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "REC-968", category: "RECORDKEEPING", severity: "MINOR", base_points: 2.0, fine_cents_base: 3000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "OCC Citation Salon", establishment_type: "SALON", county_code: "ADX", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T17:00:00Z", inspector_user_id: "insp-076" }
              as: Inspector
              as_user_id: "insp-076"
              captures: { insp_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "insp-076"
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_id}", observed_count: 1, corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-076"
            - call: "POST /cosmetology/inspections/${insp_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-076"
              captures: { insp_v_submit: $.data.version }
            - call: "POST /cosmetology/inspections/${insp_id}/finalize"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { insp_v_final: $.data.version }
          trigger:
            - call: "POST /cosmetology/citations"
              payload: { inspection_id: "${insp_id}", subject_type: "ESTABLISHMENT", expected_inspection_version: "${insp_v_submit}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/citations"
              payload: { inspection_id: "${insp_id}", subject_type: "ESTABLISHMENT", expected_inspection_version: "${insp_v_final}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { cit_id: $.data.id }
          assert:
            - "the stale-version call returns HTTP 412 with data.error_id == ERR_STALE_INSPECTION_VERSION and NOT ERR_INSPECTION_NOT_FINALIZED"
            - "${insp_v_final} is greater than ${insp_v_submit}"
            - "after the refusal Inspection.${insp_id}.citation_count == 0 and Establishment.${est_id}.outstanding_fine_total_cents == 0"
            - "the fresh-version call returns HTTP 201 with status ISSUED and total_due_cents == 5250"
            - "Inspection.${insp_id}.citation_count == 1"

      - name: cross_cutting_every_mutating_write_advances_the_touched_entity_versions
        claim_type: optimistic_concurrency
        grounds:
          - endpoints.POST_/cosmetology/establishments/{id}/workstations
          - endpoints.POST_/cosmetology/booth-rentals
          - entities.Establishment.fields.station_count
        distinguishing_aspect: "Version movement is not confined to the entity named in the URL: adding a station bumps the PARENT establishment's version (because station_count is re-derived), and creating a rental bumps the WORKSTATION's version even though the row created is a BoothRental — so each write advances every entity whose derived state it touched, by exactly one."
        test_recipe:
          setup:
            - "A STUDENT practitioner 'Ivo Marchetti' and establishment 'Version Salon' with station_capacity 4 and no stations."
          setup_api_calls:
            - call: "POST /cosmetology/practitioners"
              payload: { full_name: "Ivo Marchetti", license_type: "BARBER" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { prac_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Version Salon", establishment_type: "BARBERSHOP", county_code: "ADY", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id, est_v0: $.data.version }
          trigger:
            - call: "POST /cosmetology/establishments/${est_id}/workstations"
              payload: { station_number: 1, station_type: "STYLING_CHAIR" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { ws_id: $.data.id, ws_v0: $.data.version }
            - call: "GET /cosmetology/establishments/${est_id}"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_v1: $.data.version }
            - call: "POST /cosmetology/booth-rentals"
              payload: { workstation_id: "${ws_id}", practitioner_id: "${prac_id}", rental_type: "BOOTH_RENTER", term_start_at: "2026-08-01T00:00:00Z", monthly_rent_cents: 60000, expected_workstation_version: "${ws_v0}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { rental_id: $.data.id }
            - call: "GET /cosmetology/workstations/${ws_id}"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { ws_v1: $.data.version }
          assert:
            - "all four calls succeed (201, 200, 201, 200)"
            - "${est_v1} == ${est_v0} + 1 — the child create advanced the parent establishment exactly once"
            - "${ws_v1} == ${ws_v0} + 1 — the rental create advanced the workstation exactly once"
            - "Establishment.${est_id}.station_count == 1 and foot_spa_biofilm_current == true"
            - "Workstation.${ws_id}.posting_status == MISSING_POSTING and last_biofilm_cycle_at is null"
            - "BoothRental.${rental_id}.status == PROPOSED"

      - name: cross_cutting_one_open_critical_citation_forces_restricted_posture_and_settling_it_resets
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.establishment_demerit_and_posture
          - entities.Establishment.fields.open_critical_citation_count
          - entities.Establishment.fields.compliance_posture
        distinguishing_aspect: "This is the instantaneous arm of the posture gate rather than the cumulative one: with demerit_balance only 10.00 — below the WATCH threshold of 20.00 — a single OPEN citation whose max_finding_severity is CRITICAL is enough to force RESTRICTED, and settling that citation resets the posture to CLEAR while the 10.00 demerits stay on the ledger."
        test_recipe:
          setup:
            - "One CRITICAL violation code CRT-969 (base_points 2.0, fine_cents_base 20000): FINAL score = 2.0 x 5.0 x 1 x 1.0 = 10.00, assessed 20000, fee 20000 x 0.05 = 1000, total 21000."
            - "Establishment 'Threshold Salon' has a FINALIZED ROUTINE inspection carrying that single CRITICAL finding, so demerit_balance is 10.00 and posture is CLEAR before any citation exists."
          setup_api_calls:
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "CRT-969", category: "SANITATION", severity: "CRITICAL", base_points: 2.0, fine_cents_base: 20000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Threshold Salon", establishment_type: "SALON", county_code: "ADZ", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T17:00:00Z", inspector_user_id: "insp-077" }
              as: Inspector
              as_user_id: "insp-077"
              captures: { insp_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "insp-077"
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_id}", observed_count: 1, corrected_on_site: false, note: "Contaminated implements in the clean drawer." }
              as: Inspector
              as_user_id: "insp-077"
            - call: "POST /cosmetology/inspections/${insp_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-077"
            - call: "POST /cosmetology/inspections/${insp_id}/finalize"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { insp_v: $.data.version }
          trigger:
            - call: "POST /cosmetology/citations"
              payload: { inspection_id: "${insp_id}", subject_type: "ESTABLISHMENT", expected_inspection_version: "${insp_v}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { cit_id: $.data.id }
            - call: "POST /cosmetology/citations/${cit_id}/payments"
              payload: { amount_cents: 21000, payer_reference: "WIRE-3301" }
              as: EstablishmentOwner
              as_user_id: "${est_id}"
          assert:
            - "immediately after finalize Establishment.${est_id}.demerit_balance == 10.00, open_critical_citation_count == 0 and compliance_posture == CLEAR"
            - "Inspection.${insp_id}.final_adjusted_score == 10.00 and final_outcome == FAIL (a CRITICAL finding fails the visit even at a score inside the PASS band)"
            - "the citation create returns HTTP 201 with max_finding_severity == CRITICAL, assessed_fine_cents == 20000, administrative_fee_cents == 1000 and total_due_cents == 21000"
            - "after the citation Establishment.${est_id}.open_critical_citation_count == 1 and compliance_posture == RESTRICTED while demerit_balance is still 10.00"
            - "the payment returns HTTP 201 and Citation.${cit_id}.status == SETTLED"
            - "after settlement Establishment.${est_id}.open_critical_citation_count == 0, compliance_posture == CLEAR, outstanding_fine_total_cents == 0 and demerit_balance is still 10.00"

      - name: cross_cutting_cascading_side_effects_chain_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: finalize_score_to_ledger_to_balance_to_license_status_to_posture
          rationale: "The §1.8 transitive_cascade instance already verifies a five-hop chain from one write — score, ledger row, establishment balance, license_status and compliance_posture, ending in the PROPOSED-rental void and posting downgrade — which is exactly the cascading_side_effects layer claim."

      - name: cross_cutting_dual_variant_delta_between_provisional_and_final
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: apprentice_hour_credit_track_vs_school_equivalence_track
          rationale: "Both dual-variant calculations already have §1.8 instances contrasting the two variants over one unchanged data set — inspection_adjusted_score in inspection_score_provisional_vs_final_on_site_credit and practitioner_credited_hours here — so the layer's divergence and selection claims are covered."

  - section: consistency_model
    instances:
      - name: consistency_citation_response_already_carries_every_derived_money_field
        claim_type: immediate
        grounds:
          - endpoints.POST_/cosmetology/citations
          - calculations.citation_total_due_cents
        distinguishing_aspect: "The consistency model is immediate, so the citation create response itself must already contain the whole derivation — tier multiplier, assessed fine, administrative fee, total, outstanding and both deadlines — and the establishment's outstanding_fine_total_cents must already reflect it on a read issued right afterwards, with no second write or refresh step."
        test_recipe:
          setup:
            - "One MAJOR violation code SAN-970 (base_points 4.0, fine_cents_base 12000): FINAL score = 4.0 x 2.5 x 1 x 1.0 = 10.00, tier 1.00, assessed 12000, fee 12000 x 0.05 = 600, total 12600."
            - "Establishment 'Immediate Salon' has a FINALIZED ROUTINE inspection carrying that single finding; the clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "SAN-970", category: "SANITATION", severity: "MAJOR", base_points: 4.0, fine_cents_base: 12000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Immediate Salon", establishment_type: "SALON", county_code: "AEA", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T17:00:00Z", inspector_user_id: "insp-078" }
              as: Inspector
              as_user_id: "insp-078"
              captures: { insp_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "insp-078"
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_id}", observed_count: 1, corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-078"
            - call: "POST /cosmetology/inspections/${insp_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-078"
            - call: "POST /cosmetology/inspections/${insp_id}/finalize"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { insp_v: $.data.version }
          trigger:
            - call: "POST /cosmetology/citations"
              payload: { inspection_id: "${insp_id}", subject_type: "ESTABLISHMENT", expected_inspection_version: "${insp_v}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { cit_id: $.data.id }
          assert:
            - "HTTP status is 201 and the response body itself carries citation_number non-null, status ISSUED, demerit_tier_multiplier 1.00, max_finding_severity MAJOR, assessed_fine_cents 12000, administrative_fee_cents 600, total_due_cents 12600 and outstanding_fine_cents 12600"
            - "the same response body carries issued_at 2026-08-01T00:00:00.000Z, due_at 2026-08-31T00:00:00.000Z and contest_deadline_at 2026-08-21T00:00:00.000Z"
            - "a GET /cosmetology/establishments/${est_id} issued immediately afterwards shows outstanding_fine_total_cents == 12600, demerit_balance == 10.00, open_critical_citation_count == 0 and compliance_posture == CLEAR"
            - "GET /cosmetology/citations/${cit_id} returns exactly the same money fields as the create response"
            - "GET /cosmetology/ledger-entries?citation_id=${cit_id} returns total_count == 1 with delta_cents == 12600"

      - name: consistency_posting_projection_is_recomputed_within_the_request_that_changes_it
        claim_type: immediate
        grounds:
          - calculations.workstation_posting_status
          - endpoints.POST_/cosmetology/workstations/{id}/posting
          - endpoints.POST_/cosmetology/booth-rentals/{id}/activation
        distinguishing_aspect: "The projection is never stale by a request: the posting response already reads STALE_POSTING in the same body (an ACTIVE licence is posted but no ACTIVE rental yet covers the clock), and the activation response — which returns a BoothRental, not a Workstation — must have flipped the station to COMPLIANT by the time the immediately following read happens."
        test_recipe:
          setup:
            - "School 'Immediate Academy' (required_clock_hours 16.0) and practitioner 'Juno Vasilev' (COSMETOLOGIST) licensed ACTIVE effective 2026-08-01T00:00:00Z."
            - "Establishment 'Projection Salon' with STYLING_CHAIR station 1 and a PROPOSED rental for Juno covering 2026-08-01 onwards."
          setup_api_calls:
            - call: "POST /cosmetology/schools"
              payload: { name: "Immediate Academy", county_code: "AEB", required_clock_hours: 16.0, accreditation_status: "ACCREDITED" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { school_id: $.data.id }
            - call: "POST /cosmetology/practitioners"
              payload: { full_name: "Juno Vasilev", license_type: "COSMETOLOGIST", school_id: "${school_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { prac_id: $.data.id }
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${prac_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-06", discipline: "SANITATION", school_id: "${school_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${prac_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-07", discipline: "DISINFECTION", school_id: "${school_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/practitioners/${prac_id}/license-actions"
              payload: { action: "GRANT_EXAM_ELIGIBILITY" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/practitioners/${prac_id}/license-actions"
              payload: { action: "ISSUE_LICENSE", effective_at: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Projection Salon", establishment_type: "SALON", county_code: "AEC", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/establishments/${est_id}/workstations"
              payload: { station_number: 1, station_type: "STYLING_CHAIR" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { ws_id: $.data.id, ws_v1: $.data.version }
            - call: "POST /cosmetology/booth-rentals"
              payload: { workstation_id: "${ws_id}", practitioner_id: "${prac_id}", rental_type: "BOOTH_RENTER", term_start_at: "2026-08-01T00:00:00Z", monthly_rent_cents: 65000, expected_workstation_version: "${ws_v1}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { rental_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/workstations/${ws_id}/posting"
              payload: { posted_practitioner_id: "${prac_id}" }
              as: EstablishmentOwner
              as_user_id: "${est_id}"
              captures: { posted_prac_id: $.data.posted_practitioner_id }
            - call: "POST /cosmetology/booth-rentals/${rental_id}/activation"
              payload: {}
              as: EstablishmentOwner
              as_user_id: "${est_id}"
          assert:
            - "the posting call returns HTTP 200 and its OWN body already shows posted_practitioner_id == ${prac_id} with posting_status == STALE_POSTING"
            - "the activation call returns HTTP 200 with BoothRental.status == ACTIVE"
            - "a GET /cosmetology/workstations/${ws_id} issued immediately afterwards shows posting_status == COMPLIANT with no intervening write"
            - "Practitioner.${prac_id}.license_status == ACTIVE and license_expires_on == 2028-07-31"
            - "GET /cosmetology/booth-rentals?workstation_id=${ws_id}&status=ACTIVE returns total_count == 1"
