          assert:
            - "Trigger call 1: HTTP 200 with data.state still OPEN - detect-faults is a self-loop on OPEN and never advances the run"
            - "Trigger call 2: data.missing_minutes_last_scan == 1040 (1440 - 400), suspect_floor == round_half_up(1440/2, 0) == 720, so 1040 lands in [720, 1440) and data.health_status == SUSPECT with data.fault_count == 0 and data.last_fault_code == null"
            - "Trigger call 3: data.status is still ACTIVE and data.compliance_rate_rolling_30 == 1.0000 (one reported day in [2026-07-14, 2026-08-13), 400 >= 30 minutes) - a SUSPECT meter never evicts a household"
            - "Trigger call 4: HTTP 200 with data.state still OPEN"
            - "Trigger call 5: data.missing_minutes_last_scan == 2880 (2880 - 0 covered), data.health_status == FAULTED, data.last_fault_code == MISSING_INTERVALS and data.fault_count == 1"
            - "Trigger call 6: data.intab_count == 0 and data.fill_rate == 0.0000 - only the FAULTED escalation cascades the household to FAULT_HOLD"
            - "GET /households/${h30_id} after trigger call 4 reports status FAULT_HOLD with enumeration_verdict still COMPLIANT"

