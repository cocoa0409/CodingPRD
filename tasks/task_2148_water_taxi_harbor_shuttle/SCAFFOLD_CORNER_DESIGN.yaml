      - name: latest_annual_inspection_ignores_a_newer_pre_departure_failure
        claim_type: aggregation
        grounds: ["calculations.latest_annual_inspection", "entities.Vessel.fields.service_state", "entities.VesselInspection.fields.inspection_type"]
        distinguishing_aspect: |
          A PRE_DEPARTURE row with result FAIL and a later performed_on must not enter the ANNUAL aggregation,
          so the vessel still reads IN_SERVICE with annual_inspection_expires_on 2027-08-01.
        test_recipe:
          setup:
            - "One vessel with an ANNUAL PASS performed 2026-08-01 and a PRE_DEPARTURE FAIL performed 2026-09-10."
          setup_api_calls:
            - call: "POST /harbor/vessels"
              payload: { name: "Osprey", seat_capacity: 40, draft_m: 1.20, hull_class: "OFFSHORE", required_endorsement: "MASTER_25T" }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { vessel_id: $.data.id }
            - call: "POST /harbor/vessels/${vessel_id}/inspections"
              payload: { inspection_type: "ANNUAL", result: "PASS", deficiency_count: 0, performed_on: "2026-08-01" }
              as: MarineInspector
              as_user_id: "insp-1"
            - call: "POST /harbor/vessels/${vessel_id}/inspections"
              payload: { inspection_type: "PRE_DEPARTURE", result: "FAIL", deficiency_count: 4, performed_on: "2026-09-10" }
              as: MarineInspector
              as_user_id: "insp-1"
          trigger:
            - call: "GET /harbor/vessels/${vessel_id}"
