          One sweep call touches many children of two different types and must age each row against
          ITS OWN deadline, with `<=` at both boundaries: a submission whose response_deadline equals
          the clock expires, a quote whose expires_at equals the clock lapses, and rows with later
          deadlines are untouched — no all-or-nothing rollback. Rows already in a settled status
