  - rule_id: boundary_precision_check
    instances:
      - name: tender_rejection_pct_exactly_at_threshold_with_minimum_sample
        metric: "RateRecord.rejection_pct against AT_RISK_REJECTION_PCT 20.00, gated by MIN_TENDER_SAMPLE 5"
        endpoint: "POST /freight-procurement/rate-records/{id}/tender-events"
        grounds:
          - calculations.tender_acceptance_metrics
          - calculations.tender_acceptance_metrics.constants.AT_RISK_REJECTION_PCT
          - calculations.tender_acceptance_metrics.constants.MIN_TENDER_SAMPLE
          - state_machines.RateRecord.LIVE_to_AT_RISK
          - state_machines.RateRecord.AT_RISK_to_LIVE
        distinguishing_aspect: |
          Two boundaries interact on one metric: the rejection percentage boundary is
          inclusive at exactly 20.00 while the sample-size gate is inclusive at exactly 5.
          The walk 1/4 = 25.00 (above the percentage boundary but one tender short of the
          sample floor, so nothing fires) -> 1/5 = 20.00 exactly (fires, on an ACCEPTED
          tender) -> 1/6 = 16.67 (falls back below and unwinds) pins the >= comparisons and
          the 2dp rounding of a repeating decimal in a single sequence.
        test_recipe:
          setup:
            - "Single-lane awarded event for ALFL with the contract fully signed and its PRIMARY rate record LIVE from 2026-09-01, allocation ACTIVE, lane AWARDED."
            - "Three ACCEPTED tenders and one REJECTED tender already appended: tender_count 4, rejection_count 1, rejection_pct 25.00 — above the 20.00 threshold but below the sample floor of 5."
