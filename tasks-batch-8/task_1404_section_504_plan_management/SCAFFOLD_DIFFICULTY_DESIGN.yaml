            - call: "POST /plans/${plan_id}/record-parent-consent"
              payload: { granted: true, responded_by_parent_ref: "parent-OB" }
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "GET /teacher-acks?plan_id=${plan_id}&ack_status=PENDING"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { ack_id: '$.data[0].id' }
            - call: "POST /teacher-acks/${ack_id}/acknowledge"
              payload: {}
              as: Teacher
              as_user_id: "${t1_id}"
            # Plan ACTIVE. Schedule R1 (moves plan to UNDER_ANNUAL_REVIEW).
            - call: "POST /reviews"
              payload: { plan_id: "${plan_id}", review_type: "ANNUAL", scheduled_for: "2026-06-01T00:00:00Z" }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { rev1_id: $.data.id }
          trigger:
            # Attempt R2 while R1 still open (SCHEDULED)
            - call: "POST /reviews"
              payload: { plan_id: "${plan_id}", review_type: "PARENT_REQUESTED", scheduled_for: "2026-06-15T00:00:00Z" }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REVIEW_ALREADY_SCHEDULED (open-review capacity = 1 per plan; R2 rejected even though its scheduled_for is disjoint from R1)"
            - "ReviewEvent.${rev1_id}.review_status == SCHEDULED (unaffected)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (two different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: review_cancel_restores_plan_status
        grounds:
          - state_machines.ReviewEvent.SCHEDULED_to_CANCELLED
          - state_machines.Section504Plan
        distinguishing_aspect: |
          Conserved quantity: plan_status trajectory. Forward action
          (POST /reviews) flips plan ACTIVE → UNDER_ANNUAL_REVIEW; compensating
          action (POST /reviews/{id}/cancel) flips plan back UNDER_ANNUAL_REVIEW
          → ACTIVE. After the pair, plan.plan_status, student.section_504_status,
          and student.has_active_504_plan are identical to pre-forward values.
        test_recipe:
          setup:
            - "School S1 with ACTIVE plan P (effective 2026-01-01); Student STU in PLAN_ACTIVE; has_active_504_plan = true"
            - "Capture pre-action state"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-15T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "POST /schools"
              payload: { school_name: "Invariant School A", district_code: "D16", current_academic_year: "2025-2026" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { school_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_id}", staff_external_ref: "CO-IA", full_name: "Coord IA", staff_role: "COORDINATOR" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { co_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_id}", staff_external_ref: "T-IA", full_name: "Teacher IA", staff_role: "TEACHER" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { t1_id: $.data.id }
            - call: "POST /training-records"
              payload: { staff_id: "${t1_id}", training_topic: "SECTION_504_BASICS", trained_at: "2025-12-16T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "POST /students"
              payload: { school_id: "${school_id}", student_external_ref: "STU-IA", full_name: "Student IA", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 8 }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", referral_reason: "r", suspected_disability_category: "LEARNING" }
              as: Teacher
              as_user_id: "${t1_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/start-review"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /referrals/${ref_id}/initiate-evaluation"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /evaluations/${eval_id}/record-consent"
              payload: { granted: true, responded_by_parent_ref: "parent-IA" }
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /evaluations/${eval_id}/start"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /evaluations/${eval_id}/determine"
              payload: { determination_outcome: "ELIGIBLE", disability_impairment_found: true, major_life_activity_affected: true }
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "GET /students/${stu_id}"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { stu_v: $.data.version }
            - call: "POST /plans"
              payload: { student_id: "${stu_id}", evaluation_id: "${eval_id}", expected_student_version: "${stu_v}" }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /accommodations"
              payload: { plan_id: "${plan_id}", accommodation_type: "EXTENDED_TIME", description: "X", applies_to_testing: false }
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { plan_v: $.data.version }
            - call: "POST /plans/${plan_id}/submit-for-consent"
              payload: { expected_plan_version: "${plan_v}" }
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /plans/${plan_id}/record-parent-consent"
              payload: { granted: true, responded_by_parent_ref: "parent-IA" }
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "GET /teacher-acks?plan_id=${plan_id}&ack_status=PENDING"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { ack_id: '$.data[0].id' }
            - call: "POST /teacher-acks/${ack_id}/acknowledge"
              payload: {}
              as: Teacher
              as_user_id: "${t1_id}"
            # Plan ACTIVE. Capture pre-state.
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { pre_status: $.data.plan_status, pre_effective: $.data.plan_effective_date }
            - call: "GET /students/${stu_id}"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { pre_stu_status: $.data.section_504_status, pre_has_plan: $.data.has_active_504_plan }
          trigger:
            # Forward: schedule a review (plan ACTIVE -> UNDER_ANNUAL_REVIEW)
            - call: "POST /reviews"
              payload: { plan_id: "${plan_id}", review_type: "PARENT_REQUESTED", scheduled_for: "2026-06-01T00:00:00Z" }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { rev_id: $.data.id }
            # Compensating: cancel the review (plan UNDER_ANNUAL_REVIEW -> ACTIVE)
            - call: "POST /reviews/${rev_id}/cancel"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
          assert:
            - "Section504Plan.${plan_id}.plan_status == ACTIVE (restored — equals pre_status)"
            - "Section504Plan.${plan_id}.plan_effective_date == ${pre_effective} (unchanged — compensation does not re-anchor)"
            - "Student.${stu_id}.section_504_status == PLAN_ACTIVE (restored)"
            - "Student.${stu_id}.has_active_504_plan == true (restored)"
            - "ReviewEvent.${rev_id}.review_status == CANCELLED"

      - name: grievance_file_then_resolve_restores_posture_score
        grounds:
          - calculations.school_posture_derivation
          - state_machines.Grievance
        distinguishing_aspect: |
          Conserved quantity: school.composite_score and school_posture. Forward
          action (POST /grievances) adds +20 weight and may flip posture.
          Compensating action (POST /grievances/{id}/resolve) removes the +20
          and restores the prior composite_score and posture. Distinct conserved
          quantity from plan_status trajectory above (posture score vs plan
          lifecycle state).
        test_recipe:
          setup:
            - "School S1 with student STU; posture initially OPERATIONAL (composite 0)"
            - "Two District504Directors DIR1 and DIR2 registered (segregation: resolver != intake)"
            - "Coordinator CO takes intake"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "POST /schools"
              payload: { school_name: "Invariant School B", district_code: "D17", current_academic_year: "2025-2026" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { school_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_id}", staff_external_ref: "CO-IB", full_name: "Coord IB", staff_role: "COORDINATOR" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { co_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_id}", staff_external_ref: "DIR-IB", full_name: "Director IB", staff_role: "DISTRICT_DIRECTOR" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { dir_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${school_id}", student_external_ref: "STU-IB", full_name: "Student IB", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 8 }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { stu_id: $.data.id }
            - call: "GET /schools/${school_id}/compliance-summary"
              payload: {}
              as: District504Director
              as_user_id: "${dir_id}"
              captures: { pre_posture: $.data.posture, pre_score: $.data.composite_score }
          trigger:
            # Forward: file grievance (composite +20, posture stays OPERATIONAL since 20 < 30)
            - call: "POST /grievances"
              payload: { student_id: "${stu_id}", grievance_category: "NON_IMPLEMENTATION", description: "G", filed_by_parent_ref: "parent-IB" }
              as: Parent
              captures: { griev_id: $.data.id }
            - call: "POST /grievances/${griev_id}/begin-informal"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "GET /schools/${school_id}/compliance-summary"
              payload: {}
              as: District504Director
              as_user_id: "${dir_id}"
              captures: { mid_posture: $.data.posture, mid_score: $.data.composite_score }
            # Compensating: resolve grievance (composite back to 0)
            - call: "GET /grievances/${griev_id}"
              payload: {}
              as: District504Director
              as_user_id: "${dir_id}"
              captures: { griev_v: $.data.version }
            - call: "POST /grievances/${griev_id}/resolve"
              payload: { expected_grievance_version: "${griev_v}" }
              as: District504Director
              as_user_id: "${dir_id}"
            - call: "GET /schools/${school_id}/compliance-summary"
              payload: {}
              as: District504Director
              as_user_id: "${dir_id}"
              captures: { post_posture: $.data.posture, post_score: $.data.composite_score }
          assert:
            - "pre_posture == OPERATIONAL AND pre_score == 0"
            - "mid_posture == OPERATIONAL AND mid_score == 20 (forward action: +20)"
            - "post_posture == OPERATIONAL AND post_score == 0 (compensating action restored the conserved quantity)"
            - "Grievance.${griev_id}.grievance_status == RESOLVED"
