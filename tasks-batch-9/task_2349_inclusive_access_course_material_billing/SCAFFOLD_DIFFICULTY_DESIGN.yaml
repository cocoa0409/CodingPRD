# ============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: inclusive-access-course-material-billing (task 2349)
# Every instance grounds only in SCAFFOLD.yaml 1.1-1.7. Logical clock default
# is 2026-08-01T00:00:00Z; every chain sets it explicitly anyway.
# Pinned fixture arithmetic (FA26: total_term_days = 110):
#   PUB-A: admin_fee 0.05, bookstore_margin 0.12, floor 2500, cap 0.60,
#          rebate_threshold 16500, rebate_pct 0.03
#   T1 list 18000, tiers [1,2]->9000 and [3,null]->7500
#     n=2 -> max(2500, min(round(9000*1.05)=9450, floor(18000*0.60)=10800)) = 9450
#     n=3 -> max(2500, min(round(7500*1.05)=7875, 10800))                   = 7875
#   publisher_share = round(net*0.88): 9450->8316, 7875->6930, 6300->5544
# ============================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_tier_basis_posting_snapshot_versus_census_date
        grounds:
          - calculations.per_student_negotiated_price
          - entities.CourseSection.fields.billing_basis_enrollment_count
          - entities.AcademicTerm.fields.census_date
          - entities.StudentCharge.fields.gross_price_cents
          - endpoints[GET /sections/{section_id}/billing-summary]
        distinguishing_aspect: |
          The dual variant lives in the STUDENT PRICING domain: the same three enrolled students
          resolve to tier [1,2] under the posting-snapshot basis (frozen count 2 -> 9450 cents per
          student) and to tier [3,null] under the census-date basis (count 3 -> 7875 cents), a
          1575-cent divergence on identical stored data, and the production charge always uses the
          frozen posting basis.
        test_recipe:
          setup:
            - "Term FA26 OPEN; PUB-A ACTIVE; title T1 with tiers [1,2]->9000 and [3,null]->7500."
            - "Section ECON-101-001 flagged, two students charged on day one, so billing_basis_enrollment_count is frozen at 2."
            - "A third student enrolls on 2026-09-01 (before census_date 2026-09-08) and is charged singly."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15", opt_out_window_days: 14 }
              as: ProgramAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terms/${term_id}/open"
              as: ProgramAdmin
            - call: "POST /agreements"
              payload: { publisher_name: "Northgate Academic", agreement_code: "PUB-A", effective_from: "2026-07-01", effective_to: "2027-01-01", admin_fee_pct: 0.05, bookstore_margin_pct: 0.12, price_floor_cents: 2500, rebate_threshold_cents: 16500, rebate_pct: 0.03, max_list_price_pct: 0.60 }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /titles"
              payload: { agreement_id: "${agr_id}", isbn: "978-0-11-000001-0", title: "Principles of Economics", list_price_cents: 18000, format: "DIGITAL" }
              as: ProgramAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 1, max_enrollment: 2, per_student_price_cents: 9000 }
              as: ProgramAdmin
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 3, per_student_price_cents: 7500 }
              as: ProgramAdmin
            - call: "POST /agreements/${agr_id}/activate"
              as: ProgramAdmin
            - call: "POST /sections"
              payload: { term_id: "${term_id}", subject_code: "ECON", catalog_number: "101", section_number: "001", instructor_user_id: "fac-1", max_concurrent_titles: 2 }
              as: Registrar
              captures: { sec_id: $.data.id, sec_v: $.data.version }
            - call: "POST /adoptions"
              payload: { section_id: "${sec_id}", title_id: "${t1_id}", access_start_date: "2026-08-24", access_end_date: "2026-12-12", expected_section_version: "${sec_v}" }
              as: Faculty
              as_user_id: "fac-1"
              captures: { adopt1_id: $.data.id }
            - call: "POST /adoptions/${adopt1_id}/submit"
              as: Faculty
              as_user_id: "fac-1"
            - call: "POST /adoptions/${adopt1_id}/approve"
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /sections/${sec_id}/flag-inclusive-access"
              as: ProgramAdmin
            - call: "POST /students"
              payload: { external_id: "S-1001", full_name: "Ada Lin", email: "ada@u.edu", program_code: "ECON-BA" }
              as: Registrar
              captures: { stu1_id: $.data.id }
            - call: "POST /students"
              payload: { external_id: "S-1002", full_name: "Ben Ortiz", email: "ben@u.edu", program_code: "ECON-BA" }
              as: Registrar
              captures: { stu2_id: $.data.id }
            - call: "POST /students"
              payload: { external_id: "S-1003", full_name: "Cara Wu", email: "cara@u.edu", program_code: "ECON-BA" }
              as: Registrar
              captures: { stu3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /enrollments"
              payload: { section_id: "${sec_id}", student_id: "${stu1_id}", enrolled_on: "2026-08-24" }
              as: Registrar
              captures: { enr1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { section_id: "${sec_id}", student_id: "${stu2_id}", enrolled_on: "2026-08-24" }
              as: Registrar
              captures: { enr2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sections/${sec_id}/post-charges"
              as: BursarOfficer
              captures: { chg1_id: "$.data[0].id", chg2_id: "$.data[1].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /enrollments"
              payload: { section_id: "${sec_id}", student_id: "${stu3_id}", enrolled_on: "2026-09-01" }
              as: Registrar
              captures: { enr3_id: $.data.id }
            - call: "POST /enrollments/${enr3_id}/post-charge"
              as: BursarOfficer
              captures: { chg3_id: $.data.id }
          trigger:
            - call: "GET /sections/${sec_id}/billing-summary"
              as: ProgramAdmin
          assert:
            - "response.data.billing_basis_enrollment_count == 2"
            - "response.data.tier_basis_posting_count == 2"
            - "response.data.tier_basis_census_count == 3"
            - "response.data.gross_per_student_posting_cents == 9450"
            - "response.data.gross_per_student_census_cents == 7875"
            - "response.data.gross_per_student_posting_cents - response.data.gross_per_student_census_cents == 1575"
            - "StudentCharge.${chg3_id}.gross_price_cents == 9450 (production uses the frozen posting basis, never the census basis)"
            - "StudentCharge.${chg3_id}.proration_pct == 1.0000 and billed_amount_cents == 9450 (2026-09-01 is on or before add_drop_deadline 2026-09-04)"
            - "response.data.charge_count == 3 and response.data.total_net_billed_cents == 28350"
            - "response.data.total_publisher_share_cents == 24948"

      - name: dual_variant_reconciliation_enrollment_snapshot_versus_access_days_weighted
        grounds:
          - calculations.reconciliation_totals
          - calculations.publisher_share_per_charge
          - entities.ReconciliationRun.fields.method
          - state_machines.PublisherAgreement.COMPUTED_to_COMPUTED
          - state_machines.ReconciliationRun.COMPUTED_to_SUPERSEDED
        distinguishing_aspect: |
          The dual variant lives in the PUBLISHER SETTLEMENT domain (a different entity domain from
          the student-pricing instance): after one granted opt-out on 2026-09-02, ENROLLMENT_SNAPSHOT
          invoices 8316 cents over 1 billable student while ACCESS_DAYS_WEIGHTED invoices 8996 cents
          over 2 billable students, because the refunded charge still earns 9 of 110 access days
          (weight 0.0818 -> 680 cents).
        test_recipe:
          setup:
            - "Base FA26 fixture: two charges of 9450 cents on section ECON-101-001, publisher share 8316 each."
            - "Student S-1001 opts out on 2026-09-02T10:00:00Z and the bursar grants it, so charge 1 is REFUNDED and its access is REVOKED that day."
            - "No reconciliation run exists yet, so PUB-A.reconciliation_status is NOT_STARTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15", opt_out_window_days: 14 }
              as: ProgramAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terms/${term_id}/open"
              as: ProgramAdmin
            - call: "POST /agreements"
              payload: { publisher_name: "Northgate Academic", agreement_code: "PUB-A", effective_from: "2026-07-01", effective_to: "2027-01-01", admin_fee_pct: 0.05, bookstore_margin_pct: 0.12, price_floor_cents: 2500, rebate_threshold_cents: 16500, rebate_pct: 0.03, max_list_price_pct: 0.60 }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /titles"
              payload: { agreement_id: "${agr_id}", isbn: "978-0-11-000001-0", title: "Principles of Economics", list_price_cents: 18000, format: "DIGITAL" }
              as: ProgramAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 1, max_enrollment: 2, per_student_price_cents: 9000 }
              as: ProgramAdmin
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 3, per_student_price_cents: 7500 }
              as: ProgramAdmin
            - call: "POST /agreements/${agr_id}/activate"
              as: ProgramAdmin
            - call: "POST /sections"
              payload: { term_id: "${term_id}", subject_code: "ECON", catalog_number: "101", section_number: "001", instructor_user_id: "fac-1", max_concurrent_titles: 2 }
              as: Registrar
              captures: { sec_id: $.data.id, sec_v: $.data.version }
            - call: "POST /adoptions"
              payload: { section_id: "${sec_id}", title_id: "${t1_id}", access_start_date: "2026-08-24", access_end_date: "2026-12-12", expected_section_version: "${sec_v}" }
              as: Faculty
              as_user_id: "fac-1"
              captures: { adopt1_id: $.data.id }
            - call: "POST /adoptions/${adopt1_id}/submit"
              as: Faculty
              as_user_id: "fac-1"
            - call: "POST /adoptions/${adopt1_id}/approve"
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /sections/${sec_id}/flag-inclusive-access"
              as: ProgramAdmin
            - call: "POST /students"
              payload: { external_id: "S-1001", full_name: "Ada Lin", email: "ada@u.edu", program_code: "ECON-BA" }
              as: Registrar
              captures: { stu1_id: $.data.id }
            - call: "POST /students"
              payload: { external_id: "S-1002", full_name: "Ben Ortiz", email: "ben@u.edu", program_code: "ECON-BA" }
              as: Registrar
              captures: { stu2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /enrollments"
              payload: { section_id: "${sec_id}", student_id: "${stu1_id}", enrolled_on: "2026-08-24" }
              as: Registrar
              captures: { enr1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { section_id: "${sec_id}", student_id: "${stu2_id}", enrolled_on: "2026-08-24" }
              as: Registrar
              captures: { enr2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sections/${sec_id}/post-charges"
              as: BursarOfficer
              captures: { chg1_id: "$.data[0].id", chg2_id: "$.data[1].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /opt-out-requests"
              payload: { charge_id: "${chg1_id}", reason_code: "OWNS_COPY" }
              as: Student
              as_user_id: "${stu1_id}"
              captures: { oo1_id: $.data.id }
            - call: "POST /opt-out-requests/${oo1_id}/grant"
              as: BursarOfficer
              as_user_id: "bo-1"
            - call: "GET /agreements/${agr_id}"
              as: ProgramAdmin
              captures: { agr_v1: $.data.version }
          trigger:
            - call: "POST /reconciliation-runs"
              payload: { agreement_id: "${agr_id}", term_id: "${term_id}", method: "ENROLLMENT_SNAPSHOT", publisher_reported_count: 1, publisher_reported_amount_cents: 8316, expected_agreement_version: "${agr_v1}" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { run_a_id: $.data.id }
            - call: "GET /agreements/${agr_id}"
              as: ProgramAdmin
              captures: { agr_v2: $.data.version }
            - call: "POST /reconciliation-runs"
              payload: { agreement_id: "${agr_id}", term_id: "${term_id}", method: "ACCESS_DAYS_WEIGHTED", publisher_reported_count: 2, publisher_reported_amount_cents: 8996, supersedes_run_id: "${run_a_id}", expected_agreement_version: "${agr_v2}" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { run_b_id: $.data.id }
          assert:
            - "ReconciliationRun.${run_a_id}.billable_count == 1"
            - "ReconciliationRun.${run_a_id}.opted_out_count == 1"
            - "ReconciliationRun.${run_a_id}.gross_invoice_cents == 8316"
            - "ReconciliationRun.${run_a_id}.rebate_cents == 0 and settlement_amount_cents == 8316 (8316 < rebate_threshold_cents 16500)"
            - "ReconciliationRun.${run_a_id}.variance_cents == 0"
            - "ReconciliationRun.${run_b_id}.billable_count == 2"
            - "ReconciliationRun.${run_b_id}.opted_out_count == 1"
            - "ReconciliationRun.${run_b_id}.gross_invoice_cents == 8996"
            - "ReconciliationRun.${run_b_id}.gross_invoice_cents - ReconciliationRun.${run_a_id}.gross_invoice_cents == 680"
            - "ReconciliationRun.${run_b_id}.variance_cents == 0 and count_variance == 0"
            - "ReconciliationRun.${run_a_id}.status == SUPERSEDED"
            - "PublisherAgreement.${agr_id}.reconciliation_status == COMPUTED"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_price_floor_overrides_list_price_cap
        grounds:
          - calculations.per_student_negotiated_price
          - entities.PublisherAgreement.fields.price_floor_cents
          - entities.PublisherAgreement.fields.max_list_price_pct
          - entities.StudentCharge.fields.gross_price_cents
        distinguishing_aspect: |
          Mode (a) - nested min/max ladder: the contractual floor is applied AFTER the list-price cap,
          so a title whose cap (1800) sits below the floor (2500) bills 2500, not 1800 and not the
          fee-loaded 2100; any other evaluation order yields a different number.
        test_recipe:
          setup:
            - "Term FA26 OPEN, PUB-A ACTIVE with price_floor_cents 2500 and max_list_price_pct 0.60."
            - "Cheap title T-LOW: list_price_cents 3000 with a single tier [1,null] -> 2000."
            - "Section STAT-050-001 flagged with T-LOW adopted; one student enrolled on day one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15", opt_out_window_days: 14 }
              as: ProgramAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terms/${term_id}/open"
              as: ProgramAdmin
            - call: "POST /agreements"
              payload: { publisher_name: "Northgate Academic", agreement_code: "PUB-A", effective_from: "2026-07-01", effective_to: "2027-01-01", admin_fee_pct: 0.05, bookstore_margin_pct: 0.12, price_floor_cents: 2500, rebate_threshold_cents: 16500, rebate_pct: 0.03, max_list_price_pct: 0.60 }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /titles"
              payload: { agreement_id: "${agr_id}", isbn: "978-0-11-000009-0", title: "Statistics Workbook", list_price_cents: 3000, format: "DIGITAL" }
              as: ProgramAdmin
              captures: { tlow_id: $.data.id }
            - call: "POST /titles/${tlow_id}/pricing-tiers"
              payload: { min_enrollment: 1, per_student_price_cents: 2000 }
              as: ProgramAdmin
            - call: "POST /agreements/${agr_id}/activate"
              as: ProgramAdmin
            - call: "POST /sections"
              payload: { term_id: "${term_id}", subject_code: "STAT", catalog_number: "050", section_number: "001", instructor_user_id: "fac-9", max_concurrent_titles: 2 }
              as: Registrar
              captures: { sec_id: $.data.id, sec_v: $.data.version }
            - call: "POST /adoptions"
              payload: { section_id: "${sec_id}", title_id: "${tlow_id}", access_start_date: "2026-08-24", access_end_date: "2026-12-12", expected_section_version: "${sec_v}" }
              as: Faculty
              as_user_id: "fac-9"
              captures: { adopt_id: $.data.id }
            - call: "POST /adoptions/${adopt_id}/submit"
              as: Faculty
              as_user_id: "fac-9"
            - call: "POST /adoptions/${adopt_id}/approve"
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /sections/${sec_id}/flag-inclusive-access"
              as: ProgramAdmin
            - call: "POST /students"
              payload: { external_id: "S-2001", full_name: "Dev Rao", email: "dev@u.edu", program_code: "STAT-BS" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /enrollments"
              payload: { section_id: "${sec_id}", student_id: "${stu_id}", enrolled_on: "2026-08-24" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /sections/${sec_id}/post-charges"
              as: BursarOfficer
              captures: { chg_id: "$.data[0].id" }
          assert:
            - "StudentCharge.${chg_id}.gross_price_cents == 2500"
            - "StudentCharge.${chg_id}.billed_amount_cents == 2500"
            - "StudentCharge.${chg_id}.net_billed_cents == 2500"
            - "StudentCharge.${chg_id}.publisher_share_cents == 2200"
            - "Student.${stu_id}.bursar_balance_cents == 2500"
            - "gross_price_cents != 1800 (the list cap floor(3000*0.60)) and != 2100 (the fee-loaded tier price)"

      - name: combinatorial_late_registration_ratio_rounded_before_multiplication
        grounds:
          - calculations.charge_proration_pct
          - entities.StudentCharge.fields.proration_pct
          - entities.StudentCharge.fields.billed_amount_cents
          - entities.Enrollment.fields.registration_type
        distinguishing_aspect: |
          Mode (b) - nested rounding order: with gross 7875 and a 2026-09-09 late registration the
          ratio is rounded to 4 decimals FIRST (94/110 -> 0.8545) giving 6729 cents, whereas
          multiplying by the unrounded ratio and rounding once gives 6730 - a one-cent fingerprint
          that only the pinned order reproduces.
        test_recipe:
          setup:
            - "Term FA26 OPEN; PUB-A ACTIVE; T1 tiers [1,2]->9000 and [3,null]->7500."
            - "Three students charged on day one so billing_basis_enrollment_count is frozen at 3 and every charge is 7875 cents."
            - "A fourth student registers late on 2026-09-09 (after add_drop_deadline 2026-09-04, before late_registration_cutoff_date 2026-09-18)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15", opt_out_window_days: 14 }
              as: ProgramAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terms/${term_id}/open"
              as: ProgramAdmin
            - call: "POST /agreements"
              payload: { publisher_name: "Northgate Academic", agreement_code: "PUB-A", effective_from: "2026-07-01", effective_to: "2027-01-01", admin_fee_pct: 0.05, bookstore_margin_pct: 0.12, price_floor_cents: 2500, rebate_threshold_cents: 16500, rebate_pct: 0.03, max_list_price_pct: 0.60 }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /titles"
              payload: { agreement_id: "${agr_id}", isbn: "978-0-11-000001-0", title: "Principles of Economics", list_price_cents: 18000, format: "DIGITAL" }
              as: ProgramAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 1, max_enrollment: 2, per_student_price_cents: 9000 }
              as: ProgramAdmin
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 3, per_student_price_cents: 7500 }
              as: ProgramAdmin
            - call: "POST /agreements/${agr_id}/activate"
