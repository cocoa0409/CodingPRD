          program_id: ${pgm}
          district_name: DA
          zone: ARTERIAL
        as: ProgramManager
        captures:
          dist: $.data.id
      - call: POST /streetlights/crews
        payload:
          program_id: ${pgm}
          crew_name: Crew-1
          base_stops_per_shift: 6
          hourly_rate_cents: 6000
