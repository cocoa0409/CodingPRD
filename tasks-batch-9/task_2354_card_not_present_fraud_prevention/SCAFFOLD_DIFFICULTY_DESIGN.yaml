          A state (41) vs business_fiscal (86) pair, 45 priority steps apart, on the
          policy-exception intake path: the request violates BOTH the locked-account
          state rule and the tier cap, and only the 409 ERR_CUSTOMER_ACCOUNT_LOCKED
          may surface.
        test_recipe:
          setup:
            - "A HIGH_VALUE customer exists whose account_status has been set to LOCKED (ato_posture stays CLEAR, so priority 42 does not fire)."
            - "TIER_EXCEPTION_CAP_CENTS[HIGH_VALUE] is 500000, so a 600000-cent request violates priority 86."
            - "Analyst AN1 exists to carry the RiskAnalyst X-User-ID."
          setup_api_calls:
            - call: "POST /fraud/customers"
              payload: { email: "vip@example.com", home_country: "US", tier: "HIGH_VALUE" }
              as: CheckoutService
              captures: { cust_id: $.data.id }
            - call: "POST /fraud/analysts"
              payload: { display_name: "AN1 Senior", seniority: "SENIOR", skill_families: ["IDENTITY"], shift_capacity_cases: 3 }
              as: PlatformAdmin
              captures: { an1_id: $.data.id }
            - call: "POST /fraud/customers/${cust_id}/posture"
              payload: { account_status: "LOCKED", reason: "manual review hold" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/policy-exceptions"
              payload: { customer_id: "${cust_id}", scope: "AUTO_APPROVE_UNDER_AMOUNT", max_amount_cents: 600000, effective_from: "2026-08-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", justification: "concierge account, waive score band" }
              as: RiskAnalyst
              as_user_id: "${an1_id}"
          assert:
            - "HTTP status == 409"
            - "error.error_id == ERR_CUSTOMER_ACCOUNT_LOCKED"
            - "error.error_id != ERR_EXCEPTION_AMOUNT_EXCEEDS_TIER_CAP"
            - "GET /fraud/policy-exceptions?customer_id=${cust_id} returns total_count == 0"
            - "Customer.${cust_id}.account_status == LOCKED"
            - "Customer.${cust_id}.version is unchanged by the rejected request"

      - name: escalated_lead_requirement_outranks_analyst_capacity
        grounds:
          - validations[priority=59]
          - validations[priority=76]
          - errors[ERR_ESCALATED_REQUIRES_LEAD]
          - errors[ERR_ANALYST_CAPACITY_EXCEEDED]
