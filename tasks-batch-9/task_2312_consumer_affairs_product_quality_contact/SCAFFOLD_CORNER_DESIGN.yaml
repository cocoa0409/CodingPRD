          assert:
            - "the CONSUMER_SEALED event is appended with sequence_no == 2 and HTTP 201 — a wrong seal is recorded, not rejected"
            - "immediately afterwards chain_integrity_status == \"BROKEN\", NOT \"PENDING\": rule (4) is already violated at 2 of 5 events"
            - "transit_hours == 96.00 is still computed on receive — the projection keeps producing numbers while BROKEN"
            - "after the fifth event the chain is complete and in the right order, yet chain_integrity_status is still \"BROKEN\" — no repair"
            - "lab-accept yields disposition == \"UNUSABLE\" and the complaint still advances to \"IN_RESOLUTION\""

