  - rule_id: non_linear_state_machine
    instances:
      - name: submission_review_cycle_loops_twice_then_hits_the_revision_ceiling
        grounds:
          - state_machines.CertificationSubmission.IN_REVIEW_to_RETURNED_FOR_INFO
          - state_machines.CertificationSubmission.RETURNED_FOR_INFO_to_SUBMITTED
          - state_machines.CertificationSubmission#conformance_review_state.RETURNED_to_PENDING
          - entities.CertificationSubmission.fields.revision_round
          - validations[priority=46]
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          The non-linear machine here is CertificationSubmission.state: it is CYCLIC on the review loop
          IN_REVIEW -> RETURNED_FOR_INFO -> SUBMITTED -> IN_REVIEW, the loop is bounded by
          MAX_REVISION_ROUNDS (2) rather than by reachability, and the loop is NOT idempotent on the
          ledger - the escrow is taken exactly once on the DRAFT -> SUBMITTED edge and is never taken
          again on the RETURNED_FOR_INFO -> SUBMITTED edge that closes the cycle.
        test_recipe:
          setup:
            - "One RATIFIED SB1 specification with two MANDATORY LIGHTING feature sets (20 and 10 cases)."
            - "One Member in onboarding_state TOOLS_GRANTED with good_standing true and 1000000 cents purchased."
            - "One CertificationSubmission with certification_fee_cents 150000, already moved DRAFT -> SUBMITTED so its fee is escrowed exactly once."
