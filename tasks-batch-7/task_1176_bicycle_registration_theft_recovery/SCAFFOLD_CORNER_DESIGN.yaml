            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/recovery-intakes/${i1_id}/mark-unclaimed", payload: {}, as: Registrar }
            - { call: "POST /registry/auctions", payload: { recovery_intake_id: "${i1_id}", starts_at: "2026-06-05T00:00:00Z", ends_at: "2026-06-10T00:00:00Z" }, as: Registrar, captures: { a1_id: $.data.id } }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/owners/register", payload: { email: "o2@x.com", password: "pw", full_name: "O Two" }, as: Anonymous, captures: { o2_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/auctions/${a1_id}/open", payload: {}, as: Registrar, captures: { v2: $.data.version } }
          trigger:
            - { call: "POST /registry/auctions/${a1_id}/bids", payload: { amount_cents: 20000, expected_auction_version: "${v2}" }, as: Owner, as_user_id: "${o1_id}", captures: { bid1_id: $.data.id } }
            - { call: "POST /registry/auctions/${a1_id}/bids", payload: { amount_cents: 21000, expected_auction_version: "${v2}" }, as: Owner, as_user_id: "${o2_id}", captures: { err: $.data.error_id } }
          assert:
            - "o1's bid (20000) accepted (id ${bid1_id}) and bumped the auction version"
            - "o2's bid carrying the pre-bid version ${v2}: error_id == ERR_STALE_VERSION (observed ${err}); http 412"

      - name: version_increments_on_every_mutation
        claim_type: occ_stale_conflict
        grounds: ["concurrency_rules[bicycle-patch-stale-version]"]
        distinguishing_aspect: "TheftReport version advances by exactly 1 per mutation: create=1, request-info=2, respond=3 — the OCC substrate common-fields contract."
        test_recipe:
          setup: ["Owner o1 with bicycle b1; report r1 UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "OCC300", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 40000, photo_url: "https://x/p.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${b1_id}", occurred_at: "2026-05-03T00:00:00Z", theft_location: "Rack" }, as: Owner, as_user_id: "${o1_id}", captures: { r1_id: $.data.id, r_v1: $.data.version } }
          trigger:
            - { call: "POST /registry/theft-reports/${r1_id}/request-info", payload: { info_request_text: "need receipt" }, as: Registrar, captures: { r_v2: $.data.version } }
            - { call: "POST /registry/theft-reports/${r1_id}/respond", payload: { response_text: "attached" }, as: Owner, as_user_id: "${o1_id}", captures: { r_v3: $.data.version } }
          assert:
            - "version sequence: ${r_v1} == 1, ${r_v2} == 2, ${r_v3} == 3 — one increment per mutation, including cascaded and action transitions"

