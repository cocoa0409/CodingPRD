              as: PropertyManager
              captures: { uv_id: $.data.id }
            - call: "POST /properties/${pv_id}/units/${uv_id}/assets"
              payload: { component_type: "HVAC", installed_on: "2026-07-25T00:00:00Z", warranty_months: 24, expected_life_months: 120, replacement_cost_cents: 400000 }
              as: PropertyManager
              captures: { av_id: $.data.id }
            - call: "POST /properties/${pv_id}/pm-task-templates"
              payload: { component_type: "HVAC", task_name: "HVAC svc", frequency_days: 7, estimated_labor_minutes: 30, requires_evidence: false, effective_from: "2026-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { tv_id: $.data.id }
            - call: "POST /properties"
              payload: { property_code: "CA-P2O", display_name: "Calc P2 Occupied", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { po_id: $.data.id }
            - call: "POST /properties/${po_id}/buildings"
              payload: { building_label: "A", floors: 1 }
              as: PropertyManager
              captures: { bo_id: $.data.id }
            - call: "POST /properties/${po_id}/buildings/${bo_id}/units"
              payload: { unit_number: "101", occupancy_status: "OCCUPIED" }
              as: PropertyManager
              captures: { uo_id: $.data.id }
            - call: "POST /properties/${po_id}/units/${uo_id}/assets"
              payload: { component_type: "HVAC", installed_on: "2026-07-25T00:00:00Z", warranty_months: 24, expected_life_months: 120, replacement_cost_cents: 400000 }
              as: PropertyManager
              captures: { ao_id: $.data.id }
            - call: "POST /properties/${po_id}/pm-task-templates"
              payload: { component_type: "HVAC", task_name: "HVAC svc", frequency_days: 7, estimated_labor_minutes: 30, requires_evidence: false, effective_from: "2026-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { to_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-29T00:00:00Z" }
