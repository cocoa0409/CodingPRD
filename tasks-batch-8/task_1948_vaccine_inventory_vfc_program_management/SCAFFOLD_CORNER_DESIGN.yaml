        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "Any endpoint called without X-User-ID or X-User-Role returns ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)."
        test_recipe:
