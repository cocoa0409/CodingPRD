# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7, walking references/claim-extraction-guide.md
# row-by-row. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) appear as
# `excluded_because:` stubs citing the covering instance by name.
# Every numeric literal below was produced by executing the §1.3 formulas as code.
scaffold_corner_design:
  - section: entities
    instances:
      - name: terminal_creation_returns_all_declared_fields_at_version_one
        claim_type: Creation
        grounds:
          - entities.Terminal
          - endpoints[POST /pipeline/terminals]
        distinguishing_aspect: |
          A terminal created with every declared input echoes all seven business fields plus the
          four common fields; inventory_bbl is server-initialised to 0 (it is source: computed and
          is never accepted from the body) and version starts at exactly 1.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
          trigger:
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "HOU", name: "Houston Origin", role_kind: "ORIGIN", shell_capacity_bbl: 500000, min_operating_inventory_bbl: 10000, injection_bays: 2 }
              as: TariffAdministrator
              captures: { org_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "response.response_type == object and response.meta.api_request_id is present"
            - "Terminal.${org_id}.terminal_code == HOU and Terminal.${org_id}.name == Houston Origin"
            - "Terminal.${org_id}.role_kind == ORIGIN"
            - "Terminal.${org_id}.shell_capacity_bbl == 500000"
            - "Terminal.${org_id}.min_operating_inventory_bbl == 10000"
            - "Terminal.${org_id}.injection_bays == 2"
            - "Terminal.${org_id}.inventory_bbl == 0"
            - "Terminal.${org_id}.version == 1"
            - "Terminal.${org_id}.id is a bare UUID with no type prefix and Terminal.${org_id}.created_at == Terminal.${org_id}.updated_at"

      - name: terminal_injection_bays_defaults_to_one_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Terminal.fields.injection_bays
          - endpoints[POST /pipeline/terminals]
        distinguishing_aspect: |
          injection_bays is the only optional input on POST /pipeline/terminals; omitting it must
          yield 1 (not 0 and not null), because calculations.terminal_bay_occupancy compares an
          overlap count against it and a null would make every reschedule ambiguous.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
          trigger:
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "NAS", name: "Nashville Delivery", role_kind: "DESTINATION", shell_capacity_bbl: 400000, min_operating_inventory_bbl: 5000 }
              as: TariffAdministrator
              captures: { dst_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Terminal.${dst_id}.injection_bays == 1"
            - "Terminal.${dst_id}.inventory_bbl == 0"
            - "Terminal.${dst_id}.role_kind == DESTINATION"

      - name: product_grade_is_transmix_grade_defaults_to_false_when_omitted
        claim_type: Defaults
        grounds:
          - entities.ProductGrade.fields.is_transmix_grade
          - endpoints[POST /pipeline/product-grades]
        distinguishing_aspect: |
          A shippable grade created without is_transmix_grade must read false, while a slop grade
          created with is_transmix_grade true must read true — the flag is never inferred from
          sequence_rank.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
          trigger:
            - call: "POST /pipeline/product-grades"
              payload: { grade_code: "ULSD", name: "Ultra Low Sulfur Diesel", sequence_rank: 3, max_sulfur_ppm: 15, max_rvp_psi: 12 }
              as: TariffAdministrator
              captures: { ulsd_id: "$.data.id" }
            - call: "POST /pipeline/product-grades"
              payload: { grade_code: "TRANSMIX", name: "Interface Transmix", sequence_rank: 9, max_sulfur_ppm: 5000, max_rvp_psi: 20, is_transmix_grade: true }
              as: TariffAdministrator
              captures: { tmx_id: "$.data.id" }
          assert:
            - "HTTP 201 on both calls"
            - "ProductGrade.${ulsd_id}.is_transmix_grade == false"
            - "ProductGrade.${ulsd_id}.sequence_rank == 3"
            - "ProductGrade.${tmx_id}.is_transmix_grade == true"
            - "ProductGrade.${tmx_id}.sequence_rank == 9"

      - name: shipping_history_record_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.ShippingHistoryRecord
          - endpoints[POST /pipeline/shipping-history]
          - endpoints[GET /pipeline/shipping-history/{id}]
        distinguishing_aspect: |
          ShippingHistoryRecord is the scaffold's only common_fields: false entity: the created row
          exposes id and created_at but NO version and NO updated_at, and §1.5 declares no mutating
          endpoint for it — history is an immutable ledger the proration base reads.
        test_recipe:
          setup:
            - "One shipper ALPHA and one segment HOU-NAS exist so the history row's two FKs resolve."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "HOU", name: "Houston Origin", role_kind: "ORIGIN", shell_capacity_bbl: 500000, min_operating_inventory_bbl: 10000, injection_bays: 2 }
              as: TariffAdministrator
              captures: { org_id: "$.data.id" }
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "NAS", name: "Nashville Delivery", role_kind: "DESTINATION", shell_capacity_bbl: 400000, min_operating_inventory_bbl: 5000 }
              as: TariffAdministrator
              captures: { dst_id: "$.data.id" }
            - call: "POST /pipeline/product-grades"
              payload: { grade_code: "ULSD", name: "Ultra Low Sulfur Diesel", sequence_rank: 3, max_sulfur_ppm: 15, max_rvp_psi: 12 }
              as: TariffAdministrator
              captures: { ulsd_id: "$.data.id" }
            - call: "POST /pipeline/segments"
              payload: { segment_code: "HOU-NAS", origin_terminal_id: "${org_id}", destination_terminal_id: "${dst_id}", linefill_grade_id: "${ulsd_id}", capacity_bbl_per_cycle: 101000, transmix_reserve_bbl: 1000, transmix_cut_bbl: 250, min_tender_bbl: 6000, linefill_requirement_bbl: 20000, proration_policy: "HISTORY_WEIGHTED" }
              as: TariffAdministrator
              captures: { seg_id: "$.data.id" }
            - call: "POST /pipeline/shippers"
              payload: { shipper_code: "ALPHA", name: "Alpha Trading", credit_limit_usd: 250000 }
              as: TariffAdministrator
              captures: { alpha_id: "$.data.id" }
          trigger:
            - call: "POST /pipeline/shipping-history"
              payload: { shipper_id: "${alpha_id}", segment_id: "${seg_id}", cycle_code: "2026-06", actual_shipped_bbl: 30000, cycle_end_at: "2026-06-30T00:00:00Z", record_status: "FINAL" }
              as: TariffAdministrator
              captures: { hist_id: "$.data.id" }
            - call: "GET /pipeline/shipping-history/${hist_id}"
              payload: {}
              as: PipelineScheduler
          assert:
            - "HTTP 201 on the create and HTTP 200 on the read"
            - "ShippingHistoryRecord.${hist_id}.actual_shipped_bbl == 30000.00"
            - "ShippingHistoryRecord.${hist_id}.record_status == FINAL"
            - "ShippingHistoryRecord.${hist_id}.cycle_end_at == 2026-06-30T00:00:00.000Z"
            - "the response body for ShippingHistoryRecord.${hist_id} contains id and created_at and contains no version field and no updated_at field"
            - "§1.5 declares no POST, PATCH or DELETE endpoint under /pipeline/shipping-history/{id}"

      - name: nomination_computed_fields_start_at_declared_defaults
        claim_type: Computed Fields
        grounds:
          - entities.Nomination.fields.allocated_bbl
          - entities.Nomination.fields.history_base_bbl
          - entities.Nomination.fields.allocation_class
          - entities.Nomination.fields.pinned_tariff_id
          - entities.Nomination.fields.revision_count
          - state_machines.Nomination.null_to_SUBMITTED
        distinguishing_aspect: |
          Every source: computed field of a brand-new Nomination reads its declared default while
          the cycle is still OPEN: allocated_bbl 0, history_base_bbl 0, allocation_class NEW_SHIPPER,
          pinned_tariff_id null, supersedes_nomination_id null, revision_count 0 — nothing is
          prorated or pinned before close, even though ALPHA has qualifying shipping history.
        test_recipe:
          setup:
            - "Segment HOU-NAS with linefill funded to 20000 bbl, an EFFECTIVE ULSD tariff, shipper ALPHA with two FINAL history rows, and cycle 2026-09 OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "HOU", name: "Houston Origin", role_kind: "ORIGIN", shell_capacity_bbl: 500000, min_operating_inventory_bbl: 10000, injection_bays: 2 }
              as: TariffAdministrator
              captures: { org_id: "$.data.id", org_v0: "$.data.version" }
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "NAS", name: "Nashville Delivery", role_kind: "DESTINATION", shell_capacity_bbl: 400000, min_operating_inventory_bbl: 5000 }
              as: TariffAdministrator
              captures: { dst_id: "$.data.id" }
            - call: "POST /pipeline/product-grades"
              payload: { grade_code: "ULSD", name: "Ultra Low Sulfur Diesel", sequence_rank: 3, max_sulfur_ppm: 15, max_rvp_psi: 12 }
              as: TariffAdministrator
              captures: { ulsd_id: "$.data.id" }
            - call: "POST /pipeline/segments"
              payload: { segment_code: "HOU-NAS", origin_terminal_id: "${org_id}", destination_terminal_id: "${dst_id}", linefill_grade_id: "${ulsd_id}", capacity_bbl_per_cycle: 101000, transmix_reserve_bbl: 1000, transmix_cut_bbl: 250, min_tender_bbl: 6000, linefill_requirement_bbl: 20000, proration_policy: "HISTORY_WEIGHTED" }
              as: TariffAdministrator
              captures: { seg_id: "$.data.id" }
            - call: "POST /pipeline/terminals/${org_id}/inventory-adjustments"
              payload: { expected_terminal_version: "${org_v0}", adjustment_kind: "LINEFILL", adjustment_bbl: 20000, reason: "initial linefill of HOU-NAS", segment_id: "${seg_id}" }
              as: TerminalOperator
              captures: { org_v1: "$.data.version" }
            - call: "POST /pipeline/shippers"
              payload: { shipper_code: "ALPHA", name: "Alpha Trading", credit_limit_usd: 250000 }
              as: TariffAdministrator
              captures: { alpha_id: "$.data.id" }
            - call: "POST /pipeline/shipping-history"
              payload: { shipper_id: "${alpha_id}", segment_id: "${seg_id}", cycle_code: "2026-06", actual_shipped_bbl: 30000, cycle_end_at: "2026-06-30T00:00:00Z", record_status: "FINAL" }
              as: TariffAdministrator
            - call: "POST /pipeline/shipping-history"
              payload: { shipper_id: "${alpha_id}", segment_id: "${seg_id}", cycle_code: "2026-07", actual_shipped_bbl: 42000, cycle_end_at: "2026-07-31T00:00:00Z", record_status: "FINAL" }
              as: TariffAdministrator
            - call: "POST /pipeline/tariffs"
              payload: { segment_id: "${seg_id}", grade_id: "${ulsd_id}", base_rate_usd_per_bbl: 1.855, tier1_min_bbl: 25000, tier1_rate_usd_per_bbl: 1.705, tier2_min_bbl: 45000, tier2_rate_usd_per_bbl: 1.555, tender_minimum_bbl: 6000, imbalance_penalty_rate_usd_per_bbl: 0.45, effective_from: "2026-07-01T00:00:00Z" }
              as: TariffAdministrator
              captures: { tar_ulsd_id: "$.data.id" }
            - call: "POST /pipeline/tariffs/${tar_ulsd_id}/activate"
              payload: {}
              as: TariffAdministrator
            - call: "POST /pipeline/cycles"
              payload: { cycle_code: "2026-09", segment_id: "${seg_id}", window_open_at: "2026-08-01T00:00:00Z", window_close_at: "2026-08-20T00:00:00Z", ship_start_at: "2026-09-01T00:00:00Z", ship_end_at: "2026-09-30T00:00:00Z" }
              as: PipelineScheduler
              captures: { cyc_id: "$.data.id", cyc_v0: "$.data.version" }
          trigger:
            - call: "POST /pipeline/nominations"
              payload: { cycle_id: "${cyc_id}", shipper_id: "${alpha_id}", grade_id: "${ulsd_id}", origin_terminal_id: "${org_id}", destination_terminal_id: "${dst_id}", nominated_bbl: 30000, expected_cycle_version: "${cyc_v0}" }
              as: Shipper
              as_user_id: "${alpha_id}"
              captures: { nom_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Nomination.${nom_id}.status == SUBMITTED"
            - "Nomination.${nom_id}.allocated_bbl == 0"
            - "Nomination.${nom_id}.history_base_bbl == 0"
            - "Nomination.${nom_id}.allocation_class == NEW_SHIPPER"
            - "Nomination.${nom_id}.pinned_tariff_id == null"
            - "Nomination.${nom_id}.supersedes_nomination_id == null"
            - "Nomination.${nom_id}.rejection_reason == null"
            - "Nomination.${nom_id}.revision_count == 0"
            - "Nomination.${nom_id}.nominated_bbl == 30000"
            - "Nomination.${nom_id}.version == 1"

      - name: cycle_system_fields_are_server_generated_at_creation
        claim_type: System Fields
        grounds:
          - entities.NominationCycle.fields.status
          - entities.NominationCycle.fields.schedule_version
          - entities.NominationCycle.fields.schedule_published_at
          - entities.NominationCycle.fields.settled_at
          - state_machines.NominationCycle
        distinguishing_aspect: |
          POST /pipeline/cycles accepts only the six business inputs: status is minted as OPEN,
          version as 1, schedule_version as 0, and every capacity accumulator at its declared
          default — effective_capacity_bbl stays 0 until close even though the segment is fully
          funded, because calculations.effective_capacity is triggered by close, not by creation.
        test_recipe:
          setup:
            - "Segment HOU-NAS exists with linefill funded to 20000 bbl (its effective capacity would be 100000 bbl once computed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "HOU", name: "Houston Origin", role_kind: "ORIGIN", shell_capacity_bbl: 500000, min_operating_inventory_bbl: 10000, injection_bays: 2 }
              as: TariffAdministrator
              captures: { org_id: "$.data.id", org_v0: "$.data.version" }
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "NAS", name: "Nashville Delivery", role_kind: "DESTINATION", shell_capacity_bbl: 400000, min_operating_inventory_bbl: 5000 }
              as: TariffAdministrator
              captures: { dst_id: "$.data.id" }
            - call: "POST /pipeline/product-grades"
              payload: { grade_code: "ULSD", name: "Ultra Low Sulfur Diesel", sequence_rank: 3, max_sulfur_ppm: 15, max_rvp_psi: 12 }
              as: TariffAdministrator
              captures: { ulsd_id: "$.data.id" }
            - call: "POST /pipeline/segments"
              payload: { segment_code: "HOU-NAS", origin_terminal_id: "${org_id}", destination_terminal_id: "${dst_id}", linefill_grade_id: "${ulsd_id}", capacity_bbl_per_cycle: 101000, transmix_reserve_bbl: 1000, transmix_cut_bbl: 250, min_tender_bbl: 6000, linefill_requirement_bbl: 20000, proration_policy: "HISTORY_WEIGHTED" }
              as: TariffAdministrator
              captures: { seg_id: "$.data.id" }
            - call: "POST /pipeline/terminals/${org_id}/inventory-adjustments"
              payload: { expected_terminal_version: "${org_v0}", adjustment_kind: "LINEFILL", adjustment_bbl: 20000, reason: "initial linefill of HOU-NAS", segment_id: "${seg_id}" }
              as: TerminalOperator
              captures: { org_v1: "$.data.version" }
          trigger:
            - call: "POST /pipeline/cycles"
              payload: { cycle_code: "2026-09", segment_id: "${seg_id}", window_open_at: "2026-08-01T00:00:00Z", window_close_at: "2026-08-20T00:00:00Z", ship_start_at: "2026-09-01T00:00:00Z", ship_end_at: "2026-09-30T00:00:00Z" }
              as: PipelineScheduler
              captures: { cyc_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "NominationCycle.${cyc_id}.status == OPEN"
            - "NominationCycle.${cyc_id}.version == 1"
            - "NominationCycle.${cyc_id}.schedule_version == 0"
            - "NominationCycle.${cyc_id}.schedule_published_at == null and NominationCycle.${cyc_id}.schedule_published_by_user_id == null"
            - "NominationCycle.${cyc_id}.settled_at == null"
            - "NominationCycle.${cyc_id}.effective_capacity_bbl == 0 and NominationCycle.${cyc_id}.derate_pct_applied == 0"
            - "NominationCycle.${cyc_id}.nominated_total_bbl == 0 and NominationCycle.${cyc_id}.allocated_total_bbl == 0 and NominationCycle.${cyc_id}.unallocated_capacity_bbl == 0"
            - "NominationCycle.${cyc_id}.proration_factor == 1.000000"
            - "NominationCycle.${cyc_id}.total_transmix_bbl == 0"

      - name: unknown_cycle_id_read_returns_cycle_not_found
        claim_type: Not Found
        grounds:
          - validations[ERR_CYCLE_NOT_FOUND]
          - endpoints[GET /pipeline/cycles/{id}]
        distinguishing_aspect: |
          A syntactically valid but unknown UUID on GET /pipeline/cycles/{id} is a 404
          ERR_CYCLE_NOT_FOUND, not a 400 and not an empty 200 — path existence (priority 30)
          is checked before anything else once auth passes.
        test_recipe:
          setup:
            - "Empty database; no cycle has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PipelineScheduler
          trigger:
            - call: "GET /pipeline/cycles/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PipelineScheduler
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "response.response_type == error and data.error_id == ERR_CYCLE_NOT_FOUND"

      - name: segment_creation_with_unknown_terminal_reference_rejected
        claim_type: Parent Relationships
        grounds:
          - validations[ERR_REFERENCE_NOT_FOUND]
          - entities.PipelineSegment.fields.origin_terminal_id
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The topology is flat, so every body FK is validated by reference rather than by URL
          nesting: a segment whose origin_terminal_id is an unknown UUID is refused with 404
          ERR_REFERENCE_NOT_FOUND even though destination_terminal_id and linefill_grade_id
          both resolve, and no PipelineSegment row is created.
        test_recipe:
          setup:
            - "Terminal NAS and grade ULSD exist; no terminal with the id used as origin_terminal_id exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "NAS", name: "Nashville Delivery", role_kind: "DESTINATION", shell_capacity_bbl: 400000, min_operating_inventory_bbl: 5000 }
              as: TariffAdministrator
              captures: { dst_id: "$.data.id" }
            - call: "POST /pipeline/product-grades"
              payload: { grade_code: "ULSD", name: "Ultra Low Sulfur Diesel", sequence_rank: 3, max_sulfur_ppm: 15, max_rvp_psi: 12 }
              as: TariffAdministrator
              captures: { ulsd_id: "$.data.id" }
          trigger:
            - call: "POST /pipeline/segments"
              payload: { segment_code: "HOU-NAS", origin_terminal_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", destination_terminal_id: "${dst_id}", linefill_grade_id: "${ulsd_id}", capacity_bbl_per_cycle: 101000, transmix_reserve_bbl: 1000, transmix_cut_bbl: 250, min_tender_bbl: 6000, linefill_requirement_bbl: 20000, proration_policy: "HISTORY_WEIGHTED" }
              as: TariffAdministrator
              captures: { err: "$.data.error_id" }
            - call: "GET /pipeline/segments"
              payload: { limit: 10 }
              as: TariffAdministrator
          assert:
            - "HTTP 404 on the create"
            - "data.error_id == ERR_REFERENCE_NOT_FOUND"
            - "GET /pipeline/segments returns total_count == 0 and an empty data array"

      - name: terminal_creation_missing_required_shell_capacity_rejected
        claim_type: Required Fields
        grounds:
          - validations[ERR_INVALID_REQUEST]
          - entities.Terminal.fields.shell_capacity_bbl
        distinguishing_aspect: |
          shell_capacity_bbl is source: input with no default, so omitting it is a 400
          ERR_INVALID_REQUEST — the server must not substitute 0, which would silently make every
          delivery into that terminal exceed shell capacity.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
          trigger:
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "HOU", name: "Houston Origin", role_kind: "ORIGIN", min_operating_inventory_bbl: 10000 }
              as: TariffAdministrator
              captures: { err: "$.data.error_id" }
            - call: "GET /pipeline/terminals"
              payload: { limit: 10 }
              as: TariffAdministrator
          assert:
            - "HTTP 400 on the create"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "GET /pipeline/terminals returns total_count == 0 and an empty data array"

      - name: terminal_creation_with_invalid_enum_role_kind_rejected
        claim_type: Type Constraints
        grounds:
          - validations[ERR_INVALID_REQUEST]
          - entities.Terminal.fields.role_kind
        distinguishing_aspect: |
          role_kind is constrained to {ORIGIN, DESTINATION, BOTH}; a plausible but undeclared
          value such as TRANSSHIP is a 400 ERR_INVALID_REQUEST rather than a stored free-text
          value, because segment creation later tests role_kind membership.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
          trigger:
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "HOU", name: "Houston Origin", role_kind: "TRANSSHIP", shell_capacity_bbl: 500000, min_operating_inventory_bbl: 10000 }
              as: TariffAdministrator
              captures: { err: "$.data.error_id" }
            - call: "GET /pipeline/terminals"
              payload: { limit: 10 }
              as: TariffAdministrator
          assert:
            - "HTTP 400 on the create"
            - "data.error_id == ERR_INVALID_REQUEST"
