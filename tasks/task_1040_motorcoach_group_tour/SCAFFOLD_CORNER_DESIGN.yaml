  # Stubs — corners already exercised by §1.8 difficulty instances
  # -------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: corner_coach_overlap_buffer_excluded
        claim_type: Cross-entity
        grounds:
          - validations[priority=10]
          - errors[ERR_COACH_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / coach_overlap_closed_interval_with_turnaround_buffer
          rationale: "Coach closed-interval + turnaround-buffer overlap rejection is fully asserted by the named §1.8 instance."

      - name: corner_guarantee_threshold_excluded
        claim_type: Valid Transition
        grounds: [state_machines.Departure.OPEN_to_GUARANTEED]
        excluded_because:
          difficulty_instance: boundary_precision_check / guarantee_threshold_pax_exactly_equals_min
          rationale: "OPEN->GUARANTEED at confirmed_pax==min is the exact boundary the named §1.8 instance pins."

      - name: corner_dot_boundary_excluded
        claim_type: Valid Transition
        grounds: [state_machines.Driver.AVAILABLE_to_ASSIGNED]
        excluded_because:
          difficulty_instance: boundary_precision_check / dot_hours_boundary_exactly_10_allowed
          rationale: "The 10.0h-exactly DOT boundary on driver assign is asserted by the named §1.8 instance."

      - name: corner_departure_cancel_cascade_excluded
        claim_type: Cascade down
        grounds: [state_machines.Departure.GUARANTEED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / departure_cancel_cascades_booking_then_voucher_depth3
          rationale: "Departure-cancel cascade to bookings and vouchers is asserted by the named §1.8 instance."

