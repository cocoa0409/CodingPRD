# =============================================================================
# Scaffold: Mobile Carrier Plan & Device Management (task_0279)
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  279. Mobile Carrier Plan & Device Management: line/plan provisioning, number
  port-in/out, device installment (EIP)/upgrade, SIM/eSIM activation,
  family/multi-line discount, international/roaming add-on, usage/overage,
  suspend/reconnect

domain_name: mobile-carrier-management
api_prefix: /
# Flat topology: every entity is a top-level collection (/accounts, /lines,
# /sim-assignments, ...) linked by foreign keys, NOT nested under parent URL
# segments. Reverse-reachability is provided by filtered-list GETs
# (`GET /lines?account_id=...`, `GET /sim-assignments?line_id=...`).

# Selected archetype and structural dimensions.
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency        # OCC on Account.version for line provisioning (CREATE-with-supersede)
    - cascading_side_effects        # suspend/cancel/port-out fan into EIP, add-ons, SIM, ledger
    - dual_variant_calculation      # provisional cancel settlement vs final cycle-close; projected vs actual group discount
    - rate_threshold_triggers       # overage tier breakpoints; multi-line discount tier breakpoints
    - derived_field_reconciliation  # Account.active_line_count / group_discount_pct / total_eip_outstanding_cents

  entity_topology: flat
  # All entities are top-level collections linked by foreign keys (account_id,
  # line_id, plan_id, device_id, billing_cycle_id). No nesting in URL paths;
  # children are discovered via filtered-list GETs on their own collection.

  state_machine_shape: cyclic
  # Line: PENDING_ACTIVATION -> ACTIVE <-> SUSPENDED (suspend/reconnect loop) -> CANCELLED.
  # PortRequest: branching fork-join with reject->revert (compensation).

  relationship_patterns:
    - one_to_many        # Account 1:N Line; Line 1:N AddOn/UsageRecord
    - cross_aggregate    # Line.plan_id -> Plan; InstallmentPlan.device_id -> Device

  role_model: peer_roles
  # Subscriber owns their Account; CarrierAgent provisions lines/plans/devices;
  # PortingOps adjudicates port-in/out; BillingSystem (opaque) runs cycle close.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: holder_name, type: string, source: input, description: "Billing account holder full name" }
      - { name: holder_email, type: string, source: input, description: "Account holder email (login identity for Subscriber role)" }
      - { name: billing_day_of_month, type: integer, source: input, description: "Day of month the billing cycle anchors on", constraints: "1..28" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DELINQUENT — toggled by POST /accounts/{id}/mark-delinquent; gates line activation, reconnect, and provisioning", default: "ACTIVE", constraints: "ACTIVE | DELINQUENT" }
      - { name: active_line_count, type: integer, source: computed, description: "Count of Lines whose status IN {ACTIVE, SUSPENDED}; drives group_discount_pct" }
      - { name: group_discount_pct, type: number, source: computed, description: "Multi-line discount fraction derived from active_line_count via group_discount calc" }
      - { name: total_eip_outstanding_cents, type: integer, source: computed, description: "Sum of remaining_balance_cents over InstallmentPlans whose status == ACTIVE belonging to this account's lines" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Refund/credit balance applied to future cycles", default: 0 }

  - name: Plan
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique plan code", constraints: "unique across Plans" }
      - { name: name, type: string, source: input, description: "Marketing name of the plan" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Base recurring fee per line per cycle, in cents" }
      - { name: included_data_mb, type: integer, source: input, description: "Included data allowance per cycle in MB" }
      - { name: overage_tier1_cap_mb, type: integer, source: input, description: "MB of overage charged at tier-1 rate before tier-2 kicks in", default: 5120 }
      - { name: overage_tier1_rate_milli_cents, type: integer, source: input, description: "Tier-1 overage price per MB, in milli-cents (1000 = 1 cent)" }
      - { name: overage_tier2_rate_milli_cents, type: integer, source: input, description: "Tier-2 overage price per MB beyond tier-1 cap, in milli-cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED — RETIRED plans reject new line assignment", default: "ACTIVE", constraints: "ACTIVE | RETIRED" }

  - name: Device
    parent: null
    common_fields: true
    fields:
      - { name: model, type: string, source: input, description: "Device model name" }
      - { name: sku, type: string, source: input, description: "Unique stock-keeping unit", constraints: "unique across Devices" }
      - { name: retail_price_cents, type: integer, source: input, description: "Full retail price in cents" }
      - { name: stock_count, type: integer, source: input, description: "Units available for EIP/upgrade; decremented on EIP creation" }
      - { name: status, type: enum, source: system, description: "AVAILABLE (the only Device state; stock exhaustion is tracked by stock_count, not status)", default: "AVAILABLE", constraints: "AVAILABLE" }

  - name: Line
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning billing account" }
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; the plan this line is provisioned on" }
      - { name: phone_number, type: string, source: computed, description: "E.164 number held by this line; null until activation/port-in completes, released to pool on cancel/port-out" }
      - { name: sim_type, type: enum, source: input, description: "PHYSICAL | ESIM — chosen at provisioning", constraints: "PHYSICAL | ESIM" }
      - { name: status, type: enum, source: system, description: "PENDING_ACTIVATION | ACTIVE | SUSPENDED | CANCELLED", default: "PENDING_ACTIVATION", constraints: "PENDING_ACTIVATION | ACTIVE | SUSPENDED | CANCELLED" }
      - { name: suspend_reason, type: enum, source: system, description: "VOLUNTARY | NONPAYMENT | LOST_STOLEN — set on suspend, cleared on reconnect", constraints: "VOLUNTARY | NONPAYMENT | LOST_STOLEN" }
      - { name: cycle_data_used_mb, type: integer, source: computed, description: "Sum of UsageRecord.data_mb for this line in the current open BillingCycle", default: 0 }
      - { name: activated_at, type: datetime, source: system, description: "Timestamp the line first reached ACTIVE; drives proration day count" }

  - name: SimAssignment
    parent: Line
    common_fields: true
    fields:
      - { name: line_id, type: string, source: system, description: "FK -> Line.id; the line this SIM/eSIM belongs to" }
      - { name: sim_type, type: enum, source: input, description: "PHYSICAL | ESIM", constraints: "PHYSICAL | ESIM" }
      - { name: iccid, type: string, source: input, description: "ICCID for PHYSICAL SIM; required when sim_type==PHYSICAL" }
      - { name: esim_activation_code, type: string, source: computed, description: "Server-issued eSIM LPA activation string; populated when sim_type==ESIM on activation" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACTIVATED | DEACTIVATED", default: "ISSUED", constraints: "ISSUED | ACTIVATED | DEACTIVATED" }

  - name: InstallmentPlan
    parent: Line
    common_fields: true
    fields:
      - { name: line_id, type: string, source: system, description: "FK -> Line.id; line financing this device" }
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; the financed device" }
      - { name: term_months, type: integer, source: input, description: "Number of monthly installments", constraints: "12 | 24 | 36" }
      - { name: down_payment_cents, type: integer, source: input, description: "Up-front payment, subtracted from retail to compute financed amount" }
      - { name: financed_cents, type: integer, source: computed, description: "retail_price_cents - down_payment_cents" }
      - { name: monthly_installment_cents, type: integer, source: computed, description: "ceil(financed_cents / term_months), the per-cycle charge" }
      - { name: remaining_balance_cents, type: integer, source: computed, description: "Outstanding device balance; decremented by each cycle installment, zeroed on payoff" }
      - { name: installments_paid, type: integer, source: computed, description: "Count of cycle installments applied so far", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAID_OFF | CANCELLED — CANCELLED only via superseding upgrade", default: "ACTIVE", constraints: "ACTIVE | PAID_OFF | CANCELLED" }

  - name: AddOn
    parent: Line
    common_fields: true
    fields:
      - { name: line_id, type: string, source: system, description: "FK -> Line.id; line the add-on attaches to" }
      - { name: addon_type, type: enum, source: input, description: "ROAMING_DAYPASS | INTL_MONTHLY — daypass priced per UTC day, monthly priced per cycle", constraints: "ROAMING_DAYPASS | INTL_MONTHLY" }
      - { name: daily_fee_cents, type: integer, source: input, description: "Per-UTC-day fee for ROAMING_DAYPASS add-ons" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Per-cycle fee for INTL_MONTHLY add-ons" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start instant of the add-on coverage window" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end instant of the add-on coverage window" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | EXPIRED | CANCELLED", default: "SCHEDULED", constraints: "SCHEDULED | ACTIVE | EXPIRED | CANCELLED" }

  - name: PortRequest
    parent: Line
    common_fields: true
    fields:
      - { name: line_id, type: string, source: system, description: "FK -> Line.id; line the port targets" }
      - { name: direction, type: enum, source: input, description: "PORT_IN | PORT_OUT", constraints: "PORT_IN | PORT_OUT" }
      - { name: external_number, type: string, source: input, description: "E.164 number being ported in (PORT_IN) or the line number leaving (PORT_OUT)" }
      - { name: donor_carrier, type: string, source: input, description: "Name of the carrier surrendering (PORT_IN) or receiving (PORT_OUT) the number" }
      - { name: account_pin, type: string, source: input, description: "Transfer authorization PIN supplied by the subscriber" }
      - { name: status, type: enum, source: system, description: "REQUESTED | VALIDATED | COMPLETED | REJECTED | REVERTED", default: "REQUESTED", constraints: "REQUESTED | VALIDATED | COMPLETED | REJECTED | REVERTED" }
      - { name: reject_reason, type: enum, source: system, description: "PIN_MISMATCH | NUMBER_NOT_PORTABLE | DONOR_REFUSED — set on REJECTED", constraints: "PIN_MISMATCH | NUMBER_NOT_PORTABLE | DONOR_REFUSED" }

  - name: UpgradeOrder
    parent: Line
    common_fields: true
    fields:
      - { name: line_id, type: string, source: system, description: "FK -> Line.id; line being upgraded" }
      - { name: old_installment_plan_id, type: string, source: input, description: "FK -> InstallmentPlan.id; the EIP being superseded (must be ACTIVE on this line)" }
      - { name: new_device_id, type: string, source: input, description: "FK -> Device.id; the replacement device" }
      - { name: new_term_months, type: integer, source: input, description: "Term for the new EIP", constraints: "12 | 24 | 36" }
      - { name: new_down_payment_cents, type: integer, source: input, description: "Down payment for the new EIP" }
      - { name: trade_in_credit_cents, type: integer, source: input, description: "Credit applied against the old EIP's remaining balance" }
      - { name: payoff_charge_cents, type: integer, source: computed, description: "max(0, old EIP remaining_balance_cents - trade_in_credit_cents); one-time charge billed to settle the old device" }
      - { name: new_installment_plan_id, type: string, source: computed, description: "FK -> InstallmentPlan.id; the EIP created by this upgrade" }
      - { name: status, type: enum, source: system, description: "COMPLETED — upgrade applies atomically", default: "COMPLETED", constraints: "COMPLETED" }

  - name: BillingCycle
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; account this cycle bills" }
      - { name: cycle_start, type: datetime, source: input, description: "Inclusive start instant of the cycle" }
      - { name: cycle_end, type: datetime, source: input, description: "Exclusive end instant of the cycle" }
      - { name: days_in_cycle, type: integer, source: computed, description: "Whole UTC days between cycle_start and cycle_end (used as proration denominator)" }
      - { name: total_charges_cents, type: integer, source: computed, description: "Sum of Charge.amount_cents for this cycle, set at close" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED — only one OPEN cycle per account", default: "OPEN", constraints: "OPEN | CLOSED" }

  - name: Charge
    parent: BillingCycle
    common_fields: false   # append-only ledger event: id + created_at only
    fields:
      - { name: billing_cycle_id, type: string, source: system, description: "FK -> BillingCycle.id; cycle this charge posts to" }
      - { name: line_id, type: string, source: system, description: "FK -> Line.id; line the charge is attributed to (null for account-level charges)" }
      - { name: charge_type, type: enum, source: system, description: "PLAN_BASE | OVERAGE | EIP_INSTALLMENT | ADDON | EIP_PAYOFF | CREDIT", constraints: "PLAN_BASE | OVERAGE | EIP_INSTALLMENT | ADDON | EIP_PAYOFF | CREDIT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; positive = owed, negative = credit/refund" }
      - { name: memo, type: string, source: system, description: "Human-readable description of the charge" }

  - name: UsageRecord
    parent: Line
    common_fields: false   # append-only usage event: id + created_at only
    fields:
      - { name: line_id, type: string, source: system, description: "FK -> Line.id; line that incurred usage" }
      - { name: usage_type, type: enum, source: input, description: "DATA | VOICE | TEXT", constraints: "DATA | VOICE | TEXT" }
      - { name: data_mb, type: integer, source: input, description: "Data consumed in MB (0 for VOICE/TEXT records)", default: 0 }
      - { name: occurred_at, type: datetime, source: input, description: "Instant the usage occurred; must fall inside an OPEN BillingCycle for the line's account" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Line
    initial_state: PENDING_ACTIVATION
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /lines/{lineId}/activate"
        actor: CarrierAgent
        preconditions:
          - "Line has a SimAssignment in status ISSUED for this line (ERR_SIM_NOT_ISSUED)"
          - "Plan referenced by plan_id has status ACTIVE (ERR_PLAN_RETIRED)"
          - "Account.status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects:
          - "Line.phone_number assigned from the carrier number pool (or set by a prior COMPLETED PORT_IN PortRequest)"
          - "Line.activated_at stamped with current time"
          - "Linked SimAssignment ISSUED -> ACTIVATED; if sim_type==ESIM, esim_activation_code populated"
          - "Account.active_line_count recomputed; Account.group_discount_pct recomputed via group_discount calc"
          - "Account.version incremented by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /lines/{lineId}/suspend"
        actor: CarrierAgent
        preconditions:
          - "Line.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Line.suspend_reason set from request"
          - "AddOns on this line keep their status (SCHEDULED/ACTIVE) but are excluded from billing for the days the line is SUSPENDED"
          - "Linked SimAssignment ACTIVATED -> DEACTIVATED"
          - "Account.active_line_count is NOT changed (SUSPENDED still counts toward group discount)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /lines/{lineId}/reconnect"
        actor: CarrierAgent
        preconditions:
          - "Line.status == SUSPENDED (ERR_INVALID_STATE)"
          - "Account.status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "If suspend_reason == NONPAYMENT, Account.wallet_credit_cents >= 0 AND Account.status != DELINQUENT (ERR_RECONNECT_BLOCKED)"
        side_effects:
          - "Line.suspend_reason cleared"
          - "Linked SimAssignment DEACTIVATED -> ACTIVATED"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /lines/{lineId}/cancel"
        actor: Subscriber
        preconditions:
          - "Line.status IN {ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
          - "No PortRequest on this line with status IN {REQUESTED, VALIDATED} (ERR_PORT_IN_PROGRESS)"
        side_effects:
          - "Provisional cancellation settlement computed via line_cancel_settlement calc (FORWARD variant): prorated unused base credited; any ACTIVE InstallmentPlan accelerated — remaining_balance_cents posted as one EIP_PAYOFF Charge"
          - "Each ACTIVE InstallmentPlan on the line -> PAID_OFF; remaining_balance_cents -> 0"
          - "Each AddOn on the line with status IN {SCHEDULED, ACTIVE} -> CANCELLED"
          - "Linked SimAssignment -> DEACTIVATED"
          - "Line.phone_number released to the carrier number pool; Line.phone_number -> null"
          - "Account.active_line_count recomputed; Account.group_discount_pct recomputed; Account.total_eip_outstanding_cents recomputed"

      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /lines/{lineId}/cancel"
        actor: Subscriber
        preconditions:
          - "Line.status IN {ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
          - "No PortRequest on this line with status IN {REQUESTED, VALIDATED} (ERR_PORT_IN_PROGRESS)"
        side_effects:
          - "Same cascade as ACTIVE -> CANCELLED"

  - entity: PortRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED, REVERTED]
    transitions:
      - from: REQUESTED
        to: VALIDATED
        trigger: "POST /port-requests/{portRequestId}/validate"
        actor: PortingOps
        preconditions:
          - "PortRequest.status == REQUESTED (ERR_INVALID_STATE)"
          - "account_pin in the request matches the stored PortRequest.account_pin (else transition to REJECTED with reject_reason=PIN_MISMATCH)"
        side_effects:
          - "For PORT_OUT: Line.status must be ACTIVE; no field change yet"

      - from: VALIDATED
        to: COMPLETED
        trigger: "POST /port-requests/{portRequestId}/complete"
        actor: PortingOps
        preconditions:
          - "PortRequest.status == VALIDATED (ERR_INVALID_STATE)"
        side_effects:
          - "PORT_IN: Line.phone_number set to external_number (the imported number); if Line.status==PENDING_ACTIVATION it remains pending until activate"
          - "PORT_OUT: Line.phone_number -> null (released); Line.status -> CANCELLED via the cancel cascade (EIP accelerated, add-ons cancelled, SIM deactivated, group discount recomputed)"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /port-requests/{portRequestId}/reject"
        actor: PortingOps
        preconditions:
          - "PortRequest.status IN {REQUESTED, VALIDATED} (ERR_INVALID_STATE)"
        side_effects:
          - "PortRequest.reject_reason set from request"
          - "No change to Line (number never moved)"

      - from: VALIDATED
        to: REJECTED
        trigger: "POST /port-requests/{portRequestId}/reject"
        actor: PortingOps
        preconditions:
          - "PortRequest.status IN {REQUESTED, VALIDATED} (ERR_INVALID_STATE)"
        side_effects:
          - "PortRequest.reject_reason set from request"
          - "No change to Line (number never moved)"

      - from: COMPLETED
        to: REVERTED
        trigger: "POST /port-requests/{portRequestId}/revert"
        actor: PortingOps
        preconditions:
          - "PortRequest.status == COMPLETED (ERR_INVALID_STATE)"
          - "Revert window: only a PORT_IN may be reverted (ERR_PORT_NOT_REVERTABLE)"
        side_effects:
          - "PORT_IN revert: Line.phone_number cleared back to null (number returned to donor); conserved number-pool invariant restored"

  - entity: AddOn
    initial_state: SCHEDULED
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /_clock/set_current_utc reaching window_start (system) OR POST /addons/{addonId}/activate"
        actor: system
        preconditions:
          - "current UTC >= window_start (ERR_ADDON_WINDOW_NOT_STARTED)"
          - "Parent Line.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "AddOn becomes billable for the current cycle"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc reaching window_end (system)"
        actor: system
        preconditions:
          - "current UTC >= window_end"
        side_effects:
          - "AddOn stops accruing daily/monthly fees"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /addons/{addonId}/cancel"
        actor: Subscriber
        preconditions:
          - "AddOn.status IN {SCHEDULED, ACTIVE} (ERR_INVALID_STATE)"
        side_effects:
          - "AddOn no longer billed; daypass already-elapsed days remain on the cycle ledger"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /addons/{addonId}/cancel"
        actor: Subscriber
        preconditions:
          - "AddOn.status IN {SCHEDULED, ACTIVE} (ERR_INVALID_STATE)"
        side_effects:
          - "AddOn no longer billed; daypass already-elapsed days remain on the cycle ledger"

  - entity: InstallmentPlan
    initial_state: ACTIVE
    terminal_states: [PAID_OFF, CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAID_OFF
        trigger: "system: line cancel cascade, or all installments applied at cycle close, or upgrade payoff"
        actor: system
        preconditions:
          - "remaining_balance_cents reaches 0 after the triggering action"
        side_effects:
          - "Account.total_eip_outstanding_cents recomputed (decremented by this plan's prior remaining_balance_cents)"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /upgrades (supersede)"
        actor: CarrierAgent
        preconditions:
          - "An UpgradeOrder names this plan as old_installment_plan_id"
        side_effects:
          - "old EIP remaining_balance_cents settled via UpgradeOrder.payoff_charge_cents; remaining_balance_cents -> 0"
          - "Account.total_eip_outstanding_cents recomputed"

  - entity: BillingCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /billing-cycles/{cycleId}/close"
        actor: BillingSystem
        preconditions:
          - "BillingCycle.status == OPEN (ERR_INVALID_STATE)"
          - "current UTC >= cycle_end (ERR_CYCLE_NOT_ENDED)"
        side_effects:
          - "FINAL settlement computed via line_cancel_settlement (CHRONOLOGICAL variant) and account_cycle_total calc"
          - "For each line: PLAN_BASE Charge (prorated, group-discounted), OVERAGE Charge (tiered), EIP_INSTALLMENT Charge, ADDON Charges posted to this cycle"
          - "Each ACTIVE InstallmentPlan: remaining_balance_cents decremented by monthly_installment_cents, installments_paid += 1; if remaining hits 0 -> PAID_OFF"
          - "BillingCycle.total_charges_cents set to sum of Charge.amount_cents; Account.wallet_credit_cents applied against total"
          - "A successor BillingCycle (OPEN) is created for the account"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: line-provision-stale-account
    parent_entity: Account
    write_endpoint: "POST /lines"
    occ_field: "expected_account_version"
    description: |
      Provisioning a new Line against an Account whose version has advanced
      since the client last observed it is rejected. A prior line-provisioning
      or line state change legitimately advances Account.version (it recomputes
      active_line_count and group_discount_pct, which can change every existing
      line's discounted base); a provisioning request carrying the stale
      version is therefore rejected so the client re-reads the new discount
      tier before committing.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: group_discount
    trigger: "Recomputed on every Line activate / cancel / port-out completion (Account.active_line_count change)"
    algorithm: threshold
    formula: |
      active_line_count = count(Line where status IN {ACTIVE, SUSPENDED} and account_id == account.id)
      if active_line_count <= 1:  group_discount_pct = 0.00
      elif active_line_count == 2: group_discount_pct = 0.05
      elif active_line_count == 3: group_discount_pct = 0.10
      elif active_line_count == 4: group_discount_pct = 0.15
      else (active_line_count >= 5): group_discount_pct = 0.20   # capped
    input_set: "Lines whose status IN {ACTIVE, SUSPENDED}; PENDING_ACTIVATION and CANCELLED lines excluded"
    constants:
      TIER2_PCT: 0.05
      TIER3_PCT: 0.10
      TIER4_PCT: 0.15
      TIER5PLUS_PCT: 0.20
      CAP_LINES: 5
    precision: "group_discount_pct is exact (table lookup, no rounding)"

  - name: line_overage
    trigger: "Computed at billing-cycle close for each line, and on demand via GET /lines/{lineId}/usage-summary"
    algorithm: tiered_pricing
    formula: |
      over_mb = max(0, line.cycle_data_used_mb - plan.included_data_mb)
      if over_mb == 0: overage_cents = 0
      tier1_mb = min(over_mb, plan.overage_tier1_cap_mb)
      tier2_mb = max(0, over_mb - plan.overage_tier1_cap_mb)
      raw_milli = tier1_mb * plan.overage_tier1_rate_milli_cents
                + tier2_mb * plan.overage_tier2_rate_milli_cents
      overage_cents = round_half_up(raw_milli / 1000)   # milli-cents -> cents
    input_set: "UsageRecord rows with usage_type==DATA whose occurred_at falls inside the OPEN cycle for this line"
    constants:
      MILLI_PER_CENT: 1000
    precision: "round_half_up to whole cents after summing milli-cents"

  - name: line_proration
    trigger: "Per line at billing-cycle close, and inside line_cancel_settlement"
    algorithm: chronological
    formula: |
      # discounted base FIRST, then prorate; round per line (mode-b order pinned)
      discounted_base = round_half_up(plan.monthly_fee_cents * (1 - account.group_discount_pct))
      active_days = whole UTC days the line spent in {ACTIVE, SUSPENDED} within [cycle_start, cycle_end)
      prorated_base = round_half_up(discounted_base * active_days / billing_cycle.days_in_cycle)
    input_set: "Line state intervals intersected with the cycle window; days counted as whole UTC days, denominator = days_in_cycle"
    constants: {}
    precision: "round_half_up; the discount multiply rounds to whole cents BEFORE the proration multiply (round-then-prorate, not prorate-then-round)"

  - name: account_cycle_total
    trigger: "POST /billing-cycles/{cycleId}/close"
    algorithm: aggregation
    formula: |
      # Evaluation order is pinned (mode-c: discount depends on line count, base depends on discount):
      # STEP 1: group_discount_pct = group_discount(active_line_count)
      # STEP 2: per line L in {ACTIVE, SUSPENDED}:
      #   discounted_base_L = round_half_up(plan.monthly_fee_cents * (1 - group_discount_pct))
      #   prorated_base_L   = line_proration(L)              # uses discounted_base_L
      #   overage_L         = line_overage(L)
      #   eip_L             = sum(ip.monthly_installment_cents for ip on L where ip.status==ACTIVE)
      #   addon_L           = sum of addon fees for L (daypass: daily_fee_cents * billed_days; monthly: monthly_fee_cents if ACTIVE in cycle)
      #   line_total_L      = prorated_base_L + overage_L + eip_L + addon_L
      # STEP 3: account_cycle_total = sum over lines of line_total_L     # ROUND PER LINE THEN SUM
      account_cycle_total = sum(line_total_L for L)
    input_set: "All Lines on the account whose status IN {ACTIVE, SUSPENDED}; each line's own Charges; group_discount computed from same active set"
    constants: {}
    precision: |
      Each line_total_L is already in whole cents (its parts are individually rounded);
      the account total is the integer sum of per-line totals — round-per-line-then-sum,
      NOT sum-of-unrounded-then-round. With monthly_fee 6995 and 3 lines at 0.10 discount
      the per-line discounted base is 6296 (6295.5 -> half-up) so the base subtotal is
      18888, whereas sum-then-round would give 18887: the pinned order yields 18888.

  - name: line_cancel_settlement
    trigger: "FORWARD: POST /lines/{lineId}/cancel; CHRONOLOGICAL: billing-cycle close"
    algorithm: forward_looking
    formula: |
      discounted_base = round_half_up(plan.monthly_fee_cents * (1 - account.group_discount_pct))
      unused_days = days_in_cycle - active_days_so_far
      # FORWARD (provisional, at cancel time): credit the unused base AND accelerate the device
      forward_credit_cents      = round_half_up(discounted_base * unused_days / days_in_cycle)   # CREDIT Charge (negative)
      forward_eip_payoff_cents  = sum(ip.remaining_balance_cents for ip on line where status==ACTIVE)  # EIP_PAYOFF Charge (positive)
    input_set: "The cancelled line and its ACTIVE InstallmentPlans; days measured against the OPEN cycle"
    constants: {}
    precision: "round_half_up to whole cents"
    variants:
      - name: forward_provisional
        when: "Applied at POST .../cancel — the line leaves mid-cycle"
        difference: "Credits unused base (forward_credit_cents) AND accelerates the EIP: the entire remaining_balance_cents is posted immediately as an EIP_PAYOFF Charge; the device is deemed kept."
      - name: chronological_final
        when: "Applied at billing-cycle close for a line that was cancelled this cycle"
        difference: "Bills only active_days of base (prorated_base, no separate unused credit) and charges the single normal monthly EIP installment for the cycle — the EIP is NOT accelerated at close because the cancel cascade already settled it; the two variants therefore attribute the device balance to different cycles and produce different per-line totals."

  - name: eip_schedule
    trigger: "POST /lines/{lineId}/installment-plans (EIP creation)"
    algorithm: aggregation
    formula: |
      financed_cents = device.retail_price_cents - down_payment_cents
      monthly_installment_cents = ceil(financed_cents / term_months)
      remaining_balance_cents (initial) = financed_cents
      # at each cycle close: remaining_balance_cents = max(0, remaining_balance_cents - monthly_installment_cents)
    input_set: "Single EIP at creation; remaining balance updated chronologically at each cycle close"
    constants: {}
    precision: "ceil to whole cents for the installment; final installment absorbs any rounding so the sum of installments == financed_cents"

  - name: upgrade_payoff
    trigger: "POST /lines/{lineId}/upgrades"
    algorithm: aggregation
    formula: |
      old_remaining = old_installment_plan.remaining_balance_cents   # at upgrade time
      payoff_charge_cents = max(0, old_remaining - trade_in_credit_cents)
      new_financed = new_device.retail_price_cents - new_down_payment_cents
      new_monthly  = ceil(new_financed / new_term_months)
    input_set: "The named old InstallmentPlan (must be ACTIVE) and the new Device"
    constants: {}
    precision: "round_half_up not needed; integer cents throughout; payoff floored at 0"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path-segment resource id resolves to an existing entity, validated left-to-right (account, then line, then sub-resource)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: business_referential
    check: "Subscriber acting on an Account/Line must own it: X-User-ID == Account.id (directly or via the line's account_id)"
    error_id: ERR_NOT_ACCOUNT_OWNER
    http_status: 403
    applies_to: "Subscriber-acting endpoints (cancel line, cancel add-on, create port-request)"

  - priority: 5
    category: business_referential
    check: "Body foreign keys resolve: plan_id -> Plan, device_id -> Device, old_installment_plan_id -> InstallmentPlan on this line"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "POST /lines, POST /installment-plans, POST /upgrades"

  - priority: 6
    category: state
    check: "Optimistic concurrency: expected_account_version must equal current Account.version on line provisioning"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /lines"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_constraint
    check: "Plan referenced for a new line or upgrade must have status ACTIVE (not RETIRED)"
    error_id: ERR_PLAN_RETIRED
    http_status: 409
    applies_to: "POST /lines, line activate"

  - priority: 9
    category: business_constraint
    check: "A PORT_IN external_number must not already be in use by any Line with non-null phone_number (uniqueness of live numbers)"
    error_id: ERR_NUMBER_IN_USE
    http_status: 409
    applies_to: "POST /port-requests (PORT_IN), port complete"

  - priority: 10
    category: business_temporal
    check: "AddOn window_end must be strictly after window_start, and a ROAMING_DAYPASS window must be a whole number of UTC days"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /addons"

  - priority: 11
    category: business_temporal
    check: "Two ROAMING_DAYPASS add-ons on the same line must not have overlapping [window_start, window_end) day-ranges (half-open, adjacency allowed)"
    error_id: ERR_ADDON_OVERLAP
    http_status: 409
    applies_to: "POST /addons (ROAMING_DAYPASS)"

  - priority: 12
    category: business_temporal
    check: "A UsageRecord.occurred_at must fall inside an OPEN BillingCycle [cycle_start, cycle_end) for the line's account"
    error_id: ERR_USAGE_OUTSIDE_CYCLE
    http_status: 422
    applies_to: "POST /usage-records"

  - priority: 13
    category: business_constraint
    check: "EIP creation requires device.stock_count > 0 and down_payment_cents < device.retail_price_cents"
    error_id: ERR_DEVICE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /installment-plans, POST /upgrades"

  - priority: 14
    category: business_fiscal
    check: "Reconnect after NONPAYMENT suspension blocked while Account.status == DELINQUENT"
    error_id: ERR_RECONNECT_BLOCKED
    http_status: 409
    applies_to: "POST /lines/{lineId}/reconnect"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Account ----
  - method: POST
    path: "/accounts"
    description: "Create a billing account"
    roles: [CarrierAgent]
    code: 201
    input: [holder_name, holder_email, billing_day_of_month]
    output: Account
    side_effects: ["status=ACTIVE; active_line_count=0; group_discount_pct=0.00; wallet_credit_cents=0; version=1"]

  - method: GET
    path: "/accounts/{accountId}"
    description: "Fetch an account with computed billing fields"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/accounts/{accountId}/mark-delinquent"
    description: "Flag an account delinquent (drives reconnect gating); operator surface"
    roles: [BillingSystem]
    code: 200
    input: [delinquent]
    output: Account
    side_effects: ["Account.status -> DELINQUENT when delinquent==true, else ACTIVE"]

  # ---- Plan (catalog) ----
  - method: POST
    path: "/plans"
    description: "Create a plan in the catalog"
    roles: [CarrierAgent]
    code: 201
    input: [code, name, monthly_fee_cents, included_data_mb, overage_tier1_cap_mb, overage_tier1_rate_milli_cents, overage_tier2_rate_milli_cents]
    output: Plan
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/plans/{planId}"
    description: "Fetch a plan"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: []
    output: Plan
    side_effects: []

  - method: POST
    path: "/plans/{planId}/retire"
    description: "Retire a plan so it can no longer back new lines"
    roles: [CarrierAgent]
    code: 200
    input: []
    output: Plan
    side_effects: ["status -> RETIRED"]

  # ---- Device (catalog) ----
  - method: POST
    path: "/devices"
    description: "Create a device in the catalog"
    roles: [CarrierAgent]
    code: 201
    input: [model, sku, retail_price_cents, stock_count]
    output: Device
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/devices/{deviceId}"
    description: "Fetch a device"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: []
    output: Device
    side_effects: []

  # ---- Line ----
  - method: POST
    path: "/lines"
    description: "Provision a new line (flat; account_id in body, OCC-guarded)"
    roles: [CarrierAgent]
    code: 201
    input: [account_id, plan_id, sim_type, expected_account_version]
    output: Line
    side_effects:
      - "Line created status=PENDING_ACTIVATION, phone_number=null"
      - "increments Account.version by 1"

  - method: GET
    path: "/lines"
    description: "List lines, filterable by account_id or plan_id (FK reverse-reachability for Line.account_id and Line.plan_id)"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: ["account_id?", "plan_id?", "status?", "limit?", "offset?"]
    output: Line[]
    side_effects: []

  - method: GET
    path: "/lines/{lineId}"
    description: "Fetch a single line"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: []
    output: Line
    side_effects: []

  - method: POST
    path: "/lines/{lineId}/activate"
    description: "Activate a pending line (assigns number, activates SIM, recomputes discount)"
    roles: [CarrierAgent]
    code: 200
    input: []
    output: Line
    side_effects:
      - "phone_number assigned; activated_at stamped; SimAssignment ISSUED->ACTIVATED; group_discount recomputed"
      - "increments Account.version by 1"

  - method: POST
    path: "/lines/{lineId}/suspend"
    description: "Suspend an active line"
    roles: [CarrierAgent]
    code: 200
    input: [suspend_reason]
    output: Line
    side_effects: ["status->SUSPENDED; SIM deactivated; add-ons paused"]

  - method: POST
    path: "/lines/{lineId}/reconnect"
    description: "Reconnect a suspended line"
    roles: [CarrierAgent]
    code: 200
    input: []
    output: Line
    side_effects: ["status->ACTIVE; suspend_reason cleared; SIM reactivated"]

  - method: POST
    path: "/lines/{lineId}/cancel"
    description: "Cancel a line (forward provisional settlement cascade)"
    roles: [Subscriber]
    code: 200
    input: []
    output: Line
    side_effects:
      - "status->CANCELLED; EIP accelerated & PAID_OFF; add-ons CANCELLED; SIM DEACTIVATED; number released"
      - "FORWARD line_cancel_settlement: CREDIT + EIP_PAYOFF Charges posted; group_discount & total_eip_outstanding recomputed; increments Account.version by 1"

  - method: GET
    path: "/lines/{lineId}/usage-summary"
    description: "Computed read: current-cycle data used, overage cents, projected line total"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: []
    output: "{ cycle_data_used_mb: integer, overage_cents: integer, prorated_base_cents: integer, projected_line_total_cents: integer }"
    side_effects: []

  # ---- SIM ----
  - method: POST
    path: "/sim-assignments"
    description: "Issue a SIM/eSIM for a line (line_id in body)"
    roles: [CarrierAgent]
    code: 201
    input: [line_id, sim_type, "iccid?"]
    output: SimAssignment
    side_effects: ["status=ISSUED"]

  - method: GET
    path: "/sim-assignments/{simAssignmentId}"
    description: "Fetch a single SIM assignment"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: []
    output: SimAssignment
    side_effects: []

  - method: GET
    path: "/sim-assignments"
    description: "List SIM assignments, filterable by line_id (FK reverse-reachability for SimAssignment.line_id)"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: ["line_id?", "status?"]
    output: SimAssignment[]
    side_effects: []

  # ---- EIP / InstallmentPlan ----
  - method: POST
    path: "/installment-plans"
    description: "Create a device installment plan (EIP) on a line (line_id in body)"
    roles: [CarrierAgent]
    code: 201
    input: [line_id, device_id, term_months, down_payment_cents]
    output: InstallmentPlan
    side_effects:
      - "financed_cents, monthly_installment_cents, remaining_balance_cents computed; status=ACTIVE"
      - "Device.stock_count decremented by 1; Account.total_eip_outstanding_cents recomputed"

  - method: GET
    path: "/installment-plans/{installmentPlanId}"
    description: "Fetch a single installment plan"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: []
    output: InstallmentPlan
    side_effects: []

  - method: GET
    path: "/installment-plans"
    description: "List installment plans, filterable by line_id or device_id (FK reverse-reachability for InstallmentPlan.line_id and InstallmentPlan.device_id)"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: ["line_id?", "device_id?", "status?"]
    output: InstallmentPlan[]
    side_effects: []

  - method: POST
    path: "/upgrades"
    description: "Upgrade device: pay off old EIP (with trade-in) and open a new EIP atomically (line_id in body)"
    roles: [CarrierAgent]
    code: 201
    input: [line_id, old_installment_plan_id, new_device_id, new_term_months, new_down_payment_cents, trade_in_credit_cents]
    output: UpgradeOrder
    side_effects:
      - "old EIP -> CANCELLED with remaining settled; payoff_charge_cents computed & posted as EIP_PAYOFF Charge"
      - "new InstallmentPlan created (ACTIVE); new_installment_plan_id set; Device.stock_count decremented; total_eip_outstanding recomputed"

  - method: GET
    path: "/upgrades/{upgradeOrderId}"
    description: "Fetch a single upgrade order"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: []
    output: UpgradeOrder
    side_effects: []

  - method: GET
    path: "/upgrades"
    description: "List upgrade orders, filterable by line_id, old_installment_plan_id, new_installment_plan_id, or new_device_id (FK reverse-reachability for UpgradeOrder FKs)"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: ["line_id?", "old_installment_plan_id?", "new_installment_plan_id?", "new_device_id?"]
    output: UpgradeOrder[]
    side_effects: []

  # ---- Port-in / Port-out ----
  - method: POST
    path: "/port-requests"
    description: "Open a number port-in or port-out request (line_id in body)"
    roles: [Subscriber, CarrierAgent]
    code: 201
    input: [line_id, direction, external_number, donor_carrier, account_pin]
    output: PortRequest
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/port-requests/{portRequestId}"
    description: "Fetch a single port request"
    roles: [CarrierAgent, Subscriber, PortingOps, BillingSystem]
    code: 200
    input: []
    output: PortRequest
    side_effects: []

  - method: GET
    path: "/port-requests"
    description: "List port requests, filterable by line_id (FK reverse-reachability for PortRequest.line_id)"
    roles: [CarrierAgent, Subscriber, PortingOps, BillingSystem]
    code: 200
    input: ["line_id?", "status?"]
    output: PortRequest[]
    side_effects: []

  - method: POST
    path: "/port-requests/{portRequestId}/validate"
    description: "PortingOps validates the request (PIN check); mismatch rejects"
    roles: [PortingOps]
    code: 200
    input: [account_pin]
    output: PortRequest
    side_effects: ["status->VALIDATED, or ->REJECTED with reject_reason=PIN_MISMATCH"]

  - method: POST
    path: "/port-requests/{portRequestId}/complete"
    description: "PortingOps completes the port (moves the number; PORT_OUT cancels the line)"
    roles: [PortingOps]
    code: 200
    input: []
    output: PortRequest
    side_effects: ["PORT_IN: number imported; PORT_OUT: number released + line cancel cascade; increments Account.version by 1 on PORT_OUT"]

  - method: POST
    path: "/port-requests/{portRequestId}/reject"
    description: "PortingOps rejects the port (no number movement)"
    roles: [PortingOps]
    code: 200
    input: [reject_reason]
    output: PortRequest
    side_effects: ["status->REJECTED"]

  - method: POST
    path: "/port-requests/{portRequestId}/revert"
    description: "PortingOps reverts a completed PORT_IN (number returned to donor)"
    roles: [PortingOps]
    code: 200
    input: []
    output: PortRequest
    side_effects: ["PORT_IN: phone_number cleared to null"]

  # ---- Add-ons ----
  - method: POST
    path: "/addons"
    description: "Attach an international/roaming add-on to a line (line_id in body)"
    roles: [Subscriber, CarrierAgent]
    code: 201
    input: [line_id, addon_type, "daily_fee_cents?", "monthly_fee_cents?", window_start, window_end]
    output: AddOn
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/addons/{addonId}"
    description: "Fetch a single add-on"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  - method: GET
    path: "/addons"
    description: "List add-ons, filterable by line_id (FK reverse-reachability for AddOn.line_id)"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: ["line_id?", "status?"]
    output: AddOn[]
    side_effects: []

  - method: POST
    path: "/addons/{addonId}/activate"
    description: "Activate a scheduled add-on (window must have started)"
    roles: [CarrierAgent, Subscriber]
    code: 200
    input: []
    output: AddOn
    side_effects: ["status->ACTIVE"]

  - method: POST
    path: "/addons/{addonId}/cancel"
    description: "Cancel an add-on"
    roles: [Subscriber, CarrierAgent]
    code: 200
    input: []
    output: AddOn
    side_effects: ["status->CANCELLED"]

  # ---- Usage ----
  - method: POST
    path: "/usage-records"
    description: "Ingest a usage event for a line (line_id in body)"
    roles: [CarrierAgent, BillingSystem]
    code: 201
    input: [line_id, usage_type, "data_mb?", occurred_at]
    output: UsageRecord
    side_effects: ["Line.cycle_data_used_mb recomputed for DATA records inside the open cycle"]

  - method: GET
    path: "/usage-records/{usageRecordId}"
    description: "Fetch a single usage record"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: []
    output: UsageRecord
    side_effects: []

  - method: GET
    path: "/usage-records"
    description: "List usage records, filterable by line_id (FK reverse-reachability for UsageRecord.line_id)"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: ["line_id?", "usage_type?", "limit?", "offset?"]
    output: UsageRecord[]
    side_effects: []

  # ---- Billing cycle ----
  - method: POST
    path: "/billing-cycles"
    description: "Open the first/next billing cycle for an account (account_id in body)"
    roles: [BillingSystem]
    code: 201
    input: [account_id, cycle_start, cycle_end]
    output: BillingCycle
    side_effects: ["status=OPEN; days_in_cycle computed"]

  - method: GET
    path: "/billing-cycles/{cycleId}"
    description: "Fetch a single billing cycle"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: []
    output: BillingCycle
    side_effects: []

  - method: GET
    path: "/billing-cycles"
    description: "List billing cycles, filterable by account_id (FK reverse-reachability for BillingCycle.account_id)"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: ["account_id?", "status?"]
    output: BillingCycle[]
    side_effects: []

  - method: POST
    path: "/billing-cycles/{cycleId}/close"
    description: "Close a cycle: final settlement, post all charges, open successor cycle"
    roles: [BillingSystem]
    code: 200
    input: []
    output: BillingCycle
    side_effects:
      - "CHRONOLOGICAL settlement; PLAN_BASE/OVERAGE/EIP_INSTALLMENT/ADDON Charges posted; EIP balances decremented"
      - "total_charges_cents set; successor OPEN cycle created"

  # ---- Charges (ledger) ----
  - method: GET
    path: "/charges/{chargeId}"
    description: "Fetch a single charge"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: []
    output: Charge
    side_effects: []

  - method: GET
    path: "/charges"
    description: "List charges, filterable by billing_cycle_id or line_id (FK reverse-reachability for Charge.billing_cycle_id and Charge.line_id)"
    roles: [CarrierAgent, Subscriber, BillingSystem]
    code: 200
    input: ["billing_cycle_id?", "line_id?", "charge_type?"]
    output: Charge[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC instant (test/operator surface for windowed add-ons and cycle close)"
    roles: [BillingSystem]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Advances clock; SCHEDULED add-ons whose window_start is reached may be activated; ACTIVE add-ons past window_end EXPIRE on next read"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint per RBAC" }
  - { id: ERR_NOT_ACCOUNT_OWNER, http: 403, condition: "Subscriber acting on an account/line they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-segment resource id does not resolve" }
  - { id: ERR_FK_NOT_FOUND, http: 422, condition: "A body foreign key (plan_id/device_id/old_installment_plan_id) does not resolve" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field or wrong type in request body" }
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version does not match current Account.version on line provisioning" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_PLAN_RETIRED, http: 409, condition: "New line/upgrade references a RETIRED plan" }
  - { id: ERR_SIM_NOT_ISSUED, http: 409, condition: "Activating a line with no ISSUED SimAssignment" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Operation requires Account.status==ACTIVE" }
  - { id: ERR_NUMBER_IN_USE, http: 409, condition: "PORT_IN external_number already held by a live line" }
  - { id: ERR_PORT_IN_PROGRESS, http: 409, condition: "Cancelling a line that has an in-flight (REQUESTED/VALIDATED) PortRequest" }
  - { id: ERR_PORT_NOT_REVERTABLE, http: 409, condition: "Revert attempted on a PORT_OUT or a non-COMPLETED port" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "AddOn window_end <= window_start, or daypass window not a whole number of UTC days" }
  - { id: ERR_ADDON_OVERLAP, http: 409, condition: "Two ROAMING_DAYPASS add-ons overlap on the same line" }
  - { id: ERR_ADDON_WINDOW_NOT_STARTED, http: 409, condition: "Activating an add-on before current UTC >= window_start" }
  - { id: ERR_USAGE_OUTSIDE_CYCLE, http: 422, condition: "UsageRecord.occurred_at not inside an OPEN cycle for the account" }
  - { id: ERR_DEVICE_UNAVAILABLE, http: 409, condition: "EIP/upgrade on a device with stock_count==0 or down_payment >= retail_price" }
  - { id: ERR_RECONNECT_BLOCKED, http: 409, condition: "Reconnect after NONPAYMENT while account DELINQUENT" }
  - { id: ERR_CYCLE_NOT_ENDED, http: 409, condition: "Closing a cycle before current UTC >= cycle_end" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CarrierAgent
    description: "Carrier store/operations agent: provisions accounts, plans, devices, lines, SIMs, EIPs, upgrades; performs line lifecycle (activate/suspend/reconnect)."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts — create account"
      - "POST /plans, POST /plans/{id}/retire — plan catalog"
      - "POST /devices — device catalog"
      - "POST /accounts/{id}/lines — provision line (OCC)"
      - "POST .../lines/{id}/activate, /suspend, /reconnect — line lifecycle"
      - "POST .../sim-assignments — issue SIM/eSIM"
      - "POST .../installment-plans — open EIP"
      - "POST .../upgrades — device upgrade"
    shared_operations:
      - "GET reads on accounts, plans, devices, lines, sub-resources"
      - "POST .../port-requests — open port (with Subscriber)"
      - "POST .../addons, .../addons/{id}/activate, .../addons/{id}/cancel — add-ons (with Subscriber)"
      - "POST .../usage-records — ingest usage (with BillingSystem)"

  - name: Subscriber
    description: "Account holder acting on their own account. X-User-ID equals the Account.id they own."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST .../lines/{id}/cancel — cancel own line"
    shared_operations:
      - "GET reads on own account, lines, sub-resources"
      - "POST .../port-requests — open port (with CarrierAgent)"
      - "POST .../addons, .../addons/{id}/activate, .../addons/{id}/cancel — add-ons (with CarrierAgent)"

  - name: PortingOps
    description: "Number-portability operations desk: adjudicates port-in/out (validate, complete, reject, revert)."
    identity: "opaque"
    exclusive_operations:
      - "POST .../port-requests/{id}/validate — validate / PIN-check"
      - "POST .../port-requests/{id}/complete — complete port"
      - "POST .../port-requests/{id}/reject — reject port"
      - "POST .../port-requests/{id}/revert — revert completed PORT_IN"
    shared_operations:
      - "GET .../port-requests — list port requests"

  - name: BillingSystem
    description: "Billing/usage backend operator: opens & closes billing cycles, ingests usage, sets the clock, flags delinquency."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts/{id}/billing-cycles — open cycle"
      - "POST .../billing-cycles/{id}/close — close cycle & settle"
      - "POST /accounts/{id}/mark-delinquent — delinquency flag"
      - "POST /_clock/set_current_utc — advance clock"
    shared_operations:
      - "GET reads on accounts, lines, cycles, charges"
      - "POST .../usage-records — ingest usage (with CarrierAgent)"
