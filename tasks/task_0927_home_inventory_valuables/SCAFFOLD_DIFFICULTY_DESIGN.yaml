              captures: { hh_v: $.data.version }
          trigger:
            - call: "POST /vault/packages/${pkg_id}/generate"
              payload: { expected_household_version: "${hh_v}" }
              as: Homeowner
              as_user_id: "${owner_id}"
          assert:
            - "Item.${it_1}.acv_value_cents == 189991"
            - "Item.${it_2}.acv_value_cents == 189991"
            - "Item.${it_3}.acv_value_cents == 189991"
            - "DocumentationPackage.${pkg_id}.line_count == 3"
            - "DocumentationPackage.${pkg_id}.snapshot_total_effective_cents == 569973"
            - "DocumentationPackage.${pkg_id}.snapshot_total_covered_cents == 400000"
            - "DocumentationPackage.${pkg_id}.snapshot_coverage_gap_cents == 169973"
            - "DocumentationPackage.${pkg_id}.status == GENERATED"

      - name: claim_settlement_clips_every_line_before_allocating_any_deductible
        grounds:
          - calculations.claim_settlement_allocation
          - entities.ClaimLine.fields.capped_value_cents
          - entities.ClaimLine.fields.deductible_share_cents
          - entities.Policy.fields.deductible_cents
          - state_machines.LossClaim.status.UNDER_REVIEW_to_SETTLED
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency pinned by evaluation order. The
          category sublimit clip needs the gross values, the deductible split needs the
          clipped values, and the reported total needs both. Running all clipping before
          any deductible allocation gives shares 80000 / 20000; allocating the deductible
          on the unclipped gross values first would give 57143 / 42857. The scaffold pins
          clip-then-allocate.
        test_recipe:
          setup:
            - "A COLLECTIBLE CategorySchedule with a 500000-cent blanket sublimit."
            - "A policy with deductible 100000; two CATALOGED COLLECTIBLE items, each PHOTO_SERIAL."
            - "Item A (line created first) replacement cost 400000; item B replacement cost 300000."
            - "An RCV claim with deductible_mode PRO_RATA carrying both lines; both lines approved."
