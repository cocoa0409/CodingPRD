scenario: "Public School District Choice & Magnet School Lottery: enrollment window, sibling priority, district boundaries, poverty index weighting, weighted lottery algorithm, supplemental waitlist, inter-district transfer"

domain_name: "school-choice-lottery"
api_prefix: "/lottery"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - selector_policy

  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: District
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique short district code (e.g., 'D01')."
        constraints: "Uppercase alphanumeric, 3-8 chars, globally unique."
      - name: name
        type: string
        source: input
        description: "Display name of the district."
      - name: poverty_index_pct
        type: number
        source: input
        description: "Federal poverty rate for this district's catchment, in percent."
        constraints: "0 <= poverty_index_pct <= 100; two decimals."
      - name: status
        type: enum
        source: system
        description: "Lifecycle status of the district configuration."
        constraints: "ACTIVE | ARCHIVED"
        default: "ACTIVE"

  - name: School
    parent: null
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: "FK -> District.id; the district that operates this school."
      - name: code
        type: string
        source: input
        description: "School short code, unique within the district."
        constraints: "Uppercase alphanumeric, 3-12 chars; unique per district_id."
      - name: name
        type: string
        source: input
        description: "School display name."
      - name: school_type
        type: enum
        source: input
        description: "Operational category of this school."
        constraints: "NEIGHBORHOOD | MAGNET"
      - name: grade_min
        type: integer
        source: input
        description: "Lowest grade offered (K is grade 0)."
        constraints: "0 <= grade_min <= grade_max"
      - name: grade_max
        type: integer
        source: input
        description: "Highest grade offered."
        constraints: "grade_min <= grade_max <= 12"
      - name: total_seats
        type: integer
        source: input
        description: "Total seats available across all grades for the lottery window."
        constraints: "total_seats >= 0"

  - name: BoundaryRule
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the school whose catchment this rule defines."
      - name: zone_code
        type: string
        source: input
        description: "Residential zone code (e.g., postal code or attendance-zone label)."
        constraints: "Uppercase alphanumeric, 3-10 chars."
      - name: is_in_boundary
        type: boolean
        source: input
        description: "True when zone_code is inside this school's attendance area."
        default: true

  - name: EnrollmentWindow
    parent: null
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: "FK -> District.id; the district running this window."
      - name: cycle_label
        type: string
        source: input
        description: "Human label such as '2026-27'; unique per district_id."
        constraints: "Unique per district_id."
      - name: opens_at
        type: datetime
        source: input
        description: "ISO 8601 UTC; window opens (inclusive). Applications accepted >= opens_at."
      - name: closes_at
        type: datetime
        source: input
        description: "ISO 8601 UTC; window closes (exclusive). Applications accepted strictly before closes_at."
        constraints: "closes_at > opens_at."
      - name: lottery_runs_at
        type: datetime
        source: input
        description: "ISO 8601 UTC; planned lottery run instant; must be >= closes_at."
      - name: status
        type: enum
        source: system
        description: "Lifecycle status."
        constraints: "DRAFT | OPEN | CLOSED | LOTTERY_RUN | FINALIZED"
        default: "DRAFT"

  - name: Family
    parent: null
    common_fields: true
    fields:
      - name: guardian_email
        type: string
        source: input
        description: "Primary guardian's contact email; globally unique."
        constraints: "Lowercase; globally unique."
      - name: residence_zone_code
        type: string
        source: input
        description: "The zone_code where the family resides (matches BoundaryRule.zone_code)."
      - name: residence_district_id
        type: string
        source: input
        description: "FK -> District.id; the district where the family resides (their home district)."
      - name: poverty_flag
        type: boolean
        source: input
        description: "True if the family is below the federal poverty line for the cycle."
        default: false

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id; the family this student belongs to."
      - name: full_name
        type: string
        source: input
        description: "Student's full legal name."
      - name: grade_for_cycle
        type: integer
        source: input
        description: "The grade this student will enter during the cycle (K is 0)."
        constraints: "0 <= grade_for_cycle <= 12"

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: window_id
        type: string
        source: input
        description: "FK -> EnrollmentWindow.id; the cycle this application is for."
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student being enrolled."
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the school being applied to."
      - name: choice_rank
        type: integer
        source: input
        description: "Family-stated rank of this choice (1=top). Unique per (student_id, window_id)."
        constraints: "1 <= choice_rank <= 5; unique per (student_id, window_id)."
      - name: inter_district_transfer
        type: boolean
        source: computed
        description: "True when school.district_id != family.residence_district_id at acceptance time."
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle status."
        constraints: "DRAFT | SUBMITTED | ACCEPTED | WAITLISTED | REJECTED | WITHDRAWN | OFFERED | DECLINED | ENROLLED"
        default: "DRAFT"
      - name: lottery_weight
        type: number
        source: computed
        description: "Final numeric weight used in lottery ranking; computed by calculation `lottery_weight_total`."
        default: 0.0
      - name: lottery_rank
        type: integer
        source: system
        description: "Assigned rank within the school's lottery pool (1=best). Null until LOTTERY_RUN."
        default: null

  - name: SiblingBond
    parent: null
    common_fields: false
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the applying student."
      - name: sibling_student_id
        type: string
        source: input
        description: "FK -> Student.id; the already-enrolled sibling student."
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the school where the sibling is currently enrolled (status=ENROLLED)."

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application this offer fulfills."
      - name: status
        type: enum
        source: system
        description: "Lifecycle status."
        constraints: "OFFERED | ACCEPTED | DECLINED | EXPIRED"
        default: "OFFERED"
      - name: offered_at
        type: datetime
        source: system
        description: "When the offer was issued (UTC)."
      - name: respond_by
        type: datetime
        source: system
        description: "Deadline for family response (offered_at + 7 days)."
      - name: source
        type: enum
        source: system
        description: "Where the offer originated."
        constraints: "LOTTERY | WAITLIST_PROMOTION"

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the waitlisted application."
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the school whose waitlist this entry is on."
      - name: queue_rank
        type: integer
        source: system
        description: "Position in the school's waitlist (1=next to be offered)."
        constraints: "queue_rank >= 1; unique per school_id among ACTIVE entries."
      - name: status
        type: enum
        source: system
        description: "Lifecycle status."
        constraints: "ACTIVE | PROMOTED | REMOVED"
        default: "ACTIVE"

  - name: SystemClock
    parent: null
    common_fields: false
    fields:
      - name: current_utc
        type: datetime
        source: system
        description: "Current server clock in UTC, settable through the /_clock test-driving endpoint."

# =============================================================================
# §1.2 State Machines
# =============================================================================
state_machines:
  - entity: EnrollmentWindow
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /lottery/windows/{id}/open"
        actor: DistrictAdmin
        preconditions:
          - "window.opens_at <= clock.current_utc < window.closes_at"
          - "window.district.status == ACTIVE"
        side_effects:
          - "EnrollmentWindow.status = OPEN"
          - "EnrollmentWindow.version increments by 1"

      - from: OPEN
        to: CLOSED
        trigger: "POST /lottery/windows/{id}/close OR clock advances past closes_at via /_clock"
        actor: system | DistrictAdmin
        preconditions:
          - "clock.current_utc >= window.closes_at"
        side_effects:
          - "EnrollmentWindow.status = CLOSED"
          - "All Applications with status=DRAFT for this window auto-transition to WITHDRAWN (cascade)"
          - "EnrollmentWindow.version increments by 1"

      - from: CLOSED
        to: LOTTERY_RUN
        trigger: "POST /lottery/windows/{id}/run-lottery"
        actor: DistrictAdmin
        preconditions:
          - "clock.current_utc >= window.lottery_runs_at"
          - "window.status == CLOSED"
        side_effects:
          - "Calculation `lottery_weight_total` runs on every SUBMITTED Application in the window"
          - "Calculation `lottery_seat_assignment` partitions Applications per school into top-N (ACCEPTED) and overflow (WAITLISTED)"
          - "Every accepted Application produces an Offer (status=OFFERED, source=LOTTERY); cascade applies"
          - "Every overflow Application produces a WaitlistEntry (status=ACTIVE) with queue_rank derived from lottery_weight"
          - "EnrollmentWindow.status = LOTTERY_RUN"
          - "EnrollmentWindow.version increments by 1"

      - from: LOTTERY_RUN
        to: FINALIZED
        trigger: "POST /lottery/windows/{id}/finalize"
        actor: DistrictAdmin
        preconditions:
          - "No Application in this window has status=OFFERED (all responded or expired)"
        side_effects:
          - "EnrollmentWindow.status = FINALIZED"
          - "All ACTIVE WaitlistEntry rows for schools in this window auto-transition to REMOVED (cascade)"
          - "EnrollmentWindow.version increments by 1"

  - entity: Application
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN, ENROLLED, DECLINED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /lottery/applications/{id}/submit"
        actor: Guardian
        preconditions:
          - "associated EnrollmentWindow.status == OPEN"
          - "Student.grade_for_cycle is in [School.grade_min, School.grade_max]"
        side_effects:
          - "Application.status = SUBMITTED"
          - "Application.version increments by 1"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /lottery/applications/{id}/withdraw"
        actor: Guardian
        preconditions:
          - "associated EnrollmentWindow.status IN {OPEN, CLOSED}"
        side_effects:
          - "Application.status = WITHDRAWN"
          - "Application.version increments by 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "EnrollmentWindow OPEN->CLOSED transition (cascade) OR POST /lottery/applications/{id}/withdraw"
        actor: system | Guardian
        preconditions: []
        side_effects:
          - "Application.status = WITHDRAWN"
          - "Application.version increments by 1"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "Lottery run (cascade from EnrollmentWindow CLOSED->LOTTERY_RUN)"
        actor: system
        preconditions:
          - "Application.lottery_rank <= School.total_seats after lottery_seat_assignment"
        side_effects:
          - "Application.status = ACCEPTED"
          - "Application.inter_district_transfer = (School.district_id != Family.residence_district_id)"
          - "Offer row created with status=OFFERED, source=LOTTERY, offered_at=clock.current_utc, respond_by=offered_at+7d"
          - "Application.version increments by 1"

      - from: SUBMITTED
        to: WAITLISTED
        trigger: "Lottery run (cascade); application not in top-N"
        actor: system
        preconditions:
          - "Application.lottery_rank > School.total_seats"
        side_effects:
          - "Application.status = WAITLISTED"
          - "WaitlistEntry row created with status=ACTIVE; queue_rank = lottery_rank - School.total_seats"
          - "Application.version increments by 1"

      - from: ACCEPTED
        to: ENROLLED
        trigger: "POST /lottery/offers/{offer_id}/accept"
        actor: Guardian
        preconditions:
          - "Offer.status == OFFERED"
          - "clock.current_utc < Offer.respond_by"
        side_effects:
          - "Offer.status = ACCEPTED"
          - "Application.status = ENROLLED"
          - "Application.version increments by 1"

      - from: ACCEPTED
        to: DECLINED
        trigger: "POST /lottery/offers/{offer_id}/decline OR clock advances past respond_by (system expiry via /_clock)"
        actor: Guardian | system
        preconditions:
          - "Offer.status == OFFERED"
        side_effects:
          - "Offer.status = DECLINED (or EXPIRED on auto-expiry)"
          - "Application.status = DECLINED"
          - "Top ACTIVE WaitlistEntry for this school (lowest queue_rank) is promoted: its Application.status transitions WAITLISTED->ACCEPTED, a new Offer with source=WAITLIST_PROMOTION is created, that WaitlistEntry.status becomes PROMOTED. (cascade-2)"
          - "Application.version increments by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /lottery/applications/{id}/reject"
        actor: DistrictAdmin
        preconditions:
          - "EnrollmentWindow.status IN {OPEN, CLOSED}"
        side_effects:
          - "Application.status = REJECTED"
          - "Application.version increments by 1"

  - entity: Offer
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /lottery/offers/{id}/accept"
        actor: Guardian
        preconditions:
          - "clock.current_utc < Offer.respond_by"
        side_effects:
          - "Offer.status = ACCEPTED"
          - "Linked Application transitions ACCEPTED->ENROLLED"
          - "Offer.version increments by 1"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /lottery/offers/{id}/decline"
        actor: Guardian
        preconditions:
          - "Offer.status == OFFERED"
        side_effects:
          - "Offer.status = DECLINED"
          - "Linked Application transitions ACCEPTED->DECLINED"
          - "Waitlist promotion cascade fires (see Application ACCEPTED->DECLINED)"
          - "Offer.version increments by 1"

      - from: OFFERED
        to: EXPIRED
        trigger: "POST /lottery/windows/{id}/expire-offers (or /_clock past respond_by) — system batch sweep"
        actor: system
        preconditions:
          - "clock.current_utc >= Offer.respond_by"
        side_effects:
          - "Offer.status = EXPIRED"
          - "Linked Application transitions ACCEPTED->DECLINED"
          - "Waitlist promotion cascade fires"
          - "Offer.version increments by 1"

  - entity: WaitlistEntry
    initial_state: ACTIVE
    terminal_states: [PROMOTED, REMOVED]
    transitions:
      - from: ACTIVE
        to: PROMOTED
        trigger: "System cascade when an ACCEPTED Offer for the same school is declined or expires"
        actor: system
        preconditions:
          - "Entry has lowest queue_rank among ACTIVE entries on the same school"
          - "Linked EnrollmentWindow.status IN {LOTTERY_RUN}"
        side_effects:
          - "WaitlistEntry.status = PROMOTED"
          - "Linked Application transitions WAITLISTED->ACCEPTED"
          - "New Offer created with source=WAITLIST_PROMOTION, respond_by = clock.current_utc + 7d"
          - "Remaining ACTIVE entries' queue_rank decrement by 1"

      - from: ACTIVE
        to: REMOVED
        trigger: "EnrollmentWindow LOTTERY_RUN->FINALIZED cascade OR family withdraws"
        actor: system | Guardian
        preconditions: []
        side_effects:
          - "WaitlistEntry.status = REMOVED"
          - "Linked Application (if still WAITLISTED) transitions WAITLISTED->WITHDRAWN"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: window-run-lottery-stale-version
    parent_entity: EnrollmentWindow
    write_endpoint: "POST /lottery/windows/{id}/run-lottery"
    occ_field: "expected_window_version"
    description: |
      Running the lottery against an EnrollmentWindow whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another district admin has already closed the window (or run the lottery)
      and the current writer's view of the window is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: offer-accept-stale-version
    parent_entity: Offer
    write_endpoint: "POST /lottery/offers/{id}/accept"
    occ_field: "expected_offer_version"
    description: |
      Accepting an Offer whose version has advanced since the client last observed
      it is rejected. This captures the case where the offer has just been
      expired by the clock sweep (cascade promotes waitlist) and the family's
      view of the offer is stale; the client's prior version no longer matches.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculations
# =============================================================================
calculations:
  - name: lottery_weight_total
    trigger: "Cascade from EnrollmentWindow CLOSED->LOTTERY_RUN transition; computed per SUBMITTED Application"
    algorithm: weighted_scoring
    formula: |
      # Final mode (forward-looking weighting using ALL submitted apps of the cycle).
      # Order is fixed: compute base_weight, then add deterministic boosts in order
      # (sibling, in_boundary, poverty), then apply tie-break field tracking.
      base_weight = 1.000
      sibling_boost = 0.500 if EXISTS SiblingBond(student_id=app.student_id, school_id=app.school_id)
                                AND the linked sibling student has ANY Application against school_id
                                  whose status == ENROLLED (final variant)
                                  OR status IN {SUBMITTED, ACCEPTED, ENROLLED} (provisional variant)
                              else 0.000
      in_boundary  = 0.300 if EXISTS BoundaryRule(school_id=app.school_id,
                                                  zone_code=family.residence_zone_code,
                                                  is_in_boundary=true)
                              else 0.000
      poverty_pct  = family.residence_district.poverty_index_pct  # district-level
      poverty_boost = round(poverty_pct / 100.0 * 0.400, 3)        # max 0.400 at 100% poverty
      family_flag_boost = 0.200 if family.poverty_flag is true else 0.000
      lottery_weight = round(base_weight + sibling_boost + in_boundary + poverty_boost + family_flag_boost, 3)
      # Tie-break key (recorded for lottery_seat_assignment): (lottery_weight DESC, family.poverty_flag DESC, application.created_at ASC)
    input_set: "All Applications with status=SUBMITTED in this EnrollmentWindow."
    constants:
      BASE_WEIGHT: 1.000
      SIBLING_BOOST: 0.500
      IN_BOUNDARY_BOOST: 0.300
      POVERTY_INDEX_MAX_BOOST: 0.400
      FAMILY_POVERTY_FLAG_BOOST: 0.200
    precision: "3 decimal places, round_half_up; rounding is applied ONCE to the final sum (NOT per-term), and poverty_boost is rounded independently to 3 decimals before being summed (pin: round-per-term-poverty-only then sum, never round-the-final-sum-then-add)"
    variants:
      - name: provisional
        when: "Family preview via GET /lottery/applications/{id}/weight-preview (read-only) while window is OPEN"
        difference: |
          Same formula except: sibling_boost fires when EXISTS SiblingBond(student,school) AND
          the linked sibling student has ANY Application against this school_id whose status IN
          {SUBMITTED, ACCEPTED, ENROLLED} (forward-looking). The final variant requires the
          sibling's Application.status == ENROLLED. Same inputs, different result.
      - name: final
        when: "Run during CLOSED->LOTTERY_RUN; persisted as Application.lottery_weight"
        difference: "Sibling boost requires sibling.status == ENROLLED; uses clock.current_utc at the lottery_runs_at instant as the cutoff."

  - name: lottery_seat_assignment
    trigger: "Cascade from EnrollmentWindow CLOSED->LOTTERY_RUN; runs per school after all weights computed"
    algorithm: waterfall_allocation
    formula: |
      # Per school in this window, sort SUBMITTED applications by:
      #   1) lottery_weight DESC
      #   2) family.poverty_flag DESC (true before false)
      #   3) application.created_at ASC
      # Then assign lottery_rank = 1..N. The top `school.total_seats` applications
      # become ACCEPTED; the remainder become WAITLISTED with queue_rank =
      # lottery_rank - school.total_seats (i.e., rank N+1 gets queue_rank 1).
      # Inter-district transfer applications are subject to RULE_IDT_CAP below:
      # the count of inter-district ACCEPTEDs at any school may not exceed
      # floor(0.10 * school.total_seats). The threshold is strict: an IDT
      # application whose admission would push the count above the cap is
      # demoted to WAITLISTED even if its lottery_rank is within total_seats;
      # the next in-district application by rank is promoted in its place.
      # IDT cap evaluation order: traverse sorted apps top-down; admit until
      # capacity is hit; an IDT app that would exceed the IDT cap is skipped
      # (kept in the ordering for waitlist).
    input_set: "All Applications with status=SUBMITTED in this window, grouped by school_id."
    constants:
      IDT_CAP_FRACTION: 0.10
    precision: "Integer ranks. IDT cap uses floor(0.10 * total_seats); a school with total_seats=9 has IDT cap 0 (boundary)."

  - name: family_risk_score
    trigger: "Computed on family creation and recomputed on every Application status change for this family"
    algorithm: aggregation
    formula: |
      # Family risk score (out of 1.000) flags families where outcomes are at risk
      # of misallocation. Independent entity domain from lottery_weight_total
      # (Family, not Application). Order-sensitive sum:
      #   step 1: count_declined  = count of Applications under this family with status=DECLINED
      #   step 2: count_waitlisted = count of Applications with status=WAITLISTED
      #   step 3: count_enrolled  = count with status=ENROLLED
      # provisional variant: ignores DECLINED, treats them as still in play (apps may resubmit next window)
      # final variant: counts all terminal-state apps for risk audit
      #   final_score = round(0.35 * count_declined + 0.15 * count_waitlisted - 0.20 * count_enrolled, 3)
      #   provisional_score = round(0.15 * count_waitlisted - 0.20 * count_enrolled, 3)
      # Clamp to [0.000, 1.000].
    input_set: "Applications belonging to family.id."
    constants:
      DECLINED_WEIGHT: 0.35
      WAITLISTED_WEIGHT: 0.15
      ENROLLED_WEIGHT: -0.20
      MIN_SCORE: 0.000
      MAX_SCORE: 1.000
    precision: "3 decimal places, round_half_up; clamp after rounding"
    variants:
      - name: provisional
        when: "GET /lottery/families/{id}/risk-preview while any child application is still SUBMITTED"
        difference: "Excludes DECLINED applications from the count (forward-looking)."
      - name: final
        when: "Post-FINALIZED audit via GET /lottery/families/{id}/risk-final"
        difference: "Includes DECLINED applications (chronological audit)."

  - name: school_acceptance_rate
    trigger: "GET /lottery/schools/{id}/acceptance-rate; computed live on call"
    algorithm: threshold
    formula: |
      # Returns a pct: (count of ACCEPTED Applications for the school in the
      # most recent EnrollmentWindow with status >= LOTTERY_RUN of the school's
      # district) / (count of SUBMITTED + ACCEPTED + WAITLISTED Applications
      # for the school in that window). Numerator includes only ACCEPTED
      # (not ENROLLED) at evaluation time. Returns 0.000 when denominator is 0.
      # The "most recent" is the EnrollmentWindow with the greatest lottery_runs_at
      # value among district windows whose status IN {LOTTERY_RUN, FINALIZED}.
      # Tie-break (rare, same instant): EnrollmentWindow.created_at ASC.
    input_set: "Applications for this school in the most recent runnable window."
    constants:
      THRESHOLD_HOT: 0.30   # If acceptance_rate < HOT, the school is reported `is_competitive: true`
    precision: "3 decimals, round_half_up; competitive flag uses strict `<` boundary (0.30 is NOT competitive)."

# =============================================================================
# §1.4 Validations (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and valid; X-User-Role must be a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all (except POST /lottery/families/register, POST /_clock/set_current_utc when seeding)"

  - priority: 2
    category: auth
    check: "Role permitted for the requested operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-supplied ids exist (left-to-right); request-body FK ids resolve to existing rows"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in the correct state for this operation per §1.2; e.g., submit requires Application.status=DRAFT AND window.status=OPEN"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 5
    category: business_temporal
    check: "EnrollmentWindow open/close timing: opens_at < closes_at, closes_at <= lottery_runs_at; clock-gated transitions only permitted when clock has passed the gate timestamp"
    error_id: ERR_WINDOW_TIMING
    http_status: 422
    applies_to: "POST /lottery/windows, POST /lottery/windows/{id}/open, POST /lottery/windows/{id}/close, POST /lottery/windows/{id}/run-lottery"

  - priority: 6
    category: business_safety
    check: "Family residence_district_id matches an ACTIVE District; school district_id matches an ACTIVE District; archived districts may not be referenced in new applications"
    error_id: ERR_DISTRICT_ARCHIVED
    http_status: 422
    applies_to: "POST /lottery/applications, POST /lottery/families/register, POST /lottery/schools, POST /lottery/students"

  - priority: 7
    category: business_referential
    check: "Application.student_id must belong to the requesting Guardian's Family (X-User-ID); Guardian cannot apply on behalf of another family's student"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /lottery/applications, POST /lottery/applications/{id}/submit, POST /lottery/applications/{id}/withdraw, POST /lottery/offers/{id}/accept, POST /lottery/offers/{id}/decline"

  - priority: 8
    category: business_constraint
    check: "Application choice_rank unique within (student_id, window_id); 1<=choice_rank<=5; at most 5 applications per student per window"
    error_id: ERR_DUPLICATE_CHOICE
    http_status: 409
    applies_to: "POST /lottery/applications"

  - priority: 9
    category: business_constraint
    check: "Student.grade_for_cycle must be within [school.grade_min, school.grade_max] at application creation; boundary inclusive on both ends"
    error_id: ERR_GRADE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /lottery/applications"

  - priority: 10
    category: business_constraint
    check: "OCC: expected_<parent>_version must match the parent entity's current version exactly (412 Precondition Failed if mismatched)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /lottery/windows/{id}/run-lottery, POST /lottery/offers/{id}/accept"

  - priority: 11
    category: business_constraint
    check: "School total_seats must be >= 0 and IDT cap floor(0.10*total_seats) must be consistent with declared cap policy"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /lottery/schools, PATCH /lottery/schools/{id}"

  - priority: 12
    category: business_fiscal
    check: "EnrollmentWindow may not be opened on a district whose poverty_index_pct > 100 or < 0 (data sanity)"
    error_id: ERR_DISTRICT_DATA_INVALID
    http_status: 422
    applies_to: "POST /lottery/windows/{id}/open"

# =============================================================================
# §1.5 API Endpoints
# =============================================================================
endpoints:
  # ----- Districts -----
  - method: POST
    path: "/lottery/districts"
    description: "Create a new district configuration."
    roles: [DistrictAdmin]
    code: 201
    input: [code, name, poverty_index_pct]
    output: District
    side_effects:
      - "District row created with status=ACTIVE, version=1"

  - method: GET
    path: "/lottery/districts/{id}"
    description: "Get a district by id."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: []
    output: District
    side_effects: []

  - method: GET
    path: "/lottery/districts"
    description: "List districts; supports filtering by status."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: District[]
    side_effects: []

  - method: PATCH
    path: "/lottery/districts/{id}"
    description: "Update district poverty index or status."
    roles: [DistrictAdmin]
    code: 200
    input: ["poverty_index_pct?", "status?"]
    output: District
    side_effects:
      - "District.updated_at refreshed; District.version increments by 1"

  # ----- Schools -----
  - method: POST
    path: "/lottery/schools"
    description: "Create a school within an ACTIVE district."
    roles: [DistrictAdmin]
    code: 201
    input: [district_id, code, name, school_type, grade_min, grade_max, total_seats]
    output: School
    side_effects:
      - "School row created with version=1"

  - method: GET
    path: "/lottery/schools/{id}"
    description: "Get a school by id."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: []
    output: School
    side_effects: []

  - method: GET
    path: "/lottery/schools"
    description: "List schools; filterable by district_id, school_type."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: ["district_id?", "school_type?", "limit?", "offset?"]
    output: School[]
    side_effects: []

  - method: PATCH
    path: "/lottery/schools/{id}"
    description: "Update school capacity or name."
    roles: [DistrictAdmin]
    code: 200
    input: ["name?", "total_seats?"]
    output: School
    side_effects:
      - "School.version increments by 1"

  - method: GET
    path: "/lottery/schools/{id}/acceptance-rate"
    description: "Read computed acceptance rate per `school_acceptance_rate` calculation."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: []
    output: "{ acceptance_rate: number, is_competitive: boolean, source_window_id: string }"
    side_effects: []

  # ----- Boundary Rules -----
  - method: POST
    path: "/lottery/boundary-rules"
    description: "Declare a zone as inside or outside a school's attendance boundary."
    roles: [DistrictAdmin]
    code: 201
    input: [school_id, zone_code, is_in_boundary]
    output: BoundaryRule
    side_effects:
      - "BoundaryRule row created"

  - method: GET
    path: "/lottery/boundary-rules/{id}"
    description: "Get a single boundary rule by id."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: []
    output: BoundaryRule
    side_effects: []

  - method: GET
    path: "/lottery/boundary-rules"
    description: "List boundary rules; filterable by school_id."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: ["school_id?", "limit?", "offset?"]
    output: BoundaryRule[]
    side_effects: []

  # ----- Enrollment Windows -----
  - method: POST
    path: "/lottery/windows"
    description: "Create a new enrollment window in DRAFT for a district and cycle."
    roles: [DistrictAdmin]
    code: 201
    input: [district_id, cycle_label, opens_at, closes_at, lottery_runs_at]
    output: EnrollmentWindow
    side_effects:
      - "EnrollmentWindow row created with status=DRAFT, version=1"

  - method: GET
    path: "/lottery/windows/{id}"
    description: "Get an enrollment window."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: []
    output: EnrollmentWindow
    side_effects: []

  - method: GET
    path: "/lottery/windows"
    description: "List enrollment windows; filterable by district_id, status."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: ["district_id?", "status?", "limit?", "offset?"]
    output: EnrollmentWindow[]
    side_effects: []

  - method: POST
    path: "/lottery/windows/{id}/open"
    description: "Transition window DRAFT->OPEN."
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: EnrollmentWindow
    side_effects:
      - "EnrollmentWindow.status=OPEN; version increments by 1"

  - method: POST
    path: "/lottery/windows/{id}/close"
    description: "Transition window OPEN->CLOSED (manual close, requires clock past closes_at)."
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: EnrollmentWindow
    side_effects:
      - "EnrollmentWindow.status=CLOSED; cascade DRAFT Applications to WITHDRAWN; version increments by 1"

  - method: POST
    path: "/lottery/windows/{id}/run-lottery"
    description: "Transition window CLOSED->LOTTERY_RUN; runs lottery_weight_total then lottery_seat_assignment."
    roles: [DistrictAdmin]
    code: 200
    input: [expected_window_version]
    output: EnrollmentWindow
    side_effects:
      - "lottery_weight_total calculation runs for every SUBMITTED Application in window"
      - "lottery_seat_assignment partitions Applications into ACCEPTED + WAITLISTED per school"
      - "Offer rows created for every ACCEPTED Application (source=LOTTERY)"
      - "WaitlistEntry rows created for every WAITLISTED Application"
      - "EnrollmentWindow.status=LOTTERY_RUN; version increments by 1"

  - method: POST
    path: "/lottery/windows/{id}/expire-offers"
    description: "Batch sweep: expire any OFFERED Offer whose respond_by is in the past for this window, with cascading waitlist promotions."
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: "{ expired_count: integer, promoted_count: integer }"
    side_effects:
      - "Each expired Offer transitions OFFERED->EXPIRED"
      - "Each linked Application transitions ACCEPTED->DECLINED"
      - "Top ACTIVE WaitlistEntry for the school is promoted; new Offer with source=WAITLIST_PROMOTION created"
      - "EnrollmentWindow.version increments by 1"

  - method: POST
    path: "/lottery/windows/{id}/finalize"
    description: "Transition window LOTTERY_RUN->FINALIZED."
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: EnrollmentWindow
    side_effects:
      - "EnrollmentWindow.status=FINALIZED; all ACTIVE WaitlistEntry rows transition to REMOVED; their WAITLISTED Applications transition to WITHDRAWN; version increments by 1"

  # ----- Families & Students -----
  - method: POST
    path: "/lottery/families/register"
    description: "Register a new family + primary guardian (public; assigns Guardian identity)."
    roles: [Anonymous]
    code: 201
    input: [guardian_email, residence_zone_code, residence_district_id, poverty_flag]
    output: Family
    side_effects:
      - "Family row created; recomputes family_risk_score (provisional)"

  - method: GET
    path: "/lottery/families/{id}"
    description: "Get a family by id."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: []
    output: Family
    side_effects: []

  - method: GET
    path: "/lottery/families"
    description: "List families; filterable by residence_district_id."
    roles: [DistrictAdmin]
    code: 200
    input: ["residence_district_id?", "limit?", "offset?"]
    output: Family[]
    side_effects: []

  - method: GET
    path: "/lottery/families/{id}/risk-preview"
    description: "Provisional family_risk_score (excludes DECLINED apps)."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: []
    output: "{ risk_score: number, variant: string }"
    side_effects: []

  - method: GET
    path: "/lottery/families/{id}/risk-final"
    description: "Final family_risk_score (includes DECLINED apps)."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: []
    output: "{ risk_score: number, variant: string }"
    side_effects: []

  - method: POST
    path: "/lottery/students"
    description: "Register a new student under a Family."
    roles: [DistrictAdmin, Guardian]
    code: 201
    input: [family_id, full_name, grade_for_cycle]
    output: Student
    side_effects:
      - "Student row created"

  - method: GET
    path: "/lottery/students/{id}"
    description: "Get a student."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: GET
    path: "/lottery/students"
    description: "List students; filterable by family_id."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: ["family_id?", "limit?", "offset?"]
    output: Student[]
    side_effects: []

  # ----- Sibling Bonds -----
  - method: POST
    path: "/lottery/sibling-bonds"
    description: "Declare a sibling bond between an applying student and an already-enrolled sibling."
    roles: [DistrictAdmin, Guardian]
    code: 201
    input: [student_id, sibling_student_id, school_id]
    output: SiblingBond
    side_effects:
      - "SiblingBond row created"

  - method: GET
    path: "/lottery/sibling-bonds/{id}"
    description: "Get a single sibling bond by id."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: []
    output: SiblingBond
    side_effects: []

  - method: GET
    path: "/lottery/sibling-bonds"
    description: "List sibling bonds; filterable by student_id, sibling_student_id, school_id."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: ["student_id?", "sibling_student_id?", "school_id?", "limit?", "offset?"]
    output: SiblingBond[]
    side_effects: []

  # ----- Applications -----
  - method: POST
    path: "/lottery/applications"
    description: "Create an Application in DRAFT."
    roles: [Guardian]
    code: 201
    input: [window_id, student_id, school_id, choice_rank]
    output: Application
    side_effects:
      - "Application row created with status=DRAFT, version=1; family_risk_score (provisional) recomputed"

  - method: GET
    path: "/lottery/applications/{id}"
    description: "Get an application."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/lottery/applications"
    description: "List applications; filterable by window_id, student_id, school_id, status."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: ["window_id?", "student_id?", "school_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/lottery/applications/{id}/submit"
    description: "Transition Application DRAFT->SUBMITTED."
    roles: [Guardian]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Application.status=SUBMITTED; family_risk_score (provisional) recomputed; Application.version increments by 1"

  - method: POST
    path: "/lottery/applications/{id}/withdraw"
    description: "Transition Application (DRAFT or SUBMITTED) -> WITHDRAWN."
    roles: [Guardian]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Application.status=WITHDRAWN; family_risk_score recomputed; Application.version increments by 1"

  - method: POST
    path: "/lottery/applications/{id}/reject"
    description: "DistrictAdmin rejects a SUBMITTED application (e.g., fraud, ineligibility)."
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Application.status=REJECTED; Application.version increments by 1"

  - method: GET
    path: "/lottery/applications/{id}/weight-preview"
    description: "Returns provisional lottery_weight_total (variant=provisional)."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: []
    output: "{ lottery_weight: number, variant: string }"
    side_effects: []

  # ----- Offers -----
  - method: GET
    path: "/lottery/offers/{id}"
    description: "Get an offer."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: GET
    path: "/lottery/offers"
    description: "List offers; filterable by application_id, status, source."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: ["application_id?", "status?", "source?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []

  - method: POST
    path: "/lottery/offers/{id}/accept"
    description: "Family accepts an OFFERED offer; Application transitions to ENROLLED."
    roles: [Guardian]
    code: 200
    input: [expected_offer_version]
    output: Offer
    side_effects:
      - "Offer.status=ACCEPTED; linked Application.status=ENROLLED; Application.version, Offer.version increment by 1"

  - method: POST
    path: "/lottery/offers/{id}/decline"
    description: "Family declines an OFFERED offer; triggers waitlist promotion cascade."
    roles: [Guardian]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "Offer.status=DECLINED; linked Application.status=DECLINED; top ACTIVE WaitlistEntry on same school promoted (cascade-2)"

  # ----- Waitlist Entries -----
  - method: GET
    path: "/lottery/waitlist-entries/{id}"
    description: "Get a waitlist entry."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: GET
    path: "/lottery/waitlist-entries"
    description: "List waitlist entries; filterable by school_id, application_id, status."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: ["school_id?", "application_id?", "status?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []

  # ----- Test-driving endpoints (system clock) -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the system clock to a specific UTC instant."
    roles: [DistrictAdmin]
    code: 200
    input: [to_iso8601]
    output: SystemClock
    side_effects:
      - "SystemClock.current_utc = to_iso8601"

  - method: GET
    path: "/_clock/current"
    description: "Read the current system clock."
    roles: [DistrictAdmin, Guardian]
    code: 200
    input: []
    output: SystemClock
    side_effects: []

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted to perform this operation."
  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "Guardian acts on a Student that is not part of their Family."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (by id) does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in valid state for operation per §1.2."
  - id: ERR_WINDOW_TIMING
    http: 422
    condition: "Window timing constraints violated (opens_at < closes_at <= lottery_runs_at) or clock not past gate."
  - id: ERR_DISTRICT_ARCHIVED
    http: 422
    condition: "Operation references an ARCHIVED district."
  - id: ERR_DUPLICATE_CHOICE
    http: 409
    condition: "Student has another application with the same (student_id, window_id) and choice_rank, or has reached 5 applications in the window."
  - id: ERR_GRADE_OUT_OF_RANGE
    http: 422
    condition: "Student.grade_for_cycle outside [school.grade_min, school.grade_max]."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC version mismatch on a parent entity."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Generic schema/type/range validation failure on request body."
  - id: ERR_DISTRICT_DATA_INVALID
    http: 422
    condition: "District poverty_index_pct out of [0,100] range."
  - id: ERR_ZONE_UNKNOWN
    http: 422
    condition: "Family.residence_zone_code not covered by any BoundaryRule and required by operation."

# =============================================================================
# §1.7 RBAC
# =============================================================================
roles:
  - name: DistrictAdmin
    description: "District-level administrator: configures districts, schools, boundaries, windows; runs lottery."
    identity: "opaque"
    exclusive_operations:
      - "POST /lottery/districts"
      - "PATCH /lottery/districts/{id}"
      - "POST /lottery/schools"
      - "PATCH /lottery/schools/{id}"
      - "POST /lottery/boundary-rules"
      - "POST /lottery/windows"
      - "POST /lottery/windows/{id}/open"
      - "POST /lottery/windows/{id}/close"
      - "POST /lottery/windows/{id}/run-lottery"
      - "POST /lottery/windows/{id}/expire-offers"
      - "POST /lottery/windows/{id}/finalize"
      - "POST /lottery/applications/{id}/reject"
      - "POST /_clock/set_current_utc"
      - "GET /lottery/families"
    shared_operations:
      - "GET /lottery/districts/{id}"
      - "GET /lottery/districts"
      - "GET /lottery/schools/{id}"
      - "GET /lottery/schools"
      - "GET /lottery/schools/{id}/acceptance-rate"
      - "GET /lottery/boundary-rules/{id}"
      - "GET /lottery/boundary-rules"
      - "GET /lottery/windows/{id}"
      - "GET /lottery/windows"
      - "GET /lottery/families/{id}"
      - "GET /lottery/families/{id}/risk-preview"
      - "GET /lottery/families/{id}/risk-final"
      - "POST /lottery/students"
      - "GET /lottery/students/{id}"
      - "GET /lottery/students"
      - "POST /lottery/sibling-bonds"
      - "GET /lottery/sibling-bonds/{id}"
      - "GET /lottery/sibling-bonds"
      - "GET /lottery/applications/{id}"
      - "GET /lottery/applications"
      - "GET /lottery/applications/{id}/weight-preview"
      - "GET /lottery/offers/{id}"
      - "GET /lottery/offers"
      - "GET /lottery/waitlist-entries/{id}"
      - "GET /lottery/waitlist-entries"
      - "GET /_clock/current"

  - name: Guardian
    description: "Family guardian. X-User-ID equals a Family.id; can only act on their own family's students/applications/offers."
    identity: "entity_backed:Family"
    exclusive_operations:
      - "POST /lottery/applications"
      - "POST /lottery/applications/{id}/submit"
      - "POST /lottery/applications/{id}/withdraw"
      - "POST /lottery/offers/{id}/accept"
      - "POST /lottery/offers/{id}/decline"
    shared_operations:
      - "GET /lottery/districts/{id}"
      - "GET /lottery/districts"
      - "GET /lottery/schools/{id}"
      - "GET /lottery/schools"
      - "GET /lottery/schools/{id}/acceptance-rate"
      - "GET /lottery/boundary-rules/{id}"
      - "GET /lottery/boundary-rules"
      - "GET /lottery/windows/{id}"
      - "GET /lottery/windows"
      - "GET /lottery/families/{id}"
      - "GET /lottery/families/{id}/risk-preview"
      - "GET /lottery/families/{id}/risk-final"
      - "POST /lottery/students"
      - "GET /lottery/students/{id}"
      - "GET /lottery/students"
      - "POST /lottery/sibling-bonds"
      - "GET /lottery/sibling-bonds/{id}"
      - "GET /lottery/sibling-bonds"
      - "GET /lottery/applications/{id}"
      - "GET /lottery/applications"
      - "GET /lottery/applications/{id}/weight-preview"
      - "GET /lottery/offers/{id}"
      - "GET /lottery/offers"
      - "GET /lottery/waitlist-entries/{id}"
      - "GET /lottery/waitlist-entries"
      - "GET /_clock/current"

  - name: Anonymous
    description: "Unauthenticated public role. Used only to register a new Family. No X-User-ID required."
    identity: "opaque"
    exclusive_operations:
      - "POST /lottery/families/register"
    shared_operations: []
