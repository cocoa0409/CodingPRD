# =============================================================================
# Task 1383 — Peanut Buying Point & Shelling (Georgia peanut buying point)
# Scaffold seed tables (§1.0–§1.7). Difficulty design lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "Peanut Buying Point & Shelling (Georgia peanut buying point): farmer stock inspection & grade sheet, moisture/foreign-material discount schedule, warehouse storage & loan collateral, sheller contract & delivery call, aflatoxin testing & segregation, grower settlement & quota history, drying capacity scheduling, byproduct hull disposition"

domain_name: peanut-buying-point-shelling
api_prefix: /buying-points

# =============================================================================
# Complexity Profile (§0.1–§0.4) — calibrated above Expert band per requester
# directive: maximal rule interaction density, cascade depth, OCC coverage.
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology under /buying-points)
# =============================================================================
entities:
  - name: BuyingPoint
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Buying point display name" }
      - { name: crop_year, type: integer, source: input, description: "Operating crop year (e.g. 2026); loads/quota histories must match" }
      - { name: drying_rate_per_cycle_cents, type: integer, source: input, description: "Base drying charge per dryer cycle, before moisture multiplier" }
      - { name: quota_price_cents_per_ton, type: integer, source: input, description: "Base price per payable ton for quota-tier peanuts" }
      - { name: additional_price_cents_per_ton, type: integer, source: input, description: "Base price per payable ton for additional (over-quota) peanuts" }
      - { name: loan_rate_quota_cents_per_ton, type: integer, source: input, description: "Marketing-loan rate per pledged ton, quota tier" }
      - { name: loan_rate_additional_cents_per_ton, type: integer, source: input, description: "Marketing-loan rate per pledged ton, additional tier" }
      - { name: intake_posture, type: enum, source: computed, description: "OPEN | RESTRICTED | SUSPENDED — derived from aggregate warehouse free tons (calculations.buying_point_posture)" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by run_ops" }

  - name: Grower
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Grower legal name" }
      - { name: farm_number, type: string, source: input, description: "FSA farm number; unique across the buying point", constraints: "unique" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED when no_show_strikes reaches STRIKE_LIMIT" }
      - { name: no_show_strikes, type: integer, source: system, default: 0, description: "Count of dryer-booking no-shows; contagion input to status" }

  - name: DiscountSchedule
    parent: null
    common_fields: true
    fields:
      - { name: schedule_code, type: string, source: input, description: "Human label, e.g. FALL-2026" }
      - { name: effective_from, type: datetime, source: input, description: "Window start (inclusive), half-open [effective_from, effective_to)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end (exclusive)" }
      - { name: moisture_tiers, type: array, source: input, description: "Ordered tiers [{up_to_pct: number|null, discount_cents_per_ton: integer}]; first tier with moisture_pct <= up_to_pct wins; null up_to_pct = unbounded final tier" }
      - { name: foreign_material_tiers, type: array, source: input, description: "Ordered tiers, same shape as moisture_tiers, selected on foreign_material_pct" }
      - { name: damage_rate_cents_per_pct, type: integer, source: input, description: "Flat cents-per-ton discount per 1.0 pct of damage" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | RETIRED; at most one ACTIVE schedule may cover any instant (overlap rejected at activation)" }

  - name: FarmerStockLoad
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; delivering grower (Grower role must match X-User-ID)" }
      - { name: crop_year, type: integer, source: input, description: "Crop year of the load; must equal an existing BuyingPoint.crop_year context for settlement grouping" }
      - { name: gross_tons, type: number, source: input, description: "Scale weight recorded by POST .../weigh; null until WEIGHED", constraints: "> 0, 3 decimal places max" }
      - { name: weighed_at, type: datetime, source: system, description: "Logical clock timestamp at weigh; used for DiscountSchedule selection" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED | WEIGHED | GRADED | STORED | DEPLETED | REJECTED — primary flow axis" }
      - { name: aflatoxin_status, type: enum, source: system, default: UNTESTED, description: "UNTESTED | SAMPLED | PASSED | SEGREGATED | REJECTED — parallel axis driven by AflatoxinCertificate" }
      - { name: drying_status, type: enum, source: system, default: NOT_REQUIRED, description: "NOT_REQUIRED | REQUIRED | BOOKED | DRIED — parallel axis set at grade finalize (moisture > 10.49 => REQUIRED)" }
      - { name: payable_tons, type: number, source: computed, description: "gross_tons minus rounded FM and LSK tonnage deductions (calculations.payable_tons); null until a grade sheet finalizes" }
      - { name: provisional_net_estimate_cents, type: integer, source: computed, description: "Forward-looking estimate at grade finalize (calculations.provisional_net_estimate); null until GRADED" }
      - { name: settlement_id, type: string, source: system, description: "FK -> Settlement.id; set when included in a settlement that reaches APPROVED; null otherwise" }

  - name: GradeSheet
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> FarmerStockLoad.id (from path)" }
      - { name: inspector_ref, type: string, source: system, description: "X-User-ID of the creating GradingInspector (opaque)" }
      - { name: schedule_id, type: string, source: system, description: "FK -> DiscountSchedule.id; pinned at finalize to the ACTIVE schedule whose half-open window covers load.weighed_at" }
      - { name: moisture_pct, type: number, source: input, description: "Moisture percent, 2 decimals", constraints: "0 <= x <= 100" }
      - { name: foreign_material_pct, type: number, source: input, description: "Foreign material percent, 2 decimals", constraints: "0 <= x <= 100" }
      - { name: damage_pct, type: number, source: input, description: "Damaged kernel percent, 2 decimals", constraints: "0 <= x <= 100" }
      - { name: lsk_pct, type: number, source: input, description: "Loose shelled kernel percent of gross weight, 2 decimals", constraints: "0 <= x <= 100" }
      - { name: payable_tons, type: number, source: computed, description: "Computed at finalize (calculations.payable_tons); null while DRAFT" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FINALIZED | SUPERSEDED; SUPERSEDED when a newer sheet on the same load finalizes" }

  - name: AflatoxinCertificate
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> FarmerStockLoad.id (from path); at most one certificate per load, ever" }
      - { name: sample_ref, type: string, source: input, description: "Lab sample reference label" }
      - { name: lab_tech_ref, type: string, source: system, description: "X-User-ID of the creating LabTechnician (opaque)" }
      - { name: result_ppb, type: number, source: input, description: "Aflatoxin result in parts per billion, 2 decimals; set by record-result" }
      - { name: result_recorded_by, type: string, source: system, description: "X-User-ID that recorded the current result (opaque)" }
      - { name: confirmed_by, type: string, source: system, description: "X-User-ID that confirmed; must differ from result_recorded_by (segregation of duties)" }
      - { name: determination, type: enum, source: computed, description: "PASS | SEGREGATE | REJECT per aflatoxin thresholds; recomputed on every record-result" }
      - { name: retest_count, type: integer, source: system, default: 0, description: "Number of retest cycles taken; hard cap RETEST_MAX = 2" }
      - { name: status, type: enum, source: system, default: SAMPLED, description: "SAMPLED | RESULT_RECORDED | CONFIRMED; cyclic: RESULT_RECORDED -> SAMPLED via order-retest" }

  - name: Dryer
    parent: null
    common_fields: true
    fields:
      - { name: buying_point_id, type: string, source: input, description: "FK -> BuyingPoint.id" }
      - { name: name, type: string, source: input, description: "Dryer label" }
      - { name: cycle_capacity_tons, type: integer, source: input, description: "Tons dried per cycle", constraints: "> 0" }
      - { name: cycle_hours, type: integer, source: input, description: "Hours per cycle", constraints: "> 0" }

  - name: DryerBooking
    parent: null
    common_fields: true
    fields:
      - { name: dryer_id, type: string, source: input, description: "FK -> Dryer.id" }
      - { name: load_id, type: string, source: input, description: "FK -> FarmerStockLoad.id; load must have drying_status REQUIRED" }
      - { name: tons, type: number, source: input, description: "Tons to dry; must equal the load's gross_tons", constraints: "> 0" }
      - { name: starts_at, type: datetime, source: input, description: "Booking window start (half-open interval start)" }
      - { name: ends_at, type: datetime, source: computed, description: "= starts_at + ceil(tons / dryer.cycle_capacity_tons) * dryer.cycle_hours hours; half-open interval end" }
      - { name: moisture_at_booking, type: number, source: system, description: "Snapshot of the load's finalized grade sheet moisture_pct at booking creation; input to calculations.drying_charge" }
      - { name: actual_moisture_after, type: number, source: input, description: "Moisture measured after drying; set by complete" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED | COMPLETED | NO_SHOW | CANCELLED" }

  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - { name: buying_point_id, type: string, source: input, description: "FK -> BuyingPoint.id" }
      - { name: name, type: string, source: input, description: "Warehouse label" }
      - { name: compartment, type: enum, source: input, description: "GENERAL | SEGREGATED; SEGREGATED warehouses hold only aflatoxin-segregated stock" }
      - { name: capacity_tons, type: integer, source: input, description: "Total capacity", constraints: "> 0" }
      - { name: stored_tons, type: number, source: computed, description: "Sum of tons_remaining over receipts with status IN {OPEN, PLEDGED}" }
      - { name: reserved_tons, type: number, source: computed, description: "Sum of (allocated_tons - shipped_tons) over AllocationLines on OPEN receipts of this warehouse whose delivery call is ALLOCATED" }
      - { name: free_tons, type: number, source: computed, description: "= capacity_tons - stored_tons - reserved_tons" }

  - name: StorageReceipt
    parent: null
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id" }
      - { name: load_id, type: string, source: input, description: "FK -> FarmerStockLoad.id; at most one receipt per load" }
      - { name: segregated, type: boolean, source: system, description: "Snapshot: true iff load.aflatoxin_status == SEGREGATED at store time" }
      - { name: tons_initial, type: number, source: system, description: "= load.gross_tons at store time" }
      - { name: tons_remaining, type: number, source: computed, description: "tons_initial minus shipped tonnage minus forfeitures" }
      - { name: shelled_tons, type: number, source: computed, default: 0, description: "Sum of shelled kernel tons attributed via reconciled AllocationLines" }
      - { name: stored_at, type: datetime, source: system, description: "Logical clock at store; FIFO selector primary key" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | PLEDGED | CLOSED | FORFEITED | CANCELLED; CLOSED automatic when tons_remaining reaches 0" }

  - name: LoanPledge
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; must equal the receipt's load's grower" }
      - { name: storage_receipt_id, type: string, source: input, description: "FK -> StorageReceipt.id; receipt must be OPEN" }
      - { name: pledged_tons, type: number, source: input, description: "Tons pledged as loan collateral; full-receipt pledge rule: must EQUAL receipt.tons_remaining", constraints: "> 0; == receipt.tons_remaining (smaller => ERR_INVALID_REQUEST; larger => ERR_LOAN_UNDER_COLLATERALIZED)" }
      - { name: quota_part_tons, type: number, source: computed, description: "= min(pledged_tons, loan_quota_remaining) at pledge time (calculations.loan_principal)" }
      - { name: additional_part_tons, type: number, source: computed, description: "= pledged_tons - quota_part_tons" }
      - { name: principal_cents, type: integer, source: computed, description: "Tier-split principal (calculations.loan_principal)" }
      - { name: outstanding_principal_cents, type: integer, source: computed, description: "principal_cents minus principal portion of repayments (interest-first waterfall)" }
      - { name: accrued_interest_cents, type: integer, source: computed, description: "Interest accrued on outstanding_principal_cents from pledged_at to current logical clock at LOAN_DAILY_INTEREST_BP per day, minus interest portion of repayments" }
      - { name: pledged_at, type: datetime, source: system, description: "Logical clock at pledge" }
      - { name: maturity_date, type: datetime, source: input, description: "Loan maturity; foreclosure allowed only when current clock > maturity_date" }
      - { name: collateral_value_standard_cents, type: integer, source: computed, description: "Tier-split market value (calculations.collateral_coverage, standard variant)" }
      - { name: collateral_value_conservative_cents, type: integer, source: computed, description: "All-tons-at-additional-price value (conservative variant)" }
      - { name: margin_status, type: enum, source: computed, description: "MARGIN_OK | MARGIN_CALL — conservative value vs outstanding * MARGIN_FACTOR" }
      - { name: foreclosure_credit_cents, type: integer, source: computed, description: "max(0, standard value - outstanding) recorded at foreclosure; null until FORECLOSED" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REPAID | FORECLOSED" }

  - name: ShellerContract
    parent: null
    common_fields: true
    fields:
      - { name: buying_point_id, type: string, source: input, description: "FK -> BuyingPoint.id" }
      - { name: sheller_ref, type: string, source: input, description: "Opaque sheller identity; ShellerRep ownership anchor (X-User-ID must equal this)" }
      - { name: total_units_tons, type: number, source: input, description: "Contracted tonnage", constraints: "> 0" }
      - { name: fulfilled_units_tons, type: number, source: computed, default: 0, description: "Sum of delivered_tons over DELIVERED/RECONCILED delivery calls" }
      - { name: remaining_units_tons, type: number, source: computed, description: "= total_units_tons - fulfilled_units_tons - sum(requested_tons of ISSUED/ALLOCATED calls)" }
      - { name: price_per_ton_cents, type: integer, source: input, description: "Sheller's purchase price per delivered ton" }
      - { name: accepts_segregated, type: boolean, source: input, description: "Whether segregated (aflatoxin) receipts are eligible for allocation" }
      - { name: window_start, type: datetime, source: input, description: "Contract window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Contract window end (inclusive); all dock windows must fit inside" }
      - { name: default_count, type: integer, source: system, default: 0, description: "Number of DEFAULTED delivery calls; contract DEFAULTED when default_count >= CONTRACT_DEFAULT_LIMIT (2)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | FULFILLED | DEFAULTED | CANCELLED" }

  - name: DeliveryCall
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> ShellerContract.id" }
      - { name: requested_tons, type: number, source: input, description: "Tonnage called for delivery", constraints: "> 0" }
      - { name: dock_window_start, type: datetime, source: input, description: "Dock arrival window start; closed interval semantics with TURNAROUND_BUFFER_MIN buffer" }
      - { name: dock_window_end, type: datetime, source: input, description: "Dock arrival window end (inclusive)" }
      - { name: allocated_tons, type: number, source: computed, default: 0, description: "Sum of AllocationLine.allocated_tons" }
      - { name: delivered_tons, type: number, source: computed, default: 0, description: "Sum of AllocationLine.shipped_tons" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | ALLOCATED | DELIVERED | RECONCILED | CANCELLED | DEFAULTED" }

  - name: AllocationLine
    parent: null
    common_fields: false
    fields:
      - { name: delivery_call_id, type: string, source: system, description: "FK -> DeliveryCall.id" }
      - { name: storage_receipt_id, type: string, source: system, description: "FK -> StorageReceipt.id" }
      - { name: allocated_tons, type: number, source: system, description: "Tons reserved by the FIFO allocation selector" }
      - { name: shipped_tons, type: number, source: system, default: 0, description: "Tons actually shipped (set at deliver)" }
      - { name: shelled_tons, type: number, source: system, default: 0, description: "Shelled kernel tons attributed at reconcile (pro-rata by shipped_tons)" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: system, description: "FK -> Grower.id (from path)" }
      - { name: crop_year, type: integer, source: input, description: "Crop year being settled" }
      - { name: supersedes_settlement_id, type: string, source: system, description: "FK -> Settlement.id; the settlement this one replaces (self-referential), null for the first" }
      - { name: included_load_ids, type: array, source: system, description: "Load ids captured at compute: grower's loads with status IN {STORED, DEPLETED} and settlement_id IS NULL" }
      - { name: offset_pledge_ids, type: array, source: system, description: "LoanPledge ids whose offset was deducted (ACTIVE pledges of the grower at compute time)" }
      - { name: quota_tons_applied, type: number, source: computed, description: "Payable tons priced at quota tier after straddle split (calculations.load_net_value)" }
      - { name: additional_tons_applied, type: number, source: computed, description: "Payable tons priced at additional tier" }
      - { name: gross_value_cents, type: integer, source: computed, description: "Sum of per-load gross values" }
      - { name: discount_cents, type: integer, source: computed, description: "Sum of per-load discount lines (per-line rounded then summed)" }
      - { name: drying_cents, type: integer, source: computed, description: "Sum of calculations.drying_charge over COMPLETED bookings of included loads" }
      - { name: loan_offset_cents, type: integer, source: computed, description: "Sum of outstanding principal + accrued interest (to compute date) over ACTIVE pledges (calculations.loan_offset_with_interest)" }
      - { name: hull_credit_cents, type: integer, source: computed, description: "Grower's share of the sold-hull revenue pool (calculations.hull_credit_allocation)" }
      - { name: net_payment_cents, type: integer, source: computed, description: "= gross_value_cents - discount_cents - drying_cents - loan_offset_cents + hull_credit_cents" }
      - { name: computed_by, type: string, source: system, description: "X-User-ID of the computing SettlementClerk (opaque)" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of approver; must differ from computed_by" }
      - { name: paid_by, type: string, source: system, description: "X-User-ID of payer; must differ from approved_by" }
      - { name: status, type: enum, source: system, default: COMPUTED, description: "COMPUTED | APPROVED | PAID | DISPUTED | STALE | SUPERSEDED | VOIDED" }

  - name: QuotaHistory
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id" }
      - { name: crop_year, type: integer, source: input, description: "Crop year of the quota record" }
      - { name: quota_tons, type: number, source: input, description: "Annual poundage quota in tons", constraints: ">= 0" }
      - { name: used_quota_tons, type: number, source: computed, default: 0, description: "Sum of quota_tons_applied over this grower+crop_year settlements in status IN {APPROVED, PAID}; released on VOID" }
      # uniqueness: at most one QuotaHistory per (grower_id, crop_year)

  - name: HullLot
    parent: null
    common_fields: true
    fields:
      - { name: delivery_call_id, type: string, source: system, description: "FK -> DeliveryCall.id; created by reconcile" }
      - { name: tons, type: number, source: system, description: "Hull tonnage reported at reconcile" }
      - { name: sale_price_cents_per_ton, type: integer, source: input, description: "Listing price; set by list-for-sale" }
      - { name: revenue_cents, type: integer, source: computed, description: "= round_half_up(tons * sale_price_cents_per_ton); set at sell" }
      - { name: sold_at, type: datetime, source: system, description: "Logical clock at sell; pool membership requires sold_at <= settlement compute date" }
      - { name: disposition_ref, type: string, source: input, description: "Disposal manifest reference; set by dispose" }
      - { name: status, type: enum, source: system, default: GENERATED, description: "GENERATED | LISTED | SOLD | DISPOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BuyingPoint
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system (recompute when aggregate free tons falls to <= RESTRICTED_FREE_TONS and > 0)"
        actor: system
        preconditions: []
        side_effects: ["Load creation capped at RESTRICTED_MAX_LOAD_TONS gross tons while RESTRICTED"]
      - from: RESTRICTED
        to: OPEN
        trigger: "system (recompute when aggregate free tons rises above RESTRICTED_FREE_TONS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: SUSPENDED
        trigger: "system (recompute when aggregate free tons falls to <= 0)"
        actor: system
        preconditions: []
        side_effects: ["All load creation rejected with ERR_INTAKE_SUSPENDED"]
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "system (recompute when aggregate free tons falls to <= 0)"
        actor: system
        preconditions: []
        side_effects: ["All load creation rejected with ERR_INTAKE_SUSPENDED"]
      - from: SUSPENDED
        to: RESTRICTED
        trigger: "system (recompute when aggregate free tons rises above 0 but stays <= RESTRICTED_FREE_TONS, e.g. after delivery frees stock)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: OPEN
        trigger: "system (recompute when aggregate free tons rises above RESTRICTED_FREE_TONS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ANY
        to: ANY
        trigger: "POST /buying-points/{id}/run_ops (ops_run_index += 1; sweeps bookings and delivery calls — see DryerBooking/DeliveryCall/ShellerContract machines)"
        actor: BuyingPointAdmin
        preconditions: []
        side_effects: ["ops_run_index += 1", "run calculations.ops_run_sweep"]

  - entity: Grower
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (no_show_strikes reaches STRIKE_LIMIT via DryerBooking NO_SHOW cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "All of the grower's DryerBookings in BOOKED -> CANCELLED (their loads return to drying_status REQUIRED)"
          - "New load creation rejected with ERR_GROWER_SUSPENDED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /buying-points/growers/{id}/suspend (administrative suspension)"
        actor: BuyingPointAdmin
        preconditions: []
        side_effects:
          - "All of the grower's DryerBookings in BOOKED -> CANCELLED (their loads return to drying_status REQUIRED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /buying-points/growers/{id}/reinstate"
        actor: BuyingPointAdmin
        preconditions: []
        side_effects: ["no_show_strikes reset to 0"]

  - entity: DiscountSchedule
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /buying-points/discount-schedules/{id}/activate"
        actor: BuyingPointAdmin
        preconditions:
          - "No other ACTIVE schedule's [effective_from, effective_to) half-open window overlaps this one (ERR_SCHEDULE_WINDOW_OVERLAP)"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /buying-points/discount-schedules/{id}/retire"
        actor: BuyingPointAdmin
        preconditions: []
        side_effects: ["GradeSheet finalization after retire fails with ERR_NO_ACTIVE_SCHEDULE when no other ACTIVE schedule covers load.weighed_at; already-FINALIZED sheets keep their pinned schedule_id (version-pinning)"]

  - entity: FarmerStockLoad
    initial_state: REPORTED
    terminal_states: [REJECTED, DEPLETED]
    transitions:
      - from: REPORTED
        to: WEIGHED
        trigger: "POST /buying-points/loads/{id}/weigh"
        actor: BuyingPointAdmin
        preconditions: []
        side_effects: ["gross_tons and weighed_at (logical clock) recorded", "increments FarmerStockLoad.version by 1"]
      - from: WEIGHED
        to: GRADED
        trigger: "POST /buying-points/grade-sheets/{id}/finalize (moisture_pct <= MOISTURE_REJECT_PCT)"
        actor: GradingInspector
        preconditions:
          - "An ACTIVE DiscountSchedule covers load.weighed_at (ERR_NO_ACTIVE_SCHEDULE)"
        side_effects:
          - "GradeSheet -> FINALIZED; payable_tons computed; schedule_id pinned"
          - "drying_status := REQUIRED if moisture_pct > MOISTURE_DRYING_REQUIRED_PCT else NOT_REQUIRED"
          - "provisional_net_estimate_cents computed (calculations.provisional_net_estimate)"
          - "increments FarmerStockLoad.version by 1"
      - from: GRADED
        to: GRADED
        trigger: "POST /buying-points/grade-sheets/{id}/finalize on a newer DRAFT sheet (re-grade)"
        actor: GradingInspector
        preconditions:
          - "load.settlement_id IS NULL (ERR_LOAD_LOCKED_BY_SETTLEMENT)"
          - "An ACTIVE DiscountSchedule covers load.weighed_at (ERR_NO_ACTIVE_SCHEDULE)"
        side_effects:
          - "Prior FINALIZED GradeSheet -> SUPERSEDED; new sheet FINALIZED"
          - "payable_tons, drying_status, provisional_net_estimate_cents recomputed"
          - "Every Settlement in {COMPUTED, DISPUTED} whose included_load_ids contains this load -> STALE"
          - "increments FarmerStockLoad.version by 1"
      - from: STORED
        to: STORED
        trigger: "POST /buying-points/grade-sheets/{id}/finalize on a newer DRAFT sheet (re-grade of stored stock)"
        actor: GradingInspector
        preconditions:
          - "load.settlement_id IS NULL (ERR_LOAD_LOCKED_BY_SETTLEMENT)"
        side_effects:
          - "Prior FINALIZED GradeSheet -> SUPERSEDED; new sheet FINALIZED; payable_tons recomputed"
          - "Every Settlement in {COMPUTED, DISPUTED} containing this load -> STALE"
          - "increments FarmerStockLoad.version by 1"
      - from: WEIGHED
        to: REJECTED
        trigger: "POST /buying-points/grade-sheets/{id}/finalize with moisture_pct > MOISTURE_REJECT_PCT"
        actor: GradingInspector
        preconditions: []
        side_effects: ["GradeSheet FINALIZED (grade of record kept)", "load terminally REJECTED", "increments FarmerStockLoad.version by 1"]
      - from: GRADED
        to: REJECTED
        trigger: "system (AflatoxinCertificate confirmed with determination REJECT)"
        actor: system
        preconditions: []
        side_effects: ["load terminally REJECTED; may not be stored"]
      - from: GRADED
        to: STORED
        trigger: "POST /buying-points/storage-receipts"
        actor: BuyingPointAdmin
        preconditions:
          - "drying_status IN {NOT_REQUIRED, DRIED} (ERR_DRYING_REQUIRED)"
          - "aflatoxin_status IN {PASSED, SEGREGATED} (ERR_AFLATOXIN_NOT_CLEARED)"
          - "warehouse.compartment matches aflatoxin status: SEGREGATED load requires SEGREGATED compartment, PASSED load requires GENERAL (ERR_COMPARTMENT_SEGREGATION)"
          - "warehouse.free_tons >= load.gross_tons (ERR_WAREHOUSE_CAPACITY)"
        side_effects:
          - "StorageReceipt created OPEN with tons_initial = gross_tons, segregated snapshot, stored_at = clock"
          - "Warehouse.stored_tons += gross_tons; BuyingPoint.intake_posture recomputed"
          - "increments FarmerStockLoad.version by 1"
      - from: STORED
        to: DEPLETED
        trigger: "system (its StorageReceipt reaches tons_remaining == 0 via delivery shipments — auto-transition)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: GradeSheet
    initial_state: DRAFT
    terminal_states: [FINALIZED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /buying-points/grade-sheets/{id}/finalize"
        actor: GradingInspector
        preconditions: ["See FarmerStockLoad finalize preconditions (schedule coverage, settlement lock)"]
        side_effects: ["See FarmerStockLoad finalize side effects (supersede, recompute, STALE cascade)"]
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (a newer DRAFT sheet on the same load finalizes)"
        actor: system
        preconditions: []
        side_effects: ["Sheet becomes read-only historical record; pinned schedule_id retained"]

  - entity: AflatoxinCertificate
    initial_state: SAMPLED
    terminal_states: [CONFIRMED]
    transitions:
      - from: SAMPLED
        to: RESULT_RECORDED
        trigger: "POST /buying-points/aflatoxin-certificates/{id}/record-result"
        actor: LabTechnician
        preconditions: []
        side_effects:
          - "result_ppb stored; result_recorded_by := X-User-ID"
          - "determination recomputed (calculations.aflatoxin_determination)"
      - from: RESULT_RECORDED
        to: SAMPLED
        trigger: "POST /buying-points/aflatoxin-certificates/{id}/order-retest"
        actor: LabTechnician
        preconditions: ["retest_count < RETEST_MAX (2) (ERR_RETEST_LIMIT_EXCEEDED)"]
        side_effects: ["retest_count += 1", "result_ppb and determination retained as prior result until a new record-result overwrites them"]
        note: "Cyclic machine: SAMPLED -> RESULT_RECORDED -> SAMPLED, bounded by retest_count"
      - from: RESULT_RECORDED
        to: CONFIRMED
        trigger: "POST /buying-points/aflatoxin-certificates/{id}/confirm"
        actor: LabTechnician
        preconditions: ["X-User-ID != result_recorded_by (ERR_SEG_OF_DUTIES)"]
        side_effects:
          - "confirmed_by := X-User-ID"
          - "load.aflatoxin_status := PASSED if determination PASS, SEGREGATED if SEGREGATE, REJECTED if REJECT"
          - "determination REJECT and load.status IN {WEIGHED, GRADED}: load.status -> REJECTED"
          - "increments FarmerStockLoad.version by 1"

  - entity: DryerBooking
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /buying-points/dryer-bookings/{id}/complete"
        actor: BuyingPointAdmin
        preconditions: []
        side_effects:
          - "actual_moisture_after recorded"
          - "load.drying_status := DRIED if actual_moisture_after <= MOISTURE_DRYING_REQUIRED_PCT else REQUIRED (must re-book)"
          - "increments FarmerStockLoad.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /buying-points/dryer-bookings/{id}/cancel"
        actor: BuyingPointAdmin
        preconditions: []
        side_effects: ["load.drying_status := REQUIRED (unless grower suspension cascade already cancelled)"]
      - from: BOOKED
        to: NO_SHOW
        trigger: "system (run_ops sweep: ends_at < current logical clock and still BOOKED)"
        actor: system
        preconditions: []
        side_effects:
          - "load.drying_status := REQUIRED"
          - "grower.no_show_strikes += 1"
          - "strikes reaching STRIKE_LIMIT (2): Grower -> SUSPENDED, which cancels the grower's remaining BOOKED bookings (their loads -> REQUIRED)"

  - entity: StorageReceipt
    initial_state: OPEN
    terminal_states: [CLOSED, FORFEITED, CANCELLED]
    transitions:
      - from: OPEN
        to: PLEDGED
        trigger: "POST /buying-points/loan-pledges"
        actor: "Grower (own) or BuyingPointAdmin"
        preconditions:
          - "receipt.status == OPEN (ERR_INVALID_STATE)"
          - "receipt's load belongs to grower_id (ERR_INVALID_REQUEST)"
          - "pledged_tons <= receipt.tons_remaining (ERR_LOAN_UNDER_COLLATERALIZED)"
          - "pledged_tons == receipt.tons_remaining — full-receipt pledge rule (ERR_INVALID_REQUEST when smaller)"
        side_effects: ["LoanPledge created ACTIVE; principal computed with quota split", "increments StorageReceipt.version by 1"]
      - from: PLEDGED
        to: OPEN
        trigger: "POST /buying-points/loan-pledges/{id}/repay in full, or settlement payoff at pay"
        actor: "Grower (own), BuyingPointAdmin, or system (settlement payoff)"
        preconditions: []
        side_effects: ["LoanPledge -> REPAID", "increments StorageReceipt.version by 1"]
      - from: PLEDGED
        to: FORFEITED
        trigger: "POST /buying-points/loan-pledges/{id}/foreclose"
        actor: BuyingPointAdmin
        preconditions:
          - "current logical clock > maturity_date (ERR_FORECLOSE_NOT_MATURED)"
          - "outstanding_principal_cents + accrued_interest_cents > 0 (ERR_INVALID_STATE)"
        side_effects:
          - "LoanPledge -> FORECLOSED; foreclosure_credit_cents recorded (standard variant)"
          - "Warehouse.stored_tons -= tons_remaining; tons_remaining := 0; BuyingPoint.intake_posture recomputed"
      - from: OPEN
        to: CLOSED
        trigger: "system (tons_remaining reaches 0 via delivery shipment)"
        actor: system
        preconditions: []
        side_effects: ["load.status -> DEPLETED"]
      - from: OPEN
        to: CANCELLED
        trigger: "system (re-grade finalize rejects the load — moisture above reject threshold)"
        actor: system
        preconditions: []
        side_effects:
          - "Warehouse.stored_tons -= tons_remaining; tons_remaining := 0"
          - "AllocationLines referencing this receipt are deleted; their DeliveryCalls recompute allocated_tons and revert ALLOCATED -> ISSUED when allocated_tons < requested_tons; reservations released"
          - "BuyingPoint.intake_posture recomputed"

  - entity: LoanPledge
    initial_state: ACTIVE
    terminal_states: [REPAID, FORECLOSED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /buying-points/loan-pledges/{id}/repay (partial)"
        actor: "Grower (own) or BuyingPointAdmin"
        preconditions: ["0 < amount_cents <= outstanding + accrued (ERR_INVALID_REQUEST)"]
        side_effects: ["Payment applied interest-first, then principal (calculations.loan_offset_with_interest waterfall)"]
      - from: ACTIVE
        to: REPAID
        trigger: "POST /buying-points/loan-pledges/{id}/repay covering outstanding + accrued, or Settlement pay payoff"
        actor: "Grower (own), BuyingPointAdmin, or system (settlement payoff)"
        preconditions: []
        side_effects: ["StorageReceipt -> OPEN", "outstanding_principal_cents := 0, accrued_interest_cents := 0"]
      - from: ACTIVE
        to: FORECLOSED
        trigger: "POST /buying-points/loan-pledges/{id}/foreclose"
        actor: BuyingPointAdmin
        preconditions: ["current logical clock > maturity_date (ERR_FORECLOSE_NOT_MATURED)", "outstanding + accrued > 0 (ERR_INVALID_STATE)"]
        side_effects: ["See StorageReceipt FORFEITED side effects"]

  - entity: ShellerContract
    initial_state: DRAFT
    terminal_states: [FULFILLED, DEFAULTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /buying-points/sheller-contracts/{id}/activate"
        actor: BuyingPointAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: FULFILLED
        trigger: "system (fulfilled_units_tons >= total_units_tons after a delivery posts — boundary: equality counts)"
        actor: system
        preconditions: []
        side_effects: ["No further delivery calls may be created"]
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system (run_ops: default_count reaches CONTRACT_DEFAULT_LIMIT (2))"
        actor: system
        preconditions: []
        side_effects:
          - "All remaining ISSUED/ALLOCATED delivery calls -> CANCELLED; their warehouse reservations released; BuyingPoint.intake_posture recomputed"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /buying-points/sheller-contracts/{id}/cancel"
        actor: BuyingPointAdmin
        preconditions: ["No delivery calls in {ISSUED, ALLOCATED} (ERR_CONTRACT_HAS_OPEN_CALLS)"]
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /buying-points/sheller-contracts/{id}/cancel"
        actor: BuyingPointAdmin
        preconditions: ["No delivery calls in {ISSUED, ALLOCATED} (ERR_CONTRACT_HAS_OPEN_CALLS)"]
        side_effects: []

  - entity: DeliveryCall
    initial_state: ISSUED
    terminal_states: [RECONCILED, CANCELLED, DEFAULTED]
    transitions:
      - from: ISSUED
        to: ALLOCATED
        trigger: "POST /buying-points/delivery-calls/{id}/allocate"
        actor: BuyingPointAdmin
        preconditions:
          - "OCC: expected_delivery_call_version == current version (ERR_STALE_VERSION)"
          - "Eligible allocable tons >= requested_tons (ERR_INSUFFICIENT_ALLOCABLE_TONS)"
        side_effects:
          - "calculations.allocation_selector runs (FIFO over eligible receipts); AllocationLines created"
          - "Warehouse.reserved_tons += allocated per receipt warehouse; BuyingPoint.intake_posture recomputed"
          - "increments DeliveryCall.version by 1"
      - from: ALLOCATED
        to: ALLOCATED
        trigger: "POST /buying-points/delivery-calls/{id}/allocate (re-allocation supersedes prior lines)"
        actor: BuyingPointAdmin
        preconditions: ["OCC: expected_delivery_call_version == current version (ERR_STALE_VERSION)"]
        side_effects:
          - "Prior AllocationLines deleted and their reservations released, then selector re-runs from scratch"
          - "increments DeliveryCall.version by 1"
      - from: ALLOCATED
        to: DELIVERED
        trigger: "POST /buying-points/delivery-calls/{id}/deliver"
        actor: BuyingPointAdmin
        preconditions: []
        side_effects:
          - "Each AllocationLine.shipped_tons := allocated_tons (full truckout)"
          - "Each StorageReceipt.tons_remaining -= shipped_tons; receipt -> CLOSED at 0 (which sets load -> DEPLETED)"
          - "Warehouse.stored_tons and reserved_tons -= shipped per receipt warehouse; BuyingPoint.intake_posture recomputed"
          - "delivered_tons := allocated_tons; contract.fulfilled_units_tons += delivered_tons; contract -> FULFILLED when fulfilled >= total"
          - "increments DeliveryCall.version by 1"
      - from: DELIVERED
        to: RECONCILED
        trigger: "POST /buying-points/delivery-calls/{id}/reconcile"
        actor: "ShellerRep (contract owner)"
        preconditions:
          - "shelled_kernel_tons + hull_tons <= delivered_tons AND delivered_tons - shelled_kernel_tons - hull_tons <= SHRINK_ALLOWANCE_PCT (1%) of delivered_tons (ERR_HULL_RECONCILE_MISMATCH)"
        side_effects:
          - "AllocationLine.shelled_tons attributed pro-rata by shipped_tons (3-decimal rounding; remainder to earliest-created line)"
          - "HullLot created GENERATED with tons := hull_tons"
          - "increments DeliveryCall.version by 1"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /buying-points/delivery-calls/{id}/cancel"
        actor: "ShellerRep (contract owner) or BuyingPointAdmin"
        preconditions: []
        side_effects: []
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /buying-points/delivery-calls/{id}/cancel"
        actor: "ShellerRep (contract owner) or BuyingPointAdmin"
        preconditions: []
        side_effects: ["AllocationLines deleted; warehouse reservations released; BuyingPoint.intake_posture recomputed"]
      - from: ISSUED
        to: DEFAULTED
        trigger: "system (run_ops: dock_window_end < current logical clock and still ISSUED)"
        actor: system
        preconditions: []
        side_effects: ["contract.default_count += 1; contract -> DEFAULTED at CONTRACT_DEFAULT_LIMIT (see ShellerContract cascade)"]
      - from: ALLOCATED
        to: DEFAULTED
        trigger: "system (run_ops: dock_window_end < current logical clock and still ALLOCATED)"
        actor: system
        preconditions: []
        side_effects: ["AllocationLines deleted; reservations released; contract.default_count += 1; contract -> DEFAULTED at limit with sibling-call cancellation cascade"]

  - entity: Settlement
    initial_state: COMPUTED
    terminal_states: [PAID, SUPERSEDED, VOIDED]
    transitions:
      - from: COMPUTED
        to: APPROVED
        trigger: "POST /buying-points/settlements/{id}/approve"
        actor: SettlementClerk
        preconditions:
          - "X-User-ID != computed_by (ERR_SEG_OF_DUTIES)"
          - "net_payment_cents >= 0 (ERR_SETTLEMENT_NOT_PAYABLE)"
          - "quota.used_quota_tons + quota_tons_applied <= quota.quota_tons (ERR_QUOTA_EXCEEDED)"
        side_effects:
          - "approved_by := X-User-ID"
          - "QuotaHistory.used_quota_tons += quota_tons_applied"
          - "Each included load's settlement_id := this settlement id"
      - from: APPROVED
        to: PAID
        trigger: "POST /buying-points/settlements/{id}/pay"
        actor: SettlementClerk
        preconditions: ["X-User-ID != approved_by (ERR_SEG_OF_DUTIES)"]
        side_effects:
          - "paid_by := X-User-ID"
          - "Every pledge in offset_pledge_ids still ACTIVE -> REPAID; its StorageReceipt -> OPEN"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /buying-points/settlements/{id}/void"
        actor: BuyingPointAdmin
        preconditions: []
        side_effects:
          - "QuotaHistory.used_quota_tons -= quota_tons_applied (compensating invariant)"
          - "Each included load's settlement_id := null"
      - from: COMPUTED
        to: DISPUTED
        trigger: "POST /buying-points/settlements/{id}/dispute"
        actor: "Grower (own)"
        preconditions: []
        side_effects: []
      - from: COMPUTED
        to: STALE
        trigger: "system (a grade sheet for an included load is superseded)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: STALE
        trigger: "system (a grade sheet for an included load is superseded)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: SUPERSEDED
        trigger: "system (a new settlement for the same grower+crop_year is computed)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Only DISPUTED and STALE settlements are superseded by a recompute. Multiple COMPUTED settlements for the same grower+crop_year COEXIST (each sees the same quota headroom at compute; overcommit is resolved at approve via ERR_QUOTA_EXCEEDED). APPROVED/PAID are locked and never superseded."
      - from: STALE
        to: SUPERSEDED
        trigger: "system (a new settlement for the same grower+crop_year is computed)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: QuotaHistory
    initial_state: RECORDED
    terminal_states: []
    transitions: []
    note: "used_quota_tons mutates via Settlement approve/void cascades; no status transitions"

  - entity: HullLot
    initial_state: GENERATED
    terminal_states: [SOLD, DISPOSED]
    transitions:
      - from: GENERATED
        to: LISTED
        trigger: "POST /buying-points/hull-lots/{id}/list-for-sale"
        actor: BuyingPointAdmin
        preconditions: []
        side_effects: ["sale_price_cents_per_ton recorded"]
      - from: LISTED
        to: SOLD
        trigger: "POST /buying-points/hull-lots/{id}/sell"
        actor: BuyingPointAdmin
        preconditions: []
        side_effects: ["revenue_cents := round_half_up(tons * sale_price_cents_per_ton); sold_at := logical clock; enters hull revenue pool for future settlement computes"]
      - from: GENERATED
        to: DISPOSED
        trigger: "POST /buying-points/hull-lots/{id}/dispose"
        actor: BuyingPointAdmin
        preconditions: []
        side_effects: ["disposition_ref recorded; never enters revenue pool"]
      - from: LISTED
        to: DISPOSED
        trigger: "POST /buying-points/hull-lots/{id}/dispose"
        actor: BuyingPointAdmin
        preconditions: []
        side_effects: ["disposition_ref recorded; never enters revenue pool"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: settlement-create-stale-grower
    parent_entity: Grower
    write_endpoint: "POST /buying-points/growers/{growerId}/settlements"
    occ_field: expected_grower_version
    description: |
      Computing a settlement against a Grower whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just computed a settlement for the same grower and
      crop year (which legitimately supersedes a prior DISPUTED/STALE
      settlement — or coexists with a prior COMPUTED one — and bumps
      Grower.version), leaving this writer's view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: delivery-call-allocate-stale
    parent_entity: DeliveryCall
    write_endpoint: "POST /buying-points/delivery-calls/{id}/allocate"
    occ_field: expected_delivery_call_version
    description: |
      Allocating a DeliveryCall whose version has advanced since the client
      last observed it is rejected. This captures the case where another
      writer has just re-allocated the call (legitimately superseding the
      prior allocation lines and bumping DeliveryCall.version), leaving this
      writer's view of the allocation stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: grade-sheet-create-stale-load
    parent_entity: FarmerStockLoad
    write_endpoint: "POST /buying-points/loads/{id}/grade-sheets"
    occ_field: expected_farmer_stock_load_version
    description: |
      Creating a re-grade GradeSheet against a FarmerStockLoad whose version
      has advanced since the client last observed it is rejected. This
      captures the case where another writer has just created or finalized a
      sheet (legitimately superseding the prior sheet of record and bumping
      the load's version), leaving this writer's basis for re-grade stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: payable_tons
    trigger: "GradeSheet finalize"
    algorithm: aggregation
    formula: |
      fm_tons  = round_half_up_3dp(load.gross_tons * sheet.foreign_material_pct / 100)
      lsk_tons = round_half_up_3dp(load.gross_tons * sheet.lsk_pct / 100)
      payable_tons = round_half_up_3dp(load.gross_tons - fm_tons - lsk_tons)
      # Order pinned: each deduction component is rounded to 3 decimals FIRST,
      # then subtracted. Computing (1 - fm% - lsk%) * gross in one shot is
      # forbidden — results differ at the 3rd decimal.
    input_set: "the load being graded and the sheet being finalized"
    precision: "3 decimal places, round_half_up"

  - name: discount_cents_per_ton
    trigger: "GradeSheet finalize (inside load_net_value) and any re-grade"
    algorithm: tiered_pricing
    formula: |
      moisture_discount_cpt = first tier in schedule.moisture_tiers where moisture_pct <= tier.up_to_pct (null up_to_pct matches all); boundary INCLUSIVE (pct == up_to_pct selects that tier)
      fm_discount_cpt = same selection over schedule.foreign_material_tiers on foreign_material_pct
      damage_discount_cpt = round_half_up_0dp(damage_pct * schedule.damage_rate_cents_per_pct)
      total_discount_cpt = moisture_discount_cpt + fm_discount_cpt + damage_discount_cpt
    input_set: "the finalized grade sheet and its pinned DiscountSchedule"
    precision: "integer cents per ton, round_half_up for the damage product"

  - name: load_net_value
    trigger: "Settlement compute (per included load) and provisional_net_estimate at finalize"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED (circular-looking quota interplay resolved):
      # (1) quota split for THIS load, (2) per-part gross, (3) per-line
      # discounts rounded then summed, (4) net = gross - discounts.
      quota_tons_applied(load) = min(load.payable_tons, quota_remaining_tons)
      additional_tons_applied(load) = load.payable_tons - quota_tons_applied(load)
      gross_value_cents(load) = round_half_up_0dp(quota_tons_applied * bp.quota_price_cents_per_ton)
                              + round_half_up_0dp(additional_tons_applied * bp.additional_price_cents_per_ton)
      # Nested rounding, order pinned (mode b): round EACH discount line to
      # whole cents first, THEN sum. (Sum-of-cpt * tons then round is the
      # forbidden alternative; it differs, e.g. 22207 vs 22206.)
      discount_cents(load) = round_half_up_0dp(payable * moisture_cpt)
                           + round_half_up_0dp(payable * fm_cpt)
                           + round_half_up_0dp(payable * damage_cpt)
      load_net_cents(load) = gross_value_cents(load) - discount_cents(load)
      # quota_remaining_tons (settlement pricing) = quota.quota_tons - quota.used_quota_tons
      # - quota_tons_applied of loads earlier in THIS settlement's inclusion order.
      # Other COMPUTED settlements do NOT reduce this view (deliberate overcommit
      # window; approve re-validates against live used_quota_tons -> ERR_QUOTA_EXCEEDED).
    input_set: "settlement inclusion set (see settlement_net_final), processed in inclusion order"
    constants:
      MOISTURE_DRYING_REQUIRED_PCT: 10.49
      MOISTURE_REJECT_PCT: 15.00
    precision: "integer cents, round_half_up; tons at 3 decimals"
    variants:
      - name: provisional_at_finalize
        when: "GradeSheet finalize writes load.provisional_net_estimate_cents"
        difference: "quota_remaining taken as quota.quota_tons - quota.used_quota_tons with NO intra-settlement consumption; drying estimated (see provisional_net_estimate); hull credit and loan offset are zero"

  - name: provisional_net_estimate
    trigger: "GradeSheet finalize"
    algorithm: forward_looking
    formula: |
      provisional_net_estimate_cents =
          load_net_cents(load)                                  # provisional variant of load_net_value
        - (drying_status == REQUIRED ? estimated_drying_cents : 0)
      estimated_drying_cents = round_half_up_0dp(ceil(gross_tons / min_cycle_capacity) * bp.drying_rate_per_cycle_cents * moisture_multiplier(moisture_pct))
      # min_cycle_capacity = minimum cycle_capacity_tons over all Dryers of the buying
      # point; if no dryer exists, estimated_drying_cents = 0 (cannot estimate).
      # moisture_multiplier(m) = 1 + 0.05 * floor(max(0, m - MOISTURE_DRYING_REQUIRED_PCT))
    input_set: "the graded load, its pinned schedule, the buying point's dryers and prices"
    precision: "integer cents, round_half_up"
    variants:
      - name: final_at_settlement
        when: "Settlement compute writes Settlement.net_payment_cents"
        difference: "uses ACTUAL COMPLETED booking charges, actual loan offset, and hull credit; diverges from provisional whenever any of those is non-zero"

  - name: drying_charge
    trigger: "Settlement compute, per COMPLETED DryerBooking of an included load"
    algorithm: threshold
    formula: |
      cycles = ceil(booking.tons / dryer.cycle_capacity_tons)
      moisture_over = max(0, booking.moisture_at_booking - MOISTURE_DRYING_REQUIRED_PCT)
      multiplier = 1 + 0.05 * floor(moisture_over)        # per FULL pct point over threshold
      drying_charge_cents = round_half_up_0dp(cycles * bp.drying_rate_per_cycle_cents * multiplier)
      # Non-linear (mode a): 4 inputs (tons, capacity, moisture, rate), nested
      # ceil/floor, conditional jump at each full pct over 10.49.
    input_set: "DryerBookings with status COMPLETED whose load_id is in the settlement inclusion set (all crop years of bookings allowed; keyed by load)"
    constants:
      MOISTURE_DRYING_REQUIRED_PCT: 10.49
      MOISTURE_STEP_RATE: 0.05
    precision: "integer cents, round_half_up"

  - name: loan_principal
    trigger: "LoanPledge creation"
    algorithm: tiered_pricing
    formula: |
      # Quota view for loans RESERVES but does not consume:
      loan_quota_remaining = quota.quota_tons - quota.used_quota_tons
                           - sum(quota_part_tons of OTHER ACTIVE pledges of this grower for this crop year)
      quota_part_tons = min(pledged_tons, max(0, loan_quota_remaining))
      additional_part_tons = pledged_tons - quota_part_tons
      principal_cents = round_half_up_0dp(quota_part_tons * bp.loan_rate_quota_cents_per_ton)
                      + round_half_up_0dp(additional_part_tons * bp.loan_rate_additional_cents_per_ton)
    input_set: "the pledge, the grower's QuotaHistory for the buying point's crop_year (missing history => quota_tons = 0), other ACTIVE pledges of the grower"
    precision: "integer cents, round_half_up"

  - name: loan_offset_with_interest
    trigger: "Settlement compute (per ACTIVE pledge of the grower) and repay waterfall"
    algorithm: chronological
    formula: |
      # Mode (c) circular-looking dependency, evaluation order PINNED:
      # interest depends on days outstanding, which for a settlement that PAYS
      # the loan would depend on approval/payment date — but offsets are frozen
      # at COMPUTE. Rule: days = floor((settlement.created_at - pledge.pledged_at)
      # expressed in whole days); later approve/pay NEVER recomputes; any change
      # requires a recompute (new superseding settlement).
      days = max(0, floor((as_of - pledged_at) / 86400 seconds))
      accrued_interest_cents(as_of) = round_half_up_0dp(outstanding_principal_cents * LOAN_DAILY_INTEREST_BP / 10000 * days)
      offset_cents = outstanding_principal_cents + accrued_interest_cents(settlement.created_at)
      # Repay waterfall (separate trigger): payment applies to accrued interest
      # FIRST (accrued recomputed to payment date), remainder to principal.
    input_set: "LoanPledges of the grower with status ACTIVE at settlement compute time"
    constants:
      LOAN_DAILY_INTEREST_BP: 2
    precision: "integer cents, round_half_up; days as whole-day floor"

  - name: collateral_coverage
    trigger: "LoanPledge read (computed fields) and foreclose"
    algorithm: aggregation
    formula: |
      collateral_value_standard_cents = round_half_up_0dp(quota_part_tons * bp.quota_price_cents_per_ton)
                                      + round_half_up_0dp(additional_part_tons * bp.additional_price_cents_per_ton)
      collateral_value_conservative_cents = round_half_up_0dp(pledged_tons * bp.additional_price_cents_per_ton)
      outstanding = outstanding_principal_cents + accrued_interest_cents(current clock)
      margin_status = MARGIN_OK if collateral_value_conservative_cents >= outstanding * MARGIN_FACTOR else MARGIN_CALL
      foreclosure_credit_cents = max(0, collateral_value_standard_cents - outstanding)   # at foreclose only
      # MARGIN_FACTOR comparison is exact (no rounding of the threshold).
    input_set: "the pledge and buying point price fields"
    constants:
      MARGIN_FACTOR: 1.10
    precision: "integer cents, round_half_up; threshold compared unrounded"
    variants:
      - name: conservative_margin
        when: "margin_status on every pledge read"
        difference: "values ALL pledged tons at the additional-tier price; diverges from standard whenever quota_part_tons > 0 (e.g. 800000 vs 1120000 on a 20-ton all-quota pledge)"

  - name: hull_credit_allocation
    trigger: "Settlement compute"
    algorithm: waterfall_allocation
    formula: |
      pool_cents = sum(revenue_cents of HullLots with status SOLD whose delivery call's contract
                   belongs to this buying point and sold_at <= settlement.created_at)
      shelled_tons(g) = sum(AllocationLine.shelled_tons over lines of RECONCILED calls whose
                        receipt's load's grower_id == g)   # all crop years of the buying point's crop year context
      share(g) = floor(pool_cents * shelled_tons(g) / total_shelled_tons)
      remainder = pool_cents - sum(share(g) over growers g with shelled_tons(g) > 0)
      # Remainder distributed 1 cent at a time, growers ordered by their earliest
      # contributing AllocationLine.created_at ASC, tie-break Grower.created_at ASC,
      # until remainder exhausted. Never use id for ordering.
      hull_credit_cents = share(grower) + remainder_share(grower)   # 0 when total_shelled_tons == 0
    input_set: "SOLD HullLots and RECONCILED DeliveryCalls of the buying point; growers with positive shelled contribution"
    precision: "integer cents; floor per share; deterministic cent-by-cent remainder"

  - name: buying_point_posture
    trigger: "any mutation to Warehouse stored/reserved totals (store, allocate, deliver, cancel, forfeit, warehouse create)"
    algorithm: threshold
    formula: |
      free_total = sum(wh.capacity_tons - wh.stored_tons - wh.reserved_tons over all Warehouses of the buying point)
      posture = SUSPENDED  if free_total <= 0
              = RESTRICTED if 0 < free_total <= RESTRICTED_FREE_TONS
              = OPEN       if free_total > RESTRICTED_FREE_TONS
      # Boundaries pinned: free_total == 0 => SUSPENDED; == 500 => RESTRICTED; == 501 => OPEN.
      # While RESTRICTED: load creation requires gross_tons <= RESTRICTED_MAX_LOAD_TONS at weigh
      # (weigh-time check ERR_RESTRICTED_LOAD_LIMIT); while SUSPENDED: load creation rejected
      # (ERR_INTAKE_SUSPENDED). A buying point with no warehouses has free_total = 0 => SUSPENDED.
    input_set: "all Warehouses of the buying point"
    constants:
      RESTRICTED_FREE_TONS: 500
      RESTRICTED_MAX_LOAD_TONS: 50
    precision: "exact ton comparison"

  - name: allocation_selector
    trigger: "DeliveryCall allocate"
    algorithm: chronological
    formula: |
      eligible receipts R = StorageReceipts with status == OPEN, tons_remaining > 0,
        whose warehouse's buying_point_id == call.contract.buying_point_id,
        and (receipt.segregated == false OR contract.accepts_segregated == true)
      order: R sorted by stored_at ASC, tie-break created_at ASC (never id)
      walk: take line_tons = min(receipt.tons_remaining, remaining_need) per receipt
      until remaining_need == 0; if sum(tons_remaining over R) < requested_tons
      reject the whole allocation with ERR_INSUFFICIENT_ALLOCABLE_TONS (no partial set persisted)
      # Re-allocation: delete existing lines (release reservations) THEN run selector fresh.
    input_set: "OPEN receipts of the buying point at allocate time"
    precision: "3-decimal tons"

  - name: aflatoxin_determination
    trigger: "AflatoxinCertificate record-result"
    algorithm: threshold
    formula: |
      determination = PASS       if result_ppb <= AFLATOXIN_PASS_MAX_PPB        # 15.00 inclusive
                    = SEGREGATE  if AFLATOXIN_PASS_MAX_PPB < result_ppb <= AFLATOXIN_SEGREGATE_MAX_PPB   # (15, 50]
                    = REJECT     if result_ppb > AFLATOXIN_SEGREGATE_MAX_PPB    # > 50
    input_set: "the certificate's current result_ppb"
    constants:
      AFLATOXIN_PASS_MAX_PPB: 15.00
      AFLATOXIN_SEGREGATE_MAX_PPB: 50.00
    precision: "2-decimal ppb; boundaries inclusive as shown"

  - name: ops_run_sweep
    trigger: "POST /buying-points/{id}/run_ops"
    algorithm: chronological
    formula: |
      Processing order is PINNED: (1) dryer bookings first, then (2) delivery calls.
      (1) BOOKED DryerBookings of this buying point with ends_at < current clock,
          ordered starts_at ASC then created_at ASC: each -> NO_SHOW (strike cascade per
          DryerBooking machine; a suspension mid-sweep cancels the grower's later
          bookings BEFORE they are swept — cancelled bookings are skipped).
      (2) DeliveryCalls with status IN {ISSUED, ALLOCATED} and dock_window_end < current
          clock whose contract belongs to this buying point, ordered dock_window_end ASC
          then created_at ASC: each -> DEFAULTED (reservations released, default_count += 1,
          contract DEFAULTED cascade at CONTRACT_DEFAULT_LIMIT).
    input_set: "non-terminal DryerBookings and DeliveryCalls of the buying point"
    constants:
      STRIKE_LIMIT: 2
      CONTRACT_DEFAULT_LIMIT: 2
    precision: "strict < comparison of ends_at / dock_window_end against the clock"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role name"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: business_constraint
    check: "Request schema: required fields present, types valid, enums in range, numeric constraints (tons > 0, pcts in [0,100], amount_cents > 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 3
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "Path ids and body FK references exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: auth
    check: "Ownership scope: Grower acts only on own loads/pledges/settlements (grower_id == X-User-ID); ShellerRep only on contracts with sheller_ref == X-User-ID and their calls"
    error_id: ERR_OWNERSHIP_FORBIDDEN
    http_status: 403
    applies_to: "grower- and sheller-scoped endpoints"
  - priority: 6
    category: state
    check: "State preconditions: target resource in a valid from-state; grower ACTIVE for load create (ERR_GROWER_SUSPENDED); intake posture not SUSPENDED for load create (ERR_INTAKE_SUSPENDED); load drying_status satisfied for store (ERR_DRYING_REQUIRED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition and gated-create endpoints"
  - priority: 7
    category: business_constraint
    check: "OCC: expected_<parent>_version equals parent's current version on the three §1.2.1 endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST settlements, POST allocate, POST grade-sheets"
  - priority: 8
    category: business_safety
    check: "Compliance: segregation of duties (aflatoxin confirm != recorder; settlement approve != computer; pay != approver — ERR_SEG_OF_DUTIES); aflatoxin clearance for store (ERR_AFLATOXIN_NOT_CLEARED); compartment segregation match (ERR_COMPARTMENT_SEGREGATION)"
    error_id: ERR_SEG_OF_DUTIES
    http_status: 409
    applies_to: "confirm, approve, pay, storage-receipts create"
  - priority: 9
    category: business_constraint
    check: "Constraint: certificate uniqueness per load (ERR_CERTIFICATE_EXISTS); quota history uniqueness per grower+year (ERR_DUPLICATE_QUOTA_HISTORY); schedule window overlap at activation (ERR_SCHEDULE_WINDOW_OVERLAP); dryer half-open overlap (ERR_DRYER_OVERLAP); dock closed-interval+buffer overlap (ERR_DOCK_WINDOW_OVERLAP); warehouse capacity (ERR_WAREHOUSE_CAPACITY); settlement lock on re-grade (ERR_LOAD_LOCKED_BY_SETTLEMENT); retest cap (ERR_RETEST_LIMIT_EXCEEDED); open calls block contract cancel (ERR_CONTRACT_HAS_OPEN_CALLS)"
    error_id: ERR_DRYER_OVERLAP
    http_status: 409
    applies_to: "create/activate/booking endpoints"
  - priority: 10
    category: business_temporal
    check: "Temporal: dock window inside contract window (ERR_DOCK_WINDOW_OUTSIDE_CONTRACT); foreclose only after maturity (ERR_FORECLOSE_NOT_MATURED); ACTIVE schedule must cover load.weighed_at at finalize (ERR_NO_ACTIVE_SCHEDULE); RESTRICTED posture load-size cap at weigh (ERR_RESTRICTED_LOAD_LIMIT)"
    error_id: ERR_NO_ACTIVE_SCHEDULE
    http_status: 409
    applies_to: "delivery-calls create, foreclose, grade finalize, weigh"
  - priority: 11
    category: business_fiscal
    check: "Fiscal: requested_tons <= contract remaining (ERR_CONTRACT_REMAINING_EXCEEDED); allocable tons sufficient (ERR_INSUFFICIENT_ALLOCABLE_TONS); pledged_tons <= receipt.tons_remaining (ERR_LOAN_UNDER_COLLATERALIZED); net_payment >= 0 at approve (ERR_SETTLEMENT_NOT_PAYABLE); quota headroom at approve (ERR_QUOTA_EXCEEDED); reconcile shrink tolerance (ERR_HULL_RECONCILE_MISMATCH)"
    error_id: ERR_CONTRACT_REMAINING_EXCEEDED
    http_status: 409
    applies_to: "delivery-calls create, allocate, loan-pledges create, approve, reconcile"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- BuyingPoint / ops ---
  - method: POST
    path: "/buying-points"
    description: "Create a buying point"
    roles: [BuyingPointAdmin]
    code: 201
    input: [name, crop_year, drying_rate_per_cycle_cents, quota_price_cents_per_ton, additional_price_cents_per_ton, loan_rate_quota_cents_per_ton, loan_rate_additional_cents_per_ton]
    output: BuyingPoint
    side_effects: ["intake_posture = SUSPENDED (no warehouses => free_total 0)", "ops_run_index = 0"]
  - method: GET
    path: "/buying-points/{id}"
    description: "Get a buying point (posture, prices, ops_run_index)"
    roles: [BuyingPointAdmin, Grower, GradingInspector, LabTechnician, SettlementClerk, ShellerRep]
    code: 200
    input: []
    output: BuyingPoint
    side_effects: []
  - method: POST
    path: "/buying-points/{id}/run_ops"
    description: "Ops-run checkpoint: ops_run_index += 1, then calculations.ops_run_sweep (booking no-shows then delivery-call defaults, pinned order)"
    roles: [BuyingPointAdmin]
    code: 200
    input: []
    output: BuyingPoint
    side_effects: ["ops_run_index += 1", "booking NO_SHOW sweep with grower strike cascade", "delivery-call DEFAULTED sweep with contract cascade", "posture recompute"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads this default and never wall-clock time."
    roles: [BuyingPointAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock := to_iso8601"]

  # --- Grower ---
  - method: POST
    path: "/buying-points/growers"
    description: "Register a grower"
    roles: [BuyingPointAdmin]
    code: 201
    input: [name, farm_number]
    output: Grower
    side_effects: ["status = ACTIVE", "no_show_strikes = 0"]
  - method: GET
    path: "/buying-points/growers/{id}"
    description: "Get a grower"
    roles: [BuyingPointAdmin, Grower, SettlementClerk]
    code: 200
    input: []
    output: Grower
    side_effects: []
  - method: GET
    path: "/buying-points/growers"
    description: "List growers (Grower role is scoped to its own record)"
    roles: [BuyingPointAdmin, SettlementClerk, Grower]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Grower[]
    side_effects: []
  - method: POST
    path: "/buying-points/growers/{id}/suspend"
    description: "Administratively suspend an ACTIVE grower; cancels the grower's BOOKED dryer bookings"
    roles: [BuyingPointAdmin]
    code: 200
    input: []
    output: Grower
    side_effects: ["status -> SUSPENDED", "grower's BOOKED DryerBookings -> CANCELLED (loads -> REQUIRED)"]
  - method: POST
    path: "/buying-points/growers/{id}/reinstate"
    description: "Reinstate a SUSPENDED grower (strikes reset to 0)"
    roles: [BuyingPointAdmin]
    code: 200
    input: []
    output: Grower
    side_effects: ["status -> ACTIVE", "no_show_strikes = 0"]

  # --- DiscountSchedule ---
  - method: POST
    path: "/buying-points/discount-schedules"
    description: "Create a discount schedule (DRAFT)"
    roles: [BuyingPointAdmin]
    code: 201
    input: [schedule_code, effective_from, effective_to, moisture_tiers, foreign_material_tiers, damage_rate_cents_per_pct]
    output: DiscountSchedule
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/buying-points/discount-schedules/{id}"
    description: "Get a discount schedule"
    roles: [BuyingPointAdmin, GradingInspector, SettlementClerk]
    code: 200
    input: []
    output: DiscountSchedule
    side_effects: []
  - method: GET
    path: "/buying-points/discount-schedules"
    description: "List discount schedules"
    roles: [BuyingPointAdmin, GradingInspector, SettlementClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DiscountSchedule[]
    side_effects: []
  - method: POST
    path: "/buying-points/discount-schedules/{id}/activate"
    description: "Activate a schedule; rejects half-open window overlap with any other ACTIVE schedule"
    roles: [BuyingPointAdmin]
    code: 200
    input: []
    output: DiscountSchedule
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/buying-points/discount-schedules/{id}/retire"
    description: "Retire an ACTIVE schedule (pinned grade sheets unaffected)"
    roles: [BuyingPointAdmin]
    code: 200
    input: []
    output: DiscountSchedule
    side_effects: ["status -> RETIRED"]

  # --- FarmerStockLoad ---
  - method: POST
    path: "/buying-points/loads"
    description: "Report a farmer stock load (REPORTED). Grower role must report for itself."
    roles: [BuyingPointAdmin, Grower]
    code: 201
    input: [grower_id, crop_year]
    output: FarmerStockLoad
    side_effects: ["status = REPORTED; aflatoxin_status = UNTESTED; drying_status = NOT_REQUIRED"]
  - method: GET
    path: "/buying-points/loads/{id}"
    description: "Get a load (all three state axes, payable_tons, provisional estimate)"
    roles: [BuyingPointAdmin, Grower, GradingInspector, LabTechnician, SettlementClerk]
    code: 200
    input: []
    output: FarmerStockLoad
    side_effects: []
  - method: GET
    path: "/buying-points/loads"
    description: "List loads; Grower role auto-scoped to own loads"
    roles: [BuyingPointAdmin, Grower, GradingInspector, LabTechnician, SettlementClerk]
    code: 200
    input: ["grower_id?", "status?", "aflatoxin_status?", "settlement_id?", "limit?", "offset?"]
    output: FarmerStockLoad[]
    side_effects: []
  - method: POST
    path: "/buying-points/loads/{id}/weigh"
    description: "Record scale weight; REPORTED -> WEIGHED; posture gates apply at creation and re-checked here (RESTRICTED cap)"
    roles: [BuyingPointAdmin]
    code: 200
    input: [gross_tons]
    output: FarmerStockLoad
    side_effects: ["gross_tons, weighed_at set", "status -> WEIGHED", "increments FarmerStockLoad.version by 1"]

  # --- GradeSheet ---
  - method: POST
    path: "/buying-points/loads/{id}/grade-sheets"
    description: "Create a DRAFT grade sheet on a WEIGHED/GRADED/STORED load (OCC on load version; re-grade supersedes on finalize)"
    roles: [GradingInspector]
    code: 201
    input: [moisture_pct, foreign_material_pct, damage_pct, lsk_pct, expected_farmer_stock_load_version]
    output: GradeSheet
    side_effects: ["status = DRAFT", "inspector_ref := X-User-ID", "increments FarmerStockLoad.version by 1"]
  - method: GET
    path: "/buying-points/grade-sheets/{id}"
    description: "Get a grade sheet"
    roles: [BuyingPointAdmin, GradingInspector, SettlementClerk]
    code: 200
    input: []
    output: GradeSheet
    side_effects: []
  - method: GET
    path: "/buying-points/grade-sheets"
    description: "List grade sheets"
    roles: [BuyingPointAdmin, GradingInspector, SettlementClerk]
    code: 200
    input: ["load_id?", "schedule_id?", "status?", "limit?", "offset?"]
    output: GradeSheet[]
    side_effects: []
  - method: POST
    path: "/buying-points/grade-sheets/{id}/finalize"
    description: "Finalize: pin schedule, compute payable_tons, supersede prior sheet, drive load axis transitions and STALE cascade"
    roles: [GradingInspector]
    code: 200
    input: []
    output: GradeSheet
    side_effects: ["sheet -> FINALIZED", "load -> GRADED or REJECTED (moisture) or stays STORED with recompute", "prior FINALIZED sheet -> SUPERSEDED", "containing COMPUTED/DISPUTED settlements -> STALE", "increments FarmerStockLoad.version by 1"]

  # --- AflatoxinCertificate ---
  - method: POST
    path: "/buying-points/loads/{id}/aflatoxin-certificates"
    description: "Draw an aflatoxin sample; at most one certificate per load; load must be WEIGHED or GRADED"
    roles: [LabTechnician]
    code: 201
    input: [sample_ref]
    output: AflatoxinCertificate
    side_effects: ["status = SAMPLED", "load.aflatoxin_status -> SAMPLED", "increments FarmerStockLoad.version by 1"]
  - method: GET
    path: "/buying-points/aflatoxin-certificates/{id}"
    description: "Get a certificate"
    roles: [BuyingPointAdmin, LabTechnician, SettlementClerk]
    code: 200
    input: []
    output: AflatoxinCertificate
    side_effects: []
  - method: GET
    path: "/buying-points/aflatoxin-certificates"
    description: "List certificates"
    roles: [BuyingPointAdmin, LabTechnician, SettlementClerk]
    code: 200
    input: ["load_id?", "status?", "limit?", "offset?"]
    output: AflatoxinCertificate[]
    side_effects: []
  - method: POST
    path: "/buying-points/aflatoxin-certificates/{id}/record-result"
    description: "Record ppb result; SAMPLED -> RESULT_RECORDED; determination recomputed"
    roles: [LabTechnician]
    code: 200
    input: [result_ppb]
    output: AflatoxinCertificate
    side_effects: ["result_ppb, result_recorded_by set", "determination recomputed"]
  - method: POST
    path: "/buying-points/aflatoxin-certificates/{id}/confirm"
    description: "Confirm result (confirmer must differ from recorder — segregation of duties); drives load.aflatoxin_status"
    roles: [LabTechnician]
    code: 200
    input: []
    output: AflatoxinCertificate
    side_effects: ["status -> CONFIRMED", "load.aflatoxin_status := determination-mapped value", "REJECT => load.status -> REJECTED", "increments FarmerStockLoad.version by 1"]
  - method: POST
    path: "/buying-points/aflatoxin-certificates/{id}/order-retest"
    description: "Re-enter SAMPLED for a retest (cycle); retest_count cap 2"
    roles: [LabTechnician]
    code: 200
    input: []
    output: AflatoxinCertificate
    side_effects: ["retest_count += 1", "status -> SAMPLED"]

  # --- Dryer / DryerBooking ---
  - method: POST
    path: "/buying-points/dryers"
    description: "Create a dryer"
    roles: [BuyingPointAdmin]
    code: 201
    input: [buying_point_id, name, cycle_capacity_tons, cycle_hours]
    output: Dryer
    side_effects: []
  - method: GET
    path: "/buying-points/dryers/{id}"
    description: "Get a dryer"
    roles: [BuyingPointAdmin]
    code: 200
    input: []
    output: Dryer
    side_effects: []
  - method: GET
    path: "/buying-points/dryers"
    description: "List dryers"
    roles: [BuyingPointAdmin]
    code: 200
    input: ["buying_point_id?", "limit?", "offset?"]
    output: Dryer[]
    side_effects: []
  - method: POST
    path: "/buying-points/dryer-bookings"
    description: "Book drying capacity; half-open interval exclusivity per dryer; one active booking per load"
    roles: [BuyingPointAdmin]
    code: 201
    input: [dryer_id, load_id, tons, starts_at]
    output: DryerBooking
    side_effects: ["ends_at computed", "moisture_at_booking snapshot", "load.drying_status -> BOOKED", "increments FarmerStockLoad.version by 1"]
  - method: GET
    path: "/buying-points/dryer-bookings/{id}"
    description: "Get a booking"
    roles: [BuyingPointAdmin]
    code: 200
    input: []
    output: DryerBooking
    side_effects: []
  - method: GET
    path: "/buying-points/dryer-bookings"
    description: "List bookings"
    roles: [BuyingPointAdmin]
    code: 200
    input: ["dryer_id?", "load_id?", "status?", "limit?", "offset?"]
    output: DryerBooking[]
    side_effects: []
  - method: POST
    path: "/buying-points/dryer-bookings/{id}/complete"
    description: "Complete a booking; load DRIED iff actual_moisture_after <= 10.49 else back to REQUIRED"
    roles: [BuyingPointAdmin]
    code: 200
    input: [actual_moisture_after]
    output: DryerBooking
    side_effects: ["status -> COMPLETED", "load.drying_status updated", "increments FarmerStockLoad.version by 1"]
  - method: POST
    path: "/buying-points/dryer-bookings/{id}/cancel"
    description: "Cancel a BOOKED booking; load returns to REQUIRED"
    roles: [BuyingPointAdmin]
    code: 200
    input: []
    output: DryerBooking
    side_effects: ["status -> CANCELLED", "load.drying_status -> REQUIRED"]

  # --- Warehouse / StorageReceipt ---
  - method: POST
    path: "/buying-points/warehouses"
    description: "Create a warehouse; recomputes buying point posture"
    roles: [BuyingPointAdmin]
    code: 201
    input: [buying_point_id, name, compartment, capacity_tons]
    output: Warehouse
    side_effects: ["stored_tons = 0, reserved_tons = 0, free_tons = capacity_tons", "BuyingPoint.intake_posture recomputed"]
  - method: GET
    path: "/buying-points/warehouses/{id}"
    description: "Get a warehouse"
    roles: [BuyingPointAdmin, SettlementClerk]
    code: 200
    input: []
    output: Warehouse
    side_effects: []
  - method: GET
    path: "/buying-points/warehouses"
    description: "List warehouses"
    roles: [BuyingPointAdmin, SettlementClerk]
    code: 200
    input: ["buying_point_id?", "compartment?", "limit?", "offset?"]
    output: Warehouse[]
    side_effects: []
  - method: POST
    path: "/buying-points/storage-receipts"
    description: "Store a GRADED load: layered gates (drying, aflatoxin, compartment, capacity); creates OPEN receipt"
    roles: [BuyingPointAdmin]
    code: 201
    input: [load_id, warehouse_id]
    output: StorageReceipt
    side_effects: ["receipt OPEN, tons_initial = gross_tons, segregated snapshot, stored_at = clock", "load -> STORED", "warehouse.stored_tons += gross_tons", "BuyingPoint.intake_posture recomputed", "increments FarmerStockLoad.version by 1"]
  - method: GET
    path: "/buying-points/storage-receipts/{id}"
    description: "Get a receipt"
    roles: [BuyingPointAdmin, Grower, SettlementClerk]
    code: 200
    input: []
    output: StorageReceipt
    side_effects: []
  - method: GET
    path: "/buying-points/storage-receipts"
    description: "List receipts"
    roles: [BuyingPointAdmin, Grower, SettlementClerk]
    code: 200
    input: ["warehouse_id?", "load_id?", "status?", "limit?", "offset?"]
    output: StorageReceipt[]
    side_effects: []

  # --- LoanPledge ---
  - method: POST
    path: "/buying-points/loan-pledges"
    description: "Pledge an OPEN receipt as loan collateral; principal uses quota tier split"
    roles: [BuyingPointAdmin, Grower]
    code: 201
    input: [grower_id, storage_receipt_id, pledged_tons, maturity_date]
    output: LoanPledge
    side_effects: ["status = ACTIVE", "principal_cents computed (calculations.loan_principal)", "receipt -> PLEDGED", "increments StorageReceipt.version by 1"]
  - method: GET
    path: "/buying-points/loan-pledges/{id}"
    description: "Get a pledge (includes computed interest, collateral variants, margin_status at current clock)"
    roles: [BuyingPointAdmin, Grower, SettlementClerk]
    code: 200
    input: []
    output: LoanPledge
    side_effects: []
  - method: GET
    path: "/buying-points/loan-pledges"
    description: "List pledges; Grower role auto-scoped to own"
    roles: [BuyingPointAdmin, Grower, SettlementClerk]
    code: 200
    input: ["grower_id?", "storage_receipt_id?", "status?", "limit?", "offset?"]
    output: LoanPledge[]
    side_effects: []
  - method: POST
    path: "/buying-points/loan-pledges/{id}/repay"
    description: "Repay (interest-first waterfall); full payoff -> REPAID and receipt -> OPEN"
    roles: [BuyingPointAdmin, Grower]
    code: 200
    input: [amount_cents]
    output: LoanPledge
    side_effects: ["interest-first waterfall applied", "full payoff: status -> REPAID, receipt -> OPEN"]
  - method: POST
    path: "/buying-points/loan-pledges/{id}/foreclose"
    description: "Foreclose a matured ACTIVE pledge; receipt forfeited, credit recorded"
    roles: [BuyingPointAdmin]
    code: 200
    input: []
    output: LoanPledge
    side_effects: ["status -> FORECLOSED", "receipt -> FORFEITED, tons_remaining := 0", "warehouse.stored_tons reduced", "posture recompute"]

  # --- ShellerContract ---
  - method: POST
    path: "/buying-points/sheller-contracts"
    description: "Create a sheller contract (DRAFT)"
    roles: [BuyingPointAdmin]
    code: 201
    input: [buying_point_id, sheller_ref, total_units_tons, price_per_ton_cents, accepts_segregated, window_start, window_end]
    output: ShellerContract
    side_effects: ["status = DRAFT", "fulfilled_units_tons = 0", "default_count = 0"]
  - method: GET
    path: "/buying-points/sheller-contracts/{id}"
    description: "Get a contract (ShellerRep scoped to own sheller_ref)"
    roles: [BuyingPointAdmin, ShellerRep, SettlementClerk]
    code: 200
    input: []
    output: ShellerContract
    side_effects: []
  - method: GET
    path: "/buying-points/sheller-contracts"
    description: "List contracts; ShellerRep auto-scoped to sheller_ref == X-User-ID"
    roles: [BuyingPointAdmin, ShellerRep, SettlementClerk]
    code: 200
    input: ["buying_point_id?", "sheller_ref?", "status?", "limit?", "offset?"]
    output: ShellerContract[]
    side_effects: []
  - method: POST
    path: "/buying-points/sheller-contracts/{id}/activate"
    description: "Activate a contract"
    roles: [BuyingPointAdmin]
    code: 200
    input: []
    output: ShellerContract
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/buying-points/sheller-contracts/{id}/cancel"
    description: "Cancel a DRAFT/ACTIVE contract; blocked while calls are open"
    roles: [BuyingPointAdmin]
    code: 200
    input: []
    output: ShellerContract
    side_effects: ["status -> CANCELLED"]

  # --- DeliveryCall ---
  - method: POST
    path: "/buying-points/delivery-calls"
    description: "Sheller issues a delivery call against an ACTIVE own contract; dock window must fit contract window and respect buffered non-overlap"
    roles: [ShellerRep]
    code: 201
    input: [contract_id, requested_tons, dock_window_start, dock_window_end]
    output: DeliveryCall
    side_effects: ["status = ISSUED"]
  - method: GET
    path: "/buying-points/delivery-calls/{id}"
    description: "Get a delivery call"
    roles: [BuyingPointAdmin, ShellerRep, SettlementClerk]
    code: 200
    input: []
    output: DeliveryCall
    side_effects: []
  - method: GET
    path: "/buying-points/delivery-calls"
    description: "List delivery calls; ShellerRep auto-scoped to own contracts"
    roles: [BuyingPointAdmin, ShellerRep, SettlementClerk]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: DeliveryCall[]
    side_effects: []
  - method: POST
    path: "/buying-points/delivery-calls/{id}/allocate"
    description: "Run FIFO allocation selector (calculations.allocation_selector); OCC on call version; re-allocation supersedes prior lines"
    roles: [BuyingPointAdmin]
    code: 200
    input: [expected_delivery_call_version]
    output: DeliveryCall
    side_effects: ["AllocationLines created (prior lines deleted on re-allocation)", "warehouse.reserved_tons updated", "status -> ALLOCATED", "increments DeliveryCall.version by 1", "BuyingPoint.intake_posture recomputed"]
  - method: POST
    path: "/buying-points/delivery-calls/{id}/deliver"
    description: "Ship all allocated tonnage; receipts decrement/close; contract fulfillment bubble-up; posture recompute"
    roles: [BuyingPointAdmin]
    code: 200
    input: []
    output: DeliveryCall
    side_effects: ["lines' shipped_tons := allocated_tons", "receipt tons_remaining -= shipped (CLOSED at 0, load -> DEPLETED)", "warehouse stored/reserved reduced", "contract.fulfilled_units_tons += delivered_tons (FULFILLED at >= total)", "status -> DELIVERED", "increments DeliveryCall.version by 1", "BuyingPoint.intake_posture recomputed"]
  - method: POST
    path: "/buying-points/delivery-calls/{id}/reconcile"
    description: "Sheller reports shelled outturn; tolerance-checked; creates HullLot and attributes shelled tons per line"
    roles: [ShellerRep]
    code: 200
    input: [shelled_kernel_tons, hull_tons]
    output: DeliveryCall
    side_effects: ["AllocationLine.shelled_tons pro-rata (remainder to earliest-created line)", "HullLot GENERATED", "status -> RECONCILED", "increments DeliveryCall.version by 1"]
  - method: POST
    path: "/buying-points/delivery-calls/{id}/cancel"
    description: "Cancel an ISSUED/ALLOCATED call; releases reservations"
    roles: [BuyingPointAdmin, ShellerRep]
    code: 200
    input: []
    output: DeliveryCall
    side_effects: ["status -> CANCELLED", "reservations released", "BuyingPoint.intake_posture recomputed"]

  # --- AllocationLine (read-only junction) ---
  - method: GET
    path: "/buying-points/allocation-lines/{id}"
    description: "Get an allocation line"
    roles: [BuyingPointAdmin, SettlementClerk]
    code: 200
    input: []
    output: AllocationLine
    side_effects: []
  - method: GET
    path: "/buying-points/allocation-lines"
    description: "List allocation lines (discovery channel for cascade-created lines)"
    roles: [BuyingPointAdmin, SettlementClerk]
    code: 200
    input: ["delivery_call_id?", "storage_receipt_id?", "limit?", "offset?"]
    output: AllocationLine[]
    side_effects: []

  # --- Settlement ---
  - method: POST
    path: "/buying-points/growers/{growerId}/settlements"
    description: "Compute a settlement for grower+crop_year; supersedes the prior non-terminal settlement; OCC on Grower.version"
    roles: [SettlementClerk]
    code: 201
    input: [crop_year, expected_grower_version]
    output: Settlement
    side_effects: ["status = COMPUTED with all figure fields computed", "included_load_ids and offset_pledge_ids captured", "prior settlement in {DISPUTED, STALE} for (grower, crop_year) -> SUPERSEDED (COMPUTED settlements coexist; APPROVED/PAID are locked and never superseded)", "increments Grower.version by 1"]
  - method: GET
    path: "/buying-points/settlements/{id}"
    description: "Get a settlement"
    roles: [BuyingPointAdmin, SettlementClerk, Grower]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: GET
    path: "/buying-points/settlements"
    description: "List settlements; Grower role auto-scoped to own"
    roles: [BuyingPointAdmin, SettlementClerk, Grower]
    code: 200
    input: ["grower_id?", "status?", "supersedes_settlement_id?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []
  - method: POST
    path: "/buying-points/settlements/{id}/approve"
    description: "Approve a COMPUTED settlement; approver must differ from computer; consumes quota; locks included loads"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status -> APPROVED", "QuotaHistory.used_quota_tons += quota_tons_applied", "included loads' settlement_id set"]
  - method: POST
    path: "/buying-points/settlements/{id}/dispute"
    description: "Grower disputes a COMPUTED settlement"
    roles: [Grower]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status -> DISPUTED"]
  - method: POST
    path: "/buying-points/settlements/{id}/pay"
    description: "Pay an APPROVED settlement; payer must differ from approver; offset pledges are paid off"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status -> PAID", "offset pledges still ACTIVE -> REPAID; their receipts -> OPEN"]
  - method: POST
    path: "/buying-points/settlements/{id}/void"
    description: "Void an APPROVED settlement (pre-payment); releases quota and load locks (compensating invariant)"
    roles: [BuyingPointAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status -> VOIDED", "QuotaHistory.used_quota_tons -= quota_tons_applied", "included loads' settlement_id cleared"]

  # --- QuotaHistory ---
  - method: POST
    path: "/buying-points/quota-histories"
    description: "Record a grower's annual poundage quota; unique per (grower, crop_year)"
    roles: [BuyingPointAdmin]
    code: 201
    input: [grower_id, crop_year, quota_tons]
    output: QuotaHistory
    side_effects: ["used_quota_tons = 0"]
  - method: GET
    path: "/buying-points/quota-histories/{id}"
    description: "Get a quota history"
    roles: [BuyingPointAdmin, SettlementClerk, Grower]
    code: 200
    input: []
    output: QuotaHistory
    side_effects: []
  - method: GET
    path: "/buying-points/quota-histories"
    description: "List quota histories; Grower role auto-scoped to own"
    roles: [BuyingPointAdmin, SettlementClerk, Grower]
    code: 200
    input: ["grower_id?", "crop_year?", "limit?", "offset?"]
    output: QuotaHistory[]
    side_effects: []

  # --- HullLot ---
  - method: GET
    path: "/buying-points/hull-lots/{id}"
    description: "Get a hull lot"
    roles: [BuyingPointAdmin, SettlementClerk]
    code: 200
    input: []
    output: HullLot
    side_effects: []
  - method: GET
    path: "/buying-points/hull-lots"
    description: "List hull lots (discovery channel for reconcile-created lots)"
    roles: [BuyingPointAdmin, SettlementClerk]
    code: 200
    input: ["delivery_call_id?", "status?", "limit?", "offset?"]
    output: HullLot[]
    side_effects: []
  - method: POST
    path: "/buying-points/hull-lots/{id}/list-for-sale"
    description: "List a GENERATED hull lot for sale"
    roles: [BuyingPointAdmin]
    code: 200
    input: [sale_price_cents_per_ton]
    output: HullLot
    side_effects: ["status -> LISTED"]
  - method: POST
    path: "/buying-points/hull-lots/{id}/sell"
    description: "Sell a LISTED hull lot; revenue enters the hull credit pool at sold_at"
    roles: [BuyingPointAdmin]
    code: 200
    input: []
    output: HullLot
    side_effects: ["status -> SOLD", "revenue_cents computed", "sold_at := clock"]
  - method: POST
    path: "/buying-points/hull-lots/{id}/dispose"
    description: "Dispose a GENERATED/LISTED hull lot (never enters revenue pool)"
    roles: [BuyingPointAdmin]
    code: 200
    input: [disposition_ref]
    output: HullLot
    side_effects: ["status -> DISPOSED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema violation: missing required field, bad type, enum out of range, non-positive tons/amount, receipt-grower mismatch on pledge" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_OWNERSHIP_FORBIDDEN, http: 403, condition: "Grower/ShellerRep acting on a resource outside its ownership scope" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition (incl. terminal lockdown, pledge on non-OPEN receipt, foreclose with zero outstanding, settlement compute with no eligible loads)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent's current version (§1.2.1)" }
  - { id: ERR_GROWER_SUSPENDED, http: 409, condition: "Load creation while the grower is SUSPENDED" }
  - { id: ERR_INTAKE_SUSPENDED, http: 409, condition: "Load creation while buying point posture is SUSPENDED" }
  - { id: ERR_RESTRICTED_LOAD_LIMIT, http: 409, condition: "Weigh while RESTRICTED with gross_tons > RESTRICTED_MAX_LOAD_TONS (50)" }
  - { id: ERR_SEG_OF_DUTIES, http: 409, condition: "Same X-User-ID on both sides of a segregated step (aflatoxin record/confirm; settlement compute/approve; approve/pay)" }
  - { id: ERR_NO_ACTIVE_SCHEDULE, http: 409, condition: "Grade finalize with no ACTIVE discount schedule covering load.weighed_at" }
  - { id: ERR_SCHEDULE_WINDOW_OVERLAP, http: 409, condition: "Activating a schedule whose half-open window overlaps another ACTIVE schedule" }
  - { id: ERR_CERTIFICATE_EXISTS, http: 409, condition: "Creating a second aflatoxin certificate for the same load" }
  - { id: ERR_RETEST_LIMIT_EXCEEDED, http: 409, condition: "order-retest when retest_count == RETEST_MAX (2)" }
  - { id: ERR_AFLATOXIN_NOT_CLEARED, http: 409, condition: "Store with aflatoxin_status not in {PASSED, SEGREGATED}" }
  - { id: ERR_COMPARTMENT_SEGREGATION, http: 409, condition: "Store with compartment mismatch (SEGREGATED load into GENERAL warehouse or PASSED load into SEGREGATED warehouse)" }
  - { id: ERR_DRYING_REQUIRED, http: 409, condition: "Store while load.drying_status IN {REQUIRED, BOOKED}" }
  - { id: ERR_WAREHOUSE_CAPACITY, http: 409, condition: "Store with warehouse.free_tons < load.gross_tons" }
  - { id: ERR_DRYER_OVERLAP, http: 409, condition: "Dryer booking whose half-open [starts_at, ends_at) intersects another BOOKED booking on the same dryer (adjacency allowed)" }
  - { id: ERR_DOCK_WINDOW_OVERLAP, http: 409, condition: "Delivery call whose closed dock window, expanded by TURNAROUND_BUFFER_MIN (120) on both sides, intersects another non-terminal call's buffered window on the same contract" }
  - { id: ERR_DOCK_WINDOW_OUTSIDE_CONTRACT, http: 409, condition: "Dock window not fully inside [contract.window_start, contract.window_end]" }
  - { id: ERR_CONTRACT_REMAINING_EXCEEDED, http: 409, condition: "requested_tons > contract.remaining_units_tons" }
  - { id: ERR_CONTRACT_HAS_OPEN_CALLS, http: 409, condition: "Contract cancel while calls are ISSUED/ALLOCATED" }
  - { id: ERR_INSUFFICIENT_ALLOCABLE_TONS, http: 409, condition: "Eligible OPEN receipts total < requested_tons at allocate (nothing persisted)" }
  - { id: ERR_DUPLICATE_QUOTA_HISTORY, http: 409, condition: "Second QuotaHistory for the same (grower_id, crop_year)" }
  - { id: ERR_LOAN_UNDER_COLLATERALIZED, http: 409, condition: "pledged_tons > receipt.tons_remaining at pledge" }
  - { id: ERR_FORECLOSE_NOT_MATURED, http: 409, condition: "Foreclose while current logical clock <= maturity_date" }
  - { id: ERR_SETTLEMENT_NOT_PAYABLE, http: 409, condition: "Approve with net_payment_cents < 0" }
  - { id: ERR_QUOTA_EXCEEDED, http: 409, condition: "Approve when used_quota_tons + quota_tons_applied > quota_tons" }
  - { id: ERR_LOAD_LOCKED_BY_SETTLEMENT, http: 409, condition: "Re-grade finalize for a load whose settlement_id IS NOT NULL" }
  - { id: ERR_HULL_RECONCILE_MISMATCH, http: 409, condition: "shelled + hull > delivered, or shrink exceeds 1% of delivered_tons" }

# =============================================================================
# §1.7 RBAC Matrix (segregation_of_duties model)
# =============================================================================
roles:
  - name: BuyingPointAdmin
    description: "Buying point operator: configuration, intake weighing, storage, drying, allocation, delivery, ops runs, clock"
    identity: opaque
    exclusive_operations:
      - "POST /buying-points and all configuration CRUD (schedules, dryers, warehouses, quota-histories)"
      - "POST .../weigh, POST /buying-points/storage-receipts"
      - "POST .../dryer-bookings (create/complete/cancel)"
      - "POST .../delivery-calls/{id}/allocate and /deliver"
      - "POST .../run_ops, POST /_clock/set_current_utc, reinstate, contract activate/cancel, settlement void, hull lot lifecycle"
    shared_operations:
      - "GET reads across entities; loan-pledge create/repay/foreclose (shared with Grower for create/repay)"
  - name: Grower
    description: "Peanut grower delivering farmer stock; entity-backed identity anchors ownership"
    identity: "entity_backed:Grower"
    exclusive_operations:
      - "POST /buying-points/settlements/{id}/dispute (own settlements only)"
    shared_operations:
      - "POST /buying-points/loads (own grower_id only; shared with BuyingPointAdmin)"
      - "POST /buying-points/loan-pledges and /repay (own only; shared with BuyingPointAdmin)"
      - "GET own loads, receipts, pledges, settlements, quota histories (auto-scoped)"
  - name: GradingInspector
    description: "Licensed farmer-stock grader; opaque id recorded as inspector_ref"
    identity: opaque
    exclusive_operations:
      - "POST .../grade-sheets (create) and POST .../grade-sheets/{id}/finalize"
    shared_operations:
      - "GET loads, grade sheets, discount schedules"
  - name: LabTechnician
    description: "Aflatoxin lab technician; opaque id recorded as lab_tech_ref / result_recorded_by / confirmed_by"
    identity: opaque
    exclusive_operations:
      - "POST .../aflatoxin-certificates, record-result, confirm, order-retest (confirm requires a different technician than recorder)"
    shared_operations:
      - "GET loads and certificates"
  - name: SettlementClerk
    description: "Settlement desk clerk; compute, approve, and pay MUST be three different clerk ids (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST .../growers/{growerId}/settlements, POST .../settlements/{id}/approve, POST .../settlements/{id}/pay"
    shared_operations:
      - "GET growers, loads, receipts, pledges, settlements, quota histories, warehouses, contracts, calls, allocation lines, hull lots, grade sheets, certificates, schedules"
  - name: ShellerRep
    description: "Sheller representative; opaque identity anchored by ShellerContract.sheller_ref == X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /buying-points/delivery-calls (own contracts), POST .../delivery-calls/{id}/reconcile (own)"
    shared_operations:
      - "POST .../delivery-calls/{id}/cancel (own; shared with BuyingPointAdmin)"
      - "GET own contracts and their delivery calls (auto-scoped)"
