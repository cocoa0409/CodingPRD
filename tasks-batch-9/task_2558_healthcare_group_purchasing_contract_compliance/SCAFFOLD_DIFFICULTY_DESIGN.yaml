      - name: file_reverse_conserves_ytd_spend_and_volume_ledgers
        grounds:
          - state_machines.DistributorFile.PARTIALLY_LOADED_to_REVERSED
          - state_machines.DistributorFile.LOADED_to_REVERSED
          - entities.Commitment.fields.ytd_measured_volume_units
          - entities.PurchaseLine.fields.classification
          - entities.Member.fields.watchlist_status
        distinguishing_aspect: |
          A different conserved quantity: the commitment's three YEAR-TO-DATE ledgers
          (ytd_on_contract_spend_cents, ytd_total_category_spend_cents,
          ytd_measured_volume_units) plus the derived leakage flag and member watchlist —
          purchase volume and category spend, not fee money. Reversing the two files in the
          opposite order to their loads walks the ledgers back through the exact intermediate
          state (47500000 / 50500000 / 5000, flag false) and then to a true zero, and also
          un-classifies every PurchaseLine while preserving each line's reject_reason.
        test_recipe:
          setup:
            - "ACTIVE contract C-SUT-1 with leakage_alert_threshold_pct 15.00; catalog item V-1 at base 10000 / floor 8200."
            - "Member M-1 with item_master MI-1 and MI-9; ACTIVE COUNTERSIGNED TIER_0 commitment; APPROVED cross-reference MI-1 -> V-1; ACTIVE TIER_PRICE activation at 10000."
            - "LOADED file D-A over [2026-08-01, 2026-09-01): 5000 units of MI-1 at 9500 (ON_CONTRACT) and 500 units of MI-9 at 6000 (UNMATCHED)."
            - "PARTIALLY_LOADED file D-B over the same period: 1500 units of MI-1 at 10500 (OFF_CONTRACT_LEAKAGE) plus one zero-quantity line rejected as ZERO_QUANTITY."
            - "After both loads the ledgers read 47500000 / 66250000 / 5000, ytd leakage is 28.30 pct, leakage_flag is true and the member is WATCHLIST."
