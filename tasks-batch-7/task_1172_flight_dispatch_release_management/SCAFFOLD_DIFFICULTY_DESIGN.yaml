            - "man_err == ERR_PLAN_NOT_LOCKED — business_referential outranks business_fiscal ERR_MTOW_EXCEEDED"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: fuel_margin_exact_threshold_boundaries
        grounds:
          - calculations.fuel_margin_recommendation
          - entities.MonitoringEvent.fields.fuel_margin_kg
        distinguishing_aspect: |
          Boundary metric = fuel margin in kg, endpoint = POST
          /dispatch/monitoring-events: margin exactly 500 -> NONE (>=),
          exactly 0 -> CONSIDER_DIVERT (0 <= m < 500), exactly -1 ->
          RECOMMEND_DIVERT. All three boundaries pinned with literal fuel
          figures (4595 / 4095 / 4094) against reserve 1365 and 1h x 2730
          remaining burn.
        test_recipe:
          setup:
            - "Standard chain to RELEASED; clock 2026-05-01T10:30:00Z; leg DEPARTED (monitor MONITORING); pinned plan burn_eff 2730, final_reserve 1365; ETA fixed at 11:30 -> remaining estimate exactly 2730"
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 0, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stb: $.data.id } }
