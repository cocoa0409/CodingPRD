    claim_type: action_endpoint
    grounds:
    - endpoints[POST /short-sale/listings/{id}/withdraw]
    - calculations.listing_window_admission
    - state_machines.Listing.ACTIVE_to_WITHDRAWN
    distinguishing_aspect: 'Half-open adjacency is admissible: once the first window is closed at ended_at 2026-08-20T00:00:00Z, a second listing whose listed_at is exactly that instant is accepted with 201 because
      the overlap test compares new.listed_at < L.ended_at strictly.'
    test_recipe:
      setup:
      - One GSE case whose only Listing has been withdrawn with ended_at 2026-08-20T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-20T00:00:00Z'
        as: PlatformAdmin
        as_user_id: adm-900
      - call: POST /short-sale/cases
        payload:
          property_address: 46 Wrenfield Ct, Reno NV
          investor_type: GSE
          unpaid_principal_balance_cents: 26800000
