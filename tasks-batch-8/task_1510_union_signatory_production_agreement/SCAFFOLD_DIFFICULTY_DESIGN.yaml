  # ===================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: production_create_requires_signatory_company
        grounds:
          - validations[priority=18]
          - errors[ERR_COMPANY_NOT_SIGNATORY]
          - state_machines.ProducerCompany
        distinguishing_aspect: |
          Entity pair Production -> ProducerCompany: production creation is gated on
          the OWNING company's status — PENDING (application still DRAFT) rejects with
          ERR_COMPANY_NOT_SIGNATORY; after approval flips the company to SIGNATORY the
          identical request succeeds.
        test_recipe:
          setup:
            - "company with a DRAFT application (never approved) — status PENDING"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Pine Vale LLC", fein: "13-0000002" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
          trigger:
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Pine Vale One", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
