              captures: { shopX: $.data.id }
            - call: "POST /repair-shops"
              payload: { name: "Shop Y", service_zip: "10006", in_network: true }
              as: Underwriter
              captures: { shopY: $.data.id }
            - call: "POST /policyholders"
              payload: { email: "r3@x.com", full_name: "R3", residence_zip: "10001" }
              as: Underwriter
              captures: { ph: $.data.id }
