              as: HerdManager
              captures: { mvn1: $.data.id }
            - call: "GET /animals/${an1}"
              as: HerdManager
              captures: { an1_v: $.data.version }
            - call: "POST /movement-records/${mvn1}/apply"
              payload: { expected_animal_version: "${an1_v}" }
              as: HerdManager
            - call: "POST /animals"
              payload: { herd_id: "${herd15}", ear_tag: "N002", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
