      - name: deposit_prepare_with_a_stale_safe_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[deposit-prepare-stale-safe]
          - validations[priority=68]
          - errors[ERR_SAFE_VERSION_STALE]
        distinguishing_aspect: >
          The OCC guard is the only thing that stops the second bag: the safe is still UNLOCKED and a
          second preparation is a legal product action, so replaying the version read before bag A was
          prepared yields 412 ERR_SAFE_VERSION_STALE rather than any state or balance error.
        test_recipe:
          setup:
            - "Store S-1980, MANUAL safe SAFE-A (500000), journal 2026-08-03, safe UNLOCKED, version captured BEFORE the first bag"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
