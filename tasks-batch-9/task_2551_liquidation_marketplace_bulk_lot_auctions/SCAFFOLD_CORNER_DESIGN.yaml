          trigger:
            - call: "POST /liquidation/listings/${lst1}/bids"
              payload: { buyer_id: "${ba}", amount_cents: 1000000 }
              as: Buyer
              as_user_id: "${ba}"
            - call: "GET /liquidation/recovery-analytics"
              payload: { seller_id: "${s1}" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { rate_at_threshold: "$.data.gross_recovery_rate" }
            - call: "POST /liquidation/listings/${lst2}/publications"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
            - call: "GET /liquidation/recovery-analytics"
              payload: { seller_id: "${s1}" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { rate_below_threshold: "$.data.gross_recovery_rate" }
            - call: "GET /liquidation/seller-accounts/${s1}"
              payload: {}
