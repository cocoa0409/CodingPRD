              as: ClauseLibrarian
              captures: { mand_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "OTHER1", category: "OTHER", standard_text: "s", risk_weight: 0, is_mandatory: false }
              as: ClauseLibrarian
              captures: { opt_id: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "T", clause_template_ids: ["${mand_id}","${opt_id}"], default_term_months: 12, auto_renew_default: false }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "CP", title: "P2", term_months: 12, auto_renew: false }
              as: ContractManager
              as_user_id: "mgr-1"
