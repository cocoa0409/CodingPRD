            - { call: "POST /compliance/employees", payload: { employee_no: "E-E4", full_name: "Eff Four", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { e4: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${e1}" }, as: ComplianceAdmin, captures: { a1: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${a1}/completions", payload: { score_pct: 90, evidence_type: "NONE" }, as: Employee, as_user_id: "${e1}", captures: { c1: "$.data.id" } }
            - { call: "POST /compliance/completions/${c1}/accept", payload: {}, as: ComplianceAdmin }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${e2}" }, as: ComplianceAdmin, captures: { a2: "$.data[0].id" } }
