            - "COMPENSATION 2: Part.${p_door_id}.field_failure_count == 0 and cohort_failure_rate_per_1000 == 0.00, exactly the pre-analysis values"
            - "COMPENSATION 3: Supplier.${sup1_id}.quality_penalty_count == 0 and on_time_score == 100.00 (90.00 + 10, capped at 100.00) with status APPROVED"
            - "WarrantyReturn.${wr1_id}.engineering_change_id is null and GET /engineering-changes?source_warranty_return_id=${wr1_id} returns total_count == 0 — the supplier branch minted nothing, so there is nothing to cancel"
            - "Part.${p_door_id}.lifecycle_status == ACTIVE and ProductionUnit.${unit1_id}.assembly_status == SHIPPED are untouched by the withdrawal"
