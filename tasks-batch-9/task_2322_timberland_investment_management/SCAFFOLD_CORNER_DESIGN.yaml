          Over-cutting a block by one hundredth of a ton must be refused: 1000.01 against a 1000.00
          plan is 422 ERR_ACTUAL_TONS_EXCEED_PLANNED, while exactly 1000.00 completes. The boundary
          matters because the final revenue variant and the fund credit are both driven off
          actual_tons, so a tolerant check leaks unreserved volume into the ledger.
