            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-05-15T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /offers"
              payload: { program_id: "${prog_id}", debt_id: "${debt_id}", offer_pct: 0.40, due_date: "2026-12-31T00:00:00Z" }
