        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations.priority_1_ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          Authentication is the first gate in the ladder, so an absent or
          empty-string X-User-ID is rejected with 401 ERR_UNAUTHENTICATED before
          any role, shape, path-lookup or state rule runs — proven by sending a
          request that would otherwise fail three later rules at once (unknown
          jobsite id, unknown enum, negative footage) and still receiving 401.
          Reads are gated identically to writes.
