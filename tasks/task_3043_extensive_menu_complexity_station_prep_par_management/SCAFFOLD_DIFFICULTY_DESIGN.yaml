  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: bakery_confirm_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - errors.ERR_BAKERY_ORDER_INVALID_STATE
          - errors.ERR_BAKERY_BUDGET_EXCEEDED
        distinguishing_aspect: |
          Category pair (state, business_fiscal): confirming a DRAFT bakery order
          whose amount (100 cakes x 2500 = 250000 cents) also exceeds the 100000
          budget returns ERR_BAKERY_ORDER_INVALID_STATE (priority 5), never
          ERR_BAKERY_BUDGET_EXCEEDED (priority 12).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant with weekly_bakery_budget_cents 100000."
            - "BakeryOrder of 100 SEASONAL cakes still in DRAFT (never submitted)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["BAKERY"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Pat Pastry", certified_station_types: ["BAKERY"] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { pastry_id: $.data.id }
            - call: "POST /api/bakery-orders"
              payload: { restaurant_id: "${rest_id}", cheesecake_type: "SEASONAL", whole_cakes_ordered: 100 }
              as: PastryChef
              as_user_id: "${pastry_id}"
              captures: { bo_id: $.data.id }
          trigger:
            - call: "POST /api/bakery-orders/${bo_id}/confirm"
              payload: {}
              as: InventoryController
              as_user_id: "ic-dana"
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 409 and error_id == ERR_BAKERY_ORDER_INVALID_STATE"
            - "The response is NOT ERR_BAKERY_BUDGET_EXCEEDED even though 100 x 2500 == 250000 > 100000"
            - "BakeryOrder.${bo_id}.status == DRAFT and Restaurant.${rest_id}.weekly_bakery_budget_spent_cents == 0"

      - name: shift_certification_beats_overlap
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors.ERR_COOK_NOT_CERTIFIED
          - errors.ERR_SHIFT_OVERLAP
        distinguishing_aspect: |
          Category pair (business_constraint, business_temporal): a new
          assignment whose cook is not certified for the station AND whose
          interval overlaps an existing assignment returns
          ERR_COOK_NOT_CERTIFIED (priority 8), never ERR_SHIFT_OVERLAP
          (priority 9). Different category pair from the bakery state/fiscal
          conflict.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant; cook certified for [SAUTE] only."
            - "SAUTE station and GRILL station both exist."
            - "Cook already holds assignment 2026-09-02T08:00:00Z-12:00:00Z at the SAUTE station."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["SAUTE"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Chris Cook", certified_station_types: ["SAUTE"] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { cook_id: $.data.id }
            - call: "POST /api/stations"
              payload: { restaurant_id: "${rest_id}", name: "Saute 1", station_type: "SAUTE", rack_slot_capacity: 100 }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { st_saute: $.data.id }
            - call: "POST /api/stations"
              payload: { restaurant_id: "${rest_id}", name: "Grill 1", station_type: "GRILL", rack_slot_capacity: 100 }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { st_grill: $.data.id }
            - call: "POST /api/shift-assignments"
              payload: { cook_id: "${cook_id}", station_id: "${st_saute}", shift_start: "2026-09-02T08:00:00Z", shift_end: "2026-09-02T12:00:00Z" }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /api/shift-assignments"
              payload: { cook_id: "${cook_id}", station_id: "${st_grill}", shift_start: "2026-09-02T11:00:00Z", shift_end: "2026-09-02T13:00:00Z" }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 422 and error_id == ERR_COOK_NOT_CERTIFIED"
            - "The response is NOT ERR_SHIFT_OVERLAP even though 11:00-13:00 intersects 08:00-12:00"
            - "GET /api/shift-assignments?cook_id=${cook_id} returns exactly 1 row"

