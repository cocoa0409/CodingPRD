            - "${mid_locked_at} == null"
            - "the creating officer's lock returns 200 with ${ok_status} == LOCKED"
            - "${ok_elig} == 3"

      - name: first_flag_leaves_post_published_second_flag_moves_it_to_flagged
        claim_type: valid_transition
        grounds:
          - state_machines.ResidentPost.state.PUBLISHED_to_FLAGGED
          - endpoints[POST /neighborhood-safety/resident-posts/{id}/flag]
          - entities.ResidentPost.fields.flag_count
          - entities.ResidentPost.fields.auto_flag_reason
        distinguishing_aspect: "The PUBLISHED -> FLAGGED edge fires only on the flag that pushes flag_count to the RESIDENT_FLAG_THRESHOLD of 2: after one flag the post is still PUBLISHED with flag_count 1 and auto_flag_reason null, and after the second it is FLAGGED with auto_flag_reason RESIDENT_FLAG_THRESHOLD."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; three residents (author A, flaggers F1 and F2) all with alert_radius_m 0 so no alert fan-out occurs; A has published one SAFETY_REPORT post with all four classifier signals 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Author A", email: "authora@example.test", home_x_m: 0, home_y_m: 0, alert_radius_m: 0 }
              as: Anonymous
              captures: { a_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Flagger One", email: "f1@example.test", home_x_m: 10, home_y_m: 0, alert_radius_m: 0 }
              as: Anonymous
              captures: { f1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Flagger Two", email: "f2@example.test", home_x_m: 20, home_y_m: 0, alert_radius_m: 0 }
              as: Anonymous
              captures: { f2_id: "$.data.id" }
            - call: "POST /neighborhood-safety/resident-posts"
              payload: { author_resident_id: "${a_id}", body: "A parked van has been idling outside the corner shop since Tuesday morning.", category: "SUSPICIOUS_ACTIVITY", post_x_m: 0, post_y_m: 0 }
              as: Resident
              as_user_id: "${a_id}"
              captures: { post_id: "$.data.id", p_state0: "$.data.state", p_score: "$.data.discrimination_score", p_v0: "$.data.version" }
          trigger:
            - call: "POST /neighborhood-safety/resident-posts/${post_id}/flag"
              payload: { flag_reason: "I believe this description is inaccurate." }
              as: Resident
              as_user_id: "${f1_id}"
              captures: { p_state1: "$.data.state", p_count1: "$.data.flag_count", p_reason1: "$.data.auto_flag_reason", p_v1: "$.data.version" }
            - call: "POST /neighborhood-safety/resident-posts/${post_id}/flag"
              payload: { flag_reason: "Second resident disputes the account." }
              as: Resident
              as_user_id: "${f2_id}"
              captures: { p_state2: "$.data.state", p_count2: "$.data.flag_count", p_reason2: "$.data.auto_flag_reason", p_v2: "$.data.version" }
          assert:
            - "${p_state0} == PUBLISHED"
            - "${p_score} == 0.00"
            - "the first flag returns 200"
            - "${p_state1} == PUBLISHED"
            - "${p_count1} == 1"
            - "${p_reason1} == null"
            - "${p_v1} == 2"
            - "the second flag returns 200"
            - "${p_state2} == FLAGGED"
            - "${p_count2} == 2"
            - "${p_reason2} == RESIDENT_FLAG_THRESHOLD"
            - "${p_v2} == 3"
            - "Resident.${a_id}.accuracy_strike_count == 0 and Resident.${a_id}.post_privilege_state == UNRESTRICTED"

      - name: agency_status_change_from_rejected_is_rejected
        claim_type: invalid_transitions
        grounds:
          - validations[priority=10]
          - errors.ERR_AGENCY_STATUS_TRANSITION_INVALID
          - state_machines.Agency.status.PENDING_REVIEW_to_REJECTED
          - endpoints[POST /neighborhood-safety/agencies/{id}/status-change]
        distinguishing_aspect: "REJECTED is terminal and is not a legal source for any status-change: a SUSPENDED target from REJECTED returns 409 ERR_AGENCY_STATUS_TRANSITION_INVALID, a second onboarding review returns the same error, and the agency's status and version are unchanged by either attempt."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; one agency has been rejected at onboarding, so its status is REJECTED and its version is 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/agencies"
              payload: { name: "Declined Constabulary", jurisdiction_code: "DC-001" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_id: "$.data.id" }
            - call: "POST /neighborhood-safety/agencies/${ag_id}/onboarding-review"
              payload: { decision: "REJECT", reviewer_note: "No MOU and no CJIS attestation." }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_status: "$.data.status", ag_v: "$.data.version" }
          trigger:
            - call: "POST /neighborhood-safety/agencies/${ag_id}/status-change"
              payload: { target_status: "SUSPENDED", reason: "Attempting to discipline a rejected applicant." }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err1: "$.data.error_id" }
            - call: "POST /neighborhood-safety/agencies/${ag_id}/onboarding-review"
              payload: { decision: "APPROVE", reviewer_note: "Second look.", onboarding_agreement_version: "MOU-2026.3" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err2: "$.data.error_id" }
            - call: "GET /neighborhood-safety/agencies/${ag_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_status2: "$.data.status", ag_v2: "$.data.version" }
          assert:
            - "${ag_status} == REJECTED and ${ag_v} == 2"
            - "the status-change attempt returns 409 with ${err1} == ERR_AGENCY_STATUS_TRANSITION_INVALID"
            - "the second onboarding review returns 409 with ${err2} == ERR_AGENCY_STATUS_TRANSITION_INVALID"
            - "${ag_status2} == REJECTED"
            - "${ag_v2} == 2"

      - name: video_request_two_dimensions_advance_independently
        claim_type: valid_transition
        grounds:
          - state_machines.VideoRequest.lifecycle_state
          - state_machines.VideoRequest.compliance_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / video_request_lifecycle_and_compliance_dimensions_advance_independently
          rationale: "That instance walks both declared dimensions of VideoRequest through their full paths and asserts each state pair, which is the parallel-shape claim in full."

  # ===========================================================================
  - section: calculations
    instances:
      - name: eligible_device_roster_excludes_offline_auto_decline_and_opted_out
        claim_type: input_set_filtering
        grounds:
          - calculations.eligible_device_set
          - endpoints[POST /neighborhood-safety/request-areas/{id}/lock]
          - entities.RequestArea.fields.eligible_device_count
          - entities.Device.fields.auto_decline_requests
        distinguishing_aspect: "Six cameras sit inside the same disc but only three enter the frozen roster: an OFFLINE device, a device with auto_decline_requests true, and a device whose owner set data_sharing_opt_out are each excluded by a different clause of the input set, so a count of 4, 5 or 6 each identifies which clause was dropped."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; agency ONBOARDED with min_device_threshold 3; officer O1 REQUESTER."
            - "Six residents each own one camera inside the (0,0) radius-500 disc: D1 (0,10) ACTIVE, D2 (0,20) ACTIVE, D3 (0,30) ACTIVE, D4 (0,40) patched to OFFLINE, D5 (0,50) with auto_decline_requests true, D6 (0,60) whose owner filed an OPT_OUT_OF_REQUESTS data-control action."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/agencies"
              payload: { name: "Riverbend Police Department", jurisdiction_code: "RB-001", min_device_threshold: 3, max_open_requests: 3, period_request_quota: 20, post_share_retention_days: 30, justification_min_chars: 80 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_id: "$.data.id" }
            - call: "POST /neighborhood-safety/agencies/${ag_id}/onboarding-review"
              payload: { decision: "APPROVE", reviewer_note: "MOU on file.", onboarding_agreement_version: "MOU-2026.3" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/officers"
              payload: { agency_id: "${ag_id}", badge_number: "B-100", full_name: "Officer Vale", duty_role: "REQUESTER" }
              as: AgencyAdmin
              as_user_id: "${ag_id}"
              captures: { off_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R1", email: "r1@example.test", home_x_m: 0, home_y_m: 10, alert_radius_m: 0 }
              as: Anonymous
              captures: { r1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R2", email: "r2@example.test", home_x_m: 0, home_y_m: 20, alert_radius_m: 0 }
              as: Anonymous
              captures: { r2_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R3", email: "r3@example.test", home_x_m: 0, home_y_m: 30, alert_radius_m: 0 }
              as: Anonymous
              captures: { r3_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R4", email: "r4@example.test", home_x_m: 0, home_y_m: 40, alert_radius_m: 0 }
              as: Anonymous
              captures: { r4_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R5", email: "r5@example.test", home_x_m: 0, home_y_m: 50, alert_radius_m: 0 }
              as: Anonymous
              captures: { r5_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R6", email: "r6@example.test", home_x_m: 0, home_y_m: 60, alert_radius_m: 0 }
              as: Anonymous
              captures: { r6_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", label: "D1", grid_x_m: 0, grid_y_m: 10, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r2_id}", label: "D2", grid_x_m: 0, grid_y_m: 20, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r2_id}"
              captures: { d2_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r3_id}", label: "D3", grid_x_m: 0, grid_y_m: 30, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r3_id}"
              captures: { d3_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r4_id}", label: "D4", grid_x_m: 0, grid_y_m: 40, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r4_id}"
              captures: { d4_id: "$.data.id" }
            - call: "PATCH /neighborhood-safety/devices/${d4_id}"
              payload: { status: "OFFLINE" }
              as: Resident
              as_user_id: "${r4_id}"
              captures: { d4_status: "$.data.status" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r5_id}", label: "D5", grid_x_m: 0, grid_y_m: 50, retention_window_days: 30, auto_decline_requests: true }
              as: Resident
              as_user_id: "${r5_id}"
              captures: { d5_id: "$.data.id", d5_auto: "$.data.auto_decline_requests" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r6_id}", label: "D6", grid_x_m: 0, grid_y_m: 60, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r6_id}"
              captures: { d6_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents/${r6_id}/data-controls"
              payload: { action_type: "OPT_OUT_OF_REQUESTS", reason: "I do not want my camera solicited." }
              as: Resident
              as_user_id: "${r6_id}"
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 0, center_y_m: 0, radius_m: 500, window_start_utc: "2026-08-08T00:00:00Z", window_end_utc: "2026-08-08T06:00:00Z", area_label: "400 Block" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { area_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood-safety/request-areas/${area_id}/lock"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
              captures: { area_elig: "$.data.eligible_device_count", area_min: "$.data.effective_min_devices", area_status: "$.data.status", area_v: "$.data.version" }
            - call: "POST /neighborhood-safety/video-requests"
              payload: { request_area_id: "${area_id}", case_number: "CASE-1003", expected_request_area_version: "${area_v}" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { vr_id: "$.data.id" }
            - call: "POST /neighborhood-safety/video-requests/${vr_id}/justification"
              payload: { justification_text: "Repeated vehicle break-ins reported overnight on the 400 block; footage sought to identify a suspect vehicle described by three separate complainants.", statutory_basis: "Municipal Code 12.44" }
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /neighborhood-safety/video-requests/${vr_id}/submit"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
              captures: { vr_sols: "$.data.solicitation_count" }
          assert:
            - "${d4_status} == OFFLINE"
            - "${d5_auto} == true"
            - "Resident.${r6_id}.data_sharing_opt_out == true"
            - "Device.${d6_id}.auto_decline_requests == true and Device.${d6_id}.auto_decline_source == OPT_OUT"
            - "the lock returns 200 with ${area_status} == LOCKED"
            - "${area_elig} == 3 — not 6, not 5 and not 4"
            - "${area_min} == 3"
            - "the submit returns 200 with ${vr_sols} == 3"
            - "the three ConsentSolicitation rows name device_id ${d1_id}, ${d2_id} and ${d3_id} with dispatch_rank 1, 2 and 3 in that order"
            - "no ConsentSolicitation row names ${d4_id}, ${d5_id} or ${d6_id}"
            - "Device.${d4_id}.pending_solicitation_count == 0 and Device.${d5_id}.pending_solicitation_count == 0 and Device.${d6_id}.pending_solicitation_count == 0"

      - name: post_alert_fanout_cap_truncates_tail_and_never_alerts_author
        claim_type: correct_result
        grounds:
          - calculations.post_alert_fanout
          - entities.ResidentPost.fields.alert_candidate_count
          - entities.ResidentPost.fields.alert_fanout_count
          - endpoints[POST /neighborhood-safety/resident-posts]
        distinguishing_aspect: "The recipient's own alert_radius_m decides candidacy, the author is never a candidate even though the post sits at their own address, and alert_fanout_cap 1 truncates the TAIL of the nearest-first ordering — so alert_candidate_count is 2 while alert_fanout_count is 1 and the sum of fanout plus suppressed equals the cap, not the candidate count."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; author A lives at (0,0) with alert_radius_m 800; N1 at (0,10) and N2 at (0,20) both have alert_radius_m 800; F1 at (0,30) has alert_radius_m 0 so the post is outside its own disc."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Author A", email: "authora@example.test", home_x_m: 0, home_y_m: 0, alert_radius_m: 800, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { a_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Near One", email: "n1@example.test", home_x_m: 0, home_y_m: 10, alert_radius_m: 800, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Near Two", email: "n2@example.test", home_x_m: 0, home_y_m: 20, alert_radius_m: 800, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { n2_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Far One", email: "f1@example.test", home_x_m: 0, home_y_m: 30, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { f1_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood-safety/resident-posts"
              payload: { author_resident_id: "${a_id}", body: "Two bicycles were taken from the shared rack behind the building last night.", category: "SAFETY_REPORT", post_x_m: 0, post_y_m: 0, alert_fanout_cap: 1 }
              as: Resident
              as_user_id: "${a_id}"
              captures: { post_id: "$.data.id", p_cand: "$.data.alert_candidate_count", p_fan: "$.data.alert_fanout_count", p_sup: "$.data.alert_suppressed_count", p_state: "$.data.state" }
          assert:
            - "the response status code is 201 and ${p_state} == PUBLISHED"
            - "${p_cand} == 2 — N1 and N2 only; the author is excluded and F1's own radius of 0 excludes it"
            - "${p_fan} == 1"
            - "${p_sup} == 0"
            - "${p_fan} + ${p_sup} == min(${p_cand}, 1) == 1"
            - "exactly one NotificationDispatch row exists for ResidentPost ${post_id} and its recipient_resident_id is ${n1_id}, the nearer candidate"
            - "Resident.${n1_id}.notifications_sent_today == 1"
            - "Resident.${n2_id}.notifications_sent_today == 0 and Resident.${f1_id}.notifications_sent_today == 0"
            - "Resident.${a_id}.notifications_sent_today == 0"

      - name: effective_min_devices_correct_result_over_known_inputs
        claim_type: correct_result
        grounds:
          - calculations.effective_min_device_threshold
        excluded_because:
          difficulty_instance: combinatorial_formula / effective_min_devices_nested_bumps_cap_and_global_floor
          rationale: "That instance locks four areas with different radius/window pairs and asserts each effective_min_devices literal (3, 7, 11, 3), which is the correct-result claim for this rule at every branch."

      - name: effective_min_devices_constants_applied
        claim_type: constants_applied
        grounds:
          - calculations.effective_min_device_threshold.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / effective_min_devices_nested_bumps_cap_and_global_floor
          rationale: "The same instance exercises GLOBAL_MIN_DEVICE_FLOOR, all three RADIUS_BUMP tiers, WINDOW_BLOCK_HOURS and WINDOW_BUMP_CAP; a wrong constant changes at least one of its four asserted literals."

      - name: discrimination_score_precision_and_rounding_mode
        claim_type: precision
        grounds:
          - calculations.post_discrimination_score
        excluded_because:
          difficulty_instance: combinatorial_formula / discrimination_score_per_term_rounding_beats_sum_rounding
          rationale: "That instance is built precisely so per-term ROUND_HALF_UP at 2 decimals and sum-then-round disagree across the 0.49 threshold, which is the precision claim in its sharpest form."

      - name: eligible_device_disc_boundary_is_inclusive
        claim_type: precision
        grounds:
          - calculations.eligible_device_set.precision
        excluded_because:
          difficulty_instance: boundary_precision_check / eligible_device_disc_boundary_inclusive_at_exact_radius_squared
          rationale: "That instance places cameras at squared distances 250000 and 250801 against radius 500 and asserts the first is in the roster and the second is not, covering the inclusive-boundary precision claim."

      - name: share_rate_variants_diverge_on_identical_data
        claim_type: variant_divergence
        grounds:
          - calculations.share_rate_bps.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / share_rate_provisional_vs_certified_diverge_on_suppressed_share
          rationale: "That instance computes both variants over one solicitation population and asserts the two basis-point literals and their delta."

      - name: clip_retention_variant_selected_by_compliance_state
        claim_type: variant_selection
        grounds:
          - calculations.clip_retention_expiry.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / clip_retention_device_anchored_vs_case_anchored_diverge_on_escalation
          rationale: "That instance shares identical footage under a normal and an AUDIT_ESCALATED request and asserts DEVICE_ANCHORED min-of-three versus CASE_ANCHORED max-of-two, which is the selection claim."

      - name: share_rate_reconciles_after_a_share_is_revoked
        claim_type: reconciliation
        grounds:
          - calculations.share_rate_bps
          - state_machines.SharedClip.status.RETAINED_to_PURGED
        excluded_because:
          difficulty_instance: compensating_invariant / solicitation_cardinality_conserved_when_owner_revokes_a_share
          rationale: "That instance drives an owner revocation and asserts every counter and the recomputed share-rate literal on both sides of the reversal, so the reconciliation delta is already pinned."

  # ===========================================================================
  - section: validations
    instances:
      - name: post_flagged_by_its_own_author_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=41]
          - errors.ERR_SELF_FLAG_NOT_ALLOWED
          - endpoints[POST /neighborhood-safety/resident-posts/{id}/flag]
        distinguishing_aspect: "The author flagging their own post is refused with 409 ERR_SELF_FLAG_NOT_ALLOWED and leaves flag_count at 0 — the self-flag must not be counted toward the two-flag threshold, and the same post is still flaggable by a genuine neighbour afterwards."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; author A and neighbour N both exist with alert_radius_m 0; A has one PUBLISHED post."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Author A", email: "authora@example.test", home_x_m: 0, home_y_m: 0, alert_radius_m: 0 }
              as: Anonymous
              captures: { a_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Neighbour N", email: "n@example.test", home_x_m: 10, home_y_m: 0, alert_radius_m: 0 }
              as: Anonymous
              captures: { n_id: "$.data.id" }
            - call: "POST /neighborhood-safety/resident-posts"
              payload: { author_resident_id: "${a_id}", body: "The alley gate has been left unlatched every evening this week.", category: "SAFETY_REPORT", post_x_m: 0, post_y_m: 0 }
              as: Resident
              as_user_id: "${a_id}"
              captures: { post_id: "$.data.id", p_v0: "$.data.version" }
          trigger:
            - call: "POST /neighborhood-safety/resident-posts/${post_id}/flag"
              payload: { flag_reason: "Flagging my own post to test the guard." }
              as: Resident
              as_user_id: "${a_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /neighborhood-safety/resident-posts/${post_id}"
              payload: {}
              as: Resident
              as_user_id: "${a_id}"
              captures: { p_count: "$.data.flag_count", p_state: "$.data.state", p_v1: "$.data.version" }
            - call: "POST /neighborhood-safety/resident-posts/${post_id}/flag"
              payload: { flag_reason: "Neighbour disputes the account." }
              as: Resident
              as_user_id: "${n_id}"
              captures: { ok_count: "$.data.flag_count", ok_state: "$.data.state" }
          assert:
            - "the self-flag returns 409 with ${err_id} == ERR_SELF_FLAG_NOT_ALLOWED"
            - "${p_count} == 0"
            - "${p_state} == PUBLISHED"
            - "${p_v1} == ${p_v0}"
            - "the neighbour's flag returns 200 with ${ok_count} == 1 and ${ok_state} == PUBLISHED"

      - name: same_resident_flagging_twice_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=42]
          - errors.ERR_DUPLICATE_FLAG
          - entities.ResidentPost.fields.flagged_by_resident_ids
        distinguishing_aspect: "flagged_by_resident_ids is a set, not a tally: the same neighbour's second flag returns 409 ERR_DUPLICATE_FLAG and flag_count stays at 1, so one determined resident can never drive a post to the two-flag FLAGGED threshold alone."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; author A and neighbour N1 exist with alert_radius_m 0; A has one PUBLISHED post that N1 has already flagged once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Author A", email: "authora@example.test", home_x_m: 0, home_y_m: 0, alert_radius_m: 0 }
              as: Anonymous
              captures: { a_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Neighbour One", email: "n1@example.test", home_x_m: 10, home_y_m: 0, alert_radius_m: 0 }
              as: Anonymous
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/resident-posts"
              payload: { author_resident_id: "${a_id}", body: "A stranger has been photographing parked cars on the block each morning.", category: "SUSPICIOUS_ACTIVITY", post_x_m: 0, post_y_m: 0 }
              as: Resident
              as_user_id: "${a_id}"
              captures: { post_id: "$.data.id" }
            - call: "POST /neighborhood-safety/resident-posts/${post_id}/flag"
              payload: { flag_reason: "This description is inaccurate." }
              as: Resident
              as_user_id: "${n1_id}"
              captures: { first_count: "$.data.flag_count", first_v: "$.data.version" }
          trigger:
            - call: "POST /neighborhood-safety/resident-posts/${post_id}/flag"
              payload: { flag_reason: "Flagging again to be sure." }
              as: Resident
              as_user_id: "${n1_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /neighborhood-safety/resident-posts/${post_id}"
              payload: {}
              as: Resident
              as_user_id: "${n1_id}"
              captures: { p_count: "$.data.flag_count", p_state: "$.data.state", p_v: "$.data.version" }
          assert:
            - "${first_count} == 1"
            - "the repeat flag returns 409 with ${err_id} == ERR_DUPLICATE_FLAG"
            - "${p_count} == 1"
            - "${p_state} == PUBLISHED"
            - "${p_v} == ${first_v}"
            - "ResidentPost.${post_id}.flagged_by_resident_ids contains ${n1_id} exactly once"

      - name: second_device_at_identical_grid_point_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=43]
          - errors.ERR_DUPLICATE_DEVICE_LOCATION
          - endpoints[POST /neighborhood-safety/devices]
        distinguishing_aspect: "The uniqueness key is (owner, grid_x_m, grid_y_m) and it ignores DECOMMISSIONED rows: a second camera at the owner's existing coordinates is refused with 409, one metre away is accepted, and after the original is decommissioned the exact coordinates become available again."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; resident R1 owns one ACTIVE camera at (0,10); resident R2 also owns a camera at (0,10) to prove the constraint is per-owner."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R1", email: "r1@example.test", home_x_m: 0, home_y_m: 10, alert_radius_m: 0 }
              as: Anonymous
              captures: { r1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R2", email: "r2@example.test", home_x_m: 0, home_y_m: 10, alert_radius_m: 0 }
              as: Anonymous
              captures: { r2_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", label: "Front door", grid_x_m: 0, grid_y_m: 10, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { d1_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", label: "Front door spare", grid_x_m: 0, grid_y_m: 10, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r2_id}", label: "Neighbour front door", grid_x_m: 0, grid_y_m: 10, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r2_id}"
              captures: { other_owner_dev: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", label: "Side gate", grid_x_m: 1, grid_y_m: 10, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { near_dev: "$.data.id" }
            - call: "PATCH /neighborhood-safety/devices/${d1_id}"
              payload: { status: "DECOMMISSIONED" }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { d1_status: "$.data.status" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", label: "Front door replacement", grid_x_m: 0, grid_y_m: 10, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { replacement_dev: "$.data.id" }
          assert:
            - "the co-located duplicate returns 409 with ${err_id} == ERR_DUPLICATE_DEVICE_LOCATION"
            - "the other owner's camera at the same coordinates returns 201 and ${other_owner_dev} is not null"
            - "the one-metre-away camera returns 201 and ${near_dev} is not null"
            - "${d1_status} == DECOMMISSIONED"
            - "the replacement at the freed coordinates returns 201 and ${replacement_dev} is not null"
            - "Resident.${r1_id} now owns three Device rows, exactly one of which is DECOMMISSIONED"

      - name: area_radius_above_limit_returns_422
        claim_type: violation_to_error
        grounds:
          - validations[priority=37]
          - errors.ERR_AREA_RADIUS_EXCEEDS_LIMIT
          - endpoints[POST /neighborhood-safety/request-areas]
        distinguishing_aspect: "AREA_MAX_RADIUS_M 1500 is an inclusive cap enforced at creation, before any device is consulted: radius 1501 returns 422 ERR_AREA_RADIUS_EXCEEDS_LIMIT even though the disc would be empty, and no RequestArea row is created."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; agency ONBOARDED; officer O1 REQUESTER; no devices at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/agencies"
              payload: { name: "Riverbend Police Department", jurisdiction_code: "RB-001", min_device_threshold: 3 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_id: "$.data.id" }
            - call: "POST /neighborhood-safety/agencies/${ag_id}/onboarding-review"
              payload: { decision: "APPROVE", reviewer_note: "MOU on file.", onboarding_agreement_version: "MOU-2026.3" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/officers"
              payload: { agency_id: "${ag_id}", badge_number: "B-100", full_name: "Officer Vale", duty_role: "REQUESTER" }
              as: AgencyAdmin
              as_user_id: "${ag_id}"
              captures: { off_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 0, center_y_m: 0, radius_m: 1501, window_start_utc: "2026-08-08T00:00:00Z", window_end_utc: "2026-08-08T06:00:00Z", area_label: "Whole district" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", limit: 10, offset: 0 }
              as: Officer
              as_user_id: "${off_id}"
              captures: { total: "$.meta.total_count" }
          assert:
            - "the response status code is 422 with ${err_id} == ERR_AREA_RADIUS_EXCEEDS_LIMIT"
            - "${total} == 0 — the rejected request created no RequestArea row"

      - name: area_window_end_in_the_future_returns_422
        claim_type: violation_to_error
        grounds:
          - validations[priority=34]
          - errors.ERR_INVALID_WINDOW
          - endpoints[POST /neighborhood-safety/request-areas]
        distinguishing_aspect: "Rule 34 has three separate legs on a RequestArea; this one pins the clock leg — a window whose end is one second past the logical clock is refused with 422 ERR_INVALID_WINDOW even though start < end and the span is well under 168 hours."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; agency ONBOARDED; officer O1 REQUESTER."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/agencies"
              payload: { name: "Riverbend Police Department", jurisdiction_code: "RB-001", min_device_threshold: 3 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_id: "$.data.id" }
            - call: "POST /neighborhood-safety/agencies/${ag_id}/onboarding-review"
              payload: { decision: "APPROVE", reviewer_note: "MOU on file.", onboarding_agreement_version: "MOU-2026.3" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/officers"
              payload: { agency_id: "${ag_id}", badge_number: "B-100", full_name: "Officer Vale", duty_role: "REQUESTER" }
              as: AgencyAdmin
              as_user_id: "${ag_id}"
              captures: { off_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 0, center_y_m: 0, radius_m: 500, window_start_utc: "2026-08-11T18:00:00Z", window_end_utc: "2026-08-12T00:00:01Z", area_label: "One second too far" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 0, center_y_m: 0, radius_m: 500, window_start_utc: "2026-08-11T18:00:00Z", window_end_utc: "2026-08-12T00:00:00Z", area_label: "Ends exactly at now" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ok_id: "$.data.id", ok_status: "$.data.status" }
          assert:
            - "the future-ending window returns 422 with ${err_id} == ERR_INVALID_WINDOW"
            - "the window ending exactly at the clock returns 201 — the leg is 'at or before', not 'strictly before'"
            - "${ok_status} == DRAFT and ${ok_id} is not null"

      - name: invalid_window_rule_34_beats_radius_rule_37
        claim_type: priority_ordering
        grounds:
          - validations[priority=34]
          - validations[priority=37]
          - errors.ERR_INVALID_WINDOW
          - errors.ERR_AREA_RADIUS_EXCEEDS_LIMIT
        distinguishing_aspect: "One creation violates both rule 34 (window ends after the clock) and rule 37 (radius 1600 > 1500); the lower priority number must win, so the answer is ERR_INVALID_WINDOW — and repairing only the window then exposes ERR_AREA_RADIUS_EXCEEDS_LIMIT, proving the ordering rather than a coincidence."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; agency ONBOARDED; officer O1 REQUESTER."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/agencies"
              payload: { name: "Riverbend Police Department", jurisdiction_code: "RB-001", min_device_threshold: 3 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_id: "$.data.id" }
            - call: "POST /neighborhood-safety/agencies/${ag_id}/onboarding-review"
              payload: { decision: "APPROVE", reviewer_note: "MOU on file.", onboarding_agreement_version: "MOU-2026.3" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/officers"
              payload: { agency_id: "${ag_id}", badge_number: "B-100", full_name: "Officer Vale", duty_role: "REQUESTER" }
              as: AgencyAdmin
              as_user_id: "${ag_id}"
              captures: { off_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 0, center_y_m: 0, radius_m: 1600, window_start_utc: "2026-08-11T18:00:00Z", window_end_utc: "2026-08-13T00:00:00Z", area_label: "Both rules broken" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { err_both: "$.data.error_id" }
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 0, center_y_m: 0, radius_m: 1600, window_start_utc: "2026-08-11T18:00:00Z", window_end_utc: "2026-08-12T00:00:00Z", area_label: "Radius still too wide" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { err_radius: "$.data.error_id" }
          assert:
            - "the double violation returns 422 with ${err_both} == ERR_INVALID_WINDOW"
            - "${err_both} != ERR_AREA_RADIUS_EXCEEDS_LIMIT"
            - "the window-repaired attempt returns 422 with ${err_radius} == ERR_AREA_RADIUS_EXCEEDS_LIMIT"
            - "neither attempt created a RequestArea row for Agency ${ag_id}"

      - name: area_at_maximum_radius_and_maximum_window_passes
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=34]
          - validations[priority=37]
          - endpoints[POST /neighborhood-safety/request-areas]
          - calculations.effective_min_device_threshold
        distinguishing_aspect: "Both caps are inclusive: radius exactly 1500 with a window of exactly 168 hours ending exactly at the clock is accepted with 201, and the lock then stamps effective_min_devices 3 + 5 + 3 = 11 — the window bump is capped at 3 rather than the raw 13."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; agency ONBOARDED with min_device_threshold 3; officer O1 REQUESTER; no devices exist, which is legal because the threshold is only enforced at submit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/agencies"
              payload: { name: "Riverbend Police Department", jurisdiction_code: "RB-001", min_device_threshold: 3 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_id: "$.data.id" }
            - call: "POST /neighborhood-safety/agencies/${ag_id}/onboarding-review"
              payload: { decision: "APPROVE", reviewer_note: "MOU on file.", onboarding_agreement_version: "MOU-2026.3" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/officers"
              payload: { agency_id: "${ag_id}", badge_number: "B-100", full_name: "Officer Vale", duty_role: "REQUESTER" }
              as: AgencyAdmin
              as_user_id: "${ag_id}"
              captures: { off_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 0, center_y_m: 0, radius_m: 1500, window_start_utc: "2026-08-05T00:00:00Z", window_end_utc: "2026-08-12T00:00:00Z", area_label: "Both caps at their limit" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { area_id: "$.data.id", area_radius: "$.data.radius_m", area_status: "$.data.status" }
            - call: "POST /neighborhood-safety/request-areas/${area_id}/lock"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
              captures: { area_min: "$.data.effective_min_devices", area_elig: "$.data.eligible_device_count" }
          assert:
            - "the creation returns 201"
            - "${area_radius} == 1500"
            - "${area_status} == DRAFT"
            - "the lock returns 200"
            - "${area_min} == 11"
