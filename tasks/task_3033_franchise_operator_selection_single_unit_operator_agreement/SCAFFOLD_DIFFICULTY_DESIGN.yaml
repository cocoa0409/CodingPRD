  # Rule 9 — compensating_invariant: different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: operator_suspend_reinstate_restores_agreement_executed
        grounds:
          - state_machines.Operator.ACTIVE_to_SUSPENDED
          - state_machines.Operator.SUSPENDED_to_ACTIVE
          - state_machines.OperatorAgreement
        distinguishing_aspect: |
          Conserved quantity = agreement executability: an ACTIVE operator with
          an EXECUTED agreement, suspended then reinstated, must return the
