              as: IntakeCoordinator
              captures: { ta_a: $.data.id, af_a: $.data.altitude_factor, el_a: $.data.effective_lpm, base_a: $.data.base_liters, res_a: $.data.reserve_liters, req_a: $.data.required_liters, raw_a: $.data.cylinders_raw, auth_a: $.data.supply_cylinders_authorized }
            - call: "GET /home-oxygen/rental-contracts/${c_id}"
              payload: {}
              as: BillingSpecialist
              captures: { cv2: $.data.version }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { destination_altitude_feet: 4501, depart_utc: "2026-08-04T00:00:00Z", return_utc: "2026-08-04T10:00:00Z", expected_contract_version: "${cv2}" }
              as: IntakeCoordinator
              captures: { ta_b: $.data.id, af_b: $.data.altitude_factor, el_b: $.data.effective_lpm, base_b: $.data.base_liters, res_b: $.data.reserve_liters, req_b: $.data.required_liters, raw_b: $.data.cylinders_raw }
            - call: "GET /home-oxygen/rental-contracts/${c_id}"
              payload: {}
              as: BillingSpecialist
              captures: { cv3: $.data.version }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { destination_altitude_feet: 12000, depart_utc: "2026-08-06T00:00:00Z", return_utc: "2026-08-06T10:00:00Z", expected_contract_version: "${cv3}" }
              as: IntakeCoordinator
              captures: { ta_c: $.data.id, af_c: $.data.altitude_factor, el_c: $.data.effective_lpm, base_c: $.data.base_liters, res_c: $.data.reserve_liters, req_c: $.data.required_liters, raw_c: $.data.cylinders_raw, auth_c: $.data.supply_cylinders_authorized }
          assert:
            - "${af_a} == 1.12 and ${el_a} == 2.24: gain 4000 ft divides to exactly 4.0 and ceil leaves it at 4 steps of 0.03"
            - "${af_b} == 1.15 and ${el_b} == 2.30: one extra foot of gain (4001) pushes ceil(4.001) to 5 steps — the step function is on the ceiling of the quotient, not on the rounded quotient"
            - "${af_c} == 1.30 and ${el_c} == 2.60: gain 11500 would give 1.00 + 0.36 == 1.36, and ALTITUDE_FACTOR_MAX clamps it to 1.30"
            - "${base_a} == 1344, ${res_a} == 268, ${req_a} == 1612, ${raw_a} == 3, ${auth_a} == 3: trip_hours 10 is <= 24 so reserve_pct is 0.20, and floor(1344 x 0.20) == 268 discards the 0.8"
            - "${base_b} == 1380, ${res_b} == 276, ${req_b} == 1656, ${raw_b} == 3; ${base_c} == 1560, ${res_c} == 312, ${req_c} == 1872, ${raw_c} == 3, ${auth_c} == 3"
            - "usable_hours is 10 in all three cases: min(trip_hours 10, hours_per_day 24 x ceil(10 / 24) == 24) is the trip, not the daily allowance"
            - "handling_surcharge_cylinders is 0 on all three rows because cylinders_raw 3 is below the threshold of 6, and each authorization reports status REQUESTED"
            - "Each successful request increments RentalContract.version, which is why ${cv1}, ${cv2} and ${cv3} are re-read between calls"

