  - section: rbac
    instances:
      - name: peer_roles_cannot_enter_each_others_exclusive_operations
        claim_type: peer_roles
        grounds:
          - rbac.Coach.exclusive_operations
          - rbac.Provider.exclusive_operations
          - rbac.StateAdministrator.exclusive_operations
          - rbac.FamilyViewer.shared_operations
          - validations[priority=2]
        distinguishing_aspect: "Three cross-role writes on the same ENROLLED provider all fail 403 ERR_FORBIDDEN_ROLE at priority 2 - Coach cannot submit a subsidy claim (Provider-exclusive), Provider cannot allocate coaching (StateAdministrator-exclusive), and FamilyViewer cannot read GET /providers/{id}/credential-compliance, which is shared only with Provider - even though every body is otherwise well formed."
        test_recipe:
          setup:
            - "One ENROLLED provider; clock 2026-08-03."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Role Fence", license_number: "LIC-6071", county_code: "DANE", region_code: "URBAN", licensed_capacity: 30, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
            - { call: "POST /providers/${pid}/enrollment-decisions", payload: { decision: "APPROVE" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          trigger:
            - { call: "POST /providers/${pid}/subsidy-claims", payload: { service_month: "2026-08", child_days: { INFANT: 10, TODDLER: 0, PRESCHOOL: 0 } }, as: Coach, as_user_id: "coach_1" }
            - { call: "POST /providers/${pid}/coaching-allocations", payload: { coach_user_id: "coach_1", funding_source: "STATE_BASE", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-31T00:00:00Z", allocated_hours: 10.0, hourly_rate_cents: 5000 }, as: Provider, as_user_id: "${pid}" }
            - { call: "GET /providers/${pid}/credential-compliance", payload: {}, as: FamilyViewer, as_user_id: null }
          assert:
            - "all three trigger calls return HTTP status == 403 with error.id == ERR_FORBIDDEN_ROLE"
            - "no rows are created: GET /subsidy-claims?provider_id=${pid} returns total_count == 0 and GET /coaching-allocations?provider_id=${pid} returns total_count == 0"
            - "Provider.${pid}.status == ENROLLED and Provider.${pid}.credential_compliance_pct == 0.00"

