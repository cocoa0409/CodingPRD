  - rule_id: non_linear_state_machine
    instances:
      - name: member_contract_revision_loop_caps_at_three_completed_rounds
        grounds:
          - state_machines.MemberContract
          - entities.MemberContract.fields.revision_round
          - validations.priority_50_ERR_MAX_REVISION_ROUNDS_EXCEEDED
          - validations.priority_13_ERR_INVALID_CONTRACT_STATE
        distinguishing_aspect: |
          Cyclic shape with a loop counter: ISSUED -> REVISION_REQUESTED -> ISSUED may
          close at most 3 rounds, and the cap is enforced on the *reissue* that would
          close round 4 — not on request-revision — so a 4th request-revision
          legitimately succeeds and parks the contract in REVISION_REQUESTED, where
          sign is then also refused. A linear reading (cap the request) makes the
          error unreachable and lets sign succeed.
        test_recipe:
          setup:
            - "A 2027 season with one OFFERED member holding an ISSUED contract at revision_round 0."
            - "Three full negotiation rounds are completed (request-revision + reissue, three times), each reissue restating the terms, leaving status ISSUED and revision_round 3."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_id: "$.data.id" }
            - call: "POST /members/${member_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 91.5 }
              as: MembershipCoordinator
            - call: "POST /member-contracts"
              payload: { member_id: "${member_id}", tuition_amount_cents: 399900, payment_plan_type: "STANDARD_3" }
              as: MembershipCoordinator
              captures: { contract_id: "$.data.id" }
            - call: "POST /member-contracts/${contract_id}/request-revision"
              payload: { revision_note: "round 1: please lower tuition" }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /member-contracts/${contract_id}/reissue"
              payload: { tuition_amount_cents: 389900 }
              as: MembershipCoordinator
            - call: "POST /member-contracts/${contract_id}/request-revision"
              payload: { revision_note: "round 2: six-payment plan please" }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /member-contracts/${contract_id}/reissue"
              payload: { payment_plan_type: "EXTENDED_6" }
              as: MembershipCoordinator
            - call: "POST /member-contracts/${contract_id}/request-revision"
              payload: { revision_note: "round 3: one more look" }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /member-contracts/${contract_id}/reissue"
              payload: { tuition_amount_cents: 379900 }
              as: MembershipCoordinator
            - call: "GET /member-contracts/${contract_id}"
              as: MembershipCoordinator
          trigger:
            - call: "POST /member-contracts/${contract_id}/request-revision"
              payload: { revision_note: "round 4: still not right" }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /member-contracts/${contract_id}/reissue"
              payload: { tuition_amount_cents: 369900 }
              as: MembershipCoordinator
            - call: "POST /member-contracts/${contract_id}/sign"
              payload: { signature_name: "Avery Nakamura" }
              as: Member
              as_user_id: "${member_id}"
          assert:
            - "after the 3rd reissue: MemberContract.${contract_id}.status == ISSUED, revision_round == 3, tuition_amount_cents == 379900, payment_plan_type == EXTENDED_6 (the round-2 term was retained by the round-3 partial reissue)"
            - "the 4th request-revision returns 200 and MemberContract.${contract_id}.status == REVISION_REQUESTED"
            - "the 4th reissue returns 409 ERR_MAX_REVISION_ROUNDS_EXCEEDED"
            - "MemberContract.${contract_id}.status is still REVISION_REQUESTED and revision_round is still 3 and tuition_amount_cents is still 379900"
            - "the sign attempt returns 409 ERR_INVALID_CONTRACT_STATE because sign requires ISSUED"
            - "Member.${member_id}.membership_status == OFFERED throughout"

      - name: member_parallel_medical_dimension_gates_contract_execution
        grounds:
          - state_machines.Member.dimension_medical_status
          - state_machines.Member.dimension_membership_status
          - state_machines.MemberContract.transitions.SIGNED_BY_MEMBER_to_EXECUTED
          - validations.priority_30_ERR_MEDICAL_NOT_CLEARED
        distinguishing_aspect: |
          Parallel dimensions plus a guarded cross-dimension transition, a different
          non-linearity from the MemberContract revision loop: medical_status cycles
          CLEARED -> SIDELINED -> RESTRICTED -> CLEARED without ever perturbing
          membership_status, yet contract execution is guarded on the medical
          dimension, so the same execute call fails at SIDELINED and succeeds after
          the cycle returns to CLEARED.
        test_recipe:
          setup:
            - "A 2027 season with one OFFERED member whose contract is SIGNED_BY_MEMBER and whose medical_status is still the CLEARED default."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_id: "$.data.id" }
            - call: "POST /members/${member_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 91.5 }
              as: MembershipCoordinator
            - call: "POST /member-contracts"
              payload: { member_id: "${member_id}", tuition_amount_cents: 399900, payment_plan_type: "STANDARD_3" }
              as: MembershipCoordinator
              captures: { contract_id: "$.data.id" }
            - call: "POST /member-contracts/${contract_id}/sign"
              payload: { signature_name: "Avery Nakamura" }
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /members/${member_id}/medical-status"
              payload: { to_medical_status: "SIDELINED", note: "stress fracture" }
              as: MembershipCoordinator
            - call: "POST /member-contracts/${contract_id}/execute"
              payload: {}
              as: CorpsDirector
            - call: "POST /members/${member_id}/medical-status"
              payload: { to_medical_status: "RESTRICTED", note: "walking, no marching" }
              as: MembershipCoordinator
            - call: "POST /member-contracts/${contract_id}/execute"
              payload: {}
              as: CorpsDirector
            - call: "POST /members/${member_id}/medical-status"
              payload: { to_medical_status: "CLEARED", note: "full release" }
              as: MembershipCoordinator
            - call: "POST /member-contracts/${contract_id}/execute"
              payload: {}
              as: CorpsDirector
          assert:
            - "after the SIDELINED transition: Member.${member_id}.medical_status == SIDELINED and membership_status is still OFFERED (the dimensions are independent)"
            - "the execute at SIDELINED returns 409 ERR_MEDICAL_NOT_CLEARED and MemberContract.${contract_id}.status is still SIGNED_BY_MEMBER"
            - "the execute at RESTRICTED also returns 409 ERR_MEDICAL_NOT_CLEARED"
            - "after the CLEARED transition the execute returns 200: MemberContract.${contract_id}.status == EXECUTED and executed_at is set"
            - "Member.${member_id}.membership_status == CONTRACTED and tuition_charged_cents == 399900 and medical_status == CLEARED"
            - "Season.${season_id}.tuition_charged_cents == 399900"

      - name: facility_agreement_counter_loop_then_signed_branch_pins_countered_rate
        grounds:
          - state_machines.FacilityAgreement
          - entities.FacilityAgreement.fields.counter_round
          - entities.FacilityAgreement.fields.effective_nightly_rate_cents
          - calculations.housing_bed_night_capacity
          - validations.priority_51_ERR_MAX_COUNTER_ROUNDS_EXCEEDED
        distinguishing_aspect: |
          Branching AND cyclic in one machine, unlike the two member-side instances:
          SUBMITTED forks to COUNTERED (which pins nothing and bills nothing) or to
          SIGNED (which pins the rate and starts billing), the COUNTERED -> SUBMITTED
          loop is capped at 2 counters, and after the cap the SIGNED branch must pin
          the *countered* 500 rate rather than the originally proposed 700, driving
          billable_cents 1300000 off the 100-bed minimum over 26 nights.
        test_recipe:
          setup:
            - "A 2027 season and a host school with 30 sleeping spaces."
            - "A SPRING_TRAINING agreement is drafted at 700 cents/bed-night with a 100-bed minimum for 2027-05-10 through 2027-06-05 (26 nights) and submitted, countered down to 600, resubmitted, countered down to 500, and resubmitted."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /host-schools"
              payload: { name: "Rockford High School", city: "Rockford", state_code: "IL", sleeping_space_count: 30, capacity_per_space: 12, rehearsal_field_count: 2, has_air_conditioning: true }
              as: TourManager
              captures: { school_id: "$.data.id" }
            - call: "POST /facility-agreements"
              payload: { host_school_id: "${school_id}", season_id: "${season_id}", usage_type: "SPRING_TRAINING", start_date: "2027-05-10", end_date: "2027-06-05", nightly_rate_cents: 700, minimum_billable_beds: 100 }
              as: TourManager
              captures: { agreement_id: "$.data.id" }
            - call: "POST /facility-agreements/${agreement_id}/submit"
              payload: {}
              as: TourManager
            - call: "POST /facility-agreements/${agreement_id}/counter"
              payload: { countered_nightly_rate_cents: 600 }
              as: TourManager
            - call: "POST /facility-agreements/${agreement_id}/submit"
              payload: {}
              as: TourManager
            - call: "POST /facility-agreements/${agreement_id}/counter"
              payload: { countered_nightly_rate_cents: 500 }
              as: TourManager
            - call: "POST /facility-agreements/${agreement_id}/submit"
              payload: {}
              as: TourManager
          trigger:
            - call: "POST /facility-agreements/${agreement_id}/counter"
              payload: { countered_nightly_rate_cents: 400 }
              as: TourManager
            - call: "POST /facility-agreements/${agreement_id}/sign"
              payload: {}
              as: CorpsDirector
          assert:
            - "before the trigger: FacilityAgreement.${agreement_id}.status == SUBMITTED, counter_round == 2, countered_nightly_rate_cents == 500, effective_nightly_rate_cents == null, billable_cents == 0"
            - "the 3rd counter returns 409 ERR_MAX_COUNTER_ROUNDS_EXCEEDED and countered_nightly_rate_cents is still 500 and counter_round is still 2 and status is still SUBMITTED"
            - "the sign returns 200: FacilityAgreement.${agreement_id}.status == SIGNED"
            - "FacilityAgreement.${agreement_id}.agreement_nights == 26"
            - "FacilityAgreement.${agreement_id}.effective_nightly_rate_cents == 500 (the countered rate, not the proposed 700)"
            - "FacilityAgreement.${agreement_id}.occupied_bed_nights == 0 and billable_bed_nights == 2600"
            - "FacilityAgreement.${agreement_id}.billable_cents == 1300000"
            - "Season.${season_id}.housing_cost_cents == 1300000"

  - rule_id: transitive_cascade
    instances:
      - name: third_delinquency_strike_cascades_plan_member_housing_and_school_ledgers
        grounds:
          - state_machines.PaymentPlan.transitions.DELINQUENT_to_CLOSED_WITH_BALANCE
          - state_machines.Member.transitions.CONTRACTED_to_WITHDRAWN_by_sweep
          - state_machines.HousingAssignment.transitions.ACTIVE_to_RELEASED
          - calculations.late_fee_assessment
          - calculations.member_withdrawal_obligation
          - calculations.housing_bed_night_capacity
        distinguishing_aspect: |
          Depth-4 chain fired by a single system sweep and driven by a *counter*
          reaching its limit: sweep -> plan strike 3 / CLOSED_WITH_BALANCE (link 1)
          -> Member CONTRACTED -> WITHDRAWN with the obligation recharge (link 2)
          -> HousingAssignment RELEASED (link 3) -> FacilityAgreement,
          HostSchool and Season housing ledgers recomputed (link 4). It also pins
          the ordering trap that the plan is NOT re-derived after link 2, so
          outstanding_cents stays 419571 even though the member now owes 15000.
