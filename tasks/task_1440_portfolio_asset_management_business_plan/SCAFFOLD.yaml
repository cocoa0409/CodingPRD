# =============================================================================
# SCAFFOLD.yaml — Portfolio Asset Management & Business Plan Execution
# §1.0–§1.7 (difficulty/corner designs live in sibling files)
# =============================================================================

scenario: |
  Portfolio Asset Management & Business Plan Execution (real estate asset manager): annual business plan by asset with budget & capital plan, property manager oversight & performance scorecard, variance analysis & re-forecast cadence, capital project approval & funding, leasing strategy & rate recommendations, refinance/hold/sell decision triggers, lender reporting & covenant compliance, valuation update & portfolio reporting

domain_name: portfolio-asset-management
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit        # covenants, lender reporting cadence, SoD on money movement
  secondary_archetype: posture_driven_gating # Portfolio.risk_posture gates capital approval & plan approval
  complexity_layers:
    - optimistic_concurrency     # OCC on Asset.version / BusinessPlan.version for supersede & drain patterns
    - cascading_side_effects     # covenant FAIL -> covenant breach -> loan WATCH -> portfolio posture recompute
    - rate_threshold_triggers    # DSCR/LTV/debt-yield breakpoints, occupancy tiers, decision trigger arming
    - ops_run_checkpoint         # logical clock drives fiscal-month cadence, lateness, cure windows
  entity_topology: flat                      # peer collections under /api with FK references (lint-friendly)
  state_machine_shape: cyclic                # plan revision loop, loan CURRENT<->WATCH, covenant breach<->cure
  relationship_patterns:
    - one_to_many               # Portfolio->Asset, Asset->BusinessPlan/Loan/Valuation/...
    - cross_aggregate           # CapitalProject references both Asset and BusinessPlan; Scorecard references Asset and PropertyManager
  role_model: segregation_of_duties          # proposer != approver on capital; creator != ratifier on dispositions; PM submits / AM accepts actuals
  consistency_model: immediate               # all cascades atomic in-request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Portfolio
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Portfolio display name" }
      - { name: base_currency, type: string, source: input, default: "USD", description: "ISO currency code" }
      - { name: fiscal_year_start_month, type: integer, source: input, default: 1, constraints: "1..12", description: "Calendar month in which fiscal year begins" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED" }
      - { name: risk_posture, type: enum, source: computed, description: "NORMAL | ELEVATED | RESTRICTED — derived from loans in WATCH/DEFAULT (see calc portfolio_risk_posture)" }
      - { name: total_value_cents, type: integer, source: computed, description: "Sum of latest CONFIRMED Valuation.implied_value_cents over OWNED/LISTED assets" }

  - name: PropertyManager
    parent: null
    common_fields: true
    fields:
      - { name: firm_name, type: string, source: input, description: "Management firm name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: probation_streak, type: integer, source: system, default: 0, description: "Consecutive FINALIZED scorecards rated PROBATION (reset on non-PROBATION finalize)" }
      - { name: composite_score_avg, type: number, source: computed, description: "Mean of composite_score over up to 4 most recent FINALIZED scorecards across managed assets, 2dp round_half_up; null when none" }

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - { name: portfolio_id, type: string, source: input, description: "FK -> Portfolio.id" }
      - { name: property_manager_id, type: string, source: input, description: "FK -> PropertyManager.id" }
      - { name: name, type: string, source: input, description: "Asset name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: asset_class, type: enum, source: input, description: "OFFICE | RETAIL | INDUSTRIAL | MULTIFAMILY" }
      - { name: net_rentable_sqft, type: integer, source: input, constraints: "> 0", description: "Rentable square feet" }
      - { name: acquisition_price_cents, type: integer, source: input, constraints: "> 0", description: "Purchase price" }
      - { name: acquisition_date, type: string, source: input, description: "ISO date of acquisition; must not be after current clock date" }
      - { name: hold_period_years, type: integer, source: input, constraints: "> 0", description: "Target hold length for decision triggers" }
      - { name: status, type: enum, source: system, description: "OWNED | LISTED_FOR_SALE | UNDER_CONTRACT | SOLD" }
      - { name: current_value_cents, type: integer, source: computed, description: "implied_value_cents of latest CONFIRMED Valuation; null until one exists" }
      - { name: current_annualized_noi_cents, type: integer, source: computed, description: "TRAILING_ACTUALS variant of annualized_noi on the APPROVED plan; null when no APPROVED plan or no accepted actuals" }
      - { name: current_plan_id, type: string, source: computed, description: "Id of the APPROVED BusinessPlan, null when none" }

  - name: BusinessPlan
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year label; plan covers 12 consecutive months starting Portfolio.fiscal_year_start_month of fiscal_year" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED | CLOSED" }
      - { name: total_revenue_budget_cents, type: integer, source: computed, description: "Sum of BudgetLine.budget_amount_cents over revenue categories" }
      - { name: total_opex_budget_cents, type: integer, source: computed, description: "Sum over the 7 expense categories" }
      - { name: total_capital_budget_cents, type: integer, source: computed, description: "Sum over CAPITAL category lines" }
      - { name: budgeted_noi_cents, type: integer, source: computed, description: "total_revenue_budget_cents - total_opex_budget_cents" }
      - { name: ytd_actual_noi_cents, type: integer, source: computed, description: "Sum of signed actuals (revenue minus expense) over lines with has_actual = true" }
      - { name: available_capital_cents, type: integer, source: computed, description: "total_capital_budget_cents - reserved_capital_cents - drawn_capital_cents; may go negative only via emergency approvals" }
      - { name: reserved_capital_cents, type: integer, source: computed, description: "Sum of (approved_amount_cents - drawn_cents) over CapitalProjects in {APPROVED, IN_PROGRESS}" }
      - { name: drawn_capital_cents, type: integer, source: computed, description: "Sum of drawn_cents over projects in {APPROVED, IN_PROGRESS, COMPLETED, CANCELLED}" }
      - { name: reforecast_count, type: integer, source: system, default: 0, description: "Number of APPLIED ReForecasts; hard cap 3" }

  - name: BudgetLine
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> BusinessPlan.id" }
      - { name: category, type: enum, source: input, description: "RENT_REVENUE | PARKING_REVENUE | OTHER_REVENUE | CAM_EXPENSE | TAX_EXPENSE | INSURANCE_EXPENSE | UTILITIES_EXPENSE | MANAGEMENT_FEE_EXPENSE | OTHER_OPEX | CAPITAL" }
      - { name: month_index, type: integer, source: input, constraints: "1..12", description: "Fiscal month within the plan year" }
      - { name: budget_amount_cents, type: integer, source: input, constraints: ">= 0", description: "Budgeted amount (revenue and expense both positive)" }
      - { name: actual_amount_cents, type: integer, source: system, default: 0, description: "Posted actual; set only by ActualsReport acceptance" }
      - { name: has_actual, type: boolean, source: system, default: false, description: "True once an ACCEPTED ActualsReport posts to this line" }
      - { name: variance_cents, type: integer, source: computed, description: "actual_amount_cents - budget_amount_cents (null until has_actual)" }
      - { name: variance_bps, type: integer, source: computed, description: "See calc line_variance; null until has_actual" }

  - name: ActualsReport
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> BusinessPlan.id" }
      - { name: month_index, type: integer, source: input, constraints: "1..12", description: "Fiscal month these actuals report" }
      - { name: lines, type: array, source: input, description: "Array of { budget_line_id, actual_amount_cents }; every referenced line must belong to plan_id and have month_index == report month_index" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitting PropertyManager" }

  - name: CapitalProject
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: plan_id, type: string, source: input, description: "FK -> BusinessPlan.id; must be the asset's APPROVED plan at approval time" }
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: is_emergency, type: boolean, source: input, default: false, description: "Emergency projects bypass the available-capital check but require PortfolioDirector approval" }
      - { name: requested_amount_cents, type: integer, source: input, constraints: "> 0", description: "Funding requested" }
      - { name: sched_start_month, type: integer, source: input, constraints: "1..12, <= sched_end_month", description: "First fiscal month of scheduled spend" }
      - { name: sched_end_month, type: integer, source: input, constraints: "1..12, >= sched_start_month", description: "Last fiscal month of scheduled spend (inclusive)" }
      - { name: approved_amount_cents, type: integer, source: system, description: "Set at approval; equals requested_amount_cents" }
      - { name: monthly_spend_cents, type: integer, source: computed, description: "floor(approved_amount_cents / span), span = sched_end_month - sched_start_month + 1" }
      - { name: final_month_spend_cents, type: integer, source: computed, description: "approved_amount_cents - monthly_spend_cents * (span - 1); remainder lands in sched_end_month" }
      - { name: drawn_cents, type: integer, source: computed, description: "Sum of RELEASED FundingDraw.amount_cents" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of creating AssetManager (SoD anchor)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | IN_PROGRESS | COMPLETED | CANCELLED | REJECTED" }

  - name: FundingDraw
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CapitalProject.id" }
      - { name: amount_cents, type: integer, source: input, constraints: "> 0", description: "Draw amount" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | RELEASED | REJECTED" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of creating AssetManager" }

  - name: LeaseStrategy
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: space_type, type: enum, source: input, description: "OFFICE_SUITE | RETAIL_BAY | INDUSTRIAL_BAY | APARTMENT_UNIT" }
      - { name: current_occupancy_pct, type: integer, source: input, constraints: "0..100", description: "Occupancy of the space type at drafting" }
      - { name: proposed_asking_rate_psf_cents, type: integer, source: input, constraints: "> 0", description: "Asking rate per sqft per year proposed by the drafter" }
      - { name: market_comp_rate_psf_cents, type: integer, source: input, constraints: "> 0", description: "Market comparable rate per sqft per year" }
      - { name: recommended_rate_psf_cents, type: integer, source: computed, description: "Set by calc recommended_lease_rate on /recommend; null while DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT | RECOMMENDED | RATIFIED | REJECTED | SUPERSEDED" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: lender_name, type: string, source: input, description: "Lender institution" }
      - { name: principal_balance_cents, type: integer, source: input, constraints: "> 0", description: "Outstanding principal (static; interest-only loan)" }
      - { name: annual_interest_rate_bps, type: integer, source: input, constraints: "> 0", description: "Note rate in basis points" }
      - { name: origination_date, type: string, source: input, description: "ISO date of origination" }
      - { name: maturity_date, type: string, source: input, description: "ISO date of maturity; must be after origination_date" }
      - { name: status, type: enum, source: system, description: "CURRENT | WATCH | DEFAULT | REFINANCED | PAID_OFF" }

  - name: Covenant
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id" }
      - { name: covenant_type, type: enum, source: input, description: "MIN_DSCR | MAX_LTV | MIN_DEBT_YIELD" }
      - { name: threshold_bps, type: integer, source: input, constraints: "> 0", description: "MIN_DSCR/MIN_DEBT_YIELD: pass when measured >= threshold. MAX_LTV: pass when measured <= threshold" }
      - { name: test_frequency, type: enum, source: input, description: "QUARTERLY | ANNUAL" }
      - { name: cure_period_days, type: integer, source: input, default: 30, constraints: "> 0", description: "Days after a FAIL during which a subsequent PASS cures without DEFAULT escalation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | IN_BREACH | WAIVED" }
      - { name: last_breach_at, type: string, source: system, description: "ISO datetime of the FAIL that caused the current IN_BREACH episode; null when not in breach" }

  - name: CovenantTest
    parent: null
    common_fields: false
    fields:
      - { name: covenant_id, type: string, source: input, description: "FK -> Covenant.id" }
      - { name: period_label, type: string, source: input, description: "Calendar quarter label, format YYYY-Qn (n in 1..4)" }
      - { name: measured_value_bps, type: integer, source: computed, description: "Per calc covenant_measure; DSCR/debt-yield/ltv in bps" }
      - { name: annualized_noi_cents_used, type: integer, source: computed, description: "NOI figure used (TRAILING_ACTUALS variant); null for MAX_LTV when valuation-only" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL" }

  - name: Valuation
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: effective_date, type: string, source: input, description: "ISO date the value is effective; must not be after current clock date" }
      - { name: method, type: enum, source: input, description: "EXTERNAL_APPRAISAL | INTERNAL_CAP" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Required iff method = EXTERNAL_APPRAISAL; forbidden otherwise" }
      - { name: cap_rate_bps, type: integer, source: input, description: "Required iff method = INTERNAL_CAP; forbidden otherwise" }
      - { name: noi_used_cents, type: integer, source: computed, description: "For INTERNAL_CAP: Asset.current_annualized_noi_cents at creation; null for EXTERNAL_APPRAISAL" }
      - { name: implied_value_cents, type: integer, source: computed, description: "EXTERNAL: appraised_value_cents. INTERNAL_CAP: round_half_up(noi_used_cents * 10000 / cap_rate_bps)" }
      - { name: status, type: enum, source: system, description: "DRAFT | CONFIRMED | SUPERSEDED" }

  - name: PerformanceScorecard
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: property_manager_id, type: string, source: system, description: "FK -> PropertyManager.id; copied from Asset.property_manager_id at creation" }
      - { name: period_label, type: string, source: input, description: "Calendar quarter label, format YYYY-Qn" }
      - { name: occupancy_pct, type: integer, source: input, constraints: "0..100", description: "Quarter-end occupancy" }
      - { name: collections_pct, type: integer, source: input, constraints: "0..100", description: "Billed-vs-collected percentage" }
      - { name: renewal_rate_pct, type: integer, source: input, constraints: "0..100", description: "Expiring leases renewed" }
      - { name: expense_variance_bps, type: integer, source: input, description: "Signed actual-vs-budget opex variance in bps" }
      - { name: composite_score, type: integer, source: computed, description: "0..100 per calc scorecard_composite" }
      - { name: rating, type: enum, source: computed, description: "EXCELLENT | SATISFACTORY | WATCH | PROBATION per calc scorecard_composite thresholds" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | REVIEWED | FINALIZED" }

  - name: ReForecast
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> BusinessPlan.id" }
      - { name: label, type: string, source: computed, description: "R1 | R2 | R3 by creation sequence on the plan" }
      - { name: effective_from_month, type: integer, source: computed, description: "Plan fiscal month derived from the logical clock at creation; must be in {4, 7, 10}" }
      - { name: lines, type: array, source: input, description: "Array of { category, revised_annual_amount_cents }; must cover each of the 9 non-CAPITAL categories exactly once" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPLIED | REJECTED" }

  - name: DispositionDecision
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: trigger_type, type: enum, source: input, description: "REFINANCE | HOLD | SELL" }
      - { name: dscr_bps_snapshot, type: integer, source: computed, description: "Latest DSCR evidence at creation per calc decision_trigger_scan; null when no loan/NOI evidence" }
      - { name: ltv_bps_snapshot, type: integer, source: computed, description: "LTV at creation; null when no loan or no CONFIRMED valuation" }
      - { name: hold_years_elapsed, type: integer, source: computed, description: "floor(months_between(acquisition_date, clock)/12)" }
      - { name: value_gain_bps, type: integer, source: computed, description: "(current_value - acquisition_price) * 10000 / acquisition_price, round_half_up; null without CONFIRMED valuation" }
      - { name: refinance_signal, type: boolean, source: computed, description: "Per calc decision_trigger_scan" }
      - { name: sell_signal, type: boolean, source: computed, description: "Per calc decision_trigger_scan" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (SoD anchor for ratify)" }
      - { name: status, type: enum, source: system, description: "SCREENING | COMMITTEE_REVIEW | RATIFIED | EXECUTED | SHELVED" }

  - name: LenderReport
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id" }
      - { name: period_label, type: string, source: input, description: "Calendar quarter label, format YYYY-Qn" }
      - { name: quarter_end_date, type: string, source: computed, description: "Last day of the labeled calendar quarter" }
      - { name: due_date, type: string, source: computed, description: "quarter_end_date + 45 days" }
      - { name: submitted_at, type: string, source: system, description: "Logical-clock datetime at submit; null while DRAFT" }
      - { name: is_late, type: boolean, source: computed, description: "submitted_at date > due_date" }
      - { name: noi_ttm_cents, type: integer, source: computed, description: "TRAILING_ACTUALS annualized NOI snapshot at submit" }
      - { name: dscr_bps, type: integer, source: computed, description: "DSCR snapshot at submit" }
      - { name: ltv_bps, type: integer, source: computed, description: "LTV snapshot at submit; null without CONFIRMED valuation" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BusinessPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/business-plans/{id}/submit"
        actor: AssetManager
        preconditions:
          - "Every one of the 10 BudgetLine categories has at least one line (ERR_PLAN_LINES_INCOMPLETE)"
          - "Asset.status == OWNED (ERR_ASSET_NOT_OPERATING)"
        side_effects: ["increments BusinessPlan.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/business-plans/{id}/approve"
        actor: PortfolioDirector
        preconditions:
          - "PropertyManager of the asset has status == ACTIVE (ERR_MANAGER_SUSPENDED)"
          - "Portfolio.risk_posture != RESTRICTED (ERR_PORTFOLIO_RESTRICTED)"
        side_effects:
          - "Asset.current_plan_id := plan.id"
          - "Any other APPROVED plan of the same asset with a different fiscal_year -> CLOSED (year-rollover handoff)"
          - "increments BusinessPlan.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/business-plans/{id}/reject"
        actor: PortfolioDirector
        preconditions: []
        side_effects: ["increments BusinessPlan.version by 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /api/business-plans/{id}/submit (resubmission path after revision)"
        actor: AssetManager
        preconditions:
          - "Every one of the 10 BudgetLine categories has at least one line (ERR_PLAN_LINES_INCOMPLETE)"
        side_effects: ["increments BusinessPlan.version by 1"]
        note: "Cyclic revision loop: DRAFT -> SUBMITTED -> REJECTED -> SUBMITTED (lines editable while REJECTED via new POST /api/budget-lines calls)"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system cascade: POST /api/business-plans creates a new DRAFT for the same (asset_id, fiscal_year) while this plan is APPROVED"
        actor: system
        preconditions:
          - "This plan has no CapitalProject in {APPROVED, IN_PROGRESS} (ERR_PLAN_HAS_ACTIVE_PROJECTS on the create call)"
        side_effects:
          - "This plan's ReForecasts in {DRAFT, SUBMITTED} -> REJECTED"
          - "Asset.current_plan_id recomputed (null until the new plan is APPROVED)"
          - "increments BusinessPlan.version by 1"
      - from: APPROVED
        to: CLOSED
        trigger: "system cascade: POST /api/assets/{id}/record-sale action=CLOSE sells the asset; OR a different-fiscal-year plan of the same asset is APPROVED (year-rollover handoff)"
        actor: system
        preconditions: []
        side_effects:
          - "CapitalProjects of this plan in {PROPOSED, APPROVED, IN_PROGRESS} -> CANCELLED (releases reserved capital)"
          - "ReForecasts in {DRAFT, SUBMITTED} -> REJECTED"
          - "increments BusinessPlan.version by 1"

  - entity: CapitalProject
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/capital-projects/{id}/approve"
        actor: InvestmentCommittee
        preconditions:
          - "OCC: expected_plan_version == plan.version (ERR_STALE_PLAN_VERSION)"
          - "X-User-ID != proposed_by_user_id (ERR_SELF_APPROVAL_FORBIDDEN)"
          - "If is_emergency: caller role must instead be PortfolioDirector (ERR_FORBIDDEN_FOR_ROLE)"
          - "Plan.status == APPROVED (ERR_PLAN_NOT_APPROVED)"
          - "Portfolio.risk_posture != RESTRICTED unless is_emergency (ERR_PORTFOLIO_RESTRICTED)"
          - "If not is_emergency: plan.available_capital_cents >= requested_amount_cents (ERR_CAPITAL_BUDGET_EXCEEDED)"
          - "If not is_emergency — schedule capacity: for every fiscal month m in [sched_start_month, sched_end_month], committed monthly spend of other projects in {APPROVED, IN_PROGRESS} overlapping m plus this project's monthly spend <= floor(plan.total_capital_budget_cents / 12) (ERR_CAPITAL_SCHEDULE_OVER_COMMITTED). Emergency projects skip BOTH fiscal checks (availability and schedule) and may drive available_capital_cents negative"
        side_effects:
          - "approved_amount_cents := requested_amount_cents"
          - "Plan reservation: available_capital_cents decreases by approved_amount_cents (reserved_capital_cents increases)"
          - "increments plan.version by 1 (OCC observable)"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /api/capital-projects/{id}/reject"
        actor: InvestmentCommittee
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /api/capital-projects/{id}/start"
        actor: AssetManager
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/capital-projects/{id}/complete"
        actor: AssetManager
        preconditions:
          - "drawn_cents > 0 (ERR_PROJECT_NEVER_FUNDED)"
        side_effects:
          - "Reservation release: (approved_amount_cents - drawn_cents) returns to plan.available_capital_cents"
          - "increments plan.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /api/capital-projects/{id}/cancel OR system cascade (plan supersede is blocked instead; asset sale cancels)"
        actor: AssetManager | system
        preconditions: []
        side_effects:
          - "Reservation release: (approved_amount_cents - drawn_cents) returns to plan.available_capital_cents; drawn_cents remains in plan.drawn_capital_cents (sunk cost)"
          - "FundingDraws in {REQUESTED, APPROVED} -> REJECTED"
          - "increments plan.version by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /api/capital-projects/{id}/cancel OR system cascade"
        actor: AssetManager | system
        preconditions: []
        side_effects:
          - "Reservation release: (approved_amount_cents - drawn_cents) returns to plan.available_capital_cents; drawn_cents remains in plan.drawn_capital_cents"
          - "FundingDraws in {REQUESTED, APPROVED} -> REJECTED"
          - "increments plan.version by 1"

  - entity: FundingDraw
    initial_state: REQUESTED
    terminal_states: [RELEASED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/funding-draws/{id}/approve"
        actor: InvestmentCommittee
        preconditions:
          - "Project.status in {APPROVED, IN_PROGRESS} (ERR_PROJECT_NOT_FUNDABLE)"
          - "Cumulative check: project.drawn_cents + amount_cents <= project.approved_amount_cents (ERR_DRAW_EXCEEDS_AUTHORIZATION; equality allowed)"
        side_effects: []
      - from: APPROVED
        to: RELEASED
        trigger: "POST /api/funding-draws/{id}/release"
        actor: PortfolioDirector
        preconditions: []
        side_effects:
          - "project.drawn_cents += amount_cents (ledger sync; project.version +1)"
          - "plan.drawn_capital_cents recomputed; plan.version +1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /api/funding-draws/{id}/reject OR system cascade (project cancelled)"
        actor: InvestmentCommittee | system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REJECTED
        trigger: "system cascade (project cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Loan
    initial_state: CURRENT
    terminal_states: [DEFAULT, REFINANCED, PAID_OFF]
    transitions:
      - from: CURRENT
        to: WATCH
        trigger: "system cascade: a CovenantTest with result FAIL is recorded on one of its covenants; or a LenderReport is submitted late"
        actor: system
        preconditions: []
        side_effects:
          - "Portfolio.risk_posture recomputed (any WATCH -> at least ELEVATED)"
      - from: WATCH
        to: CURRENT
        trigger: "system cascade: the last IN_BREACH covenant on this loan returns to ACTIVE (cure) or is WAIVED"
        actor: system
        preconditions: ["No covenant of this loan remains IN_BREACH"]
        side_effects:
          - "Portfolio.risk_posture recomputed"
      - from: WATCH
        to: DEFAULT
        trigger: "system cascade: a CovenantTest FAIL is recorded while the same covenant is IN_BREACH and the logical clock is past last_breach_at + cure_period_days"
        actor: system
        preconditions: []
        side_effects:
          - "Portfolio.risk_posture recomputed (any DEFAULT -> RESTRICTED)"
      - from: CURRENT
        to: REFINANCED
        trigger: "system cascade: DispositionDecision EXECUTED with trigger_type REFINANCE"
        actor: system
        preconditions: []
        side_effects:
          - "All covenants of this loan in {ACTIVE, IN_BREACH} -> WAIVED"
          - "Portfolio.risk_posture recomputed"
      - from: CURRENT
        to: PAID_OFF
        trigger: "system cascade: POST /api/assets/{id}/record-sale"
        actor: system
        preconditions: []
        side_effects:
          - "All covenants of this loan in {ACTIVE, IN_BREACH} -> WAIVED"
          - "Portfolio.risk_posture recomputed"
      - from: WATCH
        to: PAID_OFF
        trigger: "system cascade: POST /api/assets/{id}/record-sale"
        actor: system
        preconditions: []
        side_effects:
          - "All covenants of this loan in {ACTIVE, IN_BREACH} -> WAIVED"
          - "Portfolio.risk_posture recomputed"

  - entity: Covenant
    initial_state: ACTIVE
    terminal_states: [WAIVED]
    transitions:
      - from: ACTIVE
        to: IN_BREACH
        trigger: "system cascade: POST /api/covenant-tests records result FAIL"
        actor: system
        preconditions: []
        side_effects:
          - "last_breach_at := clock now"
          - "Loan CURRENT -> WATCH (depth-2 link)"
      - from: IN_BREACH
        to: ACTIVE
        trigger: "system cascade: POST /api/covenant-tests records result PASS (cure)"
        actor: system
        preconditions: []
        side_effects:
          - "last_breach_at := null"
          - "If no other covenant of the loan is IN_BREACH: Loan WATCH -> CURRENT (depth-2 link)"
      - from: IN_BREACH
        to: WAIVED
        trigger: "POST /api/covenants/{id}/waive"
        actor: Lender
        preconditions:
          - "Covenant.status == IN_BREACH (ERR_COVENANT_NOT_WAIVABLE)"
        side_effects:
          - "If no other covenant of the loan is IN_BREACH and loan.status == WATCH: Loan WATCH -> CURRENT"
          - "Portfolio.risk_posture recomputed"

  - entity: Asset
    initial_state: OWNED
    terminal_states: [SOLD]
    transitions:
      - from: OWNED
        to: LISTED_FOR_SALE
        trigger: "system cascade: DispositionDecision EXECUTED with trigger_type SELL"
        actor: system
        preconditions: []
        side_effects: []
      - from: LISTED_FOR_SALE
        to: OWNED
        trigger: "POST /api/assets/{id}/record-sale with action=DELIST"
        actor: PortfolioDirector
        preconditions: []
        side_effects: []
        note: "Delist cycle: LISTED_FOR_SALE -> OWNED"
      - from: LISTED_FOR_SALE
        to: UNDER_CONTRACT
        trigger: "POST /api/assets/{id}/record-sale with action=CONTRACT (sale_agreed_price_cents required)"
        actor: PortfolioDirector
        preconditions:
          - "A RATIFIED-or-EXECUTED SELL DispositionDecision exists for this asset (ERR_ASSET_NOT_SELLABLE)"
        side_effects: []
      - from: UNDER_CONTRACT
        to: SOLD
        trigger: "POST /api/assets/{id}/record-sale with action=CLOSE (final_sale_price_cents required)"
        actor: PortfolioDirector
        preconditions: []
        side_effects:
          - "final_sale_price_cents recorded; current_value_cents := final_sale_price_cents"
          - "Loan in {CURRENT, WATCH} -> PAID_OFF (depth-2) -> its covenants {ACTIVE, IN_BREACH} -> WAIVED (depth-3)"
          - "BusinessPlans in {DRAFT, SUBMITTED, APPROVED, REJECTED} -> CLOSED (depth-2) -> their CapitalProjects in {PROPOSED, APPROVED, IN_PROGRESS} -> CANCELLED with capital release and their ReForecasts in {DRAFT, SUBMITTED} -> REJECTED (depth-3)"
          - "Portfolio.total_value_cents recomputed; Portfolio.risk_posture recomputed"

  - entity: PropertyManager
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/property-managers/{id}/suspend OR system cascade: a PerformanceScorecard is FINALIZED with rating PROBATION while probation_streak was already >= 1 (i.e., second consecutive PROBATION quarter)"
        actor: PortfolioDirector | system
        preconditions: []
        side_effects:
          - "Portfolio.risk_posture is NOT affected; instead blocks: BusinessPlan approve on any asset managed by this manager (ERR_MANAGER_SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/property-managers/{id}/reinstate"
        actor: PortfolioDirector
        preconditions: []
        side_effects: ["probation_streak := 0"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/property-managers/{id}/suspend with payload terminate=true"
        actor: PortfolioDirector
        preconditions:
          - "No asset references this manager with status OWNED/LISTED_FOR_SALE/UNDER_CONTRACT (ERR_MANAGER_IN_USE)"
        side_effects: []

  - entity: LeaseStrategy
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: RECOMMENDED
        trigger: "POST /api/lease-strategies/{id}/recommend"
        actor: Analyst
        preconditions: []
        side_effects:
          - "recommended_rate_psf_cents computed per calc recommended_lease_rate"
      - from: RECOMMENDED
        to: RATIFIED
        trigger: "POST /api/lease-strategies/{id}/ratify"
        actor: PortfolioDirector
        preconditions:
          - "Asset.status in {OWNED, LISTED_FOR_SALE} (ERR_ASSET_NOT_OPERATING)"
        side_effects:
          - "Any other RATIFIED LeaseStrategy of the same (asset_id, space_type) -> SUPERSEDED"
      - from: RECOMMENDED
        to: REJECTED
        trigger: "POST /api/lease-strategies/{id}/reject"
        actor: PortfolioDirector
        preconditions: []
        side_effects: []
      - from: RATIFIED
        to: SUPERSEDED
        trigger: "system cascade: another LeaseStrategy of same (asset_id, space_type) is RATIFIED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Valuation
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /api/valuations/{id}/confirm"
        actor: PortfolioDirector
        preconditions:
          - "OCC: expected_asset_version == asset.version (ERR_STALE_ASSET_VERSION)"
          - "effective_date strictly after the effective_date of the asset's current CONFIRMED valuation, if any (ERR_VALUATION_REGRESSIVE)"
        side_effects:
          - "Prior CONFIRMED valuation of the asset -> SUPERSEDED"
          - "Asset.current_value_cents := implied_value_cents; increments asset.version by 1"
          - "Portfolio.total_value_cents recomputed"
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "system cascade: another valuation of the same asset is CONFIRMED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PerformanceScorecard
    initial_state: SUBMITTED
    terminal_states: [FINALIZED]
    transitions:
      - from: SUBMITTED
        to: REVIEWED
        trigger: "POST /api/performance-scorecards/{id}/review"
        actor: AssetManager
        preconditions: []
        side_effects: []
      - from: REVIEWED
        to: FINALIZED
        trigger: "POST /api/performance-scorecards/{id}/finalize"
        actor: AssetManager
        preconditions: []
        side_effects:
          - "If rating == PROBATION: PropertyManager.probation_streak += 1 else probation_streak := 0"
          - "If probation_streak reaches 2: PropertyManager ACTIVE -> SUSPENDED (depth-2 cascade)"
          - "PropertyManager.composite_score_avg recomputed"

  - entity: ActualsReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/actuals-reports/{id}/accept"
        actor: AssetManager
        preconditions: []
        side_effects:
          - "For each lines[] entry: BudgetLine.actual_amount_cents := value, has_actual := true, variance fields recomputed; line.version +1"
          - "Plan ytd_actual_noi_cents recomputed; Asset.current_annualized_noi_cents recomputed (TRAILING_ACTUALS); plan.version +1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/actuals-reports/{id}/reject"
        actor: AssetManager
        preconditions: []
        side_effects: []

  - entity: ReForecast
    initial_state: DRAFT
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/reforecasts/{id}/submit"
        actor: AssetManager
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: APPLIED
        trigger: "POST /api/reforecasts/{id}/accept"
        actor: PortfolioDirector
        preconditions:
          - "OCC: expected_plan_version == plan.version (ERR_STALE_PLAN_VERSION)"
          - "Plan.status == APPROVED (ERR_PLAN_NOT_APPROVED)"
        side_effects:
          - "Per calc reforecast_spread: for each category, remaining months [effective_from_month..12] BudgetLines are upserted; elapsed months untouched"
          - "Plan total_revenue_budget_cents / total_opex_budget_cents / budgeted_noi_cents recomputed; reforecast_count += 1; plan.version +1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/reforecasts/{id}/reject OR system cascade (plan superseded / asset sold)"
        actor: PortfolioDirector | system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: REJECTED
        trigger: "system cascade (plan superseded / asset sold)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DispositionDecision
    initial_state: SCREENING
    terminal_states: [EXECUTED, SHELVED]
    transitions:
      - from: SCREENING
        to: COMMITTEE_REVIEW
        trigger: "POST /api/disposition-decisions/{id}/submit-review"
        actor: AssetManager
        preconditions: []
        side_effects: []
      - from: COMMITTEE_REVIEW
        to: RATIFIED
        trigger: "POST /api/disposition-decisions/{id}/ratify"
        actor: InvestmentCommittee
        preconditions:
          - "X-User-ID != created_by_user_id (ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects: []
      - from: COMMITTEE_REVIEW
        to: SHELVED
        trigger: "POST /api/disposition-decisions/{id}/shelve"
        actor: InvestmentCommittee
        preconditions: []
        side_effects: []
      - from: RATIFIED
        to: SHELVED
        trigger: "POST /api/disposition-decisions/{id}/shelve"
        actor: InvestmentCommittee
        preconditions: []
        side_effects: []
      - from: RATIFIED
        to: EXECUTED
        trigger: "POST /api/disposition-decisions/{id}/execute"
        actor: PortfolioDirector
        preconditions:
          - "Asset.status == OWNED for trigger_type SELL (ERR_ASSET_NOT_SELLABLE)"
          - "trigger_type REFINANCE: payload carries new_loan { principal_balance_cents, annual_interest_rate_bps, origination_date, maturity_date, lender_name } (ERR_INVALID_REQUEST)"
        side_effects:
          - "SELL: Asset OWNED -> LISTED_FOR_SALE"
          - "REFINANCE: Loan {CURRENT, WATCH} -> REFINANCED (depth-2) -> its covenants {ACTIVE, IN_BREACH} -> WAIVED (depth-3); new Loan created on the asset with status CURRENT; Portfolio.risk_posture recomputed"
          - "HOLD: Asset.hold_period_years += payload.extension_years (>= 1 required)"

  - entity: LenderReport
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/lender-reports/{id}/submit"
        actor: AssetManager
        preconditions:
          - "Loan.status in {CURRENT, WATCH} (ERR_LOAN_NOT_REPORTABLE)"
        side_effects:
          - "submitted_at := clock; is_late computed; NOI/DSCR/LTV snapshots frozen"
          - "If is_late and Loan.status == CURRENT: Loan -> WATCH (cascade); Portfolio.risk_posture recomputed"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /api/lender-reports/{id}/acknowledge"
        actor: Lender
        preconditions: []
        side_effects: []

  - entity: Portfolio
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /api/portfolios/{id}/archive"
        actor: PortfolioDirector
        preconditions:
          - "Every asset of the portfolio has status == SOLD (ERR_PORTFOLIO_NOT_EMPTY)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-asset
    parent_entity: Asset
    write_endpoint: "POST /api/business-plans"
    occ_field: expected_asset_version
    description: |
      Creating a BusinessPlan for an Asset whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just created a plan for the same (asset_id, fiscal_year), which
      legitimately supersedes the previously APPROVED plan, so the current
      writer's view of the asset's plan lineage is stale.
    error_id: ERR_STALE_ASSET_VERSION
    http_status: 412
  - rule_id: valuation-confirm-stale-asset
    parent_entity: Asset
    write_endpoint: "POST /api/valuations/{id}/confirm"
    occ_field: expected_asset_version
    description: |
      Confirming a Valuation against an Asset whose version has advanced since
      the client last observed it is rejected. Another writer may have just
      confirmed a different valuation (superseding the prior one and moving
      Asset.current_value_cents), so the confirming writer's basis is stale.
    error_id: ERR_STALE_ASSET_VERSION
    http_status: 412
  - rule_id: reforecast-accept-stale-plan
    parent_entity: BusinessPlan
    write_endpoint: "POST /api/reforecasts/{id}/accept"
    occ_field: expected_plan_version
    description: |
      Accepting a ReForecast against a BusinessPlan whose version has advanced
      since the client last observed it is rejected. The plan's budget lines may
      have been rewritten by an earlier applied reforecast or by actuals
      acceptance, so the acceptor's view of remaining-month budgets is stale.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
  - rule_id: capital-approve-stale-plan
    parent_entity: BusinessPlan
    write_endpoint: "POST /api/capital-projects/{id}/approve"
    occ_field: expected_plan_version
    description: |
      Approving a CapitalProject against a BusinessPlan whose version has
      advanced since the committee member last observed it is rejected. A prior
      approval has already drawn down plan.available_capital_cents, so the
      approver's budget basis is stale.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: annualized_noi
    trigger: "ActualsReport ACCEPTED (recompute); read by covenant_measure, valuation INTERNAL_CAP, LenderReport submit, decision_trigger_scan"
    algorithm: aggregation
    formula: |
      Let plan = the asset's APPROVED BusinessPlan (Asset.current_plan_id).
      Let M = number of distinct month_index values in 1..12 for which the plan
      has at least one BudgetLine with has_actual == true.
      If M == 0: result is null (undefined; callers treat as "no evidence").
      ytd_noi = SUM over lines with has_actual of
                ( +actual_amount_cents if category in {RENT_REVENUE, PARKING_REVENUE, OTHER_REVENUE}
                  -actual_amount_cents if category in the 7 expense categories ).
      TRAILING_ACTUALS: annualized = round_half_up(ytd_noi * 12 / M)
      BUDGET_BASELINE:  annualized = plan.total_revenue_budget_cents - plan.total_opex_budget_cents
    input_set: "BudgetLines of the asset's APPROVED plan only; CAPITAL category excluded; lines without has_actual excluded from ytd and from M"
    constants:
      MONTHS_PER_YEAR: 12
    precision: "integer cents, round_half_up on the annualization division"
    variants:
      - name: TRAILING_ACTUALS
        when: "covenant tests, INTERNAL_CAP valuations, lender reports, asset.current_annualized_noi_cents"
        difference: "Scales actual posted NOI to a full year; null when M == 0; changes as actuals arrive"
      - name: BUDGET_BASELINE
        when: "plan underwriting reads (variance-summary comparison column)"
        difference: "Static full-year budget NOI; ignores actuals entirely; identical inputs generally yield a different value than TRAILING_ACTUALS"

  - name: implied_valuation
    trigger: "Valuation creation (POST /api/valuations)"
    algorithm: dual_method_pricing
    formula: |
      EXTERNAL_APPRAISAL: implied_value_cents = appraised_value_cents (as input).
      INTERNAL_CAP:
        noi_used_cents = Asset.current_annualized_noi_cents (TRAILING_ACTUALS);
        if null -> ERR_VALUATION_NO_NOI_EVIDENCE.
        implied_value_cents = round_half_up(noi_used_cents * 10000 / cap_rate_bps).
    input_set: "The draft Valuation's fields plus the asset's current annualized NOI"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: EXTERNAL_APPRAISAL
        when: "method == EXTERNAL_APPRAISAL"
        difference: "Value taken directly from appraiser input; ignores NOI"
      - name: INTERNAL_CAP
        when: "method == INTERNAL_CAP"
        difference: "Value derived by capitalizing trailing NOI; same asset state generally yields a different implied value than the appraisal"

  - name: covenant_measure
    trigger: "POST /api/covenant-tests (computed at creation, immutable thereafter)"
    algorithm: threshold
    formula: |
      annual_debt_service_cents = loan.principal_balance_cents * loan.annual_interest_rate_bps / 10000
        (interest-only; this division is exact-integer when principal*rate is divisible by 10000,
         otherwise round_half_up).
      noi = annualized_noi(asset, TRAILING_ACTUALS); if null -> ERR_NO_NOI_EVIDENCE
        (applies to MIN_DSCR and MIN_DEBT_YIELD).
      MIN_DSCR:        measured_value_bps = round_half_up(noi * 10000 / annual_debt_service_cents)
                       PASS iff measured_value_bps >= covenant.threshold_bps
      MIN_DEBT_YIELD:  measured_value_bps = round_half_up(noi * 10000 / loan.principal_balance_cents)
                       PASS iff measured_value_bps >= covenant.threshold_bps
      MAX_LTV:         v = latest CONFIRMED Valuation of the asset by effective_date
                       (effective dates strictly increase per the ERR_VALUATION_REGRESSIVE rule,
                        so no tie is possible; any residual tie would resolve by greater created_at);
                       if none, or v.effective_date is more than 270 days before the clock date
                       -> ERR_STALE_VALUATION (the test is not recorded).
                       measured_value_bps = round_half_up(loan.principal_balance_cents * 10000 / v.implied_value_cents)
                       annualized_noi_cents_used = null
                       PASS iff measured_value_bps <= covenant.threshold_bps
    input_set: "Covenant's loan; asset's APPROVED plan actuals; asset's latest CONFIRMED valuation (MAX_LTV only)"
    constants:
      LTV_VALUATION_MAX_AGE_DAYS: 270
    precision: "integer bps, round_half_up"

  - name: line_variance
    trigger: "ActualsReport ACCEPTED; reforecast accept; budget line creation (budget side)"
    algorithm: aggregation
    formula: |
      variance_cents = actual_amount_cents - budget_amount_cents
      variance_bps:
        if budget_amount_cents > 0: round_half_up((actual_amount_cents - budget_amount_cents) * 10000 / budget_amount_cents)
        if budget_amount_cents == 0 and actual_amount_cents == 0: 0
        if budget_amount_cents == 0 and actual_amount_cents > 0: 1000000  (i.e., 10000% — pinned cap, no infinity)
      favorable flag (variance-summary only): for revenue categories favorable iff variance_cents >= 0;
        for expense categories favorable iff variance_cents <= 0.
    input_set: "Single BudgetLine after actual posting"
    constants:
      ZERO_BUDGET_NONZERO_ACTUAL_BPS: 1000000
    precision: "integer cents / integer bps, round_half_up"

  - name: recommended_lease_rate
    trigger: "POST /api/lease-strategies/{id}/recommend"
    algorithm: tiered_pricing
    formula: |
      occupancy tier on current_occupancy_pct:
        [0,70)   -> adj_bps = -1000
        [70,85)  -> adj_bps = -500
        [85,95)  -> adj_bps = 0
        [95,100] -> adj_bps = +500
      adjusted_market = round_half_up(market_comp_rate_psf_cents * (10000 + adj_bps) / 10000)
      floor_rate   = round_half_up(proposed_asking_rate_psf_cents * 9500 / 10000)
      ceiling_rate = round_half_up(market_comp_rate_psf_cents * 11000 / 10000)
      recommended_rate_psf_cents = min(max(adjusted_market, floor_rate), ceiling_rate)
    input_set: "Single LeaseStrategy draft"
    constants:
      TIER1_MAX: 70
      TIER2_MAX: 85
      TIER3_MAX: 95
      TIER1_ADJ_BPS: -1000
      TIER2_ADJ_BPS: -500
      TIER3_ADJ_BPS: 0
      TIER4_ADJ_BPS: 500
      FLOOR_OF_PROPOSED_BPS: 9500
      CEILING_OF_MARKET_BPS: 11000
    precision: "integer cents, round_half_up at each multiplication step before the clamp"

  - name: reforecast_spread
    trigger: "POST /api/reforecasts/{id}/accept (APPLIED transition)"
    algorithm: waterfall_allocation
    formula: |
      For each lines[] entry (category C, revised_annual_amount_cents R):
        ytd_actual_C = SUM of actual_amount_cents over the plan's BudgetLines of category C
                       with month_index < effective_from_month and has_actual == true.
        elapsed_budget_C = SUM of budget_amount_cents over lines of category C
                       with month_index < effective_from_month and has_actual == false.
        remaining_C = R - ytd_actual_C - elapsed_budget_C
                      (must be >= 0 else ERR_REFORECAST_BELOW_ACTUALS)
        n = 12 - effective_from_month + 1  (count of remaining months, inclusive)
        per_month = floor(remaining_C / n)
        For months m = effective_from_month .. 11: line(C, m).budget_amount_cents := per_month
        For month 12: line(C, 12).budget_amount_cents := remaining_C - per_month * (n - 1)
        Lines that do not exist for (C, m) are CREATED with that budget; existing lines are overwritten.
        Elapsed months (< effective_from_month) are never touched.
        CAPITAL category is never part of a reforecast (validation).
      INVARIANT (Q2): after apply, for every reforecasted category C:
        SUM over m=1..12 of (actual_amount_cents if has_actual else budget_amount_cents) == R exactly.
      Rounding order is pinned: floor per month first, single remainder absorbed by month 12.
      (Never round each month independently of the total.)
    input_set: "The ReForecast's 9 category entries; the plan's BudgetLines"
    constants: {}
    precision: "integer cents; floor for per-month, exact remainder on final month"

  - name: scorecard_composite
    trigger: "PerformanceScorecard creation"
    algorithm: weighted_scoring
    formula: |
      occ_score  = occupancy_pct
      coll_score = collections_pct
      exp_score  = max(0, 100 - floor(abs(expense_variance_bps) / 50))
      ren_score  = renewal_rate_pct
      composite_score = round_half_up((30*occ_score + 30*coll_score + 25*exp_score + 15*ren_score) / 100)
      rating:
        composite_score >= 85 -> EXCELLENT
        70 <= composite_score <= 84 -> SATISFACTORY
        55 <= composite_score <= 69 -> WATCH
        composite_score < 55 -> PROBATION
    input_set: "Single PerformanceScorecard input metrics"
    constants:
      W_OCC: 30
      W_COLL: 30
      W_EXP: 25
      W_REN: 15
      EXP_BPS_PER_POINT: 50
      EXCELLENT_MIN: 85
      SATISFACTORY_MIN: 70
      WATCH_MIN: 55
    precision: "integer score 0..100, round_half_up on final division"

  - name: capital_availability
    trigger: "CapitalProject approve/complete/cancel; FundingDraw release; plan reads"
    algorithm: aggregation
    formula: |
      reserved_capital_cents = SUM(p.approved_amount_cents - p.drawn_cents)
        over projects p of the plan with status in {APPROVED, IN_PROGRESS}
      drawn_capital_cents = SUM(p.drawn_cents)
        over projects p of the plan with status in {APPROVED, IN_PROGRESS, COMPLETED, CANCELLED}
      available_capital_cents = total_capital_budget_cents - reserved_capital_cents - drawn_capital_cents
      INVARIANT (Q1): at all times,
        total_capital_budget_cents == available_capital_cents + reserved_capital_cents + drawn_capital_cents
      Approval gate: not is_emergency -> requested_amount_cents <= available_capital_cents
      (equality allowed: full draw-down to zero is valid).
    input_set: "All CapitalProjects of the plan; plan CAPITAL lines"
    constants: {}
    precision: "integer cents"

  - name: capital_schedule_capacity
    trigger: "CapitalProject approve"
    algorithm: interval_merge
    formula: |
      monthly_cap = floor(plan.total_capital_budget_cents / 12)
      For a candidate project with span s..e and computed per-month vector:
        spend(m) = monthly_spend_cents for m in [s, e-1]; final_month_spend_cents for m = e
      For each m in [s, e]:
        committed(m) = SUM of spend_p(m) over OTHER projects p of the same plan
          with status in {APPROVED, IN_PROGRESS} whose [s_p, e_p] contains m
        require committed(m) + spend(m) <= monthly_cap else ERR_CAPITAL_SCHEDULE_OVER_COMMITTED.
      Intervals are closed at both ends; a project ending at month e and another starting at
      month e collide (both occupy month e).
    input_set: "Projects of the same plan in {APPROVED, IN_PROGRESS} plus the candidate"
    constants: {}
    precision: "integer cents; floor on monthly_cap"

  - name: decision_trigger_scan
    trigger: "DispositionDecision creation (POST /api/disposition-decisions) — snapshot computed at creation"
    algorithm: threshold
    formula: |
      dscr_bps_snapshot: latest CovenantTest (by created_at DESC) of a MIN_DSCR covenant on the
        asset's active loan; null when no active loan or no DSCR test exists.
      ltv_bps_snapshot: if an active loan exists AND a CONFIRMED valuation exists:
        round_half_up(principal * 10000 / current_value_cents); else null.
      hold_years_elapsed = floor(months_between(asset.acquisition_date, clock date) / 12)
        months_between = (y2-y1)*12 + (m2-m1) - (1 if d2 < d1 else 0)
      value_gain_bps = round_half_up((current_value_cents - acquisition_price_cents) * 10000
        / acquisition_price_cents) when current_value_cents is not null; else null.
      refinance_signal = (dscr_bps_snapshot != null AND dscr_bps_snapshot >= 14000)
        AND (ltv_bps_snapshot != null AND ltv_bps_snapshot <= 6000)
        AND (months_to_maturity <= 18, months_to_maturity = months_between(clock, loan.maturity_date))
      sell_signal = (hold_years_elapsed >= asset.hold_period_years)
        OR (value_gain_bps != null AND value_gain_bps >= 2500)
      Gate: trigger_type SELL requires sell_signal == true; REFINANCE requires refinance_signal == true;
        HOLD always allowed (ERR_DECISION_TRIGGER_NOT_ARMED).
    input_set: "Asset, its active loan, latest DSCR CovenantTest, latest CONFIRMED Valuation, logical clock"
    constants:
      REFI_MIN_DSCR_BPS: 14000
      REFI_MAX_LTV_BPS: 6000
      REFI_MAX_MONTHS_TO_MATURITY: 18
      SELL_MIN_VALUE_GAIN_BPS: 2500
    precision: "integer bps, round_half_up"

  - name: portfolio_risk_posture
    trigger: "Any loan status change; covenant waive; asset sale cascade"
    algorithm: threshold
    formula: |
      watch_count = number of loans with status == WATCH on assets of the portfolio
      default_count = number of loans with status == DEFAULT on assets of the portfolio
      if default_count >= 1 OR watch_count >= 2 -> RESTRICTED
      elif watch_count == 1 -> ELEVATED
      else -> NORMAL
    input_set: "Loans of assets with status != SOLD belonging to the portfolio"
    constants:
      WATCH_RESTRICTED_COUNT: 2
    precision: "counts"

  - name: portfolio_performance_report
    trigger: "GET /api/portfolios/{id}/performance-report"
    algorithm: aggregation
    formula: |
      Over assets with status in {OWNED, LISTED_FOR_SALE, UNDER_CONTRACT}:
        total_value_cents = SUM(asset.current_value_cents) treating null as 0
        portfolio_noi_cents = SUM(asset.current_annualized_noi_cents) treating null as 0
        weighted_occupancy_pct = round_half_up(
          SUM(occ * net_rentable_sqft) / SUM(net_rentable_sqft) ) where occ is the
          occupancy_pct of the asset's most recent FINALIZED scorecard (by period_label ASC,
          tie created_at ASC); assets without a FINALIZED scorecard contribute 0 occupancy
          but DO contribute their sqft to the denominator.
        implied_cap_rate_bps = total_value_cents > 0
          ? round_half_up(portfolio_noi_cents * 10000 / total_value_cents) : null
    input_set: "Non-sold assets of the portfolio; latest FINALIZED scorecard per asset"
    constants: {}
    precision: "integer outputs, round_half_up"

  - name: lender_report_snapshot
    trigger: "LenderReport submit"
    algorithm: projection
    formula: |
      noi_ttm_cents = annualized_noi(asset, TRAILING_ACTUALS); stored as null when undefined
        (note: lender report submit does NOT require NOI evidence; dscr snapshot is simply null)
      dscr_bps = round_half_up(noi_ttm_cents * 10000 / annual_debt_service_cents) when noi available else null
      ltv_bps = round_half_up(principal * 10000 / asset.current_value_cents) when
        a CONFIRMED valuation exists else null
      quarter_end_date from period_label: Q1 -> Mar 31, Q2 -> Jun 30, Q3 -> Sep 30, Q4 -> Dec 31 of label year
      due_date = quarter_end_date + 45 days (calendar arithmetic)
      is_late = date(submitted_at) > due_date
    input_set: "Loan, asset plan actuals, latest CONFIRMED valuation, logical clock"
    constants:
      REPORT_DUE_DAYS_AFTER_QUARTER_END: 45
    precision: "integer cents/bps, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed; role must be a declared role name"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles list; conditional authorization: emergency capital approval restricted to PortfolioDirector; for PropertyManager role on asset-scoped writes, X-User-ID must equal Asset.property_manager_id (ownership)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path and body-referenced resources exist (validated left-to-right): portfolio, asset, plan, line, report, project, draw, strategy, loan, covenant, valuation, scorecard, reforecast, decision"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version matches the parent entity's current version"
    error_id: ERR_STALE_ASSET_VERSION / ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /api/business-plans; POST /api/valuations/{id}/confirm; POST /api/reforecasts/{id}/accept; POST /api/capital-projects/{id}/approve"
  - priority: 5
    category: state
    check: "Target resource in a state that permits the transition (from-state listed in §1.2); terminal states reject all transitions; domain state errors: plan not APPROVED where required, project not fundable, covenant not testable, loan not reportable, asset not operating/sellable"
    error_id: "ERR_INVALID_STATE_TRANSITION / ERR_PLAN_NOT_APPROVED / ERR_PROJECT_NOT_FUNDABLE / ERR_COVENANT_NOT_TESTABLE / ERR_LOAN_NOT_REPORTABLE / ERR_ASSET_NOT_OPERATING / ERR_ASSET_NOT_SELLABLE / ERR_PROJECT_NEVER_FUNDED / ERR_COVENANT_NOT_WAIVABLE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: capital approval X-User-ID != CapitalProject.proposed_by_user_id; disposition ratify X-User-ID != DispositionDecision.created_by_user_id"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 403
    applies_to: "POST /api/capital-projects/{id}/approve; POST /api/disposition-decisions/{id}/ratify"
  - priority: 7
    category: business_safety
    check: "PropertyManager of the asset must be ACTIVE when approving a BusinessPlan; Portfolio.risk_posture must not be RESTRICTED for plan approval and non-emergency capital approval"
    error_id: ERR_MANAGER_SUSPENDED / ERR_PORTFOLIO_RESTRICTED
    http_status: 409
    applies_to: "POST /api/business-plans/{id}/approve; POST /api/capital-projects/{id}/approve"
  - priority: 8
    category: business_referential
    check: "Body FKs resolve and are coherent: ActualsReport lines' budget_line_id belong to plan_id; CapitalProject.plan_id belongs to CapitalProject.asset_id; Covenant/Loan asset chain consistent"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "POST /api/actuals-reports; POST /api/capital-projects; POST /api/budget-lines"
  - priority: 9
    category: business_constraint
    check: "Shape/uniqueness: period_label format YYYY-Qn; one ActualsReport per (plan, month) not already ACCEPTED; one CovenantTest per (covenant, period_label); one PerformanceScorecard per (asset, period_label); one BusinessPlan in {DRAFT, SUBMITTED} per (asset, fiscal_year); at most one Loan in {CURRENT, WATCH, DEFAULT} per asset; budget-lines unique (plan, category, month); reforecast lines cover each of the 9 non-CAPITAL categories exactly once (CAPITAL forbidden); enum values valid; amounts positive"
    error_id: ERR_INVALID_REQUEST / ERR_DUPLICATE_PLAN / ERR_DUPLICATE_ACTUALS / ERR_DUPLICATE_COVENANT_TEST / ERR_DUPLICATE_SCORECARD / ERR_LOAN_EXISTS / ERR_DUPLICATE_BUDGET_LINE / ERR_REFORECAST_CATEGORIES_INCOMPLETE
    http_status: 409
    applies_to: "create endpoints"
  - priority: 10
    category: business_temporal
    check: "Clock-derived rules: acquisition/valuation effective_date not in future; valuation confirm strictly newer effective_date (ERR_VALUATION_REGRESSIVE); MAX_LTV test requires CONFIRMED valuation effective within 270 days (ERR_STALE_VALUATION); actuals month must not exceed plan's current fiscal month (ERR_FUTURE_PERIOD); reforecast creation only when plan fiscal month in {4,7,10} (ERR_REFORECAST_CADENCE) and reforecast_count < 3 (ERR_REFORECAST_LIMIT); LenderReport quarter adjacency (ERR_LENDER_REPORT_GAP)"
    error_id: "ERR_FUTURE_PERIOD / ERR_VALUATION_REGRESSIVE / ERR_STALE_VALUATION / ERR_REFORECAST_CADENCE / ERR_REFORECAST_LIMIT / ERR_LENDER_REPORT_GAP"
    http_status: 422
    applies_to: "create/confirm/submit endpoints with temporal semantics"
  - priority: 11
    category: business_fiscal
    check: "Money checks last: plan capital availability (ERR_CAPITAL_BUDGET_EXCEEDED), monthly schedule capacity (ERR_CAPITAL_SCHEDULE_OVER_COMMITTED), draw cumulative <= approved (ERR_DRAW_EXCEEDS_AUTHORIZATION), reforecast revised annual >= YTD actuals per category (ERR_REFORECAST_BELOW_ACTUALS). Within this tier evaluation order is pinned: availability before schedule before draw before reforecast"
    error_id: "ERR_CAPITAL_BUDGET_EXCEEDED / ERR_CAPITAL_SCHEDULE_OVER_COMMITTED / ERR_DRAW_EXCEEDS_AUTHORIZATION / ERR_REFORECAST_BELOW_ACTUALS"
    http_status: 409
    applies_to: "capital approve, draw create/approve, reforecast accept"
  - priority: 12
    category: business_constraint
    check: "Plan completeness at submit: each of the 10 BudgetLine categories has >= 1 line"
    error_id: ERR_PLAN_LINES_INCOMPLETE
    http_status: 422
    applies_to: "POST /api/business-plans/{id}/submit"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/malformed/unknown role" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not in endpoint's roles list, or PropertyManager acting on an asset it does not manage, or non-PortfolioDirector approving an emergency capital project" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, bad enum, non-positive amount, bad period_label format, month range inverted, missing conditional field (e.g., cap_rate_bps for INTERNAL_CAP), forbidden conditional field (e.g., appraised_value_cents for INTERNAL_CAP)" }
  - { id: ERR_STALE_ASSET_VERSION, http: 412, condition: "expected_asset_version != Asset.version on plan create or valuation confirm" }
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "expected_plan_version != BusinessPlan.version on reforecast accept or capital approve" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Entity not in a from-state permitting the requested transition (includes terminal-state lockdown)" }
  - { id: ERR_DUPLICATE_PLAN, http: 409, condition: "A BusinessPlan in {DRAFT, SUBMITTED} already exists for (asset_id, fiscal_year)" }
  - { id: ERR_PLAN_HAS_ACTIVE_PROJECTS, http: 409, condition: "Create-with-supersede blocked: the APPROVED plan has CapitalProjects in {APPROVED, IN_PROGRESS}" }
  - { id: ERR_PLAN_LINES_INCOMPLETE, http: 422, condition: "Plan submit: fewer than 10 categories have lines" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 409, condition: "Operation requires the plan to be APPROVED (actuals create, reforecast create/accept, capital approve)" }
  - { id: ERR_ASSET_NOT_OPERATING, http: 409, condition: "Operation requires Asset.status in an operating state (e.g., plan submit needs OWNED; strategy ratify needs OWNED or LISTED_FOR_SALE)" }
  - { id: ERR_ASSET_NOT_SELLABLE, http: 409, condition: "record-sale action invalid for the asset's status or no RATIFIED/EXECUTED SELL decision exists" }
  - { id: ERR_MANAGER_SUSPENDED, http: 409, condition: "Plan approval blocked: asset's PropertyManager is SUSPENDED (or TERMINATED)" }
  - { id: ERR_MANAGER_IN_USE, http: 409, condition: "Terminate blocked: manager still referenced by a non-SOLD asset" }
  - { id: ERR_PORTFOLIO_RESTRICTED, http: 409, condition: "Portfolio.risk_posture == RESTRICTED blocks plan approval and non-emergency capital approval" }
  - { id: ERR_PORTFOLIO_NOT_EMPTY, http: 409, condition: "Archive blocked: portfolio still has assets not SOLD" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "Segregation of duties: approver/ratifier X-User-ID equals the creator's user id" }
  - { id: ERR_CAPITAL_BUDGET_EXCEEDED, http: 409, condition: "Non-emergency approval would drive plan.available_capital_cents negative" }
  - { id: ERR_CAPITAL_SCHEDULE_OVER_COMMITTED, http: 409, condition: "Monthly committed capital would exceed floor(total_capital_budget_cents/12) in some overlapping month" }
  - { id: ERR_PROJECT_NOT_FUNDABLE, http: 409, condition: "Draw create/approve against a project not in {APPROVED, IN_PROGRESS}" }
  - { id: ERR_DRAW_EXCEEDS_AUTHORIZATION, http: 409, condition: "project.drawn_cents + amount_cents > project.approved_amount_cents" }
  - { id: ERR_PROJECT_NEVER_FUNDED, http: 409, condition: "Complete requires drawn_cents > 0" }
  - { id: ERR_DUPLICATE_BUDGET_LINE, http: 409, condition: "A line already exists for (plan_id, category, month_index)" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "Body FK coherence failure: actuals line not in plan or month mismatch; project plan not of same asset" }
  - { id: ERR_DUPLICATE_ACTUALS, http: 409, condition: "An ACCEPTED ActualsReport already exists for (plan_id, month_index), or a referenced line already has_actual" }
  - { id: ERR_FUTURE_PERIOD, http: 422, condition: "Actuals month_index exceeds the plan's current fiscal month under the logical clock" }
  - { id: ERR_REFORECAST_CADENCE, http: 422, condition: "Reforecast creation when the plan's current fiscal month is not in {4, 7, 10}" }
  - { id: ERR_REFORECAST_LIMIT, http: 409, condition: "Plan already has 3 APPLIED reforecasts" }
  - { id: ERR_REFORECAST_BELOW_ACTUALS, http: 409, condition: "revised_annual_amount_cents below the category's YTD posted actuals at accept time" }
  - { id: ERR_REFORECAST_CATEGORIES_INCOMPLETE, http: 422, condition: "Reforecast lines must cover each of the 9 non-CAPITAL categories exactly once (CAPITAL forbidden)" }
  - { id: ERR_DUPLICATE_COVENANT_TEST, http: 409, condition: "A CovenantTest already exists for (covenant_id, period_label)" }
  - { id: ERR_COVENANT_NOT_TESTABLE, http: 409, condition: "Covenant WAIVED, or loan in a terminal state {DEFAULT, REFINANCED, PAID_OFF}" }
  - { id: ERR_NO_NOI_EVIDENCE, http: 409, condition: "DSCR/debt-yield test or lender-report snapshot requires at least one month of accepted actuals" }
  - { id: ERR_STALE_VALUATION, http: 409, condition: "MAX_LTV test: no CONFIRMED valuation, or its effective_date is more than 270 days before the clock date" }
  - { id: ERR_COVENANT_NOT_WAIVABLE, http: 409, condition: "Waive requires covenant IN_BREACH" }
  - { id: ERR_VALUATION_REGRESSIVE, http: 409, condition: "Confirm blocked: effective_date must be strictly after the current CONFIRMED valuation's effective_date" }
  - { id: ERR_VALUATION_NO_NOI_EVIDENCE, http: 409, condition: "INTERNAL_CAP valuation requires Asset.current_annualized_noi_cents (trailing actuals) to exist" }
  - { id: ERR_DECISION_TRIGGER_NOT_ARMED, http: 409, condition: "SELL/REFINANCE decision created while the corresponding trigger signal evaluates false" }
  - { id: ERR_LOAN_EXISTS, http: 409, condition: "Asset already has a loan in {CURRENT, WATCH, DEFAULT}" }
  - { id: ERR_LOAN_NOT_REPORTABLE, http: 409, condition: "LenderReport submit requires loan in {CURRENT, WATCH}" }
  - { id: ERR_LENDER_REPORT_GAP, http: 409, condition: "Creating a report for quarter Q requires the previous calendar quarter's report to exist in {SUBMITTED, ACKNOWLEDGED}; also rejects a duplicate period_label for the same loan" }
  - { id: ERR_DUPLICATE_SCORECARD, http: 409, condition: "A PerformanceScorecard already exists for (asset_id, period_label) in any status" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default time 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Advance the server's logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. to_iso8601 must be strictly after the current logical time."
    roles: [PortfolioDirector]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["No direct entity mutation; time-derived rules (fiscal month, lateness, cure windows) evaluate against the new clock on subsequent calls"]

  # --- Portfolio ---
  - method: POST
    path: "/api/portfolios"
    description: "Create a portfolio"
    roles: [PortfolioDirector]
    code: 201
    input: [name, "base_currency?", "fiscal_year_start_month?"]
    output: Portfolio
    side_effects: ["status=ACTIVE, risk_posture=NORMAL, total_value_cents=0"]
  - method: GET
    path: "/api/portfolios/{id}"
    description: "Get a portfolio"
    roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst]
    code: 200
    input: []
    output: Portfolio
    side_effects: []
  - method: POST
    path: "/api/portfolios/{id}/archive"
    description: "Archive a portfolio whose assets are all SOLD"
    roles: [PortfolioDirector]
    code: 200
    input: []
    output: Portfolio
    side_effects: ["status -> ARCHIVED"]
  - method: GET
    path: "/api/portfolios/{id}/performance-report"
    description: "Computed portfolio rollup per calc portfolio_performance_report"
    roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst]
    code: 200
    input: []
    output: "{ total_value_cents: integer, portfolio_noi_cents: integer, weighted_occupancy_pct: integer, implied_cap_rate_bps: integer, asset_count: integer }"
    side_effects: []

  # --- PropertyManager ---
  - method: POST
    path: "/api/property-managers"
    description: "Create a property manager"
    roles: [PortfolioDirector]
    code: 201
    input: [firm_name, contact_email]
    output: PropertyManager
    side_effects: ["status=ACTIVE, probation_streak=0"]
  - method: GET
    path: "/api/property-managers/{id}"
    description: "Get a property manager"
    roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst]
    code: 200
    input: []
    output: PropertyManager
    side_effects: []
  - method: POST
    path: "/api/property-managers/{id}/suspend"
    description: "Suspend a manager; terminate=true transitions to TERMINATED instead"
    roles: [PortfolioDirector]
    code: 200
    input: ["terminate?"]
    output: PropertyManager
    side_effects: ["status -> SUSPENDED (or TERMINATED when terminate=true and no non-SOLD asset references the manager)"]
  - method: POST
    path: "/api/property-managers/{id}/reinstate"
    description: "Reinstate a SUSPENDED manager"
    roles: [PortfolioDirector]
    code: 200
    input: []
    output: PropertyManager
    side_effects: ["status -> ACTIVE; probation_streak := 0"]

  # --- Asset ---
  - method: POST
    path: "/api/assets"
    description: "Create an asset in a portfolio, managed by a property manager"
    roles: [PortfolioDirector]
    code: 201
    input: [portfolio_id, property_manager_id, name, address, asset_class, net_rentable_sqft, acquisition_price_cents, acquisition_date, hold_period_years]
    output: Asset
    side_effects: ["status=OWNED"]
  - method: GET
    path: "/api/assets/{id}"
    description: "Get an asset"
    roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst]
    code: 200
    input: []
    output: Asset
    side_effects: []
  - method: POST
    path: "/api/assets/{id}/record-sale"
    description: "Disposition pipeline: action=CONTRACT (LISTED_FOR_SALE -> UNDER_CONTRACT, requires sale_agreed_price_cents), action=CLOSE (UNDER_CONTRACT -> SOLD, requires final_sale_price_cents), action=DELIST (LISTED_FOR_SALE -> OWNED)"
    roles: [PortfolioDirector]
    code: 200
    input: [action, "sale_agreed_price_cents?", "final_sale_price_cents?"]
    output: Asset
    side_effects: ["On CLOSE: loan -> PAID_OFF (covenants -> WAIVED); plans -> CLOSED (projects -> CANCELLED with capital release; reforecasts -> REJECTED); portfolio aggregates recomputed"]

  # --- BusinessPlan ---
  - method: POST
    path: "/api/business-plans"
    description: "Create a DRAFT annual plan for an asset+fiscal year; supersedes an APPROVED plan of the same (asset, fiscal_year) when it has no active projects"
    roles: [AssetManager]
    code: 201
    input: [asset_id, fiscal_year, expected_asset_version]
    output: BusinessPlan
    side_effects: ["If an APPROVED plan exists for (asset, fiscal_year): it -> SUPERSEDED (its DRAFT/SUBMITTED reforecasts -> REJECTED); increments Asset.version by 1"]
  - method: GET
    path: "/api/business-plans/{id}"
    description: "Get a business plan"
    roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst]
    code: 200
    input: []
    output: BusinessPlan
    side_effects: []
  - method: POST
    path: "/api/business-plans/{id}/submit"
    description: "Submit a DRAFT plan for review; also the revise path from REJECTED (resets to DRAFT then submits)"
    roles: [AssetManager]
    code: 200
    input: []
    output: BusinessPlan
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/api/business-plans/{id}/approve"
    description: "Approve a SUBMITTED plan (gated on manager standing and portfolio posture)"
    roles: [PortfolioDirector]
    code: 200
    input: []
    output: BusinessPlan
    side_effects: ["status -> APPROVED; Asset.current_plan_id set; other-fiscal-year APPROVED plan of same asset -> CLOSED"]
  - method: POST
    path: "/api/business-plans/{id}/reject"
    description: "Reject a SUBMITTED plan"
    roles: [PortfolioDirector]
    code: 200
    input: ["reason?"]
    output: BusinessPlan
    side_effects: ["status -> REJECTED"]
  - method: GET
    path: "/api/business-plans/{id}/variance-summary"
    description: "Per-category budget vs actual variance rollup (BUDGET_BASELINE vs TRAILING_ACTUALS columns)"
    roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst]
    code: 200
    input: []
    output: "{ plan_id: string, categories: array, total_budget_noi_cents: integer, ytd_actual_noi_cents: integer, annualized_actual_noi_cents: integer }"
    side_effects: []

  # --- BudgetLine ---
  - method: POST
    path: "/api/budget-lines"
    description: "Bulk-atomic creation of budget lines while the plan is in DRAFT or REJECTED (revision loop); payload lines[] each { category, month_index, budget_amount_cents }; any failure rejects the whole request"
    roles: [AssetManager]
    code: 201
    input: [plan_id, lines]
    output: "BudgetLine[]"
    side_effects: ["Plan budget totals recomputed; plan.version +1"]

  # --- ActualsReport ---
  - method: POST
    path: "/api/actuals-reports"
    description: "Property manager posts monthly actuals against plan lines (created directly in SUBMITTED)"
    roles: [PropertyManager]
    code: 201
    input: [plan_id, month_index, lines]
    output: ActualsReport
    side_effects: ["status=SUBMITTED; submitted_by_user_id := X-User-ID"]
  - method: POST
    path: "/api/actuals-reports/{id}/accept"
    description: "Asset manager accepts an actuals report, posting actuals to budget lines"
    roles: [AssetManager]
    code: 200
    input: []
    output: ActualsReport
    side_effects: ["Line actuals/variance posted; plan ytd_actual_noi_cents recomputed; asset.current_annualized_noi_cents recomputed; plan.version +1"]
  - method: POST
    path: "/api/actuals-reports/{id}/reject"
    description: "Asset manager rejects an actuals report"
    roles: [AssetManager]
    code: 200
    input: ["reason?"]
    output: ActualsReport
    side_effects: ["status -> REJECTED"]

  # --- CapitalProject ---
  - method: POST
    path: "/api/capital-projects"
    description: "Propose a capital project against an asset's plan"
    roles: [AssetManager]
    code: 201
    input: [asset_id, plan_id, name, requested_amount_cents, sched_start_month, sched_end_month, "is_emergency?"]
    output: CapitalProject
    side_effects: ["status=PROPOSED; proposed_by_user_id := X-User-ID"]
  - method: GET
    path: "/api/capital-projects/{id}"
    description: "Get a capital project"
    roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst]
    code: 200
    input: []
    output: CapitalProject
    side_effects: []
  - method: POST
    path: "/api/capital-projects/{id}/approve"
    description: "Committee approval with OCC on the plan; reserves plan capital"
    roles: [InvestmentCommittee, PortfolioDirector]
    code: 200
    input: [expected_plan_version]
    output: CapitalProject
    side_effects: ["status -> APPROVED; plan capital reserved; plan.version +1"]
  - method: POST
    path: "/api/capital-projects/{id}/reject"
    description: "Reject a PROPOSED project"
    roles: [InvestmentCommittee, PortfolioDirector]
    code: 200
    input: ["reason?"]
    output: CapitalProject
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/api/capital-projects/{id}/start"
    description: "Mark an APPROVED project IN_PROGRESS"
    roles: [AssetManager]
    code: 200
    input: []
    output: CapitalProject
    side_effects: ["status -> IN_PROGRESS"]
  - method: POST
    path: "/api/capital-projects/{id}/complete"
    description: "Complete an IN_PROGRESS project; unused authorization returns to the plan"
    roles: [AssetManager]
    code: 200
    input: []
    output: CapitalProject
    side_effects: ["status -> COMPLETED; (approved - drawn) released to plan.available_capital_cents; plan.version +1"]
  - method: POST
    path: "/api/capital-projects/{id}/cancel"
    description: "Cancel an APPROVED or IN_PROGRESS project; reservation released, draws stay sunk"
    roles: [AssetManager]
    code: 200
    input: []
    output: CapitalProject
    side_effects: ["status -> CANCELLED; (approved - drawn) released; REQUESTED/APPROVED draws -> REJECTED; plan.version +1"]

  # --- FundingDraw ---
  - method: POST
    path: "/api/funding-draws"
    description: "Request a funding draw against a project"
    roles: [AssetManager]
    code: 201
    input: [project_id, amount_cents]
    output: FundingDraw
    side_effects: ["status=REQUESTED; requested_by_user_id := X-User-ID"]
  - method: POST
    path: "/api/funding-draws/{id}/approve"
    description: "Committee approves a draw (cumulative authorization check)"
    roles: [InvestmentCommittee]
    code: 200
    input: []
    output: FundingDraw
    side_effects: ["status -> APPROVED"]
  - method: POST
    path: "/api/funding-draws/{id}/reject"
    description: "Committee rejects a draw"
    roles: [InvestmentCommittee]
    code: 200
    input: ["reason?"]
    output: FundingDraw
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/api/funding-draws/{id}/release"
    description: "Portfolio director releases an APPROVED draw (money movement; role-separated from approval)"
    roles: [PortfolioDirector]
    code: 200
    input: []
    output: FundingDraw
    side_effects: ["status -> RELEASED; project.drawn_cents += amount_cents; project.version +1; plan drawn/available recomputed; plan.version +1"]

  # --- LeaseStrategy ---
  - method: POST
    path: "/api/lease-strategies"
    description: "Draft a leasing strategy for a space type (PM only for own assets)"
    roles: [AssetManager, PropertyManager]
    code: 201
    input: [asset_id, space_type, current_occupancy_pct, proposed_asking_rate_psf_cents, market_comp_rate_psf_cents]
    output: LeaseStrategy
    side_effects: ["status=DRAFT"]
  - method: POST
    path: "/api/lease-strategies/{id}/recommend"
    description: "Analyst runs the rate recommendation (calc recommended_lease_rate)"
    roles: [Analyst]
    code: 200
    input: []
    output: LeaseStrategy
    side_effects: ["status -> RECOMMENDED; recommended_rate_psf_cents computed"]
  - method: POST
    path: "/api/lease-strategies/{id}/ratify"
    description: "Ratify a recommended strategy; supersedes the previously RATIFIED strategy for the same (asset, space_type)"
    roles: [PortfolioDirector]
    code: 200
    input: []
    output: LeaseStrategy
    side_effects: ["status -> RATIFIED; prior RATIFIED same (asset, space_type) -> SUPERSEDED"]
  - method: POST
    path: "/api/lease-strategies/{id}/reject"
    description: "Reject a RECOMMENDED strategy"
    roles: [PortfolioDirector]
    code: 200
    input: ["reason?"]
    output: LeaseStrategy
    side_effects: ["status -> REJECTED"]

  # --- Loan / Covenant / CovenantTest ---
  - method: POST
    path: "/api/loans"
    description: "Originate a loan on an asset (at most one non-terminal loan per asset)"
    roles: [PortfolioDirector]
    code: 201
    input: [asset_id, lender_name, principal_balance_cents, annual_interest_rate_bps, origination_date, maturity_date]
    output: Loan
    side_effects: ["status=CURRENT"]
  - method: GET
    path: "/api/loans/{id}"
    description: "Get a loan"
    roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst]
    code: 200
    input: []
    output: Loan
    side_effects: []
  - method: POST
    path: "/api/covenants"
    description: "Attach a covenant to a loan"
    roles: [PortfolioDirector]
    code: 201
    input: [loan_id, covenant_type, threshold_bps, test_frequency, "cure_period_days?"]
    output: Covenant
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/api/covenants/{id}"
    description: "Get a covenant"
    roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst]
    code: 200
    input: []
    output: Covenant
    side_effects: []
  - method: POST
    path: "/api/covenant-tests"
    description: "Record a quarterly covenant test; measure computed server-side; FAIL cascades breach -> WATCH -> posture"
    roles: [Analyst]
    code: 201
    input: [covenant_id, period_label]
    output: CovenantTest
    side_effects: ["On FAIL: covenant ACTIVE->IN_BREACH (or loan DEFAULT escalation past cure window); loan CURRENT->WATCH; portfolio posture recomputed. On PASS from IN_BREACH: covenant -> ACTIVE; loan may return to CURRENT"]
  - method: POST
    path: "/api/covenants/{id}/waive"
    description: "Lender waives an IN_BREACH covenant"
    roles: [Lender]
    code: 200
    input: []
    output: Covenant
    side_effects: ["status -> WAIVED; loan may return to CURRENT; posture recomputed"]

  # --- Valuation ---
  - method: POST
    path: "/api/valuations"
    description: "Draft a valuation (EXTERNAL_APPRAISAL or INTERNAL_CAP); implied_value_cents computed at creation"
    roles: [Analyst]
    code: 201
    input: [asset_id, effective_date, method, "appraised_value_cents?", "cap_rate_bps?"]
    output: Valuation
    side_effects: ["status=DRAFT; implied_value_cents computed per calc implied_valuation"]
  - method: POST
    path: "/api/valuations/{id}/confirm"
    description: "Confirm a valuation with OCC on the asset; supersedes the prior CONFIRMED valuation"
    roles: [PortfolioDirector]
    code: 200
    input: [expected_asset_version]
    output: Valuation
    side_effects: ["status -> CONFIRMED; prior CONFIRMED -> SUPERSEDED; asset.current_value_cents updated; asset.version +1; portfolio.total_value_cents recomputed"]

  # --- PerformanceScorecard ---
  - method: POST
    path: "/api/performance-scorecards"
    description: "Property manager submits a quarterly scorecard for an asset it manages; composite/rating computed at creation"
    roles: [PropertyManager]
    code: 201
    input: [asset_id, period_label, occupancy_pct, collections_pct, renewal_rate_pct, expense_variance_bps]
    output: PerformanceScorecard
    side_effects: ["status=SUBMITTED; property_manager_id copied from asset; composite_score and rating computed"]
  - method: POST
    path: "/api/performance-scorecards/{id}/review"
    description: "Asset manager marks a scorecard reviewed"
    roles: [AssetManager]
    code: 200
    input: []
    output: PerformanceScorecard
    side_effects: ["status -> REVIEWED"]
  - method: POST
    path: "/api/performance-scorecards/{id}/finalize"
    description: "Asset manager finalizes a scorecard; second consecutive PROBATION suspends the manager"
    roles: [AssetManager]
    code: 200
    input: []
    output: PerformanceScorecard
    side_effects: ["status -> FINALIZED; probation_streak updated; manager suspension cascade at streak 2; composite_score_avg recomputed"]

  # --- ReForecast ---
  - method: POST
    path: "/api/reforecasts"
    description: "Draft a reforecast for the APPROVED plan; only in fiscal months 4/7/10; max 3 applied per plan"
    roles: [AssetManager]
    code: 201
    input: [plan_id, lines]
    output: ReForecast
    side_effects: ["status=DRAFT; label R1/R2/R3 assigned; effective_from_month derived from clock"]
  - method: POST
    path: "/api/reforecasts/{id}/submit"
    description: "Submit a reforecast draft"
    roles: [AssetManager]
    code: 200
    input: []
    output: ReForecast
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/api/reforecasts/{id}/accept"
    description: "Accept (apply) a reforecast with OCC on the plan; rewrites remaining-month budget lines"
    roles: [PortfolioDirector]
    code: 200
    input: [expected_plan_version]
    output: ReForecast
    side_effects: ["status -> APPLIED; budget lines upserted per calc reforecast_spread; plan totals recomputed; reforecast_count += 1; plan.version +1"]
  - method: POST
    path: "/api/reforecasts/{id}/reject"
    description: "Reject a submitted reforecast"
    roles: [PortfolioDirector]
    code: 200
    input: ["reason?"]
    output: ReForecast
    side_effects: ["status -> REJECTED"]

  # --- DispositionDecision ---
  - method: POST
    path: "/api/disposition-decisions"
    description: "Open a refinance/hold/sell decision; trigger snapshot and signals computed at creation"
    roles: [AssetManager]
    code: 201
    input: [asset_id, trigger_type]
    output: DispositionDecision
    side_effects: ["status=SCREENING; snapshots and signal flags computed per calc decision_trigger_scan; unarmed SELL/REFINANCE rejected"]
  - method: POST
    path: "/api/disposition-decisions/{id}/submit-review"
    description: "Move a decision to committee review"
    roles: [AssetManager]
    code: 200
    input: []
    output: DispositionDecision
    side_effects: ["status -> COMMITTEE_REVIEW"]
  - method: POST
    path: "/api/disposition-decisions/{id}/ratify"
    description: "Committee ratifies (SoD: ratifier != creator)"
    roles: [InvestmentCommittee]
    code: 200
    input: []
    output: DispositionDecision
    side_effects: ["status -> RATIFIED"]
  - method: POST
    path: "/api/disposition-decisions/{id}/shelve"
    description: "Committee shelves a decision under review or ratified"
    roles: [InvestmentCommittee]
    code: 200
    input: ["reason?"]
    output: DispositionDecision
    side_effects: ["status -> SHELVED"]
  - method: POST
    path: "/api/disposition-decisions/{id}/execute"
    description: "Execute a ratified decision (payload depends on trigger_type)"
    roles: [PortfolioDirector]
    code: 200
    input: ["extension_years?", "new_loan?"]
    output: DispositionDecision
    side_effects: ["SELL: asset -> LISTED_FOR_SALE. REFINANCE: old loan -> REFINANCED (covenants WAIVED), new loan created CURRENT. HOLD: asset.hold_period_years += extension_years"]

  # --- LenderReport ---
  - method: POST
    path: "/api/lender-reports"
    description: "Draft a quarterly lender report for a loan (quarter adjacency enforced: previous quarter's report must exist in SUBMITTED/ACKNOWLEDGED unless this is the loan's first; the labeled quarter must have ended by the logical clock — quarter_end_date <= clock date, else ERR_FUTURE_PERIOD)"
    roles: [AssetManager]
    code: 201
    input: [loan_id, period_label]
    output: LenderReport
    side_effects: ["status=DRAFT; quarter_end_date/due_date computed"]
  - method: POST
    path: "/api/lender-reports/{id}/submit"
    description: "Submit a lender report; lateness computed and may cascade loan to WATCH"
    roles: [AssetManager]
    code: 200
    input: []
    output: LenderReport
    side_effects: ["status -> SUBMITTED; submitted_at/is_late/snapshots frozen; if late and loan CURRENT -> WATCH; posture recomputed"]
  - method: POST
    path: "/api/lender-reports/{id}/acknowledge"
    description: "Lender acknowledges a submitted report"
    roles: [Lender]
    code: 200
    input: []
    output: LenderReport
    side_effects: ["status -> ACKNOWLEDGED"]

  # --- Reverse-reachability sub-resource GETs (FK discovery) ---
  - { method: GET, path: "/api/portfolios/{id}/assets", description: "List assets of a portfolio", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "Asset[]", side_effects: [] }
  - { method: GET, path: "/api/property-managers/{id}/assets", description: "List assets managed by a property manager", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "Asset[]", side_effects: [] }
  - { method: GET, path: "/api/assets/{id}/business-plans", description: "List plans of an asset", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "BusinessPlan[]", side_effects: [] }
  - { method: GET, path: "/api/business-plans/{id}/budget-lines", description: "List budget lines of a plan, ordered by created_at ASC (creation order; reforecast-created lines append after originals)", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "BudgetLine[]", side_effects: [] }
  - { method: GET, path: "/api/business-plans/{id}/actuals-reports", description: "List actuals reports of a plan", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "ActualsReport[]", side_effects: [] }
  - { method: GET, path: "/api/assets/{id}/capital-projects", description: "List capital projects of an asset", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "CapitalProject[]", side_effects: [] }
  - { method: GET, path: "/api/business-plans/{id}/capital-projects", description: "List capital projects reserved against a plan", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "CapitalProject[]", side_effects: [] }
  - { method: GET, path: "/api/capital-projects/{id}/funding-draws", description: "List draws of a project", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "FundingDraw[]", side_effects: [] }
  - { method: GET, path: "/api/assets/{id}/lease-strategies", description: "List lease strategies of an asset", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "LeaseStrategy[]", side_effects: [] }
  - { method: GET, path: "/api/assets/{id}/loans", description: "List loans of an asset", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "Loan[]", side_effects: [] }
  - { method: GET, path: "/api/loans/{id}/covenants", description: "List covenants of a loan", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "Covenant[]", side_effects: [] }
  - { method: GET, path: "/api/covenants/{id}/covenant-tests", description: "List tests of a covenant (append-only)", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "CovenantTest[]", side_effects: [] }
  - { method: GET, path: "/api/assets/{id}/valuations", description: "List valuations of an asset", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "Valuation[]", side_effects: [] }
  - { method: GET, path: "/api/assets/{id}/performance-scorecards", description: "List scorecards of an asset", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "PerformanceScorecard[]", side_effects: [] }
  - { method: GET, path: "/api/property-managers/{id}/performance-scorecards", description: "List scorecards of a manager", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "PerformanceScorecard[]", side_effects: [] }
  - { method: GET, path: "/api/business-plans/{id}/reforecasts", description: "List reforecasts of a plan", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "ReForecast[]", side_effects: [] }
  - { method: GET, path: "/api/assets/{id}/disposition-decisions", description: "List disposition decisions of an asset", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "DispositionDecision[]", side_effects: [] }
  - { method: GET, path: "/api/loans/{id}/lender-reports", description: "List lender reports of a loan", roles: [PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst], code: 200, input: [], output: "LenderReport[]", side_effects: [] }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PortfolioDirector
    description: "Senior executive: owns portfolio/asset/manager setup, plan approval, valuation confirmation, reforecast acceptance, draw release, disposition execution, lender/covenant setup, clock control"
    identity: opaque
    exclusive_operations:
      - "POST /api/portfolios, /archive"
      - "POST /api/property-managers, /suspend, /reinstate"
      - "POST /api/assets, /record-sale"
      - "POST /api/business-plans/{id}/approve, /reject"
      - "POST /api/valuations/{id}/confirm"
      - "POST /api/reforecasts/{id}/accept, /reject"
      - "POST /api/funding-draws/{id}/release"
      - "POST /api/disposition-decisions/{id}/execute"
      - "POST /api/loans, /api/covenants"
      - "POST /api/_clock/set_current_utc"
      - "POST /api/lease-strategies/{id}/ratify, /reject"
    shared_operations:
      - "POST /api/capital-projects/{id}/approve, /reject (shared with InvestmentCommittee; mandatory for emergency projects)"
  - name: AssetManager
    description: "Asset manager: drafts and submits plans, budget lines, actuals acceptance, capital projects, draws, lease strategies, reforecasts, dispositions, lender reports"
    identity: opaque
    exclusive_operations:
      - "POST /api/business-plans, /submit"
      - "POST /api/budget-lines"
      - "POST /api/actuals-reports/{id}/accept, /reject"
      - "POST /api/capital-projects, /start, /complete, /cancel"
      - "POST /api/funding-draws"
      - "POST /api/reforecasts, /submit"
      - "POST /api/disposition-decisions, /submit-review"
      - "POST /api/lender-reports, /submit"
      - "POST /api/performance-scorecards/{id}/review, /finalize"
    shared_operations:
      - "POST /api/lease-strategies (shared with PropertyManager)"
  - name: PropertyManager
    description: "Third-party property manager: posts monthly actuals and quarterly scorecards for the assets it manages; drafts lease strategies"
    identity: "entity_backed:PropertyManager"
    exclusive_operations:
      - "POST /api/actuals-reports (only where X-User-ID == asset.property_manager_id)"
      - "POST /api/performance-scorecards (only where X-User-ID == asset.property_manager_id)"
    shared_operations:
      - "POST /api/lease-strategies (own assets only)"
  - name: InvestmentCommittee
    description: "Committee: approves/rejects capital projects and draws; ratifies or shelves disposition decisions (SoD vs creator)"
    identity: opaque
    exclusive_operations:
      - "POST /api/funding-draws/{id}/approve, /reject"
      - "POST /api/disposition-decisions/{id}/ratify, /shelve"
    shared_operations:
      - "POST /api/capital-projects/{id}/approve, /reject (shared with PortfolioDirector)"
  - name: Lender
    description: "External lender: waives breached covenants; acknowledges lender reports"
    identity: opaque
    exclusive_operations:
      - "POST /api/covenants/{id}/waive"
      - "POST /api/lender-reports/{id}/acknowledge"
    shared_operations: []
  - name: Analyst
    description: "Underwriting analyst: records covenant tests, drafts valuations, computes lease rate recommendations"
    identity: opaque
    exclusive_operations:
      - "POST /api/covenant-tests"
      - "POST /api/valuations"
      - "POST /api/lease-strategies/{id}/recommend"
    shared_operations: []
  - name: System
    description: "Automation actor for cascades (breach/watch/default propagation, supersede, posture recompute, sale cascade)"
    identity: opaque
    exclusive_operations: []
    shared_operations: []
  - name: Any
    description: "Documentation alias for the shared read surface: every GET endpoint's roles list in §1.5 enumerates all six concrete business roles (PortfolioDirector, AssetManager, PropertyManager, InvestmentCommittee, Lender, Analyst); 'Any' is never used as an X-User-Role value"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints (enumerated per-endpoint in §1.5)"
