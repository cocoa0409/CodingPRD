            - "issue from VOID -> error_id == 'ERR_CERTIFICATE_NOT_PENDING_REVIEW'"
            - "transmit from VOID -> error_id == 'ERR_CERTIFICATE_NOT_TRANSMITTABLE'"
            - "second void from VOID -> error_id == 'ERR_CERTIFICATE_NOT_VOIDABLE'"
            - "revise from VOID -> error_id == 'ERR_CERTIFICATE_NOT_REVISABLE'"

      - name: certificate_lapses_only_after_valid_until
        claim_type: valid_transition
        grounds:
          - state_machines.Certificate.ISSUED_to_LAPSED
          - calculations.certificate_validity_window
        distinguishing_aspect: |
          LAPSED is a strict-greater threshold lazily materialized on read: at
