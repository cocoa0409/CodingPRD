            - "Ticket.${t_id}.sla_counted_minutes + Ticket.${t_id}.sla_paused_minutes + Ticket.${t_id}.sla_uncovered_minutes == 600"
            - "Ticket.${t_id}.sla_status == WITHIN and Ticket.${t_id}.pause_started_at == null"

      - name: entitled_device_total_conserved_across_transfer_and_accept
        grounds:
          - conservation_invariants[device_count_conservation]
          - state_machines.Device.lifecycle.ACTIVE_to_TRANSFER_PENDING
          - state_machines.Device.lifecycle.TRANSFER_PENDING_to_ACTIVE
