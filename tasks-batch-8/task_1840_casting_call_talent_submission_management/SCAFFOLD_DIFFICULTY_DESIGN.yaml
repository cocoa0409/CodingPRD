  # ==========================================================================
  # Rule 7 — cross_entity_state_dependency (two DIFFERENT entity pairs)
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_confirm_depends_on_permit_state
        grounds:
          - state_machines.Booking.PENDING_to_CONFIRMED
          - validations[priority=7]
          - errors[ERR_PERMIT_REQUIRED]
        distinguishing_aspect: |
          Pair (Booking -> MinorWorkPermit): Booking's PENDING->CONFIRMED is
          gated on a DIFFERENT entity's state — the MinorWorkPermit must be
          VERIFIED and valid through engagement_end. With a merely
          PENDING_VERIFICATION permit, confirm is rejected.
        test_recipe:
          setup:
            - "Minor-role submission with ACCEPTED offer + EXECUTED memo; PENDING booking with work_permit_id pointing to a PENDING_VERIFICATION (not VERIFIED) permit"
