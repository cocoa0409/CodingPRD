- section: validations
  instances:
  - name: missing_auth_headers_returns_401
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    distinguishing_aspect: No X-User-Role / X-User-ID headers -> 401 ERR_UNAUTHENTICATED before any other check.
    test_recipe:
      setup:
      - nothing needed
      setup_api_calls: []
      trigger:
      - call: POST /jbp/plans
        payload:
          retailer_id: 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
          category_id: 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
          fiscal_year: 2027
          growth_target_pct: 8
          weekly_baseline_cases: 100
          avg_unit_net_price_cents: 450
        captures:
          err: $.data.error_id
      assert:
      - request sent with NEITHER X-User-Role NOR X-User-ID header returns 401 with error_id ERR_UNAUTHENTICATED
  - name: unknown_role_returns_401
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    distinguishing_aspect: An unrecognized role name is an authentication failure (401), not a 403.
    test_recipe:
      setup:
      - nothing needed
      setup_api_calls: []
      trigger:
      - call: POST /jbp/retailers
        payload:
          name: Retailer Alpha
          country_code: US
          channels:
          - MASS
        as: SuperUser
        captures:
          err: $.data.error_id
      assert:
      - 'X-User-Role: SuperUser (undeclared role) returns 401 ERR_UNAUTHENTICATED, not 403'
  - name: negotiate_missing_field_beats_not_found
    claim_type: priority_ordering
    grounds:
    - validations[priority=4]
    - validations[priority=6]
    distinguishing_aspect: 'Shape validation (priority 4) beats existence (priority 6): a negotiate with a missing growth_target_pct
      against a nonexistent plan returns ERR_VALIDATION, not ERR_PLAN_NOT_FOUND.'
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /jbp/plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/negotiate
        payload: {}
        as: ManufacturerPlanner
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_VALIDATION (shape, priority 4), not ERR_PLAN_NOT_FOUND (existence, priority 6)
  - name: governance_boundary_competitor_data_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=18]
    distinguishing_aspect: includes_competitor_data=true against a MANUFACTURER_ONLY category fails ERR_GOVERNANCE_BOUNDARY;
      the same body against a FULL_CATEGORY category succeeds.
    test_recipe:
      setup:
      - retailer; category restricted MANUFACTURER_ONLY; plan P (PROPOSED) on it; category full FULL_CATEGORY; plan F (PROPOSED)
        on it
      setup_api_calls:
      - call: POST /jbp/retailers
        payload:
          name: Retailer Alpha
          country_code: US
          channels:
