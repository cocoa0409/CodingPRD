              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-OWNER", full_name: "Pat Owner", weight_kg: 70 }
              as: Scheduler
              captures: { pt_owner: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-OTHER", full_name: "Pat Other", weight_kg: 70 }
              as: Scheduler
              captures: { pt_other: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt_owner}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: MedicalDirector
