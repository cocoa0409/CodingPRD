              as: PlatformAdmin
              captures: { spot_id: $.data.id }
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b@x.com", display_name: "B", role_kind: "BUYER" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Bike", description: "road", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
