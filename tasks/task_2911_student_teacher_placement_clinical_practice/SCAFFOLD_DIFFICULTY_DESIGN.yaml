scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: readiness_strict_versus_rolling_variant_divergence_on_candidate
        grounds:
          - "calculations.candidate_readiness_score"
          - "calculations.candidate_readiness_score.variants.STRICT"
          - "calculations.candidate_readiness_score.variants.ROLLING"
          - "state_machines.ReadinessItem"
          - "endpoints.POST /epp/candidates/{candidate_id}/readiness-evaluate"
          - "entities.Candidate.readiness_score"
          - "entities.Candidate.readiness_variant_used"
        distinguishing_aspect: |
          Domain: CANDIDATE ELIGIBILITY SCORING. The two variants of candidate_readiness_score disagree
          about whether a CONTENT_EXAM whose expires_on has passed the clock date still counts: STRICT
          drops the expired row (and lazily flips it to EXPIRED), while ROLLING keeps any row that was
          valid on the owning placement's term_start_date. With one identical item set the STRICT score
          is 50/LAPSED and the ROLLING score is 90/READY - a 40-point delta that is exactly
          EXAM_WEIGHT_POINTS. This instance is about eligibility points on Candidate; the sibling
          instance is about money on Placement, a different entity domain and a different variant axis
          (PROVISIONAL vs FINAL settlement), so no shared formula or field is reused.
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z (the mandatory default)."
            - "Build one district, one ACTIVE FALL_2026 agreement, one QUALIFIED cooperating teacher and one supervisor."
            - "Create candidate C-1001 with a CONTENT_EXAM scored 245 that expires on 2026-10-01, a DISTRICT_FINGERPRINT clearance and an 18-credit coursework block, all VERIFIED."
            - "Route and confirm a 14-week FALL_2026 placement starting 2026-09-01 while the exam is still valid, so ROLLING has a term_start_date of 2026-09-01 to anchor on."
            - "Advance the clock to 2026-12-08, past the exam's expires_on of 2026-10-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: ProgramAdmin
            - call: "POST /epp/districts"
              payload: {"name": "Ridgeview ISD", "district_code": "D-RIDGE", "state_code": "TX", "requires_district_fingerprint": true, "travel_reimbursement_enabled": true}
              as: ProgramAdmin
              captures: {"d1": "$.data.id"}
            - call: "POST /epp/partnership-agreements"
              payload: {"district_id": "${d1}", "term": "FALL_2026", "window_start": "2026-08-01", "window_end": "2027-01-31", "placement_cap": 1, "stipend_rate_cents_per_week": 12345, "allowed_subjects": ["MATH", "ELA"], "allowed_grade_bands": ["MG_5_9", "HS_9_12"]}
              as: ProgramAdmin
              captures: {"a1": "$.data.id"}
            - call: "POST /epp/partnership-agreements/${a1}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /epp/cooperating-teachers"
              payload: {"district_id": "${d1}", "full_name": "Tina Ortiz", "site_name": "Ridgeview HS", "site_grid_x": 10, "site_grid_y": 10, "subject_endorsement": "MATH", "grade_band": "HS_9_12", "years_experience": 9, "consecutive_terms_hosted": 2, "max_concurrent_candidates": 1}
              as: SupervisionLead
              captures: {"t1": "$.data.id"}
            - call: "POST /epp/cooperating-teachers/${t1}/training-completion"
              payload: {"training_completed_on": "2026-06-01"}
              as: SupervisionLead
            - call: "POST /epp/university-supervisors"
              payload: {"full_name": "Dr. Sam Reyes", "employment_type": "FULL_TIME", "primary_subject": "MATH", "covered_grade_bands": ["MG_5_9", "HS_9_12"], "home_grid_x": 0, "home_grid_y": 0, "max_travel_miles": 60}
              as: SupervisionLead
              captures: {"s1": "$.data.id"}
            - call: "POST /epp/candidates"
              payload: {"candidate_code": "C-1001", "full_name": "Ana Diaz", "program_track": "SECONDARY", "home_grid_x": 2, "home_grid_y": 4}
              as: ProgramAdmin
              captures: {"c1": "$.data.id"}
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "CONTENT_EXAM", "issued_on": "2026-01-15", "exam_score": 245, "expires_on": "2026-10-01"}
              as: CredentialAnalyst
              captures: {"ri_exam_c1": "$.data.id"}
            - call: "POST /epp/readiness-items/${ri_exam_c1}/verify"
              payload: {"decision": "VERIFIED"}
              as: CredentialAnalyst
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "BACKGROUND_CLEARANCE", "issued_on": "2026-05-01", "clearance_scope": "DISTRICT_FINGERPRINT", "expires_on": "2027-05-01"}
              as: CredentialAnalyst
              captures: {"ri_clear_c1": "$.data.id"}
            - call: "POST /epp/readiness-items/${ri_clear_c1}/verify"
              payload: {"decision": "VERIFIED"}
              as: CredentialAnalyst
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "COURSEWORK_BLOCK", "issued_on": "2026-05-15", "credits": 18}
              as: CredentialAnalyst
              captures: {"ri_course_c1": "$.data.id"}
            - call: "POST /epp/readiness-items/${ri_course_c1}/verify"
              payload: {"decision": "VERIFIED"}
              as: CredentialAnalyst
            - call: "POST /epp/placement-requests"
              payload: {"candidate_id": "${c1}", "term": "FALL_2026", "requested_subject": "MATH", "requested_grade_band": "HS_9_12", "term_start_date": "2026-09-01", "weeks_scheduled": 14, "max_commute_miles": 30, "preferred_district_id": "${d1}"}
              as: PlacementCoordinator
              captures: {"r1": "$.data.id"}
            - call: "POST /epp/placement-requests/${r1}/route"
              payload: {}
              as: PlacementCoordinator
              captures: {"p1": "$.data.id"}
            - call: "POST /epp/placements/${p1}/confirm"
              payload: {}
              as: PlacementCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-12-08T00:00:00Z"}
              as: ProgramAdmin
          trigger:
            - call: "POST /epp/candidates/${c1}/readiness-evaluate"
              payload: {"variant": "STRICT"}
              as: CredentialAnalyst
            - call: "POST /epp/candidates/${c1}/readiness-evaluate"
              payload: {"variant": "ROLLING"}
              as: CredentialAnalyst
          assert:
            - "The first trigger call returns 200 with data.readiness_score == 50, data.readiness_status == \"LAPSED\" and data.readiness_variant_used == \"STRICT\"."
            - "The second trigger call returns 200 with data.readiness_score == 90, data.readiness_status == \"READY\" and data.readiness_variant_used == \"ROLLING\"."
            - "The STRICT-minus-ROLLING delta on an identical item set is exactly -40 points, i.e. EXAM_WEIGHT_POINTS (40) is the only term that differs."
            - "GET /epp/readiness-items/${ri_exam_c1} returns data.status == \"EXPIRED\" after the STRICT evaluation (the lazy expiry fired), while data.exam_score is still 245 and data.expires_on is still \"2026-10-01\"."
            - "GET /epp/candidates/${c1} returns data.readiness_variant_used == \"ROLLING\" and data.readiness_score == 90, because the last evaluation wins and both fields are written together."
      - name: stipend_provisional_versus_final_variant_divergence_on_placement
        grounds:
          - "calculations.stipend_settlement_cents"
          - "calculations.stipend_settlement_cents.variants.PROVISIONAL"
          - "calculations.stipend_settlement_cents.variants.FINAL"
          - "endpoints.POST /epp/placements/{placement_id}/confirm"
          - "endpoints.POST /epp/placements/{placement_id}/complete"
          - "entities.Placement.stipend_variant"
          - "entities.PartnershipAgreement.stipend_committed_cents"
        distinguishing_aspect: |
          Domain: COOPERATING-TEACHER MONEY. Here the two variants of stipend_settlement_cents are
          selected by lifecycle position rather than by an explicit request parameter: confirmation
          settles PROVISIONALLY (scheduled weeks, no completion premium) and completion settles FINALLY
          (credited weeks plus COMPLETION_PREMIUM_CENTS). Same placement, same weekly rate, the amount
          moves 181468 -> 183968 and the agreement's stipend_committed_cents is re-derived by exactly
          the 2500-cent delta. The sibling dual_variant_calc instance scores candidate eligibility on
          Candidate with a caller-chosen variant; this one settles money on Placement with an
          implicitly-selected variant, so the entity domain, the trigger surface and the conserved
          ledger are all different.
        test_recipe:
          setup:
            - "Build the base district/agreement/teacher/supervisor/candidate fixture at clock 2026-08-01T00:00:00Z."
            - "Route and confirm a 14-week placement starting 2026-09-01 (term_end_date 2026-12-07) - confirmation performs the PROVISIONAL settlement."
            - "Run all three observation cycles to COMPLETED so the compliance ratio is 1.0 with one SUMMATIVE cycle."
            - "Open the performance assessment, submit it and score it PASSED with a total of 70."
            - "Advance the clock to 2026-12-08, one day past term_end_date, so completion is legal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: ProgramAdmin
            - call: "POST /epp/districts"
              payload: {"name": "Ridgeview ISD", "district_code": "D-RIDGE", "state_code": "TX", "requires_district_fingerprint": true, "travel_reimbursement_enabled": true}
              as: ProgramAdmin
              captures: {"d1": "$.data.id"}
            - call: "POST /epp/partnership-agreements"
              payload: {"district_id": "${d1}", "term": "FALL_2026", "window_start": "2026-08-01", "window_end": "2027-01-31", "placement_cap": 1, "stipend_rate_cents_per_week": 12345, "allowed_subjects": ["MATH", "ELA"], "allowed_grade_bands": ["MG_5_9", "HS_9_12"]}
              as: ProgramAdmin
              captures: {"a1": "$.data.id"}
            - call: "POST /epp/partnership-agreements/${a1}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /epp/cooperating-teachers"
              payload: {"district_id": "${d1}", "full_name": "Tina Ortiz", "site_name": "Ridgeview HS", "site_grid_x": 10, "site_grid_y": 10, "subject_endorsement": "MATH", "grade_band": "HS_9_12", "years_experience": 9, "consecutive_terms_hosted": 2, "max_concurrent_candidates": 1}
              as: SupervisionLead
              captures: {"t1": "$.data.id"}
            - call: "POST /epp/cooperating-teachers/${t1}/training-completion"
              payload: {"training_completed_on": "2026-06-01"}
              as: SupervisionLead
            - call: "POST /epp/university-supervisors"
              payload: {"full_name": "Dr. Sam Reyes", "employment_type": "FULL_TIME", "primary_subject": "MATH", "covered_grade_bands": ["MG_5_9", "HS_9_12"], "home_grid_x": 0, "home_grid_y": 0, "max_travel_miles": 60}
              as: SupervisionLead
              captures: {"s1": "$.data.id"}
            - call: "POST /epp/candidates"
              payload: {"candidate_code": "C-1001", "full_name": "Ana Diaz", "program_track": "SECONDARY", "home_grid_x": 2, "home_grid_y": 4}
              as: ProgramAdmin
              captures: {"c1": "$.data.id"}
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "CONTENT_EXAM", "issued_on": "2026-01-15", "exam_score": 245, "expires_on": "2031-01-15"}
              as: CredentialAnalyst
              captures: {"ri_exam_c1": "$.data.id"}
            - call: "POST /epp/readiness-items/${ri_exam_c1}/verify"
              payload: {"decision": "VERIFIED"}
              as: CredentialAnalyst
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "BACKGROUND_CLEARANCE", "issued_on": "2026-05-01", "clearance_scope": "DISTRICT_FINGERPRINT", "expires_on": "2027-05-01"}
              as: CredentialAnalyst
              captures: {"ri_clear_c1": "$.data.id"}
            - call: "POST /epp/readiness-items/${ri_clear_c1}/verify"
              payload: {"decision": "VERIFIED"}
              as: CredentialAnalyst
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "COURSEWORK_BLOCK", "issued_on": "2026-05-15", "credits": 18}
              as: CredentialAnalyst
              captures: {"ri_course_c1": "$.data.id"}
            - call: "POST /epp/readiness-items/${ri_course_c1}/verify"
              payload: {"decision": "VERIFIED"}
              as: CredentialAnalyst
            - call: "POST /epp/placement-requests"
              payload: {"candidate_id": "${c1}", "term": "FALL_2026", "requested_subject": "MATH", "requested_grade_band": "HS_9_12", "term_start_date": "2026-09-01", "weeks_scheduled": 14, "max_commute_miles": 30, "preferred_district_id": "${d1}"}
              as: PlacementCoordinator
              captures: {"r1": "$.data.id"}
            - call: "POST /epp/placement-requests/${r1}/route"
              payload: {}
              as: PlacementCoordinator
              captures: {"p1": "$.data.id"}
            - call: "POST /epp/placements/${p1}/confirm"
              payload: {}
              as: PlacementCoordinator
            - call: "POST /epp/observation-cycles"
              payload: {"placement_id": "${p1}", "sequence_no": 1, "cycle_type": "FORMATIVE", "window_start": "2026-09-14T00:00:00Z", "window_end": "2026-09-19T00:00:00Z"}
              as: SupervisionLead
              captures: {"oc1": "$.data.id"}
            - call: "POST /epp/observation-cycles"
              payload: {"placement_id": "${p1}", "sequence_no": 2, "cycle_type": "FORMATIVE", "window_start": "2026-10-05T00:00:00Z", "window_end": "2026-10-10T00:00:00Z"}
              as: SupervisionLead
              captures: {"oc2": "$.data.id"}
            - call: "POST /epp/observation-cycles"
              payload: {"placement_id": "${p1}", "sequence_no": 3, "cycle_type": "SUMMATIVE", "window_start": "2026-11-16T00:00:00Z", "window_end": "2026-11-21T00:00:00Z"}
              as: SupervisionLead
              captures: {"oc3": "$.data.id"}
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-09-16T15:00:00Z"}
              as: ProgramAdmin
            - call: "POST /epp/observation-cycles/${oc1}/complete"
              payload: {"observed_at": "2026-09-16T15:00:00Z", "rubric_score": 4.0}
              as: UniversitySupervisorUser
              as_user_id: "${s1}"
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-10-06T15:00:00Z"}
              as: ProgramAdmin
            - call: "POST /epp/observation-cycles/${oc2}/complete"
              payload: {"observed_at": "2026-10-06T15:00:00Z", "rubric_score": 4.0}
              as: UniversitySupervisorUser
              as_user_id: "${s1}"
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-11-17T15:00:00Z"}
              as: ProgramAdmin
            - call: "POST /epp/observation-cycles/${oc3}/complete"
              payload: {"observed_at": "2026-11-17T15:00:00Z", "rubric_score": 4.5}
              as: UniversitySupervisorUser
              as_user_id: "${s1}"
            - call: "POST /epp/performance-assessments"
              payload: {"placement_id": "${p1}", "window_opens_at": "2026-11-01T00:00:00Z", "window_closes_at": "2026-12-01T00:00:00Z"}
              as: AssessmentScorer
              captures: {"pa1": "$.data.id"}
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-11-18T09:00:00Z"}
              as: ProgramAdmin
            - call: "POST /epp/performance-assessments/${pa1}/submit"
              payload: {"artifact_reference": "portfolio-v1"}
              as: CandidateUser
              as_user_id: "${c1}"
            - call: "POST /epp/performance-assessments/${pa1}/score"
              payload: {"decision": "SCORE", "task_planning": 4.0, "task_instruction": 3.5, "task_assessment": 3.0, "task_professionalism": 3.0}
              as: AssessmentScorer
              as_user_id: "u-scorer-1"
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-12-08T00:00:00Z"}
              as: ProgramAdmin
          trigger:
            - call: "POST /epp/placements/${p1}/complete"
              payload: {}
              as: PlacementCoordinator
          assert:
            - "Immediately after the setup's confirm call, GET /epp/placements/${p1} returned data.stipend_variant == \"PROVISIONAL\", data.stipend_weekly_cents == 12962, data.stipend_gross_cents == 181468 and data.weeks_credited == 14."
            - "The trigger returns 200 with data.placement_status == \"COMPLETED\", data.stipend_variant == \"FINAL\", data.stipend_gross_cents == 183968 and data.weeks_credited == 14."
            - "The FINAL-minus-PROVISIONAL delta is exactly 2500 cents, i.e. COMPLETION_PREMIUM_CENTS, because the credited weeks (14) happen to equal the scheduled weeks (14)."
            - "GET /epp/partnership-agreements/${a1} returns data.stipend_committed_cents == 183968 - the ledger was re-derived on the variant switch rather than incremented twice (181468 + 183968 = 365436 must never appear)."
            - "GET /epp/placements/${p1} returns data.travel_reimbursement_cents == 137886 both before and after the trigger, proving the variant switch touches only the stipend terms."

  - rule_id: combinatorial_formula
    instances:
      - name: stipend_weekly_rate_rounded_before_weeks_multiplication
        grounds:
          - "calculations.stipend_settlement_cents"
          - "calculations.stipend_settlement_cents.constants.LONGEVITY_MULTIPLIER_TIERS"
          - "entities.Placement.stipend_weekly_cents"
          - "entities.Placement.stipend_gross_cents"
          - "endpoints.POST /epp/placements/{placement_id}/confirm"
        distinguishing_aspect: |
          Mode (b) - ROUNDING POSITION. The stipend formula is
          round_half_up(rate * longevity_multiplier) -> weekly, then weekly * weeks. The agreement rate
          is 12345 and the teacher's consecutive_terms_hosted of 2 selects the 1.05 longevity
          multiplier, so the exact product is 12962.25. Rounding first gives 12962 * 14 = 181468;
          multiplying first and rounding the total gives round_half_up(181471.5) = 181472. The 4-cent
          gap is only visible because the fractional part is .25 and the week count is 14. The sibling
          instance probes mode (c) - which subtotal a tier is looked up against - in the travel formula,
          a different operand set with no rounding-order component.
        test_recipe:
          setup:
            - "Build the base fixture at clock 2026-08-01T00:00:00Z with agreement rate 12345 cents/week and a teacher whose consecutive_terms_hosted is 2 (longevity multiplier 1.05)."
            - "Route a 14-week placement starting 2026-09-01 so the PROVISIONAL settlement will multiply by 14."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: ProgramAdmin
            - call: "POST /epp/districts"
              payload: {"name": "Ridgeview ISD", "district_code": "D-RIDGE", "state_code": "TX", "requires_district_fingerprint": true, "travel_reimbursement_enabled": true}
              as: ProgramAdmin
              captures: {"d1": "$.data.id"}
            - call: "POST /epp/partnership-agreements"
              payload: {"district_id": "${d1}", "term": "FALL_2026", "window_start": "2026-08-01", "window_end": "2027-01-31", "placement_cap": 1, "stipend_rate_cents_per_week": 12345, "allowed_subjects": ["MATH", "ELA"], "allowed_grade_bands": ["MG_5_9", "HS_9_12"]}
              as: ProgramAdmin
              captures: {"a1": "$.data.id"}
            - call: "POST /epp/partnership-agreements/${a1}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /epp/cooperating-teachers"
              payload: {"district_id": "${d1}", "full_name": "Tina Ortiz", "site_name": "Ridgeview HS", "site_grid_x": 10, "site_grid_y": 10, "subject_endorsement": "MATH", "grade_band": "HS_9_12", "years_experience": 9, "consecutive_terms_hosted": 2, "max_concurrent_candidates": 1}
              as: SupervisionLead
              captures: {"t1": "$.data.id"}
            - call: "POST /epp/cooperating-teachers/${t1}/training-completion"
              payload: {"training_completed_on": "2026-06-01"}
              as: SupervisionLead
            - call: "POST /epp/university-supervisors"
              payload: {"full_name": "Dr. Sam Reyes", "employment_type": "FULL_TIME", "primary_subject": "MATH", "covered_grade_bands": ["MG_5_9", "HS_9_12"], "home_grid_x": 0, "home_grid_y": 0, "max_travel_miles": 60}
              as: SupervisionLead
              captures: {"s1": "$.data.id"}
            - call: "POST /epp/candidates"
              payload: {"candidate_code": "C-1001", "full_name": "Ana Diaz", "program_track": "SECONDARY", "home_grid_x": 2, "home_grid_y": 4}
              as: ProgramAdmin
              captures: {"c1": "$.data.id"}
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "CONTENT_EXAM", "issued_on": "2026-01-15", "exam_score": 245, "expires_on": "2031-01-15"}
              as: CredentialAnalyst
              captures: {"ri_exam_c1": "$.data.id"}
            - call: "POST /epp/readiness-items/${ri_exam_c1}/verify"
              payload: {"decision": "VERIFIED"}
              as: CredentialAnalyst
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "BACKGROUND_CLEARANCE", "issued_on": "2026-05-01", "clearance_scope": "DISTRICT_FINGERPRINT", "expires_on": "2027-05-01"}
              as: CredentialAnalyst
              captures: {"ri_clear_c1": "$.data.id"}
            - call: "POST /epp/readiness-items/${ri_clear_c1}/verify"
              payload: {"decision": "VERIFIED"}
              as: CredentialAnalyst
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "COURSEWORK_BLOCK", "issued_on": "2026-05-15", "credits": 18}
              as: CredentialAnalyst
              captures: {"ri_course_c1": "$.data.id"}
            - call: "POST /epp/readiness-items/${ri_course_c1}/verify"
              payload: {"decision": "VERIFIED"}
              as: CredentialAnalyst
            - call: "POST /epp/placement-requests"
              payload: {"candidate_id": "${c1}", "term": "FALL_2026", "requested_subject": "MATH", "requested_grade_band": "HS_9_12", "term_start_date": "2026-09-01", "weeks_scheduled": 14, "max_commute_miles": 30, "preferred_district_id": "${d1}"}
              as: PlacementCoordinator
              captures: {"r1": "$.data.id"}
            - call: "POST /epp/placement-requests/${r1}/route"
              payload: {}
              as: PlacementCoordinator
              captures: {"p1": "$.data.id"}
          trigger:
            - call: "POST /epp/placements/${p1}/confirm"
              payload: {}
              as: PlacementCoordinator
          assert:
            - "The trigger returns 200 with data.stipend_weekly_cents == 12962 - round_half_up(12345 * 1.05) = round_half_up(12962.25)."
            - "The trigger returns data.stipend_gross_cents == 181468 (12962 * 14), and never 181472, which is what round_half_up(12345 * 1.05 * 14) would produce."
            - "The trigger returns data.stipend_variant == \"PROVISIONAL\" and data.weeks_credited == 14."
            - "GET /epp/partnership-agreements/${a1} returns data.stipend_committed_cents == 181468, so the ledger carries the rounded-first figure too."
      - name: travel_allowance_tier_pinned_to_pre_allowance_subtotal
        grounds:
          - "calculations.travel_reimbursement_cents"
          - "calculations.travel_reimbursement_cents.constants.OVERSIZE_ALLOWANCE_TIERS"
