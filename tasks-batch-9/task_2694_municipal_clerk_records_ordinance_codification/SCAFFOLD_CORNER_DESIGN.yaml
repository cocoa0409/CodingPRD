      - name: the_cycle_gate_errors_are_all_reachable_across_the_open_locked_boundary
        claim_type: error_triggerable
        grounds: ["validations[priority=34]", "validations[priority=38]", "errors[ERR_CYCLE_NOT_LOCKED]", "errors[ERR_CYCLE_NOT_OPEN]", "errors[ERR_CYCLE_HAS_OPEN_SUBMISSIONS]"]
        distinguishing_aspect: "One cycle produces all three gate errors in sequence: certifying it while OPEN returns ERR_CYCLE_NOT_LOCKED, filing into it after the lock returns ERR_CYCLE_NOT_OPEN, and certifying it while its lone submission sits IN_REVIEW returns ERR_CYCLE_HAS_OPEN_SUBMISSIONS."
