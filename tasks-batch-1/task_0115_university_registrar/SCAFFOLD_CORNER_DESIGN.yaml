# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# University Registrar & Course Registration
#
# Breadth probe: every testable claim §1.1–§1.7 surfaces that §1.8 does not
# already cover. Walks the claim-extraction-guide section-by-section. Setup
# chains reuse only §1.5 endpoints; literals are pre-computed; placeholders
# close within each instance.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_term_returns_201_with_planning_status
        claim_type: Creation
        grounds: [entities.Term.fields.status, endpoints]
        distinguishing_aspect: "POST /terms with all required fields returns 201 and Term.status == PLANNING with the supplied deadlines echoed."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /terms"
              payload: { name: "Fall 2026", registration_opens_at: "2026-01-01T00:00:00Z", add_deadline: "2026-02-01T00:00:00Z", drop_deadline: "2026-02-15T00:00:00Z", withdraw_deadline: "2026-03-15T00:00:00Z", per_credit_cost_cents: 50000 }
              as: Registrar
              captures: { term_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Term.${term_id}.status == PLANNING"
            - "Term.${term_id}.per_credit_cost_cents == 50000"
            - "Term.${term_id}.version == 1"

      - name: get_term_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Term, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /terms/{id} for a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /terms/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_section_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.Section.fields.seat_capacity, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /sections omitting required seat_capacity returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A program, instructor, term, course exist."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "BS CS", required_credit_hours: 120, min_gpa: 2.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Dr A", email: "c1@u.edu", gap_minutes: 0 }
              as: Registrar
              captures: { instr_id: $.data.id }
            - call: "POST /terms"
              payload: { name: "T", registration_opens_at: "2026-01-01T00:00:00Z", add_deadline: "2026-02-01T00:00:00Z", drop_deadline: "2026-02-15T00:00:00Z", withdraw_deadline: "2026-03-15T00:00:00Z", per_credit_cost_cents: 50000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "CS101", title: "Intro", credit_hours: 3, program_id: "${prog_id}" }
              as: Registrar
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /sections"
              payload: { term_id: "${term_id}", course_id: "${c_id}", instructor_id: "${instr_id}", section_code: "001", meeting_days: "MWF", meeting_start_min: 540, meeting_end_min: 590 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_student_default_completed_credit_hours_zero
        claim_type: Defaults
        grounds: [entities.Student.fields.completed_credit_hours, entities.Student.fields.earned_credit_hours]
        distinguishing_aspect: "POST /students omitting completed_credit_hours defaults it to 0 and earned_credit_hours starts at 0; gpa starts 0.00, standing GOOD."
        test_recipe:
          setup: ["A program exists."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "BS CS", required_credit_hours: 120, min_gpa: 2.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { full_name: "Stu Z", email: "cz@u.edu", program_id: "${prog_id}" }
              as: Registrar
              captures: { stu_id: $.data.id }
          assert:
            - "Student.${stu_id}.completed_credit_hours == 0"
            - "Student.${stu_id}.earned_credit_hours == 0"
            - "Student.${stu_id}.gpa == 0.00"
            - "Student.${stu_id}.academic_standing == GOOD"

      - name: section_computed_seats_taken_ignores_input
        claim_type: Computed Fields
        grounds: [entities.Section.fields.seats_taken]
        distinguishing_aspect: "seats_taken is server-computed: a freshly created section reports seats_taken == 0 regardless of any client value."
        test_recipe:
          setup: ["A program, instructor, term, course exist."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "BS CS", required_credit_hours: 120, min_gpa: 2.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Dr A", email: "c3@u.edu", gap_minutes: 0 }
              as: Registrar
              captures: { instr_id: $.data.id }
            - call: "POST /terms"
              payload: { name: "T", registration_opens_at: "2026-01-01T00:00:00Z", add_deadline: "2026-02-01T00:00:00Z", drop_deadline: "2026-02-15T00:00:00Z", withdraw_deadline: "2026-03-15T00:00:00Z", per_credit_cost_cents: 50000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "CS101", title: "Intro", credit_hours: 3, program_id: "${prog_id}" }
              as: Registrar
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /sections"
              payload: { term_id: "${term_id}", course_id: "${c_id}", instructor_id: "${instr_id}", section_code: "001", seat_capacity: 30, meeting_days: "MWF", meeting_start_min: 540, meeting_end_min: 590 }
              as: Registrar
              captures: { sec_id: $.data.id }
          assert:
            - "Section.${sec_id}.seats_taken == 0"
            - "Section.${sec_id}.waitlist_count == 0"
            - "Section.${sec_id}.status == OPEN"

      - name: program_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Program]
        distinguishing_aspect: "Program has common_fields: false — its GET response carries id and created_at but no version field and no update endpoint exists."
        test_recipe:
          setup: ["A program exists."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "BS CS", required_credit_hours: 120, min_gpa: 2.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Registrar
          assert:
            - "response.data has fields id, created_at, name, required_credit_hours, min_gpa"
            - "response.data has no 'version' field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: term_open_registration_with_no_sections_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Term.PLANNING_to_REGISTRATION_OPEN, "errors[ERR_TERM_HAS_NO_SECTIONS]"]
        distinguishing_aspect: "PLANNING->REGISTRATION_OPEN requires >=1 section; a term with zero sections returns ERR_TERM_HAS_NO_SECTIONS (409)."
        test_recipe:
          setup: ["A term in PLANNING with no sections."]
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "T", registration_opens_at: "2026-01-01T00:00:00Z", add_deadline: "2026-02-01T00:00:00Z", drop_deadline: "2026-02-15T00:00:00Z", withdraw_deadline: "2026-03-15T00:00:00Z", per_credit_cost_cents: 50000 }
              as: Registrar
              captures: { term_id: $.data.id }
          trigger:
            - call: "POST /terms/${term_id}/status"
              payload: { to_status: "REGISTRATION_OPEN" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_TERM_HAS_NO_SECTIONS"

      - name: cancelled_section_cannot_reopen
        claim_type: Invalid Transitions
        grounds: [state_machines.Section, entities.Section.fields.status, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal for Section: a CANCELLED->OPEN attempt returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A section transitioned to CANCELLED."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "BS CS", required_credit_hours: 120, min_gpa: 2.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Dr A", email: "c4@u.edu", gap_minutes: 0 }
              as: Registrar
              captures: { instr_id: $.data.id }
            - call: "POST /terms"
              payload: { name: "T", registration_opens_at: "2026-01-01T00:00:00Z", add_deadline: "2026-02-01T00:00:00Z", drop_deadline: "2026-02-15T00:00:00Z", withdraw_deadline: "2026-03-15T00:00:00Z", per_credit_cost_cents: 50000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "CS101", title: "Intro", credit_hours: 3, program_id: "${prog_id}" }
              as: Registrar
              captures: { c_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", course_id: "${c_id}", instructor_id: "${instr_id}", section_code: "001", seat_capacity: 5, meeting_days: "MWF", meeting_start_min: 540, meeting_end_min: 590 }
              as: Registrar
              captures: { sec_id: $.data.id }
            - call: "POST /sections/${sec_id}/status"
              payload: { to_status: "CANCELLED" }
              as: Registrar
          trigger:
            - call: "POST /sections/${sec_id}/status"
              payload: { to_status: "OPEN" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: hold_clear_twice_second_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Hold.ACTIVE_to_CLEARED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLEARED is terminal for Hold: clearing an already-CLEARED hold returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A student with an ACTIVE financial hold already cleared once."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "BS CS", required_credit_hours: 120, min_gpa: 2.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu H", email: "ch@u.edu", program_id: "${prog_id}" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /holds"
              payload: { student_id: "${stu_id}", hold_type: "FINANCIAL", reason: "x" }
              as: Bursar
              captures: { hold_id: $.data.id }
            - call: "POST /holds/${hold_id}/clear"
              payload: {}
              as: Bursar
          trigger:
            - call: "POST /holds/${hold_id}/clear"
              payload: {}
              as: Bursar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: enrollment_initial_state_is_requested_then_enrolled
        claim_type: Initial State
        grounds: [state_machines.Enrollment, entities.Enrollment.fields.registration_status]
        distinguishing_aspect: "A new enrollment with a free seat lands ENROLLED (REQUESTED resolves immediately within the create call) with grade_status UNGRADED."
        test_recipe:
          setup: ["A registration-open term with an OPEN section seat_cap>=1; a student with an open appointment, clock within window."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "BS CS", required_credit_hours: 120, min_gpa: 2.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Dr A", email: "c5@u.edu", gap_minutes: 0 }
              as: Registrar
              captures: { instr_id: $.data.id }
            - call: "POST /terms"
              payload: { name: "T", registration_opens_at: "2026-01-01T00:00:00Z", add_deadline: "2026-02-01T00:00:00Z", drop_deadline: "2026-02-15T00:00:00Z", withdraw_deadline: "2026-03-15T00:00:00Z", per_credit_cost_cents: 50000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "CS101", title: "Intro", credit_hours: 3, program_id: "${prog_id}" }
              as: Registrar
              captures: { c_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", course_id: "${c_id}", instructor_id: "${instr_id}", section_code: "001", seat_capacity: 5, meeting_days: "MWF", meeting_start_min: 540, meeting_end_min: 590 }
              as: Registrar
              captures: { sec_id: $.data.id }
            - call: "POST /terms/${term_id}/status"
              payload: { to_status: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /students"
              payload: { full_name: "Stu I", email: "ci@u.edu", program_id: "${prog_id}" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /appointments"
              payload: { term_id: "${term_id}", student_id: "${stu_id}", priority_tier: 1, window_opens_at: "2026-01-05T00:00:00Z", max_credit_hours: 12 }
              as: Registrar
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-01-10T00:00:00Z" }
              as: Registrar
            - call: "GET /sections/${sec_id}"
              payload: {}
              as: Registrar
              captures: { sv: $.data.version }
          trigger:
            - call: "POST /enrollments"
              payload: { term_id: "${term_id}", section_id: "${sec_id}", expected_section_version: "${sv}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { enr_id: $.data.id }
          assert:
            - "Enrollment.${enr_id}.registration_status == ENROLLED"
            - "Enrollment.${enr_id}.grade_status == UNGRADED"
            - "Enrollment.${enr_id}.tuition_charged_cents == 150000"

      - name: duplicate_enrollment_same_section_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Enrollment.REQUESTED_to_ENROLLED, "errors[ERR_DUPLICATE_ENROLLMENT]"]
        distinguishing_aspect: "A second enroll into a section where the student already holds a non-terminal enrollment returns ERR_DUPLICATE_ENROLLMENT (409)."
        test_recipe:
          setup: ["Student already ENROLLED in the section."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "BS CS", required_credit_hours: 120, min_gpa: 2.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Dr A", email: "c6@u.edu", gap_minutes: 0 }
              as: Registrar
              captures: { instr_id: $.data.id }
            - call: "POST /terms"
              payload: { name: "T", registration_opens_at: "2026-01-01T00:00:00Z", add_deadline: "2026-02-01T00:00:00Z", drop_deadline: "2026-02-15T00:00:00Z", withdraw_deadline: "2026-03-15T00:00:00Z", per_credit_cost_cents: 50000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "CS101", title: "Intro", credit_hours: 3, program_id: "${prog_id}" }
              as: Registrar
              captures: { c_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", course_id: "${c_id}", instructor_id: "${instr_id}", section_code: "001", seat_capacity: 5, meeting_days: "MWF", meeting_start_min: 540, meeting_end_min: 590 }
              as: Registrar
              captures: { sec_id: $.data.id }
            - call: "POST /terms/${term_id}/status"
              payload: { to_status: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /students"
              payload: { full_name: "Stu Dup", email: "cdup@u.edu", program_id: "${prog_id}" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /appointments"
              payload: { term_id: "${term_id}", student_id: "${stu_id}", priority_tier: 1, window_opens_at: "2026-01-05T00:00:00Z", max_credit_hours: 12 }
              as: Registrar
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-01-10T00:00:00Z" }
              as: Registrar
            - call: "GET /sections/${sec_id}"
              payload: {}
              as: Registrar
              captures: { v0: $.data.version }
            - call: "POST /enrollments"
              payload: { term_id: "${term_id}", section_id: "${sec_id}", expected_section_version: "${v0}" }
              as: Student
              as_user_id: "${stu_id}"
            - call: "GET /sections/${sec_id}"
              payload: {}
              as: Registrar
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /enrollments"
              payload: { term_id: "${term_id}", section_id: "${sec_id}", expected_section_version: "${v1}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_DUPLICATE_ENROLLMENT"

      - name: drop_after_drop_deadline_window_closed
        claim_type: Precondition Enforcement
        grounds: [state_machines.Enrollment.ENROLLED_to_DROPPED, "errors[ERR_DROP_WINDOW_CLOSED]"]
        distinguishing_aspect: "A drop attempted after drop_deadline returns ERR_DROP_WINDOW_CLOSED (409) — distinct from the withdraw path."
        test_recipe:
          setup: ["Student ENROLLED; clock advanced past drop_deadline (2026-02-20)."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "BS CS", required_credit_hours: 120, min_gpa: 2.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Dr A", email: "c7@u.edu", gap_minutes: 0 }
              as: Registrar
              captures: { instr_id: $.data.id }
            - call: "POST /terms"
              payload: { name: "T", registration_opens_at: "2026-01-01T00:00:00Z", add_deadline: "2026-02-01T00:00:00Z", drop_deadline: "2026-02-15T00:00:00Z", withdraw_deadline: "2026-03-15T00:00:00Z", per_credit_cost_cents: 50000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "CS101", title: "Intro", credit_hours: 3, program_id: "${prog_id}" }
              as: Registrar
              captures: { c_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", course_id: "${c_id}", instructor_id: "${instr_id}", section_code: "001", seat_capacity: 5, meeting_days: "MWF", meeting_start_min: 540, meeting_end_min: 590 }
              as: Registrar
              captures: { sec_id: $.data.id }
            - call: "POST /terms/${term_id}/status"
              payload: { to_status: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /students"
              payload: { full_name: "Stu DW", email: "cdw@u.edu", program_id: "${prog_id}" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /appointments"
              payload: { term_id: "${term_id}", student_id: "${stu_id}", priority_tier: 1, window_opens_at: "2026-01-05T00:00:00Z", max_credit_hours: 12 }
              as: Registrar
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-01-10T00:00:00Z" }
              as: Registrar
            - call: "GET /sections/${sec_id}"
              payload: {}
              as: Registrar
              captures: { sv: $.data.version }
            - call: "POST /enrollments"
              payload: { term_id: "${term_id}", section_id: "${sec_id}", expected_section_version: "${sv}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-02-20T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /enrollments/${enr_id}/drop"
              payload: {}
              as: Student
              as_user_id: "${stu_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_DROP_WINDOW_CLOSED"

      - name: withdraw_before_drop_deadline_window_closed
        claim_type: Precondition Enforcement
        grounds: [state_machines.Enrollment.ENROLLED_to_WITHDRAWN, "errors[ERR_WITHDRAW_WINDOW_CLOSED]"]
        distinguishing_aspect: "A withdraw attempted at/before drop_deadline (when drop is still the right action) returns ERR_WITHDRAW_WINDOW_CLOSED (409)."
        test_recipe:
          setup: ["Student ENROLLED; clock still within drop window (2026-01-10)."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "BS CS", required_credit_hours: 120, min_gpa: 2.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Dr A", email: "c8@u.edu", gap_minutes: 0 }
              as: Registrar
              captures: { instr_id: $.data.id }
            - call: "POST /terms"
              payload: { name: "T", registration_opens_at: "2026-01-01T00:00:00Z", add_deadline: "2026-02-01T00:00:00Z", drop_deadline: "2026-02-15T00:00:00Z", withdraw_deadline: "2026-03-15T00:00:00Z", per_credit_cost_cents: 50000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "CS101", title: "Intro", credit_hours: 3, program_id: "${prog_id}" }
              as: Registrar
              captures: { c_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", course_id: "${c_id}", instructor_id: "${instr_id}", section_code: "001", seat_capacity: 5, meeting_days: "MWF", meeting_start_min: 540, meeting_end_min: 590 }
              as: Registrar
              captures: { sec_id: $.data.id }
            - call: "POST /terms/${term_id}/status"
              payload: { to_status: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /students"
              payload: { full_name: "Stu WW", email: "cww@u.edu", program_id: "${prog_id}" }
              as: Registrar
