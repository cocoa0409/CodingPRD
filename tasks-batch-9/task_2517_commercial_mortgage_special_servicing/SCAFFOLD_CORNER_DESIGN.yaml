      - name: npv_is_projected_at_scoring_time_not_at_alternative_creation
        claim_type: forward_looking
        grounds:
          - calculations.workout_alternative_npv
          - state_machines.WorkoutPlan.DRAFT_to_SCORED
          - entities.WorkoutAlternative.fields.npv_usd
        distinguishing_aspect: "An alternative is stored with its projected stream but no valuation: npv_usd and rank are null at PROPOSED and are filled for EVERY alternative in the pool by the single DRAFT -> SCORED transition. All cash flows lie in the future and are discounted by period_index alone under CONTRACTUAL (shift 0), so a plan discount rate of 8.0 turns 10,000,000 of nominal proceeds into 8,033,922.68 of net present value."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; loan in SPECIAL_SERVICING; plan discount_rate_pct 8.0 with npv_basis CONTRACTUAL."
            - "Two alternatives: MODIFICATION [(1, 1,000,000), (2, 1,000,000), (3, 8,000,000)] upfront 100,000 and NOTE_SALE [(1, 8,500,000)] upfront 90,000."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V17", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
