              as: Writer
              as_user_id: "${w2}"
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - *C_APP1
            - *C_CR
            - *C_IT1
            - &C_DEC_CLEARED
              call: "POST /clearance-items/${it1}/decide"
              payload: { decision: "CLEARED" }
              as: LegalCounsel
            - &C_LOCK
              call: "POST /episodes/${ep1}/lock-for-production"
              payload: {}
              as: StudioExecutive
            - *C_WRAP
          trigger:
            - call: "POST /rooms/${rm}/wrap"
              payload: {}
              as: StudioExecutive
            - call: "GET /rooms/${rm}"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rv9: "$.data.version" }
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w2}", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "NON_EXCLUSIVE", start_date: "2026-09-15T00:00:00Z", end_date: "2026-09-29T00:00:00Z", expected_room_version: "${rv9}" }
