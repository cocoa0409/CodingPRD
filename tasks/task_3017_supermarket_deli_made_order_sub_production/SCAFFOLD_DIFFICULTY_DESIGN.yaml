# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task: task_3017_supermarket_deli_made_order_sub_production
#
# Every instance below grounds in elements already declared in SCAFFOLD.yaml
# §1.1–§1.7. Deleting this file leaves the scaffold's declared behavior
# identical; it only makes test coverage auditable.
#
# Shared fixture catalogue used by the chains below (all ids are captures):
#   Store  S1  store_number "101",  deli_case_capacity_lbs 420, hot_bar 90, stations 2
#   Store  S2  store_number "102",  deli_case_capacity_lbs 240, hot_bar 40, stations 2
#   Store  S3  store_number "103",  deli_case_capacity_lbs 300, hot_bar 60, stations 1
#   Item   J1  SKU "SUBS-001"  SUB   case_life 240  markdown_window 30  allergens [WHEAT, MILK, SOY]      slicer false  cost 480  retail 799
#   Item   J2  SKU "CC-TURK-01" COLD_CUT case_life 180 markdown_window 30 allergens [MILK]              slicer true   cost 520  retail 899
#   Item   J3  SKU "CC-TURK-02" COLD_CUT case_life 180 markdown_window 30 allergens [MILK, WHEAT]       slicer true   cost 520  retail 899
#   Item   J4  SKU "CC-PROSC-01" COLD_CUT case_life 120 markdown_window 30 allergens [MILK]             slicer true   cost 1000 retail 1499
#   Item   B1  SKU "BREAD-ITA"  BREAD  case_life 720  markdown_window 60  allergens [WHEAT]              slicer false  cost 120  retail 250
#   Item   P1  SKU "PLAT-CLASSIC" CATERING_PLATTER case_life 480 markdown 60 allergens [MILK, WHEAT]    slicer false  cost 900  retail 1800
#   Assoc  A1  employee_number "E-1001" primary_role DELI_CLERK        allergy_set []
#   Assoc  A2  employee_number "E-1002" primary_role DELI_MANAGER      allergy_set []
#   Assoc  A3  employee_number "E-1003" primary_role BAKERY_COORDINATOR allergy_set []
#   Assoc  A4  employee_number "E-1004" primary_role DELI_CLERK        allergy_set [MILK, WHEAT, SOY]
#   Slicer C1  asset_tag "SL-1" sanitation_cycle_limit 25, assigned_operator A1, on store S2
#   Slicer C2  asset_tag "SL-2" sanitation_cycle_limit 25, on store S2
#   Position PLATTER = 4.0 lbs; SLA = 12 * 1 + ceil(LBS / 0.5) minutes
#   S1 is positioned at a case_on_hand_lbs of 60.0 so that posture reads
#   RESTRICTED with reason INVENTORY_TRIGGERED throughout the chains below
#   (60.0 + 384.0 = 444.0 > 420.0), while protection_index stays 100.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: case_yield_cost_dual_variant_on_batch
        grounds:
          - calculations.batch_case_yield_cost
          - entities.ProductionBatch.fields.case_yield_cost_provisional_cents
          - entities.ProductionBatch.fields.case_yield_cost_final_cents
          - validations[priority=38]
        distinguishing_aspect: "For one identical ProductionBatch row, the provisional write (no verified waste) and the ledger write made after a verified WasteRecord differ by exactly the verified record's round_half_up(discard_lbs * unit_cost_cents) plus its tier handling fee — 0 in the first instance and 250 cents in the second — proving the two variants are genuinely different formulas on the same data."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T06:00:00Z. Store S1 exists. Items J1, J2, B1 exist. Associates A1, A2, A3 exist. S1 already holds 60.0 lbs of case stock, so posture is RESTRICTED/INVENTORY_TRIGGERED."
            - "Batch BR1 (J2, 16.0 lbs) is produced on S1 and completed, so production_status=ON_LINE and hold_status=HOLDING. Slicer C2 supplies the required slicer; C2's cut counter is 5 at completion."
            - "No sanitizer cycle is opened, and no ticket reserve is held, so protection_index stays 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /deli/stores"
              payload: { store_number: "101", name: "Store One", deli_case_capacity_lbs: 420, hot_bar_capacity_lbs: 90, sub_station_count: 2 }
              as: PlatformAdmin
              captures: { s1: $.data.id, v_s1: $.data.version }
            - call: "POST /deli/items"
              payload: { sku: "SUBS-001", name: "Classic Sub", category: "SUB", unit_cost_cents: 480, retail_price_per_lb_cents: 799, case_life_minutes: 240, markdown_window_minutes: 30, allergen_flags: ["WHEAT", "MILK", "SOY"], slicer_required: false, bread_deli_item_id: null }
              as: PlatformAdmin
              captures: { j1: $.data.id }
            - call: "POST /deli/items"
              payload: { sku: "CC-TURK-01", name: "Turkey Breast", category: "COLD_CUT", unit_cost_cents: 520, retail_price_per_lb_cents: 899, case_life_minutes: 180, markdown_window_minutes: 30, allergen_flags: ["MILK"], slicer_required: true }
              as: PlatformAdmin
              captures: { j2: $.data.id }
            - call: "POST /deli/items"
              payload: { sku: "BREAD-ITA", name: "Italian Roll", category: "BREAD", unit_cost_cents: 120, retail_price_per_lb_cents: 250, case_life_minutes: 720, markdown_window_minutes: 60, allergen_flags: ["WHEAT"], slicer_required: false }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - call: "POST /deli/associates"
              payload: { store_id: "${s1}", employee_number: "E-1001", full_name: "Ana One", primary_role: "DELI_CLERK", allergy_set: ["MILK", "WHEAT", "SOY"] }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /deli/associates"
              payload: { store_id: "${s1}", employee_number: "E-1002", full_name: "Bea Two", primary_role: "DELI_MANAGER" }
              as: PlatformAdmin
              captures: { a2: $.data.id }
            - call: "POST /deli/associates"
              payload: { store_id: "${s1}", employee_number: "E-1003", full_name: "Cal Three", primary_role: "BAKERY_COORDINATOR" }
              as: PlatformAdmin
              captures: { a3: $.data.id }
            - call: "POST /deli/certifications"
              payload: { store_id: "${s1}", associate_id: "${a1}", cert_type: "SLICER_OPERATION", issued_at: "2026-09-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /deli/certifications"
              payload: { store_id: "${s1}", associate_id: "${a1}", cert_type: "FOOD_HANDLING", issued_at: "2026-09-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { c_a1_fh: $.data.id }
            - call: "POST /deli/slicers"
              payload: { store_id: "${s1}", asset_tag: "SL-1", sanitation_cycle_limit: 25, assigned_operator_id: "${a1}" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /deli/production-batches"
              payload: { store_id: "${s1}", deli_item_id: "${j2}", slicer_id: "${c2}", produced_by_associate_id: "${a1}", batch_code: "B-001", planned_lbs: 16 }
              as: DeliClerk
              as_user_id: "${a1}"
              captures: { br1: $.data.id, br1_v: $.data.version }
            - call: "POST /deli/production-batches"
              payload: { store_id: "${s1}", deli_item_id: "${j1}", produced_by_associate_id: "${a1}", batch_code: "B-002", planned_lbs: 6.4 }
              as: DeliClerk
              as_user_id: "${a1}"
              captures: { bh1: $.data.id }
            - call: "POST /deli/price-files"
              payload: { store_id: "${s1}", file_label: "PF-0901", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", item_price_count: 6 }
              as: ScaleOperator
              captures: { pf1: $.data.id }
            - call: "POST /deli/price-files/${pf1}/activate"
              payload: {}
              as: ScaleOperator
          trigger:
            - call: "POST /deli/production-batches/${br1}/complete"
              payload: { produced_lbs: 16 }
              as: DeliClerk
              as_user_id: "${a1}"
              captures: { br1_v2: $.data.version }
            - call: "POST /deli/waste-records"
              payload: { store_id: "${s1}", production_batch_id: "${br1}", markdown_by_associate_id: "${a2}", reason: "QUALITY" }
              as: DeliClerk
              as_user_id: "${a1}"
              captures: { wr1: $.data.id }
            - call: "POST /deli/waste-records/${wr1}/discard"
              payload: { discard_lbs: 14 }
              as: DeliClerk
              as_user_id: "${a1}"
            - call: "POST /deli/waste-records/${wr1}/verify"
              payload: { verifier_associate_id: "${a1}", verified_by_certification_id: "${c_a1_fh}", expected_batch_version: "${br1_v2}" }
              as: DeliManager
              as_user_id: "${a2}"
          assert:
            - "ProductionBatch.${br1}.case_yield_cost_provisional_cents == 3269"
            - "ProductionBatch.${br1}.case_yield_cost_final_cents == 3519"
            - "ProductionBatch.${br1}.case_yield_cost_final_cents - ProductionBatch.${br1}.case_yield_cost_provisional_cents == 250"
            - "WasteRecord.${wr1}.discard_value_cents == 7280 and WasteRecord.${wr1}.handling_fee_cents == 250 and WasteRecord.${wr1}.total_liability_cents == 7530"

      - name: bread_demand_dual_variant_on_promotion
        grounds:
          - calculations.promo_bread_demand
          - entities.Promotion.fields.required_bread_units
          - entities.Promotion.fields.settled_bread_units
          - state_machines.Promotion.ACTIVE_to_SETTLED
        distinguishing_aspect: "One Promotion with a 1.65 uplift forecasts 720 required bread units while ACTIVE and settles to 372 once week_end_date passes, because the settled variant caps the uplift at 0.35 before forecasting — a 348-unit divergence on identical input data."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T06:00:00Z. Store S2, item J1, bread item B1 exist. Promotion PX covers [2026-09-07T00:00:00Z, 2026-09-14T00:00:00Z) with forecast_uplift_pct 1.65 and trailing_baseline_units 240."
            - "PX is ACTIVE with required_bread_units 720 (provisional variant). No bread supply order has been raised, so settling is not blocked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /deli/stores"
              payload: { store_number: "102", name: "Store Two", deli_case_capacity_lbs: 240, hot_bar_capacity_lbs: 40, sub_station_count: 2 }
              as: PlatformAdmin
              captures: { s2: $.data.id }
            - call: "POST /deli/items"
              payload: { sku: "SUBS-001", name: "Classic Sub", category: "SUB", unit_cost_cents: 480, retail_price_per_lb_cents: 799, case_life_minutes: 240, markdown_window_minutes: 30, allergen_flags: ["WHEAT", "MILK", "SOY"], slicer_required: false }
              as: PlatformAdmin
              captures: { j1: $.data.id }
            - call: "POST /deli/items"
              payload: { sku: "BREAD-ITA", name: "Italian Roll", category: "BREAD", unit_cost_cents: 120, retail_price_per_lb_cents: 250, case_life_minutes: 720, markdown_window_minutes: 60, allergen_flags: ["WHEAT"], slicer_required: false }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - call: "POST /deli/promotions"
              payload: { promo_code: "FEAT-0914", deli_item_id: "${j1}", week_start_date: "2026-09-07T00:00:00Z", week_end_date: "2026-09-14T00:00:00Z", forecast_uplift_pct: 1.65, trailing_baseline_units: 240 }
              as: DeliManager
              captures: { promo: $.data.id, promo_v: $.data.version }
            - call: "POST /deli/promotions/${promo}/activate"
              payload: {}
              as: DeliManager
              captures: { promo_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /deli/promotions/${promo}/settle"
              payload: {}
              as: DeliManager
          assert:
            - "Promotion.${promo}.status == SETTLED"
            - "Promotion.${promo}.required_bread_units == 720"
            - "Promotion.${promo}.settled_bread_units == 372"
            - "Promotion.${promo}.settled_bread_units != Promotion.${promo}.required_bread_units"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: line_total_per_line_rounding_order
        grounds:
          - calculations.sub_ticket_line_total
          - calculations.promised_time_sla
          - entities.SubTicket.fields.line_total_cents
          - entities.SubTicket.fields.promised_at
        distinguishing_aspect: "Two tickets over the same 899 cents-per-pound item price produce line_total_cents 1754 for line units (3,3) and 1461 for (3,2), because the formula rounds per line and then sums — sum-then-round on (3,3) would produce 1753 — while promised_at moves the other way (06:18 vs 06:17) from the ceil-based prep formula, so two combinatorial modes are pinned on one entity."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T06:00:00Z. Store S1 is empty. Items J1, J2 and B1 exist. Associates A1 (DELI_CLERK), A2 (DELI_MANAGER) and A3 (BAKERY_COORDINATOR) exist, with A1 holding ACTIVE SLICER_OPERATION and FOOD_HANDLING certifications."
            - "Slicers C2 (SL-1) and C3 (SL-2) exist on S1 with A1 assigned. Batches BB1 (16.0 lbs of J2) and BQ1 (30.0 lbs of J2) are produced and completed, so S1 holds 46.0 lbs of J2 and its posture derives RESTRICTED with reason INVENTORY_TRIGGERED (46.0 > 30% of the 420 lb case capacity)."
            - "An ACTIVE price file PF1 covers the logical clock for S1. No Promotion is ACTIVE, so the ticket uplift is 0.0 for both tickets."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /deli/stores"
              payload: { store_number: "101", name: "Store One", deli_case_capacity_lbs: 420, hot_bar_capacity_lbs: 90, sub_station_count: 2 }
              as: PlatformAdmin
              captures: { s1: $.data.id, v_s1: $.data.version }
            - call: "POST /deli/items"
              payload: { sku: "SUBS-001", name: "Classic Sub", category: "SUB", unit_cost_cents: 480, retail_price_per_lb_cents: 799, case_life_minutes: 240, markdown_window_minutes: 30, allergen_flags: ["WHEAT", "MILK", "SOY"], slicer_required: false }
              as: PlatformAdmin
              captures: { j1: $.data.id }
            - call: "POST /deli/items"
              payload: { sku: "CC-TURK-01", name: "Turkey Breast", category: "COLD_CUT", unit_cost_cents: 520, retail_price_per_lb_cents: 899, case_life_minutes: 180, markdown_window_minutes: 30, allergen_flags: ["MILK"], slicer_required: true }
              as: PlatformAdmin
              captures: { j2: $.data.id }
            - call: "POST /deli/items"
              payload: { sku: "BREAD-ITA", name: "Italian Roll", category: "BREAD", unit_cost_cents: 120, retail_price_per_lb_cents: 250, case_life_minutes: 720, markdown_window_minutes: 60, allergen_flags: ["WHEAT"], slicer_required: false }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - call: "POST /deli/associates"
              payload: { store_id: "${s1}", employee_number: "E-1001", full_name: "Ana One", primary_role: "DELI_CLERK", allergy_set: ["MILK", "WHEAT", "SOY"] }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /deli/associates"
              payload: { store_id: "${s1}", employee_number: "E-1002", full_name: "Bea Two", primary_role: "DELI_MANAGER" }
              as: PlatformAdmin
              captures: { a2: $.data.id }
            - call: "POST /deli/associates"
              payload: { store_id: "${s1}", employee_number: "E-1003", full_name: "Cal Three", primary_role: "BAKERY_COORDINATOR" }
              as: PlatformAdmin
              captures: { a3: $.data.id }
            - call: "POST /deli/certifications"
              payload: { store_id: "${s1}", associate_id: "${a1}", cert_type: "SLICER_OPERATION", issued_at: "2026-09-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /deli/certifications"
              payload: { store_id: "${s1}", associate_id: "${a1}", cert_type: "FOOD_HANDLING", issued_at: "2026-09-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { c_a1_fh: $.data.id }
            - call: "POST /deli/slicers"
              payload: { store_id: "${s1}", asset_tag: "SL-1", sanitation_cycle_limit: 25, assigned_operator_id: "${a1}" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /deli/slicers"
              payload: { store_id: "${s1}", asset_tag: "SL-2", sanitation_cycle_limit: 25, assigned_operator_id: "${a1}" }
              as: PlatformAdmin
              captures: { c3: $.data.id }
            - call: "POST /deli/price-files"
              payload: { store_id: "${s1}", file_label: "PF-0901", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", item_price_count: 6 }
              as: ScaleOperator
              captures: { pf1: $.data.id }
            - call: "POST /deli/price-files/${pf1}/activate"
              payload: {}
              as: ScaleOperator
            - call: "POST /deli/production-batches"
              payload: { store_id: "${s1}", deli_item_id: "${j2}", slicer_id: "${c2}", produced_by_associate_id: "${a1}", batch_code: "B-001", planned_lbs: 16 }
              as: DeliClerk
              as_user_id: "${a1}"
              captures: { bb1: $.data.id }
            - call: "POST /deli/production-batches"
              payload: { store_id: "${s1}", deli_item_id: "${j2}", slicer_id: "${c3}", produced_by_associate_id: "${a1}", batch_code: "B-010", planned_lbs: 30 }
              as: DeliClerk
              as_user_id: "${a1}"
              captures: { bq1: $.data.id }
            - call: "POST /deli/production-batches/${bb1}/start"
              payload: { expected_store_version: "${v_s1}" }
              as: DeliClerk
              as_user_id: "${a1}"
            - call: "POST /deli/production-batches/${bb1}/complete"
              payload: { produced_lbs: 16 }
              as: DeliClerk
              as_user_id: "${a1}"
            - call: "GET /deli/stores/${s1}"
              payload: {}
              as: DeliClerk
              captures: { v_s1_b: $.data.version }
            - call: "POST /deli/production-batches/${bq1}/start"
              payload: { expected_store_version: "${v_s1_b}" }
              as: DeliClerk
              as_user_id: "${a1}"
            - call: "POST /deli/production-batches/${bq1}/complete"
              payload: { produced_lbs: 30 }
              as: DeliClerk
              as_user_id: "${a1}"
          trigger:
            - call: "POST /deli/sub-tickets"
              payload: { store_id: "${s1}", deli_item_id: "${j1}", bread_deli_item_id: "${b1}", order_channel: "DIGITAL", lines: [{ deli_item_id: "${j2}", half_lb_units: 3, line_sequence_number: 1 }, { deli_item_id: "${j2}", half_lb_units: 3, line_sequence_number: 2 }] }
              as: DeliClerk
              as_user_id: "${a1}"
              captures: { t1: $.data.id }
            - call: "POST /deli/sub-tickets"
              payload: { store_id: "${s1}", deli_item_id: "${j1}", bread_deli_item_id: "${b1}", order_channel: "DIGITAL", lines: [{ deli_item_id: "${j2}", half_lb_units: 3, line_sequence_number: 1 }, { deli_item_id: "${j2}", half_lb_units: 2, line_sequence_number: 2 }] }
              as: DeliClerk
              as_user_id: "${a1}"
              captures: { t2: $.data.id }
          assert:
            - "SubTicket.${t1}.line_total_cents == 1754"
            - "SubTicket.${t2}.line_total_cents == 1461"
            - "SubTicket.${t1}.line_total_cents - SubTicket.${t2}.line_total_cents == 293"
            - "SubTicket.${t1}.promised_at == 2026-09-02T06:18:00Z and SubTicket.${t2}.promised_at == 2026-09-02T06:17:00Z"

      - name: waste_liability_prior_record_order_dependency
        grounds:
          - calculations.waste_markdown_liability
          - calculations.store_waste_liability
          - entities.WasteRecord.fields.handling_fee_cents
          - entities.WasteRecord.fields.total_liability_cents
        distinguishing_aspect: "Discarding the 5.0 lb record first (total 5000, fee 0) then the 13.0 lb record (fee 250 because its tier base reads the first record's settled total) yields 18250 cents of store waste liability, whereas discarding the 13.0 lb record first would give that record fee 0 and the 5.0 lb record fee 0 — so evaluation order is a pinned, observable decision."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T06:00:00Z. Store S3 exists, item J4 (markdown_window_minutes 30, unit_cost 1000) exists, associates A2 and A3 exist and both hold ACTIVE FOOD_HANDLING certifications. S3 holds 14.0 lbs of J4 case stock."
            - "Both batches are produced at 05:50Z with case_life 120 minutes, so both sit inside their half-open markdown windows [07:50Z, 08:20Z) from 07:55Z onwards. The second discard is issued immediately after the first, so their created_at ordering is strictly ascending."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /deli/stores"
              payload: { store_number: "103", name: "Store Three", deli_case_capacity_lbs: 300, hot_bar_capacity_lbs: 60, sub_station_count: 1 }
              as: PlatformAdmin
              captures: { s3: $.data.id, v_s3: $.data.version }
            - call: "POST /deli/items"
              payload: { sku: "CC-PROSC-01", name: "Prosciutto", category: "COLD_CUT", unit_cost_cents: 1000, retail_price_per_lb_cents: 1499, case_life_minutes: 120, markdown_window_minutes: 30, allergen_flags: ["MILK"], slicer_required: true }
              as: PlatformAdmin
              captures: { j4: $.data.id }
            - call: "POST /deli/associates"
              payload: { store_id: "${s3}", employee_number: "E-1002", full_name: "Bea Two", primary_role: "DELI_MANAGER" }
              as: PlatformAdmin
              captures: { a2: $.data.id }
            - call: "POST /deli/associates"
              payload: { store_id: "${s3}", employee_number: "E-1003", full_name: "Cal Three", primary_role: "BAKERY_COORDINATOR" }
              as: PlatformAdmin
              captures: { a3: $.data.id }
            - call: "POST /deli/certifications"
              payload: { store_id: "${s3}", associate_id: "${a3}", cert_type: "FOOD_HANDLING", issued_at: "2026-09-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { c_a3_fh: $.data.id }
            - call: "POST /deli/slicers"
              payload: { store_id: "${s3}", asset_tag: "SL-3", sanitation_cycle_limit: 25, assigned_operator_id: "${a3}" }
              as: PlatformAdmin
              captures: { c4: $.data.id }
            - call: "POST /deli/production-batches"
              payload: { store_id: "${s3}", deli_item_id: "${j4}", slicer_id: "${c4}", produced_by_associate_id: "${a3}", batch_code: "B-020", planned_lbs: 5 }
              as: DeliClerk
              as_user_id: "${a3}"
              captures: { bx: $.data.id }
