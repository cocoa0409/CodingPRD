scenario: "1902. Temporary Power & Climate Rental (Aggreko style): load calculation & equipment sizing, cable/distribution accessory kit, fuel management & runtime monitoring, emergency response SLA & standby contract, permitting & emissions rules by locale, on-site technician & fuel-delivery coordination, damage/environmental spill liability, day/week/month rate breaks with de-mob"

domain_name: "temporary-power-climate-rental"
api_prefix: "/power-rental"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer organization legal name" }
      - { name: billing_email, type: string, source: input, description: "Invoice recipient email" }
      - { name: credit_status, type: enum, source: input, description: "Credit posture; gates fiscal operations", default: GOOD, constraints: "GOOD | WATCH | HOLD" }
      - { name: standby_contract, type: boolean, source: input, description: "Whether customer holds a standby emergency-response agreement", default: false }
      - { name: sla_response_minutes, type: integer, source: input, description: "Guaranteed emergency on-site response minutes when standby_contract is true", default: 240, constraints: "> 0" }
      - { name: loyalty_discount_pct, type: number, source: input, description: "Fractional discount applied per invoice line (e.g. 0.07 = 7%)", default: 0, constraints: "0 <= x < 1" }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: jurisdiction_code, type: string, source: input, description: "Permitting/emissions locale code, e.g. CA-SCAQMD, TX-TCEQ, FL-DEP; unlisted codes use DEFAULT cap" }
      - { name: fuel_tank_capacity_liters, type: integer, source: input, description: "On-site fuel tank capacity", constraints: "> 0" }
      - { name: tank_level_liters, type: number, source: computed, description: "Current tank level = sum of FUEL_DELIVERY minus FUEL_PUMP_OUT telemetry over all contracts at this site", default: 0 }

  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - { name: unit_type, type: enum, source: input, description: "Fleet class", constraints: "GENERATOR | CHILLER" }
      - { name: capacity_kw, type: integer, source: input, description: "Rated capacity in kW (chillers: kW-equivalent cooling)", constraints: "> 0" }
      - { name: fuel_type, type: enum, source: input, description: "Prime fuel", constraints: "DIESEL | NATURAL_GAS" }
      - { name: emissions_tier, type: enum, source: input, description: "EPA emissions tier", constraints: "TIER_2 | TIER_4F" }
      - { name: nox_g_per_kwh, type: number, source: input, description: "NOx emission factor in g/kWh", constraints: "> 0" }
      - { name: day_rate_cents, type: integer, source: input, description: "Daily rental rate snapshot source", constraints: "> 0" }
      - { name: week_rate_cents, type: integer, source: input, description: "Weekly rate (7 days)", constraints: "> 0" }
      - { name: month_rate_cents, type: integer, source: input, description: "Monthly rate (28 days)", constraints: "> 0" }
      - { name: demob_fee_cents, type: integer, source: input, description: "Flat demobilization fee charged once per equipment line at off-hire", constraints: ">= 0" }
      - { name: home_depot_code, type: string, source: input, description: "Home depot identifier" }
      - { name: status, type: enum, source: system, description: "Fleet lifecycle state", default: AVAILABLE, constraints: "AVAILABLE | RESERVED | DEPLOYED | OFF_RENT | QUARANTINED | MAINTENANCE" }
      - { name: current_site_id, type: string, source: system, description: "FK -> Site.id; nullable; set while DEPLOYED, cleared on off-hire", default: null }
      - { name: runtime_hours_total, type: number, source: computed, description: "Lifetime sum of RUNTIME telemetry deltas for this unit", default: 0 }
      - { name: fuel_consumed_liters_total, type: number, source: computed, description: "Lifetime sum of FUEL_BURN telemetry deltas for this unit", default: 0 }

  - name: AccessoryKit
    parent: null
    common_fields: false
    fields:
      - { name: kit_code, type: string, source: input, description: "Unique catalog code, e.g. CABLE-400A", constraints: "unique" }
      - { name: description, type: string, source: input, description: "Kit contents description (cable runs, distro panels)" }
      - { name: max_ampacity_a, type: integer, source: input, description: "Maximum ampacity one kit supports", constraints: "> 0" }
      - { name: day_rate_cents, type: integer, source: input, description: "Daily kit rate per quantity unit", constraints: "> 0" }
      - { name: week_rate_cents, type: integer, source: input, description: "Weekly kit rate", constraints: "> 0" }
      - { name: month_rate_cents, type: integer, source: input, description: "Monthly (28-day) kit rate", constraints: "> 0" }

  - name: RentalContract
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; renting customer" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; deployment site (drives jurisdiction)" }
      - { name: load_profile, type: array, source: input, description: "Array of { load_type, nameplate_kw }; load_type in CONTINUOUS | INTERMITTENT | STANDBY" }
      - { name: sizing_method, type: enum, source: system, description: "Sizing variant last applied by size-load", constraints: "NAMEPLATE_SUM | DIVERSIFIED_DEMAND", default: null }
      - { name: sized_kw, type: integer, source: computed, description: "Required capacity computed by load_sizing; null until size-load runs", default: null }
      - { name: status, type: enum, source: system, description: "Contract lifecycle", default: DRAFT, constraints: "DRAFT | QUOTED | CONFIRMED | MOBILIZING | ON_RENT | SUSPENDED | OFF_HIRE | CLOSED | CANCELLED | EXPIRED" }
      - { name: start_date, type: datetime, source: input, description: "Rental window start (UTC); reservation lower bound (inclusive)" }
      - { name: expected_offhire_date, type: datetime, source: input, description: "Expected end (UTC); reservation upper bound (exclusive)" }
      - { name: quoted_at, type: datetime, source: system, description: "Logical-clock timestamp of last quote", default: null }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Provisional total from rental_charge_accrual PROVISIONAL variant", default: null }
      - { name: on_rent_at, type: datetime, source: system, description: "Timestamp of ON_RENT entry", default: null }
      - { name: actual_offhire_at, type: datetime, source: system, description: "Timestamp of off-hire; final charge horizon", default: null }
      - { name: invoice_total_cents, type: integer, source: computed, description: "Final invoice from invoice_total at close", default: null }

  - name: RentalLine
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> RentalContract.id; owning contract" }
      - { name: line_type, type: enum, source: input, description: "Polymorphic line kind", constraints: "EQUIPMENT | ACCESSORY_KIT" }
      - { name: equipment_unit_id, type: string, source: input, description: "FK -> EquipmentUnit.id; required iff line_type EQUIPMENT, else null", default: null }
      - { name: accessory_kit_id, type: string, source: input, description: "FK -> AccessoryKit.id; required iff line_type ACCESSORY_KIT, else null", default: null }
      - { name: quantity, type: integer, source: input, description: "Kit count; must be 1 for EQUIPMENT lines", default: 1, constraints: ">= 1" }
      - { name: day_rate_cents, type: integer, source: system, description: "Rate snapshot from unit/kit at line-add time (pinned for life of line)" }
      - { name: week_rate_cents, type: integer, source: system, description: "Rate snapshot" }
      - { name: month_rate_cents, type: integer, source: system, description: "Rate snapshot" }
      - { name: demob_fee_cents, type: integer, source: system, description: "Demob fee snapshot; 0 for ACCESSORY_KIT lines", default: 0 }
      - { name: status, type: enum, source: system, description: "Line lifecycle (cascade-driven plus partial off-hire/return actions)", default: PENDING, constraints: "PENDING | ON_RENT | OFF_HIRED | RETURNED | RELEASED" }
      - { name: final_charge_cents, type: integer, source: computed, description: "Final line charge incl. demob, set at line off-hire (rental_charge_accrual FINAL)", default: null }
      - { name: offhired_at, type: datetime, source: system, description: "Timestamp this line went off-hire (partial or contract-level)", default: null }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> RentalContract.id; contract this permit covers" }
      - { name: permit_type, type: enum, source: input, description: "Permit category", constraints: "EMISSIONS | NOISE" }
      - { name: jurisdiction_code, type: string, source: system, description: "Copied from contract site at creation" }
      - { name: status, type: enum, source: system, description: "Permit review lifecycle with resubmit loop", default: DRAFT, constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED" }
      - { name: review_rounds, type: integer, source: system, description: "Number of submissions so far; resubmit rejected when >= 3", default: 0 }
      - { name: submitted_at, type: datetime, source: system, description: "Last submission timestamp", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Last decision timestamp", default: null }

  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> RentalContract.id; contract being serviced" }
      - { name: visit_type, type: enum, source: input, description: "Visit kind", constraints: "TECHNICIAN | FUEL_DELIVERY | EMERGENCY" }
      - { name: status, type: enum, source: system, description: "Visit lifecycle", default: SCHEDULED, constraints: "SCHEDULED | DISPATCHED | ON_SITE | COMPLETED | CANCELLED" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned window start; required unless EMERGENCY", default: null }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned window end; required unless EMERGENCY", default: null }
      - { name: assigned_technician_id, type: string, source: input, description: "Opaque technician identifier; set at create or dispatch; ownership field for FieldTechnician actions", default: null }
      - { name: fuel_quantity_liters, type: number, source: input, description: "Liters delivered; required iff visit_type FUEL_DELIVERY", default: null }
      - { name: requested_at, type: datetime, source: system, description: "EMERGENCY: logical-clock timestamp of request", default: null }
      - { name: dispatched_at, type: datetime, source: system, description: "Timestamp of dispatch", default: null }
      - { name: arrived_at, type: datetime, source: system, description: "Timestamp of on-site arrival", default: null }
      - { name: response_minutes, type: integer, source: computed, description: "EMERGENCY: ceil((arrived_at - requested_at) in minutes), set at arrive", default: null }
      - { name: sla_met, type: boolean, source: computed, description: "EMERGENCY: response_minutes <= customer.sla_response_minutes, set at arrive", default: null }

  - name: TelemetryEvent
    parent: null
    common_fields: false
    fields:
      - { name: equipment_unit_id, type: string, source: input, description: "FK -> EquipmentUnit.id; required for RUNTIME and FUEL_BURN, null for FUEL_DELIVERY and FUEL_PUMP_OUT", default: null }
      - { name: contract_id, type: string, source: input, description: "FK -> RentalContract.id; contract context (site derived from contract)" }
      - { name: event_type, type: enum, source: input, description: "Telemetry kind", constraints: "RUNTIME | FUEL_BURN | FUEL_DELIVERY | FUEL_PUMP_OUT" }
      - { name: value, type: number, source: input, description: "Hours delta (RUNTIME) or liters delta (FUEL_BURN, FUEL_DELIVERY, FUEL_PUMP_OUT)", constraints: "> 0" }
      - { name: recorded_at, type: datetime, source: input, description: "Event timestamp; defaults to logical clock now; must be <= now", default: null }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> RentalContract.id; contract under which damage/spill occurred" }
      - { name: equipment_unit_id, type: string, source: input, description: "FK -> EquipmentUnit.id; damaged or spilled unit (must be on an active line of the contract)" }
      - { name: incident_type, type: enum, source: input, description: "DAMAGE (equipment damage) or SPILL (environmental fuel spill)", constraints: "DAMAGE | SPILL" }
      - { name: spill_volume_liters, type: number, source: input, description: "Spilled liters; required iff incident_type SPILL", default: null }
      - { name: notes, type: string, source: input, description: "Free-text report", default: null }
      - { name: status, type: enum, source: system, description: "Claim lifecycle", default: REPORTED, constraints: "REPORTED | ASSESSED | CHARGED | WAIVED" }
      - { name: assessed_charge_cents, type: integer, source: system, description: "Liability charge set at assessment", default: null }
      - { name: assessed_by, type: string, source: system, description: "Opaque user id of assessing ClaimsAssessor (segregation-of-duties anchor)", default: null }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EquipmentUnit
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "cascade: POST /power-rental/rental-contracts/{id}/lines with line_type EQUIPMENT"
        actor: system
        preconditions:
          - "no other RentalLine with status IN {PENDING, ON_RENT} on this unit whose contract window [start_date, expected_offhire_date) half-open-overlaps the new contract window"
          - "site jurisdiction cap <= 5.0 implies unit.emissions_tier == TIER_4F"
        side_effects:
          - "unit bound to the new RentalLine; RentalLine status PENDING"
      - from: RESERVED
        to: AVAILABLE
        trigger: "cascade: contract cancel (DRAFT/QUOTED/CONFIRMED -> CANCELLED) or quote-expiry sweep (QUOTED -> EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "compensating release: RentalLine PENDING -> RELEASED; fleet AVAILABLE pool restored"
      - from: RESERVED
        to: DEPLOYED
        trigger: "cascade: POST /power-rental/rental-contracts/{id}/start-rental"
        actor: system
        preconditions: ["parent contract MOBILIZING"]
        side_effects:
          - "current_site_id := contract.site_id"
      - from: DEPLOYED
        to: OFF_RENT
        trigger: "cascade: RentalLine ON_RENT -> OFF_HIRED (partial line off-hire, contract off-hire, or spill-assess cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "current_site_id := null"
      - from: DEPLOYED
        to: QUARANTINED
        trigger: "cascade: POST /power-rental/incidents with incident_type SPILL naming this unit (cascade link 1)"
        actor: system
        preconditions: ["unit DEPLOYED on the contract the incident references"]
        side_effects:
          - "unit quarantine itself transitions the parent RentalContract ON_RENT -> SUSPENDED (cascade link 2)"
      - from: QUARANTINED
        to: MAINTENANCE
        trigger: "cascade: POST /power-rental/incidents/{id}/assess on the SPILL incident"
        actor: system
        preconditions: []
        side_effects:
          - "unit enters decontamination/maintenance queue"
      - from: OFF_RENT
        to: MAINTENANCE
        trigger: "cascade: POST /power-rental/rental-lines/{id}/return"
        actor: system
        preconditions: []
        side_effects:
          - "unit queued for inspection/maintenance at home depot"
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /power-rental/equipment-units/{id}/complete-maintenance"
        actor: DepotManager
        preconditions: ["unit.status == MAINTENANCE"]
        side_effects:
          - "increments EquipmentUnit.version by 1; unit rejoins rentable pool"

  - entity: RentalContract
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /power-rental/rental-contracts/{id}/quote"
        actor: SalesEngineer
        preconditions:
          - "sized_kw is not null (size-load has run)"
          - "at least one RentalLine exists"
          - "sum of capacity_kw over EQUIPMENT lines >= sized_kw"
          - "customer.credit_status != HOLD"
        side_effects:
          - "quoted_total_cents := rental_charge_accrual PROVISIONAL over [start_date, expected_offhire_date) using line snapshot rates; quoted_at := logical clock now"
          - "increments RentalContract.version by 1"
      - from: QUOTED
        to: DRAFT
        trigger: "POST /power-rental/rental-contracts/{id}/revise"
        actor: SalesEngineer
        preconditions: []
        side_effects:
          - "quote invalidated (quoted_at/quoted_total_cents cleared); lines may be added again"
          - "increments RentalContract.version by 1"
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /power-rental/rental-contracts/{id}/confirm"
        actor: SalesEngineer | Customer
        preconditions:
          - "expected_rental_contract_version == current version (OCC)"
          - "customer.credit_status != HOLD"
        side_effects:
          - "increments RentalContract.version by 1"
      - from: QUOTED
        to: EXPIRED
        trigger: "system sweep inside POST /_clock/set_current_utc when now > quoted_at + 7 days"
        actor: system
        preconditions: []
        side_effects:
          - "compensation cascade: each PENDING RentalLine -> RELEASED; each RESERVED EquipmentUnit -> AVAILABLE"
          - "increments RentalContract.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /power-rental/rental-contracts/{id}/cancel"
        actor: SalesEngineer | Customer
        preconditions: []
        side_effects:
          - "compensation cascade: PENDING lines -> RELEASED; RESERVED units -> AVAILABLE"
          - "increments RentalContract.version by 1"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /power-rental/rental-contracts/{id}/cancel"
        actor: SalesEngineer | Customer
        preconditions: []
        side_effects:
          - "compensation cascade: PENDING lines -> RELEASED; RESERVED units -> AVAILABLE"
          - "increments RentalContract.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /power-rental/rental-contracts/{id}/cancel"
        actor: SalesEngineer | Customer
        preconditions: []
        side_effects:
          - "compensation cascade: PENDING lines -> RELEASED; RESERVED units -> AVAILABLE"
          - "increments RentalContract.version by 1"
      - from: CONFIRMED
        to: MOBILIZING
        trigger: "POST /power-rental/rental-contracts/{id}/mobilize"
        actor: DepotManager
        preconditions:
          - "emissions_screening for the site says permit_required == false, OR an EMISSIONS Permit with status APPROVED exists for this contract"
        side_effects:
          - "increments RentalContract.version by 1"
      - from: MOBILIZING
        to: ON_RENT
        trigger: "POST /power-rental/rental-contracts/{id}/start-rental"
        actor: DepotManager
        preconditions: []
        side_effects:
          - "cascade: each PENDING RentalLine -> ON_RENT; each RESERVED EquipmentUnit -> DEPLOYED with current_site_id := site_id"
          - "on_rent_at := logical clock now"
          - "increments RentalContract.version by 1"
      - from: ON_RENT
        to: SUSPENDED
        trigger: "cascade: EquipmentUnit DEPLOYED -> QUARANTINED from SPILL incident creation (cascade link 2)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade link 3: every ServiceVisit with status SCHEDULED for this contract -> CANCELLED"
          - "increments RentalContract.version by 1"
      - from: SUSPENDED
        to: ON_RENT
        trigger: "cascade: POST /power-rental/incidents/{id}/assess on the SPILL incident that suspended this contract"
        actor: system
        preconditions: []
        side_effects:
          - "increments RentalContract.version by 1"
      - from: ON_RENT
        to: OFF_HIRE
        trigger: "POST /power-rental/rental-contracts/{id}/off-hire"
        actor: SalesEngineer | Customer
        preconditions: []
        side_effects:
          - "actual_offhire_at := logical clock now"
          - "cascade link 1: each ON_RENT RentalLine -> OFF_HIRED with final_charge_cents := rental_charge_accrual FINAL over [start_date, now) plus demob_fee_cents, offhired_at := now"
          - "each line OFF_HIRED transition cascades (link 2): its EquipmentUnit DEPLOYED -> OFF_RENT, current_site_id := null"
          - "increments RentalContract.version by 1"
      - from: OFF_HIRE
        to: CLOSED
        trigger: "POST /power-rental/rental-contracts/{id}/close"
        actor: SalesEngineer
        preconditions:
          - "no Incident for this contract in status REPORTED"
          - "all RentalLines in status IN {OFF_HIRED, RETURNED}"
        side_effects:
          - "invoice_total_cents := invoice_total calculation"
          - "cascade: each ASSESSED Incident -> CHARGED"
          - "increments RentalContract.version by 1"

  - entity: RentalLine
    initial_state: PENDING
    terminal_states: [RELEASED, RETURNED]
    transitions:
      - from: PENDING
        to: ON_RENT
        trigger: "cascade: contract MOBILIZING -> ON_RENT (start-rental)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: RELEASED
        trigger: "cascade: contract cancel or quote-expiry sweep"
        actor: system
        preconditions: []
        side_effects: ["EQUIPMENT lines: unit RESERVED -> AVAILABLE (compensation)"]
      - from: ON_RENT
        to: OFF_HIRED
        trigger: "POST /power-rental/rental-lines/{id}/off-hire (partial) OR cascade contract off-hire OR cascade spill-incident assess"
        actor: SalesEngineer | Customer | system
        preconditions:
          - "direct call: parent contract status IN {ON_RENT, SUSPENDED}"
        side_effects:
          - "final_charge_cents := rental_charge_accrual FINAL over [contract.start_date, now) + demob_fee_cents; offhired_at := now"
          - "cascade: EQUIPMENT lines flip their unit DEPLOYED (or QUARANTINED under spill-assess path) -> OFF_RENT when unit is DEPLOYED; QUARANTINED units are instead moved QUARANTINED -> MAINTENANCE by the spill-assess cascade"
      - from: OFF_HIRED
        to: RETURNED
        trigger: "POST /power-rental/rental-lines/{id}/return"
        actor: DepotManager
        preconditions: ["parent contract status IN {OFF_HIRE, CLOSED}"]
        side_effects:
          - "cascade: EQUIPMENT lines flip their unit OFF_RENT -> MAINTENANCE"

  - entity: Permit
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /power-rental/permits/{id}/submit"
        actor: SalesEngineer
        preconditions: []
        side_effects: ["review_rounds += 1; submitted_at := now; increments Permit.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /power-rental/permits/{id}/record-decision with outcome APPROVED"
        actor: SalesEngineer
        preconditions: []
        side_effects: ["decided_at := now; increments Permit.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /power-rental/permits/{id}/record-decision with outcome REJECTED"
        actor: SalesEngineer
        preconditions: []
        side_effects: ["decided_at := now; increments Permit.version by 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /power-rental/permits/{id}/resubmit"
        actor: SalesEngineer
        preconditions: ["review_rounds < 3"]
        side_effects: ["review_rounds += 1; submitted_at := now; increments Permit.version by 1"]

  - entity: ServiceVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /power-rental/service-visits/{id}/dispatch"
        actor: FleetDispatcher
        preconditions:
          - "assigned_technician_id provided (payload) and has no buffered schedule conflict"
        side_effects:
          - "assigned_technician_id := payload value; dispatched_at := now; increments ServiceVisit.version by 1"
      - from: DISPATCHED
        to: ON_SITE
        trigger: "POST /power-rental/service-visits/{id}/arrive"
        actor: FieldTechnician
        preconditions: ["acting X-User-ID == assigned_technician_id"]
        side_effects:
          - "arrived_at := now; EMERGENCY visits: response_minutes and sla_met computed (standby_sla_evaluation)"
          - "increments ServiceVisit.version by 1"
      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /power-rental/service-visits/{id}/complete"
        actor: FieldTechnician
        preconditions: ["acting X-User-ID == assigned_technician_id"]
        side_effects:
          - "FUEL_DELIVERY visits: auto-create TelemetryEvent FUEL_DELIVERY (value := fuel_quantity_liters) which raises Site.tank_level_liters (capacity check applies)"
          - "increments ServiceVisit.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /power-rental/service-visits/{id}/cancel OR cascade contract ON_RENT -> SUSPENDED"
        actor: FleetDispatcher | system
        preconditions: []
        side_effects: ["increments ServiceVisit.version by 1"]

  - entity: Incident
    initial_state: REPORTED
    terminal_states: [CHARGED, WAIVED]
    transitions:
      - from: REPORTED
        to: ASSESSED
        trigger: "POST /power-rental/incidents/{id}/assess"
        actor: ClaimsAssessor
        preconditions: []
        side_effects:
          - "assessed_charge_cents := payload; assessed_by := acting X-User-ID"
          - "SPILL incidents: unit QUARANTINED -> MAINTENANCE; the quarantined unit's ON_RENT RentalLine -> OFF_HIRED (final charge to now); parent contract SUSPENDED -> ON_RENT"
          - "increments Incident.version by 1"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /power-rental/incidents/{id}/waive"
        actor: DepotManager
        preconditions: ["acting X-User-ID != assessed_by (segregation of duties)"]
        side_effects:
          - "charge waived: excluded from invoice_total damage sum"
          - "increments Incident.version by 1"
      - from: ASSESSED
        to: CHARGED
        trigger: "cascade: contract OFF_HIRE -> CLOSED (close)"
        actor: system
        preconditions: []
        side_effects: ["assessed_charge_cents included in invoice_total damage sum"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: confirm-stale-contract-version
    parent_entity: RentalContract
    write_endpoint: "POST /power-rental/rental-contracts/{id}/confirm"
    occ_field: "expected_rental_contract_version"
    description: |
      Confirming a quote against a RentalContract whose version has advanced
      since the client last observed it (e.g. a revise/re-quote or a line
      change moved the version) is rejected as stale; only a confirm carrying
      the current version succeeds.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: line-add-stale-contract-version
    parent_entity: RentalContract
    write_endpoint: "POST /power-rental/rental-contracts/{id}/lines"
    occ_field: "expected_rental_contract_version"
    description: |
      Adding a RentalLine against a RentalContract whose version has advanced
      since the client last observed it is rejected as stale; the client must
      re-read the contract and retry with the current version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: load_sizing
    trigger: "POST /power-rental/rental-contracts/{id}/size-load"
    algorithm: aggregation
    formula: |
      variant NAMEPLATE_SUM:
        sized_kw = ceil( SAFETY_FACTOR * sum(entry.nameplate_kw for entry in contract.load_profile) )
      variant DIVERSIFIED_DEMAND:
        sized_kw = ceil( SAFETY_FACTOR * sum(entry.nameplate_kw * DEMAND_FACTOR[entry.load_type] for entry in contract.load_profile) )
    input_set: "all entries of contract.load_profile (any load_type); contract must be DRAFT"
    constants:
      SAFETY_FACTOR: 1.25
      DEMAND_FACTOR_CONTINUOUS: 1.0
      DEMAND_FACTOR_INTERMITTENT: 0.7
      DEMAND_FACTOR_STANDBY: 0.35
    precision: "integer kW, ceil"
    variants:
      - name: NAMEPLATE_SUM
        when: "payload sizing_method == NAMEPLATE_SUM"
        difference: "ignores load diversity; sums raw nameplate kW before safety factor"
      - name: DIVERSIFIED_DEMAND
        when: "payload sizing_method == DIVERSIFIED_DEMAND"
        difference: "weights each entry by its load_type demand factor before safety factor; strictly smaller whenever non-CONTINUOUS loads exist"

  - name: accessory_ampacity_requirement
    trigger: "POST /power-rental/rental-contracts/{id}/lines with line_type ACCESSORY_KIT"
    algorithm: constraint_propagation
    formula: |
      required_amps = ceil( contract.sized_kw * 1000 / (VOLTAGE * SQRT3) )
      line is adequate iff line.quantity * AccessoryKit.max_ampacity_a >= required_amps
    input_set: "contract.sized_kw (must be non-null), the referenced AccessoryKit, requested quantity"
    constants:
      VOLTAGE: 480
      SQRT3: 1.732
    precision: "integer amps, ceil"
    variants: []

  - name: rental_charge_accrual
    trigger: "POST /power-rental/rental-contracts/{id}/quote (PROVISIONAL) and line/contract off-hire (FINAL)"
    algorithm: tiered_pricing
    formula: |
      duration_days = ceil((end_at - start_at) / 86400 seconds); minimum 1 when end_at > start_at
      months = duration_days // 28; rem = duration_days - 28*months
      weeks = rem // 7; days = rem - 7*weeks
      day_block  = min(days * day_rate_cents, week_rate_cents) if days > 0 else 0
      rem_charge = min(weeks * week_rate_cents + day_block, month_rate_cents)
      time_charge_cents = months * month_rate_cents + rem_charge
      line_charge = time_charge_cents * quantity   (quantity is 1 for EQUIPMENT lines)
      Both PROVISIONAL and FINAL line charges add demob_fee_cents once per EQUIPMENT line.
    input_set: "per line: snapshot day/week/month rates, quantity, demob fee; horizon [contract.start_date, end_at) where end_at is expected_offhire_date (PROVISIONAL) or line/contract off-hire timestamp (FINAL)"
    constants:
      DAYS_PER_WEEK: 7
      DAYS_PER_MONTH: 28
    precision: "integer cents; all arithmetic exact integers"
    variants:
      - name: PROVISIONAL
        when: "quote time; end_at = expected_offhire_date; includes all PENDING lines; includes demob_fee_cents per EQUIPMENT line"
        difference: "forward-looking estimate written to contract.quoted_total_cents"
      - name: FINAL
        when: "off-hire time; end_at = actual off-hire timestamp per line; adds demob_fee_cents per EQUIPMENT line"
        difference: "actualized charge written to RentalLine.final_charge_cents; diverges from PROVISIONAL whenever actual duration differs from expected"

  - name: invoice_total
    trigger: "POST /power-rental/rental-contracts/{id}/close"
    algorithm: aggregation
    formula: |
      (1) per line: discounted_line_cents = round_half_up(final_charge_cents * (1 - customer.loyalty_discount_pct))
          -- ROUND PER LINE FIRST (pinned order; sum-then-round yields different cents)
      (2) lines_subtotal_cents = sum(discounted_line_cents)
      (3) damage_cents = sum(Incident.assessed_charge_cents for incidents transitioning ASSESSED -> CHARGED on this close)
      (4) fuel_credit_cents = round_half_up(total_pump_out_liters * FUEL_BUYBACK_CENTS_PER_LITER)
          where total_pump_out_liters = sum of FUEL_PUMP_OUT TelemetryEvent values for this contract
      (5) sla_credit_cents = SLA_BREACH_CREDIT_CENTS * (count of EMERGENCY ServiceVisits on this contract with sla_met == false)
      invoice_total_cents = lines_subtotal_cents + damage_cents - fuel_credit_cents - sla_credit_cents
    input_set: "lines with final_charge_cents set; incidents of this contract; FUEL_PUMP_OUT telemetry of this contract; EMERGENCY visits of this contract"
    constants:
      FUEL_BUYBACK_CENTS_PER_LITER: 180
      SLA_BREACH_CREDIT_CENTS: 25000
    precision: "integer cents; round_half_up at steps (1) and (4) only, in that order"
    variants: []

  - name: fuel_burn_projection
    trigger: "GET /power-rental/equipment-units/{id}/fuel-projection"
    algorithm: chronological
    formula: |
      variant RATED_CURVE:
        liters_per_hour = capacity_kw * LOAD_FACTOR * SPECIFIC_CONSUMPTION_L_PER_KWH
      variant METERED_AVG:
        window = TelemetryEvents for this unit with recorded_at in [now - 7 days, now] (both ends inclusive)
        if sum(RUNTIME values in window) == 0: fall back to RATED_CURVE result
        else liters_per_hour = sum(FUEL_BURN values in window) / sum(RUNTIME values in window)
      projected_liters_per_day = liters_per_hour * 24
      next_refuel_eta_hours = site.tank_level_liters / liters_per_hour   (site = unit.current_site_id)
    input_set: "unit capacity_kw; telemetry events of this unit in the trailing 7-day inclusive window; tank level of the unit's current site"
    constants:
      LOAD_FACTOR: 0.75
      SPECIFIC_CONSUMPTION_L_PER_KWH: 0.28
      METERED_WINDOW_DAYS: 7
    precision: "2 decimal places, round_half_up"
    variants:
      - name: RATED_CURVE
        when: "query param method=RATED_CURVE, or METERED_AVG fallback when the window has zero RUNTIME hours"
        difference: "manufacturer nameplate curve; independent of telemetry"
      - name: METERED_AVG
        when: "query param method=METERED_AVG (default)"
        difference: "actual metered burn rate over trailing window; identical unit and site yield different liters_per_hour than RATED_CURVE whenever metered rate differs from nameplate"

  - name: emissions_screening
    trigger: "GET /power-rental/sites/{id}/emissions-screening; also evaluated inside mobilize precondition"
    algorithm: threshold
    formula: |
      input units = EquipmentUnits referenced by EQUIPMENT RentalLines with status IN {PENDING, ON_RENT}
        belonging to contracts of this site with status IN {CONFIRMED, MOBILIZING, ON_RENT, SUSPENDED}
      aggregate_nox = round_half_up( sum(unit.nox_g_per_kwh * unit.capacity_kw) / sum(unit.capacity_kw), 2 )
        (0.0 when input set is empty)
      jurisdiction_cap = JURISDICTION_CAPS[site.jurisdiction_code] or DEFAULT_CAP
      permit_required = aggregate_nox >= jurisdiction_cap   (exact equality REQUIRES the permit)
    input_set: "reserved/deployed equipment of non-terminal contracts at the site, as filtered above"
    constants:
      JURISDICTION_CAP_CA_SCAQMD: 5.0
      JURISDICTION_CAP_TX_TCEQ: 8.0
      JURISDICTION_CAP_FL_DEP: 12.0
      DEFAULT_CAP: 10.0
      TIER2_BAN_CAP_AT_OR_BELOW: 5.0
    precision: "2 decimal places, round_half_up; comparison is >="
    variants: []

  - name: standby_sla_evaluation
    trigger: "POST /power-rental/service-visits/{id}/arrive for EMERGENCY visits"
    algorithm: threshold
    formula: |
      response_minutes = ceil((arrived_at - requested_at) in seconds / 60)
      sla_met = response_minutes <= customer.sla_response_minutes   (exact equality MEETS the SLA)
    input_set: "the EMERGENCY visit's requested_at/arrived_at; the contract customer's sla_response_minutes"
    constants: {}
    precision: "integer minutes, ceil"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role permitted for endpoint per §1.5 roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 2, category: auth, check: "segregation of duties: incident waive actor differs from assessed_by", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /power-rental/incidents/{id}/waive"] }
  - { priority: 2, category: auth, check: "ownership: Customer role may only touch own contracts/sites/incidents; FieldTechnician may only arrive/complete visits assigned to their X-User-ID", error_id: ERR_NOT_OWNER, http_status: 403, applies_to: ["Customer-scoped endpoints", "POST /power-rental/service-visits/{id}/arrive", "POST /power-rental/service-visits/{id}/complete"] }
  - { priority: 3, category: existence, check: "path id exists", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all parameterized endpoints" }
  - { priority: 3, category: existence, check: "body FK references exist (customer_id, site_id, equipment_unit_id, accessory_kit_id, contract_id)", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 422, applies_to: "endpoints taking body FKs" }
  - { priority: 4, category: state, check: "target resource in a valid from-state for the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 4, category: state, check: "terminal-state lockdown (CLOSED/CANCELLED/EXPIRED contract, COMPLETED/CANCELLED visit, CHARGED/WAIVED incident, APPROVED permit)", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 4, category: state, check: "OCC: expected_rental_contract_version equals current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /power-rental/rental-contracts/{id}/confirm", "POST /power-rental/rental-contracts/{id}/lines"] }
  - { priority: 5, category: business_safety, check: "TIER_2 unit may not be added to a contract whose site jurisdiction cap <= 5.0 (CA-SCAQMD)", error_id: ERR_EMISSIONS_TIER_NONCOMPLIANT, http_status: 422, applies_to: ["POST /power-rental/rental-contracts/{id}/lines"] }
  - { priority: 5, category: business_safety, check: "mobilize blocked when emissions_screening.permit_required and no APPROVED EMISSIONS permit exists for the contract", error_id: ERR_PERMIT_REQUIRED, http_status: 422, applies_to: ["POST /power-rental/rental-contracts/{id}/mobilize"] }
  - { priority: 5, category: business_safety, check: "fuel delivery must not raise site tank above capacity (level + qty <= capacity; equality allowed)", error_id: ERR_TANK_CAPACITY_EXCEEDED, http_status: 422, applies_to: ["POST /power-rental/telemetry-events", "POST /power-rental/service-visits/{id}/complete"] }
  - { priority: 6, category: business_temporal, check: "equipment reservation overlap: unit has no PENDING/ON_RENT line whose contract window half-open-overlaps [start_date, expected_offhire_date); adjacency (new.start == existing.end) is allowed", error_id: ERR_UNIT_RESERVED_CONFLICT, http_status: 409, applies_to: ["POST /power-rental/rental-contracts/{id}/lines"] }
  - { priority: 6, category: business_temporal, check: "technician buffered overlap: same assigned_technician_id, buffered windows [start-60min, end+60min) intersect; exactly 120-minute gaps are allowed", error_id: ERR_TECHNICIAN_SCHEDULE_CONFLICT, http_status: 409, applies_to: ["POST /power-rental/service-visits", "POST /power-rental/service-visits/{id}/dispatch"] }
  - { priority: 7, category: business_constraint, check: "payload well-formed: required fields present, enums valid, EQUIPMENT line quantity == 1, conditional fields per visit_type/event_type/incident_type, AccessoryKit.kit_code unique", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 7, category: business_constraint, check: "start_date strictly before expected_offhire_date; telemetry recorded_at <= now", error_id: ERR_INVALID_DATE_RANGE, http_status: 422, applies_to: ["POST /power-rental/rental-contracts", "POST /power-rental/telemetry-events", "POST /power-rental/service-visits"] }
  - { priority: 7, category: business_constraint, check: "load_profile non-empty at size-load", error_id: ERR_LOAD_PROFILE_EMPTY, http_status: 400, applies_to: ["POST /power-rental/rental-contracts/{id}/size-load"] }
  - { priority: 7, category: business_constraint, check: "quote requires sized_kw set, >= 1 line, and sum(equipment line capacity_kw) >= sized_kw", error_id: ERR_UNDERSIZED_FLEET, http_status: 422, applies_to: ["POST /power-rental/rental-contracts/{id}/quote"] }
  - { priority: 7, category: business_constraint, check: "ACCESSORY_KIT line: quantity * kit.max_ampacity_a >= accessory_ampacity_requirement.required_amps (sized_kw must be set)", error_id: ERR_KIT_UNDERSIZED, http_status: 422, applies_to: ["POST /power-rental/rental-contracts/{id}/lines"] }
  - { priority: 7, category: business_constraint, check: "permit resubmit allowed only while review_rounds < 3", error_id: ERR_PERMIT_REVIEW_EXHAUSTED, http_status: 422, applies_to: ["POST /power-rental/permits/{id}/resubmit"] }
  - { priority: 7, category: business_constraint, check: "EMERGENCY visit creation requires customer.standby_contract == true", error_id: ERR_STANDBY_CONTRACT_REQUIRED, http_status: 422, applies_to: ["POST /power-rental/service-visits"] }
  - { priority: 7, category: business_constraint, check: "FUEL_PUMP_OUT value must not exceed current site tank level", error_id: ERR_INSUFFICIENT_TANK_FUEL, http_status: 422, applies_to: ["POST /power-rental/telemetry-events"] }
  - { priority: 8, category: business_referential, check: "telemetry/incident equipment unit must be on an EQUIPMENT line (status PENDING or ON_RENT) of the same contract", error_id: ERR_UNIT_CONTRACT_MISMATCH, http_status: 422, applies_to: ["POST /power-rental/telemetry-events", "POST /power-rental/incidents"] }
  - { priority: 8, category: business_referential, check: "contract close blocked while any incident remains REPORTED", error_id: ERR_OPEN_INCIDENTS, http_status: 422, applies_to: ["POST /power-rental/rental-contracts/{id}/close"] }
  - { priority: 9, category: business_fiscal, check: "customer.credit_status != HOLD for quote, confirm, and line-add", error_id: ERR_CREDIT_HOLD, http_status: 402, applies_to: ["POST /power-rental/rental-contracts/{id}/quote", "POST /power-rental/rental-contracts/{id}/confirm", "POST /power-rental/rental-contracts/{id}/lines"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/power-rental/customers", description: "Onboard a customer", roles: [SalesEngineer], code: 201, input: [name, billing_email, "credit_status?", "standby_contract?", "sla_response_minutes?", "loyalty_discount_pct?"], output: Customer, side_effects: [] }
  - { method: GET, path: "/power-rental/customers/{id}", description: "Read a customer", roles: [SalesEngineer, DepotManager, Customer, FleetDispatcher, ClaimsAssessor], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/power-rental/sites", description: "Register a deployment site", roles: [SalesEngineer], code: 201, input: [customer_id, name, jurisdiction_code, fuel_tank_capacity_liters], output: Site, side_effects: ["tank_level_liters initialized to 0"] }
  - { method: GET, path: "/power-rental/sites/{id}", description: "Read a site incl. computed tank_level_liters", roles: [SalesEngineer, DepotManager, Customer, FleetDispatcher, FieldTechnician], code: 200, input: [], output: Site, side_effects: [] }
  - { method: GET, path: "/power-rental/sites", description: "List sites", roles: [SalesEngineer, DepotManager, Customer], code: 200, input: ["customer_id?", "limit?", "offset?"], output: "Site[]", side_effects: [] }
  - { method: GET, path: "/power-rental/sites/{id}/emissions-screening", description: "Computed read: capacity-weighted NOx aggregate vs jurisdiction cap; permit_required uses >=", roles: [SalesEngineer, DepotManager], code: 200, input: [], output: { aggregate_nox_g_per_kwh: number, jurisdiction_cap_g_per_kwh: number, permit_required: boolean, input_unit_count: integer }, side_effects: [] }
  - { method: POST, path: "/power-rental/equipment-units", description: "Add a generator/chiller to the fleet", roles: [DepotManager], code: 201, input: [unit_type, capacity_kw, fuel_type, emissions_tier, nox_g_per_kwh, day_rate_cents, week_rate_cents, month_rate_cents, demob_fee_cents, home_depot_code], output: EquipmentUnit, side_effects: ["status initialized AVAILABLE"] }
  - { method: GET, path: "/power-rental/equipment-units/{id}", description: "Read a unit", roles: [DepotManager, SalesEngineer, FleetDispatcher, FieldTechnician], code: 200, input: [], output: EquipmentUnit, side_effects: [] }
  - { method: GET, path: "/power-rental/equipment-units", description: "List units with filters", roles: [DepotManager, SalesEngineer, FleetDispatcher], code: 200, input: ["status?", "current_site_id?", "limit?", "offset?"], output: "EquipmentUnit[]", side_effects: [] }
  - { method: POST, path: "/power-rental/equipment-units/{id}/complete-maintenance", description: "MAINTENANCE -> AVAILABLE", roles: [DepotManager], code: 200, input: [], output: EquipmentUnit, side_effects: ["increments EquipmentUnit.version by 1"] }
  - { method: GET, path: "/power-rental/equipment-units/{id}/fuel-projection", description: "Computed read: fuel_burn_projection; method=RATED_CURVE|METERED_AVG (default METERED_AVG, falls back to RATED_CURVE on empty window)", roles: [DepotManager, SalesEngineer, FleetDispatcher, FieldTechnician], code: 200, input: ["method?"], output: { method: string, liters_per_hour: number, projected_liters_per_day: number, next_refuel_eta_hours: number, telemetry_event_count: integer }, side_effects: [] }
  - { method: POST, path: "/power-rental/accessory-kits", description: "Create a cable/distribution kit catalog entry (immutable)", roles: [DepotManager], code: 201, input: [kit_code, description, max_ampacity_a, day_rate_cents, week_rate_cents, month_rate_cents], output: AccessoryKit, side_effects: [] }
  - { method: GET, path: "/power-rental/accessory-kits/{id}", description: "Read a kit", roles: [DepotManager, SalesEngineer], code: 200, input: [], output: AccessoryKit, side_effects: [] }
  - { method: POST, path: "/power-rental/rental-contracts", description: "Create a contract in DRAFT; Customer role may only create for own customer_id", roles: [SalesEngineer, Customer], code: 201, input: [customer_id, site_id, load_profile, start_date, expected_offhire_date], output: RentalContract, side_effects: ["status DRAFT"] }
  - { method: GET, path: "/power-rental/rental-contracts/{id}", description: "Read a contract", roles: [SalesEngineer, Customer, DepotManager, FleetDispatcher, ClaimsAssessor, FieldTechnician], code: 200, input: [], output: RentalContract, side_effects: [] }
  - { method: GET, path: "/power-rental/rental-contracts", description: "List contracts with filters", roles: [SalesEngineer, Customer, DepotManager], code: 200, input: ["customer_id?", "site_id?", "status?", "limit?", "offset?"], output: "RentalContract[]", side_effects: [] }
  - { method: POST, path: "/power-rental/rental-contracts/{id}/size-load", description: "Run load_sizing with the given variant; sets sized_kw and sizing_method", roles: [SalesEngineer], code: 200, input: [sizing_method], output: RentalContract, side_effects: ["recomputes sized_kw; increments RentalContract.version by 1"] }
  - { method: POST, path: "/power-rental/rental-contracts/{id}/quote", description: "DRAFT -> QUOTED; computes quoted_total_cents (PROVISIONAL)", roles: [SalesEngineer], code: 200, input: [], output: RentalContract, side_effects: ["computes quoted_total_cents via rental_charge_accrual PROVISIONAL; quoted_at := now; increments RentalContract.version by 1"] }
  - { method: POST, path: "/power-rental/rental-contracts/{id}/revise", description: "QUOTED -> DRAFT; reopens line editing", roles: [SalesEngineer], code: 200, input: [], output: RentalContract, side_effects: ["clears quoted_at/quoted_total_cents; increments RentalContract.version by 1"] }
  - { method: POST, path: "/power-rental/rental-contracts/{id}/confirm", description: "QUOTED -> CONFIRMED with OCC", roles: [SalesEngineer, Customer], code: 200, input: [expected_rental_contract_version], output: RentalContract, side_effects: ["increments RentalContract.version by 1"] }
  - { method: POST, path: "/power-rental/rental-contracts/{id}/cancel", description: "DRAFT/QUOTED/CONFIRMED -> CANCELLED; releases reserved units", roles: [SalesEngineer, Customer], code: 200, input: [], output: RentalContract, side_effects: ["lines PENDING -> RELEASED; units RESERVED -> AVAILABLE; increments RentalContract.version by 1"] }
  - { method: POST, path: "/power-rental/rental-contracts/{id}/mobilize", description: "CONFIRMED -> MOBILIZING; gated by emissions permit when screening requires one", roles: [DepotManager], code: 200, input: [], output: RentalContract, side_effects: ["increments RentalContract.version by 1"] }
  - { method: POST, path: "/power-rental/rental-contracts/{id}/start-rental", description: "MOBILIZING -> ON_RENT; deploys units and activates lines", roles: [DepotManager], code: 200, input: [], output: RentalContract, side_effects: ["lines PENDING -> ON_RENT; units RESERVED -> DEPLOYED with current_site_id; on_rent_at := now; increments RentalContract.version by 1"] }
  - { method: POST, path: "/power-rental/rental-contracts/{id}/off-hire", description: "ON_RENT -> OFF_HIRE; finalizes remaining ON_RENT lines at actual duration", roles: [SalesEngineer, Customer], code: 200, input: [], output: RentalContract, side_effects: ["actual_offhire_at := now; ON_RENT lines -> OFF_HIRED with final_charge_cents; units DEPLOYED -> OFF_RENT; increments RentalContract.version by 1"] }
  - { method: POST, path: "/power-rental/rental-contracts/{id}/close", description: "OFF_HIRE -> CLOSED; computes invoice_total_cents; charges assessed incidents", roles: [SalesEngineer], code: 200, input: [], output: RentalContract, side_effects: ["invoice_total_cents := invoice_total; incidents ASSESSED -> CHARGED; increments RentalContract.version by 1"] }
  - { method: POST, path: "/power-rental/rental-contracts/{id}/lines", description: "Add an EQUIPMENT or ACCESSORY_KIT line while DRAFT; snapshots rates; reserves unit", roles: [SalesEngineer], code: 201, input: [line_type, "equipment_unit_id?", "accessory_kit_id?", "quantity?", expected_rental_contract_version], output: RentalLine, side_effects: ["rate/demob snapshot; EQUIPMENT: unit AVAILABLE -> RESERVED; increments RentalContract.version by 1"] }
  - { method: GET, path: "/power-rental/rental-lines/{id}", description: "Read a rental line", roles: [SalesEngineer, DepotManager, Customer], code: 200, input: [], output: RentalLine, side_effects: [] }
  - { method: GET, path: "/power-rental/rental-lines", description: "List lines with filters", roles: [SalesEngineer, DepotManager, Customer], code: 200, input: ["contract_id?", "equipment_unit_id?", "accessory_kit_id?", "status?", "limit?", "offset?"], output: "RentalLine[]", side_effects: [] }
  - { method: POST, path: "/power-rental/rental-lines/{id}/off-hire", description: "Partial off-hire: ON_RENT -> OFF_HIRED; finalizes this line only", roles: [SalesEngineer, Customer], code: 200, input: [], output: RentalLine, side_effects: ["final_charge_cents := FINAL accrual to now + demob; offhired_at := now; unit DEPLOYED -> OFF_RENT"] }
  - { method: POST, path: "/power-rental/rental-lines/{id}/return", description: "OFF_HIRED -> RETURNED; unit enters MAINTENANCE", roles: [DepotManager], code: 200, input: [], output: RentalLine, side_effects: ["EQUIPMENT lines: unit OFF_RENT -> MAINTENANCE"] }
  - { method: POST, path: "/power-rental/permits", description: "Create a permit application for a contract (contract must be CONFIRMED or MOBILIZING)", roles: [SalesEngineer], code: 201, input: [contract_id, permit_type], output: Permit, side_effects: ["jurisdiction_code copied from contract site"] }
  - { method: GET, path: "/power-rental/permits/{id}", description: "Read a permit", roles: [SalesEngineer, DepotManager], code: 200, input: [], output: Permit, side_effects: [] }
  - { method: GET, path: "/power-rental/permits", description: "List permits with filters", roles: [SalesEngineer, DepotManager], code: 200, input: ["contract_id?", "status?", "limit?", "offset?"], output: "Permit[]", side_effects: [] }
  - { method: POST, path: "/power-rental/permits/{id}/submit", description: "DRAFT -> SUBMITTED; review_rounds += 1", roles: [SalesEngineer], code: 200, input: [], output: Permit, side_effects: ["submitted_at := now; increments Permit.version by 1"] }
  - { method: POST, path: "/power-rental/permits/{id}/record-decision", description: "SUBMITTED -> APPROVED | REJECTED (regulator decision recorded by sales engineer)", roles: [SalesEngineer], code: 200, input: [outcome], output: Permit, side_effects: ["decided_at := now; increments Permit.version by 1"] }
  - { method: POST, path: "/power-rental/permits/{id}/resubmit", description: "REJECTED -> SUBMITTED while review_rounds < 3", roles: [SalesEngineer], code: 200, input: [], output: Permit, side_effects: ["review_rounds += 1; submitted_at := now; increments Permit.version by 1"] }
  - { method: POST, path: "/power-rental/service-visits", description: "Schedule a technician/fuel visit, or request an EMERGENCY dispatch (Customer, standby contracts only, ON_RENT or SUSPENDED contract)", roles: [FleetDispatcher, Customer], code: 201, input: [visit_type, contract_id, "scheduled_start?", "scheduled_end?", "assigned_technician_id?", "fuel_quantity_liters?"], output: ServiceVisit, side_effects: ["EMERGENCY: requested_at := now"] }
  - { method: GET, path: "/power-rental/service-visits/{id}", description: "Read a visit", roles: [FleetDispatcher, FieldTechnician, DepotManager, SalesEngineer, Customer], code: 200, input: [], output: ServiceVisit, side_effects: [] }
  - { method: GET, path: "/power-rental/service-visits", description: "List visits with filters", roles: [FleetDispatcher, FieldTechnician, DepotManager, SalesEngineer, Customer], code: 200, input: ["contract_id?", "assigned_technician_id?", "status?", "visit_type?", "limit?", "offset?"], output: "ServiceVisit[]", side_effects: [] }
  - { method: POST, path: "/power-rental/service-visits/{id}/dispatch", description: "SCHEDULED -> DISPATCHED; assigns technician; buffered overlap enforced", roles: [FleetDispatcher], code: 200, input: [assigned_technician_id], output: ServiceVisit, side_effects: ["dispatched_at := now; increments ServiceVisit.version by 1"] }
  - { method: POST, path: "/power-rental/service-visits/{id}/arrive", description: "DISPATCHED -> ON_SITE by assigned technician; EMERGENCY: computes response_minutes and sla_met", roles: [FieldTechnician], code: 200, input: [], output: ServiceVisit, side_effects: ["arrived_at := now; EMERGENCY: standby_sla_evaluation; increments ServiceVisit.version by 1"] }
  - { method: POST, path: "/power-rental/service-visits/{id}/complete", description: "ON_SITE -> COMPLETED by assigned technician; FUEL_DELIVERY visits create the FUEL_DELIVERY telemetry event", roles: [FieldTechnician], code: 200, input: [], output: ServiceVisit, side_effects: ["FUEL_DELIVERY: TelemetryEvent created, Site.tank_level_liters += fuel_quantity_liters (capacity check); increments ServiceVisit.version by 1"] }
  - { method: POST, path: "/power-rental/service-visits/{id}/cancel", description: "SCHEDULED -> CANCELLED", roles: [FleetDispatcher], code: 200, input: [], output: ServiceVisit, side_effects: ["increments ServiceVisit.version by 1"] }
  - { method: POST, path: "/power-rental/telemetry-events", description: "Append a runtime/fuel telemetry event (immutable)", roles: [FieldTechnician], code: 201, input: ["equipment_unit_id?", contract_id, event_type, value, "recorded_at?"], output: TelemetryEvent, side_effects: ["RUNTIME: unit.runtime_hours_total += value; FUEL_BURN: unit.fuel_consumed_liters_total += value; FUEL_DELIVERY: site.tank_level_liters += value; FUEL_PUMP_OUT: site.tank_level_liters -= value"] }
  - { method: GET, path: "/power-rental/telemetry-events/{id}", description: "Read a telemetry event", roles: [FieldTechnician, FleetDispatcher, DepotManager, SalesEngineer], code: 200, input: [], output: TelemetryEvent, side_effects: [] }
  - { method: GET, path: "/power-rental/telemetry-events", description: "List telemetry with filters", roles: [FieldTechnician, FleetDispatcher, DepotManager, SalesEngineer], code: 200, input: ["equipment_unit_id?", "contract_id?", "event_type?", "limit?", "offset?"], output: "TelemetryEvent[]", side_effects: [] }
  - { method: POST, path: "/power-rental/incidents", description: "Report damage or spill against a deployed unit of an ON_RENT/OFF_HIRE contract; SPILL quarantines the unit", roles: [Customer, SalesEngineer], code: 201, input: [contract_id, equipment_unit_id, incident_type, "spill_volume_liters?", "notes?"], output: Incident, side_effects: ["SPILL: unit DEPLOYED -> QUARANTINED -> contract ON_RENT -> SUSPENDED -> SCHEDULED visits CANCELLED (3-link cascade)"] }
  - { method: GET, path: "/power-rental/incidents/{id}", description: "Read an incident", roles: [ClaimsAssessor, DepotManager, SalesEngineer, Customer], code: 200, input: [], output: Incident, side_effects: [] }
  - { method: GET, path: "/power-rental/incidents", description: "List incidents with filters", roles: [ClaimsAssessor, DepotManager, SalesEngineer, Customer], code: 200, input: ["contract_id?", "equipment_unit_id?", "status?", "limit?", "offset?"], output: "Incident[]", side_effects: [] }
  - { method: POST, path: "/power-rental/incidents/{id}/assess", description: "REPORTED -> ASSESSED; sets liability charge; SPILL resolves quarantine into maintenance and resumes the contract", roles: [ClaimsAssessor], code: 200, input: [assessed_charge_cents], output: Incident, side_effects: ["assessed_by := X-User-ID; SPILL: unit QUARANTINED -> MAINTENANCE, its line ON_RENT -> OFF_HIRED, contract SUSPENDED -> ON_RENT; increments Incident.version by 1"] }
  - { method: POST, path: "/power-rental/incidents/{id}/waive", description: "ASSESSED -> WAIVED; waiving user must differ from assessed_by", roles: [DepotManager], code: 200, input: [], output: Incident, side_effects: ["increments Incident.version by 1"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving logical clock. Startup default is 2026-08-01T00:00:00Z and the clock never falls back to wall time; each call sets the logical now and runs the quote-expiry sweep (QUOTED contracts past quoted_at + 7 days become EXPIRED with unit-release compensation)", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["quote-expiry sweep: QUOTED -> EXPIRED, lines PENDING -> RELEASED, units RESERVED -> AVAILABLE"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid auth headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted for endpoint" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Customer/FieldTechnician acting on a resource they do not own / are not assigned to" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "waiving user equals incident.assessed_by" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "body FK references a non-existent resource" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "resource not in a valid from-state for the transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "mutation attempted on a terminal-state resource" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_rental_contract_version != current version (OCC)" }
  - { id: ERR_EMISSIONS_TIER_NONCOMPLIANT, http: 422, condition: "TIER_2 unit added for a site whose jurisdiction cap <= 5.0" }
  - { id: ERR_PERMIT_REQUIRED, http: 422, condition: "mobilize while screening requires a permit and none is APPROVED" }
  - { id: ERR_TANK_CAPACITY_EXCEEDED, http: 422, condition: "fuel delivery would raise tank level above capacity" }
  - { id: ERR_UNIT_RESERVED_CONFLICT, http: 409, condition: "equipment reservation window half-open-overlaps an existing PENDING/ON_RENT line window" }
  - { id: ERR_TECHNICIAN_SCHEDULE_CONFLICT, http: 409, condition: "technician buffered (±60 min) window intersects another non-cancelled visit" }
  - { id: ERR_VALIDATION, http: 400, condition: "malformed payload: missing required field, invalid enum, EQUIPMENT line quantity != 1, missing conditional field, duplicate AccessoryKit.kit_code" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "start >= end, or telemetry recorded_at in the future" }
  - { id: ERR_LOAD_PROFILE_EMPTY, http: 400, condition: "size-load with empty load_profile" }
  - { id: ERR_UNDERSIZED_FLEET, http: 422, condition: "quote with no lines, no sized_kw, or equipment capacity below sized_kw" }
  - { id: ERR_KIT_UNDERSIZED, http: 422, condition: "kit quantity * max_ampacity_a below required amps" }
  - { id: ERR_PERMIT_REVIEW_EXHAUSTED, http: 422, condition: "resubmit with review_rounds >= 3" }
  - { id: ERR_STANDBY_CONTRACT_REQUIRED, http: 422, condition: "EMERGENCY visit for customer without standby_contract" }
  - { id: ERR_INSUFFICIENT_TANK_FUEL, http: 422, condition: "FUEL_PUMP_OUT exceeds current tank level" }
  - { id: ERR_UNIT_CONTRACT_MISMATCH, http: 422, condition: "unit not on an active EQUIPMENT line of the referenced contract" }
  - { id: ERR_OPEN_INCIDENTS, http: 422, condition: "close with an incident still REPORTED" }
  - { id: ERR_CREDIT_HOLD, http: 402, condition: "customer credit_status HOLD on quote/confirm/line-add" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Renting organization; owns its contracts, sites, and incident reports"
    identity: "entity_backed:Customer"
    exclusive_operations: ["request EMERGENCY dispatch on own ON_RENT/SUSPENDED contract", "report incidents on own contract"]
    shared_operations: ["create contracts for self", "confirm own quote", "off-hire own contract or its lines", "read own resources"]
  - name: SalesEngineer
    description: "Rental provider sales desk; owns quotes, sizing, permits, invoicing"
    identity: "opaque"
    exclusive_operations: ["onboard customers and sites", "size-load, quote, revise, close contracts", "add rental lines", "permit lifecycle", "record regulator decisions"]
    shared_operations: ["create contracts", "confirm", "cancel", "off-hire", "read resources"]
  - name: DepotManager
    description: "Fleet and depot authority; owns units, kits, mobilization, maintenance, liability waivers"
    identity: "opaque"
    exclusive_operations: ["create equipment units and accessory kits", "mobilize and start rentals", "complete maintenance", "return lines", "waive assessed incidents"]
    shared_operations: ["read resources"]
  - name: FleetDispatcher
    description: "Schedules and dispatches technician and fuel-delivery visits"
    identity: "opaque"
    exclusive_operations: ["create non-emergency service visits", "dispatch visits (assign technician)", "cancel scheduled visits"]
    shared_operations: ["read resources"]
  - name: FieldTechnician
    description: "On-site technician; executes assigned visits and logs telemetry"
    identity: "opaque"
    exclusive_operations: ["arrive at and complete assigned visits", "post telemetry events"]
    shared_operations: ["read resources"]
  - name: ClaimsAssessor
    description: "Independent liability assessor; sets damage/spill charges"
    identity: "opaque"
    exclusive_operations: ["assess incidents"]
    shared_operations: ["read incidents and contracts"]
  - name: PlatformAdmin
    description: "Operator; drives the test-only logical clock"
    identity: "opaque"
    exclusive_operations: ["set logical clock"]
    shared_operations: []
