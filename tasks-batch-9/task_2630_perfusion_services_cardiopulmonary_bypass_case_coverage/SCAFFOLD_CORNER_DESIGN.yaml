      - name: every_entity_get_with_unknown_id_returns_its_own_not_found_code
        claim_type: not_found
        grounds:
          - errors.ERR_CONTRACT_NOT_FOUND
          - errors.ERR_SURGEON_NOT_FOUND
          - errors.ERR_PREFERENCE_CARD_NOT_FOUND
          - errors.ERR_PERFUSIONIST_NOT_FOUND
          - errors.ERR_DEVICE_NOT_FOUND
          - errors.ERR_ROTATION_SLOT_NOT_FOUND
          - errors.ERR_CASE_NOT_FOUND
          - errors.ERR_PACK_NOT_FOUND
          - errors.ERR_CHECKLIST_NOT_FOUND
          - errors.ERR_ECMO_RUN_NOT_FOUND
          - errors.ERR_INCIDENT_NOT_FOUND
          - validations[priority=9]
          - validations[priority=20]
        distinguishing_aspect: |
          §1.6 gives every addressable entity its own 404 code rather than one generic
          ERR_NOT_FOUND, and priorities 9 through 20 order those lookups. This instance sweeps all
          eleven id-addressed reads with the same syntactically valid but unknown id and asserts a
          *distinct* code per resource, which is exactly what a shared 404 helper collapses.
        test_recipe:
            setup:
              - "Empty database. The id '00000000-0000-4000-8000-000000000000' is well formed and belongs to nothing."
            setup_api_calls: []
            trigger:
              - call: "GET /hospital-contracts/00000000-0000-4000-8000-000000000000"
                as: ContractAdmin
                captures: { e_contract: $.data.error_id }
              - call: "GET /surgeons/00000000-0000-4000-8000-000000000000"
                as: ContractAdmin
                captures: { e_surgeon: $.data.error_id }
              - call: "GET /preference-cards/00000000-0000-4000-8000-000000000000"
                as: ContractAdmin
                captures: { e_card: $.data.error_id }
              - call: "GET /perfusionists/00000000-0000-4000-8000-000000000000"
                as: ContractAdmin
                captures: { e_perf: $.data.error_id }
              - call: "GET /perfusion-devices/00000000-0000-4000-8000-000000000000"
                as: BiomedTech
                captures: { e_device: $.data.error_id }
              - call: "GET /call-rotation-slots/00000000-0000-4000-8000-000000000000"
                as: ContractAdmin
                captures: { e_slot: $.data.error_id }
              - call: "GET /bypass-cases/00000000-0000-4000-8000-000000000000"
                as: ContractAdmin
                captures: { e_case: $.data.error_id }
              - call: "GET /disposable-packs/00000000-0000-4000-8000-000000000000"
                as: ContractAdmin
                captures: { e_pack: $.data.error_id }
              - call: "GET /pump-checklists/00000000-0000-4000-8000-000000000000"
                as: ContractAdmin
                captures: { e_checklist: $.data.error_id }
              - call: "GET /ecmo-runs/00000000-0000-4000-8000-000000000000"
                as: ContractAdmin
                captures: { e_ecmo: $.data.error_id }
              - call: "GET /incident-reports/00000000-0000-4000-8000-000000000000"
                as: ContractAdmin
                captures: { e_incident: $.data.error_id }
            assert:
              - "all eleven calls return HTTP 404 with response_type == error"
              - "${e_contract} == ERR_CONTRACT_NOT_FOUND, ${e_surgeon} == ERR_SURGEON_NOT_FOUND, ${e_card} == ERR_PREFERENCE_CARD_NOT_FOUND, ${e_perf} == ERR_PERFUSIONIST_NOT_FOUND"
              - "${e_device} == ERR_DEVICE_NOT_FOUND, ${e_slot} == ERR_ROTATION_SLOT_NOT_FOUND, ${e_case} == ERR_CASE_NOT_FOUND, ${e_pack} == ERR_PACK_NOT_FOUND"
              - "${e_checklist} == ERR_CHECKLIST_NOT_FOUND, ${e_ecmo} == ERR_ECMO_RUN_NOT_FOUND, ${e_incident} == ERR_INCIDENT_NOT_FOUND"
              - "the eleven error_id values are pairwise distinct - no shared generic 404"

      - name: device_event_log_is_append_only_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.DeviceEventLog
          - entities.DeviceEventLog.fields.recorded_by_user_id
          - endpoints[POST /perfusion-devices/{id}/event-logs]
          - endpoints[GET /perfusion-devices/{id}/event-logs]
        distinguishing_aspect: |
          DeviceEventLog is the scaffold's only `common_fields: false` entity: it has id and
          created_at but no updated_at and no version, no PUT and no DELETE, and its
          recorded_by_user_id is stamped from X-User-ID rather than accepted as input. The claim is
          that history accumulates - two appends of the same event_code both persist, in order, and
          the counter effects add up rather than replace - which an implementation that models the
          log as a mutable "latest event" row cannot satisfy.
        test_recipe:
          setup:
            - "Contract c1 and one AVAILABLE heart-lung machine d1 with the default 500-hour service interval."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-001", device_class: "HEART_LUNG_MACHINE" }
              as: BiomedTech
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /perfusion-devices/${d1}/event-logs"
              payload: { event_code: "RUNTIME_TICK", runtime_hours_delta: 6.5, detail: "first shift" }
              as: BiomedTech
              captures: { log1: $.data.id }
            - call: "POST /perfusion-devices/${d1}/event-logs"
              payload: { event_code: "RUNTIME_TICK", runtime_hours_delta: 3.5, detail: "second shift" }
              as: BiomedTech
              captures: { log2: $.data.id }
            - call: "POST /perfusion-devices/${d1}/event-logs"
              payload: { event_code: "ALARM_ADVISORY", detail: "gas line advisory" }
              as: BiomedTech
              captures: { log3: $.data.id }
            - call: "GET /perfusion-devices/${d1}/event-logs"
              as: BiomedTech
          assert:
            - "each append returns HTTP 201 with an id and created_at but with NO version and NO updated_at key in the DeviceEventLog body"
            - "${log1}, ${log2} and ${log3} are three distinct rows; the list read returns total_count == 3 and contains all three - the second RUNTIME_TICK did not overwrite the first"
            - "each row's recorded_by_user_id equals the X-User-ID that appended it, and runtime_hours_delta defaults to 0 on the ALARM_ADVISORY row that omitted it"
            - "PerfusionDevice.${d1}.runtime_hours_since_service == 10.0 - the two deltas accumulated, they were not replaced"
            - "PerfusionDevice.${d1}.alarm_count_since_service == 1 (only the advisory counts) and status is still AVAILABLE - ALARM_ADVISORY does not force NEEDS_SERVICE"
            - "no PUT or DELETE route exists for /device-event-logs/{id} in §1.4"

      - name: child_creation_under_unknown_parent_returns_parent_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=12]
          - validations[priority=16]
          - validations[priority=10]
          - validations[priority=13]
          - errors.ERR_CE_ACTIVITY_NOT_FOUND
          - entities.Certification.fields.perfusionist_id
          - entities.PumpChecklist.fields.case_id
        distinguishing_aspect: |
          Four parent entities are addressed through a nested URL or an FK body field, and each
          resolves its own 404 before any domain rule: a certification under an unknown
          perfusionist, a checklist under an unknown case, a preference card under an unknown
          surgeon and a verification against an unknown CE activity. The paired positive half
          asserts nested scoping - p1's CE activity must not appear under p2's collection - which is
          the failure mode of an implementation that ignores the path id when listing children.
        test_recipe:
          setup:
            - "Contract c1, surgeon s1, perfusionists p1 and p2, a current CCP certification for p1, and one CE activity for p1."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Rafe Mbeki", employee_code: "EMP-1001", career_case_count: 150 }
              as: ContractAdmin
              captures: { p1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Ada Nwosu", employee_code: "EMP-1003", career_case_count: 90 }
              as: ContractAdmin
              captures: { p2: $.data.id }
            - call: "POST /perfusionists/${p1}/certifications"
              payload: { cert_code: "CCP", issued_on: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z", cycle_credit_requirement: 45 }
              as: ContractAdmin
              captures: { cert1: $.data.id }
            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "CLINICAL", credit_hours: 20, activity_date: "2026-03-01T00:00:00Z", accreditation_body: "ABCP" }
              as: ContractAdmin
              captures: { ce1: $.data.id }
          trigger:
            - call: "POST /perfusionists/00000000-0000-4000-8000-000000000000/certifications"
              payload: { cert_code: "CCP", issued_on: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z", cycle_credit_requirement: 45 }
              as: ContractAdmin
              captures: { e_perf: $.data.error_id }
            - call: "POST /bypass-cases/00000000-0000-4000-8000-000000000000/pump-checklists"
              payload: { check_results: [ { check_code: "ACT_BASELINE", passed: true, note: "ok" } ], blood_management_protocol: "STANDARD", hematocrit_pct: 26 }
              as: Perfusionist
              as_user_id: "${p1}"
              captures: { e_case: $.data.error_id }
            - call: "POST /preference-cards"
              payload: { surgeon_id: "00000000-0000-4000-8000-000000000000", procedure_type: "CABG", standard_pump_minutes: 150, prime_volume_ml: 1500, pack_line_items: [ { line_code: "A_OXYGENATOR", quantity: 1, unit_cost_cents: 1055 } ], required_safety_check_codes: ["ACT_BASELINE"], blood_management_protocol: "STANDARD", min_hematocrit_pct: 22 }
              as: ChiefPerfusionist
              as_user_id: "${p1}"
              captures: { e_surgeon: $.data.error_id }
            - call: "POST /ce-activities/00000000-0000-4000-8000-000000000000/verification"
              payload: { decision: "VERIFIED" }
              as: ContractAdmin
              captures: { e_ce: $.data.error_id }
            - call: "GET /perfusionists/${p2}/ce-activities"
              as: ContractAdmin
            - call: "GET /perfusionists/${p1}/ce-activities"
              as: ContractAdmin
          assert:
            - "${e_perf} == ERR_PERFUSIONIST_NOT_FOUND with HTTP 404, not ERR_INVALID_TIME_WINDOW and not a 201 with a dangling FK"
            - "${e_case} == ERR_CASE_NOT_FOUND with HTTP 404, ahead of the priority-28 state check that would otherwise apply"
            - "${e_surgeon} == ERR_SURGEON_NOT_FOUND with HTTP 404 (the ChiefPerfusionist actor is authorised for card creation, so priority 10 is the first failing check)"
            - "${e_ce} == ERR_CE_ACTIVITY_NOT_FOUND with HTTP 404, ahead of the priority-39 CE state check"
            - "GET /perfusionists/${p2}/ce-activities returns total_count == 0 while GET /perfusionists/${p1}/ce-activities returns total_count == 1 containing ${ce1} - children are scoped to the path parent"
            - "Perfusionist.${p2}.ce_credits_pending == 0 while Perfusionist.${p1}.ce_credits_pending == 20"

      - name: device_backup_graph_edge_is_validated_and_reverse_reachable
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=55]
          - errors.ERR_INVALID_BACKUP_DEVICE
          - entities.PerfusionDevice.fields.backup_device_id
          - endpoints[GET /perfusion-devices]
          - endpoints[GET /bypass-cases]
        distinguishing_aspect: |
          entity_topology is `graph` because PerfusionDevice carries a self-referential
          backup_device_id and BypassCase points at two devices at once. This instance pins the edge
          rules - a backup must be a *different* row, same device_class, same contract - and then
          proves both edges are reverse-reachable through the declared list filters
          (?backup_device_id= on devices, ?primary_device_id= and ?backup_device_id= on cases), which
          is the only way a test can traverse the graph backwards.
        test_recipe:
          setup:
            - "Two contracts c1 and c2; under c1 machines d1 and d2 plus one CENTRIFUGAL_PUMP dx; under c2 machine d9."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "Brackenridge Heart Institute", staffing_model: "PER_CASE", per_case_fee_cents: 380000, ecmo_hourly_fee_cents: 85000, monthly_case_cap: 4 }
              as: ContractAdmin
              captures: { c2: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-002", device_class: "HEART_LUNG_MACHINE" }
              as: BiomedTech
              captures: { d2: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "CFP-001", device_class: "CENTRIFUGAL_PUMP" }
              as: BiomedTech
              captures: { dx: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c2}", asset_tag: "HLM-009", device_class: "HEART_LUNG_MACHINE" }
              as: BiomedTech
              captures: { d9: $.data.id }
          trigger:
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-001", device_class: "HEART_LUNG_MACHINE", backup_device_id: "${d2}" }
              as: BiomedTech
              captures: { d1: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-003", device_class: "HEART_LUNG_MACHINE", backup_device_id: "${d9}" }
              as: BiomedTech
              captures: { e_cross_contract: $.data.error_id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-004", device_class: "HEART_LUNG_MACHINE", backup_device_id: "${dx}" }
              as: BiomedTech
              captures: { e_wrong_class: $.data.error_id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-005", device_class: "HEART_LUNG_MACHINE", backup_device_id: "00000000-0000-4000-8000-000000000000" }
              as: BiomedTech
              captures: { e_unknown: $.data.error_id }
            - call: "GET /perfusion-devices"
              payload: { backup_device_id: "${d2}" }
              as: BiomedTech
            - call: "GET /perfusion-devices"
              payload: { contract_id: "${c1}", device_class: "HEART_LUNG_MACHINE", status: "AVAILABLE" }
              as: BiomedTech
          assert:
            - "the first creation returns HTTP 201 with PerfusionDevice.${d1}.backup_device_id == ${d2}"
            - "${e_cross_contract} == ERR_INVALID_BACKUP_DEVICE with HTTP 422 - a backup at another hospital is not a usable fallback"
            - "${e_wrong_class} == ERR_INVALID_BACKUP_DEVICE with HTTP 422 - a CENTRIFUGAL_PUMP cannot back a HEART_LUNG_MACHINE"
            - "${e_unknown} == ERR_DEVICE_NOT_FOUND with HTTP 404, not ERR_INVALID_BACKUP_DEVICE - priority 14 resolves the referenced row before priority 55 judges the edge"
            - "GET /perfusion-devices?backup_device_id=${d2} returns total_count == 1 holding exactly ${d1} - the self-referential edge is reverse-reachable"
            - "GET /perfusion-devices?contract_id=${c1}&device_class=HEART_LUNG_MACHINE&status=AVAILABLE returns total_count == 2 holding ${d1} and ${d2}, excluding the CENTRIFUGAL_PUMP and the c2 machine"
            - "only ${d1} and ${d2} exist as heart-lung machines under ${c1}: HLM-003, HLM-004 and HLM-005 were never persisted"

  - section: state_machines
