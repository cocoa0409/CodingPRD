        distinguishing_aspect: "Registering for an OPEN event after the clock passes its starts_at returns ERR_EVENT_ALREADY_STARTED (422)."
        test_recipe:
          setup: ["OPEN event starts_at 2026-05-08T10:00Z; clock advanced to 2026-05-08T11:00Z."]
          setup_api_calls:
            - call: "POST /api/customers"
