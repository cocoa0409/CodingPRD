              payload: {}
              as: QualityManager
            - call: "POST /toll-operations/customers/${c12}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 100, tolling_per_kg_cents: 1, formulated_price_per_kg_cents: 0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: QualityManager
              captures: { pa12: $.data.id, pa12_v: $.data.version }
            - call: "POST /toll-operations/customers/${c12}/pricing-agreements/${pa12}/activate"
              payload: { expected_pricing_agreement_version: "${pa12_v}" }
              as: QualityManager
            - call: "POST /toll-operations/tanks"
              payload: { tank_code: "TK-1201", capacity_l: 500, working_capacity_l: 500, current_zone: "Z_FLAM" }
              as: QualityManager
              captures: { t12: $.data.id }
            - call: "POST /toll-operations/tanks/${t12}/cleaning-records"
