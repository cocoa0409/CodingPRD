              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 1, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 1 }
              as: Coordinator
