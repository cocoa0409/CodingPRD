              as_user_id: "${b2_id}"
              captures: { below_floor_status: $.data.status }
          assert:
            - "first offer (8000, at floor) status == PROPOSED"
            - "second offer (7999, below floor) status == REJECTED"
            - "Listing.${lst_id}.open_offer_count == 1 (only the at-floor offer entered the open set)"

      - name: empty_offer_pool_listing_has_zero_open_offers
        grounds:
          - entities.Listing.fields.open_offer_count
          - endpoints
          - calculations.compute_open_offer_count
        distinguishing_aspect: |
          Empty-collection boundary on a DIFFERENT metric/endpoint (GET /listings/{id}/offers):
          a freshly published listing with no offers returns an empty Offer[] and
          open_offer_count == 0 — the zero-count edge, reached via the listing-offers endpoint.
        test_recipe:
          setup:
            - "Published listing with no offers yet."
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
