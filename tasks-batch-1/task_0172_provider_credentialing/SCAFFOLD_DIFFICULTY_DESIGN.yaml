# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Provider Credentialing & Enrollment — Expert
# 9 Difficulty Rules x 2 instances = 18 instances.
# All chains drive empty-DB -> precondition using only §1.5 endpoints.
# Numeric asserts are literals precomputed from §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: recred_due_rolling_variant_on_provider
        grounds:
          - calculations.recredentialing_due_date
          - state_machines.Provider.NOT_CLEARED_to_CURRENT
          - entities.Provider.fields.recred_due_date
        distinguishing_aspect: |
          Dual-variant lives on the Provider domain: ROLLING_FROM_COMPLETION sets recred_due_date =
          this clearing's completion + 1095 days, whereas ANNIVERSARY_FROM_FIRST_CLEARING would anchor to
          the original completion; this instance pins the ROLLING result on a first clearing.
        test_recipe:
          setup:
            - "Org (recred_cycle_days=1095). Clock set to 2026-03-01. One provider with a STATE_LICENSE verified, file approved by 3 YES votes -> provider CLEARED at 2026-03-01."
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { ci_id: $.data.id }
            - call: "POST /providers/${p_id}/submit-application"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/begin-verification"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /credential-items/${ci_id}/verification-requests"
              payload: { method: "PRIMARY_SOURCE", source_reference: "https://lic.example/LIC-1" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { vr_id: $.data.id }
            - call: "POST /verification-requests/${vr_id}/complete"
              payload: { outcome: "PASS" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/finalize-verification"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /peer-reviewers"
              payload: { org_id: "${org_id}", user_id: "md-1", full_name: "Chair MD" }
              as: SystemAdmin
              captures: { rv_chair: $.data.id }
            - call: "POST /peer-reviewers"
              payload: { org_id: "${org_id}", user_id: "rev-2", full_name: "Rev 2" }
              as: SystemAdmin
              captures: { rv2: $.data.id }
            - call: "POST /peer-reviewers"
              payload: { org_id: "${org_id}", user_id: "rev-3", full_name: "Rev 3" }
              as: SystemAdmin
              captures: { rv3: $.data.id }
            - call: "POST /providers/${p_id}/credentialing-files"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { file_id: $.data.id }
            - call: "POST /credentialing-files/${file_id}/open-review"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /credentialing-files/${file_id}/cast-vote"
              payload: { reviewer_id: "${rv2}", ballot: "YES" }
              as: PeerReviewer
              as_user_id: "rev-2"
            - call: "POST /credentialing-files/${file_id}/cast-vote"
              payload: { reviewer_id: "${rv3}", ballot: "YES" }
              as: PeerReviewer
              as_user_id: "rev-3"
            - call: "POST /credentialing-files/${file_id}/cast-vote"
              payload: { reviewer_id: "${rv_chair}", ballot: "YES" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "GET /credentialing-files/${file_id}"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { file_v: $.data.version }
          trigger:
            - call: "POST /credentialing-files/${file_id}/finalize"
              payload: { decision: "APPROVE", expected_credentialing_file_version: "${file_v}" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "GET /providers/${p_id}"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { cred_status: $.data.credentialing_status, due: $.data.recred_due_date }
          assert:
            - "Provider.${p_id}.credentialing_status == 'CLEARED'"
            - "Provider.${p_id}.credentialing_completed_date == '2026-03-01T00:00:00.000Z'"
            - "Provider.${p_id}.recred_due_date == '2029-02-28T00:00:00.000Z'"

      - name: enrollment_effective_retroactive_vs_prospective_on_payerenrollment
        grounds:
          - calculations.enrollment_effective_date
          - state_machines.PayerEnrollment.SUBMITTED_to_ACTIVE
          - entities.PayerEnrollment.fields.effective_date
          - entities.Payer.fields.retroactive_allowed
        distinguishing_aspect: |
          Dual-variant lives on the PayerEnrollment domain (a DIFFERENT entity domain than recred due-date):
          for an identical activation, RETROACTIVE (Payer.retroactive_allowed=true) backdates effective_date to
          the provider's credentialing_completed_date (2026-03-01), while PROSPECTIVE (false) sets it to the
          current clock (2026-06-01) — two different effective_dates from the same inputs.
        test_recipe:
          setup:
            - "Provider CLEARED at completion 2026-03-01 (same clearing chain). Clock then advanced to 2026-06-01. Two payers: one retroactive_allowed=true, one false. One enrollment submitted+activated against each."
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { ci_id: $.data.id }
            - call: "POST /providers/${p_id}/submit-application"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/begin-verification"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /credential-items/${ci_id}/verification-requests"
              payload: { method: "PRIMARY_SOURCE", source_reference: "https://lic.example/LIC-1" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { vr_id: $.data.id }
            - call: "POST /verification-requests/${vr_id}/complete"
              payload: { outcome: "PASS" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/finalize-verification"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /peer-reviewers"
              payload: { org_id: "${org_id}", user_id: "md-1", full_name: "Chair MD" }
              as: SystemAdmin
              captures: { rv_chair: $.data.id }
            - call: "POST /peer-reviewers"
              payload: { org_id: "${org_id}", user_id: "rev-2", full_name: "Rev 2" }
              as: SystemAdmin
              captures: { rv2: $.data.id }
            - call: "POST /peer-reviewers"
              payload: { org_id: "${org_id}", user_id: "rev-3", full_name: "Rev 3" }
              as: SystemAdmin
              captures: { rv3: $.data.id }
            - call: "POST /providers/${p_id}/credentialing-files"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { file_id: $.data.id }
            - call: "POST /credentialing-files/${file_id}/open-review"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /credentialing-files/${file_id}/cast-vote"
              payload: { reviewer_id: "${rv2}", ballot: "YES" }
              as: PeerReviewer
              as_user_id: "rev-2"
            - call: "POST /credentialing-files/${file_id}/cast-vote"
              payload: { reviewer_id: "${rv3}", ballot: "YES" }
              as: PeerReviewer
              as_user_id: "rev-3"
            - call: "POST /credentialing-files/${file_id}/cast-vote"
              payload: { reviewer_id: "${rv_chair}", ballot: "YES" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "GET /credentialing-files/${file_id}"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { file_v: $.data.version }
            - call: "POST /credentialing-files/${file_id}/finalize"
              payload: { decision: "APPROVE", expected_credentialing_file_version: "${file_v}" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /payers"
              payload: { org_id: "${org_id}", name: "Retro Plan", payer_type: "COMMERCIAL", retroactive_allowed: true, panel_capacity: 5 }
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
              captures: { payer_retro: $.data.id }
            - call: "POST /payers"
              payload: { org_id: "${org_id}", name: "Prosp Plan", payer_type: "COMMERCIAL", retroactive_allowed: false, panel_capacity: 5 }
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
              captures: { payer_prosp: $.data.id }
            - call: "POST /providers/${p_id}/payer-enrollments"
              payload: { payer_id: "${payer_retro}" }
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
              captures: { en_retro: $.data.id }
            - call: "POST /payer-enrollments/${en_retro}/submit"
              payload: {}
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
            - call: "POST /providers/${p_id}/payer-enrollments"
              payload: { payer_id: "${payer_prosp}" }
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
              captures: { en_prosp: $.data.id }
            - call: "POST /payer-enrollments/${en_prosp}/submit"
              payload: {}
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
          trigger:
            - call: "POST /payer-enrollments/${en_retro}/activate"
              payload: {}
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
              captures: { eff_retro: $.data.effective_date }
            - call: "POST /payer-enrollments/${en_prosp}/activate"
              payload: {}
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
              captures: { eff_prosp: $.data.effective_date }
          assert:
            - "PayerEnrollment.${en_retro}.effective_date == '2026-03-01T00:00:00.000Z'"
            - "PayerEnrollment.${en_prosp}.effective_date == '2026-06-01T00:00:00.000Z'"
            - "PayerEnrollment.${en_retro}.effective_date != PayerEnrollment.${en_prosp}.effective_date"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: readiness_score_nonlinear_mode_a
        grounds:
          - calculations.credentialing_readiness_score
          - entities.Provider.fields.readiness_score
          - entities.Provider.fields.sanction_score
        distinguishing_aspect: |
          Mode (a): >=3 inputs (psv_ratio, sanction_penalty, recred_penalty) with non-linear interaction —
          nested min/max (sanction_penalty=min(40, score*5); final max(0,...)) and conditional branch
          (recred_penalty 15 iff RECRED_DUE). With 2/3 items VERIFIED+VALID, sanction_score 0, not due:
          base=round(100*2/3,2)=66.67, no penalties, clamp inactive -> 66.67.
        test_recipe:
          setup:
            - "Provider with three STATE/DEA/BOARD items; two VERIFIED+VALID, one REJECTED. sanction_score 0, recred_state not RECRED_DUE. finalize-verification recomputes readiness_score."
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { ci1: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "DEA_REGISTRATION", identifier: "DEA-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { ci2: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "BOARD_CERTIFICATION", identifier: "BRD-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { ci3: $.data.id }
            - call: "POST /providers/${p_id}/submit-application"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/begin-verification"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /credential-items/${ci1}/verification-requests"
              payload: { method: "PRIMARY_SOURCE", source_reference: "https://lic.example/1" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { vr1: $.data.id }
            - call: "POST /verification-requests/${vr1}/complete"
              payload: { outcome: "PASS" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /credential-items/${ci2}/verification-requests"
              payload: { method: "PRIMARY_SOURCE", source_reference: "https://dea.example/1" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { vr2: $.data.id }
            - call: "POST /verification-requests/${vr2}/complete"
              payload: { outcome: "PASS" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /credential-items/${ci3}/verification-requests"
              payload: { method: "PRIMARY_SOURCE", source_reference: "https://brd.example/1" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { vr3: $.data.id }
            - call: "POST /verification-requests/${vr3}/complete"
              payload: { outcome: "FAIL" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "POST /providers/${p_id}/finalize-verification"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { score: $.data.readiness_score, cred_status: $.data.credentialing_status }
          assert:
            - "Provider.${p_id}.readiness_score == 66.67"
            - "Provider.${p_id}.credentialing_status == 'CONDITIONAL'"

      - name: peer_review_tally_eval_order_mode_c
        grounds:
          - calculations.peer_review_tally
          - state_machines.CredentialingFile.UNDER_REVIEW_to_APPROVED
          - entities.CredentialingFile.fields.tally_yes
          - entities.CredentialingFile.fields.chair_user_id
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the chair's effective weight depends on the tally and the
          tally depends on the chair. Evaluation order is pinned (base over non-chair votes first, then chair
          double-on-tie). Non-chair votes 1 YES + 1 NO (tie 1-1) -> chair YES counts double -> tally_yes=3,
          tally_no=1, outcome YES.
        test_recipe:
          setup:
            - "File UNDER_REVIEW with 3 reviewers all weight 1; rev-2 votes YES, rev-3 votes NO (base tie 1-1), chair md-1 votes YES."
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { ci_id: $.data.id }
            - call: "POST /providers/${p_id}/submit-application"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/begin-verification"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /credential-items/${ci_id}/verification-requests"
              payload: { method: "PRIMARY_SOURCE", source_reference: "https://lic.example/1" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { vr_id: $.data.id }
            - call: "POST /verification-requests/${vr_id}/complete"
              payload: { outcome: "PASS" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/finalize-verification"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /peer-reviewers"
              payload: { org_id: "${org_id}", user_id: "md-1", full_name: "Chair MD" }
              as: SystemAdmin
              captures: { rv_chair: $.data.id }
            - call: "POST /peer-reviewers"
              payload: { org_id: "${org_id}", user_id: "rev-2", full_name: "Rev 2" }
              as: SystemAdmin
              captures: { rv2: $.data.id }
            - call: "POST /peer-reviewers"
              payload: { org_id: "${org_id}", user_id: "rev-3", full_name: "Rev 3" }
              as: SystemAdmin
              captures: { rv3: $.data.id }
            - call: "POST /providers/${p_id}/credentialing-files"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { file_id: $.data.id }
            - call: "POST /credentialing-files/${file_id}/open-review"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /credentialing-files/${file_id}/cast-vote"
              payload: { reviewer_id: "${rv2}", ballot: "YES" }
              as: PeerReviewer
              as_user_id: "rev-2"
            - call: "POST /credentialing-files/${file_id}/cast-vote"
              payload: { reviewer_id: "${rv3}", ballot: "NO" }
              as: PeerReviewer
              as_user_id: "rev-3"
          trigger:
            - call: "POST /credentialing-files/${file_id}/cast-vote"
              payload: { reviewer_id: "${rv_chair}", ballot: "YES" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "GET /credentialing-files/${file_id}"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { ty: $.data.tally_yes, tn: $.data.tally_no }
          assert:
            - "CredentialingFile.${file_id}.tally_yes == 3"
            - "CredentialingFile.${file_id}.tally_no == 1"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: provider_recred_cyclic_loop
        grounds:
          - state_machines.Provider.CURRENT_to_RECRED_DUE
          - state_machines.Provider.RECRED_DUE_to_IN_RECREDENTIALING
          - entities.Provider.fields.recred_state
        distinguishing_aspect: |
          Cyclic shape on the Provider entity: CURRENT -> RECRED_DUE (clock crosses due date) ->
          IN_RECREDENTIALING (start-recredentialing) is a loop back toward CURRENT, not a linear pipeline.
          This instance drives a CLEARED provider past its recred_due_date and starts re-credentialing.
        test_recipe:
          setup:
            - "Provider CLEARED at 2026-03-01 (recred_due 2029-02-28, recred_state CURRENT). Advance clock to 2029-03-01 (past due)."
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2035-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { ci_id: $.data.id }
            - call: "POST /providers/${p_id}/submit-application"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/begin-verification"
              payload: {}
