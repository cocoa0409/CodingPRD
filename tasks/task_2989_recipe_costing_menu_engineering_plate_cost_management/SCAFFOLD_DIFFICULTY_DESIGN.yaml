              captures: { r4_error: $.data.error_id }
          assert:
            - "${plate_cents} == 100 and ${prop_round0} == 0"
            - "${s1_status} == SUBMITTED with ${s1_round} == 0 and ${s1_eff} == 448 — no relief, because projected_food_cost_bps 2381 is below the 3000 target"
            - "${r1_status} == REVISION_REQUESTED and ${r1_round} == 1 — the loop edge"
            - "${s2_status} == SUBMITTED and ${s2_round} == 1 — re-entering SUBMITTED does not reset the counter"
            - "${r2_status} == REVISION_REQUESTED and ${r2_round} == 2 — the counter now sits exactly at MAX_REVISION_ROUNDS"
            - "${s3_status} == SUBMITTED and ${s3_round} == 2"
            - "${r3_status} == REJECTED with ${r3_round} == 2 (unchanged) and ${r3_reason} == \"out of patience\" — the third identical trigger takes the terminal branch instead of the loop branch"
            - "${r4_error} == ERR_PROPOSAL_INVALID_STATE with HTTP 409 — the round gate at priority 39 does not raise a fiscal error of its own; once the proposal is REJECTED the status gate at priority 21 is what rejects the fourth call"
            - "MenuItem.${mi_id}.current_price_cents == 400 — a rejected proposal never touches the price"

      - name: spec_change_order_approval_and_propagation_dimensions_advance_independently
