# =============================================================================
# §1.8 Scaffold Difficulty Design — Cotton Gin & Classing Operations
# 2 instances per Difficulty Rule (§0.5), 18 instances total.
# All numeric asserts were computed by executing the §1.3 formulas as code.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: seed_yield_estimated_vs_reconciled
        grounds:
          - calculations.shift_mass_balance_allocation
          - calculations.estimated_turnout
          - state_machines.GinShift.CLOSED_to_RECONCILED
        distinguishing_aspect: |
          Physical-yield domain (ModuleReceipt/GinShift): the estimated variant
          (standard turnout table, est_seed_lbs) and the reconciled variant
          (scale mass-balance allocation, reconciled_seed_lbs) produce different
          seed lbs for identical module data whenever scale total != estimated total.
        test_recipe:
          setup:
            - "Grower G1 with two modules M1 (net 20000, moisture 9.0, fm 3.0) and M2 (net 20000, moisture 12.0, fm 6.0) ginned in shift S1"
            - "M1 bales: fourteen 500-lb + one 480-lb = 7480 lint; M2 bales: fourteen 500-lb + one 400-lb = 7400 lint"
            - "S1 closed with actual_lint 14880, actual_seed 25000, waste 120 (40000 = 14880+25000+120)"
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-100", legal_name: "Delta Farms One" }
              as: CoopAdmin
              captures: { g1: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-A" }
              as: GinOperator
              captures: { s1: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g1}", season: "2026", ticket_number: "T-1", module_tag: "MT-1", gross_weight_lbs: 22000, tare_weight_lbs: 2000, moisture_pct: 9.0, foreign_matter_pct: 3.0 }
              as: GinOperator
              captures: { m1: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g1}", season: "2026", ticket_number: "T-2", module_tag: "MT-2", gross_weight_lbs: 21000, tare_weight_lbs: 1000, moisture_pct: 12.0, foreign_matter_pct: 6.0 }
              as: GinOperator
              captures: { m2: $.data.id }
            - call: "POST /gin-ops/modules/${m1}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-01", net_weight_lbs: 500}, {bale_tag: "B-02", net_weight_lbs: 500}, {bale_tag: "B-03", net_weight_lbs: 500}, {bale_tag: "B-04", net_weight_lbs: 500}, {bale_tag: "B-05", net_weight_lbs: 500}, {bale_tag: "B-06", net_weight_lbs: 500}, {bale_tag: "B-07", net_weight_lbs: 500}, {bale_tag: "B-08", net_weight_lbs: 500}, {bale_tag: "B-09", net_weight_lbs: 500}, {bale_tag: "B-10", net_weight_lbs: 500}, {bale_tag: "B-11", net_weight_lbs: 500}, {bale_tag: "B-12", net_weight_lbs: 500}, {bale_tag: "B-13", net_weight_lbs: 500}, {bale_tag: "B-14", net_weight_lbs: 500}, {bale_tag: "B-15", net_weight_lbs: 480} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "POST /gin-ops/modules/${m2}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m2}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m2}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-16", net_weight_lbs: 500}, {bale_tag: "B-17", net_weight_lbs: 500}, {bale_tag: "B-18", net_weight_lbs: 500}, {bale_tag: "B-19", net_weight_lbs: 500}, {bale_tag: "B-20", net_weight_lbs: 500}, {bale_tag: "B-21", net_weight_lbs: 500}, {bale_tag: "B-22", net_weight_lbs: 500}, {bale_tag: "B-23", net_weight_lbs: 500}, {bale_tag: "B-24", net_weight_lbs: 500}, {bale_tag: "B-25", net_weight_lbs: 500}, {bale_tag: "B-26", net_weight_lbs: 500}, {bale_tag: "B-27", net_weight_lbs: 500}, {bale_tag: "B-28", net_weight_lbs: 500}, {bale_tag: "B-29", net_weight_lbs: 500}, {bale_tag: "B-30", net_weight_lbs: 400} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "POST /gin-ops/gin-shifts/${s1}/close"
              payload: { actual_lint_scale_lbs: 14880, actual_seed_scale_lbs: 25000, waste_lbs: 120 }
              as: GinOperator
          trigger:
            - call: "POST /gin-ops/gin-shifts/${s1}/reconcile"
              as: GinOperator
            - call: "GET /gin-ops/modules/${m1}"
              as: GinOperator
            - call: "GET /gin-ops/modules/${m2}"
              as: GinOperator
          assert:
            - "before reconcile, ModuleReceipt.${m1}.est_seed_lbs == 11000 (estimated variant) and reconciled_seed_lbs is null"
            - "after reconcile, ModuleReceipt.${m1}.reconciled_seed_lbs == 12500 and ModuleReceipt.${m2}.reconciled_seed_lbs == 12500"
            - "12500 != 11000: reconciled variant diverges from estimated variant for identical module data"
            - "SUM(reconciled_seed_lbs) == 25000 == GinShift.actual_seed_scale_lbs (allocation conserves the scale total)"
            - "GinShift.${s1}.status == RECONCILED"

      - name: settlement_provisional_vs_final
        grounds:
          - calculations.settlement_net
          - state_machines.Settlement.DRAFT_to_FINAL
          - entities.Settlement.fields.computation_variant
        distinguishing_aspect: |
          Financial domain (Grower/Settlement): the PROVISIONAL variant prices an
          unsold shift's seed at est_seed_lbs x 25c while the FINAL variant uses
          posted SEED_CREDIT entries only — two algorithms over the same grower
          ledger produce different net_payable_cents.
        test_recipe:
          setup:
            - "Grade schedules: 31-3 (+265 pts, loan 5450) covering 2026-01-01..2027-01-01; 41-4 (-110 pts, loan 5200) covering 2026-01-01..2026-07-01"
            - "Grower G1 (rate 0.20) with module MS (net 20000, moisture 9.0, fm 3.0) ginned in shift SS, bales 500 + 520 lbs (lint 1020, ginning charge -11730)"
          setup_api_calls:
            - call: "POST /gin-ops/grade-schedules"
              payload: { grade_code: "31-3", premium_discount_points: 265, loan_rate_points: 5450, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /gin-ops/grade-schedules"
              payload: { grade_code: "41-4", premium_discount_points: -110, loan_rate_points: 5200, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-200", legal_name: "Delta Farms Two" }
              as: CoopAdmin
              captures: { g1: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-B" }
              as: GinOperator
              captures: { s1: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g1}", season: "2026", ticket_number: "T-1", module_tag: "MT-1", gross_weight_lbs: 22000, tare_weight_lbs: 2000, moisture_pct: 9.0, foreign_matter_pct: 3.0 }
              as: GinOperator
              captures: { m1: $.data.id }
            - call: "POST /gin-ops/modules/${m1}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-01", net_weight_lbs: 500}, {bale_tag: "B-02", net_weight_lbs: 520} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "GET /gin-ops/growers/${g1}"
              as: CoopAccountant
              captures: { g1v: $.data.version }
            - call: "POST /gin-ops/growers/${g1}/settlements"
              payload: { season: "2026", expected_grower_version: "${g1v}" }
              as: CoopAccountant
              captures: { st1: $.data.id }
          trigger:
            - call: "POST /gin-ops/gin-shifts/${s1}/close"
              payload: { actual_lint_scale_lbs: 1020, actual_seed_scale_lbs: 18500, waste_lbs: 480 }
              as: GinOperator
            - call: "POST /gin-ops/gin-shifts/${s1}/reconcile"
              as: GinOperator
            - call: "POST /gin-ops/seed-sales"
              payload: { gin_shift_id: "${s1}", buyer_name: "Delta Oil Mill", price_cents_per_lb: 28 }
              as: CoopAccountant
            - call: "GET /gin-ops/modules/${m1}/bales"
              as: ClassingClerk
              captures: { b1: "$.data[0].id", b1v: "$.data[0].version", b2: "$.data[1].id", b2v: "$.data[1].version" }
            - call: "POST /gin-ops/bales/${b1}/classing-results"
              payload: { grade_code: "31-3", micronaire: 4.0, strength_gpt: 29.0, staple_32nds: 36, classing_office: "USDA-MEMPHIS", result_date: "2026-03-10T00:00:00Z", expected_bale_version: "${b1v}" }
              as: ClassingClerk
            - call: "POST /gin-ops/bales/${b2}/classing-results"
              payload: { grade_code: "41-4", micronaire: 4.5, strength_gpt: 27.0, staple_32nds: 35, classing_office: "USDA-MEMPHIS", result_date: "2026-03-10T00:00:00Z", expected_bale_version: "${b2v}" }
              as: ClassingClerk
            - call: "GET /gin-ops/growers/${g1}"
              as: CoopAccountant
              captures: { g1v2: $.data.version }
            - call: "POST /gin-ops/growers/${g1}/settlements"
              payload: { season: "2026", expected_grower_version: "${g1v2}" }
              as: CoopAccountant
              captures: { st2: $.data.id }
            - call: "POST /gin-ops/settlements/${st2}/finalize"
              as: CoopAccountant
            - call: "POST /gin-ops/settlements/${st2}/pay"
              payload: { amount_cents: 568269 }
              as: CoopAccountant
          assert:
            - "Settlement.${st1} (PROVISIONAL): seed_credit_cents == 275000 (11000 est_seed x 25c) while SUM(SEED_CREDIT entries) == 0 at creation — the estimate exists only in the PROVISIONAL algorithm"
            - "Settlement.${st1}.net_payable_cents == 326816 (lint 61200 + quality 0 + seed 275000 - ginning 11730 + patronage 2346)"
            - "Settlement.${st2} supersedes ${st1}: ${st1}.status == SUPERSEDED; ${st2}.seed_credit_cents == 515500 (posted entry 18500 x 28 - 2500), quality_adjustment_cents == 953 (1525 - 572)"
            - "Settlement.${st2}.net_payable_cents == 568269 at creation and stays 568269 after finalize (computation_variant == FINAL)"
            - "326816 != 568269: provisional and final algorithms diverge over the same grower deliveries"
            - "after pay: ${st2}.status == PAID, paid_amount_cents == 568269; Grower.${g1}.credit_balance_cents == -62153"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: ginning_charge_tier_straddle_and_rounding_order
        grounds:
          - calculations.ginning_charge
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Mode (b) nested rounding: each module's charge is rounded half-up to
          whole cents BEFORE summing (a module of bales 301+301 lbs charges 6923c,
          while per-bale rounding would give 6924c), AND the marginal tier split
          at 100000 cumulative season lbs makes the per-module charge depend on
          ginning order.
        test_recipe:
          setup:
            - "Grower GT with module A (bales 30001 + 30000 lbs) ginned first, then module B (bales 35000 + 35000 lbs) ginned second, same season 2026"
            - "Grower GC with module C (bales 301 + 301 lbs) ginned in its own season scope"
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-300", legal_name: "Tier Farm" }
              as: CoopAdmin
              captures: { gt: $.data.id }
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-301", legal_name: "Round Farm" }
              as: CoopAdmin
              captures: { gc: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-C" }
              as: GinOperator
              captures: { s1: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gt}", season: "2026", ticket_number: "T-1", module_tag: "MT-A", gross_weight_lbs: 62001, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { ma: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gt}", season: "2026", ticket_number: "T-2", module_tag: "MT-B", gross_weight_lbs: 71000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { mb: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gc}", season: "2026", ticket_number: "T-1", module_tag: "MT-C", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { mc: $.data.id }
            - call: "POST /gin-ops/modules/${ma}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${ma}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${ma}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-A1", net_weight_lbs: 30001}, {bale_tag: "B-A2", net_weight_lbs: 30000} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "POST /gin-ops/modules/${mb}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${mb}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${mb}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-B1", net_weight_lbs: 35000}, {bale_tag: "B-B2", net_weight_lbs: 35000} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "POST /gin-ops/modules/${mc}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${mc}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${mc}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-C1", net_weight_lbs: 301}, {bale_tag: "B-C2", net_weight_lbs: 301} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
          trigger:
            - call: "GET /gin-ops/ledger-entries"
              payload: { grower_id: "${gt}" }
              as: CoopAccountant
            - call: "GET /gin-ops/ledger-entries"
              payload: { grower_id: "${gc}" }
              as: CoopAccountant
          assert:
            - "Grower ${gt} GINNING_CHARGE entries: -690012 (module A: 60001 lbs all tier 1; raw 690011.5 rounds half-up per module) and -744998 (module B straddles: 39999 lbs x 11.5c + 30001 lbs x 9.5c = 744998)"
            - "Grower ${gt}.credit_balance_cents == -1435010"
            - "Grower ${gc} GINNING_CHARGE == -6923 (602 lbs x 11.5 rounded once per module); per-bale rounding would have produced -6924 — the pinned rounding order decides the cent"
            - "order sensitivity: had B ginned first, B would charge -805000 and A -630010 (cumulative_before is chronological by ginned_at)"

      - name: settlement_patronage_evaluation_order
        grounds:
          - calculations.settlement_net
          - entities.Grower.fields.patronage_rate
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: patronage is computed from
          ABS(ginning_charge_cents) BEFORE net is assembled, and net (which
          includes patronage) never feeds back — patronage_cents == 1385 pins
          step (5) to ginning charges only, not to any running total.
        test_recipe:
          setup:
            - "Grower GP (patronage_rate 0.20) with one module (net 10000, moisture 8.0, fm 4.0), bales 301 + 301 lbs, ginned in season 2026"
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-302", legal_name: "Patronage Farm", patronage_rate: 0.20 }
              as: CoopAdmin
              captures: { gp: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-D" }
              as: GinOperator
              captures: { s1: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gp}", season: "2026", ticket_number: "T-1", module_tag: "MT-P", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { mp: $.data.id }
            - call: "POST /gin-ops/modules/${mp}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${mp}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${mp}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-P1", net_weight_lbs: 301}, {bale_tag: "B-P2", net_weight_lbs: 301} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "GET /gin-ops/growers/${gp}"
              as: CoopAccountant
              captures: { gpv: $.data.version }
          trigger:
            - call: "POST /gin-ops/growers/${gp}/settlements"
              payload: { season: "2026", expected_grower_version: "${gpv}" }
              as: CoopAccountant
              captures: { st: $.data.id }
          assert:
            - "Settlement.${st}.ginning_charge_cents == -6923"
            - "Settlement.${st}.patronage_cents == 1385 == round_half_up(0.20 x 6923); a formula feeding the running net back into the patronage base would produce a different number"
            - "Settlement.${st}.lint_value_cents == 36120 and seed_credit_cents == 137500 (est_seed 5500 x 25c, shift unsold)"
            - "Settlement.${st}.net_payable_cents == 168082 (36120 + 0 + 137500 - 6923 + 1385)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: bale_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.Bale
          - entities.Bale.fields.classing_status
          - entities.Bale.fields.custody_status
        distinguishing_aspect: |
          Bale carries two parallel state dimensions: classing (UNCLASSED ->
          CLASSED, with a CLASSED -> CLASSED reclass self-loop) evolves while
          custody stays ON_GIN_FLOOR, and custody later moves to WAREHOUSED
          without disturbing classing — neither dimension is a prefix of the other.
        test_recipe:
          setup:
            - "Grade schedules 41-4 (-110 pts, window ..2026-07-01) and 31-3 (+265 pts, window 2026-01-01..2027-01-01)"
            - "Grower GB with one module, one bale of 480 lbs; warehouse W capacity 10"
          setup_api_calls:
            - call: "POST /gin-ops/grade-schedules"
              payload: { grade_code: "41-4", premium_discount_points: -110, loan_rate_points: 5200, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /gin-ops/grade-schedules"
              payload: { grade_code: "31-3", premium_discount_points: 265, loan_rate_points: 5450, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-400", legal_name: "Parallel Farm" }
              as: CoopAdmin
              captures: { gb: $.data.id }
            - call: "POST /gin-ops/warehouses"
              payload: { name: "WH-1", capacity_bales: 10, dock_count: 1 }
              as: CoopAdmin
              captures: { wh: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-E" }
              as: GinOperator
              captures: { s1: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gb}", season: "2026", ticket_number: "T-1", module_tag: "MT-B", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m1: $.data.id }
            - call: "POST /gin-ops/modules/${m1}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-01", net_weight_lbs: 480} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "GET /gin-ops/modules/${m1}/bales"
              as: ClassingClerk
              captures: { b1: "$.data[0].id", b1v: "$.data[0].version" }
          trigger:
            - call: "POST /gin-ops/bales/${b1}/classing-results"
              payload: { grade_code: "41-4", micronaire: 4.5, strength_gpt: 30.0, staple_32nds: 35, classing_office: "USDA-MEMPHIS", result_date: "2026-03-10T00:00:00Z", expected_bale_version: "${b1v}" }
              as: ClassingClerk
            - call: "POST /gin-ops/warehouse-receipts"
              payload: { bale_id: "${b1}", warehouse_id: "${wh}" }
              as: WarehouseManager
              as_user_id: "wm-1"
            - call: "GET /gin-ops/bales/${b1}"
              as: ClassingClerk
              captures: { b1v3: $.data.version }
            - call: "POST /gin-ops/bales/${b1}/classing-results"
              payload: { grade_code: "31-3", micronaire: 3.9, strength_gpt: 27.0, staple_32nds: 36, classing_office: "USDA-MEMPHIS", result_date: "2026-03-15T00:00:00Z", expected_bale_version: "${b1v3}" }
              as: ClassingClerk
            - call: "GET /gin-ops/bales/${b1}"
              as: ClassingClerk
          assert:
            - "after first classing: classing_status == CLASSED while custody_status == ON_GIN_FLOOR (dimensions move independently), quality_points == -95, adjustment_cents == -456"
            - "after receipt issue: custody_status == WAREHOUSED while classing_status stays CLASSED"
            - "after reclass self-loop: classing_status == CLASSED, custody_status == WAREHOUSED, quality_points == 290, adjustment_cents == 1392, active_grade_code == 31-3"
            - "Bale.version advanced on every mutation: 1 -> 2 (class) -> 3 (receipt) -> 4 (reclass)"

      - name: receipt_pledge_release_repledge_cycle
        grounds:
          - state_machines.WarehouseReceipt
          - calculations.loan_principal_and_interest
        distinguishing_aspect: |
          WarehouseReceipt is cyclic: ACTIVE -> PLEDGED -> RELEASED -> PLEDGED
          again (a redemption does not terminate the receipt); the cycle re-pins
          loan_rate_points from the schedule covering each new pledge date.
        test_recipe:
          setup:
            - "Grade schedule 31-3 (+265 pts, loan 5450) covering all of 2026"
            - "Grower GL with one classed 500-lb bale, receipted at warehouse W (capacity 5); logical clock at the 2026-08-01T00:00:00Z default"
          setup_api_calls:
