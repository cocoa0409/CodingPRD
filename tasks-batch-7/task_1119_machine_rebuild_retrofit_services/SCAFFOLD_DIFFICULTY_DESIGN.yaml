  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: downtime_window_overlap_half_open_adjacency
        grounds:
          - calculations.downtime_window_overlap
          - entities.DowntimeWindow.fields.ends_at
        distinguishing_aspect: |
          Resource = DowntimeWindow with HALF-OPEN [starts_at, ends_at) semantics:
          [2026-06-15, 2026-07-15) collides with [2026-06-01, 2026-07-01), but
          adjacency [2026-07-01, 2026-08-01) is allowed, and a zero-length window
          (ends_at == starts_at) is rejected as ERR_WINDOW_EMPTY.
        test_recipe:
          setup:
            - "Customer exists; window W1 [2026-06-01, 2026-07-01) booked OPEN"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/downtime-windows", payload: { customer_id: "${cust}", starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-07-01T00:00:00Z" }, as: LogisticsCoordinator, captures: { w1: $.data.id, w1_status: $.data.status } }
          trigger:
            - { call: "POST /api/downtime-windows", payload: { customer_id: "${cust}", starts_at: "2026-06-15T00:00:00Z", ends_at: "2026-07-15T00:00:00Z" }, as: LogisticsCoordinator, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /api/downtime-windows", payload: { customer_id: "${cust}", starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-08-01T00:00:00Z" }, as: LogisticsCoordinator, captures: { w3: $.data.id, w3_status: $.data.status } }
            - { call: "POST /api/downtime-windows", payload: { customer_id: "${cust}", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z" }, as: LogisticsCoordinator, captures: { err_empty: $.data.error_id } }
          assert:
            - "W1 ${w1} created OPEN"
            - "overlapping [2026-06-15, 2026-07-15) rejected with ERR_WINDOW_OVERLAP (s < e2 AND s2 < e)"
            - "adjacent [2026-07-01, 2026-08-01) created OPEN (starts_at == prior ends_at is allowed under half-open semantics)"
            - "zero-length [2026-09-01, 2026-09-01) rejected with ERR_WINDOW_EMPTY"

      - name: shipment_stage_gap_buffer_semantics
        grounds:
          - calculations.shipment_stage_tiling
          - entities.ShipmentStage.fields.planned_return_date
        distinguishing_aspect: |
          Resource = ShipmentStage with DIFFERENT interval semantics from
          downtime windows: CLOSED bounds (return == window ends_at allowed) plus
          a mandatory 2-day buffer between sibling stages — a 1-day gap is
          rejected (ERR_STAGE_GAP_TOO_SMALL) while exactly 2 days is accepted;
          adjacency is NOT sufficient here unlike the half-open window rule.
        test_recipe:
          setup:
            - "DECIDED project (stage creation is allowed from DECIDED) and a window [2026-06-01, 2026-07-01)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-118", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
