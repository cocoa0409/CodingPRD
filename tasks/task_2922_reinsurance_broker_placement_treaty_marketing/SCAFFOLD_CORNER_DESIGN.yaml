              captures: { layer_final: $.data.status, layer_total_final: $.data.written_line_total_pct }
          assert:
            - "${alpha_status0} == APPROVED on create — the action endpoint is the only way the value ever moves"
            - "${restricted_status} == RESTRICTED, ${restricted_lead_flag} == true and ${restricted_committed} == 0 — the downgrade does not clear the authorisation flag and touches no capacity"
            - "${e_lead} == ERR_LEAD_NOT_AUTHORISED with HTTP 422 — priority 38 requires lead_authorised == true AND security_status == APPROVED, so a RESTRICTED market with the flag still set cannot lead"
            - "the follower quote is created with ${q_a_lead} == false and ${sl_a_status} == PROVISIONAL — a RESTRICTED market may follow and may be firm-ordered, because the firm-order precondition admits {APPROVED, RESTRICTED}"
