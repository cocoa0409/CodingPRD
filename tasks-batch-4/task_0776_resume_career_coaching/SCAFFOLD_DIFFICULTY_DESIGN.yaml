scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_pricing_provisional_vs_final
        grounds:
          - calculations.order_price_quote
          - entities.Order.fields.provisional_total_cents
          - entities.Order.fields.final_total_cents
          - state_machines.Order.READY_to_DELIVERED
        distinguishing_aspect: |
          Dual variant on the Order pricing domain: provisional (intake) excludes the
          EXTRA_REVISION overage add-on incurred during production while final (delivery)
          includes it, so final_total_cents (54000) != provisional_total_cents (50000)
          for identical order inputs.
        test_recipe:
          setup:
            - "PRO plan: base 50000, included_deliverables [RESUME], included_revision_rounds 2, no coaching, SATISFACTION guarantee."
            - "Order created (no rush, no coupon, no intake add-ons); confirmed; RESUME deliverable driven through 3 revision rounds (3rd is a billable overage → EXTRA_REVISION 4000) then approved; order READY."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "PRO", base_price_cents: 50000, included_deliverables: ["RESUME"], included_revision_rounds: 2, included_coaching_sessions: 0, includes_interview_prep: false, includes_ats: true, guarantee_type: "SATISFACTION", rush_surcharge_pct: 0.30 }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Ada Client", email: "ada@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /coaches"
              payload: { name: "Cody Coach", email: "cody@x.com", specialty: "GENERAL" }
              as: CareerAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "Product Manager", target_industry: "Tech", requested_delivery_days: 10 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id, prov: $.data.provisional_total_cents }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}/deliverables"
              payload: {}
              as: CareerAdmin
              captures: { deliv_id: "$.data[0].id" }
            - call: "POST /deliverables/${deliv_id}/drafts"
              payload: { notes: "v1" }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /deliverables/${deliv_id}/revisions"
              payload: { reason: "tighten summary" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deliverables/${deliv_id}/drafts"
              payload: { notes: "v2" }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /deliverables/${deliv_id}/revisions"
              payload: { reason: "reorder experience" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deliverables/${deliv_id}/drafts"
              payload: { notes: "v3" }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /deliverables/${deliv_id}/revisions"
              payload: { reason: "one more pass" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deliverables/${deliv_id}/drafts"
              payload: { notes: "v4" }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /deliverables/${deliv_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /orders/${order_id}/deliver"
              payload: {}
              as: CareerAdmin
              captures: { final: $.data.final_total_cents }
          assert:
            - "Order.${order_id}.provisional_total_cents == 50000"
            - "Order.${order_id}.final_total_cents == 54000"
            - "Order.${order_id}.final_total_cents != Order.${order_id}.provisional_total_cents"

      - name: ats_strict_vs_semantic_score
        grounds:
          - calculations.ats_keyword_score
          - entities.AtsScan.fields.strict_score
          - entities.AtsScan.fields.semantic_score
        distinguishing_aspect: |
          Dual variant on the Deliverable ATS-scoring domain: the same résumé sections
          produce strict_score 64 (exact keyword matches) vs semantic_score 85
          (synonym-inclusive), a different entity domain from the Order pricing variant.
        test_recipe:
          setup:
            - "Plan with ATS included, RESUME deliverable on a confirmed order; the deliverable has an uploaded draft."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "PRO", base_price_cents: 30000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, includes_ats: true, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Ben Client", email: "ben@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /coaches"
              payload: { name: "Cara Coach", email: "cara@x.com", specialty: "TECH" }
              as: CareerAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "Engineer", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}/deliverables"
              payload: {}
              as: CareerAdmin
              captures: { deliv_id: "$.data[0].id" }
            - call: "POST /deliverables/${deliv_id}/drafts"
              payload: { notes: "v1" }
              as: Coach
              as_user_id: "${coach_id}"
          trigger:
            - call: "POST /deliverables/${deliv_id}/ats-scans"
              payload: { sections: [ { name: "SUMMARY", weight: 1, keywords_total: 4, matched_strict: 3, matched_semantic: 4 }, { name: "EXPERIENCE", weight: 3, keywords_total: 10, matched_strict: 6, matched_semantic: 8 } ] }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { strict: $.data.strict_score, semantic: $.data.semantic_score }
          assert:
            - "AtsScan.strict_score == 64"
            - "AtsScan.semantic_score == 85"
            - "AtsScan.semantic_score != AtsScan.strict_score"

  # ==========================================================================
  # Rule 2 — combinatorial formulas across different modes {(a),(b),(c)}
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_quote_nonlinear_tiered_rush_coupon
        grounds:
          - calculations.order_price_quote
          - entities.Order.fields.addons_subtotal_cents
          - entities.Order.fields.discount_cents
          - entities.Order.fields.rush_surcharge_cents
          - entities.Order.fields.provisional_total_cents
        distinguishing_aspect: |
          Mode (a): >=3 interacting inputs with non-linear branches — a tiered add-on
          volume discount (10% only when addon_count >= 3) nests with a base-only coupon
          and a rush surcharge applied AFTER discounts, giving provisional_total_cents 135720.
        test_recipe:
          setup:
            - "EXECUTIVE plan base 80000, rush_surcharge_pct 0.30. Order is rush, coupon WELCOME10, with three intake add-ons (EXTRA_COACHING 12000 + EXTRA_DELIVERABLE 9000 + INTERVIEW_PREP 15000 = 36000)."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "EXECUTIVE", base_price_cents: 80000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, guarantee_type: "NONE", rush_surcharge_pct: 0.30 }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Cleo Client", email: "cleo@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "VP Eng", target_industry: "Finance", requested_delivery_days: 5, rush: true, coupon_code: "WELCOME10", addon_types: ["EXTRA_COACHING", "EXTRA_DELIVERABLE", "INTERVIEW_PREP"] }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.addons_subtotal_cents == 36000"
            - "Order.${order_id}.discount_cents == 11600"
            - "Order.${order_id}.rush_surcharge_cents == 31320"
            - "Order.${order_id}.provisional_total_cents == 135720"

      - name: ats_rounding_order_per_section_first
        grounds:
          - calculations.ats_keyword_score
          - entities.AtsScan.fields.strict_score
          - entities.AtsScan.fields.coverage_by_section
        distinguishing_aspect: |
          Mode (b): pinned nested-rounding order — rounding each section's coverage to an
          integer BEFORE the weighted average yields strict_score 26; an aggregate-then-round
          implementation yields 25 on the same inputs.
        test_recipe:
          setup:
            - "Confirmed order with an ATS-included plan and one drafted RESUME deliverable."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "PRO", base_price_cents: 30000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, includes_ats: true, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Dee Client", email: "dee@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /coaches"
              payload: { name: "Del Coach", email: "del@x.com", specialty: "GENERAL" }
              as: CareerAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "Analyst", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}/deliverables"
              payload: {}
              as: CareerAdmin
              captures: { deliv_id: "$.data[0].id" }
            - call: "POST /deliverables/${deliv_id}/drafts"
              payload: { notes: "v1" }
              as: Coach
              as_user_id: "${coach_id}"
          trigger:
            - call: "POST /deliverables/${deliv_id}/ats-scans"
              payload: { sections: [ { name: "S1", weight: 1, keywords_total: 8, matched_strict: 1, matched_semantic: 1 }, { name: "S2", weight: 1, keywords_total: 8, matched_strict: 3, matched_semantic: 3 } ] }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { strict: $.data.strict_score }
          assert:
            - "AtsScan.strict_score == 26"
            - "AtsScan.coverage_by_section.S1 == 13"
            - "AtsScan.coverage_by_section.S2 == 38"

  # ==========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: deliverable_revision_cycle
        grounds:
          - state_machines.Deliverable.DRAFTED_to_IN_REVISION
          - state_machines.Deliverable.IN_REVISION_to_DRAFTED
          - entities.Deliverable.fields.revision_round_count
        distinguishing_aspect: |
          Cyclic shape on Deliverable: DRAFTED -> IN_REVISION (client revision) -> DRAFTED
          (coach re-draft) returns the same entity to a prior state — a genuine loop, not a
          forward-only pipeline.
        test_recipe:
          setup:
            - "Confirmed order, one drafted RESUME deliverable (status DRAFTED)."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "PRO", base_price_cents: 30000, included_deliverables: ["RESUME"], included_revision_rounds: 2, included_coaching_sessions: 0, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Eve Client", email: "eve@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /coaches"
              payload: { name: "Eli Coach", email: "eli@x.com", specialty: "GENERAL" }
              as: CareerAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}/deliverables"
              payload: {}
              as: CareerAdmin
              captures: { deliv_id: "$.data[0].id" }
            - call: "POST /deliverables/${deliv_id}/drafts"
              payload: { notes: "v1" }
              as: Coach
              as_user_id: "${coach_id}"
          trigger:
            - call: "POST /deliverables/${deliv_id}/revisions"
              payload: { reason: "revise" }
              as: Client
              as_user_id: "${client_id}"
              captures: { rev_id: $.data.id }
            - call: "POST /deliverables/${deliv_id}/drafts"
              payload: { notes: "v2" }
              as: Coach
              as_user_id: "${coach_id}"
          assert:
            - "immediately after the revision, Deliverable.${deliv_id}.status == IN_REVISION"
            - "after the coach re-draft, Deliverable.${deliv_id}.status == DRAFTED"
            - "Deliverable.${deliv_id}.revision_round_count == 1"
            - "Deliverable.${deliv_id}.draft_count == 2"
            - "RevisionRequest.${rev_id}.status == ADDRESSED"

      - name: session_branching_cancel_vs_no_show
        grounds:
          - state_machines.CoachingSession.SCHEDULED_to_CANCELLED
          - state_machines.CoachingSession.SCHEDULED_to_NO_SHOW
          - entities.Order.fields.amount_refunded_cents
        distinguishing_aspect: |
          Branching fork on CoachingSession: SCHEDULED forks to CANCELLED vs NO_SHOW with
          divergent side-effect sets — cancel issues a REFUND and restores the credit, no-show
          issues neither — a different entity from the Deliverable revision cycle.
        test_recipe:
          setup:
            - "Confirmed order, plan with zero included sessions; two billable COACHING sessions (12000 each) booked on the same coach at non-overlapping, buffer-respecting slots."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "BASIC", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Fay Client", email: "fay@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /coaches"
              payload: { name: "Fox Coach", email: "fox@x.com", specialty: "GENERAL", buffer_minutes: 15 }
              as: CareerAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CareerAdmin
              captures: { v0: $.data.version }
            - call: "POST /orders/${order_id}/sessions"
              payload: { coach_id: "${coach_id}", session_type: "COACHING", scheduled_start: "2026-04-01T10:00:00Z", scheduled_end: "2026-04-01T11:00:00Z", expected_order_version: "${v0}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { sess_a: $.data.id }
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CareerAdmin
              captures: { v1: $.data.version }
            - call: "POST /orders/${order_id}/sessions"
              payload: { coach_id: "${coach_id}", session_type: "COACHING", scheduled_start: "2026-04-01T12:00:00Z", scheduled_end: "2026-04-01T13:00:00Z", expected_order_version: "${v1}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { sess_b: $.data.id }
          trigger:
            - call: "POST /sessions/${sess_a}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /sessions/${sess_b}/no-show"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
          assert:
            - "CoachingSession.${sess_a}.status == CANCELLED"
            - "CoachingSession.${sess_b}.status == NO_SHOW"
            - "Order.${order_id}.amount_charged_cents == 44000"
            - "Order.${order_id}.amount_refunded_cents == 12000"
            - "Order.${order_id}.net_collected_cents == 32000"

  # ==========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: revision_overage_cascade_depth3
        grounds:
          - state_machines.Deliverable.DRAFTED_to_IN_REVISION
          - calculations.revision_billing
          - state_machines.AddOn.PENDING_to_CHARGED
          - entities.Order.fields.amount_charged_cents
        distinguishing_aspect: |
          Depth-3 transitive chain from POST /deliverables/{id}/revisions:
          RevisionRequest opened -> Deliverable enters a billable IN_REVISION overage ->
          that triggers an EXTRA_REVISION AddOn (CHARGED) -> which posts a CHARGE Payment and
          advances Order.amount_charged_cents; each hop caused by the previous.
        test_recipe:
          setup:
            - "Plan with included_revision_rounds 0 (so the first revision is a billable overage). Confirmed order (base 20000 charged), one drafted RESUME deliverable."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "BASIC", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 0, included_coaching_sessions: 0, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Gus Client", email: "gus@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /coaches"
              payload: { name: "Gia Coach", email: "gia@x.com", specialty: "GENERAL" }
              as: CareerAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}/deliverables"
              payload: {}
              as: CareerAdmin
              captures: { deliv_id: "$.data[0].id" }
            - call: "POST /deliverables/${deliv_id}/drafts"
              payload: { notes: "v1" }
              as: Coach
              as_user_id: "${coach_id}"
          trigger:
            - call: "POST /deliverables/${deliv_id}/revisions"
              payload: { reason: "overage revision" }
              as: Client
              as_user_id: "${client_id}"
              captures: { rev_id: $.data.id, rev_billable: $.data.billable }
          assert:
            - "RevisionRequest.${rev_id}.billable == true"
            - "Deliverable.${deliv_id}.status == IN_REVISION"
            - "an AddOn on Order.${order_id} exists with type == EXTRA_REVISION, price_cents == 4000, auto_generated == true, source_ref == ${rev_id}"
            - "Order.${order_id}.amount_charged_cents == 24000"
            - "a Payment on Order.${order_id} exists with type == CHARGE, amount_cents == 4000, reason == REVISION_OVERAGE"

      - name: guarantee_refund_cascade_depth2
        grounds:
          - state_machines.GuaranteeClaim.SUBMITTED_to_APPROVED
          - state_machines.Order.DELIVERED_to_REFUNDED
          - state_machines.CoachingSession.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-2 transitive chain from POST /guarantee-claims/{id}/approve:
          claim APPROVED -> parent Order transitions to REFUNDED (refund Payment posted) ->
          the Order entering REFUNDED cascades to CANCELLED on its SCHEDULED sessions; a
          different triggering transition from the revision cascade.
        test_recipe:
          setup:
            - "SATISFACTION plan with 1 included coaching session, RESUME deliverable. Order confirmed (charge 30000), deliverable drafted, one included (free) COACHING session booked for a future slot, deliverable approved (order READY), delivered (DELIVERED at clock default 2026-03-01), SATISFACTION claim submitted."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "PRO", base_price_cents: 30000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 1, guarantee_type: "SATISFACTION" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Hal Client", email: "hal@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /coaches"
              payload: { name: "Ham Coach", email: "ham@x.com", specialty: "GENERAL" }
              as: CareerAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}/deliverables"
              payload: {}
              as: CareerAdmin
              captures: { deliv_id: "$.data[0].id" }
            - call: "POST /deliverables/${deliv_id}/drafts"
              payload: { notes: "v1" }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CareerAdmin
              captures: { v0: $.data.version }
            - call: "POST /orders/${order_id}/sessions"
              payload: { coach_id: "${coach_id}", session_type: "COACHING", scheduled_start: "2026-05-01T10:00:00Z", scheduled_end: "2026-05-01T11:00:00Z", expected_order_version: "${v0}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /deliverables/${deliv_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /orders/${order_id}/deliver"
              payload: {}
              as: CareerAdmin
            - call: "POST /orders/${order_id}/guarantee-claims"
              payload: { claim_type: "SATISFACTION", evidence: "not satisfied with results" }
              as: Client
              as_user_id: "${client_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /guarantee-claims/${claim_id}/approve"
              payload: {}
              as: CareerAdmin
          assert:
            - "GuaranteeClaim.${claim_id}.status == APPROVED"
            - "GuaranteeClaim.${claim_id}.refund_amount_cents == 30000"
            - "Order.${order_id}.status == REFUNDED"
            - "Order.${order_id}.amount_refunded_cents == 30000"
            - "CoachingSession.${sess_id}.status == CANCELLED"

  # ==========================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_booking
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_ORDER_NOT_IN_PRODUCTION]
          - errors[ERR_COACH_SLOT_CONFLICT]
        distinguishing_aspect: |
          Same POST /orders/{id}/sessions request violates a state precondition (order in
          INTAKE, priority 6) and a coach temporal overlap (priority 8); the state error
          ERR_ORDER_NOT_IN_PRODUCTION wins over ERR_COACH_SLOT_CONFLICT. Pair (state, business_temporal).
        test_recipe:
          setup:
            - "Client c1 with a confirmed order O2 that holds a SCHEDULED coaching session on coach C at 10:00-11:00, and a second order O1 for the SAME client left in INTAKE (unconfirmed)."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "PRO", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 1, guarantee_type: "NONE" }
