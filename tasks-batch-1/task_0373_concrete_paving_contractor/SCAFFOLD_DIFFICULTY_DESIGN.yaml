  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_plain_half_open_overlap
        grounds:
          - validations[priority=11]
          - entities.CrewAssignment.fields.window_start
          - entities.CrewAssignment.fields.window_end
        distinguishing_aspect: |
          Crew overlap uses plain half-open [start,end) semantics: an existing BOOKED crew window [10:00,14:00) collides
          with a new [13:00,15:00) (ERR_CREW_DOUBLE_BOOKED), but an exactly-adjacent [14:00,16:00) does NOT collide.
          Resource: Crew, no buffer.
        test_recipe:
          setup:
            - "A crew with one BOOKED assignment [2026-07-01T10:00:00Z, 2026-07-01T14:00:00Z) on some project."
          setup_api_calls:
            - call: "POST /crews"
              payload: { crew_name: "C6", skill: "FLATWORK", headcount: 4 }
              as: ProjectManager
              captures: { crew_id: $.data.id }
            - call: "POST /projects"
              payload: { site_name: "Crew P1", client_name: "Omi" }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /projects/${p1}/crew-assignments"
              payload: { crew_id: "${crew_id}", window_start: "2026-07-01T10:00:00Z", window_end: "2026-07-01T14:00:00Z" }
              as: ProjectManager
            - call: "POST /projects"
              payload: { site_name: "Crew P2", client_name: "Omi" }
              as: Estimator
              captures: { p2: $.data.id }
          trigger:
            - call: "POST /projects/${p2}/crew-assignments"
              payload: { crew_id: "${crew_id}", window_start: "2026-07-01T13:00:00Z", window_end: "2026-07-01T15:00:00Z" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_CREW_DOUBLE_BOOKED"

      - name: equipment_buffered_interval_overlap
        grounds:
          - validations[priority=12]
          - entities.CrewAssignment.fields.equipment_id
        distinguishing_aspect: |
          Equipment overlap uses BUFFERED interval semantics (2h cleandown each side): an existing BOOKED equipment window
          [10:00,12:00) is treated as occupying [08:00,14:00), so a new [13:00,15:00) collides (ERR_EQUIPMENT_DOUBLE_BOOKED)
          even though the raw windows do not overlap — distinct interval arithmetic from the un-buffered crew rule, on the
          Equipment resource.
        test_recipe:
          setup:
            - "An equipment asset with one BOOKED assignment [2026-07-01T10:00:00Z, 2026-07-01T12:00:00Z) (raw, un-buffered) on some project, booked together with a crew."
          setup_api_calls:
            - call: "POST /crews"
              payload: { crew_name: "C7", skill: "PAVING", headcount: 4 }
              as: ProjectManager
              captures: { crew_a: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "C8", skill: "PAVING", headcount: 4 }
              as: ProjectManager
              captures: { crew_b: $.data.id }
            - call: "POST /equipment"
              payload: { asset_name: "Pump-1", asset_type: "PUMP_TRUCK" }
              as: ProjectManager
              captures: { eq_id: $.data.id }
            - call: "POST /projects"
              payload: { site_name: "Eq P1", client_name: "Pi" }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /projects/${p1}/crew-assignments"
              payload: { crew_id: "${crew_a}", equipment_id: "${eq_id}", window_start: "2026-07-01T10:00:00Z", window_end: "2026-07-01T12:00:00Z" }
              as: ProjectManager
            - call: "POST /projects"
              payload: { site_name: "Eq P2", client_name: "Pi" }
              as: Estimator
              captures: { p2: $.data.id }
          trigger:
            - call: "POST /projects/${p2}/crew-assignments"
              payload: { crew_id: "${crew_b}", equipment_id: "${eq_id}", window_start: "2026-07-01T13:00:00Z", window_end: "2026-07-01T15:00:00Z" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_EQUIPMENT_DOUBLE_BOOKED"

