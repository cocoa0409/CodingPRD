              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "wb@x.com", full_name: "WB", country_code: "US" }
              as: PlatformAdmin
              captures: { acc_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.subscription_id, sub_v: $.data.version }
            - call: "POST /v1/subscriptions/${sub_id}/cancel"
              payload: { cancel_reason: "USER_REQUESTED" }
              as: PlatformAdmin
            - call: "POST /v1/winback-campaigns"
              payload: { campaign_code: "W30", discount_pct: 50, duration_months: 3, min_days_since_cancel: 30, max_days_since_cancel: 365, eligible_cancel_reasons: ["USER_REQUESTED"] }
              as: PlatformAdmin
              captures: { camp_id: $.data.winback_campaign_id }
            - call: "POST /v1/winback-campaigns/${camp_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/subscriptions/${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sub_v_now: $.data.version }
          trigger:
            - call: "POST /v1/accounts/${acc_id}/winback-enroll"
              payload: { winback_campaign_id: "${camp_id}", expected_subscription_version: "${sub_v_now}" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_WINBACK_INELIGIBLE (only 5 days since cancel, min 30 required)"

