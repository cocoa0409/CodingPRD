              captures: { pol_v_end: $.data.version }
            - &k_end_peak
              call: "POST /farm-policies/${pol_id}/endorsements"
              payload: { expected_policy_version: "${pol_v_end}", form_code: "PEAK_SEASON_INCREASE", sublimit_cents: 12000000, requested_effective_date: "2026-09-01" }
