  # ===================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assumption_set_review_revision_cycle
        grounds:
          - state_machines.AssumptionSet.transitions.IN_REVIEW_to_DRAFT
          - state_machines.AssumptionSet.transitions.APPROVED_to_DRAFT
          - state_machines.AssumptionSet.transitions.APPROVED_to_LOCKED
        distinguishing_aspect: |
          AssumptionSet is cyclic: DRAFT -> IN_REVIEW -> DRAFT (reject loop),
          then DRAFT -> IN_REVIEW -> APPROVED -> LOCKED, with APPROVED -> DRAFT
          reopen as a second cycle arm — non-linear revision-loop shape on the
          assumption-set entity.
        test_recipe:
          setup:
            - "Plan 2028 exists; preparer actuary and reviewing enrolled actuary registered"
            - "Assumption set created DRAFT"
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { sponsor_name: "Cycle Co", plan_year: 2028, accrual_rate: 0.01, normal_retirement_age: 62, prior_aftap_pct: 84.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /v1/actuaries"
              payload: { full_name: "Prep Act", credential_id: "EA-1", enrollment_status: "ENROLLED" }
              as: FirmAdmin
              captures: { act_prep: "$.data.id" }
            - call: "POST /v1/actuaries"
              payload: { full_name: "Rev Act", credential_id: "EA-2", enrollment_status: "ENROLLED" }
              as: FirmAdmin
              captures: { act_rev: "$.data.id" }
            - call: "POST /v1/plans/${plan_id}/assumption-sets"
              payload: { plan_year: 2028, label: "v1", mortality_table: "TEST_TABLE_4AGE", funding_discount_rate: 0.05, disclosure_discount_rate: 0.04, retirement_age: 62 }
              as: Actuary
              as_user_id: "${act_prep}"
              captures: { aset_id: "$.data.id", aset_v: "$.data.version" }
            - call: "POST /v1/assumption-sets/${aset_id}/submit"
              payload: {}
              as: Actuary
              as_user_id: "${act_prep}"
            - call: "POST /v1/assumption-sets/${aset_id}/reject"
              payload: {}
              as: SeniorActuary
              as_user_id: "${act_rev}"
          trigger:
            - call: "POST /v1/assumption-sets/${aset_id}/submit"
              payload: {}
              as: Actuary
              as_user_id: "${act_prep}"
            - call: "POST /v1/assumption-sets/${aset_id}/approve"
              payload: {}
              as: SeniorActuary
              as_user_id: "${act_rev}"
            - call: "POST /v1/assumption-sets/${aset_id}/reopen"
              payload: {}
              as: SeniorActuary
              as_user_id: "${act_rev}"
            - call: "POST /v1/assumption-sets/${aset_id}/submit"
              payload: {}
              as: Actuary
              as_user_id: "${act_prep}"
            - call: "POST /v1/assumption-sets/${aset_id}/approve"
