        distinguishing_aspect: "The second OCC rule guards a different parent entity with a different token field and a different error_id, and the version that goes stale is bumped by a write on a CHILD entity — activating a subscription flips the unit to OCCUPIED — so the client's unit token expires without the client touching the unit at all."
