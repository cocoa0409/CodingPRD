            - { call: "POST /conf/bookings", payload: { slot_id: "${qa0}", student_id: "${stA}", channel: "IN_PERSON", interpreter_language: "es" }, as: FamilyGuardian, as_user_id: "${f1}", captures: { bkA: $.data.id } }
