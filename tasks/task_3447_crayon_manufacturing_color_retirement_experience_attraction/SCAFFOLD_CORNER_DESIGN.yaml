  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 is observable: a request without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role, shape, or existence check runs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock0
          trigger:
            - call: "POST /crayon-works/colors"
              payload: { name: "No Header Blue", hex_code: "#000000" }
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 401 and err == ERR_UNAUTHENTICATED (the trigger is sent with the identity headers omitted)"
            - "no color was persisted"

      - name: unknown_path_id_returns_not_found_before_state_checks
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "Existence (priority 4) precedes state (priority 6): a transition call on a never-created formula id answers 404 ERR_NOT_FOUND, never ERR_INVALID_FORMULA_STATE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock0
          trigger:
            - call: "POST /crayon-works/formulas/00000000-0000-4000-8000-000000000000/transition"
              payload: { action: APPROVE }
              as: SafetyOfficer
              as_user_id: "so-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_NOT_FOUND"
            - "err != ERR_INVALID_FORMULA_STATE"

      - name: stale_spec_version_on_allocation_create_returns_412
