              as: NepaCoordinator
              as_user_id: "coord-1"
          assert:
            - "HTTP status is 409 and data.error_id == ERR_ALTERNATIVE_STALE"
            - "data.error_id != ERR_REFERENCE_MISMATCH"
            - "Alternative.${altB_id}.screening_status == STALE and pinned_pn_statement_id == ${pn1_id}"
            - "PurposeNeedStatement.${pn1_id}.status == SUPERSEDED and ProposedAction.${act_id}.alternatives_screened_in_count == 0"
            - "GET /decisions?action_id=${act_id} returns total_count == 0"

