scaffold_corner_design:
  - section: rbac
    instances:
      - name: rbac_platform_admin_clock_control_exclusive_operation_succeeds
        claim_type: exclusive operations
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - POST /api/v1/_clock/set_current_utc
          - GET /api/v1/_clock/current
        distinguishing_aspect: "PlatformAdmin is the only §1.7 role whose exclusive_operations list POST /_clock/set_current_utc, and its write is durable — the pre-write read pins the 2026-09-01T00:00:00Z startup default and the post-write read pins the newly set 2026-10-01T00:00:00Z."
        test_recipe:
          setup:
            - "Empty DB; no clock call has been made yet, so the logical clock still reads the server's declared startup default."
            - "PlatformAdmin is the acting role for both the read and the write; its exclusive_operations list carries exactly one entry, POST /_clock/set_current_utc."
          setup_api_calls:
            - call: "GET /api/v1/_clock/current"
              payload: {}
              as: PlatformAdmin
              captures: { t_default: $.data.current_utc }
          trigger:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { t_set_echo: $.data.current_utc }
            - call: "GET /api/v1/_clock/current"
              payload: {}
              as: PlatformAdmin
              captures: { t_after: $.data.current_utc }
          assert:
            - "The pre-write read returns HTTP 200 with data.current_utc == ${t_default} == \"2026-09-01T00:00:00Z\", the declared startup default — not a wall-clock instant"
            - "The PlatformAdmin write returns HTTP 200 and its own response body already carries data.current_utc == ${t_set_echo} == \"2026-10-01T00:00:00Z\""
            - "The write is durable within the same logical request sequence: the immediately following GET /_clock/current returns data.current_utc == ${t_after} == \"2026-10-01T00:00:00Z\""
            - "No other §1.7 role declares POST /_clock/set_current_utc in exclusive_operations, so this success is the role-scoped half of the clock-control pair whose denial half is rbac_platform_admin_denied_component_creation_returns_forbidden"

      - name: rbac_platform_admin_denied_component_creation_returns_forbidden
        claim_type: denial
        grounds:
          - roles.SupplyChainCoordinator.exclusive_operations
          - roles.PlatformAdmin.exclusive_operations
          - POST /api/v1/components
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "PlatformAdmin holds the unconditional clock override but is absent from POST /components' §1.5 role list, so the identical payload is 403 ERR_FORBIDDEN under PlatformAdmin and 201 under SupplyChainCoordinator — the override is per-operation, not a blanket superuser bypass."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z by the one role that may set it."
            - "PlatformAdmin is declared in §1.7 (so priority 1 cannot fire) and its exclusive_operations list holds only POST /_clock/set_current_utc; POST /components lists SupplyChainCoordinator alone."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-DENIED-1", component_class: "WHEELSET", unit_cost_cents: 1500, lead_time_days: 5 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-ALLOWED-1", component_class: "WHEELSET", unit_cost_cents: 1500, lead_time_days: 5 }
              as: SupplyChainCoordinator
              captures: { ok_id: $.data.id, ok_part: $.data.part_number }
          assert:
            - "The PlatformAdmin write returns HTTP 403 with data.error_id == ${err_id} == \"ERR_FORBIDDEN\""
            - "The denial is priority-2 authenticated-but-unpermitted, not priority-1: PlatformAdmin is declared in §1.7, so ERR_UNAUTHENTICATED is impossible here"
            - "The identical payload under SupplyChainCoordinator returns HTTP 201 with data.id == ${ok_id} and data.part_number == ${ok_part} == \"WS-ALLOWED-1\", so the rejection is keyed on the acting role and not on the body"
            - "The 403 body is an error envelope with no data.id, so the denied call minted no Component row"
            - "PlatformAdmin's clock override is not a blanket bypass: the same role that set the clock is refused this SupplyChainCoordinator-exclusive operation"

      - name: rbac_supply_chain_coordinator_component_catalog_and_receipt_operations_succeed
        claim_type: exclusive operations
        grounds:
          - roles.SupplyChainCoordinator.exclusive_operations
          - POST /api/v1/components
          - POST /api/v1/component-purchase-orders
          - POST /api/v1/component-purchase-orders/{id}/confirm
          - POST /api/v1/component-receipts
          - POST /api/v1/component-receipts/{id}/receive
          - entities.Component.fields.on_hand_qty
        distinguishing_aspect: "SupplyChainCoordinator exercises five of its six declared exclusive_operations in one chain — catalogue, purchase order, confirm, receipt booking and receipt application — and the stock only moves on the final receive, from 0 to the received quantity 12."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "No component exists, so the whole catalogue and yard chain is produced by SupplyChainCoordinator calls alone; every other role is absent from all five endpoints' §1.5 role lists."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-SCC-1", component_class: "WHEELSET", unit_cost_cents: 1500, lead_time_days: 5 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id, oh_at_create: $.data.on_hand_qty }
          trigger:
            - call: "POST /api/v1/component-purchase-orders"
              payload: { component_id: "${ws_id}", qty_ordered: 12, unit_cost_cents: 1500, order_date: "2026-09-01", expected_receipt_date: "2026-09-06" }
              as: SupplyChainCoordinator
              captures: { po_id: $.data.id, po_status_placed: $.data.status }
            - call: "POST /api/v1/component-purchase-orders/${po_id}/confirm"
              payload: {}
              as: SupplyChainCoordinator
              captures: { po_status_confirmed: $.data.status }
            - call: "POST /api/v1/component-receipts"
              payload: { component_purchase_order_id: "${po_id}", component_id: "${ws_id}", qty_received: 12, receipt_date: "2026-09-06" }
              as: SupplyChainCoordinator
              captures: { rc_id: $.data.id }
            - call: "GET /api/v1/components/${ws_id}"
              payload: {}
              as: SupplyChainCoordinator
              captures: { oh_after_booking: $.data.on_hand_qty }
            - call: "POST /api/v1/component-receipts/${rc_id}/receive"
              payload: {}
              as: SupplyChainCoordinator
            - call: "GET /api/v1/component-purchase-orders/${po_id}"
              payload: {}
              as: SupplyChainCoordinator
              captures: { po_status_received: $.data.status }
            - call: "GET /api/v1/components/${ws_id}"
              payload: {}
              as: SupplyChainCoordinator
              captures: { oh_after_receive: $.data.on_hand_qty, res_after_receive: $.data.reserved_qty }
          assert:
            - "The catalogue write returns HTTP 201 with data.on_hand_qty == ${oh_at_create} == 0, the declared system default"
            - "The purchase order opens in PLACED: data.status == ${po_status_placed} == \"PLACED\""
            - "POST /component-purchase-orders/${po_id}/confirm returns HTTP 200 with data.status == ${po_status_confirmed} == \"CONFIRMED\""
            - "Booking a receipt alone moves no stock: GET /components/${ws_id} still reads data.on_hand_qty == ${oh_after_booking} == 0"
            - "Applying the receipt closes the purchase: the parent order reads data.status == ${po_status_received} == \"RECEIVED\" while the component is lifted to data.on_hand_qty == ${oh_after_receive} == 12"
            - "With no released order and no in-progress retrofit work order, the reservation term stays empty after the receipt lands: data.reserved_qty == ${res_after_receive} == 0"
            - "All five calls succeed under one role, so SupplyChainCoordinator's exclusive_operations are role-scoped to it and exercisable end-to-end without any other role"

      - name: rbac_supply_chain_coordinator_denied_production_order_creation_returns_forbidden
        claim_type: denial
        grounds:
          - roles.ProductionPlanner.exclusive_operations
          - roles.SupplyChainCoordinator.shared_operations
          - POST /api/v1/production-orders
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "SupplyChainCoordinator is refused POST /production-orders with 403 ERR_FORBIDDEN while the same role's shared GET /production-orders returns 200 and the identical payload under ProductionPlanner returns 201 DRAFT — the denial is operation-scoped inside an otherwise read-permitted role."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "One car type CT-SCC exists so the denied payload is otherwise fully conforming; POST /car-types is a shared operation of ProductionPlanner and RegulatoryRetrofitist, so the planner writes it."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "CT-SCC-1", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "LINE-SCC" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
          trigger:
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 2, planned_shop_days: 2, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: SupplyChainCoordinator
              captures: { err_id: $.data.error_id }
            - call: "GET /api/v1/production-orders"
              payload: {}
              as: SupplyChainCoordinator
              captures: { scc_read_count: $.data }
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 2, planned_shop_days: 2, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { ok_id: $.data.id, ok_status: $.data.status }
            - call: "GET /api/v1/production-orders"
              payload: {}
              as: SupplyChainCoordinator
              captures: { only_row: "$.data[0].id", row_count: $.data }
          assert:
            - "The SupplyChainCoordinator write returns HTTP 403 with data.error_id == ${err_id} == \"ERR_FORBIDDEN\""
            - "SupplyChainCoordinator is declared in §1.7, so the rejection is priority 2 (authenticated, unpermitted) and not priority 1"
            - "The identical payload under ProductionPlanner returns HTTP 201 with data.status == ${ok_status} == \"DRAFT\", so the denial is role-keyed rather than payload-keyed"
            - "The same denied role's shared GET /production-orders returns HTTP 200, confirming the denial is per-operation and not a blanket read/write ban"
            - "The 403 minted no row: the shared list read shows exactly one production order, data[0].id == ${only_row} == ${ok_id}"

      - name: rbac_production_planner_car_type_and_bill_of_material_operations_succeed
        claim_type: exclusive operations
        grounds:
          - roles.ProductionPlanner.exclusive_operations
          - roles.ProductionPlanner.shared_operations
          - POST /api/v1/car-type-component-requirements
          - POST /api/v1/car-types
          - entities.CarTypeComponentRequirement.fields.qty_per_car
        distinguishing_aspect: "ProductionPlanner writes the car type through its shared_operations entry and then binds the bill-of-material row through its exclusive POST /car-type-component-requirements, and the row is readable back from the car-type side with the exact per-car quantity 2."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "The only component in the catalogue is created by SupplyChainCoordinator, since POST /components is that role's exclusive operation; the planner contributes the car type and the junction row."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-PP-1", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
          trigger:
            - call: "POST /api/v1/car-types"
              payload: { model_code: "CT-PP-1", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "LINE-PP" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id, ct_status: $.data.status }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${ws_id}", qty_per_car: 2 }
              as: ProductionPlanner
              captures: { bom_id: $.data.id, bom_qty: $.data.qty_per_car }
            - call: "GET /api/v1/car-type-component-requirements?car_type_id=${ct_id}"
              payload: {}
              as: ProductionPlanner
              captures: { listed_id: "$.data[0].id", listed_qty: "$.data[0].qty_per_car", listed_comp: "$.data[0].component_id" }
          assert:
            - "The shared-operation write returns HTTP 201 with data.status == ${ct_status} == \"ACTIVE\" and data.id == ${ct_id}"
            - "The exclusive-operation write returns HTTP 201 with data.id == ${bom_id} and data.qty_per_car == ${bom_qty} == 2"
            - "The junction row is reachable from the car-type side: GET /car-type-component-requirements?car_type_id=${ct_id} returns data[0].id == ${listed_id} == ${bom_id}"
            - "The listed row carries the bound foreign keys: data[0].component_id == ${listed_comp} == ${ws_id} and data[0].qty_per_car == ${listed_qty} == 2"
            - "Both writes succeed for ProductionPlanner alone, so the car-type shared operation and the bill-of-material exclusive operation are both inside this role's declared surface"

      - name: rbac_production_planner_denied_lessee_creation_returns_forbidden
        claim_type: denial
        grounds:
          - roles.LeaseAdministrator.exclusive_operations
          - roles.ProductionPlanner.shared_operations
          - POST /api/v1/lessees
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "ProductionPlanner is refused POST /lessees with 403 ERR_FORBIDDEN even though the same role may read the resulting lessee's balance through its All-GET-reads shared operation, so lessee account creation sits outside the planner's surface while lessee-derived reads do not."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "POST /lessees lists LeaseAdministrator alone, so no other role may mint a lessee account; ProductionPlanner's shared_operations carry All GET reads, which includes the balance read."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "LESS-PP-DENIED", credit_tier: "A", utilization_threshold_pct: 50, credit_ceiling_cents: 5000000 }
              as: ProductionPlanner
              captures: { err_id: $.data.error_id }
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "LESS-PP-ALLOWED", credit_tier: "A", utilization_threshold_pct: 50, credit_ceiling_cents: 5000000 }
              as: LeaseAdministrator
              captures: { ok_id: $.data.id, ok_status: $.data.status, ok_balance: $.data.outstanding_balance_cents }
            - call: "GET /api/v1/lessees/${ok_id}/outstanding-balance"
              payload: {}
              as: ProductionPlanner
              captures: { read_balance: $.data.outstanding_balance_cents }
          assert:
            - "The ProductionPlanner write returns HTTP 403 with data.error_id == ${err_id} == \"ERR_FORBIDDEN\""
            - "ProductionPlanner is declared in §1.7, so priority 1 passes and priority 2 is the rejecting rule"
            - "The identical payload under LeaseAdministrator returns HTTP 201 with data.status == ${ok_status} == \"ACTIVE\" and data.outstanding_balance_cents == ${ok_balance} == 0"
            - "The denied role still performs its shared read: GET /lessees/${ok_id}/outstanding-balance returns HTTP 200 with data.outstanding_balance_cents == ${read_balance} == 0"
            - "The 403 body is an error envelope carrying no data.id, so the denied call created no Lessee row"

      - name: rbac_lease_administrator_lessee_and_contract_lifecycle_operations_succeed
        claim_type: exclusive operations
        grounds:
          - roles.LeaseAdministrator.exclusive_operations
          - POST /api/v1/lessees
          - POST /api/v1/lease-contracts
          - POST /api/v1/lease-contracts/{id}/activate
          - entities.LeaseContract.fields.amendment_seq
        distinguishing_aspect: "LeaseAdministrator alone mints the lessee account and the contract, and the DRAFT-to-ACTIVE activation is visible in the same chain with amendment_seq still 0 and version advanced by exactly one — no other §1.7 role appears on any of the three endpoints' §1.5 role lists."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "The contract term [2026-01-01, 2027-12-31) closes after the pinned clock date, which is the activate precondition's date test; no assignment exists, so the overlap precondition is vacuous."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "LESS-LA-1", credit_tier: "A", utilization_threshold_pct: 50, credit_ceiling_cents: 9000000 }
              as: LeaseAdministrator
              captures: { ls_id: $.data.id, ls_status: $.data.status, ls_balance: $.data.outstanding_balance_cents }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${ls_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 10000, liability_bearer: "LESSOR", term_start_date: "2026-01-01", term_end_date: "2027-12-31", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_id: $.data.id, lc_status_draft: $.data.status, lc_seq0: $.data.amendment_seq, lc_cap0: $.data.capital_allocation_cents, lc_v0: $.data.version }
            - call: "POST /api/v1/lease-contracts/${lc_id}/activate"
              payload: {}
              as: LeaseAdministrator
              captures: { lc_status_active: $.data.status, lc_v1: $.data.version, lc_seq_after: $.data.amendment_seq }
          assert:
            - "The lessee write returns HTTP 201 with data.status == ${ls_status} == \"ACTIVE\" and data.outstanding_balance_cents == ${ls_balance} == 0"
            - "The contract write returns HTTP 201 with data.status == ${lc_status_draft} == \"DRAFT\", data.amendment_seq == ${lc_seq0} == 0 and data.capital_allocation_cents == ${lc_cap0} == 0"
            - "POST /lease-contracts/${lc_id}/activate returns HTTP 200 with data.status == ${lc_status_active} == \"ACTIVE\""
            - "Activation advances the contract's optimistic-concurrency counter by exactly one: data.version == ${lc_v1} == ${lc_v0} + 1"
            - "Activation alone ratifies nothing: data.amendment_seq == ${lc_seq_after} == 0"
            - "All three writes succeed for LeaseAdministrator alone, so lessee minting, contract drafting and activation are all inside this role's declared exclusive surface"

      - name: rbac_lease_administrator_denied_retrofit_program_creation_returns_forbidden
        claim_type: denial
        grounds:
          - roles.RegulatoryRetrofitist.exclusive_operations
          - roles.LeaseAdministrator.shared_operations
          - POST /api/v1/retrofit-programs
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "LeaseAdministrator's contract desk cannot open a regulatory mandate — POST /retrofit-programs returns 403 ERR_FORBIDDEN — while the identical mandate body under RegulatoryRetrofitist returns 201 PLANNED and the denied role's shared GET /retrofit-programs still reads 200."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "POST /retrofit-programs lists RegulatoryRetrofitist alone; the mandate code is unique across RetrofitProgram, so the denied and allowed bodies must not share one."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/retrofit-programs"
              payload: { mandate_code: "MAND-LA-DENIED", description: "Denied mandate", compliance_deadline_date: "2026-12-31", required_shop_days_per_car: 3 }
              as: LeaseAdministrator
              captures: { err_id: $.data.error_id }
            - call: "GET /api/v1/retrofit-programs"
              payload: {}
              as: LeaseAdministrator
              captures: { la_read: $.data }
            - call: "POST /api/v1/retrofit-programs"
              payload: { mandate_code: "MAND-LA-ALLOWED", description: "Allowed mandate", compliance_deadline_date: "2026-12-31", required_shop_days_per_car: 3 }
              as: RegulatoryRetrofitist
              captures: { ok_id: $.data.id, ok_status: $.data.status }
            - call: "GET /api/v1/retrofit-programs"
              payload: {}
              as: LeaseAdministrator
              captures: { only_row: "$.data[0].id" }
          assert:
            - "The LeaseAdministrator write returns HTTP 403 with data.error_id == ${err_id} == \"ERR_FORBIDDEN\""
            - "LeaseAdministrator is declared in §1.7, so the rejection is priority 2 and not priority 1"
            - "The identical body under RegulatoryRetrofitist returns HTTP 201 with data.status == ${ok_status} == \"PLANNED\", so the denial is role-keyed"
            - "The denied role's shared GET /retrofit-programs returns HTTP 200, so the denial is operation-scoped"
            - "The 403 minted no mandate: the post-trigger list read holds exactly one program, data[0].id == ${only_row} == ${ok_id}"

      - name: rbac_portfolio_manager_scrap_of_held_car_succeeds
        claim_type: exclusive operations
        grounds:
          - roles.PortfolioManager.exclusive_operations
          - POST /api/v1/lease-fleet-cars/{id}/scrap
          - calculations.lease_fleet_capital_allocation
          - entities.LeaseFleetCar.fields.status
        distinguishing_aspect: "PortfolioManager alone may scrap: a HELD car built by a RETAINED order moves to SCRAPPED under that role and the contract's capital_allocation_cents drops from the two-car 196000 to the one-car 98000, while the ProductionPlanner who built the car is absent from the scrap endpoint's §1.5 role list."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type CT-PM-1 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-PM) with WHEELSET WS-PM-1 at qty_per_car 1 and CASTING CS-PM-1 at qty_per_car 1, both stocked to 10 by purchase order, confirm, receipt and receive."
            - "RETAINED order of 2 cars against contract LC-PM-1 (FULL_SERVICE, per_diem 10000, LESSOR-liable, cap 10) is reserved, released, changed over on LINE-PM-L1 for [2026-09-02, 2026-09-04) and completed on 2026-09-04, so two HELD cars exist with acquisition_cost_cents 98000 each and capital_allocation_cents 196000."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "LESS-PM-1", credit_tier: "A", utilization_threshold_pct: 50, credit_ceiling_cents: 9000000 }
              as: LeaseAdministrator
              captures: { ls_id: $.data.id }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${ls_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 10000, liability_bearer: "LESSOR", term_start_date: "2026-01-01", term_end_date: "2027-12-31", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_id: $.data.id }
            - call: "POST /api/v1/lease-contracts/${lc_id}/activate"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /api/v1/car-types"
              payload: { model_code: "CT-PM-1", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "LINE-PM" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
