# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >= 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cost_recovery_estimate_vs_actual_diverge
        grounds:
          - calculations.cost_recovery
          - state_machines.PermitApplication.UNDER_REVIEW_to_CONDITIONALLY_APPROVED
          - state_machines.PermitApplication.ISSUED_to_CLOSED
          - entities.Invoice.fields.cost_recovery_estimate
          - entities.Invoice.fields.cost_recovery_actual
        distinguishing_aspect: |
          Same four DepartmentReview rows (identical personnel/rate) yield
          Invoice.cost_recovery_estimate=3634.00 from planned_hours but
          cost_recovery_actual=4094.00 from actual_hours — this dual-variant lives
          on the Invoice/staffing domain, distinct from the Deposit-domain variant below.
        test_recipe:
          setup:
            - "Venue (cap 5000, buffer 60), an Applicant, a MEDIUM app (attendance 3000) with one route segment, submitted and all four reviews APPROVED with planned staffing, so app is CONDITIONALLY_APPROVED with Invoice.cost_recovery_estimate=3634.00; then COI accepted, deposit held, issued, debrief opened with logged actual_hours differing for POLICE only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PermitOfficer
            - call: "POST /venues"
              payload: { name: "Central Park", venue_type: "PARK", max_capacity: 5000, setup_buffer_minutes: 60 }
              as: PermitOfficer
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "Main St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Rotary Club", contact_email: "r@x.com" }
              as: PermitOfficer
              captures: { app_user_id: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Rotary Club", venue_id: "${venue_id}", event_kind: "FESTIVAL", expected_attendance: 3000, occupy_start: "2026-06-01T10:00:00Z", occupy_end: "2026-06-01T14:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { app_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/route-segments"
              payload: { closure_schedule_id: "${sched_id}", segment_label: "Main St 1st-5th", closure_start: "2026-06-01T09:00:00Z", closure_end: "2026-06-01T15:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "POST /permit-applications/${app_id}/submit-for-review"
              payload: { expected_venue_version: "${venue_v0}" }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "GET /permit-applications/${app_id}/reviews"
              payload: {}
              as: PermitOfficer
              captures: { rev_police: "$.data[0].id", rev_fire: "$.data[1].id", rev_ems: "$.data[2].id", rev_pw: "$.data[3].id" }
            - call: "POST /permit-applications/${app_id}/reviews/${rev_police}/approve"
              payload: { planned_personnel: 4, planned_hours: 8, hourly_rate: 50 }
              as: DepartmentReviewer
              as_user_id: "POLICE"
            - call: "POST /permit-applications/${app_id}/reviews/${rev_fire}/approve"
              payload: { planned_personnel: 2, planned_hours: 6, hourly_rate: 60 }
              as: DepartmentReviewer
              as_user_id: "FIRE"
            - call: "POST /permit-applications/${app_id}/reviews/${rev_ems}/approve"
              payload: { planned_personnel: 1, planned_hours: 8, hourly_rate: 45 }
              as: DepartmentReviewer
              as_user_id: "EMS"
            - call: "POST /permit-applications/${app_id}/reviews/${rev_pw}/approve"
              payload: { planned_personnel: 3, planned_hours: 4, hourly_rate: 40 }
              as: DepartmentReviewer
              as_user_id: "PUBLIC_WORKS"
            - call: "POST /permit-applications/${app_id}/coi"
              payload: { carrier: "Acme Ins", coverage_amount: 1200000, expires_at: "2027-01-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { coi_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/coi/${coi_id}/accept"
              payload: {}
              as: PermitOfficer
            - call: "POST /permit-applications/${app_id}/deposit"
              payload: { amount: 500 }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "POST /permit-applications/${app_id}/issue"
              payload: {}
              as: PermitOfficer
            - call: "POST /permit-applications/${app_id}/reviews/${rev_police}/log-actuals"
              payload: { actual_hours: 10 }
              as: DepartmentReviewer
              as_user_id: "POLICE"
            - call: "POST /permit-applications/${app_id}/reviews/${rev_fire}/log-actuals"
              payload: { actual_hours: 6 }
              as: DepartmentReviewer
              as_user_id: "FIRE"
            - call: "POST /permit-applications/${app_id}/reviews/${rev_ems}/log-actuals"
              payload: { actual_hours: 8 }
              as: DepartmentReviewer
              as_user_id: "EMS"
            - call: "POST /permit-applications/${app_id}/reviews/${rev_pw}/log-actuals"
              payload: { actual_hours: 4 }
              as: DepartmentReviewer
              as_user_id: "PUBLIC_WORKS"
            - call: "POST /permit-applications/${app_id}/debrief"
              payload: { actual_attendance: 3100, cleanup_charges: 0, incident_count: 0 }
              as: PermitOfficer
              captures: { debrief_id: $.data.id }
          trigger:
            - call: "POST /permit-applications/${app_id}/debrief/${debrief_id}/finalize"
              payload: {}
              as: PermitOfficer
            - call: "GET /permit-applications/${app_id}/invoice"
              payload: {}
              as: PermitOfficer
              captures: { est: "$.data[0].cost_recovery_estimate", act: "$.data[0].cost_recovery_actual" }
          assert:
            - "Invoice[0].cost_recovery_estimate == 3634.00 (planned_hours variant: 1600+720+360+480=3160, *1.15)"
            - "Invoice[0].cost_recovery_actual == 4094.00 (actual_hours variant: POLICE 4*10*50=2000 => 3560, *1.15)"
            - "Invoice[0].cost_recovery_actual != Invoice[0].cost_recovery_estimate"

      - name: deposit_partial_forfeit_vs_full_refund
        grounds:
          - calculations.deposit_reconciliation
          - state_machines.Deposit.HELD_to_FORFEITED_PARTIAL
          - state_machines.Deposit.HELD_to_REFUNDED
          - entities.Deposit.fields.forfeited_amount
          - entities.Deposit.fields.refunded_amount
        distinguishing_aspect: |
          The same HELD deposit of 500.00 resolves to forfeited_amount=120.00 /
          refunded_amount=380.00 under debrief-finalize with cleanup_charges=120,
          but to forfeited_amount=0 / refunded_amount=500.00 under cancel-from-
          CONDITIONALLY_APPROVED — dual-variant on the Deposit domain, distinct
          from the Invoice/staffing variant above.
        test_recipe:
          setup:
            - "A MEDIUM app fully issued with a HELD deposit of 500.00, then debrief opened with cleanup_charges=120.00, ready to finalize."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PermitOfficer
            - call: "POST /venues"
              payload: { name: "Plaza", venue_type: "PLAZA", max_capacity: 5000, setup_buffer_minutes: 60 }
              as: PermitOfficer
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "2nd Ave", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Lions Club", contact_email: "l@x.com" }
              as: PermitOfficer
              captures: { app_user_id: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Lions Club", venue_id: "${venue_id}", event_kind: "PARADE", expected_attendance: 3000, occupy_start: "2026-06-02T10:00:00Z", occupy_end: "2026-06-02T14:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { app_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/route-segments"
              payload: { closure_schedule_id: "${sched_id}", segment_label: "2nd Ave", closure_start: "2026-06-02T09:00:00Z", closure_end: "2026-06-02T15:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "POST /permit-applications/${app_id}/submit-for-review"
              payload: { expected_venue_version: "${venue_v0}" }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "GET /permit-applications/${app_id}/reviews"
              payload: {}
              as: PermitOfficer
              captures: { rev_police: "$.data[0].id", rev_fire: "$.data[1].id", rev_ems: "$.data[2].id", rev_pw: "$.data[3].id" }
            - call: "POST /permit-applications/${app_id}/reviews/${rev_police}/approve"
              payload: { planned_personnel: 4, planned_hours: 8, hourly_rate: 50 }
              as: DepartmentReviewer
              as_user_id: "POLICE"
            - call: "POST /permit-applications/${app_id}/reviews/${rev_fire}/approve"
              payload: { planned_personnel: 2, planned_hours: 6, hourly_rate: 60 }
              as: DepartmentReviewer
              as_user_id: "FIRE"
            - call: "POST /permit-applications/${app_id}/reviews/${rev_ems}/approve"
              payload: { planned_personnel: 1, planned_hours: 8, hourly_rate: 45 }
              as: DepartmentReviewer
              as_user_id: "EMS"
            - call: "POST /permit-applications/${app_id}/reviews/${rev_pw}/approve"
              payload: { planned_personnel: 3, planned_hours: 4, hourly_rate: 40 }
              as: DepartmentReviewer
              as_user_id: "PUBLIC_WORKS"
            - call: "POST /permit-applications/${app_id}/coi"
              payload: { carrier: "Acme Ins", coverage_amount: 1200000, expires_at: "2027-01-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { coi_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/coi/${coi_id}/accept"
              payload: {}
              as: PermitOfficer
            - call: "POST /permit-applications/${app_id}/deposit"
              payload: { amount: 500 }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { deposit_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/issue"
              payload: {}
              as: PermitOfficer
            - call: "POST /permit-applications/${app_id}/debrief"
              payload: { actual_attendance: 2900, cleanup_charges: 120, incident_count: 1 }
              as: PermitOfficer
              captures: { debrief_id: $.data.id }
          trigger:
            - call: "POST /permit-applications/${app_id}/debrief/${debrief_id}/finalize"
              payload: {}
              as: PermitOfficer
          assert:
            - "Deposit ${deposit_id}: status == FORFEITED_PARTIAL"
            - "Deposit ${deposit_id}: forfeited_amount == 120.00"
            - "Deposit ${deposit_id}: refunded_amount == 380.00"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fee_tiered_marginal_surcharge_plus_segment
        grounds:
          - calculations.application_fee_calc
          - entities.PermitApplication.fields.application_fee
          - entities.PermitApplication.fields.permit_class
        distinguishing_aspect: |
          Mode (a): application_fee = base(class) + marginal-tiered attendance
          surcharge + per-segment closure fee — three inputs interacting non-linearly
          (class-selected base, breakpoint-selected marginal rate, segment count),
          giving 875.00 for MEDIUM/3000/1-segment.
        test_recipe:
          setup:
            - "A DRAFT MEDIUM application (attendance 3000) with exactly one route segment on an OPEN schedule."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", venue_type: "PARK", max_capacity: 6000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "Elm St" }
              as: PermitOfficer
              captures: { sched_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org A", contact_email: "a@x.com" }
              as: PermitOfficer
              captures: { app_user_id: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org A", venue_id: "${venue_id}", event_kind: "FESTIVAL", expected_attendance: 3000, occupy_start: "2026-06-03T10:00:00Z", occupy_end: "2026-06-03T14:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /permit-applications/${app_id}/route-segments"
              payload: { closure_schedule_id: "${sched_id}", segment_label: "Elm 1-3", closure_start: "2026-06-03T09:00:00Z", closure_end: "2026-06-03T15:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "GET /permit-applications/${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { fee: $.data.application_fee }
          assert:
            - "PermitApplication.${app_id}.permit_class == MEDIUM"
            - "PermitApplication.${app_id}.application_fee == 875.00 (400 base + 2000*0.20 surcharge + 1*75 segment)"

      - name: cost_recovery_round_per_line_then_overhead
        grounds:
          - calculations.cost_recovery
          - entities.Invoice.fields.cost_recovery_estimate
          - state_machines.PermitApplication.UNDER_REVIEW_to_CONDITIONALLY_APPROVED
        distinguishing_aspect: |
          Mode (b): nested-rounding order is pinned — each department line is
          rounded to cents, the four lines are summed, THEN the 15% overhead is
          applied and rounded, producing 3634.00; a sum-then-round-then-overhead
          order would drift, so this exercises a different combinatorial axis than
          the fee tiers above.
        test_recipe:
          setup:
            - "A MEDIUM app submitted with four PENDING reviews, three already APPROVED with staffing, the last approval about to fire quorum and Invoice creation."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V2", venue_type: "PARK", max_capacity: 6000, setup_buffer_minutes: 60 }
              as: PermitOfficer
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "Oak St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org B", contact_email: "b@x.com" }
              as: PermitOfficer
              captures: { app_user_id: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org B", venue_id: "${venue_id}", event_kind: "RACE", expected_attendance: 3000, occupy_start: "2026-06-04T10:00:00Z", occupy_end: "2026-06-04T14:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { app_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/route-segments"
              payload: { closure_schedule_id: "${sched_id}", segment_label: "Oak 1-4", closure_start: "2026-06-04T09:00:00Z", closure_end: "2026-06-04T15:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "POST /permit-applications/${app_id}/submit-for-review"
              payload: { expected_venue_version: "${venue_v0}" }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "GET /permit-applications/${app_id}/reviews"
              payload: {}
              as: PermitOfficer
              captures: { rev_police: "$.data[0].id", rev_fire: "$.data[1].id", rev_ems: "$.data[2].id", rev_pw: "$.data[3].id" }
            - call: "POST /permit-applications/${app_id}/reviews/${rev_police}/approve"
              payload: { planned_personnel: 4, planned_hours: 8, hourly_rate: 50 }
              as: DepartmentReviewer
              as_user_id: "POLICE"
            - call: "POST /permit-applications/${app_id}/reviews/${rev_fire}/approve"
              payload: { planned_personnel: 2, planned_hours: 6, hourly_rate: 60 }
              as: DepartmentReviewer
              as_user_id: "FIRE"
            - call: "POST /permit-applications/${app_id}/reviews/${rev_ems}/approve"
              payload: { planned_personnel: 1, planned_hours: 8, hourly_rate: 45 }
              as: DepartmentReviewer
              as_user_id: "EMS"
          trigger:
            - call: "POST /permit-applications/${app_id}/reviews/${rev_pw}/approve"
              payload: { planned_personnel: 3, planned_hours: 4, hourly_rate: 40 }
              as: DepartmentReviewer
              as_user_id: "PUBLIC_WORKS"
            - call: "GET /permit-applications/${app_id}/invoice"
              payload: {}
              as: PermitOfficer
              captures: { est: "$.data[0].cost_recovery_estimate" }
          assert:
            - "PermitApplication.${app_id}.status == CONDITIONALLY_APPROVED"
            - "Invoice[0].cost_recovery_estimate == 3634.00 (lines 1600+720+360+480=3160, *1.15)"
            - "Invoice[0].balance_due == 4509.00 (875 fee + 3634 estimate)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: review_revision_loop_cycle
        grounds:
          - state_machines.DepartmentReview.PENDING_to_CHANGES_REQUESTED
          - state_machines.DepartmentReview.CHANGES_REQUESTED_to_PENDING
          - state_machines.PermitApplication.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.PermitApplication.REVISION_REQUESTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          DepartmentReview cycles PENDING -> CHANGES_REQUESTED -> PENDING on
          applicant resubmit, and the parent application cycles UNDER_REVIEW ->
          REVISION_REQUESTED -> UNDER_REVIEW — a genuine revision loop on the
          DepartmentReview entity, distinct from the branching machine below.
        test_recipe:
          setup:
            - "A submitted app UNDER_REVIEW; POLICE requests changes, app becomes REVISION_REQUESTED, applicant resubmits."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V3", venue_type: "PARK", max_capacity: 6000, setup_buffer_minutes: 60 }
              as: PermitOfficer
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "Pine St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org C", contact_email: "c@x.com" }
              as: PermitOfficer
              captures: { app_user_id: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org C", venue_id: "${venue_id}", event_kind: "RALLY", expected_attendance: 3000, occupy_start: "2026-06-05T10:00:00Z", occupy_end: "2026-06-05T14:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { app_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/route-segments"
              payload: { closure_schedule_id: "${sched_id}", segment_label: "Pine 1-4", closure_start: "2026-06-05T09:00:00Z", closure_end: "2026-06-05T15:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "POST /permit-applications/${app_id}/submit-for-review"
              payload: { expected_venue_version: "${venue_v0}" }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "GET /permit-applications/${app_id}/reviews"
              payload: {}
              as: PermitOfficer
              captures: { rev_police: "$.data[0].id" }
            - call: "POST /permit-applications/${app_id}/reviews/${rev_police}/request-changes"
              payload: { note: "Move stage 200ft" }
              as: DepartmentReviewer
              as_user_id: "POLICE"
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { venue_v1: $.data.version }
          trigger:
            - call: "POST /permit-applications/${app_id}/submit-for-review"
              payload: { expected_venue_version: "${venue_v1}" }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "GET /permit-applications/${app_id}/reviews/${rev_police}"
              payload: {}
              as: PermitOfficer
              captures: { police_status: $.data.status }
          assert:
            - "PermitApplication.${app_id}.status == UNDER_REVIEW (after resubmit)"
            - "DepartmentReview.${rev_police}.status == PENDING (reset from CHANGES_REQUESTED — cycle back)"

      - name: application_branching_fork_join
        grounds:
          - state_machines.PermitApplication.UNDER_REVIEW_to_CONDITIONALLY_APPROVED
          - state_machines.PermitApplication.UNDER_REVIEW_to_DENIED
          - state_machines.PermitApplication.UNDER_REVIEW_to_REVISION_REQUESTED
          - calculations.review_quorum
        distinguishing_aspect: |
          From UNDER_REVIEW the PermitApplication forks to three divergent targets
          with different side-effect sets — CONDITIONALLY_APPROVED (create Invoice),
          DENIED (release segments + waive conditions + free venue), REVISION_REQUESTED
          (no fiscal change) — a branching machine on the PermitApplication entity,
          distinct from the DepartmentReview cycle above.
        test_recipe:
          setup:
            - "A submitted app UNDER_REVIEW with four PENDING reviews; POLICE vetoes with a note."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V4", venue_type: "PARK", max_capacity: 6000, setup_buffer_minutes: 60 }
              as: PermitOfficer
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "Cedar St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org D", contact_email: "d@x.com" }
              as: PermitOfficer
              captures: { app_user_id: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org D", venue_id: "${venue_id}", event_kind: "PARADE", expected_attendance: 3000, occupy_start: "2026-06-06T10:00:00Z", occupy_end: "2026-06-06T14:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { app_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/route-segments"
              payload: { closure_schedule_id: "${sched_id}", segment_label: "Cedar 1-4", closure_start: "2026-06-06T09:00:00Z", closure_end: "2026-06-06T15:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { seg_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/submit-for-review"
              payload: { expected_venue_version: "${venue_v0}" }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "GET /permit-applications/${app_id}/reviews"
              payload: {}
              as: PermitOfficer
              captures: { rev_fire: "$.data[1].id" }
          trigger:
            - call: "POST /permit-applications/${app_id}/reviews/${rev_fire}/veto"
              payload: { note: "Insufficient fire lanes" }
              as: DepartmentReviewer
              as_user_id: "FIRE"
            - call: "GET /permit-applications/${app_id}/route-segments/${seg_id}"
              payload: {}
              as: PermitOfficer
              captures: { seg_status: $.data.status }
          assert:
            - "PermitApplication.${app_id}.status == DENIED"
            - "RouteSegment.${seg_id}.status == RELEASED (DENIED branch side-effect)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: veto_denies_releases_frees_venue_depth3
        grounds:
          - state_machines.DepartmentReview.PENDING_to_VETOED
          - state_machines.PermitApplication.UNDER_REVIEW_to_DENIED
          - state_machines.RouteSegment.PLANNED_to_RELEASED
          - entities.Venue.fields.version
        distinguishing_aspect: |
          Depth-3 chain: veto mutates DepartmentReview->VETOED (link1), which
          triggers PermitApplication->DENIED (link2), which itself triggers each
          RouteSegment->RELEASED and Venue.version++ (link3) — each hop caused by
          the previous, originating from the veto transition.
        test_recipe:
          setup:
            - "A submitted app UNDER_REVIEW with one PLANNED segment; capture venue version after submit; then EMS vetoes."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V5", venue_type: "PARK", max_capacity: 6000, setup_buffer_minutes: 60 }
              as: PermitOfficer
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "Birch St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org E", contact_email: "e@x.com" }
              as: PermitOfficer
              captures: { app_user_id: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org E", venue_id: "${venue_id}", event_kind: "RALLY", expected_attendance: 3000, occupy_start: "2026-06-07T10:00:00Z", occupy_end: "2026-06-07T14:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { app_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/route-segments"
              payload: { closure_schedule_id: "${sched_id}", segment_label: "Birch 1-4", closure_start: "2026-06-07T09:00:00Z", closure_end: "2026-06-07T15:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { seg_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/submit-for-review"
              payload: { expected_venue_version: "${venue_v0}" }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: PermitOfficer
              captures: { venue_v_after_submit: $.data.version }
            - call: "GET /permit-applications/${app_id}/reviews"
              payload: {}
              as: PermitOfficer
              captures: { rev_ems: "$.data[2].id" }
          trigger:
            - call: "POST /permit-applications/${app_id}/reviews/${rev_ems}/veto"
              payload: { note: "No EMS staging space" }
              as: DepartmentReviewer
              as_user_id: "EMS"
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: PermitOfficer
              captures: { venue_v_after_veto: $.data.version }
          assert:
            - "PermitApplication.${app_id}.status == DENIED (link2)"
            - "RouteSegment.${seg_id}.status == RELEASED (link3)"
            - "Venue.${venue_id}.version == ${venue_v_after_submit} + 1 (link3 frees reservation)"

      - name: debrief_finalize_closes_reconciles_depth2
        grounds:
          - state_machines.CleanupDebrief.OPEN_to_FINALIZED
          - state_machines.PermitApplication.ISSUED_to_CLOSED
          - state_machines.Deposit.HELD_to_FORFEITED_PARTIAL
          - calculations.deposit_reconciliation
        distinguishing_aspect: |
          Depth-2 chain from a different trigger: debrief-finalize mutates
          CleanupDebrief->FINALIZED (link1), which triggers PermitApplication->CLOSED
          together with the Deposit reconciliation (link2) — originating from the
          debrief-finalize transition, a distinct propagation pattern from the veto cascade.
        test_recipe:
          setup:
            - "A fully issued MEDIUM app with HELD deposit 500, debrief opened with cleanup_charges 700 (exceeds deposit), ready to finalize."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PermitOfficer
            - call: "POST /venues"
              payload: { name: "V6", venue_type: "PLAZA", max_capacity: 5000, setup_buffer_minutes: 60 }
              as: PermitOfficer
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "Maple St", min_gap_minutes: 30 }
              as: PermitOfficer
