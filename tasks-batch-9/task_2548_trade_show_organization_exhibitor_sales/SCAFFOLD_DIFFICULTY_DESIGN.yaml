# ===========================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_2548 Trade Show Organization &
# Exhibitor Sales.  §1.8 test-targeting index for SCAFFOLD.yaml.
#
# Header conventions used by every test_recipe below:
#   * Every instance starts from an EMPTY database.  Nothing is shared between
#     instances; each setup_api_calls chain is self-contained.
#   * `as:` is the X-Role header.  `as_user_id:` is X-Role-Id when `as:` is the
#     entity_backed role Exhibitor (it MUST equal the Exhibitor.id being acted
#     for), and X-User-ID (opaque operator identity) for the four operator
#     roles; it is supplied for operator roles only where a segregation-of-
#     duties rule (validations priority 6, 7, 8) reads it.
#   * The logical clock starts at 2026-08-01T00:00:00Z; chains that depend on
#     "now" set it explicitly with POST /_clock/set_current_utc.
#   * Show.version is bumped by booth creation, publish-floor-plan, every
#     space-contract write and every transition, so each OCC call is preceded
#     by a GET /shows/{id} that captures the version it will send.  A literal
#     version would go stale silently.
#   * Every money / point / area literal in an `assert:` was produced by
#     executing the §1.3 formula with the constants declared in SCAFFOLD.yaml.
# ===========================================================================
scaffold_difficulty_design:

  # =========================================================================
  # RULE 1 — dual_variant_calc
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: service_order_advance_versus_floor_variant_divergence
        grounds:
          - calculations.service_order_line_total
          - entities.ServiceOrder.fields.rate_variant
          - entities.ServiceOrder.fields.line_total_cents
          - entities.Show.fields.advance_order_deadline
          - endpoints[POST /space-contracts/{id}/service-orders]
        distinguishing_aspect: |
          This instance's two variants live in the ServiceOrder / exhibitor-services domain and are
          selected by ONE datum, ordered_at against Show.advance_order_deadline: identical MATERIAL_HANDLING
          orders of 6 cwt on the same contract yield line_total_cents 42240 under ADVANCE and 78780 under
          FLOOR, a divergence of exactly 36540 cents produced by a 20% discount versus a 1.35 multiplier
          plus a 7500-cent expedite fee.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-15T00:00:00Z."
            - "VenueContract MCC / HALL_A EXECUTED with material_handling_rate_cents_per_cwt 8800 and advance_order_discount_pct 20."
            - "Show 'National Buyers Expo' in SPACE_SELECTION, move_in_start 2027-03-01, so advance_order_deadline is 2027-02-08."
            - "Exhibitor 'Nordic Furnishings' ACTIVE with one SIGNED SpaceContract on booth A100 (400 sqft), deposit 400000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "A100", width_ft: 20, depth_ft: 20, location_class: "CORNER", premium_zone: "MAIN_AISLE", max_height_ft: 16 }
              as: FloorManager
              captures: { b_a: $.data.id }
            - call: "POST /shows/${show_id}/publish-floor-plan"
              payload: {}
              as: ShowDirector
            - call: "POST /exhibitors"
              payload: { legal_name: "Nordic Furnishings", contact_email: "sales@nordic.example", consecutive_years: 6 }
              as: SalesRep
              captures: { ex1: $.data.id }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: ShowDirector
              captures: { show_v1: $.data.version }
            - call: "POST /space-contracts"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex1}", expected_show_version: "${show_v1}", requested_sqft: 400, premium_placement_requested: true, booth_ids: ["${b_a}"] }
              as: SalesRep
              captures: { sc1: $.data.id }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: ShowDirector
              captures: { show_v2: $.data.version }
            - call: "POST /space-contracts/${sc1}/sign"
              payload: { expected_show_version: "${show_v2}", deposit_paid_cents: 400000 }
              as: Exhibitor
              as_user_id: "${ex1}"
          trigger:
            - call: "POST /space-contracts/${sc1}/service-orders"
              payload: { service_type: "MATERIAL_HANDLING", quantity: 6, ordered_at: "2027-02-01T09:00:00Z" }
              as: Exhibitor
              as_user_id: "${ex1}"
              captures: { so_adv: $.data.id }
            - call: "POST /space-contracts/${sc1}/service-orders"
              payload: { service_type: "MATERIAL_HANDLING", quantity: 6, ordered_at: "2027-03-02T09:00:00Z" }
              as: Exhibitor
              as_user_id: "${ex1}"
              captures: { so_floor: $.data.id }
          assert:
            - "Show.${show_id}.advance_order_deadline == 2027-02-08"
            - "ServiceOrder.${so_adv}.rate_variant == ADVANCE"
            - "ServiceOrder.${so_adv}.billable_quantity == 6"
            - "ServiceOrder.${so_adv}.unit_rate_cents == 8800"
            - "ServiceOrder.${so_adv}.line_total_cents == 42240"
            - "ServiceOrder.${so_floor}.rate_variant == FLOOR"
            - "ServiceOrder.${so_floor}.unit_rate_cents == 8800"
            - "ServiceOrder.${so_floor}.line_total_cents == 78780"
            - "ServiceOrder.${so_floor}.line_total_cents - ServiceOrder.${so_adv}.line_total_cents == 36540"
            - "GET /space-contracts/${sc1}/service-orders returns exactly 2 rows, both with status SUBMITTED"

      - name: exhibitor_priority_points_provisional_versus_certified_divergence
        grounds:
          - calculations.exhibitor_priority_points
          - entities.Exhibitor.fields.provisional_priority_points
          - entities.Exhibitor.fields.certified_priority_points
          - state_machines.SpaceContract.OFFERED_to_SIGNED
          - state_machines.SpaceContract.SIGNED_to_CLOSED_OUT
        distinguishing_aspect: |
          This instance's two variants live in the Exhibitor / priority-points domain and diverge on
          ENTITY-SET MEMBERSHIP rather than on a rate card: while the show is open the 1000-sqft SIGNED
          contract counts 20 points toward PROVISIONAL only (520 vs 500), and after the show closes the
          same contract counts toward CERTIFIED only (500 vs 520) — the two variants swap sides across a
          single transition, which no single-variant calculation can exhibit.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-15T00:00:00Z."
            - "VenueContract MCC / HALL_A EXECUTED, committed_net_sqft_per_year 1200, attrition_allowance_pct 15."
            - "Show in SPACE_SELECTION with booths A100 (400 sqft CORNER/MAIN_AISLE) and B200 (600 sqft ISLAND/ENTRANCE)."
            - "Exhibitor 'Nordic Furnishings' carries ledger_points 500 from one posted adjustment and no other contract or deal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "A100", width_ft: 20, depth_ft: 20, location_class: "CORNER", premium_zone: "MAIN_AISLE", max_height_ft: 16 }
              as: FloorManager
              captures: { b_a: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "B200", width_ft: 30, depth_ft: 20, location_class: "ISLAND", premium_zone: "ENTRANCE", max_height_ft: 20 }
              as: FloorManager
              captures: { b_b: $.data.id }
            - call: "POST /shows/${show_id}/publish-floor-plan"
              payload: {}
              as: ShowDirector
            - call: "POST /exhibitors"
              payload: { legal_name: "Nordic Furnishings", contact_email: "sales@nordic.example", consecutive_years: 6 }
              as: SalesRep
              captures: { ex1: $.data.id }
            - call: "POST /exhibitors/${ex1}/priority-point-adjustments"
              payload: { points_delta: 500, reason: "Loyalty carry-over from the 2026 edition" }
              as: ShowDirector
            - call: "GET /shows/${show_id}"
              payload: {}
              as: ShowDirector
              captures: { show_v1: $.data.version }
            - call: "POST /space-contracts"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex1}", expected_show_version: "${show_v1}", requested_sqft: 1000, premium_placement_requested: true, booth_ids: ["${b_a}", "${b_b}"] }
              as: SalesRep
              captures: { sc1: $.data.id }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: ShowDirector
              captures: { show_v2: $.data.version }
          trigger:
            - call: "POST /space-contracts/${sc1}/sign"
              payload: { expected_show_version: "${show_v2}", deposit_paid_cents: 1100000 }
              as: Exhibitor
              as_user_id: "${ex1}"
            - call: "GET /exhibitors/${ex1}"
              payload: {}
              as: ShowDirector
            - call: "POST /shows/${show_id}/transition"
              payload: { target_status: "SELLING" }
              as: ShowDirector
            - call: "POST /shows/${show_id}/transition"
              payload: { target_status: "ON_SITE" }
              as: ShowDirector
            - call: "POST /shows/${show_id}/transition"
              payload: { target_status: "CLOSED" }
              as: ShowDirector
            - call: "GET /exhibitors/${ex1}"
              payload: {}
              as: ShowDirector
          assert:
            - "After the sign call: SpaceContract.${sc1}.points_awarded == 20"
            - "After the sign call: Exhibitor.${ex1}.space_points_provisional == 20"
            - "After the sign call: Exhibitor.${ex1}.provisional_priority_points == 520"
            - "After the sign call: Exhibitor.${ex1}.space_points_certified == 0"
            - "After the sign call: Exhibitor.${ex1}.certified_priority_points == 500"
            - "After the sign call: Exhibitor.${ex1}.priority_tier == SILVER"
            - "After the CLOSED transition: SpaceContract.${sc1}.status == CLOSED_OUT"
            - "After the CLOSED transition: Exhibitor.${ex1}.provisional_priority_points == 500"
            - "After the CLOSED transition: Exhibitor.${ex1}.certified_priority_points == 520"
            - "After the CLOSED transition: Exhibitor.${ex1}.ledger_points == 500 (unchanged by both variants)"

  # =========================================================================
  # RULE 2 — combinatorial_formula
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: booth_space_fee_three_input_multiplicative_grid_with_volume_tier
        grounds:
          - calculations.booth_space_fee
          - entities.SpaceContract.fields.space_fee_cents
          - entities.SpaceContract.fields.volume_tier_pct
          - entities.SpaceContract.fields.min_deposit_cents
          - endpoints[POST /space-contracts]
        distinguishing_aspect: |
          Mode (a) — three independent inputs (location_class, premium_zone and the CONTRACT-WIDE total
          sqft) combine multiplicatively per booth line and then again through a volume tier that no
          single booth can see: booth A100 alone prices 1556280, but inside a 1000-sqft two-booth
          contract the same booth prices 1478466 while B200 prices 2790791 for a total of 4269257 —
          changing only the third input (contract size) moves both lines.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-15T00:00:00Z."
            - "VenueContract MCC / HALL_A EXECUTED; Show in SPACE_SELECTION with base_rate_cents_per_sqft 3275."
            - "Booths A100 (20x20 CORNER MAIN_AISLE), B200 (30x20 ISLAND ENTRANCE) and C050 (10x20 INLINE NONE) all AVAILABLE."
            - "Exhibitors 'Nordic Furnishings' and 'Harbor Ceramics' both ACTIVE with no contracts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "A100", width_ft: 20, depth_ft: 20, location_class: "CORNER", premium_zone: "MAIN_AISLE", max_height_ft: 16 }
              as: FloorManager
              captures: { b_a: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "B200", width_ft: 30, depth_ft: 20, location_class: "ISLAND", premium_zone: "ENTRANCE", max_height_ft: 20 }
              as: FloorManager
              captures: { b_b: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "C050", width_ft: 10, depth_ft: 20, location_class: "INLINE", premium_zone: "NONE", max_height_ft: 12 }
              as: FloorManager
              captures: { b_c: $.data.id }
            - call: "POST /shows/${show_id}/publish-floor-plan"
              payload: {}
              as: ShowDirector
            - call: "POST /exhibitors"
              payload: { legal_name: "Nordic Furnishings", contact_email: "sales@nordic.example", consecutive_years: 6 }
              as: SalesRep
              captures: { ex1: $.data.id }
            - call: "POST /exhibitors"
              payload: { legal_name: "Harbor Ceramics", contact_email: "sales@harbor.example", consecutive_years: 2 }
              as: SalesRep
              captures: { ex2: $.data.id }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: ShowDirector
              captures: { show_v1: $.data.version }
          trigger:
            - call: "POST /space-contracts"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex1}", expected_show_version: "${show_v1}", requested_sqft: 1000, premium_placement_requested: true, booth_ids: ["${b_a}", "${b_b}"] }
              as: SalesRep
              captures: { sc_big: $.data.id }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: ShowDirector
              captures: { show_v2: $.data.version }
            - call: "POST /space-contracts"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex2}", expected_show_version: "${show_v2}", requested_sqft: 200, premium_placement_requested: false, booth_ids: ["${b_c}"] }
              as: SalesRep
              captures: { sc_small: $.data.id }
          assert:
            - "SpaceContract.${sc_big}.offered_net_sqft == 1000"
            - "SpaceContract.${sc_big}.volume_tier_pct == 5"
            - "SpaceContract.${sc_big}.space_fee_cents == 4269257"
            - "SpaceContract.${sc_big}.invoice_total_cents == 4269257"
            - "SpaceContract.${sc_big}.bundle_discount_pct == 0"
            - "SpaceContract.${sc_big}.min_deposit_cents == 1067314"
            - "SpaceContract.${sc_small}.offered_net_sqft == 200"
            - "SpaceContract.${sc_small}.volume_tier_pct == 0"
            - "SpaceContract.${sc_small}.space_fee_cents == 655000"
            - "SpaceContract.${sc_small}.min_deposit_cents == 163750"
            - "Booth.${b_a}.status == HELD and Booth.${b_b}.status == HELD and Booth.${b_c}.status == HELD"
            - "Show.${show_id}.held_net_sqft == 1200"

      - name: invoice_bundle_tier_reads_the_pre_discount_subtotal
        grounds:
          - calculations.space_contract_invoice_total
          - entities.SpaceContract.fields.sponsorship_attached_cents
          - entities.SpaceContract.fields.bundle_discount_pct
          - entities.SpaceContract.fields.invoice_total_cents
          - endpoints[POST /sponsorship-deals/{id}/sign]
        distinguishing_aspect: |
          Mode (c) — order dependence: the bundle tier is selected from the PRE-discount subtotal
          (1556280 space + 463720 sponsorship = 2020000, crossing the 2000000 tier at 2.5%), so the
          invoice is 1969500; selecting the tier from any post-discount figure would drop below
          2000000, fall to the 0% tier and return 2020000 instead.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-15T00:00:00Z."
            - "VenueContract MCC / HALL_A EXECUTED; Show in SPACE_SELECTION with booth A100 only."
            - "Exhibitor 'Nordic Furnishings' holds an OFFERED contract on A100 priced 1556280 with sponsorship_attached_cents 0."
            - "SponsorshipPackage ENTRY_ARCH on the show, list_price_cents 500000, price_floor_cents 400000, inventory_total 2, two obligation codes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "A100", width_ft: 20, depth_ft: 20, location_class: "CORNER", premium_zone: "MAIN_AISLE", max_height_ft: 16 }
              as: FloorManager
              captures: { b_a: $.data.id }
            - call: "POST /shows/${show_id}/sponsorship-packages"
              payload: { package_code: "ENTRY_ARCH", list_price_cents: 500000, price_floor_cents: 400000, inventory_total: 2, exclusivity_category: "OUTDOOR_FURNITURE", obligation_codes: ["LOGO_ON_ENTRY_ARCH", "BAG_INSERT"], priority_point_value: 12 }
              as: ShowDirector
              captures: { pkg_id: $.data.id }
            - call: "POST /shows/${show_id}/publish-floor-plan"
              payload: {}
              as: ShowDirector
            - call: "POST /exhibitors"
              payload: { legal_name: "Nordic Furnishings", contact_email: "sales@nordic.example", consecutive_years: 6 }
              as: SalesRep
              captures: { ex1: $.data.id }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: ShowDirector
              captures: { show_v1: $.data.version }
            - call: "POST /space-contracts"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex1}", expected_show_version: "${show_v1}", requested_sqft: 400, premium_placement_requested: true, booth_ids: ["${b_a}"] }
              as: SalesRep
              captures: { sc1: $.data.id }
            - call: "POST /sponsorship-packages/${pkg_id}/deals"
              payload: { exhibitor_id: "${ex1}", negotiated_price_cents: 463720 }
              as: SalesRep
              as_user_id: "u_sales_1"
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /sponsorship-deals/${deal_id}/sign"
              payload: {}
              as: ShowDirector
              as_user_id: "u_dir_1"
            - call: "GET /space-contracts/${sc1}"
              payload: {}
              as: SalesRep
          assert:
            - "SpaceContract.${sc1}.space_fee_cents == 1556280"
            - "SpaceContract.${sc1}.sponsorship_attached_cents == 463720"
            - "SpaceContract.${sc1}.bundle_discount_pct == 2.5"
            - "SpaceContract.${sc1}.bundle_discount_cents == 50500"
            - "SpaceContract.${sc1}.invoice_total_cents == 1969500"
            - "SpaceContract.${sc1}.min_deposit_cents == 389070"
            - "SpaceContract.${sc1}.status == OFFERED"
            - "SponsorshipDeal.${deal_id}.deal_status == SIGNED"
            - "SponsorshipDeal.${deal_id}.obligation_count == 2"

      - name: post_show_lead_quality_rounds_per_contract_then_averages
        grounds:
          - calculations.show_post_show_report
          - endpoints[GET /shows/{id}/post-show-report]
          - entities.Registration.fields.lead_scan_count
          - entities.LeadScan.fields.registration_id
        distinguishing_aspect: |
          Mode (b) — the SAME three scans produce 75 when each contract's percentage is rounded first and
          the rounded percentages are averaged (50 and 100 over two scored contracts), and 67 when the
          scans are pooled (2 qualified of 3); the scaffold pins the two-pass order, so an implementation
          that pools returns 67 and fails.
        test_recipe:
          setup:
            - "VenueContract MCC / HALL_A EXECUTED with committed_net_sqft_per_year 600 and attrition_allowance_pct 0."
            - "Show with three 200-sqft INLINE booths P100 / P200 / P300, one SIGNED contract per booth for three different exhibitors."
            - "Three registrations: r1 scores 85 QUALIFIED, r2 scores 5 REJECTED, r3 scores 69 QUALIFIED."
            - "Contract 1 scanned r1 and r2, contract 2 scanned r3, contract 3 scanned nothing; show then CLOSED."
