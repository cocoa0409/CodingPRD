      - name: exclusive_host_site_closed_interval_no_touch
        grounds:
          - validations[priority=24]
          - validations[priority=23]
          - state_machines.HostSite.APPROVED_to_EXPIRED
          - state_machines.KettleLocation.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Different interval semantics on a different resource: the HostSite exclusivity rule uses
          closed placement windows on a retailer key (retailer_name + store_number) where windows
          that merely touch at a single instant are rejected for EXCLUSIVE sites, so 11-01..11-30
          followed by 11-30..12-24 collides while 11-01..11-30 followed by 12-01..12-24 does not —
          the opposite tolerance from the half-open plus buffer rule on BellRinger.
