          assert:
            - "Campaign.${camp_id}.delivery_status == DELIVERING throughout every trigger step; it is never COMPLETED"
            - "Campaign.${camp_id}.billing_status == INVOICED after the withdrawal, having traversed UNBILLED -> ACCRUING -> PENDING_INVOICE -> INVOICED -> DISPUTED -> INVOICED"
