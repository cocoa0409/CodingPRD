      - name: overturn_cascade_dispute_notice_memo_shipment_customer
        grounds:
          - state_machines.Dispute.SUPPLEMENTED_to_RESOLVED
          - state_machines.CorrectionNotice.DISPUTED_to_OVERTURNED
          - calculations.credit_allocation_waterfall
          - entities.CreditMemo.fields.amount_cents
          - entities.Customer.fields.offender_strike_count
        distinguishing_aspect: |
          Resolving one dispute OVERTURNED cascades five levels: Dispute -> CorrectionNotice
          (OVERTURNED, credited_total_cents 34680) -> CreditMemo (30030 + 4500 + 150) -> Shipment
          (assessed_total_cents back to 26754, billing CREDITED, class_status CAPTURED, lines
          reverted) -> Customer (strike count 0, indices 0.00). Order matters: the credit is built
          from the FROZEN applied_delta_cents, so reverting the lines before pricing the memo
          yields a freight credit of 0.
