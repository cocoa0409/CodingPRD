      - name: broker_suspend_reinstate_branching
        grounds:
          - state_machines.Broker
          - state_machines.Broker.ACTIVE_to_SUSPENDED
          - state_machines.Broker.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Branching fork-join: Broker ACTIVE -> SUSPENDED -> ACTIVE is a
          revert loop distinct from the terminal TERMINATED branch reachable
          from either ACTIVE or SUSPENDED. Suspend additionally has a
          branching side-effect set on orders: DISPATCHED orders revert to
          READY_FOR_DISPATCH (clearing assignment) while IN_PROGRESS+ orders
          do not. Different entity than ValuationOrder.
        test_recipe:
          setup:
            - "Broker with one order in DISPATCHED and another in IN_PROGRESS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
