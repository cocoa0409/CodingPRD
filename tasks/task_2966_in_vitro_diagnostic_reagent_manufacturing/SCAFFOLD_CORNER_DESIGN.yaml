  # ===========================================================================
  - section: endpoints
    instances:

      - name: reference_data_endpoints_expose_the_full_crud_shape_and_the_declared_envelope
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_material_specifications
          - endpoints.GET_material_specifications_id
          - endpoints.GET_material_specifications
          - response_envelope
        distinguishing_aspect: "Every response — created, read, listed and failed — must carry the same meta block and a response_type that switches between object and array, while the list endpoint's two declared filters must be independently applicable. This is the one place that pins the envelope shape itself rather than any domain rule."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. Three MaterialSpecifications: a critical ANTIBODY, a non-critical ENZYME and a critical CALIBRATOR_MATERIAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "AB-EP-1", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY", "PURITY"], is_critical: true }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_ab: $.data.id, ms_ab_code: $.data.material_code, ms_ab_created: $.data.created_at }
            - call: "POST /material-specifications"
              payload: { material_code: "EZ-EP-1", material_type: "ENZYME", potency_min_pct: 85.0, potency_max_pct: 115.0, endotoxin_max_eu_per_ml: 5.0, purity_min_pct: 90.0, required_test_codes: ["POTENCY"], is_critical: false }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_ez: $.data.id }
            - call: "POST /material-specifications"
              payload: { material_code: "CAL-EP-1", material_type: "CALIBRATOR_MATERIAL", potency_min_pct: 95.0, potency_max_pct: 105.0, endotoxin_max_eu_per_ml: 1.0, purity_min_pct: 98.0, required_test_codes: ["IDENTITY"], is_critical: true }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_cal: $.data.id }
          trigger:
            - call: "GET /material-specifications/${ms_ab}"
              payload: {}
              as: QCAnalyst
              captures: { read_code: $.data.material_code, read_type: $.data.material_type, read_codes: $.data.required_test_codes, read_version: $.data.version }
            - call: "GET /material-specifications"
              payload: {}
              as: ProductionOperator
              captures: { list_first: "$.data[0].material_code" }
            - call: "GET /material-specifications?material_type=ENZYME"
              payload: {}
              as: ProductionOperator
              captures: { enzyme_first: "$.data[0].material_code" }
            - call: "GET /material-specifications?is_critical=true"
              payload: {}
              as: ProductionOperator
              captures: { critical_first: "$.data[0].material_code" }
            - call: "GET /material-specifications?material_type=ANTIBODY&is_critical=false"
              payload: {}
              as: ProductionOperator
              captures: { empty_first_page: $.data }
            - call: "GET /material-specifications/00000000-0000-0000-0000-0000000000d1"
              payload: {}
              as: ProductionOperator
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "the create returns HTTP 201 with response_type object and echoes every declared field including the array-valued required_test_codes"
            - "the read returns HTTP 200 with the same material_code, material_type and required_test_codes and version 1"
            - "the unfiltered list returns response_type array with total_count 3, limit 10, offset 0 and has_more false"
            - "material_type=ENZYME returns exactly one row (EZ-EP-1) and is_critical=true returns exactly two rows (AB-EP-1 and CAL-EP-1), so the two filters work independently"
            - "combining material_type=ANTIBODY with is_critical=false returns an empty data array with total_count 0 and has_more false, not a 404"
            - "every response — created, read, listed and the 404 — carries meta.api_request_id and meta.api_request_timestamp, and the 404 body carries response_type error with data.error_id and data.message"

      - name: filtered_lists_narrow_the_same_collection_along_each_declared_dimension
        claim_type: Standard CRUD
        grounds:
          - endpoints.GET_reagent_lots
          - endpoints.GET_test_results
        distinguishing_aspect: "Both list endpoints declare several optional filters that must AND together and must never be silently ignored: reagent lots filter along the two independent state dimensions at once, and test results filter by subject_type plus a subject id, which is the query a reviewer runs to assemble a lot history."
