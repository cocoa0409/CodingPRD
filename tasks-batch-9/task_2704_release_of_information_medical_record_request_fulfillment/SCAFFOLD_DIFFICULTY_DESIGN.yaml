# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_2704
# 9 rule_ids, 24 instances. Every numeric assert below was computed by running
# the §1.3 formulas as code against the literals pinned in each setup.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: invoice_variant_divergence_third_party_retail_vs_patient_access_cost_based
        grounds:
          - calculations.invoice_line_build
          - calculations.invoice_cap_application
          - entities.Invoice.fields.variant
          - entities.Request.fields.access_basis
        distinguishing_aspect: >
          Two requests on the same patient with an identical 62-page billable
          ledger and identical SECURE_PORTAL delivery price at 3651 cents under
          THIRD_PARTY_RETAIL and 620 cents under PATIENT_ACCESS_COST_BASED,
          because the retail variant adds a clerical base fee, two page tiers and
          a certification fee that the cost-based variant does not have at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CA fee rule; one facility; one patient."
            - "Request A: ATTORNEY requester on a valid third-party authorization, SECURE_PORTAL, certification requested."
            - "Request B: the patient herself under PATIENT_RIGHT_OF_ACCESS, SECURE_PORTAL, certification requested (and ignored by the variant)."
            - "Both requests reach RELEASE_READY with billable_page_count == 62 (a 40-page general segment plus a 22-page behavioral-health segment included by the reviewer)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roi/state-fee-rules"
              payload: { state_code: "CA", base_retrieval_fee_cents: 1500, tier1_page_limit: 25, tier1_per_page_millicents: 27500, tier2_per_page_millicents: 12500, patient_access_per_page_millicents: 10000, certification_fee_cents: 1000, media_fee_cents: 500, postage_per_delivery_cents: 850, electronic_delivery_total_cap_cents: 6500, total_fee_cap_cents: 12000, patient_access_deadline_days: 15, third_party_deadline_days: 30, extension_days: 15, penalty_per_day_cents: 2500, penalty_cap_cents: 25000, fee_forfeiture_on_late: true }
              as: PlatformAdmin
              captures: { rule_ca: $.data.id }
            - call: "POST /roi/facilities"
              payload: { name: "Bay Regional Health", state_fee_rule_id: "${rule_ca}", legacy_archive_enabled: true, legacy_retrieval_surcharge_cents: 2000, legacy_gateway_job_minutes: 30, legacy_gateway_buffer_minutes: 10 }
              as: PlatformAdmin
              captures: { fac: $.data.id }
            - call: "POST /roi/patients"
              payload: { facility_id: "${fac}", mrn: "MRN-1001", full_name: "Dana Reyes", date_of_birth: "1984-03-11" }
              as: FacilityAdmin
              as_user_id: "${fac}"
              captures: { pat: $.data.id }
            - call: "POST /roi/requesters"
              payload: { requester_type: "ATTORNEY", contact_email: "counsel@firm.example", organization_name: "Firm LLP", credential_number: "BAR-55", signature_on_file: true }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { atty: $.data.id }
            - call: "POST /roi/requesters"
              payload: { requester_type: "PATIENT", contact_email: "dana@example.com", patient_id: "${pat}", signature_on_file: true }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { self_req: $.data.id }
            - call: "GET /roi/patients/${pat}"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { pat_v: $.data.version }
            - call: "POST /roi/authorizations"
              payload: { patient_id: "${pat}", requester_id: "${atty}", expected_patient_version: "${pat_v}", signed_at: "2026-08-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z", scope_categories: ["GENERAL_MEDICAL", "BEHAVIORAL_HEALTH"], sensitive_categories_authorized: ["BEHAVIORAL_HEALTH"], part2_redisclosure_prohibition_ack: false, designated_recipient_endpoint: "counsel@firm.example", signature_verified: true }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { auth: $.data.id }
            - call: "POST /roi/requests"
              payload: { facility_id: "${fac}", patient_id: "${pat}", requester_id: "${atty}", authorization_id: "${auth}", access_basis: "THIRD_PARTY_AUTHORIZATION", requested_categories: ["GENERAL_MEDICAL", "BEHAVIORAL_HEALTH"], date_range_start: "2024-01-01", date_range_end: "2025-12-31", delivery_format: "SECURE_PORTAL", certification_requested: true }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { rq_a: $.data.id }
            - call: "POST /roi/requests/${rq_a}/intake-decision"
              payload: { decision: "ACCEPT" }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
            - call: "POST /roi/record-segments"
              payload: { request_id: "${rq_a}", source_system: "EHR_CURRENT", category: "GENERAL_MEDICAL" }
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
              captures: { seg_a1: $.data.id }
            - call: "POST /roi/record-segments"
              payload: { request_id: "${rq_a}", source_system: "EHR_CURRENT", category: "BEHAVIORAL_HEALTH" }
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
              captures: { seg_a2: $.data.id }
            - call: "POST /roi/record-segments/${seg_a1}/disposition"
              payload: { disposition: "RETRIEVED", page_count: 40 }
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /roi/record-segments/${seg_a2}/disposition"
              payload: { disposition: "RETRIEVED", page_count: 22 }
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /roi/requests/${rq_a}/complete-compilation"
              payload: {}
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /roi/requests/${rq_a}/sensitive-review"
              payload: { segment_decisions: [{ record_segment_id: "${seg_a2}", decision: "INCLUDE", redaction_required: false }] }
              as: ReleaseReviewer
              as_user_id: "u-review-1"
            - call: "POST /roi/requests"
              payload: { facility_id: "${fac}", patient_id: "${pat}", requester_id: "${self_req}", access_basis: "PATIENT_RIGHT_OF_ACCESS", requested_categories: ["GENERAL_MEDICAL", "BEHAVIORAL_HEALTH"], date_range_start: "2024-01-01", date_range_end: "2025-12-31", delivery_format: "SECURE_PORTAL", certification_requested: true }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { rq_b: $.data.id }
            - call: "POST /roi/requests/${rq_b}/intake-decision"
              payload: { decision: "ACCEPT" }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
            - call: "POST /roi/record-segments"
              payload: { request_id: "${rq_b}", source_system: "EHR_CURRENT", category: "GENERAL_MEDICAL" }
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
              captures: { seg_b1: $.data.id }
            - call: "POST /roi/record-segments"
              payload: { request_id: "${rq_b}", source_system: "EHR_CURRENT", category: "BEHAVIORAL_HEALTH" }
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
              captures: { seg_b2: $.data.id }
            - call: "POST /roi/record-segments/${seg_b1}/disposition"
              payload: { disposition: "RETRIEVED", page_count: 40 }
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /roi/record-segments/${seg_b2}/disposition"
              payload: { disposition: "RETRIEVED", page_count: 22 }
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /roi/requests/${rq_b}/complete-compilation"
              payload: {}
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /roi/requests/${rq_b}/sensitive-review"
              payload: { segment_decisions: [{ record_segment_id: "${seg_b2}", decision: "INCLUDE", redaction_required: false }] }
              as: ReleaseReviewer
              as_user_id: "u-review-1"
          trigger:
            - call: "GET /roi/requests/${rq_a}"
              payload: {}
              as: BillingClerk
              as_user_id: "u-bill-1"
              captures: { rq_a_v: $.data.version }
            - call: "POST /roi/invoices"
              payload: { request_id: "${rq_a}", expected_request_version: "${rq_a_v}" }
              as: BillingClerk
              as_user_id: "u-bill-1"
              captures: { inv_a: $.data.id }
            - call: "GET /roi/requests/${rq_b}"
              payload: {}
              as: BillingClerk
              as_user_id: "u-bill-1"
              captures: { rq_b_v: $.data.version }
            - call: "POST /roi/invoices"
              payload: { request_id: "${rq_b}", expected_request_version: "${rq_b_v}" }
              as: BillingClerk
              as_user_id: "u-bill-1"
              captures: { inv_b: $.data.id }
          assert:
            - "Request.${rq_a}.billable_page_count == 62 and Request.${rq_b}.billable_page_count == 62"
            - "Invoice.${inv_a}.variant == THIRD_PARTY_RETAIL"
            - "Invoice.${inv_a}.subtotal_cents == 3651"
            - "Invoice.${inv_a}.cap_adjustment_cents == 0 and Invoice.${inv_a}.applicable_cap_cents == 6500"
            - "Invoice.${inv_a}.amount_due_cents == 3651"
            - "Invoice.${inv_b}.variant == PATIENT_ACCESS_COST_BASED"
            - "Invoice.${inv_b}.subtotal_cents == 620"
            - "Invoice.${inv_b}.amount_due_cents == 620"
            - "Invoice.${inv_a}.amount_due_cents - Invoice.${inv_b}.amount_due_cents == 3031"
            - "GET /roi/invoices/${inv_b}/lines returns exactly 1 line: sequence 1, line_type PER_PAGE_FLAT, quantity 62, amount_cents 620 — no BASE_RETRIEVAL and no CERTIFICATION line despite certification_requested == true"

      - name: turnaround_penalty_variant_divergence_strict_vs_safe_harbor
        grounds:
          - calculations.turnaround_penalty
          - entities.Request.fields.penalty_exposure_cents
          - entities.Request.fields.safe_harbor_penalty_cents
          - state_machines.Request.RELEASE_READY_to_RELEASED
        distinguishing_aspect: >
          Lateness, not pricing: the same single release instant 2026-09-05T06:00:00Z
          against the same deadline 2026-08-31T00:00:00Z yields 15000 cents under
          STATUTORY_STRICT (6 raw elapsed days, no grace) and 5000 cents under
          CONTRACTUAL_SAFE_HARBOR (4 UTC business days minus 2 forgiven), a 10000
          cent divergence carried on two separate persisted fields of Request.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CA fee rule; facility; patient; ATTORNEY requester on a valid authorization signed 2026-08-01T00:00:00Z."
            - "Third-party PAPER_MAIL request with certification, 62 billable pages, at RELEASE_READY; statutory_due_at == 2026-08-31T00:00:00Z (a Monday)."
            - "Invoice priced at 4501 cents while the request is still on time, issued and paid in full, so the release gate is open."
            - "Clock advanced to 2026-09-05T06:00:00Z (a Saturday) before the release."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roi/state-fee-rules"
