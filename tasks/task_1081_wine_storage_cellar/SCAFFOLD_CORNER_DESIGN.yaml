# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1-§1.7 not already covered by §1.8. Same reachability /
# literal-lock / §1.5 discipline as §1.8.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: member_create_returns_pending_zero_wallet
        claim_type: creation
        grounds: [entities.Member.fields.status, entities.Member.fields.wallet_balance_cents]
        distinguishing_aspect: "POST /members returns 201 with status PENDING and wallet_balance_cents 0 (system defaults, input ignored)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { full_name: "Ada New", email: "ada@x.com", membership_tier: "STANDARD" }
              as: CellarManager
              captures: { st: $.data.status, wallet: $.data.wallet_balance_cents }
          assert:
            - "st == PENDING"
            - "wallet == 0"

      - name: member_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /members/{id} on an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CellarManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: bottle_create_missing_required_field_returns_validation
        claim_type: required_fields
        grounds: [entities.Bottle.fields.wine_name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /bottles omitting required wine_name returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["ACTIVE member with an ASSIGNED locker."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Bud Field", email: "bud@x.com", membership_tier: "STANDARD" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "CN-1", size_tier: "SMALL", climate_zone: "RED", capacity_bottles: 2 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
          trigger:
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", vintage_year: 2015, varietal: "Merlot", format_ml: 750, drink_window_start_year: 2018, drink_window_end_year: 2035 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: member_read_unknown_role_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "A request whose X-User-Role is not a known role returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Ghost
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED"

  - section: state_machines
    instances:
      - name: activate_already_active_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Member.PENDING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /members/{id}/activate on an already-ACTIVE member returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["One ACTIVE member."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Cal Twice", email: "cal@x.com", membership_tier: "STANDARD" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
          trigger:
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: approve_after_reject_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.MovementRequest.REQUESTED_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /movement-requests/{id}/approve on a REJECTED request returns ERR_INVALID_STATE (approve requires REQUESTED)."
        test_recipe:
          setup: ["ACTIVE member, ASSIGNED locker, a REJECTED INTAKE request."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Dot Rej", email: "dot@x.com", membership_tier: "RESERVE" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "CN-2", size_tier: "LARGE", climate_zone: "RED", capacity_bottles: 5 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /movement-requests"
              payload: { member_id: "${m_id}", locker_id: "${lk_id}", request_type: "INTAKE", quantity: 2 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { mr_id: $.data.id }
            - call: "POST /movement-requests/${mr_id}/reject"
              payload: {}
              as: CellarManager
          trigger:
            - call: "POST /movement-requests/${mr_id}/approve"
              payload: {}
              as: CellarManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: release_non_empty_locker_returns_not_empty
        claim_type: precondition_enforcement
        grounds: [state_machines.Locker.ASSIGNED_to_AVAILABLE, "errors[ERR_LOCKER_NOT_EMPTY]"]
        distinguishing_aspect: "POST /lockers/{id}/release with occupied_bottles 1 returns ERR_LOCKER_NOT_EMPTY."
        test_recipe:
          setup: ["ASSIGNED locker holding one STORED bottle."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Eve Hold", email: "eve@x.com", membership_tier: "STANDARD" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "CN-3", size_tier: "SMALL", climate_zone: "RED", capacity_bottles: 2 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Stay Put", vintage_year: 2015, varietal: "Merlot", format_ml: 750, drink_window_start_year: 2018, drink_window_end_year: 2035 }
              as: CellarMember
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /lockers/${lk_id}/release"
              payload: {}
              as: CellarManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_LOCKER_NOT_EMPTY"

  - section: calculations
    instances:
      - name: drink_window_past_peak_computed
        claim_type: computed_field
        grounds: [calculations.drink_window_status, entities.Bottle.fields.drink_window_status]
        distinguishing_aspect: "A bottle with drink_window_end_year 2020 read at clock year 2026 has drink_window_status PAST_PEAK (year > end_year)."
        test_recipe:
          setup: ["ASSIGNED locker holding a STORED bottle whose drink_window_end_year is 2020."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Fay Old", email: "fay@x.com", membership_tier: "STANDARD" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "CN-4", size_tier: "SMALL", climate_zone: "RED", capacity_bottles: 2 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Over Hill", vintage_year: 2005, varietal: "Cabernet", format_ml: 750, drink_window_start_year: 2010, drink_window_end_year: 2020 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "GET /bottles/${b_id}"
              payload: {}
              as: CellarManager
              captures: { dws: $.data.drink_window_status }
          assert:
            - "dws == PAST_PEAK"

      - name: storage_fee_minimum_floor_applied
        claim_type: computed_field
        grounds: [calculations.storage_fee, entities.Locker.fields.monthly_fee_cents]
        distinguishing_aspect: "A SMALL/RED locker (base 2000 x 1.00 = 2000) clamps up to MIN_MONTHLY_FEE_CENTS so monthly_fee_cents == 2500."
        test_recipe:
          setup: ["A fresh SMALL/RED locker."]
          setup_api_calls: []
          trigger:
            - call: "POST /lockers"
              payload: { label: "CN-5", size_tier: "SMALL", climate_zone: "RED", capacity_bottles: 3 }
              as: CellarManager
              captures: { fee: $.data.monthly_fee_cents }
          assert:
            - "fee == 2500"

  - section: errors
    instances:
      - name: accept_below_reserve_returns_offer_below_reserve
        claim_type: violation_to_error
        grounds: ["errors[ERR_OFFER_BELOW_RESERVE]", state_machines.Consignment.OFFERED_to_ACCEPTED]
        distinguishing_aspect: "POST /consignments/{id}/accept when offer_price 1000000 < reserve 3000000 returns ERR_OFFER_BELOW_RESERVE (422)."
        test_recipe:
          setup: ["A DOCUMENTED STORED bottle listed and OFFERED at 1000000 with reserve 3000000."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Gus Low", email: "gus@x.com", membership_tier: "PREMIUM" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "CN-6", size_tier: "MEDIUM", climate_zone: "RED", capacity_bottles: 3 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Barolo", vintage_year: 2013, varietal: "Nebbiolo", format_ml: 750, drink_window_start_year: 2018, drink_window_end_year: 2045, provenance_status: "DOCUMENTED" }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id }
            - call: "POST /consignments"
              payload: { bottle_id: "${b_id}", reserve_price_cents: 3000000 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { cn_id: $.data.id }
            - call: "POST /consignments/${cn_id}/list"
              payload: {}
              as: AuctionBroker
            - call: "POST /consignments/${cn_id}/offer"
              payload: { offer_price_cents: 1000000 }
              as: AuctionBroker
          trigger:
            - call: "POST /consignments/${cn_id}/accept"
              payload: {}
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OFFER_BELOW_RESERVE"

      - name: bind_underfunded_returns_insufficient_funds
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_FUNDS]", state_machines.InsurancePolicy.QUOTED_to_BOUND, calculations.member_wallet_balance]
        distinguishing_aspect: "Binding a FULL policy with premium 105000 (bottle appraised 7000000) from a zero wallet would drop wallet to -105000, below WALLET_FLOOR_CENTS -100000; ERR_INSUFFICIENT_FUNDS."
        test_recipe:
          setup: ["Member (wallet 0) owns a STORED DOCUMENTED bottle with FINALIZED appraisal 7000000; QUOTED FULL policy premium 105000."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Hy Rich", email: "hy@x.com", membership_tier: "PREMIUM" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "CN-7", size_tier: "MEDIUM", climate_zone: "RED", capacity_bottles: 3 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Grand Cru", vintage_year: 2010, varietal: "Cabernet", format_ml: 750, drink_window_start_year: 2015, drink_window_end_year: 2045, provenance_status: "DOCUMENTED" }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /appraisals"
              payload: { bottle_id: "${b_id}", method: "MARKET_COMPARABLE", base_value_cents: 7000000 }
              as: Appraiser
              as_user_id: "appraiser-alpha"
              captures: { ap_id: $.data.id }
            - call: "POST /appraisals/${ap_id}/finalize"
              payload: { expected_bottle_version: "${b_v}" }
              as: Appraiser
              as_user_id: "appraiser-beta"
            - call: "POST /insurance-policies"
              payload: { member_id: "${m_id}", coverage_tier: "FULL", covered_bottle_ids: ["${b_id}"] }
              as: InsuranceAgent
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /insurance-policies/${pol_id}/bind"
              payload: {}
              as: InsuranceAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INSUFFICIENT_FUNDS"

      - name: close_member_with_negative_wallet_returns_outstanding_balance
        claim_type: violation_to_error
        grounds: ["errors[ERR_OUTSTANDING_BALANCE]", state_machines.Member.ACTIVE_to_CLOSED]
        distinguishing_aspect: "Closing a member whose wallet_balance_cents is -5000 (a manual DEBIT) and who holds no locker returns ERR_OUTSTANDING_BALANCE."
        test_recipe:
          setup: ["ACTIVE member with no lockers and a DEBIT of 5000 (wallet -5000)."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ida Owes", email: "ida@x.com", membership_tier: "STANDARD" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /members/${m_id}/ledger-adjustments"
              payload: { entry_type: "DEBIT", amount_cents: 5000, reason: "late fee" }
              as: CellarManager
          trigger:
            - call: "POST /members/${m_id}/close"
              payload: {}
              as: CellarManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OUTSTANDING_BALANCE"

      - name: close_member_holding_locker_returns_has_active_lockers
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEMBER_HAS_ACTIVE_LOCKERS]", state_machines.Member.ACTIVE_to_CLOSED]
        distinguishing_aspect: "Closing an ACTIVE member who still holds an ASSIGNED locker (wallet 0) returns ERR_MEMBER_HAS_ACTIVE_LOCKERS."
        test_recipe:
          setup: ["ACTIVE member holding one ASSIGNED empty locker, wallet 0."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Jax Keep", email: "jax@x.com", membership_tier: "RESERVE" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "CN-8", size_tier: "SMALL", climate_zone: "RED", capacity_bottles: 2 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
          trigger:
            - call: "POST /members/${m_id}/close"
              payload: {}
              as: CellarManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MEMBER_HAS_ACTIVE_LOCKERS"

      - name: delivery_of_stored_bottle_returns_not_withdrawn
        claim_type: violation_to_error
        grounds: ["errors[ERR_DELIVERY_BOTTLE_NOT_WITHDRAWN]", "validations[priority=8]"]
        distinguishing_aspect: "POST /delivery-orders including a STORED (not WITHDRAWN) bottle returns ERR_DELIVERY_BOTTLE_NOT_WITHDRAWN."
        test_recipe:
          setup: ["Member owns a STORED bottle (never withdrawn)."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ken Ship", email: "ken@x.com", membership_tier: "PREMIUM" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "CN-9", size_tier: "MEDIUM", climate_zone: "WHITE", capacity_bottles: 3 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Chablis", vintage_year: 2019, varietal: "Chardonnay", format_ml: 750, drink_window_start_year: 2020, drink_window_end_year: 2030 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /delivery-orders"
              payload: { member_id: "${m_id}", bottle_ids: ["${b_id}"], courier_ref: "CX-9", slot_start: "2026-06-02T09:00:00Z", slot_end: "2026-06-02T10:00:00Z" }
              as: CellarManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DELIVERY_BOTTLE_NOT_WITHDRAWN"

      - name: finalize_by_creator_returns_segregation_of_duties
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", "validations[priority=6]"]
        distinguishing_aspect: "POST /appraisals/{id}/finalize by the same X-User-ID (appraiser-alpha) that created the appraisal returns ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup: ["A STORED bottle with a DRAFT appraisal created by appraiser-alpha."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Liv Sole", email: "liv@x.com", membership_tier: "PREMIUM" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "CN-10", size_tier: "SMALL", climate_zone: "RED", capacity_bottles: 2 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Solo Cru", vintage_year: 2014, varietal: "Merlot", format_ml: 750, drink_window_start_year: 2018, drink_window_end_year: 2040, provenance_status: "DOCUMENTED" }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /appraisals"
              payload: { bottle_id: "${b_id}", method: "MARKET_COMPARABLE", base_value_cents: 4000000 }
              as: Appraiser
              as_user_id: "appraiser-alpha"
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /appraisals/${ap_id}/finalize"
              payload: { expected_bottle_version: "${b_v}" }
              as: Appraiser
              as_user_id: "appraiser-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES"

      - name: policy_covering_unowned_bottle_returns_not_owned
        claim_type: violation_to_error
        grounds: ["errors[ERR_BOTTLE_NOT_OWNED]", entities.InsurancePolicy.fields.covered_bottle_ids]
        distinguishing_aspect: "POST /insurance-policies for member B whose covered_bottle_ids include a bottle owned by member A returns ERR_BOTTLE_NOT_OWNED."
        test_recipe:
          setup: ["Member A owns a bottle; member B (active) is the policyholder."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Mia A", email: "mia@x.com", membership_tier: "PREMIUM" }
              as: CellarManager
              captures: { ma_id: $.data.id }
            - call: "POST /members/${ma_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "CN-11", size_tier: "SMALL", climate_zone: "RED", capacity_bottles: 2 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${ma_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "A Wine", vintage_year: 2015, varietal: "Merlot", format_ml: 750, drink_window_start_year: 2018, drink_window_end_year: 2040 }
              as: CellarMember
              as_user_id: "${ma_id}"
              captures: { b_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Ned B", email: "nedb@x.com", membership_tier: "PREMIUM" }
              as: CellarManager
              captures: { mb_id: $.data.id }
            - call: "POST /members/${mb_id}/activate"
              payload: {}
              as: CellarManager
          trigger:
            - call: "POST /insurance-policies"
              payload: { member_id: "${mb_id}", coverage_tier: "FULL", covered_bottle_ids: ["${b_id}"] }
              as: InsuranceAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_BOTTLE_NOT_OWNED"

      - name: approve_movement_on_maintenance_locker_returns_in_maintenance
        claim_type: violation_to_error
        grounds: ["errors[ERR_LOCKER_IN_MAINTENANCE]", state_machines.MovementRequest.REQUESTED_to_APPROVED, state_machines.Locker.ASSIGNED_to_MAINTENANCE]
        distinguishing_aspect: "Approving a movement request whose locker is in MAINTENANCE (an active maintenance window) returns ERR_LOCKER_IN_MAINTENANCE."
        test_recipe:
          setup: ["ACTIVE member, ASSIGNED locker with a REQUESTED INTAKE request, then an ACTIVE maintenance window puts the locker in MAINTENANCE."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Oki Fix", email: "oki@x.com", membership_tier: "RESERVE" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
