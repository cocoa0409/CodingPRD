          setup:
            - "Logical clock at 2026-06-15T00:00:00Z; one ACTIVE carrier licensed in TX with cap 50."
            - "Two identical non-tribal VOICE enrollments at two distinct dwellings, both starting 2026-06-15, so each earns 2026-06-15..2026-06-30 = 16 of June's 30 days: round_half_up(925*16/30) = 493 per line and 986 for the claim."
            - "Clock moved to 2026-07-02T00:00:00Z; the claim is filed and auditor AUD-1 draws the whole pool of 2."
            - "Both enrollments have audit_risk_score 0 and the same benefit_start_date, so created_at ASC makes rank 1 the first-created enrollment."
