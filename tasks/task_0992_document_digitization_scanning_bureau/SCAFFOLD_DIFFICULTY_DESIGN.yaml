  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: batch_qa_rework_cycle_loop
        grounds:
          - state_machines.Batch.QA_to_SCANNING
          - state_machines.Batch.SCANNING_to_QA
          - state_machines.Document.QA_FAILED_to_SCANNED
          - entities.Batch.fields.rework_cycle_count
        distinguishing_aspect: |
          Batch machine is cyclic: QA -> SCANNING -> QA -> INDEXING with a
          rework loop that increments rework_cycle_count and re-scans the
          QA_FAILED document (scanned_pages accumulates to 200 produced pages
          while billable_scanned_pages stays at 100 count-once pages).
        test_recipe:
          setup:
            - "Client + STANDARD agreement; batch with one 100-page document d1"
            - "d1 scanned and committed; qa-review marks d1 QA_FAILED; batch submitted to QA"
          setup_api_calls:
