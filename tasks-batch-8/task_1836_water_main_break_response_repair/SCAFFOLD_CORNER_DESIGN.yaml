              captures: { err: $.data.error_id }
            - call: "POST /damage-claims/${cl}/approve"
              payload: { approved_amount_cents: 100000 }
              as: ClaimsAdjuster
              captures: { st: $.data.claim_status }
          assert:
            - "Approve 100001 > claimed 100000 returns error_id ERR_AMOUNT_EXCEEDS_CLAIMED (http 409)"
            - "Approve exactly 100000 succeeds: claim_status == APPROVED"

      - name: duplicate_active_work_order_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_ACTIVE_WORK_ORDER]"]
        distinguishing_aspect: "A break with a DRAFT work order rejects a second creation ERR_DUPLICATE_ACTIVE_WORK_ORDER; after cancellation a new one is accepted."
        test_recipe:
          setup: ["Confirmed break; work order W1 in DRAFT"]
