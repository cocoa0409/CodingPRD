        resource: LandApplicationSite scheduling window
        interval_semantics: half-open [window_start, window_end)
        grounds:
          - validations.priority_42_ERR_SITE_WINDOW_CONFLICT
          - entities.ApplicationEvent.fields.window_start
          - entities.ApplicationEvent.fields.window_end
