            - { call: "POST /api/harvest-lots/${lot_id}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/finish-drying", payload: { dried_lbs: 3261 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/pellet-lots", payload: { source_lot_ids: ["${lot_id}"], storage_room: "R1" }, as: FarmManager, captures: { pellet_id: $.data.id } }
            - { call: "POST /api/contracts", payload: { brewery_name: "BrewA", variety: "CASCADE", term_start_year: 2026, term_end_year: 2028, annual_volume_lbs: 1000, base_price_cents_per_lb: 500, alpha_floor_pct: 12.0, alpha_premium_cents_per_point: 40, alpha_discount_cents_per_point: 60 }, as: ContractManager, captures: { c1: $.data.id } }
            - { call: "POST /api/contracts", payload: { brewery_name: "BrewB", variety: "CASCADE", term_start_year: 2026, term_end_year: 2028, annual_volume_lbs: 3000, base_price_cents_per_lb: 500, alpha_floor_pct: 12.0, alpha_premium_cents_per_point: 40, alpha_discount_cents_per_point: 60 }, as: ContractManager, captures: { c2: $.data.id } }
            - { call: "POST /api/contracts/${c1}/activate", payload: {}, as: ContractManager }
            - { call: "POST /api/contracts/${c2}/activate", payload: {}, as: ContractManager }
