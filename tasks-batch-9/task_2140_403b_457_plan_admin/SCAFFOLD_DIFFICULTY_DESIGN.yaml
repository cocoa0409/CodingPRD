  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: universal_availability_hours_boundary_at_twenty_and_one_thousand
        grounds:
          - calculations.eligibility_determination
          - entities.Participant.fields.scheduled_hours_per_week
          - entities.Participant.fields.prior_year_hours_worked
          - endpoints[POST /plan-admin/eligibility-determinations]
        distinguishing_aspect: |
          Boundary on the hours metric, reached through POST /plan-admin/eligibility-determinations:
          the part-time exclusion needs scheduled_hours_per_week strictly below 20 AND
          prior_year_hours_worked strictly below 1000, so exactly 20.0 hours is ELIGIBLE,
          19.5 hours with 900 prior hours is EXCLUDED_LESS_THAN_20_HOURS, and 19.5 hours
          with exactly 1000 prior hours is ELIGIBLE again.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A PUBLIC_SCHOOL employer with an ACTIVE PLAN_403B plan, so nondiscrimination_regime is UA_ONLY and universal availability applies."
            - "Three participants that differ only in scheduled_hours_per_week and prior_year_hours_worked: (20.0, 900), (19.5, 900) and (19.5, 1000)."
            - "No universal availability notice has been recorded, so every determination should also report notice_status MISSING."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { p403_id: $.data.id }
            - call: "POST /plan-admin/plans/${p403_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/participants"
              payload: { employer_id: "${emp_id}", full_name: "Edge Twenty", date_of_birth: "1985-04-04", hire_date: "2020-01-01", scheduled_hours_per_week: 20, prior_year_hours_worked: 900, includible_compensation_cents: 3000000, years_of_service: 6 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { pe_id: $.data.id }
            - call: "POST /plan-admin/participants"
              payload: { employer_id: "${emp_id}", full_name: "Under Twenty", date_of_birth: "1985-04-04", hire_date: "2020-01-01", scheduled_hours_per_week: 19.5, prior_year_hours_worked: 900, includible_compensation_cents: 3000000, years_of_service: 6 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { pf_id: $.data.id }
            - call: "POST /plan-admin/participants"
              payload: { employer_id: "${emp_id}", full_name: "Thousand Hours", date_of_birth: "1985-04-04", hire_date: "2020-01-01", scheduled_hours_per_week: 19.5, prior_year_hours_worked: 1000, includible_compensation_cents: 3000000, years_of_service: 6 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { pg_id: $.data.id }
          trigger:
            - call: "POST /plan-admin/eligibility-determinations"
              payload: { plan_id: "${p403_id}", participant_id: "${pe_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { det_e: $.data.id }
            - call: "POST /plan-admin/eligibility-determinations"
              payload: { plan_id: "${p403_id}", participant_id: "${pf_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { det_f: $.data.id }
            - call: "POST /plan-admin/eligibility-determinations"
              payload: { plan_id: "${p403_id}", participant_id: "${pg_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { det_g: $.data.id }
          assert:
            - "EligibilityDetermination.${det_e}.status == ELIGIBLE — 20.0 is not strictly below 20"
            - "EligibilityDetermination.${det_f}.status == EXCLUDED_LESS_THAN_20_HOURS"
            - "EligibilityDetermination.${det_g}.status == ELIGIBLE — 1000 is not strictly below 1000, so the second prong fails"
            - "EligibilityDetermination.${det_e}.universal_availability_applies == true"
            - "EligibilityDetermination.${det_e}.notice_status == MISSING"
            - "EligibilityDetermination.${det_f}.notice_status == MISSING"

