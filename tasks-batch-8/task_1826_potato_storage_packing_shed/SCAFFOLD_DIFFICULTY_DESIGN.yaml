  - rule_id: boundary_precision_check
    instances:
      - name: commitment_equality_allowed_overage_rejected
        grounds:
          - validations[priority=10]
          - errors[ERR_COMMITMENT_EXCEEDED]
          - calculations.allocation_waterfall
        distinguishing_aspect: |
          Metric: packed cwt vs contract commitment. requested == remaining_committed_cwt (300.00)
          allocates cleanly; a follow-up request for 0.01 over the exhausted commitment is rejected.
          Endpoint: POST /pack-orders/{orderId}/allocate.
        test_recipe:
          setup:
            - "Lot 1000.00 RUSSET_BURBANK assessed 70/20/10 (f 0.9); contract committed 300.00 @ 2000"
            - "O1 requested exactly 300.00 (== commitment); O2 requested 0.01"
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower Twelve", grower_code: "G-TWELVE" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed L" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 1000.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { l_v: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-02", us1_pct: 70.0, us2_pct: 20.0, cull_pct: 10.0, cumulative_shrink_cwt: 0.00, expected_field_lot_version: "${l_v}" }, as: StorageManager }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer J", variety: "RUSSET_BURBANK", committed_volume_cwt: 300.00, price_cents_per_cwt: 2000, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 300.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o1_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 0.01, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o2_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/pack-orders/${o1_id}/allocate", payload: {}, as: SalesManager, captures: { o1_status: "$.data.status" } }
            - { call: "POST /potato-shed/pack-orders/${o2_id}/allocate", payload: {}, as: SalesManager, captures: { o2_err: "$.data.error_id" } }
          assert:
            - "o1_status == ALLOCATED (equality at the commitment boundary is allowed; reservation raw == 333.33)"
            - "CustomerContract.${c_id}.remaining_committed_cwt == 0.00 after O1"
            - "o2_err == ERR_COMMITMENT_EXCEEDED (0.01 > 0.00) with http 402"

      - name: retreat_window_exactly_21_days
        grounds:
          - validations[priority=8]
          - errors[ERR_RETREAT_WINDOW_VIOLATION]
        distinguishing_aspect: |
          Metric: whole days between sprout-inhibitor applications. Exactly 21 days after the
          previous application is ALLOWED (>= 21), 20 days is rejected. Endpoint:
          POST /field-lots/{lotId}/sprout-inhibitor-applications (distinct endpoint and metric
          from the commitment boundary).
        test_recipe:
          setup:
            - "Two binned lots A and B, each with a first inhibitor application at 2026-08-03T00:00:00Z"
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower Thirteen", grower_code: "G-13" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed M" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 500.00 }, as: IntakeClerk, captures: { la_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${la_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/field-lots/${la_id}/sprout-inhibitor-applications", payload: { applied_at: "2026-08-03T00:00:00Z" }, as: StorageManager }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 500.00 }, as: IntakeClerk, captures: { lb_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${lb_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/field-lots/${lb_id}/sprout-inhibitor-applications", payload: { applied_at: "2026-08-03T00:00:00Z" }, as: StorageManager }
          trigger:
            - { call: "POST /potato-shed/field-lots/${la_id}/sprout-inhibitor-applications", payload: { applied_at: "2026-08-24T00:00:00Z" }, as: StorageManager, captures: { la_count: "$.data.inhibitor_application_count" } }
            - { call: "POST /potato-shed/field-lots/${lb_id}/sprout-inhibitor-applications", payload: { applied_at: "2026-08-23T00:00:00Z" }, as: StorageManager, captures: { lb_err: "$.data.error_id" } }
          assert:
            - "lot A second application at exactly 21 days succeeds: la_count == 2"
            - "lot B second application at 20 days fails: lb_err == ERR_RETREAT_WINDOW_VIOLATION"
            - "FieldLot.${lb_id}.inhibitor_application_count == 1 and last_inhibitor_applied_at unchanged at 2026-08-03T00:00:00Z"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: settlement_finalize_requires_all_lots_closed
        grounds:
          - state_machines.GrowerSettlement.PROVISIONAL_to_FINALIZED
          - state_machines.FieldLot.BINNED_to_CLOSED
          - errors[ERR_SETTLEMENT_LOTS_NOT_CLOSED]
        distinguishing_aspect: |
          Entity pair GrowerSettlement -> FieldLot: finalize is gated on EVERY lot of the grower
          being CLOSED; with one lot still BINNED the transition returns
          ERR_SETTLEMENT_LOTS_NOT_CLOSED, and only closing the lot (hold + condemn) unblocks it.
        test_recipe:
          setup:
            - "Grower with one lot 100.00 RUSSET_BURBANK, BINNED, no assessments; PROVISIONAL settlement exists"
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower Fourteen", grower_code: "G-14" }, as: ShedAdmin, captures: { g_id: "$.data.id", g_v: "$.data.version" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed N" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/growers/${g_id}/settlements", payload: { season_label: "2026-storage", expected_grower_version: "${g_v}" }, as: SettlementClerk, captures: { st_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/settlements/${st_id}/finalize", payload: {}, as: SettlementClerk, as_user_id: "clerk_one", captures: { err: "$.data.error_id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/quality-transition", payload: { to_status: "ON_HOLD" }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/field-lots/${l_id}/quality-transition", payload: { to_status: "CONDEMNED", diversion_channel: "WASTE" }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/settlements/${st_id}/finalize", payload: {}, as: SettlementClerk, as_user_id: "clerk_one", captures: { st_status: "$.data.status" } }
          assert:
            - "first finalize: err == ERR_SETTLEMENT_LOTS_NOT_CLOSED (lot BINNED blocks the Settlement transition)"
            - "after condemn closes the lot: st_status == FINALIZED"
            - "final settlement packed_cwt_basis == 0 and net_payable_cents reflects storage weeks from 2026-08-02 to 2026-08-02 (0 weeks): storage_fees_cents == 0"

      - name: allocate_requires_contract_active
        grounds:
          - state_machines.CustomerContract.ACTIVE_to_SHORTFALLED
          - state_machines.PackOrder.REQUESTED_to_ALLOCATED
          - errors[ERR_CONTRACT_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair PackOrder -> CustomerContract: after the logical clock passes the contract's
          delivery_window_end the contract auto-settles SHORTFALLED (packed 0 < committed), and
          allocating an order against it returns ERR_CONTRACT_INVALID_STATE.
        test_recipe:
          setup:
            - "Lot 500.00 RUSSET_BURBANK; contract committed 100.00 @ 2000 with window 2026-08-01..2026-08-20; CONTRACT order requested 50.00 created while ACTIVE"
            - "clock advanced to 2026-08-21 (past window end) so the contract auto-settles SHORTFALLED"
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
