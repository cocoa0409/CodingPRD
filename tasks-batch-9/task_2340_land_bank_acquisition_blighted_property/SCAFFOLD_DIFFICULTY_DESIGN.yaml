  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: parcel_half_open_window_touching_allowed_overlap_rejected
        grounds:
          - validations[priority=85]
          - entities.MaintenanceOrder.fields.window_start
          - entities.MaintenanceOrder.fields.window_end
          - errors.ERR_PROPERTY_WINDOW_CONFLICT
        distinguishing_aspect: |
          Exclusivity is per parcel and the interval is half-open: a SECURE order starting at the
          exact instant a MOW order ends (2026-09-05) is accepted, while a MOW order spanning
          2026-09-04 to 2026-09-06 is rejected because it genuinely intersects the first order.
          The contractor has three crews, so the aggregate capacity rule at priority 87 cannot be
          what fires - the conflict is on the parcel resource, not on the contractor.
        test_recipe:
          setup:
            - "One ACTIVE funding source, restriction ANY, authorized 1000000 cents."
            - "One 10000 sqft parcel acquired by donation with a zero title fee, so disbursed_cents stays 0."
            - "One contractor with three crews and specialties [MOW, SECURE], licence to 2027-12-31."
            - "Order 1: MOW over [2026-09-01, 2026-09-05), estimate 19703. Order 2: SECURE with 4 openings over [2026-09-05, 2026-09-08), estimate 102240 - accepted because the endpoints only touch."
            - "Property.version is re-read before every order because each accepted order bumps it."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Maintenance Line", source_type: "GENERAL_FUND", authorized_cents: 1000000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
