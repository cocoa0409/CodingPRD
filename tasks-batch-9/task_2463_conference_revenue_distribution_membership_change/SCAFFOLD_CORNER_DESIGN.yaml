            - &c_bal_s
              call: "POST /budget-proposals/${bp_id}/ballots"
              payload: { member_id: "${m_s_id}", choice: "FOR" }
              as: MemberRepresentative
              as_user_id: "${m_s_id}"
            - &c_bal_e
              call: "POST /budget-proposals/${bp_id}/ballots"
              payload: { member_id: "${m_e_id}", choice: "FOR" }
