      - name: cyclic_screening_retest_loop_reenters_findings_recorded
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.ScreeningRecord.FINDINGS_RECORDED_to_RETEST_REQUIRED
          - state_machines.ScreeningRecord.RETEST_REQUIRED_to_FINDINGS_RECORDED
        excluded_because:
          difficulty_instance: non_linear_state_machine / screening_retest_loop_reenters_findings_recorded_and_resets_adjudicator
          rationale: "That difficulty instance already walks the full retest loop, asserting the attempt_number increment, the recomputed composite_score and the cleared findings_recorded_by_user_id on re-entry. A separate corner test would re-drive the identical cycle with weaker assertions."

      - name: guarded_transitions_rotation_activation_is_clock_guarded
        claim_type: guarded_transitions
        grounds:
          - state_machines.FieldTrainingRotation.PLANNED_to_ACTIVE
          - errors[ERR_FTO_NOT_CERTIFIED]
          - errors[ERR_INSTRUCTOR_CERT_EXPIRED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / rotation_activation_blocked_by_clock_driven_fto_certification_expiry
          rationale: "The PLANNED -> ACTIVE guard is exactly the subject of that instance: the rotation is created while the FTO is CERTIFIED and activation is attempted after the logical clock has swept the instructor to EXPIRED, so the guard evaluates against live cross-entity state rather than a snapshot."

      - name: cross_entity_revoking_an_instructor_cascades_across_four_entities
        claim_type: cross_entity
        grounds:
          - state_machines.Instructor.CERTIFIED_to_REVOKED
          - state_machines.LessonPlan.APPROVED_to_REVISION_REQUESTED
          - state_machines.CourseSession.SCHEDULED_to_CANCELLED
          - state_machines.AcademyClass.IN_SESSION_to_AT_RISK
        excluded_because:
          difficulty_instance: transitive_cascade / revoke_instructor_cascades_plan_session_projected_hours_class_at_risk
          rationale: "That instance already drives the full four-level chain from one revoke-certification call (instructor -> lesson plan -> course session -> cohort projection and posture) and pins the intermediate state at every level, which is strictly stronger than a single cross-entity probe."

      - name: ledger_sync_class_hours_reconcile_with_the_training_record_ledger
        claim_type: ledger_sync
        grounds:
          - entities.AcademyClass.credited_topic_hours_total
          - entities.TrainingRecordEntry.hours_delta
          - endpoints[POST /course-sessions/{courseSessionId}/void-delivery]
        excluded_because:
          difficulty_instance: compensating_invariant / void_delivery_restores_class_credited_topic_hours_total_exactly
          rationale: "The conserved-quantity claim - credited_topic_hours_total equals the sum of HOURS_CREDIT and HOURS_REVERSAL hours_delta values, exactly, to the cent - is that instance's central assertion. A corner test could only restate it."

      - name: compensation_aborting_a_rotation_releases_the_trainee_reservation
        claim_type: compensation
        grounds:
          - state_machines.FieldTrainingRotation.ACTIVE_to_ABORTED
          - entities.Instructor.active_trainee_count
          - state_machines.Recruit.probation_status.EXTENSION_REQUIRED_to_ACTIVE
        excluded_because:
          difficulty_instance: compensating_invariant / abort_remedial_rotation_restores_active_trainee_count_and_probation_schedule
          rationale: "That instance already asserts every arm of the compensating abort: the FTO's active_trainee_count returns to its pre-activation value, every ObservationReport is voided, both competency variants return to null, and the probation schedule is recomputed back to its unextended dates."

