# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# task_3004_store_rebate_certificate_program_store_credit_liability
# 9 rule_ids × 2 instances each = 18 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and carries an executable setup_api_calls chain.
# Shared fixture conventions: store policy { submission_window_days: 30,
# certificate_validity_months: 1, expected_breakage_rate: 0.25,
# split_txn_window_hours: 2, split_txn_min_receipts: 3 } unless an instance
# overrides it; receipt purchase_at is always <= the logical clock at creation
# (ERR_RECEIPT_IN_FUTURE otherwise); Store.version is captured fresh via GET
# immediately before each OCC-guarded breakage run because liability recompute
# side effects increment Store.version.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rebate_award_provisional_vs_adjudicated_diverge_after_return
        grounds:
          - calculations.rebate_award
          - entities.RebateSubmission.fields.provisional_award_cents
          - entities.RebateSubmission.fields.award_cents
        distinguishing_aspect: |
          Dual-variant divergence on the RebateSubmission entity domain: the
          provisional variant (returns invisible, min_quantity skipped) computes
          4750 while the adjudicated variant (returns subtracted, min_quantity
          enforced) computes 4200 on the SAME receipt — the difference is exactly
          the provisional 550 contributed by the returned unit on line 1.
        test_recipe:
          setup:
            - "Store S (policy: window 30d, validity 1mo, breakage 0.25, split 2h/3 receipts); program P ACTIVE for week [2026-09-07, 2026-09-14) with items A (sku AAA, 0.11, min_quantity 1), B (sku BBB, 0.11, min_quantity 1), C (sku CCC, 0.50, min_quantity 1, per_receipt_cap_cents 2000)."
            - "Retail account AC; receipt R purchased 2026-09-08T10:00:00Z with lines: 1) AAA qty 3 @ 5000, 2) BBB qty 4 @ 2500, 3) CCC qty 2 @ 3000 — all lines fully CASH-tendered."
            - "Return of 1 unit of line 1 processed before submission."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-DV1", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "Week37", week_start_date: "2026-09-07", week_end_date: "2026-09-14" }
              as: StoreAdmin
              captures: { p: $.data.id }
            - call: "POST /stores/${s}/rebate-programs/${p}/items"
              payload: { sku: "AAA", rebate_pct: 0.11, min_quantity: 1 }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p}/items"
              payload: { sku: "BBB", rebate_pct: 0.11, min_quantity: 1 }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p}/items"
              payload: { sku: "CCC", rebate_pct: 0.5, min_quantity: 1, per_receipt_cap_cents: 2000 }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p}/activate"
              payload: {}
              as: StoreAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Rita Retail", account_type: "RETAIL" }
              as: GuestService
              captures: { ac: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-DV1", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 3, unit_price_cents: 5000, tender_splits: [ { tender_type: "CASH", amount_cents: 15000 } ] }, { line_number: 2, sku: "BBB", category: "TOOLS", quantity: 4, unit_price_cents: 2500, tender_splits: [ { tender_type: "CASH", amount_cents: 10000 } ] }, { line_number: 3, sku: "CCC", category: "TOOLS", quantity: 2, unit_price_cents: 3000, tender_splits: [ { tender_type: "CASH", amount_cents: 6000 } ] } ] }
              as: GuestService
              captures: { r: $.data.id }
            - call: "POST /stores/${s}/receipts/${r}/returns"
              payload: { lines: [ { line_number: 1, quantity: 1 } ] }
              as: GuestService
          trigger:
            - call: "POST /stores/${s}/rebate-submissions"
              payload: { receipt_id: "${r}" }
              as: Customer
              as_user_id: "${ac}"
              captures: { sub: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions/${sub}/adjudicate"
              payload: { decision: "APPROVE" }
              as: GuestService
          assert:
            - "RebateSubmission.${sub}.provisional_award_cents == 4750"
            - "RebateSubmission.${sub}.award_cents == 4200"
            - "RebateSubmission.${sub}.status == APPROVED"
            - "CreditAccount.${ac}.pending_award_cents == 4200 and lifetime_rebate_cents == 4200"
            - "Store.${s}.outstanding_liability_cents == 4200 (APPROVED award enters gross liability before issuance)"

      - name: store_liability_gross_vs_net_diverge_by_breakage_rate
        grounds:
          - calculations.store_credit_liability
          - entities.Store.fields.outstanding_liability_cents
          - entities.Store.fields.net_liability_cents
        distinguishing_aspect: |
          Dual-variant divergence on the Store fiscal domain (different subject
          from the RebateSubmission award variants): identical certificate
          population (10500 PARTIALLY_REDEEMED remaining + 5500 ACTIVE) yields
          outstanding_liability_cents == 16000 while net_liability_cents ==
          12000 because the net variant applies the (1 − 0.25) breakage factor
          with a single final round_half_up.
        test_recipe:
          setup:
            - "Store S (breakage rate 0.25); program P ACTIVE week [2026-09-07, 2026-09-14) with item AAA at 0.11."
            - "Retail account AC; receipt R1 purchased 2026-09-08T10:00:00Z with one line AAA qty 2 @ 50000 (100000 CASH); receipt R2 purchased 2026-09-08T11:00:00Z with one line AAA qty 1 @ 50000 (50000 CASH)."
            - "Both receipts submitted, approved, and certificates issued: CERT1 11000, CERT2 5500. CERT1 partially redeemed by 500 against receipt R3 (sku ZZZ, non-eligible, purchased 2026-09-09T10:00:00Z, all CASH)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-DV2", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "Week37", week_start_date: "2026-09-07", week_end_date: "2026-09-14" }
              as: StoreAdmin
              captures: { p: $.data.id }
            - call: "POST /stores/${s}/rebate-programs/${p}/items"
              payload: { sku: "AAA", rebate_pct: 0.11 }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p}/activate"
              payload: {}
              as: StoreAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Rita Retail", account_type: "RETAIL" }
              as: GuestService
              captures: { ac: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-DV2-1", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 2, unit_price_cents: 50000, tender_splits: [ { tender_type: "CASH", amount_cents: 100000 } ] } ] }
              as: GuestService
              captures: { r1: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions"
              payload: { receipt_id: "${r1}" }
              as: Customer
              as_user_id: "${ac}"
              captures: { sub1: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions/${sub1}/adjudicate"
              payload: { decision: "APPROVE" }
              as: GuestService
            - call: "POST /stores/${s}/rebate-submissions/${sub1}/issue-certificate"
              payload: {}
              as: GuestService
              captures: { cert1: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-DV2-2", account_id: "${ac}", purchase_at: "2026-09-08T11:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 50000, tender_splits: [ { tender_type: "CASH", amount_cents: 50000 } ] } ] }
              as: GuestService
              captures: { r2: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions"
              payload: { receipt_id: "${r2}" }
              as: Customer
              as_user_id: "${ac}"
              captures: { sub2: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions/${sub2}/adjudicate"
              payload: { decision: "APPROVE" }
              as: GuestService
            - call: "POST /stores/${s}/rebate-submissions/${sub2}/issue-certificate"
              payload: {}
              as: GuestService
              captures: { cert2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-DV2-3", account_id: "${ac}", purchase_at: "2026-09-09T10:00:00Z", lines: [ { line_number: 1, sku: "ZZZ", category: "PAINT", quantity: 1, unit_price_cents: 5000, tender_splits: [ { tender_type: "CASH", amount_cents: 5000 } ] } ] }
              as: GuestService
              captures: { r3: $.data.id }
            - call: "POST /stores/${s}/certificates/${cert1}/redeem"
              payload: { receipt_id: "${r3}", amount_cents: 500 }
              as: GuestService
          trigger:
            - call: "GET /stores/${s}"
              payload: {}
              as: FinanceAdmin
          assert:
            - "RebateCertificate.${cert1}.status == PARTIALLY_REDEEMED and remaining_balance_cents == 10500"
            - "RebateCertificate.${cert2}.status == ACTIVE and remaining_balance_cents == 5500"
            - "Store.${s}.outstanding_liability_cents == 16000"
            - "Store.${s}.net_liability_cents == 12000"
            - "CreditAccount.${ac}.credit_balance_cents == 16000 and pending_award_cents == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rebate_award_five_input_interactions_single_line
        grounds:
          - calculations.rebate_award
          - entities.ProgramItem.fields.per_receipt_cap_cents
          - entities.ReceiptLine.fields.certificate_tendered_cents
        distinguishing_aspect: |
          Mode (a) combinatorial formula: one line's award depends on five
          interacting inputs — returned quantity (2 of 5), certificate-tendered
          portion (800 of the 9000 net base), rebate_pct 0.10, per-receipt cap
          1000 vs raw 820, and excluded_categories checked before the min/max —
          yielding exactly 820, where disturbing any single input changes the
          result; the provisional variant (returns invisible) lands on the cap
          at 1000 instead.
        test_recipe:
          setup:
            - "Store S; program P ACTIVE week [2026-09-07, 2026-09-14) with item AAA at 0.10, min_quantity 2, per_receipt_cap_cents 1000."
            - "Retail account AC; receipt R purchased 2026-09-08T10:00:00Z: line 1 AAA qty 5 @ 3000 = 15000 paid CASH 14200 + STORE_CREDIT_CERTIFICATE 800 (certificate tender bookkeeping only)."
            - "Return of 2 units of line 1 processed before submission."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-CF1", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "Week37", week_start_date: "2026-09-07", week_end_date: "2026-09-14" }
              as: StoreAdmin
              captures: { p: $.data.id }
            - call: "POST /stores/${s}/rebate-programs/${p}/items"
              payload: { sku: "AAA", rebate_pct: 0.1, min_quantity: 2, per_receipt_cap_cents: 1000 }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p}/activate"
              payload: {}
              as: StoreAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Rita Retail", account_type: "RETAIL" }
              as: GuestService
              captures: { ac: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-CF1", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 5, unit_price_cents: 3000, tender_splits: [ { tender_type: "CASH", amount_cents: 14200 }, { tender_type: "STORE_CREDIT_CERTIFICATE", amount_cents: 800 } ] } ] }
              as: GuestService
              captures: { r: $.data.id }
            - call: "POST /stores/${s}/receipts/${r}/returns"
              payload: { lines: [ { line_number: 1, quantity: 2 } ] }
              as: GuestService
          trigger:
            - call: "POST /stores/${s}/rebate-submissions"
              payload: { receipt_id: "${r}" }
              as: Customer
              as_user_id: "${ac}"
              captures: { sub: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions/${sub}/adjudicate"
              payload: { decision: "APPROVE" }
              as: GuestService
            - call: "GET /stores/${s}/rebate-submissions/${sub}/lines"
              payload: {}
              as: GuestService
              captures: { line_award: $.data.0.awarded_cents, line_base: $.data.0.eligible_base_cents }
          assert:
            - "SubmissionLine eligible_base_cents == 8200 (net_qty 3 × 3000 − 800 certificate tender)"
            - "SubmissionLine awarded_cents == 820 (raw 820 below the 1000 cap: cap branch NOT taken)"
            - "RebateSubmission.${sub}.award_cents == 820"
            - "RebateSubmission.${sub}.provisional_award_cents == 1000 (provisional: net_qty 5 × 3000 − 800 = 14200 × 0.10 = 1420, capped at 1000)"

      - name: per_line_rounding_then_sum_beats_sum_then_round
        grounds:
          - calculations.rebate_award
          - entities.SubmissionLine.fields.awarded_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding order (a different mode than instance one's
          mode (a)): three lines of 1×333 at 0.11 round per line to 37 each and
          sum to 111, while the mathematically identical 1×999 line rounds to
          110 — the scaffold pins round-per-line-then-sum, so receipt R1 awards
          exactly 1 cent more than receipt R2 on equal pre-round value.
        test_recipe:
          setup:
            - "Store S; program P ACTIVE week [2026-09-07, 2026-09-14) with item AAA at 0.11."
            - "Retail account AC; receipt R1 purchased 2026-09-08T10:00:00Z with three lines AAA qty 1 @ 333 (each 333 CASH); receipt R2 purchased 2026-09-08T11:00:00Z with one line AAA qty 1 @ 999 (999 CASH)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-CF2", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "Week37", week_start_date: "2026-09-07", week_end_date: "2026-09-14" }
              as: StoreAdmin
              captures: { p: $.data.id }
            - call: "POST /stores/${s}/rebate-programs/${p}/items"
              payload: { sku: "AAA", rebate_pct: 0.11 }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p}/activate"
              payload: {}
              as: StoreAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Rita Retail", account_type: "RETAIL" }
              as: GuestService
              captures: { ac: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-CF2-1", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 333, tender_splits: [ { tender_type: "CASH", amount_cents: 333 } ] }, { line_number: 2, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 333, tender_splits: [ { tender_type: "CASH", amount_cents: 333 } ] }, { line_number: 3, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 333, tender_splits: [ { tender_type: "CASH", amount_cents: 333 } ] } ] }
              as: GuestService
              captures: { r1: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-CF2-2", account_id: "${ac}", purchase_at: "2026-09-08T11:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 999, tender_splits: [ { tender_type: "CASH", amount_cents: 999 } ] } ] }
              as: GuestService
              captures: { r2: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions"
              payload: { receipt_id: "${r1}" }
              as: Customer
              as_user_id: "${ac}"
              captures: { sub1: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions"
              payload: { receipt_id: "${r2}" }
              as: Customer
              as_user_id: "${ac}"
              captures: { sub2: $.data.id }
          trigger:
            - call: "POST /stores/${s}/rebate-submissions/${sub1}/adjudicate"
              payload: { decision: "APPROVE" }
              as: GuestService
            - call: "POST /stores/${s}/rebate-submissions/${sub2}/adjudicate"
              payload: { decision: "APPROVE" }
              as: GuestService
          assert:
            - "RebateSubmission.${sub1}.award_cents == 111"
            - "RebateSubmission.${sub2}.award_cents == 110"
            - "the 1-cent divergence arises solely from the pinned round-per-line-then-sum order"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: certificate_expire_reissue_cycle_redeems_on_second_life
        grounds:
          - state_machines.RebateCertificate
          - calculations.certificate_expiry_timestamp
        distinguishing_aspect: |
          Non-linear shape on RebateCertificate: the cycle ACTIVE → EXPIRED →
          (reissue) → new ACTIVE lets the SAME monetary value be redeemed on the
          certificate's second life, with the source row terminally REISSUED at
          balance 0 — a loop, not a pipeline.
        test_recipe:
          setup:
            - "Store S (validity 1 month, breakage 0.25); program P ACTIVE week [2026-09-07, 2026-09-14), item AAA 0.10."
            - "Retail account AC; receipt R1 purchased 2026-09-08T10:00:00Z with line AAA qty 1 @ 10000 (CASH); submission approved and certificate CERT issued at 2026-09-10T12:00:00Z (expires 2026-10-10T00:00:00Z)."
            - "Clock advanced to 2026-10-15T00:00:00Z; breakage run sweeps CERT to EXPIRED; clock then at 2026-10-20T12:00:00Z (inside the 30-day reissue grace)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-NL1", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "Week37", week_start_date: "2026-09-07", week_end_date: "2026-09-14" }
              as: StoreAdmin
              captures: { p: $.data.id }
            - call: "POST /stores/${s}/rebate-programs/${p}/items"
              payload: { sku: "AAA", rebate_pct: 0.1 }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p}/activate"
              payload: {}
              as: StoreAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Rita Retail", account_type: "RETAIL" }
              as: GuestService
              captures: { ac: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-NL1-1", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 10000, tender_splits: [ { tender_type: "CASH", amount_cents: 10000 } ] } ] }
              as: GuestService
              captures: { r1: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions"
              payload: { receipt_id: "${r1}" }
              as: Customer
              as_user_id: "${ac}"
              captures: { sub: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions/${sub}/adjudicate"
              payload: { decision: "APPROVE" }
              as: GuestService
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-submissions/${sub}/issue-certificate"
              payload: {}
              as: GuestService
              captures: { cert: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: StoreAdmin
            - call: "GET /stores/${s}"
              payload: {}
              as: FinanceAdmin
              captures: { s_v: $.data.version }
            - call: "POST /stores/${s}/breakage-runs"
              payload: { expected_store_version: "${s_v}" }
              as: FinanceAdmin
              captures: { run: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T12:00:00Z" }
              as: StoreAdmin
          trigger:
            - call: "POST /stores/${s}/certificates/${cert}/reissue"
              payload: {}
              as: GuestService
              captures: { cert2: $.data.id }
            - call: "POST /stores/${s}/receipts"
