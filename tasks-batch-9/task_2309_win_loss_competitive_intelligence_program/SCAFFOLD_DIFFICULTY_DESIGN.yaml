      - name: draw_treats_window_end_as_exclusive_and_window_start_as_inclusive
        grounds:
          - calculations.sample_selection_rank_score
          - entities.SamplingFrame.fields.window_end
          - errors.ERR_NO_ELIGIBLE_DEALS
          - errors.ERR_STRATUM_QUOTA_EXHAUSTED
          - entities.Deal.fields.selection_rank_score
        distinguishing_aspect: |
          A different metric on a different endpoint: the half-open close-date window
          [window_start, window_end) on POST /sampling-frames/{frame_id}/draw. A WON
          deal closing at exactly window_end (2026-07-01T00:00:00Z) must be filtered
          out of the candidate pool, so the draw fails with ERR_NO_ELIGIBLE_DEALS (422)
          even though open_won_slots is 2 — NOT ERR_STRATUM_QUOTA_EXHAUSTED (409),
          which is the error an implementation that conflates "no candidates" with
          "no slots" would return. A second WON deal closing at exactly window_start
          IS inside the window and draws successfully with
          selection_rank_score 0.7489, proving the asymmetry of the two bounds.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; program ACTIVE with min_deal_value_usd 50000.00."
            - "SEALED frame with window [2026-04-01T00:00:00Z, 2026-07-01T00:00:00Z), quota_won 2, quota_lost 2, quota_no_decision 1, basis STRATIFIED_BY_SEGMENT."
