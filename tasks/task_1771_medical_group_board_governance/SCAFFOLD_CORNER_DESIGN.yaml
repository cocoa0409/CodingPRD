            - { call: "POST /governance/physicians", payload: { full_name: "Dr B", hire_date: "2016-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P", hire_date: "2024-01-01T00:00:00Z" }, as: BoardAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 50000, due_date: "2026-08-20T00:00:00Z", purpose: "Minor" } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/physicians/${b_id}/standing", payload: { standing: SUSPENDED }, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: AGAINST }, as: Physician, as_user_id: "${a_id}", captures: { err_dup: $.data.error_id } }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${p_id}", captures: { err_inel1: $.data.error_id } }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${b_id}", captures: { err_inel2: $.data.error_id } }
          assert:
            - "err_dup == ERR_DUPLICATE_VOTE (A already has a CAST ballot)"
            - "err_inel1 == ERR_VOTER_INELIGIBLE (associate never in snapshot)"
            - "err_inel2 == ERR_VOTER_INELIGIBLE (B in snapshot but standing SUSPENDED at cast time)"

      - name: simple_majority_tie_rejects_abstain_counts_to_quorum
        claim_type: correct_result
        grounds: [calculations.vote_threshold]
        distinguishing_aspect: "SIMPLE_MAJORITY is strict (votes_for > votes_against): a 1-1 tie REJECTS; ABSTAIN ballots count toward the quorum gate but neither side — quorum 2 met by FOR+ABSTAIN adopts 1-0."
        test_recipe:
          setup: ["Policy quorum 2; SHAREHOLDERs A, B, C; M1 with A FOR and B AGAINST; M2 with A FOR and B ABSTAIN"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 2 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr B", hire_date: "2016-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr C", hire_date: "2017-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 50000, due_date: "2026-08-20T00:00:00Z", purpose: "Tie case" } }, as: Physician, as_user_id: "${a_id}", captures: { m1: $.data.id } }
            - { call: "POST /governance/motions/${m1}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m1}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m1}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m1}/votes", payload: { vote_choice: AGAINST }, as: Physician, as_user_id: "${b_id}" }
            - { call: "POST /governance/motions/${m1}/close", payload: {}, as: BoardAdmin }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 50000, due_date: "2026-08-20T00:00:00Z", purpose: "Abstain case" } }, as: Physician, as_user_id: "${a_id}", captures: { m2: $.data.id } }
            - { call: "POST /governance/motions/${m2}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m2}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m2}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m2}/votes", payload: { vote_choice: ABSTAIN }, as: Physician, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /governance/motions/${m2}/close", payload: {}, as: BoardAdmin }
          assert:
            - "M1: 1 FOR vs 1 AGAINST -> REJECTED (strict > fails on tie)"
            - "M2: ballots 2 >= quorum 2 with 1 FOR + 1 ABSTAIN -> ADOPTED (abstain counts to quorum only)"

      - name: standing_dimension_cyclic_and_exited_lockout
        claim_type: valid_transition
        grounds: [state_machines.Physician]
        distinguishing_aspect: "The standing dimension is cyclic (GOOD_STANDING -> PROBATION -> SUSPENDED -> GOOD_STANDING) and independent of partnership_status; an EXITED physician rejects standing changes with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Policy quorum 1; SHAREHOLDER X exited fully (valuation finalized with adopted motion); SHAREHOLDER Y remains"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr X", hire_date: "2010-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { x_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr Y", hire_date: "2011-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /governance/exit-valuations", payload: { physician_id: "${x_id}", trigger_type: DEATH }, as: BoardAdmin, captures: { v_id: $.data.id, v_v: $.data.version } }
            - { call: "POST /governance/exit-valuations/${v_id}/appraise", payload: { appraised_practice_value_cents: 90000000, expected_valuation_version: "${v_v}" }, as: BoardAdmin }
            - { call: "POST /governance/motions", payload: { motion_type: BUYOUT_APPROVAL, sponsor_physician_id: "${y_id}", payload: { exit_valuation_id: "${v_id}" } }, as: Physician, as_user_id: "${y_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${y_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${y_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${y_id}" }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin }
            - { call: "POST /governance/exit-valuations/${v_id}/finalize", payload: { motion_id: "${m_id}" }, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/physicians/${y_id}/standing", payload: { standing: PROBATION }, as: BoardAdmin }
            - { call: "POST /governance/physicians/${y_id}/standing", payload: { standing: SUSPENDED }, as: BoardAdmin }
            - { call: "POST /governance/physicians/${y_id}/standing", payload: { standing: GOOD_STANDING }, as: BoardAdmin }
            - { call: "POST /governance/physicians/${x_id}/standing", payload: { standing: PROBATION }, as: BoardAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Y cycles GOOD_STANDING -> PROBATION -> SUSPENDED -> GOOD_STANDING while partnership_status stays SHAREHOLDER"
            - "err == ERR_INVALID_STATE for the EXITED X (terminal lockdown on both dimensions)"

      - name: buy_in_completion_advances_tier_and_stamps_schedule
        claim_type: side_effect_execution
        grounds: [state_machines.BuyInOffer.ACCEPTED_to_COMPLETED, state_machines.Physician]
        distinguishing_aspect: "Paying the final installment auto-completes the offer and advances the physician ASSOCIATE -> PARTNER_TRACK with no shares (grant 0); the installment schedule is exact-cent split with the remainder on the first installment."
        test_recipe:
          setup: ["Policy defaults; associate P hired 2024-01-01; offer PARTNER_TRACK, grant 0, 2 installments (final 8800000 -> schedule [4400000, 4400000])"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P", hire_date: "2024-01-01T00:00:00Z" }, as: BoardAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /governance/buy-in-offers", payload: { physician_id: "${p_id}", target_tier: PARTNER_TRACK, share_grant: 0, installment_count: 2 }, as: BoardAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /governance/buy-in-offers/${o_id}/respond", payload: { decision: ACCEPT }, as: Physician, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /governance/buy-in-offers/${o_id}/pay-installment", payload: { amount_cents: 4400000 }, as: Physician, as_user_id: "${p_id}" }
            - { call: "POST /governance/buy-in-offers/${o_id}/pay-installment", payload: { amount_cents: 4400000 }, as: BoardAdmin }
            - { call: "GET /governance/physicians/${p_id}", as: BoardAdmin }
          assert:
            - "BuyInOffer.${o_id}.installment_schedule_cents == [4400000, 4400000]"
            - "After first payment: paid_installment_count == 1, status ACCEPTED; after second: status COMPLETED"
            - "Physician.${p_id}.partnership_status == PARTNER_TRACK and shares_held == 0 (PARTNER_TRACK carries no voting shares)"

  # ===================================================== 3. calculations
  - section: calculations
    instances:
      - name: capital_call_assessment_residual_penny
        claim_type: correct_result
        grounds: [calculations.capital_call_assessment]
        distinguishing_aspect: "Billing a 5000001-cent call over 1000/1000/500 shares yields floors 2000000/2000000/1000000 and one residual penny to A (shares DESC tie 1000=1000 broken by created_at ASC)."
        test_recipe:
          setup: ["Policy quorum 1; A 1000 (created first), B 1000, C 500 — all SHAREHOLDER; call of 5000001 adopted and billed"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr B", hire_date: "2016-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr C", hire_date: "2025-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 500 }, as: BoardAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 5000001, due_date: "2026-08-20T00:00:00Z", purpose: "Odd cent" } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/capital-calls?motion_id=${m_id}", as: BoardAdmin, captures: { cc_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /governance/capital-calls/${cc_id}/bill", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/capital-calls/${cc_id}/assessments", as: BoardAdmin }
          assert:
            - "Assessments: A 2000001 (residual penny), B 2000000, C 1000000; shares_at_billing snapshots 1000/1000/500"
            - "CapitalCall.${cc_id}.assessed_total_cents == 5000001 == total_amount_cents (fully funded, no cent drift)"

      - name: death_exit_waives_minority_discount
        claim_type: variant_selection
        grounds: [calculations.buy_out_valuation]
        distinguishing_aspect: "The final variant is conditional on trigger_type: DEATH waives the 15% minority discount that VOLUNTARY applies — same appraisal, same ownership, different final cents (45000000 vs 38250000)."
        test_recipe:
          setup: ["Policy; SHAREHOLDERs X and W, 1000 shares each (ownership 1/2 each); X exits with trigger DEATH, W with VOLUNTARY; both appraised at 90000000"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr X", hire_date: "2010-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { x_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr W", hire_date: "2011-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { w_id: $.data.id } }
            - { call: "POST /governance/exit-valuations", payload: { physician_id: "${x_id}", trigger_type: DEATH }, as: BoardAdmin, captures: { vx: $.data.id, vx_v: $.data.version } }
            - { call: "POST /governance/exit-valuations", payload: { physician_id: "${w_id}", trigger_type: VOLUNTARY }, as: BoardAdmin, captures: { vw: $.data.id, vw_v: $.data.version } }
          trigger:
            - { call: "POST /governance/exit-valuations/${vx}/appraise", payload: { appraised_practice_value_cents: 90000000, expected_valuation_version: "${vx_v}" }, as: BoardAdmin }
            - { call: "POST /governance/exit-valuations/${vw}/appraise", payload: { appraised_practice_value_cents: 90000000, expected_valuation_version: "${vw_v}" }, as: BoardAdmin }
          assert:
            - "ExitValuation.${vx}.final_value_cents == 45000000 (90000000 x 0.5, discount waived for DEATH)"
            - "ExitValuation.${vw}.final_value_cents == 38250000 (90000000 x 0.5 x 0.85 for VOLUNTARY)"

      - name: quorum_count_configurable_boundary
        claim_type: constants_applied
        grounds: [calculations.vote_threshold, entities.GovernancePolicy.fields.board_quorum_count]
        distinguishing_aspect: "The quorum gate uses the configured constant: with board_quorum_count 3, closing on 2 ballots fails ERR_QUORUM_NOT_MET; a third ballot (even ABSTAIN) unlocks the close."
        test_recipe:
          setup: ["Policy board_quorum_count 3; SHAREHOLDERs A, B, C; CAPITAL_CALL motion OPEN with A FOR and B FOR cast"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 3 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr B", hire_date: "2016-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr C", hire_date: "2017-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 50000, due_date: "2026-08-20T00:00:00Z", purpose: "Quorum test" } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin, captures: { err_q: $.data.error_id } }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: ABSTAIN }, as: Physician, as_user_id: "${c_id}" }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin }
          assert:
            - "First close: err_q == ERR_QUORUM_NOT_MET (2 ballots < quorum 3)"
            - "After C's ABSTAIN: close succeeds, status ADOPTED (3 ballots; 2 FOR > 0 AGAINST)"

  # ===================================================== 4. validations
  - section: validations
    instances:
      - name: missing_role_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "No X-User-Role header -> 401 ERR_UNAUTHENTICATED before any other check, even for a well-formed request."
        test_recipe:
          setup: ["Empty DB is fine"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
          trigger:
            - { call: "GET /governance/physicians", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED, HTTP 401 (trigger sends no role header)"

      - name: shape_validation_beats_role_check
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "Priority pair shape-vs-authz: a Physician creating a physician WITH a missing required field gets ERR_INVALID_REQUEST (priority 2), not ERR_FORBIDDEN (priority 3)."
        test_recipe:
          setup: ["Policy exists; one physician P to act as caller"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P", hire_date: "2024-01-01T00:00:00Z" }, as: BoardAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /governance/physicians", payload: { full_name: "Dr Orphan" }, as: Physician, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (shape priority 2 beats role priority 3)"

      - name: existence_beats_state_on_vote
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=6]"]
        distinguishing_aspect: "Priority pair existence-vs-state: voting on a nonexistent motion id returns ERR_NOT_FOUND (priority 5), never ERR_MOTION_NOT_OPEN."
        test_recipe:
          setup: ["Policy; one SHAREHOLDER A"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /governance/motions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND, HTTP 404"

      - name: ownership_other_physician_offer_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_RESOURCE_OWNERSHIP]"]
        distinguishing_aspect: "A Physician caller may only respond to their OWN offer: P2 responding to P1's offer yields ERR_RESOURCE_OWNERSHIP (403)."
        test_recipe:
          setup: ["Policy; associates P1 and P2; offer created for P1"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P1", hire_date: "2024-01-01T00:00:00Z" }, as: BoardAdmin, captures: { p1: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P2", hire_date: "2024-02-01T00:00:00Z" }, as: BoardAdmin, captures: { p2: $.data.id } }
            - { call: "POST /governance/buy-in-offers", payload: { physician_id: "${p1}", target_tier: PARTNER_TRACK, share_grant: 0, installment_count: 1 }, as: BoardAdmin, captures: { o_id: $.data.id } }
          trigger:
            - { call: "POST /governance/buy-in-offers/${o_id}/respond", payload: { decision: ACCEPT }, as: Physician, as_user_id: "${p2}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_RESOURCE_OWNERSHIP, HTTP 403; offer stays OFFERED"

      - name: seat_term_window_invalid_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_TERM_WINDOW_INVALID]"]
        distinguishing_aspect: "term_end == term_start is rejected (empty window); term_end < term_start equally so."
        test_recipe:
          setup: ["Policy; SHAREHOLDER A; VACANT seat"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/board-seats", payload: { seat_label: "SEAT-3", seat_class: CLINICAL }, as: BoardAdmin, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /governance/board-seats/${s_id}/appoint", payload: { physician_id: "${a_id}", term_start: "2026-08-01T00:00:00Z", term_end: "2026-08-01T00:00:00Z" }, as: BoardAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_TERM_WINDOW_INVALID; seat stays VACANT"

      - name: capital_call_due_date_in_past_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", entities.CapitalCall.fields.due_date]
        distinguishing_aspect: "A CAPITAL_CALL motion whose due_date is not strictly after the current clock (2026-08-01 default) is a shape-level ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Policy; SHAREHOLDER A"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 50000, due_date: "2026-07-01T00:00:00Z", purpose: "Backdated" } }, as: Physician, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (due_date 2026-07-01 < clock 2026-08-01)"

      - name: vote_invalid_enum_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", entities.Vote.fields.vote_choice]
        distinguishing_aspect: "vote_choice outside {FOR, AGAINST, ABSTAIN} is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Policy quorum 1; SHAREHOLDER A; motion OPEN"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 50000, due_date: "2026-08-20T00:00:00Z", purpose: "Enum" } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: MAYBE }, as: Physician, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST; no vote recorded (votes list empty)"

      - name: body_fk_reference_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", entities.BuyInOffer.fields.physician_id]
        distinguishing_aspect: "A body FK referencing a nonexistent physician yields ERR_NOT_FOUND (404), distinct from a malformed-body 400."
        test_recipe:
          setup: ["Policy only"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/buy-in-offers", payload: { physician_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", target_tier: PARTNER_TRACK, share_grant: 0, installment_count: 1 }, as: BoardAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND, HTTP 404"

      - name: segregation_of_duties_comp_policy
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "SoD on compensation governance: the COMPENSATION committee CHAIR cannot SPONSOR a COMP_POLICY motion (create-time), and a COMP_POLICY sponsor cannot VOTE on their own motion (cast-time)."
        test_recipe:
          setup: ["Policy quorum 1; SHAREHOLDERs S (COMP committee CHAIR), T, U; committee ACTIVE (quorum 1)"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr S", hire_date: "2014-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr T", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr U", hire_date: "2016-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /governance/committees", payload: { name: "Compensation Committee", committee_type: COMPENSATION, quorum_count: 1, approval_threshold: SIMPLE_MAJORITY }, as: BoardAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /governance/committees/${c_id}/members", payload: { physician_id: "${s_id}", committee_role: CHAIR }, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/motions", payload: { motion_type: COMP_POLICY, sponsor_physician_id: "${s_id}", payload: { new_bonus_pool_pct: 0.30 } }, as: Physician, as_user_id: "${s_id}", captures: { err_chair: $.data.error_id } }
            - { call: "POST /governance/motions", payload: { motion_type: COMP_POLICY, sponsor_physician_id: "${t_id}", payload: { new_bonus_pool_pct: 0.30 } }, as: Physician, as_user_id: "${t_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${t_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${t_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${t_id}", captures: { err_sod: $.data.error_id } }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${u_id}" }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/policy", as: BoardAdmin }
          assert:
            - "err_chair == ERR_SEGREGATION_OF_DUTIES (COMP chair sponsoring COMP_POLICY)"
            - "err_sod == ERR_SEGREGATION_OF_DUTIES (sponsor T voting own COMP_POLICY)"
            - "U's vote succeeds; close ADOPTED; GovernancePolicy.bonus_pool_pct == 0.3 and comp_policy_version == 1"

      - name: physician_exiting_blocked_from_offer_and_sponsorship
        claim_type: violation_to_error
        grounds: ["errors[ERR_PHYSICIAN_EXITING]"]
        distinguishing_aspect: "An EXITING physician (valuation initiated) is fenced off from new commitments: new buy-in offers and motion sponsorship both fail with ERR_PHYSICIAN_EXITING."
        test_recipe:
          setup: ["Policy; SHAREHOLDER X with an INITIATED exit valuation (status EXITING)"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr X", hire_date: "2010-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { x_id: $.data.id } }
            - { call: "POST /governance/exit-valuations", payload: { physician_id: "${x_id}", trigger_type: VOLUNTARY }, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/buy-in-offers", payload: { physician_id: "${x_id}", target_tier: SHAREHOLDER, share_grant: 100, installment_count: 1 }, as: BoardAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${x_id}", payload: { amount_cents: 50000, due_date: "2026-08-20T00:00:00Z", purpose: "Blocked" } }, as: Physician, as_user_id: "${x_id}", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_PHYSICIAN_EXITING and err2 == ERR_PHYSICIAN_EXITING"

      - name: installment_exact_amount_and_accepted_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSTALLMENT_AMOUNT_MISMATCH]", "errors[ERR_OFFER_NOT_OPEN]"]
        distinguishing_aspect: "Installments require the exact scheduled amount (4400000, not 4400001) and an ACCEPTED offer; paying an OFFERED (unaccepted) offer fails ERR_OFFER_NOT_OPEN."
        test_recipe:
          setup: ["Policy defaults; associate P hired 2024-01-01; offer PARTNER_TRACK 2 installments (schedule [4400000, 4400000])"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P", hire_date: "2024-01-01T00:00:00Z" }, as: BoardAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /governance/buy-in-offers", payload: { physician_id: "${p_id}", target_tier: PARTNER_TRACK, share_grant: 0, installment_count: 2 }, as: BoardAdmin, captures: { o_id: $.data.id } }
          trigger:
            - { call: "POST /governance/buy-in-offers/${o_id}/pay-installment", payload: { amount_cents: 4400000 }, as: Physician, as_user_id: "${p_id}", captures: { err_early: $.data.error_id } }
            - { call: "POST /governance/buy-in-offers/${o_id}/respond", payload: { decision: ACCEPT }, as: Physician, as_user_id: "${p_id}" }
            - { call: "POST /governance/buy-in-offers/${o_id}/pay-installment", payload: { amount_cents: 4400001 }, as: Physician, as_user_id: "${p_id}", captures: { err_amt: $.data.error_id } }
          assert:
            - "err_early == ERR_OFFER_NOT_OPEN (cannot pay before acceptance)"
            - "err_amt == ERR_INSTALLMENT_AMOUNT_MISMATCH (exact scheduled amount required)"
            - "BuyInOffer.${o_id}.paid_installment_count == 0 after both rejections"

      - name: treasury_share_cap_on_founding_and_buyin
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_TREASURY_SHARES]", calculations.ownership_recalc]
        distinguishing_aspect: "Share issuance is capped by the treasury: founding 800 of 1000 authorized succeeds; founding 300 more fails ERR_INSUFFICIENT_TREASURY_SHARES (200 remain)."
        test_recipe:
          setup: ["Policy with total_shares_authorized 1000; P1 founding with 800 shares"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P1", hire_date: "2010-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 800 }, as: BoardAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P2", hire_date: "2011-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 300 }, as: BoardAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSUFFICIENT_TREASURY_SHARES; treasury_shares remains 200"

  # ===================================================== 5. endpoints
  - section: endpoints
    instances:
      - name: physician_list_pagination_and_status_filter
        claim_type: listing
        grounds: [response_envelope, entities.Physician]
        distinguishing_aspect: "Pagination contract: default limit 10; limit=2 returns has_more true with total_count 3; offset=2 returns the last item; partnership_status filter narrows the set."
        test_recipe:
          setup: ["Policy; two SHAREHOLDERs and one ASSOCIATE created in order A, B, C"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 100 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr B", hire_date: "2016-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 100 }, as: BoardAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr C", hire_date: "2024-01-01T00:00:00Z" }, as: BoardAdmin, captures: { c_id: $.data.id } }
          trigger:
            - { call: "GET /governance/physicians?limit=2", as: BoardAdmin }
            - { call: "GET /governance/physicians?limit=2&offset=2", as: BoardAdmin }
            - { call: "GET /governance/physicians?partnership_status=SHAREHOLDER", as: ComplianceOfficer }
          assert:
            - "Page 1: data length 2 (A then B, created_at ASC), total_count == 3, has_more == true"
            - "Page 2 (offset 2): data length 1 (C), has_more == false"
            - "Filtered list: exactly 2 entries (A and B), no ASSOCIATE"

      - name: response_envelope_contract_success_and_error
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Every success body carries meta.api_request_id, meta.api_request_timestamp, response_type; every error body carries data.error_id and data.message."
        test_recipe:
          setup: ["Policy exists"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/physicians", payload: { full_name: "Dr E", hire_date: "2024-01-01T00:00:00Z" }, as: BoardAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr Broken" }, as: BoardAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Success response: meta.api_request_id present, response_type == object, data.id == ${p_id}"
            - "Error response: response_type == error, data.error_id == ERR_INVALID_REQUEST, data.message present"

      - name: fk_reverse_reachability_subresources
        claim_type: cross_reference_link
        grounds: [entities.Vote.fields.motion_id, entities.Vote.fields.physician_id, entities.CapitalCallAssessment.fields.capital_call_id]
        distinguishing_aspect: "Every FK is reverse-reachable: votes list under both the motion and the physician; assessments under both the call and the physician; motions filterable by sponsor/committee/supersedes."
        test_recipe:
          setup: ["Policy quorum 1; sole SHAREHOLDER A; CAPITAL_CALL motion adopted and billed; A voted FOR"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 50000, due_date: "2026-08-20T00:00:00Z", purpose: "FK" } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/capital-calls?motion_id=${m_id}", as: BoardAdmin, captures: { cc_id: "$.data[0].id" } }
            - { call: "POST /governance/capital-calls/${cc_id}/bill", payload: {}, as: BoardAdmin }
          trigger:
            - { call: "GET /governance/motions/${m_id}/votes", as: BoardAdmin }
            - { call: "GET /governance/physicians/${a_id}/votes", as: BoardAdmin }
            - { call: "GET /governance/capital-calls/${cc_id}/assessments", as: BoardAdmin }
            - { call: "GET /governance/physicians/${a_id}/assessments", as: BoardAdmin }
            - { call: "GET /governance/motions?sponsor_physician_id=${a_id}", as: BoardAdmin }
          assert:
            - "Both vote lists contain exactly A's FOR ballot (same vote id)"
            - "Both assessment lists contain exactly one 50000-cent assessment"
            - "Motion filter by sponsor returns exactly [${m_id}]"

  # ===================================================== 6. errors
  - section: errors
    instances:
      - name: error_overpayment_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_OVERPAYMENT]"]
        excluded_because: { difficulty_instance: "boundary_precision_check / assessment_pay_exact_remaining_boundary", rationale: "Asserted as the failure path of the named §1.8 instance." }
      - name: error_seat_overlap_and_successor_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEAT_TERM_OVERLAP]", "errors[ERR_SUCCESSOR_ALREADY_BOOKED]"]
        excluded_because: { difficulty_instance: "resource_temporal_overlap / board_seat_half_open_term_succession", rationale: "Both errors asserted in the named §1.8 instance." }
      - name: error_offer_window_overlap_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_OFFER_WINDOW_OVERLAP]", "errors[ERR_OFFER_NOT_OPEN]"]
        excluded_because: { difficulty_instance: "resource_temporal_overlap / buy_in_offer_closed_acceptance_window", rationale: "Both errors asserted in the named §1.8 instance." }
      - name: error_dispute_limit_trigger
