          assert:
            - "${err} == ERR_STALE_ROUTE_VERSION with HTTP 412"
            - "GET /routes/${route_id}/design-packages returns 0 rows immediately after the first trigger"
            - "the second trigger returns HTTP 201 with ${rev} == 1, because the refused create never counted toward the revision sequence"
