  # ==========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_certify
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Pair (state, business_safety): when certify is called on a Lease already
          CERTIFIED (state violation) AND X-User-ID happens to equal abstractor_user_id
          (would also violate segregation), priority 6 state fires first with
          ERR_INVALID_STATE — the safety check never evaluates. Different pair from
          reconciliation approve conflict.
        test_recipe:
          setup:
            - "Lease L1 DRAFT, abstraction_status=CERTIFIED (abstracted by user 'abs-1', certified by 'cert-1')"
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: NNN, pro_rata_share_bps: 4000, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/abstract"
              payload: {}
              as: Abstractor
              as_user_id: "abs-1"
            - call: "POST /lease-admin/leases/${lease_id}/certify"
              payload: {}
              as: Certifier
              as_user_id: "cert-1"
          trigger:
            - call: "POST /lease-admin/leases/${lease_id}/certify"
              payload: {}
              as: Certifier
              as_user_id: "abs-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE   # already CERTIFIED, state check fires before segregation"
            - "err != ERR_SEGREGATION_OF_DUTIES"

      - name: state_vs_business_fiscal_on_recon_close
        grounds:
