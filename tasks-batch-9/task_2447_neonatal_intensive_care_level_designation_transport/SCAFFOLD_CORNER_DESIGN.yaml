              payload: { unit_id: "${unit_a}", requested_level: "LEVEL_II", assigned_nurse_count: 1 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { e_open_review: $.data.error_id }
            - call: "POST /designation-reviews/${rev_1}/submit"
              payload: {}
