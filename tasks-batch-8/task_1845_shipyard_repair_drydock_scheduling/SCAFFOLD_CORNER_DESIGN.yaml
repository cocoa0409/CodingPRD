      - name: change_budget_exceeded_on_clean_approval
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_CHANGE_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "With no competing higher-priority violation (change order UNDER_REVIEW, approver differs from proposer), the fiscal check itself fires: approving a 200000-cent order against a 100000-cent budget returns ERR_CHANGE_BUDGET_EXCEEDED."
        test_recipe:
