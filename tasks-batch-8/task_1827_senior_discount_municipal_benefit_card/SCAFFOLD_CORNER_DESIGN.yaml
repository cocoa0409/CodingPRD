            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "WI2-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
