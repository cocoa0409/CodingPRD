            - call: "POST /blood-bank/crossmatches/${xm1}/record-result"
              payload: { result: "COMPATIBLE" }
              as: BloodBankTechnologist
              as_user_id: "tech-b"
            - call: "POST /blood-bank/crossmatches"
              payload: { order_id: "${ord1}", unit_id: "${u2}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { xm2: $.data.id }
            - call: "POST /blood-bank/crossmatches/${xm2}/record-result"
              payload: { result: "COMPATIBLE" }
              as: BloodBankTechnologist
              as_user_id: "tech-b"
          trigger:
            - call: "POST /blood-bank/crossmatches/${xm1}/cancel"
              as: BloodBankTechnologist
              as_user_id: "tech-a"
            - call: "POST /blood-bank/crossmatches"
              payload: { order_id: "${ord1}", unit_id: "${u1}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { xm3: $.data.id }
            - call: "POST /blood-bank/crossmatches/${xm3}/record-result"
              payload: { result: "COMPATIBLE" }
              as: BloodBankTechnologist
              as_user_id: "tech-b"
          assert:
            - "before trigger: TransfusionOrder.${ord1}.units_crossmatched == 2 and both units RESERVED"
            - "after cancel: units_crossmatched == 1, BloodUnit.${u1}.status == AVAILABLE, BloodUnit.${u2}.status == RESERVED, order == AWAITING_CROSSMATCH"
            - "after re-crossmatch round trip: units_crossmatched == 2, both units RESERVED, order == READY — symmetry restored with no drift"
            - "Crossmatch.${xm1}.status == CANCELLED and Crossmatch.${xm3}.status == COMPATIBLE"
      - name: wastage_ledger_parity
        grounds:
          - entities.WastageRecord
          - state_machines.BloodUnit.ISSUED_to_DISCARDED
        distinguishing_aspect: |
          Conserved quantity = event-ledger parity: every unit reaching a waste
          state {DISCARDED, EXPIRED} has EXACTLY one WastageRecord and every
          WastageRecord points at a unit in a waste state — across three
          different waste paths (manual discard, sweep expiry, 30-minute return
          rule).
        test_recipe:
          setup:
            - "clock 2026-08-10T09:00:00Z; U1 (RBC O NEG), U2 (PLT_APHERESIS O NEG, expires 2026-08-11T00:00:00Z), U3 (RBC O NEG) received and released"
            - "U3 issued to a patient at 09:00; U1 manually discarded"
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 2 }, { product_type: "PLT_APHERESIS", abo_type: "O", rh_type: "NEG", quantity: 1 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-521", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-930", lot_number: "LOT-12", antigen_negative: [] }, { unit_number: "U-522", product_type: "PLT_APHERESIS", abo_type: "O", rh_type: "NEG", volume_ml: 200, collected_at: "2026-08-06T00:00:00Z", donor_id: "D-931", lot_number: "LOT-12", antigen_negative: [] }, { unit_number: "U-523", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-932", lot_number: "LOT-12", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-521"
              as: BloodBankTechnologist
              captures: { u1: "$.data[0].id" }
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-522"
              as: BloodBankTechnologist
              captures: { u2: "$.data[0].id" }
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-523"
              as: BloodBankTechnologist
              captures: { u3: "$.data[0].id" }
            - call: "POST /blood-bank/blood-units/${u1}/release-from-quarantine"
              as: BloodBankTechnologist
            - call: "POST /blood-bank/blood-units/${u3}/release-from-quarantine"
              as: BloodBankTechnologist
            - call: "POST /blood-bank/blood-units/${u1}/discard"
              payload: { note: "damaged in handling" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/patients"
              payload: { mrn: "M-9052", full_name: "Pat Fiftytwo", date_of_birth: "1995-09-09", special_requirements: [] }
              as: BloodBankTechnologist
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /blood-bank/type-and-screens"
              payload: { patient_id: "${pat_id}", specimen_collected_at: "2026-08-10T08:00:00Z", expected_patient_version: "${pat_v}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { ts_id: $.data.id }
            - call: "POST /blood-bank/type-and-screens/${ts_id}/result"
              payload: { abo_result: "A", rh_result: "POS", antibody_screen: "NEGATIVE", antibody_identifications: [] }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
            - call: "POST /blood-bank/type-and-screens/${ts_id}/validate"
              as: BloodBankTechnologist
              as_user_id: "tech-b"
            - call: "POST /blood-bank/transfusion-orders"
              payload: { patient_id: "${pat_id}", product_type: "RBC", units_requested: 1, urgency: "ROUTINE", indication_code: "ANEMIA" }
              as: OrderingPhysician
              as_user_id: "doc-1"
              captures: { ord1: $.data.id }
            - call: "POST /blood-bank/transfusion-orders/${ord1}/verify"
              as: BloodBankTechnologist
              as_user_id: "tech-a"
            - call: "POST /blood-bank/crossmatches"
              payload: { order_id: "${ord1}", unit_id: "${u3}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { xm3: $.data.id }
            - call: "POST /blood-bank/crossmatches/${xm3}/record-result"
              payload: { result: "COMPATIBLE" }
              as: BloodBankTechnologist
              as_user_id: "tech-b"
            - call: "POST /blood-bank/issue-records"
              payload: { order_id: "${ord1}", unit_id: "${u3}", verified_by_user_id: "tech-b" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { iss3: $.data.id }
          trigger:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/_clock/sweep"
              as: BloodBankSupervisor
            - call: "POST /blood-bank/issue-records/${iss3}/return"
              payload: { seal_intact: true, temperature_excursion: false }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
            - call: "GET /blood-bank/wastage-records"
              as: QualityOfficer
          assert:
            - "GET /wastage-records -> total_count == 3 with reasons {MANUAL (U1), EXPIRED (U2), RETURNED_OVER_30MIN (U3)}"
            - "GET /blood-units?status=DISCARDED -> total_count == 2 (U1, U3); GET /blood-units?status=EXPIRED -> total_count == 1 (U2)"
            - "waste-state units (3) == wastage records (3) — exact 1:1 parity across all three waste paths"
            - "every WastageRecord.quantity_units == 1"
