# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2931 — Self-Order Kiosk & Digital Menu Board Content Management
#
# Canonical fixture facts every instance below reuses (all literals pre-computed
# with the §1.3 formulas and their §1.3 constants):
#   ZONE_A: price_multiplier_bp 11000, NINE_ENDING, tax_rate_bp 875, max_uplift_bp 1500
#   ZONE_B: price_multiplier_bp 12000, NONE,        tax_rate_bp 700, max_uplift_bp 2000
#   Item A (base 500) in ZONE_A -> 500*1.1 = 550 -> NINE_ENDING -> 559
#   Item B (base 310) in ZONE_A -> 310*1.1 = 341 -> NINE_ENDING -> 349
#   Item A (base 500) in ZONE_B -> 500*1.2 = 600 -> NONE         -> 600
#   Store S001 timezone_offset_minutes -300; clock 2026-08-05T17:00:00Z
#     -> local minute of day 1020 - 300 = 720, inside LUNCH [660, 960), phase ACTIVE
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: board_snapshot_price_versus_kiosk_charge_price
        grounds:
          - calculations.effective_zone_price
          - entities.ContentBundle.fields.price_snapshot
          - entities.MenuItem.fields.zone_price_overrides
          - state_machines.PriceChangeRequest.APPROVED_to_APPLIED
          - entities.OrderHandoff.fields.subtotal_cents
        distinguishing_aspect: |
          This dual-variant pair lives in the PRICING domain (MenuItem x PriceZone x
          ContentBundle): board_display_price is read from the bundle's frozen
          price_snapshot (559) while kiosk_charge_price is recomputed live from the
          applied zone override (599), so one identical GET and POST pair returns two
          different cent values for the same item at the same instant.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001 (offset -300) exist."
            - "Item A (base 500) and Item B (base 310) are READY; a bundle with a LUNCH slot [660,960) is PUBLISHED, freezing Item A's ZONE_A board price at 559."
            - "Kiosk K001 is attested COMPLIANT, has heartbeat all-ok (rolling 100, ONLINE) and cache_state FRESH on that bundle."
            - "A PriceChangeRequest for Item A in ZONE_A proposing 590 has been SUBMITTED, APPROVED twice (uplift 555 bp needs 2 approvals) and APPLIED, writing override price_cents 599."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger with lettuce and tomato", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-FRIES", display_name: "Seasoned Fries", category: "SIDE", base_price_cents: 310, screen_reader_text: "Seasoned fries, regular size", contrast_ratio: 6.2 }
              as: ContentManager
              captures: { item_b_id: $.data.id }
            - call: "POST /kiosk-ops/content-bundles"
              payload: { cluster_id: "${cl_id}", effective_from_utc: "2026-08-05T00:00:00Z" }
              as: ContentManager
              captures: { bundle_id: $.data.id, bundle_ver: $.data.version }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${bundle_ver}", daypart_code: "LUNCH", start_minute_of_day: 660, end_minute_of_day: 960, layout_code: "LUNCH_GRID", buffer_minutes: 15, category_codes: ["ENTREE", "SIDE"] }
              as: ContentManager
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "ACCESSIBILITY_AUDIT", audit_result: "PASS" }
              as: ComplianceOfficer
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "VALIDATE" }
              as: ContentManager
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "PUBLISH" }
              as: ContentManager
            - call: "POST /kiosk-ops/stores/${store_id}/item-availabilities"
              payload: { menu_item_id: "${item_a_id}", on_hand_units: 40, reserved_units: 0, par_units: 20 }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { avail_a_id: $.data.id }
            - call: "POST /kiosk-ops/devices"
              payload: { store_id: "${store_id}", device_kind: "KIOSK", device_code: "K001", offline_cache_capacity: 2, pin_pad_firmware_version: "1.4.2" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /kiosk-ops/devices/${dev_id}/payment-attestation"
              payload: { pin_pad_firmware_version: "1.4.2", p2pe_certified: true, attestation_expiry_utc: "2027-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /kiosk-ops/devices/${dev_id}/heartbeat"
              payload: { printer_ok: true, touch_ok: true, screen_reader_ok: true, network_ok: true }
              as: DeviceAgent
              as_user_id: "${dev_id}"
            - call: "POST /kiosk-ops/devices/${dev_id}/cache-sync"
              payload: { bundle_id: "${bundle_id}" }
              as: DeviceAgent
              as_user_id: "${dev_id}"
            - call: "GET /kiosk-ops/menu-items/${item_a_id}"
              payload: {}
              as: PricingAnalyst
              captures: { item_a_ver: $.data.version }
            - call: "POST /kiosk-ops/price-change-requests"
              payload: { menu_item_id: "${item_a_id}", price_zone_id: "${zone_a_id}", proposed_price_cents: 590, justification: "Beef cost increase Q3", effective_from_utc: "2026-08-05T17:00:00Z", expected_menu_item_version: "${item_a_ver}" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
              captures: { pcr_id: $.data.id }
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "SUBMIT" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPROVE", comment: "First approval" }
              as: PricingApprover
              as_user_id: "u_approver_1"
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPROVE", comment: "Second approval" }
              as: PricingApprover
              as_user_id: "u_approver_2"
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPLY" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
          trigger:
            - call: "GET /kiosk-ops/stores/${store_id}/menu-projection"
              payload: { device_id: "${dev_id}" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /kiosk-ops/devices/${dev_id}/orders"
              payload: { line_items: [{ menu_item_id: "${item_a_id}", qty: 1 }], tender_kind: "CARD" }
              as: DeviceAgent
              as_user_id: "${dev_id}"
              captures: { order_id: $.data.id }
          assert:
            - "menu-projection response items entry for ${item_a_id} has price_cents == 559 (board_display_price, read from ContentBundle.price_snapshot)"
            - "menu-projection response stale_prices == true"
            - "OrderHandoff.${order_id}.priced_lines[0].unit_price_cents == 599 (kiosk_charge_price, recomputed live)"
            - "OrderHandoff.${order_id}.subtotal_cents == 599"
            - "OrderHandoff.${order_id}.tax_cents == 52"
            - "OrderHandoff.${order_id}.total_cents == 651"
            - "The two variants differ by exactly 40 cents for the same item at the same clock instant"

      - name: rolling_versus_worst_case_device_health_score
        grounds:
          - calculations.device_health_score
          - entities.Device.fields.rolling_health_score
          - entities.Device.fields.worst_case_health_score
          - entities.Device.fields.health_state
          - state_machines.Device.health_state=OFFLINE_to_health_state=ONLINE
        distinguishing_aspect: |
          This dual-variant pair lives in the DEVICE-TELEMETRY domain (Device), not the
          pricing domain: from one identical heartbeat payload the rolling variant scores
          80 and bands the kiosk ONLINE while the worst-case variant scores 50 on the same
          row, and quarantine is withheld because consecutive_missed_heartbeats (0) is
          below QUARANTINE_MISS_FLOOR (3).
        test_recipe:
          setup:
            - "Clock at 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST and store S001 exist."
            - "Kiosk K001 is registered at S001 and has reported exactly one heartbeat with printer_ok false and the other three channels true."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/devices"
              payload: { store_id: "${store_id}", device_kind: "KIOSK", device_code: "K001", offline_cache_capacity: 2, pin_pad_firmware_version: "1.4.2" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /kiosk-ops/devices/${dev_id}/heartbeat"
              payload: { printer_ok: false, touch_ok: true, screen_reader_ok: true, network_ok: true }
              as: DeviceAgent
              as_user_id: "${dev_id}"
          trigger:
            - call: "GET /kiosk-ops/devices/${dev_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Device.${dev_id}.consecutive_missed_heartbeats == 0"
            - "Device.${dev_id}.rolling_health_score == 80"
            - "Device.${dev_id}.worst_case_health_score == 50"
            - "Device.${dev_id}.health_state == ONLINE"
            - "Device.${dev_id}.health_state != QUARANTINED (worst_case 50 is not below 50 and missed 0 < QUARANTINE_MISS_FLOOR 3)"

  - rule_id: combinatorial_formula
    instances:

      - name: per_line_rounded_campaign_discount_mode_b
        grounds:
          - calculations.order_total_with_campaign_discount
          - calculations.campaign_selection
          - entities.OrderHandoff.fields.discount_cents
          - entities.PromoCampaignVersion.fields.discount_value
          - state_machines.PromoCampaignVersion.SCHEDULED_to_ACTIVE
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters: the pinned rule rounds each
          line's 15% discount before summing (335 + 209 = 544), whereas rounding the summed
          exact discount (544.8) yields 545; the one-cent divergence then propagates into
          tax and total, so 3358 and 3357 are distinguishable outcomes of the same cart.
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A (multiplier 11000, NINE_ENDING, tax 875 bp), cluster CL_WEST, store S001 (offset -300)."
            - "Item A priced 559 and Item B priced 349 in ZONE_A; both stocked at S001 (40 on hand)."
            - "A bundle with a LUNCH slot [660,960) over categories ENTREE and SIDE is PUBLISHED; kiosk K001 is COMPLIANT, ONLINE and cache FRESH."
            - "Campaign SUMMER15 v1 (PERCENT_OFF 1500 bp, stacking_group BASE, priority_rank 10, window 2026-08-05T00:00:00Z..2026-08-31T23:59:59Z) is SCHEDULED and therefore ACTIVE at the clock."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-FRIES", display_name: "Seasoned Fries", category: "SIDE", base_price_cents: 310, screen_reader_text: "Seasoned fries", contrast_ratio: 6.2 }
              as: ContentManager
              captures: { item_b_id: $.data.id }
            - call: "POST /kiosk-ops/content-bundles"
              payload: { cluster_id: "${cl_id}", effective_from_utc: "2026-08-05T00:00:00Z" }
              as: ContentManager
              captures: { bundle_id: $.data.id, bundle_ver: $.data.version }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${bundle_ver}", daypart_code: "LUNCH", start_minute_of_day: 660, end_minute_of_day: 960, layout_code: "LUNCH_GRID", buffer_minutes: 15, category_codes: ["ENTREE", "SIDE"] }
              as: ContentManager
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "ACCESSIBILITY_AUDIT", audit_result: "PASS" }
              as: ComplianceOfficer
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "VALIDATE" }
              as: ContentManager
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "PUBLISH" }
              as: ContentManager
            - call: "POST /kiosk-ops/stores/${store_id}/item-availabilities"
              payload: { menu_item_id: "${item_a_id}", on_hand_units: 40, reserved_units: 0, par_units: 20 }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { avail_a_id: $.data.id }
            - call: "POST /kiosk-ops/stores/${store_id}/item-availabilities"
              payload: { menu_item_id: "${item_b_id}", on_hand_units: 40, reserved_units: 0, par_units: 12 }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { avail_b_id: $.data.id }
            - call: "POST /kiosk-ops/devices"
              payload: { store_id: "${store_id}", device_kind: "KIOSK", device_code: "K001", offline_cache_capacity: 2, pin_pad_firmware_version: "1.4.2" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /kiosk-ops/devices/${dev_id}/payment-attestation"
              payload: { pin_pad_firmware_version: "1.4.2", p2pe_certified: true, attestation_expiry_utc: "2027-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /kiosk-ops/devices/${dev_id}/heartbeat"
              payload: { printer_ok: true, touch_ok: true, screen_reader_ok: true, network_ok: true }
              as: DeviceAgent
              as_user_id: "${dev_id}"
            - call: "POST /kiosk-ops/devices/${dev_id}/cache-sync"
              payload: { bundle_id: "${bundle_id}" }
              as: DeviceAgent
              as_user_id: "${dev_id}"
            - call: "POST /kiosk-ops/campaign-versions"
              payload: { campaign_code: "SUMMER15", version_no: 1, cluster_id: "${cl_id}", discount_kind: "PERCENT_OFF", discount_value: 1500, window_start_utc: "2026-08-05T00:00:00Z", window_end_utc: "2026-08-31T23:59:59Z", stacking_group: "BASE", priority_rank: 10 }
              as: ContentManager
              captures: { camp_id: $.data.id }
            - call: "POST /kiosk-ops/campaign-versions/${camp_id}/actions"
              payload: { action: "SCHEDULE" }
              as: ContentManager
          trigger:
            - call: "POST /kiosk-ops/devices/${dev_id}/orders"
              payload: { line_items: [{ menu_item_id: "${item_a_id}", qty: 4 }, { menu_item_id: "${item_b_id}", qty: 4 }], tender_kind: "CARD" }
              as: DeviceAgent
              as_user_id: "${dev_id}"
              captures: { order_id: $.data.id }
          assert:
            - "OrderHandoff.${order_id}.applied_campaign_version_id == ${camp_id}"
            - "OrderHandoff.${order_id}.priced_lines[0].gross_line_cents == 2236 and priced_lines[0].line_discount_cents == 335"
            - "OrderHandoff.${order_id}.priced_lines[1].gross_line_cents == 1396 and priced_lines[1].line_discount_cents == 209"
            - "OrderHandoff.${order_id}.subtotal_cents == 3632"
            - "OrderHandoff.${order_id}.discount_cents == 544 (NOT 545)"
            - "OrderHandoff.${order_id}.tax_cents == 270"
            - "OrderHandoff.${order_id}.total_cents == 3358"

      - name: uplift_tier_pinned_evaluation_order_mode_c
        grounds:
          - calculations.price_uplift_and_approval_tier
          - calculations.effective_zone_price
          - entities.PriceChangeRequest.fields.uplift_bp
          - entities.PriceChangeRequest.fields.applied_price_cents
          - validations.priority_36_ERR_UPLIFT_CAP_EXCEEDED
          - state_machines.PriceChangeRequest.APPROVED_to_APPLIED
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency whose evaluation order is pinned: uplift_bp
          is derived once from the RAW proposal (642 against baseline 559 -> 1485 bp, inside
          ZONE_A's 1500 bp cap), and the APPLY-time NINE_ENDING price 649 must NOT feed back
          into it; re-deriving after rounding would give 1610 bp and wrongly reject the
          request, so the instance is falsified by any uplift_bp other than 1485.
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A (multiplier 11000, NINE_ENDING, max_uplift_bp 1500) with store S001 attached, so the zone is in use."
            - "Item A (base 500) has effective ZONE_A price 559 and no override yet."
            - "A PriceChangeRequest proposing 642 with effective_from_utc equal to the clock has been SUBMITTED and APPROVED twice."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id }
            - call: "GET /kiosk-ops/menu-items/${item_a_id}"
              payload: {}
              as: PricingAnalyst
              captures: { item_a_ver: $.data.version }
            - call: "POST /kiosk-ops/price-change-requests"
              payload: { menu_item_id: "${item_a_id}", price_zone_id: "${zone_a_id}", proposed_price_cents: 642, justification: "Premium bun upgrade", effective_from_utc: "2026-08-05T17:00:00Z", expected_menu_item_version: "${item_a_ver}" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
              captures: { pcr_id: $.data.id, uplift_at_creation: $.data.uplift_bp }
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "SUBMIT" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPROVE" }
              as: PricingApprover
              as_user_id: "u_approver_1"
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPROVE" }
              as: PricingApprover
              as_user_id: "u_approver_2"
          trigger:
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPLY" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "PriceChangeRequest.${pcr_id}.baseline_price_cents == 559"
            - "PriceChangeRequest.${pcr_id}.uplift_bp == 1485 both at creation and after APPLY (unchanged, never re-derived from 649)"
            - "PriceChangeRequest.${pcr_id}.required_approvals == 2"
            - "PriceChangeRequest.${pcr_id}.applied_price_cents == 649"
            - "PriceChangeRequest.${pcr_id}.state == APPLIED"
            - "MenuItem.${item_a_id}.zone_price_overrides has exactly 1 entry with price_zone_id == ${zone_a_id} and price_cents == 649"
            - "MenuItem.${item_a_id}.zone_override_total_cents == 649"
            - "No ERR_UPLIFT_CAP_EXCEEDED is raised even though 649 against 559 would be 1610 bp"

  - rule_id: non_linear_state_machine
    instances:

      - name: price_request_revision_cycle_reprices_the_approval_tier
        grounds:
          - state_machines.PriceChangeRequest.PENDING_APPROVAL_to_CHANGES_REQUESTED
          - state_machines.PriceChangeRequest.CHANGES_REQUESTED_to_PENDING_APPROVAL
          - entities.PriceChangeRequest.fields.revision_round
          - entities.PriceChangeRequest.fields.approval_user_ids
          - calculations.price_uplift_and_approval_tier
        distinguishing_aspect: |
          The non-linearity is a CYCLE on PriceChangeRequest: PENDING_APPROVAL ->
          CHANGES_REQUESTED -> PENDING_APPROVAL, and each lap is observable because
          revision_round increments to 1, approval_user_ids is emptied, and the re-derived
          tier drops from required_approvals 2 (proposal 590, 555 bp) to 1 (proposal 580,
          376 bp) — a linear pipeline could not reach the same state twice with new numbers.
