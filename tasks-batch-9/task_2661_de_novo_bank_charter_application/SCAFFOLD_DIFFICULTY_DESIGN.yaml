              as: CharterCounsel
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /de-novo/business-plans/${p_id}/stress-scenarios"
              payload: { scenario_code: "SEVERELY_ADVERSE", credit_loss_rate_bps: 185, nim_compression_bps: 40, expense_overrun_cents: 0 }
              as: CharterCounsel
