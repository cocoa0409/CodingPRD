          assert:
            - "stale expected_recipe_version rejected with ERR_STALE_RECIPE_VERSION (412)"
            - "fresh version accepted (201) — two strictly sequential requests, deterministic"
      - name: occ_stale_hopper_version_on_load
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[hopper-load-stale-version]", "errors[ERR_STALE_HOPPER_VERSION]"]
        distinguishing_aspect: "Two sequential loads carrying the same captured hopper version: the first succeeds and bumps version; the second with the stale expected_hopper_version is rejected with 412."
        test_recipe:
          setup: ["Restaurant R1; line L1; ingredient ING; hopper H1 capacity 2000 in LOADING (h1_v captured at creation)"]
          setup_api_calls:
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
