        source: input
        description: "Listing date, YYYY-MM-DD; the unsold window is measured from here."
      - name: sold_on
        type: string
        source: input
        description: "Sale date, YYYY-MM-DD, null until sold."
        default: null
      - name: gross_sale_price_cents
        type: integer
        source: input
        description: "Gross price realised at sale, null until sold."
        default: null
      - name: commission_cents
        type: integer
        source: computed
        description: "Vendor commission under the price-band tiers."
        default: 0
      - name: fees_cents
        type: integer
        source: computed
        description: "Pickup plus per-item photography fees."
        default: 0
      - name: net_proceeds_cents
        type: integer
        source: computed
        description: "gross_sale_price_cents minus commission_cents minus fees_cents, floored at 0."
        default: 0
      - name: item_count
        type: integer
        source: computed
        description: "Count of InventoryItem rows whose consignment_lot_id equals this ConsignmentLot.id."
        default: 0
      - name: credited
        type: boolean
        source: system
        description: "True once a CONSIGNMENT_CREDIT invoice line has been posted for this lot."
        default: false
      - name: reversed
        type: boolean
        source: system
        description: "True once a CONSIGNMENT_REVERSAL invoice line has been posted for this lot."
        default: false
      - name: disposal_fee_cents
        type: integer
        source: computed
        description: "Disposal fee charged when the lot is hauled away; 0 until HAULED."
        default: 0

  - name: Invoice
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement being billed. Exactly one Invoice per Engagement, created with it."
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle."
        default: "DRAFT"
        constraints: "one of DRAFT, ISSUED, DISPUTED, FINALIZED"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of InvoiceLine.amount_cents over lines whose line_type is not COORDINATION_FEE, CONSIGNMENT_CREDIT or CONSIGNMENT_REVERSAL."
        default: 0
      - name: credits_cents
        type: integer
        source: computed
        description: "Sum of InvoiceLine.amount_cents over lines whose line_type is CONSIGNMENT_CREDIT or CONSIGNMENT_REVERSAL; CONSIGNMENT_CREDIT lines are negative, CONSIGNMENT_REVERSAL lines are positive."
        default: 0
      - name: coordination_fee_cents
        type: integer
        source: computed
        description: "Coordination fee derived from subtotal_cents under a capped tier; see calculations.invoice_coordination_fee."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents plus coordination_fee_cents plus credits_cents."
        default: 0
      - name: payments_cents
        type: integer
        source: computed
        description: "Sum of all amounts recorded through POST /invoices/{id}/record-payment."
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "total_cents minus payments_cents; may be negative when overpaid."
        default: 0
      - name: recall_count
        type: integer
        source: system
        description: "Number of ISSUED to DRAFT recalls; capped by MAX_INVOICE_RECALLS."
        default: 0
      - name: dispute_count
        type: integer
        source: system
        description: "Number of ISSUED to DISPUTED transitions; capped by MAX_INVOICE_DISPUTES."
        default: 0
      - name: dispute_reason
        type: string
        source: input
        description: "Reason recorded on the open dispute."
        default: null
      - name: issued_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent issue."
        default: null
      - name: finalized_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of finalization."
        default: null

  - name: InvoiceLine
    parent: Invoice
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; the invoice this immutable ledger line belongs to."
      - name: source_consignment_lot_id
        type: string
        source: input
        description: "FK -> ConsignmentLot.id; the lot that produced this credit or reversal line, null for other line types."
        default: null
      - name: line_type
        type: enum
        source: input
        description: "Ledger line category."
        constraints: "one of PACKAGE_BASE, HOURLY_LABOR, OVERAGE_LABOR, TRAVEL_SURCHARGE, STAIRS_SURCHARGE, LONG_CARRY_SURCHARGE, VENDOR_PASSTHROUGH, DISPOSAL_FEE, CONSIGNMENT_CREDIT, CONSIGNMENT_REVERSAL, COORDINATION_FEE, MANUAL_ADJUSTMENT"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed amount in cents; credits are negative, charges positive."
      - name: memo
        type: string
        source: input
        description: "Human explanation of the line."
      - name: created_by_role
        type: string
        source: system
        description: "X-User-Role of the actor whose request produced the line, or SYSTEM for cascade-produced lines."

  - name: Milestone
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement whose timeline this milestone belongs to."
      - name: completed_by_party_id
        type: string
        source: input
        description: "FK -> PortalParty.id; party credited with completion, null until COMPLETE."
        default: null
      - name: milestone_key
        type: enum
        source: system
        description: "Which timeline step this row represents."
        constraints: "one of ASSESSMENT, SORT_PLAN, PACK, MOVE_DAY, SETTLE_IN, CLOSE_OUT"
      - name: sequence_index
        type: integer
        source: system
        description: "1 through 6 in timeline order; ASSESSMENT is 1 and CLOSE_OUT is 6."
      - name: status
        type: enum
        source: system
        description: "Milestone progress axis."
        default: "PENDING"
        constraints: "one of PENDING, IN_PROGRESS, COMPLETE, REOPENED"
      - name: overdue_status
        type: enum
        source: system
        description: "Latching lateness axis; once OVERDUE it never returns to ON_TIME."
        default: "ON_TIME"
        constraints: "one of ON_TIME, OVERDUE, RECOVERED"
      - name: due_on
        type: string
        source: computed
        description: "Due date YYYY-MM-DD derived from Engagement.scheduled_move_start_utc plus this milestone's day offset constant."
      - name: completed_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent completion."
        default: null
      - name: reopen_count
        type: integer
        source: system
        description: "Number of COMPLETE to REOPENED transitions; capped by MAX_MILESTONE_REOPENS."
        default: 0

  - name: UnpackSession
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement being settled in."
      - name: priority
        type: enum
        source: input
        description: "ESSENTIALS sessions must be started before STANDARD ones."
        constraints: "one of ESSENTIALS, STANDARD"
      - name: status
        type: enum
        source: system
        description: "Unpack session lifecycle."
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, IN_PROGRESS, COMPLETED, REOPENED"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "Planned session start instant."
      - name: items_unpacked_count
        type: integer
        source: computed
        description: "Count of InventoryItem rows whose unpack_session_id equals this session and whose handling_state is UNPACKED."
        default: 0
      - name: reopen_count
        type: integer
        source: system
        description: "Number of COMPLETED to REOPENED transitions; capped by MAX_UNPACK_REOPENS."
        default: 0
      - name: started_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent start."
        default: null

  - name: PunchListItem
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement the defect was found on."
      - name: unpack_session_id
        type: string
        source: input
        description: "FK -> UnpackSession.id; the session that surfaced the defect, null when raised outside a session."
        default: null
      - name: severity
        type: enum
        source: input
        description: "Drives the SLA window."
        constraints: "one of CRITICAL, MAJOR, MINOR"
      - name: status
        type: enum
        source: system
        description: "Punch item lifecycle."
        default: "OPEN"
        constraints: "one of OPEN, RESOLVED, REOPENED"
      - name: description
        type: string
        source: input
        description: "What is wrong."
      - name: resolution_note
        type: string
        source: input
        description: "How it was fixed."
        default: null
      - name: due_at_utc
        type: datetime
        source: computed
        description: "created_at plus the severity SLA hours constant."
      - name: breached_sla
        type: boolean
        source: computed
        description: "True when the current logical clock is strictly after due_at_utc and status is OPEN or REOPENED."
        default: false
      - name: reopen_count
        type: integer
        source: system
        description: "Number of RESOLVED to REOPENED transitions; capped by MAX_PUNCH_REOPENS."
        default: 0

# ---------------------------------------------------------------------------
# 1.2 STATE MACHINE TABLE
# 16 machines; 15 of them non-linear (cycles, self-loops, parallel axes on one
# entity, branching fork/join, capped retries, or reversal paths).
# ---------------------------------------------------------------------------
state_machines:

  - entity: Engagement
    axis: status
    shape: cyclic
    non_linear: true
    initial_state: ACTIVE
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /engagements/{id}/hold"
        actor: MOVE_MANAGER
        preconditions:
          - "Engagement.status == ACTIVE"
          - "reason is a non-empty string"
        side_effects:
          - "sets Engagement.hold_reason to the supplied reason"
          - "increments Engagement.hold_count by 1"
          - "increments Engagement.version by 1"
        note: "While ON_HOLD every mutating endpoint on the engagement subtree is refused by gate 3 except resume and cancel."
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /engagements/{id}/resume"
        actor: MOVE_MANAGER
        preconditions:
          - "Engagement.status == ON_HOLD"
        side_effects:
          - "clears Engagement.hold_reason to null"
          - "increments Engagement.version by 1"
        note: "Cycle: ACTIVE -> ON_HOLD -> ACTIVE, unbounded; hold_count records how often."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /engagements/{id}/cancel"
        actor: MOVE_MANAGER
        preconditions:
          - "Engagement.status == ACTIVE"
          - "the engagement's MoveDayPlan, when one exists, is not IN_PROGRESS"
        side_effects:
          - "sets Engagement.cancel_reason"
          - "cascade: every VendorAssignment of this engagement in status REQUESTED, ACCEPTED, SCHEDULED or COI_BLOCKED transitions to CANCELLED"
          - "cascade: every UnpackSession of this engagement in status SCHEDULED transitions to COMPLETED with items_unpacked_count unchanged"
          - "increments Engagement.version by 1"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /engagements/{id}/cancel"
        actor: MOVE_MANAGER
        preconditions:
          - "Engagement.status == ON_HOLD"
        side_effects:
          - "same cascade as the ACTIVE to CANCELLED transition"
          - "increments Engagement.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /engagements/{id}/close-out"
        actor: MOVE_MANAGER
        preconditions:
          - "Engagement.status == ACTIVE"
          - "the CLOSE_OUT Milestone of this engagement is COMPLETE"
          - "no PunchListItem of this engagement is in status OPEN or REOPENED"
          - "Engagement.billing_hold == false"
        side_effects:
          - "sets Engagement.closed_at_utc to the current logical clock"
          - "cascade: every VendorAssignment of this engagement in status SIGNED_OFF has its remaining holdback released, setting holdback_released to true and paid_cents to quoted_cents"
          - "cascade: the engagement Invoice transitions ISSUED -> FINALIZED; when the invoice is already FINALIZED this cascade is a no-op and close-out still succeeds"
          - "increments Engagement.version by 1"

  - entity: DestinationResidence
    axis: placement_status
    shape: cyclic
    non_linear: true
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /destination-residences/{id}/propose-placement"
        actor: MOVE_MANAGER
        preconditions:
          - "DestinationResidence.placement_status == DRAFT"
          - "DestinationResidence.room_count >= 1"
        side_effects:
          - "recomputes every child DestinationRoom.effective_capacity_linear_inches under the PROVISIONAL variant"
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /destination-residences/{id}/approve-placement"
        actor: "CLIENT or POWER_OF_ATTORNEY or MOVE_MANAGER"
        preconditions:
          - "DestinationResidence.placement_status == PROPOSED"
          - "the supplied approved_by_party_id resolves to a PortalParty on the same engagement"
          - "when the actor role is POWER_OF_ATTORNEY, PortalParty.can_approve_dispositions == true for that party"
        side_effects:
          - "sets approved_by_party_id and approved_at_utc"
          - "cascade: every child DestinationRoom.effective_capacity_linear_inches is recomputed under the APPROVED variant, which admits approved_addendum_linear_inches"
          - "cascade: each recomputed room refreshes headroom_linear_inches from its keep_load_linear_inches"
      - from: PROPOSED
        to: DRAFT
        trigger: "POST /destination-residences/{id}/revise-placement"
        actor: MOVE_MANAGER
        preconditions:
          - "DestinationResidence.placement_status == PROPOSED"
        side_effects:
          - "recomputes child room capacities under the PROVISIONAL variant"
        note: "Cycle leg 1: DRAFT -> PROPOSED -> DRAFT."
      - from: APPROVED
        to: DRAFT
        trigger: "POST /destination-residences/{id}/revise-placement"
        actor: MOVE_MANAGER
        preconditions:
          - "DestinationResidence.placement_status == APPROVED"
          - "no InventoryItem assigned to a room of this residence has handling_state DELIVERED or UNPACKED"
        side_effects:
          - "increments placement_revision by 1"
          - "clears approved_by_party_id and approved_at_utc to null"
          - "cascade: every child DestinationRoom.effective_capacity_linear_inches drops back to the PROVISIONAL variant, which excludes approved_addendum_linear_inches"
        note: "Cycle leg 2: APPROVED -> DRAFT. Capacity shrinking here can make an already-KEEP room over capacity; the scaffold pins that headroom_linear_inches is allowed to persist negative and that only NEW designations are blocked, see validations rung 68."

  - entity: InventoryItem
    axis: disposition
    shape: cyclic
    non_linear: true
    initial_state: UNDECIDED
    terminal_states: []
    transitions:
      - from: UNDECIDED
        to: KEEP
        trigger: "POST /inventory-items/{id}/designate with disposition KEEP"
        actor: "MOVE_MANAGER or CLIENT or POWER_OF_ATTORNEY"
        preconditions:
          - "InventoryItem.disposition_locked == false"
          - "InventoryItem.hold_state == NONE"
          - "assigned_room_id is supplied and the room's post-assignment keep load fits, see validations rung 68"
        side_effects:
          - "sets assigned_room_id"
          - "recomputes the target DestinationRoom.keep_load_linear_inches, keep_load_volume_cft and headroom_linear_inches"
          - "recomputes Engagement.keep_volume_cft"
      - from: UNDECIDED
        to: DONATE
        trigger: "POST /inventory-items/{id}/designate with disposition DONATE"
        actor: "MOVE_MANAGER or CLIENT or POWER_OF_ATTORNEY"
        preconditions:
          - "InventoryItem.disposition_locked == false"
          - "InventoryItem.hold_state == NONE"
        side_effects:
          - "recomputes InventoryItem.donation_receipt_cents under the variant selected by appraisal_source"
      - from: UNDECIDED
        to: SELL
        trigger: "POST /inventory-items/{id}/designate with disposition SELL"
        actor: "MOVE_MANAGER or CLIENT or POWER_OF_ATTORNEY"
        preconditions:
          - "InventoryItem.disposition_locked == false"
          - "InventoryItem.hold_state == NONE"
          - "InventoryItem.appraised_value_cents >= CONSIGN_MIN_VALUE_CENTS"
        side_effects:
          - "clears assigned_room_id to null"
      - from: UNDECIDED
        to: HAUL_AWAY
        trigger: "POST /inventory-items/{id}/designate with disposition HAUL_AWAY"
        actor: "MOVE_MANAGER or CLIENT or POWER_OF_ATTORNEY"
        preconditions:
          - "InventoryItem.disposition_locked == false"
          - "InventoryItem.hold_state == NONE"
        side_effects:
          - "recomputes Engagement.haul_volume_cft; NO vendor assignment is auto-created here, that happens only in the sort-plan approval cascade"
      - from: KEEP
        to: DONATE
        trigger: "POST /inventory-items/{id}/designate with disposition DONATE"
        actor: "MOVE_MANAGER or CLIENT or POWER_OF_ATTORNEY"
        preconditions:
          - "InventoryItem.disposition_locked == false"
          - "InventoryItem.hold_state == NONE"
        side_effects:
          - "clears assigned_room_id to null"
          - "recomputes the vacated DestinationRoom.keep_load_linear_inches and headroom_linear_inches"
          - "increments InventoryItem.redesignation_count by 1"
          - "recomputes Engagement.keep_volume_cft"
        note: "Representative of the fully reversible mesh: any of the five disposition values may move to any other while disposition_locked is false and hold_state is NONE."
      - from: DONATE
        to: KEEP
        trigger: "POST /inventory-items/{id}/designate with disposition KEEP"
        actor: "MOVE_MANAGER or CLIENT or POWER_OF_ATTORNEY"
        preconditions:
          - "InventoryItem.disposition_locked == false"
          - "InventoryItem.hold_state == NONE"
          - "assigned_room_id supplied and the space-fit check at rung 68 passes"
        side_effects:
          - "sets assigned_room_id, recomputes room load and headroom"
          - "sets donation_receipt_cents back to 0"
          - "increments InventoryItem.redesignation_count by 1"
        note: "Reverse leg of the KEEP/DONATE cycle."
      - from: SELL
        to: HAUL_AWAY
        trigger: "POST /inventory-items/{id}/designate with disposition HAUL_AWAY"
        actor: MOVE_MANAGER
        preconditions:
          - "InventoryItem.disposition_locked == false"
          - "InventoryItem.hold_state == NONE"
          - "InventoryItem.consignment_lot_id == null"
        side_effects:
          - "recomputes Engagement.haul_volume_cft"
          - "increments InventoryItem.redesignation_count by 1"
      - from: KEEP
        to: KEEP
        trigger: "POST /inventory-items/{id}/designate with disposition KEEP and a different assigned_room_id"
        actor: "MOVE_MANAGER or CLIENT or POWER_OF_ATTORNEY"
        preconditions:
          - "InventoryItem.disposition_locked == false"
          - "InventoryItem.hold_state == NONE"
          - "the new room passes the space-fit check at rung 68"
        side_effects:
          - "recomputes both the vacated and the target DestinationRoom load and headroom"
          - "increments InventoryItem.redesignation_count by 1"
        note: "Self-loop: a room move is a KEEP-to-KEEP transition, not a no-op."

  - entity: InventoryItem
    axis: handling_state
    shape: branching
    non_linear: true
    initial_state: AT_ORIGIN
    terminal_states: [UNPACKED, REMOVED]
    transitions:
      - from: AT_ORIGIN
        to: PACKED
        trigger: "POST /inventory-items/{id}/advance-handling with target_handling_state PACKED"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "InventoryItem.disposition == KEEP"
          - "the engagement's SortPlan status is APPROVED or FROZEN"
        side_effects:
          - "stamps updated_at"
        note: "Branch A of the fork: KEEP items go PACKED -> LOADED -> DELIVERED -> UNPACKED."
      - from: PACKED
        to: LOADED
        trigger: "POST /inventory-items/{id}/advance-handling with target_handling_state LOADED"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "the engagement's MoveDayPlan status is IN_PROGRESS"
        side_effects: ["stamps updated_at"]
      - from: LOADED
        to: DELIVERED
        trigger: "POST /inventory-items/{id}/advance-handling with target_handling_state DELIVERED"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "the engagement's MoveDayPlan status is IN_PROGRESS or COMPLETED"
          - "InventoryItem.assigned_room_id is not null"
        side_effects: ["stamps updated_at"]
      - from: DELIVERED
        to: UNPACKED
        trigger: "POST /inventory-items/{id}/advance-handling with target_handling_state UNPACKED and an unpack_session_id"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "the supplied UnpackSession belongs to the same engagement and is IN_PROGRESS"
        side_effects:
          - "sets InventoryItem.unpack_session_id"
          - "cascade: increments UnpackSession.items_unpacked_count"
      - from: AT_ORIGIN
        to: STAGED_FOR_PICKUP
        trigger: "POST /inventory-items/{id}/advance-handling with target_handling_state STAGED_FOR_PICKUP"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "InventoryItem.disposition is DONATE, SELL or HAUL_AWAY"
          - "the engagement's SortPlan status is APPROVED or FROZEN"
          - "InventoryItem.hold_state == NONE"
        side_effects: ["stamps updated_at"]
        note: "Branch B of the fork: non-KEEP items go STAGED_FOR_PICKUP -> REMOVED."
      - from: STAGED_FOR_PICKUP
        to: REMOVED
        trigger: "POST /inventory-items/{id}/advance-handling with target_handling_state REMOVED"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "at least one VendorAssignment on the engagement whose service_kind matches the item's disposition family is in status PERFORMED, SIGNED_OFF or PAID"
        side_effects:
          - "recomputes Engagement.haul_volume_cft when disposition is HAUL_AWAY"

  - entity: FamilyHold
    axis: status
    shape: cyclic
    non_linear: true
    initial_state: OPEN
    terminal_states: [RESOLVED_KEEP, RESOLVED_RELEASE, WITHDRAWN]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "POST /family-holds/{id}/escalate"
        actor: "MOVE_MANAGER or FAMILY_MEMBER"
        preconditions:
          - "FamilyHold.status == OPEN"
          - "FamilyHold.escalation_count < MAX_HOLD_ESCALATIONS"
        side_effects:
          - "increments escalation_count by 1"
          - "the item's hold_state stays HELD"
      - from: ESCALATED
        to: OPEN
        trigger: "POST /family-holds/{id}/remand"
        actor: MOVE_MANAGER
        preconditions:
          - "FamilyHold.status == ESCALATED"
          - "FamilyHold.remand_count < MAX_HOLD_ESCALATIONS"
        side_effects:
          - "increments remand_count by 1"
        note: "Cycle: OPEN -> ESCALATED -> OPEN, each direction capped at MAX_HOLD_ESCALATIONS."
      - from: OPEN
        to: RESOLVED_KEEP
        trigger: "POST /family-holds/{id}/resolve with resolution KEEP"
        actor: "MOVE_MANAGER or CLIENT or POWER_OF_ATTORNEY"
        preconditions:
          - "FamilyHold.status is OPEN or ESCALATED"
          - "the acting party holds the disposition authority required by gate 4 when the item's appraised_value_cents exceeds HIGH_VALUE_DISPOSITION_THRESHOLD_CENTS"
        side_effects:
          - "sets resolved_by_party_id and resolution_note"
          - "cascade: the InventoryItem disposition is forced to KEEP and assigned_room_id is left unchanged"
          - "cascade: the item's hold_state recomputes to NONE when no other hold on it is OPEN or ESCALATED"
      - from: ESCALATED
        to: RESOLVED_RELEASE
        trigger: "POST /family-holds/{id}/resolve with resolution RELEASE"
        actor: "MOVE_MANAGER or CLIENT or POWER_OF_ATTORNEY"
        preconditions:
          - "FamilyHold.status is OPEN or ESCALATED"
        side_effects:
          - "sets resolved_by_party_id and resolution_note"
          - "cascade: the item's hold_state recomputes to NONE when no other hold on it is OPEN or ESCALATED, leaving the disposition unchanged"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /family-holds/{id}/withdraw"
        actor: "MOVE_MANAGER or FAMILY_MEMBER"
        preconditions:
          - "FamilyHold.status == OPEN"
          - "when the acting role is FAMILY_MEMBER, X-User-ID equals FamilyHold.raised_by_party_id"
        side_effects:
          - "cascade: the item's hold_state recomputes to NONE when no other hold on it is OPEN or ESCALATED"

  - entity: SortPlan
    axis: status
    shape: cyclic
    non_linear: true
    initial_state: DRAFT
    terminal_states: [FROZEN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sort-plans/{id}/submit"
        actor: MOVE_MANAGER
        preconditions:
          - "SortPlan.status == DRAFT"
          - "the engagement has at least one InventoryItem"
          - "no InventoryItem of the engagement has hold_state HELD"
        side_effects:
          - "sets undecided_count_at_submit to the count of the engagement's items whose disposition is UNDECIDED"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /sort-plans/{id}/approve"
        actor: "MOVE_MANAGER or CLIENT or POWER_OF_ATTORNEY"
        preconditions:
          - "SortPlan.status == SUBMITTED"
          - "SortPlan.undecided_count_at_submit == 0"
          - "when the actor role is POWER_OF_ATTORNEY, the acting party's can_approve_dispositions is true and its active_authority_ceiling_cents is at least the highest appraised_value_cents among the engagement's non-KEEP items"
        side_effects:
          - "sets approved_by_party_id"
          - "cascade hop 1: every InventoryItem of the engagement whose disposition is not UNDECIDED gets disposition_locked set to true, and SortPlan.locked_item_count is refreshed"
          - "cascade hop 2: for every now-locked item whose disposition is HAUL_AWAY, Engagement.haul_volume_cft is recomputed"
          - "cascade hop 3: when the recomputed Engagement.haul_volume_cft is at least HAUL_MIN_LOAD_CFT and no HAUL_AWAY VendorAssignment already exists for the engagement, one is auto-created in status REQUESTED against the first Vendor whose vendor_type is JUNK_HAUL ordered by Vendor.created_at ascending, with service_kind HAUL_AWAY, quoted_cents HAUL_AUTO_QUOTE_CENTS and service_date equal to the UTC date of Engagement.scheduled_move_start_utc; when no JUNK_HAUL vendor exists no assignment is created and the approval still succeeds"
          - "cascade hop 4: the SORT_PLAN Milestone transitions IN_PROGRESS -> COMPLETE, which starts the PACK Milestone and therefore moves Engagement.phase to PACK"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /sort-plans/{id}/reject"
        actor: "MOVE_MANAGER or CLIENT or POWER_OF_ATTORNEY"
        preconditions:
          - "SortPlan.status == SUBMITTED"
          - "reason is a non-empty string"
        side_effects:
          - "sets rejected_reason"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /sort-plans/{id}/reopen"
        actor: MOVE_MANAGER
        preconditions:
          - "SortPlan.status == REJECTED"
          - "SortPlan.reopen_count < MAX_SORT_PLAN_REOPENS"
        side_effects:
          - "increments reopen_count by 1"
          - "clears rejected_reason to null"
        note: "Cycle leg: DRAFT -> SUBMITTED -> REJECTED -> DRAFT."
      - from: APPROVED
        to: DRAFT
        trigger: "POST /sort-plans/{id}/reopen"
        actor: MOVE_MANAGER
        preconditions:
          - "SortPlan.status == APPROVED"
          - "SortPlan.reopen_count < MAX_SORT_PLAN_REOPENS"
          - "the engagement's MoveDayPlan, when one exists, is not FROZEN, IN_PROGRESS or COMPLETED"
        side_effects:
          - "increments reopen_count by 1"
          - "cascade: every InventoryItem of the engagement gets disposition_locked set back to false, restoring the reversible mesh"
          - "cascade: the SORT_PLAN Milestone transitions COMPLETE -> REOPENED, moving Engagement.phase back to SORT_PLAN"
        note: "Cycle leg: DRAFT -> SUBMITTED -> APPROVED -> DRAFT, capped at MAX_SORT_PLAN_REOPENS."
      - from: APPROVED
        to: FROZEN
        trigger: "system, cascaded from POST /move-day-plans/{id}/freeze"
        actor: system
        preconditions:
          - "SortPlan.status == APPROVED"
        side_effects:
          - "sets frozen_at_utc to the current logical clock"
        note: "Terminal. After FROZEN no reopen is possible regardless of reopen_count."

  - entity: MoveDayPlan
    axis: status
    shape: cyclic
    non_linear: true
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: CREWED
        trigger: "system, bubbled up from POST /crew-assignments/{id}/confirm"
        actor: system
        preconditions:
          - "MoveDayPlan.crew_confirmed_count >= MoveDayPlan.crew_min_required"
          - "at least CREW_LEAD_REQUIRED_COUNT of the confirmed assignments belong to a CrewMember whose crew_role is LEAD"
        side_effects:
          - "recomputes planned_trip_count from Engagement.keep_volume_cft"
      - from: CREWED
        to: CONFIRMED
        trigger: "POST /move-day-plans/{id}/confirm"
        actor: MOVE_MANAGER
        preconditions:
          - "MoveDayPlan.status == CREWED"
          - "the engagement's SortPlan status is APPROVED"
        side_effects:
          - "recomputes planned_trip_count"
      - from: CONFIRMED
        to: DRAFT
        trigger: "POST /move-day-plans/{id}/recrew"
        actor: MOVE_MANAGER
        preconditions:
          - "MoveDayPlan.status == CONFIRMED"
          - "the current logical clock is strictly before MoveDayPlan.freeze_at_utc"
        side_effects:
          - "cascade: every CrewAssignment on the plan in status CONFIRMED reverts to ASSIGNED and crew_confirmed_count recomputes to 0"
        note: "Cycle: DRAFT -> CREWED -> CONFIRMED -> DRAFT."
      - from: CONFIRMED
        to: FROZEN
        trigger: "POST /move-day-plans/{id}/freeze"
        actor: MOVE_MANAGER
        preconditions:
          - "MoveDayPlan.status == CONFIRMED"
          - "the current logical clock is at or after MoveDayPlan.freeze_at_utc"
        side_effects:
          - "cascade: the engagement's SortPlan transitions APPROVED -> FROZEN"
          - "cascade: the PACK Milestone transitions IN_PROGRESS -> COMPLETE, starting the MOVE_DAY Milestone"
      - from: FROZEN
        to: IN_PROGRESS
        trigger: "POST /move-day-plans/{id}/start"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "MoveDayPlan.status == FROZEN"
          - "the current logical clock is at or after MoveDayPlan.scheduled_start_utc"
          - "MoveDayPlan.crew_confirmed_count >= MoveDayPlan.crew_min_required"
        side_effects:
          - "sets started_at_utc"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /move-day-plans/{id}/complete"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "MoveDayPlan.status == IN_PROGRESS"
          - "every CrewAssignment on the plan is in status COMPLETED, NO_SHOW, REPLACED or CHECKED_IN; no assignment may still be ASSIGNED or CONFIRMED"
        side_effects:
          - "cascade hop 1: every CrewAssignment still CHECKED_IN transitions to COMPLETED, its checked_out_at_utc set to the current logical clock and a LABOR TimeEntry created spanning checked_in_at_utc to that instant"
          - "cascade hop 2: each such completion recomputes CrewAssignment.portal_hours, billing_hours, applied_hours, overtime_hours and labor_cents from its non-voided TimeEntry rows"
          - "cascade hop 3: Engagement.accrued_labor_cents and Engagement.billing_hours_total are recomputed from those assignments"
          - "cascade hop 4: the engagement's DRAFT Invoice receives the pipeline labor lines, HOURLY_LABOR under the HOURLY pipeline or OVERAGE_LABOR under the PACKAGE pipeline when billing_hours_total exceeds the included allowance"
          - "cascade hop 5: Invoice.subtotal_cents, coordination_fee_cents, total_cents and balance_due_cents are recomputed and Invoice.version increments by 1"
          - "cascade hop 6: the MOVE_DAY Milestone transitions IN_PROGRESS -> COMPLETE, which starts the SETTLE_IN Milestone and therefore moves Engagement.phase to SETTLE_IN"
          - "sets actual_loaded_volume_cft and recomputes actual_trip_count under the ACTUAL variant"
        note: "This is the depth-6 cascade; every hop is caused by the previous hop, not by the original request."
      - from: CONFIRMED
        to: RESCHEDULED
        trigger: "POST /move-day-plans/{id}/reschedule"
        actor: MOVE_MANAGER
        preconditions:
          - "MoveDayPlan.status is CONFIRMED or FROZEN"
          - "MoveDayPlan.reschedule_count < MAX_MOVE_DAY_RESCHEDULES"
          - "new_start_utc is strictly after the current logical clock"
        side_effects:
          - "increments reschedule_count by 1"
          - "sets scheduled_start_utc to new_start_utc and recomputes freeze_at_utc"
          - "cascade: every VendorAssignment of the engagement in status ACCEPTED, SCHEDULED or COI_BLOCKED whose service_date equals the pre-reschedule scheduled_start_utc date has its service_date moved to the new_start_utc date; this is how a vendor's COI can end up expiring before its own service date"
      - from: FROZEN
        to: RESCHEDULED
        trigger: "POST /move-day-plans/{id}/reschedule"
        actor: MOVE_MANAGER
        preconditions:
          - "MoveDayPlan.status == FROZEN"
          - "MoveDayPlan.reschedule_count < MAX_MOVE_DAY_RESCHEDULES"
        side_effects:
          - "increments reschedule_count by 1"
          - "sets scheduled_start_utc to new_start_utc and recomputes freeze_at_utc"
          - "cascade: the same VendorAssignment service_date shift as the CONFIRMED to RESCHEDULED transition"
          - "cascade: the engagement's SortPlan, when FROZEN, does NOT return to APPROVED; FROZEN is terminal"
      - from: RESCHEDULED
        to: DRAFT
        trigger: "system, in the same request that produced RESCHEDULED"
        actor: system
        preconditions:
          - "MoveDayPlan.status == RESCHEDULED"
        side_effects:
          - "cascade: every CrewAssignment on the plan in status CONFIRMED reverts to ASSIGNED"
        note: "Closes the cycle back to DRAFT; RESCHEDULED is never observable as a resting state."

  - entity: CrewAssignment
    axis: status
    shape: branching
    non_linear: true
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, REPLACED]
    transitions:
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /crew-assignments/{id}/confirm"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "CrewAssignment.status == ASSIGNED"
          - "the parent MoveDayPlan status is DRAFT or CREWED"
        side_effects:
          - "recomputes MoveDayPlan.crew_confirmed_count"
          - "bubble-up: when the crew minimum and the LEAD requirement are met the plan transitions DRAFT -> CREWED"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /crew-assignments/{id}/check-in"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "CrewAssignment.status == CONFIRMED"
          - "the parent MoveDayPlan status is IN_PROGRESS"
          - "at_utc is at or after MoveDayPlan.started_at_utc"
        side_effects:
          - "sets checked_in_at_utc"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /crew-assignments/{id}/check-out"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "CrewAssignment.status == CHECKED_IN"
          - "at_utc is strictly after checked_in_at_utc"
        side_effects:
          - "sets checked_out_at_utc"
          - "creates a TimeEntry with entry_kind LABOR spanning checked_in_at_utc to at_utc"
          - "recomputes portal_hours, billing_hours, applied_hours, overtime_hours and labor_cents"
          - "recomputes Engagement.accrued_labor_cents and Engagement.billing_hours_total"
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "POST /crew-assignments/{id}/no-show"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "CrewAssignment.status is ASSIGNED or CONFIRMED"
        side_effects:
          - "sets no_show_note"
          - "recomputes MoveDayPlan.crew_confirmed_count"
        note: "Branch B of the fork: the roster slot must be refilled by a replacement assignment."
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /crew-assignments/{id}/no-show"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "CrewAssignment.status == CONFIRMED"
        side_effects:
          - "sets no_show_note"
          - "recomputes MoveDayPlan.crew_confirmed_count downward, which may drop the plan below its crew minimum"
      - from: NO_SHOW
        to: REPLACED
        trigger: "system, cascaded from POST /crew-assignments with replaces_assignment_id pointing at this row"
        actor: system
        preconditions:
          - "CrewAssignment.status == NO_SHOW"
        side_effects:
          - "the new assignment is created in status ASSIGNED with replaces_assignment_id set"
        note: "Join point of the fork: branch B rejoins branch A once a replacement is confirmed."

  - entity: VendorAssignment
    axis: status
    shape: cyclic
    non_linear: true
    initial_state: REQUESTED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ACCEPTED
        trigger: "POST /vendor-assignments/{id}/accept"
        actor: VENDOR
        preconditions:
          - "VendorAssignment.status == REQUESTED"
          - "X-User-ID equals VendorAssignment.vendor_id"
        side_effects:
          - "computes holdback_cents from the vendor's holdback_pct"
      - from: ACCEPTED
        to: SCHEDULED
        trigger: "POST /vendor-assignments/{id}/schedule"
        actor: MOVE_MANAGER
        preconditions:
          - "VendorAssignment.status == ACCEPTED"
          - "the vendor's coi_expires_on is not earlier than service_date"
          - "the vendor's count of assignments on service_date in status SCHEDULED, COI_BLOCKED, PERFORMED, SIGNED_OFF or PAID is strictly less than Vendor.daily_capacity"
        side_effects:
          - "stamps updated_at"
      - from: SCHEDULED
        to: COI_BLOCKED
        trigger: "system, evaluated by POST /engagements/{id}/ops-run"
        actor: system
        preconditions:
          - "VendorAssignment.status == SCHEDULED"
          - "the vendor's coi_expires_on is earlier than service_date"
        side_effects:
          - "increments Vendor.blocked_assignment_count"
        note: "Reachable because a COI can lapse after scheduling, either by clock advance past a renewal boundary or because service_date was already beyond the COI at ops-run evaluation time."
      - from: COI_BLOCKED
        to: SCHEDULED
        trigger: "system, cascaded from POST /vendors/{id}/renew-coi"
        actor: system
        preconditions:
          - "VendorAssignment.status == COI_BLOCKED"
          - "the renewed coi_expires_on is not earlier than service_date"
        side_effects:
          - "decrements Vendor.blocked_assignment_count"
        note: "Cycle: SCHEDULED -> COI_BLOCKED -> SCHEDULED."
      - from: SCHEDULED
        to: PERFORMED
        trigger: "POST /vendor-assignments/{id}/perform"
        actor: "VENDOR or MOVE_MANAGER"
        preconditions:
          - "VendorAssignment.status == SCHEDULED"
          - "performed_at_utc is at or after the service_date at 00:00:00Z"
        side_effects:
          - "sets performed_at_utc"
          - "sets paid_cents to the INTERIM vendor payout variant, quoted_cents minus holdback_cents"
          - "cascade: a VENDOR_PASSTHROUGH InvoiceLine for quoted_cents is appended to the engagement's Invoice and the invoice totals are recomputed"
      - from: PERFORMED
        to: SIGNED_OFF
        trigger: "POST /vendor-assignments/{id}/sign-off"
        actor: "MOVE_MANAGER or CLIENT or POWER_OF_ATTORNEY"
        preconditions:
          - "VendorAssignment.status == PERFORMED"
          - "the supplied signed_off_by_party_id resolves to a PortalParty on the same engagement"
        side_effects:
          - "sets holdback_released to true and paid_cents to the FINAL vendor payout variant, the full quoted_cents"
      - from: SIGNED_OFF
        to: PAID
        trigger: "POST /vendor-assignments/{id}/pay"
        actor: BILLING_ADMIN
        preconditions:
          - "VendorAssignment.status == SIGNED_OFF"
          - "the engagement's Invoice.status is not FINALIZED"
        side_effects:
          - "stamps updated_at"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /vendor-assignments/{id}/cancel"
        actor: "MOVE_MANAGER or VENDOR"
        preconditions:
          - "VendorAssignment.status is REQUESTED, ACCEPTED, SCHEDULED or COI_BLOCKED"
        side_effects:
          - "sets cancel_reason"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /vendor-assignments/{id}/cancel"
        actor: "MOVE_MANAGER or VENDOR"
        preconditions:
          - "VendorAssignment.status == SCHEDULED"
        side_effects:
          - "sets cancel_reason"
          - "frees one slot of the vendor's daily capacity on service_date"

  - entity: ConsignmentLot
    axis: status
    shape: cyclic
    non_linear: true
    initial_state: LISTED
    terminal_states: [HAULED]
    transitions:
      - from: LISTED
        to: MARKED_DOWN
        trigger: "POST /consignment-lots/{id}/mark-down"
        actor: "MOVE_MANAGER or VENDOR"
        preconditions:
          - "ConsignmentLot.status == LISTED"
          - "ConsignmentLot.markdown_round < MAX_MARKDOWN_ROUNDS"
        side_effects:
          - "increments markdown_round to 1 and recomputes current_price_cents under the markdown schedule"
      - from: MARKED_DOWN
        to: MARKED_DOWN
        trigger: "POST /consignment-lots/{id}/mark-down"
        actor: "MOVE_MANAGER or VENDOR"
        preconditions:
          - "ConsignmentLot.status == MARKED_DOWN"
          - "ConsignmentLot.markdown_round < MAX_MARKDOWN_ROUNDS"
        side_effects:
          - "increments markdown_round to 2 and recomputes current_price_cents"
        note: "Self-loop; the second markdown is the last one MAX_MARKDOWN_ROUNDS permits."
      - from: LISTED
        to: SOLD
        trigger: "POST /consignment-lots/{id}/record-sale"
        actor: "VENDOR or MOVE_MANAGER"
        preconditions:
          - "ConsignmentLot.status is LISTED or MARKED_DOWN"
          - "gross_sale_price_cents > 0"
          - "sold_on is not earlier than listed_on"
        side_effects:
          - "sets gross_sale_price_cents and sold_on"
          - "computes commission_cents, fees_cents and net_proceeds_cents"
      - from: MARKED_DOWN
        to: SOLD
        trigger: "POST /consignment-lots/{id}/record-sale"
        actor: "VENDOR or MOVE_MANAGER"
        preconditions:
          - "ConsignmentLot.status == MARKED_DOWN"
          - "gross_sale_price_cents > 0"
        side_effects:
          - "same as the LISTED to SOLD transition"
      - from: SOLD
        to: SETTLED
        trigger: "POST /consignment-lots/{id}/settle"
        actor: "MOVE_MANAGER or BILLING_ADMIN"
        preconditions:
          - "ConsignmentLot.status == SOLD"
          - "ConsignmentLot.credited == false"
          - "the engagement's Invoice.status is not FINALIZED"
        side_effects:
          - "cascade hop 1: a CONSIGNMENT_CREDIT InvoiceLine of amount minus net_proceeds_cents is appended with source_consignment_lot_id set"
          - "cascade hop 2: Invoice.credits_cents, total_cents and balance_due_cents are recomputed and Invoice.version increments by 1"
          - "cascade hop 3: Engagement.consignment_credit_cents is refreshed"
          - "sets credited to true"
      - from: SETTLED
        to: RETURNED
        trigger: "POST /consignment-lots/{id}/return-to-client"
        actor: MOVE_MANAGER
        preconditions:
          - "ConsignmentLot.status is SOLD, SETTLED or UNSOLD"
          - "the engagement's Invoice.status is not FINALIZED"
        side_effects:
          - "cascade hop 1: when credited is true a CONSIGNMENT_REVERSAL InvoiceLine of amount plus net_proceeds_cents is appended and reversed is set to true"
          - "cascade hop 2: Invoice.credits_cents, total_cents and balance_due_cents are recomputed and Invoice.version increments by 1"
          - "cascade hop 3: Engagement.billing_hold recomputes, becoming true when the recomputed balance_due_cents is greater than 0 while the Invoice is ISSUED or DISPUTED"
          - "cascade hop 4: while Engagement.billing_hold is true the CLOSE_OUT Milestone cannot be completed, so an already COMPLETE CLOSE_OUT Milestone transitions COMPLETE -> REOPENED"
          - "every member InventoryItem has consignment_lot_id cleared to null and disposition forced to KEEP is NOT performed; the items stay SELL"
        note: "The non-monotone leg: proceeds credited at SETTLED are reversed here, and the reversal can re-open a milestone that was already COMPLETE."
      - from: SOLD
        to: RETURNED
        trigger: "POST /consignment-lots/{id}/return-to-client"
        actor: MOVE_MANAGER
        preconditions:
          - "ConsignmentLot.status == SOLD"
          - "ConsignmentLot.credited == false"
        side_effects:
          - "no invoice line is written because nothing was credited; reversed stays false"
        note: "Same endpoint, structurally different side-effect set depending on `credited`."
      - from: LISTED
        to: UNSOLD
        trigger: "POST /consignment-lots/{id}/declare-unsold"
        actor: "MOVE_MANAGER or VENDOR"
        preconditions:
          - "ConsignmentLot.status is LISTED or MARKED_DOWN"
          - "the current logical clock date is at least CONSIGN_UNSOLD_WINDOW_DAYS days after listed_on"
        side_effects:
          - "stamps updated_at"
      - from: MARKED_DOWN
        to: UNSOLD
        trigger: "POST /consignment-lots/{id}/declare-unsold"
        actor: "MOVE_MANAGER or VENDOR"
        preconditions:
          - "ConsignmentLot.status == MARKED_DOWN"
          - "the current logical clock date is at least CONSIGN_UNSOLD_WINDOW_DAYS days after listed_on"
        side_effects:
          - "stamps updated_at"
      - from: UNSOLD
        to: RETURNED
        trigger: "POST /consignment-lots/{id}/return-to-client"
        actor: MOVE_MANAGER
        preconditions:
          - "ConsignmentLot.status == UNSOLD"
        side_effects:
          - "each member InventoryItem has consignment_lot_id cleared to null"
      - from: UNSOLD
        to: HAULED
        trigger: "POST /consignment-lots/{id}/haul-away"
        actor: MOVE_MANAGER
        preconditions:
          - "ConsignmentLot.status is UNSOLD or RETURNED"
          - "the engagement's Invoice.status is not FINALIZED"
        side_effects:
          - "computes disposal_fee_cents from the member items' total volume"
          - "cascade: a DISPOSAL_FEE InvoiceLine is appended and the invoice totals recompute"
          - "cascade: each member InventoryItem disposition changes to HAUL_AWAY and handling_state to REMOVED even when disposition_locked is true, because a system cascade is not a re-designation request"
      - from: RETURNED
        to: HAULED
        trigger: "POST /consignment-lots/{id}/haul-away"
        actor: MOVE_MANAGER
        preconditions:
          - "ConsignmentLot.status == RETURNED"
        side_effects:
          - "same as the UNSOLD to HAULED transition"
        note: "A returned lot may still be hauled; this is why RETURNED is not terminal."

  - entity: Invoice
    axis: status
    shape: cyclic
    non_linear: true
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: BILLING_ADMIN
        preconditions:
          - "Invoice.status == DRAFT"
          - "the engagement's MOVE_DAY Milestone is COMPLETE"
        side_effects:
          - "recomputes subtotal_cents, coordination_fee_cents, credits_cents, total_cents and balance_due_cents in that pinned order"
          - "sets issued_at_utc"
          - "appends a COORDINATION_FEE InvoiceLine equal to the computed coordination_fee_cents"
      - from: ISSUED
        to: DRAFT
        trigger: "POST /invoices/{id}/recall"
        actor: BILLING_ADMIN
        preconditions:
          - "Invoice.status == ISSUED"
          - "Invoice.recall_count < MAX_INVOICE_RECALLS"
          - "Invoice.payments_cents == 0"
        side_effects:
          - "increments recall_count by 1"
          - "removes the COORDINATION_FEE InvoiceLine appended at issue"
        note: "Cycle: DRAFT -> ISSUED -> DRAFT, capped at MAX_INVOICE_RECALLS."
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /invoices/{id}/dispute"
        actor: "CLIENT or POWER_OF_ATTORNEY or FAMILY_MEMBER"
        preconditions:
          - "Invoice.status == ISSUED"
          - "Invoice.dispute_count < MAX_INVOICE_DISPUTES"
          - "the supplied raised_by_party_id resolves to a PortalParty on the engagement"
        side_effects:
          - "increments dispute_count by 1 and sets dispute_reason"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /invoices/{id}/resolve-dispute"
        actor: BILLING_ADMIN
        preconditions:
          - "Invoice.status == DISPUTED"
        side_effects:
          - "clears dispute_reason to null"
        note: "Cycle: ISSUED -> DISPUTED -> ISSUED, capped at MAX_INVOICE_DISPUTES."
      - from: ISSUED
        to: FINALIZED
        trigger: "POST /invoices/{id}/finalize"
        actor: BILLING_ADMIN
        preconditions:
          - "Invoice.status == ISSUED"
          - "Invoice.balance_due_cents <= 0"
          - "no ConsignmentLot of the engagement is in status SOLD or SETTLED with credited true and reversed false pending return"
        side_effects:
          - "sets finalized_at_utc"
          - "gate 9 becomes closed for the whole engagement"

  - entity: AuthorityRecord
    axis: status
    shape: cyclic
    non_linear: true
    initial_state: PENDING
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /authority-records/{id}/activate"
        actor: MOVE_MANAGER
        preconditions:
          - "AuthorityRecord.status == PENDING"
          - "the current logical clock is at or after effective_from_utc"
          - "the current logical clock is strictly before effective_to_utc"
        side_effects:
          - "cascade: the holder PortalParty.can_approve_dispositions and active_authority_ceiling_cents are recomputed"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /authority-records/{id}/suspend"
        actor: MOVE_MANAGER
        preconditions:
          - "AuthorityRecord.status == ACTIVE"
          - "AuthorityRecord.suspend_count < MAX_AUTHORITY_SUSPENSIONS"
        side_effects:
          - "increments suspend_count by 1 and sets revoked_reason"
          - "cascade: the holder PortalParty.can_approve_dispositions recomputes to false when no other ACTIVE authority remains"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /authority-records/{id}/reinstate"
        actor: MOVE_MANAGER
        preconditions:
          - "AuthorityRecord.status == SUSPENDED"
          - "the current logical clock is strictly before effective_to_utc"
        side_effects:
          - "cascade: the holder PortalParty.can_approve_dispositions and active_authority_ceiling_cents are recomputed"
        note: "Cycle: ACTIVE -> SUSPENDED -> ACTIVE, capped at MAX_AUTHORITY_SUSPENSIONS."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /authority-records/{id}/revoke"
        actor: "MOVE_MANAGER or CLIENT"
        preconditions:
          - "AuthorityRecord.status is PENDING, ACTIVE or SUSPENDED"
        side_effects:
          - "sets revoked_reason"
          - "cascade: the holder PortalParty.can_approve_dispositions recomputes to false when no other ACTIVE authority remains"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /authority-records/{id}/revoke"
        actor: "MOVE_MANAGER or CLIENT"
        preconditions:
          - "AuthorityRecord.status == SUSPENDED"
        side_effects:
          - "sets revoked_reason"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, evaluated by POST /engagements/{id}/ops-run"
        actor: system
        preconditions:
          - "AuthorityRecord.status is PENDING, ACTIVE or SUSPENDED"
          - "the current logical clock is at or after effective_to_utc"
        side_effects:
          - "cascade: the holder PortalParty.can_approve_dispositions recomputes to false when no other ACTIVE authority remains"

  - entity: Milestone
    axis: status
    shape: cyclic
    non_linear: true
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "system, at engagement creation for sequence_index 1 and on the predecessor's completion for 2 through 6"
        actor: system
        preconditions:
          - "Milestone.status == PENDING"
          - "sequence_index == 1, or the Milestone with sequence_index minus 1 on the same engagement is COMPLETE"
        side_effects:
          - "cascade: Engagement.phase recomputes to this milestone_key"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /milestones/{id}/complete"
        actor: MOVE_MANAGER
        preconditions:
          - "Milestone.status is IN_PROGRESS or REOPENED"
          - "the Milestone with sequence_index minus 1 on the same engagement is COMPLETE, when one exists"
          - "when milestone_key is MOVE_DAY the engagement's MoveDayPlan is COMPLETED"
          - "when milestone_key is CLOSE_OUT, Engagement.billing_hold is false and no PunchListItem is OPEN or REOPENED"
        side_effects:
          - "sets completed_at_utc and completed_by_party_id"
          - "when overdue_status is OVERDUE it becomes RECOVERED, otherwise it stays ON_TIME"
          - "cascade: the successor Milestone transitions PENDING -> IN_PROGRESS and Engagement.phase recomputes"
      - from: COMPLETE
        to: REOPENED
        trigger: "POST /milestones/{id}/reopen, or system cascade from a consignment reversal or a punch-list reopen"
        actor: "MOVE_MANAGER or system"
        preconditions:
          - "Milestone.status == COMPLETE"
          - "Milestone.reopen_count < MAX_MILESTONE_REOPENS"
          - "no successor Milestone on the same engagement is COMPLETE"
        side_effects:
          - "increments reopen_count by 1"
          - "clears completed_at_utc to null"
          - "when overdue_status is RECOVERED it returns to OVERDUE, never to ON_TIME"
          - "cascade: Engagement.phase recomputes back to this milestone_key"
        note: "Cycle: IN_PROGRESS -> COMPLETE -> REOPENED -> IN_PROGRESS."
      - from: REOPENED
        to: IN_PROGRESS
        trigger: "system, in the same request that produced REOPENED"
        actor: system
        preconditions:
          - "Milestone.status == REOPENED"
        side_effects:
          - "cascade: Engagement.phase recomputes to this milestone_key"

  - entity: Milestone
    axis: overdue_status
    shape: linear
    non_linear: false
    initial_state: ON_TIME
    terminal_states: []
    transitions:
      - from: ON_TIME
        to: OVERDUE
        trigger: "system, evaluated by POST /engagements/{id}/ops-run"
        actor: system
        preconditions:
          - "Milestone.status is PENDING, IN_PROGRESS or REOPENED"
          - "the current logical clock date is strictly after Milestone.due_on"
        side_effects:
          - "latches; no ops-run and no due-date change ever moves overdue_status back to ON_TIME"
      - from: OVERDUE
        to: RECOVERED
        trigger: "POST /milestones/{id}/complete"
        actor: MOVE_MANAGER
        preconditions:
          - "Milestone.overdue_status == OVERDUE"
        side_effects:
          - "records that the milestone was late but has since been completed"
      - from: RECOVERED
        to: OVERDUE
        trigger: "POST /milestones/{id}/reopen"
        actor: "MOVE_MANAGER or system"
        preconditions:
          - "Milestone.overdue_status == RECOVERED"
        side_effects:
          - "re-entry is explicitly defined: a reopened milestone that was ever late is OVERDUE again, never ON_TIME"
        note: "The lateness axis is monotone in the sense that ON_TIME is unreachable once left; RECOVERED and OVERDUE only alternate with completion and reopening."

  - entity: UnpackSession
    axis: status
    shape: cyclic
    non_linear: true
    initial_state: SCHEDULED
    terminal_states: []
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /unpack-sessions/{id}/start"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "UnpackSession.status is SCHEDULED or REOPENED"
          - "the engagement's MoveDayPlan is COMPLETED"
          - "when priority is STANDARD, every ESSENTIALS session of the same engagement created earlier is already COMPLETED"
        side_effects:
          - "sets started_at_utc"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /unpack-sessions/{id}/complete"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "UnpackSession.status == IN_PROGRESS"
        side_effects:
          - "recomputes items_unpacked_count"
      - from: COMPLETED
        to: REOPENED
        trigger: "system, cascaded from POST /punch-list-items/{id}/reopen when the punch item names this session"
        actor: system
        preconditions:
          - "UnpackSession.status == COMPLETED"
          - "UnpackSession.reopen_count < MAX_UNPACK_REOPENS"
        side_effects:
          - "increments reopen_count by 1"
      - from: REOPENED
        to: IN_PROGRESS
        trigger: "POST /unpack-sessions/{id}/start"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "UnpackSession.status == REOPENED"
        side_effects:
          - "sets started_at_utc to the current logical clock"
        note: "Cycle: IN_PROGRESS -> COMPLETED -> REOPENED -> IN_PROGRESS."

  - entity: PunchListItem
    axis: status
    shape: cyclic
    non_linear: true
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /punch-list-items/{id}/resolve"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "PunchListItem.status is OPEN or REOPENED"
          - "resolution_note is a non-empty string"
        side_effects:
          - "sets resolution_note and recomputes breached_sla"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /punch-list-items/{id}/reopen"
        actor: "MOVE_MANAGER or CLIENT or FAMILY_MEMBER or POWER_OF_ATTORNEY"
        preconditions:
          - "PunchListItem.status == RESOLVED"
          - "PunchListItem.reopen_count < MAX_PUNCH_REOPENS"
        side_effects:
          - "increments reopen_count by 1"
          - "cascade hop 1: when unpack_session_id is not null and that session is COMPLETED, the session transitions COMPLETED -> REOPENED"
          - "cascade hop 2: when the engagement's CLOSE_OUT Milestone is COMPLETE it transitions COMPLETE -> REOPENED, moving Engagement.phase back to CLOSE_OUT"
        note: "Cycle: OPEN -> RESOLVED -> REOPENED -> RESOLVED, capped at MAX_PUNCH_REOPENS."
      - from: REOPENED
        to: RESOLVED
        trigger: "POST /punch-list-items/{id}/resolve"
        actor: "MOVE_MANAGER or CREW_LEAD"
        preconditions:
          - "PunchListItem.status == REOPENED"
          - "resolution_note is a non-empty string"
        side_effects:
          - "sets resolution_note"

# ---------------------------------------------------------------------------
# 1.2.1 CONCURRENCY RULES  (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: sort-plan-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /sort-plans"
    occ_field: "expected_engagement_version"
    description: |
      A new SortPlan legitimately supersedes the engagement's prior DRAFT or
      REJECTED plan, so a create whose view of the engagement is stale must be
      rejected rather than silently replacing a plan the caller never saw.
      The check is a version comparison: expected_engagement_version must equal
      Engagement.version at the moment the create is processed.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
  - rule_id: crew-assignment-create-stale-move-day-plan
    parent_entity: MoveDayPlan
    write_endpoint: "POST /crew-assignments"
    occ_field: "expected_move_day_plan_version"
    description: |
      Creating a CrewAssignment against a MoveDayPlan whose version has advanced
      since the client last observed it is rejected. This covers the replacement
      case, where a new assignment legitimately supersedes a NO_SHOW slot and
      therefore changes the plan's crew_confirmed_count and possibly its status.
    error_id: ERR_STALE_MOVE_DAY_PLAN_VERSION
    http_status: 412
  - rule_id: invoice-line-create-stale-invoice
    parent_entity: Invoice
    write_endpoint: "POST /invoice-lines"
    occ_field: "expected_invoice_version"
    description: |
      A manual adjustment line is written against a specific observed ledger
      state. Because settlement, reversal, vendor pass-through and labor
      cascades all append lines and bump Invoice.version, an adjustment whose
      expected_invoice_version is stale is rejected.
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# CONSERVATION INVARIANTS
# Each names a global quantity that a forward action plus its compensating
# action must leave unchanged, pinned as a formula over entity fields.
# ---------------------------------------------------------------------------
invariants:
  - id: INV_CONSIGNMENT_CREDIT_CONSERVATION
    conserved_quantity: "Invoice.credits_cents"
    formula: |
      Invoice.credits_cents
        == sum(InvoiceLine.amount_cents
               for lines on this invoice with line_type in {CONSIGNMENT_CREDIT, CONSIGNMENT_REVERSAL})
      AND for every ConsignmentLot L of the engagement with L.credited == true and L.reversed == true:
        (-L.net_proceeds_cents) + (+L.net_proceeds_cents) == 0
    forward_action: "POST /consignment-lots/{id}/settle"
    compensating_action: "POST /consignment-lots/{id}/return-to-client"
    statement: |
      Settling a lot and then returning it to the client must leave
      Invoice.credits_cents exactly at the value it held before the settle, and
      must leave Invoice.total_cents exactly at its pre-settle value. Two
      InvoiceLine rows remain on the ledger; their sum is zero. Drift here means
      the reversal used a recomputed net_proceeds_cents instead of the amount
      actually credited.
  - id: INV_VENDOR_PAYOUT_CONSERVATION
    conserved_quantity: "VendorAssignment.quoted_cents"
    formula: |
      For every VendorAssignment in status PERFORMED, SIGNED_OFF or PAID:
        VendorAssignment.paid_cents
          + (VendorAssignment.holdback_cents if VendorAssignment.holdback_released == false else 0)
          == VendorAssignment.quoted_cents
    forward_action: "POST /vendor-assignments/{id}/perform"
    compensating_action: "POST /vendor-assignments/{id}/sign-off"
    statement: |
      The interim payout plus the outstanding holdback always equals the quote.
      Sign-off moves money from the holdback bucket to the paid bucket; it never
      creates or destroys any.
  - id: INV_INVENTORY_VOLUME_CONSERVATION
    conserved_quantity: "Engagement.total_inventory_volume_cft"
    formula: |
      Engagement.total_inventory_volume_cft
        == sum(InventoryItem.volume_cft for every item of the engagement, any disposition)
      AND Engagement.total_inventory_volume_cft is unchanged by any
      POST /inventory-items/{id}/designate call, while
      Engagement.keep_volume_cft + Engagement.haul_volume_cft
        <= Engagement.total_inventory_volume_cft holds at all times.
    forward_action: "POST /inventory-items/{id}/designate with disposition KEEP"
    compensating_action: "POST /inventory-items/{id}/designate with disposition DONATE"
    statement: |
      Re-designating an item moves volume between the KEEP and HAUL_AWAY buckets
      but never changes the total. A designate round trip must return
      keep_volume_cft and haul_volume_cft to their exact pre-trip values.
  - id: INV_LABOR_LEDGER_CONSERVATION
    conserved_quantity: "Engagement.billing_hours_total"
    formula: |
      Engagement.billing_hours_total
        == sum(CrewAssignment.applied_hours
               for assignments of this engagement's MoveDayPlan with status == COMPLETED)
      AND every CrewAssignment.billing_hours is recomputed only from its own
      TimeEntry rows whose voided == false.
    forward_action: "POST /time-entries"
    compensating_action: "POST /time-entries/{id}/void"
    statement: |
      Adding a time entry and then voiding it must return
      CrewAssignment.billing_hours, CrewAssignment.labor_cents and
      Engagement.billing_hours_total to their exact pre-add values. Because the
      BILLING_VIEW variant rounds the SUM rather than the parts, a naive
      subtract-the-rounded-part implementation drifts here.

# ---------------------------------------------------------------------------
# 1.3 CALCULATION RULES TABLE
# ---------------------------------------------------------------------------
calculations:

  - name: time_entry_hours
    trigger: "on POST /time-entries and on the LABOR entry synthesised by POST /crew-assignments/{id}/check-out"
    algorithm: interval_merge
    formula: |
      raw_hours = (ended_at_utc - started_at_utc) expressed in hours, truncated to 4 decimal places
      rounded_hours = round_half_up(raw_hours / TIME_ROUNDING_INCREMENT_HOURS) * TIME_ROUNDING_INCREMENT_HOURS
    input_set: "the single TimeEntry row being written; BREAK entries are computed the same way but excluded downstream"
    constants:
      TIME_ROUNDING_INCREMENT_HOURS: 0.25
    precision: "raw_hours 4 decimal places truncated; rounded_hours 2 decimal places"

  - name: crew_billable_hours
    trigger: "on POST /crew-assignments/{id}/check-out, on POST /time-entries, and on POST /time-entries/{id}/void"
    algorithm: aggregation
    formula: |
      eligible = TimeEntry rows with crew_assignment_id == this assignment
                 AND voided == false
                 AND entry_kind in {LABOR, TRAVEL}
      portal_hours  = round_half_up( sum(e.rounded_hours for e in eligible) , 2)
      billing_hours = round_half_up( sum(e.raw_hours for e in eligible) / TIME_ROUNDING_INCREMENT_HOURS )
                      * TIME_ROUNDING_INCREMENT_HOURS
    input_set: "non-voided LABOR and TRAVEL entries of this assignment; BREAK entries are excluded from both variants; ordering is irrelevant because both variants are order-insensitive sums"
    constants:
      TIME_ROUNDING_INCREMENT_HOURS: 0.25
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PORTAL_VIEW
        when: "shown to the family portal as CrewAssignment.portal_hours"
        difference: "rounds each entry to the quarter hour FIRST, then sums the rounded parts"
      - name: BILLING_VIEW
        when: "used for every monetary computation and stored as CrewAssignment.billing_hours"
        difference: "sums the raw hours FIRST, then rounds the single total to the quarter hour"
    note: |
      The pinned invoicing order is BILLING_VIEW. The two variants diverge
      whenever the per-entry rounding residues accumulate, and the divergence
      can by itself push applied_hours across the overtime threshold.

  - name: crew_applied_hours
    trigger: "immediately after crew_billable_hours on the same request"
    algorithm: threshold
    formula: |
      if Engagement.billing_mode == "HOURLY":
          applied_hours = max(billing_hours, HOURLY_MIN_CALLOUT_HOURS)
      else:
          applied_hours = billing_hours
    input_set: "the assignment's billing_hours and the owning engagement's billing_mode"
    constants:
      HOURLY_MIN_CALLOUT_HOURS: 3.0
    precision: "2 decimal places"
    note: "The minimum call-out floor exists only in the HOURLY pipeline; under PACKAGE the same rung is skipped, which is the first per-pipeline branch of the shared ladder."

  - name: crew_overtime_split
    trigger: "immediately after crew_applied_hours on the same request"
    algorithm: threshold
    formula: |
      overtime_hours = max(0, applied_hours - HOURLY_OT_DAILY_THRESHOLD_HOURS)
      regular_hours  = applied_hours - overtime_hours
    input_set: "one CrewAssignment, which represents exactly one crew member on exactly one move day"
    constants:
      HOURLY_OT_DAILY_THRESHOLD_HOURS: 8.0
    precision: "2 decimal places"
    note: "Strict boundary: applied_hours exactly 8.00 yields overtime_hours 0.00."

  - name: crew_assignment_labor_cents
    trigger: "immediately after crew_overtime_split on the same request"
    algorithm: tiered_pricing
    formula: |
      rate = CrewMember.hourly_rate_cents
      labor_cents = round_half_up(regular_hours * rate)
                    + round_half_up(overtime_hours * rate * HOURLY_OT_MULTIPLIER)
    input_set: "one CrewAssignment plus its CrewMember rate"
    constants:
      HOURLY_OT_MULTIPLIER: 1.5
      RATE_LEAD_CENTS_PER_HOUR: 9500
      RATE_ORGANIZER_CENTS_PER_HOUR: 8200
      RATE_PACKER_CENTS_PER_HOUR: 6800
      RATE_DRIVER_CENTS_PER_HOUR: 7400
    precision: "whole cents, round_half_up; the two components are rounded SEPARATELY and then added, never summed as floats and rounded once"
    note: "Combinatorial mode (a): four inputs with a nested max and a rate selected by the crew member's role, plus a conditional floor supplied by crew_applied_hours."

  - name: engagement_labor_rollup
    trigger: "on every CrewAssignment completion cascade and on every TimeEntry write or void"
    algorithm: aggregation
    formula: |
      completed = CrewAssignment rows whose move_day_plan_id belongs to this engagement
                  AND status == "COMPLETED"
      Engagement.accrued_labor_cents  = sum(a.labor_cents  for a in completed)
      Engagement.billing_hours_total  = round_half_up(sum(a.applied_hours for a in completed), 2)
    input_set: "COMPLETED assignments only; ASSIGNED, CONFIRMED, CHECKED_IN, NO_SHOW and REPLACED assignments contribute nothing"
    constants: {}
    precision: "cents as integers, hours to 2 decimal places"

  - name: hourly_pipeline_labor_charge
    trigger: "cascade hop 4 of POST /move-day-plans/{id}/complete when Engagement.billing_mode == HOURLY"
    algorithm: aggregation
    formula: |
      hourly_labor_charge_cents = Engagement.accrued_labor_cents
    input_set: "the engagement's COMPLETED crew assignments"
    constants: {}
    precision: "whole cents"
    note: "Pipeline A. One HOURLY_LABOR InvoiceLine is appended with this amount."

  - name: package_base_charge
    trigger: "on POST /engagements when billing_mode == PACKAGE"
    algorithm: tiered_pricing
    formula: |
      # PACKAGE_TIER_CENTS is the map STUDIO -> PACKAGE_TIER_STUDIO_CENTS,
      # ONE_BED -> PACKAGE_TIER_ONE_BED_CENTS, TWO_BED -> PACKAGE_TIER_TWO_BED_CENTS,
      # HOUSE -> PACKAGE_TIER_HOUSE_CENTS. It is notation for those four constants.
      base_cents = PACKAGE_TIER_CENTS[Engagement.package_tier]
    input_set: "the engagement's package_tier only; home_tier does NOT select the package price"
    constants:
      PACKAGE_TIER_STUDIO_CENTS: 185000
      PACKAGE_TIER_ONE_BED_CENTS: 265000
      PACKAGE_TIER_TWO_BED_CENTS: 395000
      PACKAGE_TIER_HOUSE_CENTS: 620000
    precision: "whole cents"
    note: "Pipeline B. A PACKAGE_BASE InvoiceLine is appended at engagement creation."

  - name: package_overage_charge
    trigger: "cascade hop 4 of POST /move-day-plans/{id}/complete when Engagement.billing_mode == PACKAGE"
    algorithm: threshold
    formula: |
      # PACKAGE_INCLUDED_HOURS is the map STUDIO -> PACKAGE_INCLUDED_HOURS_STUDIO,
      # ONE_BED -> PACKAGE_INCLUDED_HOURS_ONE_BED, TWO_BED -> PACKAGE_INCLUDED_HOURS_TWO_BED,
      # HOUSE -> PACKAGE_INCLUDED_HOURS_HOUSE.
      allowance = PACKAGE_INCLUDED_HOURS[Engagement.package_tier]
      overage_hours = max(0, Engagement.billing_hours_total - allowance)
      overage_cents = round_half_up(overage_hours * PACKAGE_OVERAGE_RATE_CENTS_PER_HOUR)
    input_set: "Engagement.billing_hours_total, which already reflects the BILLING_VIEW rounding order"
    constants:
      PACKAGE_INCLUDED_HOURS_STUDIO: 18
      PACKAGE_INCLUDED_HOURS_ONE_BED: 26
      PACKAGE_INCLUDED_HOURS_TWO_BED: 40
      PACKAGE_INCLUDED_HOURS_HOUSE: 64
      PACKAGE_OVERAGE_RATE_CENTS_PER_HOUR: 8900
    precision: "whole cents, round_half_up"
    note: "Strict boundary: billing_hours_total exactly equal to the allowance produces no OVERAGE_LABOR line at all, not a zero-amount line."

  - name: labor_charge_pipeline_selector
    trigger: "cascade hop 4 of POST /move-day-plans/{id}/complete"
    algorithm: constraint_propagation
    formula: |
      if Engagement.billing_mode == "HOURLY":
          append InvoiceLine(line_type="HOURLY_LABOR",  amount_cents=hourly_pipeline_labor_charge)
      else:
          if package_overage_charge > 0:
              append InvoiceLine(line_type="OVERAGE_LABOR", amount_cents=package_overage_charge)
          # the PACKAGE_BASE line was already appended at engagement creation
    input_set: "Engagement.billing_mode"
    constants: {}
    precision: "whole cents"
    variants:
      - name: HOURLY
        when: "Engagement.billing_mode == HOURLY"
        difference: "labor is billed as crew-hours times role rate with a minimum call-out floor and an overtime multiplier; there is no included allowance and no base line"
      - name: PACKAGE
        when: "Engagement.billing_mode == PACKAGE"
        difference: "a fixed tier price is billed up front and only hours beyond the tier allowance are billed, at a different rate, with no minimum call-out floor"
    note: "The headline dual-variant: identical crew hours produce structurally different ledgers under the two pipelines."

  - name: travel_surcharge
    trigger: "on POST /invoices/{id}/issue"
    algorithm: tiered_pricing
    formula: |
      m = Engagement.mileage_miles
      band1_miles = max(0, min(m, TRAVEL_BAND1_MAX_MILES) - TRAVEL_FREE_MILES)
      band2_miles = max(0, m - TRAVEL_BAND1_MAX_MILES)
      travel_cents = round_half_up(band1_miles * TRAVEL_BAND1_RATE_CENTS_PER_MILE)
                     + round_half_up(band2_miles * TRAVEL_BAND2_RATE_CENTS_PER_MILE)
    input_set: "Engagement.mileage_miles"
    constants:
      TRAVEL_FREE_MILES: 15
      TRAVEL_BAND1_MAX_MILES: 40
      TRAVEL_BAND1_RATE_CENTS_PER_MILE: 317
      TRAVEL_BAND2_RATE_CENTS_PER_MILE: 486
    precision: "whole cents, each band rounded separately then summed"
    note: "Marginal, not average: only the miles inside each band are charged at that band's rate."

  - name: stairs_surcharge
    trigger: "on POST /invoices/{id}/issue"
    algorithm: threshold
    formula: |
      billable_flights = max(0, Engagement.origin_stairs_flights - STAIRS_INCLUDED_FLIGHTS)
      crew_count = MoveDayPlan.crew_confirmed_count of the engagement's MoveDayPlan, or 0 when no plan exists
      stairs_cents = billable_flights * STAIRS_FEE_CENTS_PER_FLIGHT_PER_CREW * crew_count
    input_set: "Engagement.origin_stairs_flights and the plan's crew_confirmed_count at issue time"
    constants:
      STAIRS_INCLUDED_FLIGHTS: 1
      STAIRS_FEE_CENTS_PER_FLIGHT_PER_CREW: 2500
    precision: "whole cents"

  - name: long_carry_surcharge
    trigger: "on POST /invoices/{id}/issue"
    algorithm: threshold
    formula: |
      excess_feet = max(0, Engagement.origin_long_carry_feet - LONG_CARRY_FREE_FEET)
      blocks = ceil(excess_feet / 25)
      long_carry_cents = blocks * LONG_CARRY_FEE_CENTS_PER_25_FEET
    input_set: "Engagement.origin_long_carry_feet"
    constants:
      LONG_CARRY_FREE_FEET: 75
      LONG_CARRY_FEE_CENTS_PER_25_FEET: 1800
    precision: "whole cents"
    note: "Strict boundary: exactly 75 feet yields 0; 76 feet yields one full block."

  - name: package_deposit_schedule
    trigger: "on POST /invoices/{id}/issue when Engagement.billing_mode == PACKAGE"
    algorithm: waterfall_allocation
    formula: |
      contracted = package_base_charge + travel_surcharge + stairs_surcharge + long_carry_surcharge
      signing_cents    = round_half_up(contracted * PACKAGE_DEPOSIT_PCT_SIGNING)
      pack_start_cents = round_half_up(contracted * PACKAGE_DEPOSIT_PCT_PACK_START)
      close_out_cents  = contracted - signing_cents - pack_start_cents
    input_set: "the four contracted line amounts on the engagement's invoice"
    constants:
      PACKAGE_DEPOSIT_PCT_SIGNING: 0.30
      PACKAGE_DEPOSIT_PCT_PACK_START: 0.40
      PACKAGE_DEPOSIT_PCT_CLOSE_OUT: 0.30
    precision: "whole cents; the LAST bucket absorbs the rounding remainder so the three buckets always sum exactly to `contracted`"
    note: "Reported through GET /engagements/{id}/summary as part of projected_total_cents; the close-out bucket is a residual, never an independent percentage."

  - name: truck_trip_count
    trigger: "on the DRAFT to CREWED transition and on POST /move-day-plans/{id}/complete"
    algorithm: threshold
    formula: |
      combined = MoveDayPlan.truck_capacity_cft * MoveDayPlan.truck_count
      full = floor(volume / combined)
      remainder = volume - (full * combined)
      trips = full + (1 if remainder > TRUCK_PARTIAL_TRIP_THRESHOLD_PCT * combined else 0)
      if volume > 0 and trips == 0: trips = 1
    input_set: "volume is Engagement.keep_volume_cft under PLANNED and MoveDayPlan.actual_loaded_volume_cft under ACTUAL"
    constants:
      TRUCK_PARTIAL_TRIP_THRESHOLD_PCT: 0.15
    precision: "integer trips"
    variants:
      - name: PLANNED
        when: "computed when the plan reaches CREWED and again at CONFIRMED, stored in planned_trip_count"
        difference: "uses Engagement.keep_volume_cft, i.e. only items designated KEEP"
      - name: ACTUAL
        when: "computed at completion, stored in actual_trip_count"
        difference: "uses the actual_loaded_volume_cft supplied by the crew, which includes packing material displacement and therefore usually exceeds keep_volume_cft"
    note: "Strict boundary: a remainder exactly equal to 15 percent of combined capacity is absorbed into the last trip and does NOT add a trip."

  - name: crew_min_required
    trigger: "on POST /move-day-plans and on every crew assignment confirm"
    algorithm: threshold
    formula: |
      # CREW_MIN_BY_HOME_TIER is the map STUDIO -> CREW_MIN_STUDIO (2),
      # ONE_BED -> CREW_MIN_ONE_BED (3), TWO_BED -> CREW_MIN_TWO_BED (4),
      # HOUSE -> CREW_MIN_HOUSE (6).
      crew_min_required = CREW_MIN_BY_HOME_TIER[Engagement.home_tier]
    input_set: "Engagement.home_tier, never package_tier"
    constants:
      CREW_MIN_STUDIO: 2
      CREW_MIN_ONE_BED: 3
      CREW_MIN_TWO_BED: 4
      CREW_MIN_HOUSE: 6
      CREW_LEAD_REQUIRED_COUNT: 1
    precision: "integer"

  - name: move_day_freeze_at
    trigger: "on POST /move-day-plans, on POST /move-day-plans/{id}/reschedule and on PATCH /engagements/{id}"
    algorithm: interval_merge
    formula: |
      MoveDayPlan.freeze_at_utc = MoveDayPlan.scheduled_start_utc - MOVE_FREEZE_HOURS hours
      Engagement.move_freeze_at_utc = Engagement.scheduled_move_start_utc - MOVE_FREEZE_HOURS hours
    input_set: "the scheduled start instants"
    constants:
      MOVE_FREEZE_HOURS: 72
    precision: "ISO 8601 UTC with three fractional digits"
    note: "The freeze window is entered when the clock is AT or AFTER freeze_at_utc; the boundary instant itself is inside the window."

  - name: room_effective_capacity
    trigger: "on POST /destination-rooms, on every placement transition, and on every designate that touches the room"
    algorithm: constraint_propagation
    formula: |
      if DestinationResidence.placement_status == "APPROVED":
          effective = round_half_up(nominal_linear_inches * APPROVED_CAPACITY_FACTOR
                                    + approved_addendum_linear_inches, 2)
      else:
          effective = round_half_up(nominal_linear_inches * PROVISIONAL_CAPACITY_FACTOR, 2)
    input_set: "one DestinationRoom plus its parent residence's placement_status"
    constants:
      PROVISIONAL_CAPACITY_FACTOR: 0.80
      APPROVED_CAPACITY_FACTOR: 1.00
    precision: "2 decimal places"
    variants:
      - name: PROVISIONAL
        when: "the parent residence placement_status is DRAFT or PROPOSED"
        difference: "applies a 0.80 derate and completely ignores approved_addendum_linear_inches"
      - name: APPROVED
        when: "the parent residence placement_status is APPROVED"
        difference: "no derate and the addendum is added, so capacity can more than double"
    note: "State-dependent capacity: the same room admits a different item set depending on whether the placement plan has been approved."

  - name: room_load_and_headroom
    trigger: "on every designate, on every placement transition, and on every room create"
    algorithm: aggregation
    formula: |
      keep_items = InventoryItem rows with assigned_room_id == this room AND disposition == "KEEP"
      keep_load_linear_inches = round_half_up(sum(i.footprint_linear_inches for i in keep_items), 2)
      keep_load_volume_cft    = round_half_up(sum(i.volume_cft for i in keep_items), 2)
      headroom_linear_inches  = round_half_up(effective_capacity_linear_inches - keep_load_linear_inches, 2)
    input_set: "only KEEP items assigned to this room; DONATE, SELL, HAUL_AWAY and UNDECIDED items assigned to the room contribute 0 to the load but still count in assigned_item_count"
    constants: {}
    precision: "2 decimal places"

  - name: space_fit_feasibility
    trigger: "on POST /inventory-items/{id}/designate with disposition KEEP and an assigned_room_id"
    algorithm: threshold
    formula: |
      prospective_load = keep_load_linear_inches (excluding this item if already in the room)
                         + item.footprint_linear_inches
      fits = prospective_load <= effective_capacity_linear_inches
      volume_fits = (keep_load_volume_cft_excluding_item + item.volume_cft)
                    <= round_half_up(nominal_volume_cft * ROOM_VOLUME_SAFETY_FACTOR, 2)
    input_set: "the target room's current KEEP load plus the item being designated"
    constants:
      ROOM_VOLUME_SAFETY_FACTOR: 0.90
    precision: "2 decimal places"
    note: "Inclusive boundary: a prospective load exactly equal to the effective capacity fits. Both the linear and the volume test must pass; the linear test is evaluated first and its error wins."

  - name: engagement_volume_estimate
    trigger: "on POST /engagements and on every inventory item create or delete"
    algorithm: forward_looking
    formula: |
      # ROOM_COUNT_BY_HOME_TIER is the map STUDIO -> ROOM_COUNT_STUDIO (2),
      # ONE_BED -> ROOM_COUNT_ONE_BED (3), TWO_BED -> ROOM_COUNT_TWO_BED (5),
      # HOUSE -> ROOM_COUNT_HOUSE (8).
      ASSESSMENT_HEURISTIC: estimate_cft = ROOM_COUNT_BY_HOME_TIER[home_tier] * VOLUME_PER_ROOM_CFT
      INVENTORY_ROLLUP:     estimate_cft = sum(InventoryItem.volume_cft for every item of the engagement)
    input_set: "the heuristic uses only home_tier; the rollup uses every item regardless of disposition or handling_state"
    constants:
      ROOM_COUNT_STUDIO: 2
      ROOM_COUNT_ONE_BED: 3
      ROOM_COUNT_TWO_BED: 5
      ROOM_COUNT_HOUSE: 8
      VOLUME_PER_ROOM_CFT: 180
    precision: "2 decimal places"
    variants:
      - name: ASSESSMENT_HEURISTIC
        when: "Engagement.inventory_item_count == 0, i.e. before any item has been catalogued"
        difference: "derives volume from the home tier alone and can be wildly wrong for a heavy downsizer"
      - name: INVENTORY_ROLLUP
        when: "Engagement.inventory_item_count >= 1"
        difference: "sums the catalogued items and is what Engagement.total_inventory_volume_cft stores"
    note: "GET /engagements/{id}/summary reports the rollup once any item exists, and the heuristic only while the catalogue is empty."

  - name: appraisal_route_decision
    trigger: "on POST /inventory-items/{id}/designate with disposition SELL"
    algorithm: threshold
    formula: |
      consignable = InventoryItem.appraised_value_cents >= CONSIGN_MIN_VALUE_CENTS
    input_set: "one InventoryItem"
    constants:
      CONSIGN_MIN_VALUE_CENTS: 15000
    precision: "whole cents"
    note: "Inclusive boundary: exactly CONSIGN_MIN_VALUE_CENTS is consignable; one cent less routes the item to DONATE and the SELL designation is refused."

  - name: donation_receipt_value
    trigger: "on POST /inventory-items/{id}/designate with disposition DONATE and on POST /inventory-items/{id}/appraise"
    algorithm: weighted_scoring
    formula: |
      if appraisal_source == "APPRAISED":
          raw = appraised_value_cents * DONATION_APPRAISED_FACTOR
      elif appraisal_source == "SELF_REPORTED":
          raw = appraised_value_cents * DONATION_SELF_REPORT_FACTOR
      else:
          raw = 0
      donation_receipt_cents = min(round_half_up(raw), DONATION_RECEIPT_CAP_CENTS)
    input_set: "one InventoryItem whose disposition is DONATE; items with any other disposition report 0"
    constants:
      DONATION_SELF_REPORT_FACTOR: 0.30
      DONATION_APPRAISED_FACTOR: 0.85
      DONATION_RECEIPT_CAP_CENTS: 500000
    precision: "whole cents, round_half_up before the cap"
    variants:
      - name: SELF_REPORTED
        when: "appraisal_source == SELF_REPORTED"
        difference: "applies the conservative 0.30 factor"
      - name: APPRAISED
        when: "appraisal_source == APPRAISED"
        difference: "applies the 0.85 factor, so the same item can be worth nearly three times as much on the receipt"

  - name: consignment_current_price
    trigger: "on POST /consignment-lots and on every POST /consignment-lots/{id}/mark-down"
    algorithm: decay_function
    formula: |
      pct = 0                      if markdown_round == 0
      pct = MARKDOWN_ROUND1_PCT    if markdown_round == 1
      pct = MARKDOWN_ROUND2_PCT    if markdown_round == 2
      current_price_cents = round_half_up(list_price_cents * (1 - pct))
    input_set: "one ConsignmentLot; each markdown percentage is taken off the ORIGINAL list price, never compounded off the previous price"
    constants:
      MARKDOWN_ROUND1_PCT: 0.20
      MARKDOWN_ROUND2_PCT: 0.35
      MAX_MARKDOWN_ROUNDS: 2
      CONSIGN_UNSOLD_WINDOW_DAYS: 30
    precision: "whole cents, round_half_up"

  - name: consignment_commission
    trigger: "on POST /consignment-lots/{id}/record-sale"
    algorithm: tiered_pricing
    formula: |
      g = gross_sale_price_cents
      if g <= COMMISSION_BAND1_MAX_CENTS:      rate = COMMISSION_BAND1_RATE
      elif g <= COMMISSION_BAND2_MAX_CENTS:    rate = COMMISSION_BAND2_RATE
      else:                                    rate = COMMISSION_BAND3_RATE
      commission_cents = round_half_up(g * rate)
    input_set: "the single gross sale price of one lot"
    constants:
      COMMISSION_BAND1_MAX_CENTS: 50000
      COMMISSION_BAND2_MAX_CENTS: 250000
      COMMISSION_BAND1_RATE: 0.50
      COMMISSION_BAND2_RATE: 0.40
      COMMISSION_BAND3_RATE: 0.30
    precision: "whole cents, round_half_up"
    note: "AVERAGE rate, not marginal: the selected rate applies to the whole gross. Both band boundaries are inclusive on the lower band, so 50000 pays 0.50 and 50001 pays 0.40."

  - name: consignment_fees
    trigger: "on POST /consignment-lots/{id}/record-sale"
    algorithm: aggregation
    formula: |
      photo = min(item_count * CONSIGN_PHOTO_FEE_CENTS_PER_ITEM, CONSIGN_PHOTO_FEE_CAP_CENTS)
      fees_cents = CONSIGN_PICKUP_FEE_CENTS + photo
    input_set: "ConsignmentLot.item_count, which is the count of InventoryItem rows pointing at the lot at the moment of sale"
    constants:
      CONSIGN_PICKUP_FEE_CENTS: 7500
      CONSIGN_PHOTO_FEE_CENTS_PER_ITEM: 1200
      CONSIGN_PHOTO_FEE_CAP_CENTS: 12000
    precision: "whole cents"

  - name: consignment_net_proceeds
    trigger: "on POST /consignment-lots/{id}/record-sale, immediately after consignment_commission and consignment_fees"
    algorithm: waterfall_allocation
    formula: |
      net_proceeds_cents = max(0, gross_sale_price_cents - commission_cents - fees_cents)
    input_set: "the three already-rounded integers"
    constants: {}
    precision: "whole cents; commission and fees are each rounded to whole cents BEFORE the subtraction, never rounded once at the end"
    note: "Combinatorial mode (b): the pinned order is round-each-component-then-subtract. Subtracting the unrounded products and rounding once produces a different cent on many inputs."

  - name: consignment_credit_amount
    trigger: "on POST /consignment-lots/{id}/settle and on POST /consignment-lots/{id}/return-to-client"
    algorithm: projection
    formula: |
      PROVISIONAL: credit_preview_cents = gross_sale_price_cents - commission_cents
      FINAL:       credit_posted_cents  = net_proceeds_cents
      reversal_amount_cents = the exact amount_cents of this lot's CONSIGNMENT_CREDIT line, negated
    input_set: "one ConsignmentLot; the reversal reads the posted line, never a recomputation"
    constants: {}
    precision: "whole cents"
    variants:
      - name: PROVISIONAL
        when: "the lot is SOLD but not yet SETTLED; shown in GET /consignment-lots/{id} as a preview only"
        difference: "omits fees_cents, so it always overstates the credit the client will actually receive"
      - name: FINAL
        when: "the lot reaches SETTLED and the CONSIGNMENT_CREDIT line is written"
        difference: "subtracts fees_cents as well, and this is the amount the reversal must mirror exactly"

  - name: disposal_fee
    trigger: "on POST /consignment-lots/{id}/haul-away"
    algorithm: threshold
    formula: |
      volume = sum(InventoryItem.volume_cft for items whose consignment_lot_id == this lot)
      disposal_fee_cents = max(DISPOSAL_MIN_FEE_CENTS, round_half_up(volume * DISPOSAL_FEE_CENTS_PER_CFT))
    input_set: "the lot's member items at haul time"
    constants:
      DISPOSAL_FEE_CENTS_PER_CFT: 145
      DISPOSAL_MIN_FEE_CENTS: 9500
      HAUL_MIN_LOAD_CFT: 250
      HAUL_AUTO_QUOTE_CENTS: 45000
    precision: "whole cents, round_half_up before the floor is applied"
    note: "HAUL_MIN_LOAD_CFT is the separate trigger threshold for auto-creating a JUNK_HAUL VendorAssignment from Engagement.haul_volume_cft; it does not enter the fee formula."

  - name: vendor_payout
    trigger: "on POST /vendor-assignments/{id}/accept, /perform and /sign-off"
    algorithm: waterfall_allocation
    formula: |
      holdback_cents = round_half_up(quoted_cents * Vendor.holdback_pct)
      INTERIM: paid_cents = quoted_cents - holdback_cents
      FINAL:   paid_cents = quoted_cents
    input_set: "one VendorAssignment plus the vendor's holdback_pct captured at accept time"
    constants:
      VENDOR_HOLDBACK_PCT_DEFAULT: 0.10
    precision: "whole cents, round_half_up"
    variants:
      - name: INTERIM
        when: "the assignment is PERFORMED but not yet SIGNED_OFF"
        difference: "withholds holdback_cents"
      - name: FINAL
        when: "the assignment reaches SIGNED_OFF"
        difference: "releases the holdback so paid_cents equals quoted_cents exactly; see INV_VENDOR_PAYOUT_CONSERVATION"

  - name: vendor_daily_load
    trigger: "on the ACCEPTED to SCHEDULED transition"
    algorithm: aggregation
    formula: |
      load = count(VendorAssignment rows with vendor_id == this vendor
                   AND service_date == this service_date
                   AND status in {SCHEDULED, COI_BLOCKED, PERFORMED, SIGNED_OFF, PAID})
      permitted = load < Vendor.daily_capacity
    input_set: "the vendor's assignments on the exact same calendar date; REQUESTED, ACCEPTED and CANCELLED rows do not consume capacity"
    constants:
      VENDOR_DAILY_CAPACITY_DEFAULT: 3
    precision: "integer"
    note: "Whole-day granularity: two assignments on the same date always collide once capacity is reached, regardless of the hour."

  - name: vendor_coi_validity
    trigger: "on the ACCEPTED to SCHEDULED transition and on every POST /engagements/{id}/ops-run"
    algorithm: interval_merge
    formula: |
      coi_valid = (Vendor.coi_expires_on >= VendorAssignment.service_date)
    input_set: "two YYYY-MM-DD dates compared as dates, not as instants"
    constants:
      VENDOR_COI_GRACE_DAYS: 0
    precision: "date granularity"
    note: "Inclusive boundary: a COI expiring exactly ON the service date is still valid. Half-open, unlike vendor_daily_load which is a closed-day count."

  - name: invoice_subtotal
    trigger: "on every invoice line append, on POST /invoices/{id}/issue and on POST /invoices/{id}/recall"
    algorithm: aggregation
    formula: |
      subtotal_cents = sum(l.amount_cents for l in lines
                           if l.line_type not in {COORDINATION_FEE, CONSIGNMENT_CREDIT, CONSIGNMENT_REVERSAL})
      credits_cents  = sum(l.amount_cents for l in lines
                           if l.line_type in {CONSIGNMENT_CREDIT, CONSIGNMENT_REVERSAL})
    input_set: "every InvoiceLine on the invoice, ordered by created_at ascending; the sum is order-insensitive"
    constants: {}
    precision: "whole cents"

  - name: invoice_coordination_fee
    trigger: "on POST /invoices/{id}/issue, after invoice_subtotal and before invoice_total"
    algorithm: tiered_pricing
    formula: |
      # Pinned evaluation order, step by step:
      # 1. subtotal_cents is computed from the lines, EXCLUDING any COORDINATION_FEE line.
      # 2. the tier is keyed on subtotal_cents, NOT on total_cents.
      # 3. fee = min(round_half_up(subtotal_cents * COORD_FEE_PCT), tier_cap)
      # 4. total_cents = subtotal_cents + fee + credits_cents
      if subtotal_cents <= COORD_FEE_TIER1_MAX_CENTS:   cap = COORD_FEE_TIER1_CAP_CENTS
      elif subtotal_cents <= COORD_FEE_TIER2_MAX_CENTS: cap = COORD_FEE_TIER2_CAP_CENTS
      else:                                             cap = COORD_FEE_TIER3_CAP_CENTS
      coordination_fee_cents = min(round_half_up(subtotal_cents * COORD_FEE_PCT), cap)
    input_set: "the invoice's non-credit, non-fee lines"
    constants:
      COORD_FEE_PCT: 0.06
      COORD_FEE_TIER1_MAX_CENTS: 300000
      COORD_FEE_TIER2_MAX_CENTS: 800000
      COORD_FEE_TIER1_CAP_CENTS: 18000
      COORD_FEE_TIER2_CAP_CENTS: 42000
      COORD_FEE_TIER3_CAP_CENTS: 75000
    precision: "whole cents, round_half_up"
    note: |
      Combinatorial mode (c): total depends on the fee and the fee looks like it
      depends on the total. The scaffold pins that the tier is keyed on the
      PRE-FEE subtotal and that credits are applied AFTER the fee, so the value
      is well defined. Because the caps are flat, the fee is non-monotone across
      the tier-2 boundary: a subtotal of 800000 pays 42000 while a subtotal of
      800001 pays 48000.

  - name: invoice_total_and_balance
    trigger: "after invoice_coordination_fee, and again on every line append or payment"
    algorithm: aggregation
    formula: |
      total_cents       = subtotal_cents + coordination_fee_cents + credits_cents
      balance_due_cents = total_cents - payments_cents
    input_set: "the three computed invoice aggregates plus recorded payments"
    constants: {}
    precision: "whole cents; balance_due_cents may be negative when the client overpaid"

  - name: milestone_due_on
    trigger: "on POST /engagements and on every PATCH /engagements/{id} that changes scheduled_move_start_utc"
    algorithm: projection
    formula: |
      # MILESTONE_OFFSET_DAYS is the map ASSESSMENT -> MILESTONE_OFFSET_ASSESSMENT_DAYS (-35),
      # SORT_PLAN -> -21, PACK -> -3, MOVE_DAY -> 0, SETTLE_IN -> 7, CLOSE_OUT -> 21.
      due_on = date(Engagement.scheduled_move_start_utc) + MILESTONE_OFFSET_DAYS[milestone_key]
    input_set: "the engagement's scheduled move date in UTC"
    constants:
      MILESTONE_OFFSET_ASSESSMENT_DAYS: -35
      MILESTONE_OFFSET_SORT_PLAN_DAYS: -21
      MILESTONE_OFFSET_PACK_DAYS: -3
      MILESTONE_OFFSET_MOVE_DAY_DAYS: 0
      MILESTONE_OFFSET_SETTLE_IN_DAYS: 7
      MILESTONE_OFFSET_CLOSE_OUT_DAYS: 21
    precision: "date, YYYY-MM-DD"

  - name: milestone_overdue_latch
    trigger: "on POST /engagements/{id}/ops-run"
    algorithm: projection
    formula: |
      for each Milestone of the engagement, in sequence_index ascending order:
        if status in {PENDING, IN_PROGRESS, REOPENED} and date(current_clock) > due_on:
            overdue_status = "OVERDUE"     # latches; never returns to ON_TIME
    input_set: "every Milestone of the engagement; COMPLETE milestones are skipped"
    constants: {}
    precision: "date granularity, strict comparison"
    note: "Strict boundary: a clock date exactly equal to due_on is NOT overdue."

  - name: punch_sla_due_at
    trigger: "on POST /punch-list-items"
    algorithm: projection
    formula: |
      # PUNCH_SLA_HOURS is the map CRITICAL -> PUNCH_SLA_HOURS_CRITICAL (24),
      # MAJOR -> PUNCH_SLA_HOURS_MAJOR (72), MINOR -> PUNCH_SLA_HOURS_MINOR (168).
      due_at_utc = created_at + PUNCH_SLA_HOURS[severity] hours
      breached_sla = (current_clock > due_at_utc) and status in {OPEN, REOPENED}
    input_set: "one PunchListItem"
    constants:
      PUNCH_SLA_HOURS_CRITICAL: 24
      PUNCH_SLA_HOURS_MAJOR: 72
      PUNCH_SLA_HOURS_MINOR: 168
    precision: "ISO 8601 UTC with three fractional digits"

  - name: engagement_progress_pct
    trigger: "on GET /engagements/{id}/summary and on every milestone transition"
    algorithm: weighted_scoring
    formula: |
      # MILESTONE_WEIGHT is the map ASSESSMENT -> MILESTONE_WEIGHT_ASSESSMENT (10),
      # SORT_PLAN -> 25, PACK -> 15, MOVE_DAY -> 30, SETTLE_IN -> 15, CLOSE_OUT -> 5.
      progress_pct = sum(MILESTONE_WEIGHT[m.milestone_key] for m of this engagement if m.status == "COMPLETE")
    input_set: "only milestones whose status is exactly COMPLETE; REOPENED and IN_PROGRESS contribute 0"
    constants:
      MILESTONE_WEIGHT_ASSESSMENT: 10
      MILESTONE_WEIGHT_SORT_PLAN: 25
      MILESTONE_WEIGHT_PACK: 15
      MILESTONE_WEIGHT_MOVE_DAY: 30
      MILESTONE_WEIGHT_SETTLE_IN: 15
      MILESTONE_WEIGHT_CLOSE_OUT: 5
    precision: "integer percent; the six weights sum to exactly 100"

  - name: authority_approval_ceiling_check
    trigger: "on every approval performed by a POWER_OF_ATTORNEY actor"
    algorithm: threshold
    formula: |
      subject_value = InventoryItem.appraised_value_cents                            # designate / hold resolve
      subject_value = max(appraised_value_cents of the engagement's non-KEEP items)  # sort plan approve
      permitted = (authority.status == "ACTIVE")
                  and (authority.authority_scope in {"FULL", "DISPOSITION_ONLY"})
                  and (authority.approval_ceiling_cents >= subject_value)
    input_set: "the acting party's AuthorityRecord rows in status ACTIVE; the highest approval_ceiling_cents among them is used"
    constants:
      AUTHORITY_DEFAULT_CEILING_CENTS: 100000
      HIGH_VALUE_DISPOSITION_THRESHOLD_CENTS: 250000
      MAX_AUTHORITY_SUSPENSIONS: 2
    precision: "whole cents"
    note: "Inclusive boundary: a ceiling exactly equal to the subject value permits the approval. Items at or above HIGH_VALUE_DISPOSITION_THRESHOLD_CENTS additionally require authority_scope FULL."

  - name: unpack_session_selector
    trigger: "on GET /engagements/{id}/summary and on the UnpackSession start precondition"
    algorithm: chronological
    formula: |
      candidates = UnpackSession rows of this engagement with status in {SCHEDULED, REOPENED}
      rank_key   = (0 if priority == "ESSENTIALS" else 1, scheduled_start_utc ascending)
      tie_break  = created_at ascending
      next_session = first candidate under (rank_key, tie_break)
      if candidates is empty: the summary reports next_unpack_session_id as null
    input_set: "SCHEDULED and REOPENED sessions only; IN_PROGRESS and COMPLETED sessions are excluded"
    constants:
      MAX_UNPACK_REOPENS: 2
    precision: "n/a"
    note: "Selector determinism: eligibility filter, ranking expression, tie-break and empty-pool fallback are all pinned; created_at is the fallback ordering, never id."

  - name: engagement_phase_derivation
    trigger: "on every milestone status change and on every read of Engagement.phase"
    algorithm: projection
    formula: |
      open = milestones of this engagement with status in {PENDING, IN_PROGRESS, REOPENED}
      phase = milestone_key of the open milestone with the LOWEST sequence_index
      if open is empty: phase = "DONE"
    input_set: "the engagement's six Milestone rows"
    constants:
      MAX_MILESTONE_REOPENS: 2
      MAX_PUNCH_REOPENS: 3
      MAX_SORT_PLAN_REOPENS: 2
      MAX_MOVE_DAY_RESCHEDULES: 1
      MAX_HOLD_ESCALATIONS: 2
      MAX_INVOICE_RECALLS: 2
      MAX_INVOICE_DISPUTES: 2
    precision: "n/a"
    note: "Re-entry is well defined: reopening milestone N moves phase back to N even when milestones N+1.. were never started."

# ---------------------------------------------------------------------------
# 1.4 VALIDATION RULES TABLE  (ONE priority ladder, 73 numbered rungs)
# The ladder is global: every mutating endpoint walks rungs 1 through 73 in
# order and returns the error of the FIRST rung it fails. Rung numbers map onto
# the ordered write gates in `gate_precedence` above. Rungs that only apply to
# one billing pipeline say so in `check:`; the ladder itself is shared.
# ---------------------------------------------------------------------------
validations:

  # ---- gate 1: envelope, auth, body shape (rungs 1-7) ----
  - priority: 1
    category: auth
    check: "X-User-Role header is present and non-empty."
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the eight roles declared in the RBAC matrix."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "X-User-ID header is present whenever the acting role's identity is entity_backed, that is CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY, CREW_LEAD or VENDOR."
    error_id: ERR_MISSING_USER_ID
    http_status: 401
    applies_to: all
  - priority: 4
    category: auth
    check: "The acting role appears in the endpoint's declared roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 5
    category: business_constraint
    check: "Every required input field of the endpoint is present and of the declared type; numeric fields that the domain requires positive (quoted_cents, list_price_cents, gross_sale_price_cents, amount_cents on a charge line, truck_capacity_cft, truck_count, footprint_linear_inches, volume_cft, nominal_linear_inches, nominal_volume_cft) are greater than 0."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all
  - priority: 6
    category: business_constraint
    check: "Every enum-typed input field carries a declared member of that enum. This applies to billing_mode, home_tier, package_tier, party_type, authority_scope, unit_type, room_type, category, appraisal_source, disposition, target_handling_state, entry_kind, crew_role, vendor_type, service_kind, line_type, priority, severity, resolution and milestone_key, and to no other field."
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: all
  - priority: 7
    category: business_constraint
    check: "On list endpoints, limit is an integer in 1..100 and offset is an integer greater than or equal to 0."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "every GET endpoint returning an array"

  # ---- gate 2: existence, path first then body FKs (rungs 8-21) ----
  - priority: 8
    category: existence
    check: "The engagement id in the path, or the engagement_id in the body, resolves to an Engagement."
    error_id: ERR_ENGAGEMENT_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying an engagement id"
  - priority: 9
    category: existence
    check: "client_id in the body resolves to a Client."
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /engagements, POST /portal-parties, GET /clients/{id}"
  - priority: 10
    category: existence
    check: "Every party id field in path or body resolves to a PortalParty: holder_party_id, approved_by_party_id, raised_by_party_id, resolved_by_party_id, signed_off_by_party_id, completed_by_party_id, acting_party_id."
    error_id: ERR_PARTY_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a party id"
  - priority: 11
    category: existence
    check: "The authority record id in the path resolves to an AuthorityRecord."
    error_id: ERR_AUTHORITY_NOT_FOUND
    http_status: 404
    applies_to: "/authority-records/{id} endpoints"
  - priority: 12
    category: existence
    check: "The residence id in the path, or destination_residence_id in the body, resolves to a DestinationResidence."
    error_id: ERR_RESIDENCE_NOT_FOUND
    http_status: 404
    applies_to: "/destination-residences/{id} endpoints and POST /destination-rooms"
  - priority: 13
    category: existence
    check: "The room id in the path, or assigned_room_id in the body, resolves to a DestinationRoom."
    error_id: ERR_ROOM_NOT_FOUND
    http_status: 404
    applies_to: "/destination-rooms/{id} endpoints and POST /inventory-items/{id}/designate"
  - priority: 14
    category: existence
    check: "The inventory item id in the path, inventory_item_id in the body, or every member of item_ids, resolves to an InventoryItem."
    error_id: ERR_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "/inventory-items/{id} endpoints, POST /family-holds, POST /consignment-lots"
  - priority: 15
    category: existence
    check: "The family hold id in the path resolves to a FamilyHold."
    error_id: ERR_HOLD_NOT_FOUND
    http_status: 404
    applies_to: "/family-holds/{id} endpoints"
  - priority: 16
    category: existence
    check: "The sort plan or move day plan id in the path, or move_day_plan_id in the body, resolves."
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "/sort-plans/{id} and /move-day-plans/{id} endpoints, POST /crew-assignments"
  - priority: 17
    category: existence
    check: "crew_member_id, crew_assignment_id, replaces_assignment_id and the crew or time-entry id in the path all resolve."
    error_id: ERR_CREW_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "/crew-members/{id}, /crew-assignments/{id}, /time-entries/{id} endpoints, POST /crew-assignments, POST /time-entries"
  - priority: 18
    category: existence
    check: "vendor_id in the body and the vendor or vendor-assignment id in the path resolve."
    error_id: ERR_VENDOR_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "/vendors/{id} and /vendor-assignments/{id} endpoints, POST /vendor-assignments, POST /consignment-lots"
  - priority: 19
    category: existence
    check: "The consignment lot id in the path, or source_consignment_lot_id in the body, resolves to a ConsignmentLot."
    error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    applies_to: "/consignment-lots/{id} endpoints, POST /invoice-lines"
  - priority: 20
    category: existence
    check: "The invoice or invoice-line id in the path, or invoice_id in the body, resolves."
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "/invoices/{id} and /invoice-lines/{id} endpoints, POST /invoice-lines"
  - priority: 21
    category: existence
    check: "The milestone, unpack-session or punch-list id in the path, or unpack_session_id in the body, resolves."
    error_id: ERR_TIMELINE_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "/milestones/{id}, /unpack-sessions/{id}, /punch-list-items/{id} endpoints, POST /punch-list-items, POST /inventory-items/{id}/advance-handling"

  # ---- gate 3: engagement lifecycle (rungs 22-24) ----
  - priority: 22
    category: state
    check: "The owning Engagement.status is not CLOSED."
    error_id: ERR_ENGAGEMENT_CLOSED
    http_status: 409
    applies_to: "every mutating endpoint under an engagement"
  - priority: 23
    category: state
    check: "The owning Engagement.status is not CANCELLED."
    error_id: ERR_ENGAGEMENT_CANCELLED
    http_status: 409
    applies_to: "every mutating endpoint under an engagement"
  - priority: 24
    category: state
    check: "The owning Engagement.status is not ON_HOLD, except for POST /engagements/{id}/resume and POST /engagements/{id}/cancel."
    error_id: ERR_ENGAGEMENT_ON_HOLD
    http_status: 409
    applies_to: "every mutating endpoint under an engagement except resume and cancel"

  # ---- gate 4: actor authority (rungs 25-30) ----
  - priority: 25
    category: auth
    check: "Entity-backed ownership holds: a CLIENT actor's X-User-ID equals the Client.id of the engagement, a FAMILY_MEMBER or POWER_OF_ATTORNEY actor's X-User-ID equals a PortalParty.id on the engagement, a VENDOR actor's X-User-ID equals the VendorAssignment.vendor_id or the ConsignmentLot.vendor_id, and a CREW_LEAD actor's X-User-ID equals a CrewMember.id holding a non-terminal CrewAssignment on the engagement's MoveDayPlan."
    error_id: ERR_ACTOR_NOT_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles list contains an entity_backed role"
  - priority: 26
    category: business_referential
    check: "Every supplied party id belongs to the same engagement as the subject resource."
    error_id: ERR_PARTY_ENGAGEMENT_MISMATCH
    http_status: 422
    applies_to: "every endpoint carrying a party id"
  - priority: 27
    category: auth
    check: "A POWER_OF_ATTORNEY actor holds at least one AuthorityRecord whose holder_party_id is the acting party and whose status is ACTIVE."
    error_id: ERR_NO_ACTIVE_AUTHORITY
    http_status: 403
    applies_to: "POST /sort-plans/{id}/approve, POST /sort-plans/{id}/reject, POST /inventory-items/{id}/designate, POST /family-holds/{id}/resolve, POST /destination-residences/{id}/approve-placement, POST /vendor-assignments/{id}/sign-off, POST /invoices/{id}/dispute"
  - priority: 28
    category: auth
    check: "The ACTIVE AuthorityRecord's authority_scope covers the operation family: FULL or DISPOSITION_ONLY for disposition, sort-plan and placement approvals, FULL or BILLING_ONLY for invoice disputes and vendor sign-off."
    error_id: ERR_AUTHORITY_SCOPE_INSUFFICIENT
    http_status: 403
    applies_to: "the same endpoints as rung 27"
  - priority: 29
    category: business_safety
    check: "When the subject InventoryItem.appraised_value_cents is at or above HIGH_VALUE_DISPOSITION_THRESHOLD_CENTS, the acting authority_scope must be exactly FULL; DISPOSITION_ONLY is not enough."
    error_id: ERR_HIGH_VALUE_AUTHORITY_REQUIRED
    http_status: 403
    applies_to: "POST /inventory-items/{id}/designate, POST /family-holds/{id}/resolve"
  - priority: 30
    category: business_fiscal
    check: "The acting party's active_authority_ceiling_cents is greater than or equal to the subject value, which is the item's appraised_value_cents for a single-item approval and the maximum appraised_value_cents among the engagement's non-KEEP items for a sort-plan approval. The boundary is inclusive."
    error_id: ERR_AUTHORITY_CEILING_EXCEEDED
    http_status: 403
    applies_to: "the same endpoints as rung 27"

  # ---- gate 5: timeline phase (rungs 31-34) ----
  - priority: 31
    category: state
    check: "Engagement.phase permits the operation: inventory create and designate require phase ASSESSMENT or SORT_PLAN, move-day plan writes require phase PACK or MOVE_DAY, unpack and punch-list writes require phase SETTLE_IN or CLOSE_OUT."
    error_id: ERR_PHASE_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /inventory-items, POST /inventory-items/{id}/designate, POST /move-day-plans, POST /unpack-sessions, POST /punch-list-items"
  - priority: 32
    category: state
    check: "A milestone can be completed only when the Milestone with sequence_index minus 1 on the same engagement is COMPLETE."
    error_id: ERR_PREDECESSOR_MILESTONE_INCOMPLETE
    http_status: 409
    applies_to: "POST /milestones/{id}/complete"
  - priority: 33
    category: state
    check: "A milestone can be reopened only when no Milestone of the same engagement with a higher sequence_index is COMPLETE."
    error_id: ERR_SUCCESSOR_MILESTONE_COMPLETE
    http_status: 409
    applies_to: "POST /milestones/{id}/reopen"
  - priority: 34
    category: business_safety
    check: "Close-out requires the CLOSE_OUT Milestone COMPLETE, no PunchListItem in status OPEN or REOPENED, and Engagement.billing_hold false."
    error_id: ERR_CLOSE_OUT_BLOCKED
    http_status: 409
    applies_to: "POST /engagements/{id}/close-out"

  # ---- gate 6: move-day freeze window (rungs 35-38) ----
  - priority: 35
    category: business_temporal
    check: "Once the logical clock is at or after MoveDayPlan.freeze_at_utc the crew roster is locked: no crew assignment may be created, confirmed or recrewed."
    error_id: ERR_FREEZE_WINDOW_ENTERED
    http_status: 409
    applies_to: "POST /crew-assignments, POST /crew-assignments/{id}/confirm, POST /move-day-plans/{id}/recrew"
  - priority: 36
    category: business_temporal
    check: "Once the logical clock is at or after MoveDayPlan.freeze_at_utc no InventoryItem may be designated or appraised."
    error_id: ERR_FREEZE_WINDOW_ENTERED
    http_status: 409
    applies_to: "POST /inventory-items/{id}/designate, POST /inventory-items/{id}/appraise"
  - priority: 37
    category: state
    check: "A SortPlan in status FROZEN can never be reopened, regardless of reopen_count."
    error_id: ERR_SORT_PLAN_FROZEN
    http_status: 409
    applies_to: "POST /sort-plans/{id}/reopen"
  - priority: 38
    category: business_temporal
    check: "POST /move-day-plans/{id}/freeze requires the logical clock to be at or after MoveDayPlan.freeze_at_utc; the boundary instant itself is inside the window."
    error_id: ERR_FREEZE_WINDOW_NOT_ENTERED
    http_status: 409
    applies_to: "POST /move-day-plans/{id}/freeze"

  # ---- gate 7: disposition lock and family hold (rungs 39-42) ----
  - priority: 39
    category: state
    check: "InventoryItem.disposition_locked is false."
    error_id: ERR_DISPOSITION_LOCKED
    http_status: 409
    applies_to: "POST /inventory-items/{id}/designate"
  - priority: 40
    category: business_safety
    check: "InventoryItem.hold_state is NONE, that is no FamilyHold on the item is OPEN or ESCALATED."
    error_id: ERR_ITEM_UNDER_FAMILY_HOLD
    http_status: 409
    applies_to: "POST /inventory-items/{id}/designate"
  - priority: 41
    category: business_safety
    check: "InventoryItem.hold_state is NONE for appraisal, staging and consignment membership."
    error_id: ERR_ITEM_UNDER_FAMILY_HOLD
    http_status: 409
    applies_to: "POST /inventory-items/{id}/appraise, POST /inventory-items/{id}/advance-handling with target STAGED_FOR_PICKUP, POST /consignment-lots"
  - priority: 42
    category: business_referential
    check: "An InventoryItem whose consignment_lot_id is not null cannot be designated to anything other than SELL."
    error_id: ERR_ITEM_ALREADY_CONSIGNED
    http_status: 409
    applies_to: "POST /inventory-items/{id}/designate"

  # ---- gate 8: vendor eligibility (rungs 43-45) ----
  - priority: 43
    category: business_referential
    check: "service_kind matches the vendor's vendor_type under the pinned map: HAUL_AWAY to JUNK_HAUL, CONSIGNMENT_PICKUP to CONSIGNMENT, APPRAISAL to APPRAISAL, CLEANING to CLEANING, SHREDDING to SHREDDING."
    error_id: ERR_VENDOR_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /vendor-assignments, POST /consignment-lots"
  - priority: 44
    category: business_safety
    check: "The vendor's coi_expires_on is not earlier than VendorAssignment.service_date; a COI expiring exactly on the service date is valid."
    error_id: ERR_VENDOR_COI_EXPIRED
    http_status: 422
    applies_to: "POST /vendor-assignments/{id}/schedule"
  - priority: 45
    category: business_constraint
    check: "The vendor's count of assignments on the same service_date whose status is SCHEDULED, COI_BLOCKED, PERFORMED, SIGNED_OFF or PAID is strictly less than Vendor.daily_capacity."
    error_id: ERR_VENDOR_DAILY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /vendor-assignments/{id}/schedule"

  # ---- gate 9: billing finalization (rungs 46-47) ----
  - priority: 46
    category: state
    check: "The engagement's Invoice.status is not FINALIZED when a ledger line would be appended."
    error_id: ERR_INVOICE_FINALIZED
    http_status: 409
    applies_to: "POST /invoice-lines, POST /invoices/{id}/record-payment, POST /invoices/{id}/dispute, POST /invoices/{id}/recall"
  - priority: 47
    category: state
    check: "The engagement's Invoice.status is not FINALIZED when a consignment settlement, reversal, disposal fee or vendor payout would post."
    error_id: ERR_BILLING_CLOSED
    http_status: 409
    applies_to: "POST /consignment-lots/{id}/settle, POST /consignment-lots/{id}/return-to-client, POST /consignment-lots/{id}/haul-away, POST /vendor-assignments/{id}/pay, POST /vendor-assignments/{id}/perform"

  # ---- gate 10: state-machine preconditions and capped retries (rungs 48-63) ----
  - priority: 48
    category: state
    check: "The subject entity's current state is in the triggered transition's declared `from` set."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"
  - priority: 49
    category: state
    check: "The subject entity is not already in one of its machine's terminal states."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"
  - priority: 50
    category: business_temporal
    check: "ended_at_utc is strictly after started_at_utc on a TimeEntry, and check-out at_utc is strictly after checked_in_at_utc."
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /time-entries, POST /crew-assignments/{id}/check-out"
  - priority: 51
    category: business_fiscal
    check: "gross_sale_price_cents is greater than 0 and the lot has at least one member item."
    error_id: ERR_INVALID_SALE_PRICE
    http_status: 422
    applies_to: "POST /consignment-lots/{id}/record-sale"
  - priority: 52
    category: business_constraint
    check: "At submit time no InventoryItem of the engagement is UNDECIDED; at approve time SortPlan.undecided_count_at_submit is 0."
    error_id: ERR_UNDECIDED_ITEMS_REMAIN
    http_status: 422
    applies_to: "POST /sort-plans/{id}/submit, POST /sort-plans/{id}/approve"
  - priority: 53
    category: business_constraint
    check: "The engagement has at least one InventoryItem before a sort plan may be submitted."
    error_id: ERR_NO_INVENTORY
    http_status: 422
    applies_to: "POST /sort-plans/{id}/submit"
  - priority: 54
    category: state
    check: "A ConsignmentLot that has already been credited cannot be settled a second time."
    error_id: ERR_LOT_ALREADY_CREDITED
    http_status: 409
    applies_to: "POST /consignment-lots/{id}/settle"
  - priority: 55
    category: business_temporal
    check: "A lot may be declared unsold only once the logical clock date is at least CONSIGN_UNSOLD_WINDOW_DAYS days after listed_on."
    error_id: ERR_UNSOLD_WINDOW_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /consignment-lots/{id}/declare-unsold"
  - priority: 56
    category: business_constraint
    check: "A STANDARD unpack session may start only when every ESSENTIALS session of the same engagement created earlier is COMPLETED."
    error_id: ERR_ESSENTIALS_SESSION_PENDING
    http_status: 409
    applies_to: "POST /unpack-sessions/{id}/start"
  - priority: 57
    category: business_temporal
    check: "AuthorityRecord effective_to_utc is strictly after effective_from_utc at creation; activation requires the clock at or after effective_from_utc and strictly before effective_to_utc; reinstatement requires the clock strictly before effective_to_utc."
    error_id: ERR_AUTHORITY_WINDOW_INVALID
    http_status: 409
    applies_to: "POST /authority-records, POST /authority-records/{id}/activate, POST /authority-records/{id}/reinstate"
  - priority: 58
    category: business_constraint
    check: "SortPlan.reopen_count is strictly less than MAX_SORT_PLAN_REOPENS."
    error_id: ERR_SORT_PLAN_REOPEN_LIMIT
    http_status: 409
    applies_to: "POST /sort-plans/{id}/reopen"
  - priority: 59
    category: business_constraint
    check: "MoveDayPlan.reschedule_count is strictly less than MAX_MOVE_DAY_RESCHEDULES, and new_start_utc is strictly after the current logical clock."
    error_id: ERR_RESCHEDULE_LIMIT
    http_status: 409
    applies_to: "POST /move-day-plans/{id}/reschedule"
  - priority: 60
    category: business_constraint
    check: "ConsignmentLot.markdown_round is strictly less than MAX_MARKDOWN_ROUNDS."
    error_id: ERR_MARKDOWN_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /consignment-lots/{id}/mark-down"
  - priority: 61
    category: business_constraint
    check: "Milestone.reopen_count is below MAX_MILESTONE_REOPENS, UnpackSession.reopen_count is below MAX_UNPACK_REOPENS, and PunchListItem.reopen_count is below MAX_PUNCH_REOPENS."
    error_id: ERR_REOPEN_LIMIT
    http_status: 409
    applies_to: "POST /milestones/{id}/reopen, POST /punch-list-items/{id}/reopen"
  - priority: 62
    category: business_constraint
    check: "Invoice.recall_count is below MAX_INVOICE_RECALLS and Invoice.dispute_count is below MAX_INVOICE_DISPUTES."
    error_id: ERR_INVOICE_ACTION_LIMIT
    http_status: 409
    applies_to: "POST /invoices/{id}/recall, POST /invoices/{id}/dispute"
  - priority: 63
    category: business_constraint
    check: "FamilyHold.escalation_count and FamilyHold.remand_count are each strictly below MAX_HOLD_ESCALATIONS, and AuthorityRecord.suspend_count is strictly below MAX_AUTHORITY_SUSPENSIONS."
    error_id: ERR_HOLD_ESCALATION_LIMIT
    http_status: 409
    applies_to: "POST /family-holds/{id}/escalate, POST /family-holds/{id}/remand, POST /authority-records/{id}/suspend"

  # ---- gate 11: optimistic concurrency (rungs 64-66) ----
  - priority: 64
    category: business_constraint
    check: "expected_engagement_version equals Engagement.version."
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
    applies_to: "POST /sort-plans"
  - priority: 65
    category: business_constraint
    check: "expected_move_day_plan_version equals MoveDayPlan.version."
    error_id: ERR_STALE_MOVE_DAY_PLAN_VERSION
    http_status: 412
    applies_to: "POST /crew-assignments"
  - priority: 66
    category: business_constraint
    check: "expected_invoice_version equals Invoice.version."
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412
    applies_to: "POST /invoice-lines"

  # ---- gate 12: capacity and arithmetic (rungs 67-73) ----
  - priority: 67
    category: business_constraint
    check: "package_tier is present and non-null when billing_mode is PACKAGE, and is absent or null when billing_mode is HOURLY. This is the single rung where the two pipelines diverge at creation."
    error_id: ERR_PACKAGE_TIER_REQUIRED
    http_status: 422
    applies_to: "POST /engagements, PATCH /engagements/{id}"
  - priority: 68
    category: business_constraint
    check: "The target room's prospective KEEP linear load, including the item being designated, is less than or equal to its effective_capacity_linear_inches. The boundary is inclusive."
    error_id: ERR_ROOM_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /inventory-items/{id}/designate with disposition KEEP"
  - priority: 69
    category: business_constraint
    check: "The target room's prospective KEEP volume load is less than or equal to nominal_volume_cft times ROOM_VOLUME_SAFETY_FACTOR. Evaluated only after rung 68 passes."
    error_id: ERR_ROOM_VOLUME_EXCEEDED
    http_status: 422
    applies_to: "POST /inventory-items/{id}/designate with disposition KEEP"
  - priority: 70
    category: business_fiscal
    check: "An item designated SELL has appraised_value_cents greater than or equal to CONSIGN_MIN_VALUE_CENTS. The boundary is inclusive."
    error_id: ERR_ITEM_BELOW_CONSIGN_MINIMUM
    http_status: 422
    applies_to: "POST /inventory-items/{id}/designate with disposition SELL"
  - priority: 71
    category: business_safety
    check: "MoveDayPlan.crew_confirmed_count is greater than or equal to MoveDayPlan.crew_min_required at start."
    error_id: ERR_CREW_MINIMUM_NOT_MET
    http_status: 422
    applies_to: "POST /move-day-plans/{id}/start"
  - priority: 72
    category: business_safety
    check: "At least CREW_LEAD_REQUIRED_COUNT of the plan's non-terminal assignments belong to a CrewMember whose crew_role is LEAD, at start."
    error_id: ERR_CREW_LEAD_REQUIRED
    http_status: 422
    applies_to: "POST /move-day-plans/{id}/start"
  - priority: 73
    category: business_fiscal
    check: "Invoice.balance_due_cents is less than or equal to 0 at finalization."
    error_id: ERR_BALANCE_OUTSTANDING
    http_status: 409
    applies_to: "POST /invoices/{id}/finalize"

# ---------------------------------------------------------------------------
# 1.5 API ENDPOINT TABLE  (120 endpoints)
# All paths are rooted at the API root; `api_prefix` is "/".
# ---------------------------------------------------------------------------
endpoints:

  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00.000Z and never falls back to real wall-clock time."
    roles: [PLATFORM_ADMIN, MOVE_MANAGER]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["every subsequent deadline, freeze-window, COI and SLA evaluation uses the new instant"]

  # ---- Client ----
  - method: POST
    path: "/clients"
    description: "Registers a senior client."
    roles: [MOVE_MANAGER]
    code: 201
    input: [full_name, phone, "email?"]
    output: Client
    side_effects: ["engagement_count initialised to 0"]
  - method: GET
    path: "/clients/{id}"
    description: "Reads one client."
    roles: [MOVE_MANAGER, BILLING_ADMIN, CLIENT]
    code: 200
    input: []
    output: Client
    side_effects: []

  # ---- Engagement ----
  - method: POST
    path: "/engagements"
    description: "Opens a move engagement for a client and lays down its timeline and ledger."
    roles: [MOVE_MANAGER]
    code: 201
    input: [client_id, billing_mode, home_tier, scheduled_move_start_utc, mileage_miles, origin_stairs_flights, origin_long_carry_feet, "package_tier?"]
    output: Engagement
    side_effects:
      - "creates the six Milestone rows with sequence_index 1..6 and their due_on dates"
      - "sets the ASSESSMENT Milestone to IN_PROGRESS so Engagement.phase is ASSESSMENT"
      - "creates exactly one Invoice in status DRAFT"
      - "when billing_mode is PACKAGE, appends a PACKAGE_BASE InvoiceLine equal to package_base_charge"
      - "computes move_freeze_at_utc"
      - "increments Client.engagement_count by 1"
  - method: GET
    path: "/engagements"
    description: "Lists engagements with filters."
    roles: [MOVE_MANAGER, BILLING_ADMIN, PLATFORM_ADMIN, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: ["client_id?", "status?", "phase?", "limit?", "offset?"]
    output: Engagement[]
    side_effects: []
  - method: GET
    path: "/engagements/{id}"
    description: "Reads one engagement including its derived phase, rollups and version."
    roles: [MOVE_MANAGER, BILLING_ADMIN, PLATFORM_ADMIN, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY, CREW_LEAD]
    code: 200
    input: []
    output: Engagement
    side_effects: []
  - method: PATCH
    path: "/engagements/{id}"
    description: "Adjusts schedule, surcharge inputs or package tier."
    roles: [MOVE_MANAGER]
    code: 200
    input: ["scheduled_move_start_utc?", "mileage_miles?", "origin_stairs_flights?", "origin_long_carry_feet?", "package_tier?"]
    output: Engagement
    side_effects:
      - "recomputes move_freeze_at_utc and every Milestone.due_on"
      - "increments Engagement.version by 1"
  - method: POST
    path: "/engagements/{id}/hold"
    description: "Places the engagement ON_HOLD."
    roles: [MOVE_MANAGER]
    code: 200
    input: [reason]
    output: Engagement
    side_effects: ["increments hold_count", "increments Engagement.version by 1"]
  - method: POST
    path: "/engagements/{id}/resume"
    description: "Returns an ON_HOLD engagement to ACTIVE."
    roles: [MOVE_MANAGER]
    code: 200
    input: []
    output: Engagement
    side_effects: ["clears hold_reason", "increments Engagement.version by 1"]
  - method: POST
    path: "/engagements/{id}/cancel"
    description: "Cancels the engagement and its open vendor work."
    roles: [MOVE_MANAGER]
    code: 200
    input: [reason]
    output: Engagement
    side_effects: ["cancels open VendorAssignment rows", "closes SCHEDULED UnpackSession rows", "increments Engagement.version by 1"]
  - method: POST
    path: "/engagements/{id}/close-out"
    description: "Closes the engagement, releases remaining vendor holdbacks and finalises the invoice."
    roles: [MOVE_MANAGER]
    code: 200
    input: [signed_off_by_party_id]
    output: Engagement
    side_effects: ["releases SIGNED_OFF holdbacks", "transitions the Invoice ISSUED to FINALIZED", "increments Engagement.version by 1"]
  - method: POST
    path: "/engagements/{id}/ops-run"
    description: "Ops-run checkpoint: latches milestone overdue status, expires authority records past their window, and moves SCHEDULED vendor assignments whose COI now expires before their service date into COI_BLOCKED."
    roles: [MOVE_MANAGER, PLATFORM_ADMIN]
    code: 200
    input: []
    output: "{ engagement_id: string, milestones_flagged_overdue: integer, authorities_expired: integer, vendor_assignments_blocked: integer, ops_run_seq: integer }"
    side_effects: ["increments Engagement.ops_run_seq by 1", "increments Engagement.version by 1"]
  - method: GET
    path: "/engagements/{id}/summary"
    description: |
      Computed read of the engagement's derived state. `projected_total_cents` is
      pinned as the value Invoice.total_cents WOULD take if POST /invoices/{id}/issue
      were called at this instant, that is the current subtotal plus the travel,
      stairs and long-carry surcharges plus the coordination fee computed from that
      pre-fee subtotal, plus credits. `volume_estimate_variant` is
      ASSESSMENT_HEURISTIC while inventory_item_count is 0 and INVENTORY_ROLLUP
      afterwards. `open_hold_count` counts FamilyHold rows in status OPEN or
      ESCALATED. `next_unpack_session_id` is the selector winner from
      calculations.unpack_session_selector, or null when the candidate pool is empty.
    roles: [MOVE_MANAGER, BILLING_ADMIN, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: []
    output: "{ engagement_id: string, phase: string, billing_mode: string, accrued_labor_cents: integer, billing_hours_total: number, volume_estimate_variant: string, volume_estimate_cft: number, projected_total_cents: integer, open_hold_count: integer, progress_pct: integer, next_unpack_session_id: string }"
    side_effects: []

  # ---- PortalParty ----
  - method: POST
    path: "/portal-parties"
    description: "Adds a seat to the family portal."
    roles: [MOVE_MANAGER]
    code: 201
    input: [engagement_id, party_type, display_name, email, "client_id?"]
    output: PortalParty
    side_effects: ["can_approve_dispositions initialised false"]
  - method: GET
    path: "/portal-parties"
    description: "Lists portal parties."
    roles: [MOVE_MANAGER, BILLING_ADMIN, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: ["engagement_id?", "client_id?", "party_type?", "limit?", "offset?"]
    output: PortalParty[]
    side_effects: []
  - method: GET
    path: "/portal-parties/{id}"
    description: "Reads one portal party including its derived approval capability."
    roles: [MOVE_MANAGER, BILLING_ADMIN, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: []
    output: PortalParty
    side_effects: []

  # ---- AuthorityRecord ----
  - method: POST
    path: "/authority-records"
    description: "Records a delegated authority for a portal party."
    roles: [MOVE_MANAGER]
    code: 201
    input: [engagement_id, holder_party_id, authority_scope, effective_from_utc, effective_to_utc, "approval_ceiling_cents?"]
    output: AuthorityRecord
    side_effects: ["created in status PENDING"]
  - method: GET
    path: "/authority-records"
    description: "Lists authority records."
    roles: [MOVE_MANAGER, BILLING_ADMIN, CLIENT, POWER_OF_ATTORNEY]
    code: 200
    input: ["engagement_id?", "holder_party_id?", "status?", "limit?", "offset?"]
    output: AuthorityRecord[]
    side_effects: []
  - method: GET
    path: "/authority-records/{id}"
    description: "Reads one authority record."
    roles: [MOVE_MANAGER, BILLING_ADMIN, CLIENT, POWER_OF_ATTORNEY]
    code: 200
    input: []
    output: AuthorityRecord
    side_effects: []
  - method: POST
    path: "/authority-records/{id}/activate"
    description: "Activates a pending authority."
    roles: [MOVE_MANAGER]
    code: 200
    input: []
    output: AuthorityRecord
    side_effects: ["recomputes the holder's can_approve_dispositions and active_authority_ceiling_cents"]
  - method: POST
    path: "/authority-records/{id}/suspend"
    description: "Suspends an active authority."
    roles: [MOVE_MANAGER]
    code: 200
    input: [reason]
    output: AuthorityRecord
    side_effects: ["increments suspend_count", "recomputes the holder's derived approval fields"]
  - method: POST
    path: "/authority-records/{id}/reinstate"
    description: "Returns a suspended authority to ACTIVE."
    roles: [MOVE_MANAGER]
    code: 200
    input: []
    output: AuthorityRecord
    side_effects: ["recomputes the holder's derived approval fields"]
  - method: POST
    path: "/authority-records/{id}/revoke"
    description: "Revokes an authority irreversibly."
    roles: [MOVE_MANAGER, CLIENT]
    code: 200
    input: [reason]
    output: AuthorityRecord
    side_effects: ["recomputes the holder's derived approval fields"]

  # ---- DestinationResidence ----
  - method: POST
    path: "/destination-residences"
    description: "Registers the destination residence for an engagement."
    roles: [MOVE_MANAGER]
    code: 201
    input: [engagement_id, name, unit_type, address_line]
    output: DestinationResidence
    side_effects: ["placement_status initialised DRAFT"]
  - method: GET
    path: "/destination-residences"
    description: "Lists destination residences."
    roles: [MOVE_MANAGER, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: ["engagement_id?", "approved_by_party_id?", "placement_status?", "limit?", "offset?"]
    output: DestinationResidence[]
    side_effects: []
  - method: GET
    path: "/destination-residences/{id}"
    description: "Reads one destination residence."
    roles: [MOVE_MANAGER, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: []
    output: DestinationResidence
    side_effects: []
  - method: POST
    path: "/destination-residences/{id}/propose-placement"
    description: "Moves the furniture placement plan to PROPOSED."
    roles: [MOVE_MANAGER]
    code: 200
    input: []
    output: DestinationResidence
    side_effects: ["recomputes child room capacities under the PROVISIONAL variant"]
  - method: POST
    path: "/destination-residences/{id}/approve-placement"
    description: "Approves the placement plan, unlocking full room capacity plus addenda."
    roles: [MOVE_MANAGER, CLIENT, POWER_OF_ATTORNEY]
    code: 200
    input: [approved_by_party_id]
    output: DestinationResidence
    side_effects: ["recomputes every child room under the APPROVED capacity variant", "refreshes each room's headroom_linear_inches"]
  - method: POST
    path: "/destination-residences/{id}/revise-placement"
    description: "Sends the placement plan back to DRAFT from PROPOSED or APPROVED."
    roles: [MOVE_MANAGER]
    code: 200
    input: [reason]
    output: DestinationResidence
    side_effects: ["increments placement_revision when leaving APPROVED", "clears approved_by_party_id", "recomputes child room capacities under the PROVISIONAL variant"]

  # ---- DestinationRoom ----
  - method: POST
    path: "/destination-rooms"
    description: "Adds a room to a destination residence."
    roles: [MOVE_MANAGER]
    code: 201
    input: [destination_residence_id, room_type, nominal_linear_inches, nominal_volume_cft, "approved_addendum_linear_inches?"]
    output: DestinationRoom
    side_effects: ["computes effective_capacity_linear_inches under the current variant", "increments the parent residence's room_count"]
  - method: GET
    path: "/destination-rooms"
    description: "Lists rooms. Default ordering is created_at ascending."
    roles: [MOVE_MANAGER, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: ["destination_residence_id?", "room_type?", "limit?", "offset?"]
    output: DestinationRoom[]
    side_effects: []
  - method: GET
    path: "/destination-rooms/{id}"
    description: "Reads one room including its capacity, load and headroom."
    roles: [MOVE_MANAGER, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: []
    output: DestinationRoom
    side_effects: []

  # ---- InventoryItem ----
  - method: POST
    path: "/inventory-items"
    description: "Catalogues one household item."
    roles: [MOVE_MANAGER]
    code: 201
    input: [engagement_id, label, category, footprint_linear_inches, volume_cft, "appraised_value_cents?", "appraisal_source?"]
    output: InventoryItem
    side_effects: ["increments Engagement.inventory_item_count and total_inventory_volume_cft", "increments Engagement.version by 1"]
  - method: GET
    path: "/inventory-items"
    description: "Lists inventory items with filters. Default ordering is created_at ascending."
    roles: [MOVE_MANAGER, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY, CREW_LEAD]
    code: 200
    input: ["engagement_id?", "assigned_room_id?", "consignment_lot_id?", "unpack_session_id?", "disposition?", "handling_state?", "limit?", "offset?"]
    output: InventoryItem[]
    side_effects: []
  - method: GET
    path: "/inventory-items/{id}"
    description: "Reads one inventory item."
    roles: [MOVE_MANAGER, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY, CREW_LEAD]
    code: 200
    input: []
    output: InventoryItem
    side_effects: []
  - method: POST
    path: "/inventory-items/{id}/designate"
    description: "Sets or changes the sort disposition, optionally placing the item in a destination room."
    roles: [MOVE_MANAGER, CLIENT, POWER_OF_ATTORNEY]
    code: 200
    input: [disposition, "assigned_room_id?", "acting_party_id?"]
    output: InventoryItem
    side_effects:
      - "recomputes the affected DestinationRoom load and headroom"
      - "recomputes Engagement.keep_volume_cft and haul_volume_cft"
      - "does NOT create a vendor assignment; the JUNK_HAUL auto-order is raised only by the sort-plan approval cascade"
      - "increments Engagement.version by 1"
  - method: POST
    path: "/inventory-items/{id}/appraise"
    description: "Records a value and its provenance, selecting the donation receipt variant."
    roles: [MOVE_MANAGER]
    code: 200
    input: [appraised_value_cents, appraisal_source]
    output: InventoryItem
    side_effects: ["recomputes donation_receipt_cents when the disposition is DONATE"]
  - method: POST
    path: "/inventory-items/{id}/advance-handling"
    description: "Advances the physical handling axis along the KEEP branch or the disposal branch."
    roles: [MOVE_MANAGER, CREW_LEAD]
    code: 200
    input: [target_handling_state, "unpack_session_id?"]
    output: InventoryItem
    side_effects: ["may increment UnpackSession.items_unpacked_count", "may recompute Engagement.haul_volume_cft"]

  # ---- FamilyHold ----
  - method: POST
    path: "/family-holds"
    description: "Raises a family dispute hold on an item, blocking its re-designation."
    roles: [MOVE_MANAGER, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 201
    input: [inventory_item_id, raised_by_party_id, reason]
    output: FamilyHold
    side_effects: ["sets the item's hold_state to HELD"]
  - method: GET
    path: "/family-holds"
    description: "Lists family holds."
    roles: [MOVE_MANAGER, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: ["inventory_item_id?", "raised_by_party_id?", "resolved_by_party_id?", "status?", "limit?", "offset?"]
    output: FamilyHold[]
    side_effects: []
  - method: GET
    path: "/family-holds/{id}"
    description: "Reads one family hold."
    roles: [MOVE_MANAGER, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: []
    output: FamilyHold
    side_effects: []
  - method: POST
    path: "/family-holds/{id}/escalate"
    description: "Escalates an open hold to the move manager."
    roles: [MOVE_MANAGER, FAMILY_MEMBER]
    code: 200
    input: [note]
    output: FamilyHold
    side_effects: ["increments escalation_count"]
  - method: POST
    path: "/family-holds/{id}/remand"
    description: "Sends an escalated hold back to the family for discussion."
    roles: [MOVE_MANAGER]
    code: 200
    input: [note]
    output: FamilyHold
    side_effects: ["increments remand_count"]
  - method: POST
    path: "/family-holds/{id}/resolve"
    description: "Resolves a hold either by forcing the item to KEEP or by releasing it."
    roles: [MOVE_MANAGER, CLIENT, POWER_OF_ATTORNEY]
    code: 200
    input: [resolution, resolved_by_party_id]
    output: FamilyHold
    side_effects: ["may force the item's disposition to KEEP", "recomputes the item's hold_state"]
  - method: POST
    path: "/family-holds/{id}/withdraw"
    description: "The raising party withdraws its own hold."
    roles: [MOVE_MANAGER, FAMILY_MEMBER]
    code: 200
    input: []
    output: FamilyHold
    side_effects: ["recomputes the item's hold_state"]

  # ---- SortPlan ----
  - method: POST
    path: "/sort-plans"
    description: "Creates a sort plan, superseding the engagement's prior DRAFT or REJECTED plan."
    roles: [MOVE_MANAGER]
    code: 201
    input: [engagement_id, expected_engagement_version, "notes?"]
    output: SortPlan
    side_effects: ["increments Engagement.version by 1", "created in status DRAFT"]
  - method: GET
    path: "/sort-plans"
    description: "Lists sort plans."
    roles: [MOVE_MANAGER, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: ["engagement_id?", "approved_by_party_id?", "status?", "limit?", "offset?"]
    output: SortPlan[]
    side_effects: []
  - method: GET
    path: "/sort-plans/{id}"
    description: "Reads one sort plan."
    roles: [MOVE_MANAGER, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: []
    output: SortPlan
    side_effects: []
  - method: POST
    path: "/sort-plans/{id}/submit"
    description: "Submits the sort plan for family approval."
    roles: [MOVE_MANAGER]
    code: 200
    input: []
    output: SortPlan
    side_effects: ["snapshots undecided_count_at_submit"]
  - method: POST
    path: "/sort-plans/{id}/approve"
    description: "Approves the sort plan; this is the disposition freeze point."
    roles: [MOVE_MANAGER, CLIENT, POWER_OF_ATTORNEY]
    code: 200
    input: [approved_by_party_id]
    output: SortPlan
    side_effects:
      - "locks every non-UNDECIDED item's disposition"
      - "recomputes Engagement.haul_volume_cft and auto-creates a REQUESTED JUNK_HAUL VendorAssignment when the recomputed volume reaches HAUL_MIN_LOAD_CFT"
      - "completes the SORT_PLAN Milestone and advances Engagement.phase to PACK"
  - method: POST
    path: "/sort-plans/{id}/reject"
    description: "Rejects a submitted sort plan."
    roles: [MOVE_MANAGER, CLIENT, POWER_OF_ATTORNEY]
    code: 200
    input: [reason]
    output: SortPlan
    side_effects: ["sets rejected_reason"]
  - method: POST
    path: "/sort-plans/{id}/reopen"
    description: "Reopens a rejected or approved plan back to DRAFT, unlocking dispositions."
    roles: [MOVE_MANAGER]
    code: 200
    input: [reason]
    output: SortPlan
    side_effects: ["increments reopen_count", "unlocks every item's disposition when leaving APPROVED", "reopens the SORT_PLAN Milestone"]

  # ---- MoveDayPlan ----
  - method: POST
    path: "/move-day-plans"
    description: "Creates the move-day plan for an engagement."
    roles: [MOVE_MANAGER]
    code: 201
    input: [engagement_id, scheduled_start_utc, truck_capacity_cft, truck_count]
    output: MoveDayPlan
    side_effects: ["computes freeze_at_utc and crew_min_required"]
  - method: GET
    path: "/move-day-plans"
    description: "Lists move-day plans."
    roles: [MOVE_MANAGER, CREW_LEAD, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: ["engagement_id?", "status?", "limit?", "offset?"]
    output: MoveDayPlan[]
    side_effects: []
  - method: GET
    path: "/move-day-plans/{id}"
    description: "Reads one move-day plan including its version, trip counts and crew rollups."
    roles: [MOVE_MANAGER, CREW_LEAD, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: []
    output: MoveDayPlan
    side_effects: []
  - method: POST
    path: "/move-day-plans/{id}/confirm"
    description: "Confirms a fully crewed plan."
    roles: [MOVE_MANAGER]
    code: 200
    input: []
    output: MoveDayPlan
    side_effects: ["recomputes planned_trip_count"]
  - method: POST
    path: "/move-day-plans/{id}/recrew"
    description: "Returns a confirmed plan to DRAFT for roster changes."
    roles: [MOVE_MANAGER]
    code: 200
    input: [reason]
    output: MoveDayPlan
    side_effects: ["reverts CONFIRMED crew assignments to ASSIGNED"]
  - method: POST
    path: "/move-day-plans/{id}/freeze"
    description: "Enters the move-day freeze window and freezes the sort plan."
    roles: [MOVE_MANAGER]
    code: 200
    input: []
    output: MoveDayPlan
    side_effects: ["transitions the SortPlan APPROVED to FROZEN", "completes the PACK Milestone"]
  - method: POST
    path: "/move-day-plans/{id}/start"
    description: "Starts move day."
    roles: [MOVE_MANAGER, CREW_LEAD]
    code: 200
    input: []
    output: MoveDayPlan
    side_effects: ["sets started_at_utc"]
  - method: POST
    path: "/move-day-plans/{id}/complete"
    description: "Completes move day and runs the six-hop labour and billing cascade."
    roles: [MOVE_MANAGER, CREW_LEAD]
    code: 200
    input: [actual_loaded_volume_cft]
    output: MoveDayPlan
    side_effects:
      - "completes CHECKED_IN crew assignments and recomputes their hours and labor_cents"
      - "recomputes Engagement.accrued_labor_cents and billing_hours_total"
      - "appends the pipeline labour invoice line and recomputes the invoice"
      - "increments Invoice.version by 1"
      - "completes the MOVE_DAY Milestone and advances Engagement.phase to SETTLE_IN"
      - "computes actual_trip_count under the ACTUAL variant"
  - method: POST
    path: "/move-day-plans/{id}/reschedule"
    description: "Reschedules move day, shifting dependent vendor service dates."
    roles: [MOVE_MANAGER]
    code: 200
    input: [new_start_utc, reason]
    output: MoveDayPlan
    side_effects: ["increments reschedule_count", "shifts dependent VendorAssignment.service_date", "returns the plan to DRAFT in the same request"]

  # ---- CrewMember ----
  - method: POST
    path: "/crew-members"
    description: "Registers a crew member with a role rate."
    roles: [PLATFORM_ADMIN]
    code: 201
    input: [full_name, crew_role, "hourly_rate_cents?"]
    output: CrewMember
    side_effects: ["hourly_rate_cents defaults to the role rate constant when omitted"]
  - method: GET
    path: "/crew-members/{id}"
    description: "Reads one crew member."
    roles: [PLATFORM_ADMIN, MOVE_MANAGER, CREW_LEAD]
    code: 200
    input: []
    output: CrewMember
    side_effects: []

  # ---- CrewAssignment ----
  - method: POST
    path: "/crew-assignments"
    description: "Assigns a crew member to a move-day plan, optionally replacing a NO_SHOW slot."
    roles: [MOVE_MANAGER]
    code: 201
    input: [move_day_plan_id, crew_member_id, expected_move_day_plan_version, "replaces_assignment_id?"]
    output: CrewAssignment
    side_effects: ["increments MoveDayPlan.version by 1", "transitions the replaced assignment NO_SHOW to REPLACED", "increments CrewMember.assignment_count"]
  - method: GET
    path: "/crew-assignments"
    description: "Lists crew assignments. Default ordering is created_at ascending."
    roles: [MOVE_MANAGER, CREW_LEAD, BILLING_ADMIN]
    code: 200
    input: ["move_day_plan_id?", "crew_member_id?", "replaces_assignment_id?", "status?", "limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []
  - method: GET
    path: "/crew-assignments/{id}"
    description: "Reads one crew assignment including both hour variants."
    roles: [MOVE_MANAGER, CREW_LEAD, BILLING_ADMIN]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: []
  - method: POST
    path: "/crew-assignments/{id}/confirm"
    description: "Crew member confirms the assignment; may bubble the plan up to CREWED."
    roles: [MOVE_MANAGER, CREW_LEAD]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["recomputes MoveDayPlan.crew_confirmed_count", "may transition the plan DRAFT to CREWED"]
  - method: POST
    path: "/crew-assignments/{id}/check-in"
    description: "Clocks the crew member in."
    roles: [MOVE_MANAGER, CREW_LEAD]
    code: 200
    input: [at_utc]
    output: CrewAssignment
    side_effects: ["sets checked_in_at_utc"]
  - method: POST
    path: "/crew-assignments/{id}/check-out"
    description: "Clocks the crew member out, creating the LABOR time entry and rolling up hours and money."
    roles: [MOVE_MANAGER, CREW_LEAD]
    code: 200
    input: [at_utc]
    output: CrewAssignment
    side_effects: ["creates a LABOR TimeEntry", "recomputes portal_hours, billing_hours, applied_hours, overtime_hours and labor_cents", "recomputes Engagement.accrued_labor_cents and billing_hours_total"]
  - method: POST
    path: "/crew-assignments/{id}/no-show"
    description: "Marks the assignment a no-show."
    roles: [MOVE_MANAGER, CREW_LEAD]
    code: 200
    input: [note]
    output: CrewAssignment
    side_effects: ["recomputes MoveDayPlan.crew_confirmed_count"]

  # ---- TimeEntry ----
  - method: POST
    path: "/time-entries"
    description: "Adds a labour, travel or break interval to a crew assignment. Permitted only while the parent CrewAssignment is CHECKED_IN or COMPLETED; on a COMPLETED assignment every hour and money rollup is recomputed in place."
    roles: [MOVE_MANAGER, CREW_LEAD]
    code: 201
    input: [crew_assignment_id, entry_kind, started_at_utc, ended_at_utc]
    output: TimeEntry
    side_effects: ["recomputes the assignment's portal_hours, billing_hours, applied_hours, overtime_hours and labor_cents"]
  - method: GET
    path: "/time-entries"
    description: "Lists time entries. Default ordering is created_at ascending."
    roles: [MOVE_MANAGER, CREW_LEAD, BILLING_ADMIN]
    code: 200
    input: ["crew_assignment_id?", "entry_kind?", "limit?", "offset?"]
    output: TimeEntry[]
    side_effects: []
  - method: GET
    path: "/time-entries/{id}"
    description: "Reads one time entry including both hour representations."
    roles: [MOVE_MANAGER, CREW_LEAD, BILLING_ADMIN]
    code: 200
    input: []
    output: TimeEntry
    side_effects: []
  - method: POST
    path: "/time-entries/{id}/void"
    description: "Voids a time entry and reverses its contribution to every rollup."
    roles: [MOVE_MANAGER, BILLING_ADMIN]
    code: 200
    input: [reason]
    output: TimeEntry
    side_effects: ["recomputes the assignment's hours and labor_cents from the remaining non-voided entries"]

  # ---- Vendor ----
  - method: POST
    path: "/vendors"
    description: "Registers a subcontract vendor with its COI, capacity and holdback."
    roles: [PLATFORM_ADMIN]
    code: 201
    input: [name, vendor_type, coi_expires_on, "daily_capacity?", "holdback_pct?"]
    output: Vendor
    side_effects: []
  - method: GET
    path: "/vendors/{id}"
    description: "Reads one vendor."
    roles: [PLATFORM_ADMIN, MOVE_MANAGER, VENDOR, BILLING_ADMIN]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: POST
    path: "/vendors/{id}/renew-coi"
    description: "Renews the vendor's certificate of insurance and unblocks its COI_BLOCKED assignments."
    roles: [PLATFORM_ADMIN, VENDOR]
    code: 200
    input: [coi_expires_on]
    output: Vendor
    side_effects: ["increments coi_renewal_count", "returns COI_BLOCKED assignments whose service_date is now covered to SCHEDULED"]

  # ---- VendorAssignment ----
  - method: POST
    path: "/vendor-assignments"
    description: "Orders a service from a vendor for an engagement."
    roles: [MOVE_MANAGER]
    code: 201
    input: [engagement_id, vendor_id, service_kind, service_date, quoted_cents]
    output: VendorAssignment
    side_effects: ["created in status REQUESTED"]
  - method: GET
    path: "/vendor-assignments"
    description: "Lists vendor assignments."
    roles: [MOVE_MANAGER, VENDOR, BILLING_ADMIN, CLIENT, POWER_OF_ATTORNEY]
    code: 200
    input: ["engagement_id?", "vendor_id?", "signed_off_by_party_id?", "status?", "service_date?", "limit?", "offset?"]
    output: VendorAssignment[]
    side_effects: []
  - method: GET
    path: "/vendor-assignments/{id}"
    description: "Reads one vendor assignment."
    roles: [MOVE_MANAGER, VENDOR, BILLING_ADMIN, CLIENT, POWER_OF_ATTORNEY]
    code: 200
    input: []
    output: VendorAssignment
    side_effects: []
  - method: POST
    path: "/vendor-assignments/{id}/accept"
    description: "Vendor accepts the order and the holdback is computed."
    roles: [VENDOR]
    code: 200
    input: []
    output: VendorAssignment
    side_effects: ["computes holdback_cents"]
  - method: POST
    path: "/vendor-assignments/{id}/schedule"
    description: "Schedules the accepted order against the vendor's COI and daily capacity."
    roles: [MOVE_MANAGER]
    code: 200
    input: []
    output: VendorAssignment
    side_effects: ["consumes one slot of the vendor's daily capacity on service_date"]
  - method: POST
    path: "/vendor-assignments/{id}/perform"
    description: "Vendor records performance; the interim payout posts and a pass-through invoice line is appended."
    roles: [VENDOR, MOVE_MANAGER]
    code: 200
    input: [performed_at_utc]
    output: VendorAssignment
    side_effects: ["sets paid_cents to the INTERIM variant", "appends a VENDOR_PASSTHROUGH InvoiceLine", "increments Invoice.version by 1"]
  - method: POST
    path: "/vendor-assignments/{id}/sign-off"
    description: "Client side signs off completion, releasing the holdback."
    roles: [MOVE_MANAGER, CLIENT, POWER_OF_ATTORNEY]
    code: 200
    input: [signed_off_by_party_id]
    output: VendorAssignment
    side_effects: ["sets holdback_released true and paid_cents to the FINAL variant"]
  - method: POST
    path: "/vendor-assignments/{id}/pay"
    description: "Billing marks the subcontract paid."
    roles: [BILLING_ADMIN]
    code: 200
    input: []
    output: VendorAssignment
    side_effects: []
  - method: POST
    path: "/vendor-assignments/{id}/cancel"
    description: "Cancels a vendor order before performance."
    roles: [MOVE_MANAGER, VENDOR]
    code: 200
    input: [reason]
    output: VendorAssignment
    side_effects: ["frees the vendor's daily capacity slot when the order was SCHEDULED"]

  # ---- ConsignmentLot ----
  - method: POST
    path: "/consignment-lots"
    description: "Consigns a set of SELL items to a consignment vendor."
    roles: [MOVE_MANAGER]
    code: 201
    input: [engagement_id, vendor_id, list_price_cents, listed_on, item_ids]
    output: ConsignmentLot
    side_effects: ["sets consignment_lot_id on each member item", "computes item_count and current_price_cents"]
  - method: GET
    path: "/consignment-lots"
    description: "Lists consignment lots."
    roles: [MOVE_MANAGER, VENDOR, BILLING_ADMIN, CLIENT, POWER_OF_ATTORNEY]
    code: 200
    input: ["engagement_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: ConsignmentLot[]
    side_effects: []
  - method: GET
    path: "/consignment-lots/{id}"
    description: "Reads one lot including its settlement arithmetic."
    roles: [MOVE_MANAGER, VENDOR, BILLING_ADMIN, CLIENT, POWER_OF_ATTORNEY]
    code: 200
    input: []
    output: ConsignmentLot
    side_effects: []
  - method: POST
    path: "/consignment-lots/{id}/mark-down"
    description: "Applies the next markdown round off the ORIGINAL list price."
    roles: [MOVE_MANAGER, VENDOR]
    code: 200
    input: []
    output: ConsignmentLot
    side_effects: ["increments markdown_round and recomputes current_price_cents"]
  - method: POST
    path: "/consignment-lots/{id}/record-sale"
    description: "Records a sale and computes commission, fees and net proceeds."
    roles: [VENDOR, MOVE_MANAGER]
    code: 200
    input: [gross_sale_price_cents, sold_on]
    output: ConsignmentLot
    side_effects: ["computes commission_cents, fees_cents and net_proceeds_cents"]
  - method: POST
    path: "/consignment-lots/{id}/settle"
    description: "Credits the net proceeds against the client invoice."
    roles: [MOVE_MANAGER, BILLING_ADMIN]
    code: 200
    input: []
    output: ConsignmentLot
    side_effects: ["appends a negative CONSIGNMENT_CREDIT InvoiceLine", "increments Invoice.version by 1", "refreshes Engagement.consignment_credit_cents"]
  - method: POST
    path: "/consignment-lots/{id}/declare-unsold"
    description: "Declares the lot unsold once the listing window has elapsed."
    roles: [MOVE_MANAGER, VENDOR]
    code: 200
    input: []
    output: ConsignmentLot
    side_effects: []
  - method: POST
    path: "/consignment-lots/{id}/return-to-client"
    description: "Returns the lot to the client, reversing any credit already posted."
    roles: [MOVE_MANAGER]
    code: 200
    input: [reason]
    output: ConsignmentLot
    side_effects: ["appends a positive CONSIGNMENT_REVERSAL InvoiceLine mirroring the posted credit exactly", "increments Invoice.version by 1", "may reopen the CLOSE_OUT Milestone through Engagement.billing_hold"]
  - method: POST
    path: "/consignment-lots/{id}/haul-away"
    description: "Hauls an unsold or returned lot away and charges the disposal fee."
    roles: [MOVE_MANAGER]
    code: 200
    input: []
    output: ConsignmentLot
    side_effects: ["computes disposal_fee_cents", "appends a DISPOSAL_FEE InvoiceLine", "forces member items to HAUL_AWAY and REMOVED"]

  # ---- Invoice ----
  - method: GET
    path: "/invoices"
    description: "Lists invoices. Default ordering is created_at ascending; an engagement has exactly one invoice, so a filtered read returns an array of length 1."
    roles: [BILLING_ADMIN, MOVE_MANAGER, CLIENT, POWER_OF_ATTORNEY, FAMILY_MEMBER]
    code: 200
    input: ["engagement_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "Reads one invoice including every computed aggregate and its version."
    roles: [BILLING_ADMIN, MOVE_MANAGER, CLIENT, POWER_OF_ATTORNEY, FAMILY_MEMBER]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issues the invoice, computing surcharges and the coordination fee in the pinned order."
    roles: [BILLING_ADMIN]
    code: 200
    input: []
    output: Invoice
    side_effects: ["appends TRAVEL_SURCHARGE, STAIRS_SURCHARGE and LONG_CARRY_SURCHARGE lines", "appends the COORDINATION_FEE line", "recomputes every aggregate", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/recall"
    description: "Recalls an issued invoice to DRAFT."
    roles: [BILLING_ADMIN]
    code: 200
    input: [reason]
    output: Invoice
    side_effects: ["increments recall_count", "removes the COORDINATION_FEE line"]
  - method: POST
    path: "/invoices/{id}/dispute"
    description: "The client side disputes the issued invoice."
    roles: [CLIENT, POWER_OF_ATTORNEY, FAMILY_MEMBER]
    code: 200
    input: [reason, raised_by_party_id]
    output: Invoice
    side_effects: ["increments dispute_count and sets dispute_reason"]
  - method: POST
    path: "/invoices/{id}/resolve-dispute"
    description: "Billing resolves the dispute and returns the invoice to ISSUED."
    roles: [BILLING_ADMIN]
    code: 200
    input: [resolution]
    output: Invoice
    side_effects: ["clears dispute_reason"]
  - method: POST
    path: "/invoices/{id}/finalize"
    description: "Finalises the invoice; gate 9 closes for the whole engagement."
    roles: [BILLING_ADMIN]
    code: 200
    input: []
    output: Invoice
    side_effects: ["sets finalized_at_utc"]
  - method: POST
    path: "/invoices/{id}/record-payment"
    description: "Records a client payment against the invoice."
    roles: [BILLING_ADMIN]
    code: 200
    input: [amount_cents, paid_on]
    output: Invoice
    side_effects: ["recomputes payments_cents and balance_due_cents", "recomputes Engagement.billing_hold", "increments Invoice.version by 1"]

  # ---- InvoiceLine ----
  - method: POST
    path: "/invoice-lines"
    description: "Appends a manual adjustment line to a DRAFT or ISSUED invoice under optimistic concurrency."
    roles: [BILLING_ADMIN]
    code: 201
    input: [invoice_id, line_type, amount_cents, memo, expected_invoice_version, "source_consignment_lot_id?"]
    output: InvoiceLine
    side_effects: ["increments Invoice.version by 1", "recomputes subtotal_cents, credits_cents, total_cents and balance_due_cents"]
  - method: GET
    path: "/invoice-lines"
    description: "Lists ledger lines. Default ordering is created_at ascending."
    roles: [BILLING_ADMIN, MOVE_MANAGER, CLIENT, POWER_OF_ATTORNEY]
    code: 200
    input: ["invoice_id?", "source_consignment_lot_id?", "line_type?", "limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []
  - method: GET
    path: "/invoice-lines/{id}"
    description: "Reads one immutable ledger line."
    roles: [BILLING_ADMIN, MOVE_MANAGER, CLIENT, POWER_OF_ATTORNEY]
    code: 200
    input: []
    output: InvoiceLine
    side_effects: []

  # ---- Milestone ----
  - method: GET
    path: "/milestones"
    description: "Lists the engagement's timeline milestones. Default ordering is sequence_index ascending, so index 0 is ASSESSMENT and index 5 is CLOSE_OUT."
    roles: [MOVE_MANAGER, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY, BILLING_ADMIN]
    code: 200
    input: ["engagement_id?", "completed_by_party_id?", "milestone_key?", "status?", "overdue_status?", "limit?", "offset?"]
    output: Milestone[]
    side_effects: []
  - method: GET
    path: "/milestones/{id}"
    description: "Reads one milestone including both its progress and lateness axes."
    roles: [MOVE_MANAGER, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY, BILLING_ADMIN]
    code: 200
    input: []
    output: Milestone
    side_effects: []
  - method: POST
    path: "/milestones/{id}/complete"
    description: "Completes a milestone and starts its successor."
    roles: [MOVE_MANAGER]
    code: 200
    input: [completed_by_party_id]
    output: Milestone
    side_effects: ["sets completed_at_utc", "moves OVERDUE to RECOVERED", "starts the successor milestone and recomputes Engagement.phase"]
  - method: POST
    path: "/milestones/{id}/reopen"
    description: "Reopens a completed milestone, moving the phase backwards."
    roles: [MOVE_MANAGER]
    code: 200
    input: [reason]
    output: Milestone
    side_effects: ["increments reopen_count", "moves RECOVERED back to OVERDUE, never to ON_TIME", "recomputes Engagement.phase"]

  # ---- UnpackSession ----
  - method: POST
    path: "/unpack-sessions"
    description: "Schedules a settle-in unpack session."
    roles: [MOVE_MANAGER]
    code: 201
    input: [engagement_id, scheduled_start_utc, priority]
    output: UnpackSession
    side_effects: ["created in status SCHEDULED"]
  - method: GET
    path: "/unpack-sessions"
    description: "Lists unpack sessions. Default ordering is created_at ascending."
    roles: [MOVE_MANAGER, CREW_LEAD, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: ["engagement_id?", "status?", "priority?", "limit?", "offset?"]
    output: UnpackSession[]
    side_effects: []
  - method: GET
    path: "/unpack-sessions/{id}"
    description: "Reads one unpack session."
    roles: [MOVE_MANAGER, CREW_LEAD, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: []
    output: UnpackSession
    side_effects: []
  - method: POST
    path: "/unpack-sessions/{id}/start"
    description: "Starts a scheduled or reopened session, honouring the essentials-first rule."
    roles: [MOVE_MANAGER, CREW_LEAD]
    code: 200
    input: []
    output: UnpackSession
    side_effects: ["sets started_at_utc"]
  - method: POST
    path: "/unpack-sessions/{id}/complete"
    description: "Completes the session."
    roles: [MOVE_MANAGER, CREW_LEAD]
    code: 200
    input: []
    output: UnpackSession
    side_effects: ["recomputes items_unpacked_count"]

  # ---- PunchListItem ----
  - method: POST
    path: "/punch-list-items"
    description: "Raises a settle-in defect with an SLA window."
    roles: [MOVE_MANAGER, CREW_LEAD, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 201
    input: [engagement_id, description, severity, "unpack_session_id?"]
    output: PunchListItem
    side_effects: ["computes due_at_utc from the severity SLA constant"]
  - method: GET
    path: "/punch-list-items"
    description: "Lists punch-list items."
    roles: [MOVE_MANAGER, CREW_LEAD, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: ["engagement_id?", "unpack_session_id?", "status?", "severity?", "limit?", "offset?"]
    output: PunchListItem[]
    side_effects: []
  - method: GET
    path: "/punch-list-items/{id}"
    description: "Reads one punch-list item."
    roles: [MOVE_MANAGER, CREW_LEAD, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: []
    output: PunchListItem
    side_effects: []
  - method: POST
    path: "/punch-list-items/{id}/resolve"
    description: "Resolves the defect."
    roles: [MOVE_MANAGER, CREW_LEAD]
    code: 200
    input: [resolution_note]
    output: PunchListItem
    side_effects: ["recomputes breached_sla"]
  - method: POST
    path: "/punch-list-items/{id}/reopen"
    description: "Reopens a resolved defect, reopening its unpack session and the close-out milestone."
    roles: [MOVE_MANAGER, CLIENT, FAMILY_MEMBER, POWER_OF_ATTORNEY]
    code: 200
    input: [reason]
    output: PunchListItem
    side_effects: ["increments reopen_count", "reopens the named UnpackSession when it is COMPLETED", "reopens a COMPLETE CLOSE_OUT Milestone"]

# ---------------------------------------------------------------------------
# 1.6 ERROR CODE CATALOG  (70 codes)
# ---------------------------------------------------------------------------
errors:
  - id: ERR_MISSING_AUTH_HEADER
    http: 401
    condition: "X-User-Role header absent or empty (ladder rung 1)."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the eight declared roles (rung 2)."
  - id: ERR_MISSING_USER_ID
    http: 401
    condition: "X-User-ID absent while the acting role is entity_backed (rung 3)."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not in the endpoint's roles list (rung 4)."
  - id: ERR_VALIDATION
    http: 400
    condition: "A required field is missing, mistyped, non-positive where the domain requires positive, or a pagination parameter is out of range (rungs 5 and 7). Also covers a non-positive amount_cents on a charge line and a truck_count below 1."
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "An enum-typed field carries a value outside its declared member list (rung 6). No other field routes here."
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "The engagement id in the path or body does not resolve (rung 8)."
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "client_id does not resolve to a Client (rung 9)."
  - id: ERR_PARTY_NOT_FOUND
    http: 404
    condition: "A party id field does not resolve to a PortalParty (rung 10)."
  - id: ERR_AUTHORITY_NOT_FOUND
    http: 404
    condition: "The authority record id in the path does not resolve (rung 11)."
  - id: ERR_RESIDENCE_NOT_FOUND
    http: 404
    condition: "The residence id in the path or destination_residence_id does not resolve (rung 12)."
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "The room id in the path or assigned_room_id does not resolve (rung 13)."
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "An inventory item id in the path, inventory_item_id, or a member of item_ids does not resolve (rung 14)."
  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "The family hold id in the path does not resolve (rung 15)."
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "A sort plan or move-day plan id does not resolve (rung 16)."
  - id: ERR_CREW_RECORD_NOT_FOUND
    http: 404
    condition: "A crew member, crew assignment or time entry id does not resolve (rung 17)."
  - id: ERR_VENDOR_RECORD_NOT_FOUND
    http: 404
    condition: "A vendor or vendor assignment id does not resolve (rung 18)."
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "A consignment lot id does not resolve (rung 19)."
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "An invoice or invoice line id does not resolve (rung 20)."
  - id: ERR_TIMELINE_RECORD_NOT_FOUND
    http: 404
    condition: "A milestone, unpack session or punch-list item id does not resolve (rung 21)."
  - id: ERR_ENGAGEMENT_CLOSED
    http: 409
    condition: "The owning engagement is CLOSED (rung 22)."
  - id: ERR_ENGAGEMENT_CANCELLED
    http: 409
    condition: "The owning engagement is CANCELLED (rung 23)."
  - id: ERR_ENGAGEMENT_ON_HOLD
    http: 409
    condition: "The owning engagement is ON_HOLD and the operation is neither resume nor cancel (rung 24)."
  - id: ERR_ACTOR_NOT_OWNER
    http: 403
    condition: "An entity_backed actor's X-User-ID does not match the resource it claims to own (rung 25)."
  - id: ERR_PARTY_ENGAGEMENT_MISMATCH
    http: 422
    condition: "A supplied party id belongs to a different engagement than the subject resource (rung 26)."
  - id: ERR_NO_ACTIVE_AUTHORITY
    http: 403
    condition: "A POWER_OF_ATTORNEY actor holds no AuthorityRecord in status ACTIVE (rung 27)."
  - id: ERR_AUTHORITY_SCOPE_INSUFFICIENT
    http: 403
    condition: "The active authority_scope does not cover the operation family (rung 28)."
  - id: ERR_HIGH_VALUE_AUTHORITY_REQUIRED
    http: 403
    condition: "The subject item's appraised_value_cents is at or above HIGH_VALUE_DISPOSITION_THRESHOLD_CENTS and the actor's scope is not exactly FULL (rung 29)."
  - id: ERR_AUTHORITY_CEILING_EXCEEDED
    http: 403
    condition: "active_authority_ceiling_cents is strictly below the subject value (rung 30)."
  - id: ERR_PHASE_NOT_PERMITTED
    http: 409
    condition: "Engagement.phase does not permit the operation (rung 31)."
  - id: ERR_PREDECESSOR_MILESTONE_INCOMPLETE
    http: 409
    condition: "A milestone completion was attempted while its predecessor is not COMPLETE (rung 32)."
  - id: ERR_SUCCESSOR_MILESTONE_COMPLETE
    http: 409
    condition: "A milestone reopen was attempted while a later milestone is COMPLETE (rung 33)."
  - id: ERR_CLOSE_OUT_BLOCKED
    http: 409
    condition: "Close-out attempted with the CLOSE_OUT milestone incomplete, an open punch-list item, or billing_hold true (rung 34)."
  - id: ERR_FREEZE_WINDOW_ENTERED
    http: 409
    condition: "The logical clock has reached MoveDayPlan.freeze_at_utc and the operation touches the crew roster or an inventory disposition or appraisal (rungs 35 and 36)."
  - id: ERR_SORT_PLAN_FROZEN
    http: 409
    condition: "A reopen was attempted on a SortPlan in status FROZEN (rung 37)."
  - id: ERR_FREEZE_WINDOW_NOT_ENTERED
    http: 409
    condition: "Freeze was attempted before MoveDayPlan.freeze_at_utc (rung 38)."
  - id: ERR_DISPOSITION_LOCKED
    http: 409
    condition: "Re-designation attempted on an item whose disposition_locked is true (rung 39)."
  - id: ERR_ITEM_UNDER_FAMILY_HOLD
    http: 409
    condition: "The item has a FamilyHold in status OPEN or ESCALATED (rungs 40 and 41)."
  - id: ERR_ITEM_ALREADY_CONSIGNED
    http: 409
    condition: "An item already attached to a consignment lot was designated to something other than SELL (rung 42)."
  - id: ERR_VENDOR_TYPE_MISMATCH
    http: 422
    condition: "service_kind does not match the vendor's vendor_type under the pinned map (rung 43)."
  - id: ERR_VENDOR_COI_EXPIRED
    http: 422
    condition: "The vendor's coi_expires_on is earlier than the assignment's service_date (rung 44)."
  - id: ERR_VENDOR_DAILY_CAPACITY_EXCEEDED
    http: 409
    condition: "The vendor already holds daily_capacity capacity-consuming assignments on that service_date (rung 45)."
  - id: ERR_INVOICE_FINALIZED
    http: 409
    condition: "A ledger line, payment, dispute or recall was attempted on a FINALIZED invoice (rung 46)."
  - id: ERR_BILLING_CLOSED
    http: 409
    condition: "A consignment settlement, reversal, disposal fee or vendor payout was attempted while the invoice is FINALIZED (rung 47)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The subject entity's current state is not in the triggered transition's declared from set (rung 48)."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The subject entity is already in one of its machine's terminal states (rung 49)."
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "ended_at_utc is not strictly after started_at_utc, or check-out at_utc is not strictly after checked_in_at_utc (rung 50)."
  - id: ERR_INVALID_SALE_PRICE
    http: 422
    condition: "gross_sale_price_cents is not greater than 0, or the lot has no member items (rung 51)."
  - id: ERR_UNDECIDED_ITEMS_REMAIN
    http: 422
    condition: "A sort plan submit or approve was attempted while at least one item is UNDECIDED (rung 52)."
  - id: ERR_NO_INVENTORY
    http: 422
    condition: "A sort plan submit was attempted on an engagement with no inventory items (rung 53)."
  - id: ERR_LOT_ALREADY_CREDITED
    http: 409
    condition: "A second settle was attempted on a lot whose credited flag is already true (rung 54)."
  - id: ERR_UNSOLD_WINDOW_NOT_ELAPSED
    http: 409
    condition: "declare-unsold was attempted fewer than CONSIGN_UNSOLD_WINDOW_DAYS days after listed_on (rung 55)."
  - id: ERR_ESSENTIALS_SESSION_PENDING
    http: 409
    condition: "A STANDARD unpack session start was attempted while an earlier ESSENTIALS session is not COMPLETED (rung 56)."
  - id: ERR_AUTHORITY_WINDOW_INVALID
    http: 409
    condition: "The authority effective window is inverted, or activation or reinstatement falls outside it (rung 57)."
  - id: ERR_SORT_PLAN_REOPEN_LIMIT
    http: 409
    condition: "SortPlan.reopen_count already equals MAX_SORT_PLAN_REOPENS (rung 58)."
  - id: ERR_RESCHEDULE_LIMIT
    http: 409
    condition: "MoveDayPlan.reschedule_count already equals MAX_MOVE_DAY_RESCHEDULES, or new_start_utc is not strictly after the clock (rung 59)."
  - id: ERR_MARKDOWN_ROUNDS_EXHAUSTED
    http: 409
    condition: "ConsignmentLot.markdown_round already equals MAX_MARKDOWN_ROUNDS (rung 60)."
  - id: ERR_REOPEN_LIMIT
    http: 409
    condition: "A milestone, unpack session or punch-list reopen counter is already at its cap (rung 61)."
  - id: ERR_INVOICE_ACTION_LIMIT
    http: 409
    condition: "Invoice.recall_count or dispute_count is already at its cap (rung 62)."
  - id: ERR_HOLD_ESCALATION_LIMIT
    http: 409
    condition: "FamilyHold.escalation_count, FamilyHold.remand_count or AuthorityRecord.suspend_count is already at its cap (rung 63)."
  - id: ERR_STALE_ENGAGEMENT_VERSION
    http: 412
    condition: "expected_engagement_version does not equal Engagement.version on POST /sort-plans (rung 64)."
  - id: ERR_STALE_MOVE_DAY_PLAN_VERSION
    http: 412
    condition: "expected_move_day_plan_version does not equal MoveDayPlan.version on POST /crew-assignments (rung 65)."
  - id: ERR_STALE_INVOICE_VERSION
    http: 412
    condition: "expected_invoice_version does not equal Invoice.version on POST /invoice-lines (rung 66)."
  - id: ERR_PACKAGE_TIER_REQUIRED
    http: 422
    condition: "package_tier is missing under PACKAGE, or present under HOURLY (rung 67)."
  - id: ERR_ROOM_CAPACITY_EXCEEDED
    http: 422
    condition: "The prospective KEEP linear load exceeds the room's effective_capacity_linear_inches (rung 68)."
  - id: ERR_ROOM_VOLUME_EXCEEDED
    http: 422
    condition: "The prospective KEEP volume load exceeds nominal_volume_cft times ROOM_VOLUME_SAFETY_FACTOR (rung 69)."
  - id: ERR_ITEM_BELOW_CONSIGN_MINIMUM
    http: 422
    condition: "A SELL designation was attempted on an item below CONSIGN_MIN_VALUE_CENTS (rung 70)."
  - id: ERR_CREW_MINIMUM_NOT_MET
    http: 422
    condition: "Move day start attempted with crew_confirmed_count below crew_min_required (rung 71)."
  - id: ERR_CREW_LEAD_REQUIRED
    http: 422
    condition: "Move day start attempted without CREW_LEAD_REQUIRED_COUNT LEAD crew members on the roster (rung 72)."
  - id: ERR_BALANCE_OUTSTANDING
    http: 409
    condition: "Finalization attempted while Invoice.balance_due_cents is greater than 0 (rung 73)."

# ---------------------------------------------------------------------------
# 1.7 RBAC MATRIX
# ---------------------------------------------------------------------------
roles:
  - name: PLATFORM_ADMIN
    description: "Operator of the platform reference data: crew roster, vendor directory, logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /crew-members"
      - "POST /vendors"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /vendors/{id}/renew-coi"
      - "POST /engagements/{id}/ops-run"
      - "GET /crew-members/{id}"
      - "GET /vendors/{id}"
      - "GET /engagements"

  - name: MOVE_MANAGER
    description: "The senior move manager who owns the engagement end to end."
    identity: opaque
    exclusive_operations:
      - "POST /clients"
      - "POST /engagements"
      - "PATCH /engagements/{id}"
      - "POST /engagements/{id}/hold"
      - "POST /engagements/{id}/resume"
      - "POST /engagements/{id}/cancel"
      - "POST /engagements/{id}/close-out"
      - "POST /portal-parties"
      - "POST /authority-records"
      - "POST /authority-records/{id}/activate"
      - "POST /authority-records/{id}/suspend"
      - "POST /authority-records/{id}/reinstate"
      - "POST /destination-residences"
      - "POST /destination-residences/{id}/propose-placement"
      - "POST /destination-residences/{id}/revise-placement"
      - "POST /destination-rooms"
      - "POST /inventory-items"
      - "POST /inventory-items/{id}/appraise"
      - "POST /family-holds/{id}/remand"
      - "POST /sort-plans"
      - "POST /sort-plans/{id}/submit"
      - "POST /sort-plans/{id}/reopen"
      - "POST /move-day-plans"
      - "POST /move-day-plans/{id}/confirm"
      - "POST /move-day-plans/{id}/recrew"
      - "POST /move-day-plans/{id}/freeze"
      - "POST /move-day-plans/{id}/reschedule"
      - "POST /crew-assignments"
      - "POST /vendor-assignments"
      - "POST /vendor-assignments/{id}/schedule"
      - "POST /consignment-lots"
      - "POST /consignment-lots/{id}/return-to-client"
      - "POST /consignment-lots/{id}/haul-away"
      - "POST /milestones/{id}/complete"
      - "POST /milestones/{id}/reopen"
      - "POST /unpack-sessions"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /engagements/{id}/ops-run"
      - "POST /inventory-items/{id}/designate"
      - "POST /inventory-items/{id}/advance-handling"
      - "POST /family-holds"
      - "POST /family-holds/{id}/escalate"
      - "POST /family-holds/{id}/resolve"
      - "POST /family-holds/{id}/withdraw"
      - "POST /sort-plans/{id}/approve"
      - "POST /sort-plans/{id}/reject"
      - "POST /destination-residences/{id}/approve-placement"
      - "POST /move-day-plans/{id}/start"
      - "POST /move-day-plans/{id}/complete"
      - "POST /crew-assignments/{id}/confirm"
      - "POST /crew-assignments/{id}/check-in"
      - "POST /crew-assignments/{id}/check-out"
      - "POST /crew-assignments/{id}/no-show"
      - "POST /time-entries"
      - "POST /time-entries/{id}/void"
      - "POST /vendor-assignments/{id}/perform"
      - "POST /vendor-assignments/{id}/sign-off"
      - "POST /vendor-assignments/{id}/cancel"
      - "POST /consignment-lots/{id}/mark-down"
      - "POST /consignment-lots/{id}/record-sale"
      - "POST /consignment-lots/{id}/settle"
      - "POST /consignment-lots/{id}/declare-unsold"
      - "POST /unpack-sessions/{id}/start"
      - "POST /unpack-sessions/{id}/complete"
      - "POST /punch-list-items"
      - "POST /punch-list-items/{id}/resolve"
      - "POST /punch-list-items/{id}/reopen"
      - "every GET endpoint except GET /clients/{id} restricted reads"

  - name: BILLING_ADMIN
    description: "Back-office billing operator; the only role that can move the invoice through its lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /invoices/{id}/issue"
      - "POST /invoices/{id}/recall"
      - "POST /invoices/{id}/resolve-dispute"
      - "POST /invoices/{id}/finalize"
      - "POST /invoices/{id}/record-payment"
      - "POST /invoice-lines"
      - "POST /vendor-assignments/{id}/pay"
    shared_operations:
      - "POST /consignment-lots/{id}/settle"
      - "POST /time-entries/{id}/void"
      - "GET /invoices"
      - "GET /invoices/{id}"
      - "GET /invoice-lines"
      - "GET /crew-assignments"
      - "GET /time-entries"

  - name: CREW_LEAD
    description: "Lead of the move-day crew; clocks the crew in and out and drives handling on the ground."
    identity: "entity_backed:CrewMember"
    exclusive_operations: []
    shared_operations:
      - "POST /move-day-plans/{id}/start"
      - "POST /move-day-plans/{id}/complete"
      - "POST /crew-assignments/{id}/confirm"
      - "POST /crew-assignments/{id}/check-in"
      - "POST /crew-assignments/{id}/check-out"
      - "POST /crew-assignments/{id}/no-show"
      - "POST /time-entries"
      - "POST /inventory-items/{id}/advance-handling"
      - "POST /unpack-sessions/{id}/start"
      - "POST /unpack-sessions/{id}/complete"
      - "POST /punch-list-items"
      - "POST /punch-list-items/{id}/resolve"
      - "GET /crew-members/{id}"
      - "GET /crew-assignments"
      - "GET /time-entries"

  - name: VENDOR
    description: "Subcontracted vendor: junk haul, consignment house, appraiser, cleaner or shredder."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /vendor-assignments/{id}/accept"
    shared_operations:
      - "POST /vendors/{id}/renew-coi"
      - "POST /vendor-assignments/{id}/perform"
      - "POST /vendor-assignments/{id}/cancel"
      - "POST /consignment-lots/{id}/mark-down"
      - "POST /consignment-lots/{id}/record-sale"
      - "POST /consignment-lots/{id}/declare-unsold"
      - "GET /vendors/{id}"
      - "GET /vendor-assignments"
      - "GET /consignment-lots"

  - name: CLIENT
    description: "The senior client; approves dispositions and placement directly, without any AuthorityRecord."
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "POST /authority-records/{id}/revoke"
      - "POST /inventory-items/{id}/designate"
      - "POST /destination-residences/{id}/approve-placement"
      - "POST /family-holds"
      - "POST /family-holds/{id}/resolve"
      - "POST /sort-plans/{id}/approve"
      - "POST /sort-plans/{id}/reject"
      - "POST /vendor-assignments/{id}/sign-off"
      - "POST /invoices/{id}/dispute"
      - "POST /punch-list-items"
      - "POST /punch-list-items/{id}/reopen"
      - "GET /clients/{id}"
      - "every engagement-scoped GET endpoint"

  - name: FAMILY_MEMBER
    description: "A family member with read and comment access; may raise and escalate holds but may not approve dispositions."
    identity: "entity_backed:PortalParty"
    exclusive_operations: []
    shared_operations:
      - "POST /family-holds"
      - "POST /family-holds/{id}/escalate"
      - "POST /family-holds/{id}/withdraw"
      - "POST /invoices/{id}/dispute"
      - "POST /punch-list-items"
      - "POST /punch-list-items/{id}/reopen"
      - "every engagement-scoped GET endpoint"

  - name: POWER_OF_ATTORNEY
    description: "Authorized representative who can approve on the client's behalf only while an AuthorityRecord is ACTIVE, in scope, and within its ceiling."
    identity: "entity_backed:PortalParty"
    exclusive_operations: []
    shared_operations:
      - "POST /inventory-items/{id}/designate"
      - "POST /destination-residences/{id}/approve-placement"
      - "POST /family-holds"
      - "POST /family-holds/{id}/resolve"
      - "POST /sort-plans/{id}/approve"
      - "POST /sort-plans/{id}/reject"
      - "POST /vendor-assignments/{id}/sign-off"
      - "POST /invoices/{id}/dispute"
      - "POST /punch-list-items"
      - "POST /punch-list-items/{id}/reopen"
      - "every engagement-scoped GET endpoint"

