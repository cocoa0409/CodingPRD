# SCAFFOLD_DIFFICULTY_DESIGN.yaml - §1.8 test-targeting index for
# task_2308_news_paywall_digital_subscription_management.
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. Deleting this file
# leaves the declared behaviour identical; it only makes coverage harder to audit.
# All numeric asserts were computed by executing the §1.3 formulas.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: cycle_price_preview_quote_diverges_from_billed_amount
        grounds:
          - calculations.cycle_base_price_resolution
          - entities.Subscription.fields.next_cycle_price_cents
          - entities.Invoice.fields.base_line_cents
          - entities.Invoice.fields.price_source
          - state_machines.OfferPlan.NONE_to_SCHEDULED
        distinguishing_aspect: |
          Money domain (Subscription/Invoice): with one scheduled-but-unapplied price
          increase in the database, preview_quote reports 1999 on
          Subscription.next_cycle_price_cents while billed_amount writes 1499 into the
          cycle-2 Invoice.base_line_cents - the forward-looking variant honours a
          SCHEDULED change, the run-time variant honours only APPLIED prices.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE DIGITAL_ONLY plan: intro_price_cents 499 for 1 cycle, standard_price_cents 1499 from cycle 2, cycle_days 30."
            - "Registered MEDIUM-propensity reader with an ACTIVE subscription whose cycle-1 invoice of 499 is PAID, so paid_through_on == 2026-10-01."
            - "A price change to 1999 effective 2026-10-01 is SCHEDULED on the plan (notices NOT sent, change NOT applied)."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Standard", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_d: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_d}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_d_v2: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "reader1@mail.test", is_registered: true, propensity_band: "MEDIUM" }
              as: SubscriptionOpsAgent
              captures: { rd1: "$.data.id" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd1}", offer_plan_id: "${plan_d}", expected_offer_plan_version: "${plan_d_v2}" }
              as: SubscriptionOpsAgent
              captures: { sub1: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub1}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv1: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv1}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 499 }
              as: SubscriptionOpsAgent
            - call: "GET /paywall/offer-plans/${plan_d}"
              payload: {}
              as: RevenueManager
              captures: { plan_d_v3: "$.data.version" }
            - call: "POST /paywall/offer-plans/${plan_d}/price-change"
              payload: { pending_price_cents: 1999, pending_effective_on: "2026-10-01", grandfather_policy: "NONE", expected_offer_plan_version: "${plan_d_v3}" }
              as: RevenueManager
          trigger:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/billing-runs"
              payload: { scope: "BILLING_ONLY" }
              as: SubscriptionOpsAgent
            - call: "GET /paywall/subscriptions/${sub1}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv2: "$.data[1].id" }
          assert:
            - "Subscription.${sub1}.cycle_index == 2"
            - "Invoice.${inv2}.cycle_index == 2"
            - "Invoice.${inv2}.base_line_cents == 1499"
            - "Invoice.${inv2}.price_source == STANDARD"
            - "Invoice.${inv2}.discount_line_cents == 0"
            - "Invoice.${inv2}.credit_line_cents == 0"
            - "Invoice.${inv2}.total_cents == 1499"
            - "Subscription.${sub1}.next_cycle_price_cents == 1999"
            - "Invoice.${inv2}.base_line_cents != Subscription.${sub1}.next_cycle_price_cents"
            - "OfferPlan.${plan_d}.price_change_state == SCHEDULED"
            - "OfferPlan.${plan_d}.standard_price_cents == 1499"

      - name: engagement_rolling_30d_diverges_from_cohort_normalized
        grounds:
          - calculations.engagement_score
          - calculations.churn_risk_band
          - entities.Reader.fields.engagement_score
          - entities.Reader.fields.tenure_days
          - entities.CancellationRequest.fields.projected_engagement_score
          - entities.CancellationRequest.fields.eligible_save_offer_tier
        distinguishing_aspect: |
          Reader/engagement domain (structurally unrelated to the money variants):
          for one reader with raw weight 8.00 and tenure_days 7, rolling_30d yields
          8.00 (churn band HIGH) while cohort_normalized yields 34.29 (save-offer tier
          RICH) - the same reader is simultaneously a churn risk and a rich-tier save
          target.
        test_recipe:
          setup:
            - "Reader created while the clock reads 2026-08-25T00:00:00Z, so tenure_days == 7 once the clock reaches 2026-09-01."
            - "Three self-reported engagement events inside the 30-day window, all with days_ago < 10 so decay == 1.0: COMMENT_POST (weight 5) on 2026-08-26, APP_OPEN (weight 1) on 2026-08-28, NEWSLETTER_OPEN (weight 2) on 2026-08-30 -> raw 8.00."
            - "The reader holds an ACTIVE subscription (cycle-1 invoice of 499 PAID) so a cancellation request is admissible."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Standard E", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_e: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_e}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_e_v2: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "reader2@mail.test", is_registered: true, propensity_band: "MEDIUM" }
              as: SubscriptionOpsAgent
              captures: { rd2: "$.data.id" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd2}", offer_plan_id: "${plan_e}", expected_offer_plan_version: "${plan_e_v2}" }
              as: SubscriptionOpsAgent
              captures: { sub2: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub2}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv2a: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv2a}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 499 }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/readers/${rd2}/events"
              payload: { event_type: "COMMENT_POST", occurred_at: "2026-08-26T00:00:00Z" }
              as: Reader
              as_user_id: "${rd2}"
            - call: "POST /paywall/readers/${rd2}/events"
              payload: { event_type: "APP_OPEN", occurred_at: "2026-08-28T00:00:00Z" }
              as: Reader
              as_user_id: "${rd2}"
            - call: "POST /paywall/readers/${rd2}/events"
              payload: { event_type: "NEWSLETTER_OPEN", occurred_at: "2026-08-30T00:00:00Z" }
              as: Reader
              as_user_id: "${rd2}"
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/billing-runs"
              payload: { scope: "ENGAGEMENT_ONLY" }
              as: SubscriptionOpsAgent
          trigger:
            - call: "POST /paywall/subscriptions/${sub2}/cancellation-requests"
              payload: { reason_code: "PRICE" }
              as: Reader
              as_user_id: "${rd2}"
              captures: { cr2: "$.data.id" }
          assert:
            - "Reader.${rd2}.tenure_days == 7"
            - "Reader.${rd2}.engagement_score == 8.00"
            - "Reader.${rd2}.churn_risk_band == HIGH"
            - "Reader.${rd2}.propensity_band == LOW"
            - "CancellationRequest.${cr2}.projected_engagement_score == 34.29"
            - "CancellationRequest.${cr2}.eligible_save_offer_tier == RICH"
            - "CancellationRequest.${cr2}.projected_engagement_score != Reader.${rd2}.engagement_score"
            - "CancellationRequest.${cr2}.status == INITIATED"

  - rule_id: combinatorial_formula
    instances:
      - name: effective_allowance_from_override_band_and_floor
        grounds:
          - calculations.paywall_access_decision
          - calculations.paywall_rule_selection
          - entities.PaywallRule.fields.meter_allowance_override
          - entities.ReaderEvent.fields.effective_allowance
        distinguishing_aspect: |
          Mode (a) multi-input interaction: three independent inputs - the selected
          rule's meter_allowance_override (1), the reader's propensity delta for HIGH
          (-2) and METER_ALLOWANCE_FLOOR (1) - combine as max(1, 1 + (-2)) == 1, so the
          floor, not the arithmetic sum (-1), decides the allowance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ACTIVE PaywallRule matching content_type NEWS, section 'business' and propensity_band HIGH with action METER and meter_allowance_override 1 (specificity_score 111, priority 10)."
            - "Registered HIGH-propensity reader with no subscription and no seat (entitlement_source NONE), meter empty."
            - "Two METERED NEWS articles in section 'business'."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/paywall-rules"
              payload: { name: "Business news, high propensity", action: "METER", priority: 10, content_type_match: "NEWS", section_match: "business", propensity_band_match: "HIGH", meter_allowance_override: 1, status: "ACTIVE" }
              as: RevenueManager
              captures: { rule_hi: "$.data.id" }
            - call: "POST /paywall/articles"
              payload: { headline: "Rates hold steady", section: "business", content_type: "NEWS", access_class: "METERED", published_at: "2026-09-01T00:00:00Z" }
              as: RevenueManager
              captures: { art_b1: "$.data.id" }
            - call: "POST /paywall/articles"
              payload: { headline: "Bond desk shuffle", section: "business", content_type: "NEWS", access_class: "METERED", published_at: "2026-09-01T00:00:00Z" }
              as: RevenueManager
              captures: { art_b2: "$.data.id" }
            - call: "POST /paywall/readers"
              payload: { email: "reader3@mail.test", is_registered: true, propensity_band: "HIGH" }
              as: SubscriptionOpsAgent
              captures: { rd3: "$.data.id" }
          trigger:
            - call: "POST /paywall/access-decisions"
              payload: { reader_id: "${rd3}", article_id: "${art_b1}" }
              as: Reader
              as_user_id: "${rd3}"
              captures: { ev_b1: "$.data.id" }
            - call: "POST /paywall/access-decisions"
              payload: { reader_id: "${rd3}", article_id: "${art_b2}" }
              as: Reader
              as_user_id: "${rd3}"
              captures: { ev_b2: "$.data.id" }
          assert:
            - "PaywallRule.${rule_hi}.specificity_score == 111"
            - "ReaderEvent.${ev_b1}.decision == GRANTED_METERED"
            - "ReaderEvent.${ev_b1}.effective_allowance == 1"
            - "ReaderEvent.${ev_b1}.meter_index == 1"
            - "ReaderEvent.${ev_b1}.applied_rule_id == ${rule_hi}"
            - "ReaderEvent.${ev_b1}.event_type == ARTICLE_VIEW_GRANTED"
            - "ReaderEvent.${ev_b2}.decision == BLOCKED_METER"
            - "ReaderEvent.${ev_b2}.effective_allowance == 1"
            - "ReaderEvent.${ev_b2}.event_type == ARTICLE_VIEW_BLOCKED"
            - "ReaderEvent.${ev_b2}.weight == 0"
            - "Reader.${rd3}.metered_distinct_article_count == 1"

      - name: seat_charge_rounds_per_line_then_sums
        grounds:
          - calculations.seat_charge_assembly
          - calculations.invoice_total_assembly
          - entities.Invoice.fields.seat_line_cents
          - entities.Seat.fields.starts_on
        distinguishing_aspect: |
          Mode (b) rounding order: three seats at per_seat_price_cents 400 with 8 active
          days in a 30-day cycle bill round_half_up(106.6667) == 107 per line for a
          seat_line_cents of 321; the sum-then-round order would produce 320, so the
          single-cent difference falsifies the wrong order.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE INSTITUTIONAL_SEAT plan: standard_price_cents 5000 from cycle 1, per_seat_price_cents 400, cycle_days 30."
            - "GroupAccount 'Univ Library' with allowed_email_domain 'univ.edu' and seat_capacity 3, funded by an ACTIVE subscription whose cycle-1 invoice of 5000 is PAID (paid_through_on 2026-10-01, cycle_start_on 2026-09-01)."
            - "Three ACTIVE seats, each occupying the half-open interval [2026-10-05, 2026-10-13) - exactly 8 days inside the cycle-2 window [2026-10-01, 2026-10-31)."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Institution Seats", bundle_type: "INSTITUTIONAL_SEAT", intro_price_cents: 5000, intro_cycles: 0, standard_price_cents: 5000, standard_from_cycle: 1, cycle_days: 30, per_seat_price_cents: 400 }
              as: RevenueManager
              captures: { plan_i: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_i}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_i_v2: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "libadmin@univ.edu", is_registered: true, propensity_band: "MEDIUM" }
              as: SubscriptionOpsAgent
              captures: { rd_lib: "$.data.id" }
            - call: "POST /paywall/group-accounts"
              payload: { name: "Univ Library", admin_email: "libadmin@univ.edu", allowed_email_domain: "univ.edu", seat_capacity: 3, offer_plan_id: "${plan_i}" }
              as: SubscriptionOpsAgent
              captures: { grp: "$.data.id" }
            - call: "GET /paywall/offer-plans/${plan_i}"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { plan_i_v3: "$.data.version" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_lib}", offer_plan_id: "${plan_i}", expected_offer_plan_version: "${plan_i_v3}", group_account_id: "${grp}" }
              as: SubscriptionOpsAgent
              captures: { sub_i: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub_i}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv_i1: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv_i1}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 5000 }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/readers"
              payload: { email: "seat_a@univ.edu", is_registered: true, propensity_band: "MEDIUM" }
              as: SubscriptionOpsAgent
              captures: { rd_sa: "$.data.id" }
            - call: "POST /paywall/readers"
              payload: { email: "seat_b@univ.edu", is_registered: true, propensity_band: "MEDIUM" }
              as: SubscriptionOpsAgent
              captures: { rd_sb: "$.data.id" }
            - call: "POST /paywall/readers"
              payload: { email: "seat_c@univ.edu", is_registered: true, propensity_band: "MEDIUM" }
              as: SubscriptionOpsAgent
              captures: { rd_sc: "$.data.id" }
            - call: "GET /paywall/group-accounts/${grp}"
              payload: {}
              as: GroupAdmin
              as_user_id: "${grp}"
              captures: { grp_v1: "$.data.version" }
            - call: "POST /paywall/group-accounts/${grp}/seats"
              payload: { reader_id: "${rd_sa}", starts_on: "2026-10-05", ends_on: "2026-10-13", expected_group_account_version: "${grp_v1}" }
              as: GroupAdmin
              as_user_id: "${grp}"
              captures: { seat_a: "$.data.id" }
            - call: "GET /paywall/group-accounts/${grp}"
              payload: {}
              as: GroupAdmin
              as_user_id: "${grp}"
              captures: { grp_v2: "$.data.version" }
            - call: "POST /paywall/group-accounts/${grp}/seats"
              payload: { reader_id: "${rd_sb}", starts_on: "2026-10-05", ends_on: "2026-10-13", expected_group_account_version: "${grp_v2}" }
              as: GroupAdmin
              as_user_id: "${grp}"
              captures: { seat_b: "$.data.id" }
            - call: "GET /paywall/group-accounts/${grp}"
              payload: {}
              as: GroupAdmin
              as_user_id: "${grp}"
              captures: { grp_v3: "$.data.version" }
            - call: "POST /paywall/group-accounts/${grp}/seats"
              payload: { reader_id: "${rd_sc}", starts_on: "2026-10-05", ends_on: "2026-10-13", expected_group_account_version: "${grp_v3}" }
              as: GroupAdmin
              as_user_id: "${grp}"
              captures: { seat_c: "$.data.id" }
            - call: "POST /paywall/seats/${seat_a}/activate"
              payload: {}
              as: Reader
              as_user_id: "${rd_sa}"
            - call: "POST /paywall/seats/${seat_b}/activate"
              payload: {}
              as: Reader
              as_user_id: "${rd_sb}"
            - call: "POST /paywall/seats/${seat_c}/activate"
              payload: {}
              as: Reader
              as_user_id: "${rd_sc}"
          trigger:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/billing-runs"
              payload: { scope: "BILLING_ONLY" }
              as: SubscriptionOpsAgent
            - call: "GET /paywall/subscriptions/${sub_i}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv_i2: "$.data[1].id" }
          assert:
            - "Invoice.${inv_i2}.cycle_index == 2"
            - "Invoice.${inv_i2}.base_line_cents == 5000"
            - "Invoice.${inv_i2}.seat_line_cents == 321"
            - "Invoice.${inv_i2}.seat_line_cents != 320"
            - "Invoice.${inv_i2}.discount_line_cents == 0"
            - "Invoice.${inv_i2}.total_cents == 5321"
            - "Seat.${seat_a}.status == ACTIVE"
            - "GroupAccount.${grp}.seats_assigned_count == 3"
            - "GroupAccount.${grp}.seats_available_count == 0"

      - name: invoice_total_pins_discount_tier_before_credits
        grounds:
          - calculations.invoice_total_assembly
          - calculations.hold_credit_computation
          - entities.Invoice.fields.discount_line_cents
          - entities.Invoice.fields.credit_line_cents
          - state_machines.SaveOffer.SAVE_OFFER_PRESENTED_to_SAVE_OFFER_ACCEPTED
        distinguishing_aspect: |
          Mode (c) evaluation order: the high-value discount uplift is keyed on the
          PRE-credit subtotal, so a 1899 subtotal with a 0.20 retention discount and a
          450 vacation credit bills discount 570 and total 879; sweeping the credit
          first would drop the subtotal to 1449, lose the uplift and bill 290 / 1159.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-09-01T00:00:00Z."
            - "ACTIVE PRINT_DIGITAL plan: intro_price_cents 999 for 1 cycle, standard_price_cents 1899 from cycle 2, print_component_cents 900, print_deliveries_per_cycle 4, print_delivery_days [SUN], cycle_days 30 -> daily print rate 225."
            - "Subscription ACTIVE with cycle-1 invoice of 999 PAID, print_fulfillment_status SCHEDULED, paid_through_on 2026-10-01."
            - "A VACATION_DELIVERY hold over the closed interval 2026-09-06..2026-09-13 covering exactly two Sunday deliveries -> credit_cents 450, driven to COMPLETED by two HOLDS_ONLY runs (clock 2026-09-10 then 2026-09-14)."
            - "A RETENTION_DISCOUNT save offer of 0.20 for 3 cycles accepted by the reader, so retention_discount_pct 0.20 and retention_discount_cycles_remaining 3."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Print + Digital", bundle_type: "PRINT_DIGITAL", intro_price_cents: 999, intro_cycles: 1, standard_price_cents: 1899, standard_from_cycle: 2, cycle_days: 30, print_component_cents: 900, print_deliveries_per_cycle: 4, print_delivery_days: ["SUN"] }
              as: RevenueManager
              captures: { plan_p: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_p}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_p_v2: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "reader4@mail.test", is_registered: true, propensity_band: "MEDIUM" }
              as: SubscriptionOpsAgent
              captures: { rd4: "$.data.id" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd4}", offer_plan_id: "${plan_p}", expected_offer_plan_version: "${plan_p_v2}" }
              as: SubscriptionOpsAgent
              captures: { sub4: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub4}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv4a: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv4a}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 999 }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/subscriptions/${sub4}/holds"
              payload: { hold_type: "VACATION_DELIVERY", start_date: "2026-09-06", end_date: "2026-09-13" }
              as: Reader
              as_user_id: "${rd4}"
              captures: { hold4: "$.data.id" }
            - call: "POST /paywall/subscriptions/${sub4}/cancellation-requests"
              payload: { reason_code: "PRICE" }
              as: Reader
              as_user_id: "${rd4}"
              captures: { cr4: "$.data.id" }
            - call: "POST /paywall/cancellation-requests/${cr4}/save-offers"
              payload: { offer_type: "RETENTION_DISCOUNT", discount_pct: 0.20, duration_cycles: 3 }
              as: SubscriptionOpsAgent
              captures: { so4: "$.data.id" }
            - call: "POST /paywall/save-offers/${so4}/decision"
              payload: { decision: "ACCEPTED" }
              as: Reader
              as_user_id: "${rd4}"
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/billing-runs"
              payload: { scope: "HOLDS_ONLY" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/billing-runs"
              payload: { scope: "HOLDS_ONLY" }
              as: SubscriptionOpsAgent
          trigger:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
