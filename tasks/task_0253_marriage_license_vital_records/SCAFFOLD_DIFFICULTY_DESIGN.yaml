              payload: { full_name: "Ida Cor", date_of_birth: "1991-02-02", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { iB: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Jeb Dow", date_of_birth: "1989-03-03", prior_marriage_status: "DIVORCED", prior_dissolution_date: "2020-01-01" }
              as: Clerk
              captures: { iC: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${iA}", applicant_b_id: "${iB}", ceremony_county: "Kern" }
              as: Clerk
              captures: { iap1: $.data.id }
            - call: "POST /applications/${iap1}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${iap1}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
            - call: "POST /applications"
              payload: { applicant_a_id: "${iA}", applicant_b_id: "${iC}", ceremony_county: "Kern" }
              as: Clerk
              captures: { iap2: $.data.id }
            - call: "POST /applications/${iap2}/submit"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /applications/${iap2}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
              captures: { ierr: $.data.error_id }
          assert:
            - "response error_id == ERR_APPLICANT_LICENSE_OVERLAP"
            - "MarriageApplication.${iap2}.status == UNDER_REVIEW"
            - "GET /applications/${iap2}/licenses returns exactly 0 MarriageLicense"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: copy_issue_then_refund_leaves_collected_balance_unchanged
        grounds:
          - calculations.office_collected_balance
          - state_machines.CertifiedCopyRequest.PENDING_to_ISSUED
          - state_machines.CertifiedCopyRequest.ISSUED_to_REFUNDED
          - entities.FeeLedgerEntry.fields.kind
        distinguishing_aspect: |
          Conserved quantity = office_collected_balance (net cash = sum CHARGE - sum REFUND).
          Issuing a PUBLIC 5-copy request appends a +6300 CHARGE; refunding it appends a
          -6300 REFUND, so collected returns to its pre-issue value. The conserved quantity
          is collected cash, distinct from the certified_copies_issued count invariant below.
        test_recipe:
          setup:
            - "A REGISTERED non-confidential record whose application chain already has a license CHARGE of 9000 (collected before copy = 9000). A PENDING PUBLIC 5-copy request exists."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
              payload: { full_name: "Kai Erb", date_of_birth: "1990-01-01", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { jA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Lia Fen", date_of_birth: "1991-02-02", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { jB: $.data.id }
            - call: "POST /officiants"
              payload: { full_name: "Rev. Gad", credential_type: "CLERGY", registration_expires_on: "2030-01-01" }
              as: Clerk
              captures: { jofc: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${jA}", applicant_b_id: "${jB}", ceremony_county: "Kern" }
              as: Clerk
              captures: { jap: $.data.id }
            - call: "POST /applications/${jap}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${jap}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
            - call: "GET /applications/${jap}/licenses"
              payload: {}
              as: Clerk
              captures: { jlc: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-20T12:00:00Z" }
              as: Clerk
            - call: "POST /returns"
              payload: { license_id: "${jlc}", officiant_id: "${jofc}", ceremony_date: "2026-01-20T12:00:00Z" }
              as: Officiant
              as_user_id: "${jofc}"
              captures: { jrt: $.data.id }
            - call: "POST /returns/${jrt}/accept"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
            - call: "GET /records?return_id=${jrt}"
              payload: {}
              as: Clerk
              captures: { jrc: "$.data[0].id" }
            - call: "POST /certified-copies"
              payload: { record_id: "${jrc}", requester_kind: "PUBLIC", copies_requested: 5 }
              as: Clerk
              captures: { jcc: $.data.id }
            - call: "GET /records/${jrc}"
              payload: {}
              as: Clerk
              captures: { jrcv: $.data.version }
          trigger:
            - call: "POST /certified-copies/${jcc}/decide"
              payload: { decision: "ISSUE", expected_record_version: "${jrcv}" }
              as: Clerk
              as_user_id: "clerk-2"
              captures: { jfee: $.data.fee_cents }
            - call: "POST /certified-copies/${jcc}/refund"
              payload: {}
              as: Clerk
              as_user_id: "clerk-2"
              captures: { jcc_status: $.data.status }
          assert:
            - "CertifiedCopyRequest.${jcc}.fee_cents == 6300"
            - "CertifiedCopyRequest.${jcc}.status == REFUNDED"
            - "office_collected_balance over application ${jap} ledger == 9000 (license 9000 + copy 6300 - refund 6300)"

      - name: copy_issue_then_refund_leaves_copies_issued_count_unchanged
        grounds:
          - entities.MarriageRecord.fields.certified_copies_issued
          - state_machines.CertifiedCopyRequest.PENDING_to_ISSUED
          - state_machines.CertifiedCopyRequest.ISSUED_to_REFUNDED
        distinguishing_aspect: |
          Conserved quantity = MarriageRecord.certified_copies_issued (a denormalized count,
          not cash). Issuing increments it to 1; refunding decrements it back to 0, so the
          forward+compensating pair leaves the count at its pre-issue value. This conserved
          quantity (an integer count) differs in type from the collected-cash invariant above.
        test_recipe:
          setup:
            - "A REGISTERED record with certified_copies_issued=0 and one PENDING PUBLIC 2-copy request."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
