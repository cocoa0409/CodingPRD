            - "ScanAppointment.${appt2_id}.cancellation_reason_code == ORDER_DENIED"
            - "ScanAppointment.${appt2_id}.cancelled_at_utc == 2026-03-10T09:05:00Z"
            - "Patient.${pat_id}.open_scheduled_order_count == 0"
            - "ScanOrder.${order1_id}.status == COMPLETED"
            - "ScanAppointment.${appt1_id}.status == COMPLETED"
      - name: qc_failure_cascades_three_levels_and_spares_appointments_beyond_the_horizon
        grounds:
          - calculations.qc_deviation_and_result
          - state_machines.Densitometer.ACTIVE_to_QC_HOLD
          - state_machines.ScanAppointment.BOOKED_to_CANCELLED
          - state_machines.ScanOrder.SCHEDULED_to_REQUESTED
          - entities.ScanOrder.fields.reschedule_required
          - entities.Densitometer.fields.qc_hold_started_at
          - endpoints["POST /bone-density/densitometers/{id}/qc-runs"]
        distinguishing_aspect: |
          A different origin entity and a different depth from the finalize cascade: a single QcRun
          drives Densitometer ACTIVE -> QC_HOLD (link 1), which cancels only the BOOKED appointments
          starting inside QC_HOLD_CANCEL_HORIZON_HOURS of qc_hold_started_at (link 2), which reverts
          those orders SCHEDULED -> REQUESTED with reschedule_required true and decrements
          open_scheduled_order_count (link 3). The horizon makes the cascade selective rather than
          total: the 2026-03-10 appointment dies while the 2026-03-20 appointment on the same device
          for the same patient survives untouched, so a blanket cancel-everything implementation is
          detected.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-02T08:00:00Z rising to 2026-03-09T08:00:00Z."
            - "One ACTIVE Densitometer HLG-0001 with phantom baseline 1.0000 / 0.0100 and lsc_g_cm2 0.0277."
            - "Patient MRN-9001 with two REQUESTED orders, each booked: A1 on 2026-03-10T09:00:00Z (inside the 48-hour horizon) and A2 on 2026-03-20T09:00:00Z (outside it), leaving open_scheduled_order_count 2."
