  # ==========================================================================
  # 8. CROSS-CUTTING COMPLEXITY LAYERS
  #
  # complexity_profile.complexity_layers declares five layers. Four have a row
  # in the claim-extraction guide's layer table and are walked below. The fifth,
  # ops_run_checkpoint, has NO row in that table; its testable content - that a
  # markdown run touches only the pieces whose listing clock has actually run
  # and is a no-op for the rest - is covered by the calculations instance
  # the_markdown_run_skips_pieces_that_were_never_placed, so no separate
  # instance is minted here rather than inventing a claim_type.
  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_expected_consignor_version_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[payout-stale-consignor]
          - validations[priority 7]
          - errors[ERR_STALE_CONSIGNOR_VERSION]
          - endpoints[POST /consignors/{id}/payouts]
        distinguishing_aspect: "The version gate at priority 7 outranks BOTH fiscal gates: a consignor with an empty ledger and a stale version answers ERR_STALE_CONSIGNOR_VERSION at HTTP 412, and only once the fresh version is presented does the same call fall through to ERR_INSUFFICIENT_BALANCE - which also proves version incremented on the intervening PATCH."
        test_recipe:
          setup:
            - "consignor Alpha registered, then read once so the client holds version 1"
            - "a PATCH moving Alpha to floor 3 with an elevator, which advances version to 2 while the ledger stays empty and the balance stays 0"
          setup_api_calls:
            - call: "POST /consignors"
              payload: { display_name: "Alpha", email: "alpha@example.com", address_line: "1 A St", floor_number: 1, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: $.data.id }
            - call: "GET /consignors/${cons_id}"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_v: $.data.version }
            - call: "PATCH /consignors/${cons_id}"
              payload: { floor_number: 3, has_elevator: true }
              as: GalleryManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /consignors/${cons_id}/payouts"
              payload: { expected_consignor_version: "${cons_v}" }
              as: GalleryManager
              as_user_id: "mgr-1"
          assert:
            - "HTTP 412 and data.error_id == \"ERR_STALE_CONSIGNOR_VERSION\""
            - "GET /consignors/${cons_id} reports version == 2, floor_number == 3, has_elevator == true and unclaimed_balance_cents == 0"
            - "GET /consignors/${cons_id}/ledger-entries returns total_count == 0: the refused payout minted nothing"
            - "the same call with expected_consignor_version 2 returns HTTP 409 with data.error_id == \"ERR_INSUFFICIENT_BALANCE\", so the version gate really did clear before the fiscal gates ran"

      - name: item_write_off_optimistic_concurrency_walk
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[write-off-stale-item]
          - validations[priority 8]
          - errors[ERR_STALE_ITEM_VERSION]
        distinguishing_aspect: "The second OCC rule guards a DIFFERENT parent with a different field: expected_item_version on the write-off endpoint, where the version moves whenever a markdown run reprices or a recovery clears the missing flag."
        excluded_because:
          difficulty_instance: write_off_then_recovery_and_replacement_restores_zone_square_footage
          rationale: "That §1.8 instance replays a full missing / write-off / recovery / re-placement cycle and, inside it, re-uses a pre-flag item version to assert ERR_STALE_ITEM_VERSION at 412 before retrying with the fresh version; a standalone corner instance would assert a strict subset of that."

      - name: pickup_surcharge_dual_variant_walk
        claim_type: dual_variant_calculation
        grounds:
          - calculations[pickup_surcharge variants quoted and final]
          - complexity_profile[complexity_layers dual_variant_calculation]
        distinguishing_aspect: "The quoted variant is computed from the consignor's declared address facts while the final variant is computed from what the crew actually did, so the same job can carry two different surcharges and a non-zero surcharge_variance_cents."
        excluded_because:
          difficulty_instance: pickup_surcharge_quoted_vs_final_diverges
          rationale: "That §1.8 instance is the dual-variant test: it pins both variants, the variance field and the fact that only the final figure reaches the ledger, so the layer walk has nothing left to add."

      - name: lot_reprice_cascading_side_effects_walk
        claim_type: cascading_side_effects
        grounds:
          - state_machines[ConsignmentItem.lifecycle_state RECEIVED -> RECEIVING_DISPUTE]
          - complexity_profile[complexity_layers cascading_side_effects]
        distinguishing_aspect: "One receiving downgrade on a component propagates five links deep - component price, parent bundle price, parent markdown price, clearance relocation, both zones' occupancy - and the ordering matters because the clearance comparison is made against the post-markdown figure."
        excluded_because:
          difficulty_instance: component_downgrade_cascades_lot_price_into_clearance_relocation
          rationale: "That §1.8 instance walks all five cascade links end to end with pre-computed figures at each hop; a corner instance would either repeat it or test fewer links."

      - name: balance_threshold_trigger_walk
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines[ConsignmentItem.lifecycle_state ON_FLOOR -> SOLD]
          - complexity_profile[complexity_layers rate_threshold_triggers]
        distinguishing_aspect: "The -50000 balance floor is a cumulative threshold evaluated after every ledger write, so a sale credit that lifts the balance back to or above zero reinstates a SUSPENDED consignor in the same request that books the credit."
        excluded_because:
          difficulty_instance: sale_credit_cascades_through_ledger_into_consignor_reinstatement
          rationale: "That §1.8 instance drives the balance under the floor, then back over it with a sale credit, and asserts both the suspension and the reinstatement at the boundary, which is exactly this layer's claim."

  # ==========================================================================
  # 9. CONSISTENCY MODEL
  #
  # complexity_profile.consistency_model is `immediate`, so the single claim is
  # that every derived figure a write touches is already correct in that same
  # response - no lag, no re-read required.
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: the_sale_response_already_carries_the_split_and_the_freed_floor_space
        claim_type: immediate
        grounds:
          - complexity_profile[consistency_model immediate]
          - endpoints[POST /sales]
          - calculations[consignor_split]
          - state_machines[ConsignmentItem.lifecycle_state ON_FLOOR -> SOLD]
        distinguishing_aspect: "Nothing about the sale is deferred: the 201 body itself carries split_pct_applied, consignor_share_cents and gallery_share_cents, and the very next reads show the ledger entry, the recomputed consignor balance and the released zone footage - a value that lagged by even one request would fail here."
