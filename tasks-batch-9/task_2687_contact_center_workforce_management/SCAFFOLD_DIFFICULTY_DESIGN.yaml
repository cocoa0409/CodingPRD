              captures: { sh1_id: "$.data.id" }
            - call: "POST /planning-cycles/${cyc_id}/posture"
              payload: { target_posture: "REQUIREMENTS_LOCKED" }
              as: CapacityPlanner
            - call: "POST /schedule-shifts/${sh1_id}/publication"
