  # =====================================================================
  # RULE 3 — non_linear_state_machine
  # Instance 1 = CYCLE on FlightLeg.status
  # Instance 2 = PARALLEL DIMENSIONS on ScheduleVersion
  #              (filing_status vs compliance_state)
  # Instance 3 = BRANCHING FORK-JOIN on SlotTransaction.status
  # Three DIFFERENT entities, three different non-linear shapes.
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: flight_leg_slot_backed_filed_refile_cycle_completes_two_full_laps
        grounds:
          - state_machines.FlightLeg.SLOT_BACKED_to_FILED
          - state_machines.FlightLeg.FILED_to_REFILE_REQUIRED
          - state_machines.FlightLeg.REFILE_REQUIRED_to_REFILE_REQUIRED
          - state_machines.FlightLeg.REFILE_REQUIRED_to_SLOT_BACKED
          - entities.FlightLeg.fields.status
        distinguishing_aspect: |
          CYCLE shape on the FlightLeg entity: one and the same leg traverses
          SLOT_BACKED -> FILED -> REFILE_REQUIRED -> REFILE_REQUIRED -> SLOT_BACKED -> FILED, returning
          to a state it already occupied and leaving it again, which a forward-only linear
          implementation cannot reproduce.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Home carrier HX (DE); FRA is LEVEL_3_COORDINATED with gate_count 2; MUC is LEVEL_2_FACILITATED with gate_count 3."
            - "Season W26 is OPEN."
            - "One DEPARTURE SlotHolding at FRA, 2026-11-02T08:00:00Z, days_of_week \"1\", series_weeks 5 -> planned_operations 5."
            - "Four FRA->MUC Monday legs 08:00Z->09:00Z on 2026-11-02/09/16/23, all assigned to D-AHXA and all attached to that holding -> attached_operations 4, utilization_pct_as_filed 80.00, at_risk_of_loss false."
            - "ScheduleVersion W26-R1 was validated by usr-comp-1 and an EXPEDITED IATA_SSIM submission of 4 changed legs (total_charge_cents 22815) was transmitted by usr-file-1, so filing_status is FILED and all four legs are FILED."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
