# =============================================================================
# PRD Benchmark Scaffold — §1.0–§1.7
# Task: task_3032_retail_ear_piercing_service_consent_aftercare
# Domain: retail ear-piercing service consent, certification and aftercare
# =============================================================================

scenario: |
  Retail Ear Piercing Service Consent & Aftercare (Claire's): appointment and walk-in
  intake with age-based parental consent and identification requirements, piercer
  certification and periodic recertification with instrument sterilization protocols,
  single-use cartridge inventory and lot traceability, ear anatomy screening and refusal
  criteria for medical contraindications, aftercare solution kit inclusion and follow-up
  reminders, incident logging for adverse reactions with escalation and refund policy,
  jurisdictional rules on minimum age, permitted piercing sites and required record
  retention, downgrade and re-pierce policy after healing failure

domain_name: "ear-piercing-service"
api_prefix: "/piercing-services"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_deferred_actions
    - derived_field_reconciliation
    - selector_policy
    - idempotency
  entity_topology: hybrid          # flat FK peers + strict child chains (Session -> Incident/Outcome)
  state_machine_shape: compound    # cyclic, parallel-dimension and posture-driven machines coexist
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: saga

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-letter regime code identifying the piercing regulatory jurisdiction; unique."
        constraints: "exactly two uppercase letters; unique across Jurisdiction"
      - name: min_age_self_consent
        type: integer
        source: input
        description: "Youngest age in whole years at which a customer may sign their own consent."
      - name: min_age_with_guardian
        type: integer
        source: input
        description: "Youngest age in whole years at which a piercing may proceed with a verified guardian consent."
      - name: min_age_absolute
        type: integer
        source: input
        description: "Age floor below which a piercing is refused outright regardless of guardian consent."
      - name: permitted_sites
        type: array
        source: input
        description: "Anatomical sites this jurisdiction permits for customers below min_age_self_consent."
        constraints: "subset of {LOBE, UPPER_LOBE, HELIX, TRAGUS, INDUSTRIAL, NOSTRIL}"
      - name: requires_guardian_presence
        type: boolean
        source: input
        description: "True when the guardian must be physically present in store; false when notarized consent suffices."
      - name: record_retention_years
        type: integer
        source: input
        description: "Number of years piercing records must be retained for inspection."
      - name: consent_form_version
        type: string
        source: input
        description: "Version tag of the statutory consent instrument."
      - name: sterilization_protocol_code
        type: string
        source: input
        description: "Instrument sterilization protocol code mandated by this regime."
      - name: status
        type: enum
        source: system
        description: "Configuration lifecycle status."
        constraints: "ACTIVE | SUPERSEDED"
        default: ACTIVE

  - name: StoreLocation
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Store display name."
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the regime this store operates under."
      - name: piercing_room_count
        type: integer
        source: input
        description: "Number of licensed piercing rooms available for sessions."
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived aggregate posture gating child operations at this store."
        constraints: "OPEN | RESTRICTED | FROZEN"
        default: OPEN
      - name: open_incident_count
        type: integer
        source: computed
        description: "Derived count of non-terminal IncidentReport rows reachable through this store's sessions."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Store roster status."
        constraints: "OPEN | RESTRICTED | CLOSED"
        default: OPEN

  - name: Piercer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Piercer legal name."
      - name: home_store_id
        type: string
        source: input
        description: "FK -> StoreLocation.id; store the piercer is rostered against."
      - name: eligibility_score
        type: integer
        source: computed
        description: "Rolling-window eligibility score recomputed on every certification and incident mutation."
        default: 100
      - name: active_certification_id
        type: string
        source: computed
        description: "Id of the governing CertificationRecord, produced by selector policy `piercer_governing_certification`: (a) candidate set = CertificationRecord rows with piercer_id == this piercer's id and status IN {VALID, EXPIRING_SOON}; when empty, falls back to candidate set = rows with status IN {RECERTIFICATION_PENDING, EXPIRED, REVOKED}; (b) ranking expression = certification_level_order DESC (INSTRUCTOR 4 > SENIOR 3 > STANDARD 2 > APPRENTICE 1), then status_order DESC (VALID 5 > EXPIRING_SOON 4 > RECERTIFICATION_PENDING 3 > EXPIRED 2 > REVOKED 1); (c) tie-break = issued_at DESC, then created_at ASC (never id); (d) fallback when the candidate set is empty = null, and every certification gate then fails with ERR_PIERCER_NOT_CERTIFIED."
      - name: assigned_session_count
        type: integer
        source: computed
        description: "Derived count of PiercingSession rows in service_status IN_PROGRESS assigned to this piercer."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Piercer roster status."
        constraints: "ACTIVE | SUSPENDED | INACTIVE"
        default: ACTIVE

  - name: CertificationRecord
    parent: Piercer
    common_fields: true
    fields:
      - name: piercer_id
        type: string
        source: input
        description: "FK -> Piercer.id; the certified piercer."
      - name: certification_level
        type: enum
        source: input
        description: "Certification grade."
        constraints: "APPRENTICE | STANDARD | SENIOR | INSTRUCTOR"
      - name: sterilization_protocol_code
        type: string
        source: input
        description: "Protocol code the piercer is certified to execute."
      - name: issued_at
        type: datetime
        source: input
        description: "Certification issue instant."
      - name: expires_at
        type: datetime
        source: input
        description: "Certification expiry instant."
      - name: recertification_due_at
        type: datetime
        source: computed
        description: "Recertification window opening instant, computed as expires_at minus the recertification lead time."
      - name: attempted_practical_count
        type: integer
        source: computed
        description: "Number of recertification practical attempts consumed in the current cycle."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Certification lifecycle status."
        constraints: "VALID | EXPIRING_SOON | EXPIRED | RECERTIFICATION_PENDING | REVOKED"
        default: VALID

  - name: SterilizationCycle
    parent: StoreLocation
    common_fields: true
    fields:
      - name: store_location_id
        type: string
        source: input
        description: "FK -> StoreLocation.id; store operating the autoclave."
      - name: autoclave_unit_id
        type: string
        source: input
        description: "Autoclave unit identifier within the store."
      - name: protocol_code
        type: string
        source: input
        description: "Protocol code executed by this cycle."
      - name: cycle_start_at
        type: datetime
        source: input
        description: "Cycle start instant; the interval is closed [start, end]."
      - name: cycle_end_at
        type: datetime
        source: input
        description: "Cycle completion instant; the interval is closed [start, end]."
      - name: temperature_celsius
        type: number
        source: input
        description: "Peak chamber temperature reached during the cycle."
      - name: biological_indicator_passed
        type: boolean
        source: input
        description: "Whether the biological indicator spore test passed."
      - name: quarantine_scope_units
        type: integer
        source: computed
        description: "Total cartridge units in lots bound to this cycle at the instant quarantine is applied."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Cycle lifecycle status."
        constraints: "IN_PROGRESS | PASSED | FAILED | QUARANTINED | RELEASED"
        default: IN_PROGRESS

  - name: CartridgeLot
    parent: StoreLocation
    common_fields: true
    fields:
      - name: store_location_id
        type: string
        source: input
        description: "FK -> StoreLocation.id; store holding the lot."
      - name: sterilization_cycle_id
        type: string
        source: input
        description: "FK -> SterilizationCycle.id; cycle that released this lot."
      - name: lot_number
        type: string
        source: input
        description: "Manufacturer lot number used for traceability."
      - name: site_type
        type: enum
        source: input
        description: "Anatomical site the single-use cartridge is designed for."
        constraints: "LOBE | UPPER_LOBE | HELIX | TRAGUS | INDUSTRIAL | NOSTRIL"
      - name: units_received
        type: integer
        source: input
        description: "Units received into inventory."
      - name: units_available
        type: integer
        source: computed
        description: "Units currently released and unconsumed."
        default: 0
      - name: units_consumed
        type: integer
        source: computed
        description: "Units consumed by completed piercing sessions."
        default: 0
      - name: units_quarantined
        type: integer
        source: computed
        description: "Units held back by an unresolved sterilization or incident quarantine."
        default: 0
      - name: expiration_date
        type: datetime
        source: input
        description: "Sterility expiration instant."
      - name: status
        type: enum
        source: system
        description: "Lot lifecycle status."
        constraints: "AVAILABLE | DEPLETED | QUARANTINED | DISCARDED"
        default: AVAILABLE

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Customer legal name."
      - name: date_of_birth
        type: datetime
        source: input
        description: "Customer date of birth; drives the jurisdiction age gate."
      - name: guardian_name
        type: string
        source: input
        description: "Legal guardian name when the customer is a minor."
      - name: guardian_contact
        type: string
        source: input
        description: "Guardian phone or email used for consent verification."
      - name: aftercare_credit_cents
        type: integer
        source: computed
        description: "Store credit held for the customer, net of released and retained amounts."
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: "Cumulative cash refunded across this customer's incident reports."
        default: 0
      - name: retained_cents
        type: integer
        source: computed
        description: "Cumulative non-refundable amounts retained against this customer's service fees."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Customer account status."
        constraints: "ACTIVE | FLAGGED | CLOSED"
        default: ACTIVE

  - name: ConsentRecord
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; customer the consent belongs to."
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; regime the consent was captured under."
      - name: consent_type
        type: enum
        source: input
        description: "Who executed the consent instrument."
        constraints: "SELF | GUARDIAN_PRESENT | GUARDIAN_NOTARIZED | COURT_ORDER"
      - name: guardian_verification_status
        type: enum
        source: system
        description: "Parallel dimension tracking guardian identity verification, evolving independently of consent_status."
        constraints: "NOT_REQUIRED | PENDING_VERIFICATION | VERIFIED | FAILED"
        default: NOT_REQUIRED
      - name: identification_type
        type: enum
        source: input
        description: "Form of identification presented at intake."
        constraints: "GOVERNMENT_PHOTO_ID | BIRTH_CERTIFICATE | PASSPORT | STATE_ID"
      - name: required_identification_type
        type: enum
        source: computed
        description: "Identification form demanded by the jurisdiction for this consent_type, by pinned mapping: consent_type SELF -> GOVERNMENT_PHOTO_ID; GUARDIAN_PRESENT -> BIRTH_CERTIFICATE; GUARDIAN_NOTARIZED -> BIRTH_CERTIFICATE; COURT_ORDER -> PASSPORT. NONE only when the customer is at or above min_age_self_consent and the jurisdiction waives identification."
        constraints: "GOVERNMENT_PHOTO_ID | BIRTH_CERTIFICATE | PASSPORT | STATE_ID | NONE"
      - name: identification_number_masked
        type: string
        source: input
        description: "Masked identification number retained for audit."
      - name: signed_at
        type: datetime
        source: input
        description: "Instant the consent instrument was signed."
      - name: expires_at
        type: datetime
        source: computed
        description: "Consent validity deadline derived from the signature instant and the regime consent window."
      - name: consent_status
        type: enum
        source: system
        description: "Primary consent lifecycle dimension."
        constraints: "PENDING | ACTIVE | EXPIRED | REVOKED | REJECTED"
        default: PENDING

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: store_location_id
        type: string
        source: input
        description: "FK -> StoreLocation.id; store hosting the appointment."
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; customer receiving the service."
      - name: piercer_id
        type: string
        source: input
        description: "FK -> Piercer.id; piercer assigned to the slot."
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; regime snapshotted at booking time."
      - name: intake_type
        type: enum
        source: input
        description: "How the customer arrived at the store."
        constraints: "SCHEDULED | WALK_IN"
      - name: site_requested
        type: enum
        source: input
        description: "Requested anatomical site."
        constraints: "LOBE | UPPER_LOBE | HELIX | TRAGUS | INDUSTRIAL | NOSTRIL"
      - name: slot_start_at
        type: datetime
        source: input
        description: "Half-open slot start instant [start, end)."
      - name: slot_end_at
        type: datetime
        source: input
        description: "Half-open slot end instant [start, end)."
      - name: reschedule_count
        type: integer
        source: computed
        description: "Number of times this appointment has been rescheduled."
        default: 0
      - name: governing_screening_id
        type: string
        source: computed
        description: "Id of the governing AnatomyScreening, produced by selector policy `appointment_governing_screening`: (a) candidate set = AnatomyScreening rows with appointment_id == this appointment's id and outcome IN {CLEARED, REFUSED, ESCALATED}; (b) ranking expression = outcome_order DESC (CLEARED 3 > ESCALATED 2 > REFUSED 1); (c) tie-break = created_at DESC, then assessed marker order, never id; (d) fallback when the candidate set is empty = null, and SCREENED -> IN_SERVICE then fails with ERR_SCREENING_NOT_CLEARED."
      - name: status
        type: enum
        source: system
        description: "Appointment lifecycle status."
        constraints: "BOOKED | CONFIRMED | CHECKED_IN | SCREENED | IN_SERVICE | COMPLETED | RESCHEDULED | CANCELLED | NO_SHOW | REFUSED"
        default: BOOKED

  - name: AnatomyScreening
    parent: Appointment
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; appointment being screened."
      - name: piercer_id
        type: string
        source: input
        description: "FK -> Piercer.id; piercer who performed the screening."
      - name: anatomy_sites_examined
        type: array
        source: input
        description: "Ordered list of candidate sites examined during screening."
      - name: contraindication_codes
        type: array
        source: input
        description: "Medical contraindication codes observed during screening."
        constraints: "subset of {KELOID_HISTORY, ACTIVE_INFECTION, BLOOD_THINNER_THERAPY, METAL_ALLERGY, UNCONTROLLED_DIABETES, PREGNANCY, HYPERTROPHIC_SCAR}"
      - name: refusal_reason_code
        type: string
        source: computed
        description: "Highest-severity contraindication code driving a refusal; null when the screening clears."
      - name: outcome
        type: enum
        source: system
        description: "Screening outcome."
        constraints: "PENDING | CLEARED | REFUSED | ESCALATED"
        default: PENDING

  - name: PiercingSession
