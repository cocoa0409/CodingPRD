# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# =============================================================================
# Breadth probe: enumerative coverage of every testable claim the scaffold's
# §1.1–§1.7 surface declares that §1.8 does not already cover.
# Sections follow references/claim-extraction-guide.md.

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: firm_creation_required_fields
        claim_type: creation
        grounds:
          - "entities.Firm"
        distinguishing_aspect: "POST /firms with all required fields returns 201 + system fields populated."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /firms"
              payload: { name: "Acme Law", fiscal_year_start_month: 7 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
          assert:
            - "Firm.${firm_id}.name == 'Acme Law'"
            - "Firm.${firm_id}.fiscal_year_start_month == 7"
            - "Firm.${firm_id}.current_period_index == 0"
            - "Firm.${firm_id}.closed_through_period_index == -1"
            - "Firm.${firm_id}.version == 1"

      - name: firm_creation_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Firm"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /firms missing fiscal_year_start_month → ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /firms"
              payload: { name: "NoMonth" }
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: timekeeper_default_status_active
        claim_type: defaults
        grounds:
          - "entities.Timekeeper.fields.status"
        distinguishing_aspect: "Timekeeper status defaults to ACTIVE on creation."
        test_recipe:
          setup: ["Firm F1"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "Alice", bar_number: "B100", role_title: "ASSOCIATE", standard_rate_cents: 30000 }
              as: FirmAdmin
              captures: { tk_id: $.data.id, tk_status: $.data.status }
          assert:
            - "tk_status == ACTIVE"

      - name: client_default_accrual_not_required
        claim_type: defaults
        grounds:
          - "entities.Client.fields.accrual_reporting_required"
        distinguishing_aspect: "Client accrual_reporting_required defaults to false when omitted."
        test_recipe:
          setup: ["Firm F1"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/clients"
              payload: { display_name: "C1", client_number: "C1" }
              as: FirmAdmin
              captures: { c_id: $.data.id, c_ar: $.data.accrual_reporting_required }
          assert:
            - "c_ar == false"

      - name: matter_computed_fields_initial_values
        claim_type: computed_fields
        grounds:
          - "entities.Matter.fields.budget_total_cents"
          - "entities.Matter.fields.actual_fees_cents"
          - "entities.Matter.fields.variance_alert_level"
        distinguishing_aspect: "Matter computed fields initialize: budget_total_cents=0, actual_fees_cents=0, variance_cents=0, variance_pct_bp=null, variance_alert_level=NONE."
        test_recipe:
          setup: ["Firm F1, Client C1, Timekeeper TK1"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P1", bar_number: "B001", role_title: "PARTNER", standard_rate_cents: 50000 }
              as: FirmAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients"
              payload: { display_name: "C1", client_number: "C1" }
              as: FirmAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/clients/${client_id}/matters"
              payload: { matter_number: "M1", title: "M1", litigation_stage: "INTAKE", responsible_partner_id: "${tk_id}" }
              as: BillingPartner
              as_user_id: "${tk_id}"
              captures: { m_id: $.data.id, m_bt: $.data.budget_total_cents, m_af: $.data.actual_fees_cents, m_al: $.data.variance_alert_level, m_vp: $.data.variance_pct_bp }
          assert:
            - "m_bt == 0"
            - "m_af == 0"
            - "m_al == NONE"
            - "m_vp is null"

      - name: time_entry_billable_amount_floor_rounding
        claim_type: computed_fields
        grounds:
          - "entities.TimeEntry.fields.billable_amount_cents"
        distinguishing_aspect: "billable_amount_cents = floor(hours_worked_milli * hourly_rate_cents / 1000); floor rounding verified at fractional cent."
        test_recipe:
          setup: ["Firm F1, Client C1, Matter M1 OPEN (no arrangement needed at creation), PhaseBudget not required at creation"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P1", bar_number: "B001", role_title: "PARTNER", standard_rate_cents: 50000 }
              as: FirmAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients"
              payload: { display_name: "C1", client_number: "C1" }
              as: FirmAdmin
              captures: { client_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients/${client_id}/matters"
              payload: { matter_number: "M1", title: "M1", litigation_stage: "INTAKE", responsible_partner_id: "${tk_id}" }
              as: BillingPartner
              as_user_id: "${tk_id}"
              captures: { m_id: $.data.id }
          trigger:
            # 1.5 hours (1500 milli) * 33333 cents/hr = 49999.5 → floor = 49999
            - call: "POST /firms/${firm_id}/matters/${m_id}/time_entries"
              payload: { timekeeper_id: "${tk_id}", task_code: "L110", litigation_stage: "INTAKE", hours_worked_milli: 1500, hourly_rate_cents: 33333, entry_date: "2026-08-05" }
              as: Timekeeper
              as_user_id: "${tk_id}"
              captures: { te_id: $.data.id, te_amt: $.data.billable_amount_cents }
          assert:
            - "te_amt == 49999   # floor(1500*33333/1000) = floor(49999.5)"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with non-existent UUID → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Firm F1"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
          trigger:
            - call: "GET /firms/matters/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: matter_invalid_enum_litigation_stage
        claim_type: type_constraints
        grounds:
          - "entities.Matter.fields.litigation_stage"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Invalid enum value on litigation_stage → ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Firm F1, Client C1, Timekeeper TK1"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P1", bar_number: "B001", role_title: "PARTNER", standard_rate_cents: 50000 }
              as: FirmAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients"
              payload: { display_name: "C1", client_number: "C1" }
              as: FirmAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/clients/${client_id}/matters"
              payload: { matter_number: "M1", title: "M1", litigation_stage: "BOGUS", responsible_partner_id: "${tk_id}" }
              as: BillingPartner
              as_user_id: "${tk_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: list_endpoint_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
        distinguishing_aspect: "List endpoint returns meta + response_type=array + data; pagination fields limit/offset/total_count/has_more present."
        test_recipe:
          setup: ["Firm F1 with two timekeepers"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P1", bar_number: "B001", role_title: "PARTNER", standard_rate_cents: 50000 }
              as: FirmAdmin
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P2", bar_number: "B002", role_title: "ASSOCIATE", standard_rate_cents: 30000 }
              as: FirmAdmin
          trigger:
            - call: "GET /firms/timekeepers"
              payload: { firm_id: "${firm_id}", limit: 1, offset: 0 }
              as: FirmAdmin
          assert:
            - "response.meta.api_request_id is present"
            - "response.response_type == 'array'"
            - "len(response.data) == 1"
            - "response contains total_count and has_more (or their values are correct)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: fee_arrangement_invalid_transition_from_active_to_draft
        claim_type: invalid_transition
        grounds:
          - "state_machines.FeeArrangement"
        distinguishing_aspect: "FeeArrangement ACTIVE → DRAFT is not a declared transition; attempting to re-submit an ACTIVE arrangement returns ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Matter M1 with ACTIVE arrangement A1"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P1", bar_number: "B001", role_title: "PARTNER", standard_rate_cents: 50000 }
              as: FirmAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients"
              payload: { display_name: "C1", client_number: "C1" }
              as: FirmAdmin
              captures: { client_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients/${client_id}/matters"
              payload: { matter_number: "M1", title: "M1", litigation_stage: "DISCOVERY", responsible_partner_id: "${tk_id}" }
              as: BillingPartner
              as_user_id: "${tk_id}"
              captures: { m_id: $.data.id, m_v0: $.data.version }
            - call: "POST /firms/${firm_id}/matters/${m_id}/fee_arrangements"
              payload: { arrangement_type: "FLAT_FEE", flat_fee_cents: 100000, fiscal_year_index: 2026 }
              as: PricingAnalyst
              captures: { arr_id: $.data.id }
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/submit"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/activate"
              payload: { expected_matter_version: "${m_v0}" }
              as: BillingPartner
              as_user_id: "${tk_id}"
          trigger:
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/submit"
              payload: {}
              as: PricingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: write_down_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.WriteDownRequest"
        distinguishing_aspect: "WriteDownRequest in REJECTED is terminal; further decide calls return ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Matter M1 ACTIVE with WDR1 in REJECTED state"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P1", bar_number: "B001", role_title: "PARTNER", standard_rate_cents: 50000 }
              as: FirmAdmin
              captures: { tk_p1: $.data.id }
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P2", bar_number: "B002", role_title: "PARTNER", standard_rate_cents: 60000 }
              as: FirmAdmin
              captures: { tk_p2: $.data.id }
            - call: "POST /firms/${firm_id}/clients"
              payload: { display_name: "C1", client_number: "C1" }
              as: FirmAdmin
              captures: { client_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients/${client_id}/matters"
              payload: { matter_number: "M1", title: "M1", litigation_stage: "DISCOVERY", responsible_partner_id: "${tk_p1}" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
              captures: { m_id: $.data.id, m_v0: $.data.version }
            - call: "POST /firms/${firm_id}/matters/${m_id}/fee_arrangements"
              payload: { arrangement_type: "FLAT_FEE", flat_fee_cents: 100000, fiscal_year_index: 2026 }
              as: PricingAnalyst
              captures: { arr_id: $.data.id }
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/submit"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/activate"
              payload: { expected_matter_version: "${m_v0}" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/matters/${m_id}/phase_budgets"
              payload: { litigation_stage: "DISCOVERY", task_code: "L110", original_budget_cents: 100000 }
              as: PricingAnalyst
              captures: { pb_id: $.data.id }
            - call: "POST /firms/${firm_id}/phase_budgets/${pb_id}/activate"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/matters/${m_id}/time_entries"
              payload: { timekeeper_id: "${tk_p1}", task_code: "L110", litigation_stage: "DISCOVERY", hours_worked_milli: 1000, hourly_rate_cents: 50000, entry_date: "2026-08-05" }
              as: Timekeeper
              as_user_id: "${tk_p1}"
              captures: { te_id: $.data.id }
            - call: "POST /firms/${firm_id}/time_entries/${te_id}/submit"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/time_entries/${te_id}/approve"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/matters/${m_id}/write_down_requests"
              payload: { time_entry_ids: ["${te_id}"], requested_amount_cents: 10000, reason_code: "CLIENT_RELATIONS" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
              captures: { wdr_id: $.data.id }
            - call: "POST /firms/${firm_id}/write_down_requests/${wdr_id}/submit"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/write_down_requests/${wdr_id}/decide"
              payload: { decision: "REJECT" }
              as: BillingPartner
              as_user_id: "${tk_p2}"
          trigger:
            - call: "POST /firms/${firm_id}/write_down_requests/${wdr_id}/decide"
              payload: { decision: "APPROVE" }
              as: BillingPartner
              as_user_id: "${tk_p2}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: matter_initial_state_open
        claim_type: initial_state
        grounds:
          - "state_machines.Matter"
        distinguishing_aspect: "Newly created Matter starts in OPEN status."
        test_recipe:
          setup: ["Firm F1, Client C1, Timekeeper TK1"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P1", bar_number: "B001", role_title: "PARTNER", standard_rate_cents: 50000 }
              as: FirmAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients"
              payload: { display_name: "C1", client_number: "C1" }
              as: FirmAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/clients/${client_id}/matters"
              payload: { matter_number: "M1", title: "M1", litigation_stage: "INTAKE", responsible_partner_id: "${tk_id}" }
              as: BillingPartner
              as_user_id: "${tk_id}"
              captures: { m_status: $.data.status }
          assert:
            - "m_status == OPEN"

      - name: matter_close_blocked_by_open_wip
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Matter"
          - "errors[ERR_MATTER_HAS_OPEN_WIP]"
        distinguishing_aspect: "Matter close is blocked when any TimeEntry is in DRAFT/SUBMITTED/APPROVED."
        test_recipe:
          setup: ["Matter M1 ACTIVE with TE1 in APPROVED"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P1", bar_number: "B001", role_title: "PARTNER", standard_rate_cents: 50000 }
              as: FirmAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients"
              payload: { display_name: "C1", client_number: "C1" }
              as: FirmAdmin
              captures: { client_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients/${client_id}/matters"
              payload: { matter_number: "M1", title: "M1", litigation_stage: "DISCOVERY", responsible_partner_id: "${tk_id}" }
              as: BillingPartner
              as_user_id: "${tk_id}"
              captures: { m_id: $.data.id, m_v0: $.data.version }
            - call: "POST /firms/${firm_id}/matters/${m_id}/fee_arrangements"
              payload: { arrangement_type: "FLAT_FEE", flat_fee_cents: 100000, fiscal_year_index: 2026 }
              as: PricingAnalyst
              captures: { arr_id: $.data.id }
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/submit"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/activate"
              payload: { expected_matter_version: "${m_v0}" }
              as: BillingPartner
              as_user_id: "${tk_id}"
            - call: "POST /firms/${firm_id}/matters/${m_id}/phase_budgets"
              payload: { litigation_stage: "DISCOVERY", task_code: "L110", original_budget_cents: 100000 }
              as: PricingAnalyst
              captures: { pb_id: $.data.id }
            - call: "POST /firms/${firm_id}/phase_budgets/${pb_id}/activate"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/matters/${m_id}/time_entries"
              payload: { timekeeper_id: "${tk_id}", task_code: "L110", litigation_stage: "DISCOVERY", hours_worked_milli: 1000, hourly_rate_cents: 50000, entry_date: "2026-08-05" }
              as: Timekeeper
              as_user_id: "${tk_id}"
              captures: { te_id: $.data.id }
            - call: "POST /firms/${firm_id}/time_entries/${te_id}/submit"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_id}"
            - call: "POST /firms/${firm_id}/time_entries/${te_id}/approve"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_id}"
          trigger:
            - call: "POST /firms/${firm_id}/matters/${m_id}/close"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MATTER_HAS_OPEN_WIP"

      - name: client_close_blocked_by_open_matters
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Client"
          - "errors[ERR_CLIENT_HAS_OPEN_MATTERS]"
        distinguishing_aspect: "Client close blocked when any matter not in CLOSED state."
        test_recipe:
          setup: ["Client C1 with Matter M1 still OPEN"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P1", bar_number: "B001", role_title: "PARTNER", standard_rate_cents: 50000 }
              as: FirmAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients"
              payload: { display_name: "C1", client_number: "C1" }
              as: FirmAdmin
              captures: { client_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients/${client_id}/matters"
              payload: { matter_number: "M1", title: "M1", litigation_stage: "INTAKE", responsible_partner_id: "${tk_id}" }
              as: BillingPartner
              as_user_id: "${tk_id}"
          trigger:
            - call: "POST /firms/${firm_id}/clients/${client_id}/close"
              payload: {}
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CLIENT_HAS_OPEN_MATTERS"

      - name: phase_budget_void_blocked_by_actuals
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.PhaseBudget"
          - "errors[ERR_PHASE_HAS_ACTUALS]"
        distinguishing_aspect: "PhaseBudget with actual_to_date_cents > 0 cannot be voided."
        test_recipe:
