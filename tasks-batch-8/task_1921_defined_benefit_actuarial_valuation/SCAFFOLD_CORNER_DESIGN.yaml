- section: endpoints
  instances:
  - name: error_envelope_shape_on_404
    claim_type: response_envelope
    grounds:
    - response_envelope.error
    distinguishing_aspect: Error responses carry meta.api_request_id, response_type error, and data.error_id + data.message — pinned envelope shape.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /v1/plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        payload: {}
        as: PlanAdmin
        captures:
          err: $.data.error_id
      assert:
      - response_type == error
      - data contains error_id == ERR_NOT_FOUND and a non-empty message string
      - meta contains api_request_id and api_request_timestamp
  - name: success_envelope_shape_on_create
    claim_type: response_envelope
    grounds:
    - response_envelope.success
    distinguishing_aspect: 201 create responses use response_type object with data carrying the Plan including system fields.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /v1/plans
        payload:
          sponsor_name: Envelope Co
          plan_year: 2028
          accrual_rate: 0.01
          normal_retirement_age: 62
          prior_aftap_pct: 90.0
        as: PlanAdmin
        captures:
          plan_id: $.data.id
      assert:
      - http status == 201 and response_type == object
      - data.id is a UUID without any type prefix; data.created_at has three fractional digits
  - name: census_participants_subresource_reverse_reachability
    claim_type: fk_reverse_reachability
    grounds:
    - entities.Participant.fields.census_batch_id
    - endpoints.GET_/v1/census-batches/{id}/participants
    distinguishing_aspect: Children are discoverable from the parent id via the sub-resource list.
    test_recipe:
      setup:
      - plan + batch with two participants
      setup_api_calls:
      - call: POST /v1/plans
        payload:
          sponsor_name: FK Co
          plan_year: 2028
          accrual_rate: 0.01
          normal_retirement_age: 62
          prior_aftap_pct: 90.0
        as: PlanAdmin
        captures:
          plan_id: $.data.id
      - call: POST /v1/plans/${plan_id}/census-batches
        payload:
          plan_year: 2028
          source_label: c1
        as: PlanAdmin
        captures:
          batch_id: $.data.id
      - call: POST /v1/census-batches/${batch_id}/participants
        payload:
          participants:
          - external_ref: E1
            date_of_birth: '1966-01-01'
            status: ACTIVE
            years_of_service: 1
            annual_compensation: 50000
          - external_ref: E2
            date_of_birth: '1965-01-01'
            status: RETIREE
            current_annual_benefit: 12000
        as: PlanAdmin
      trigger:
      - call: GET /v1/census-batches/${batch_id}/participants
        payload: {}
        as: PlanAdmin
      assert:
      - response data is an array of length 2; each row's census_batch_id == ${batch_id}
  - name: bulk_participant_post_partial_success
    claim_type: bulk_partial_success
    grounds:
    - endpoints.POST_/v1/census-batches/{id}/participants
    distinguishing_aspect: Bulk post writes valid rows and reports invalid ones without rolling back the batch (best-effort semantics pinned in the endpoint description).
    test_recipe:
      setup:
      - plan + batch; bulk post with one valid and one age-64 row
      setup_api_calls:
      - call: POST /v1/plans
        payload:
          sponsor_name: Bulk Co
          plan_year: 2028
          accrual_rate: 0.01
