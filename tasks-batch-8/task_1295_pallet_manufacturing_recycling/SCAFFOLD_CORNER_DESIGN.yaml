      - name: duplicate_stop_sequence_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_DUPLICATE_STOP_SEQUENCE]"]
        distinguishing_aspect: "Two stops on the same route with the same stop_sequence -> ERR_DUPLICATE_STOP_SEQUENCE (409)."
        test_recipe:
          setup: ["PLAN route with stop seq 1 already present"]
          setup_api_calls:
