              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /members/${s_id}/suspend"
              payload: {}
              as: Moderator
          trigger:
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          assert:
            - "response error_id == ERR_MEMBER_NOT_ACTIVE"
            - "http status == 403"
            - "Listing.${lst_id}.publication_status == DRAFT (publish blocked by seller state)"

      - name: meetup_create_requires_offer_accepted_and_listing_reserved
        grounds:
          - state_machines.Meetup.transitions.PROPOSED_to_CONFIRMED
          - entities.Offer.fields.status
          - entities.Listing.fields.sale_status
        distinguishing_aspect: |
          Pair {Meetup -> Offer/Listing}, a DIFFERENT entity pair than Listing->Member:
          a meetup may only be created against an ACCEPTED Offer whose Listing is RESERVED;
          creating against a still-PROPOSED offer (listing AVAILABLE) fails ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Clock 08:00; spot open 08:00-18:00; listing published; buyer offer PROPOSED (not accepted)."
          setup_api_calls:
