# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: enumerates testable claims of §1.1-§1.7 not covered by §1.8.
# Same structured-call form and §1.5 reachability gates as §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------- entities
  - section: entities
    instances:
      - name: create_supplier_returns_all_fields
        claim_type: Creation
        grounds: [entities.Supplier, endpoints]
        distinguishing_aspect: "POST /suppliers with all required fields -> 201, echoes inputs, reserved_blank_qty initialized to 0, system id/created_at present."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
          assert:
            - "Supplier.${sup_id}.blank_unit_cost_cents == 150"
            - "Supplier.${sup_id}.concurrent_capacity_units == 500"
            - "Supplier.${sup_id}.reserved_blank_qty == 0"

      - name: get_order_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Order, "errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET /orders/{unknown-uuid} -> ERR_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no orders)."]
          setup_api_calls: []
          trigger:
            - { call: "GET /orders/00000000-0000-4000-8000-000000000000", payload: {}, as: AccountManager, captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_ORDER_NOT_FOUND"

      - name: create_line_missing_quantity_returns_validation
        claim_type: Required Fields
        grounds: [entities.OrderLine.fields.quantity, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /orders/{id}/lines omitting required quantity -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A draft order and a product exist."]
          setup_api_calls:
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT" }, as: Customer, as_user_id: "${cust_id}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_VALIDATION"

      - name: order_type_defaults_to_standard
        claim_type: Defaults
        grounds: [entities.Order.fields.order_type]
        distinguishing_aspect: "POST /orders omitting order_type -> order_type defaults to STANDARD."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
          assert:
            - "Order.${ord_id}.order_type == STANDARD"
            - "Order.${ord_id}.fulfillment_status == DRAFT"
            - "Order.${ord_id}.payment_status == UNPAID"

      - name: create_line_computes_pricing_fields
        claim_type: Computed Fields
        grounds: [entities.OrderLine.fields.line_subtotal_cents, calculations.line_subtotal]
        distinguishing_aspect: "unit_price_cents/line_setup_cents/line_subtotal_cents are computed at line creation (client cannot set them)."
        test_recipe:
          setup: ["Product with SCREEN_PRINT tiers 48->599, 144->499; draft order."]
          setup_api_calls:
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 144, unit_price_cents: 499 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "EMBROIDERY", min_quantity: 24, unit_price_cents: 800 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "EMBROIDERY", quantity: 100, imprint_color_count: 1 }, as: Customer, as_user_id: "${cust_id}", captures: { line_id: "$.data.id" } }
          assert:
            - "OrderLine.${line_id}.line_setup_cents == 4000"
            - "OrderLine.${line_id}.status == PENDING_ART"

      - name: price_tier_invalid_decoration_method_returns_validation
        claim_type: Type Constraints
        grounds: [entities.PriceTier.fields.decoration_method, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST price-tier with a decoration_method outside the enum -> ERR_VALIDATION."
        test_recipe:
          setup: ["A product exists."]
          setup_api_calls:
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
          trigger:
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "GOLD_FOIL", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin, captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_VALIDATION"

      - name: list_products_by_supplier_fk_filter
        claim_type: Parent Relationships
        grounds: [entities.Product.fields.supplier_id]
        distinguishing_aspect: "GET /products?supplier_id=... returns the supplier's products (FK reverse-reachability)."
        test_recipe:
          setup: ["One supplier with one product."]
          setup_api_calls:
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
          trigger:
            - { call: "GET /products", payload: { supplier_id: "${sup_id}" }, as: AccountManager }
          assert:
            - "response is an array containing a Product whose id == ${prod_id} and supplier_id == ${sup_id}"

  # ---------------------------------------------------------- state_machines
  - section: state_machines
    instances:
      - name: new_order_initial_state_is_draft_unpaid
        claim_type: Initial State
        grounds: [state_machines.Order]
        distinguishing_aspect: "A newly created order starts fulfillment_status=DRAFT, payment_status=UNPAID, escrow 0, art_complete false."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
          assert:
            - "Order.${ord_id}.fulfillment_status == DRAFT"
            - "Order.${ord_id}.payment_status == UNPAID"
            - "Order.${ord_id}.escrow_cents == 0"
            - "Order.${ord_id}.art_complete == false"

      - name: start_print_before_schedule_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.OrderLine.SCHEDULED_to_PRINTING, "errors[ERR_LINE_INVALID_STATE]"]
        distinguishing_aspect: "start-print on a CONFIRMED (not SCHEDULED) line -> ERR_LINE_INVALID_STATE; no side effects."
        test_recipe:
          setup: ["A CONFIRMED order line (art approved, order confirmed) not yet scheduled."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: CatalogAdmin }
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 144, unit_price_cents: 499 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 200, imprint_color_count: 3 }, as: Customer, as_user_id: "${cust_id}", captures: { line_id: "$.data.id", line_v: "$.data.version" } }
            - { call: "POST /order-lines/${line_id}/art-proofs", payload: { proof_url: "http://x/a.png", expected_order_line_version: "${line_v}" }, as: AccountManager, captures: { proof_id: "$.data.id" } }
            - { call: "POST /art-proofs/${proof_id}/submit", payload: {}, as: AccountManager }
            - { call: "POST /art-proofs/${proof_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /orders/${ord_id}/payments", payload: { amount_cents: 60650 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /order-lines/${line_id}/start-print", payload: {}, as: ProductionManager, captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_LINE_INVALID_STATE"
            - "OrderLine.${line_id}.status == CONFIRMED"

      - name: deliver_unshipped_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Order.SHIPPED_to_DELIVERED, "errors[ERR_ORDER_NOT_SHIPPED]"]
        distinguishing_aspect: "deliver on a DRAFT order -> ERR_ORDER_NOT_SHIPPED."
        test_recipe:
          setup: ["A fresh DRAFT order."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/deliver", payload: {}, as: ProductionManager, captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_ORDER_NOT_SHIPPED"

      - name: cancel_already_cancelled_order_returns_not_cancellable
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Order.QUOTED_to_CANCELLED, "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Second cancel on an already-CANCELLED (terminal) order -> ERR_ORDER_NOT_CANCELLABLE."
        test_recipe:
          setup: ["An order cancelled once from DRAFT."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/cancel", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /orders/${ord_id}/cancel", payload: {}, as: AccountManager, captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_ORDER_NOT_CANCELLABLE"
            - "Order.${ord_id}.fulfillment_status == CANCELLED"

      - name: approve_proof_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.ArtProof.PENDING_APPROVAL_to_APPROVED, "errors[ERR_ART_INVALID_STATE]"]
        distinguishing_aspect: "Approving an already-APPROVED proof -> ERR_ART_INVALID_STATE (not idempotent success)."
        test_recipe:
          setup: ["A line with an APPROVED proof."]
          setup_api_calls:
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 144, unit_price_cents: 499 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 200, imprint_color_count: 3 }, as: Customer, as_user_id: "${cust_id}", captures: { line_id: "$.data.id", line_v: "$.data.version" } }
            - { call: "POST /order-lines/${line_id}/art-proofs", payload: { proof_url: "http://x/a.png", expected_order_line_version: "${line_v}" }, as: AccountManager, captures: { proof_id: "$.data.id" } }
            - { call: "POST /art-proofs/${proof_id}/submit", payload: {}, as: AccountManager }
            - { call: "POST /art-proofs/${proof_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /art-proofs/${proof_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_ART_INVALID_STATE"
            - "ArtProof.${proof_id}.status == APPROVED"

  # ------------------------------------------------------------- validations
  - section: validations
    instances:
      - name: max_colors_exceeded_returns_error
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_MAX_COLORS_EXCEEDED]"]
        distinguishing_aspect: "SCREEN_PRINT line with imprint_color_count 7 (> max_colors 6) -> ERR_MAX_COLORS_EXCEEDED."
        test_recipe:
          setup: ["Product with SCREEN_PRINT tier at 48; draft order."]
          setup_api_calls:
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 100, imprint_color_count: 7 }, as: Customer, as_user_id: "${cust_id}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_MAX_COLORS_EXCEEDED"

      - name: no_matching_price_tier_returns_error
        claim_type: Violation → Error
        grounds: [calculations.line_subtotal, "errors[ERR_TIER_NOT_FOUND]"]
        distinguishing_aspect: "A line whose (product, method) has no tier with min_quantity <= quantity -> ERR_TIER_NOT_FOUND (min_order_qty is satisfied first)."
        test_recipe:
          setup: ["Product min_order_qty 1 with only an EMBROIDERY tier; a SCREEN_PRINT line requested."]
          setup_api_calls:
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "CAP", name: "Cap", min_order_qty: 1 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "EMBROIDERY", min_quantity: 24, unit_price_cents: 800 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 50, imprint_color_count: 1 }, as: Customer, as_user_id: "${cust_id}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_TIER_NOT_FOUND"

      - name: sample_quantity_exceeded_returns_error
        claim_type: Conditional validation
        grounds: ["validations[priority=7]", "errors[ERR_SAMPLE_QTY_EXCEEDED]", entities.Order.fields.order_type]
        distinguishing_aspect: "A SAMPLE order line with quantity 13 (> SAMPLE_MAX_QTY 12) -> ERR_SAMPLE_QTY_EXCEEDED (conditional on order_type=SAMPLE)."
        test_recipe:
          setup: ["Product min_order_qty 1 with a SCREEN_PRINT tier at 1; a SAMPLE order."]
          setup_api_calls:
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "PEN", name: "Pen", min_order_qty: 1 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 1, unit_price_cents: 700 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "SAMPLE", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 13, imprint_color_count: 1 }, as: Customer, as_user_id: "${cust_id}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_SAMPLE_QTY_EXCEEDED"

      - name: schedule_invalid_time_window_returns_error
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_INVALID_TIME_WINDOW]"]
        distinguishing_aspect: "PO create with production_end <= production_start -> ERR_INVALID_TIME_WINDOW."
        test_recipe:
          setup: ["A confirmed order with one line (so a PO can be created)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: CatalogAdmin }
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 144, unit_price_cents: 499 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 200, imprint_color_count: 3 }, as: Customer, as_user_id: "${cust_id}", captures: { line_id: "$.data.id", line_v: "$.data.version" } }
            - { call: "POST /order-lines/${line_id}/art-proofs", payload: { proof_url: "http://x/a.png", expected_order_line_version: "${line_v}" }, as: AccountManager, captures: { proof_id: "$.data.id" } }
            - { call: "POST /art-proofs/${proof_id}/submit", payload: {}, as: AccountManager }
            - { call: "POST /art-proofs/${proof_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /orders/${ord_id}/payments", payload: { amount_cents: 60650 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /purchase-orders", payload: { order_line_id: "${line_id}", supplier_id: "${sup_id}", ordered_blank_qty: 210, production_start: "2026-05-08T00:00:00Z", production_end: "2026-05-05T00:00:00Z" }, as: AccountManager, captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_INVALID_TIME_WINDOW"

  # -------------------------------------------------------------------- rbac
  - section: rbac
    instances:
      - name: customer_cannot_quote_returns_unauthorized
        claim_type: role denial
        grounds: [roles, "errors[ERR_UNAUTHORIZED]", endpoints]
        distinguishing_aspect: "A Customer calling POST /orders/{id}/quote (AccountManager-exclusive) -> ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["A draft order with one line owned by the customer."]
          setup_api_calls:
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 100, imprint_color_count: 1 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${ord_id}/quote", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_UNAUTHORIZED"
            - "Order.${ord_id}.fulfillment_status == DRAFT"

      - name: customer_cannot_approve_other_customers_proof_returns_not_owner
        claim_type: peer_roles ownership
        grounds: [roles, "errors[ERR_NOT_ORDER_OWNER]", state_machines.ArtProof.PENDING_APPROVAL_to_APPROVED]
        distinguishing_aspect: "A second Customer (not the order owner) approving a PENDING_APPROVAL proof -> ERR_NOT_ORDER_OWNER."
        test_recipe:
          setup: ["Customer A owns an order with a submitted proof; Customer B also exists."]
          setup_api_calls:
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 144, unit_price_cents: 499 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "AcmeA", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { custA_id: "$.data.id" } }
            - { call: "POST /customers", payload: { name: "AcmeB", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { custB_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${custA_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${custA_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 200, imprint_color_count: 3 }, as: Customer, as_user_id: "${custA_id}", captures: { line_id: "$.data.id", line_v: "$.data.version" } }
            - { call: "POST /order-lines/${line_id}/art-proofs", payload: { proof_url: "http://x/a.png", expected_order_line_version: "${line_v}" }, as: AccountManager, captures: { proof_id: "$.data.id" } }
            - { call: "POST /art-proofs/${proof_id}/submit", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /art-proofs/${proof_id}/approve", payload: {}, as: Customer, as_user_id: "${custB_id}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_NOT_ORDER_OWNER"
            - "ArtProof.${proof_id}.status == PENDING_APPROVAL"

      - name: missing_user_headers_returns_unauthenticated
        claim_type: role denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with missing/invalid X-User-ID / X-User-Role headers -> ERR_UNAUTHENTICATED (401), checked before all else."
        test_recipe:
          setup: ["A customer and one order exist; the trigger is issued WITHOUT auth headers."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "GET /orders/${ord_id}", payload: {}, as: Customer, captures: { err_id: "$.data.error_id" } }
          assert:
            - "When issued with no X-User-ID/X-User-Role headers, trigger response data.error_id == ERR_UNAUTHENTICATED"

  # ---------------------------------------------------- cross-cutting layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: art_proof_create_stale_line_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[art-proof-create-stale-line]", "errors[ERR_STALE_ORDER_LINE_VERSION]"]
        distinguishing_aspect: "Two sequential art-proof creates carrying the same expected_order_line_version: the first succeeds (line version -> 2), the second is stale -> 412 ERR_STALE_ORDER_LINE_VERSION."
        test_recipe:
          setup: ["A draft order with one line at version 1."]
          setup_api_calls:
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 144, unit_price_cents: 499 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 200, imprint_color_count: 3 }, as: Customer, as_user_id: "${cust_id}", captures: { line_id: "$.data.id", line_v: "$.data.version" } }
          trigger:
            - { call: "POST /order-lines/${line_id}/art-proofs", payload: { proof_url: "http://x/a.png", expected_order_line_version: "${line_v}" }, as: AccountManager, captures: { proof1_id: "$.data.id" } }
            - { call: "POST /order-lines/${line_id}/art-proofs", payload: { proof_url: "http://x/b.png", expected_order_line_version: "${line_v}" }, as: AccountManager, captures: { err_id: "$.data.error_id" } }
          assert:
            - "first trigger -> 201 (proof created)"
            - "second trigger response data.error_id == ERR_STALE_ORDER_LINE_VERSION"
            - "OrderLine.${line_id}.version == 2"

      - name: reorder_from_non_delivered_source_returns_error
        claim_type: conditional_feature_flags
        grounds: ["errors[ERR_REORDER_SOURCE_NOT_DELIVERED]", entities.Order.fields.reorder_source_order_id]
        distinguishing_aspect: "POST /orders/{sourceOrderId}/reorder where the source order is DRAFT (not DELIVERED) -> ERR_REORDER_SOURCE_NOT_DELIVERED."
        test_recipe:
          setup: ["A DRAFT source order exists."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { src_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${src_id}/reorder", payload: { in_hands_date: "2026-06-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_REORDER_SOURCE_NOT_DELIVERED"

      - name: payment_insufficient_credit_returns_error
        claim_type: derived_field_reconciliation
        grounds: ["validations[priority=8]", "errors[ERR_INSUFFICIENT_CREDIT]", entities.Customer.fields.credit_balance_cents]
        distinguishing_aspect: "A payment whose amount_cents exceeds the customer's credit_balance_cents -> ERR_INSUFFICIENT_CREDIT; escrow unchanged."
        test_recipe:
          setup: ["A quoted order whose customer has only 1000 credit."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: CatalogAdmin }
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 144, unit_price_cents: 499 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Broke", initial_credit_cents: 1000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 200, imprint_color_count: 3 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/quote", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /orders/${ord_id}/payments", payload: { amount_cents: 60650 }, as: Customer, as_user_id: "${cust_id}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_INSUFFICIENT_CREDIT"
            - "Order.${ord_id}.escrow_cents == 0"
            - "Customer.${cust_id}.credit_balance_cents == 1000"

      - name: duplicate_purchase_order_for_line_returns_error
        claim_type: cross-entity FK integrity
        grounds: ["validations[priority=5]", "errors[ERR_PO_ALREADY_EXISTS]", entities.PurchaseOrder.fields.order_line_id]
        distinguishing_aspect: "Creating a second non-cancelled PurchaseOrder for a line that already has one -> ERR_PO_ALREADY_EXISTS."
        test_recipe:
          setup: ["A confirmed order with one line and one existing (DRAFT) PurchaseOrder."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: CatalogAdmin }
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 144, unit_price_cents: 499 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 200, imprint_color_count: 3 }, as: Customer, as_user_id: "${cust_id}", captures: { line_id: "$.data.id", line_v: "$.data.version" } }
            - { call: "POST /order-lines/${line_id}/art-proofs", payload: { proof_url: "http://x/a.png", expected_order_line_version: "${line_v}" }, as: AccountManager, captures: { proof_id: "$.data.id" } }
            - { call: "POST /art-proofs/${proof_id}/submit", payload: {}, as: AccountManager }
            - { call: "POST /art-proofs/${proof_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /orders/${ord_id}/payments", payload: { amount_cents: 60650 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: AccountManager }
            - { call: "POST /purchase-orders", payload: { order_line_id: "${line_id}", supplier_id: "${sup_id}", ordered_blank_qty: 210, production_start: "2026-05-05T00:00:00Z", production_end: "2026-05-08T00:00:00Z" }, as: AccountManager, captures: { po_id: "$.data.id" } }
          trigger:
            - { call: "POST /purchase-orders", payload: { order_line_id: "${line_id}", supplier_id: "${sup_id}", ordered_blank_qty: 210, production_start: "2026-05-05T00:00:00Z", production_end: "2026-05-08T00:00:00Z" }, as: AccountManager, captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_PO_ALREADY_EXISTS"

  # ------------------------------------------------------ consistency model
  - section: consistency_model
    instances:
      - name: list_orders_returns_pagination_envelope
        claim_type: immediate
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /orders returns response_type=array with pagination fields limit/offset/total_count/has_more; a just-created order is immediately visible."
        test_recipe:
          setup: ["One customer with one order."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "GET /orders", payload: { customer_id: "${cust_id}", limit: 10, offset: 0 }, as: AccountManager }
          assert:
            - "response_type == array; meta.total_count == 1; meta.has_more == false"
            - "the array contains the order ${ord_id}"

  # ------------------------------------------------ excluded (covered by §1.8)
  - section: state_machines
    instances:
      - name: station_double_booking_excluded
        claim_type: guarded transitions
        grounds: [calculations.station_schedule_overlap]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / station_double_booking_halfopen_overlap
          rationale: "Station pairwise overlap rejection is the trigger of the named §1.8 instance."
      - name: order_cancel_cascade_excluded
        claim_type: Cascade down
        grounds: [state_machines.Order.CONFIRMED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / order_cancel_line_po_supplier
          rationale: "Cancel cascade to lines/POs/supplier is exercised end-to-end by the named §1.8 instance."

  - section: calculations
    instances:
      - name: order_dual_variant_excluded
        claim_type: Variant Divergence
        grounds: [calculations.order_total]
        excluded_because:
          difficulty_instance: dual_variant_calc / order_quote_vs_final_total
          rationale: "Quoted vs final total divergence is asserted by the named §1.8 instance."
      - name: blank_cost_dual_variant_excluded
        claim_type: Variant Divergence
        grounds: [calculations.blank_cost]
        excluded_because:
          difficulty_instance: dual_variant_calc / blank_estimated_vs_actual_cost
          rationale: "Estimated vs actual blank cost divergence is asserted by the named §1.8 instance."
      - name: supplier_capacity_excluded
        claim_type: Constants Applied
        grounds: [calculations.supplier_capacity_load]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / supplier_capacity_aggregate_overlap
          rationale: "Aggregate supplier capacity rejection is the trigger of the named §1.8 instance."
