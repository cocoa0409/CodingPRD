            - { call: "POST /api/revenue-reports", payload: { label_id: "${label_id}", distributor_id: "${dist_id}", release_id: "${rel_id}", period: "2026-Q3", channel: "DOWNLOAD", units: 1, gross_revenue_cents: 100 }, as: FinanceController }
