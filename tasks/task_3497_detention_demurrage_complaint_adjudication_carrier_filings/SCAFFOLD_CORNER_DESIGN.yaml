            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-LATE", charge_basis: "TARIFF", tariff_id: "${t_id}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU9200003", port_code: "USNYC", availability_date: "2026-08-28T00:00:00Z", return_date: "2026-09-01T00:00:00Z", last_accrual_date: "2026-09-01T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err_late: $.data.error_id }
          assert:
            - "at exactly last_accrual + 30 days: 201 and Invoice.${inv_ok}.invoice_status == ISSUED"
            - "one second past: 422 ERR_LATE_INVOICE_ISSUANCE"

      - name: appeal_at_exact_deadline_accepted_one_second_late_rejected
        claim_type: Violation → Error
        grounds:
