  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: bid_evaluation_score_weighted_components
        claim_type: correct_result
        grounds:
          - "calculations.bid_evaluation_score"
        distinguishing_aspect: "Weighted score computed with constants 0.6/0.25/0.15: bid A (ce 25000, exp 10) scores 0.825 and bid B (ce 30000, exp 20) scores 1.0 after normalization against max 30000 — both recomputed when the second bid enters the eligible set."
        test_recipe:
          setup: ["OPEN offering; two APPROVED tenants (exp 10 and 20, score 100 each) submit bids of ce 25000 and 30000"]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Sc", contact_email: "lsc@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T ScA", years_experience: 10 }
              as: FarmManager
              captures:
                tnA: "$.data.id"
            - call: "POST /tenants/${tnA}/approve"
              as: FarmManager
            - call: "POST /tenants"
              payload: { name: "T ScB", years_experience: 20 }
              as: FarmManager
              captures:
                tnB: "$.data.id"
            - call: "POST /tenants/${tnB}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "FSc", acres: 100, soil_csr2: 80 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
          trigger:
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "CASH", cash_bid_per_acre_cents: 25000, cash_equivalent_bid_cents_per_acre: 25000 }
              as: Tenant
              as_user_id: "${tnA}"
              captures:
                bidA: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "CASH", cash_bid_per_acre_cents: 30000, cash_equivalent_bid_cents_per_acre: 30000 }
              as: Tenant
              as_user_id: "${tnB}"
              captures:
                bidB: "$.data.id"
            - call: "GET /bids?offering_id=${off}"
              as: FarmManager
              captures:
                sA: "$.data[0].evaluation_score"
                sB: "$.data[1].evaluation_score"
          assert:
            - "bid A (earlier created_at) evaluation_score == 0.825 (0.6*(25000/30000) + 0.25*1.0 + 0.15*0.5)"
            - "bid B evaluation_score == 1.0 (0.6*1.0 + 0.25 + 0.15*(20/20))"
            - "offering ${off}.eligible_bid_count == 2"

      - name: bid_revision_recomputes_offering_scores
        claim_type: correct_result
        grounds:
          - "calculations.bid_evaluation_score"
          - "endpoints: PATCH /bids/{bidId}"
        distinguishing_aspect: "Revising bid B's cash-equivalent from 26000 to 24000 changes the normalization max and recomputes BOTH eligible bids' scores: A rises 0.9769 -> 1.0 and B falls 1.0 -> 0.976 (derived-field reconciliation across the offering)."
        test_recipe:
          setup: ["OPEN offering; bids A (ce 25000, exp 20) and B (ce 26000, exp 20) both SUBMITTED; initial scores 0.9769 and 1.0"]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Rv", contact_email: "lrv@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T RvA", years_experience: 20 }
              as: FarmManager
              captures:
                tnA: "$.data.id"
            - call: "POST /tenants/${tnA}/approve"
              as: FarmManager
            - call: "POST /tenants"
              payload: { name: "T RvB", years_experience: 20 }
              as: FarmManager
              captures:
                tnB: "$.data.id"
            - call: "POST /tenants/${tnB}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "FRv", acres: 100, soil_csr2: 80 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "CASH", cash_bid_per_acre_cents: 25000, cash_equivalent_bid_cents_per_acre: 25000 }
              as: Tenant
              as_user_id: "${tnA}"
              captures:
                bidA: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "CASH", cash_bid_per_acre_cents: 26000, cash_equivalent_bid_cents_per_acre: 26000 }
              as: Tenant
              as_user_id: "${tnB}"
              captures:
                bidB: "$.data.id"
                bv: "$.data.version"
          trigger:
            - call: "PATCH /bids/${bidB}"
              payload: { expected_bid_version: "${bv}", cash_bid_per_acre_cents: 24000, cash_equivalent_bid_cents_per_acre: 24000 }
              as: Tenant
              as_user_id: "${tnB}"
            - call: "GET /bids?offering_id=${off}"
              as: FarmManager
              captures:
                sA: "$.data[0].evaluation_score"
                sB: "$.data[1].evaluation_score"
          assert:
            - "before revision: A == 0.9769 (0.6*(25000/26000)+0.4 rounded to 4dp), B == 1.0"
            - "after revision: A == 1.0 (now the max) and B == 0.976 (0.6*(24000/25000) + 0.4)"
            - "bid ${bidB}.version incremented by 1"

