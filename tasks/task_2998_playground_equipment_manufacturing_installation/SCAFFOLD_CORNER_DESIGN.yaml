      - name: quote_variant_input_set_selection_is_covered_by_the_difficulty_design
        claim_type: variant_selection
        grounds:
          - calculations.quote_pricing.variants
          - entities.Quote.fields.variant
        distinguishing_aspect: "PROVISIONAL prices DRAFT and VALIDATED placements while FIRM prices only VALIDATED ones, so on a mixed set the two variants see different input sets and different priced_unit_count values."
        excluded_because:
          difficulty_instance: quote_provisional_vs_firm_diverge_on_same_placement_set
          rationale: "That dual_variant_calc instance already issues both variants over the same project and asserts each variant's input set, subtotal, priced_unit_count and the resulting divergence."

      - name: quote_rounding_order_precision_is_covered_by_the_difficulty_design
        claim_type: variant_divergence
        grounds:
          - calculations.quote_pricing.precision
          - calculations.quote_pricing.variants
        distinguishing_aspect: "On three lines whose exact amounts each end in .5, PROVISIONAL (round per line, then sum) yields a subtotal exactly one cent above FIRM (sum exactly, then round once): 333895 vs 333894."
        excluded_because:
          difficulty_instance: quote_rounding_order_pinned_per_line_for_provisional_and_end_for_firm
          rationale: "That combinatorial_formula instance already pins both rounding orders on the identical three-line VALIDATED set and asserts the one-cent divergence together with both totals."

      - name: warranty_coverage_variant_divergence_is_covered_by_the_difficulty_design
        claim_type: decay_function
        grounds:
          - calculations.warranty_coverage
          - calculations.warranty_coverage.variants
        distinguishing_aspect: "At elapsed_years 3 on a 10-year 215450-cent model, PRORATED covers 70% (150815) while STEP still covers 100% (215450) - identical inputs, divergent coverage curves."
        excluded_because:
          difficulty_instance: warranty_prorated_vs_step_diverge_on_identical_claim_inputs
          rationale: "That dual_variant_calc instance already files both claims from one installed project and asserts elapsed_years, coverage_variant, covered_pct and reimbursement_cents for each category."

      - name: surfacing_depth_nested_uplift_maximum_is_covered_by_the_difficulty_design
        claim_type: correct_result
        grounds:
          - calculations.surfacing_depth_requirement
          - entities.PlayArea.fields.required_surfacing_depth_cm
        distinguishing_aspect: "The toddler and clay uplifts are applied to the base independently and the requirement is the maximum of the candidates (28 for EWF/122/TODDLER/CLAY), not the sum (31)."
        excluded_because:
          difficulty_instance: surfacing_depth_nested_max_over_tier_age_and_soil_uplifts
          rationale: "That combinatorial_formula instance already walks the material tiers, both uplifts and the absolute minimum across four play areas and asserts every required_surfacing_depth_cm."

      - name: retrofit_handling_waiver_threshold_is_covered_by_the_difficulty_design
        claim_type: threshold
        grounds:
          - calculations.replacement_retrofit_pricing
          - calculations.replacement_retrofit_pricing.constants.FREE_HANDLING_LINE_THRESHOLD_CENTS
        distinguishing_aspect: "The waiver is decided on line_cents before handling is added: a 247000 line still pays 3500 handling (total 250500) while a line of exactly 250000 waives it."
        excluded_because:
          difficulty_instance: retrofit_handling_waiver_evaluated_on_line_not_total
          rationale: "That combinatorial_formula instance already tests the threshold at 247000, exactly 250000 and above, including the LEGACY surcharge interaction."

