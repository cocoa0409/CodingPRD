# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Rack Jobber & Consignment Retail Program — 20 instances across 9 rules.
# All money in integer cents; logical clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_shrink_basis
        grounds: [calculations.settlement_net_payable, state_machines.SettlementStatement.PROVISIONAL_to_FINALIZED, entities.SettlementStatement.fields.variant_used]
        distinguishing_aspect: |
          Entity domain SettlementStatement (finance): identical scans/audits produce
          net_payable 147000 under the PROVISIONAL variant (estimated_shrink_rate 0.02
          -> 20 units * cost 100 * share 0.5 = 1000) vs 146500 under the FINAL variant
          (certified audit chargeable 10 units -> 500) — a 500-cent divergence pinned
          to the variant switch at finalize.
        test_recipe:
          setup:
            - "Agreement (est shrink rate 0.02, cap 200000) ACTIVE with directive price 200, cost 100"
            - "Restock 1050 confirmed (on_hand 1050, delivered 1050); one SALE of 1000 units at 2026-08-01T10:00:00Z"
            - "Audit certified: book 50, counted 30 -> variance 20, allowance 10, chargeable 10, retailer charge 500; ratio 20/1050 < 0.02 stays ACTIVE"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "SnackRack National" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "ValueMart 12", store_code: "VM012", total_facings: 100 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 200000, estimated_shrink_rate: 0.02 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "CHIP-001", name: "Tortilla Chips", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin }
            - { call: "POST /routes", payload: { program_id: "${prog}", name: "Route 1", assigned_driver_id: "drv-1" }, as: JobberAdmin, captures: { route: "$.data.id" } }
            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agr}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { visit: "$.data.id" } }
            - { call: "POST /service-visits/${visit}/check-in", payload: {}, as: RouteDriver, as_user_id: "drv-1" }
            - { call: "POST /service-visits/${visit}/submit-counts", payload: { lines: [ { product_id: "${prod}", counted_units: 0, restock_units: 1050 } ] }, as: RouteDriver, as_user_id: "drv-1" }
            - { call: "POST /service-visits/${visit}/confirm", payload: {}, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "SALE", quantity: 1000, scanned_at: "2026-08-01T10:00:00Z", client_event_id: "s-1" }, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /audit-counts", payload: { store_agreement_id: "${agr}", scope: "FULL" }, as: JobberAdmin, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-counts/${aud}/start", payload: {}, as: FieldAuditor, as_user_id: "aud-1" }
            - { call: "POST /audit-counts/${aud}/submit", payload: { counted_lines: [ { product_id: "${prod}", counted_units: 30 } ] }, as: FieldAuditor, as_user_id: "aud-1" }
            - { call: "GET /audit-counts/${aud}", payload: {}, as: JobberAdmin, captures: { aud_v: "$.data.version" } }
            - { call: "POST /audit-counts/${aud}/certify", payload: { expected_audit_count_version: "${aud_v}" }, as: JobberAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /settlement-statements", payload: { store_agreement_id: "${agr}", period_index: 0 }, as: JobberFinance, as_user_id: "fin-1", captures: { stmt: "$.data.id", stmt_v: "$.data.version", prov_payable: "$.data.net_payable_to_jobber_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /settlement-statements/${stmt}/finalize", payload: { expected_settlement_statement_version: "${stmt_v}" }, as: JobberFinance, as_user_id: "fin-1", captures: { fin_payable: "$.data.net_payable_to_jobber_cents" } }
            - { call: "GET /audit-counts/${aud}", payload: {}, as: JobberAdmin, captures: { aud_charge: "$.data.retailer_charge_cents" } }
          assert:
            - "SettlementStatement.${stmt} at generate: variant_used == PROVISIONAL, gross_scanned_sales_cents == 200000, retailer_margin_cents == 54000 (tier2: 200000 >= 200000 -> 0.27), shrink_retailer_charge_cents == 1000, net_payable_to_jobber_cents == 147000"
            - "SettlementStatement.${stmt} after finalize: variant_used == FINAL, shrink_retailer_charge_cents == 500, net_payable_to_jobber_cents == 146500"
            - "147000 != 146500 — provisional and final variants diverge by exactly 500 on identical scan data"
            - "AuditCount.${aud}.retailer_charge_cents == 500 (chargeable 10 * cost 100 * share 0.5)"

      - name: audit_valuation_jobber_cost_vs_blended_retail
        grounds: [calculations.audit_variance_valuation, calculations.shrink_allocation, entities.StoreAgreement.fields.shrink_valuation_mode]
        distinguishing_aspect: |
          Entity domain AuditCount (inventory valuation) — a different domain than
          SettlementStatement: two agreements differing only in shrink_valuation_mode
          produce retailer_charge 500 (JOBBER_COST, unit 100) vs 700 (BLENDED_RETAIL,
          unit round(0.6*100 + 0.4*200) = 140) for identical count data (variance 10,
          allowance 0).
        test_recipe:
          setup:
            - "One program, two stores, two ACTIVE agreements: A1 JOBBER_COST, A2 BLENDED_RETAIL (both shrink_suspend_ratio 0.5, cap 50000)"
            - "Both: product cost 100, directive 200, restock 100 confirmed, audit counted 90 -> variance 10, allowance 0, chargeable 10"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "HomeEssentials" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "Store North", store_code: "STN", total_facings: 80 }, as: JobberAdmin, captures: { store1: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "Store South", store_code: "STS", total_facings: 80 }, as: JobberAdmin, captures: { store2: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store1}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000, shrink_suspend_ratio: 0.5, shrink_valuation_mode: "JOBBER_COST" }, as: JobberAdmin, captures: { agr1: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store2}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000, shrink_suspend_ratio: 0.5, shrink_valuation_mode: "BLENDED_RETAIL" }, as: JobberAdmin, captures: { agr2: "$.data.id" } }
            - { call: "POST /agreements/${agr1}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr1}/accept", payload: {}, as: RetailerManager, as_user_id: "${store1}", captures: { agr1_v: "$.data.version" } }
            - { call: "POST /agreements/${agr2}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr2}/accept", payload: {}, as: RetailerManager, as_user_id: "${store2}", captures: { agr2_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "MOP-001", name: "Spray Mop", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 10 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr1}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr1_v}" }, as: JobberAdmin }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr2}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr2_v}" }, as: JobberAdmin }
            - { call: "POST /routes", payload: { program_id: "${prog}", name: "Route A", assigned_driver_id: "drv-1" }, as: JobberAdmin, captures: { route: "$.data.id" } }
            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agr1}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { v1: "$.data.id" } }
            - { call: "POST /service-visits/${v1}/check-in", payload: {}, as: RouteDriver, as_user_id: "drv-1" }
            - { call: "POST /service-visits/${v1}/submit-counts", payload: { lines: [ { product_id: "${prod}", counted_units: 0, restock_units: 100 } ] }, as: RouteDriver, as_user_id: "drv-1" }
            - { call: "POST /service-visits/${v1}/confirm", payload: {}, as: RetailerManager, as_user_id: "${store1}" }
            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agr2}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { v2: "$.data.id" } }
            - { call: "POST /service-visits/${v2}/check-in", payload: {}, as: RouteDriver, as_user_id: "drv-1" }
            - { call: "POST /service-visits/${v2}/submit-counts", payload: { lines: [ { product_id: "${prod}", counted_units: 0, restock_units: 100 } ] }, as: RouteDriver, as_user_id: "drv-1" }
            - { call: "POST /service-visits/${v2}/confirm", payload: {}, as: RetailerManager, as_user_id: "${store2}" }
            - { call: "POST /audit-counts", payload: { store_agreement_id: "${agr1}", scope: "FULL" }, as: JobberAdmin, captures: { aud1: "$.data.id" } }
            - { call: "POST /audit-counts/${aud1}/start", payload: {}, as: FieldAuditor, as_user_id: "aud-1" }
            - { call: "POST /audit-counts/${aud1}/submit", payload: { counted_lines: [ { product_id: "${prod}", counted_units: 90 } ] }, as: FieldAuditor, as_user_id: "aud-1" }
            - { call: "GET /audit-counts/${aud1}", payload: {}, as: JobberAdmin, captures: { aud1_v: "$.data.version" } }
            - { call: "POST /audit-counts/${aud1}/certify", payload: { expected_audit_count_version: "${aud1_v}" }, as: JobberAdmin, as_user_id: "admin-1" }
            - { call: "POST /audit-counts", payload: { store_agreement_id: "${agr2}", scope: "FULL" }, as: JobberAdmin, captures: { aud2: "$.data.id" } }
            - { call: "POST /audit-counts/${aud2}/start", payload: {}, as: FieldAuditor, as_user_id: "aud-1" }
            - { call: "POST /audit-counts/${aud2}/submit", payload: { counted_lines: [ { product_id: "${prod}", counted_units: 90 } ] }, as: FieldAuditor, as_user_id: "aud-1" }
            - { call: "GET /audit-counts/${aud2}", payload: {}, as: JobberAdmin, captures: { aud2_v: "$.data.version" } }
            - { call: "POST /audit-counts/${aud2}/certify", payload: { expected_audit_count_version: "${aud2_v}" }, as: JobberAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "GET /audit-counts/${aud1}", payload: {}, as: JobberAdmin }
            - { call: "GET /audit-counts/${aud2}", payload: {}, as: JobberAdmin }
          assert:
            - "AuditCount.${aud1}: valuation_unit_cents == 100, variance_value_cents == 1000, retailer_charge_cents == 500"
            - "AuditCount.${aud2}: valuation_unit_cents == 140, variance_value_cents == 1400, retailer_charge_cents == 700"
            - "500 != 700 — identical counts, different valuation variants selected by agreement.shrink_valuation_mode"

  - rule_id: combinatorial_formula
    instances:
      - name: margin_tier_drag_clamp_combinatorial
        grounds: [calculations.retailer_margin_split, entities.SettlementStatement.fields.margin_pct]
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: tiered uplift selected by
          net_sales (115200 -> tier1 +0.01), promo_share 0.40 > 0.30 triggers -0.01
          drag, result clamped inside [min 0.15, max 0.40]; margin_pct resolves to
          exactly 0.25 and margin to 28800 on net 115200.
        test_recipe:
          setup:
            - "ACTIVE agreement with default tiers (100000/+0.01, 200000/+0.02, base 0.25), est shrink 0"
            - "Directive price 200; promo depth 0.10 ACTIVE for [2026-08-01, 2026-08-05]"
            - "Scans: 240 units at 2026-08-02 (promo price 180) + 360 units at 2026-08-06 (full price 200) -> gross 115200, promo share 240/600 = 0.40"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "SnackRack Promo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "ValueMart 7", store_code: "VM007", total_facings: 100 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000, estimated_shrink_rate: 0.0 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "POP-001", name: "Microwave Popcorn", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin }
            - { call: "POST /promotions", payload: { program_id: "${prog}", product_id: "${prod}", name: "Kickoff 10pct", depth_pct: 0.10, jobber_funding_pct: 0.5, start_date: "2026-08-01", end_date: "2026-08-05" }, as: JobberAdmin, captures: { promo: "$.data.id" } }
            - { call: "POST /promotions/${promo}/schedule", payload: {}, as: JobberAdmin }
            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "SALE", quantity: 240, scanned_at: "2026-08-02T10:00:00Z", client_event_id: "s-promo" }, as: RetailerManager, as_user_id: "${store}", captures: { promo_price: "$.data.unit_price_cents" } }
            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "SALE", quantity: 360, scanned_at: "2026-08-06T10:00:00Z", client_event_id: "s-regular" }, as: RetailerManager, as_user_id: "${store}", captures: { reg_price: "$.data.unit_price_cents" } }
          trigger:
            - { call: "POST /settlement-statements", payload: { store_agreement_id: "${agr}", period_index: 0 }, as: JobberFinance, as_user_id: "fin-1", captures: { stmt: "$.data.id" } }
          assert:
            - "promo scan unit_price_cents == 180 (round_half_up(200 * 0.9)); regular scan == 200"
            - "SettlementStatement.${stmt}: gross_scanned_sales_cents == 115200, scanned_units == 600, promo_scan_units == 240"
            - "margin_pct == 0.25 (base 0.25 + tier1 0.01 since 115200 >= 100000, - promo_drag 0.01 since 240/600 = 0.40 > 0.30)"
            - "retailer_margin_cents == 28800; net_payable_to_jobber_cents == 86400"
            - "promo_jobber_funding_cents == 2400 (round(20 * 240 * 0.5))"

      - name: promo_funding_per_line_then_sum_rounding
        grounds: [calculations.promo_funding_split, entities.ScanEvent.fields.jobber_funding_cents]
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: per-line round_half_up of the jobber
          share THEN sum. Price 101, depth 0.25 -> scan price 76, discount 25; two
          qty-1 lines: pinned order yields 13 + 13 = 26; the forbidden sum-then-round
          order yields round(25.25) = 25.
        test_recipe:
          setup:
            - "ACTIVE agreement; product cost 60 floor 100; directive price 101; promo depth 0.25 funding 0.5 ACTIVE [2026-08-01, 2026-08-05]"
            - "Two separate qty-1 SALE scans at 2026-08-02"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "ValueLine" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "CornerMart", store_code: "CM1", total_facings: 60 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "GUM-001", name: "Mint Gum", jobber_cost_cents: 60, min_retail_cents: 100, units_per_facing: 20 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 101, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin }
            - { call: "POST /promotions", payload: { program_id: "${prog}", product_id: "${prod}", name: "Quarter Off", depth_pct: 0.25, jobber_funding_pct: 0.5, start_date: "2026-08-01", end_date: "2026-08-05" }, as: JobberAdmin, captures: { promo: "$.data.id" } }
            - { call: "POST /promotions/${promo}/schedule", payload: {}, as: JobberAdmin }
            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "SALE", quantity: 1, scanned_at: "2026-08-02T09:00:00Z", client_event_id: "s-a" }, as: RetailerManager, as_user_id: "${store}", captures: { fund_a: "$.data.jobber_funding_cents" } }
            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "SALE", quantity: 1, scanned_at: "2026-08-02T09:05:00Z", client_event_id: "s-b" }, as: RetailerManager, as_user_id: "${store}", captures: { fund_b: "$.data.jobber_funding_cents" } }
          trigger:
            - { call: "POST /settlement-statements", payload: { store_agreement_id: "${agr}", period_index: 0 }, as: JobberFinance, as_user_id: "fin-1", captures: { stmt: "$.data.id" } }
          assert:
            - "each scan: unit_price_cents == 76 (round_half_up(101 * 0.75)), jobber_funding_cents == 13 (round_half_up(25 * 1 * 0.5) with 12.5 rounding UP)"
            - "SettlementStatement.${stmt}.promo_jobber_funding_cents == 26 — NOT 25 (sum-then-round of raw 25.25 is the forbidden order)"
            - "gross_scanned_sales_cents == 152"

      - name: settlement_eval_order_net_sales_before_tier
        grounds: [calculations.settlement_net_payable, calculations.retailer_margin_split, entities.SettlementStatement.fields.net_sales_cents]
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the
          markdown cap is keyed on GROSS (step 4) while the margin tier is keyed on
          NET (step 5/6). Gross 200000 would select tier2 (0.27); pinned order nets
          the 10-cent markdown credit first -> 199990 selects tier1 (0.26), margin
          51997, payable 147993. Different mode than (a) and (b) instances.
        test_recipe:
          setup:
            - "ACTIVE agreement (default tiers, est shrink 0); directive 200; SALE 1000 units -> gross 200000"
            - "MARKDOWN auth (units 2, markdown_price 190, SHARED 0.5) approved+applied in period -> raw credit 10, cap round(0.08 * 200000) = 16000 -> credit 10"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "TierTest" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "MegaMart", store_code: "MM1", total_facings: 200 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000, estimated_shrink_rate: 0.0, markdown_liability: "SHARED", markdown_jobber_share_pct: 0.5 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "SODA-001", name: "Cola 2L", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin }
            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "SALE", quantity: 1000, scanned_at: "2026-08-01T10:00:00Z", client_event_id: "s-big" }, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /markdown-authorizations", payload: { store_agreement_id: "${agr}", product_id: "${prod}", auth_type: "MARKDOWN", units: 2, markdown_price_cents: 190 }, as: JobberAdmin, captures: { md: "$.data.id" } }
