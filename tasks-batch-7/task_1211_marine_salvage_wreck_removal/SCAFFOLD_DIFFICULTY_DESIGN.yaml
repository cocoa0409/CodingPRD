# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1211 Marine Salvage & Wreck Removal. 9 rules x >=2 instances = 19.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: award_provisional_flat_vs_final_tiered_enhanced
        grounds:
          - calculations.salvage_award_provisional
          - calculations.salvage_award_final
          - entities.SalvageContract.fields.provisional_award_cents
          - entities.SalvageAward.fields.computed_amount_cents
        distinguishing_aspect: |
          Entity domain = commercial salvage AWARD money. Provisional (flat 12% of
          DECLARED value at sign) yields 96,000,000 while final (tiered 10/8/6% of
          VERIFIED value with SUNK+TIER_2 enhancement 1.25) yields 75,000,000 on
          identical declared==verified 800,000,000 input — two valid algorithms,
          different results, on the award domain (contrast: exposure instance is
          the environmental-liability domain).
        test_recipe:
          setup:
            - "Casualty SUNK, declared 800,000,000; assessment TIER_1 APPROVED; plan REFLOAT/TUG APPROVED; NCNP contract with SCOPIC signed then ACTIVE (security exactly 120,000,000 lodged)"
            - "REFLOAT phase COMPLETE (contract PERFORMANCE_COMPLETE); one TIER_2 OIL_PERSISTENT event recorded"
            - "Two lots VALUE_VERIFIED: 500,000,000 + 300,000,000 (total verified 800,000,000)"
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Kara", casualty_type: SUNK, declared_salved_value_cents: 800000000, position: "32N 64W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 5000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: true }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /securities", payload: { contract_id: "${ct_id}", lodged_amount_cents: 120000000 }, as: ContractsOfficer, as_user_id: "co-01", captures: { sec_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/activate", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /equipment-assets", payload: { asset_class: TUG, day_rate_cents: 2000000, max_hs_meters: 2.50 }, as: OperationsDirector, as_user_id: "opsdir-01", captures: { eq_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /charters", payload: { casualty_id: "${cas_id}", equipment_asset_id: "${eq_id}", window_start: "2026-05-10T00:00:00Z", window_end: "2026-05-24T00:00:00Z", purpose: SALVAGE }, as: SalvageMaster, as_user_id: "sm-01", captures: { ch_id: $.data.id } }
            - { call: "POST /charters/${ch_id}/on-hire", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /weather-windows", payload: { casualty_id: "${cas_id}", window_start: "2026-05-08T00:00:00Z", window_end: "2026-05-26T00:00:00Z", forecast_hs_meters: 2.00 }, as: SalvageMaster, as_user_id: "sm-01", captures: { ww_id: $.data.id } }
            - { call: "POST /permits", payload: { casualty_id: "${cas_id}", agency_type: COAST_GUARD, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T00:00:00Z" }, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { pm_id: $.data.id } }
            - { call: "POST /permits/${pm_id}/grant", payload: {}, as: EnvironmentalOfficer, as_user_id: "env-01" }
            - { call: "POST /phases", payload: { contract_id: "${ct_id}", phase_type: REFLOAT, planned_duration_hours: 336 }, as: SalvageMaster, as_user_id: "sm-01", captures: { ph_id: $.data.id } }
            - { call: "POST /phases/${ph_id}/activate", payload: { weather_window_id: "${ww_id}", charter_ids: ["${ch_id}"] }, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /phases/${ph_id}/complete", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /pollution-events", payload: { casualty_id: "${cas_id}", pollutant_class: OIL_PERSISTENT, tier: TIER_2, est_volume_m3: 40 }, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { ev_id: $.data.id } }
            - { call: "POST /storage-sites", payload: { name: "Yard A", capacity_tonnes: 10000 }, as: OperationsDirector, as_user_id: "opsdir-01", captures: { site_id: $.data.id } }
            - { call: "POST /properties", payload: { casualty_id: "${cas_id}", property_type: CARGO, quantity_tonnes: 500, declared_value_cents: 500000000 }, as: SalvageMaster, as_user_id: "sm-01", captures: { lot1: $.data.id } }
            - { call: "POST /properties/${lot1}/secure-ashore", payload: { storage_site_id: "${site_id}" }, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /properties/${lot1}/survey", payload: { verified_value_cents: 500000000 }, as: MarineSurveyor, as_user_id: "surveyor-02" }
            - { call: "POST /properties/${lot1}/verify-value", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /properties", payload: { casualty_id: "${cas_id}", property_type: VESSEL_HULL, quantity_tonnes: 900, declared_value_cents: 300000000 }, as: SalvageMaster, as_user_id: "sm-01", captures: { lot2: $.data.id } }
            - { call: "POST /properties/${lot2}/secure-ashore", payload: { storage_site_id: "${site_id}" }, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /properties/${lot2}/survey", payload: { verified_value_cents: 300000000 }, as: MarineSurveyor, as_user_id: "surveyor-02" }
            - { call: "POST /properties/${lot2}/verify-value", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
          trigger:
            - { call: "POST /contracts/${ct_id}/award", payload: {}, as: ContractsOfficer, as_user_id: "co-01", captures: { aw_computed: $.data.computed_amount_cents } }
          assert:
            - "SalvageContract.${ct_id}.provisional_award_cents == 96000000 (flat 12% of declared 800000000 at sign)"
            - "SalvageContract.${ct_id}.security_required_cents == 120000000 (96,000,000 x 1.25)"
            - "SalvageAward.computed_amount_cents == 75000000 (tiered base 60,000,000 x enhancement 1.25 = SUNK 0.15 + TIER_2 0.10)"
            - "96000000 != 75000000: provisional and final diverge on identical declared==verified data"
            - "SalvageAward.status == COMPUTED"

      - name: exposure_tariff_booked_vs_actual_verified
        grounds:
          - calculations.special_compensation
          - entities.PollutionEvent.fields.provisional_exposure_cents
          - entities.PollutionEvent.fields.final_exposure_cents
        distinguishing_aspect: |
          Entity domain = ENVIRONMENTAL LIABILITY on PollutionEvent (not award
          money). Tariff variant uses booked days at uplifted day rates
          (25,000,000); actual variant uses off-hire verified costs times the
          OIL_PERSISTENT 1.5 multiplier (24,000,000) — same response charter set,
          different results, in a different entity domain than the award instance.
        test_recipe:
          setup:
            - "Casualty GROUNDING declared 800,000,000; NCNP contract ACTIVE (security 120,000,000); plan requires [TUG, OIL_RESPONSE]"
            - "TIER_2 OIL_PERSISTENT event open; OIL_RESPONSE charter booked 2026-05-11 -> 2026-05-21 (10 days) at 2,000,000/day, then ON_HIRE"
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MT Lir", casualty_type: GROUNDING, declared_salved_value_cents: 800000000, position: "51N 2E" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 5000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG, OIL_RESPONSE] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: true }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /securities", payload: { contract_id: "${ct_id}", lodged_amount_cents: 120000000 }, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/activate", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /equipment-assets", payload: { asset_class: OIL_RESPONSE, day_rate_cents: 2000000, max_hs_meters: 3.00 }, as: OperationsDirector, as_user_id: "opsdir-01", captures: { eq_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /pollution-events", payload: { casualty_id: "${cas_id}", pollutant_class: OIL_PERSISTENT, tier: TIER_2, est_volume_m3: 15 }, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { ev_id: $.data.id } }
            - { call: "POST /charters", payload: { casualty_id: "${cas_id}", equipment_asset_id: "${eq_id}", window_start: "2026-05-11T00:00:00Z", window_end: "2026-05-21T00:00:00Z", purpose: POLLUTION_RESPONSE, pollution_event_id: "${ev_id}" }, as: SalvageMaster, as_user_id: "sm-01", captures: { rc_id: $.data.id } }
            - { call: "POST /charters/${rc_id}/on-hire", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-19T00:00:00Z" }, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /charters/${rc_id}/off-hire", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /pollution-events/${ev_id}/contain", payload: {}, as: EnvironmentalOfficer, as_user_id: "env-01" }
          trigger:
            - { call: "POST /pollution-events/${ev_id}/verify-clean", payload: {}, as: EnvironmentalOfficer, as_user_id: "env-01" }
          assert:
            - "PollutionEvent.${ev_id}.provisional_exposure_cents == 25000000 (tariff 2,500,000 x 10 booked days)"
            - "PollutionEvent.${ev_id}.final_exposure_cents == 24000000 (actual 16,000,000 x OIL_PERSISTENT 1.5)"
            - "EquipmentCharter.${rc_id}.total_cost_cents == 16000000 (8 active days x 2,000,000)"
            - "25000000 != 24000000: tariff and actual variants diverge for the same response charter"
            - "PollutionEvent.${ev_id}.special_compensation_payable_cents == 24000000 (no award computed yet, payable un-netted)"

  - rule_id: combinatorial_formula
    instances:
      - name: article13_tier_straddle_with_conditional_enhancement
        grounds:
          - calculations.salvage_award_final
          - entities.SalvageAward.fields.computed_amount_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — tiered base with
          nested min/max over T1_CAP/T2_CAP (verified 600,000,000 straddles all
          three tiers), multiplied by conditional branches on casualty_type
          (COLLISION 0.08) and pollution tier (TIER_1 0.05), then min-capped
          against verified value: result 54,240,000.
        test_recipe:
          setup:
            - "Casualty COLLISION declared 600,000,000; NCNP contract ACTIVE (security 90,000,000); TOWAGE phase COMPLETE; one TIER_1 DEBRIS event"
            - "One lot VALUE_VERIFIED at 600,000,000"
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "SV Norr", casualty_type: COLLISION, declared_salved_value_cents: 600000000, position: "58N 11E" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 4000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: TOWAGE, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: false }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /securities", payload: { contract_id: "${ct_id}", lodged_amount_cents: 90000000 }, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/activate", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /equipment-assets", payload: { asset_class: TUG, day_rate_cents: 1500000, max_hs_meters: 3.00 }, as: OperationsDirector, as_user_id: "opsdir-01", captures: { eq_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /charters", payload: { casualty_id: "${cas_id}", equipment_asset_id: "${eq_id}", window_start: "2026-05-10T00:00:00Z", window_end: "2026-05-17T00:00:00Z", purpose: SALVAGE }, as: SalvageMaster, as_user_id: "sm-01", captures: { ch_id: $.data.id } }
            - { call: "POST /charters/${ch_id}/on-hire", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /weather-windows", payload: { casualty_id: "${cas_id}", window_start: "2026-05-08T00:00:00Z", window_end: "2026-05-26T00:00:00Z", forecast_hs_meters: 1.50 }, as: SalvageMaster, as_user_id: "sm-01", captures: { ww_id: $.data.id } }
            - { call: "POST /permits", payload: { casualty_id: "${cas_id}", agency_type: COAST_GUARD, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T00:00:00Z" }, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { pm_id: $.data.id } }
            - { call: "POST /permits/${pm_id}/grant", payload: {}, as: EnvironmentalOfficer, as_user_id: "env-01" }
            - { call: "POST /phases", payload: { contract_id: "${ct_id}", phase_type: TOWAGE, planned_duration_hours: 168 }, as: SalvageMaster, as_user_id: "sm-01", captures: { ph_id: $.data.id } }
            - { call: "POST /phases/${ph_id}/activate", payload: { weather_window_id: "${ww_id}", charter_ids: ["${ch_id}"] }, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /phases/${ph_id}/complete", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /pollution-events", payload: { casualty_id: "${cas_id}", pollutant_class: DEBRIS, tier: TIER_1, est_volume_m3: 5 }, as: EnvironmentalOfficer, as_user_id: "env-01" }
            - { call: "POST /storage-sites", payload: { name: "Yard B", capacity_tonnes: 5000 }, as: OperationsDirector, as_user_id: "opsdir-01", captures: { site_id: $.data.id } }
            - { call: "POST /properties", payload: { casualty_id: "${cas_id}", property_type: CARGO, quantity_tonnes: 400, declared_value_cents: 600000000 }, as: SalvageMaster, as_user_id: "sm-01", captures: { lot1: $.data.id } }
            - { call: "POST /properties/${lot1}/secure-ashore", payload: { storage_site_id: "${site_id}" }, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /properties/${lot1}/survey", payload: { verified_value_cents: 600000000 }, as: MarineSurveyor, as_user_id: "surveyor-02" }
            - { call: "POST /properties/${lot1}/verify-value", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
          trigger:
            - { call: "POST /contracts/${ct_id}/award", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
          assert:
            - "SalvageAward.computed_amount_cents == 54240000 (tier base 48,000,000 = 10M + 32M + 6M straddling all three tiers; x1.13 = COLLISION 0.08 + TIER_1 0.05; cap min(., 600,000,000) not binding)"
            - "SalvageContract.${ct_id}.provisional_award_cents == 72000000 (flat 12% of 600,000,000)"

      - name: charter_cost_per_line_rounding_order
        grounds:
          - calculations.charter_cost
          - entities.EquipmentCharter.fields.total_cost_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          per-rate-line round_half_up to integer cents BEFORE multiplying by
          days. Odd rate 1,000,001 cents with 11 active + 3 standby days yields
          12,500,014; the forbidden sum-then-round order yields 12,500,013.
          Distinct mode from the tiered-formula and netting-order instances.
        test_recipe:
          setup:
            - "Casualty GROUNDING declared 800,000,000; NCNP contract ACTIVE (security 120,000,000); plan REFLOAT [TUG]"
            - "TUG charter day_rate 1,000,001, booked 2026-05-10 -> 2026-05-24 (336h), ON_HIRE at 05-10T00:00Z; REFLOAT phase ACTIVE"
            - "Phase WEATHER_HOLD at 05-17T00:00Z (charter STANDBY_WEATHER), resumed 05-20T00:00Z (standby 72h accrued)"
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "FV Oda", casualty_type: GROUNDING, declared_salved_value_cents: 800000000, position: "70N 20E" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 3000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: false }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /securities", payload: { contract_id: "${ct_id}", lodged_amount_cents: 120000000 }, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/activate", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /equipment-assets", payload: { asset_class: TUG, day_rate_cents: 1000001, max_hs_meters: 3.00 }, as: OperationsDirector, as_user_id: "opsdir-01", captures: { eq_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /charters", payload: { casualty_id: "${cas_id}", equipment_asset_id: "${eq_id}", window_start: "2026-05-10T00:00:00Z", window_end: "2026-05-24T00:00:00Z", purpose: SALVAGE }, as: SalvageMaster, as_user_id: "sm-01", captures: { ch_id: $.data.id } }
            - { call: "POST /charters/${ch_id}/on-hire", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /weather-windows", payload: { casualty_id: "${cas_id}", window_start: "2026-05-08T00:00:00Z", window_end: "2026-05-26T00:00:00Z", forecast_hs_meters: 1.00 }, as: SalvageMaster, as_user_id: "sm-01", captures: { ww_id: $.data.id } }
            - { call: "POST /permits", payload: { casualty_id: "${cas_id}", agency_type: COAST_GUARD, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T00:00:00Z" }, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { pm_id: $.data.id } }
