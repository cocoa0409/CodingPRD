# =============================================================================
# Task 2233 — Official Grain Inspection & Weighing
# §1.8 Scaffold Difficulty Design — nine §0.5 rules, 19 instances
# Every numeric literal in an `assert:` was computed from the §1.3 formulas
# before this file was written.
# Logical clock: startup default 2026-08-01T00:00:00Z (inside overtime hours),
# so every fee-bearing recipe sets the clock explicitly.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    rule_summary: "Two named variants of one calculation must both be computed and must diverge on the same data."
    instances:
      - name: weighing_per_draft_vs_aggregate_dockage_rounding_variance
        mechanism: |
          §1.3 official_net_weight deducts dockage draft by draft, rounding each deduction to a whole
          pound, while the provisional variant deducts once from the aggregate. The six drafts are
          chosen so every per-draft dockage lands exactly on .5 at 1.5% (505.5, 508.5, 511.5, 514.5,
          517.5, 520.5), so round_half_up adds a half pound six times (3081) while the aggregate
          deduction on 205200 lbs is exactly 3078. The two variants therefore differ by 3 lbs on
          identical input and both values must be stored.
        distinguishing_aspect: "Divergence is created by rounding position (per-item vs aggregate); the sibling instance's divergence comes from switching which input feeds the formula."
        entities_involved: [ServiceArea, Applicant, Inspector, Equipment, InspectionRequest, WeighingRecord]
        grounds:
          - "calculations.official_net_weight"
          - "entities.WeighingRecord.fields.rounding_variance_lbs"
          - "entities.WeighingRecord.fields.net_bushels"
          - "state_machines.InspectionRequest.weighing_status.PENDING_to_WEIGHED"
          - "endpoints[POST /grain-inspection/weighing-records]"
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z (inside standard hours)."
            - "A DESIGNATED service area with an APPROVED SCALE (tolerance 20.0 lbs, certification test error 5.0 lbs) and a licensed weigher holding the WEIGHING endorsement."
            - "A CORN inspection request with GRADING and WEIGHING requested, grading_status OPEN and weighing_status PENDING, no weighing record yet."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED", fee_multiplier_bp: 11500, supervision_required: true, concurrent_watch_capacity: 2 }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Delta River Elevator", account_code: "DRE-001", contact_email: "ops@delta.example" }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1001", full_name: "R. Vance", endorsements: ["SAMPLING", "GRADING", "WEIGHING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SCALE", asset_code: "SCALE-1", model: "HopperMax 400", capacity_lbs: 400000, tolerance_lbs: 20.0 }
              captures: { scale: "$.data.id" }
            - call: POST /grain-inspection/equipment/${scale}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z", test_error_lbs: 5.0 }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-A", declared_quantity_bushels: 3500, requested_services: ["GRADING", "WEIGHING"] }
              captures: { req: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/weighing-records
              as: LicensedInspector
              payload:
                inspection_request_id: "${req}"
                scale_id: "${scale}"
                weigher_inspector_id: "${insp}"
                dockage_pct: 1.5
                drafts:
                  - { gross_lbs: 55000, tare_lbs: 21300 }
                  - { gross_lbs: 55000, tare_lbs: 21100 }
                  - { gross_lbs: 55200, tare_lbs: 21100 }
                  - { gross_lbs: 55300, tare_lbs: 21000 }
                  - { gross_lbs: 55500, tare_lbs: 21000 }
                  - { gross_lbs: 55700, tare_lbs: 21000 }
              captures: { wr: "$.data.id" }
          assert:
            - "201; dockage_lbs == 3081 (506 + 509 + 512 + 515 + 518 + 521)"
            - "net_lbs == 202119 (official per-draft variant)"
            - "provisional_net_lbs == 202122 (aggregate variant: 205200 - 3078)"
            - "rounding_variance_lbs == 3"
            - "net_bushels == 3609.27 (202119 / 56 rounded to 2 decimals)"
            - "status == WEIGHED"
            - "GET /grain-inspection/inspection-requests/${req} -> weighing_status == WEIGHED, grading_status == OPEN (parallel dimensions), certified_quantity_bushels == 3609.27"
        expected_failure_mode_if_naive: "An implementation that computes dockage once on the aggregate and copies it into net_lbs reports 202122 for both variants and rounding_variance_lbs 0."

      - name: protein_basis_instrument_moisture_vs_official_moisture
        mechanism: |
          §1.3 protein_moisture_basis_conversion selects its moisture input from context: with no FINAL
          GradingResult on the request the instrument's own moisture reading governs, and once grading
          is final the official moisture governs. The same instrument reading of 34.60 therefore
          reports 33.90 at analysis time (instrument moisture 11.20) and 34.52 after restatement
          against official moisture 12.8, with the stored basis_adjustment_pct moving from -0.70 to
          -0.08. The variant switch is observable through basis_source.
        distinguishing_aspect: "Both variants use the SAME formula and differ only in which entity supplies an input, and the switch happens through a later transition rather than being computed twice at creation like the weighing sibling."
        entities_involved: [InspectionRequest, Sample, GradingResult, ProteinAnalysis, Equipment]
        grounds:
          - "calculations.protein_moisture_basis_conversion"
          - "entities.ProteinAnalysis.fields.basis_source"
          - "entities.ProteinAnalysis.fields.basis_adjustment_pct"
          - "endpoints[POST /grain-inspection/protein-analyses/{id}/recompute]"
          - "errors[ERR_ANALYSIS_RECOMPUTE_NOT_APPLICABLE]"
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "A DESIGNATED area with an APPROVED SAMPLING_DEVICE and an APPROVED PROTEIN_INSTRUMENT; the inspector holds SAMPLING, GRADING and PROTEIN."
            - "A CORN request with GRADING and PROTEIN requested and a SEALED sample of 4 portions; NO FINAL GradingResult exists yet, so the instrument moisture governs the first computation."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED", fee_multiplier_bp: 11500 }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Delta River Elevator", account_code: "DRE-002", contact_email: "ops@delta.example" }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1002", full_name: "M. Ortiz", endorsements: ["SAMPLING", "GRADING", "PROTEIN"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-1", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "PROTEIN_INSTRUMENT", asset_code: "NIR-1", model: "SpectraGrain 9" }
              captures: { nir: "$.data.id" }
            - call: POST /grain-inspection/equipment/${nir}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-B", declared_quantity_bushels: 3609.27, requested_services: ["GRADING", "PROTEIN"] }
              captures: { req: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-B1", portions_count: 4 }
              captures: { smp: "$.data.id" }
            - call: POST /grain-inspection/protein-analyses
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sample_id: "${smp}", instrument_id: "${nir}", inspector_id: "${insp}", protein_pct_as_is: 34.60, instrument_moisture_pct: 11.20 }
              captures: { pa: "$.data.id", pa_first: "$.data.protein_reported_pct" }
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sample_id: "${smp}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 56.0, moisture_pct: 12.8, damaged_total_pct: 2.0, heat_damaged_pct: 0.1, foreign_material_pct: 1.5 }
              captures: { gr: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/protein-analyses/${pa}/recompute
              as: LicensedInspector
              payload: {}
          assert:
            - "The analysis created before grading had basis_source == INSTRUMENT_MOISTURE, moisture_source_pct == 11.20, protein_reported_pct == 33.90, basis_adjustment_pct == -0.70"
            - "200; after recompute basis_source == OFFICIAL_MOISTURE, moisture_source_pct == 12.8, protein_reported_pct == 34.52, basis_adjustment_pct == -0.08, status == RECOMPUTED"
            - "protein_pct_as_is is unchanged at 34.60 (the raw reading is never rewritten)"
            - "GET /grain-inspection/grading-results/${gr} -> assigned_grade == US_NO_1, limiting_factor == NONE"
            - "A second POST /grain-inspection/protein-analyses/${pa}/recompute -> 422 ERR_ANALYSIS_RECOMPUTE_NOT_APPLICABLE (status is no longer ACCEPTED)"
        expected_failure_mode_if_naive: "An implementation that always converts against the instrument moisture reports 33.90 after recompute; one that always uses official moisture crashes or divides by the missing grading result at creation time."

  - rule_id: combinatorial_formula
    rule_summary: "One formula whose result depends on the combination of several independent inputs, not on any single input."
    instances:
      - name: fee_matrix_mode_a_overtime_times_authority_multiplier
        mechanism: |
          §1.3 fee_assessment combines four independent dimensions: the applicable class set derived
          from certificate_type, the ceiling of thousands of certified bushels, the overtime flag
          derived from the issuance hour, and the area's fee_multiplier_bp. Two COMBINED certificates
          with identical class sets, identical quantity and identical area differ only in the logical
          clock hour, and the surcharge changes the authority adjustment as well because the
          multiplier applies AFTER the surcharge: 39000 -> 44850 at 09:00Z, but 39000 + 9750 = 48750
          -> 56063 at 19:00Z (48750 * 0.15 = 7312.5 rounds half up to 7313).
        distinguishing_aspect: "Mode (a): every dimension is varied while holding the others fixed; the sibling instances vary a single scalar across a threshold (mode b) and walk an ordered predicate matrix (mode c)."
        entities_involved: [ServiceArea, FeeSchedule, InspectionRequest, WeighingRecord, Certificate, Applicant]
        grounds:
          - "calculations.fee_assessment"
          - "entities.Certificate.fields.overtime_applied"
          - "entities.ServiceArea.fields.fee_multiplier_bp"
          - "entities.FeeSchedule.fields.overtime_multiplier_bp"
          - "endpoints[POST /_clock/set_current_utc]"
        test_recipe:
          setup:
            - "A DESIGNATED area (fee_multiplier_bp 11500) with ACTIVE GRADING and WEIGHING fee schedules."
            - "Two structurally identical requests, each with a FINAL GradingResult and a WEIGHED weighing record of 3609.27 net bushels, ready for a COMBINED certificate."
            - "The logical clock is moved between standard hours (09:00Z) and overtime (19:00Z) so the only difference between the two certificates is the issuance instant."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED", fee_multiplier_bp: 11500, supervision_required: false }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "GRADING", base_fee_cents: 12000, per_thousand_bushel_rate_cents: 3000, overtime_multiplier_bp: 2500, minimum_fee_cents: 15000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fs_grading: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fs_grading}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "WEIGHING", base_fee_cents: 9000, per_thousand_bushel_rate_cents: 1500, overtime_multiplier_bp: 2500, minimum_fee_cents: 10000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fs_weighing: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fs_weighing}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Delta River Elevator", account_code: "DRE-003", contact_email: "ops@delta.example", credit_limit_cents: 500000 }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1003", full_name: "R. Vance", endorsements: ["SAMPLING", "GRADING", "WEIGHING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-1", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SCALE", asset_code: "SCALE-1", model: "HopperMax 400", capacity_lbs: 400000, tolerance_lbs: 20.0 }
              captures: { scale: "$.data.id" }
            - call: POST /grain-inspection/equipment/${scale}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z", test_error_lbs: 5.0 }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-C1", declared_quantity_bushels: 3500, requested_services: ["GRADING", "WEIGHING"] }
              captures: { req1: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req1}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-C1", portions_count: 3 }
              captures: { smp1: "$.data.id" }
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req1}", sample_id: "${smp1}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 56.0, moisture_pct: 13.0, damaged_total_pct: 2.0, heat_damaged_pct: 0.1, foreign_material_pct: 1.5 }
            - call: POST /grain-inspection/weighing-records
              as: LicensedInspector
              payload:
                inspection_request_id: "${req1}"
                scale_id: "${scale}"
                weigher_inspector_id: "${insp}"
                dockage_pct: 1.5
                drafts:
                  - { gross_lbs: 55000, tare_lbs: 21300 }
                  - { gross_lbs: 55000, tare_lbs: 21100 }
                  - { gross_lbs: 55200, tare_lbs: 21100 }
                  - { gross_lbs: 55300, tare_lbs: 21000 }
                  - { gross_lbs: 55500, tare_lbs: 21000 }
                  - { gross_lbs: 55700, tare_lbs: 21000 }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-C2", declared_quantity_bushels: 3500, requested_services: ["GRADING", "WEIGHING"] }
              captures: { req2: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req2}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-C2", portions_count: 3 }
              captures: { smp2: "$.data.id" }
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req2}", sample_id: "${smp2}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 56.0, moisture_pct: 13.0, damaged_total_pct: 2.0, heat_damaged_pct: 0.1, foreign_material_pct: 1.5 }
            - call: POST /grain-inspection/weighing-records
              as: LicensedInspector
              payload:
                inspection_request_id: "${req2}"
                scale_id: "${scale}"
                weigher_inspector_id: "${insp}"
                dockage_pct: 1.5
                drafts:
                  - { gross_lbs: 55000, tare_lbs: 21300 }
                  - { gross_lbs: 55000, tare_lbs: 21100 }
                  - { gross_lbs: 55200, tare_lbs: 21100 }
                  - { gross_lbs: 55300, tare_lbs: 21000 }
                  - { gross_lbs: 55500, tare_lbs: 21000 }
                  - { gross_lbs: 55700, tare_lbs: 21000 }
            - call: POST /grain-inspection/certificates
              as: LicensedInspector
              payload: { inspection_request_id: "${req1}", issuing_inspector_id: "${insp}", certificate_type: "COMBINED" }
              captures: { cert_std: "$.data.id", fee_std: "$.data.fee_total_cents" }
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T19:00:00Z" }
          trigger:
            - call: POST /grain-inspection/certificates
              as: LicensedInspector
              payload: { inspection_request_id: "${req2}", issuing_inspector_id: "${insp}", certificate_type: "COMBINED" }
              captures: { cert_ot: "$.data.id" }
          assert:
            - "The standard-hours certificate has overtime_applied == false, certified_quantity_bushels == 3609.27 and fee_total_cents == 44850 (service 21000 + 4 * 4500 = 39000, tier 0, authority adjustment 5850)"
            - "201; the overtime certificate has overtime_applied == true and fee_total_cents == 56063 (39000 + 9750 = 48750, tier 0, adjustment round_half_up(7312.5) = 7313)"
            - "The 4500 per-thousand rate is the SUM of the GRADING and WEIGHING rates and the 2500 surcharge is the MAX of the two schedules' overtime_multiplier_bp"
            - "GET /grain-inspection/applicants/${app} -> charges_total_cents == 100913, credits_total_cents == 0, open_balance_cents == 100913"
            - "Both certificates have fee_settlement_status == UNPAID and distinct sequence_no values 1 and 2"
        expected_failure_mode_if_naive: "Applying the authority multiplier before the overtime surcharge yields 56062 or 56063 by accident on one path and diverges on the other; summing minimum_fee_cents instead of taking the maximum floors both certificates at 25000."

      - name: fee_tier_mode_b_discount_inversion_at_50000_boundary
        mechanism: |
          The volume tier is chosen from the PRE-discount subtotal, so a larger lot can cost less than
          a smaller one. In a delegated area (multiplier 10000, no adjustment) a GRADE certificate
          prices at 8000 + 2000 * ceil(bushels / 1000): 20000 bushels gives thousands 20, pre 48000,
          tier 0 and a total of 48000, while 20500 bushels gives thousands 21, pre exactly 50000,
          which reaches the 500bp tier, discounts 2500 and totals 47500. The fee is therefore
          non-monotonic in quantity at the boundary, and the boundary is inclusive.
        distinguishing_aspect: "Mode (b): a single scalar (quantity) is walked across a tier threshold while every other dimension is frozen; the mode (a) sibling varies the dimensions instead."
        entities_involved: [ServiceArea, FeeSchedule, InspectionRequest, Certificate]
        grounds:
          - "calculations.fee_assessment"
          - "entities.FeeSchedule.fields.per_thousand_bushel_rate_cents"
          - "entities.FeeSchedule.fields.minimum_fee_cents"
          - "entities.Certificate.fields.fee_total_cents"
          - "entities.Applicant.fields.open_balance_cents"
        test_recipe:
          setup:
            - "A DELEGATED area (fee_multiplier_bp 10000) with an ACTIVE GRADING schedule (base 8000, 2000 per thousand bushels, minimum 10000)."
            - "Two requests whose declared quantities straddle the 50000-cent discount boundary (20000 and 20500 bushels), each with a FINAL GradingResult."
            - "Logical clock at 2026-08-03T09:00:00Z so no overtime surcharge participates."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Plains Delegated Office", state_code: "KS", authority_type: "DELEGATED", fee_multiplier_bp: 10000, supervision_required: false }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "GRADING", base_fee_cents: 8000, per_thousand_bushel_rate_cents: 2000, overtime_multiplier_bp: 2000, minimum_fee_cents: 10000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fs: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fs}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Prairie Coop", account_code: "PRC-001", contact_email: "billing@prairie.example", credit_limit_cents: 500000 }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-2001", full_name: "T. Boone", endorsements: ["SAMPLING", "GRADING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-K1", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-20000", declared_quantity_bushels: 20000, requested_services: ["GRADING"] }
              captures: { req_low: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req_low}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-K1", portions_count: 2 }
              captures: { smp_low: "$.data.id" }
