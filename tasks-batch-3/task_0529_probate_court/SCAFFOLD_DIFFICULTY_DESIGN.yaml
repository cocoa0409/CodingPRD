# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Probate Court & Estate Administration — Expert
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. All setup_api_calls use
# flat top-level endpoints; expected_estate_version is always captured from a
# prior GET /estates/{id} (output Estate carries `version`). Startup clock
# default is 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: bond_required_amount_full_vs_independent
        grounds:
          - calculations.bond_required_amount
          - calculations.estate_supervision_level
          - entities.Bond.fields.required_amount_cents
          - entities.Estate.fields.supervision_level
        distinguishing_aspect: |
          Same bond_required_amount formula on the Bond domain yields 3250000
          cents for a FULL estate (gross 6000000) but 0 for an INDEPENDENT
          estate (gross 300000) — the two variants diverge on the Bond entity.
        test_recipe:
          setup:
            - "One estate gross 6000000 (FULL) with a filed bond; one estate gross 300000 (INDEPENDENT) with a filed bond."
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "A Full", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 6000000 }
              as: Clerk
              captures: { est_full_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_full_id}", petitioner_name: "P1", will_lodged: false, nominated_representative_name: "R1" }
              as: Clerk
              captures: { pet_full_id: $.data.id }
            - call: "GET /estates/${est_full_id}"
              as: Clerk
              captures: { v_full: $.data.version }
            - call: "POST /petitions/${pet_full_id}/grant"
              payload: { expected_estate_version: "${v_full}" }
              as: ProbateJudge
            - call: "POST /representatives"
              payload: { estate_id: "${est_full_id}", petition_id: "${pet_full_id}", full_name: "R1", representative_user_id: "pr-user-1" }
              as: Clerk
              captures: { rep_full_id: $.data.id }
            - call: "POST /bonds"
              payload: { estate_id: "${est_full_id}", representative_id: "${rep_full_id}", surety_name: "Acme Surety", penal_amount_cents: 3250000 }
              as: Clerk
              captures: { bond_full_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "B Indep", date_of_death: "2026-04-01T00:00:00Z", county_code: "SF", estate_type: "INTESTATE", gross_estate_value_cents: 300000 }
              as: Clerk
              captures: { est_ind_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_ind_id}", petitioner_name: "P2", will_lodged: false, nominated_representative_name: "R2" }
              as: Clerk
              captures: { pet_ind_id: $.data.id }
            - call: "GET /estates/${est_ind_id}"
              as: Clerk
              captures: { v_ind: $.data.version }
            - call: "POST /petitions/${pet_ind_id}/grant"
              payload: { expected_estate_version: "${v_ind}" }
              as: ProbateJudge
            - call: "POST /representatives"
              payload: { estate_id: "${est_ind_id}", petition_id: "${pet_ind_id}", full_name: "R2", representative_user_id: "pr-user-2" }
              as: Clerk
              captures: { rep_ind_id: $.data.id }
            - call: "POST /bonds"
              payload: { estate_id: "${est_ind_id}", representative_id: "${rep_ind_id}", surety_name: "Acme Surety", penal_amount_cents: 0 }
              as: Clerk
              captures: { bond_ind_id: $.data.id }
          trigger:
            - call: "GET /bonds/${bond_full_id}"
              as: Clerk
              captures: { req_full: $.data.required_amount_cents }
            - call: "GET /bonds/${bond_ind_id}"
              as: Clerk
              captures: { req_ind: $.data.required_amount_cents }
          assert:
            - "Bond.${bond_full_id}.required_amount_cents == 3250000"
            - "Bond.${bond_ind_id}.required_amount_cents == 0"
            - "Estate.${est_full_id}.supervision_level == FULL"
            - "Estate.${est_ind_id}.supervision_level == INDEPENDENT"

      - name: asset_carrying_value_provisional_vs_final
        grounds:
          - calculations.asset_carrying_value
          - entities.Asset.fields.declared_value_cents
          - entities.Asset.fields.appraised_value_cents
          - state_machines.Asset.LISTED_to_APPRAISED
        distinguishing_aspect: |
          The asset_carrying_value calc on the Asset domain returns
          declared_value_cents (500000) while LISTED but appraised_value_cents
          (620000) after APPRAISE — a different subject entity than the Bond
          dual-variant above, so two domains exhibit dual-variant logic.
        test_recipe:
          setup:
            - "An OPEN estate with an APPOINTED PR and a REAL_PROPERTY asset declared 500000, appraised 620000."
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "C", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 6000000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
            - call: "POST /petitions/${pet_id}/grant"
              payload: { expected_estate_version: "${v0}" }
              as: ProbateJudge
            - call: "POST /representatives"
              payload: { estate_id: "${est_id}", petition_id: "${pet_id}", full_name: "R", representative_user_id: "pr-user-1" }
              as: Clerk
              captures: { rep_id: $.data.id }
            - call: "POST /bonds"
              payload: { estate_id: "${est_id}", representative_id: "${rep_id}", surety_name: "S", penal_amount_cents: 3250000 }
              as: Clerk
              captures: { bond_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v1: $.data.version }
            - call: "POST /bonds/${bond_id}/approve"
              payload: { expected_estate_version: "${v1}" }
              as: ProbateJudge
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v2: $.data.version }
            - call: "POST /representatives/${rep_id}/appoint"
              payload: { expected_estate_version: "${v2}" }
              as: ProbateJudge
              as_user_id: "judge-1"
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", description: "House", asset_class: "REAL_PROPERTY", declared_value_cents: 500000 }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { asset_id: $.data.id }
          trigger:
            - call: "GET /assets/${asset_id}"
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { provisional: $.data.declared_value_cents }
            - call: "GET /estates/${est_id}"
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { v3: $.data.version }
            - call: "POST /assets/${asset_id}/appraise"
              payload: { appraised_value_cents: 620000, expected_estate_version: "${v3}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
          assert:
            - "Asset.${asset_id}.declared_value_cents == 500000 (provisional carrying value while LISTED)"
            - "Asset.${asset_id}.appraised_value_cents == 620000 (final carrying value after APPRAISE)"
            - "Estate.${est_id}.inventory_total_cents == 620000 (final, not provisional 500000)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: bond_required_tiered_marginal_cover
        grounds:
          - calculations.bond_required_amount
          - entities.Estate.fields.gross_estate_value_cents
          - entities.Bond.fields.required_amount_cents
        distinguishing_aspect: |
          Mode (a): a tiered formula with 3 tier inputs and non-linear marginal
          rates (100%/50%/25%); gross 6000000 -> 1000000 + 2000000 + 250000 =
          3250000, not a single flat rate.
        test_recipe:
          setup:
            - "An estate gross 6000000 with a filed bond."
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "T", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 6000000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
            - call: "POST /petitions/${pet_id}/grant"
              payload: { expected_estate_version: "${v0}" }
              as: ProbateJudge
            - call: "POST /representatives"
              payload: { estate_id: "${est_id}", petition_id: "${pet_id}", full_name: "R", representative_user_id: "pr-user-1" }
              as: Clerk
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /bonds"
              payload: { estate_id: "${est_id}", representative_id: "${rep_id}", surety_name: "S", penal_amount_cents: 3250000 }
              as: Clerk
              captures: { bond_id: $.data.id, req: $.data.required_amount_cents }
          assert:
            - "Bond.${bond_id}.required_amount_cents == 3250000"

      - name: claim_payment_waterfall_pool_order_pinned
        grounds:
          - calculations.claim_payment
          - calculations.marshaled_cash
          - state_machines.CreditorClaim.ALLOWED_to_PAID
          - validations[priority=11]
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned order — the pool
          (marshaled_cash=200000) both gates and is debited by each pay, and a
          claim's eligibility depends on higher-priority claims already paid.
          SECURED(allowed 150000) pays first -> pool 50000; GENERAL(allowed
          300000) then pays 50000. Different mode from the tiered instance above.
        test_recipe:
          setup:
            - "An ACCOUNTING estate, marshaled_cash 200000 (one CASH asset appraised 200000, marshaled), two ALLOWED claims: SECURED 150000 and GENERAL 300000."
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "W", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 6000000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
            - call: "POST /petitions/${pet_id}/grant"
              payload: { expected_estate_version: "${v0}" }
              as: ProbateJudge
            - call: "POST /representatives"
              payload: { estate_id: "${est_id}", petition_id: "${pet_id}", full_name: "R", representative_user_id: "pr-user-1" }
              as: Clerk
              captures: { rep_id: $.data.id }
            - call: "POST /bonds"
              payload: { estate_id: "${est_id}", representative_id: "${rep_id}", surety_name: "S", penal_amount_cents: 3250000 }
              as: Clerk
              captures: { bond_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v1: $.data.version }
            - call: "POST /bonds/${bond_id}/approve"
              payload: { expected_estate_version: "${v1}" }
              as: ProbateJudge
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v2: $.data.version }
            - call: "POST /representatives/${rep_id}/appoint"
              payload: { expected_estate_version: "${v2}" }
              as: ProbateJudge
              as_user_id: "judge-1"
            - call: "POST /claims"
              payload: { estate_id: "${est_id}", creditor_name: "Bank", claim_class: "SECURED", claimed_amount_cents: 150000 }
              as: Clerk
              captures: { claim_sec_id: $.data.id }
            - call: "POST /claims"
              payload: { estate_id: "${est_id}", creditor_name: "Vendor", claim_class: "GENERAL", claimed_amount_cents: 300000 }
              as: Clerk
              captures: { claim_gen_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v3: $.data.version }
            - call: "POST /claims/${claim_sec_id}/allow"
              payload: { allowed_amount_cents: 150000, expected_estate_version: "${v3}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v4: $.data.version }
            - call: "POST /claims/${claim_gen_id}/allow"
              payload: { allowed_amount_cents: 300000, expected_estate_version: "${v4}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", description: "Cash", asset_class: "CASH", declared_value_cents: 200000 }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { asset_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v5: $.data.version }
            - call: "POST /assets/${asset_id}/appraise"
              payload: { appraised_value_cents: 200000, expected_estate_version: "${v5}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "POST /accountings"
              payload: { estate_id: "${est_id}", report_type: "INVENTORY" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { acct_inv_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v6: $.data.version }
            - call: "POST /accountings/${acct_inv_id}/file"
              payload: { expected_estate_version: "${v6}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v7: $.data.version }
            - call: "POST /accountings/${acct_inv_id}/approve"
              payload: { expected_estate_version: "${v7}" }
              as: ProbateJudge
            - call: "POST /accountings"
              payload: { estate_id: "${est_id}", report_type: "INTERIM" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { acct_int_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v8: $.data.version }
            - call: "POST /accountings/${acct_int_id}/file"
              payload: { expected_estate_version: "${v8}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v9: $.data.version }
            - call: "POST /accountings/${acct_int_id}/approve"
              payload: { expected_estate_version: "${v9}" }
              as: ProbateJudge
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v10: $.data.version }
            - call: "POST /assets/${asset_id}/marshal"
              payload: { expected_estate_version: "${v10}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
          trigger:
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v11: $.data.version }
            - call: "POST /claims/${claim_sec_id}/pay"
              payload: { expected_estate_version: "${v11}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v12: $.data.version }
            - call: "POST /claims/${claim_gen_id}/pay"
              payload: { expected_estate_version: "${v12}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
          assert:
            - "CreditorClaim.${claim_sec_id}.paid_amount_cents == 150000"
            - "CreditorClaim.${claim_gen_id}.paid_amount_cents == 50000"
            - "Estate.${est_id}.marshaled_cash_cents == 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: representative_suspend_reinstate_cycle
        grounds:
          - state_machines.PersonalRepresentative.APPOINTED_to_SUSPENDED
          - state_machines.PersonalRepresentative.SUSPENDED_to_APPOINTED
        distinguishing_aspect: |
          PersonalRepresentative has a cycle APPOINTED->SUSPENDED->APPOINTED
          (a non-linear loop on the PR entity), distinct from the Distribution
          branching instance below.
        test_recipe:
          setup:
            - "An APPOINTED PR on a FULL estate."
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "S", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 6000000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
            - call: "POST /petitions/${pet_id}/grant"
              payload: { expected_estate_version: "${v0}" }
              as: ProbateJudge
            - call: "POST /representatives"
              payload: { estate_id: "${est_id}", petition_id: "${pet_id}", full_name: "R", representative_user_id: "pr-user-1" }
              as: Clerk
              captures: { rep_id: $.data.id }
            - call: "POST /bonds"
              payload: { estate_id: "${est_id}", representative_id: "${rep_id}", surety_name: "S", penal_amount_cents: 3250000 }
              as: Clerk
              captures: { bond_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v1: $.data.version }
            - call: "POST /bonds/${bond_id}/approve"
              payload: { expected_estate_version: "${v1}" }
              as: ProbateJudge
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v2: $.data.version }
            - call: "POST /representatives/${rep_id}/appoint"
              payload: { expected_estate_version: "${v2}" }
              as: ProbateJudge
              as_user_id: "judge-1"
          trigger:
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v3: $.data.version }
            - call: "POST /representatives/${rep_id}/suspend"
              payload: { expected_estate_version: "${v3}" }
              as: ProbateJudge
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v4: $.data.version }
            - call: "POST /representatives/${rep_id}/reinstate"
              payload: { expected_estate_version: "${v4}" }
              as: ProbateJudge
          assert:
            - "PersonalRepresentative.${rep_id}.status == APPOINTED (after the SUSPEND->REINSTATE loop)"

      - name: distribution_approve_branches_pay_or_return
        grounds:
          - state_machines.Distribution.APPROVED_to_PAID
          - state_machines.Distribution.APPROVED_to_RETURNED
        distinguishing_aspect: |
          Distribution branches from APPROVED into either PAID (debits cash) or
          RETURNED (no debit) with divergent side-effect sets — a fork on a
          different entity than the PR cycle above.
        test_recipe:
          setup:
            - "A DISTRIBUTING estate with marshaled_cash 1000000, all claims paid (none exist), one APPROVED distribution 400000 and one APPROVED distribution 300000 to a beneficiary holding 10000 bps."
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "D", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 6000000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
            - call: "POST /petitions/${pet_id}/grant"
              payload: { expected_estate_version: "${v0}" }
              as: ProbateJudge
            - call: "POST /representatives"
              payload: { estate_id: "${est_id}", petition_id: "${pet_id}", full_name: "R", representative_user_id: "pr-user-1" }
              as: Clerk
              captures: { rep_id: $.data.id }
            - call: "POST /bonds"
              payload: { estate_id: "${est_id}", representative_id: "${rep_id}", surety_name: "S", penal_amount_cents: 3250000 }
              as: Clerk
              captures: { bond_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v1: $.data.version }
            - call: "POST /bonds/${bond_id}/approve"
              payload: { expected_estate_version: "${v1}" }
              as: ProbateJudge
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v2: $.data.version }
            - call: "POST /representatives/${rep_id}/appoint"
              payload: { expected_estate_version: "${v2}" }
              as: ProbateJudge
              as_user_id: "judge-1"
            - call: "POST /beneficiaries"
              payload: { estate_id: "${est_id}", full_name: "Heir", relationship: "CHILD", share_bps: 10000 }
              as: Clerk
              captures: { ben_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", description: "Cash", asset_class: "CASH", declared_value_cents: 1000000 }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { asset_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v3: $.data.version }
            - call: "POST /assets/${asset_id}/appraise"
              payload: { appraised_value_cents: 1000000, expected_estate_version: "${v3}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "POST /accountings"
              payload: { estate_id: "${est_id}", report_type: "INVENTORY" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { acct_inv_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v4: $.data.version }
            - call: "POST /accountings/${acct_inv_id}/file"
              payload: { expected_estate_version: "${v4}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v5: $.data.version }
            - call: "POST /accountings/${acct_inv_id}/approve"
              payload: { expected_estate_version: "${v5}" }
              as: ProbateJudge
            - call: "POST /accountings"
              payload: { estate_id: "${est_id}", report_type: "INTERIM" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { acct_int_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v6: $.data.version }
            - call: "POST /accountings/${acct_int_id}/file"
              payload: { expected_estate_version: "${v6}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v7: $.data.version }
            - call: "POST /accountings/${acct_int_id}/approve"
