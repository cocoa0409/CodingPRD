              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "Order 2 is created: adjacency at 2026-08-10T00:00:00Z does not collide because order 1's window is half-open"
            - "PriceChangeOrder.${ord2_id}.effective_until == null and status == DRAFT"
            - "Third call: HTTP 409 with error_id == ERR_EFFECTIVE_WINDOW_OVERLAP (2026-08-09 falls inside order 1's window and 2026-08-12 inside order 2's open-ended window)"
            - "GET /pricing/change-orders?product_id=${p_id} returns total_count == 2 — the overlapping order was not persisted"
            - "Product.${p_id}.version == ${p_v1} + 2 — only the two accepted creates bumped it"
            - "Product.${p_id}.own_price_cents is still 20000 — no order was executed"

      - name: label_batch_buffered_window_and_daily_slot_capacity
        grounds:
          - validations.priority_76_ERR_PRINT_WINDOW_CONFLICT
          - validations.priority_77_ERR_PRINT_CAPACITY_EXCEEDED
          - calculations.store_label_slot_ledger
        distinguishing_aspect: |
          Buffered closed-interval semantics on a different resource entity (Store's
          printer): a 30-minute gap collides, a gap of exactly 45 minutes is accepted, and
          a window that clears the buffer can still be refused by the independent
          same-day slot capacity check. Adjacency is forbidden here, unlike the
          half-open order windows on Product.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Market US-WEST; store STORE-101 with label_printer_capacity_per_day 10."
            - "Batch 1: SCHEDULED window 2026-08-01T08:00:00Z .. 09:00:00Z with reserved_item_count 2."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800, index_tolerance_bp: 150 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/stores"
              payload: { market_id: "${m_id}", store_code: "STORE-101", override_authority_cents: 5000, label_printer_capacity_per_day: 10 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /pricing/label-batches"
              payload: { store_id: "${s_id}", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T09:00:00Z", reserved_item_count: 2 }
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /pricing/label-batches"
              payload: { store_id: "${s_id}", window_start: "2026-08-01T09:30:00Z", window_end: "2026-08-01T10:30:00Z", reserved_item_count: 1 }
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { err_window: $.data.error_id }
            - call: "POST /pricing/label-batches"
              payload: { store_id: "${s_id}", window_start: "2026-08-01T09:45:00Z", window_end: "2026-08-01T10:45:00Z", reserved_item_count: 8 }
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { b3_id: $.data.id }
            - call: "POST /pricing/label-batches"
              payload: { store_id: "${s_id}", window_start: "2026-08-01T12:00:00Z", window_end: "2026-08-01T13:00:00Z", reserved_item_count: 1 }
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { err_capacity: $.data.error_id }
          assert:
            - "First call: HTTP 409 with error_id == ERR_PRINT_WINDOW_CONFLICT (09:30 is only 30 minutes after 09:00, less than the 45-minute buffer)"
            - "Second call succeeds: 09:45 == 09:00 + 45 minutes exactly, so LabelPrintBatch.${b3_id}.status == SCHEDULED with item_count == 8"
            - "Store.${s_id}.label_slots_used_today == 10 and label_slots_remaining_today == 0 (2 + 8)"
            - "Third call: HTTP 409 with error_id == ERR_PRINT_CAPACITY_EXCEEDED — its window clears the buffer (12:00 > 10:45 + 45 min) but 10 + 1 > 10"
            - "GET /pricing/label-batches?store_id=${s_id} returns total_count == 2 — only batches 1 and 3 persisted"
            - "LabelPrintBatch.${b1_id}.item_count == 2 with an empty queued_order_ids"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: override_budget_conserved_after_honor_then_reverse
        grounds:
          - calculations.store_override_budget_ledger
          - state_machines.PriceMatchClaim.HONORED_to_REVERSED
          - entities.OverrideLog.fields.direction
        distinguishing_aspect: |
          Conserved quantity: money — policy.daily_override_budget_cents ==
          store.override_budget_used_cents + override_budget_remaining_cents, before and
          after the reversal. Compensation is append-only: the DEBIT row survives and a
          CREDIT row is added, and the synthesized PRICE_MATCH order is suspended rather
          than deleted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Market US-WEST; store STORE-101 (override_authority_cents 5000, capacity 5); product SKU-APPL-1 own_price 12999, unit_cost 7000, margin_floor_pct 0.20, map_floor 0."
            - "ACTIVE PRIMARY eligible competitor C-ALPHA with a CONFIRMED link at confidence_bp 10000."
            - "ACTIVE policy with daily_override_budget_cents 100000 and max_match_discount_pct 0.30."
            - "One SCHEDULED batch 00:00 .. 02:00 reserved 0, so the honor cascade can queue a label."
            - "Claim at claimed_price_cents 10400 (honored 9900, discount 3099) already VERIFIED."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800, index_tolerance_bp: 150 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-APPL-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 12999, unit_cost_cents: 7000, margin_floor_pct: 0.20, map_floor_cents: 0, index_weight_bp: 10000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/stores"
              payload: { market_id: "${m_id}", store_code: "STORE-101", override_authority_cents: 5000, label_printer_capacity_per_day: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-ALPHA", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY", price_match_eligible: true }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 95, attribute_score: 95, image_score: 95, competitor_identifier: "00712345678905" }
              as: PricingAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /pricing/matches/${l_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/label-batches"
              payload: { store_id: "${s_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z", reserved_item_count: 0 }
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { batch_id: $.data.id }
            - call: "POST /pricing/match-policies"
              payload: { market_id: "${m_id}", eligible_competitor_tiers: ["PRIMARY"], daily_override_budget_cents: 100000, max_match_discount_pct: 0.30, claim_window_hours: 168 }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { pol_id: $.data.id }
            - call: "POST /pricing/claims"
              payload: { policy_id: "${pol_id}", product_id: "${p_id}", competitor_id: "${c1_id}", store_id: "${s_id}", claimed_price_cents: 10400, claimed_observed_at: "2026-07-31T18:00:00Z", competitor_evidence_ref: "receipt-5" }
              as: StoreAssociate
              as_user_id: "${s_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /pricing/claims/${claim_id}/verify"
              payload: {}
              as: StoreManager
              as_user_id: "${s_id}"
            - call: "POST /pricing/claims/${claim_id}/decide"
              payload: { decision: "VERIFIED" }
              as: StoreManager
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /pricing/claims/${claim_id}/honor"
              payload: {}
              as: StoreAssociate
              as_user_id: "${s_id}"
            - call: "POST /pricing/claims/${claim_id}/reverse"
              payload: { reversal_reason: "shopper returned the item" }
              as: StoreManager
              as_user_id: "${s_id}"
          assert:
            - "Before the trigger: Store.${s_id}.override_budget_used_cents == 0 and override_budget_remaining_cents == 100000, so 100000 == 0 + 100000"
            - "After the honor: used == 3099 and remaining == 96901, so the invariant 100000 == 3099 + 96901 still holds"
            - "After the reverse: PriceMatchClaim.${claim_id}.status == REVERSED with reversal_reason 'shopper returned the item'"
            - "After the reverse: used == 0 and remaining == 100000, so 100000 == 0 + 100000 again — no drift"
            - "GET /pricing/claims/${claim_id}/override-logs returns total_count == 2 ordered by created_at ASC: DEBIT 3099 then CREDIT 3099 (the ledger is append-only, the DEBIT row is never mutated or deleted)"
            - "GET /pricing/claims/${claim_id}/override-logs?direction=CREDIT returns total_count == 1"
            - "PriceMatchPolicy.${pol_id}.honored_claim_count == 0 after the reversal"
            - "The PRICE_MATCH order with source_claim_id == ${claim_id} has status SUSPENDED, signage_status RELEASED and label_batch_id null"
            - "LabelPrintBatch.${batch_id}.item_count == 0 and Store.${s_id}.label_slots_used_today == 0"

      - name: label_slot_conserved_after_queue_then_supersede_release
        grounds:
          - calculations.store_label_slot_ledger
          - state_machines.PriceChangeOrder.APPROVED_to_SUPERSEDED
          - state_machines.PriceChangeOrder.QUEUED_to_RELEASED
        distinguishing_aspect: |
          A different conserved quantity: printer slots —
          store.label_printer_capacity_per_day == label_slots_used_today +
          label_slots_remaining_today, before the queue-up and after the release. The
          compensation is driven by supersession rather than a ledger reversal, and it
          restores a counter of physical capacity rather than money.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Market US-WEST; store STORE-101 with label_printer_capacity_per_day 5; product SKU-SIGN-1 own_price 20000, unit_cost 8000, margin_floor_pct 0.20, map_floor 0."
            - "One SCHEDULED batch 00:00 .. 02:00 with reserved_item_count 0, so capacity 5 is entirely free."
            - "Order 1: MANUAL at 19000, signage_store_id STORE-101, window [2026-08-01T00:00:00Z, 2026-08-05T00:00:00Z), submitted and APPROVED so its label is QUEUED."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800, index_tolerance_bp: 150 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-SIGN-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000, margin_floor_pct: 0.20, map_floor_cents: 0, index_weight_bp: 10000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/stores"
              payload: { market_id: "${m_id}", store_code: "STORE-101", override_authority_cents: 5000, label_printer_capacity_per_day: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /pricing/label-batches"
              payload: { store_id: "${s_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z", reserved_item_count: 0 }
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { batch_id: $.data.id }
            - call: "GET /pricing/products/${p_id}"
              payload: {}
              as: PricingAnalyst
              captures: { p_v1: $.data.version }
            - call: "POST /pricing/change-orders"
              payload: { product_id: "${p_id}", origin: "MANUAL", requested_price_cents: 19000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-08-05T00:00:00Z", signage_store_id: "${s_id}", expected_product_version: "${p_v1}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { ord1_id: $.data.id }
            - call: "POST /pricing/change-orders/${ord1_id}/submit"
              payload: {}
              as: PricingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /pricing/change-orders/${ord1_id}/decide"
              payload: { decision: "APPROVE" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "GET /pricing/products/${p_id}"
              payload: {}
              as: PricingAnalyst
              captures: { p_v2: $.data.version }
          trigger:
            - call: "POST /pricing/change-orders"
              payload: { product_id: "${p_id}", origin: "MANUAL", requested_price_cents: 18500, effective_from: "2026-08-05T00:00:00Z", signage_store_id: "${s_id}", supersedes_order_id: "${ord1_id}", expected_product_version: "${p_v2}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { ord2_id: $.data.id }
          assert:
            - "Before the trigger: Store.${s_id}.label_slots_used_today == 1 and label_slots_remaining_today == 4, so 5 == 1 + 4"
            - "Before the trigger: PriceChangeOrder.${ord1_id}.signage_status == QUEUED with label_batch_id == ${batch_id} and LabelPrintBatch.${batch_id}.item_count == 1"
            - "After the trigger: PriceChangeOrder.${ord1_id}.status == SUPERSEDED, signage_status == RELEASED, label_batch_id == null"
            - "After the trigger: LabelPrintBatch.${batch_id}.item_count == 0 with an empty queued_order_ids and status still SCHEDULED"
            - "After the trigger: Store.${s_id}.label_slots_used_today == 0 and label_slots_remaining_today == 5, so 5 == 0 + 5 — the slot came back exactly once, not twice"
            - "PriceChangeOrder.${ord2_id}.status == DRAFT with signage_status NOT_REQUIRED and label_batch_id null (nothing is queued until it is approved)"
            - "PriceChangeOrder.${ord2_id}.supersedes_order_id == ${ord1_id}"
            - "Product.${p_id}.own_price_cents is still 20000 — supersession executes nothing"
