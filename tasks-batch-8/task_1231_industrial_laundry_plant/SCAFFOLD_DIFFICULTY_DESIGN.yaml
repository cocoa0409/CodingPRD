# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1231_industrial_laundry_plant
# 9 rules × 2 instances each = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (two calculations, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cog_actual_vs_estimated_billing_diverge
        grounds:
          - calculations.cog_linen_charge
          - entities.WashLoad.fields.status
          - entities.Invoice.fields.linen_charges_cents
        distinguishing_aspect: |
          Domain: COG billing on WashLoad/Invoice. The cog_estimated variant
          (billing-preview) includes loads in {STAGED, RUNNING, AWAITING_TEST,
          TESTED_PASS, REWASH_PENDING} using projected clean weight, whereas
          cog_actual (invoice generate) includes only FINISHED loads, so the
          same physical plant state yields 12000 preview cents vs 6000 actual
          cents — divergence is driven purely by which WashLoad states enter
          the input set.
        test_recipe:
          setup:
            - "Plant P with reject_rate_alert_pct=25.0, par_shortage_alert_pieces=5, utility baselines 1.0/2.0"
            - "LinenCategory TOWEL: piece_weight_lb=0.5, cog_wash_rate_cents_per_lb=120, formula WF_STANDARD, hygienic_test_required=false, replacement_cost_cents=500"
            - "COG Customer C (billing_mode=COG, chip_tracking_enabled=false, credit_limit_cents=100000000)"
            - "Route R dispatched; stop S for C picked up with one cart of 50 lb; cart received"
            - "SortBatch B for S: 100 pieces ACCEPTED of TOWEL, 0 rejected; locked and posted"
            - "WashLoad L1 for (B, TOWEL) on machine M1, started, finish-cycle, bypass-test, unloaded (FINISHED) — clean_weight_lb = 50.0"
            - "WashLoad L2 for (B, TOWEL) on machine M1 at a later non-overlapping window, still STAGED — 100 pieces projected = 50.0 lb"
            - "Billing period covers both loads"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/linen-categories"
              payload: { code: "TOWEL", piece_weight_lb: 0.5, wash_formula_code: "WF_STANDARD", hygienic_test_required: false, replacement_cost_cents: 500, cog_wash_rate_cents_per_lb: 120 }
              as: PlantAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "COG", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-05-02", driver_name: "D1" }
              as: RouteDriver
              captures: { r_id: $.data.id }
            - call: "POST /routes/${r_id}/stops"
              payload: { customer_id: "${c_id}", sequence_index: 1, declared_soiled_weight_lb: 50.0 }
              as: RouteDriver
              captures: { s_id: $.data.id }
            - call: "POST /routes/${r_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/pickup"
              payload: { carts: [ { cart_tag: "CART-1", scale_weight_lb: 50.0 } ] }
              as: RouteDriver
            - call: "GET /stops/${s_id}/carts"
              as: PlantOperator
              captures: { cart_id: "$.data[0].id" }
            - call: "POST /carts/${cart_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches"
              payload: { stop_id: "${s_id}" }
              as: PlantOperator
              captures: { b_id: $.data.id }
            - call: "POST /sort-batches/${b_id}/items"
              payload: { category_id: "${cat_id}", pieces: 100, disposition: "ACCEPTED" }
              as: PlantOperator
            - call: "POST /sort-batches/${b_id}/lock"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches/${b_id}/post"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads"
              payload: { batch_id: "${b_id}", category_id: "${cat_id}", machine_id: "M1", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T09:00:00Z" }
              as: PlantOperator
              captures: { l1_id: $.data.id }
            - call: "POST /wash-loads/${l1_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l1_id}/finish-cycle"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l1_id}/bypass-test"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l1_id}/unload"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads"
              payload: { batch_id: "${b_id}", category_id: "${cat_id}", machine_id: "M1", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T11:00:00Z" }
              as: PlantOperator
              captures: { l2_id: $.data.id }
          trigger:
            - call: "GET /customers/${c_id}/billing-preview?billing_period_start=2026-05-01&billing_period_end=2026-06-01"
              payload: { billing_period_start: "2026-05-01", billing_period_end: "2026-06-01" }
              as: BillingClerk
              captures: { preview_linen: $.data.linen_charges_cents }
            - call: "POST /customers/${c_id}/invoices/generate"
              payload: { billing_period_start: "2026-05-01", billing_period_end: "2026-06-01" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "GET /invoices/${inv_id}"
              as: BillingClerk
              captures: { actual_linen: $.data.linen_charges_cents }
          assert:
            - "preview_linen == 12000"
            - "actual_linen == 6000"
            - "preview_linen != actual_linen"

      - name: utility_surcharge_estimated_vs_actual_diverge
        grounds:
          - calculations.utility_surcharge
          - entities.UtilityReading.fields.period_month
          - entities.Invoice.fields.utility_surcharge_cents
        distinguishing_aspect: |
          Domain: utility surcharge on Invoice/UtilityReading (different entity
          domain from COG linen billing). Estimated variant averages tiered
          excess over the trailing 3 months; actual variant computes from the
          invoice month's own reading. Trailing months yield tiered excesses
          6000/9000/15000 (avg 10000; share uses plant_ref = latest trailing
          reading's clean_lbs_processed = 4000, customer May lbs 4000 → 100%
          → 10000); the invoice month's actual yields tiered excess 24000
          (share = 4000/8000 = 50% → 12000).
          Same customer, same plant, different results purely from variant.
        test_recipe:
          setup:
            - "Plant P with utility_baseline_kwh_per_lb=1.0, utility_baseline_gal_per_lb=2.0"
            - "Trailing readings posted for 2026-02, 2026-03, 2026-04 with excesses chosen so tiered excess = 6000, 9000, 15000 respectively (excess values 12000, 18000, 30000 all under TIER_A_CAP, so tiered = excess * 0.5)"
            - "COG Customer C whose May FINISHED clean lbs = 4000; plant May clean_lbs_processed = 8000 (actual share = 50%); estimated share uses latest trailing reading (April, clean_lbs_processed=4000) → 4000/4000 = 100%"
            - "For 2026-05: kwh_used=10000, gallons_used=30000, kwh_rate_cents=10, gallon_rate_cents=2 → actual_total=160000; baseline = 8000*1.0*10 + 8000*2.0*2 = 80000+32000=112000; excess=48000; tiered=24000"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/utility-readings"
              payload: { period_month: "2026-02", kwh_used: 5200, gallons_used: 8000, clean_lbs_processed: 4000, kwh_rate_cents: 10, gallon_rate_cents: 2 }
              as: BillingClerk
            - call: "POST /plants/${p_id}/utility-readings"
              payload: { period_month: "2026-03", kwh_used: 5800, gallons_used: 8000, clean_lbs_processed: 4000, kwh_rate_cents: 10, gallon_rate_cents: 2 }
              as: BillingClerk
            - call: "POST /plants/${p_id}/utility-readings"
              payload: { period_month: "2026-04", kwh_used: 7000, gallons_used: 8000, clean_lbs_processed: 4000, kwh_rate_cents: 10, gallon_rate_cents: 2 }
              as: BillingClerk
            - call: "POST /plants/${p_id}/linen-categories"
              payload: { code: "SHEET", piece_weight_lb: 4.0, wash_formula_code: "WF_STANDARD", hygienic_test_required: false, replacement_cost_cents: 4000, cog_wash_rate_cents_per_lb: 100 }
              as: PlantAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "COG", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-05-10", driver_name: "D1" }
              as: RouteDriver
              captures: { r_id: $.data.id }
            - call: "POST /routes/${r_id}/stops"
              payload: { customer_id: "${c_id}", sequence_index: 1, declared_soiled_weight_lb: 4000.0 }
              as: RouteDriver
              captures: { s_id: $.data.id }
            - call: "POST /routes/${r_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/pickup"
              payload: { carts: [ { cart_tag: "CART-1", scale_weight_lb: 4000.0 } ] }
              as: RouteDriver
            - call: "GET /stops/${s_id}/carts"
              as: PlantOperator
              captures: { cart_id: "$.data[0].id" }
            - call: "POST /carts/${cart_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches"
              payload: { stop_id: "${s_id}" }
              as: PlantOperator
              captures: { b_id: $.data.id }
            - call: "POST /sort-batches/${b_id}/items"
              payload: { category_id: "${cat_id}", pieces: 1000, disposition: "ACCEPTED" }
              as: PlantOperator
            - call: "POST /sort-batches/${b_id}/lock"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches/${b_id}/post"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads"
              payload: { batch_id: "${b_id}", category_id: "${cat_id}", machine_id: "M1", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T09:00:00Z" }
              as: PlantOperator
              captures: { l1_id: $.data.id }
            - call: "POST /wash-loads/${l1_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l1_id}/finish-cycle"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l1_id}/bypass-test"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l1_id}/unload"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /customers/${c_id}/invoices/generate"
              payload: { billing_period_start: "2026-05-01", billing_period_end: "2026-06-01" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "GET /invoices/${inv_id}"
              as: BillingClerk
              captures: { surcharge_estimated: $.data.utility_surcharge_cents }
            - call: "POST /plants/${p_id}/utility-readings"
              payload: { period_month: "2026-05", kwh_used: 10000, gallons_used: 30000, clean_lbs_processed: 8000, kwh_rate_cents: 10, gallon_rate_cents: 2 }
              as: BillingClerk
            - call: "GET /customers/${c_id}/billing-preview?billing_period_start=2026-05-01&billing_period_end=2026-06-01"
              payload: { billing_period_start: "2026-05-01", billing_period_end: "2026-06-01" }
              as: BillingClerk
              captures: { surcharge_actual: $.data.utility_surcharge_cents }
          assert:
            - "surcharge_estimated == 10000"
            - "surcharge_actual == 12000"
            - "surcharge_estimated != surcharge_actual"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (two instances, different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: utility_surcharge_tiered_min_max_mode_a
        grounds:
          - calculations.utility_surcharge
        distinguishing_aspect: |
          Mode (a): tiered rate selection with nested min/max over three
          brackets. An excess of 150000 cents straddles TIER_A_CAP (100000)
          and TIER_B_CAP (500000): tiered = 100000*0.50 + 50000*0.75 = 87500,
          exercising the middle min(excess, TIER_B_CAP) - TIER_A_CAP branch;
          a smaller excess of 48000 stays entirely in tier A (24000).
        test_recipe:
          setup:
            - "Plant P with utility baselines kwh=1.0, gal=2.0"
            - "COG customer C1 with May clean lbs 4000 (share 50% of 8000)"
            - "COG customer C2 with June clean lbs 8000 (share 50% of plant 16000) — June reading pinned: kwh_used=26600, gallons_used=54000, clean_lbs_processed=16000, rates 10/2 → actual=374000; baseline=16000*1.0*10 + 16000*2.0*2 = 224000; excess=150000; tiered=87500; surcharge=43750"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/linen-categories"
              payload: { code: "SHEET", piece_weight_lb: 4.0, wash_formula_code: "WF_STANDARD", hygienic_test_required: false, replacement_cost_cents: 4000, cog_wash_rate_cents_per_lb: 100 }
              as: PlantAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C2", customer_kind: "HOSPITALITY", billing_mode: "COG", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-06-10", driver_name: "D1" }
              as: RouteDriver
              captures: { r_id: $.data.id }
            - call: "POST /routes/${r_id}/stops"
              payload: { customer_id: "${c2_id}", sequence_index: 1, declared_soiled_weight_lb: 8000.0 }
              as: RouteDriver
              captures: { s_id: $.data.id }
            - call: "POST /routes/${r_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/pickup"
              payload: { carts: [ { cart_tag: "CART-1", scale_weight_lb: 8000.0 } ] }
              as: RouteDriver
            - call: "GET /stops/${s_id}/carts"
              as: PlantOperator
              captures: { cart_id: "$.data[0].id" }
            - call: "POST /carts/${cart_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches"
              payload: { stop_id: "${s_id}" }
              as: PlantOperator
              captures: { b_id: $.data.id }
            - call: "POST /sort-batches/${b_id}/items"
              payload: { category_id: "${cat_id}", pieces: 2000, disposition: "ACCEPTED" }
              as: PlantOperator
            - call: "POST /sort-batches/${b_id}/lock"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches/${b_id}/post"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads"
              payload: { batch_id: "${b_id}", category_id: "${cat_id}", machine_id: "M1", scheduled_start: "2026-06-10T08:00:00Z", scheduled_end: "2026-06-10T09:00:00Z" }
              as: PlantOperator
              captures: { l1_id: $.data.id }
            - call: "POST /wash-loads/${l1_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l1_id}/finish-cycle"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l1_id}/bypass-test"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l1_id}/unload"
              payload: {}
              as: PlantOperator
            - call: "POST /plants/${p_id}/utility-readings"
              payload: { period_month: "2026-06", kwh_used: 26600, gallons_used: 54000, clean_lbs_processed: 16000, kwh_rate_cents: 10, gallon_rate_cents: 2 }
              as: BillingClerk
          trigger:
            - call: "GET /customers/${c2_id}/billing-preview?billing_period_start=2026-06-01&billing_period_end=2026-07-01"
              payload: { billing_period_start: "2026-06-01", billing_period_end: "2026-07-01" }
              as: BillingClerk
              captures: { surcharge: $.data.utility_surcharge_cents }
          assert:
            - "surcharge == 43750"

      - name: cog_rounding_order_per_category_then_discount_mode_b
        grounds:
          - calculations.cog_linen_charge
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round per-category gross
          to whole cents first, then apply the volume discount per category,
          then sum. Pinned inputs produce 485971 cents; the forbidden order
          (discount before rounding) produces 485970 cents — a 1-cent
          divergence the test must distinguish.
        test_recipe:
          setup:
            - "Plant P"
            - "Category CAT_ODD: piece_weight_lb=10.005, cog_wash_rate_cents_per_lb=100, no hygienic test"
            - "Category CAT_BULK: piece_weight_lb=100.0, cog_wash_rate_cents_per_lb=100, no hygienic test"
            - "COG customer C"
            - "Stop picked up, carts received, batch with 1 ACCEPTED piece of CAT_ODD and 50 ACCEPTED pieces of CAT_BULK, locked+posted"
            - "Two FINISHED wash loads: L_ODD (1 piece → 10.005 lb) and L_BULK (50 pieces → 5000.0 lb); total volume 5010.005 lb >= TIER1_LBS=5000 → 3% discount"
            - "CAT_ODD: gross=round(10.005*100)=round(1000.5)=1001; net=round(1001*0.97)=round(970.97)=971"
            - "CAT_BULK: gross=500000; net=round(485000.0)=485000; total=485971"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/linen-categories"
              payload: { code: "CAT_ODD", piece_weight_lb: 10.005, wash_formula_code: "WF_STANDARD", hygienic_test_required: false, replacement_cost_cents: 1000, cog_wash_rate_cents_per_lb: 100 }
              as: PlantAdmin
              captures: { cat_odd_id: $.data.id }
            - call: "POST /plants/${p_id}/linen-categories"
              payload: { code: "CAT_BULK", piece_weight_lb: 100.0, wash_formula_code: "WF_STANDARD", hygienic_test_required: false, replacement_cost_cents: 1000, cog_wash_rate_cents_per_lb: 100 }
              as: PlantAdmin
              captures: { cat_bulk_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "COG", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-05-02", driver_name: "D1" }
              as: RouteDriver
              captures: { r_id: $.data.id }
            - call: "POST /routes/${r_id}/stops"
              payload: { customer_id: "${c_id}", sequence_index: 1, declared_soiled_weight_lb: 5010.0 }
              as: RouteDriver
              captures: { s_id: $.data.id }
            - call: "POST /routes/${r_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/pickup"
              payload: { carts: [ { cart_tag: "CART-1", scale_weight_lb: 5010.0 } ] }
              as: RouteDriver
            - call: "GET /stops/${s_id}/carts"
              as: PlantOperator
              captures: { cart_id: "$.data[0].id" }
            - call: "POST /carts/${cart_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches"
              payload: { stop_id: "${s_id}" }
              as: PlantOperator
              captures: { b_id: $.data.id }
            - call: "POST /sort-batches/${b_id}/items"
              payload: { category_id: "${cat_odd_id}", pieces: 1, disposition: "ACCEPTED" }
              as: PlantOperator
            - call: "POST /sort-batches/${b_id}/items"
              payload: { category_id: "${cat_bulk_id}", pieces: 50, disposition: "ACCEPTED" }
              as: PlantOperator
            - call: "POST /sort-batches/${b_id}/lock"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches/${b_id}/post"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads"
              payload: { batch_id: "${b_id}", category_id: "${cat_odd_id}", machine_id: "M1", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T09:00:00Z" }
              as: PlantOperator
              captures: { l_odd_id: $.data.id }
            - call: "POST /wash-loads/${l_odd_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_odd_id}/finish-cycle"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_odd_id}/bypass-test"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_odd_id}/unload"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads"
              payload: { batch_id: "${b_id}", category_id: "${cat_bulk_id}", machine_id: "M1", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T11:00:00Z" }
              as: PlantOperator
              captures: { l_bulk_id: $.data.id }
            - call: "POST /wash-loads/${l_bulk_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_bulk_id}/finish-cycle"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_bulk_id}/bypass-test"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_bulk_id}/unload"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /customers/${c_id}/invoices/generate"
              payload: { billing_period_start: "2026-05-01", billing_period_end: "2026-06-01" }
