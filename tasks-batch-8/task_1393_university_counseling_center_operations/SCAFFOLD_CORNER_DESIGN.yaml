              captures: { l1_sh: $.data.id, l1_shv: $.data.version }
          trigger:
            - call: "POST /ucc/crisis-shifts/${l1_sh}/claim"
              payload: { expected_crisis_shift_version: "${l1_shv}" }
              as: Counselor
              as_user_id: "${l1_c}"
              captures: { l1_st: $.data.status, l1_v2: $.data.version, l1_claimant: $.data.claimed_by_id }
          assert:
            - "claim succeeds: status == CLAIMED, claimed_by_id == counselor id"
            - "version == captured version + 1 (exactly one increment)"

      - name: cascading_side_effects_exhaustion_three_hop
        claim_type: cascade_end_to_end
        grounds:
          - state_machines.CareEpisode.OPEN_to_EXHAUSTED
        excluded_because:
          difficulty_instance: transitive_cascade / referral_accept_episode_session_cascade
          rationale: "The exhaustion cascade (completion -> ledger -> EXHAUSTED -> referral + session cancellation) is asserted end-to-end in the named §1.8 instance."

      - name: derived_field_reconciliation_on_excuse
        claim_type: derived_field
        grounds:
          - calculations.session_consumption_ledger
          - calculations.no_show_strike_total
        excluded_because:
          difficulty_instance: compensating_invariant / noshow_charge_excuse_restores_consumption_and_strikes
          rationale: "Derived counters (sessions_consumed, no_show_strike_count) reconciling after a compensating action is exactly the named §1.9 sibling rule's §1.8 instance."

      - name: rate_threshold_restricted_at_limit_minus_one
        claim_type: threshold_boundary
        grounds:
          - state_machines.Student.CLEAR_to_RESTRICTED
          - calculations.no_show_strike_total
        distinguishing_aspect: "Posture lands RESTRICTED exactly at strike_limit - 1 (not before, not after): with limit 3, strikes==2 -> RESTRICTED; RESTRICTED booking without director_override -> ERR_BOOKING_SUSPENDED; with override flag -> succeeds."
        test_recipe:
          setup: ["policy strike limit 3; student with 2 charged no-shows (posture RESTRICTED); one more future booking attempted twice"]
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-L4", full_name: "Coun L4", specialties: ["GEN"], weekly_individual_capacity: 20, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { l4_c: $.data.id }
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 8, no_show_strike_limit: 3, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { l4_pol: $.data.id }
            - call: "POST /ucc/policies/${l4_pol}/publish"
              payload: {}
              as: ClinicalDirector
            - call: "POST /ucc/students"
              payload: { student_number: "L400", full_name: "Restrict Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { l4_s: $.data.id }
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${l4_s}", screener_id: "${l4_c}", phq9_score: 10, gad7_score: 8, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${l4_c}"
              captures: { l4_ia: $.data.id }
            - call: "POST /ucc/intake-assessments/${l4_ia}/complete"
              payload: { primary_counselor_id: "${l4_c}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${l4_c}"
            - call: "GET /ucc/episodes"
              payload: { student_id: "${l4_s}" }
              as: Counselor
              as_user_id: "${l4_c}"
              captures: { l4_ep: "$.data[0].id", l4_epv: "$.data[0].version" }
            - call: "POST /ucc/episodes/${l4_ep}/sessions"
              payload: { counselor_id: "${l4_c}", starts_at: "2026-08-02T09:00:00Z", duration_minutes: 60, expected_episode_version: "${l4_epv}" }
              as: FrontDesk
              captures: { l4_s1: $.data.id }
            - call: "POST /ucc/episodes/${l4_ep}/sessions"
              payload: { counselor_id: "${l4_c}", starts_at: "2026-08-02T11:00:00Z", duration_minutes: 60, expected_episode_version: "${l4_epv} + 1" }
              as: FrontDesk
              captures: { l4_s2: $.data.id }
            - call: "POST /ucc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /ucc/sessions/${l4_s1}/mark-no-show"
              payload: { chargeable: true }
              as: Counselor
              as_user_id: "${l4_c}"
            - call: "POST /ucc/sessions/${l4_s2}/mark-no-show"
              payload: { chargeable: true }
              as: Counselor
              as_user_id: "${l4_c}"
            - call: "GET /ucc/episodes/${l4_ep}"
              payload: {}
              as: Counselor
              as_user_id: "${l4_c}"
              captures: { l4_epv2: $.data.version }
          trigger:
            - call: "GET /ucc/students/${l4_s}"
              payload: {}
              as: ClinicalDirector
              as_user_id: "${l4_c}"
              captures: { l4_posture: $.data.booking_posture }
            - call: "POST /ucc/episodes/${l4_ep}/sessions"
              payload: { counselor_id: "${l4_c}", starts_at: "2026-08-10T09:00:00Z", duration_minutes: 60, expected_episode_version: "${l4_epv2}" }
              as: FrontDesk
              captures: { err_restr: $.data.error_id }
            - call: "POST /ucc/episodes/${l4_ep}/sessions"
              payload: { counselor_id: "${l4_c}", starts_at: "2026-08-10T09:00:00Z", duration_minutes: 60, expected_episode_version: "${l4_epv2}", director_override: true }
              as: FrontDesk
              captures: { l4_ses3: $.data.id }
          assert:
            - "posture == RESTRICTED at strikes == limit-1 (2 of 3)"
            - "booking without override -> ERR_BOOKING_SUSPENDED"
            - "booking with director_override: true succeeds (RESTRICTED is overridable; SUSPENDED is not)"

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_cascade_visible_in_same_read
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Session.SCHEDULED_to_NO_SHOW_CHARGED
        distinguishing_aspect: "Under the immediate consistency model, the no-show cascade's effects (session status, episode consumption, student posture) are ALL visible in the very next GETs with no staleness window."
        test_recipe:
          setup: ["student with OPEN episode and one past session"]
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-M1", full_name: "Coun M1", specialties: ["GEN"], weekly_individual_capacity: 20, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { m1_c: $.data.id }
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 8, no_show_strike_limit: 5, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { m1_pol: $.data.id }
            - call: "POST /ucc/policies/${m1_pol}/publish"
              payload: {}
              as: ClinicalDirector
            - call: "POST /ucc/students"
              payload: { student_number: "M100", full_name: "Consist Stud", enrollment_status: "ENROLLED", funding_model: "INSURANCE" }
              as: FrontDesk
              captures: { m1_s: $.data.id }
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${m1_s}", screener_id: "${m1_c}", phq9_score: 10, gad7_score: 8, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${m1_c}"
              captures: { m1_ia: $.data.id }
            - call: "POST /ucc/intake-assessments/${m1_ia}/complete"
              payload: { primary_counselor_id: "${m1_c}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${m1_c}"
            - call: "GET /ucc/episodes"
              payload: { student_id: "${m1_s}" }
              as: Counselor
              as_user_id: "${m1_c}"
              captures: { m1_ep: "$.data[0].id", m1_epv: "$.data[0].version" }
            - call: "POST /ucc/episodes/${m1_ep}/sessions"
              payload: { counselor_id: "${m1_c}", starts_at: "2026-08-02T09:00:00Z", duration_minutes: 60, expected_episode_version: "${m1_epv}" }
              as: FrontDesk
              captures: { m1_ses: $.data.id }
            - call: "POST /ucc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ClinicalDirector
          trigger:
            - call: "POST /ucc/sessions/${m1_ses}/mark-no-show"
              payload: { chargeable: true }
              as: Counselor
              as_user_id: "${m1_c}"
            - call: "GET /ucc/sessions/${m1_ses}"
              payload: {}
              as: Counselor
              as_user_id: "${m1_c}"
              captures: { m1_ses_st: $.data.status, m1_ses_bill: $.data.billed_amount_cents }
            - call: "GET /ucc/episodes/${m1_ep}"
              payload: {}
              as: Counselor
              as_user_id: "${m1_c}"
              captures: { m1_consumed: $.data.sessions_consumed }
            - call: "GET /ucc/students/${m1_s}"
              payload: {}
              as: ClinicalDirector
              as_user_id: "${m1_c}"
              captures: { m1_strikes: $.data.no_show_strike_count }
          assert:
            - "immediately after the 200 from mark-no-show: session status NO_SHOW_CHARGED, billed 6000 (INSURANCE share of 7500)"
            - "episode.sessions_consumed == 1 and student.no_show_strike_count == 1 in the same read-your-writes instant — no eventual-consistency lag"
