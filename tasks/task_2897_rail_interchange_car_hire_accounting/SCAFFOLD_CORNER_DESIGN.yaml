            - call: "GET /car-hire/junctions/${jct_id}"
              payload: {}
              as: ""
              note: "no X-User-Role header at all"
              captures: { c401: "$.data.error_id", m401: "$.data.message" }
            - call: "GET /car-hire/junctions/88888888-8888-4888-8888-888888888888"
