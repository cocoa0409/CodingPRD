  - method: GET
    path: "/nabs/orders"
    description: "List orders"
    roles: [PlatformAdmin, ShopStaff, Member]
    code: 200
    input: ["limit?", "offset?", "member_id?", "channel?", "fulfillment_status?"]
    output: Order[]
    side_effects: []
  - method: GET
    path: "/nabs/orders/{id}"
    description: "Fetch order"
    roles: [PlatformAdmin, ShopStaff, Member]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/nabs/orders/{id}/lines"
    description: "Reverse-reachability: lines under order"
    roles: [PlatformAdmin, ShopStaff, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: POST
    path: "/nabs/orders/{id}/lines"
    description: "Add line to DRAFT order"
    roles: [Member, ShopStaff]
    code: 201
    input: ["sku_id", "qty"]
    output: OrderLine
    side_effects: ["Order.subtotal_cents recomputed; Order.version += 1"]
  - method: DELETE
    path: "/nabs/orders/{id}/lines/{line_id}"
    description: "Remove line from DRAFT order"
    roles: [Member, ShopStaff]
    code: 204
    input: []
    output: null
    side_effects: ["Order.subtotal_cents recomputed; Order.version += 1"]
  - method: POST
    path: "/nabs/orders/{id}/submit"
    description: "Submit DRAFT order; OCC via expected_order_version; runs all compliance + inventory + totals"
    roles: [Member, ShopStaff]
    code: 200
    input: ["expected_order_version"]
    output: Order
    side_effects: ["lot_allocation_walk", "order_total_compose", "Order.version += 1", "payment_status := AUTHORIZED", "fulfillment_status := PICKING"]
  - method: POST
    path: "/nabs/orders/{id}/pack"
    description: "PICKING -> PACKED"
    roles: [ShopStaff]
    code: 200
    input: []
    output: Order
    side_effects: ["Order.version += 1"]
  - method: POST
    path: "/nabs/orders/{id}/pickup"
    description: "PACKED -> PICKED_UP (retail); captures payment; awards loyalty"
    roles: [ShopStaff]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status := CAPTURED", "Member.loyalty balances updated", "Order.version += 1"]
  - method: POST
    path: "/nabs/orders/{id}/cancel"
    description: "Cancel DRAFT or PICKING order"
    roles: [Member, ShopStaff]
    code: 200
    input: []
    output: Order
    side_effects: ["Inventory restored; loyalty redemption reversed; payment_status := VOIDED"]
  - method: POST
    path: "/nabs/orders/{id}/shipments"
    description: "Create shipment for PACKED DTC order"
