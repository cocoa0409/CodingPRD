              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { event_id: "$.data.id" }
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "CANCEL", reason: "manufacturer withdrew" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { cancelled_state: "$.data.booking_status", v_cancelled: "$.data.version" }
          trigger:
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { err_submit: "$.data.error_id" }
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { err_approve: "$.data.error_id" }
