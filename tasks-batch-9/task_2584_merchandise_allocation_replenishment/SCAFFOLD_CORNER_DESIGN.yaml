            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 6 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s2_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 2 }
