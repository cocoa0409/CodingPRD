            - { call: "POST /v1/channels", payload: { name: "Ch FZ", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "M540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { lp: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lp}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 60 }, as: ChannelProgrammer, captures: { br: $.data.id, br_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-breaks/${br}/decision-runs", payload: { expected_break_version: "${br_v}" }, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/playlist-loops/${lp}/lock", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/channels/${ch}/go-live", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/channels/${ch}", payload: {}, as: PlatformAdmin, captures: { cv: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/publish", payload: { expected_channel_version: "${cv}" }, as: ChannelProgrammer }
            - { call: "POST /v1/rights-grants/${g}/revoke", payload: {}, as: ContentLicensing }
          trigger:
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-02" }, as: ChannelProgrammer, captures: { err: $.data.error_id } }
          assert:
            - "Channel.${ch}.channel_posture == FROZEN after the revoke (PUBLISHED loop now lacks a covering ACTIVE grant)"
            - "error_id == ERR_CHANNEL_POSTURE_FROZEN and http status == 409"

      - name: settle_from_provisional_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.RevenueReport", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Settle is legal only from FINALIZED; a PROVISIONAL report cannot settle."
        test_recipe:
          setup: ["Report rp in PROVISIONAL (generated by fin-1)"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch ST", genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/distributor-platforms", payload: { name: "P1", reporting_tier: "STANDARD" }, as: PlatformAdmin, captures: { p1: $.data.id } }
            - { call: "PATCH /v1/distributor-platforms/${p1}", payload: { target_status: "ACTIVE" }, as: PlatformAdmin }
            - { call: "POST /v1/distribution-agreements", payload: { channel_id: "${ch}", platform_id: "${p1}", rev_share_bps_below: 3000, rev_share_bps_above: 4000, tier_threshold_cents: 100000, minimum_guarantee_cents: 0, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin, captures: { ag: $.data.id } }
            - { call: "PATCH /v1/distribution-agreements/${ag}", payload: { target_status: "ACTIVE" }, as: PlatformAdmin }
            - { call: "POST /v1/_clock/set-current-utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/revenue-reports", payload: { channel_id: "${ch}", platform_id: "${p1}", period_month: "2026-09" }, as: FinanceAnalyst, as_user_id: "fin-1", captures: { rp: $.data.id } }
            - { call: "POST /v1/revenue-reports/${rp}/generate-provisional", payload: {}, as: FinanceAnalyst, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /v1/revenue-reports/${rp}/settle", payload: {}, as: FinanceController, as_user_id: "ctl-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION and RevenueReport.${rp}.report_status == PROVISIONAL"

  # ============================================================== endpoints ====
  - section: endpoints
    instances:
      - name: list_pagination_defaults_and_bounds
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "Default limit is 10 with total_count/has_more in the envelope; limit=2 pages with has_more true then offset=2 returns the tail; limit=0 violates the envelope minimum (1) with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Three campaigns exist"]
          setup_api_calls:
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "A", iab_category: "IAB-1", total_budget_cents: 5000, daily_budget_cents: 5000, cpm_cents: 100, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c1: $.data.id } }
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "B", iab_category: "IAB-2", total_budget_cents: 5000, daily_budget_cents: 5000, cpm_cents: 100, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c2: $.data.id } }
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "C", iab_category: "IAB-3", total_budget_cents: 5000, daily_budget_cents: 5000, cpm_cents: 100, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c3: $.data.id } }
          trigger:
            - { call: "GET /v1/ad-campaigns", payload: {}, as: AdOps }
            - { call: "GET /v1/ad-campaigns?limit=2", payload: {}, as: AdOps }
            - { call: "GET /v1/ad-campaigns?limit=2&offset=2", payload: {}, as: AdOps }
            - { call: "GET /v1/ad-campaigns?limit=0", payload: {}, as: AdOps, captures: { err: $.data.error_id } }
          assert:
            - "Default page: total_count == 3, has_more == false, 3 items"
            - "limit=2: 2 items, has_more == true; limit=2&offset=2: 1 item, has_more == false"
            - "limit=0 rejected: error_id == ERR_INVALID_REQUEST"

      - name: list_filter_by_campaign_status
        claim_type: listing
        grounds: ["endpoints"]
        distinguishing_aspect: "Filter + list interaction: ?campaign_status=ACTIVE returns only the ACTIVE campaign, not the DRAFT one."
        test_recipe:
          setup: ["Campaign c_draft (DRAFT); campaign c_active with an APPROVED creative, ACTIVATED"]
          setup_api_calls:
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Drafty", iab_category: "IAB-1", total_budget_cents: 5000, daily_budget_cents: 5000, cpm_cents: 100, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c_draft: $.data.id } }
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Live", iab_category: "IAB-2", total_budget_cents: 5000, daily_budget_cents: 5000, cpm_cents: 100, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c_active: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${c_active}", brand: "Live Brand", iab_category: "IAB-2", duration_seconds: 30 }, as: AdOps, as_user_id: "ops-1", captures: { crv: $.data.id } }
            - { call: "POST /v1/ad-creatives/${crv}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/ad-campaigns/${c_active}/activate", payload: {}, as: AdOps, as_user_id: "ops-1" }
          trigger:
            - { call: "GET /v1/ad-campaigns?campaign_status=ACTIVE", payload: {}, as: AdOps }
          assert:
            - "Filtered list contains exactly 1 item with id == ${c_active}; ${c_draft} absent"

      - name: response_envelope_shape_success_and_error
        claim_type: response_envelope
        grounds: ["response_envelope"]
        distinguishing_aspect: "Success envelope carries meta.api_request_id, meta.api_request_timestamp, response_type; error envelope carries data.error_id and data.message."
        test_recipe:
          setup: ["One channel exists"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch Env", genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { ch: $.data.id } }
          trigger:
            - { call: "GET /v1/channels", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/channels/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "List response: meta.api_request_id present, meta.api_request_timestamp present, response_type == \"array\""
            - "Error response: response_type == \"error\" and data.error_id == ERR_NOT_FOUND and data.message present"

      - name: fk_reverse_reachability_filtered_lists
        claim_type: retrieval
        grounds: ["entities.PlaylistEntry.fields.loop_id", "entities.FillDecision.fields.break_id", "entities.RevenueReport.fields.platform_id"]
        distinguishing_aspect: "Every FK is reverse-reachable: children are listable by their parent FKs (entries by loop_id, decisions by break_id, reports by platform_id)."
        test_recipe:
          setup: ["Channel ch; content ct540 AVAILABLE; loop lp with one entry of ct"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch FK", genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "M540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { lp: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lp}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer, captures: { en: $.data.id } }
          trigger:
            - { call: "GET /v1/playlist-entries?loop_id=${lp}", payload: {}, as: ChannelProgrammer }
            - { call: "GET /v1/playlist-loops?channel_id=${ch}", payload: {}, as: ChannelProgrammer }
            - { call: "GET /v1/rights-grants?content_id=${ct}", payload: {}, as: ContentLicensing }
          assert:
            - "Entries by loop_id: exactly [${en}]"
            - "Loops by channel_id: exactly [${lp}]"
            - "Grants by content_id: [] (none created) — filtered list works for empty result"

  # ================================================================= errors ====
  - section: errors
    instances:
      - name: err_channel_not_live_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_CHANNEL_NOT_LIVE]"]
        excluded_because:
          difficulty_instance: r7_loop_publish_requires_channel_live
          rationale: "Asserted as the failure path of the cross-entity dependency instance."

      - name: err_stale_channel_version_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_CHANNEL_VERSION]"]
        excluded_because:
          difficulty_instance: r9_publish_supersede_conserves_single_published_loop
          rationale: "Publish OCC path (fresh versions) is exercised there; the stale failure is covered by corner instance publish_with_stale_channel_version_rejected."

      - name: err_loop_not_tiled_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_LOOP_NOT_TILED]"]
        excluded_because:
          difficulty_instance: r6_loop_validate_requires_exact_second_tiling
          rationale: "Boundary failure asserted there."

      - name: err_grant_window_overlap_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_GRANT_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: r8_rights_grant_half_open_windows_allow_adjacency
          rationale: "Interior-overlap rejection asserted there."

      - name: err_agreement_window_overlap_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_AGREEMENT_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: r8_distribution_agreement_closed_windows_reject_adjacency
          rationale: "Closed-interval adjacency rejection asserted there."

      - name: err_category_mismatch_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_CATEGORY_MISMATCH]"]
        excluded_because:
          difficulty_instance: r5_creative_category_mismatch_trumps_duration_quality
          rationale: "Asserted as the winning error of the referential-vs-safety priority conflict."

      - name: err_broadcast_date_in_past_at_publish_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_BROADCAST_DATE_IN_PAST]"]
        excluded_because:
          difficulty_instance: r5_publish_state_trumps_temporal_broadcast_date
          rationale: "The temporal member of the priority pair is asserted NOT to surface (state wins); the create-time trigger is covered by corner instance loop_create_with_past_broadcast_date_rejected."

