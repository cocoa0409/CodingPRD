            - "ClubCardApplication.${ca_id}.status == UNDERWRITING after the rejection, and underwriter_user_id == \"uw_2201\""
            - "the decision by a different operator succeeds and ClubCardApplication.${ca_id}.status == APPROVED with credit_limit_cents == 300000"
            - "the seal by the operator who recorded the sale in the batch is rejected with the same data.error_id == ERR_SEGREGATION_OF_DUTIES, a different route and a different rule body"
            - "PermitRemitBatch.${b_id}.status == OPEN after the rejected seal"

  # =========================================================================
  # Section: rbac
  # =========================================================================
  - section: rbac
    instances:

      - name: member_cannot_contract_or_settle_a_deal
        claim_type: role_cannot_perform_exclusive_operation
        grounds:
          - roles.DealDeskClerk.exclusive_operations
          - roles.FinanceAdmin.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "The role matrix denies a member both the sales-desk contract action and the finance settlement action, so the two exclusive-operation sets are enforced on separate routes."
        test_recipe:
          setup: ["a store, one member, one boat unit and one quoted deal"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_rb@x.com", full_name: "Rory Bell", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-9001", model_name: "Angler 190", unit_price_cents: 9000000, motor_price_cents: 1800000, trailer_price_cents: 350000, unit_condition: "NEW", hull_id_no: "HIN9001AA000" }
              as: DealDeskClerk
              captures: { bu_id: $.data.id }
            - call: "POST /stores/${st_id}/boat-deals"
              payload: { member_id: "${m_id}", boat_unit_id: "${bu_id}" }
              as: DealDeskClerk
              captures: { d_id: $.data.id, d_v: $.data.version }
          trigger:
            - call: "POST /stores/boat-deals/${d_id}/contract"
              payload: { expected_deal_version: "${d_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
            - call: "POST /stores/boat-deals/${d_id}/settle"
              payload: { expected_deal_version: "${d_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "the contract attempt is rejected with data.error_id == ERR_FORBIDDEN_ROLE and http 403"
            - "the settle attempt is rejected with data.error_id == ERR_FORBIDDEN_ROLE and http 403"
            - "BoatDeal.${d_id}.deal_stage == QUOTED and BoatDeal.${d_id}.version is unchanged after both rejections"
            - "both rejections are 403 rather than 401, so the member role was recognised and refused rather than treated as anonymous"

      - name: attraction_host_and_events_coordinator_have_disjoint_exclusive_sets
        claim_type: role_cannot_perform_exclusive_operation
        grounds:
          - roles.AttractionHost.exclusive_operations
          - roles.EventsCoordinator.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "The floor host owns session execution while the calendar owner owns offerings, so each is refused on the other's exclusive routes."
        test_recipe:
          setup: ["a store with an open aquarium venue and one member"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
