        excluded_because:
          difficulty_instance: dual_variant_calc / readiness_basis_variant_divergence_on_submitted_correction
          rationale: "Both bases are read against identical stored data there and the projected score is strictly higher by the excluded finding's weight."

      - name: rate_threshold_trigger_at_the_posture_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.site_oversight_posture
        excluded_because:
          difficulty_instance: boundary_precision_check / oversight_posture_walks_inclusive_weight_thresholds_six_and_sixteen
          rationale: "The cumulative weight thresholds 6.0 and 16.0 are walked from below to exactly-at there, which is the rate/threshold boundary claim for this layer."

  # ===========================================================================
  # Section 9 - Consistency model (claim-extraction-guide "From Consistency
  # Model"): consistency_model == immediate.
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: issue_response_carries_the_recomputed_readiness_and_weight_with_no_lag
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /poct/inspections/{id}/issue]
          - calculations.site_inspection_readiness_score
          - calculations.site_oversight_posture
        distinguishing_aspect: |
          Under an immediate model the mutating response itself must already carry
          the recomputed derived state: readiness_score_at_issue is snapshotted in
          the issue response, and the very next reads of the site, its readiness
          breakdown and its devices agree with it exactly - no second pass, no
          re-read tolerance, and the manual-entry gate is already closed for a
          result captured microseconds later.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered WAIVED site, one trained operator, one MANUAL_ENTRY device, VERIFIED lot; posture OPEN and readiness 100.00 immediately before the issue."
            - "An in-progress survey holds two DRAFT findings: CONDITION_LEVEL (8.0) and STANDARD_LEVEL (3.0), neither a repeat, so the issued total is 11.00."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243055", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Cath Lab POCT", department_code: "DEPT-5200", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Yusuf Delacroix", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /poct/operators/${op_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-20" }
              as: QualityCoordinator
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-5200", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "MANUAL_ENTRY", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Reagent Fridge 1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su_id}", device_model: "GLUCO-9", lot_number: "LOT-A1", expiration_date: "2027-01-31", received_at: "2026-09-01T08:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_id}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_1", measured_value: 100.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qc1_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_id}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_2", measured_value: 300.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qc2_id: $.data.id }
            - call: "POST /poct/reagent-lots/${lot_id}/verify"
              payload: { level_1_qc_run_id: "${qc1_id}", level_2_qc_run_id: "${qc2_id}" }
              as: QualityCoordinator
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { ready_before: $.data.inspection_readiness_score, posture_before: $.data.oversight_posture, blocked_before: $.data.manual_entry_blocked }
            - call: "POST /poct/inspections"
              payload: { site_id: "${site_id}", inspection_type: "COMPLAINT_SURVEY", scheduled_date: "2026-09-01" }
              as: Surveyor
              as_user_id: "user-surveyor-9"
              captures: { insp_id: $.data.id }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_id}", category: "RESULT_REPORTING", severity: "CONDITION_LEVEL", description: "manually entered results posted without second-person review", correction_due_date: "2026-10-01" }
              as: Surveyor
              as_user_id: "user-surveyor-9"
              captures: { def_a: $.data.id }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_id}", category: "QUALITY_CONTROL", severity: "STANDARD_LEVEL", description: "control log missing two days", correction_due_date: "2026-10-01" }
              as: Surveyor
              as_user_id: "user-surveyor-9"
              captures: { def_b: $.data.id }
          trigger:
            - call: "POST /poct/inspections/${insp_id}/issue"
              payload: { issued_on: "2026-09-01" }
              as: Surveyor
              as_user_id: "user-surveyor-9"
              captures: { issued_total: $.data.issued_weight_total, snap: $.data.readiness_score_at_issue, insp_status: $.data.status }
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { ready_after: $.data.inspection_readiness_score, weight_after: $.data.open_deficiency_weight, posture_after: $.data.oversight_posture, blocked_after: $.data.manual_entry_blocked }
            - call: "GET /poct/sites/${site_id}/readiness"
              as: Surveyor
              captures: { score_read: $.data.score, def_pen: $.data.deficiency_penalty, weight_read: $.data.open_deficiency_weight }
            - call: "GET /poct/devices/${dev_id}"
              as: QualityCoordinator
              captures: { dev_suspended: $.data.manual_entry_suspended, dev_status: $.data.status }
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev_id}", operator_id: "${op_id}", reagent_lot_id: "${lot_id}", patient_mrn: "MRN-5201", analyte: "GLUCOSE", measured_value: 108.0, entry_mode: "MANUAL", manual_entry_reason: "interface still down" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "${ready_before} == 100.00, ${posture_before} == \"OPEN\" and ${blocked_before} == false"
            - "the issue response already carries ${issued_total} == 11.00 and ${snap} == 72.50 (100 - round(11.00 * 2.5, 2)) with ${insp_status} == \"DEFICIENCIES_ISSUED\""
            - "${ready_after} == 72.50 == ${score_read} == ${snap}, ${weight_after} == 11.00 == ${weight_read} and ${def_pen} == 27.50 - the mutating response and the two subsequent reads agree exactly"
            - "${posture_after} == \"RESTRICTED\" (11.00 >= 6.0) and ${blocked_after} == true in the FIRST read after the issue"
            - "${dev_status} == \"ACTIVE\" while ${dev_suspended} == true - the posture gate reached the device in the same request"
            - "the manual result returns HTTP 422 with ${err} == \"ERR_MANUAL_ENTRY_NOT_PERMITTED\" - no propagation delay is tolerated"
            - "DeficiencyFinding.${def_a}.weight == 8.00 and DeficiencyFinding.${def_b}.weight == 3.00, both pinned at issuance"
