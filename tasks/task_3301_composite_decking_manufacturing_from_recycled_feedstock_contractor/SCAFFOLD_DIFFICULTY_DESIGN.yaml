  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: line_slot_same_day_exclusion
        grounds:
          - validations[priority=8]
          - errors.ERR_CAPACITY_EXCEEDED
          - endpoints.POST_/decking/plants/{id}/production-runs
        distinguishing_aspect: |
          Slot-identity semantics on ProductionRun: a line slot is occupied for
          a whole production_date regardless of minutes — with lines == 1, two
          runs dated the same day collide and the second is rejected
          ERR_CAPACITY_EXCEEDED, while the same run dated the next day succeeds
          on the same slot (date-adjacency is not overlap).
        test_recipe:
          setup:
            - "Plant with lines == 1; one ACTIVE line; run R1 dated 2026-03-02 already scheduled."
          setup_api_calls:
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OpsManager
            - call: "POST /decking/plants"
              payload: { name: "Winchester", daily_capacity_lf: 10000, lines: 1, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
              captures: { plant_id: $.data.id, plant_v0: $.data.version }
            - call: "POST /decking/formulations"
              payload: { name: "F1", lines: [{ material: "VIRGIN_PE", weight_fraction_bp: 5000 }, { material: "WOOD_FLOUR", weight_fraction_bp: 5000 }] }
              as: ProcessEngineer
              captures: { form_id: $.data.id }
