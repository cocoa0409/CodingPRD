            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Yarrow Field Aid", county: "CENTRAL", quarterly_voucher_quota: 4 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
