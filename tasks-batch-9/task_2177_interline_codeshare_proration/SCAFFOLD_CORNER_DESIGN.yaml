# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against §1.1-§1.7.
# Corners already exercised by a §1.8 instance are emitted as
# `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: carrier_registration_initialises_every_balance_and_counter
        claim_type: Creation
        grounds:
          - entities.Carrier.fields.status
          - entities.Carrier.fields.pending_receivable_minor
          - entities.Carrier.fields.audit_flag
          - endpoints["POST /interline/carriers"]
        distinguishing_aspect: "A freshly registered carrier returns 201 with status ACTIVE, version 1, every one of the four balance fields, both mileage counters, open_reproration_count at 0 and audit_flag false."
        test_recipe:
          setup: ["Empty database; logical clock untouched, so it reads the 2026-08-01T00:00:00Z default."]
          setup_api_calls: []
          trigger:
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 5000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
          assert:
            - "HTTP status 201 and response_type == object"
            - "Carrier.${aa}.status == ACTIVE and Carrier.${aa}.version == 1"
            - "Carrier.${aa}.pending_receivable_minor == 0, pending_payable_minor == 0, settled_receivable_minor == 0, settled_payable_minor == 0, net_position_minor == 0"
            - "Carrier.${aa}.period_accrued_miles == 0, period_ffp_cost_estimate_minor == 0, period_ffp_cost_trued_up_minor == 0, ffp_true_up_delta_minor == 0"
            - "Carrier.${aa}.open_reproration_count == 0 and Carrier.${aa}.audit_flag == false"
            - "Carrier.${aa}.created_at == 2026-08-01T00:00:00.000Z — the logical clock default, not real wall-clock time"

      - name: carrier_id_is_a_bare_uuid_minted_by_the_server
        claim_type: System Fields
        grounds:
          - entities.Carrier.common_fields
          - endpoints["GET /interline/carriers/{id}"]
        distinguishing_aspect: "The id returned for a carrier is a bare 36-character UUID with no type prefix, and GET on that id returns the identical stored row."
        test_recipe:
          setup: ["One registered carrier."]
          setup_api_calls:
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "EUR", credit_limit_minor: 7500000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
          trigger:
            - call: "GET /interline/carriers/${bb}"
              payload: {}
              as: ClearinghouseOperator
          assert:
            - "The id matches ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ and carries no prefix such as car_"
            - "Carrier.${bb}.iata_code == BB, name == Borealis Airways, base_currency == EUR, credit_limit_minor == 7500000"
            - "created_at and updated_at are equal on an unmutated row and both end in three fractional digits followed by Z"

      - name: settlement_currency_defaults_to_usd_when_omitted
        claim_type: Defaults
        grounds:
          - entities.SettlementPeriod.fields.settlement_currency
          - endpoints["POST /interline/settlement-periods"]
        distinguishing_aspect: "Omitting the optional settlement_currency on a settlement period yields USD, and status defaults to OPEN with cleared_invoice_count 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /interline/settlement-periods"
              payload: { period_code: "2026-08-P1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_deadline: "2026-09-05T00:00:00Z", rate_fixing_date: "2026-09-06T00:00:00Z" }
              as: ClearinghouseOperator
              captures: { p1: $.data.id }
          assert:
            - "HTTP status 201"
            - "SettlementPeriod.${p1}.settlement_currency == USD"
            - "SettlementPeriod.${p1}.status == OPEN, cleared_invoice_count == 0, closed_at is null, settled_at is null"

      - name: ticket_creation_seeds_the_conservation_slack_bucket
        claim_type: Computed Fields
        grounds:
          - entities.Ticket.fields.unallocated_residual_minor
          - entities.Ticket.fields.proration_status
          - entities.Ticket.fields.billing_status
        distinguishing_aspect: "A brand-new ticket with no coupons reads unallocated_residual_minor equal to total_fare_minor, coupon_count 0, proration_status UNPRORATED, billing_status UNBILLED and last_run_type NONE."
        test_recipe:
          setup: ["One ACTIVE carrier AA."]
          setup_api_calls:
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
          trigger:
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0030000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 87654, issue_date: "2026-08-01T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
          assert:
            - "HTTP status 201"
            - "Ticket.${t1}.unallocated_residual_minor == 87654 and Ticket.${t1}.coupon_count == 0"
            - "Ticket.${t1}.proration_status == UNPRORATED and Ticket.${t1}.billing_status == UNBILLED and Ticket.${t1}.last_run_type == NONE"
            - "Ticket.${t1}.version == 1"

      - name: get_ticket_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_TICKET_NOT_FOUND]
        distinguishing_aspect: "A well-formed UUID that matches no stored ticket yields ERR_TICKET_NOT_FOUND with HTTP 404, not an empty 200."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /interline/tickets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: RevenueAccountant
              as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status 404 with data.error_id == ERR_TICKET_NOT_FOUND"
            - "response_type == error"

      - name: ticket_creation_missing_total_fare_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required total_fare_minor on ticket creation returns ERR_INVALID_REQUEST (400) and persists no Ticket row."
        test_recipe:
          setup: ["One ACTIVE carrier AA."]
          setup_api_calls:
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
          trigger:
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0031000000001", validating_carrier_id: "${aa}", sale_currency: "USD", issue_date: "2026-08-01T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /interline/tickets with validating_carrier_id ${aa} returns total_count 0"

      - name: coupon_creation_with_invalid_enum_class_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Coupon.fields.class_of_service
          - validations[priority=3]
        distinguishing_aspect: "A class_of_service outside {ECONOMY, PREMIUM, BUSINESS, FIRST} is rejected with ERR_INVALID_REQUEST (400) before any state or business check runs."
        test_recipe:
          setup: ["Carriers AA and BB ACTIVE; one ticket validated by AA."]
          setup_api_calls:
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0032000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-01T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${bb}", class_of_service: "SUPER_SAVER", tpm_miles: 1000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status 400 with data.error_id == ERR_INVALID_REQUEST"
            - "Ticket.${t1}.coupon_count == 0 and Ticket.${t1}.version == 1"

      - name: exchange_rate_row_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.ExchangeRate.common_fields
          - endpoints["POST /interline/exchange-rates"]
        distinguishing_aspect: "ExchangeRate is declared common_fields false: the created row exposes id and created_at only, no updated_at or version, and §1.5 declares no update or delete endpoint for it."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /interline/exchange-rates"
              payload: { from_currency: "EUR", to_currency: "USD", effective_date: "2026-08-05T00:00:00Z", rate_scaled: 1085000 }
              as: ClearinghouseOperator
              captures: { r1: $.data.id }
          assert:
            - "HTTP status 201 and the response body carries id, created_at, from_currency, to_currency, effective_date and rate_scaled"
            - "ExchangeRate.${r1}.rate_scaled == 1085000"
            - "No version field is present on the ExchangeRate row"

      - name: proration_runs_accumulate_as_an_append_only_log_per_ticket
        claim_type: Listing
        grounds:
          - entities.ProrationRun.common_fields
          - endpoints["GET /interline/tickets/{id}/proration-runs"]
        distinguishing_aspect: "Two successive prorations on the same ticket leave two ProrationRun rows, ordered oldest-first, each keeping its own pool and weight figures; the earlier run is never rewritten."
        test_recipe:
          setup:
            - "Carriers AA and BB ACTIVE; a USD 100000 ticket validated by AA with one 1000-tpm ECONOMY coupon operated by BB, flown."
            - "A PROVISIONAL run has been executed, followed by a FINAL run."
          setup_api_calls:
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0033000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-01T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${bb}", class_of_service: "ECONOMY", tpm_miles: 1000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c1: $.data.id }
            - call: "GET /interline/tickets/${t1}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { tv: $.data.version }
            - call: "POST /interline/tickets/${t1}/prorate"
              payload: { run_type: "PROVISIONAL", expected_ticket_version: "${tv}" }
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "POST /interline/coupons/${c1}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "GET /interline/tickets/${t1}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { tv2: $.data.version }
            - call: "POST /interline/tickets/${t1}/prorate"
              payload: { run_type: "FINAL", expected_ticket_version: "${tv2}" }
              as: RevenueAccountant
              as_user_id: "${aa}"
          trigger:
            - call: "GET /interline/tickets/${t1}/proration-runs"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
          assert:
            - "HTTP status 200, response_type == array, total_count == 2, has_more == false"
            - "The first element has run_type == PROVISIONAL, included_coupon_count == 1, pool_minor == 100000, spa_total_minor == 0"
            - "The second element has run_type == FINAL, included_coupon_count == 1, straight_rate_pool_minor == 100000"
            - "Ticket.${t1}.last_run_type == FINAL"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: flying_an_already_flown_coupon_returns_coupon_state_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Coupon.OPEN_to_FLOWN
          - validations[priority=12]
          - errors[ERR_COUPON_STATE_INVALID]
        distinguishing_aspect: "A second fly on the same coupon is rejected with ERR_COUPON_STATE_INVALID (409) and does not double-count mileage on the operating carrier."
        test_recipe:
          setup: ["Carriers AA and BB ACTIVE; a ticket validated by AA with one FIRST-class 5000-tpm coupon operated by BB, already flown."]
          setup_api_calls:
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0034000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-01T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${bb}", class_of_service: "FIRST", tpm_miles: 5000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c1: $.data.id }
            - call: "POST /interline/coupons/${c1}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
          trigger:
            - call: "POST /interline/coupons/${c1}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status 409 with data.error_id == ERR_COUPON_STATE_INVALID"
            - "Coupon.${c1}.ffp_miles_awarded == 10000 and Coupon.${c1}.ffp_accrual_cost_minor == 14000 — booked exactly once"
            - "Carrier.${bb}.period_accrued_miles == 10000 and Carrier.${bb}.period_ffp_cost_estimate_minor == 14000"

      - name: settling_an_open_period_returns_period_not_closed
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SettlementPeriod.CLOSED_to_SETTLED
          - validations[priority=8]
          - errors[ERR_PERIOD_NOT_CLOSED]
        distinguishing_aspect: "settle is reachable only from CLOSED; calling it on an OPEN period returns ERR_PERIOD_NOT_CLOSED (409) and leaves status OPEN with settled_at null."
        test_recipe:
          setup: ["One OPEN settlement period."]
          setup_api_calls:
            - call: "POST /interline/settlement-periods"
              payload: { period_code: "2026-08-P1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_deadline: "2026-09-05T00:00:00Z", rate_fixing_date: "2026-09-06T00:00:00Z", settlement_currency: "USD" }
              as: ClearinghouseOperator
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /interline/settlement-periods/${p1}/settle"
              payload: {}
              as: ClearinghouseOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status 409 with data.error_id == ERR_PERIOD_NOT_CLOSED"
            - "SettlementPeriod.${p1}.status == OPEN, settled_at is null, version == 1"

      - name: new_ticket_and_coupon_start_in_their_declared_initial_states
        claim_type: Initial State
        grounds:
          - state_machines.Ticket.initial_state
          - state_machines.Coupon.initial_state
          - state_machines.Carrier.initial_state
        distinguishing_aspect: "Carrier starts ACTIVE, Ticket starts UNPRORATED on the proration axis and UNBILLED on the billing axis, and Coupon starts OPEN with flown_at null and ffp_tier NONE."
        test_recipe:
          setup: ["Two ACTIVE carriers and one ticket."]
          setup_api_calls:
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0035000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-01T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${bb}", class_of_service: "ECONOMY", tpm_miles: 1000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c1: $.data.id }
          assert:
            - "Carrier.${aa}.status == ACTIVE and Carrier.${bb}.status == ACTIVE"
            - "Ticket.${t1}.proration_status == UNPRORATED and Ticket.${t1}.billing_status == UNBILLED"
            - "Coupon.${c1}.coupon_status == OPEN, flown_at is null, ffp_tier == NONE, allocation_basis == UNALLOCATED, allocated_amount_minor == 0, billing_invoice_id is null"
            - "Ticket.${t1}.coupon_count == 1 and Ticket.${t1}.version == 2 — adding a coupon bumps the ticket"

      - name: arbitrating_a_memo_that_never_escalated_returns_memo_state_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RejectionMemo.ARBITRATION_to_RESOLVED_UPHELD
          - validations[priority=11]
          - errors[ERR_MEMO_STATE_INVALID]
        distinguishing_aspect: "arbitrate is reachable only from ARBITRATION; invoking it on a RAISED memo returns ERR_MEMO_STATE_INVALID (409) and fires none of the five cascade hops."
        test_recipe:
          setup:
            - "Carriers AA and BB ACTIVE; a USD 100000 single-coupon ticket, invoiced BB->AA, submitted and cleared at 2026-09-06T00:00:00Z."
            - "AA has raised a stage-1 memo of 10000 that is still RAISED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/settlement-periods"
              payload: { period_code: "2026-08-P1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_deadline: "2026-09-05T00:00:00Z", rate_fixing_date: "2026-09-06T00:00:00Z", settlement_currency: "USD" }
              as: ClearinghouseOperator
              captures: { p1: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0036000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-10T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${bb}", class_of_service: "ECONOMY", tpm_miles: 1000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c1: $.data.id }
            - call: "POST /interline/coupons/${c1}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "GET /interline/tickets/${t1}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { tv: $.data.version }
            - call: "POST /interline/tickets/${t1}/prorate"
              payload: { run_type: "FINAL", expected_ticket_version: "${tv}" }
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "POST /interline/billing-invoices"
              payload: { settlement_period_id: "${p1}", billing_carrier_id: "${bb}", billed_carrier_id: "${aa}", billing_currency: "USD", coupon_ids: ["${c1}"] }
              as: RevenueAccountant
              as_user_id: "${bb}"
              captures: { inv: $.data.id }
            - call: "POST /interline/billing-invoices/${inv}/submit"
              payload: {}
              as: BillingAgent
              as_user_id: "${bb}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/settlement-periods/${p1}/close"
              payload: {}
              as: ClearinghouseOperator
            - call: "GET /interline/billing-invoices/${inv}"
              payload: {}
              as: BillingAgent
              as_user_id: "${aa}"
              captures: { iv1: $.data.version }
            - call: "POST /interline/rejection-memos"
              payload: { invoice_id: "${inv}", coupon_id: "${c1}", amount_minor: 10000, reason_code: "DUPLICATE_BILLING", expected_invoice_version: "${iv1}" }
              as: BillingAgent
              as_user_id: "${aa}"
              captures: { memo: $.data.id }
          trigger:
            - call: "POST /interline/rejection-memos/${memo}/arbitrate"
              payload: { ruling: "UPHELD" }
              as: ClearinghouseOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status 409 with data.error_id == ERR_MEMO_STATE_INVALID"
            - "RejectionMemo.${memo}.status == RAISED and resolved_at is null"
            - "Coupon.${c1}.allocated_amount_minor == 100000 and coupon_status == FLOWN"
            - "BillingInvoice.${inv}.status == CLEARED and rejected_amount_minor == 0"
            - "Carrier.${aa}.open_reproration_count == 0"

