  # ===========================================================================
  # RULE 3 - non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: lease_negotiation_cycles_negotiating_counter_pending_negotiating
        grounds:
          - state_machines.Lease.NEGOTIATING_to_COUNTER_PENDING
          - state_machines.Lease.COUNTER_PENDING_to_NEGOTIATING
          - validations[priority=40]
          - entities.Lease.fields.negotiation_round_count
        distinguishing_aspect: |
          The Lease returns to a state it already occupied: after round 1 (LANDLORD) the lease is
          NEGOTIATING, round 2 (TENANT) moves it to COUNTER_PENDING, and round 3 (LANDLORD) moves it
          back to NEGOTIATING with negotiation_round_count == 3 - a true cycle, and a second
          consecutive tenant round is refused with ERR_NOT_YOUR_TURN rather than being absorbed.
        test_recipe:
          setup:
            - "Building conversion-approved; lease L in status NEGOTIATING after the landlord's round 1 at 140.00 psf"
            - "Round 2 authored by the tenant at 175.00 psf leaves the lease in COUNTER_PENDING with proposal 1 COUNTERED"
