          A different metric and a different endpoint from the min_stable boundary: the empty-set /
          zero-count edge of forecast_load_projection reached through POST
          /district-energy/load-forecasts/{forecast_id}/publish, where the only ACTIVE agreement's
          service_end_date is exactly the forecast service_date (excluded by the strict
          service_end_date > service_date filter) and the other agreement is still
          PENDING_CAPACITY, so contributing_agreement_count == 0 and coincident_demand_kw == 0.00
