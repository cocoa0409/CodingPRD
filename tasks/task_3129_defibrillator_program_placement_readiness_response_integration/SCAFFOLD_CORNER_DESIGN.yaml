# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task: task_3129_defibrillator_program_placement_readiness_response_integration
#
# Breadth probe. Enumerates testable claims from §1.1–§1.7 not already covered
# by §1.8 difficulty design. §1.8-covered corners appear as excluded_because
# stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: campus_create_returns_full_envelope_and_initial_posture
        claim_type: Creation
        grounds:
          - entities.Campus
          - endpoints.POST_/campuses
        distinguishing_aspect: "POST /campuses with required fields returns 201 with system-minted id, created_at, updated_at, version=1, and computed readiness_posture=OPERATIONAL (no devices yet)."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/campuses"
              payload: { name: "North Campus", jurisdiction_code: "WA", jurisdiction_registration_number: "WA-PAD-100", medical_director_id: "md-tbd", response_time_target_seconds: 300 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          assert:
            - "status == 201, response_type == object"
            - "Campus.${cid}.name == 'North Campus'"
            - "Campus.${cid}.readiness_posture == OPERATIONAL"
            - "Campus.${cid}.version == 1"
            - "id, created_at, updated_at are non-null"

      - name: device_get_returns_stored_fields_and_computed_posture
        claim_type: Retrieval
        grounds:
          - entities.Device
          - endpoints.GET_/campuses/{id}/devices/{id}
        distinguishing_aspect: "GET on a REGISTERED device returns serial_number, device_model_id as posted, plus computed readiness_posture=OUT_OF_SERVICE (no installs) and status=REGISTERED."
        test_recipe:
          setup: ["Logical clock at default. Campus + DeviceModel + Device created."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "AED-X", manufacturer: "ZOLL", pad_shelf_life_months: 18, battery_shelf_life_months: 36, prescription_required: true }
              as: PlatformAdmin
              captures: { dm: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "C", jurisdiction_code: "OR", jurisdiction_registration_number: "OR-PAD-200", medical_director_id: "md-tbd", response_time_target_seconds: 180 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /api/devices"
              payload: { campus_id: "${cid}", device_model_id: "${dm }", serial_number: "SN-X-001" }
              as: ProgramManager
              captures: { dev: $.data.id }
          trigger:
            - call: "GET /api/devices/${dev}"
              payload: {}
              as: ProgramManager
          assert:
            - "Device.${dev}.serial_number == 'SN-X-001'"
            - "Device.${dev}.device_model_id == '${dm}'"
            - "Device.${dev}.status == REGISTERED"
            - "Device.${dev}.readiness_posture == OUT_OF_SERVICE"

      - name: devices_list_paginates_with_limit_offset_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/campuses/{id}/devices
          - response_envelope.pagination_fields
        distinguishing_aspect: "With 3 devices, limit=2 offset=0 returns 2 rows with total_count=3 has_more=true; offset=2 returns 1 row has_more=false."
        test_recipe:
          setup: ["Campus with 3 devices."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "AED-Y", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
              captures: { dm: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "C", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-300", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /api/devices"
              payload: { campus_id: "${cid}", device_model_id: "${dm }", serial_number: "SN-Y-001" }
              as: ProgramManager
            - call: "POST /api/devices"
              payload: { campus_id: "${cid}", device_model_id: "${dm }", serial_number: "SN-Y-002" }
              as: ProgramManager
            - call: "POST /api/devices"
              payload: { campus_id: "${cid}", device_model_id: "${dm }", serial_number: "SN-Y-003" }
              as: ProgramManager
          trigger:
            - call: "GET /api/devices"
              payload: { campus_id: "${cid}", limit: 2, offset: 0 }
              as: ProgramManager
          assert:
            - "response_type == array, total_count == 3, has_more == true, returned row count == 2"
            - "GET with limit=2 offset=2 returns 1 row, has_more == false"

      - name: device_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/campuses/{id}/devices/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID returns 404 ERR_NOT_FOUND (not 400, not generic)."
        test_recipe:
          setup: ["Campus exists; no device."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/campuses"
              payload: { name: "C", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-301", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "GET /api/devices/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: campus_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Campus
          - errors.ERR_INVALID_REQUEST
          - validations.priority_14_business_constraint
        distinguishing_aspect: "Omitting response_time_target_seconds (no default) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/campuses"
              payload: { name: "NoTarget", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-302", medical_director_id: "md-tbd" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: consumable_lot_quantity_available_defaults_to_quantity_received
        claim_type: Defaults
        grounds:
          - entities.ConsumableLot.fields.quantity_available
        distinguishing_aspect: "quantity_available is computed; on creation equals quantity_received (no installs yet)."
        test_recipe:
          setup: ["Campus, model exist."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "M-D", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
              captures: { dm: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "C", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-303", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /api/consumable-lots"
              payload: { campus_id: "${cid}", device_model_id: "${dm }", kind: "PAD", lot_code: "L1", manufacturer_expires_at: "2030-01-01T00:00:00Z", quantity_received: 7 }
              as: ProgramManager
              captures: { lot: $.data.id }
          assert:
            - "ConsumableLot.${lot}.quantity_available == 7"
            - "ConsumableLot.${lot}.quantity_received == 7"

      - name: self_test_report_is_immutable_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.SelfTestReport
        distinguishing_aspect: "SelfTestReport has common_fields=false — no version field, no PUT/PATCH endpoint exists. POST appends a new row; id and created_at still server-minted."
        test_recipe:
          setup: ["Campus, model, device."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "M-IM", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
              captures: { dm: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "C", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-304", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /api/devices"
              payload: { campus_id: "${cid}", device_model_id: "${dm }", serial_number: "SN-IM-1" }
              as: ProgramManager
              captures: { dev: $.data.id }
          trigger:
            - call: "POST /api/self-test-reports"
              payload: { device_id: "${dev}", reported_at: "2026-09-01T01:00:00Z", result: "PASS" }
              as: System
              captures: { rpt: $.data.id }
          assert:
            - "SelfTestReport.${rpt} has no version field"
            - "no PUT/PATCH endpoint matches /self-test-reports (server returns 404 or 405)"

      - name: device_serial_number_uniqueness_per_campus_enforced
        claim_type: Type Constraints
        grounds:
          - entities.Device.fields.serial_number
          - errors.ERR_SERIAL_NUMBER_CONFLICT
        distinguishing_aspect: "Two devices on the same campus with same serial_number → second create returns 409 ERR_SERIAL_NUMBER_CONFLICT."
        test_recipe:
          setup: ["Campus, model."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "M-U", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
              captures: { dm: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "C", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-305", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /api/devices"
              payload: { campus_id: "${cid}", device_model_id: "${dm }", serial_number: "DUP-1" }
              as: ProgramManager
          trigger:
            - call: "POST /api/devices"
              payload: { campus_id: "${cid}", device_model_id: "${dm }", serial_number: "DUP-1" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "status == 409"
            - "error_id == ERR_SERIAL_NUMBER_CONFLICT"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: device_invalid_transition_registered_to_in_service_skips_installed
        claim_type: invalid_transition
        grounds:
          - state_machines.Device
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Commission on a REGISTERED device (skipping INSTALLED) rejected ERR_INVALID_STATE — commission precondition requires INSTALLED with posture=READY."
        test_recipe:
          setup: ["Device in REGISTERED state with no installs."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "M-IV", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
              captures: { dm: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "C", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-306", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /api/devices"
              payload: { campus_id: "${cid}", device_model_id: "${dm }", serial_number: "SN-IV-1" }
              as: ProgramManager
              captures: { dev: $.data.id }
          trigger:
            - call: "POST /api/devices/${dev}/commission"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Device.status == REGISTERED (unchanged)"

      - name: terminal_state_decommissioned_device_rejects_all_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Device
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "DECOMMISSIONED is terminal: install/commission/send_to_maintenance all rejected."
        test_recipe:
          setup: ["Device REGISTERED then decommissioned."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "M-TL", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
              captures: { dm: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "C", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-307", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /api/devices"
              payload: { campus_id: "${cid}", device_model_id: "${dm }", serial_number: "SN-TL-1" }
              as: ProgramManager
              captures: { dev: $.data.id }
            - call: "POST /api/devices/${dev}/decommission"
              payload: {}
              as: ProgramManager
            - call: "POST /api/zones"
              payload: { campus_id: "${cid}", zone_code: "Z", floor_area_sqm: 100, avg_walk_speed_mps: 1.5, requires_elevator: false, elevator_delay_seconds: 0 }
              as: ProgramManager
              captures: { zid: $.data.id }
            - call: "POST /api/cabinets"
              payload: { zone_id: "${zid}", location_label: "L", centroid_x_m: 0.0, centroid_y_m: 0.0 }
              as: ProgramManager
              captures: { cab: $.data.id }
            - call: "GET /api/devices/${dev}"
              payload: {}
              as: ProgramManager
              captures: { dv: $.data.version }
          trigger:
            - call: "POST /api/devices/${dev}/install"
              payload: { cabinet_id: "${cab}", expected_device_version: "${dv}" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: device_initial_state_registered
        claim_type: initial_state
        grounds:
          - state_machines.Device
        distinguishing_aspect: "POST /devices returns device with status=REGISTERED as initial state."
        test_recipe:
          setup: ["Campus, model."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "M-IS", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
              captures: { dm: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "C", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-308", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /api/devices"
              payload: { campus_id: "${cid}", device_model_id: "${dm }", serial_number: "SN-IS-1" }
              as: ProgramManager
              captures: { dev: $.data.id }
          assert:
            - "Device.${dev}.status == REGISTERED"

      - name: device_install_cascade_down_to_cabinet
        claim_type: cascade_down
        grounds:
          - state_machines.Device.transitions.REGISTERED_to_INSTALLED
          - state_machines.Cabinet.transitions.EMPTY_to_OCCUPIED
        distinguishing_aspect: "Installing Device flips Cabinet EMPTY→OCCUPIED and sets installed_device_id."
        test_recipe:
          setup: ["Campus, zone, cabinet (EMPTY), device (REGISTERED)."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "M-CD", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
              captures: { dm: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "C", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-309", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /api/zones"
              payload: { campus_id: "${cid}", zone_code: "Z", floor_area_sqm: 100, avg_walk_speed_mps: 1.5, requires_elevator: false, elevator_delay_seconds: 0 }
              as: ProgramManager
              captures: { zid: $.data.id }
            - call: "POST /api/cabinets"
              payload: { zone_id: "${zid}", location_label: "L", centroid_x_m: 0.0, centroid_y_m: 0.0 }
              as: ProgramManager
              captures: { cab: $.data.id }
            - call: "POST /api/devices"
              payload: { campus_id: "${cid}", device_model_id: "${dm }", serial_number: "SN-CD-1" }
              as: ProgramManager
              captures: { dev: $.data.id, dv: $.data.version }
          trigger:
            - call: "POST /api/devices/${dev}/install"
              payload: { cabinet_id: "${cab}", expected_device_version: "${dv}" }
              as: ProgramManager
          assert:
            - "Cabinet.${cab}.status == OCCUPIED"
            - "Cabinet.${cab}.installed_device_id == ${dev}"
            - "Device.${dev}.cabinet_id == ${cab}"

  # ===========================================================================
  - section: calculations
    instances:

      - name: install_expiration_uses_min_of_lot_mfg_and_shelf_life
        claim_type: correct_result
        grounds:
          - calculations.install_expiration
        distinguishing_aspect: "expires_at = min(lot.manufacturer_expires_at, installed_at + shelf_life). For pad installed 2026-09-01 with shelf 24mo → 2028-09-01; lot mfg 2027-06-01 wins → expires_at=2027-06-01."
        test_recipe:
          setup: ["Lot with manufacturer_expires_at=2027-06-01 < shelf-life end 2028-09-01."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "M-EXP", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
              captures: { dm: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "C", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-310", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /api/devices"
              payload: { campus_id: "${cid}", device_model_id: "${dm }", serial_number: "SN-EXP-1" }
              as: ProgramManager
              captures: { dev: $.data.id, dv: $.data.version }
            - call: "POST /api/consumable-lots"
              payload: { campus_id: "${cid}", device_model_id: "${dm }", kind: "PAD", lot_code: "L-EXP", manufacturer_expires_at: "2027-06-01T00:00:00Z", quantity_received: 5 }
              as: ProgramManager
              captures: { lot: $.data.id }
          trigger:
            - call: "POST /api/installs"
              payload: { device_id: "${dev}", consumable_lot_id: "${lot }", expected_device_version: "${dv}" }
              as: ProgramManager
              captures: { inst: $.data.id }
          assert:
            - "Install.${inst}.expires_at == 2027-06-01T00:00:00Z (lot mfg earlier than shelf-life end)"

      - name: certification_extension_handles_null_certified_through
        claim_type: correct_result
        grounds:
          - calculations.certification_extension
        distinguishing_aspect: "For responder with certified_through=null, base = session.ends_at; new certified_through = ends_at + certification_months_granted."
        test_recipe:
          setup: ["Responder never certified; session ends 2026-08-15 granting 12mo."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/campuses"
              payload: { name: "C", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-311", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /api/responders"
              payload: { campus_id: "${cid}", full_name: "MD", badge_number: "MD-CE", responder_role: "MEDICAL_DIRECTOR" }
              as: ProgramManager
              captures: { md: $.data.id }
            - call: "POST /api/responders"
              payload: { campus_id: "${cid}", full_name: "R", badge_number: "R-CE", responder_role: "LAY_RESPONDER" }
              as: ProgramManager
              captures: { resp: $.data.id }
            - call: "POST /api/training-sessions"
              payload: { campus_id: "${cid}", instructor_id: "${md }", starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-15T13:00:00Z", capacity: 5, certification_months_granted: 12 }
              as: ProgramManager
              captures: { ts: $.data.id }
            - call: "POST /api/training-sessions/${ts}/enroll"
              payload: { responder_id: "${resp}" }
              as: ProgramManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T14:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/training-sessions/${ts}/complete"
              payload: { attendee_ids: ["${resp}"] }
              as: ProgramManager
            - call: "GET /api/responders/${resp}"
              payload: {}
              as: ProgramManager
          assert:
            - "Responder.${resp}.certified_through == 2027-08-15T13:00:00Z"

      - name: certification_extension_excluded_from_difficulty
        claim_type: variant_divergence
        grounds: [calculations.certification_extension]
        excluded_because:
          difficulty_instance: training_session_no_overlap_with_completed_session_certification_window
          rationale: "The boundary behavior (abutting sessions, max-accumulation) is exercised by §1.8 Rule 8 instance."

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_x_user_role_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
