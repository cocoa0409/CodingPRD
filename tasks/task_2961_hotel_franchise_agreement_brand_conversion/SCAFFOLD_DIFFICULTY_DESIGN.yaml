          - entities.Owner.fields.financial_profile_revision
          - entities.Application.fields.capacity_score_at_review
        distinguishing_aspect: |
          Depth 2, and triggered from a completely different edge of the graph: a write on Owner,
          not a sweep on a plan. Link 1 recomputes both of the Owner's capacity variants
          (65.13/64.38 ADEQUATE → 17.60/17.60 INSUFFICIENT) and bumps financial_profile_revision;
          link 2 reaches sideways into every UNDER_REVIEW Application of that owner whose review had
