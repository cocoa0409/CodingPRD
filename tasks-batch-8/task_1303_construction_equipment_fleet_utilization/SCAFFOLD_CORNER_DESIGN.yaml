  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_assignment_create
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[equipment-reserve-stale-version]", "validations[priority=20]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Equipment.version: after a reserve+cancel pair advanced the unit to version 3, a create carrying the stale expected_equipment_version 1 is rejected 412 ERR_STALE_VERSION; re-reading the version and retrying the identical create succeeds."
        test_recipe:
          setup: ["Class C700, project P700, equipment E700 (version 1 captured at create); assignment A700 created (version -> 2) and cancelled (version -> 3, availability IDLE)"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-700", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c700_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-700", name: "P700", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p700_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-700", class_id: "${c700_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e700_id: $.data.id, e700_v_stale: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e700_id}", project_id: "${p700_id}", start_date: "2026-08-03", end_date: "2026-08-05", expected_equipment_version: "${e700_v_stale}" }
              as: FleetAdmin
              captures: { a700_id: $.data.id }
            - call: "POST /fleet/assignments/${a700_id}/cancel"
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e700_id}", project_id: "${p700_id}", start_date: "2026-08-07", end_date: "2026-08-09", expected_equipment_version: "${e700_v_stale}" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
            - call: "GET /fleet/equipment/${e700_id}"
              as: FleetAdmin
              captures: { e700_v_now: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e700_id}", project_id: "${p700_id}", start_date: "2026-08-07", end_date: "2026-08-09", expected_equipment_version: "${e700_v_now}" }
              as: FleetAdmin
              captures: { a700b_status: $.data.status }
          assert:
            - "Stale create (expected 1, current 3): error_id == ERR_STALE_VERSION, http 412; no assignment created and version stays 3"
            - "Re-read shows version == 3; retry with expected 3 -> 201 RESERVED"
            - "Two strictly sequential requests — the stale-write rejection is deterministic under OCC"

      - name: occ_stale_version_on_damage_reassess
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[damage-reassess-stale-version]", "validations[priority=20]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on DamageReport.version: reassessing a DISPUTED report with expected_damage_report_version one behind the current version (expression over the captured post-dispute version) -> 412 ERR_STALE_VERSION; the same reassess with the current version succeeds and recomputes the charge."
        test_recipe:
          setup: ["Class, project (budget 100000000), equipment ON_RENT via ACTIVE assignment; D701 assessed then disputed (version now 3, captured)"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-701", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c701_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-701", name: "P701", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p701_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-701", class_id: "${c701_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e701_id: $.data.id, e701_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e701_id}", project_id: "${p701_id}", start_date: "2026-08-03", end_date: "2026-08-10", expected_equipment_version: "${e701_v}" }
              as: FleetAdmin
              captures: { a701_id: $.data.id }
            - call: "POST /fleet/assignments/${a701_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/damage-reports"
              payload: { equipment_id: "${e701_id}", project_id: "${p701_id}", description: "crack", abuse_flag: false, line_items: [{ description: "x", amount_cents: 10000 }] }
              as: FleetAdmin
              captures: { d701_id: $.data.id }
            - call: "POST /fleet/damage-reports/${d701_id}/assess"
              as: FleetAdmin
            - call: "POST /fleet/damage-reports/${d701_id}/dispute"
              payload: { dispute_note: "disputed" }
              as: ProjectManager
              captures: { d701_v: $.data.version }
          trigger:
            - call: "POST /fleet/damage-reports/${d701_id}/reassess"
              payload: { line_items: [{ description: "x (revised)", amount_cents: 7000 }], expected_damage_report_version: "${d701_v} - 1" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
            - call: "POST /fleet/damage-reports/${d701_id}/reassess"
              payload: { line_items: [{ description: "x (revised)", amount_cents: 7000 }], expected_damage_report_version: "${d701_v}" }
              as: FleetAdmin
              captures: { d701_assessed: $.data.assessed_charge_cents, d701_v2: $.data.version }
          assert:
            - "Stale reassess (expected ${d701_v} - 1): error_id == ERR_STALE_VERSION, http 412; line_items and assessed_charge_cents unchanged (still 10000)"
            - "Correct-version reassess succeeds: assessed_charge_cents == 7000, status ASSESSED, version == ${d701_v} + 1"

      - name: version_increments_on_every_mutation
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[equipment-reserve-stale-version]", entities.Equipment]
        distinguishing_aspect: "The version contract that makes OCC observable: Equipment.version starts at 1 and increments by exactly 1 per mutation — create(1) -> reading ingest(2) -> mark-down(3) — verified by GET after each step."
        test_recipe:
          setup: ["Class C702 (service_interval_hours 10000), Equipment E702"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-702", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c702_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-702", class_id: "${c702_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e702_id: $.data.id, e702_v1: $.data.version }
          trigger:
            - call: "POST /fleet/equipment/${e702_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 1000, fuel_used_milliliters: 500 }
              as: FleetAdmin
            - call: "GET /fleet/equipment/${e702_id}"
              as: FleetAdmin
              captures: { e702_v2: $.data.version }
            - call: "POST /fleet/equipment/${e702_id}/mark-down"
              as: FleetAdmin
            - call: "GET /fleet/equipment/${e702_id}"
              as: FleetAdmin
              captures: { e702_v3: $.data.version }
          assert:
            - "version == 1 at creation, == 2 after the meter-changing reading, == 3 after mark-down"
            - "updated_at refreshes on each mutation"

      - name: idle_alert_inclusive_boundary_at_five_days
        claim_type: rate_threshold_boundary
        grounds: [calculations.redeployment_scan, "endpoints[GET /fleet/equipment/{id}/redeployment-score]"]
        distinguishing_aspect: "IDLE_WINDOW_DAYS == 5 inclusive: a unit IDLE (SERVICE_OK, no RESERVED assignment, no PLANNED/EN_ROUTE transport) for exactly 4 consecutive days reports idle_alert false with idle_streak_days 4; at exactly 5 days idle_alert flips true."
        test_recipe:
          setup: ["Class C703; Equipment E703 created IDLE at clock 2026-08-01T00:00:00Z and never touched"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-703", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c703_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-703", class_id: "${c703_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e703_id: $.data.id }
          trigger:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: FleetAdmin
            - call: "GET /fleet/equipment/${e703_id}/redeployment-score"
              as: FleetAdmin
              captures: { ia4: $.data.idle_alert, is4: $.data.idle_streak_days }
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: FleetAdmin
            - call: "GET /fleet/equipment/${e703_id}/redeployment-score"
              as: FleetAdmin
              captures: { ia5: $.data.idle_alert, is5: $.data.idle_streak_days }
          assert:
            - "At 4 days: idle_streak_days == 4 and idle_alert == false"
            - "At exactly 5 days: idle_streak_days == 5 and idle_alert == true (idle_streak_days >= IDLE_WINDOW_DAYS is INCLUSIVE)"

      - name: dual_variant_calculations_covered_by_difficulty
        claim_type: dual_variant_divergence
        grounds: [calculations.own_vs_rent, calculations.residual_value, calculations.utilization_rate]
        distinguishing_aspect: "All three dual-variant calculations and their divergences."
        excluded_because:
          difficulty_instance: own_vs_rent_variants_diverge_on_mixed_idle_window
          rationale: "Covered by the three §1.8 dual_variant_calc instances (assignment-cost, asset-disposal, utilization domains)."

      - name: transitive_cascades_covered_by_difficulty
        claim_type: cascade_chain
        grounds: ["state_machines.Equipment.DOWN_to_IDLE", "state_machines.Equipment.SERVICE_DUE_to_SERVICE_OK"]
        distinguishing_aspect: "Both cascade chains (repair-completion depth-3, reading-void depth-2)."
        excluded_because:
          difficulty_instance: repair_completion_cascades_through_equipment_assignment_project
          rationale: "Both cascades asserted link-by-link in the two §1.8 transitive_cascade instances."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: ledger_visible_immediately_after_assignment_close
        claim_type: immediate_consistency
        grounds: [complexity_profile, "endpoints[POST /fleet/assignments/{id}/close]", "endpoints[GET /fleet/projects/{id}]"]
        distinguishing_aspect: "Immediate consistency: the same logical moment the close returns 200, a plain GET on the project shows billed_total_cents == 10000 and active_assignment_count == 0 — no lag, no reconciliation pass."
        test_recipe:
          setup: ["Class C800 daily 10000; project P800 budget 100000000; assignment [08-03, 08-04) ACTIVE; reading 08-03 8000 milli; clock 2026-08-04 at close"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-800", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c800_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-800", name: "P800", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p800_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-800", class_id: "${c800_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e800_id: $.data.id, e800_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e800_id}", project_id: "${p800_id}", start_date: "2026-08-03", end_date: "2026-08-04", expected_equipment_version: "${e800_v}" }
              as: FleetAdmin
              captures: { a800_id: $.data.id }
            - call: "POST /fleet/assignments/${a800_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e800_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 8000, fuel_used_milliliters: 4000 }
              as: FleetAdmin
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/assignments/${a800_id}/close"
              payload: { close_reason: "COMPLETED" }
              as: FleetAdmin
            - call: "GET /fleet/projects/${p800_id}"
              as: FleetAdmin
              captures: { p800_billed: $.data.billed_total_cents, p800_aac: $.data.active_assignment_count }
          assert:
            - "Immediately after close: billed_total_cents == 10000 (1 chargeable day x 10000) and active_assignment_count == 0"

      - name: chargeback_visible_immediately_after_confirm
        claim_type: immediate_consistency
        grounds: [complexity_profile, "endpoints[POST /fleet/damage-reports/{id}/confirm]", "endpoints[GET /fleet/projects/{id}]"]
        distinguishing_aspect: "Immediate consistency for the fiscal side effect: confirm returns with confirmed_charge_cents == assessed_charge_cents == 10000 and the very next GET shows project.billed_total_cents == 10000."
        test_recipe:
          setup: ["Class, project P801 (budget 100000000), equipment ON_RENT via ACTIVE assignment; D801 assessed at 10000"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-801", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c801_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-801", name: "P801", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p801_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-801", class_id: "${c801_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e801_id: $.data.id, e801_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e801_id}", project_id: "${p801_id}", start_date: "2026-08-03", end_date: "2026-08-10", expected_equipment_version: "${e801_v}" }
              as: FleetAdmin
              captures: { a801_id: $.data.id }
            - call: "POST /fleet/assignments/${a801_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/damage-reports"
              payload: { equipment_id: "${e801_id}", project_id: "${p801_id}", description: "mirror", abuse_flag: false, line_items: [{ description: "mirror", amount_cents: 10000 }] }
              as: FleetAdmin
              captures: { d801_id: $.data.id }
            - call: "POST /fleet/damage-reports/${d801_id}/assess"
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/damage-reports/${d801_id}/confirm"
              as: FleetAdmin
              captures: { d801_conf: $.data.confirmed_charge_cents }
            - call: "GET /fleet/projects/${p801_id}"
              as: FleetAdmin
              captures: { p801_billed: $.data.billed_total_cents }
          assert:
            - "DamageReport.${d801_id}: status == CONFIRMED and confirmed_charge_cents == 10000 == assessed_charge_cents"
            - "Immediately after confirm: Project.${p801_id}.billed_total_cents == 10000"
