        distinguishing_aspect: "Child collections are reachable from the parent: an order's lines endpoint returns its OrderLines, its invoice endpoint returns an array of 0 (before ship) or 1 (after ship), and return-authorizations lists the order's RAs."
        test_recipe:
          setup: ["a VERIFIED retailer with account; ACTIVE brand; one order 2x5000 placed (not yet shipped)"]
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "RR Retail", store_type: "ONLINE", address: "21 Reach Rd", lat: 49.5, lng: -109.5, storefront_proof_url: "https://proof/rr1", resale_certificate_no: "RC-RR1" }
