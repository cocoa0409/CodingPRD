# =============================================================================
# Task 3110 — Independent Practice Affiliation into a Single Medical Group
# (Privia Health model). Expert+ difficulty scaffold.
# =============================================================================

scenario: |
  Independent Practice Affiliation into a Single Medical Group (Privia Health):
  practice affiliation without asset acquisition where physicians join a unified
  medical group entity, payer contracting under one tax identification with fee
  schedule improvements and value-based participation, practice-level economics
  preserved through a distribution model that returns collections net of shared
  services, technology and revenue cycle standardization with implementation
  waves, provider credentialing and enrollment under the group with
  effective-date sequencing, governance through physician-led boards and market
  committees, non-compete and departure terms when a practice leaves the group,
  value-based incentive distribution among affiliated practices

domain_name: independent-practice-affiliation
api_prefix: /api

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - scheduled_deferred_actions
    - temporal_windowing
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 15
  state_machine_count: 13
  calculation_count: 8
  endpoint_count: 74
  error_code_count: 44
  role_count: 9

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology — all FKs in request bodies)
# =============================================================================
entities:
  - name: MedicalGroup
    parent: null
    common_fields: true
    fields:
      - { name: tin, type: string, source: input, description: "Single federal tax identification number under which all affiliated practices bill; unique across groups" }
      - { name: display_name, type: string, source: input, description: "Medical group display name" }
      - { name: status, type: enum, source: system, description: "FORMING | OPERATING" }
      - { name: shared_services_tier1_rate, type: number, source: input, default: 0.07, description: "Shared-services fee rate applied to the first tier of a practice's period collections" }
      - { name: shared_services_tier1_cap_cents, type: integer, source: input, default: 50000000, description: "Cumulative period-collections ceiling of tier 1; amounts above it are charged tier2 rate" }
      - { name: shared_services_tier2_rate, type: number, source: input, default: 0.05, description: "Shared-services fee rate applied above the tier-1 cap" }
      - { name: distribution_hold_threshold_cents, type: integer, source: input, default: 5000, description: "Payable totals strictly below this are held and carried forward; a payable total >= this is paid out" }
      - { name: departure_notice_days, type: integer, source: input, default: 180, description: "Minimum notice between departure notice_date and earliest permitted exit date" }
      - { name: non_compete_term_months, type: integer, source: input, default: 24, description: "Tenure in whole months at or above which the non-compete and early-exit penalty no longer apply" }
      - { name: early_exit_base_penalty_cents, type: integer, source: input, default: 2500000, description: "Flat penalty when tenure at exit is below non_compete_term_months" }
      - { name: early_exit_per_month_cents, type: integer, source: input, default: 250000, description: "Additional penalty per whole month of tenure shortfall below non_compete_term_months" }
      - { name: insufficient_notice_penalty_cents, type: integer, source: input, default: 500000, description: "Flat penalty when requested_exit_date precedes earliest_exit_date" }

  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: medical_group_id, type: string, source: input, description: "FK -> MedicalGroup.id; group this market belongs to" }
      - { name: name, type: string, source: input, description: "Market name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: max_practices, type: integer, source: input, description: "Capacity cap: count of practices with status in {ONBOARDING, AFFILIATED, SUSPENDED, DEPARTING} must stay <= max_practices" }
      - { name: market_weight, type: number, source: input, default: 1.0, description: "Weight applied to incentive-allocation scoring for practices in this market" }

  - name: Practice
    parent: null
    common_fields: true
    fields:
      - { name: medical_group_id, type: string, source: input, description: "FK -> MedicalGroup.id" }
      - { name: market_id, type: string, source: input, description: "FK -> Market.id" }
      - { name: wave_id, type: string, source: system, description: "FK -> ImplementationWave.id; null until assigned at affiliation-agreement execution; server-selected, never client-supplied" }
      - { name: legal_name, type: string, source: input, description: "Practice legal name" }
      - { name: legacy_tin, type: string, source: input, description: "Pre-affiliation tax id retained for records only; billing moves to the group TIN" }
      - { name: org_npi, type: string, source: input, description: "Organizational NPI; unique" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ONBOARDING | AFFILIATED | SUSPENDED | DEPARTING | DEPARTED" }
      - { name: affiliation_effective_date, type: string, source: system, description: "ISO date (YYYY-MM-DD) the practice became AFFILIATED; null until then" }
      - { name: departure_effective_date, type: string, source: system, description: "ISO date the practice became DEPARTED; null until then" }
      - { name: active_provider_count, type: integer, source: computed, description: "Count of the practice's Providers with status ACTIVE" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id" }
      - { name: npi, type: string, source: input, description: "Individual NPI; unique" }
      - { name: full_name, type: string, source: input, description: "Provider name" }
      - { name: specialty, type: string, source: input, description: "Specialty free text" }
      - { name: provider_role, type: enum, source: input, description: "PHYSICIAN | APP" }
      - { name: employment_start_date, type: string, source: input, description: "ISO date; feeds credentialing effective-date sequencing" }
      - { name: status, type: enum, source: system, description: "ROSTERED | ACTIVE | DEACTIVATED" }

  - name: AffiliationAgreement
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id; must equal X-User-ID when the caller is PracticeExecutive" }
      - { name: agreement_seq, type: integer, source: system, description: "Per-practice monotonically increasing agreement sequence, starts at 1" }
      - { name: distribution_model, type: enum, source: input, description: "NET_OF_SHARED_SERVICES (only supported model)" }
      - { name: shared_services_rate_override, type: number, source: input, default: null, description: "Optional flat fee rate replacing the group tiered schedule for this practice" }
      - { name: non_compete_accepted, type: boolean, source: input, description: "Must be true; the group non-compete and departure terms are a condition of affiliation" }
      - { name: status, type: enum, source: system, description: "DRAFT | EXECUTED | SUPERSEDED | TERMINATED" }

  - name: ImplementationWave
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id" }
      - { name: wave_code, type: string, source: input, description: "Human wave label; unique within the market" }
      - { name: cutover_start_date, type: string, source: input, description: "ISO date; half-open window start (inclusive)" }
      - { name: cutover_end_date, type: string, source: input, description: "ISO date; half-open window end (exclusive); must be strictly after cutover_start_date" }
      - { name: status, type: enum, source: system, description: "PLANNED | LOCKED | IN_CUTOVER | COMPLETE" }

  - name: PayerContract
    parent: null
    common_fields: true
    fields:
      - { name: medical_group_id, type: string, source: input, description: "FK -> MedicalGroup.id; all contracts are executed under the group's single TIN" }
      - { name: payer_name, type: string, source: input, description: "Payer name" }
      - { name: contract_type, type: enum, source: input, description: "FEE_FOR_SERVICE | VALUE_BASED | HYBRID" }
      - { name: effective_date, type: string, source: input, description: "ISO date; activation requires the logical clock date >= effective_date" }
      - { name: ratifying_vote_id, type: string, source: system, description: "FK -> CommitteeVote.id; set at activation from the PASSED ratification vote; null until ACTIVE" }
      - { name: status, type: enum, source: system, description: "NEGOTIATION | ACTIVE | TERMINATED" }
      - { name: value_based_pool_eligible, type: boolean, source: computed, description: "True when contract_type is VALUE_BASED or HYBRID" }

  - name: FeeScheduleRate
    parent: null
    common_fields: true
    fields:
      - { name: payer_contract_id, type: string, source: input, description: "FK -> PayerContract.id" }
      - { name: cpt_code, type: string, source: input, description: "Procedure code" }
      - { name: legacy_rate_cents, type: integer, source: input, description: "Practices' pre-affiliation benchmark rate for this code" }
      - { name: group_rate_cents, type: integer, source: input, description: "Negotiated group rate for this code" }
      - { name: uplift_pct, type: number, source: computed, description: "(group_rate_cents - legacy_rate_cents) / legacy_rate_cents, 4 decimal places, round_half_up" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | SUPERSEDED" }

  - name: CredentialingEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: payer_contract_id, type: string, source: input, description: "FK -> PayerContract.id" }
      - { name: channel, type: enum, source: input, description: "STANDARD (lag 90 days) | EXPEDITED (lag 30 days; requested effective date must be within 45 days of application_date)" }
      - { name: application_date, type: string, source: system, description: "ISO date taken from the logical clock at creation" }
      - { name: requested_effective_date, type: string, source: input, description: "ISO date; must be >= application_date" }
      - { name: effective_date, type: string, source: computed, description: "ISO date; computed at approval per credentialing_effective_date" }
      - { name: termination_date, type: string, source: system, description: "ISO date set at termination (input on manual terminate; clock date on cascades); null while non-terminated" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | EFFECTIVE | TERMINATED" }

  - name: CollectionBatch
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id" }
      - { name: payer_contract_id, type: string, source: input, description: "FK -> PayerContract.id" }
      - { name: period, type: string, source: input, description: "Statement period, format YYYY-MM; unique together with (practice_id, payer_contract_id)" }
      - { name: posted_amount_cents, type: integer, source: input, description: "Gross collections posted; > 0" }
      - { name: denial_amount_cents, type: integer, source: system, description: "Denials recorded at settle; 0 until settled" }
      - { name: settled_amount_cents, type: integer, source: computed, description: "posted_amount_cents - denial_amount_cents, fixed at settle" }
      - { name: adjustment_total_cents, type: integer, source: computed, description: "Sum of post-settlement recoupment/adjustment deltas (may be negative); 0 until adjusted" }
      - { name: net_settled_cents, type: integer, source: computed, description: "settled_amount_cents + adjustment_total_cents" }
      - { name: settled_by_user_id, type: string, source: system, description: "X-User-ID of the DistributionAccountant who settled the batch; null until settled; feeds segregation-of-duties" }
      - { name: status, type: enum, source: system, description: "POSTED | SETTLED | ADJUSTED" }

  - name: DistributionStatement
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id" }
      - { name: period, type: string, source: input, description: "Format YYYY-MM; unique per practice" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL_ISSUED | FINAL_ISSUED | AMENDED | REISSUED" }
      - { name: provisional_gross_cents, type: integer, source: computed, description: "Provisional variant gross: SETTLED/ADJUSTED batches at net_settled_cents plus POSTED batches at posted_amount_cents" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Provisional shared-services fee per shared_services_fee over provisional gross" }
      - { name: provisional_net_cents, type: integer, source: computed, description: "provisional_gross_cents - provisional_fee_cents" }
      - { name: gross_collections_cents, type: integer, source: computed, description: "Final variant gross: sum of net_settled_cents over SETTLED/ADJUSTED batches only; null until FINAL_ISSUED" }
      - { name: shared_services_fee_cents, type: integer, source: computed, description: "Final fee per shared_services_fee over gross_collections_cents; null until FINAL_ISSUED" }
      - { name: net_distribution_cents, type: integer, source: computed, description: "gross_collections_cents - shared_services_fee_cents; null until FINAL_ISSUED" }
      - { name: carried_forward_in_cents, type: integer, source: computed, description: "carried_forward_out_cents of the same practice's statement for the immediately preceding calendar month, when that statement exists and is FINAL_ISSUED or REISSUED; otherwise 0" }
      - { name: payable_total_cents, type: integer, source: computed, description: "net_distribution_cents + carried_forward_in_cents" }
      - { name: payout_cents, type: integer, source: computed, description: "payable_total_cents when >= group hold threshold, else 0" }
      - { name: carried_forward_out_cents, type: integer, source: computed, description: "0 when payable_total_cents >= group hold threshold, else payable_total_cents" }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID of the GroupFinancialController who finalized; feeds segregation-of-duties" }

  - name: ValueBasedIncentivePool
    parent: null
    common_fields: true
    fields:
      - { name: payer_contract_id, type: string, source: input, description: "FK -> PayerContract.id; contract must be ACTIVE and value_based_pool_eligible" }
      - { name: period, type: string, source: input, description: "Format YYYY-MM" }
      - { name: pool_amount_cents, type: integer, source: input, description: "Total incentive dollars to distribute; > 0" }
      - { name: quality_threshold, type: number, source: input, default: 60, description: "Allocations with quality_score >= threshold are eligible; strictly below are INELIGIBLE" }
      - { name: allocated_total_cents, type: integer, source: computed, description: "Sum of SCORED/PAYABLE/PAID/VOIDED allocation share_cents; equals pool_amount_cents exactly after allocate" }
      - { name: status, type: enum, source: system, description: "OPEN | SCORING | ALLOCATED | DISTRIBUTED | VOIDED" }

  - name: IncentiveAllocation
    parent: null
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: input, description: "FK -> ValueBasedIncentivePool.id" }
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id; must equal X-User-ID when caller is PracticeExecutive" }
      - { name: quality_score, type: number, source: input, description: "Practice-attested quality score 0..100" }
      - { name: attributed_lives, type: integer, source: input, description: "Attributed patient lives under the pool's contract; > 0" }
      - { name: weight, type: number, source: computed, description: "quality_score * attributed_lives * market_weight of the practice's market; 6 decimal places; null until allocate" }
      - { name: share_cents, type: integer, source: computed, description: "Floor of pro-rata pool share plus remainder-waterfall cents; null until allocate; 0 when INELIGIBLE" }
      - { name: status, type: enum, source: system, description: "ENTERED | SCORED | INELIGIBLE | PAYABLE | PAID | VOIDED" }

  - name: DepartureCase
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id; must equal X-User-ID when caller is PracticeExecutive; at most one non-terminal case per practice" }
      - { name: notice_date, type: string, source: system, description: "ISO date from the logical clock at creation" }
      - { name: requested_exit_date, type: string, source: input, description: "ISO date requested by the practice" }
      - { name: earliest_exit_date, type: string, source: computed, description: "notice_date + group departure_notice_days" }
      - { name: notice_sufficient, type: boolean, source: computed, description: "requested_exit_date >= earliest_exit_date" }
      - { name: assumed_exit_date, type: string, source: computed, description: "max(requested_exit_date, earliest_exit_date); basis of the estimated penalty" }
      - { name: estimated_penalty_cents, type: integer, source: computed, description: "departure_penalty evaluated at assumed_exit_date (provisional variant)" }
      - { name: actual_exit_date, type: string, source: system, description: "max(requested_exit_date, earliest_exit_date, clock date at settle); set at settle" }
      - { name: final_penalty_cents, type: integer, source: computed, description: "departure_penalty evaluated at actual_exit_date (final variant); null until SETTLED" }
      - { name: non_compete_applies, type: boolean, source: computed, description: "True when tenure in whole months at the evaluated exit date is strictly below group non_compete_term_months" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | SETTLEMENT_PENDING | DISPUTED | SETTLED | RESCINDED" }

  - name: CommitteeVote
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id" }
      - { name: motion_type, type: enum, source: input, description: "PAYER_CONTRACT_RATIFICATION | FEE_SCHEDULE_ADOPTION" }
      - { name: subject_contract_id, type: string, source: input, description: "FK -> PayerContract.id; contract the motion concerns" }
      - { name: eligible_voter_count, type: integer, source: system, description: "Snapshot at creation: count of Providers with provider_role PHYSICIAN and status != DEACTIVATED whose practice is in this market with status in {ONBOARDING, AFFILIATED}" }
      - { name: votes_for, type: integer, source: system, description: "Count of FOR ballots cast" }
      - { name: votes_against, type: integer, source: system, description: "Count of AGAINST ballots cast" }
      - { name: voted_provider_ids, type: array, source: system, description: "Provider ids that have cast; one ballot per provider" }
      - { name: status, type: enum, source: system, description: "OPEN | PASSED | REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MedicalGroup
    initial_state: FORMING
    terminal_states: []
    transitions:
      - from: FORMING
        to: OPERATING
        trigger: "POST /api/medical-groups/{id}/activate"
        actor: GroupAdministrator
        preconditions:
          - "Group is FORMING (ERR_INVALID_TRANSITION)"
        side_effects: []

  - entity: Practice
    initial_state: PROSPECT
    terminal_states: [DEPARTED]
    transitions:
      - from: PROSPECT
        to: ONBOARDING
        trigger: "system (an AffiliationAgreement for this practice reaches EXECUTED)"
        actor: system
        preconditions:
          - "An IN_CUTOVER ImplementationWave exists in the practice's market (ERR_NO_WAVE_IN_CUTOVER raised on the execute call otherwise)"
        side_effects:
          - "wave_id is assigned by selector: among waves with market_id == practice.market_id and status IN_CUTOVER, pick lowest cutover_start_date; tie-break earliest created_at; empty set -> the agreement-execute request fails with ERR_NO_WAVE_IN_CUTOVER"

      - from: ONBOARDING
        to: AFFILIATED
        trigger: "system (the assigned ImplementationWave reaches COMPLETE via POST /api/implementation-waves/{id}/complete)"
        actor: system
        preconditions:
          - "practice.wave_id == the completing wave's id"
        side_effects:
          - "affiliation_effective_date := logical clock date"
          - "Each CredentialingEnrollment of the practice's providers with status APPROVED -> EFFECTIVE (hop 2; caused by this transition)"
          - "Each enrollment flipped to EFFECTIVE flips its Provider from ROSTERED -> ACTIVE (hop 3; caused by the enrollment flip) and recomputes practice.active_provider_count"

      - from: AFFILIATED
        to: SUSPENDED
        trigger: "POST /api/practices/{id}/suspend"
        actor: GroupAdministrator
        preconditions:
          - "Practice is AFFILIATED (ERR_INVALID_TRANSITION)"
        side_effects: []

      - from: SUSPENDED
        to: AFFILIATED
        trigger: "POST /api/practices/{id}/reinstate"
        actor: GroupAdministrator
        preconditions:
          - "Practice is SUSPENDED (ERR_INVALID_TRANSITION)"
        side_effects: []

      - from: AFFILIATED
        to: DEPARTING
        trigger: "system (a DepartureCase is created for this practice)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DEPARTING
        to: AFFILIATED
        trigger: "system (the open DepartureCase is RESCINDED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DEPARTING
        to: DEPARTED
        trigger: "system (the open DepartureCase reaches SETTLED)"
        actor: system
        preconditions: []
        side_effects:
          - "departure_effective_date := case.actual_exit_date"
          - "Each Provider of the practice -> DEACTIVATED (hop 2; caused by this transition)"
          - "Each CredentialingEnrollment of the practice's providers with status in {SUBMITTED, APPROVED, EFFECTIVE} -> TERMINATED with termination_date := actual_exit_date (hop 2)"
          - "The practice's EXECUTED AffiliationAgreement -> TERMINATED (hop 2)"
          - "active_provider_count recomputed to 0"

  - entity: AffiliationAgreement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /api/affiliation-agreements/{id}/execute"
        actor: PracticeExecutive
        preconditions:
          - "Practice status is PROSPECT or AFFILIATED (ERR_INVALID_TRANSITION)"
          - "If practice is PROSPECT: an IN_CUTOVER wave exists in the practice's market (ERR_NO_WAVE_IN_CUTOVER)"
        side_effects:
          - "Any other EXECUTED agreement of the same practice -> SUPERSEDED"
          - "If practice is PROSPECT: practice -> ONBOARDING with wave assignment per Practice state machine"

      - from: EXECUTED
        to: SUPERSEDED
        trigger: "system (a newer agreement of the same practice reaches EXECUTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EXECUTED
        to: TERMINATED
        trigger: "system (practice reaches DEPARTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ImplementationWave
    initial_state: PLANNED
    terminal_states: [COMPLETE]
    transitions:
      - from: PLANNED
        to: LOCKED
        trigger: "POST /api/implementation-waves/{id}/lock"
        actor: GroupAdministrator
        preconditions:
          - "Wave is PLANNED (ERR_INVALID_TRANSITION)"
          - "expected_wave_version matches (ERR_STALE_VERSION)"
        side_effects:
          - "increments ImplementationWave.version by 1"

      - from: LOCKED
        to: IN_CUTOVER
        trigger: "POST /api/implementation-waves/{id}/start-cutover"
        actor: GroupAdministrator
        preconditions:
          - "Wave is LOCKED (ERR_INVALID_TRANSITION)"
          - "Logical clock date >= cutover_start_date (ERR_INVALID_CUTOVER_WINDOW)"
        side_effects: []

      - from: IN_CUTOVER
        to: COMPLETE
        trigger: "POST /api/implementation-waves/{id}/complete"
        actor: GroupAdministrator
        preconditions:
          - "Wave is IN_CUTOVER (ERR_INVALID_TRANSITION)"
          - "Logical clock date < cutover_end_date (ERR_INVALID_CUTOVER_WINDOW)"
        side_effects:
          - "Every Practice with wave_id == this wave and status ONBOARDING -> AFFILIATED (hop 1), which cascades to enrollments (hop 2) and providers (hop 3) per the Practice state machine"

      - from: IN_CUTOVER
        to: LOCKED
        trigger: "POST /api/implementation-waves/{id}/rollback"
        actor: GroupAdministrator
        preconditions:
          - "Wave is IN_CUTOVER (ERR_INVALID_TRANSITION)"
        side_effects:
          - "Practices already assigned keep wave_id and stay ONBOARDING"

  - entity: PayerContract
    initial_state: NEGOTIATION
    terminal_states: [TERMINATED]
    transitions:
      - from: NEGOTIATION
        to: ACTIVE
        trigger: "POST /api/payer-contracts/{id}/activate"
        actor: PayerContractingOfficer
        preconditions:
          - "Contract is NEGOTIATION (ERR_INVALID_TRANSITION)"
          - "A CommitteeVote with subject_contract_id == contract.id, motion_type PAYER_CONTRACT_RATIFICATION, status PASSED exists (ERR_NO_PASSED_RATIFICATION_VOTE)"
          - "Logical clock date >= effective_date (ERR_INVALID_CUTOVER_WINDOW)"
          - "If contract_type in {FEE_FOR_SERVICE, HYBRID}: at least one FeeScheduleRate with status PROPOSED exists and fee_schedule_avg_uplift >= 0.08 (ERR_FEE_SCHEDULE_UPLIFT_INSUFFICIENT)"
        side_effects:
          - "ratifying_vote_id := the passing vote's id"
          - "All PROPOSED FeeScheduleRates of the contract -> ACTIVE"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/payer-contracts/{id}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "Contract is ACTIVE (ERR_INVALID_TRANSITION)"
        side_effects:
          - "Every CredentialingEnrollment with payer_contract_id == contract.id and status in {SUBMITTED, APPROVED, EFFECTIVE} -> TERMINATED with termination_date := clock date (hop 1 cascade; providers already ACTIVE stay ACTIVE)"

  - entity: FeeScheduleRate
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "system (parent contract reaches ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system (a new FeeScheduleRate is created for the same payer_contract_id + cpt_code)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CredentialingEnrollment
    initial_state: SUBMITTED
    terminal_states: [TERMINATED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/credentialing-enrollments/{id}/approve while the provider's practice is ONBOARDING"
        actor: CredentialingCoordinator
        preconditions:
          - "Enrollment is SUBMITTED (ERR_INVALID_TRANSITION)"
          - "No window overlap with another non-TERMINATED enrollment for the same provider_id + payer_contract_id (ERR_ENROLLMENT_WINDOW_OVERLAP)"
        side_effects:
          - "effective_date computed per credentialing_effective_date"

      - from: SUBMITTED
        to: EFFECTIVE
        trigger: "POST /api/credentialing-enrollments/{id}/approve while the provider's practice is AFFILIATED"
        actor: CredentialingCoordinator
        preconditions:
          - "Enrollment is SUBMITTED (ERR_INVALID_TRANSITION)"
          - "No window overlap (ERR_ENROLLMENT_WINDOW_OVERLAP)"
        side_effects:
          - "effective_date computed per credentialing_effective_date"
          - "Provider ROSTERED -> ACTIVE and practice.active_provider_count recomputed"

      - from: APPROVED
        to: EFFECTIVE
        trigger: "system (the provider's practice reaches AFFILIATED)"
        actor: system
        preconditions: []
        side_effects:
          - "Provider ROSTERED -> ACTIVE and practice.active_provider_count recomputed"

      - from: SUBMITTED
        to: TERMINATED
        trigger: "POST /api/credentialing-enrollments/{id}/terminate, or system (departure settle / contract termination)"
        actor: "CredentialingCoordinator | ComplianceOfficer | system"
        preconditions: []
        side_effects:
          - "termination_date := input termination_date on manual terminate; clock date on cascades"

      - from: APPROVED
        to: TERMINATED
        trigger: "POST /api/credentialing-enrollments/{id}/terminate, or system (departure settle / contract termination)"
        actor: "CredentialingCoordinator | ComplianceOfficer | system"
        preconditions: []
        side_effects:
          - "termination_date := input termination_date on manual terminate; clock date on cascades"

      - from: EFFECTIVE
        to: TERMINATED
        trigger: "POST /api/credentialing-enrollments/{id}/terminate, or system (departure settle / contract termination)"
        actor: "CredentialingCoordinator | ComplianceOfficer | system"
        preconditions: []
        side_effects:
          - "termination_date := input termination_date on manual terminate; clock date on cascades"
          - "If the provider has no remaining EFFECTIVE enrollment on any contract and the provider's practice is DEPARTING or DEPARTED, provider -> DEACTIVATED is handled by the departure cascade, not here"

  - entity: CollectionBatch
    initial_state: POSTED
    terminal_states: []
    transitions:
      - from: POSTED
        to: SETTLED
        trigger: "POST /api/collection-batches/{id}/settle"
        actor: DistributionAccountant
        preconditions:
          - "Batch is POSTED (ERR_INVALID_TRANSITION)"
          - "denial_amount_cents >= 0 and <= posted_amount_cents (ERR_INVALID_REQUEST)"
        side_effects:
          - "settled_amount_cents := posted_amount_cents - denial_amount_cents"
          - "settled_by_user_id := X-User-ID of the settler"

      - from: SETTLED
        to: ADJUSTED
        trigger: "POST /api/collection-batches/{id}/adjust"
        actor: DistributionAccountant
        preconditions:
          - "Batch is SETTLED or ADJUSTED (ERR_INVALID_TRANSITION)"
          - "adjustment_cents != 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "adjustment_total_cents += adjustment_cents"
          - "net_settled_cents recomputed"

      - from: ADJUSTED
        to: ADJUSTED
        trigger: "POST /api/collection-batches/{id}/adjust"
        actor: DistributionAccountant
        preconditions:
          - "Batch is SETTLED or ADJUSTED (ERR_INVALID_TRANSITION)"
          - "adjustment_cents != 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "adjustment_total_cents += adjustment_cents"
          - "net_settled_cents recomputed"

  - entity: DistributionStatement
    initial_state: PROVISIONAL_ISSUED
    terminal_states: []
    transitions:
      - from: PROVISIONAL_ISSUED
        to: FINAL_ISSUED
        trigger: "POST /api/distribution-statements/{id}/finalize"
        actor: GroupFinancialController
        preconditions:
          - "Statement is PROVISIONAL_ISSUED (ERR_INVALID_TRANSITION)"
          - "Practice is AFFILIATED or DEPARTING (ERR_PRACTICE_NOT_AFFILIATED)"
          - "Every CollectionBatch of the practice for the period is SETTLED or ADJUSTED (ERR_UNSETTLED_BATCHES_EXIST)"
          - "Segregation of duties: X-User-ID differs from settled_by_user_id of every covered batch (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "gross_collections_cents, shared_services_fee_cents, net_distribution_cents, carried_forward_in_cents, payable_total_cents, payout_cents, carried_forward_out_cents computed per practice_distribution_net + distribution_hold_carryforward"
          - "finalized_by_user_id := X-User-ID"

      - from: FINAL_ISSUED
        to: AMENDED
        trigger: "POST /api/distribution-statements/{id}/amend"
        actor: GroupFinancialController
        preconditions:
          - "Statement is FINAL_ISSUED or REISSUED (ERR_INVALID_TRANSITION)"
          - "expected_statement_version matches (ERR_STALE_VERSION)"
        side_effects:
          - "Final-variant fields recomputed from current batch net_settled_cents values"
          - "increments DistributionStatement.version by 1"

      - from: REISSUED
        to: AMENDED
        trigger: "POST /api/distribution-statements/{id}/amend"
        actor: GroupFinancialController
        preconditions:
          - "Statement is FINAL_ISSUED or REISSUED (ERR_INVALID_TRANSITION)"
          - "expected_statement_version matches (ERR_STALE_VERSION)"
        side_effects:
          - "Final-variant fields recomputed from current batch net_settled_cents values"
          - "increments DistributionStatement.version by 1"

      - from: AMENDED
        to: AMENDED
        trigger: "POST /api/distribution-statements/{id}/amend"
        actor: GroupFinancialController
        preconditions:
          - "expected_statement_version matches (ERR_STALE_VERSION)"
        side_effects:
          - "Final-variant fields recomputed from current batch net_settled_cents values"
          - "increments DistributionStatement.version by 1"
        note: "Repeated amendment is permitted without an intervening reissue"

      - from: AMENDED
        to: REISSUED
        trigger: "POST /api/distribution-statements/{id}/reissue"
        actor: GroupFinancialController
        preconditions:
          - "Statement is AMENDED (ERR_INVALID_TRANSITION)"
        side_effects: []

  - entity: ValueBasedIncentivePool
    initial_state: OPEN
    terminal_states: [VOIDED]
    transitions:
      - from: OPEN
        to: SCORING
        trigger: "POST /api/incentive-pools/{id}/close-entries"
        actor: GroupFinancialController
        preconditions:
          - "Pool is OPEN (ERR_INVALID_TRANSITION)"
        side_effects: []

      - from: SCORING
        to: ALLOCATED
        trigger: "POST /api/incentive-pools/{id}/allocate"
        actor: GroupFinancialController
        preconditions:
          - "Pool is SCORING (ERR_POOL_NOT_SCORING)"
          - "At least one ENTERED allocation has quality_score >= quality_threshold (ERR_NO_ELIGIBLE_ALLOCATIONS)"
        side_effects:
          - "Each ENTERED allocation: quality_score >= threshold -> SCORED with weight and share_cents per value_based_incentive_share; otherwise -> INELIGIBLE with share_cents 0"
          - "allocated_total_cents := sum of SCORED share_cents, equal to pool_amount_cents exactly"

      - from: ALLOCATED
        to: DISTRIBUTED
        trigger: "POST /api/incentive-pools/{id}/distribute"
        actor: GroupFinancialController
        preconditions:
          - "Pool is ALLOCATED (ERR_INVALID_TRANSITION)"
        side_effects:
          - "Each SCORED allocation -> PAYABLE"

      - from: DISTRIBUTED
        to: VOIDED
        trigger: "POST /api/incentive-pools/{id}/void"
        actor: GroupFinancialController
        preconditions:
          - "Pool is DISTRIBUTED (ERR_INVALID_TRANSITION)"
        side_effects:
          - "Each PAYABLE allocation -> VOIDED; PAID allocations stay PAID"
          - "Invariant: sum(PAID share_cents) + sum(VOIDED share_cents) == pool_amount_cents"

  - entity: IncentiveAllocation
    initial_state: ENTERED
    terminal_states: [PAID, VOIDED, INELIGIBLE]
    transitions:
      - from: ENTERED
        to: SCORED
        trigger: "system (pool allocate; quality_score >= threshold)"
        actor: system
        preconditions: []
        side_effects: ["weight and share_cents computed"]

      - from: ENTERED
        to: INELIGIBLE
        trigger: "system (pool allocate; quality_score < threshold)"
        actor: system
        preconditions: []
        side_effects: ["share_cents := 0"]

      - from: SCORED
        to: PAYABLE
        trigger: "system (pool distribute)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PAYABLE
        to: PAID
        trigger: "POST /api/incentive-allocations/{id}/pay"
        actor: GroupFinancialController
        preconditions:
          - "Allocation is PAYABLE (ERR_ALLOCATION_NOT_PAYABLE)"
        side_effects: []

      - from: PAYABLE
        to: VOIDED
        trigger: "system (pool void)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DepartureCase
    initial_state: UNDER_REVIEW
    terminal_states: [SETTLED, RESCINDED]
    transitions:
      - from: UNDER_REVIEW
        to: SETTLEMENT_PENDING
        trigger: "POST /api/departure-cases/{id}/complete-review"
        actor: ComplianceOfficer
        preconditions:
          - "Case is UNDER_REVIEW (ERR_INVALID_TRANSITION)"
        side_effects: []

      - from: SETTLEMENT_PENDING
        to: DISPUTED
        trigger: "POST /api/departure-cases/{id}/dispute"
        actor: PracticeExecutive
        preconditions:
          - "Case is SETTLEMENT_PENDING (ERR_INVALID_TRANSITION)"
          - "Caller owns the practice (ERR_PRACTICE_OWNERSHIP_MISMATCH)"
        side_effects: []

      - from: DISPUTED
        to: SETTLEMENT_PENDING
        trigger: "POST /api/departure-cases/{id}/resettle"
        actor: ComplianceOfficer
        preconditions:
          - "Case is DISPUTED (ERR_INVALID_TRANSITION)"
        side_effects: []

      - from: SETTLEMENT_PENDING
        to: SETTLED
        trigger: "POST /api/departure-cases/{id}/settle"
        actor: ComplianceOfficer
        preconditions:
          - "Case is SETTLEMENT_PENDING (ERR_INVALID_TRANSITION)"
          - "Logical clock date >= earliest_exit_date (ERR_EXIT_DATE_NOT_REACHED)"
        side_effects:
          - "actual_exit_date := max(requested_exit_date, earliest_exit_date, clock date)"
          - "final_penalty_cents and non_compete_applies recomputed per departure_penalty (final variant)"
          - "Practice DEPARTING -> DEPARTED with its full cascade (providers, enrollments, agreement)"

      - from: UNDER_REVIEW
        to: RESCINDED
        trigger: "POST /api/departure-cases/{id}/rescind"
        actor: PracticeExecutive
        preconditions:
          - "Case is UNDER_REVIEW, SETTLEMENT_PENDING, or DISPUTED (ERR_INVALID_TRANSITION)"
          - "Caller owns the practice (ERR_PRACTICE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "Practice DEPARTING -> AFFILIATED"

      - from: SETTLEMENT_PENDING
        to: RESCINDED
        trigger: "POST /api/departure-cases/{id}/rescind"
        actor: PracticeExecutive
        preconditions:
          - "Case is UNDER_REVIEW, SETTLEMENT_PENDING, or DISPUTED (ERR_INVALID_TRANSITION)"
          - "Caller owns the practice (ERR_PRACTICE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "Practice DEPARTING -> AFFILIATED"

      - from: DISPUTED
        to: RESCINDED
        trigger: "POST /api/departure-cases/{id}/rescind"
        actor: PracticeExecutive
        preconditions:
          - "Case is UNDER_REVIEW, SETTLEMENT_PENDING, or DISPUTED (ERR_INVALID_TRANSITION)"
          - "Caller owns the practice (ERR_PRACTICE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "Practice DEPARTING -> AFFILIATED"

  - entity: CommitteeVote
    initial_state: OPEN
    terminal_states: [PASSED, REJECTED]
    transitions:
      - from: OPEN
        to: PASSED
        trigger: "system (a cast ballot raises votes_for above floor(eligible_voter_count / 2))"
        actor: system
        preconditions: []
        side_effects: []

      - from: OPEN
        to: REJECTED
        trigger: "system (a cast ballot raises votes_against above floor(eligible_voter_count / 2), or all eligible voters have cast without votes_for exceeding half)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Provider
    initial_state: ROSTERED
    terminal_states: [DEACTIVATED]
    transitions:
      - from: ROSTERED
        to: ACTIVE
        trigger: "system (first CredentialingEnrollment of this provider reaches EFFECTIVE)"
        actor: system
        preconditions: []
        side_effects: ["practice.active_provider_count recomputed"]

      - from: ACTIVE
        to: DEACTIVATED
        trigger: "system (practice reaches DEPARTED)"
        actor: system
        preconditions: []
        side_effects: ["practice.active_provider_count recomputed"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-practice
    parent_entity: Practice
    write_endpoint: "POST /api/affiliation-agreements"
    occ_field: expected_practice_version
    description: |
      Creating an AffiliationAgreement against a Practice whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just executed an agreement for the practice
      (which legitimately moves the practice ONBOARDING and supersedes the prior
      agreement) and the current writer's view of the practice is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: wave-lock-stale-wave
    parent_entity: ImplementationWave
    write_endpoint: "POST /api/implementation-waves/{id}/lock"
    occ_field: expected_wave_version
    description: |
      Locking an ImplementationWave whose version has advanced since the client
      last observed it is rejected; the client's picture of the cutover window
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: statement-amend-stale-statement
    parent_entity: DistributionStatement
    write_endpoint: "POST /api/distribution-statements/{id}/amend"
    occ_field: expected_statement_version
    description: |
      Amending a DistributionStatement whose version has advanced since the
      client last observed it is rejected; the client would be amending figures
      computed from a superseded batch state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: shared_services_fee
    trigger: "distribution statement creation (provisional variant) and finalize/amend (final variant)"
    algorithm: tiered_pricing
    formula: |
      Mode (a) combinatorial. If the practice's EXECUTED agreement has
      shared_services_rate_override != null:
          fee = round_half_up(gross * override_rate)
      Else (group tiered schedule), process the period's batches in
      chronological order (created_at ASC, tie-break batch created_at then
      period is identical so created_at alone is total):
          tier1_remaining starts at MedicalGroup.shared_services_tier1_cap_cents
          per batch amount a (variant-dependent basis, see practice_distribution_net):
              t1 = min(a, tier1_remaining); t2 = a - t1
              batch_fee = round_half_up(t1 * tier1_rate + t2 * tier2_rate)
              tier1_remaining -= t1
          fee = sum of batch_fee values
      Rounding order is pinned: per-batch round_half_up to whole cents, THEN sum.
    input_set: "Batches of the practice for the statement period; which statuses and which amount field each variant uses is defined by practice_distribution_net"
    constants:
      TIER1_RATE: 0.07
      TIER1_CAP_CENTS: 50000000
      TIER2_RATE: 0.05
    precision: "integer cents; per-batch round_half_up then sum"

  - name: practice_distribution_net
    trigger: "distribution statement creation (provisional) and finalize/amend (final)"
    algorithm: aggregation
    formula: |
      PROVISIONAL variant (at create):
          gross_p = sum over batches of the practice+period of
                    (net_settled_cents if status in {SETTLED, ADJUSTED}
                     else posted_amount_cents if status == POSTED)
          fee_p = shared_services_fee(gross_p basis)
          provisional_net_cents = gross_p - fee_p
      FINAL variant (at finalize/amend):
          gross_f = sum over batches with status in {SETTLED, ADJUSTED} of net_settled_cents
          fee_f = shared_services_fee(gross_f basis)
          net_f = gross_f - fee_f
      For identical batch data the two variants disagree whenever any batch is
      still POSTED or carries denials/adjustments.
    input_set: "CollectionBatch rows of the statement's practice_id + period; POSTED included only in the provisional variant"
    precision: "integer cents"

  - name: distribution_hold_carryforward
    trigger: "distribution statement finalize/amend"
    algorithm: threshold
    formula: |
      Mode (c) pinned evaluation order (the carry makes this circular-looking):
          1. net_distribution_cents from practice_distribution_net (final variant)
          2. carried_forward_in_cents := carried_forward_out_cents of the same
             practice's statement for the immediately preceding calendar month,
             but only if that statement exists and has status in
             {FINAL_ISSUED, REISSUED}; otherwise 0
          3. payable_total_cents := net_distribution_cents + carried_forward_in_cents
          4. IF payable_total_cents >= MedicalGroup.distribution_hold_threshold_cents:
                 payout_cents := payable_total_cents; carried_forward_out_cents := 0
             ELSE:
                 payout_cents := 0; carried_forward_out_cents := payable_total_cents
      The boundary is inclusive on the paying side: exactly the threshold pays out.
    constants:
      HOLD_THRESHOLD_CENTS: 5000
    precision: "integer cents"

  - name: value_based_incentive_share
    trigger: "POST /api/incentive-pools/{id}/allocate"
    algorithm: weighted_scoring
    formula: |
      Mode (b) nested rounding, order pinned.
      Eligible set: ENTERED allocations with quality_score >= pool.quality_threshold.
      Per eligible allocation a:
          weight_a = quality_score_a * attributed_lives_a * market_weight(market of practice_a)
                     (6 decimal places, round_half_up)
      total_weight = sum of weight_a
      raw_share_a = pool.pool_amount_cents * weight_a / total_weight
      floor_share_a = floor(raw_share_a)
      remainder = pool.pool_amount_cents - sum(floor_share_a)
      Distribute remainder one cent at a time to allocations ordered by
      (fractional part of raw_share_a DESC, quality_score_a DESC,
       created_at ASC); each allocation receives at most one cent per pass;
      repeat passes until remainder == 0.
      share_cents = floor_share_a + allocated remainder cents.
      Invariant: sum(share_cents over SCORED) == pool.pool_amount_cents exactly.
    input_set: "IncentiveAllocation rows of the pool with status ENTERED; INELIGIBLE rows get share_cents 0 and weight null"
    precision: "weight 6 dp round_half_up; shares integer cents, floor then remainder waterfall"

  - name: fee_schedule_avg_uplift
    trigger: "POST /api/payer-contracts/{id}/activate for FEE_FOR_SERVICE or HYBRID contracts"
    algorithm: threshold
    formula: |
      Per FeeScheduleRate r with status PROPOSED on the contract:
          uplift_r = (group_rate_cents - legacy_rate_cents) / legacy_rate_cents
      avg_uplift = sum(uplift_r) / count(r), 4 decimal places, round_half_up
      Activation gate: avg_uplift >= 0.0800 (inclusive boundary).
      Zero PROPOSED rates -> gate fails.
    constants:
      MIN_AVG_UPLIFT: 0.08
    precision: "4 decimal places, round_half_up"

  - name: credentialing_effective_date
    trigger: "POST /api/credentialing-enrollments/{id}/approve"
    algorithm: constraint_propagation
    formula: |
      Pinned evaluation order:
          1. lag_days := 90 if channel == STANDARD else 30
          2. lag_date := application_date + lag_days
          3. effective_date := max(lag_date, provider.employment_start_date)
      effective_date is always >= application_date by construction.
      The approved window is the closed interval [effective_date, termination_date].
    constants:
      STANDARD_LAG_DAYS: 90
      EXPEDITED_LAG_DAYS: 30
      EXPEDITED_MAX_REQUEST_SPAN_DAYS: 45
    precision: "whole ISO days"

  - name: departure_penalty
    trigger: "departure case creation (estimated variant) and settle (final variant)"
    algorithm: tiered_pricing
    formula: |
      Let exit_date be the variant basis:
          ESTIMATED (at create): assumed_exit_date = max(requested_exit_date, earliest_exit_date)
          FINAL (at settle):     actual_exit_date   = max(requested_exit_date, earliest_exit_date, clock date at settle)
      tenure_months = (exit.year - aff.year)*12 + (exit.month - aff.month)
                      - (1 if exit.day < aff.day else 0)
      where aff = practice.affiliation_effective_date.
      non_compete_applies := tenure_months < MedicalGroup.non_compete_term_months
      penalty := 0
      if non_compete_applies:
          penalty += early_exit_base_penalty_cents
          penalty += (non_compete_term_months - tenure_months) * early_exit_per_month_cents
      if requested_exit_date < earliest_exit_date:
          penalty += insufficient_notice_penalty_cents
      The two variants diverge whenever the clock has moved past
      assumed_exit_date by settle time.
    constants:
      EARLY_EXIT_BASE_CENTS: 2500000
      PER_MONTH_SHORTFALL_CENTS: 250000
      INSUFFICIENT_NOTICE_CENTS: 500000
      NON_COMPETE_TERM_MONTHS: 24
    precision: "integer cents; tenure in whole calendar months"
    variants:
      - name: estimated
        when: "case creation"
        difference: "exit basis is assumed_exit_date (no clock term)"
      - name: final
        when: "case settle"
        difference: "exit basis is actual_exit_date (includes clock date at settle)"

  - name: market_practice_count
    trigger: "POST /api/practices"
    algorithm: aggregation
    formula: |
      occupied = count of Practices with market_id == market.id and status in
                 {ONBOARDING, AFFILIATED, SUSPENDED, DEPARTING}
      Creation requires occupied < market.max_practices (rejected at occupied == max).
    precision: "integer count; boundary at exactly max_practices"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted on this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Identity binding: PracticeExecutive X-User-ID must equal the target practice_id (agreements, departure cases, allocations); segregation of duties on statement finalize: X-User-ID must differ from settled_by_user_id of every covered batch"
    error_id: "ERR_PRACTICE_OWNERSHIP_MISMATCH / ERR_SEGREGATION_OF_DUTIES"
    http_status: 403
    applies_to: "POST /api/affiliation-agreements, POST /api/affiliation-agreements/{id}/execute, POST /api/departure-cases, POST /api/departure-cases/{id}/dispute, POST /api/departure-cases/{id}/rescind, POST /api/incentive-allocations, POST /api/distribution-statements/{id}/finalize"

  - priority: 3.5
    category: existence
    check: "Request shape: every required input field is present, types match, enum values are in their declared sets, amounts positive where required, periods match YYYY-MM, dates match ISO YYYY-MM-DD"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: existence
    check: "Path ids exist first (left to right), then body foreign keys in the order declared in the endpoint's input list"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version (when the endpoint declares it) equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/affiliation-agreements, POST /api/implementation-waves/{id}/lock, POST /api/distribution-statements/{id}/amend"

  - priority: 6
    category: state
    check: "State-machine preconditions: target resource is in a valid from-state; cross-entity state gates (group OPERATING, practice AFFILIATED, contract ACTIVE, pool SCORING, allocation PAYABLE, wave window states)"
    error_id: "ERR_INVALID_TRANSITION / ERR_GROUP_NOT_OPERATING / ERR_PRACTICE_NOT_AFFILIATED / ERR_CONTRACT_NOT_ACTIVE / ERR_POOL_NOT_SCORING / ERR_ALLOCATION_NOT_PAYABLE / ERR_NO_WAVE_IN_CUTOVER"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_safety
    check: "Compliance acknowledgements: affiliation agreements require non_compete_accepted == true"
    error_id: ERR_NON_COMPETE_ACK_REQUIRED
    http_status: 422
    applies_to: "POST /api/affiliation-agreements"

  - priority: 8
    category: business_temporal
    check: "Interval sanity: cutover_end_date > cutover_start_date; requested_effective_date >= application_date; EXPEDITED channel request span <= 45 days; settle clock >= earliest_exit_date; clock inside wave window for start-cutover/complete"
    error_id: "ERR_INVALID_CUTOVER_WINDOW / ERR_INVALID_REQUEST / ERR_EXPEDITED_WINDOW_EXCEEDED / ERR_EXIT_DATE_NOT_REACHED"
    http_status: 422
    applies_to: "wave create, enrollment create, wave start-cutover/complete, departure settle"

  - priority: 9
    category: business_constraint
    check: "Uniqueness, capacity, overlap: wave cutover windows in one market are half-open [start, end) and must not overlap; enrollment windows for one provider+contract are closed [effective_date, termination_date] and must not overlap; one batch per (practice, contract, period); one statement per (practice, period); one non-terminal departure case per practice; market practice capacity; one ballot per provider per vote"
    error_id: "ERR_WAVE_WINDOW_OVERLAP / ERR_ENROLLMENT_WINDOW_OVERLAP / ERR_DUPLICATE_BATCH / ERR_DUPLICATE_STATEMENT / ERR_MARKET_AT_CAPACITY / ERR_DUPLICATE_VOTE / ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "create endpoints for waves, enrollments (approve), batches, statements, departure cases, practices; vote cast"

  - priority: 10
    category: business_referential
    check: "Cross-linkage: batch requires an EFFECTIVE enrollment linking the practice (via any of its providers) to the contract; allocation requires an EFFECTIVE enrollment linking the practice to the pool's contract; vote creation requires >= 1 eligible voter; contract activation requires a PASSED ratification vote on the contract"
    error_id: "ERR_NO_EFFECTIVE_ENROLLMENT / ERR_NO_ELIGIBLE_VOTERS / ERR_NO_PASSED_RATIFICATION_VOTE"
    http_status: 422
    applies_to: "POST /api/collection-batches, POST /api/incentive-allocations, POST /api/committee-votes, POST /api/payer-contracts/{id}/activate"

  - priority: 11
    category: business_fiscal
    check: "Fiscal gates: all period batches SETTLED/ADJUSTED before statement finalize; fee-schedule average uplift >= 0.08 before FFS/HYBRID contract activation; pool has at least one eligible allocation before allocate"
    error_id: "ERR_UNSETTLED_BATCHES_EXIST / ERR_FEE_SCHEDULE_UPLIFT_INSUFFICIENT / ERR_NO_ELIGIBLE_ALLOCATIONS"
    http_status: 422
    applies_to: "POST /api/distribution-statements/{id}/finalize, POST /api/payer-contracts/{id}/activate, POST /api/incentive-pools/{id}/allocate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. Dates used by date-granularity rules are the UTC calendar date of the logical clock."
    roles: [GroupAdministrator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced/set; no entity mutation"]

  # --- MedicalGroup ---
  - method: POST
    path: "/api/medical-groups"
    description: "Create the medical group (single-TIN entity)"
    roles: [GroupAdministrator]
    code: 201
    input: [tin, display_name, "shared_services_tier1_rate?", "shared_services_tier1_cap_cents?", "shared_services_tier2_rate?", "distribution_hold_threshold_cents?", "departure_notice_days?", "non_compete_term_months?", "early_exit_base_penalty_cents?", "early_exit_per_month_cents?", "insufficient_notice_penalty_cents?"]
    output: MedicalGroup
    side_effects: ["status = FORMING"]

  - method: GET
    path: "/api/medical-groups"
    description: "List medical groups"
    roles: &ALL_ROLES [GroupAdministrator, PayerContractingOfficer, CredentialingCoordinator, PracticeExecutive, DistributionAccountant, GroupFinancialController, MarketCommitteeChair, PhysicianBoardMember, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "MedicalGroup[]"
    side_effects: []

  - method: GET
    path: "/api/medical-groups/{id}"
    description: "Get one medical group"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: MedicalGroup
    side_effects: []

  - method: POST
    path: "/api/medical-groups/{id}/activate"
    description: "FORMING -> OPERATING"
    roles: [GroupAdministrator]
    code: 200
    input: []
    output: MedicalGroup
    side_effects: ["status -> OPERATING"]

  # --- Market ---
  - method: POST
    path: "/api/markets"
    description: "Create a market"
    roles: [GroupAdministrator]
    code: 201
    input: [medical_group_id, name, state_code, max_practices, "market_weight?"]
    output: Market
    side_effects: []

  - method: GET
    path: "/api/markets"
    description: "List markets"
    roles: *ALL_ROLES
    code: 200
    input: ["medical_group_id?", "limit?", "offset?"]
    output: "Market[]"
    side_effects: []

  - method: GET
    path: "/api/markets/{id}"
    description: "Get one market"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Market
    side_effects: []

  # --- Practice ---
  - method: POST
    path: "/api/practices"
    description: "Create a prospect practice"
    roles: [GroupAdministrator]
    code: 201
    input: [medical_group_id, market_id, legal_name, legacy_tin, org_npi]
    output: Practice
    side_effects: ["status = PROSPECT; capacity check per market_practice_count"]

  - method: GET
    path: "/api/practices"
    description: "List practices"
    roles: *ALL_ROLES
    code: 200
    input: ["medical_group_id?", "market_id?", "wave_id?", "status?", "limit?", "offset?"]
    output: "Practice[]"
    side_effects: []

  - method: GET
    path: "/api/practices/{id}"
    description: "Get one practice"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Practice
    side_effects: []

  - method: POST
    path: "/api/practices/{id}/suspend"
    description: "AFFILIATED -> SUSPENDED"
    roles: [GroupAdministrator]
    code: 200
    input: []
    output: Practice
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/api/practices/{id}/reinstate"
    description: "SUSPENDED -> AFFILIATED"
    roles: [GroupAdministrator]
    code: 200
    input: []
    output: Practice
    side_effects: ["status -> AFFILIATED"]

  # --- Provider ---
  - method: POST
    path: "/api/providers"
    description: "Roster a provider into a practice"
    roles: [GroupAdministrator]
    code: 201
    input: [practice_id, npi, full_name, specialty, provider_role, employment_start_date]
    output: Provider
    side_effects: ["status = ROSTERED; practice must be in {PROSPECT, ONBOARDING, AFFILIATED} (ERR_INVALID_TRANSITION)"]

  - method: GET
    path: "/api/providers"
    description: "List providers"
    roles: *ALL_ROLES
    code: 200
    input: ["practice_id?", "status?", "provider_role?", "limit?", "offset?"]
    output: "Provider[]"
    side_effects: []

  - method: GET
    path: "/api/providers/{id}"
    description: "Get one provider"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Provider
    side_effects: []

  # --- AffiliationAgreement ---
  - method: POST
    path: "/api/affiliation-agreements"
    description: "Draft an affiliation agreement (CREATE-with-supersede; OCC on practice version)"
    roles: [PracticeExecutive]
    code: 201
    input: [practice_id, distribution_model, non_compete_accepted, expected_practice_version, "shared_services_rate_override?"]
    output: AffiliationAgreement
    side_effects: ["status = DRAFT; agreement_seq assigned; increments Practice.version by 1"]

  - method: GET
    path: "/api/affiliation-agreements"
    description: "List agreements"
    roles: *ALL_ROLES
    code: 200
    input: ["practice_id?", "status?", "limit?", "offset?"]
    output: "AffiliationAgreement[]"
    side_effects: []

  - method: GET
    path: "/api/affiliation-agreements/{id}"
    description: "Get one agreement"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: AffiliationAgreement
    side_effects: []

  - method: POST
    path: "/api/affiliation-agreements/{id}/execute"
    description: "DRAFT -> EXECUTED; supersedes prior EXECUTED; moves PROSPECT practice to ONBOARDING with wave assignment"
    roles: [PracticeExecutive]
    code: 200
    input: []
    output: AffiliationAgreement
    side_effects: ["prior EXECUTED agreement -> SUPERSEDED; practice PROSPECT -> ONBOARDING + wave_id selector assignment"]

  # --- ImplementationWave ---
  - method: POST
    path: "/api/implementation-waves"
    description: "Plan a technology/RCM implementation wave for a market"
    roles: [GroupAdministrator]
    code: 201
    input: [market_id, wave_code, cutover_start_date, cutover_end_date]
    output: ImplementationWave
    side_effects: ["status = PLANNED; window sanity + half-open overlap checks"]

  - method: GET
    path: "/api/implementation-waves"
    description: "List waves"
    roles: *ALL_ROLES
    code: 200
    input: ["market_id?", "status?", "limit?", "offset?"]
    output: "ImplementationWave[]"
    side_effects: []

  - method: GET
    path: "/api/implementation-waves/{id}"
    description: "Get one wave"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: ImplementationWave
    side_effects: []

  - method: POST
    path: "/api/implementation-waves/{id}/lock"
    description: "PLANNED -> LOCKED (OCC on wave version)"
    roles: [GroupAdministrator]
    code: 200
    input: [expected_wave_version]
    output: ImplementationWave
    side_effects: ["status -> LOCKED; increments ImplementationWave.version by 1"]

  - method: POST
    path: "/api/implementation-waves/{id}/start-cutover"
    description: "LOCKED -> IN_CUTOVER; requires clock >= cutover_start_date"
    roles: [GroupAdministrator]
    code: 200
    input: []
    output: ImplementationWave
    side_effects: ["status -> IN_CUTOVER"]

  - method: POST
    path: "/api/implementation-waves/{id}/complete"
    description: "IN_CUTOVER -> COMPLETE; requires clock < cutover_end_date; fires the affiliation cascade"
    roles: [GroupAdministrator]
    code: 200
    input: []
    output: ImplementationWave
    side_effects: ["status -> COMPLETE; ONBOARDING practices of this wave -> AFFILIATED (cascade hops 1-3)"]

  - method: POST
    path: "/api/implementation-waves/{id}/rollback"
    description: "IN_CUTOVER -> LOCKED (rollback cycle)"
    roles: [GroupAdministrator]
    code: 200
    input: []
    output: ImplementationWave
    side_effects: ["status -> LOCKED; assigned practices remain ONBOARDING"]

  # --- PayerContract ---
  - method: POST
    path: "/api/payer-contracts"
    description: "Open negotiation on a payer contract under the group TIN"
    roles: [PayerContractingOfficer]
    code: 201
    input: [medical_group_id, payer_name, contract_type, effective_date]
    output: PayerContract
    side_effects: ["status = NEGOTIATION; group must be OPERATING (ERR_GROUP_NOT_OPERATING)"]

  - method: GET
    path: "/api/payer-contracts"
    description: "List payer contracts"
    roles: *ALL_ROLES
    code: 200
    input: ["medical_group_id?", "ratifying_vote_id?", "status?", "limit?", "offset?"]
    output: "PayerContract[]"
    side_effects: []

  - method: GET
    path: "/api/payer-contracts/{id}"
    description: "Get one payer contract"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: PayerContract
    side_effects: []

  - method: POST
    path: "/api/payer-contracts/{id}/activate"
    description: "NEGOTIATION -> ACTIVE; requires PASSED ratification vote, clock >= effective_date, and (FFS/HYBRID) avg uplift >= 0.08"
    roles: [PayerContractingOfficer]
    code: 200
    input: []
    output: PayerContract
    side_effects: ["status -> ACTIVE; ratifying_vote_id set; PROPOSED rates -> ACTIVE"]

  - method: POST
    path: "/api/payer-contracts/{id}/terminate"
    description: "ACTIVE -> TERMINATED; cascades enrollment terminations"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PayerContract
    side_effects: ["status -> TERMINATED; enrollments on this contract -> TERMINATED"]

  # --- FeeScheduleRate ---
  - method: POST
    path: "/api/fee-schedule-rates"
    description: "Propose a rate; supersedes an existing PROPOSED rate for the same contract+cpt; contract must be NEGOTIATION"
    roles: [PayerContractingOfficer]
    code: 201
    input: [payer_contract_id, cpt_code, legacy_rate_cents, group_rate_cents]
    output: FeeScheduleRate
    side_effects: ["status = PROPOSED; uplift_pct computed; prior PROPOSED rate for same contract+cpt -> SUPERSEDED"]

  - method: GET
    path: "/api/fee-schedule-rates"
    description: "List fee schedule rates"
    roles: *ALL_ROLES
    code: 200
    input: ["payer_contract_id?", "cpt_code?", "status?", "limit?", "offset?"]
    output: "FeeScheduleRate[]"
    side_effects: []

  - method: GET
    path: "/api/fee-schedule-rates/{id}"
    description: "Get one rate"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: FeeScheduleRate
    side_effects: []

  # --- CredentialingEnrollment ---
  - method: POST
    path: "/api/credentialing-enrollments"
    description: "Submit a provider enrollment under the group TIN with a payer contract"
    roles: [CredentialingCoordinator]
    code: 201
    input: [provider_id, payer_contract_id, channel, requested_effective_date]
    output: CredentialingEnrollment
    side_effects: ["status = SUBMITTED; application_date := clock date; contract must be ACTIVE (ERR_CONTRACT_NOT_ACTIVE); provider practice must be ONBOARDING or AFFILIATED (ERR_INVALID_TRANSITION)"]

  - method: GET
    path: "/api/credentialing-enrollments"
    description: "List enrollments"
    roles: *ALL_ROLES
    code: 200
    input: ["provider_id?", "payer_contract_id?", "status?", "limit?", "offset?"]
    output: "CredentialingEnrollment[]"
    side_effects: []

  - method: GET
    path: "/api/credentialing-enrollments/{id}"
    description: "Get one enrollment"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: CredentialingEnrollment
    side_effects: []

  - method: POST
    path: "/api/credentialing-enrollments/{id}/approve"
    description: "SUBMITTED -> APPROVED (practice ONBOARDING) or -> EFFECTIVE (practice AFFILIATED); computes effective_date; checks closed-interval window overlap"
    roles: [CredentialingCoordinator]
    code: 200
    input: []
    output: CredentialingEnrollment
    side_effects: ["effective_date computed; EFFECTIVE landing cascades provider ROSTERED -> ACTIVE"]

  - method: POST
    path: "/api/credentialing-enrollments/{id}/terminate"
    description: "Any non-terminal state -> TERMINATED with an explicit termination_date"
    roles: [CredentialingCoordinator, ComplianceOfficer]
    code: 200
    input: [termination_date]
    output: CredentialingEnrollment
    side_effects: ["status -> TERMINATED"]

  # --- CollectionBatch ---
  - method: POST
    path: "/api/collection-batches"
    description: "Post a practice's collections for a contract+period (requires EFFECTIVE enrollment linkage)"
    roles: [DistributionAccountant]
    code: 201
    input: [practice_id, payer_contract_id, period, posted_amount_cents]
    output: CollectionBatch
    side_effects: ["status = POSTED; practice must be AFFILIATED or DEPARTING (ERR_PRACTICE_NOT_AFFILIATED)"]

  - method: GET
    path: "/api/collection-batches"
    description: "List collection batches"
    roles: *ALL_ROLES
    code: 200
    input: ["practice_id?", "payer_contract_id?", "period?", "status?", "limit?", "offset?"]
    output: "CollectionBatch[]"
    side_effects: []

  - method: GET
    path: "/api/collection-batches/{id}"
    description: "Get one batch"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: CollectionBatch
    side_effects: []

  - method: POST
    path: "/api/collection-batches/{id}/settle"
    description: "POSTED -> SETTLED with denials recorded"
    roles: [DistributionAccountant]
    code: 200
    input: [denial_amount_cents]
    output: CollectionBatch
    side_effects: ["settled_amount_cents computed; settled_by_user_id recorded"]

  - method: POST
    path: "/api/collection-batches/{id}/adjust"
    description: "SETTLED/ADJUSTED -> ADJUSTED; applies a recoupment/retro delta (negative or positive)"
    roles: [DistributionAccountant]
    code: 200
    input: [adjustment_cents]
    output: CollectionBatch
    side_effects: ["adjustment_total_cents accumulated; net_settled_cents recomputed"]

  # --- DistributionStatement ---
  - method: POST
    path: "/api/distribution-statements"
    description: "Create the period statement for a practice; computes the provisional variant immediately"
    roles: [DistributionAccountant]
    code: 201
    input: [practice_id, period]
    output: DistributionStatement
    side_effects: ["status = PROVISIONAL_ISSUED; provisional_* fields computed; practice must be AFFILIATED or DEPARTING (ERR_PRACTICE_NOT_AFFILIATED)"]

  - method: GET
    path: "/api/distribution-statements"
    description: "List statements"
    roles: *ALL_ROLES
    code: 200
    input: ["practice_id?", "period?", "status?", "limit?", "offset?"]
    output: "DistributionStatement[]"
    side_effects: []

  - method: GET
    path: "/api/distribution-statements/{id}"
    description: "Get one statement"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: DistributionStatement
    side_effects: []

  - method: POST
    path: "/api/distribution-statements/{id}/finalize"
    description: "PROVISIONAL_ISSUED -> FINAL_ISSUED; computes the final variant incl. hold/carry-forward"
    roles: [GroupFinancialController]
    code: 200
    input: []
    output: DistributionStatement
    side_effects: ["final-variant fields computed; segregation-of-duties checked against batch settlers"]

  - method: POST
    path: "/api/distribution-statements/{id}/amend"
    description: "FINAL_ISSUED/REISSUED -> AMENDED with recompute (OCC on statement version)"
    roles: [GroupFinancialController]
    code: 200
    input: [expected_statement_version]
    output: DistributionStatement
    side_effects: ["final-variant fields recomputed from current batch net_settled_cents; increments DistributionStatement.version by 1"]

  - method: POST
    path: "/api/distribution-statements/{id}/reissue"
    description: "AMENDED -> REISSUED"
    roles: [GroupFinancialController]
    code: 200
    input: []
    output: DistributionStatement
    side_effects: ["status -> REISSUED"]

  # --- ValueBasedIncentivePool ---
  - method: POST
    path: "/api/incentive-pools"
    description: "Open a value-based incentive pool on an ACTIVE value-eligible contract"
    roles: [PayerContractingOfficer]
    code: 201
    input: [payer_contract_id, period, pool_amount_cents, "quality_threshold?"]
    output: ValueBasedIncentivePool
    side_effects: ["status = OPEN; contract must be ACTIVE (ERR_CONTRACT_NOT_ACTIVE) and value_based_pool_eligible (ERR_INVALID_REQUEST)"]

  - method: GET
    path: "/api/incentive-pools"
    description: "List pools"
    roles: *ALL_ROLES
    code: 200
    input: ["payer_contract_id?", "period?", "status?", "limit?", "offset?"]
    output: "ValueBasedIncentivePool[]"
    side_effects: []

  - method: GET
    path: "/api/incentive-pools/{id}"
    description: "Get one pool"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: ValueBasedIncentivePool
    side_effects: []

  - method: POST
    path: "/api/incentive-pools/{id}/close-entries"
    description: "OPEN -> SCORING"
    roles: [GroupFinancialController]
    code: 200
    input: []
    output: ValueBasedIncentivePool
    side_effects: ["status -> SCORING"]

  - method: POST
    path: "/api/incentive-pools/{id}/allocate"
    description: "SCORING -> ALLOCATED; computes weights and share_cents per value_based_incentive_share"
    roles: [GroupFinancialController]
    code: 200
    input: []
    output: ValueBasedIncentivePool
    side_effects: ["allocations ENTERED -> SCORED/INELIGIBLE; allocated_total_cents == pool_amount_cents"]

  - method: POST
    path: "/api/incentive-pools/{id}/distribute"
    description: "ALLOCATED -> DISTRIBUTED; SCORED allocations -> PAYABLE"
    roles: [GroupFinancialController]
    code: 200
    input: []
    output: ValueBasedIncentivePool
    side_effects: ["status -> DISTRIBUTED"]

  - method: POST
    path: "/api/incentive-pools/{id}/void"
    description: "DISTRIBUTED -> VOIDED; PAYABLE allocations -> VOIDED; paid/voided shares conserve the pool total"
    roles: [GroupFinancialController]
    code: 200
    input: []
    output: ValueBasedIncentivePool
    side_effects: ["status -> VOIDED"]

  # --- IncentiveAllocation ---
  - method: POST
    path: "/api/incentive-allocations"
    description: "Practice self-attests quality score and attributed lives into an OPEN pool"
    roles: [PracticeExecutive]
    code: 201
    input: [pool_id, practice_id, quality_score, attributed_lives]
    output: IncentiveAllocation
    side_effects: ["status = ENTERED; requires pool OPEN, practice AFFILIATED (ERR_PRACTICE_NOT_AFFILIATED), EFFECTIVE enrollment linkage (ERR_NO_EFFECTIVE_ENROLLMENT)"]

  - method: GET
    path: "/api/incentive-allocations"
    description: "List allocations"
    roles: *ALL_ROLES
    code: 200
    input: ["pool_id?", "practice_id?", "status?", "limit?", "offset?"]
    output: "IncentiveAllocation[]"
    side_effects: []

  - method: GET
    path: "/api/incentive-allocations/{id}"
    description: "Get one allocation"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: IncentiveAllocation
    side_effects: []

  - method: POST
    path: "/api/incentive-allocations/{id}/pay"
    description: "PAYABLE -> PAID"
    roles: [GroupFinancialController]
    code: 200
    input: []
    output: IncentiveAllocation
    side_effects: ["status -> PAID"]

  # --- DepartureCase ---
  - method: POST
    path: "/api/departure-cases"
    description: "Practice gives departure notice; computes earliest_exit_date, notice_sufficient, estimated penalty; practice -> DEPARTING"
    roles: [PracticeExecutive]
    code: 201
    input: [practice_id, requested_exit_date]
    output: DepartureCase
    side_effects: ["status = UNDER_REVIEW; notice_date := clock date; practice AFFILIATED -> DEPARTING (ERR_INVALID_TRANSITION if not AFFILIATED)"]

  - method: GET
    path: "/api/departure-cases"
    description: "List departure cases"
    roles: *ALL_ROLES
    code: 200
    input: ["practice_id?", "status?", "limit?", "offset?"]
    output: "DepartureCase[]"
    side_effects: []

  - method: GET
    path: "/api/departure-cases/{id}"
    description: "Get one departure case"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: DepartureCase
    side_effects: []

  - method: POST
    path: "/api/departure-cases/{id}/complete-review"
    description: "UNDER_REVIEW -> SETTLEMENT_PENDING"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DepartureCase
    side_effects: []

  - method: POST
    path: "/api/departure-cases/{id}/dispute"
    description: "SETTLEMENT_PENDING -> DISPUTED (dispute loop, practice side)"
    roles: [PracticeExecutive]
    code: 200
    input: []
    output: DepartureCase
    side_effects: []

  - method: POST
    path: "/api/departure-cases/{id}/resettle"
    description: "DISPUTED -> SETTLEMENT_PENDING (dispute loop, compliance side)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DepartureCase
    side_effects: []

  - method: POST
    path: "/api/departure-cases/{id}/settle"
    description: "SETTLEMENT_PENDING -> SETTLED; computes final penalty; practice -> DEPARTED with full cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DepartureCase
    side_effects: ["actual_exit_date, final_penalty_cents, non_compete_applies recomputed; practice cascade per Practice state machine"]

  - method: POST
    path: "/api/departure-cases/{id}/rescind"
    description: "UNDER_REVIEW/SETTLEMENT_PENDING/DISPUTED -> RESCINDED; practice returns to AFFILIATED"
    roles: [PracticeExecutive]
    code: 200
    input: []
    output: DepartureCase
    side_effects: ["practice DEPARTING -> AFFILIATED"]

  # --- CommitteeVote ---
  - method: POST
    path: "/api/committee-votes"
    description: "Open a physician-governance motion in a market; snapshots eligible voters"
    roles: [MarketCommitteeChair]
    code: 201
    input: [market_id, motion_type, subject_contract_id]
    output: CommitteeVote
    side_effects: ["status = OPEN; eligible_voter_count snapshot; requires >= 1 eligible voter (ERR_NO_ELIGIBLE_VOTERS)"]

  - method: GET
    path: "/api/committee-votes"
    description: "List committee votes"
    roles: *ALL_ROLES
    code: 200
    input: ["market_id?", "subject_contract_id?", "status?", "limit?", "offset?"]
    output: "CommitteeVote[]"
    side_effects: []

  - method: GET
    path: "/api/committee-votes/{id}"
    description: "Get one vote"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: CommitteeVote
    side_effects: []

  - method: POST
    path: "/api/committee-votes/{id}/cast"
    description: "Physician board member casts a ballot; auto-closes per majority rules"
    roles: [PhysicianBoardMember]
    code: 200
    input: [ballot]
    output: CommitteeVote
    side_effects: ["votes_for/votes_against updated; caller's provider id recorded; auto-close to PASSED/REJECTED per CommitteeVote state machine; caller must be an eligible voter (ERR_INSUFFICIENT_PERMISSIONS), one ballot each (ERR_DUPLICATE_VOTE)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted on this endpoint, or vote caster is not an eligible voter" }
  - { id: ERR_PRACTICE_OWNERSHIP_MISMATCH, http: 403, condition: "PracticeExecutive X-User-ID does not equal the target practice_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Statement finalizer X-User-ID equals settled_by_user_id of a covered batch" }
  - { id: ERR_MEDICAL_GROUP_NOT_FOUND, http: 404, condition: "Medical group id does not exist" }
  - { id: ERR_MARKET_NOT_FOUND, http: 404, condition: "Market id does not exist" }
  - { id: ERR_PRACTICE_NOT_FOUND, http: 404, condition: "Practice id does not exist" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "Provider id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "Affiliation agreement id does not exist" }
  - { id: ERR_WAVE_NOT_FOUND, http: 404, condition: "Implementation wave id does not exist" }
  - { id: ERR_PAYER_CONTRACT_NOT_FOUND, http: 404, condition: "Payer contract id does not exist" }
  - { id: ERR_RATE_NOT_FOUND, http: 404, condition: "Fee schedule rate id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Credentialing enrollment id does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "Collection batch id does not exist" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "Distribution statement id does not exist" }
  - { id: ERR_POOL_NOT_FOUND, http: 404, condition: "Incentive pool id does not exist" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "Incentive allocation id does not exist" }
  - { id: ERR_DEPARTURE_CASE_NOT_FOUND, http: 404, condition: "Departure case id does not exist" }
  - { id: ERR_VOTE_NOT_FOUND, http: 404, condition: "Committee vote id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid required field, bad enum, non-positive amounts, negative or over-posted denials, zero adjustment, requested_effective_date before application_date, ballot value not in {FOR, AGAINST}" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_INVALID_TRANSITION, http: 409, condition: "State machine has no transition for this trigger from the entity's current state" }
  - { id: ERR_GROUP_NOT_OPERATING, http: 409, condition: "Operation requires the medical group to be OPERATING" }
  - { id: ERR_PRACTICE_NOT_AFFILIATED, http: 409, condition: "Operation requires the practice to be AFFILIATED (or DEPARTING where noted)" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Operation requires the payer contract to be ACTIVE" }
  - { id: ERR_POOL_NOT_SCORING, http: 409, condition: "Allocate requires the pool to be SCORING" }
  - { id: ERR_ALLOCATION_NOT_PAYABLE, http: 409, condition: "Pay requires the allocation to be PAYABLE" }
  - { id: ERR_NO_WAVE_IN_CUTOVER, http: 409, condition: "Agreement execution for a PROSPECT practice finds no IN_CUTOVER wave in the practice's market" }
  - { id: ERR_NO_PASSED_RATIFICATION_VOTE, http: 422, condition: "Contract activation lacks a PASSED PAYER_CONTRACT_RATIFICATION vote on the contract" }
  - { id: ERR_NO_ELIGIBLE_VOTERS, http: 422, condition: "Vote creation would snapshot zero eligible physician voters in the market" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "Provider has already cast a ballot on this vote" }
  - { id: ERR_INVALID_CUTOVER_WINDOW, http: 422, condition: "cutover_end_date not strictly after cutover_start_date, or clock outside the permitted window for start-cutover/complete, or contract activation before its effective_date" }
  - { id: ERR_EXPEDITED_WINDOW_EXCEEDED, http: 422, condition: "EXPEDITED channel requested_effective_date is more than 45 days after application_date" }
  - { id: ERR_WAVE_WINDOW_OVERLAP, http: 409, condition: "Wave cutover window overlaps another non-COMPLETE wave in the same market under half-open [start, end) semantics (shared boundary instant is allowed)" }
  - { id: ERR_ENROLLMENT_WINDOW_OVERLAP, http: 409, condition: "Approved enrollment window overlaps another non-TERMINATED enrollment for the same provider+contract under closed-interval semantics (termination day itself is occupied; the next day is free)" }
  - { id: ERR_MARKET_AT_CAPACITY, http: 409, condition: "Market already holds max_practices practices in {ONBOARDING, AFFILIATED, SUSPENDED, DEPARTING}" }
  - { id: ERR_DUPLICATE_BATCH, http: 409, condition: "A batch already exists for (practice_id, payer_contract_id, period)" }
  - { id: ERR_DUPLICATE_STATEMENT, http: 409, condition: "A statement already exists for (practice_id, period)" }
  - { id: ERR_NO_EFFECTIVE_ENROLLMENT, http: 422, condition: "No EFFECTIVE enrollment links the practice (via any of its providers) to the referenced payer contract" }
  - { id: ERR_UNSETTLED_BATCHES_EXIST, http: 422, condition: "Statement finalize found a POSTED batch in the practice's period" }
  - { id: ERR_FEE_SCHEDULE_UPLIFT_INSUFFICIENT, http: 422, condition: "FFS/HYBRID contract activation with zero PROPOSED rates or average uplift below 0.08" }
  - { id: ERR_NON_COMPETE_ACK_REQUIRED, http: 422, condition: "Affiliation agreement submitted with non_compete_accepted != true" }
  - { id: ERR_EXIT_DATE_NOT_REACHED, http: 422, condition: "Departure settle attempted before earliest_exit_date" }
  - { id: ERR_NO_ELIGIBLE_ALLOCATIONS, http: 422, condition: "Pool allocate found no ENTERED allocation with quality_score >= quality_threshold" }

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: GroupAdministrator
    description: "Group operations: group/market/practice/provider master data, implementation waves, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /api/medical-groups, POST /api/medical-groups/{id}/activate"
      - "POST /api/markets"
      - "POST /api/practices, POST /api/practices/{id}/suspend, POST /api/practices/{id}/reinstate"
      - "POST /api/providers"
      - "POST /api/implementation-waves and its lock/start-cutover/complete/rollback"
    shared_operations: ["all GET endpoints"]

  - name: PayerContractingOfficer
    description: "Payer contracting: contracts, fee schedule rates, incentive pools"
    identity: opaque
    exclusive_operations:
      - "POST /api/payer-contracts, POST /api/payer-contracts/{id}/activate"
      - "POST /api/fee-schedule-rates"
      - "POST /api/incentive-pools"
    shared_operations: ["all GET endpoints"]

  - name: CredentialingCoordinator
    description: "Provider credentialing and payer enrollment"
    identity: opaque
    exclusive_operations:
      - "POST /api/credentialing-enrollments, POST /api/credentialing-enrollments/{id}/approve"
    shared_operations:
      - "all GET endpoints"
      - "POST /api/credentialing-enrollments/{id}/terminate (shared with ComplianceOfficer)"

  - name: PracticeExecutive
    description: "Affiliated practice's executive; acts strictly on own practice (X-User-ID == Practice.id)"
    identity: "entity_backed:Practice"
    exclusive_operations:
      - "POST /api/affiliation-agreements, POST /api/affiliation-agreements/{id}/execute"
      - "POST /api/departure-cases, POST /api/departure-cases/{id}/dispute, POST /api/departure-cases/{id}/rescind"
      - "POST /api/incentive-allocations"
    shared_operations: ["all GET endpoints"]

  - name: DistributionAccountant
    description: "Revenue cycle: posts and settles collection batches, drafts distribution statements; may NOT finalize statements (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /api/collection-batches, POST /api/collection-batches/{id}/settle, POST /api/collection-batches/{id}/adjust"
      - "POST /api/distribution-statements"
    shared_operations: ["all GET endpoints"]

  - name: GroupFinancialController
    description: "Group finance: finalizes/amends/reissues statements, runs incentive allocation and payment; may NOT post or settle batches"
    identity: opaque
    exclusive_operations:
      - "POST /api/distribution-statements/{id}/finalize, /amend, /reissue"
      - "POST /api/incentive-pools/{id}/close-entries, /allocate, /distribute, /void"
      - "POST /api/incentive-allocations/{id}/pay"
    shared_operations: ["all GET endpoints"]

  - name: MarketCommitteeChair
    description: "Physician chair of the market committee; opens governance motions but never votes (segregation of duties)"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /api/committee-votes"
    shared_operations: ["all GET endpoints"]

  - name: PhysicianBoardMember
    description: "Physician member of the market committee; casts ballots (X-User-ID == Provider.id, must be a non-DEACTIVATED PHYSICIAN of an ONBOARDING or AFFILIATED practice in the vote's market)"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /api/committee-votes/{id}/cast"
    shared_operations: ["all GET endpoints"]

  - name: ComplianceOfficer
    description: "Compliance: departure review/settlement, contract and enrollment termination"
    identity: opaque
    exclusive_operations:
      - "POST /api/payer-contracts/{id}/terminate"
      - "POST /api/departure-cases/{id}/complete-review, /resettle, /settle"
    shared_operations:
      - "all GET endpoints"
      - "POST /api/credentialing-enrollments/{id}/terminate (shared with CredentialingCoordinator)"
