            - "Distribution.investor_residual_cents == 32785480"
            - "Distribution.per_share_cents == 819"
            - "32785480 - 819 * 40000 == 25480, and that remainder is assigned whole to the earliest-crated accepted holder ${inv_a}"
            - "Offering.status == CLOSED and Artwork.${artwork_id}.status == SOLD"

      - name: registration_cap_reading_decides_how_many_shares_are_accepted
        grounds:
          - calculations.registration_share_cap
          - calculations.registration_share_cap.variants.allowed_shares_reading
          - entities.Offering.fields.registration_cap_pct
          - state_machines.Subscription.SUBSCRIBED_to_REALLOCATED
          - endpoints.POST_/api/offerings/{id}/allocate
        distinguishing_aspect: "Mode (c) evaluation-order dependency: accepted_shares depends on the cap, the cap depends on total_shares, and the pre-existing holdings that the cap tests against are themselves the allocation being computed — the scaffold pins that holdings are evaluated from subscriptions already accepted in ALLOCATED_SUBSCRIPTION_RANK_ORDER before the cap is clamped, so a later subscriber's clamp depends on an earlier subscriber's outcome, and the reserved-shares misreading yields a different accepted total."
