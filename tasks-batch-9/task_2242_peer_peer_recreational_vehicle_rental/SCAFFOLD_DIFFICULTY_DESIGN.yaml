                declared_generator_hours: 11.0
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: "$.data.id", booking_v: "$.data.version" }
            - *c_bk_approve
          trigger:
            - *c_bk_confirm
          assert:
            - "response 200"
            - "data.premium_cents == 45000"
            - "data.loyalty_tier == 'LOYALTY_TIER_2'"
            - "data.loyalty_discount_cents == 10913"
            - "data.service_fee_cents == 17398"
            - "data.quoted_total_cents == 162381"

      - name: premium_mode_coverage_ceiling_cap_binds_the_min
        grounds: >-
          §1.3 protection_premium's outer min() against
          round_half_up(coverage_ceiling_cents * PREMIUM_CEILING_CAP_BP / 10000),
