      - name: unauthorized_outranks_every_existence_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=5]
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_PROJECT_NOT_FOUND
        distinguishing_aspect: |
          The role gate at priority 2 must answer before any id is looked up, so a
          forbidden caller learns nothing about which projects exist: the same
          request differs only in the X-User-Role header and must flip between 403
          and 404. Frameworks that resolve the body's project_id in a dependency
          before the permission decorator leak existence to unauthorised callers.
        test_recipe:
          setup:
            - "One FP10-IN project ${pj} exists; the id 00000000-0000-0000-0000-0000000000ff belongs to nothing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
