              payload: {}
              as: DistrictManager
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_POV_NOTICE_REQUIRES_POTENTIAL"
            - "Mine.${m_id}.pov_status remains NONE and no POVScreening row is created"

      - name: extend_abatement_after_deadline_rejected
