              as_user_id: "eng-b"
            - call: "POST /regulatory-reports/${r2}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-b"
            - call: "GET /storage-fields/${f1}/regulatory-reports"
