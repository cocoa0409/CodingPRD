# =============================================================================
# SCAFFOLD: Long-Lifecycle Analog Supply, Direct Sales & Inventory Strategy
# (Texas Instruments-style analog semiconductor direct-sales model)
# =============================================================================

scenario: |
  Long-Lifecycle Analog Supply, Direct Sales & Inventory Strategy (Texas
  Instruments): product portfolio of tens of thousands of parts with long
  production lifetimes and low obsolescence rates, internal manufacturing
  capacity investment providing supply control with inventory held deliberately
  above demand to buffer cycles, direct sales and online purchasing channel
  expansion with reduced reliance on distributors and its effect on small
  customer service, pricing consistency across channel and volume tiers with
  published pricing, lifetime buy and end-of-life notification programs for
  discontinued parts with last order dates, technical support and reference
  design publication driving design wins with long revenue tails, capacity
  allocation during shortages with customer prioritization criteria, packaging,
  test and assembly site qualification for automotive and industrial customers.

domain_name: analog-direct-supply
api_prefix: ""   # flat multi-root API; all endpoint paths are root-relative (/parts, /orders, ...)

complexity_profile:
  primary_archetype: quota_allocation        # shortage capacity/supply allocation with customer prioritization
  secondary_archetype: temporal_windowing    # EOL notice windows, last-order dates, half-open capacity periods
  complexity_layers:
    - optimistic_concurrency                 # OCC on Part.version (pricing publish) and CapacityPool.version (invest)
    - cascading_side_effects                 # EOL notice -> Part -> DesignWin -> Customer; publish -> Order -> Part.reserved -> posture
    - scheduled_actions                      # logical-clock sweep drives LAST_TIME_BUY / DISCONTINUED / pool OPEN/CLOSED / DesignWin COMPLETED
    - derived_field_reconciliation           # reserved_units, open_exposure_cents, posture, qualified_for_automotive
  entity_topology: flat                      # peer entities joined by foreign keys, no nested ownership tree
  state_machine_shape: branching             # order fork at submit (ALLOCATED vs BACKORDERED); cyclic Part lifecycle; cyclic qualification
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles                     # SupplyPlanner / ChannelManager / QualityEngineer / FieldEngineer / Customer
  consistency_model: immediate               # every mutation visible in the same response

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: part_number, type: string, source: input, description: "Catalog part number, globally unique (e.g. 'OPA2376AIDGKR')" }
      - { name: description, type: string, source: input, description: "Human-readable part description" }
      - { name: package_family, type: string, source: input, description: "Package family code (e.g. SOIC, QFN, TO92)" }
      - { name: process_technology, type: string, source: input, description: "Process technology code (e.g. ANALOG_BIPOLAR, CMOS_180NM)" }
      - { name: automotive_grade, type: boolean, source: input, default: false, description: "True when the part is qualified for automotive applications" }
      - { name: lifecycle_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | NRND | EOL_ANNOUNCED | LAST_TIME_BUY | DISCONTINUED" }
      - { name: demand_rate_units_per_week, type: integer, source: input, default: 0, description: "Planner-maintained trailing demand rate in units/week" }
      - { name: buffer_multiple, type: number, source: input, default: 1.5, description: "Deliberate inventory buffer multiple applied to demand (supply-control policy)" }
      - { name: on_hand_units, type: integer, source: system, default: 0, description: "Physical finished-goods units in the direct warehouse" }
      - { name: reserved_units, type: integer, source: computed, default: 0, description: "Units reserved by ALLOCATED order lines plus APPROVED lifetime buys" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | WATCH | SHORTAGE — derived from trailing coverage vs thresholds (see calc_buffer_position)" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer company name" }
      - { name: tier, type: enum, source: input, description: "STRATEGIC | KEY | STANDARD | SMALL — drives allocation priority weight and service-fee policy" }
      - { name: channel, type: enum, source: input, description: "DIRECT_ONLINE | DIRECT_FIELD | DISTRIBUTOR — the customer's purchasing channel" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed open order exposure in cents" }
      - { name: discount_pct, type: number, source: input, default: 0, description: "Contractual line-level discount fraction (e.g. 0.10 = 10%); applied per order line at submit" }
      - { name: open_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents of this customer's orders in status ALLOCATED or BACKORDERED plus approved lifetime-buy value" }
      - { name: at_risk_design_win_count, type: integer, source: computed, default: 0, description: "Count of this customer's ACTIVE design wins with at_risk == true" }

  - name: PricingSchedule
    parent: null
    common_fields: true
    fields:
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; the part this published schedule prices" }
      - { name: effective_from, type: datetime, source: input, description: "ISO8601 instant from which this schedule is effective" }
      - { name: tiers, type: array, source: input, description: "Volume tiers [{min_qty: integer, unit_price_cents: integer}], sorted ascending by min_qty; first tier MUST have min_qty == 1; identical for every channel (published pricing consistency)" }
      - { name: status, type: enum, source: system, default: PUBLISHED, description: "PUBLISHED | SUPERSEDED — creating a new schedule supersedes the prior PUBLISHED one for the same part" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock timestamp when this schedule became PUBLISHED" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the purchasing customer (must equal X-User-ID when X-User-Role is Customer)" }
      - { name: channel, type: enum, source: system, description: "DIRECT_ONLINE | DIRECT_FIELD | DISTRIBUTOR — snapshot of customer.channel at order creation" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ALLOCATED | BACKORDERED | SHIPPED | CANCELLED" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of rounded line totals; computed at submit (see calc_order_totals)" }
      - { name: service_fee_cents, type: integer, source: computed, default: 0, description: "Small-customer online service fee (SMALL_ORDER_FEE_CENTS when tier SMALL + channel DIRECT_ONLINE + subtotal < MIN_ORDER_SUBTOTAL_CENTS, else 0)" }
      - { name: total_cents, type: integer, source: computed, description: "= subtotal_cents + service_fee_cents" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submit; null while DRAFT" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> SalesOrder.id; owning order" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; ordered part" }
      - { name: quantity, type: integer, source: input, description: "Ordered units, >= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Published tier unit price locked at submit (null while DRAFT)" }
      - { name: line_total_cents, type: integer, source: computed, description: "round_half_up(unit_price_cents * quantity * (1 - discount_pct)) computed per line at submit (null while DRAFT)" }
      - { name: awarded_units, type: integer, source: computed, default: 0, description: "Units awarded so far (auto-award at submit for non-SHORTAGE parts; allocation-run awards for SHORTAGE parts)" }
      - { name: allocation_run_id, type: string, source: system, description: "Id of the AllocationRun that last awarded this line; null if never awarded by a run" }
      - { name: allocation_rank, type: integer, source: system, description: "1-based processing rank inside the awarding run; null if never awarded by a run" }
      - { name: allocation_priority_score, type: integer, source: system, description: "Priority score used by the awarding run; null if never awarded by a run" }

  - name: CapacityPool
    parent: null
    common_fields: true
    fields:
      - { name: site_name, type: string, source: input, description: "Manufacturing/packaging/test/assembly site code (e.g. 'DFAB', 'ATX-ASSEMBLY')" }
      - { name: process_technology, type: string, source: input, description: "Process technology this pool serves" }
      - { name: period_start, type: datetime, source: input, description: "Half-open capacity window start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Half-open capacity window end (exclusive)" }
      - { name: total_units, type: integer, source: input, description: "Installed capacity units for the window (>= 1); raised by capacity investment" }
      - { name: allocated_units, type: integer, source: computed, default: 0, description: "Capacity units consumed by production receipts" }
      - { name: status, type: enum, source: computed, description: "PLANNED | OPEN | CLOSED — derived from logical clock vs [period_start, period_end): now < start => PLANNED; start <= now < end => OPEN; now >= end => CLOSED" }
      - { name: qualified_for_automotive, type: boolean, source: computed, default: false, description: "True iff a SiteQualification with same site_name, segment AUTOMOTIVE, status QUALIFIED exists" }

  - name: AllocationRun
    parent: null
    common_fields: true
    fields:
      - { name: period_label, type: string, source: input, description: "Human label for the allocation period (e.g. '2026-W40')" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED" }
      - { name: shortage_part_ids, type: array, source: computed, description: "Reporting field: Part ids with posture == SHORTAGE at run creation, sorted by part_number ASC (award eligibility itself covers every BACKORDERED line with remaining > 0, any posture)" }
      - { name: awards, type: array, source: computed, description: "Computed awards [{order_line_id, awarded_units, priority_score, rank}] — one entry per eligible line (0-award entries included); frozen at creation, applied on publish" }

  - name: EolNotice
    parent: null
    common_fields: true
    fields:
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; part being discontinued (path parameter of the creating endpoint)" }
      - { name: notice_date, type: datetime, source: input, description: "Customer-visible end-of-life notification date" }
      - { name: last_order_date, type: datetime, source: input, description: "Last date orders/lifetime-buys are accepted; MUST be >= notice_date + EOL_NOTICE_MIN_DAYS (180 days)" }
      - { name: last_ship_date, type: datetime, source: input, description: "Final ship date; MUST be >= last_order_date + LAST_SHIP_MIN_DAYS_AFTER_ORDER (90 days)" }
      - { name: reason, type: string, source: input, description: "Free-text discontinuation reason" }
      - { name: status, type: enum, source: system, default: ANNOUNCED, description: "ANNOUNCED | RESCINDED | COMPLETED" }

  - name: LifetimeBuy
    parent: null
    common_fields: true
    fields:
      - { name: eol_notice_id, type: string, source: input, description: "FK -> EolNotice.id; the ANNOUNCED notice this lifetime buy is placed against" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; discontinued part being bought (must equal the notice's part)" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; purchasing customer (must equal X-User-ID when X-User-Role is Customer)" }
      - { name: quantity, type: integer, source: input, description: "Lifetime demand units; MUST be >= part.demand_rate_units_per_week * LTB_MIN_COVERAGE_WEEKS (52)" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Locked unit price from the schedule PUBLISHED at the notice's notice_date (see calc_ltb_unit_price)" }
      - { name: ltb_value_cents, type: integer, source: computed, description: "= unit_price_cents * quantity" }
      - { name: status, type: enum, source: system, default: APPROVED, description: "APPROVED | CANCELLED" }

  - name: SiteQualification
    parent: null
    common_fields: true
    fields:
      - { name: site_name, type: string, source: input, description: "Packaging/test/assembly site code being qualified (matches CapacityPool.site_name)" }
      - { name: segment, type: enum, source: input, description: "AUTOMOTIVE | INDUSTRIAL — market segment the site is qualified for" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | IN_REVIEW | QUALIFIED | SUSPENDED | REJECTED" }
      - { name: qualified_at, type: datetime, source: system, description: "Logical-clock timestamp of the QUALIFIED transition; null until qualified" }
      - { name: validity_months, type: integer, source: input, default: 24, description: "Qualification validity length in months (QUAL status validity window is [qualified_at, qualified_at + validity_months])" }

  - name: ReferenceDesign
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Reference design title" }
      - { name: featured_part_number, type: string, source: input, description: "Catalog part_number featured by this design (matches Part.part_number; not an id reference)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock timestamp of publication; null while DRAFT" }

  - name: DesignWin
    parent: null
    common_fields: true
    fields:
      - { name: reference_design_id, type: string, source: input, description: "FK -> ReferenceDesign.id; the published reference design that drove this win" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; customer whose end-product won the design" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; part designed in" }
      - { name: expected_lifetime_revenue_cents, type: integer, source: input, description: "Expected revenue over the win's 4-year life" }
      - { name: annual_volume_units, type: integer, source: input, description: "Expected annual unit volume at production (feeds forward-looking buffer)" }
      - { name: start_date, type: datetime, source: input, description: "Production start date of the winning end-product" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | ACTIVE | COMPLETED" }
      - { name: at_risk, type: boolean, source: computed, default: false, description: "True while the designed-in part is in EOL_ANNOUNCED / LAST_TIME_BUY / DISCONTINUED" }
      - { name: recognized_ramped_cents, type: integer, source: computed, description: "Revenue recognized to date under RAMP_PROFILE [0.20,0.40,0.25,0.15] (see calc_revenue_tail)" }
      - { name: recognized_flat_cents, type: integer, source: computed, description: "Revenue recognized to date under flat 25%-per-year profile" }
      - { name: recognized_revenue_cents, type: integer, source: computed, description: "Canonical recognized revenue: ramped when part.automotive_grade, flat otherwise" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Part
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: NRND
        trigger: "PATCH /parts/{id} with lifecycle_status=NRND"
        actor: SupplyPlanner
        preconditions: ["lifecycle_status == ACTIVE"]
        side_effects: []
      - from: NRND
        to: ACTIVE
        trigger: "PATCH /parts/{id} with lifecycle_status=ACTIVE"
        actor: SupplyPlanner
        preconditions: ["lifecycle_status == NRND"]
        side_effects: []
      - from: ACTIVE
        to: EOL_ANNOUNCED
        trigger: "system (on POST /parts/{id}/eol-notices success)"
        actor: system
        preconditions: []
        side_effects:
          - "Every DesignWin with part_id == this part and status == ACTIVE flips at_risk to true"
          - "Each affected DesignWin's owning Customer.at_risk_design_win_count is recomputed (= count of that customer's ACTIVE design wins with at_risk == true)"
      - from: NRND
        to: EOL_ANNOUNCED
        trigger: "system (on POST /parts/{id}/eol-notices success)"
        actor: system
        preconditions: []
        side_effects:
          - "Every DesignWin with part_id == this part and status == ACTIVE flips at_risk to true"
          - "Each affected DesignWin's owning Customer.at_risk_design_win_count is recomputed"
      - from: EOL_ANNOUNCED
        to: ACTIVE
        trigger: "system (on POST /eol-notices/{id}/rescind success)"
        actor: system
        preconditions: []
        side_effects:
          - "Every DesignWin with part_id == this part and status == ACTIVE flips at_risk back to false"
          - "Each affected DesignWin's owning Customer.at_risk_design_win_count is recomputed"
      - from: EOL_ANNOUNCED
        to: LAST_TIME_BUY
        trigger: "system (clock sweep: logical clock >= the ANNOUNCED EolNotice.last_order_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LAST_TIME_BUY
        to: DISCONTINUED
        trigger: "system (clock sweep: logical clock >= the ANNOUNCED EolNotice.last_ship_date)"
        actor: system
        preconditions: []
        side_effects:
          - "The linked EolNotice transitions ANNOUNCED -> COMPLETED"

  - entity: SalesOrder
    initial_state: DRAFT
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ALLOCATED
        trigger: "POST /orders/{id}/submit (fork branch: every line fully auto-awarded)"
        actor: Customer
        preconditions:
          - "Order has >= 1 line"
          - "Every line's Part.lifecycle_status in {ACTIVE, NRND, EOL_ANNOUNCED} (ERR_PART_NOT_ORDERABLE)"
          - "Every line's part has a PUBLISHED PricingSchedule (ERR_NO_PUBLISHED_PRICING)"
          - "customer.open_exposure_cents + order total_cents <= customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Each line: unit_price_cents locked via calc_unit_price_quote; line_total_cents via calc_order_totals; awarded_units = quantity for lines whose part posture != SHORTAGE and (on_hand_units - reserved_units) >= quantity; Part.reserved_units += awarded_units"
          - "Order subtotal_cents / service_fee_cents / total_cents computed; submitted_at stamped"
          - "Customer.open_exposure_cents += total_cents"
          - "Part.posture recomputed for every ordered part"
      - from: DRAFT
        to: BACKORDERED
        trigger: "POST /orders/{id}/submit (fork branch: at least one line not fully auto-awarded)"
        actor: Customer
        preconditions: ["Same preconditions as DRAFT -> ALLOCATED"]
        side_effects: ["Same side effects as DRAFT -> ALLOCATED (partial auto-awards and reservations persist)"]
      - from: BACKORDERED
        to: ALLOCATED
        trigger: "system (on POST /allocation-runs/{id}/publish when every line's awarded_units == quantity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /orders/{id}/ship"
        actor: SupplyPlanner
        preconditions: ["status == ALLOCATED"]
        side_effects:
          - "Each line: Part.on_hand_units -= awarded_units; Part.reserved_units -= awarded_units"
          - "Customer.open_exposure_cents -= order total_cents"
          - "Part.posture recomputed for every shipped part"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "Each line: Part.reserved_units -= awarded_units; awarded_units reset to 0"
          - "Customer.open_exposure_cents -= order total_cents"
          - "Part.posture recomputed for every ordered part"
      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "Each line: Part.reserved_units -= awarded_units; awarded_units reset to 0"
          - "Customer.open_exposure_cents -= order total_cents"
          - "Part.posture recomputed for every ordered part"

  - entity: EolNotice
    initial_state: ANNOUNCED
    terminal_states: [RESCINDED, COMPLETED]
    transitions:
      - from: ANNOUNCED
        to: RESCINDED
        trigger: "POST /eol-notices/{id}/rescind"
        actor: SupplyPlanner
        preconditions: ["status == ANNOUNCED", "Part.lifecycle_status == EOL_ANNOUNCED for the notice's part (ERR_INVALID_STATE otherwise)"]
        side_effects:
          - "Part.lifecycle_status EOL_ANNOUNCED -> ACTIVE (rescission always restores ACTIVE)"
      - from: ANNOUNCED
        to: COMPLETED
        trigger: "system (clock sweep: linked Part reaches DISCONTINUED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LifetimeBuy
    initial_state: APPROVED
    terminal_states: [CANCELLED]
    transitions:
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /lifetime-buys/{id}/cancel"
        actor: Customer
        preconditions: ["status == APPROVED"]
        side_effects:
          - "Part.reserved_units -= quantity"
          - "Customer.open_exposure_cents -= ltb_value_cents"
          - "Part.posture recomputed"

  - entity: CapacityPool
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "system (clock sweep: period_start <= now < period_end)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "system (clock sweep: now >= period_end)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: CLOSED
        trigger: "system (clock sweep jumps past period_end in one step)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AllocationRun
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /allocation-runs/{id}/publish"
        actor: SupplyPlanner
        preconditions: ["status == DRAFT"]
        side_effects:
          - "Each award: OrderLine.awarded_units += awarded_units (cumulative), allocation_run_id/allocation_rank/allocation_priority_score stamped"
          - "Each affected order: Part.reserved_units += awarded_units for its lines; order flips BACKORDERED -> ALLOCATED when every line's awarded_units == quantity"
          - "Part.posture recomputed for every part touched by an award"

  - entity: SiteQualification
    initial_state: REQUESTED
    terminal_states: [REJECTED]
    transitions:
      - from: REQUESTED
        to: IN_REVIEW
        trigger: "POST /site-qualifications/{id}/transition {to_state: IN_REVIEW}"
        actor: QualityEngineer
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: QUALIFIED
        trigger: "POST /site-qualifications/{id}/transition {to_state: QUALIFIED}"
        actor: QualityEngineer
        preconditions: ["No other SiteQualification with same site_name + segment in status QUALIFIED or SUSPENDED (ERR_QUALIFICATION_OVERLAP)"]
        side_effects:
          - "qualified_at stamped from logical clock"
          - "When segment == AUTOMOTIVE: every CapacityPool with matching site_name recomputes qualified_for_automotive = true"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /site-qualifications/{id}/transition {to_state: REJECTED}"
        actor: QualityEngineer
        preconditions: []
        side_effects: []
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /site-qualifications/{id}/transition {to_state: SUSPENDED}"
        actor: QualityEngineer
        preconditions: []
        side_effects:
          - "When segment == AUTOMOTIVE: every CapacityPool with matching site_name recomputes qualified_for_automotive = false"
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /site-qualifications/{id}/transition {to_state: QUALIFIED}"
        actor: QualityEngineer
        preconditions: ["No other SiteQualification with same site_name + segment in status QUALIFIED or SUSPENDED (ERR_QUALIFICATION_OVERLAP)"]
        side_effects:
          - "qualified_at re-stamped from logical clock"
          - "When segment == AUTOMOTIVE: every CapacityPool with matching site_name recomputes qualified_for_automotive = true"

  - entity: ReferenceDesign
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /reference-designs/{id}/publish"
        actor: FieldEngineer
        preconditions: ["featured_part_number matches an existing Part.part_number whose lifecycle_status is in {ACTIVE, NRND} (ERR_PART_NOT_ORDERABLE)"]
        side_effects: ["published_at stamped from logical clock"]

  - entity: DesignWin
    initial_state: REGISTERED
    terminal_states: [COMPLETED]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /design-wins/{id}/activate"
        actor: FieldEngineer
        preconditions:
          - "ReferenceDesign.status == PUBLISHED (ERR_REFERENCE_DESIGN_NOT_PUBLISHED)"
          - "Part.lifecycle_status in {ACTIVE, NRND} (ERR_PART_NOT_ORDERABLE)"
        side_effects:
          - "Part buffer forward-looking target now includes this win (calc_buffer_position forward variant)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (clock sweep: logical clock >= start_date + 4 years)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: pricing-schedule-publish-stale-part
    parent_entity: Part
    write_endpoint: "POST /pricing-schedules"
    occ_field: "expected_part_version"
    description: |
      Publishing a PricingSchedule against a Part whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just published a schedule for the same part
      (which legitimately supersedes the prior published schedule) and the
      current writer's view of the part is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: capacity-pool-invest-stale-version
    parent_entity: CapacityPool
    write_endpoint: "PATCH /capacity-pools/{id}"
    occ_field: "expected_capacity_pool_version"
    description: |
      Raising a CapacityPool's total_units with an expected version that does
      not match the pool's current version is rejected. This captures the case
      where another planner has just modified the same pool (a prior
      investment) and the current writer's view of installed capacity is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_unit_price_quote
    trigger: "POST /pricing/quote; also per order line at POST /orders/{id}/submit"
    algorithm: tiered_pricing
    formula: |
      schedule = the PricingSchedule of the part with status == PUBLISHED
      (at most one exists; creation of a new schedule supersedes the old).
      tier = the last element of schedule.tiers whose min_qty <= qty
      (boundary is inclusive: qty == min_qty qualifies for the tier).
      unit_price_cents = tier.unit_price_cents  (all-units pricing: the
      whole quantity is priced at the achieved tier rate, never marginal).
      The price is channel-invariant: the channel argument is validated but
      MUST NOT influence the result.
    input_set: "One part + integer quantity >= 1; schedule must be PUBLISHED and effective_from <= logical clock now"
    constants:
      FIRST_TIER_MIN_QTY: 1
    precision: "integer cents; no rounding"
    variants: []

  - name: calc_order_totals
    trigger: "POST /orders/{id}/submit"
    algorithm: aggregation
    formula: |
      Evaluation order is pinned (this ordering is part of the contract):
      1. per line: unit_price_cents = calc_unit_price_quote(part, quantity)
      2. per line: line_total_cents = round_half_up(unit_price_cents * quantity * (1 - customer.discount_pct), 0 decimals)
         -- NESTED ROUNDING RULE: discount is applied and rounded PER LINE,
         then rounded line totals are summed. Summing raw amounts and
         rounding once (10395 in the canonical fixture) is a DIFFERENT,
         non-conformant result.
      3. subtotal_cents = sum(line_total_cents)
      4. service_fee_cents = SMALL_ORDER_FEE_CENTS if (customer.tier == SMALL
         and order.channel == DIRECT_ONLINE and subtotal_cents < MIN_ORDER_SUBTOTAL_CENTS) else 0
      5. total_cents = subtotal_cents + service_fee_cents
    input_set: "All OrderLines of the order (created with the order); customer discount_pct, tier, channel"
    constants:
      SMALL_ORDER_FEE_CENTS: 500
      MIN_ORDER_SUBTOTAL_CENTS: 10000
    precision: "integer cents, round_half_up per line (step 2), then integer sums"
    variants: []

  - name: calc_buffer_position
    trigger: "GET /parts/{id}/inventory-position; recomputed internally after every mutation of on_hand_units, reserved_units, demand_rate_units_per_week, buffer_multiple, or a linked ACTIVE DesignWin's annual_volume_units"
    algorithm: forward_looking
    formula: |
      weekly_pipeline = sum over DesignWin where part_id == part.id
        AND status == ACTIVE of (annual_volume_units / 52) * DESIGN_WIN_PIPELINE_WEIGHT
      target_trailing_units = ceil(demand_rate_units_per_week * buffer_multiple * BUFFER_HORIZON_WEEKS)
      target_forward_units  = ceil((demand_rate_units_per_week + weekly_pipeline) * buffer_multiple * BUFFER_HORIZON_WEEKS)
      coverage_trailing = (on_hand_units - reserved_units) / target_trailing_units when target_trailing_units > 0 else +inf
      posture = NORMAL  when coverage_trailing >= WATCH_COVERAGE_THRESHOLD (1.0)
                WATCH   when SHORTAGE_COVERAGE_THRESHOLD (0.75) <= coverage_trailing < 1.0
                SHORTAGE when coverage_trailing < 0.75
      (posture thresholds are inclusive at their lower bound: exactly 0.75 is WATCH, exactly 1.0 is NORMAL;
      when target_trailing_units == 0 posture is NORMAL)
    input_set: "Part fields + ACTIVE DesignWins of the part (REGISTERED and COMPLETED wins are excluded from the forward variant)"
    constants:
      BUFFER_HORIZON_WEEKS: 26
      DESIGN_WIN_PIPELINE_WEIGHT: 0.5
      WATCH_COVERAGE_THRESHOLD: 1.0
      SHORTAGE_COVERAGE_THRESHOLD: 0.75
    precision: "targets integer units (ceil); coverage 4 decimal places round_half_up"
    variants:
      - name: trailing
        when: "Official posture driver and default reporting variant"
        difference: "Uses only planner-maintained demand_rate_units_per_week; ignores the design-win pipeline"
      - name: forward_looking
        when: "Exposed alongside as target_forward_units in inventory-position"
        difference: "Adds the weighted ACTIVE design-win pipeline; for identical Part fields the two targets differ whenever the part has at least one ACTIVE design win (1560 vs 3510 in the canonical fixture)"

  - name: calc_priority_score
    trigger: "AllocationRun creation (per eligible order line)"
    algorithm: weighted_scoring
    formula: |
      score = TIER_WEIGHT[order.customer.tier]
            + DESIGN_WIN_PRIORITY_BONUS if the customer has a DesignWin with
              part_id == line.part_id AND status == ACTIVE AND at_risk == false
            + 0 otherwise
      TIER_WEIGHT = {STRATEGIC: 100, KEY: 70, STANDARD: 40, SMALL: 10}
    input_set: "The order's customer tier; the customer's design wins on the line's part"
    constants:
      TIER_WEIGHT_STRATEGIC: 100
      TIER_WEIGHT_KEY: 70
      TIER_WEIGHT_STANDARD: 40
      TIER_WEIGHT_SMALL: 10
      DESIGN_WIN_PRIORITY_BONUS: 25
    precision: "integer"
    variants: []

  - name: calc_allocation_awards
    trigger: "AllocationRun creation (awards computed and frozen); publish applies them"
    algorithm: waterfall_allocation
    formula: |
      eligible lines = OrderLine whose SalesOrder.status == BACKORDERED
        and with remaining = quantity - awarded_units > 0 (any part posture;
        SHORTAGE parts are the ones where competition actually binds).
      per part with at least one eligible line (parts processed in part_number ASC order):
        available = part.on_hand_units - part.reserved_units (computed once per part at run creation)
        sort the part's eligible lines by: priority_score DESC (calc_priority_score),
          then SalesOrder.created_at ASC, then OrderLine.created_at ASC.
          Lines of the same order (identical created_at at both levels) are
          processed in their position in the POST /orders lines array.
          Test fixtures that exercise the created_at tie-break MUST separate
          order creation instants via the logical clock (the clock is fixed
          unless advanced, so same-instant orders otherwise tie on purpose).
        for each line in that order (rank = 1-based position):
          award = min(remaining, available)
          available -= award
          append award entry {order_line_id, awarded_units: award, priority_score, rank}
          (a line that arrives when available == 0 still gets an entry with awarded_units == 0)
    input_set: "All OrderLines with SalesOrder.status == BACKORDERED and remaining = quantity - awarded_units > 0"
    constants: {}
    precision: "integer units"
    variants: []

  - name: calc_credit_exposure
    trigger: "Recomputed after any transition that creates, submits, ships, cancels an order or creates/cancels a LifetimeBuy; checked inside POST /orders/{id}/submit and POST /lifetime-buys"
    algorithm: aggregation
    formula: |
      customer.open_exposure_cents =
        sum of total_cents over SalesOrder where customer_id == customer.id
          AND status in {ALLOCATED, BACKORDERED}
        + sum of ltb_value_cents over LifetimeBuy where customer_id == customer.id
          AND status == APPROVED
      Credit gate: the new order's total_cents (resp. the new lifetime buy's
      ltb_value_cents) is admissible iff open_exposure_cents + new_value <= credit_limit_cents.
      Boundary is inclusive: equality passes.
    input_set: "Customer's non-terminal orders and approved lifetime buys"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: calc_ltb_unit_price
    trigger: "POST /lifetime-buys"
    algorithm: chronological
    formula: |
      candidates = all PricingSchedules of the part with effective_from <= eol_notice.notice_date
      selected = the candidate with the latest effective_from;
        tie-break (equal effective_from): the one with the earliest created_at.
      unit_price_cents = the tier price from selected.tiers for the LTB quantity
        (same all-units tier rule as calc_unit_price_quote, inclusive min_qty).
      The selected schedule may be SUPERSEDED today — historical price lock is intentional.
      If candidates is empty: ERR_NO_PUBLISHED_PRICING.
    input_set: "Part's pricing schedules (any status), the EolNotice.notice_date, the requested quantity"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: calc_revenue_tail
    trigger: "DesignWin creation, activation, clock sweep, and any read of the DesignWin"
    algorithm: decay_function
    formula: |
      years_elapsed = number of complete 12-month anniversaries of start_date
        <= logical clock now (0 while now < start_date + 12 months).
      year_value[i] (i = 1..3) = round_half_up(expected_lifetime_revenue_cents * profile[i], 0)
      year_value[4] = expected_lifetime_revenue_cents - (year_value[1]+year_value[2]+year_value[3])
      recognized = sum of year_value[1..min(years_elapsed, 4)]
      RAMPED variant profile = [0.20, 0.40, 0.25, 0.15]  -> recognized_ramped_cents
      FLAT variant profile   = [0.25, 0.25, 0.25, 0.25]  -> recognized_flat_cents
      canonical recognized_revenue_cents = recognized_ramped_cents when
        part.automotive_grade == true else recognized_flat_cents
    input_set: "The DesignWin's expected_lifetime_revenue_cents, start_date; the linked part's automotive_grade; logical clock"
    constants:
      TAIL_YEARS: 4
      RAMP_PROFILE: [0.20, 0.40, 0.25, 0.15]
      FLAT_PROFILE: [0.25, 0.25, 0.25, 0.25]
    precision: "integer cents, round_half_up per year, final year absorbs remainder"
    variants:
      - name: ramped
        when: "Canonical for automotive_grade parts"
        difference: "Back-loads recognition (20% in year 1); at exactly 1 year elapsed recognizes 200000 of 1000000 in the canonical fixture"
      - name: flat
        when: "Canonical for non-automotive parts"
        difference: "Straight-line 25% per year; at exactly 1 year elapsed recognizes 250000 of 1000000 — a 50000-cent divergence from ramped on identical inputs"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# Lower priority number wins when several checks fail. Within one priority row,
# its listed checks evaluate in the order written in the check text.
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted on the endpoint; for entity-backed Customer role, X-User-ID must equal the Customer id owning the target resource (order.customer_id / lifetime_buy.customer_id / customer record itself)", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path and body referenced resources exist, validated left-to-right (part, customer, order, order line, pool, run, notice, lifetime buy, qualification, reference design, design win)", error_id: ERR_PART_NOT_FOUND, http_status: 404, applies_to: "all (entity-specific 404 id per resource: ERR_PART_NOT_FOUND / ERR_CUSTOMER_NOT_FOUND / ERR_ORDER_NOT_FOUND / ERR_ORDER_LINE_NOT_FOUND / ERR_CAPACITY_POOL_NOT_FOUND / ERR_ALLOCATION_RUN_NOT_FOUND / ERR_EOL_NOTICE_NOT_FOUND / ERR_LIFETIME_BUY_NOT_FOUND / ERR_SITE_QUALIFICATION_NOT_FOUND / ERR_REFERENCE_DESIGN_NOT_FOUND / ERR_DESIGN_WIN_NOT_FOUND)" }
  - { priority: 4, category: existence, check: "Request body schema: required fields present, unknown fields rejected (including client-supplied computed/system fields such as on_hand_units), types valid, enum members valid, quantity/total_units >= 1, tiers array well-formed (ascending min_qty, first min_qty == 1), unique part_number (ERR_DUPLICATE_PART_NUMBER 409)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST/PATCH endpoints" }
  - { priority: 5, category: state, check: "Target resource state machine permits the transition (order submit/cancel/ship from state, publish run from DRAFT, rescind notice from ANNOUNCED, qualification transition legality, design-win activate from REGISTERED, reference-design publish from DRAFT, lifetime-buy cancel from APPROVED)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: business_safety, check: "Automotive compliance: POST /parts/{id}/receipts for a part with automotive_grade == true requires a CapacityPool whose qualified_for_automotive == true (i.e. a QUALIFIED AUTOMOTIVE SiteQualification for that site_name)", error_id: ERR_SITE_NOT_QUALIFIED, http_status: 422, applies_to: ["POST /parts/{id}/receipts"] }
  - { priority: 7, category: business_constraint, check: "Structural conflicts: capacity-pool half-open period overlap for same site_name+process_technology (adjacency allowed: existing.period_end == new.period_start is NOT a conflict); second ANNOUNCED EolNotice whose closed window [notice_date, last_ship_date] intersects an existing ANNOUNCED notice's closed window for the same part; QUALIFIED/SUSPENDED duplicate for same site_name+segment (ERR_QUALIFICATION_OVERLAP)", error_id: ERR_POOL_PERIOD_OVERLAP, http_status: 409, applies_to: ["POST /capacity-pools", "POST /parts/{id}/eol-notices", "POST /site-qualifications/{id}/transition"] }
  - { priority: 8, category: business_temporal, check: "Clock-window checks: EOL window shape (last_order_date >= notice_date + 180d, last_ship_date >= last_order_date + 90d -> ERR_EOL_WINDOW_INVALID); LTB or submit while now > last_order_date for EOL_ANNOUNCED part (ERR_LAST_ORDER_DATE_PASSED); receipt against pool whose status != OPEN (ERR_POOL_NOT_OPEN)", error_id: ERR_EOL_WINDOW_INVALID, http_status: 422, applies_to: ["POST /parts/{id}/eol-notices", "POST /lifetime-buys", "POST /orders/{id}/submit", "POST /parts/{id}/receipts"] }
  - { priority: 9, category: business_referential, check: "Referenced-object usability: order line part lifecycle in {ACTIVE, NRND, EOL_ANNOUNCED} (ERR_PART_NOT_ORDERABLE); a PUBLISHED pricing schedule exists for each line part (ERR_NO_PUBLISHED_PRICING); design-win's reference design PUBLISHED (ERR_REFERENCE_DESIGN_NOT_PUBLISHED); LTB's notice status == ANNOUNCED (ERR_EOL_NOTICE_NOT_ACTIVE) and notice.part_id == ltb.part_id (ERR_NOTICE_PART_MISMATCH); publish reference design requires featured part in {ACTIVE, NRND}", error_id: ERR_PART_NOT_ORDERABLE, http_status: 422, applies_to: ["POST /orders/{id}/submit", "POST /lifetime-buys", "POST /design-wins/{id}/activate", "POST /reference-designs/{id}/publish"] }
  - { priority: 10, category: business_fiscal, check: "Quantity/fiscal floors: LTB quantity >= part.demand_rate_units_per_week * 52 (ERR_LTB_QUANTITY_BELOW_MIN); LTB reservation available: on_hand_units - reserved_units >= quantity (ERR_INSUFFICIENT_INVENTORY); receipt units <= pool.total_units - pool.allocated_units (ERR_POOL_CAPACITY_EXCEEDED); credit gate per calc_credit_exposure (ERR_CREDIT_LIMIT_EXCEEDED)", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /lifetime-buys", "POST /parts/{id}/receipts", "POST /orders/{id}/submit"] }


# =============================================================================
# 1.5 API Endpoint Table (39 endpoints)
# =============================================================================
endpoints:
  # --- Parts & inventory ---
  - method: POST
    path: "/parts"
    description: "Register a catalog part"
    roles: [SupplyPlanner]
    code: 201
    input: [part_number, description, package_family, process_technology, "automotive_grade?", "demand_rate_units_per_week?", "buffer_multiple?"]
    output: Part
    side_effects: ["lifecycle_status = ACTIVE, on_hand_units = 0, reserved_units = 0, posture computed"]
  - method: GET
    path: "/parts/{id}"
    description: "Fetch one part"
    roles: [PlatformAdmin, SupplyPlanner, ChannelManager, FieldEngineer, QualityEngineer, Customer]
    code: 200
    input: []
    output: Part
    side_effects: []
  - method: PATCH
    path: "/parts/{id}"
    description: "Update planner fields (demand_rate_units_per_week, buffer_multiple) or toggle lifecycle ACTIVE <-> NRND"
    roles: [SupplyPlanner]
    code: 200
    input: ["demand_rate_units_per_week?", "buffer_multiple?", "lifecycle_status?"]
    output: Part
    side_effects: ["recomputes posture; lifecycle_status only accepts ACTIVE (from NRND) or NRND (from ACTIVE); increments Part.version by 1"]
  - method: GET
    path: "/parts/{id}/inventory-position"
    description: "Computed read: on_hand_units, reserved_units, available_units, target_trailing_units, target_forward_units, coverage_trailing, posture"
    roles: [PlatformAdmin, SupplyPlanner, ChannelManager]
    code: 200
    input: []
    output: "{ part_id: string, on_hand_units: integer, reserved_units: integer, available_units: integer, target_trailing_units: integer, target_forward_units: integer, coverage_trailing: number, posture: string }"
    side_effects: []
  - method: GET
    path: "/parts/{id}/pricing-schedules"
    description: "List pricing schedules of a part (status? filter), newest effective_from first"
    roles: [PlatformAdmin, SupplyPlanner, ChannelManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PricingSchedule[]"
    side_effects: []
  - method: GET
    path: "/parts/{id}/eol-notices"
    description: "List EOL notices of a part (status? filter)"
    roles: [PlatformAdmin, SupplyPlanner, ChannelManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "EolNotice[]"
    side_effects: []
  - method: POST
    path: "/parts/{id}/receipts"
    description: "Record a production receipt: adds finished units to the part and consumes capacity-pool units"
    roles: [SupplyPlanner]
    code: 201
    input: [capacity_pool_id, units]
    output: Part
    side_effects:
      - "Part.on_hand_units += units; CapacityPool.allocated_units += units; Part.posture recomputed"
      - "Validations: pool exists and status == OPEN (ERR_POOL_NOT_OPEN); units <= pool.total_units - pool.allocated_units (ERR_POOL_CAPACITY_EXCEEDED); automotive_grade part requires pool.qualified_for_automotive (ERR_SITE_NOT_QUALIFIED)"

  # --- Customers ---
  - method: POST
    path: "/customers"
    description: "Register a direct customer"
    roles: [ChannelManager]
    code: 201
    input: [name, tier, channel, credit_limit_cents, "discount_pct?"]
    output: Customer
    side_effects: ["open_exposure_cents = 0, at_risk_design_win_count = 0"]
  - method: GET
    path: "/customers/{id}"
    description: "Fetch one customer (Customer role may only fetch itself)"
    roles: [PlatformAdmin, ChannelManager, SupplyPlanner, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: PATCH
    path: "/customers/{id}"
    description: "Change tier / channel / credit_limit_cents / discount_pct"
    roles: [ChannelManager]
    code: 200
    input: ["tier?", "channel?", "credit_limit_cents?", "discount_pct?"]
    output: Customer
    side_effects: ["increments Customer.version by 1 (future allocation runs score with the new tier)"]

  # --- Published pricing ---
  - method: POST
    path: "/pricing-schedules"
    description: "Publish a volume-tier pricing schedule for a part; supersedes the part's prior PUBLISHED schedule. OCC-guarded on Part.version."
    roles: [ChannelManager]
    code: 201
    input: [part_id, effective_from, tiers, expected_part_version]
    output: PricingSchedule
    side_effects:
      - "Prior PUBLISHED schedule of the same part -> SUPERSEDED"
      - "increments Part.version by 1; status = PUBLISHED; published_at = logical clock"
  - method: POST
    path: "/pricing/quote"
    description: "Quote the published unit price for part + quantity + channel (channel is validated but never changes the price)"
    roles: [PlatformAdmin, SupplyPlanner, ChannelManager, FieldEngineer, Customer]
    code: 200
    input: [part_id, quantity, channel]
    output: "{ part_id: string, quantity: integer, channel: string, tier_min_qty: integer, unit_price_cents: integer }"
    side_effects: []

  # --- Orders ---
  - method: POST
    path: "/orders"
    description: "Create a DRAFT order with its lines (nested creation)"
    roles: [Customer]
    code: 201
    input: [customer_id, lines]
    output: SalesOrder
    side_effects: ["status = DRAFT; channel snapshotted from customer; lines created with awarded_units = 0; customer_id must equal X-User-ID"]
  - method: GET
    path: "/orders/{id}"
    description: "Fetch one order (Customer role may only fetch its own orders)"
    roles: [PlatformAdmin, ChannelManager, SupplyPlanner, Customer]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders with filters (customer_id?, status?); Customer role sees only its own"
    roles: [PlatformAdmin, ChannelManager, SupplyPlanner, Customer]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: "SalesOrder[]"
    side_effects: []
  - method: POST
    path: "/orders/{id}/submit"
    description: "Submit a DRAFT order: locks published prices, computes totals, auto-awards non-SHORTAGE lines, forks to ALLOCATED or BACKORDERED"
    roles: [Customer]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["price lock + calc_order_totals; per-line auto-award; Part.reserved_units += awarded; Customer.open_exposure_cents += total_cents; posture recompute; increments SalesOrder.version by 1"]
  - method: POST
    path: "/orders/{id}/ship"
    description: "Ship an ALLOCATED order: decrements on-hand and releases reservations"
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["Part.on_hand_units -= awarded_units; Part.reserved_units -= awarded_units; Customer.open_exposure_cents -= total_cents; posture recompute; increments SalesOrder.version by 1"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel a DRAFT / ALLOCATED / BACKORDERED order, releasing reservations and exposure"
    roles: [Customer, ChannelManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["Part.reserved_units -= awarded_units; awarded_units reset to 0; Customer.open_exposure_cents -= total_cents when status was ALLOCATED or BACKORDERED; posture recompute; increments SalesOrder.version by 1"]
  - method: GET
    path: "/order-lines"
    description: "List order lines with filters (order_id?, part_id?)"
    roles: [PlatformAdmin, ChannelManager, SupplyPlanner]
    code: 200
    input: ["order_id?", "part_id?", "limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []
  - method: GET
    path: "/order-lines/{id}"
    description: "Fetch one order line"
    roles: [PlatformAdmin, ChannelManager, SupplyPlanner]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  # --- Capacity ---
  - method: POST
    path: "/capacity-pools"
    description: "Create a capacity pool for a site + technology + half-open period"
    roles: [SupplyPlanner]
    code: 201
    input: [site_name, process_technology, period_start, period_end, total_units]
    output: CapacityPool
    side_effects: ["status derived from logical clock; qualified_for_automotive computed from site qualifications"]
  - method: PATCH
    path: "/capacity-pools/{id}"
    description: "Capacity investment: raise total_units (never below allocated_units). OCC-guarded on CapacityPool.version."
    roles: [SupplyPlanner]
    code: 200
    input: [total_units, expected_capacity_pool_version]
    output: CapacityPool
    side_effects: ["increments CapacityPool.version by 1"]
  - method: GET
    path: "/capacity-pools/{id}"
    description: "Fetch one capacity pool"
    roles: [PlatformAdmin, SupplyPlanner, ChannelManager]
    code: 200
    input: []
    output: CapacityPool
    side_effects: []

  # --- Shortage allocation ---
  - method: POST
    path: "/allocation-runs"
    description: "Create an allocation run over SHORTAGE parts: awards computed and frozen in DRAFT"
    roles: [SupplyPlanner]
    code: 201
    input: [period_label]
    output: AllocationRun
    side_effects: ["shortage_part_ids and awards computed via calc_allocation_awards (frozen until publish)"]
  - method: POST
    path: "/allocation-runs/{id}/publish"
    description: "Publish a DRAFT run: applies awards to order lines, flips fully-covered orders to ALLOCATED"
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: AllocationRun
    side_effects: ["awards applied (OrderLine.awarded_units cumulative); Part.reserved_units += awarded; BACKORDERED -> ALLOCATED when fully covered; posture recompute; increments AllocationRun.version by 1"]

  # --- End-of-life program ---
  - method: POST
    path: "/parts/{id}/eol-notices"
    description: "Issue an end-of-life notification for a part (drives Part -> EOL_ANNOUNCED and the design-win risk cascade)"
    roles: [SupplyPlanner]
    code: 201
    input: [notice_date, last_order_date, last_ship_date, "reason?"]
    output: EolNotice
    side_effects: ["Part.lifecycle_status -> EOL_ANNOUNCED; ACTIVE DesignWins on the part -> at_risk = true; affected customers' at_risk_design_win_count recomputed"]
  - method: POST
    path: "/eol-notices/{id}/rescind"
    description: "Rescind an ANNOUNCED notice (Part returns EOL_ANNOUNCED -> ACTIVE)"
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: EolNotice
    side_effects: ["Part.lifecycle_status -> ACTIVE; ACTIVE DesignWins on the part -> at_risk = false; affected customers' at_risk_design_win_count recomputed"]

  # --- Lifetime buy program ---
  - method: POST
    path: "/lifetime-buys"
    description: "Place a lifetime buy against an ANNOUNCED EOL notice; locks historical pricing and reserves inventory"
    roles: [Customer]
    code: 201
    input: [eol_notice_id, part_id, customer_id, quantity]
    output: LifetimeBuy
    side_effects: ["unit_price_cents locked via calc_ltb_unit_price; status = APPROVED; Part.reserved_units += quantity; Customer.open_exposure_cents += ltb_value_cents; Part.posture recomputed; customer_id must equal X-User-ID"]
  - method: GET
    path: "/lifetime-buys/{id}"
    description: "Fetch one lifetime buy (Customer role may only fetch its own)"
    roles: [PlatformAdmin, SupplyPlanner, ChannelManager, Customer]
    code: 200
    input: []
    output: LifetimeBuy
    side_effects: []
  - method: GET
    path: "/lifetime-buys"
    description: "List lifetime buys with filters (part_id?, customer_id?, eol_notice_id?, status?)"
    roles: [PlatformAdmin, SupplyPlanner, ChannelManager, Customer]
    code: 200
    input: ["part_id?", "customer_id?", "eol_notice_id?", "status?", "limit?", "offset?"]
    output: "LifetimeBuy[]"
    side_effects: []
  - method: POST
    path: "/lifetime-buys/{id}/cancel"
    description: "Cancel an APPROVED lifetime buy, releasing its reservation and exposure"
    roles: [Customer, ChannelManager]
    code: 200
    input: []
    output: LifetimeBuy
    side_effects: ["Part.reserved_units -= quantity; Customer.open_exposure_cents -= ltb_value_cents; Part.posture recomputed"]

  # --- Site qualification ---
  - method: POST
    path: "/site-qualifications"
    description: "Open a packaging/test/assembly site qualification for a market segment"
    roles: [QualityEngineer]
    code: 201
    input: [site_name, segment, "validity_months?"]
    output: SiteQualification
    side_effects: ["status = REQUESTED"]
  - method: POST
    path: "/site-qualifications/{id}/transition"
    description: "Drive the qualification workflow: REQUESTED -> IN_REVIEW -> QUALIFIED | REJECTED; QUALIFIED <-> SUSPENDED"
    roles: [QualityEngineer]
    code: 200
    input: [to_state]
    output: SiteQualification
    side_effects: ["on QUALIFIED/SUSPENDED with segment AUTOMOTIVE: matching CapacityPool.qualified_for_automotive recomputed"]

  # --- Reference designs & design wins ---
  - method: POST
    path: "/reference-designs"
    description: "Author a technical reference design featuring a catalog part"
    roles: [FieldEngineer]
    code: 201
    input: [title, featured_part_number]
    output: ReferenceDesign
    side_effects: ["status = DRAFT"]
  - method: POST
    path: "/reference-designs/{id}/publish"
    description: "Publish a reference design (featured part must be in ACTIVE or NRND lifecycle)"
    roles: [FieldEngineer]
    code: 200
    input: []
    output: ReferenceDesign
    side_effects: ["status = PUBLISHED; published_at stamped"]
  - method: POST
    path: "/design-wins"
    description: "Register a design win driven by a published reference design"
    roles: [FieldEngineer]
    code: 201
    input: [reference_design_id, customer_id, part_id, expected_lifetime_revenue_cents, annual_volume_units, start_date]
    output: DesignWin
    side_effects: ["status = REGISTERED; recognized_*_cents computed (0 before first anniversary)"]
  - method: GET
    path: "/design-wins/{id}"
    description: "Fetch one design win"
    roles: [PlatformAdmin, FieldEngineer, ChannelManager, SupplyPlanner]
    code: 200
    input: []
    output: DesignWin
    side_effects: []
  - method: GET
    path: "/design-wins"
    description: "List design wins with filters (reference_design_id?, customer_id?, part_id?, status?)"
    roles: [PlatformAdmin, FieldEngineer, ChannelManager, SupplyPlanner]
    code: 200
    input: ["reference_design_id?", "customer_id?", "part_id?", "status?", "limit?", "offset?"]
    output: "DesignWin[]"
    side_effects: []
  - method: POST
    path: "/design-wins/{id}/activate"
    description: "Activate a REGISTERED design win (requires PUBLISHED reference design and orderable part)"
    roles: [FieldEngineer]
    code: 200
    input: []
    output: DesignWin
    side_effects: ["status = ACTIVE; forward-looking buffer target of the part now includes this win"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601). Startup default before any call is exactly 2026-09-01T00:00:00Z; the server MUST NOT fall back to wall-clock time. Setting the clock triggers the sweep: Part EOL_ANNOUNCED -> LAST_TIME_BUY -> DISCONTINUED transitions at notice dates, EolNotice COMPLETED, CapacityPool PLANNED -> OPEN -> CLOSED, DesignWin ACTIVE -> COMPLETED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["runs the time sweep: all clock-gated transitions whose threshold instant <= to_iso8601 fire in dependency order"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not recognized" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on this endpoint, or Customer role acting on a resource owned by a different customer id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, type mismatch, invalid enum member, quantity/units < 1, or malformed tiers array (not ascending min_qty, or first min_qty != 1)" }
  - { id: ERR_PART_NOT_FOUND, http: 404, condition: "No Part with the given id" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "No Customer with the given id" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "No SalesOrder with the given id" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "No OrderLine with the given id" }
  - { id: ERR_CAPACITY_POOL_NOT_FOUND, http: 404, condition: "No CapacityPool with the given id" }
  - { id: ERR_ALLOCATION_RUN_NOT_FOUND, http: 404, condition: "No AllocationRun with the given id" }
  - { id: ERR_EOL_NOTICE_NOT_FOUND, http: 404, condition: "No EolNotice with the given id" }
  - { id: ERR_LIFETIME_BUY_NOT_FOUND, http: 404, condition: "No LifetimeBuy with the given id" }
  - { id: ERR_SITE_QUALIFICATION_NOT_FOUND, http: 404, condition: "No SiteQualification with the given id" }
  - { id: ERR_REFERENCE_DESIGN_NOT_FOUND, http: 404, condition: "No ReferenceDesign with the given id" }
  - { id: ERR_DESIGN_WIN_NOT_FOUND, http: 404, condition: "No DesignWin with the given id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's state machine does not permit the requested transition (includes second submit, ship of non-ALLOCATED, cancel of terminal order, publish of non-DRAFT run, rescind of non-ANNOUNCED notice, illegal qualification transition, cancel of non-APPROVED lifetime buy)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version OCC field does not match the parent entity's current version (see concurrency_rules)" }
  - { id: ERR_DUPLICATE_PART_NUMBER, http: 409, condition: "part_number already registered" }
  - { id: ERR_POOL_PERIOD_OVERLAP, http: 409, condition: "New half-open [period_start, period_end) intersects an existing pool's window with the same site_name and process_technology; touching endpoints (end == start) is allowed" }
  - { id: ERR_EOL_NOTICE_ACTIVE_EXISTS, http: 409, condition: "Part already has an ANNOUNCED EolNotice whose closed window [notice_date, last_ship_date] intersects the new notice's closed window (touching endpoints counts as overlap)" }
  - { id: ERR_QUALIFICATION_OVERLAP, http: 409, condition: "Another SiteQualification with the same site_name and segment is already in status QUALIFIED or SUSPENDED" }
  - { id: ERR_EOL_WINDOW_INVALID, http: 422, condition: "last_order_date < notice_date + 180 days, or last_ship_date < last_order_date + 90 days" }
  - { id: ERR_LAST_ORDER_DATE_PASSED, http: 422, condition: "Logical clock is past the part's ANNOUNCED notice last_order_date (order submit for an EOL_ANNOUNCED part, or lifetime-buy creation)" }
  - { id: ERR_POOL_NOT_OPEN, http: 422, condition: "Production receipt targets a CapacityPool whose clock-derived status is PLANNED or CLOSED" }
  - { id: ERR_SITE_NOT_QUALIFIED, http: 422, condition: "Receipt of an automotive_grade part into a pool whose site lacks a QUALIFIED AUTOMOTIVE SiteQualification" }
  - { id: ERR_PART_NOT_ORDERABLE, http: 422, condition: "Part lifecycle_status is LAST_TIME_BUY or DISCONTINUED where the operation requires ACTIVE / NRND / (EOL_ANNOUNCED before last_order_date); also fired when a reference design's featured part is outside {ACTIVE, NRND}" }
  - { id: ERR_NO_PUBLISHED_PRICING, http: 422, condition: "No PricingSchedule satisfies the price lookup (submit/quote: no PUBLISHED schedule with effective_from <= now; lifetime buy: no schedule with effective_from <= notice_date)" }
  - { id: ERR_EOL_NOTICE_NOT_ACTIVE, http: 422, condition: "Lifetime buy references an EolNotice whose status is not ANNOUNCED" }
  - { id: ERR_NOTICE_PART_MISMATCH, http: 422, condition: "Lifetime buy part_id differs from the referenced EolNotice's part_id" }
  - { id: ERR_REFERENCE_DESIGN_NOT_PUBLISHED, http: 422, condition: "DesignWin activation references a ReferenceDesign not in status PUBLISHED" }
  - { id: ERR_LTB_QUANTITY_BELOW_MIN, http: 422, condition: "Lifetime buy quantity < part.demand_rate_units_per_week * 52 (LTB_MIN_COVERAGE_WEEKS)" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 422, condition: "Lifetime buy quantity exceeds part.on_hand_units - part.reserved_units" }
  - { id: ERR_POOL_CAPACITY_EXCEEDED, http: 422, condition: "Receipt units exceed pool.total_units - pool.allocated_units, or PATCH would set total_units below allocated_units" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "open_exposure_cents + new value would exceed customer.credit_limit_cents (strictly greater fails; equality passes)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator of the benchmark harness; drives the logical clock and reads everything"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: SupplyPlanner
    description: "Internal supply-chain planner: parts, capacity pools, production receipts, allocation runs, EOL notices"
    identity: opaque
    exclusive_operations: ["POST /parts", "PATCH /parts/{id}", "POST /parts/{id}/receipts", "POST /capacity-pools", "PATCH /capacity-pools/{id}", "POST /allocation-runs", "POST /allocation-runs/{id}/publish", "POST /parts/{id}/eol-notices", "POST /eol-notices/{id}/rescind", "POST /orders/{id}/ship"]
    shared_operations: ["GET endpoints"]
  - name: ChannelManager
    description: "Direct-sales channel owner: customer registration/tiering and published pricing"
    identity: opaque
    exclusive_operations: ["POST /customers", "PATCH /customers/{id}", "POST /pricing-schedules"]
    shared_operations: ["GET endpoints", "POST /pricing/quote", "POST /orders/{id}/cancel", "POST /lifetime-buys/{id}/cancel"]
  - name: QualityEngineer
    description: "Site qualification owner for packaging/test/assembly sites"
    identity: opaque
    exclusive_operations: ["POST /site-qualifications", "POST /site-qualifications/{id}/transition"]
    shared_operations: ["GET /parts/{id}"]
  - name: FieldEngineer
    description: "Field applications engineer: reference designs and design-win registration"
    identity: opaque
    exclusive_operations: ["POST /reference-designs", "POST /reference-designs/{id}/publish", "POST /design-wins", "POST /design-wins/{id}/activate"]
    shared_operations: ["GET endpoints", "POST /pricing/quote"]
  - name: Customer
    description: "Direct customer account; X-User-ID equals the Customer entity id"
    identity: "entity_backed:Customer"
    exclusive_operations: ["POST /orders", "POST /orders/{id}/submit", "POST /lifetime-buys"]
    shared_operations: ["GET endpoints (own resources only)", "POST /pricing/quote", "POST /orders/{id}/cancel", "POST /lifetime-buys/{id}/cancel"]

# =============================================================================
# Pinned domain constants (single source of truth for every named threshold)
# =============================================================================
domain_constants:
  DEFAULT_CLOCK_UTC: "2026-09-01T00:00:00Z"
  BUFFER_HORIZON_WEEKS: 26
  BUFFER_MULTIPLE_DEFAULT: 1.5
  DESIGN_WIN_PIPELINE_WEIGHT: 0.5
  WATCH_COVERAGE_THRESHOLD: 1.0
  SHORTAGE_COVERAGE_THRESHOLD: 0.75
  SMALL_ORDER_FEE_CENTS: 500
  MIN_ORDER_SUBTOTAL_CENTS: 10000
  EOL_NOTICE_MIN_DAYS: 180
  LAST_SHIP_MIN_DAYS_AFTER_ORDER: 90
  LTB_MIN_COVERAGE_WEEKS: 52
  TIER_WEIGHT_STRATEGIC: 100
  TIER_WEIGHT_KEY: 70
  TIER_WEIGHT_STANDARD: 40
  TIER_WEIGHT_SMALL: 10
  DESIGN_WIN_PRIORITY_BONUS: 25
  TAIL_YEARS: 4
  QUALIFICATION_VALIDITY_DEFAULT_MONTHS: 24
