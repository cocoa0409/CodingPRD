              payload: { injury_case_id: "${case_id}", insurance_policy_id: "${pol_id}", billed_amount_cents: 10000, line_items: [ { cpt_code: "A", charge_cents: 10000, service_date: "2026-08-02" } ] }
              as: BillingStaff
              captures: { claim1: $.data.id }
            - call: "POST /sports-med/claims"
              payload: { injury_case_id: "${case_id}", insurance_policy_id: "${pol_id}", billed_amount_cents: 20000, line_items: [ { cpt_code: "B", charge_cents: 20000, service_date: "2026-08-03" } ] }
              as: BillingStaff
              captures: { claim2: $.data.id }
            # submit claim1 with v0 -> bumps policy to v1
            - call: "POST /sports-med/claims/${claim1}/submit"
              payload: { expected_policy_version: "${pol_v0}" }
              as: BillingStaff
          trigger:
            # submit claim2 with the stale v0
            - call: "POST /sports-med/claims/${claim2}/submit"
              payload: { expected_policy_version: "${pol_v0}" }
              as: BillingStaff
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns error_id ERR_STALE_VERSION (412) — policy version advanced by claim1's submit"

      - name: confidentiality_strict_mode_downgrades_general_grant
        claim_type: conditional_feature_flags
        grounds: [calculations.confidentiality_redaction_filter, entities.Team.fields.hipaa_mode, entities.DisclosureGrant.fields.scope]
        distinguishing_aspect: "Under Team.hipaa_mode == STRICT, a GENERAL-scope ACTIVE grant is downgraded to TIER_ONLY: a COACHING report shows availability_tier but suppresses designation and body_region even with the grant."
        test_recipe:
          setup: ["Team hipaa_mode STRICT (default); athlete; OPEN case with a LIMITED entry today; ACTIVE GENERAL-scope COACHING grant covering today; clock 2026-08-03"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01", hipaa_mode: "STRICT" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "F", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S83.5", body_region: "KNEE", severity_class: "MINOR", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-02", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-03", designation: "LIMITED", symptom_free: true, functional_test_score: 65 }
              as: MedicalStaff
            - call: "POST /sports-med/disclosure-grants"
              payload: { athlete_id: "${a_id}", grantee_role: "COACHING", scope: "GENERAL", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: MedicalStaff
              captures: { grant_id: $.data.id }
          trigger:
            - call: "POST /sports-med/availability-reports"
              payload: { team_id: "${t_id}", audience: "COACHING" }
              as: CoachingStaff
              captures: { rows: $.data.rows }
          assert:
            - "row for ${a_id} exposes availability_tier but NOT designation and NOT body_region (STRICT downgraded GENERAL to TIER_ONLY)"
            - "no diagnosis_detail present for ${a_id}"

      - name: derived_field_reconciles_after_supersede
        claim_type: derived_field_reconciliation
        grounds: [calculations.availability_tier_derivation, entities.Athlete.fields.availability_tier]
        distinguishing_aspect: "availability_tier is recomputed on the superseding DailyStatusEntry: replacing today's OUT entry with a FULL entry (on a case past OPEN, in REHAB) flips the tier from OUT to FULL in the same request."
        test_recipe:
          setup: ["Team; athlete; case OPEN->REHAB; today's entry OUT (tier OUT); clock 2026-08-03"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "F", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S83.5", body_region: "KNEE", severity_class: "MINOR", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-02", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-03", designation: "OUT", symptom_free: false, functional_test_score: 40 }
              as: MedicalStaff
              captures: { e1: $.data.id }
            - call: "POST /sports-med/injury-cases/${case_id}/start-rehab"
              payload: {}
              as: MedicalStaff
            - call: "GET /sports-med/athletes/${a_id}"
              payload: {}
              as: MedicalStaff
              captures: { tier_before: $.data.availability_tier }
          trigger:
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-03", designation: "FULL", symptom_free: true, functional_test_score: 95, supersedes_entry_id: "${e1}" }
              as: MedicalStaff
            - call: "GET /sports-med/athletes/${a_id}"
              payload: {}
              as: MedicalStaff
              captures: { tier_after: $.data.availability_tier }
          assert:
            - "tier_before == OUT (REHAB case with OUT designation)"
            - "tier_after == FULL (REHAB case, today's is_current designation now FULL after supersede)"

  # =================================================================
  # Section: consistency model
  # =================================================================
  - section: consistency_model
    instances:
      - name: adjudication_immediately_visible_on_claim_and_policy
        claim_type: immediate_consistency
        grounds: [calculations.claim_adjudication, entities.InsurancePolicy.fields.oop_accrued_cents]
        distinguishing_aspect: "consistency_model immediate: the adjudicate response body and a subsequent GET on the policy both reflect the accumulator updates atomically (no lag)."
        test_recipe:
          setup: ["Team; athlete; OPEN case; policy ded 0 coins 80 oop 500000; claim billed 10000 submitted; clock 2026-08-01"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "F", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S83.511A", body_region: "KNEE", severity_class: "MODERATE", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-01", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/insurance-policies"
              payload: { athlete_id: "${a_id}", payer_name: "Payer", policy_number: "PN-1", deductible_cents: 0, coinsurance_pct: 80, oop_max_cents: 500000, policy_year_start: "2026-01-01", policy_year_end: "2026-12-31" }
              as: BillingStaff
              captures: { pol_id: $.data.id, pol_v0: $.data.version }
            - call: "POST /sports-med/claims"
              payload: { injury_case_id: "${case_id}", insurance_policy_id: "${pol_id}", billed_amount_cents: 10000, line_items: [ { cpt_code: "A", charge_cents: 10000, service_date: "2026-08-02" } ] }
              as: BillingStaff
              captures: { claim_id: $.data.id }
            - call: "POST /sports-med/claims/${claim_id}/submit"
              payload: { expected_policy_version: "${pol_v0}" }
              as: BillingStaff
          trigger:
            - call: "POST /sports-med/claims/${claim_id}/adjudicate"
              payload: {}
              as: BillingStaff
              captures: { payer: $.data.payer_paid_cents, patient: $.data.patient_resp_cents }
            - call: "GET /sports-med/insurance-policies/${pol_id}"
              payload: {}
              as: BillingStaff
              captures: { pol_oop: $.data.oop_accrued_cents }
          assert:
            - "adjudicate response shows payer_paid_cents == 8000 and patient_resp_cents == 2000 in the same response"
            - "immediate GET on policy shows oop_accrued_cents == 2000 (consistent, no eventual lag)"
