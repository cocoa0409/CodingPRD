          difficulty_instance: priority_pair_validation_conflict / relocation_create_state_beats_fiscal
          rationale: "The named §1.8 instance already violates the event-state rule and the unpaid-assignment rule in one relocation create and pins the state error as the winner."

      - name: pick_reports_the_temporal_window_before_the_seat_constraint
        claim_type: priority_ordering
        grounds:
          - validations[priority=14]
          - validations[priority=17]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / pick_temporal_beats_constraint
          rationale: "The named §1.8 instance already violates the slot-window rule and the seat-availability rule in one pick and pins ERR_OUTSIDE_SLOT_WINDOW as the winner."

      - name: publish_slots_requires_a_certified_recalculation
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=10]
          - errors[ERR_RECALCULATION_NOT_CERTIFIED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / publish_slots_blocked_when_recalculation_not_certified
          rationale: "The named §1.8 instance already asserts the publish-slots arm of priority 10 on a COMMUNICATED recalculation and the success path after certification."

      - name: pick_into_a_renovating_section_is_refused
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=11]
          - errors[ERR_SECTION_UNDER_RENOVATION]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pick_blocked_when_section_under_renovation
          rationale: "The named §1.8 instance already asserts the 409 on a pick into an UNDER_RENOVATION section and the success path once the renovation completes."

  # ---------------------------------------------------------------------------
  # Table 5 (Endpoints) — claim-extraction-guide.md §5.
  # 56 endpoints. Claims cover standard_crud (create/read/list; there is no PUT
  # or DELETE anywhere in §1.5, so mutation is action-only), action_endpoint,
  # cross_reference_link and computed_read. Every §1.5 side_effect list touched
  # here is asserted item by item, and every list claim pins the response
  # envelope keys total_count and has_more.
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: section_create_read_and_list_round_trip_through_the_standard_envelope
        claim_type: standard_crud
        grounds:
          - endpoints[POST /athletics/sections]
          - endpoints[GET /athletics/sections/{id}]
          - endpoints[GET /athletics/sections]
        distinguishing_aspect: |
          The create response, the single read and the list element must agree
          field for field, and the create's own side_effects must be visible in
          all three: requirement_history seeded with one entry keyed on the
          clock's UTC year, every inventory counter at 0 and pricing_posture
          NORMAL. The list must wrap results in { data, total_count, has_more }
          and honour the venue_code filter. There is no PUT or DELETE for Section
          anywhere in §1.5, so no update-by-replacement path may exist.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /athletics/sections"
              payload: { section_code: "SEC-RT", venue_code: "STADIUM-RT", seat_capacity: 4, per_seat_requirement_cents: 175000, required_points_per_seat: 12.50 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { rt_id: "$.data.id" }
            - call: "GET /athletics/sections/${rt_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/sections?venue_code=STADIUM-RT"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/sections?venue_code=STADIUM-OTHER"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "Create returns HTTP 201 with section_code == \"SEC-RT\", venue_code == \"STADIUM-RT\", seat_capacity == 4, per_seat_requirement_cents == 175000, required_points_per_seat == 12.50"
            - "Create response: status == \"OPEN\", renovation_status == \"NONE\", pricing_posture == \"NORMAL\", version == 1, created_at == updated_at == \"2026-04-01T00:00:00.000Z\""
            - "Create response counters all zero: seat_row_count == 0, seats_available == 0, seats_committed_count == 0, decommissioned_seat_count == 0, assigned_seat_count == 0, underwater_seat_count == 0, reseated_donor_count == 0, reseating_invoice_total_cents == 0"
            - "Create response: requirement_history == [{ cycle_year: 2026, per_seat_requirement_cents: 175000 }]"
            - "GET /athletics/sections/${rt_id} returns HTTP 200 and every field byte-identical to the create response, including version == 1"
            - "GET /athletics/sections?venue_code=STADIUM-RT returns HTTP 200 with total_count == 1, has_more == false and data[0].id == \"${rt_id}\""
            - "GET /athletics/sections?venue_code=STADIUM-OTHER returns HTTP 200 with total_count == 0, has_more == false and an empty data array (NOT 404)"

      - name: season_ticket_renewal_returns_the_updated_donor_with_a_200_not_a_new_resource
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /athletics/donors/{id}/season-ticket-renewals]
          - entities.Donor.fields.season_ticket_first_cycle_year
          - entities.Donor.fields.season_ticket_seasons_purchased
        distinguishing_aspect: |
          Despite the plural collection-shaped path, this is an action on the
          Donor: it must answer 200 with the Donor body (no renewal entity id,
          no 201) and it must set season_ticket_first_cycle_year on the FIRST
          recorded season only, so recording 2027 after 2026 leaves the first
          cycle at 2026 while seasons_purchased reaches 2. Recording an earlier
          year afterwards must still not rewrite the first cycle downwards,
          because the field is defined as the first RECORDED year rather than the
          minimum.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "One donor with no season-ticket history (season_ticket_seasons_purchased 0, season_ticket_first_cycle_year null)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Ten Ure", email: "ten.ure@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { tu_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/donors/${tu_id}/season-ticket-renewals"
              payload: { cycle_year: 2026 }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${tu_id}/season-ticket-renewals"
              payload: { cycle_year: 2027 }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${tu_id}/season-ticket-renewals"
              payload: { cycle_year: 2024 }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "Each call returns HTTP 200 (NOT 201) and the body is a Donor: it carries donor_status, certified_points and version, and no renewal-entity id field"
            - "After the 2026 call: season_ticket_seasons_purchased == 1, season_ticket_first_cycle_year == 2026, version == 2"
            - "After the 2027 call: season_ticket_seasons_purchased == 2, season_ticket_first_cycle_year is still 2026, version == 3"
            - "After the 2024 call: season_ticket_seasons_purchased == 3, season_ticket_first_cycle_year is still 2026 (first RECORDED, not minimum), version == 4"
            - "Donor.${tu_id}.certified_points is still 0.00 (tenure only scores through a recalculation run)"

      - name: household_link_is_discoverable_through_the_partner_filter_on_the_donor_list
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /athletics/donors]
          - endpoints[POST /athletics/donors/{id}/household-link]
          - validations[priority=7]
        distinguishing_aspect: |
          The self-referential household link has no sub-collection endpoint, so
          the ONLY reverse-reachability channel is the donor list's
          household_partner_donor_id filter — and because the link is written on
          both rows, filtering by either id must return the OTHER donor, never the
          donor itself. A body id that resolves to nothing must be reported by
          priority 7 as 404 ERR_REFERENCED_ENTITY_NOT_FOUND, distinct from the 409
          ERR_HOUSEHOLD_LINK_INVALID raised when the id resolves but the row is
          ineligible.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Donors J1 and J2, both entity_type JOINT_HOUSEHOLD and unlinked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Jo Pair", email: "jo.pair@example.com", alumni_status: "NON_ALUMNUS", entity_type: "JOINT_HOUSEHOLD" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { j1_id: "$.data.id", j1_v: "$.data.version" }
            - call: "POST /athletics/donors"
              payload: { full_name: "Jan Pair", email: "jan.pair@example.com", alumni_status: "NON_ALUMNUS", entity_type: "JOINT_HOUSEHOLD" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { j2_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/donors/${j1_id}/household-link"
              payload: { partner_donor_id: "00000000-0000-4000-8000-00000000d0a0", expected_donor_version: "${j1_v}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${j1_id}/household-link"
              payload: { partner_donor_id: "${j2_id}", expected_donor_version: "${j1_v}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/donors?household_partner_donor_id=${j1_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/donors?household_partner_donor_id=${j2_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "Link to the unresolvable partner id: HTTP 404 with error.code == \"ERR_REFERENCED_ENTITY_NOT_FOUND\" (NOT 409 ERR_HOUSEHOLD_LINK_INVALID and NOT ERR_DONOR_NOT_FOUND, whose arm covers path ids)"
            - "After that rejection Donor.${j1_id}.version is still ${j1_v}, so the same version succeeds on the real link"
            - "Valid link: HTTP 200 with household_partner_donor_id == \"${j2_id}\""
            - "GET /athletics/donors?household_partner_donor_id=${j1_id} returns total_count == 1 with data[0].id == \"${j2_id}\" (the partner, not the filter subject)"
            - "GET /athletics/donors?household_partner_donor_id=${j2_id} returns total_count == 1 with data[0].id == \"${j1_id}\""
            - "Both responses carry has_more == false"

      - name: gift_list_filters_compose_on_status_designation_and_derived_cycle_year
        claim_type: standard_crud
        grounds:
          - endpoints[GET /athletics/donors/{id}/gifts]
          - entities.Gift.fields.cycle_year
        distinguishing_aspect: |
          cycle_year is DERIVED from gift_date, never supplied, so filtering on it
          exercises the derivation as well as the filter. The three filters must
          AND together rather than replace one another: four gifts spanning two
          designations, two statuses and two cycle years reduce to exactly one row
          under the triple filter, and the sub-collection is the only reverse
          channel for Gift.donor_id.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "One donor holding four gifts: G1 ATHLETICS_ANNUAL RECEIVED 1000000 cents dated 2026-03-01; G2 CAPITAL PLEDGED 500000 cents dated 2026-05-01; G3 ENDOWMENT RECEIVED 700000 cents dated 2025-04-01; G4 ATHLETICS_ANNUAL PLEDGED 300000 cents dated 2026-06-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Gil Filter", email: "gil.filter@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { gf_id: "$.data.id" }
            - call: "POST /athletics/donors/${gf_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 1000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { g1_id: "$.data.id" }
            - call: "POST /athletics/donors/${gf_id}/gifts"
              payload: { gift_date: "2026-05-01T00:00:00.000Z", amount_cents: 500000, designation: "CAPITAL", gift_status: "PLEDGED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${gf_id}/gifts"
              payload: { gift_date: "2025-04-01T00:00:00.000Z", amount_cents: 700000, designation: "ENDOWMENT", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { g3_id: "$.data.id" }
            - call: "POST /athletics/donors/${gf_id}/gifts"
              payload: { gift_date: "2026-06-01T00:00:00.000Z", amount_cents: 300000, designation: "ATHLETICS_ANNUAL", gift_status: "PLEDGED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { g4_id: "$.data.id" }
          trigger:
            - call: "GET /athletics/donors/${gf_id}/gifts"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/donors/${gf_id}/gifts?gift_status=PLEDGED"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/donors/${gf_id}/gifts?designation=ATHLETICS_ANNUAL"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/donors/${gf_id}/gifts?cycle_year=2025"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/donors/${gf_id}/gifts?gift_status=PLEDGED&designation=ATHLETICS_ANNUAL&cycle_year=2026"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "Unfiltered: HTTP 200 with total_count == 4 and has_more == false"
            - "Gift.${g1_id}.cycle_year == 2026 and Gift.${g3_id}.cycle_year == 2025, both derived from gift_date rather than supplied"
            - "?gift_status=PLEDGED returns total_count == 2 (G2 and G4)"
            - "?designation=ATHLETICS_ANNUAL returns total_count == 2 (G1 and G4)"
            - "?cycle_year=2025 returns total_count == 1 with data[0].id == \"${g3_id}\""
            - "?gift_status=PLEDGED&designation=ATHLETICS_ANNUAL&cycle_year=2026 returns total_count == 1 with data[0].id == \"${g4_id}\" (the filters AND together)"
            - "Every returned Gift carries version == 1 and cycle_year, and none carries a donor-supplied cycle_year echo"

      - name: point_ledger_entry_list_filters_by_variant_and_component_across_two_generations
        claim_type: standard_crud
        grounds:
          - endpoints[GET /athletics/point-ledger-entries]
          - entities.PointLedgerEntry.fields.variant
          - state_machines.PointRecalculation.transitions.COMMUNICATED_to_COMPUTED
        distinguishing_aspect: |
          One run writes SIX components in TWO variants per donor — twelve rows —
          and a re-run APPENDS a second generation rather than replacing the
          first, so the unfiltered count doubles to 24 while
          ?variant=CERTIFIED&entry_type=ALUMNI_STATUS still isolates one row per
          generation. The 25.00 ALUMNI_STATUS row and the 0.00 NET_TRANSFER rows
          prove the components are itemised rather than collapsed into a total.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "One ALUMNUS INDIVIDUAL donor with a single RECEIVED ATHLETICS_ANNUAL gift of 1000000 cents dated 2026-03-01."
            - "One PointRecalculation for cycle 2026, run once and communicated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Lex Ledger", email: "lex.ledger@example.com", alumni_status: "ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { ll_id2: "$.data.id" }
            - call: "POST /athletics/donors/${ll_id2}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 1000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { llr_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${llr_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations/${llr_id}/send-communications"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "GET /athletics/point-ledger-entries?donor_id=${ll_id2}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/point-ledger-entries?donor_id=${ll_id2}&variant=CERTIFIED"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/point-ledger-entries?donor_id=${ll_id2}&variant=CERTIFIED&entry_type=ALUMNI_STATUS"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/point-ledger-entries?donor_id=${ll_id2}&entry_type=NET_TRANSFER"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations/${llr_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/point-ledger-entries?donor_id=${ll_id2}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/point-ledger-entries?recalculation_id=${llr_id}&variant=PROVISIONAL"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "First unfiltered read: HTTP 200 with total_count == 12 (six components x two variants for one donor)"
            - "?variant=CERTIFIED returns total_count == 6, with one row per entry_type in {CUMULATIVE_GIVING, CONSECUTIVE_YEARS, SEASON_TICKET_TENURE, ALUMNI_STATUS, NET_TRANSFER, DISPUTE_ADJUSTMENT}"
            - "?variant=CERTIFIED&entry_type=ALUMNI_STATUS returns total_count == 1 with data[0].points == 25.00 and data[0].computed_at == \"2026-04-01T00:00:00.000Z\""
            - "?entry_type=NET_TRANSFER returns total_count == 2 (one per variant) and both rows have points == 0.00"
            - "The CERTIFIED CUMULATIVE_GIVING row has points == 10.00 and the CERTIFIED CONSECUTIVE_YEARS row has points == 5.00, summing with the 25.00 alumni row to Donor.${ll_id2}.certified_points == 40.00"
            - "The second run returns HTTP 200; the unfiltered read then reports total_count == 24 (a fresh generation was APPENDED, nothing was overwritten)"
            - "?recalculation_id=${llr_id}&variant=PROVISIONAL returns total_count == 12 after the second run"
            - "PointRecalculation.${llr_id}.status == \"COMPUTED\" and communication_sent_count == 0 after the re-run"

      - name: selection_slot_list_defaults_to_slot_index_ascending_and_paginates_consistently
