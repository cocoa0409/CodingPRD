              payload: {}
              as: SponsorOperator
            - call: "POST /properties"
              payload: { property_legal_name: "P1", street_address: "1 P St", acquisition_price_cents: 100000000 }
              as: SponsorOperator
              captures: { prop1_id: $.data.id }
            - call: "POST /properties"
              payload: { property_legal_name: "P2", street_address: "2 P St", acquisition_price_cents: 100000000 }
              as: SponsorOperator
              captures: { prop2_id: $.data.id }
            - call: "POST /syndications/${syn_id}/properties/${prop1_id}/capital-events"
              payload: { event_kind: "REFINANCE", gross_proceeds_cents: 1000000, debt_payoff_cents: 1000000 }
              as: SponsorOperator
              captures: { ev1_id: $.data.id }
            - call: "POST /syndications/${syn_id}/properties/${prop2_id}/capital-events"
              payload: { event_kind: "REFINANCE", gross_proceeds_cents: 1000001, debt_payoff_cents: 1000000 }
              as: SponsorOperator
              captures: { ev2_id: $.data.id }
          trigger:
            - call: "POST /syndications/${syn_id}/properties/${prop1_id}/capital-events/${ev1_id}/execute"
              payload: {}
              as: SponsorOperator
              captures: { err1: $.data.error_id }
            - call: "POST /syndications/${syn_id}/properties/${prop2_id}/capital-events/${ev2_id}/execute"
              payload: {}
              as: SponsorOperator
          assert:
            - "CapitalEvent.${ev1_id} execute rejected: error_id == ERR_INSUFFICIENT_PROCEEDS (HTTP 422)"
            - "CapitalEvent.${ev2_id}.status == EXECUTED"
            - "CapitalEvent.${ev2_id}.net_distributable_cents == 1"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:

      - name: offering_open_requires_property_owned
        grounds:
          - state_machines.Offering.DRAFT_to_OPEN
          - entities.Property.fields.status
          - errors[ERR_PROPERTY_NOT_OWNED]
        distinguishing_aspect: |
          Entity pair: Offering -> Property. Offering transition DRAFT->OPEN
          is gated on Property.status == OWNED. If the linked Property is in
          UNDER_CONTRACT_TO_SELL or SOLD, the open transition fails with
          ERR_PROPERTY_NOT_OWNED.
        test_recipe:
          setup:
            - "One syndication ACTIVE"
            - "Property P1 with status=OWNED; Property P2 with status=SOLD (achieved via prior SALE CapitalEvent executed)"
            - "Offering A linked to P1 (DRAFT); Offering B linked to P2 (DRAFT)"
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "XSyn", sponsor_legal_entity: "X LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: $.data.id }
            - call: "POST /syndications/${syn_id}/activate"
              payload: {}
              as: SponsorOperator
            - call: "POST /properties"
              payload: { property_legal_name: "P1", street_address: "1 X St", acquisition_price_cents: 100000000 }
              as: SponsorOperator
              captures: { p1_id: $.data.id }
            - call: "POST /properties"
              payload: { property_legal_name: "P2", street_address: "2 X St", acquisition_price_cents: 100000000 }
              as: SponsorOperator
              captures: { p2_id: $.data.id }
            # Drive P2 to SOLD via a capital event
            - call: "POST /syndications/${syn_id}/properties/${p2_id}/capital-events"
