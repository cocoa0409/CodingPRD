# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Crop Insurance (USDA RMA) — task_0196_crop_insurance_rma
# Nine §0.5 Difficulty Rules, >= 2 instances each (>= 18 total).
# Every grounds[] resolves into SCAFFOLD.yaml §1.1-§1.7.
# All formula-derived asserts are pre-computed literals (verified by code).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_yp_vs_rp_indemnity_same_loss
        grounds:
          - calculations.yp_or_rp_indemnity
          - state_machines.LossClaim.UNDER_REVIEW_to_APPROVED
          - entities.CoverageElection.fields.plan_type
          - entities.LossClaim.fields.indemnity_cents
        distinguishing_aspect: |
          On identical inputs (aph_yield=180, coverage_level=0.75, projected=4.00,
          harvest=5.20, 100 ac, share=1, production_to_count=10000 bu), a YP election
          yields indemnity_cents=1400000 while an RP election yields 1820000 — two
          valid algorithms on the same LossClaim domain produce different dollars.
        test_recipe:
          setup:
            - "OPEN program CORN/19153/2026: projected_price=4.00, base_premium_rate=0.085, pp_coverage_factor=0.60, harvest_price published=5.20"
            - "Producer P; selling Agent SA; LossAdjuster ADJ (distinct Agent)"
            - "Two policies: one YP election, one RP election, each with one 100-acre share=1 unit, both units REPORTED"
            - "A loss claim on each unit, production_to_count_bu=10000, submitted to ADJ"
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "SA-1", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /agents"
              payload: { name: "Adjuster", license_number: "ADJ-1", role_kind: "ADJUSTING" }
              as: RmaAdmin
              captures: { adj_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer P", tax_id: "TX-1" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /commodity-programs"
              payload: { crop_code: "CORN", county_code: "19153", crop_year: 2026, projected_price: 4.00, base_premium_rate: 0.085, pp_coverage_factor: 0.60, final_planting_date: "2026-05-31T00:00:00Z", acreage_reporting_deadline: "2026-07-15T00:00:00Z" }
              as: RmaAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /commodity-programs/${prog_id}/open"
              payload: {}
              as: RmaAdmin
            - call: "POST /commodity-programs/${prog_id}/publish-harvest-price"
              payload: { harvest_price: 5.20 }
              as: RmaAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RmaAdmin
            # --- YP policy ---
            - call: "POST /policies"
              payload: { producer_id: "${prod_id}", agent_id: "${sa_id}", crop_year: 2026 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { yp_policy_id: $.data.id }
            - call: "POST /coverage-elections"
              payload: { policy_id: "${yp_policy_id}", commodity_program_id: "${prog_id}", plan_type: "YP", aph_yield: 180, coverage_level: 0.75 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { yp_elec_id: $.data.id }
            - call: "POST /units"
              payload: { coverage_election_id: "${yp_elec_id}", unit_number: "0001-0001", acres: 100, share: 1 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { yp_unit_id: $.data.id, yp_unit_v: $.data.version }
            - call: "POST /acreage-reports"
              payload: { unit_id: "${yp_unit_id}", planted_acres: 100, prevented_acres: 0, planting_date: "2026-05-10T00:00:00Z", expected_unit_version: "${yp_unit_v}" }
              as: Agent
              as_user_id: "${sa_id}"
            - call: "POST /loss-claims"
              payload: { unit_id: "${yp_unit_id}", harvest_date: "2026-10-15T00:00:00Z", production_to_count_bu: 10000, assigned_adjuster_id: "${adj_id}" }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { yp_claim_id: $.data.id }
            - call: "POST /loss-claims/${yp_claim_id}/submit"
              payload: {}
              as: Agent
              as_user_id: "${sa_id}"
            # --- RP policy ---
            - call: "POST /policies"
              payload: { producer_id: "${prod_id}", agent_id: "${sa_id}", crop_year: 2026 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { rp_policy_id: $.data.id }
            - call: "POST /coverage-elections"
              payload: { policy_id: "${rp_policy_id}", commodity_program_id: "${prog_id}", plan_type: "RP", aph_yield: 180, coverage_level: 0.75 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { rp_elec_id: $.data.id }
            - call: "POST /units"
              payload: { coverage_election_id: "${rp_elec_id}", unit_number: "0002-0001", acres: 100, share: 1 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { rp_unit_id: $.data.id, rp_unit_v: $.data.version }
            - call: "POST /acreage-reports"
              payload: { unit_id: "${rp_unit_id}", planted_acres: 100, prevented_acres: 0, planting_date: "2026-05-10T00:00:00Z", expected_unit_version: "${rp_unit_v}" }
              as: Agent
              as_user_id: "${sa_id}"
            - call: "POST /loss-claims"
              payload: { unit_id: "${rp_unit_id}", harvest_date: "2026-10-15T00:00:00Z", production_to_count_bu: 10000, assigned_adjuster_id: "${adj_id}" }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { rp_claim_id: $.data.id }
            - call: "POST /loss-claims/${rp_claim_id}/submit"
              payload: {}
              as: Agent
              as_user_id: "${sa_id}"
          trigger:
            - call: "POST /loss-claims/${yp_claim_id}/approve"
              payload: {}
              as: LossAdjuster
              as_user_id: "${adj_id}"
              captures: { yp_ind: $.data.indemnity_cents }
            - call: "POST /loss-claims/${rp_claim_id}/approve"
              payload: {}
              as: LossAdjuster
              as_user_id: "${adj_id}"
              captures: { rp_ind: $.data.indemnity_cents }
          assert:
            - "LossClaim.${yp_claim_id}.indemnity_cents == 1400000"
            - "LossClaim.${rp_claim_id}.indemnity_cents == 1820000"
            - "LossClaim.${rp_claim_id}.indemnity_cents != LossClaim.${yp_claim_id}.indemnity_cents"

      - name: dual_variant_lossclaim_indemnity_vs_pp_indemnity
        grounds:
          - calculations.yp_or_rp_indemnity
          - calculations.prevented_planting_indemnity
          - entities.PreventedPlantingClaim.fields.pp_indemnity_cents
          - entities.LossClaim.fields.indemnity_cents
        distinguishing_aspect: |
          The yield/revenue indemnity (loss on planted production, LossClaim domain)
          and the prevented-planting indemnity (liability * pp factor on never-planted
          acres, PreventedPlantingClaim domain) are two different algorithms on two
          different entities: a YP loss with production_to_count=6000 over a 100-ac unit
          yields LossClaim.indemnity_cents=3000000, while 40 prevented ac at pp_factor
          0.60 (54000c/ac liability -> 32400c/ac) yields
          PreventedPlantingClaim.pp_indemnity_cents=1296000.
        test_recipe:
          setup:
            - "OPEN program CORN/19153/2026 (projected 4.00, pp_factor 0.60, harvest published 5.20)"
            - "YP election, one 100-ac share=1 unit; acreage report: 60 planted + 40 prevented"
            - "A LossClaim (60 planted ac, ptc=6000 bu) and a PreventedPlantingClaim (40 prevented ac) both submitted to ADJ"
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "SA-2", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /agents"
              payload: { name: "Adjuster", license_number: "ADJ-2", role_kind: "ADJUSTING" }
              as: RmaAdmin
              captures: { adj_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer P2", tax_id: "TX-2" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /commodity-programs"
              payload: { crop_code: "CORN", county_code: "19153", crop_year: 2026, projected_price: 4.00, base_premium_rate: 0.085, pp_coverage_factor: 0.60, final_planting_date: "2026-05-31T00:00:00Z", acreage_reporting_deadline: "2026-07-15T00:00:00Z" }
              as: RmaAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /commodity-programs/${prog_id}/open"
              payload: {}
              as: RmaAdmin
            - call: "POST /commodity-programs/${prog_id}/publish-harvest-price"
              payload: { harvest_price: 5.20 }
              as: RmaAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RmaAdmin
            - call: "POST /policies"
              payload: { producer_id: "${prod_id}", agent_id: "${sa_id}", crop_year: 2026 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { policy_id: $.data.id }
            - call: "POST /coverage-elections"
              payload: { policy_id: "${policy_id}", commodity_program_id: "${prog_id}", plan_type: "YP", aph_yield: 180, coverage_level: 0.75 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { elec_id: $.data.id }
            - call: "POST /units"
              payload: { coverage_election_id: "${elec_id}", unit_number: "0001-0001", acres: 100, share: 1 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { unit_id: $.data.id, unit_v: $.data.version }
            - call: "POST /acreage-reports"
              payload: { unit_id: "${unit_id}", planted_acres: 60, prevented_acres: 40, planting_date: "2026-05-10T00:00:00Z", expected_unit_version: "${unit_v}" }
              as: Agent
              as_user_id: "${sa_id}"
            - call: "POST /loss-claims"
              payload: { unit_id: "${unit_id}", harvest_date: "2026-10-15T00:00:00Z", production_to_count_bu: 6000, assigned_adjuster_id: "${adj_id}" }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /loss-claims/${claim_id}/submit"
              payload: {}
              as: Agent
              as_user_id: "${sa_id}"
            - call: "POST /prevented-planting-claims"
              payload: { unit_id: "${unit_id}", claimed_prevented_acres: 40, cause: "EXCESS_MOISTURE" }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { pp_id: $.data.id }
            - call: "POST /prevented-planting-claims/${pp_id}/submit"
              payload: {}
              as: Agent
              as_user_id: "${sa_id}"
          trigger:
            - call: "POST /loss-claims/${claim_id}/approve"
              payload: {}
              as: LossAdjuster
              as_user_id: "${adj_id}"
            - call: "POST /prevented-planting-claims/${pp_id}/approve"
              payload: {}
              as: LossAdjuster
              as_user_id: "${adj_id}"
          assert:
            # YP: guar_bu=135/ac; ptc_per_acre=6000/100=60; (135-60)*4=300/ac; *100ac*1*100 = 3000000c
            # PP: liability 54000c/ac; *0.60=32400c/ac; *40 prevented ac*1 = 1296000c
            - "LossClaim.${claim_id}.indemnity_cents == 3000000"
            - "PreventedPlantingClaim.${pp_id}.pp_indemnity_cents == 1296000"
            - "PreventedPlantingClaim.${pp_id}.pp_indemnity_cents != LossClaim.${claim_id}.indemnity_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_premium_rounding_order_per_acre_then_sum
        grounds:
          - calculations.total_premium
          - entities.CoverageElection.fields.total_premium_cents
          - entities.Unit.fields.acres
        distinguishing_aspect: |
          MODE (b) nested rounding where order matters: per_acre_premium_cents is
          rounded to whole cents BEFORE multiplying by acres. With liability=54000c/ac,
          base_rate=0.085, RP mult=1.15 -> per_acre raw=5278.5c rounds to 5279c, *100ac
          = 527900c; sum-then-round of 5278.5*100=527850c would give 527850 — the pinned
          per-acre-then-sum order yields 527900, not 527850.
        test_recipe:
          setup:
            - "OPEN program CORN/19153/2026 (projected 4.00, base_rate 0.085)"
            - "RP election aph=180 cov=0.75 -> liability 54000c/ac; one 100-ac share=1 unit"
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "SA-3", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer P3", tax_id: "TX-3" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /commodity-programs"
              payload: { crop_code: "CORN", county_code: "19153", crop_year: 2026, projected_price: 4.00, base_premium_rate: 0.085, pp_coverage_factor: 0.60, final_planting_date: "2026-05-31T00:00:00Z", acreage_reporting_deadline: "2026-07-15T00:00:00Z" }
              as: RmaAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /commodity-programs/${prog_id}/open"
              payload: {}
              as: RmaAdmin
            - call: "POST /policies"
              payload: { producer_id: "${prod_id}", agent_id: "${sa_id}", crop_year: 2026 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { policy_id: $.data.id }
            - call: "POST /coverage-elections"
              payload: { policy_id: "${policy_id}", commodity_program_id: "${prog_id}", plan_type: "RP", aph_yield: 180, coverage_level: 0.75 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { elec_id: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { coverage_election_id: "${elec_id}", unit_number: "0001-0001", acres: 100, share: 1 }
              as: Agent
              as_user_id: "${sa_id}"
            - call: "GET /coverage-elections/${elec_id}"
              payload: {}
              as: Agent
              as_user_id: "${sa_id}"
              captures: { tp: $.data.total_premium_cents }
          assert:
            - "CoverageElection.${elec_id}.dollar_liability_per_acre_cents == 54000"
            - "CoverageElection.${elec_id}.total_premium_cents == 527900"

      - name: combinatorial_commission_tier_ordered_dependency_on_total
        grounds:
          - calculations.agent_commission
          - calculations.total_premium
          - entities.AgentCommission.fields.commission_rate
          - state_machines.Policy.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          MODE (c) circular-looking ordered dependency: the commission_rate tier is
          keyed on total_premium_cents, which must be finalized first. With RP
          total_premium_cents=527900 (>500000, <=1000000) the 0.08 tier is selected,
          commission_cents=round(527900*0.08)=42232 — selecting the tier before
          finalizing the total would mis-rate it.
        test_recipe:
          setup:
            - "OPEN program; RP election aph=180 cov=0.75; one 100-ac share=1 unit -> total_premium_cents=527900"
            - "Policy not yet activated"
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "SA-4", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer P4", tax_id: "TX-4" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /commodity-programs"
              payload: { crop_code: "CORN", county_code: "19153", crop_year: 2026, projected_price: 4.00, base_premium_rate: 0.085, pp_coverage_factor: 0.60, final_planting_date: "2026-05-31T00:00:00Z", acreage_reporting_deadline: "2026-07-15T00:00:00Z" }
              as: RmaAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /commodity-programs/${prog_id}/open"
              payload: {}
              as: RmaAdmin
            - call: "POST /policies"
              payload: { producer_id: "${prod_id}", agent_id: "${sa_id}", crop_year: 2026 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { policy_id: $.data.id }
            - call: "POST /coverage-elections"
              payload: { policy_id: "${policy_id}", commodity_program_id: "${prog_id}", plan_type: "RP", aph_yield: 180, coverage_level: 0.75 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { elec_id: $.data.id }
            - call: "POST /units"
              payload: { coverage_election_id: "${elec_id}", unit_number: "0001-0001", acres: 100, share: 1 }
              as: Agent
              as_user_id: "${sa_id}"
          trigger:
            - call: "POST /policies/${policy_id}/activate"
              payload: {}
              as: Agent
              as_user_id: "${sa_id}"
            - call: "GET /agent-commissions?coverage_election_id=${elec_id}"
              payload: {}
              as: Agent
              as_user_id: "${sa_id}"
              captures: { comm_rate: "$.data[0].commission_rate", comm_cents: "$.data[0].commission_cents" }
          assert:
            - "AgentCommission for election ${elec_id} has commission_rate == 0.08"
            - "AgentCommission for election ${elec_id} has commission_cents == 42232"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nonlinear_lossclaim_revision_loop_cycle
        grounds:
          - state_machines.LossClaim.UNDER_REVIEW_to_DRAFT
          - state_machines.LossClaim.DRAFT_to_UNDER_REVIEW
          - entities.LossClaim.fields.revision_count
        distinguishing_aspect: |
          LossClaim is cyclic: UNDER_REVIEW -> DRAFT (adjuster return) -> UNDER_REVIEW
          (resubmit) loops, incrementing revision_count each return. After two
          return-and-resubmit rounds revision_count == 2 while status is UNDER_REVIEW
          again — a non-linear cycle, not an A->B->C pipeline.
        test_recipe:
          setup:
            - "OPEN program (harvest published); YP election, one REPORTED 100-ac unit"
            - "LossClaim filed (ptc=10000) and submitted to ADJ (UNDER_REVIEW)"
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "SA-5", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /agents"
              payload: { name: "Adjuster", license_number: "ADJ-5", role_kind: "ADJUSTING" }
              as: RmaAdmin
              captures: { adj_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer P5", tax_id: "TX-5" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /commodity-programs"
              payload: { crop_code: "CORN", county_code: "19153", crop_year: 2026, projected_price: 4.00, base_premium_rate: 0.085, pp_coverage_factor: 0.60, final_planting_date: "2026-05-31T00:00:00Z", acreage_reporting_deadline: "2026-07-15T00:00:00Z" }
              as: RmaAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /commodity-programs/${prog_id}/open"
              payload: {}
              as: RmaAdmin
            - call: "POST /commodity-programs/${prog_id}/publish-harvest-price"
              payload: { harvest_price: 5.20 }
              as: RmaAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RmaAdmin
            - call: "POST /policies"
              payload: { producer_id: "${prod_id}", agent_id: "${sa_id}", crop_year: 2026 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { policy_id: $.data.id }
            - call: "POST /coverage-elections"
              payload: { policy_id: "${policy_id}", commodity_program_id: "${prog_id}", plan_type: "YP", aph_yield: 180, coverage_level: 0.75 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { elec_id: $.data.id }
            - call: "POST /units"
              payload: { coverage_election_id: "${elec_id}", unit_number: "0001-0001", acres: 100, share: 1 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { unit_id: $.data.id, unit_v: $.data.version }
            - call: "POST /acreage-reports"
              payload: { unit_id: "${unit_id}", planted_acres: 100, prevented_acres: 0, planting_date: "2026-05-10T00:00:00Z", expected_unit_version: "${unit_v}" }
              as: Agent
              as_user_id: "${sa_id}"
            - call: "POST /loss-claims"
              payload: { unit_id: "${unit_id}", harvest_date: "2026-10-15T00:00:00Z", production_to_count_bu: 10000, assigned_adjuster_id: "${adj_id}" }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /loss-claims/${claim_id}/submit"
              payload: {}
              as: Agent
              as_user_id: "${sa_id}"
          trigger:
            - call: "POST /loss-claims/${claim_id}/return"
              payload: {}
              as: LossAdjuster
              as_user_id: "${adj_id}"
            - call: "POST /loss-claims/${claim_id}/submit"
              payload: {}
              as: Agent
              as_user_id: "${sa_id}"
            - call: "POST /loss-claims/${claim_id}/return"
              payload: {}
              as: LossAdjuster
              as_user_id: "${adj_id}"
            - call: "POST /loss-claims/${claim_id}/submit"
              payload: {}
              as: Agent
              as_user_id: "${sa_id}"
              captures: { st: $.data.status, rc: $.data.revision_count }
          assert:
            - "LossClaim.${claim_id}.revision_count == 2"
            - "LossClaim.${claim_id}.status == UNDER_REVIEW"

      - name: nonlinear_lossclaim_branch_approve_vs_deny_divergent_effects
        grounds:
          - state_machines.LossClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.LossClaim.UNDER_REVIEW_to_DENIED
          - entities.Policy.fields.total_indemnity_cents
        distinguishing_aspect: |
          From UNDER_REVIEW the LossClaim branches: APPROVE sets indemnity_cents>0 and
          adds it to Policy.total_indemnity_cents; DENY leaves indemnity_cents=0 and the
          policy ledger unchanged. Two policies built identically diverge only by which
          branch fires (different side-effect sets on a different entity than instance 1).
        test_recipe:
          setup:
            - "Two identical YP policies each with a REPORTED unit and a submitted LossClaim (ptc=10000)"
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "SA-6", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /agents"
              payload: { name: "Adjuster", license_number: "ADJ-6", role_kind: "ADJUSTING" }
              as: RmaAdmin
              captures: { adj_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer P6", tax_id: "TX-6" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /commodity-programs"
