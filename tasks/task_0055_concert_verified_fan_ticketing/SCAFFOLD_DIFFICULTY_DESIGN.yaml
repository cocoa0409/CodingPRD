      - name: ticket_offer_window_temporal_expiry
        grounds:
          - state_machines.QueueEntry.OFFERED_to_EXPIRED
          - entities.QueueEntry.fields.offer_expires_at
          - validations[priority=14]
        distinguishing_aspect: |
          Point-in-time interval semantics on QueueEntry: the offer occupies a [offer_time, offer_expires_at]
          window; redemption at now > offer_expires_at is rejected (half-open upper bound) — distinct
          interval arithmetic (instantaneous deadline) from the aggregate-capacity overlap above.
        test_recipe:
          setup:
            - "Fan V has an OFFERED entry; clock advanced strictly past offer_expires_at without a sweep; V tries to redeem."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PromoterAdmin
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000, resale_cap_pct: 110 }
              as: PromoterAdmin
