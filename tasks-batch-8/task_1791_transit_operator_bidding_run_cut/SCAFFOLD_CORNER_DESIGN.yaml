              as: SchedulingOfficer
          trigger:
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
              captures: { v1: $.data.version }
          assert:
            - "version at create == 1"
            - "version after run creation == 2 (exactly +1)"

