            - { call: "GET /farm/visit-sessions", payload: { window_id: "${w_id}" }, as: FarmManager, captures: { off_s_id: $.data.0.id } }
            - { call: "POST /farm/visit-sessions/${off_s_id}/enter-field", payload: {}, as: FieldStaff }
            - { call: "POST /farm/offline-batches", payload: { device_id: "DEV1", batch_id: "B2", records: [ { record_type: "HARVEST_LINE", sequence_index: 1, offline_ref: "L1", payload: { session_ref: "S1", crop_id: "${crop_id}", gross_weight_oz: 116, container_count: 4 } } ] }, as: KioskDevice, captures: { b2_id: $.data.id } }
