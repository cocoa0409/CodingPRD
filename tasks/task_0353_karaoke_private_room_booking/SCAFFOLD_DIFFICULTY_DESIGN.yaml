            - "response.data.error_id == ERR_INVALID_STATE"

      # ---- Instance 2: business_safety (8/capacity) vs business_temporal (10/double-booked) -> capacity wins ----
      - name: create_capacity_exceeded_beats_double_booked
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - entities.RoomType.fields.capacity
        distinguishing_aspect: |
          A create that BOTH exceeds room_type capacity (priority 8, ERR_CAPACITY_EXCEEDED) and
          overlaps an existing active reservation on the same room (priority 10,
          ERR_ROOM_DOUBLE_BOOKED) returns the lower-priority-number capacity error — a different
          error-category pair (business_safety vs business_temporal) than instance 1.
        test_recipe:
          setup:
