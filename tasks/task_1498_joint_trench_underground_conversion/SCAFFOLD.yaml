  - entity: ServiceConversion
    initial_state: PLANNED (work_status) / NONE (temp_service_status)
    terminal_states: [COMPLETE (work_status)]
    notes: "Two parallel state dimensions on one row; they evolve independently except where transitions name the other dimension."
    transitions:
      - from: "work PLANNED"
        to: "work ROUGH_IN"
        trigger: "POST /api/service-conversions/{id}/work-transition {to: ROUGH_IN}"
        actor: ConversionContractor
        preconditions: ["project.status == TRENCHING|CONVERTING (ERR_INVALID_STATE)"]
        side_effects: []
      - from: "work ROUGH_IN"
        to: "work PANEL_SET"
        trigger: "POST /api/service-conversions/{id}/work-transition {to: PANEL_SET, panel_capacity_amps}"
        actor: ConversionContractor
        preconditions:
          - "panel_capacity_amps >= ceil(parcel.load_calc_amps * 1.25) (ERR_PANEL_CAPACITY_INADEQUATE)"
        side_effects: ["panel_capacity_amps set"]
      - from: "work PANEL_SET"
        to: "work READY_TO_ENERGIZE"
        trigger: "POST /api/service-conversions/{id}/work-transition {to: READY_TO_ENERGIZE}"
        actor: ConversionContractor
        preconditions: []
        side_effects: []
      - from: "work READY_TO_ENERGIZE"
        to: "work ENERGIZED"
        trigger: "POST /api/service-conversions/{id}/work-transition {to: ENERGIZED}"
        actor: ConversionContractor
        preconditions:
          - "the TrenchSegment whose parcel_ids contains this parcel is BACKFILLED|CLOSED (ERR_SEGMENT_NOT_BACKFILLED)"
        side_effects: ["energized_on = clock"]
      - from: "work ENERGIZED"
        to: "work INSPECTED"
        trigger: "POST /api/service-conversions/{id}/work-transition {to: INSPECTED, outcome: PASS}"
        actor: ConversionContractor
        preconditions: ["outcome == PASS (ERR_VALIDATION otherwise)"]
        side_effects: ["last_inspection_outcome = PASS"]
      - from: "work ENERGIZED"
        to: "work ROUGH_IN"
        trigger: "POST /api/service-conversions/{id}/work-transition {to: ROUGH_IN, outcome: FAIL} (rework cycle)"
        actor: ConversionContractor
        preconditions: ["outcome == FAIL (ERR_VALIDATION otherwise)"]
        side_effects: ["last_inspection_outcome = FAIL", "panel_capacity_amps reset to null"]
      - from: "work INSPECTED"
        to: "work COMPLETE"
        trigger: "POST /api/service-conversions/{id}/work-transition {to: COMPLETE}"
        actor: ConversionContractor
        preconditions: ["temp_service_status in NONE|TEMP_REMOVED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: "temp NONE"
        to: "temp TEMP_INSTALLED"
        trigger: "POST /api/service-conversions/{id}/temp-service-transition {to: TEMP_INSTALLED}"
        actor: ConversionContractor
        preconditions: []
        side_effects: []
      - from: "temp TEMP_INSTALLED"
        to: "temp TEMP_ACTIVE"
        trigger: "POST /api/service-conversions/{id}/temp-service-transition {to: TEMP_ACTIVE}"
        actor: ConversionContractor
        preconditions: []
        side_effects: []
      - from: "temp TEMP_ACTIVE"
        to: "temp TEMP_REMOVED"
        trigger: "POST /api/service-conversions/{id}/temp-service-transition {to: TEMP_REMOVED}"
        actor: ConversionContractor
        preconditions: ["work_status in ENERGIZED|INSPECTED (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: OutageWindow
    initial_state: PROPOSED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
