            - call: "POST /programs/${prog_id}/routes"
              payload: { route_code: "R3", vehicle_capacity_kg: 5000, processing_partner_id: "${partner_id}", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T13:00:00Z" }
              as: RouteOperator
              captures: { r3_id: $.data.id, r3_v: $.data.version }
            - call: "POST /programs/${prog_id}/routes/${r3_id}/stops"
              payload: { site_id: "${site_id}", planned_pickup_kg: 10, stop_sequence: 1, expected_route_version: "${r3_v}" }
              as: RouteOperator
          trigger:
            - call: "POST /programs/${prog_id}/routes/${r2_id}/dispatch"
              payload: {}
              as: RouteOperator
            - call: "POST /programs/${prog_id}/routes/${r3_id}/dispatch"
              payload: {}
              as: RouteOperator
              captures: { err: $.data.error_id }
          assert:
            - "R2 dispatch succeeds — adjacency (R1.end == R2.start) is not a conflict"
            - "R3 dispatch returns ERR_PARTNER_DOUBLE_BOOKED (overlaps R1's window)"

      - name: host_agreement_term_renewal_touching_boundary
        grounds:
          - calculations.agreement_term_overlap
          - errors[ERR_AGREEMENT_OVERLAP]
        distinguishing_aspect: |
          Different interval semantics on SiteHostAgreement: touching terms
          (new.term_start == old.term_end) are explicitly ALLOWED as renewal
          chains, while any strict interior overlap fails
          ERR_AGREEMENT_OVERLAP. Different resource and boundary convention
          than the route-window rule.
        test_recipe:
          setup:
            - "Program DRAFT; site created; A1 ACTIVE [2026-01-01, 2026-07-01)"
            - "A2 [2026-07-01, 2027-01-01) touching renewal — must activate"
            - "A3 [2026-06-15, 2026-12-01) strict overlap — must fail"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P16", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St", capacity_kg: 10000 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements"
              payload: { site_id: "${site_id}", host_name: "H1", term_start: "2026-01-01T00:00:00Z", term_end: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements/${a1_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/host-agreements"
              payload: { site_id: "${site_id}", host_name: "H2", term_start: "2026-07-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { a2_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements"
              payload: { site_id: "${site_id}", host_name: "H3", term_start: "2026-06-15T00:00:00Z", term_end: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { a3_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/host-agreements/${a2_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/host-agreements/${a3_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "A2 activates (touching renewal boundary allowed)"
            - "A3 activation returns ERR_AGREEMENT_OVERLAP (strict interior overlap)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bucket_credit_conservation
        grounds:
          - calculations.bucket_credit_ledger
          - entities.Participant.fields.bucket_credit_balance
          - state_machines.DistributionAllocation.REQUESTED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: bucket_credit_balance == granted_total −
          redeemed_total − expired_total. A REQUESTED-then-CANCELLED
          allocation pair (forward + compensating action) leaves balance and
          all three totals identical — zero drift.
        test_recipe:
          setup:
            - "Program ACTIVE; participant with 10 credits from an accepted 10-kg drop"
            - "Distribution OPEN with pool 10.00 kg; one REQUESTED allocation of 5 credits"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P17", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St", capacity_kg: 10000 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements"
              payload: { site_id: "${site_id}", host_name: "H", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/materials"
              payload: { code: "FOOD", description: "food", accepted_start_month_day: "01-01", accepted_end_month_day: "12-31", contamination_sensitivity: "LOW" }
              as: ProgramAdmin
              captures: { mat_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/participants/register"
              payload: { email: "p@x.com", full_name: "P", household_size: 1 }
              as: Anonymous
              captures: { part_id: $.data.id, part_tok: $.data.verification_token }
            - call: "POST /programs/${prog_id}/participants/${part_id}/verify"
              payload: { verification_token: "${part_tok}" }
              as: Anonymous
            - call: "POST /programs/${prog_id}/participants/${part_id}/grants"
              payload: { site_id: "${site_id}", bucket_quota: 5, expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { grant_id: $.data.id }
            - call: "GET /programs/${prog_id}/sites/${site_id}"
              payload: {}
              as: ProgramAdmin
              captures: { sv: $.data.version }
            - call: "POST /programs/${prog_id}/sites/${site_id}/drops"
              payload: { participant_id: "${part_id}", access_grant_id: "${grant_id}", material_category_id: "${mat_id}", gross_weight_kg: 10.00, contamination_kg: 0.00, occurred_at: "2026-08-01T10:00:00Z", expected_site_version: "${sv}" }
              as: Participant
              as_user_id: "${part_id}"
              captures: { drop_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites/${site_id}/drops/${drop_id}/accept"
              payload: {}
              as: SiteHost
            - call: "POST /programs/${prog_id}/partners"
              payload: { name: "PP", intake_capacity_kg_per_day: 10000, yield_ratio: 1.0, contamination_reject_threshold_pct: 25.0 }
              as: ProgramAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /programs/${prog_id}/routes"
              payload: { route_code: "R1", vehicle_capacity_kg: 5000, processing_partner_id: "${partner_id}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }
              as: RouteOperator
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /programs/${prog_id}/routes/${route_id}/stops"
              payload: { site_id: "${site_id}", planned_pickup_kg: 10, stop_sequence: 1, expected_route_version: "${route_v}" }
              as: RouteOperator
              captures: { stop_id: $.data.id }
            - call: "POST /programs/${prog_id}/routes/${route_id}/dispatch"
              payload: {}
              as: RouteOperator
            - call: "POST /programs/${prog_id}/routes/${route_id}/stops/${stop_id}/collect"
              payload: { actual_pickup_kg: 10.00 }
              as: RouteOperator
            - call: "POST /programs/${prog_id}/routes/${route_id}/complete"
              payload: {}
              as: RouteOperator
            - call: "GET /programs/${prog_id}/partners/${partner_id}/batches"
              payload: {}
              as: ProgramAdmin
              captures: { batch_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/partners/${partner_id}/batches/${batch_id}/close"
              payload: { measured_contamination_kg: 0.00 }
              as: ProcessingPartner
              as_user_id: "${partner_id}"
            - call: "POST /programs/${prog_id}/distributions"
              payload: { batch_id: "${batch_id}" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id, dist_v: $.data.version }
            - call: "GET /programs/${prog_id}/participants/${part_id}"
              payload: {}
              as: ProgramAdmin
              captures: { bal_before: $.data.bucket_credit_balance }
            - call: "POST /programs/${prog_id}/distributions/${dist_id}/allocations"
              payload: { participant_id: "${part_id}", requested_kg: 5.00, credits_redeemed: 5, expected_distribution_version: "${dist_v}" }
              as: Participant
              as_user_id: "${part_id}"
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/distributions/${dist_id}/allocations/${alloc_id}/cancel"
              payload: {}
              as: ProgramAdmin
            - call: "GET /programs/${prog_id}/participants/${part_id}"
              payload: {}
              as: ProgramAdmin
              captures: { bal_after: $.data.bucket_credit_balance, redeemed_after: $.data.bucket_credits_redeemed_total }
          assert:
            - "bal_before == 10 and bal_after == 10 (no drift across request+cancel pair)"
            - "redeemed_after == 0 (refund does not count as redemption)"
            - "Invariant holds: 10 == 10 − 0 − 0"

      - name: site_mass_conservation_pickup_and_reject
        grounds:
          - calculations.site_mass_ledger
          - entities.Site.fields.stored_kg
          - state_machines.RouteStop.SCHEDULED_to_COLLECTED
          - state_machines.DropEvent.FLAGGED_CONTAMINATED_to_REJECTED
        distinguishing_aspect: |
          Different conserved quantity — physical mass: stored_kg == sum of
          live non-REJECTED drop net mass − sum of COLLECTED actual_pickup_kg.
          Forward action (drop) + compensating action (CRITICAL report
          dismissal rejecting the drop) leaves stored_kg exactly equal to the
          surviving drops minus pickups; different quantity than credits.
