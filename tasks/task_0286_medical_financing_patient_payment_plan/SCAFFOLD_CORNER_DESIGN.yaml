      - name: occ_stale_account_version_on_authorize
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[purchase-authorize-stale-account]", 'endpoints[\"POST /financed-purchases\"]']
        distinguishing_aspect: "Two strictly-sequential authorizes: the first bumps the account version (6->7) by consuming credit; the second still carrying expected_patient_account_version of the pre-first value is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Account ACTIVE limit 500,000; ENROLLED provider; ACTIVE promotion in window; client has observed account version v0."]
          setup_api_calls:
            - call: "POST /_clock/set"
