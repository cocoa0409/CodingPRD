    code: 201
    input: [part_lot_id, required_part_code, units]
    output: PartsReservation
    side_effects:
      - "calculations.parts_substitution_eligibility decides is_substitution or rejects"
      - "PartLot.reserved_units += units, available_units recomputed, status re-derived"
      - "GearModel.parts_support_status re-derived"
  - method: GET
    path: "/gear-service/parts-reservations/{id}"
    description: "read a reservation"
    roles: [ServiceAgent, RepairTechnician, PartsCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: PartsReservation
    side_effects: []
  - method: GET
    path: "/gear-service/parts-reservations"
    description: "list reservations; repair_order_id and part_lot_id filters are the reverse-reachability channels for both FKs"
    roles: [ServiceAgent, RepairTechnician, PartsCoordinator, ProgramAdmin]
    code: 200
    input: ["repair_order_id?", "part_lot_id?", "status?", "limit?", "offset?"]
    output: PartsReservation[]
    side_effects: []
  - method: POST
    path: "/gear-service/parts-reservations/{id}/release"
    description: "release a reservation back to available stock"
    roles: [PartsCoordinator]
    code: 200
    input: ["reason?"]
    output: PartsReservation
    side_effects: ["status -> RELEASED, settled_at stamped", "PartLot.reserved_units -= units (available_units rises), status re-derived", "GearModel.parts_support_status re-derived"]
  - method: POST
    path: "/gear-service/parts-reservations/{id}/consume"
    description: "consume reserved units into the repair"
    roles: [RepairTechnician]
    code: 200
    input: []
    output: PartsReservation
    side_effects: ["status -> CONSUMED, settled_at stamped", "PartLot.on_hand_units -= units AND reserved_units -= units (available_units unchanged), status re-derived", "the line becomes billable on the FINAL invoice"]

  # ---------------------------------------------------------------- claims
  - method: POST
    path: "/gear-service/warranty-claims"
    description: "open a claim intake (warranty or paid-repair request) in DRAFT"
    roles: [Customer, ServiceAgent]
    code: 201
    input: ["service_center_id", "gear_item_id", "intake_kind", "reported_defect_type", "customer_narrative?"]
    output: WarrantyClaim
    side_effects: ["status = DRAFT", "proof_verified derived from the gear item's proof fields"]
  - method: GET
    path: "/gear-service/warranty-claims/{id}"
    description: "read a claim with its decision fields and version (the OCC token for assessments)"
    roles: [Customer, ServiceAgent, RepairTechnician, ProgramAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/gear-service/warranty-claims"
    description: "list claims; service_center_id and gear_item_id filters are the reverse-reachability channels for both FKs"
    roles: [Customer, ServiceAgent, RepairTechnician, ProgramAdmin]
    code: 200
    input: ["service_center_id?", "gear_item_id?", "status?", "decision?", "intake_kind?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/gear-service/warranty-claims/{id}/submit"
    description: "submit a DRAFT claim for assessment"
    roles: [Customer, ServiceAgent]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> SUBMITTED, submitted_at stamped", "GearItem.disposition_status -> AT_CENTER", "Customer.lifetime_claim_count += 1"]
  - method: POST
    path: "/gear-service/warranty-claims/{id}/info-requests"
    description: "ask the customer for more documentation, bounded at MAX_INFO_REQUESTS"
    roles: [ServiceAgent]
    code: 200
    input: [reason]
    output: WarrantyClaim
    side_effects: ["status -> INFO_REQUESTED, info_request_count += 1"]
  - method: POST
    path: "/gear-service/warranty-claims/{id}/resubmit"
    description: "answer an information request, optionally attaching proof of purchase to the unit"
    roles: [Customer, ServiceAgent]
    code: 200
    input: ["proof_of_purchase_type?", "proof_of_purchase_ref?", "customer_narrative?"]
    output: WarrantyClaim
    side_effects: ["status -> SUBMITTED, submitted_at restamped", "supplied proof fields are written onto the GearItem and proof_verified is recomputed"]
  - method: POST
    path: "/gear-service/warranty-claims/{id}/assessments"
    description: "record a bench assessment (defect versus wear) under optimistic concurrency on the claim"
    roles: [RepairTechnician]
    code: 201
    input: ["expected_claim_version", "determination", "required_work_types", "estimated_labor_lines", "estimated_parts_cents", "defect_notes?"]
    output: ClaimAssessment
    side_effects:
      - "concurrency_rules assessment-create-stale-claim is enforced first among the business checks"
      - "estimated_repair_cost_cents computed by the labor block of calculations.paid_repair_pricing (steps 1-4, no discount/expedite/tax)"
      - "every earlier ClaimAssessment on the claim -> is_superseded = true"
      - "WarrantyClaim.status -> UNDER_ASSESSMENT, assessment_count += 1, latest_determination and latest_repair_cost_cents mirrored, version += 1"
  - method: GET
    path: "/gear-service/claim-assessments/{id}"
    description: "read one assessment (immutable: no version, no update endpoint)"
    roles: [ServiceAgent, RepairTechnician, ProgramAdmin]
    code: 200
    input: []
    output: ClaimAssessment
    side_effects: []
  - method: GET
    path: "/gear-service/claim-assessments"
    description: "list assessments; warranty_claim_id and assessor_technician_id filters are the reverse-reachability channels for both FKs"
    roles: [ServiceAgent, RepairTechnician, ProgramAdmin]
    code: 200
    input: ["warranty_claim_id?", "assessor_technician_id?", "determination?", "is_superseded?", "limit?", "offset?"]
    output: ClaimAssessment[]
    side_effects: []
  - method: POST
    path: "/gear-service/warranty-claims/{id}/decision"
    description: "adjudicate the claim; the outcome is derived by calculations.repair_versus_replace and is never supplied by the caller"
    roles: [ServiceAgent, ProgramAdmin]
    code: 200
    input: ["decision_note?"]
    output: WarrantyClaim
    side_effects:
      - "decision, decision_threshold_pct, repair_ratio_pct, decision_by_role and decided_at stamped"
      - "WARRANTY_REPAIR: OPEN LiabilityEntry(REPAIR, DEPRECIATED_PURCHASE) created -> ServiceCenter.open_liability_cents -> liability_posture"
      - "WARRANTY_REPLACE: OPEN LiabilityEntry(REPLACEMENT, SUCCESSOR_MSRP) created, GearItem -> IRREPARABLE_HOLD"
      - "WARRANTY_REPAIR/WARRANTY_REPLACE: GearModel.defect_claim_count += 1; WEAR_DENIED: GearModel.wear_denial_count += 1; repairability_flag re-derived"
  - method: GET
    path: "/gear-service/warranty-claims/{id}/liability-entries"
    description: "list the liability reservations of a claim (reverse-reachability for LiabilityEntry.warranty_claim_id)"
    roles: [ServiceAgent, ProgramAdmin]
    code: 200
    input: ["status?", "basis?", "limit?", "offset?"]
    output: LiabilityEntry[]
    side_effects: []

  # ---------------------------------------------------------------- repair orders
  - method: POST
    path: "/gear-service/repair-orders"
    description: "open a repair order on an adjudicated claim and compute its turnaround commitment"
    roles: [ServiceAgent]
    code: 201
    input: ["warranty_claim_id", "expedite_requested?"]
    output: RepairOrder
    side_effects:
      - "order_kind and billing_status derived from claim.decision (WARRANTY_REPAIR -> WARRANTY_REPAIR/NOT_BILLABLE, PAID_REPAIR_OFFERED -> PAID_REPAIR/ESTIMATE_PENDING)"
      - "required_work_types copied from the claim's newest non-superseded assessment"
      - "calculations.turnaround_commitment sets queue_depth_snapshot, surge_multiplier_applied, parts_wait_days, promised_days, promised_return_at"
      - "GearItem.disposition_status -> IN_REPAIR; ServiceCenter.active_queue_depth and current_surge_multiplier recomputed AFTER the insert"
  - method: GET
    path: "/gear-service/repair-orders/{id}"
    description: "read a repair order with both state dimensions, its commitment and its version (the OCC token for estimates)"
    roles: [Customer, ServiceAgent, RepairTechnician, PartsCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []
  - method: GET
    path: "/gear-service/repair-orders"
    description: "list repair orders; service_center_id, warranty_claim_id and gear_item_id filters are the reverse-reachability channels for all three FKs"
    roles: [Customer, ServiceAgent, RepairTechnician, PartsCoordinator, ProgramAdmin]
    code: 200
    input: ["service_center_id?", "warranty_claim_id?", "gear_item_id?", "work_status?", "billing_status?", "commitment_breached?", "limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []
  - method: POST
    path: "/gear-service/repair-orders/{id}/estimates"
    description: "issue or re-issue a customer-facing PROVISIONAL estimate under optimistic concurrency on the order"
    roles: [ServiceAgent]
    code: 201
    input: ["expected_repair_order_version", "labor_lines", "parts_lines?"]
    output: RepairEstimate
    side_effects:
      - "concurrency_rules estimate-create-stale-order enforced"
      - "priced by calculations.paid_repair_pricing variant PROVISIONAL; valid_until = clock now + ESTIMATE_VALIDITY_DAYS"
      - "any prior SENT estimate -> SUPERSEDED; billing_status -> ESTIMATE_SENT; RepairOrder.version += 1"
  - method: GET
    path: "/gear-service/repair-orders/{id}/estimates"
    description: "list the estimates of an order (reverse-reachability for RepairEstimate.repair_order_id)"
    roles: [Customer, ServiceAgent, ProgramAdmin]
    code: 200
    input: ["status?", "variant?", "limit?", "offset?"]
    output: RepairEstimate[]
    side_effects: []
  - method: GET
    path: "/gear-service/repair-estimates/{id}"
    description: "read one estimate with its full price breakdown"
    roles: [Customer, ServiceAgent, ProgramAdmin]
    code: 200
    input: []
    output: RepairEstimate
    side_effects: []
  - method: POST
    path: "/gear-service/repair-estimates/{id}/approve"
    description: "customer approves a paid-repair quote"
    roles: [Customer]
    code: 200
    input: []
    output: RepairEstimate
    side_effects: ["status -> APPROVED, decided_at stamped", "RepairOrder.billing_status -> ESTIMATE_APPROVED, provisional_estimate_total_cents stamped (bench work is now unlocked)"]
  - method: POST
    path: "/gear-service/repair-estimates/{id}/decline"
    description: "customer declines a paid-repair quote"
    roles: [Customer]
    code: 200
    input: ["decline_reason?"]
    output: RepairEstimate
    side_effects: ["status -> DECLINED", "RepairOrder -> work_status CLOSED_UNREPAIRED / billing_status ESTIMATE_DECLINED with the full parts-release and work-block-cancel cascade", "GearItem -> RETURNED, WarrantyClaim -> CLOSED_DECLINED"]
  - method: POST
    path: "/gear-service/repair-orders/{id}/bench-complete"
    description: "close out the logged bench work for this order; work_log is a non-empty array of { work_block_id, actual_minutes } with actual_minutes 1..600"
    roles: [RepairTechnician]
    code: 200
    input: [work_log]
    output: RepairOrder
    side_effects: ["each listed WorkBlock -> COMPLETED with actual_minutes", "Technician.scheduled_minutes_open decremented and completed_minutes incremented", "work_status -> BENCH_DONE"]
  - method: POST
    path: "/gear-service/repair-orders/{id}/qc-inspections"
    description: "sign the QC inspection; a third failure auto-condemns the unit"
    roles: [RepairTechnician]
    code: 200
    input: ["outcome", "notes?"]
    output: RepairOrder
    side_effects:
      - "PASS: work_status -> QC_PASSED"
      - "FAIL with qc_fail_count < 2: qc_fail_count += 1, work_status -> IN_WORK (rework)"
      - "FAIL with qc_fail_count == 2: qc_fail_count = 3, work_status -> IRREPARABLE plus the full irreparable cascade (parts released, blocks cancelled, liability revalued to REPLACEMENT, item -> IRREPARABLE_HOLD, GearModel.irreparable_count += 1 and repairability_flag re-derived)"
  - method: POST
    path: "/gear-service/repair-orders/{id}/close-irreparable"
    description: "condemn the unit mid-repair"
    roles: [ServiceAgent, RepairTechnician]
    code: 200
    input: [reason]
    output: RepairOrder
    side_effects:
      - "work_status -> IRREPARABLE"
      - "CASCADE: RESERVED PartsReservation rows -> RELEASED -> PartLot.reserved_units/available_units/status -> GearModel.parts_support_status"
      - "SCHEDULED WorkBlock rows -> CANCELLED with the technician-minute give-back"
      - "warranty orders: REPAIR LiabilityEntry -> RELEASED (REVALUED_TO_REPLACEMENT) and a REPLACEMENT entry opened; ServiceCenter.open_liability_cents and liability_posture recomputed"
      - "GearItem -> IRREPARABLE_HOLD; GearModel.irreparable_count += 1 and repairability_flag re-derived"
  - method: POST
    path: "/gear-service/repair-orders/{id}/invoice"
    description: "mint the FINAL invoice from logged minutes and consumed parts"
    roles: [ServiceAgent]
    code: 201
    input: []
    output: RepairEstimate
    side_effects: ["creates a RepairEstimate(variant FINAL, status INVOICED) priced by calculations.paid_repair_pricing variant FINAL", "RepairOrder.billing_status -> INVOICED, final_invoice_total_cents stamped"]
  - method: POST
    path: "/gear-service/repair-orders/{id}/payments"
    description: "settle the invoice in full"
    roles: [Customer, ServiceAgent]
    code: 200
    input: [amount_cents]
    output: RepairOrder
    side_effects: ["paid_amount_cents += amount_cents, billing_status -> PAID, the FINAL RepairEstimate -> PAID"]
  - method: POST
    path: "/gear-service/repair-orders/{id}/release-to-customer"
    description: "hand the repaired unit back and close the claim"
    roles: [ServiceAgent]
    code: 200
    input: []
    output: RepairOrder
    side_effects:
      - "work_status -> RELEASED, released_at stamped"
      - "GearItem -> RETURNED; WarrantyClaim -> CLOSED_FULFILLED"
      - "warranty orders: the OPEN REPAIR LiabilityEntry -> RELEASED (ORDER_RELEASED) -> ServiceCenter.open_liability_cents -> liability_posture"
      - "ServiceCenter.active_queue_depth recomputed"

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================

errors:
  # -- authentication / authorization
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent or blank"
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of Customer, ServiceAgent, RepairTechnician, PartsCoordinator, ProgramAdmin"
  - id: ERR_UNKNOWN_ACTOR
    http: 401
    condition: "X-User-ID of an entity_backed role does not resolve to an existing Customer (Customer) or Technician (RepairTechnician)"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the role is not listed in the endpoint's §1.5 roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Customer addresses a claim, item, order or estimate whose gear item is owned by a different customer"
  # -- existence
  - id: ERR_SERVICE_CENTER_NOT_FOUND
    http: 404
    condition: "service center id in path or body does not exist"
  - id: ERR_GEAR_MODEL_NOT_FOUND
    http: 404
    condition: "gear model id in path or body (including successor_model_id) does not exist"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer id in path or owner_customer_id does not exist"
  - id: ERR_GEAR_ITEM_NOT_FOUND
    http: 404
    condition: "gear item id in path or body does not exist"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "warranty claim id in path or body does not exist"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "claim assessment id in path does not exist"
  - id: ERR_TECHNICIAN_NOT_FOUND
    http: 404
    condition: "technician id in path or body does not exist"
  - id: ERR_REPAIR_ORDER_NOT_FOUND
    http: 404
    condition: "repair order id in path or body does not exist"
  - id: ERR_ESTIMATE_NOT_FOUND
    http: 404
    condition: "repair estimate id in path does not exist"
  - id: ERR_PART_LOT_NOT_FOUND
    http: 404
    condition: "part lot id in path or body does not exist"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "parts reservation id in path does not exist"
  - id: ERR_WORK_BLOCK_NOT_FOUND
    http: 404
    condition: "work block id in path or inside bench-complete work_log does not exist"
  # -- request shape
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong type, unknown enum member, out-of-range number, unparseable timestamp, or malformed certifications/labor_lines/work_log array"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside 1..100 or negative offset"
  # -- state
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "the claim's status is not a legal from-state for the requested transition"
  - id: ERR_INVALID_WORK_STATE
    http: 409
    condition: "the repair order's work_status is not a legal from-state for the requested transition"
  - id: ERR_INVALID_BILLING_STATE
    http: 409
    condition: "the repair order's billing_status forbids the operation (estimate on a NOT_BILLABLE warranty order, bench work while a quote is still pending or sent, payment before invoicing)"
  - id: ERR_INVALID_ESTIMATE_STATE
    http: 409
    condition: "approve/decline attempted on an estimate whose status is not SENT"
  - id: ERR_RESERVATION_NOT_RESERVED
    http: 409
    condition: "release/consume attempted on a reservation that is already CONSUMED or RELEASED"
  - id: ERR_INVALID_DISPOSITION_STATE
    http: 409
    condition: "the requested resale-channel hop is not legal from the item's current disposition_status"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the addressed claim, repair order or gear item is already in a terminal state of the dimension the call would move"
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version does not match WarrantyClaim.version"
  - id: ERR_STALE_REPAIR_ORDER_VERSION
    http: 412
    condition: "expected_repair_order_version does not match RepairOrder.version"
  # -- business safety
  - id: ERR_TECHNICIAN_NOT_ACTIVE
    http: 422
    condition: "the acting or named technician has status ON_LEAVE or INACTIVE"
  - id: ERR_TECHNICIAN_NOT_CERTIFIED
    http: 403
    condition: "the technician lacks a certification at WORK_TYPE_MIN_LEVEL for a requested work type"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the technician signing QC authored an assessment on the same claim"
  - id: ERR_CENTER_LIABILITY_FROZEN
    http: 409
    condition: "a warranty repair or replacement decision is attempted while the center's liability_posture is FROZEN"
  - id: ERR_REPLACEMENT_REQUIRES_OVERRIDE
    http: 403
    condition: "a WARRANTY_REPLACE outcome is reached under CONSTRAINED posture by a non-ProgramAdmin actor"
  # -- business referential
  - id: ERR_TECHNICIAN_CENTER_MISMATCH
    http: 422
    condition: "the technician belongs to a different service center than the claim or repair order"
  - id: ERR_PART_MODEL_MISMATCH
    http: 422
    condition: "the part lot belongs to neither the order's gear model nor its successor model"
  - id: ERR_SUBSTITUTION_NOT_PERMITTED
    http: 422
    condition: "a substitution draw is attempted on a lot that does not allow substitution, does not name the required part code, or has a different part_kind"
  - id: ERR_WORK_BLOCK_NOT_ON_ORDER
    http: 422
    condition: "a work_log entry references a block belonging to another order or not in status SCHEDULED"
  - id: ERR_SUCCESSOR_CYCLE
    http: 422
    condition: "successor_model_id points at the model itself or closes a cycle in the successor chain"
  # -- business temporal
  - id: ERR_PURCHASE_DATE_IN_FUTURE
    http: 422
    condition: "purchase_date is after the logical clock date"
  - id: ERR_WARRANTY_EXPIRED
    http: 422
    condition: "a WARRANTY_CLAIM intake is submitted for a unit whose warranty_state is EXPIRED"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "work block start_at >= end_at, or surge window start_date > end_date"
  - id: ERR_SURGE_WINDOW_OVERLAP
    http: 409
    condition: "a new ACTIVE surge window shares at least one date (inclusive) with an existing ACTIVE window of the same center"
  - id: ERR_TECHNICIAN_WINDOW_CONFLICT
    http: 409
    condition: "the named technician already has a SCHEDULED block overlapping the requested half-open interval"
  - id: ERR_ESTIMATE_EXPIRED
    http: 409
    condition: "approval attempted after the estimate's valid_until"
  # -- business constraint
  - id: ERR_PROOF_OF_PURCHASE_MISSING
    http: 422
    condition: "a WARRANTY_CLAIM intake is submitted while the unit has no verifiable proof of purchase"
  - id: ERR_INFO_REQUEST_LIMIT
    http: 409
    condition: "a third information request is attempted on the same claim"
  - id: ERR_ASSESSMENT_INCONCLUSIVE
    http: 409
    condition: "decision attempted while the newest non-superseded assessment determination is INCONCLUSIVE"
  - id: ERR_ORDER_ALREADY_OPEN
    http: 409
    condition: "the claim already has a non-terminal repair order, or its decision is not one that authorizes an order"
  - id: ERR_ESTIMATE_ALREADY_APPROVED
    http: 409
    condition: "a re-quote is attempted after an estimate on the order has been approved"
  - id: ERR_BENCH_CAPACITY_EXCEEDED
    http: 409
    condition: "the center already has bench_capacity_blocks_per_day SCHEDULED blocks on the requested UTC date"
  - id: ERR_INVALID_UNITS
    http: 422
    condition: "reservation units < 1, or adjustment delta_units == 0"
  - id: ERR_INSUFFICIENT_PART_UNITS
    http: 409
    condition: "requested units exceed the lot's available_units"
  - id: ERR_INSUFFICIENT_STOCK_ADJUSTMENT
    http: 422
    condition: "a negative adjustment would push on_hand_units below reserved_units"
  - id: ERR_MODEL_CODE_TAKEN
    http: 409
    condition: "model_code already exists"
  - id: ERR_EMAIL_TAKEN
    http: 409
    condition: "customer email already exists"
  - id: ERR_EMPLOYEE_CODE_TAKEN
    http: 409
    condition: "technician employee_code already exists"
  - id: ERR_SERIAL_ALREADY_REGISTERED
    http: 409
    condition: "serial_number already registered for that gear model"
  - id: ERR_PART_CODE_TAKEN
    http: 409
    condition: "part_code already exists for that gear model"
  - id: ERR_WORK_TYPES_INCOMPLETE
    http: 409
    condition: "bench-complete leaves a required work type with no COMPLETED work block"
  - id: ERR_PARTS_NOT_SETTLED
    http: 409
    condition: "QC signed while a reservation on the order is still RESERVED"
  - id: ERR_NO_ELIGIBLE_TECHNICIAN
    http: 422
    condition: "the routing selector's candidate pool is empty for the requested work type and window"
  - id: ERR_ITEM_NOT_IRREPARABLE
    http: 409
    condition: "trade-in attempted on an item whose disposition_status is not IRREPARABLE_HOLD"
  # -- business fiscal
  - id: ERR_ESTIMATE_NOT_APPROVED
    http: 402
    condition: "invoice attempted while billing_status != ESTIMATE_APPROVED: a paid order with no APPROVED estimate, or a NOT_BILLABLE warranty order"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 402
    condition: "amount_cents does not settle the outstanding balance exactly"
  - id: ERR_BALANCE_OUTSTANDING
    http: 402
    condition: "release attempted on a paid order whose billing_status is not PAID"

# ============================================================================
# §1.7 RBAC Matrix  (segregation_of_duties)
# ============================================================================

roles:
  - name: Customer
    description: "gear owner: registers units, files claims, answers information requests, approves or declines paid-repair quotes, pays invoices and trades in condemned gear"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /gear-service/repair-estimates/{id}/approve"
      - "POST /gear-service/repair-estimates/{id}/decline"
    shared_operations:
      - "POST /gear-service/gear-items (with ServiceAgent)"
      - "POST /gear-service/warranty-claims (with ServiceAgent)"
      - "POST /gear-service/warranty-claims/{id}/submit (with ServiceAgent)"
      - "POST /gear-service/warranty-claims/{id}/resubmit (with ServiceAgent)"
      - "POST /gear-service/gear-items/{id}/trade-in (with ServiceAgent)"
      - "POST /gear-service/repair-orders/{id}/payments (with ServiceAgent)"
      - "read endpoints for own customer record, own units, own claims, own orders and own estimates"
  - name: ServiceAgent
    description: "front-of-house service writer: runs intake, requests documentation, adjudicates claims, opens repair orders, quotes and invoices paid work, releases finished gear"
    identity: opaque
    exclusive_operations:
      - "POST /gear-service/warranty-claims/{id}/info-requests"
      - "POST /gear-service/repair-orders"
      - "POST /gear-service/repair-orders/{id}/estimates"
      - "POST /gear-service/repair-orders/{id}/invoice"
      - "POST /gear-service/repair-orders/{id}/release-to-customer"
    shared_operations:
      - "POST /gear-service/customers (with ProgramAdmin)"
      - "POST /gear-service/gear-items, /warranty-claims, /submit, /resubmit, /trade-in, /payments (with Customer)"
      - "POST /gear-service/warranty-claims/{id}/decision (with ProgramAdmin)"
      - "POST /gear-service/work-blocks and /work-blocks/{id}/cancel (with RepairTechnician)"
      - "POST /gear-service/repair-orders/{id}/close-irreparable (with RepairTechnician)"
  - name: RepairTechnician
    description: "bench technician: authors defect-versus-wear assessments, works scheduled blocks, consumes parts, signs QC on work they did not assess, condemns unrepairable gear"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /gear-service/warranty-claims/{id}/assessments"
      - "POST /gear-service/repair-orders/{id}/bench-complete"
      - "POST /gear-service/repair-orders/{id}/qc-inspections"
      - "POST /gear-service/parts-reservations/{id}/consume"
    shared_operations:
      - "POST /gear-service/work-blocks and /work-blocks/{id}/cancel (with ServiceAgent)"
      - "POST /gear-service/repair-orders/{id}/parts-reservations (with PartsCoordinator)"
      - "POST /gear-service/repair-orders/{id}/close-irreparable (with ServiceAgent)"
    segregation_note: "the same X-User-ID MUST NOT both author a ClaimAssessment on a claim and sign the QC inspection of that claim's repair order (validations[priority=22])"
  - name: PartsCoordinator
    description: "stockroom owner: stocks and adjusts part lots, sets substitution policy, releases reservations, drives traded-in gear through the refurbished resale channel"
    identity: opaque
    exclusive_operations:
      - "POST /gear-service/part-lots"
      - "POST /gear-service/part-lots/{id}/adjustments"
      - "POST /gear-service/parts-reservations/{id}/release"
    shared_operations:
      - "POST /gear-service/repair-orders/{id}/parts-reservations (with RepairTechnician)"
      - "POST /gear-service/gear-items/{id}/disposition (with ProgramAdmin)"
  - name: ProgramAdmin
    description: "warranty program owner: configures centers, catalog, technicians and surge windows, runs the queue-review checkpoint, sets the logical clock, and is the only role that may authorize a replacement under CONSTRAINED liability posture"
    identity: opaque
    exclusive_operations:
      - "POST /gear-service/service-centers"
      - "POST /gear-service/service-centers/{id}/surge-windows"
      - "POST /gear-service/service-centers/{id}/queue-review"
      - "POST /gear-service/gear-models and PATCH /gear-service/gear-models/{id}"
      - "POST /gear-service/technicians and PATCH /gear-service/technicians/{id}"
      - "POST /gear-service/_clock/set_current_utc"
      - "POST /gear-service/warranty-claims/{id}/decision resolving to WARRANTY_REPLACE while liability_posture == CONSTRAINED"
    shared_operations:
      - "POST /gear-service/customers (with ServiceAgent)"
      - "POST /gear-service/warranty-claims/{id}/decision (with ServiceAgent, outside the CONSTRAINED replacement case)"
      - "POST /gear-service/part-lots and /part-lots/{id}/adjustments (with PartsCoordinator)"
      - "POST /gear-service/gear-items/{id}/disposition (with PartsCoordinator)"
