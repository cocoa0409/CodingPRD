  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: contract_rate_half_open_overlap_rejected
        grounds:
          - validations[priority=21]
          - errors[ERR_CONTRACT_WINDOW_OVERLAP]
          - state_machines.ContractRate.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          ContractRate uses HALF-OPEN interval [effective_from_utc,
          effective_until_utc); adjacency (one's until == other's from) is NOT
          an overlap. Two contracts on same (shipper, lane): first
          [2026-01-01, 2026-07-01) ACTIVE; second [2026-06-15, 2026-12-31) —
          windows overlap during [2026-06-15, 2026-07-01) so the second
          activate is rejected. Resource entity: ContractRate.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. Shipper s1 ACTIVE. ContractRate cr_a ACTIVE [2026-01-01,2026-07-01). ContractRate cr_b DRAFT [2026-06-15,2026-12-31)."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Oscar Shippers", billing_email: "ap@oscar.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s1_id: $.data.id }
            - call: "POST /freight/contract-rates"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", rate_per_mile_cents: 250, fuel_surcharge_per_mile_cents: 60, detention_free_minutes: 120, detention_rate_per_hour_cents: 7500, effective_from_utc: "2026-01-01T00:00:00Z", effective_until_utc: "2026-07-01T00:00:00Z" }
              as: BrokerOps
              captures: { cr_a_id: $.data.id, cr_a_v: $.data.version }
            - call: "POST /freight/contract-rates/${cr_a_id}/activate"
              payload: { expected_contract_rate_version: "${cr_a_v}" }
              as: BrokerOps
            - call: "POST /freight/contract-rates"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", rate_per_mile_cents: 260, fuel_surcharge_per_mile_cents: 65, detention_free_minutes: 120, detention_rate_per_hour_cents: 7500, effective_from_utc: "2026-06-15T00:00:00Z", effective_until_utc: "2026-12-31T00:00:00Z" }
              as: BrokerOps
              captures: { cr_b_id: $.data.id, cr_b_v: $.data.version }
          trigger:
            - call: "POST /freight/contract-rates/${cr_b_id}/activate"
              payload: { expected_contract_rate_version: "${cr_b_v}" }
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == 'ERR_CONTRACT_WINDOW_OVERLAP'"
            - "ContractRate.${cr_b_id}.status == 'DRAFT'"

      - name: quote_window_buffered_overlap_rejected
        grounds:
          - validations[priority=22]
          - errors[ERR_QUOTE_WINDOW_OVERLAP]
          - entities.QuoteRequest.fields.pickup_window_start_utc
        distinguishing_aspect: |
          QuoteRequest uses a BUFFERED pickup window [start - 120min, end). The
          buffer makes adjacency at the buffered edge an overlap (closed
          boundary on left side post-buffer expansion) — different interval
          semantics from instance 1's pure half-open contract window.
          Existing OPEN quote on lane with pickup_window
          [2026-06-15T10:00, 2026-06-15T20:00). A new quote on same lane with
          start=2026-06-15T11:00 falls inside the buffered window of the first
          and is rejected. Resource entity: QuoteRequest (different from
          ContractRate in instance 1).
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. Shipper s1 ACTIVE. One OPEN quote on lane 10001->30303 with pickup_window [2026-06-15T10:00:00Z, 2026-06-15T20:00:00Z)."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Papa Shippers", billing_email: "ap@papa.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s1_id: $.data.id }
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-15T10:00:00Z", pickup_window_end_utc: "2026-06-15T20:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q1_id: $.data.id }
          trigger:
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-15T11:00:00Z", pickup_window_end_utc: "2026-06-15T21:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == 'ERR_QUOTE_WINDOW_OVERLAP'"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:

      - name: shipper_open_ar_conserved_across_dispute_withdraw_roundtrip
        grounds:
          - calculations.shipper_open_ar_invariant
          - state_machines.DisputeClaim.OPEN_to_WITHDRAWN
          - entities.Shipper.fields.open_ar_cents
        distinguishing_aspect: |
          Conserved quantity: Shipper.open_ar_cents == sum over open invoices
          of (total_cents - amount_paid_cents). Forward action: POST
          /dispute-claims opens a claim (Invoice -> DISPUTED, total_cents
          unchanged); compensating action: POST /dispute-claims/{id}/withdraw
          reverts Invoice to its pre-DISPUTED state without touching
          total_cents or amount_paid_cents. The named global quantity
          Shipper.open_ar_cents MUST equal its pre-forward value after the
          compensating action.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. Shipper, carrier QUALIFIED, contract active (200 + 50 = 250 c/mi total). Load delivered+invoiced. Invoice.total_cents=100000 (250 c/mi x 400 mi). Shipper.open_ar_cents=100000 pre-forward."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Quebec Shippers", billing_email: "ap@quebec.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s1_id: $.data.id }
            - call: "POST /freight/carriers"
              payload: { legal_name: "Quebec Carrier", mc_number: "1414141", usdot_number: "14141414", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c1_id: $.data.id }
            - call: "POST /freight/carriers/${c1_id}/qualify"
              payload: {}
              as: BrokerOps
            - call: "POST /freight/contract-rates"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", rate_per_mile_cents: 200, fuel_surcharge_per_mile_cents: 50, detention_free_minutes: 120, detention_rate_per_hour_cents: 7500, effective_from_utc: "2026-01-01T00:00:00Z", effective_until_utc: "2027-01-01T00:00:00Z" }
              as: BrokerOps
              captures: { cr_id: $.data.id, cr_v: $.data.version }
            - call: "POST /freight/contract-rates/${cr_id}/activate"
              payload: { expected_contract_rate_version: "${cr_v}" }
              as: BrokerOps
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-10T08:00:00Z", pickup_window_end_utc: "2026-06-10T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q_id: $.data.id, q_v: $.data.version }
            - call: "POST /freight/quote-requests/${q_id}/award"
              payload: { carrier_id: "${c1_id}", expected_quote_request_version: "${q_v}" }
              as: BrokerOps
              captures: { ld_id: $.data.id }
            - call: "POST /freight/loads/${ld_id}/pickup"
              payload: { actual_pickup_at_utc: "2026-06-10T09:00:00Z" }
              as: Carrier
              as_user_id: "${c1_id}"
            - call: "POST /freight/loads/${ld_id}/deliver"
              payload: { actual_delivery_at_utc: "2026-06-11T09:00:00Z" }
              as: Carrier
              as_user_id: "${c1_id}"
            - call: "POST /freight/loads/${ld_id}/invoice"
              payload: {}
              as: BrokerOps
              captures: { inv_id: $.data.id, inv_total_pre: $.data.total_cents }
            - call: "POST /freight/dispute-claims"
              payload: { invoice_id: "${inv_id}", claim_type: "OVERCHARGE", claimed_amount_cents: 5000 }
              as: Shipper
              as_user_id: "${s1_id}"
              captures: { dc_id: $.data.id }
          trigger:
            - call: "POST /freight/dispute-claims/${dc_id}/withdraw"
              payload: {}
              as: Shipper
              as_user_id: "${s1_id}"
            - call: "GET /freight/shippers/${s1_id}"
              payload: {}
              as: BrokerOps
              captures: { s1_open_ar_post: $.data.open_ar_cents }
          assert:
            - "Shipper.${s1_id}.open_ar_cents == 100000"
            - "Invoice.${inv_id}.status == 'ISSUED'"
            - "Invoice.${inv_id}.total_cents == 100000"
            - "DisputeClaim.${dc_id}.status == 'WITHDRAWN'"

      - name: load_accessorial_total_conserved_across_partial_dispute_resolution
        grounds:
          - calculations.load_accessorial_total_invariant
          - entities.Load.fields.accessorial_total_cents
          - state_machines.Invoice.DISPUTED_to_ISSUED
        distinguishing_aspect: |
          Conserved quantity: Load.accessorial_total_cents == sum of
          Accessorial.amount_cents for that load. Different conserved quantity
          from instance 1's Shipper.open_ar_cents (line-item aggregate vs
          shipper-level AR). Forward action: add an Accessorial LUMPER 5000.
          Compensating: open + resolve PARTIAL dispute reducing Invoice
          total by exactly 5000. The invariant
          Load.accessorial_total_cents holds at 5000 BOTH before and after the
          compensating dispute partial resolution — the dispute moves money
          off Invoice.total_cents WITHOUT mutating Load.accessorial_total_cents.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. Shipper, carrier QUALIFIED, contract active. Load delivered. Accessorial LUMPER 5000 attached to Load. Load.accessorial_total_cents=5000 pre-forward. Invoice generated with total_cents=100000 (250 c/mi x 400 mi) + 0 detention + 5000 accessorial = 105000."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
