        distinguishing_aspect: "H1_EXTREME with 100/100 scores and 300 affected acres clips acre_points at ACRE_POINTS_CAP 15 (not 15.00 from 300*0.05 uncapped) and then clips the 115.00 total at SCORE_CAP 100.00."
        test_recipe:
          setup:
            - "One ABANDONED_LEGACY MineSite awaiting nomination."
          setup_api_calls:
            - call: "POST /mining/mine-sites"
              payload: { name: "Sulphur Gulch Legacy Workings", county: "Fremont", total_acres: 900.00, site_class: "ABANDONED_LEGACY" }
