scenario: |
  Team Travel & Charter Logistics (pro team travel department): trip build
  (flight/hotel/ground) around schedule & rest rules, charter contracting &
  manifest management, hotel block & room assignment rules, meal/per-diem
  administration, equipment & baggage transport coordination, weather/delay
  contingency & rebooking, credential/security coordination at venues, cost
  tracking vs travel budget.

domain_name: team-travel-charter
api_prefix: /travel

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: Team
    parent: null
    common_fields: true
    fields:
      - { name: team_code, type: string, source: input, description: "Unique league team code (e.g. POR, SEA)", constraints: "unique across all teams" }
      - { name: display_name, type: string, source: input, description: "Human-readable team name" }
      - { name: league_rest_policy, type: enum, source: input, description: "STANDARD | STRINGENT — baseline rest rules", default: STANDARD }
      - { name: active_season_id, type: string, source: system, description: "FK -> Season.id; pointer to currently open season; null until first season opened" }

  - name: Season
    parent: Team
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id; owning team" }
      - { name: label, type: string, source: input, description: "Season label e.g. 2026-27" }
      - { name: travel_budget_cents, type: integer, source: input, description: "Total travel budget in cents for the season" }
      - { name: committed_cost_cents, type: integer, source: computed, description: "Sum of locked-in costs across trips in non-cancelled states; starts at 0" }
      - { name: projected_cost_cents, type: integer, source: computed, description: "Sum of committed + provisional estimates across all open trips; starts at 0" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED", constraints: "OPEN | CLOSED" }

  - name: Trip
    parent: Team
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id" }
      - { name: season_id, type: string, source: system, description: "FK -> Season.id" }
      - { name: destination_code, type: string, source: input, description: "IATA airport code for the destination city" }
      - { name: game_tipoff_utc, type: datetime, source: input, description: "Scheduled game start time UTC" }
      - { name: return_arrival_utc, type: datetime, source: input, description: "Planned arrival back at home base UTC" }
      - { name: party_size, type: integer, source: computed, description: "Count of TravelPartyMember rows with status IN for this trip" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Provisional forward-looking cost rollup; recomputed on every booking change" }
      - { name: actual_cost_cents, type: integer, source: computed, description: "Chronological ledger rollup populated at trip close" }
      - { name: posture, type: enum, source: system, description: "Derived from children: DRAFT | LOCKED | DISRUPTED | IN_FLIGHT | RECOVERING | CLOSED | CANCELLED" }
      - { name: disruption_seq, type: integer, source: system, description: "Monotonic counter incremented by every ContingencyEvent; used as rebooking order key", default: 0 }

  - name: TravelPartyMember
    parent: Trip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id" }
      - { name: member_ref, type: string, source: input, description: "Roster identifier (player/staff)" }
      - { name: party_role, type: enum, source: input, description: "PLAYER | COACH | STAFF | MEDICAL | SECURITY | EQUIPMENT | EXECUTIVE" }
      - { name: travel_class, type: enum, source: input, description: "CHARTER_FIRST | CHARTER_STANDARD | COMMERCIAL_PREMIUM | COMMERCIAL_COACH" }
      - { name: per_diem_tier, type: enum, source: input, description: "TIER_A | TIER_B | TIER_C" }
      - { name: requires_single_room, type: boolean, source: input, description: "True => never assigned a roommate", default: false }
      - { name: requires_ground_transport, type: boolean, source: input, description: "True => must be counted on ground leg capacity", default: true }
      - { name: status, type: enum, source: system, description: "IN | OUT | SCRATCHED — IN members count toward manifests, hotel, per-diem" }
      - { name: weight_class, type: enum, source: computed, description: "LIGHT | HEAVY — derived from party_role for equipment-weight chargeback" }

  - name: CharterContract
    parent: Trip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id" }
      - { name: vendor_code, type: string, source: input, description: "Charter vendor identifier" }
      - { name: base_price_cents, type: integer, source: input, description: "Contracted base price" }
      - { name: fuel_surcharge_cap_cents, type: integer, source: input, description: "Maximum fuel surcharge the vendor may bill" }
      - { name: seat_capacity, type: integer, source: input, description: "Total passenger seats on the contracted aircraft" }
      - { name: cargo_capacity_lb, type: integer, source: input, description: "Cargo/baggage capacity in pounds" }
      - { name: penalty_bands, type: array, source: input, description: "Cancellation penalty bands: [{days_before, penalty_pct}] sorted by days_before DESC" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | VENDOR_COUNTERSIGNED | TEAM_EXECUTED | ACTIVE | CANCELLED | EXPIRED" }
      - { name: executed_at, type: datetime, source: system, description: "Timestamp when status reached TEAM_EXECUTED" }
      - { name: cancelled_at, type: datetime, source: system, description: "Timestamp when status reached CANCELLED" }
      - { name: cancellation_penalty_cents, type: integer, source: computed, description: "Penalty computed at cancel time from penalty_bands" }

  - name: FlightLeg
    parent: Trip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id" }
      - { name: leg_seq, type: integer, source: input, description: "Sequence number of this leg within the trip (1 = outbound)" }
      - { name: origin_code, type: string, source: input, description: "IATA origin airport" }
      - { name: destination_code, type: string, source: input, description: "IATA destination airport" }
      - { name: scheduled_depart_utc, type: datetime, source: input, description: "Planned departure" }
      - { name: scheduled_arrive_utc, type: datetime, source: input, description: "Planned arrival" }
      - { name: is_charter, type: boolean, source: input, description: "True if on charter contract, false if commercial" }
      - { name: contract_id, type: string, source: input, description: "FK -> CharterContract.id; required iff is_charter" }
      - { name: status, type: enum, source: system, description: "PLANNED | BOOKED | DELAYED | REBOOKING | DEPARTED | ARRIVED | CANCELLED" }
      - { name: actual_depart_utc, type: datetime, source: system, description: "Populated on DEPARTED" }
      - { name: actual_arrive_utc, type: datetime, source: system, description: "Populated on ARRIVED" }
      - { name: delay_minutes, type: integer, source: computed, description: "actual_arrive - scheduled_arrive in minutes (0 until ARRIVED)" }
      - { name: rebook_generation, type: integer, source: system, description: "Increments every time this leg is rebooked; used to tie-break manifest reconciliation", default: 0 }

  - name: ManifestEntry
    parent: FlightLeg
    common_fields: true
    fields:
      - { name: flight_leg_id, type: string, source: system, description: "FK -> FlightLeg.id" }
      - { name: member_id, type: string, source: system, description: "FK -> TravelPartyMember.id" }
      - { name: seat_assignment, type: string, source: input, description: "Seat label e.g. 1A; NULL allowed for commercial unticketed" }
      - { name: is_ticketed, type: boolean, source: system, description: "True when seat confirmed by vendor" }
      - { name: status, type: enum, source: system, description: "PENDING | CONFIRMED | BUMPED | NO_SHOW | FLOWN" }
      - { name: bump_reason, type: enum, source: system, description: "OVERBOOK | WEIGHT_BALANCE | SECURITY_DENIAL | MEDICAL_SCRATCH — set when status becomes BUMPED" }

  - name: HotelBlock
    parent: Trip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id" }
      - { name: hotel_code, type: string, source: input, description: "Property identifier" }
      - { name: room_count, type: integer, source: input, description: "Total rooms contracted" }
      - { name: rate_cents_per_night, type: integer, source: input, description: "Nightly rate per room" }
      - { name: check_in_date, type: string, source: input, description: "ISO date of first night" }
      - { name: night_count, type: integer, source: input, description: "Number of consecutive nights" }
      - { name: cutoff_date, type: string, source: input, description: "ISO date; last day room names may be submitted to hotel" }
      - { name: rooms_released, type: integer, source: system, description: "Rooms returned to hotel inventory; starts at 0" }
      - { name: posture, type: enum, source: system, description: "HOLDING | NAME_LIST_DUE | LOCKED | ATTRITION_EXPOSED | CLOSED" }
      - { name: attrition_allowance_pct, type: integer, source: input, description: "Allowed slippage percentage; beyond this triggers penalty", default: 10 }

  - name: RoomAssignment
    parent: HotelBlock
    common_fields: true
    fields:
      - { name: hotel_block_id, type: string, source: system, description: "FK -> HotelBlock.id" }
      - { name: member_id, type: string, source: system, description: "FK -> TravelPartyMember.id" }
      - { name: roommate_member_id, type: string, source: input, description: "FK -> TravelPartyMember.id; NULL for singles" }
      - { name: room_label, type: string, source: input, description: "Room number / suite label" }
      - { name: smoking_pref, type: boolean, source: input, description: "Smoking room requested", default: false }
      - { name: status, type: enum, source: system, description: "RESERVED | CONFIRMED | CHECKED_IN | CHECKED_OUT | CANCELLED" }
      - { name: confirmed_at, type: datetime, source: system, description: "When status moved to CONFIRMED" }

  - name: PerDiemLedger
    parent: TravelPartyMember
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> TravelPartyMember.id" }
      - { name: service_date, type: string, source: input, description: "ISO date this ledger row covers" }
      - { name: day_kind, type: enum, source: input, description: "TRAVEL_DAY | GAME_DAY | OFF_DAY | PARTIAL_DAY" }
      - { name: meals_provided_count, type: integer, source: input, description: "Number of team-provided meals that day (reduces per-diem)", default: 0 }
      - { name: base_amount_cents, type: integer, source: computed, description: "Tier rate for the day_kind" }
      - { name: deduction_cents, type: integer, source: computed, description: "Deduction from meals_provided_count" }
      - { name: net_amount_cents, type: integer, source: computed, description: "base_amount_cents - deduction_cents, floored at 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | PAID | DISPUTED | ADJUSTED" }
      - { name: paid_at, type: datetime, source: system, description: "Timestamp of payment" }

  - name: EquipmentShipment
    parent: Trip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id" }
      - { name: shipment_kind, type: enum, source: input, description: "TEAM_GEAR | MEDICAL | BROADCAST | PERSONAL_BAGGAGE" }
      - { name: gross_weight_lb, type: integer, source: input, description: "Total shipment weight" }
      - { name: piece_count, type: integer, source: input, description: "Number of crates/bags" }
      - { name: declared_value_cents, type: integer, source: input, description: "Insurance declared value" }
      - { name: assigned_contract_id, type: string, source: system, description: "FK -> CharterContract.id; the charter carrying this shipment, null for ground-only" }
      - { name: status, type: enum, source: system, description: "STAGED | LOADED | IN_TRANSIT | DELIVERED | DELAYED | LOST" }
      - { name: chargeback_cents, type: integer, source: computed, description: "Weight-overage chargeback owed to team travel budget" }

  - name: ContingencyEvent
    parent: Trip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id" }
      - { name: kind, type: enum, source: input, description: "WEATHER | MECHANICAL | ATC_DELAY | VENUE_CHANGE | SECURITY_INCIDENT" }
      - { name: detected_at, type: datetime, source: input, description: "When ops first observed the event" }
      - { name: affected_leg_id, type: string, source: input, description: "FK -> FlightLeg.id" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: status, type: enum, source: system, description: "OPEN | MITIGATING | RESOLVED | CLOSED" }
      - { name: resolution_action, type: enum, source: system, description: "REBOOK | REROUTE | OVERNIGHT | CANCEL_TRIP | NONE" }
      - { name: recovery_cost_cents, type: integer, source: computed, description: "Cost of rebooking/hotels incurred resolving this event" }

  - name: CredentialRequest
    parent: Trip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id" }
      - { name: member_id, type: string, source: system, description: "FK -> TravelPartyMember.id" }
      - { name: venue_code, type: string, source: input, description: "Venue identifier" }
      - { name: access_level, type: enum, source: input, description: "FIELD | LOCKER_ROOM | PRESS | BACK_OF_HOUSE | ALL_ACCESS" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of submitter; SoD anchor" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of reviewer; must differ from submitted_by_user_id" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver; must differ from both submitter and reviewer" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SECURITY_REVIEW | APPROVED | DENIED | REVOKED" }
      - { name: denial_reason, type: string, source: system, description: "Required iff status = DENIED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /travel/teams/{teamId}/seasons/{seasonId}/close"
        actor: TravelFinanceLead
        preconditions:
          - "All Trips in season have posture in {CLOSED, CANCELLED}"
          - "projected_cost_cents == committed_cost_cents (no open estimates)"
        side_effects:
          - "team.active_season_id cleared"
          - "increments Season.version"

  - entity: Trip
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/lock"
        actor: TravelManager
        preconditions:
          - "party_size >= 1"
          - "At least one FlightLeg in status BOOKED for the outbound leg_seq=1"
          - "At least one HotelBlock in posture in {HOLDING, NAME_LIST_DUE, LOCKED}"
          - "estimated_cost_cents <= season remaining budget (travel_budget_cents - committed_cost_cents)"
        side_effects:
          - "season.committed_cost_cents += trip.estimated_cost_cents"
          - "season.projected_cost_cents recomputed"
          - "increments Trip.version and Season.version"

      - from: LOCKED
        to: IN_FLIGHT
        trigger: "system (first FlightLeg transitions to DEPARTED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Trip.version"

      - from: LOCKED
        to: DISRUPTED
        trigger: "system (ContingencyEvent opened on any BOOKED FlightLeg)"
        actor: system
        preconditions: []
        side_effects:
          - "trip.disruption_seq += 1"
          - "affected FlightLeg.status -> REBOOKING"
          - "increments Trip.version"

      - from: DISRUPTED
        to: LOCKED
        trigger: "system (all ContingencyEvents for trip reach RESOLVED or CLOSED and all FlightLegs back to BOOKED)"
        actor: system
        preconditions:
          - "no ContingencyEvent with status in {OPEN, MITIGATING}"
          - "no FlightLeg with status REBOOKING"
        side_effects:
          - "season.projected_cost_cents adjusted by sum of ContingencyEvent.recovery_cost_cents"
          - "increments Trip.version and Season.version"

      - from: DISRUPTED
        to: CANCELLED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/cancel"
        actor: TravelManager
        preconditions:
          - "no FlightLeg has status DEPARTED"
        side_effects:
          - "every CharterContract in {SUBMITTED, VENDOR_COUNTERSIGNED, TEAM_EXECUTED, ACTIVE} -> CANCELLED with cancellation_penalty_cents computed from penalty_bands"
          - "every HotelBlock -> CLOSED, rooms_released = room_count - occupied"
          - "every PerDiemLedger in DRAFT -> ADJUSTED (zero out net_amount_cents)"
          - "season.committed_cost_cents -= (trip.estimated_cost_cents - actual_cost_cents_already_incurred)"
          - "increments Trip.version, Season.version, every cancelled child version"

      - from: IN_FLIGHT
        to: DISRUPTED
        trigger: "system (ContingencyEvent opened mid-flight)"
        actor: system
        preconditions: []
        side_effects:
          - "trip.disruption_seq += 1"

      - from: IN_FLIGHT
        to: RECOVERING
        trigger: "system (last FlightLeg transitions to ARRIVED)"
        actor: system
        preconditions: []
        side_effects:
          - "all ManifestEntries for arrived legs with status CONFIRMED -> FLOWN"

      - from: RECOVERING
        to: CLOSED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/close"
        actor: TravelFinanceLead
        preconditions:
          - "all EquipmentShipments in {DELIVERED, LOST}"
          - "all PerDiemLedgers in {PAID, ADJUSTED}"
          - "all CredentialRequests in {APPROVED, DENIED, REVOKED}"
          - "all ContingencyEvents in {RESOLVED, CLOSED}"
        side_effects:
          - "actual_cost_cents computed via chronological rollup"
          - "season.committed_cost_cents adjusted: replace estimated with actual"
          - "season.projected_cost_cents recomputed"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/cancel"
        actor: TravelManager
        preconditions: []
        side_effects:
          - "no season.committed_cost_cents change (never locked)"

  - entity: CharterContract
    initial_state: DRAFT
    terminal_states: [ACTIVE, CANCELLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/charter-contracts/{contractId}/submit"
        actor: TravelManager
        preconditions:
          - "seat_capacity >= trip.party_size"
          - "penalty_bands non-empty and sorted by days_before DESC"
        side_effects: []

      - from: SUBMITTED
        to: VENDOR_COUNTERSIGNED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/charter-contracts/{contractId}/countersign"
        actor: VendorRep
        preconditions: []
        side_effects: []

      - from: VENDOR_COUNTERSIGNED
        to: TEAM_EXECUTED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/charter-contracts/{contractId}/execute"
        actor: TravelFinanceLead
        preconditions:
          - "trip.posture == DRAFT"
          - "season remaining budget covers base_price_cents + fuel_surcharge_cap_cents"
        side_effects:
          - "executed_at = now"
          - "trip.estimated_cost_cents += base_price_cents + fuel_surcharge_cap_cents"
          - "increments Trip.version"

      - from: TEAM_EXECUTED
        to: ACTIVE
        trigger: "system (first FlightLeg on this contract reaches BOOKED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: EXPIRED
        trigger: "system (submitted_within window lapses — clock advances past game_tipoff_utc - 30d)"
        actor: system
        preconditions: []
        side_effects: []

      - from: "DRAFT|SUBMITTED|VENDOR_COUNTERSIGNED|TEAM_EXECUTED"
        to: CANCELLED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/charter-contracts/{contractId}/cancel"
        actor: TravelManager
        preconditions:
          - "no FlightLeg on this contract has status DEPARTED"
        side_effects:
          - "cancellation_penalty_cents computed from penalty_bands keyed on (game_tipoff_utc - now) days"
          - "trip.estimated_cost_cents -= base_price_cents + fuel_surcharge_cap_cents - cancellation_penalty_cents"
          - "all FlightLegs with contract_id=this -> CANCELLED"
          - "all ManifestEntries on those legs -> BUMPED with bump_reason=OVERBOOK"

  - entity: FlightLeg
    initial_state: PLANNED
    terminal_states: [ARRIVED, CANCELLED]
    transitions:
      - from: PLANNED
        to: BOOKED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/book"
        actor: TravelCoordinator
        preconditions:
          - "if is_charter: referenced CharterContract.status in {TEAM_EXECUTED, ACTIVE}"
          - "rest rule: if leg_seq > 1, scheduled_depart_utc >= prior_leg.scheduled_arrive_utc + rest_floor(league_rest_policy, severity_of_prior_delay)"
          - "manifest_capacity_check: count of IN TravelPartyMembers must not exceed charter seat_capacity (for charter legs)"
        side_effects:
          - "if charter and contract TEAM_EXECUTED -> contract becomes ACTIVE"
          - "increments Trip.version"

      - from: BOOKED
        to: DELAYED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/delay"
        actor: TravelCoordinator
        preconditions:
          - "delay_minutes > 0"
        side_effects:
          - "scheduled_arrive_utc += delay_minutes"
          - "if this is leg N, all downstream legs with scheduled_depart < new_arrive + rest_floor transition to REBOOKING"

      - from: DELAYED
        to: BOOKED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/rebook"
        actor: TravelCoordinator
        preconditions:
          - "new departure satisfies rest floor against prior leg"
          - "charter contract has available seat capacity for IN members"
        side_effects:
          - "rebook_generation += 1"
          - "scheduled_depart_utc and scheduled_arrive_utc overwritten"
          - "all ManifestEntries stay, is_ticketed reset to false"
          - "increments Trip.version"

      - from: REBOOKING
        to: BOOKED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/rebook"
        actor: TravelCoordinator
        preconditions:
          - "new departure satisfies rest floor against prior leg"
        side_effects:
          - "rebook_generation += 1"
          - "all ManifestEntries is_ticketed reset to false"

      - from: BOOKED
        to: DEPARTED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/depart"
        actor: TravelCoordinator
        preconditions:
          - "all ManifestEntries with status PENDING have been resolved (CONFIRMED or BUMPED)"
        side_effects:
          - "actual_depart_utc = now"
          - "if this is first leg of trip: trip.posture LOCKED -> IN_FLIGHT"

      - from: DEPARTED
        to: ARRIVED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/arrive"
        actor: TravelCoordinator
        preconditions: []
        side_effects:
          - "actual_arrive_utc = now"
          - "delay_minutes computed"
          - "ManifestEntries CONFIRMED -> FLOWN"
          - "if this is last leg: trip.posture -> RECOVERING"

      - from: "PLANNED|BOOKED|DELAYED|REBOOKING"
        to: CANCELLED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/cancel"
        actor: TravelCoordinator
        preconditions: []
        side_effects:
          - "ManifestEntries on this leg -> BUMPED with bump_reason=OVERBOOK"
          - "if is_charter and no remaining non-cancelled legs on contract: charter contract remains ACTIVE but estimated_cost unchanged (penalties handled at contract level)"

  - entity: ManifestEntry
    initial_state: PENDING
    terminal_states: [FLOWN, BUMPED, NO_SHOW]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/manifest/{entryId}/confirm"
        actor: TravelCoordinator
        preconditions:
          - "member.status == IN"
          - "leg.status in {BOOKED, DELAYED}"
          - "credential gate: if leg.destination requires venue credential AND member has no APPROVED CredentialRequest for trip, reject ERR_CREDENTIAL_REQUIRED"
        side_effects: []

      - from: CONFIRMED
        to: BUMPED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/manifest/{entryId}/bump"
        actor: TravelCoordinator
        preconditions: []
        side_effects:
          - "bump_reason recorded"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (leg DEPARTED without member scanned)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONFIRMED
        to: FLOWN
        trigger: "system (leg ARRIVED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING
        to: BUMPED
        trigger: "system (charter contract cancelled or leg cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: HotelBlock
    initial_state: HOLDING
    terminal_states: [CLOSED]
    transitions:
      - from: HOLDING
        to: NAME_LIST_DUE
        trigger: "system (clock reaches cutoff_date - 7d)"
        actor: system
        preconditions: []
        side_effects: []

      - from: NAME_LIST_DUE
        to: LOCKED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}/lock"
        actor: TravelCoordinator
        preconditions:
          - "every IN TravelPartyMember with requires_single_room=true has a RoomAssignment with roommate_member_id NULL"
          - "every IN TravelPartyMember has at least one non-CANCELLED RoomAssignment in this block or sibling block on same trip"
          - "count of non-CANCELLED RoomAssignments >= room_count - rooms_released - attrition_floor"
        side_effects:
          - "increments Trip.version"

      - from: NAME_LIST_DUE
        to: ATTRITION_EXPOSED
        trigger: "system (clock reaches cutoff_date and occupancy below attrition_allowance_pct threshold)"
        actor: system
        preconditions: []
        side_effects:
          - "attrition penalty = (room_count - occupied - allowed_slippage) * rate_cents_per_night * night_count added to trip.estimated_cost_cents"

      - from: LOCKED
        to: CLOSED
        trigger: "system (checkout date passes)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ATTRITION_EXPOSED
        to: CLOSED
        trigger: "system (checkout date passes)"
        actor: system
        preconditions: []
        side_effects: []

      - from: "HOLDING|NAME_LIST_DUE"
        to: CLOSED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}/release"
        actor: TravelCoordinator
        preconditions:
          - "no RoomAssignment in status CHECKED_IN"
        side_effects:
          - "rooms_released = room_count - occupied"
          - "all non-terminal RoomAssignments -> CANCELLED"
          - "trip.estimated_cost_cents reduced by released rooms * rate * nights"

  - entity: RoomAssignment
    initial_state: RESERVED
    terminal_states: [CHECKED_OUT, CANCELLED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}/rooms/{roomId}/confirm"
        actor: TravelCoordinator
        preconditions:
          - "member.status == IN"
          - "if roommate_member_id provided: roommate also status==IN AND roommate.requires_single_room == false AND roommate.party_role is in same_room_group(member.party_role)"
        side_effects: []

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}/rooms/{roomId}/checkin"
        actor: TravelCoordinator
        preconditions:
          - "hotel_block.posture == LOCKED"
        side_effects: []

      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}/rooms/{roomId}/checkout"
        actor: TravelCoordinator
        preconditions: []
        side_effects: []

      - from: "RESERVED|CONFIRMED"
        to: CANCELLED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}/rooms/{roomId}/cancel"
        actor: TravelCoordinator
        preconditions: []
        side_effects:
          - "if member.requires_single_room and was sole occupant, block occupancy counter decrements"

  - entity: PerDiemLedger
    initial_state: DRAFT
    terminal_states: [PAID, ADJUSTED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/members/{memberId}/per-diem/{ledgerId}/approve"
        actor: TravelFinanceLead
        preconditions:
          - "member.status == IN at ledger service_date"
        side_effects:
          - "increments Trip.version"

      - from: APPROVED
        to: PAID
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/members/{memberId}/per-diem/{ledgerId}/pay"
        actor: TravelFinanceLead
        preconditions:
          - "trip.posture in {LOCKED, IN_FLIGHT, RECOVERING, DISRUPTED}"
        side_effects:
          - "paid_at = now"

      - from: APPROVED
        to: DISPUTED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/members/{memberId}/per-diem/{ledgerId}/dispute"
        actor: TeamMember
        preconditions: []
        side_effects: []

      - from: DISPUTED
        to: APPROVED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/members/{memberId}/per-diem/{ledgerId}/resolve"
        actor: TravelFinanceLead
        preconditions: []
        side_effects:
          - "net_amount_cents recomputed from (possibly edited) meals_provided_count"

      - from: DRAFT
        to: ADJUSTED
        trigger: "system (trip CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "net_amount_cents = 0"

  - entity: EquipmentShipment
    initial_state: STAGED
    terminal_states: [DELIVERED, LOST]
    transitions:
      - from: STAGED
        to: LOADED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/equipment/{shipmentId}/load"
        actor: EquipmentManager
        preconditions:
          - "assigned_contract_id references CharterContract with status ACTIVE"
          - "cumulative gross_weight_lb of all non-lost shipments on this contract + this shipment gross_weight_lb <= contract.cargo_capacity_lb"
        side_effects:
          - "if cumulative weight exceeds 90% of capacity: chargeback_cents computed via tiered weight-overage"
          - "increments Trip.version"

      - from: LOADED
        to: IN_TRANSIT
        trigger: "system (associated leg DEPARTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/equipment/{shipmentId}/deliver"
        actor: EquipmentManager
        preconditions: []
        side_effects: []

      - from: IN_TRANSIT
        to: DELAYED
        trigger: "system (associated leg DELAYED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DELAYED
        to: IN_TRANSIT
        trigger: "system (leg rebooked and DEPARTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: "STAGED|LOADED|IN_TRANSIT|DELAYED"
        to: LOST
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/equipment/{shipmentId}/mark-lost"
        actor: EquipmentManager
        preconditions: []
        side_effects:
          - "chargeback_cents = declared_value_cents (full insurance claim)"
          - "trip.estimated_cost_cents += chargeback_cents"

  - entity: ContingencyEvent
    initial_state: OPEN
    terminal_states: [RESOLVED, CLOSED]
    transitions:
      - from: OPEN
        to: MITIGATING
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/contingencies/{eventId}/mitigate"
        actor: TravelManager
        preconditions: []
        side_effects:
          - "resolution_action selected"

      - from: MITIGATING
        to: RESOLVED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/contingencies/{eventId}/resolve"
        actor: TravelManager
        preconditions:
          - "if resolution_action == REBOOK: affected FlightLeg status == BOOKED"
          - "if resolution_action == OVERNIGHT: a HotelBlock covering the disruption night exists"
          - "recovery_cost_cents recorded"
        side_effects:
          - "trip.estimated_cost_cents += recovery_cost_cents"
          - "trip posture evaluated: if all events resolved and all legs BOOKED -> DISRUPTED to LOCKED"

      - from: OPEN
        to: CLOSED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/contingencies/{eventId}/close-noop"
        actor: TravelManager
        preconditions:
          - "affected leg has been CANCELLED or trip has been CANCELLED"
        side_effects: []

  - entity: CredentialRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: SECURITY_REVIEW
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/credentials/{credId}/security-review"
        actor: SecurityOfficer
        preconditions:
          - "reviewer X-User-ID != credential.submitted_by_user_id (SoD)"
        side_effects:
          - "reviewed_by_user_id = acting X-User-ID"

      - from: SECURITY_REVIEW
        to: APPROVED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/credentials/{credId}/approve"
        actor: VenueCredentialApprover
        preconditions:
          - "approver X-User-ID != submitted_by_user_id AND != reviewed_by_user_id"
        side_effects:
          - "approved_by_user_id = acting X-User-ID"
          - "manifest gate lifted: any PENDING ManifestEntry for this member on legs to this venue may now confirm"

      - from: SECURITY_REVIEW
        to: DENIED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/credentials/{credId}/deny"
        actor: VenueCredentialApprover
        preconditions: []
        side_effects:
          - "denial_reason recorded"
          - "all CONFIRMED ManifestEntries for this member on legs to this venue -> BUMPED with bump_reason=SECURITY_DENIAL"

      - from: APPROVED
        to: REVOKED
        trigger: "POST /travel/teams/{teamId}/trips/{tripId}/credentials/{credId}/revoke"
        actor: SecurityOfficer
        preconditions: []
        side_effects:
          - "CONFIRMED ManifestEntries for this member on legs to this venue -> BUMPED with bump_reason=SECURITY_DENIAL"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent's version)
# =============================================================================
concurrency_rules:
  - rule_id: trip-lock-stale-version
    parent_entity: Trip
    write_endpoint: "POST /travel/teams/{teamId}/trips/{tripId}/lock"
    occ_field: "expected_trip_version"
    description: |
      Locking a trip whose version has advanced since the client last observed
      it is rejected. Captures the case where another writer has added a party
      member, edited a leg, or executed a charter contract between the client's
      read and its lock attempt.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: charter-execute-stale-version
    parent_entity: CharterContract
    write_endpoint: "POST /travel/teams/{teamId}/trips/{tripId}/charter-contracts/{contractId}/execute"
    occ_field: "expected_contract_version"
    description: |
      Executing a charter contract whose version has advanced since the client
      last observed it is rejected; any vendor counter-signature or amendment
      since last read invalidates the execution snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: hotel-block-lock-stale-version
    parent_entity: HotelBlock
    write_endpoint: "POST /travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}/lock"
    occ_field: "expected_block_version"
    description: |
      Locking a hotel block whose version has advanced since the client last
      observed it is rejected; room releases or new room assignments between
      read and lock invalidate the lock snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: trip_estimated_cost
    trigger: "trip lock; charter execute/cancel; hotel block lock/release; contingency resolve; equipment mark-lost"
    algorithm: forward_looking
    formula: |
      estimated_cost_cents =
          sum over CharterContracts in {TEAM_EXECUTED, ACTIVE}:
              (base_price_cents + fuel_surcharge_cap_cents - cancellation_penalty_cents_already_charged)
        + sum over HotelBlocks in {HOLDING, NAME_LIST_DUE, LOCKED, ATTRITION_EXPOSED}:
              (room_count - rooms_released) * rate_cents_per_night * night_count
        + sum over EquipmentShipments in {STAGED, LOADED, IN_TRANSIT, DELAYED, LOST}:
              chargeback_cents
        + sum over PerDiemLedgers in {DRAFT, APPROVED, PAID} for members with status IN:
              net_amount_cents
        + sum over ContingencyEvents in {OPEN, MITIGATING, RESOLVED}:
              recovery_cost_cents
    precision: "integer cents; no rounding"
    variants:
      - name: provisional_at_lock
        when: "trip transitions DRAFT -> LOCKED"
        difference: "uses forward-looking projection that counts every DRAFT PerDiemLedger at its projected base_amount_cents regardless of meals_provided_count (assumes zero team-provided meals), inflating the provisional figure"
      - name: committed_at_close
        when: "trip RECOVERING -> CLOSED"
        difference: "uses chronological ledger of actual events; PerDiemLedger uses actual meals_provided_count, ContingencyEvents use final recovery_cost_cents, cancelled contracts contribute only their cancellation_penalty_cents (not base_price)"

  - name: per_diem_net
    trigger: "PerDiemLedger create; dispute resolve"
    algorithm: tiered_pricing
    formula: |
      TIER_RATE = { TIER_A: {TRAVEL_DAY: 12000, GAME_DAY: 15000, OFF_DAY: 9000, PARTIAL_DAY: 6000},
                    TIER_B: {TRAVEL_DAY:  9000, GAME_DAY: 11000, OFF_DAY: 7000, PARTIAL_DAY: 4500},
                    TIER_C: {TRAVEL_DAY:  6500, GAME_DAY:  8000, OFF_DAY: 5000, PARTIAL_DAY: 3250} }
      MEAL_DEDUCTION_CENTS = 2500  # per team-provided meal
      base_amount_cents = TIER_RATE[member.per_diem_tier][day_kind]
      deduction_cents   = meals_provided_count * MEAL_DEDUCTION_CENTS
      net_amount_cents  = max(0, base_amount_cents - deduction_cents)
    constants:
      MEAL_DEDUCTION_CENTS: 2500
    precision: "integer cents"

  - name: charter_cancellation_penalty
    trigger: "CharterContract cancel"
    algorithm: threshold
    formula: |
      days_before = floor( (game_tipoff_utc - now_utc) / 86400 )
      Select band: the FIRST band in penalty_bands (sorted days_before DESC)
      whose days_before <= days_before value satisfies days_before >= band.days_before.
      If no band matches (cancel after earliest band), penalty_pct = 100.
      cancellation_penalty_cents = round_half_up(
          (base_price_cents + fuel_surcharge_cap_cents) * band.penalty_pct / 100
      )
    precision: "integer cents, round_half_up"

  - name: rest_floor
    trigger: "FlightLeg book / rebook"
    algorithm: threshold
    formula: |
      BASE_REST_MINUTES = { STANDARD: 600, STRINGENT: 720 }
      DELAY_COMPOUND_MINUTES = { STANDARD: 60, STRINGENT: 90 }
      rest_required_minutes = BASE_REST_MINUTES[policy]
                              + max(0, prior_leg.delay_minutes - 60) / 60 * DELAY_COMPOUND_MINUTES[policy]
                              (integer division; every full 60 minutes of prior delay beyond the first
                               hour adds DELAY_COMPOUND_MINUTES)
      Constraint: scheduled_depart_utc >= prior_leg.scheduled_arrive_utc + rest_required_minutes
    constants:
      BASE_REST_MINUTES_STANDARD: 600
      BASE_REST_MINUTES_STRINGENT: 720
      DELAY_COMPOUND_STANDARD: 60
      DELAY_COMPOUND_STRINGENT: 90

  - name: hotel_attrition_penalty
    trigger: "HotelBlock NAME_LIST_DUE -> ATTRITION_EXPOSED (system) OR release with occupancy below allowance"
    algorithm: threshold
    formula: |
      allowed_slippage_rooms = floor(room_count * attrition_allowance_pct / 100)
      occupied_rooms = count of RoomAssignments with status in {CONFIRMED, CHECKED_IN, CHECKED_OUT}
      penalty_rooms = max(0, room_count - rooms_released - occupied_rooms - allowed_slippage_rooms)
      attrition_penalty_cents = penalty_rooms * rate_cents_per_night * night_count
    precision: "integer cents"

  - name: equipment_weight_chargeback
    trigger: "EquipmentShipment load"
    algorithm: tiered_pricing
    formula: |
      Tiers applied against total committed weight on the contract including this shipment:
        tier 1: <= 85% of cargo_capacity_lb     -> 0 cents/lb over
        tier 2: > 85% and <= 100% of capacity   -> 350 cents/lb on weight above 85%
        tier 3: > 100% of capacity              -> 900 cents/lb on weight above 100% PLUS tier 2 charge on the 85%-100% slice
      chargeback_cents = tier2_cents + tier3_cents
      where tier2_cents = max(0, min(committed_lb, capacity_lb) - floor(0.85*capacity_lb)) * 350
            tier3_cents = max(0, committed_lb - capacity_lb) * 900
    constants:
      TIER2_RATE_CENTS_PER_LB: 350
      TIER3_RATE_CENTS_PER_LB: 900
      TIER1_FRACTION_NUM: 85
      TIER1_FRACTION_DEN: 100
    precision: "integer cents"

  - name: trip_actual_cost_chronological
    trigger: "trip close (RECOVERING -> CLOSED)"
    algorithm: chronological
    formula: |
      Replay events in order of (event_timestamp ASC, event_created_at ASC):
        1. CharterContract execution -> +base_price_cents + fuel_surcharge_cap_cents
        2. CharterContract cancellation -> -base - cap + cancellation_penalty_cents (net = penalty only)
        3. HotelBlock lock -> +(room_count - rooms_released)*rate*nights
        4. HotelBlock attrition -> +attrition_penalty_cents
        5. PerDiemLedger pay -> +net_amount_cents (as of pay time)
        6. EquipmentShipment mark-lost -> +chargeback_cents
        7. ContingencyEvent resolve -> +recovery_cost_cents
      actual_cost_cents = running sum
    precision: "integer cents"
    key_insight: |
      Forward-looking estimated_cost_cents (at lock) and chronological
      actual_cost_cents (at close) use different inclusion rules — a
      ContingencyEvent still OPEN at close is excluded from actual but was
      included in estimate; a PerDiemLedger APPROVED-but-not-PAID at close is
      excluded from actual but was in estimate.

  - name: manifest_capacity_check
    trigger: "FlightLeg book / ManifestEntry confirm"
    algorithm: aggregation
    formula: |
      For charter legs: count(ManifestEntry with status in {PENDING, CONFIRMED})
      on this leg must be <= contract.seat_capacity.
      On confirm: count(CONFIRMED) < seat_capacity else reject.
      Boundary: when count(CONFIRMED) == seat_capacity - 1, one more confirm succeeds;
      when count == seat_capacity, next confirm fails ERR_MANIFEST_FULL.

  - name: season_budget_remaining
    trigger: "trip lock; charter execute; contingency resolve"
    algorithm: aggregation
    formula: |
      season_budget_remaining_cents = season.travel_budget_cents - season.committed_cost_cents
      committed_cost_cents = sum over trips in {LOCKED, IN_FLIGHT, DISRUPTED, RECOVERING} of trip.estimated_cost_cents
                           + sum over trips in {CLOSED} of trip.actual_cost_cents
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must be permitted for the operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Path resource ids must exist (validated left-to-right: team, season, trip, child)"
    error_id: "ERR_TEAM_NOT_FOUND | ERR_SEASON_NOT_FOUND | ERR_TRIP_NOT_FOUND | ERR_LEG_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_BLOCK_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_ENTRY_NOT_FOUND | ERR_LEDGER_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_CREDENTIAL_NOT_FOUND"
    http_status: 404
    applies_to: all nested endpoints

  - priority: 4
    category: state
    check: "Optimistic concurrency: expected_*_version must match parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../lock, POST .../execute, POST .../hotel-blocks/.../lock"

  - priority: 5
    category: state
    check: "Parent resource in correct aggregate state (trip posture, season OPEN, hotel posture)"
    error_id: "ERR_TRIP_NOT_DRAFT | ERR_TRIP_NOT_LOCKED | ERR_TRIP_ALREADY_TERMINAL | ERR_SEASON_CLOSED | ERR_BLOCK_NOT_NAME_LIST_DUE"
    http_status: 409
    applies_to: "all child mutations"

  - priority: 6
    category: state
    check: "Target resource in correct state for the operation (state machine precondition)"
    error_id: "ERR_INVALID_STATE (specialized variants: ERR_CONTRACT_NOT_VENDOR_COUNTERSIGNED, ERR_LEG_NOT_BOOKED, ERR_ENTRY_NOT_PENDING, ERR_LEDGER_NOT_APPROVED, ERR_CREDENTIAL_NOT_IN_REVIEW, etc.)"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_safety
    check: "Rest rule: scheduled_depart_utc >= prior_arrive + rest_floor(policy, prior_delay)"
    error_id: ERR_REST_FLOOR_VIOLATION
    http_status: 409
    applies_to: "POST .../flight-legs/.../book, POST .../flight-legs/.../rebook"

  - priority: 8
    category: business_safety
    check: "Credential gate: member must hold APPROVED credential for destination venue before manifest confirm"
    error_id: ERR_CREDENTIAL_REQUIRED
    http_status: 409
    applies_to: "POST .../manifest/.../confirm"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: reviewer/approver X-User-ID must differ from prior step's actor"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST .../credentials/.../security-review, POST .../credentials/.../approve"

  - priority: 10
    category: business_constraint
    check: "Roommate compatibility: requires_single_room members cannot be assigned roommates; party_role groups must be compatible"
    error_id: ERR_ROOMMATE_INCOMPATIBLE
    http_status: 409
    applies_to: "POST .../rooms/.../confirm"

  - priority: 11
    category: business_constraint
    check: "Manifest capacity: confirmed count cannot exceed charter seat_capacity"
    error_id: ERR_MANIFEST_FULL
    http_status: 409
    applies_to: "POST .../manifest/.../confirm"

  - priority: 12
    category: business_constraint
    check: "Charter cargo capacity: cumulative shipment weight cannot exceed cargo_capacity_lb"
    error_id: ERR_CARGO_OVERWEIGHT
    http_status: 409
    applies_to: "POST .../equipment/.../load"

  - priority: 13
    category: business_temporal
    check: "Hotel block cutoff: room name changes accepted only before cutoff_date"
    error_id: ERR_CUTOFF_PASSED
    http_status: 409
    applies_to: "POST .../hotel-blocks/.../rooms (create/confirm), POST .../hotel-blocks/.../lock"

  - priority: 14
    category: business_temporal
    check: "Charter contract execution deadline: must execute at least 30 days before game_tipoff_utc"
    error_id: ERR_CONTRACT_EXECUTION_WINDOW
    http_status: 409
    applies_to: "POST .../charter-contracts/.../execute"

  - priority: 15
    category: business_referential
    check: "FK target state: charter leg requires contract in TEAM_EXECUTED|ACTIVE; per-diem requires member IN; credential requires member IN"
    error_id: "ERR_CONTRACT_NOT_EXECUTABLE | ERR_MEMBER_NOT_IN | ERR_LEG_NOT_CHARTER"
    http_status: 409
    applies_to: "child creation and state transitions"

  - priority: 16
    category: business_fiscal
    check: "Season budget: committed + proposed change <= travel_budget_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "trip lock, charter execute, contingency resolve with recovery_cost"

  - priority: 17
    category: business_fiscal
    check: "PerDiem meals_provided_count cannot exceed 3 per day; day_kind must be valid enum"
    error_id: ERR_INVALID_PER_DIEM_INPUT
    http_status: 400
    applies_to: "POST .../per-diem (create), POST .../per-diem/.../resolve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock (required for time-window rules) ---
  - method: POST
    path: "/travel/_clock/set_current_utc"
    description: "Advance logical clock. Server default at startup is 2026-08-01T00:00:00Z; never falls back to wall clock."
    roles: [TravelOpsAdmin]
    code: 200
    input: [to_iso8601]
    output: { now_utc: string }
    side_effects: []

  # --- Team ---
  - method: POST
    path: "/travel/teams"
    description: "Create a team"
    roles: [TravelOpsAdmin]
    code: 201
    input: [team_code, display_name, "league_rest_policy?"]
    output: Team
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}"
    description: "Get a team"
    roles: [Any]
    code: 200
    input: []
    output: Team
    side_effects: []

  - method: GET
    path: "/travel/teams"
    description: "List teams (FK reverse-reachability for active_season_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "active_season_id?"]
    output: "Team[]"
    side_effects: []

  # --- Season ---
  - method: POST
    path: "/travel/teams/{teamId}/seasons"
    description: "Open a new season"
    roles: [TravelFinanceLead]
    code: 201
    input: [label, travel_budget_cents]
    output: Season
    side_effects: ["team.active_season_id set", "committed/projected 0", "status OPEN"]

  - method: GET
    path: "/travel/teams/{teamId}/seasons"
    description: "List seasons for a team (FK reverse-reachability for Season.team_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Season[]"
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/seasons/{seasonId}"
    description: "Get a season"
    roles: [Any]
    code: 200
    input: []
    output: Season
    side_effects: []

  - method: POST
    path: "/travel/teams/{teamId}/seasons/{seasonId}/close"
    description: "Close a season"
    roles: [TravelFinanceLead]
    code: 200
    input: []
    output: Season
    side_effects: ["status OPEN -> CLOSED"]

  # --- Trip ---
  - method: POST
    path: "/travel/teams/{teamId}/trips"
    description: "Create a trip in DRAFT"
    roles: [TravelManager]
    code: 201
    input: [season_id, destination_code, game_tipoff_utc, return_arrival_utc]
    output: Trip
    side_effects: ["posture DRAFT", "disruption_seq=0"]

  - method: GET
    path: "/travel/teams/{teamId}/trips"
    description: "List trips for a team (FK reverse-reachability for Trip.team_id, Trip.season_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "season_id?"]
    output: "Trip[]"
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}"
    description: "Get a trip"
    roles: [Any]
    code: 200
    input: []
    output: Trip
    side_effects: []

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/lock"
    description: "Lock trip (DRAFT -> LOCKED)"
    roles: [TravelManager]
    code: 200
    input: [expected_trip_version]
    output: Trip
    side_effects: ["season.committed += trip.estimated", "increments Trip.version"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/close"
    description: "Close trip (RECOVERING -> CLOSED)"
    roles: [TravelFinanceLead]
    code: 200
    input: []
    output: Trip
    side_effects: ["compute actual_cost_cents chronologically", "season.committed adjusted"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/cancel"
    description: "Cancel a trip"
    roles: [TravelManager]
    code: 200
    input: []
    output: Trip
    side_effects: ["cascade: contracts cancelled with penalty, hotel blocks closed, per-diems adjusted"]

  # --- TravelPartyMember ---
  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/members"
    description: "Add a party member to a trip"
    roles: [TravelManager]
    code: 201
    input: [member_ref, party_role, travel_class, per_diem_tier, "requires_single_room?", "requires_ground_transport?"]
    output: TravelPartyMember
    side_effects: ["trip.party_size recomputed", "increments Trip.version"]

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/members/{memberId}"
    description: "Get a member"
    roles: [Any]
    code: 200
    input: []
    output: TravelPartyMember
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/members"
    description: "List members of a trip"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "TravelPartyMember[]"
    side_effects: []

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/members/{memberId}/scratch"
    description: "Scratch member (IN -> SCRATCHED)"
    roles: [TravelManager]
    code: 200
    input: []
    output: TravelPartyMember
    side_effects: ["cascade: manifest entries bumped MEDICAL_SCRATCH, room assignments cancelled, per-diem ledgers adjusted", "increments Trip.version"]

  # --- CharterContract ---
  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/charter-contracts"
    description: "Draft a charter contract"
    roles: [TravelManager]
    code: 201
    input: [vendor_code, base_price_cents, fuel_surcharge_cap_cents, seat_capacity, cargo_capacity_lb, penalty_bands]
    output: CharterContract
    side_effects: ["status DRAFT"]

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/charter-contracts"
    description: "List charter contracts for a trip (FK reverse-reachability for CharterContract.trip_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "CharterContract[]"
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/charter-contracts/{contractId}"
    description: "Get a contract"
    roles: [Any]
    code: 200
    input: []
    output: CharterContract
    side_effects: []

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/charter-contracts/{contractId}/submit"
    description: "Submit contract to vendor"
    roles: [TravelManager]
    code: 200
    input: []
    output: CharterContract
    side_effects: ["status DRAFT -> SUBMITTED"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/charter-contracts/{contractId}/countersign"
    description: "Vendor counter-signs"
    roles: [VendorRep]
    code: 200
    input: []
    output: CharterContract
    side_effects: ["status SUBMITTED -> VENDOR_COUNTERSIGNED"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/charter-contracts/{contractId}/execute"
    description: "Team executes contract"
    roles: [TravelFinanceLead]
    code: 200
    input: [expected_contract_version]
    output: CharterContract
    side_effects: ["status -> TEAM_EXECUTED", "trip.estimated += base + fuel_cap", "increments Trip.version"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/charter-contracts/{contractId}/cancel"
    description: "Cancel contract"
    roles: [TravelManager]
    code: 200
    input: []
    output: CharterContract
    side_effects: ["status -> CANCELLED with cancellation_penalty_cents computed", "legs cancelled, entries bumped"]

  # --- FlightLeg ---
  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/flight-legs"
    description: "Add a flight leg"
    roles: [TravelCoordinator]
    code: 201
    input: [leg_seq, origin_code, destination_code, scheduled_depart_utc, scheduled_arrive_utc, is_charter, "contract_id?"]
    output: FlightLeg
    side_effects: ["status PLANNED", "rebook_generation=0", "increments Trip.version"]

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}"
    description: "Get a leg"
    roles: [Any]
    code: 200
    input: []
    output: FlightLeg
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/flight-legs"
    description: "List legs of a trip (FK reverse-reachability for FlightLeg.trip_id, FlightLeg.contract_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?", "contract_id?"]
    output: "FlightLeg[]"
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/charter-contracts/{contractId}/flight-legs"
    description: "List legs bound to a specific charter contract (FK reverse sub-resource)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "FlightLeg[]"
    side_effects: []

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/book"
    description: "Book a leg"
    roles: [TravelCoordinator]
    code: 200
    input: []
    output: FlightLeg
    side_effects: ["status PLANNED -> BOOKED", "rest-floor validated", "charter contract -> ACTIVE on first book"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/delay"
    description: "Report a delay on a booked leg"
    roles: [TravelCoordinator]
    code: 200
    input: [delay_minutes]
    output: FlightLeg
    side_effects: ["status BOOKED -> DELAYED", "downstream legs -> REBOOKING if rest floor violated", "increments Trip.version"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/rebook"
    description: "Rebook a delayed/rebooking leg"
    roles: [TravelCoordinator]
    code: 200
    input: [scheduled_depart_utc, scheduled_arrive_utc]
    output: FlightLeg
    side_effects: ["status -> BOOKED", "rebook_generation += 1", "manifest entries is_ticketed reset to false"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/depart"
    description: "Mark leg departed"
    roles: [TravelCoordinator]
    code: 200
    input: []
    output: FlightLeg
    side_effects: ["status -> DEPARTED", "actual_depart_utc = now", "if first leg, trip LOCKED -> IN_FLIGHT"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/arrive"
    description: "Mark leg arrived"
    roles: [TravelCoordinator]
    code: 200
    input: []
    output: FlightLeg
    side_effects: ["status -> ARRIVED", "delay_minutes computed", "if last leg, trip -> RECOVERING", "ManifestEntries CONFIRMED -> FLOWN"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/cancel"
    description: "Cancel a leg"
    roles: [TravelCoordinator]
    code: 200
    input: []
    output: FlightLeg
    side_effects: ["status -> CANCELLED", "ManifestEntries -> BUMPED OVERBOOK"]

  # --- ManifestEntry ---
  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/manifest"
    description: "Add manifest entry for a member on a leg"
    roles: [TravelCoordinator]
    code: 201
    input: [member_id, "seat_assignment?"]
    output: ManifestEntry
    side_effects: ["status PENDING", "is_ticketed=false"]

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/manifest"
    description: "List manifest entries on a leg (FK reverse-reachability for ManifestEntry.flight_leg_id, ManifestEntry.member_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "member_id?"]
    output: "ManifestEntry[]"
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/members/{memberId}/manifest"
    description: "List manifest entries for a member across legs of a trip (FK reverse sub-resource)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ManifestEntry[]"
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/manifest/{entryId}"
    description: "Get manifest entry"
    roles: [Any]
    code: 200
    input: []
    output: ManifestEntry
    side_effects: []

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/manifest/{entryId}/confirm"
    description: "Confirm manifest entry (validates credential gate)"
    roles: [TravelCoordinator]
    code: 200
    input: []
    output: ManifestEntry
    side_effects: ["status -> CONFIRMED", "is_ticketed=true", "credential gate enforced"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/manifest/{entryId}/bump"
    description: "Bump an entry"
    roles: [TravelCoordinator]
    code: 200
    input: [bump_reason]
    output: ManifestEntry
    side_effects: ["status -> BUMPED"]

  # --- HotelBlock ---
  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/hotel-blocks"
    description: "Create a hotel block"
    roles: [TravelCoordinator]
    code: 201
    input: [hotel_code, room_count, rate_cents_per_night, check_in_date, night_count, cutoff_date, "attrition_allowance_pct?"]
    output: HotelBlock
    side_effects: ["posture HOLDING", "rooms_released=0", "increments Trip.version"]

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/hotel-blocks"
    description: "List hotel blocks for a trip (FK reverse-reachability for HotelBlock.trip_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "HotelBlock[]"
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}"
    description: "Get hotel block"
    roles: [Any]
    code: 200
    input: []
    output: HotelBlock
    side_effects: []

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}/lock"
    description: "Lock hotel block (NAME_LIST_DUE -> LOCKED)"
    roles: [TravelCoordinator]
    code: 200
    input: [expected_block_version]
    output: HotelBlock
    side_effects: ["posture -> LOCKED", "increments Trip.version"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}/release"
    description: "Release rooms back to hotel"
    roles: [TravelCoordinator]
    code: 200
    input: [rooms_to_release]
    output: HotelBlock
    side_effects: ["rooms_released += rooms_to_release", "trip.estimated reduced", "may transition posture to ATTRITION_EXPOSED if below allowance"]

  # --- RoomAssignment ---
  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}/rooms"
    description: "Create a room assignment"
    roles: [TravelCoordinator]
    code: 201
    input: [member_id, "roommate_member_id?", room_label, "smoking_pref?"]
    output: RoomAssignment
    side_effects: ["status RESERVED"]

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}/rooms"
    description: "List room assignments in a block (FK reverse-reachability for RoomAssignment.hotel_block_id, RoomAssignment.member_id, RoomAssignment.roommate_member_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "member_id?", "roommate_member_id?"]
    output: "RoomAssignment[]"
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/members/{memberId}/rooms"
    description: "List room assignments for a member (FK reverse sub-resource)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "RoomAssignment[]"
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}/rooms/{roomId}"
    description: "Get room assignment"
    roles: [Any]
    code: 200
    input: []
    output: RoomAssignment
    side_effects: []

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}/rooms/{roomId}/confirm"
    description: "Confirm a room assignment"
    roles: [TravelCoordinator]
    code: 200
    input: []
    output: RoomAssignment
    side_effects: ["status -> CONFIRMED", "roommate compatibility validated"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}/rooms/{roomId}/checkin"
    description: "Check in"
    roles: [TravelCoordinator]
    code: 200
    input: []
    output: RoomAssignment
    side_effects: ["status -> CHECKED_IN"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}/rooms/{roomId}/checkout"
    description: "Check out"
    roles: [TravelCoordinator]
    code: 200
    input: []
    output: RoomAssignment
    side_effects: ["status -> CHECKED_OUT"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/hotel-blocks/{blockId}/rooms/{roomId}/cancel"
    description: "Cancel room assignment"
    roles: [TravelCoordinator]
    code: 200
    input: []
    output: RoomAssignment
    side_effects: ["status -> CANCELLED"]

  # --- PerDiemLedger ---
  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/members/{memberId}/per-diem"
    description: "Create a per-diem ledger entry"
    roles: [TravelFinanceLead]
    code: 201
    input: [service_date, day_kind, "meals_provided_count?"]
    output: PerDiemLedger
    side_effects: ["base_amount_cents, deduction_cents, net_amount_cents computed", "status DRAFT"]

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/members/{memberId}/per-diem"
    description: "List per-diem ledger entries for a member (FK reverse-reachability for PerDiemLedger.member_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "PerDiemLedger[]"
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/members/{memberId}/per-diem/{ledgerId}"
    description: "Get a ledger entry"
    roles: [Any]
    code: 200
    input: []
    output: PerDiemLedger
    side_effects: []

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/members/{memberId}/per-diem/{ledgerId}/approve"
    description: "Approve ledger"
    roles: [TravelFinanceLead]
    code: 200
    input: []
    output: PerDiemLedger
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/members/{memberId}/per-diem/{ledgerId}/pay"
    description: "Pay ledger"
    roles: [TravelFinanceLead]
    code: 200
    input: []
    output: PerDiemLedger
    side_effects: ["status -> PAID", "paid_at = now", "increments Trip.version"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/members/{memberId}/per-diem/{ledgerId}/dispute"
    description: "Dispute ledger"
    roles: [TeamMember]
    code: 200
    input: []
    output: PerDiemLedger
    side_effects: ["status -> DISPUTED"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/members/{memberId}/per-diem/{ledgerId}/resolve"
    description: "Resolve a disputed ledger"
    roles: [TravelFinanceLead]
    code: 200
    input: [meals_provided_count]
    output: PerDiemLedger
    side_effects: ["net_amount_cents recomputed", "status -> APPROVED"]

  # --- EquipmentShipment ---
  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/equipment"
    description: "Create an equipment shipment"
    roles: [EquipmentManager]
    code: 201
    input: [shipment_kind, gross_weight_lb, piece_count, declared_value_cents, "assigned_contract_id?"]
    output: EquipmentShipment
    side_effects: ["status STAGED", "chargeback_cents=0"]

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/equipment"
    description: "List equipment shipments for a trip (FK reverse-reachability for EquipmentShipment.trip_id, EquipmentShipment.assigned_contract_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "assigned_contract_id?"]
    output: "EquipmentShipment[]"
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/charter-contracts/{contractId}/equipment"
    description: "List shipments assigned to a specific contract (FK reverse sub-resource)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "EquipmentShipment[]"
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/equipment/{shipmentId}"
    description: "Get shipment"
    roles: [Any]
    code: 200
    input: []
    output: EquipmentShipment
    side_effects: []

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/equipment/{shipmentId}/load"
    description: "Load shipment onto charter"
    roles: [EquipmentManager]
    code: 200
    input: []
    output: EquipmentShipment
    side_effects: ["status -> LOADED", "chargeback_cents computed via tiered weight-overage"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/equipment/{shipmentId}/deliver"
    description: "Mark shipment delivered"
    roles: [EquipmentManager]
    code: 200
    input: []
    output: EquipmentShipment
    side_effects: ["status -> DELIVERED"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/equipment/{shipmentId}/mark-lost"
    description: "Mark shipment lost"
    roles: [EquipmentManager]
    code: 200
    input: []
    output: EquipmentShipment
    side_effects: ["status -> LOST", "chargeback_cents = declared_value_cents", "trip.estimated += chargeback"]

  # --- ContingencyEvent ---
  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/contingencies"
    description: "Open a contingency event (weather/delay/etc.)"
    roles: [TravelManager]
    code: 201
    input: [kind, detected_at, affected_leg_id, severity]
    output: ContingencyEvent
    side_effects: ["status OPEN", "trip.posture -> DISRUPTED (if LOCKED/IN_FLIGHT)", "trip.disruption_seq += 1", "increments Trip.version"]

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/contingencies"
    description: "List contingency events for a trip (FK reverse-reachability for ContingencyEvent.trip_id, ContingencyEvent.affected_leg_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "affected_leg_id?"]
    output: "ContingencyEvent[]"
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/flight-legs/{legId}/contingencies"
    description: "List contingencies affecting a specific leg (FK reverse sub-resource)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ContingencyEvent[]"
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/contingencies/{eventId}"
    description: "Get contingency"
    roles: [Any]
    code: 200
    input: []
    output: ContingencyEvent
    side_effects: []

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/contingencies/{eventId}/mitigate"
    description: "Select a mitigation action"
    roles: [TravelManager]
    code: 200
    input: [resolution_action]
    output: ContingencyEvent
    side_effects: ["status -> MITIGATING"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/contingencies/{eventId}/resolve"
    description: "Resolve contingency"
    roles: [TravelManager]
    code: 200
    input: [recovery_cost_cents]
    output: ContingencyEvent
    side_effects: ["status -> RESOLVED", "trip.estimated += recovery_cost_cents", "trip posture re-evaluated"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/contingencies/{eventId}/close-noop"
    description: "Close contingency without action"
    roles: [TravelManager]
    code: 200
    input: []
    output: ContingencyEvent
    side_effects: ["status -> CLOSED"]

  # --- CredentialRequest ---
  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/credentials"
    description: "Submit credential request"
    roles: [TeamMember]
    code: 201
    input: [member_id, venue_code, access_level]
    output: CredentialRequest
    side_effects: ["status SUBMITTED", "submitted_by_user_id = X-User-ID"]

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/credentials"
    description: "List credentials for a trip (FK reverse-reachability for CredentialRequest.trip_id, CredentialRequest.member_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "member_id?"]
    output: "CredentialRequest[]"
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/members/{memberId}/credentials"
    description: "List credentials for a member (FK reverse sub-resource)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "CredentialRequest[]"
    side_effects: []

  - method: GET
    path: "/travel/teams/{teamId}/trips/{tripId}/credentials/{credId}"
    description: "Get credential"
    roles: [Any]
    code: 200
    input: []
    output: CredentialRequest
    side_effects: []

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/credentials/{credId}/security-review"
    description: "Move credential to security review (SoD step 1)"
    roles: [SecurityOfficer]
    code: 200
    input: []
    output: CredentialRequest
    side_effects: ["status -> SECURITY_REVIEW", "reviewed_by_user_id = X-User-ID"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/credentials/{credId}/approve"
    description: "Approve credential (SoD step 2)"
    roles: [VenueCredentialApprover]
    code: 200
    input: []
    output: CredentialRequest
    side_effects: ["status -> APPROVED", "approved_by_user_id = X-User-ID", "manifest gate lifted"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/credentials/{credId}/deny"
    description: "Deny credential"
    roles: [VenueCredentialApprover]
    code: 200
    input: [denial_reason]
    output: CredentialRequest
    side_effects: ["status -> DENIED", "manifest entries bumped SECURITY_DENIAL"]

  - method: POST
    path: "/travel/teams/{teamId}/trips/{tripId}/credentials/{credId}/revoke"
    description: "Revoke an approved credential"
    roles: [SecurityOfficer]
    code: 200
    input: []
    output: CredentialRequest
    side_effects: ["status -> REVOKED", "manifest entries bumped SECURITY_DENIAL"]

  # --- Flat single-resource GETs (register canonical collection segments for lint check (f)) ---
