        grounds: ["endpoints[POST /prerequisite-overrides/{override_id}/revoke]", calculations.prerequisite_satisfaction_closure, "errors[ERR_NOT_OVERRIDE_ISSUER]"]
        distinguishing_aspect: |
          Revoking an override reaches into a different aggregate and re-derives
          prerequisite_status on the PENDING registration that presented it, taking
          it from OVERRIDDEN back to UNMET without moving the registration's own
          state. The instance also pins the issuer binding: an Instructor may revoke
          only what they issued, while a Registrar may revoke anything — and a
          CONSUMED override cannot be revoked at all until its registration is
          dropped.
