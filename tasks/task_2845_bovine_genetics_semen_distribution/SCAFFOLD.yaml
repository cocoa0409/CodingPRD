scenario: |
  2845. Bovine Genetics & Semen Distribution (cattle genetics company): sire acquisition, progeny testing and genomic evaluation with index development for production and health traits, bull housing, health testing and collection scheduling at approved facilities, semen processing, quality evaluation and cryopreservation with straw inventory by sire and lot, health certification and export eligibility with country-specific testing requirements, distributor and technician network with tank management, liquid nitrogen service and inventory consignment, breeding program advising with mating recommendations and inbreeding avoidance for customer herds, sexed semen and embryo product lines with conception rate expectations, sire proof updates and inventory value adjustment on genetic evaluation changes

domain_name: bovine-genetics-semen-distribution
api_prefix: "/genetics"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: graph
  # graph: Sire is self-referential twice (sire_id, dam_sire_id) forming a pedigree DAG that the
  # inbreeding calculation traverses; GenomicEvaluation is self-referential (supersedes_evaluation_id);
  # StrawLot / ExportCertificate / Tank / ConsignmentTransfer form a cross-aggregate mesh rather than a tree.

  state_machine_shape: parallel
  # Sire carries two independent dimensions on one row (acquisition_status x collection_status);
  # collection_status contains the ELIGIBLE<->SUSPENDED cycle; ExportCertificate contains the
  # SUBMITTED->REJECTED->SUBMITTED resubmission cycle; GenomicEvaluation contains the
  # SUPERSEDED->PUBLISHED reinstatement cycle; CollectionBooking and StrawLot are branching.

  relationship_patterns:
    - one_to_many
    - self_referential      # Sire.sire_id / Sire.dam_sire_id / GenomicEvaluation.supersedes_evaluation_id / HealthTest.retest_of_test_id
    - cross_aggregate       # ConsignmentTransfer joins StrawLot + Distributor + Tank + ExportCertificate

  role_model: segregation_of_duties
  # The LabTechnician who QC-evaluated an Ejaculate may not release the StrawLot produced from it;
  # the StaffVeterinarian who recorded a sire's required HealthTest results may not issue that sire's
  # ExportCertificate. Other roles are peer-scoped on top of that constraint.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Human-readable facility code; unique across all Facility rows.
        constraints: "unique; 1-32 chars"
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country the facility physically sits in.
        constraints: "exactly 2 uppercase letters"
      - name: housing_capacity
        type: integer
        source: input
        description: Maximum number of Sire rows with acquisition_status == RESIDENT that may be housed here.
        constraints: ">= 1"
      - name: bench_capacity
        type: integer
        source: input
        description: Maximum number of CollectionBooking rows with status == SCHEDULED whose half-open [start_at, end_at) windows overlap one another at this facility.
        constraints: ">= 1"
      - name: approved_export_countries
        type: array
        source: input
        description: Array of ISO-3166 alpha-2 destination country codes this facility is approved to export semen to; consulted when an ExportCertificate is submitted.
        default: "[]"
      - name: approval_status
        type: enum
        source: system
        description: Regulatory approval posture of the facility.
        default: APPROVED
        constraints: "one of {APPROVED, SUSPENDED}"
      - name: suspension_reason
        type: string
        source: system
        description: Free-text reason captured on the APPROVED->SUSPENDED transition; null while APPROVED.
      - name: resident_sire_count
        type: integer
        source: computed
        description: "Count of Sire rows with housing_facility_id == this Facility.id AND acquisition_status == RESIDENT."
        default: 0

  - name: Sire
    parent: null
    common_fields: true
    fields:
      - name: registration_code
        type: string
        source: input
        description: Breed-association registration code; unique across all Sire rows.
        constraints: "unique; 1-32 chars"
      - name: breed
        type: enum
        source: input
        description: Breed of the bull.
        constraints: "one of {HOLSTEIN, JERSEY, ANGUS}"
      - name: birth_date
        type: string
        source: input
        description: Calendar birth date, YYYY-MM-DD.
      - name: sire_id
        type: string
        source: input
        description: "FK -> Sire.id; genetic father of this bull; null for a pedigree root. Must not create a cycle."
      - name: dam_sire_id
        type: string
        source: input
        description: "FK -> Sire.id; maternal grandsire (the dam's sire) of this bull; null when unknown."
      - name: acquisition_cost_cents
        type: integer
        source: input
        description: Cash paid to acquire the animal; 0 for an externally-referenced pedigree-only sire.
        constraints: ">= 0"
      - name: contract_price_cents
        type: integer
        source: system
        description: Price agreed on the PROSPECT->CONTRACTED transition; null before contracting.
      - name: acquisition_status
        type: enum
        source: system
        description: Commercial-ownership dimension of the sire lifecycle; evolves independently of collection_status.
        default: PROSPECT
        constraints: "one of {PROSPECT, CONTRACTED, RESIDENT, RETIRED}"
      - name: collection_status
        type: enum
        source: system
        description: Health/collection-eligibility dimension of the sire lifecycle; evolves independently of acquisition_status.
        default: NOT_HOUSED
        constraints: "one of {NOT_HOUSED, ISOLATION, ELIGIBLE, SUSPENDED, WITHDRAWN}"
      - name: housing_facility_id
        type: string
        source: system
        description: "FK -> Facility.id; facility the bull is housed at; set on the CONTRACTED->RESIDENT transition, null before it."
      - name: isolation_ends_at
        type: datetime
        source: computed
        description: "Instant isolation completes; set on housing as logical_clock + isolation_days * 86400 seconds. ISO 8601 UTC, three fractional digits."
      - name: isolation_days_applied
        type: integer
        source: system
        description: "isolation_days supplied on the CONTRACTED->RESIDENT housing transition, retained for export eligibility (CountryRequirement.min_isolation_days); null before housing."
      - name: suspension_reason
        type: string
        source: system
        description: "Reason token recorded when collection_status becomes SUSPENDED; one of {MANUAL, POSITIVE_TEST_RESULT, REQUIRED_TEST_EXPIRED, FACILITY_SUSPENDED}; null otherwise."
      - name: published_production_index
        type: number
        source: computed
        description: production_index of the sire's currently PUBLISHED GenomicEvaluation; 0.00 when the sire has none.
        default: 0.00
      - name: published_health_index
        type: number
        source: computed
        description: health_index of the sire's currently PUBLISHED GenomicEvaluation; 0.00 when the sire has none.
        default: 0.00
      - name: published_composite_index
        type: number
        source: computed
        description: composite_index of the sire's currently PUBLISHED GenomicEvaluation; 0.00 when the sire has none. Drives market revaluation, mating-recommendation ranking and conception-rate expectation.
        default: 0.00
      - name: published_evaluation_effective_at
        type: datetime
        source: computed
        description: effective_at of the sire's currently PUBLISHED GenomicEvaluation; null when the sire has none.
      - name: progeny_daughter_count
        type: integer
        source: computed
        description: progeny_daughter_count carried by the sire's currently PUBLISHED GenomicEvaluation; 0 when the sire has none.
        default: 0
      - name: pedigree_depth
        type: integer
        source: computed
        description: "0 when both sire_id and dam_sire_id are null, otherwise 1 + max(pedigree_depth of the non-null parents); computed at creation from the pedigree DAG."
        default: 0
      - name: collection_count
        type: integer
        source: computed
        description: "Count of CollectionBooking rows with sire_id == this Sire.id AND status == COMPLETED."
        default: 0

  - name: GenomicEvaluation
    parent: Sire
    common_fields: true
    fields:
      - name: sire_id
        type: string
        source: input
        description: "FK -> Sire.id; the evaluated bull (taken from the request path)."
      - name: milk_kg
        type: number
        source: input
        description: Predicted transmitting ability for milk yield, kilograms.
      - name: fat_kg
        type: number
        source: input
        description: Predicted transmitting ability for fat yield, kilograms.
      - name: protein_kg
        type: number
        source: input
        description: Predicted transmitting ability for protein yield, kilograms.
      - name: somatic_cell_score
        type: number
        source: input
        description: Somatic cell score (lower is healthier); enters health_raw as (3.00 - somatic_cell_score) * 100.
      - name: fertility_pct
        type: number
        source: input
        description: Daughter pregnancy-rate deviation in percentage points.
      - name: longevity_months
        type: number
        source: input
        description: Productive-life deviation in months.
      - name: reliability_pct
        type: number
        source: input
        description: Reliability of the evaluation, 0-99; clamped into the shrink factor.
        constraints: ">= 0 and <= 99"
      - name: progeny_daughter_count
        type: integer
        source: input
        description: Number of milking daughters contributing progeny data; selects the evaluation_basis variant at the 50-daughter boundary.
        constraints: ">= 0"
      - name: effective_at
        type: datetime
        source: input
        description: Instant this evaluation becomes the sire's official proof once PUBLISHED. ISO 8601 UTC, three fractional digits.
      - name: evaluation_basis
        type: enum
        source: computed
        description: "PROGENY_BLENDED when progeny_daughter_count >= 50, otherwise GENOMIC_ONLY; selects the parent-average blending weight."
        constraints: "one of {GENOMIC_ONLY, PROGENY_BLENDED}"
      - name: parent_average_index
        type: number
        source: computed
        description: "round_half_up((published_composite_index of sire_id's father + published_composite_index of sire_id's maternal grandsire) / 2, 2); a null parent contributes 0.00. Pinned at creation time."
      - name: parent_average_weight
        type: number
        source: computed
        description: Weight given to parent_average_index in composite_index; depends on evaluation_basis and progeny_daughter_count.
      - name: production_index
        type: number
        source: computed
        description: "round_half_up(production_raw * shrink, 2) per calculations.sire_genetic_index."
      - name: health_index
        type: number
        source: computed
        description: "round_half_up(health_raw * shrink, 2) per calculations.sire_genetic_index."
      - name: composite_index
        type: number
        source: computed
        description: Blend of the rounded production_index / health_index with parent_average_index per calculations.sire_genetic_index.
      - name: status
        type: enum
        source: system
        description: Publication lifecycle of the proof.
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, SUPERSEDED, ROLLED_BACK}"
      - name: supersedes_evaluation_id
        type: string
        source: system
        description: "FK -> GenomicEvaluation.id; the evaluation this one displaced on publication; null when it was the sire's first published proof."
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of the DRAFT->PUBLISHED transition; null while DRAFT.
      - name: revaluation_delta_cents
        type: integer
        source: computed
        description: plant_inventory_value_cents immediately after publication minus the value immediately before it; 0 while DRAFT.
        default: 0

  - name: HealthTest
    parent: Sire
    common_fields: true
    fields:
      - name: sire_id
        type: string
        source: input
        description: "FK -> Sire.id; bull the sample was drawn from (taken from the request path)."
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; facility where the sample was drawn."
      - name: test_type
        type: enum
        source: input
        description: Disease assay performed.
        constraints: "one of {BLUETONGUE, IBR, BVD, TRICHOMONIASIS, EBL, BRUCELLOSIS}"
      - name: sample_date
        type: datetime
        source: input
        description: Instant the sample was drawn; must not be after the logical clock. ISO 8601 UTC, three fractional digits.
      - name: validity_days
        type: integer
        source: input
        description: Number of days a NEGATIVE result stays current; drives valid_until.
        constraints: ">= 1"
      - name: result
        type: enum
        source: system
        description: Assay outcome.
        default: PENDING
        constraints: "one of {PENDING, NEGATIVE, POSITIVE, INCONCLUSIVE, EXPIRED}"
      - name: valid_until
        type: datetime
        source: computed
        description: "sample_date + validity_days * 86400 seconds; set only when result becomes NEGATIVE, null otherwise."
      - name: resulted_at
        type: datetime
        source: system
        description: Logical-clock instant the result was recorded; null while PENDING.
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the StaffVeterinarian who recorded the result; null while PENDING. Consulted by the certificate-issuing segregation-of-duties check.
      - name: retest_of_test_id
        type: string
        source: input
        description: "FK -> HealthTest.id; the INCONCLUSIVE test this sample re-runs; null for a first-line test."

  - name: CollectionBooking
    parent: Facility
    common_fields: true
    fields:
      - name: sire_id
        type: string
        source: input
        description: "FK -> Sire.id; bull booked into the collection bench."
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; facility owning the bench window."
      - name: start_at
        type: datetime
        source: input
        description: Inclusive start of the bench window. ISO 8601 UTC, three fractional digits.
      - name: end_at
        type: datetime
        source: input
        description: Exclusive end of the bench window; windows are half-open [start_at, end_at).
      - name: status
        type: enum
        source: system
        description: Booking lifecycle; CANCELLED is operator-initiated, VOIDED is system-cascaded.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED, VOIDED}"
      - name: cancel_reason
        type: string
        source: system
        description: "Reason token; operator text on CANCELLED, one of {SIRE_SUSPENDED, FACILITY_SUSPENDED} on VOIDED; null while SCHEDULED or COMPLETED."
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant of the SCHEDULED->COMPLETED transition; null otherwise.
      - name: collected_by_ref
        type: string
        source: system
        description: Free-text collector reference captured at completion; null otherwise.

  - name: Ejaculate
    parent: CollectionBooking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: system
        description: "FK -> CollectionBooking.id; booking whose completion created this row."
      - name: sire_id
        type: string
        source: system
        description: "FK -> Sire.id; copied from the booking."
      - name: volume_ml
        type: number
        source: system
        description: Raw ejaculate volume in millilitres, from the completion payload.
      - name: concentration_m_per_ml
        type: number
        source: system
        description: Sperm concentration in millions of cells per millilitre, from the completion payload.
      - name: motility_pct
        type: number
        source: system
        description: Fresh (pre-freeze) motility percentage, from the completion payload.
      - name: collected_at
        type: datetime
        source: system
        description: Logical-clock instant at booking completion.
      - name: collected_by_ref
        type: string
        source: system
        description: Free-text collector reference copied from the completion payload.
      - name: total_doses_theoretical
        type: integer
        source: computed
        description: "floor(volume_ml * concentration_m_per_ml / 15) using DOSE_SPERM_MILLIONS = 15; caps the straw_count of every StrawLot cut from this ejaculate."
      - name: qc_status
        type: enum
        source: system
        description: Laboratory quality-evaluation outcome.
        default: PENDING_QC
        constraints: "one of {PENDING_QC, ACCEPTED, REJECTED}"
      - name: post_thaw_motility_pct
        type: number
        source: system
        description: Post-thaw motility percentage recorded during QC; null while PENDING_QC. Feeds expected_conception_rate.
      - name: morphology_normal_pct
        type: number
        source: system
        description: Percentage of morphologically normal cells recorded during QC; null while PENDING_QC.
      - name: evaluated_by_user_id
        type: string
        source: system
        description: X-User-ID of the LabTechnician who performed QC; null while PENDING_QC. The lot-release segregation-of-duties check rejects this same user.
      - name: qc_decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the QC decision; null while PENDING_QC.

  - name: StrawLot
    parent: Ejaculate
    common_fields: true
    fields:
      - name: ejaculate_id
        type: string
        source: input
        description: "FK -> Ejaculate.id; ejaculate this lot was cut from (taken from the request path)."
      - name: sire_id
        type: string
        source: system
        description: "FK -> Sire.id; copied from the ejaculate; the inventory axis 'by sire'."
      - name: product_line
        type: enum
        source: input
        description: Product line the lot was processed into.
        constraints: "one of {CONVENTIONAL, SEXED, EMBRYO}"
      - name: straw_count
        type: integer
        source: input
        description: Number of straws (doses) cryopreserved in this lot; the conserved total of the dose ledger.
        constraints: ">= 1 and <= ejaculate.total_doses_theoretical"
      - name: sexing_purity_pct
        type: number
        source: input
        description: Sorted-sperm purity percentage; required when product_line == SEXED, must be null otherwise.
        constraints: "when present, > 0 and <= 100"
      - name: processing_cost_cents
        type: integer
        source: input
        description: Total laboratory cost pool assigned to this lot; drives the STANDARD_COST valuation variant.
        constraints: ">= 1"
      - name: distribution_status
        type: enum
        source: system
        description: Release posture of the lot; gates every consignment and export operation.
        default: QUARANTINE
        constraints: "one of {QUARANTINE, RELEASED, REJECTED, DEPLETED}"
      - name: doses_available
        type: integer
        source: system
        description: Doses on the shelf and unencumbered; initialised to straw_count.
      - name: doses_reserved
        type: integer
        source: system
        description: Doses committed to an APPROVED or IN_TRANSIT ConsignmentTransfer or an ACCEPTED MatingRecommendation but not yet at a distributor.
        default: 0
      - name: doses_consigned
        type: integer
        source: system
        description: Doses physically held by a distributor under a RECEIVED ConsignmentTransfer while still owned by the plant.
        default: 0
      - name: doses_used
        type: integer
        source: system
        description: Doses reported as inseminated and settled; terminal.
        default: 0
      - name: doses_destroyed
        type: integer
        source: system
        description: Doses written off when the lot is rejected; terminal.
        default: 0
      - name: unit_book_value_cents
        type: integer
        source: computed
        description: Per-dose carrying value; STANDARD_COST at processing, MARKET_REVALUED after a proof publication for this lot's sire.
      - name: valuation_basis
        type: enum
        source: computed
        description: Which valuation variant produced unit_book_value_cents.
        default: STANDARD_COST
        constraints: "one of {STANDARD_COST, MARKET_REVALUED}"
      - name: pre_revaluation_unit_value_cents
        type: integer
        source: system
        description: Snapshot of unit_book_value_cents taken immediately before the most recent market revaluation; restored verbatim on evaluation rollback. Null before any revaluation.
      - name: released_by_user_id
        type: string
        source: system
        description: X-User-ID of the LabTechnician who released the lot; null while QUARANTINE.
      - name: rejected_reason
        type: string
        source: system
        description: Reason text captured on the QUARANTINE->REJECTED transition; null otherwise.

  - name: CountryRequirement
    parent: null
    common_fields: true
    fields:
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 destination country; unique across all CountryRequirement rows.
        constraints: "unique; exactly 2 uppercase letters"
      - name: required_test_types
        type: array
        source: input
        description: Array of HealthTest.test_type values this destination demands for every exported lot.
        constraints: "non-empty; each element one of {BLUETONGUE, IBR, BVD, TRICHOMONIASIS, EBL, BRUCELLOSIS}"
      - name: max_test_age_days
        type: integer
        source: input
        description: Maximum permitted age, in days, of each required test's sample_date measured against the logical clock at issuance.
        constraints: ">= 1"
      - name: min_isolation_days
        type: integer
        source: input
        description: Minimum isolation period this destination demands; the sire's housing isolation_days must be at least this value.
        constraints: ">= 0"
      - name: sexed_semen_allowed
        type: boolean
        source: input
        description: Whether product_line == SEXED lots may be certified for this destination.
      - name: embryo_allowed
        type: boolean
        source: input
        description: Whether product_line == EMBRYO lots may be certified for this destination.

  - name: ExportCertificate
    parent: StrawLot
    common_fields: true
    fields:
      - name: sire_id
        type: string
        source: input
        description: "FK -> Sire.id; bull whose health status the certificate attests."
      - name: straw_lot_id
        type: string
        source: input
        description: "FK -> StrawLot.id; the single lot this certificate covers."
      - name: country_requirement_id
        type: string
        source: input
        description: "FK -> CountryRequirement.id; the destination rule set applied."
      - name: destination_country_code
        type: string
        source: computed
        description: Copied from the referenced CountryRequirement.country_code at creation.
      - name: status
        type: enum
        source: system
        description: Certification lifecycle; REJECTED can return to SUBMITTED for up to MAX_SUBMISSION_ROUNDS rounds.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ISSUED, REJECTED, REVOKED}"
      - name: submission_round
        type: integer
        source: system
        description: Number of times the certificate has entered SUBMITTED; incremented on each submission, capped at MAX_SUBMISSION_ROUNDS = 3.
        default: 0
      - name: rejection_reason
        type: string
        source: system
        description: Reason text captured on SUBMITTED->REJECTED; null otherwise.
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the signing StaffVeterinarian; null until ISSUED.
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of issuance; null until ISSUED.
      - name: expires_at
        type: datetime
        source: computed
        description: "Earliest valid_until across the HealthTest rows satisfying the destination's required_test_types at issuance; null until ISSUED."
      - name: revocation_reason
        type: string
        source: system
        description: "Reason token on ISSUED->REVOKED; one of {SIRE_SUSPENDED, LOT_REJECTED}; null otherwise."

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the distribution partner.
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country the distributor operates in; when it differs from PLANT_COUNTRY_CODE ("US") every dispatch to it requires an ISSUED ExportCertificate.
        constraints: "exactly 2 uppercase letters"
      - name: credit_limit_cents
        type: integer
        source: input
        description: Maximum permitted exposure (consignment_value_cents + outstanding_balance_cents) before a consignment approval is refused.
        constraints: ">= 0"
      - name: consignment_enabled
        type: boolean
        source: input
        description: Feature flag; when false no ConsignmentTransfer may be approved for this distributor.
        default: true
      - name: consignment_value_cents
        type: integer
        source: computed
        description: "Sum over ConsignmentTransfer rows with distributor_id == this Distributor.id AND status == RECEIVED of doses_on_hand * StrawLot.unit_book_value_cents."
        default: 0
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Sum of settlement_total_cents over ConsignmentTransfer rows with distributor_id == this Distributor.id AND status == RECONCILED."
        default: 0
      - name: cumulative_doses_used
        type: integer
        source: computed
        description: "Sum of doses_used over ConsignmentTransfer rows with distributor_id == this Distributor.id AND status == RECONCILED."
        default: 0

  - name: Tank
    parent: Distributor
    common_fields: true
    fields:
      - name: serial
        type: string
        source: input
        description: Manufacturer serial of the liquid-nitrogen tank; unique across all Tank rows.
        constraints: "unique; 1-32 chars"
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; partner holding the tank."
      - name: capacity_straws
        type: integer
        source: input
        description: Maximum straws the tank may hold across all IN_TRANSIT and RECEIVED transfers pointing at it.
        constraints: ">= 1"
      - name: service_interval_days
        type: integer
        source: input
        description: Nominal liquid-nitrogen service interval in days; drives next_service_due_at.
        default: 60
        constraints: ">= 1"
      - name: assigned_technician_name
        type: string
        source: input
        description: Name of the field technician responsible for this tank; null when unassigned.
      - name: technician_cert_expiry_at
        type: datetime
        source: input
        description: Instant the assigned technician's certification lapses; null when unassigned.
      - name: last_service_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent fill; set to the clock at creation.
      - name: last_service_fill_pct
        type: number
        source: system
        description: Liquid-nitrogen level the tank was filled to at last_service_at; the decay curve's origin.
      - name: next_service_due_at
        type: datetime
        source: computed
        description: "last_service_at + service_interval_days * 86400 seconds."
      - name: ln2_level_pct
        type: number
        source: computed
        description: "max(0, last_service_fill_pct - 2.0 * floor((logical_clock - last_service_at) / 86400)) per calculations.tank_ln2_level."
      - name: service_count
        type: integer
        source: system
        description: Number of completed liquid-nitrogen services; incremented on every service call.
        default: 0
      - name: tank_status
        type: enum
        source: system
        description: Serviceability posture; gates dispatch of consignments into this tank.
        default: IN_SERVICE
        constraints: "one of {IN_SERVICE, SERVICE_DUE, OUT_OF_SERVICE}"
      - name: straws_on_hand
        type: integer
        source: computed
        description: "Sum of doses_on_hand over ConsignmentTransfer rows with tank_id == this Tank.id AND status IN {IN_TRANSIT, RECEIVED}."
        default: 0

  - name: ConsignmentTransfer
    parent: StrawLot
    common_fields: true
    fields:
      - name: straw_lot_id
        type: string
        source: input
        description: "FK -> StrawLot.id; lot the doses are drawn from (taken from the request path)."
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; consignee."
      - name: tank_id
        type: string
        source: input
        description: "FK -> Tank.id; destination tank; must belong to distributor_id."
      - name: export_certificate_id
        type: string
        source: input
        description: "FK -> ExportCertificate.id; certificate authorising a cross-border dispatch; null for a domestic transfer."
      - name: doses
        type: integer
        source: input
        description: Number of doses consigned.
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: input
        description: Agreed price per dose charged to the distributor at settlement.
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Consignment lifecycle.
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, IN_TRANSIT, RECEIVED, RECONCILED, REJECTED, RETURNED}"
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the approving ProgramDirector; null before approval.
      - name: rejection_reason
        type: string
        source: system
        description: Reason text captured on REQUESTED->REJECTED; null otherwise.
      - name: tank_service_count_at_dispatch
        type: integer
        source: system
        description: Snapshot of Tank.service_count taken on APPROVED->IN_TRANSIT; the baseline for the settlement service fee.
      - name: doses_used
        type: integer
        source: system
        description: Doses the distributor reported as inseminated at reconciliation.
        default: 0
      - name: doses_returned
        type: integer
        source: system
        description: Doses the distributor sent back at reconciliation or on a full return.
        default: 0
      - name: doses_on_hand
        type: integer
        source: computed
        description: "doses - doses_used - doses_returned."
      - name: carried_value_cents
        type: integer
        source: computed
        description: "doses_on_hand * StrawLot.unit_book_value_cents while status == RECEIVED, 0 in every other status."
        default: 0
      - name: gross_cents
        type: integer
        source: computed
        description: "doses_used * unit_price_cents; null before reconciliation."
      - name: service_fee_cents
        type: integer
        source: computed
        description: "12000 * (Tank.service_count - tank_service_count_at_dispatch); null before reconciliation."
      - name: rebate_cents
        type: integer
        source: computed
        description: Volume rebate selected from the pre-rebate subtotal tier and applied to gross_cents only; null before reconciliation.
      - name: settlement_total_cents
        type: integer
        source: computed
        description: "gross_cents + service_fee_cents - rebate_cents; null before reconciliation."
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant of the IN_TRANSIT->RECEIVED transition; null before it.

  - name: CustomerHerd
    parent: Distributor
    common_fields: true
    fields:
      - name: herd_name
        type: string
        source: input
        description: Customer herd name.
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; partner servicing the herd."
      - name: base_sire_id
        type: string
        source: input
        description: "FK -> Sire.id; the herd's incumbent herd-sire, excluded from every mating recommendation for this herd; null when none."
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of the herd.
        constraints: "exactly 2 uppercase letters"
      - name: target_product_line
        type: enum
        source: input
        description: Product line the herd normally buys; recorded for advisory context.
        constraints: "one of {CONVENTIONAL, SEXED, EMBRYO}"
      - name: max_inbreeding_pct
        type: number
        source: input
        description: Highest inbreeding coefficient (percent) the herd will accept; candidate sires above it are filtered out of the recommendation pool.
        default: 6.25
        constraints: "> 0 and <= 25"
      - name: recommendation_count
        type: integer
        source: computed
        description: "Count of MatingRecommendation rows with customer_herd_id == this CustomerHerd.id AND status IN {PROPOSED, ACCEPTED}."
        default: 0

  - name: MatingRecommendation
    parent: CustomerHerd
    common_fields: true
    fields:
      - name: customer_herd_id
        type: string
        source: input
        description: "FK -> CustomerHerd.id; herd being advised (taken from the request path)."
      - name: dam_ref
        type: string
        source: input
        description: Customer-side identifier of the cow to be bred.
      - name: dam_sire_id
        type: string
        source: input
        description: "FK -> Sire.id; the dam's own sire; the maternal side of the inbreeding computation. Null means no pedigree overlap is possible."
      - name: requested_product_line
        type: enum
        source: input
        description: Product line requested for this mating.
        constraints: "one of {CONVENTIONAL, SEXED, EMBRYO}"
      - name: doses_requested
        type: integer
        source: input
        description: Doses the customer wants committed if the recommendation is accepted.
        constraints: ">= 1"
      - name: excluded_sire_ids
        type: array
        source: input
        description: Sire ids the customer refuses; removed from the candidate pool before ranking.
        default: "[]"
      - name: recommended_sire_id
        type: string
        source: computed
        description: "FK -> Sire.id; the sire the server selected per calculations.mating_sire_selector."
      - name: straw_lot_id
        type: string
        source: computed
        description: "FK -> StrawLot.id; the lot the server selected to fill the request per calculations.mating_sire_selector."
      - name: inbreeding_pct
        type: number
        source: computed
        description: Wright inbreeding coefficient (percent) of the recommended mating per calculations.inbreeding_coefficient.
      - name: expected_conception_rate
        type: number
        source: computed
        description: Expected conception rate as a 0-1 fraction with 4 decimals per calculations.expected_conception_rate.
      - name: candidate_pool_size
        type: integer
        source: computed
        description: Number of sires that survived the eligibility filter before ranking.
      - name: status
        type: enum
        source: system
        description: Advisory lifecycle.
        default: PROPOSED
        constraints: "one of {PROPOSED, ACCEPTED, WITHDRAWN}"
      - name: doses_committed
        type: integer
        source: system
        description: Doses reserved on straw_lot_id when the recommendation was accepted; 0 otherwise.
        default: 0
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the PROPOSED->ACCEPTED or PROPOSED->WITHDRAWN transition; null while PROPOSED.

state_machines:
  # ---- Sire dimension 1 of 2: commercial ownership. Evolves independently of collection_status. ----
  - entity: Sire
    field: acquisition_status
    initial_state: PROSPECT
    terminal_states: [RETIRED]
    note: |
      Parallel dimension. A Sire row carries acquisition_status AND collection_status at the same time;
      neither dimension is a function of the other. A PROSPECT sire may be referenced as a pedigree
      parent and may carry PUBLISHED evaluations while never entering the barn.
    transitions:
      - from: PROSPECT
        to: CONTRACTED
        trigger: "POST /genetics/sires/{id}/contract"
        actor: ProgramDirector
        preconditions:
          - "sire.acquisition_status == PROSPECT"
        side_effects:
          - "sets contract_price_cents from the payload"
          - "increments Sire.version by 1 and refreshes updated_at"
      - from: CONTRACTED
        to: RESIDENT
        trigger: "POST /genetics/sires/{id}/house"
        actor: ProgramDirector
        preconditions:
          - "sire.acquisition_status == CONTRACTED"
          - "target Facility.approval_status == APPROVED"
          - "target Facility.resident_sire_count < target Facility.housing_capacity"
        side_effects:
          - "sets housing_facility_id to the payload facility_id"
          - "sets isolation_ends_at = logical_clock + isolation_days * 86400 seconds"
          - "advances collection_status NOT_HOUSED -> ISOLATION on the same row (parallel dimension)"
          - "recomputes Facility.resident_sire_count for the target facility"
          - "increments Sire.version by 1 and refreshes updated_at"
      - from: RESIDENT
        to: RETIRED
        trigger: "POST /genetics/sires/{id}/retire"
        actor: ProgramDirector
        preconditions:
          - "sire.acquisition_status == RESIDENT"
        side_effects:
          - "advances collection_status to WITHDRAWN on the same row (parallel dimension)"
          - "every CollectionBooking with sire_id == this sire and status == SCHEDULED becomes VOIDED with cancel_reason SIRE_SUSPENDED"
          - "recomputes Facility.resident_sire_count for housing_facility_id"
          - "increments Sire.version by 1 and refreshes updated_at"

  # ---- Sire dimension 2 of 2: collection eligibility. Contains the ELIGIBLE <-> SUSPENDED cycle. ----
  - entity: Sire
    field: collection_status
    initial_state: NOT_HOUSED
    terminal_states: [WITHDRAWN]
    note: |
      Cyclic dimension: ELIGIBLE -> SUSPENDED -> ELIGIBLE may repeat without bound. Suspension arrives
      from four distinct causes (operator, positive result, test expiry, facility suspension) and the
      reinstatement precondition re-checks the full required-test set each time.
    transitions:
      - from: NOT_HOUSED
        to: ISOLATION
        trigger: "POST /genetics/sires/{id}/house (same call that advances acquisition_status CONTRACTED -> RESIDENT)"
        actor: ProgramDirector
        preconditions:
          - "sire.collection_status == NOT_HOUSED"
        side_effects:
          - "sets isolation_ends_at as described on the acquisition dimension"
      - from: ISOLATION
        to: ELIGIBLE
        trigger: "POST /genetics/sires/{id}/collection-clearance"
        actor: StaffVeterinarian
        preconditions:
          - "sire.collection_status == ISOLATION"
          - "logical_clock >= sire.isolation_ends_at"
          - "for every test_type in REQUIRED_BASE_TEST_TYPES {BLUETONGUE, IBR, BVD, TRICHOMONIASIS} there is a HealthTest with sire_id == this sire, result == NEGATIVE and valid_until > logical_clock"
        side_effects:
          - "clears suspension_reason"
          - "increments Sire.version by 1 and refreshes updated_at"
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "POST /genetics/sires/{id}/collection-status with collection_status SUSPENDED"
        actor: StaffVeterinarian
        preconditions:
          - "sire.collection_status == ELIGIBLE"
        side_effects:
          - "sets suspension_reason = MANUAL"
          - "every CollectionBooking with sire_id == this sire, status == SCHEDULED and start_at >= logical_clock becomes VOIDED with cancel_reason SIRE_SUSPENDED"
          - "every ExportCertificate with sire_id == this sire and status == ISSUED becomes REVOKED with revocation_reason SIRE_SUSPENDED"
          - "increments Sire.version by 1 and refreshes updated_at"
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "system: POST /genetics/health-tests/{id}/result records POSITIVE for a test_type in REQUIRED_BASE_TEST_TYPES"
        actor: system
        preconditions:
          - "sire.collection_status == ELIGIBLE"
        side_effects:
          - "sets suspension_reason = POSITIVE_TEST_RESULT"
          - "cascade hop 2: every CollectionBooking with sire_id == this sire, status == SCHEDULED and start_at >= logical_clock becomes VOIDED with cancel_reason SIRE_SUSPENDED"
          - "cascade hop 2: every ExportCertificate with sire_id == this sire and status == ISSUED becomes REVOKED with revocation_reason SIRE_SUSPENDED"
          - "increments Sire.version by 1 and refreshes updated_at"
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "system: POST /genetics/_clock/set_current_utc expires the last current NEGATIVE HealthTest of a REQUIRED_BASE_TEST_TYPES type"
        actor: system
        preconditions:
          - "sire.collection_status == ELIGIBLE"
          - "after the clock move, at least one test_type in REQUIRED_BASE_TEST_TYPES has no HealthTest with result == NEGATIVE and valid_until > logical_clock"
        side_effects:
          - "sets suspension_reason = REQUIRED_TEST_EXPIRED"
          - "cascade hop 3: every CollectionBooking with sire_id == this sire, status == SCHEDULED and start_at >= logical_clock becomes VOIDED with cancel_reason SIRE_SUSPENDED"
          - "cascade hop 3: every ExportCertificate with sire_id == this sire and status == ISSUED becomes REVOKED with revocation_reason SIRE_SUSPENDED"
          - "increments Sire.version by 1 and refreshes updated_at"
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "system: POST /genetics/facilities/{id}/approval-status with approval_status SUSPENDED, for every RESIDENT sire housed there"
        actor: system
        preconditions:
          - "sire.collection_status == ELIGIBLE"
          - "sire.housing_facility_id == the suspended facility"
        side_effects:
          - "sets suspension_reason = FACILITY_SUSPENDED"
          - "cascade hop 2: every CollectionBooking with sire_id == this sire, status == SCHEDULED and start_at >= logical_clock becomes VOIDED with cancel_reason FACILITY_SUSPENDED"
          - "increments Sire.version by 1 and refreshes updated_at"
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "POST /genetics/sires/{id}/collection-status with collection_status ELIGIBLE"
        actor: StaffVeterinarian
        preconditions:
          - "sire.collection_status == SUSPENDED"
          - "sire.acquisition_status == RESIDENT"
          - "housing Facility.approval_status == APPROVED"
          - "for every test_type in REQUIRED_BASE_TEST_TYPES there is a HealthTest with sire_id == this sire, result == NEGATIVE and valid_until > logical_clock"
        side_effects:
          - "clears suspension_reason"
          - "increments Sire.version by 1 and refreshes updated_at"
        note: "Closes the cycle; the sire may be suspended and reinstated any number of times."
      - from: ISOLATION
        to: WITHDRAWN
        trigger: "POST /genetics/sires/{id}/retire"
        actor: ProgramDirector
        preconditions:
          - "sire.acquisition_status == RESIDENT"
        side_effects:
          - "see the acquisition dimension's RESIDENT -> RETIRED side effects"
      - from: ELIGIBLE
        to: WITHDRAWN
        trigger: "POST /genetics/sires/{id}/retire"
        actor: ProgramDirector
        preconditions:
          - "sire.acquisition_status == RESIDENT"
        side_effects:
          - "see the acquisition dimension's RESIDENT -> RETIRED side effects"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /genetics/sires/{id}/retire"
        actor: ProgramDirector
        preconditions:
          - "sire.acquisition_status == RESIDENT"
        side_effects:
          - "see the acquisition dimension's RESIDENT -> RETIRED side effects"

  - entity: Facility
    field: approval_status
    initial_state: APPROVED
    terminal_states: []
    note: "Cyclic: APPROVED -> SUSPENDED -> APPROVED. Suspension is the head of a three-hop cascade."
    transitions:
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /genetics/facilities/{id}/approval-status with approval_status SUSPENDED"
        actor: ProgramDirector
        preconditions:
          - "facility.approval_status == APPROVED"
        side_effects:
          - "sets suspension_reason from the payload"
          - "cascade hop 1: every Sire with housing_facility_id == this facility and collection_status == ELIGIBLE becomes SUSPENDED with suspension_reason FACILITY_SUSPENDED"
          - "cascade hop 2 (caused by hop 1): each of those sires' CollectionBooking rows with status == SCHEDULED and start_at >= logical_clock become VOIDED with cancel_reason FACILITY_SUSPENDED"
          - "increments Facility.version by 1 and refreshes updated_at"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /genetics/facilities/{id}/approval-status with approval_status APPROVED"
        actor: ProgramDirector
        preconditions:
          - "facility.approval_status == SUSPENDED"
        side_effects:
          - "clears suspension_reason"
          - "does NOT reinstate sires or bookings; each sire must be reinstated explicitly through POST /genetics/sires/{id}/collection-status"
          - "increments Facility.version by 1 and refreshes updated_at"

  - entity: HealthTest
    field: result
    initial_state: PENDING
    terminal_states: [POSITIVE, INCONCLUSIVE, EXPIRED]
    note: "Branching: one PENDING row resolves into one of three outcomes with divergent side-effect sets; only the NEGATIVE branch can later expire."
    transitions:
      - from: PENDING
        to: NEGATIVE
        trigger: "POST /genetics/health-tests/{id}/result with result NEGATIVE"
        actor: StaffVeterinarian
        preconditions:
          - "test.result == PENDING"
        side_effects:
          - "sets valid_until = sample_date + validity_days * 86400 seconds"
          - "sets resulted_at = logical_clock and recorded_by_user_id = X-User-ID"
      - from: PENDING
        to: POSITIVE
        trigger: "POST /genetics/health-tests/{id}/result with result POSITIVE"
        actor: StaffVeterinarian
        preconditions:
          - "test.result == PENDING"
        side_effects:
          - "leaves valid_until null"
          - "sets resulted_at = logical_clock and recorded_by_user_id = X-User-ID"
          - "cascade hop 1: when test_type is in REQUIRED_BASE_TEST_TYPES and the sire's collection_status == ELIGIBLE, the sire becomes SUSPENDED with suspension_reason POSITIVE_TEST_RESULT"
      - from: PENDING
        to: INCONCLUSIVE
        trigger: "POST /genetics/health-tests/{id}/result with result INCONCLUSIVE"
        actor: StaffVeterinarian
        preconditions:
          - "test.result == PENDING"
        side_effects:
          - "leaves valid_until null; the sire's collection_status is untouched"
          - "sets resulted_at = logical_clock and recorded_by_user_id = X-User-ID"
          - "unlocks creation of a retest whose retest_of_test_id points at this row"
      - from: NEGATIVE
        to: EXPIRED
        trigger: "system: POST /genetics/_clock/set_current_utc moves the clock to or past valid_until"
        actor: system
        preconditions:
          - "test.result == NEGATIVE"
          - "logical_clock >= test.valid_until"
        side_effects:
          - "cascade hop 1: triggers the sire's ELIGIBLE -> SUSPENDED (REQUIRED_TEST_EXPIRED) transition when this was the last current test of a REQUIRED_BASE_TEST_TYPES type"

  - entity: CollectionBooking
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, VOIDED]
    note: "Branching with divergent side effects: COMPLETED mints an Ejaculate, CANCELLED is operator-initiated and mints nothing, VOIDED is system-cascaded and records a machine reason token."
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /genetics/collection-bookings/{id}/complete"
        actor: FacilityManager
        preconditions:
          - "booking.status == SCHEDULED"
          - "logical_clock >= booking.start_at"
          - "Sire.collection_status == ELIGIBLE"
          - "Facility.approval_status == APPROVED"
          - "X-User-ID == booking.facility_id"
        side_effects:
          - "creates one Ejaculate with qc_status PENDING_QC, collected_at = logical_clock and total_doses_theoretical per calculations.ejaculate_theoretical_doses"
          - "sets completed_at = logical_clock and collected_by_ref from the payload"
          - "increments Sire.collection_count by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /genetics/collection-bookings/{id}/cancel"
        actor: FacilityManager
        preconditions:
          - "booking.status == SCHEDULED"
          - "X-User-ID == booking.facility_id"
        side_effects:
          - "sets cancel_reason from the payload"
          - "frees the sire's rest window and the facility bench slot for later bookings (CANCELLED and VOIDED bookings are excluded from both overlap checks)"
      - from: SCHEDULED
        to: VOIDED
        trigger: "system: sire suspension (any cause) or facility suspension"
        actor: system
        preconditions:
          - "booking.status == SCHEDULED"
          - "booking.start_at >= logical_clock"
        side_effects:
          - "sets cancel_reason to SIRE_SUSPENDED or FACILITY_SUSPENDED"
          - "frees the sire's rest window and the facility bench slot"

  - entity: Ejaculate
    field: qc_status
    initial_state: PENDING_QC
    terminal_states: [REJECTED]
    note: "Branching: ACCEPTED unlocks straw processing, REJECTED is terminal and no lot may be cut."
    transitions:
      - from: PENDING_QC
        to: ACCEPTED
        trigger: "POST /genetics/ejaculates/{id}/qc-evaluation with verdict ACCEPTED"
        actor: LabTechnician
        preconditions:
          - "ejaculate.qc_status == PENDING_QC"
          - "post_thaw_motility_pct >= 40.0 AND morphology_normal_pct >= 70.0"
        side_effects:
          - "stores post_thaw_motility_pct, morphology_normal_pct, qc_decided_at = logical_clock and evaluated_by_user_id = X-User-ID"
          - "unlocks POST /genetics/ejaculates/{id}/straw-lots"
      - from: PENDING_QC
        to: REJECTED
        trigger: "POST /genetics/ejaculates/{id}/qc-evaluation with verdict REJECTED"
        actor: LabTechnician
        preconditions:
          - "ejaculate.qc_status == PENDING_QC"
        side_effects:
          - "stores post_thaw_motility_pct, morphology_normal_pct, qc_decided_at = logical_clock and evaluated_by_user_id = X-User-ID"
          - "no StrawLot may ever be cut from this ejaculate"

  - entity: StrawLot
    field: distribution_status
    initial_state: QUARANTINE
    terminal_states: [REJECTED, DEPLETED]
    note: "Branching at the quarantine gate, then an automatic depletion transition driven by the dose ledger."
    transitions:
      - from: QUARANTINE
        to: RELEASED
        trigger: "POST /genetics/straw-lots/{id}/release"
        actor: LabTechnician
        preconditions:
          - "lot.distribution_status == QUARANTINE"
          - "X-User-ID != Ejaculate.evaluated_by_user_id of the parent ejaculate (segregation of duties)"
        side_effects:
          - "sets released_by_user_id = X-User-ID"
          - "unlocks POST /genetics/straw-lots/{id}/consignment-transfers, export certification and mating-recommendation selection"
          - "increments StrawLot.version by 1 and refreshes updated_at"
      - from: QUARANTINE
        to: REJECTED
        trigger: "POST /genetics/straw-lots/{id}/reject"
        actor: LabTechnician
        preconditions:
          - "lot.distribution_status == QUARANTINE"
        side_effects:
          - "moves the whole ledger: doses_destroyed += doses_available, then doses_available = 0 (straw_count stays the conserved total)"
          - "every ExportCertificate with straw_lot_id == this lot and status == ISSUED becomes REVOKED with revocation_reason LOT_REJECTED"
          - "removes the lot from plant_inventory_value_cents (REJECTED lots are excluded from the aggregate)"
          - "increments StrawLot.version by 1 and refreshes updated_at"
      - from: RELEASED
        to: DEPLETED
        trigger: "system: any ledger mutation that leaves doses_available == 0 AND doses_reserved == 0 AND doses_consigned == 0"
        actor: system
        preconditions:
          - "lot.distribution_status == RELEASED"
          - "doses_available == 0 AND doses_reserved == 0 AND doses_consigned == 0"
        side_effects:
          - "removes the lot from plant_inventory_value_cents (DEPLETED lots are excluded from the aggregate)"
          - "increments StrawLot.version by 1 and refreshes updated_at"

  - entity: GenomicEvaluation
    field: status
    initial_state: DRAFT
    terminal_states: [ROLLED_BACK]
    note: |
      Cyclic: SUPERSEDED -> PUBLISHED. Rolling back the current proof reinstates the evaluation it
      displaced, so a row may leave PUBLISHED and come back. Publication is the head of a four-hop
      value cascade and rollback is its exact compensating action.
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /genetics/genomic-evaluations/{id}/publish"
        actor: ProgramDirector
        preconditions:
          - "evaluation.status == DRAFT"
          - "evaluation.effective_at > Sire.published_evaluation_effective_at when the sire already has a PUBLISHED proof"
        side_effects:
          - "sets published_at = logical_clock; sets supersedes_evaluation_id to the sire's previously PUBLISHED evaluation id (null when there was none) and moves that previously published row from PUBLISHED to SUPERSEDED"
          - "cascade hop 1: refreshes Sire.published_production_index, published_health_index, published_composite_index, published_evaluation_effective_at and progeny_daughter_count from this evaluation; increments Sire.version by 1"
          - "cascade hop 2 (caused by hop 1): every StrawLot with sire_id == this sire and distribution_status IN {QUARANTINE, RELEASED} snapshots pre_revaluation_unit_value_cents = unit_book_value_cents, then recomputes unit_book_value_cents under the MARKET_REVALUED variant and sets valuation_basis = MARKET_REVALUED"
          - "cascade hop 3 (caused by hop 2): every ConsignmentTransfer with straw_lot_id in the revalued set and status == RECEIVED recomputes carried_value_cents = doses_on_hand * the new StrawLot.unit_book_value_cents"
          - "cascade hop 4 (caused by hop 3): every Distributor referenced by those transfers recomputes consignment_value_cents"
          - "sets revaluation_delta_cents = plant_inventory_value_cents after hop 2 minus plant_inventory_value_cents before hop 2"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: a later evaluation for the same sire is published"
        actor: system
        preconditions:
          - "evaluation.status == PUBLISHED"
        side_effects:
          - "stops contributing to Sire.published_* fields"
      - from: PUBLISHED
        to: ROLLED_BACK
        trigger: "POST /genetics/genomic-evaluations/{id}/rollback"
        actor: ProgramDirector
        preconditions:
          - "evaluation.status == PUBLISHED"
        side_effects:
          - "compensating hop 1: reinstates supersedes_evaluation_id's row SUPERSEDED -> PUBLISHED when it is non-null, and refreshes the Sire.published_* fields from it; when it is null the Sire.published_* index fields reset to 0.00, published_evaluation_effective_at to null and progeny_daughter_count to 0; increments Sire.version by 1"
          - "compensating hop 2: every StrawLot revalued by the rolled-back publication restores unit_book_value_cents = pre_revaluation_unit_value_cents verbatim, sets valuation_basis back to the basis that value came from and clears pre_revaluation_unit_value_cents"
          - "compensating hop 3: every ConsignmentTransfer with status == RECEIVED on those lots recomputes carried_value_cents from the restored unit value"
          - "compensating hop 4: every affected Distributor recomputes consignment_value_cents"
          - "invariant: plant_inventory_value_cents returns to exactly its pre-publication figure (see calculations.plant_inventory_value)"
      - from: SUPERSEDED
        to: PUBLISHED
        trigger: "system: POST /genetics/genomic-evaluations/{id}/rollback on the evaluation that superseded this row"
        actor: system
        preconditions:
          - "evaluation.status == SUPERSEDED"
          - "the rolled-back evaluation's supersedes_evaluation_id == this row's id"
        side_effects:
          - "becomes the sire's official proof again and repopulates the Sire.published_* fields"
        note: "Closes the cycle."

  - entity: ExportCertificate
    field: status
    initial_state: DRAFT
    terminal_states: [REVOKED]
    note: |
      Cyclic: SUBMITTED -> REJECTED -> SUBMITTED, bounded by MAX_SUBMISSION_ROUNDS = 3. The fourth
      submission attempt is refused, which is the cycle's termination condition.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /genetics/export-certificates/{id}/submit"
        actor: ExportCoordinator
        preconditions:
          - "certificate.status == DRAFT"
          - "certificate.submission_round < 3"
          - "the sire's housing Facility.approved_export_countries contains certificate.destination_country_code"
          - "the lot's product_line is permitted by the CountryRequirement flags (SEXED needs sexed_semen_allowed, EMBRYO needs embryo_allowed)"
        side_effects:
          - "increments submission_round by 1"
          - "clears rejection_reason"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /genetics/export-certificates/{id}/submit"
        actor: ExportCoordinator
        preconditions:
          - "certificate.status == REJECTED"
          - "certificate.submission_round < 3"
          - "the sire's housing Facility.approved_export_countries contains certificate.destination_country_code"
          - "the lot's product_line is permitted by the CountryRequirement flags"
        side_effects:
          - "increments submission_round by 1"
          - "clears rejection_reason"
        note: "Closes the resubmission cycle; the third rejection leaves submission_round == 3 and the next submit is refused."
      - from: SUBMITTED
        to: ISSUED
        trigger: "POST /genetics/export-certificates/{id}/issue"
        actor: StaffVeterinarian
        preconditions:
          - "certificate.status == SUBMITTED"
          - "StrawLot.distribution_status == RELEASED"
          - "for every test_type in CountryRequirement.required_test_types there is a HealthTest with sire_id == certificate.sire_id, result == NEGATIVE and valid_until > logical_clock"
          - "for each of those tests, (logical_clock - sample_date) <= CountryRequirement.max_test_age_days * 86400 seconds"
          - "X-User-ID is not the recorded_by_user_id of any of those satisfying tests (segregation of duties)"
        side_effects:
          - "sets issued_by_user_id = X-User-ID, issued_at = logical_clock"
          - "sets expires_at = the earliest valid_until across the satisfying HealthTest rows"
          - "unlocks cross-border dispatch of the referenced lot to a distributor whose country_code != PLANT_COUNTRY_CODE"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /genetics/export-certificates/{id}/reject"
        actor: StaffVeterinarian
        preconditions:
          - "certificate.status == SUBMITTED"
        side_effects:
          - "sets rejection_reason from the payload"
          - "leaves submission_round unchanged so the round counter reflects submissions, not rejections"
      - from: ISSUED
        to: REVOKED
        trigger: "system: the sire's collection_status becomes SUSPENDED (any cause), or the referenced lot is REJECTED"
        actor: system
        preconditions:
          - "certificate.status == ISSUED"
        side_effects:
          - "sets revocation_reason to SIRE_SUSPENDED or LOT_REJECTED"
          - "any ConsignmentTransfer still in REQUESTED or APPROVED that names this certificate can no longer be dispatched"

  - entity: ConsignmentTransfer
    field: status
    initial_state: REQUESTED
    terminal_states: [REJECTED, RECONCILED, RETURNED]
    note: |
      The dose-allocation spine. Every transition is a movement inside the StrawLot dose ledger and the
      sum doses_available + doses_reserved + doses_consigned + doses_used + doses_destroyed always equals
      straw_count (calculations.lot_dose_ledger).
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /genetics/consignment-transfers/{id}/approve"
        actor: ProgramDirector
        preconditions:
          - "transfer.status == REQUESTED"
          - "StrawLot.distribution_status == RELEASED"
          - "Sire health is current: every test_type in REQUIRED_BASE_TEST_TYPES has a HealthTest with result == NEGATIVE and valid_until > logical_clock for the lot's sire"
          - "Distributor.consignment_enabled == true"
          - "Tank.straws_on_hand + transfer.doses <= Tank.capacity_straws"
          - "StrawLot.doses_available >= transfer.doses"
          - "Distributor.consignment_value_cents + Distributor.outstanding_balance_cents + transfer.doses * StrawLot.unit_book_value_cents <= Distributor.credit_limit_cents"
        side_effects:
          - "ledger move: StrawLot.doses_available -= doses, StrawLot.doses_reserved += doses"
          - "sets approved_by_user_id = X-User-ID"
          - "increments StrawLot.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /genetics/consignment-transfers/{id}/reject"
        actor: ProgramDirector
        preconditions:
          - "transfer.status == REQUESTED"
        side_effects:
          - "sets rejection_reason from the payload"
          - "no ledger movement: the doses were never reserved"
      - from: APPROVED
        to: IN_TRANSIT
        trigger: "POST /genetics/consignment-transfers/{id}/dispatch"
        actor: ExportCoordinator
        preconditions:
          - "transfer.status == APPROVED"
          - "Tank.tank_status == IN_SERVICE"
          - "when Distributor.country_code != PLANT_COUNTRY_CODE (\"US\"): export_certificate_id is non-null, that certificate's status == ISSUED, its straw_lot_id == transfer.straw_lot_id and its destination_country_code == Distributor.country_code"
        side_effects:
          - "snapshots tank_service_count_at_dispatch = Tank.service_count"
          - "recomputes Tank.straws_on_hand (the doses now count against tank capacity)"
          - "no dose-ledger movement: the doses stay reserved"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /genetics/consignment-transfers/{id}/receive"
        actor: Distributor
        preconditions:
          - "transfer.status == IN_TRANSIT"
          - "X-User-ID == transfer.distributor_id"
        side_effects:
          - "ledger move: StrawLot.doses_reserved -= doses, StrawLot.doses_consigned += doses"
          - "sets received_at = logical_clock"
          - "sets carried_value_cents = doses_on_hand * StrawLot.unit_book_value_cents"
          - "recomputes Distributor.consignment_value_cents"
          - "increments StrawLot.version by 1"
      - from: RECEIVED
        to: RECONCILED
        trigger: "POST /genetics/consignment-transfers/{id}/report-usage"
        actor: Distributor
        preconditions:
          - "transfer.status == RECEIVED"
          - "X-User-ID == transfer.distributor_id"
          - "doses_used + doses_returned == transfer.doses"
        side_effects:
          - "stores doses_used and doses_returned from the payload"
          - "ledger move: StrawLot.doses_consigned -= doses, StrawLot.doses_used += doses_used, StrawLot.doses_available += doses_returned"
          - "computes gross_cents, service_fee_cents, rebate_cents and settlement_total_cents per calculations.consignment_settlement"
          - "sets carried_value_cents = 0 (doses_on_hand is 0 after reconciliation)"
          - "recomputes Distributor.consignment_value_cents, outstanding_balance_cents and cumulative_doses_used"
          - "auto-transitions the StrawLot RELEASED -> DEPLETED when the ledger leaves available, reserved and consigned all at 0"
          - "increments StrawLot.version by 1"
      - from: RECEIVED
        to: RETURNED
        trigger: "POST /genetics/consignment-transfers/{id}/return"
        actor: Distributor
        preconditions:
          - "transfer.status == RECEIVED"
          - "X-User-ID == transfer.distributor_id"
          - "transfer.doses_used == 0"
        side_effects:
          - "compensating action: sets doses_returned = doses; ledger move StrawLot.doses_consigned -= doses, StrawLot.doses_available += doses"
          - "sets carried_value_cents = 0 and leaves settlement_total_cents null (nothing is billed)"
          - "recomputes Distributor.consignment_value_cents"
          - "invariant: StrawLot.doses_available returns to exactly its value immediately before the matching approve, and straw_count is unchanged"
          - "increments StrawLot.version by 1"

  - entity: Tank
    field: tank_status
    initial_state: IN_SERVICE
    terminal_states: []
    note: "Cyclic through service: IN_SERVICE -> SERVICE_DUE -> OUT_OF_SERVICE -> IN_SERVICE, driven by the liquid-nitrogen decay curve and the clock."
    transitions:
      - from: IN_SERVICE
        to: SERVICE_DUE
        trigger: "system: POST /genetics/_clock/set_current_utc recomputes calculations.tank_ln2_level"
        actor: system
        preconditions:
          - "tank.tank_status == IN_SERVICE"
          - "recomputed ln2_level_pct <= 25.0 AND recomputed ln2_level_pct > 0, OR logical_clock >= next_service_due_at"
        side_effects:
          - "tank remains dispatchable-blocking: dispatch requires IN_SERVICE, so APPROVED transfers into this tank stall until it is serviced"
      - from: SERVICE_DUE
        to: OUT_OF_SERVICE
        trigger: "system: POST /genetics/_clock/set_current_utc recomputes calculations.tank_ln2_level"
        actor: system
        preconditions:
          - "tank.tank_status == SERVICE_DUE"
          - "recomputed ln2_level_pct == 0"
        side_effects:
          - "tank cannot receive dispatches until serviced"
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "system: POST /genetics/_clock/set_current_utc recomputes calculations.tank_ln2_level"
        actor: system
        preconditions:
          - "tank.tank_status == IN_SERVICE"
          - "recomputed ln2_level_pct == 0"
        side_effects:
          - "a single large clock jump may skip SERVICE_DUE entirely"
      - from: SERVICE_DUE
        to: IN_SERVICE
        trigger: "POST /genetics/tanks/{id}/ln2-service"
        actor: Distributor
        preconditions:
          - "tank.tank_status IN {SERVICE_DUE, OUT_OF_SERVICE, IN_SERVICE}"
          - "X-User-ID == tank.distributor_id"
          - "payload filled_to_pct > the tank's currently recomputed ln2_level_pct"
        side_effects:
          - "sets last_service_at = logical_clock, last_service_fill_pct = filled_to_pct, resetting the decay curve"
          - "recomputes next_service_due_at = logical_clock + service_interval_days * 86400 seconds"
          - "increments service_count by 1, which raises the service fee of every RECEIVED transfer in this tank at reconciliation"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /genetics/tanks/{id}/ln2-service"
        actor: Distributor
        preconditions:
          - "X-User-ID == tank.distributor_id"
          - "payload filled_to_pct > the tank's currently recomputed ln2_level_pct"
        side_effects:
          - "same as the SERVICE_DUE -> IN_SERVICE service side effects"
        note: "Closes the service cycle."

  - entity: MatingRecommendation
    field: status
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, WITHDRAWN]
    note: "Branching: acceptance reserves doses on the selected lot, withdrawal reserves nothing."
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /genetics/mating-recommendations/{id}/decision with decision ACCEPTED"
        actor: BreedingAdvisor
        preconditions:
          - "recommendation.status == PROPOSED"
          - "StrawLot.distribution_status == RELEASED"
          - "StrawLot.doses_available >= recommendation.doses_requested"
        side_effects:
          - "sets doses_committed = doses_requested and decided_at = logical_clock"
          - "ledger move: StrawLot.doses_available -= doses_requested, StrawLot.doses_reserved += doses_requested"
          - "increments StrawLot.version by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /genetics/mating-recommendations/{id}/decision with decision WITHDRAWN"
        actor: BreedingAdvisor
        preconditions:
          - "recommendation.status == PROPOSED"
        side_effects:
          - "sets decided_at = logical_clock, leaves doses_committed at 0 and the lot ledger untouched"
          - "decrements CustomerHerd.recommendation_count"

concurrency_rules:
  - rule_id: evaluation-create-stale-sire
    parent_entity: Sire
    write_endpoint: "POST /genetics/sires/{id}/genomic-evaluations"
    occ_field: "expected_sire_version"
    description: |
      Creating a GenomicEvaluation for a Sire whose version has advanced since the client last read it
      is rejected with a stale-version error. Creating a draft proof is a legitimate supersede operation
      (once published it displaces the sire's current proof and revalues its whole straw inventory), so
      a second creation from an outdated view of the sire would otherwise be accepted on its own terms;
      the OCC check on Sire.version is what makes it deterministic which view of the sire the draft was
      derived from, including the parent_average_index pinned at creation.
    error_id: ERR_STALE_SIRE_VERSION
    http_status: 412

  - rule_id: transfer-create-stale-lot
    parent_entity: StrawLot
    write_endpoint: "POST /genetics/straw-lots/{id}/consignment-transfers"
    occ_field: "expected_straw_lot_version"
    description: |
      Requesting a ConsignmentTransfer against a StrawLot whose version has advanced since the client
      last read it is rejected with a stale-version error. A dose request is legitimate on its own terms
      whenever the lot is RELEASED, so the rejection cannot be derived from any state precondition; the
      OCC check on StrawLot.version pins the dose-ledger snapshot the request was sized against.
    error_id: ERR_STALE_STRAW_LOT_VERSION
    http_status: 412

calculations:
  - name: sire_genetic_index
    trigger: "POST /genetics/sires/{id}/genomic-evaluations (evaluated once at creation and frozen on the row)"
    algorithm: weighted_scoring
    formula: |
      # ---- step 1: raw trait aggregates (>= 3 inputs each) ----
      production_raw = W_MILK * milk_kg + W_FAT * fat_kg + W_PROTEIN * protein_kg
      health_raw     = W_SCS * (SCS_BASELINE - somatic_cell_score) * 100
                     + W_FERT * fertility_pct
                     + W_LONG * longevity_months
      # ---- step 2: reliability shrink, clamped on both ends (non-linear) ----
      shrink = min(SHRINK_MAX, max(SHRINK_MIN, reliability_pct / 100))
      # ---- step 3: rounding order is PINNED. The two sub-indices are rounded to 2 dp FIRST and the
      #             composite is computed from the ROUNDED sub-indices, then rounded again to 2 dp.
      production_index = round_half_up(production_raw * shrink, 2)
      health_index     = round_half_up(health_raw * shrink, 2)
      # ---- step 4: variant selection at the progeny boundary (>= , not >) ----
      if progeny_daughter_count >= PROGENY_BLEND_MIN:      # 50
          evaluation_basis      = "PROGENY_BLENDED"
          parent_average_weight = max(PAW_FLOOR, PAW_BASE - PAW_SLOPE * min(progeny_daughter_count, PAW_CAP_DAUGHTERS))
      else:
          evaluation_basis      = "GENOMIC_ONLY"
          parent_average_weight = PAW_BASE                  # 0.50
      # ---- step 5: parent average, pinned to the parents' CURRENTLY PUBLISHED composite indices ----
      #             a null parent contributes 0.00; the average is rounded to 2 dp before blending.
      parent_average_index = round_half_up((published_composite_index(sire.sire_id)
                                          + published_composite_index(sire.dam_sire_id)) / 2, 2)
      # ---- step 6: blend ----
      composite_index = round_half_up(
            (1 - parent_average_weight) * (W_PROD_BLEND * production_index + W_HEALTH_BLEND * health_index)
          + parent_average_weight * parent_average_index, 2)
    input_set: |
      Trait inputs come from the request body only. parent_average_index reads the two parent Sire rows'
      published_composite_index at the moment of creation (GenomicEvaluation rows in DRAFT, SUPERSEDED or
      ROLLED_BACK contribute nothing to that field). A parent whose id is null, or which has no PUBLISHED
      evaluation, contributes 0.00 - never a skipped divisor: the divisor is always 2.
    constants:
      W_MILK: 0.02
      W_FAT: 0.60
      W_PROTEIN: 0.80
      W_SCS: 8.0
      SCS_BASELINE: 3.00
      W_FERT: 6.0
      W_LONG: 1.5
      SHRINK_MIN: 0.30
      SHRINK_MAX: 0.95
      PROGENY_BLEND_MIN: 50
      PAW_BASE: 0.50
      PAW_SLOPE: 0.004
      PAW_CAP_DAUGHTERS: 100
      PAW_FLOOR: 0.10
      W_PROD_BLEND: 0.60
      W_HEALTH_BLEND: 0.40
    precision: "production_index, health_index, parent_average_index and composite_index: 2 decimal places, round_half_up. Rounding order is pinned in step 3/step 6 above - never compute the composite from unrounded sub-indices."
    variants:
      - name: GENOMIC_ONLY
        when: "progeny_daughter_count < 50 (young sire with no usable progeny data)"
        difference: "parent_average_weight is fixed at PAW_BASE = 0.50, so half of the composite is inherited from the pedigree parent average."
      - name: PROGENY_BLENDED
        when: "progeny_daughter_count >= 50"
        difference: "parent_average_weight decays with daughter count to a floor of 0.10, so the sire's own trait data dominates. Identical trait inputs therefore produce a different composite_index than GENOMIC_ONLY whenever parent_average_index != 0.60*production_index + 0.40*health_index."

  - name: lot_unit_book_value
    trigger: "POST /genetics/ejaculates/{id}/straw-lots (STANDARD_COST) and cascade hop 2 of POST /genetics/genomic-evaluations/{id}/publish or /rollback (MARKET_REVALUED)"
    algorithm: tiered_pricing
    formula: |
      # ---- STANDARD_COST (at processing) ----
      # Rounding order is PINNED: the PER-STRAW value is rounded to whole cents FIRST, and any lot-level
      # figure is that rounded unit value multiplied by a dose count. Summing first and rounding the total
      # is explicitly wrong here and produces different cents.
      unit_book_value_cents = round_half_up(processing_cost_cents / straw_count, 0)
      valuation_basis       = "STANDARD_COST"

      # ---- MARKET_REVALUED (on a proof publication for this lot's sire) ----
      raw = BASE_CENTS_PER_INDEX_POINT * max(0, sire.published_composite_index) * PRODUCT_MULTIPLIER[product_line]
      if product_line == "SEXED":
          raw = raw * (sexing_purity_pct / SEXED_PURITY_REF_PCT)
      unit_book_value_cents = max(MARKET_FLOOR_CENTS, round_half_up(raw, 0))
      valuation_basis       = "MARKET_REVALUED"
    input_set: |
      Revaluation touches exactly the StrawLot rows with sire_id == the published evaluation's sire_id AND
      distribution_status IN {QUARANTINE, RELEASED}. REJECTED and DEPLETED lots are never revalued and keep
      the unit value they carried when they left the set.
    constants:
      BASE_CENTS_PER_INDEX_POINT: 45
      PRODUCT_MULTIPLIER: { CONVENTIONAL: 1.00, SEXED: 1.85, EMBRYO: 3.40 }
      SEXED_PURITY_REF_PCT: 90.0
      MARKET_FLOOR_CENTS: 800
    precision: "whole cents, round_half_up, per-straw first (see the pinned order above)"
    variants:
      - name: STANDARD_COST
        when: "at lot creation, and after an evaluation rollback restores a pre-revaluation snapshot that was itself a standard cost"
        difference: "Derived from the laboratory cost pool only; completely independent of the sire's genetic merit."
      - name: MARKET_REVALUED
        when: "immediately after a GenomicEvaluation for the lot's sire is published"
        difference: "Derived from the sire's published_composite_index, the product-line multiplier and (for SEXED) the purity ratio, with a hard floor. The same physical lot therefore carries two different unit values before and after the proof update, and the delta flows into ConsignmentTransfer.carried_value_cents and Distributor.consignment_value_cents."

  - name: plant_inventory_value
    trigger: "GET /genetics/inventory-valuation, and twice inside POST /genetics/genomic-evaluations/{id}/publish to derive revaluation_delta_cents"
    algorithm: aggregation
    formula: |
      plant_inventory_value_cents = SUM over StrawLot rows with distribution_status IN {QUARANTINE, RELEASED}
          of unit_book_value_cents * (doses_available + doses_reserved + doses_consigned)
      # doses_used and doses_destroyed are consumed and contribute 0. REJECTED and DEPLETED lots are excluded
      # from the source set entirely, even though their unit_book_value_cents is still stored.
      quarantine_value_cents = the same sum restricted to distribution_status == QUARANTINE
      released_value_cents   = the same sum restricted to distribution_status == RELEASED
      lot_count              = number of rows in the source set
    input_set: "StrawLot rows with distribution_status IN {QUARANTINE, RELEASED}; no time window (the aggregate is always as-of the current state); order-insensitive because it is a pure sum of integer cents, so no tie-break is required."
    constants: {}
    precision: "integer cents; every term is already an integer product, so no rounding occurs at aggregation time"

  - name: lot_dose_ledger
    trigger: "every ConsignmentTransfer transition, every MatingRecommendation acceptance, lot rejection, and lot creation"
    algorithm: constraint_propagation
    formula: |
      # Global conserved quantity #1: physical doses. This identity MUST hold after every mutation.
      straw_count == doses_available + doses_reserved + doses_consigned + doses_used + doses_destroyed
      # Movements (each one is a transfer between two buckets, never a creation or destruction):
      #   transfer approve            : available -> reserved     (doses)
      #   transfer receive            : reserved  -> consigned     (doses)
      #   transfer report-usage       : consigned -> used          (doses_used)
      #                                 consigned -> available     (doses_returned)
      #   transfer return             : consigned -> available     (doses)   [compensating action]
      #   recommendation accept       : available -> reserved       (doses_requested)
      #   lot reject                  : available -> destroyed      (doses_available)
      # Compensation invariant: for any lot, the sequence approve(d) then return(d) leaves
      # doses_available exactly as it was before approve, and every other bucket unchanged.
    input_set: "One StrawLot row at a time; the five buckets are the only mutable dose fields and straw_count is immutable after creation."
    constants: {}
    precision: "integers; fractional doses do not exist"

  - name: consignment_settlement
    trigger: "POST /genetics/consignment-transfers/{id}/report-usage (RECEIVED -> RECONCILED)"
    algorithm: waterfall_allocation
    formula: |
      # The rebate tier looks circular - the rebate reduces the total, but the tier is keyed on a subtotal
      # that already includes the service fee. The evaluation order below is PINNED; evaluating the tier on
      # the post-rebate total, or on gross_cents alone, yields different cents.
      # step 1
      gross_cents = doses_used * unit_price_cents
      # step 2 - services performed on the tank since dispatch, not since tank creation
      service_fee_cents = LN2_SERVICE_FEE_CENTS * (Tank.service_count - tank_service_count_at_dispatch)
      # step 3 - the tier key is the PRE-REBATE subtotal, service fee included
      pre_rebate_subtotal_cents = gross_cents + service_fee_cents
      # step 4 - highest tier whose minimum is <= the subtotal; boundary is inclusive (>=)
      rebate_pct = REBATE_TIERS.highest_pct_where(min_subtotal_cents <= pre_rebate_subtotal_cents)
      # step 5 - the rebate applies to gross_cents ONLY, never to the service fee
      rebate_cents = round_half_up(gross_cents * rebate_pct, 0)
      # step 6
      settlement_total_cents = pre_rebate_subtotal_cents - rebate_cents
    input_set: "One ConsignmentTransfer row in status RECEIVED plus its Tank's current service_count. doses_returned never enters the settlement; only doses_used is billed."
    constants:
      LN2_SERVICE_FEE_CENTS: 12000
      REBATE_TIERS: "[{min_subtotal_cents: 0, pct: 0.00}, {min_subtotal_cents: 500000, pct: 0.03}, {min_subtotal_cents: 1500000, pct: 0.06}]"
    precision: "whole cents, round_half_up at step 5 only; steps 1-4 and 6 are exact integer arithmetic"

  - name: inbreeding_coefficient
    trigger: "POST /genetics/customer-herds/{id}/mating-recommendations, once per candidate sire during eligibility filtering and again for the selected sire"
    algorithm: topological
    formula: |
      # Wright's coefficient truncated at PEDIGREE_MAX_DEPTH generations on each side.
      # ancestors(x) walks sire_id and dam_sire_id upward, recording for each ancestor the SHORTEST
      # generation distance from x (x itself is distance 0). Multiple paths to the same ancestor collapse
      # onto that shortest distance - pinned, so the sum is order-independent.
      if dam_sire_id is null: return 0.00
      cand = ancestors(candidate_sire, PEDIGREE_MAX_DEPTH)          # map ancestor_id -> n1
      dam  = ancestors(dam_sire_id,   PEDIGREE_MAX_DEPTH)           # map ancestor_id -> d
      dam[dam_sire_id] = 0                                          # the dam's sire is itself on the maternal path
      F = 0
      for a in keys(cand) INTERSECT keys(dam):
          n1 = cand[a]
          n2 = dam[a] + 1                                           # +1 for the dam step between the cow and her sire
          F  = F + (0.5 ** (n1 + n2 + 1))
      inbreeding_pct = round_half_up(100 * F, 2)
      # A candidate that IS the dam's sire yields n1 = 0 via cand[candidate] = 0 only if the candidate is
      # its own ancestor, which cannot happen; the shared-ancestor case candidate.sire_id == dam_sire_id
      # gives n1 = 1, n2 = 1 and therefore 12.50 percent.
    input_set: "The Sire pedigree DAG reached from the candidate and from MatingRecommendation.dam_sire_id, at most PEDIGREE_MAX_DEPTH edges from each. Sires with no PUBLISHED evaluation still participate: pedigree membership does not depend on proof status."
    constants:
      PEDIGREE_MAX_DEPTH: 3
    precision: "2 decimal places on the percentage, round_half_up"

  - name: expected_conception_rate
    trigger: "POST /genetics/customer-herds/{id}/mating-recommendations, for the selected sire and lot"
    algorithm: threshold
    formula: |
      cr = BASE_CR[requested_product_line]
         * (1 + INDEX_BONUS_PER_POINT * max(0, recommended_sire.published_composite_index))
         * (selected_lot's Ejaculate.post_thaw_motility_pct / 100)
         * (1 - INBREEDING_PENALTY_PER_PCT * inbreeding_pct)
      expected_conception_rate = round_half_up(min(CR_CEILING, max(CR_FLOOR, cr)), 4)
    input_set: "The selected Sire's published_composite_index, the selected StrawLot's parent Ejaculate.post_thaw_motility_pct (recorded at QC), the recommendation's requested_product_line and the computed inbreeding_pct."
    constants:
      BASE_CR: "{ CONVENTIONAL: 0.60, SEXED: 0.48, EMBRYO: 0.42 }"
      INDEX_BONUS_PER_POINT: 0.0004
      INBREEDING_PENALTY_PER_PCT: 0.012
      CR_FLOOR: 0.2000
      CR_CEILING: 0.7500
    precision: "4 decimal places on the 0-1 fraction, round_half_up, clamped AFTER multiplication and BEFORE rounding"

  - name: mating_sire_selector
    trigger: "POST /genetics/customer-herds/{id}/mating-recommendations (the server picks the sire and the lot; the client never names them)"
    algorithm: chronological
    formula: |
      # (a) ELIGIBILITY FILTER - explicit predicate, no fuzzy adjectives
      candidates = Sire rows where
            acquisition_status == "RESIDENT"
        AND collection_status == "ELIGIBLE"
        AND published_evaluation_effective_at IS NOT NULL
        AND id != CustomerHerd.base_sire_id
        AND id NOT IN MatingRecommendation.excluded_sire_ids
        AND inbreeding_coefficient(id, dam_sire_id) <= CustomerHerd.max_inbreeding_pct      # inclusive boundary
        AND EXISTS a StrawLot row with sire_id == id
                   AND distribution_status == "RELEASED"
                   AND product_line == requested_product_line
                   AND doses_available >= doses_requested
      candidate_pool_size = count(candidates)
      # (b) RANKING - highest published_composite_index first
      # (c) TIE-BREAK - on equal published_composite_index, lower inbreeding_pct first;
      #                 on equal inbreeding_pct too, earlier Sire.created_at first (ASC).
      #                 Sire.id is NEVER a decision input.
      recommended_sire = sort(candidates, by = [published_composite_index DESC,
                                                inbreeding_pct ASC,
                                                created_at ASC]).first
      # lot pick within the chosen sire: most stock first, then earliest lot
      straw_lot = sort(that sire's eligible lots, by = [doses_available DESC, created_at ASC]).first
      # (d) EMPTY-POOL FALLBACK
      if candidate_pool_size == 0: reject the request with ERR_NO_ELIGIBLE_SIRE (422); no row is created
    input_set: "All Sire rows (no pagination), each joined to its RELEASED StrawLot rows of the requested product line. Sires in PROSPECT, CONTRACTED or RETIRED, or whose collection_status is not ELIGIBLE, never enter the pool even when they own releasable stock."
    constants: {}
    precision: "exact comparisons on integers and 2-dp decimals; no rounding is introduced by the selector"

  - name: tank_ln2_level
    trigger: "POST /genetics/_clock/set_current_utc (recomputed for every Tank), POST /genetics/tanks/{id}/ln2-service, and on any read of a Tank"
    algorithm: decay_function
    formula: |
      elapsed_days = floor((logical_clock - last_service_at) / 86400)          # whole days only, step decay
      ln2_level_pct = max(0, last_service_fill_pct - LN2_DECAY_PCT_PER_DAY * elapsed_days)
      next_service_due_at = last_service_at + service_interval_days * 86400 seconds
      # status thresholds - the <= at 25.0 is inclusive
      if ln2_level_pct == 0:                                              tank_status = "OUT_OF_SERVICE"
      elif ln2_level_pct <= LN2_SERVICE_DUE_PCT or logical_clock >= next_service_due_at:
                                                                          tank_status = "SERVICE_DUE"
      else:                                                               tank_status = "IN_SERVICE"
    input_set: "One Tank row; the decay curve restarts at every ln2-service call (last_service_at and last_service_fill_pct are the only origin)."
    constants:
      LN2_DECAY_PCT_PER_DAY: 2.0
      LN2_SERVICE_DUE_PCT: 25.0
    precision: "1 decimal place on ln2_level_pct, round_half_up; elapsed_days is floored, never rounded"

  - name: ejaculate_theoretical_doses
    trigger: "POST /genetics/collection-bookings/{id}/complete (frozen on the Ejaculate row)"
    algorithm: threshold
    formula: |
      total_doses_theoretical = floor(volume_ml * concentration_m_per_ml / DOSE_SPERM_MILLIONS)
      # Caps every lot cut from this ejaculate: SUM of straw_count over StrawLot rows with this
      # ejaculate_id, including the row being created, must be <= total_doses_theoretical.
    input_set: "The completion payload's volume_ml and concentration_m_per_ml only."
    constants:
      DOSE_SPERM_MILLIONS: 15
    precision: "integer, floored"

  - name: sire_required_test_compliance
    trigger: "POST /genetics/sires/{id}/collection-clearance, POST /genetics/sires/{id}/collection-status (target ELIGIBLE), POST /genetics/collection-bookings, POST /genetics/consignment-transfers/{id}/approve, and every clock move"
    algorithm: aggregation
    formula: |
      health_is_current(sire) = for every t in REQUIRED_BASE_TEST_TYPES:
          EXISTS a HealthTest row with sire_id == sire.id AND test_type == t
                 AND result == "NEGATIVE" AND valid_until > logical_clock
      # Strictly greater-than: a test whose valid_until equals the clock is already EXPIRED.
      # PENDING, POSITIVE, INCONCLUSIVE and EXPIRED rows never satisfy a requirement.
    input_set: "HealthTest rows for one sire; when several tests of the same type are NEGATIVE and current, any one of them satisfies the requirement (the predicate is existential, so no ordering or tie-break is needed)."
    constants:
      REQUIRED_BASE_TEST_TYPES: "[BLUETONGUE, IBR, BVD, TRICHOMONIASIS]"
    precision: "boolean"

  - name: certificate_export_compliance
    trigger: "POST /genetics/export-certificates/{id}/issue"
    algorithm: interval_merge
    formula: |
      satisfying = for each t in CountryRequirement.required_test_types, the HealthTest rows with
          sire_id == certificate.sire_id AND test_type == t AND result == "NEGATIVE"
          AND valid_until > logical_clock
          AND (logical_clock - sample_date) <= CountryRequirement.max_test_age_days * 86400 seconds
      # When more than one row satisfies a type, take the one with the LATEST valid_until; on a tie take
      # the earliest created_at. (Pinned so expires_at is deterministic.)
      if any required type has no satisfying row: reject
      expires_at = MIN over the chosen satisfying rows of valid_until
      # The certificate's validity window is therefore the intersection of the individual test windows.
    input_set: "HealthTest rows for the certificate's sire, restricted to the destination's required_test_types."
    constants: {}
    precision: "ISO 8601 UTC with three fractional digits"

  - name: distributor_exposure
    trigger: "POST /genetics/consignment-transfers/{id}/approve (credit gate), and recomputed on receive, report-usage and return"
    algorithm: aggregation
    formula: |
      consignment_value_cents   = SUM over ConsignmentTransfer rows with this distributor_id AND status == "RECEIVED"
                                  of doses_on_hand * StrawLot.unit_book_value_cents
      outstanding_balance_cents = SUM over ConsignmentTransfer rows with this distributor_id AND status == "RECONCILED"
                                  of settlement_total_cents
      cumulative_doses_used     = SUM over ConsignmentTransfer rows with this distributor_id AND status == "RECONCILED"
                                  of doses_used
      exposure_cents            = consignment_value_cents + outstanding_balance_cents
      # credit gate at approval time - projected, and inclusive at the limit
      projected_exposure_cents  = exposure_cents + transfer.doses * StrawLot.unit_book_value_cents
      approval permitted iff projected_exposure_cents <= credit_limit_cents
    input_set: "ConsignmentTransfer rows for one distributor filtered by the exact statuses above; REQUESTED, APPROVED, IN_TRANSIT, REJECTED and RETURNED rows contribute nothing to either aggregate."
    constants: {}
    precision: "integer cents; the comparison at the limit is inclusive (<=), so a projection landing exactly on credit_limit_cents is approved"

validations:
  # ---- request shape (priorities 1-3) ----
  - priority: 1
    category: request_shape
    check: "Every non-optional field in the endpoint's input list is present and non-null. Unknown body keys are ignored, never an error."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 2
    category: request_shape
    check: "Every supplied field parses to its declared type and, for enum fields, is a member of the declared enum set (breed, product_line, test_type, result, requested_product_line, valuation_basis are all closed sets)."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints and all list endpoints with enum filters"
  - priority: 3
    category: request_shape
    check: "Numeric, string and datetime bounds: cents fields >= 0, capacities >= 1, straw_count >= 1, volume_ml > 0, concentration_m_per_ml > 0, percentages within 0-100, isolation_days >= 0, doses >= 1, limit within 1-100, offset >= 0, country_code exactly two uppercase letters, and every instant field an ISO 8601 UTC timestamp."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  # ---- auth (priorities 4-7) ----
  - priority: 4
    category: auth
    check: "The X-User-Role header is present and its value appears in the endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 5
    category: auth
    check: "On the four segregation-of-duties-tracked endpoints (ejaculate qc-evaluation, straw-lot release, health-test result, export-certificate issue) the X-User-ID header is present and non-empty."
    error_id: ERR_USER_ID_REQUIRED
    http_status: 400
    applies_to: "POST /genetics/ejaculates/{id}/qc-evaluation, POST /genetics/straw-lots/{id}/release, POST /genetics/health-tests/{id}/result, POST /genetics/export-certificates/{id}/issue"
  - priority: 6
    category: auth
    check: "identity: entity_backed:Distributor - a caller with X-User-Role Distributor has an X-User-ID equal to some Distributor.id, and that id must equal the distributor_id of the ConsignmentTransfer, Tank, CustomerHerd or MatingRecommendation being addressed (for a transfer, the transfer's own distributor_id; for a recommendation, its herd's distributor_id)."
    error_id: ERR_DISTRIBUTOR_SCOPE
    http_status: 403
    applies_to: "all Distributor-role endpoints under /genetics/consignment-transfers, /genetics/tanks and /genetics/customer-herds"
  - priority: 7
    category: auth
    check: "identity: entity_backed:Facility - a caller with X-User-Role FacilityManager has an X-User-ID equal to some Facility.id, and that id must equal the facility_id of the CollectionBooking being addressed, the facility_id in a booking creation body, or the housing_facility_id of the Sire being housed."
    error_id: ERR_FACILITY_SCOPE
    http_status: 403
    applies_to: "POST /genetics/collection-bookings, POST /genetics/collection-bookings/{id}/complete, POST /genetics/collection-bookings/{id}/cancel, POST /genetics/facilities/{id}/approval-status"

  # ---- existence (priorities 8-9) ----
  - priority: 8
    category: existence
    check: "Every {id} path segment resolves to a stored row, validated left-to-right."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 9
    category: existence
    check: "Every FK supplied in the body resolves to a stored row (facility_id, sire_id, dam_sire_id, ejaculate_id, straw_lot_id, distributor_id, tank_id, export_certificate_id, country_requirement_id, base_sire_id, retest_of_test_id, supersedes_evaluation_id, each entry of excluded_sire_ids)."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints that accept a FK in the body"

  # ---- uniqueness (priorities 10-11) ----
  - priority: 10
    category: business_constraint
    check: "Facility.code, Sire.registration_code, Tank.serial and CountryRequirement.country_code are each unique across all rows of their entity."
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /genetics/facilities, POST /genetics/sires, POST /genetics/tanks, POST /genetics/country-requirements"
  - priority: 11
    category: business_constraint
    check: "A sire may not have two HealthTest rows of the same test_type in status PENDING at once; the outstanding one must be resulted first."
    error_id: ERR_DUPLICATE_PENDING_TEST
    http_status: 409
    applies_to: "POST /genetics/sires/{id}/health-tests"

  # ---- optimistic concurrency (priority 12) ----
  - priority: 12
    category: concurrency
    check: "The supplied expected_sire_version / expected_straw_lot_version equals the parent row's current version field. Checked after existence and uniqueness, before any state precondition, so a stale version on an otherwise-illegal request still returns 412."
    error_id: ERR_STALE_SIRE_VERSION | ERR_STALE_STRAW_LOT_VERSION
    http_status: 412
    applies_to: "POST /genetics/sires/{id}/genomic-evaluations, POST /genetics/straw-lots/{id}/consignment-transfers"

  # ---- state preconditions (priorities 13-21) ----
  - priority: 13
    category: state
    check: "The addressed StrawLot has distribution_status == RELEASED. QUARANTINE, REJECTED and DEPLETED lots cannot be consigned. Checked BEFORE the tank-ownership referential rule at priority 29, so a request that is wrong on both counts returns the state error."
    error_id: ERR_LOT_NOT_RELEASED
    http_status: 409
    applies_to: "POST /genetics/straw-lots/{id}/consignment-transfers"
  - priority: 14
    category: state
    check: "The addressed Sire's acquisition_status permits the requested acquisition transition: contract requires PROSPECT, house requires CONTRACTED, retire requires RESIDENT. A repeated call therefore fails on the second attempt."
    error_id: ERR_SIRE_ACQUISITION_STATE
    http_status: 409
    applies_to: "POST /genetics/sires/{id}/contract, POST /genetics/sires/{id}/house, POST /genetics/sires/{id}/retire"
  - priority: 15
    category: state
    check: "The addressed Sire's collection_status permits the requested collection transition, independently of acquisition_status: collection-clearance requires ISOLATION, a booking requires ELIGIBLE, collection-status SUSPENDED requires ELIGIBLE, collection-status ELIGIBLE requires SUSPENDED, and WITHDRAWN is terminal."
    error_id: ERR_SIRE_COLLECTION_STATE
    http_status: 409
    applies_to: "POST /genetics/sires/{id}/collection-clearance, POST /genetics/sires/{id}/collection-status, POST /genetics/collection-bookings"
  - priority: 16
    category: state
    check: "The referenced Facility has approval_status == APPROVED. A SUSPENDED facility can neither house a sire nor accept a new booking nor back an export certificate."
    error_id: ERR_FACILITY_SUSPENDED
    http_status: 409
    applies_to: "POST /genetics/sires/{id}/house, POST /genetics/collection-bookings, POST /genetics/export-certificates/{id}/submit"
  - priority: 17
    category: state
    check: "The addressed CollectionBooking has status == SCHEDULED. COMPLETED, CANCELLED and VOIDED bookings accept no further transition."
    error_id: ERR_BOOKING_STATE
    http_status: 409
    applies_to: "POST /genetics/collection-bookings/{id}/complete, POST /genetics/collection-bookings/{id}/cancel"
  - priority: 18
    category: state
    check: "The addressed Ejaculate has qc_status == PENDING_QC for a QC evaluation, and ACCEPTED for straw-lot creation. A REJECTED ejaculate can never be cut into straws."
    error_id: ERR_EJACULATE_STATE
    http_status: 409
    applies_to: "POST /genetics/ejaculates/{id}/qc-evaluation, POST /genetics/ejaculates/{id}/straw-lots"
  - priority: 19
    category: state
    check: "The addressed StrawLot has distribution_status == QUARANTINE for release or rejection."
    error_id: ERR_LOT_STATE
    http_status: 409
    applies_to: "POST /genetics/straw-lots/{id}/release, POST /genetics/straw-lots/{id}/reject"
  - priority: 20
    category: state
    check: "The addressed GenomicEvaluation has status == DRAFT or SUPERSEDED for publish (a SUPERSEDED row may be reinstated) and status == PUBLISHED for rollback; ROLLED_BACK is terminal."
    error_id: ERR_EVALUATION_STATE
    http_status: 409
    applies_to: "POST /genetics/genomic-evaluations/{id}/publish, POST /genetics/genomic-evaluations/{id}/rollback"
  - priority: 21
    category: state
    check: "The addressed ExportCertificate is in the source state the transition needs: submit requires DRAFT or REJECTED, issue and reject require SUBMITTED, revoke requires ISSUED. The addressed ConsignmentTransfer likewise: approve/reject require REQUESTED, dispatch requires APPROVED, receive requires IN_TRANSIT, report-usage and return require RECEIVED. The addressed Tank must not be OUT_OF_SERVICE to receive a consignment."
    error_id: ERR_CERTIFICATE_STATE | ERR_TRANSFER_STATE | ERR_TANK_OUT_OF_SERVICE
    http_status: 409
    applies_to: "all /genetics/export-certificates/{id}/* , /genetics/consignment-transfers/{id}/* and POST /genetics/consignment-transfers/{id}/receive"

  # ---- segregation of duties (priorities 22-23) ----
  - priority: 22
    category: business_safety
    check: "The X-User-ID releasing a StrawLot differs from the evaluated_by_user_id recorded on that lot's parent Ejaculate."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /genetics/straw-lots/{id}/release"
  - priority: 23
    category: business_safety
    check: "The X-User-ID issuing an ExportCertificate is not recorded as recorded_by_user_id on any HealthTest row belonging to that certificate's sire."
    error_id: ERR_CERTIFIER_TESTED_SIRE
    http_status: 403
    applies_to: "POST /genetics/export-certificates/{id}/issue"

  # ---- business safety / regulatory (priorities 24-27) ----
  - priority: 24
    category: business_safety
    check: "The sire's isolation period is complete: logical_clock >= Sire.isolation_ends_at. The boundary is inclusive, so clearance exactly at isolation_ends_at succeeds."
    error_id: ERR_ISOLATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /genetics/sires/{id}/collection-clearance"
  - priority: 25
    category: business_safety
    check: "sire_required_test_compliance holds for the sire: every one of BLUETONGUE, IBR, BVD and TRICHOMONIASIS has a NEGATIVE HealthTest whose valid_until is strictly after the logical clock. Checked BEFORE the credit-limit rule at priority 51, so a transfer that is both health-blocked and over the credit limit returns the health error."
    error_id: ERR_HEALTH_TESTS_NOT_CURRENT
    http_status: 422
    applies_to: "POST /genetics/sires/{id}/collection-clearance, POST /genetics/sires/{id}/collection-status, POST /genetics/collection-bookings, POST /genetics/consignment-transfers/{id}/approve"
  - priority: 26
    category: business_safety
    check: "certificate_export_compliance holds: every test_type in the destination CountryRequirement.required_test_types has a NEGATIVE HealthTest for the sire that is unexpired and no older than max_test_age_days."
    error_id: ERR_COUNTRY_TEST_MISSING
    http_status: 422
    applies_to: "POST /genetics/export-certificates/{id}/issue"
  - priority: 27
    category: business_safety
    check: "Ejaculate QC thresholds: an ACCEPTED verdict requires post_thaw_motility_pct >= 35.0 and morphology_normal_pct >= 70.0. A verdict of ACCEPTED with sub-threshold figures is rejected outright rather than silently downgraded."
    error_id: ERR_QC_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /genetics/ejaculates/{id}/qc-evaluation"

  # ---- business referential (priorities 28-33) ----
  - priority: 28
    category: business_referential
    check: "The booked Sire is housed at the booking's facility: Sire.housing_facility_id == facility_id. Checked BEFORE the temporal rest-buffer rule at priority 34, so a booking that is at the wrong facility AND inside the rest window returns this error."
    error_id: ERR_SIRE_NOT_AT_FACILITY
    http_status: 422
    applies_to: "POST /genetics/collection-bookings"
  - priority: 29
    category: business_referential
    check: "The destination Tank belongs to the transfer's distributor: Tank.distributor_id == distributor_id."
    error_id: ERR_TANK_NOT_OWNED_BY_DISTRIBUTOR
    http_status: 422
    applies_to: "POST /genetics/straw-lots/{id}/consignment-transfers"
  - priority: 30
    category: business_referential
    check: "The referenced ExportCertificate covers this shipment: ExportCertificate.sire_id equals the lot's sire_id, ExportCertificate.straw_lot_id equals the lot id, and its status is ISSUED. Required whenever the destination Distributor.country_code differs from the lot's origin facility country."
    error_id: ERR_CERTIFICATE_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /genetics/straw-lots/{id}/consignment-transfers, POST /genetics/consignment-transfers/{id}/approve"
  - priority: 31
    category: business_referential
    check: "An ExportCertificate's straw_lot_id names a lot whose sire_id equals the certificate's sire_id."
    error_id: ERR_LOT_SIRE_MISMATCH
    http_status: 422
    applies_to: "POST /genetics/export-certificates"
  - priority: 32
    category: business_referential
    check: "A HealthTest's retest_of_test_id, when supplied, names a HealthTest of the same sire and the same test_type whose result is POSITIVE or INCONCLUSIVE."
    error_id: ERR_INVALID_RETEST_TARGET
    http_status: 422
    applies_to: "POST /genetics/sires/{id}/health-tests"
  - priority: 33
    category: business_referential
    check: "Pedigree integrity: a Sire's sire_id and dam_sire_id are not its own id, and adding the edge does not create a cycle in the pedigree DAG. Detected at creation and again whenever the inbreeding calculation traverses the graph."
    error_id: ERR_PEDIGREE_CYCLE
    http_status: 422
    applies_to: "POST /genetics/sires, POST /genetics/sires/{id}/pedigree, POST /genetics/customer-herds/{id}/mating-recommendations"

  # ---- business temporal (priorities 34-38) ----
  - priority: 34
    category: business_temporal
    check: "Collection rest buffer: the new booking's start_at is at least 48 hours after the end_at of the sire's most recent SCHEDULED or COMPLETED booking, and at least 48 hours before the start_at of the next one. The boundary is closed - exactly 48 hours is allowed."
    error_id: ERR_SIRE_REST_BUFFER
    http_status: 422
    applies_to: "POST /genetics/collection-bookings"
  - priority: 35
    category: business_temporal
    check: "The logical clock never moves backwards: the requested current_utc is strictly greater than the stored clock."
    error_id: ERR_CLOCK_REWIND
    http_status: 422
    applies_to: "POST /genetics/_clock/set_current_utc"
  - priority: 36
    category: business_temporal
    check: "A booking window is well-formed and future-dated: start_at < end_at and start_at >= logical_clock."
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /genetics/collection-bookings"
  - priority: 37
    category: business_temporal
    check: "A booking may only be completed once the logical clock has reached its start_at."
    error_id: ERR_BOOKING_NOT_STARTED
    http_status: 422
    applies_to: "POST /genetics/collection-bookings/{id}/complete"
  - priority: 38
    category: business_temporal
    check: "A HealthTest sample_date is not in the future relative to the logical clock."
    error_id: ERR_SAMPLE_DATE_FUTURE
    http_status: 422
    applies_to: "POST /genetics/sires/{id}/health-tests"

  # ---- business capacity / constraint (priorities 39-47) ----
  - priority: 39
    category: business_constraint
    check: "Housing a sire would not push Facility.resident_sire_count above housing_capacity. Aggregate check: each existing resident is individually legal, the newcomer is what breaks the cap."
    error_id: ERR_FACILITY_AT_CAPACITY
    http_status: 422
    applies_to: "POST /genetics/sires/{id}/house"
  - priority: 40
    category: business_constraint
    check: "Bench capacity: the count of SCHEDULED bookings at the facility whose half-open [start_at, end_at) windows overlap the new window, plus one, must not exceed Facility.bench_capacity. Adjacency (previous end_at == new start_at) is NOT an overlap."
    error_id: ERR_BENCH_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /genetics/collection-bookings"
  - priority: 41
    category: business_constraint
    check: "The sum of straw_count across all StrawLot rows cut from an Ejaculate, including the row being created, must not exceed ejaculate_theoretical_doses."
    error_id: ERR_DOSE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /genetics/ejaculates/{id}/straw-lots"
  - priority: 42
    category: business_constraint
    check: "The requested dose count is available: StrawLot.doses_available >= doses for a transfer, and >= doses_requested for an accepted recommendation; report-usage requires doses_used + doses_returned <= the transfer's doses."
    error_id: ERR_INSUFFICIENT_DOSES
    http_status: 422
    applies_to: "POST /genetics/straw-lots/{id}/consignment-transfers, POST /genetics/consignment-transfers/{id}/report-usage, POST /genetics/mating-recommendations/{id}/decision"
  - priority: 43
    category: business_constraint
    check: "Tank straw capacity at dispatch: Tank.straws_on_hand (the sum of doses_on_hand over the tank's IN_TRANSIT and RECEIVED transfers) plus the dispatched doses must not exceed Tank.capacity_straws."
    error_id: ERR_TANK_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /genetics/consignment-transfers/{id}/dispatch"
  - priority: 44
    category: business_constraint
    check: "A SEXED StrawLot supplies sexing_purity_pct in 50.0-99.9 and a CONVENTIONAL or EMBRYO lot omits it (a supplied value on a non-SEXED lot is an error, not an ignored key)."
    error_id: ERR_PRODUCT_LINE_FIELDS
    http_status: 422
    applies_to: "POST /genetics/ejaculates/{id}/straw-lots"
  - priority: 45
    category: business_constraint
    check: "The destination country is approved for the lot's origin facility: the certificate's destination_country_code (or, for a domestic transfer, the Distributor.country_code) appears in Facility.approved_export_countries, where the facility is the one that hosted the booking behind the lot's ejaculate. PLANT_COUNTRY_CODE (\"US\") is always permitted."
    error_id: ERR_DESTINATION_NOT_APPROVED
    http_status: 422
    applies_to: "POST /genetics/export-certificates/{id}/submit, POST /genetics/straw-lots/{id}/consignment-transfers"
  - priority: 46
    category: business_constraint
    check: "Conditional on product line: a certificate whose lot has product_line == SEXED requires CountryRequirement.sexed_semen_allowed == true, and product_line == EMBRYO requires CountryRequirement.embryo_allowed == true. A CONVENTIONAL lot is never gated by either flag."
    error_id: ERR_PRODUCT_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /genetics/export-certificates/{id}/submit"
  - priority: 47
    category: business_constraint
    check: "The isolation actually served is long enough for the destination: Sire.isolation_days_applied >= CountryRequirement.min_isolation_days. Inclusive boundary - exactly min_isolation_days passes."
    error_id: ERR_ISOLATION_TOO_SHORT
    http_status: 422
    applies_to: "POST /genetics/export-certificates/{id}/submit"
  - priority: 48
    category: business_constraint
    check: "An ExportCertificate may enter SUBMITTED at most MAX_SUBMISSION_ROUNDS = 3 times: submission_round must be < 3 at the moment of submit."
    error_id: ERR_RESUBMISSION_LIMIT
    http_status: 422
    applies_to: "POST /genetics/export-certificates/{id}/submit"
  - priority: 49
    category: business_constraint
    check: "Conditional feature flag: the consignee has consignment_enabled == true. When the flag is false no transfer may be approved for that distributor, whatever its exposure."
    error_id: ERR_CONSIGNMENT_DISABLED
    http_status: 422
    applies_to: "POST /genetics/consignment-transfers/{id}/approve"
  - priority: 50
    category: business_constraint
    check: "mating_sire_selector returns a non-empty candidate pool. When every sire is filtered out - by residency, collection status, missing published proof, missing releasable stock of the requested product line, exclusion list, base-sire identity or an inbreeding_pct above CustomerHerd.max_inbreeding_pct - the request is rejected and no MatingRecommendation row is created."
    error_id: ERR_NO_ELIGIBLE_SIRE
    http_status: 422
    applies_to: "POST /genetics/customer-herds/{id}/mating-recommendations"

  # ---- business fiscal (priority 51, deliberately last) ----
  - priority: 51
    category: business_fiscal
    check: "distributor_exposure projected at approval time must not exceed Distributor.credit_limit_cents. Inclusive at the limit: a projection landing exactly on credit_limit_cents is approved. Deliberately the LAST check, so any safety, referential, temporal or constraint violation outranks it."
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /genetics/consignment-transfers/{id}/approve"

endpoints:
  # ---- logical clock (test-driving endpoint, /_ namespace) ----
  - method: POST
    path: "/genetics/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every temporal rule in this domain reads. The clock's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. The clock is monotonic - a value at or before the stored clock is refused. Advancing it runs the epoch sweep: expire lapsed HealthTest rows, suspend the sires that lose a required test, void their future bookings, and re-derive every Tank's ln2 level and status."
    roles: [ProgramDirector]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime, expired_health_test_ids: string[], suspended_sire_ids: string[], voided_booking_ids: string[], service_due_tank_ids: string[], out_of_service_tank_ids: string[] }"
    side_effects:
      - "HealthTest rows with result == NEGATIVE and valid_until <= new clock become EXPIRED"
      - "Sires that lose a REQUIRED_BASE_TEST_TYPES coverage move collection_status ELIGIBLE -> SUSPENDED with suspension_reason REQUIRED_TEST_EXPIRED"
      - "Those sires' SCHEDULED bookings with start_at > new clock become VOIDED"
      - "calculations.tank_ln2_level re-derives ln2_level_pct, next_service_due_at and tank_status for every Tank"

  # ---- facilities ----
  - method: POST
    path: "/genetics/facilities"
    description: "Registers a collection facility."
    roles: [ProgramDirector]
    code: 201
    input: [code, country_code, housing_capacity, bench_capacity, "approved_export_countries?"]
    output: Facility
    side_effects: ["approval_status initialised to APPROVED; resident_sire_count initialised to 0"]
  - method: GET
    path: "/genetics/facilities/{id}"
    description: "Reads one facility including its derived resident_sire_count."
    roles: [ProgramDirector, FacilityManager, StaffVeterinarian, ExportCoordinator]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: POST
    path: "/genetics/facilities/{id}/approval-status"
    description: "Suspends or reinstates a facility's regulatory approval."
    roles: [ProgramDirector]
    code: 200
    input: [approval_status, "suspension_reason?"]
    output: Facility
    side_effects:
      - "APPROVED -> SUSPENDED cascades: every ELIGIBLE sire housed here moves to SUSPENDED with suspension_reason FACILITY_SUSPENDED, and every SCHEDULED booking here becomes VOIDED"
      - "SUSPENDED -> APPROVED does NOT auto-restore sires; each needs its own collection-status call"

  # ---- country requirements ----
  - method: POST
    path: "/genetics/country-requirements"
    description: "Declares one destination country's import test rule set."
    roles: [ProgramDirector, ExportCoordinator]
    code: 201
    input: [country_code, required_test_types, max_test_age_days, min_isolation_days, sexed_semen_allowed, embryo_allowed]
    output: CountryRequirement
    side_effects: []
  - method: GET
    path: "/genetics/country-requirements/{id}"
    description: "Reads one destination rule set."
    roles: [ProgramDirector, ExportCoordinator, StaffVeterinarian]
    code: 200
    input: []
    output: CountryRequirement
    side_effects: []

  # ---- sires ----
  - method: POST
    path: "/genetics/sires"
    description: "Registers a bull, optionally wiring it into the pedigree DAG via sire_id (father) and dam_sire_id (maternal grandsire). A pedigree-only ancestor is registered the same way with acquisition_cost_cents 0 and simply never contracted."
    roles: [ProgramDirector]
    code: 201
    input: [registration_code, breed, birth_date, "sire_id?", "dam_sire_id?", acquisition_cost_cents]
    output: Sire
    side_effects:
      - "acquisition_status initialised to PROSPECT and collection_status to NOT_HOUSED (parallel dimensions)"
      - "pedigree_depth derived from the supplied parents; published_* index fields initialised to 0.00"
  - method: GET
    path: "/genetics/sires/{id}"
    description: "Reads one bull, including both status dimensions, the published proof snapshot and version (the value a caller pins into expected_sire_version)."
    roles: [ProgramDirector, FacilityManager, StaffVeterinarian, LabTechnician, ExportCoordinator, BreedingAdvisor]
    code: 200
    input: []
    output: Sire
    side_effects: []
  - method: GET
    path: "/genetics/sires"
    description: "Lists bulls. sire_id and dam_sire_id filter by pedigree edge, so a parent's progeny are reachable from the parent id; housing_facility_id reaches a facility's residents."
    roles: [ProgramDirector, FacilityManager, StaffVeterinarian, ExportCoordinator, BreedingAdvisor]
    code: 200
    input: ["breed?", "acquisition_status?", "collection_status?", "housing_facility_id?", "sire_id?", "dam_sire_id?", "limit?", "offset?"]
    output: Sire[]
    side_effects: []
  - method: POST
    path: "/genetics/sires/{id}/contract"
    description: "Signs the acquisition contract: PROSPECT -> CONTRACTED on the acquisition dimension only."
    roles: [ProgramDirector]
    code: 200
    input: [contract_price_cents]
    output: Sire
    side_effects: ["contract_price_cents stored; collection_status untouched (still NOT_HOUSED)"]
  - method: POST
    path: "/genetics/sires/{id}/house"
    description: "Moves the bull into a facility: CONTRACTED -> RESIDENT on the acquisition dimension and NOT_HOUSED -> ISOLATION on the collection dimension, in one call."
    roles: [ProgramDirector, FacilityManager]
    code: 200
    input: [facility_id, isolation_days]
    output: Sire
    side_effects:
      - "housing_facility_id set; isolation_days_applied stored; isolation_ends_at = logical_clock + isolation_days * 86400 seconds"
      - "Facility.resident_sire_count incremented"
  - method: POST
    path: "/genetics/sires/{id}/collection-clearance"
    description: "Clears the bull for collection once isolation is served and all four required tests are current: ISOLATION -> ELIGIBLE."
    roles: [StaffVeterinarian]
    code: 200
    input: ["clearance_note?"]
    output: Sire
    side_effects: ["collection_status becomes ELIGIBLE; suspension_reason cleared to null"]
  - method: POST
    path: "/genetics/sires/{id}/collection-status"
    description: "Manual move on the collection dimension: ELIGIBLE -> SUSPENDED (suspension_reason MANUAL), SUSPENDED -> ELIGIBLE (re-checks isolation and test currency), or either -> WITHDRAWN (terminal)."
    roles: [StaffVeterinarian, ProgramDirector]
    code: 200
    input: [collection_status, "suspension_reason?"]
    output: Sire
    side_effects:
      - "-> SUSPENDED voids the sire's SCHEDULED bookings with start_at > logical_clock and revokes its ISSUED export certificates with revocation_reason SIRE_SUSPENDED"
      - "-> ELIGIBLE clears suspension_reason"
      - "-> WITHDRAWN is terminal on the collection dimension; acquisition_status is untouched"
  - method: POST
    path: "/genetics/sires/{id}/retire"
    description: "Retires the animal commercially: RESIDENT -> RETIRED on the acquisition dimension. Existing straw inventory stays sellable."
    roles: [ProgramDirector]
    code: 200
    input: [retirement_reason]
    output: Sire
    side_effects:
      - "Facility.resident_sire_count decremented; housing_facility_id retained for audit"
      - "collection_status is NOT changed by this call - the two dimensions move independently"
  - method: POST
    path: "/genetics/sires/{id}/pedigree"
    description: "Parentage correction after DNA verification: rewrites this sire's sire_id and/or dam_sire_id. Registry work, not a state transition - no status changes. A supplied null clears the edge; an omitted field leaves it as it was. Pedigree integrity is enforced by priority 33, so an amendment that would close a cycle in the pedigree DAG is refused."
    roles: [ProgramDirector]
    code: 200
    input: ["sire_id?", "dam_sire_id?"]
    output: Sire
    side_effects:
      - "sire_id and/or dam_sire_id replaced; pedigree_depth re-derived; Sire.version incremented by 1"
      - "already-created GenomicEvaluation rows are NOT recomputed - parent_average_index is pinned at evaluation creation, so only evaluations created after this call see the new pedigree"
      - "no published_* field and no StrawLot valuation changes; future inbreeding_coefficient traversals use the amended graph"

  # ---- health tests ----
  - method: POST
    path: "/genetics/sires/{id}/health-tests"
    description: "Orders a health test for a bull. Created in PENDING; valid_until is derived from sample_date + validity_days only once a NEGATIVE result lands."
    roles: [StaffVeterinarian]
    code: 201
    input: [facility_id, test_type, sample_date, validity_days, "retest_of_test_id?"]
    output: HealthTest
    side_effects: ["result initialised to PENDING"]
  - method: GET
    path: "/genetics/health-tests/{id}"
    description: "Reads one health test."
    roles: [StaffVeterinarian, ProgramDirector, ExportCoordinator]
    code: 200
    input: []
    output: HealthTest
    side_effects: []
  - method: GET
    path: "/genetics/health-tests"
    description: "Lists health tests; sire_id, facility_id and retest_of_test_id each reach a parent's children."
    roles: [StaffVeterinarian, ProgramDirector, ExportCoordinator, FacilityManager]
    code: 200
    input: ["sire_id?", "facility_id?", "test_type?", "result?", "retest_of_test_id?", "limit?", "offset?"]
    output: HealthTest[]
    side_effects: []
  - method: POST
    path: "/genetics/health-tests/{id}/result"
    description: "Records the laboratory verdict on a PENDING test. The X-User-ID is stored as recorded_by_user_id and later bars that user from issuing this sire's export certificates."
    roles: [StaffVeterinarian]
    code: 200
    input: [result]
    output: HealthTest
    side_effects:
      - "NEGATIVE sets valid_until = sample_date + validity_days * 86400 seconds"
      - "POSITIVE moves the sire's collection_status ELIGIBLE -> SUSPENDED with suspension_reason POSITIVE_TEST_RESULT, voids its future SCHEDULED bookings and revokes its ISSUED certificates"
      - "INCONCLUSIVE leaves the sire untouched but satisfies no requirement"
      - "recorded_by_user_id and resulted_at stored"

  # ---- collection bookings ----
  - method: POST
    path: "/genetics/collection-bookings"
    description: "Books a collection slot on a facility's bench for an ELIGIBLE sire. The window is half-open [start_at, end_at): a booking that starts exactly when another ends does not overlap it."
    roles: [FacilityManager]
    code: 201
    input: [sire_id, facility_id, start_at, end_at]
    output: CollectionBooking
    side_effects: ["status initialised to SCHEDULED"]
  - method: GET
    path: "/genetics/collection-bookings/{id}"
    description: "Reads one booking."
    roles: [FacilityManager, ProgramDirector, StaffVeterinarian, LabTechnician]
    code: 200
    input: []
    output: CollectionBooking
    side_effects: []
  - method: GET
    path: "/genetics/collection-bookings"
    description: "Lists bookings; sire_id and facility_id each reach a parent's children."
    roles: [FacilityManager, ProgramDirector, StaffVeterinarian, LabTechnician]
    code: 200
    input: ["sire_id?", "facility_id?", "status?", "limit?", "offset?"]
    output: CollectionBooking[]
    side_effects: []
  - method: POST
    path: "/genetics/collection-bookings/{id}/cancel"
    description: "Cancels a SCHEDULED booking by operator choice. Distinct from the VOIDED state, which only the system produces."
    roles: [FacilityManager, ProgramDirector]
    code: 200
    input: [cancel_reason]
    output: CollectionBooking
    side_effects: ["status becomes CANCELLED; the bench slot is freed for overlap accounting"]
  - method: POST
    path: "/genetics/collection-bookings/{id}/complete"
    description: "Records the collection performed in the booked window and cascade-creates the Ejaculate. The new Ejaculate never appears in this response - it is discovered through GET /genetics/ejaculates?booking_id={id}."
    roles: [FacilityManager]
    code: 200
    input: [volume_ml, concentration_m_per_ml, motility_pct, "collected_by_ref?"]
    output: CollectionBooking
    side_effects:
      - "status becomes COMPLETED; completed_at set to the logical clock"
      - "one Ejaculate row created in PENDING_QC with total_doses_theoretical = floor(volume_ml * concentration_m_per_ml / 15)"
      - "Sire.collection_count incremented"

  # ---- ejaculates ----
  - method: GET
    path: "/genetics/ejaculates/{id}"
    description: "Reads one ejaculate including its QC verdict and dose ceiling."
    roles: [LabTechnician, ProgramDirector, FacilityManager]
    code: 200
    input: []
    output: Ejaculate
    side_effects: []
  - method: GET
    path: "/genetics/ejaculates"
    description: "Lists ejaculates; booking_id and sire_id each reach a parent's children (the only discovery channel for a cascade-created ejaculate)."
    roles: [LabTechnician, ProgramDirector, FacilityManager]
    code: 200
    input: ["booking_id?", "sire_id?", "qc_status?", "limit?", "offset?"]
    output: Ejaculate[]
    side_effects: []
  - method: POST
    path: "/genetics/ejaculates/{id}/qc-evaluation"
    description: "Records the post-thaw QC verdict. The X-User-ID is stored as evaluated_by_user_id and is thereafter barred from releasing lots cut from this ejaculate."
    roles: [LabTechnician]
    code: 200
    input: [post_thaw_motility_pct, morphology_normal_pct, verdict]
    output: Ejaculate
    side_effects:
      - "qc_status becomes ACCEPTED or REJECTED per the verdict; evaluated_by_user_id and qc_decided_at stored"
      - "an ACCEPTED verdict requires post_thaw_motility_pct >= 35.0 and morphology_normal_pct >= 70.0"
  - method: POST
    path: "/genetics/ejaculates/{id}/straw-lots"
    description: "Cuts a straw lot from an ACCEPTED ejaculate. The lot enters QUARANTINE valued at STANDARD_COST (processing_cost_cents / straw_count, rounded per straw)."
    roles: [LabTechnician]
    code: 201
    input: [product_line, straw_count, processing_cost_cents, "sexing_purity_pct?"]
    output: StrawLot
    side_effects:
      - "sire_id copied from the ejaculate; distribution_status QUARANTINE; doses_available = straw_count and every other dose bucket 0"
      - "unit_book_value_cents and valuation_basis STANDARD_COST derived per calculations.lot_unit_book_value"
      - "the sum of straw_count across the ejaculate's lots must stay within total_doses_theoretical"

  # ---- straw lots ----
  - method: GET
    path: "/genetics/straw-lots/{id}"
    description: "Reads one lot including all five dose buckets, unit_book_value_cents, valuation_basis and version (the value a caller pins into expected_straw_lot_version)."
    roles: [LabTechnician, ProgramDirector, ExportCoordinator, Distributor, BreedingAdvisor]
    code: 200
    input: []
    output: StrawLot
    side_effects: []
  - method: GET
    path: "/genetics/straw-lots"
    description: "Lists lots; sire_id and ejaculate_id each reach a parent's children."
    roles: [LabTechnician, ProgramDirector, ExportCoordinator, Distributor, BreedingAdvisor]
    code: 200
    input: ["sire_id?", "ejaculate_id?", "product_line?", "distribution_status?", "limit?", "offset?"]
    output: StrawLot[]
    side_effects: []
  - method: POST
    path: "/genetics/straw-lots/{id}/release"
    description: "Releases a QUARANTINE lot for distribution. Segregation of duties: the X-User-ID must differ from the evaluated_by_user_id on the parent ejaculate."
    roles: [LabTechnician]
    code: 200
    input: ["release_note?"]
    output: StrawLot
    side_effects: ["distribution_status becomes RELEASED; released_by_user_id stored; the lot's value moves from quarantine_value_cents into released_value_cents"]
  - method: POST
    path: "/genetics/straw-lots/{id}/reject"
    description: "Condemns a QUARANTINE lot."
    roles: [LabTechnician]
    code: 200
    input: [rejected_reason]
    output: StrawLot
    side_effects:
      - "distribution_status becomes REJECTED; every dose in doses_available moves to doses_destroyed, conserving straw_count"
      - "the lot leaves the plant_inventory_value source set; ISSUED certificates covering it are revoked with revocation_reason LOT_REJECTED"
  - method: POST
    path: "/genetics/straw-lots/{id}/consignment-transfers"
    description: "Requests a consignment of doses from a RELEASED lot into a distributor's tank. expected_straw_lot_version pins the lot revision the requester read, so a proof publication that revalued the lot in between makes this call fail with 412."
    roles: [ProgramDirector, Distributor]
    code: 201
    input: [distributor_id, tank_id, doses, unit_price_cents, "export_certificate_id?", expected_straw_lot_version]
    output: ConsignmentTransfer
    side_effects: ["status initialised to REQUESTED; no dose bucket moves until approval"]

  # ---- genomic evaluations ----
  - method: POST
    path: "/genetics/sires/{id}/genomic-evaluations"
    description: "Files a new genetic evaluation for a bull in DRAFT, scoring it immediately per calculations.sire_genetic_index. expected_sire_version pins the sire revision the evaluator read."
    roles: [ProgramDirector]
    code: 201
    input: [milk_kg, fat_kg, protein_kg, somatic_cell_score, fertility_pct, longevity_months, reliability_pct, progeny_daughter_count, effective_at, expected_sire_version]
    output: GenomicEvaluation
    side_effects:
      - "status initialised to DRAFT; production_index, health_index, parent_average_index, parent_average_weight, evaluation_basis and composite_index all frozen on the row"
      - "Sire.version increments; the sire's published_* fields are NOT touched until publish"
  - method: GET
    path: "/genetics/genomic-evaluations/{id}"
    description: "Reads one evaluation including its frozen index components and revaluation_delta_cents."
    roles: [ProgramDirector, BreedingAdvisor, ExportCoordinator]
    code: 200
    input: []
    output: GenomicEvaluation
    side_effects: []
  - method: GET
    path: "/genetics/genomic-evaluations"
    description: "Lists evaluations; sire_id and supersedes_evaluation_id each reach a parent's children."
    roles: [ProgramDirector, BreedingAdvisor, ExportCoordinator]
    code: 200
    input: ["sire_id?", "status?", "supersedes_evaluation_id?", "limit?", "offset?"]
    output: GenomicEvaluation[]
    side_effects: []
  - method: POST
    path: "/genetics/genomic-evaluations/{id}/publish"
    description: "Publishes a DRAFT (or reinstates a SUPERSEDED) evaluation as the sire's official proof, revaluing every straw lot of that sire and every downstream consignment carrying value."
    roles: [ProgramDirector]
    code: 200
    input: ["publication_note?"]
    output: GenomicEvaluation
    side_effects:
      - "hop 1: the sire's published_production_index, published_health_index, published_composite_index and published_evaluation_effective_at are set from this row; any previously PUBLISHED row for the sire moves to SUPERSEDED and this row's supersedes_evaluation_id points at it"
      - "hop 2: every QUARANTINE or RELEASED StrawLot of that sire snapshots pre_revaluation_unit_value_cents and switches to MARKET_REVALUED per calculations.lot_unit_book_value"
      - "hop 3: every RECEIVED or IN_TRANSIT ConsignmentTransfer on those lots re-derives carried_value_cents"
      - "hop 4: each affected Distributor re-derives consignment_value_cents"
      - "revaluation_delta_cents on this evaluation records plant_inventory_value_cents after minus before"
  - method: POST
    path: "/genetics/genomic-evaluations/{id}/rollback"
    description: "Withdraws a PUBLISHED proof, restoring the previous one and undoing the revaluation exactly. Compensating action for publish."
    roles: [ProgramDirector]
    code: 200
    input: [rollback_reason]
    output: GenomicEvaluation
    side_effects:
      - "this row becomes ROLLED_BACK (terminal); the row named by supersedes_evaluation_id returns to PUBLISHED and the sire's published_* fields are restored from it; when there is none the published_* fields return to 0.00 and null"
      - "every lot revalued by the publication is restored from pre_revaluation_unit_value_cents, which is then cleared to null"
      - "carried_value_cents and Distributor.consignment_value_cents are re-derived, returning plant_inventory_value_cents to exactly its pre-publication figure"

  # ---- export certificates ----
  - method: POST
    path: "/genetics/export-certificates"
    description: "Drafts an export certificate binding one sire, one lot and one destination rule set."
    roles: [ExportCoordinator]
    code: 201
    input: [sire_id, straw_lot_id, country_requirement_id]
    output: ExportCertificate
    side_effects: ["status DRAFT; submission_round 0; destination_country_code copied from the CountryRequirement"]
  - method: GET
    path: "/genetics/export-certificates/{id}"
    description: "Reads one certificate including expires_at."
    roles: [ExportCoordinator, ProgramDirector, StaffVeterinarian, Distributor]
    code: 200
    input: []
    output: ExportCertificate
    side_effects: []
  - method: GET
    path: "/genetics/export-certificates"
    description: "Lists certificates; sire_id, straw_lot_id and country_requirement_id each reach a parent's children."
    roles: [ExportCoordinator, ProgramDirector, StaffVeterinarian, Distributor]
    code: 200
    input: ["sire_id?", "straw_lot_id?", "country_requirement_id?", "status?", "limit?", "offset?"]
    output: ExportCertificate[]
    side_effects: []
  - method: POST
    path: "/genetics/export-certificates/{id}/submit"
    description: "Submits a DRAFT or REJECTED certificate to the destination authority. Each entry into SUBMITTED consumes one of MAX_SUBMISSION_ROUNDS = 3 rounds."
    roles: [ExportCoordinator]
    code: 200
    input: ["submission_note?"]
    output: ExportCertificate
    side_effects: ["status becomes SUBMITTED; submission_round incremented; rejection_reason cleared"]
  - method: POST
    path: "/genetics/export-certificates/{id}/issue"
    description: "Signs a SUBMITTED certificate. Segregation of duties: the signing X-User-ID must not appear as recorded_by_user_id on any HealthTest of this sire."
    roles: [StaffVeterinarian]
    code: 200
    input: ["issue_note?"]
    output: ExportCertificate
    side_effects: ["status becomes ISSUED; issued_by_user_id and issued_at stored; expires_at set to the earliest valid_until among the satisfying tests"]
  - method: POST
    path: "/genetics/export-certificates/{id}/reject"
    description: "Records the destination authority's refusal of a SUBMITTED certificate; the coordinator may correct and resubmit while rounds remain."
    roles: [StaffVeterinarian, ProgramDirector]
    code: 200
    input: [rejection_reason]
    output: ExportCertificate
    side_effects: ["status becomes REJECTED; rejection_reason stored"]
  - method: POST
    path: "/genetics/export-certificates/{id}/revoke"
    description: "Manually revokes an ISSUED certificate. The same transition also fires automatically when the sire is suspended or the lot is condemned."
    roles: [ProgramDirector, StaffVeterinarian]
    code: 200
    input: [revocation_reason]
    output: ExportCertificate
    side_effects: ["status becomes REVOKED (terminal); transfers still referencing it can no longer be approved"]

  # ---- distributors and tanks ----
  - method: POST
    path: "/genetics/distributors"
    description: "Registers a distribution partner with a credit limit."
    roles: [ProgramDirector]
    code: 201
    input: [name, country_code, credit_limit_cents, "consignment_enabled?"]
    output: Distributor
    side_effects: ["consignment_value_cents, outstanding_balance_cents and cumulative_doses_used initialised to 0"]
  - method: GET
    path: "/genetics/distributors/{id}"
    description: "Reads one distributor including its derived exposure fields."
    roles: [ProgramDirector, Distributor, BreedingAdvisor]
    code: 200
    input: []
    output: Distributor
    side_effects: []
  - method: POST
    path: "/genetics/tanks"
    description: "Registers a liquid-nitrogen tank in a distributor's field network. The decay curve starts at the logical clock with initial_fill_pct (default 95.0)."
    roles: [ProgramDirector, Distributor]
    code: 201
    input: [distributor_id, serial, capacity_straws, "service_interval_days?", "assigned_technician_name?", "technician_cert_expiry_at?", "initial_fill_pct?"]
    output: Tank
    side_effects: ["last_service_at set to the logical clock; last_service_fill_pct set to initial_fill_pct; service_count 0; tank_status IN_SERVICE"]
  - method: GET
    path: "/genetics/tanks/{id}"
    description: "Reads one tank with its decayed ln2_level_pct and derived tank_status."
    roles: [ProgramDirector, Distributor]
    code: 200
    input: []
    output: Tank
    side_effects: []
  - method: GET
    path: "/genetics/tanks"
    description: "Lists tanks; distributor_id reaches a parent's children."
    roles: [ProgramDirector, Distributor]
    code: 200
    input: ["distributor_id?", "tank_status?", "limit?", "offset?"]
    output: Tank[]
    side_effects: []
  - method: POST
    path: "/genetics/tanks/{id}/ln2-service"
    description: "Records a liquid-nitrogen top-up, restarting the decay curve and incrementing the billable service counter."
    roles: [Distributor, ProgramDirector]
    code: 200
    input: [fill_pct]
    output: Tank
    side_effects:
      - "last_service_at = logical clock; last_service_fill_pct = fill_pct; service_count incremented; tank_status re-derived (OUT_OF_SERVICE -> IN_SERVICE when the fill clears 25.0)"
      - "the increment feeds service_fee_cents on any transfer in this tank settled later"

  # ---- consignment transfers ----
  - method: GET
    path: "/genetics/consignment-transfers/{id}"
    description: "Reads one consignment including its dose split and settlement components."
    roles: [ProgramDirector, Distributor, ExportCoordinator]
    code: 200
    input: []
    output: ConsignmentTransfer
    side_effects: []
  - method: GET
    path: "/genetics/consignment-transfers"
    description: "Lists consignments; straw_lot_id, distributor_id, tank_id and export_certificate_id each reach a parent's children."
    roles: [ProgramDirector, Distributor, ExportCoordinator]
    code: 200
    input: ["straw_lot_id?", "distributor_id?", "tank_id?", "export_certificate_id?", "status?", "limit?", "offset?"]
    output: ConsignmentTransfer[]
    side_effects: []
  - method: POST
    path: "/genetics/consignment-transfers/{id}/approve"
    description: "Approves a REQUESTED consignment. Gated on the sire's test currency, the distributor's consignment flag and, last of all, its credit limit."
    roles: [ProgramDirector]
    code: 200
    input: ["approval_note?"]
    output: ConsignmentTransfer
    side_effects: ["status becomes APPROVED; doses move from the lot's doses_available to doses_reserved; approved_by_user_id stored"]
  - method: POST
    path: "/genetics/consignment-transfers/{id}/reject"
    description: "Refuses a REQUESTED consignment without moving any dose."
    roles: [ProgramDirector]
    code: 200
    input: [rejection_reason]
    output: ConsignmentTransfer
    side_effects: ["status becomes REJECTED (terminal); no dose bucket changes"]
  - method: POST
    path: "/genetics/consignment-transfers/{id}/dispatch"
    description: "Ships an APPROVED consignment, pinning the tank's service counter so the eventual settlement bills only services performed after dispatch."
    roles: [ProgramDirector]
    code: 200
    input: ["dispatch_note?"]
    output: ConsignmentTransfer
    side_effects: ["status becomes IN_TRANSIT; tank_service_count_at_dispatch = Tank.service_count; Tank.straws_on_hand re-derived"]
  - method: POST
    path: "/genetics/consignment-transfers/{id}/receive"
    description: "Confirms arrival in the distributor's tank."
    roles: [Distributor]
    code: 200
    input: ["receipt_note?"]
    output: ConsignmentTransfer
    side_effects:
      - "status becomes RECEIVED; received_at set to the logical clock"
      - "doses move from the lot's doses_reserved to doses_consigned; carried_value_cents derived; Distributor.consignment_value_cents re-derived"
  - method: POST
    path: "/genetics/consignment-transfers/{id}/report-usage"
    description: "Reconciles a RECEIVED consignment: bills the doses inseminated, returns the remainder to plant stock and settles the invoice per calculations.consignment_settlement."
    roles: [Distributor]
    code: 200
    input: [doses_used, "doses_returned?"]
    output: ConsignmentTransfer
    side_effects:
      - "status becomes RECONCILED; doses_used and doses_returned stored"
      - "the lot's doses_consigned falls by doses_used + doses_returned, doses_used rises by doses_used and doses_available rises by doses_returned, conserving straw_count"
      - "gross_cents, service_fee_cents, rebate_cents and settlement_total_cents derived; Distributor.outstanding_balance_cents, cumulative_doses_used and consignment_value_cents re-derived"
      - "a lot whose doses_available, doses_reserved and doses_consigned all reach 0 moves RELEASED -> DEPLETED"
  - method: POST
    path: "/genetics/consignment-transfers/{id}/return"
    description: "Sends a RECEIVED consignment back unused. Compensating action for approve+dispatch+receive: every dose returns to doses_available and no money is billed."
    roles: [Distributor, ProgramDirector]
    code: 200
    input: [return_reason]
    output: ConsignmentTransfer
    side_effects:
      - "status becomes RETURNED (terminal); doses move from the lot's doses_consigned back to doses_available"
      - "carried_value_cents zeroed and Distributor.consignment_value_cents re-derived; no settlement figures are produced"

  # ---- customer herds and mating recommendations ----
  - method: POST
    path: "/genetics/customer-herds"
    description: "Registers a customer herd under a distributor, with the herd's own inbreeding ceiling."
    roles: [BreedingAdvisor, Distributor]
    code: 201
    input: [herd_name, distributor_id, "base_sire_id?", country_code, target_product_line, max_inbreeding_pct]
    output: CustomerHerd
    side_effects: ["recommendation_count initialised to 0"]
  - method: GET
    path: "/genetics/customer-herds/{id}"
    description: "Reads one customer herd."
    roles: [BreedingAdvisor, Distributor, ProgramDirector]
    code: 200
    input: []
    output: CustomerHerd
    side_effects: []
  - method: GET
    path: "/genetics/customer-herds"
    description: "Lists customer herds; distributor_id and base_sire_id each reach a parent's children."
    roles: [BreedingAdvisor, Distributor, ProgramDirector]
    code: 200
    input: ["distributor_id?", "base_sire_id?", "limit?", "offset?"]
    output: CustomerHerd[]
    side_effects: []
  - method: POST
    path: "/genetics/customer-herds/{id}/mating-recommendations"
    description: "Asks the advisor engine to pick a sire and a lot for one cow. The server runs calculations.mating_sire_selector - the caller never names the sire - then reports the inbreeding coefficient and the expected conception rate."
    roles: [BreedingAdvisor]
    code: 201
    input: [dam_ref, "dam_sire_id?", requested_product_line, doses_requested, "excluded_sire_ids?"]
    output: MatingRecommendation
    side_effects:
      - "status PROPOSED; recommended_sire_id, straw_lot_id, candidate_pool_size, inbreeding_pct and expected_conception_rate all derived and frozen"
      - "CustomerHerd.recommendation_count incremented; no dose moves until the recommendation is accepted"
  - method: GET
    path: "/genetics/mating-recommendations/{id}"
    description: "Reads one recommendation including the chosen sire, the chosen lot and the frozen expectations."
    roles: [BreedingAdvisor, Distributor, ProgramDirector]
    code: 200
    input: []
    output: MatingRecommendation
    side_effects: []
  - method: GET
    path: "/genetics/mating-recommendations"
    description: "Lists recommendations; customer_herd_id, recommended_sire_id, straw_lot_id and dam_sire_id each reach a parent's children."
    roles: [BreedingAdvisor, Distributor, ProgramDirector]
    code: 200
    input: ["customer_herd_id?", "recommended_sire_id?", "straw_lot_id?", "dam_sire_id?", "status?", "limit?", "offset?"]
    output: MatingRecommendation[]
    side_effects: []
  - method: POST
    path: "/genetics/mating-recommendations/{id}/decision"
    description: "Accepts or withdraws a PROPOSED recommendation."
    roles: [BreedingAdvisor, Distributor]
    code: 200
    input: [decision]
    output: MatingRecommendation
    side_effects:
      - "ACCEPTED moves doses_requested from the chosen lot's doses_available to doses_reserved and stores doses_committed; decided_at set"
      - "WITHDRAWN moves no dose and is terminal"

  # ---- computed read ----
  - method: GET
    path: "/genetics/inventory-valuation"
    description: "Computed read: the plant's straw inventory value per calculations.plant_inventory_value, split by quarantine and released stock. The figure a publication moves and a rollback restores."
    roles: [ProgramDirector, LabTechnician]
    code: 200
    input: []
    output: "{ plant_inventory_value_cents: integer, lot_count: integer, quarantine_value_cents: integer, released_value_cents: integer }"
    side_effects: []

errors:
  # ---- request shape ----
  - id: ERR_VALIDATION
    http: 400
    condition: "A required input field is missing or null, a field has the wrong type, an enum value is outside its declared set, a numeric value is outside its declared bounds, or an instant is not a valid ISO 8601 UTC timestamp."
  - id: ERR_USER_ID_REQUIRED
    http: 400
    condition: "X-User-ID is absent or empty on one of the four segregation-of-duties-tracked endpoints (health-test result, ejaculate qc-evaluation, straw-lot release, certificate issue)."

  # ---- auth ----
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is missing, or is not listed in the addressed endpoint's roles."
  - id: ERR_DISTRIBUTOR_SCOPE
    http: 403
    condition: "A Distributor-role caller addresses a ConsignmentTransfer, Tank, CustomerHerd or MatingRecommendation that belongs to a different distributor."
  - id: ERR_FACILITY_SCOPE
    http: 403
    condition: "A FacilityManager-role caller addresses a booking, or houses a sire, at a facility other than the one its X-User-ID identifies."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID releasing a StrawLot is the same user that QC-evaluated the parent ejaculate."
  - id: ERR_CERTIFIER_TESTED_SIRE
    http: 403
    condition: "The X-User-ID issuing an ExportCertificate has recorded at least one HealthTest result for that certificate's sire."

  # ---- not found ----
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path {id} or a body foreign key names no stored row. Single 404 code for every entity type, checked left-to-right along the path and then across the body."

  # ---- uniqueness ----
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "Facility.code, Sire.registration_code, Tank.serial or CountryRequirement.country_code collides with an existing row."
  - id: ERR_DUPLICATE_PENDING_TEST
    http: 409
    condition: "A second HealthTest of the same test_type is ordered for a sire while the first is still PENDING."

  # ---- optimistic concurrency ----
  - id: ERR_STALE_SIRE_VERSION
    http: 412
    condition: "expected_sire_version does not equal the Sire's current version when filing a genomic evaluation."
  - id: ERR_STALE_STRAW_LOT_VERSION
    http: 412
    condition: "expected_straw_lot_version does not equal the StrawLot's current version when requesting a consignment."

  # ---- state ----
  - id: ERR_SIRE_ACQUISITION_STATE
    http: 409
    condition: "The acquisition dimension forbids the requested move: contract outside PROSPECT, house outside CONTRACTED, retire outside RESIDENT."
  - id: ERR_SIRE_COLLECTION_STATE
    http: 409
    condition: "The collection dimension forbids the requested move: clearance outside ISOLATION, suspension outside ELIGIBLE, reinstatement outside SUSPENDED, any move out of WITHDRAWN, or booking a sire that is not ELIGIBLE."
  - id: ERR_FACILITY_SUSPENDED
    http: 409
    condition: "The referenced Facility has approval_status SUSPENDED when housing a sire, booking a bench slot or submitting an export certificate."
  - id: ERR_BOOKING_STATE
    http: 409
    condition: "The addressed CollectionBooking is not SCHEDULED (already COMPLETED, CANCELLED or VOIDED)."
  - id: ERR_EJACULATE_STATE
    http: 409
    condition: "QC evaluation of an ejaculate that is not PENDING_QC, or lot creation from an ejaculate that is not ACCEPTED."
  - id: ERR_LOT_STATE
    http: 409
    condition: "Release or rejection of a StrawLot that is not in QUARANTINE."
  - id: ERR_LOT_NOT_RELEASED
    http: 409
    condition: "A consignment is requested from a StrawLot whose distribution_status is not RELEASED."
  - id: ERR_EVALUATION_STATE
    http: 409
    condition: "Publishing an evaluation that is neither DRAFT nor SUPERSEDED, or rolling back one that is not PUBLISHED."
  - id: ERR_CERTIFICATE_STATE
    http: 409
    condition: "A certificate transition is attempted from the wrong source state: submit outside {DRAFT, REJECTED}, issue or reject outside SUBMITTED, revoke outside ISSUED."
  - id: ERR_TRANSFER_STATE
    http: 409
    condition: "A consignment transition is attempted from the wrong source state: approve or reject outside REQUESTED, dispatch outside APPROVED, receive outside IN_TRANSIT, report-usage or return outside RECEIVED."
  - id: ERR_TANK_OUT_OF_SERVICE
    http: 409
    condition: "A consignment is received into a Tank whose tank_status is OUT_OF_SERVICE (ln2_level_pct has decayed to 0)."

  # ---- business safety / regulatory ----
  - id: ERR_ISOLATION_INCOMPLETE
    http: 422
    condition: "Collection clearance is requested before the logical clock reaches Sire.isolation_ends_at."
  - id: ERR_HEALTH_TESTS_NOT_CURRENT
    http: 422
    condition: "One of BLUETONGUE, IBR, BVD or TRICHOMONIASIS lacks a NEGATIVE HealthTest whose valid_until is strictly after the logical clock, on clearance, reinstatement, booking or consignment approval."
  - id: ERR_COUNTRY_TEST_MISSING
    http: 422
    condition: "At issuance, a test_type in the destination's required_test_types has no NEGATIVE HealthTest that is both unexpired and within max_test_age_days of its sample_date."
  - id: ERR_QC_BELOW_THRESHOLD
    http: 422
    condition: "An ACCEPTED QC verdict is submitted with post_thaw_motility_pct < 35.0 or morphology_normal_pct < 70.0."

  # ---- business referential ----
  - id: ERR_SIRE_NOT_AT_FACILITY
    http: 422
    condition: "A booking names a facility that is not the sire's housing_facility_id."
  - id: ERR_TANK_NOT_OWNED_BY_DISTRIBUTOR
    http: 422
    condition: "The destination Tank's distributor_id differs from the consignment's distributor_id."
  - id: ERR_CERTIFICATE_NOT_APPLICABLE
    http: 422
    condition: "A cross-border consignment cites no certificate, or cites one that is not ISSUED, or one whose sire_id / straw_lot_id does not match the lot being shipped."
  - id: ERR_LOT_SIRE_MISMATCH
    http: 422
    condition: "An export certificate's straw_lot_id names a lot whose sire_id differs from the certificate's sire_id."
  - id: ERR_INVALID_RETEST_TARGET
    http: 422
    condition: "retest_of_test_id names a test of another sire, of another test_type, or one whose result is not POSITIVE or INCONCLUSIVE."
  - id: ERR_PEDIGREE_CYCLE
    http: 422
    condition: "A Sire's sire_id or dam_sire_id is its own id, or the edge would close a cycle in the pedigree DAG."

  # ---- business temporal ----
  - id: ERR_SIRE_REST_BUFFER
    http: 422
    condition: "A new booking's start_at is less than 48 hours after the sire's previous booking's end_at, or less than 48 hours before the next booking's start_at."
  - id: ERR_CLOCK_REWIND
    http: 422
    condition: "The requested current_utc is at or before the stored logical clock."
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "A booking window has start_at >= end_at, or start_at before the logical clock."
  - id: ERR_BOOKING_NOT_STARTED
    http: 422
    condition: "Completion is attempted before the logical clock reaches the booking's start_at."
  - id: ERR_SAMPLE_DATE_FUTURE
    http: 422
    condition: "A HealthTest sample_date is after the logical clock."

  # ---- business constraint / capacity ----
  - id: ERR_FACILITY_AT_CAPACITY
    http: 422
    condition: "Housing would raise Facility.resident_sire_count above housing_capacity."
  - id: ERR_BENCH_CAPACITY_EXCEEDED
    http: 422
    condition: "The count of SCHEDULED bookings whose half-open windows overlap the new one, plus one, exceeds Facility.bench_capacity."
  - id: ERR_DOSE_CAP_EXCEEDED
    http: 422
    condition: "The straw_count sum across an ejaculate's lots, including the new one, exceeds ejaculate_theoretical_doses."
  - id: ERR_INSUFFICIENT_DOSES
    http: 422
    condition: "The requested doses exceed StrawLot.doses_available, or a usage report's doses_used + doses_returned exceeds the transfer's doses."
  - id: ERR_TANK_CAPACITY_EXCEEDED
    http: 422
    condition: "Dispatch would raise Tank.straws_on_hand above capacity_straws."
  - id: ERR_PRODUCT_LINE_FIELDS
    http: 422
    condition: "A SEXED lot omits sexing_purity_pct or supplies it outside 50.0-99.9, or a CONVENTIONAL / EMBRYO lot supplies it at all."
  - id: ERR_DESTINATION_NOT_APPROVED
    http: 422
    condition: "The destination country is absent from the origin Facility.approved_export_countries."
  - id: ERR_PRODUCT_NOT_PERMITTED
    http: 422
    condition: "A SEXED lot is certified for a destination with sexed_semen_allowed false, or an EMBRYO lot for one with embryo_allowed false."
  - id: ERR_ISOLATION_TOO_SHORT
    http: 422
    condition: "Sire.isolation_days_applied is below the destination CountryRequirement.min_isolation_days."
  - id: ERR_RESUBMISSION_LIMIT
    http: 422
    condition: "A certificate is submitted when submission_round already equals MAX_SUBMISSION_ROUNDS = 3."
  - id: ERR_CONSIGNMENT_DISABLED
    http: 422
    condition: "A consignment approval is attempted for a Distributor whose consignment_enabled flag is false."
  - id: ERR_NO_ELIGIBLE_SIRE
    http: 422
    condition: "mating_sire_selector's candidate pool is empty after eligibility filtering, exclusions and the herd's inbreeding ceiling."

  # ---- business fiscal ----
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 422
    condition: "Projected distributor exposure at approval time exceeds Distributor.credit_limit_cents (a projection landing exactly on the limit is allowed)."

roles:
  - name: ProgramDirector
    description: "Genetics programme owner. Runs sire acquisition and retirement, files and publishes genomic evaluations, rolls proofs back, and holds the commercial gates on consignment approval and rejection. Also owns the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /genetics/_clock/set_current_utc"
      - "POST /genetics/facilities"
      - "POST /genetics/facilities/{id}/approval-status"
      - "POST /genetics/sires"
      - "POST /genetics/sires/{id}/contract"
      - "POST /genetics/sires/{id}/retire"
      - "POST /genetics/sires/{id}/pedigree"
      - "POST /genetics/sires/{id}/genomic-evaluations"
      - "POST /genetics/genomic-evaluations/{id}/publish"
      - "POST /genetics/genomic-evaluations/{id}/rollback"
      - "POST /genetics/distributors"
      - "POST /genetics/consignment-transfers/{id}/approve"
      - "POST /genetics/consignment-transfers/{id}/reject"
      - "POST /genetics/consignment-transfers/{id}/dispatch"
    shared_operations:
      - "POST /genetics/sires/{id}/house (with FacilityManager)"
      - "POST /genetics/sires/{id}/collection-status (with StaffVeterinarian)"
      - "POST /genetics/country-requirements (with ExportCoordinator)"
      - "POST /genetics/collection-bookings/{id}/cancel (with FacilityManager)"
      - "POST /genetics/export-certificates/{id}/reject and /revoke (with StaffVeterinarian)"
      - "POST /genetics/tanks and POST /genetics/tanks/{id}/ln2-service (with Distributor)"
      - "POST /genetics/consignment-transfers/{id}/return (with Distributor)"
      - "GET /genetics/inventory-valuation (with LabTechnician)"
      - "all GET reads"
  - name: FacilityManager
    description: "Runs one collection facility's bench: books slots, cancels them, records collections. Identity is the facility itself, so a manager can never touch another facility's bookings."
    identity: "entity_backed:Facility"
    exclusive_operations:
      - "POST /genetics/collection-bookings"
      - "POST /genetics/collection-bookings/{id}/complete"
    shared_operations:
      - "POST /genetics/sires/{id}/house (with ProgramDirector)"
      - "POST /genetics/collection-bookings/{id}/cancel (with ProgramDirector)"
      - "GET reads on facilities, sires, health-tests, bookings and ejaculates"
  - name: StaffVeterinarian
    description: "Herd health authority. Orders and results health tests, clears bulls for collection, suspends and reinstates them, and signs export certificates. Segregation of duties bars the individual vet who resulted a sire's tests from signing that sire's certificate."
    identity: "opaque"
    exclusive_operations:
      - "POST /genetics/sires/{id}/health-tests"
      - "POST /genetics/health-tests/{id}/result"
      - "POST /genetics/sires/{id}/collection-clearance"
      - "POST /genetics/export-certificates/{id}/issue"
    shared_operations:
      - "POST /genetics/sires/{id}/collection-status (with ProgramDirector)"
      - "POST /genetics/export-certificates/{id}/reject and /revoke (with ProgramDirector)"
      - "GET reads on facilities, sires, health-tests, bookings, country-requirements and certificates"
  - name: LabTechnician
    description: "Processing laboratory. Evaluates ejaculate quality, cuts straw lots, releases or condemns them. Segregation of duties bars the individual technician who QC-evaluated an ejaculate from releasing the lots cut from it."
    identity: "opaque"
    exclusive_operations:
      - "POST /genetics/ejaculates/{id}/qc-evaluation"
      - "POST /genetics/ejaculates/{id}/straw-lots"
      - "POST /genetics/straw-lots/{id}/release"
      - "POST /genetics/straw-lots/{id}/reject"
    shared_operations:
      - "GET /genetics/inventory-valuation (with ProgramDirector)"
      - "GET reads on sires, bookings, ejaculates and straw-lots"
  - name: ExportCoordinator
    description: "Regulatory affairs. Maintains destination rule sets, drafts certificates and submits them to authorities, but may never sign one - issuance belongs to a veterinarian."
    identity: "opaque"
    exclusive_operations:
      - "POST /genetics/export-certificates"
      - "POST /genetics/export-certificates/{id}/submit"
    shared_operations:
      - "POST /genetics/country-requirements (with ProgramDirector)"
      - "GET reads on facilities, sires, health-tests, straw-lots, certificates and consignment-transfers"
  - name: Distributor
    description: "Field distribution partner. Receives consignments into its own tanks, services them with liquid nitrogen, reports usage, returns unused stock, and registers customer herds. Identity is the Distributor row, so every consignment, tank and herd it touches must carry its own id."
    identity: "entity_backed:Distributor"
    exclusive_operations:
      - "POST /genetics/consignment-transfers/{id}/receive"
      - "POST /genetics/consignment-transfers/{id}/report-usage"
    shared_operations:
      - "POST /genetics/tanks and POST /genetics/tanks/{id}/ln2-service (with ProgramDirector)"
      - "POST /genetics/straw-lots/{id}/consignment-transfers (with ProgramDirector)"
      - "POST /genetics/consignment-transfers/{id}/return (with ProgramDirector)"
      - "POST /genetics/customer-herds (with BreedingAdvisor)"
      - "POST /genetics/mating-recommendations/{id}/decision (with BreedingAdvisor)"
      - "GET reads on its own distributors, tanks, transfers, herds, recommendations, straw-lots and certificates"
  - name: BreedingAdvisor
    description: "Customer-facing breeding programme adviser. Asks the selector engine for mating recommendations and records the customer's decision, but has no authority over inventory, health or certification."
    identity: "opaque"
    exclusive_operations:
      - "POST /genetics/customer-herds/{id}/mating-recommendations"
    shared_operations:
      - "POST /genetics/customer-herds (with Distributor)"
      - "POST /genetics/mating-recommendations/{id}/decision (with Distributor)"
      - "GET reads on sires, straw-lots, genomic-evaluations, customer-herds and mating-recommendations"
