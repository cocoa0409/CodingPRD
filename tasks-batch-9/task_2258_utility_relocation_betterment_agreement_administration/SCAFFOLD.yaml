scenario: >-
  2258. Utility Relocation & Betterment Agreement Administration (state transportation utility
  coordination office): project utility conflict identification through subsurface investigation
  and record research, prior rights determination establishing who bears relocation cost,
  relocation plan review, schedule commitments and coordination with construction phasing,
  betterment cost allocation when the utility upgrades beyond replacement in kind, reimbursement
  agreement execution with cost documentation and audit rights, delay claims from contractors
  caused by late utility relocation, permitting, easement acquisition and joint trench
  opportunities, as-built documentation and final cost settlement

domain_name: utility-relocation-betterment
api_prefix: /uro

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by explicit FK fields; every resource is addressed by a
  # single-segment collection path under /uro (no deep nesting in write paths).
  # Sub-resource GETs exist only as reverse-reachability read channels.

  state_machine_shape: cyclic
  # PriorRightsDetermination cycles DRAFT->UNDER_REVIEW->ISSUED->APPEALED->DRAFT;
  # RelocationPlan cycles SUBMITTED->UNDER_REVIEW->REVISION_REQUESTED->SUBMITTED;
  # ReimbursementAgreement carries two independent state dimensions
  # (execution_status x settlement_status) on the same row; UtilityConflict branches
  # (RELOCATE path vs PROTECT_IN_PLACE/NO_CONFLICT path) with divergent side effects.

  relationship_patterns:
    - one_to_many
    - many_to_many          # JointTrenchSlot <-> ScheduleCommitment (shared trench occupancy)
    - self_referential      # UtilityConflict.depends_on_conflict_id (clearance sequencing)
    - cross_aggregate       # ReimbursementAgreement ledger writes onto Project

  role_model: segregation_of_duties
  # The AgreementOfficer who executes a reimbursement agreement may not be the
  # ExternalAuditor who questions its costs; the RightOfWayAdjudicator who first
  # issued a determination may not re-issue it after an owner appeal.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Highway project name as carried on the letting schedule
        constraints: 1-160 chars, non-blank
      - name: route_designation
        type: string
        source: input
        description: State route designation (e.g. "SR-14")
        constraints: 1-24 chars
      - name: letting_date
        type: datetime
        source: input
        description: Scheduled contract letting instant (ISO 8601 UTC)
      - name: construction_start_date
        type: datetime
        source: input
        description: First instant of the construction window (ISO 8601 UTC)
      - name: construction_end_date
        type: datetime
        source: input
        description: Last instant of the construction window (ISO 8601 UTC)
        constraints: must be strictly greater than construction_start_date
      - name: row_acquisition_year
        type: integer
        source: input
        description: Calendar year the state acquired the right-of-way at this location; the prior-rights cutoff year
        constraints: 1850-2100
      - name: reimbursement_authority_cents
        type: integer
        source: input
        description: Programmed dollar authority (cents) available for state-share relocation reimbursement on this project
        constraints: ">= 0"
      - name: contract_daily_overhead_cents
        type: integer
        source: input
        description: Contract-stipulated daily overhead ceiling (cents/day) used as the delay-claim daily rate cap
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Project lifecycle state
        default: PLANNING
        constraints: PLANNING | CLEARANCE_ACTIVE | LETTING_READY | UNDER_CONSTRUCTION | CLOSED
      - name: clearance_posture
        type: enum
        source: computed
        description: Derived utility-clearance posture that gates agreement execution and commitment creation (see calculations.project_clearance_posture)
        default: CLEARANCE_PENDING
        constraints: CLEARANCE_PENDING | AT_RISK | FUNDING_BLOCKED | CLEAR
      - name: open_conflict_count
        type: integer
        source: computed
        description: Count of UtilityConflict rows on this project whose status is not CLEARED
        default: 0
      - name: estimated_state_liability_cents
        type: integer
        source: computed
        description: Forward-looking state relocation liability over all conflicts with a determined state share (see calculations.project_state_liability_estimate)
        default: 0
      - name: total_committed_reimbursement_cents
        type: integer
        source: computed
        description: Conserved ledger of state share committed by executed agreements (see calculations.project_committed_reimbursement_ledger)
        default: 0
      - name: aggregate_compensable_delay_days
        type: integer
        source: computed
        description: Conserved sum of compensable_days across DelayClaim rows in status ALLOCATED on this project
        default: 0

  - name: UtilityOwner
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the utility owner as it appears on the master agreement
        constraints: 1-160 chars, non-blank
      - name: utility_type
        type: enum
        source: input
        description: Class of utility service the owner operates
        constraints: ELECTRIC | GAS | WATER | SEWER | TELECOM | FIBER
      - name: is_public_agency
        type: boolean
        source: input
        description: True when the owner is a municipality or public district eligible for municipal relief in prior-rights scoring
        default: false
      - name: indirect_cost_rate_pct
        type: number
        source: input
        description: Audited indirect cost rate applied to eligible direct cost, in percent
        constraints: 0 <= value <= 35, at most 2 decimal places
      - name: delinquency_strikes
        type: integer
        source: computed
        description: Count of ScheduleCommitment rows of this owner in status BREACHED
        default: 0
      - name: reimbursement_hold
        type: boolean
        source: computed
        description: True once delinquency_strikes >= 2 (the delinquency hold threshold); cleared only by POST /uro/utility-owners/{id}/release-hold
        default: false
      - name: open_commitment_days
        type: integer
        source: computed
        description: Conserved sum of committed_work_days across this owner's commitments in status COMMITTED or IN_PROGRESS
        default: 0
      - name: assessed_delay_liability_cents
        type: integer
        source: computed
        description: Conserved sum of allocated_to_owner_cents across DelayClaim rows in status ALLOCATED against this owner's commitments
        default: 0

  - name: UtilityFacility
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: FK -> UtilityOwner.id; the owner of record for this facility
      - name: facility_type
        type: enum
        source: input
        description: Physical facility class
        constraints: OVERHEAD_ELECTRIC | BURIED_ELECTRIC | GAS_MAIN | WATER_MAIN | SANITARY_SEWER | FIBER_CONDUIT
      - name: station_begin
        type: number
        source: input
        description: Engineering station (feet) where the facility enters the project limits
        constraints: ">= 0"
      - name: station_end
        type: number
        source: input
        description: Engineering station (feet) where the facility leaves the project limits
        constraints: must be strictly greater than station_begin
      - name: offset_ft
        type: number
        source: input
        description: Lateral offset from centerline in feet (negative = left of centerline)
      - name: depth_in
        type: integer
        source: input
        description: Depth of cover of record, in inches; 0 for overhead facilities
        constraints: ">= 0"
      - name: material
        type: string
        source: input
        description: Facility material of record (e.g. "DUCTILE_IRON", "HDPE")
        constraints: 1-40 chars
      - name: installed_year
        type: integer
        source: input
        description: Year the facility was installed per owner records; compared against Project.row_acquisition_year
        constraints: 1850-2100
      - name: occupancy_basis
        type: enum
        source: input
        description: Documented legal basis on which the facility occupies the corridor
        constraints: FEE_SIMPLE | PRIVATE_EASEMENT | FRANCHISE | PERMIT | UNDOCUMENTED
      - name: record_source
        type: enum
        source: input
        description: Provenance of the record data captured above
        constraints: AS_BUILT | OWNER_ATLAS | FIELD_SURVEY | VERBAL

  - name: SubsurfaceInvestigation
    parent: null
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; project under whose SUE task order the investigation was performed
      - name: facility_id
        type: string
        source: input
        description: FK -> UtilityFacility.id; facility the test hole or record research targets
      - name: quality_level
        type: enum
        source: input
        description: SUE quality level of the evidence produced
        constraints: QL_A | QL_B | QL_C | QL_D
      - name: method
        type: enum
        source: input
        description: Investigation method used
        constraints: VACUUM_TEST_HOLE | GEOPHYSICAL | SURFACE_MARKING | RECORD_RESEARCH
      - name: measured_depth_in
        type: integer
        source: input
        description: Depth of cover measured in the field, in inches
        constraints: ">= 0"
      - name: station_at_investigation
        type: number
        source: input
        description: Engineering station (feet) at which the investigation was taken
        constraints: ">= 0"
      - name: performed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the investigation row was recorded
      - name: contradicts_record
        type: boolean
        source: computed
        description: True when quality_level == QL_A and abs(measured_depth_in - UtilityFacility.depth_in) > DEPTH_TOLERANCE_IN
        default: false

  - name: UtilityConflict
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; project whose design conflicts with the facility
      - name: facility_id
        type: string
        source: input
        description: FK -> UtilityFacility.id; conflicting facility
      - name: depends_on_conflict_id
        type: string
        source: input
        description: "FK -> UtilityConflict.id; nullable self-reference — this conflict cannot be certified cleared until the referenced conflict is CLEARED"
        default: null
      - name: conflict_station
        type: number
        source: input
        description: Engineering station (feet) of the conflict point
        constraints: ">= 0"
      - name: clearance_deficiency_in
        type: integer
        source: input
        description: Shortfall against required clearance, in inches
        constraints: ">= 0"
      - name: resolution_type
        type: enum
        source: input
        description: Selected resolution strategy, set by POST /uro/conflicts/{id}/set-resolution
        default: null
        constraints: RELOCATE | PROTECT_IN_PLACE | ABANDON | NO_CONFLICT
      - name: state_share_pct
        type: integer
        source: computed
        description: State cost-responsibility percentage copied from the issued PriorRightsDetermination; null until a determination is issued
        default: null
        constraints: 0-100
      - name: status
        type: enum
        source: system
        description: Conflict clearance lifecycle state
        default: IDENTIFIED
        constraints: IDENTIFIED | RESOLUTION_SELECTED | RESPONSIBILITY_SET | RELOCATION_PLANNED | RELOCATION_SCHEDULED | CLEARED

  - name: PriorRightsDetermination
    parent: null
    common_fields: true
    fields:
      - name: conflict_id
        type: string
        source: input
        description: FK -> UtilityConflict.id; conflict whose cost responsibility is being determined
      - name: claimed_basis
        type: enum
        source: input
        description: Occupancy basis the utility owner claims in its prior-rights submittal
        constraints: FEE_SIMPLE | PRIVATE_EASEMENT | FRANCHISE | PERMIT | UNDOCUMENTED
      - name: narrative
        type: string
        source: input
        description: Adjudicator narrative supporting the determination
        constraints: 1-2000 chars
      - name: evidence_variant
        type: enum
        source: computed
        description: Which calculation variant produced final_state_share_pct at issuance
        default: null
        constraints: RECORD_BASIS | FIELD_BASIS
      - name: provisional_state_share_pct
        type: integer
        source: computed
        description: RECORD_BASIS state share computed at draft creation from record data only
        constraints: 0-100
      - name: final_state_share_pct
        type: integer
        source: computed
        description: State share computed at issuance under the selected evidence_variant; null before issuance
        default: null
        constraints: 0-100
      - name: appeal_round
        type: integer
        source: system
        description: Number of owner appeals lodged against this determination
        default: 0
      - name: first_issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the adjudicator who issued this determination the first time; drives the segregation-of-duties check on re-issue
        default: null
      - name: status
        type: enum
        source: system
        description: Determination review lifecycle state
        default: DRAFT
        constraints: DRAFT | UNDER_REVIEW | RETURNED_FOR_REVISION | ISSUED | APPEALED | FINAL

  - name: RelocationPlan
    parent: null
    common_fields: true
    fields:
      - name: conflict_id
        type: string
        source: input
        description: "FK -> UtilityConflict.id; owning conflict. The plan's utility owner is derived as RelocationPlan.conflict_id -> UtilityConflict.facility_id -> UtilityFacility.owner_id"
      - name: revision_round
        type: integer
        source: system
        description: Number of times this plan has been resubmitted after a revision request
        default: 0
      - name: estimated_cost_cents
        type: integer
        source: input
        description: Owner's estimated total relocation cost for the plan as submitted, in cents
        constraints: "> 0"
      - name: replacement_in_kind_cost_cents
        type: integer
        source: input
        description: Estimated cost of replacing the existing facility in kind, in cents
        constraints: "> 0 and <= estimated_cost_cents"
      - name: proposed_capacity_ratio
        type: number
        source: input
        description: Ratio of proposed facility capacity to existing capacity; values strictly greater than BETTERMENT_RATIO_THRESHOLD make the upgrade a betterment
        constraints: ">= 1.0, at most 2 decimal places"
      - name: work_days
        type: integer
        source: input
        description: Working days the owner estimates the relocation requires
        constraints: "> 0"
      - name: joint_trench_requested
        type: boolean
        source: input
        description: True when the owner asks to share a joint trench opening with other occupants
        default: false
      - name: betterment_ratio
        type: number
        source: computed
        description: Fraction of the plan cost attributable to betterment; see calculations.betterment_credit
        default: 0
        constraints: "0.0 <= value <= 1.0, exactly 6 decimal places"
      - name: betterment_amount_cents
        type: integer
        source: computed
        description: Plan-level betterment amount in cents; see calculations.betterment_credit step 4
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Plan review lifecycle state
        default: SUBMITTED
        constraints: SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | APPROVED | SUPERSEDED

  - name: PermitRecord
    parent: null
    common_fields: true
    fields:
      - name: conflict_id
        type: string
        source: input
        description: FK -> UtilityConflict.id; conflict whose relocation work needs the permit or easement
      - name: permit_type
        type: enum
        source: input
        description: Kind of permitting or easement-acquisition instrument
        constraints: ENCROACHMENT_PERMIT | EASEMENT_ACQUISITION | RAILROAD_CROSSING | ENVIRONMENTAL_CLEARANCE
      - name: applied_on
        type: datetime
        source: system
        description: Logical-clock instant at which the application was filed
      - name: granted_on
        type: datetime
        source: system
        description: Logical-clock instant at which the permit was granted; null unless status == GRANTED
        default: null
      - name: expires_on
        type: datetime
        source: input
        description: Expiry instant supplied on the grant decision; null on denial
        default: null
      - name: decision_note
        type: string
        source: input
        description: Reviewer note recorded with the grant or denial
        default: null
        constraints: 0-500 chars
      - name: status
        type: enum
        source: system
        description: Permit lifecycle state
        default: APPLIED
        constraints: APPLIED | GRANTED | DENIED

  - name: JointTrenchSlot
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; project that opens the trench
      - name: segment_code
        type: string
        source: input
        description: Corridor segment code the trench opening serves (e.g. "SEG-A")
        constraints: 1-24 chars
      - name: trench_open_start
        type: datetime
        source: input
        description: First instant the trench is open (inclusive boundary)
      - name: trench_open_end
        type: datetime
        source: input
        description: Last instant the trench is open (inclusive boundary); must be strictly greater than trench_open_start
      - name: max_occupants
        type: integer
        source: input
        description: Maximum number of concurrent occupants the trench opening can carry
        constraints: ">= 1"
      - name: occupant_count
        type: integer
        source: computed
        description: Count of ScheduleCommitment rows referencing this slot whose status is COMMITTED or IN_PROGRESS
        default: 0
      - name: status
        type: enum
        source: computed
        description: OPEN while occupant_count < max_occupants, FULL once occupant_count >= max_occupants
        default: OPEN
        constraints: OPEN | FULL

  - name: ScheduleCommitment
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> RelocationPlan.id; approved plan this commitment schedules
      - name: project_id
        type: string
        source: computed
        description: FK -> Project.id; denormalized at creation from plan.conflict_id -> UtilityConflict.project_id
      - name: facility_id
        type: string
        source: computed
        description: FK -> UtilityFacility.id; denormalized at creation from plan.conflict_id -> UtilityConflict.facility_id; the resource against which buffered window exclusion is enforced
      - name: owner_id
        type: string
        source: computed
        description: FK -> UtilityOwner.id; denormalized at creation from the facility's owner
      - name: joint_trench_slot_id
        type: string
        source: input
        description: FK -> JointTrenchSlot.id; nullable slot the owner asks to occupy
        default: null
      - name: window_start
        type: datetime
        source: input
        description: First instant of the committed relocation window (inclusive)
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end instant of the committed relocation window; must be strictly greater than window_start
      - name: committed_work_days
        type: integer
        source: input
        description: Working days the owner commits to inside the window
        constraints: "> 0"
      - name: phase_dependency
        type: enum
        source: input
        description: Construction phasing dependency the relocation must respect
        constraints: BEFORE_GRADING | AFTER_GRADING | BEFORE_PAVING | ANY_PHASE
      - name: actual_complete_at
        type: datetime
        source: computed
        description: Logical-clock instant at which completion was reported; null until reported
        default: null
      - name: late_days
        type: integer
        source: computed
        description: ceil((actual_complete_at - window_end) / 1 day), floored at 0; 0 until completion is reported
        default: 0
      - name: status
        type: enum
        source: system
        description: Commitment lifecycle state
        default: COMMITTED
        constraints: COMMITTED | IN_PROGRESS | COMPLETE | BREACHED | CANCELLED

  - name: ReimbursementAgreement
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> RelocationPlan.id; approved plan the agreement reimburses
      - name: project_id
        type: string
        source: computed
        description: FK -> Project.id; denormalized at creation from plan.conflict_id -> UtilityConflict.project_id
      - name: owner_id
        type: string
        source: computed
        description: FK -> UtilityOwner.id; denormalized at creation from the conflicting facility's owner
      - name: not_to_exceed_cents
        type: integer
        source: input
        description: Contractual not-to-exceed ceiling; caps the chronological accrual of actual costs and the final state share
        constraints: "> 0"
      - name: cost_basis
        type: enum
        source: computed
        description: Which variant of calculations.agreement_eligible_cost produced the currently stored money fields
        default: ESTIMATE_BASIS
        constraints: ESTIMATE_BASIS | ACTUAL_BASIS
      - name: eligible_cost_cents
        type: integer
        source: computed
        description: Eligible direct cost D under the current cost_basis
        default: 0
      - name: indirect_cost_cents
        type: integer
        source: computed
        description: Indirect allowance I = round_half_up(eligible_cost_cents * owner.indirect_cost_rate_pct / 100)
        default: 0
      - name: betterment_credit_cents
        type: integer
        source: computed
        description: Betterment credit B withheld from the owner (see calculations.betterment_credit)
        default: 0
      - name: net_allowable_cents
        type: integer
        source: computed
        description: N = eligible_cost_cents + indirect_cost_cents - betterment_credit_cents
        default: 0
      - name: participation_tier_pct
        type: integer
        source: computed
        description: Administrative participation tier selected from net_allowable_cents
        default: 0
        constraints: 90 | 95 | 100
      - name: state_share_cents
        type: integer
        source: computed
        description: State share S after tier application and not_to_exceed capping
        default: 0
      - name: owner_share_cents
        type: integer
        source: computed
        description: owner_share_cents = net_allowable_cents - state_share_cents; conserved against N
        default: 0
      - name: as_built_reference
        type: string
        source: computed
        description: As-built documentation reference stamped from the final-settlement request body
        default: null
      - name: executed_by_user_id
        type: string
        source: system
        description: X-User-ID of the AgreementOfficer who executed the agreement; drives the audit segregation-of-duties check
        default: null
      - name: execution_status
        type: enum
        source: system
        description: Execution dimension of the agreement's parallel state model
        default: DRAFT
        constraints: DRAFT | PENDING_OWNER_SIGNATURE | EXECUTED | VOIDED
      - name: settlement_status
        type: enum
        source: system
        description: Settlement dimension of the agreement's parallel state model, evolving independently of execution_status
        default: NOT_STARTED
        constraints: NOT_STARTED | PENDING_FINAL_INVOICE | HELD | AUDIT_IN_PROGRESS | SETTLED | VOIDED_OUT

  - name: CostDocument
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> ReimbursementAgreement.id; agreement the billing document is submitted under
      - name: doc_type
        type: enum
        source: input
        description: Cost element the document supports; CREDIT_SALVAGE reduces eligible cost
        constraints: LABOR | MATERIAL | EQUIPMENT | CONTRACT | INDIRECT | CREDIT_SALVAGE
      - name: amount_cents
        type: integer
        source: input
        description: Absolute magnitude of the document in cents; CREDIT_SALVAGE rows are subtracted rather than added
        constraints: "> 0"
      - name: incurred_on
        type: datetime
        source: input
        description: Instant the cost was incurred; primary sort key of the chronological accrual
      - name: support_reference
        type: string
        source: input
        description: Supporting documentation reference (payroll register, invoice number)
        default: null
        constraints: 0-120 chars
      - name: disallowed_amount_cents
        type: integer
        source: computed
        description: Portion of amount_cents excluded from eligible cost; equals amount_cents when the row is excluded whole
        default: 0
      - name: exclusion_reason
        type: enum
        source: computed
        description: Why the row was excluded from eligible cost; null while the row is included
        default: null
        constraints: NOT_SUPPORTED | EXCEEDS_NOT_TO_EXCEED_CAP | SUSTAINED_AUDIT_FINDING
      - name: review_status
        type: enum
        source: system
        description: Billing review state of the document
        default: SUBMITTED
        constraints: SUBMITTED | ACCEPTED | DISALLOWED | HELD

  - name: AuditFinding
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> ReimbursementAgreement.id; agreement whose costs are questioned
      - name: finding_type
        type: enum
        source: input
        description: Category of the audit exception
        constraints: UNSUPPORTED_COST | INELIGIBLE_BETTERMENT | INDIRECT_RATE_ERROR | DUPLICATE_BILLING
      - name: questioned_cost_cents
        type: integer
        source: input
        description: Amount of cost the auditor questions, in cents
        constraints: "> 0"
      - name: auditor_user_id
        type: string
        source: system
        description: X-User-ID of the ExternalAuditor who raised the finding
      - name: disposition
        type: enum
        source: computed
        description: Resolution reached on the finding; null while status == OPEN
        default: null
        constraints: SUSTAINED | WITHDRAWN
      - name: status
        type: enum
        source: system
        description: Finding lifecycle state
        default: OPEN
        constraints: OPEN | RESOLVED

  - name: DelayClaim
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; project whose contractor lodged the claim
      - name: commitment_id
        type: string
        source: input
        description: FK -> ScheduleCommitment.id; commitment whose late performance is alleged to have caused the delay
      - name: contractor_name
        type: string
        source: input
        description: Prime contractor lodging the claim
        constraints: 1-160 chars
      - name: claimed_days
        type: integer
        source: input
        description: Calendar days of delay the contractor claims
        constraints: "> 0"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: Total dollars claimed, in cents
        constraints: "> 0"
      - name: delay_cause
        type: enum
        source: computed
        description: Cause assigned during analysis; drives the owner-fault split
        default: null
        constraints: UTILITY_OWNER | UTILITY_OWNER_PERMIT_WAIT | STATE_PERMIT_DELAY | THIRD_PARTY
      - name: compensable_days
        type: integer
        source: computed
        description: max(0, min(claimed_days, commitment.late_days) - CONTRACTUAL_FLOAT_DAYS)
        default: 0
      - name: daily_rate_cents
        type: integer
        source: computed
        description: min(project.contract_daily_overhead_cents, round_half_up(claimed_amount_cents / claimed_days))
        default: 0
      - name: allocated_to_owner_cents
        type: integer
        source: computed
        description: Portion of the compensable amount charged back to the utility owner
        default: 0
      - name: allocated_to_state_cents
        type: integer
        source: computed
        description: Residual portion borne by the state; conserved as gross - allocated_to_owner_cents
        default: 0
      - name: status
        type: enum
        source: system
        description: Claim lifecycle state
        default: SUBMITTED
        constraints: SUBMITTED | UNDER_ANALYSIS | ALLOCATED | DENIED

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    state_field: status
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: CLEARANCE_ACTIVE
        trigger: "POST /uro/conflicts (system: first UtilityConflict created for this project)"
        actor: system
        preconditions: ["project.status == PLANNING"]
        side_effects:
          - "recompute Project.open_conflict_count (calculations.project_clearance_posture step 1)"
          - "recompute Project.estimated_state_liability_cents and Project.clearance_posture"
          - "increment Project.version by 1"
      - from: LETTING_READY
        to: CLEARANCE_ACTIVE
        trigger: "POST /uro/conflicts (system: a newly identified conflict reopens clearance on an already-clear project)"
        actor: system
        preconditions: ["project.status == LETTING_READY"]
        side_effects:
          - "recompute Project.open_conflict_count (now >= 1) and Project.clearance_posture (leaves CLEAR)"
          - "increment Project.version by 1"
        note: "Revert edge that makes the Project machine cyclic between CLEARANCE_ACTIVE and LETTING_READY."
      - from: CLEARANCE_ACTIVE
        to: LETTING_READY
        trigger: "system: any recompute of Project.clearance_posture that yields CLEAR (bubble-up from POST /uro/conflicts/{id}/certify-cleared)"
        actor: system
        preconditions: ["project.status == CLEARANCE_ACTIVE", "Project.clearance_posture == CLEAR after recompute (i.e. open_conflict_count == 0 and estimated_state_liability_cents <= reimbursement_authority_cents)"]
        side_effects: ["increment Project.version by 1"]
      - from: CLEARANCE_ACTIVE
        to: UNDER_CONSTRUCTION
        trigger: "POST /uro/commitments/{id}/start-work (system: first commitment on this project entering IN_PROGRESS)"
        actor: system
        preconditions: ["project.status IN {CLEARANCE_ACTIVE, LETTING_READY}"]
        side_effects: ["increment Project.version by 1"]
      - from: LETTING_READY
        to: UNDER_CONSTRUCTION
        trigger: "POST /uro/commitments/{id}/start-work (system: first commitment on this project entering IN_PROGRESS)"
        actor: system
        preconditions: ["project.status IN {CLEARANCE_ACTIVE, LETTING_READY}"]
        side_effects: ["increment Project.version by 1"]
      - from: UNDER_CONSTRUCTION
        to: CLOSED
        trigger: "POST /uro/projects/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "project.status == UNDER_CONSTRUCTION"
          - "every ReimbursementAgreement with project_id == project.id has settlement_status IN {SETTLED, VOIDED_OUT} (else ERR_PROJECT_CLOSE_BLOCKED)"
          - "no DelayClaim with project_id == project.id has status IN {SUBMITTED, UNDER_ANALYSIS} (else ERR_PROJECT_CLOSE_BLOCKED)"
        side_effects: ["increment Project.version by 1"]

  - entity: UtilityConflict
    state_field: status
    initial_state: IDENTIFIED
    terminal_states: [CLEARED]
    transitions:
      - from: IDENTIFIED
        to: RESOLUTION_SELECTED
        trigger: "POST /uro/conflicts/{id}/set-resolution"
        actor: UtilityCoordinator
        preconditions: ["conflict.status == IDENTIFIED", "project.status != CLOSED"]
        side_effects: ["set UtilityConflict.resolution_type from the request body", "increment UtilityConflict.version by 1"]
      - from: RESOLUTION_SELECTED
        to: RESPONSIBILITY_SET
        trigger: "POST /uro/prior-rights/{id}/issue (cascade link 1)"
        actor: system
        preconditions: ["conflict.status == RESOLUTION_SELECTED", "the issuing determination's conflict_id == conflict.id"]
        side_effects:
          - "set UtilityConflict.state_share_pct = PriorRightsDetermination.final_state_share_pct (cascade link 1)"
          - "because UtilityConflict.state_share_pct changed, recompute Project.estimated_state_liability_cents (cascade link 2)"
          - "because Project.estimated_state_liability_cents changed, recompute Project.clearance_posture, which becomes FUNDING_BLOCKED when the new estimate exceeds Project.reimbursement_authority_cents (cascade link 3)"
          - "increment UtilityConflict.version by 1"
      - from: RESPONSIBILITY_SET
        to: RELOCATION_PLANNED
        trigger: "POST /uro/relocation-plans/{id}/approve"
        actor: system
        preconditions: ["conflict.status == RESPONSIBILITY_SET", "the approved plan's conflict_id == conflict.id"]
        side_effects: ["increment UtilityConflict.version by 1"]
      - from: RELOCATION_PLANNED
        to: RELOCATION_SCHEDULED
        trigger: "POST /uro/commitments"
        actor: system
        preconditions: ["conflict.status == RELOCATION_PLANNED"]
        side_effects:
          - "recompute UtilityOwner.open_commitment_days (calculations.owner_open_commitment_days)"
          - "recompute JointTrenchSlot.occupant_count and JointTrenchSlot.status when joint_trench_slot_id is non-null"
          - "increment UtilityConflict.version by 1"
      - from: RELOCATION_SCHEDULED
        to: RELOCATION_PLANNED
        trigger: "POST /uro/commitments/{id}/cancel (compensating revert)"
        actor: system
        preconditions: ["conflict.status == RELOCATION_SCHEDULED", "no remaining ScheduleCommitment of this conflict has status IN {COMMITTED, IN_PROGRESS} after the cancellation"]
        side_effects:
          - "recompute UtilityOwner.open_commitment_days back to its pre-commitment value (compensating invariant, calculations.owner_open_commitment_days)"
          - "recompute JointTrenchSlot.occupant_count and JointTrenchSlot.status back to their pre-commitment values"
          - "increment UtilityConflict.version by 1"
      - from: RELOCATION_SCHEDULED
        to: CLEARED
        trigger: "POST /uro/conflicts/{id}/certify-cleared (RELOCATE branch)"
        actor: UtilityCoordinator
        preconditions:
          - "conflict.status == RELOCATION_SCHEDULED"
          - "conflict.resolution_type == RELOCATE"
          - "at least one ScheduleCommitment of this conflict has status == COMPLETE"
          - "conflict.depends_on_conflict_id is null OR the referenced UtilityConflict.status == CLEARED (else ERR_DEPENDENCY_NOT_CLEARED)"
        side_effects:
          - "lock the conflict's PriorRightsDetermination: status ISSUED -> FINAL"
          - "recompute Project.open_conflict_count and Project.clearance_posture; a resulting CLEAR posture bubbles Project.status CLEARANCE_ACTIVE -> LETTING_READY"
          - "increment UtilityConflict.version by 1"
      - from: RESOLUTION_SELECTED
        to: CLEARED
        trigger: "POST /uro/conflicts/{id}/certify-cleared (non-relocation branch)"
        actor: UtilityCoordinator
        preconditions:
          - "conflict.status == RESOLUTION_SELECTED"
          - "conflict.resolution_type IN {PROTECT_IN_PLACE, ABANDON, NO_CONFLICT}"
          - "conflict.depends_on_conflict_id is null OR the referenced UtilityConflict.status == CLEARED (else ERR_DEPENDENCY_NOT_CLEARED)"
        side_effects:
          - "recompute Project.open_conflict_count and Project.clearance_posture; a resulting CLEAR posture bubbles Project.status CLEARANCE_ACTIVE -> LETTING_READY"
          - "increment UtilityConflict.version by 1"
        note: "Divergent branch of the fork: no determination, plan, commitment or agreement is required or touched, and no determination is locked to FINAL."

  - entity: PriorRightsDetermination
    state_field: status
    initial_state: DRAFT
    terminal_states: [FINAL]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /uro/prior-rights/{id}/submit-for-review"
        actor: RightOfWayAdjudicator
        preconditions: ["determination.status == DRAFT"]
        side_effects: ["increment PriorRightsDetermination.version by 1"]
      - from: UNDER_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /uro/prior-rights/{id}/return-for-revision"
        actor: RightOfWayAdjudicator
        preconditions: ["determination.status == UNDER_REVIEW"]
        side_effects: ["increment PriorRightsDetermination.version by 1"]
      - from: RETURNED_FOR_REVISION
        to: DRAFT
        trigger: "POST /uro/prior-rights/{id}/revise"
        actor: RightOfWayAdjudicator
        preconditions: ["determination.status IN {RETURNED_FOR_REVISION, APPEALED}"]
        side_effects:
          - "overwrite PriorRightsDetermination.claimed_basis and narrative from the request body"
          - "recompute PriorRightsDetermination.provisional_state_share_pct under the RECORD_BASIS variant"
          - "increment PriorRightsDetermination.version by 1"
        note: "Closes the review cycle DRAFT -> UNDER_REVIEW -> RETURNED_FOR_REVISION -> DRAFT."
      - from: APPEALED
        to: DRAFT
        trigger: "POST /uro/prior-rights/{id}/revise"
        actor: RightOfWayAdjudicator
        preconditions: ["determination.status IN {RETURNED_FOR_REVISION, APPEALED}"]
        side_effects:
          - "overwrite PriorRightsDetermination.claimed_basis and narrative from the request body"
          - "recompute PriorRightsDetermination.provisional_state_share_pct under the RECORD_BASIS variant"
          - "increment PriorRightsDetermination.version by 1"
        note: "Closes the appeal cycle ISSUED -> APPEALED -> DRAFT -> UNDER_REVIEW -> ISSUED."
      - from: UNDER_REVIEW
        to: ISSUED
        trigger: "POST /uro/prior-rights/{id}/issue"
        actor: RightOfWayAdjudicator
        preconditions:
          - "determination.status == UNDER_REVIEW"
          - "conflict.status == RESOLUTION_SELECTED"
          - "when determination.appeal_round >= 1, X-User-ID != determination.first_issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "select PriorRightsDetermination.evidence_variant and compute final_state_share_pct (calculations.prior_rights_state_share)"
          - "set PriorRightsDetermination.first_issued_by_user_id = X-User-ID when it is null"
          - "cascade link 1: UtilityConflict RESOLUTION_SELECTED -> RESPONSIBILITY_SET carrying state_share_pct"
          - "cascade link 2: recompute Project.estimated_state_liability_cents"
          - "cascade link 3: recompute Project.clearance_posture (may become FUNDING_BLOCKED)"
          - "increment PriorRightsDetermination.version by 1"
      - from: ISSUED
        to: APPEALED
        trigger: "POST /uro/prior-rights/{id}/appeal"
        actor: UtilityOwnerRep
        preconditions:
          - "determination.status == ISSUED"
          - "determination.appeal_round < 1 (the maximum appeal rounds) (else ERR_APPEAL_LIMIT_EXCEEDED)"
          - "X-User-ID == the owner derived from conflict.facility_id -> UtilityFacility.owner_id (else ERR_OWNER_SCOPE_VIOLATION)"
        side_effects: ["increment PriorRightsDetermination.appeal_round by 1", "increment PriorRightsDetermination.version by 1"]
      - from: ISSUED
        to: FINAL
        trigger: "POST /uro/conflicts/{id}/certify-cleared (RELOCATE branch, system lock)"
        actor: system
        preconditions: ["determination.status == ISSUED", "determination.conflict_id == the certified conflict.id"]
        side_effects: ["increment PriorRightsDetermination.version by 1"]

  - entity: RelocationPlan
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /uro/relocation-plans/{id}/start-review"
        actor: UtilityCoordinator
        preconditions: ["plan.status == SUBMITTED"]
        side_effects: ["increment RelocationPlan.version by 1"]
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /uro/relocation-plans/{id}/request-revision"
        actor: UtilityCoordinator
        preconditions: ["plan.status == UNDER_REVIEW"]
        side_effects: ["increment RelocationPlan.version by 1"]
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /uro/relocation-plans/{id}/resubmit"
        actor: UtilityOwnerRep
        preconditions:
          - "plan.status == REVISION_REQUESTED"
          - "plan.revision_round < 3 (the plan revision limit) (else ERR_REVISION_LIMIT_EXCEEDED)"
          - "X-User-ID == the owner derived from plan.conflict_id -> UtilityConflict.facility_id -> UtilityFacility.owner_id"
        side_effects:
          - "increment RelocationPlan.revision_round by 1"
          - "overwrite estimated_cost_cents, replacement_in_kind_cost_cents, proposed_capacity_ratio, work_days from the request body"
          - "recompute RelocationPlan.betterment_ratio and betterment_amount_cents (calculations.betterment_credit steps 1-4)"
          - "recompute Project.estimated_state_liability_cents and Project.clearance_posture from the revised governing plan"
          - "increment RelocationPlan.version by 1"
        note: "Closes the plan review cycle SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /uro/relocation-plans/{id}/approve"
        actor: UtilityCoordinator
        preconditions:
          - "plan.status == UNDER_REVIEW"
          - "the PriorRightsDetermination with conflict_id == plan.conflict_id has status IN {ISSUED, FINAL} (else ERR_PRIOR_RIGHTS_NOT_ISSUED)"
        side_effects:
          - "cascade: UtilityConflict RESPONSIBILITY_SET -> RELOCATION_PLANNED"
          - "increment RelocationPlan.version by 1"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /uro/relocation-plans (system: a newer plan is created for the same conflict)"
        actor: system
        preconditions: ["plan.status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED}", "no ReimbursementAgreement with plan_id == plan.id has execution_status == EXECUTED (else ERR_EXECUTED_AGREEMENT_BLOCKS_SUPERSEDE)"]
        side_effects:
          - "every ReimbursementAgreement with plan_id == plan.id and execution_status IN {DRAFT, PENDING_OWNER_SIGNATURE} moves to execution_status VOIDED and settlement_status VOIDED_OUT"
          - "increment RelocationPlan.version by 1"
      - from: UNDER_REVIEW
        to: SUPERSEDED
        trigger: "POST /uro/relocation-plans (system: a newer plan is created for the same conflict)"
        actor: system
        preconditions: ["plan.status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED}", "no ReimbursementAgreement with plan_id == plan.id has execution_status == EXECUTED"]
        side_effects:
          - "every ReimbursementAgreement with plan_id == plan.id and execution_status IN {DRAFT, PENDING_OWNER_SIGNATURE} moves to execution_status VOIDED and settlement_status VOIDED_OUT"
          - "increment RelocationPlan.version by 1"
      - from: REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "POST /uro/relocation-plans (system: a newer plan is created for the same conflict)"
        actor: system
        preconditions: ["plan.status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED}", "no ReimbursementAgreement with plan_id == plan.id has execution_status == EXECUTED"]
        side_effects:
          - "every ReimbursementAgreement with plan_id == plan.id and execution_status IN {DRAFT, PENDING_OWNER_SIGNATURE} moves to execution_status VOIDED and settlement_status VOIDED_OUT"
          - "increment RelocationPlan.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /uro/relocation-plans (system: a newer plan is created for the same conflict)"
        actor: system
        preconditions: ["plan.status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED}", "no ReimbursementAgreement with plan_id == plan.id has execution_status == EXECUTED"]
        side_effects:
          - "every ReimbursementAgreement with plan_id == plan.id and execution_status IN {DRAFT, PENDING_OWNER_SIGNATURE} moves to execution_status VOIDED and settlement_status VOIDED_OUT"
          - "increment RelocationPlan.version by 1"

  - entity: PermitRecord
    state_field: status
    initial_state: APPLIED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: APPLIED
        to: GRANTED
        trigger: "POST /uro/permits/{id}/decide with decision == GRANT"
        actor: UtilityCoordinator
        preconditions: ["permit.status == APPLIED"]
        side_effects: ["set PermitRecord.granted_on = logical clock", "set PermitRecord.expires_on and decision_note from the request body", "increment PermitRecord.version by 1"]
      - from: APPLIED
        to: DENIED
        trigger: "POST /uro/permits/{id}/decide with decision == DENY"
        actor: UtilityCoordinator
        preconditions: ["permit.status == APPLIED"]
        side_effects: ["set PermitRecord.decision_note from the request body", "increment PermitRecord.version by 1"]

  - entity: ScheduleCommitment
    state_field: status
    initial_state: COMMITTED
    terminal_states: [COMPLETE, BREACHED, CANCELLED]
    transitions:
      - from: COMMITTED
        to: IN_PROGRESS
        trigger: "POST /uro/commitments/{id}/start-work"
        actor: UtilityOwnerRep
        preconditions: ["commitment.status == COMMITTED", "X-User-ID == commitment.owner_id (else ERR_OWNER_SCOPE_VIOLATION)"]
        side_effects:
          - "Project.status CLEARANCE_ACTIVE or LETTING_READY -> UNDER_CONSTRUCTION when this is the project's first commitment to enter IN_PROGRESS"
          - "increment ScheduleCommitment.version by 1"
      - from: COMMITTED
        to: COMPLETE
        trigger: "POST /uro/commitments/{id}/report-complete with logical clock <= commitment.window_end"
        actor: UtilityOwnerRep
        preconditions: ["commitment.status IN {COMMITTED, IN_PROGRESS}", "X-User-ID == commitment.owner_id"]
        side_effects:
          - "set ScheduleCommitment.actual_complete_at = logical clock and late_days = 0"
          - "recompute UtilityOwner.open_commitment_days (the commitment leaves the {COMMITTED, IN_PROGRESS} set)"
          - "recompute JointTrenchSlot.occupant_count and JointTrenchSlot.status when joint_trench_slot_id is non-null"
          - "increment ScheduleCommitment.version by 1"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /uro/commitments/{id}/report-complete with logical clock <= commitment.window_end"
        actor: UtilityOwnerRep
        preconditions: ["commitment.status IN {COMMITTED, IN_PROGRESS}", "X-User-ID == commitment.owner_id"]
        side_effects:
          - "set ScheduleCommitment.actual_complete_at = logical clock and late_days = 0"
          - "recompute UtilityOwner.open_commitment_days (the commitment leaves the {COMMITTED, IN_PROGRESS} set)"
          - "recompute JointTrenchSlot.occupant_count and JointTrenchSlot.status when joint_trench_slot_id is non-null"
          - "increment ScheduleCommitment.version by 1"
      - from: COMMITTED
        to: BREACHED
        trigger: "POST /uro/commitments/{id}/report-complete with logical clock > commitment.window_end"
        actor: UtilityOwnerRep
        preconditions: ["commitment.status IN {COMMITTED, IN_PROGRESS}", "X-User-ID == commitment.owner_id"]
        side_effects:
          - "set ScheduleCommitment.actual_complete_at = logical clock and late_days = ceil((actual_complete_at - window_end) / 1 day)"
          - "cascade link 1: because a commitment became BREACHED, increment UtilityOwner.delinquency_strikes by 1 and recompute UtilityOwner.open_commitment_days"
          - "cascade link 2: because delinquency_strikes reached 2 (the delinquency hold threshold), flip UtilityOwner.reimbursement_hold false -> true"
          - "cascade link 3: because the owner went on reimbursement hold, every ReimbursementAgreement with owner_id == owner.id and settlement_status == PENDING_FINAL_INVOICE moves to settlement_status HELD"
          - "cascade link 4: because an agreement moved to settlement_status HELD, every CostDocument of that agreement with review_status == SUBMITTED moves to review_status HELD"
          - "recompute JointTrenchSlot.occupant_count and JointTrenchSlot.status when joint_trench_slot_id is non-null"
          - "increment ScheduleCommitment.version by 1"
      - from: IN_PROGRESS
        to: BREACHED
        trigger: "POST /uro/commitments/{id}/report-complete with logical clock > commitment.window_end"
        actor: UtilityOwnerRep
        preconditions: ["commitment.status IN {COMMITTED, IN_PROGRESS}", "X-User-ID == commitment.owner_id"]
        side_effects:
          - "set ScheduleCommitment.actual_complete_at = logical clock and late_days = ceil((actual_complete_at - window_end) / 1 day)"
          - "cascade link 1: increment UtilityOwner.delinquency_strikes by 1 and recompute UtilityOwner.open_commitment_days"
          - "cascade link 2: because delinquency_strikes reached 2 (the delinquency hold threshold), flip UtilityOwner.reimbursement_hold false -> true"
          - "cascade link 3: every ReimbursementAgreement with owner_id == owner.id and settlement_status == PENDING_FINAL_INVOICE moves to settlement_status HELD"
          - "cascade link 4: every CostDocument of a HELD agreement with review_status == SUBMITTED moves to review_status HELD"
          - "recompute JointTrenchSlot.occupant_count and JointTrenchSlot.status when joint_trench_slot_id is non-null"
          - "increment ScheduleCommitment.version by 1"
      - from: COMMITTED
        to: CANCELLED
        trigger: "POST /uro/commitments/{id}/cancel"
        actor: UtilityOwnerRep
        preconditions: ["commitment.status IN {COMMITTED, IN_PROGRESS}", "X-User-ID == commitment.owner_id when the actor is UtilityOwnerRep"]
        side_effects:
          - "compensating link 1: recompute UtilityOwner.open_commitment_days, returning it to its pre-creation value"
          - "compensating link 2: recompute JointTrenchSlot.occupant_count and JointTrenchSlot.status, returning them to their pre-creation values"
          - "compensating link 3: UtilityConflict RELOCATION_SCHEDULED -> RELOCATION_PLANNED when no commitment of the conflict remains in {COMMITTED, IN_PROGRESS}"
          - "increment ScheduleCommitment.version by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /uro/commitments/{id}/cancel"
        actor: UtilityCoordinator
        preconditions: ["commitment.status IN {COMMITTED, IN_PROGRESS}"]
        side_effects:
          - "compensating link 1: recompute UtilityOwner.open_commitment_days"
          - "compensating link 2: recompute JointTrenchSlot.occupant_count and JointTrenchSlot.status"
          - "compensating link 3: UtilityConflict RELOCATION_SCHEDULED -> RELOCATION_PLANNED when no commitment of the conflict remains in {COMMITTED, IN_PROGRESS}"
          - "increment ScheduleCommitment.version by 1"

  - entity: ReimbursementAgreement
    state_field: execution_status
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: PENDING_OWNER_SIGNATURE
        trigger: "POST /uro/agreements/{id}/circulate"
        actor: AgreementOfficer
        preconditions: ["agreement.execution_status == DRAFT"]
        side_effects: ["increment ReimbursementAgreement.version by 1"]
      - from: PENDING_OWNER_SIGNATURE
        to: EXECUTED
        trigger: "POST /uro/agreements/{id}/execute"
        actor: AgreementOfficer
        preconditions:
          - "agreement.execution_status == PENDING_OWNER_SIGNATURE (else ERR_AGREEMENT_NOT_EXECUTABLE)"
          - "Project.clearance_posture != FUNDING_BLOCKED (else ERR_CLEARANCE_POSTURE_BLOCKED)"
          - "UtilityOwner.reimbursement_hold == false (else ERR_OWNER_ON_REIMBURSEMENT_HOLD)"
          - "Project.total_committed_reimbursement_cents + agreement.state_share_cents <= Project.reimbursement_authority_cents (else ERR_AUTHORITY_EXCEEDED)"
        side_effects:
          - "set ReimbursementAgreement.executed_by_user_id = X-User-ID"
          - "recompute Project.total_committed_reimbursement_cents (calculations.project_committed_reimbursement_ledger)"
          - "recompute Project.clearance_posture from the new ledger value"
          - "increment ReimbursementAgreement.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /uro/agreements/{id}/void"
        actor: AgreementOfficer
        preconditions: ["agreement.execution_status IN {DRAFT, PENDING_OWNER_SIGNATURE, EXECUTED}", "agreement.settlement_status != SETTLED (else ERR_SETTLEMENT_STATE_INVALID)"]
        side_effects: ["set settlement_status -> VOIDED_OUT", "increment ReimbursementAgreement.version by 1"]
      - from: PENDING_OWNER_SIGNATURE
        to: VOIDED
        trigger: "POST /uro/agreements/{id}/void"
        actor: AgreementOfficer
        preconditions: ["agreement.execution_status IN {DRAFT, PENDING_OWNER_SIGNATURE, EXECUTED}", "agreement.settlement_status != SETTLED"]
        side_effects: ["set settlement_status -> VOIDED_OUT", "increment ReimbursementAgreement.version by 1"]
      - from: EXECUTED
        to: VOIDED
        trigger: "POST /uro/agreements/{id}/void (compensating action for execute)"
        actor: AgreementOfficer
        preconditions: ["agreement.execution_status IN {DRAFT, PENDING_OWNER_SIGNATURE, EXECUTED}", "agreement.settlement_status != SETTLED"]
        side_effects:
          - "set settlement_status -> VOIDED_OUT"
          - "compensating link 1: recompute Project.total_committed_reimbursement_cents, which drops by exactly this agreement's state_share_cents and returns to its pre-execution value"
          - "compensating link 2: recompute Project.clearance_posture from the restored ledger value"
          - "increment ReimbursementAgreement.version by 1"

  - entity: ReimbursementAgreement
    state_field: settlement_status
    initial_state: NOT_STARTED
    terminal_states: [SETTLED, VOIDED_OUT]
    transitions:
      - from: NOT_STARTED
        to: PENDING_FINAL_INVOICE
        trigger: "POST /uro/agreements/{id}/open-final-billing"
        actor: AgreementOfficer
        preconditions: ["agreement.settlement_status == NOT_STARTED (else ERR_SETTLEMENT_STATE_INVALID)", "agreement.execution_status == EXECUTED (else ERR_AGREEMENT_NOT_EXECUTABLE)"]
        side_effects: ["increment ReimbursementAgreement.version by 1"]
        note: "Cross-dimension guard: the settlement dimension may only leave NOT_STARTED once the execution dimension has reached EXECUTED."
      - from: PENDING_FINAL_INVOICE
        to: AUDIT_IN_PROGRESS
        trigger: "POST /uro/audit-findings (system: an OPEN finding is raised against this agreement)"
        actor: system
        preconditions: ["agreement.settlement_status == PENDING_FINAL_INVOICE"]
        side_effects: ["increment ReimbursementAgreement.version by 1"]
      - from: AUDIT_IN_PROGRESS
        to: PENDING_FINAL_INVOICE
        trigger: "POST /uro/audit-findings/{id}/resolve (system: the last OPEN finding on this agreement is resolved)"
        actor: system
        preconditions: ["agreement.settlement_status == AUDIT_IN_PROGRESS", "no AuditFinding with agreement_id == agreement.id remains in status OPEN"]
        side_effects: ["increment ReimbursementAgreement.version by 1"]
      - from: PENDING_FINAL_INVOICE
        to: HELD
        trigger: "POST /uro/commitments/{id}/report-complete (cascade link 3 from an owner reimbursement hold)"
        actor: system
        preconditions: ["agreement.settlement_status == PENDING_FINAL_INVOICE", "UtilityOwner.reimbursement_hold flipped to true in cascade link 2"]
        side_effects:
          - "cascade link 4: every CostDocument of this agreement with review_status == SUBMITTED moves to review_status HELD"
          - "increment ReimbursementAgreement.version by 1"
      - from: HELD
        to: PENDING_FINAL_INVOICE
        trigger: "POST /uro/utility-owners/{id}/release-hold (system)"
        actor: system
        preconditions: ["agreement.settlement_status == HELD", "UtilityOwner.reimbursement_hold flipped to false"]
        side_effects:
          - "every CostDocument of this agreement with review_status == HELD returns to review_status SUBMITTED"
          - "increment ReimbursementAgreement.version by 1"
      - from: PENDING_FINAL_INVOICE
        to: SETTLED
        trigger: "POST /uro/agreements/{id}/final-settlement"
        actor: AgreementOfficer
        preconditions:
          - "agreement.settlement_status == PENDING_FINAL_INVOICE (else ERR_SETTLEMENT_STATE_INVALID)"
          - "no AuditFinding with agreement_id == agreement.id has status == OPEN (else ERR_OPEN_AUDIT_FINDING)"
          - "at least one CostDocument with agreement_id == agreement.id has review_status == ACCEPTED (else ERR_NO_ELIGIBLE_COST_DOCUMENTATION)"
        side_effects:
          - "stamp ReimbursementAgreement.as_built_reference from the request body"
          - "switch cost_basis ESTIMATE_BASIS -> ACTUAL_BASIS and recompute eligible_cost_cents, indirect_cost_cents, betterment_credit_cents, net_allowable_cents, participation_tier_pct, state_share_cents, owner_share_cents"
          - "every ACCEPTED CostDocument excluded by the chronological not-to-exceed cutoff moves to review_status DISALLOWED with exclusion_reason EXCEEDS_NOT_TO_EXCEED_CAP and disallowed_amount_cents = amount_cents"
          - "recompute Project.total_committed_reimbursement_cents from the settled state share"
          - "recompute Project.clearance_posture from the new ledger value"
          - "increment ReimbursementAgreement.version by 1"
      - from: NOT_STARTED
        to: VOIDED_OUT
        trigger: "POST /uro/agreements/{id}/void (system)"
        actor: system
        preconditions: ["agreement.settlement_status IN {NOT_STARTED, PENDING_FINAL_INVOICE, HELD, AUDIT_IN_PROGRESS}"]
        side_effects: ["increment ReimbursementAgreement.version by 1"]
      - from: PENDING_FINAL_INVOICE
        to: VOIDED_OUT
        trigger: "POST /uro/agreements/{id}/void (system)"
        actor: system
        preconditions: ["agreement.settlement_status IN {NOT_STARTED, PENDING_FINAL_INVOICE, HELD, AUDIT_IN_PROGRESS}"]
        side_effects: ["increment ReimbursementAgreement.version by 1"]
      - from: HELD
        to: VOIDED_OUT
        trigger: "POST /uro/agreements/{id}/void (system)"
        actor: system
        preconditions: ["agreement.settlement_status IN {NOT_STARTED, PENDING_FINAL_INVOICE, HELD, AUDIT_IN_PROGRESS}"]
        side_effects: ["increment ReimbursementAgreement.version by 1"]
      - from: AUDIT_IN_PROGRESS
        to: VOIDED_OUT
        trigger: "POST /uro/agreements/{id}/void (system)"
        actor: system
        preconditions: ["agreement.settlement_status IN {NOT_STARTED, PENDING_FINAL_INVOICE, HELD, AUDIT_IN_PROGRESS}"]
        side_effects: ["increment ReimbursementAgreement.version by 1"]

  - entity: CostDocument
    state_field: review_status
    initial_state: SUBMITTED
    terminal_states: [DISALLOWED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /uro/cost-documents/{id}/review with disposition == ACCEPT"
        actor: AgreementOfficer
        preconditions: ["document.review_status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)", "agreement.settlement_status == PENDING_FINAL_INVOICE"]
        side_effects: ["set disallowed_amount_cents = 0 and exclusion_reason = null", "increment CostDocument.version by 1"]
      - from: SUBMITTED
        to: DISALLOWED
        trigger: "POST /uro/cost-documents/{id}/review with disposition == DISALLOW"
        actor: AgreementOfficer
        preconditions: ["document.review_status == SUBMITTED", "agreement.settlement_status == PENDING_FINAL_INVOICE"]
        side_effects: ["set disallowed_amount_cents = amount_cents and exclusion_reason from the request body (NOT_SUPPORTED or SUSTAINED_AUDIT_FINDING)", "increment CostDocument.version by 1"]
      - from: SUBMITTED
        to: HELD
        trigger: "POST /uro/commitments/{id}/report-complete (cascade link 4 from an owner reimbursement hold)"
        actor: system
        preconditions: ["document.review_status == SUBMITTED", "the parent agreement moved to settlement_status HELD in cascade link 3"]
        side_effects: ["increment CostDocument.version by 1"]
      - from: HELD
        to: SUBMITTED
        trigger: "POST /uro/utility-owners/{id}/release-hold (system)"
        actor: system
        preconditions: ["document.review_status == HELD", "the parent agreement returned to settlement_status PENDING_FINAL_INVOICE"]
        side_effects: ["increment CostDocument.version by 1"]
      - from: ACCEPTED
        to: DISALLOWED
        trigger: "POST /uro/agreements/{id}/final-settlement (system: chronological not-to-exceed cutoff)"
        actor: system
        preconditions: ["document.review_status == ACCEPTED", "including this document in the chronological accrual would push the running eligible direct cost above agreement.not_to_exceed_cents"]
        side_effects: ["set disallowed_amount_cents = amount_cents and exclusion_reason = EXCEEDS_NOT_TO_EXCEED_CAP", "increment CostDocument.version by 1"]

  - entity: AuditFinding
    state_field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /uro/audit-findings/{id}/resolve"
        actor: ExternalAuditor
        preconditions: ["finding.status == OPEN (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "set AuditFinding.disposition from the request body (SUSTAINED or WITHDRAWN)"
          - "when no AuditFinding of the agreement remains OPEN, agreement settlement_status AUDIT_IN_PROGRESS -> PENDING_FINAL_INVOICE"
          - "increment AuditFinding.version by 1"

  - entity: DelayClaim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_ANALYSIS
        trigger: "POST /uro/delay-claims/{id}/analyze"
        actor: ConstructionEngineer
        preconditions: ["claim.status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)", "ScheduleCommitment.status IN {COMPLETE, BREACHED} (else ERR_COMMITMENT_STATE_INVALID)"]
        side_effects: ["set DelayClaim.delay_cause from the request body", "recompute compensable_days and daily_rate_cents (calculations.delay_claim_allocation steps 1-3)", "increment DelayClaim.version by 1"]
      - from: UNDER_ANALYSIS
        to: ALLOCATED
        trigger: "POST /uro/delay-claims/{id}/allocate"
        actor: ConstructionEngineer
        preconditions: ["claim.status == UNDER_ANALYSIS", "claim.compensable_days > 0 (else ERR_DELAY_NOT_COMPENSABLE)"]
        side_effects:
          - "compute allocated_to_owner_cents and allocated_to_state_cents (calculations.delay_claim_allocation steps 4-6)"
          - "recompute UtilityOwner.assessed_delay_liability_cents"
          - "recompute Project.aggregate_compensable_delay_days"
          - "increment DelayClaim.version by 1"
      - from: ALLOCATED
        to: UNDER_ANALYSIS
        trigger: "POST /uro/delay-claims/{id}/withdraw-allocation (compensating action for allocate)"
        actor: ConstructionEngineer
        preconditions: ["claim.status == ALLOCATED"]
        side_effects:
          - "reset allocated_to_owner_cents = 0 and allocated_to_state_cents = 0"
          - "recompute UtilityOwner.assessed_delay_liability_cents, returning it to its pre-allocation value"
          - "recompute Project.aggregate_compensable_delay_days, returning it to its pre-allocation value"
          - "increment DelayClaim.version by 1"
        note: "Closes the allocation cycle UNDER_ANALYSIS -> ALLOCATED -> UNDER_ANALYSIS."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /uro/delay-claims/{id}/deny"
        actor: ConstructionEngineer
        preconditions: ["claim.status IN {SUBMITTED, UNDER_ANALYSIS}"]
        side_effects: ["increment DelayClaim.version by 1"]
      - from: UNDER_ANALYSIS
        to: DENIED
        trigger: "POST /uro/delay-claims/{id}/deny"
        actor: ConstructionEngineer
        preconditions: ["claim.status IN {SUBMITTED, UNDER_ANALYSIS}"]
        side_effects: ["increment DelayClaim.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-conflict
    parent_entity: UtilityConflict
    write_endpoint: "POST /uro/relocation-plans"
    occ_field: "expected_conflict_version"
    description: |
      Submitting a RelocationPlan against a UtilityConflict whose version has advanced since
      the client last observed it is rejected. A newly created plan legitimately supersedes
      every earlier plan for the same conflict, so a submittal carrying a stale view of the
      conflict would silently retire a plan revision the submitter never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agreement-create-stale-plan
    parent_entity: RelocationPlan
    write_endpoint: "POST /uro/agreements"
    occ_field: "expected_plan_version"
    description: |
      Drafting a ReimbursementAgreement against a RelocationPlan whose version has advanced
      since the client last observed it is rejected. A new agreement legitimately voids any
      earlier DRAFT or PENDING_OWNER_SIGNATURE agreement on the same plan, so a stale view of
      the plan would retire cost terms the drafter never reviewed.
    error_id: ERR_STALE_VERSION
    http_status: 412


# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:
  - name: prior_rights_state_share
    description: |
      Determines the percentage of relocation cost the State bears for one utility conflict, from
      the facility's occupancy basis, its installation year relative to the right-of-way
      acquisition year, and the owner's public-agency status. Two variants exist because the
      evidentiary basis differs: a record-basis determination trusts the recorded interest and
      earns the prior-occupancy credit, while a field-basis determination (forced when a QL_A
      subsurface investigation contradicts the record) forfeits that credit and takes a
      documentation penalty instead.
    trigger: "POST /uro/prior-rights (writes evidence_variant and provisional_state_share_pct) and POST /uro/prior-rights/{id}/issue (re-evaluates and freezes final_state_share_pct)"
    inputs:
      - "UtilityFacility.occupancy_basis"
      - "UtilityFacility.installed_year"
      - "UtilityFacility.depth_in"
      - "PriorRightsDetermination.claimed_basis"
      - "Project.row_acquisition_year"
      - "UtilityOwner.is_public_agency"
      - "SubsurfaceInvestigation.measured_depth_in and quality_level for investigations of the facility"
    algorithm: threshold
    formula: |
      Step 0 - per-investigation contradiction flag (written at POST /uro/investigations):
        investigation.contradicts_record =
            abs(investigation.measured_depth_in - facility.depth_in) > DEPTH_TOLERANCE_IN
        The comparison is strictly greater-than: a difference of exactly DEPTH_TOLERANCE_IN
        inches does NOT contradict the record.

      Step 1 - evidence_variant selection (this chooses the variant):
        Let QLA = SubsurfaceInvestigation rows where facility_id == facility.id and
                  quality_level == "QL_A", ordered by (performed_at ASC).
        if any q in QLA has q.contradicts_record == true:
            evidence_variant = "FIELD_BASIS"
        else:
            evidence_variant = "RECORD_BASIS"
        Investigations at QL_B, QL_C or QL_D never force FIELD_BASIS, however large their
        depth disagreement.

      Step 2 - base entitlement from the recorded occupancy basis:
        BASE_BY_OCCUPANCY:
          FEE_SIMPLE       -> 100
          PRIVATE_EASEMENT -> 100
          FRANCHISE        -> 50 when owner.is_public_agency == false, else 0
          PERMIT           -> 0
          UNDOCUMENTED     -> 0
        base = BASE_BY_OCCUPANCY[facility.occupancy_basis]

      Step 3 - adjustments, accumulated in this order:
        adj = 0
        if evidence_variant == "RECORD_BASIS" and facility.installed_year < project.row_acquisition_year:
            adj = adj + PRIOR_OCCUPANCY_CREDIT_PCT          # recorded priority; FIELD_BASIS forfeits it
        if facility.installed_year >= project.row_acquisition_year:
            adj = adj - SUBSEQUENT_OCCUPANCY_PENALTY_PCT    # occupied after the State took the corridor
        if owner.is_public_agency == true:
            adj = adj + PUBLIC_AGENCY_CREDIT_PCT            # applies under either variant
        if determination.claimed_basis != facility.occupancy_basis:
            adj = adj - UNSUPPORTED_CLAIM_PENALTY_PCT       # the claim does not match the record
        if evidence_variant == "FIELD_BASIS":
            adj = adj - FIELD_CONTRADICTION_PENALTY_PCT     # the record could not be relied upon

      Step 4 - clamp to the legal range:
        state_share_pct = min(100, max(0, base + adj))
    constants:
      DEPTH_TOLERANCE_IN: 6
      PRIOR_OCCUPANCY_CREDIT_PCT: 10
      SUBSEQUENT_OCCUPANCY_PENALTY_PCT: 20
      PUBLIC_AGENCY_CREDIT_PCT: 25
      UNSUPPORTED_CLAIM_PENALTY_PCT: 15
      FIELD_CONTRADICTION_PENALTY_PCT: 45
    precision: "integer percent in 0..100; clamped, never rounded"
    variants:
      - name: RECORD_BASIS
        when: "No QL_A SubsurfaceInvestigation of the facility has contradicts_record == true"
        difference: "Grants PRIOR_OCCUPANCY_CREDIT_PCT (+10) when installed_year < row_acquisition_year, and applies no field-contradiction penalty."
      - name: FIELD_BASIS
        when: "At least one QL_A SubsurfaceInvestigation of the facility has contradicts_record == true"
        difference: "Forfeits the +10 prior-occupancy credit even when installed_year < row_acquisition_year, and additionally subtracts FIELD_CONTRADICTION_PENALTY_PCT (-45). For a pre-ROW PRIVATE_EASEMENT facility of a private owner this is 100 under RECORD_BASIS versus 55 under FIELD_BASIS."

  - name: betterment_credit
    description: |
      The owner-funded betterment portion of a relocation. Replacement in kind is fully
      participating; scope beyond replacement in kind, and capacity added above the existing
      facility, are betterment the owner pays for. The two components nest rather than add:
      the capacity component applies only to the portion of the cost that is in-kind comparable.
    trigger: "POST /uro/relocation-plans and POST /uro/relocation-plans/{id}/resubmit (writes RelocationPlan.betterment_ratio and betterment_amount_cents); re-derived per cost line at POST /uro/agreements/{id}/final-settlement"
    inputs:
      - "RelocationPlan.estimated_cost_cents"
      - "RelocationPlan.replacement_in_kind_cost_cents"
      - "RelocationPlan.proposed_capacity_ratio"
      - "the amount_cents and doc_type of each CostDocument included by agreement_eligible_cost (settlement re-derivation only)"
    algorithm: aggregation
    formula: |
      Step 1 - scope component (cost beyond replacement in kind):
        scope_component = (plan.estimated_cost_cents - plan.replacement_in_kind_cost_cents)
                          / plan.estimated_cost_cents

      Step 2 - capacity component:
        if plan.proposed_capacity_ratio <= BETTERMENT_RATIO_THRESHOLD:
            capacity_component = 0
        else:
            capacity_component = (plan.proposed_capacity_ratio - BETTERMENT_RATIO_THRESHOLD)
                                 / plan.proposed_capacity_ratio

      Step 3 - nested combination, rounded ONCE at the end:
        betterment_ratio = min(1.0, round_half_up(
            scope_component + (1 - scope_component) * capacity_component, RATIO_DECIMALS))
        The capacity component is applied to the in-kind-comparable remainder
        (1 - scope_component), not to the whole cost; adding the two components directly
        double-counts the upgraded portion of the non-participating scope.

      Step 4 - plan-level betterment amount:
        betterment_amount_cents = round_half_up(plan.estimated_cost_cents * betterment_ratio, 0)

      Step 5 - settlement re-derivation, per line and NOT sum-then-multiply:
        For each CostDocument d included by agreement_eligible_cost (ACTUAL_BASIS), taken in the
        same chronological order, with sign(d) = -1 when d.doc_type == "CREDIT_SALVAGE" and +1
        otherwise:
            part(d) = round_half_up(d.amount_cents * plan.betterment_ratio, 0)
        betterment_credit_cents = SUM over included d of sign(d) * part(d)
        Each line is rounded before summing. Rounding the aggregate instead can differ by up to
        one cent per line; e.g. lines 12,345,678 / 9,876,543 / -1,000,000 at ratio 0.360000 give
        4,444,444 + 3,555,555 - 360,000 = 7,639,999 per line versus 7,640,000 in aggregate.
    constants:
      BETTERMENT_RATIO_THRESHOLD: 1.0
      RATIO_DECIMALS: 6
    precision: "betterment_ratio: 6 decimal places, round_half_up. Cent amounts: integer cents, round_half_up, applied per line before summing."
    variants: []

  - name: agreement_eligible_cost
    description: |
      The direct eligible cost of a reimbursement agreement. Until final settlement the figure is
      the governing plan's estimate; at final settlement it is rebuilt from accepted cost
      documentation in chronological order and truncated at the not-to-exceed ceiling by excluding
      whole documents rather than partial amounts.
    trigger: "POST /uro/agreements (ESTIMATE_BASIS), POST /uro/cost-documents/{id}/review, and POST /uro/agreements/{id}/final-settlement (ACTUAL_BASIS)"
    inputs:
      - "ReimbursementAgreement.cost_basis"
      - "RelocationPlan.estimated_cost_cents"
      - "ReimbursementAgreement.not_to_exceed_cents"
      - "CostDocument rows of the agreement: amount_cents, doc_type, review_status, incurred_on, created_at"
    algorithm: chronological
    formula: |
      Variant ESTIMATE_BASIS:
        eligible_cost_cents = plan.estimated_cost_cents

      Variant ACTUAL_BASIS:
        Step 1 - input set filtering:
          Let L = CostDocument rows where agreement_id == agreement.id
                  and review_status == "ACCEPTED"
                  and doc_type != "INDIRECT".
          Rows in review_status SUBMITTED, HELD or DISALLOWED never enter the accrual, and
          doc_type INDIRECT rows are excluded because indirect cost is computed from the owner's
          audited rate in agreement_state_share_settlement step 2, never billed as a line.
        Step 2 - ordering:
          Sort L by (incurred_on ASC, created_at ASC). created_at is the only tie-break; the
          record id is never used to order or to break ties.
        Step 3 - chronological accrual with whole-document exclusion:
          running = 0
          included = []
          for d in sorted L:
              signed = -d.amount_cents if d.doc_type == "CREDIT_SALVAGE" else +d.amount_cents
              candidate = running + signed
              if candidate > agreement.not_to_exceed_cents:
                  mark d excluded, exclusion_reason = "EXCEEDS_NOT_TO_EXCEED_CAP"
                  continue          # skip this document whole and keep scanning later documents
              running = candidate
              included.append(d)
          eligible_cost_cents = running
        The ceiling is tested per document inside the loop. Summing every eligible row first and
        then clamping the total to not_to_exceed_cents is a different result whenever one document
        straddles the ceiling: rows 12,345,678 / 9,876,543 / -1,000,000 (credit) / 30,000,000
        against a 45,000,000 ceiling accrue to 21,222,221 here, while sum-then-clamp yields
        45,000,000.
    constants: {}
    precision: "integer cents; all inputs are integer cents, so no rounding occurs"
    variants:
      - name: ESTIMATE_BASIS
        when: "agreement.cost_basis == ESTIMATE_BASIS, from creation until final settlement"
        difference: "Takes the governing plan's estimated_cost_cents verbatim; cost documents and the not-to-exceed ceiling do not affect the figure."
      - name: ACTUAL_BASIS
        when: "agreement.cost_basis == ACTUAL_BASIS, set by POST /uro/agreements/{id}/final-settlement"
        difference: "Rebuilds the figure from ACCEPTED non-INDIRECT documents in (incurred_on, created_at) order, subtracts CREDIT_SALVAGE lines, and drops whole documents that would cross not_to_exceed_cents."

  - name: agreement_state_share_settlement
    description: |
      The State's reimbursable share of one relocation agreement and the owner's residual. Nine
      ordered steps: direct cost, owner indirect loading, gross allowable, betterment credit, net
      allowable, participation tier selected from the net allowable, uncapped share, not-to-exceed
      cap, owner residual.
    trigger: "POST /uro/agreements, POST /uro/cost-documents/{id}/review while settlement_status == PENDING_FINAL_INVOICE, and POST /uro/agreements/{id}/final-settlement"
    inputs:
      - "calculations.agreement_eligible_cost for the agreement's current cost_basis"
      - "UtilityOwner.indirect_cost_rate_pct"
      - "calculations.betterment_credit for the agreement's current cost_basis"
      - "UtilityConflict.state_share_pct, frozen from the issued PriorRightsDetermination"
      - "ReimbursementAgreement.not_to_exceed_cents"
    algorithm: tiered_pricing
    formula: |
      Step 1 - direct eligible cost:
        Dc = agreement_eligible_cost(agreement)
      Step 2 - owner indirect loading, rounded here before it is used anywhere else:
        I = round_half_up(Dc * owner.indirect_cost_rate_pct / 100, 0)
      Step 3 - gross allowable:
        G = Dc + I
      Step 4 - betterment credit:
        B = betterment_credit(agreement)
            # plan-level (step 4) under ESTIMATE_BASIS, per-line (step 5) under ACTUAL_BASIS
      Step 5 - net allowable:
        N = max(0, G - B)
      Step 6 - participation tier, selected from N (not from G) and applied to the whole net
               allowable as a single rate, never marginally:
        if   N <= TIER_1_CEILING_CENTS: participation_tier_pct = 100
        elif N <= TIER_2_CEILING_CENTS: participation_tier_pct = 95
        else:                           participation_tier_pct = 90
      Step 7 - uncapped state share, both percentages applied to N in one expression and
               rounded exactly once:
        S_uncapped = round_half_up(N * conflict.state_share_pct / 100
                                     * participation_tier_pct / 100, 0)
      Step 8 - not-to-exceed cap:
        state_share_cents = min(S_uncapped, agreement.not_to_exceed_cents)
      Step 9 - owner residual, taken as a difference so the two shares always sum to N:
        owner_share_cents = N - state_share_cents
      Writes: eligible_cost_cents = Dc, indirect_cost_cents = I, betterment_credit_cents = B,
              net_allowable_cents = N, participation_tier_pct, state_share_cents,
              owner_share_cents.
    constants:
      TIER_1_CEILING_CENTS: 5000000
      TIER_2_CEILING_CENTS: 50000000
    precision: "integer cents, round_half_up; rounding occurs at step 2 and step 7 only"
    variants: []

  - name: delay_claim_allocation
    description: |
      Splits a contractor delay claim caused by late utility relocation between the utility owner
      and the State. Compensable days are the commitment's late days net of contractual float,
      capped by the days the contractor actually claimed; the daily rate is the lesser of the
      contractor's implied rate and the contract's daily overhead ceiling; the split follows the
      adjudicated delay cause.
    trigger: "POST /uro/delay-claims/{id}/analyze (steps 1-3) and POST /uro/delay-claims/{id}/allocate (steps 4-6)"
    inputs:
      - "ScheduleCommitment.late_days"
      - "DelayClaim.claimed_days"
      - "DelayClaim.claimed_amount_cents"
      - "DelayClaim.delay_cause"
      - "Project.contract_daily_overhead_cents"
    algorithm: threshold
    formula: |
      Step 1 - late days net of contractual float:
        net_late = max(0, commitment.late_days - CONTRACTUAL_FLOAT_DAYS)
      Step 2 - compensable days:
        compensable_days = min(net_late, claim.claimed_days)
      Step 3 - daily rate:
        implied_rate = round_half_up(claim.claimed_amount_cents / claim.claimed_days, 0)
        daily_rate_cents = min(implied_rate, project.contract_daily_overhead_cents)
      Step 4 - gross compensable amount:
        gross = compensable_days * daily_rate_cents
      Step 5 - owner portion from the adjudicated cause:
        OWNER_RESPONSIBILITY_BY_CAUSE:
          UTILITY_OWNER             -> 100
          UTILITY_OWNER_PERMIT_WAIT -> 60
          THIRD_PARTY               -> 50
          STATE_PERMIT_DELAY        -> 0
        owner_pct = OWNER_RESPONSIBILITY_BY_CAUSE[claim.delay_cause]
        allocated_to_owner_cents = round_half_up(gross * owner_pct / 100, 0)
      Step 6 - State portion as the residual, so the two always sum to gross exactly:
        allocated_to_state_cents = gross - allocated_to_owner_cents
    constants:
      CONTRACTUAL_FLOAT_DAYS: 5
    precision: "integer days and integer cents, round_half_up; the State portion is a residual and is never independently rounded"
    variants: []

  - name: project_clearance_posture
    description: |
      Derived readiness posture of a project, re-evaluated whenever its conflicts, commitments or
      money figures change. The rules are an ordered cascade and the first match wins, so a
      funding breach masks an untriaged conflict and an overdue relocation masks ordinary
      in-progress clearance work.
    trigger: "any change to UtilityConflict.status, ScheduleCommitment.status, Project.estimated_state_liability_cents or Project.total_committed_reimbursement_cents, and any advance of the logical clock read by a subsequent request"
    inputs:
      - "Project.reimbursement_authority_cents"
      - "Project.estimated_state_liability_cents"
      - "Project.total_committed_reimbursement_cents"
      - "UtilityConflict.status for every conflict of the project"
      - "ScheduleCommitment.status and window_end for every commitment of the project"
      - "the logical clock"
    algorithm: constraint_propagation
    formula: |
      Evaluate in order; the first rule that matches sets clearance_posture:
        1. if max(project.estimated_state_liability_cents,
                  project.total_committed_reimbursement_cents)
               > project.reimbursement_authority_cents            -> "FUNDING_BLOCKED"
        2. if any conflict of the project has status == "IDENTIFIED",
           or any commitment of the project has status in {"COMMITTED", "IN_PROGRESS"}
              and window_end <= logical_clock + CLEARANCE_WARNING_DAYS days
                                                                   -> "AT_RISK"
        3. if the project has no conflicts, or any conflict has status != "CLEARED"
                                                                   -> "CLEARANCE_PENDING"
        4. otherwise                                               -> "CLEAR"
      Rule 1 compares the larger of the two money figures, so an over-committed ledger blocks
      the project even when the forward estimate is small, and vice versa. Rule 2's look-ahead
      is inclusive: a commitment whose window_end is exactly CLEARANCE_WARNING_DAYS after the
      logical clock is already AT_RISK.
    constants:
      CLEARANCE_WARNING_DAYS: 60
    precision: "enum-valued; no numeric rounding"
    variants: []

  - name: project_state_liability_estimate
    description: |
      Forward-looking estimate of the State's relocation liability on a project. Sums the
      participating cost of the governing relocation plan of every conflict that is not yet
      cleared, weighted by that conflict's current state share, and counts plans that are still
      under review alongside approved ones.
    trigger: "POST /uro/relocation-plans, POST /uro/relocation-plans/{id}/resubmit, POST /uro/relocation-plans/{id}/approve, POST /uro/prior-rights/{id}/issue, POST /uro/conflicts/{id}/certify-cleared"
    inputs:
      - "UtilityConflict.status and state_share_pct for every conflict of the project"
      - "RelocationPlan.estimated_cost_cents, betterment_amount_cents, status and created_at"
    algorithm: forward_looking
    formula: |
      Step 1 - input set: conflicts C of the project where status != "CLEARED".
      Step 2 - governing plan gp(c): among RelocationPlan rows with conflict_id == c.id and
               status != "SUPERSEDED", the one with the greatest created_at (a conflict has at
               most one such plan). If none exists, c contributes 0.
      Step 3 - per-conflict contribution, rounded per conflict before summing:
               participating = max(0, gp(c).estimated_cost_cents - gp(c).betterment_amount_cents)
               contribution(c) = round_half_up(participating * c.state_share_pct / 100, 0)
      Step 4 - estimated_state_liability_cents = SUM over c in C of contribution(c)
      Plans in status SUBMITTED, UNDER_REVIEW and REVISION_REQUESTED are included: the estimate
      is forward-looking, so pending scope counts. A conflict whose determination has not been
      issued still contributes, at its current state_share_pct, which is 0 until issue.
    constants: {}
    precision: "integer cents, round_half_up per conflict before summing"
    variants: []

  - name: owner_open_commitment_days
    description: |
      Conserved workload figure for a utility owner: total calendar days of relocation work the
      owner currently owes across all projects. Rises when a commitment is created and returns
      exactly to its prior value when that commitment leaves the open set.
    trigger: "POST /uro/commitments, POST /uro/commitments/{id}/report-complete, POST /uro/commitments/{id}/cancel"
    inputs:
      - "ScheduleCommitment.status, window_start and window_end for every commitment of the owner"
    algorithm: aggregation
    formula: |
      open_commitment_days = SUM over ScheduleCommitment s where s.owner_id == owner.id
                             and s.status in {"COMMITTED", "IN_PROGRESS"}
                             of days_between(s.window_start, s.window_end)
      window_end is exclusive, so the window [2027-04-05T00:00:00Z, 2027-04-20T00:00:00Z)
      contributes 15 days. Commitments in COMPLETE, BREACHED or CANCELLED contribute nothing.
    constants: {}
    precision: "integer days"
    variants: []

  - name: project_committed_reimbursement_ledger
    description: |
      Conserved money figure for a project: the total State share committed by executed
      reimbursement agreements. Rises on execution and returns exactly to its prior value when
      that agreement is voided.
    trigger: "POST /uro/agreements/{id}/execute, POST /uro/agreements/{id}/void, POST /uro/agreements/{id}/final-settlement"
    inputs:
      - "ReimbursementAgreement.execution_status and state_share_cents for every agreement of the project"
    algorithm: aggregation
    formula: |
      total_committed_reimbursement_cents =
          SUM over ReimbursementAgreement a where a.project_id == project.id
          and a.execution_status == "EXECUTED"
          of a.state_share_cents
      Agreements in DRAFT, PENDING_OWNER_SIGNATURE or VOIDED contribute nothing. A final
      settlement that revises state_share_cents moves this sum by exactly the revision delta,
      because the agreement stays EXECUTED across the settlement.
    constants: {}
    precision: "integer cents"
    variants: []

  - name: project_aggregate_compensable_delay
    description: |
      Conserved schedule figure for a project - total compensable delay days carried by allocated
      claims - together with its money mirror on the owner. Withdrawing an allocation restores
      both exactly.
    trigger: "POST /uro/delay-claims/{id}/allocate, POST /uro/delay-claims/{id}/withdraw-allocation, POST /uro/delay-claims/{id}/deny"
    inputs:
      - "DelayClaim.status, compensable_days, allocated_to_owner_cents"
      - "the owner_id of each claim's ScheduleCommitment"
    algorithm: aggregation
    formula: |
      Project.aggregate_compensable_delay_days =
          SUM over DelayClaim k where k.project_id == project.id and k.status == "ALLOCATED"
          of k.compensable_days
      UtilityOwner.assessed_delay_liability_cents =
          SUM over DelayClaim k where k.status == "ALLOCATED"
          and the owner_id of k's ScheduleCommitment == owner.id
          of k.allocated_to_owner_cents
      Claims in SUBMITTED, UNDER_ANALYSIS or DENIED contribute nothing to either figure.
    constants: {}
    precision: "integer days and integer cents"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in priority order; the first
#     violated rule decides the response and no later rule is evaluated)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Request body and query parameters are schema-valid: required fields present, types correct, enum values in range, integers non-negative where declared, station_end > station_begin, construction_end_date > construction_start_date, window_end > window_start, trench_open_end > trench_open_start, replacement_in_kind_cost_cents <= estimated_cost_cents, proposed_capacity_ratio >= 1.0 with at most 2 decimals, indirect_cost_rate_pct in 0..35 with at most 2 decimals, limit in 1..100, offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Every path id resolves to an existing row, checked left to right"
    error_id: "ERR_PROJECT_NOT_FOUND | ERR_OWNER_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_INVESTIGATION_NOT_FOUND | ERR_CONFLICT_NOT_FOUND | ERR_DETERMINATION_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_FINDING_NOT_FOUND | ERR_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 5
    category: existence
    check: "Every foreign key in the request body resolves to an existing row, checked in the field order declared by the endpoint's input list"
    error_id: "ERR_PROJECT_NOT_FOUND | ERR_OWNER_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_CONFLICT_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /uro/facilities, POST /uro/investigations, POST /uro/conflicts, POST /uro/prior-rights, POST /uro/relocation-plans, POST /uro/permits, POST /uro/joint-trench-slots, POST /uro/commitments, POST /uro/agreements, POST /uro/cost-documents, POST /uro/audit-findings, POST /uro/delay-claims"
  - priority: 6
    category: auth
    check: "When X-User-Role is UtilityOwnerRep, X-User-ID equals the UtilityOwner id that owns the target row (ScheduleCommitment.owner_id, ReimbursementAgreement.owner_id, the CostDocument's agreement owner, or the facility owner of the conflict behind a RelocationPlan)"
    error_id: ERR_OWNER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles list includes UtilityOwnerRep"
  - priority: 7
    category: business_safety
    check: "Segregation of duties on the acting X-User-ID: the ExternalAuditor raising an AuditFinding must not be the AgreementOfficer recorded in ReimbursementAgreement.executed_by_user_id, and the RightOfWayAdjudicator re-issuing an appealed determination must not be the one recorded in PriorRightsDetermination.first_issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /uro/audit-findings, POST /uro/prior-rights/{id}/issue"
  - priority: 8
    category: state
    check: "The target row is in a state from which the requested transition is declared in §1.2 (generic transition guard, including terminal-state lockdown and repeat-trigger idempotency rejection)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all POST action endpoints under /uro that drive a state machine"
  - priority: 9
    category: state
    check: "ReimbursementAgreement.execution_status is PENDING_OWNER_SIGNATURE for execute, DRAFT for circulate, EXECUTED for open-final-billing, and not VOIDED for any settlement action"
    error_id: ERR_AGREEMENT_NOT_EXECUTABLE
    http_status: 409
    applies_to: "POST /uro/agreements/{id}/circulate, POST /uro/agreements/{id}/execute, POST /uro/agreements/{id}/open-final-billing, POST /uro/agreements/{id}/final-settlement"
  - priority: 10
    category: state
    check: "ReimbursementAgreement.settlement_status is NOT_STARTED for open-final-billing and PENDING_FINAL_INVOICE for final-settlement, cost-document submission and cost-document review; a SETTLED agreement accepts no further settlement action and cannot be voided"
    error_id: ERR_SETTLEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /uro/agreements/{id}/open-final-billing, POST /uro/agreements/{id}/final-settlement, POST /uro/agreements/{id}/void, POST /uro/cost-documents, POST /uro/cost-documents/{id}/review"
  - priority: 11
    category: state
    check: "The referenced ScheduleCommitment is in a state that permits the action: COMPLETE or BREACHED before a DelayClaim may be analyzed, and COMMITTED or IN_PROGRESS before report-complete or cancel"
    error_id: ERR_COMMITMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /uro/delay-claims/{id}/analyze, POST /uro/commitments/{id}/report-complete, POST /uro/commitments/{id}/cancel, POST /uro/commitments/{id}/start-work"
  - priority: 12
    category: state
    check: "The owning Project.status is not CLOSED"
    error_id: ERR_PROJECT_CLOSED
    http_status: 409
    applies_to: "all write endpoints under /uro other than POST /uro/projects, POST /uro/utility-owners and POST /uro/utility-owners/{id}/release-hold"
  - priority: 13
    category: state
    check: "The supplied expected_<parent>_version equals the parent row's current version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /uro/relocation-plans, POST /uro/agreements"
  - priority: 14
    category: business_safety
    check: "The owning Project.clearance_posture is not FUNDING_BLOCKED"
    error_id: ERR_CLEARANCE_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /uro/agreements/{id}/execute, POST /uro/commitments, POST /uro/projects/{id}/close"
  - priority: 15
    category: business_safety
    check: "The counterparty UtilityOwner.reimbursement_hold is false (it flips to true at 2 breached commitments)"
    error_id: ERR_OWNER_ON_REIMBURSEMENT_HOLD
    http_status: 409
    applies_to: "POST /uro/agreements/{id}/execute, POST /uro/agreements/{id}/final-settlement"
  - priority: 16
    category: business_referential
    check: "The conflict behind the plan has a PriorRightsDetermination in status ISSUED or FINAL before the plan may be approved, and the conflict's state_share_pct is non-null"
    error_id: ERR_PRIOR_RIGHTS_NOT_ISSUED
    http_status: 409
    applies_to: "POST /uro/relocation-plans/{id}/approve"
  - priority: 17
    category: business_referential
    check: "Every PermitRecord of the conflict is in status GRANTED, and at least one exists, before the relocation plan may be approved"
    error_id: ERR_PERMIT_NOT_GRANTED
    http_status: 409
    applies_to: "POST /uro/relocation-plans/{id}/approve"
  - priority: 18
    category: business_referential
    check: "When UtilityConflict.depends_on_conflict_id is non-null, that predecessor conflict is in status CLEARED before this conflict may be certified cleared"
    error_id: ERR_DEPENDENCY_NOT_CLEARED
    http_status: 409
    applies_to: "POST /uro/conflicts/{id}/certify-cleared"
  - priority: 19
    category: business_referential
    check: "No ReimbursementAgreement of the plan being superseded is in execution_status EXECUTED; a new plan on the same conflict may only retire agreements still in DRAFT or PENDING_OWNER_SIGNATURE"
    error_id: ERR_EXECUTED_AGREEMENT_BLOCKS_SUPERSEDE
    http_status: 409
    applies_to: "POST /uro/relocation-plans"
  - priority: 20
    category: business_referential
    check: "No AuditFinding of the agreement is in status OPEN"
    error_id: ERR_OPEN_AUDIT_FINDING
    http_status: 409
    applies_to: "POST /uro/agreements/{id}/final-settlement"
  - priority: 21
    category: business_referential
    check: "At least one CostDocument of the agreement is in review_status ACCEPTED with doc_type other than CREDIT_SALVAGE and INDIRECT"
    error_id: ERR_NO_ELIGIBLE_COST_DOCUMENTATION
    http_status: 422
    applies_to: "POST /uro/agreements/{id}/final-settlement"
  - priority: 22
    category: business_temporal
    check: "The commitment window lies inside the project's construction window: window_start >= Project.construction_start_date and window_end <= Project.construction_end_date"
    error_id: ERR_WINDOW_OUTSIDE_CONSTRUCTION
    http_status: 422
    applies_to: "POST /uro/commitments"
  - priority: 23
    category: business_temporal
    check: "The proposed window does not overlap any other COMMITTED or IN_PROGRESS commitment on the same UtilityFacility once MOBILIZATION_BUFFER_DAYS is added to each end: reject when new.window_start < existing.window_end + 3 days AND existing.window_start < new.window_end + 3 days"
    error_id: ERR_FACILITY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /uro/commitments"
  - priority: 24
    category: business_temporal
    check: "When joint_trench_slot_id is supplied, the commitment window is fully contained in the slot's opening, inclusive at both ends: slot.trench_open_start <= window_start AND window_end <= slot.trench_open_end"
    error_id: ERR_TRENCH_WINDOW_NOT_CONTAINED
    http_status: 422
    applies_to: "POST /uro/commitments"
  - priority: 25
    category: business_constraint
    check: "When joint_trench_slot_id is supplied, the slot's occupant_count is strictly below its max_occupants"
    error_id: ERR_TRENCH_SLOT_AT_CAPACITY
    http_status: 409
    applies_to: "POST /uro/commitments"
  - priority: 26
    category: business_constraint
    check: "RelocationPlan.revision_round is strictly below 3 before a resubmission is accepted"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /uro/relocation-plans/{id}/resubmit"
  - priority: 27
    category: business_constraint
    check: "PriorRightsDetermination.appeal_round is strictly below 1 before an owner appeal is accepted"
    error_id: ERR_APPEAL_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /uro/prior-rights/{id}/appeal"
  - priority: 28
    category: business_fiscal
    check: "not_to_exceed_cents is at least the plan estimate loaded with the owner's audited indirect rate: not_to_exceed_cents >= round_half_up(plan.estimated_cost_cents * (1 + owner.indirect_cost_rate_pct / 100), 0)"
    error_id: ERR_NOT_TO_EXCEED_TOO_LOW
    http_status: 422
    applies_to: "POST /uro/agreements"
  - priority: 29
    category: business_fiscal
    check: "The resulting committed ledger does not exceed Project.reimbursement_authority_cents: on execute, Project.total_committed_reimbursement_cents + this agreement's state_share_cents; on final-settlement, Project.total_committed_reimbursement_cents plus the settlement revision delta (the agreement is already counted, so a settlement that lowers the state share can never violate this rule)"
    error_id: ERR_AUTHORITY_EXCEEDED
    http_status: 409
    applies_to: "POST /uro/agreements/{id}/execute, POST /uro/agreements/{id}/final-settlement"
  - priority: 30
    category: business_fiscal
    check: "The analyzed DelayClaim has compensable_days > 0 before it may be allocated"
    error_id: ERR_DELAY_NOT_COMPENSABLE
    http_status: 422
    applies_to: "POST /uro/delay-claims/{id}/allocate"
  - priority: 31
    category: business_fiscal
    check: "Every conflict of the project is CLEARED and every ReimbursementAgreement of the project is in settlement_status SETTLED or VOIDED_OUT before the project may be closed"
    error_id: ERR_PROJECT_CLOSE_BLOCKED
    http_status: 409
    applies_to: "POST /uro/projects/{id}/close"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- read surface -----------------------------------------------------------
  - method: GET
    path: /uro/projects
    description: List highway projects, newest first by created_at
    roles: [ProgramAdmin, UtilityCoordinator, RightOfWayAdjudicator, AgreementOfficer, ConstructionEngineer, ExternalAuditor]
    code: 200
    input: ["status?", "clearance_posture?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: GET
    path: /uro/projects/{id}
    description: Fetch one project with its derived posture and money figures
    roles: [ProgramAdmin, UtilityCoordinator, RightOfWayAdjudicator, AgreementOfficer, ConstructionEngineer, ExternalAuditor, UtilityOwnerRep]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: GET
    path: /uro/projects/{id}/clearance-summary
    description: Computed read of the project's clearance posture inputs, including the CLEARANCE_WARNING_DAYS look-ahead
    roles: [ProgramAdmin, UtilityCoordinator, ConstructionEngineer]
    code: 200
    input: []
    output: { clearance_posture: string, open_conflict_count: integer, untriaged_conflict_count: integer, overdue_commitment_count: integer, at_risk_commitment_count: integer, estimated_state_liability_cents: integer, total_committed_reimbursement_cents: integer, reimbursement_authority_cents: integer, remaining_authority_cents: integer }
    side_effects: []
  - method: GET
    path: /uro/projects/{id}/joint-trench-slots
    description: List the joint trench openings declared on a project
    roles: [ProgramAdmin, UtilityCoordinator, ConstructionEngineer, UtilityOwnerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: JointTrenchSlot[]
    side_effects: []
  - method: GET
    path: /uro/utility-owners
    description: List utility owners
    roles: [ProgramAdmin, UtilityCoordinator, RightOfWayAdjudicator, AgreementOfficer, ExternalAuditor]
    code: 200
    input: ["utility_type?", "reimbursement_hold?", "limit?", "offset?"]
    output: UtilityOwner[]
    side_effects: []
  - method: GET
    path: /uro/utility-owners/{id}
    description: Fetch one utility owner with its delinquency and hold posture
    roles: [ProgramAdmin, UtilityCoordinator, RightOfWayAdjudicator, AgreementOfficer, ExternalAuditor, UtilityOwnerRep]
    code: 200
    input: []
    output: UtilityOwner
    side_effects: []
  - method: GET
    path: /uro/utility-owners/{id}/facilities
