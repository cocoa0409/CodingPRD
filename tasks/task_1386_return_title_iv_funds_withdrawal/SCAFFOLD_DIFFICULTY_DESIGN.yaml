            - "After recalculate with identical inputs: aid_earned_cents == 300000 and aid_unearned_cents == 200000 (sum still == 500000, no drift)"
            - "Obligations list: exactly 1 VOIDED row and exactly 1 PENDING row, both amount_cents == 200000 (compensation replaced, not duplicated)"

      - name: ledger_balance_round_trip_on_rescind
        grounds:
          - calculations.student_balance
          - state_machines.Enrollment.WITHDRAWN_to_ENROLLED
          - entities.StudentAccountEntry.fields.reversal_of_entry_id
