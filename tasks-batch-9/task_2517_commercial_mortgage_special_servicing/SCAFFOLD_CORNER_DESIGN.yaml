            - "WorkoutPlan.version and ConsultationRequest.${consult_2_id}.version each incremented by exactly 1, Loan.version incremented by 1"
            - "A further POST to the plan's status endpoint with to_status SCORED now fails with ERR_INVALID_STATE_TRANSITION (409)"

      - name: reo_write_off_cascades_down_to_the_loan_without_touching_the_advance_ledger
        claim_type: cascade_down
        grounds:
          - state_machines.REOAsset.MARKETED_to_WRITTEN_OFF
          - entities.Loan.fields.realized_loss_usd
          - entities.Trust.fields.loans_in_special_servicing_count
        distinguishing_aspect: "The write-off is the non-waterfall route into realized loss and its cascade is deliberately narrower than the SOLD cascade: principal plus OUTSTANDING advance principal becomes loss and the loan goes WRITTEN_OFF, but no LIQUIDATION_FEE is accrued, no advance is reimbursed and no advance leaves OUTSTANDING — advances_outstanding_usd keeps reporting 350,000.00 next to a zero principal balance."
