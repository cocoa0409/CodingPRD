              captures: { q1: "$.data[0].id" }
          trigger:
            - call: "POST /tax/estimated-payments/${q1}/record-payment"
              payload: { amount_cents: 0 }
              as: TaxAccountant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_AMOUNT (HTTP 422)"

      - name: duplicate_jurisdiction_code_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_DUPLICATE_JURISDICTION_CODE]
        distinguishing_aspect: "Jurisdiction.code is globally unique: the second create with code US-FED fails 409 ERR_DUPLICATE_JURISDICTION_CODE."
        test_recipe:
          setup: ["One jurisdiction with code US-FED exists"]
          setup_api_calls:
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
          trigger:
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "Duplicate Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15 }
              as: TaxManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_JURISDICTION_CODE (HTTP 409); only one jurisdiction with that code exists"

      - name: duplicate_schedule_generation_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_DUPLICATE_QUARTER]
        distinguishing_aspect: "generate-schedule is once-only per (tax_year, jurisdiction): the second call for the same pair fails ERR_DUPLICATE_QUARTER instead of creating quarters 1-4 again."
        test_recipe:
          setup: ["FY2026; US-IL; annualized schedule already generated"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-IL", name: "Illinois", level: STATE, statutory_rate_bp: 883, apportionment_pct_bp: 2503, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_il: $.data.id }
            - { call: "POST /tax/estimated-payments/generate-schedule", payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_il}", method: CURRENT_YEAR_ANNUALIZED }, as: TaxManager }
          trigger:
            - call: "POST /tax/estimated-payments/generate-schedule"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_il}", method: PRIOR_YEAR_SAFE_HARBOR }
              as: TaxManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_QUARTER (HTTP 409); still exactly 4 payments for the pair"

      - name: difference_create_after_lock_returns_tax_year_not_open
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_TAX_YEAR_NOT_OPEN]
        distinguishing_aspect: "Once the provision is locked, the year's books are frozen: creating a further difference fails ERR_TAX_YEAR_NOT_OPEN."
        test_recipe:
          setup: ["FY2026 PROVISION_LOCKED (zero differences; approved zero allowance)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id, ty_v0: $.data.version }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: false, projected_taxable_income_cents: 0, reversing_dtl_cents: 0, expected_tax_year_version: "${ty_v0}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va1: $.data.id }
            - { call: "POST /tax/valuation-allowances/${va1}/submit", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tax/valuation-allowances/${va1}/approve", payload: {}, as: TaxDirector, as_user_id: "dir-1" }
            - { call: "POST /tax/tax-years/${ty_id}/lock-provision", payload: {}, as: TaxDirector }
          trigger:
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "late-found difference", book_amount_cents: 100000, tax_amount_cents: 0, difference_type: PERMANENT }
              as: TaxAccountant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TAX_YEAR_NOT_OPEN (HTTP 409); no difference is created"

      - name: mark_ready_before_lock_returns_tax_year_not_locked
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_TAX_YEAR_NOT_LOCKED]
        distinguishing_aspect: "Return preparation cannot start before the provision is locked: mark-ready against an OPEN year fails ERR_TAX_YEAR_NOT_LOCKED."
        test_recipe:
          setup: ["FY2026 OPEN; FED filing PENDING"]
          setup_api_calls:
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/filings"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", original_due_date: "2027-04-15" }
              as: TaxAccountant
              captures: { fil1: $.data.id }
          trigger:
            - call: "POST /tax/filings/${fil1}/mark-ready"
              payload: { return_tax_liability_cents: 21100000 }
              as: TaxAccountant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TAX_YEAR_NOT_LOCKED (HTTP 409); filing stays PENDING with no liability attached"

      - name: unfiled_returns_block_mark_returns_filed
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_UNFILED_RETURNS]
        distinguishing_aspect: "mark-returns-filed requires every filing of the year FILED/ACCEPTED; a single PENDING filing blocks with ERR_UNFILED_RETURNS."
        test_recipe:
          setup: ["FY2026 PROVISION_LOCKED; FED filing still PENDING (never marked ready)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/filings"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", original_due_date: "2027-04-15" }
              as: TaxAccountant
              captures: { fil1: $.data.id }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxManager
              captures: { ty_va_v: $.data.version }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: false, projected_taxable_income_cents: 0, reversing_dtl_cents: 0, expected_tax_year_version: "${ty_va_v}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va1: $.data.id }
            - { call: "POST /tax/valuation-allowances/${va1}/submit", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tax/valuation-allowances/${va1}/approve", payload: {}, as: TaxDirector, as_user_id: "dir-1" }
            - { call: "POST /tax/tax-years/${ty_id}/lock-provision", payload: {}, as: TaxDirector }
          trigger:
            - call: "POST /tax/tax-years/${ty_id}/mark-returns-filed"
              payload: {}
              as: TaxDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNFILED_RETURNS (HTTP 422); TaxYear stays PROVISION_LOCKED"

  - section: endpoints
    instances:
      - name: generate_schedule_computes_quarter_dates
        claim_type: side_effect_execution
        grounds:
          - "endpoints.POST /tax/estimated-payments/generate-schedule"
          - calculations.estimated_payment_schedule
        distinguishing_aspect: "Generation tiles the fiscal year into four 3-month closed intervals with due_date = period_end + 15 days: Q1 [01-01, 03-31] due 04-15 through Q4 [10-01, 12-31] due 2027-01-15."
        test_recipe:
          setup: ["FY2026 (2026-01-01..2026-12-31); US-IL"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-IL", name: "Illinois", level: STATE, statutory_rate_bp: 883, apportionment_pct_bp: 2503, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_il: $.data.id }
          trigger:
            - call: "POST /tax/estimated-payments/generate-schedule"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_il}", method: CURRENT_YEAR_ANNUALIZED }
              as: TaxManager
              captures: { q1s: "$.data[0].period_start_date", q1e: "$.data[0].period_end_date", q1d: "$.data[0].due_date", q4s: "$.data[3].period_start_date", q4e: "$.data[3].period_end_date", q4d: "$.data[3].due_date" }
          assert:
            - "Q1: period 2026-01-01..2026-03-31, due_date 2026-04-15 (period_end + 15 days)"
            - "Q4: period 2026-10-01..2026-12-31, due_date 2027-01-15 (crosses the year boundary)"
            - "All four quarters: status SCHEDULED, paid_amount_cents 0, penalty_cents 0, quarter_index 1..4 in order"

  - section: errors
