      - name: strike_threshold_exact_30
        grounds:
          - calculations.strike_score
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - errors[ERR_MEMBER_NOT_ACTIVE]
        distinguishing_aspect: |
          Metric = strike points at incident advance: 20 (CONFIRMED MAJOR) does
          NOT suspend, and adding 10 (CONFIRMED MINOR) to reach exactly 30 DOES
          suspend (>= boundary inclusive) — distinct metric and endpoint from the
          capacity instance.
        test_recipe:
          setup:
            - "Clock 2026-08-01; member A active; MAJOR report confirmed (20 points, still ACTIVE); MINOR report at UNDER_REVIEW"
          setup_api_calls:
