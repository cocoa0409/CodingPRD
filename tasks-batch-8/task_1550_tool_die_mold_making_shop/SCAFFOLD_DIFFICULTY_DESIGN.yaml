          assert:
            - "FIRM issue on SUBMITTED design rejected http 409 error_id == ERR_DESIGN_NOT_RELEASED"
            - "captured err1 == ERR_DESIGN_NOT_RELEASED"
            - "Quote.${q_f}.status == DRAFT  # unchanged"
            - "BUDGETARY issue on the same SUBMITTED design succeeds: Quote.${q_b}.status == ISSUED"
            - "Quote.${q_b}.issued_at == 2026-08-01T00:00:00Z (clock default)"
            - "Quote.${q_b}.valid_until == 2026-08-15T00:00:00Z (BUDGETARY 14-day validity)"

