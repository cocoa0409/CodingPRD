              payload: { brand_id: "${bu_id}", name: "Item", price_cents: 500, prep_minutes: 1, required_equipment_type: "PREP_STATION" }
              as: BrandOwner
              as_user_id: "${bu_id}"
              captures: { item_id: $.data.id }
