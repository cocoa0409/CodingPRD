# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of testable claims)
# Taxonomy sections/claim_types per references/claim-extraction-guide.md.
# Every active instance is reachable from empty-DB via §1.5; stubs cite a §1.8
# instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_member_minimal_returns_201_prospect
        claim_type: Creation
        grounds:
          - entities.Member
          - endpoints
        distinguishing_aspect: "POST /members with all required fields returns 201, status=PROSPECT, screening_decision=NONE, version=1, server-minted id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M1", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "MALE" }
              as: ScreeningOfficer
              captures: { m_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Member.${m_id}.status == PROSPECT"
            - "Member.${m_id}.screening_decision == NONE"
            - "Member.${m_id}.version == 1"

      - name: create_member_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Member.fields.gender
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /members omitting the required gender field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "m2@x.com", full_name: "M2", birth_date: "1990-01-01T00:00:00Z", city: "NYC" }
              as: ScreeningOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Member
          - errors[ERR_MEMBER_NOT_FOUND]
        distinguishing_aspect: "GET /members/{id} with a non-existent UUID returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Matchmaker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MEMBER_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_plan_returns_active_and_defaults_applied
        claim_type: Defaults
        grounds:
          - entities.MembershipPlan.fields.priority_match_enabled
          - entities.MembershipPlan.fields.status
        distinguishing_aspect: "POST /membership-plans omitting priority_match_enabled defaults it to false; status=ACTIVE, archived=false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /membership-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 9000, term_months: 3, guaranteed_introductions: 4, included_coaching_sessions: 2, coaching_value_cents: 4000, background_check_addon_cents: 2000 }
              as: BillingAdmin
              captures: { plan_id: $.data.id, prio: $.data.priority_match_enabled, st: $.data.status }
          assert:
            - "MembershipPlan.${plan_id}.priority_match_enabled == false"
            - "MembershipPlan.${plan_id}.status == ACTIVE"

      - name: system_fields_ignored_on_member_create
        claim_type: System Fields
        grounds:
          - entities.Member.fields.status
          - entities.Member.fields.version
        distinguishing_aspect: "Client-supplied status/version in POST /members are ignored: result is PROSPECT/version=1 regardless of input (status not in input schema -> rejected as unknown field is handled as ERR_INVALID_REQUEST is too strict; here only declared fields are sent and status remains system-set)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "m3@x.com", full_name: "M3", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "FEMALE" }
              as: ScreeningOfficer
              captures: { m_id: $.data.id, st: $.data.status, v: $.data.version }
          assert:
            - "Member.${m_id}.status == PROSPECT"
            - "Member.${m_id}.version == 1"

      - name: invalid_enum_gender_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Member.fields.gender
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /members with gender='ROBOT' (not in MALE/FEMALE/NONBINARY) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "m4@x.com", full_name: "M4", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "ROBOT" }
              as: ScreeningOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: preference_max_age_below_min_age_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Preference.fields.max_age
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "PUT /members/{id}/preferences with max_age < min_age returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A PROSPECT member exists (preferences allowed pre-activation)."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m5@x.com", full_name: "M5", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "MALE" }
              as: ScreeningOfficer
              captures: { m_id: $.data.id }
          trigger:
            - call: "PUT /members/${m_id}/preferences"
              payload: { seeking_gender: "FEMALE", min_age: 40, max_age: 30, max_distance_band: 0, attribute_weights: { education: 50, lifestyle: 50, values: 50 } }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: respond_on_declined_introduction_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Introduction.SUGGESTED_to_DECLINED
          - errors[ERR_INVALID_INTRODUCTION_STATE]
        distinguishing_aspect: "Responding again on a DECLINED introduction is rejected with ERR_INVALID_INTRODUCTION_STATE (409); no side effects."
        test_recipe:
          setup: ["An eligible pair a/b; introduction SUGGESTED then DECLINED by member_b."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 12000, term_months: 6, guaranteed_introductions: 8, priority_match_enabled: false, included_coaching_sessions: 3, coaching_value_cents: 5000, background_check_addon_cents: 2500 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /members"
              payload: { email: "ca1@x.com", full_name: "CA1", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "MALE" }
              as: ScreeningOfficer
              captures: { a_id: $.data.id }
            - call: "POST /members/${a_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { a_scr: $.data.id }
            - call: "POST /members/${a_id}/screenings/${a_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${a_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "PUT /members/${a_id}/preferences"
              payload: { seeking_gender: "FEMALE", min_age: 25, max_age: 45, max_distance_band: 0, attribute_weights: { education: 80, lifestyle: 80, values: 80 } }
              as: Member
              as_user_id: "${a_id}"
            - call: "POST /members"
              payload: { email: "cb1@x.com", full_name: "CB1", birth_date: "1992-01-01T00:00:00Z", city: "NYC", gender: "FEMALE" }
              as: ScreeningOfficer
              captures: { b_id: $.data.id }
            - call: "POST /members/${b_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { b_scr: $.data.id }
            - call: "POST /members/${b_id}/screenings/${b_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${b_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "PUT /members/${b_id}/preferences"
              payload: { seeking_gender: "MALE", min_age: 25, max_age: 45, max_distance_band: 0, attribute_weights: { education: 80, lifestyle: 80, values: 80 } }
              as: Member
              as_user_id: "${b_id}"
            - call: "GET /members/${a_id}"
              payload: {}
              as: Matchmaker
              captures: { a_v: $.data.version }
            - call: "POST /introductions"
              payload: { member_a_id: "${a_id}", member_b_id: "${b_id}", expected_member_a_version: "${a_v}" }
              as: Matchmaker
              captures: { intro_id: $.data.id, intro_v: $.data.version }
            - call: "POST /introductions/${intro_id}/respond"
              payload: { response: "DECLINED", expected_introduction_version: "${intro_v}" }
              as: Member
              as_user_id: "${b_id}"
              captures: { intro_v2: $.data.version }
          trigger:
            - call: "POST /introductions/${intro_id}/respond"
              payload: { response: "ACCEPTED", expected_introduction_version: "${intro_v2}" }
              as: Member
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_INTRODUCTION_STATE"
            - "HTTP status == 409"

      - name: decide_screening_twice_returns_already_decided
        claim_type: Idempotency
        grounds:
          - state_machines.Member.SCREENING_to_ACTIVE
          - errors[ERR_SCREENING_ALREADY_DECIDED]
        distinguishing_aspect: "Deciding a screening a second time returns ERR_SCREENING_ALREADY_DECIDED (409); the first decision stands."
        test_recipe:
          setup: ["A member with a screening already APPROVED."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "ca2@x.com", full_name: "CA2", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "MALE" }
              as: ScreeningOfficer
              captures: { a_id: $.data.id }
            - call: "POST /members/${a_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { a_scr: $.data.id }
            - call: "POST /members/${a_id}/screenings/${a_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
          trigger:
            - call: "POST /members/${a_id}/screenings/${a_scr}/decide"
              payload: { decision: "REJECTED" }
              as: ScreeningOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SCREENING_ALREADY_DECIDED"
            - "HTTP status == 409"

      - name: exit_already_exited_member_returns_not_exitable
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Member.ACTIVE_to_EXITED
          - errors[ERR_MEMBER_NOT_EXITABLE]
        distinguishing_aspect: "A member already EXITED (via screening REJECTED) cannot be exited again -> ERR_MEMBER_NOT_EXITABLE (409)."
        test_recipe:
          setup: ["A member whose screening was REJECTED, so status=EXITED."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "ca3@x.com", full_name: "CA3", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "MALE" }
              as: ScreeningOfficer
              captures: { a_id: $.data.id }
            - call: "POST /members/${a_id}/screenings"
              payload: { questionnaire_score: 20, identity_verified: false }
              as: ScreeningOfficer
              captures: { a_scr: $.data.id }
            - call: "POST /members/${a_id}/screenings/${a_scr}/decide"
              payload: { decision: "REJECTED" }
              as: ScreeningOfficer
          trigger:
            - call: "POST /members/${a_id}/exit"
              payload: {}
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MEMBER_NOT_EXITABLE"
            - "HTTP status == 409"

      - name: resume_scheduled_freeze_not_active_returns_freeze_not_active
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Freeze.ACTIVE_to_RESUMED
          - errors[ERR_FREEZE_NOT_ACTIVE]
        distinguishing_aspect: "Resuming a freeze that is still SCHEDULED (start_at in the future, never activated) returns ERR_FREEZE_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["An ACTIVE membership with a SCHEDULED future freeze (start_at after clock)."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 12000, term_months: 6, guaranteed_introductions: 8, priority_match_enabled: false, included_coaching_sessions: 3, coaching_value_cents: 5000, background_check_addon_cents: 2500 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /members"
              payload: { email: "ca4@x.com", full_name: "CA4", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "MALE" }
              as: ScreeningOfficer
              captures: { a_id: $.data.id }
            - call: "POST /members/${a_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { a_scr: $.data.id }
            - call: "POST /members/${a_id}/screenings/${a_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${a_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
              captures: { a_ms: $.data.id }
            - call: "POST /memberships/${a_ms}/freezes"
              payload: { start_at: "2026-07-01T00:00:00Z", end_at: "2026-07-10T00:00:00Z" }
              as: BillingAdmin
              captures: { frz_id: $.data.id }
          trigger:
            - call: "POST /memberships/${a_ms}/freezes/${frz_id}/resume"
              payload: {}
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FREEZE_NOT_ACTIVE"
            - "HTTP status == 409"

      - name: date_outcome_before_start_returns_not_started
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DateEvent.SCHEDULED_to_COMPLETED
          - errors[ERR_DATE_NOT_STARTED]
        distinguishing_aspect: "Recording a date outcome while clock now < DateEvent.start_at returns ERR_DATE_NOT_STARTED (409)."
        test_recipe:
          setup: ["A MUTUAL introduction a/b with a SCHEDULED future DateEvent; clock still before start."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 12000, term_months: 6, guaranteed_introductions: 8, priority_match_enabled: false, included_coaching_sessions: 3, coaching_value_cents: 5000, background_check_addon_cents: 2500 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /members"
              payload: { email: "ca5@x.com", full_name: "CA5", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "MALE" }
              as: ScreeningOfficer
              captures: { a_id: $.data.id }
            - call: "POST /members/${a_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { a_scr: $.data.id }
            - call: "POST /members/${a_id}/screenings/${a_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${a_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "PUT /members/${a_id}/preferences"
              payload: { seeking_gender: "FEMALE", min_age: 25, max_age: 45, max_distance_band: 0, attribute_weights: { education: 80, lifestyle: 80, values: 80 } }
              as: Member
              as_user_id: "${a_id}"
            - call: "POST /members"
              payload: { email: "cb5@x.com", full_name: "CB5", birth_date: "1992-01-01T00:00:00Z", city: "NYC", gender: "FEMALE" }
              as: ScreeningOfficer
              captures: { b_id: $.data.id }
            - call: "POST /members/${b_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { b_scr: $.data.id }
            - call: "POST /members/${b_id}/screenings/${b_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${b_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "PUT /members/${b_id}/preferences"
              payload: { seeking_gender: "MALE", min_age: 25, max_age: 45, max_distance_band: 0, attribute_weights: { education: 80, lifestyle: 80, values: 80 } }
              as: Member
              as_user_id: "${b_id}"
            - call: "GET /members/${a_id}"
              payload: {}
              as: Matchmaker
              captures: { a_v: $.data.version }
            - call: "POST /introductions"
              payload: { member_a_id: "${a_id}", member_b_id: "${b_id}", expected_member_a_version: "${a_v}" }
              as: Matchmaker
              captures: { intro_id: $.data.id, intro_v: $.data.version }
            - call: "POST /introductions/${intro_id}/respond"
              payload: { response: "ACCEPTED", expected_introduction_version: "${intro_v}" }
              as: Member
              as_user_id: "${a_id}"
              captures: { intro_v2: $.data.version }
            - call: "POST /introductions/${intro_id}/respond"
              payload: { response: "ACCEPTED", expected_introduction_version: "${intro_v2}" }
              as: Member
              as_user_id: "${b_id}"
            - call: "POST /introductions/${intro_id}/date-events"
              payload: { scheduled_by_member_id: "${a_id}", start_at: "2026-06-15T18:00:00Z", end_at: "2026-06-15T20:00:00Z" }
              as: Member
              as_user_id: "${a_id}"
              captures: { date_id: $.data.id }
          trigger:
            - call: "POST /date-events/${date_id}/outcome"
              payload: { outcome: "COMPLETED" }
              as: Matchmaker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DATE_NOT_STARTED"
            - "HTTP status == 409"

      - name: freeze_resume_bubbles_membership_active_and_extends_term
        claim_type: Bubble up
        grounds:
          - state_machines.Freeze.ACTIVE_to_RESUMED
          - entities.Member.fields.frozen_days_total
          - entities.Member.fields.term_end_at
        distinguishing_aspect: "Resuming an ACTIVE freeze (start 2026-06-10, resumed at 2026-06-20) commits 10 days: frozen_days_total becomes 10, Membership ACTIVE, Member ACTIVE."
        test_recipe:
          setup: ["ACTIVE membership started 2026-06-01; a freeze [2026-06-10, 2026-06-30) that activated; clock advanced to 2026-06-20 then resumed."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 12000, term_months: 6, guaranteed_introductions: 8, priority_match_enabled: false, included_coaching_sessions: 3, coaching_value_cents: 5000, background_check_addon_cents: 2500 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /members"
              payload: { email: "ca6@x.com", full_name: "CA6", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "MALE" }
              as: ScreeningOfficer
              captures: { a_id: $.data.id }
            - call: "POST /members/${a_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { a_scr: $.data.id }
            - call: "POST /members/${a_id}/screenings/${a_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${a_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
              captures: { a_ms: $.data.id }
            - call: "POST /memberships/${a_ms}/freezes"
              payload: { start_at: "2026-06-10T00:00:00Z", end_at: "2026-06-30T00:00:00Z" }
              as: BillingAdmin
              captures: { frz_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /memberships/${a_ms}/freezes/${frz_id}/resume"
              payload: {}
              as: BillingAdmin
              captures: { days: $.data.committed_days, fstatus: $.data.status }
            - call: "GET /members/${a_id}"
              payload: {}
              as: Matchmaker
              captures: { ft: $.data.frozen_days_total, mstatus: $.data.status }
          assert:
            - "Freeze.${frz_id}.committed_days == 10"
            - "Freeze.${frz_id}.status == RESUMED"
            - "Member.${a_id}.frozen_days_total == 10"
            - "Member.${a_id}.status == ACTIVE"

      - name: membership_fulfilled_bubble_up_on_guarantee_met
        claim_type: Bubble up
        grounds:
          - state_machines.Membership.ACTIVE_to_FULFILLED
          - entities.Membership.fields.guarantee_met
        distinguishing_aspect: "On a plan guaranteeing 1, the single introduction reaching MUTUAL bubbles the membership to FULFILLED with guarantee_met=true."
        test_recipe:
          setup: ["member_a on a plan guaranteeing 1; one introduction reaches MUTUAL."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 9000, term_months: 6, guaranteed_introductions: 1, priority_match_enabled: false, included_coaching_sessions: 3, coaching_value_cents: 5000, background_check_addon_cents: 2500 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /members"
              payload: { email: "ca7@x.com", full_name: "CA7", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "MALE" }
              as: ScreeningOfficer
              captures: { a_id: $.data.id }
            - call: "POST /members/${a_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { a_scr: $.data.id }
            - call: "POST /members/${a_id}/screenings/${a_scr}/decide"
