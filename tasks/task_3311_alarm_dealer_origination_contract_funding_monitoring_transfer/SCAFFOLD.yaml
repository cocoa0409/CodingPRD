    roles: [Customer, FundingAnalyst]
    code: 200
    input: []
    output: Contract
    side_effects: ["sets cancelled_from_status and stamps cancelled_at", "closes the monitoring account and cascades CLOSED to its non-terminal dispatches", "runs the post-warranty service sweep when post_warranty_cents exceeds the threshold", "runs chargeback_decision", "increments Contract.version by 1"]
  - method: POST
    path: "/alarm-funding/contracts/{id}/chargeback"
    description: "Adjudicate a dealer chargeback for a cancelled contract inside the chargeback window"
    roles: [FundingAnalyst]
    code: 200
    input: []
    output: Contract
    side_effects: ["runs chargeback_decision and cascades the amount into Dealer.holdback_reserve_cents and Dealer.chargeback_balance_due_cents", "re-derives Dealer.standing", "increments Dealer.version by 1"]
  - method: POST
    path: "/alarm-funding/contracts/{id}/reactivate-service"
