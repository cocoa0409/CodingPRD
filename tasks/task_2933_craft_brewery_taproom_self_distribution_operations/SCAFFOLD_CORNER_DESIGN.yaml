          trigger:
            - call: "POST /beers/${beer_id}/filings/LABEL/decision"
              payload: { decision: "APPROVED", cola_id: "COLA-24-0001" }
              as: StateRegulator
              captures: { err_filing: $.data.error_id }
            - call: "POST /keg-assets/${keg_id}/movements"
              payload: { movement_type: "TAP" }
