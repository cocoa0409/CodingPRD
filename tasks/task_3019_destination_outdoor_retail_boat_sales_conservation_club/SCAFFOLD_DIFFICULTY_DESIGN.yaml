              payload: { boat_unit_id: "${bu_id}", order_kind: "TAXIDERMY", promised_lead_days: 60 }
              as: ServiceWriter
              captures: { so_id: $.data.id }
            - call: "POST /stores/${st_id}/service-intakes"
              payload: { member_id: "${m_id}", service_order_id: "${so_id}", intake_kind: "TAXIDERMY", specimen_quantity: 20, quoted_lead_days: 60, deposit_cents: 5000, species_code: "WTDEER", permit_sale_id: "${ps_id}" }
              as: ServiceWriter
              captures: { si_id: $.data.id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m_id}", session_kind: "GENERAL_ADMISSION", party_size: 10, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z" }
              as: AttractionHost
          trigger:
            - call: "POST /stores/service-intakes/${si_id}/verify-permit"
              payload: {}
              as: ServiceWriter
              captures: { err: $.data.error_id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m_id}", session_kind: "GENERAL_ADMISSION", party_size: 12, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z" }
              as: AttractionHost
              captures: { err2: $.data.error_id }
          assert:
            - "the verify-permit call is rejected with data.error_id == ERR_PERMIT_VERIFICATION_REQUIRED and http 422, because the FISHING permit is not a hunting permit"
            - "ServiceIntake.${si_id}.status remains INTAKE_QUOTED and its project_charge_cents is unchanged"
            - "the second session request is rejected with data.error_id == ERR_VENUE_CAPACITY_EXCEEDED and http 409, so the capacity constraint surfaces only after the safety gate has already passed"
            - "the two rejections come from different error categories (business_safety 422 versus business_constraint 409), which is what the pairing asserts"

  # ===========================================================================
  # Rule 6 — boundary-precision checks on different metrics / endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: club_tier_threshold_inclusive_boundary
        grounds:
          - calculations.tier_threshold_eval
          - calculations.club_points_apply
          - entities.Member.fields.club_tier
          - entities.PointEvent.fields.points_delta
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          A numeric threshold crossing: points_lifetime_earned 24999 reads
          SILVER and 25000 reads GOLD under a >= comparison, and the same
          threshold-1 / threshold pair is reachable twice through the point-event
          endpoint — once by a single adjustment landing exactly on 25000 and
          once by an adjustment reaching 24999.
        test_recipe:
          setup:
            - "A store at clock 2026-09-01T00:00Z and one club member with an empty ledger, so points_lifetime_earned starts at 0 and club_tier at BASE."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_bd@x.com", full_name: "Bo Dune", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /stores/${st_id}/point-events"
              payload: { member_id: "${m_id}", event_kind: "AWARD", points_delta: 8000 }
              as: ClubCardSpecialist
              captures: { pe1_id: $.data.id }
            - call: "GET /stores/members/${m_id}"
              as: StoreManager
            - call: "POST /stores/${st_id}/point-events"
              payload: { member_id: "${m_id}", event_kind: "AWARD", points_delta: 16999 }
              as: ClubCardSpecialist
              captures: { pe2_id: $.data.id }
            - call: "GET /stores/members/${m_id}"
              as: StoreManager
            - call: "POST /stores/${st_id}/point-events"
              payload: { member_id: "${m_id}", event_kind: "AWARD", points_delta: 1 }
              as: ClubCardSpecialist
              captures: { pe3_id: $.data.id }
            - call: "GET /stores/members/${m_id}"
              as: StoreManager
          assert:
            - "after the first award Member.${m_id}.points_lifetime_earned == 8000 and Member.${m_id}.club_tier == SILVER, so the 8000 lower bound is inclusive"
            - "after the second award Member.${m_id}.points_lifetime_earned == 24999 and Member.${m_id}.club_tier == SILVER, the threshold-minus-one case"
            - "after the third award Member.${m_id}.points_lifetime_earned == 25000 and Member.${m_id}.club_tier == GOLD, so the precisely-boundary case is inclusive"
            - "Member.${m_id}.redeemable_points == 23500, which is 25000 minus the GOLD retention floor of 1500"
            - "a negative points_delta is rejected with ERR_INVALID_REQUEST, so the boundary test cannot be run through a subtraction"

      - name: lane_and_party_size_boundaries_on_two_endpoints
        grounds:
          - calculations.attraction_dwell_charge
          - entities.Attraction.fields.capacity_units
          - entities.AttractionSession.fields.lane_no
          - errors[ERR_LANE_CAPACITY_EXCEEDED]
          - errors[ERR_VENUE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Two distinct boundaries on two different endpoints: lane_no is an
          inclusive-or-exclusive integer boundary (12 admits, 13 rejects) while
          party_size sits on a band boundary where 5 takes the whole-party
          multiplier and 4 does not — one is a hard rejection boundary and the
          other is a value boundary, both on the same venue family.
        test_recipe:
          setup:
            - "A store at clock 2026-09-01T00:00Z with an ARCHERY_RANGE of capacity_units 12 and dwell_cost_minutes 45, and one member."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_bd2@x.com", full_name: "Blaise Dent", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "ARCHERY_RANGE", capacity_units: 12, dwell_cost_minutes: 45 }
              as: StoreManager
              captures: { at_id: $.data.id }
            - call: "POST /stores/attractions/${at_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${st_id}/waivers"
              payload: { member_id: "${m_id}", activity_scope: "ARCHERY_RANGE", signed_at_utc: "2026-08-01T00:00:00Z", waiver_term_days: 365 }
              as: AttractionHost
              captures: { wv_id: $.data.id }
          trigger:
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m_id}", session_kind: "ARCHERY_LANE", party_size: 4, lane_no: 12, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z", waiver_id: "${wv_id}" }
              as: AttractionHost
              captures: { s4_id: $.data.id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m_id}", session_kind: "ARCHERY_LANE", party_size: 5, lane_no: 13, slot_start_utc: "2026-11-02T10:00:00Z", slot_end_utc: "2026-11-02T11:00:00Z", waiver_id: "${wv_id}" }
              as: AttractionHost
              captures: { err: $.data.error_id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m_id}", session_kind: "ARCHERY_LANE", party_size: 13, lane_no: 12, slot_start_utc: "2026-11-03T10:00:00Z", slot_end_utc: "2026-11-03T11:00:00Z", waiver_id: "${wv_id}" }
              as: AttractionHost
              captures: { err2: $.data.error_id }
          assert:
            - "the party of 4 on lane 12 is accepted: AttractionSession.${s4_id}.status == CONFIRMED and AttractionSession.${s4_id}.lane_no == 12, so the lane upper bound is inclusive"
            - "the party of 5 on lane 13 is rejected with data.error_id == ERR_LANE_CAPACITY_EXCEEDED and http 422, so 13 is outside the inclusive 12 limit"
            - "the party of 13 on lane 12 is rejected with data.error_id == ERR_VENUE_CAPACITY_EXCEEDED and http 409, so the venue capacity boundary is a distinct metric from the lane boundary"
            - "AttractionSession.${s4_id}.dwell_charge_minutes == 180 (45 per guest at the whole-party multiplier of 1, since 4 sits below the 5-guest band), so a party of 5 would charge 450 and the band boundary falls exactly at 5"

  # ===========================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: fulfillment_release_requires_service_order_delivered
        grounds:
          - state_machines.OrderFulfillment.transitions.READY_FOR_RELEASE_to_RELEASED
          - state_machines.ServiceOrder.transitions.COMPLETED_to_DELIVERED
          - validations[priority=16]
          - errors[ERR_FULFILLMENT_BLOCKED]
        distinguishing_aspect: |
          The OrderFulfillment-to-ServiceOrder pair: the fulfillment's release
          transition is legal only while its pre_service_order_id references a
          ServiceOrder in DELIVERED, so the dependency direction runs from a
          child record up to a work order rather than between two peer aggregates.
        test_recipe:
          setup:
            - "A store at clock 2026-09-01T00:00Z, a boat unit, a member, a LoadingBayBooking on bay 1 and an OVERSIZE_CARRYOUT fulfilment on that booking."
            - "The linked OVERSIZE_LOADING service order is COMPLETED but deliberately not yet DELIVERED, and the bay is checked in."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_xs@x.com", full_name: "Xan Shore", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-XS", model_name: "Bay 170", unit_price_cents: 4000000, unit_condition: "NEW", hull_id_no: "HINXS0000001" }
              as: DealDeskClerk
              captures: { bu_id: $.data.id }
            - call: "POST /stores/${st_id}/service-orders"
