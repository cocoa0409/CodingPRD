          - entities.PerformanceScorecard.fields.composite_score
          - entities.PerformanceScorecard.fields.tier
          - entities.Agency.fields.current_tier
          - calculations.tier_multiplier_resolution
        distinguishing_aspect: |
          Boundary on a different metric, endpoint and precision class: with yield 1.0000,
          persistence 1.0000 and quality 0.2500 (3 flagged of 4 reviewed) the weighted
          composite is exactly 0.8500 and the tier is PLATINUM, while adding one more flagged
          document drops quality to 0.2000 and the composite to 0.8400, one ten-thousandth
          below the band, giving GOLD.
        test_recipe:
          setup:
            - "Agency ag1 is CLEARED / GOOD_STANDING with an ACTIVE contract, an ACTIVE EXCLUSIVE IN territory and both training certifications."
            - "Application a1 on the non-commissionable foundation program was submitted on 2026-08-01 with a VERIFIED PASSPORT and ran the full milestone chain to PERSISTED on 2026-08-10."
