# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Nine Difficulty Rules x >=2 instances each. Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7.
scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sampled_vs_census_play_estimation
        grounds:
          - calculations.sampled_projection
          - entities.PerformanceEvent.fields.universe_estimated_plays
        distinguishing_aspect: |
          Entity domain: PerformanceEvent. For identical play_count, the SAMPLE
          variant expands to a universe estimate (7 plays, frame 13 -> 28) while
          the census variant (MONITORING) reports the raw count unchanged (7 -> 7).
        test_recipe:
          setup:
            - "Publisher affiliate P and writer affiliate W exist and are ACTIVE"
            - "Work registered by P, one ACCEPTED publisher claim (100% ), confirmed"
            - "BROADCASTER licensee L (revenue 300_000_000_000) with an ACTIVE license covering 2026-01-01..2026-12-31"
          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "Pub One", party_type: PUBLISHER, affiliation_code: "PUB1" }
              as: ProRegistrar
              captures: { pub_id: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "Song A", registered_by_affiliate_id: "${pub_id}" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { work_id: $.data.id }
            - call: "POST /pro/works/${work_id}/share-claims"
              payload: { affiliate_id: "${pub_id}", role: PUBLISHER, collection_share_bps: 10000, interest_share_bps: 10000 }
              as: Publisher
              as_user_id: "${pub_id}"
            - call: "POST /pro/works/${work_id}/confirm"
              payload: {}
              as: ProRegistrar
            - call: "POST /pro/licensees"
              payload: { legal_name: "Radio Co", category: BROADCASTER, reported_revenue_cents: 300000000000, usage_units: 0 }
              as: ProLicensingAdmin
              captures: { lic_ee_id: $.data.id, lic_ee_ver: $.data.version }
            - call: "POST /pro/licensees/${lic_ee_id}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-12-31", expected_licensee_version: "${lic_ee_ver}" }
              as: ProLicensingAdmin
              captures: { license_id: $.data.id }
          trigger:
            - call: "POST /pro/performances"
              payload: { work_id: "${work_id}", license_id: "${license_id}", performance_date: "2026-03-10", medium: TERRESTRIAL_RADIO, daypart: DAY, source: SAMPLE, play_count: 7, frame_units_reported: 13 }
              as: RoyaltyDistributor
              captures: { sample_ev: $.data.id, sample_universe: $.data.universe_estimated_plays }
            - call: "POST /pro/performances"
              payload: { work_id: "${work_id}", license_id: "${license_id}", performance_date: "2026-03-11", medium: TERRESTRIAL_RADIO, daypart: DAY, source: MONITORING, play_count: 7 }
              as: RoyaltyDistributor
              captures: { census_universe: $.data.universe_estimated_plays }
          assert:
            - "sample_universe == 28"
            - "census_universe == 7"
            - "sample_universe != census_universe for identical play_count 7"
      - name: negotiated_settlement_vs_formula_fee
        grounds:
          - calculations.fee_engine
          - state_machines.RateDispute.NEGOTIATION_to_SETTLED
          - entities.Licensee.fields.blanket_fee_cents
        distinguishing_aspect: |
          Entity domain: Licensee (fee), distinct from PerformanceEvent above.
          The fee_engine formula yields 4_800_000_000 cents for revenue
          300_000_000_000, but after a dispute settles at an agreed fee the
          negotiated_fee_override variant pins blanket_fee_cents to the settled
          value instead of the formula result.
        test_recipe:
          setup:
            - "BROADCASTER licensee with revenue 300_000_000_000 (formula fee 4_800_000_000) holding an ACTIVE license"
          setup_api_calls:
            - call: "POST /pro/licensees"
              payload: { legal_name: "Net TV Inc", category: BROADCASTER, reported_revenue_cents: 300000000000, usage_units: 0 }
              as: ProLicensingAdmin
              captures: { l_id: $.data.id, l_ver: $.data.version, l_fee: $.data.blanket_fee_cents }
            - call: "POST /pro/licensees/${l_id}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-12-31", expected_licensee_version: "${l_ver}" }
              as: ProLicensingAdmin
              captures: { lic_id: $.data.id, lic_basis: $.data.fee_basis_cents }
            - call: "POST /pro/licenses/${lic_id}/disputes"
              payload: { opened_by_role: LICENSEE, disputed_fee_cents: 3000000000 }
              as: Licensee
              as_user_id: "${l_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /pro/disputes/${disp_id}/negotiate"
              payload: { counter_fee_cents: 3200000000 }
              as: ProLicensingAdmin
          trigger:
            - call: "POST /pro/disputes/${disp_id}/settle"
              payload: { agreed_fee_cents: 3500000000 }
              as: ProLicensingAdmin
            - call: "GET /pro/licensees/${l_id}"
              payload: {}
              as: ProLicensingAdmin
              captures: { fee_after: $.data.blanket_fee_cents }
            - call: "GET /pro/licenses/${lic_id}"
              payload: {}
              as: ProLicensingAdmin
              captures: { basis_after: $.data.fee_basis_cents }
          assert:
            - "l_fee == 4800000000 (formula variant before dispute)"
            - "fee_after == 3500000000 (negotiated override variant after settle)"
            - "basis_after == 4800000000 (license fee_basis_cents pinned at issuance is unaffected)"
            - "fee_after != l_fee"

  # =========================================================================
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fee_engine_tiered_category_formula
        grounds:
          - calculations.fee_engine
          - entities.Licensee.fields.blanket_fee_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (category, revenue, usage_units) with non-linear
          interaction — marginal tier selection on revenue, additive per-unit
          usage charge for DIGITAL_SERVICE only, and a max() against a
          category-specific minimum. A DIGITAL_SERVICE straddling its tier cap
          computes 3_260_000_000 cents from revenue 200_000_000_000 and
          5_000_000_000 streams.
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls:
            - call: "POST /pro/licensees"
              payload: { legal_name: "StreamCo", category: DIGITAL_SERVICE, reported_revenue_cents: 200000000000, usage_units: 5000000000 }
              as: ProLicensingAdmin
              captures: { d_id: $.data.id, d_fee: $.data.blanket_fee_cents }
            - call: "POST /pro/licensees"
              payload: { legal_name: "ClubCo", category: VENUE, reported_revenue_cents: 10000000000, usage_units: 400 }
              as: ProLicensingAdmin
              captures: { v_fee: $.data.blanket_fee_cents }
            - call: "POST /pro/licensees"
              payload: { legal_name: "TinyNet", category: DIGITAL_SERVICE, reported_revenue_cents: 1000000, usage_units: 1000 }
              as: ProLicensingAdmin
              captures: { t_fee: $.data.blanket_fee_cents }
          trigger:
            - call: "GET /pro/licensees/${d_id}"
              payload: {}
              as: ProLicensingAdmin
          assert:
            - "d_fee == 3260000000 (tier1 100_000_000_000*0.0175 + tier2 100_000_000_000*0.0150 + 5_000_000_000 streams * 20/10000)"
            - "v_fee == 86000000 (venue flat 0.0080 * 10_000_000_000 + 400 * 15_000)"
            - "t_fee == 10000000 (formula 17_502 floored up by the DIGITAL_SERVICE minimum)"
      - name: pool_proration_truncation_order
        grounds:
          - calculations.royalty_pool
          - calculations.royalty_allocation
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          truncate-per-license BEFORE summing, then applies ADMIN_RATE and rounds
          once. A license with fee_basis 4_800_000_000 covering 182 of 365 days
          truncates to 2_394_410_958 (not 2_394_410_959); summing first would
          shift the pool by a cent.
        test_recipe:
          setup:
            - "broadcaster licensee fee_basis 4_800_000_000 with license covering 2026-01-01..2026-06-30 (181 days? no: 181 days Jan1-Jun30 inclusive = 181; use period intersection 182 days 2026-01-01..2026-07-01)"
            - "one confirmed work with one 100% publisher claim and one accepted captured performance (credit 100.0) inside the cycle period 2026-01-01..2026-12-31"
          setup_api_calls:
            - call: "POST /pro/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ProSystemAdmin
            - call: "POST /pro/licensees"
              payload: { legal_name: "HalfYear Radio", category: BROADCASTER, reported_revenue_cents: 300000000000, usage_units: 0 }
              as: ProLicensingAdmin
              captures: { hy_id: $.data.id, hy_ver: $.data.version }
            - call: "POST /pro/licensees/${hy_id}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-07-01", expected_licensee_version: "${hy_ver}" }
              as: ProLicensingAdmin
              captures: { hy_lic: $.data.id }
            - call: "POST /pro/affiliates"
              payload: { legal_name: "Pub H", party_type: PUBLISHER, affiliation_code: "PUBH" }
              as: ProRegistrar
              captures: { ph_id: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "Song H", registered_by_affiliate_id: "${ph_id}" }
              as: Publisher
              as_user_id: "${ph_id}"
              captures: { hw_id: $.data.id }
            - call: "POST /pro/works/${hw_id}/share-claims"
              payload: { affiliate_id: "${ph_id}", role: PUBLISHER, collection_share_bps: 10000, interest_share_bps: 10000 }
              as: Publisher
              as_user_id: "${ph_id}"
            - call: "POST /pro/works/${hw_id}/confirm"
              payload: {}
              as: ProRegistrar
            - call: "POST /pro/performances"
              payload: { work_id: "${hw_id}", license_id: "${hy_lic}", performance_date: "2026-02-01", medium: TERRESTRIAL_RADIO, daypart: DAY, source: MONITORING, play_count: 100 }
              as: RoyaltyDistributor
              captures: { hw_ev: $.data.id }
            - call: "POST /pro/cycles"
              payload: { label: "2026FULL", period_start: "2026-01-01", period_end: "2026-12-31" }
              as: RoyaltyDistributor
              captures: { cyc_id: $.data.id }
            - call: "POST /pro/cycles/${cyc_id}/open"
              payload: {}
              as: RoyaltyDistributor
            - call: "POST /pro/cycles/${cyc_id}/performances/capture"
              payload: { performance_event_ids: ["${hw_ev}"] }
              as: RoyaltyDistributor
            - call: "GET /pro/cycles/${cyc_id}"
              payload: {}
              as: RoyaltyDistributor
              captures: { cyc_ver: $.data.version }
          trigger:
            - call: "POST /pro/cycles/${cyc_id}/close-collection"
              payload: { expected_cycle_version: "${cyc_ver}" }
              as: RoyaltyDistributor
              captures: { pool_amt: $.data.pool_amount_cents }
          assert:
            - "pool_amt == 2034410958 (per-license truncation of int(4800000000*182/365) = 2393424657, then *0.85 = 2034410958.45 -> 2034410958 rounded once)"
      - name: allocation_circular_residue_resolution
        grounds:
          - calculations.royalty_allocation
          - calculations.royalty_pool
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order —
          per-affiliate amounts derive from unit_value which derives from
          pool_amount_cents, but the rounded statement sum must reconcile back
          to pool_amount_cents; the scaffold pins round-per-affiliate-per-work
          first, then distributes the residue cent-by-cent by (amount DESC,
          affiliate created_at ASC). Distinct mode from (a) and (b) instances.
        test_recipe:
          setup:
            - "broadcaster fee_basis 4_800_000_000 full-year license; work X credit 100.0 with writer claim 5000 bps (ACTIVE) and publisher claim 5000 bps (affiliate SUSPENDED at distribution); work Y credit 200.0 with one publisher claim 10000 bps ACTIVE"
          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "Writer X", party_type: SONGWRITER, affiliation_code: "WRX" }
              as: ProRegistrar
              captures: { wx_id: $.data.id }
            - call: "POST /pro/affiliates"
              payload: { legal_name: "Pub X", party_type: PUBLISHER, affiliation_code: "PUBX" }
              as: ProRegistrar
              captures: { px_id: $.data.id }
            - call: "POST /pro/affiliates"
              payload: { legal_name: "Pub Y", party_type: PUBLISHER, affiliation_code: "PUBY" }
              as: ProRegistrar
              captures: { py_id: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "Song X", registered_by_affiliate_id: "${px_id}" }
              as: Publisher
              as_user_id: "${px_id}"
              captures: { workx_id: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "Song Y", registered_by_affiliate_id: "${py_id}" }
              as: Publisher
              as_user_id: "${py_id}"
              captures: { worky_id: $.data.id }
            - call: "POST /pro/works/${workx_id}/share-claims"
              payload: { affiliate_id: "${wx_id}", role: WRITER, collection_share_bps: 5000, interest_share_bps: 5000 }
              as: Songwriter
              as_user_id: "${wx_id}"
            - call: "POST /pro/works/${workx_id}/share-claims"
              payload: { affiliate_id: "${px_id}", role: PUBLISHER, collection_share_bps: 5000, interest_share_bps: 5000 }
              as: Publisher
              as_user_id: "${px_id}"
            - call: "POST /pro/works/${worky_id}/share-claims"
              payload: { affiliate_id: "${py_id}", role: PUBLISHER, collection_share_bps: 10000, interest_share_bps: 10000 }
              as: Publisher
              as_user_id: "${py_id}"
            - call: "POST /pro/works/${workx_id}/confirm"
              payload: {}
              as: ProRegistrar
            - call: "POST /pro/works/${worky_id}/confirm"
              payload: {}
              as: ProRegistrar
            - call: "POST /pro/licensees"
              payload: { legal_name: "Net B", category: BROADCASTER, reported_revenue_cents: 300000000000, usage_units: 0 }
              as: ProLicensingAdmin
              captures: { nb_id: $.data.id, nb_ver: $.data.version }
            - call: "POST /pro/licensees/${nb_id}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-12-31", expected_licensee_version: "${nb_ver}" }
              as: ProLicensingAdmin
              captures: { nb_lic: $.data.id }
            - call: "POST /pro/performances"
              payload: { work_id: "${workx_id}", license_id: "${nb_lic}", performance_date: "2026-02-01", medium: TERRESTRIAL_RADIO, daypart: DAY, source: MONITORING, play_count: 100 }
              as: RoyaltyDistributor
              captures: { evx: $.data.id }
            - call: "POST /pro/performances"
              payload: { work_id: "${worky_id}", license_id: "${nb_lic}", performance_date: "2026-02-02", medium: NETWORK_TV, daypart: PRIME, source: MONITORING, play_count: 40 }
              as: RoyaltyDistributor
              captures: { evy: $.data.id }
            - call: "POST /pro/cycles"
              payload: { label: "2026Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: RoyaltyDistributor
              captures: { cq_id: $.data.id }
            - call: "POST /pro/cycles/${cq_id}/open"
              payload: {}
              as: RoyaltyDistributor
            - call: "POST /pro/cycles/${cq_id}/performances/capture"
              payload: { performance_event_ids: ["${evx}", "${evy}"] }
              as: RoyaltyDistributor
            - call: "PATCH /pro/affiliates/${px_id}"
              payload: { status: SUSPENDED }
              as: ProRegistrar
            - call: "GET /pro/cycles/${cq_id}"
              payload: {}
              as: RoyaltyDistributor
              captures: { cq_ver: $.data.version }
          trigger:
            - call: "POST /pro/cycles/${cq_id}/close-collection"
              payload: { expected_cycle_version: "${cq_ver}" }
              as: RoyaltyDistributor
            - call: "GET /pro/cycles/${cq_id}/statements"
              payload: {}
              as: RoyaltyDistributor
              captures: { st_list: $.data }
            - call: "GET /pro/cycles/${cq_id}/pool"
              payload: {}
              as: RoyaltyDistributor
              captures: { pool_bal: $.data.balance_cents }
          assert:
            - "cycle pool_amount_cents == 1006027397 (90/365 proration of the 4_800_000_000 fee basis, admin deducted)"
            - "statement for affiliate ${wx_id} gross_amount_cents == 335342466 (work X writer 5000 bps of 100.0/(100.0+200.0) of pool, round_half_up)"
            - "statement for affiliate ${py_id} gross_amount_cents == 670684931 (work Y full share = pool * 200.0/300.0)"
            - "statement for ${px_id} has unclaimed_amount_cents == 335342465 (SUSPENDED affiliate routed to pool; absorbs the -1 cent negative residue as a larger-amount statement per the pinned clawback order)"
            - "pool_bal == 335342465"
            - "sum of all statement gross == cycle pool_amount_cents (335342466 + 335342465 + 670684931 == 1006027397; reconciliation closes the circle)"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_negotiation_court_cycle
        grounds:
          - state_machines.RateDispute.NEGOTIATION_to_RATE_COURT
          - state_machines.RateDispute.RATE_COURT_to_NEGOTIATION
          - state_machines.RateDispute.NEGOTIATION_to_NEGOTIATION
        distinguishing_aspect: |
          Entity: RateDispute. Cyclic shape — NEGOTIATION loops on itself per
          counter-offer, escalates to RATE_COURT, and a DISMISSED court case
          returns the dispute to NEGOTIATION (rounds increment on every loop).
        test_recipe:
          setup:
            - "licensee with ACTIVE license and an OPEN dispute"
          setup_api_calls:
            - call: "POST /pro/licensees"
              payload: { legal_name: "Cycle Co", category: VENUE, reported_revenue_cents: 10000000000, usage_units: 400 }
              as: ProLicensingAdmin
              captures: { c_id: $.data.id, c_ver: $.data.version }
            - call: "POST /pro/licensees/${c_id}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-12-31", expected_licensee_version: "${c_ver}" }
              as: ProLicensingAdmin
              captures: { c_lic: $.data.id }
            - call: "POST /pro/licenses/${c_lic}/disputes"
              payload: { opened_by_role: LICENSEE, disputed_fee_cents: 70000000 }
              as: Licensee
              as_user_id: "${c_id}"
              captures: { cd_id: $.data.id }
            - call: "POST /pro/disputes/${cd_id}/negotiate"
              payload: { counter_fee_cents: 75000000 }
              as: ProLicensingAdmin
          trigger:
            - call: "POST /pro/disputes/${cd_id}/negotiate"
              payload: { counter_fee_cents: 78000000 }
              as: Licensee
              as_user_id: "${c_id}"
              captures: { rounds_2: $.data.negotiation_rounds }
            - call: "POST /pro/disputes/${cd_id}/escalate"
              payload: {}
              as: Licensee
              as_user_id: "${c_id}"
              captures: { case_id: $.data.id }
            - call: "POST /pro/rate-court-cases/${case_id}/dismiss"
              payload: {}
              as: RateCourtOfficer
            - call: "GET /pro/disputes/${cd_id}"
              payload: {}
              as: ProLicensingAdmin
              captures: { back_status: $.data.status, rounds_3: $.data.negotiation_rounds }
          assert:
            - "rounds_2 == 2 (OPEN->NEGOTIATION then NEGOTIATION->NEGOTIATION)"
            - "back_status == NEGOTIATION after RATE_COURT dismissal (cycle closes)"
            - "rounds_3 == 3"
      - name: work_registration_conflict_cycle
        grounds:
          - state_machines.Work.REGISTERED_to_IN_CONFLICT
          - state_machines.Work.IN_CONFLICT_to_REGISTERED
          - state_machines.ShareClaim.ACCEPTED_to_DISPUTED
        distinguishing_aspect: |
          Entity: Work (distinct from RateDispute). Cyclic shape —
          REGISTERED -> IN_CONFLICT on over-claim, back to REGISTERED when a
          revocation restores the aggregate to <= 10000 bps, and a later claim
          can flip it IN_CONFLICT again; claims cycle ACCEPTED <-> DISPUTED.
        test_recipe:
          setup:
            - "work with one ACCEPTED 6000-bps publisher claim (aggregate 6000)"
          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "Pub A", party_type: PUBLISHER, affiliation_code: "PUBA" }
              as: ProRegistrar
              captures: { pa_id: $.data.id }
            - call: "POST /pro/affiliates"
              payload: { legal_name: "Pub B", party_type: PUBLISHER, affiliation_code: "PUBB" }
              as: ProRegistrar
              captures: { pb_id: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "Song C", registered_by_affiliate_id: "${pa_id}" }
              as: Publisher
              as_user_id: "${pa_id}"
              captures: { cw_id: $.data.id }
            - call: "POST /pro/works/${cw_id}/share-claims"
              payload: { affiliate_id: "${pa_id}", role: PUBLISHER, collection_share_bps: 6000, interest_share_bps: 6000 }
              as: Publisher
              as_user_id: "${pa_id}"
              captures: { claim_a: $.data.id }
          trigger:
            - call: "POST /pro/works/${cw_id}/share-claims"
              payload: { affiliate_id: "${pb_id}", role: PUBLISHER, collection_share_bps: 5000, interest_share_bps: 5000 }
              as: Publisher
              as_user_id: "${pb_id}"
              captures: { claim_b: $.data.id }
            - call: "GET /pro/works/${cw_id}"
              payload: {}
              as: ProRegistrar
              captures: { st_conflict: $.data.status, agg_conflict: $.data.aggregate_interest_bps }
            - call: "POST /pro/share-claims/${claim_b}/revoke"
              payload: {}
              as: Publisher
              as_user_id: "${pb_id}"
            - call: "GET /pro/works/${cw_id}"
              payload: {}
              as: ProRegistrar
              captures: { st_back: $.data.status, agg_back: $.data.aggregate_interest_bps }
          assert:
            - "st_conflict == IN_CONFLICT and agg_conflict == 6000 (DISPUTED claim B is excluded from the aggregate; the conflict flag, not the sum, marks the over-claim)"
            - "st_back == REGISTERED and agg_back == 6000 (cycle IN_CONFLICT -> REGISTERED once the DISPUTED claim is revoked and the aggregate is clean)"

  # =========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >=3 and >=2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: rate_court_decision_four_hop_cascade
        grounds:
          - state_machines.RateCourtCase.HEARING_to_DECIDED
          - state_machines.RateDispute.RATE_COURT_to_SETTLED
          - state_machines.License.DISPUTED_to_ACTIVE
        distinguishing_aspect: |
          Depth-4 chain from the decide trigger: RateCourtCase -> DECIDED
          causes RateDispute RATE_COURT -> SETTLED (settled_fee copied), which
          causes License DISPUTED -> ACTIVE, which causes
          Licensee.blanket_fee_cents := adjudicated fee. Each hop is caused by
          the previous hop, not by the original POST.
        test_recipe:
          setup:
            - "licensee (broadcaster, formula fee 4_800_000_000) with ACTIVE license, dispute escalated to a court case in HEARING"
          setup_api_calls:
            - call: "POST /pro/licensees"
              payload: { legal_name: "Cascade BC", category: BROADCASTER, reported_revenue_cents: 300000000000, usage_units: 0 }
              as: ProLicensingAdmin
              captures: { k_id: $.data.id, k_ver: $.data.version }
            - call: "POST /pro/licensees/${k_id}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-12-31", expected_licensee_version: "${k_ver}" }
              as: ProLicensingAdmin
              captures: { k_lic: $.data.id }
            - call: "POST /pro/licenses/${k_lic}/disputes"
              payload: { opened_by_role: LICENSEE, disputed_fee_cents: 4000000000 }
              as: Licensee
              as_user_id: "${k_id}"
