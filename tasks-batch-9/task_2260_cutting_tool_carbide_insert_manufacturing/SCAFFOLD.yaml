  - method: POST
    path: "/tooling/tool-products/{productId}/release"
    description: "Release a product in QUALIFICATION to the catalog; requires an APPROVED dossier, a non-null tool_life_index and revision pins that match the current grade, geometry and coating revisions. A RESTRICTED product must be repinned (which returns it to QUALIFICATION) before it can be released again."
    roles: [QualityApprover]
    code: 200
    output: ToolProduct
    side_effects: ["release_status=QUALIFICATION -> RELEASED", "supply_status=UNAVAILABLE -> STOCKED for CATALOG products and UNAVAILABLE -> MAKE_TO_ORDER for SPECIAL products", "engineering_lead_time_days and expedite_eligible recomputed", "grade.qualified_product_count incremented", "version bumped"]

