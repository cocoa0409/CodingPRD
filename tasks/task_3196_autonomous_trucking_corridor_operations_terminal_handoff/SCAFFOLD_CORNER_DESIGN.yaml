              payload: {}
              as: CarrierDispatcher
            - call: "POST /api/terminals/${t_phx}/service-windows"
              payload: { run_plan_id: "${rp_id}", service_type: "HANDOFF_OUTBOUND", window_start_minute: 100, window_end_minute: 160, handoff_duration_minutes: 60, buffer_minutes: 0, yield_to_transit: false }
