  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Priority 1: a request without X-User-Role fails before any other check, even when the body would be valid."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6027", description: "b", family: "BEARING", list_price_cents: 1000 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and HTTP 400"

      - name: not_found_beats_state_check
        claim_type: priority_ordering
        grounds:
          - "validations[priority=3]"
          - "validations[priority=5]"
          - "errors[ERR_ORDER_NOT_FOUND]"
        distinguishing_aspect: "Confirm against a nonexistent order id returns the 404 existence error (p3), never a state error — existence precedes state even though the confirm endpoint has a state precondition."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /motion/orders/00000000-0000-0000-0000-000000000000/confirm"
              payload: {}
              as: CounterSalesRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ORDER_NOT_FOUND and HTTP 404"

      - name: contract_fixed_basis_requires_fixed_price
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_CONTRACT_FIXED_PRICE_MISSING]"
        distinguishing_aspect: "CONTRACT_FIXED without fixed_unit_price_cents fails at activate time (conditional required field)."
        test_recipe:
          setup: ["customer exists; DRAFT contract CONTRACT_FIXED with no fixed price"]
          setup_api_calls:
            - call: "POST /motion/customers"
              payload: { name: "Fixed Plant", credit_limit_cents: 1000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/contracts"
              payload: { customer_id: "${c_id}", family: "BELT", price_basis: "CONTRACT_FIXED", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ContractAdministrator
              captures: { ct_id: $.data.id }
          trigger:
            - call: "POST /motion/contracts/${ct_id}/activate"
              payload: {}
              as: ContractAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CONTRACT_FIXED_PRICE_MISSING (400); contract stays DRAFT"

      - name: consumption_qty_exceeds_remaining
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_CONSUMPTION_EXCEEDS_REMAINING]"
        distinguishing_aspect: "qty == remaining succeeds while qty == remaining + 1 fails — the guard is a strict inequality on remaining_qty after prior consumption."
        test_recipe:
          setup: ["agreement consigned 5; consumption qty 3 already reported (remaining 2)"]
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6028", description: "b", family: "BEARING", list_price_cents: 1000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "REM-17", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Remaining Plant", credit_limit_cents: 1000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${p_id}", on_hand_qty: 5, factory_lead_time_days: 5 }
              as: BranchManager
            - call: "POST /motion/consignment-agreements"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}", product_id: "${p_id}", consigned_qty: 5 }
              as: ContractAdministrator
              captures: { a_id: $.data.id }
            - call: "POST /motion/consignment-agreements/${a_id}/consumptions"
              payload: { qty: 3 }
              as: CustomerPlant
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /motion/consignment-agreements/${a_id}/consumptions"
              payload: { qty: 3 }
              as: CustomerPlant
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
            - call: "POST /motion/consignment-agreements/${a_id}/consumptions"
              payload: { qty: 2 }
              as: CustomerPlant
              as_user_id: "${c_id}"
              captures: { cons_id: $.data.id }
          assert:
            - "qty 3 (> remaining 2): err == ERR_CONSUMPTION_EXCEEDS_REMAINING (409)"
            - "qty 2 (== remaining) succeeds; ConsignmentAgreement.${a_id}.remaining_qty == 0"

      - name: claim_must_reference_exactly_one_source
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_CLAIM_REFERENCE_INVALID]"
        distinguishing_aspect: "Polymorphic reference guard: supplying neither order_line_id nor consumption_id (or both) is a 400 constraint violation; with no FKs present, existence checks cannot pre-empt it."
        test_recipe:
          setup: ["product exists"]
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6029", description: "b", family: "BEARING", list_price_cents: 1000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /motion/warranty-claims"
              payload: { product_id: "${p_id}", failure_mode: "FATIGUE", operating_hours: 10, qty: 1 }
              as: WarrantyAnalyst
              as_user_id: "wa-x"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CLAIM_REFERENCE_INVALID (400)"

      - name: claim_qty_exceeds_source_line_qty
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_CLAIM_QTY_EXCEEDS_SOURCE]"
        distinguishing_aspect: "Claim qty 3 against a shipped 2-unit line is rejected; the claim ceiling is the source quantity."
        test_recipe:
          setup: ["shipped order line qty 2"]
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6030", description: "b", family: "BEARING", list_price_cents: 1000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "QTY-18", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Qty Plant", credit_limit_cents: 1000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${p_id}", on_hand_qty: 5, factory_lead_time_days: 5 }
              as: BranchManager
              captures: { bs_id: $.data.id }
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { o_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty: 2 }
              as: CounterSalesRep
              captures: { l_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/confirm"
              payload: {}
              as: CounterSalesRep
            - call: "POST /motion/order-lines/${l_id}/reserve"
              payload: { branch_stock_id: "${bs_id}", qty: 2 }
              as: CounterSalesRep
            - call: "POST /motion/order-lines/${l_id}/allocate"
              payload: {}
              as: BranchManager
            - call: "POST /motion/order-lines/${l_id}/ship"
              payload: {}
              as: BranchManager
          trigger:
            - call: "POST /motion/warranty-claims"
              payload: { product_id: "${p_id}", order_line_id: "${l_id}", failure_mode: "FATIGUE", operating_hours: 10, qty: 3 }
              as: WarrantyAnalyst
              as_user_id: "wa-y"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CLAIM_QTY_EXCEEDS_SOURCE (409)"

      - name: agreement_amend_below_consumed_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_CONSIGNMENT_QTY_BELOW_CONSUMED]"
          - "concurrency_rules[agreement-amend-stale-version]"
        distinguishing_aspect: "PATCH consigned_qty below already-consumed_qty violates referential integrity even with the correct OCC version."
