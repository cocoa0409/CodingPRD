        grounds:
          - "roles.MerchantOperator.shared_operations"
          - "endpoints[GET /delivery-orders]"
          - "endpoints[GET /delivery-orders/{order_id}]"
          - "errors.ERR_NOT_RESOURCE_OWNER"
        distinguishing_aspect: >-
          Row-level scoping is applied to reads as well as writes and it is applied even when the caller
          asks for everything: an unfiltered listing as M1 returns only M1's order, the same listing as
          PlatformAdmin returns both, and a direct read of M2's order by M1 is 403 ERR_NOT_RESOURCE_OWNER
          rather than a 404 that would leak whether the row exists.
