            - "GET /mill/kiln-charges/{charge_a} still shows remaining_dry_bf == 2972.50 - the void did not give the 6000 bf back."
            - "GET /mill/byproduct-batches/{sawdust_batch} still shows sold_tons == 1.00 and available_tons == 0.20."

      - name: third_redry_cycle_rejected_at_limit
        claim_type: violation_to_error
        grounds: ["validations[priority 23]", "constants.MAX_REDRY_CYCLES"]
        distinguishing_aspect: "Two redry cycles are allowed and a third stress test that still fails the gradient band returns 409 instead of extending the charge a third time; the charge stays in CONDITIONING rather than moving to REDRY."
        test_recipe:
          setup: ["A RED_OAK charge in CONDITIONING (5800 + 3900 bf allocated, planned end 2026-08-16T01:00:00.000Z)."]
          setup_api_calls:
