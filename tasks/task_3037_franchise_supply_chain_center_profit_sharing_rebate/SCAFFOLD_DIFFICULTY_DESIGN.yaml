            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${prod_id}", store_tier: "STANDARD", markup_pct: 0.2, min_quantity: 1, effective_from: "2027-06-01T00:00:00Z", effective_until: "2026-06-01T00:00:00Z", expected_center_version: "${center_v_fresh2}" }
