        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=4]
        distinguishing_aspect: "A Shipper calling decide on a NONEXISTENT complaint id gets ERR_FORBIDDEN_ROLE (priority 2), not ERR_RATE_COMPLAINT_NOT_FOUND (priority 4) — role authorization is evaluated before path existence."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /stb/rate-complaints/00000000-0000-4000-8000-000000000000/decide"
              payload: { outcome: "UPHELD" }
              as: Shipper
              as_user_id: "shp-ada"
