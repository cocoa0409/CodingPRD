            - call: "POST /valet/statements/${st_id}/issue"
              payload: {}
              as: BillingAnalyst
              as_user_id: "analyst-issuer"
          assert:
            - "HTTP 200 with MonthlyStatement.${st_id}.gross_passthrough_cents == 3962 (1981 + 1981), NOT 3961 and NOT 3960"
            - "the move_in bound is inclusive: 2026-09-14 through 2026-09-30 is 17 billable days for both ${r1_id} and ${r2_id}"
            - "MonthlyStatement.${st_id}.missed_service_credit_cents == 475 (round_half_up(3962 * 1200 / 10000) = round(475.44))"
            - "MonthlyStatement.${st_id}.property_revenue_share_cents == 523 (round_half_up(3487 * 1500 / 10000) = round(523.05))"
            - "MonthlyStatement.${st_id}.net_due_from_property_cents == 2964 == 3962 - 475 - 523"

      - name: partial_night_counts_as_half_a_missed_night_in_the_sla_ratio
