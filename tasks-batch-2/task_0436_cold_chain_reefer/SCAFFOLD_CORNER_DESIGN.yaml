              as: PlatformAdmin
              captures: { lid: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${cid}", asset_tag: "RU-C27", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-c27"
              captures: { uid: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${cid}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-c27"
