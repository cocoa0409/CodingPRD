          specialty is constrained to PRIMARY_CARE / CARDIOLOGY / ORTHOPEDICS /
          ONCOLOGY, all four of which key the TAIL_PREMIUM_RATE_BPS and BENCHMARKS
          tables; an unrecognised member is refused with ERR_INVALID_REQUEST rather
          than stored and later crashing a table lookup.
        test_recipe:
