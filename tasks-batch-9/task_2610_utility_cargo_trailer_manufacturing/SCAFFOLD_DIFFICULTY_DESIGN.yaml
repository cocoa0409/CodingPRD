  - rule_id: non_linear_state_machine
    instances:
      - name: model_certification_cycle_with_revision_round
        grounds:
          - state_machines.TrailerModel.CERTIFIED_to_IN_ENGINEERING_REVIEW
          - state_machines.TrailerModel.IN_ENGINEERING_REVIEW_to_DRAFT
          - state_machines.TrailerModel.IN_ENGINEERING_REVIEW_to_CERTIFIED
          - entities.TrailerModel.fields.revision_round
          - validations[priority=52]
        distinguishing_aspect: |
          TrailerModel is the cyclic dimension: the machine re-enters IN_ENGINEERING_REVIEW from
          CERTIFIED, walks back to DRAFT with revision_round incremented, and reaches CERTIFIED a second
          time, while a decision on an already CERTIFIED model is still refused with ERR_MODEL_STATE_INVALID
          - a loop with a guard, not a linear ladder and not the WarrantyClaim counter loop.
        test_recipe:
          setup:
            - "Empty DB, clock at 2026-08-01T00:00:00Z."
            - "TrailerModel TA-7X14 already CERTIFIED once (revision_round 0, certified_gvwr_lbs 6300)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models"
              payload: { model_code: "TA-7X14", description: "Tandem 7x14 cargo", axle_count: 2, axle_rating_lbs: 3500, design_braked_axle_count: 1, tire_load_rating_lbs: 1820, frame_design_code: "TA", frame_design_rated_lbs: 7200, coupler_rating_lbs: 7500, overall_width_in: 78.5, nominal_length_mm: 4267, nominal_width_mm: 2134, base_curb_weight_lbs: 1980, base_dealer_price_cents: 489900 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { model_id: $.data.id }
            - call: "POST /trailer-models/${model_id}/certification-submission"
              payload: { engineering_note: "initial GVWR package" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models/${model_id}/certification-decision"
              payload: { decision: "CERTIFIED", decision_note: "capacities verified" }
              as: CertificationOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /trailer-models/${model_id}/certification-submission"
              payload: { engineering_note: "engineering change: heavier coupler" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models/${model_id}/certification-decision"
              payload: { decision: "REVISION_REQUESTED", decision_note: "tire circuit not sourced" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /trailer-models/${model_id}/certification-submission"
              payload: { engineering_note: "revised package" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models/${model_id}/certification-decision"
              payload: { decision: "CERTIFIED", decision_note: "revision accepted" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /trailer-models/${model_id}/certification-decision"
              payload: { decision: "CERTIFIED", decision_note: "duplicate decision" }
              as: CertificationOfficer
              as_user_id: "co-1"
          assert:
            - "TrailerModel.${model_id}.certification_status == CERTIFIED"
            - "TrailerModel.${model_id}.revision_round == 1"
            - "TrailerModel.${model_id}.certified_gvwr_lbs == 6300"
            - "TrailerModel.${model_id}.provisional_gvwr_lbs == 7000"
            - "The final duplicate certification-decision call returns 409 ERR_MODEL_STATE_INVALID and leaves revision_round at 1"
            - "TrailerModel.${model_id}.version == 6  # create + 2 submissions + 3 accepted writes; the rejected 6th call does not bump it"
