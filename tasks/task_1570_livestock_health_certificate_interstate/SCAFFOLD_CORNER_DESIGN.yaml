            - "limit=1 page 0: exactly 1 item, total_count == 2, has_more == true"
            - "limit=1 offset=1: exactly 1 item, total_count == 2, has_more == false"
            - "Filter destination_state_code=TX + vet_id returns exactly ${cert_tx} and not ${cert_ks}"

      - name: traceback_reverse_reachability_lists
        claim_type: listing
        grounds:
          - entities.TestRecord.fields.premises_id
          - entities.MovementPermit.fields.certificate_id
          - entities.MovementRecord.fields.permit_id
          - entities.TransmissionAudit.fields.certificate_id
          - entities.QuarantineOrder.fields.premises_id
        distinguishing_aspect: |
          Traceback support: every FK has a reverse GET. One end-to-end chain
          (test -> certificate -> permit -> record -> transmission) is listed
