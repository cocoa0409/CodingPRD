            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-259", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
