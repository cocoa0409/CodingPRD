    roles: [Advertiser]
    code: 200
    input: []
    output: AdCreative
    side_effects: ["review_status DRAFT -> SCREENING", "destination_status NOT_CHECKED -> DESTINATION_PENDING", "increments AdCreative.version by 1"]

  - method: POST
