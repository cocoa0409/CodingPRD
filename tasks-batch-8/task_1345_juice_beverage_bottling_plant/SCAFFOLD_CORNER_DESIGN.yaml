            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-RI", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /v1/bottling-lines", payload: { line_code: "L-RI", supported_container_types: ["PET_473"], nominal_cpm: 200 }, as: PlantManager, captures: { line_id: $.data.id } }
            - { call: "POST /v1/warehouse-zones", payload: { zone_code: "Z-RI", temperature_class: "AMBIENT", pallet_capacity: 50 }, as: PlantManager, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 1000, unit_price_cents: 150 }, as: ProductionPlanner, captures: { run_id: $.data.id, run_v: $.data.version } }
          trigger:
            - { call: "POST /v1/production-runs/${run_id}/start", payload: {}, as: ProductionPlanner, captures: { e1: $.data.error_id } }
            - { call: "POST /v1/production-runs/${run_id}/complete", payload: { actual_units_filled: 100, avg_fill_ml: 473, warehouse_zone_id: "${zone_id}" }, as: ProductionPlanner, captures: { e2: $.data.error_id } }
            - { call: "POST /v1/production-runs/${run_id}/finalize-invoice", payload: {}, as: FinanceClerk, captures: { e3: $.data.error_id } }
            - { call: "POST /v1/production-runs/${run_id}/schedule", payload: { batch_id: "${batch_id}", line_id: "${line_id}", scheduled_start_at: "2026-08-11T08:00:00Z", scheduled_end_at: "2026-08-11T12:00:00Z", expected_production_run_version: "${run_v}" }, as: ProductionPlanner, captures: { e4: $.data.error_id } }
            - { call: "POST /v1/production-runs/${run_id}/confirm", payload: {}, as: ProductionPlanner, captures: { ok_conf: $.data.production_status } }
            - { call: "POST /v1/production-runs/${run_id}/confirm", payload: {}, as: ProductionPlanner, captures: { e5: $.data.error_id } }
            - { call: "POST /v1/production-runs/${run_id}/cancel", payload: {}, as: ProductionPlanner, captures: { ok_canc: $.data.production_status } }
            - { call: "POST /v1/production-runs/${run_id}/cancel", payload: {}, as: ProductionPlanner, captures: { e6: $.data.error_id } }
            - { call: "POST /v1/production-runs/${run_id}/confirm", payload: {}, as: ProductionPlanner, captures: { e7: $.data.error_id } }
          assert:
            - "e1 == ERR_RUN_STATE_INVALID (start from QUOTED), e2 == ERR_RUN_STATE_INVALID (complete from QUOTED), e3 == ERR_RUN_STATE_INVALID (finalize while NOT_INVOICED/QUOTED), e4 == ERR_RUN_STATE_INVALID (schedule from QUOTED)"
            - "ok_conf == CONFIRMED; e5 == ERR_RUN_STATE_INVALID (confirm not idempotent)"
            - "ok_canc == CANCELLED; e6 == ERR_RUN_STATE_INVALID and e7 == ERR_RUN_STATE_INVALID (CANCELLED terminal)"

