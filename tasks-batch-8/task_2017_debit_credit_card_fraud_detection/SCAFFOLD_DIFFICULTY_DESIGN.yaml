            - "Loss over the txn: provisional 110000 (= round(200000*0.55)), booked by user acct-1, finalized at 110000 -> tier HIGH (rolling 110000 >= 100000)"
            - "Recovery filing claimed 110000 filed by rec-1 (!= booked_by acct-1), ACCEPTED"
