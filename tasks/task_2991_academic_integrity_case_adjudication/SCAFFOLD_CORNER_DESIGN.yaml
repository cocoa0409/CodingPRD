      - name: five_hop_cascade_layer_corner_stub
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Sanction
          - state_machines.Case
          - entities.Student
          - entities.Department
        distinguishing_aspect: |
          The impose cascade must run all five hops end-to-end and in order, reaching a sibling case's
          PROPOSED sanction, and the appeal-overturn cascade must unwind four of them.
        excluded_because:
          difficulty_instance: "transitive_cascade / impose_cascade_five_hops_reaches_a_sibling_case_and_vacates_its_proposal"
          rationale: |
            That instance and its sibling
            transitive_cascade / appeal_overturn_cascade_four_hops_unwinds_the_notation_and_the_sibling_band
            already assert each hop's observable with pinned literals, including the ordering dependency
            that makes hop 4 read the values hop 3 wrote.

      - name: dual_variant_calculation_layer_corner_stub
        claim_type: dual_variant_calculation
        grounds:
          - calculations.sanction_ladder_placement
          - calculations.department_reporting_rate
        distinguishing_aspect: |
          Both dual-variant calculations must diverge on the same inputs, select the correct variant from
          the request, and reconcile - the ladder on formal_full versus informal_capped, the reporting
          rate on submitted_basis versus adjudicated_basis.
        excluded_because:
          difficulty_instance: "dual_variant_calc / ladder_placement_formal_and_informal_variants_yield_disjoint_bands"
          rationale: |
            That instance plus
            dual_variant_calc / department_reporting_rate_submitted_basis_versus_adjudicated_basis
            pin both variants' outputs on identical inputs and assert the selection rule, which is
            exactly what this layer requires.

      - name: derived_field_reconciliation_layer_corner_stub
        claim_type: derived_field_reconciliation
        grounds:
          - invariants
          - entities.Student.fields.active_sanction_points
          - entities.Department.fields.open_case_count
        distinguishing_aspect: |
          Every derived counter must be recomputable from its base rows at any point, including after a
          compensating operation, so no counter may drift.
        excluded_because:
          difficulty_instance: "compensating_invariant / student_points_and_department_open_case_count_return_to_their_pre_operation_values"
          rationale: |
            That instance snapshots every derived counter, runs the operation and its compensation, and
            asserts each counter returns to its pre-operation value, with
            compensating_invariant / room_minutes_ledger_is_released_exactly_on_cancel_but_never_on_adjourn
            covering the ledger that must NOT be reconciled on adjourn.

  - section: consistency_model
    instances:
      - name: every_write_is_immediately_visible_to_the_next_read_with_no_settling_period
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - invariants
          - entities.Department.fields.open_case_count
          - entities.Student.fields.active_sanction_points
        distinguishing_aspect: |
          The declared consistency model is `immediate`, so there is no eventual-consistency window and
          no reconciliation job: the read that directly follows an accepted write already reflects every
          derived field the write touched, several entities deep. Imposing one sanction updates
          Sanction.status, Case.notation_status, Case.adjudication_status,
          Student.active_sanction_points, Student.standing and Department.open_case_count, and all six are
          visible on the very next GET without any intervening call, retry or clock advance.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; ENGL, reporter Rita trained, chair Cora trained, pan1/pan2/pan3, ROOM-A, student Sam"
            - "a FORMAL case decided RESPONSIBLE at 2026-08-20T10:00:00Z with a rank-5 recommendation, and a PROPOSED rank-5 DISCIPLINARY_PROBATION sanction"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Rita Reporter", email: "rita@u.edu" }
              as: IntegrityOfficer
              captures: { reporter_id: $.data.id }
            - call: "POST /integrity/faculty-members/${reporter_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-01-15T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Cora Chair", email: "cora@u.edu" }
              as: IntegrityOfficer
              captures: { chair_id: $.data.id }
            - call: "POST /integrity/faculty-members/${chair_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-02-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Pat Panel One", email: "pan1@u.edu" }
              as: IntegrityOfficer
              captures: { pan1_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Pia Panel Two", email: "pan2@u.edu" }
              as: IntegrityOfficer
              captures: { pan2_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Pim Panel Three", email: "pan3@u.edu" }
              as: IntegrityOfficer
              captures: { pan3_id: $.data.id }
            - call: "POST /integrity/hearing-rooms"
              payload: { code: "ROOM-A", seat_capacity: 12, buffer_minutes: 30, sessions_per_day_cap: 2 }
              as: IntegrityOfficer
              captures: { room_a_id: $.data.id }
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG", class_year: 3 }
              as: IntegrityOfficer
              captures: { student_id: $.data.id }
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "${dept_engl_id}", instructor_id: "${reporter_id}", course_code: "ENGL-201", term_code: "2026FA", grade_components: [{ code: "ESSAY", max_points: 200, weight_pct: 40 }, { code: "MIDTERM", max_points: 70, weight_pct: 30 }, { code: "PROJECT", max_points: 90, weight_pct: 20 }, { code: "FINAL", max_points: 180, weight_pct: 10 }] }
              as: IntegrityOfficer
              captures: { offering_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_id}", alleged_violation_type: "PLAGIARISM", narrative: "Essay reuses an uncited source.", incident_at: "2026-07-20T00:00:00Z", component_scores: [{ code: "ESSAY", earned_points: 156 }, { code: "MIDTERM", earned_points: 68 }, { code: "PROJECT", earned_points: 56 }, { code: "FINAL", earned_points: 113 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_id}", kind: "SIMILARITY_REPORT", sha256: "1111111111111111111111111111111111111111111111111111111111111111", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_id}/triage"
              payload: { decision: "ACCEPT", triage_note: "Sufficient evidence." }
              as: IntegrityOfficer
            - call: "POST /integrity/cases"
              payload: { report_id: "${report_id}" }
              as: IntegrityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /integrity/cases/${case_id}/pathway"
              payload: { pathway: "FORMAL" }
              as: IntegrityOfficer
            - call: "POST /integrity/cases/${case_id}/notifications"
              payload: { kind: "ALLEGATION_NOTICE", response_window_days: 5 }
              as: IntegrityOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /integrity/notifications/${notice_id}/acknowledge"
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /integrity/hearing-sessions"
              payload: { case_id: "${case_id}", room_id: "${room_a_id}", chair_id: "${chair_id}", panelist_ids: ["${pan1_id}", "${pan2_id}", "${pan3_id}"], start_at: "2026-08-20T10:00:00Z", end_at: "2026-08-20T11:30:00Z" }
              as: IntegrityOfficer
              captures: { session_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T10:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/hearing-sessions/${session_id}/convene"
              as: PanelChair
              as_user_id: "${chair_id}"
            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan1_id}", verdict: "RESPONSIBLE", severity_recommendation: 5 }
              as: PanelChair
              as_user_id: "${chair_id}"
            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan2_id}", verdict: "RESPONSIBLE", severity_recommendation: 5 }
              as: PanelChair
              as_user_id: "${chair_id}"
            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan3_id}", verdict: "NOT_RESPONSIBLE" }
              as: PanelChair
              as_user_id: "${chair_id}"
            - call: "POST /integrity/hearing-sessions/${session_id}/decide"
              as: PanelChair
              as_user_id: "${chair_id}"
            - call: "GET /integrity/cases/${case_id}"
              as: IntegrityOfficer
              captures: { case_v_decided: $.data.version }
            - call: "POST /integrity/sanctions"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v_decided}", kind: "DISCIPLINARY_PROBATION", ladder_rank: 5, effective_from: "2026-08-21T00:00:00Z" }
              as: IntegrityOfficer
              captures: { sanction_id: $.data.id }
            - call: "GET /integrity/departments/${dept_engl_id}"
              as: IntegrityOfficer
              captures: { open_before: $.data.open_case_count }
            - call: "GET /integrity/students/${student_id}"
              as: IntegrityOfficer
              captures: { points_before: $.data.active_sanction_points }
          trigger:
            - call: "POST /integrity/sanctions/${sanction_id}/impose"
              as: IntegrityOfficer
            - call: "GET /integrity/sanctions/${sanction_id}"
              as: IntegrityOfficer
            - call: "GET /integrity/cases/${case_id}"
              as: IntegrityOfficer
            - call: "GET /integrity/students/${student_id}"
              as: IntegrityOfficer
              captures: { points_after_impose: $.data.active_sanction_points }
            - call: "GET /integrity/departments/${dept_engl_id}"
              as: IntegrityOfficer
              captures: { open_after_impose: $.data.open_case_count }
            - call: "POST /integrity/cases/${case_id}/notation/post"
              as: RegistrarOfficer
            - call: "POST /integrity/sanctions/${sanction_id}/complete"
              as: IntegrityOfficer
            - call: "GET /integrity/students/${student_id}"
              as: IntegrityOfficer
              captures: { points_after_complete: $.data.active_sanction_points }
            - call: "GET /integrity/departments/${dept_engl_id}"
              as: IntegrityOfficer
              captures: { open_after_complete: $.data.open_case_count }
          assert:
            - "${open_before} == 1 and ${points_before} == 0 - a PROPOSED sanction contributes no points"
            - "the impose call returns HTTP 200, and the IMMEDIATELY following GET /integrity/sanctions/${sanction_id} already reports status == IMPOSED with no retry"
            - "the next GET /integrity/cases/${case_id} already reports adjudication_status == SANCTION_IMPOSED and notation_status == PENDING_POSTING (rank 5 >= NOTATION_MIN_RANK 4)"
            - "${points_after_impose} == 5 and the same read reports Student.${student_id}.standing == PROBATION - the derived standing is recomputed inside the write, not by a later job"
            - "${open_after_impose} == 1 - imposing a sanction does not close the case, so the department counter has not moved yet"
            - "after notation/post the next read reports Case.${case_id}.notation_status == POSTED and Student.${student_id}.transcript_notation == POSTED"
            - "after complete the next read reports Sanction.${sanction_id}.status == COMPLETED, Case.${case_id}.adjudication_status == CLOSED, and Case.${case_id}.expungement_eligible_at == 2027-08-20T10:00:00Z (both completed_at and decided_at are 2026-08-20T10:00:00Z, ELIGIBILITY_DAYS[5] is 365 and MIN_POST_DECISION_DAYS is 365, so the MAX collapses to the same instant); the earlier notation/post read reported it as null because the sanction was then only IMPOSED"
            - "${points_after_complete} == 0 and Student.${student_id}.standing == GOOD_STANDING on that same read"
            - "${open_after_complete} == ${open_before} - 1 == 0 - the department counter is decremented inside the complete call"
            - "no read in this recipe ever had to be repeated to observe a value: the model is immediate, not eventual"

