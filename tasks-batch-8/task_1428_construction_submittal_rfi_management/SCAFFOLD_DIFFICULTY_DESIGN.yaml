          Category pair state vs business_fiscal: accepting an ESTIMATED (never priced)
          assessment on a project whose 1000-cent contingency could never cover the delta must
          return ERR_ASSESSMENT_NOT_PRICED (state, priority 8), not ERR_CONTINGENCY_EXHAUSTED
          (fiscal, priority 13).
        test_recipe:
          setup:
            - "Project ACTIVE with initial_contingency_cents 1000; reviewer R1; RFI answered with cost flag est 100000 -> IA ESTIMATED (provisional 135482 >> contingency)"
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "Prio1", initial_contingency_cents: 1000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
