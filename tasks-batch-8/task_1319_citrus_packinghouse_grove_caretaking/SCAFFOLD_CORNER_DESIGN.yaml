            - { call: "POST /packinghouse/groves", payload: { grower_id: "${ca1_g}", block_code: "TG1", variety: TANGERINE, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { ca1_tg: "$.data.id", ca1_tg_v: "$.data.version" } }
          trigger:
            - { call: "POST /packinghouse/groves/${ca1_gf}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 8.0, acid_pct: 1.0, juice_pct: 38.0, expected_grove_version: "${ca1_gf_v}" }, as: QualityInspector, as_user_id: "qi_ca1", captures: { ca1_t1: "$.data.id" } }
            - { call: "POST /packinghouse/groves/${ca1_tg}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.4, acid_pct: 1.0, juice_pct: 40.0, expected_grove_version: "${ca1_tg_v}" }, as: QualityInspector, as_user_id: "qi_ca1", captures: { ca1_t2: "$.data.id" } }
            - { call: "GET /packinghouse/groves/${ca1_tg}", payload: {}, as: QualityInspector, captures: { ca1_tg_v2: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${ca1_tg}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.5, acid_pct: 1.0, juice_pct: 40.0, expected_grove_version: "${ca1_tg_v2}" }, as: QualityInspector, as_user_id: "qi_ca1", captures: { ca1_t3: "$.data.id" } }
          assert:
            - "Grapefruit test ${ca1_t1}: ratio 8.0 >= 7.0, brix 8.0 >= 8.0, juice 38.0 >= 38.0 -> PASS (all three boundaries inclusive)"
