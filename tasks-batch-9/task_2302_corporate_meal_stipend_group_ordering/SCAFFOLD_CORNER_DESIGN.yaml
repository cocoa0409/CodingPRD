          assert:
            - "the duplicate group name is 409 with data.error_id == ERR_DUPLICATE_NAME"
            - "the duplicate email is 409 ERR_DUPLICATE_NAME even though the casing differs"
            - "the duplicate dock label is 409 ERR_DUPLICATE_NAME"
            - "the second 2026-08 period is 409 with data.error_id == ERR_DUPLICATE_PERIOD_MONTH"
            - "the employee-group listing still returns total_count 1"
            - "the delivery-location listing also returns total_count 1, holding only the original HQ Lobby dock"

