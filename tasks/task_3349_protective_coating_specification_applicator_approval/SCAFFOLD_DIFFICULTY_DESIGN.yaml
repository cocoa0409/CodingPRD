      - name: substitution_request_review_round_cycle
        grounds:
          - state_machines.SubstitutionRequest.SUBMITTED_to_UNDER_REVIEW
          - state_machines.SubstitutionRequest.UNDER_REVIEW_to_MORE_INFO_REQUESTED
          - state_machines.SubstitutionRequest.MORE_INFO_REQUESTED_to_SUBMITTED
          - entities.SubstitutionRequest.fields.review_round
        distinguishing_aspect: |
          SubstitutionRequest cycles SUBMITTED -> UNDER_REVIEW ->
          MORE_INFO_REQUESTED -> SUBMITTED with review_round incrementing
          1 -> 2 on the resubmit lap — a negotiation-round loop (non-linear)
          on SubstitutionRequest, a different entity from the
          ApplicatorQualification probation cycle of the sibling instance.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-09-01T00:00:00Z."
            - "VocRegulation US-FED/SPRAY_AIRLESS limit 340 ACTIVE on [2026-01-01, 2027-01-01)."
