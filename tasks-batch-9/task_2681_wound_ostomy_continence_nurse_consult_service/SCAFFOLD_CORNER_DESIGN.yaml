              payload: { expected_unit_version: "${u1_v0}" }
              as: MaterialsCoordinator
            - call: "GET /units/${u1_id}"
              payload: {}
              as: MaterialsCoordinator
              captures: { u1_v1: "$.data.version" }
            - call: "POST /support-surface-orders/${o2_id}/approve"
              payload: { expected_unit_version: "${u1_v1}" }
              as: MaterialsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: SystemOperator
