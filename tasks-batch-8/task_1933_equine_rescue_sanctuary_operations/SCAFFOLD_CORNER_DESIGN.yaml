      - name: volunteer_cannot_create_shift
        claim_type: role_exclusive_denied
        grounds: [roles.Volunteer, roles.VolunteerCoordinator]
        distinguishing_aspect: "Volunteer role calling POST /barn-shifts (VolunteerCoordinator-exclusive) is denied ERR_FORBIDDEN."
        test_recipe:
