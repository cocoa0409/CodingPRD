            - "Lease B's certify-fmv returns 200 with certified_fmv_floor_psf == 24.00, certified_fmv_ceiling_psf == 34.50, certified_base_rent_annual == 150000.00"
            - "Neither band equals the appraisal-derived [41.40, 50.60]"

      - name: suite_fmv_band_nested_clamp
        claim_type: correct_result
        grounds:
          - calculations.suite_fmv_band
        excluded_because:
          difficulty_instance: fmv_band_nested_clamp_takes_floor_and_ceiling_from_different_sources
          rationale: "That instance asserts the clamp taking its floor from the appraisal band and its ceiling from the published band in one call, with both published and appraisal literals pre-computed."

      - name: fmv_ceiling_boundary_one_cent
        claim_type: precision
        grounds:
          - calculations.suite_fmv_band
          - validations[42]
        excluded_because:
          difficulty_instance: rent_exactly_at_fmv_ceiling_accepted_one_cent_above_rejected
          rationale: "The inclusive ceiling boundary and the one-cent rejection are the entire subject of that boundary-precision instance."

      - name: ti_cost_share_rounding_order
        claim_type: precision
        grounds:
          - calculations.ti_cost_share
        excluded_because:
          difficulty_instance: ti_cost_share_round_per_line_then_sum_pinned_order
          rationale: "The round-per-line-then-sum order is pinned and asserted there against the sum-then-round alternative, which differs by one cent."

      - name: monthly_occupancy_charge_step_order
        claim_type: correct_result
        grounds:
          - calculations.monthly_occupancy_charge
        excluded_because:
          difficulty_instance: monthly_occupancy_charge_waiver_tier_keyed_on_combined_pre_waiver_total
          rationale: "The six pinned steps and the circular-looking dependency between parking, the combined total and the waiver are asserted there; this section only adds the tier boundary at exactly 5000.00."

      - name: rolling_window_ages_events_out
        claim_type: variant_divergence
        grounds:
          - calculations.referral_compliance_risk_score.variants
        excluded_because:
          difficulty_instance: tenant_risk_rolling_window_versus_strict_cumulative_divergence
          rationale: "The 365-day window aging an event out of the rolling score while the strict score retains it is asserted there across two closes; this section covers the other divergence mechanism, the cap."

      - name: effective_rent_variant_selection
        claim_type: variant_selection
        grounds:
          - calculations.effective_base_rent_annual.variants
        excluded_because:
          difficulty_instance: lease_rent_provisional_published_versus_certified_appraisal_divergence
          rationale: "Variant selection at certification and the resulting fmv_variance_pct are asserted there; the reverse switch on appraisal expiry is covered by the state_machines instance qualified_appraisal_expires_on_close_and_marks_the_lease_stale."

      - name: shared_space_aggregate_sweep
        claim_type: interval_merge
        grounds:
          - calculations.shared_space_concurrent_load
        excluded_because:
          difficulty_instance: shared_space_half_open_aggregate_capacity_sweep
          rationale: "The half-open interval semantics, the aggregate sweep over every instant and the exactly-at-capacity acceptance are all asserted there."

      - name: suite_term_turnover_buffer
        claim_type: interval_merge
        grounds:
          - calculations.suite_term_conflict
        excluded_because:
          difficulty_instance: suite_term_closed_interval_with_class_turnover_buffer
          rationale: "The class-dependent symmetric buffer applied to closed term intervals is asserted there for both IMAGING/PROCEDURE (buffered) and STANDARD_EXAM (zero buffer)."

      - name: parking_pool_conservation
        claim_type: aggregation
        grounds:
          - calculations.parking_pool_balance
        excluded_because:
          difficulty_instance: parking_stall_pool_conserved_across_allocate_and_revoke
          rationale: "The conservation invariant over the stall pool across allocation and revocation is asserted there; this section covers only the ceiling-rounded reserve."

      - name: rentable_sf_conservation
        claim_type: aggregation
        grounds:
          - calculations.building_tenant_mix
        excluded_because:
          difficulty_instance: rentable_square_footage_conserved_across_execute_and_terminate
          rationale: "leased + vacant == total across execute and terminate is asserted there; this section covers only the counted-status filter."

  # ===========================================================================
  - section: validations
    instances:

      - name: shielding_defect_outranks_an_amperage_shortfall_at_utility_review
        claim_type: priority_ordering
        grounds:
          - validations[19]
          - validations[20]
          - state_machines[TenantImprovementProject].transitions[IN_REVIEW -> IN_REVIEW utility approve].preconditions
        distinguishing_aspect: "Three otherwise identical UTILITY approvals diverge purely on the suite's utilities: a suite that lacks medical gas AND lacks amperage returns the priority-19 ERR_SHIELDING_CERTIFICATION_MISSING, a suite that has gas but lacks amperage returns the priority-20 ERR_INSUFFICIENT_UTILITY_CAPACITY, and a suite with both approves — so the safety rule is proven to pre-empt the capacity rule rather than merely coexist with it."
        test_recipe:
          setup:
            - "One reference Building with three 3000 sf STANDARD_EXAM suites: 300 (100 amps, no medical gas), 310 (100 amps, medical gas available) and 320 (200 amps, medical gas available)."
            - "One non-physician-owned INDEPENDENT_PRACTICE tenant with a DRAFT lease on each suite."
            - "One PROCEDURE-target TI project per lease, each requesting 150 amps and medical gas, each with a single POWER line item, each advanced to IN_REVIEW."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { v1_b_id: $.data.id }
            - call: "POST /buildings/${v1_b_id}/suites"
              payload: { suite_number: "300", floor: 3, rentable_sf: 3000, suite_class: "STANDARD_EXAM", power_amps_available: 100, medical_gas_available: false }
              as: PortfolioAdmin
              captures: { v1_sa_id: $.data.id }
            - call: "POST /buildings/${v1_b_id}/suites"
              payload: { suite_number: "310", floor: 3, rentable_sf: 3000, suite_class: "STANDARD_EXAM", power_amps_available: 100, medical_gas_available: true }
              as: PortfolioAdmin
              captures: { v1_sb_id: $.data.id }
            - call: "POST /buildings/${v1_b_id}/suites"
              payload: { suite_number: "320", floor: 3, rentable_sf: 3000, suite_class: "STANDARD_EXAM", power_amps_available: 200, medical_gas_available: true }
              as: PortfolioAdmin
              captures: { v1_sc_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234568391" }
              as: PortfolioAdmin
              captures: { v1_t_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${v1_b_id}", suite_id: "${v1_sa_id}", tenant_id: "${v1_t_id}", lease_type: "DIRECT", term_start: "2026-11-01", term_end: "2029-10-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { v1_la_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${v1_b_id}", suite_id: "${v1_sb_id}", tenant_id: "${v1_t_id}", lease_type: "DIRECT", term_start: "2026-11-01", term_end: "2029-10-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { v1_lb_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${v1_b_id}", suite_id: "${v1_sc_id}", tenant_id: "${v1_t_id}", lease_type: "DIRECT", term_start: "2026-11-01", term_end: "2029-10-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { v1_lc_id: $.data.id }
            - call: "POST /leases/${v1_la_id}/ti-projects"
              payload: { suite_id: "${v1_sa_id}", target_suite_class: "PROCEDURE", power_amps_requested: 150, medical_gas_requested: true, authorized_allowance_total: 200000.00, landlord_share_pct: 0.60 }
              as: LeasingAgent
              captures: { v1_pa_id: $.data.id, v1_pa_v: $.data.version }
            - call: "POST /ti-projects/${v1_pa_id}/line-items"
              payload: { expected_ti_project_version: "${v1_pa_v}", description: "Sub-panel and feeder", category: "POWER", cost_amount: 10000.00 }
              as: LeasingAgent
            - call: "POST /ti-projects/${v1_pa_id}/transitions"
              payload: { action: "SUBMIT_REVIEWS", note: "Fork both review dimensions" }
              as: LeasingAgent
            - call: "POST /leases/${v1_lb_id}/ti-projects"
              payload: { suite_id: "${v1_sb_id}", target_suite_class: "PROCEDURE", power_amps_requested: 150, medical_gas_requested: true, authorized_allowance_total: 200000.00, landlord_share_pct: 0.60 }
              as: LeasingAgent
              captures: { v1_pb_id: $.data.id, v1_pb_v: $.data.version }
            - call: "POST /ti-projects/${v1_pb_id}/line-items"
              payload: { expected_ti_project_version: "${v1_pb_v}", description: "Sub-panel and feeder", category: "POWER", cost_amount: 10000.00 }
              as: LeasingAgent
            - call: "POST /ti-projects/${v1_pb_id}/transitions"
              payload: { action: "SUBMIT_REVIEWS", note: "Fork both review dimensions" }
              as: LeasingAgent
            - call: "POST /leases/${v1_lc_id}/ti-projects"
              payload: { suite_id: "${v1_sc_id}", target_suite_class: "PROCEDURE", power_amps_requested: 150, medical_gas_requested: true, authorized_allowance_total: 200000.00, landlord_share_pct: 0.60 }
              as: LeasingAgent
              captures: { v1_pc_id: $.data.id, v1_pc_v: $.data.version }
            - call: "POST /ti-projects/${v1_pc_id}/line-items"
              payload: { expected_ti_project_version: "${v1_pc_v}", description: "Sub-panel and feeder", category: "POWER", cost_amount: 10000.00 }
              as: LeasingAgent
            - call: "POST /ti-projects/${v1_pc_id}/transitions"
              payload: { action: "SUBMIT_REVIEWS", note: "Fork both review dimensions" }
              as: LeasingAgent
          trigger:
            - call: "POST /ti-projects/${v1_pa_id}/reviews"
              payload: { review_type: "UTILITY", decision: "APPROVE", review_note: "No gas and only 100 amps" }
              as: FacilitiesEngineer
            - call: "POST /ti-projects/${v1_pb_id}/reviews"
              payload: { review_type: "UTILITY", decision: "APPROVE", review_note: "Gas present but only 100 amps" }
              as: FacilitiesEngineer
            - call: "POST /ti-projects/${v1_pc_id}/reviews"
              payload: { review_type: "UTILITY", decision: "APPROVE", review_note: "Gas present and 200 amps available" }
              as: FacilitiesEngineer
            - call: "GET /suites/${v1_sa_id}"
              payload: {}
              as: FacilitiesEngineer
            - call: "GET /suites/${v1_sc_id}"
              payload: {}
              as: FacilitiesEngineer
          assert:
            - "Project ${v1_pa_id}'s review returns 422 with data.error_id == 'ERR_SHIELDING_CERTIFICATION_MISSING' — the medical-gas limb of priority 19 pre-empts the amperage limb of priority 20 even though both are violated"
            - "Project ${v1_pb_id}'s review returns 422 with data.error_id == 'ERR_INSUFFICIENT_UTILITY_CAPACITY'"
            - "Project ${v1_pc_id}'s review returns 200 with utility_review_status == APPROVED, shielding_review_status == PENDING, status still IN_REVIEW and power_amps_drawn == 150"
            - "TenantImprovementProject.${v1_pa_id} and ${v1_pb_id} both still read status == IN_REVIEW with utility_review_status == PENDING"
            - "Suite.${v1_sa_id}.power_amps_available == 100 (untouched by the two refusals) while Suite.${v1_sc_id}.power_amps_available == 50"

      - name: qualifying_appraisal_required_only_for_a_physician_owned_tenant
