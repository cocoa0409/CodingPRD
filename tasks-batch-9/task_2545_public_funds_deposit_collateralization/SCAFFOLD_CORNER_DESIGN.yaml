      - name: qualification_capacity_above_statutory_ceiling_rejected
        claim_type: violation_to_error
        grounds: ["validations[83]", "errors[ERR_CAPACITY_ABOVE_STATUTORY_CEILING]", domain_constants.PLEDGE_CAPACITY_STATUTORY_CEILING_CENTS]
        distinguishing_aspect: "PLEDGE_CAPACITY_STATUTORY_CEILING_CENTS (500,000,000,000) is an inclusive cap enforced at BOTH ends of the review: requesting one cent more is rejected at submission, and requesting exactly the ceiling survives submission and APPROVE."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one DRAFT depository, no reviews yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /depositories"
              payload: { name: "Ridge National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_id: $.data.id }
          trigger:
            - call: "POST /depositories/${dep_id}/qualification-reviews"
              payload: { requested_pledge_capacity_cents: 500000000001 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { err_ceiling: $.data.error_id }
            - call: "POST /depositories/${dep_id}/qualification-reviews"
              payload: { requested_pledge_capacity_cents: 500000000000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { qr_id: $.data.id }
            - call: "POST /qualification-reviews/${qr_id}/attest"
              payload: { attestation_note: "Package complete" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_id}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_id}/decide"
              payload: { decision: "APPROVE" }
              as: StateRegulator
          assert:
            - "Ceiling+1 request: 422 with error_id 'ERR_CAPACITY_ABOVE_STATUTORY_CEILING' and Depository.${dep_id}.approval_status stays 'DRAFT' with no QualificationReview row created"
            - "Exactly-at-ceiling request: 201 with status 'SUBMITTED' and round_count 1"
            - "APPROVE at the ceiling: 200; Depository.${dep_id}.approval_status == 'APPROVED', approved_pledge_capacity_cents == 500000000000, approved_at == 2026-08-01T00:00:00Z"
            - "Because the rejected request never created a review, the surviving review is the FIRST one (round_count 1) — a rejected submission does not burn a REVIEW_ROUND_LIMIT round"

