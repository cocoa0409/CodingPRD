            - call: "POST /accounts/${acct_id}/suspend"
              payload: { expected_account_version: "${v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /stream-sessions"
              payload: { profile_id: "${prof_id}", device_id: "${dev_id}", title_id: "${title_id}" }
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE  # depends on Account.status == SUSPENDED"

      - name: deregister_blocked_by_active_session_on_device
        grounds:
          - state_machines.Device.REGISTERED_to_DEREGISTERED
