  - rule_id: transitive_cascade
    instances:
      - name: emergency_pause_cascade_reaches_tester_availability_through_six_links
        grounds:
          - state_machines.Engagement.axis_authorization_state.AUTHORIZED_to_SUSPENDED
          - state_machines.RulesOfEngagement.SIGNED_to_SUSPENDED
          - state_machines.AuthorizedTarget.ACTIVE_to_SUSPENDED
          - state_machines.TesterAssignment.PROVISIONED_to_REVOKED
          - state_machines.Tester.ASSIGNED_to_AVAILABLE
          - calculations.assignment_hour_settlement
        distinguishing_aspect: |
          Depth-6 chain triggered by Engagement.authorization_state AUTHORIZED -> SUSPENDED:
          (1) engagement SUSPENDED -> (2) its RulesOfEngagement SIGNED -> SUSPENDED -> (3) every ACTIVE
          AuthorizedTarget of that document -> SUSPENDED -> (4) each PROVISIONED TesterAssignment whose
          granted_asset_ids intersect those targets -> REVOKED -> (5) that revocation settles hours on
          the Engagement ledger and decrements Tester.active_assignment_count -> (6) the count reaching 0
          moves the Tester ASSIGNED -> AVAILABLE. Link 4 cannot fire without link 3 and link 6 cannot
          fire without link 5, so the depth is genuine and not six independent effects.
        test_recipe:
          setup:
            - "An EXECUTING, AUTHORIZED engagement on Asset A with hours_allocated 80."
            - "Tester t1 PROVISIONED at 2026-09-07T08:00:00Z on interval 2026-09-07T09:00:00Z..2026-09-14T09:00:00Z with requested_hours 40 and granted_asset_ids [Asset A]; Tester.availability_state ASSIGNED, active_assignment_count 1."
            - "Logical clock advanced to 2026-09-08T10:00:00Z: 25 elapsed hours since interval_start."
