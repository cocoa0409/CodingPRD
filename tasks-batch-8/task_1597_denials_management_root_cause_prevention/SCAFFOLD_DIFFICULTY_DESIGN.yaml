            - "error_id != ERR_APPROVAL_LIMIT_EXCEEDED (fiscal, priority 11) even though the tier exceeds manager authority"
            - "WriteOffRequest status remains ESCALATED_DIRECTOR"

  # ---------------------------------------------------------------- Rule 6 ---
  - rule_id: boundary_precision_check
    instances:
      - name: manager_approval_limit_exact_boundary
        grounds:
          - calculations.writeoff_net_exposure
          - errors[ERR_APPROVAL_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Numeric threshold boundary on the dollar metric: requested amount exactly
          equal to MANAGER_APPROVAL_LIMIT_CENTS (2500000) is STANDARD (<=), while
          one cent more (2500001) is ESCALATED and rejects manager approval.
        test_recipe:
          setup:
            - "Payer A with level-1 policy; code CO-16"
            - "Denial CLM-1101 (denied 2500000) and denial CLM-1102 (denied 2500001), both triaged and assigned (QUEUED)"
            - "WriteOffRequest W1 on CLM-1101 for 2500000 and W2 on CLM-1102 for 2500001, both created by spec-1"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-1101", patient_account_number: "PA-1101", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 2600000, denied_amount_cents: 2500000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d1_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d1_v}" }
              as: DenialsManager
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-1102", patient_account_number: "PA-1102", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 2600001, denied_amount_cents: 2500001, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d2: $.data.id }
            - call: "POST /rcm/denial-cases/${d2}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d2_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d2}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d2_v}" }
              as: DenialsManager
            - call: "POST /rcm/write-off-requests"
              payload: { denial_case_id: "${d1}", requested_amount_cents: 2500000, reason_code: "SMALL_BALANCE" }
              as: DenialsSpecialist
              as_user_id: "spec-1"
              captures: { w1: $.data.id, w1_tier: $.data.approval_tier }
            - call: "POST /rcm/write-off-requests"
              payload: { denial_case_id: "${d2}", requested_amount_cents: 2500001, reason_code: "SMALL_BALANCE" }
              as: DenialsSpecialist
              as_user_id: "spec-1"
              captures: { w2: $.data.id, w2_tier: $.data.approval_tier }
          trigger:
            - call: "POST /rcm/write-off-requests/${w1}/approve"
              payload: {}
              as: DenialsManager
              as_user_id: "mgr-1"
              captures: { w1_status: $.data.status }
            - call: "POST /rcm/write-off-requests/${w2}/approve"
              payload: {}
              as: DenialsManager
              as_user_id: "mgr-1"
              captures: { w2_err: $.data.error_id }
          assert:
            - "W1 (exactly 2500000): tier == STANDARD and manager approve succeeds -> status APPROVED"
            - "denial CLM-1101: status == RESOLVED_WRITTEN_OFF, written_off_cents == 2500000, open_balance_cents == 0"
            - "W2 (2500001, one cent over): tier == ESCALATED and manager approve fails with ERR_APPROVAL_LIMIT_EXCEEDED"
            - "W2 status remains ESCALATED_DIRECTOR (no partial approval)"

      - name: overturn_rate_zero_denominator_null
        grounds:
          - calculations.overturn_rate_report
        distinguishing_aspect: |
          Empty-set boundary on a count metric: a payer with denials but zero
          resolved appeals yields resolved_count == 0 and overturn_rate_pct == null
          (never 0 and never a division error) — a different metric and endpoint
          than the dollar-threshold boundary.
        test_recipe:
          setup:
            - "Payer A with code CO-16; one denial CLM-1201 recorded (no appeals exist anywhere)"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-1201", patient_account_number: "PA-1201", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
          trigger:
            - call: "GET /rcm/analytics/overturn-rates"
              payload: { group_by: "payer" }
              as: ComplianceAuditor
              captures: { rows: $.data.rows, totals: $.data.totals }
          assert:
            - "row for Payer A: resolved_count == 0, overturned_count == 0, partial_count == 0, overturn_rate_pct == null"
            - "totals row: resolved_count == 0 and overturn_rate_pct == null (not 0, not an error)"

      - name: submit_on_deadline_date_timely
        grounds:
          - calculations.appeal_deadline_schedule
          - validations[priority=7]
        distinguishing_aspect: |
          Date-equality boundary on the deadline metric: submission exactly on
          next_appeal_deadline is timely (<= comparison, date granularity); one day
          later is expired. Different metric and endpoint than the dollar threshold
          and empty-set instances.
        test_recipe:
          setup:
            - "Payer A with level-1 policy (60d, requires CLINICAL_NOTES); code CO-16"
            - "Denials CLM-1301 and CLM-1302 (each denied 250000, remit 2026-08-01 -> deadline 2026-09-30), both triaged, assigned, with level-1 appeals LETTER_GENERATED and CLINICAL_NOTES attached"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-1301", patient_account_number: "PA-1301", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d1_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d1_v}" }
              as: DenialsManager
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
              captures: { ap1: $.data.id }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap1}", document_type: "CLINICAL_NOTES", file_reference: "doc-1301-notes" }
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/generate-letter"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-1302", patient_account_number: "PA-1302", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d2: $.data.id }
            - call: "POST /rcm/denial-cases/${d2}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d2_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d2}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d2_v}" }
              as: DenialsManager
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d2}" }
              as: DenialsSpecialist
              captures: { ap2: $.data.id }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap2}", document_type: "CLINICAL_NOTES", file_reference: "doc-1302-notes" }
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap2}/generate-letter"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: RevenueCycleDirector
          trigger:
            - call: "POST /rcm/appeals/${ap1}/submit"
              payload: {}
              as: DenialsSpecialist
              captures: { ap1_status: $.data.status, ap1_due: $.data.response_due_date }
            - call: "POST /rcm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: RevenueCycleDirector
            - call: "POST /rcm/appeals/${ap2}/submit"
              payload: {}
              as: DenialsSpecialist
              captures: { ap2_err: $.data.error_id }
          assert:
            - "ap1 submitted on 2026-09-30 == deadline date: status == SUBMITTED (equality is timely), response_due_date == 2026-10-30"
            - "sweep at 2026-10-01 leaves both denials IN_APPEAL (SUBMITTED and LETTER_GENERATED appeals are in-flight)"
            - "ap2 submitted one day past deadline: error_id == ERR_TIMELY_FILING_EXPIRED and appeal stays LETTER_GENERATED"

  # ---------------------------------------------------------------- Rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: intake_requires_active_payer
        grounds:
          - validations[priority=8]
          - state_machines.Payer.ACTIVE_to_INACTIVE
        distinguishing_aspect: |
          Entity pair DenialCase x Payer: intake is gated on the referenced payer's
          status being ACTIVE; an INACTIVE payer rejects new denials with
          ERR_PAYER_INACTIVE while leaving existing denials untouched.
        test_recipe:
          setup:
            - "Payer A exists and has been toggled INACTIVE; code CO-16 registered"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "PATCH /rcm/payers/${p_a}"
              payload: { status: "INACTIVE" }
              as: RevenueCycleDirector
              captures: { p_status: $.data.status }
          trigger:
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-1401", patient_account_number: "PA-1401", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "PATCH response status == INACTIVE"
            - "intake against the INACTIVE payer fails with error_id == ERR_PAYER_INACTIVE (409)"
            - "GET /rcm/denial-cases afterwards returns an empty data array (no partial write)"

      - name: writeoff_approve_requires_workable_denial
        grounds:
          - validations[priority=6]
          - state_machines.WriteOffRequest.PENDING_MANAGER_to_APPROVED
        distinguishing_aspect: |
          Entity pair WriteOffRequest x DenialCase: approval re-gates on the linked
          denial's state at decision time; a denial that became RESOLVED_PAID while
          the request was pending rejects approval with ERR_DENIAL_INVALID_STATE.
          Different entity pair than DenialCase x Payer.
        test_recipe:
          setup:
            - "Payer A with level-1 policy; code CO-16; denial CLM-1501 (denied 100000) QUEUED"
            - "WriteOffRequest W1 for 100000 pending; meanwhile the level-1 appeal is fully OVERTURNED, moving the denial to RESOLVED_PAID"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-1501", patient_account_number: "PA-1501", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 120000, denied_amount_cents: 100000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
            - call: "POST /rcm/write-off-requests"
              payload: { denial_case_id: "${d1}", requested_amount_cents: 100000, reason_code: "SMALL_BALANCE" }
              as: DenialsSpecialist
              as_user_id: "spec-1"
              captures: { w1: $.data.id }
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
              captures: { ap1: $.data.id }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap1}", document_type: "CLINICAL_NOTES", file_reference: "doc-1501-notes" }
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/generate-letter"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/submit"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/record-outcome"
              payload: { outcome: "OVERTURNED", recovered_amount_cents: 100000 }
              as: DenialsSpecialist
          trigger:
            - call: "POST /rcm/write-off-requests/${w1}/approve"
              payload: {}
              as: DenialsManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
            - call: "GET /rcm/write-off-requests/${w1}"
              payload: {}
              as: DenialsManager
              captures: { w1_status: $.data.status }
          assert:
            - "approve against the RESOLVED_PAID denial fails with error_id == ERR_DENIAL_INVALID_STATE"
            - "W1 remains PENDING_MANAGER (no decision recorded)"
            - "denial shows recovered_amount_cents == 100000 and open_balance_cents == 0"

  # ---------------------------------------------------------------- Rule 8 ---
  - rule_id: resource_temporal_overlap
    instances:
      - name: policy_window_half_open_adjacency
        grounds:
          - entities.PayerAppealPolicy.fields.effective_to
          - errors[ERR_POLICY_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the (payer, level) policy timeline:
          [2026-01-01, 2026-06-01) followed by [2026-06-01, open) is legal
          adjacency, while [2026-05-31, 2026-07-01) overlaps. Different interval
          geometry than the closed program windows.
        test_recipe:
          setup:
            - "Payer A exists; one level-1 policy with window [2026-01-01, 2026-06-01)"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01", effective_to: "2026-06-01" }
              as: RevenueCycleDirector
              captures: { pol1: $.data.id }
          trigger:
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 45, response_window_days: 21, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-06-01" }
              as: RevenueCycleDirector
              captures: { pol2: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 30, response_window_days: 21, required_attachment_types: [], effective_from: "2026-05-31", effective_to: "2026-07-01" }
              as: RevenueCycleDirector
              captures: { err: $.data.error_id }
            - call: "GET /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}" }
              as: RevenueCycleDirector
              captures: { pol_count: $.data }
          assert:
            - "adjacent policy [2026-06-01, open) is created successfully (half-open: prior window excludes 2026-06-01)"
            - "policy starting 2026-05-31 fails with error_id == ERR_POLICY_WINDOW_OVERLAP (overlaps the first window's tail)"
            - "exactly 2 policies exist for Payer A afterwards"

      - name: program_window_closed_interval_touch_conflict
        grounds:
          - entities.PreventionProgram.fields.end_date
          - errors[ERR_PROGRAM_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Closed interval semantics on the department program timeline: windows
          include both endpoints, so [2026-03-01, 2026-05-31] and
          [2026-05-31, 2026-08-31] conflict by touching, while
          [2026-06-01, 2026-08-31] is legal. Opposite adjacency geometry from the
          half-open policy windows and a different resource entity.
        test_recipe:
          setup:
            - "One CODING prevention program with window [2026-03-01, 2026-05-31] exists"
          setup_api_calls:
            - call: "POST /rcm/prevention-programs"
              payload: { department: "CODING", name: "Coder Roundtables Q1", start_date: "2026-03-01", end_date: "2026-05-31", target_reduction_pct: 10 }
              as: RevenueCycleDirector
              captures: { prog1: $.data.id }
          trigger:
            - call: "POST /rcm/prevention-programs"
              payload: { department: "CODING", name: "Touching Window", start_date: "2026-05-31", end_date: "2026-08-31", target_reduction_pct: 15 }
              as: RevenueCycleDirector
              captures: { err: $.data.error_id }
            - call: "POST /rcm/prevention-programs"
              payload: { department: "CODING", name: "Coder Roundtables Q2", start_date: "2026-06-01", end_date: "2026-08-31", target_reduction_pct: 15 }
              as: RevenueCycleDirector
              captures: { prog2: $.data.id }
          assert:
            - "program starting 2026-05-31 fails with error_id == ERR_PROGRAM_WINDOW_OVERLAP (closed windows: the shared date 2026-05-31 belongs to both)"
            - "program starting 2026-06-01 succeeds (first non-conflicting day)"
            - "exactly 2 CODING programs exist afterwards"

  # ---------------------------------------------------------------- Rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: dollar_conservation_outcome_reversal
        grounds:
          - calculations.denial_dollar_conservation
          - state_machines.Appeal.PARTIALLY_OVERTURNED_to_SUBMITTED
        distinguishing_aspect: |
          Conserved quantity is denial dollars: record-outcome paired with
          reverse-outcome must leave recovered_amount_cents and open_balance_cents
          identical to their pre-pair values (open + recovered + written_off ==
          denied at every step).
        test_recipe:
          setup:
            - "OPEN DepartmentScorecard CODING [2026-08-01, 2026-12-31); payer A with level-1 and level-2 policies; code CO-16"
            - "Denial CLM-1601 (denied 250000) with a SUBMITTED level-1 appeal at clock 2026-08-05"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 2, timely_filing_days: 45, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/department-scorecards"
              payload: { department: "CODING", period_start_date: "2026-08-01", period_end_date: "2026-12-31" }
              as: RevenueCycleDirector
              captures: { sc: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-1601", patient_account_number: "PA-1601", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
              captures: { ap1: $.data.id }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap1}", document_type: "CLINICAL_NOTES", file_reference: "doc-1601-notes" }
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/generate-letter"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: RevenueCycleDirector
            - call: "POST /rcm/appeals/${ap1}/submit"
              payload: {}
              as: DenialsSpecialist
          trigger:
            - call: "POST /rcm/appeals/${ap1}/record-outcome"
              payload: { outcome: "PARTIALLY_OVERTURNED", recovered_amount_cents: 100000 }
              as: DenialsSpecialist
            - call: "GET /rcm/denial-cases/${d1}"
              payload: {}
              as: DenialsManager
              captures: { mid_rec: $.data.recovered_amount_cents, mid_open: $.data.open_balance_cents, mid_dl: $.data.next_appeal_deadline }
            - call: "POST /rcm/appeals/${ap1}/reverse-outcome"
              payload: { reason: "Payer reissued the remittance; outcome miskeyed" }
              as: ComplianceAuditor
              captures: { ap_status: $.data.status, ap_amt: $.data.outcome_amount_cents }
            - call: "GET /rcm/denial-cases/${d1}"
              payload: {}
              as: DenialsManager
              captures: { post_rec: $.data.recovered_amount_cents, post_open: $.data.open_balance_cents, post_status: $.data.status, post_dl: $.data.next_appeal_deadline }
            - call: "GET /rcm/department-scorecards/${sc}"
              payload: {}
              as: DenialsManager
              captures: { sc_rec: $.data.recovered_cents }
          assert:
            - "mid-pair: recovered_amount_cents == 100000, open_balance_cents == 150000, invariant 150000 + 100000 + 0 == 250000 holds, next_appeal_deadline == 2026-09-19 (outcome 2026-08-05 + 45 level-2 days)"
            - "post-reversal: appeal status == SUBMITTED with outcome_amount_cents == 0"
            - "post-reversal: denial recovered_amount_cents == 0 and open_balance_cents == 250000 — identical to pre-pair values (no drift)"
            - "post-reversal: denial status == IN_APPEAL with next_appeal_deadline == 2026-09-19 (recomputed from reversal date + level-2 policy)"
            - "scorecard recovered_cents == 0 after the reversal (100000 added then subtracted)"

      - name: verified_fix_count_verify_reopen
        grounds:
          - calculations.verified_fix_conservation
          - state_machines.RootCauseTask.FIX_IMPLEMENTED_to_VERIFIED
          - state_machines.RootCauseTask.VERIFIED_to_REOPENED
        distinguishing_aspect: |
          Conserved quantity is a task count (not dollars): verify (+1) paired with
          recurrence reopen (-1) leaves verified_fix_count and
          verified_linked_denied_cents identical to pre-pair values, while
          recurrence_count accumulates separately.
        test_recipe:
          setup:
            - "OPEN DepartmentScorecard CODING [2026-08-01, 2027-01-01); payer A; code CO-16 (CODING)"
            - "Denial CLM-1701 (CODING, denied 100000) triaged preventable -> auto task T1; T1 acknowledged, implemented (uo-1), verified (mgr-1) at 2026-08-10 -> verified_fix_count 1, verified_linked_denied_cents 100000"
            - "Denial CLM-1702 (same category, denied 60000) awaits triage at clock 2026-08-12"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/department-scorecards"
              payload: { department: "CODING", period_start_date: "2026-08-01", period_end_date: "2027-01-01" }
              as: RevenueCycleDirector
              captures: { sc: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-1701", patient_account_number: "PA-1701", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 120000, denied_amount_cents: 100000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: true }
              as: DenialsSpecialist
            - call: "GET /rcm/root-cause-tasks"
              payload: { denial_case_id: "${d1}" }
              as: DenialsManager
              captures: { t1: "$.data[0].id" }
            - call: "POST /rcm/root-cause-tasks/${t1}/acknowledge"
              payload: {}
              as: UpstreamOwner
              as_user_id: "uo-1"
            - call: "POST /rcm/root-cause-tasks/${t1}/implement-fix"
              payload: { fix_summary: "Encoder mapping corrected" }
              as: UpstreamOwner
              as_user_id: "uo-1"
            - call: "POST /rcm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RevenueCycleDirector
            - call: "POST /rcm/root-cause-tasks/${t1}/verify"
              payload: {}
              as: DenialsManager
              as_user_id: "mgr-1"
            - call: "GET /rcm/department-scorecards/${sc}"
              payload: {}
              as: DenialsManager
              captures: { pre_verified: $.data.verified_fix_count, pre_linked: $.data.verified_linked_denied_cents }
            - call: "POST /rcm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: RevenueCycleDirector
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-1702", patient_account_number: "PA-1702", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 70000, denied_amount_cents: 60000, service_date: "2026-07-15", remittance_received_date: "2026-08-12" }
              as: DenialsSpecialist
              captures: { d2: $.data.id }
          trigger:
            - call: "POST /rcm/denial-cases/${d2}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
            - call: "GET /rcm/department-scorecards/${sc}"
              payload: {}
              as: DenialsManager
              captures: { post_verified: $.data.verified_fix_count, post_linked: $.data.verified_linked_denied_cents, recur: $.data.recurrence_count, recur_linked: $.data.recurrence_linked_denied_cents }
            - call: "GET /rcm/root-cause-tasks"
              payload: { department: "CODING", status: "VERIFIED" }
              as: DenialsManager
              captures: { verified_rows: $.data }
          assert:
            - "pre-recurrence: verified_fix_count == 1 and verified_linked_denied_cents == 100000"
            - "post-recurrence: verified_fix_count == 0 and verified_linked_denied_cents == 0 — the verify/reopen pair leaves the conserved quantity unchanged"
            - "recurrence_count == 1 and recurrence_linked_denied_cents == 60000 (the NEW denial's denied amount; accumulates separately)"
            - "live check: zero RootCauseTasks in VERIFIED status for CODING, matching verified_fix_count == 0"
