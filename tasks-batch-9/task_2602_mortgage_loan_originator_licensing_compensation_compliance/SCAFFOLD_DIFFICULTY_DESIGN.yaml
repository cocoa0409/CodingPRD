            - call: "POST /compensation-plans/${p1}/variables"
              payload: { variable_type: "LOAN_VOLUME_UNITS", weight_pct: 100, justification_text: "Closed unit count only; no term of the transaction participates." }
              as: CompensationDesigner
              as_user_id: "designer-1"
            - call: "POST /compensation-plans/${p1}/approvals"
              payload: { decision: "APPROVE", note: "Single permissible variable at weight 100." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { p1_status: $.data.status }
            - call: "POST /compensation-plans"
              payload: { plan_name: "P2 175bps", base_basis_points: 175, min_fee_cents: 100000, max_fee_cents: 900000, volume_tier_enabled: false, concession_absorption_enabled: false }
              as: CompensationDesigner
              as_user_id: "designer-1"
              captures: { p2: $.data.id }
            - call: "POST /compensation-plans/${p2}/variables"
              payload: { variable_type: "FILE_QUALITY_SCORE", weight_pct: 100, justification_text: "Documented file quality audit score; no term of the transaction participates." }
              as: CompensationDesigner
              as_user_id: "designer-1"
            - call: "POST /compensation-plans/${p2}/approvals"
              payload: { decision: "APPROVE", note: "Single permissible variable at weight 100." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { p2_status: $.data.status }
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { orig_v0: $.data.version }
            - call: "POST /originators/${orig_id}/compensation-plan-assignments"
              payload: { compensation_plan_id: "${p1}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z", expected_originator_version: "${orig_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { assigned_plan: $.data.compensation_plan_id, orig_v1: $.data.version }
          trigger:
            - call: "POST /originators/${orig_id}/compensation-plan-assignments"
              payload: { compensation_plan_id: "${p2}", effective_from: "2026-09-30T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_originator_version: "${orig_v1}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { orig_v2: $.data.version, plan_after_reject: $.data.compensation_plan_id }
            - call: "POST /originators/${orig_id}/compensation-plan-assignments"
              payload: { compensation_plan_id: "${p2}", effective_from: "2026-10-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_originator_version: "${orig_v2}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { plan_after_accept: $.data.compensation_plan_id }
            - call: "GET /compensation-plans/${p1}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { p1_status_after: $.data.status, p1_from: $.data.assignment_effective_from, p1_to: $.data.assignment_effective_to }
            - call: "GET /compensation-plans/${p2}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { p2_status_after: $.data.status, p2_from: $.data.assignment_effective_from, p2_to: $.data.assignment_effective_to, p2_orig: $.data.assigned_originator_id }
          assert:
            - "${p1_status} == ACTIVE and ${p2_status} == ACTIVE and ${assigned_plan} == ${p1}"
            - "${err_id} == ERR_PLAN_PERIOD_OVERLAP with HTTP 409 - effective_from
               2026-09-30T00:00:00Z equals P1.assignment_effective_to and both bounds are
               inclusive, so the intervals collide at that single instant"
            - "${orig_v2} == ${orig_v1} and ${plan_after_reject} == ${p1} (the rejected assignment
               bumped nothing)"
            - "${plan_after_accept} == ${p2} - moving effective_from one day later to
               2026-10-01T00:00:00Z clears the collision"
            - "${p1_status_after} == SUPERSEDED with ${p1_from} == 2026-08-01T00:00:00Z and
               ${p1_to} == 2026-09-30T00:00:00Z retained (history is preserved, not rewritten)"
            - "${p2_status_after} == ACTIVE with ${p2_from} == 2026-10-01T00:00:00Z,
               ${p2_to} == 2026-12-31T00:00:00Z and ${p2_orig} == ${orig_id}"
            - "At most one assignment covers any instant: no CompensationPlan other than P1 covers
               2026-09-30T00:00:00Z"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: payoff_clawback_returns_net_compensation_to_zero
        grounds:
          - calculations.early_payoff_clawback
          - entities.Originator.fields.net_compensation_cents
          - state_machines.CompensationRecord.RECONCILED_to_CLAWED_BACK
        distinguishing_aspect: |
          Money invariant across a compensating action. A full 100 percent recapture inside the
          90-day inner window must return Originator.net_compensation_cents to exactly its
          pre-close value of 0, while the gross ledger keeps its history:
          lifetime_accrued_cents 400000 and lifetime_clawed_back_cents 400000. The identity
          net == accrued - clawed_back is asserted at every step, so a partial or double reversal
          is caught.
        test_recipe:
          setup:
            - "Authorised CA originator (NMLS 1100017) with an ACTIVE plan at 200 bps,
               volume_tier_enabled false, assigned over
               [2026-08-01T00:00:00Z, 2026-12-31T00:00:00Z]."
            - "One loan locked and funded at 20000000 cents with note_rate_bps == par_rate_bps and
               lender-paid compensation only, funded 2026-09-01T00:00:00Z."
            - "Payoff on 2026-10-01T00:00:00Z, exactly 30 whole days held, inside
               EARLY_PAYOFF_INNER_DAYS."
          setup_api_calls:
            - call: "POST /originators"
              payload: { nmls_unique_id: "1100017", legal_name: "Iris Kaltenbach", hire_date: "2025-07-01T00:00:00Z", employment_status: "EMPLOYED" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id, net_before: $.data.net_compensation_cents }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-40204", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026, required_ce_hours: 8 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_id: $.data.id, lic_v0: $.data.version }
            - call: "POST /license-registrations/${lic_id}/sponsorship-transfers"
              payload: { sponsoring_institution_code: "INST-ALPHA", effective_at: "2026-08-01T00:00:00Z", expected_license_registration_version: "${lic_v0}" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /license-registrations/${lic_id}/activations"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compensation-plans"
              payload: { plan_name: "200bps Reversible", base_basis_points: 200, min_fee_cents: 100000, max_fee_cents: 900000, volume_tier_enabled: false, concession_absorption_enabled: false }
              as: CompensationDesigner
              as_user_id: "designer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /compensation-plans/${plan_id}/variables"
              payload: { variable_type: "LOAN_VOLUME_UNITS", weight_pct: 100, justification_text: "Closed unit count only; no term of the transaction participates." }
              as: CompensationDesigner
              as_user_id: "designer-1"
            - call: "POST /compensation-plans/${plan_id}/approvals"
              payload: { decision: "APPROVE", note: "Single permissible variable at weight 100." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { orig_v1: $.data.version }
            - call: "POST /originators/${orig_id}/compensation-plan-assignments"
              payload: { compensation_plan_id: "${plan_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_originator_version: "${orig_v1}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /loan-applications"
              payload: { originator_id: "${orig_id}", state_code: "CA", borrower_reference: "BW-2602-B1", product_type: "FIXED_30", requested_amount_cents: 20000000, par_rate_bps: 650 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { loan_id: $.data.id }
            - call: "POST /loan-applications/${loan_id}/lock"
              payload: { note_rate_bps: 650, locked_amount_cents: 20000000 }
              as: Originator
              as_user_id: "${orig_id}"
            - call: "POST /loan-applications/${loan_id}/close"
              payload: { funded_amount_cents: 20000000, funded_at: "2026-09-01T00:00:00Z", lender_paid_comp_cents: 400000, borrower_paid_comp_cents: 0, file_quality_score: 95, hours_worked_pct: 80 }
              as: LoanOperations
              as_user_id: "ops-1"
            - call: "GET /originators/${orig_id}"
