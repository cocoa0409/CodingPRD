  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: coupon_apply_stale_version_conflict
        claim_type: occ_conflict
        grounds:
          - concurrency_rules[coupon-apply-stale-order]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After a first coupon apply advances Order.version from 1 to 2, a second apply still carrying expected_order_version=1 is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Order O with one UNIT line subtotal 2000; two stackable coupons A and B exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { email: "cc15@x.com", full_name: "CC Fifteen", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "UNIT-2000", name: "Frame Kit", sell_mode: "UNIT", unit_price_cents: 2000 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { on_hand_yards: 50 }
              as: StoreManager
            - call: "POST /coupons"
              payload: { code: "SA", discount_type: "PERCENT", value: 0.1, stackable: true, priority: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }
              as: StoreManager
            - call: "POST /coupons"
              payload: { code: "SB", discount_type: "PERCENT", value: 0.1, stackable: true, priority: 2, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }
              as: StoreManager
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", requested_yards: 1 }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/coupons"
              payload: { code: "SA", expected_order_version: "${ov0}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ov1: $.data.version }
          trigger:
            - call: "POST /orders/${o_id}/coupons"
              payload: { code: "SB", expected_order_version: "${ov0}" }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "HTTP status == 412"
            - "error_id == ERR_STALE_VERSION"

