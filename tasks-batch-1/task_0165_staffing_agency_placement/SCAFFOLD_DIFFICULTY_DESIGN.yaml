# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Staffing Agency Placement — 9 rules x >= 2 instances = >= 18 instances
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# All formula-derived assert literals were precomputed (round_half_up, integer cents).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: placement_margin_provisional_vs_actual
        grounds:
          - calculations.placement_projected_margin
          - calculations.placement_actual_margin
          - entities.Placement.fields.projected_weekly_margin_cents
          - entities.Placement.fields.actual_margin_cents
          - state_machines.Timesheet.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          On the SAME placement (bill 12000, pay 8000, standard 40h) the provisional
          variant yields projected_weekly_margin_cents == 160000 from planned hours,
          while the actual variant after approving one 45h timesheet yields
          actual_margin_cents == 190000 — the two diverge because real hours (45) != standard (40).
        test_recipe:
          setup:
            - "Client + TEMP job order (bill 12000) OPEN; candidate placed and started; placement is ACTIVE with projected_weekly_margin_cents=160000."
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Dev", employment_type: "TEMP", required_skill_code: "JAVA", openings: 1, bill_rate_cents: 12000, target_pay_rate_cents: 8000 }
              as: AccountManager
              captures: { jo_id: $.data.id }
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "OPEN" }
              as: AccountManager
              captures: { jo_v: $.data.version }
            - call: "POST /staffing/candidates"
              payload: { full_name: "Cara Dev", skill_codes: ["JAVA"], base_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { cand_id: $.data.id }
            - call: "POST /staffing/submissions"
              payload: { job_order_id: "${jo_id}", candidate_id: "${cand_id}", submitted_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { sub_id: $.data.id }
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "CLIENT_REVIEW" }
              as: Recruiter
            - call: "POST /staffing/submissions/${sub_id}/interviews"
              payload: { scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { iv_id: $.data.id }
            - call: "PATCH /staffing/interviews/${iv_id}"
              payload: { outcome: "PASSED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "OFFER_EXTENDED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /staffing/placements"
              payload: { submission_id: "${sub_id}", start_date: "2026-06-15T00:00:00Z", end_date: "2026-09-15T00:00:00Z", expected_job_order_version: "${jo_v}", standard_weekly_hours: 40 }
              as: Recruiter
              captures: { pl_id: $.data.id }
            - call: "PATCH /staffing/placements/${pl_id}"
              payload: { target_assignment_status: "ACTIVE" }
              as: Recruiter
          trigger:
            - call: "POST /staffing/timesheets"
              payload: { placement_id: "${pl_id}", week_start: "2026-06-15T00:00:00Z", week_end: "2026-06-22T00:00:00Z", hours: 45 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { ts_id: $.data.id }
            - call: "PATCH /staffing/timesheets/${ts_id}"
              payload: { target_status: "SUBMITTED" }
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "PATCH /staffing/timesheets/${ts_id}"
              payload: { target_status: "APPROVED" }
              as: Client
              as_user_id: "${cl_id}"
          assert:
            - "Placement.${pl_id}.projected_weekly_margin_cents == 160000"
            - "Placement.${pl_id}.actual_margin_cents == 190000"
            - "Placement.${pl_id}.projected_weekly_margin_cents != Placement.${pl_id}.actual_margin_cents"

      - name: client_exposure_projected_vs_outstanding
        grounds:
          - calculations.client_credit_exposure
          - entities.Client.fields.open_exposure_cents
          - entities.Client.fields.outstanding_balance_cents
          - state_machines.Invoice.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Dual-variant on a DIFFERENT entity domain (Client, not Placement): the provisional
          open_exposure_cents == 480000 (projection of the ACTIVE placement) while the realized
          outstanding_balance_cents == 487200 (the issued invoice total for one 40h timesheet),
          diverging because projection uses standard hours and the invoice adds the processing fee.
        test_recipe:
          setup:
            - "Same ACTIVE placement as above (bill 12000, 40h projection); one 40h timesheet approved, line-itemed, and the invoice ISSUED."
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Dev", employment_type: "TEMP", required_skill_code: "JAVA", openings: 1, bill_rate_cents: 12000, target_pay_rate_cents: 8000 }
              as: AccountManager
              captures: { jo_id: $.data.id }
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "OPEN" }
              as: AccountManager
              captures: { jo_v: $.data.version }
            - call: "POST /staffing/candidates"
              payload: { full_name: "Cara Dev", skill_codes: ["JAVA"], base_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { cand_id: $.data.id }
            - call: "POST /staffing/submissions"
              payload: { job_order_id: "${jo_id}", candidate_id: "${cand_id}", submitted_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { sub_id: $.data.id }
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "CLIENT_REVIEW" }
              as: Recruiter
            - call: "POST /staffing/submissions/${sub_id}/interviews"
              payload: { scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { iv_id: $.data.id }
            - call: "PATCH /staffing/interviews/${iv_id}"
              payload: { outcome: "PASSED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "OFFER_EXTENDED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /staffing/placements"
              payload: { submission_id: "${sub_id}", start_date: "2026-06-15T00:00:00Z", end_date: "2026-09-15T00:00:00Z", expected_job_order_version: "${jo_v}", standard_weekly_hours: 40 }
              as: Recruiter
              captures: { pl_id: $.data.id }
            - call: "PATCH /staffing/placements/${pl_id}"
              payload: { target_assignment_status: "ACTIVE" }
              as: Recruiter
            - call: "POST /staffing/timesheets"
              payload: { placement_id: "${pl_id}", week_start: "2026-06-15T00:00:00Z", week_end: "2026-06-22T00:00:00Z", hours: 40 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { ts_id: $.data.id }
            - call: "PATCH /staffing/timesheets/${ts_id}"
              payload: { target_status: "SUBMITTED" }
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "PATCH /staffing/timesheets/${ts_id}"
              payload: { target_status: "APPROVED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /staffing/invoices"
              payload: { client_id: "${cl_id}" }
              as: AccountManager
              captures: { inv_id: $.data.id }
            - call: "POST /staffing/invoices/${inv_id}/line-items"
              payload: { timesheet_id: "${ts_id}" }
              as: AccountManager
          trigger:
            - call: "PATCH /staffing/invoices/${inv_id}"
              payload: { target_status: "ISSUED" }
              as: AccountManager
          assert:
            - "Client.${cl_id}.open_exposure_cents == 480000"
            - "Client.${cl_id}.outstanding_balance_cents == 487200"
            - "Client.${cl_id}.open_exposure_cents != Client.${cl_id}.outstanding_balance_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_total_rounding_and_eval_order
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.subtotal_cents
          - entities.Invoice.fields.volume_discount_cents
          - entities.Invoice.fields.processing_fee_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Mode (b)+(c): two 40h timesheets (bill 480000 each) give per-line-rounded subtotal 960000
          (tier-1 3%), discount round_half_up(960000*0.03)=28800, fee on POST-discount
          round_half_up(931200*0.015)=13968, total 945168. The pinned per-line-then-sum AND
          subtotal->discount->fee evaluation order produce these exact cents.
        test_recipe:
          setup:
            - "One client, one ACTIVE TEMP placement (bill 12000), two APPROVED 40h timesheets; one DRAFT invoice with both line items."
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Dev", employment_type: "TEMP", required_skill_code: "JAVA", openings: 1, bill_rate_cents: 12000, target_pay_rate_cents: 8000 }
              as: AccountManager
              captures: { jo_id: $.data.id }
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "OPEN" }
              as: AccountManager
              captures: { jo_v: $.data.version }
            - call: "POST /staffing/candidates"
              payload: { full_name: "Cara Dev", skill_codes: ["JAVA"], base_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { cand_id: $.data.id }
            - call: "POST /staffing/submissions"
              payload: { job_order_id: "${jo_id}", candidate_id: "${cand_id}", submitted_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { sub_id: $.data.id }
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "CLIENT_REVIEW" }
              as: Recruiter
            - call: "POST /staffing/submissions/${sub_id}/interviews"
              payload: { scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { iv_id: $.data.id }
            - call: "PATCH /staffing/interviews/${iv_id}"
              payload: { outcome: "PASSED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "OFFER_EXTENDED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /staffing/placements"
              payload: { submission_id: "${sub_id}", start_date: "2026-06-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", expected_job_order_version: "${jo_v}", standard_weekly_hours: 40 }
              as: Recruiter
              captures: { pl_id: $.data.id }
            - call: "PATCH /staffing/placements/${pl_id}"
              payload: { target_assignment_status: "ACTIVE" }
              as: Recruiter
            - call: "POST /staffing/timesheets"
              payload: { placement_id: "${pl_id}", week_start: "2026-06-15T00:00:00Z", week_end: "2026-06-22T00:00:00Z", hours: 40 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { ts1_id: $.data.id }
            - call: "PATCH /staffing/timesheets/${ts1_id}"
              payload: { target_status: "SUBMITTED" }
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "PATCH /staffing/timesheets/${ts1_id}"
              payload: { target_status: "APPROVED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /staffing/timesheets"
              payload: { placement_id: "${pl_id}", week_start: "2026-06-22T00:00:00Z", week_end: "2026-06-29T00:00:00Z", hours: 40 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { ts2_id: $.data.id }
            - call: "PATCH /staffing/timesheets/${ts2_id}"
              payload: { target_status: "SUBMITTED" }
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "PATCH /staffing/timesheets/${ts2_id}"
              payload: { target_status: "APPROVED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /staffing/invoices"
              payload: { client_id: "${cl_id}" }
              as: AccountManager
              captures: { inv_id: $.data.id }
            - call: "POST /staffing/invoices/${inv_id}/line-items"
              payload: { timesheet_id: "${ts1_id}" }
              as: AccountManager
          trigger:
            - call: "POST /staffing/invoices/${inv_id}/line-items"
              payload: { timesheet_id: "${ts2_id}" }
              as: AccountManager
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 960000"
            - "Invoice.${inv_id}.volume_discount_cents == 28800"
            - "Invoice.${inv_id}.processing_fee_cents == 13968"
            - "Invoice.${inv_id}.total_cents == 945168"

      - name: conversion_fee_clamp_and_branch
        grounds:
          - calculations.conversion_fee
          - state_machines.Placement.NONE_to_CONVERTED
          - entities.ConversionFee.fields.fee_cents
          - entities.Client.fields.conversion_fee_pct
        distinguishing_aspect: |
          Mode (a): >=3 inputs (base 10000000, client pct 0.20, tenure 2 weeks) with a
          branch on placement_type==TEMP_TO_PERM and a min/max clamp. tenure 2 < 13 -> factor 1.0,
          raw 2000000, inside [250000, 5000000] -> fee_cents == 2000000. Falls in a DIFFERENT mode
          from invoice_total's (b)/(c) rounding-order family.
        test_recipe:
          setup:
            - "Client (conversion_fee_pct 0.20), TEMP_TO_PERM job order OPEN, candidate placed and ACTIVE, 0 approved timesheets (tenure 2 weeks conceptual, but weeks_worked=0 < 13)."
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "RN", category: "CLINICAL" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Mercy", credit_limit_cents: 100000000, conversion_fee_pct: 0.20 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Nurse", employment_type: "TEMP_TO_PERM", required_skill_code: "RN", openings: 1, bill_rate_cents: 9000, target_pay_rate_cents: 6000, annual_salary_cents: 10000000 }
              as: AccountManager
              captures: { jo_id: $.data.id }
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "OPEN" }
              as: AccountManager
              captures: { jo_v: $.data.version }
            - call: "POST /staffing/candidates"
              payload: { full_name: "Nina RN", skill_codes: ["RN"], base_pay_rate_cents: 6000 }
              as: Recruiter
              captures: { cand_id: $.data.id }
            - call: "POST /staffing/submissions"
              payload: { job_order_id: "${jo_id}", candidate_id: "${cand_id}", submitted_pay_rate_cents: 6000 }
              as: Recruiter
              captures: { sub_id: $.data.id }
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "CLIENT_REVIEW" }
              as: Recruiter
            - call: "POST /staffing/submissions/${sub_id}/interviews"
              payload: { scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { iv_id: $.data.id }
            - call: "PATCH /staffing/interviews/${iv_id}"
              payload: { outcome: "PASSED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "OFFER_EXTENDED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /staffing/placements"
              payload: { submission_id: "${sub_id}", start_date: "2026-06-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", expected_job_order_version: "${jo_v}", standard_weekly_hours: 40 }
              as: Recruiter
              captures: { pl_id: $.data.id }
            - call: "PATCH /staffing/placements/${pl_id}"
              payload: { target_assignment_status: "ACTIVE" }
              as: Recruiter
          trigger:
            - call: "POST /staffing/placements/${pl_id}/convert"
              payload: { annual_salary_cents: 10000000 }
              as: AccountManager
              captures: { pl_after: $.data.id }
          assert:
            - "ConversionFee filtered by placement_id=${pl_id} has exactly one entry with fee_cents == 2000000 and status == BILLED"
            - "Placement.${pl_id}.conversion_status == CONVERTED"
            - "Placement.${pl_id}.assignment_status == ENDED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: placement_parallel_axes_independent
        grounds:
          - state_machines.Placement.NONE_to_CONVERTED
          - state_machines.Placement.PENDING_START_to_ACTIVE
          - entities.Placement.fields.assignment_status
          - entities.Placement.fields.conversion_status
        distinguishing_aspect: |
          Parallel dimensions on ONE entity (Placement): conversion_status and assignment_status
          are independent axes — before convert, assignment_status==ACTIVE and conversion_status==NONE
          coexist; conversion then forces assignment_status->ENDED while conversion_status->CONVERTED.
        test_recipe:
          setup:
            - "TEMP_TO_PERM placement ACTIVE, conversion_status NONE."
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "RN", category: "CLINICAL" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Mercy", credit_limit_cents: 100000000, conversion_fee_pct: 0.20 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Nurse", employment_type: "TEMP_TO_PERM", required_skill_code: "RN", openings: 1, bill_rate_cents: 9000, target_pay_rate_cents: 6000, annual_salary_cents: 10000000 }
              as: AccountManager
              captures: { jo_id: $.data.id }
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "OPEN" }
              as: AccountManager
              captures: { jo_v: $.data.version }
            - call: "POST /staffing/candidates"
              payload: { full_name: "Nina RN", skill_codes: ["RN"], base_pay_rate_cents: 6000 }
              as: Recruiter
              captures: { cand_id: $.data.id }
            - call: "POST /staffing/submissions"
              payload: { job_order_id: "${jo_id}", candidate_id: "${cand_id}", submitted_pay_rate_cents: 6000 }
              as: Recruiter
              captures: { sub_id: $.data.id }
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "CLIENT_REVIEW" }
              as: Recruiter
            - call: "POST /staffing/submissions/${sub_id}/interviews"
              payload: { scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { iv_id: $.data.id }
            - call: "PATCH /staffing/interviews/${iv_id}"
              payload: { outcome: "PASSED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "OFFER_EXTENDED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /staffing/placements"
              payload: { submission_id: "${sub_id}", start_date: "2026-06-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", expected_job_order_version: "${jo_v}", standard_weekly_hours: 40 }
              as: Recruiter
              captures: { pl_id: $.data.id }
            - call: "PATCH /staffing/placements/${pl_id}"
              payload: { target_assignment_status: "ACTIVE" }
              as: Recruiter
          trigger:
            - call: "POST /staffing/placements/${pl_id}/convert"
              payload: { annual_salary_cents: 10000000 }
              as: AccountManager
          assert:
            - "Before convert (read at setup end): Placement.${pl_id}.assignment_status == ACTIVE and conversion_status == NONE"
            - "After convert: Placement.${pl_id}.conversion_status == CONVERTED"
            - "After convert: Placement.${pl_id}.assignment_status == ENDED"

      - name: timesheet_revision_cycle
        grounds:
          - state_machines.Timesheet.SUBMITTED_to_REJECTED
          - state_machines.Timesheet.REJECTED_to_DRAFT
          - state_machines.Timesheet.DRAFT_to_SUBMITTED
          - entities.Timesheet.fields.status
        distinguishing_aspect: |
          Cyclic shape on a DIFFERENT entity (Timesheet) than Placement: DRAFT->SUBMITTED->REJECTED
          ->DRAFT->SUBMITTED loops back to a previously-visited state with recomputed pay/bill from
          revised hours, proving the cycle is real (45h revised down to 40h changes margin 190000->160000).
        test_recipe:
          setup:
            - "ACTIVE TEMP placement (bill 12000, pay 8000); one timesheet created DRAFT with 45h, submitted, then rejected."
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Dev", employment_type: "TEMP", required_skill_code: "JAVA", openings: 1, bill_rate_cents: 12000, target_pay_rate_cents: 8000 }
              as: AccountManager
              captures: { jo_id: $.data.id }
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "OPEN" }
              as: AccountManager
              captures: { jo_v: $.data.version }
            - call: "POST /staffing/candidates"
              payload: { full_name: "Cara Dev", skill_codes: ["JAVA"], base_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { cand_id: $.data.id }
            - call: "POST /staffing/submissions"
              payload: { job_order_id: "${jo_id}", candidate_id: "${cand_id}", submitted_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { sub_id: $.data.id }
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "CLIENT_REVIEW" }
              as: Recruiter
