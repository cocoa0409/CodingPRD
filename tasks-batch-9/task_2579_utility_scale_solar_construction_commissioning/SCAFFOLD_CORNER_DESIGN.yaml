          - errors[ERR_DISTURBED_ACREAGE_EXCEEDED]
        distinguishing_aspect: "The ledger is rounded to two decimals and the gate is inclusive: 12.34 + 7.66 lands exactly on the 20.00 limit and is admitted, while a further 0.01 acre is refused — proving the comparison is > limit rather than >= limit and that no accumulated float drift shifts the boundary."
