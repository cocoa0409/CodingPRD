            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
              captures: { ev_v2: $.data.version }
            - call: "POST /events/${ev}/open-general"
              payload: { expected_event_version: "${ev_v2}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "im@x.com", full_name: "IM", device_fingerprint: "dev-im" }
              as: Anonymous
              captures: { fim: $.data.id }
            - call: "POST /fans/${fim}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fim}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fim}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${fim}"
              captures: { qim: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 5 }
              as: PromoterAdmin
            - call: "POST /orders"
              payload: { queue_entry_id: "${qim}", fan_id: "${fim}", tier_id: "${tier}", quantity: 1 }
              as: Fan
              as_user_id: "${fim}"
              captures: { oim: $.data.id, oim_v: $.data.version }
            - call: "POST /orders/${oim}/pay"
              payload: { expected_order_version: "${oim_v}" }
              as: Fan
              as_user_id: "${fim}"
          trigger:
            - call: "GET /events/${ev}"
              payload: {}
              as: PromoterAdmin
          assert:
            - "Order.${oim}.status == PAID"
            - "Event.${ev}.tickets_sold_count == 1"
