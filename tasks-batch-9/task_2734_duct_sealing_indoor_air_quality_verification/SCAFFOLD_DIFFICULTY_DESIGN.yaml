  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: seal_job_injecting_pause_resume_cycle
        grounds:
          - state_machines.SealJob.INJECTING_to_PAUSED
          - state_machines.SealJob.PAUSED_to_INJECTING
          - entities.SealJob.fields.pause_count
          - entities.SealJob.fields.stall_flag
          - calculations.sealing_run_curve_monitor
        distinguishing_aspect: |
          The run re-enters INJECTING twice from PAUSED — once after a stall-triggered pause and once
          after a manual pause — so pause_count reaches 2 while the status returns to a state it has
          already occupied; a linear machine could not produce pause_count > 1 with status INJECTING.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z"
            - "Certified technician, self-funded project (no utility program), duct system CLEARED -> ELIGIBLE"
            - "Accepted PRE test at 300.0 CFM / 25 Pa -> baseline_leakage_cfm25 300.00"
            - "PASS PRE-phase combustion test on the project"
            - "Seal job masked with 9 registers, injecting, three samples recorded whose 3-sample rate is 0.40 CFM/min so the run auto-paused with stall_flag=true and pause_count=1"
          setup_api_calls:
