      - name: corner_occ_stale_expected_policy_version_on_adjudicate
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[adjudicate-line-stale-policy]
          - validations[priority=21]
          - errors[ERR_STALE_VERSION]
          - entities.InsurancePolicy.fields.deductible_met_cents
        distinguishing_aspect: "Adjudicating the first line advances InsurancePolicy.version, so the second line adjudicated with the pre-adjudication token is rejected with ERR_STALE_VERSION 412 and deductible_met_cents stays at the post-first-line value of 14000."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-15T23:00:00Z after the setup chain"
            - "One PLUS plan, one physician with panel_slot_cap 20.0 licensed in CA"
            - "One family with an ACTIVE InsurancePolicy at deductible_cents 50000 and coinsurance_rate 0.20"
            - "One child with an ACTIVE membership, June invoice of 40000 cents PAID"
