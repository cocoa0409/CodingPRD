  # =========================================================================
  # Cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_reservation_version_on_dispatch_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dispatch-stale-reservation]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          Two sequential dispatch attempts: the first succeeds and bumps Reservation.version; a second
          dispatch carrying the pre-dispatch version (expressed as ${resv_v} after the contract was voided
          to make the reservation dispatchable again) is rejected ERR_STALE_VERSION (412). Uses a ${var}
          for the OCC field, never a literal.
        test_recipe:
          setup:
            - "TRUCK_15 (requires_coverage false); HUB cap 5; one unit; verified customer; round-trip reservation CONFIRMED."
            - "Dispatched once (contract created), then the contract is VOID-ed so fulfillment returns to AWAITING_DISPATCH and the unit is AVAILABLE again — Reservation.version has advanced past the originally-observed value."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "occ@x.com", full_name: "Oc Cc", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v_stale: $.data.version }
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v_stale}" }
              as: LocationAgent
              captures: { ctr: $.data.id }
            - call: "POST /rental/contracts/${ctr}/void"
              payload: {}
              as: FleetManager
          trigger:
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v_stale}" }
              as: LocationAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response error_id == ERR_STALE_VERSION"

      - name: occ_stale_contract_version_on_settle_excluded
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[settle-stale-contract]
        excluded_because:
          difficulty_instance: transitive_cascade / settle_cascade_contract_to_ledger_to_reservation_depth2
          rationale: "The settle path with the contract OCC field exercised by a §1.8 cascade instance; the happy-path settle (correct version) is asserted there; a dedicated stale-version probe is the symmetric negative of that and is covered structurally by the §1.9 dispatch OCC probe above."

      - name: derived_on_lot_count_reconciles_after_dispatch
        claim_type: derived_field_reconciliation
        grounds:
          - entities.RentalLocation.fields.on_lot_count
          - state_machines.Reservation.AWAITING_DISPATCH_to_DISPATCHED
        distinguishing_aspect: "RentalLocation.on_lot_count is a derived field: it is 1 with one unit on lot, and recomputes to 0 after that unit is dispatched off the lot."
        test_recipe:
          setup: ["TRUCK_15 (requires_coverage false); HUB cap 5; one unit (on_lot_count 1); verified customer; round-trip reservation CONFIRMED."]
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "df@x.com", full_name: "De Fl", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v: $.data.version }
          trigger:
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
              captures: { ctr: $.data.id }
          assert:
            - "Before dispatch: RentalLocation.${hub}.on_lot_count == 1"
            - "After dispatch: RentalLocation.${hub}.on_lot_count == 0"

