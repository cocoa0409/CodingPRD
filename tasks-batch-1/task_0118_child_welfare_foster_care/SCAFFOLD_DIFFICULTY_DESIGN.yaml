scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: intake_screening_variant_in_vs_out
        grounds:
          - calculations.intake_screening_score
          - state_machines.Referral.RECEIVED_to_SCREENED_IN
          - state_machines.Referral.RECEIVED_to_SCREENED_OUT
        distinguishing_aspect: |
          Two valid screen variants on the REFERRAL domain diverge: identical-shaped scoring
          yields SCREENED_IN (score 73, P2_72H) vs SCREENED_OUT (score 20, P3_10D); this is the
          Referral-domain half of the dual-variant pair (the other half is on Investigation).
        test_recipe:
          setup:
            - "Clock fixed; one SCREENER caseworker exists; two RECEIVED referrals A and B exist."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara Screener", role_type: "SCREENER", email: "sara@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
            - call: "POST /referrals"
              payload: { reporter_type: "MANDATED", child_name: "Child A", alleged_maltreatment: "PHYSICAL_ABUSE", priority_factors: ["INJURY_VISIBLE", "PRIOR_REPORT"] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_a: $.data.id }
            - call: "POST /referrals"
              payload: { reporter_type: "ANONYMOUS", child_name: "Child B", alleged_maltreatment: "EMOTIONAL_ABUSE", priority_factors: [] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_b: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_a}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
            - call: "POST /referrals/${ref_b}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
          assert:
            - "Referral.${ref_a}.screening_score == 73"
            - "Referral.${ref_a}.status == SCREENED_IN"
            - "Referral.${ref_a}.response_priority == P2_72H"
            - "Referral.${ref_a}.screened_in_by == ${scr_id}"
            - "Referral.${ref_b}.screening_score == 20"
            - "Referral.${ref_b}.status == SCREENED_OUT"
            - "Referral.${ref_b}.response_priority == P3_10D"

      - name: safety_assessment_variant_removal_vs_safe
        grounds:
          - calculations.safety_assessment_score
          - state_machines.Investigation.IN_PROGRESS_to_UNSAFE
          - state_machines.Investigation.IN_PROGRESS_to_SAFE
        distinguishing_aspect: |
          Two valid safety variants on the INVESTIGATION domain diverge: same scoring shape yields
          UNSAFE (score 93, removal_recommended true) vs SAFE (score 0, removal_recommended false);
          this is the Investigation-domain half, a different entity domain from intake screening.
        test_recipe:
          setup:
            - "Clock fixed; SCREENER + INVESTIGATOR + CASEWORKER exist; two screened-in referrals each with an IN_PROGRESS investigation assigned to the investigator."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara Screener", role_type: "SCREENER", email: "sara2@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Ivan Investigator", role_type: "INVESTIGATOR", email: "ivan2@x.gov" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Cara Caseworker", role_type: "CASEWORKER", email: "cara2@x.gov" }
              as: Admin
              captures: { cw_id: $.data.id }
            - call: "POST /referrals"
              payload: { reporter_type: "MANDATED", child_name: "Child U", alleged_maltreatment: "PHYSICAL_ABUSE", priority_factors: ["INJURY_VISIBLE", "PRIOR_REPORT"] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_u: $.data.id }
            - call: "POST /referrals/${ref_u}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
            - call: "POST /investigations"
              payload: { referral_id: "${ref_u}", investigator_id: "${inv_id}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { invn_u: $.data.id }
            - call: "POST /investigations/${invn_u}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /referrals"
              payload: { reporter_type: "MANDATED", child_name: "Child S", alleged_maltreatment: "PHYSICAL_ABUSE", priority_factors: ["INJURY_VISIBLE", "PRIOR_REPORT"] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_s: $.data.id }
            - call: "POST /referrals/${ref_s}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
            - call: "POST /investigations"
              payload: { referral_id: "${ref_s}", investigator_id: "${inv_id}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { invn_s: $.data.id }
            - call: "POST /investigations/${invn_s}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /investigations/${invn_u}/decision"
              payload: { safety_factors: ["NO_FOOD", "MEDICAL_NEGLECT", "DRUG_ENV", "UNSAFE_SLEEP"], protective_capacity: 0 }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /investigations/${invn_s}/decision"
              payload: { safety_factors: ["NO_FOOD"], protective_capacity: 5 }
              as: Investigator
              as_user_id: "${inv_id}"
          assert:
            - "Investigation.${invn_u}.safety_decision_score == 93"
            - "Investigation.${invn_u}.status == UNSAFE"
            - "Investigation.${invn_u}.removal_recommended == true"
            - "Investigation.${invn_s}.safety_decision_score == 0"
            - "Investigation.${invn_s}.status == SAFE"
            - "Investigation.${invn_s}.removal_recommended == false"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: safety_score_nested_minmax_with_conditional_override
        grounds:
          - calculations.safety_assessment_score
          - state_machines.Investigation.IN_PROGRESS_to_UNSAFE
        distinguishing_aspect: |
          Mode (a): ≥3 inputs (danger set, protective_capacity, override factor) with nested
          min (credit cap) then max (floor 0) then a conditional categorical override that forces
          the score to REMOVAL_THRESHOLD — non-linear interaction, not a flat tiered rate.
        test_recipe:
          setup:
            - "Clock fixed; SCREENER+INVESTIGATOR+CASEWORKER exist; a screened-in referral has an IN_PROGRESS investigation."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "sara3@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Ivan", role_type: "INVESTIGATOR", email: "ivan3@x.gov" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Cara", role_type: "CASEWORKER", email: "cara3@x.gov" }
              as: Admin
              captures: { cw_id: $.data.id }
            - call: "POST /referrals"
              payload: { reporter_type: "MANDATED", child_name: "Child O", alleged_maltreatment: "PHYSICAL_ABUSE", priority_factors: ["INJURY_VISIBLE", "PRIOR_REPORT"] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_o: $.data.id }
            - call: "POST /referrals/${ref_o}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
            - call: "POST /investigations"
              payload: { referral_id: "${ref_o}", investigator_id: "${inv_id}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { invn_o: $.data.id }
            - call: "POST /investigations/${invn_o}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /investigations/${invn_o}/decision"
              payload: { safety_factors: ["SUPERVISION_ABSENT", "NO_FOOD"], protective_capacity: 10 }
              as: Investigator
              as_user_id: "${inv_id}"
          assert:
            - "Investigation.${invn_o}.safety_decision_score == 70"
            - "Investigation.${invn_o}.status == UNSAFE"
            - "Investigation.${invn_o}.removal_recommended == true"

      - name: screening_score_ceiling_clamp_order
        grounds:
          - calculations.intake_screening_score
          - state_machines.Referral.RECEIVED_to_SCREENED_IN
        distinguishing_aspect: |
          Mode (b): summation-then-clamp ordering is load-bearing — raw 121 (50+30+15+18+8) is
          min()-clamped to 100 AFTER summation; clamping per-term would lose the overage. The
          pinned order (sum first, clamp second) yields exactly 100, a different cents/integer
          result from any clamp-first interpretation.
        test_recipe:
          setup:
            - "Clock fixed; one SCREENER exists; a RECEIVED referral with maximal factors exists."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "sara4@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
            - call: "POST /referrals"
              payload: { reporter_type: "MANDATED", child_name: "Child C", alleged_maltreatment: "SEXUAL_ABUSE", priority_factors: ["NO_CAREGIVER", "INJURY_VISIBLE", "AGE_UNDER_3"] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_c: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_c}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
          assert:
            - "Referral.${ref_c}.screening_score == 100"
            - "Referral.${ref_c}.status == SCREENED_IN"
            - "Referral.${ref_c}.response_priority == P1_24H"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: placement_disruption_cycle_then_replace
        grounds:
          - state_machines.Placement.ACTIVE_to_DISRUPTED
          - state_machines.Child.PLACED_to_REMOVED
        distinguishing_aspect: |
          PLACEMENT exhibits a cycle: ACTIVE placement disrupts (child -> REMOVED), and the same
          REMOVED child is re-placed via a brand-new ACTIVE Placement — a loop back to a placed
          state on a different entity than the Case fork.
        test_recipe:
          setup:
            - "A child is PLACED in home H1 (cap>=1); a second licensed home H2 (cap>=1) exists with beds free."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "sara5@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Ivan", role_type: "INVESTIGATOR", email: "ivan5@x.gov" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Cara", role_type: "CASEWORKER", email: "cara5@x.gov" }
              as: Admin
              captures: { cw_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Lara", role_type: "LICENSING", email: "lara5@x.gov" }
              as: Admin
              captures: { lic_id: $.data.id }
            - call: "POST /referrals"
              payload: { reporter_type: "MANDATED", child_name: "Child P", alleged_maltreatment: "PHYSICAL_ABUSE", priority_factors: ["INJURY_VISIBLE", "PRIOR_REPORT"] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_p: $.data.id }
            - call: "POST /referrals/${ref_p}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
            - call: "POST /investigations"
              payload: { referral_id: "${ref_p}", investigator_id: "${inv_id}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { invn_p: $.data.id }
            - call: "POST /investigations/${invn_p}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /investigations/${invn_p}/decision"
              payload: { safety_factors: ["NO_FOOD", "MEDICAL_NEGLECT", "DRUG_ENV", "UNSAFE_SLEEP"], protective_capacity: 0 }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases"
              payload: { investigation_id: "${invn_p}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { case_p: $.data.id }
            - call: "POST /children"
              payload: { case_id: "${case_p}", full_name: "Child P", date_of_birth: "2016-01-01T00:00:00Z" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { child_p: $.data.id }
            - call: "POST /foster-homes"
              payload: { licensing_worker_id: "${lic_id}", home_name: "Home H1", bed_capacity: 1, max_age_years: 18, accepts_maltreatment: ["PHYSICAL_ABUSE"] }
              as: LicensingWorker
              as_user_id: "${lic_id}"
              captures: { h1: $.data.id, h1_v0: $.data.version }
            - call: "POST /caregiver-screenings"
              payload: { foster_home_id: "${h1}", member_name: "Foster Mom 1" }
              as: LicensingWorker
              as_user_id: "${lic_id}"
              captures: { scr_h1: $.data.id }
            - call: "POST /caregiver-screenings/${scr_h1}/resolve"
              payload: {}
              as: LicensingWorker
              as_user_id: "${lic_id}"
            - call: "POST /foster-homes/${h1}/license"
              payload: { expected_foster_home_version: "${h1_v0}" }
              as: LicensingWorker
              as_user_id: "${lic_id}"
              captures: { h1_v1: $.data.version }
            - call: "POST /foster-homes"
              payload: { licensing_worker_id: "${lic_id}", home_name: "Home H2", bed_capacity: 1, max_age_years: 18, accepts_maltreatment: ["PHYSICAL_ABUSE"] }
              as: LicensingWorker
              as_user_id: "${lic_id}"
              captures: { h2: $.data.id, h2_v0: $.data.version }
            - call: "POST /caregiver-screenings"
              payload: { foster_home_id: "${h2}", member_name: "Foster Mom 2" }
              as: LicensingWorker
              as_user_id: "${lic_id}"
              captures: { scr_h2: $.data.id }
            - call: "POST /caregiver-screenings/${scr_h2}/resolve"
              payload: {}
              as: LicensingWorker
              as_user_id: "${lic_id}"
            - call: "POST /foster-homes/${h2}/license"
              payload: { expected_foster_home_version: "${h2_v0}" }
              as: LicensingWorker
              as_user_id: "${lic_id}"
              captures: { h2_v1: $.data.version }
            - call: "POST /placements"
              payload: { child_id: "${child_p}", foster_home_id: "${h1}", expected_foster_home_version: "${h1_v1}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { plc1: $.data.id }
          trigger:
            - call: "POST /placements/${plc1}/disrupt"
              payload: {}
              as: Caseworker
              as_user_id: "${cw_id}"
            - call: "POST /placements"
              payload: { child_id: "${child_p}", foster_home_id: "${h2}", expected_foster_home_version: "${h2_v1}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { plc2: $.data.id }
          assert:
            - "Placement.${plc1}.status == DISRUPTED"
            - "Placement.${plc2}.status == ACTIVE"
            - "Child.${child_p}.status == PLACED"
            - "Child.${child_p}.current_placement_id == ${plc2}"

      - name: case_permanency_branching_fork_adoption
        grounds:
          - state_machines.Case.PERMANENCY_PLANNING_to_CLOSED_ADOPTED
          - state_machines.Case.PERMANENCY_PLANNING_to_CLOSED_REUNIFIED
          - state_machines.Case.PERMANENCY_PLANNING_to_CLOSED_APPLA
        distinguishing_aspect: |
          CASE exhibits a 3-way branching fork from PERMANENCY_PLANNING (CLOSED_REUNIFIED vs
          CLOSED_ADOPTED vs CLOSED_APPLA), each with divergent gates/side-effects — a different
          entity from Placement and a fork rather than a cycle.
        test_recipe:
          setup:
            - "A case is in PERMANENCY_PLANNING with permanency_goal ADOPTION (set by a HELD hearing with CHANGE_GOAL_ADOPTION), and a HELD TPR hearing ruling TERMINATE_RIGHTS exists; the placed child's placement was ended-adopted."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "sara6@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Ivan", role_type: "INVESTIGATOR", email: "ivan6@x.gov" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Cara", role_type: "CASEWORKER", email: "cara6@x.gov" }
              as: Admin
              captures: { cw_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Lara", role_type: "LICENSING", email: "lara6@x.gov" }
              as: Admin
              captures: { lic_id: $.data.id }
            - call: "POST /referrals"
              payload: { reporter_type: "MANDATED", child_name: "Child A", alleged_maltreatment: "PHYSICAL_ABUSE", priority_factors: ["INJURY_VISIBLE", "PRIOR_REPORT"] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_a: $.data.id }
            - call: "POST /referrals/${ref_a}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
            - call: "POST /investigations"
              payload: { referral_id: "${ref_a}", investigator_id: "${inv_id}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { invn_a: $.data.id }
            - call: "POST /investigations/${invn_a}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /investigations/${invn_a}/decision"
              payload: { safety_factors: ["NO_FOOD", "MEDICAL_NEGLECT", "DRUG_ENV", "UNSAFE_SLEEP"], protective_capacity: 0 }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases"
              payload: { investigation_id: "${invn_a}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { case_a: $.data.id }
            - call: "POST /children"
              payload: { case_id: "${case_a}", full_name: "Child A", date_of_birth: "2016-01-01T00:00:00Z" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { child_a: $.data.id }
            - call: "POST /foster-homes"
              payload: { licensing_worker_id: "${lic_id}", home_name: "Home A1", bed_capacity: 1, max_age_years: 18, accepts_maltreatment: ["PHYSICAL_ABUSE"] }
              as: LicensingWorker
              as_user_id: "${lic_id}"
              captures: { ha: $.data.id, ha_v0: $.data.version }
            - call: "POST /caregiver-screenings"
              payload: { foster_home_id: "${ha}", member_name: "Foster Mom A" }
              as: LicensingWorker
              as_user_id: "${lic_id}"
              captures: { scr_ha: $.data.id }
            - call: "POST /caregiver-screenings/${scr_ha}/resolve"
              payload: {}
              as: LicensingWorker
              as_user_id: "${lic_id}"
            - call: "POST /foster-homes/${ha}/license"
              payload: { expected_foster_home_version: "${ha_v0}" }
              as: LicensingWorker
              as_user_id: "${lic_id}"
              captures: { ha_v1: $.data.version }
            - call: "POST /placements"
              payload: { child_id: "${child_a}", foster_home_id: "${ha}", expected_foster_home_version: "${ha_v1}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { plc_a: $.data.id }
            - call: "POST /hearings"
              payload: { case_id: "${case_a}", hearing_type: "PERMANENCY", scheduled_at: "2026-01-01T01:00:00Z" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { hr_perm: $.data.id }
            - call: "POST /hearings/${hr_perm}/hold"
              payload: { ruling: "CHANGE_GOAL_ADOPTION" }
              as: Judge
            - call: "POST /cases/${case_a}/advance-permanency"
              payload: {}
              as: Caseworker
              as_user_id: "${cw_id}"
            - call: "POST /hearings"
              payload: { case_id: "${case_a}", hearing_type: "TPR", scheduled_at: "2026-01-01T03:00:00Z" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { hr_tpr: $.data.id }
            - call: "POST /hearings/${hr_tpr}/hold"
              payload: { ruling: "TERMINATE_RIGHTS" }
              as: Judge
            - call: "POST /placements/${plc_a}/end-adopted"
              payload: {}
              as: Caseworker
              as_user_id: "${cw_id}"
          trigger:
            - call: "POST /cases/${case_a}/close"
              payload: {}
              as: Caseworker
              as_user_id: "${cw_id}"
          assert:
            - "Case.${case_a}.status == CLOSED_ADOPTED"
            - "Case.${case_a}.permanency_goal == ADOPTION"
            - "Child.${child_a}.status == PERMANENT"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: suspend_home_cascade_depth3
        grounds:
          - state_machines.FosterHome.LICENSED_to_SUSPENDED
          - state_machines.Placement.ACTIVE_to_DISRUPTED
          - state_machines.Child.PLACED_to_REMOVED
        distinguishing_aspect: |
          Depth-3 cascade from FosterHome suspension: suspend(home) -> the home's ACTIVE placement
          is disrupted -> the disrupted placement's child is set REMOVED and its home bed counter
          zeroed. Each hop is caused by the previous hop, originating from the SUSPEND trigger.
        test_recipe:
          setup:
            - "A child is PLACED in a LICENSED home (active_placement_count == 1)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Admin
