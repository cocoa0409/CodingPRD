        grounds:
          - calculations.hazard_base_premium.precision
        excluded_because:
          difficulty_instance: high_limit_load_attaches_exactly_at_75000000_and_rounds_half_up
          rationale: "That §1.8 boundary_precision_check instance already pins the single half-up rounding of the factor product and the exact attachment of HIGH_LIMIT_LOAD at 75,000,000 cents, probing one cent below, exactly at, and one cent above the threshold. A separate precision test would assert the same rounding on weaker data."

