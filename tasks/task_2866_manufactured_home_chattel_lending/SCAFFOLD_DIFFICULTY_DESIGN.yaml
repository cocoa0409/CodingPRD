# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Domain: Manufactured Home Chattel Lending (api_prefix /chattel)
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7; every numeric assert below was computed by executing
# the §1.3 formulas with their declared constants.
#
# Logical clock default is 2026-08-01T00:00:00Z (POST /chattel/_clock/set_current_utc).
# Every chain sets it explicitly so valuation_year and every day count are pinned.

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: valuation_origination_vs_recovery_liquidation_on_one_unit
        grounds:
          - calculations.unit_book_valuation
          - entities.Valuation.fields.variant
          - entities.Valuation.fields.installation_adjustment_cents
          - entities.Valuation.fields.forced_sale_discount_cents
          - entities.Valuation.fields.detach_and_move_cost_cents
          - concurrency_rules[valuation-create-stale-unit]
        distinguishing_aspect: "The two variants operate on the COLLATERAL-ASSET domain (ManufacturedUnit + BookValueGuide): ORIGINATION adds INSTALLATION_ADJUSTMENT_CENTS and takes no discount, RECOVERY_LIQUIDATION drops that adjustment to 0 and subtracts a 2200 bps forced-sale discount, so the same unit and guide certify 5776403 versus 4310594 - a 1465809 delta."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One BookValueGuide effective 2026-01-01 with base 4500 c/sqft, multi-wide multiplier 11500 bps, annual depreciation 350 bps."
            - "One Community with an EXECUTED operator agreement, so the location key resolves to COMMUNITY_WITH_AGREEMENT for both valuations."
            - "One ManufacturedUnit: 1440 sqft MULTI_WIDE, model_year 2018, GOOD, PIER_AND_ANCHOR, wind_zone 2, placed on lot A-14 of that community."
            - "One CERTIFIED ORIGINATION Valuation of that unit."
          setup_api_calls:
            - call: "POST /chattel/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chattel/book-value-guides"
              payload: { guide_edition: "NADA-2026-SPRING", region_code: "SOUTH_ATLANTIC", effective_date: "2026-01-01T00:00:00Z", base_value_per_sqft_cents: 4500, single_wide_multiplier_bps: 10000, multi_wide_multiplier_bps: 11500, annual_depreciation_bps: 350 }
              as: PlatformAdmin
              captures: { g1: "$.data.id" }
            - call: "POST /chattel/communities"
              payload: { name: "Pine Ridge MHC", state_code: "GA", lot_count: 180, monthly_lot_rent_cents: 52000, sales_commission_bps: 150 }
              as: PlatformAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /chattel/communities/${c1}/operator-agreement"
              payload: { action: "PROPOSE" }
              as: PlatformAdmin
            - call: "POST /chattel/communities/${c1}/operator-agreement"
              payload: { action: "EXECUTE" }
              as: CommunityOperator
              as_user_id: "${c1}"
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "COMMUNITY", community_id: "${c1}", lot_number: "A-14", placement_start_date: "2026-08-01T00:00:00Z" }
              as: ClosingAgent
              captures: { u1: "$.data.id", u1_v: "$.data.version" }
            - call: "POST /chattel/valuations"
              payload: { unit_id: "${u1}", guide_id: "${g1}", variant: "ORIGINATION", expected_unit_version: "${u1_v}" }
              as: CreditAnalyst
              captures: { v1: "$.data.id" }
            - call: "POST /chattel/valuations/${v1}/certify"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-val-01"
          trigger:
            - call: "GET /chattel/units/${u1}"
              payload: {}
              as: RecoveryManager
              captures: { u1_v2: "$.data.version" }
            - call: "POST /chattel/valuations"
              payload: { unit_id: "${u1}", guide_id: "${g1}", variant: "RECOVERY_LIQUIDATION", expected_unit_version: "${u1_v2}" }
              as: RecoveryManager
              captures: { v1r: "$.data.id" }
          assert:
            - "Valuation.${v1}.location_key == COMMUNITY_WITH_AGREEMENT"
            - "Valuation.${v1r}.location_key == COMMUNITY_WITH_AGREEMENT"
            - "Valuation.${v1}.book_base_cents == 5365440"
            - "Valuation.${v1r}.book_base_cents == 5365440"
            - "Valuation.${v1}.condition_adjustment_cents == 0"
            - "Valuation.${v1}.location_adjustment_cents == 160963"
            - "Valuation.${v1r}.location_adjustment_cents == 160963"
            - "Valuation.${v1}.installation_adjustment_cents == 250000"
            - "Valuation.${v1r}.installation_adjustment_cents == 0"
            - "Valuation.${v1}.forced_sale_discount_cents == 0"
            - "Valuation.${v1}.detach_and_move_cost_cents == 0"
            - "Valuation.${v1r}.forced_sale_discount_cents == 1215809"
            - "Valuation.${v1r}.detach_and_move_cost_cents == 0"
            - "Valuation.${v1}.certified_value_cents == 5776403"
            - "Valuation.${v1r}.certified_value_cents == 4310594"
            - "Valuation.${v1}.certified_value_cents - Valuation.${v1r}.certified_value_cents == 1465809"
            - "Valuation.${v1}.status == CERTIFIED (a different-variant valuation does not supersede it)"
            - "Valuation.${v1r}.status == DRAFT"

      - name: payment_allocation_chattel_order_vs_real_property_escrow_first
        grounds:
          - calculations.payment_waterfall_allocation
          - calculations.interest_accrual
          - calculations.force_placed_premium
          - entities.PaymentTransaction.fields.allocation_variant
          - state_machines.ManufacturedUnit.classification.CONVERSION_PENDING_to_REAL_PROPERTY
        distinguishing_aspect: "The two variants operate on the CASH-LEDGER domain (Loan obligation buckets): two identical 100000-cent payments posted at the same clock instant on the same loan with the same bucket balances allocate 84564/3500/11936 to interest/fees/force-placed under CHATTEL_CONTRACT_ORDER and 100000 wholly to escrow under REAL_PROPERTY_ESCROW_FIRST, because the unit's classification flipped between them."
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-10-01T00:00:00Z."
            - "One FUNDED private-land loan of 4600000 cents at apr_bps 1100, first_due_date 2026-09-01, escrow_target_cents 200000, escrow_balance_cents 0."
            - "Its borrower-provided policy expired 2026-10-01 and lapsed at the servicing assessment, so a FORCE_PLACED policy of 179515 cents premium is outstanding."
            - "The assessment left interest_accrued_unpaid_cents 84564 (61 days) and fees_outstanding_cents 3500, servicing_state DELINQUENT."
            - "The first payment clears interest and fees and part of the force-placed premium, returning the loan to CURRENT with next_due_date 2026-10-01."
            - "The unit is then converted to REAL_PROPERTY, flipping loan.collateral_classification."
          setup_api_calls:
            - call: "POST /chattel/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chattel/book-value-guides"
              payload: { guide_edition: "NADA-2026-SPRING", region_code: "SOUTH_ATLANTIC", effective_date: "2026-01-01T00:00:00Z", base_value_per_sqft_cents: 4500, single_wide_multiplier_bps: 10000, multi_wide_multiplier_bps: 11500, annual_depreciation_bps: 350 }
              as: PlatformAdmin
              captures: { g1: "$.data.id" }
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Dana Whitfield", credit_score: 705, monthly_income_cents: 520000, state_code: "GA" }
              as: PlatformAdmin
              captures: { b1: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0555111", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PERMANENT_FOUNDATION", wind_zone: 2, placement_type: "PRIVATE_LAND", land_owner_borrower_id: "${b1}", land_parcel_apn: "071-14-002", land_county: "Coweta", land_value_cents: 3200000 }
              as: ClosingAgent
              captures: { u2: "$.data.id", u2_v: "$.data.version" }
            - call: "POST /chattel/valuations"
              payload: { unit_id: "${u2}", guide_id: "${g1}", variant: "ORIGINATION", expected_unit_version: "${u2_v}" }
              as: CreditAnalyst
              captures: { v2: "$.data.id" }
            - call: "POST /chattel/valuations/${v2}/certify"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-val-01"
            - call: "POST /chattel/loans"
              payload: { borrower_id: "${b1}", unit_id: "${u2}", origination_valuation_id: "${v2}", principal_cents: 4600000, requested_term_months: 240 }
              as: CreditAnalyst
              captures: { l2: "$.data.id" }
            - call: "POST /chattel/loans/${l2}/submit-underwriting"
              payload: {}
              as: CreditAnalyst
            - call: "POST /chattel/loans/${l2}/approve"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-uw-02"
              captures: { l2_v: "$.data.version" }
            - call: "POST /chattel/insurance-policies"
              payload: { loan_id: "${l2}", carrier_name: "Gulf Mutual", policy_number: "GM-77120", dwelling_coverage_cents: 5400000, wind_deductible_cents: 150000, wind_endorsement: true, effective_date: "2026-08-01T00:00:00Z", expiry_date: "2026-10-01T00:00:00Z", expected_loan_version: "${l2_v}" }
              as: ClosingAgent
              captures: { p2: "$.data.id" }
            - call: "POST /chattel/lien-filings"
              payload: { loan_id: "${l2}", filing_type: "TITLE_LIEN", submitted_documents: ["TITLE_APPLICATION", "LIEN_ENTRY_FORM"] }
              as: ClosingAgent
              captures: { f2: "$.data.id" }
            - call: "POST /chattel/lien-filings/${f2}/agency-response"
              payload: { outcome: "RECORDED", agency_reference: "GA-TL-2026-88421" }
              as: PlatformAdmin
            - call: "POST /chattel/loans/${l2}/fund"
              payload: { first_due_date: "2026-09-01T00:00:00Z", escrow_target_cents: 200000 }
              as: ClosingAgent
            - call: "POST /chattel/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chattel/loans/${l2}/servicing-assessment"
              payload: {}
              as: Servicer
            - call: "POST /chattel/loans/${l2}/force-place-insurance"
              payload: { carrier_name: "Lender Placed Casualty", policy_number: "LPC-40881", effective_date: "2026-10-01T00:00:00Z", expiry_date: "2027-10-01T00:00:00Z" }
              as: Servicer
              captures: { pfp: "$.data.id" }
          trigger:
            - call: "POST /chattel/loans/${l2}/payments"
              payload: { amount_cents: 100000, payment_kind: "PARTIAL" }
              as: Servicer
              captures: { pay1: "$.data.id" }
            - call: "POST /chattel/units/${u2}/land-documents"
              payload: { document_type: "DEED" }
              as: ClosingAgent
            - call: "POST /chattel/units/${u2}/land-documents"
              payload: { document_type: "AFFIXATION_AFFIDAVIT" }
              as: ClosingAgent
            - call: "POST /chattel/units/${u2}/convert-classification"
              payload: { action: "INITIATE" }
              as: ClosingAgent
            - call: "POST /chattel/units/${u2}/convert-classification"
              payload: { action: "COMPLETE" }
              as: ClosingAgent
            - call: "POST /chattel/loans/${l2}/payments"
              payload: { amount_cents: 100000, payment_kind: "PARTIAL" }
              as: Servicer
              captures: { pay2: "$.data.id" }
          assert:
            - "InsurancePolicy.${pfp}.premium_cents == 179515"
            - "PaymentTransaction.${pay1}.allocation_variant == CHATTEL_CONTRACT_ORDER"
            - "PaymentTransaction.${pay1}.accrual_days == 0"
            - "PaymentTransaction.${pay1}.to_interest_cents == 84564"
            - "PaymentTransaction.${pay1}.to_fees_cents == 3500"
            - "PaymentTransaction.${pay1}.to_force_placed_cents == 11936"
            - "PaymentTransaction.${pay1}.to_escrow_cents == 0"
            - "PaymentTransaction.${pay1}.to_principal_cents == 0"
            - "Loan.${l2}.collateral_classification == REAL_PROPERTY"
            - "PaymentTransaction.${pay2}.allocation_variant == REAL_PROPERTY_ESCROW_FIRST"
            - "PaymentTransaction.${pay2}.accrual_days == 0"
            - "PaymentTransaction.${pay2}.to_escrow_cents == 100000"
            - "PaymentTransaction.${pay2}.to_force_placed_cents == 0"
            - "PaymentTransaction.${pay2}.to_interest_cents == 0"
            - "PaymentTransaction.${pay2}.to_fees_cents == 0"
            - "PaymentTransaction.${pay2}.to_principal_cents == 0"
            - "Loan.${l2}.escrow_balance_cents == 100000"
            - "Loan.${l2}.force_placed_premium_outstanding_cents == 167579"
            - "Loan.${l2}.principal_balance_cents == 4600000"

  - rule_id: combinatorial_formula
    instances:

      - name: rate_and_term_nested_clamp_by_remaining_useful_life
        grounds:
          - calculations.loan_rate_and_term
          - calculations.unit_book_valuation
          - entities.Loan.fields.apr_bps
          - entities.Loan.fields.term_months
          - entities.Loan.fields.ltv_bps
          - validations[priority=60]
          - validations[priority=61]
        distinguishing_aspect: "Combination mode (a) - six independent additive inputs (base 875, placement 50, classification 175, credit tier -125, ltv tier 150, wind surcharge 60) stack into one raw rate that then passes a two-sided clamp, while term is a four-way nested min in which the FOURTH cap (remaining useful life 120 months on a 1996 unit) binds and defeats the requested 240, the placement cap 300 and the classification cap 240."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z so valuation_year == 2026."
            - "Borrower credit_score 745 (the 720-779 tier, -125 bps)."
            - "One 1080 sqft SINGLE_WIDE model_year 1996 FAIR PIER_AND_ANCHOR unit in wind_zone 3 on the borrower's own land, so depreciation hits the 7000 bps floor cap and the wind surcharge applies."
            - "A CERTIFIED ORIGINATION valuation of 1664260 cents on that unit."
            - "A DRAFT loan of 1500000 cents requesting 240 months."
          setup_api_calls:
            - call: "POST /chattel/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chattel/book-value-guides"
              payload: { guide_edition: "NADA-2026-SPRING", region_code: "SOUTH_ATLANTIC", effective_date: "2026-01-01T00:00:00Z", base_value_per_sqft_cents: 4500, single_wide_multiplier_bps: 10000, multi_wide_multiplier_bps: 11500, annual_depreciation_bps: 350 }
              as: PlatformAdmin
              captures: { g1: "$.data.id" }
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Marcus Ojeda", credit_score: 745, monthly_income_cents: 410000, state_code: "GA" }
              as: PlatformAdmin
              captures: { b4: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0196774", manufacturer: "Fleetwood", model_year: 1996, width_class: "SINGLE_WIDE", square_feet: 1080, condition_grade: "FAIR", installation_type: "PIER_AND_ANCHOR", wind_zone: 3, placement_type: "PRIVATE_LAND", land_owner_borrower_id: "${b4}", land_parcel_apn: "112-08-119", land_county: "Bulloch", land_value_cents: 1400000 }
              as: ClosingAgent
              captures: { u4: "$.data.id", u4_v: "$.data.version" }
            - call: "POST /chattel/valuations"
              payload: { unit_id: "${u4}", guide_id: "${g1}", variant: "ORIGINATION", expected_unit_version: "${u4_v}" }
              as: CreditAnalyst
              captures: { v4: "$.data.id" }
            - call: "POST /chattel/valuations/${v4}/certify"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-val-01"
            - call: "POST /chattel/loans"
              payload: { borrower_id: "${b4}", unit_id: "${u4}", origination_valuation_id: "${v4}", principal_cents: 1500000, requested_term_months: 240 }
              as: CreditAnalyst
              captures: { l4: "$.data.id" }
          trigger:
            - call: "POST /chattel/loans/${l4}/submit-underwriting"
              payload: {}
              as: CreditAnalyst
          assert:
            - "Valuation.${v4}.book_base_cents == 1458000"
            - "Valuation.${v4}.condition_adjustment_cents == -174960"
            - "Valuation.${v4}.location_adjustment_cents == 131220"
            - "Valuation.${v4}.installation_adjustment_cents == 250000"
            - "Valuation.${v4}.certified_value_cents == 1664260"
            - "Loan.${l4}.ltv_bps == 9013"
            - "Loan.${l4}.apr_bps == 1185"
            - "Loan.${l4}.term_months == 120"
            - "Loan.${l4}.underwriting_state == UNDERWRITING"
            - "response status == 200 (term_months 120 >= MIN_TERM_MONTHS 60, so ERR_TERM_FLOOR_UNREACHABLE does not fire)"

      - name: deficiency_settlement_commission_tier_keyed_on_gross_proceeds
        grounds:
          - calculations.deficiency_settlement
          - calculations.interest_accrual
          - entities.RecoveryCase.fields.commission_bps
          - entities.RecoveryCase.fields.refurbishment_line_items
          - entities.RecoveryCase.fields.surplus_cents
          - state_machines.RecoveryCase.status.REMARKETING_to_CLOSED_SURPLUS
        distinguishing_aspect: "Combination mode (c) - evaluation ORDER decides the answer twice over: the commission tier is selected from gross_proceeds_cents 6100000 (400 bps, plus the community's 150 bps) BEFORE the commission is subtracted, so keying it off net_proceeds_cents 5559500 would have selected 550 bps; and the same 40000 cents of refurbishment lands on payoff_amount_cents when cost_class == EXPENSED but on net_proceeds_cents when cost_class == CAPITALIZED."
        test_recipe:
          setup:
            - "Logical clock walked 2026-08-01 -> 2026-11-01 -> 2026-11-12 -> 2026-11-22."
            - "One FUNDED community chattel loan of 4600000 cents at apr_bps 1275, first_due_date 2026-09-01, escrow_target 200000, escrow_balance 0."
            - "Two servicing assessments (92 days then 11 days) leave interest_accrued_unpaid_cents 165505 and one 3500-cent late fee."
            - "A RecoveryCase on the REPOSSESSION path with the 185000-cent repossession expense seed, possession taken 2026-11-22."
            - "A CERTIFIED RECOVERY_LIQUIDATION valuation, one CAPITALIZED refurbishment line of 205000 and one EXPENSED line of 40000, case in REMARKETING."
          setup_api_calls:
            - call: "POST /chattel/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chattel/book-value-guides"
              payload: { guide_edition: "NADA-2026-SPRING", region_code: "SOUTH_ATLANTIC", effective_date: "2026-01-01T00:00:00Z", base_value_per_sqft_cents: 4500, single_wide_multiplier_bps: 10000, multi_wide_multiplier_bps: 11500, annual_depreciation_bps: 350 }
              as: PlatformAdmin
              captures: { g1: "$.data.id" }
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Dana Whitfield", credit_score: 705, monthly_income_cents: 520000, state_code: "GA" }
              as: PlatformAdmin
              captures: { b1: "$.data.id" }
            - call: "POST /chattel/communities"
              payload: { name: "Pine Ridge MHC", state_code: "GA", lot_count: 180, monthly_lot_rent_cents: 52000, sales_commission_bps: 150 }
              as: PlatformAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /chattel/communities/${c1}/operator-agreement"
              payload: { action: "PROPOSE" }
              as: PlatformAdmin
            - call: "POST /chattel/communities/${c1}/operator-agreement"
              payload: { action: "EXECUTE" }
              as: CommunityOperator
              as_user_id: "${c1}"
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "COMMUNITY", community_id: "${c1}", lot_number: "A-14", placement_start_date: "2026-08-01T00:00:00Z" }
              as: ClosingAgent
              captures: { u1: "$.data.id", u1_v: "$.data.version" }
            - call: "POST /chattel/valuations"
              payload: { unit_id: "${u1}", guide_id: "${g1}", variant: "ORIGINATION", expected_unit_version: "${u1_v}" }
              as: CreditAnalyst
              captures: { v1: "$.data.id" }
            - call: "POST /chattel/valuations/${v1}/certify"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-val-01"
            - call: "POST /chattel/loans"
              payload: { borrower_id: "${b1}", unit_id: "${u1}", origination_valuation_id: "${v1}", principal_cents: 4600000, requested_term_months: 240 }
              as: CreditAnalyst
              captures: { l1: "$.data.id" }
            - call: "POST /chattel/loans/${l1}/submit-underwriting"
              payload: {}
              as: CreditAnalyst
            - call: "POST /chattel/loans/${l1}/approve"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-uw-02"
              captures: { l1_v: "$.data.version" }
            - call: "POST /chattel/insurance-policies"
              payload: { loan_id: "${l1}", carrier_name: "Gulf Mutual", policy_number: "GM-77120", dwelling_coverage_cents: 5200000, wind_deductible_cents: 150000, wind_endorsement: true, effective_date: "2026-08-01T00:00:00Z", expiry_date: "2027-08-01T00:00:00Z", expected_loan_version: "${l1_v}" }
              as: ClosingAgent
              captures: { p1: "$.data.id" }
            - call: "POST /chattel/lien-filings"
              payload: { loan_id: "${l1}", filing_type: "TITLE_LIEN", submitted_documents: ["TITLE_APPLICATION", "LIEN_ENTRY_FORM"] }
              as: ClosingAgent
              captures: { f1: "$.data.id" }
            - call: "POST /chattel/lien-filings/${f1}/agency-response"
              payload: { outcome: "RECORDED", agency_reference: "GA-TL-2026-88421" }
              as: PlatformAdmin
            - call: "POST /chattel/loans/${l1}/fund"
              payload: { first_due_date: "2026-09-01T00:00:00Z", escrow_target_cents: 200000 }
              as: ClosingAgent
            - call: "POST /chattel/_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chattel/loans/${l1}/servicing-assessment"
              payload: {}
              as: Servicer
            - call: "POST /chattel/_clock/set_current_utc"
              payload: { current_utc: "2026-11-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chattel/loans/${l1}/servicing-assessment"
              payload: {}
              as: Servicer
            - call: "POST /chattel/loans/${l1}/default-declare"
              payload: {}
              as: RecoveryManager
              captures: { rc1: "$.data.id" }
            - call: "POST /chattel/recovery-cases/${rc1}/issue-notice"
              payload: { notice_reference: "RTC-2026-0455" }
