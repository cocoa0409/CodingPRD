  # =========================================================================
  # RULE 5 — priority-pair validation conflicts on DIFFERENT category pairs
  #   instance 1: business_referential (56) beats business_fiscal (70)
  #   instance 2: business_safety (50) beats business_referential (55)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: referential_before_fiscal_on_label_grant_request
        category_pair: [business_referential, business_fiscal]
        grounds:
          - validations.priority_56_ERR_ASSESSMENT_NOT_APPROVED
          - validations.priority_70_ERR_SPONSOR_DELINQUENT
