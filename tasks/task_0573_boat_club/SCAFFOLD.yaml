# =============================================================================
# PRD-bench seed tables — Boat Club & Membership Boating (Freedom Boat Club style)
# Difficulty: Expert
# =============================================================================

scenario: |
  573. Boat Club & Membership Boating (Freedom Boat Club style): membership tier &
  home dock, fleet (boat type) reservation & rotation, certification/orientation
  requirement, reciprocal-club access, no-show/late & damage fee, fuel & cleaning,
  training schedule, dues billing

domain_name: boat-club
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - selector_policy
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Peer collections linked by foreign keys; no nested ownership URLs. Every child
  # is discovered through a filtered-list GET on its own collection.

  state_machine_shape: cyclic
  # Boat (AVAILABLE->OUT->CLEANING->AVAILABLE) and Member (ACTIVE<->SUSPENDED) are
  # cyclic; Reservation is branching-with-revert (CONFIRMED can revert to REQUESTED
  # when its boat goes to MAINTENANCE).

  relationship_patterns:
    - one_to_many        # Dock -> Boats/Members/Reservations/TrainingSessions
    - cross_aggregate    # Reservation references Member + Dock + Boat across aggregates
    - many_to_many       # Member <-> TrainingSession via Enrollment junction

  role_model: hierarchical_override
  # Member (entity-backed, own resources) < DockStaff (operations) < ClubAdmin (superset).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: MembershipTier
    parent: null
    common_fields: false
    # Config entity keyed by its natural code. `id` holds the tier_code value
    # (identity only), plus created_at. No version; tiers are looked up by code.
    fields:
      - { name: id, type: string, source: system, description: "Identity = tier_code value; identity only, never a business decision input" }
      - { name: tier_code, type: enum, source: input, description: "Natural key", constraints: "one of {CRUISE, SAIL, UNLIMITED}; unique" }
      - { name: monthly_dues_cents, type: integer, source: input, description: "Base monthly dues in cents", constraints: ">= 0" }
      - { name: max_active_reservations, type: integer, source: input, description: "Max concurrent reservations in {REQUESTED, CONFIRMED, CHECKED_OUT}", constraints: ">= 1" }
      - { name: reservations_per_week, type: integer, source: input, description: "Weekly reservation allowance (Mon 00:00 UTC week)", constraints: ">= 1" }
      - { name: reciprocal_access_allowed, type: boolean, source: input, description: "May reserve boats at Docks with is_reciprocal=true" }
      - { name: advance_booking_days_max, type: integer, source: input, description: "Max days ahead of current clock a reservation start_time may be", constraints: ">= 1" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }

  - name: Dock
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dock name" }
      - { name: location_code, type: string, source: input, description: "Short location identifier" }
      - { name: capacity, type: integer, source: input, description: "Number of slips", constraints: ">= 1" }
      - { name: is_reciprocal, type: boolean, source: input, default: false, description: "True if this is a reciprocal-club dock (not a home-club dock)" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: membership_tier, type: enum, source: input, description: "Tier code", constraints: "one of {CRUISE, SAIL, UNLIMITED}; matches a MembershipTier.tier_code" }
      - { name: home_dock_id, type: string, source: input, description: "FK -> Dock.id; the member's home dock" }
      - { name: status, type: enum, source: system, default: PENDING_ORIENTATION, description: "PENDING_ORIENTATION | ACTIVE | SUSPENDED | CANCELLED" }
      - { name: orientation_completed, type: boolean, source: system, default: false, description: "True once an ORIENTATION training session is attended" }
      - { name: certification_level, type: enum, source: system, default: NONE, description: "NONE | BASIC | ADVANCED (ordered)" }
      - { name: no_show_strikes, type: integer, source: system, default: 0, description: "Count of NO_SHOW reservations since last reinstatement; reset to 0 on reinstate" }
      - { name: last_reinstated_at, type: datetime, source: system, description: "Clock time of most recent reinstatement, null if never" }
      - { name: outstanding_fees_cents, type: integer, source: computed, description: "Sum of amount_cents over this member's Fees with status=ASSESSED" }
      - { name: waived_fees_cents, type: integer, source: computed, description: "Sum of amount_cents over this member's Fees with status=WAIVED" }
      - { name: paid_fees_cents, type: integer, source: computed, description: "Sum of amount_cents over this member's Fees with status=PAID" }
      - { name: reservations_used_this_week, type: integer, source: computed, description: "Count of this member's Reservations with status in {CONFIRMED, CHECKED_OUT, RETURNED, NO_SHOW} whose start_time falls in the current clock's ISO week" }
      - { name: reservations_remaining_this_week, type: integer, source: computed, description: "max(0, tier.reservations_per_week - reservations_used_this_week)" }
      - { name: dues_balance_cents, type: integer, source: computed, description: "Sum of final_total_cents (or estimated_total_cents if unpaid) over DuesInvoices not in {PAID, VOID}" }

  - name: Boat
    parent: null
    common_fields: true
    fields:
      - { name: dock_id, type: string, source: input, description: "FK -> Dock.id; home dock of this boat" }
      - { name: boat_type, type: enum, source: input, description: "PONTOON | BOWRIDER | DECK_BOAT | CENTER_CONSOLE" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | OUT | CLEANING | MAINTENANCE" }
      - { name: fuel_level_pct, type: number, source: system, default: 100, description: "Current fuel gauge percentage 0..100" }
      - { name: usage_count, type: integer, source: system, default: 0, description: "Number of completed trips (increments on return); rotation ranking key" }
      - { name: needs_cleaning, type: boolean, source: system, default: false, description: "True while status=CLEANING" }
      - { name: last_used_at, type: datetime, source: system, description: "Clock time of most recent return, null if never used" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; who reserved" }
      - { name: dock_id, type: string, source: input, description: "FK -> Dock.id; pickup dock" }
      - { name: boat_type, type: enum, source: input, description: "Requested type: PONTOON | BOWRIDER | DECK_BOAT | CENTER_CONSOLE" }
      - { name: boat_id, type: string, source: system, description: "FK -> Boat.id; assigned by rotation at confirm, null while REQUESTED, cleared if boat goes to MAINTENANCE" }
      - { name: start_time, type: datetime, source: input, description: "Reservation window start (half-open [start,end))" }
      - { name: end_time, type: datetime, source: input, description: "Reservation window end", constraints: "end_time > start_time" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | CONFIRMED | CHECKED_OUT | RETURNED | NO_SHOW | CANCELLED" }
      - { name: fuel_at_checkout, type: number, source: system, description: "Fuel gauge pct recorded at checkout, null until checked out" }
      - { name: fuel_at_return, type: number, source: system, description: "Fuel gauge pct recorded at return, null until returned" }
      - { name: checkout_time, type: datetime, source: system, description: "Clock time of checkout, null until checked out" }
      - { name: return_time, type: datetime, source: system, description: "Clock time of return, null until returned" }
      - { name: provisional_fuel_fee_cents, type: integer, source: system, description: "Estimated fuel fee computed at checkout (forward-looking); null until checked out" }

  - name: TrainingSession
    parent: null
    common_fields: true
    fields:
      - { name: dock_id, type: string, source: input, description: "FK -> Dock.id; where the session is held" }
      - { name: session_type, type: enum, source: input, description: "ORIENTATION | BASIC_CERT | ADVANCED_CERT" }
      - { name: start_time, type: datetime, source: input, description: "Session start" }
      - { name: end_time, type: datetime, source: input, description: "Session end", constraints: "end_time > start_time" }
      - { name: capacity, type: integer, source: input, description: "Max enrollments", constraints: ">= 1" }
      - { name: instructor_name, type: string, source: input, description: "Instructor" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of Enrollments on this session with status in {ENROLLED, ATTENDED}" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | FULL | COMPLETED | CANCELLED" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; enrolled member" }
      - { name: session_id, type: string, source: input, description: "FK -> TrainingSession.id; enrolled session" }
      - { name: status, type: enum, source: system, default: ENROLLED, description: "ENROLLED | ATTENDED | NO_SHOW | CANCELLED" }

  - name: DamageReport
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; trip during which damage occurred" }
      - { name: boat_id, type: string, source: input, description: "FK -> Boat.id; damaged boat" }
      - { name: severity, type: enum, source: input, description: "MINOR | MODERATE | SEVERE" }
      - { name: repair_cost_cents, type: integer, source: input, description: "Estimated repair cost in cents", constraints: ">= 0" }
      - { name: assessed_fee_cents, type: integer, source: system, description: "Damage fee charged to member at assess, null until ASSESSED" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | ASSESSED | DISMISSED" }

  - name: Fee
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; who owes the fee" }
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id; originating trip, null for non-trip fees" }
      - { name: fee_type, type: enum, source: system, description: "NO_SHOW | LATE_RETURN | FUEL | CLEANING | DAMAGE" }
      - { name: amount_cents, type: integer, source: system, description: "Fee amount in cents" }
      - { name: status, type: enum, source: system, default: ASSESSED, description: "ASSESSED | WAIVED | PAID" }
      - { name: assessed_at, type: datetime, source: system, description: "Clock time the fee was assessed" }
      - { name: source_ref, type: string, source: system, description: "Originating object id (e.g., damage_report_id), null when not applicable" }

  - name: DuesInvoice
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; billed member" }
      - { name: period_start, type: datetime, source: input, description: "Billing period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Billing period end (exclusive)", constraints: "period_end > period_start" }
      - { name: base_dues_cents, type: integer, source: system, description: "Snapshot of tier.monthly_dues_cents at issue" }
      - { name: fees_rolled_cents, type: integer, source: computed, description: "Sum of per-fee taxed line totals; recomputed at issue (estimated) and at payment (final)" }
      - { name: estimated_total_cents, type: integer, source: system, description: "Forward-looking total pinned at issue time" }
      - { name: final_total_cents, type: integer, source: system, description: "Chronological total pinned at payment time, null until PAID" }
      - { name: rolled_fee_ids, type: array, source: system, description: "Ids of Fees folded into this invoice at payment" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | OVERDUE | PAID | VOID" }
      - { name: issued_at, type: datetime, source: system, description: "Clock time of issue" }
      - { name: paid_at, type: datetime, source: system, description: "Clock time of payment, null until PAID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Member: cyclic (ACTIVE <-> SUSPENDED) ----
  - entity: Member
    field: status
    initial_state: PENDING_ORIENTATION
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_ORIENTATION
        to: ACTIVE
        trigger: "POST /enrollments/{id}/mark-attendance with attended=true on an ORIENTATION session"
        actor: DockStaff
        preconditions:
          - "Enrollment.session references a TrainingSession with session_type=ORIENTATION"
        side_effects:
          - "Set orientation_completed=true"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /members/{id}/suspend (ClubAdmin), or system during POST /_ops/run-no-show-sweep when no_show_strikes reaches 3"
        actor: "ClubAdmin or system"
        preconditions:
          - "For the system path: no_show_strikes >= 3 (NO_SHOW_SUSPEND_THRESHOLD)"
        side_effects:
          - "Cascade: each of the member's Reservations with status=CONFIRMED transitions to CANCELLED (REQUESTED reservations are left intact so they can be resumed after reinstatement)"
          - "Cascade: for each such cancelled Reservation that held a boat_id, that Boat's assignment is released (boat_id cleared; boat remains AVAILABLE)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /members/{id}/reinstate"
        actor: ClubAdmin
        preconditions:
          - "outstanding_fees_cents == 0 (all fees PAID or WAIVED)"
        side_effects:
          - "Set no_show_strikes=0"
          - "Set last_reinstated_at = current clock"
      - from: [PENDING_ORIENTATION, ACTIVE, SUSPENDED]
        to: CANCELLED
        trigger: "system placeholder (membership termination); not exposed as a public endpoint in v1"
        actor: system
        preconditions: []
        side_effects: []
        note: "CANCELLED is the terminal lockdown state; declared for completeness."

  # ---- Boat: cyclic (AVAILABLE -> OUT -> CLEANING -> AVAILABLE) + MAINTENANCE ----
  - entity: Boat
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OUT
        trigger: "POST /reservations/{id}/checkout"
        actor: Member
        preconditions:
          - "Boat.status == AVAILABLE (cross-entity guard from the Reservation checkout)"
        side_effects:
          - "Record Reservation.fuel_at_checkout"
      - from: OUT
        to: CLEANING
        trigger: "POST /reservations/{id}/return"
        actor: Member
        preconditions: []
        side_effects:
          - "Set needs_cleaning=true"
          - "usage_count += 1"
          - "Set last_used_at = current clock"
          - "Set fuel_level_pct = Reservation.fuel_at_return"
      - from: CLEANING
        to: AVAILABLE
        trigger: "POST /boats/{id}/clean-complete"
        actor: DockStaff
        preconditions: []
        side_effects:
          - "Set needs_cleaning=false"
          - "Set fuel_level_pct=100 (refuelled during turnaround)"
      - from: [AVAILABLE, OUT, CLEANING]
        to: MAINTENANCE
        trigger: "POST /boats/{id}/maintenance, or system during POST /damage-reports/{id}/assess"
        actor: "DockStaff or system"
        preconditions: []
        side_effects:
          - "Cascade: each Reservation on this boat with status=CONFIRMED reverts to REQUESTED and its boat_id is cleared"
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /boats/{id}/clean-complete"
        actor: DockStaff
        preconditions: []
        side_effects:
          - "Set fuel_level_pct=100"

  # ---- Reservation: branching with revert ----
  - entity: Reservation
    field: status
    initial_state: REQUESTED
    terminal_states: [RETURNED, NO_SHOW, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm"
        actor: Member
        preconditions:
          - "Member.status == ACTIVE (cross-entity guard)"
          - "Rotation selects an eligible Boat (see calculations.boat_rotation_select); else ERR_NO_BOAT_AVAILABLE"
        side_effects:
          - "Assign boat_id to the selected Boat"
          - "reservations_used_this_week increases by one for the member (derived recompute)"
      - from: CONFIRMED
        to: REQUESTED
        trigger: "system, when the assigned Boat transitions to MAINTENANCE"
        actor: system
        preconditions: []
        side_effects:
          - "Clear boat_id"
      - from: CONFIRMED
        to: CHECKED_OUT
        trigger: "POST /reservations/{id}/checkout"
        actor: Member
        preconditions:
          - "assigned Boat.status == AVAILABLE (cross-entity guard); else ERR_BOAT_NOT_AVAILABLE"
        side_effects:
          - "Boat AVAILABLE -> OUT"
          - "Record fuel_at_checkout and checkout_time"
          - "Compute provisional_fuel_fee_cents (see calculations.fuel_fee, PROVISIONAL variant)"
      - from: CHECKED_OUT
        to: RETURNED
        trigger: "POST /reservations/{id}/return"
        actor: Member
        preconditions: []
        side_effects:
          - "Boat OUT -> CLEANING (usage_count += 1)"
          - "Record fuel_at_return and return_time"
          - "If return is late (see calculations.late_return_fee) create a LATE_RETURN Fee"
          - "If fuel_at_return < FUEL_MIN_PCT create a FUEL Fee (see calculations.fuel_fee, FINAL variant)"
          - "If cleaning_state == SOILED create a CLEANING Fee (flat CLEANING_FEE_CENTS)"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system during POST /_ops/run-no-show-sweep when current clock > start_time + NO_SHOW_GRACE_MIN and not checked out"
        actor: system
        preconditions: []
        side_effects:
          - "Create a NO_SHOW Fee (flat NO_SHOW_FEE_CENTS) for the member"
          - "member.no_show_strikes += 1"
          - "Release the assigned Boat (boat_id cleared; Boat stays AVAILABLE)"
          - "Cascade: if member.no_show_strikes reaches 3, member ACTIVE -> SUSPENDED (which itself cascades to cancel the member's other CONFIRMED Reservations)"
      - from: [REQUESTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel, or system (member suspension cascade)"
        actor: "Member or system"
        preconditions:
          - "Reservation not in {CHECKED_OUT, RETURNED, NO_SHOW, CANCELLED}"
        side_effects:
          - "If a boat_id was assigned, release it (boat_id cleared; Boat stays AVAILABLE)"
          - "reservations_used_this_week decreases by one for the member if it had been counted (derived recompute)"

  # ---- TrainingSession ----
  - entity: TrainingSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: FULL
        trigger: "system, when enrolled_count reaches capacity after POST /enrollments"
        actor: system
        preconditions:
          - "enrolled_count == capacity"
        side_effects: []
      - from: FULL
        to: SCHEDULED
        trigger: "system, when an enrollment is cancelled and enrolled_count drops below capacity"
        actor: system
        preconditions:
          - "enrolled_count < capacity"
        side_effects: []
      - from: [SCHEDULED, FULL]
        to: COMPLETED
        trigger: "system, once all enrollments have attendance marked"
        actor: system
        preconditions: []
        side_effects: []
      - from: [SCHEDULED, FULL]
        to: CANCELLED
        trigger: "system placeholder (session cancellation); not exposed as a public endpoint in v1"
        actor: system
        preconditions: []
        side_effects: []

  # ---- Enrollment ----
  - entity: Enrollment
    field: status
    initial_state: ENROLLED
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED]
    transitions:
      - from: ENROLLED
        to: ATTENDED
        trigger: "POST /enrollments/{id}/mark-attendance with attended=true"
        actor: DockStaff
        preconditions:
          - "TrainingSession.status in {SCHEDULED, FULL} (cross-entity guard)"
          - "For BASIC_CERT: member.orientation_completed == true (else ERR_ORIENTATION_REQUIRED)"
          - "For ADVANCED_CERT: member.certification_level == BASIC (else ERR_CERT_INSUFFICIENT)"
        side_effects:
          - "ORIENTATION: member.orientation_completed=true; if member PENDING_ORIENTATION -> ACTIVE"
          - "BASIC_CERT: member.certification_level = BASIC"
          - "ADVANCED_CERT: member.certification_level = ADVANCED"
      - from: ENROLLED
        to: NO_SHOW
        trigger: "POST /enrollments/{id}/mark-attendance with attended=false"
        actor: DockStaff
        preconditions: []
        side_effects: []
      - from: ENROLLED
        to: CANCELLED
        trigger: "system placeholder (enrollment withdrawal); not exposed as a public endpoint in v1"
        actor: system
        preconditions: []
        side_effects:
          - "session.enrolled_count decreases; FULL -> SCHEDULED if below capacity"

  # ---- DamageReport ----
  - entity: DamageReport
    field: status
    initial_state: FILED
    terminal_states: [ASSESSED, DISMISSED]
    transitions:
      - from: FILED
        to: ASSESSED
        trigger: "POST /damage-reports/{id}/assess"
        actor: DockStaff
        preconditions: []
        side_effects:
          - "Compute assessed_fee_cents (see calculations.damage_fee)"
          - "Create a DAMAGE Fee for the reservation's member"
          - "Cascade: assigned Boat -> MAINTENANCE (which itself cascades CONFIRMED reservations on that boat back to REQUESTED)"
      - from: FILED
        to: DISMISSED
        trigger: "system placeholder (report dismissal); not exposed as a public endpoint in v1"
        actor: system
        preconditions: []
        side_effects: []

  # ---- DuesInvoice ----
  - entity: DuesInvoice
    field: status
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /dues-invoices/{id}/pay"
        actor: Member
        preconditions:
          - "Invoice.status in {ISSUED, OVERDUE}"
        side_effects:
          - "Recompute fees_rolled_cents chronologically and pin final_total_cents (see calculations.dues_invoice_total, FINAL variant)"
          - "Set paid_at = current clock"
          - "Each rolled Fee with status=ASSESSED -> PAID"
      - from: OVERDUE
        to: PAID
        trigger: "POST /dues-invoices/{id}/pay"
        actor: Member
        preconditions: []
        side_effects:
          - "Same as ISSUED -> PAID"
      - from: ISSUED
        to: OVERDUE
        trigger: "system during POST /_ops/run-no-show-sweep when current clock >= period_end and unpaid"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: VOID
        trigger: "system, when a superseding DuesInvoice is issued for the same member (see concurrency_rules.dues-invoice-supersede-stale-member)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: dues-invoice-supersede-stale-member
    parent_entity: Member
    write_endpoint: "POST /members/{member_id}/dues-invoices"
    occ_field: "expected_member_version"
    description: |
      Issuing a DuesInvoice against a Member whose version has advanced since the
      client last observed it is rejected. A newly issued invoice legitimately
      supersedes any prior unpaid invoice for that member (marking it VOID) and
      bumps Member.version; a second issuance that still carries the earlier
      member version is therefore acting on a stale view and is rejected. Two
      strictly sequential issue requests carrying the same observed member version
      cannot both succeed — the second's version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: dues_invoice_total
    trigger: "POST /members/{member_id}/dues-invoices (estimated); POST /dues-invoices/{id}/pay (final)"
    algorithm: aggregation
    formula: |
      # Evaluation order is pinned: (1) snapshot base_dues, (2) select the rolled
      # fee set, (3) tax-and-round EACH fee line, (4) SUM the rounded lines,
      # (5) add base. Rounding is per-line-item then sum (NOT sum-then-round).
      base_dues_cents = tier.monthly_dues_cents            # snapshot at issue
      rolled = [ f for f in member.Fees
                 if f.status == ASSESSED and f.assessed_at < evaluation_time ]
      line(f) = round_half_up(f.amount_cents * (1 + TAX_PCT))
      fees_rolled_cents = sum( line(f) for f in rolled )   # per-line then sum
      total_cents = base_dues_cents + fees_rolled_cents
    input_set: "member Fees with status=ASSESSED whose assessed_at precedes the evaluation instant"
    constants:
      TAX_PCT: 0.085
    precision: "whole cents, round_half_up applied PER fee line before summation"
    variants:
      - name: ESTIMATED
        when: "computed at issue time; evaluation_time = issued_at"
        difference: "Forward-looking: rolls only fees ASSESSED at issue; stored as estimated_total_cents"
      - name: FINAL
        when: "computed at payment time; evaluation_time = paid_at"
        difference: "Chronological: rolls every fee ASSESSED up to payment, including fees assessed after issue; stored as final_total_cents. Diverges from ESTIMATED whenever a fee is assessed between issue and payment."

  - name: fuel_fee
    trigger: "POST /reservations/{id}/checkout (PROVISIONAL); POST /reservations/{id}/return (FINAL)"
    algorithm: threshold
    formula: |
      # Fuel policy: boats must be returned at or above FUEL_MIN_PCT (25). A refuel
      # fee compensates the club for topping the tank back to the checkout level.
      FINAL:       fee = (fuel_at_return < FUEL_MIN_PCT)
                         ? FUEL_RATE_CENTS_PER_PCT * (fuel_at_checkout - fuel_at_return)
                         : 0
      PROVISIONAL: fee = (fuel_at_checkout > FUEL_MIN_PCT)
                         ? FUEL_RATE_CENTS_PER_PCT * (fuel_at_checkout - FUEL_MIN_PCT)
                         : 0
    input_set: "the single Reservation's fuel_at_checkout and (for FINAL) fuel_at_return"
    constants:
      FUEL_MIN_PCT: 25
      FUEL_RATE_CENTS_PER_PCT: 100
    precision: "whole cents"
    variants:
      - name: PROVISIONAL
        when: "at checkout, before return fuel is known"
        difference: "Forward-looking estimate assuming the member returns exactly at the 25% floor; stored as Reservation.provisional_fuel_fee_cents"
      - name: FINAL
        when: "at return, from the measured fuel_at_return"
        difference: "Actual delta from checkout to return; creates a FUEL Fee. Diverges from PROVISIONAL whenever fuel_at_return != FUEL_MIN_PCT."

  - name: damage_fee
    trigger: "POST /damage-reports/{id}/assess"
    algorithm: tiered_pricing
    formula: |
      # 3 inputs with nested min/max and a conditional severity surcharge.
      deductible = DEDUCTIBLE_BY_TIER[member.membership_tier]
      surcharge  = (severity == SEVERE) ? SEVERE_SURCHARGE_CENTS : 0
      assessed_fee_cents = min( repair_cost_cents, deductible + surcharge )
    input_set: "the single DamageReport plus the reservation's member tier"
    constants:
      DEDUCTIBLE_BY_TIER: { CRUISE: 50000, SAIL: 30000, UNLIMITED: 10000 }
      SEVERE_SURCHARGE_CENTS: 20000
    precision: "whole cents"

  - name: late_return_fee
    trigger: "POST /reservations/{id}/return"
    algorithm: threshold
    formula: |
      minutes_late = max( 0, ceil( (return_time - end_time) / 60 seconds ) )
      # Strictly greater than the grace: exactly LATE_GRACE_MIN minutes late is free.
      fee = (minutes_late > LATE_GRACE_MIN)
            ? LATE_BLOCK_CENTS * ceil( minutes_late / LATE_BLOCK_MIN )
            : 0
    input_set: "the single Reservation's return_time vs end_time"
    constants:
      LATE_GRACE_MIN: 15
      LATE_BLOCK_MIN: 30
      LATE_BLOCK_CENTS: 2500
    precision: "whole cents"

  - name: boat_rotation_select
    trigger: "POST /reservations/{id}/confirm"
    algorithm: weighted_scoring
    formula: |
      # Deterministic rotation selector.
      candidates = [ b for b in Boats
                     if b.dock_id == reservation.dock_id
                     and b.boat_type == reservation.boat_type
                     and b.status != MAINTENANCE
                     and NOT overlaps_any_active_reservation(b, reservation) ]
      # overlaps_any_active_reservation: exists another Reservation R2 on boat b with
      #   R2.status in {CONFIRMED, CHECKED_OUT} and half-open overlap
      #   (reservation.start_time < R2.end_time AND R2.start_time < reservation.end_time).
      # Rank: usage_count ASC; tie-break created_at ASC (NEVER id).
      # Empty candidate set -> ERR_NO_BOAT_AVAILABLE.
      selected = argmin(candidates, key=(usage_count ASC, created_at ASC))
    input_set: "Boats at the reservation's dock of the requested type, excluding MAINTENANCE and temporally overlapping boats"
    precision: "exact"

  - name: member_no_show_strikes
    trigger: "POST /_ops/run-no-show-sweep (increment); POST /members/{id}/reinstate (reset)"
    algorithm: aggregation
    formula: |
      # Running counter. Each NO_SHOW transition adds 1. Reinstatement resets to 0.
      # Suspension boundary: strikes >= NO_SHOW_SUSPEND_THRESHOLD.
      on NO_SHOW:  no_show_strikes += 1
      suspend when no_show_strikes >= NO_SHOW_SUSPEND_THRESHOLD
    input_set: "the member's NO_SHOW reservations since last_reinstated_at"
    constants:
      NO_SHOW_SUSPEND_THRESHOLD: 3
      NO_SHOW_GRACE_MIN: 30
      NO_SHOW_FEE_CENTS: 5000
    precision: "exact integer"

  - name: member_fee_ledger
    trigger: "Fee create (any type), POST /fees/{id}/waive, POST /dues-invoices/{id}/pay"
    algorithm: aggregation
    formula: |
      outstanding_fees_cents = sum( f.amount_cents for member Fees where status == ASSESSED )
      waived_fees_cents      = sum( f.amount_cents for member Fees where status == WAIVED )
      paid_fees_cents        = sum( f.amount_cents for member Fees where status == PAID )
      # Conserved: outstanding + waived + paid == sum(all member Fee.amount_cents).
    input_set: "all Fees for the member, partitioned by status"
    precision: "whole cents"

  - name: member_weekly_reservations
    trigger: "POST /reservations/{id}/confirm, POST /reservations/{id}/cancel, POST /_ops/run-no-show-sweep"
    algorithm: aggregation
    formula: |
      week = ISO week (Mon 00:00 UTC .. next Mon 00:00 UTC) containing the current clock
      reservations_used_this_week = count( member Reservations
          where status in {CONFIRMED, CHECKED_OUT, RETURNED, NO_SHOW}
          and start_time in week )
      reservations_remaining_this_week = max(0, tier.reservations_per_week - reservations_used_this_week)
      # Conserved across confirm/cancel: used + remaining == tier.reservations_per_week
      # (while used <= per_week, which the quota validation guarantees).
    input_set: "member Reservations in counted statuses whose start_time falls in the current ISO week"
    precision: "exact integer"
    constants:
      CLEANING_FEE_CENTS: 4000
      FEE_BLOCK_LIMIT_CENTS: 50000
      MEMBER_TURNAROUND_MIN: 60

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, numeric ranges honored (e.g., end_time > start_time)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "Referenced resources exist (path ids and FK body fields), validated left-to-right"
    error_id: "ERR_*_NOT_FOUND (entity-specific)"
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_referential
    check: "Member acting via X-User-ID owns the targeted member-scoped resource (reservation.member_id / enrollment.member_id / invoice.member_id == X-User-ID)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "Member-role reservation, enrollment, invoice-pay endpoints"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition (includes Member.status==ACTIVE for reservation actions; Boat.status==AVAILABLE for checkout; DamageReport FILED for assess; Fee ASSESSED for waive; Invoice ISSUED/OVERDUE for pay)"
    error_id: "ERR_INVALID_STATE / ERR_MEMBER_NOT_ACTIVE / ERR_BOAT_NOT_AVAILABLE / ERR_FEE_NOT_ASSESSED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Member certification_level meets the requested boat_type requirement (CENTER_CONSOLE requires ADVANCED; others require BASIC); enrollment cert prerequisites"
    error_id: "ERR_CERT_INSUFFICIENT / ERR_ORIENTATION_REQUIRED"
    http_status: 422
    applies_to: "POST /reservations, POST /reservations/{id}/confirm, POST /enrollments/{id}/mark-attendance"

  - priority: 8
    category: business_temporal
    check: "start_time is in the future and within tier.advance_booking_days_max; the member has a >= MEMBER_TURNAROUND_MIN gap from their other non-terminal reservations; a rotation-eligible boat exists (no temporal collision)"
    error_id: "ERR_BOOKING_WINDOW / ERR_MEMBER_SCHEDULE_CONFLICT / ERR_NO_BOAT_AVAILABLE"
    http_status: 409
    applies_to: "POST /reservations, POST /reservations/{id}/confirm"

  - priority: 9
    category: business_constraint
    check: "Reciprocal access permitted for reciprocal dock; active-reservation cap not exceeded; weekly quota not exceeded; enrollment not a duplicate; session not FULL"
    error_id: "ERR_RECIPROCAL_NOT_ALLOWED / ERR_MAX_ACTIVE_RESERVATIONS / ERR_WEEKLY_QUOTA_EXCEEDED / ERR_DUPLICATE_ENROLLMENT / ERR_SESSION_FULL"
    http_status: 409
    applies_to: "POST /reservations, POST /reservations/{id}/confirm, POST /enrollments"

  - priority: 10
    category: business_fiscal
    check: "Member outstanding_fees_cents does not exceed FEE_BLOCK_LIMIT_CENTS for new reservations; reinstatement requires outstanding_fees_cents == 0"
    error_id: "ERR_OUTSTANDING_FEES"
    http_status: 402
    applies_to: "POST /reservations, POST /members/{id}/reinstate"

  - priority: 11
    category: state
    check: "OCC: expected_member_version equals Member.version at issue time"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /members/{member_id}/dues-invoices"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Docks ----
  - { method: POST, path: "/docks", description: "Create a dock", roles: [ClubAdmin], code: 201, input: [name, location_code, capacity, "is_reciprocal?"], output: Dock, side_effects: [] }
  - { method: GET, path: "/docks/{dock_id}", description: "Get a dock", roles: [Member, DockStaff, ClubAdmin], code: 200, input: [], output: Dock, side_effects: [] }
  - { method: GET, path: "/docks", description: "List docks", roles: [Member, DockStaff, ClubAdmin], code: 200, input: ["limit?", "offset?"], output: "Dock[]", side_effects: [] }

  # ---- Membership Tiers ----
  - { method: POST, path: "/membership-tiers", description: "Create a membership tier (config)", roles: [ClubAdmin], code: 201, input: [tier_code, monthly_dues_cents, max_active_reservations, reservations_per_week, reciprocal_access_allowed, advance_booking_days_max], output: MembershipTier, side_effects: [] }
  - { method: GET, path: "/membership-tiers/{tier_code}", description: "Get a tier by code", roles: [Member, DockStaff, ClubAdmin], code: 200, input: [], output: MembershipTier, side_effects: [] }
  - { method: GET, path: "/membership-tiers", description: "List tiers", roles: [Member, DockStaff, ClubAdmin], code: 200, input: ["limit?", "offset?"], output: "MembershipTier[]", side_effects: [] }

  # ---- Boats ----
  - { method: POST, path: "/boats", description: "Create a boat", roles: [ClubAdmin], code: 201, input: [dock_id, boat_type], output: Boat, side_effects: ["status=AVAILABLE, fuel_level_pct=100, usage_count=0, needs_cleaning=false"] }
  - { method: GET, path: "/boats/{boat_id}", description: "Get a boat", roles: [Member, DockStaff, ClubAdmin], code: 200, input: [], output: Boat, side_effects: [] }
  - { method: GET, path: "/boats", description: "List/filter boats (reverse-reachability for Boat.dock_id)", roles: [Member, DockStaff, ClubAdmin], code: 200, input: ["dock_id?", "boat_type?", "status?", "limit?", "offset?"], output: "Boat[]", side_effects: [] }
  - { method: POST, path: "/boats/{boat_id}/maintenance", description: "Send a boat to MAINTENANCE", roles: [DockStaff, ClubAdmin], code: 200, input: ["reason?"], output: Boat, side_effects: ["status -> MAINTENANCE", "cascade: CONFIRMED reservations on this boat revert to REQUESTED (boat_id cleared)"] }
  - { method: POST, path: "/boats/{boat_id}/clean-complete", description: "Return a boat to service from CLEANING or MAINTENANCE", roles: [DockStaff, ClubAdmin], code: 200, input: [], output: Boat, side_effects: ["status -> AVAILABLE", "needs_cleaning=false, fuel_level_pct=100"] }

  # ---- Members ----
  - { method: POST, path: "/members", description: "Enroll a new member", roles: [ClubAdmin], code: 201, input: [full_name, email, membership_tier, home_dock_id], output: Member, side_effects: ["status=PENDING_ORIENTATION, certification_level=NONE, orientation_completed=false, no_show_strikes=0"] }
  - { method: GET, path: "/members/{member_id}", description: "Get a member (exposes version for OCC)", roles: [Member, DockStaff, ClubAdmin], code: 200, input: [], output: Member, side_effects: [] }
  - { method: GET, path: "/members", description: "List/filter members (reverse-reachability for Member.home_dock_id)", roles: [DockStaff, ClubAdmin], code: 200, input: ["home_dock_id?", "status?", "membership_tier?", "limit?", "offset?"], output: "Member[]", side_effects: [] }
  - { method: POST, path: "/members/{member_id}/suspend", description: "Administratively suspend an ACTIVE member (for-cause)", roles: [ClubAdmin], code: 200, input: ["reason?"], output: Member, side_effects: ["status ACTIVE -> SUSPENDED", "cascade: CONFIRMED reservations -> CANCELLED, their boats released"] }
  - { method: POST, path: "/members/{member_id}/reinstate", description: "Reinstate a SUSPENDED member", roles: [ClubAdmin], code: 200, input: [], output: Member, side_effects: ["status SUSPENDED -> ACTIVE", "no_show_strikes=0", "last_reinstated_at=clock"] }
  - { method: POST, path: "/members/{member_id}/dues-invoices", description: "Issue a dues invoice (OCC on member.version; supersedes prior unpaid invoice)", roles: [ClubAdmin], code: 201, input: [period_start, period_end, expected_member_version], output: DuesInvoice, side_effects: ["create DuesInvoice status=ISSUED, base_dues_cents snapshot, estimated_total_cents pinned", "prior unpaid DuesInvoice for member -> VOID", "increments Member.version by 1"] }

  # ---- Reservations ----
  - { method: POST, path: "/reservations", description: "Request a boat reservation", roles: [Member], code: 201, input: [member_id, dock_id, boat_type, start_time, end_time], output: Reservation, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/reservations/{reservation_id}", description: "Get a reservation", roles: [Member, DockStaff, ClubAdmin], code: 200, input: [], output: Reservation, side_effects: [] }
  - { method: GET, path: "/reservations", description: "List/filter reservations (reverse-reachability for member_id, dock_id, boat_id)", roles: [Member, DockStaff, ClubAdmin], code: 200, input: ["member_id?", "dock_id?", "boat_id?", "status?", "limit?", "offset?"], output: "Reservation[]", side_effects: [] }
  - { method: POST, path: "/reservations/{reservation_id}/confirm", description: "Confirm a reservation; rotation assigns a boat", roles: [Member], code: 200, input: [], output: Reservation, side_effects: ["rotation selects boat (calculations.boat_rotation_select)", "status REQUESTED -> CONFIRMED", "assign boat_id", "member weekly usage recomputed"] }
  - { method: POST, path: "/reservations/{reservation_id}/checkout", description: "Check out the assigned boat", roles: [Member], code: 200, input: [fuel_at_checkout], output: Reservation, side_effects: ["status CONFIRMED -> CHECKED_OUT", "Boat AVAILABLE -> OUT", "record fuel_at_checkout, checkout_time", "compute provisional_fuel_fee_cents"] }
  - { method: POST, path: "/reservations/{reservation_id}/return", description: "Return the boat", roles: [Member], code: 200, input: [fuel_at_return, "cleaning_state?"], output: Reservation, side_effects: ["status CHECKED_OUT -> RETURNED", "Boat OUT -> CLEANING, usage_count += 1, last_used_at set", "record fuel_at_return, return_time", "create LATE_RETURN/FUEL/CLEANING Fees per calculations"] }
  - { method: POST, path: "/reservations/{reservation_id}/cancel", description: "Cancel a REQUESTED or CONFIRMED reservation", roles: [Member], code: 200, input: [], output: Reservation, side_effects: ["status -> CANCELLED", "release assigned boat if any", "member weekly usage recomputed"] }

  # ---- Training Sessions ----
  - { method: POST, path: "/training-sessions", description: "Schedule a training session", roles: [ClubAdmin], code: 201, input: [dock_id, session_type, start_time, end_time, capacity, instructor_name], output: TrainingSession, side_effects: ["status=SCHEDULED, enrolled_count=0"] }
  - { method: GET, path: "/training-sessions/{session_id}", description: "Get a training session", roles: [Member, DockStaff, ClubAdmin], code: 200, input: [], output: TrainingSession, side_effects: [] }
  - { method: GET, path: "/training-sessions", description: "List/filter sessions (reverse-reachability for TrainingSession.dock_id)", roles: [Member, DockStaff, ClubAdmin], code: 200, input: ["dock_id?", "session_type?", "status?", "limit?", "offset?"], output: "TrainingSession[]", side_effects: [] }

  # ---- Enrollments ----
  - { method: POST, path: "/enrollments", description: "Enroll a member in a session", roles: [Member], code: 201, input: [member_id, session_id], output: Enrollment, side_effects: ["status=ENROLLED", "session.enrolled_count += 1; SCHEDULED -> FULL if at capacity"] }
  - { method: GET, path: "/enrollments/{enrollment_id}", description: "Get an enrollment", roles: [Member, DockStaff, ClubAdmin], code: 200, input: [], output: Enrollment, side_effects: [] }
  - { method: GET, path: "/enrollments", description: "List/filter enrollments (reverse-reachability for member_id, session_id)", roles: [Member, DockStaff, ClubAdmin], code: 200, input: ["member_id?", "session_id?", "status?", "limit?", "offset?"], output: "Enrollment[]", side_effects: [] }
  - { method: POST, path: "/enrollments/{enrollment_id}/mark-attendance", description: "Mark attendance; grants certification/orientation", roles: [DockStaff, ClubAdmin], code: 200, input: [attended], output: Enrollment, side_effects: ["attended=true -> ATTENDED + cert/orientation grant + member cascade", "attended=false -> NO_SHOW"] }

  # ---- Damage Reports ----
  - { method: POST, path: "/damage-reports", description: "File a damage report against a trip", roles: [DockStaff, ClubAdmin], code: 201, input: [reservation_id, boat_id, severity, repair_cost_cents], output: DamageReport, side_effects: ["status=FILED"] }
  - { method: GET, path: "/damage-reports/{report_id}", description: "Get a damage report", roles: [Member, DockStaff, ClubAdmin], code: 200, input: [], output: DamageReport, side_effects: [] }
  - { method: GET, path: "/damage-reports", description: "List/filter damage reports (reverse-reachability for reservation_id, boat_id)", roles: [DockStaff, ClubAdmin], code: 200, input: ["reservation_id?", "boat_id?", "status?", "limit?", "offset?"], output: "DamageReport[]", side_effects: [] }
  - { method: POST, path: "/damage-reports/{report_id}/assess", description: "Assess a damage report; charges fee and sends boat to maintenance", roles: [DockStaff, ClubAdmin], code: 200, input: [], output: DamageReport, side_effects: ["status FILED -> ASSESSED", "compute assessed_fee_cents; create DAMAGE Fee", "cascade: Boat -> MAINTENANCE (which reverts CONFIRMED reservations to REQUESTED)"] }

  # ---- Fees ----
  - { method: GET, path: "/fees/{fee_id}", description: "Get a fee", roles: [Member, DockStaff, ClubAdmin], code: 200, input: [], output: Fee, side_effects: [] }
  - { method: GET, path: "/fees", description: "List/filter fees (reverse-reachability for member_id, reservation_id)", roles: [Member, DockStaff, ClubAdmin], code: 200, input: ["member_id?", "reservation_id?", "status?", "fee_type?", "limit?", "offset?"], output: "Fee[]", side_effects: [] }
  - { method: POST, path: "/fees/{fee_id}/waive", description: "Waive an assessed fee (compensating action)", roles: [DockStaff, ClubAdmin], code: 200, input: [], output: Fee, side_effects: ["status ASSESSED -> WAIVED", "member fee ledger recomputed"] }

  # ---- Dues Invoices ----
  - { method: GET, path: "/dues-invoices/{invoice_id}", description: "Get a dues invoice", roles: [Member, DockStaff, ClubAdmin], code: 200, input: [], output: DuesInvoice, side_effects: [] }
  - { method: GET, path: "/dues-invoices", description: "List/filter dues invoices (reverse-reachability for member_id)", roles: [Member, DockStaff, ClubAdmin], code: 200, input: ["member_id?", "status?", "limit?", "offset?"], output: "DuesInvoice[]", side_effects: [] }
  - { method: POST, path: "/dues-invoices/{invoice_id}/pay", description: "Pay a dues invoice; pins final total and settles rolled fees", roles: [Member], code: 200, input: [], output: DuesInvoice, side_effects: ["status -> PAID", "recompute fees_rolled_cents chronologically; pin final_total_cents", "rolled ASSESSED Fees -> PAID", "paid_at set"] }

  # ---- Test-driving (outside public business surface) ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time.", roles: [ClubAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock set to to_iso8601"] }
  - { method: POST, path: "/_ops/run-no-show-sweep", description: "Advance housekeeping against the current clock: mark overdue CONFIRMED reservations NO_SHOW (with fee, strike, boat release, suspension cascade); mark unpaid past-period ISSUED invoices OVERDUE", roles: [ClubAdmin], code: 200, input: [], output: null, side_effects: ["CONFIRMED reservations past start_time+NO_SHOW_GRACE_MIN -> NO_SHOW cascade", "ISSUED invoices with clock >= period_end -> OVERDUE"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for the endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Member acting on a resource they do not own (member_id mismatch)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, out-of-range enum, or end_time <= start_time" }
  - { id: ERR_DOCK_NOT_FOUND, http: 404, condition: "Referenced dock does not exist" }
  - { id: ERR_TIER_NOT_FOUND, http: 404, condition: "Referenced membership tier code does not exist" }
  - { id: ERR_BOAT_NOT_FOUND, http: 404, condition: "Referenced boat does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Referenced member does not exist" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "Referenced reservation does not exist" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "Referenced training session does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Referenced enrollment does not exist" }
  - { id: ERR_DAMAGE_REPORT_NOT_FOUND, http: 404, condition: "Referenced damage report does not exist" }
  - { id: ERR_FEE_NOT_FOUND, http: 404, condition: "Referenced fee does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Referenced dues invoice does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition (generic)" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Reservation action attempted by a member whose status is not ACTIVE" }
  - { id: ERR_BOAT_NOT_AVAILABLE, http: 409, condition: "Checkout attempted when the assigned boat status is not AVAILABLE" }
  - { id: ERR_FEE_NOT_ASSESSED, http: 409, condition: "Waive attempted on a fee whose status is not ASSESSED" }
  - { id: ERR_CERT_INSUFFICIENT, http: 422, condition: "Member certification_level does not meet the boat_type or session prerequisite" }
  - { id: ERR_ORIENTATION_REQUIRED, http: 422, condition: "BASIC_CERT attendance or reservation attempted before orientation completed" }
  - { id: ERR_BOOKING_WINDOW, http: 409, condition: "start_time not in the future or beyond tier.advance_booking_days_max" }
  - { id: ERR_MEMBER_SCHEDULE_CONFLICT, http: 409, condition: "New reservation is within MEMBER_TURNAROUND_MIN of the member's other non-terminal reservation" }
  - { id: ERR_NO_BOAT_AVAILABLE, http: 409, condition: "Rotation found no eligible boat of the requested type at the dock for the window" }
  - { id: ERR_RECIPROCAL_NOT_ALLOWED, http: 422, condition: "Reservation at a reciprocal dock by a tier without reciprocal access" }
  - { id: ERR_MAX_ACTIVE_RESERVATIONS, http: 409, condition: "Member already at tier.max_active_reservations concurrent reservations" }
  - { id: ERR_WEEKLY_QUOTA_EXCEEDED, http: 409, condition: "Confirm would exceed tier.reservations_per_week for the week" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Member already has a non-terminal enrollment in the session" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "Enrollment attempted on a session at capacity" }
  - { id: ERR_OUTSTANDING_FEES, http: 402, condition: "Outstanding fees exceed the reservation block limit, or reinstatement attempted with nonzero outstanding fees" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_member_version does not match Member.version at dues-invoice issue" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "A club member acting on their own reservations, enrollments, and invoices."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /reservations (own member_id)"
      - "POST /reservations/{id}/confirm (own)"
      - "POST /reservations/{id}/checkout (own)"
      - "POST /reservations/{id}/return (own)"
      - "POST /reservations/{id}/cancel (own)"
      - "POST /enrollments (own member_id)"
      - "POST /dues-invoices/{id}/pay (own)"
    shared_operations:
      - "GET /docks, GET /docks/{id}, GET /membership-tiers, GET /membership-tiers/{code}"
      - "GET /boats, GET /boats/{id}, GET /members/{id}"
      - "GET /reservations, GET /reservations/{id}"
      - "GET /training-sessions, GET /training-sessions/{id}"
      - "GET /enrollments, GET /enrollments/{id}"
      - "GET /fees, GET /fees/{id}, GET /dues-invoices, GET /dues-invoices/{id}, GET /damage-reports/{id}"

  - name: DockStaff
    description: "Operational staff running the dock: attendance, boat servicing, damage assessment, fee waivers, housekeeping."
    identity: "opaque"
    exclusive_operations:
      - "POST /boats/{id}/maintenance"
      - "POST /boats/{id}/clean-complete"
      - "POST /enrollments/{id}/mark-attendance"
      - "POST /damage-reports"
      - "POST /damage-reports/{id}/assess"
      - "POST /fees/{id}/waive"
    shared_operations:
      - "GET endpoints across docks, boats, members, reservations, sessions, enrollments, fees, damage-reports, dues-invoices"

  - name: ClubAdmin
    description: "Superset operator: configuration (docks, tiers, boats, sessions, members), reinstatement, dues issuance, clock and sweep. Can perform every DockStaff and Member-facing operation."
    identity: "opaque"
    exclusive_operations:
      - "POST /docks, POST /membership-tiers, POST /boats"
      - "POST /members, POST /members/{id}/suspend, POST /members/{id}/reinstate"
      - "POST /members/{member_id}/dues-invoices"
      - "POST /training-sessions"
      - "POST /_clock/set_current_utc, POST /_ops/run-no-show-sweep"
    shared_operations:
      - "All DockStaff operations (maintenance, clean-complete, mark-attendance, damage-reports, assess, waive)"
      - "All GET endpoints"
