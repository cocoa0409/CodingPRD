              captures: { pxb: $.data.id }
            - call: "POST /authorization-forms/${pxb}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "Fork Camp", program_type: "CAMP", min_age: 5, max_age: 12 }
              as: ProgramDirector
              captures: { pfk: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${pfk}", title: "Fk", age_group_min: 8, age_group_max: 12, age_as_of_date: "2026-06-01", weekly_capacity: 1, base_weekly_tuition_cents: 20000 }
              as: ProgramDirector
              captures: { sfk: $.data.id }
            - call: "POST /weekly-offerings"
