scaffold_difficulty_design:

  # ------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_amounts_diverge
        grounds:
          - calculations.settlement_amounts
          - calculations.performance_score
          - state_machines.Flock.CATCH_SCHEDULED_to_HARVESTED
        distinguishing_aspect: |
          Tournament settlement amounts on the Flock/Settlement domain diverge
          between the PROVISIONAL variant (group averages over currently
          HARVESTED members only) and the FINAL variant (all members
          harvested): identical flock data produces provisional
          net_amount_cents 265625 vs final net_amount_cents 299625.
        test_recipe:
          setup:
            - "Grower A with ACTIVE contract (base 6 c/lb), one house, flock A placed 10000 head on 2026-08-01, 300 dead / 40 condemned, 100000 lbs feed, 50000 lbs live weight; flock A HARVESTED"
            - "Grower B in the same settlement group with flock B placed 10000 head, 500 dead / 0 condemned, 102000 lbs feed, 50000 lbs live weight, still GROWING at preview time"
            - "Grower A has an ISSUED loan: principal 120000, recovery_pct 15"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-A", full_name: "Grower A" }, as: IntegratorAdmin, captures: { ga: $.data.id, ga_v: $.data.version } }
            - { call: "POST /api/growers", payload: { grower_code: "G-B", full_name: "Grower B" }, as: IntegratorAdmin, captures: { gb: $.data.id } }
            - { call: "POST /api/growers/${ga}/loans", payload: { principal_cents: 120000, recovery_pct: 15, purpose: OPERATING, expected_grower_version: "${ga_v}" }, as: IntegratorAdmin }
            - { call: "POST /api/houses", payload: { grower_id: "${ga}", house_no: "H1", capacity_birds: 20000 }, as: IntegratorAdmin, captures: { ha: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${gb}", house_no: "H1", capacity_birds: 20000 }, as: IntegratorAdmin, captures: { hb: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${ga}", contract_no: "C-A", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { ca: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${gb}", contract_no: "C-B", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { cb: $.data.id } }
            - { call: "POST /api/contracts/${ca}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/contracts/${cb}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-32", week_ending_date: "2026-09-12" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${ha}", contract_id: "${ca}", settlement_group_id: "${grp}", flock_no: "F-A" }, as: IntegratorAdmin, captures: { fa: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${hb}", contract_id: "${cb}", settlement_group_id: "${grp}", flock_no: "F-B" }, as: IntegratorAdmin, captures: { fb: $.data.id } }
            - { call: "POST /api/flocks/${fa}/placements", payload: { scheduled_date: "2026-08-01", head_count: 10000 }, as: IntegratorAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/flocks/${fb}/placements", payload: { scheduled_date: "2026-08-01", head_count: 10000 }, as: IntegratorAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/placements/${pa}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/placements/${pb}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${fa}/feed-deliveries", payload: { delivered_date: "2026-08-10", feed_lbs: 60000, feed_type: STARTER, ticket_no: "FT-A1" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${fa}/feed-deliveries", payload: { delivered_date: "2026-08-25", feed_lbs: 40000, feed_type: FINISHER, ticket_no: "FT-A2" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${fb}/feed-deliveries", payload: { delivered_date: "2026-08-10", feed_lbs: 102000, feed_type: STARTER, ticket_no: "FT-B1" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${fa}/mortality-reports", payload: { report_date: "2026-09-01", dead_head: 300, condemned_head: 40 }, as: Grower, as_user_id: "${ga}" }
            - { call: "POST /api/flocks/${fb}/mortality-reports", payload: { report_date: "2026-09-01", dead_head: 500, condemned_head: 0 }, as: Grower, as_user_id: "${gb}" }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-1", max_catches_per_day: 4 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${fa}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { csa: $.data.id } }
            - { call: "POST /api/flocks/${fa}/weight-tickets", payload: { ticket_no: "WT-A1", weighed_at: "2026-09-10T08:00:00Z", live_weight_lbs: 50000 }, as: LivehaulScheduler }
            - { call: "POST /api/catch-schedules/${csa}/complete", payload: {}, as: LivehaulScheduler }
            - { call: "GET /api/flocks/${fa}", payload: {}, as: SettlementAnalyst, captures: { fa_v: $.data.version } }
            - { call: "POST /api/flocks/${fa}/recompute-settlement", payload: { expected_flock_version: "${fa_v}" }, as: SettlementAnalyst, captures: { prov_net: $.data.net_amount_cents } }
          trigger:
            - { call: "POST /api/flocks/${fb}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { csb: $.data.id } }
            - { call: "POST /api/flocks/${fb}/weight-tickets", payload: { ticket_no: "WT-B1", weighed_at: "2026-09-10T09:00:00Z", live_weight_lbs: 50000 }, as: LivehaulScheduler }
            - { call: "POST /api/catch-schedules/${csb}/complete", payload: {}, as: LivehaulScheduler }
            - { call: "POST /api/settlement-groups/${grp}/lock", payload: {}, as: SettlementAnalyst }
            - { call: "GET /api/flocks/${fa}/settlement", payload: {}, as: SettlementAnalyst, captures: { fin: "$.data[0].net_amount_cents" } }
          assert:
            - "provisional Settlement(flock ${fa}).net_amount_cents == 265625 (base 300000 + bonus 12500 - loan repayment 46875)"
            - "final Settlement(flock ${fa}).net_amount_cents == 299625 (base 340000 + bonus 12500 - loan repayment 52875)"
            - "final Settlement(flock ${fa}).variant == FINAL and rank_position == 1"
            - "provisional != final for identical flock data: ${prov_net} != ${fin}"

      - name: fcr_raw_vs_adjusted_variants_diverge
        grounds:
          - calculations.adjusted_fcr
          - entities.Flock.fields.adj_fcr
        distinguishing_aspect: |
          On the feed-conversion domain (distinct entity domain from the
          tournament-money calculation above), the raw variant (feed/lbs with
          no waste credit) and adjusted variant (feed minus 2000-lb waste
          credit) produce 2.0000 vs 1.9600 for identical inputs — a different
          number that flows into performance_score, so the variant selection
          is observable.
        test_recipe:
          setup:
            - "Grower with active contract, house, flock placed 5000 head, one feed delivery of 10000 lbs, one weight ticket of 5000 lbs, catch completed (flock HARVESTED)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-FCR", full_name: "FCR Grower" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 10000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-FCR", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-33", week_ending_date: "2026-09-19" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-FCR" }, as: IntegratorAdmin, captures: { f: $.data.id } }
            - { call: "POST /api/flocks/${f}/placements", payload: { scheduled_date: "2026-08-01", head_count: 5000 }, as: IntegratorAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/placements/${p}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 10000, feed_type: STARTER, ticket_no: "FT-FCR1" }, as: IntegratorAdmin }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-FCR", max_catches_per_day: 2 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { cs: $.data.id } }
            - { call: "POST /api/flocks/${f}/weight-tickets", payload: { ticket_no: "WT-FCR1", weighed_at: "2026-09-10T08:00:00Z", live_weight_lbs: 5000 }, as: LivehaulScheduler }
          trigger:
            - { call: "POST /api/catch-schedules/${cs}/complete", payload: {}, as: LivehaulScheduler }
            - { call: "GET /api/flocks/${f}", payload: {}, as: SettlementAnalyst, captures: { adj: $.data.adj_fcr } }
          assert:
            - "Flock.${f}.adj_fcr == 1.6 (adjusted: (10000 - 2000)/5000)"
            - "raw variant would be 2.0 (10000/5000); the persisted adj_fcr uses the waste-credit variant and differs from raw"
            - "Flock.${f}.status == HARVESTED"

  # ------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tournament_settlement_tiered_formula_mode_a
        grounds:
          - calculations.settlement_amounts
          - calculations.performance_score
        distinguishing_aspect: |
          Mode (a): settlement_amounts is a >=3-input formula with non-linear
          interaction — nested min() on loan repayment, a 4-branch tiered
          uplift on rank_pct, and a conditional FCR bonus — pinned to
          net 299625 for the fixture.
        test_recipe:
          setup:
            - "Two-grower group fully harvested and locked (same fixture shape as settlement_provisional_vs_final_amounts_diverge); Grower A loan 120000 @ 15%"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-A", full_name: "Grower A" }, as: IntegratorAdmin, captures: { ga: $.data.id, ga_v: $.data.version } }
            - { call: "POST /api/growers", payload: { grower_code: "G-B", full_name: "Grower B" }, as: IntegratorAdmin, captures: { gb: $.data.id } }
            - { call: "POST /api/growers/${ga}/loans", payload: { principal_cents: 120000, recovery_pct: 15, purpose: OPERATING, expected_grower_version: "${ga_v}" }, as: IntegratorAdmin }
            - { call: "POST /api/houses", payload: { grower_id: "${ga}", house_no: "H1", capacity_birds: 20000 }, as: IntegratorAdmin, captures: { ha: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${gb}", house_no: "H1", capacity_birds: 20000 }, as: IntegratorAdmin, captures: { hb: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${ga}", contract_no: "C-A", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { ca: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${gb}", contract_no: "C-B", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { cb: $.data.id } }
            - { call: "POST /api/contracts/${ca}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/contracts/${cb}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-32", week_ending_date: "2026-09-12" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${ha}", contract_id: "${ca}", settlement_group_id: "${grp}", flock_no: "F-A" }, as: IntegratorAdmin, captures: { fa: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${hb}", contract_id: "${cb}", settlement_group_id: "${grp}", flock_no: "F-B" }, as: IntegratorAdmin, captures: { fb: $.data.id } }
            - { call: "POST /api/flocks/${fa}/placements", payload: { scheduled_date: "2026-08-01", head_count: 10000 }, as: IntegratorAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/flocks/${fb}/placements", payload: { scheduled_date: "2026-08-01", head_count: 10000 }, as: IntegratorAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/placements/${pa}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/placements/${pb}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${fa}/feed-deliveries", payload: { delivered_date: "2026-08-10", feed_lbs: 100000, feed_type: STARTER, ticket_no: "FT-A1" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${fb}/feed-deliveries", payload: { delivered_date: "2026-08-10", feed_lbs: 102000, feed_type: STARTER, ticket_no: "FT-B1" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${fa}/mortality-reports", payload: { report_date: "2026-09-01", dead_head: 300, condemned_head: 40 }, as: Grower, as_user_id: "${ga}" }
            - { call: "POST /api/flocks/${fb}/mortality-reports", payload: { report_date: "2026-09-01", dead_head: 500, condemned_head: 0 }, as: Grower, as_user_id: "${gb}" }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-1", max_catches_per_day: 4 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${fa}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { csa: $.data.id } }
            - { call: "POST /api/flocks/${fa}/weight-tickets", payload: { ticket_no: "WT-A1", weighed_at: "2026-09-10T08:00:00Z", live_weight_lbs: 50000 }, as: LivehaulScheduler }
            - { call: "POST /api/catch-schedules/${csa}/complete", payload: {}, as: LivehaulScheduler }
            - { call: "POST /api/flocks/${fb}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { csb: $.data.id } }
            - { call: "POST /api/flocks/${fb}/weight-tickets", payload: { ticket_no: "WT-B1", weighed_at: "2026-09-10T09:00:00Z", live_weight_lbs: 50000 }, as: LivehaulScheduler }
            - { call: "POST /api/catch-schedules/${csb}/complete", payload: {}, as: LivehaulScheduler }
            - { call: "POST /api/settlement-groups/${grp}/lock", payload: {}, as: SettlementAnalyst }
          trigger:
            - { call: "GET /api/flocks/${fa}/settlement", payload: {}, as: SettlementAnalyst, captures: { s: "$.data[0].net_amount_cents" } }
          assert:
            - "Settlement(flock ${fa}).base_amount_cents == 340000 (rank 1 of 2 -> rank_pct 0.5 -> tier uplift 0.8 -> 6.8 c/lb * 50000)"
            - "Settlement(flock ${fa}).fcr_bonus_cents == 12500 (adj_fcr 1.96 <= group avg 1.98 but > 1.98*0.98)"
            - "Settlement(flock ${fa}).condemnation_deduction_cents == 0 (0.00412 < 0.005 allowance)"
            - "Settlement(flock ${fa}).loan_repayment_cents == 52875 (min(0.15*352500, 120000))"
            - "Settlement(flock ${fa}).net_amount_cents == 299625"

      - name: per_line_rounding_then_sum_mode_b
        grounds:
          - calculations.settlement_amounts
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — settlement_amounts
          pins per-line round_half_up to whole cents BEFORE summation. The
          condemnation line is fractional pre-rounding (50000 * 40 *
          (51/9700 - 0.005) = 515.4639), so the pinned order rounds it to 515
          before the subtotal; a sum-then-round implementation drifts by a
          cent. Different mode than the tiered-formula instance above.
        test_recipe:
          setup:
            - "Single-grower group; flock placed 10000, dead 300, condemned 51 -> condemnation_pct = 51/9700 = 0.0052577; feed 100000; weight 50000; loan 100000 @ 15%"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-R", full_name: "Rounding Grower" }, as: IntegratorAdmin, captures: { g: $.data.id, g_v: $.data.version } }
            - { call: "POST /api/growers/${g}/loans", payload: { principal_cents: 100000, recovery_pct: 15, purpose: OPERATING, expected_grower_version: "${g_v}" }, as: IntegratorAdmin }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 20000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-R", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-34", week_ending_date: "2026-09-26" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-R" }, as: IntegratorAdmin, captures: { f: $.data.id } }
            - { call: "POST /api/flocks/${f}/placements", payload: { scheduled_date: "2026-08-01", head_count: 10000 }, as: IntegratorAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/placements/${p}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/feed-deliveries", payload: { delivered_date: "2026-08-10", feed_lbs: 100000, feed_type: STARTER, ticket_no: "FT-R1" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/mortality-reports", payload: { report_date: "2026-09-01", dead_head: 300, condemned_head: 51 }, as: Grower, as_user_id: "${g}" }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-R", max_catches_per_day: 2 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { cs: $.data.id } }
            - { call: "POST /api/flocks/${f}/weight-tickets", payload: { ticket_no: "WT-R1", weighed_at: "2026-09-10T08:00:00Z", live_weight_lbs: 50000 }, as: LivehaulScheduler }
            - { call: "POST /api/catch-schedules/${cs}/complete", payload: {}, as: LivehaulScheduler }
            - { call: "POST /api/settlement-groups/${grp}/lock", payload: {}, as: SettlementAnalyst }
          trigger:
            - { call: "GET /api/flocks/${f}/settlement", payload: {}, as: SettlementAnalyst, captures: { s: "$.data[0].net_amount_cents" } }
          assert:
            - "Settlement(flock ${f}).condemnation_deduction_cents == 515 (round_half_up(50000 * 40 * (51/9700 - 0.005), 0) = round_half_up(515.4639, 0))"
            - "per-line rounding then sum: base 300000 + bonus 12500 - 515 = 311985; loan repayment round_half_up(311985*0.15,0)=46798; net_amount_cents == 265187"

  # ------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: settlement_dispute_revision_loop
        grounds:
          - state_machines.Settlement.PENDING_to_DISPUTED
          - state_machines.Settlement.DISPUTED_to_PENDING
        distinguishing_aspect: |
          Settlement has a revision cycle PENDING -> DISPUTED -> PENDING with
          amounts recomputed on resolve; on the Settlement entity (distinct
          from the House machine below).
        test_recipe:
          setup:
            - "Single-grower group locked with a FINAL PENDING settlement for flock F"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-D", full_name: "Dispute Grower" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 10000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-D", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-35", week_ending_date: "2026-10-03" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-D" }, as: IntegratorAdmin, captures: { f: $.data.id } }
            - { call: "POST /api/flocks/${f}/placements", payload: { scheduled_date: "2026-08-01", head_count: 5000 }, as: IntegratorAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/placements/${p}/confirm", payload: {}, as: IntegratorAdmin }
