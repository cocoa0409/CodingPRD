          - calculations.calc_audit_underpayment
          - validations[priority=18]
        distinguishing_aspect: |
          Conserved quantity (different type: an assessment balance, not a
          payable amount): for a SETTLED audit, assessed_underpayment_cents -
          recovered_cents is EXACTLY transferred into the licensee-suspension
          side effect with no double-count — the sum of record_recovery
          payments can never exceed the assessment (ERR_RECOVERY_EXCEEDS_ASSESSMENT
          guards the boundary), so assessed - recovered >= 0 invariantly, and a
          full recovery leaves the licensee ACTIVE with the balance conserved
          at zero.
        test_recipe:
          setup:
            - "Licensee L ACTIVE under NS-1; report C (2026-03-01..2026-03-31, 40000000 perfs) paid (due 104000); audit over March with assessed 84500 (true 50000000)"
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { proceeding_ref: "D-2025-01", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z", rate_per_performance_microcents: 2600, min_fee_cents: 100000, category: "NONSUBSCRIPTION_AD_SUPPORTED" }
              as: Admin
              captures: { sched_id: $.data.id }
            - call: "POST /rate-schedules/${sched_id}/activate"
              payload: {}
              as: Admin
            - call: "POST /licensees"
              payload: { legal_name: "BalCo", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
              captures: { lic_id: $.data.id }
            - call: "POST /licensees/${lic_id}/activate"
              payload: {}
              as: Admin
            - call: "POST /usage-reports"
              payload: { licensee_id: "${lic_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { rep_c: $.data.id }
            - call: "POST /usage-reports/${rep_c}/play-lines"
              payload: { isrc: "NM-B1", track_title: "b1", artist_name: "b1", performance_count: 40000000 }
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /usage-reports/${rep_c}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { rep_c_v: $.data.version }
            - call: "POST /usage-reports/${rep_c}/accept"
              payload: {}
              as: RoyaltyOps
            - call: "POST /usage-reports/${rep_c}/compute-liability"
              payload: { expected_usage_report_version: "${rep_c_v}" }
              as: RoyaltyOps
              captures: { liab_c: $.data.id }
            - call: "POST /royalty-liabilities/${liab_c}/bill"
              payload: {}
              as: RoyaltyOps
            - call: "POST /royalty-liabilities/${liab_c}/record_payment"
              payload: {}
              as: RoyaltyOps
            - call: "POST /licensees/${lic_id}/audit-cases"
              payload: { auditor_ref: "AUD-B1", period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }
              as: RoyaltyAuditor
              as_user_id: "auditor-one"
              captures: { audit_id: $.data.id }
            - call: "POST /audit-cases/${audit_id}/issue_findings"
              payload: { declared_true_performances: 50000000 }
              as: RoyaltyAuditor
              as_user_id: "auditor-two"
          trigger:
            - call: "POST /audit-cases/${audit_id}/record_recovery"
              payload: { amount_cents: 84501, final: false }
              as: RoyaltyAuditor
              as_user_id: "auditor-two"
              captures: { err_over: $.data.error_id }
            - call: "POST /audit-cases/${audit_id}/record_recovery"
              payload: { amount_cents: 84500, final: true }
              as: RoyaltyAuditor
              as_user_id: "auditor-two"
          assert:
            - "err_over == ERR_RECOVERY_EXCEEDS_ASSESSMENT (balance cannot go negative)"
            - "AuditCase.${audit_id}.audit_status == SETTLED"
            - "AuditCase.${audit_id}.recovered_cents == 84500"
            - "AuditCase.${audit_id}.assessed_underpayment_cents - AuditCase.${audit_id}.recovered_cents == 0 (assessment balance conserved)"
            - "Licensee.${lic_id}.license_status == ACTIVE (full recovery: no suspension cascade)"
