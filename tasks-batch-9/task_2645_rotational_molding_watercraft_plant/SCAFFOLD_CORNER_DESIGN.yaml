          assert:
            - "the enter-cooling on a SCHEDULED cycle returns status 409 with data.error_id 'ERR_CYCLE_INVALID_STATE' and the cycle is still SCHEDULED"
            - "the demold on a SCHEDULED cycle returns status 409 with data.error_id 'ERR_CYCLE_INVALID_STATE' and no FinishedUnit row exists"
            - "the first start-oven returns status 200 with status 'OVEN_RUNNING' and ResinCharge.${chg}.status 'CONSUMED'"
            - "the second start-oven returns status 409 with data.error_id 'ERR_CYCLE_INVALID_STATE' and ResinLot.${lot}.consumed_kg is still 24.000, not 48.000"
            - "the enter-cooling returns status 200 with status 'COOLING'"
            - "the demold at 10:29 returns status 422 with data.error_id 'ERR_COOLING_TIME_INSUFFICIENT' and the cycle is still 'COOLING'"
            - "the demold at 10:30 returns status 200 with status 'DEMOLDED' and actual_cooling_minutes 30"
            - "GET /finished-units?molding_cycle_id=${cyc} returns total_count 2, both in build_status 'DEMOLDED'"

      - name: err_mold_lifecycle_family_not_available_active_cycles_and_bad_replacement
        claim_type: violation_to_error
        grounds:
          - errors.ERR_MOLD_NOT_AVAILABLE
          - errors.ERR_MOLD_HAS_ACTIVE_CYCLES
          - errors.ERR_INVALID_MOLD_REPLACEMENT
          - validations.priority_44
          - validations.priority_45
          - validations.priority_67
        distinguishing_aspect: |
          The mould's three refusals are separated by what exactly is wrong:
          complete-service on an AVAILABLE mould is ERR_MOLD_NOT_AVAILABLE
          because that action demands MAINTENANCE, retire on a mould carrying a
          SCHEDULED cycle is ERR_MOLD_HAS_ACTIVE_CYCLES rather than a status
          complaint, and a replaces_mold_id that points at a RETIRED mould of a
          DIFFERENT hull model is 422 ERR_INVALID_MOLD_REPLACEMENT.
        test_recipe:
          setup:
            - "Base plant of the discovery instance plus PM-CD-T3; MLD-CD-1 is AVAILABLE and carries one SCHEDULED cycle for PO-CD-1."
          setup_api_calls:
            - *cd2_clock0
