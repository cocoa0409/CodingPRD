# =============================================================================
# Task 1646 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances, plus a 3rd combinatorial_formula instance = 19.
# All dates respect the logical clock default 2026-08-01T00:00:00Z and
# monotonic clock advancement within each recipe.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: depreciation_convention_full_vs_half_year
        grounds:
          - calculations.asset_depreciation
          - entities.JurisdictionClassRule.fields.depreciation_convention
          - entities.Rendition.fields.lines
        distinguishing_aspect: |
          Same asset data (cost 1000000, acquired 2025-03-10, in service
          2025-08-01) depreciates under FULL_YEAR in jurisdiction JFULL (age =
          2027-2025 = 2 -> 60% -> 600000) and under HALF_YEAR in JHALF (age =
          2027-2025-1 = 1 because in_service_date >= July 1 -> 75% -> 750000):
          identical inputs, two valid conventions, different assessed values on
          the Asset/RenditionLine domain.
        test_recipe:
          setup:
            - "Client C with one MACHINERY asset of identical data in jurisdiction JFULL (FULL_YEAR, vector [80,70,60]) and one in JHALF (HALF_YEAR, vector [90,75,60,45])"
            - "Both assets classified TAXABLE; one DRAFT rendition per jurisdiction for tax_year 2027"
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "DualCo", contact_email: "dual@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Ann Analyst", operator_role: "TAX_ANALYST" }
              as: FirmAdmin
              captures: { op_an: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Full County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.02, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_full: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Half County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.02, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_half: $.data.id }
            - call: "POST /bpp/class-rules"
              payload: { jurisdiction_id: "${j_full}", category: "MACHINERY", is_taxable: true, depreciation_convention: "FULL_YEAR", percent_good_vector: [80, 70, 60], percent_good_floor_pct: 30, de_minimis_line_cents: 0 }
              as: FirmAdmin
            - call: "POST /bpp/class-rules"
              payload: { jurisdiction_id: "${j_half}", category: "MACHINERY", is_taxable: true, depreciation_convention: "HALF_YEAR", percent_good_vector: [90, 75, 60, 45], percent_good_floor_pct: 20, de_minimis_line_cents: 0 }
              as: FirmAdmin
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_full}", asset_tag: "A-FULL", category: "MACHINERY", acquisition_cost_cents: 1000000, acquisition_date: "2025-03-10", in_service_date: "2025-08-01" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { a_full: $.data.id }
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_half}", asset_tag: "A-HALF", category: "MACHINERY", acquisition_cost_cents: 1000000, acquisition_date: "2025-03-10", in_service_date: "2025-08-01" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { a_half: $.data.id }
            - call: "POST /bpp/assets/${a_full}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets/${a_half}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_full}", tax_year: 2027 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_full: $.data.id }
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_half}", tax_year: 2027 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_half: $.data.id }
          trigger:
            - call: "POST /bpp/renditions/${r_full}/generate-lines"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { tot_full: $.data.total_assessed_value_cents }
            - call: "POST /bpp/renditions/${r_half}/generate-lines"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { tot_half: $.data.total_assessed_value_cents }
          assert:
            - "Rendition.${r_full}.total_assessed_value_cents == 600000 (FULL_YEAR age 2, 60% of 1000000)"
            - "Rendition.${r_half}.total_assessed_value_cents == 750000 (HALF_YEAR age 1, 75% of 1000000)"
            - "tot_full != tot_half — identical asset data, different conventions, different values"

      - name: forecast_variant_notice_based_vs_rendered_conservative
        grounds:
          - calculations.accrual_forecast
          - entities.AccrualForecast.fields.variant
          - concurrency_rules[forecast-create-stale-client]
        distinguishing_aspect: |
          On the AccrualForecast (budget) domain — a different entity domain
          than the depreciation instance — the same filed data yields
          forecasted_liability_cents 64000 under NOTICE_BASED and 70400 under
          RENDERED_CONSERVATIVE (10% uplift on rendered values).
        test_recipe:
          setup:
            - "Client C with jurisdiction JN1 (rate 0.02, FULL_YEAR [80,70,60]): assets G1 cost 1000000 acq 2025-03-10 (age 2 -> 600000) and G2 cost 500000 acq 2026-01-20 (age 1 -> 350000); rendition 2027 FILED, total 950000"
            - "Jurisdiction JN2 (rate 0.03, HALF_YEAR [90,75,60,45]): asset G3 cost 2000000 acq 2025-02-01, in service 2025-08-01 (age 1 -> 75% -> 1500000); rendition 2027 FILED, total 1500000"
            - "Each rendition has an ACCEPTED notice equal to its rendition total (950000 and 1500000)"
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "ForeCo", contact_email: "fore@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "POST /bpp/operators"
              payload: { display_name: "Ann Analyst", operator_role: "TAX_ANALYST" }
              as: FirmAdmin
              captures: { op_an: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Manny Manager", operator_role: "SENIOR_MANAGER" }
              as: FirmAdmin
              captures: { op_mgr: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "North County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.02, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_n1: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "South County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.03, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_n2: $.data.id }
            - call: "POST /bpp/class-rules"
              payload: { jurisdiction_id: "${j_n1}", category: "MACHINERY", is_taxable: true, depreciation_convention: "FULL_YEAR", percent_good_vector: [80, 70, 60], percent_good_floor_pct: 30, de_minimis_line_cents: 0 }
              as: FirmAdmin
            - call: "POST /bpp/class-rules"
              payload: { jurisdiction_id: "${j_n2}", category: "MACHINERY", is_taxable: true, depreciation_convention: "HALF_YEAR", percent_good_vector: [90, 75, 60, 45], percent_good_floor_pct: 20, de_minimis_line_cents: 0 }
              as: FirmAdmin
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_n1}", asset_tag: "G1", category: "MACHINERY", acquisition_cost_cents: 1000000, acquisition_date: "2025-03-10", in_service_date: "2025-04-01" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { g1: $.data.id }
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_n1}", asset_tag: "G2", category: "MACHINERY", acquisition_cost_cents: 500000, acquisition_date: "2026-01-20", in_service_date: "2026-02-01" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { g2: $.data.id }
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_n2}", asset_tag: "G3", category: "MACHINERY", acquisition_cost_cents: 2000000, acquisition_date: "2025-02-01", in_service_date: "2025-08-01" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { g3: $.data.id }
            - call: "POST /bpp/assets/${g1}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets/${g2}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets/${g3}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_n1}", tax_year: 2027 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_n1: $.data.id }
            - call: "POST /bpp/renditions/${r_n1}/generate-lines"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions/${r_n1}/file"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_n2}", tax_year: 2027 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_n2: $.data.id }
            - call: "POST /bpp/renditions/${r_n2}/generate-lines"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions/${r_n2}/file"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions/${r_n1}/assessment-notices"
              payload: { notice_value_cents: 950000, received_date: "2027-05-01", protest_deadline_date: "2027-05-31" }
              as: AssessorClerk
              captures: { n_n1: $.data.id }
            - call: "POST /bpp/assessment-notices/${n_n1}/accept"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions/${r_n2}/assessment-notices"
              payload: { notice_value_cents: 1500000, received_date: "2027-05-01", protest_deadline_date: "2027-05-31" }
              as: AssessorClerk
              captures: { n_n2: $.data.id }
            - call: "POST /bpp/assessment-notices/${n_n2}/accept"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
          trigger:
            - call: "POST /bpp/clients/${cl_id}/accrual-forecasts"
              payload: { tax_year: 2027, variant: "NOTICE_BASED", as_of_date: "2027-03-01", expected_client_version: "${cl_v}" }
              as: SeniorManager
              as_user_id: "${op_mgr}"
              captures: { f_nb: $.data.id, f_nb_liability: $.data.forecasted_liability_cents, f_nb_components: $.data.component_count }
            - call: "GET /bpp/clients/${cl_id}"
              payload: {}
              as: SeniorManager
              as_user_id: "${op_mgr}"
              captures: { cl_v2: $.data.version }
            - call: "POST /bpp/clients/${cl_id}/accrual-forecasts"
              payload: { tax_year: 2027, variant: "RENDERED_CONSERVATIVE", as_of_date: "2027-03-01", expected_client_version: "${cl_v2}" }
              as: SeniorManager
              as_user_id: "${op_mgr}"
              captures: { f_rc: $.data.id, f_rc_liability: $.data.forecasted_liability_cents }
          assert:
            - "AccrualForecast.${f_nb}.forecasted_liability_cents == 64000 (950000*0.02 + 1500000*0.03 = 19000 + 45000)"
            - "AccrualForecast.${f_nb}.component_count == 2"
            - "AccrualForecast.${f_rc}.forecasted_liability_cents == 70400 (1045000*0.02 + 1650000*0.03 = 20900 + 49500)"
            - "f_nb_liability != f_rc_liability for identical underlying data"
            - "AccrualForecast.${f_nb}.forecast_status == SUPERSEDED after the second publish (list via GET /bpp/clients/${cl_id}/accrual-forecasts)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: late_penalty_tiered_cap_and_base_modes
        grounds:
          - calculations.late_filing_penalty
          - validations[priority=6]
        distinguishing_aspect: |
          Mode (a): penalty_pct = min(ceil(late_days/30) * 2, 10) with a
          conditional base branch (VALUE_BASE) — filing 11 days late yields
          months=1 -> 2% -> 12000 on a 600000 rendition; filing 230 days late
          hits the cap branch -> 10% -> 60000; the nested min() and the
          ceil-months tiering interact non-linearly.
        test_recipe:
          setup:
            - "Jurisdiction JP (deadline 04-15, 2% per month, cap 10%, VALUE_BASE, rate 0.02, FULL_YEAR [80,70,60], de_minimis 0)"
            - "Client C1 with asset cost 1000000 acq 2025-03-10 (600000 assessed) and rendition R1 for 2027; client C2 with identical asset and rendition R2 for 2027; both renditions generated but not yet filed"
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "PenOne", contact_email: "p1@x.com" }
              as: FirmAdmin
              captures: { cl_1: $.data.id }
            - call: "POST /bpp/clients"
              payload: { legal_name: "PenTwo", contact_email: "p2@x.com" }
              as: FirmAdmin
              captures: { cl_2: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Ann Analyst", operator_role: "TAX_ANALYST" }
              as: FirmAdmin
              captures: { op_an: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Penalty County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.02, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_p: $.data.id }
            - call: "POST /bpp/class-rules"
              payload: { jurisdiction_id: "${j_p}", category: "MACHINERY", is_taxable: true, depreciation_convention: "FULL_YEAR", percent_good_vector: [80, 70, 60], percent_good_floor_pct: 30, de_minimis_line_cents: 0 }
              as: FirmAdmin
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_1}", jurisdiction_id: "${j_p}", asset_tag: "P1", category: "MACHINERY", acquisition_cost_cents: 1000000, acquisition_date: "2025-03-10", in_service_date: "2025-04-01" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { a_p1: $.data.id }
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_2}", jurisdiction_id: "${j_p}", asset_tag: "P2", category: "MACHINERY", acquisition_cost_cents: 1000000, acquisition_date: "2025-03-10", in_service_date: "2025-04-01" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { a_p2: $.data.id }
            - call: "POST /bpp/assets/${a_p1}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets/${a_p2}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_1}", jurisdiction_id: "${j_p}", tax_year: 2027 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_p1: $.data.id }
            - call: "POST /bpp/renditions/${r_p1}/generate-lines"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_2}", jurisdiction_id: "${j_p}", tax_year: 2027 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_p2: $.data.id }
            - call: "POST /bpp/renditions/${r_p2}/generate-lines"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/_clock/set-current-utc"
              payload: { to_iso8601: "2027-04-26T00:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /bpp/renditions/${r_p1}/file"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/_clock/set-current-utc"
              payload: { to_iso8601: "2027-12-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /bpp/renditions/${r_p2}/file"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
          assert:
            - "Rendition.${r_p1}.is_late_filing == true and late_days == 11 and late_penalty_months == 1"
            - "Rendition.${r_p1}.late_penalty_cents == 12000 (600000 * 2%)"
            - "Rendition.${r_p2}.late_days == 230 and late_penalty_months == 8"
            - "Rendition.${r_p2}.late_penalty_cents == 60000 (cap branch: min(8*2, 10) = 10% of 600000)"

      - name: rendition_total_per_line_rounding_order
        grounds:
          - calculations.rendition_total_aggregation
          - calculations.asset_depreciation
        distinguishing_aspect: |
          Mode (b) nested rounding: two assets at cost 101 with percent_good 50
          produce raw 50.5 cents each; the pinned per-line-round-then-sum order
          yields 51 + 51 = 102, while the forbidden sum-then-round order yields
          round(101.0) = 101 — the test pins 102.
        test_recipe:
          setup:
            - "Jurisdiction JR (FULL_YEAR, vector [100,50], floor 10, de_minimis 0, deadline 04-15)"
            - "Client C with two MACHINERY assets cost 101 each, acquired 2026-02-01, in service 2026-02-05 (age 1 in tax_year 2027 -> 50%), both classified TAXABLE; rendition for 2027"
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "RoundCo", contact_email: "round@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Ann Analyst", operator_role: "TAX_ANALYST" }
              as: FirmAdmin
              captures: { op_an: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Round County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.01, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_r: $.data.id }
            - call: "POST /bpp/class-rules"
              payload: { jurisdiction_id: "${j_r}", category: "MACHINERY", is_taxable: true, depreciation_convention: "FULL_YEAR", percent_good_vector: [100, 50], percent_good_floor_pct: 10, de_minimis_line_cents: 0 }
              as: FirmAdmin
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_r}", asset_tag: "R1", category: "MACHINERY", acquisition_cost_cents: 101, acquisition_date: "2026-02-01", in_service_date: "2026-02-05" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { a_r1: $.data.id }
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_r}", asset_tag: "R2", category: "MACHINERY", acquisition_cost_cents: 101, acquisition_date: "2026-02-01", in_service_date: "2026-02-05" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { a_r2: $.data.id }
            - call: "POST /bpp/assets/${a_r1}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets/${a_r2}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_r}", tax_year: 2027 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_r: $.data.id }
          trigger:
            - call: "POST /bpp/renditions/${r_r}/generate-lines"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
          assert:
            - "Rendition.${r_r}.lines has 2 lines each with assessed_value_cents == 51 (round_half_up(101*50/100) per line)"
            - "Rendition.${r_r}.total_assessed_value_cents == 102 (per-line rounding then sum; sum-then-round would give 101)"

      - name: exemption_cap_evaluation_order
        grounds:
          - calculations.tax_bill_validation
          - entities.TaxBill.fields.validated_amount_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the exemption credit is capped
          at 50% of the gross tax, but the gross tax depends on the value
          BEFORE the exemption. Pinned order yields gross 20000, credit
          min(640000, 10000) = 10000, validated 10000; an implementation that
          nets the exemption out before computing tax yields 4000 — different
          answer, so the pinned order is falsifiable.
        test_recipe:
          setup:
            - "Jurisdiction JE (rate via bill 0.025, offers FREEPORT, max_exemption_pct 100, FULL_YEAR [100,100], floor 10, de_minimis 0)"
            - "Client C with asset cost 800000 acq 2026-01-05 (age 1 -> 100% -> 800000), classified TAXABLE"
            - "APPROVED FREEPORT exemption at 80% on the asset covering the 2027 lien date (effective 2026-06-01, expiration 2028-06-01)"
            - "Rendition 2027 FILED on time; notice 800000 ACCEPTED; bill imported with billed_amount_cents 10000, tax_rate 0.025, due 2027-06-30"
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "CapCo", contact_email: "cap@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
