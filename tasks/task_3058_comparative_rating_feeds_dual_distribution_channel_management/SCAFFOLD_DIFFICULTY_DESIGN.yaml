  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_fiscal_on_draft_statement_clawback
        grounds:
          - validations.priority_6_state
          - validations.priority_10_business_fiscal
          - errors.ERR_INVALID_STATE_TRANSITION
          - errors.ERR_NOTHING_TO_PAY
        distinguishing_aspect: |
          Category pair: state vs business_fiscal. A pay call on a DRAFT
          statement whose net is 0 violates BOTH the state rule (pay requires
          FINALIZED) and the fiscal rule (pay requires net > 0); the state
          error ERR_INVALID_STATE_TRANSITION (priority 6) must win over
          ERR_NOTHING_TO_PAY (priority 10).
        test_recipe:
          setup:
            - "Logical clock 2026-01-01T00:00:00Z. Agent A APPOINTED (TX, AUTO). No policies bound in February, so the February statement computes commission 0 and net_payable 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /agents"
              payload: { agency_name: "Hill Country Insurance", principal_name: "A. Reyes", resident_state_code: "TX" }
              as: CarrierAdmin
              captures: { agent_a: $.data.id }
            - call: "POST /agents/${agent_a}/appointments"
              payload: { state_code: "TX", line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z" }
              as: UnderwritingReviewer
            - call: "POST /agents/${agent_a}/appoint"
              payload: {}
              as: UnderwritingReviewer
            - call: "POST /agents/${agent_a}/commission-statements"
              payload: { period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }
              as: CarrierAdmin
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /commission-statements/${stmt_id}/pay"
              payload: {}
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_INVALID_STATE_TRANSITION (state priority 6)"
            - "error_id != ERR_NOTHING_TO_PAY even though net_payable_cents == 0 also violates the fiscal rule"
            - "CommissionStatement.${stmt_id}.status remains DRAFT"

      - name: business_temporal_beats_business_referential_on_feed_create
        grounds:
          - validations.priority_8_business_temporal
          - validations.priority_9_business_referential
          - errors.ERR_FEED_WINDOW_OVERLAP
          - errors.ERR_PRODUCT_NOT_PUBLISHABLE
        distinguishing_aspect: |
          Category pair: business_temporal vs business_referential (different
          pair from state/fiscal). A feed-publication create whose window
          strictly overlaps a sibling AND whose product is still DRAFT fails
          with ERR_FEED_WINDOW_OVERLAP (priority 8), never
          ERR_PRODUCT_NOT_PUBLISHABLE (priority 9).
        test_recipe:
          setup:
            - "Logical clock 2026-01-01T00:00:00Z. Product P-AUTO ACTIVE; rater R created; publication F1 for (R, P-AUTO) created with window [2026-01-01, 2026-07-01) while the product is ACTIVE."
            - "P-AUTO is then WITHDRAWN (no live quotes reference it), so the trigger call violates BOTH the temporal rule (F2's window [2026-03-01, 2026-09-01) strictly overlaps F1's DRAFT window) and the referential rule (product no longer ACTIVE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /products"
              payload: { product_code: "P-AUTO", line_of_business: "AUTO", state_code: "TX", channel_availability: "BOTH", coverage_rates: { LIABILITY: { BASIC: 50000 } }, min_premium_cents: 0 }
              as: RatingManager
              captures: { p_auto: $.data.id }
            - call: "POST /products/${p_auto}/activate"
              payload: {}
              as: RatingManager
            - call: "POST /raters"
              payload: { rater_code: "PL-RATER", display_name: "PL Rater", feed_format_version: "v4.2", accepted_line_of_business: "AUTO" }
              as: RatingManager
              captures: { rater_id: $.data.id, rater_v: $.data.version }
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_auto}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-07-01T00:00:00Z", rate_table_payload: { t: "f1" }, expected_rater_version: "${rater_v}" }
              as: RatingManager
              captures: { feed_f1: $.data.id, rater_v2: $.data.version }
            - call: "POST /products/${p_auto}/withdraw"
              payload: {}
              as: RatingManager
            - call: "GET /raters/${rater_id}"
              payload: {}
              as: RatingManager
              captures: { rater_v3: $.data.version }
          trigger:
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_auto}", effective_start: "2026-03-01T00:00:00Z", effective_end: "2026-09-01T00:00:00Z", rate_table_payload: { t: "f2" }, expected_rater_version: "${rater_v3}" }
              as: RatingManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_FEED_WINDOW_OVERLAP (temporal priority 8)"
            - "error_id != ERR_PRODUCT_NOT_PUBLISHABLE even though the product is WITHDRAWN (referential priority 9 also violated)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: loss_ratio_strict_threshold_boundary_on_bonus_gate
        grounds:
          - calculations.trailing_loss_ratio
          - calculations.contingent_bonus_settlement
          - entities.ContingentBonusPool.fields.loss_ratio_threshold
        distinguishing_aspect: |
          Metric: loss ratio (4-decimal). The gate is STRICT <: an agent at
          exactly 0.7000 is INELIGIBLE (claims 140000 / earned 200000), while
          an agent at 0.6999 (claims 139980 / earned 200000) is ELIGIBLE.
          Reached via the pool-settle endpoint.
        test_recipe:
          setup:
            - "P-FLAT ACTIVE (BOTH; TIER_D 730000; factors 0). Feed published. Agents B1 and B2 APPOINTED (TX, AUTO) with contingent-eligible schedules."
            - "At clock 2026-01-01T00:00:00Z both bind one AGENT policy [FLAT/TIER_D] (730000)."
            - "Claims: B1 140000 (ratio exactly 0.7000), B2 139980 (ratio 0.6999)."
            - "Clock at 2026-04-11T00:00:00Z (100 days in force -> earned 200000 each). Pool of 1000000 created with default threshold 0.70."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /products"
              payload: { product_code: "P-FLAT", line_of_business: "AUTO", state_code: "TX", channel_availability: "BOTH", coverage_rates: { FLAT: { TIER_D: 730000 } }, min_premium_cents: 0 }
              as: RatingManager
              captures: { p_flat: $.data.id }
            - call: "POST /products/${p_flat}/activate"
              payload: {}
              as: RatingManager
            - call: "POST /raters"
              payload: { rater_code: "PL-RATER", display_name: "PL Rater", feed_format_version: "v4.2", accepted_line_of_business: "AUTO" }
              as: RatingManager
              captures: { rater_id: $.data.id, rater_v: $.data.version }
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_flat}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", rate_table_payload: { t: "f" }, expected_rater_version: "${rater_v}" }
              as: RatingManager
              captures: { feed_id: $.data.id }
            - call: "POST /rate-feed-publications/${feed_id}/publish"
              payload: {}
              as: RatingManager
            - call: "POST /agents"
              payload: { agency_name: "B1 Agency", principal_name: "B One", resident_state_code: "TX" }
              as: CarrierAdmin
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /agents/${b1}/appointments"
              payload: { state_code: "TX", line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z" }
              as: UnderwritingReviewer
            - call: "POST /agents/${b1}/appoint"
              payload: {}
              as: UnderwritingReviewer
            - call: "POST /agents/${b1}/commission-schedules"
              payload: { line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z", tiers: [{ up_to_cents: null, rate_pct: 0.10 }], contingent_bonus_eligible: true, expected_agent_version: "${b1_v} + 1" }
              as: CarrierAdmin
            - call: "POST /agents"
              payload: { agency_name: "B2 Agency", principal_name: "B Two", resident_state_code: "TX" }
              as: CarrierAdmin
              captures: { b2: $.data.id, b2_v: $.data.version }
            - call: "POST /agents/${b2}/appointments"
              payload: { state_code: "TX", line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z" }
              as: UnderwritingReviewer
            - call: "POST /agents/${b2}/appoint"
              payload: {}
              as: UnderwritingReviewer
            - call: "POST /agents/${b2}/commission-schedules"
              payload: { line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z", tiers: [{ up_to_cents: null, rate_pct: 0.10 }], contingent_bonus_eligible: true, expected_agent_version: "${b2_v} + 1" }
              as: CarrierAdmin
