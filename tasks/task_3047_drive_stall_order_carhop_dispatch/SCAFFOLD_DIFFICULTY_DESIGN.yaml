            - call: "POST /locations/${loc18_id}/stalls/${stall18_id}/checkin"
              payload: { expected_location_version: "${loc18_v0}" }
              as: ShiftManager
              captures: { o18_id: $.data.id }
            - call: "POST /locations/${loc18_id}/orders/${o18_id}/lines"
              payload: { menu_item_id: "${food18}", quantity: 1 }
              as: ShiftManager
            - call: "POST /locations/${loc18_id}/orders/${o18_id}/place"
              payload: {}
              as: ShiftManager
            - call: "POST /locations/${loc18_id}/orders/${o18_id}/start_preparation"
              payload: {}
              as: KitchenStaff
            - call: "POST /locations/${loc18_id}/orders/${o18_id}/mark_ready"
              payload: {}
              as: KitchenStaff
            - call: "POST /locations/${loc18_id}/orders/${o18_id}/authorize_payment"
