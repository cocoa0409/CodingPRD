            - "Disjoint start 2026-08-15 succeeds: SupportPackage.${pkg2_id}.starts_on == 2026-08-15 and expires_on == 2026-08-28"
            - "Both packages carry status ACTIVE; consumable_package_selector disambiguates by window membership"

