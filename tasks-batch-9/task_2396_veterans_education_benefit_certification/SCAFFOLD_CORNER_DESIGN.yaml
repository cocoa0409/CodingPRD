            - "Trigger step 2 returns HTTP 400 with error_id == ERR_INVALID_REQUEST — the missing credit_hours_total precedes the unknown student_id, and no second certification row is created"
            - "Trigger step 3 returns HTTP 403 with error_id == ERR_OFFICIAL_LEVEL_MISMATCH — the SUPERVISORY identity acting as SchoolCertifyingOfficial is caught before the duplicate student_number"
            - "Trigger step 4 returns HTTP 404 with error_id == ERR_CERTIFICATION_NOT_FOUND — the unknown body FK precedes the optimistic-concurrency comparison, which would otherwise answer 412"
