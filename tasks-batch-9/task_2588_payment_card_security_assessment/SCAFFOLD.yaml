    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: ["requirement_assessment_id?", "engagement_id?", "component_id?", "collector_assessor_id?", "evidence_type?", "sufficiency?", "limit?", "offset?"]
    output: EvidenceItem[]
    side_effects: []

  # ----- CompensatingControlWorksheet --------------------------------------
  - method: POST
    path: "/requirement-assessments/{id}/ccws"
    description: "Draft a compensating control worksheet for a requirement that cannot be met as stated."
    roles: [LeadAssessor]
    code: 201
    input: [constraint_text, objective_text, identified_risk_text, control_refs, monitoring_interval_days, validation_text, maintenance_text, expected_requirement_assessment_version]
    output: CompensatingControlWorksheet
    side_effects: ["OCC check against RequirementAssessment.version (§1.2.1 ccw-create-stale-requirement)", "§1.3 ccw_rigor_score computes control_depth_points, monitoring_factor, risk_offset_points, rigor_score and thin_control_capped", "any earlier DRAFT or REJECTED worksheet for the same requirement moves to SUPERSEDED", "increments RequirementAssessment.version by 1"]

  - method: GET
    path: "/ccws/{id}"
    description: "Read one compensating control worksheet including its rigor breakdown."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: []
    output: CompensatingControlWorksheet
    side_effects: []

  - method: GET
    path: "/ccws"
    description: "List worksheets; the requirement_assessment_id and engagement_id filters make both FKs reverse-reachable."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: ["requirement_assessment_id?", "engagement_id?", "status?", "thin_control_capped?", "limit?", "offset?"]
    output: CompensatingControlWorksheet[]
    side_effects: []

  - method: POST
    path: "/ccws/{id}/submit"
    description: "Submit a worksheet for quality-assurance decision."
    roles: [LeadAssessor]
    code: 200
    input: []
    output: CompensatingControlWorksheet
    side_effects: ["status DRAFT -> SUBMITTED", "rigor fields refreshed from §1.3 ccw_rigor_score", "ccw.version incremented by 1"]

  - method: POST
    path: "/ccws/{id}/decision"
    description: "Accept or reject a compensating control worksheet."
    roles: [QaReviewer]
    code: 200
    input: [decision, reviewer_note]
    output: CompensatingControlWorksheet
    side_effects: ["ACCEPT requires rigor_score >= 70.00 and monitoring_interval_days <= 30 and runs cascade chain C (requirement -> IN_PLACE_WITH_CCW, remediation items -> CLOSED_BY_CCW, open_gap_count down, accepted_ccw_count up, fee and compliance recomputed, posture recomputed)", "REJECT leaves the requirement and the gap ledger untouched", "ccw.version, requirement.version and engagement.version incremented by 1"]

  # ----- RemediationItem ----------------------------------------------------
  - method: GET
    path: "/remediation-items/{id}"
    description: "Read one remediation item."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: []
    output: RemediationItem
    side_effects: []

  - method: GET
    path: "/remediation-items"
    description: "List remediation items; the three filters make engagement_id, requirement_assessment_id and source_scan_finding_id reverse-reachable. Cascade-created items are discoverable only here."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "requirement_assessment_id?", "source_scan_finding_id?", "status?", "severity?", "source?", "limit?", "offset?"]
    output: RemediationItem[]
    side_effects: []

  - method: POST
    path: "/remediation-items/{id}/assign"
    description: "Assign an owner and due date to a gap."
    roles: [LeadAssessor]
    code: 200
    input: [owner_reference, due_date]
    output: RemediationItem
    side_effects: ["status OPEN or RETEST_FAILED -> IN_PROGRESS", "item still counts toward engagement.open_gap_count", "item.version incremented by 1"]

  - method: POST
    path: "/remediation-items/{id}/retest"
    description: "Record the retest outcome for a gap."
    roles: [LeadAssessor, Assessor]
    code: 200
    input: [outcome, "note?"]
    output: RemediationItem
    side_effects: ["PASS runs cascade chain D (item -> RETEST_PASSED, requirement -> IN_PLACE / GAP_REMEDIATED, open_gap_count restored, posture OPEN, as_attested restored while as_found stays lower)", "FAIL -> RETEST_FAILED and the gap stays counted", "retest_count incremented by 1", "item.version, requirement.version and engagement.version incremented by 1"]

  # ----- RocReport ----------------------------------------------------------
  - method: POST
    path: "/engagements/{id}/rocs"
    description: "Author the Report on Compliance from the engagement's requirement conclusions."
    roles: [LeadAssessor]
    code: 201
    input: [roc_version_label]
    output: RocReport
    side_effects: ["requires posture OPEN — a single open gap or unvalidated segment answers ERR_ENGAGEMENT_RESTRICTED", "status DRAFTING", "§1.3 compliance_projection writes both percentages, in_place_count, ccw_covered_count, not_in_place_count and compliance_result", "engagement.status FIELDWORK -> REPORTING and posture -> FROZEN", "increments Engagement.version by 1"]

  - method: GET
    path: "/rocs/{id}"
    description: "Read one Report on Compliance."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: []
    output: RocReport
    side_effects: []

  - method: GET
    path: "/rocs"
    description: "List reports; the engagement_id and attesting_assessor_id filters make both FKs reverse-reachable."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "attesting_assessor_id?", "status?", "compliance_result?", "limit?", "offset?"]
    output: RocReport[]
    side_effects: []

  - method: POST
    path: "/rocs/{id}/qa-submit"
    description: "Hand the report to the internal quality-assurance reviewer."
    roles: [LeadAssessor]
    code: 200
    input: []
    output: RocReport
    side_effects: ["status DRAFTING -> IN_QA", "roc.version incremented by 1"]

  - method: POST
    path: "/rocs/{id}/qa-review"
    description: "Approve or reject the report; the reviewer must be independent of the fieldwork."
    roles: [QaReviewer]
    code: 200
    input: [decision, qa_decision_note]
    output: RocReport
    side_effects: ["independence check (priority 11) runs before the reviewer's certification check (priority 12)", "APPROVE -> QA_APPROVED and both compliance percentages are refreshed", "REJECT -> QA_REJECTED with no recomputation", "roc.version incremented by 1"]

  - method: POST
    path: "/rocs/{id}/revise"
    description: "Take a rejected report back into fieldwork for revision."
    roles: [LeadAssessor]
    code: 200
    input: [revision_note]
    output: RocReport
    side_effects: ["status QA_REJECTED -> DRAFTING and revision_count incremented by 1", "engagement.status REPORTING -> FIELDWORK and posture recomputed away from FROZEN", "roc.version and engagement.version incremented by 1"]

  - method: POST
    path: "/rocs/{id}/attest"
    description: "Sign the attestation of compliance."
    roles: [LeadAssessor]
    code: 200
    input: [attestation_signature_name]
    output: RocReport
    side_effects: ["requires quarterly_scan_compliant == true and an unexpired lead certification", "status QA_APPROVED -> ATTESTED with attesting_assessor_id and attested_at", "engagement.status REPORTING -> ATTESTED", "roc.version and engagement.version incremented by 1"]

  - method: POST
    path: "/rocs/{id}/submission"
    description: "Submit the attested report to the acquirer or card brand."
    roles: [LeadAssessor]
    code: 200
    input: [submitted_to, submission_reference]
    output: RocReport
    side_effects: ["status ATTESTED -> SUBMITTED", "engagement.status ATTESTED -> SUBMITTED", "engagement.reassessment_due_date = clock date + 365 days", "roc.version and engagement.version incremented by 1"]

  # ----- ScanCycle ----------------------------------------------------------
  - method: POST
    path: "/engagements/{id}/scan-cycles"
    description: "Schedule a quarterly external scan window with an approved scanning vendor."
    roles: [LeadAssessor]
    code: 201
    input: [quarter_label, asv_vendor_id, window_start]
    output: ScanCycle
    side_effects: ["vendor effective_approval checked (priority 7) before the window-overlap check (priority 12)", "window_end computed as window_start + 90 days, exclusive", "status SCHEDULED", "engagement.quarterly_scan_compliant recomputed"]

  - method: GET
    path: "/scan-cycles/{id}"
    description: "Read one scan cycle including its finding ledger."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: []
    output: ScanCycle
    side_effects: []

  - method: GET
    path: "/scan-cycles"
    description: "List scan cycles; the engagement_id and asv_vendor_id filters make both FKs reverse-reachable."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "asv_vendor_id?", "status?", "quarter_label?", "limit?", "offset?"]
    output: ScanCycle[]
    side_effects: []

  - method: POST
    path: "/scan-cycles/{id}/complete"
    description: "Close the scan and publish the pass or fail verdict."
    roles: [AsvVendor]
    code: 200
    input: []
    output: ScanCycle
    side_effects: ["status SCHEDULED -> PASSING when effective_high_finding_count == 0, else -> FAILING", "scan_completed_at and attestation_of_scan_compliance written", "engagement.quarterly_scan_compliant recomputed", "cycle.version and engagement.version incremented by 1"]

  # ----- ScanFinding --------------------------------------------------------
  - method: POST
    path: "/scan-cycles/{id}/findings"
    description: "Report a vulnerability found during the external scan."
    roles: [AsvVendor]
    code: 201
    input: [plugin_reference, cvss_score, component_id]
    output: ScanFinding
    side_effects: ["severity_class derived from the inclusive 4.0 CVSS threshold", "cycle.raw_high_finding_count and effective_high_finding_count recomputed", "dispute_status NONE"]

  - method: GET
    path: "/scan-findings/{id}"
    description: "Read one scan finding."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: []
    output: ScanFinding
    side_effects: []

  - method: GET
    path: "/scan-findings"
    description: "List scan findings; the scan_cycle_id and component_id filters make both FKs reverse-reachable."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: ["scan_cycle_id?", "component_id?", "dispute_status?", "severity_class?", "limit?", "offset?"]
    output: ScanFinding[]
    side_effects: []

  - method: POST
    path: "/scan-findings/{id}/dispute"
    description: "Dispute a high-severity finding as a false positive."
    roles: [LeadAssessor, ClientRepresentative]
    code: 200
    input: [dispute_rationale]
    output: ScanFinding
    side_effects: ["dispute_status NONE -> DISPUTED", "cycle.open_dispute_count incremented and cycle FAILING -> DISPUTE_OPEN", "finding.version and cycle.version incremented by 1"]

  - method: POST
    path: "/scan-findings/{id}/dispute-decision"
    description: "The scanning vendor rules on a false-positive dispute."
    roles: [AsvVendor]
    code: 200
    input: [decision, decision_note]
    output: ScanFinding
    side_effects: ["ACCEPT -> ACCEPTED_FALSE_POSITIVE, effective_high_finding_count decremented, cycle may reach PASSING", "REJECT -> REJECTED and cascade chain E runs (cycle -> FAILING, quarterly_scan_compliant false, requirement 11.3.1 reverted, RemediationItem created, posture RESTRICTED)", "finding.version, cycle.version, requirement.version and engagement.version incremented by 1"]

  # ----- ChangeLogEntry -----------------------------------------------------
  - method: POST
    path: "/engagements/{id}/change-log-entries"
    description: "Record an in-year change to the assessed environment."
    roles: [LeadAssessor, Assessor, ClientRepresentative]
    code: 201
    input: [change_type, description, affects_scope, "component_id?"]
    output: ChangeLogEntry
    side_effects: ["triggers_reassessment derived per §1.3 reassessment_trigger", "engagement.scope_affecting_change_count and reassessment_required recomputed", "when reassessment_required first flips true, reassessment_due_date is pulled forward to clock date + 90 days"]

  - method: GET
    path: "/change-log-entries/{id}"
    description: "Read one change-log entry."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: []
    output: ChangeLogEntry
    side_effects: []

  - method: GET
    path: "/change-log-entries"
    description: "List change-log entries; the engagement_id and component_id filters make both FKs reverse-reachable."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "component_id?", "change_type?", "affects_scope?", "triggers_reassessment?", "limit?", "offset?"]
    output: ChangeLogEntry[]
    side_effects: []

  # ----- Test-driving endpoint ---------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every certification, approval, scan-window and due-date rule evaluates against that default and never against real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["every computed field that reads the clock (Assessor.certification_status, AsvVendor.effective_approval, Engagement.quarterly_scan_compliant and reassessment_required) is re-derived on the next read"]

# =============================================================================
# §1.6 Error Code Catalog — every code is triggerable through §1.5
# =============================================================================
errors:

  # --- auth / shape ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID header absent or not resolvable to an assessor, a vendor or a recognised operator."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, wrong type, fieldwork_end_date earlier than fieldwork_start_date, monitoring_interval_days below 1, cvss_score outside 0.0..10.0, empty control_refs, or pagination outside limit 1..100 / offset >= 0."

  # --- existence ---
  - id: ERR_ASSESSOR_NOT_FOUND
    http: 404
    condition: "An assessor id in the path or body does not exist."
  - id: ERR_ASV_VENDOR_NOT_FOUND
    http: 404
    condition: "A scanning-vendor id in the path or body does not exist."
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "An engagement id in the path does not exist."
  - id: ERR_SEGMENT_NOT_FOUND
    http: 404
    condition: "A network-segment id in the path or a parent_segment_id in the body does not exist."
  - id: ERR_COMPONENT_NOT_FOUND
    http: 404
    condition: "A system-component id in the path or body does not exist."
  - id: ERR_SAMPLING_PLAN_NOT_FOUND
    http: 404
    condition: "A sampling-plan id in the path does not exist."
  - id: ERR_REQUIREMENT_NOT_FOUND
    http: 404
    condition: "A requirement-assessment id in the path does not exist."
  - id: ERR_EVIDENCE_NOT_FOUND
    http: 404
    condition: "An evidence-item id in the path does not exist."
  - id: ERR_CCW_NOT_FOUND
    http: 404
    condition: "A compensating-control-worksheet id in the path does not exist."
  - id: ERR_REMEDIATION_ITEM_NOT_FOUND
    http: 404
    condition: "A remediation-item id in the path does not exist."
  - id: ERR_ROC_NOT_FOUND
    http: 404
    condition: "A report id in the path does not exist."
  - id: ERR_SCAN_CYCLE_NOT_FOUND
    http: 404
    condition: "A scan-cycle id in the path does not exist."
  - id: ERR_SCAN_FINDING_NOT_FOUND
    http: 404
    condition: "A scan-finding id in the path does not exist."
  - id: ERR_CHANGE_LOG_ENTRY_NOT_FOUND
    http: 404
    condition: "A change-log-entry id in the path does not exist."

  # --- ownership / identity ---
  - id: ERR_NOT_ENGAGEMENT_LEAD
    http: 403
    condition: "A lead-only operation was attempted by an assessor who is not the engagement's lead_assessor_id."
  - id: ERR_NOT_ENGAGEMENT_QA_REVIEWER
    http: 403
    condition: "A quality-assurance decision was attempted by an assessor who is not the engagement's qa_reviewer_id."
  - id: ERR_VENDOR_SCOPE_FORBIDDEN
    http: 403
    condition: "A scanning-vendor operation was attempted by a vendor other than the cycle's asv_vendor_id."

  # --- referential ---
  - id: ERR_CROSS_ENGAGEMENT_REFERENCE
    http: 422
    condition: "A referenced segment, component or finding belongs to a different engagement than the path resource."
  - id: ERR_SEGMENT_CYCLE
    http: 422
    condition: "The proposed parent_segment_id chain revisits the segment being re-parented (including the row naming itself as its own parent)."
  - id: ERR_ASV_NOT_APPROVED
    http: 422
    condition: "The named scanning vendor's effective_approval is EXPIRED or REVOKED at the logical clock."

  # --- posture ---
  - id: ERR_ENGAGEMENT_FROZEN
    http: 409
    condition: "The engagement's posture is FROZEN (status REPORTING, ATTESTED, SUBMITTED or REASSESSMENT_PLANNED) and a child write was attempted."
  - id: ERR_ENGAGEMENT_RESTRICTED
    http: 409
    condition: "The engagement's posture is RESTRICTED (an open gap, an unvalidated segment or a stale sampling plan) and scope lock or report creation was attempted."

  # --- target state ---
  - id: ERR_INVALID_ENGAGEMENT_STATE
    http: 409
    condition: "The engagement's status has no such transition in §1.2 (for example reassessment planning before submission)."
  - id: ERR_INVALID_SEGMENT_STATE
    http: 409
    condition: "The segment's segmentation_status has no such transition (verdict without a test plan, revalidation of a segment that has not failed, withdrawal after testing began)."
  - id: ERR_INVALID_REQUIREMENT_STATE
    http: 409
    condition: "The requirement's test_status has no such transition (conclusion before testing started, reopen of a NOT_IN_PLACE or CCW-covered requirement, worksheet on a requirement that is not NOT_IN_PLACE)."
  - id: ERR_INVALID_CCW_STATE
    http: 409
    condition: "The worksheet is not DRAFT for submit, or not SUBMITTED for a decision."
  - id: ERR_INVALID_REMEDIATION_STATE
    http: 409
    condition: "The remediation item is not OPEN or RETEST_FAILED for assign, or not IN_PROGRESS for retest."
  - id: ERR_INVALID_ROC_STATE
    http: 409
    condition: "The report's status has no such transition (attesting a report that QA has not approved, revising a report that was not rejected, submitting an unattested report)."
  - id: ERR_INVALID_SCAN_CYCLE_STATE
    http: 409
    condition: "Findings were added to a cycle that is no longer SCHEDULED, or completion was attempted on an already-completed cycle."
  - id: ERR_INVALID_FINDING_DISPUTE_STATE
    http: 409
    condition: "A dispute was raised on a finding whose dispute_status is not NONE, or decided on a finding whose dispute_status is not DISPUTED."

  # --- optimistic concurrency ---
  - id: ERR_STALE_ENGAGEMENT_VERSION
    http: 412
    condition: "expected_engagement_version does not equal the engagement's current version (§1.2.1)."
  - id: ERR_STALE_REQUIREMENT_VERSION
    http: 412
    condition: "expected_requirement_assessment_version does not equal the requirement's current version (§1.2.1)."

  # --- safety / segregation of duties ---
  - id: ERR_INDEPENDENCE_VIOLATION
    http: 422
    condition: "The acting quality-assurance reviewer collected evidence on this engagement, or is the engagement's lead assessor."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "The assessor nominated as quality-assurance reviewer is the engagement's lead assessor."
  - id: ERR_QA_NOT_QUALIFIED
    http: 422
    condition: "The assessor nominated as quality-assurance reviewer has qa_qualified false."
  - id: ERR_ASSESSOR_NOT_ACTIVE
    http: 422
    condition: "An assessor named as lead or reviewer has status SUSPENDED."

  # --- temporal ---
  - id: ERR_ASSESSOR_CERTIFICATION_EXPIRED
    http: 422
    condition: "An assessor whose certification_status is LAPSED was named as lead or reviewer, or attempted a review or attestation."
  - id: ERR_ASSESSOR_WINDOW_CONFLICT
    http: 422
    condition: "The lead assessor's fieldwork window, widened by the 3-day cooldown on both sides, intersects another engagement they lead."
  - id: ERR_SCAN_WINDOW_OVERLAP
    http: 422
    condition: "The proposed 90-day scan window intersects an existing cycle's window for the same engagement; adjacency at the exclusive end instant is allowed."
  - id: ERR_NO_PASSING_SCAN
    http: 422
    condition: "Attestation was attempted while quarterly_scan_compliant is false — no PASSING scan cycle covers the logical clock."

  # --- constraint ---
  - id: ERR_DUPLICATE_ASSESSOR_EMAIL
    http: 422
    condition: "Another assessor already uses that email."
  - id: ERR_DUPLICATE_VENDOR_NAME
    http: 422
    condition: "Another scanning vendor already uses that name."
  - id: ERR_DUPLICATE_SEGMENT_NAME
    http: 422
    condition: "The engagement already has a network segment with that name."
  - id: ERR_DUPLICATE_HOSTNAME
    http: 422
    condition: "The engagement already has a system component with that hostname."
  - id: ERR_DUPLICATE_REQUIREMENT_REF
    http: 422
    condition: "The engagement already has an assessment row for that requirement_ref."
  - id: ERR_DUPLICATE_QUARTER_LABEL
    http: 422
    condition: "The engagement already has a scan cycle with that quarter_label."
  - id: ERR_FACILITY_TYPE_CONFLICT
    http: 422
    condition: "That facility_name is already recorded under a different facility_type within the engagement."
  - id: ERR_EMPTY_SAMPLE_POPULATION
    http: 422
    condition: "The chosen sampling variant's eligible population is empty — no component qualifies as CDE or CONNECTED."
  - id: ERR_SAMPLING_PLAN_STALE
    http: 422
    condition: "A conclusion was attempted while the engagement's latest sampling plan is STALE, PRELIMINARY, or absent."
  - id: ERR_NO_CDE_SEGMENT
    http: 422
    condition: "Scope lock was attempted without a VALIDATED segment whose segment_class is CDE."
  - id: ERR_SEGMENT_HAS_COMPONENTS
    http: 422
    condition: "Withdrawal was attempted on a segment that still has components or child segments."
  - id: ERR_COMPONENT_NOT_IN_SAMPLE
    http: 422
    condition: "The evidence item names a component whose in_sample is false."
  - id: ERR_EVIDENCE_TARGET_REQUIRED
    http: 422
    condition: "An OBSERVATION or SYSTEM_CONFIG evidence item omitted component_id."
  - id: ERR_INTERVIEWEE_REQUIRED
    http: 422
    condition: "An INTERVIEW evidence item omitted interviewee_name or interviewee_title."
  - id: ERR_EVIDENCE_INCOMPLETE
    http: 422
    condition: "An IN_PLACE or NOT_IN_PLACE conclusion was attempted without a SUFFICIENT item of each of DOCUMENT_REVIEW, INTERVIEW and OBSERVATION."
  - id: ERR_CCW_SECTION_INCOMPLETE
    http: 422
    condition: "A worksheet was submitted with an empty narrative section or no control references."
  - id: ERR_CCW_MONITORING_INTERVAL_TOO_LONG
    http: 422
    condition: "Acceptance was attempted on a worksheet whose monitoring_interval_days exceeds 30."
  - id: ERR_CCW_RIGOR_INSUFFICIENT
    http: 422
    condition: "Acceptance was attempted on a worksheet whose rigor_score is below 70.00."
  - id: ERR_REQUIREMENT_TESTING_INCOMPLETE
    http: 422
    condition: "Report creation was attempted while some requirement is still NOT_STARTED or IN_TESTING."
  - id: ERR_NO_APPLICABLE_REQUIREMENTS
    http: 422
    condition: "Report creation was attempted with applicable_requirement_count 0, which would make the compliance denominator zero."
  - id: ERR_ROC_ALREADY_EXISTS
    http: 422
    condition: "The engagement already has a report row; revisions reuse it."
  - id: ERR_QA_REVIEWER_NOT_ASSIGNED
    http: 422
    condition: "The report was submitted for quality assurance while qa_reviewer_id is null."
  - id: ERR_ATTESTATION_SIGNATURE_MISMATCH
    http: 422
    condition: "attestation_signature_name does not match the lead assessor's full_name verbatim."
  - id: ERR_FINDING_NOT_HIGH_SEVERITY
    http: 422
    condition: "A dispute was raised on a finding whose severity_class is LOW (cvss_score below 4.0)."
  - id: ERR_INVALID_REASSESSMENT_YEAR
    http: 422
    condition: "target_year is not assessment_year + 1, or planned_start_date precedes the logical-clock date."

  # --- fiscal ---
  - id: ERR_ASSESSMENT_BUDGET_EXCEEDED
    http: 422
    condition: "The recomputed assessment_fee_total exceeds the engagement's approved_budget_amount."

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:

  - name: LeadAssessor
    description: "The QSA who owns one engagement end to end: scope, sampling, fieldwork, remediation coordination, report authoring and attestation. Every lead-only operation additionally requires X-User-ID == engagement.lead_assessor_id (ERR_NOT_ENGAGEMENT_LEAD)."
    identity: "entity_backed:Assessor"
    exclusive_operations:
      - "POST /engagements/{id}/scope-lock"
      - "POST /engagements/{id}/qa-reviewer"
      - "PATCH /engagements/{id}"
      - "POST /engagements/{id}/sampling-plans"
      - "POST /engagements/{id}/rocs"
      - "POST /engagements/{id}/reassessment-plan"
      - "PATCH /network-segments/{id}"
      - "POST /network-segments/{id}/remediation-revalidation"
      - "POST /network-segments/{id}/withdraw"
      - "POST /requirement-assessments/{id}/reopen"
      - "POST /requirement-assessments/{id}/ccws"
      - "POST /ccws/{id}/submit"
      - "POST /remediation-items/{id}/assign"
      - "POST /rocs/{id}/qa-submit"
      - "POST /rocs/{id}/revise"
      - "POST /rocs/{id}/attest"
      - "POST /rocs/{id}/submission"
      - "POST /engagements/{id}/scan-cycles"
    shared_operations:
      - "POST /engagements (shared with PlatformAdmin)"
      - "POST /engagements/{id}/network-segments, POST /engagements/{id}/system-components, POST /engagements/{id}/requirement-assessments (shared with Assessor)"
      - "POST /network-segments/{id}/segmentation-test-plan, POST /network-segments/{id}/validation-result (shared with Assessor)"
      - "POST /requirement-assessments/{id}/start-testing, POST /requirement-assessments/{id}/conclusion, POST /requirement-assessments/{id}/evidence-items (shared with Assessor)"
      - "POST /remediation-items/{id}/retest (shared with Assessor)"
      - "POST /scan-findings/{id}/dispute (shared with ClientRepresentative)"
      - "POST /engagements/{id}/change-log-entries (shared with Assessor and ClientRepresentative)"
      - "every GET endpoint"

  - name: Assessor
    description: "A staff assessor performing testing procedures and collecting evidence. Not tied to engagement ownership, but collecting a single evidence item permanently disqualifies this individual from quality-assurance review of that engagement's report."
    identity: "entity_backed:Assessor"
    exclusive_operations: []
    shared_operations:
      - "POST /engagements/{id}/network-segments, POST /engagements/{id}/system-components, POST /engagements/{id}/requirement-assessments"
      - "POST /network-segments/{id}/segmentation-test-plan, POST /network-segments/{id}/validation-result"
      - "POST /requirement-assessments/{id}/start-testing, POST /requirement-assessments/{id}/conclusion, POST /requirement-assessments/{id}/evidence-items"
      - "POST /remediation-items/{id}/retest"
      - "POST /engagements/{id}/change-log-entries"
      - "every GET endpoint"

  - name: QaReviewer
    description: "The internal quality-assurance reviewer. Must be qa_qualified, must not be the engagement lead, and must not have collected evidence on the engagement. Every QA operation additionally requires X-User-ID == engagement.qa_reviewer_id (ERR_NOT_ENGAGEMENT_QA_REVIEWER)."
    identity: "entity_backed:Assessor"
    exclusive_operations:
      - "POST /ccws/{id}/decision"
      - "POST /rocs/{id}/qa-review"
    shared_operations:
      - "every GET endpoint"

  - name: AsvVendor
    description: "The Approved Scanning Vendor that runs the quarterly external scans, publishes findings and rules on false-positive disputes. Every vendor operation additionally requires X-User-ID == scan_cycle.asv_vendor_id (ERR_VENDOR_SCOPE_FORBIDDEN)."
    identity: "entity_backed:AsvVendor"
    exclusive_operations:
      - "POST /scan-cycles/{id}/complete"
      - "POST /scan-cycles/{id}/findings"
      - "POST /scan-findings/{id}/dispute-decision"
    shared_operations:
      - "every GET endpoint"

  - name: ClientRepresentative
    description: "The assessed entity's own staff. May raise false-positive disputes and record in-year changes, but may never record evidence, conclude a requirement or touch the report."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /scan-findings/{id}/dispute"
      - "POST /engagements/{id}/change-log-entries"
      - "every GET endpoint"

  - name: PlatformAdmin
    description: "Firm-level operator that maintains the assessor and vendor registries and drives the logical clock. Holds no engagement-level authority: it cannot conclude requirements, decide worksheets or attest reports."
    identity: opaque
    exclusive_operations:
      - "POST /assessors"
      - "PATCH /assessors/{id}"
      - "POST /asv-vendors"
      - "PATCH /asv-vendors/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /engagements (shared with LeadAssessor)"
      - "every GET endpoint"
