              as: PlanAdministrator
            - call: "POST /plan/policies"
              payload: { assignment_id: "${asg1_id}", policy_number: "AR-100001", effective_date: "2026-09-15T00:00:00Z", expiration_date: "2027-09-15T00:00:00Z" }
              as: ServicingCarrier
              as_user_id: "${c1_id}"
              captures: { pol1_id: $.data.id }
            - call: "POST /plan/policies"
              payload: { assignment_id: "${asg2_id}", policy_number: "AR-100002", effective_date: "2026-09-15T00:00:00Z", expiration_date: "2027-09-15T00:00:00Z" }
              as: ServicingCarrier
              as_user_id: "${c2_id}"
              captures: { pol2_id: $.data.id }
            - call: "POST /plan/_clock/set_current_utc"
              payload: { current_utc: "2026-12-15T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /plan/policies/${pol1_id}/cancellation"
              payload: { cancellation_reason_code: "NON_PAYMENT_OF_PREMIUM", cancellation_effective_date: "2026-12-15T00:00:00Z" }
              as: ServicingCarrier
              as_user_id: "${c1_id}"
