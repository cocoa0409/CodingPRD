- rule_id: combinatorial_formula
  instances:
  - name: offering_capital_stack_grossup_evaluation_order
    grounds:
    - calculations.offering_capital_stack_grossup
    - entities.Offering.fields.target_equity_cents
    - entities.Offering.fields.sponsor_load_cents
    - entities.Offering.fields.initial_reserve_cents
    - state_machines.Offering.transitions.UNDER_REVIEW_to_EFFECTIVE
    - endpoints[GET /offerings/{offering_id}/capital-stack]
    distinguishing_aspect: 'MODE (c): five pinned steps whose ORDER changes the answer — the reserve is a percentage of purchase price and must be added to the net acquisition need BEFORE the 1/(1-load_pct) gross-up; grossing up 515,000,000 first and adding the reserve afterwards yields 596,978,022, not the required 598,901,099.'
