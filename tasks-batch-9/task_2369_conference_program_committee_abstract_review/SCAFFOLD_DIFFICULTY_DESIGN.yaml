              payload: { to_status: "SCORED", reason: "presenter conflict discovered, decision rescinded" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
            - call: "GET /conferences/${conf_id}"
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { oral_after: "$.data.accepted_oral_count", waitlisted_after: "$.data.waitlisted_count" }
          assert:
            - "before the rescission accepted_oral_count == 1 and waitlisted_count == 1"
            - "Abstract.${ab_ada_id}.status == SCORED"
            - "Abstract.${ab_ada_id}.decision == null"
            - "Abstract.${ab_ada_id}.decided_by_member_id == null"
            - "Abstract.${ab_ada_id}.decision_downgraded == false"
            - "Abstract.${ab_ben_id}.status == ACCEPTED"
            - "Abstract.${ab_ben_id}.decision == ORAL"
            - "Abstract.${ab_ben_id}.decision_downgraded == false"
            - "Abstract.${ab_ben_id}.decided_by_member_id == ${mb_chair_id}"
            - "Conference.${conf_id}.accepted_oral_count == 1"
            - "Conference.${conf_id}.waitlisted_count == 0"
            - "invariant: accepted_oral_count + waitlisted_count == 2 both before and after the rescission, and accepted_oral_count never exceeds oral_slot_capacity 1"
            - "Abstract.${ab_ada_id}.provisional_score == 3.50"
            - "Abstract.${ab_ben_id}.provisional_score == 2.50"

      - name: cme_minute_pool_is_conserved_across_validation_and_revocation
        grounds:
          - calculations.cme_credit_award
          - state_machines.CmeAccreditation.PENDING_to_VALIDATED
          - state_machines.CmeAccreditation.VALIDATED_to_REVOKED
          - entities.Conference.fields.cme_minutes_allocated
          - entities.Conference.fields.cme_minutes_available
        distinguishing_aspect: |
          A THIRD conserved quantity: cme_minutes_allocated + cme_minutes_available
          == cme_minutes_pool_total at every step. Validating 45 minutes moves 45
          from available to allocated and awards 0.75 credits; revoking the same
          accreditation moves them back and zeroes awarded_credits, leaving the
          pool exactly as it started. An implementation that only decrements
          available on validation, or that keeps the awarded credits after
          revocation, breaks the identity.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 with cme_minutes_pool_total 600, at REVIEW_CLOSED, with cme_minutes_allocated 0 and cme_minutes_available 600."
            - "Category MED is cme_eligible; Ada's abstract has two submitted reviews and was decided ORAL by chair Cho, so it is ACCEPTED."
            - "A PENDING CmeAccreditation of 45 content_minutes exists with one VALIDATED DisclosureStatement."
            - "Chair Dana is the validator and is not the decider."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "MED", name: "Clinical Medicine", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], requires_structured_body: false, min_reviews_required: 2, discrepancy_threshold: 4.00, cme_eligible: true }
              as: ConferenceAdmin
              captures: { cat_med_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Cho Bekele", email: "cho@panel.example", member_role: "CHAIR", expertise_keywords: ["oncology", "immunotherapy"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_chair_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_chair_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_chair_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Dana Petit", email: "dana@panel.example", member_role: "CHAIR", expertise_keywords: ["oncology", "ethics"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_chair2_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_chair2_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_chair2_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Rui Alvarez", email: "rui@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology", "imaging"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r1_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_r1_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_r1_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Mei Osei", email: "mei@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology", "genomics"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r2_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_r2_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_r2_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_OPEN" }
              as: ConferenceAdmin
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_med_id}", submitting_author_id: "${au_ada_id}", title: "Immunotherapy response imaging", body_word_count: 280, requested_format: "ORAL", keywords: ["oncology", "immunotherapy"], body_structured: true, coauthor_emails: [], is_newsworthy: false }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { ab1_id: "$.data.id" }
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_CLOSED" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "REVIEW_OPEN" }
              as: ConferenceAdmin
            - call: "POST /abstracts/${ab1_id}/review-assignments"
              payload: { reviewer_member_id: "${mb_r1_id}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { rv1a_id: "$.data.id" }
            - call: "POST /abstracts/${ab1_id}/review-assignments"
              payload: { reviewer_member_id: "${mb_r2_id}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { rv1b_id: "$.data.id" }
            - call: "POST /reviews/${rv1a_id}/submission"
              payload: { score_originality: 4, score_methodology: 4, score_relevance: 4, score_clarity: 4, confidence: "HIGH", recommended_format: "ORAL" }
              as: Reviewer
              as_user_id: "${mb_r1_id}"
            - call: "POST /reviews/${rv1b_id}/submission"
              payload: { score_originality: 3, score_methodology: 3, score_relevance: 3, score_clarity: 3, confidence: "MEDIUM", recommended_format: "ORAL" }
              as: Reviewer
              as_user_id: "${mb_r2_id}"
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "REVIEW_CLOSED" }
              as: ConferenceAdmin
            - call: "GET /conferences/${conf_id}"
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { conf_v1: "$.data.version" }
            - call: "POST /abstracts/${ab1_id}/decision"
              payload: { decision: "ORAL", expected_conference_version: "${conf_v1}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
            - call: "POST /accreditations"
              payload: { abstract_id: "${ab1_id}", content_minutes: 45, commercial_support_disclosed: false }
              as: ProgramChair
              as_user_id: "${mb_chair2_id}"
              captures: { acc1_id: "$.data.id" }
            - call: "POST /disclosure-statements"
              payload: { abstract_id: "${ab1_id}", accreditation_id: "${acc1_id}", author_id: "${au_ada_id}", has_financial_relationship: false }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { dis1_id: "$.data.id" }
            - call: "POST /disclosure-statements/${dis1_id}/adjudication"
              payload: { outcome: "VALIDATED" }
              as: ProgramChair
              as_user_id: "${mb_chair2_id}"
          trigger:
            - call: "POST /accreditations/${acc1_id}/validation"
              payload: { action: "VALIDATE" }
              as: ProgramChair
              as_user_id: "${mb_chair2_id}"
              captures: { awarded_after_validate: "$.data.awarded_credits" }
            - call: "GET /conferences/${conf_id}"
              as: ProgramChair
              as_user_id: "${mb_chair2_id}"
              captures: { allocated_mid: "$.data.cme_minutes_allocated", available_mid: "$.data.cme_minutes_available" }
            - call: "POST /accreditations/${acc1_id}/validation"
              payload: { action: "REVOKE" }
              as: ProgramChair
              as_user_id: "${mb_chair2_id}"
            - call: "GET /conferences/${conf_id}/capacity-summary"
              as: ProgramChair
              as_user_id: "${mb_chair2_id}"
              captures: { available_after: "$.data.cme_minutes_available", awarded_sum_after: "$.data.awarded_credits_sum", bundle_after: "$.data.cme_bundle_credits" }
          assert:
            - "after the VALIDATE call CmeAccreditation.${acc1_id}.awarded_credits == 0.75"
            - "after the VALIDATE call cme_minutes_allocated == 45 and cme_minutes_available == 555"
            - "CmeAccreditation.${acc1_id}.validation_status == REVOKED"
            - "CmeAccreditation.${acc1_id}.awarded_credits == 0.00"
            - "Conference.${conf_id}.cme_minutes_allocated == 0"
            - "Conference.${conf_id}.cme_minutes_available == 600"
            - "the capacity-summary after revocation reports cme_minutes_available == 600, awarded_credits_sum == 0.00 and cme_bundle_credits == 0.00"
            - "invariant: cme_minutes_allocated + cme_minutes_available == 600 at every step (0 + 600, then 45 + 555, then 0 + 600)"
            - "Abstract.${ab1_id}.status == ACCEPTED"
