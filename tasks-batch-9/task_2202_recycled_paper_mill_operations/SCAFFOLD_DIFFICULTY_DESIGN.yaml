            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_OCC", effective_month: "2026-07", published_price_per_ton: 190.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /paper-machines", payload: { name: "PM3", wire_width_mm: 3600, max_tons_per_hour: 15.00, changeover_buffer_minutes: 0, steam_tph_per_ton: 1.300 }, as: MillPlanner, as_user_id: "mp_1", captures: { pm3_id: "$.data.id", pm3_v1: "$.data.version" } }
            - { call: "POST /suppliers", payload: { name: "Riverbend Fiber", freight_per_ton: 22.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "OCC_11", contracted_tons: 200.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_id: "$.data.id", po_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_id}/price", payload: { expected_purchase_order_version: "${po_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_id}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
            - { call: "POST /fiber-purchase-orders/${po_id}/receipts", payload: { truck_reference: "TRK-A-001", sublots: [ { sublot_no: 1, gross_tons: 22.000, tare_tons: 2.000, moisture_pct: 14.50, contamination_pct: 2.50 }, { sublot_no: 2, gross_tons: 18.000, tare_tons: 1.500, moisture_pct: 11.00, contamination_pct: 3.00 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_id: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_id}/disposition", payload: { disposition: "ACCEPT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "GET /fiber-inventory-lots", payload: { receipt_id: "${rcpt_id}" }, as: MachineOperator, as_user_id: "mo_1", captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /pulp-batches", payload: { pulper_line: "OCC_LINE", target_product_code: "TL_140", furnish_lines: [ { inventory_lot_id: "${lot_id}", tons_charged: 30.000 } ] }, as: MachineOperator, as_user_id: "mo_1", captures: { pb_id: "$.data.id" } }
            - { call: "POST /paper-machines/${pm3_id}/runs", payload: { product_code: "TL_140", pulp_batch_id: "${pb_id}", window_start: "2026-08-12T00:00:00Z", window_end: "2026-08-12T06:00:00Z", pulp_draw_tons: 10.000, expected_machine_version: "${pm3_v1}" }, as: MillPlanner, as_user_id: "mp_1", captures: { run_1: "$.data.id" } }
            - { call: "GET /paper-machines/${pm3_id}", payload: {}, as: MillPlanner, as_user_id: "mp_1", captures: { pm3_v2: "$.data.version" } }
