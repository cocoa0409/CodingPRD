              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-04T14:00:00.000Z", scheduled_end_at: "2026-08-04T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Nursery east", room_type: "NURSERY", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
            - call: "PATCH /blinds/openings/${o1}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED", motorization_option: "NONE" }
              as: Designer
              as_user_id: "${d1}"
            - call: "GET /blinds/consultations/${c1}"
              as: Designer
              as_user_id: "${d1}"
              captures: { cv1: $.data.version }
            - call: "POST /blinds/quotes"
