              as: PlatformAdmin
            - call: "PATCH /cdn-vendors/${v_id}"
              payload: { committed_gbps: 40.00 }
              as: PlatformAdmin
          assert:
            - "before the triggers: CdnVendor.${v_id}.reserved_gbps == 40.00 and version == 1"
            - "39.99 patch: HTTP status == 422 and error_id == ERR_VENDOR_CAPACITY_EXCEEDED"
            - "39.99 patch: CdnVendor.${v_id}.committed_gbps is still 100.00 and version is still 1"
            - "40.00 patch: HTTP status == 200 and committed_gbps == 40.00 and version == 2"
            - "40.00 patch: reserved_gbps is still 40.00 and LiveEventReservation.${r_id}.state == RESERVED"

      - name: drm_package_omitting_widevine_at_a_type_one_floor_is_rejected
