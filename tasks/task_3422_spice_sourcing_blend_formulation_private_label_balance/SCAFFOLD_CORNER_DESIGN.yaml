      - name: surge_pool_multiplier_week43_vs_week44
        claim_type: boundary_threshold
        grounds:
          - calculations.weekly_line_capacity
          - constants.SURGE_WEEK_START
          - constants.SURGE_CAPACITY_MULTIPLIER
        distinguishing_aspect: "The same 6000 kg reservation fails in ISO week 43 (pool 1000*5 = 5000) and succeeds in ISO week 44 (pool floor(1000*5*1.25) = 6250) — the surge multiplier switches exactly at week SURGE_WEEK_START."
        test_recipe:
          setup: ["line LN capacity_kg_per_shift 1000"]
          setup_api_calls:
            - { call: "POST /spice/lines", payload: { name: "Line-43", capacity_kg_per_shift: 1000, supported_changeover_classes: [NONE, DRY_CLEAN, WET_WASH, FULL_SANITATION] }, as: PlatformAdmin, captures: { ln: $.data.id } }
          trigger:
            - { call: "POST /spice/reservations", payload: { line_id: "${ln}", window_start: "2026-10-19T00:00:00Z", window_end: "2026-10-26T00:00:00Z", reserved_kg_per_week: 6000 }, as: ProductionScheduler, captures: { err: $.data.error_id } }
            - { call: "POST /spice/reservations", payload: { line_id: "${ln}", window_start: "2026-10-26T00:00:00Z", window_end: "2026-11-02T00:00:00Z", reserved_kg_per_week: 6000 }, as: ProductionScheduler, captures: { ok: $.data.id } }
          assert:
            - "week 43 window: ${err} == ERR_RESERVATION_OVER_COMMIT (6000 > 5000)"
            - "week 44 window: created (201) — surge pool 6250 admits 6000; boundary flips at exactly ISO week 44 (2026-10-26)"

