      - name: dispatch_notices_on_a_recall_with_no_actions_returns_invalid_recall_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Recall.INITIATED_to_NOTIFYING
          - errors.ERR_INVALID_RECALL_STATE
        distinguishing_aspect: "The dispatch transition carries the precondition action_count > 0, so a recall on a lot that never shipped downstream cannot be dispatched (409 ERR_INVALID_RECALL_STATE) and must instead take the INITIATED -> CLOSED escape hatch, which releases the held lot to AVAILABLE."
        test_recipe:
