        as: ClaimsProcessor
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST (unknown/system field in body)
  - name: eligibility_span_inverted_range_rejected
    claim_type: type_constraints
    grounds:
    - errors[ERR_INVALID_DATE_RANGE]
    distinguishing_aspect: start_date > end_date fails with ERR_INVALID_DATE_RANGE (422); equal start == end is a valid one-day closed span.
    test_recipe:
      setup:
      - Program and member exist
      setup_api_calls:
      - call: POST /vbc/programs
        payload:
          program_name: P1
          line_of_business: MEDICARE_ADVANTAGE
        as: PayerAdmin
        captures:
          pg: $.data.id
      - call: POST /vbc/members
        payload:
          program_id: ${pg}
          member_ref: M-001
          birth_year: 1980
        as: PayerAdmin
        captures:
          m1: $.data.id
      trigger:
      - call: POST /vbc/eligibility-spans
        payload:
          member_id: ${m1}
          start_date: '2026-12-31'
          end_date: '2026-01-01'
        as: PayerAdmin
        captures:
          err: $.data.error_id
      - call: POST /vbc/eligibility-spans
        payload:
          member_id: ${m1}
          start_date: '2026-06-15'
          end_date: '2026-06-15'
        as: PayerAdmin
        captures:
          sp: $.data.id
      assert:
      - Inverted range -> ERR_INVALID_DATE_RANGE (422)
      - Single-day span (start == end) -> 201 created
