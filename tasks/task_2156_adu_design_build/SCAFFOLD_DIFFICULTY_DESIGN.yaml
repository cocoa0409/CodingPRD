          setup:
            - "AduProject B on Property P2 in PLMD at status PERMITTED, total_permit_fee_cents 1120465, contract_base_price_cents 24000000."
            - "An INCOME_CAPITALIZATION FinancingScenario is COMMITTED with available_cents 30094545."
            - "ChangeOrder CO for +4000000 cents and +21 days has been APPROVED, so contract_price_current_cents is 28400000, approved_change_days is 21, funding_gap_cents is 2265920 and financing_state is SHORTFALL."
