    code: 200
    input: [gps_lat, gps_lng]
    output: Visit
    side_effects: ["status → IN_PROGRESS; check_in_at set"]
  - method: POST
    path: "/home-watch/visits/{id}/check-out"
    description: "Sitter checks out (evidence + checklist verified); provisional charge billed"
    roles: [Sitter]
    code: 200
    input: [completed_tasks]
