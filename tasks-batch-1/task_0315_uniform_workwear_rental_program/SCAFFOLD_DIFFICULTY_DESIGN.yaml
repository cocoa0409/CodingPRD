              payload: { sku: "COV-K", category: "COVERALL", weekly_rate_cents: 1000, replacement_cost_cents: 50000, emblem_setup_cents: 0 }
              as: ProgramAdmin
              captures: { gt: $.data.id }
            - call: "POST /accounts/${acct}/wearers"
              payload: { full_name: "Kim", shirt_size: "M", pant_size: 30, locker_label: "L1" }
