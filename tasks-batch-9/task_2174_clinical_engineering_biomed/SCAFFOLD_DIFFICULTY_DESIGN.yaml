          - entities.Device.fields.security_state
        distinguishing_aspect: |
          Non-linear shape #2 on a DIFFERENT entity — PARALLEL state dimensions on one
          Device row: a security-state move leaves operational_state untouched and a
          work-order intake/cancel leaves security_state untouched, so the row passes
          through (IN_SERVICE, ASSESSED_OK), (DOWN, ASSESSED_OK), (DOWN, VULNERABLE)
