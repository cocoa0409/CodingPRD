        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation. OCC target for relocation and renewal."
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the holder of this subscription."
      - name: season_plan_id
        type: string
        source: input
        description: "FK -> SeasonPlan.id; the plan this subscription is priced under."
      - name: status
        type: enum
        source: system
        description: "Subscription lifecycle state."
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, RELOCATING, RENEWAL_OFFERED, SUSPENDED, CANCELLED}"
      - name: locked_price_cents
        type: integer
        source: computed
        description: "Total per-season price across all ASSIGNED SeatAssignments, computed by the renewal_price rule at activation and recomputed at relocation/renewal."
        default: 0
      - name: seat_count
        type: integer
        source: computed
        description: "Count of SeatAssignment rows with subscription_id == this Subscription.id AND status == ASSIGNED. Derived field reconciled on assignment/release."
        default: 0
      - name: renewal_cycle
        type: integer
        source: system
        description: "Increments by 1 each time the subscription is renewed from RENEWAL_OFFERED back to ACTIVE."
        default: 0

  - name: SeatAssignment
    parent: null
    common_fields: true
    fields:
