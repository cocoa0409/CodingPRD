            - "${e_safety} == ERR_SAFETY_CHECKS_INCOMPLETE with HTTP 422 - priority 45 wins over the protocol mismatch and the low hematocrit that chk_a also carries"
            - "${e_protocol} == ERR_BLOOD_PROTOCOL_MISMATCH with HTTP 422 - priority 46 wins over the low hematocrit that chk_b also carries"
            - "${e_hct} == ERR_HEMATOCRIT_BELOW_MINIMUM with HTTP 422 - 21 is below the card's min_hematocrit_pct of 22"
