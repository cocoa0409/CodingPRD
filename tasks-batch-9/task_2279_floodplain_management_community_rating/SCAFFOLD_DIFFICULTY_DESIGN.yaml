            - call: "POST /floodplain/permits"
              payload: { property_id: "${prop_id}", structure_id: "${struct_id}", project_type: "IMPROVEMENT", declared_project_cost_usd: 100000.00, proposed_lowest_floor_elevation_ft: 20.0 }
