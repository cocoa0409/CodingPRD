      - name: outbreak_state_errors_and_active_uniqueness
        claim_type: invalid_transition
        grounds:
          - state_machines.OutbreakEvent.DECLARED_to_ACTIVE
          - state_machines.OutbreakEvent.ACTIVE_to_LIFTED
          - state_machines.OutbreakEvent.DECLARED_to_CANCELLED
          - errors[ERR_OUTBREAK_INVALID_STATE]
          - errors[ERR_OUTBREAK_ALREADY_ACTIVE]
        distinguishing_aspect: |
          Every wrong-state outbreak action is rejected with the precise error:
          re-activate, lift-from-DECLARED, cancel-from-ACTIVE all give
          ERR_OUTBREAK_INVALID_STATE, while activating a second DECLARED event
          for a unit that already has an ACTIVE one gives
          ERR_OUTBREAK_ALREADY_ACTIVE.
        test_recipe:
          setup:
            - "Clock 08:00; unit U1 (no beds, no requests: upgrade cascade has no targets); outbreak events E1 and E2 both DECLARED on U1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
