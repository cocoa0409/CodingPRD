            - "BillingPeriod.${period_id}.consumed_units == 7"
            - "BillingPeriod.${period_id}.overage_charge_cents == 1100"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ---- Instance 1: Call parallel state dimensions (handling_status x billing_status)
      - name: call_parallel_handling_and_billing_axes
        grounds:
          - state_machines.Call.handling_status
          - state_machines.Call.billing_status
          - entities.Call.fields.handling_status
          - entities.Call.fields.billing_status
        distinguishing_aspect: |
          The Call entity carries two independent state axes: handling_status
          (RINGING..COMPLETED) and billing_status (UNBILLED..ADJUSTED). After a
          completed call, handling_status sits at terminal COMPLETED while
          billing_status independently moves BILLED -> DISPUTED -> ADJUSTED — two
          parallel dimensions on one entity.
        test_recipe:
          setup:
            - "One PER_CALL account (included_calls=100, no overage), PUBLISHED 24h script, one AVAILABLE EN receptionist."
            - "A single call answered, started, wrapped, completed -> handling_status COMPLETED, billing_status BILLED."
            - "AccountOwner disputes it -> billing_status DISPUTED while handling_status stays COMPLETED (period still OPEN)."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "PCnoover", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Epsilon", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
