  # ---------------------------------------------------------------- Rule 4 --
  - rule_id: transitive_cascade
    instances:
      - name: qa_fail_standing_capacity_preemption_cascade
        grounds:
          - state_machines.DictationJob.SUBMITTED_to_EDITING
          - state_machines.Editor.ACTIVE_to_PROBATION
          - calculations.editor_rolling_quality_and_standing
          - calculations.editor_capacity_reevaluation
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /qa-reviews (distinct from the clock
          trigger of instance 2): review FAIL mutates Editor.rolling_quality_score
          (1); the new score transitions Editor.status ACTIVE->PROBATION (2); the
          standing change re-derives skill_tier/max_concurrent_claims (3); the
          capacity shrink force-releases two EDITING jobs back to QUEUED (4).
          Each link is caused by the previous link, not by the original request.
        test_recipe:
          setup:
            - "Identical setup to capacity_reevaluation_pinned_order: editor E with 4 delivered jobs at score 80, then EDITING jobs J_R (ROUTINE, claimed 00:01), J_U1 (URGENT, 00:02), J_U2 (URGENT, 00:03); J_R submitted at 00:04"
