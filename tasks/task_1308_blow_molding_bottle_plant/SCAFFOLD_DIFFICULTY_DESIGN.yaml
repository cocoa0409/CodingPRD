            - { call: "POST /plant/production-orders/${ord1_id}/schedule", payload: { machine_line_id: "${line_id}", planned_start: "2026-08-02T10:00:00Z", planned_end: "2026-08-02T14:00:00Z", expected_production_order_version: "${ord1_v}" }, as: ProductionScheduler }
            - { call: "POST /plant/molds/${mold_id}/install", payload: { machine_line_id: "${line_id}" }, as: ProcessEngineer }
            - { call: "POST /plant/production-orders", payload: { bottle_spec_id: "${spec_id}", quantity_ordered: 3000, planned_weight_g: 22 }, as: ProductionScheduler, captures: { ord2_id: "$.data.id", ord2_v: "$.data.version" } }
