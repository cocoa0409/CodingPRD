            - *cvH_inspect2
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T12:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_v1: $.data.version }
            - call: "POST /finished-units/${fu1}/store"
              payload: { expected_warehouse_version: "${wh_v1}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_v2: $.data.version }
            - call: "POST /finished-units/${fu1}/store"
              payload: { expected_warehouse_version: "${wh_v2}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T23:59:59Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /warehouses/${wh}"
