      - name: shared_writes_accept_either_holder_of_the_operation
        claim_type: shared_operations
        grounds:
          - rbac.MeatCutter.shared_operations
          - rbac.MeatManager.shared_operations
          - rbac.ServiceClerk.shared_operations
          - rbac.StoreAdmin.shared_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
