              as: EngagementManager
              captures: { req1: $.data.id }
            - call: "POST /rating-agency/rating-requests"
              payload: { engagement_letter_id: "${eng_id}", rated_entity_id: "${ent_id}", instrument_type: "SUBORDINATED", instrument_notional_cents: 100000000, requested_rating_scale: "GLOBAL_LONG_TERM" }
              as: EngagementManager
              captures: { req2: $.data.id }
            - call: "POST /rating-agency/rating-requests"
              payload: { engagement_letter_id: "${eng_id}", rated_entity_id: "${ent_id}", instrument_type: "SHORT_TERM", instrument_notional_cents: 100000000, requested_rating_scale: "GLOBAL_SHORT_TERM" }
              as: EngagementManager
              captures: { req3: $.data.id }
            - call: "POST /rating-agency/rating-requests/${req1}/open-screening"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rating-requests/${req2}/open-screening"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rating-requests/${req3}/open-screening"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /rating-agency/rating-requests/${req1}/return-to-submitted"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "EngagementLetter.${eng_id}.fee_credited_cents == 6333334 after the reversal"
            - "EngagementLetter.${eng_id}.fee_reversed_cents == 3166667"
            - "the conserved quantity fee_credited_cents + fee_reversed_cents == 9500001 is unchanged by the compensating action, matching the pre-reversal total"
            - "RatingRequest.${req1}.allocated_fee_cents == 0 and request_status == SUBMITTED"

      - name: compensation_total_conserved_across_revision
        grounds:
          - calculations.accuracy_only_compensation
          - state_machines.AnalystCompensation.APPROVED_to_DRAFT
          - state_machines.AnalystCompensation.APPROVED_to_PAID
          - entities.AnalystCompensation.fields.total_compensation_cents
        distinguishing_aspect: |
          A conserved compensation quantity on a different subject:
          total_compensation_cents must equal base + accuracy bonus + 0 both
          before and after the revise action, and the fee-generation component
          must remain exactly 0 — the analyst's pay cannot vary with engagement
          fee revenue.
        test_recipe:
          setup:
            - "Empty database. A compensation record for an analyst with base 12000000 and accuracy score 80, approved to APPROVED."
          setup_api_calls:
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/analysts"
              payload: { full_name: "Priya Raman", primary_sector: "CORPORATE_FINANCE", analyst_tier: "LEAD", independence_declared_at: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { an_id: $.data.id }
            - call: "POST /rating-agency/compensation-records"
              payload: { analyst_id: "${an_id}", base_salary_cents: 12000000, rating_accuracy_score: 80, comp_period: "2026-H1" }
              as: CompensationCommittee
              captures: { comp_id: $.data.id }
            - call: "POST /rating-agency/compensation-records/${comp_id}/approve"
              payload: {}
              as: CompensationCommittee
              captures: { total_before: $.data.total_compensation_cents }
          trigger:
            - call: "POST /rating-agency/compensation-records/${comp_id}/revise"
              payload: {}
              as: CompensationCommittee
          assert:
            - "total_before == 12600000 (base 12000000 + accuracy bonus 600000 + fee bonus 0)"
            - "AnalystCompensation.${comp_id}.total_compensation_cents == 12600000 after the revision — identical to ${total_before}"
            - "AnalystCompensation.${comp_id}.accuracy_bonus_cents == 600000"
            - "AnalystCompensation.${comp_id}.fee_generation_bonus_cents == 0 and compensation_separation_pct == 1.0"
            - "AnalystCompensation.${comp_id}.status == DRAFT"