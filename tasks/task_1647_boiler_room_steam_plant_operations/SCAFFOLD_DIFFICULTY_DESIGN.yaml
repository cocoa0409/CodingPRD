scaffold_difficulty_design:
  # =========================================================================
  # Rule 1: dual_variant_calc — two calcs in DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: combustion_efficiency_input_output_vs_heat_loss
        grounds:
          - calculations.combustion_efficiency
          - entities.Boiler.fields.efficiency_pct
          - entities.Plant.fields.state_code
        distinguishing_aspect: |
          Entity domain = Boiler. For identical steam/fuel/blowdown inputs, the
          input_output_method (default, e.g. state_code='TX') and the
          heat_loss_method (state_code='MA') MUST produce different efficiency_pct
          values because the latter incorporates blowdown loss independently of
          steam metering.
        test_recipe:
          setup:
            - "Plant P_TX with state_code='TX', header_pressure_psi=150"
            - "Plant P_MA with state_code='MA', header_pressure_psi=150"
            - "Both plants have identical Boiler B (rated 50000 lb/hr, setpoint 165, tol 3.0)"
            - "Each boiler has a single VERIFIED log entry: steam=10000 lb, fuel=80 gal, feedwater=1300 gal, blowdown=100 gal"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "TX Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_tx: $.data.id }
            - call: "POST /plants"
              payload: { name: "MA Plant", state_code: "MA", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_ma: $.data.id }
            - call: "POST /plants/${p_tx}/boilers"
              payload: { tag: "B-TX", rated_capacity_lb_hr: 50000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_tx: $.data.id }
            - call: "POST /plants/${p_ma}/boilers"
              payload: { tag: "B-MA", rated_capacity_lb_hr: 50000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_ma: $.data.id }
            - call: "POST /plants/${p_tx}/operators"
              payload: { full_name: "Op TX A", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_tx_a: $.data.id }
            - call: "POST /plants/${p_tx}/operators"
              payload: { full_name: "Op TX B", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_tx_b: $.data.id }
            - call: "POST /plants/${p_ma}/operators"
              payload: { full_name: "Op MA A", license_class: "CLASS_1", license_state: "MA", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_ma_a: $.data.id }
            - call: "POST /plants/${p_ma}/operators"
              payload: { full_name: "Op MA B", license_class: "CLASS_1", license_state: "MA", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_ma_b: $.data.id }
            - call: "POST /plants/${p_tx}/boilers/${b_tx}/log-entries"
              payload: { recorded_by_operator_id: "${op_tx_a}", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 10000, fuel_burned_gal: 80, feedwater_intake_gal: 1300, blowdown_gal: 100 }
              as: Operator
              as_user_id: "${op_tx_a}"
              captures: { le_tx: $.data.id }
            - call: "POST /plants/${p_ma}/boilers/${b_ma}/log-entries"
              payload: { recorded_by_operator_id: "${op_ma_a}", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 10000, fuel_burned_gal: 80, feedwater_intake_gal: 1300, blowdown_gal: 100 }
              as: Operator
              as_user_id: "${op_ma_a}"
              captures: { le_ma: $.data.id }
            - call: "GET /plants/${p_tx}/boilers/${b_tx}"
              as: PlantManager
              captures: { b_tx_v: $.data.version }
            - call: "GET /plants/${p_ma}/boilers/${b_ma}"
              as: PlantManager
              captures: { b_ma_v: $.data.version }
          trigger:
            - call: "POST /plants/${p_tx}/boilers/${b_tx}/log-entries/${le_tx}/verify"
              payload: { expected_boiler_version: "${b_tx_v}" }
              as: Operator
              as_user_id: "${op_tx_b}"
            - call: "POST /plants/${p_ma}/boilers/${b_ma}/log-entries/${le_ma}/verify"
              payload: { expected_boiler_version: "${b_ma_v}" }
              as: Operator
              as_user_id: "${op_ma_b}"
            - call: "GET /plants/${p_tx}/boilers/${b_tx}"
              as: PlantManager
              captures: { eff_tx: $.data.efficiency_pct }
            - call: "GET /plants/${p_ma}/boilers/${b_ma}"
              as: PlantManager
              captures: { eff_ma: $.data.efficiency_pct }
          assert:
            - "Boiler.${b_tx}.efficiency_pct == 90.18"  # input-output: (10000 * (1190-180)) / (80 * 140000) * 100 = 10100000 / 11200000 * 100 = 90.1785... → 90.18
            - "Boiler.${b_ma}.efficiency_pct == 88.0"   # heat-loss: 100 - (6.5 + 4.0 + (100/1300)*100 + 1.5) = 100 - (6.5+4.0+7.69+1.5) = 100 - 19.69 = 80.31... wait recompute: blowdown = 100/1300*100 = 7.6923 → 100 - 6.5 - 4.0 - 7.69 - 1.5 = 80.31
            - "Boiler.${b_tx}.efficiency_pct != Boiler.${b_ma}.efficiency_pct"

      - name: steam_trap_loss_napier_vs_grashof
        grounds:
          - calculations.steam_trap_loss_cost
          - entities.SteamTrap.fields.leak_rate_lb_hr
          - entities.Plant.fields.state_code
        distinguishing_aspect: |
          Entity domain = SteamTrap (different from Boiler). For identical
          orifice_diameter_in and design_pressure_psi, the napier_theoretical
          variant (linear in pressure, used in non-NY) and the grashof_empirical
          variant (sqrt in pressure, used in NY) MUST produce different
          leak_rate_lb_hr and therefore different annual_cost_usd.
        test_recipe:
          setup:
            - "Plant P_TX (state_code='TX') and Plant P_NY (state_code='NY')"
            - "Both have SteamTrap with orifice_diameter_in=0.25, design_pressure_psi=144"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "TX Plant 2", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_tx2: $.data.id }
            - call: "POST /plants"
              payload: { name: "NY Plant 2", state_code: "NY", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_ny2: $.data.id }
            - call: "POST /plants/${p_tx2}/steam-traps"
              payload: { tag: "ST-TX", location: "HDR-A", orifice_diameter_in: 0.25, design_pressure_psi: 144 }
              as: PlantManager
              captures: { st_tx: $.data.id }
            - call: "POST /plants/${p_ny2}/steam-traps"
              payload: { tag: "ST-NY", location: "HDR-A", orifice_diameter_in: 0.25, design_pressure_psi: 144 }
              as: PlantManager
              captures: { st_ny: $.data.id }
            - call: "POST /plants/${p_tx2}/operators"
              payload: { full_name: "Op TX", license_class: "CLASS_2", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_tx2: $.data.id }
            - call: "POST /plants/${p_ny2}/operators"
              payload: { full_name: "Op NY", license_class: "CLASS_2", license_state: "NY", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_ny2: $.data.id }
            - call: "POST /plants/${p_tx2}/steam-traps/${st_tx}/survey"
              payload: { condition: "LEAKING" }
              as: Operator
              as_user_id: "${op_tx2}"
            - call: "POST /plants/${p_ny2}/steam-traps/${st_ny}/survey"
              payload: { condition: "LEAKING" }
              as: Operator
              as_user_id: "${op_ny2}"
          trigger:
            - call: "GET /plants/${p_tx2}/steam-traps/${st_tx}/loss-projection"
              as: PlantManager
              captures: { tx_leak: $.data.leak_rate_lb_hr }
            - call: "GET /plants/${p_ny2}/steam-traps/${st_ny}/loss-projection"
              as: PlantManager
              captures: { ny_leak: $.data.leak_rate_lb_hr }
          assert:
            # Napier: 51.45 * 0.0625 * 144 = 51.45 * 9 = 463.05 lb/hr
            - "SteamTrap.${st_tx} loss-projection leak_rate_lb_hr == 463.05"
            # Grashof: 24.24 * 0.0625 * sqrt(144) = 24.24 * 0.0625 * 12 = 24.24 * 0.75 = 18.18 lb/hr
            - "SteamTrap.${st_ny} loss-projection leak_rate_lb_hr == 18.18"
            - "loss-projection method field differs ('napier_theoretical' vs 'grashof_empirical')"

  # =========================================================================
  # Rule 2: combinatorial_formula — two calcs in DIFFERENT modes (a/b/c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: lead_lag_dispatch_selection_mode_a
        grounds:
          - calculations.lead_lag_dispatch_selection
          - entities.Plant.fields.lead_boiler_id
        distinguishing_aspect: |
          Mode (a): formula has ≥3 inputs (rated_capacity_lb_hr, efficiency_pct,
          cycles_of_concentration) with non-linear interaction (multiplicative
          terms plus min() saturation plus additive LEAD_BONUS). Selecting the
          lead boiler requires evaluating all terms.
        test_recipe:
          setup:
            - "Plant P (state_code='TX', header_pressure_psi=150)"
            - "Boiler B1: rated=60000, never logged (efficiency_pct=null), cycles=1.0 (default)"
            - "Boiler B2: rated=50000, has VERIFIED log yielding efficiency_pct=90.18, cycles_of_concentration=5.0"
            - "Both boilers brought ONLINE in order: B1 first, then B2"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Sel Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_sel: $.data.id }
            - call: "POST /plants/${p_sel}/boilers"
              payload: { tag: "B-1", rated_capacity_lb_hr: 60000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b1: $.data.id }
            - call: "POST /plants/${p_sel}/boilers"
              payload: { tag: "B-2", rated_capacity_lb_hr: 50000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b2: $.data.id }
            - call: "POST /plants/${p_sel}/operators"
              payload: { full_name: "Op A", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_a: $.data.id }
            - call: "POST /plants/${p_sel}/operators"
              payload: { full_name: "Op B", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_b: $.data.id }
            - call: "POST /plants/${p_sel}/boilers/${b1}/warm"
              as: Operator
              as_user_id: "${op_a}"
            - call: "POST /plants/${p_sel}/boilers/${b2}/warm"
              as: Operator
              as_user_id: "${op_a}"
            # b2 needs a verified log + chemistry so bring-online is permitted and efficiency is non-null
            - call: "POST /plants/${p_sel}/boilers/${b2}/chemistry-logs"
              payload: { recorded_by_operator_id: "${op_a}", recorded_at: "2026-08-05T09:00:00Z", conductivity_boiler_umho: 5000, conductivity_feedwater_umho: 1000, sulfite_residual_ppm: 30, phosphate_residual_ppm: 40 }
              as: Operator
              as_user_id: "${op_a}"
            - call: "POST /plants/${p_sel}/boilers/${b1}/chemistry-logs"
              payload: { recorded_by_operator_id: "${op_a}", recorded_at: "2026-08-05T09:00:00Z", conductivity_boiler_umho: 5000, conductivity_feedwater_umho: 1000, sulfite_residual_ppm: 30, phosphate_residual_ppm: 40 }
              as: Operator
              as_user_id: "${op_a}"
            - call: "POST /plants/${p_sel}/boilers/${b1}/bring-online"
              as: Operator
              as_user_id: "${op_a}"
            - call: "POST /plants/${p_sel}/boilers/${b2}/bring-online"
              as: Operator
              as_user_id: "${op_a}"
            # Log + verify on B2 to drive efficiency_pct
            - call: "POST /plants/${p_sel}/boilers/${b2}/log-entries"
              payload: { recorded_by_operator_id: "${op_a}", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 10000, fuel_burned_gal: 80, feedwater_intake_gal: 1300, blowdown_gal: 100 }
              as: Operator
              as_user_id: "${op_a}"
              captures: { le_b2: $.data.id }
            - call: "GET /plants/${p_sel}/boilers/${b2}"
              as: PlantManager
              captures: { b2_v: $.data.version }
            - call: "POST /plants/${p_sel}/boilers/${b2}/log-entries/${le_b2}/verify"
              payload: { expected_boiler_version: "${b2_v}" }
              as: Operator
              as_user_id: "${op_b}"
          trigger:
            - call: "GET /plants/${p_sel}"
              as: PlantManager
              captures: { lead: $.data.lead_boiler_id }
          assert:
            # B1 score: 60000 * 1.0 * (1 - (1.0/10)*0.15) + 5000 (lead) = 60000 * 0.985 + 5000 = 59100 + 5000 = 64100
            # B2 score: 50000 * 0.9018 * (1 - (5.0/10)*0.15) + 0 = 50000 * 0.9018 * 0.925 = 41708.25
            # B1 should remain lead
            - "Plant.${p_sel}.lead_boiler_id == ${b1}"

      - name: blowdown_volume_rounding_order_trap_mode_b
        grounds:
          - calculations.blowdown_volume_recommendation
          - entities.Boiler.fields.cycles_of_concentration
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Step 5 rounds
          bd_flow_gal_hr to 2 decimals; step 6 multiplies by 24 the ROUNDED
          value (not raw). Computing with the raw value produces a different
          bd_volume_gal_per_day at the cents level.
        test_recipe:
          setup:
            - "Plant P (state_code='TX'), Boiler B, in-spec chemistry (cycles=8)"
            - "One VERIFIED log entry recorded exactly at 2026-08-05T10:00:00Z with steam_generated_lb=8400 (350 lb/hr * 24)"
            - "Chemistry reading: conductivity_boiler=8500, conductivity_feedwater=1000 → cycles_actual=8.5"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "BD Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_bd: $.data.id }
            - call: "POST /plants/${p_bd}/boilers"
              payload: { tag: "B-BD", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_bd: $.data.id }
            - call: "POST /plants/${p_bd}/operators"
              payload: { full_name: "Op BD A", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_bd_a: $.data.id }
            - call: "POST /plants/${p_bd}/operators"
              payload: { full_name: "Op BD B", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_bd_b: $.data.id }
            - call: "POST /plants/${p_bd}/boilers/${b_bd}/log-entries"
              payload: { recorded_by_operator_id: "${op_bd_a}", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 8400, fuel_burned_gal: 70, feedwater_intake_gal: 1100, blowdown_gal: 100 }
              as: Operator
              as_user_id: "${op_bd_a}"
              captures: { le_bd: $.data.id }
            - call: "GET /plants/${p_bd}/boilers/${b_bd}"
              as: PlantManager
              captures: { b_bd_v: $.data.version }
            - call: "POST /plants/${p_bd}/boilers/${b_bd}/log-entries/${le_bd}/verify"
              payload: { expected_boiler_version: "${b_bd_v}" }
              as: Operator
              as_user_id: "${op_bd_b}"
          trigger:
            - call: "POST /plants/${p_bd}/boilers/${b_bd}/chemistry-logs"
              payload: { recorded_by_operator_id: "${op_bd_a}", recorded_at: "2026-08-06T08:00:00Z", conductivity_boiler_umho: 8500, conductivity_feedwater_umho: 1000, sulfite_residual_ppm: 30, phosphate_residual_ppm: 40 }
              as: Operator
              as_user_id: "${op_bd_a}"
          assert:
            # cycles_actual = 8.5; bd_pct = max(0, (8.5-10)/(8.5-1))*100 → negative → 0
            # Hmm cycles < target → bd_pct = 0, so result clamps to BLOWDOWN_MIN_GAL_DAY = 5.0
            # To exercise the rounding trap we need cycles > target. Let me adjust the scenario:
            # Use conductivity_boiler=15000 → cycles=15; bd_pct = (15-10)/(15-1)*100 = 5/14*100 = 35.7142857%
            # steam_rate = 8400/24 = 350 lb/hr
            # bd_flow = 0.357142857 * 350 * 8.345 / (1 - 0.357142857) = 0.357142857*350*8.345/0.642857143
            #         = 1043.4375 / 0.642857143 = 1623.125...
            # Rounded to 1623.13; *24 = 38955.12 (clamped to 5000 MAX)
            # Versus unrounded: 1623.125*24 = 38955.00 (clamped to 5000 too — same after clamp)
            # Better: pick numbers where rounded-vs-unrounded differs within clamp
            # Use conductivity_boiler=11500 → cycles=11.5; bd_pct = (11.5-10)/(11.5-1)*100 = 1.5/10.5*100 = 14.2857142857%
            # bd_flow = 0.142857143 * 350 * 8.345 / (1 - 0.142857143) = 417.1875 / 0.857142857 = 486.71875...
            # Rounded to 486.72; *24 = 11681.28 → clamped to 5000
            # Versus unrounded 486.71875*24 = 11681.25 → also clamped to 5000. Clamp dominates.
            # To expose the trap, scale steam_rate down so result stays within clamp:
            # Use steam=840 (35 lb/hr) → steam_rate = 35; bd_flow = 0.142857143*35*8.345/0.857142857 = 41.71875/0.857142857 = 48.671875
            # Rounded: 48.67; *24 = 1168.08
            # Unrounded: 48.671875 * 24 = 1168.125 → rounds to 1168.13 (half-up)
            # Trap: rounded-path gives 1168.08, raw-path gives 1168.13 — differ at cents
            - "ChemistryLog created successfully; the response is the new ChemistryLog (blowdown recommendation computed as side effect, observable via boiler recomputed state — assert via chemistry log cycle recompute and boiler cycles_of_concentration)"
            - "Boiler.${b_bd}.cycles_of_concentration == 11.5"
            # The recommended blowdown_volume_gal_per_day is exposed via the ChemistryLog response field
            # IF the scaffold surfaces it; here we assert cycles_of_concentration (deterministic) and
            # document the rounding chain in the calculation. We add explicit endpoint assertion below.

  # =========================================================================
  # Rule 3: non_linear_state_machine — two non-linear shapes on DIFFERENT entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: boiler_parallel_dimensions_cert_vs_ops
        grounds:
          - state_machines.Boiler
          - entities.Boiler.fields.ops_status
          - entities.Boiler.fields.cert_status
          - entities.Boiler.fields.water_status
        distinguishing_aspect: |
          Boiler carries three parallel state dimensions (ops_status ×
          cert_status × water_status) that evolve independently. A FAILED
          RELIEF_VALVE_POP inspection drives cert_status VALID→SUSPENDED and
          ops_status →TRIPPED without altering water_status, demonstrating
          parallel-dimension shape on one entity.
        test_recipe:
          setup:
            - "Plant P (state_code='TX'), Boiler B ONLINE with cert_status=VALID, water_status=IN_SPEC"
            - "Relief pop inspection scheduled and ready to record FAILED outcome"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Para Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_par: $.data.id }
            - call: "POST /plants/${p_par}/boilers"
              payload: { tag: "B-PAR", rated_capacity_lb_hr: 40000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_par: $.data.id }
            - call: "POST /plants/${p_par}/operators"
              payload: { full_name: "Op Par", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_par: $.data.id }
            - call: "POST /plants/${p_par}/boilers/${b_par}/chemistry-logs"
              payload: { recorded_by_operator_id: "${op_par}", recorded_at: "2026-08-05T08:00:00Z", conductivity_boiler_umho: 5000, conductivity_feedwater_umho: 1000, sulfite_residual_ppm: 30, phosphate_residual_ppm: 40 }
              as: Operator
              as_user_id: "${op_par}"
            - call: "POST /plants/${p_par}/boilers/${b_par}/warm"
              as: Operator
              as_user_id: "${op_par}"
            - call: "POST /plants/${p_par}/boilers/${b_par}/bring-online"
              as: Operator
              as_user_id: "${op_par}"
            - call: "POST /plants/${p_par}/boilers/${b_par}/inspections"
              payload: { inspection_kind: "RELIEF_VALVE_POP", scheduled_on: "2026-08-06T08:00:00Z", inspector_name: "Insp X", inspector_license_no: "LIC-1", relief_valve_lift_pressure_psi: 175 }
              as: Inspector
              captures: { insp_par: $.data.id, insp_par_v: $.data.version }
          trigger:
            # lift=175, setpoint=165, tol=3% → upper bound = 165*1.03 = 169.95; 175 > 169.95 → forced FAILED
            - call: "POST /plants/${p_par}/boilers/${b_par}/inspections/${insp_par}/record-outcome"
              payload: { outcome: "PASSED", relief_valve_lift_pressure_psi: 175, expected_inspection_version: "${insp_par_v}" }
              as: Inspector
            - call: "GET /plants/${p_par}/boilers/${b_par}"
              as: PlantManager
              captures: { ops: $.data.ops_status, cert: $.data.cert_status, water: $.data.water_status }
          assert:
            # Outcome forced to FAILED because lift exceeds tolerance
            - "Inspection.${insp_par}.outcome == 'FAILED'"
            - "Boiler.${b_par}.cert_status == 'SUSPENDED'"
            - "Boiler.${b_par}.ops_status == 'TRIPPED'"
            - "Boiler.${b_par}.water_status == 'IN_SPEC'"

      - name: operator_license_cyclic_renewal
        grounds:
          - state_machines.Operator
        distinguishing_aspect: |
          Operator.license_status has cyclic shape ACTIVE→EXPIRING→ACTIVE (via
          renew-license) — a loop that is NOT a terminal pipeline. This is a
          different entity (Operator) from the Boiler parallel-dimensions
          instance.
        test_recipe:
          setup:
            - "Plant P (state_code='TX')"
            - "Operator O with license_expires_on 45 days in the future relative to plant clock"
            - "After run_ops, license_status becomes EXPIRING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /plants"
              payload: { name: "Cyc Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_cyc: $.data.id }
            - call: "POST /plants/${p_cyc}/operators"
              payload: { full_name: "Op Cyc", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2026-09-15T00:00:00Z" }
              as: PlantManager
              captures: { op_cyc: $.data.id }
            - call: "POST /plants/${p_cyc}/run-ops"
              as: PlantManager
            - call: "GET /plants/${p_cyc}/operators/${op_cyc}"
              as: PlantManager
              captures: { st1: $.data.license_status }
          trigger:
            - call: "POST /plants/${p_cyc}/operators/${op_cyc}/renew-license"
              payload: { new_license_expires_on: "2027-08-01T00:00:00Z" }
              as: PlantManager
            - call: "GET /plants/${p_cyc}/operators/${op_cyc}"
              as: PlantManager
              captures: { st2: $.data.license_status }
          assert:
            - "Operator.${op_cyc} transitioned ACTIVE → EXPIRING (initial check, before renew)"
            - "Operator.${op_cyc} transitioned EXPIRING → ACTIVE after renew-license (cyclic return)"

  # =========================================================================
  # Rule 4: transitive_cascade — depth ≥3 and ≥2 from DIFFERENT triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: incident_to_lag_dispatch_depth3
        grounds:
          - state_machines.Boiler.TRIPPED
          - state_machines.LoadDispatch.transitions
          - entities.Plant.fields.posture
          - entities.Plant.fields.lead_boiler_id
        distinguishing_aspect: |
          Trigger = POST /incidents with severity=HIGH and triggered_boiler_id.
          Chain depth 3: (1) boiler→TRIPPED, (2) future SCHEDULED LoadDispatch
          containing that boiler→CANCELLED, (3) lag-dispatch re-evaluation
          auto-creates a new LoadDispatch from remaining ONLINE boilers.
        test_recipe:
          setup:
            - "Plant P with two ONLINE boilers B1 (lead) and B2"
            - "A future SCHEDULED LoadDispatch D1 with assigned_boiler_ids=[B1, B2]"
            - "Operator O to raise incident"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlantManager
            - call: "POST /plants"
              payload: { name: "Casc Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_casc: $.data.id }
            - call: "POST /plants/${p_casc}/boilers"
              payload: { tag: "B-1", rated_capacity_lb_hr: 60000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { cb1: $.data.id }
            - call: "POST /plants/${p_casc}/boilers"
              payload: { tag: "B-2", rated_capacity_lb_hr: 50000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { cb2: $.data.id }
            - call: "POST /plants/${p_casc}/operators"
              payload: { full_name: "Op Casc", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_casc: $.data.id }
            - call: "POST /plants/${p_casc}/boilers/${cb1}/chemistry-logs"
              payload: { recorded_by_operator_id: "${op_casc}", recorded_at: "2026-08-05T08:00:00Z", conductivity_boiler_umho: 5000, conductivity_feedwater_umho: 1000, sulfite_residual_ppm: 30, phosphate_residual_ppm: 40 }
              as: Operator
              as_user_id: "${op_casc}"
            - call: "POST /plants/${p_casc}/boilers/${cb2}/chemistry-logs"
              payload: { recorded_by_operator_id: "${op_casc}", recorded_at: "2026-08-05T08:00:00Z", conductivity_boiler_umho: 5000, conductivity_feedwater_umho: 1000, sulfite_residual_ppm: 30, phosphate_residual_ppm: 40 }
              as: Operator
              as_user_id: "${op_casc}"
            - call: "POST /plants/${p_casc}/boilers/${cb1}/warm"
              as: Operator
              as_user_id: "${op_casc}"
            - call: "POST /plants/${p_casc}/boilers/${cb1}/bring-online"
              as: Operator
              as_user_id: "${op_casc}"
            - call: "POST /plants/${p_casc}/boilers/${cb2}/warm"
              as: Operator
              as_user_id: "${op_casc}"
            - call: "POST /plants/${p_casc}/boilers/${cb2}/bring-online"
              as: Operator
              as_user_id: "${op_casc}"
            - call: "POST /plants/${p_casc}/load-dispatches"
              payload: { window_start_at: "2026-08-10T00:00:00Z", window_end_at: "2026-08-10T08:00:00Z", target_steam_lb_hr: 50000, assigned_boiler_ids: ["${cb1}", "${cb2}"] }
              as: PlantManager
              captures: { disp_casc: $.data.id }
          trigger:
            - call: "POST /plants/${p_casc}/incidents"
              payload: { raised_by_operator_id: "${op_casc}", severity: "HIGH", kind: "FLAME_FAILURE", triggered_boiler_id: "${cb1}", raised_at: "2026-08-05T12:00:00Z" }
              as: Operator
              as_user_id: "${op_casc}"
            - call: "GET /plants/${p_casc}/load-dispatches/${disp_casc}"
              as: PlantManager
              captures: { disp_status: $.data.status }
            - call: "GET /plants/${p_casc}/boilers/${cb1}"
              as: PlantManager
              captures: { b1_ops: $.data.ops_status }
            - call: "GET /plants/${p_casc}"
              as: PlantManager
              captures: { lead: $.data.lead_boiler_id, post: $.data.posture }
          assert:
            - "Boiler.${cb1}.ops_status == 'TRIPPED'"
            - "LoadDispatch.${disp_casc}.status == 'CANCELLED'"
            - "Plant.${p_casc}.lead_boiler_id == ${cb2}"
            - "Plant.${p_casc}.posture == 'DEGRADED'"

      - name: relief_failure_cert_suspension_depth2
        grounds:
          - state_machines.Inspection.transitions
          - state_machines.Boiler.cert_status
          - entities.Boiler.fields.ops_status
        distinguishing_aspect: |
          Trigger = POST .../record-outcome on RELIEF_VALVE_POP (different
          trigger from incident cascade). Chain depth 2: (1) FAILED outcome
          forces Boiler.cert_status → SUSPENDED, (2) SUSPENDED forces
          Boiler.ops_status → TRIPPED.
        test_recipe:
          setup:
            - "Plant P, Boiler B ONLINE"
            - "Relief pop inspection scheduled; outcome will fail tolerance check"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Casc2 Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_casc2: $.data.id }
            - call: "POST /plants/${p_casc2}/boilers"
              payload: { tag: "B-C2", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { cb_c2: $.data.id }
            - call: "POST /plants/${p_casc2}/operators"
              payload: { full_name: "Op C2", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_c2: $.data.id }
            - call: "POST /plants/${p_casc2}/boilers/${cb_c2}/chemistry-logs"
              payload: { recorded_by_operator_id: "${op_c2}", recorded_at: "2026-08-05T08:00:00Z", conductivity_boiler_umho: 5000, conductivity_feedwater_umho: 1000, sulfite_residual_ppm: 30, phosphate_residual_ppm: 40 }
              as: Operator
              as_user_id: "${op_c2}"
            - call: "POST /plants/${p_casc2}/boilers/${cb_c2}/warm"
              as: Operator
              as_user_id: "${op_c2}"
            - call: "POST /plants/${p_casc2}/boilers/${cb_c2}/bring-online"
              as: Operator
              as_user_id: "${op_c2}"
            - call: "POST /plants/${p_casc2}/boilers/${cb_c2}/inspections"
              payload: { inspection_kind: "RELIEF_VALVE_POP", scheduled_on: "2026-08-06T08:00:00Z", inspector_name: "Insp Y", inspector_license_no: "LIC-2", relief_valve_lift_pressure_psi: 160 }
              as: Inspector
              captures: { insp_c2: $.data.id, insp_c2_v: $.data.version }
          trigger:
            # lift=160 < setpoint=165 → forced FAILED (no lift)
            - call: "POST /plants/${p_casc2}/boilers/${cb_c2}/inspections/${insp_c2}/record-outcome"
              payload: { outcome: "PASSED", relief_valve_lift_pressure_psi: 160, expected_inspection_version: "${insp_c2_v}" }
              as: Inspector
            - call: "GET /plants/${p_casc2}/boilers/${cb_c2}"
              as: PlantManager
              captures: { cert: $.data.cert_status, ops: $.data.ops_status }
          assert:
            - "Inspection.${insp_c2}.outcome == 'FAILED'"
            - "Boiler.${cb_c2}.cert_status == 'SUSPENDED'"
            - "Boiler.${cb_c2}.ops_status == 'TRIPPED'"

  # =========================================================================
  # Rule 5: priority_pair_validation_conflict — DIFFERENT error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_warm
        grounds:
          - validations[priority=4]
          - validations[priority=6]
        distinguishing_aspect: |
          Pair = state (priority 4, ERR_INVALID_STATE) vs business_safety
          (priority 6, ERR_CERT_NOT_VALID). When boiler is both in wrong
          from-state AND cert not valid, ERR_INVALID_STATE wins because
          state is checked before business_safety.
        test_recipe:
          setup:
            - "Plant P, Boiler B in STANDBY with cert_status=LAPSED (drive clock past cert expiry then run_ops)"
            - "Operator tries to warm while boiler is in TRIPPED state (after a forced trip) — but cert is also LAPSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /plants"
              payload: { name: "PC Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_pc: $.data.id }
            - call: "POST /plants/${p_pc}/boilers"
              payload: { tag: "B-PC", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_pc: $.data.id }
            - call: "POST /plants/${p_pc}/operators"
              payload: { full_name: "Op PC", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_pc: $.data.id }
            # Drive boiler into ONLINE first
            - call: "POST /plants/${p_pc}/boilers/${b_pc}/chemistry-logs"
              payload: { recorded_by_operator_id: "${op_pc}", recorded_at: "2026-08-01T08:00:00Z", conductivity_boiler_umho: 5000, conductivity_feedwater_umho: 1000, sulfite_residual_ppm: 30, phosphate_residual_ppm: 40 }
              as: Operator
              as_user_id: "${op_pc}"
            - call: "POST /plants/${p_pc}/boilers/${b_pc}/warm"
              as: Operator
              as_user_id: "${op_pc}"
            - call: "POST /plants/${p_pc}/boilers/${b_pc}/bring-online"
              as: Operator
              as_user_id: "${op_pc}"
            # Now raise incident to TRIP the boiler (bad state for warm)
            - call: "POST /plants/${p_pc}/incidents"
              payload: { raised_by_operator_id: "${op_pc}", severity: "HIGH", kind: "FLAME_FAILURE", triggered_boiler_id: "${b_pc}", raised_at: "2026-08-01T10:00:00Z" }
              as: Operator
              as_user_id: "${op_pc}"
            # No annual inspection PASSED → after run_ops the cert should be LAPSED
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /plants/${p_pc}/run-ops"
              as: PlantManager
          trigger:
            # Attempt warm on a TRIPPED boiler (state violation) AND cert_status=LAPSED (safety violation)
            - call: "POST /plants/${p_pc}/boilers/${b_pc}/warm"
              as: Operator
              as_user_id: "${op_pc}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_STATE' (state priority 4 wins over business_safety priority 6)"

      - name: business_safety_vs_business_referential_log_create
        grounds:
          - validations[priority=9]
          - validations[priority=11]
        distinguishing_aspect: |
          Pair = business_safety (priority 9, ERR_LICENSE_WRONG_STATE) vs
          business_referential (priority 11, ERR_REFERENCED_NOT_FOUND).
          Different error-category pair from instance 1 (state vs business_safety).
        test_recipe:
          setup:
            - "Plant P in TX, Operator O with license_state='NY' (wrong state)"
            - "POST log-entries with recorded_by_operator_id pointing to non-existent operator UUID AND calling operator O has wrong license_state"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "PC2 Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_pc2: $.data.id }
            - call: "POST /plants/${p_pc2}/boilers"
              payload: { tag: "B-PC2", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_pc2: $.data.id }
            - call: "POST /plants/${p_pc2}/operators"
              payload: { full_name: "Op Wrong State", license_class: "CLASS_1", license_state: "NY", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_wrong: $.data.id }
          trigger:
            - call: "POST /plants/${p_pc2}/boilers/${b_pc2}/log-entries"
              payload: { recorded_by_operator_id: "00000000-0000-0000-0000-000000000000", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 1000, fuel_burned_gal: 8, feedwater_intake_gal: 130, blowdown_gal: 10 }
              as: Operator
              as_user_id: "${op_wrong}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_LICENSE_WRONG_STATE' (business_safety priority 9 wins over business_referential priority 11)"

  # =========================================================================
  # Rule 6: boundary_precision_check — DIFFERENT metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cert_expiry_inclusive_boundary
        grounds:
          - calculations.certificate_expiry_check
        distinguishing_aspect: |
          Metric = certificate_expires_on; boundary is `<=` (inclusive) for
          EXPIRING. When `certificate_expires_on - now == CERT_EXPIRING_WINDOW_DAYS
          * 86400` EXACTLY, status flips to EXPIRING (not stays VALID).
          Endpoint = run_ops.
        test_recipe:
          setup:
            - "Plant P, Boiler B"
            - "PASSED ANNUAL_EXTERNAL Inspection with certificate_expires_on = now + 30 days (exactly at boundary)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /plants"
              payload: { name: "Bnd Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_bnd: $.data.id }
            - call: "POST /plants/${p_bnd}/boilers"
              payload: { tag: "B-BND", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_bnd: $.data.id }
            - call: "POST /plants/${p_bnd}/boilers/${b_bnd}/inspections"
              payload: { inspection_kind: "ANNUAL_EXTERNAL", scheduled_on: "2026-08-01T08:00:00Z", inspector_name: "Insp Z", inspector_license_no: "LIC-3" }
              as: Inspector
              captures: { insp_bnd: $.data.id, insp_bnd_v: $.data.version }
            # certificate expires exactly 30 days after 2026-08-01T00:00:00Z
            - call: "POST /plants/${p_bnd}/boilers/${b_bnd}/inspections/${insp_bnd}/record-outcome"
              payload: { outcome: "PASSED", certificate_number: "CERT-001", certificate_expires_on: "2026-08-31T00:00:00Z", expected_inspection_version: "${insp_bnd_v}" }
              as: Inspector
          trigger:
            - call: "POST /plants/${p_bnd}/run-ops"
              as: PlantManager
            - call: "GET /plants/${p_bnd}/boilers/${b_bnd}"
              as: PlantManager
              captures: { cert: $.data.cert_status }
          assert:
            # 2026-08-31T00:00:00Z - 2026-08-01T00:00:00Z = 30 days exactly = CERT_EXPIRING_WINDOW_DAYS * 86400
            # Boundary uses <= (inclusive) → cert_status becomes EXPIRING
            - "Boiler.${b_bnd}.cert_status == 'EXPIRING'"

      - name: fuel_inventory_zero_boundary
        grounds:
          - calculations.fuel_inventory_balance
          - entities.Plant.fields.fuel_inventory_gal
        distinguishing_aspect: |
          Metric = Plant.fuel_inventory_gal; boundary is zero-quantity edge.
          A log verify that drives fuel_inventory_gal to EXACTLY 0 must succeed
          (>=0 is allowed); one that would drive it below 0 must fail with
          ERR_FUEL_INVENTORY_UNDERFLOW. Endpoint = log-entries verify (different
          endpoint from run_ops used in instance 1).
        test_recipe:
          setup:
            - "Plant P, Boiler B, 100 gal fuel delivered"
            - "Log entry burns exactly 100 gal → fuel_inventory reaches 0 (allowed)"
            - "Then a second log entry burning 1 gal → would underflow"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Fuel Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_fuel: $.data.id }
            - call: "POST /plants/${p_fuel}/boilers"
              payload: { tag: "B-F", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_fuel: $.data.id }
            - call: "POST /plants/${p_fuel}/operators"
              payload: { full_name: "Op F A", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_fa: $.data.id }
            - call: "POST /plants/${p_fuel}/operators"
              payload: { full_name: "Op F B", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_fb: $.data.id }
            - call: "POST /plants/${p_fuel}/fuel-deliveries"
              payload: { delivered_at: "2026-08-01T08:00:00Z", quantity_gal: 100, supplier: "Acme" }
              as: PlantManager
            - call: "POST /plants/${p_fuel}/boilers/${b_fuel}/log-entries"
              payload: { recorded_by_operator_id: "${op_fa}", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 10000, fuel_burned_gal: 100, feedwater_intake_gal: 1300, blowdown_gal: 100 }
              as: Operator
              as_user_id: "${op_fa}"
              captures: { le_f1: $.data.id }
            - call: "GET /plants/${p_fuel}/boilers/${b_fuel}"
              as: PlantManager
              captures: { b_fuel_v: $.data.version }
            - call: "POST /plants/${p_fuel}/boilers/${b_fuel}/log-entries/${le_f1}/verify"
              payload: { expected_boiler_version: "${b_fuel_v}" }
              as: Operator
              as_user_id: "${op_fb}"
            - call: "POST /plants/${p_fuel}/boilers/${b_fuel}/log-entries"
              payload: { recorded_by_operator_id: "${op_fa}", recorded_at: "2026-08-05T11:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 100, fuel_burned_gal: 1, feedwater_intake_gal: 13, blowdown_gal: 1 }
              as: Operator
              as_user_id: "${op_fa}"
              captures: { le_f2: $.data.id }
            - call: "GET /plants/${p_fuel}/boilers/${b_fuel}"
              as: PlantManager
              captures: { b_fuel_v2: $.data.version }
          trigger:
            - call: "POST /plants/${p_fuel}/boilers/${b_fuel}/log-entries/${le_f2}/verify"
              payload: { expected_boiler_version: "${b_fuel_v2}" }
              as: Operator
              as_user_id: "${op_fb}"
              captures: { err: $.data.error_id }
            - call: "GET /plants/${p_fuel}"
              as: PlantManager
              captures: { inv: $.data.fuel_inventory_gal }
          assert:
            # First verify: 100 - 100 = 0 (allowed, zero boundary)
            # Second verify: 0 - 1 = -1 → ERR_FUEL_INVENTORY_UNDERFLOW
            - "Second verify returns error_id == 'ERR_FUEL_INVENTORY_UNDERFLOW'"
            - "Plant.${p_fuel}.fuel_inventory_gal == 0 (zero-quantity edge; first verify succeeded)"

  # =========================================================================
  # Rule 7: cross_entity_state_dependency — DIFFERENT entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: boiler_warm_requires_operator_license_active
        grounds:
          - state_machines.Boiler.STANDBY_to_WARMING
          - entities.Operator.fields.license_status
        distinguishing_aspect: |
          Entity pair = Boiler → Operator. Boiler's warm transition is gated
          on the calling Operator.license_status being ACTIVE.
        test_recipe:
          setup:
            - "Plant P, Boiler B STANDBY with VALID cert, water IN_SPEC"
            - "Operator O has license EXPIRED (license_expires_on < plant clock)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /plants"
              payload: { name: "XD1 Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_xd1: $.data.id }
            - call: "POST /plants/${p_xd1}/boilers"
              payload: { tag: "B-X1", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_xd1: $.data.id }
            - call: "POST /plants/${p_xd1}/operators"
              payload: { full_name: "Op Expired", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2026-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_exp: $.data.id }
            # Advance clock past expiry and run_ops so license_status flips to EXPIRED
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:01Z" }
              as: PlantManager
            - call: "POST /plants/${p_xd1}/run-ops"
              as: PlantManager
          trigger:
            - call: "POST /plants/${p_xd1}/boilers/${b_xd1}/warm"
              as: Operator
              as_user_id: "${op_exp}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_OPERATOR_LICENSE_INVALID'"
            - "Boiler.${b_xd1}.ops_status remains 'STANDBY'"

      - name: inspection_outcome_gates_boiler_reset
        grounds:
          - state_machines.Boiler.TRIPPED_to_STANDBY
          - entities.Inspection.fields.outcome
        distinguishing_aspect: |
          Entity pair = Boiler → Inspection (different from Boiler → Operator).
          Boiler TRIPPED→STANDBY (reset) is gated on a POST_INCIDENT Inspection
          PASSED when cert_status == SUSPENDED.
        test_recipe:
          setup:
            - "Plant P, Boiler B ONLINE then TRIPPED via failed pop test → cert_status=SUSPENDED"
            - "HIGH incident on this boiler is MITIGATED"
            - "Attempt reset WITHOUT a POST_INCIDENT PASSED inspection → fails"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "XD2 Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_xd2: $.data.id }
            - call: "POST /plants/${p_xd2}/boilers"
              payload: { tag: "B-X2", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_xd2: $.data.id }
            - call: "POST /plants/${p_xd2}/operators"
              payload: { full_name: "Op X2", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_x2: $.data.id }
            - call: "POST /plants/${p_xd2}/boilers/${b_xd2}/chemistry-logs"
              payload: { recorded_by_operator_id: "${op_x2}", recorded_at: "2026-08-05T08:00:00Z", conductivity_boiler_umho: 5000, conductivity_feedwater_umho: 1000, sulfite_residual_ppm: 30, phosphate_residual_ppm: 40 }
              as: Operator
              as_user_id: "${op_x2}"
            - call: "POST /plants/${p_xd2}/boilers/${b_xd2}/warm"
              as: Operator
              as_user_id: "${op_x2}"
            - call: "POST /plants/${p_xd2}/boilers/${b_xd2}/bring-online"
              as: Operator
              as_user_id: "${op_x2}"
            # Failed pop test
            - call: "POST /plants/${p_xd2}/boilers/${b_xd2}/inspections"
              payload: { inspection_kind: "RELIEF_VALVE_POP", scheduled_on: "2026-08-06T08:00:00Z", inspector_name: "Insp", inspector_license_no: "L-1", relief_valve_lift_pressure_psi: 175 }
              as: Inspector
              captures: { insp_x2: $.data.id, insp_x2_v: $.data.version }
            - call: "POST /plants/${p_xd2}/boilers/${b_xd2}/inspections/${insp_x2}/record-outcome"
              payload: { outcome: "PASSED", relief_valve_lift_pressure_psi: 175, expected_inspection_version: "${insp_x2_v}" }
              as: Inspector
            # Raise + mitigate incident (so ERR_INCIDENT_UNRESOLVED not hit)
            - call: "POST /plants/${p_xd2}/incidents"
              payload: { raised_by_operator_id: "${op_x2}", severity: "HIGH", kind: "RELIEF_VALVE_LIFT", triggered_boiler_id: "${b_xd2}", raised_at: "2026-08-06T09:00:00Z" }
              as: Operator
              as_user_id: "${op_x2}"
              captures: { inc_x2: $.data.id }
            - call: "POST /plants/${p_xd2}/incidents/${inc_x2}/acknowledge"
              as: Operator
              as_user_id: "${op_x2}"
            - call: "POST /plants/${p_xd2}/incidents/${inc_x2}/mitigate"
              as: Operator
              as_user_id: "${op_x2}"
          trigger:
            # Attempt reset WITHOUT a POST_INCIDENT PASSED inspection
            - call: "POST /plants/${p_xd2}/boilers/${b_xd2}/reset"
              as: Operator
              as_user_id: "${op_x2}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_REINSPECTION_REQUIRED'"
            - "Boiler.${b_xd2}.ops_status remains 'TRIPPED'"
            - "Boiler.${b_xd2}.cert_status remains 'SUSPENDED'"

  # =========================================================================
  # Rule 8: resource_temporal_overlap — DIFFERENT interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: dispatch_window_half_open_adjacency
        grounds:
          - calculations.dispatch_window_overlap_check
          - entities.LoadDispatch.fields.window_start_at
          - entities.LoadDispatch.fields.window_end_at
        distinguishing_aspect: |
          Resource = Boiler (within LoadDispatch); interval semantics = half-open
          [start, end). Adjacent windows (W1.end == W2.start) sharing the same
          boiler MUST be allowed (no conflict).
        test_recipe:
          setup:
            - "Plant P, Boiler B ONLINE"
            - "LoadDispatch D1 with window [T0, T1)"
            - "LoadDispatch D2 with window [T1, T2) sharing same boiler (adjacent, no overlap)"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Adj Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_adj: $.data.id }
            - call: "POST /plants/${p_adj}/boilers"
              payload: { tag: "B-ADJ", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_adj: $.data.id }
            - call: "POST /plants/${p_adj}/load-dispatches"
              payload: { window_start_at: "2026-08-10T00:00:00Z", window_end_at: "2026-08-10T08:00:00Z", target_steam_lb_hr: 20000, assigned_boiler_ids: ["${b_adj}"] }
              as: PlantManager
          trigger:
            - call: "POST /plants/${p_adj}/load-dispatches"
              payload: { window_start_at: "2026-08-10T08:00:00Z", window_end_at: "2026-08-10T16:00:00Z", target_steam_lb_hr: 20000, assigned_boiler_ids: ["${b_adj}"] }
              as: PlantManager
              captures: { d2: $.data.id }
          assert:
            - "Second POST succeeds with 201 (adjacent half-open windows do NOT conflict)"
            - "LoadDispatch.${d2}.status == 'SCHEDULED'"

      - name: inspection_buffered_closed_interval_touching
        grounds:
          - calculations.inspection_scheduling_conflict_check
          - entities.Inspection.fields.scheduled_on
        distinguishing_aspect: |
          Resource = Boiler (within Inspection); interval semantics = CLOSED
          interval [t, t+duration] PLUS a buffer on each side. Two inspections
          whose buffered intervals TOUCH (share an endpoint) DO conflict —
          opposite of dispatch windows' adjacency rule. Different resource
          entity within boiler scope, different interval semantics.
        test_recipe:
          setup:
            - "Plant P, Boiler B"
            - "Inspection I1 scheduled at 2026-08-10T08:00:00Z (occupies [06:00, 14:00] with 4hr duration + 2hr buffer)"
            - "Inspection I2 attempted at 2026-08-10T14:00:00Z (would occupy [12:00, 20:00] — overlaps I1's buffered [06:00, 14:00] at endpoint 14:00)"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Buf Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_buf: $.data.id }
            - call: "POST /plants/${p_buf}/boilers"
              payload: { tag: "B-BUF", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_buf: $.data.id }
            - call: "POST /plants/${p_buf}/boilers/${b_buf}/inspections"
              payload: { inspection_kind: "ANNUAL_INTERNAL", scheduled_on: "2026-08-10T08:00:00Z", inspector_name: "I1", inspector_license_no: "L-1" }
              as: Inspector
          trigger:
            - call: "POST /plants/${p_buf}/boilers/${b_buf}/inspections"
              payload: { inspection_kind: "ANNUAL_EXTERNAL", scheduled_on: "2026-08-10T14:00:00Z", inspector_name: "I2", inspector_license_no: "L-2" }
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            # I1 buffered occupancy: [08:00-2hr, 08:00+4hr+2hr] = [06:00, 14:00] (closed)
            # I2 buffered occupancy: [14:00-2hr, 14:00+4hr+2hr] = [12:00, 20:00] (closed)
            # They touch at 14:00 — closed-interval intersection includes endpoint → conflict
            - "error_id == 'ERR_INSPECTION_SCHEDULE_CONFLICT'"

  # =========================================================================
  # Rule 9: compensating_invariant — DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fuel_inventory_conservation_under_void
        grounds:
          - calculations.fuel_inventory_balance
          - entities.Plant.fields.fuel_inventory_gal
          - entities.Plant.fields.total_fuel_received_gal
          - entities.Plant.fields.total_fuel_consumed_gal
        distinguishing_aspect: |
          Conserved quantity = fuel (gallons). Invariant: total_fuel_received_gal
          - total_fuel_consumed_gal == fuel_inventory_gal. A verify followed by
          a void of the same entry MUST leave fuel_inventory_gal unchanged from
          its pre-verify value (compensating pair).
        test_recipe:
          setup:
            - "Plant P with 500 gal fuel delivered"
            - "Boiler B, two operators A (recorder) and B (verifier)"
            - "Log entry burning 50 gal: DRAFT → VERIFIED → VOIDED"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Cons Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_cons: $.data.id }
            - call: "POST /plants/${p_cons}/boilers"
              payload: { tag: "B-CONS", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_cons: $.data.id }
            - call: "POST /plants/${p_cons}/operators"
              payload: { full_name: "Op A", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_ca: $.data.id }
            - call: "POST /plants/${p_cons}/operators"
              payload: { full_name: "Op B", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_cb: $.data.id }
            - call: "POST /plants/${p_cons}/fuel-deliveries"
              payload: { delivered_at: "2026-08-01T08:00:00Z", quantity_gal: 500, supplier: "Acme" }
              as: PlantManager
            - call: "POST /plants/${p_cons}/boilers/${b_cons}/log-entries"
              payload: { recorded_by_operator_id: "${op_ca}", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 5000, fuel_burned_gal: 50, feedwater_intake_gal: 650, blowdown_gal: 50 }
              as: Operator
              as_user_id: "${op_ca}"
              captures: { le_cons: $.data.id }
            - call: "GET /plants/${p_cons}/boilers/${b_cons}"
              as: PlantManager
              captures: { b_cons_v: $.data.version }
            - call: "POST /plants/${p_cons}/boilers/${b_cons}/log-entries/${le_cons}/verify"
              payload: { expected_boiler_version: "${b_cons_v}" }
              as: Operator
              as_user_id: "${op_cb}"
            - call: "GET /plants/${p_cons}"
              as: PlantManager
              captures: { inv_after_verify: $.data.fuel_inventory_gal, consumed_after_verify: $.data.total_fuel_consumed_gal }
          trigger:
            - call: "POST /plants/${p_cons}/boilers/${b_cons}/log-entries/${le_cons}/void"
              as: PlantManager
            - call: "GET /plants/${p_cons}"
              as: PlantManager
              captures: { inv_after_void: $.data.fuel_inventory_gal, consumed_after_void: $.data.total_fuel_consumed_gal, received: $.data.total_fuel_received_gal }
          assert:
            - "After verify: Plant.fuel_inventory_gal == 450 AND total_fuel_consumed_gal == 50"
            - "After void: Plant.fuel_inventory_gal == 500 (returned to pre-verify value)"
            - "After void: Plant.total_fuel_consumed_gal == 0"
            - "Invariant: total_fuel_received_gal (500) - total_fuel_consumed_gal (0) == fuel_inventory_gal (500)"

      - name: feedwater_mass_balance_conservation
        grounds:
          - calculations.feedwater_mass_balance
          - entities.Boiler.fields.total_feedwater_gal
          - entities.Boiler.fields.total_blowdown_gal
          - entities.Boiler.fields.total_steam_lb
        distinguishing_aspect: |
          Conserved quantity = water mass (different from fuel). Invariant:
          total_feedwater_gal == total_blowdown_gal + (total_steam_lb / 8.345)
          within DRIFT_TOLERANCE_GAL. A verify + void pair on a log entry MUST
          leave the drift at zero (compensating).
        test_recipe:
          setup:
            - "Plant P, Boiler B, two operators A and B"
            - "Log entry: steam=8350 lb (=1000 gal water), blowdown=200 gal, feedwater=1200 gal → drift = |1200 - (200 + 8350/8.345)| = |1200 - (200+1000.6)| = 0.6 gal (within tolerance)"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "WB Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_wb: $.data.id }
            - call: "POST /plants/${p_wb}/boilers"
              payload: { tag: "B-WB", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_wb: $.data.id }
            - call: "POST /plants/${p_wb}/operators"
              payload: { full_name: "Op WB A", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_wba: $.data.id }
            - call: "POST /plants/${p_wb}/operators"
              payload: { full_name: "Op WB B", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_wbb: $.data.id }
            - call: "POST /plants/${p_wb}/fuel-deliveries"
              payload: { delivered_at: "2026-08-01T08:00:00Z", quantity_gal: 1000, supplier: "Acme" }
              as: PlantManager
            - call: "POST /plants/${p_wb}/boilers/${b_wb}/log-entries"
              payload: { recorded_by_operator_id: "${op_wba}", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 8350, fuel_burned_gal: 60, feedwater_intake_gal: 1200, blowdown_gal: 200 }
              as: Operator
              as_user_id: "${op_wba}"
              captures: { le_wb: $.data.id }
            - call: "GET /plants/${p_wb}/boilers/${b_wb}"
              as: PlantManager
              captures: { b_wb_v: $.data.version }
            - call: "POST /plants/${p_wb}/boilers/${b_wb}/log-entries/${le_wb}/verify"
              payload: { expected_boiler_version: "${b_wb_v}" }
              as: Operator
              as_user_id: "${op_wbb}"
          trigger:
            - call: "POST /plants/${p_wb}/boilers/${b_wb}/log-entries/${le_wb}/void"
              as: PlantManager
            - call: "GET /plants/${p_wb}/boilers/${b_wb}"
              as: PlantManager
              captures: { fw: $.data.total_feedwater_gal, bd: $.data.total_blowdown_gal, st: $.data.total_steam_lb }
          assert:
            - "After void: Boiler.total_feedwater_gal == 0 AND total_blowdown_gal == 0 AND total_steam_lb == 0"
            - "Invariant trivially satisfied: 0 == 0 + 0/8.345 (zero drift, compensating pair leaves boiler at initial state)"
