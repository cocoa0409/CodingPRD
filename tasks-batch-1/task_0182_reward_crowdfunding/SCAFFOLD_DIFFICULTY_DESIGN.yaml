      - name: addon_soldout_when_sum_exceeds_limit_on_addon_attach
        grounds:
          - calculations.addon_claimed_quantity
          - validations[priority=12]
          - errors[ERR_ADDON_SOLD_OUT]
        distinguishing_aspect: |
          A DIFFERENT metric (add-on claimed SUM of quantities, not a per-row count) on a DIFFERENT
          endpoint POST /pledges/{id}/add-ons: attach is rejected iff claimed_quantity +
          requested_quantity > limit_quantity. With limit 5 and 3 already claimed, attaching 3 more
          (3+3=6 > 5) is rejected.
        test_recipe:
          setup:
            - "LIVE campaign, add-on product limit 5; a pledge has already attached 3 of the add-on."
          setup_api_calls:
            - call: "POST /creators"
