  # ===========================================================================
  - section: endpoints
    instances:

      - name: patch_originator_employment_status_round_trip_restores_authority
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /originators/{id}]
          - calculations.state_authority_resolution
          - entities.Originator.fields.employment_status
        distinguishing_aspect: |
          The only mutable field on the update endpoint is employment_status, and the authority
          projection is recomputed on every write rather than latched: EMPLOYED -> SUSPENDED
          empties authorized_state_codes, and SUSPENDED -> EMPLOYED restores exactly ["CA"]
          from the still-ACTIVE licence and still-ACTIVE sponsorship, with version strictly
          increasing across both writes.
        test_recipe:
          setup:
            - "Originator 2200001, EMPLOYED, with an ACTIVE CA licence sponsored from
               2026-07-01 (authorized_state_codes == [\"CA\"])."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-70001", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_id: $.data.id }
            - call: "POST /license-registrations/${lic_id}/activations"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_v: $.data.version }
            - call: "POST /license-registrations/${lic_id}/sponsorship-transfers"
              payload: { sponsoring_institution_code: "INST-0001", effective_at: "2026-07-01T00:00:00Z", expected_license_registration_version: "${lic_v}" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { sp_id: $.data.id }
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { v0: $.data.version, emp0: $.data.employment_status, states0: $.data.authorized_state_codes }
          trigger:
            - call: "PATCH /originators/${orig_id}"
              payload: { employment_status: "SUSPENDED" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { v1: $.data.version, emp1: $.data.employment_status, states1: $.data.authorized_state_codes, name1: $.data.legal_name, nmls1: $.data.nmls_unique_id }
            - call: "PATCH /originators/${orig_id}"
              payload: { employment_status: "EMPLOYED" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { v2: $.data.version, emp2: $.data.employment_status, states2: $.data.authorized_state_codes }
            - call: "GET /license-registrations/${lic_id}"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_st: $.data.status }
            - call: "GET /sponsorship-transfers/${sp_id}"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { sp_st: $.data.status }
          assert:
            - "${emp0} == EMPLOYED and ${states0} == [CA]"
            - "${emp1} == SUSPENDED and ${states1} == [] (empty array)"
            - "${name1} == Avery Lane and ${nmls1} == 2200001 (the PATCH touches nothing else)"
            - "${emp2} == EMPLOYED and ${states2} == [CA] (recomputed, not latched)"
            - "${v1} > ${v0} and ${v2} > ${v1}"
            - "${lic_st} == ACTIVE and ${sp_st} == ACTIVE throughout"

      - name: authority_read_as_of_past_instant_excludes_later_sponsorship
        claim_type: computed_read
        grounds:
          - endpoints[GET /originators/{id}/authority]
          - calculations.state_authority_resolution
        distinguishing_aspect: |
          The read is evaluated at as_of_iso8601 rather than at the clock: 2026-06-15 predates
          the sponsorship effective_at 2026-07-01 and returns [], 2026-08-05 returns ["CA"],
          and 2027-01-31 - the licence expiration_date itself - returns [] because the licence
          interval is half-open. The echoed as_of field must be the requested instant, not the
          clock instant 2026-08-01.
        test_recipe:
          setup:
            - "Originator 2200001, EMPLOYED, ACTIVE CA licence with authority_effective_at
               2026-08-01 (the activation instant) and expiration_date 2027-01-31, sponsored
               from 2026-07-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
