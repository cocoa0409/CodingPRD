# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1156 — Cabinet Manufacturing Plant (KCMA)
# 9 difficulty rules × 2 instances = 18 instances.
# All money in integer cents; all literals pre-computed from §1.3 formulas.
# Logical clock default: 2026-05-01T00:00:00Z (never reset in these recipes
# unless a set_current_utc call appears).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: order_pricing_provisional_vs_final_variant
        grounds:
          - calculations.order_line_pricing
          - calculations.order_provisional_totals
          - calculations.order_final_totals
          - state_machines.Order.DRAFT_to_SUBMITTED
          - state_machines.Order.READY_TO_SHIP_to_SHIPPED
        distinguishing_aspect: |
          Order-pricing domain: for identical line data, the provisional variant
          (dealer multiplier 0.65 applied to list+upcharge+mods) yields
          merchandise 1,627,600 while the final variant (multiplier on list only,
          surcharges at full value) yields 1,804,000 — a 176,400-cent divergence
          on the same inputs; the two variants are selected by lifecycle event
          (submit vs route dispatch).
        test_recipe:
          setup:
            - "Dealer D at price_level L2 (multiplier 0.65), credit_limit 100,000,000"
            - "FinishSpec FS SATIN upcharge_pct 0.10 (active)"
            - "Order O with one BOX line: 24x30x12 in, qty 10, unit_list 200,000 cents -> line_list 2,000,000; upcharge 200,000"
            - "One APPROVED mod INCREASED_DEPTH new_dimension_in 20 (delta 8 >= 6 -> tier 0.15): surcharge = min(4000 + 300,000, 800,000) = 304,000"
            - "Order SUBMITTED, then BOX line fully sub-lotted and completed so order is READY_TO_SHIP"
            - "Route R (capacity 500.0) with O assigned and route LOCKED"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L2", dealer_code: "DL2", price_level: "L2", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-SAT-10", color_name: "Oak Satin", sheen: "SATIN", upcharge_pct: 0.10, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 10, unit_list_price_cents: 200000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { ol_id: $.data.id }
            - call: "POST /kcma/order-lines/${ol_id}/modifications"
              payload: { mod_code: "INCREASED_DEPTH", new_dimension_in: 20 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { mod_id: $.data.id }
            - call: "POST /kcma/modifications/${mod_id}/review"
              payload: { decision: "APPROVE", note: "ok" }
              as: Engineer
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/assembly-lines"
              payload: { line_code: "AL-1", capacity_minutes_per_day: 480, standard_minutes_per_box: 30, setup_minutes_per_sub_lot: 20 }
              as: PlantAdmin
              captures: { al_id: $.data.id }
            - call: "POST /kcma/sub-lots"
              payload: { order_line_id: "${ol_id}", assembly_line_id: "${al_id}", scheduled_date: "2026-05-03", start_minute: 60, qty: 10 }
              as: ProductionPlanner
              captures: { sl_id: $.data.id }
            - call: "POST /kcma/sub-lots/${sl_id}/complete"
              as: ProductionPlanner
            - call: "POST /kcma/delivery-routes"
              payload: { route_code: "RT-1", route_date: "2026-05-04", capacity_cu_ft: 500.0 }
              as: ShippingCoordinator
              captures: { rt_id: $.data.id }
            - call: "GET /kcma/orders/${o_id}"
              as: ShippingCoordinator
              captures: { o_v: $.data.version }
            - call: "POST /kcma/delivery-routes/${rt_id}/assign-order"
              payload: { order_id: "${o_id}", expected_order_version: "${o_v}" }
              as: ShippingCoordinator
            - call: "POST /kcma/delivery-routes/${rt_id}/lock"
              as: ShippingCoordinator
          trigger:
            - call: "POST /kcma/delivery-routes/${rt_id}/dispatch"
              as: ShippingCoordinator
            - call: "GET /kcma/orders/${o_id}"
              as: ShippingCoordinator
              captures: { o_prov_total: $.data.provisional_total_cents, o_final_merch: $.data.final_merchandise_cents, o_freight: $.data.freight_cents, o_grand: $.data.grand_total_cents, o_status: $.data.status }
          assert:
            - "Order.${o_id}.provisional_merchandise_cents == 1627600  (round(2,504,000 * 0.65))"
            - "Order.${o_id}.provisional_total_cents == 1627600  (no volume tier below 5,000,000)"
            - "Order.${o_id}.final_merchandise_cents == 1804000  (round(2,000,000*0.65)+200,000+304,000)"
            - "Order.${o_id}.final_merchandise_cents != Order.${o_id}.provisional_merchandise_cents"
            - "Order.${o_id}.freight_cents == 22500  (max(8500, round(50.0*450)); consolidation 0% with 1 order)"
            - "Order.${o_id}.grand_total_cents == 1826500"
            - "Order.${o_id}.status == SHIPPED"

      - name: claim_credit_provisional_vs_final_variant
        grounds:
          - calculations.claim_credit
          - state_machines.ReplacementClaim.SUBMITTED_to_APPROVED_NO_CHARGE
        distinguishing_aspect: |
          Claim-credit domain (distinct entity domain from order pricing): the
          provisional variant is a flat 50% estimate (45,000) while the final
          variant for in-window FREIGHT_DAMAGE pays 100% of basis (90,000) —
          identical claim data, different result, variant selected by the
          adjudication event.
        test_recipe:
          setup:
            - "Dealer D at price_level L4 (multiplier 0.75), credit 100,000,000"
            - "DoorStyle DS SHAKER; FinishSpec FS SATIN upcharge 0.10 tolerance 1.5"
            - "Order O with one DOOR line 15x30x1 qty 4 unit 30,000 -> line_list 120,000, upcharge 12,000"
            - "O fully produced and SHIPPED via route dispatch (shipped_at = 2026-05-01 default clock)"
            - "Claim C: FREIGHT_DAMAGE qty 4 -> credit_basis = round(30,000*0.75*4) = 90,000; provisional = 45,000"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L4", dealer_code: "DL4", price_level: "L4", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/door-styles"
              payload: { style_code: "DS-SHK", name: "Shaker", construction: "SHAKER", base_list_price_cents: 30000 }
              as: PlantAdmin
              captures: { ds_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-SAT-10", color_name: "Oak Satin", sheen: "SATIN", upcharge_pct: 0.10, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "DOOR", door_style_id: "${ds_id}", finish_id: "${fs_id}", width_in: 15, height_in: 30, depth_in: 1, qty: 4, unit_list_price_cents: 30000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { ol_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/finish-batches"
              payload: { finish_id: "${fs_id}", sheen_lot_no: "LOT-1", capacity_doors: 10 }
              as: FinishSupervisor
              captures: { fb_id: $.data.id }
            - call: "POST /kcma/finish-batches/${fb_id}/assign"
              payload: { order_line_id: "${ol_id}" }
              as: FinishSupervisor
            - call: "POST /kcma/finish-batches/${fb_id}/qc-record"
              payload: { measured_delta_e: 1.0 }
              as: FinishSupervisor
            - call: "POST /kcma/delivery-routes"
              payload: { route_code: "RT-C", route_date: "2026-05-04", capacity_cu_ft: 100.0 }
              as: ShippingCoordinator
              captures: { rt_id: $.data.id }
            - call: "GET /kcma/orders/${o_id}"
              as: ShippingCoordinator
              captures: { o_v: $.data.version }
            - call: "POST /kcma/delivery-routes/${rt_id}/assign-order"
              payload: { order_id: "${o_id}", expected_order_version: "${o_v}" }
              as: ShippingCoordinator
            - call: "POST /kcma/delivery-routes/${rt_id}/lock"
              as: ShippingCoordinator
            - call: "POST /kcma/delivery-routes/${rt_id}/dispatch"
              as: ShippingCoordinator
            - call: "POST /kcma/replacement-claims"
              payload: { original_order_line_id: "${ol_id}", claim_type: "FREIGHT_DAMAGE", qty: 4 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { cl_id: $.data.id, cl_prov: $.data.provisional_credit_cents, cl_basis: $.data.credit_basis_cents }
          trigger:
            - call: "POST /kcma/replacement-claims/${cl_id}/adjudicate"
              payload: { decision: "APPROVE", note: "carrier confirmed" }
              as: PlantAdmin
              captures: { cl_final: $.data.final_credit_cents, cl_charge: $.data.replacement_charge_cents, cl_status: $.data.status }
          assert:
            - "ReplacementClaim.${cl_id}.credit_basis_cents == 90000"
            - "ReplacementClaim.${cl_id}.provisional_credit_cents == 45000  (flat 50% estimate)"
            - "ReplacementClaim.${cl_id}.final_credit_cents == 90000  (in-window freight: 100%)"
            - "ReplacementClaim.${cl_id}.replacement_charge_cents == 0"
            - "ReplacementClaim.${cl_id}.provisional_credit_cents != ReplacementClaim.${cl_id}.final_credit_cents"
            - "ReplacementClaim.${cl_id}.status == APPROVED_NO_CHARGE"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: mod_surcharge_tiered_formula_with_cap
        grounds:
          - calculations.mod_surcharge
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: base fee + tiered
          percentage selected by dimension delta (0.05/0.10/0.15), then a nested
          min() against the 40%-of-line-list cap. With line_list 10,000 and
          delta 8 (tier 0.15) raw = 4000+1500 = 5500 but the cap 4000 binds, so
          surcharge == 4000 — proving cap application after tiering.
        test_recipe:
          setup:
            - "Dealer L3 credit 100,000,000; active FinishSpec FS upcharge 0.0"
            - "DRAFT order with BOX line 24x30x12 qty 1 unit 10,000 -> line_list 10,000"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 1, unit_list_price_cents: 10000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { ol_id: $.data.id }
          trigger:
            - call: "POST /kcma/order-lines/${ol_id}/modifications"
              payload: { mod_code: "INCREASED_DEPTH", new_dimension_in: 20 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { m_surcharge: $.data.surcharge_cents, m_status: $.data.status }
          assert:
            - "ModificationRequest.surcharge_cents == 4000  (cap round(10,000*0.40) binds over raw 4000+round(10,000*0.15)=5500)"
            - "ModificationRequest.status == UNDER_REVIEW"

      - name: freight_consolidation_pinned_evaluation_order
        grounds:
          - calculations.freight_consolidation
          - calculations.order_cube
          - state_machines.DeliveryRoute.LOCKED_to_DISPATCHED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by evaluation order:
          freight tier depends on route.assigned_order_count which itself
          includes this order; the scaffold pins count-at-dispatch (3 orders ->
          10%), so freight = round(22,500 * 0.90) = 20,250 for every order,
          not the count at each order's own assign instant (1 or 2).
        test_recipe:
          setup:
            - "Dealer L1 (0.60) credit 100,000,000; FinishSpec FS upcharge 0.0"
            - "Three orders O1,O2,O3, each one BOX line 24x30x12 qty 10 unit 200,000 -> cube 50.0 each, merchandise 1,200,000 each"
            - "Assembly line AL capacity 2000 (30 min/box + 20 setup): each order fully sub-lotted in adjacent windows and completed -> all READY_TO_SHIP"
            - "Route RT capacity 1000.0; all three orders assigned (OCC current versions); route LOCKED"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L1", dealer_code: "DL1", price_level: "L1", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/assembly-lines"
              payload: { line_code: "AL-C", capacity_minutes_per_day: 2000, standard_minutes_per_box: 30, setup_minutes_per_sub_lot: 20 }
              as: PlantAdmin
              captures: { al_id: $.data.id }
            - call: "POST /kcma/delivery-routes"
              payload: { route_code: "RT-3", route_date: "2026-05-05", capacity_cu_ft: 1000.0 }
              as: ShippingCoordinator
              captures: { rt_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o1_id: $.data.id }
            - call: "POST /kcma/orders/${o1_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 10, unit_list_price_cents: 200000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { o1l_id: $.data.id }
            - call: "POST /kcma/orders/${o1_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/sub-lots"
              payload: { order_line_id: "${o1l_id}", assembly_line_id: "${al_id}", scheduled_date: "2026-05-03", start_minute: 60, qty: 10 }
              as: ProductionPlanner
              captures: { s1_id: $.data.id }
            - call: "POST /kcma/sub-lots/${s1_id}/complete"
              as: ProductionPlanner
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o2_id: $.data.id }
            - call: "POST /kcma/orders/${o2_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 10, unit_list_price_cents: 200000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { o2l_id: $.data.id }
            - call: "POST /kcma/orders/${o2_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/sub-lots"
              payload: { order_line_id: "${o2l_id}", assembly_line_id: "${al_id}", scheduled_date: "2026-05-03", start_minute: 380, qty: 10 }
              as: ProductionPlanner
              captures: { s2_id: $.data.id }
            - call: "POST /kcma/sub-lots/${s2_id}/complete"
              as: ProductionPlanner
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o3_id: $.data.id }
            - call: "POST /kcma/orders/${o3_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 10, unit_list_price_cents: 200000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { o3l_id: $.data.id }
            - call: "POST /kcma/orders/${o3_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/sub-lots"
              payload: { order_line_id: "${o3l_id}", assembly_line_id: "${al_id}", scheduled_date: "2026-05-03", start_minute: 700, qty: 10 }
              as: ProductionPlanner
              captures: { s3_id: $.data.id }
            - call: "POST /kcma/sub-lots/${s3_id}/complete"
              as: ProductionPlanner
            - call: "GET /kcma/orders/${o1_id}"
              as: ShippingCoordinator
              captures: { o1_v: $.data.version }
            - call: "POST /kcma/delivery-routes/${rt_id}/assign-order"
              payload: { order_id: "${o1_id}", expected_order_version: "${o1_v}" }
              as: ShippingCoordinator
            - call: "GET /kcma/orders/${o2_id}"
              as: ShippingCoordinator
              captures: { o2_v: $.data.version }
            - call: "POST /kcma/delivery-routes/${rt_id}/assign-order"
              payload: { order_id: "${o2_id}", expected_order_version: "${o2_v}" }
              as: ShippingCoordinator
            - call: "GET /kcma/orders/${o3_id}"
              as: ShippingCoordinator
              captures: { o3_v: $.data.version }
            - call: "POST /kcma/delivery-routes/${rt_id}/assign-order"
              payload: { order_id: "${o3_id}", expected_order_version: "${o3_v}" }
              as: ShippingCoordinator
            - call: "POST /kcma/delivery-routes/${rt_id}/lock"
              as: ShippingCoordinator
          trigger:
            - call: "POST /kcma/delivery-routes/${rt_id}/dispatch"
              as: ShippingCoordinator
            - call: "GET /kcma/orders/${o1_id}"
              as: ShippingCoordinator
              captures: { o1_fr: $.data.freight_cents, o1_grand: $.data.grand_total_cents }
            - call: "GET /kcma/orders/${o2_id}"
              as: ShippingCoordinator
              captures: { o2_fr: $.data.freight_cents }
            - call: "GET /kcma/orders/${o3_id}"
              as: ShippingCoordinator
              captures: { o3_fr: $.data.freight_cents }
          assert:
            - "Order.${o1_id}.freight_cents == 20250  (count-at-dispatch = 3 -> 10% tier for ALL orders)"
            - "Order.${o2_id}.freight_cents == 20250"
            - "Order.${o3_id}.freight_cents == 20250"
            - "Order.${o1_id}.grand_total_cents == 1220250  (1,200,000 - 0 + 20,250)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: modification_request_changes_resubmit_cycle
        grounds:
          - state_machines.ModificationRequest.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.ModificationRequest.CHANGES_REQUESTED_to_UNDER_REVIEW
          - calculations.mod_surcharge
        distinguishing_aspect: |
          ModificationRequest is cyclic: UNDER_REVIEW -> CHANGES_REQUESTED ->
          UNDER_REVIEW via resubmit (revision 2, surcharge recomputed from the
          revised dimension: delta 2 -> tier 0.05 -> 4000+100,000 = 104,000),
          then APPROVED — a revision loop, not a pipeline.
        test_recipe:
          setup:
            - "Dealer L2 credit 100,000,000; FinishSpec FS upcharge 0.10"
            - "DRAFT order with BOX line 24x30x12 qty 10 unit 200,000 -> line_list 2,000,000"
            - "Mod M INCREASED_DEPTH new_dimension_in 20 (surcharge 304,000) UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L2", dealer_code: "DL2", price_level: "L2", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-SAT-10", color_name: "Oak Satin", sheen: "SATIN", upcharge_pct: 0.10, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 10, unit_list_price_cents: 200000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { ol_id: $.data.id }
            - call: "POST /kcma/order-lines/${ol_id}/modifications"
              payload: { mod_code: "INCREASED_DEPTH", new_dimension_in: 20 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { mod_id: $.data.id }
            - call: "POST /kcma/modifications/${mod_id}/review"
              payload: { decision: "REQUEST_CHANGES", note: "too deep" }
              as: Engineer
          trigger:
            - call: "POST /kcma/modifications/${mod_id}/resubmit"
              payload: { new_dimension_in: 14 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { m_rev: $.data.revision, m_sur: $.data.surcharge_cents, m_st: $.data.status }
            - call: "POST /kcma/modifications/${mod_id}/review"
              payload: { decision: "APPROVE", note: "ok now" }
              as: Engineer
              captures: { m_final: $.data.status }
          assert:
            - "after resubmit: ModificationRequest.${mod_id}.status == UNDER_REVIEW"
            - "after resubmit: ModificationRequest.${mod_id}.revision == 2"
            - "after resubmit: ModificationRequest.${mod_id}.surcharge_cents == 104000  (delta |14-12|=2 -> 0.05 tier)"
            - "after second review: ModificationRequest.${mod_id}.status == APPROVED"

      - name: finish_batch_failed_remix_release_cycle
        grounds:
          - state_machines.FinishBatch.MIXING_to_FAILED
          - state_machines.FinishBatch.FAILED_to_MIXING
          - state_machines.FinishBatch.MIXING_to_RELEASED
          - calculations.batch_color_match
        distinguishing_aspect: |
          FinishBatch is cyclic: MIXING -> FAILED (delta_e 1.9 > 1.5) -> MIXING
          via remix (remix_count 1, measured_delta_e cleared) -> RELEASED on the
          second QC record (1.2 <= 1.5) — a rework loop on the same entity.
        test_recipe:
          setup:
            - "FinishSpec FS tolerance 1.5 active; batch B capacity 10 for FS, lot LOT-9"
          setup_api_calls:
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-QC", color_name: "Cherry", sheen: "SEMI_GLOSS", upcharge_pct: 0.12, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/finish-batches"
              payload: { finish_id: "${fs_id}", sheen_lot_no: "LOT-9", capacity_doors: 10 }
              as: FinishSupervisor
              captures: { fb_id: $.data.id }
            - call: "POST /kcma/finish-batches/${fb_id}/qc-record"
              payload: { measured_delta_e: 1.9 }
              as: FinishSupervisor
              captures: { fb_fail: $.data.status }
            - call: "POST /kcma/finish-batches/${fb_id}/remix"
              as: FinishSupervisor
              captures: { fb_mix: $.data.status, fb_remix: $.data.remix_count, fb_de: $.data.measured_delta_e }
          trigger:
            - call: "POST /kcma/finish-batches/${fb_id}/qc-record"
              payload: { measured_delta_e: 1.2 }
              as: FinishSupervisor
              captures: { fb_rel: $.data.status }
          assert:
            - "first qc-record: FinishBatch.${fb_id}.status == FAILED"
            - "after remix: status == MIXING, remix_count == 1, measured_delta_e == null"
            - "second qc-record: FinishBatch.${fb_id}.status == RELEASED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: nesting_release_shortage_hold_cascade
        grounds:
          - state_machines.NestingRun.DRAFT_to_RELEASED
          - calculations.nesting_yield
          - calculations.component_availability
          - entities.Order.fields.hold_status
        distinguishing_aspect: |
          Depth-4 chain from the release trigger: run release -> Parts generated
          -> Component.reserved_qty += 8 makes available_qty -3 -> a
          COMPONENT_SHORTAGE OrderHold (shortfall 3) is PLACED on the owning
          order -> order.hold_status flips to ON_HOLD, gating its
          auto-transitions. Each hop is caused by the previous hop, not by the
          original request.
        test_recipe:
          setup:
            - "Component C SHEET_GOODS 96x48 (area 4608 in2), on_hand 5"
            - "Dealer L3 credit high; order O SUBMITTED with DOOR line 30x20x1 qty 50 (total blank area 30,000 in2)"
            - "Station ST changeover 0; run NR on ST over the door line, window 2026-05-02 [60,240)"
            - "nesting_yield: sheets = ceil(30,000*1.12/4608) = ceil(7.2917) = 8"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/door-styles"
              payload: { style_code: "DS-SLAB", name: "Slab", construction: "SLAB", base_list_price_cents: 15000 }
              as: PlantAdmin
              captures: { ds_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/components"
              payload: { sku: "PLY-48X96", description: "Plywood sheet", kind: "SHEET_GOODS", sheet_width_in: 96, sheet_height_in: 48, on_hand_qty: 5 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "DOOR", door_style_id: "${ds_id}", finish_id: "${fs_id}", width_in: 30, height_in: 20, depth_in: 1, qty: 50, unit_list_price_cents: 15000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { ol_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/nesting-stations"
              payload: { station_code: "ST-1", changeover_minutes: 0 }
              as: PlantAdmin
              captures: { st_id: $.data.id }
            - call: "POST /kcma/nesting-runs"
              payload: { station_id: "${st_id}", sheet_component_id: "${c_id}", door_line_ids: ["${ol_id}"], scheduled_date: "2026-05-02", start_minute: 60, end_minute: 240 }
              as: ProductionPlanner
              captures: { nr_id: $.data.id }
          trigger:
            - call: "POST /kcma/nesting-runs/${nr_id}/release"
              as: ProductionPlanner
              captures: { nr_sheets: $.data.sheets_required, nr_util: $.data.utilization_pct }
            - call: "GET /kcma/components/${c_id}"
              as: ProductionPlanner
              captures: { c_avail: $.data.available_qty, c_res: $.data.reserved_qty }
            - call: "GET /kcma/orders/${o_id}"
              as: ProductionPlanner
              captures: { o_hold: $.data.hold_status, o_status: $.data.status }
            - call: "GET /kcma/orders/${o_id}/holds"
              as: ProductionPlanner
              captures: { h_reason: "$.data[0].reason", h_short: "$.data[0].shortfall_qty", h_status: "$.data[0].status" }
            - call: "GET /kcma/parts?nesting_run_id=${nr_id}"
              as: ProductionPlanner
              captures: { p_seq: "$.data[0].part_seq", p_qty: "$.data[0].qty" }
          assert:
            - "NestingRun.${nr_id}.sheets_required == 8"
            - "NestingRun.${nr_id}.utilization_pct == 81.38  (round(100*30000/(8*4608),2))"
            - "Component.${c_id}.reserved_qty == 8 and available_qty == -3"
            - "Order.${o_id}.hold_status == ON_HOLD and status == SUBMITTED (auto-transition gated)"
            - "OrderHold[0]: reason == COMPONENT_SHORTAGE, shortfall_qty == 3, status == PLACED, component_id == ${c_id}"
            - "Part[0]: part_seq == 1, qty == 50, component_id == ${c_id}"

      - name: batch_qc_fail_unassign_hold_cascade
        grounds:
          - state_machines.FinishBatch.MIXING_to_FAILED
          - state_machines.OrderLine.IN_PROGRESS_to_QUOTED
          - state_machines.OrderHold.PLACED_to_RELEASED
          - entities.Order.fields.hold_status
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (qc-record, not release):
          batch FAILS -> assigned DOOR lines are unassigned (finish_batch_id
          cleared, IN_PROGRESS -> QUOTED, batch assigned_door_count drops to 0)
          -> FINISH_QC OrderHolds are PLACED on each distinct affected order ->
          both orders flip hold_status to ON_HOLD. Different origin transition
          than the nesting-release cascade.
        test_recipe:
          setup:
            - "Dealer L3 credit high; FinishSpec FS tol 1.5; DoorStyle DS"
            - "Orders O1 (DOOR line qty 4) and O2 (DOOR line qty 6), both SUBMITTED"
            - "Batch B capacity 50 for FS; both lines assigned (assigned_door_count 10); both orders auto-advanced to IN_PRODUCTION"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/door-styles"
              payload: { style_code: "DS-RP", name: "Raised Panel", construction: "RAISED_PANEL", base_list_price_cents: 22000 }
              as: PlantAdmin
              captures: { ds_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-CH", color_name: "Cherry", sheen: "SEMI_GLOSS", upcharge_pct: 0.12, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o1_id: $.data.id }
            - call: "POST /kcma/orders/${o1_id}/lines"
              payload: { line_type: "DOOR", door_style_id: "${ds_id}", finish_id: "${fs_id}", width_in: 15, height_in: 30, depth_in: 1, qty: 4, unit_list_price_cents: 22000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { o1l_id: $.data.id }
            - call: "POST /kcma/orders/${o1_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o2_id: $.data.id }
            - call: "POST /kcma/orders/${o2_id}/lines"
              payload: { line_type: "DOOR", door_style_id: "${ds_id}", finish_id: "${fs_id}", width_in: 15, height_in: 30, depth_in: 1, qty: 6, unit_list_price_cents: 22000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { o2l_id: $.data.id }
            - call: "POST /kcma/orders/${o2_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/finish-batches"
              payload: { finish_id: "${fs_id}", sheen_lot_no: "LOT-7", capacity_doors: 50 }
              as: FinishSupervisor
              captures: { fb_id: $.data.id }
            - call: "POST /kcma/finish-batches/${fb_id}/assign"
              payload: { order_line_id: "${o1l_id}" }
              as: FinishSupervisor
            - call: "POST /kcma/finish-batches/${fb_id}/assign"
              payload: { order_line_id: "${o2l_id}" }
              as: FinishSupervisor
              captures: { fb_cnt: $.data.assigned_door_count }
          trigger:
            - call: "POST /kcma/finish-batches/${fb_id}/qc-record"
              payload: { measured_delta_e: 2.0 }
              as: FinishSupervisor
              captures: { fb_status: $.data.status, fb_cnt_after: $.data.assigned_door_count }
            - call: "GET /kcma/order-lines/${o1l_id}"
              as: FinishSupervisor
              captures: { o1l_st: $.data.status, o1l_fb: $.data.finish_batch_id }
            - call: "GET /kcma/orders/${o1_id}/holds"
              as: FinishSupervisor
              captures: { o1h_reason: "$.data[0].reason" }
            - call: "GET /kcma/orders/${o2_id}"
              as: FinishSupervisor
              captures: { o2_hold: $.data.hold_status }
          assert:
            - "FinishBatch.${fb_id}.status == FAILED and assigned_door_count == 0 (was 10 before qc-record)"
            - "OrderLine.${o1l_id}.status == QUOTED and finish_batch_id == null"
            - "Order.${o1_id} has a PLACED hold with reason == FINISH_QC"
            - "Order.${o2_id}.hold_status == ON_HOLD"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_double_submit
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_ORDER_NOT_SUBMITTABLE]
          - errors[ERR_DEALER_CREDIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair (state vs business_fiscal): the second submit violates
          both the DRAFT-state precondition (priority 6) and the dealer credit
          ceiling (priority 13, credit lowered to 1,000,000 below the order's
          1,400,000 provisional total) — the state error
          ERR_ORDER_NOT_SUBMITTABLE must win.
        test_recipe:
          setup:
            - "Dealer L3 (0.70) credit_limit 2,000,000; order SUBMITTED with one BOX line unit 200,000 qty 10 upcharge 0 -> provisional_total 1,400,000"
            - "Dealer credit then lowered to 1,000,000 (< 1,400,000)"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 2000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 10, unit_list_price_cents: 200000 }
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "PUT /kcma/dealers/${d_id}"
              payload: { credit_limit_cents: 1000000 }
              as: PlantAdmin
          trigger:
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ORDER_NOT_SUBMITTABLE (state priority 6 beats fiscal priority 13)"
            - "Order.${o_id}.status remains SUBMITTED"

      - name: referential_beats_constraint_on_line_create
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_DOOR_STYLE_INACTIVE]
          - errors[ERR_WRONG_LINE_TYPE]
        distinguishing_aspect: |
          Category pair (business_referential vs business_constraint), distinct
          from the state-vs-fiscal pairing: a DOOR line referencing an INACTIVE
          door style (priority 8) while also violating the depth_in == 1 shape
          rule (priority 9) must return ERR_DOOR_STYLE_INACTIVE.
        test_recipe:
          setup:
            - "Dealer L3; inactive DoorStyle DS-OFF (active=false); active FinishSpec FS"
            - "DRAFT order O"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/door-styles"
              payload: { style_code: "DS-OFF", name: "Discontinued", construction: "SLAB", base_list_price_cents: 15000, active: false }
              as: PlantAdmin
              captures: { ds_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "DOOR", door_style_id: "${ds_id}", finish_id: "${fs_id}", width_in: 15, height_in: 30, depth_in: 5, qty: 1, unit_list_price_cents: 15000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DOOR_STYLE_INACTIVE (referential priority 8 beats constraint priority 9)"
            - "no OrderLine created for Order.${o_id} (GET /kcma/order-lines?order_id= returns 0 rows)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: volume_discount_tier_boundary_exact_hit
        grounds:
          - calculations.order_provisional_totals
          - validations[priority=13]
        distinguishing_aspect: |
          Metric: merchandise cents at the 5,000,000 tier edge, reached via
          POST /orders/{id}/submit. The boundary is inclusive (>=): merchandise
          exactly 5,000,000 earns the 5% tier (discount 250,000, total
          4,750,000); a control order at 4,900,000 earns 0.
        test_recipe:
          setup:
            - "Dealer L5 (0.80) credit 100,000,000; FinishSpec FS upcharge 0.0"
            - "O1: one BOX line unit 125,000 qty 50 -> list 6,250,000 -> net round(6,250,000*0.80) = 5,000,000 exactly"
            - "O2: one BOX line unit 125,000 qty 49 -> list 6,125,000 -> net 4,900,000"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L5", dealer_code: "DL5", price_level: "L5", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o1_id: $.data.id }
            - call: "POST /kcma/orders/${o1_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 50, unit_list_price_cents: 125000 }
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o2_id: $.data.id }
            - call: "POST /kcma/orders/${o2_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 49, unit_list_price_cents: 125000 }
              as: Dealer
              as_user_id: ${d_id}
          trigger:
            - call: "POST /kcma/orders/${o1_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o1_disc: $.data.provisional_discount_cents, o1_total: $.data.provisional_total_cents, o1_merch: $.data.provisional_merchandise_cents }
            - call: "POST /kcma/orders/${o2_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o2_disc: $.data.provisional_discount_cents, o2_total: $.data.provisional_total_cents }
          assert:
            - "Order.${o1_id}.provisional_merchandise_cents == 5000000 (exactly at tier edge)"
            - "Order.${o1_id}.provisional_discount_cents == 250000  (5% applies at >= 5,000,000)"
            - "Order.${o1_id}.provisional_total_cents == 4750000"
            - "Order.${o2_id}.provisional_discount_cents == 0  (4,900,000 below tier)"
            - "Order.${o2_id}.provisional_total_cents == 4900000"

      - name: delta_e_tolerance_boundary_exact_pass
        grounds:
          - calculations.batch_color_match
          - state_machines.FinishBatch.MIXING_to_RELEASED
          - state_machines.FinishBatch.MIXING_to_FAILED
        distinguishing_aspect: |
          Metric: color deviation Delta-E at the tolerance edge, reached via
          POST /finish-batches/{id}/qc-record — a different metric and endpoint
          than the money-tier boundary. |1.5| <= 1.5 RELEASES the batch;
          |1.51| > 1.5 FAILS it.
        test_recipe:
          setup:
            - "FinishSpec FS tolerance 1.5; batches B1 and B2 both MIXING for FS"
          setup_api_calls:
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-QC", color_name: "Cherry", sheen: "SEMI_GLOSS", upcharge_pct: 0.12, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/finish-batches"
              payload: { finish_id: "${fs_id}", sheen_lot_no: "LOT-A", capacity_doors: 10 }
              as: FinishSupervisor
              captures: { b1_id: $.data.id }
            - call: "POST /kcma/finish-batches"
              payload: { finish_id: "${fs_id}", sheen_lot_no: "LOT-B", capacity_doors: 10 }
              as: FinishSupervisor
              captures: { b2_id: $.data.id }
          trigger:
            - call: "POST /kcma/finish-batches/${b1_id}/qc-record"
              payload: { measured_delta_e: 1.5 }
              as: FinishSupervisor
              captures: { b1_status: $.data.status }
            - call: "POST /kcma/finish-batches/${b2_id}/qc-record"
              payload: { measured_delta_e: 1.51 }
              as: FinishSupervisor
              captures: { b2_status: $.data.status }
          assert:
            - "FinishBatch.${b1_id}.status == RELEASED  (boundary value 1.5 <= 1.5 passes)"
            - "FinishBatch.${b2_id}.status == FAILED  (1.51 > 1.5)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_gated_by_engineering_review_state
        grounds:
          - state_machines.Order.DRAFT_to_SUBMITTED
          - state_machines.ModificationRequest.UNDER_REVIEW_to_APPROVED
          - validations[priority=7]
          - errors[ERR_MODS_PENDING_REVIEW]
        distinguishing_aspect: |
          Entity pair Order <- ModificationRequest: the order's DRAFT->SUBMITTED
          transition is legal only when every mod on its lines is in a terminal
          review state; with one mod UNDER_REVIEW the submit is rejected with
          ERR_MODS_PENDING_REVIEW, and the identical submit succeeds after the
          Engineer's APPROVE — the order's transition set is a function of
          sibling-entity state.
        test_recipe:
          setup:
            - "Dealer L3 credit 100,000,000; FinishSpec FS upcharge 0.0"
            - "DRAFT order O, BOX line unit 100,000 qty 2 (list 200,000; net 140,000 <= credit)"
            - "Mod M on the line, still UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 2, unit_list_price_cents: 100000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { ol_id: $.data.id }
            - call: "POST /kcma/order-lines/${ol_id}/modifications"
              payload: { mod_code: "REDUCED_WIDTH", new_dimension_in: 22 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { mod_id: $.data.id }
          trigger:
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
              captures: { err: $.data.error_id }
            - call: "POST /kcma/modifications/${mod_id}/review"
              payload: { decision: "APPROVE" }
              as: Engineer
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_status: $.data.status }
          assert:
            - "first submit: error_id == ERR_MODS_PENDING_REVIEW; order stays DRAFT"
            - "after APPROVE, second submit succeeds: Order.${o_id}.status == SUBMITTED"

      - name: dispatch_gated_by_order_readiness_state
        grounds:
          - state_machines.DeliveryRoute.LOCKED_to_DISPATCHED
          - state_machines.Order.IN_PRODUCTION_to_READY_TO_SHIP
          - validations[priority=7]
          - errors[ERR_ORDERS_NOT_READY_TO_SHIP]
        distinguishing_aspect: |
          Entity pair DeliveryRoute <- Order (different pair than Order <-
          ModificationRequest): the route's LOCKED->DISPATCHED transition is
          legal only when every assigned order is READY_TO_SHIP; with the
          assigned order still IN_PRODUCTION (its batch unreleased) dispatch is
          rejected, and succeeds after the batch QC release cascades the order
          to READY_TO_SHIP.
        test_recipe:
          setup:
            - "Dealer L4 credit high; DoorStyle DS; FinishSpec FS tol 1.5 upcharge 0.10"
            - "Order O SUBMITTED with DOOR line qty 4; batch B capacity 10; line assigned (O auto -> IN_PRODUCTION)"
            - "Route RT capacity 100; O assigned (OCC) and route LOCKED while O is IN_PRODUCTION"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L4", dealer_code: "DL4", price_level: "L4", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/door-styles"
              payload: { style_code: "DS-SHK", name: "Shaker", construction: "SHAKER", base_list_price_cents: 30000 }
              as: PlantAdmin
              captures: { ds_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-SAT-10", color_name: "Oak Satin", sheen: "SATIN", upcharge_pct: 0.10, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "DOOR", door_style_id: "${ds_id}", finish_id: "${fs_id}", width_in: 15, height_in: 30, depth_in: 1, qty: 4, unit_list_price_cents: 30000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { ol_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/finish-batches"
              payload: { finish_id: "${fs_id}", sheen_lot_no: "LOT-1", capacity_doors: 10 }
              as: FinishSupervisor
              captures: { fb_id: $.data.id }
            - call: "POST /kcma/finish-batches/${fb_id}/assign"
              payload: { order_line_id: "${ol_id}" }
              as: FinishSupervisor
            - call: "POST /kcma/delivery-routes"
              payload: { route_code: "RT-D", route_date: "2026-05-04", capacity_cu_ft: 100.0 }
              as: ShippingCoordinator
              captures: { rt_id: $.data.id }
            - call: "GET /kcma/orders/${o_id}"
              as: ShippingCoordinator
              captures: { o_v: $.data.version }
            - call: "POST /kcma/delivery-routes/${rt_id}/assign-order"
              payload: { order_id: "${o_id}", expected_order_version: "${o_v}" }
              as: ShippingCoordinator
            - call: "POST /kcma/delivery-routes/${rt_id}/lock"
              as: ShippingCoordinator
          trigger:
            - call: "POST /kcma/delivery-routes/${rt_id}/dispatch"
              as: ShippingCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /kcma/finish-batches/${fb_id}/qc-record"
              payload: { measured_delta_e: 1.0 }
              as: FinishSupervisor
            - call: "POST /kcma/delivery-routes/${rt_id}/dispatch"
              as: ShippingCoordinator
              captures: { rt_status: $.data.status }
          assert:
            - "first dispatch: error_id == ERR_ORDERS_NOT_READY_TO_SHIP; route stays LOCKED"
            - "after batch release cascades order to READY_TO_SHIP: second dispatch succeeds, route DISPATCHED, order SHIPPED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: assembly_line_half_open_window_adjacency
        grounds:
          - validations[priority=11]
          - calculations.sublot_work_minutes
          - errors[ERR_LINE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource AssemblyLine with half-open interval semantics: sub-lot B
          starting at minute 380 is ADJACENT to A's [60,380) and is accepted
          (touching endpoints do not overlap), while sub-lot C starting at 379
          intersects A and is rejected with ERR_LINE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Dealer L3 credit high; FinishSpec FS upcharge 0.0"
            - "Order O SUBMITTED with BOX line qty 30 (unit 50,000)"
            - "Assembly line AL capacity 2000 min/day, 30 min/box, setup 20 -> sub-lot of 10 = 320 min, of 5 = 170 min"
            - "Sub-lot A: 2026-05-03 [60,380) qty 10"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 30, unit_list_price_cents: 50000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { ol_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/assembly-lines"
              payload: { line_code: "AL-W", capacity_minutes_per_day: 2000, standard_minutes_per_box: 30, setup_minutes_per_sub_lot: 20 }
              as: PlantAdmin
              captures: { al_id: $.data.id }
            - call: "POST /kcma/sub-lots"
              payload: { order_line_id: "${ol_id}", assembly_line_id: "${al_id}", scheduled_date: "2026-05-03", start_minute: 60, qty: 10 }
              as: ProductionPlanner
              captures: { sa_id: $.data.id, sa_end: $.data.end_minute }
          trigger:
            - call: "POST /kcma/sub-lots"
              payload: { order_line_id: "${ol_id}", assembly_line_id: "${al_id}", scheduled_date: "2026-05-03", start_minute: 380, qty: 10 }
              as: ProductionPlanner
              captures: { sb_id: $.data.id, sb_end: $.data.end_minute, sb_work: $.data.work_minutes }
            - call: "POST /kcma/sub-lots"
              payload: { order_line_id: "${ol_id}", assembly_line_id: "${al_id}", scheduled_date: "2026-05-03", start_minute: 379, qty: 5 }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "SubLot A end_minute == 380 (work 320 = 10*30+20)"
            - "SubLot B created with start_minute 380, end_minute == 700 (adjacency at 380 allowed under half-open semantics)"
            - "SubLot C (start 379) rejected: error_id == ERR_LINE_WINDOW_OVERLAP"
            - "line slotted_qty == 20 after A and B only"

      - name: nesting_station_changeover_buffer_overlap
        grounds:
          - validations[priority=11]
          - errors[ERR_STATION_WINDOW_OVERLAP]
          - entities.NestingStation.fields.changeover_minutes
        distinguishing_aspect: |
          Resource NestingStation with buffer semantics — different resource and
          different interval semantics than the assembly line's half-open
          adjacency: run B starting exactly at A.end + changeover (240+30=270)
          is accepted, while run C at 269 violates the mandatory 30-minute
          changeover gap even though it does not intersect A's window.
        test_recipe:
          setup:
            - "Station ST changeover_minutes 30"
            - "Component SHEET_GOODS 96x48 on_hand 100; two SUBMITTED door orders O1/O2 (lines L1/L2)"
            - "Run A on ST: 2026-05-02 [60,240) over L1"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/door-styles"
              payload: { style_code: "DS-SLAB", name: "Slab", construction: "SLAB", base_list_price_cents: 15000 }
              as: PlantAdmin
              captures: { ds_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/components"
              payload: { sku: "PLY-48X96", description: "Plywood sheet", kind: "SHEET_GOODS", sheet_width_in: 96, sheet_height_in: 48, on_hand_qty: 100 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /kcma/nesting-stations"
              payload: { station_code: "ST-B", changeover_minutes: 30 }
              as: PlantAdmin
              captures: { st_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o1_id: $.data.id }
            - call: "POST /kcma/orders/${o1_id}/lines"
              payload: { line_type: "DOOR", door_style_id: "${ds_id}", finish_id: "${fs_id}", width_in: 15, height_in: 30, depth_in: 1, qty: 2, unit_list_price_cents: 10000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { l1_id: $.data.id }
            - call: "POST /kcma/orders/${o1_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o2_id: $.data.id }
            - call: "POST /kcma/orders/${o2_id}/lines"
              payload: { line_type: "DOOR", door_style_id: "${ds_id}", finish_id: "${fs_id}", width_in: 15, height_in: 30, depth_in: 1, qty: 2, unit_list_price_cents: 10000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { l2_id: $.data.id }
            - call: "POST /kcma/orders/${o2_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/nesting-runs"
              payload: { station_id: "${st_id}", sheet_component_id: "${c_id}", door_line_ids: ["${l1_id}"], scheduled_date: "2026-05-02", start_minute: 60, end_minute: 240 }
              as: ProductionPlanner
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /kcma/nesting-runs"
              payload: { station_id: "${st_id}", sheet_component_id: "${c_id}", door_line_ids: ["${l2_id}"], scheduled_date: "2026-05-02", start_minute: 270, end_minute: 400 }
              as: ProductionPlanner
              captures: { rb_id: $.data.id }
            - call: "POST /kcma/nesting-runs"
              payload: { station_id: "${st_id}", sheet_component_id: "${c_id}", door_line_ids: ["${l2_id}"], scheduled_date: "2026-05-02", start_minute: 269, end_minute: 400 }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "Run B (start 270 = 240 + 30 changeover) accepted: created with id ${rb_id}"
            - "Run C (start 269) rejected: error_id == ERR_STATION_WINDOW_OVERLAP (buffer not cleared despite no geometric intersection)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: route_cube_conserved_under_reassignment
        grounds:
          - concurrency_rules[order-assign-stale-order]
          - entities.DeliveryRoute.fields.reserved_cu_ft
          - calculations.order_cube
        distinguishing_aspect: |
          Conserved quantity: total reserved cube across all routes. The forward
          action (assign order O cube 50.0 to R1) paired with its compensating
          action (assign O to R2, superseding R1) leaves SUM(route.reserved_cu_ft)
          unchanged at 50.0 — R1 drops to 0.0 as R2 rises to 50.0.
        test_recipe:
          setup:
            - "Dealer L1 credit high; order O SUBMITTED with BOX line cube 50.0"
            - "Routes R1 and R2, each capacity 100.0, PLANNED"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L1", dealer_code: "DL1", price_level: "L1", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 10, unit_list_price_cents: 200000 }
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/delivery-routes"
              payload: { route_code: "RT-X", route_date: "2026-05-06", capacity_cu_ft: 100.0 }
              as: ShippingCoordinator
              captures: { r1_id: $.data.id }
            - call: "POST /kcma/delivery-routes"
              payload: { route_code: "RT-Y", route_date: "2026-05-06", capacity_cu_ft: 100.0 }
              as: ShippingCoordinator
              captures: { r2_id: $.data.id }
            - call: "GET /kcma/orders/${o_id}"
              as: ShippingCoordinator
              captures: { o_v1: $.data.version }
            - call: "POST /kcma/delivery-routes/${r1_id}/assign-order"
              payload: { order_id: "${o_id}", expected_order_version: "${o_v1}" }
              as: ShippingCoordinator
              captures: { r1_res: $.data.reserved_cu_ft }
          trigger:
            - call: "GET /kcma/orders/${o_id}"
              as: ShippingCoordinator
              captures: { o_v2: $.data.version }
            - call: "POST /kcma/delivery-routes/${r2_id}/assign-order"
              payload: { order_id: "${o_id}", expected_order_version: "${o_v2}" }
              as: ShippingCoordinator
              captures: { r2_res: $.data.reserved_cu_ft, r2_cnt: $.data.assigned_order_count }
            - call: "GET /kcma/delivery-routes?status=PLANNED"
              as: ShippingCoordinator
          assert:
            - "after first assign: R1.reserved_cu_ft == 50.0"
            - "after superseding assign: R2.reserved_cu_ft == 50.0 and R2.assigned_order_count == 1"
            - "R1.reserved_cu_ft == 0.0 and R1.assigned_order_count == 0 (compensation exact)"
            - "invariant: R1.reserved_cu_ft + R2.reserved_cu_ft == 50.0 == Order.cube_ft at every step"
            - "Order.${o_id}.delivery_route_id == ${r2_id}"

      - name: batch_door_count_conserved_under_qc_fail_and_reassign
        grounds:
          - state_machines.FinishBatch.MIXING_to_FAILED
          - entities.FinishBatch.fields.assigned_door_count
          - state_machines.OrderHold.PLACED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity: total assigned door count across batches equals
          the qty of assigned non-cancelled DOOR lines. Assign (30) followed by
          its compensating action (QC fail unassigns all) returns the global sum
          to 0; reassignment to a fresh batch restores 30 — no drift in
          assigned_door_count across the cascade. Different conserved quantity
          (door count) than route cube.
        test_recipe:
          setup:
            - "Dealer L3 credit high; DoorStyle DS; FinishSpec FS tol 1.5"
            - "Order O SUBMITTED with DOOR line qty 30"
            - "Batch B1 capacity 50 for FS; line assigned (assigned_door_count 30; O IN_PRODUCTION)"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/door-styles"
              payload: { style_code: "DS-SHK", name: "Shaker", construction: "SHAKER", base_list_price_cents: 30000 }
              as: PlantAdmin
              captures: { ds_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-SAT-10", color_name: "Oak Satin", sheen: "SATIN", upcharge_pct: 0.10, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "DOOR", door_style_id: "${ds_id}", finish_id: "${fs_id}", width_in: 15, height_in: 30, depth_in: 1, qty: 30, unit_list_price_cents: 30000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { ol_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/finish-batches"
              payload: { finish_id: "${fs_id}", sheen_lot_no: "LOT-1", capacity_doors: 50 }
              as: FinishSupervisor
              captures: { b1_id: $.data.id }
            - call: "POST /kcma/finish-batches/${b1_id}/assign"
              payload: { order_line_id: "${ol_id}" }
              as: FinishSupervisor
              captures: { b1_cnt: $.data.assigned_door_count }
            - call: "POST /kcma/finish-batches"
              payload: { finish_id: "${fs_id}", sheen_lot_no: "LOT-2", capacity_doors: 50 }
              as: FinishSupervisor
              captures: { b2_id: $.data.id }
          trigger:
            - call: "POST /kcma/finish-batches/${b1_id}/qc-record"
              payload: { measured_delta_e: 2.4 }
              as: FinishSupervisor
              captures: { b1_status: $.data.status, b1_cnt_after: $.data.assigned_door_count }
            - call: "POST /kcma/finish-batches/${b2_id}/assign"
              payload: { order_line_id: "${ol_id}" }
              as: FinishSupervisor
              captures: { b2_cnt: $.data.assigned_door_count }
            - call: "GET /kcma/orders/${o_id}"
              as: FinishSupervisor
              captures: { o_hold: $.data.hold_status, o_status: $.data.status }
          assert:
            - "after assign: B1.assigned_door_count == 30"
            - "after QC fail: B1.status == FAILED and B1.assigned_door_count == 0 (compensation exact, global sum 0)"
            - "after reassign to B2: B2.assigned_door_count == 30 (global sum restored to 30 == line qty)"
            - "FINISH_QC hold auto-released once the order's last unassigned DOOR line was reassigned: Order.${o_id}.hold_status == NONE"
            - "Order.${o_id}.status == IN_PRODUCTION (auto-transition re-fired after hold release + assignment)"
