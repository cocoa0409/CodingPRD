      - name: retention_expiry_outranks_the_reconstruction_window
        claim_type: priority_conflict
        grounds:
          - validations[24].ERR_RETENTION_PERIOD_EXPIRED
          - validations[25].ERR_RECONSTRUCTION_WINDOW_CLOSED
          - endpoints[POST /apportionment/_clock/set_current_utc]
        distinguishing_aspect: "At 2026-11-01 the trip is 143 days old — past the 120-day reconstruction window but inside the 1460-day retention period — so rule 25 fires; at 2031-01-01 it is 1665 days old and both rules are violated, and priority 24 wins with ERR_RETENTION_PERIOD_EXPIRED."
        test_recipe:
          setup:
            - "A GAP_FLAGGED trip ending 2026-06-10T18:00:00Z (predecessor ends at odometer 1000.0, flagged trip 1100.0 -> 1400.0)."
            - "The logical clock is advanced explicitly between the two attempts."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-101", vin: "1FUJA6CK21L101101", weight_group_code: "W80", factory_price_amount: 145000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-04-05T06:00:00Z", trip_end_utc: "2026-04-05T18:00:00Z", start_odometer: 700.0, end_odometer: 1000.0, legs: [ { jurisdiction_code: "IL", leg_miles: 300.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-06-10T06:00:00Z", trip_end_utc: "2026-06-10T18:00:00Z", start_odometer: 1100.0, end_odometer: 1400.0, legs: [ { jurisdiction_code: "IL", leg_miles: 300.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { t_gap_id: $.data.id }
            - call: "POST /apportionment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /apportionment/trip-records/${t_gap_id}/reconstruct"
              payload: { reconstructed_legs: [ { jurisdiction_code: "IL", leg_miles: 400.0 } ], supporting_document_reference: "FUEL-LOG-88" }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { err_window_id: "$.data.error_id" }
            - call: "POST /apportionment/_clock/set_current_utc"
              payload: { to_iso8601: "2031-01-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/trip-records/${t_gap_id}/reconstruct"
              payload: { reconstructed_legs: [ { jurisdiction_code: "IL", leg_miles: 400.0 } ], supporting_document_reference: "FUEL-LOG-88" }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { err_retention_id: "$.data.error_id" }
          assert:
            - "First reconstruct at 2026-11-01 (143 days after trip_end): HTTP 422 and body.data.error_id == 'ERR_RECONSTRUCTION_WINDOW_CLOSED'"
            - "Second reconstruct at 2031-01-01 (1665 days after trip_end): HTTP 422 and body.data.error_id == 'ERR_RETENTION_PERIOD_EXPIRED' — priority 24 beats priority 25"
            - "TripRecord.${t_gap_id}.trip_status == GAP_FLAGGED and mileage_source == TELEMATICS after both attempts"
            - "TripRecord.${t_gap_id}.accepted_leg_miles_total == 0.0"

