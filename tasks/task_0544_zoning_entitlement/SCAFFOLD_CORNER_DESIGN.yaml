  - section: rbac
    instances:
      - name: applicant_cannot_record_completeness
        claim_type: unauthorized_role
        grounds: [roles, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "An Applicant calling POST /applications/{id}/completeness (a Planner-exclusive op) -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A VARIANCE application SUBMITTED."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "R-1", zoning_district: "RES", area_acres: 2, neighbor_parcel_count: 4, expanded_neighbor_count: 8, sensitive_area: false }
              as: Admin
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Ro One", email: "ro1@x.com" }
              as: Admin
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { application_type: "VARIANCE", parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", requested_use: "x" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
