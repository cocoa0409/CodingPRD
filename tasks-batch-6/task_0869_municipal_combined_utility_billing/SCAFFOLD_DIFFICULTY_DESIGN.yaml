            - "Bill.${b2_id}.total_due_cents == 2891"

      - name: mark_delinquent_grace_boundary_21_days
        grounds:
          - state_machines.Bill.CURRENT_to_DELINQUENT
          - calculations.delinquent_balance
          - errors[ERR_NOT_YET_DELINQUENT]
        distinguishing_aspect: |
          A bill due 2026-05-21 cannot be marked delinquent at 2026-06-10 (20 days,
          ERR_NOT_YET_DELINQUENT) but can at 2026-06-11 (exactly 21 days, >= grace);
          a day-count boundary reached through POST /bills/{id}/mark-delinquent.
        test_recipe:
          setup:
            - "Account with WATER meter read 9500 and an UNPAID bill period ending 2026-05-01 (due 2026-05-21)."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
