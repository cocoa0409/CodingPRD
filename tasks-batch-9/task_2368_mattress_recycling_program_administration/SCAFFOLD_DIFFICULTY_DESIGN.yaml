  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: contamination_pct_exactly_five_percent_partially_accepted
        grounds:
          - calculations.load_inspection_disposition
          - entities.LoadInspection.fields.contamination_pct
          - entities.LoadInspection.fields.disposition
        distinguishing_aspect: |
          The MAX_CONTAMINATION_PCT comparison is strictly greater-than on the 2-decimal rounded value:
          12 of 240 units is exactly 5.00 and must yield PARTIAL_ACCEPT with units_accepted 228, no
          strike and no quarantine, whereas 13 of 240 (5.42) is a FULL_REJECT.
        test_recipe:
          setup:
            - "WA program, ENROLLED NORTH site with 510 on-hand units, NORTH hauler, CERTIFIED recycler."
            - "A 240-unit load delivered in full (fulfillment DELIVERED, settlement ESTIMATED)."
