  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: barge_cleanliness_axis_advances_while_operational_axis_holds_then_reverses
        grounds:
          - state_machines.Barge.IDLE_to_IDLE
          - state_machines.Barge.IDLE_to_FLEETED
          - entities.Barge.fields.cleanliness_status
          - entities.Barge.fields.operational_status
          - calculations.cleaning_requirement_and_fee
        distinguishing_aspect: |
          Barge carries two INDEPENDENT state axes: completing a cleaning order moves
          cleanliness_status DIRTY -> STEAM_CERTIFIED while operational_status stays
          IDLE, and the very next fleeting reservation moves operational_status
          IDLE -> FLEETED while cleanliness_status stays STEAM_CERTIFIED. Neither
          transition is reachable from the other axis.
        test_recipe:
          setup:
            - "Commodities CORN (GRAIN) and UAN32 (FERTILIZER); a compatibility rule saying FERTILIZER followed by GRAIN needs STEAM_CERT and is not prohibited."
            - "Barge BL-2001 registered DIRTY with UAN32 as its last cargo, so it is IDLE on the operational axis and DIRTY on the cleanliness axis."
            - "Fleeting berth Cairo Harbor with capacity 4, 15000 cents per barge-day and a 60000-cent switch fee."
            - "A cleaning order for CORN raised on BL-2001 and started, so it is IN_PROGRESS with required_cleaning_level STEAM_CERT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: WaterwayAdmin
            - call: "POST /commodities"
              payload: { code: "CORN", commodity_group: "GRAIN", residue_class: "CLEAN", hazard_flag: false, stowage_factor: 1.28 }
              as: WaterwayAdmin
              captures: { corn_id: $.data.id }
            - call: "POST /commodities"
              payload: { code: "UAN32", commodity_group: "FERTILIZER", residue_class: "TOXIC", hazard_flag: true, stowage_factor: 0.85 }
              as: WaterwayAdmin
              captures: { uan_id: $.data.id }
            - call: "POST /compatibility-rules"
              payload: { prior_commodity_group: "FERTILIZER", next_commodity_group: "GRAIN", required_cleaning_level: "STEAM_CERT", prohibited: false }
              as: WaterwayAdmin
            - call: "POST /barges"
              payload: { hull_number: "BL-2001", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0, cleanliness_status: "DIRTY", last_cargo_commodity_id: "${uan_id}" }
              as: WaterwayAdmin
              captures: { bx_id: $.data.id }
            - call: "POST /fleeting-berths"
              payload: { harbor_name: "Cairo Harbor", river_mile: 955.0, capacity_barges: 4, daily_fee_cents_per_barge: 15000, switch_fee_cents: 60000 }
              as: WaterwayAdmin
              captures: { fb_id: $.data.id }
            - call: "POST /barges/${bx_id}/cleaning-orders"
              payload: { required_for_commodity_id: "${corn_id}" }
              as: HarborAgent
              captures: { co_id: $.data.id }
            - call: "POST /cleaning-orders/${co_id}/start"
              payload: {}
              as: HarborAgent
          trigger:
            - call: "POST /cleaning-orders/${co_id}/complete"
              payload: { performed_level: "STEAM_CERT", certificate_number: "CERT-77", inspection_passed: true }
              as: HarborAgent
            - call: "POST /fleeting-assignments"
              payload: { barge_id: "${bx_id}", fleeting_berth_id: "${fb_id}", start_at: "2026-08-18T00:00:00Z", end_at: "2026-08-20T00:00:00Z" }
              as: HarborAgent
              captures: { fa_id: $.data.id }
          assert:
            - "CleaningOrder.${co_id}.required_cleaning_level == STEAM_CERT"
            - "CleaningOrder.${co_id}.status == COMPLETED and CleaningOrder.${co_id}.fee_cents == 420000"
            - "immediately after the completion call Barge.${bx_id}.cleanliness_status == STEAM_CERTIFIED while Barge.${bx_id}.operational_status == IDLE"
            - "Barge.${bx_id}.last_cleaning_certificate_number == \"CERT-77\""
            - "after the fleeting call Barge.${bx_id}.operational_status == FLEETED while Barge.${bx_id}.cleanliness_status is still STEAM_CERTIFIED"
            - "FleetingBerth.${fb_id}.occupied_barge_count == 1"
            - "FleetingAssignment.${fa_id}.estimated_fee_cents == 90000 and FleetingAssignment.${fa_id}.fee_cents == 0"

      - name: cargo_claim_review_cycle_repeats_until_revision_limit_blocks_it
