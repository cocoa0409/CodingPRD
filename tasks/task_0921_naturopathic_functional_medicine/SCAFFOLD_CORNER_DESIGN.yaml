              captures: { enc_id: $.data.id, billing: $.data.billing_status }
            - call: "GET /patients/${pt_id}/memberships"
              payload: {}
              as: PracticeAdmin
              captures: { consumed_now: "$.data[0].visits_consumed" }
          assert:
            - "${billing} == ENTITLEMENT_RESERVED in the creation response itself"
            - "Encounter.${enc_id}.entitlement_consumed == true"
            - "${consumed_now} == 1"
            - "Membership.${mem_id}.visits_remaining == 3"
            - "Membership.${mem_id}.visits_granted == 4"
            - "Membership.${mem_id}.visits_forfeited == 0"

  - section: consistency_model
    instances:

      - name: five_link_unfreeze_is_fully_applied_before_the_acknowledge_response_returns
        claim_type: immediate
        grounds:
          - state_machines.Referral.SENT_to_ACKNOWLEDGED
          - entities.Patient.fields.clinical_write_gate
          - entities.Protocol.fields.advancement_blocked
          - entities.ProtocolItem.fields.titration_locked
        distinguishing_aspect: "Under the immediate consistency model the whole unfreeze chain lands inside the acknowledge request: the very next titration decision succeeds, which is only possible if the gate, the protocol flag and the item flag were all cleared already."
        test_recipe:
          setup:
            - "An OR patient with four attested sections, an ACTIVE protocol with one item, and a critical lab result that froze the chart"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "CHIEF_COMPLAINT_TIMELINE", payload_summary: "fatigue" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { s1: $.data.id }
            - call: "POST /intake-sections/${s1}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "SYSTEMS_REVIEW", payload_summary: "sleep" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { s2: $.data.id }
            - call: "POST /intake-sections/${s2}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "MEDICATIONS_SUPPLEMENTS", payload_summary: "none" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { s3: $.data.id }
            - call: "POST /intake-sections/${s3}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "DIET_LIFESTYLE", payload_summary: "whole food" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { s4: $.data.id }
            - call: "POST /intake-sections/${s4}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /dispensary-products"
              payload: { sku: "MAG-GLY-400", name: "Magnesium Glycinate", supplement_class: "VITAMIN_MINERAL", retail_price_cents: 4995, practitioner_cost_cents: 3000 }
              as: PracticeAdmin
              captures: { prod_id: $.data.id }
            - call: "GET /patients/${pt_id}"
              payload: {}
              as: PracticeAdmin
              captures: { pt_v: $.data.version }
            - call: "POST /protocols"
              payload: { patient_id: "${pt_id}", title: "Repletion", symptom_score_baseline: 28, expected_patient_version: "${pt_v}" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /protocols/${proto_id}/items"
              payload: { product_id: "${prod_id}", dose_amount_mg: 400, frequency_per_day: 1, duration_days: 60, titration_interval_days: 14 }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { item_id: $.data.id }
            - call: "POST /protocols/${proto_id}/issue"
              payload: {}
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
            - call: "POST /protocols/${proto_id}/activate"
              payload: {}
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
            - call: "POST /lab-orders"
              payload: { patient_id: "${pt_id}", panel_code: "SERUM_METABOLIC", funding_source: "CASH", requested_collection_date: "2026-05-04", fasting_attested: true }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { lo_id: $.data.id }
            - call: "POST /lab-orders/${lo_id}/collect"
              payload: {}
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
            - call: "POST /lab-orders/${lo_id}/results"
              payload: { analyte_code: "K", value: 12.0, unit: "mmol/L", standard_low: 3.5, standard_high: 5.2, optimal_low: 4.0, optimal_high: 4.8, critical_low: 2.5, critical_high: 10.0 }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
            - call: "GET /referrals"
              payload: { referral_type: "RED_FLAG_AUTO" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { ref_id: "$.data[0].id" }
          trigger:
            - call: "POST /referrals/${ref_id}/transitions"
              payload: { action: "ACKNOWLEDGE" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
            - call: "POST /protocol-items/${item_id}/titration-decisions"
              payload: { current_symptom_score: 20 }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
          assert:
            - "Patient.${pt_id}.clinical_write_gate == OPEN"
            - "Patient.${pt_id}.red_flag_referral_open == false"
            - "Protocol.${proto_id}.advancement_blocked == false"
            - "ProtocolItem.${item_id}.titration_locked == false"
            - "The titration decision returned 200 with last_decision ADVANCE and dose_amount_mg 500"
            - "ProtocolItem.${item_id}.dose_amount_mg == 500"
