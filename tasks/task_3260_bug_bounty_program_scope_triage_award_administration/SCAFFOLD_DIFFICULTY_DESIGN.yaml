scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: severity_base_vs_environmental_divergence
        grounds:
          - calculations.severity_score
          - entities.Report.fields.severity_score_base
          - entities.Report.fields.severity_score_adjusted
        distinguishing_aspect: |
          Report domain: the raw_base variant (0.5*9+0.3*8+0.2*5 = 7.9, bands HIGH)
          diverges from the environmental variant (7.9 * 1.2 * 1.0 = 9.48 -> 9.5, bands
          CRITICAL); severity_final derives from the environmental variant only, so the
          same inputs produce two stored scores in different severity bands.
        test_recipe:
          setup:
            - "ACTIVE public program P (exposure_modifier 1.0) with CRITICAL asset A in the effective scope version"
            - "researcher R registered"
            - "report submitted by R against A"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /api/assets"
              payload: { program_id: "${prog}", name: "Core API", asset_identifier: "api.example.com", criticality: "CRITICAL" }
              as: ProgramAdmin
              captures: { asset: $.data.id }
            - call: "POST /api/scope-versions"
              payload: { program_id: "${prog}", effective_from: "2026-01-01T00:00:00Z", in_scope_asset_ids: ["${asset}"] }
              as: ProgramAdmin
            - call: "POST /api/programs/${prog}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/researchers"
              payload: { handle: "r1", email: "r1@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "t", description: "d", vulnerability_class: "RCE" }
              as: Researcher
              as_user_id: "${res}"
              captures: { rep: $.data.id }
            - call: "POST /api/reports/${rep}/triage"
              payload: { action: "TRIAGE" }
              as: Triager
          trigger:
            - call: "POST /api/reports/${rep}/validate"
              payload: { impact: 9, exploitability: 8, affected_scope: 5 }
              as: Triager
          assert:
            - "Report.${rep}.severity_score_base == 7.9"
            - "Report.${rep}.severity_score_adjusted == 9.5"
            - "Report.${rep}.severity_final == CRITICAL"
            - "Report.${rep}.status == VALIDATED"

      - name: reputation_lifetime_vs_rolling180_divergence
        grounds:
          - calculations.reputation_delta
          - calculations.invitation_expiry
          - entities.Researcher.fields.reputation_lifetime
          - entities.Researcher.fields.reputation_rolling180
        distinguishing_aspect: |
          Researcher domain (distinct from the Report severity instance): the lifetime
          variant keeps the +100 CRITICAL-resolution delta earned 2026-01-01 (== 200),
          while the rolling180 variant drops it after the 180-day window (== 100), so
          invitation eligibility (lifetime >= 150) passes while tier stays NOVICE.
        test_recipe:
          setup:
            - "clock at 2026-01-01T00:00:00Z; ACTIVE program with min_reputation 150 and CRITICAL asset in scope"
            - "researcher R; CRITICAL report validated and RESOLVED via remediation ticket (reputation +100 at 2026-01-01)"
            - "clock advanced to 2026-09-01T00:00:00Z (delta older than 180 days)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 5000000, min_reputation: 150, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /api/assets"
              payload: { program_id: "${prog}", name: "A", asset_identifier: "a.example.com", criticality: "CRITICAL" }
              as: ProgramAdmin
              captures: { asset: $.data.id }
            - call: "POST /api/scope-versions"
              payload: { program_id: "${prog}", effective_from: "2026-01-01T00:00:00Z", in_scope_asset_ids: ["${asset}"] }
              as: ProgramAdmin
            - call: "POST /api/programs/${prog}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/researchers"
              payload: { handle: "r2", email: "r2@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "t", description: "d", vulnerability_class: "RCE" }
              as: Researcher
              as_user_id: "${res}"
              captures: { rep: $.data.id }
            - call: "POST /api/reports/${rep}/triage"
              payload: { action: "TRIAGE" }
              as: Triager
            - call: "POST /api/reports/${rep}/validate"
              payload: { impact: 9, exploitability: 8, affected_scope: 5 }
              as: Triager
            - call: "POST /api/remediation-tickets"
              payload: { report_id: "${rep}", external_ref: "ENG-1" }
              as: ProgramAdmin
              captures: { tick: $.data.id }
            - call: "POST /api/remediation-tickets/${tick}/transition"
              payload: { action: "START" }
              as: ProgramAdmin
            - call: "POST /api/remediation-tickets/${tick}/transition"
              payload: { action: "FIX" }
              as: ProgramAdmin
            - call: "POST /api/remediation-tickets/${tick}/transition"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/researchers/${res}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/invitations"
              payload: { program_id: "${prog}", researcher_id: "${res}" }
              as: ProgramAdmin
          assert:
            - "Researcher.${res}.reputation_lifetime == 200"
            - "Researcher.${res}.reputation_rolling180 == 100"
            - "Researcher.${res}.tier == NOVICE"
            - "invitation creation succeeds (201) because lifetime 200 >= min_reputation 150"

  - rule_id: combinatorial_formula
    instances:
      - name: bounty_amount_capped_by_remaining_pool
        grounds:
          - calculations.bounty_amount
          - entities.Award.fields.capped_by_pool
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — SEVERITY_BASE[CRITICAL]
          1000000 x CRIT_MULT[CRITICAL] 2.0 = 2000000 raw, + first-report bonus 0.10
          (NOVICE tier adds 0) = 200000 bonus, then nested min() against the remaining
          pool 2100000 caps the payable amount at 2100000 and sets capped_by_pool.
        test_recipe:
          setup:
            - "ACTIVE public program with bounty_pool_cents 2100000, CRITICAL asset in scope"
            - "researcher R (NOVICE); report validated CRITICAL (9/8/5 on CRITICAL asset); first validated report"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 2100000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /api/assets"
              payload: { program_id: "${prog}", name: "A", asset_identifier: "a.example.com", criticality: "CRITICAL" }
              as: ProgramAdmin
              captures: { asset: $.data.id }
            - call: "POST /api/scope-versions"
              payload: { program_id: "${prog}", effective_from: "2026-01-01T00:00:00Z", in_scope_asset_ids: ["${asset}"] }
              as: ProgramAdmin
            - call: "POST /api/programs/${prog}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/researchers"
              payload: { handle: "r3", email: "r3@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "t", description: "d", vulnerability_class: "SQLI" }
              as: Researcher
              as_user_id: "${res}"
              captures: { rep: $.data.id }
            - call: "POST /api/reports/${rep}/triage"
              payload: { action: "TRIAGE" }
              as: Triager
            - call: "POST /api/reports/${rep}/validate"
              payload: { impact: 9, exploitability: 8, affected_scope: 5 }
              as: Triager
          trigger:
            - call: "POST /api/awards"
              payload: { report_id: "${rep}", award_type: "BOUNTY" }
              as: Triager
              captures: { aw: $.data.id }
          assert:
            - "Award.${aw}.amount_cents == 2100000"
            - "Award.${aw}.capped_by_pool == true"
            - "Award.${aw}.status == PROPOSED"

      - name: withholding_per_award_rounding_vs_aggregate
        grounds:
          - calculations.withholding_amount
          - entities.Program.fields.total_withheld_cents
          - entities.Award.fields.withheld_cents
        distinguishing_aspect: |
          Mode (b) nested rounding (distinct from mode (a)): rounding order pinned as
          per-award round_half_up then sum — awards 10101 and 10202 at 24% backup
          withholding yield 2424 + 2448 = 4872, while the aggregate-then-round order
          would yield round(20303 * 0.24) = 4873.
        test_recipe:
          setup:
            - "ACTIVE public program (bonus_cap_cents default 100000, pool 5000000), MEDIUM asset in scope"
            - "researcher R with tax_document_status SUBMITTED (not verified) -> 24% backup withholding"
            - "two VALIDATED LOW reports rep1, rep2 by R; two BONUS awards of 10101 and 10202, both APPROVED"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /api/assets"
              payload: { program_id: "${prog}", name: "A", asset_identifier: "a.example.com", criticality: "MEDIUM" }
              as: ProgramAdmin
              captures: { asset: $.data.id }
            - call: "POST /api/scope-versions"
              payload: { program_id: "${prog}", effective_from: "2026-01-01T00:00:00Z", in_scope_asset_ids: ["${asset}"] }
              as: ProgramAdmin
            - call: "POST /api/programs/${prog}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/researchers"
              payload: { handle: "r4", email: "r4@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/researchers/${res}/tax-documents"
              payload: { document_type: "W9" }
              as: Researcher
              as_user_id: "${res}"
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "t1", description: "d", vulnerability_class: "XSS" }
              as: Researcher
              as_user_id: "${res}"
              captures: { rep1: $.data.id }
            - call: "POST /api/reports/${rep1}/triage"
              payload: { action: "TRIAGE" }
              as: Triager
            - call: "POST /api/reports/${rep1}/validate"
              payload: { impact: 2, exploitability: 2, affected_scope: 2 }
              as: Triager
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "t2", description: "d", vulnerability_class: "CSRF" }
              as: Researcher
              as_user_id: "${res}"
              captures: { rep2: $.data.id }
            - call: "POST /api/reports/${rep2}/triage"
              payload: { action: "TRIAGE" }
              as: Triager
            - call: "POST /api/reports/${rep2}/validate"
              payload: { impact: 2, exploitability: 2, affected_scope: 2 }
              as: Triager
            - call: "POST /api/awards"
              payload: { report_id: "${rep1}", award_type: "BONUS", amount_cents: 10101 }
              as: Triager
              captures: { aw1: $.data.id }
            - call: "POST /api/awards/${aw1}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/awards"
              payload: { report_id: "${rep2}", award_type: "BONUS", amount_cents: 10202 }
              as: Triager
              captures: { aw2: $.data.id }
            - call: "POST /api/awards/${aw2}/approve"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /api/awards/${aw1}/pay"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/awards/${aw2}/pay"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/programs/${prog}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Award.${aw1}.withheld_cents == 2424"
            - "Award.${aw1}.net_paid_cents == 7677"
            - "Award.${aw2}.withheld_cents == 2448"
            - "Award.${aw2}.net_paid_cents == 7754"
            - "Program.${prog}.total_withheld_cents == 4872"

  - rule_id: non_linear_state_machine
    instances:
      - name: report_duplicate_reopen_cycle
        grounds:
          - state_machines.Report.DUPLICATE_to_TRIAGED
          - calculations.reputation_delta
        distinguishing_aspect: |
          Report entity: TRIAGED -> DUPLICATE -> TRIAGED is a revert cycle (not a
          linear pipeline); the -10 duplicate reputation penalty is applied on
          MARK_DUPLICATE and exactly compensated (+10) on REOPEN.
        test_recipe:
          setup:
            - "ACTIVE public program, CRITICAL asset in scope, researcher R (reputation 100)"
            - "anchor report repA by R validated (VALIDATED, class XSS)"
            - "second report repB by R, class XSS, TRIAGED"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /api/assets"
              payload: { program_id: "${prog}", name: "A", asset_identifier: "a.example.com", criticality: "CRITICAL" }
              as: ProgramAdmin
              captures: { asset: $.data.id }
            - call: "POST /api/scope-versions"
              payload: { program_id: "${prog}", effective_from: "2026-01-01T00:00:00Z", in_scope_asset_ids: ["${asset}"] }
              as: ProgramAdmin
            - call: "POST /api/programs/${prog}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/researchers"
              payload: { handle: "r5", email: "r5@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "anchor", description: "d", vulnerability_class: "XSS" }
              as: Researcher
              as_user_id: "${res}"
              captures: { repA: $.data.id }
            - call: "POST /api/reports/${repA}/triage"
              payload: { action: "TRIAGE" }
              as: Triager
            - call: "POST /api/reports/${repA}/validate"
              payload: { impact: 5, exploitability: 5, affected_scope: 5 }
              as: Triager
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "dupe", description: "d", vulnerability_class: "XSS" }
              as: Researcher
              as_user_id: "${res}"
              captures: { repB: $.data.id }
            - call: "POST /api/reports/${repB}/triage"
              payload: { action: "TRIAGE" }
              as: Triager
          trigger:
            - call: "POST /api/reports/${repB}/triage"
              payload: { action: "MARK_DUPLICATE", duplicate_of_id: "${repA}" }
              as: Triager
            - call: "POST /api/reports/${repB}/triage"
              payload: { action: "REOPEN" }
              as: Triager
            - call: "GET /api/researchers/${res}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Report.${repB}.status == TRIAGED"
            - "Report.${repB}.duplicate_of_id == null"
            - "Researcher.${res}.reputation_lifetime == 100"

      - name: award_approved_blocked_paid_cycle
        grounds:
          - state_machines.Award.APPROVED_to_BLOCKED
          - state_machines.Award.BLOCKED_to_PAID
          - calculations.withholding_amount
        distinguishing_aspect: |
          Award entity (distinct from Report): APPROVED -> BLOCKED -> PAID is a cycle
          out of a penalty state — a pay attempt with MISSING tax docs on an award
          >= 60000 cents blocks the award (TAX_DOCUMENT), and a retry after the
          researcher submits tax documents completes the payment with 24% withholding.
        test_recipe:
          setup:
            - "ACTIVE public program, CRITICAL asset, researcher R tax MISSING"
            - "report validated MEDIUM (6/5/4 on CRITICAL asset -> 6.4); BOUNTY award = 150000*2.0*1.10 = 330000 (>= 60000), APPROVED"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /api/assets"
              payload: { program_id: "${prog}", name: "A", asset_identifier: "a.example.com", criticality: "CRITICAL" }
              as: ProgramAdmin
              captures: { asset: $.data.id }
            - call: "POST /api/scope-versions"
              payload: { program_id: "${prog}", effective_from: "2026-01-01T00:00:00Z", in_scope_asset_ids: ["${asset}"] }
              as: ProgramAdmin
            - call: "POST /api/programs/${prog}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/researchers"
              payload: { handle: "r6", email: "r6@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "t", description: "d", vulnerability_class: "SSRF" }
              as: Researcher
              as_user_id: "${res}"
              captures: { rep: $.data.id }
            - call: "POST /api/reports/${rep}/triage"
              payload: { action: "TRIAGE" }
              as: Triager
            - call: "POST /api/reports/${rep}/validate"
              payload: { impact: 6, exploitability: 5, affected_scope: 4 }
              as: Triager
            - call: "POST /api/awards"
              payload: { report_id: "${rep}", award_type: "BOUNTY" }
              as: Triager
              captures: { aw: $.data.id }
            - call: "POST /api/awards/${aw}/approve"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /api/awards/${aw}/pay"
              payload: {}
              as: PlatformAdmin
              captures: { pay_err: $.data.error_id }
            - call: "POST /api/researchers/${res}/tax-documents"
              payload: { document_type: "W9" }
              as: Researcher
              as_user_id: "${res}"
            - call: "POST /api/awards/${aw}/pay"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/programs/${prog}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "first pay rejected: ${pay_err} == ERR_TAX_DOC_REQUIRED"
            - "Award.${aw} transitions APPROVED -> BLOCKED with block_reason == TAX_DOCUMENT after the rejected pay"
            - "second pay succeeds: Award.${aw}.status == PAID, block_reason == null"
            - "Award.${aw}.withheld_cents == 79200"
            - "Award.${aw}.net_paid_cents == 250800"
            - "Program.${prog}.bounty_paid_cents == 330000 and bounty_reserved_cents == 0"

  - rule_id: transitive_cascade
    instances:
      - name: ticket_verify_cascades_report_resolve_and_tier_crossing
        grounds:
          - state_machines.RemediationTicket.FIXED_to_VERIFIED
          - state_machines.Report.VALIDATED_to_RESOLVED
          - calculations.reputation_delta
        distinguishing_aspect: |
          Depth-3 chain from the ticket VERIFY trigger: ticket FIXED -> VERIFIED
          mutates Report (VALIDATED -> RESOLVED), whose resolution mutates Researcher
          (reputation +100 CRITICAL then +50 HIGH), whose reputation recompute flips
          tier NOVICE -> ESTABLISHED exactly at the 250 boundary.
        test_recipe:
          setup:
            - "ACTIVE public program, CRITICAL asset, researcher R (100 points)"
            - "rep1 validated CRITICAL and RESOLVED (R at 200); rep2 validated HIGH (8.8) with ticket t2 in FIXED"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
