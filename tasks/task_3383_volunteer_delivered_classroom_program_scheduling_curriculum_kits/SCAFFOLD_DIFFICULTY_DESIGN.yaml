        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: required_kits pins per-session rounding
          then summation — enrolled 27 with session_count 5 gives 3 + 5*ceil(27*0.2) = 3 + 5*6 = 33;
          the alternative sum-then-round order would give 3 + ceil(27*0.2*5) = 30. The scaffold pins 33.
