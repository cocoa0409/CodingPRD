          assert:
            - "before the trigger the dealer is ACTIVE with credit_committed_cents 3999468 and credit_available_cents 896000532"
            - "lowering the limit to 3999467 returns HTTP 200 with status CREDIT_HOLD, credit_committed_cents still 3999468 and credit_available_cents -1 - the available figure is allowed to go negative and is not clamped at 0"
            - "both O1 and O2 are production_status HOLD_CREDIT after that single call, and each still reports credit_hold_cents 1999734 - the cascade moves states, not money"
            - "lowering the limit again to 1000000 returns HTTP 200 with status still CREDIT_HOLD and credit_available_cents -2999468, and O2.version is UNCHANGED across that call - an order already in HOLD_CREDIT is not re-cascaded"
