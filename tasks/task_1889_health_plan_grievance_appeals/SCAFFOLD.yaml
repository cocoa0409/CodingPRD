scenario: |
  1889. Health Plan Grievance & Appeals (Medicare/Medicaid): case intake &
  classification (grievance/organization determination/appeal), timeframe by
  expedited vs standard, clinical review & medical director determination,
  member/provider notification content requirements, independent review entity
  forwarding & effectuation, reopening & effectuation compliance tracking,
  CTM (complaint tracking) linkage, audit universe reporting

domain_name: health-plan-grievance-appeals
api_prefix: /appeals

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: member_ref
        type: string
        source: input
        description: "Plan-internal member identifier (e.g. HICN/MBI surrogate); unique across the plan"
        constraints: "unique, non-empty, 1..64 chars"
      - name: full_name
        type: string
        source: input
        description: "Member legal name used in notifications"
      - name: program
        type: enum
        source: input
        description: "Coverage program governing this member"
        constraints: "one of {MEDICARE, MEDI_CAL, DUAL}"
      - name: enrollment_status
        type: enum
        source: system
        description: "Lifecycle of the member record inside the appeals system"
        default: ACTIVE
        constraints: "one of {ACTIVE, DISENROLLED, DECEASED}"
      - name: open_case_count
        type: integer
        source: computed
        description: "Count of GrievanceAppealCase rows for this member whose status is in {RECEIVED, TRIAGED, IN_REVIEW, PENDING_CLINICAL, DECIDED, NOTIFIED, IRE_REFERRED, REOPENED}"
        default: 0
      - name: ctm_linked_case_count
        type: integer
        source: computed
        description: "Count of GrievanceAppealCase rows for this member with ctm_linked == true and status not in {CLOSED, WITHDRAWN}"
        default: 0

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: npi
        type: string
        source: input
        description: "National Provider Identifier; unique"
        constraints: "exactly 10 digits, unique"
      - name: legal_name
        type: string
        source: input
        description: "Provider organization or practitioner name used in notifications"
      - name: contract_status
        type: enum
        source: input
        description: "Whether the provider is contracted (in-network) with the plan"
        constraints: "one of {CONTRACTED, NON_CONTRACTED}"
      - name: w9_on_file
        type: boolean
        source: input
        description: "Whether a W-9 is on file; required before the plan may release payment effectuation"
        default: false

  - name: DeadlinePolicy
    parent: null
    common_fields: true
    fields:
      - name: program
        type: enum
        source: input
        description: "Program this policy applies to"
        constraints: "one of {MEDICARE, MEDI_CAL, DUAL}"
      - name: case_kind
        type: enum
        source: input
        description: "Case classification this policy applies to"
        constraints: "one of {GRIEVANCE, ORG_DETERMINATION, APPEAL}"
      - name: priority_track
        type: enum
        source: input
        description: "Expedited vs standard timeframe family"
        constraints: "one of {STANDARD, EXPEDITED}"
      - name: resolution_hours
        type: integer
        source: input
        description: "Total hours from received_at to resolution due; 0 < resolution_hours <= 720"
        constraints: "0 < value <= 720"
      - name: extension_hours
        type: integer
        source: input
        description: "Additional hours granted when a valid extension reason is applied"
        default: 0
        constraints: "0 <= value <= 336"
      - name: effectuation_hours
        type: integer
        source: input
        description: "Hours from decision_at by which effectuation must complete for a fully favorable decision"
        constraints: "0 < value <= 720"
      - name: business_hours_only
        type: boolean
        source: input
        description: "When true, effectuation_timeliness_calculation uses the business_hours_variant (Mon-Fri 08:00-17:00 UTC consumed hours); default false selects the calendar-hours variant"
        default: false
      - name: active
        type: boolean
        source: input
        description: "Only one policy per (program, case_kind, priority_track) triple may have active=true at a time"
        default: true

  - name: GrievanceAppealCase
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; owning member"
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; rendering/provider-of-record when the case involves a service denial; nullable only for pure grievances"
      - name: case_kind
        type: enum
        source: input
        description: "Intake classification"
        constraints: "one of {GRIEVANCE, ORG_DETERMINATION, APPEAL}"
      - name: priority_track
        type: enum
        source: system
        description: "Derived at classification from expedited_flag and clinical attestation; may be upgraded later via the expedite action"
        default: STANDARD
        constraints: "one of {STANDARD, EXPEDITED}"
      - name: expedited_requested
        type: boolean
        source: input
        description: "Intake flag: requester asked for expedited handling"
        default: false
      - name: expedited_justification
        type: string
        source: input
        description: "Free-text clinical urgency justification required when expedited_requested=true"
      - name: status
        type: enum
        source: system
        description: "Primary workflow state"
        default: RECEIVED
        constraints: "one of {RECEIVED, TRIAGED, IN_REVIEW, PENDING_CLINICAL, DECIDED, NOTIFIED, IRE_REFERRED, REOPENED, CLOSED, WITHDRAWN}"
      - name: decision_outcome
        type: enum
        source: system
        description: "Medical director / reviewer determination; null until DECIDED"
        constraints: "null or one of {FULLY_FAVORABLE, PARTIALLY_FAVORABLE, UNFAVORABLE}"
      - name: received_at
        type: datetime
        source: system
        description: "Server-stamped intake timestamp; basis of all deadline math"
      - name: acknowledged_at
        type: datetime
        source: system
        description: "When the triage officer acknowledged receipt; must be within acknowledgement window"
      - name: decided_at
        type: datetime
        source: system
        description: "When decision_outcome was set"
      - name: notified_at
        type: datetime
        source: system
        description: "When the final decision notification was marked SENT"
      - name: closed_at
        type: datetime
        source: system
        description: "When status entered CLOSED or WITHDRAWN"
      - name: extension_applied
        type: boolean
        source: system
        description: "Whether the one permitted member-requested extension has been consumed"
        default: false
      - name: resolution_due_at
        type: datetime
        source: computed
        description: "Computed by case_deadline_calculation; recomputed on triage, priority upgrade, or extension"
      - name: effectuation_due_at
        type: datetime
        source: computed
        description: "Computed at decision time from DeadlinePolicy.effectuation_hours when decision_outcome != UNFAVORABLE"
      - name: ctm_linked
        type: boolean
        source: system
        description: "Set when an intake case is linked into the Complaint Tracking Module via CaseEvent CTM_LINKED"
        default: false
      - name: reopened_from_case_id
        type: string
        source: input
        description: "FK -> GrievanceAppealCase.id; set when this case was created by a granted reopening of an earlier closed case (self-referential)"
      - name: overdue
        type: boolean
        source: computed
        description: "true when now > resolution_due_at and status not in {CLOSED, WITHDRAWN, IRE_REFERRED}"
        default: false

  - name: CaseEvent
    parent: GrievanceAppealCase
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> GrievanceAppealCase.id; case this event belongs to"
      - name: event_type
        type: enum
        source: input
        description: "Kind of event appended"
        constraints: "one of {NOTE, DOCUMENT, EXTENSION_REQUEST, EXTENSION_GRANTED, CTM_LINKED, CTM_UNLINKED, PRIORITY_UPGRADE, DECISION_RECORDED, NOTIFICATION_SENT, IRE_FORWARDED, REOPEN_REQUESTED, REOPEN_GRANTED, REOPEN_DENIED, EFFECTUATION_STARTED, EFFECTUATION_COMPLETED}"
      - name: actor_role
        type: string
        source: system
        description: "Role captured from X-User-Role at append time"
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID captured at append time"
      - name: body
        type: string
        source: input
        description: "Free-text payload or structured note"
      - name: occurred_at
        type: datetime
        source: system
        description: "Server-stamped event time; chronological replay order uses occurred_at ASC with created_at ASC tie-break"

  - name: ClinicalReview
    parent: GrievanceAppealCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> GrievanceAppealCase.id; case under clinical review"
      - name: reviewer_physician_id
        type: string
        source: input
        description: "Physician reviewer identifier (opaque user id of a MedicalDirector)"
      - name: status
        type: enum
        source: system
        description: "Clinical review lifecycle"
        default: REQUESTED
        constraints: "one of {REQUESTED, ASSIGNED, DETERMINATION_DRAFT, DETERMINED, SUPERSEDED}"
      - name: determination
        type: enum
        source: system
        description: "Medical necessity determination; null until DETERMINED"
        constraints: "null or one of {UPHOLD_SERVICE, OVERTURN_SERVICE, PARTIAL}"
      - name: medical_necessity_score
        type: number
        source: computed
        description: "Computed by medical_necessity_scoring from clinical factor inputs; 0.00-100.00"
      - name: superseded_by_review_id
        type: string
        source: system
        description: "FK -> ClinicalReview.id; set when a later review on the same case supersedes this one (self-referential)"

  - name: Notification
    parent: GrievanceAppealCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> GrievanceAppealCase.id; case this notification concerns"
      - name: recipient_kind
        type: enum
        source: input
        description: "Who receives this notice"
        constraints: "one of {MEMBER, PROVIDER}"
      - name: notification_kind
        type: enum
        source: input
        description: "Regulatory template family"
        constraints: "one of {ACKNOWLEDGEMENT, EXTENSION_NOTICE, DECISION, IRE_FORWARD_NOTICE, REOPEN_OUTCOME, EFFECTUATION_CONFIRMATION}"
      - name: status
        type: enum
        source: system
        description: "Delivery lifecycle"
        default: QUEUED
        constraints: "one of {QUEUED, SENT, DELIVERED, FAILED, RETRIED}"
      - name: required_elements
        type: array
        source: computed
        description: "List of content element keys required for this (notification_kind, recipient_kind, program, case_kind, decision_outcome) tuple per notification_content_matrix"
      - name: supplied_elements
        type: array
        source: input
        description: "Element keys actually present in the rendered notice body"
      - name: completeness_score
        type: number
        source: computed
        description: "Computed by notification_completeness_scoring; 0.00-1.00, round per-element then sum (pinned order)"
      - name: sent_at
        type: datetime
        source: system
        description: "When status first transitioned to SENT"

  - name: IndependentReviewReferral
    parent: GrievanceAppealCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> GrievanceAppealCase.id; source case forwarded to the IRE"
      - name: ire_organization_code
        type: string
        source: input
        description: "Code of the contracted independent review entity"
      - name: status
        type: enum
        source: system
        description: "IRE referral lifecycle"
        default: FORWARDED
        constraints: "one of {FORWARDED, ACKNOWLEDGED_BY_IRE, DECISION_RECEIVED, EFFECTUATED}"
      - name: forwarded_at
        type: datetime
        source: system
        description: "Server-stamped forwarding time; must be within IRE forwarding window of decided_at"
      - name: ire_decision
        type: enum
        source: input
        description: "Outcome returned by the IRE"
        constraints: "null or one of {UPHOLD_PLAN, OVERTURN_PLAN, PARTIAL}"
      - name: ire_decision_received_at
        type: datetime
        source: system
        description: "When the IRE decision was recorded"

  - name: Effectuation
    parent: GrievanceAppealCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> GrievanceAppealCase.id; case being effectuated"
      - name: referral_id
        type: string
        source: input
        description: "FK -> IndependentReviewReferral.id; set when effectuation follows an IRE OVERTURN_PLAN/PARTIAL, else null"
      - name: status
        type: enum
        source: system
        description: "Effectuation lifecycle"
        default: PENDING
        constraints: "one of {PENDING, IN_PROGRESS, EFFECTUATED, OVERDUE, ESCALATED, WAIVED}"
      - name: payment_amount_cents
        type: integer
        source: input
        description: "Payment to release to member or provider; 0 for service-only effectuation"
        constraints: ">= 0"
      - name: timeliness_percent
        type: number
        source: computed
        description: "Computed by effectuation_timeliness_calculation; percentage of the effectuation window consumed at completion, 0.00-100.00, or > 100.00 when overdue"
      - name: completed_at
        type: datetime
        source: system
        description: "When status became EFFECTUATED"

  - name: Reopening
    parent: GrievanceAppealCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> GrievanceAppealCase.id; the closed case being reopened"
      - name: request_reason
        type: enum
        source: input
        description: "Regulatory basis for reopening"
        constraints: "one of {NEW_EVIDENCE, CLERICAL_ERROR, FRAUD_OR_SIMILAR_FAULT}"
      - name: status
        type: enum
        source: system
        description: "Reopening review lifecycle"
        default: REQUESTED
        constraints: "one of {REQUESTED, UNDER_REVIEW, GRANTED, DENIED}"
      - name: requested_at
        type: datetime
        source: system
        description: "Server-stamped request time; must fall inside the reopening window measured from the source case's closed_at"
      - name: decided_at
        type: datetime
        source: system
        description: "When the reopening was granted or denied"
      - name: spawned_case_id
        type: string
        source: system
        description: "FK -> GrievanceAppealCase.id; the new case created when status becomes GRANTED"

  - name: AuditUniverseRecord
    parent: null
    common_fields: false
    fields:
      - name: report_period
        type: string
        source: input
        description: "Period key in YYYY-MM form; with case_id forms the uniqueness scope"
      - name: case_id
        type: string
        source: input
        description: "FK -> GrievanceAppealCase.id; case captured in this snapshot row"
      - name: case_kind
        type: enum
        source: system
        description: "Denormalized from the case at snapshot time"
      - name: priority_track
        type: enum
        source: system
        description: "Denormalized from the case at snapshot time"
      - name: resolution_timely
        type: boolean
        source: system
        description: "Whether decided_at <= resolution_due_at at snapshot time"
      - name: effectuation_timely
        type: boolean
        source: system
        description: "Whether the linked Effectuation completed on or before effectuation_due_at; null when no effectuation is required yet"
      - name: snapshot_at
        type: datetime
        source: system
        description: "Server-stamped snapshot time"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GrievanceAppealCase
    initial_state: RECEIVED
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /appeals/cases/{id}/triage"
        actor: IntakeSpecialist
        preconditions:
          - "Case.status == RECEIVED"
          - "Member.enrollment_status == ACTIVE for the case's member_id"
          - "If case_kind in {ORG_DETERMINATION, APPEAL} then provider_id must reference an existing Provider"
          - "If expedited_requested == true then expedited_justification must be non-empty (checked at intake) and a DeadlinePolicy row with active=true must exist for (member.program, case_kind, EXPEDITED)"
        side_effects:
          - "Set priority_track := EXPEDITED when expedited_requested == true AND case_kind != GRIEVANCE (grievances have no expedited track); else STANDARD"
          - "Set acknowledged_at := now; reject if now - received_at > acknowledgement window (24h standard per policy resolution_hours ordering rule in deadline calc)"
          - "Recompute resolution_due_at via case_deadline_calculation"
          - "Append CaseEvent(event_type=NOTE, body='TRIAGED')"
          - "Increment Case.version by 1"
      - from: TRIAGED
        to: IN_REVIEW
        trigger: "POST /appeals/cases/{id}/begin-review"
        actor: CaseAnalyst
        preconditions:
          - "Case.status == TRIAGED"
        side_effects:
          - "Append CaseEvent(event_type=NOTE, body='REVIEW_STARTED')"
          - "Increment Case.version by 1"
      - from: IN_REVIEW
        to: PENDING_CLINICAL
        trigger: "POST /appeals/cases/{id}/clinical-reviews"
        actor: CaseAnalyst
        preconditions:
          - "Case.status == IN_REVIEW"
          - "No ClinicalReview for this case currently has status in {REQUESTED, ASSIGNED, DETERMINATION_DRAFT} (only one live review at a time)"
        side_effects:
          - "Create ClinicalReview(status=REQUESTED) for the case"
          - "Append CaseEvent(event_type=NOTE, body='CLINICAL_REVIEW_REQUESTED')"
          - "Increment Case.version by 1"
      - from: PENDING_CLINICAL
        to: PENDING_CLINICAL
        trigger: "POST /appeals/cases/{id}/clinical-reviews (replacement review request while case is already in clinical review, e.g. after a prior review reached a terminal state)"
        actor: CaseAnalyst
        preconditions:
          - "Case.status == PENDING_CLINICAL"
          - "No ClinicalReview for this case currently has status in {REQUESTED, ASSIGNED, DETERMINATION_DRAFT} (only one live review at a time)"
        side_effects:
          - "Create ClinicalReview(status=REQUESTED) for the case"
          - "Append CaseEvent(event_type=NOTE, body='CLINICAL_REVIEW_REQUESTED')"
          - "Increment Case.version by 1"
      - from: PENDING_CLINICAL
        to: DECIDED
        trigger: "POST /appeals/cases/{id}/decide (requires a DETERMINED ClinicalReview when the case is PENDING_CLINICAL)"
        actor: MedicalDirector
        preconditions:
          - "Case.status == PENDING_CLINICAL"
          - "Exists ClinicalReview for this case with status == DETERMINED"
          - "Segregation of duties: X-User-ID of decider must differ from the IntakeSpecialist who performed triage on this case"
          - "decision_outcome payload value in {FULLY_FAVORABLE, PARTIALLY_FAVORABLE, UNFAVORABLE}"
        side_effects:
          - "Set decision_outcome, decided_at := now"
          - "Compute effectuation_due_at via DeadlinePolicy.effectuation_hours when decision_outcome != UNFAVORABLE; else null"
          - "Append CaseEvent(event_type=DECISION_RECORDED)"
          - "When decision_outcome != UNFAVORABLE: create Effectuation(status=PENDING, payment_amount_cents from payload)"
          - "Increment Case.version by 1"
      - from: IN_REVIEW
        to: DECIDED
        trigger: "POST /appeals/cases/{id}/decide (non-clinical path; only when case_kind == GRIEVANCE)"
        actor: CaseAnalyst
        preconditions:
          - "Case.status == IN_REVIEW"
          - "case_kind == GRIEVANCE (non-grievance kinds MUST route through PENDING_CLINICAL)"
          - "decision_outcome payload value in {FULLY_FAVORABLE, PARTIALLY_FAVORABLE, UNFAVORABLE}"
        side_effects:
          - "Set decision_outcome, decided_at := now"
          - "Compute effectuation_due_at when decision_outcome != UNFAVORABLE; else null"
          - "Append CaseEvent(event_type=DECISION_RECORDED)"
          - "When decision_outcome != UNFAVORABLE: create Effectuation(status=PENDING, payment_amount_cents from payload)"
          - "Increment Case.version by 1"
      - from: DECIDED
        to: NOTIFIED
        trigger: "POST /appeals/cases/{id}/notifications with notification_kind=DECISION followed by POST /appeals/notifications/{nid}/mark-sent; the case auto-transitions when the DECISION notification for recipient_kind=MEMBER reaches SENT"
        actor: MemberServicesRep
        preconditions:
          - "Case.status == DECIDED"
          - "Notification.completeness_score == 1.00 for the DECISION/MEMBER notice (all required elements supplied)"
        side_effects:
          - "Set notified_at := notification.sent_at"
          - "Append CaseEvent(event_type=NOTIFICATION_SENT)"
          - "Increment Case.version by 1"
      - from: NOTIFIED
        to: IRE_REFERRED
        trigger: "POST /appeals/cases/{id}/ire-referrals"
        actor: ComplianceOfficer
        preconditions:
          - "Case.status == NOTIFIED"
          - "case_kind == APPEAL AND decision_outcome != FULLY_FAVORABLE (only adverse/partial appeal outcomes go to the IRE)"
          - "now - decided_at <= 72h IRE forwarding window"
        side_effects:
          - "Create IndependentReviewReferral(status=FORWARDED, forwarded_at := now)"
          - "Append CaseEvent(event_type=IRE_FORWARDED)"
          - "Increment Case.version by 1"
      - from: NOTIFIED
        to: CLOSED
        trigger: "POST /appeals/cases/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "Case.status == NOTIFIED"
          - "If decision_outcome != UNFAVORABLE then the linked Effectuation.status must be in {EFFECTUATED, WAIVED}"
          - "If decision_outcome != FULLY_FAVORABLE AND case_kind == APPEAL then either an IndependentReviewReferral exists OR the 72h forwarding window has lapsed unexercised (recorded via CaseEvent NOTE)"
        side_effects:
          - "Set closed_at := now"
          - "Decrement Member.open_case_count by 1"
          - "If ctm_linked: decrement Member.ctm_linked_case_count by 1"
          - "Append CaseEvent(event_type=NOTE, body='CLOSED')"
          - "Increment Case.version by 1"
      - from: IRE_REFERRED
        to: CLOSED
        trigger: "POST /appeals/cases/{id}/close after the linked IndependentReviewReferral reaches DECISION_RECEIVED and any required effectuation completes"
        actor: ComplianceOfficer
        preconditions:
          - "Case.status == IRE_REFERRED"
          - "Linked IndependentReviewReferral.status == DECISION_RECEIVED"
          - "If ire_decision in {OVERTURN_PLAN, PARTIAL} then linked Effectuation.status == EFFECTUATED"
        side_effects:
          - "Set closed_at := now"
          - "Decrement Member.open_case_count by 1 (and ctm_linked_case_count when ctm_linked)"
          - "Append CaseEvent(event_type=NOTE, body='CLOSED')"
          - "Increment Case.version by 1"
      - from: CLOSED
        to: REOPENED
        trigger: "System: fires when a Reopening on this case transitions to GRANTED"
        actor: system
        preconditions:
          - "Case.status == CLOSED"
          - "Linked Reopening.status just became GRANTED"
        side_effects:
          - "A new GrievanceAppealCase is created (status=RECEIVED, reopened_from_case_id := this case.id); this source case moves to REOPENED as a marker"
          - "Append CaseEvent(event_type=REOPEN_GRANTED) on the source case"
          - "Increment Case.version by 1"
      - from: REOPENED
        to: CLOSED
        trigger: "System: fires automatically when the spawned replacement case reaches CLOSED"
        actor: system
        preconditions:
          - "Case.status == REOPENED"
          - "The GrievanceAppealCase whose reopened_from_case_id == this case.id has status == CLOSED"
        side_effects:
          - "Set closed_at := now (overwrite marker)"
          - "Increment Case.version by 1"
      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /appeals/cases/{id}/withdraw"
        actor: MemberServicesRep
        preconditions:
          - "Case.status in {RECEIVED, TRIAGED, IN_REVIEW} (withdrawal allowed only before clinical engagement)"
        side_effects:
          - "Set closed_at := now"
          - "Decrement Member.open_case_count by 1 (and ctm_linked_case_count when ctm_linked)"
          - "Append CaseEvent(event_type=NOTE, body='WITHDRAWN')"
          - "Increment Case.version by 1"
      - from: TRIAGED
        to: WITHDRAWN
        trigger: "POST /appeals/cases/{id}/withdraw"
        actor: MemberServicesRep
        preconditions:
          - "Case.status in {RECEIVED, TRIAGED, IN_REVIEW}"
        side_effects:
          - "Set closed_at := now"
          - "Decrement Member.open_case_count by 1 (and ctm_linked_case_count when ctm_linked)"
          - "Append CaseEvent(event_type=NOTE, body='WITHDRAWN')"
          - "Increment Case.version by 1"
      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "POST /appeals/cases/{id}/withdraw"
        actor: MemberServicesRep
        preconditions:
          - "Case.status in {RECEIVED, TRIAGED, IN_REVIEW}"
        side_effects:
          - "Set closed_at := now"
          - "Decrement Member.open_case_count by 1 (and ctm_linked_case_count when ctm_linked)"
          - "Append CaseEvent(event_type=NOTE, body='WITHDRAWN')"
          - "Increment Case.version by 1"
      - from: TRIAGED
        to: TRIAGED
        trigger: "POST /appeals/cases/{id}/expedite (priority upgrade in place — cyclic self-transition)"
        actor: MedicalDirector
        preconditions:
          - "Case.status in {TRIAGED, IN_REVIEW}"
          - "priority_track == STANDARD"
          - "case_kind != GRIEVANCE"
          - "Active DeadlinePolicy exists for (member.program, case_kind, EXPEDITED)"
        side_effects:
          - "Set priority_track := EXPEDITED"
          - "Recompute resolution_due_at via case_deadline_calculation using the EXPEDITED policy, keeping received_at as the anchor"
          - "Append CaseEvent(event_type=PRIORITY_UPGRADE)"
          - "Increment Case.version by 1"
      - from: IN_REVIEW
        to: IN_REVIEW
        trigger: "POST /appeals/cases/{id}/expedite"
        actor: MedicalDirector
        preconditions:
          - "Case.status in {TRIAGED, IN_REVIEW}"
          - "priority_track == STANDARD"
          - "case_kind != GRIEVANCE"
        side_effects:
          - "Set priority_track := EXPEDITED"
          - "Recompute resolution_due_at"
          - "Append CaseEvent(event_type=PRIORITY_UPGRADE)"
          - "Increment Case.version by 1"
      - from: TRIAGED
        to: TRIAGED
        trigger: "POST /appeals/cases/{id}/extensions (member-requested extension — cyclic self-transition)"
        actor: MemberServicesRep
        preconditions:
          - "Case.status in {TRIAGED, IN_REVIEW, PENDING_CLINICAL}"
          - "extension_applied == false (only one extension per case)"
          - "DeadlinePolicy for (member.program, case_kind, priority_track) has extension_hours > 0"
        side_effects:
          - "Set extension_applied := true"
          - "Recompute resolution_due_at := resolution_due_at + extension_hours"
          - "Append CaseEvent(event_type=EXTENSION_GRANTED)"
          - "Increment Case.version by 1"
      - from: IN_REVIEW
        to: IN_REVIEW
        trigger: "POST /appeals/cases/{id}/extensions"
        actor: MemberServicesRep
        preconditions:
          - "Case.status in {TRIAGED, IN_REVIEW, PENDING_CLINICAL}"
          - "extension_applied == false"
        side_effects:
          - "Set extension_applied := true; recompute resolution_due_at"
          - "Append CaseEvent(event_type=EXTENSION_GRANTED)"
          - "Increment Case.version by 1"
      - from: PENDING_CLINICAL
        to: PENDING_CLINICAL
        trigger: "POST /appeals/cases/{id}/extensions"
        actor: MemberServicesRep
        preconditions:
          - "Case.status in {TRIAGED, IN_REVIEW, PENDING_CLINICAL}"
          - "extension_applied == false"
        side_effects:
          - "Set extension_applied := true; recompute resolution_due_at"
          - "Append CaseEvent(event_type=EXTENSION_GRANTED)"
          - "Increment Case.version by 1"

  - entity: ClinicalReview
    initial_state: REQUESTED
    terminal_states: [DETERMINED, SUPERSEDED]
    transitions:
      - from: REQUESTED
        to: ASSIGNED
        trigger: "POST /appeals/clinical-reviews/{id}/assign"
        actor: MedicalDirector
        preconditions:
          - "ClinicalReview.status == REQUESTED"
          - "reviewer_physician_id payload names a user whose role is MedicalDirector and who is not the same X-User-ID as the requesting CaseAnalyst (segregation of duties)"
        side_effects:
          - "Set reviewer_physician_id"
          - "Increment ClinicalReview.version by 1"
      - from: ASSIGNED
        to: DETERMINATION_DRAFT
        trigger: "POST /appeals/clinical-reviews/{id}/draft-determination"
        actor: MedicalDirector
        preconditions:
          - "ClinicalReview.status == ASSIGNED"
          - "X-User-ID == reviewer_physician_id (only the assignee may draft)"
        side_effects:
          - "Compute medical_necessity_score via medical_necessity_scoring from payload clinical factors"
          - "Increment ClinicalReview.version by 1"
      - from: DETERMINATION_DRAFT
        to: DETERMINED
        trigger: "POST /appeals/clinical-reviews/{id}/finalize-determination"
        actor: MedicalDirector
        preconditions:
          - "ClinicalReview.status == DETERMINATION_DRAFT"
          - "X-User-ID == reviewer_physician_id"
          - "determination payload value in {UPHOLD_SERVICE, OVERTURN_SERVICE, PARTIAL}"
        side_effects:
          - "Set determination"
          - "Increment ClinicalReview.version by 1"
      - from: DETERMINED
        to: SUPERSEDED
        trigger: "System: when a new ClinicalReview is created for the same case after a reopening, the prior DETERMINED review is marked SUPERSEDED"
        actor: system
        preconditions:
          - "ClinicalReview.status == DETERMINED"
          - "A newer ClinicalReview exists for the same case_id with a later created_at"
        side_effects:
          - "Set superseded_by_review_id to the newer review's id"
          - "Increment ClinicalReview.version by 1"

  - entity: Notification
    initial_state: QUEUED
    terminal_states: [DELIVERED, FAILED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /appeals/notifications/{id}/mark-sent"
        actor: MemberServicesRep
        preconditions:
          - "Notification.status == QUEUED"
          - "completeness_score == 1.00 (all required elements supplied)"
        side_effects:
          - "Set sent_at := now"
          - "If notification_kind == DECISION and recipient_kind == MEMBER: trigger parent case DECIDED -> NOTIFIED auto-transition"
          - "Increment Notification.version by 1"
      - from: SENT
        to: DELIVERED
        trigger: "POST /appeals/notifications/{id}/mark-delivered"
        actor: MemberServicesRep
        preconditions:
          - "Notification.status == SENT"
        side_effects:
          - "Increment Notification.version by 1"
      - from: SENT
        to: FAILED
        trigger: "POST /appeals/notifications/{id}/mark-failed"
        actor: MemberServicesRep
        preconditions:
          - "Notification.status in {SENT, RETRIED}"
        side_effects:
          - "Increment Notification.version by 1"
      - from: FAILED
        to: RETRIED
        trigger: "POST /appeals/notifications/{id}/retry"
        actor: MemberServicesRep
        preconditions:
          - "Notification.status == FAILED"
        side_effects:
          - "Increment Notification.version by 1"
      - from: RETRIED
        to: SENT
        trigger: "POST /appeals/notifications/{id}/mark-sent"
        actor: MemberServicesRep
        preconditions:
          - "Notification.status in {QUEUED, RETRIED}"
        side_effects:
          - "Increment Notification.version by 1"

  - entity: IndependentReviewReferral
    initial_state: FORWARDED
    terminal_states: [EFFECTUATED]
    transitions:
      - from: FORWARDED
        to: ACKNOWLEDGED_BY_IRE
        trigger: "POST /appeals/ire-referrals/{id}/ire-acknowledge"
        actor: ComplianceOfficer
        preconditions:
          - "IndependentReviewReferral.status == FORWARDED"
        side_effects:
          - "Increment IndependentReviewReferral.version by 1"
      - from: ACKNOWLEDGED_BY_IRE
        to: DECISION_RECEIVED
        trigger: "POST /appeals/ire-referrals/{id}/ire-record-decision"
        actor: ComplianceOfficer
        preconditions:
          - "IndependentReviewReferral.status == ACKNOWLEDGED_BY_IRE"
          - "ire_decision payload value in {UPHOLD_PLAN, OVERTURN_PLAN, PARTIAL}"
        side_effects:
          - "Set ire_decision, ire_decision_received_at := now"
          - "When ire_decision in {OVERTURN_PLAN, PARTIAL}: create Effectuation(status=PENDING, referral_id := this id) on the parent case"
          - "Increment IndependentReviewReferral.version by 1"
      - from: DECISION_RECEIVED
        to: EFFECTUATED
        trigger: "System: when the linked Effectuation reaches EFFECTUATED (only applicable when ire_decision != UPHOLD_PLAN; UPHOLD_PLAN referrals close the case without this transition and the referral stays DECISION_RECEIVED)"
        actor: system
        preconditions:
          - "IndependentReviewReferral.status == DECISION_RECEIVED"
          - "Linked Effectuation.status == EFFECTUATED"
        side_effects:
          - "Increment IndependentReviewReferral.version by 1"

  - entity: Effectuation
    initial_state: PENDING
    terminal_states: [EFFECTUATED, WAIVED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /appeals/effectuations/{id}/start"
        actor: ClaimsProcessor
        preconditions:
          - "Effectuation.status == PENDING"
          - "If payment_amount_cents > 0 and the case's provider_id references a Provider: Provider.w9_on_file == true (payment release requires W-9)"
        side_effects:
          - "Append CaseEvent(event_type=EFFECTUATION_STARTED) on parent case"
          - "Increment Effectuation.version by 1"
      - from: IN_PROGRESS
        to: EFFECTUATED
        trigger: "POST /appeals/effectuations/{id}/complete"
        actor: ClaimsProcessor
        preconditions:
          - "Effectuation.status in {IN_PROGRESS, OVERDUE}"
        side_effects:
          - "Set completed_at := now; compute timeliness_percent via effectuation_timeliness_calculation"
          - "Append CaseEvent(event_type=EFFECTUATION_COMPLETED) on parent case"
          - "If this Effectuation.referral_id is set: parent IndependentReviewReferral DECISION_RECEIVED -> EFFECTUATED auto-transition"
          - "Increment Effectuation.version by 1"
      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "System clock: when now > parent case.effectuation_due_at and status == IN_PROGRESS"
        actor: system
        preconditions:
          - "Effectuation.status == IN_PROGRESS"
          - "now > GrievanceAppealCase.effectuation_due_at"
        side_effects:
          - "Increment Effectuation.version by 1"
      - from: OVERDUE
        to: ESCALATED
        trigger: "POST /appeals/effectuations/{id}/escalate"
        actor: ComplianceOfficer
        preconditions:
          - "Effectuation.status == OVERDUE"
        side_effects:
          - "Increment Effectuation.version by 1"
      - from: ESCALATED
        to: EFFECTUATED
        trigger: "POST /appeals/effectuations/{id}/complete (allowed from ESCALATED as well as OVERDUE/IN_PROGRESS)"
        actor: ClaimsProcessor
        preconditions:
          - "Effectuation.status in {IN_PROGRESS, OVERDUE, ESCALATED}"
        side_effects:
          - "Set completed_at := now; compute timeliness_percent (> 100.00 when completed after effectuation_due_at)"
          - "Append CaseEvent(event_type=EFFECTUATION_COMPLETED)"
          - "If referral_id set: referral auto-transition"
          - "Increment Effectuation.version by 1"
      - from: OVERDUE
        to: EFFECTUATED
        trigger: "POST /appeals/effectuations/{id}/complete"
        actor: ClaimsProcessor
        preconditions:
          - "Effectuation.status in {IN_PROGRESS, OVERDUE, ESCALATED}"
        side_effects:
          - "Set completed_at := now; compute timeliness_percent"
          - "Append CaseEvent(event_type=EFFECTUATION_COMPLETED)"
          - "If referral_id set: referral auto-transition"
          - "Increment Effectuation.version by 1"
      - from: PENDING
        to: WAIVED
        trigger: "POST /appeals/effectuations/{id}/waive"
        actor: ComplianceOfficer
        preconditions:
          - "Effectuation.status == PENDING"
          - "payment_amount_cents == 0 (only service-only effectuations with no monetary component may be waived)"
        side_effects:
          - "Increment Effectuation.version by 1"

  - entity: Reopening
    initial_state: REQUESTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /appeals/reopenings/{id}/begin-review"
        actor: ComplianceOfficer
        preconditions:
          - "Reopening.status == REQUESTED"
        side_effects:
          - "Increment Reopening.version by 1"
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /appeals/reopenings/{id}/grant"
        actor: ComplianceOfficer
        preconditions:
          - "Reopening.status == UNDER_REVIEW"
          - "requested_at - source case.closed_at <= reopening window (180 days for NEW_EVIDENCE/CLERICAL_ERROR; unlimited for FRAUD_OR_SIMILAR_FAULT)"
          - "No other Reopening for the same case_id is currently GRANTED"
        side_effects:
          - "Set decided_at := now; set spawned_case_id to newly created GrievanceAppealCase"
          - "Source case CLOSED -> REOPENED auto-transition; new case created with reopened_from_case_id := source case.id, case_kind/priority copied, status=RECEIVED"
          - "Increment Member.open_case_count by 1 for the spawned case"
          - "Any DETERMINED ClinicalReview on the source case transitions to SUPERSEDED"
          - "Append CaseEvent(event_type=REOPEN_GRANTED) on source case"
          - "Increment Reopening.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /appeals/reopenings/{id}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "Reopening.status == UNDER_REVIEW"
        side_effects:
          - "Set decided_at := now"
          - "Append CaseEvent(event_type=REOPEN_DENIED) on source case"
          - "Increment Reopening.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; only true races)
# =============================================================================
concurrency_rules:
  - rule_id: case-mutation-stale-version
    parent_entity: GrievanceAppealCase
    write_endpoint: "POST /appeals/cases/{id}/extensions"
    occ_field: "expected_case_version"
    description: |
      Applying the single permitted member extension against a GrievanceAppealCase
      whose version has advanced since the client last observed it is rejected.
      The extension mutates resolution_due_at on the case aggregate, and another
      writer may have legitimately mutated the case (triage, expedite, event append)
      in between; the current writer's view of the case is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reopening-grant-stale-case
    parent_entity: GrievanceAppealCase
    write_endpoint: "POST /appeals/reopenings/{id}/grant"
    occ_field: "expected_case_version"
    description: |
      Granting a reopening against a source case whose version has advanced since
      the client last observed it is rejected. A grant spawns a replacement case
      and flips the source case to REOPENED; if another writer has just mutated the
      source case (e.g. an event append or withdrawal marker), the granting view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: effectuation-complete-stale-version
    parent_entity: Effectuation
    write_endpoint: "POST /appeals/effectuations/{id}/complete"
    occ_field: "expected_effectuation_version"
    description: |
      Completing an Effectuation whose version has advanced since the client last
      observed it is rejected. Completion fires the referral auto-transition and
      timeliness computation; a stale writer (e.g. one who read before a system
      OVERDUE transition bumped the version) must not complete from an old view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: case_deadline_calculation
    trigger: "On triage, on expedite (priority upgrade), and on extension grant — recomputes GrievanceAppealCase.resolution_due_at"
    algorithm: threshold
    formula: |
      policy := active DeadlinePolicy for (member.program, case.case_kind, case.priority_track)
      base := case.received_at + policy.resolution_hours hours
      if case.extension_applied:
          base := base + policy.extension_hours hours
      # acknowledgement gate: if acknowledged_at - received_at > 24h, the case is
      # acknowledgement-late; this does NOT move the deadline but flags the case
      # (used by audit_universe_aggregation's timeliness attribution variant).
      resolution_due_at := base
      overdue := (now > resolution_due_at) and status not in {CLOSED, WITHDRAWN, IRE_REFERRED}
    input_set: "DeadlinePolicy rows with active=true exactly matching (program, case_kind, priority_track); exactly one such row must exist else ERR_POLICY_NOT_CONFIGURED"
    constants:
      ACK_WINDOW_HOURS: 24
      IRE_FORWARD_WINDOW_HOURS: 72
    precision: "timestamps to the second; no rounding"
    variants:
      - name: expedited_track
        when: "priority_track == EXPEDITED"
        difference: "Uses the EXPEDITED policy row's smaller resolution_hours; anchor remains received_at, NOT the upgrade timestamp, so an upgrade mid-flight tightens the remaining window"
      - name: standard_track
        when: "priority_track == STANDARD"
        difference: "Uses the STANDARD policy row"

  - name: medical_necessity_scoring
    trigger: "On ClinicalReview draft-determination"
    algorithm: weighted_scoring
    formula: |
      # Clinical factors (each 0..10) with weights; score normalized to 0..100.
      # Round HALF_UP to 2 decimals AFTER summation (pinned: sum-then-round).
      score_raw := 0.35*severity + 0.25*acuity + 0.20*guideline_match + 0.10*comorbidity + 0.10*functional_impairment
      medical_necessity_score := round_half_up(score_raw * 10, 2)
    input_set: "Five clinical factor integers (severity, acuity, guideline_match, comorbidity, functional_impairment), each 0..10, supplied in the draft payload"
    constants:
      W_SEVERITY: 0.35
      W_ACUITY: 0.25
      W_GUIDELINE: 0.20
      W_COMORBIDITY: 0.10
      W_FUNCTIONAL: 0.10
    precision: "2 decimal places, round_half_up; rounding applied ONCE after the weighted sum (sum-then-round), never per-term"
    variants:
      - name: physician_override
        when: "determination payload includes override_score"
        difference: "medical_necessity_score := round_half_up(override_score, 2) clamped to [0.00, 100.00]; the weighted formula result is retained in the draft audit body but the override value is stored"

  - name: notification_completeness_scoring
    trigger: "On Notification creation and whenever supplied_elements is patched"
    algorithm: aggregation
    formula: |
      # required_elements is resolved from notification_content_matrix by
      # (notification_kind, recipient_kind, member.program, case.case_kind, case.decision_outcome).
      # Each required element carries a fixed weight; element weights sum to exactly 1.00.
      # Pinned order: compute each matched element's contribution rounded to 4 decimals
      # (per-element round), THEN sum, THEN round_half_up to 2 decimals.
      matched := [e for e in required_elements if e in supplied_elements]
      completeness_score := round_half_up(sum(round(w_e, 4) for e in matched), 2)
    input_set: "Notification.required_elements (computed) and Notification.supplied_elements (input)"
    constants:
      ELEMENT_WEIGHTS: "{ citation_of_criteria: 0.25, appeal_rights: 0.25, decision_rationale: 0.20, expedited_availability: 0.10, ire_notice: 0.10, contact_information: 0.05, language_assistance: 0.05 }"
    precision: "per-element contributions rounded to 4 decimals first, summed, then final round_half_up to 2 decimals — this per-element-then-sum order is pinned and differs from sum-then-round"

  - name: effectuation_timeliness_calculation
    trigger: "On Effectuation completion"
    algorithm: threshold
    formula: |
      window_hours := (case.effectuation_due_at - case.decided_at) in hours
      consumed_hours := (effectuation.completed_at - case.decided_at) in hours
      timeliness_percent := round_half_up(100.0 * consumed_hours / window_hours, 2)
      # Boundary: consumed_hours <= window_hours is TIMELY (<=, not <);
      # exactly 100.00 is timely; 100.01 is late.
    input_set: "The parent case's decided_at and effectuation_due_at, and this effectuation's completed_at"
    constants:
      TIMELY_BOUNDARY_PERCENT: 100.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: business_hours_variant
        when: "DeadlinePolicy row for the case carries business_hours_only=true (config flag; reserved for MEDI_CAL service-only effectuations)"
        difference: "consumed_hours counts only Mon-Fri 08:00-17:00 UTC hours, so the same wall-clock interval yields a smaller timeliness_percent than the default calendar-hours variant"

  - name: audit_universe_aggregation
    trigger: "On POST /appeals/audit-universe/snapshot — builds AuditUniverseRecord rows for a report period"
    algorithm: chronological
    formula: |
      # Include every case whose decided_at falls inside [period_start, period_end)
      # (half-open: inclusive start, exclusive end). Sort by decided_at ASC, then
      # created_at ASC (never id) as the deterministic snapshot order.
      # resolution_timely := decided_at <= resolution_due_at  (<= is timely)
      # effectuation_timely := (no required effectuation) -> null
      #                        else effectuation.completed_at <= case.effectuation_due_at
      universe := [case for case in cases if period_start <= case.decided_at < period_end]
    input_set: "GrievanceAppealCase rows with decided_at in the report period half-open window; cases never decided are excluded entirely"
    constants:
      PERIOD_GRANULARITY: "YYYY-MM"
    precision: "boolean flags; timestamps compared to the second"
    variants:
      - name: compliance_attribution
        when: "compliance report view (GET /appeals/audit-universe/compliance-summary)"
        difference: "A case that missed its deadline solely because acknowledged_at - received_at > ACK_WINDOW_HOURS is attributed to INTAKE_DELAY and excluded from the reviewer-lateness numerator; the raw snapshot variant counts it as simply late — the two views of identical data produce different timeliness rates"

  - name: ctm_linkage_weighting
    trigger: "On CaseEvent CTM_LINKED append and on GET /appeals/members/{id}/ctm-exposure"
    algorithm: tiered_pricing
    formula: |
      # Member-level CTM exposure tier from ctm_linked_case_count (open, CTM-linked cases):
      #   count 0       -> tier NONE,   weight 0
      #   count 1..2    -> tier LOW,    weight 1
      #   count 3..5    -> tier MEDIUM, weight 2
      #   count >= 6    -> tier HIGH,   weight 3
      # Boundary: count == 3 is MEDIUM (>= 3), count == 6 is HIGH (>= 6).
      c := member.ctm_linked_case_count
      if c == 0: (NONE, 0)
      elif c <= 2: (LOW, 1)
      elif c <= 5: (MEDIUM, 2)
      else: (HIGH, 3)
    input_set: "Member.ctm_linked_case_count (computed field over open CTM-linked cases)"
    constants:
      TIER_LOW_MAX: 2
      TIER_MEDIUM_MAX: 5
    precision: "integer counts; tier boundaries are >= comparisons"
    variants:
      - name: provisional_weight
        when: "case is CTM-linked while still in RECEIVED (pre-triage)"
        difference: "Provisional weight counts the case at half weight (0.5) until triage confirms classification; tier thresholds compare against ceil(total provisional weight). The final variant counts full weight after triage — identical link data yields a different tier before vs after triage"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted to call this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path id exists (case, notification, clinical-review, ire-referral, effectuation, reopening, member, provider), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Every body FK references an existing row (member_id, provider_id, case_id, referral_id, reopened_from_case_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST endpoints taking FK fields"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "Terminal-state lockdown: no mutation on CLOSED/WITHDRAWN cases (except reopening creation), DETERMINED/SUPERSEDED reviews, DELIVERED/FAILED notifications (except retry from FAILED), EFFECTUATED/WAIVED effectuations, GRANTED/DENIED reopenings"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: the MedicalDirector deciding a PENDING_CLINICAL case must not be the IntakeSpecialist who triaged it; the reviewer_physician_id must not equal the requesting CaseAnalyst's X-User-ID"
    error_id: ERR_DUTY_SEGREGATION
    http_status: 422
    applies_to: "POST /appeals/cases/{id}/decide, POST /appeals/clinical-reviews/{id}/assign"
  - priority: 8
    category: business_safety
    check: "Clinical routing: non-GRIEVANCE cases may not be decided from IN_REVIEW (must route through PENDING_CLINICAL with a DETERMINED ClinicalReview)"
    error_id: ERR_CLINICAL_REVIEW_REQUIRED
    http_status: 422
    applies_to: "POST /appeals/cases/{id}/decide"
  - priority: 9
    category: business_temporal
    check: "Acknowledgement window: triage must occur within ACK_WINDOW_HOURS (24h) of received_at"
    error_id: ERR_ACK_WINDOW_MISSED
    http_status: 422
    applies_to: "POST /appeals/cases/{id}/triage"
  - priority: 10
    category: business_temporal
    check: "IRE forwarding window: referral must be created within 72h of decided_at"
    error_id: ERR_IRE_WINDOW_MISSED
    http_status: 422
    applies_to: "POST /appeals/cases/{id}/ire-referrals"
  - priority: 11
    category: business_temporal
    check: "Reopening window: NEW_EVIDENCE/CLERICAL_ERROR reopenings must be requested within 180 days of the source case's closed_at; FRAUD_OR_SIMILAR_FAULT is exempt"
    error_id: ERR_REOPEN_WINDOW_MISSED
    http_status: 422
    applies_to: "POST /appeals/reopenings"
  - priority: 12
    category: business_constraint
    check: "One live clinical review per case: no second ClinicalReview while one is in {REQUESTED, ASSIGNED, DETERMINATION_DRAFT}"
    error_id: ERR_REVIEW_IN_FLIGHT
    http_status: 409
    applies_to: "POST /appeals/cases/{id}/clinical-reviews"
  - priority: 13
    category: business_constraint
    check: "Single extension: extension_applied must be false and policy extension_hours > 0"
    error_id: ERR_EXTENSION_CONSUMED
    http_status: 422
    applies_to: "POST /appeals/cases/{id}/extensions"
  - priority: 14
    category: business_constraint
    check: "Expedited eligibility: grievances have no expedited track; expedited_requested on a GRIEVANCE intake is rejected; expedite action on GRIEVANCE is rejected"
    error_id: ERR_EXPEDITED_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /appeals/cases, POST /appeals/cases/{id}/expedite"
  - priority: 15
    category: business_constraint
    check: "Policy configuration: exactly one active DeadlinePolicy must exist for (program, case_kind, priority_track) at triage/expedite time"
    error_id: ERR_POLICY_NOT_CONFIGURED
    http_status: 422
    applies_to: "POST /appeals/cases/{id}/triage, POST /appeals/cases/{id}/expedite"
  - priority: 16
    category: business_referential
    check: "Notification completeness: a Notification may not be marked SENT unless completeness_score == 1.00"
    error_id: ERR_NOTIFICATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /appeals/notifications/{id}/mark-sent"
  - priority: 17
    category: business_referential
    check: "W-9 gate: payment effectuation (payment_amount_cents > 0) for a case with a provider_id requires Provider.w9_on_file == true before start"
    error_id: ERR_W9_REQUIRED
    http_status: 422
    applies_to: "POST /appeals/effectuations/{id}/start"
  - priority: 18
    category: business_fiscal
    check: "Waiver gate: only zero-amount effectuations may be waived"
    error_id: ERR_WAIVER_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /appeals/effectuations/{id}/waive"
  - priority: 19
    category: business_fiscal
    check: "Payment amount must be >= 0 and payment requires decision_outcome != UNFAVORABLE at decide time"
    error_id: ERR_PAYMENT_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /appeals/cases/{id}/decide"
  - priority: 20
    category: existence
    check: "Duplicate intake guard: a case with identical (member_id, case_kind, provider_id, received within 1h) already in a non-terminal state is a suspected duplicate"
    error_id: ERR_DUPLICATE_CASE
    http_status: 409
    applies_to: "POST /appeals/cases"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- clock (test-driving; default time pinned) ----
  - method: POST
    path: /appeals/_clock/set_current_utc
    description: "Sets the logical server clock. Before any call to this endpoint, the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default) and never falls back to wall-clock time. All deadline computations read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["All subsequent deadline/overdue evaluations use the new clock value; Effectuation rows in IN_PROGRESS whose parent case.effectuation_due_at < now transition to OVERDUE; GrievanceAppealCase.overdue flags recompute"]

  # ---- members ----
  - method: POST
    path: /appeals/members
    description: "Register a member in the appeals system"
    roles: [PlatformAdmin]
    code: 201
    input: [member_ref, full_name, program]
    output: Member
    side_effects: []
  - method: GET
    path: /appeals/members/{id}
    description: "Fetch one member (includes computed open_case_count, ctm_linked_case_count)"
    roles: [PlatformAdmin, IntakeSpecialist, CaseAnalyst, MedicalDirector, MemberServicesRep, ComplianceOfficer, ClaimsProcessor]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: /appeals/members
    description: "List members with pagination; optional program filter"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["program?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: GET
    path: /appeals/members/{id}/ctm-exposure
    description: "Computed CTM exposure tier for the member per ctm_linkage_weighting"
    roles: [PlatformAdmin, ComplianceOfficer, MemberServicesRep]
    code: 200
    input: []
    output: "{ tier: string, weight: integer, provisional_weight: number, ctm_linked_case_count: integer }"
    side_effects: []
  - method: GET
    path: /appeals/members/{id}/cases
    description: "Reverse-reachability: all cases for a member"
    roles: [PlatformAdmin, IntakeSpecialist, CaseAnalyst, ComplianceOfficer, MemberServicesRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GrievanceAppealCase[]
    side_effects: []

  # ---- providers ----
  - method: POST
    path: /appeals/providers
    description: "Register a provider"
    roles: [PlatformAdmin]
    code: 201
    input: [npi, legal_name, contract_status, "w9_on_file?"]
    output: Provider
    side_effects: []
  - method: GET
    path: /appeals/providers/{id}
    description: "Fetch one provider"
    roles: [PlatformAdmin, IntakeSpecialist, CaseAnalyst, ComplianceOfficer, ClaimsProcessor]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: PATCH
    path: /appeals/providers/{id}
    description: "Update provider mutable fields (w9_on_file, contract_status)"
    roles: [PlatformAdmin]
    code: 200
    input: ["w9_on_file?", "contract_status?"]
    output: Provider
    side_effects: ["Increments Provider.version by 1"]

  # ---- deadline policies ----
  - method: POST
    path: /appeals/deadline-policies
    description: "Create a DeadlinePolicy; uniqueness enforced on active (program, case_kind, priority_track)"
    roles: [PlatformAdmin]
    code: 201
    input: [program, case_kind, priority_track, resolution_hours, "extension_hours?", effectuation_hours, "business_hours_only?", "active?"]
    output: DeadlinePolicy
    side_effects: ["If active=true, any previously active policy with the same (program, case_kind, priority_track) is deactivated"]
  - method: GET
    path: /appeals/deadline-policies
    description: "List policies with filters"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["program?", "case_kind?", "priority_track?", "active?", "limit?", "offset?"]
    output: DeadlinePolicy[]
    side_effects: []

  # ---- cases ----
  - method: POST
    path: /appeals/cases
    description: "Intake a grievance / organization determination / appeal"
    roles: [IntakeSpecialist]
    code: 201
    input: [member_id, "provider_id?", case_kind, "expedited_requested?", "expedited_justification?", "reopened_from_case_id?"]
    output: GrievanceAppealCase
    side_effects: ["Set received_at := now; Increment Member.open_case_count by 1"]
  - method: GET
    path: /appeals/cases/{id}
    description: "Fetch one case"
    roles: [PlatformAdmin, IntakeSpecialist, CaseAnalyst, MedicalDirector, MemberServicesRep, ComplianceOfficer, ClaimsProcessor]
    code: 200
    input: []
    output: GrievanceAppealCase
    side_effects: []
  - method: GET
    path: /appeals/cases
    description: "List cases with filters and pagination"
    roles: [PlatformAdmin, ComplianceOfficer, CaseAnalyst]
    code: 200
    input: ["member_id?", "provider_id?", "status?", "case_kind?", "priority_track?", "overdue?", "reopened_from_case_id?", "limit?", "offset?"]
    output: GrievanceAppealCase[]
    side_effects: []
  - method: POST
    path: /appeals/cases/{id}/triage
    description: "Triage a RECEIVED case: classify priority track, compute deadline"
    roles: [IntakeSpecialist]
    code: 200
    input: []
    output: GrievanceAppealCase
    side_effects: ["Case RECEIVED->TRIAGED transition per §1.2", "increments GrievanceAppealCase.version by 1"]
  - method: POST
    path: /appeals/cases/{id}/begin-review
    description: "Move a TRIAGED case into analyst review"
    roles: [CaseAnalyst]
    code: 200
    input: []
    output: GrievanceAppealCase
    side_effects: ["Case TRIAGED->IN_REVIEW", "increments GrievanceAppealCase.version by 1"]
  - method: POST
    path: /appeals/cases/{id}/expedite
    description: "Upgrade STANDARD to EXPEDITED priority track in place"
    roles: [MedicalDirector]
    code: 200
    input: []
    output: GrievanceAppealCase
    side_effects: ["Recompute resolution_due_at", "increments GrievanceAppealCase.version by 1"]
  - method: POST
    path: /appeals/cases/{id}/extensions
    description: "Apply the single member-requested extension (OCC-guarded)"
    roles: [MemberServicesRep]
    code: 200
    input: [expected_case_version]
    output: GrievanceAppealCase
    side_effects: ["extension_applied := true; resolution_due_at recomputed", "increments GrievanceAppealCase.version by 1"]
  - method: POST
    path: /appeals/cases/{id}/decide
    description: "Record the decision (outcome + optional payment for effectuation)"
    roles: [MedicalDirector, CaseAnalyst]
    code: 200
    input: [decision_outcome, "payment_amount_cents?"]
    output: GrievanceAppealCase
    side_effects: ["Case ->DECIDED", "Creates Effectuation when outcome != UNFAVORABLE", "increments GrievanceAppealCase.version by 1"]
  - method: POST
    path: /appeals/cases/{id}/withdraw
    description: "Withdraw a pre-clinical case"
    roles: [MemberServicesRep]
    code: 200
    input: []
    output: GrievanceAppealCase
    side_effects: ["Case ->WITHDRAWN", "Decrement Member.open_case_count", "increments GrievanceAppealCase.version by 1"]
  - method: POST
    path: /appeals/cases/{id}/close
    description: "Close a NOTIFIED or IRE_REFERRED case"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: GrievanceAppealCase
    side_effects: ["Case ->CLOSED", "Decrement Member.open_case_count", "increments GrievanceAppealCase.version by 1"]
  - method: GET
    path: /appeals/cases/{id}/events
    description: "Reverse-reachability: chronological event log for a case (occurred_at ASC, created_at ASC tie-break)"
    roles: [PlatformAdmin, IntakeSpecialist, CaseAnalyst, MedicalDirector, MemberServicesRep, ComplianceOfficer]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: CaseEvent[]
    side_effects: []
  - method: GET
    path: /appeals/cases/{id}/clinical-reviews
    description: "Reverse-reachability: clinical reviews for a case"
    roles: [PlatformAdmin, CaseAnalyst, MedicalDirector, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClinicalReview[]
    side_effects: []
  - method: GET
    path: /appeals/cases/{id}/notifications
    description: "Reverse-reachability: notifications for a case"
    roles: [PlatformAdmin, MemberServicesRep, ComplianceOfficer]
    code: 200
    input: ["status?", "notification_kind?", "limit?", "offset?"]
    output: Notification[]
    side_effects: []
  - method: GET
    path: /appeals/cases/{id}/ire-referrals
    description: "Reverse-reachability: IRE referrals for a case"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: IndependentReviewReferral[]
    side_effects: []
  - method: GET
    path: /appeals/cases/{id}/effectuations
    description: "Reverse-reachability: effectuations for a case"
    roles: [PlatformAdmin, ComplianceOfficer, ClaimsProcessor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Effectuation[]
    side_effects: []
  - method: GET
    path: /appeals/cases/{id}/reopenings
    description: "Reverse-reachability: reopenings against a case"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Reopening[]
    side_effects: []

  # ---- case events ----
  - method: POST
    path: /appeals/cases/{id}/events
    description: "Append an event (NOTE, DOCUMENT, EXTENSION_REQUEST, CTM_LINKED, CTM_UNLINKED)"
    roles: [IntakeSpecialist, CaseAnalyst, MemberServicesRep, ComplianceOfficer]
    code: 201
    input: [event_type, "body?"]
    output: CaseEvent
    side_effects:
      - "event_type == CTM_LINKED: set case.ctm_linked := true and increment Member.ctm_linked_case_count by 1 (only when case not CLOSED/WITHDRAWN)"
      - "event_type == CTM_UNLINKED: set case.ctm_linked := false and decrement Member.ctm_linked_case_count by 1 (floor 0, only when previously linked)"
      - "Increments GrievanceAppealCase.version by 1"

  # ---- clinical reviews ----
  - method: POST
    path: /appeals/cases/{id}/clinical-reviews
    description: "Request a clinical review on an IN_REVIEW case (moves case to PENDING_CLINICAL)"
    roles: [CaseAnalyst]
    code: 201
    input: []
    output: ClinicalReview
    side_effects: ["Case IN_REVIEW->PENDING_CLINICAL", "increments GrievanceAppealCase.version by 1"]
  - method: GET
    path: /appeals/clinical-reviews/{id}
    description: "Fetch one clinical review"
    roles: [PlatformAdmin, CaseAnalyst, MedicalDirector, ComplianceOfficer]
    code: 200
    input: []
    output: ClinicalReview
    side_effects: []
  - method: GET
    path: /appeals/clinical-reviews
    description: "List clinical reviews with filters (reverse-reachability for superseded_by_review_id)"
    roles: [PlatformAdmin, CaseAnalyst, MedicalDirector, ComplianceOfficer]
    code: 200
    input: ["case_id?", "status?", "superseded_by_review_id?", "limit?", "offset?"]
    output: ClinicalReview[]
    side_effects: []
  - method: POST
    path: /appeals/clinical-reviews/{id}/assign
    description: "Assign a physician reviewer"
    roles: [MedicalDirector]
    code: 200
    input: [reviewer_physician_id]
    output: ClinicalReview
    side_effects: ["ClinicalReview REQUESTED->ASSIGNED", "increments ClinicalReview.version by 1"]
  - method: POST
    path: /appeals/clinical-reviews/{id}/draft-determination
    description: "Submit clinical factor scores; computes medical_necessity_score"
    roles: [MedicalDirector]
    code: 200
    input: [severity, acuity, guideline_match, comorbidity, functional_impairment, "override_score?"]
    output: ClinicalReview
    side_effects: ["ClinicalReview ASSIGNED->DETERMINATION_DRAFT", "medical_necessity_scoring runs", "increments ClinicalReview.version by 1"]
  - method: POST
    path: /appeals/clinical-reviews/{id}/finalize-determination
    description: "Finalize the determination"
    roles: [MedicalDirector]
    code: 200
    input: [determination]
    output: ClinicalReview
    side_effects: ["ClinicalReview DETERMINATION_DRAFT->DETERMINED", "increments ClinicalReview.version by 1"]

  # ---- notifications ----
  - method: POST
    path: /appeals/cases/{id}/notifications
    description: "Create a notification (ACKNOWLEDGEMENT, EXTENSION_NOTICE, DECISION, IRE_FORWARD_NOTICE, REOPEN_OUTCOME, EFFECTUATION_CONFIRMATION)"
    roles: [MemberServicesRep]
    code: 201
    input: [recipient_kind, notification_kind, supplied_elements]
    output: Notification
    side_effects: ["Compute required_elements and completeness_score"]
  - method: GET
    path: /appeals/notifications/{id}
    description: "Fetch one notification"
    roles: [PlatformAdmin, MemberServicesRep, ComplianceOfficer]
    code: 200
    input: []
    output: Notification
    side_effects: []
  - method: PATCH
    path: /appeals/notifications/{id}
    description: "Update supplied_elements (recomputes completeness_score); only while QUEUED"
    roles: [MemberServicesRep]
    code: 200
    input: [supplied_elements]
    output: Notification
    side_effects: ["Recompute completeness_score", "increments Notification.version by 1"]
  - method: POST
    path: /appeals/notifications/{id}/mark-sent
    description: "Mark a QUEUED or RETRIED notification SENT (requires completeness)"
    roles: [MemberServicesRep]
    code: 200
    input: []
    output: Notification
    side_effects: ["Notification ->SENT", "If DECISION/MEMBER: parent case DECIDED->NOTIFIED", "increments Notification.version by 1"]
  - method: POST
    path: /appeals/notifications/{id}/mark-delivered
    description: "Mark SENT -> DELIVERED"
    roles: [MemberServicesRep]
    code: 200
    input: []
    output: Notification
    side_effects: ["increments Notification.version by 1"]
  - method: POST
    path: /appeals/notifications/{id}/mark-failed
    description: "Mark SENT or RETRIED -> FAILED"
    roles: [MemberServicesRep]
    code: 200
    input: []
    output: Notification
    side_effects: ["increments Notification.version by 1"]
  - method: POST
    path: /appeals/notifications/{id}/retry
    description: "FAILED -> RETRIED"
    roles: [MemberServicesRep]
    code: 200
    input: []
    output: Notification
    side_effects: ["increments Notification.version by 1"]

  # ---- IRE referrals ----
  - method: POST
    path: /appeals/cases/{id}/ire-referrals
    description: "Forward a NOTIFIED adverse appeal to the IRE"
    roles: [ComplianceOfficer]
    code: 201
    input: [ire_organization_code]
    output: IndependentReviewReferral
    side_effects: ["Case NOTIFIED->IRE_REFERRED", "increments GrievanceAppealCase.version by 1"]
  - method: GET
    path: /appeals/ire-referrals/{id}
    description: "Fetch one referral"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: IndependentReviewReferral
    side_effects: []
  - method: POST
    path: /appeals/ire-referrals/{id}/ire-acknowledge
    description: "Record IRE acknowledgement"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: IndependentReviewReferral
    side_effects: ["increments IndependentReviewReferral.version by 1"]
  - method: POST
    path: /appeals/ire-referrals/{id}/ire-record-decision
    description: "Record the IRE decision; spawns Effectuation when plan is overturned/partial"
    roles: [ComplianceOfficer]
    code: 200
    input: [ire_decision, "payment_amount_cents?"]
    output: IndependentReviewReferral
    side_effects: ["Creates Effectuation(referral_id set) when ire_decision != UPHOLD_PLAN", "increments IndependentReviewReferral.version by 1"]

  # ---- effectuations ----
  - method: GET
    path: /appeals/effectuations/{id}
    description: "Fetch one effectuation"
    roles: [PlatformAdmin, ComplianceOfficer, ClaimsProcessor]
    code: 200
    input: []
    output: Effectuation
    side_effects: []
  - method: GET
    path: /appeals/effectuations
    description: "List effectuations with filters (reverse-reachability for referral_id)"
    roles: [PlatformAdmin, ComplianceOfficer, ClaimsProcessor]
    code: 200
    input: ["case_id?", "referral_id?", "status?", "limit?", "offset?"]
    output: Effectuation[]
    side_effects: []
  - method: POST
    path: /appeals/effectuations/{id}/start
    description: "Begin effectuation (W-9 gate for payments)"
    roles: [ClaimsProcessor]
    code: 200
    input: []
    output: Effectuation
    side_effects: ["Effectuation PENDING->IN_PROGRESS", "increments Effectuation.version by 1"]
  - method: POST
    path: /appeals/effectuations/{id}/complete
    description: "Complete effectuation (OCC-guarded); computes timeliness_percent"
    roles: [ClaimsProcessor]
    code: 200
    input: [expected_effectuation_version]
    output: Effectuation
    side_effects: ["Effectuation ->EFFECTUATED", "Referral auto-transition when referral_id set", "increments Effectuation.version by 1"]
  - method: POST
    path: /appeals/effectuations/{id}/waive
    description: "Waive a zero-amount effectuation"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Effectuation
    side_effects: ["Effectuation PENDING->WAIVED", "increments Effectuation.version by 1"]
  - method: POST
    path: /appeals/effectuations/{id}/escalate
    description: "Escalate an OVERDUE effectuation"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Effectuation
    side_effects: ["increments Effectuation.version by 1"]

  # ---- reopenings ----
  - method: POST
    path: /appeals/reopenings
    description: "Request reopening of a CLOSED case"
    roles: [ComplianceOfficer, MemberServicesRep]
    code: 201
    input: [case_id, request_reason]
    output: Reopening
    side_effects: ["Append CaseEvent(event_type=REOPEN_REQUESTED) on source case"]
  - method: GET
    path: /appeals/reopenings/{id}
    description: "Fetch one reopening"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Reopening
    side_effects: []
  - method: POST
    path: /appeals/reopenings/{id}/begin-review
    description: "REQUESTED -> UNDER_REVIEW"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Reopening
    side_effects: ["increments Reopening.version by 1"]
  - method: POST
    path: /appeals/reopenings/{id}/grant
    description: "Grant a reopening (OCC-guarded against the source case); spawns replacement case"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_case_version]
    output: Reopening
    side_effects: ["Source case CLOSED->REOPENED", "Spawn new GrievanceAppealCase(reopened_from_case_id set, status RECEIVED)", "Supersede DETERMINED ClinicalReviews on source case", "Increment Member.open_case_count", "increments Reopening.version by 1"]
  - method: POST
    path: /appeals/reopenings/{id}/deny
    description: "Deny a reopening"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Reopening
    side_effects: ["increments Reopening.version by 1"]

  # ---- audit universe ----
  - method: POST
    path: /appeals/audit-universe/snapshot
    description: "Build the audit universe for a report period (chronological snapshot of decided cases)"
    roles: [ComplianceOfficer]
    code: 201
    input: [report_period]
    output: "{ report_period: string, rows_created: integer }"
    side_effects: ["Create one AuditUniverseRecord per decided case in the half-open period window; duplicate snapshot for same (report_period, case_id) is rejected ERR_DUPLICATE_SNAPSHOT"]
  - method: GET
    path: /appeals/audit-universe
    description: "List audit universe records with filters"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["report_period?", "case_id?", "case_kind?", "priority_track?", "resolution_timely?", "limit?", "offset?"]
    output: AuditUniverseRecord[]
    side_effects: []
  - method: GET
    path: /appeals/audit-universe/{id}
    description: "Fetch one audit universe record by id"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: AuditUniverseRecord
    side_effects: []
  - method: GET
    path: /appeals/audit-universe/compliance-summary
    description: "Compliance-attribution variant aggregation over a report period"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: [report_period]
    output: "{ report_period: string, total_cases: integer, resolution_timely_count: integer, resolution_timely_rate: number, intake_delay_count: integer, reviewer_late_count: integer, effectuation_timely_rate: number }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Authenticated role is not in the endpoint's roles list"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id does not reference an existing row"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "Body FK (member_id, provider_id, case_id, referral_id, reopened_from_case_id) references a missing row"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not declared from the resource's current state"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Mutation attempted on a terminal-state resource"
  - id: ERR_DUTY_SEGREGATION
    http: 422
    condition: "Same user attempts two steps that segregation of duties forbids (triage vs decide; request vs self-assign review)"
  - id: ERR_CLINICAL_REVIEW_REQUIRED
    http: 422
    condition: "Non-grievance case decided directly from IN_REVIEW without a DETERMINED ClinicalReview"
  - id: ERR_ACK_WINDOW_MISSED
    http: 422
    condition: "Triage attempted more than 24h after received_at"
  - id: ERR_IRE_WINDOW_MISSED
    http: 422
    condition: "IRE referral attempted more than 72h after decided_at"
  - id: ERR_REOPEN_WINDOW_MISSED
    http: 422
    condition: "NEW_EVIDENCE/CLERICAL_ERROR reopening requested more than 180 days after source case closed_at"
  - id: ERR_REVIEW_IN_FLIGHT
    http: 409
    condition: "Second clinical review requested while one is live"
  - id: ERR_EXTENSION_CONSUMED
    http: 422
    condition: "Extension already applied to this case, or policy grants no extension hours"
  - id: ERR_EXPEDITED_NOT_ALLOWED
    http: 422
    condition: "Expedited handling requested/applied to a GRIEVANCE case"
  - id: ERR_POLICY_NOT_CONFIGURED
    http: 422
    condition: "No active DeadlinePolicy for the case's (program, case_kind, priority_track) triple"
  - id: ERR_NOTIFICATION_INCOMPLETE
    http: 422
    condition: "mark-sent attempted while completeness_score < 1.00"
  - id: ERR_W9_REQUIRED
    http: 422
    condition: "Payment effectuation started without Provider.w9_on_file"
  - id: ERR_WAIVER_NOT_ALLOWED
    http: 422
    condition: "Waive attempted on an effectuation with payment_amount_cents > 0"
  - id: ERR_PAYMENT_NOT_ALLOWED
    http: 422
    condition: "payment_amount_cents supplied with decision_outcome == UNFAVORABLE, or negative"
  - id: ERR_DUPLICATE_CASE
    http: 409
    condition: "Intake duplicates an existing non-terminal case for the same (member_id, case_kind, provider_id) within 1h"
  - id: ERR_DUPLICATE_SNAPSHOT
    http: 409
    condition: "Audit snapshot re-run for a (report_period, case_id) already captured"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_*_version does not match the parent's current version"
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed payload: missing required field, wrong type, enum value outside constraints"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Opaque operator role: seeds members, providers, deadline policies; drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /appeals/members"
      - "POST /appeals/providers"
      - "PATCH /appeals/providers/{id}"
      - "POST /appeals/deadline-policies"
      - "POST /appeals/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (all)"
  - name: IntakeSpecialist
    description: "Plan intake staff who register and triage cases"
    identity: opaque
    exclusive_operations:
      - "POST /appeals/cases"
      - "POST /appeals/cases/{id}/triage"
    shared_operations:
      - "POST /appeals/cases/{id}/events"
      - "GET endpoints (cases, members)"
  - name: CaseAnalyst
    description: "Utilization-management analyst who works the case and requests clinical review"
    identity: opaque
    exclusive_operations:
      - "POST /appeals/cases/{id}/begin-review"
      - "POST /appeals/cases/{id}/clinical-reviews"
    shared_operations:
      - "POST /appeals/cases/{id}/decide (grievances only)"
      - "POST /appeals/cases/{id}/events"
      - "GET endpoints"
  - name: MedicalDirector
    description: "Physician reviewer; performs clinical determination and expedited upgrades"
    identity: opaque
    exclusive_operations:
      - "POST /appeals/clinical-reviews/{id}/assign"
      - "POST /appeals/clinical-reviews/{id}/draft-determination"
      - "POST /appeals/clinical-reviews/{id}/finalize-determination"
      - "POST /appeals/cases/{id}/expedite"
    shared_operations:
      - "POST /appeals/cases/{id}/decide (clinical path)"
      - "GET endpoints"
  - name: MemberServicesRep
    description: "Member-facing staff: notifications, extensions, withdrawals, reopening intake"
    identity: opaque
    exclusive_operations:
      - "POST /appeals/cases/{id}/notifications"
      - "PATCH /appeals/notifications/{id}"
      - "POST /appeals/notifications/{id}/mark-sent"
      - "POST /appeals/notifications/{id}/mark-delivered"
      - "POST /appeals/notifications/{id}/mark-failed"
      - "POST /appeals/notifications/{id}/retry"
      - "POST /appeals/cases/{id}/extensions"
      - "POST /appeals/cases/{id}/withdraw"
    shared_operations:
      - "POST /appeals/reopenings"
      - "POST /appeals/cases/{id}/events"
      - "GET endpoints"
  - name: ComplianceOfficer
    description: "Regulatory compliance: IRE referrals, reopening adjudication, case closure, audit universe"
    identity: opaque
    exclusive_operations:
      - "POST /appeals/cases/{id}/ire-referrals"
      - "POST /appeals/ire-referrals/{id}/ire-acknowledge"
      - "POST /appeals/ire-referrals/{id}/ire-record-decision"
      - "POST /appeals/cases/{id}/close"
      - "POST /appeals/reopenings/{id}/begin-review"
      - "POST /appeals/reopenings/{id}/grant"
      - "POST /appeals/reopenings/{id}/deny"
      - "POST /appeals/effectuations/{id}/waive"
      - "POST /appeals/effectuations/{id}/escalate"
      - "POST /appeals/audit-universe/snapshot"
    shared_operations:
      - "POST /appeals/reopenings"
      - "POST /appeals/cases/{id}/events"
      - "GET endpoints"
  - name: ClaimsProcessor
    description: "Claims payment staff executing effectuations"
    identity: opaque
    exclusive_operations:
      - "POST /appeals/effectuations/{id}/start"
      - "POST /appeals/effectuations/{id}/complete"
    shared_operations:
      - "GET endpoints (cases, providers, effectuations)"
