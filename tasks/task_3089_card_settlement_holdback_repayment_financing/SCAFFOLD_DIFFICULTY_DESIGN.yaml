# =============================================================================
# §1.8 Scaffold Difficulty Design — Card-Settlement Holdback Repayment Financing
# 9 Difficulty Rules x 2 instances each = 18 instances.
# Fixture conventions:
#   - Logical clock default: 2026-09-01T00:00:00Z (no set call needed for t0).
#   - Flat history: 12 monthly batches (1st of each month 2025-09 .. 2026-08),
#     gross=net=1,000,000 cents each -> avg 1,000,000 -> preapproved 1,250,000.
#   - Seasonal history: Sep2025-Feb2026 net 2,000,000; Mar2026-Aug2026 net
#     500,000 -> avg 1,250,000, index 1.2, standard 1,550,000, conservative
#     1,050,000.
#   - Accept 1,050,000 @ holdback 0.10 -> fee 115,500, total 1,165,500,
#     per-period minimum floor(1,165,500/18) = 64,750.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: offer_preapproval_seasonal_haircut
        grounds:
          - calculations.offer_preapproval
          - entities.LoanOffer.fields.preapproved_standard_cents
          - entities.LoanOffer.fields.preapproved_conservative_cents
        distinguishing_aspect: |
          Dual-variant calculation on the LoanOffer domain: identical seasonal
          history yields STANDARD 1,550,000 vs CONSERVATIVE 1,050,000 cents;
          because seasonality_index 1.2 > 0.75 the selected preapproved_cents
          is the CONSERVATIVE variant (1,050,000), not the STANDARD one.
        test_recipe:
          setup:
            - "Seasonal merchant (TX): 6 batches net 2,000,000 (Sep2025-Feb2026), 6 batches net 500,000 (Mar2026-Aug2026), all FINALIZED; merchant ELIGIBLE"
          setup_api_calls:
            - call: "POST /lending/merchants"
              payload: { legal_name: "Seasonal Co", state_code: "TX", owner_name: "Sam Snow", processing_started_at: "2023-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-09-01", gross_cents: 2000000 }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - call: "POST /lending/processing_batches/${b1}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-10-01", gross_cents: 2000000 }
              as: PlatformAdmin
              captures: { b2: $.data.id }
            - call: "POST /lending/processing_batches/${b2}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-11-01", gross_cents: 2000000 }
              as: PlatformAdmin
              captures: { b3: $.data.id }
            - call: "POST /lending/processing_batches/${b3}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-12-01", gross_cents: 2000000 }
              as: PlatformAdmin
              captures: { b4: $.data.id }
            - call: "POST /lending/processing_batches/${b4}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-01-01", gross_cents: 2000000 }
              as: PlatformAdmin
              captures: { b5: $.data.id }
            - call: "POST /lending/processing_batches/${b5}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-02-01", gross_cents: 2000000 }
              as: PlatformAdmin
              captures: { b6: $.data.id }
            - call: "POST /lending/processing_batches/${b6}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-03-01", gross_cents: 500000 }
              as: PlatformAdmin
              captures: { b7: $.data.id }
            - call: "POST /lending/processing_batches/${b7}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-04-01", gross_cents: 500000 }
              as: PlatformAdmin
              captures: { b8: $.data.id }
            - call: "POST /lending/processing_batches/${b8}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-05-01", gross_cents: 500000 }
              as: PlatformAdmin
              captures: { b9: $.data.id }
            - call: "POST /lending/processing_batches/${b9}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-06-01", gross_cents: 500000 }
              as: PlatformAdmin
              captures: { b10: $.data.id }
            - call: "POST /lending/processing_batches/${b10}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-07-01", gross_cents: 500000 }
              as: PlatformAdmin
              captures: { b11: $.data.id }
            - call: "POST /lending/processing_batches/${b11}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-08-01", gross_cents: 500000 }
              as: PlatformAdmin
              captures: { b12: $.data.id }
            - call: "POST /lending/processing_batches/${b12}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/activate"
              as: PlatformAdmin
          trigger:
            - call: "POST /lending/merchants/${m_id}/offers"
              as: Underwriter
              captures: { o_id: $.data.id }
            - call: "GET /lending/offers/${o_id}"
              as: Underwriter
              captures:
                std: $.data.preapproved_standard_cents
                con: $.data.preapproved_conservative_cents
                sel: $.data.preapproved_cents
          assert:
            - "LoanOffer.${o_id}.preapproved_standard_cents == 1550000"
            - "LoanOffer.${o_id}.preapproved_conservative_cents == 1050000"
            - "LoanOffer.${o_id}.preapproved_cents == 1050000"
            - "LoanOffer.${o_id}.seasonality_index_at_generation == 1.2"
            - "LoanOffer.${o_id}.trailing_12m_avg_net_cents == 1250000"

      - name: migration_risk_variant_divergence
        grounds:
          - calculations.migration_risk
          - entities.MigrationSignal.fields.volume_only_would_trigger
          - entities.MigrationSignal.fields.triggered
        distinguishing_aspect: |
          Dual-variant calculation on the Merchant/MigrationSignal domain
          (distinct entity domain from LoanOffer): prior-30d net 4,000,000 vs
          trailing-30d net 1,800,000 gives drop_ratio 0.55 < 0.60, so the
          VOLUME_ONLY variant does NOT trigger, but the active
          VOLUME_AND_CHARGEBACK variant DOES trigger because the trailing
          chargeback ratio 0.0556 > 0.03.
        test_recipe:
          setup:
            - "Merchant (TX) ELIGIBLE with 10 monthly batches net 1,000,000 (Sep2025-Jun2026), batch 2026-07-15 net 4,000,000 (prior window), batch 2026-08-15 gross 2,000,000 refunds 100,000 chargebacks 100,000 -> net 1,800,000 (trailing window)"
          setup_api_calls:
            - call: "POST /lending/merchants"
              payload: { legal_name: "Migrator Inc", state_code: "TX", owner_name: "Mig Rator", processing_started_at: "2023-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-09-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /lending/processing_batches/${c1}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-10-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /lending/processing_batches/${c2}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-11-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { c3: $.data.id }
            - call: "POST /lending/processing_batches/${c3}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-12-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { c4: $.data.id }
            - call: "POST /lending/processing_batches/${c4}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-01-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { c5: $.data.id }
            - call: "POST /lending/processing_batches/${c5}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-02-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { c6: $.data.id }
            - call: "POST /lending/processing_batches/${c6}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-03-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { c7: $.data.id }
            - call: "POST /lending/processing_batches/${c7}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-04-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { c8: $.data.id }
            - call: "POST /lending/processing_batches/${c8}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-05-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { c9: $.data.id }
            - call: "POST /lending/processing_batches/${c9}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-06-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { c10: $.data.id }
            - call: "POST /lending/processing_batches/${c10}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-07-15", gross_cents: 4000000 }
              as: PlatformAdmin
              captures: { c11: $.data.id }
            - call: "POST /lending/processing_batches/${c11}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-08-15", gross_cents: 2000000, refunds_cents: 100000, chargebacks_cents: 100000 }
              as: PlatformAdmin
              captures: { c12: $.data.id }
            - call: "POST /lending/processing_batches/${c12}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/activate"
              as: PlatformAdmin
          trigger:
            - call: "POST /lending/merchants/${m_id}/migration_signals/evaluate"
              as: ServicerAgent
              captures: { sig_id: $.data.id }
          assert:
            - "MigrationSignal.${sig_id}.drop_ratio == 0.55"
            - "MigrationSignal.${sig_id}.volume_only_would_trigger == false"
            - "MigrationSignal.${sig_id}.triggered == true"
            - "MigrationSignal.${sig_id}.status == DETECTED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: offer_formula_tiered_min_max
        grounds:
          - calculations.offer_preapproval
        distinguishing_aspect: |
          Mode (a) combinatorial formula with >=3 inputs and non-linear
          interaction: avg_month_net x 1.25 multiplier, min/max seasonality
          haircut branch, and floor-to-$500 rounding. Flat history (12 x
          1,000,000) yields preapproved_standard == preapproved_conservative ==
          preapproved == 1,250,000 exactly on the $500 rounding step.
        test_recipe:
          setup:
            - "Flat merchant (TX): 12 monthly batches net 1,000,000 (Sep2025-Aug2026), all FINALIZED; merchant ELIGIBLE"
          setup_api_calls:
            - call: "POST /lending/merchants"
              payload: { legal_name: "Flat Co", state_code: "TX", owner_name: "Flat Line", processing_started_at: "2023-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-09-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { d1: $.data.id }
            - call: "POST /lending/processing_batches/${d1}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-10-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { d2: $.data.id }
            - call: "POST /lending/processing_batches/${d2}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-11-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { d3: $.data.id }
            - call: "POST /lending/processing_batches/${d3}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-12-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { d4: $.data.id }
            - call: "POST /lending/processing_batches/${d4}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-01-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { d5: $.data.id }
            - call: "POST /lending/processing_batches/${d5}/finalize"
