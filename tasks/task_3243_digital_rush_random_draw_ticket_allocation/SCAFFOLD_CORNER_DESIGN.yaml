            as: OpsManager
            captures: { prod_v: $.data.version }
          - call: "POST /performances"
            payload: { production_id: "${prod_id}", market_code: "NYC", venue_name: "Idempotent Theatre", starts_at: "2026-10-05T19:00:00Z", face_value_cents: 10000, total_seat_capacity: 30 }
            as: OpsManager
            captures: { perf_id: $.data.id, perf_v_created: $.data.version }
          - call: "POST /performances/${perf_id}/status-transitions"
            payload: { to_status: "ONSALE", expected_performance_version: "${perf_v_created}" }
            as: OpsManager
            captures: { perf_v: $.data.version }
          - call: "POST /performances/${perf_id}/allocations"
            payload: { ticket_type: "RUSH", daily_quantity: 5, discount_pct: 0.5, release_time_local: "09:00", refundable: true, per_order_limit: 2 }
            as: AllocationsCoordinator
            captures: { alloc_id: $.data.id, alloc_v_created: $.data.version }
          - call: "POST /allocations/${alloc_id}/scheduling"
            payload: { expected_allocation_version: "${alloc_v_created}" }
            as: AllocationsCoordinator
            captures: { alloc_v: $.data.version }
          - call: "POST /allocations/${alloc_id}/releases/2026-09-12"
            payload: { expected_production_version: "${prod_v}", expected_performance_version: "${perf_v}", expected_allocation_version: "${alloc_v}" }
            as: OpsManager
          - call: "POST /patrons/registrations"
            payload: { email: "idem_patron@x.com", display_name: "Idem Patron", market_code: "NYC" }
            as: Anonymous
            captures: { pat_id: $.data.id }
          - call: "POST /performances/${perf_id}/queue-positions"
            payload: { allocation_id: "${alloc_id}" }
            as: Patron
            as_user_id: "${pat_id}"
          - call: "POST /ops-runs"
            payload: { as_of_iso8601: "2026-09-12T09:05:00Z" }
            as: PlatformAdmin
        trigger:
          - call: "POST /purchases"
            payload: { performance_id: "${perf_id}", allocation_id: "${alloc_id}", quantity: 2, idempotency_key: "idem-key-1" }
            as: Patron
            as_user_id: "${pat_id}"
            captures: { first_pur: $.data.id }
          - call: "POST /purchases"
            payload: { performance_id: "${perf_id}", allocation_id: "${alloc_id}", quantity: 2, idempotency_key: "idem-key-1" }
            as: Patron
            as_user_id: "${pat_id}"
            captures: { second_pur: $.data.id }
        assert:
          - "the replayed call returned 201 and ${second_pur} == ${first_pur}, the same order identifier"
          - "RushAllocation.${alloc_id}.quantity_sold_today == 2, advanced exactly once despite two identical requests"
          - "GET /purchases?performance_id=${perf_id} returns exactly 1 row"
          - "the replay did not raise ERR_ALLOCATION_EXHAUSTED because it consumed no additional seat"

# ===========================================================================
- section: consistency_model
  instances:

    - name: saga_refund_rejection_leaves_the_purchase_untouched
      claim_type: saga
      grounds:
        - state_machines.RefundRequest.REQUESTED_to_REJECTED
        - calculations.refund_amount
        - entities.TicketPurchase.fields.refunded_cents
      distinguishing_aspect: "The refund workflow is a saga whose rejection step is a compensating no-op: rejecting a processing refund leaves refunded_cents, payment_status and quantity_sold_today exactly as the approval step found them, with no partial money movement to unwind."
      test_recipe:
        setup:
          - "Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production with refund_window_hours 720 and an ONSALE performance starting 2026-10-05."
          - "A released RUSH allocation with daily_quantity 6, holding a settled two-ticket purchase and a refund request already moved into PROCESSING."
        setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-12T09:00:00Z" }
            as: PlatformAdmin
          - call: "POST /markets"
            payload: { market_code: "NYC", city: "New York", handoff_model: "MOBILE_PUSH" }
            as: PlatformAdmin
          - call: "POST /productions"
            payload: { title: "Saga Theatre Play", producer_org: "Corner Partners", refund_window_hours: 720, exchange_fee_cents: 300, exchange_allowed: true }
            as: OpsManager
            captures: { prod_id: $.data.id, prod_v_created: $.data.version }
          - call: "POST /productions/${prod_id}/status-transitions"
            payload: { to_status: "ACTIVE", expected_production_version: "${prod_v_created}" }
            as: OpsManager
            captures: { prod_v: $.data.version }
          - call: "POST /performances"
            payload: { production_id: "${prod_id}", market_code: "NYC", venue_name: "Saga Theatre", starts_at: "2026-10-05T19:00:00Z", face_value_cents: 10000, total_seat_capacity: 30 }
            as: OpsManager
            captures: { perf_id: $.data.id, perf_v_created: $.data.version }
          - call: "POST /performances/${perf_id}/status-transitions"
            payload: { to_status: "ONSALE", expected_performance_version: "${perf_v_created}" }
            as: OpsManager
            captures: { perf_v: $.data.version }
          - call: "POST /performances/${perf_id}/allocations"
            payload: { ticket_type: "RUSH", daily_quantity: 6, discount_pct: 0.5, release_time_local: "09:00", refundable: true, per_order_limit: 2 }
            as: AllocationsCoordinator
            captures: { alloc_id: $.data.id, alloc_v_created: $.data.version }
          - call: "POST /allocations/${alloc_id}/scheduling"
            payload: { expected_allocation_version: "${alloc_v_created}" }
            as: AllocationsCoordinator
            captures: { alloc_v: $.data.version }
          - call: "POST /allocations/${alloc_id}/releases/2026-09-12"
            payload: { expected_production_version: "${prod_v}", expected_performance_version: "${perf_v}", expected_allocation_version: "${alloc_v}" }
            as: OpsManager
          - call: "POST /patrons/registrations"
            payload: { email: "saga_patron@x.com", display_name: "Saga Patron", market_code: "NYC" }
            as: Anonymous
            captures: { pat_id: $.data.id }
          - call: "POST /performances/${perf_id}/queue-positions"
            payload: { allocation_id: "${alloc_id}" }
            as: Patron
            as_user_id: "${pat_id}"
          - call: "POST /ops-runs"
            payload: { as_of_iso8601: "2026-09-12T09:05:00Z" }
            as: PlatformAdmin
          - call: "POST /purchases"
            payload: { performance_id: "${perf_id}", allocation_id: "${alloc_id}", quantity: 2, idempotency_key: "saga-1" }
            as: Patron
            as_user_id: "${pat_id}"
            captures: { pur_id: $.data.id, pur_v0: $.data.version }
          - call: "POST /purchases/${pur_id}/settlements"
            payload: { expected_purchase_version: "${pur_v0}" }
            as: FinancialOps
            captures: { pur_v1: $.data.version }
          - call: "POST /purchases/${pur_id}/refund-requests"
            payload: { reason_code: "PATRON_REQUEST", expected_purchase_version: "${pur_v1}" }
            as: Patron
            as_user_id: "${pat_id}"
            captures: { refund_id: $.data.id, pur_v2: $.data.version }
          - call: "POST /refunds/${refund_id}/approvals"
            payload: { decision: "APPROVE", expected_purchase_version: "${pur_v2}" }
            as: CustomerService
            captures: { pur_v3: $.data.version }
        trigger:
          - call: "POST /refunds/${refund_id}/approvals"
            payload: { decision: "REJECT", expected_purchase_version: "${pur_v3}" }
            as: CustomerService
            captures: { st: $.data.status }
          - call: "GET /purchases/${pur_id}"
            payload: {}
            as: FinancialOps
            captures: { ref_after: $.data.refunded_cents, pay_after: $.data.payment_status }
        assert:
          - "the rejection reported ${st} == REJECTED"
          - "TicketPurchase.${pur_id}.refunded_cents == ${ref_after} and it equals 0, unchanged because no money had moved"
          - "TicketPurchase.${pur_id}.payment_status == ${pay_after} and it is SETTLED, the same value the approval step observed"
          - "RushAllocation.${alloc_id}.quantity_sold_today == 2, unchanged, so the rejection left the seat accounting at its pre-request value"
          - "no reversal row was needed because the rejection branch is itself the compensating no-op"
