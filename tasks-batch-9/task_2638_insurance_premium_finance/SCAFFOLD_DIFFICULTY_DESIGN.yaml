          setup:
            - "logical clock at 2026-09-01; one TX StateRateRule with an effective License; one Insured; one ProducerAgent; one Insurer"
            - "one ACTIVE agreement: single VERIFIED 600000 policy, down 100000, service fee 2000, 6 installments, first due 2026-10-01 -> amount_financed 502000, finance charge 37650, total_of_payments 539650, six SCHEDULED installments of 89941 x 5 plus 89945"
