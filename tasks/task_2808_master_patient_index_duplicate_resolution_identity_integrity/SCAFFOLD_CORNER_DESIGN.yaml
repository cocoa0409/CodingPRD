      - name: re_triggering_a_finished_transition_returns_that_entity_s_invalid_state_error
        claim_type: error_triggerable
        grounds:
          - errors[ERR_MERGE_INVALID_STATE]
          - errors[ERR_OVERLAY_INVALID_STATE]
          - errors[ERR_REMEDIATION_INVALID_STATE]
          - errors[ERR_TASK_INVALID_STATE]
        distinguishing_aspect: "Each lifecycle reports its own 409 code when a trigger is replayed against a state that no longer admits it, and every one of the four rejected calls leaves its entity's version untouched."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite XB-SITE, one MatchRuleSet RS-BASE and one ACTIVE DownstreamSystem XB-SYS (BATCH, ack_required true, max_concurrent_dispatch 1)."
            - "Records XB-1000 (2 elements) and XB-2000 (30 elements) share all seven scored attributes (AUTO_LINK, pair minted in RECOMMENDED_MERGE with recommended_by_user_id null); XB-3000 is unrelated."
            - "The merge moves 30 elements, so it sits in PENDING_PROPAGATION with one QUEUED task and opens a ContaminationRemediation (element_count_subject 30). The remediation is quarantined for 30 and then closed."
            - "The merge is then unmerged (permitted: its only task is QUEUED, not SENT), which also cancels that task."
            - "Separately, an OverlayCorrection on XB-3000 is applied, leaving it UNDER_CORRECTION and minting a second QUEUED task."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "XB-SITE", name: "Invalid State Clinic", region_code: "US-MD", registrar_headcount: 3 }
              as: MpiAdmin
              captures: { site_xb_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
