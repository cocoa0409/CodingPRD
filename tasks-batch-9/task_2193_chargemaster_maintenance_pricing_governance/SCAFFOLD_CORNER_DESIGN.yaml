              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0250", description: "Pharmacy supplies", requires_hcpcs: true, allowed_code_types: ["HCPCS"], pricing_class: "SUPPLY" }
