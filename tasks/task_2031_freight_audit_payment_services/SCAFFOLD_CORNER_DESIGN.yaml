# =============================================================================
# Task 2031: Freight Audit & Payment Services — §1.9 Corner Design (Coverage Index)
# Breadth probe over every testable claim §1.8 does not already cover.
# =============================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: client_create_applies_defaults
        claim_type: defaults
        grounds: [entities.ClientAccount.fields.audit_tolerance_minor, entities.ClientAccount.fields.status]
        distinguishing_aspect: "Omitting optional tolerance/window fields applies defaults 500 / 200bp / 30 days and initial status ONBOARDING."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
          trigger:
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD" }
              as: FapAdmin
              captures: { cl: $.data.id, tol: $.data.audit_tolerance_minor, bp: $.data.audit_tolerance_pct_bp, dw: $.data.dispute_window_days, st: $.data.status }
          assert:
            - "${tol} == 500, ${bp} == 200, ${dw} == 30, ${st} == ONBOARDING"
            - "version == 1 and created_at == 2026-08-01T00:00:00.000Z (logical clock default)"

      - name: invoice_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.CarrierInvoice.fields.invoice_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required invoice_number on invoice create yields ERR_INVALID_REQUEST (400), not a 409 business error."
        test_recipe:
          setup: ["Client ACTIVE; carrier ACTIVE"]
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD" }
              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "CARR", legal_name: "Carrier One", country: "US", billing_currency: "USD", remit_email: "r@c.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
          trigger:
            - call: "POST /fap/clients/${cl}/invoices"
              payload: { carrier_id: "${ca}", invoice_date: "2026-08-03", currency: "USD", billed_total_minor: 100, lines: [ { charge_code: "OTHER", billed_amount_minor: 100 } ] }
              as: AuditAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST (HTTP 400)"

      - name: shipment_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.ShipmentRecord.fields.mode, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "mode value outside {PARCEL, LTL, FTL, AIR, OCEAN} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Client ACTIVE; carrier ACTIVE"]
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD" }
              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "CARR", legal_name: "Carrier One", country: "US", billing_currency: "USD", remit_email: "r@c.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
          trigger:
            - call: "POST /fap/clients/${cl}/shipments"
              payload: { carrier_id: "${ca}", pro_number: "PRO-1", ship_date: "2026-08-02", origin_country: "US", dest_country: "CA", mode: "SPACESHIP", actual_weight_kg: 10 }
              as: AuditAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST (HTTP 400)"

      - name: carrier_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but unknown carrier id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
          trigger:
            - call: "GET /fap/carriers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: FapAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND (HTTP 404)"

      - name: invoice_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, "endpoints.GET /fap/invoices"]
        distinguishing_aspect: "Pagination envelope fields total_count/has_more behave with explicit limit=2 over 3 invoices."
        test_recipe:
          setup: ["Client ACTIVE; carrier ACTIVE; three invoices created"]
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD" }
              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "CARR", legal_name: "Carrier One", country: "US", billing_currency: "USD", remit_email: "r@c.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
            - call: "POST /fap/clients/${cl}/invoices"
              payload: { carrier_id: "${ca}", invoice_number: "INV-A", invoice_date: "2026-08-03", currency: "USD", billed_total_minor: 100, lines: [ { charge_code: "OTHER", billed_amount_minor: 100 } ] }
              as: AuditAnalyst
            - call: "POST /fap/clients/${cl}/invoices"
              payload: { carrier_id: "${ca}", invoice_number: "INV-B", invoice_date: "2026-08-04", currency: "USD", billed_total_minor: 200, lines: [ { charge_code: "OTHER", billed_amount_minor: 200 } ] }
              as: AuditAnalyst
            - call: "POST /fap/clients/${cl}/invoices"
              payload: { carrier_id: "${ca}", invoice_number: "INV-C", invoice_date: "2026-08-05", currency: "USD", billed_total_minor: 300, lines: [ { charge_code: "OTHER", billed_amount_minor: 300 } ] }
              as: AuditAnalyst
          trigger:
            - call: "GET /fap/invoices?client_id=${cl}&limit=2&offset=0"
              payload: {}
              as: FapAdmin
          assert:
            - "response is an array of length 2; meta/envelope exposes total_count == 3 and has_more == true"
            - "second page (offset=2) returns 1 row with has_more == false"

      - name: invoice_number_released_after_void
        claim_type: type_constraints
        grounds: ["errors[ERR_DUPLICATE_INVOICE_NUMBER]", state_machines.CarrierInvoice]
        distinguishing_aspect: "invoice_number uniqueness spans only non-VOIDED invoices: a duplicate create fails 409, then voiding the original lets the same number be created again."
        test_recipe:
          setup: ["Client ACTIVE; carrier ACTIVE; invoice INV-DUP captured"]
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD" }
              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "CARR", legal_name: "Carrier One", country: "US", billing_currency: "USD", remit_email: "r@c.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
            - call: "POST /fap/clients/${cl}/invoices"
              payload: { carrier_id: "${ca}", invoice_number: "INV-DUP", invoice_date: "2026-08-03", currency: "USD", billed_total_minor: 100, lines: [ { charge_code: "OTHER", billed_amount_minor: 100 } ] }
              as: AuditAnalyst
              captures: { inv: $.data.id }
            - { call: "POST /fap/invoices/${inv}/capture", payload: {}, as: AuditAnalyst }
          trigger:
            - call: "POST /fap/clients/${cl}/invoices"
              payload: { carrier_id: "${ca}", invoice_number: "INV-DUP", invoice_date: "2026-08-03", currency: "USD", billed_total_minor: 100, lines: [ { charge_code: "OTHER", billed_amount_minor: 100 } ] }
              as: AuditAnalyst
              captures: { err: $.data.error_id }
            - { call: "POST /fap/invoices/${inv}/void", payload: {}, as: AuditAnalyst }
            - call: "POST /fap/clients/${cl}/invoices"
              payload: { carrier_id: "${ca}", invoice_number: "INV-DUP", invoice_date: "2026-08-03", currency: "USD", billed_total_minor: 100, lines: [ { charge_code: "OTHER", billed_amount_minor: 100 } ] }
              as: AuditAnalyst
              captures: { inv2: $.data.id }
          assert:
            - "First duplicate attempt: ${err} == ERR_DUPLICATE_INVOICE_NUMBER (HTTP 409)"
            - "After voiding the original (CAPTURED -> VOIDED), the same number creates successfully: ${inv2} is a new id != ${inv}"

      - name: pro_number_uniqueness_and_release_after_void
        claim_type: type_constraints
        grounds: ["errors[ERR_DUPLICATE_PRO_NUMBER]", state_machines.ShipmentRecord]
        distinguishing_aspect: "pro_number uniqueness spans only non-VOIDED shipments of the same client+carrier; voiding releases it."
        test_recipe:
          setup: ["Client ACTIVE; carrier ACTIVE; shipment PRO-1 registered"]
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD" }
              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "CARR", legal_name: "Carrier One", country: "US", billing_currency: "USD", remit_email: "r@c.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
            - call: "POST /fap/clients/${cl}/shipments"
              payload: { carrier_id: "${ca}", pro_number: "PRO-1", ship_date: "2026-08-02", origin_country: "US", dest_country: "CA", mode: "LTL", actual_weight_kg: 10 }
              as: AuditAnalyst
              captures: { sh: $.data.id }
          trigger:
            - call: "POST /fap/clients/${cl}/shipments"
              payload: { carrier_id: "${ca}", pro_number: "PRO-1", ship_date: "2026-08-02", origin_country: "US", dest_country: "CA", mode: "LTL", actual_weight_kg: 10 }
              as: AuditAnalyst
              captures: { err: $.data.error_id }
            - { call: "POST /fap/shipments/${sh}/void", payload: {}, as: AuditAnalyst }
            - call: "POST /fap/clients/${cl}/shipments"
              payload: { carrier_id: "${ca}", pro_number: "PRO-1", ship_date: "2026-08-02", origin_country: "US", dest_country: "CA", mode: "LTL", actual_weight_kg: 10 }
              as: AuditAnalyst
              captures: { sh2: $.data.id }
          assert:
            - "Duplicate while live: ${err} == ERR_DUPLICATE_PRO_NUMBER (HTTP 409)"
            - "After REGISTERED -> VOIDED, same pro_number recreates: ${sh2} != ${sh}"

  - section: state_machines
    instances:
      - name: invoice_capture_from_cleared_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.CarrierInvoice, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "capture is declared only from audit:RECEIVED; calling it on a CLEARED invoice fails with ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["Standard USD chain; invoice INV-0001 fully audited to CLEARED"]
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD" }
              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "CARR", legal_name: "Carrier One", country: "US", billing_currency: "USD", payment_terms_days: 14, remit_email: "r@c.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
            - { call: "POST /fap/carriers/${ca}/approve_onboard", payload: {}, as: FapAdmin }
            - call: "POST /fap/carriers/${ca}/rate-contracts"
              payload:
                name: "C1"
                currency: "USD"
                lanes:
                  - { origin_country: "US", dest_country: "CA", mode: "LTL", weight_breaks: [ { min_kg: 0, rate_per_kg_minor: 150 } ], fuel_surcharge_pct_bp: 1000, accessorials: [ { code: "LIFTGATE", flat_minor: 5000, cap_pct_bp: 2000 } ], minimum_charge_minor: 20000 }
                effective_from: "2026-08-01"
                effective_to: "2026-12-31"
              as: FapAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - { call: "POST /fap/rate-contracts/${rc}/activate", payload: { expected_rate_contract_version: "${rc_v}" }, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/shipments"
              payload: { carrier_id: "${ca}", pro_number: "PRO-1001", ship_date: "2026-08-02", origin_country: "US", dest_country: "CA", mode: "LTL", actual_weight_kg: 500, accessorials_rendered: ["LIFTGATE"] }
              as: AuditAnalyst
              captures: { sh: $.data.id }
            - call: "POST /fap/clients/${cl}/invoices"
              payload: { carrier_id: "${ca}", shipment_id: "${sh}", invoice_number: "INV-0001", invoice_date: "2026-08-03", currency: "USD", billed_total_minor: 87500, lines: [ { charge_code: "BASE_FREIGHT", billed_amount_minor: 75000 }, { charge_code: "FUEL_SURCHARGE", billed_amount_minor: 7500 }, { charge_code: "LIFTGATE", billed_amount_minor: 5000 } ] }
              as: AuditAnalyst
              captures: { inv: $.data.id }
            - { call: "POST /fap/invoices/${inv}/capture", payload: {}, as: AuditAnalyst }
            - { call: "POST /fap/invoices/${inv}/rate", payload: {}, as: AuditAnalyst }
            - { call: "POST /fap/invoices/${inv}/finalize_audit", payload: {}, as: AuditAnalyst }
          trigger:
            - call: "POST /fap/invoices/${inv}/capture"
              payload: {}
              as: AuditAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE (HTTP 409); audit_status remains CLEARED"

      - name: voided_invoice_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CarrierInvoice]
        distinguishing_aspect: "VOIDED is terminal for the audit dimension: rate, void, and finalize_audit all fail from VOIDED."
        test_recipe:
          setup: ["Client ACTIVE; carrier ACTIVE; invoice INV-0001 voided from RECEIVED"]
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD" }
              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "CARR", legal_name: "Carrier One", country: "US", billing_currency: "USD", remit_email: "r@c.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
            - call: "POST /fap/clients/${cl}/invoices"
              payload: { carrier_id: "${ca}", invoice_number: "INV-0001", invoice_date: "2026-08-03", currency: "USD", billed_total_minor: 100, lines: [ { charge_code: "OTHER", billed_amount_minor: 100 } ] }
              as: AuditAnalyst
              captures: { inv: $.data.id }
            - { call: "POST /fap/invoices/${inv}/void", payload: {}, as: AuditAnalyst }
          trigger:
            - call: "POST /fap/invoices/${inv}/rate"
              payload: {}
              as: AuditAnalyst
              captures: { err1: $.data.error_id }
            - call: "POST /fap/invoices/${inv}/void"
              payload: {}
              as: AuditAnalyst
              captures: { err2: $.data.error_id }
          assert:
            - "${err1} == ERR_INVALID_STATE and ${err2} == ERR_INVALID_STATE (both 409)"

      - name: carrier_approve_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.Carrier]
        distinguishing_aspect: "approve_onboard is not idempotent: the second call on an ACTIVE carrier fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Client ACTIVE; carrier PENDING_ONBOARD"]
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD" }
              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "CARR", legal_name: "Carrier One", country: "US", billing_currency: "USD", remit_email: "r@c.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
          trigger:
            - { call: "POST /fap/carriers/${ca}/approve_onboard", payload: {}, as: FapAdmin }
            - call: "POST /fap/carriers/${ca}/approve_onboard"
              payload: {}
              as: FapAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE (HTTP 409)"

      - name: sweep_expires_contract_and_exception
        claim_type: valid_transition
        grounds: [state_machines.RateContract.ACTIVE_to_EXPIRED, state_machines.AuditException, "endpoints.POST /fap/clients/{clientId}/run_daily_sweep"]
        distinguishing_aspect: "Ops-run checkpoint: one sweep at 2026-09-15 expires both the ACTIVE contract whose effective_to 2026-09-01 passed and the exception opened 2026-08-01 whose 30-day dispute window elapsed."
        test_recipe:
          setup:
            - "Client ACTIVE (dispute_window_days 30); carrier ACTIVE; contract C1 ACTIVE [2026-08-01, 2026-09-01)"
            - "Invoice INV-0004 billed 91000 -> EXCEPTION RATE_MISMATCH (opened_date 2026-08-01)"
            - "Logical clock advanced to 2026-09-15"
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD", dispute_window_days: 30 }
              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "CARR", legal_name: "Carrier One", country: "US", billing_currency: "USD", payment_terms_days: 14, remit_email: "r@c.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
            - { call: "POST /fap/carriers/${ca}/approve_onboard", payload: {}, as: FapAdmin }
            - call: "POST /fap/carriers/${ca}/rate-contracts"
              payload:
                name: "C1"
                currency: "USD"
                lanes:
                  - { origin_country: "US", dest_country: "CA", mode: "LTL", weight_breaks: [ { min_kg: 0, rate_per_kg_minor: 150 } ], fuel_surcharge_pct_bp: 1000, accessorials: [ { code: "LIFTGATE", flat_minor: 5000, cap_pct_bp: 2000 } ], minimum_charge_minor: 20000 }
                effective_from: "2026-08-01"
                effective_to: "2026-09-01"
              as: FapAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - { call: "POST /fap/rate-contracts/${rc}/activate", payload: { expected_rate_contract_version: "${rc_v}" }, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/shipments"
              payload: { carrier_id: "${ca}", pro_number: "PRO-1001", ship_date: "2026-08-02", origin_country: "US", dest_country: "CA", mode: "LTL", actual_weight_kg: 500, accessorials_rendered: ["LIFTGATE"] }
              as: AuditAnalyst
              captures: { sh: $.data.id }
            - call: "POST /fap/clients/${cl}/invoices"
              payload: { carrier_id: "${ca}", shipment_id: "${sh}", invoice_number: "INV-0004", invoice_date: "2026-08-03", currency: "USD", billed_total_minor: 91000, lines: [ { charge_code: "BASE_FREIGHT", billed_amount_minor: 78000 }, { charge_code: "FUEL_SURCHARGE", billed_amount_minor: 7800 }, { charge_code: "LIFTGATE", billed_amount_minor: 5200 } ] }
              as: AuditAnalyst
              captures: { inv: $.data.id }
            - { call: "POST /fap/invoices/${inv}/capture", payload: {}, as: AuditAnalyst }
            - { call: "POST /fap/invoices/${inv}/rate", payload: {}, as: AuditAnalyst }
            - { call: "POST /fap/invoices/${inv}/finalize_audit", payload: {}, as: AuditAnalyst }
            - call: "GET /fap/invoices/${inv}/exceptions"
              payload: {}
              as: AuditAnalyst
              captures: { exc: "$.data[0].id" }
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: FapAdmin }
          trigger:
            - call: "POST /fap/clients/${cl}/run_daily_sweep"
              payload: {}
              as: FapAdmin
              captures: { expired_rc: "$.data.expired_contract_ids", expired_exc: "$.data.expired_exception_ids" }
            - call: "GET /fap/rate-contracts/${rc}"
              payload: {}
              as: FapAdmin
              captures: { rc_st: $.data.status }
          assert:
            - "${rc} is in expired_contract_ids and RateContract.${rc}.status == EXPIRED"
            - "${exc} is in expired_exception_ids; AuditException.${exc}.status == EXPIRED"
            - "Invoice remains audit:EXCEPTION awaiting rerate"

      - name: write_off_unrated_invoice_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.CarrierInvoice, "errors[ERR_INVOICE_NOT_PAYABLE]"]
        distinguishing_aspect: "write_off requires audit CLEARED; on a RATED invoice it fails ERR_INVOICE_NOT_PAYABLE."
        test_recipe:
          setup: ["Standard USD chain; invoice INV-0001 in audit RATED"]
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD" }
