          difficulty_instance: "dual_variant_calc / dv_candidate_layout_provisional_versus_certified_basis"
          rationale: "The §1.8 instance already reads GET /ballot-styles/{id}/layout under both bases on one roster with a disqualified candidate, asserting the divergent printed_position lists caused by N shrinking from 4 to 3."
        distinguishing_aspect: "Two variants of one calculation over the same rows returning different printed orders, not a relabelling."

      - name: calc_accountability_variant_selection_covered_by_difficulty_design
        claim_type: variant_selection
        grounds:
          - calculations.ballot_accountability_reconciliation.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / dv_accountability_preliminary_versus_final_canvass_scope"
          rationale: "The §1.8 instance already selects both bases on the same election and asserts every worksheet line for each, including the BALANCED/OUT_OF_BALANCE flip driven purely by the custody filter."
        distinguishing_aspect: "The requested basis selects the custody filter, which changes the tier keys and therefore the verdict."

