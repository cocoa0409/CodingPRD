      - name: certification_stale_version_blocks_approval
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_CERTIFICATION_STALE]
        distinguishing_aspect: "After the certification test PASSED at program version N, a PATCH bumps the program to N+1; approval with expected_program_version N+1 fails ERR_CERTIFICATION_STALE because no PASSED test covers the new version."
        test_recipe:
          setup: ["Member M ACTIVE; program G with PASSED test at version 2 (created v1, test-submit bumps to v2), then PATCH bumps to v3"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "B", member_kind: "BOTH", region: "NA" }
              as: NetworkOperator
              captures: { m1: $.data.id }
            - call: "POST /network/members/${m1}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/programs"
              payload: { name: "G", program_type: "CARD_PRODUCT", product_code: "CC", owner_member_id: "${m1}" }
              as: CertificationEngineer
              captures: { g1: $.data.id, g1_v: $.data.version }
            - call: "POST /network/programs/${g1}/certification-tests"
              payload: { scope: "NEW_PRODUCT" }
              as: CertificationEngineer
              captures: { ct: $.data.id }
            - call: "POST /network/certification-tests/${ct}/pass"
              payload: {}
              as: CertificationEngineer
            - call: "PATCH /network/programs/${g1}"
              payload: { name: "G-renamed" }
              as: CertificationEngineer
              captures: { g1_v2: $.data.version }
          trigger:
            - call: "POST /network/programs/${g1}/approve"
              payload: { expected_program_version: "${g1_v2}" }
              as: CertificationEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CERTIFICATION_STALE (422) — the PASSED test's evaluated_program_version lags the current Program.version"
            - "Program.${g1}.status == UNDER_CERTIFICATION"

