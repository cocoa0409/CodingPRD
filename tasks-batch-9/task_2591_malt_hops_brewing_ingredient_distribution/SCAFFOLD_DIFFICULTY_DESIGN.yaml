            - "after reading 2: ColdChainShipment.${sc_id}.status == IN_TRANSIT (20 is not yet above MAX_EXCURSION_MINUTES)"
            - "reading 3: interval_minutes == 15, in_violation == true, ${r3_cum} == 35"
            - "LINK 1: ColdChainShipment.${sc_id}.excursion_minutes == 35"
            - "LINK 1: ColdChainShipment.${sc_id}.status == EXCURSION_FLAGGED"
            - "LINK 1: ColdChainShipment.${sc_id}.reading_count == 3 and ColdChainShipment.${sc_id}.last_reading_at == 2026-08-01T10:35:00Z"
            - "LINK 2: YeastPropagationJob.${job4_id}.status == FAILED"
            - "LINK 2: YeastPropagationJob.${job4_id}.failure_reason == COLD_CHAIN_EXCURSION"
            - "LINK 2: OrderLine.${lc2_id}.status == QUARANTINED"
            - "LINK 2: OrderLine.${lc1_id}.status == OPEN (the YEAST line itself is not quarantined; only cold-chain HOP lines are)"
            - "LINK 3: GET /yeast-propagation-jobs?replaces_job_id returns total_count 1"
            - "LINK 3: YeastPropagationJob.${repl_id}.status == REQUESTED and YeastPropagationJob.${repl_id}.replaces_job_id == ${job4_id}"
            - "LINK 3: ${repl_pitch} == 2026-08-22T00:00:00Z"
            - "LINK 3: YeastPropagationJob.${repl_id}.brewer_id == ${b4_id} and YeastPropagationJob.${repl_id}.recipe_id == ${recipe4_id} and YeastPropagationJob.${repl_id}.yeast_strain_id == ${wlp001_id}"
            - "LINK 3: YeastPropagationJob.${repl_id}.required_cells_billion == 33004.13 (the recipe is unchanged) but the advisory is recomputed for a 21-day wait, so viability hits the VIABILITY_FLOOR: YeastPropagationJob.${repl_id}.recommended_slurry_l == 55.007 and YeastPropagationJob.${repl_id}.propagation_volume_l == 63.258"
            - "the failed job's own figures are unchanged: YeastPropagationJob.${job4_id}.recommended_slurry_l == 42.974 and YeastPropagationJob.${job4_id}.propagation_volume_l == 49.420"
            - "the follow-up ship returns HTTP 409 with ${ship_error} == ERR_COLD_CHAIN_EXCURSION"
            - "SalesOrder.${oc_id}.fulfillment_status == PICKED and SalesOrder.${oc_id}.invoiced_at == null"
            - "Brewer.${b4_id}.ar_balance_cents == 0"

  # ===========================================================================
  # Rule 5 — Priority-pair validation conflicts across different category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_precondition_outranks_fiscal_check_on_re_confirm
        grounds:
          - validations[priority=16]
          - validations[priority=44]
          - validations[priority=45]
          - errors.ERR_INVALID_ORDER_STATE
          - errors.ERR_BREWER_CREDIT_HOLD
          - calculations.brewer_credit_posture
        conflicting_priorities: [16, 44]
        expected_error: ERR_INVALID_ORDER_STATE
        distinguishing_aspect: |
          Pair categories: state (priority 16) versus business_fiscal
          (priority 44). The order is already CONFIRMED and the brewer is also
          on a credit HOLD at 168.38 percent utilization, so both
          the state precondition and the fiscal gate would refuse the re-confirm;
          the state error must surface, and the 409 must not be downgraded to the
          402 that the fiscal rule would return.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 200000 and cold_chain_certified true."
            - "Hop variety Citra (spot 51.00, cold_storage_required true) and malt product Pale Ale Malt with a released 20000 lb lot."
            - "An order with a 1000 lb malt line and an 880 lb SPOT Citra line, CONFIRMED at total_cents 168380 — comfortably inside the 200000 limit at confirm time."
            - "The credit profile is then rewritten to credit_limit_cents 100000, which drives credit_utilization_pct to 168.38 and credit_status to HOLD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Squeeze Play Brewing", brewery_license_no: "BR-0010", credit_terms_days: 30, credit_limit_cents: 200000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { b5_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { citra_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { malt_pale_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${malt_pale_id}", lot_code: "LOT-2603", quantity_lbs: 20000 }
              as: WarehouseOperator
              captures: { lot5_id: $.data.id }
            - call: "POST /malt-lots/${lot5_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 92.00 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
            - call: "POST /malt-lots/${lot5_id}/release"
              payload: { release_note: "cleared" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
            - call: "POST /sales-orders"
              payload: { brewer_id: "${b5_id}", requested_ship_date: "2026-09-20T00:00:00Z", purchase_order_ref: "PO-7001" }
              as: Brewer
              as_user_id: "${b5_id}"
              captures: { od_id: $.data.id }
            - call: "POST /sales-orders/${od_id}/lines"
              payload: { item_type: "MALT", quantity: 1000, uom: "LB", malt_lot_id: "${lot5_id}" }
              as: Brewer
              as_user_id: "${b5_id}"
            - call: "POST /sales-orders/${od_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "${citra_id}" }
              as: Brewer
              as_user_id: "${b5_id}"
            - call: "POST /sales-orders/${od_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${b5_id}"
            - call: "GET /brewers/${b5_id}"
              payload: {}
              as: CreditManager
              captures: { b5_v: $.data.version }
            - call: "PUT /brewers/${b5_id}/credit-profile"
              payload: { expected_brewer_version: "${b5_v}", credit_limit_cents: 100000 }
              as: CreditManager
              captures: { new_status: $.data.credit_status, new_util: $.data.credit_utilization_pct }
          trigger:
            - call: "POST /sales-orders/${od_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${b5_id}"
              captures: { err: $.data.error_id }
          assert:
            - "setup: SalesOrder.${od_id}.total_cents == 168380 and SalesOrder.${od_id}.fulfillment_status == CONFIRMED"
            - "setup: ${new_util} == 168.38 and ${new_status} == HOLD"
            - "setup: Brewer.${b5_id}.credit_exposure_cents == 168380 and Brewer.${b5_id}.credit_limit_cents == 100000"
            - "the trigger returns HTTP 409 with ${err} == ERR_INVALID_ORDER_STATE"
            - "${err} != ERR_BREWER_CREDIT_HOLD (the lower-priority fiscal rule must not win)"
            - "the response status is 409, not 402"
            - "SalesOrder.${od_id}.fulfillment_status == CONFIRMED and SalesOrder.${od_id}.total_cents == 168380 (nothing was committed twice)"
            - "HopVariety.${citra_id}.available_spot_lbs == 19120 (the spot hold was not double-drawn)"
            - "MaltLot.${lot5_id}.committed_lbs == 1000"

      - name: safety_certification_outranks_contract_volume_constraint
        grounds:
          - validations[priority=21]
          - validations[priority=41]
          - errors.ERR_COLD_CHAIN_NOT_CERTIFIED
          - errors.ERR_CONTRACT_VOLUME_EXHAUSTED
          - entities.Brewer.fields.cold_chain_certified
          - entities.SalesOrder.fields.requires_cold_chain
        conflicting_priorities: [21, 41]
        expected_error: ERR_COLD_CHAIN_NOT_CERTIFIED
        distinguishing_aspect: |
          A different category pair from the state-versus-fiscal case:
          business_safety (priority 21) versus business_constraint
          (priority 41), and both carry the SAME http_status 422, so the two
          candidate responses are distinguishable only by error_id. The order asks
          for 880 lbs against a contract holding just 500 lbs while the brewer is
          not cold-chain certified for a variety that requires refrigeration.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with cold_chain_certified FALSE and credit_limit_cents 5000000."
            - "Crop-year program 2026 OPEN."
            - "Hop variety Citra with cold_storage_required true and min_order_lbs 44."
            - "A tiny ACTIVE FIXED_CROP_YEAR contract of only 500 contracted_lbs at 285.50 cents/lb, window 2026-09-01 through 2026-12-31, remaining_lbs 500."
            - "A DRAFT order for requested_ship_date 2026-10-15 with one 880 lb CONTRACT hop line — above the variety minimum so the line itself is accepted, but 380 lbs beyond the contract."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Ambient Only Brewing", brewery_license_no: "BR-0011", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { b6_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { prog26_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { citra_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${b6_id}", variety_id: "${citra_id}", crop_year_program_id: "${prog26_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 500, price_per_lb_cents: 285.50, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { csmall_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${b6_id}", requested_ship_date: "2026-10-15T00:00:00Z", purchase_order_ref: "PO-8001" }
              as: Brewer
              as_user_id: "${b6_id}"
              captures: { oe_id: $.data.id }
            - call: "POST /sales-orders/${oe_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "CONTRACT", hop_variety_id: "${citra_id}", hop_contract_id: "${csmall_id}" }
              as: Brewer
              as_user_id: "${b6_id}"
              captures: { le_id: $.data.id }
          trigger:
            - call: "POST /sales-orders/${oe_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${b6_id}"
              captures: { err: $.data.error_id }
          assert:
            - "setup: OrderLine.${le_id}.cold_chain_required == true and SalesOrder.${oe_id}.requires_cold_chain == true"
            - "setup: HopContract.${csmall_id}.remaining_lbs == 500, which is less than the 880 lb line"
            - "the trigger returns HTTP 422 with ${err} == ERR_COLD_CHAIN_NOT_CERTIFIED"
            - "${err} != ERR_CONTRACT_VOLUME_EXHAUSTED (the lower-priority constraint rule must not win even though both are 422)"
            - "SalesOrder.${oe_id}.fulfillment_status == DRAFT"
            - "HopContract.${csmall_id}.committed_lbs == 0 and HopContract.${csmall_id}.remaining_lbs == 500 (the rejected confirm committed nothing)"
            - "SalesOrder.${oe_id}.total_cents == 0 and SalesOrder.${oe_id}.fee_variant == null"

      - name: referential_mismatch_outranks_brewer_credit_hold_on_propagation_request
        grounds:
          - validations[priority=10]
          - validations[priority=44]
          - errors.ERR_STRAIN_RECIPE_MISMATCH
          - errors.ERR_BREWER_CREDIT_HOLD
          - entities.BrewerRecipe.fields.yeast_strain_id
        conflicting_priorities: [10, 44]
        expected_error: ERR_STRAIN_RECIPE_MISMATCH
        distinguishing_aspect: |
          A third category pair — business_referential (priority 10) versus
          business_fiscal (priority 44) — on a completely different endpoint
          (POST /yeast-propagation-jobs rather than the order confirm). The
          referential rule sits far ABOVE the fiscal one, so the FK disagreement
          between the requested strain W-34/70 and the recipe's declared WLP001 is
