              captures: { obs_st: $.data.status }
          assert:
            - "First PATCH -> ERR_INVALID_STATE (409): deployment ${d_id} is SCHEDULED"
            - "After deployment cancel, second PATCH succeeds: Observer.${obs_id}.status == DECERTIFIED"
            - "Observer terminal lockdown: a further PATCH to ACTIVE fails with ERR_INVALID_STATE (DECERTIFIED is terminal)"

      - name: notice_decline_terminal_and_second_accept_rejected
        claim_type: terminal_lockdown
        grounds:
          - state_machines.SelectionNotice.ISSUED_to_DECLINED
          - state_machines.SelectionNotice.ISSUED_to_ACCEPTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          DECLINED is a terminal state for SelectionNotice: after an operator
          declines, a subsequent accept attempt on the same notice fails with
          ERR_INVALID_STATE (409) — terminal-state lockdown plus idempotency
          (the decline trigger cannot fire twice).
        test_recipe:
          setup:
            - "Notice N ISSUED for vessel V (operator OP)"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-SM3", name: "SM3 Fishery", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
