              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-SP", name: "State Practice", host_state_code: "VA", service_date: "2027-06-12", doors_open_utc: "2027-06-12T10:00:00Z", total_patient_capacity: 10 }
              as: EventDirector
              captures: { evsp: $.data.id, evsp_v: $.data.version }
            - call: "POST /clinic-events/${evsp}/site-agreements"
              payload: { site_id: "${ssp}", host_org_name: "Board", liability_cap_cents: 5000000, insurance_certificate_ref: "CSP", expected_event_version: "${evsp_v}" }
              as: LogisticsCoordinator
              captures: { agsp: $.data.id }
            - call: "POST /clinic-events/${evsp}/site-agreements/${agsp}/submit"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${evsp}/site-agreements/${agsp}/confirm"
              payload: {}
              as: EventDirector
            - call: "POST /volunteers"
              payload: { full_name: "Dent NC", email: "dnc@x.com", discipline: "DENTAL", license_number: "LNC", license_state_code: "NC", license_expiry_date: "2028-01-01" }
              as: VolunteerCoordinator
              captures: { vnc: $.data.id }
            - call: "POST /volunteers/${vnc}/request-verification"
              payload: { clinic_event_id: "${evsp}", reviewer_notes: "out of state" }
              as: VolunteerCoordinator
              captures: { lvnc: $.data.id }
            - call: "POST /volunteers/${vnc}/license-verifications/${lvnc}/approve"
              payload: {}
              as: CredentialingOfficer
            - call: "GET /clinic-events/${evsp}"
              payload: {}
              as: EventDirector
              captures: { evsp_v2: $.data.version }
          trigger:
            - call: "POST /volunteers/${vnc}/authorize"
