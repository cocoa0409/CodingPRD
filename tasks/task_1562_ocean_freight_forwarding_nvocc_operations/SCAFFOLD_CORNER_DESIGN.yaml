# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Ocean Freight Forwarding & NVOCC Operations
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: booking_creation_success_with_system_and_computed_fields
        claim_type: creation
        grounds:
          - entities.Booking
          - state_machines.Booking
        distinguishing_aspect: "POST /freight/bookings returns 201 with server-minted booking_number, version 1, initial status QUOTED, and computed chargeable_weight_rt / estimated_freight_cents."
        test_recipe:
          setup: ["Shipper, published LCL tariff 9500/RT min 20000, active contract, voyage BOOKING_OPEN"]
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME CRE", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id, ver: $.data.version, st: $.data.status, rt: $.data.chargeable_weight_rt, est: $.data.estimated_freight_cents } }
          assert:
            - "Booking.${b}.status == QUOTED (initial state), version == 1, booking_number present (server-minted), shipper_id == ${s}"
            - "chargeable_weight_rt == 6.0, estimated_freight_cents == 77400"

      - name: booking_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - entities.Booking
          - errors[ERR_BOOKING_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields the typed 404, not a generic 400/500."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /freight/bookings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Any, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BOOKING_NOT_FOUND and http status 404"

      - name: booking_create_missing_required_voyage_id
        claim_type: required_fields
        grounds:
          - entities.Booking.fields.voyage_id
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: "Omitting required body fields voyage_id and tariff_id is a 400 ERR_INVALID_REQUEST (band 5 body-shape), never a 404; both FK fields are absent so band-3 existence has nothing to resolve and cannot shadow the body-shape error."
        test_recipe:
          setup: ["Shipper exists"]
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME REQ", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
          trigger:
            - { call: "POST /freight/bookings", payload: { rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (missing voyage_id and tariff_id), http 400"

      - name: shipper_and_contract_defaults_applied
        claim_type: defaults
        grounds:
          - entities.Shipper.fields.credit_terms
          - entities.CarrierContract.fields.demurrage_free_days
        distinguishing_aspect: "Omitting credit_terms yields PREPAID_ONLY; omitting demurrage_free_days/detention_free_days yields 4/3."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME DEF", credit_limit_cents: 5000000 }, as: OperationsManager, captures: { s: $.data.id, terms: $.data.credit_terms, st: $.data.status } }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-D", carrier_name: "OOCL", service_lane: "CNSHA-USNYC", container_rates: [ { container_type: "20GP", rate_cents: 90000 } ], demurrage_tiers: [ { from_day: 1, to_day: null, per_diem_cents: 10000 } ], detention_per_diem_cents: 8000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id, dfd: $.data.demurrage_free_days, tfd: $.data.detention_free_days } }
          assert:
            - "Shipper.${s}.credit_terms == PREPAID_ONLY and status == ACTIVE"
            - "CarrierContract.${c}.demurrage_free_days == 4 and detention_free_days == 3 (defaults)"

      - name: booking_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Booking.fields.estimated_freight_cents
          - entities.Booking.fields.chargeable_weight_rt
        distinguishing_aspect: "Client-injected values for computed fields (estimated_freight_cents, chargeable_weight_rt, version) are ignored; the response carries server-computed values."
        test_recipe:
          setup: ["Shipper, published LCL tariff 9500/RT, active contract, voyage BOOKING_OPEN"]
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME IGN", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID", estimated_freight_cents: 1, chargeable_weight_rt: 99.0, version: 42 }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id, est: $.data.estimated_freight_cents, rt: $.data.chargeable_weight_rt, ver: $.data.version } }
          assert:
            - "Booking.${b}.estimated_freight_cents == 77400 (injected 1 ignored)"
            - "Booking.${b}.chargeable_weight_rt == 6.0 (injected 99.0 ignored) and version == 1 (injected 42 ignored)"

      - name: booking_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Booking.fields.commodity_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "commodity_type outside {GENERAL, REEFER, HAZMAT} rejects 400."
        test_recipe:
          setup: ["Shipper, published tariff, active contract, voyage BOOKING_OPEN"]
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME ENM", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "BIOHAZARD", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: list_pagination_envelope_and_defaults
        claim_type: listing
        grounds:
          - response_envelope
          - entities.Shipper
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more per the fixed envelope; default limit is 10."
        test_recipe:
          setup: ["three shippers exist"]
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "PG A", credit_limit_cents: 1000 }, as: OperationsManager }
            - { call: "POST /freight/shippers", payload: { legal_name: "PG B", credit_limit_cents: 1000 }, as: OperationsManager }
            - { call: "POST /freight/shippers", payload: { legal_name: "PG C", credit_limit_cents: 1000 }, as: OperationsManager }
          trigger:
            - { call: "GET /freight/shippers", payload: { limit: 2, offset: 0 }, as: Any }
            - { call: "GET /freight/shippers", payload: { limit: 2, offset: 2 }, as: Any }
          assert:
            - "page 1: total_count == 3, has_more == true, exactly 2 data rows"
            - "page 2 (offset 2): total_count == 3, has_more == false, exactly 1 data row"
            - "omitting limit/offset returns all 3 rows (default limit 10 >= 3)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: tariff_create_starts_in_draft
        claim_type: initial_state
        grounds:
          - state_machines.Tariff
        distinguishing_aspect: "A new tariff is DRAFT and invisible to booking validation until publish."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-INIT", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id, st: $.data.status } }
          assert:
            - "Tariff.${t}.status == DRAFT"

      - name: bl_issue_from_issued_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.BillOfLading.DRAFT_to_ISSUED
          - errors[ERR_BL_INVALID_STATE]
        distinguishing_aspect: "ISSUED is not a valid from-state for issue; the second issue attempt fails and no duplicate side effects fire."
        test_recipe:
          setup: ["CONFIRMED booking; bond ACTIVE 7500000; B/L already ISSUED"]
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME II", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-FCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "FCL", container_type: "40HC", rate_per_unit_cents: 185000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "FCL", container_type: "40HC", container_count: 1, commodity_type: "GENERAL", gross_weight_kg: 18000, volume_cbm: 50.0, terms: "COLLECT" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id } }
            - { call: "POST /freight/bookings/${b}/confirm", payload: {}, as: BookingCoordinator }
            - { call: "POST /freight/surety-bonds", payload: { bond_number: "BOND-1", surety_company: "SURETYCO", coverage_amount_cents: 7500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { bd: $.data.id } }
            - { call: "POST /freight/surety-bonds/${bd}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /freight/bill-of-lading", payload: { booking_id: "${b}", bl_type: "HOUSE", release_mode: "SEAWAY" }, as: DocumentationOfficer, as_user_id: "doc_1", captures: { bl: $.data.id } }
            - { call: "POST /freight/bill-of-lading/${bl}/issue", payload: {}, as: DocumentationOfficer, as_user_id: "doc_1" }
          trigger:
            - { call: "POST /freight/bill-of-lading/${bl}/issue", payload: {}, as: DocumentationOfficer, as_user_id: "doc_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BL_INVALID_STATE; BillOfLading.${bl}.status remains ISSUED"

      - name: released_bl_terminal_lockdown_void_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.BillOfLading
          - errors[ERR_BL_INVALID_STATE]
        distinguishing_aspect: "RELEASED is terminal: void (and any other transition) from RELEASED is rejected."
        test_recipe:
          setup: ["COLLECT booking DOCUMENTATION_CLEARED; SEAWAY B/L ISSUED by doc_1 then RELEASED by doc_2"]
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME TL", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-FCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "FCL", container_type: "40HC", rate_per_unit_cents: 185000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "FCL", container_type: "40HC", container_count: 1, commodity_type: "GENERAL", gross_weight_kg: 18000, volume_cbm: 50.0, terms: "COLLECT" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id } }
            - { call: "POST /freight/bookings/${b}/confirm", payload: {}, as: BookingCoordinator }
            - { call: "POST /freight/surety-bonds", payload: { bond_number: "BOND-1", surety_company: "SURETYCO", coverage_amount_cents: 7500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { bd: $.data.id } }
            - { call: "POST /freight/surety-bonds/${bd}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /freight/bill-of-lading", payload: { booking_id: "${b}", bl_type: "HOUSE", release_mode: "SEAWAY" }, as: DocumentationOfficer, as_user_id: "doc_1", captures: { bl: $.data.id } }
            - { call: "POST /freight/bill-of-lading/${bl}/issue", payload: {}, as: DocumentationOfficer, as_user_id: "doc_1" }
            - { call: "POST /freight/compliance-filings", payload: { booking_id: "${b}", filing_type: "ISF" }, as: ComplianceOfficer, captures: { f1: $.data.id } }
            - { call: "POST /freight/compliance-filings", payload: { booking_id: "${b}", filing_type: "AMS" }, as: ComplianceOfficer, captures: { f2: $.data.id } }
            - { call: "POST /freight/compliance-filings/${f1}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /freight/compliance-filings/${f1}/record-response", payload: { outcome: "ACCEPTED" }, as: ComplianceOfficer }
            - { call: "POST /freight/compliance-filings/${f2}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /freight/compliance-filings/${f2}/record-response", payload: { outcome: "ACCEPTED" }, as: ComplianceOfficer }
            - { call: "POST /freight/bill-of-lading/${bl}/release", payload: {}, as: DocumentationOfficer, as_user_id: "doc_2" }
          trigger:
            - { call: "POST /freight/bill-of-lading/${bl}/void", payload: {}, as: DocumentationOfficer, as_user_id: "doc_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BL_INVALID_STATE (RELEASED is terminal); BillOfLading.${bl}.status remains RELEASED"

      - name: gate_out_before_discharge_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ContainerAssignment.DISCHARGED_to_GATED_OUT
          - errors[ERR_ASSIGNMENT_INVALID_STATE]
        distinguishing_aspect: "gate-out on a STUFFED assignment (never discharged) is rejected; the detention clock cannot start out of order."
        test_recipe:
          setup: ["CONFIRMED FCL booking with one STUFFED assignment; voyage still BOOKING_OPEN"]
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME GO", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
