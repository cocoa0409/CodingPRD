scaffold_corner_design:

  # ===========================================================================
  # Section: entities — creation, retrieval, listing, not-found, required,
  # defaults, computed, system, type constraints, immutability, parent rel
  # ===========================================================================
  - section: entities
    instances:
      - name: market_create_returns_201_and_initial_state_prospect
        claim_type: Creation
        grounds: [entities.Market, endpoints.POST_/v1/markets]
        distinguishing_aspect: "A market created with the four required inputs returns 201 with status PROSPECT, version 1, system id/created_at/updated_at, and opened_screen_count computed to 0."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
          trigger:
            - { call: "POST /v1/markets", payload: { market_name: "Metro", country_code: "US", screen_capacity_cap: 5, target_format_mix: ["PREMIUM_2D"] }, as: NetworkPlanner, captures: { mkt_id: $.data.id } }
          assert:
            - "the response status is 201 and response_type is object"
            - "Market.${mkt_id}.status == PROSPECT"
            - "Market.${mkt_id}.version == 1"
            - "Market.${mkt_id}.opened_screen_count == 0"
            - "Market.${mkt_id}.id is non-null and created_at / updated_at are ISO-8601"

      - name: agreement_get_returns_stored_fields_unchanged
        claim_type: Retrieval
        grounds: ["entities.ExhibitorAgreement", "endpoints.GET_/v1/agreements/{id}"]
        distinguishing_aspect: "Every input field round-trips via GET exactly as posted."
        test_recipe:
          setup: ["Logical clock at 2026-09-01. Market APPROVED."]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/markets", payload: { market_name: "Metro", country_code: "US", screen_capacity_cap: 5, target_format_mix: ["PREMIUM_2D"] }, as: NetworkPlanner, captures: { mkt_id: $.data.id } }
            - { call: "POST /v1/markets/${mkt_id}/begin-evaluation", payload: {}, as: NetworkPlanner }
            - { call: "POST /v1/markets/${mkt_id}/approve", payload: {}, as: NetworkPlanner }
            - { call: "POST /v1/agreements", payload: { exhibitor_legal_name: "Exh A", market_id: "${mkt_id}", agreement_type: "REVENUE_SHARE", committed_screen_count: 2, revenue_share_tier1_pct: 0.12, revenue_share_tier2_pct: 0.15, revenue_share_tier3_pct: 0.18, term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-09-01T00:00:00Z" }, as: PlatformContractManager, captures: { agr_id: $.data.id } }
          trigger:
            - { call: "GET /v1/agreements/${agr_id}", payload: {}, as: PlatformContractManager }
          assert:
            - "the response status is 200"
            - "ExhibitorAgreement.${agr_id}.exhibitor_legal_name == \"Exh A\""
            - "ExhibitorAgreement.${agr_id}.agreement_type == REVENUE_SHARE"
            - "ExhibitorAgreement.${agr_id}.revenue_share_tier1_pct == 0.12"
            - "ExhibitorAgreement.${agr_id}.total_slots_committed_count == 0"

      - name: list_endpoints_paginate_with_total_count_and_has_more
        claim_type: Listing
        grounds: [endpoints.GET_/v1/markets, response_envelope.pagination_fields]
        distinguishing_aspect: "With 3 markets, limit=2 returns 2 rows + total_count=3 + has_more=true; offset=2 returns 1 row + has_more=false."
        test_recipe:
          setup: ["Three markets created."]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/markets", payload: { market_name: "M1", country_code: "US", screen_capacity_cap: 1, target_format_mix: ["PREMIUM_2D"] }, as: NetworkPlanner }
            - { call: "POST /v1/markets", payload: { market_name: "M2", country_code: "US", screen_capacity_cap: 2, target_format_mix: ["PREMIUM_2D"] }, as: NetworkPlanner }
            - { call: "POST /v1/markets", payload: { market_name: "M3", country_code: "US", screen_capacity_cap: 3, target_format_mix: ["PREMIUM_2D"] }, as: NetworkPlanner }
          trigger:
            - { call: "GET /v1/markets", payload: { limit: 2, offset: 0 }, as: NetworkPlanner }
          assert:
            - "the response returns 2 rows, total_count == 3, has_more == true"
            - "GET /v1/markets?limit=2&offset=2 returns 1 row, total_count == 3, has_more == false"

      - name: get_auditorium_with_unknown_id_returns_404
        claim_type: Not Found
        grounds: ["endpoints.GET_/v1/auditoriums/{id}", "errors.ERR_AUDITORIUM_NOT_FOUND"]
        distinguishing_aspect: "A syntactically valid but unallocated UUID on GET /v1/auditoriums/{id} returns 404 ERR_AUDITORIUM_NOT_FOUND."
        test_recipe:
          setup: ["Empty database; logical clock set."]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
          trigger:
            - { call: "GET /v1/auditoriums/00000000-0000-4000-8000-000000000000", payload: {}, as: FieldEngineer, captures: { err_id: $.data.error_id } }
          assert:
            - "the response status is 404 and error_id == ERR_AUDITORIUM_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: agreement_create_missing_term_start_date_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.ExhibitorAgreement.fields.term_start_date, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "term_start_date is required and has no default; omitting it is 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Logical clock at 2026-09-01. Market APPROVED."]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/markets", payload: { market_name: "Metro", country_code: "US", screen_capacity_cap: 5, target_format_mix: ["PREMIUM_2D"] }, as: NetworkPlanner, captures: { mkt_id: $.data.id } }
            - { call: "POST /v1/markets/${mkt_id}/begin-evaluation", payload: {}, as: NetworkPlanner }
            - { call: "POST /v1/markets/${mkt_id}/approve", payload: {}, as: NetworkPlanner }
          trigger:
            - { call: "POST /v1/agreements", payload: { exhibitor_legal_name: "Exh A", market_id: "${mkt_id}", agreement_type: "REVENUE_SHARE", committed_screen_count: 1, revenue_share_tier1_pct: 0.12, revenue_share_tier2_pct: 0.15, revenue_share_tier3_pct: 0.18, term_end_date: "2027-09-01T00:00:00Z" }, as: PlatformContractManager, captures: { err_id: $.data.error_id } }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: conversion_order_create_defaults_filmmaker_approval_required_false
        claim_type: Defaults
        grounds: [entities.ConversionOrder.fields.filmmaker_approval_required]
        distinguishing_aspect: "filmmaker_approval_required defaults to false when omitted; approve-release then does not require filmmaker_signoff."
        test_recipe:
          setup: ["Studio ACTIVE; film; conversion created without filmmaker_approval_required; driven to QC_REVIEW."]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/studios", payload: { studio_legal_name: "St A", contact_email: "a@st.com" }, as: StudioRelationshipManager, captures: { stu_id: $.data.id } }
            - { call: "POST /v1/studios/${stu_id}/activate", payload: {}, as: StudioRelationshipManager }
            - { call: "POST /v1/films", payload: { studio_id: "${stu_id}", title: "F", runtime_minutes: 90, worldwide_release_date: "2026-09-15T00:00:00Z", format_targets: ["PREMIUM_2D"] }, as: StudioRelationshipManager, captures: { film_id: $.data.id } }
            - { call: "POST /v1/conversion-orders", payload: { studio_film_id: "${film_id}", target_format: "PREMIUM_2D", scheduled_post_start_date: "2026-09-01T00:00:00Z", scheduled_post_end_date: "2026-09-03T00:00:00Z" }, as: StudioRelationshipManager, captures: { conv_id: $.data.id } }
            - { call: "POST /v1/conversion-orders/${conv_id}/begin-post", payload: {}, as: PostProductionScheduler }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/conversion-orders/${conv_id}/submit-for-qc", payload: {}, as: PostProductionScheduler }
          trigger:
            - { call: "POST /v1/conversion-orders/${conv_id}/approve-release", payload: {}, as: QualityAssuranceReviewer }
          assert:
            - "the response status is 200 (no ERR_FILMMAKER_SIGNOFF_MISSING)"
            - "ConversionOrder.${conv_id}.filmmaker_approval_required == false"
            - "ConversionOrder.${conv_id}.status == APPROVED_FOR_RELEASE"

      - name: screen_slot_committed_screen_seconds_computed_at_creation
        claim_type: Computed Fields
        grounds: [entities.ScreenSlot.fields.committed_screen_seconds, calculations.committed_screen_seconds]
        distinguishing_aspect: "committed_screen_seconds is source:computed — the server derives it from slot days × showings × runtime × 60; client input is ignored."
        test_recipe:
          setup: ["Standard setup: agreement ACTIVE, auditorium OPERATING, film 100 min, conversion APPROVED, window OPEN."]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/markets", payload: { market_name: "Metro", country_code: "US", screen_capacity_cap: 5, target_format_mix: ["PREMIUM_2D"] }, as: NetworkPlanner, captures: { mkt_id: $.data.id } }
            - { call: "POST /v1/markets/${mkt_id}/begin-evaluation", payload: {}, as: NetworkPlanner }
            - { call: "POST /v1/markets/${mkt_id}/approve", payload: {}, as: NetworkPlanner }
            - { call: "POST /v1/agreements", payload: { exhibitor_legal_name: "Exh A", market_id: "${mkt_id}", agreement_type: "REVENUE_SHARE", committed_screen_count: 1, revenue_share_tier1_pct: 0.12, revenue_share_tier2_pct: 0.15, revenue_share_tier3_pct: 0.18, term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-09-01T00:00:00Z" }, as: PlatformContractManager, captures: { agr_id: $.data.id } }
            - { call: "POST /v1/agreements/${agr_id}/sign", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/auditoriums", payload: { agreement_id: "${agr_id}", auditorium_label: "S1", screen_geometry: { width_m: 20, height_m: 11, curvature_deg: 60 }, seating_capacity: 200, supported_formats: ["PREMIUM_2D"], sound_calibration_profile: { spl_target_db: 85, eq_curve_id: "STD", channel_count: 12 } }, as: PlatformContractManager, captures: { aud_id: $.data.id } }
            - { call: "POST /v1/auditoriums/${aud_id}/begin-construction", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/auditoriums/${aud_id}/begin-calibration", payload: {}, as: FieldEngineer }
            - { call: "POST /v1/auditoriums/${aud_id}/certify", payload: {}, as: FieldEngineer }
            - { call: "POST /v1/auditoriums/${aud_id}/open", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/agreements/${agr_id}/activate", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/studios", payload: { studio_legal_name: "St A", contact_email: "a@st.com" }, as: StudioRelationshipManager, captures: { stu_id: $.data.id } }
            - { call: "POST /v1/studios/${stu_id}/activate", payload: {}, as: StudioRelationshipManager }
            - { call: "POST /v1/films", payload: { studio_id: "${stu_id}", title: "Film X", runtime_minutes: 100, worldwide_release_date: "2026-09-05T00:00:00Z", format_targets: ["PREMIUM_2D"] }, as: StudioRelationshipManager, captures: { film_id: $.data.id } }
            - { call: "POST /v1/conversion-orders", payload: { studio_film_id: "${film_id}", target_format: "PREMIUM_2D", scheduled_post_start_date: "2026-09-01T00:00:00Z", scheduled_post_end_date: "2026-09-03T00:00:00Z" }, as: StudioRelationshipManager, captures: { conv_id: $.data.id } }
            - { call: "POST /v1/conversion-orders/${conv_id}/begin-post", payload: {}, as: PostProductionScheduler }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/conversion-orders/${conv_id}/submit-for-qc", payload: {}, as: PostProductionScheduler }
            - { call: "POST /v1/conversion-orders/${conv_id}/approve-release", payload: {}, as: QualityAssuranceReviewer }
            - { call: "POST /v1/release-windows", payload: { window_label: "W37", window_start_date: "2026-09-07T00:00:00Z", window_end_date: "2026-09-14T00:00:00Z", total_premium_screen_seconds_pool: 10000000 }, as: ReleaseScheduler, captures: { win_id: $.data.id, win_v0: $.data.version } }
            - { call: "POST /v1/release-windows/${win_id}/open", payload: {}, as: ReleaseScheduler }
          trigger:
            - { call: "POST /v1/screen-slots", payload: { window_id: "${win_id}", auditorium_id: "${aud_id}", studio_film_id: "${film_id}", conversion_order_id: "${conv_id}", slot_start_date: "2026-09-07T00:00:00Z", slot_end_date: "2026-09-14T00:00:00Z", showings_per_day: 2, expected_window_version: "${win_v0}" }, as: ReleaseScheduler, captures: { slot_id: $.data.id } }
          assert:
            - "ScreenSlot.${slot_id}.committed_screen_seconds == 84000 (= 7 days × 2 showings × 100 min × 60 s)"
            - "ScreenSlot.${slot_id}.status == PROPOSED"

      - name: market_create_extra_field_id_and_version_are_ignored_input
        claim_type: System Fields
        grounds: [entities.Market, response_envelope]
        distinguishing_aspect: "id, created_at, updated_at, version are server-managed; client input for these fields is ignored."
        test_recipe:
          setup: ["Empty DB, clock set."]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
          trigger:
            - { call: "POST /v1/markets", payload: { market_name: "M", country_code: "US", screen_capacity_cap: 1, target_format_mix: ["PREMIUM_2D"], id: "11111111-1111-4111-8111-111111111111", version: 99 }, as: NetworkPlanner, captures: { mkt_id: $.data.id } }
          assert:
            - "the response status is 201"
            - "Market.${mkt_id}.version == 1 (not 99)"
            - "Market.${mkt_id}.id != \"11111111-1111-4111-8111-111111111111\" (server mints)"

      - name: invalid_enum_on_severity_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.QAAlert.fields.severity, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "severity is a closed enum {INFO, WARNING, CRITICAL}; an unknown value is rejected 400."
        test_recipe:
          setup: ["Standard setup with OPERATING auditorium."]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/markets", payload: { market_name: "Metro", country_code: "US", screen_capacity_cap: 5, target_format_mix: ["PREMIUM_2D"] }, as: NetworkPlanner, captures: { mkt_id: $.data.id } }
            - { call: "POST /v1/markets/${mkt_id}/begin-evaluation", payload: {}, as: NetworkPlanner }
            - { call: "POST /v1/markets/${mkt_id}/approve", payload: {}, as: NetworkPlanner }
            - { call: "POST /v1/agreements", payload: { exhibitor_legal_name: "Exh A", market_id: "${mkt_id}", agreement_type: "REVENUE_SHARE", committed_screen_count: 1, revenue_share_tier1_pct: 0.12, revenue_share_tier2_pct: 0.15, revenue_share_tier3_pct: 0.18, term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-09-01T00:00:00Z" }, as: PlatformContractManager, captures: { agr_id: $.data.id } }
            - { call: "POST /v1/agreements/${agr_id}/sign", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/auditoriums", payload: { agreement_id: "${agr_id}", auditorium_label: "S1", screen_geometry: { width_m: 20, height_m: 11, curvature_deg: 60 }, seating_capacity: 200, supported_formats: ["PREMIUM_2D"], sound_calibration_profile: { spl_target_db: 85, eq_curve_id: "STD", channel_count: 12 } }, as: PlatformContractManager, captures: { aud_id: $.data.id } }
            - { call: "POST /v1/auditoriums/${aud_id}/begin-construction", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/auditoriums/${aud_id}/begin-calibration", payload: {}, as: FieldEngineer }
            - { call: "POST /v1/auditoriums/${aud_id}/certify", payload: {}, as: FieldEngineer }
            - { call: "POST /v1/auditoriums/${aud_id}/open", payload: {}, as: PlatformContractManager }
          trigger:
            - { call: "POST /v1/qa-alerts", payload: { auditorium_id: "${aud_id}", alert_code: "SOUND_DRIFT", severity: "FATAL" }, as: FieldEngineer, captures: { err_id: $.data.error_id } }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: box_office_report_is_immutable_no_update_endpoint
        claim_type: Immutability
        grounds: [entities.BoxOfficeReport]
        distinguishing_aspect: "BoxOfficeReport has common_fields: false — no version field, no update endpoint; only create + lifecycle transitions validate / flag-discrepancy."
        test_recipe:
          setup: ["Standard setup with one report in RECEIVED state."]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/markets", payload: { market_name: "Metro", country_code: "US", screen_capacity_cap: 5, target_format_mix: ["PREMIUM_2D"] }, as: NetworkPlanner, captures: { mkt_id: $.data.id } }
            - { call: "POST /v1/markets/${mkt_id}/begin-evaluation", payload: {}, as: NetworkPlanner }
            - { call: "POST /v1/markets/${mkt_id}/approve", payload: {}, as: NetworkPlanner }
            - { call: "POST /v1/agreements", payload: { exhibitor_legal_name: "Exh A", market_id: "${mkt_id}", agreement_type: "REVENUE_SHARE", committed_screen_count: 1, revenue_share_tier1_pct: 0.12, revenue_share_tier2_pct: 0.15, revenue_share_tier3_pct: 0.18, term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-09-01T00:00:00Z" }, as: PlatformContractManager, captures: { agr_id: $.data.id } }
            - { call: "POST /v1/agreements/${agr_id}/sign", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/auditoriums", payload: { agreement_id: "${agr_id}", auditorium_label: "S1", screen_geometry: { width_m: 20, height_m: 11, curvature_deg: 60 }, seating_capacity: 200, supported_formats: ["PREMIUM_2D"], sound_calibration_profile: { spl_target_db: 85, eq_curve_id: "STD", channel_count: 12 } }, as: PlatformContractManager, captures: { aud_id: $.data.id } }
            - { call: "POST /v1/auditoriums/${aud_id}/begin-construction", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/auditoriums/${aud_id}/begin-calibration", payload: {}, as: FieldEngineer }
            - { call: "POST /v1/auditoriums/${aud_id}/certify", payload: {}, as: FieldEngineer }
            - { call: "POST /v1/auditoriums/${aud_id}/open", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/agreements/${agr_id}/activate", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/studios", payload: { studio_legal_name: "St A", contact_email: "a@st.com" }, as: StudioRelationshipManager, captures: { stu_id: $.data.id } }
            - { call: "POST /v1/studios/${stu_id}/activate", payload: {}, as: StudioRelationshipManager }
            - { call: "POST /v1/films", payload: { studio_id: "${stu_id}", title: "Film X", runtime_minutes: 100, worldwide_release_date: "2026-09-05T00:00:00Z", format_targets: ["PREMIUM_2D"] }, as: StudioRelationshipManager, captures: { film_id: $.data.id } }
            - { call: "POST /v1/conversion-orders", payload: { studio_film_id: "${film_id}", target_format: "PREMIUM_2D", scheduled_post_start_date: "2026-09-01T00:00:00Z", scheduled_post_end_date: "2026-09-03T00:00:00Z" }, as: StudioRelationshipManager, captures: { conv_id: $.data.id } }
            - { call: "POST /v1/conversion-orders/${conv_id}/begin-post", payload: {}, as: PostProductionScheduler }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/conversion-orders/${conv_id}/submit-for-qc", payload: {}, as: PostProductionScheduler }
            - { call: "POST /v1/conversion-orders/${conv_id}/approve-release", payload: {}, as: QualityAssuranceReviewer }
            - { call: "POST /v1/release-windows", payload: { window_label: "W37", window_start_date: "2026-09-07T00:00:00Z", window_end_date: "2026-09-14T00:00:00Z", total_premium_screen_seconds_pool: 10000000 }, as: ReleaseScheduler, captures: { win_id: $.data.id, win_v0: $.data.version } }
            - { call: "POST /v1/release-windows/${win_id}/open", payload: {}, as: ReleaseScheduler }
            - { call: "POST /v1/screen-slots", payload: { window_id: "${win_id}", auditorium_id: "${aud_id}", studio_film_id: "${film_id}", conversion_order_id: "${conv_id}", slot_start_date: "2026-09-07T00:00:00Z", slot_end_date: "2026-09-14T00:00:00Z", showings_per_day: 2, expected_window_version: "${win_v0}" }, as: ReleaseScheduler, captures: { slot_id: $.data.id } }
            - { call: "POST /v1/screen-slots/${slot_id}/confirm", payload: {}, as: ReleaseScheduler }
          trigger:
            - { call: "POST /v1/box-office-reports", payload: { screen_slot_id: "${slot_id}", reported_date: "2026-09-07T00:00:00Z", gross_receipts_cents: 100, admissions: 1, submission_channel: "API_INGEST" }, as: BoxOfficeAnalyst, captures: { rpt_id: $.data.id } }
          assert:
            - "the response status is 201"
            - "BoxOfficeReport.${rpt_id} response has id and created_at only — no version, no updated_at field (immutable entity)"

      - name: tech_dispatch_auditorium_id_must_match_qa_alert_auditorium
        claim_type: Parent Relationships
        grounds: [entities.TechDispatch.fields.auditorium_id, entities.TechDispatch.fields.qa_alert_id, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "TechDispatch.auditorium_id must equal QAAlert.auditorium_id — a dispatch created against an alert for a different auditorium is rejected."
        test_recipe:
          setup: ["Two auditoriums (aud_1, aud_2) under the same agreement, both OPERATING. A QAAlert on aud_1 only."]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/markets", payload: { market_name: "Metro", country_code: "US", screen_capacity_cap: 5, target_format_mix: ["PREMIUM_2D"] }, as: NetworkPlanner, captures: { mkt_id: $.data.id } }
