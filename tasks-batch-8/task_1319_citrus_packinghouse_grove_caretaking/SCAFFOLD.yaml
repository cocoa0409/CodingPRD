    roles: [PackinghouseAdmin, PoolAccountant, FieldSupervisor, QualityInspector, LineOperator, ComplianceOfficer]
    code: 200
    input: ["room_id?", "delivery_id?", "status?", "limit?", "offset?"]
    output: DegreeningSession[]
    side_effects: []
  - method: GET
    path: /packinghouse/degreening-sessions/{id}
