# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Campus Card & Meal Plan Management
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: enrollment_pricing_weekly_vs_daily_terms
        grounds:
          - calculations.enrollment_activation_pricing
          - entities.Term.fields.proration_mode
          - entities.MealPlanEnrollment.fields.charge_cents
        distinguishing_aspect: |
          The dual variant lives in the ENROLLMENT domain (not merchant/settlement): two terms
          identical except proration_mode (WEEKLY vs DAILY) produce different charge_cents and
          different dining grants for the same plan, same holder type, same clock.
        test_recipe:
          setup:
            - "Two terms FALLW (WEEKLY) and FALLD (DAILY), both 2026-08-24..2026-12-13, 16 weeks, both OPEN at current_week_index 3"
            - "Plan COMM5 published: price 90000, dining allocation 10000, 5 swipes/week"
            - "Clock is 2026-09-09T10:00:00Z (week 3, mid-week Wednesday)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/terms"
              payload: { term_code: "FALLW", name: "Fall W", start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-13T23:59:59Z", add_drop_deadline: "2026-09-20T23:59:59Z", total_weeks: 16, proration_mode: "WEEKLY" }
              as: DiningServicesManager
              captures: { tw_id: "$.data.id" }
            - call: "POST /api/terms"
              payload: { term_code: "FALLD", name: "Fall D", start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-13T23:59:59Z", add_drop_deadline: "2026-09-20T23:59:59Z", total_weeks: 16, proration_mode: "DAILY" }
              as: DiningServicesManager
              captures: { td_id: "$.data.id" }
            - call: "POST /api/meal-plans"
              payload: { plan_code: "COMM5", name: "Commuter 5", weekly_swipe_allowance: 5, dining_dollar_allocation_cents: 10000, price_cents: 90000, eligible_holder_types: ["STUDENT_COMMUTER", "STUDENT_RESIDENT"] }
              as: DiningServicesManager
              captures: { plan_id: "$.data.id" }
            - { call: "POST /api/meal-plans/${plan_id}/publish", payload: {}, as: DiningServicesManager }
            - { call: "POST /api/terms/${tw_id}/open", payload: {}, as: DiningServicesManager }
            - { call: "POST /api/terms/${td_id}/open", payload: {}, as: DiningServicesManager }
            - { call: "POST /api/terms/${tw_id}/advance-week", payload: {}, as: DiningServicesManager }
            - { call: "POST /api/terms/${tw_id}/advance-week", payload: {}, as: DiningServicesManager }
            - { call: "POST /api/terms/${td_id}/advance-week", payload: {}, as: DiningServicesManager }
            - { call: "POST /api/terms/${td_id}/advance-week", payload: {}, as: DiningServicesManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-09T10:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
              payload: { university_id: "U1001", full_name: "Ana Commuter", email: "ana@x.edu", holder_type: "STUDENT_COMMUTER", housing_status: "COMMUTER" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
          trigger:
            - call: "POST /api/card-holders/${h_id}/enrollments"
              payload: { plan_id: "${plan_id}", term_id: "${tw_id}" }
              as: DiningServicesManager
              captures: { enr_w: "$.data.id", enr_w_charge: "$.data.charge_cents" }
            - call: "POST /api/card-holders/${h_id}/enrollments"
              payload: { plan_id: "${plan_id}", term_id: "${td_id}" }
              as: DiningServicesManager
              captures: { enr_d: "$.data.id", enr_d_charge: "$.data.charge_cents" }
            - call: "GET /api/accounts"
              payload: { holder_id: "${h_id}", term_id: "${tw_id}" }
              as: BursarOffice
              captures: { acct_w_balance: "$.data[0].balance_cents" }
            - call: "GET /api/accounts"
              payload: { holder_id: "${h_id}", term_id: "${td_id}" }
              as: BursarOffice
              captures: { acct_d_balance: "$.data[0].balance_cents" }
          assert:
            - "MealPlanEnrollment.${enr_w}.charge_cents == 78750 (WEEKLY: 90000 * 14/16)"
            - "MealPlanEnrollment.${enr_d}.charge_cents == 77143 (DAILY: 90000 * 96/112)"
            - "enr_w_charge != enr_d_charge"
            - "DINING_DOLLARS account for FALLW balance_cents == 8750 (10000 * 14/16)"
            - "DINING_DOLLARS account for FALLD balance_cents == 8571 (10000 * 96/112 rounded half-up)"
            - "Both enrollments have status == ACTIVE and enrolled_week_index == 3"

      - name: settlement_commission_mode_variants_diverge
        grounds:
          - calculations.merchant_settlement_sweep
          - entities.Merchant.fields.commission_mode
          - entities.MerchantSettlement.fields.commission_cents
        distinguishing_aspect: |
          The dual variant lives in the MERCHANT SETTLEMENT domain (not enrollment): identical
          transactions and commission_bps produce different commission_cents depending on
          commission_mode PER_TRANSACTION (81) vs AGGREGATE (82).
        test_recipe:
          setup:
            - "Term SETT26 exists (2026-08-24..2026-12-13); two ACTIVE merchants MA (PER_TRANSACTION) and MB (AGGREGATE), both commission_bps 275"
            - "Holder with a fully photo-verified ACTIVE card and CAMPUS_CASH balance 10000"
            - "Six 999-cent merchant transactions posted at clock 2026-09-05T12:00:00Z, three per merchant"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T12:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/terms"
              payload: { term_code: "SETT26", name: "Settle Term", start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-13T23:59:59Z", add_drop_deadline: "2026-09-20T23:59:59Z", total_weeks: 16, proration_mode: "WEEKLY" }
              as: DiningServicesManager
              captures: { term_id: "$.data.id" }
            - call: "POST /api/merchants"
              payload: { merchant_code: "M-A", legal_name: "Cafe A", category: "COFFEE", commission_bps: 275, commission_mode: "PER_TRANSACTION", contact_email: "a@x.com" }
              as: BursarOffice
              captures: { ma_id: "$.data.id" }
            - call: "POST /api/merchants"
              payload: { merchant_code: "M-B", legal_name: "Cafe B", category: "COFFEE", commission_bps: 275, commission_mode: "AGGREGATE", contact_email: "b@x.com" }
              as: BursarOffice
              captures: { mb_id: "$.data.id" }
            - { call: "POST /api/merchants/${ma_id}/activate", payload: {}, as: BursarOffice }
            - { call: "POST /api/merchants/${mb_id}/activate", payload: {}, as: BursarOffice }
            - call: "POST /api/card-holders"
              payload: { university_id: "U2001", full_name: "Bob Resident", email: "bob@x.edu", holder_type: "STUDENT_RESIDENT", housing_status: "ON_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { card_id: "$.data.id" }
            - call: "POST /api/cards/${card_id}/photos"
              payload: { image_ref: "img://p1" }
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { photo_id: "$.data.id" }
            - { call: "POST /api/photos/${photo_id}/review", payload: { decision: "APPROVED" }, as: CardOfficeAdmin }
            - { call: "POST /api/cards/${card_id}/activate", payload: {}, as: CardOfficeAdmin }
            - call: "POST /api/card-holders/${h_id}/accounts"
              payload: { account_type: "CAMPUS_CASH" }
              as: BursarOffice
              captures: { acct_id: "$.data.id" }
            - { call: "POST /api/accounts/${acct_id}/funding", payload: { amount_cents: 10000, idempotency_key: "fund-1" }, as: BursarOffice }
            - { call: "POST /api/transactions", payload: { card_id: "${card_id}", tender_type: "CAMPUS_CASH", amount_cents: 999, idempotency_key: "t-a1", merchant_id: "${ma_id}" }, as: MerchantUser, as_user_id: "${ma_id}" }
            - { call: "POST /api/transactions", payload: { card_id: "${card_id}", tender_type: "CAMPUS_CASH", amount_cents: 999, idempotency_key: "t-a2", merchant_id: "${ma_id}" }, as: MerchantUser, as_user_id: "${ma_id}" }
            - { call: "POST /api/transactions", payload: { card_id: "${card_id}", tender_type: "CAMPUS_CASH", amount_cents: 999, idempotency_key: "t-a3", merchant_id: "${ma_id}" }, as: MerchantUser, as_user_id: "${ma_id}" }
            - { call: "POST /api/transactions", payload: { card_id: "${card_id}", tender_type: "CAMPUS_CASH", amount_cents: 999, idempotency_key: "t-b1", merchant_id: "${mb_id}" }, as: MerchantUser, as_user_id: "${mb_id}" }
            - { call: "POST /api/transactions", payload: { card_id: "${card_id}", tender_type: "CAMPUS_CASH", amount_cents: 999, idempotency_key: "t-b2", merchant_id: "${mb_id}" }, as: MerchantUser, as_user_id: "${mb_id}" }
            - { call: "POST /api/transactions", payload: { card_id: "${card_id}", tender_type: "CAMPUS_CASH", amount_cents: 999, idempotency_key: "t-b3", merchant_id: "${mb_id}" }, as: MerchantUser, as_user_id: "${mb_id}" }
          trigger:
            - call: "POST /api/merchants/${ma_id}/settlements"
              payload: { term_id: "${term_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T23:59:59Z" }
              as: MerchantUser
              as_user_id: "${ma_id}"
              captures: { sa_id: "$.data.id" }
            - call: "POST /api/settlements/${sa_id}/submit"
              payload: {}
              as: MerchantUser
              as_user_id: "${ma_id}"
              captures: { sa_gross: "$.data.gross_cents", sa_comm: "$.data.commission_cents", sa_net: "$.data.net_cents" }
            - call: "POST /api/merchants/${mb_id}/settlements"
              payload: { term_id: "${term_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T23:59:59Z" }
              as: MerchantUser
              as_user_id: "${mb_id}"
              captures: { sb_id: "$.data.id" }
            - call: "POST /api/settlements/${sb_id}/submit"
              payload: {}
              as: MerchantUser
              as_user_id: "${mb_id}"
              captures: { sb_gross: "$.data.gross_cents", sb_comm: "$.data.commission_cents", sb_net: "$.data.net_cents" }
          assert:
            - "MerchantSettlement.${sa_id}.gross_cents == 2997 and transaction_count == 3"
            - "MerchantSettlement.${sa_id}.commission_cents == 81 (3 x round_half_up(999*275/10000)=27)"
            - "MerchantSettlement.${sa_id}.net_cents == 2916"
            - "MerchantSettlement.${sb_id}.commission_cents == 82 (round_half_up(2997*275/10000))"
            - "MerchantSettlement.${sb_id}.net_cents == 2915"
            - "sa_comm != sb_comm despite identical gross and commission_bps"

  - rule_id: combinatorial_formula
    instances:
      - name: replacement_fee_tier_surcharge_surrender_interaction
        grounds:
          - calculations.replacement_fee_schedule
          - entities.CampusCard.fields.replacement_fee_cents
          - state_machines.CampusCard.STOLEN_FROZEN_to_REPLACED
        distinguishing_aspect: |
          Mode (a): the fee formula has 5 inputs with non-linear interaction — tiered schedule by
          replacement ordinal, a zero-branch for STOLEN-with-police, a 2x surcharge for
          STOLEN-without, and a max(0, ...) discount for DAMAGED-with-surrender; the three
          replacements yield 2500, 7000, 3500 respectively.
        test_recipe:
          setup:
            - "Holder U3001 STUDENT_RESIDENT; card c1 issued and provisionally activated"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
              payload: { university_id: "U3001", full_name: "Cara Resident", email: "cara@x.edu", holder_type: "STUDENT_RESIDENT", housing_status: "ON_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /api/cards/${c1}/activate"
              payload: { allow_provisional: true }
              as: CardOfficeAdmin
              captures: { c1_v: "$.data.version" }
            - call: "POST /api/cards/${c1}/report-lost"
              payload: {}
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { c1_lost_v: "$.data.version" }
          trigger:
            - call: "POST /api/cards/${c1}/replacement"
              payload: { reason: "LOST", expected_card_version: "${c1_lost_v}" }
              as: CardOfficeAdmin
              captures: { c2: "$.data.id", c2_fee: "$.data.replacement_fee_cents" }
            - call: "POST /api/cards/${c2}/activate"
              payload: { allow_provisional: true }
              as: CardOfficeAdmin
              captures: { c2_v: "$.data.version" }
            - call: "POST /api/cards/${c2}/report-stolen"
              payload: {}
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { c2_stolen_v: "$.data.version" }
            - call: "POST /api/cards/${c2}/replacement"
              payload: { reason: "STOLEN", expected_card_version: "${c2_stolen_v}" }
              as: CardOfficeAdmin
              captures: { c3: "$.data.id", c3_fee: "$.data.replacement_fee_cents" }
            - call: "POST /api/cards/${c3}/activate"
              payload: { allow_provisional: true }
              as: CardOfficeAdmin
              captures: { c3_v: "$.data.version" }
            - call: "POST /api/cards/${c3}/replacement"
              payload: { reason: "DAMAGED", surrendered: true, expected_card_version: "${c3_v}" }
              as: CardOfficeAdmin
              captures: { c4: "$.data.id", c4_fee: "$.data.replacement_fee_cents" }
            - call: "GET /api/accounts"
              payload: { holder_id: "${h_id}", account_type: "CAMPUS_CASH" }
              as: BursarOffice
              captures: { fee_acct_balance: "$.data[0].balance_cents" }
          assert:
            - "CampusCard.${c2}.replacement_fee_cents == 2500 (ordinal 1, LOST)"
            - "CampusCard.${c3}.replacement_fee_cents == 7000 (ordinal 2, STOLEN without police report: 3500 x 2)"
            - "CampusCard.${c4}.replacement_fee_cents == 3500 (ordinal 3, DAMAGED surrendered: max(0, 5000-1500))"
            - "CAMPUS_CASH account balance_cents == -13000 (fees may drive the account negative)"
            - "CardHolder.${h_id}.fraud_strike_count == 1 (only the stolen report)"

      - name: settlement_per_transaction_rounding_order
        grounds:
          - calculations.merchant_settlement_sweep
          - entities.MerchantSettlement.fields.gross_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — each transaction's commission is rounded
          half-up to whole cents BEFORE summing. Three 199-cent transactions at 275 bps yield
          commission 15 (3 x 5); the forbidden sum-then-round order would yield 16.
        test_recipe:
          setup:
            - "Term SETT26B exists; ACTIVE merchant MPER (PER_TRANSACTION, 275 bps)"
            - "Holder with photo-verified ACTIVE card, CAMPUS_CASH funded 10000; three 199-cent merchant transactions at 2026-09-05T12:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T12:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/terms"
              payload: { term_code: "SETT26B", name: "Settle B", start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-13T23:59:59Z", add_drop_deadline: "2026-09-20T23:59:59Z", total_weeks: 16, proration_mode: "WEEKLY" }
              as: DiningServicesManager
              captures: { term_id: "$.data.id" }
            - call: "POST /api/merchants"
              payload: { merchant_code: "M-PER", legal_name: "Deli Per", category: "RESTAURANT", commission_bps: 275, commission_mode: "PER_TRANSACTION", contact_email: "per@x.com" }
              as: BursarOffice
              captures: { m_id: "$.data.id" }
            - { call: "POST /api/merchants/${m_id}/activate", payload: {}, as: BursarOffice }
            - call: "POST /api/card-holders"
              payload: { university_id: "U3002", full_name: "Dan Resident", email: "dan@x.edu", holder_type: "STUDENT_RESIDENT", housing_status: "ON_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { card_id: "$.data.id" }
            - call: "POST /api/cards/${card_id}/photos"
              payload: { image_ref: "img://p2" }
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { photo_id: "$.data.id" }
            - { call: "POST /api/photos/${photo_id}/review", payload: { decision: "APPROVED" }, as: CardOfficeAdmin }
            - { call: "POST /api/cards/${card_id}/activate", payload: {}, as: CardOfficeAdmin }
            - call: "POST /api/card-holders/${h_id}/accounts"
              payload: { account_type: "CAMPUS_CASH" }
              as: BursarOffice
              captures: { acct_id: "$.data.id" }
            - { call: "POST /api/accounts/${acct_id}/funding", payload: { amount_cents: 10000, idempotency_key: "fund-p1" }, as: BursarOffice }
            - { call: "POST /api/transactions", payload: { card_id: "${card_id}", tender_type: "CAMPUS_CASH", amount_cents: 199, idempotency_key: "p-t1", merchant_id: "${m_id}" }, as: MerchantUser, as_user_id: "${m_id}" }
            - { call: "POST /api/transactions", payload: { card_id: "${card_id}", tender_type: "CAMPUS_CASH", amount_cents: 199, idempotency_key: "p-t2", merchant_id: "${m_id}" }, as: MerchantUser, as_user_id: "${m_id}" }
            - { call: "POST /api/transactions", payload: { card_id: "${card_id}", tender_type: "CAMPUS_CASH", amount_cents: 199, idempotency_key: "p-t3", merchant_id: "${m_id}" }, as: MerchantUser, as_user_id: "${m_id}" }
          trigger:
            - call: "POST /api/merchants/${m_id}/settlements"
              payload: { term_id: "${term_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T23:59:59Z" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { s_id: "$.data.id" }
            - call: "POST /api/settlements/${s_id}/submit"
              payload: {}
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { s_gross: "$.data.gross_cents", s_comm: "$.data.commission_cents", s_net: "$.data.net_cents" }
          assert:
            - "MerchantSettlement.${s_id}.gross_cents == 597"
            - "MerchantSettlement.${s_id}.commission_cents == 15 (round-per-transaction then sum)"
            - "MerchantSettlement.${s_id}.commission_cents != 16 (the sum-then-round result is forbidden)"
            - "MerchantSettlement.${s_id}.net_cents == 582"

      - name: plan_change_proration_pinned_evaluation_order
        grounds:
          - calculations.plan_change_proration
          - state_machines.PlanChangeRequest.SUBMITTED_to_APPROVED
          - state_machines.MealPlanEnrollment.ACTIVE_to_SUPERSEDED
          - concurrency_rules[change-request-stale-enrollment]
        distinguishing_aspect: |
          Mode (c): charge_delta depends on credit_from_old which depends on old_earned which
          depends on the already-charged C_old — the scaffold pins the evaluation order
          old_earned -> credit -> new_due -> delta, yielding charge_delta 105625 and
          funding_delta 20313 for a week-4-effective WEEKLY change; any other grouping of the
          same terms produces a different delta.
        test_recipe:
          setup:
            - "Term FALLPC (WEEKLY, 16 weeks, 2026-08-24..2026-12-13, add_drop 2026-09-20) OPEN at week 3; clock 2026-09-09T10:00:00Z"
            - "Plans COMM5 (price 90000, dining 10000) and RESUNL (price 220000, dining 25000, unlimited swipes, requires ON_CAMPUS) both PUBLISHED"
            - "Holder U3003 STUDENT_RESIDENT ON_CAMPUS with ACTIVE COMM5 enrollment since week 1 (charge_cents 90000, dining account funded 10000)"
            - "Holder's CAMPUS_CASH funded 200000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/terms"
              payload: { term_code: "FALLPC", name: "Fall PC", start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-13T23:59:59Z", add_drop_deadline: "2026-09-20T23:59:59Z", total_weeks: 16, proration_mode: "WEEKLY" }
              as: DiningServicesManager
              captures: { term_id: "$.data.id" }
            - call: "POST /api/meal-plans"
              payload: { plan_code: "COMM5-PC", name: "Commuter 5", weekly_swipe_allowance: 5, dining_dollar_allocation_cents: 10000, price_cents: 90000, eligible_holder_types: ["STUDENT_COMMUTER", "STUDENT_RESIDENT"] }
              as: DiningServicesManager
              captures: { comm5_id: "$.data.id" }
            - call: "POST /api/meal-plans"
              payload: { plan_code: "RESUNL-PC", name: "Resident Unlimited", weekly_swipe_allowance: 0, is_unlimited_swipes: true, dining_dollar_allocation_cents: 25000, price_cents: 220000, requires_on_campus_housing: true, eligible_holder_types: ["STUDENT_RESIDENT"] }
              as: DiningServicesManager
              captures: { resunl_id: "$.data.id" }
            - { call: "POST /api/meal-plans/${comm5_id}/publish", payload: {}, as: DiningServicesManager }
            - { call: "POST /api/meal-plans/${resunl_id}/publish", payload: {}, as: DiningServicesManager }
            - { call: "POST /api/terms/${term_id}/open", payload: {}, as: DiningServicesManager }
            - call: "POST /api/card-holders"
              payload: { university_id: "U3003", full_name: "Eli Resident", email: "eli@x.edu", holder_type: "STUDENT_RESIDENT", housing_status: "ON_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/enrollments"
              payload: { plan_id: "${comm5_id}", term_id: "${term_id}" }
              as: DiningServicesManager
              captures: { enr_id: "$.data.id" }
            - { call: "POST /api/terms/${term_id}/advance-week", payload: {}, as: DiningServicesManager }
            - { call: "POST /api/terms/${term_id}/advance-week", payload: {}, as: DiningServicesManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-09T10:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders/${h_id}/accounts"
              payload: { account_type: "CAMPUS_CASH" }
              as: BursarOffice
