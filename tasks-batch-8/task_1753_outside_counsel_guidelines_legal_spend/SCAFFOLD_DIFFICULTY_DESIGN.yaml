  - rule_id: transitive_cascade
    instances:
      - name: appeal_grant_three_hop_cascade
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_GRANTED
          - state_machines.InvoiceLineItem.REJECTED_to_REINSTATED
          - calculations.invoice_payable_amount
        distinguishing_aspect: |
          Depth-3 cascade originating from Appeal grant: hop1 flips the line
          REJECTED→REINSTATED, hop2 recomputes Invoice.approved_total_cents,
          hop3 credits Matter.billed_to_date_cents by the reinstated amount.
        test_recipe:
          setup:
            - "Matter ENGAGED, budget=100000000"
            - "Invoice INV-G submitted with line1 clean (1000000 cents) and line2 block-billing flagged (500000 cents) → PARTIALLY_APPROVED, approved_total=1000000, billed_to_date=1000000"
            - "Appeal on line2 SUBMITTED then claimed (UNDER_REVIEW)"
