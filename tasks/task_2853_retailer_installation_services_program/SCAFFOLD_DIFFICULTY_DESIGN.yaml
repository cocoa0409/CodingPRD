  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # Three simultaneous violations, three DIFFERENT error-category pairs:
  #   auth (p2) vs business_fiscal (p34)
  #   business_safety (p17) vs business_temporal (p23)
  #   existence (p7) vs state (p10)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: coordinator_paying_a_wrong_deposit_is_rejected_for_role_before_amount
        grounds:
          - validations[priority 2].ERR_UNAUTHORIZED_ROLE
          - validations[priority 34].ERR_DEPOSIT_AMOUNT_MISMATCH
          - endpoints[POST /projects/{id}/deposit]
          - errors.ERR_UNAUTHORIZED_ROLE
          - errors.ERR_DEPOSIT_AMOUNT_MISMATCH
        distinguishing_aspect: |
          Category pair auth (priority 2) vs business_fiscal (priority 34): the
          single request violates BOTH, and the auth rule must win, so the
          response is ERR_UNAUTHORIZED_ROLE (403) and NOT
          ERR_DEPOSIT_AMOUNT_MISMATCH (422). An implementation that validates the
          money before the role returns 422 and fails this instance.
        test_recipe:
          setup:
            - "ServiceCategory FLOOR-DIRECT and Jurisdiction METRO-01 (labor_complexity_multiplier 1.15)."
            - "One Customer and one Project with estimated_units 420.00, so quoted_labor_cents is 196673 and deposit_required_cents is 59002."
            - "Project.financial_status is QUOTED — no deposit taken yet, so the fiscal rule is live."
            - "POST /projects/{id}/deposit declares roles: [Customer] only, so ProjectCoordinator is an unauthorized role."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id, dep_required: $.data.deposit_required_cents }
          trigger:
            - call: "POST /projects/${proj_id}/deposit"
              payload: { amount_cents: 12345 }
              as: ProjectCoordinator
          assert:
            - "HTTP 403 with error_id ERR_UNAUTHORIZED_ROLE, not 422 ERR_DEPOSIT_AMOUNT_MISMATCH"
            - "Project.${proj_id}.deposit_required_cents == 59002 (confirming the amount 12345 really was wrong)"
            - "Project.${proj_id}.financial_status == QUOTED AND deposit_paid_cents == 0 AND deposit_held_cents == 0"

      - name: unlicensed_installer_with_overlapping_window_is_rejected_for_licence_first
        grounds:
          - validations[priority 17].ERR_INSTALLER_NOT_LICENSED
          - validations[priority 23].ERR_INSTALLER_WINDOW_CONFLICT
          - calculations.installer_capacity_and_overlap.constants.TRAVEL_BUFFER_MINUTES
          - entities.Jurisdiction.fields.license_required
          - endpoints[POST /installer-assignments]
        distinguishing_aspect: |
          A DIFFERENT category pair — business_safety (priority 17) vs
          business_temporal (priority 23). The installer both lacks a VERIFIED
          credential for the second project's jurisdiction AND already holds a
          live window that overlaps the requested one, so the licence check must
          win: ERR_INSTALLER_NOT_LICENSED (409), not
          ERR_INSTALLER_WINDOW_CONFLICT (409). Both errors share HTTP 409, so
          only the error_id distinguishes a correct implementation.
        test_recipe:
          setup:
            - "ServiceCategory FLOOR-DIRECT (measurement_required false, permit_policy NEVER, trade_code FLOORING)."
            - "Jurisdiction METRO-01 (license_required true, labor_complexity_multiplier 1.15) and Jurisdiction METRO-02 (license_required true, labor_complexity_multiplier 1.00)."
            - "One Installer ACTIVE holding a VERIFIED FLOORING credential for METRO-01 ONLY — nothing for METRO-02."
            - "Project P1 in METRO-01, estimated_units 420.00, deposit 59002 paid, with a CONFIRMED assignment for [2026-08-25T08:00:00.000Z, 2026-08-25T16:00:00.000Z)."
            - "Project P2 in METRO-02 for a second customer, estimated_units 420.00, so quoted_labor_cents is 171020 and deposit_required_cents is 51306; that deposit is paid so the fiscal precondition at priority 35 is satisfied."
            - "The requested P2 window [2026-08-25T12:00:00.000Z, 2026-08-25T14:00:00.000Z) sits strictly inside P1's live window, so the overlap rule is unambiguously violated too."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur1_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-02", name: "Harbor Township", permit_required_trades: [], permit_responsible_party: "CUSTOMER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 0, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.00, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur2_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur1_id}" }
              as: ProgramAdmin
              captures: { cust1_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Miles Okafor", email: "miles@example.com", jurisdiction_id: "${jur2_id}" }
              as: ProgramAdmin
              captures: { cust2_id: $.data.id }
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z" }
              as: NetworkManager
              captures: { inst_id: $.data.id }
            - call: "POST /installers/${inst_id}/credentials"
              payload: { jurisdiction_id: "${jur1_id}", trade_code: "FLOORING", license_number: "FL-99213", license_expires_on: "2027-05-31T00:00:00.000Z", permit_pulling_authorized: true }
              as: NetworkManager
              captures: { cred_id: $.data.id }
            - call: "POST /installer-credentials/${cred_id}/verify"
              payload: { verification_decision: "VERIFY" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/background-check"
              payload: { result: "PASS", completed_at: "2026-07-15T00:00:00.000Z" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /projects"
              payload: { customer_id: "${cust1_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur1_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /projects/${p1_id}/deposit"
              payload: { amount_cents: 59002 }
              as: Customer
              as_user_id: "${cust1_id}"
              captures: { p1_version: $.data.version }
            - call: "POST /installer-assignments"
              payload: { project_id: "${p1_id}", installer_id: "${inst_id}", window_start: "2026-08-25T08:00:00.000Z", window_end: "2026-08-25T16:00:00.000Z", expected_project_version: "${p1_version}" }
              as: ProjectCoordinator
              captures: { a1_id: $.data.id }
            - call: "POST /installer-assignments/${a1_id}/confirm"
              payload: {}
              as: ProjectCoordinator
            - call: "POST /projects"
              payload: { customer_id: "${cust2_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur2_id}", site_address: "40 Harbor Row", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { p2_id: $.data.id, p2_quoted: $.data.quoted_labor_cents, p2_deposit: $.data.deposit_required_cents }
            - call: "POST /projects/${p2_id}/deposit"
              payload: { amount_cents: 51306 }
              as: Customer
              as_user_id: "${cust2_id}"
              captures: { p2_version: $.data.version }
          trigger:
            - call: "POST /installer-assignments"
              payload: { project_id: "${p2_id}", installer_id: "${inst_id}", window_start: "2026-08-25T12:00:00.000Z", window_end: "2026-08-25T14:00:00.000Z", expected_project_version: "${p2_version}" }
              as: ProjectCoordinator
          assert:
