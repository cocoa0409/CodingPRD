            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
            - call: "POST /farm-network/routes"
              payload: { route_date: "2026-09-08", driver_name: "Dale", capacity_cases: 10 }
              as: PlantOperator
              captures: { r1_id: $.data.id }
            - call: "POST /farm-network/routes/${r1_id}/stops"
              payload: { farm_id: "${f_id}", stop_sequence: 1, planned_cases: 1 }
              as: PlantOperator
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/routes/${r1_id}/stops/1/collect"
              payload: { collected_cases: 1, laid_start_date: "2026-09-06", laid_end_date: "2026-09-07" }
              as: PlantOperator
              captures: { lot1_id: $.data.id }
            - call: "POST /farm-network/lots/${lot1_id}/grade"
              payload: { quality_score: 96 }
              as: QualityManager
            - call: "POST /farm-network/lots/${lot1_id}/cartons"
              payload: { carton_count: 3, pack_size: "LARGE" }
              as: PlantOperator
            - call: "POST /farm-network/routes"
              payload: { route_date: "2026-09-09", driver_name: "Dale", capacity_cases: 10 }
              as: PlantOperator
