              captures: { area_v1: $.data.version }
            - call: "POST /mep/recruiter-assignments"
              payload: { recruiter_id: "${rec_a_id}", area_id: "${area_id}", coverage_role: "PRIMARY", starts_on: "2026-05-01", ends_on: "2026-10-31", expected_area_version: "${area_v1}" }
              as: StateProgramAdmin
              captures: { asg_id: $.data.id, asg_status_initial: $.data.status }
            - call: "PATCH /mep/recruiters/${rec_a_id}"
              payload: { status: "SUSPENDED" }
              as: StateProgramAdmin
              captures: { rec_status: $.data.status }
            - call: "PATCH /mep/areas/${area_id}"
              payload: { status: "CLOSED" }
              as: StateProgramAdmin
              captures: { area_status: $.data.status }
          trigger:
            - call: "POST /mep/recruiter-assignments/${asg_id}/activate"
              payload: {}
              as: StateProgramAdmin
            - call: "PATCH /mep/recruiters/${rec_a_id}"
              payload: { status: "ACTIVE" }
              as: StateProgramAdmin
            - call: "POST /mep/recruiter-assignments/${asg_id}/activate"
              payload: {}
              as: StateProgramAdmin
            - call: "PATCH /mep/areas/${area_id}"
              payload: { status: "OPEN" }
              as: StateProgramAdmin
            - call: "POST /mep/recruiter-assignments/${asg_id}/activate"
              payload: {}
              as: StateProgramAdmin
              captures: { asg_status_final: $.data.status }
          assert:
            - "the assignment was created successfully as PLANNED while both parents were valid"
            - "attempt 1 (recruiter SUSPENDED and area CLOSED): HTTP 409 with error.error_id == ERR_RECRUITER_NOT_ACTIVE, not ERR_AREA_NOT_OPEN"
            - "attempt 2 (recruiter ACTIVE again, area still CLOSED): HTTP 409 with error.error_id == ERR_AREA_NOT_OPEN"
            - "after attempts 1 and 2 RecruiterAssignment.${asg_id}.status is still PLANNED and activated_on is null"
            - "attempt 3 (both parents valid): HTTP 200 with RecruiterAssignment.${asg_id}.status == ACTIVE and activated_on == 2026-08-01T00:00:00Z"
            - "Recruiter.${rec_a_id}.active_assignment_count == 1 throughout, since PLANNED already counts"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: recruiter_pairwise_overlap_is_unbuffered_and_rejects_a_single_shared_day
        grounds:
          - validations[priority 20 ERR_RECRUITER_ASSIGNMENT_OVERLAP]
          - calculations.area_coverage_occupancy
          - entities.RecruiterAssignment.fields.starts_on
          - entities.RecruiterAssignment.fields.ends_on
          - endpoints[POST /mep/recruiter-assignments]
        distinguishing_aspect: |
          Rule 1 of area_coverage_occupancy guards the RECRUITER as the scarce resource with
          CLOSED, UNBUFFERED intervals, so a single shared calendar day (2026-10-31) is a conflict
          while perfect adjacency (previous ends_on + 1 day == new starts_on) is legal. The
          accepted candidate 2026-11-01..2026-11-30 deliberately starts INSIDE the area's 3-day
          handoff buffer, proving rule 1 does not borrow rule 2's buffer.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea with recruiter_capacity 3 (generous, so the aggregate occupancy rule cannot fire) and peak season 2026-06-01..2026-09-30"
            - "one ACTIVE Recruiter holding a PLANNED PRIMARY assignment 2026-05-01..2026-10-31 in that area"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Skagit Flats", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "GET /mep/areas/${area_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { area_v1: $.data.version }
            - call: "POST /mep/recruiter-assignments"
              payload: { recruiter_id: "${rec_a_id}", area_id: "${area_id}", coverage_role: "PRIMARY", starts_on: "2026-05-01", ends_on: "2026-10-31", expected_area_version: "${area_v1}" }
              as: StateProgramAdmin
              captures: { asg_1_id: $.data.id }
            - call: "GET /mep/areas/${area_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { area_v2: $.data.version }
          trigger:
            - call: "POST /mep/recruiter-assignments"
              payload: { recruiter_id: "${rec_a_id}", area_id: "${area_id}", coverage_role: "BACKUP", starts_on: "2026-10-31", ends_on: "2026-11-30", expected_area_version: "${area_v2}" }
              as: StateProgramAdmin
            - call: "POST /mep/recruiter-assignments"
              payload: { recruiter_id: "${rec_a_id}", area_id: "${area_id}", coverage_role: "BACKUP", starts_on: "2026-11-01", ends_on: "2026-11-30", expected_area_version: "${area_v2}" }
              as: StateProgramAdmin
              captures: { asg_2_id: $.data.id, asg_2_status: $.data.status }
          assert:
            - "candidate starting 2026-10-31: HTTP 409 with error.error_id == ERR_RECRUITER_ASSIGNMENT_OVERLAP (exactly one day, 2026-10-31, is shared with assignment ${asg_1_id})"
            - "the rejected attempt left AgriculturalArea.${area_id}.version at ${area_v2} and Recruiter.${rec_a_id}.active_assignment_count at 1"
            - "candidate starting 2026-11-01: HTTP 201 with RecruiterAssignment.${asg_2_id}.status == PLANNED, starts_on == 2026-11-01, ends_on == 2026-11-30"
            - "the accepted candidate starts on 2026-11-01, which lies inside the existing interval's 3-day handoff buffer ending 2026-11-03, and is accepted anyway because rule 1 applies no buffer"
            - "after acceptance Recruiter.${rec_a_id}.active_assignment_count == 2 and AgriculturalArea.${area_id}.assigned_primary_slots_used == 1 (the BACKUP row consumes no PRIMARY slot)"
            - "GET /mep/recruiter-assignments filtered by recruiter_id ${rec_a_id} returns exactly 2 rows"

      - name: area_occupancy_is_buffered_and_rejects_a_candidate_inside_the_handoff_window
        grounds:
          - validations[priority 29 ERR_AREA_COVERAGE_CAPACITY_EXCEEDED]
          - calculations.area_coverage_occupancy
          - calculations.area_coverage_occupancy.constants.HANDOFF_BUFFER_DAYS
          - entities.AgriculturalArea.fields.recruiter_capacity
          - endpoints[POST /mep/recruiter-assignments]
        distinguishing_aspect: |
          Rule 2 guards a DIFFERENT scarce resource (the AREA, aggregated day by day) with a
          DIFFERENT geometry (each existing interval widened by HANDOFF_BUFFER_DAYS = 3 on each
          side) and for a DIFFERENT recruiter, so rule 1 cannot fire at all. With capacity 1 the
          rejection boundary is the buffered end 2026-11-03: a candidate starting 2026-11-02 is
          refused and the very next legal start, 2026-11-04, is accepted. An unbuffered
          implementation accepts 2026-11-01 and never produces this error.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea with recruiter_capacity 1 and peak season 2026-06-01..2026-09-30"
            - "recruiter A holds a PLANNED PRIMARY assignment 2026-05-01..2026-10-31 in that area, consuming the only slot; its buffered footprint runs 2026-04-28..2026-11-03"
            - "recruiter B holds no assignments at all, so the pairwise recruiter rule is inert"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Skagit Flats", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 1 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Ken Ortiz", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_b_id: $.data.id }
            - call: "GET /mep/areas/${area_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { area_v1: $.data.version }
            - call: "POST /mep/recruiter-assignments"
              payload: { recruiter_id: "${rec_a_id}", area_id: "${area_id}", coverage_role: "PRIMARY", starts_on: "2026-05-01", ends_on: "2026-10-31", expected_area_version: "${area_v1}" }
              as: StateProgramAdmin
              captures: { asg_1_id: $.data.id }
            - call: "GET /mep/areas/${area_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { area_v2: $.data.version }
          trigger:
            - call: "POST /mep/recruiter-assignments"
              payload: { recruiter_id: "${rec_b_id}", area_id: "${area_id}", coverage_role: "BACKUP", starts_on: "2026-11-02", ends_on: "2026-11-30", expected_area_version: "${area_v2}" }
              as: StateProgramAdmin
            - call: "POST /mep/recruiter-assignments"
              payload: { recruiter_id: "${rec_b_id}", area_id: "${area_id}", coverage_role: "BACKUP", starts_on: "2026-11-04", ends_on: "2026-11-30", expected_area_version: "${area_v2}" }
              as: StateProgramAdmin
              captures: { asg_2_id: $.data.id, asg_2_start: $.data.starts_on }
          assert:
            - "candidate starting 2026-11-02: HTTP 409 with error.error_id == ERR_AREA_COVERAGE_CAPACITY_EXCEEDED (occupancy on 2026-11-02 and 2026-11-03 is 1 existing + 1 candidate == 2 > capacity 1)"
            - "the error is ERR_AREA_COVERAGE_CAPACITY_EXCEEDED and not ERR_RECRUITER_ASSIGNMENT_OVERLAP, because recruiter B has no other assignment"
            - "the error is not ERR_PEAK_SEASON_NOT_COVERED, because the candidate is BACKUP and rule 3 is PRIMARY-only"
            - "the rejected attempt left AgriculturalArea.${area_id}.version at ${area_v2} and assigned_primary_slots_used at 1"
            - "candidate starting 2026-11-04: HTTP 201 with RecruiterAssignment.${asg_2_id}.starts_on == 2026-11-04 and status == PLANNED"
            - "2026-11-04 is the first day strictly after the buffered end 2026-10-31 + 3 == 2026-11-03, so the two candidates differ by two calendar days across the boundary"
            - "after acceptance AgriculturalArea.${area_id}.assigned_primary_slots_used == 1 and Recruiter.${rec_b_id}.active_assignment_count == 1"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: area_primary_slot_counter_returns_to_its_pre_assignment_integer_after_cancellation
        grounds:
          - calculations.area_coverage_occupancy
          - entities.AgriculturalArea.fields.assigned_primary_slots_used
          - entities.Recruiter.fields.active_assignment_count
          - state_machines.RecruiterAssignment.PLANNED_to_CANCELLED
          - endpoints[POST /mep/recruiter-assignments/{assignment_id}/close]
        distinguishing_aspect: |
          The conserved quantity is the INTEGER counter AgriculturalArea.assigned_primary_slots_used
          (mirrored by Recruiter.active_assignment_count). Creating a second PRIMARY assignment
          raises it 1 -> 2 and cancelling that assignment must return it to exactly 1 - not to 0
          and not left at 2 - while AgriculturalArea.version keeps moving forward by 2, so the
          counter is genuinely recomputed from live rows rather than restored by rolling the
          parent back.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea with recruiter_capacity 3 and peak season 2026-06-01..2026-09-30"
            - "two ACTIVE Recruiters"
            - "recruiter A holds one PLANNED PRIMARY assignment 2026-05-01..2026-10-31, so the counter starts at 1"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Skagit Flats", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Ken Ortiz", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_b_id: $.data.id }
            - call: "GET /mep/areas/${area_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { area_v1: $.data.version }
            - call: "POST /mep/recruiter-assignments"
              payload: { recruiter_id: "${rec_a_id}", area_id: "${area_id}", coverage_role: "PRIMARY", starts_on: "2026-05-01", ends_on: "2026-10-31", expected_area_version: "${area_v1}" }
              as: StateProgramAdmin
              captures: { asg_1_id: $.data.id }
            - call: "GET /mep/areas/${area_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { area_v2: $.data.version, slots_before: $.data.assigned_primary_slots_used }
          trigger:
            - call: "POST /mep/recruiter-assignments"
              payload: { recruiter_id: "${rec_b_id}", area_id: "${area_id}", coverage_role: "PRIMARY", starts_on: "2026-04-01", ends_on: "2026-10-31", expected_area_version: "${area_v2}" }
              as: StateProgramAdmin
              captures: { asg_2_id: $.data.id }
            - call: "GET /mep/areas/${area_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { slots_mid: $.data.assigned_primary_slots_used, area_v3: $.data.version }
            - call: "POST /mep/recruiter-assignments/${asg_2_id}/close"
              payload: { outcome: "CANCELLED", cancelled_reason: "Recruiter reassigned to another region before the season opened." }
              as: StateProgramAdmin
              captures: { asg_2_status: $.data.status }
            - call: "GET /mep/areas/${area_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { slots_after: $.data.assigned_primary_slots_used, area_v4: $.data.version }
          assert:
            - "before the trigger AgriculturalArea.${area_id}.assigned_primary_slots_used == 1"
            - "after the create AgriculturalArea.${area_id}.assigned_primary_slots_used == 2 and Recruiter.${rec_b_id}.active_assignment_count == 1"
            - "after the cancellation RecruiterAssignment.${asg_2_id}.status == CANCELLED with cancelled_reason stored and outcome CANCELLED"
            - "after the cancellation AgriculturalArea.${area_id}.assigned_primary_slots_used == 1 - exactly the pre-create value, not 0"
            - "after the cancellation Recruiter.${rec_b_id}.active_assignment_count == 0 and Recruiter.${rec_a_id}.active_assignment_count == 1 (untouched)"
            - "AgriculturalArea.${area_id}.version advanced by exactly 2 across the trigger (one bump for the create, one for the close), so the counter was recomputed rather than rolled back"
            - "RecruiterAssignment.${asg_1_id}.status is still PLANNED - the compensation touched only the cancelled row"

      - name: student_hours_and_credits_ledger_returns_to_its_exact_pre_create_decimals_after_reversal
        grounds:
          - calculations.student_service_hours_ledger
          - entities.Student.fields.total_service_hours_ledger
          - entities.Student.fields.locally_accrued_credits
          - entities.Student.fields.total_awarded_credits
          - entities.ServicePlan.fields.delivered_hours
          - entities.ServiceDelivery.fields.reverses_delivery_id
          - endpoints[POST /mep/service-deliveries/{delivery_id}/reverse]
        distinguishing_aspect: |
          A DIFFERENT conserved quantity in a DIFFERENT unit and by a DIFFERENT mechanism: two
          2-decimal Decimal aggregates (total_service_hours_ledger and locally_accrued_credits)
          are restored not by deleting or mutating the forward record but by INSERTING an
          immutable compensating record, so the row count grows from 2 to 4 while both sums fall
          back to exactly 3.75 hours and 1.25 credits. Both the reversed forward row and the
          reversal row must be excluded, so an implementation that excludes only one drifts.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one ELIGIBLE Student certified end-to-end with one ACTIVE CREDIT_ACCRUAL ServicePlan"
            - "two forward deliveries on that plan: 1.50 hours / 0.50 credits and 2.25 hours / 0.75 credits, so the ledger sits at 3.75 hours and 1.25 credits"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}", schooling_status: "ENROLLED", grade_level: 9, school_days_interrupted: 10, math_below_grade: true, reading_below_grade: true, credit_deficit: 2 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-06-15", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 820.50 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_id: $.data.id }
            - call: "POST /mep/qualifying-moves/${move_id}/adjudicate"
              payload: { decision: "VERIFIED" }
              as: StateProgramAdmin
            - call: "POST /mep/interview-records"
              payload: { student_id: "${stu_id}", move_id: "${move_id}", interview_kind: "INITIAL", conducted_on: "2026-06-20", informant_relationship: "PARENT", outcome: "SUPPORTS_ELIGIBILITY", documentation_notes: "Parent confirms apple harvest work.", corroboration_count: 1 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { int_a_id: $.data.id }
            - call: "POST /mep/coes"
              payload: { student_id: "${stu_id}", move_id: "${move_id}", residency_date: "2026-07-01", qc_hold_exempt: true }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { coe_id: $.data.id }
            - call: "POST /mep/coes/${coe_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "${rec_a_id}"
            - call: "POST /mep/coes/${coe_id}/approve"
              payload: {}
              as: StateProgramAdmin
            - call: "GET /mep/students/${stu_id}"
              payload: {}
              as: ServiceCoordinator
              captures: { stu_v1: $.data.version }
            - call: "POST /mep/service-plans"
              payload: { student_id: "${stu_id}", plan_type: "CREDIT_ACCRUAL", delivery_mode: "IN_PERSON", expected_student_version: "${stu_v1}" }
              as: ServiceCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /mep/service-plans/${plan_id}/activate"
              payload: {}
              as: ServiceCoordinator
            - call: "POST /mep/service-deliveries"
              payload: { plan_id: "${plan_id}", delivered_on: "2026-07-10", hours: 1.50, service_category: "CREDIT_ACCRUAL_SESSION", credits_awarded: 0.50 }
              as: ServiceCoordinator
              captures: { del_1_id: $.data.id }
            - call: "POST /mep/service-deliveries"
              payload: { plan_id: "${plan_id}", delivered_on: "2026-07-15", hours: 2.25, service_category: "CREDIT_ACCRUAL_SESSION", credits_awarded: 0.75 }
              as: ServiceCoordinator
              captures: { del_2_id: $.data.id }
            - call: "GET /mep/students/${stu_id}"
              payload: {}
              as: ServiceCoordinator
              captures: { hours_before: $.data.total_service_hours_ledger, credits_before: $.data.locally_accrued_credits }
          trigger:
            - call: "POST /mep/service-deliveries"
              payload: { plan_id: "${plan_id}", delivered_on: "2026-07-20", hours: 4.00, service_category: "CREDIT_ACCRUAL_SESSION", credits_awarded: 1.00 }
              as: ServiceCoordinator
              captures: { del_3_id: $.data.id }
            - call: "GET /mep/students/${stu_id}"
              payload: {}
              as: ServiceCoordinator
              captures: { hours_mid: $.data.total_service_hours_ledger, credits_mid: $.data.locally_accrued_credits }
            - call: "POST /mep/service-deliveries/${del_3_id}/reverse"
              payload: {}
              as: ServiceCoordinator
              captures: { rev_id: $.data.id, rev_target: $.data.reverses_delivery_id, rev_hours: $.data.hours }
            - call: "GET /mep/students/${stu_id}"
              payload: {}
              as: ServiceCoordinator
              captures: { hours_after: $.data.total_service_hours_ledger, credits_after: $.data.locally_accrued_credits }
          assert:
            - "before the trigger Student.${stu_id}.total_service_hours_ledger == 3.75, locally_accrued_credits == 1.25, total_awarded_credits == 1.25 and ServicePlan.${plan_id}.delivered_hours == 3.75"
            - "after the 4.00-hour create Student.${stu_id}.total_service_hours_ledger == 7.75 and locally_accrued_credits == 2.25"
            - "the reverse call returns HTTP 201 and the body is the REVERSAL record: ServiceDelivery.${rev_id}.reverses_delivery_id == ${del_3_id}, hours == 4.00, credits_awarded == 1.00 and ${rev_id} != ${del_3_id}"
            - "after the reverse ServiceDelivery.${del_3_id}.is_reversed == true and ServiceDelivery.${rev_id}.is_reversed == false"
            - "after the reverse Student.${stu_id}.total_service_hours_ledger == 3.75 exactly - the pre-create value, not 7.75 and not 11.75"
            - "after the reverse Student.${stu_id}.locally_accrued_credits == 1.25 and total_awarded_credits == 1.25 exactly"
            - "after the reverse ServicePlan.${plan_id}.delivered_hours == 3.75 and GET /mep/service-deliveries filtered by plan_id ${plan_id} returns 4 rows, of which 1 has reverses_delivery_id set"
            - "ServiceDelivery.${del_1_id}.is_reversed == false and ServiceDelivery.${del_2_id}.is_reversed == false - the compensation touched only the third delivery"
