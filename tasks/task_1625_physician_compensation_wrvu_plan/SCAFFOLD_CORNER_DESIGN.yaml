scaffold_corner_design:
  - section: entities
    instances:
      - name: physician_create_missing_required_npi
        claim_type: required_fields
        grounds: [entities.Physician.fields.npi, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required input field npi fails with 400 ERR_VALIDATION before any persistence."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /comp/physicians", payload: { full_name: "No NPI", specialty: "IM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2020-01-01" }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Response is 400 with error_id == \"ERR_VALIDATION\""
            - "GET /comp/physicians/${any} finds nothing created — response has no id to capture and no physician row exists"
      - name: physician_create_invalid_enum_provider_type
        claim_type: type_constraints
        grounds: [entities.Physician.fields.provider_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "provider_type outside {PHYSICIAN, APP} is rejected; enum closure is enforced at write time."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /comp/physicians", payload: { npi: "1000000201", full_name: "Bad Enum", specialty: "IM", provider_type: "DO", fte: 1.0, hire_date: "2020-01-01" }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Response is 400 with error_id == \"ERR_VALIDATION\""
      - name: physician_create_invalid_fte_range
        claim_type: type_constraints
        grounds: [entities.Physician.fields.fte, "errors[ERR_VALIDATION]", "validations[priority=14]"]
        distinguishing_aspect: "fte outside (0, 1.0] — here 1.5 — is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /comp/physicians", payload: { npi: "1000000202", full_name: "Over FTE", specialty: "IM", provider_type: PHYSICIAN, fte: 1.5, hire_date: "2020-01-01" }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Response is 400 with error_id == \"ERR_VALIDATION\""
      - name: plan_create_defaults_applied
        claim_type: defaults
        grounds: [entities.CompPlan.fields.credit_attribution_mode, entities.CompPlan.fields.quality_model, entities.CompPlan.fields.status]
        distinguishing_aspect: "Omitting the two optional enum inputs yields the pinned defaults and the DRAFT initial state with version 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /comp/comp-plans", payload: { name: "Defaults", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
          assert:
            - "CompPlan.${plan}.credit_attribution_mode == \"SERVICE_DATE\" and quality_model == \"ALL_OR_NOTHING\" (defaults)"
            - "CompPlan.${plan}.status == \"DRAFT\", version == 1, activated_at is null"
      - name: plan_create_invalid_tier_order
        claim_type: type_constraints
        grounds: ["validations[priority=15]", "errors[ERR_TIER_ORDER_INVALID]"]
        distinguishing_aspect: "Non-monotonic tier thresholds (0, 5000, 4000) violate the strictly-increasing constraint."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /comp/comp-plans", payload: { name: "BadTiers", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 }, { tier_code: T2, threshold_wrvu: 5000, conversion_factor_cents: 5500, tier_bonus_cents: 0 }, { tier_code: T3, threshold_wrvu: 4000, conversion_factor_cents: 6500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { err: $.data.error_id } }
          assert:
            - "Response is 422 with error_id == \"ERR_TIER_ORDER_INVALID\""
      - name: physician_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Reading a well-formed but nonexistent physician UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /comp/physicians/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Response is 404 with error_id == \"ERR_NOT_FOUND\""
      - name: cpt_rate_parent_not_found
        claim_type: parent_relationships
        grounds: [entities.CptRate.fields.plan_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Creating a rate row under a nonexistent plan id fails at the existence check (path parent validated first)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /comp/comp-plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { err: $.data.error_id } }
          assert:
            - "Response is 404 with error_id == \"ERR_NOT_FOUND\""
      - name: agreement_computed_ytd_input_ignored
        claim_type: computed_fields
        grounds: [entities.PhysicianAgreement.fields.ytd_wrvu_credited, entities.PhysicianAgreement.fields.pinned_plan_version]
        distinguishing_aspect: "Client-supplied computed fields (ytd_wrvu_credited) are ignored on create; pinned_plan_version snapshots the plan's current version (version-pinning on approval)."
        test_recipe:
          setup:
            - "ACTIVE plan (version advanced past 1 by its review/activation transitions) and a physician"
          setup_api_calls:
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /comp/physicians", payload: { npi: "1000000203", full_name: "Dr Computed", specialty: "IM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2019-01-01" }, as: SystemAdmin, captures: { phys: $.data.id } }
            - { call: "POST /comp/comp-plans", payload: { name: "Snap Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${plan}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1, captures: { plan_v: $.data.version } }
          trigger:
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${phys}", plan_id: "${plan}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01", ytd_wrvu_credited: 999.99 }, as: CompAnalyst, as_user_id: an_1, captures: { agr: $.data.id } }
          assert:
            - "PhysicianAgreement.${agr}.ytd_wrvu_credited == 0.00 (client-supplied 999.99 ignored)"
            - "PhysicianAgreement.${agr}.pinned_plan_version == ${plan_v} (snapshot of plan.version at creation)"
            - "PhysicianAgreement.${agr}.status == \"DRAFT\", lifetime_paid_cents == 0, pending_trueup_adjustment_cents == 0"

  - section: state_machines
    instances:
      - name: plan_activate_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CompPlan.FMV_APPROVED_to_ACTIVE, "errors[ERR_PLAN_NOT_FMV_APPROVED]", "validations[priority=7]"]
        distinguishing_aspect: "DRAFT -> ACTIVE is not in the transition table; the attempt is rejected and no state change occurs."
        test_recipe:
          setup: ["Plan in DRAFT with one rate row"]
          setup_api_calls:
            - { call: "POST /comp/comp-plans", payload: { name: "Skip Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
          trigger:
            - { call: "POST /comp/comp-plans/${plan}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1, captures: { err: $.data.error_id } }
          assert:
            - "Response is 409 with error_id == \"ERR_PLAN_NOT_FMV_APPROVED\""
            - "GET /comp/comp-plans/${plan} -> status still \"DRAFT\""
      - name: plan_review_reject_reverts_to_draft
        claim_type: valid_transition
        grounds: [state_machines.CompPlan.PENDING_REVIEW_to_DRAFT]
        distinguishing_aspect: "Branching revert: a REJECTED review decision sends PENDING_REVIEW back to DRAFT, and the plan is editable again."
        test_recipe:
          setup: ["Plan submitted to PENDING_REVIEW"]
          setup_api_calls:
            - { call: "POST /comp/comp-plans", payload: { name: "Rej Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
          trigger:
            - { call: "POST /comp/comp-plans/${plan}/review-decision", payload: { decision: REJECTED }, as: ComplianceOfficer, as_user_id: co_1, captures: { st: $.data.status } }
          assert:
            - "Plan status == \"DRAFT\" after REJECTED (revert branch)"
            - "A subsequent PUT on the plan succeeds (editable again in DRAFT)"
      - name: plan_submit_review_without_rates_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.CompPlan.DRAFT_to_PENDING_REVIEW, "errors[ERR_RATE_COVERAGE_INCOMPLETE]"]
        distinguishing_aspect: "Submitting a plan with zero rate rows fails the coverage precondition."
        test_recipe:
          setup: ["Plan in DRAFT with NO rate rows"]
          setup_api_calls:
            - { call: "POST /comp/comp-plans", payload: { name: "Bare Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
          trigger:
            - { call: "POST /comp/comp-plans/${plan}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1, captures: { err: $.data.error_id } }
          assert:
            - "Response is 422 with error_id == \"ERR_RATE_COVERAGE_INCOMPLETE\""
            - "GET /comp/comp-plans/${plan} -> status still \"DRAFT\""
      - name: capture_validate_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.ProductionCapture.POSTED_to_VALIDATED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Repeating the validate trigger against an already-VALIDATED capture fails with ERR_INVALID_STATE; the credit is applied exactly once (agreement ytd unchanged by the second attempt)."
        test_recipe:
          setup: ["ACTIVE plan, EFFECTIVE agreement, capture CAP validated once (ytd 9.70)"]
          setup_api_calls:
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /comp/physicians", payload: { npi: "1000000210", full_name: "Dr Idem", specialty: "IM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2019-01-01" }, as: SystemAdmin, captures: { phys: $.data.id } }
            - { call: "POST /comp/comp-plans", payload: { name: "Idem Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${plan}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${phys}", plan_id: "${plan}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements/${agr}/production-captures", payload: { cpt_code: "99213", units: 10, service_date: "2026-02-10", posting_date: "2026-02-10" }, as: CompAnalyst, as_user_id: an_1, captures: { cap: $.data.id } }
            - { call: "POST /comp/production-captures/${cap}/validate", payload: {}, as: CompAnalyst, as_user_id: an_1 }
          trigger:
            - { call: "POST /comp/production-captures/${cap}/validate", payload: {}, as: CompAnalyst, as_user_id: an_1, captures: { err: $.data.error_id } }
          assert:
            - "Second validate: 409 ERR_INVALID_STATE"
            - "GET /comp/physician-agreements/${agr} -> ytd_wrvu_credited == 9.70 (no double credit)"
      - name: capture_void_then_validate_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ProductionCapture.POSTED_to_VOIDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "VOIDED is terminal for the documentation axis: voiding a POSTED capture succeeds, and a later validate is rejected."
        test_recipe:
          setup: ["ACTIVE plan, EFFECTIVE agreement, capture CAP posted (never validated)"]
          setup_api_calls:
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /comp/physicians", payload: { npi: "1000000211", full_name: "Dr Void", specialty: "IM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2019-01-01" }, as: SystemAdmin, captures: { phys: $.data.id } }
            - { call: "POST /comp/comp-plans", payload: { name: "Void Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${plan}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${phys}", plan_id: "${plan}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements/${agr}/production-captures", payload: { cpt_code: "99213", units: 5, service_date: "2026-02-10", posting_date: "2026-02-10" }, as: CompAnalyst, as_user_id: an_1, captures: { cap: $.data.id } }
          trigger:
            - { call: "POST /comp/production-captures/${cap}/void", payload: {}, as: CompAnalyst, as_user_id: an_1, captures: { st: $.data.capture_status } }
            - { call: "POST /comp/production-captures/${cap}/validate", payload: {}, as: CompAnalyst, as_user_id: an_1, captures: { err: $.data.error_id } }
          assert:
            - "Void succeeds: capture_status == \"VOIDED\", credit_status stays \"UNCREDITED\""
            - "Validate after void: 409 ERR_INVALID_STATE (terminal lockdown)"
            - "GET /comp/physician-agreements/${agr} -> ytd_wrvu_credited == 0.00"
      - name: dispute_resolve_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RESOLVED_REJECTED is terminal: a second resolve attempt is rejected and no side effects fire."
        test_recipe:
          setup: ["Dispute DSP (on a validated capture) already resolved REJECTED"]
          setup_api_calls:
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /comp/physicians", payload: { npi: "1000000212", full_name: "Dr Term", specialty: "IM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2019-01-01" }, as: SystemAdmin, captures: { phys: $.data.id } }
            - { call: "POST /comp/comp-plans", payload: { name: "Term Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${plan}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${phys}", plan_id: "${plan}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements/${agr}/production-captures", payload: { cpt_code: "99213", units: 5, service_date: "2026-02-10", posting_date: "2026-02-10" }, as: CompAnalyst, as_user_id: an_1, captures: { cap: $.data.id } }
            - { call: "POST /comp/production-captures/${cap}/validate", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/disputes", payload: { subject_type: CAPTURE, subject_capture_id: "${cap}", reason: "units wrong" }, as: Physician, as_user_id: "${phys}", captures: { dsp: $.data.id } }
            - { call: "POST /comp/disputes/${dsp}/start-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/disputes/${dsp}/resolve", payload: { resolution: REJECTED }, as: CompCommittee, as_user_id: cc_9 }
          trigger:
            - { call: "POST /comp/disputes/${dsp}/resolve", payload: { resolution: ACCEPTED }, as: CompCommittee, as_user_id: cc_9, captures: { err: $.data.error_id } }
          assert:
            - "Second resolve: 409 ERR_INVALID_STATE (RESOLVED_REJECTED is terminal)"
            - "GET /comp/disputes?agreement_id=${agr} -> the dispute remains RESOLVED_REJECTED"
            - "GET /comp/production-captures/${cap} -> credit_status still \"CREDITED\" (no compensation fired)"
      - name: agreement_fmv_reject_then_cooling_off
        claim_type: precondition_enforcement
        grounds: [state_machines.PhysicianAgreement.PENDING_FMV_to_DRAFT, "validations[priority=11]", "errors[ERR_FMV_COOLING_OFF]"]
        distinguishing_aspect: "A rejected FMV review reverts the agreement to DRAFT and starts a 30-day cooling-off: resubmission at day 19 fails; at/after day 30 it succeeds."
        test_recipe:
          setup: ["ACTIVE plan; physician PH with agreement whose FMV review was REJECTED at clock 2026-01-01"]
          setup_api_calls:
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
