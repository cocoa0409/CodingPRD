              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000403", model_line: "LX500" }
              as: PortOperationsPlanner
              captures: { veh_id: $.data.id }
            - call: "POST /vpc/vehicles/${veh_id}/damage-surveys"
              payload: { line_items: [{ damage_zone: "INTERIOR", severity_points: 24, repair_estimate_cents: 30000 }] }
