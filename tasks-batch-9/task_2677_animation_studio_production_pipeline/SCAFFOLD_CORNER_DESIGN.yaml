              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { shot_id: "$.data.id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_id}&stage=LAYOUT"
              as: ProductionManager
              captures: { task_id: "$.data[0].id" }
            - call: "POST /studio/stage-tasks/${task_id}/assign"
              payload: { assigned_artist_user_id: "u-artist-01" }
              as: ProductionManager
              as_user_id: "u-pm-01"
          trigger:
            - call: "POST /studio/stage-tasks/${task_id}/log-hours"
              payload: { hours: 0.3335 }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { hours_1: "$.data.actual_hours" }
            - call: "GET /studio/shots/${shot_id}/earned-value"
              as: ProductionManager
              captures: { acwp_1: "$.data.acwp_cents" }
            - call: "POST /studio/stage-tasks/${task_id}/log-hours"
              payload: { hours: 0.1665 }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { hours_2: "$.data.actual_hours" }
            - call: "GET /studio/shots/${shot_id}/earned-value"
              as: ProductionManager
              captures: { acwp_2: "$.data.acwp_cents", cpi_2: "$.data.cpi" }
            - call: "GET /studio/shots/${shot_id}"
              as: ProductionManager
              captures: { labor_2: "$.data.labor_cost_cents" }
          assert:
            - "${hours_1} == 0.3335 and ${hours_2} == 0.5 (log-hours accumulates, it does not replace)"
            - "${acwp_1} == 3002 — 0.3335 * 9000 = 3001.5 rounds HALF UP, not down to 3001 and not truncated to 3001"
            - "${acwp_2} == 4500 — 0.5 * 9000 exactly; the wrong per-log rounding would give 3002 + 1499 = 4501"
            - "${labor_2} == 4500 on the shot row, reconciling with acwp"
            - "${cpi_2} == 0.0000 (bcwp 0 over acwp 4500), so cpi flips from null to a 4-decimal zero once cost exists"
      - name: render_priority_multiplier_constants_applied
        claim_type: constants_applied
        grounds:
          - calculations.render_job_cost.constants
          - entities.RenderJob.fields.cost_per_frame_cents
        distinguishing_aspect: |
          The four PRIORITY_MULTIPLIER constants are applied to the raw per-frame value BEFORE the cent
          rounding, so on identical geometry (3 cores, 50 s/frame, 175 cents per core-hour, 120 frames) the
          per-frame cost is 6 at LOW, 7 at NORMAL and 13 at CRITICAL — differences that a per-total
          multiplication would smear away.
