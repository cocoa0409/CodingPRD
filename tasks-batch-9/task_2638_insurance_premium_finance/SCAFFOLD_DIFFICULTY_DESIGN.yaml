              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Northwind Freight LLC", mailing_state_code: "TX", email: "ap@northwind.example" }
              as: FinanceAnalyst
              captures: { insured_1: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { agent_1: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { insurer_1: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${insured_1}", producer_agent_id: "${agent_1}", state_rule_id: "${rule_tx}", down_payment_cents: 300000, service_fee_cents: 2000, installment_count: 9, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
