          setup: ["FY2026 OPEN; batch 2026-09 OPEN"]
          setup_api_calls:
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { fy26: $.data.id } }
            - { call: "POST /recharge-batches", payload: { period_year: 2026, period_month: 9 }, as: FinanceOfficer, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /fiscal-years/${fy26}/close", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNFINALIZED_BATCHES with HTTP 409; FY2026 remains OPEN"

      - name: grant_close_blocked_by_open_entries
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_GRANT_HAS_OPEN_ENTRIES]"
        distinguishing_aspect: "A grant with a PENDING entry cannot be closed; after write-off of its only entry (WRITTEN_OFF is not an open status), close succeeds."
        test_recipe:
          setup: ["canonical stack; entry e1 validated (PENDING in batch 2026-09); batch finalized (e1 BILLED); e1 disputed; batch 2026-10 OPEN"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /recharge-batches", payload: { period_year: 2026, period_month: 9 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { bat9: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:55:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T10:14:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b1}/complete", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /usage-logs", payload: { booking_id: "${b1}", actual_start_at: "2026-09-01T09:00:00Z", actual_end_at: "2026-09-01T10:14:00Z" }, as: CoreStaff, as_user_id: "staff-1", captures: { ul1: $.data.id } }
            - { call: "POST /usage-logs/${ul1}/submit", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /usage-logs/${ul1}/validate", payload: {}, as: CoreStaff, as_user_id: "staff-2" }
            - { call: "POST /recharge-batches/${bat9}/finalize", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "GET /recharge-entries", payload: { usage_log_id: "${ul1}" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { e1: "$.data[0].id" } }
            - { call: "POST /recharge-entries/${e1}/dispute", payload: { dispute_reason: "contested" }, as: Researcher, as_user_id: "${u1}" }
            - { call: "POST /recharge-batches", payload: { period_year: 2026, period_month: 10 }, as: FinanceOfficer, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /grants/${g1}/close", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { err: $.data.error_id } }
            - { call: "POST /recharge-entries/${e1}/resolve-dispute", payload: { resolution: "WRITE_OFF" }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants/${g1}/close", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { gst: $.data.status } }
          assert:
            - "With DISPUTED entry open: error_id == ERR_GRANT_HAS_OPEN_ENTRIES with HTTP 409"
            - "After WRITE_OFF (not an open status): close succeeds, status == CLOSED"

      - name: val_priority_state_beats_fiscal
        claim_type: priority_ordering
        grounds:
          - "validations[priority=6]"
          - "validations[priority=35]"
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_booking_approve
          rationale: "Dual-failure priority (state over fiscal) asserted by the named §1.8 instance."
      - name: val_priority_safety_beats_temporal
        claim_type: priority_ordering
        grounds:
          - "validations[priority=12]"
          - "validations[priority=16]"
        excluded_because:
          difficulty_instance: safety_beats_temporal_on_booking_create
          rationale: "Dual-failure priority (safety over temporal) asserted by the named §1.8 instance."
      - name: val_priority_auth_beats_existence
        claim_type: priority_ordering
        grounds:
          - "validations[priority=2]"
          - "validations[priority=4]"
        excluded_because:
          difficulty_instance: authorization_beats_existence_on_batch_finalize
          rationale: "Dual-failure priority (authorization over existence) asserted by the named §1.8 instance."
      - name: val_overlap_booking
        claim_type: violation_to_error
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_BOOKING_OVERLAP]"
        excluded_because:
          difficulty_instance: booking_overlap_buffered_half_open
          rationale: "Buffered half-open overlap and adjacency asserted by the named §1.8 instance."
      - name: val_downtime_conflict
        claim_type: violation_to_error
        grounds:
          - "validations[priority=17]"
          - "errors[ERR_DOWNTIME_CONFLICT]"
        excluded_because:
          difficulty_instance: downtime_closed_interval_touch_conflicts
          rationale: "Closed-interval touch semantics asserted by the named §1.8 instance."
      - name: val_contract_overlap
        claim_type: violation_to_error
        grounds:
          - "validations[priority=18]"
          - "errors[ERR_CONTRACT_OVERLAP]"
        excluded_because:
          difficulty_instance: contract_coverage_date_adjacency
          rationale: "Date-granularity overlap and adjacency asserted by the named §1.8 instance."
      - name: val_grant_budget_exceeded
        claim_type: violation_to_error
        grounds:
          - "validations[priority=35]"
          - "errors[ERR_GRANT_BUDGET_EXCEEDED]"
        excluded_because:
          difficulty_instance: grant_budget_exact_fit_at_validation
          rationale: "Exact-fit success and over-budget rejection asserted by the named §1.8 instance."
      - name: val_rate_cap
        claim_type: violation_to_error
        grounds:
          - "validations[priority=36]"
          - "errors[ERR_RATE_CAP_EXCEEDED]"
        excluded_because:
          difficulty_instance: rate_cap_exact_boundary_at_submit
          rationale: "110%-exact accept and one-cent-over reject asserted by the named §1.8 instance."
      - name: val_training_required
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_TRAINING_REQUIRED]"
        excluded_because:
          difficulty_instance: booking_approval_gated_by_training_state
          rationale: "Revoked-training approval failure asserted by the named §1.8 instance."
      - name: val_booking_not_completed
        claim_type: violation_to_error
        grounds:
          - "validations[priority=39]"
          - "errors[ERR_BOOKING_NOT_COMPLETED]"
        excluded_because:
          difficulty_instance: usage_log_gated_by_booking_completion
          rationale: "Usage creation against APPROVED booking asserted by the named §1.8 instance."
      - name: val_fy_closed
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_FY_CLOSED]"
        excluded_because:
          difficulty_instance: rate_activation_gated_by_fiscal_year_state
          rationale: "Activation against a CLOSED fiscal year asserted by the named §1.8 instance."

  # ===========================================================================
  # Section 5 — endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_pagination_defaults_and_offsets
        claim_type: standard_crud
        grounds:
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: "Default page is limit=10/offset=0; with 11 users the first page has 10 rows, total_count 11, has_more true; offset=10 yields the last row with has_more false."
        test_recipe:
          setup: ["eleven users u1..u11 created"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "U01", email: "u01@uni.edu", affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /users", payload: { full_name: "U02", email: "u02@uni.edu", affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /users", payload: { full_name: "U03", email: "u03@uni.edu", affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /users", payload: { full_name: "U04", email: "u04@uni.edu", affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /users", payload: { full_name: "U05", email: "u05@uni.edu", affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /users", payload: { full_name: "U06", email: "u06@uni.edu", affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /users", payload: { full_name: "U07", email: "u07@uni.edu", affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /users", payload: { full_name: "U08", email: "u08@uni.edu", affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /users", payload: { full_name: "U09", email: "u09@uni.edu", affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /users", payload: { full_name: "U10", email: "u10@uni.edu", affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /users", payload: { full_name: "U11", email: "u11@uni.edu", affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "GET /users", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "GET /users", payload: { limit: 10, offset: 10 }, as: FacilityAdmin, as_user_id: "admin-1" }
          assert:
            - "First call: len(data) == 10, and the envelope pagination fields (limit/offset/total_count/has_more per §1.0) report total_count == 11 and has_more == true (defaults limit=10, offset=0)"
            - "Second call: len(data) == 1 and has_more == false"

      - name: list_filters_combine
        claim_type: standard_crud
        grounds:
          - "endpoints.GET_/bookings"
        distinguishing_aspect: "Filtered listing composes predicates: instrument_id + status=APPROVED returns exactly the approved booking, excluding the same-day CANCELLED one."
        test_recipe:
          setup: ["canonical stack; b1 APPROVED 2026-09-01; b2 REQUESTED 2026-09-02 then cancelled"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-02T09:00:00Z", end_at: "2026-09-02T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b2: $.data.id } }
            - { call: "POST /bookings/${b2}/cancel", payload: {}, as: Researcher, as_user_id: "${u1}" }
          trigger:
            - { call: "GET /bookings", payload: { instrument_id: "${i1}", status: "APPROVED" }, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "GET /bookings", payload: { instrument_id: "${i1}", status: "CANCELLED" }, as: CoreStaff, as_user_id: "staff-1" }
          assert:
            - "status=APPROVED filter: exactly [${b1}]"
            - "status=CANCELLED filter: exactly [${b2}]"

      - name: ep_break_even_computed_read
        claim_type: computed_read
        grounds:
          - "endpoints.GET_/rate-sets/{id}/break-even"
        excluded_because:
          difficulty_instance: break_even_projected_vs_actual_on_rate_set
          rationale: "The computed read's overall_verdict == PASS is captured and asserted by the named §1.8 instance."

  # ===========================================================================
  # Section 6 — errors
  # ===========================================================================
  - section: errors
    instances:
      - name: grant_duplicate_code
        claim_type: violation_to_error
        grounds:
          - "validations[priority=22]"
          - "errors[ERR_UNIQUE_CONSTRAINT]"
        distinguishing_aspect: "grant_code uniqueness is enforced independent of the email-uniqueness case."
        test_recipe:
          setup: ["u1 PI; grant g1 with code NIH-1 exists"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "First", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Second", budget_total_cents: 5000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNIQUE_CONSTRAINT with HTTP 409"

      - name: err_catalog_overlap_trio
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BOOKING_OVERLAP]"
          - "errors[ERR_DOWNTIME_CONFLICT]"
          - "errors[ERR_CONTRACT_OVERLAP]"
        excluded_because:
          difficulty_instance: booking_overlap_buffered_half_open
          rationale: "All three overlap errors are triggered across the §1.8 temporal-overlap instances (booking_overlap_buffered_half_open, downtime_closed_interval_touch_conflicts, contract_coverage_date_adjacency)."
      - name: err_catalog_fiscal_pair
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_GRANT_BUDGET_EXCEEDED]"
          - "errors[ERR_RATE_CAP_EXCEEDED]"
        excluded_because:
          difficulty_instance: grant_budget_exact_fit_at_validation
          rationale: "Budget and rate-cap errors triggered by grant_budget_exact_fit_at_validation and rate_cap_exact_boundary_at_submit."
      - name: err_catalog_stale_version
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_STALE_VERSION]"
        excluded_because:
          difficulty_instance: rate_set_review_reject_loop
          rationale: "OCC happy path exercised there; the three stale-version rejections are asserted by §1.9 cross_cutting_layers instances occ_*_stale — see that section."

  # ===========================================================================
  # Section 7 — rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_researcher_denied_grant_create
        claim_type: role_exclusive_denied
        grounds:
          - "roles.FinanceOfficer"
          - "roles.Researcher"
          - "validations[priority=2]"
        distinguishing_aspect: "Grant creation is FinanceOfficer-exclusive; a Researcher caller gets ERR_FORBIDDEN even with a perfectly valid payload."
        test_recipe:
          setup: ["u1 exists (INTERNAL PI)"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
          trigger:
            - { call: "POST /grants", payload: { grant_code: "NIH-9", pi_user_id: "${u1}", title: "Nope", budget_total_cents: 1000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: Researcher, as_user_id: "${u1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN with HTTP 403; GET /grants shows total_count == 0"

      - name: rbac_finance_denied_certify
        claim_type: role_exclusive_denied
        grounds:
          - "roles.CoreStaff"
          - "roles.FinanceOfficer"
          - "validations[priority=2]"
        distinguishing_aspect: "Training certification is CoreStaff-exclusive; FinanceOfficer — despite broader fiscal powers — is denied."
        test_recipe:
          setup: ["u1 enrolled on i1"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN with HTTP 403; the record stays ENROLLED"

      - name: rbac_staff_denied_batch_finalize
        claim_type: role_exclusive_denied
        grounds:
          - "roles.FinanceOfficer"
          - "roles.CoreStaff"
          - "validations[priority=2]"
        distinguishing_aspect: "Batch finalization is FinanceOfficer-exclusive; CoreStaff is denied against an EXISTING batch (role gate fires on a resolvable id)."
        test_recipe:
          setup: ["FY2026 OPEN; batch 2026-09 OPEN"]
          setup_api_calls:
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /recharge-batches", payload: { period_year: 2026, period_month: 9 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { bat: $.data.id } }
          trigger:
            - { call: "POST /recharge-batches/${bat}/finalize", payload: {}, as: CoreStaff, as_user_id: "staff-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN with HTTP 403; batch stays OPEN"

      - name: rbac_admin_denied_rate_approve
        claim_type: role_exclusive_denied
        grounds:
          - "roles.FinanceOfficer"
          - "roles.FacilityAdmin"
          - "validations[priority=2]"
        distinguishing_aspect: "Rate approval is FinanceOfficer-exclusive; the FacilityAdmin who developed the set is denied at the role gate (which fires before the SoD check)."
        test_recipe:
          setup: ["instrument i1; FY2027 OPEN; rs27 UNDER_REVIEW (developed_by admin-1)"]
          setup_api_calls:
