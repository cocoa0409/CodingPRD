      - name: credit_booking_date_validation_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DATE_OUT_OF_PLAN_YEAR]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Two distinct date failures: booking before the plan year yields ERR_DATE_OUT_OF_PLAN_YEAR 422; booking after the current logical date (future-dated) yields ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Plan COMMUNICATED; leaf T staffed by rep R; account A on T; clock 2027-06-01"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
