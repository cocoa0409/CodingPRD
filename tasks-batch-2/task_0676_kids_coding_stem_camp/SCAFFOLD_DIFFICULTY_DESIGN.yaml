              as: CenterAdmin
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/open"
              payload: {}
              as: CenterAdmin
              captures: { s1v: $.data.version }
            - call: "POST /enrollments"
              payload: { session_id: "${s1}", member_id: "${m1}", coverage: "DROP_IN", sibling_index: 1, expected_session_version: "${s1v}" }
              as: Guardian
              as_user_id: "${g1}"
