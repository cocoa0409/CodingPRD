      - name: corner_presentation_lodging_guards_reject_in_declared_priority_order
        claim_type: conditional_action
        grounds:
          - endpoints.POST /document-presentations
          - validations.priority_12
          - validations.priority_13
          - validations.priority_6
          - errors[ERR_LC_NOT_ACCEPTED]
          - errors[ERR_DOCUMENT_NOT_FOUND]
          - errors[ERR_STALE_ORDER_VERSION]
        distinguishing_aspect: "Lodging a presentation is guarded by three checks that fire in a fixed order on the same endpoint: the cross-entity credit-state gate (priority 12) beats the body foreign-key resolution only because the credit is inspected through the path-free letter_of_credit_id, the body FK check (priority 6) beats the OCC check (priority 13), and no DocumentPresentation row is created on any of the three failures. ERR_PRESENTATION_NO_DOCUMENTS (priority 30) can never be observed here because priority 29 always finds COMMERCIAL_INVOICE missing first — priority 10 forces that doc_type into required_document_types."
