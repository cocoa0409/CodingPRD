      - name: absent_user_id_header_and_undeclared_role_both_return_unauthenticated
        claim_type: RBAC Deny
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
          - roles
        distinguishing_aspect: "Three separate authentication defects — no X-User-ID header, an empty X-User-ID and a role name outside the six declared roles — all collapse to ERR_UNAUTHENTICATED (401) on an endpoint the named role would otherwise be allowed to call."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Harbor Loop' in PLANNING"
            - "PLANT_MANAGER is not one of the six declared roles"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
          trigger:
            - call: "GET /routes/${route_id}"
              payload: {}
              as: RouteEngineer
              captures: { err_no_id: $.data.error_id }
            - call: "GET /routes/${route_id}"
              payload: {}
              as: RouteEngineer
              as_user_id: ""
              captures: { err_blank_id: $.data.error_id }
            - call: "GET /routes/${route_id}"
              payload: {}
              as: "PLANT_MANAGER"
              as_user_id: "eng-alice"
              captures: { err_bad_role: $.data.error_id }
          assert:
            - "the first trigger sends no X-User-ID header at all and returns ${err_no_id} == ERR_UNAUTHENTICATED with HTTP 401"
            - "the second trigger sends X-User-ID as the empty string \"\" — an empty value, never a space or tab — and returns ${err_blank_id} == ERR_UNAUTHENTICATED with HTTP 401"
            - "the third trigger sends X-User-Role: PLANT_MANAGER with a valid X-User-ID and returns ${err_bad_role} == ERR_UNAUTHENTICATED with HTTP 401, not 403, because an undeclared role fails authentication before authorisation"
            - "a fourth call with X-User-Role: RouteEngineer and X-User-ID: eng-alice returns HTTP 200 for the same path"

