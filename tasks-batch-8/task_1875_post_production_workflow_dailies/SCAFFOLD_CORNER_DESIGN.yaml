        grounds: [calculations.storage_used_gb, entities.Project.fields.storage_used_gb]
        distinguishing_aspect: "Project.storage_used_gb is recomputed after asset create (0 -> 1.0), proxy complete (1.0 -> 1.5), and batch purge (1.5 -> 0.0); every mutation refreshes the derived field."
        test_recipe:
          setup: ["Project P ACTIVE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
