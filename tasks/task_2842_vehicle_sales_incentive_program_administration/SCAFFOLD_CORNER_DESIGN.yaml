              payload: { delivery_id: "${del_a}", program_id: "${prog_id}", claimed_amount_cents: 20000, expected_program_version: "${pv2}" }
              as: Dealer
              as_user_id: "${dealer_a}"
              captures: { ok_claim: $.data.id, ok_claim_dealer: $.data.dealer_id }
            - call: "GET /incentives/dealers/${dealer_b}"
