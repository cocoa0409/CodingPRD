      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Requests without valid X-User-ID/X-User-Role headers fail before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { name: "NoAuth", unit_type: "ICU", bed_count: 10, incentive_budget_cents: 1000 }
              as: NurseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (HTTP 400) when headers are absent"

