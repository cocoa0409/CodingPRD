          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Two strictly sequential line adds: the first advances HolderReport.version 1 -> 2; the second, still carrying expected_report_version 1, is rejected 412 with ERR_STALE_VERSION — no parallelism involved."
