          trigger:
            - { call: "POST /rental-house/reservations", payload: { production_id: "${p_id}", item_id: "${item_id}", quantity: 1, window_start_date: "2026-09-10", window_end_date: "2026-09-15", expected_production_version: "${p_v2}" }, as: RenterContact, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
