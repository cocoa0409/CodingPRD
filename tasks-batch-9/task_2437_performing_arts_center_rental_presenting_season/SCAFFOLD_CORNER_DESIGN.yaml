      - name: dynamic_price_at_the_exact_mid_band_ratio
        claim_type: threshold_boundary
        excluded_because:
          difficulty_instance: dynamic_ticket_price_at_exact_mid_band_ratio
          rationale: >-
            The 0.60 DYNAMIC_MID_BAND boundary and the 1.15 multiplier are
            asserted there; the corner pass therefore only adds the 0.85 high
            band and the price-ceiling clamp, which that instance does not reach.
  # ===========================================================================
  # VALIDATIONS (§1.4) - guide Table 4, per rule and per interaction pattern
  # ===========================================================================
  - section: validations
    instances:

      - name: seat_allocation_exactly_equal_to_capacity_passes
        claim_type: satisfaction_to_pass
        grounds:
          - "§1.4 priority 71: the sum of seats_allocated over ACTIVE PriceTier rows including the new one must be <= PerformanceSpace.seat_capacity."
          - "§1.6 ERR_SEAT_ALLOCATION_EXCEEDS_CAPACITY (422)."
        distinguishing_aspect: >-
          Fills the house to exactly seat_capacity and requires the tier to be
          accepted, then proves the very next seat is refused. The satisfaction
          side of the `<=` boundary is what a `<`-shaped implementation breaks,
          and it is the only case where success and failure are one seat apart.
        test_recipe:
          setup:
            - "Grand Hall exists with seat_capacity 1200."
            - "Artist 'Cadence Quartet' (routing 2026-09-01 -> 2026-12-31) and a DRAFT PRESENTED engagement (performance 2026-10-11) exist."
            - "One ACTIVE tier ORCH with 800 seats already exists, so 400 seats remain."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload: { tier_name: "ORCH", seats_allocated: 800, base_price_cents: 10000, price_ceiling_cents: 12000, dynamic_pricing_enabled: false, subscription_eligible: false }
              captures: { orch_id: "$.data.id" }
          trigger:
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload: { tier_name: "MEZZ", seats_allocated: 400, base_price_cents: 6000, price_ceiling_cents: 7000, dynamic_pricing_enabled: false, subscription_eligible: false }
              captures: { mezz_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload: { tier_name: "BALCONY", seats_allocated: 1, base_price_cents: 3000, price_ceiling_cents: 3500, dynamic_pricing_enabled: false, subscription_eligible: false }
              captures: { err: "$.data.error_id" }
            - call: "GET /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload: { limit: 10, offset: 0 }
          assert:
            - "The MEZZ tier is created: 201 with seats_allocated 400 and available_qty 400 - 800 + 400 == 1200 exactly satisfies the `<=` check."
            - "The one-seat BALCONY tier is rejected with 422 ERR_SEAT_ALLOCATION_EXCEEDS_CAPACITY (1201 > 1200)."
            - "The tier listing reports meta.total_count == 2: the rejected tier was not persisted."
            - "The engagement's ticketing_status is still 'TIERS_DRAFT' - a failed tier add does not advance or reset the ticketing dimension."

      - name: role_check_outranks_engagement_existence_check
        claim_type: priority_ordering
        grounds:
          - "§1.4 priority 20 (ERR_ROLE_NOT_PERMITTED) is evaluated before priority 30 path-resource existence (ERR_ENGAGEMENT_NOT_FOUND)."
          - "§1.5 POST /engagements/{id}/fee-negotiations is restricted to ProgrammingDirector."
        distinguishing_aspect: >-
          Two violations are present at once - an unauthorised role AND a
          non-existent engagement - and the pair is then re-run with the correct
          role so the SAME bogus id yields a different code. That contrast is the
          only way to prove the ladder order rather than merely that some error
          was returned; a naive implementation that looks the engagement up
          before authorising returns 404 both times.
        test_recipe:
          setup:
            - "Grand Hall, artist 'Cadence Quartet' and one real DRAFT PRESENTED engagement exist, purely so a genuine engagement version can be captured for the payload."
            - "The id 11111111-1111-4111-8111-111111111111 belongs to no engagement."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { real_engagement_id: "$.data.id", eng_v0: "$.data.version" }
          trigger:
            - call: "POST /engagements/11111111-1111-4111-8111-111111111111/fee-negotiations"
              as: BoxOfficeManager
              payload: { offered_fee_cents: 300000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { err_role: "$.data.error_id" }
            - call: "POST /engagements/11111111-1111-4111-8111-111111111111/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 300000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { err_missing: "$.data.error_id" }
          assert:
            - "First call: 403 ERR_ROLE_NOT_PERMITTED - the priority-20 role check fires even though the path id does not resolve."
            - "Second call with the permitted role on the SAME bogus id: 404 ERR_ENGAGEMENT_NOT_FOUND, proving the 403 came from the ladder order and not from a coincidence."
            - "Neither call created a FeeNegotiation row; the real engagement's negotiation_round_count is still 0 and its version is still ${eng_v0}."

      - name: deposit_equipment_add_on_applies_only_when_client_is_in_arrears
        claim_type: conditional_validation
        grounds:
          - "§1.3 deposit_requirement: additional_equipment_cost_cents is added to the raw deposit ONLY when rental_client.outstanding_balance_cents > 0 (strict)."
          - "§1.5 POST /tech-riders/{id}/clear GAP branch recomputes engagement.additional_equipment_cost_cents and then deposit_required_cents for RENTAL engagements."
          - "§1.4 priority 40: a rider must be GAP_IDENTIFIED to accept equipment lines."
        distinguishing_aspect: >-
          Two RENTAL bookings are made identical in every respect - same hall,
          same credit rating A, same one-performance-day window shape, same
          POWER_SHORTFALL rider, same 100000-cent equipment line - and differ
          only in the client's outstanding balance (0 versus 5000 cents). The
          resulting deposits differ by exactly the equipment cost, so the
          conditional branch is isolated, and the 5000-cent balance shows the
          trigger is `> 0` rather than a material-arrears threshold.
        test_recipe:
          setup:
            - "Grand Hall exists: 1200 seats, base_facility_fee_cents 500000, house_power_amps 400 (so a 500 A request is a POWER_SHORTFALL), rigging 5000 kg, 4 DMX universes."
            - "EquipmentItem 'Tour Power Distro 200A' exists: category POWER, on_hand_qty 5, daily_rate_cents 25000, replacement_value_cents 900000."
            - "Client 'Meridian Dance Company' has credit_rating A and outstanding_balance_cents 0; client 'Coastline Touring Co' has credit_rating A and outstanding_balance_cents 5000."
            - "Each client holds one RENTAL engagement with performance_day_count 1 and load_in_day_count 0, so facility_fee_cents is 500000 and the raw deposit is round_half_up(0.25 * 500000) = 125000 for both."
            - "Each engagement's rider requests 500 A and each was reviewed to GAP_IDENTIFIED ['POWER_SHORTFALL']; each then reserved 2 distro units for 2 days, so line_cost_cents is 25000 * 2 * 2 = 100000."
            - "The two occupancy windows (Oct 1-3 and Oct 10-12 2026) are far apart, so the priority-60 check passes for both."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
