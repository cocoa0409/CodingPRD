  - method: GET
    path: "/carrier/appeals/{appealId}"
    description: "Get an AppealCase"
    roles: [ComplianceOfficer, Underwriter, Policyholder]
    code: 200
    input: []
    output: AppealCase
    side_effects: []
  - method: GET
    path: "/carrier/appeals"
    description: "List AppealCases"
    roles: [ComplianceOfficer, Underwriter, Policyholder]
    code: 200
    input: ["cancellation_case_id?", "policy_id?", "status?"]
    output: "AppealCase[]"
    side_effects: []
  - method: POST
    path: "/carrier/appeals/{appealId}/accept-for-review"
    description: "Move FILED appeal to UNDER_REVIEW"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AppealCase
    side_effects: ["status -> UNDER_REVIEW"]
  - method: POST
    path: "/carrier/appeals/{appealId}/decide"
    description: "Decide an UNDER_REVIEW appeal"
