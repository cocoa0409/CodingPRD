scenario: |
  948. Well & Water-System Service (private): well/pump profile & inspection, service
  (pump/pressure-tank/filtration) & quote, water-test & treatment recommendation,
  emergency (no-water) dispatch, recurring maintenance & salt/filter, permit coordination,
  warranty/callback, billing
domain_name: well-water-system-service
api_prefix: "/water-service"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Two structurally different pipelines share ONE derivation ladder.

    Pipeline S (scheduled / quoted):
      Inspection -> Quote (DRAFT -> PRICED -> SENT -> APPROVED) -> WorkOrder
      (DRAFT -> SCHEDULED -> IN_PROGRESS -> COMPLETED) -> Invoice.
      Authorization happens BEFORE the work order exists (the customer approves a
      priced quote). Permit approval is a PREREQUISITE of scheduling.

    Pipeline E (emergency no-water dispatch):
      EmergencyTicket (INTAKE -> TRIAGED -> DISPATCHED -> ON_SITE -> DIAGNOSED ->
      RESOLVED) with an INDEPENDENT authorization axis
      (NOT_REQUIRED / PRE_AUTHORIZED / PENDING -> AUTHORIZED | DECLINED) ->
      WorkOrder -> Invoice.
      Authorization happens AFTER on-site diagnosis, and only when the on-site
      estimate exceeds the account's pre-authorization cap. Permits are deferred:
      emergency scope runs under EMERGENCY_EXEMPT and a post-hoc permit must be
      filed within POST_HOC_PERMIT_WINDOW_DAYS of completion.

    SHARED rungs / calculations (identical in both pipelines): labor rate derivation
    (L1-L3), parts markup and line extension (L4-L7), scheduling and temporal
    capacity (L34-L36), warranty attachment (L38-L42), invoice line construction and
    account balance (L44-L52).
    DIVERGENT: authorization order (S: L23-L25 before the work order exists;
    E: L26-L28 after on-site diagnosis), dispatch surcharge tiers (E-only, L14-L22),
    permit prerequisites (S: L29-L30 blocking; E: L31-L32 deferred).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

gate_precedence:
  description: |
    GLOBAL, TOTAL evaluation order for every mutating endpoint. A request that
    violates several gates is answered with the error of the LOWEST-numbered gate
    it violates. Every mutating endpoint in section 1.5 names the gates that apply
    to it in its `gates:` key, and those lists are always a subsequence of this
    order. Read-only (GET) endpoints run G1, G2, G3, G4 and G8_QUERY only.
  order:
    - gate: G1_AUTH
      rank: 1
      checks: "X-User-Role header present and one of the seven declared roles; X-User-ID header present."
      errors: [ERR_UNAUTHENTICATED]
    - gate: G2_ROLE
      rank: 2
      checks: "The declared role appears in the endpoint's `roles:` list in section 1.5."
      errors: [ERR_UNAUTHORIZED]
    - gate: G3_PATH_EXISTENCE
      rank: 3
      checks: "Every {id} segment in the request PATH resolves to a stored entity, validated LEFT TO RIGHT."
      errors: [ERR_ACCOUNT_NOT_FOUND, ERR_PROPERTY_NOT_FOUND, ERR_WELL_PROFILE_NOT_FOUND, ERR_SHARED_WELL_AGREEMENT_NOT_FOUND, ERR_TECHNICIAN_NOT_FOUND, ERR_PART_CATALOG_ITEM_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_WATER_TEST_NOT_FOUND, ERR_TREATMENT_RECOMMENDATION_NOT_FOUND, ERR_QUOTE_NOT_FOUND, ERR_QUOTE_LINE_NOT_FOUND, ERR_WORK_ORDER_NOT_FOUND, ERR_EMERGENCY_TICKET_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_PARTS_CONSUMPTION_ENTRY_NOT_FOUND, ERR_WARRANTY_COVERAGE_NOT_FOUND, ERR_CALLBACK_CLAIM_NOT_FOUND, ERR_MAINTENANCE_PLAN_NOT_FOUND, ERR_MAINTENANCE_VISIT_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_INVOICE_LINE_NOT_FOUND]
    - gate: G4_SCOPE
      rank: 4
      checks: |
        Ownership / assignment scope for entity_backed roles.
        CustomerContact: X-User-ID must equal the Account.id that owns the addressed
        resource, resolved by the declared FK chain
        (Invoice.account_id; Quote.property_id -> Property.account_id;
        EmergencyTicket.account_id; WorkOrder.property_id -> Property.account_id;
        TreatmentRecommendation.well_profile_id -> WellProfile.property_id -> Property.account_id).
        Technician: X-User-ID must equal the addressed resource's assigned technician
        (WorkOrder.assigned_technician_id; Inspection.technician_id;
        EmergencyTicket.assigned_technician_id).
      errors: [ERR_ACTOR_SCOPE_VIOLATION]
    - gate: G5_ENTITY_STATE
      rank: 5
      checks: "The addressed entity's stored state satisfies the transition's `from:` requirement in section 1.2, on EVERY axis the transition touches."
      errors: [ERR_INSPECTION_INVALID_STATE, ERR_WATER_TEST_INVALID_STATE, ERR_QUOTE_INVALID_STATE, ERR_QUOTE_LINE_INVALID_STATE, ERR_EMERGENCY_DISPATCH_INVALID_STATE, ERR_EMERGENCY_AUTH_INVALID_STATE, ERR_WORK_ORDER_INVALID_FULFILLMENT_STATE, ERR_WORK_ORDER_INVALID_BILLING_STATE, ERR_PERMIT_INVALID_STATE, ERR_INVOICE_INVALID_STATE, ERR_CALLBACK_CLAIM_INVALID_STATE, ERR_MAINTENANCE_PLAN_INVALID_STATE, ERR_TREATMENT_RECOMMENDATION_INVALID_STATE]
    - gate: G6_REGULATORY
      rank: 6
      checks: |
        Permit / water-quality / segregation-of-duties preconditions that the
        jurisdiction or the compliance program imposes on this transition.
      errors: [ERR_PERMIT_REQUIRED_NOT_APPROVED, ERR_PERMIT_JURISDICTION_MISMATCH, ERR_POST_HOC_PERMIT_WINDOW_EXPIRED, ERR_WATER_TEST_HOLD_TIME_EXCEEDED, ERR_RETEST_WINDOW_EXPIRED, ERR_CONFIRMATORY_SAME_OFFICER, ERR_CALLBACK_ADJUDICATOR_CONFLICT, ERR_TECHNICIAN_TIER_INSUFFICIENT]
    - gate: G7_OCC
      rank: 7
      checks: "expected_<parent>_version in the body equals the stored parent version."
      errors: [ERR_STALE_WELL_PROFILE_VERSION, ERR_STALE_QUOTE_VERSION, ERR_STALE_INVOICE_VERSION, ERR_STALE_MAINTENANCE_PLAN_VERSION]
    - gate: G8_PAYLOAD
      rank: 8
      checks: |
        Presence, JSON type, enum membership, numeric range and timestamp format of
        every body field, plus pagination query parameters on read endpoints
        (sub-gate G8_QUERY). Body-referenced foreign keys are NOT resolved here -
        only their syntactic shape is checked.
      errors: [ERR_VALIDATION, ERR_INVALID_ENUM, ERR_INVALID_PAGINATION, ERR_INVALID_TIMESTAMP, ERR_NEGATIVE_QUANTITY, ERR_INVALID_DATE_RANGE, ERR_CLOCK_BACKWARD]
    - gate: G9_BUSINESS
      rank: 9
      checks: |
        Sub-gate G9A resolves BODY-referenced foreign keys (a body field naming a
        missing entity fails here with that entity's *_NOT_FOUND error, NOT at G3).
        Sub-gate G9B then runs cross-entity business rules in this fixed order:
        safety/potability -> capacity & temporal overlap -> quantity/stock ->
        fiscal (credit hold, payment, caps).
      errors: [ERR_ACCOUNT_NOT_FOUND, ERR_PART_CATALOG_ITEM_NOT_FOUND, ERR_WELL_PROFILE_NOT_FOUND, ERR_PROPERTY_NOT_FOUND, ERR_TECHNICIAN_NOT_FOUND, ERR_QUOTE_NOT_FOUND, ERR_EMERGENCY_TICKET_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_WATER_TEST_NOT_FOUND, ERR_WARRANTY_COVERAGE_NOT_FOUND, ERR_RETEST_WINDOW_STILL_OPEN, ERR_YIELD_INSUFFICIENT_FOR_PUMP, ERR_QUOTE_HAS_NO_ACTIVE_LINES, ERR_QUOTE_NOT_APPROVED, ERR_INSPECTION_REQUIRED, ERR_INSPECTION_STALE, ERR_TREATMENT_RECOMMENDATION_EXPIRED, ERR_POTABILITY_PENDING_CONFIRMATION, ERR_AUTHORIZATION_REQUIRED, ERR_PREAUTH_CAP_EXCEEDED, ERR_OUT_OF_SERVICE_AREA, ERR_TECHNICIAN_SCHEDULE_CONFLICT, ERR_WELL_SERVICE_WINDOW_CONFLICT, ERR_PART_OUT_OF_STOCK, ERR_PART_DISCONTINUED, ERR_PART_CATEGORY_MISMATCH, ERR_QUANTITY_EXCEEDS_LIMIT, ERR_CALLBACK_OUT_OF_WARRANTY, ERR_CALLBACK_ALREADY_CONSUMED, ERR_CALLBACK_LIMIT_REACHED, ERR_RETEST_CONFIRMED_POSITIVE, ERR_QUOTE_LINE_YIELD_EXCEEDED, ERR_PAYMENT_EXCEEDS_BALANCE, ERR_PAYMENT_AMOUNT_INVALID, ERR_NO_TREATMENT_INDICATED, ERR_TECHNICIAN_UNAVAILABLE, ERR_PERMIT_ALREADY_ON_FILE, ERR_ACCOUNT_ON_CREDIT_HOLD, ERR_SHARED_WELL_SPLIT_INVALID, ERR_DUPLICATE_SHARED_WELL_AGREEMENT, ERR_SALT_DELIVERY_EXCEEDS_CAPACITY, ERR_FILTER_CHANGE_TOO_SOON, ERR_PLAN_ALREADY_EXISTS_FOR_WELL, ERR_EMERGENCY_TICKET_ALREADY_LINKED, ERR_NON_WELL_CAUSE_BLOCKS_PARTS, ERR_WORK_ORDER_ORIGIN_CONFLICT, ERR_WARRANTY_ALREADY_SUPERSEDED]
  mutate_then_reject:
    description: |
      Three transitions perform a DURABLE state write and THEN return an error
      response. The write is NOT rolled back. All three sit at G9_BUSINESS: every
      gate G1..G8 has already passed, the endpoint has committed its recording
      side-effects, and the terminal business adjudication then fails. If any gate
      G1..G8 fails instead, NO write occurs at all and that gate's error is returned.
    rungs: [L60, L61, L62]

design_notes:
  domain_seams:
    - id: SEAM-01
      text: |
        A bacteriological (coliform) panel is never final on its own: a
        PRESUMPTIVE_POSITIVE requires a confirmatory retest, and the confirm/deny
        outcome LATCHES differently from a chemical panel. A chemical panel latches
        the instant the lab result is recorded; a bacteriological presumptive stays
        unlatched until either a confirmatory result arrives or RETEST_WINDOW_DAYS
        elapses, at which point the fail-safe latch CONFIRMED_POSITIVE applies.
    - id: SEAM-02
      text: |
        The permit jurisdiction is the WELL's jurisdiction_code, which may differ
        from the Account's billing jurisdiction. Filing a permit whose
        jurisdiction_code does not equal the well's jurisdiction_code is rejected,
        and the base filing fee follows the well's jurisdiction tier, not the
        account's.
    - id: SEAM-03
      text: |
        Replacing a pressure tank changes the tank's drawdown, which changes the
        pump's duty cycle, which RETROACTIVELY changes the recurring-maintenance
        interval and therefore the next-due date of an already-existing plan.
    - id: SEAM-04
      text: |
        Salt is CONSUMPTION-driven and filter media is TIME-driven. One maintenance
        visit can satisfy both, but each resets its own clock: salt_next_due_date is
        recomputed from remaining pounds and monthly burn, filter_next_due_date from
        the change date plus the media's fixed interval.
    - id: SEAM-05
      text: |
        A no-water emergency can be diagnosed as a NON_WELL_CAUSE (tripped breaker,
        municipal outage, closed shutoff). That collapses the surcharge basis to the
        trip fee alone, caps billable labor, and forbids posting parts consumption.
    - id: SEAM-06
      text: |
        Warranty on a PART and warranty on LABOR are separate coverages with
        different windows (365 vs 90 days). A callback can be in-warranty on one and
        out-of-warranty on the other, producing a partial credit.
    - id: SEAM-07
      text: |
        A treatment recommendation expires relative to the WATER TEST's sample
        datetime, not relative to the recommendation's own created_at. A
        recommendation authored on day 179 of the sample is already one day from
        expiry.
    - id: SEAM-08
      text: |
        A permit can be approved WITH CONDITIONS that mandate an alternate part.
        The original quote line is superseded by the mandated alternate, which
        re-prices the quote and revokes an approval that was already granted.
    - id: SEAM-09
      text: |
        The well yield measured during inspection gates which pump models are
        quotable at all: a pump whose rated GPM exceeds the safe fraction of the
        measured yield will run the well dry and must be refused.
    - id: SEAM-10
      text: |
        Softener sizing is driven by hardness in grains-per-gallon times household
        size times daily use times the regeneration interval, mapped through a fixed
        capacity table. The largest band steps DOWN to a dual-tank unit whose salt
        burn per regeneration is lower than the single-tank band beneath it.
    - id: SEAM-11
      text: |
        A water sample analysed beyond its hold time is worthless regardless of what
        the analysis says; the result is discarded as INVALID_HOLD_TIME and the well's
        potability status does not move.
    - id: SEAM-12
      text: |
        A well can be shared between properties under a shared-well agreement. The
        cost of a service on the well is split across the participating accounts by
        declared percentages, and the split shares must total exactly 100.00.
    - id: SEAM-13
      text: |
        Emergency work proceeds under a pre-authorization cap keyed to the account's
        membership tier. Above the cap, the technician must stop and obtain explicit
        customer authorization before consuming parts.
    - id: SEAM-14
      text: |
        Membership can INVERT the cost of urgency: the premier tier's dispatch credit
        only unlocks at the top severity band, so a more severe emergency can bill
        LESS than a moderate one.
    - id: SEAM-15
      text: |
        The compliance officer who recorded a presumptive bacteriological result must
        not be the one who records its confirmatory result, and the technician who
        completed a work order must not be the one who adjudicates its callback claim.
  friction_points_not_prejudged:
    - id: FR-01
      tension: "Re-anchoring of treatment-recommendation expiry after a confirmatory retest."
      reading_a: "Expiry stays anchored to the ORIGINAL panel's sample_datetime, because the recommendation cites that panel's analytes."
      reading_b: "Expiry re-anchors to the confirmatory retest's sample_datetime, because the retest supersedes the original panel."
      status: NOT_PREJUDGED
    - id: FR-02
      tension: "Whether a NON_WELL_CAUSE resolution also collapses the trip fee to the zone-1 rate."
      reading_a: "The trip fee keeps the property's own zone rate; only the dispatch surcharge collapses."
      reading_b: "A non-well cause is not a well service at all, so the whole visit bills at the zone-1 flat rate."
      status: NOT_PREJUDGED
    - id: FR-03
      tension: "Scope of the shared-well split on an invoice that carries a dispatch surcharge."
      reading_a: "The split applies to the entire invoice total, surcharge included, because the well is jointly owned."
      reading_b: "The split applies only to parts and labor; the surcharge follows the account that placed the emergency call."
      status: NOT_PREJUDGED
    - id: FR-04
      tension: "Whether a maintenance-relevant repair performed on an EMERGENCY work order clears MaintenancePlan.overdue_latched_at."
      reading_a: "Only a MaintenanceVisit created from a maintenance-class work order clears the latch."
      reading_b: "Any completed work order that resets at least one of the two clocks clears the latch."
      status: NOT_PREJUDGED
    - id: FR-05
      tension: "Re-approval requirement after a permit-mandated alternate reduces the quote total."
      reading_a: "Any supersede sends the quote to REVISION_REQUIRED and the customer must approve again."
      reading_b: "A supersede whose new total is less than or equal to the previously approved total may auto-restore APPROVED."
      status: NOT_PREJUDGED
    - id: FR-06
      tension: "Term of the warranty coverage minted when a part is replaced under warranty."
      reading_a: "A fresh PART_WARRANTY_DAYS term runs from the new consumption date."
      reading_b: "The new coverage inherits only the remaining term of the coverage it supersedes."
      status: NOT_PREJUDGED
    - id: FR-07
      tension: "Whether inspection staleness is re-checked at work-order scheduling."
      reading_a: "Staleness is a quote-approval concern only; once approved, scheduling does not re-check."
      reading_b: "Scheduling is a fresh regulatory moment and must re-check INSPECTION_VALIDITY_DAYS."
      status: NOT_PREJUDGED
    - id: FR-08
      tension: "Which membership tier governs the dispatch credit when the tier changes mid-ticket."
      reading_a: "The tier stored on the Account at ticket INTAKE governs."
      reading_b: "The tier stored on the Account at invoice construction governs."
      status: NOT_PREJUDGED
    - id: FR-09
      tension: "Whether a chemical exceedance should hold a well at ADVISORY after a bacteriological CLEARED_NEGATIVE."
      reading_a: "CLEARED_NEGATIVE restores SAFE outright; chemical exceedance is a treatment matter, not a potability matter."
      reading_b: "A well with an unresolved chemical exceedance cannot be SAFE and must stay ADVISORY."
      status: NOT_PREJUDGED
    - id: FR-10
      tension: |
        Naming of MaintenancePlan.last_service_date when a visit touches only the
        salt clock. The compliance rule counts only filter-bearing visits, yet
        last_service_date is pinned to advance on a MaintenanceVisit of ANY kind, so
        a SALT_ONLY visit slides next_due_at forward while the plan stays OVERDUE.
      reading_a: "last_service_date means 'last physical visit' - the pinned behaviour - and a sliding next_due_at on an OVERDUE plan is intended."
      reading_b: "last_service_date should mean 'last compliance-qualifying service' and a SALT_ONLY visit should leave it untouched."
      status: NOT_PREJUDGED
      note: "L43 pins reading (a) for determinism; the naming tension itself is not adjudicated here."
    - id: FR-11
      tension: "Whether the loyalty discount participates in its own eligibility test."
      reading_a: "The pre-tax total used for the LOYALTY_DISCOUNT_MIN_PRETAX_CENTS test is the PRE-discount total (pinned by L49)."
      reading_b: "An invoice whose post-discount total falls below the threshold should lose the discount entirely."
      status: NOT_PREJUDGED
      note: "L49 pins reading (a) for evaluation-order determinism; reading (b) remains the un-adjudicated commercial reading."

global_constants:
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"
  TAX_RATE_PCT: 7.25
  LOYALTY_DISCOUNT_PCT: 5.00
  LOYALTY_DISCOUNT_MIN_PRETAX_CENTS: 200000
  LOYALTY_DISCOUNT_ELIGIBLE_TIERS: [SELECT, PREMIER]
  CREDIT_HOLD_THRESHOLD_CENTS: 500000
  QUOTE_VALIDITY_DAYS: 30
  INSPECTION_VALIDITY_DAYS: 365
  PART_WARRANTY_DAYS: 365
  LABOR_WARRANTY_DAYS: 90
  CALLBACK_MAX_PER_COVERAGE: 2
  TRAVEL_BUFFER_MINUTES: 45
  WELL_DAILY_WORK_ORDER_CAP: 1
  MAX_WORK_ORDER_DURATION_MINUTES: 720
  BILLING_INCREMENT_MINUTES: 15
  MIN_BILLABLE_MINUTES: 60
  NON_WELL_CAUSE_LABOR_CAP_MINUTES: 60
  PART_MAX_LINE_QUANTITY: 50
  SHARED_WELL_MAX_PARTIES: 4
  POST_HOC_PERMIT_WINDOW_DAYS: 10
  RETEST_WINDOW_DAYS: 21
  RECOMMENDATION_VALIDITY_DAYS: 180
  SALT_TANK_CAPACITY_LBS: 300
  SALT_REORDER_THRESHOLD_LBS: 40
  SALT_DELIVERY_MIN_LBS: 40
  FILTER_MIN_DAYS_BETWEEN_CHANGES: 30
  MIN_MAINTENANCE_INTERVAL_DAYS: 120
  YIELD_SAFETY_FACTOR: 0.80
  MIN_PUMP_GPM: 5.0
  PEAK_DEMAND_GAL_PER_HOUR: 30
  MIN_DRAWDOWN_GALLONS: 1.0
  SALT_LBS_PER_CONSUMABLE_UNIT: 40.0
  HARDNESS_TREATMENT_TRIGGER_GPG: 7.0
  NITRATE_MCL_MG_L: 10.0
  ARSENIC_MCL_MG_L: 0.010
  LEAD_MCL_MG_L: 0.015
  IRON_MCL_MG_L: 0.30
  HOLD_TIME_HOURS_BACTERIOLOGICAL: 30
  HOLD_TIME_HOURS_CHEMICAL: 336
  WATER_USE_GAL_PER_PERSON_PER_DAY: 75
  REGEN_INTERVAL_DAYS: 7
  EXPEDITE_FEE_CENTS: 15000
  SEVERITY_MAX: 100
  boundary_conventions: |
    Every window in this scaffold is written as an explicit interval.
    - Warranty windows are CLOSED on the right in DAYS: a claim filed exactly
      PART_WARRANTY_DAYS after the coverage start instant is IN warranty; one day
      later is out. Formally: covered iff
      0 <= (clock - coverage.starts_at) <= window_days * 86400 seconds.
    - The bacteriological retest window is CLOSED on the right: a confirmatory
      sample collected exactly RETEST_WINDOW_DAYS after the original sample_datetime
      is IN window.
    - Water-test hold time is CLOSED on the right: analyzed_at - sample_datetime
      exactly equal to the hold time is VALID.
    - Treatment-recommendation validity is HALF-OPEN [sample_datetime,
      sample_datetime + RECOMMENDATION_VALIDITY_DAYS): at exactly the boundary
      instant the recommendation is EXPIRED.
    - Technician scheduled windows are HALF-OPEN [starts_at, ends_at) and are
      expanded by TRAVEL_BUFFER_MINUTES on BOTH sides before the overlap test,
      so two windows that merely touch DO collide.
    - The per-well daily cap buckets a work order into the UTC calendar day of its
      starts_at only; both day boundaries are treated as belonging to that day
      (00:00:00.000Z inclusive, 23:59:59.999Z inclusive).
    - All numeric bands below state their own inclusive/exclusive endpoints.

entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Billing name of the account holder."
        constraints: "1-120 characters"
      - name: billing_jurisdiction_code
        type: string
        source: input
        description: "Jurisdiction code of the billing address; deliberately independent of any well's jurisdiction_code (SEAM-02)."
        constraints: "one of JUR_ALPHA, JUR_BRAVO, JUR_CHARLIE, JUR_DELTA"
      - name: membership_tier
        type: enum
        source: input
        description: "Service membership tier driving pre-authorization cap and dispatch credit."
        default: NONE
        constraints: "one of NONE, SELECT, PREMIER"
      - name: balance_cents
        type: integer
        source: computed
        description: "Money owed by this account; conserved quantity of invariant CI-2."
        default: 0
      - name: lifetime_invoiced_cents
        type: integer
        source: computed
        description: "Sum of total_cents of every Invoice of this account that has ever reached ISSUED."
        default: 0
      - name: lifetime_paid_cents
        type: integer
        source: computed
        description: "Sum of amount_paid_cents across this account's ISSUED, PARTIALLY_PAID and PAID_IN_FULL invoices."
        default: 0
      - name: credit_hold
        type: boolean
        source: computed
        description: "True iff balance_cents > CREDIT_HOLD_THRESHOLD_CENTS (strictly greater)."
        default: false
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email."
        constraints: "must contain '@'"

  - name: Property
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account billed for services at this property."
      - name: address_line
        type: string
        source: input
        description: "Street address of the serviced property."
      - name: jurisdiction_code
        type: string
        source: input
        description: "Jurisdiction of the physical property."
        constraints: "one of JUR_ALPHA, JUR_BRAVO, JUR_CHARLIE, JUR_DELTA"
      - name: distance_miles
        type: number
        source: input
        description: "Road distance from the service depot, used for the trip-fee zone bands."
        constraints: "0.0 <= distance_miles; values above 60.0 are out of service area"
      - name: household_size
        type: integer
        source: input
        description: "Number of residents; drives softener sizing and emergency severity."
        constraints: "1 <= household_size <= 12"
      - name: has_vulnerable_occupant
        type: boolean
        source: input
        description: "True when a medically vulnerable occupant lives here; adds severity points."
        default: false
      - name: service_zone
        type: enum
        source: computed
        description: "Trip-fee zone derived from distance_miles by calculation trip_fee_cents."
        constraints: "one of ZONE_1, ZONE_2, ZONE_3, OUT_OF_AREA"

  - name: WellProfile
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property the well serves."
      - name: jurisdiction_code
        type: string
        source: input
        description: "Permitting jurisdiction of the WELL itself (SEAM-02); may differ from Property.jurisdiction_code."
        constraints: "one of JUR_ALPHA, JUR_BRAVO, JUR_CHARLIE, JUR_DELTA"
      - name: well_type
        type: enum
        source: input
        description: "Construction type of the well."
        constraints: "one of DRILLED, DRIVEN, DUG"
      - name: depth_feet
        type: number
        source: input
        description: "Total depth of the well bore in feet."
        constraints: "10.0 <= depth_feet <= 1200.0"
      - name: measured_yield_gpm
        type: number
        source: computed
        description: "Sustained yield in gallons per minute recorded by the most recent COMPLETED Inspection; null until one exists."
      - name: pressure_tank_drawdown_gallons
        type: number
        source: input
        description: "Usable drawdown of the installed pressure tank in gallons."
        default: 6.0
        constraints: "1.0 <= pressure_tank_drawdown_gallons <= 120.0"
      - name: duty_cycle_ratio
        type: number
        source: computed
        description: "Pump cycles per hour at peak demand; computed by duty_cycle_ratio."
      - name: duty_cycle_class
        type: enum
        source: computed
        description: "Band of duty_cycle_ratio; drives the maintenance interval."
        default: MODERATE
        constraints: "one of LOW, MODERATE, HIGH"
      - name: treatment_media
        type: enum
        source: computed
        description: "Media currently installed on the well, set when a TreatmentRecommendation is ACCEPTED and installed."
        default: NONE
        constraints: "one of NONE, SEDIMENT, CARBON, SOFTENER_RESIN"
      - name: hardness_gpg
        type: number
        source: computed
        description: "Hardness in grains per gallon from the most recent valid CHEMICAL water test; null until one exists."
      - name: potability_status
        type: enum
        source: computed
        description: "Potability posture of the well; see state machine WellProfile.potability_status."
        default: UNKNOWN
        constraints: "one of UNKNOWN, SAFE, ADVISORY, UNSAFE"
      - name: last_inspection_completed_at
        type: datetime
        source: computed
        description: "Completion instant of the most recent COMPLETED Inspection; null until one exists."
      - name: advisory_reason
        type: string
        source: computed
        description: "Free-text reason latched when potability_status last moved to ADVISORY or UNSAFE; null otherwise."

  - name: SharedWellAgreement
    parent: WellProfile
    common_fields: true
    fields:
      - name: well_profile_id
        type: string
        source: input
        description: "FK -> WellProfile.id; the shared well."
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; a participating account."
      - name: split_pct
        type: number
        source: input
        description: "Share of well service cost borne by this account, in percent with two decimals."
        constraints: "0.01 <= split_pct <= 100.00; ACTIVE shares on one well must total exactly 100.00"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the agreement."
        default: ACTIVE
        constraints: "one of ACTIVE, TERMINATED"

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Technician name."
      - name: tier
        type: enum
        source: input
        description: "Skill tier; sets the base labor rate and gates which scopes may be worked."
        constraints: "one of APPRENTICE, JOURNEYMAN, MASTER"
      - name: status
        type: enum
        source: input
        description: "Availability of the technician."
        default: AVAILABLE
        constraints: "one of AVAILABLE, OFF_DUTY"
      - name: home_jurisdiction_code
        type: string
        source: input
        description: "Jurisdiction the technician is licensed in."
        constraints: "one of JUR_ALPHA, JUR_BRAVO, JUR_CHARLIE, JUR_DELTA"

  - name: PartCatalogItem
    parent: null
    common_fields: true
    fields:
      - name: part_number
        type: string
        source: input
        description: "Vendor part number; unique across the catalog."
      - name: category
        type: enum
        source: input
        description: "Functional category of the part."
        constraints: "one of PUMP, PRESSURE_TANK, FILTRATION, CONTROL, CONSUMABLE"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Current landed cost of one unit, in cents; drives the markup band."
        constraints: "1 <= unit_cost_cents <= 5000000"
      - name: rated_gpm
        type: number
        source: input
        description: "Rated flow in gallons per minute; required for category PUMP, null otherwise."
      - name: rated_drawdown_gallons
        type: number
        source: input
        description: "Usable drawdown in gallons; required for category PRESSURE_TANK, null otherwise."
        constraints: "1.0 <= rated_drawdown_gallons <= 120.0 when present"
      - name: grain_capacity
        type: integer
        source: input
        description: "Softener grain capacity; required when category is FILTRATION and media_kind is SOFTENER_RESIN, null otherwise."
      - name: media_kind
        type: enum
        source: input
        description: "Filtration media supplied by this part."
        default: NONE
        constraints: "one of NONE, SEDIMENT, CARBON, SOFTENER_RESIN"
      - name: on_hand_qty
        type: integer
        source: computed
        description: "Units currently in stock; conserved quantity of invariant CI-1."
        default: 0
      - name: status
        type: enum
        source: input
        description: "Catalog availability."
        default: ACTIVE
        constraints: "one of ACTIVE, DISCONTINUED"

  - name: Inspection
    parent: WellProfile
    common_fields: true
    fields:
      - name: well_profile_id
        type: string
        source: input
        description: "FK -> WellProfile.id; the inspected well."
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; the technician performing the inspection."
      - name: status
        type: enum
        source: system
        description: "Inspection lifecycle state."
        default: SCHEDULED
        constraints: "one of SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED"
      - name: scheduled_for
        type: datetime
        source: input
        description: "Planned start instant of the inspection."
      - name: measured_yield_gpm
        type: number
        source: input
        description: "Sustained yield recorded at completion; null until COMPLETED."
        constraints: "0.0 <= measured_yield_gpm <= 200.0"
      - name: static_level_feet
        type: number
        source: input
        description: "Static water level below grade recorded at completion; null until COMPLETED."
      - name: observed_drawdown_gallons
        type: number
        source: input
        description: "Pressure-tank drawdown observed at completion; null until COMPLETED."
        constraints: "1.0 <= observed_drawdown_gallons <= 120.0"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the inspection reached COMPLETED; null otherwise."

  - name: WaterTest
    parent: WellProfile
    common_fields: true
    fields:
      - name: well_profile_id
        type: string
        source: input
        description: "FK -> WellProfile.id; the sampled well."
      - name: collected_by_technician_id
        type: string
        source: input
        description: "FK -> Technician.id; technician who collected the sample."
      - name: parent_test_id
        type: string
        source: input
        description: "FK -> WaterTest.id; the presumptive-positive test this sample confirms, null for an original sample."
      - name: panel_type
        type: enum
        source: input
        description: "Analytical panel run on the sample."
        constraints: "one of BACTERIOLOGICAL, CHEMICAL"
      - name: sample_datetime
        type: datetime
        source: input
        description: "Instant the sample was drawn; anchors hold time, retest window and recommendation validity."
      - name: analyzed_at
        type: datetime
        source: input
        description: "Instant the laboratory completed the analysis; null until a lab result is recorded."
      - name: result_status
        type: enum
        source: system
        description: "Result posture of this test; see state machine WaterTest.result_status."
        default: COLLECTED
        constraints: "one of COLLECTED, ANALYZED_NEGATIVE, ANALYZED_PRESUMPTIVE_POSITIVE, ANALYZED_CHEMICAL_EXCEEDANCE, INVALID_HOLD_TIME, CONFIRMED_POSITIVE, CLEARED_NEGATIVE"
      - name: coliform_present
        type: boolean
        source: input
        description: "Bacteriological finding; null for a CHEMICAL panel."
      - name: nitrate_mg_l
        type: number
        source: input
        description: "Nitrate concentration; null for a BACTERIOLOGICAL panel."
      - name: arsenic_mg_l
        type: number
        source: input
        description: "Arsenic concentration; null for a BACTERIOLOGICAL panel."
      - name: lead_mg_l
        type: number
        source: input
        description: "Lead concentration; null for a BACTERIOLOGICAL panel."
      - name: iron_mg_l
        type: number
        source: input
        description: "Iron concentration; null for a BACTERIOLOGICAL panel."
      - name: hardness_gpg
        type: number
        source: input
        description: "Hardness in grains per gallon; null for a BACTERIOLOGICAL panel."
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who recorded the lab result; null until recorded."
      - name: confirmed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who recorded the confirmatory result; must differ from recorded_by_user_id (SEAM-15)."
      - name: hold_time_valid
        type: boolean
        source: computed
        description: "True iff analyzed_at - sample_datetime is within the panel's hold time; null until analyzed_at is set."

  - name: TreatmentRecommendation
    parent: WellProfile
    common_fields: true
    fields:
      - name: well_profile_id
        type: string
        source: input
        description: "FK -> WellProfile.id; the well the treatment is recommended for."
      - name: water_test_id
        type: string
        source: input
        description: "FK -> WaterTest.id; the CHEMICAL panel whose analytes justify this recommendation."
      - name: superseded_by_id
        type: string
        source: system
        description: "FK -> TreatmentRecommendation.id; the later recommendation that replaced this one, null when current."
      - name: recommended_media
        type: enum
        source: computed
        description: "Media selected by the recommendation engine from the panel's analytes."
        constraints: "one of SEDIMENT, CARBON, SOFTENER_RESIN"
      - name: design_grains
        type: integer
        source: computed
        description: "Design grain load per regeneration cycle; null unless recommended_media is SOFTENER_RESIN."
      - name: selected_capacity
        type: enum
        source: computed
        description: "Capacity band selected from design_grains; null unless recommended_media is SOFTENER_RESIN."
        constraints: "one of CAP_24000, CAP_32000, CAP_48000, CAP_64000, CAP_80000, DUAL_TANK_64000"
      - name: salt_lbs_per_regen
        type: number
        source: computed
        description: "Salt consumed per regeneration for the selected capacity band; null unless SOFTENER_RESIN."
      - name: monthly_salt_lbs
        type: number
        source: computed
        description: "Monthly salt burn used to drive the consumption clock; null unless SOFTENER_RESIN."
      - name: expires_at
        type: datetime
        source: computed
        description: "Instant the recommendation stops being actionable; anchored on the water test's sample_datetime (SEAM-07)."
      - name: status
        type: enum
        source: system
        description: "Stored lifecycle state; EXPIRED is NOT stored here, it is derived as-of read time into status_effective."
        default: PROPOSED
        constraints: "one of PROPOSED, ACCEPTED, SUPERSEDED"
      - name: status_effective
        type: enum
        source: computed
        description: "As-of-evaluation-time status: EXPIRED when status is PROPOSED and clock >= expires_at, otherwise equal to status."
        constraints: "one of PROPOSED, ACCEPTED, SUPERSEDED, EXPIRED"

  - name: Quote
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; property the quoted work is for."
      - name: well_profile_id
        type: string
        source: input
        description: "FK -> WellProfile.id; well the quoted work is for."
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the COMPLETED inspection whose measured yield gates pump lines."
      - name: scope
        type: enum
        source: input
        description: "Work scope of the quote; drives permit requirement and technician tier gating."
        constraints: "one of NEW_WELL, PUMP_REPLACEMENT, PRESSURE_TANK, TREATMENT_INSTALL, REPAIR"
      - name: status
        type: enum
        source: system
        description: "Quote lifecycle state; see state machine Quote.status."
        default: DRAFT
        constraints: "one of DRAFT, PRICED, SENT, APPROVED, DECLINED, REVISION_REQUIRED, CONSUMED, EXPIRED"
      - name: estimated_labor_minutes
        type: integer
        source: input
        description: "Estimated on-site labor in minutes, used by the quote_estimate variant of the total."
        constraints: "15 <= estimated_labor_minutes <= 720"
      - name: estimated_start_at
        type: datetime
        source: input
        description: "Planned start instant used to select the labor time-band multiplier for the estimate."
      - name: quoted_technician_tier
        type: enum
        source: input
        description: "Technician tier assumed by the estimate."
        constraints: "one of APPRENTICE, JOURNEYMAN, MASTER"
      - name: parts_subtotal_cents
        type: integer
        source: computed
        description: "Sum of extended_price_cents over ACTIVE quote lines, rounded per line then summed."
        default: 0
      - name: labor_subtotal_cents
        type: integer
        source: computed
        description: "Estimated labor charge from the quote_estimate variant."
        default: 0
      - name: permit_fee_cents
        type: integer
        source: computed
        description: "Permit filing fee folded into the quote; 0 when the scope requires no permit."
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Tax on the taxable (parts) subtotal only."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "parts_subtotal_cents + labor_subtotal_cents + permit_fee_cents + tax_cents."
        default: 0
      - name: sent_at
        type: datetime
        source: system
        description: "Logical-clock instant the quote was sent; anchors QUOTE_VALIDITY_DAYS."
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock instant the quote was approved; null otherwise."
      - name: approved_total_cents
        type: integer
        source: system
        description: "total_cents latched at approval; used by friction FR-05 and by the pinned-cost invoice variant."

  - name: QuoteLine
    parent: Quote
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; owning quote."
      - name: part_catalog_item_id
        type: string
        source: input
        description: "FK -> PartCatalogItem.id; catalog part this line sells."
      - name: superseded_by_line_id
        type: string
        source: system
        description: "FK -> QuoteLine.id; the mandated alternate line that replaced this one, null when current."
      - name: quantity
        type: integer
        source: input
        description: "Units of the part on this line."
        constraints: "1 <= quantity <= 50"
      - name: unit_cost_cents_pinned
        type: integer
        source: computed
        description: "PartCatalogItem.unit_cost_cents copied onto the line when the quote is PRICED; frozen thereafter."
      - name: markup_pct_applied
        type: number
        source: computed
        description: "Flat markup fraction selected by the band containing unit_cost_cents_pinned."
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Marked-up unit price, rounded to cents before extension."
      - name: extended_price_cents
        type: integer
        source: computed
        description: "unit_price_cents * quantity."
      - name: status
        type: enum
        source: system
        description: "Line lifecycle; see state machine QuoteLine.status."
        default: ACTIVE
        constraints: "one of ACTIVE, SUPERSEDED, SUPERSEDED_BY_YIELD, REMOVED"
      - name: origin
        type: enum
        source: system
        description: "How the line entered the quote."
        default: ESTIMATOR
        constraints: "one of ESTIMATOR, PERMIT_MANDATED_ALTERNATE"

  - name: EmergencyTicket
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; property reporting no water."
      - name: well_profile_id
        type: string
        source: input
        description: "FK -> WellProfile.id; well serving the property."
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; account that placed the call and owns the authorization decision."
      - name: assigned_technician_id
        type: string
        source: system
        description: "FK -> Technician.id; technician assigned at dispatch, null before."
      - name: dispatch_status
        type: enum
        source: system
        description: "Fulfilment axis of the ticket; evolves independently of authorization_status."
        default: INTAKE
        constraints: "one of INTAKE, TRIAGED, DISPATCHED, ON_SITE, DIAGNOSED, RESOLVED, CANCELLED"
      - name: authorization_status
        type: enum
        source: system
        description: "Money axis of the ticket; evolves independently of dispatch_status."
        default: NOT_REQUIRED
        constraints: "one of NOT_REQUIRED, PRE_AUTHORIZED, PENDING, AUTHORIZED, DECLINED"
      - name: intake_at
        type: datetime
        source: system
        description: "Logical-clock instant of intake; anchors the response-minutes calculation."
      - name: dispatched_at
        type: datetime
        source: system
        description: "Logical-clock instant of dispatch; null before."
      - name: reported_outage_hours
        type: number
        source: input
        description: "Hours the property has been without water at intake; feeds the severity score."
        constraints: "0.0 <= reported_outage_hours <= 240.0"
      - name: cause_class
        type: enum
        source: input
        description: "Cause recorded at on-site diagnosis; null before DIAGNOSED."
        constraints: "one of PUMP_FAILURE, WELL_DRY, PRESSURE_TANK_FAILURE, CONTROL_FAILURE, TREATMENT_FAILURE, NON_WELL_CAUSE"
      - name: membership_tier_at_intake
        type: enum
        source: system
        description: "Account.membership_tier copied at intake; governs the dispatch credit (friction FR-08 reading a)."
        constraints: "one of NONE, SELECT, PREMIER"
      - name: severity_score
        type: integer
        source: computed
        description: "Integer 0-100 computed at diagnosis from cause, outage hours, household size and vulnerability."
      - name: dispatch_surcharge_cents
        type: integer
        source: computed
        description: "Gross tier surcharge before the membership credit."
        default: 0
      - name: membership_credit_cents
        type: integer
        source: computed
        description: "Credit applied against the surcharge; can invert the tier ordering (SEAM-14)."
        default: 0
      - name: net_dispatch_charge_cents
        type: integer
        source: computed
        description: "dispatch_surcharge_cents - membership_credit_cents, floored at 0."
        default: 0
      - name: onsite_estimate_cents
        type: integer
        source: input
        description: "Technician's on-site estimate recorded with the diagnosis; compared against the pre-authorization cap."
        constraints: "0 <= onsite_estimate_cents <= 10000000"
      - name: preauth_cap_cents
        type: integer
        source: computed
        description: "Pre-authorization ceiling derived from membership_tier_at_intake."
      - name: response_minutes
        type: integer
        source: computed
        description: "Whole minutes between intake_at and dispatched_at; null before dispatch."

  - name: WorkOrder
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; site of the work."
      - name: well_profile_id
        type: string
        source: input
        description: "FK -> WellProfile.id; well being worked on."
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the APPROVED quote authorizing this work, null on the emergency pipeline."
      - name: emergency_ticket_id
        type: string
        source: input
        description: "FK -> EmergencyTicket.id; the ticket authorizing this work, null on the scheduled pipeline."
      - name: assigned_technician_id
        type: string
        source: input
        description: "FK -> Technician.id; technician who will perform the work."
      - name: origin_callback_claim_id
        type: string
        source: system
        description: "FK -> CallbackClaim.id; set when this work order is the remedy for an approved callback claim."
      - name: pipeline
        type: enum
        source: computed
        description: "Which pipeline produced this work order; EMERGENCY when emergency_ticket_id is set, SCHEDULED in every other case (including a remedy work order raised from a callback claim, which carries neither a quote nor a ticket)."
        constraints: "one of SCHEDULED, EMERGENCY"
      - name: scope
        type: enum
        source: input
        description: "Work scope; drives permit requirement and technician tier gating."
        constraints: "one of NEW_WELL, PUMP_REPLACEMENT, PRESSURE_TANK, TREATMENT_INSTALL, REPAIR, MAINTENANCE"
      - name: fulfillment_status
        type: enum
        source: system
        description: "Work axis; evolves independently of billing_status."
        default: DRAFT
        constraints: "one of DRAFT, SCHEDULED, HELD, IN_PROGRESS, COMPLETED, CANCELLED"
      - name: billing_status
        type: enum
        source: system
        description: "Money axis; evolves independently of fulfillment_status."
        default: NOT_BILLABLE
        constraints: "one of NOT_BILLABLE, PENDING_INVOICE, INVOICED, SETTLED, WRITTEN_OFF"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Planned start instant; half-open window start for the technician overlap test."
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "Planned end instant; half-open window end for the technician overlap test."
      - name: actual_start_at
        type: datetime
        source: system
        description: "Logical-clock instant work started; selects the labor time-band multiplier for the final variant."
      - name: actual_end_at
        type: datetime
        source: system
        description: "Logical-clock instant work completed."
      - name: actual_labor_minutes
        type: integer
        source: input
        description: "Raw on-site minutes reported at completion, before increment rounding."
        constraints: "0 <= actual_labor_minutes <= 720"
      - name: billable_minutes
        type: integer
        source: computed
        description: "actual_labor_minutes rounded up to the billing increment and floored at the minimum, then capped for a non-well cause."
      - name: labor_rate_cents_per_hour
        type: integer
        source: computed
        description: "Time-band adjusted hourly rate applied to this work order."
      - name: labor_charge_cents
        type: integer
        source: computed
        description: "Final labor charge for this work order."
        default: 0
      - name: parts_charge_cents
        type: integer
        source: computed
        description: "Sum of extended_price_cents over POSTED parts consumption entries."
        default: 0
      - name: callback_eligibility
        type: enum
        source: computed
        description: "Whether a warranty callback can still be raised against this work order."
        default: NONE
        constraints: "one of NONE, ELIGIBLE, CONSUMED, EXPIRED"
      - name: callback_attempt_count
        type: integer
        source: computed
        description: "Number of CallbackClaim rows ever created against this work order, including rejected ones."
        default: 0
      - name: hold_reason
        type: string
        source: system
        description: "Reason latched when fulfillment_status moved to HELD; null otherwise."

  - name: Permit
    parent: WellProfile
    common_fields: true
    fields:
      - name: well_profile_id
        type: string
        source: input
        description: "FK -> WellProfile.id; the well the permit is filed for."
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; work order the permit covers, null when the permit is filed off a quote."
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; quote the permit was raised from, null when raised post-hoc from an emergency."
      - name: jurisdiction_code
        type: string
        source: input
        description: "Jurisdiction the permit is filed with; must equal the WELL's jurisdiction_code (SEAM-02)."
        constraints: "one of JUR_ALPHA, JUR_BRAVO, JUR_CHARLIE, JUR_DELTA"
      - name: jurisdiction_tier
        type: enum
        source: computed
        description: "Fee tier of the jurisdiction, from the declared jurisdiction tier table."
        constraints: "one of TIER_A, TIER_B, TIER_C"
      - name: scope
        type: enum
        source: input
        description: "Scope of work the permit authorizes."
        constraints: "one of NEW_WELL, PUMP_REPLACEMENT, PRESSURE_TANK, TREATMENT_INSTALL, REPAIR"
      - name: expedited
        type: boolean
        source: input
        description: "Whether the expedite fee was paid."
        default: false
      - name: fee_cents
        type: integer
        source: computed
        description: "Filing fee computed at file time from tier, scope multiplier and expedite flag."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Permit lifecycle; see state machine Permit.status."
        default: DRAFT
        constraints: "one of DRAFT, FILED, APPROVED, APPROVED_WITH_CONDITIONS, REJECTED, WITHDRAWN"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the permit was filed; anchors the post-hoc window for emergency work."
      - name: mandated_alternate_part_id
        type: string
        source: input
        description: "FK -> PartCatalogItem.id; part the jurisdiction mandates in place of a quoted part, null unless conditions were imposed."
      - name: superseded_quote_line_id
        type: string
        source: system
        description: "FK -> QuoteLine.id; quote line the mandated alternate replaced, null unless conditions were imposed."
      - name: condition_text
        type: string
        source: input
        description: "Free text of the approval conditions; null unless conditions were imposed."
      - name: post_hoc
        type: boolean
        source: input
        description: "True when the permit is filed after emergency work completed under EMERGENCY_EXEMPT."
        default: false

  - name: PartsConsumptionEntry
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; work order that consumed the part."
      - name: part_catalog_item_id
        type: string
        source: input
        description: "FK -> PartCatalogItem.id; part consumed."
      - name: quantity
        type: integer
        source: input
        description: "Units consumed."
        constraints: "1 <= quantity <= 50"
      - name: unit_cost_cents_snapshot
        type: integer
        source: computed
        description: "Catalog unit_cost_cents at the moment of posting, or the quote's pinned cost when the work order came from an APPROVED quote line for the same part."
      - name: markup_pct_applied
        type: number
        source: computed
        description: "Flat markup fraction selected by the band containing unit_cost_cents_snapshot."
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Marked-up unit price rounded to cents."
      - name: extended_price_cents
        type: integer
        source: computed
        description: "unit_price_cents * quantity."
      - name: status
        type: enum
        source: system
        description: "Ledger posture of this consumption row."
        default: POSTED
        constraints: "one of POSTED, REVERSED"
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock instant the row was posted."

  - name: WarrantyCoverage
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; work order whose completion minted this coverage."
      - name: parts_consumption_entry_id
        type: string
        source: input
        description: "FK -> PartsConsumptionEntry.id; the consumed part covered, null for a LABOR coverage."
      - name: superseded_by_id
        type: string
        source: system
        description: "FK -> WarrantyCoverage.id; the coverage minted by the remedy work order that replaced this one."
      - name: coverage_class
        type: enum
        source: system
        description: "Whether this coverage protects the part or the labor (SEAM-06)."
        constraints: "one of PART, LABOR"
      - name: starts_at
        type: datetime
        source: system
        description: "Coverage start instant; equals the work order's actual_end_at."
      - name: expires_at
        type: datetime
        source: computed
        description: "starts_at plus PART_WARRANTY_DAYS or LABOR_WARRANTY_DAYS depending on coverage_class."
      - name: status
        type: enum
        source: system
        description: "Stored lifecycle of the coverage."
        default: ACTIVE
        constraints: "one of ACTIVE, SUPERSEDED, VOIDED"
      - name: coverage_state
        type: enum
        source: computed
        description: "As-of-read state: EXPIRED when status is ACTIVE and clock > expires_at, otherwise equal to status."
        constraints: "one of ACTIVE, EXPIRED, SUPERSEDED, VOIDED"
      - name: claim_count
        type: integer
        source: computed
        description: "Number of CallbackClaim rows raised against this coverage."
        default: 0

  - name: CallbackClaim
    parent: WorkOrder
    common_fields: true
    fields:
      - name: warranty_coverage_id
        type: string
        source: input
        description: "FK -> WarrantyCoverage.id; the coverage the customer is claiming against."
      - name: original_work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; work order the complaint is about."
      - name: remedy_work_order_id
        type: string
        source: system
        description: "FK -> WorkOrder.id; work order raised to remedy the defect, null until raised."
      - name: complaint_class
        type: enum
        source: input
        description: "Whether the customer is claiming a part defect or a workmanship defect."
        constraints: "one of PART, LABOR"
      - name: description
        type: string
        source: input
        description: "Customer description of the defect."
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle; see state machine CallbackClaim.status."
        default: SUBMITTED
        constraints: "one of SUBMITTED, UNDER_REVIEW, APPROVED_WARRANTY, REJECTED_OUT_OF_WARRANTY, REJECTED_NOT_DEFECT, RESOLVED_REPAIRED"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of submission; compared against the coverage window."
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Technician who adjudicated; must differ from the completing technician (SEAM-15)."
      - name: days_since_coverage_start
        type: integer
        source: computed
        description: "Whole days between the coverage's starts_at and submitted_at, floor."

  - name: MaintenancePlan
    parent: WellProfile
    common_fields: true
    fields:
      - name: well_profile_id
        type: string
        source: input
        description: "FK -> WellProfile.id; well under the plan."
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; account billed for maintenance."
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle axis."
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED, TERMINATED"
      - name: compliance_state
        type: enum
        source: computed
        description: "Compliance axis, LATCHED at the transition to OVERDUE and cleared only by a qualifying MaintenanceVisit."
        default: COMPLIANT
        constraints: "one of COMPLIANT, OVERDUE"
      - name: overdue_latched_at
        type: datetime
        source: system
        description: "Instant compliance_state latched to OVERDUE; null while COMPLIANT. Not cleared by an interval recomputation."
      - name: interval_days_as_designed
        type: integer
        source: computed
        description: "Maintenance interval computed from the duty cycle class at plan creation and frozen; variant as_designed."
      - name: interval_days_as_operated
        type: integer
        source: computed
        description: "Maintenance interval recomputed from the CURRENT duty cycle class and treatment media; variant as_operated."
      - name: last_service_date
        type: datetime
        source: computed
        description: "Instant of the most recent qualifying MaintenanceVisit; defaults to the plan's created_at."
      - name: next_due_at
        type: datetime
        source: computed
        description: "last_service_date plus interval_days_as_operated."
      - name: filter_media
        type: enum
        source: computed
        description: "Media whose time clock the plan tracks; mirrors WellProfile.treatment_media."
        default: NONE
        constraints: "one of NONE, SEDIMENT, CARBON, SOFTENER_RESIN"
      - name: last_filter_change_date
        type: datetime
        source: computed
        description: "Instant of the most recent filter change; null until one occurs."
      - name: filter_next_due_date
        type: datetime
        source: computed
        description: "last_filter_change_date plus the media's fixed interval; null while filter_media is NONE."
      - name: salt_remaining_lbs
        type: number
        source: computed
        description: "Pounds of salt left in the brine tank; consumption clock input."
        default: 0.0
      - name: monthly_salt_lbs
        type: number
        source: computed
        description: "Monthly salt burn copied from the ACCEPTED softener recommendation; 0.0 when no softener."
        default: 0.0
      - name: last_salt_delivery_date
        type: datetime
        source: computed
        description: "Instant of the most recent salt delivery; null until one occurs."
      - name: salt_next_due_date
        type: datetime
        source: computed
        description: "Consumption-driven next salt date; null when monthly_salt_lbs is 0.0."

  - name: MaintenanceVisit
    parent: MaintenancePlan
    common_fields: false
    fields:
      - name: maintenance_plan_id
        type: string
        source: input
        description: "FK -> MaintenancePlan.id; plan the visit belongs to."
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; completed work order that produced this visit."
      - name: visit_kind
        type: enum
        source: system
        description: "Which clocks the visit reset."
        constraints: "one of SALT_ONLY, FILTER_ONLY, SALT_AND_FILTER, SERVICE_ONLY"
      - name: performed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the visit."
      - name: salt_added_lbs
        type: number
        source: system
        description: "Pounds of salt added during the visit; 0.0 when none."
        default: 0.0
      - name: filter_changed
        type: boolean
        source: system
        description: "Whether the filter media was replaced during the visit."
        default: false

  - name: Invoice
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; account billed."
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; work order billed."
      - name: variant
        type: enum
        source: computed
        description: "Which costing algorithm produced the totals: pinned quote costs or actual posting costs."
        constraints: "one of QUOTED_PINNED, ACTUAL_FINAL"
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle; see state machine Invoice.status."
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, PARTIALLY_PAID, PAID_IN_FULL, VOID"
      - name: parts_subtotal_cents
        type: integer
        source: computed
        description: "Sum of PARTS line amounts."
        default: 0
      - name: labor_subtotal_cents
        type: integer
        source: computed
        description: "Sum of LABOR line amounts."
        default: 0
      - name: dispatch_subtotal_cents
        type: integer
        source: computed
        description: "Net dispatch charge plus trip fee; 0 on the scheduled pipeline."
        default: 0
      - name: warranty_credit_cents
        type: integer
        source: computed
        description: "Total credit applied for in-warranty parts and labor, expressed as a positive number."
        default: 0
      - name: loyalty_discount_cents
        type: integer
        source: computed
        description: "Loyalty discount applied to the parts subtotal, expressed as a positive number."
        default: 0
      - name: taxable_subtotal_cents
        type: integer
        source: computed
        description: "Parts subtotal after warranty parts credit and loyalty discount; the only taxable base."
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Tax on taxable_subtotal_cents."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "Final amount billed."
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Cumulative payments recorded against this invoice."
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the invoice was issued; null while DRAFT."
      - name: shared_split_pct
        type: number
        source: computed
        description: "Share of the work-order cost allocated to this account under the shared-well agreement; 100.00 when the well is not shared."
        default: 100.00

  - name: InvoiceLine
    parent: Invoice
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; owning invoice."
      - name: parts_consumption_entry_id
        type: string
        source: input
        description: "FK -> PartsConsumptionEntry.id; consumption row this line bills, null for non-parts lines."
      - name: line_type
        type: enum
        source: system
        description: "Kind of charge on this line."
        constraints: "one of PARTS, LABOR, DISPATCH_SURCHARGE, TRIP_FEE, PERMIT_FEE, WARRANTY_CREDIT, LOYALTY_DISCOUNT, TAX"
      - name: description
        type: string
        source: system
        description: "Human readable label of the line."
      - name: amount_cents
        type: integer
        source: system
        description: "Signed amount; credits and discounts are negative."
      - name: sequence_no
        type: integer
        source: system
        description: "1-based construction order of the line within its invoice."

state_machines:
  - entity: Inspection
    axis: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    shape: branching_with_terminal
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /water-service/inspections/{inspection_id}/start"
        actor: Technician
        preconditions:
          - "Inspection.status == SCHEDULED"
          - "X-User-ID equals Inspection.technician_id (G4_SCOPE)"
          - "Technician.status == AVAILABLE"
        side_effects:
          - "sets Inspection.updated_at and increments Inspection.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /water-service/inspections/{inspection_id}/complete"
        actor: Technician
        preconditions:
          - "Inspection.status == IN_PROGRESS"
          - "X-User-ID equals Inspection.technician_id (G4_SCOPE)"
          - "measured_yield_gpm, static_level_feet and observed_drawdown_gallons are all present in the body"
        side_effects:
          - "sets Inspection.completed_at to the logical clock and stores the three measurements"
          - "CASCADE-C-1 hop 1: because the inspection completed, WellProfile.measured_yield_gpm is set to Inspection.measured_yield_gpm and WellProfile.last_inspection_completed_at to Inspection.completed_at"
          - "CASCADE-C-1 hop 2: because WellProfile.pressure_tank_drawdown_gallons is set to Inspection.observed_drawdown_gallons, calculation duty_cycle_ratio is recomputed"
          - "CASCADE-C-1 hop 3: because duty_cycle_ratio changed, WellProfile.duty_cycle_class is re-banded"
          - "CASCADE-C-1 hop 4: because duty_cycle_class changed, every ACTIVE MaintenancePlan on this well recomputes interval_days_as_operated"
          - "CASCADE-C-1 hop 5: because interval_days_as_operated changed, those plans recompute next_due_at; MaintenancePlan.compliance_state is NOT re-derived here - an OVERDUE latch survives the recomputation"
          - "increments WellProfile.version by 1 and each touched MaintenancePlan.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /water-service/inspections/{inspection_id}/cancel"
        actor: Dispatcher
        preconditions: ["Inspection.status == SCHEDULED"]
        side_effects: ["increments Inspection.version by 1"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /water-service/inspections/{inspection_id}/cancel"
        actor: Dispatcher
        preconditions: ["Inspection.status == IN_PROGRESS"]
        side_effects: ["increments Inspection.version by 1"]

  - entity: WaterTest
    axis: result_status
    initial_state: COLLECTED
    terminal_states: [ANALYZED_NEGATIVE, ANALYZED_CHEMICAL_EXCEEDANCE, INVALID_HOLD_TIME, CONFIRMED_POSITIVE, CLEARED_NEGATIVE]
    shape: branching
    transitions:
      - from: COLLECTED
        to: INVALID_HOLD_TIME
        trigger: "POST /water-service/water-tests/{water_test_id}/lab-result"
        actor: ComplianceOfficer
        preconditions:
          - "WaterTest.result_status == COLLECTED"
          - "analyzed_at - sample_datetime EXCEEDS the panel hold time (strictly greater), per calculation water_test_hold_time_validity"
        side_effects:
          - "sets hold_time_valid to false, stores analyzed_at and recorded_by_user_id"
          - "WellProfile.potability_status is NOT changed (SEAM-11)"
          - "increments WaterTest.version by 1"
        note: "This transition is chosen over the three below whenever the hold time is exceeded; it is the G6 regulatory outcome and does not raise ERR_WATER_TEST_HOLD_TIME_EXCEEDED, which is reserved for the confirmatory endpoint."
      - from: COLLECTED
        to: ANALYZED_NEGATIVE
        trigger: "POST /water-service/water-tests/{water_test_id}/lab-result"
        actor: ComplianceOfficer
        preconditions:
          - "WaterTest.result_status == COLLECTED"
          - "hold time satisfied"
          - "panel_type == BACTERIOLOGICAL and coliform_present == false"
        side_effects:
          - "sets hold_time_valid true, analyzed_at, recorded_by_user_id"
          - "sets WellProfile.potability_status to SAFE and clears advisory_reason"
          - "increments WaterTest.version by 1 and WellProfile.version by 1"
      - from: COLLECTED
        to: ANALYZED_PRESUMPTIVE_POSITIVE
        trigger: "POST /water-service/water-tests/{water_test_id}/lab-result"
        actor: ComplianceOfficer
        preconditions:
          - "WaterTest.result_status == COLLECTED"
          - "hold time satisfied"
          - "panel_type == BACTERIOLOGICAL and coliform_present == true"
        side_effects:
          - "sets hold_time_valid true, analyzed_at, recorded_by_user_id"
          - "sets WellProfile.potability_status to ADVISORY and advisory_reason to 'PRESUMPTIVE_COLIFORM'"
          - "increments WaterTest.version by 1 and WellProfile.version by 1"
        note: "Not terminal - the presumptive finding is unlatched until a confirmatory result arrives or the retest window closes (SEAM-01)."
      - from: COLLECTED
        to: ANALYZED_CHEMICAL_EXCEEDANCE
        trigger: "POST /water-service/water-tests/{water_test_id}/lab-result"
        actor: ComplianceOfficer
        preconditions:
          - "WaterTest.result_status == COLLECTED"
          - "hold time satisfied"
          - "panel_type == CHEMICAL"
        side_effects:
          - "sets hold_time_valid true, analyzed_at, recorded_by_user_id"
          - "copies hardness_gpg onto WellProfile.hardness_gpg"
          - "sets WellProfile.potability_status to ADVISORY with advisory_reason 'CHEMICAL_EXCEEDANCE' when any declared MCL is exceeded, otherwise leaves potability_status unchanged"
          - "increments WaterTest.version by 1 and WellProfile.version by 1"
        note: "A CHEMICAL panel latches at this instant - there is no confirmatory step for chemistry (SEAM-01). The state name is used for every chemical result; the advisory only fires when an MCL is exceeded."
      - from: ANALYZED_PRESUMPTIVE_POSITIVE
        to: CLEARED_NEGATIVE
        trigger: "POST /water-service/water-tests/{water_test_id}/confirmatory-result"
        actor: ComplianceOfficer
        preconditions:
          - "WaterTest.result_status == ANALYZED_PRESUMPTIVE_POSITIVE"
          - "the confirmatory sample_datetime is within RETEST_WINDOW_DAYS of this test's sample_datetime, right-closed (G6)"
          - "X-User-ID differs from WaterTest.recorded_by_user_id (G6, SEAM-15)"
          - "body field confirm_coliform_present == false"
        side_effects:
          - "creates a child WaterTest row with parent_test_id set to this test, panel_type BACTERIOLOGICAL, result_status CLEARED_NEGATIVE"
          - "sets this test's result_status to CLEARED_NEGATIVE and confirmed_by_user_id"
          - "sets WellProfile.potability_status to SAFE and clears advisory_reason"
          - "increments WaterTest.version by 1 and WellProfile.version by 1"
      - from: ANALYZED_PRESUMPTIVE_POSITIVE
        to: CONFIRMED_POSITIVE
        trigger: "POST /water-service/water-tests/{water_test_id}/confirmatory-result"
        actor: ComplianceOfficer
        preconditions:
          - "WaterTest.result_status == ANALYZED_PRESUMPTIVE_POSITIVE"
          - "the confirmatory sample_datetime is within RETEST_WINDOW_DAYS, right-closed (G6)"
          - "X-User-ID differs from WaterTest.recorded_by_user_id (G6, SEAM-15)"
          - "body field confirm_coliform_present == true"
        side_effects:
          - "MUTATE-THEN-REJECT (rung L60): creates the child WaterTest row with result_status CONFIRMED_POSITIVE, sets this test's result_status to CONFIRMED_POSITIVE and confirmed_by_user_id, sets WellProfile.potability_status to UNSAFE with advisory_reason 'CONFIRMED_COLIFORM', increments both versions - and THEN returns 422 ERR_RETEST_CONFIRMED_POSITIVE. Every write above PERSISTS."
        note: "The endpoint's contract is 'clear the presumptive advisory'. A confirming retest cannot satisfy that contract, so the response is an error even though the durable record of the confirmation is exactly what the regulator requires. Sits at G9_BUSINESS: gates G1..G8 have all passed before any write occurs."

  - entity: WellProfile
    axis: potability_status
    initial_state: UNKNOWN
    terminal_states: []
    shape: cyclic
    transitions:
      - from: UNKNOWN
        to: SAFE
        trigger: "system: a BACTERIOLOGICAL lab result with coliform_present false"
        actor: system
        preconditions: ["hold time satisfied"]
        side_effects: ["clears advisory_reason"]
      - from: UNKNOWN
        to: ADVISORY
        trigger: "system: a presumptive-positive bacteriological result, or a chemical MCL exceedance"
        actor: system
        preconditions: ["hold time satisfied"]
        side_effects: ["latches advisory_reason"]
      - from: SAFE
        to: ADVISORY
        trigger: "system: a presumptive-positive bacteriological result, or a chemical MCL exceedance"
        actor: system
        preconditions: ["hold time satisfied"]
        side_effects: ["latches advisory_reason"]
      - from: ADVISORY
        to: UNSAFE
        trigger: "system: a confirmatory retest returns coliform present, or the retest window closes with no confirmatory sample"
        actor: system
        preconditions: ["the parent WaterTest is in ANALYZED_PRESUMPTIVE_POSITIVE"]
        side_effects: ["sets advisory_reason to CONFIRMED_COLIFORM or RETEST_WINDOW_LAPSED"]
      - from: ADVISORY
        to: SAFE
        trigger: "system: a confirmatory retest returns coliform absent"
        actor: system
        preconditions: ["the parent WaterTest is in ANALYZED_PRESUMPTIVE_POSITIVE and within the retest window"]
        side_effects: ["clears advisory_reason"]
      - from: UNSAFE
        to: SAFE
        trigger: "system: a later independent BACTERIOLOGICAL lab result with coliform_present false"
        actor: system
        preconditions: ["hold time satisfied on the later test"]
        side_effects: ["clears advisory_reason"]
        note: "This is the cycle - UNSAFE is not terminal; a fresh clean panel restores SAFE."

  - entity: TreatmentRecommendation
    axis: status
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED]
    shape: branching
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /water-service/treatment-recommendations/{treatment_recommendation_id}/accept"
        actor: CustomerContact
        preconditions:
          - "TreatmentRecommendation.status == PROPOSED"
          - "status_effective != EXPIRED, i.e. clock < expires_at (G9)"
          - "the WellProfile is not sitting at potability_status ADVISORY with advisory_reason PRESUMPTIVE_COLIFORM (G9, cross-entity dependency CE-2)"
          - "X-User-ID equals the owning Account.id (G4_SCOPE)"
        side_effects:
          - "sets WellProfile.treatment_media to recommended_media"
          - "sets every ACTIVE MaintenancePlan on the well: filter_media = recommended_media, monthly_salt_lbs = this recommendation's monthly_salt_lbs (0.0 when media is not SOFTENER_RESIN)"
          - "recomputes those plans' interval_days_as_operated and next_due_at"
          - "increments TreatmentRecommendation.version, WellProfile.version and each touched MaintenancePlan.version by 1"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system: a newer TreatmentRecommendation is created for the same well"
        actor: system
        preconditions: ["the newer recommendation was accepted by the server"]
        side_effects: ["sets superseded_by_id to the newer recommendation's id"]
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system: a newer TreatmentRecommendation is created for the same well"
        actor: system
        preconditions: ["the newer recommendation was accepted by the server"]
        side_effects: ["sets superseded_by_id to the newer recommendation's id"]

  - entity: Quote
    axis: status
    initial_state: DRAFT
    terminal_states: [DECLINED, CONSUMED, EXPIRED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /water-service/quotes/{quote_id}/price"
        actor: Estimator
        preconditions:
          - "Quote.status == DRAFT"
          - "at least one QuoteLine with status ACTIVE exists (G9, else ERR_QUOTE_HAS_NO_ACTIVE_LINES)"
        side_effects:
          - "pins unit_cost_cents_pinned on every ACTIVE line from the current catalog cost"
          - "computes markup_pct_applied, unit_price_cents and extended_price_cents per line, rounded per line"
          - "computes parts_subtotal_cents, labor_subtotal_cents, permit_fee_cents, tax_cents and total_cents"
          - "increments Quote.version by 1 and each ACTIVE QuoteLine.version by 1"
      - from: REVISION_REQUIRED
        to: PRICED
        trigger: "POST /water-service/quotes/{quote_id}/price"
        actor: Estimator
        preconditions:
          - "Quote.status == REVISION_REQUIRED"
          - "at least one QuoteLine with status ACTIVE exists"
        side_effects:
          - "re-pins unit_cost_cents_pinned on lines whose pin is null (newly added alternates) and leaves existing pins frozen"
          - "recomputes all subtotals and total_cents"
          - "increments Quote.version by 1"
        note: "This is the revision cycle PRICED -> SENT -> REVISION_REQUIRED -> PRICED."
      - from: PRICED
        to: SENT
        trigger: "POST /water-service/quotes/{quote_id}/send"
        actor: Estimator
        preconditions: ["Quote.status == PRICED"]
        side_effects:
          - "sets sent_at to the logical clock"
          - "increments Quote.version by 1"
      - from: SENT
        to: APPROVED
        trigger: "POST /water-service/quotes/{quote_id}/approve"
        actor: CustomerContact
        preconditions:
          - "Quote.status == SENT"
          - "X-User-ID equals the owning Account.id (G4_SCOPE)"
          - "NOTE: the QUOTE_VALIDITY_DAYS window is deliberately NOT enforced here. It is enforced only by the explicit POST /water-service/quotes/{quote_id}/expire sweep, so that the inspection-staleness check below stays reachable after long clock advances."
          - "the referenced Inspection is COMPLETED and clock - Inspection.completed_at <= INSPECTION_VALIDITY_DAYS days, right-closed (G9, ERR_INSPECTION_STALE)"
          - "Account.credit_hold == false (G9, fiscal)"
          - "every ACTIVE line whose part category is PUMP still satisfies the yield gate (G9)"
        side_effects:
          - "sets approved_at and approved_total_cents = total_cents"
          - "increments Quote.version by 1"
      - from: SENT
        to: REVISION_REQUIRED
        trigger: "POST /water-service/quotes/{quote_id}/approve when a PUMP line fails the yield gate"
        actor: CustomerContact
        preconditions:
          - "Quote.status == SENT and all gates G1..G8 passed"
          - "at least one ACTIVE PUMP line has rated_gpm > WellProfile.measured_yield_gpm * YIELD_SAFETY_FACTOR"
        side_effects:
          - "MUTATE-THEN-REJECT (rung L61): sets every offending line's status to SUPERSEDED_BY_YIELD, sets Quote.status to REVISION_REQUIRED, increments Quote.version and each offending line's version by 1 - and THEN returns 409 ERR_QUOTE_LINE_YIELD_EXCEEDED. Every write above PERSISTS."
        note: "Reachable only when the well's measured_yield_gpm dropped after the quote was priced, e.g. a later inspection recorded a lower yield. Sits at G9_BUSINESS."
      - from: SENT
        to: DECLINED
        trigger: "POST /water-service/quotes/{quote_id}/decline"
        actor: CustomerContact
        preconditions:
          - "Quote.status == SENT"
          - "X-User-ID equals the owning Account.id"
        side_effects: ["increments Quote.version by 1"]
      - from: APPROVED
        to: REVISION_REQUIRED
        trigger: "system: a permit approved with conditions mandates an alternate part (CASCADE-C-2 hop 3)"
        actor: system
        preconditions: ["the permit's superseded_quote_line_id names an ACTIVE line of this quote"]
        side_effects:
          - "recomputes all subtotals and total_cents from the surviving ACTIVE lines plus the new alternate line"
          - "increments Quote.version by 1"
      - from: APPROVED
        to: CONSUMED
        trigger: "POST /water-service/work-orders with this quote_id"
        actor: Dispatcher
        preconditions: ["Quote.status == APPROVED"]
        side_effects: ["increments Quote.version by 1"]
      - from: SENT
        to: EXPIRED
        trigger: "POST /water-service/quotes/{quote_id}/expire"
        actor: PlatformAdmin
        preconditions:
          - "Quote.status == SENT"
          - "clock - sent_at > QUOTE_VALIDITY_DAYS days (strictly greater)"
        side_effects: ["increments Quote.version by 1"]

  - entity: QuoteLine
    axis: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, SUPERSEDED_BY_YIELD, REMOVED]
    shape: branching
    transitions:
      - from: ACTIVE
        to: REMOVED
        trigger: "DELETE /water-service/quote-lines/{quote_line_id}"
        actor: Estimator
        preconditions:
          - "QuoteLine.status == ACTIVE"
          - "the owning Quote.status is DRAFT or REVISION_REQUIRED"
        side_effects: ["increments QuoteLine.version and Quote.version by 1"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: permit approved with conditions naming this line (CASCADE-C-2 hop 2)"
        actor: system
        preconditions: ["QuoteLine.status == ACTIVE"]
        side_effects:
          - "sets superseded_by_line_id to the newly created alternate line"
          - "increments QuoteLine.version by 1"
      - from: ACTIVE
        to: SUPERSEDED_BY_YIELD
        trigger: "POST /water-service/quotes/{quote_id}/approve failing the yield gate (rung L61)"
        actor: system
        preconditions: ["QuoteLine.status == ACTIVE and the line's part category is PUMP"]
        side_effects: ["increments QuoteLine.version by 1"]

  - entity: EmergencyTicket
    axis: dispatch_status
    initial_state: INTAKE
    terminal_states: [RESOLVED, CANCELLED]
    shape: parallel
    parallel_note: |
      EmergencyTicket carries TWO independent axes on the same row: dispatch_status
      (below) and authorization_status (next block). Neither axis's transitions
      constrain the other's, except where a precondition explicitly names the other
      axis. A ticket can be ON_SITE with authorization NOT_REQUIRED, DIAGNOSED with
      authorization PENDING, or DIAGNOSED with authorization DECLINED.
    transitions:
      - from: INTAKE
        to: TRIAGED
        trigger: "POST /water-service/emergency-tickets/{emergency_ticket_id}/triage"
        actor: Dispatcher
        preconditions:
          - "dispatch_status == INTAKE"
          - "Property.service_zone != OUT_OF_AREA (G9, ERR_OUT_OF_SERVICE_AREA)"
        side_effects: ["increments EmergencyTicket.version by 1"]
      - from: TRIAGED
        to: DISPATCHED
        trigger: "POST /water-service/emergency-tickets/{emergency_ticket_id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "dispatch_status == TRIAGED"
          - "the named Technician exists (G9A) and Technician.status == AVAILABLE (G9)"
        side_effects:
          - "sets assigned_technician_id and dispatched_at to the logical clock"
          - "computes response_minutes"
          - "increments EmergencyTicket.version by 1"
      - from: DISPATCHED
        to: ON_SITE
        trigger: "POST /water-service/emergency-tickets/{emergency_ticket_id}/arrive"
        actor: Technician
        preconditions:
          - "dispatch_status == DISPATCHED"
          - "X-User-ID equals assigned_technician_id (G4_SCOPE)"
        side_effects: ["increments EmergencyTicket.version by 1"]
      - from: ON_SITE
        to: DIAGNOSED
        trigger: "POST /water-service/emergency-tickets/{emergency_ticket_id}/diagnosis"
        actor: Technician
        preconditions:
          - "dispatch_status == ON_SITE"
          - "X-User-ID equals assigned_technician_id (G4_SCOPE)"
        side_effects:
          - "stores cause_class and onsite_estimate_cents"
          - "computes severity_score, dispatch_surcharge_cents, membership_credit_cents and net_dispatch_charge_cents"
          - "computes preauth_cap_cents from membership_tier_at_intake"
          - "AUTHORIZATION AXIS side effect: when onsite_estimate_cents > preauth_cap_cents the authorization axis moves NOT_REQUIRED -> PENDING; otherwise it moves NOT_REQUIRED -> PRE_AUTHORIZED"
          - "increments EmergencyTicket.version by 1"
      - from: DIAGNOSED
        to: RESOLVED
        trigger: "system: the linked WorkOrder reaches COMPLETED (CASCADE-C-3 hop 8)"
        actor: system
        preconditions: ["dispatch_status == DIAGNOSED"]
        side_effects: ["increments EmergencyTicket.version by 1"]
      - from: INTAKE
        to: CANCELLED
        trigger: "POST /water-service/emergency-tickets/{emergency_ticket_id}/cancel"
        actor: Dispatcher
        preconditions: ["dispatch_status == INTAKE"]
        side_effects: ["increments EmergencyTicket.version by 1"]
      - from: TRIAGED
        to: CANCELLED
        trigger: "POST /water-service/emergency-tickets/{emergency_ticket_id}/cancel"
        actor: Dispatcher
        preconditions: ["dispatch_status == TRIAGED"]
        side_effects: ["increments EmergencyTicket.version by 1"]
      - from: DIAGNOSED
        to: CANCELLED
        trigger: "POST /water-service/emergency-tickets/{emergency_ticket_id}/cancel"
        actor: Dispatcher
        preconditions:
          - "dispatch_status == DIAGNOSED"
          - "authorization_status == DECLINED"
        side_effects: ["increments EmergencyTicket.version by 1"]
        note: "The only path that closes a diagnosed ticket without a work order - the customer refused the estimate."

  - entity: EmergencyTicket
    axis: authorization_status
    initial_state: NOT_REQUIRED
    terminal_states: [DECLINED]
    shape: parallel
    transitions:
      - from: NOT_REQUIRED
        to: PRE_AUTHORIZED
        trigger: "system: diagnosis recorded with onsite_estimate_cents <= preauth_cap_cents"
        actor: system
        preconditions: ["authorization_status == NOT_REQUIRED"]
        side_effects: ["no further approval is needed before parts consumption"]
      - from: NOT_REQUIRED
        to: PENDING
        trigger: "system: diagnosis recorded with onsite_estimate_cents > preauth_cap_cents"
        actor: system
        preconditions: ["authorization_status == NOT_REQUIRED"]
        side_effects: ["parts consumption on the linked work order is blocked until AUTHORIZED"]
      - from: PENDING
        to: AUTHORIZED
        trigger: "POST /water-service/emergency-tickets/{emergency_ticket_id}/authorize"
        actor: CustomerContact
        preconditions:
          - "authorization_status == PENDING"
          - "X-User-ID equals EmergencyTicket.account_id (G4_SCOPE)"
          - "Account.credit_hold == false (G9, fiscal)"
        side_effects: ["increments EmergencyTicket.version by 1"]
      - from: PENDING
        to: DECLINED
        trigger: "POST /water-service/emergency-tickets/{emergency_ticket_id}/decline-authorization"
        actor: CustomerContact
        preconditions:
          - "authorization_status == PENDING"
          - "X-User-ID equals EmergencyTicket.account_id (G4_SCOPE)"
        side_effects: ["increments EmergencyTicket.version by 1"]

  - entity: WorkOrder
    axis: fulfillment_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    shape: parallel
    parallel_note: |
      WorkOrder carries TWO independent axes: fulfillment_status (work) and
      billing_status (money). A COMPLETED work order can sit at PENDING_INVOICE for
      any number of requests; a CANCELLED work order can still be WRITTEN_OFF. The
      only coupling points are named explicitly in preconditions.
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /water-service/work-orders/{work_order_id}/schedule"
        actor: Dispatcher
        preconditions:
          - "fulfillment_status == DRAFT"
          - "scope requires no permit, OR a Permit for this work order is APPROVED or APPROVED_WITH_CONDITIONS, OR pipeline == EMERGENCY (G6, cross-entity dependency CE-1)"
          - "the assigned Technician's tier satisfies the scope tier table (G6, ERR_TECHNICIAN_TIER_INSUFFICIENT)"
          - "the buffered scheduled window does not collide with another SCHEDULED or IN_PROGRESS work order of the same technician (G9, overlap rule TO-1)"
          - "the well has fewer than WELL_DAILY_WORK_ORDER_CAP other SCHEDULED or IN_PROGRESS work orders bucketed into the same UTC calendar day (G9, overlap rule TO-2)"
        side_effects:
          - "stores scheduled_start_at and scheduled_end_at"
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: HELD
        trigger: "system: a permit approved with conditions revoked the parent quote's approval (CASCADE-C-2 hop 4)"
        actor: system
        preconditions: ["fulfillment_status == SCHEDULED and the parent Quote left APPROVED"]
        side_effects:
          - "sets hold_reason to 'PERMIT_CONDITION_REVISION' and clears scheduled_start_at and scheduled_end_at, releasing the technician window"
          - "increments WorkOrder.version by 1"
      - from: HELD
        to: SCHEDULED
        trigger: "POST /water-service/work-orders/{work_order_id}/schedule"
        actor: Dispatcher
        preconditions:
          - "fulfillment_status == HELD"
          - "the parent Quote.status == APPROVED again"
          - "all the DRAFT -> SCHEDULED preconditions above"
        side_effects:
          - "clears hold_reason, stores the new window"
          - "increments WorkOrder.version by 1"
        note: "This closes the SCHEDULED -> HELD -> SCHEDULED cycle."
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /water-service/work-orders/{work_order_id}/start"
        actor: Technician
        preconditions:
          - "fulfillment_status == SCHEDULED"
          - "X-User-ID equals assigned_technician_id (G4_SCOPE)"
        side_effects:
          - "sets actual_start_at to the logical clock"
          - "increments WorkOrder.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /water-service/work-orders/{work_order_id}/complete"
        actor: Technician
        preconditions:
          - "fulfillment_status == IN_PROGRESS"
          - "X-User-ID equals assigned_technician_id (G4_SCOPE)"
          - "when pipeline == EMERGENCY and the ticket's authorization_status == PENDING, completion is refused (G9, ERR_AUTHORIZATION_REQUIRED)"
          - "body field actual_labor_minutes present (G8)"
        side_effects:
          - "CASCADE-C-3 hop 1: sets actual_end_at, computes billable_minutes, labor_rate_cents_per_hour and labor_charge_cents"
          - "CASCADE-C-3 hop 2: because the work order completed, every POSTED PartsConsumptionEntry on it is finalised - unit_cost_cents_snapshot, markup and extended_price_cents are frozen against further catalog moves, posted_at is fixed, and WorkOrder.parts_charge_cents is set to their sum. The stock decrement already happened at posting time."
          - "CASCADE-C-3 hop 3: because parts were finalised, one WarrantyCoverage row of class PART is minted per finalised entry and exactly one of class LABOR is minted for the work order; when this work order carries origin_callback_claim_id, the coverage named by that claim is set to SUPERSEDED with superseded_by_id pointing at the new coverage of the same class"
          - "CASCADE-C-3 hop 4: because a coverage was superseded, the CallbackClaim named by origin_callback_claim_id moves APPROVED_WARRANTY -> RESOLVED_REPAIRED and the ORIGINAL work order's callback_eligibility becomes CONSUMED"
          - "CASCADE-C-3 hop 5: because parts and labor were finalised, every ACTIVE MaintenancePlan on this well is refreshed - exactly one MaintenanceVisit row is created per ACTIVE plan with visit_kind selected by calculation maintenance_visit_kind_selection from the finalised part categories and media kinds, WellProfile.pressure_tank_drawdown_gallons is set to the rated drawdown of the finalised PRESSURE_TANK part when one is present, and duty_cycle_ratio, duty_cycle_class and interval_days_as_operated are re-derived in that order"
          - "CASCADE-C-3 hop 6: because the interval changed, next_due_at is recomputed from last_service_date; salt_next_due_date and filter_next_due_date are reset for whichever clock the visit touched; compliance_state clears to COMPLIANT only when visit_kind is SALT_AND_FILTER or FILTER_ONLY"
          - "CASCADE-C-3 hop 7: because the work order became billable, an Invoice is created in DRAFT with variant QUOTED_PINNED when quote_id is set and ACTUAL_FINAL otherwise, and its InvoiceLine rows are constructed in the pinned order PARTS, LABOR, DISPATCH_SURCHARGE, TRIP_FEE, PERMIT_FEE, WARRANTY_CREDIT, LOYALTY_DISCOUNT, TAX"
          - "CASCADE-C-3 hop 8: because an invoice exists, WorkOrder.billing_status moves NOT_BILLABLE -> PENDING_INVOICE, and when pipeline == EMERGENCY the ticket's dispatch_status moves DIAGNOSED -> RESOLVED; Account.balance_cents is NOT touched at DRAFT"
          - "increments WorkOrder.version, each touched PartCatalogItem.version, each touched MaintenancePlan.version, the WellProfile.version, the EmergencyTicket.version and any touched CallbackClaim.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /water-service/work-orders/{work_order_id}/cancel"
        actor: Dispatcher
        preconditions: ["fulfillment_status == DRAFT"]
        side_effects: ["increments WorkOrder.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /water-service/work-orders/{work_order_id}/cancel"
        actor: Dispatcher
        preconditions: ["fulfillment_status == SCHEDULED"]
        side_effects: ["releases the technician window; increments WorkOrder.version by 1"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /water-service/work-orders/{work_order_id}/cancel"
        actor: Dispatcher
        preconditions: ["fulfillment_status == IN_PROGRESS"]
        side_effects:
          - "COMPENSATION for invariant CI-1: every POSTED PartsConsumptionEntry on this work order moves to REVERSED and PartCatalogItem.on_hand_qty is restored by the entry quantity, leaving on_hand_qty + sum(POSTED quantities) exactly as it was before the postings"
          - "increments WorkOrder.version and each touched PartCatalogItem.version by 1"

  - entity: WorkOrder
    axis: billing_status
    initial_state: NOT_BILLABLE
    terminal_states: [SETTLED, WRITTEN_OFF]
    shape: parallel
    transitions:
      - from: NOT_BILLABLE
        to: PENDING_INVOICE
        trigger: "system: the work order reached COMPLETED and a DRAFT Invoice was created (CASCADE-C-3 hop 8)"
        actor: system
        preconditions: ["billing_status == NOT_BILLABLE"]
        side_effects: ["links the created Invoice through Invoice.work_order_id"]
      - from: PENDING_INVOICE
        to: INVOICED
        trigger: "system: the linked Invoice moved DRAFT -> ISSUED"
        actor: system
        preconditions: ["billing_status == PENDING_INVOICE"]
        side_effects: ["increments WorkOrder.version by 1"]
      - from: INVOICED
        to: SETTLED
        trigger: "system: the linked Invoice reached PAID_IN_FULL"
        actor: system
        preconditions: ["billing_status == INVOICED"]
        side_effects: ["increments WorkOrder.version by 1"]
      - from: INVOICED
        to: WRITTEN_OFF
        trigger: "system: the linked Invoice was VOIDed"
        actor: system
        preconditions: ["billing_status == INVOICED"]
        side_effects: ["increments WorkOrder.version by 1"]
      - from: NOT_BILLABLE
        to: WRITTEN_OFF
        trigger: "POST /water-service/work-orders/{work_order_id}/write-off"
        actor: BillingClerk
        preconditions:
          - "billing_status == NOT_BILLABLE"
          - "fulfillment_status == CANCELLED"
        side_effects: ["increments WorkOrder.version by 1"]

  - entity: Permit
    axis: status
    initial_state: DRAFT
    terminal_states: [APPROVED, APPROVED_WITH_CONDITIONS, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /water-service/permits/{permit_id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "Permit.status == DRAFT"
          - "Permit.jurisdiction_code == WellProfile.jurisdiction_code (G6, ERR_PERMIT_JURISDICTION_MISMATCH, SEAM-02)"
          - "when post_hoc is true, the linked WorkOrder is COMPLETED and clock - WorkOrder.actual_end_at <= POST_HOC_PERMIT_WINDOW_DAYS days, right-closed (G6, ERR_POST_HOC_PERMIT_WINDOW_EXPIRED)"
          - "no other Permit for the same well and scope is already FILED, APPROVED or APPROVED_WITH_CONDITIONS (G9, ERR_PERMIT_ALREADY_ON_FILE)"
        side_effects:
          - "computes jurisdiction_tier and fee_cents"
          - "sets filed_at to the logical clock"
          - "increments Permit.version by 1"
      - from: FILED
        to: APPROVED
        trigger: "POST /water-service/permits/{permit_id}/approve with mandated_alternate_part_id absent"
        actor: ComplianceOfficer
        preconditions: ["Permit.status == FILED"]
        side_effects: ["increments Permit.version by 1"]
      - from: FILED
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /water-service/permits/{permit_id}/approve with mandated_alternate_part_id and superseded_quote_line_id present"
        actor: ComplianceOfficer
        preconditions:
          - "Permit.status == FILED"
          - "the named QuoteLine exists (G9A) and belongs to Permit.quote_id and is ACTIVE (G9)"
          - "the named PartCatalogItem exists (G9A), is ACTIVE, and shares the superseded line's category (G9, ERR_PART_CATEGORY_MISMATCH)"
        side_effects:
          - "CASCADE-C-2 hop 1: stores condition_text, mandated_alternate_part_id and superseded_quote_line_id, sets status APPROVED_WITH_CONDITIONS, increments Permit.version by 1"
          - "CASCADE-C-2 hop 2: because a mandated alternate is named, the named QuoteLine moves ACTIVE -> SUPERSEDED and a new QuoteLine is created on the same quote with origin PERMIT_MANDATED_ALTERNATE, status ACTIVE, the same quantity and part_catalog_item_id = mandated_alternate_part_id, with unit_cost_cents_pinned left null"
          - "CASCADE-C-2 hop 3: because the quote's ACTIVE line set changed, the Quote moves APPROVED -> REVISION_REQUIRED (or stays where it is when it was not APPROVED) and its subtotals, tax and total_cents are recomputed over the surviving ACTIVE lines, treating the un-pinned alternate at the catalog's CURRENT unit_cost_cents"
          - "CASCADE-C-2 hop 4: because the quote left APPROVED, every WorkOrder whose quote_id is this quote and whose fulfillment_status is SCHEDULED moves to HELD with hold_reason 'PERMIT_CONDITION_REVISION' and its scheduled window is released"
          - "increments Quote.version, each touched QuoteLine.version and each touched WorkOrder.version by 1"
      - from: FILED
        to: REJECTED
        trigger: "POST /water-service/permits/{permit_id}/reject"
        actor: ComplianceOfficer
        preconditions: ["Permit.status == FILED"]
        side_effects: ["increments Permit.version by 1"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /water-service/permits/{permit_id}/refile-draft"
        actor: ComplianceOfficer
        preconditions: ["Permit.status == REJECTED"]
        side_effects:
          - "clears filed_at and fee_cents back to 0"
          - "increments Permit.version by 1"
        note: "This closes the DRAFT -> FILED -> REJECTED -> DRAFT cycle."
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /water-service/permits/{permit_id}/withdraw"
        actor: ComplianceOfficer
        preconditions: ["Permit.status == FILED"]
        side_effects: ["increments Permit.version by 1"]

  - entity: CallbackClaim
    axis: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED_OUT_OF_WARRANTY, REJECTED_NOT_DEFECT, RESOLVED_REPAIRED]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: REJECTED_OUT_OF_WARRANTY
        trigger: "POST /water-service/work-orders/{work_order_id}/callback-claims when the named coverage is out of window"
        actor: CustomerContact
        preconditions:
          - "all gates G1..G8 passed"
          - "the named WarrantyCoverage's coverage_state is EXPIRED for the claimed complaint_class"
        side_effects:
          - "MUTATE-THEN-REJECT (rung L62): the CallbackClaim row is durably created with status REJECTED_OUT_OF_WARRANTY and submitted_at set, WarrantyCoverage.claim_count is incremented, WorkOrder.callback_attempt_count is incremented and WorkOrder.callback_eligibility is set to EXPIRED, the WorkOrder and WarrantyCoverage versions are incremented - and THEN the endpoint returns 409 ERR_CALLBACK_OUT_OF_WARRANTY. Every write above PERSISTS and the created claim is retrievable through GET /water-service/work-orders/{work_order_id}/callback-claims."
        note: "Sits at G9_BUSINESS. The attempt is a compliance record the business is required to keep even though the claim fails."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /water-service/callback-claims/{callback_claim_id}/adjudicate with decision REVIEW"
        actor: Technician
        preconditions:
          - "CallbackClaim.status == SUBMITTED"
          - "X-User-ID differs from the original work order's assigned_technician_id (G6, ERR_CALLBACK_ADJUDICATOR_CONFLICT, SEAM-15)"
        side_effects:
          - "sets adjudicated_by_user_id"
          - "increments CallbackClaim.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED_WARRANTY
        trigger: "POST /water-service/callback-claims/{callback_claim_id}/adjudicate with decision APPROVE"
        actor: Technician
        preconditions:
          - "CallbackClaim.status == UNDER_REVIEW"
          - "X-User-ID differs from the original work order's assigned_technician_id (G6)"
          - "the named WarrantyCoverage's coverage_state is ACTIVE (G9)"
          - "WarrantyCoverage.claim_count <= CALLBACK_MAX_PER_COVERAGE (G9, ERR_CALLBACK_LIMIT_REACHED)"
        side_effects:
          - "sets the ORIGINAL WorkOrder.callback_eligibility to ELIGIBLE"
          - "increments CallbackClaim.version and WorkOrder.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED_NOT_DEFECT
        trigger: "POST /water-service/callback-claims/{callback_claim_id}/adjudicate with decision REJECT"
        actor: Technician
        preconditions:
          - "CallbackClaim.status == UNDER_REVIEW"
          - "X-User-ID differs from the original work order's assigned_technician_id (G6)"
        side_effects: ["increments CallbackClaim.version by 1"]
      - from: APPROVED_WARRANTY
        to: RESOLVED_REPAIRED
        trigger: "system: the remedy WorkOrder reached COMPLETED (CASCADE-C-3 hop 4)"
        actor: system
        preconditions: ["CallbackClaim.status == APPROVED_WARRANTY and remedy_work_order_id is set"]
        side_effects:
          - "sets the ORIGINAL WorkOrder.callback_eligibility to CONSUMED"
          - "increments CallbackClaim.version by 1"

  - entity: WarrantyCoverage
    axis: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, VOIDED]
    shape: branching
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a remedy WorkOrder completed and minted a replacement coverage of the same class (CASCADE-C-3 hop 3)"
        actor: system
        preconditions:
          - "WarrantyCoverage.status == ACTIVE"
          - "the completing work order's origin_callback_claim_id names a claim whose warranty_coverage_id is this coverage"
        side_effects:
          - "sets superseded_by_id to the newly minted coverage of the same coverage_class"
          - "increments WarrantyCoverage.version by 1"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /water-service/warranty-coverages/{warranty_coverage_id}/void"
        actor: PlatformAdmin
        preconditions:
          - "WarrantyCoverage.status == ACTIVE"
          - "no CallbackClaim against this coverage is in APPROVED_WARRANTY (G9, ERR_WARRANTY_ALREADY_SUPERSEDED is raised instead when status is already SUPERSEDED)"
        side_effects: ["increments WarrantyCoverage.version by 1"]

  - entity: Invoice
    axis: status
    initial_state: DRAFT
    terminal_states: [PAID_IN_FULL, VOID]
    shape: branching_with_revisit
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /water-service/invoices/{invoice_id}/issue"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == DRAFT"
          - "the linked WorkOrder.fulfillment_status == COMPLETED (G9, cross-entity dependency CE-3)"
        side_effects:
          - "sets issued_at to the logical clock"
          - "increments Account.balance_cents by total_cents and Account.lifetime_invoiced_cents by total_cents"
          - "re-derives Account.credit_hold"
          - "moves the linked WorkOrder.billing_status PENDING_INVOICE -> INVOICED"
          - "increments Invoice.version, Account.version and WorkOrder.version by 1"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /water-service/invoices/{invoice_id}/payments with amount_cents < the outstanding amount"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == ISSUED"
          - "0 < amount_cents < total_cents - amount_paid_cents (G9)"
        side_effects:
          - "adds amount_cents to amount_paid_cents, subtracts it from Account.balance_cents and adds it to Account.lifetime_paid_cents"
          - "re-derives Account.credit_hold"
          - "increments Invoice.version and Account.version by 1"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /water-service/invoices/{invoice_id}/payments with amount_cents still below the outstanding amount"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == PARTIALLY_PAID"
          - "0 < amount_cents < total_cents - amount_paid_cents (G9)"
        side_effects:
          - "adds amount_cents to amount_paid_cents, subtracts it from Account.balance_cents and adds it to Account.lifetime_paid_cents"
          - "increments Invoice.version and Account.version by 1"
        note: "Self-loop: repeated part payments are legitimate, which is exactly why this endpoint carries OCC (concurrency rule payment-record-stale-invoice)."
      - from: ISSUED
        to: PAID_IN_FULL
        trigger: "POST /water-service/invoices/{invoice_id}/payments with amount_cents equal to the outstanding amount"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == ISSUED"
          - "amount_cents == total_cents - amount_paid_cents (G9)"
        side_effects:
          - "sets amount_paid_cents to total_cents, subtracts amount_cents from Account.balance_cents, adds it to Account.lifetime_paid_cents"
          - "moves the linked WorkOrder.billing_status INVOICED -> SETTLED"
          - "increments Invoice.version, Account.version and WorkOrder.version by 1"
      - from: PARTIALLY_PAID
        to: PAID_IN_FULL
        trigger: "POST /water-service/invoices/{invoice_id}/payments with amount_cents equal to the outstanding amount"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == PARTIALLY_PAID"
          - "amount_cents == total_cents - amount_paid_cents (G9)"
        side_effects:
          - "sets amount_paid_cents to total_cents, subtracts amount_cents from Account.balance_cents, adds it to Account.lifetime_paid_cents"
          - "moves the linked WorkOrder.billing_status INVOICED -> SETTLED"
          - "increments Invoice.version, Account.version and WorkOrder.version by 1"
      - from: PARTIALLY_PAID
        to: VOID
        trigger: "POST /water-service/invoices/{invoice_id}/void"
        actor: BillingClerk
        preconditions: ["Invoice.status == PARTIALLY_PAID"]
        side_effects:
          - "COMPENSATION for invariant CI-2: subtracts (total_cents - amount_paid_cents) from Account.balance_cents, subtracts total_cents from Account.lifetime_invoiced_cents and amount_paid_cents from Account.lifetime_paid_cents, restoring the balance identity exactly and leaving amount_paid_cents on the invoice as a historical record"
          - "moves the linked WorkOrder.billing_status INVOICED -> WRITTEN_OFF"
          - "re-derives Account.credit_hold"
          - "increments Invoice.version, Account.version and WorkOrder.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /water-service/invoices/{invoice_id}/void"
        actor: BillingClerk
        preconditions: ["Invoice.status == ISSUED"]
        side_effects:
          - "COMPENSATION for invariant CI-2: subtracts (total_cents - amount_paid_cents) from Account.balance_cents and subtracts total_cents from Account.lifetime_invoiced_cents and amount_paid_cents from Account.lifetime_paid_cents, restoring the balance identity exactly"
          - "moves the linked WorkOrder.billing_status INVOICED -> WRITTEN_OFF"
          - "re-derives Account.credit_hold"
          - "increments Invoice.version, Account.version and WorkOrder.version by 1"

  - entity: MaintenancePlan
    axis: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /water-service/maintenance-plans/{maintenance_plan_id}/suspend"
        actor: PlatformAdmin
        preconditions: ["MaintenancePlan.status == ACTIVE"]
        side_effects: ["increments MaintenancePlan.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /water-service/maintenance-plans/{maintenance_plan_id}/resume"
        actor: PlatformAdmin
        preconditions: ["MaintenancePlan.status == SUSPENDED"]
        side_effects:
          - "recomputes interval_days_as_operated and next_due_at from the current duty cycle class"
          - "increments MaintenancePlan.version by 1"
        note: "This closes the ACTIVE -> SUSPENDED -> ACTIVE cycle."
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /water-service/maintenance-plans/{maintenance_plan_id}/terminate"
        actor: PlatformAdmin
        preconditions: ["MaintenancePlan.status == SUSPENDED"]
        side_effects: ["increments MaintenancePlan.version by 1"]

  - entity: MaintenancePlan
    axis: compliance_state
    initial_state: COMPLIANT
    terminal_states: []
    shape: parallel
    transitions:
      - from: COMPLIANT
        to: OVERDUE
        trigger: "POST /water-service/maintenance-plans/{maintenance_plan_id}/evaluate-compliance"
        actor: PlatformAdmin
        preconditions:
          - "compliance_state == COMPLIANT"
          - "MaintenancePlan.status == ACTIVE"
          - "clock > next_due_at (strictly greater)"
        side_effects:
          - "LATCHES overdue_latched_at to the logical clock; this latch is NOT cleared by any later interval recomputation, only by a qualifying MaintenanceVisit"
          - "increments MaintenancePlan.version by 1"
      - from: OVERDUE
        to: COMPLIANT
        trigger: "system: a MaintenanceVisit with visit_kind FILTER_ONLY or SALT_AND_FILTER is created (CASCADE-C-3 hop 6)"
        actor: system
        preconditions: ["compliance_state == OVERDUE"]
        side_effects:
          - "clears overdue_latched_at to null"
          - "increments MaintenancePlan.version by 1"
        note: "A SALT_ONLY or SERVICE_ONLY visit advances last_service_date and next_due_at but does NOT clear the latch (friction FR-10)."

concurrency_rules:
  - rule_id: treatment-recommendation-create-stale-profile
    parent_entity: WellProfile
    write_endpoint: "POST /water-service/well-profiles/{well_profile_id}/treatment-recommendations"
    occ_field: "expected_well_profile_version"
    description: |
      Creating a TreatmentRecommendation for a well whose version has advanced since
      the client last read it is rejected. A new recommendation legitimately
      supersedes the prior one, so a second sequential create would otherwise succeed
      on its own terms; the stale-version check is what stops a writer from
      superseding a recommendation it never saw, for instance one authored after a
      confirmatory retest moved the well to UNSAFE.
    error_id: ERR_STALE_WELL_PROFILE_VERSION
    http_status: 412
  - rule_id: quote-line-add-stale-quote
    parent_entity: Quote
    write_endpoint: "POST /water-service/quotes/{quote_id}/lines"
    occ_field: "expected_quote_version"
    description: |
      Adding a line to a quote whose version has advanced since the client last read
      it is rejected. Adding lines is legitimately repeatable, so a second sequential
      add would succeed under the natural product semantics; the stale-version check
      is what stops an estimator from appending to a line set that a permit condition
      has already reshaped.
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412
  - rule_id: payment-record-stale-invoice
    parent_entity: Invoice
    write_endpoint: "POST /water-service/invoices/{invoice_id}/payments"
    occ_field: "expected_invoice_version"
    description: |
      Recording a payment against an invoice whose version has advanced since the
      client last read it is rejected. Part payments are legitimately repeatable
      (ISSUED -> PARTIALLY_PAID -> PARTIALLY_PAID), so a second sequential payment
      would succeed on its own terms; the stale-version check is what stops a clerk
      from posting against an outstanding amount it never observed.
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412
  - rule_id: salt-delivery-stale-plan
    parent_entity: MaintenancePlan
    write_endpoint: "POST /water-service/maintenance-plans/{maintenance_plan_id}/salt-deliveries"
    occ_field: "expected_maintenance_plan_version"
    description: |
      Recording a salt delivery against a plan whose version has advanced since the
      client last read it is rejected. Deliveries are legitimately repeatable and top
      up the same brine tank, so a second sequential delivery would succeed under the
      natural product semantics; the stale-version check is what stops a driver from
      topping up against a remaining-pounds figure it never observed.
    error_id: ERR_STALE_MAINTENANCE_PLAN_VERSION
    http_status: 412

calculations:
  - name: labor_time_band
    trigger: "Whenever a labor rate is derived: quote pricing (from Quote.estimated_start_at) and work-order completion (from WorkOrder.actual_start_at)."
    algorithm: threshold
    formula: |
      dow = ISO weekday of the instant in UTC (1 = Monday ... 7 = Sunday)
      if dow >= 6: return "WEEKEND"                # Saturday or Sunday, any hour
      h = UTC hour of the instant (0..23)
      if 8 <= h < 17:  return "STANDARD"           # [08:00, 17:00)
      if 17 <= h < 22: return "EVENING"            # [17:00, 22:00)
      return "NIGHT"                               # [22:00, 24:00) or [00:00, 08:00)
    input_set: "The single instant supplied by the caller of this calculation. No entity filtering."
    constants:
      STANDARD_START_HOUR_UTC: 8
      STANDARD_END_HOUR_UTC: 17
      EVENING_END_HOUR_UTC: 22
      WEEKEND_ISO_WEEKDAYS: [6, 7]
    precision: "Band selection only; no rounding."
    notes: "WEEKEND takes precedence over every hour band. Boundaries: 08:00:00.000Z is STANDARD, 17:00:00.000Z is EVENING, 22:00:00.000Z is NIGHT."

  - name: labor_rate_cents_per_hour
    trigger: "Immediately after labor_time_band, on both pipelines (shared rung L2)."
    algorithm: tiered_pricing
    formula: |
      base = LABOR_BASE_RATE_CENTS_PER_HOUR[tier]
      mult = TIME_BAND_MULTIPLIER[band]
      rate = round_half_up(base * mult)            # ROUND HERE, to whole cents
      return rate
    input_set: "tier is Quote.quoted_technician_tier for the estimate variant and Technician.tier of WorkOrder.assigned_technician_id for the final variant."
    constants:
      LABOR_BASE_RATE_CENTS_PER_HOUR:
        APPRENTICE: 6500
        JOURNEYMAN: 9500
        MASTER: 13500
      TIME_BAND_MULTIPLIER:
        STANDARD: 1.00
        EVENING: 1.35
        NIGHT: 1.75
        WEEKEND: 1.50
    precision: "Whole cents, round_half_up, applied to the rate BEFORE it is multiplied by hours."
    worked_examples:
      - "JOURNEYMAN on EVENING: round_half_up(9500 * 1.35) = round_half_up(12825.0) = 12825"
      - "MASTER on WEEKEND: round_half_up(13500 * 1.50) = 20250"
      - "APPRENTICE on NIGHT: round_half_up(6500 * 1.75) = round_half_up(11375.0) = 11375"

  - name: billable_minutes
    trigger: "POST /water-service/work-orders/{work_order_id}/complete (final variant); quote pricing uses Quote.estimated_labor_minutes through the same formula."
    algorithm: threshold
    formula: |
      rounded = ceil(raw_minutes / BILLING_INCREMENT_MINUTES) * BILLING_INCREMENT_MINUTES
      floored = max(rounded, MIN_BILLABLE_MINUTES)
      if pipeline == "EMERGENCY" and EmergencyTicket.cause_class == "NON_WELL_CAUSE":
          return min(floored, NON_WELL_CAUSE_LABOR_CAP_MINUTES)
      return floored
    input_set: "raw_minutes is WorkOrder.actual_labor_minutes for the final variant and Quote.estimated_labor_minutes for the estimate variant. The NON_WELL_CAUSE cap NEVER applies to the estimate variant."
    constants:
      BILLING_INCREMENT_MINUTES: 15
      MIN_BILLABLE_MINUTES: 60
      NON_WELL_CAUSE_LABOR_CAP_MINUTES: 60
    precision: "Whole minutes."
    worked_examples:
      - "raw 0 -> ceil(0/15)*15 = 0 -> max(0,60) = 60"
      - "raw 46 -> ceil(46/15)*15 = 60 -> max(60,60) = 60"
      - "raw 61 -> ceil(61/15)*15 = 75 -> 75"
      - "raw 200 with NON_WELL_CAUSE -> ceil(200/15)*15 = 210 -> max = 210 -> min(210,60) = 60"

  - name: labor_charge_cents
    trigger: "Shared rung L3, both pipelines: quote pricing and work-order completion."
    algorithm: tiered_pricing
    formula: |
      rate = labor_rate_cents_per_hour(...)        # already rounded to cents
      mins = billable_minutes(...)
      return round_half_up(rate * mins / 60)
    input_set: "One work order or one quote."
    constants: {}
    precision: |
      Two-step rounding, order PINNED: the hourly rate is rounded to whole cents
      FIRST (in labor_rate_cents_per_hour), then multiplied by minutes/60 and rounded
      to whole cents a SECOND time. Computing base * mult * mins / 60 in one
      expression and rounding once is a DIFFERENT and incorrect result.
    worked_examples:
      - "JOURNEYMAN, EVENING, raw 100 min: rate 12825; mins ceil(100/15)*15 = 105; charge round_half_up(12825*105/60) = round_half_up(22443.75) = 22444"
      - "One-step (wrong) comparison for the same inputs: round_half_up(9500*1.35*105/60) = round_half_up(22443.75) = 22444 - identical here"
      - "APPRENTICE, NIGHT, raw 70 min: rate 11375; mins 75; charge round_half_up(11375*75/60) = round_half_up(14218.75) = 14219. One-step: round_half_up(6500*1.75*75/60) = round_half_up(14218.75) = 14219"
      - "MASTER, EVENING, raw 130 min: rate round_half_up(13500*1.35) = round_half_up(18225.0) = 18225; mins 135; charge round_half_up(18225*135/60) = round_half_up(41006.25) = 41006"

  - name: parts_markup_pct
    trigger: "Shared rung L4: quote pricing pins it per line; parts posting recomputes it per consumption entry."
    algorithm: tiered_pricing
    formula: |
      c = unit_cost_cents
      if c <= 5000:   return 0.60
      if c <= 25000:  return 0.40
      if c <= 100000: return 0.28
      return 0.18
    input_set: "The single unit cost of one catalog part: QuoteLine.unit_cost_cents_pinned or PartsConsumptionEntry.unit_cost_cents_snapshot."
    constants:
      PARTS_MARKUP_BAND_1_MAX_CENTS: 5000
      PARTS_MARKUP_BAND_1_PCT: 0.60
      PARTS_MARKUP_BAND_2_MAX_CENTS: 25000
      PARTS_MARKUP_BAND_2_PCT: 0.40
      PARTS_MARKUP_BAND_3_MAX_CENTS: 100000
      PARTS_MARKUP_BAND_3_PCT: 0.28
      PARTS_MARKUP_BAND_4_PCT: 0.18
    precision: "Band selection; all upper bounds are INCLUSIVE (<=). The markup is FLAT on the whole unit cost, not marginal."
    non_monotone: |
      NON-MONOTONE IN unit_cost_cents. Because the band is flat rather than marginal,
      a MORE expensive part can carry a LOWER marked-up price:
        5000  -> round_half_up(5000  * 1.60) = 8000
        5001  -> round_half_up(5001  * 1.40) = round_half_up(7001.4)   = 7001   (LOWER)
        25000 -> round_half_up(25000 * 1.40) = 35000
        25001 -> round_half_up(25001 * 1.28) = round_half_up(32001.28) = 32001  (LOWER)
        100000  -> round_half_up(100000 * 1.28) = 128000
        100001  -> round_half_up(100001 * 1.18) = round_half_up(118001.18) = 118001 (LOWER)

  - name: parts_unit_price_cents
    trigger: "Shared rung L5."
    algorithm: tiered_pricing
    formula: |
      return round_half_up(unit_cost_cents * (1 + parts_markup_pct(unit_cost_cents)))
    input_set: "One line or one consumption entry."
    constants: {}
    precision: "Whole cents, round_half_up, applied PER UNIT before extension."

  - name: parts_extended_price_cents
    trigger: "Shared rung L6."
    algorithm: aggregation
    formula: |
      return parts_unit_price_cents(unit_cost_cents) * quantity
    input_set: "One line or one consumption entry."
    constants: {}
    precision: |
      ROUNDING ORDER PINNED (Rule 2 mode b): round PER UNIT, then multiply by
      quantity, then SUM the already-rounded line extensions. Summing unrounded unit
      prices and rounding the sum is a DIFFERENT and incorrect result.
    worked_examples:
      - "unit_cost 5001, qty 3: unit price 7001; extended 21003. Sum-then-round would give round_half_up(5001*1.40*3) = round_half_up(21004.2) = 21004 - one cent apart."
      - "unit_cost 25001, qty 7: unit price 32001; extended 224007. Sum-then-round: round_half_up(25001*1.28*7) = round_half_up(224008.96) = 224009."

  - name: parts_subtotal_cents
    trigger: "Quote pricing and invoice construction."
    algorithm: aggregation
    formula: |
      return sum(extended_price_cents of every row in the input set)
    input_set: |
      For a Quote: every QuoteLine whose status == ACTIVE, ordered by created_at ASC.
      For an Invoice: every PartsConsumptionEntry on the work order whose status ==
      POSTED, ordered by posted_at ASC then created_at ASC.
      REMOVED, SUPERSEDED, SUPERSEDED_BY_YIELD lines and REVERSED entries are excluded.
    constants: {}
    precision: "Whole cents; the addends are already rounded."

  - name: trip_fee_cents
    trigger: "Emergency invoice construction; also sets Property.service_zone at property creation and on every read of the property."
    algorithm: threshold
    formula: |
      d = Property.distance_miles
      if d <= 15.0: zone = "ZONE_1"; fee = 8500
      elif d <= 35.0: zone = "ZONE_2"; fee = 12500
      elif d <= 60.0: zone = "ZONE_3"; fee = 18000
      else: zone = "OUT_OF_AREA"; fee = 0        # triage is refused, ERR_OUT_OF_SERVICE_AREA
      return (zone, fee)
    input_set: "One property."
    constants:
      TRIP_FEE_ZONE_1_MAX_MILES: 15.0
      TRIP_FEE_ZONE_1_CENTS: 8500
      TRIP_FEE_ZONE_2_MAX_MILES: 35.0
      TRIP_FEE_ZONE_2_CENTS: 12500
      TRIP_FEE_ZONE_3_MAX_MILES: 60.0
      TRIP_FEE_ZONE_3_CENTS: 18000
    precision: "All zone upper bounds INCLUSIVE. 15.0 is ZONE_1, 15.01 is ZONE_2, 60.0 is ZONE_3, 60.01 is OUT_OF_AREA."

  - name: no_water_severity_score
    trigger: "POST /water-service/emergency-tickets/{emergency_ticket_id}/diagnosis (rung L14)."
    algorithm: weighted_scoring
    formula: |
      cause_pts     = CAUSE_POINTS[EmergencyTicket.cause_class]
      outage_pts    = min(OUTAGE_POINTS_MAX, floor(EmergencyTicket.reported_outage_hours) * OUTAGE_POINTS_PER_HOUR)
      household_pts = min(HOUSEHOLD_POINTS_MAX, Property.household_size * HOUSEHOLD_POINTS_PER_PERSON)
      vuln_pts      = VULNERABLE_OCCUPANT_POINTS if Property.has_vulnerable_occupant else 0
      return min(SEVERITY_MAX, cause_pts + outage_pts + household_pts + vuln_pts)
    input_set: "One emergency ticket plus its property. No other tickets participate."
    constants:
      CAUSE_POINTS:
        WELL_DRY: 45
        PUMP_FAILURE: 40
        PRESSURE_TANK_FAILURE: 30
        CONTROL_FAILURE: 25
        TREATMENT_FAILURE: 20
        NON_WELL_CAUSE: 5
      OUTAGE_POINTS_PER_HOUR: 3
      OUTAGE_POINTS_MAX: 30
      HOUSEHOLD_POINTS_PER_PERSON: 3
      HOUSEHOLD_POINTS_MAX: 15
      VULNERABLE_OCCUPANT_POINTS: 10
      SEVERITY_MAX: 100
    precision: "Integer. floor() on reported_outage_hours discards the fractional hour."
    worked_examples:
      - "CONTROL_FAILURE, 3.9 h, household 5, vulnerable true: 25 + min(30, 3*3=9) + min(15, 15) + 10 = 59"
      - "PRESSURE_TANK_FAILURE, 5.0 h, household 5, vulnerable false: 30 + 15 + 15 + 0 = 60"
      - "PUMP_FAILURE, 6.0 h, household 4, vulnerable false: 40 + 18 + 12 + 0 = 70"
      - "NON_WELL_CAUSE, 2.0 h, household 3, vulnerable false: 5 + 6 + 9 + 0 = 20"
      - "WELL_DRY, 40.0 h, household 12, vulnerable true: 45 + 30 + 15 + 10 = 100 (capped)"

  - name: emergency_surcharge_tier_cents
    trigger: "Immediately after no_water_severity_score (rung L15)."
    algorithm: threshold
    formula: |
      s = severity_score
      if s <= 29: return 7000                     # band LOW,  [0, 29]
      if s <= 59: return 14000                    # band MID,  [30, 59]
      return 24000                                # band HIGH, [60, 100]
    input_set: "The severity score of one ticket."
    constants:
      SEVERITY_BAND_LOW_MAX: 29
      SURCHARGE_LOW_CENTS: 7000
      SEVERITY_BAND_MID_MAX: 59
      SURCHARGE_MID_CENTS: 14000
      SURCHARGE_HIGH_CENTS: 24000
    precision: "Band upper bounds INCLUSIVE."

  - name: membership_surcharge_credit_cents
    trigger: "Immediately after emergency_surcharge_tier_cents (rung L16)."
    algorithm: threshold
    formula: |
      tier = EmergencyTicket.membership_tier_at_intake
      if tier == "PREMIER":
          if severity_score >= PREMIER_CREDIT_MIN_SEVERITY:   # >= 60, INCLUSIVE
              return min(surcharge, PREMIER_CREDIT_CENTS)
          return 0
      if tier == "SELECT":
          return min(surcharge, SELECT_CREDIT_CENTS)
      return 0
    input_set: "One ticket's severity score, gross surcharge and latched membership tier."
    constants:
      PREMIER_CREDIT_MIN_SEVERITY: 60
      PREMIER_CREDIT_CENTS: 20000
      SELECT_CREDIT_CENTS: 5000
      NONE_CREDIT_CENTS: 0
    precision: "Whole cents. The PREMIER credit unlocks at severity 60 EXACTLY (>=)."

  - name: net_dispatch_charge_cents
    trigger: "Immediately after membership_surcharge_credit_cents (rung L17)."
    algorithm: threshold
    formula: |
      if EmergencyTicket.cause_class == "NON_WELL_CAUSE":
          return 0                                 # SEAM-05: the basis collapses to the trip fee alone
      return max(0, surcharge - credit)
    input_set: "One ticket."
    constants: {}
    precision: "Whole cents, floored at 0."
    non_monotone: |
      NON-MONOTONE COMPOSED CHAIN of four calculations
      (no_water_severity_score -> emergency_surcharge_tier_cents ->
       membership_surcharge_credit_cents -> net_dispatch_charge_cents),
      non-monotone in severity_score for a PREMIER account:
        severity 29 -> surcharge  7000, credit     0 -> net  7000
        severity 30 -> surcharge 14000, credit     0 -> net 14000   (rises)
        severity 59 -> surcharge 14000, credit     0 -> net 14000
        severity 60 -> surcharge 24000, credit 20000 -> net  4000   (FALLS)
        severity 100 -> surcharge 24000, credit 20000 -> net 4000
      For a SELECT account the same chain is monotone non-decreasing:
        29 -> 2000, 30 -> 9000, 59 -> 9000, 60 -> 19000, 100 -> 19000.
      For a NONE account: 29 -> 7000, 30 -> 14000, 60 -> 24000.

  - name: emergency_response_minutes
    trigger: "POST /water-service/emergency-tickets/{emergency_ticket_id}/dispatch."
    algorithm: aggregation
    formula: |
      return floor((dispatched_at - intake_at) total seconds / 60)
    input_set: "One ticket."
    constants: {}
    precision: "Whole minutes, floor. Reported for operational metrics only; it does NOT feed the surcharge."

  - name: emergency_preauth_cap_cents
    trigger: "POST /water-service/emergency-tickets/{emergency_ticket_id}/diagnosis (rung L18)."
    algorithm: threshold
    formula: |
      return PREAUTH_CAP_CENTS[EmergencyTicket.membership_tier_at_intake]
    input_set: "One ticket."
    constants:
      PREAUTH_CAP_CENTS:
        NONE: 75000
        SELECT: 100000
        PREMIER: 150000
    precision: "Whole cents."

  - name: authorization_requirement_decision
    trigger: "POST /water-service/emergency-tickets/{emergency_ticket_id}/diagnosis (rung L19)."
    algorithm: threshold
    formula: |
      if onsite_estimate_cents > preauth_cap_cents:   # STRICTLY greater
          return "PENDING"
      return "PRE_AUTHORIZED"
    input_set: "One ticket."
    constants: {}
    precision: "An estimate EXACTLY equal to the cap is PRE_AUTHORIZED; one cent more is PENDING."

  - name: well_yield_pump_eligibility
    trigger: "POST /water-service/quotes/{quote_id}/lines when the part category is PUMP (rung L10), and re-evaluated at quote approval (rung L61)."
    algorithm: threshold
    formula: |
      if PartCatalogItem.rated_gpm < MIN_PUMP_GPM:            # STRICTLY less
          return "REJECT_TOO_SMALL"
      if WellProfile.measured_yield_gpm is null:
          return "REJECT_NO_INSPECTION"
      if PartCatalogItem.rated_gpm <= WellProfile.measured_yield_gpm * YIELD_SAFETY_FACTOR:
          return "OK"
      return "REJECT_EXCEEDS_YIELD"
    input_set: "One catalog part and one well profile."
    constants:
      YIELD_SAFETY_FACTOR: 0.80
      MIN_PUMP_GPM: 5.0
    precision: |
      The yield comparison is INCLUSIVE: a pump rated exactly at
      measured_yield_gpm * 0.80 is quotable. With measured_yield_gpm 12.5 the
      threshold is exactly 10.0, so a 10.0 GPM pump passes and a 10.1 GPM pump fails.
      REJECT_TOO_SMALL and REJECT_EXCEEDS_YIELD both raise
      ERR_YIELD_INSUFFICIENT_FOR_PUMP at line creation; REJECT_NO_INSPECTION raises
      ERR_INSPECTION_REQUIRED.

  - name: technician_tier_scope_gate
    trigger: "POST /water-service/work-orders/{work_order_id}/schedule (G6, rung L30)."
    algorithm: threshold
    formula: |
      allowed = SCOPE_MIN_TIER[WorkOrder.scope]
      return Technician.tier in allowed
    input_set: "One work order and its assigned technician."
    constants:
      SCOPE_MIN_TIER:
        NEW_WELL: [MASTER]
        PUMP_REPLACEMENT: [MASTER]
        TREATMENT_INSTALL: [JOURNEYMAN, MASTER]
        PRESSURE_TANK: [APPRENTICE, JOURNEYMAN, MASTER]
        REPAIR: [APPRENTICE, JOURNEYMAN, MASTER]
        MAINTENANCE: [APPRENTICE, JOURNEYMAN, MASTER]
    precision: "Set membership; failure raises ERR_TECHNICIAN_TIER_INSUFFICIENT at G6."

  - name: technician_window_overlap
    trigger: "POST /water-service/work-orders/{work_order_id}/schedule (G9, overlap rule TO-1)."
    algorithm: interval_merge
    formula: |
      new_lo  = candidate.scheduled_start_at - TRAVEL_BUFFER_MINUTES minutes
      new_hi  = candidate.scheduled_end_at   + TRAVEL_BUFFER_MINUTES minutes
      for each other WorkOrder w with the same assigned_technician_id and
          w.fulfillment_status in {SCHEDULED, IN_PROGRESS} and w.id != candidate.id,
          ordered by w.scheduled_start_at ASC then w.created_at ASC:
          if new_lo < w.scheduled_end_at and w.scheduled_start_at < new_hi:
              return CONFLICT with w
      return OK
    input_set: "Every other WorkOrder of the same technician whose fulfillment_status is SCHEDULED or IN_PROGRESS. DRAFT, HELD, COMPLETED and CANCELLED work orders are excluded."
    constants:
      TRAVEL_BUFFER_MINUTES: 45
    precision: |
      HALF-OPEN interval geometry [start, end) with a symmetric 45-minute buffer on
      the CANDIDATE only. Two windows that merely touch (candidate end == existing
      start) DO conflict, because the buffer pushes new_hi 45 minutes past the touch
      point. A candidate that starts exactly 45 minutes after an existing window ends
      does NOT conflict: new_lo == w.scheduled_end_at fails the strict `<` test.
    worked_examples:
      - "Existing 2026-06-01T09:00Z..11:00Z. Candidate 11:00Z..12:00Z -> new_lo 10:15Z < 11:00Z and 09:00Z < 12:45Z -> CONFLICT."
      - "Existing 2026-06-01T09:00Z..11:00Z. Candidate 11:45Z..12:45Z -> new_lo 11:00Z, test 11:00Z < 11:00Z is false -> OK."

  - name: well_daily_work_order_cap
    trigger: "POST /water-service/work-orders/{work_order_id}/schedule (G9, overlap rule TO-2)."
    algorithm: aggregation
    formula: |
      day = the UTC calendar date of candidate.scheduled_start_at
      n = count of other WorkOrder w with w.well_profile_id == candidate.well_profile_id
          and w.fulfillment_status in {SCHEDULED, IN_PROGRESS}
          and UTC calendar date of w.scheduled_start_at == day
          and w.id != candidate.id
      return CONFLICT if n >= WELL_DAILY_WORK_ORDER_CAP else OK
    input_set: "Every other SCHEDULED or IN_PROGRESS work order on the same well."
    constants:
      WELL_DAILY_WORK_ORDER_CAP: 1
    precision: |
      DAY-BUCKET capacity geometry, deliberately different from TO-1's buffered
      interval geometry. Only the start instant's UTC date matters; a work order that
      runs across midnight counts only against its start date. Both day boundaries
      belong to the day: 00:00:00.000Z and 23:59:59.999Z are the same bucket.
      Failure raises ERR_WELL_SERVICE_WINDOW_CONFLICT.

  - name: duty_cycle_ratio
    trigger: "Inspection completion (CASCADE-C-1 hop 2), pressure-tank replacement, and work-order completion when a PRESSURE_TANK part was finalised (CASCADE-C-3 hop 5)."
    algorithm: constraint_propagation
    formula: |
      d = max(WellProfile.pressure_tank_drawdown_gallons, MIN_DRAWDOWN_GALLONS)
      return round_half_up(PEAK_DEMAND_GAL_PER_HOUR / d, 2)
    input_set: "One well profile."
    constants:
      PEAK_DEMAND_GAL_PER_HOUR: 30
      MIN_DRAWDOWN_GALLONS: 1.0
    precision: "Two decimal places, round_half_up."
    worked_examples:
      - "drawdown 12.0 -> 30/12 = 2.50"
      - "drawdown 10.0 -> 3.00"
      - "drawdown 6.0 -> 5.00"
      - "drawdown 5.0 -> 6.00"
      - "drawdown 4.0 -> 7.50"

  - name: duty_cycle_class
    trigger: "Immediately after duty_cycle_ratio."
    algorithm: threshold
    formula: |
      r = duty_cycle_ratio
      if r <= 3.00: return "LOW"
      if r <= 6.00: return "MODERATE"
      return "HIGH"
    input_set: "One well profile."
    constants:
      DUTY_LOW_MAX_RATIO: 3.00
      DUTY_MODERATE_MAX_RATIO: 6.00
    precision: "Band upper bounds INCLUSIVE. drawdown 10.0 gives ratio exactly 3.00 -> LOW; drawdown 5.0 gives exactly 6.00 -> MODERATE; drawdown 4.99 gives 6.01 -> HIGH."

  - name: maintenance_interval_days
    trigger: "Plan creation (as_designed), and every duty-cycle or treatment-media change (as_operated)."
    algorithm: threshold
    formula: |
      base      = BASE_INTERVAL_DAYS[duty_cycle_class]
      reduction = MEDIA_INTERVAL_REDUCTION_DAYS[media]
      return max(MIN_MAINTENANCE_INTERVAL_DAYS, base - reduction)
    input_set: "One well profile and one plan."
    constants:
      BASE_INTERVAL_DAYS:
        LOW: 365
        MODERATE: 270
        HIGH: 180
      MEDIA_INTERVAL_REDUCTION_DAYS:
        NONE: 0
        SEDIMENT: 30
        CARBON: 90
        SOFTENER_RESIN: 0
      MIN_MAINTENANCE_INTERVAL_DAYS: 120
    precision: "Whole days."
    variants:
      - name: as_designed
        when: "Computed once at MaintenancePlan creation from the duty_cycle_class and treatment_media in force at that instant, then FROZEN into interval_days_as_designed."
        difference: "Never recomputed. A later pressure-tank replacement leaves it untouched."
      - name: as_operated
        when: "Recomputed into interval_days_as_operated on every duty-cycle or media change, and it alone drives next_due_at."
        difference: |
          DUAL VARIANT: for the same well the two variants disagree whenever the duty
          cycle or the media changed after plan creation. Example: plan created while
          duty_cycle_class == MODERATE and media == NONE gives
          interval_days_as_designed = 270; a pressure-tank replacement that drops
          drawdown to 4.0 raises the ratio to 7.50 -> HIGH, so
          interval_days_as_operated = 180. Same plan, same well, 90 days apart.
    worked_examples:
      - "LOW + NONE -> 365"
      - "MODERATE + NONE -> 270"
      - "HIGH + NONE -> 180"
      - "LOW + CARBON -> 275"
      - "MODERATE + CARBON -> 180"
      - "HIGH + CARBON -> max(120, 90) = 120 (the floor binds)"
      - "HIGH + SEDIMENT -> 150"

  - name: maintenance_next_due_at
    trigger: "Every recomputation of interval_days_as_operated and every MaintenanceVisit."
    algorithm: aggregation
    formula: |
      return MaintenancePlan.last_service_date + interval_days_as_operated days
    input_set: "One plan. last_service_date is the performed_at of the most recent MaintenanceVisit of ANY visit_kind, or the plan's created_at when no visit exists (friction FR-10 pins this reading)."
    constants: {}
    precision: "Whole days added to an instant; the time-of-day component is preserved."

  - name: filter_next_due_date
    trigger: "POST /water-service/maintenance-plans/{maintenance_plan_id}/filter-change, and whenever filter_media changes."
    algorithm: aggregation
    formula: |
      if MaintenancePlan.filter_media == "NONE": return null
      if MaintenancePlan.last_filter_change_date is null: return null
      return last_filter_change_date + FILTER_INTERVAL_DAYS[filter_media] days
    input_set: "One plan."
    constants:
      FILTER_INTERVAL_DAYS:
        SEDIMENT: 90
        CARBON: 180
        SOFTENER_RESIN: 1825
      FILTER_MIN_DAYS_BETWEEN_CHANGES: 30
    precision: |
      TIME-DRIVEN clock (SEAM-04). A filter change recorded fewer than
      FILTER_MIN_DAYS_BETWEEN_CHANGES days after the previous one is refused with
      ERR_FILTER_CHANGE_TOO_SOON; exactly 30 days is ALLOWED (the test is
      strictly-less-than 30).

  - name: salt_next_due_date
    trigger: "POST /water-service/maintenance-plans/{maintenance_plan_id}/salt-deliveries, and whenever monthly_salt_lbs changes."
    algorithm: decay_function
    formula: |
      if MaintenancePlan.monthly_salt_lbs <= 0.0: return null
      if MaintenancePlan.last_salt_delivery_date is null: return null
      surplus = MaintenancePlan.salt_remaining_lbs - SALT_REORDER_THRESHOLD_LBS
      days = 0 if surplus <= 0.0 else floor(surplus * 30 / monthly_salt_lbs)
      return last_salt_delivery_date + days days
    input_set: "One plan."
    constants:
      SALT_REORDER_THRESHOLD_LBS: 40
      SALT_TANK_CAPACITY_LBS: 300
      SALT_DELIVERY_MIN_LBS: 40
    precision: |
      CONSUMPTION-DRIVEN clock (SEAM-04), deliberately anchored on the delivery date
      rather than on the logical clock so the value is reproducible. A delivery that
      would push salt_remaining_lbs above SALT_TANK_CAPACITY_LBS is refused with
      ERR_SALT_DELIVERY_EXCEEDS_CAPACITY; landing EXACTLY on 300.0 is allowed.
      A delivery smaller than SALT_DELIVERY_MIN_LBS is refused with ERR_VALIDATION;
      exactly 40.0 lbs is allowed.
    worked_examples:
      - "remaining 300.0, monthly 64.3: surplus 260.0, days = floor(260.0*30/64.3) = floor(121.30) = 121"
      - "remaining 100.0, monthly 25.7: surplus 60.0, days = floor(60.0*30/25.7) = floor(70.03) = 70"
      - "remaining 40.0, monthly 64.3: surplus 0.0, days = 0 -> due on the delivery date itself"

  - name: water_test_hold_time_validity
    trigger: "POST /water-service/water-tests/{water_test_id}/lab-result."
    algorithm: threshold
    formula: |
      elapsed_hours = (analyzed_at - sample_datetime) total seconds / 3600
      limit = HOLD_TIME_HOURS[WaterTest.panel_type]
      return 0 <= elapsed_hours <= limit
    input_set: "One water test."
    constants:
      HOLD_TIME_HOURS:
        BACTERIOLOGICAL: 30
        CHEMICAL: 336
    precision: |
      RIGHT-CLOSED. Exactly 30.0 hours on a bacteriological sample is VALID;
      30 hours and one second is INVALID_HOLD_TIME. A negative elapsed time
      (analyzed before sampled) raises ERR_INVALID_DATE_RANGE at G8.

  - name: bacteriological_retest_window_check
    trigger: "POST /water-service/water-tests/{water_test_id}/confirmatory-result (G6)."
    algorithm: threshold
    formula: |
      delta_days = (confirm_sample_datetime - parent.sample_datetime) total seconds / 86400
      return 0 <= delta_days <= RETEST_WINDOW_DAYS
    input_set: "The presumptive-positive parent test and the confirmatory sample instant supplied in the body."
    constants:
      RETEST_WINDOW_DAYS: 21
    precision: |
      RIGHT-CLOSED. A confirmatory sample drawn exactly 21 days (1814400 seconds)
      after the parent sample is IN window; one second later raises
      ERR_RETEST_WINDOW_EXPIRED at G6.

  - name: recommended_media_selection
    trigger: "POST /water-service/well-profiles/{well_profile_id}/treatment-recommendations."
    algorithm: topological
    formula: |
      # EVALUATION ORDER IS PINNED - the first matching clause wins.
      t = the source WaterTest
      if t.hardness_gpg is not null and t.hardness_gpg >= HARDNESS_TREATMENT_TRIGGER_GPG:
          return "SOFTENER_RESIN"
      if t.iron_mg_l is not null and t.iron_mg_l > IRON_MCL_MG_L:
          return "SEDIMENT"
      if (t.nitrate_mg_l  is not null and t.nitrate_mg_l  > NITRATE_MCL_MG_L) or \
         (t.arsenic_mg_l  is not null and t.arsenic_mg_l  > ARSENIC_MCL_MG_L) or \
         (t.lead_mg_l     is not null and t.lead_mg_l     > LEAD_MCL_MG_L):
          return "CARBON"
      return null                                   # ERR_NO_TREATMENT_INDICATED
    input_set: "Exactly one WaterTest, which MUST have panel_type CHEMICAL and result_status ANALYZED_CHEMICAL_EXCEEDANCE."
    constants:
      HARDNESS_TREATMENT_TRIGGER_GPG: 7.0
      IRON_MCL_MG_L: 0.30
      NITRATE_MCL_MG_L: 10.0
      ARSENIC_MCL_MG_L: 0.010
      LEAD_MCL_MG_L: 0.015
    precision: |
      Hardness uses >= (7.0 gpg exactly triggers a softener); every MCL uses > (an
      analyte exactly at its MCL does NOT trigger). The clause order is what makes
      the result well defined for a sample that trips several thresholds at once.

  - name: softener_design_grains
    trigger: "Immediately after recommended_media_selection returns SOFTENER_RESIN."
    algorithm: aggregation
    formula: |
      daily_grains  = WaterTest.hardness_gpg * Property.household_size * WATER_USE_GAL_PER_PERSON_PER_DAY
      design_grains = round_half_up(daily_grains * REGEN_INTERVAL_DAYS)
      return design_grains
    input_set: "One water test and the property behind the well."
    constants:
      WATER_USE_GAL_PER_PERSON_PER_DAY: 75
      REGEN_INTERVAL_DAYS: 7
    precision: "Integer grains, round_half_up."
    worked_examples:
      - "hardness 20.0, household 5: daily 7500, design 52500"
      - "hardness 30.0, household 5: daily 11250, design 78750"
      - "hardness 31.0, household 5: daily 11625, design 81375"
      - "hardness 8.0, household 4: daily 2400, design 16800"

  - name: softener_capacity_selection
    trigger: "Immediately after softener_design_grains."
    algorithm: threshold
    formula: |
      g = design_grains
      if g <= 24000: return ("CAP_24000",      6)
      if g <= 32000: return ("CAP_32000",      9)
      if g <= 48000: return ("CAP_48000",     12)
      if g <= 64000: return ("CAP_64000",     15)
      if g <= 80000: return ("CAP_80000",     18)
      return ("DUAL_TANK_64000", 15)                # STEP-DOWN band (SEAM-10)
    input_set: "One design-grains figure."
    constants:
      SOFTENER_CAPACITY_TABLE:
        - { max_design_grains: 24000, capacity: CAP_24000, salt_lbs_per_regen: 6 }
        - { max_design_grains: 32000, capacity: CAP_32000, salt_lbs_per_regen: 9 }
        - { max_design_grains: 48000, capacity: CAP_48000, salt_lbs_per_regen: 12 }
        - { max_design_grains: 64000, capacity: CAP_64000, salt_lbs_per_regen: 15 }
        - { max_design_grains: 80000, capacity: CAP_80000, salt_lbs_per_regen: 18 }
        - { max_design_grains: null,  capacity: DUAL_TANK_64000, salt_lbs_per_regen: 15 }
    precision: "All band upper bounds INCLUSIVE. The final row has no upper bound."

  - name: softener_monthly_salt_lbs
    trigger: "Immediately after softener_capacity_selection."
    algorithm: decay_function
    formula: |
      return round_half_up(salt_lbs_per_regen * 30 / REGEN_INTERVAL_DAYS, 1)
    input_set: "One capacity selection."
    constants:
      REGEN_INTERVAL_DAYS: 7
    precision: "One decimal place, round_half_up."
    non_monotone: |
      NON-MONOTONE COMPOSED CHAIN of three calculations
      (softener_design_grains -> softener_capacity_selection ->
       softener_monthly_salt_lbs), non-monotone in hardness_gpg. With household_size 5
      the design grains are hardness * 2625:
        hardness 20.0 -> 52500 -> CAP_64000 -> 15 lbs/regen -> 64.3 lbs/month
        hardness 30.0 -> 78750 -> CAP_80000 -> 18 lbs/regen -> 77.1 lbs/month  (rises)
        hardness 31.0 -> 81375 -> DUAL_TANK_64000 -> 15 lbs/regen -> 64.3 lbs/month (FALLS)
      The step-down is real: a dual-tank unit alternates two 64000-grain resin beds,
      so each regeneration is smaller even though total capacity is larger.
    worked_examples:
      - "6 lbs/regen -> round_half_up(6*30/7, 1) = round_half_up(25.714..., 1) = 25.7"
      - "9  -> 38.6"
      - "12 -> 51.4"
      - "15 -> 64.3"
      - "18 -> 77.1"

  - name: treatment_recommendation_expires_at
    trigger: "TreatmentRecommendation creation."
    algorithm: aggregation
    formula: |
      return WaterTest.sample_datetime + RECOMMENDATION_VALIDITY_DAYS days
    input_set: "The single source water test (SEAM-07: NOT the recommendation's created_at)."
    constants:
      RECOMMENDATION_VALIDITY_DAYS: 180
    precision: "Whole days added to the sample instant."

  - name: treatment_recommendation_status_effective
    trigger: "Every read of a TreatmentRecommendation and the accept precondition."
    algorithm: projection
    formula: |
      if TreatmentRecommendation.status != "PROPOSED": return status
      if clock >= expires_at: return "EXPIRED"
      return "PROPOSED"
    input_set: "One recommendation and the logical clock."
    constants: {}
    precision: |
      AS-OF-EVALUATION-TIME semantics, HALF-OPEN window
      [sample_datetime, sample_datetime + 180 days): at exactly expires_at the
      recommendation is already EXPIRED. This value is MONOTONE in wall-clock
      progression because POST /water-service/_clock/set_current_utc refuses to move
      the clock backwards (ERR_CLOCK_BACKWARD), so once EXPIRED is observed it can
      never revert. Contrast MaintenancePlan.compliance_state, which is LATCHED at a
      transition and would otherwise be non-monotone: recomputing
      interval_days_as_operated can push next_due_at back into the future, and a
      naive as-of rule would silently un-overdue the plan. The latch forbids that -
      only a qualifying MaintenanceVisit clears it.

  - name: warranty_coverage_expires_at
    trigger: "WarrantyCoverage minting during CASCADE-C-3 hop 3."
    algorithm: aggregation
    formula: |
      days = PART_WARRANTY_DAYS if coverage_class == "PART" else LABOR_WARRANTY_DAYS
      return starts_at + days days
    input_set: "One coverage."
    constants:
      PART_WARRANTY_DAYS: 365
      LABOR_WARRANTY_DAYS: 90
    precision: "Whole days added to WorkOrder.actual_end_at (SEAM-06)."

  - name: warranty_coverage_state
    trigger: "Every read of a WarrantyCoverage and every callback-claim gate."
    algorithm: projection
    formula: |
      if WarrantyCoverage.status != "ACTIVE": return status
      if clock > expires_at: return "EXPIRED"          # STRICTLY greater
      return "ACTIVE"
    input_set: "One coverage and the logical clock."
    constants: {}
    precision: "RIGHT-CLOSED coverage: at exactly expires_at the coverage is still ACTIVE."

  - name: callback_window_eligibility
    trigger: "POST /water-service/work-orders/{work_order_id}/callback-claims (G9, rung L62)."
    algorithm: threshold
    formula: |
      cov  = the WarrantyCoverage named in the body
      days = floor((submitted_at - cov.starts_at) total seconds / 86400)
      limit = PART_WARRANTY_DAYS if complaint_class == "PART" else LABOR_WARRANTY_DAYS
      return "IN_WARRANTY" if (cov.coverage_state == "ACTIVE" and days <= limit) else "OUT_OF_WARRANTY"
    input_set: "One coverage and one claim."
    constants:
      PART_WARRANTY_DAYS: 365
      LABOR_WARRANTY_DAYS: 90
    precision: |
      RIGHT-CLOSED on days. A LABOR claim submitted exactly 90 days after the
      coverage started is IN_WARRANTY; 91 days is OUT_OF_WARRANTY and takes the
      mutate-then-reject path L62. The claim's complaint_class selects WHICH window
      applies, so a claim raised on day 200 is out of warranty as LABOR and in
      warranty as PART against the same completion date (SEAM-06).

  - name: permit_fee_cents
    trigger: "POST /water-service/permits/{permit_id}/file."
    algorithm: tiered_pricing
    formula: |
      tier = JURISDICTION_TIER[Permit.jurisdiction_code]
      base = PERMIT_BASE_FEE_CENTS[tier]
      mult = PERMIT_SCOPE_MULTIPLIER[Permit.scope]
      fee  = round_half_up(base * mult)
      if Permit.expedited: fee = fee + EXPEDITE_FEE_CENTS
      return fee
    input_set: "One permit. The jurisdiction is the WELL's, never the account's (SEAM-02)."
    constants:
      JURISDICTION_TIER:
        JUR_ALPHA: TIER_A
        JUR_BRAVO: TIER_B
        JUR_CHARLIE: TIER_C
        JUR_DELTA: TIER_B
      PERMIT_BASE_FEE_CENTS:
        TIER_A: 35000
        TIER_B: 22000
        TIER_C: 12000
      PERMIT_SCOPE_MULTIPLIER:
        NEW_WELL: 3.0
        PUMP_REPLACEMENT: 1.0
        PRESSURE_TANK: 0.5
        TREATMENT_INSTALL: 0.75
        REPAIR: 0.0
      EXPEDITE_FEE_CENTS: 15000
      PERMIT_REQUIRED_SCOPES: [NEW_WELL, PUMP_REPLACEMENT, PRESSURE_TANK, TREATMENT_INSTALL]
    precision: "Whole cents, round_half_up on the base*multiplier product BEFORE the flat expedite fee is added."
    worked_examples:
      - "JUR_ALPHA (TIER_A) + NEW_WELL, not expedited: round_half_up(35000*3.0) = 105000"
      - "JUR_CHARLIE (TIER_C) + TREATMENT_INSTALL, expedited: round_half_up(12000*0.75) = 9000, + 15000 = 24000"
      - "JUR_BRAVO (TIER_B) + PRESSURE_TANK, not expedited: round_half_up(22000*0.5) = 11000"
      - "JUR_DELTA (TIER_B) + REPAIR: round_half_up(22000*0.0) = 0 - and REPAIR is not in PERMIT_REQUIRED_SCOPES, so no permit is needed at all"

  - name: quote_total_cents
    trigger: "POST /water-service/quotes/{quote_id}/price."
    algorithm: aggregation
    formula: |
      parts  = parts_subtotal_cents(ACTIVE lines of this quote)
      band   = labor_time_band(Quote.estimated_start_at)
      rate   = labor_rate_cents_per_hour(Quote.quoted_technician_tier, band)
      mins   = billable_minutes(Quote.estimated_labor_minutes, pipeline="SCHEDULED")
      labor  = round_half_up(rate * mins / 60)
      permit = fee_cents of the Permit p with p.quote_id == this quote and
               p.status in {FILED, APPROVED, APPROVED_WITH_CONDITIONS},
               ordered by p.created_at ASC, first row; 0 when none
      tax    = round_half_up(parts * TAX_RATE_PCT / 100)
      total  = parts + labor + permit + tax
      return (parts, labor, permit, tax, total)
    input_set: "QuoteLine rows with status ACTIVE only, ordered by created_at ASC."
    constants:
      TAX_RATE_PCT: 7.25
    precision: |
      ROUNDING ORDER PINNED (Rule 2 mode b): per-unit price rounded -> extended per
      line -> summed -> tax computed on the summed parts subtotal and rounded once.
      LABOR IS NOT TAXABLE; the permit fee is NOT taxable. Only parts are.
    worked_examples:
      - |
        Quote with one line: part unit_cost 25001, qty 2 ->
        unit price round_half_up(25001*1.28) = 32001, extended 64002, parts 64002.
        estimated_start_at 2026-06-03T18:00Z (Wednesday, EVENING), tier JOURNEYMAN ->
        rate round_half_up(9500*1.35) = 12825; estimated_labor_minutes 100 ->
        billable 105; labor round_half_up(12825*105/60) = 22444.
        Permit: none -> 0. tax round_half_up(64002*7.25/100) = round_half_up(4640.145) = 4640.
        total = 64002 + 22444 + 0 + 4640 = 91086.

  - name: maintenance_visit_kind_selection
    trigger: "CASCADE-C-3 hop 5, once per ACTIVE MaintenancePlan on the well."
    algorithm: threshold
    formula: |
      entries       = the finalised (POSTED) PartsConsumptionEntry rows of the work order
      filter_touched = any entry whose PartCatalogItem.category == "FILTRATION"
      salt_touched   = any entry whose PartCatalogItem.category == "CONSUMABLE"
      if filter_touched and salt_touched: kind = "SALT_AND_FILTER"
      elif filter_touched:                kind = "FILTER_ONLY"
      elif salt_touched:                  kind = "SALT_ONLY"
      else:                               kind = "SERVICE_ONLY"
      salt_added_lbs = sum(entry.quantity for CONSUMABLE entries) * SALT_LBS_PER_CONSUMABLE_UNIT
      return (kind, salt_added_lbs, filter_touched)
    input_set: "The POSTED consumption entries of exactly one work order."
    constants:
      SALT_LBS_PER_CONSUMABLE_UNIT: 40.0
    precision: |
      SEAM-04: the two clocks are reset independently. salt_remaining_lbs is
      increased by salt_added_lbs (capped at SALT_TANK_CAPACITY_LBS) and
      last_salt_delivery_date set to performed_at when salt_touched;
      last_filter_change_date set to performed_at when filter_touched.
      compliance_state clears ONLY for SALT_AND_FILTER and FILTER_ONLY.

  - name: warranty_credit_cents
    trigger: "CASCADE-C-3 hop 7, only when the completing WorkOrder.origin_callback_claim_id is set."
    algorithm: threshold
    formula: |
      claim = the CallbackClaim named by WorkOrder.origin_callback_claim_id
      orig  = claim.original_work_order_id
      part_cov  = the WarrantyCoverage on orig with coverage_class PART and
                  status ACTIVE or SUPERSEDED, ordered by created_at ASC, first row
      labor_cov = the WarrantyCoverage on orig with coverage_class LABOR and
                  status ACTIVE or SUPERSEDED, ordered by created_at ASC, first row
      pdays = floor((claim.submitted_at - part_cov.starts_at)  total seconds / 86400)
      ldays = floor((claim.submitted_at - labor_cov.starts_at) total seconds / 86400)
      parts_credit = WorkOrder.parts_charge_cents if (part_cov  is not null and pdays <= PART_WARRANTY_DAYS)  else 0
      labor_credit = WorkOrder.labor_charge_cents if (labor_cov is not null and ldays <= LABOR_WARRANTY_DAYS) else 0
      return (parts_credit, labor_credit, parts_credit + labor_credit)
    input_set: "The remedy work order plus the two coverages of the original work order."
    constants:
      PART_WARRANTY_DAYS: 365
      LABOR_WARRANTY_DAYS: 90
    precision: |
      SEAM-06: the two windows are checked SEPARATELY against the SAME submission
      instant, so a claim raised on day 200 credits parts in full and credits nothing
      for labor. Both windows are RIGHT-CLOSED on whole days.
    worked_examples:
      - "Claim submitted 200 days after completion, remedy parts 64002 and labor 22444: parts_credit 64002 (200 <= 365), labor_credit 0 (200 > 90), total 64002."
      - "Claim submitted 90 days after completion: parts_credit and labor_credit both apply (90 <= 365 and 90 <= 90)."

  - name: invoice_total_cents
    trigger: "CASCADE-C-3 hop 7."
    algorithm: waterfall_allocation
    formula: |
      # STEP ORDER IS PINNED. Steps 6 and 7 are what make the circular-looking
      # dependency (discount depends on the total, total depends on the discount)
      # well defined: the eligibility test in step 7 reads the PRE-DISCOUNT figure
      # computed in step 6 and is never revisited.
      1. parts   = sum(extended_price_cents of POSTED PartsConsumptionEntry rows,
                       ordered by posted_at ASC then created_at ASC)
      2. labor   = WorkOrder.labor_charge_cents
      3. dispatch = 0 when WorkOrder.pipeline == "SCHEDULED"
                    else EmergencyTicket.net_dispatch_charge_cents + trip_fee_cents(Property)
      4. permit  = fee_cents of the Permit p with p.work_order_id == this work order
                   and p.status in {APPROVED, APPROVED_WITH_CONDITIONS},
                   ordered by p.created_at ASC, first row; 0 when none
      5. (parts_credit, labor_credit, warranty_credit) = warranty_credit_cents(...)   # (0,0,0) when not a remedy
      6. pre_discount_pretax = parts + labor + dispatch + permit - warranty_credit
      7. loyalty_eligible = Account.membership_tier in LOYALTY_DISCOUNT_ELIGIBLE_TIERS
                            and pre_discount_pretax >= LOYALTY_DISCOUNT_MIN_PRETAX_CENTS
         loyalty = round_half_up(parts * LOYALTY_DISCOUNT_PCT / 100) if loyalty_eligible else 0
      8. taxable = max(0, parts - parts_credit - loyalty)
      9. tax     = round_half_up(taxable * TAX_RATE_PCT / 100)
      10. undivided_total = pre_discount_pretax - loyalty + tax
      11. per-account totals = shared_well_billing_split_cents(undivided_total, well)
    input_set: |
      Exactly the POSTED consumption entries of this work order, plus the work
      order's own labor figures, plus at most one emergency ticket and at most one
      permit. REVERSED entries are excluded.
    constants:
      TAX_RATE_PCT: 7.25
      LOYALTY_DISCOUNT_PCT: 5.00
      LOYALTY_DISCOUNT_MIN_PRETAX_CENTS: 200000
      LOYALTY_DISCOUNT_ELIGIBLE_TIERS: [SELECT, PREMIER]
    precision: |
      Whole cents throughout, round_half_up at each named rounding point. The
      eligibility threshold in step 7 is INCLUSIVE (>= 200000).
    variants:
      - name: quoted_pinned
        when: "WorkOrder.quote_id is not null; Invoice.variant == QUOTED_PINNED."
        difference: |
          Each POSTED consumption entry takes unit_cost_cents_snapshot from the
          matching ACTIVE QuoteLine's unit_cost_cents_pinned when the quote has an
          ACTIVE line for the SAME part_catalog_item_id (first such line by
          created_at ASC); the catalog's current unit_cost_cents is used only for
          parts the quote never listed. The labor line uses the ACTUAL billable
          minutes and the ACTUAL technician's tier, never the quoted ones.
      - name: actual_final
        when: "WorkOrder.emergency_ticket_id is not null; Invoice.variant == ACTUAL_FINAL."
        difference: |
          Every entry takes unit_cost_cents_snapshot from the catalog's CURRENT
          unit_cost_cents at posting time. DUAL-VARIANT DIVERGENCE: for the same part,
          the same quantity and the same labor, an invoice built after the catalog
          cost moved differs from one built on pinned costs - and because the markup
          band is flat, the divergence can point either way (see parts_markup_pct).
    worked_examples:
      - |
        Emergency, ACTUAL_FINAL, NONE membership, no warranty credit, no permit.
        One entry: catalog unit_cost 25001, qty 2 -> unit price 32001, parts 64002.
        Labor: MASTER, EVENING start, raw 130 min -> rate 18225, billable 135,
        labor 41006. Dispatch: severity 70 with membership NONE -> surcharge 24000,
        credit 0, net 24000; property distance 20.0 -> ZONE_2 trip fee 12500;
        dispatch = 36500. pre_discount_pretax = 64002 + 41006 + 36500 + 0 - 0 = 141508.
        Loyalty: tier NONE -> not eligible -> 0. taxable = 64002.
        tax = round_half_up(64002*7.25/100) = round_half_up(4640.145) = 4640.
        undivided_total = 141508 - 0 + 4640 = 146148.
      - |
        Same as above but the account is PREMIER. membership_tier_at_intake PREMIER
        with severity 70 -> credit 20000 -> net dispatch 4000; dispatch = 16500.
        pre_discount_pretax = 64002 + 41006 + 16500 = 121508 -> below 200000, so the
        loyalty discount does NOT apply even though the tier is eligible.
        taxable 64002, tax 4640, undivided_total = 126148.

  - name: shared_well_billing_split_cents
    trigger: "CASCADE-C-3 hop 7, step 11."
    algorithm: waterfall_allocation
    formula: |
      shares = SharedWellAgreement rows for this well with status == ACTIVE,
               ordered by created_at ASC
      if shares is empty or sum(s.split_pct for s in shares) != 100.00:
          # no agreement, or an under-allocated well: ONE invoice to the property's own account
          return [ (Property.account_id, undivided_total, 100.00) ]
      raw_i = floor(undivided_total * shares[i].split_pct / 100)  for each i
      remainder = undivided_total - sum(raw_i)
      raw_0 = raw_0 + remainder        # the ENTIRE remainder goes to the FIRST share by created_at ASC
      return [ (shares[i].account_id, raw_i, shares[i].split_pct) ]
    input_set: "Every ACTIVE SharedWellAgreement on the well, ordered by created_at ASC. TERMINATED agreements are excluded. The split is applied ONLY when those ACTIVE shares total EXACTLY 100.00; at any other total the whole amount goes to Property.account_id on a single invoice at shared_split_pct 100.00."
    constants:
      SHARED_WELL_MAX_PARTIES: 4
    precision: |
      Whole cents; floor per share then the entire remainder to the earliest-created
      ACTIVE share. This guarantees sum(shares) == undivided_total exactly. The
      ordering key is created_at, never id.
    worked_examples:
      - "undivided 9999 across two 50.00 shares: raw 4999 and 4999, remainder 1 -> first share 5000, second 4999."
      - "undivided 10000 across 33.33 / 33.33 / 33.34: raw 3333, 3333, 3334, remainder 0 -> unchanged."

  - name: account_balance_cents
    trigger: "Invoice issue, payment recording and invoice void."
    algorithm: aggregation
    formula: |
      Account.balance_cents = sum over the account's Invoices with
        status in {ISSUED, PARTIALLY_PAID, PAID_IN_FULL} of
        (total_cents - amount_paid_cents)
    input_set: "Every Invoice of the account whose status is ISSUED, PARTIALLY_PAID or PAID_IN_FULL. DRAFT and VOID invoices are excluded."
    constants:
      CREDIT_HOLD_THRESHOLD_CENTS: 500000
    precision: |
      CONSERVED QUANTITY of invariant CI-2. The forward action (issue) and its
      compensating action (void) must leave the identity above exactly satisfied.
      credit_hold is re-derived as (balance_cents > 500000), STRICTLY greater, on
      every write that touches balance_cents.

  - name: parts_inventory_conservation
    trigger: "Parts posting, work-order completion (finalisation) and work-order cancellation (reversal)."
    algorithm: aggregation
    formula: |
      for each PartCatalogItem p:
        p.on_hand_qty + sum(e.quantity for PartsConsumptionEntry e
                            where e.part_catalog_item_id == p.id and e.status == "POSTED")
        == the value of that same expression immediately before the posting
    input_set: "Every PartsConsumptionEntry for one catalog item whose status is POSTED, regardless of the owning work order's fulfillment_status. REVERSED entries are excluded."
    constants: {}
    precision: |
      CONSERVED QUANTITY of invariant CI-1, deliberately a DIFFERENT kind of quantity
      from CI-2's money. The forward action is POSTING a consumption row (decrements
      on_hand_qty by the same quantity the row adds to the POSTED sum); the
      compensating action is work-order cancellation (moves the rows to REVERSED and
      restores on_hand_qty by exactly that quantity), so the sum above is invariant
      across the pair and across completion, which moves no stock at all.

  - name: pagination_window
    trigger: "Every list endpoint."
    algorithm: aggregation
    formula: |
      limit  = body/query limit, default 10, integer in [1, 100]
      offset = body/query offset, default 0, integer >= 0
      page   = rows[offset : offset + limit]
      has_more = (offset + limit) < total_count
    input_set: "The filtered, sorted row set. Default sort is created_at ASC for every list endpoint unless the endpoint states otherwise."
    constants:
      PAGE_LIMIT_DEFAULT: 10
      PAGE_LIMIT_MIN: 1
      PAGE_LIMIT_MAX: 100
      PAGE_OFFSET_DEFAULT: 0
    precision: "A limit of 0, a limit above 100 or a negative offset raises ERR_INVALID_PAGINATION at G8_QUERY."

derivation_ladder:
  description: |
    ONE numbered ladder shared by BOTH pipelines. `pipeline:` tags each rung S
    (scheduled/quoted), E (emergency dispatch) or BOTH. Rungs tagged BOTH are
    literally the same derivation applied to a different carrier entity; rungs tagged
    S or E are where the two pipelines genuinely diverge. Every rung names the
    calculation, transition or gate that realises it, so a reader can walk the ladder
    against the code sequence.
  rungs:
    - id: L1
      pipeline: BOTH
      text: "Select the labor time band from the governing instant: Quote.estimated_start_at on S, WorkOrder.actual_start_at on E and on S completion. Weekend beats every hour band."
      realised_by: calculations.labor_time_band
    - id: L2
      pipeline: BOTH
      text: "Multiply the tier base rate by the band multiplier and ROUND TO CENTS HERE. The rounded rate, not the raw product, is what the next rung consumes."
      realised_by: calculations.labor_rate_cents_per_hour
    - id: L3
      pipeline: BOTH
      text: "Round raw minutes up to the 15-minute increment, floor at 60, then (E only, and only for NON_WELL_CAUSE) cap at 60; multiply the rounded rate by minutes/60 and round a second time."
      realised_by: calculations.labor_charge_cents
    - id: L4
      pipeline: BOTH
      text: "Select the FLAT markup band from the part's unit cost. Bands are inclusive on their upper bound, which is what makes the marked-up price non-monotone in cost."
      realised_by: calculations.parts_markup_pct
    - id: L5
      pipeline: BOTH
      text: "Apply the markup PER UNIT and round to cents before any multiplication by quantity."
      realised_by: calculations.parts_unit_price_cents
    - id: L6
      pipeline: BOTH
      text: "Extend the rounded unit price by the quantity. Round-per-line-then-sum is pinned; sum-then-round is wrong."
      realised_by: calculations.parts_extended_price_cents
    - id: L7
      pipeline: BOTH
      text: "Sum the extended line amounts over the status-filtered input set: ACTIVE quote lines on S, POSTED consumption entries on E and on S completion."
      realised_by: calculations.parts_subtotal_cents
    - id: L8
      pipeline: BOTH
      text: "Decide whether the scope needs a permit at all: NEW_WELL, PUMP_REPLACEMENT, PRESSURE_TANK and TREATMENT_INSTALL do; REPAIR and MAINTENANCE do not."
      realised_by: calculations.permit_fee_cents
    - id: L9
      pipeline: BOTH
      text: "Compute the filing fee from the WELL's jurisdiction tier times the scope multiplier, rounded, plus the flat expedite fee. The account's billing jurisdiction never participates."
      realised_by: calculations.permit_fee_cents
    - id: L10
      pipeline: S
      text: "Gate every PUMP quote line on the well's measured yield: rated_gpm must be at least MIN_PUMP_GPM and at most measured_yield_gpm * 0.80, inclusive."
      realised_by: calculations.well_yield_pump_eligibility
    - id: L11
      pipeline: S
      text: "At PRICED, copy the catalog's current unit_cost_cents onto every ACTIVE line as unit_cost_cents_pinned and freeze it. Later catalog moves do not disturb a pinned line."
      realised_by: state_machines.Quote.DRAFT_to_PRICED
    - id: L12
      pipeline: S
      text: "Assemble the quote total: parts subtotal, estimated labor, permit fee, then tax on the PARTS subtotal only."
      realised_by: calculations.quote_total_cents
    - id: L13
      pipeline: S
      text: "Stamp sent_at at SEND; the approval window is right-closed at QUOTE_VALIDITY_DAYS from that instant."
      realised_by: state_machines.Quote.PRICED_to_SENT
    - id: L14
      pipeline: E
      text: "Score the outage: cause points plus capped outage-hour points plus capped household points plus the vulnerable-occupant flag, capped at 100."
      realised_by: calculations.no_water_severity_score
    - id: L15
      pipeline: E
      text: "Band the score into a gross dispatch surcharge. Upper bounds are inclusive."
      realised_by: calculations.emergency_surcharge_tier_cents
    - id: L16
      pipeline: E
      text: "Apply the membership credit. PREMIER unlocks its credit only at severity 60 or above; SELECT credits at every severity; NONE never credits."
      realised_by: calculations.membership_surcharge_credit_cents
    - id: L17
      pipeline: E
      text: "Net the surcharge against the credit, floored at zero - and zero it outright for a NON_WELL_CAUSE. The composed chain L14-L17 is NON-MONOTONE in severity for a PREMIER account."
      realised_by: calculations.net_dispatch_charge_cents
    - id: L18
      pipeline: E
      text: "Derive the pre-authorization ceiling from the membership tier LATCHED AT INTAKE, not the tier read at diagnosis."
      realised_by: calculations.emergency_preauth_cap_cents
    - id: L19
      pipeline: E
      text: "Compare the on-site estimate against the ceiling: strictly greater sends the authorization axis to PENDING, equal or less to PRE_AUTHORIZED."
      realised_by: calculations.authorization_requirement_decision
    - id: L20
      pipeline: E
      text: "Band the property distance into a trip-fee zone; beyond 60.0 miles the ticket cannot even be triaged."
      realised_by: calculations.trip_fee_cents
    - id: L21
      pipeline: E
      text: "Record whole response minutes between intake and dispatch for operational reporting; this figure never enters the price."
      realised_by: calculations.emergency_response_minutes
    - id: L22
      pipeline: E
      text: "A NON_WELL_CAUSE diagnosis has three simultaneous consequences: the net dispatch charge is zero, billable labor is capped at 60 minutes, and posting parts consumption is refused."
      realised_by: calculations.net_dispatch_charge_cents
    - id: L23
      pipeline: S
      text: "AUTHORIZATION ORDER, S: the customer authorises BEFORE any work order exists. A work order may only be created against a quote already in APPROVED."
      realised_by: state_machines.Quote.SENT_to_APPROVED
    - id: L24
      pipeline: S
      text: "At approval, the cited inspection must be COMPLETED and no older than INSPECTION_VALIDITY_DAYS, right-closed."
      realised_by: state_machines.Quote.SENT_to_APPROVED
    - id: L25
      pipeline: S
      text: "At approval, the owning account must not be on credit hold."
      realised_by: state_machines.Quote.SENT_to_APPROVED
    - id: L26
      pipeline: E
      text: "AUTHORIZATION ORDER, E: the customer authorises AFTER the technician is on site and has diagnosed, and only when the estimate exceeded the cap."
      realised_by: state_machines.EmergencyTicket.PENDING_to_AUTHORIZED
    - id: L27
      pipeline: E
      text: "While the authorization axis sits at PENDING, posting parts consumption on the linked work order is refused."
      realised_by: validations
    - id: L28
      pipeline: E
      text: "While the authorization axis sits at PENDING, completing the linked work order is refused. DECLINED closes the ticket instead."
      realised_by: state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
    - id: L29
      pipeline: S
      text: "PERMIT PREREQUISITE, S: a permit-requiring scope cannot be SCHEDULED until a Permit on that work order is APPROVED or APPROVED_WITH_CONDITIONS."
      realised_by: state_machines.WorkOrder.DRAFT_to_SCHEDULED
    - id: L30
      pipeline: BOTH
      text: "The assigned technician's tier must satisfy the scope tier table before scheduling."
      realised_by: calculations.technician_tier_scope_gate
    - id: L31
      pipeline: E
      text: "PERMIT PREREQUISITE, E: emergency work is EMERGENCY_EXEMPT - scheduling and completion proceed with no permit at all."
      realised_by: state_machines.WorkOrder.DRAFT_to_SCHEDULED
    - id: L32
      pipeline: E
      text: "The exemption is not free: a post_hoc permit must be filed within POST_HOC_PERMIT_WINDOW_DAYS of the work order's actual_end_at, right-closed."
      realised_by: state_machines.Permit.DRAFT_to_FILED
    - id: L33
      pipeline: BOTH
      text: "A permit may only be filed with the WELL's jurisdiction. Filing against the account's billing jurisdiction is rejected at G6."
      realised_by: state_machines.Permit.DRAFT_to_FILED
    - id: L34
      pipeline: BOTH
      text: "Scheduling tests the technician's buffered half-open window against every other SCHEDULED or IN_PROGRESS work order of that technician."
      realised_by: calculations.technician_window_overlap
    - id: L35
      pipeline: BOTH
      text: "Scheduling separately tests the per-well daily cap using calendar-day buckets on the start instant only - different interval geometry from L34."
      realised_by: calculations.well_daily_work_order_cap
    - id: L36
      pipeline: BOTH
      text: "Starting the work order stamps actual_start_at from the logical clock; that instant, not the scheduled one, selects the labor band at completion."
      realised_by: state_machines.WorkOrder.SCHEDULED_to_IN_PROGRESS
    - id: L37
      pipeline: BOTH
      text: "Completion records actual_labor_minutes and runs L1-L3 to fix labor_rate_cents_per_hour and labor_charge_cents."
      realised_by: state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
    - id: L38
      pipeline: BOTH
      text: "Posting a consumption row decrements the catalog on_hand_qty immediately (invariant CI-1's forward action); completion then FREEZES each row's snapshot cost, markup and extension against later catalog moves."
      realised_by: calculations.parts_inventory_conservation
    - id: L39
      pipeline: BOTH
      text: "WARRANTY ATTACHMENT: one PART coverage is minted per finalised entry, expiring PART_WARRANTY_DAYS after actual_end_at."
      realised_by: calculations.warranty_coverage_expires_at
    - id: L40
      pipeline: BOTH
      text: "Exactly one LABOR coverage is minted per completed work order, expiring LABOR_WARRANTY_DAYS after actual_end_at - a different window on the same instant."
      realised_by: calculations.warranty_coverage_expires_at
    - id: L41
      pipeline: BOTH
      text: "When the completing work order is a remedy, the coverage it remedies is SUPERSEDED and points at the newly minted coverage of the same class."
      realised_by: state_machines.WarrantyCoverage.ACTIVE_to_SUPERSEDED
    - id: L42
      pipeline: BOTH
      text: "Because a coverage was superseded, the originating claim moves APPROVED_WARRANTY -> RESOLVED_REPAIRED and the ORIGINAL work order's callback_eligibility becomes CONSUMED."
      realised_by: state_machines.CallbackClaim.APPROVED_WARRANTY_to_RESOLVED_REPAIRED
    - id: L43
      pipeline: BOTH
      text: "Because parts and labor were finalised, a MaintenanceVisit is created per ACTIVE plan; last_service_date advances on ANY visit kind, the two clocks reset independently, duty cycle and interval are re-derived and next_due_at recomputed."
      realised_by: calculations.maintenance_visit_kind_selection
    - id: L44
      pipeline: BOTH
      text: "INVOICE CONSTRUCTION: an Invoice is created in DRAFT; its variant is QUOTED_PINNED when the work order carries a quote and ACTUAL_FINAL otherwise."
      realised_by: calculations.invoice_total_cents
    - id: L45
      pipeline: BOTH
      text: "PARTS lines are constructed first, one per POSTED entry, ordered posted_at ASC then created_at ASC."
      realised_by: calculations.invoice_total_cents
    - id: L46
      pipeline: BOTH
      text: "The single LABOR line follows, always at the ACTUAL technician tier and ACTUAL billable minutes even on the QUOTED_PINNED variant."
      realised_by: calculations.invoice_total_cents
    - id: L47
      pipeline: E
      text: "DISPATCH_SURCHARGE and TRIP_FEE lines follow, and exist only on the emergency pipeline."
      realised_by: calculations.invoice_total_cents
    - id: L48
      pipeline: BOTH
      text: "A PERMIT_FEE line is added when an APPROVED or APPROVED_WITH_CONDITIONS permit is linked to the work order."
      realised_by: calculations.invoice_total_cents
    - id: L49
      pipeline: BOTH
      text: "WARRANTY_CREDIT lines are computed per class against the SAME submission instant, then the loyalty discount is evaluated against the PRE-DISCOUNT pre-tax total - the pinned resolution of the circular-looking dependency."
      realised_by: calculations.invoice_total_cents
    - id: L50
      pipeline: BOTH
      text: "Tax is computed last, on the parts subtotal net of the parts warranty credit and the loyalty discount, and on nothing else."
      realised_by: calculations.invoice_total_cents
    - id: L51
      pipeline: BOTH
      text: "The undivided total is split across ACTIVE shared-well agreements by floor-per-share with the whole remainder to the earliest-created share; with no agreements one invoice is issued at 100.00."
      realised_by: calculations.shared_well_billing_split_cents
    - id: L52
      pipeline: BOTH
      text: "The work order's billing axis moves NOT_BILLABLE -> PENDING_INVOICE at DRAFT invoice creation; the account balance is untouched until the invoice is ISSUED."
      realised_by: state_machines.Invoice.DRAFT_to_ISSUED
    - id: L53
      pipeline: BOTH
      text: "Payments reduce the balance and accumulate amount_paid_cents; a payment equal to the outstanding amount settles the invoice and the work order's billing axis."
      realised_by: state_machines.Invoice.ISSUED_to_PAID_IN_FULL
    - id: L54
      pipeline: BOTH
      text: "Voiding an ISSUED invoice is CI-2's compensating action: it removes exactly what issuing and paying added, leaving the balance identity satisfied."
      realised_by: calculations.account_balance_cents
    - id: L55
      pipeline: BOTH
      text: "Cancelling an IN_PROGRESS work order is CI-1's compensating action: every POSTED entry moves to REVERSED and on_hand_qty is restored by the same quantity."
      realised_by: calculations.parts_inventory_conservation
    - id: L56
      pipeline: BOTH
      text: "A lab result outside the panel's hold time lands the test in INVALID_HOLD_TIME and moves nothing on the well."
      realised_by: calculations.water_test_hold_time_validity
    - id: L57
      pipeline: BOTH
      text: "A CHEMICAL panel LATCHES at the lab result: hardness is copied to the well and an advisory fires when any MCL is exceeded. There is no confirmatory step for chemistry."
      realised_by: state_machines.WaterTest.COLLECTED_to_ANALYZED_CHEMICAL_EXCEEDANCE
    - id: L58
      pipeline: BOTH
      text: "A BACTERIOLOGICAL presumptive positive does NOT latch: the well sits at ADVISORY until a confirmatory sample inside the right-closed 21-day window resolves it, or the window lapses."
      realised_by: state_machines.WaterTest.COLLECTED_to_ANALYZED_PRESUMPTIVE_POSITIVE
    - id: L59
      pipeline: BOTH
      text: "Treatment media is selected in a pinned clause order, softener sizing runs the three-step non-monotone chain, and expiry is anchored on the SAMPLE instant, not on the recommendation."
      realised_by: calculations.recommended_media_selection
    - id: L60
      pipeline: BOTH
      text: "MUTATE-THEN-REJECT: a confirming retest durably writes the confirmation, the child test row, the UNSAFE potability and both version bumps, AND THEN returns 422 ERR_RETEST_CONFIRMED_POSITIVE. The writes persist."
      realised_by: state_machines.WaterTest.ANALYZED_PRESUMPTIVE_POSITIVE_to_CONFIRMED_POSITIVE
    - id: L61
      pipeline: S
      text: "MUTATE-THEN-REJECT: approving a quote whose PUMP line no longer clears the yield gate durably marks the line SUPERSEDED_BY_YIELD and the quote REVISION_REQUIRED, AND THEN returns 409 ERR_QUOTE_LINE_YIELD_EXCEEDED. The writes persist."
      realised_by: state_machines.Quote.SENT_to_REVISION_REQUIRED
    - id: L62
      pipeline: BOTH
      text: "MUTATE-THEN-REJECT: an out-of-warranty callback intake durably creates the claim row, bumps claim_count and callback_attempt_count and sets callback_eligibility EXPIRED, AND THEN returns 409 ERR_CALLBACK_OUT_OF_WARRANTY. The writes persist."
      realised_by: state_machines.CallbackClaim.SUBMITTED_to_REJECTED_OUT_OF_WARRANTY
    - id: L63
      pipeline: BOTH
      text: "Maintenance compliance LATCHES to OVERDUE at an explicit evaluation and is cleared only by a FILTER_ONLY or SALT_AND_FILTER visit - never by an interval recomputation that happens to move next_due_at forward."
      realised_by: state_machines.MaintenancePlan.COMPLIANT_to_OVERDUE
    - id: L64
      pipeline: BOTH
      text: "The salt clock is CONSUMPTION-driven: remaining pounds above the reorder threshold divided by the monthly burn, anchored on the delivery date."
      realised_by: calculations.salt_next_due_date
    - id: L65
      pipeline: BOTH
      text: "The filter clock is TIME-driven: a fixed interval per media from the change date, with a 30-day minimum spacing between changes."
      realised_by: calculations.filter_next_due_date
    - id: L66
      pipeline: BOTH
      text: "Four write endpoints carry OCC on a parent version, checked at G7 - after the state gate and BEFORE payload validation, so a stale version beats a malformed body."
      realised_by: concurrency_rules
    - id: L67
      pipeline: BOTH
      text: "ACTIVE shared-well shares on one well must total exactly 100.00 after the write; a create that would break the identity is refused."
      realised_by: validations
    - id: L68
      pipeline: BOTH
      text: "credit_hold is re-derived as balance_cents strictly greater than CREDIT_HOLD_THRESHOLD_CENTS on every write that touches the balance, and it gates quote approval and emergency authorization."
      realised_by: calculations.account_balance_cents

validations:
  - priority: 1
    gate: G1_AUTH
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    gate: G2_ROLE
    category: auth
    check: "The declared role appears in the endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    gate: G3_PATH_EXISTENCE
    category: existence
    check: "Every {id} segment in the path resolves, validated left to right; the leftmost failure wins."
    error_id: ERR_WORK_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id; the concrete error is the *_NOT_FOUND of the entity that failed"
  - priority: 4
    gate: G4_SCOPE
    category: auth
    check: "For CustomerContact, X-User-ID equals the owning Account.id resolved by the declared FK chain; for Technician, X-User-ID equals the resource's assigned technician id."
    error_id: ERR_ACTOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every endpoint whose roles include CustomerContact or Technician and that addresses an owned resource"
  - priority: 5
    gate: G5_ENTITY_STATE
    category: state
    check: "Inspection.status matches the transition's from-state."
    error_id: ERR_INSPECTION_INVALID_STATE
    http_status: 409
    applies_to: "POST /water-service/inspections/{inspection_id}/start, /complete, /cancel"
  - priority: 6
    gate: G5_ENTITY_STATE
    category: state
    check: "WaterTest.result_status matches the transition's from-state."
    error_id: ERR_WATER_TEST_INVALID_STATE
    http_status: 409
    applies_to: "POST /water-service/water-tests/{water_test_id}/lab-result, /confirmatory-result, /lapse-retest-window"
  - priority: 7
    gate: G5_ENTITY_STATE
    category: state
    check: "TreatmentRecommendation.status is PROPOSED."
    error_id: ERR_TREATMENT_RECOMMENDATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /water-service/treatment-recommendations/{treatment_recommendation_id}/accept"
  - priority: 8
    gate: G5_ENTITY_STATE
    category: state
    check: "Quote.status matches the transition's from-state."
    error_id: ERR_QUOTE_INVALID_STATE
    http_status: 409
    applies_to: "POST /water-service/quotes/{quote_id}/lines, /price, /send, /approve, /decline, /expire"
  - priority: 9
    gate: G5_ENTITY_STATE
    category: state
    check: "QuoteLine.status is ACTIVE and the owning Quote is DRAFT or REVISION_REQUIRED."
    error_id: ERR_QUOTE_LINE_INVALID_STATE
    http_status: 409
    applies_to: "DELETE /water-service/quote-lines/{quote_line_id}"
  - priority: 10
    gate: G5_ENTITY_STATE
    category: state
    check: "EmergencyTicket.dispatch_status matches the transition's from-state."
    error_id: ERR_EMERGENCY_DISPATCH_INVALID_STATE
    http_status: 409
    applies_to: "POST /water-service/emergency-tickets/{emergency_ticket_id}/triage, /dispatch, /arrive, /diagnosis, /cancel"
  - priority: 11
    gate: G5_ENTITY_STATE
    category: state
    check: "EmergencyTicket.authorization_status is PENDING."
    error_id: ERR_EMERGENCY_AUTH_INVALID_STATE
    http_status: 409
    applies_to: "POST /water-service/emergency-tickets/{emergency_ticket_id}/authorize, /decline-authorization"
  - priority: 12
    gate: G5_ENTITY_STATE
    category: state
    check: "WorkOrder.fulfillment_status matches the transition's from-state."
    error_id: ERR_WORK_ORDER_INVALID_FULFILLMENT_STATE
    http_status: 409
    applies_to: "POST /water-service/work-orders/{work_order_id}/schedule, /start, /complete, /cancel, /parts-consumption, and /write-off where the fulfillment axis is checked AFTER the billing axis"
  - priority: 13
    gate: G5_ENTITY_STATE
    category: state
    check: "WorkOrder.billing_status matches the transition's from-state."
    error_id: ERR_WORK_ORDER_INVALID_BILLING_STATE
    http_status: 409
    applies_to: "POST /water-service/work-orders/{work_order_id}/write-off"
  - priority: 14
    gate: G5_ENTITY_STATE
    category: state
    check: "Permit.status matches the transition's from-state."
    error_id: ERR_PERMIT_INVALID_STATE
    http_status: 409
    applies_to: "POST /water-service/permits/{permit_id}/file, /approve, /reject, /withdraw, /refile-draft"
  - priority: 15
    gate: G5_ENTITY_STATE
    category: state
    check: "CallbackClaim.status matches the transition's from-state."
    error_id: ERR_CALLBACK_CLAIM_INVALID_STATE
    http_status: 409
    applies_to: "POST /water-service/callback-claims/{callback_claim_id}/adjudicate, /remedy-work-order"
  - priority: 16
    gate: G5_ENTITY_STATE
    category: state
    check: "Invoice.status matches the transition's from-state."
    error_id: ERR_INVOICE_INVALID_STATE
    http_status: 409
    applies_to: "POST /water-service/invoices/{invoice_id}/issue, /payments, /void"
  - priority: 17
    gate: G5_ENTITY_STATE
    category: state
    check: "MaintenancePlan.status matches the transition's from-state; salt deliveries, filter changes and compliance evaluation require ACTIVE."
    error_id: ERR_MAINTENANCE_PLAN_INVALID_STATE
    http_status: 409
    applies_to: "POST /water-service/maintenance-plans/{maintenance_plan_id}/salt-deliveries, /filter-change, /suspend, /resume, /terminate, /evaluate-compliance"
  - priority: 18
    gate: G6_REGULATORY
    category: business_safety
    check: "The permit's jurisdiction_code equals the WellProfile's jurisdiction_code."
    error_id: ERR_PERMIT_JURISDICTION_MISMATCH
    http_status: 422
    applies_to: "POST /water-service/permits/{permit_id}/file"
  - priority: 19
    gate: G6_REGULATORY
    category: business_temporal
    check: "A post_hoc permit is filed no later than POST_HOC_PERMIT_WINDOW_DAYS after the linked work order's actual_end_at, right-closed."
    error_id: ERR_POST_HOC_PERMIT_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /water-service/permits/{permit_id}/file"
  - priority: 20
    gate: G6_REGULATORY
    category: business_safety
    check: "A permit-requiring scope on the SCHEDULED pipeline has an APPROVED or APPROVED_WITH_CONDITIONS permit linked to the work order."
    error_id: ERR_PERMIT_REQUIRED_NOT_APPROVED
    http_status: 422
    applies_to: "POST /water-service/work-orders/{work_order_id}/schedule"
  - priority: 21
    gate: G6_REGULATORY
    category: business_safety
    check: "The assigned technician's tier is permitted for the work order's scope."
    error_id: ERR_TECHNICIAN_TIER_INSUFFICIENT
    http_status: 403
    applies_to: "POST /water-service/work-orders/{work_order_id}/schedule"
  - priority: 22
    gate: G6_REGULATORY
    category: business_temporal
    check: "The confirmatory sample instant is within RETEST_WINDOW_DAYS of the parent sample, right-closed."
    error_id: ERR_RETEST_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /water-service/water-tests/{water_test_id}/confirmatory-result"
  - priority: 23
    gate: G6_REGULATORY
    category: business_safety
    check: "The acting ComplianceOfficer's X-User-ID differs from the officer who recorded the presumptive result (segregation of duties)."
    error_id: ERR_CONFIRMATORY_SAME_OFFICER
    http_status: 403
    applies_to: "POST /water-service/water-tests/{water_test_id}/confirmatory-result"
  - priority: 24
    gate: G6_REGULATORY
    category: business_safety
    check: "The adjudicating Technician's X-User-ID differs from the original work order's assigned_technician_id (segregation of duties)."
    error_id: ERR_CALLBACK_ADJUDICATOR_CONFLICT
    http_status: 403
    applies_to: "POST /water-service/callback-claims/{callback_claim_id}/adjudicate"
  - priority: 25
    gate: G6_REGULATORY
    category: business_temporal
    check: "The CONFIRMATORY sample obeys its own bacteriological hold time: confirm_analyzed_at - confirm_sample_datetime must be at most HOLD_TIME_HOURS[BACTERIOLOGICAL], right-closed. A lab result on an ORIGINAL sample that exceeds its hold time does not raise this error - it routes the test to INVALID_HOLD_TIME instead (L56)."
    error_id: ERR_WATER_TEST_HOLD_TIME_EXCEEDED
    http_status: 422
    applies_to: "POST /water-service/water-tests/{water_test_id}/confirmatory-result"
  - priority: 26
    gate: G7_OCC
    category: business_constraint
    check: "expected_well_profile_version equals the stored WellProfile.version."
    error_id: ERR_STALE_WELL_PROFILE_VERSION
    http_status: 412
    applies_to: "POST /water-service/well-profiles/{well_profile_id}/treatment-recommendations"
  - priority: 27
    gate: G7_OCC
    category: business_constraint
    check: "expected_quote_version equals the stored Quote.version."
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412
    applies_to: "POST /water-service/quotes/{quote_id}/lines"
  - priority: 28
    gate: G7_OCC
    category: business_constraint
    check: "expected_invoice_version equals the stored Invoice.version."
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412
    applies_to: "POST /water-service/invoices/{invoice_id}/payments"
  - priority: 29
    gate: G7_OCC
    category: business_constraint
    check: "expected_maintenance_plan_version equals the stored MaintenancePlan.version."
    error_id: ERR_STALE_MAINTENANCE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /water-service/maintenance-plans/{maintenance_plan_id}/salt-deliveries"
  - priority: 30
    gate: G8_PAYLOAD
    category: business_constraint
    check: "Every required body field is present and of the declared JSON type; unknown fields are ignored."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "every mutating endpoint"
  - priority: 31
    gate: G8_PAYLOAD
    category: business_constraint
    check: "Every enum-typed body field carries a declared member of that enum."
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "every mutating endpoint with an enum body field"
  - priority: 32
    gate: G8_PAYLOAD
    category: business_constraint
    check: "Every datetime body field parses as an ISO 8601 UTC instant."
    error_id: ERR_INVALID_TIMESTAMP
    http_status: 400
    applies_to: "every mutating endpoint with a datetime body field"
  - priority: 33
    gate: G8_PAYLOAD
    category: business_constraint
    check: "A quantity, amount or pounds field is not STRICTLY negative. Zero passes this gate; zero amounts are adjudicated later at G9 (see ERR_PAYMENT_AMOUNT_INVALID)."
    error_id: ERR_NEGATIVE_QUANTITY
    http_status: 400
    applies_to: "POST /water-service/work-orders/{work_order_id}/parts-consumption, POST /water-service/quotes/{quote_id}/lines, POST /water-service/maintenance-plans/{maintenance_plan_id}/salt-deliveries, POST /water-service/invoices/{invoice_id}/payments"
  - priority: 34
    gate: G8_PAYLOAD
    category: business_temporal
    check: "An end instant is strictly after its start instant, and analyzed_at is not before sample_datetime."
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: "POST /water-service/work-orders/{work_order_id}/schedule, POST /water-service/water-tests/{water_test_id}/lab-result"
  - priority: 35
    gate: G8_PAYLOAD
    category: business_temporal
    check: "The logical clock may not be moved backwards; to_iso8601 must be greater than or equal to the current clock."
    error_id: ERR_CLOCK_BACKWARD
    http_status: 400
    applies_to: "POST /water-service/_clock/set_current_utc"
  - priority: 36
    gate: G8_PAYLOAD
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "every list endpoint"
  - priority: 37
    gate: G9_BUSINESS
    category: existence
    check: "Every BODY-referenced foreign key resolves to a stored entity. This runs at G9A, AFTER payload validation, so a missing field is ERR_VALIDATION and a present-but-unknown id is that entity's *_NOT_FOUND."
    error_id: ERR_PART_CATALOG_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "every mutating endpoint with a foreign-key body field; the concrete error is the *_NOT_FOUND of the entity that failed"
  - priority: 38
    gate: G9_BUSINESS
    category: business_safety
    check: "A TreatmentRecommendation may not be accepted while the WELL sits at potability_status ADVISORY with advisory_reason PRESUMPTIVE_COLIFORM, i.e. while an unresolved bacteriological presumptive is outstanding on the well (cross-entity dependency CE-2, TreatmentRecommendation depends on WellProfile)."
    error_id: ERR_POTABILITY_PENDING_CONFIRMATION
    http_status: 422
    applies_to: "POST /water-service/treatment-recommendations/{treatment_recommendation_id}/accept"
  - priority: 39
    gate: G9_BUSINESS
    category: business_temporal
    check: "A TreatmentRecommendation whose status_effective is EXPIRED may not be accepted."
    error_id: ERR_TREATMENT_RECOMMENDATION_EXPIRED
    http_status: 422
    applies_to: "POST /water-service/treatment-recommendations/{treatment_recommendation_id}/accept"
  - priority: 40
    gate: G9_BUSINESS
    category: business_safety
    check: "A CHEMICAL water test with no analyte above its trigger cannot found a treatment recommendation."
    error_id: ERR_NO_TREATMENT_INDICATED
    http_status: 422
    applies_to: "POST /water-service/well-profiles/{well_profile_id}/treatment-recommendations"
  - priority: 41
    gate: G9_BUSINESS
    category: business_safety
    check: "A PUMP quote line's rated_gpm is at least MIN_PUMP_GPM and at most measured_yield_gpm * YIELD_SAFETY_FACTOR."
    error_id: ERR_YIELD_INSUFFICIENT_FOR_PUMP
    http_status: 422
    applies_to: "POST /water-service/quotes/{quote_id}/lines"
  - priority: 42
    gate: G9_BUSINESS
    category: business_referential
    check: "A PUMP quote line requires the well to have a measured_yield_gpm from a COMPLETED inspection."
    error_id: ERR_INSPECTION_REQUIRED
    http_status: 422
    applies_to: "POST /water-service/quotes/{quote_id}/lines"
  - priority: 43
    gate: G9_BUSINESS
    category: business_constraint
    check: "Pricing a quote requires at least one ACTIVE line."
    error_id: ERR_QUOTE_HAS_NO_ACTIVE_LINES
    http_status: 422
    applies_to: "POST /water-service/quotes/{quote_id}/price"
  - priority: 44
    gate: G9_BUSINESS
    category: business_temporal
    check: "The cited inspection completed no more than INSPECTION_VALIDITY_DAYS ago, right-closed."
    error_id: ERR_INSPECTION_STALE
    http_status: 422
    applies_to: "POST /water-service/quotes/{quote_id}/approve"
  - priority: 45
    gate: G9_BUSINESS
    category: business_safety
    check: "At approval, every ACTIVE PUMP line still clears the yield gate; failure takes the mutate-then-reject path L61."
    error_id: ERR_QUOTE_LINE_YIELD_EXCEEDED
    http_status: 409
    applies_to: "POST /water-service/quotes/{quote_id}/approve"
  - priority: 46
    gate: G9_BUSINESS
    category: business_referential
    check: "Creating a work order requires exactly one of quote_id or emergency_ticket_id."
    error_id: ERR_WORK_ORDER_ORIGIN_CONFLICT
    http_status: 422
    applies_to: "POST /water-service/work-orders"
  - priority: 47
    gate: G9_BUSINESS
    category: business_referential
    check: "A work order created from a quote requires that quote to be APPROVED."
    error_id: ERR_QUOTE_NOT_APPROVED
    http_status: 422
    applies_to: "POST /water-service/work-orders"
  - priority: 48
    gate: G9_BUSINESS
    category: business_referential
    check: "An emergency ticket may found at most one work order."
    error_id: ERR_EMERGENCY_TICKET_ALREADY_LINKED
    http_status: 409
    applies_to: "POST /water-service/work-orders"
  - priority: 49
    gate: G9_BUSINESS
    category: business_temporal
    check: "The buffered technician window does not overlap another SCHEDULED or IN_PROGRESS window of the same technician (rule TO-1)."
    error_id: ERR_TECHNICIAN_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /water-service/work-orders/{work_order_id}/schedule"
  - priority: 50
    gate: G9_BUSINESS
    category: business_temporal
    check: "The well already carries WELL_DAILY_WORK_ORDER_CAP other SCHEDULED or IN_PROGRESS work orders in the same UTC calendar day (rule TO-2)."
    error_id: ERR_WELL_SERVICE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /water-service/work-orders/{work_order_id}/schedule"
  - priority: 51
    gate: G9_BUSINESS
    category: business_constraint
    check: "The assigned technician is AVAILABLE."
    error_id: ERR_TECHNICIAN_UNAVAILABLE
    http_status: 409
    applies_to: "POST /water-service/emergency-tickets/{emergency_ticket_id}/dispatch, POST /water-service/inspections/{inspection_id}/start"
  - priority: 52
    gate: G9_BUSINESS
    category: business_safety
    check: "A NON_WELL_CAUSE emergency may not post parts consumption."
    error_id: ERR_NON_WELL_CAUSE_BLOCKS_PARTS
    http_status: 422
    applies_to: "POST /water-service/work-orders/{work_order_id}/parts-consumption"
  - priority: 53
    gate: G9_BUSINESS
    category: business_fiscal
    check: "An emergency work order whose ticket's authorization_status is PENDING may not post parts or complete."
    error_id: ERR_AUTHORIZATION_REQUIRED
    http_status: 402
    applies_to: "POST /water-service/work-orders/{work_order_id}/parts-consumption, POST /water-service/work-orders/{work_order_id}/complete"
  - priority: 54
    gate: G9_BUSINESS
    category: business_fiscal
    check: "Cumulative posted parts plus labor on a PRE_AUTHORIZED emergency work order may not exceed the ticket's preauth_cap_cents."
    error_id: ERR_PREAUTH_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /water-service/work-orders/{work_order_id}/parts-consumption"
  - priority: 55
    gate: G9_BUSINESS
    category: business_constraint
    check: "The catalog part is ACTIVE."
    error_id: ERR_PART_DISCONTINUED
    http_status: 422
    applies_to: "POST /water-service/quotes/{quote_id}/lines, POST /water-service/work-orders/{work_order_id}/parts-consumption"
  - priority: 56
    gate: G9_BUSINESS
    category: business_constraint
    check: "The catalog part has enough on_hand_qty for the requested quantity."
    error_id: ERR_PART_OUT_OF_STOCK
    http_status: 409
    applies_to: "POST /water-service/work-orders/{work_order_id}/parts-consumption"
  - priority: 57
    gate: G9_BUSINESS
    category: business_constraint
    check: "A permit-mandated alternate shares the superseded line's part category."
    error_id: ERR_PART_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /water-service/permits/{permit_id}/approve"
  - priority: 58
    gate: G9_BUSINESS
    category: business_constraint
    check: "quantity does not exceed PART_MAX_LINE_QUANTITY. G8 only checks that quantity is an integer of at least 1; the ceiling of 50 is a G9 business rule, so quantity 51 reaches G9 and raises this error rather than ERR_VALIDATION."
    error_id: ERR_QUANTITY_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /water-service/quotes/{quote_id}/lines, POST /water-service/work-orders/{work_order_id}/parts-consumption"
  - priority: 59
    gate: G9_BUSINESS
    category: business_temporal
    check: "The claimed coverage is in window for the claimed class; failure takes the mutate-then-reject path L62."
    error_id: ERR_CALLBACK_OUT_OF_WARRANTY
    http_status: 409
    applies_to: "POST /water-service/work-orders/{work_order_id}/callback-claims"
  - priority: 60
    gate: G9_BUSINESS
    category: business_constraint
    check: "The original work order's callback_eligibility is not already CONSUMED."
    error_id: ERR_CALLBACK_ALREADY_CONSUMED
    http_status: 409
    applies_to: "POST /water-service/work-orders/{work_order_id}/callback-claims"
  - priority: 61
    gate: G9_BUSINESS
    category: business_constraint
    check: "The coverage has not already been claimed CALLBACK_MAX_PER_COVERAGE times."
    error_id: ERR_CALLBACK_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /water-service/callback-claims/{callback_claim_id}/adjudicate"
  - priority: 62
    gate: G5_ENTITY_STATE
    category: state
    check: "Voiding requires WarrantyCoverage.status == ACTIVE; any other stored status (SUPERSEDED or VOIDED) raises this error."
    error_id: ERR_WARRANTY_ALREADY_SUPERSEDED
    http_status: 409
    applies_to: "POST /water-service/warranty-coverages/{warranty_coverage_id}/void"
  - priority: 63
    gate: G9_BUSINESS
    category: business_referential
    check: "Issuing an invoice requires the linked work order to be COMPLETED."
    error_id: ERR_WORK_ORDER_INVALID_FULFILLMENT_STATE
    http_status: 409
    applies_to: "POST /water-service/invoices/{invoice_id}/issue"
  - priority: 64
    gate: G9_BUSINESS
    category: business_fiscal
    check: "A payment amount is strictly positive. amount_cents == 0 passes G8 (it is not negative) and fails here."
    error_id: ERR_PAYMENT_AMOUNT_INVALID
    http_status: 400
    applies_to: "POST /water-service/invoices/{invoice_id}/payments"
  - priority: 65
    gate: G9_BUSINESS
    category: business_fiscal
    check: "A payment does not exceed the invoice's outstanding amount."
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /water-service/invoices/{invoice_id}/payments"
  - priority: 66
    gate: G9_BUSINESS
    category: business_fiscal
    check: "The owning account is not on credit hold."
    error_id: ERR_ACCOUNT_ON_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /water-service/quotes/{quote_id}/approve, POST /water-service/emergency-tickets/{emergency_ticket_id}/authorize"
  - priority: 67
    gate: G9_BUSINESS
    category: business_constraint
    check: "No ACTIVE agreement already links this well to this account. Checked BEFORE the share-sum rule, so a duplicate is reported as a duplicate even when it would also break the sum."
    error_id: ERR_DUPLICATE_SHARED_WELL_AGREEMENT
    http_status: 409
    applies_to: "POST /water-service/shared-well-agreements"
  - priority: 68
    gate: G9_BUSINESS
    category: business_constraint
    check: "After the write, the ACTIVE shares on the well must not EXCEED 100.00 and must number at most SHARED_WELL_MAX_PARTIES. Under-allocation is permitted at creation time; the exact-100.00 identity is only required for the split to be USED at invoice construction."
    error_id: ERR_SHARED_WELL_SPLIT_INVALID
    http_status: 422
    applies_to: "POST /water-service/shared-well-agreements"
  - priority: 69
    gate: G9_BUSINESS
    category: business_constraint
    check: "A salt delivery does not push salt_remaining_lbs above SALT_TANK_CAPACITY_LBS."
    error_id: ERR_SALT_DELIVERY_EXCEEDS_CAPACITY
    http_status: 422
    applies_to: "POST /water-service/maintenance-plans/{maintenance_plan_id}/salt-deliveries"
  - priority: 70
    gate: G9_BUSINESS
    category: business_temporal
    check: "A filter change is at least FILTER_MIN_DAYS_BETWEEN_CHANGES days after the previous one."
    error_id: ERR_FILTER_CHANGE_TOO_SOON
    http_status: 422
    applies_to: "POST /water-service/maintenance-plans/{maintenance_plan_id}/filter-change"
  - priority: 71
    gate: G9_BUSINESS
    category: business_constraint
    check: "At most one MaintenancePlan whose status is ACTIVE or SUSPENDED exists per well."
    error_id: ERR_PLAN_ALREADY_EXISTS_FOR_WELL
    http_status: 409
    applies_to: "POST /water-service/maintenance-plans"
  - priority: 72
    gate: G9_BUSINESS
    category: business_constraint
    check: "A permit for the same well and scope is not already FILED, APPROVED or APPROVED_WITH_CONDITIONS."
    error_id: ERR_PERMIT_ALREADY_ON_FILE
    http_status: 409
    applies_to: "POST /water-service/permits/{permit_id}/file"
  - priority: 73
    gate: G9_BUSINESS
    category: business_constraint
    check: "An emergency ticket whose property is OUT_OF_AREA cannot be triaged."
    error_id: ERR_OUT_OF_SERVICE_AREA
    http_status: 422
    applies_to: "POST /water-service/emergency-tickets/{emergency_ticket_id}/triage"
  - priority: 74
    gate: G9_BUSINESS
    category: business_referential
    check: "A remedy work order may only be raised from a claim in APPROVED_WARRANTY that has no remedy yet."
    error_id: ERR_CALLBACK_CLAIM_INVALID_STATE
    http_status: 409
    applies_to: "POST /water-service/callback-claims/{callback_claim_id}/remedy-work-order"

endpoints:
  # ---------- system / clock ----------
  - method: POST
    path: "/water-service/_clock/set_current_utc"
    description: |
      Sets the server's logical clock. The clock starts at exactly
      2026-05-01T00:00:00Z on server start and MUST NOT fall back to real wall-clock
      time. The clock may only move forward or stay put; a backward move is rejected
      with ERR_CLOCK_BACKWARD.
    roles: [PlatformAdmin]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["to_iso8601"]
    output: { current_utc: datetime, previous_utc: datetime }
    side_effects: ["advances the logical clock used by every datetime derivation"]
  - method: GET
    path: "/water-service/_clock"
    description: "Reads the current logical clock."
    roles: [PlatformAdmin, Dispatcher, Estimator, Technician, ComplianceOfficer, BillingClerk, CustomerContact]
    code: 200
    gates: [G1_AUTH, G2_ROLE]
    input: []
    output: { current_utc: datetime }
    side_effects: []

  # ---------- accounts ----------
  - method: POST
    path: "/water-service/accounts"
    description: "Creates a billing account."
    roles: [PlatformAdmin]
    code: 201
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["legal_name", "billing_jurisdiction_code", "contact_email", "membership_tier?"]
    output: Account
    side_effects: ["balance_cents 0, lifetime_invoiced_cents 0, lifetime_paid_cents 0, credit_hold false, membership_tier defaults to NONE"]
  - method: GET
    path: "/water-service/accounts/{account_id}"
    description: "Reads one account."
    roles: [PlatformAdmin, BillingClerk, Estimator, Dispatcher, CustomerContact]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G4_SCOPE]
    input: []
    output: Account
    side_effects: []
  - method: GET
    path: "/water-service/accounts"
    description: "Lists accounts, newest last (created_at ASC)."
    roles: [PlatformAdmin, BillingClerk]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["membership_tier?", "credit_hold?", "limit?", "offset?"]
    output: Account[]
    side_effects: []
  - method: PATCH
    path: "/water-service/accounts/{account_id}"
    description: "Changes an account's membership tier."
    roles: [PlatformAdmin]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G8_PAYLOAD]
    input: ["membership_tier"]
    output: Account
    side_effects: ["increments Account.version by 1; does NOT retroactively change any EmergencyTicket.membership_tier_at_intake"]
  - method: GET
    path: "/water-service/accounts/{account_id}/invoices"
    description: "Reverse-reachability read: every invoice of this account."
    roles: [PlatformAdmin, BillingClerk, CustomerContact]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G4_SCOPE, G8_PAYLOAD]
    input: ["limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  # ---------- properties ----------
  - method: POST
    path: "/water-service/properties"
    description: "Creates a serviced property under an account."
    roles: [PlatformAdmin, Dispatcher]
    code: 201
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD, G9_BUSINESS]
    input: ["account_id", "address_line", "jurisdiction_code", "distance_miles", "household_size", "has_vulnerable_occupant?"]
    output: Property
    side_effects: ["computes service_zone from distance_miles"]
  - method: GET
    path: "/water-service/properties/{property_id}"
    description: "Reads one property."
    roles: [PlatformAdmin, Dispatcher, Estimator, Technician, BillingClerk, CustomerContact]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE]
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/water-service/properties"
    description: "Lists properties with optional foreign-key filters."
    roles: [PlatformAdmin, Dispatcher, Estimator, BillingClerk]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["account_id?", "jurisdiction_code?", "service_zone?", "limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: GET
    path: "/water-service/properties/{property_id}/well-profiles"
    description: "Reverse-reachability read: every well profile on this property."
    roles: [PlatformAdmin, Dispatcher, Estimator, Technician, ComplianceOfficer]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G8_PAYLOAD]
    input: ["limit?", "offset?"]
    output: WellProfile[]
    side_effects: []

  # ---------- well profiles ----------
  - method: POST
    path: "/water-service/well-profiles"
    description: "Creates a well profile. duty_cycle_ratio and duty_cycle_class are derived immediately from pressure_tank_drawdown_gallons."
    roles: [PlatformAdmin, Dispatcher]
    code: 201
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD, G9_BUSINESS]
    input: ["property_id", "jurisdiction_code", "well_type", "depth_feet", "pressure_tank_drawdown_gallons?"]
    output: WellProfile
    side_effects: ["computes duty_cycle_ratio and duty_cycle_class; potability_status starts at UNKNOWN"]
  - method: GET
    path: "/water-service/well-profiles/{well_profile_id}"
    description: "Reads one well profile."
    roles: [PlatformAdmin, Dispatcher, Estimator, Technician, ComplianceOfficer, CustomerContact]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE]
    input: []
    output: WellProfile
    side_effects: []
  - method: GET
    path: "/water-service/well-profiles"
    description: "Lists well profiles with optional foreign-key filters."
    roles: [PlatformAdmin, Dispatcher, Estimator, Technician, ComplianceOfficer]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["property_id?", "potability_status?", "duty_cycle_class?", "limit?", "offset?"]
    output: WellProfile[]
    side_effects: []
  - method: POST
    path: "/water-service/well-profiles/{well_profile_id}/pressure-tank-replacement"
    description: "Records a pressure-tank replacement outside a work order, re-deriving the duty cycle and every dependent maintenance interval (SEAM-03)."
    roles: [PlatformAdmin, Technician]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G8_PAYLOAD]
    input: ["new_drawdown_gallons"]
    output: WellProfile
    side_effects:
      - "sets pressure_tank_drawdown_gallons, re-derives duty_cycle_ratio then duty_cycle_class"
      - "recomputes interval_days_as_operated and next_due_at on every ACTIVE MaintenancePlan of this well, leaving interval_days_as_designed and any OVERDUE latch untouched"
      - "increments WellProfile.version and each touched MaintenancePlan.version by 1"
  - method: GET
    path: "/water-service/well-profiles/{well_profile_id}/maintenance-plans"
    description: "Reverse-reachability read: maintenance plans on this well."
    roles: [PlatformAdmin, Dispatcher, Technician, CustomerContact]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G8_PAYLOAD]
    input: ["limit?", "offset?"]
    output: MaintenancePlan[]
    side_effects: []
  - method: POST
    path: "/water-service/well-profiles/{well_profile_id}/treatment-recommendations"
    description: "Creates a treatment recommendation from a CHEMICAL water test. Carries OCC on the well profile."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 201
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G7_OCC, G8_PAYLOAD, G9_BUSINESS]
    input: ["water_test_id", "expected_well_profile_version"]
    output: TreatmentRecommendation
    side_effects:
      - "selects recommended_media, sizes a softener when indicated, sets expires_at from the test's sample_datetime"
      - "sets every earlier PROPOSED or ACCEPTED recommendation on this well to SUPERSEDED with superseded_by_id"
      - "increments WellProfile.version by 1"

  # ---------- shared well agreements ----------
  - method: POST
    path: "/water-service/shared-well-agreements"
    description: "Adds an account to a shared well with a percentage share."
    roles: [PlatformAdmin, BillingClerk]
    code: 201
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD, G9_BUSINESS]
    input: ["well_profile_id", "account_id", "split_pct"]
    output: SharedWellAgreement
    side_effects: ["ACTIVE shares on the well must total exactly 100.00 after the write"]
  - method: GET
    path: "/water-service/shared-well-agreements/{shared_well_agreement_id}"
    description: "Reads one shared-well agreement."
    roles: [PlatformAdmin, BillingClerk, CustomerContact]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE]
    input: []
    output: SharedWellAgreement
    side_effects: []
  - method: GET
    path: "/water-service/shared-well-agreements"
    description: "Lists shared-well agreements with optional foreign-key filters."
    roles: [PlatformAdmin, BillingClerk]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["well_profile_id?", "account_id?", "status?", "limit?", "offset?"]
    output: SharedWellAgreement[]
    side_effects: []
  - method: POST
    path: "/water-service/shared-well-agreements/{shared_well_agreement_id}/terminate"
    description: "Terminates a shared-well agreement."
    roles: [PlatformAdmin]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE]
    input: []
    output: SharedWellAgreement
    side_effects: ["sets status TERMINATED; increments version by 1. The 100.00 identity is only enforced on creation, so termination may leave the well under-allocated."]

  # ---------- technicians ----------
  - method: POST
    path: "/water-service/technicians"
    description: "Creates a technician. The returned id is the X-User-ID a Technician actor presents."
    roles: [PlatformAdmin]
    code: 201
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["full_name", "tier", "home_jurisdiction_code", "status?"]
    output: Technician
    side_effects: []
  - method: GET
    path: "/water-service/technicians/{technician_id}"
    description: "Reads one technician."
    roles: [PlatformAdmin, Dispatcher, Technician, ComplianceOfficer]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE]
    input: []
    output: Technician
    side_effects: []
  - method: GET
    path: "/water-service/technicians"
    description: "Lists technicians."
    roles: [PlatformAdmin, Dispatcher]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["tier?", "status?", "home_jurisdiction_code?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []
  - method: PATCH
    path: "/water-service/technicians/{technician_id}"
    description: "Changes a technician's availability."
    roles: [PlatformAdmin, Dispatcher]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G8_PAYLOAD]
    input: ["status"]
    output: Technician
    side_effects: ["increments Technician.version by 1"]

  # ---------- part catalog ----------
  - method: POST
    path: "/water-service/part-catalog-items"
    description: "Creates a catalog part."
    roles: [PlatformAdmin]
    code: 201
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["part_number", "category", "unit_cost_cents", "rated_gpm?", "rated_drawdown_gallons?", "grain_capacity?", "media_kind?", "on_hand_qty?", "status?"]
    output: PartCatalogItem
    side_effects: ["on_hand_qty defaults to 0; media_kind defaults to NONE; status defaults to ACTIVE"]
  - method: GET
    path: "/water-service/part-catalog-items/{part_catalog_item_id}"
    description: "Reads one catalog part."
    roles: [PlatformAdmin, Estimator, Technician, Dispatcher, ComplianceOfficer]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE]
    input: []
    output: PartCatalogItem
    side_effects: []
  - method: GET
    path: "/water-service/part-catalog-items"
    description: "Lists catalog parts."
    roles: [PlatformAdmin, Estimator, Technician, Dispatcher]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["category?", "media_kind?", "status?", "limit?", "offset?"]
    output: PartCatalogItem[]
    side_effects: []
  - method: PATCH
    path: "/water-service/part-catalog-items/{part_catalog_item_id}"
    description: "Changes a catalog part's cost, stock or availability. Cost changes do NOT disturb pinned quote lines."
    roles: [PlatformAdmin]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G8_PAYLOAD]
    input: ["unit_cost_cents?", "on_hand_qty?", "status?"]
    output: PartCatalogItem
    side_effects: ["increments PartCatalogItem.version by 1"]

  # ---------- inspections ----------
  - method: POST
    path: "/water-service/inspections"
    description: "Schedules a well inspection."
    roles: [Dispatcher, PlatformAdmin]
    code: 201
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD, G9_BUSINESS]
    input: ["well_profile_id", "technician_id", "scheduled_for"]
    output: Inspection
    side_effects: ["status starts at SCHEDULED"]
  - method: GET
    path: "/water-service/inspections/{inspection_id}"
    description: "Reads one inspection."
    roles: [PlatformAdmin, Dispatcher, Estimator, Technician]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE]
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/water-service/inspections"
    description: "Lists inspections with optional foreign-key filters."
    roles: [PlatformAdmin, Dispatcher, Estimator, Technician]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["well_profile_id?", "technician_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/water-service/inspections/{inspection_id}/start"
    description: "Technician starts the inspection."
    roles: [Technician]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G4_SCOPE, G5_ENTITY_STATE, G9_BUSINESS]
    input: []
    output: Inspection
    side_effects: ["increments Inspection.version by 1"]
  - method: POST
    path: "/water-service/inspections/{inspection_id}/complete"
    description: "Technician completes the inspection and records the three measurements, firing CASCADE-C-1."
    roles: [Technician]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G4_SCOPE, G5_ENTITY_STATE, G8_PAYLOAD]
    input: ["measured_yield_gpm", "static_level_feet", "observed_drawdown_gallons"]
    output: Inspection
    side_effects:
      - "CASCADE-C-1 hops 1-5: well measured_yield_gpm and drawdown, duty_cycle_ratio, duty_cycle_class, plan interval_days_as_operated, plan next_due_at"
      - "increments Inspection.version, WellProfile.version and each touched MaintenancePlan.version by 1"
  - method: POST
    path: "/water-service/inspections/{inspection_id}/cancel"
    description: "Cancels a SCHEDULED or IN_PROGRESS inspection."
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE]
    input: []
    output: Inspection
    side_effects: ["increments Inspection.version by 1"]

  # ---------- water tests ----------
  - method: POST
    path: "/water-service/water-tests"
    description: "Records a collected water sample."
    roles: [Technician, ComplianceOfficer, PlatformAdmin]
    code: 201
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD, G9_BUSINESS]
    input: ["well_profile_id", "collected_by_technician_id", "panel_type", "sample_datetime"]
    output: WaterTest
    side_effects: ["result_status starts at COLLECTED; parent_test_id is null"]
  - method: GET
    path: "/water-service/water-tests/{water_test_id}"
    description: "Reads one water test."
    roles: [PlatformAdmin, ComplianceOfficer, Technician, Estimator, CustomerContact]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE]
    input: []
    output: WaterTest
    side_effects: []
  - method: GET
    path: "/water-service/water-tests"
    description: "Lists water tests with optional foreign-key filters, including the self-referential parent_test_id."
    roles: [PlatformAdmin, ComplianceOfficer, Technician, Estimator]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["well_profile_id?", "collected_by_technician_id?", "parent_test_id?", "panel_type?", "result_status?", "limit?", "offset?"]
    output: WaterTest[]
    side_effects: []
  - method: POST
    path: "/water-service/water-tests/{water_test_id}/lab-result"
    description: "Records the laboratory analysis. Routes to INVALID_HOLD_TIME, ANALYZED_NEGATIVE, ANALYZED_PRESUMPTIVE_POSITIVE or ANALYZED_CHEMICAL_EXCEEDANCE per L56-L58."
    roles: [ComplianceOfficer]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE, G8_PAYLOAD]
    input: ["analyzed_at", "coliform_present?", "nitrate_mg_l?", "arsenic_mg_l?", "lead_mg_l?", "iron_mg_l?", "hardness_gpg?"]
    output: WaterTest
    side_effects:
      - "stores recorded_by_user_id from X-User-ID and hold_time_valid"
      - "may move WellProfile.potability_status and copy hardness_gpg onto the well"
      - "increments WaterTest.version and, when the well moved, WellProfile.version by 1"
  - method: POST
    path: "/water-service/water-tests/{water_test_id}/confirmatory-result"
    description: |
      Records the confirmatory retest of a presumptive-positive bacteriological
      panel. MUTATE-THEN-REJECT (L60): a confirming outcome writes the confirmation
      durably and THEN returns 422 ERR_RETEST_CONFIRMED_POSITIVE.
    roles: [ComplianceOfficer]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE, G6_REGULATORY, G8_PAYLOAD, G9_BUSINESS]
    input: ["confirm_sample_datetime", "confirm_analyzed_at", "confirm_coliform_present", "collected_by_technician_id"]
    output: WaterTest
    side_effects:
      - "creates a child WaterTest with parent_test_id set to this test"
      - "latches this test to CLEARED_NEGATIVE or CONFIRMED_POSITIVE and stores confirmed_by_user_id"
      - "moves WellProfile.potability_status to SAFE or UNSAFE"
      - "increments WaterTest.version and WellProfile.version by 1"
  - method: POST
    path: "/water-service/water-tests/{water_test_id}/lapse-retest-window"
    description: "Compliance sweep: latches a presumptive positive whose retest window has closed with no confirmatory sample (fail-safe latch, SEAM-01)."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G5_ENTITY_STATE, G9_BUSINESS]
    input: []
    output: WaterTest
    side_effects:
      - "requires clock - sample_datetime > RETEST_WINDOW_DAYS days, STRICTLY greater; a call made while the window is still open fails at G9 with ERR_RETEST_WINDOW_STILL_OPEN and writes nothing"
      - "sets result_status CONFIRMED_POSITIVE and WellProfile.potability_status UNSAFE with advisory_reason RETEST_WINDOW_LAPSED"
      - "increments WaterTest.version and WellProfile.version by 1"
  - method: GET
    path: "/water-service/water-tests/{water_test_id}/treatment-recommendations"
    description: "Reverse-reachability read: recommendations founded on this test."
    roles: [PlatformAdmin, ComplianceOfficer, Estimator, CustomerContact]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE, G8_PAYLOAD]
    input: ["limit?", "offset?"]
    output: TreatmentRecommendation[]
    side_effects: []

  # ---------- treatment recommendations ----------
  - method: GET
    path: "/water-service/treatment-recommendations/{treatment_recommendation_id}"
    description: "Reads one treatment recommendation, including its as-of status_effective."
    roles: [PlatformAdmin, ComplianceOfficer, Estimator, CustomerContact]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G3_PATH_EXISTENCE]
    input: []
    output: TreatmentRecommendation
    side_effects: []
  - method: GET
    path: "/water-service/treatment-recommendations"
    description: "Lists treatment recommendations with optional foreign-key filters, including the self-referential superseded_by_id."
    roles: [PlatformAdmin, ComplianceOfficer, Estimator, CustomerContact]
    code: 200
    gates: [G1_AUTH, G2_ROLE, G8_PAYLOAD]
    input: ["well_profile_id?", "water_test_id?", "superseded_by_id?", "status?", "limit?", "offset?"]
    output: TreatmentRecommendation[]
    side_effects: []
