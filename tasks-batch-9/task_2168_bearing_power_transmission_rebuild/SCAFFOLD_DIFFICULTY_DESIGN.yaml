      - name: asset_changeover_buffer_inclusive_at_exactly_twenty_four_hours
        grounds:
          - calculations.installation_changeover_admission
          - errors[ERR_INSTALL_BUFFER_VIOLATION]
          - entities.Installation.fields.removed_at
          - state_machines.Installation.RUNNING_to_REMOVED_PLANNED
        distinguishing_aspect: |
          Interval semantics 2, on the CustomerAsset resource and geometrically
          different from the bench rule: a CLOSED, capacity-one occupancy with a
          24-hour changeover buffer measured forward from removed_at. One second
          short of the buffer is rejected; the instant exactly 24 hours after
          removal is admitted, because the buffer edge is inclusive.
        test_recipe:
          setup:
            - "A delivered rebuild installed on the asset at 2026-08-10T00:00:00Z and removed as planned at 2026-08-12T00:00:00Z."
            - "The same shipped core and delivered order remain available for re-installation."
          setup_api_calls:
