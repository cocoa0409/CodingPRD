      - name: refund_admin_cannot_issue_pass
        claim_type: rbac_denial
        grounds:
          - roles.RefundAdmin
          - roles.ResortOps
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
          - endpoints.POST_/passes
        distinguishing_aspect: "POST /passes as RefundAdmin (a ResortOps-exclusive op) returns ERR_FORBIDDEN_ROLE (403)."
