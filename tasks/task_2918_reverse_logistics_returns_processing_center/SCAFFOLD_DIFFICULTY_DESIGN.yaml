            - "Order 3 (12:00-14:00) returns 409 ERR_CHANNEL_WINDOW_CAPACITY_EXCEEDED — it overlaps BOTH existing PROPOSED orders (order 1 at the 12:00 endpoint, order 2 across 12:00-14:00), so admission is 1 + 2 == 3 > 2"
            - "After the rejection GET /disposition-orders?channel_id=${ch_id} returns total_count 2, and ReturnLine.${line_3}.disposition_state is still DISPOSITION_ASSIGNED with Client.units_reserved_for_disposition == 2 and units_in_process == 1"
            - "Each existing order is individually admissible against an empty channel, which is what makes this an aggregate rather than a pairwise rule"

  # ===================================================================== #
  # RULE 9 — compensating_invariant                                       #
  # Conserved quantity 1: physical UNITS (received == in_process +         #
  #   reserved + dispositioned), compensated by disposition-order cancel.  #
  # Conserved quantity 2: MONEY (settlement balance == sum of ledger       #
  #   buckets), compensated by refund reversal.                           #
  # ===================================================================== #
  - rule_id: compensating_invariant
    instances:
      - name: unit_conservation_survives_disposition_order_cancel
        grounds:
          - calculations.disposition_audit_report
          - entities.Client.fields.units_reserved_for_disposition
          - endpoints[POST /disposition-orders]
          - endpoints[POST /disposition-orders/{disposition_order_id}/cancel]
          - endpoints[GET /clients/{client_id}/disposition-audit]
        distinguishing_aspect: |
          The conserved quantity is PHYSICAL UNITS: units_received must always equal
          units_in_process + units_reserved_for_disposition + units_dispositioned, and the
          compensating action is POST /disposition-orders/{id}/cancel, which moves the 2 reserved
          units back to work-in-process and writes no ledger row at all, so
          settlement_balance_cents is provably untouched at 0 throughout. The money instance conserves
          cents through a refund reversal that DOES write a ledger row.
        test_recipe:
          setup:
            - "Client CLUNIT with default rules (restock_grade_floor A, liquidation_floor_pct 0.30, donation_allowed false, fraud_tolerance_cents 100000000, max_refund_exposure_cents 100000000) and CatalogItem WIDGET-1 (declared_value_cents 20000, unit_weight_grams 1200)."
            - "An AUCTION channel (fee_pct 0.12, accepted_grades A/B/C/D, min_lot_value_cents 0, concurrent_lot_capacity 5)."
            - "One RMA with a single authorized line of QUANTITY 2, received on one receipt weighing exactly 200 + 1200 * 2 == 2600 grams, then graded C: per-unit provisional recovery 7200 gives recovery_value_cents 14400 and disposition LIQUIDATE."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Unit Conservation Client", client_code: "CLUNIT", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 100000000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000, hazard_class: "NONE", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /secondary-market-channels"
              payload: { name: "Alpha Auction", channel_code: "AUC1", channel_type: "AUCTION", accepted_grades: ["A", "B", "C", "D"], fee_pct: 0.12, hazard_certified: false, recall_certified: false, min_lot_value_cents: 0, concurrent_lot_capacity: 5 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { ch_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-1021", customer_reference: "CUST-21", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 2, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_line_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-21", gross_weight_grams: 2600 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rma_line_id}", quantity: 2, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line_id: $.data.id }
            - call: "POST /return-lines/${line_id}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
              captures: { line_ver: $.data.version }
          trigger:
            - call: "GET /clients/${c_id}/disposition-audit"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /disposition-orders"
              payload: { return_line_id: "${line_id}", expected_return_line_version: "${line_ver}", channel_id: "${ch_id}" }
              as: DispositionSupervisor
              as_user_id: "u_super"
              captures: { ord_id: $.data.id }
            - call: "GET /clients/${c_id}/disposition-audit"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /disposition-orders/${ord_id}/cancel"
              payload: { cancel_reason: "Buyer withdrew from the lot" }
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "GET /clients/${c_id}/disposition-audit"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
          assert:
            - "Checkpoint 1 (after grading): units_received 2, units_in_process 2, units_reserved_for_disposition 0, units_dispositioned 0, unit_conservation_ok true"
            - "The created order carries quantity 2 and unit_price_cents 7200 (round_half_up(14400 / 2 * 1.0), above the 1000 secondary-market floor)"
            - "Checkpoint 2 (after the order is PROPOSED): units_received 2, units_in_process 0, units_reserved_for_disposition 2, units_dispositioned 0, unit_conservation_ok STILL true — reservation moves units between buckets without creating or destroying any"
            - "Checkpoint 2 also shows settlement_balance_cents 0 but projected_settlement_balance_cents 10922 (projected net 14400 - round_half_up(14400 * 0.18) == 2592 gives 11808, less round_half_up(11808 * 0.075) == 886), proving the in-flight order is visible only to the projection"
            - "Checkpoint 3 (after cancel): units_received 2, units_in_process 2, units_reserved_for_disposition 0, units_dispositioned 0 — the exact bucket distribution of checkpoint 1 is restored, unit_conservation_ok true"
            - "Checkpoint 3 shows settlement_balance_cents 0 AND projected_settlement_balance_cents 0, and GET /shrink-ledger-entries?client_id=${c_id} returns total_count 0 — the compensation left no ledger residue and no drift"
            - "DispositionOrder.${ord_id}.status == CANCELLED and ReturnLine.${line_id}.disposition_state is back to being orderable at DISPOSITION_ASSIGNED"

      - name: settlement_balance_conservation_survives_refund_reversal
        grounds:
          - calculations.shrink_ledger_entry_amount
          - calculations.client_settlement_balance
          - endpoints[POST /return-lines/{return_line_id}/release-refund]
          - endpoints[POST /return-lines/{return_line_id}/reverse-refund]
          - endpoints[GET /clients/{client_id}/disposition-audit]
        distinguishing_aspect: |
          The conserved quantity is MONEY in integer cents: the REVERSAL entry is exactly
          +net_refund_cents against the REFUND_DEBIT's -net_refund_cents, so the settlement balance
          returns to precisely 20350 with zero drift even though the reversal is a new immutable row
          rather than a deletion, and money_conservation_ok holds at every checkpoint. The unit
          instance conserves physical units and its compensation writes no ledger row whatsoever.
        test_recipe:
          setup:
            - "Client CLMONEY with default rules and refund_hold_hours 48; CatalogItem WIDGET-1 (declared_value_cents 20000, unit_weight_grams 1200)."
            - "An AUCTION channel (fee_pct 0.12, accepted_grades A/B/C/D, min_lot_value_cents 0, concurrent_lot_capacity 5)."
            - "One line (quantity 1, reason DEFECTIVE) received on a 1400-gram receipt, graded C -> LIQUIDATE, ordered, approved and EXECUTED at a realized unit price of 25000, which lands the gross lot exactly on the MID_LOT band floor."
            - "The clock is then advanced to 2026-08-04T00:00:00Z, past the 48-hour hold that started at execution."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Money Conservation Client", client_code: "CLMONEY", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 100000000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
