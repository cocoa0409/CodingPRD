              payload: { full_name: "O", date_of_birth: "1980-01-01", payer_policy_id: "${ppo}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { pato: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${pato}", device_serial: "SN-O", device_model: "Airsense-11", acquisition_type: "RENTAL" }
              as: IntakeCoordinator
              captures: { deo: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${deo}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${deo}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            # first dispense
            - call: "GET /sleep-therapy/component-supply-plans"
              payload: { patient_id: "${pato}", component_type: "MASK" }
              as: OpsAdmin
              captures: { mo: "$.data[0].id" }
            - call: "GET /sleep-therapy/patients/${pato}"
              payload: {}
              as: OpsAdmin
              captures: { pato_v1: $.data.version }
            - call: "POST /sleep-therapy/resupply-orders"
              payload: { patient_id: "${pato}", component_supply_plan_id: "${mo}", requested_quantity: 1, expected_patient_version: "${pato_v1}" }
              as: IntakeCoordinator
              captures: { roo1: $.data.id }
            - call: "POST /sleep-therapy/resupply-orders/${roo1}/clinical-clear"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/resupply-orders/${roo1}/authorize"
              payload: { expected_patient_version: "${pato_v1}" }
              as: BillingSpecialist
            - call: "GET /sleep-therapy/patients/${pato}"
              payload: {}
              as: OpsAdmin
              captures: { pato_v2: $.data.version }
            - call: "POST /sleep-therapy/resupply-orders/${roo1}/ship"
              payload: { expected_patient_version: "${pato_v2}" }
              as: IntakeCoordinator
            # finalize a non-compliant report (patient goes NON_COMPLIANT_HOLD)
            - call: "POST /sleep-therapy/adherence-reports"
              payload: { patient_id: "${pato}", device_enrollment_id: "${deo}", window_end_on: "2026-08-30", nights_reported: 30, compliant_nights: 10 }
              as: RespiratoryTherapist
              captures: { aro: $.data.id }
            - call: "POST /sleep-therapy/adherence-reports/${aro}/begin-review"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/adherence-reports/${aro}/finalize"
              payload: {}
              as: RespiratoryTherapist
            # finalize a compliant report to bring patient back to ACTIVE but still non-compliant vs threshold? No — finalize compliant to resume, then finalize another non-compliant to set is_compliance_current=false while patient_status=ACTIVE.
            # Simpler: leave patient NON_COMPLIANT_HOLD. But order creation is then blocked at priority 5. We need to test priority 11 (compliance gate at clinical-clear) specifically.
            # Workaround: resume compliance (so patient ACTIVE) then create an order, then finalize a non-compliant report (patient back to HOLD), then try clinical-clear on the already-created order.
            - call: "POST /sleep-therapy/adherence-reports"
              payload: { patient_id: "${pato}", device_enrollment_id: "${deo}", window_end_on: "2026-09-15", nights_reported: 30, compliant_nights: 28 }
              as: RespiratoryTherapist
              captures: { aro2: $.data.id }
            - call: "POST /sleep-therapy/adherence-reports/${aro2}/begin-review"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/adherence-reports/${aro2}/finalize"
              payload: {}
              as: RespiratoryTherapist
            # now patient ACTIVE, compliance current. Advance past mask cadence and create a new order.
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: OpsAdmin
            - call: "GET /sleep-therapy/patients/${pato}"
              payload: {}
              as: OpsAdmin
              captures: { pato_v3: $.data.version }
            - call: "POST /sleep-therapy/resupply-orders"
              payload: { patient_id: "${pato}", component_supply_plan_id: "${mo}", requested_quantity: 1, expected_patient_version: "${pato_v3}" }
              as: IntakeCoordinator
              captures: { roo2: $.data.id }
            # now finalize a non-compliant report to flip is_compliance_current=false (patient -> HOLD)
            - call: "POST /sleep-therapy/adherence-reports"
              payload: { patient_id: "${pato}", device_enrollment_id: "${deo}", window_end_on: "2026-11-15", nights_reported: 30, compliant_nights: 5 }
              as: RespiratoryTherapist
              captures: { aro3: $.data.id }
            - call: "POST /sleep-therapy/adherence-reports/${aro3}/begin-review"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/adherence-reports/${aro3}/finalize"
              payload: {}
              as: RespiratoryTherapist
          trigger:
            - call: "POST /sleep-therapy/resupply-orders/${roo2}/clinical-clear"
              payload: {}
              as: RespiratoryTherapist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_COMPLIANCE_NOT_CURRENT'"

