      - name: authorization_precondition_on_parent_plan_state
        claim_type: precondition_enforcement
        excluded_because:
          difficulty_instance: authorization_create_blocked_by_ifsp_amendment_pending
          rationale: >-
            The §1.8 instance already drives the guarded cross-entity precondition of
            IFSPService[PLANNED -> AUTHORIZED] — parent IFSP must be ACTIVE — by putting the plan in
            AMENDMENT_PENDING and asserting ERR_IFSP_STATE_INVALID, then re-consenting and retrying
            successfully. A second §1.9 test of the same precondition would only duplicate it.

      - name: visit_operational_and_fiscal_dimensions_move_independently
        claim_type: parallel_state_dimensions
        excluded_because:
          difficulty_instance: service_visit_parallel_status_dimensions_independent
          rationale: >-
            The parallel state_machine_shape claim — visit_status and billing_status advance on the
            same trigger but along independent axes, so DELIVERED can pair with ACCRUED, EXEMPT or
            CAPPED and VOIDED with REVERSED — is exactly what that §1.8 instance asserts across four
            visits in one scenario.

      - name: referral_service_gap_flag_derived_from_child_line_states
        claim_type: compound_derived_parent_state
        excluded_because:
          difficulty_instance: provider_suspension_cascade_to_service_at_risk
          rationale: >-
            Referral.service_gap_flag is the compound-shape derivation (true iff some line on the
            ACTIVE plan is AT_RISK). The §1.8 cascade instance drives it from false to true through
            the five-hop provider-suspension chain and re-derives it, which subsumes a standalone
            compound test.

      - name: revoke_compensates_the_authorization_unit_pool
        claim_type: compensation
        excluded_because:
          difficulty_instance: service_unit_pool_conserved_across_authorize_revoke
          rationale: >-
            The compensation side-effect pattern for units — revoke returns units_remaining to the
            line's pool with no drift across an authorize/revoke/re-authorize cycle — is the whole
            subject of that §1.8 conservation instance.

      - name: cost_share_ledger_stays_synced_with_visit_accruals
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: family_ledger_conserved_across_accrual_and_void
          rationale: >-
            The ledger-sync pattern (visit state change updates the ancestor CostShare's
            month_accrued_cents and family_balance_cents, and the identity
            total_assessed_cents == family_balance_cents + family_waived_cents reconciles before and
            after) is asserted end-to-end by that §1.8 instance.

  # ===========================================================================
  # SECTION 3 — calculations (§1.3)
  # ===========================================================================
  - section: calculations
    instances:

      - name: timeline_gross_and_net_variants_diverge_on_the_same_case
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: timeline_gross_vs_net_divergence
          rationale: >-
            calculations.initial_timeline_elapsed_days declares GROSS and NET variants, and the §1.8
            instance already builds a case where documented family-unavailable days push the two
            apart (gross MISSED, net MET) and asserts both numbers plus the persisted
            initial_timeline_status from the NET variant only.

      - name: cost_share_variant_selected_by_lifecycle_stage
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: cost_share_provisional_vs_final_fee_divergence
          rationale: >-
            Which variant of calculations.family_cost_share applies where — PROVISIONAL from declared
            income at POST /ei/cost-shares with no insurance offset, FINAL from verified income at
            finalize with the 60% offset — is the exact subject of that §1.8 instance, including the
            rule that already-accrued visits are not retroactively re-priced.

      - name: cost_share_rounds_each_line_before_summation
        claim_type: precision
        excluded_because:
          difficulty_instance: cost_share_per_line_rounding_before_sum
          rationale: >-
            The normative per-line round_half_up-then-sum ordering (and the cent of divergence from a
            sum-then-round implementation) is asserted by that §1.8 instance with three service lines
            chosen so the two orderings differ.

      - name: case_weight_clamped_after_the_additive_sum
        claim_type: constants_applied
        excluded_because:
          difficulty_instance: caseload_weight_nonlinear_clamp
          rationale: >-
            The weighted_scoring boundary behaviour — every additive term applied first, then the
            MIN/MAX clamp, so a case with interpreter plus transition-window plus multi-service adds
            lands on MAX_CASE_WEIGHT_POINTS 3.00 rather than 3.25 — is covered by that §1.8 instance.

      - name: cost_share_tier_ceilings_are_inclusive_upper_bounds
        claim_type: correct_result
        grounds:
          - calculations.family_cost_share
          - entities.CostShare.fields.tier_code
          - endpoints[POST /ei/cost-shares]
        distinguishing_aspect: |
          Four determinations on the same household size (4, threshold 3 245 000 cents) land exactly
          on three tier ceilings and just past the last one: 250.0 -> TIER_0 (rate 0.00, cap 0, fee 0),
          400.0 -> TIER_1 (0.05, cap 12 000, fee 2 600), 600.0 -> TIER_2 (0.10, cap 30 000, fee 5 200)
          and 616.3 -> TIER_3 (0.15, cap 60 000, fee 7 800). An exclusive-bound implementation would
          push each of the first three into the next tier up.
        test_recipe:
          setup:
            - "An ACTIVE_SERVICES referral with a single SPEECH_THERAPY line at 4 sessions x 2 units x 6 500 cents."
            - "The clock is advanced one month between determinations so each new effective_month supersedes the previous row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 12.00 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref_id: $.data.id }
            - call: "POST /ei/referrals/${ref_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-03-10", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL", "ADAPTIVE"] }
              as: Evaluator
              captures: { eval_id: $.data.id }
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "FAMILY_ASSESSMENT", scheduled_date: "2026-03-19", setting_code: "HOME" }
              as: Evaluator
              captures: { fam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-20T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/assessments/${eval_id}/complete"
              payload: { completion_date: "2026-03-18", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/assessments/${fam_id}/complete"
              payload: { completion_date: "2026-03-19", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/referrals/${ref_id}/eligibility-determination"
              payload: { is_eligible: true, determination_date: "2026-03-20" }
              as: ProgramAdmin
            - call: "POST /ei/referrals/${ref_id}/entry-outcomes"
              payload: { measurement_date: "2026-03-20", rating_social: 3, rating_knowledge: 4, rating_needs: 3 }
              as: Evaluator
            - call: "GET /ei/referrals/${ref_id}"
              as: ProgramAdmin
              captures: { ref_v: $.data.version }
            - call: "POST /ei/ifsps"
              payload: { referral_id: "${ref_id}", ifsp_type: "INITIAL", meeting_date: "2026-03-20", authoring_coordinator_id: "${coord_id}", expected_referral_version: "${ref_v}" }
              as: ProgramAdmin
              captures: { ifsp_id: $.data.id }
            - call: "POST /ei/ifsp-services"
              payload: { ifsp_id: "${ifsp_id}", service_type: "SPEECH_THERAPY", setting_code: "HOME", frequency_per_month: 4, units_per_session: 2, unit_rate_cents: 6500, planned_units_total: 96 }
              as: ProgramAdmin
              captures: { line_id: $.data.id }
            - call: "POST /ei/ifsps/${ifsp_id}/consent"
              payload: { consent_scope: "FULL", consent_signed_date: "2026-03-20" }
              as: FamilyRepresentative
              as_user_id: "${child_id}"
          trigger:
            - call: "POST /ei/cost-shares"
              payload: { referral_id: "${ref_id}", effective_month: "2026-03", household_size: 4, declared_annual_gross_income_cents: 8112500, insurance_use_consent: false }
              as: FiscalOfficer
              as_user_id: "fiscal-officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/cost-shares"
              payload: { referral_id: "${ref_id}", effective_month: "2026-04", household_size: 4, declared_annual_gross_income_cents: 12980000, insurance_use_consent: false }
              as: FiscalOfficer
              as_user_id: "fiscal-officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/cost-shares"
              payload: { referral_id: "${ref_id}", effective_month: "2026-05", household_size: 4, declared_annual_gross_income_cents: 19470000, insurance_use_consent: false }
              as: FiscalOfficer
              as_user_id: "fiscal-officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/cost-shares"
              payload: { referral_id: "${ref_id}", effective_month: "2026-06", household_size: 4, declared_annual_gross_income_cents: 20000000, insurance_use_consent: false }
              as: FiscalOfficer
              as_user_id: "fiscal-officer-1"
          assert:
            - "Every determination reports fpl_threshold_cents == 3245000 (1 580 000 + 3 x 555 000)"
            - "March row: fpl_percent == 250.0, tier_code == \"TIER_0\", coinsurance_rate == 0.00, monthly_cap_cents == 0, assessed_monthly_fee_cents == 0, effective_coinsurance_rate == 0.00"
            - "April row: fpl_percent == 400.0, tier_code == \"TIER_1\", coinsurance_rate == 0.05, monthly_cap_cents == 12000, assessed_monthly_fee_cents == 2600"
            - "May row: fpl_percent == 600.0, tier_code == \"TIER_2\", coinsurance_rate == 0.10, monthly_cap_cents == 30000, assessed_monthly_fee_cents == 5200"
            - "June row: fpl_percent == 616.3, tier_code == \"TIER_3\", coinsurance_rate == 0.15, monthly_cap_cents == 60000, assessed_monthly_fee_cents == 7800"
            - "Each new row is created with status PROVISIONAL and insurance_offset_cents == 0 and final_monthly_fee_cents == null"

      - name: monthly_contact_status_counts_only_qualifying_methods
        claim_type: input_set_filtering
        grounds:
          - calculations.monthly_contact_compliance
          - entities.ContactLog.fields.qualifies_for_monthly_requirement
          - endpoints[GET /ei/referrals/{referralId}/timeline-compliance]
        distinguishing_aspect: |
          The filter is on method AND calendar month, not on contact count: an EMAIL contact logged
          on the same day leaves the case DUE, a HOME_VISIT flips it to COMPLIANT with
          last_qualifying_contact_date set, and rolling the clock into the next month past the grace
          day of 20 makes the same case DELINQUENT even though a qualifying contact exists — in the
          previous month.
        test_recipe:
          setup:
            - "An ACTIVE_SERVICES referral (services_start_date 2026-03-20) with no contact logs yet."
            - "Logical clock at 2026-03-20T09:00:00Z, which is on the grace day boundary (day 20 <= GRACE_DAY_OF_MONTH)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 12.00 }
