          - entities.License.fields.valid_until
          - errors[ERR_INTERVAL_OVERLAP]
        distinguishing_aspect: |
          License windows are CLOSED intervals [valid_from, valid_until] on the Project resource:
          a second license [2026-03-10, 2026-03-20] sharing exactly the endpoint 2026-03-10 with an
          existing [2026-03-01, 2026-03-10] is rejected with ERR_INTERVAL_OVERLAP, because closed
          intervals that touch at an endpoint overlap.
