              as: CaseWorker
              captures: { cpv3: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Yusuf Larkspur", ssn_last4: "6206", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpv3: "$.data.id" }
            - call: "POST /child-support/participants/${ncpv3}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpv3}", noncustodial_party_id: "${ncpv3}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casev3: "$.data.id" }
            - call: "POST /child-support/cases/${casev3}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${casev3}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { orderv3: "$.data.id" }
            - call: "POST /child-support/orders/${orderv3}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${orderv3}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monv3: "$.data.monthly_obligation_cents" }
            - call: "POST /child-support/orders/${orderv3}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15", amount_cents: 75000 }
              as: FinanceOfficer
            - call: "POST /child-support/employers"
              payload: { legal_name: "Northern Grain MN", fein: "41-0000108", state_code: "MN", pay_frequency: "MONTHLY", remittance_fee_cents: 0 }
              as: ProgramAdmin
              captures: { empmn: "$.data.id" }
            - call: "POST /child-support/employers"
              payload: { legal_name: "Badger Cartage WI", fein: "39-0000109", state_code: "WI", pay_frequency: "MONTHLY", remittance_fee_cents: 0 }
              as: ProgramAdmin
              captures: { empwi: "$.data.id" }
          trigger:
            - call: "GET /child-support/orders/${orderv3}"
              as: CaseWorker
              captures: { v3a: "$.data.version" }
            - call: "POST /child-support/orders/${orderv3}/withholding-orders"
              payload: { employer_id: "${empmn}", expected_order_version: "${v3a}", reported_disposable_income_cents: 150000 }
              as: CaseWorker
              captures: { iwomn: "$.data.id", whmn: "$.data.withholding_amount_cents", capmn: "$.data.ccpa_cap_pct", amtmn: "$.data.ccpa_cap_amount_cents" }
            - call: "GET /child-support/orders/${orderv3}"
              as: CaseWorker
              captures: { v3b: "$.data.version" }
            - call: "POST /child-support/orders/${orderv3}/withholding-orders"
              payload: { employer_id: "${empwi}", expected_order_version: "${v3b}", reported_disposable_income_cents: 100000 }
              as: CaseWorker
