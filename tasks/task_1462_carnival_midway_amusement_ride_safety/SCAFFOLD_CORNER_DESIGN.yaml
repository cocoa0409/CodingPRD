  # =================================================================
  # Section: validations
  # =================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=1]'
          - 'errors[ERR_UNAUTHENTICATED]'
        distinguishing_aspect: "A request without X-User-Role/X-User-ID is rejected 401 ERR_UNAUTHENTICATED before any role, existence, or business logic runs."
        test_recipe:
          setup: ["logical clock pinned at the startup default; no other state needed"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
          trigger:
            - { call: "POST /midway/fairs", payload: { name: "NoAuth Fair", operator_company_name: "ShowCo", location: "Lot Z", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 100 }, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_UNAUTHENTICATED with http 401 (headers absent entirely)"

      - name: existence_beats_business_on_unknown_path_id
        claim_type: priority_ordering
        grounds:
          - 'validations[priority=4]'
          - 'validations[priority=10]'
          - 'errors[ERR_NOT_FOUND]'
        distinguishing_aspect: "verify-assembly on a nonexistent ride id returns ERR_NOT_FOUND (priority 4, path existence) even though the caller also lacks a covering shift (priority 10) — existence is evaluated first."
        test_recipe:
          setup: ["Fair in SETUP; crew staff member with NO crew shift (would fail ERR_NO_COVERING_SHIFT if the ride existed)"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway V2", operator_company_name: "ShowCo", location: "Lot 41", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup V2", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew V2", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id" } }
          trigger:
            - { call: "POST /midway/rides/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND with http 404 — not ERR_NO_COVERING_SHIFT"

      - name: begin_checklists_requires_current_date
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=11]'
          - 'errors[ERR_DAY_NOT_TODAY]'
        distinguishing_aspect: "begin-checklists on a day whose date is tomorrow relative to the logical clock fails with ERR_DAY_NOT_TODAY; the day itself was legally created for a future in-season date."
        test_recipe:
          setup: ["Permitted fair; OperatingDay for 2026-08-04 created; clock at 2026-08-03T08:00:00Z"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway V3", operator_company_name: "ShowCo", location: "Lot 42", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup V3", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew V3", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v: "$.data.version" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp V3a", license_number: "LIC-V3-1" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp V3b", license_number: "LIC-V3-2" }, as: StateProgramAdmin, captures: { insp2_id: "$.data.id" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-V3-1", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride_id: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/rides/${ride_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/fairs/${fair_id}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { permit_id: "$.data.id" } }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 9, duration_hours: 2 }, as: FairManager, as_user_id: "${sup_id}", captures: { appt_id: "$.data.id", appt_insp: "$.data.inspector_id" } }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspection-appointments/${appt_id}/complete", payload: { outcome: "PASS" }, as: StateInspector, as_user_id: "${appt_insp}" }
            - { call: "GET /midway/fairs/${fair_id}", as: FairManager, as_user_id: "${sup_id}", captures: { fair_v: "$.data.version" } }
            - { call: "POST /midway/permits/${permit_id}/approve", payload: { expected_fair_version: "${fair_v}" }, as: StateInspector, as_user_id: "${insp2_id}" }
            - { call: "POST /midway/operating-days", payload: { fair_id: "${fair_id}", date: "2026-08-04", max_attendance: 100 }, as: FairManager, as_user_id: "${sup_id}", captures: { day_id: "$.data.id" } }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: StateProgramAdmin }
          trigger:
            - { call: "POST /midway/operating-days/${day_id}/begin-checklists", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_DAY_NOT_TODAY with http 422 (day.date 2026-08-04 != current date 2026-08-03)"
            - "OperatingDay.${day_id}.posture == SCHEDULED (unchanged)"

      - name: crew_shift_season_window_enforced_per_role
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=11]'
          - 'entities.CrewShift.fields.shift_role'
          - 'errors[ERR_SHIFT_OUT_OF_SEASON]'
        distinguishing_aspect: "A TEARDOWN shift on 2026-08-03 (inside the operating season, not after closing) and a SETUP shift on 2026-08-03 (opening_date itself, excluded from the half-open setup window) both fail with ERR_SHIFT_OUT_OF_SEASON."
        test_recipe:
          setup: ["Fair in SETUP with crew staff; clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway V4", operator_company_name: "ShowCo", location: "Lot 43", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup V4", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew V4", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v: "$.data.version" } }
          trigger:
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-03", start_hour: 6, end_hour: 10, shift_role: "TEARDOWN", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-03", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}", captures: { err2: "$.data.error_id" } }
          assert:
