scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: sir_provisional_vs_final_on_monthly_summary
    grounds:
    - calculations.predicted_infections_and_sir
    - entities.MonthlySummary.fields.provisional_clabsi_count
    - entities.MonthlySummary.fields.sir_clabsi
    distinguishing_aspect: 'Dual variant on the MonthlySummary (NHSN reporting domain): identical

      underlying data yields final sir_clabsi = 1.0 (ADJUDICATED_HAI only)

      but provisional_sir_clabsi = 2.0 (UNDER_REVIEW case added on top) —

      the variant, not the data, changes the observable result.

      '
    test_recipe:
      setup:
      - Facility baseline clabsi 2.0/1000; unit U1 with 500 central-line days in 2026-08 (5 rows x 100)
      - 'Case A: CLABSI adjudicated ADJUDICATED_HAI, DOE 2026-08-04 (unit U1)'
      - 'Case B: CLABSI on a different patient, specimen 2026-08-06, left in UNDER_REVIEW'
      - MonthlySummary for (U1, 2026-08) created after both case events
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-1
          unit_type: ICU
          nhsn_location_code: ICU1
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/device-day-counts
        payload:
          unit_id: ${unit_id}
          count_date: '2026-08-01T00:00:00Z'
          central_line_days: 100
          urinary_catheter_days: 0
          ventilator_days: 0
          patient_days: 120
        as: UnitNurseManager
      - call: POST /api/device-day-counts
        payload:
          unit_id: ${unit_id}
          count_date: '2026-08-02T00:00:00Z'
          central_line_days: 100
          urinary_catheter_days: 0
          ventilator_days: 0
          patient_days: 120
        as: UnitNurseManager
      - call: POST /api/device-day-counts
        payload:
          unit_id: ${unit_id}
          count_date: '2026-08-03T00:00:00Z'
          central_line_days: 100
          urinary_catheter_days: 0
          ventilator_days: 0
          patient_days: 120
        as: UnitNurseManager
      - call: POST /api/device-day-counts
        payload:
          unit_id: ${unit_id}
          count_date: '2026-08-04T00:00:00Z'
          central_line_days: 100
          urinary_catheter_days: 0
          ventilator_days: 0
          patient_days: 120
        as: UnitNurseManager
      - call: POST /api/device-day-counts
        payload:
          unit_id: ${unit_id}
          count_date: '2026-08-05T00:00:00Z'
          central_line_days: 100
          urinary_catheter_days: 0
          ventilator_days: 0
          patient_days: 120
        as: UnitNurseManager
      - call: POST /api/patients
        payload:
          mrn: MRN-A
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_a: $.data.id
      - call: POST /api/patients
        payload:
          mrn: MRN-B
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_b: $.data.id
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_a}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-01T10:00:00Z'
        as: UnitNurseManager
        captures:
          ep_a: $.data.id
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_b}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-01T10:00:00Z'
        as: UnitNurseManager
        captures:
          ep_b: $.data.id
      - call: POST /api/infection-cases
        payload:
          patient_id: ${pat_a}
          case_type: CLABSI
          suspected_organism: Escherichia coli
          first_positive_specimen_at: '2026-08-04T10:00:00Z'
          linked_device_episode_id: ${ep_a}
        as: InfectionPreventionist
        captures:
          case_a: $.data.id
      - call: POST /api/infection-cases/${case_a}/begin-review
        payload: {}
        as: InfectionPreventionist
      - call: POST /api/infection-cases/${case_a}/adjudicate
        payload:
          outcome: ADJUDICATED_HAI
          date_of_event: '2026-08-04T00:00:00Z'
          rationale: meets NHSN LCBI-1 criteria
        as: InfectionPreventionist
      - call: POST /api/infection-cases
        payload:
          patient_id: ${pat_b}
          case_type: CLABSI
          suspected_organism: Staphylococcus aureus
          first_positive_specimen_at: '2026-08-06T09:00:00Z'
          linked_device_episode_id: ${ep_b}
        as: InfectionPreventionist
        captures:
          case_b: $.data.id
      - call: POST /api/infection-cases/${case_b}/begin-review
        payload: {}
        as: InfectionPreventionist
      - call: POST /api/monthly-summaries
        payload:
          unit_id: ${unit_id}
          month: 2026-08
        as: InfectionPreventionist
        captures:
          sum_id: $.data.id
      trigger:
      - call: GET /api/monthly-summaries/${sum_id}
        payload: {}
        as: InfectionPreventionist
      assert:
      - MonthlySummary.${sum_id}.central_line_days == 500
      - MonthlySummary.${sum_id}.predicted_clabsi == 1.0
      - 'MonthlySummary.${sum_id}.clabsi_count == 1 (final variant: ADJUDICATED_HAI only)'
      - MonthlySummary.${sum_id}.provisional_clabsi_count == 2 (final + UNDER_REVIEW case B)
      - MonthlySummary.${sum_id}.sir_clabsi == 1.0
      - MonthlySummary.${sum_id}.provisional_sir_clabsi == 2.0
      - MonthlySummary.${sum_id}.provisional_sir_clabsi != MonthlySummary.${sum_id}.sir_clabsi
      - MonthlySummary.${sum_id}.sir_flag == NORMAL (1.0 < 1.25 default threshold)
