      - name: certify_balance_flips_after_a_superseding_forecast_lowers_revenue
        claim_type: Cascading validation
        grounds:
          - state_machines.RevenueForecast.DRAFT_to_ADOPTED
          - calculations.cycle_balance_certification
          - errors[ERR_BUDGET_NOT_BALANCED]
          - entities.RevenueForecast.fields.status
        distinguishing_aspect: |
          The validation outcome is a function of cascaded derived state, not of the request:
          the identical certify-balance call passes and then fails, because adopting a
          superseding forecast of 5000000000 rewrites adopted_general_fund_revenue_cents and
          required_reserve_cents, dropping appropriable capacity from 9500000000 to 4750000000
          below the unchanged 9000000000 of approved recommendations. It also exercises
          supersedes_forecast_id, which retires the earlier forecast to SUPERSEDED.
        setup_note: "One accepted request with an approved 9000000000 recommendation (empty package array), an adopted 10000000000 GENERAL forecast, and a second DRAFT GENERAL forecast of 5000000000 naming the first as superseded."
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 with constitutional_reserve_pct 0.05, ADOPTED GENERAL forecast of 10000000000 cents, advanced to phase EXECUTIVE_PREP"
            - "ACCEPTED AgencyRequest with base_budget_cents 9000000000 and no decision packages"
            - "APPROVED ExecutiveRecommendation with recommended_base_cents 9000000000 and an empty recommended_package_ids array, so total_recommended_cents is 9000000000"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v0: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v0}" }
              as: BudgetAnalyst
              captures: { fc_1_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_1_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", base_budget_cents: 9000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { req_id: $.data.id }
            - call: "POST /fiscal/agency-requests/${req_id}/submit"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/agency-requests/${req_id}/begin-review"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/agency-requests/${req_id}/accept"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "GET /fiscal/agency-requests/${req_id}"
              payload: {}
              as: BudgetAnalyst
              captures: { req_v: $.data.version }
            - call: "POST /fiscal/executive-recommendations"
              payload: { agency_request_id: "${req_id}", recommended_base_cents: 9000000000, recommended_package_ids: [], policy_priority: "HIGH", expected_agency_request_version: "${req_v}" }
              as: BudgetAnalyst
              as_user_id: "analyst-1"
              captures: { rec_id: $.data.id }
            - call: "POST /fiscal/executive-recommendations/${rec_id}/approve"
              payload: {}
              as: BudgetDirector
              as_user_id: "dir-1"
            - call: "GET /fiscal/budget-cycles/${cyc_id}"
              payload: {}
              as: BudgetAnalyst
              captures: { cyc_v1: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_FALL", amount_cents: 5000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v1}" }
              as: BudgetAnalyst
              captures: { fc_2_id: $.data.id }
          trigger:
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/revenue-forecasts/${fc_2_id}/adopt"
              payload: { supersedes_forecast_id: "${fc_1_id}" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
