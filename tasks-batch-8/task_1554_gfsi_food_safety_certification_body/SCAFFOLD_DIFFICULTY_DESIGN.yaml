# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — GFSI Food Safety Certification Body
# §1.8 Test Targeting Index: 2 instances per Difficulty Rule (18 total).
# All chains replay cleanly against SCAFFOLD.yaml §1.2/§1.4/§1.5/§1.6.
#
# Pinned scheme constants used throughout (created in each instance's first
# call): SQF, categories [BAKERY, DAIRY, MEAT], deadlines 7/28/84 days,
# pass_score 70, unannounced_every_n 3, windows 60/30, gap 30, validity 1095d,
# witness validity 365d, appeal window 14d, max_cap_rejections 3,
# rotation_limit 2, fees 2000.00 / 333.33 / 1000.00 / 0.10 / 1.5.
# Logical clock default: 2026-08-01T00:00:00Z.
# Initial audit window after accept at default clock:
#   [2026-08-15T00:00:00Z, 2026-09-14T00:00:00Z].
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: audit_score_reported_vs_resolved_divergence
        grounds:
          - calculations.audit_score
          - entities.Audit.fields.reported_score
          - entities.Audit.fields.resolved_score
        distinguishing_aspect: |
          Entity domain = Audit/Nonconformity scoring. The SAME finding set
          (2 CRITICAL + 1 MAJOR + 1 MINOR) yields reported_score 37 at
          submit-report (full weights) and resolved_score 70 at decision
          (floor-halved weights once CLOSED) — two valid interpretations of
          one score producing different numbers for identical data.
        test_recipe:
          setup:
            - "SQF scheme with pass_score=70 and deadlines 7/28/84 exists"
            - "Client Acme, witnessed competent auditor, and decision maker exist"
            - "Application ACCEPTED with 1 STANDARD BAKERY category; INITIAL audit scheduled [2026-08-15T00:00:00Z, 2026-09-14T00:00:00Z], assigned and started at 2026-08-15T09:00:00Z"
            - "Four NCs on the audit: 2 CRITICAL + 1 MAJOR + 1 MINOR"
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/auditors"
              payload: { name: "Audrey Auditor", competency_categories: ["BAKERY", "DAIRY", "MEAT"], conflicted_client_ids: [] }
              as: SchemeAdmin
              captures: { auditor_id: $.data.id }
            - call: "POST /certification-body/auditors/${auditor_id}/witness-audits"
              payload: { witnessed_on: "2026-07-01T00:00:00Z", result: "PASS" }
              as: SchemeAdmin
            - call: "POST /certification-body/decision-makers"
              payload: { name: "Dana Decider" }
              as: SchemeAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "production of baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app_id: $.data.id }
            - call: "POST /certification-body/applications/${app_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/applications/${app_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: SchemeAdmin
            - call: "GET /certification-body/applications/${app_id}/audits"
              as: SchemeAdmin
              captures: { audit_id: "$.data[0].id" }
            - call: "POST /certification-body/audits/${audit_id}/assign"
              payload: { auditor_id: "${auditor_id}" }
              as: SchemeAdmin
            - call: "POST /certification-body/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T09:00:00Z" }
              as: SchemeAdmin
            - call: "POST /certification-body/audits/${audit_id}/start"
              as: Auditor
              as_user_id: "${auditor_id}"
            - call: "POST /certification-body/audits/${audit_id}/nonconformities"
              payload: { grade: "CRITICAL", clause_ref: "SQF 2.4.3", description: "critical finding one" }
              as: Auditor
              as_user_id: "${auditor_id}"
              captures: { nc1_id: $.data.id }
            - call: "POST /certification-body/audits/${audit_id}/nonconformities"
              payload: { grade: "CRITICAL", clause_ref: "SQF 2.4.4", description: "critical finding two" }
              as: Auditor
              as_user_id: "${auditor_id}"
              captures: { nc2_id: $.data.id }
            - call: "POST /certification-body/audits/${audit_id}/nonconformities"
              payload: { grade: "MAJOR", clause_ref: "SQF 2.5.1", description: "major finding" }
              as: Auditor
              as_user_id: "${auditor_id}"
              captures: { nc3_id: $.data.id }
            - call: "POST /certification-body/audits/${audit_id}/nonconformities"
              payload: { grade: "MINOR", clause_ref: "SQF 2.6.1", description: "minor finding" }
              as: Auditor
              as_user_id: "${auditor_id}"
              captures: { nc4_id: $.data.id }
            - call: "POST /certification-body/audits/${audit_id}/submit-report"
              payload: { actual_days: 2 }
              as: Auditor
              as_user_id: "${auditor_id}"
              captures: { reported: $.data.reported_score }
            - call: "POST /certification-body/nonconformities/${nc1_id}/submit-cap"
              payload: { cap_text: "containment and fix 1" }
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/nonconformities/${nc1_id}/review-cap"
              payload: { outcome: "ACCEPT" }
              as: Auditor
              as_user_id: "${auditor_id}"
            - call: "POST /certification-body/nonconformities/${nc2_id}/submit-cap"
              payload: { cap_text: "containment and fix 2" }
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/nonconformities/${nc2_id}/review-cap"
              payload: { outcome: "ACCEPT" }
              as: Auditor
              as_user_id: "${auditor_id}"
            - call: "POST /certification-body/nonconformities/${nc3_id}/submit-cap"
              payload: { cap_text: "major fix" }
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/nonconformities/${nc3_id}/review-cap"
              payload: { outcome: "ACCEPT" }
              as: Auditor
              as_user_id: "${auditor_id}"
            - call: "POST /certification-body/nonconformities/${nc4_id}/submit-cap"
              payload: { cap_text: "minor fix" }
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/nonconformities/${nc4_id}/review-cap"
              payload: { outcome: "ACCEPT" }
              as: Auditor
              as_user_id: "${auditor_id}"
          trigger:
            - call: "POST /certification-body/audits/${audit_id}/decision"
              payload: { outcome: "GRANT" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
              captures: { resolved: $.data.resolved_score }
          assert:
            - "Audit.${audit_id}.reported_score == 37  (100 - (25+25+10+3), full weights on identical NC data)"
            - "Audit.${audit_id}.resolved_score == 70  (100 - (12+12+5+1), floor-halved weights after closure)"
            - "Audit.${audit_id}.reported_score != Audit.${audit_id}.resolved_score"
            - "Audit.${audit_id}.decision_outcome == GRANT (resolved 70 >= pass_score 70)"

      - name: certification_fee_quote_vs_invoice_divergence
        grounds:
          - calculations.certification_fee
          - entities.Application.fields.provisional_fee_quote
          - entities.Certificate.fields.final_fee
        distinguishing_aspect: |
          Entity domain = Application/Certificate billing (distinct from the
          audit-score domain of the sibling instance). Same scope data (2 HIGH
          categories) yields quote 2666.66 at acceptance (flat, unmultiplied)
          and invoice 4000.00 at issuance (risk-tier multipliers plus day-rate
          component) — provisional vs final variants diverge.
        test_recipe:
          setup:
            - "SQF scheme with fees base 2000.00, per-category 333.33, day rate 1000.00, uplift 0.10, high-risk multiplier 1.5"
            - "Application ACCEPTED with 2 HIGH categories (BAKERY, DAIRY)"
            - "INITIAL audit assigned, started at 2026-08-15T09:00:00Z, zero findings"
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/auditors"
              payload: { name: "Audrey Auditor", competency_categories: ["BAKERY", "DAIRY", "MEAT"], conflicted_client_ids: [] }
              as: SchemeAdmin
              captures: { auditor_id: $.data.id }
            - call: "POST /certification-body/auditors/${auditor_id}/witness-audits"
              payload: { witnessed_on: "2026-07-01T00:00:00Z", result: "PASS" }
              as: SchemeAdmin
            - call: "POST /certification-body/decision-makers"
              payload: { name: "Dana Decider" }
              as: SchemeAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "HIGH" }, { category_code: "DAIRY", risk_tier: "HIGH" }], scope_text: "baked goods and dairy" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app_id: $.data.id }
            - call: "POST /certification-body/applications/${app_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/applications/${app_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: SchemeAdmin
              captures: { quote: $.data.provisional_fee_quote }
            - call: "GET /certification-body/applications/${app_id}/audits"
              as: SchemeAdmin
              captures: { audit_id: "$.data[0].id" }
            - call: "POST /certification-body/audits/${audit_id}/assign"
              payload: { auditor_id: "${auditor_id}" }
              as: SchemeAdmin
            - call: "POST /certification-body/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T09:00:00Z" }
              as: SchemeAdmin
            - call: "POST /certification-body/audits/${audit_id}/start"
              as: Auditor
              as_user_id: "${auditor_id}"
            - call: "POST /certification-body/audits/${audit_id}/submit-report"
              payload: { actual_days: 1 }
              as: Auditor
              as_user_id: "${auditor_id}"
          trigger:
            - call: "POST /certification-body/audits/${audit_id}/decision"
              payload: { outcome: "GRANT" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
            - call: "GET /certification-body/audits/${audit_id}/certificate"
              as: SchemeAdmin
              captures: { cert_id: "$.data[0].id", invoice: "$.data[0].final_fee" }
          assert:
            - "Application.${app_id}.provisional_fee_quote == 2666.66  (round(2000.00 + 2 x 333.33, 2))"
            - "Certificate.${cert_id}.final_fee == 4000.00  (2000.00 + 2 x round(333.33 x 1.5, 2) + round(1 x 1000.00, 2))"
            - "Certificate.${cert_id}.final_fee != Application.${app_id}.provisional_fee_quote"

  # ===========================================================================
  # Rule 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: audit_score_weighted_deductions_with_closure_halving
        grounds:
          - calculations.audit_score
          - state_machines.Audit.REPORT_SUBMITTED_to_DECIDED
        distinguishing_aspect: |
          Mode (a): a formula with >=3 inputs and non-linear interaction —
          three grade-count inputs (CRITICAL/MAJOR/MINOR), a conditional
          branch on each NC's closure state (full vs floor-halved weight),
          a max(0, .) clamp, and a pass-threshold branch. With 3 CRITICAL NCs:
          reported 25, resolved 64 after closure — closure is necessary but
          not sufficient, because 64 < pass_score 70 blocks GRANT.
        test_recipe:
          setup:
            - "SQF scheme pass_score=70; client, witnessed auditor, decision maker"
            - "Application ACCEPTED (1 STANDARD BAKERY); INITIAL audit started at 2026-08-15T09:00:00Z"
            - "Three CRITICAL NCs recorded, all subsequently CLOSED"
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/auditors"
              payload: { name: "Audrey Auditor", competency_categories: ["BAKERY", "DAIRY", "MEAT"], conflicted_client_ids: [] }
              as: SchemeAdmin
              captures: { auditor_id: $.data.id }
            - call: "POST /certification-body/auditors/${auditor_id}/witness-audits"
              payload: { witnessed_on: "2026-07-01T00:00:00Z", result: "PASS" }
              as: SchemeAdmin
            - call: "POST /certification-body/decision-makers"
              payload: { name: "Dana Decider" }
              as: SchemeAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "production of baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app_id: $.data.id }
            - call: "POST /certification-body/applications/${app_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/applications/${app_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: SchemeAdmin
            - call: "GET /certification-body/applications/${app_id}/audits"
              as: SchemeAdmin
              captures: { audit_id: "$.data[0].id" }
            - call: "POST /certification-body/audits/${audit_id}/assign"
              payload: { auditor_id: "${auditor_id}" }
              as: SchemeAdmin
            - call: "POST /certification-body/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T09:00:00Z" }
              as: SchemeAdmin
            - call: "POST /certification-body/audits/${audit_id}/start"
              as: Auditor
              as_user_id: "${auditor_id}"
            - call: "POST /certification-body/audits/${audit_id}/nonconformities"
              payload: { grade: "CRITICAL", clause_ref: "SQF 2.4.3", description: "critical one" }
              as: Auditor
              as_user_id: "${auditor_id}"
              captures: { nc1_id: $.data.id }
            - call: "POST /certification-body/audits/${audit_id}/nonconformities"
              payload: { grade: "CRITICAL", clause_ref: "SQF 2.4.4", description: "critical two" }
              as: Auditor
              as_user_id: "${auditor_id}"
              captures: { nc2_id: $.data.id }
            - call: "POST /certification-body/audits/${audit_id}/nonconformities"
              payload: { grade: "CRITICAL", clause_ref: "SQF 2.4.5", description: "critical three" }
              as: Auditor
              as_user_id: "${auditor_id}"
              captures: { nc3_id: $.data.id }
            - call: "POST /certification-body/audits/${audit_id}/submit-report"
              payload: { actual_days: 2 }
              as: Auditor
              as_user_id: "${auditor_id}"
              captures: { reported: $.data.reported_score }
            - call: "POST /certification-body/nonconformities/${nc1_id}/submit-cap"
              payload: { cap_text: "fix 1" }
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/nonconformities/${nc1_id}/review-cap"
              payload: { outcome: "ACCEPT" }
              as: Auditor
              as_user_id: "${auditor_id}"
            - call: "POST /certification-body/nonconformities/${nc2_id}/submit-cap"
              payload: { cap_text: "fix 2" }
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/nonconformities/${nc2_id}/review-cap"
              payload: { outcome: "ACCEPT" }
              as: Auditor
              as_user_id: "${auditor_id}"
            - call: "POST /certification-body/nonconformities/${nc3_id}/submit-cap"
              payload: { cap_text: "fix 3" }
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/nonconformities/${nc3_id}/review-cap"
              payload: { outcome: "ACCEPT" }
              as: Auditor
              as_user_id: "${auditor_id}"
          trigger:
            - call: "POST /certification-body/audits/${audit_id}/decision"
              payload: { outcome: "GRANT" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
              captures: { grant_err: $.data.error_id }
            - call: "POST /certification-body/audits/${audit_id}/decision"
              payload: { outcome: "DENY" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
              captures: { resolved: $.data.resolved_score }
          assert:
            - "Audit.${audit_id}.reported_score == 25  (100 - 3 x 25)"
            - "GRANT attempt fails with error_id ERR_SCORE_BELOW_PASS (http 422): resolved 64 < pass_score 70"
            - "Audit.${audit_id}.resolved_score == 64 after DENY  (100 - 3 x floor(25/2) = 100 - 36)"
            - "Audit.${audit_id}.decision_outcome == DENY; Audit.${audit_id}.status == DECIDED"

      - name: certification_fee_round_per_line_then_sum
        grounds:
          - calculations.certification_fee
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-line-then-sum. 2 HIGH categories at per_category_fee
          333.33 x multiplier 1.5 = 499.995 per line: rounding each line first
          gives 500.00 + 500.00 = 1000.00, while summing unrounded lines gives
          999.99. Final invoice 5000.00 (vs the 4999.99 trap) proves the order.
        test_recipe:
          setup:
            - "SQF scheme: base 2000.00, per-category 333.33, day rate 1000.00, uplift 0.10, high-risk multiplier 1.5"
            - "Application ACCEPTED with 2 HIGH categories; INITIAL audit started, zero findings, report submitted with actual_days=2"
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/auditors"
              payload: { name: "Audrey Auditor", competency_categories: ["BAKERY", "DAIRY", "MEAT"], conflicted_client_ids: [] }
              as: SchemeAdmin
              captures: { auditor_id: $.data.id }
            - call: "POST /certification-body/auditors/${auditor_id}/witness-audits"
              payload: { witnessed_on: "2026-07-01T00:00:00Z", result: "PASS" }
              as: SchemeAdmin
            - call: "POST /certification-body/decision-makers"
              payload: { name: "Dana Decider" }
              as: SchemeAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "HIGH" }, { category_code: "DAIRY", risk_tier: "HIGH" }], scope_text: "baked goods and dairy" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app_id: $.data.id }
            - call: "POST /certification-body/applications/${app_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/applications/${app_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: SchemeAdmin
            - call: "GET /certification-body/applications/${app_id}/audits"
              as: SchemeAdmin
              captures: { audit_id: "$.data[0].id" }
            - call: "POST /certification-body/audits/${audit_id}/assign"
              payload: { auditor_id: "${auditor_id}" }
              as: SchemeAdmin
            - call: "POST /certification-body/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T09:00:00Z" }
              as: SchemeAdmin
            - call: "POST /certification-body/audits/${audit_id}/start"
              as: Auditor
              as_user_id: "${auditor_id}"
            - call: "POST /certification-body/audits/${audit_id}/submit-report"
              payload: { actual_days: 2 }
              as: Auditor
              as_user_id: "${auditor_id}"
              captures: { audit_fee: $.data.audit_fee }
          trigger:
            - call: "POST /certification-body/audits/${audit_id}/decision"
              payload: { outcome: "GRANT" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
            - call: "GET /certification-body/audits/${audit_id}/certificate"
              as: SchemeAdmin
              captures: { cert_id: "$.data[0].id", invoice: "$.data[0].final_fee" }
          assert:
