        distinguishing_aspect: "Segregation of duties is enforced on X-User-ID identity, not on role: the officer recorded in Product.substantiated_by_user_id (co-claims-1) is refused with 403 ERR_SEGREGATION_OF_DUTIES while a different ComplianceOfficer settles the same show."
        test_recipe:
