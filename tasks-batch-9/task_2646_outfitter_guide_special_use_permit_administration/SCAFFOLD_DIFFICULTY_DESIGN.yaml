          assert:
            - "screening ${app1_id} returns ERR_NEEDS_ASSESSMENT_NOT_PUBLISHED with HTTP 422: the 2027 assessment for BRW-01 exists but is DRAFT, and the PUBLISHED assessment on that area is for 2026, so a published sibling of the wrong year does not satisfy the gate"
