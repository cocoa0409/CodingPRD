              as: PlatformAdmin
              captures: { lot: $.data.id }
            - call: "POST /cgm/payers"
              payload: { name: "PYY", plan_code: "PY", benefit_route: "PHARMACY", cgm_coverage_policy: "STANDARD", pharmacy_copay_pct: 0.20, dme_coinsurance_pct: 0.0, deductible_cap_cents: 0 }
              as: PlatformAdmin
              captures: { py: $.data.id }
            - call: "POST /cgm/patients/${pt}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod}", diagnosis_code: "E11.9", insulin_use: "INTENSIVE", documentation_attached: true, quantity_per_fill: 1, fills_authorized: 12, written_on: "2026-08-15", expected_patient_version: "${pt_v}" }
              as: Prescriber
