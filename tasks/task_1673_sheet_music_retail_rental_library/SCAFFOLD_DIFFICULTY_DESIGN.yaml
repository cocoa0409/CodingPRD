              as: LibraryAdmin
            - call: "POST /library/purchase-orders"
              payload: { account_id: "${acct_id}", po_number: "PO-BND", authorized_amount_cents: 50000, valid_from: "2026-08-01", valid_until: "2026-08-31" }
              as: BillingManager
              captures: { po_id: $.data.id }
            - call: "POST /library/purchase-orders/${po_id}/approve"
              payload: {}
              as: BillingManager
          trigger:
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/_sweep/run_daily"
              payload: {}
              as: LibraryAdmin
            - call: "GET /library/purchase-orders/${po_id}"
              as: BillingManager
              captures: { st_at_equal: $.data.status }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/_sweep/run_daily"
              payload: {}
              as: LibraryAdmin
            - call: "GET /library/purchase-orders/${po_id}"
              as: BillingManager
              captures: { st_after: $.data.status }
          assert:
            - "at now == valid_until (2026-08-31): PurchaseOrder.${po_id}.status == APPROVED (strict > semantics)"
            - "at now == valid_until + 1 day (2026-09-01): PurchaseOrder.${po_id}.status == EXPIRED"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_gated_by_purchase_order_state
        grounds:
          - state_machines.RentalOrder.RESERVED_to_DISPATCHED
          - validations[priority=12]
          - errors[ERR_PO_NOT_USABLE]
        distinguishing_aspect: |
          Pair RentalOrder→PurchaseOrder: dispatch of a PO-backed order is rejected with
          ERR_PO_NOT_USABLE when the referenced PO sits in SUBMITTED (and, after approval and a
          standing-driven suspension, in SUSPENDED) — the order's valid transition set depends
          on the PO entity's state.
