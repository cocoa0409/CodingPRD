  - rule_id: priority_pair_validation_conflict
    instances:
      - name: closed_episode_and_past_slot_returns_episode_not_schedulable_not_slot_in_past
        grounds:
          - validations.priority_11_ERR_EPISODE_NOT_SCHEDULABLE
          - validations.priority_28_ERR_SLOT_IN_PAST
          - endpoints.POST_rescreen_appointments
          - errors.ERR_EPISODE_NOT_SCHEDULABLE
          - errors.ERR_SLOT_IN_PAST
        distinguishing_aspect: |
          Category pair STATE (priority 11) vs BUSINESS_TEMPORAL (priority 28) on
          POST /rescreen-appointments. One request violates both — the episode is
          CLOSED_DECLINED and the slot already started — and the 409
          ERR_EPISODE_NOT_SCHEDULABLE must win over the 422 ERR_SLOT_IN_PAST. An
          implementation that validates timestamps before state returns the wrong error AND the
          wrong HTTP status.
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1; AC1 (AUDIOLOGY_CLINIC, R1) with audiologist A1."
            - "Infant R born 2026-08-02T00:00:00Z; birth screen REFERs, creating a RESCREEN episode; the family declines, so the episode is closed CLOSED_DECLINED."
            - "A RESCREEN slot at 2026-08-05T09:00:00Z is created while it is still in the future, then the clock is advanced to 2026-08-06T00:00:00Z so the slot is in the past."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "AUDIOLOGIST", full_name: "A1", region_code: "R1" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-02T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-R", guardian_contact_phone: "5550701" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { r_id: "$.data.id" }
            - call: "POST /screening-encounters"
              payload: { infant_id: "${r_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "AABR", performed_at: "2026-08-02T05:00:00Z", left_ear_result: "REFER", right_ear_result: "PASS" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "GET /follow-up-episodes"
              payload: { infant_id: "${r_id}", status: "PENDING_SCHEDULING" }
              as: ProgramAdmin
              captures: { ep_r_id: "$.data[0].id" }
            - call: "POST /clinic-slots"
              payload: { facility_id: "${ac_id}", provider_id: "${a1_id}", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T10:00:00Z", slot_type: "RESCREEN", total_capacity: 2 }
              as: ProgramAdmin
              captures: { slot_r_id: "$.data.id" }
            - call: "POST /follow-up-episodes/${ep_r_id}/close"
              payload: { closure_reason: "FAMILY_DECLINED" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /rescreen-appointments"
              payload: { episode_id: "${ep_r_id}", slot_id: "${slot_r_id}" }
              as: ProgramAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_EPISODE_NOT_SCHEDULABLE"
            - "data.error_id != ERR_SLOT_IN_PAST even though ClinicSlot.${slot_r_id}.starts_at (2026-08-05T09:00:00Z) is before the logical clock (2026-08-06T00:00:00Z)"
            - "No RescreenAppointment row was created and ClinicSlot.${slot_r_id}.booked_count == 0 and remaining_capacity == 2"
            - "FollowUpEpisode.${ep_r_id}.status is still CLOSED_DECLINED with attempt_count == 0"

      - name: consent_refused_and_not_referred_returns_guardian_consent_refused_not_not_referred
        grounds:
          - validations.priority_16_ERR_GUARDIAN_CONSENT_REFUSED
          - validations.priority_24_ERR_INFANT_NOT_REFERRED
          - endpoints.POST_diagnostic_evaluations_id_submit
          - errors.ERR_GUARDIAN_CONSENT_REFUSED
          - errors.ERR_INFANT_NOT_REFERRED
        distinguishing_aspect: |
          A DIFFERENT category pair — BUSINESS_SAFETY (priority 16) vs BUSINESS_REFERENTIAL
          (priority 24) — on a different endpoint, POST /diagnostic-evaluations/{id}/submit. The
          infant's guardian has REFUSED consent and the infant was never referred, so both
          checks fire; the safety error (422) must be returned, not the referential 409.
        test_recipe:
          setup:
            - "AC1 (AUDIOLOGY_CLINIC, R1) with audiologist A1; BH1 (BIRTH_HOSPITAL, R1) with screener S1."
            - "Infant V born 2026-08-02T00:00:00Z with guardian_consent_status REFUSED and screening_status NOT_SCREENED (no screen ever recorded)."
            - "A DIAGNOSTIC follow-up episode is opened for V and a DRAFT diagnostic evaluation is created against it."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
