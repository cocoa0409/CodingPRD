  - section: cross_cutting_layers
    instances:
      - name: corner_stale_site_version_rejects_second_valuation_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[valuation-create-stale-site]
          - validations[priority=7]
          - errors[ERR_STALE_SITE_VERSION]
          - endpoints[POST /jda/sites/{id}/valuations]
        distinguishing_aspect: |
          The valuation create endpoint bumps AgencySite.version itself, so a valuation officer holding the
          version read before pricing the site once is stale for the second pricing: replaying the same
          expected_site_version returns 412 ERR_STALE_SITE_VERSION, and re-reading the site (version exactly
          +1) lets the identical body through.
        test_recipe:
          setup:
            - "SOLICITATION_READY federal-grant site with no valuations yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-C-056", name: "Basswood Spur Parcel", address_line: "56 Basswood Sp", parcel_area_sqft: 61000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/assessments"
              payload: { environmental_score: 80, utility_score: 75, access_score: 70, entitlement_score: 60, encumbrance_count: 1 }
              as: RealEstateOfficer
              captures: { asmt_a: $.data.id }
            - call: "POST /jda/assessments/${asmt_a}/certify"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/sites/${site_a}/release-for-solicitation"
              payload: { }
              as: RealEstateOfficer
            - call: "GET /jda/sites/${site_a}"
              payload: { }
              as: ValuationOfficer
              captures: { site_v1: $.data.version, basis_0: $.data.federal_interest_basis_cents }
          trigger:
            - call: "POST /jda/sites/${site_a}/valuations"
              payload: { method: "INCOME_APPROACH", appraised_value_cents: 48500000, transit_supportive_use_pct: 60, affordable_units_pct: 25, transfer_basis: "TRANSIT_SUPPORTIVE_BELOW_MARKET", effective_date: "2026-08-20", expected_site_version: "${site_v1}" }
              as: ValuationOfficer
              captures: { val_a: $.data.id, floor_a: $.data.permissible_floor_cents }
            - call: "GET /jda/sites/${site_a}"
              payload: { }
              as: ValuationOfficer
              captures: { site_v2: $.data.version, basis_1: $.data.federal_interest_basis_cents }
            - call: "POST /jda/sites/${site_a}/valuations"
              payload: { method: "SALES_COMPARISON", appraised_value_cents: 50000000, transit_supportive_use_pct: 60, affordable_units_pct: 25, transfer_basis: "TRANSIT_SUPPORTIVE_BELOW_MARKET", effective_date: "2026-08-21", expected_site_version: "${site_v1}" }
              as: ValuationOfficer
              captures: { err: $.data.error_id }
            - call: "POST /jda/sites/${site_a}/valuations"
              payload: { method: "SALES_COMPARISON", appraised_value_cents: 50000000, transit_supportive_use_pct: 60, affordable_units_pct: 25, transfer_basis: "TRANSIT_SUPPORTIVE_BELOW_MARKET", effective_date: "2026-08-21", expected_site_version: "${site_v2}" }
