      - name: department_manager_cannot_reach_a_peer_department_and_an_unidentified_caller_is_rejected
        claim_type: peer_roles
        grounds:
          - rbac[DepartmentManager]
          - errors[ERR_DEPARTMENT_SCOPE_VIOLATION]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "DepartmentManager is the only role whose authority is data-scoped rather than operation-scoped, so it needs two separate gates: the role gate passes (managers may create requests and batches) yet the scope gate rejects because X-User-ID does not equal the target Department.manager_user_id. The instance runs the same operation twice for the same manager — allowed on CC-100, ERR_DEPARTMENT_SCOPE_VIOLATION on CC-200 — and separates that 403 from ERR_UNAUTHENTICATED, which is what a DepartmentManager call with no X-User-ID at all returns."
        test_recipe:
          setup:
            - "Clock 2026-09-01; facility CCN-0001; revenue code 0300; two departments CC-100 (manager mgr_cath) and CC-200 (manager mgr_rad); COST_PLUS_MARKUP rule; item CDM-1001 in CC-100 activated to ACTIVE/PRICED_CURRENT at 240000."
