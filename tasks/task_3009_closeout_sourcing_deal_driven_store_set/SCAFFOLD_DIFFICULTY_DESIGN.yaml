  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: recall_block_cascades_allocations_and_assignments
        grounds:
          - state_machines.BuyLot.ON_SALE_to_BLOCKED
          - state_machines.Allocation.PROPOSED_to_CANCELLED
          - state_machines.AisleAssignment.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-3 cascade triggered by a post-market recall screening:
          screening FAILED_RECALL -> lot BLOCKED (link 1) -> CONFIRMED/PROPOSED
          allocations CANCELLED with pool restored (link 2) -> the affected
          store's ACTIVE aisle assignment SUPERSEDED with valid_to stamped
          (link 3, caused by link 2's allocation cancellation).
        test_recipe:
          setup:
            - "Lot ON_SALE with retail 4000, quantity_total 100"
