              payload: {}
              as: QCManager
            - call: "GET /weld-shop/shops/${shop_id}/weldments/${wm_id}"
              as: Any
              captures: { pre_unfreeze_posture: $.data.posture, pre_unfreeze_dc: $.data.distortion_count }
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/weldments/${wm_id}/unfreeze"
              payload: {}
              as: QCManager
            - call: "GET /weld-shop/shops/${shop_id}/weldments/${wm_id}"
              as: Any
              captures: { post_posture: $.data.posture, post_dc: $.data.distortion_count }
          assert:
            - "pre_unfreeze_posture == 'FROZEN'"
            - "pre_unfreeze_dc == 2"
            - "post_posture == 'OPEN'"
            - "post_dc == 2 (unfreeze does NOT reset distortion_count — conserved quantity)"
