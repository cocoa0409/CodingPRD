              as_user_id: "${emp_id}"
              captures: { pa_v: $.data.version }
            - call: "POST /plan-admin/contribution-elections"
              payload: { participant_id: "${pa_id}", plan_id: "${p403_id}", vendor_account_id: "${a_id}", annual_deferral_amount_cents: 100000, effective_from: "2026-09-01", effective_through: "2026-12-31", expected_participant_version: "${pa_v}" }
