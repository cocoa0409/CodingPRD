              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Wanda Waiver", email: "wanda@issuer.example", birth_date: "1972-01-01", appointed_on: "2026-07-01" }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
