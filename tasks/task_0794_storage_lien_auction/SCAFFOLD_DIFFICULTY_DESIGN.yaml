# =============================================================================
# task_0794 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# All monetary literals are pre-computed against §1.3 formulas + §1.1 constants.
#
# Canonical figures (reused across instances):
#   Facility: sales_tax_rate_bps=825, facility_fee_bps=1000
#   Unit: monthly_rent_cents=30000 -> daily_rent=1000; past_due=60000
#   notice created at clock default 2026-03-01T00:00:00Z; cure_deadline=2026-03-15T00:00:00Z
#   PROVISIONAL lien (14d): 60000 + 14*1000 + 5000 + 10000 = 89000
#   mature at 2026-03-20T00:00:00Z (19d): FINAL lien 60000 + 19*1000 + 5000 + 10000 = 94000
#   Auction: reserve=50000, min_increment=5000, window [2026-03-21,2026-03-22)
#   Buyer funds 100000; winning bid 150000; close at 2026-03-22T00:00:00Z
#   sale_charges: buyer_premium=round(150000*0.15)=22500;
#                 sales_tax=round((150000+22500)*0.0825)=round(14231.25)=14231;
#                 total_due=150000+22500+14231=186731
#   estimated_surplus @close (provisional lien 89000): 150000 - min(150000,89000)=89000
#                       - min(round(150000*0.10)=15000, 61000)=15000 => 46000
#   FINAL settlement @pay (final lien 94000): lien_recovered=94000, facility_fee=15000, surplus=41000
#   Facility.recovery @pay = 94000 + 15000 + 22500 = 131500
#   Sale created @2026-03-22: payment_deadline=+48h=2026-03-24T00:00:00Z; cleanout_deadline=+3d=2026-03-25T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: lien_provisional_vs_final_diverge
        grounds:
          - calculations.lien_amount
          - entities.StorageUnit.fields.lien_amount_provisional_cents
          - entities.StorageUnit.fields.lien_amount_final_cents
          - state_machines.LienNotice.SENT_to_MATURED
        distinguishing_aspect: |
          On the StorageUnit/lien domain, the PROVISIONAL variant accrues 14 days
          (89000) while the FINAL variant accrues 19 elapsed days (94000); the two
          variants of lien_amount produce different results for the same unit.
        test_recipe:
          setup:
            - "Unit RENTED, monthly_rent 30000, past_due 60000; lien notice created at clock default 2026-03-01 (provisional lien 89000); clock advanced to 2026-03-20."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
          assert:
            - "StorageUnit.${unit}.lien_amount_provisional_cents == 89000"
            - "StorageUnit.${unit}.lien_amount_final_cents == 94000"
            - "LienNotice.${notice}.lien_amount_cents == 94000 (recomputed to FINAL at maturation)"

      - name: surplus_estimated_vs_final_diverge
        grounds:
          - calculations.surplus_distribution
          - entities.Sale.fields.estimated_surplus_cents
          - entities.Settlement.fields.surplus_cents
          - state_machines.Sale.UNPAID_to_PAID
        distinguishing_aspect: |
          On the Settlement/proceeds domain (distinct from the lien domain), the
          ESTIMATED surplus at close uses the provisional lien (46000) and the
          FINAL surplus on the Settlement uses the final lien (41000); same sale,
          different results.
        test_recipe:
          setup:
            - "Full pipeline to a Sale created at close (estimated_surplus 46000), then buyer pays (settlement finalized, surplus 41000)."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { auc: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-21T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}", captures: { auc_v: "$.data.version" } }
            - { call: "POST /buyers", payload: { full_name: "B1", email: "b1@x.com" }, as: PlatformAdmin, captures: { buyer: "$.data.id" } }
            - { call: "POST /buyers/${buyer}/fund-deposit", payload: { amount_cents: 100000 }, as: Buyer, as_user_id: "${buyer}" }
            - { call: "POST /auctions/${auc}/bids", payload: { buyer_id: "${buyer}", amount_cents: 150000, expected_auction_version: "${auc_v}" }, as: Buyer, as_user_id: "${buyer}", captures: { bid: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-22T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/close", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "GET /sales?auction_id=${auc}", as: PlatformAdmin, captures: { sale: "$.data[0].id" } }
          trigger:
            - { call: "POST /sales/${sale}/pay", payload: {}, as: Buyer, as_user_id: "${buyer}" }
          assert:
            - "Sale.${sale}.estimated_surplus_cents == 46000"
            - "The Settlement for sale ${sale} (GET /sales/${sale}/settlement) has surplus_cents == 41000"
            - "Settlement.surplus_cents (41000) != Sale.estimated_surplus_cents (46000)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_waterfall_ordered_buckets
        grounds:
          - calculations.surplus_distribution
          - entities.Settlement.fields.lien_recovered_cents
          - entities.Settlement.fields.facility_fee_cents
          - entities.Settlement.fields.surplus_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear waterfall (gross, final lien, facility_fee_bps)
          with nested min() caps filled strictly lien -> facility_fee -> surplus:
          lien_recovered=94000, facility_fee=15000, surplus=41000, summing to gross 150000.
        test_recipe:
          setup:
            - "Full pipeline through pay so the Settlement is finalized (gross 150000, final lien 94000, fee_bps 1000)."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { auc: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-21T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}", captures: { auc_v: "$.data.version" } }
            - { call: "POST /buyers", payload: { full_name: "B1", email: "b1@x.com" }, as: PlatformAdmin, captures: { buyer: "$.data.id" } }
            - { call: "POST /buyers/${buyer}/fund-deposit", payload: { amount_cents: 100000 }, as: Buyer, as_user_id: "${buyer}" }
            - { call: "POST /auctions/${auc}/bids", payload: { buyer_id: "${buyer}", amount_cents: 150000, expected_auction_version: "${auc_v}" }, as: Buyer, as_user_id: "${buyer}", captures: { bid: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-22T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/close", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "GET /sales?auction_id=${auc}", as: PlatformAdmin, captures: { sale: "$.data[0].id" } }
          trigger:
            - { call: "POST /sales/${sale}/pay", payload: {}, as: Buyer, as_user_id: "${buyer}" }
          assert:
            - "Settlement(sale ${sale}).lien_recovered_cents == 94000"
            - "Settlement(sale ${sale}).facility_fee_cents == 15000"
            - "Settlement(sale ${sale}).surplus_cents == 41000"
            - "Settlement.gross_proceeds_cents == 150000 == 94000 + 15000 + 41000"

      - name: sale_charges_rounding_order
        grounds:
          - calculations.sale_charges
          - entities.Sale.fields.buyer_premium_cents
          - entities.Sale.fields.sales_tax_cents
          - entities.Sale.fields.total_due_cents
        distinguishing_aspect: |
          Mode (b): pinned rounding order — buyer_premium rounded to cents FIRST
          (22500), then tax applied to the premium-inclusive base (round(172500*0.0825)
          = round(14231.25) = 14231), then summed to total_due 186731; taxing the
          winning amount alone (round(150000*0.0825)=12375) would give a different total.
        test_recipe:
          setup:
            - "Full pipeline to a Sale created at close (winning 150000, tax_bps 825)."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { auc: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-21T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}", captures: { auc_v: "$.data.version" } }
            - { call: "POST /buyers", payload: { full_name: "B1", email: "b1@x.com" }, as: PlatformAdmin, captures: { buyer: "$.data.id" } }
            - { call: "POST /buyers/${buyer}/fund-deposit", payload: { amount_cents: 100000 }, as: Buyer, as_user_id: "${buyer}" }
            - { call: "POST /auctions/${auc}/bids", payload: { buyer_id: "${buyer}", amount_cents: 150000, expected_auction_version: "${auc_v}" }, as: Buyer, as_user_id: "${buyer}", captures: { bid: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-22T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /auctions/${auc}/close", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "GET /sales?auction_id=${auc}", as: PlatformAdmin, captures: { sale: "$.data[0].id" } }
          assert:
            - "Sale.${sale}.buyer_premium_cents == 22500"
            - "Sale.${sale}.sales_tax_cents == 14231"
            - "Sale.${sale}.total_due_cents == 186731"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_cycle_review_needs_info
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.Dispute.NEEDS_INFO_to_UNDER_REVIEW
          - entities.Dispute.fields.status
        distinguishing_aspect: |
          On the Dispute entity, the machine is cyclic: UNDER_REVIEW -> NEEDS_INFO ->
          UNDER_REVIEW is traversed twice, returning the dispute to UNDER_REVIEW after
          the second provide-info.
        test_recipe:
          setup:
            - "A Sale exists (UNPAID); tenant raises a SALE dispute; admin reviews."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { auc: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-21T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}", captures: { auc_v: "$.data.version" } }
            - { call: "POST /buyers", payload: { full_name: "B1", email: "b1@x.com" }, as: PlatformAdmin, captures: { buyer: "$.data.id" } }
            - { call: "POST /buyers/${buyer}/fund-deposit", payload: { amount_cents: 100000 }, as: Buyer, as_user_id: "${buyer}" }
            - { call: "POST /auctions/${auc}/bids", payload: { buyer_id: "${buyer}", amount_cents: 150000, expected_auction_version: "${auc_v}" }, as: Buyer, as_user_id: "${buyer}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-22T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/close", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "GET /sales?auction_id=${auc}", as: PlatformAdmin, captures: { sale: "$.data[0].id" } }
            - { call: "POST /disputes", payload: { subject_type: "SALE", sale_id: "${sale}", raised_by: "TENANT", reason: "wrong tenant billed" }, as: Tenant, as_user_id: "${ten}", captures: { disp: "$.data.id" } }
            - { call: "POST /disputes/${disp}/review", payload: {}, as: PlatformAdmin }
            - { call: "POST /disputes/${disp}/request-info", payload: {}, as: PlatformAdmin }
            - { call: "POST /disputes/${disp}/provide-info", payload: { note: "round 1 info" }, as: Tenant, as_user_id: "${ten}" }
            - { call: "POST /disputes/${disp}/request-info", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /disputes/${disp}/provide-info", payload: { note: "round 2 info" }, as: Tenant, as_user_id: "${ten}" }
          assert:
            - "Dispute.${disp}.status == UNDER_REVIEW (after two NEEDS_INFO->UNDER_REVIEW cycles)"

      - name: sale_parallel_payment_and_cleanout_axes
        grounds:
          - state_machines.Sale.UNPAID_to_PAID
          - state_machines.Sale.PENDING_to_COMPLETED
          - entities.Sale.fields.payment_status
          - entities.Sale.fields.cleanout_status
        distinguishing_aspect: |
          On the Sale entity, payment_status and cleanout_status are independent axes:
          pay advances payment_status UNPAID->PAID while cleanout_status stays PENDING;
          cleanout then advances cleanout_status PENDING->COMPLETED while payment_status
          stays PAID.
        test_recipe:
          setup:
            - "Full pipeline to a Sale created at close; buyer pays (payment PAID, cleanout still PENDING)."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { auc: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-21T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}", captures: { auc_v: "$.data.version" } }
            - { call: "POST /buyers", payload: { full_name: "B1", email: "b1@x.com" }, as: PlatformAdmin, captures: { buyer: "$.data.id" } }
            - { call: "POST /buyers/${buyer}/fund-deposit", payload: { amount_cents: 100000 }, as: Buyer, as_user_id: "${buyer}" }
            - { call: "POST /auctions/${auc}/bids", payload: { buyer_id: "${buyer}", amount_cents: 150000, expected_auction_version: "${auc_v}" }, as: Buyer, as_user_id: "${buyer}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-22T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/close", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "GET /sales?auction_id=${auc}", as: PlatformAdmin, captures: { sale: "$.data[0].id" } }
            - { call: "POST /sales/${sale}/pay", payload: {}, as: Buyer, as_user_id: "${buyer}" }
          trigger:
            - { call: "POST /sales/${sale}/cleanout", payload: {}, as: Buyer, as_user_id: "${buyer}" }
          assert:
            - "Immediately after pay: Sale.${sale}.payment_status == PAID AND Sale.${sale}.cleanout_status == PENDING"
            - "After cleanout: Sale.${sale}.payment_status == PAID AND Sale.${sale}.cleanout_status == COMPLETED"
            - "StorageUnit.${unit}.status == CLEARED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: pay_cascade_settlement_to_tenant_and_facility
        grounds:
          - state_machines.Sale.UNPAID_to_PAID
          - entities.Settlement.fields.surplus_cents
          - entities.Tenant.fields.surplus_balance_cents
          - entities.Facility.fields.recovery_balance_cents
        distinguishing_aspect: |
          Depth-3 chain from the pay trigger: pay mutates Sale (UNPAID->PAID); the Sale
          becoming PAID causes the Settlement to finalize; the Settlement finalize causes
          Tenant.surplus_balance_cents to be credited 41000 — each hop caused by the prior.
        test_recipe:
          setup:
            - "Full pipeline to a Sale created at close, then pay."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
