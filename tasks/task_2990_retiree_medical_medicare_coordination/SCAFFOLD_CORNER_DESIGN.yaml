        excluded_because:
          difficulty_instance: resource_temporal_overlap / coverage_interval_half_open_adjacency_per_retiree
          rationale: "That instance admits the exactly-adjacent interval and rejects the one-millisecond overlap on the same retiree."

  # ===========================================================================
  - section: validations
    instances:

      - name: blank_or_unknown_role_header_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
          - response_envelope.error
        distinguishing_aspect: |
          Priority 1 rejects three distinct header defects before any other check
          runs: an empty X-User-ID, an empty X-User-Role, and an X-User-Role that
          is a well-formed string but not one of the eight declared role names.
          All three return 401 ERR_UNAUTHENTICATED, not 403 ERR_UNAUTHORIZED,
          because the caller was never identified in the first place. The headers
          must be sent as empty strings, not omitted-with-whitespace.
        test_recipe:
          setup:
            - "Empty database. No resource is needed because priority 1 precedes every existence check."
          setup_api_calls: []
          trigger:
            - call: "GET /retiree-benefits/plan-years"
              payload: {}
              as: BenefitsAdmin
              as_user_id: ""
              captures: { err_blank_id: $.data.error_id }
            - call: "GET /retiree-benefits/plan-years"
              payload: {}
              as: ""
              as_user_id: "admin-01"
              captures: { err_blank_role: $.data.error_id }
            - call: "GET /retiree-benefits/plan-years"
              payload: {}
              as: "AuditorGeneral"
              as_user_id: "admin-01"
              captures: { err_unknown_role: $.data.error_id }
          assert:
            - "BLANK X-User-ID: HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "BLANK X-User-Role: HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "UNKNOWN ROLE AuditorGeneral: HTTP 401 with data.error_id == ERR_UNAUTHENTICATED, not 403 ERR_UNAUTHORIZED"
            - "Every response carries response_type == error with meta.api_request_id, meta.api_request_timestamp, data.error_id and data.message"

      - name: pagination_limit_and_offset_out_of_range_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=13]
          - errors.ERR_INVALID_PAGINATION
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          limit must land in the inclusive range [1, 100] and offset must be a
          non-negative integer, so limit 0, limit 101 and offset -1 all fail with
          400 while limit 1 and limit 100 succeed. Probing both ends of the range
          separates an inclusive bound from an exclusive one.
        test_recipe:
          setup:
            - "One Retiree exists so the successful probes return a non-empty page."
          setup_api_calls:
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Rosa Alvarez", birth_date: "1963-06-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 150 }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r1_id: $.data.id }
          trigger:
            - call: "GET /retiree-benefits/retirees"
              payload: { limit: 0 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err_low: $.data.error_id }
            - call: "GET /retiree-benefits/retirees"
              payload: { limit: 101 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err_high: $.data.error_id }
            - call: "GET /retiree-benefits/retirees"
              payload: { offset: -1 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err_offset: $.data.error_id }
            - call: "GET /retiree-benefits/retirees"
              payload: { limit: 1 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "GET /retiree-benefits/retirees"
              payload: { limit: 100 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
          assert:
            - "limit 0: HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"
            - "limit 101: HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"
            - "offset -1: HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"
            - "limit 1: HTTP 200 with exactly 1 row, total_count 1, has_more false"
            - "limit 100: HTTP 200 with exactly 1 row, total_count 1, has_more false"

      - name: duplicate_plan_year_and_duplicate_plan_code_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=41]
          - validations[priority=42]
          - errors.ERR_DUPLICATE_PLAN_YEAR
          - errors.ERR_DUPLICATE_PLAN_CODE
        distinguishing_aspect: |
          The plan-year uniqueness key is the bare year, while the plan-option
          uniqueness key is (plan_year_id, plan_code) - so the SAME plan_code is
          admitted under a different plan year. Asserting the second 2028 option
          succeeds is what proves the option key is scoped rather than global.
        test_recipe:
          setup:
            - "PlanYear 2027 in DRAFT holding a DRAFT PlanOption with plan_code PRE65-CORE."
            - "PlanYear 2028 in DRAFT holding no options."
          setup_api_calls:
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py27_id: $.data.id }
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2028, open_enrollment_start: "2027-10-15T00:00:00Z", open_enrollment_end: "2027-11-15T00:00:00Z", coverage_start: "2028-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py28_id: $.data.id }
            - call: "POST /retiree-benefits/plan-options"
              payload: { plan_year_id: "${py27_id}", plan_code: "PRE65-CORE", coverage_class: "PRE_MEDICARE_GROUP", monthly_premium_cents: 74500, requires_medicare_part_b: false, allowed_grandfather_groups: ["GRANDFATHERED_A", "TRANSITION_B", "STANDARD_C"], subsidy_vehicle: "NONE", rx_gross_value_bps: 0, rx_net_value_bps: 0 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { po_pre_id: $.data.id }
          trigger:
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-09-01T00:00:00Z", open_enrollment_end: "2026-10-01T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 100000, hra_credit_medicare_cents: 120000, carryover_cap_pct: 0.25, discount_rate_bps: 400, assumed_annual_subsidy_cents: 200000, assumed_payment_years: 15 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err_year: $.data.error_id }
            - call: "POST /retiree-benefits/plan-options"
              payload: { plan_year_id: "${py27_id}", plan_code: "PRE65-CORE", coverage_class: "INDIVIDUAL_EXCHANGE_HRA", monthly_premium_cents: 0, requires_medicare_part_b: false, allowed_grandfather_groups: ["GRANDFATHERED_A"], subsidy_vehicle: "NONE", rx_gross_value_bps: 0, rx_net_value_bps: 0 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err_code: $.data.error_id }
            - call: "POST /retiree-benefits/plan-options"
              payload: { plan_year_id: "${py28_id}", plan_code: "PRE65-CORE", coverage_class: "PRE_MEDICARE_GROUP", monthly_premium_cents: 74500, requires_medicare_part_b: false, allowed_grandfather_groups: ["GRANDFATHERED_A", "TRANSITION_B", "STANDARD_C"], subsidy_vehicle: "NONE", rx_gross_value_bps: 0, rx_net_value_bps: 0 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { po_28_id: $.data.id }
          assert:
            - "SECOND 2027: HTTP 409 with data.error_id == ERR_DUPLICATE_PLAN_YEAR, even though every other field differs"
            - "SECOND PRE65-CORE IN 2027: HTTP 409 with data.error_id == ERR_DUPLICATE_PLAN_CODE"
            - "PRE65-CORE IN 2028: HTTP 201, because the plan_code key is scoped to the plan year"
            - "PlanYear ${py27_id} still has open_enrollment_start 2026-10-15T00:00:00.000Z and version 1, so the rejected duplicate wrote nothing"

      - name: duplicate_hra_account_for_same_retiree_and_year_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=43]
          - errors.ERR_DUPLICATE_HRA_ACCOUNT
        distinguishing_aspect: |
          The (retiree_id, plan_year_id) key is enforced in ANY status, so a
          second account is refused even after the first has been closed. The
          instance closes the first account before retrying, which is what
          separates a status-blind uniqueness check from one that only looks at
          OPEN rows.
        test_recipe:
          setup:
            - "PlanYear 2027 OPEN, R1 CERTIFIED ELIGIBLE, one HraAccount for (R1, 2027) with covered_months 12."
            - "Logical clock at 2026-10-20T00:00:00Z, then 2027-12-31T00:00:00Z for the close."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Rosa Alvarez", birth_date: "1963-06-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 150 }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /retiree-benefits/eligibility-determinations"
              payload: { retiree_id: "${r1_id}", plan_year_id: "${py_id}", expected_retiree_version: "${r1_v}" }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { det1_id: $.data.id }
            - call: "POST /retiree-benefits/eligibility-determinations/${det1_id}/certify"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-02"
            - call: "POST /retiree-benefits/hra-accounts"
              payload: { retiree_id: "${r1_id}", plan_year_id: "${py_id}", covered_months: 12 }
              as: HraAdministrator
              as_user_id: "hra-admin-01"
              captures: { hra1_id: $.data.id }
          trigger:
            - call: "POST /retiree-benefits/hra-accounts"
              payload: { retiree_id: "${r1_id}", plan_year_id: "${py_id}", covered_months: 6 }
              as: HraAdministrator
              as_user_id: "hra-admin-01"
              captures: { err_open: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-12-31T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/hra-accounts/${hra1_id}/close-year"
              payload: {}
              as: HraAdministrator
              as_user_id: "hra-admin-01"
            - call: "POST /retiree-benefits/hra-accounts"
              payload: { retiree_id: "${r1_id}", plan_year_id: "${py_id}", covered_months: 6 }
              as: HraAdministrator
              as_user_id: "hra-admin-01"
              captures: { err_closed: $.data.error_id }
          assert:
            - "WHILE OPEN: HTTP 409 with data.error_id == ERR_DUPLICATE_HRA_ACCOUNT"
            - "AFTER CLOSE: HraAccount.${hra1_id}.status == CLOSED"
            - "AFTER CLOSE: HTTP 409 with data.error_id == ERR_DUPLICATE_HRA_ACCOUNT again, because the key is enforced in any status"
            - "Only one HraAccount exists for (${r1_id}, ${py_id}) and its covered_months is still 12"

      - name: prior_hra_account_still_open_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=44]
          - errors.ERR_PRIOR_HRA_ACCOUNT_NOT_CLOSED
