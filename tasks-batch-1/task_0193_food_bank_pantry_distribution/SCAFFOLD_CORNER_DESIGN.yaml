        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dispose-stale-lot]
          - errors[ERR_STALE_LOT_VERSION]
        distinguishing_aspect: "Disposing a lot with expected_lot_version one behind the current version (after a clock-advance EXPIRED bump) returns ERR_STALE_LOT_VERSION (412)."
        test_recipe:
          setup:
            - "Clock at 2026-06-01. A PRODUCE lot expiring 2026-06-15; the operator reads version 1, then the clock advances past expiry (lot EXPIRED, version 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: FoodBankOperator
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 100, expiration_date: "2026-06-15T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00.000Z" }
              as: FoodBankOperator
          trigger:
            - call: "POST /inventory-lots/${lot_id}/dispose"
              payload: { expected_lot_version: "${lot_v1}" }
              as: FoodBankOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412 and response error_id == ERR_STALE_LOT_VERSION"
            - "InventoryLot.${lot_id}.disposition == EXPIRED (still disposable after re-reading current version)"

