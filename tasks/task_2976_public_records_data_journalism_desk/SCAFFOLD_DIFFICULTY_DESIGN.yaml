            - "One Investigation (FULL_DATA_RELEASE) with a CLEAN_LOCKED Dataset of record_count 500 and an AnalysisRun that is ALLOCATED and APPROVED."
            - "Two Findings f1 and f2, both document-matched and then SME_CONFIRMED through assignments A1 and A2 held by one ExpertReviewer (max_concurrent_assignments 2), so both assignments are COMPLETED and active_assignment_count is 0."
            - "The Investigation has been driven to FINDINGS_LOCKED."
