      - name: cascading_side_effects_covered_by_difficulty_design
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / challenge_submit_cascades_to_selection_band"
          rationale: |
            The end-to-end chain for this layer (challenge submit -> violation under_challenge ->
            BasicScore certified_measure -> percentile/alert_status -> Carrier open_alert_count and
            intervention_status -> iss_value -> selection_band, plus the two-carrier variant and the
            adjudication-to-coaching-waiver variant) is already asserted hop by hop in §1.8, with the
            intermediate values pinned at each hop. Repeating it here would duplicate those asserts.

      - name: dual_variant_calculation_covered_by_difficulty_design
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: "dual_variant_calc / basic_score_provisional_vs_certified_diverge_while_challenge_open"
          rationale: |
            Both variants and the delta on switch (provisional including the challenged severity,
            certified excluding it, and the reconciliation when the challenge resolves or is withdrawn)
            are asserted with literal measures and percentiles in §1.8, as is the strict-versus-
            adjudicated driver variant pair.

      - name: rate_threshold_boundary_covered_by_difficulty_design
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: "boundary_precision_check / alert_status_exactly_at_monitor_then_intervention_percentile"
          rationale: |
            The instantaneous threshold boundaries (percentile exactly at monitor_percentile, exactly at
            intervention_percentile, and one tick below each) plus the intervention_status roll-up are
            already pinned in §1.8; the cumulative quota boundary is covered by the challenge quota
            instances there and by the rolling-window re-derivation instance in the endpoints section.

      - name: derived_field_reconciliation_covered_by_difficulty_design
        claim_type: derived_field_reconciliation
        excluded_because:
          difficulty_instance: "compensating_invariant / driver_attribution_counts_conserved_on_attribution_release"
          rationale: |
            Derived-field correctness after create, after update and after removal of the source row is
            asserted there as a conservation identity across Driver aggregates, Carrier
            unattributed_violation_count/scored_violation_count and the coaching waiver, which is a
            strictly stronger check than a single-field before/after comparison.

  - section: consistency_model
    instances:
      - name: score_response_and_immediate_reads_agree_without_a_scoring_run
        claim_type: immediate
        grounds:
