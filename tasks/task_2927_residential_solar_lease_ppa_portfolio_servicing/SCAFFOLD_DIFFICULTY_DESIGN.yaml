      - name: technician_half_open_window_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=13].technician_window_conflict
          - errors[ERR_TECHNICIAN_WINDOW_CONFLICT]
          - state_machines.TruckRoll.SCHEDULED_to_CANCELLED
          - state_machines.OutageEvent.TRIAGED_to_DISPATCHED
          - concurrency_rules[POST /servicing/truck-rolls]
        distinguishing_aspect: |
          One technician, three requested windows on 2026-08-03. [08:00,12:00) is
          booked; [12:00,16:00) starts exactly when it ends and MUST be accepted
          because the interval is half-open with no buffer; [07:00,11:59) overlaps the
          first by 3h59m and MUST be rejected 409. Cancelling the first roll then makes
          the identical third request succeed, because CANCELLED rolls never conflict —
          and 11:59 is still strictly before 12:00, so the surviving [12:00,16:00) roll
          does not block it either.
