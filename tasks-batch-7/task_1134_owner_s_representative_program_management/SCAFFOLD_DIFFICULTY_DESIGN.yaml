            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts", payload: { program_id: "${prog}", vendor_name: "V1", contract_type: "CONTRACTOR", solicitation_estimate_cents: 500000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ct1: $.data.id } }
            - { call: "POST /contracts/${ct1}/begin-negotiation", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /contracts/${ct1}/execute", payload: { awarded_amount_cents: 2000000 }, as: OwnerRepExecutive, as_user_id: "pm-1", captures: { err1: $.data.error_id } }
            - { call: "POST /contracts/${ct1}/execute", payload: { awarded_amount_cents: 2000000 }, as: OwnerRepExecutive, as_user_id: "exec-1", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_SEGREGATION_OF_DUTIES   # priority 6 safety beats priority 10 fiscal"
            - "err2 == ERR_AWARD_EXCEEDS_BUDGET   # fiscal check fires once SoD passes"

  - rule_id: boundary_precision_check
    instances:
      - name: contingency_exact_drain_boundary
        grounds:
          - calculations.contingency_pool_recompute
          - validations[priority=10]
          - errors[ERR_CONTINGENCY_EXCEEDED]
        distinguishing_aspect: |
          Boundary on the contingency-cents metric via POST /contingency-drawdowns:
          a reserve exactly equal to contingency_available_cents succeeds (the check
          is inclusive `<=`, draining to zero), while a further 1-cent reserve fails
          with ERR_CONTINGENCY_EXCEEDED.
        test_recipe:
          setup:
            - "Program ACTIVE: budget 500000, contingency 100000, single line CC-100=500000; available == 100000"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-DRAIN", owner_organization: "OwnerOrg" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "obj", scope_statement: "scope" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 500000, contingency_total_cents: 100000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 500000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /contingency-drawdowns", payload: { program_id: "${prog}", purpose: "exact drain", amount_cents: 100000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { dd: $.data.id, dd_st: $.data.status } }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { avail: $.data.contingency_available_cents, res: $.data.contingency_reserved_cents } }
            - { call: "POST /contingency-drawdowns", payload: { program_id: "${prog}", purpose: "one cent over", amount_cents: 1 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { err: $.data.error_id } }
          assert:
            - "dd_st == RESERVED   # amount == available is allowed (inclusive boundary)"
            - "avail == 0 and res == 100000"
            - "err == ERR_CONTINGENCY_EXCEEDED   # 1 cent above the drained pool fails"

      - name: risk_escalation_threshold_equality
        grounds:
          - calculations.risk_exposure_score
          - state_machines.RiskEntry.ASSESSED_to_ESCALATED
        distinguishing_aspect: |
          Boundary on the risk-exposure metric via POST /risk-entries/{id}/assess
          (different metric and endpoint from the contingency drain): exposure one
          cent below the 50000000 threshold keeps the risk ASSESSED; exactly at the
          threshold escalates (the comparison is `>=`).
        test_recipe:
          setup:
            - "Program ACTIVE: budget 1000000, contingency 100000, single line CC-100"
            - "R1 created IDENTIFIED"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-THR", owner_organization: "OwnerOrg" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "obj", scope_statement: "scope" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 1000000, contingency_total_cents: 100000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 1000000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /risk-entries", payload: { program_id: "${prog}", title: "R1", category: "COST", probability_pct: 1, impact_cents: 1 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /risk-entries/${r1}/assess", payload: { probability_pct: 50, impact_cents: 99999998 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { st1: $.data.status, ex1: $.data.exposure_cents } }
            - { call: "POST /risk-entries/${r1}/assess", payload: { probability_pct: 50, impact_cents: 100000000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { st2: $.data.status, ex2: $.data.exposure_cents } }
          assert:
            - "ex1 == 49999999 and st1 == ASSESSED   # one cent below threshold: no escalation"
            - "ex2 == 50000000 and st2 == ESCALATED   # exactly at threshold: >= escalates"

      - name: begin_closing_zero_open_items
        grounds:
          - state_machines.Program.ACTIVE_to_CLOSING
          - errors[ERR_PROGRAM_HAS_OPEN_ITEMS]
        distinguishing_aspect: |
          Boundary on an open-item COUNT metric via POST /programs/{id}/begin-closing
          (different metric and endpoint from the two cents boundaries): exactly one
          open (EXECUTED) contract blocks closing; after completion the zero-count
          gate passes.
        test_recipe:
          setup:
            - "Program ACTIVE: budget 1000000, contingency 100000; CT1 EXECUTED 400000 (the single open item)"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-ZERO", owner_organization: "OwnerOrg" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "obj", scope_statement: "scope" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 1000000, contingency_total_cents: 100000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 1000000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts", payload: { program_id: "${prog}", vendor_name: "V1", contract_type: "CONTRACTOR", solicitation_estimate_cents: 400000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ct1: $.data.id } }
            - { call: "POST /contracts/${ct1}/begin-negotiation", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts/${ct1}/execute", payload: { awarded_amount_cents: 400000 }, as: OwnerRepExecutive, as_user_id: "exec-1" }
          trigger:
            - { call: "POST /programs/${prog}/begin-closing", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { err: $.data.error_id } }
            - { call: "POST /contracts/${ct1}/complete", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /programs/${prog}/begin-closing", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { st: $.data.status } }
          assert:
            - "err == ERR_PROGRAM_HAS_OPEN_ITEMS   # count == 1 blocks"
            - "st == CLOSING   # count == 0 passes the gate"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: change_order_submit_requires_contract_executed
        grounds:
          - state_machines.ChangeOrder.DRAFT_to_UNDER_REVIEW
          - errors[ERR_CONTRACT_NOT_EXECUTED]
        distinguishing_aspect: |
          Entity pair ChangeOrder -> Contract: submit is legal only while the parent
          contract is EXECUTED; the same submit fails while the contract is
          SOLICITED and succeeds after negotiation and execution flip its state.
        test_recipe:
          setup:
            - "Program ACTIVE: budget 10000000, contingency 1000000; CT1 initially SOLICITED"
            - "CO1 DRAFT amount 100000 against CT1"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-X1", owner_organization: "OwnerOrg" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "obj", scope_statement: "scope" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 10000000, contingency_total_cents: 1000000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 10000000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts", payload: { program_id: "${prog}", vendor_name: "V1", contract_type: "CONTRACTOR", solicitation_estimate_cents: 4500000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ct1: $.data.id } }
            - { call: "POST /change-orders", payload: { contract_id: "${ct1}", title: "CO1", reason: "x", amount_cents: 100000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { co1: $.data.id } }
          trigger:
            - { call: "POST /change-orders/${co1}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { err: $.data.error_id } }
            - { call: "POST /contracts/${ct1}/begin-negotiation", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts/${ct1}/execute", payload: { awarded_amount_cents: 4500000 }, as: OwnerRepExecutive, as_user_id: "exec-1" }
            - { call: "POST /change-orders/${co1}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { st: $.data.status } }
          assert:
            - "err == ERR_CONTRACT_NOT_EXECUTED   # ChangeOrder gated on Contract state"
            - "st == UNDER_REVIEW   # same call succeeds once contract is EXECUTED"

      - name: occupancy_plan_ready_requires_approved_baseline
        grounds:
          - state_machines.OccupancyPlan.COORDINATING_to_READY
          - errors[ERR_NO_APPROVED_BASELINE]
        distinguishing_aspect: |
          Entity pair OccupancyPlan -> Baseline (different pair from
          ChangeOrder -> Contract): mark-ready is gated on a different aggregate
          root's APPROVED baseline existing; approving the baseline flips the gate.
        test_recipe:
          setup:
            - "Program CHARTERING with a Baseline that is DRAFT (never submitted)"
