            - { call: "POST /programs/batches/${b_id}/acknowledge", payload: { outcomes: [{ encounter_id: "${e1}", outcome: "ACCEPTED" }, { encounter_id: "${e2}", outcome: "ACCEPTED" }, { encounter_id: "${e3}", outcome: "ACCEPTED" }] }, as: StateAgency }
