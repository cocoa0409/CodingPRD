            - "the second trigger call returns HTTP 201 and ManifestEntry.${me_id}.status == ASSIGNED"
            - "TransportSegment.${seg_ada}.booked_seat_count == 1"
            - "Program.${prog_id}.seated_guest_count == 1"

      - name: contract_negotiation_round_cap_error
        claim_type: triggerable
