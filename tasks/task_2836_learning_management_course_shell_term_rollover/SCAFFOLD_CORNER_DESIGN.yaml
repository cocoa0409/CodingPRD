# =============================================================================
# §1.9 Scaffold Corner Design — Learning Management Course Shell & Term
# Rollover (task 2836). Breadth probe over §1.1–§1.7; the depth probe (§1.8)
# lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml. Sections and claim_type values come
# from references/claim-extraction-guide.md and nothing else.
#
# Logical clock: every recipe below relies on the 2026-08-01T00:00:00Z startup
# default declared by POST /_clock/set_current_utc unless it moves the clock
# explicitly.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # 1. Entities  (entity_topology: flat)
  # ===========================================================================
  - section: entities
    instances:

      - name: academic_term_creation_echoes_every_input_and_mints_the_computed_calendar
        claim_type: creation
        grounds:
          - entities.AcademicTerm
          - endpoints.POST_/academic-terms
          - calculations.retention_purge_schedule
        distinguishing_aspect: "A create with every optional field supplied must return 201 with those exact values AND the two retention_purge_schedule outputs; an implementation that defers student_access_end_at to a later write returns null here."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z", add_drop_deadline_at: "2026-09-07T00:00:00Z", finals_window_start_at: "2026-12-04T00:00:00Z", finals_window_end_at: "2026-12-11T00:00:00Z", access_grace_days: 30, retention_class: "STANDARD" }
              as: Registrar
              captures: { term_id: $.data.id, life: $.data.lifecycle_state, posture: $.data.continuity_posture, access_end: $.data.student_access_end_at, purge_at: $.data.retention_purge_at, pct: $.data.rollover_completion_pct, epoch: $.data.sis_sync_epoch, v: $.data.version }
          assert:
            - "HTTP 201 and the envelope is { meta, response_type: \"object\", data: {...} }"
            - "${life} == PLANNING and ${posture} == NORMAL — both state dimensions start at their declared initial_state"
            - "${access_end} == \"2027-01-10T23:59:59Z\" and ${purge_at} == \"2028-01-10T23:59:59Z\" — computed at create time, not lazily"
            - "${pct} == 100.00 (empty eligible-shell set), ${epoch} == 0, ${v} == 1 and ${term_id} is a bare UUID with no type prefix"

      - name: academic_term_defaults_derive_the_add_drop_and_finals_calendar_from_term_bounds
        claim_type: defaults
        grounds:
          - entities.AcademicTerm.fields.add_drop_deadline_at
          - entities.AcademicTerm.fields.finals_window_start_at
          - entities.AcademicTerm.fields.access_grace_days
          - entities.AcademicTerm.fields.retention_class
        distinguishing_aspect: "Omitting all five optional inputs must produce term_start_at + 14 days, term_end_at - 7 days, term_end_at, 30 and STANDARD — not nulls and not copies of the term bounds."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /academic-terms"
              payload: { term_code: "2027SP", term_start_at: "2027-01-11T00:00:00Z", term_end_at: "2027-05-07T00:00:00Z" }
              as: Registrar
              captures: { add_drop: $.data.add_drop_deadline_at, finals_start: $.data.finals_window_start_at, finals_end: $.data.finals_window_end_at, grace: $.data.access_grace_days, retention: $.data.retention_class, access_end: $.data.student_access_end_at }
          assert:
            - "${add_drop} == \"2027-01-25T00:00:00Z\" (term_start_at + 14 days)"
            - "${finals_start} == \"2027-04-30T00:00:00Z\" (term_end_at - 7 days) and ${finals_end} == \"2027-05-07T00:00:00Z\" (term_end_at)"
            - "${grace} == 30 and ${retention} == STANDARD"
            - "${access_end} == \"2027-06-06T23:59:59Z\" — the default grace feeds retention_purge_schedule in the same request"

      - name: course_shell_retrieval_returns_the_stored_row_with_its_derived_seat_fields
        claim_type: retrieval
        grounds:
          - endpoints.GET_/course-shells/{id}
          - entities.CourseShell.fields.effective_seat_cap
          - entities.CourseShell.fields.publish_readiness
        distinguishing_aspect: "A GET after APPROVE must show effective_seat_cap copied from base_seat_cap and publish_readiness true; a GET of the same shell before APPROVE shows the pre-approval defaults, so the read is of stored state rather than a recomputation from inputs."
        test_recipe:
          setup:
            - "One PLANNING term with one REQUESTED OFFICIAL shell of base_seat_cap 40, later approved."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-5001", full_name: "Alan Kay", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "ART100-01", shell_type: "OFFICIAL", base_seat_cap: 40 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: LmsAdmin
              captures: { state_pre: $.data.provisioning_state, eff_pre: $.data.effective_seat_cap, expiry_pre: $.data.sandbox_expires_at }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
          trigger:
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { state_post: $.data.provisioning_state, base: $.data.base_seat_cap, eff_post: $.data.effective_seat_cap, ready: $.data.publish_readiness, storage: $.data.storage_mb, expiry_post: $.data.sandbox_expires_at, v: $.data.version }
          assert:
            - "${state_pre} == REQUESTED and ${eff_pre} == 25 — the field default, NOT base_seat_cap 40, until APPROVE copies it"
            - "${state_post} == PROVISIONED, ${base} == 40 and ${eff_post} == 40"
            - "${ready} == true, ${storage} == 0.00 and ${v} == 2 (create then approve)"
            - "${expiry_pre} is null and ${expiry_post} is null — sandbox_expires_at stays null for shell_type OFFICIAL"

      - name: course_shell_listing_filters_by_term_and_shell_type_and_paginates
        claim_type: listing
        grounds:
          - endpoints.GET_/course-shells
          - response_envelope.pagination_fields
        distinguishing_aspect: "total_count must report the size of the FILTERED set, not the table, and has_more must be true only while offset + limit < total_count; a shell of a different shell_type must vanish from a filtered page."
        test_recipe:
          setup:
            - "One term holds three OFFICIAL shells and one SANDBOX shell, all owned by the same instructor."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-5002", full_name: "Jean Bartik", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "BIO101-01", shell_type: "OFFICIAL" }
              as: LmsAdmin
              captures: { s1: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "BIO101-02", shell_type: "OFFICIAL" }
              as: LmsAdmin
              captures: { s2: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "BIO101-03", shell_type: "OFFICIAL" }
              as: LmsAdmin
              captures: { s3: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "BIO-SBX", shell_type: "SANDBOX" }
              as: LmsAdmin
              captures: { s4: $.data.id }
          trigger:
            - call: "GET /course-shells"
              payload: { term_id: "${term_id}", shell_type: "OFFICIAL", limit: 2, offset: 0 }
              as: LmsAdmin
              captures: { first_id: "$.data[0].id" }
            - call: "GET /course-shells"
              payload: { term_id: "${term_id}", shell_type: "OFFICIAL", limit: 2, offset: 2 }
              as: LmsAdmin
            - call: "GET /course-shells"
              payload: { term_id: "${term_id}", shell_type: "SANDBOX" }
              as: LmsAdmin
          assert:
            - "page 1 returns 2 rows with response_type \"array\", total_count 3 and has_more true; ${first_id} == ${s1} (created_at ASC)"
            - "page 2 returns 1 row (${s3}) with total_count 3 and has_more false — total_count counts the filtered set, not the four shells in the table"
            - "the SANDBOX-filtered call returns exactly 1 row (${s4}), proving shell_type filters rather than sorts"

      - name: content_item_create_missing_required_shell_id_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST_/content-items
          - validations[6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "shell_id, item_type and title are the three non-optional inputs; omitting shell_id must fail request-shape validation (priority 6) before any FK existence check (priority 5) can fire, so the code is ERR_INVALID_REQUEST and not a NOT_FOUND."
        test_recipe:
          setup:
            - "One PROVISIONED OFFICIAL shell owned by the acting instructor."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-5003", full_name: "Karen Sparck Jones", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "LIN200-01", shell_type: "OFFICIAL" }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
          trigger:
            - call: "POST /content-items"
              payload: { item_type: "PAGE", title: "Syllabus" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { err: $.data.error_id }
            - call: "POST /content-items"
              payload: { shell_id: "${shell_id}", item_type: "PAGE" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { err2: $.data.error_id }
            - call: "POST /content-items"
              payload: { shell_id: "${shell_id}", item_type: "PAGE", title: "Syllabus" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_id: $.data.id, pts: $.data.points_possible, mb: $.data.storage_mb, cs: $.data.copy_state, ds: $.data.date_stripped, subs: $.data.submission_count }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 422 — a missing shell_id is a shape failure, not ERR_SHELL_NOT_FOUND"
            - "${err2} == ERR_INVALID_REQUEST — title is equally required"
            - "the third call returns 201 with ${pts} == 0.00, ${mb} == 0.00, ${cs} == SOURCE, ${ds} == false and ${subs} == 0 — every declared default applied in one create"

      - name: course_shell_seat_fields_are_computed_from_enrollment_rows_not_from_input
        claim_type: computed_fields
        grounds:
          - entities.CourseShell.fields.active_enrollment_count
          - entities.CourseShell.fields.seat_utilization_pct
          - calculations.waitlist_promotion_capacity
        distinguishing_aspect: "POST /course-shells declares only four inputs plus base_seat_cap, so active_enrollment_count and seat_utilization_pct can only move as a consequence of Enrollment writes; after two STUDENT adds against base_seat_cap 8 the shell must read 2 and 25.00, and a TEACHER row must not move either figure."
        test_recipe:
          setup:
            - "Term IN_SESSION with a PROVISIONED OFFICIAL shell of base_seat_cap 8."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-5004", full_name: "Radia Perlman", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "NET300-01", shell_type: "OFFICIAL", base_seat_cap: 8 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /people"
              payload: { sis_person_id: "S-5101", full_name: "Learner A", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { p1: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-5102", full_name: "Learner B", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { p2: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${p1}", role: "STUDENT" }
              as: Registrar
              captures: { e1_state: $.data.enrollment_state, e1_pos: $.data.waitlist_position }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${p2}", role: "STUDENT" }
              as: Registrar
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: LmsAdmin
              captures: { active2: $.data.active_enrollment_count, util2: $.data.seat_utilization_pct, of2: $.data.overflow_flag }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${prof_id}", role: "TEACHER" }
              as: Registrar
              captures: { t_state: $.data.enrollment_state }
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: LmsAdmin
              captures: { active3: $.data.active_enrollment_count, util3: $.data.seat_utilization_pct }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: Registrar
              captures: { headcount: $.data.total_active_enrollments }
          assert:
            - "${e1_state} == ACTIVE with ${e1_pos} null — requested_state omitted defaults to the ACTIVE branch"
            - "${active2} == 2, ${util2} == 25.00 (2 / 8 * 100) and ${of2} == false"
            - "${t_state} == ACTIVE, yet ${active3} == 2 and ${util3} == 25.00 — a TEACHER row never consumes a seat"
            - "${headcount} == 2 — the term counts STUDENT rows only, matching the shell's own figure"

      - name: person_system_fields_are_server_minted_and_version_advances_on_every_write
        claim_type: system_fields
        grounds:
          - entities.Person
          - endpoints.PATCH_/people/{id}
        distinguishing_aspect: "id / created_at / updated_at / version are the four common fields; a PATCH must leave id and created_at byte-identical, refresh updated_at and take version from 1 to 2. ferpa_block and access_revoked_at are source: system, so they arrive only through PATCH, never through POST."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /people"
              payload: { sis_person_id: "S-5201", full_name: "Ada Twist", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { pid: $.data.id, created: $.data.created_at, updated1: $.data.updated_at, v1: $.data.version, block1: $.data.ferpa_block, revoked1: $.data.access_revoked_at, charge: $.data.sandbox_storage_charge_usd }
          trigger:
            - call: "PATCH /people/${pid}"
              payload: { ferpa_block: true, full_name: "Ada Twist-Rivera" }
              as: Registrar
              captures: { pid2: $.data.id, created2: $.data.created_at, updated2: $.data.updated_at, v2: $.data.version, block2: $.data.ferpa_block, name2: $.data.full_name }
          assert:
            - "${v1} == 1, ${block1} == false, ${revoked1} is null and ${charge} == 0.00 — every system/computed field initialised by the server"
            - "${created} carries three fractional digits in ISO 8601 UTC and ${updated1} == ${created} on a fresh row"
            - "${pid2} == ${pid} and ${created2} == ${created} — neither is rewritten by an update"
            - "${v2} == 2 and ${updated2} > ${updated1}; ${block2} == true and ${name2} == \"Ada Twist-Rivera\""

      - name: type_constraints_reject_undeclared_enums_and_out_of_range_numbers
        claim_type: type_constraints
        grounds:
          - entities.CourseShell.fields.shell_type
          - entities.CourseShell.fields.base_seat_cap
          - entities.AcademicTerm.fields.access_grace_days
          - entities.AcademicTerm.fields.term_end_at
          - validations[6]
        distinguishing_aspect: "Four distinct shape failures behind one error_id: an undeclared enum member, a numeric range floor, a numeric range ceiling and an ordering constraint between two datetimes. All must be ERR_INVALID_REQUEST at HTTP 422, and the legal boundary values (base_seat_cap 1, access_grace_days 365) must still be accepted."
        test_recipe:
          setup:
            - "One PLANNING term and one FACULTY person exist so only the field under test is at fault."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-5005", full_name: "Shafi Goldwasser", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
          trigger:
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "MAT400-01", shell_type: "PRACTICE" }
              as: LmsAdmin
              captures: { err_enum: $.data.error_id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "MAT400-02", shell_type: "OFFICIAL", base_seat_cap: 0 }
              as: LmsAdmin
              captures: { err_low: $.data.error_id }
            - call: "POST /academic-terms"
              payload: { term_code: "2027FA", term_start_at: "2027-08-23T00:00:00Z", term_end_at: "2027-12-10T00:00:00Z", access_grace_days: 366 }
              as: Registrar
              captures: { err_high: $.data.error_id }
            - call: "POST /academic-terms"
              payload: { term_code: "2028SP", term_start_at: "2028-05-08T00:00:00Z", term_end_at: "2028-01-10T00:00:00Z" }
              as: Registrar
              captures: { err_order: $.data.error_id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "MAT400-03", shell_type: "OFFICIAL", base_seat_cap: 1 }
              as: LmsAdmin
              captures: { ok_cap: $.data.base_seat_cap }
            - call: "POST /academic-terms"
              payload: { term_code: "2029SP", term_start_at: "2029-01-08T00:00:00Z", term_end_at: "2029-05-04T00:00:00Z", access_grace_days: 365 }
              as: Registrar
              captures: { ok_grace: $.data.access_grace_days }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST — PRACTICE is not one of OFFICIAL, SANDBOX, DEV"
            - "${err_low} == ERR_INVALID_REQUEST — base_seat_cap 0 breaks the `>= 1` floor"
            - "${err_high} == ERR_INVALID_REQUEST — access_grace_days 366 breaks the `<= 365` ceiling"
            - "${err_order} == ERR_INVALID_REQUEST — term_end_at must be strictly after term_start_at"
            - "${ok_cap} == 1 and ${ok_grace} == 365 — both range boundaries are inclusive and must NOT be rejected"

      - name: tool_review_is_immutable_with_no_update_path_and_no_version_field
        claim_type: immutability
        grounds:
          - entities.ToolReview
          - endpoints.POST_/tool-reviews
          - endpoints.GET_/tool-reviews/{id}
        distinguishing_aspect: "ToolReview is the one entity declared common_fields: false — it carries id and created_at only, and §1.5 exposes no PATCH or DELETE for it. A decision is corrected by REOPEN_REVIEW and a fresh row, never by editing the existing one, so the review trail is append-only."
        test_recipe:
          setup:
            - "One tool integration is opened for review and its PRIVACY dimension is cleared."
          setup_api_calls:
            - call: "POST /tool-integrations"
              payload: { vendor_name: "Acme", tool_name: "QuizBoard", tool_version: "1.0.0", data_sharing_scope: "ROSTER_ONLY", pii_tier: 1, vpat_score: 90.00, wcag_level: "AA" }
              as: LmsAdmin
              captures: { tool_id: $.data.id }
            - call: "POST /tool-integrations/${tool_id}/transitions"
              payload: { action: "OPEN_REVIEW" }
              as: LmsAdmin
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_id}", dimension: "PRIVACY", decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "priv-1"
              captures: { rev_id: $.data.id, rev_created: $.data.created_at, reviewer: $.data.reviewer_user_id }
          trigger:
            - call: "GET /tool-reviews/${rev_id}"
              payload: {}
              as: LmsAdmin
              captures: { rev_id2: $.data.id, rev_created2: $.data.created_at, dim: $.data.dimension, dec: $.data.decision }
            - call: "GET /tool-reviews"
              payload: { tool_id: "${tool_id}", dimension: "PRIVACY" }
              as: LmsAdmin
          assert:
            - "the response body carries id, created_at, tool_id, dimension, decision, reviewer_user_id and conditions_note and NO version and NO updated_at field"
            - "${rev_id2} == ${rev_id}, ${rev_created2} == ${rev_created}, ${dim} == PRIVACY and ${dec} == CLEAR"
            - "${reviewer} == \"priv-1\" — taken from the acting X-User-ID, never from the request body"
            - "§1.5 declares no PATCH /tool-reviews/{id} and no DELETE /tool-reviews/{id}: the only endpoints for this entity are POST, GET list and GET by id"
            - "GET /tool-reviews filtered by tool_id returns exactly 1 row — the FK reverse path for an immutable child"

      - name: every_path_id_not_found_returns_its_own_entity_specific_error_code
        claim_type: not_found
        grounds:
          - validations[4]
          - errors[ERR_TERM_NOT_FOUND]
          - errors[ERR_SHELL_NOT_FOUND]
          - errors[ERR_DISPUTE_NOT_FOUND]
