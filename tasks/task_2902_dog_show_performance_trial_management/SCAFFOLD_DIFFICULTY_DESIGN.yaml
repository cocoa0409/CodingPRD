  - rule_id: cross_entity_state_dependency
    instances:
      - name: ring_block_publish_requires_confirmed_panel_slot
        grounds:
          - state_machines.RingBlock.PLANNED_to_PUBLISHED
          - state_machines.JudgePanelSlot.PROPOSED_to_CONFIRMED
          - state_machines.ShowClass.CLOSED_to_SCHEDULED
          - validations.priority_8
          - errors.ERR_SLOT_NOT_CONFIRMED
        distinguishing_aspect: |
            The gate points UPWARD to a referenced parent whose state only a third party can change: a RingBlock
            may be planned against a merely PROPOSED slot but may not be published until the Judge personally
            accepts it, and the publish then cascades into a third entity by moving the ShowClass CLOSED ->
            SCHEDULED. Nothing about the block itself changes between the rejected and the accepted publish, so
            an implementation that copies the slot status onto the block at create time, or that checks it only
            at create time, passes the first call and fails here.

        test_recipe:
