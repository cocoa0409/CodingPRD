# =============================================================================
# Task 1896 — Food Ingredient Sourcing & Specification Management
# Scaffold seed tables (§1.0–§1.7). §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1896. Food Ingredient Sourcing & Specification Management (food company
  procurement): ingredient spec authoring & version control, supplier
  qualification & approved-source list, certificate of analysis review &
  out-of-spec handling, allergen & country-of-origin declaration collection,
  contract volume & price index, substitution approval & formula impact
  assessment, supplier audit cadence & corrective action, business-continuity
  dual sourcing

domain_name: food-ingredient-sourcing
api_prefix: /sourcing

# =============================================================================
# Complexity Profile (§0)
# =============================================================================
# Global list-ordering rule (applies to every GET list endpoint in §1.5):
# rows are returned ordered by created_at ASC (earliest created first); when
# created_at ties (same millisecond), the tie is broken by the server's
# insertion sequence. Random/UUID id values are NEVER used for ordering.
list_ordering: "created_at ASC, insertion sequence as tie-break; id never used"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - version_pinning_on_approval
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Ingredient
    parent: null
    common_fields: true
    fields:
      - { name: ingredient_code, type: string, source: input, description: "Business-unique ingredient code (e.g. ENZ-1042); unique across all ingredients" }
      - { name: name, type: string, source: input, description: "Ingredient display name" }
      - { name: allergen_profile, type: array, source: input, description: "Array of allergen tags from {MILK, EGG, FISH, SHELLFISH, TREE_NUT, PEANUT, WHEAT, SOY, SESAME, NONE}", constraints: "each element in the fixed allergen enum set" }
      - { name: requires_dual_source, type: boolean, source: input, description: "Business-continuity flag: when true, ingredient must always have >= 2 ApprovedSource rows in ACTIVE status on the current EFFECTIVE spec" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | DISCONTINUED", default: DRAFT }
      - { name: active_spec_id, type: string, source: computed, description: "FK -> IngredientSpec.id; the spec currently in EFFECTIVE status, null when none" }
      - { name: current_dual_source_breach, type: boolean, source: computed, default: false, description: "True when requires_dual_source=true and count of ACTIVE ApprovedSource rows for the EFFECTIVE spec < 2" }

  - name: IngredientSpec
    parent: Ingredient
    common_fields: true
    fields:
      - { name: ingredient_id, type: string, source: system, description: "FK -> Ingredient.id; owning ingredient" }
      - { name: spec_version_label, type: string, source: input, description: "Human label unique within the ingredient (e.g. 'v3')" }
      - { name: supersedes_spec_id, type: string, source: input, description: "FK -> IngredientSpec.id; prior spec of the same ingredient this one revises; null for the first spec", constraints: "must reference an IngredientSpec of the same ingredient when non-null" }
      - { name: effective_date, type: datetime, source: input, description: "ISO8601 UTC instant at which an APPROVED spec may transition to EFFECTIVE" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of the creating SpecAuthor (segregation-of-duties anchor)" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the QualityManager who last approved; null until approved" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_REVIEW | APPROVED | EFFECTIVE | SUPERSEDED | RETIRED | REJECTED", default: DRAFT }
      - { name: version_note, type: string, source: input, description: "Free-text change rationale", constraints: "min length 10 when submitting for review" }

  - name: SpecParameter
    parent: IngredientSpec
    common_fields: true
    fields:
      - { name: spec_id, type: string, source: system, description: "FK -> IngredientSpec.id; owning spec" }
      - { name: parameter_name, type: string, source: input, description: "Analyte name (e.g. moisture, purity, ash); unique within the spec" }
      - { name: criticality, type: enum, source: input, description: "CRITICAL | MAJOR | MINOR" }
      - { name: uom, type: string, source: input, description: "Unit of measure string (e.g. percent, ppm)" }
      - { name: target_value, type: number, source: input, description: "Nominal target" }
      - { name: min_value, type: number, source: input, description: "Lower specification bound (inclusive)", constraints: "min_value < max_value; min_value <= target_value <= max_value" }
      - { name: max_value, type: number, source: input, description: "Upper specification bound (inclusive)" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: supplier_code, type: string, source: input, description: "Business-unique supplier code; unique across all suppliers" }
      - { name: legal_name, type: string, source: input, description: "Supplier legal name" }
      - { name: risk_tier, type: enum, source: input, description: "TIER_A | TIER_B | TIER_C; drives audit cadence months (12/6/3)" }
      - { name: country_of_operation, type: string, source: input, description: "ISO 3166-1 alpha-2 country code" }
      - { name: status, type: enum, source: system, description: "PROSPECT | IN_QUALIFICATION | QUALIFIED | SUSPENDED | DISQUALIFIED", default: PROSPECT }
      - { name: composite_risk_score, type: number, source: computed, default: 0, description: "Weighted composite per calculation supplier_composite_risk_score; recomputed on CoA acceptance/rejection, audit close, CAPA overdue sweep, declaration lapse sweep" }
      - { name: last_audit_closed_at, type: datetime, source: system, description: "Timestamp of the most recently CLOSED SupplierAudit; null when none" }
      - { name: open_overdue_capa_count, type: integer, source: computed, default: 0, description: "Count of CorrectiveAction rows for this supplier in SUBMITTED or REJECTED status whose due_date is strictly before the current clock, plus OPEN rows past due" }
      - { name: requalification_cycle, type: integer, source: computed, default: 0, description: "Number of times supplier has re-entered IN_QUALIFICATION from SUSPENDED" }

  - name: SupplierQualification
    parent: Supplier
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; supplier under qualification" }
      - { name: questionnaire_score, type: integer, source: input, description: "0-100 self-assessment score submitted by SQE" }
      - { name: document_pack_complete, type: boolean, source: input, description: "True when all required certification documents are on file" }
      - { name: decision_note, type: string, source: input, description: "Decision rationale", constraints: "required on approve or reject" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_EVALUATION | APPROVED | REJECTED", default: SUBMITTED }
      - { name: evaluated_by_user_id, type: string, source: system, description: "X-User-ID of QualityManager who made the decision" }

  - name: ApprovedSource
    parent: Ingredient
    common_fields: true
    fields:
      - { name: ingredient_id, type: string, source: system, description: "FK -> Ingredient.id; sourced ingredient" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; approved supplier" }
      - { name: pinned_spec_id, type: string, source: input, description: "FK -> IngredientSpec.id; spec version pinned at approval time; must belong to ingredient_id", constraints: "(ingredient_id, supplier_id, pinned_spec_id) unique among rows not in REVOKED status" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of ProcurementManager who activated" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | ACTIVE | SUSPENDED | REVOKED", default: PROVISIONAL }
      - { name: suspension_reason, type: enum, source: system, description: "NONE | COA_RISK | SUPPLIER_SUSPENDED | MANUAL", default: NONE }

  - name: SupplyContract
    parent: ApprovedSource
    common_fields: true
    fields:
      - { name: approved_source_id, type: string, source: system, description: "FK -> ApprovedSource.id; the ASL entry this contract prices" }
      - { name: annual_committed_volume_kg, type: integer, source: input, description: "Committed annual volume in kg", constraints: "> 0" }
      - { name: index_base_value, type: number, source: input, description: "Market index value at contract signing (baseline for pass-through)", constraints: "> 0" }
      - { name: index_pass_through_pct, type: number, source: input, description: "Fraction of index movement passed into price, 0 < pct <= 1" }
      - { name: window_start, type: datetime, source: input, description: "Contract validity window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Contract validity window end (exclusive); must be strictly after window_start" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | EXPIRED | TERMINATED", default: PENDING }
      - { name: cumulative_shipped_kg, type: integer, source: computed, default: 0, description: "Sum of shipped kg on CoA-accepted lots against this contract (chronological accumulator)" }

  - name: PriceIndexObservation
    parent: null
    common_fields: false
    fields:
      - { name: index_name, type: string, source: input, description: "Market index identifier (e.g. WHEY-NA-SPOT)" }
      - { name: observed_at, type: datetime, source: input, description: "ISO8601 UTC observation instant; (index_name, observed_at) unique" }
      - { name: index_value, type: number, source: input, description: "Observed index level", constraints: "> 0" }

  - name: CertificateOfAnalysis
    parent: ApprovedSource
    common_fields: true
    fields:
      - { name: approved_source_id, type: string, source: system, description: "FK -> ApprovedSource.id; ASL entry the lot was shipped under" }
      - { name: contract_id, type: string, source: input, description: "FK -> SupplyContract.id; contract the lot draws against" }
      - { name: lot_number, type: string, source: input, description: "Supplier lot identifier; unique per approved_source_id" }
      - { name: shipped_qty_kg, type: integer, source: input, description: "Lot quantity in kg", constraints: "> 0" }
      - { name: received_at, type: datetime, source: input, description: "ISO8601 UTC receipt instant" }
      - { name: measured_values, type: array, source: input, description: "Array of {parameter_name, observed_value} covering every SpecParameter of the pinned spec" }
      - { name: registered_by_user_id, type: string, source: system, description: "X-User-ID of the SupplierQualityEngineer who registered the CoA (segregation-of-duties anchor)" }
      - { name: provisional_deviation_score, type: number, source: computed, default: 0, description: "Score per calculation coa_deviation_score, provisional variant (findings in REPORTED status), computed when review starts" }
      - { name: final_deviation_score, type: number, source: computed, description: "Score per calculation coa_deviation_score, final variant (post-disposition weights), computed when review closes; null until closed" }
      - { name: unit_price_applied, type: number, source: computed, description: "Index-adjusted tier price per calculation contract_tier_price at acceptance; null until ACCEPTED" }
      - { name: status, type: enum, source: system, description: "REGISTERED | UNDER_REVIEW | ACCEPTED | CONDITIONALLY_ACCEPTED | REJECTED", default: REGISTERED }

  - name: CoAOutOfSpecFinding
    parent: CertificateOfAnalysis
    common_fields: true
    fields:
      - { name: coa_id, type: string, source: system, description: "FK -> CertificateOfAnalysis.id; owning CoA" }
      - { name: parameter_name, type: string, source: system, description: "Spec parameter violated" }
      - { name: observed_value, type: number, source: system, description: "Observed value from measured_values" }
      - { name: violated_bound, type: number, source: system, description: "The min or max bound exceeded" }
      - { name: excess_ratio, type: number, source: computed, description: "|observed - violated_bound| / (max_value - min_value), 4 decimal places round_half_up" }
      - { name: criticality_at_finding, type: enum, source: system, description: "CRITICAL | MAJOR | MINOR snapshotted from the SpecParameter at finding creation" }
      - { name: disposition, type: enum, source: system, description: "REPORTED | ACCEPT_AS_IS | DOWNGRADED_TO_MINOR | REJECT_LOT", default: REPORTED }
      - { name: disposition_note, type: string, source: input, description: "Required when disposition is set", constraints: "min length 10" }

  - name: RegulatoryDeclaration
    parent: ApprovedSource
    common_fields: true
  # Allergen & country-of-origin declarations per ASL entry
    fields:
      - { name: approved_source_id, type: string, source: system, description: "FK -> ApprovedSource.id; ASL entry declared for" }
      - { name: declaration_type, type: enum, source: input, description: "ALLERGEN | COUNTRY_OF_ORIGIN" }
      - { name: payload, type: object, source: input, description: "ALLERGEN: {allergen_tags: [...]}; COUNTRY_OF_ORIGIN: {country_codes: [ISO alpha-2, ...], primary_country: code}" }
      - { name: valid_from, type: datetime, source: input, description: "Validity window start (inclusive)" }
      - { name: valid_until, type: datetime, source: input, description: "Validity window end (exclusive); strictly after valid_from" }
      - { name: collected_by_user_id, type: string, source: system, description: "X-User-ID of RegulatoryAffairs collector" }
      - { name: status, type: enum, source: system, description: "CURRENT | SUPERSEDED | EXPIRED", default: CURRENT }

  - name: SubstitutionRequest
    parent: Ingredient
    common_fields: true
    fields:
      - { name: ingredient_id, type: string, source: system, description: "FK -> Ingredient.id; ingredient being substituted in a formula" }
      - { name: from_approved_source_id, type: string, source: input, description: "FK -> ApprovedSource.id; current source being replaced" }
      - { name: to_approved_source_id, type: string, source: input, description: "FK -> ApprovedSource.id; proposed replacement source" }
      - { name: reason_code, type: enum, source: input, description: "SUPPLY_SHORTAGE | COST_REDUCTION | QUALITY_ESCAPE | DUAL_SOURCE_BREACH" }
      - { name: formula_unit_cost_sensitivities, type: array, source: input, description: "Array of {parameter_name, cost_per_unit_delta} used by formula_impact_delta" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of ProcurementManager requester (segregation anchor)" }
      - { name: impact_delta_per_unit, type: number, source: computed, description: "Computed per calculation formula_impact_delta when assessment completes; null until then" }
      - { name: requires_regulatory_signoff, type: boolean, source: computed, default: false, description: "True when the replacement source's CURRENT ALLERGEN declaration introduces an allergen tag absent from the ingredient's allergen_profile, or primary COUNTRY_OF_ORIGIN differs" }
      - { name: status, type: enum, source: system, description: "REQUESTED | IMPACT_ASSESSED | PENDING_REGULATORY | APPROVED | REJECTED | EXECUTED | CANCELLED", default: REQUESTED }

  - name: FormulaImpactAssessment
    parent: SubstitutionRequest
    common_fields: true
    fields:
      - { name: substitution_request_id, type: string, source: system, description: "FK -> SubstitutionRequest.id; owning request" }
      - { name: parameter_deltas, type: array, source: computed, description: "Per-parameter target deltas between to-source pinned spec and from-source pinned spec: [{parameter_name, from_target, to_target, delta, cost_delta}]" }
      - { name: total_delta_per_unit, type: number, source: computed, description: "Sum of cost_delta across parameter_deltas, 4 decimal places round_half_up" }
      - { name: allergen_delta_tags, type: array, source: computed, description: "Allergen tags introduced by the replacement that are absent from ingredient.allergen_profile" }
      - { name: coo_changed, type: boolean, source: computed, description: "True when replacement's CURRENT COUNTRY_OF_ORIGIN primary_country differs from the from-source's" }

  - name: SupplierAudit
    parent: Supplier
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; audited supplier" }
      - { name: scheduled_window_start, type: datetime, source: input, description: "Audit window start (inclusive)" }
      - { name: scheduled_window_end, type: datetime, source: input, description: "Audit window end (exclusive); strictly after start" }
      - { name: audit_score, type: integer, source: input, description: "0-100 score entered when report is issued" }
      - { name: findings_summary, type: string, source: input, description: "Report narrative", constraints: "required on report issue" }
      - { name: cadence_source, type: enum, source: computed, description: "TIER_CADENCE | ESCALATED; ESCALATED when scheduled early due to overdue CAPAs or SUSPENDED status", default: TIER_CADENCE }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | REPORT_ISSUED | CLOSED | CANCELLED", default: SCHEDULED }

  - name: CorrectiveAction
    parent: SupplierAudit
    common_fields: true
    fields:
      - { name: audit_id, type: string, source: system, description: "FK -> SupplierAudit.id; audit that raised this CAPA" }
      - { name: description, type: string, source: input, description: "Finding requiring correction", constraints: "min length 10" }
      - { name: due_date, type: datetime, source: input, description: "ISO8601 UTC due instant; must be strictly after audit report issue time" }
      - { name: response_text, type: string, source: input, description: "Supplier response submitted by SQE" }
      - { name: verification_note, type: string, source: input, description: "QualityManager verification note", constraints: "min length 10 on verify or re-reject" }
      - { name: status, type: enum, source: system, description: "OPEN | SUBMITTED | VERIFIED | REJECTED", default: OPEN }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Ingredient
    initial_state: DRAFT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /sourcing/ingredients/{id}/activate"
        actor: ProcurementManager
        preconditions:
          - "Ingredient.status == DRAFT (ERR_INVALID_STATE)"
          - "Ingredient has at least one IngredientSpec in EFFECTIVE status (ERR_NO_EFFECTIVE_SPEC)"
        side_effects: []

      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /sourcing/ingredients/{id}/discontinue"
        actor: ProcurementManager
        preconditions:
          - "Ingredient.status == ACTIVE (ERR_INVALID_STATE)"
          - "No ApprovedSource for this ingredient in PROVISIONAL or ACTIVE status (ERR_ACTIVE_SOURCES_EXIST)"
          - "No SubstitutionRequest for this ingredient in REQUESTED, IMPACT_ASSESSED, PENDING_REGULATORY, or APPROVED status (ERR_OPEN_SUBSTITUTIONS_EXIST)"
        side_effects:
          - "EFFECTIVE spec (if any) transitions to RETIRED"
          - "active_spec_id set to null"

  - entity: IngredientSpec
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RETIRED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /sourcing/ingredients/{id}/specs/{specId}/submit"
        actor: SpecAuthor
        preconditions:
          - "Spec.status == DRAFT (ERR_INVALID_STATE)"
          - "Spec has at least one SpecParameter (ERR_NO_SPEC_PARAMETERS)"
          - "version_note length >= 10 (ERR_INVALID_REQUEST)"
          - "Acting SpecAuthor's X-User-ID == spec.author_user_id (ERR_SEGREGATION_OF_DUTIES — only the author submits)"
        side_effects: []

      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /sourcing/ingredients/{id}/specs/{specId}/approve"
        actor: QualityManager
        preconditions:
          - "Spec.status == PENDING_REVIEW (ERR_INVALID_STATE)"
          - "Acting QualityManager X-User-ID != spec.author_user_id (ERR_SEGREGATION_OF_DUTIES — author cannot approve own spec)"
          - "All SpecParameter rows satisfy min_value <= target_value <= max_value (ERR_PARAMETER_BOUNDS_INVALID)"
        side_effects:
          - "reviewed_by_user_id set to acting QualityManager X-User-ID"

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /sourcing/ingredients/{id}/specs/{specId}/reject"
        actor: QualityManager
        preconditions:
          - "Spec.status == PENDING_REVIEW (ERR_INVALID_STATE)"
          - "Acting QualityManager X-User-ID != spec.author_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

      - from: REJECTED
        to: DRAFT
        trigger: "POST /sourcing/ingredients/{id}/specs/{specId}/revise"
        actor: SpecAuthor
        preconditions:
          - "Spec.status == REJECTED (ERR_INVALID_STATE)"
          - "Acting SpecAuthor X-User-ID == spec.author_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
        note: "Revision loop: REJECTED -> DRAFT allows the author to edit parameters and resubmit"

      - from: APPROVED
        to: EFFECTIVE
        trigger: "POST /sourcing/ingredients/{id}/specs/{specId}/make-effective"
        actor: QualityManager
        preconditions:
          - "Spec.status == APPROVED (ERR_INVALID_STATE)"
          - "Current logical clock >= spec.effective_date (ERR_SPEC_NOT_YET_EFFECTIVE)"
          - "If spec.supersedes_spec_id is non-null, the referenced spec is in EFFECTIVE status (ERR_SUPERSEDES_NOT_EFFECTIVE)"
        side_effects:
          - "If spec.supersedes_spec_id non-null: referenced spec transitions EFFECTIVE -> SUPERSEDED"
          - "Ingredient.active_spec_id = this spec id"
          - "Every ApprovedSource of this ingredient with pinned_spec_id == the superseded spec and status == ACTIVE transitions to SUSPENDED with suspension_reason=MANUAL (stale-pin sweep)"
          - "Ingredient.current_dual_source_breach recomputed (dual-source recheck)"

      - from: DRAFT
        to: RETIRED
        trigger: "POST /sourcing/ingredients/{id}/specs/{specId}/retire"
        actor: QualityManager
        preconditions:
          - "Spec.status in {DRAFT, REJECTED} (ERR_INVALID_STATE)"
          - "No ApprovedSource rows reference this spec in PROVISIONAL or ACTIVE status (ERR_SPEC_IN_USE)"
        side_effects: []

      - from: REJECTED
        to: RETIRED
        trigger: "POST /sourcing/ingredients/{id}/specs/{specId}/retire"
        actor: QualityManager
        preconditions:
          - "Spec.status in {DRAFT, REJECTED} (ERR_INVALID_STATE)"
          - "No ApprovedSource rows reference this spec in PROVISIONAL or ACTIVE status (ERR_SPEC_IN_USE)"
        side_effects: []

      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system (automatic when a successor spec transitions APPROVED -> EFFECTIVE with supersedes_spec_id == this spec)"
        actor: system
        preconditions: []
        side_effects:
          - "Ingredient.active_spec_id moves to successor"
        note: "Automatic side-effect transition; not directly invocable"

      - from: EFFECTIVE
        to: RETIRED
        trigger: "system (automatic on ingredient discontinuation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Supplier
    initial_state: PROSPECT
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: PROSPECT
        to: IN_QUALIFICATION
        trigger: "POST /sourcing/suppliers/{id}/qualifications (creates SupplierQualification)"
        actor: SupplierQualityEngineer
        preconditions:
          - "Supplier.status in {PROSPECT, SUSPENDED} (ERR_INVALID_STATE)"
          - "No other SupplierQualification for this supplier in SUBMITTED or UNDER_EVALUATION status (ERR_QUALIFICATION_IN_PROGRESS)"
        side_effects:
          - "If previous status was SUSPENDED: requalification_cycle += 1"
          - "New SupplierQualification status = SUBMITTED"

      - from: SUSPENDED
        to: IN_QUALIFICATION
        trigger: "POST /sourcing/suppliers/{id}/qualifications"
        actor: SupplierQualityEngineer
        preconditions:
          - "Supplier.status in {PROSPECT, SUSPENDED} (ERR_INVALID_STATE)"
          - "No other SupplierQualification in SUBMITTED or UNDER_EVALUATION (ERR_QUALIFICATION_IN_PROGRESS)"
        side_effects:
          - "requalification_cycle += 1"
          - "New SupplierQualification status = SUBMITTED"

      - from: IN_QUALIFICATION
        to: QUALIFIED
        trigger: "system (automatic when a SupplierQualification transitions UNDER_EVALUATION -> APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Supplier composite_risk_score recomputed"

      - from: IN_QUALIFICATION
        to: PROSPECT
        trigger: "system (automatic when a SupplierQualification transitions UNDER_EVALUATION -> REJECTED and requalification_cycle == 0)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_QUALIFICATION
        to: SUSPENDED
        trigger: "system (automatic when a SupplierQualification is REJECTED and requalification_cycle > 0)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Requalification failure returns supplier to SUSPENDED, not PROSPECT"

      - from: QUALIFIED
        to: SUSPENDED
        trigger: "system (automatic when supplier_composite_risk_score >= 70) OR POST /sourcing/suppliers/{id}/suspend"
        actor: "system | QualityManager"
        preconditions:
          - "Manual path: Supplier.status == QUALIFIED (ERR_INVALID_STATE)"
        side_effects:
          - "Every ApprovedSource with supplier_id == this supplier and status == ACTIVE transitions to SUSPENDED with suspension_reason=SUPPLIER_SUSPENDED"
          - "For each such ApprovedSource: if its ingredient now has < 2 ACTIVE ApprovedSource rows on the EFFECTIVE spec and requires_dual_source: set ingredient.current_dual_source_breach = true"
          - "Next SupplierAudit cadence escalates: cadence_source=ESCALATED on the next scheduled audit"

      - from: SUSPENDED
        to: DISQUALIFIED
        trigger: "POST /sourcing/suppliers/{id}/disqualify"
        actor: QualityManager
        preconditions:
          - "Supplier.status == SUSPENDED (ERR_INVALID_STATE)"
          - "No CorrectiveAction for this supplier in OPEN, SUBMITTED, or REJECTED status (ERR_OPEN_CAPAS_EXIST)"
        side_effects:
          - "Every ApprovedSource with supplier_id == this supplier and status in {PROVISIONAL, ACTIVE, SUSPENDED} transitions to REVOKED"
          - "Affected ingredients recompute current_dual_source_breach"

  - entity: SupplierQualification
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_EVALUATION
        trigger: "POST /sourcing/suppliers/{id}/qualifications/{qualificationId}/evaluate"
        actor: QualityManager
        preconditions:
          - "Qualification.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []

      - from: UNDER_EVALUATION
        to: APPROVED
        trigger: "POST /sourcing/suppliers/{id}/qualifications/{qualificationId}/decide"
        actor: QualityManager
        preconditions:
          - "Qualification.status == UNDER_EVALUATION (ERR_INVALID_STATE)"
          - "decision == APPROVE requires questionnaire_score >= 70 (ERR_QUALIFICATION_SCORE_TOO_LOW — boundary: exactly 70 passes)"
          - "decision == APPROVE requires document_pack_complete == true (ERR_DOCUMENT_PACK_INCOMPLETE)"
          - "decision_note present (ERR_INVALID_REQUEST)"
        side_effects:
          - "evaluated_by_user_id set"
          - "Supplier transitions IN_QUALIFICATION -> QUALIFIED"
          - "Supplier composite_risk_score recomputed"

      - from: UNDER_EVALUATION
        to: REJECTED
        trigger: "POST /sourcing/suppliers/{id}/qualifications/{qualificationId}/decide"
        actor: QualityManager
        preconditions:
          - "Qualification.status == UNDER_EVALUATION (ERR_INVALID_STATE)"
          - "decision_note present (ERR_INVALID_REQUEST)"
        side_effects:
          - "evaluated_by_user_id set"
          - "Supplier transitions IN_QUALIFICATION -> PROSPECT if requalification_cycle == 0 else IN_QUALIFICATION -> SUSPENDED"

  - entity: ApprovedSource
    initial_state: PROVISIONAL
    terminal_states: [REVOKED]
    transitions:
      - from: PROVISIONAL
        to: ACTIVE
        trigger: "POST /sourcing/ingredients/{id}/approved-sources/{sourceId}/activate"
        actor: ProcurementManager
        preconditions:
          - "ApprovedSource.status == PROVISIONAL (ERR_INVALID_STATE)"
          - "Referenced Supplier.status == QUALIFIED (ERR_SUPPLIER_NOT_QUALIFIED)"
          - "pinned_spec_id spec status == EFFECTIVE (ERR_SPEC_NOT_EFFECTIVE)"
          - "A CURRENT RegulatoryDeclaration of type ALLERGEN exists with valid_from <= clock < valid_until (ERR_DECLARATION_MISSING)"
          - "A CURRENT RegulatoryDeclaration of type COUNTRY_OF_ORIGIN exists with valid_from <= clock < valid_until (ERR_DECLARATION_MISSING)"
        side_effects:
          - "approved_by_user_id set"
          - "Ingredient.current_dual_source_breach recomputed"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /sourcing/ingredients/{id}/approved-sources/{sourceId}/suspend OR system cascade (supplier suspension, stale-pin sweep on spec supersede)"
        actor: "ProcurementManager | system"
        preconditions:
          - "Manual path: ApprovedSource.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "suspension_reason set (MANUAL | SUPPLIER_SUSPENDED | COA_RISK)"
          - "PINNED: contracts of this source remain ACTIVE (not terminated); new CoA registration is blocked while the source is SUSPENDED"
          - "Ingredient.current_dual_source_breach recomputed"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /sourcing/ingredients/{id}/approved-sources/{sourceId}/reinstate"
        actor: ProcurementManager
        preconditions:
          - "ApprovedSource.status == SUSPENDED (ERR_INVALID_STATE)"
          - "Referenced Supplier.status == QUALIFIED (ERR_SUPPLIER_NOT_QUALIFIED)"
          - "pinned_spec_id spec status == EFFECTIVE (ERR_SPEC_NOT_EFFECTIVE)"
          - "Both CURRENT declarations exist and are within validity window (ERR_DECLARATION_MISSING)"
        side_effects:
          - "suspension_reason = NONE"
          - "Ingredient.current_dual_source_breach recomputed"

      - from: PROVISIONAL
        to: REVOKED
        trigger: "POST /sourcing/ingredients/{id}/approved-sources/{sourceId}/revoke OR system cascade (supplier disqualification)"
        actor: "ProcurementManager | system"
        preconditions:
          - "Manual path: status in {PROVISIONAL, ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
          - "Manual path: no SupplyContract of this source in ACTIVE status (ERR_ACTIVE_CONTRACT_EXISTS)"
        side_effects:
          - "CURRENT RegulatoryDeclaration rows of this source transition to SUPERSEDED"
          - "Ingredient.current_dual_source_breach recomputed"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /sourcing/ingredients/{id}/approved-sources/{sourceId}/revoke OR system cascade"
        actor: "ProcurementManager | system"
        preconditions:
          - "Manual path: status in {PROVISIONAL, ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
          - "Manual path: no SupplyContract of this source in ACTIVE status (ERR_ACTIVE_CONTRACT_EXISTS)"
        side_effects:
          - "CURRENT RegulatoryDeclaration rows of this source transition to SUPERSEDED"
          - "Ingredient.current_dual_source_breach recomputed"

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /sourcing/ingredients/{id}/approved-sources/{sourceId}/revoke OR system cascade"
        actor: "ProcurementManager | system"
        preconditions:
          - "Manual path: status in {PROVISIONAL, ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
          - "Manual path: no SupplyContract of this source in ACTIVE status (ERR_ACTIVE_CONTRACT_EXISTS)"
        side_effects:
          - "CURRENT RegulatoryDeclaration rows of this source transition to SUPERSEDED"
          - "Ingredient.current_dual_source_breach recomputed"

  - entity: SupplyContract
    initial_state: PENDING
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /sourcing/approved-sources/{id}/contracts/{contractId}/activate"
        actor: ProcurementManager
        preconditions:
          - "Contract.status == PENDING (ERR_INVALID_STATE)"
          - "Parent ApprovedSource.status == ACTIVE (ERR_SOURCE_NOT_ACTIVE)"
          - "Current logical clock >= window_start and < window_end (ERR_CONTRACT_WINDOW_NOT_OPEN)"
          - "No other ACTIVE contract for the same approved_source_id whose [window_start, window_end) overlaps this contract's window (ERR_CONTRACT_WINDOW_OVERLAP — half-open interval arithmetic: touching endpoints are NOT an overlap)"
        side_effects: []

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic sweep when logical clock >= window_end)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING
        to: TERMINATED
        trigger: "POST /sourcing/approved-sources/{id}/contracts/{contractId}/terminate"
        actor: ProcurementManager
        preconditions:
          - "Contract.status in {PENDING, ACTIVE} (ERR_INVALID_STATE)"
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /sourcing/approved-sources/{id}/contracts/{contractId}/terminate"
        actor: ProcurementManager
        preconditions:
          - "Contract.status in {PENDING, ACTIVE} (ERR_INVALID_STATE)"
        side_effects: []

  - entity: CertificateOfAnalysis
    initial_state: REGISTERED
    terminal_states: [ACCEPTED, CONDITIONALLY_ACCEPTED, REJECTED]
    transitions:
      - from: REGISTERED
        to: UNDER_REVIEW
        trigger: "POST /sourcing/approved-sources/{id}/coas/{coaId}/start-review"
        actor: QualityManager
        preconditions:
          - "CoA.status == REGISTERED (ERR_INVALID_STATE)"
        side_effects:
          - "System creates one CoAOutOfSpecFinding per measured parameter whose observed_value is outside [min_value, max_value] of the pinned spec, snapshotting criticality_at_finding; findings are persisted in the spec's parameter creation order, and the findings list endpoint returns them in that same order (deterministic, no id-based ordering)"
          - "provisional_deviation_score computed per coa_deviation_score provisional variant"

      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /sourcing/approved-sources/{id}/coas/{coaId}/close-review with outcome=ACCEPT"
        actor: QualityManager
        preconditions:
          - "CoA.status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "Acting QualityManager X-User-ID != coa.registered_by_user_id (ERR_SEGREGATION_OF_DUTIES — registrar cannot close own CoA)"
          - "Every finding has disposition != REPORTED (ERR_FINDINGS_UNDISPOSITIONED)"
          - "outcome=ACCEPT requires zero findings with disposition == REJECT_LOT (ERR_FINDINGS_REQUIRE_REJECTION)"
          - "outcome=ACCEPT requires provisional_deviation_score < 150 OR all findings dispositioned ACCEPT_AS_IS with final score recomputed < 150 (ERR_DEVIATION_SCORE_TOO_HIGH — boundary: exactly 150 blocks ACCEPT)"
        side_effects:
          - "final_deviation_score computed per final variant"
          - "unit_price_applied computed per contract_tier_price using latest PriceIndexObservation with observed_at <= clock (selector: max observed_at; tie-break: earliest created_at)"
          - "SupplyContract.cumulative_shipped_kg += shipped_qty_kg"
          - "If cumulative_shipped_kg crosses a tier boundary, subsequent lots price at the new tier (no retroactive repricing)"
          - "Supplier.composite_risk_score recomputed (accepted lot enters 12-month CoA window)"
          - "CoA status = ACCEPTED when no finding has disposition ACCEPT_AS_IS, else CONDITIONALLY_ACCEPTED"

      - from: UNDER_REVIEW
        to: CONDITIONALLY_ACCEPTED
        trigger: "system (automatic variant of close-review with outcome=ACCEPT when at least one finding has disposition ACCEPT_AS_IS)"
        actor: system
        preconditions: []
        side_effects:
          - "Same side effects as ACCEPTED"
        note: "CONDITIONALLY_ACCEPTED is the ACCEPT outcome with at least one ACCEPT_AS_IS finding; both are terminal acceptance states"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /sourcing/approved-sources/{id}/coas/{coaId}/close-review with outcome=REJECT"
        actor: QualityManager
        preconditions:
          - "CoA.status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "Acting QualityManager X-User-ID != coa.registered_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Every finding has disposition != REPORTED (ERR_FINDINGS_UNDISPOSITIONED)"
        side_effects:
          - "final_deviation_score computed per final variant"
          - "SupplyContract.cumulative_shipped_kg unchanged"
          - "Supplier.composite_risk_score recomputed (rejected lot enters 12-month CoA window); if score >= 70 the supplier auto-suspends per Supplier machine"

  - entity: RegulatoryDeclaration
    initial_state: CURRENT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system (automatic when a new declaration of the same declaration_type is collected for the same approved_source_id) OR system cascade on ApprovedSource revocation"
        actor: system
        preconditions: []
        side_effects:
          - "New declaration becomes the CURRENT one; only one CURRENT declaration per (approved_source_id, declaration_type) exists at any time"

      - from: CURRENT
        to: EXPIRED
        trigger: "system (automatic sweep when logical clock >= valid_until)"
        actor: system
        preconditions: []
        side_effects:
          - "PINNED: parent ApprovedSource, if ACTIVE, transitions to SUSPENDED with suspension_reason=MANUAL"
          - "Supplier.composite_risk_score recomputed (declaration lapse component becomes 100)"
          - "Ingredient.current_dual_source_breach recomputed"

  - entity: SubstitutionRequest
    initial_state: REQUESTED
    terminal_states: [REJECTED, EXECUTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: IMPACT_ASSESSED
        trigger: "POST /sourcing/ingredients/{id}/substitution-requests/{requestId}/assess"
        actor: SupplierQualityEngineer
        preconditions:
          - "Request.status == REQUESTED (ERR_INVALID_STATE)"
          - "from_approved_source_id != to_approved_source_id (ERR_INVALID_REQUEST)"
          - "to_approved_source_id status == ACTIVE (ERR_SOURCE_NOT_ACTIVE)"
          - "to source pinned spec status == EFFECTIVE (ERR_SPEC_NOT_EFFECTIVE)"
        side_effects:
          - "System creates FormulaImpactAssessment: parameter_deltas across the union of parameter names on both pinned specs (missing parameter on either side -> delta computed against 0 baseline and flagged), total_delta_per_unit per formula_impact_delta, allergen_delta_tags, coo_changed"
          - "requires_regulatory_signoff = (allergen_delta_tags non-empty) OR coo_changed"
          - "impact_delta_per_unit = total_delta_per_unit"
          - "If requires_regulatory_signoff is false the request remains routable directly to approve; if true, approval is gated on PENDING_REGULATORY path"

      - from: IMPACT_ASSESSED
        to: PENDING_REGULATORY
        trigger: "POST /sourcing/ingredients/{id}/substitution-requests/{requestId}/route-regulatory"
        actor: SupplierQualityEngineer
        preconditions:
          - "Request.status == IMPACT_ASSESSED (ERR_INVALID_STATE)"
          - "requires_regulatory_signoff == true (ERR_REGULATORY_SIGNOFF_NOT_REQUIRED)"
        side_effects: []

      - from: IMPACT_ASSESSED
        to: APPROVED
        trigger: "POST /sourcing/ingredients/{id}/substitution-requests/{requestId}/approve"
        actor: QualityManager
        preconditions:
          - "Request.status in {IMPACT_ASSESSED, PENDING_REGULATORY} (ERR_INVALID_STATE)"
          - "If status == IMPACT_ASSESSED: requires_regulatory_signoff == false (ERR_REGULATORY_SIGNOFF_REQUIRED)"
          - "If status == PENDING_REGULATORY: RegulatoryAffairs sign-off recorded via /regulatory-signoff (ERR_REGULATORY_SIGNOFF_REQUIRED)"
          - "Acting QualityManager X-User-ID != request.requested_by_user_id (ERR_SEGREGATION_OF_DUTIES — requester cannot approve)"
          - "|impact_delta_per_unit| <= 0.5000 for auto-approvable requests; larger absolute deltas require PENDING_REGULATORY path regardless of sign-off flag (ERR_IMPACT_DELTA_EXCEEDS_THRESHOLD — boundary: exactly 0.5000 passes)"
        side_effects: []

      - from: PENDING_REGULATORY
        to: APPROVED
        trigger: "POST /sourcing/ingredients/{id}/substitution-requests/{requestId}/approve"
        actor: QualityManager
        preconditions:
          - "RegulatoryAffairs sign-off present (ERR_REGULATORY_SIGNOFF_REQUIRED)"
          - "Acting QualityManager X-User-ID != request.requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

      - from: IMPACT_ASSESSED
        to: REJECTED
        trigger: "POST /sourcing/ingredients/{id}/substitution-requests/{requestId}/reject"
        actor: QualityManager
        preconditions:
          - "Request.status in {IMPACT_ASSESSED, PENDING_REGULATORY} (ERR_INVALID_STATE)"
          - "Acting QualityManager X-User-ID != request.requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

      - from: PENDING_REGULATORY
        to: REJECTED
        trigger: "POST /sourcing/ingredients/{id}/substitution-requests/{requestId}/reject"
        actor: QualityManager
        preconditions:
          - "Request.status in {IMPACT_ASSESSED, PENDING_REGULATORY} (ERR_INVALID_STATE)"
          - "Acting QualityManager X-User-ID != request.requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

      - from: APPROVED
        to: EXECUTED
        trigger: "POST /sourcing/ingredients/{id}/substitution-requests/{requestId}/execute"
        actor: ProcurementManager
        preconditions:
          - "Request.status == APPROVED (ERR_INVALID_STATE)"
          - "to_approved_source_id still ACTIVE (ERR_SOURCE_NOT_ACTIVE)"
        side_effects:
          - "from_approved_source_id ApprovedSource transitions ACTIVE -> SUSPENDED with suspension_reason=MANUAL (replaced source parked)"
          - "Ingredient.current_dual_source_breach recomputed"
        note: "Depth-3 cascade anchor: execute -> source suspension -> dual-source recompute"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /sourcing/ingredients/{id}/substitution-requests/{requestId}/cancel"
        actor: ProcurementManager
        preconditions:
          - "Request.status in {REQUESTED, IMPACT_ASSESSED, PENDING_REGULATORY} (ERR_INVALID_STATE)"
          - "Acting ProcurementManager X-User-ID == request.requested_by_user_id (ERR_SEGREGATION_OF_DUTIES — only requester cancels)"
        side_effects: []

      - from: IMPACT_ASSESSED
        to: CANCELLED
        trigger: "POST /sourcing/ingredients/{id}/substitution-requests/{requestId}/cancel"
        actor: ProcurementManager
        preconditions:
          - "Request.status in {REQUESTED, IMPACT_ASSESSED, PENDING_REGULATORY} (ERR_INVALID_STATE)"
          - "Acting ProcurementManager X-User-ID == request.requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

      - from: PENDING_REGULATORY
        to: CANCELLED
        trigger: "POST /sourcing/ingredients/{id}/substitution-requests/{requestId}/cancel"
        actor: ProcurementManager
        preconditions:
          - "Request.status in {REQUESTED, IMPACT_ASSESSED, PENDING_REGULATORY} (ERR_INVALID_STATE)"
          - "Acting ProcurementManager X-User-ID == request.requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

  - entity: SupplierAudit
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /sourcing/suppliers/{id}/audits/{auditId}/start"
        actor: SupplierQualityEngineer
        preconditions:
          - "Audit.status == SCHEDULED (ERR_INVALID_STATE)"
          - "Current logical clock >= scheduled_window_start and < scheduled_window_end (ERR_AUDIT_WINDOW_NOT_OPEN)"
          - "No other SupplierAudit for this supplier in IN_PROGRESS or REPORT_ISSUED status (ERR_AUDIT_ALREADY_OPEN)"
        side_effects: []

      - from: IN_PROGRESS
        to: REPORT_ISSUED
        trigger: "POST /sourcing/suppliers/{id}/audits/{auditId}/issue-report"
        actor: SupplierQualityEngineer
        preconditions:
          - "Audit.status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "audit_score present in [0, 100] (ERR_INVALID_REQUEST)"
          - "findings_summary present (ERR_INVALID_REQUEST)"
        side_effects:
          - "PINNED: no CorrectiveAction is auto-created at report issue (CAPAs are raised explicitly via POST corrective-actions); audit_score feeds supplier composite risk only at audit close"
        note: "Score below 70 does not itself suspend; it feeds composite risk at audit close"

      - from: REPORT_ISSUED
        to: CLOSED
        trigger: "POST /sourcing/suppliers/{id}/audits/{auditId}/close"
        actor: QualityManager
        preconditions:
          - "Audit.status == REPORT_ISSUED (ERR_INVALID_STATE)"
          - "All CorrectiveAction rows of this audit in VERIFIED status (ERR_OPEN_CAPAS_EXIST)"
        side_effects:
          - "Supplier.last_audit_closed_at = clock"
          - "Supplier.composite_risk_score recomputed per supplier_composite_risk_score (audit component = 100 - audit_score); if >= 70 supplier auto-suspends"
          - "Next-cadence scheduling per calculation audit_cadence_schedule: system schedules the next SupplierAudit with window_start = last_audit_closed_at + cadence_months(risk_tier), adjusted earlier to clock + 7 days with cadence_source=ESCALATED when overdue CAPAs exist or supplier is SUSPENDED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sourcing/suppliers/{id}/audits/{auditId}/cancel"
        actor: QualityManager
        preconditions:
          - "Audit.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /sourcing/suppliers/{id}/audits/{auditId}/corrective-actions/{capaId}/submit-response"
        actor: SupplierQualityEngineer
        preconditions:
          - "CAPA.status in {OPEN, REJECTED} (ERR_INVALID_STATE)"
          - "response_text present (ERR_INVALID_REQUEST)"
        side_effects: []

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /sourcing/suppliers/{id}/audits/{auditId}/corrective-actions/{capaId}/submit-response"
        actor: SupplierQualityEngineer
        preconditions:
          - "CAPA.status in {OPEN, REJECTED} (ERR_INVALID_STATE)"
          - "response_text present (ERR_INVALID_REQUEST)"
        side_effects: []
        note: "Resubmission loop REJECTED -> SUBMITTED (cyclic)"

      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /sourcing/suppliers/{id}/audits/{auditId}/corrective-actions/{capaId}/verify"
        actor: QualityManager
        preconditions:
          - "CAPA.status == SUBMITTED (ERR_INVALID_STATE)"
          - "verification_note length >= 10 (ERR_INVALID_REQUEST)"
        side_effects:
          - "Supplier.open_overdue_capa_count recomputed"
          - "Supplier.composite_risk_score recomputed"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /sourcing/suppliers/{id}/audits/{auditId}/corrective-actions/{capaId}/reject-response"
        actor: QualityManager
        preconditions:
          - "CAPA.status == SUBMITTED (ERR_INVALID_STATE)"
          - "verification_note length >= 10 (ERR_INVALID_REQUEST)"
        side_effects:
          - "Supplier.open_overdue_capa_count recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: spec-supersede-stale-ingredient
    parent_entity: Ingredient
    write_endpoint: "POST /sourcing/ingredients/{id}/specs"
    occ_field: "expected_ingredient_version"
    description: |
      Creating a new IngredientSpec with supersedes_spec_id against an
      Ingredient whose version has advanced since the client last observed it
      is rejected. Another writer may have just made a different spec
      EFFECTIVE (bumping ingredient.version via active_spec_id reassignment),
      so the current writer's view of which spec is current is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: source-activate-stale-ingredient
    parent_entity: Ingredient
    write_endpoint: "POST /sourcing/ingredients/{id}/approved-sources"
    occ_field: "expected_ingredient_version"
    description: |
      Creating an ApprovedSource against an Ingredient whose version has
      advanced since the client last observed it is rejected: a concurrent
      spec supersede changes which spec version is EFFECTIVE, invalidating the
      pin the client intended.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: contract-create-stale-source
    parent_entity: ApprovedSource
    write_endpoint: "POST /sourcing/approved-sources/{id}/contracts"
    occ_field: "expected_approved_source_version"
    description: |
      Creating a SupplyContract against an ApprovedSource whose version has
      advanced since the client last observed it is rejected: a prior contract
      creation or a source suspension already changed the source row, so the
      overlap-window computation the client assumed no longer holds.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: coa_deviation_score
    trigger: "CoA review start (provisional variant) and CoA review close (final variant)"
    algorithm: weighted_scoring
    formula: |
      For each CoAOutOfSpecFinding f of the CoA:
        excess_ratio_f = round_half_up(|observed_value - violated_bound| / (max_value - min_value), 4)
        weight_f = 3 if criticality == CRITICAL else 2 if MAJOR else 1
      score = round_half_up(sum(excess_ratio_f * weight_effective_f) * 100, 2)
      PROVISIONAL variant: weight_effective_f = weight of criticality_at_finding for
        findings in any disposition (all findings counted at snapshot criticality).
      FINAL variant: findings with disposition == DOWNGRADED_TO_MINOR are weighted
        as MINOR (1) regardless of criticality_at_finding; findings with
        disposition == REJECT_LOT still count at full weight.
    input_set: "All CoAOutOfSpecFinding rows of the CoA; provisional computed at UNDER_REVIEW entry; final computed at close-review"
    constants:
      WEIGHT_CRITICAL: 3
      WEIGHT_MAJOR: 2
      WEIGHT_MINOR: 1
      ACCEPT_BLOCK_THRESHOLD: 150
    precision: "excess_ratio 4 dp round_half_up; score 2 dp round_half_up"
    variants:
      - name: provisional
        when: "Computed when CoA enters UNDER_REVIEW"
        difference: "All findings weighted at criticality_at_finding; result stored in provisional_deviation_score"
      - name: final
        when: "Computed when close-review succeeds (ACCEPT or REJECT)"
        difference: "DOWNGRADED_TO_MINOR findings weighted as MINOR; result stored in final_deviation_score. Provisional and final diverge whenever any finding is downgraded."

  - name: contract_tier_price
    trigger: "CoA close-review with outcome=ACCEPT (prices unit_price_applied)"
    algorithm: tiered_pricing
    formula: |
      Let prior_kg = contract.cumulative_shipped_kg BEFORE this lot,
          lot_kg = coa.shipped_qty_kg.
      Tiers on cumulative committed/shipped kg (per contract):
        T1: [0, 10000)        -> base 4.50
        T2: [10000, 50000)    -> base 4.20
        T3: [50000, +inf)     -> base 3.95
      Marginal allocation across tiers for the lot:
        remaining = lot_kg; cursor = prior_kg; line_value = 0
        while remaining > 0:
          tier = tier containing cursor
          capacity = tier.upper - cursor (or remaining if tier unbounded)
          take = min(remaining, capacity)
          adjusted_base = round_half_up(base_tier * (1 + pass_through * (index_current - index_base)/index_base), 4)
          line_value += take * adjusted_base
          cursor += take; remaining -= take
      unit_price_applied = round_half_up(line_value / lot_kg, 4)
      index_current selector: PriceIndexObservation with index_name ==
        'INGREDIENT-SPOT' and observed_at <= current clock, ordered by
        observed_at DESC; tie-break earliest created_at ASC. Empty pool ->
        use contract.index_base_value as index_current.
      The index adjustment factor is recomputed per tier slice (rounding per
      slice at 4 dp) — evaluation order pinned: per-slice round at 4 dp,
      multiply by kg, sum, final divide rounded at 4 dp.
    input_set: "Single SupplyContract in ACTIVE status referenced by the CoA; single PriceIndexObservation per selector"
    constants:
      TIER1_BASE: 4.50
      TIER2_BASE: 4.20
      TIER3_BASE: 3.95
      TIER1_CAP: 10000
      TIER2_CAP: 50000
    precision: "4 dp round_half_up per slice and final; kg integers exact"

  - name: annual_rebate
    trigger: "Computed read endpoint GET /sourcing/approved-sources/{id}/contracts/{contractId}/rebate"
    algorithm: aggregation
    formula: |
      rebate_rate = 0.02 if accepted_value_total >= 250000 else 0.015
      where accepted_value_total = sum over ACCEPTED/CONDITIONALLY_ACCEPTED CoAs
        of (shipped_qty_kg * unit_price_applied), computed at full precision.
      PINNED ROUNDING ORDER (mode b): for each qualifying CoA lot line,
        line_rebate = round_half_up(shipped_qty_kg * unit_price_applied * rebate_rate, 2)
      total_rebate = sum(line_rebate)   -- per-line rounding THEN sum.
      (The alternative order — sum line values, then round once — is NOT used;
      the two orders diverge: e.g. 3 lots of value 1000.12 at 1.5% give
      per-line 15.00 x 3 = 45.00 vs sum-then-round 45.01.)
    input_set: "CoAs of the contract in ACCEPTED or CONDITIONALLY_ACCEPTED status with received_at within the contract window [window_start, window_end)"
    constants:
      HIGH_RATE: 0.02
      LOW_RATE: 0.015
      HIGH_RATE_THRESHOLD: 250000
    precision: "2 dp round_half_up per line; sum exact"

  - name: supplier_composite_risk_score
    trigger: "CoA acceptance/rejection, audit close, CAPA verify/reject, declaration expiry sweep, supplier qualification approval"
    algorithm: weighted_scoring
    formula: |
      coa_component: over CoAs of all ApprovedSources of this supplier with
        received_at in [clock - 365 days, clock]:
        reject_rate = count(status == REJECTED) / max(1, count(status in {ACCEPTED, CONDITIONALLY_ACCEPTED, REJECTED})) * 100
      audit_component = 100 - latest_closed_audit.audit_score, or 0 when no
        CLOSED audit exists.
      overdue_component = min(100, open_overdue_capa_count * 25)
        (OPEN/SUBMITTED/REJECTED CAPAs with due_date strictly before clock).
      declaration_component = 100 if any ApprovedSource of the supplier in
        ACTIVE status lacks a CURRENT declaration of either required type
        within its validity window, else 0.
      score = clamp(0, 100, round_half_up(
        0.35 * coa_component + 0.30 * audit_component
        + 0.20 * overdue_component + 0.15 * declaration_component, 2))
      Evaluation order pinned: components computed left-to-right as listed;
      weights applied in a single final sum rounded once at 2 dp.
      score >= 70 while supplier QUALIFIED triggers automatic suspension.
    input_set: "CoAs of supplier's sources in 365-day trailing window; latest CLOSED audit; CAPAs of all audits of the supplier; declarations of ACTIVE sources"
    constants:
      W_COA: 0.35
      W_AUDIT: 0.30
      W_OVERDUE: 0.20
      W_DECLARATION: 0.15
      OVERDUE_UNIT: 25
      SUSPEND_THRESHOLD: 70
    precision: "2 dp round_half_up on final sum only"

  - name: formula_impact_delta
    trigger: "SubstitutionRequest assessment (REQUESTED -> IMPACT_ASSESSED)"
    algorithm: constraint_propagation
    formula: |
      For each parameter_name in the UNION of parameter names on the
        to-source pinned spec and the from-source pinned spec:
        from_target = target_value on from-source spec, or 0 when absent
        to_target   = target_value on to-source spec, or 0 when absent
        delta = round_half_up(to_target - from_target, 4)
        cost_delta = round_half_up(delta * cost_per_unit_delta, 4) when the
          request's formula_unit_cost_sensitivities names the parameter,
          else 0
      total_delta_per_unit = round_half_up(sum(cost_delta), 4)
      allergen_delta_tags = to-source CURRENT ALLERGEN declaration tags
        minus ingredient.allergen_profile tags (set difference, sorted ASC)
      coo_changed = (to-source CURRENT COUNTRY_OF_ORIGIN primary_country
        != from-source CURRENT COUNTRY_OF_ORIGIN primary_country)
      requires_regulatory_signoff = (allergen_delta_tags non-empty) OR coo_changed
    input_set: "Both pinned specs' SpecParameter rows; both sources' CURRENT declarations; request.formula_unit_cost_sensitivities"
    constants:
      AUTO_APPROVE_MAX_ABS_DELTA: 0.5000
    precision: "4 dp round_half_up per delta and per cost_delta; final sum rounded at 4 dp"

  - name: audit_cadence_schedule
    trigger: "SupplierAudit close (schedule next audit)"
    algorithm: chronological
    formula: |
      base_cadence_months = 12 if risk_tier == TIER_A else 6 if TIER_B else 3
      If supplier.status == SUSPENDED at close OR open_overdue_capa_count > 0:
        next window_start = clock + 7 days; cadence_source = ESCALATED
      Else:
        next window_start = last_audit_closed_at + base_cadence_months;
        cadence_source = TIER_CADENCE
      window_end = window_start + 14 days (fixed audit window length).
    input_set: "Single supplier; the just-closed audit"
    constants:
      CADENCE_A_MONTHS: 12
      CADENCE_B_MONTHS: 6
      CADENCE_C_MONTHS: 3
      ESCALATION_DAYS: 7
      WINDOW_DAYS: 14
    precision: "date arithmetic in whole months (same day-of-month, clamped to month end); days exact"

  - name: dual_source_breach
    trigger: "ApprovedSource activation/suspension/reinstatement/revocation, spec supersede sweep, substitution execute"
    algorithm: threshold
    formula: |
      active_sources = count of ApprovedSource rows with
        ingredient_id == ingredient.id AND status == ACTIVE
        AND pinned_spec_id == ingredient.active_spec_id
      current_dual_source_breach = requires_dual_source AND (active_sources < 2)
      Boundary: exactly 2 active sources clears the breach (>= comparison on 2).
    input_set: "ApprovedSources of the ingredient pinned to the EFFECTIVE spec"
    constants:
      MIN_DUAL_SOURCES: 2
    precision: "integer count, exact"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right (ingredient before spec before child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Body-referenced FK ids exist (supplier_id, pinned_spec_id, contract_id, from/to approved source ids)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints with FK fields in body"

  - priority: 5
    category: business_referential
    check: "FK coherence: pinned_spec_id belongs to the path ingredient; contract_id belongs to the path approved source; from/to sources belong to the path ingredient"
    error_id: ERR_CROSS_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /sourcing/ingredients/{id}/approved-sources, POST .../coas, POST .../substitution-requests"

  - priority: 6
    category: state
    check: "Target resource state permits the requested transition per its state machine"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: author cannot approve own spec; registrar cannot close own CoA; requester cannot approve own substitution; only author submits/revises; only requester cancels"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "spec approve/reject/submit/revise, coa close-review, substitution approve/reject/cancel"

  - priority: 8
    category: business_temporal
    check: "Temporal guards: clock >= spec.effective_date for make-effective; clock within contract window for activate; clock within audit window for start; declaration validity windows; CAPA due_date after audit report time"
    error_id: ERR_TEMPORAL_GUARD_VIOLATION
    http_status: 422
    applies_to: "make-effective, contract activate, audit start, declaration collect, CAPA create"

  - priority: 9
    category: business_safety
    check: "Qualification gates: questionnaire_score >= 70 for APPROVE (boundary: exactly 70 passes) and document_pack_complete true"
    error_id: ERR_QUALIFICATION_SCORE_TOO_LOW
    http_status: 422
    applies_to: "POST /sourcing/suppliers/{id}/qualifications/{qid}/decide (decision=APPROVE)"

  - priority: 10
    category: business_safety
    check: "document_pack_complete must be true for APPROVE"
    error_id: ERR_DOCUMENT_PACK_INCOMPLETE
    http_status: 422
    applies_to: "POST /sourcing/suppliers/{id}/qualifications/{qid}/decide (decision=APPROVE)"

  - priority: 11
    category: business_constraint
    check: "Parameter bounds: min_value < max_value and min_value <= target_value <= max_value on every SpecParameter at spec approve"
    error_id: ERR_PARAMETER_BOUNDS_INVALID
    http_status: 422
    applies_to: "POST .../specs/{id}/approve"

  - priority: 12
    category: business_constraint
    check: "Uniqueness: ingredient_code, supplier_code, spec_version_label within ingredient, parameter_name within spec, lot_number within approved source, (index_name, observed_at); (ingredient_id, supplier_id, pinned_spec_id) among non-REVOKED ApprovedSources"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "creation endpoints"

  - priority: 13
    category: business_constraint
    check: "Contract window overlap: no two ACTIVE contracts for the same approved source may have overlapping [window_start, window_end) intervals (half-open: touching endpoints do not overlap)"
    error_id: ERR_CONTRACT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /sourcing/approved-sources/{id}/contracts/{cid}/activate"

  - priority: 14
    category: business_temporal
    check: "Declaration coverage: both CURRENT declarations exist and clock inside [valid_from, valid_until) at source activation/reinstatement"
    error_id: ERR_DECLARATION_MISSING
    http_status: 422
    applies_to: "approved-source activate, reinstate"

  - priority: 15
    category: business_constraint
    check: "CoA measured_values cover every SpecParameter of the pinned spec exactly once; observed_value numeric"
    error_id: ERR_MEASURED_VALUES_INCOMPLETE
    http_status: 422
    applies_to: "POST .../coas"

  - priority: 16
    category: business_constraint
    check: "All findings dispositioned before close-review"
    error_id: ERR_FINDINGS_UNDISPOSITIONED
    http_status: 409
    applies_to: "POST .../coas/{id}/close-review"

  - priority: 17
    category: business_safety
    check: "outcome=ACCEPT forbidden when any finding disposition == REJECT_LOT"
    error_id: ERR_FINDINGS_REQUIRE_REJECTION
    http_status: 422
    applies_to: "POST .../coas/{id}/close-review"

  - priority: 18
    category: business_safety
    check: "outcome=ACCEPT requires deviation score < 150 (boundary: exactly 150 blocks ACCEPT)"
    error_id: ERR_DEVIATION_SCORE_TOO_HIGH
    http_status: 422
    applies_to: "POST .../coas/{id}/close-review"

  - priority: 19
    category: business_fiscal
    check: "Substitution auto-approve requires |impact_delta_per_unit| <= 0.5000 unless routed through PENDING_REGULATORY"
    error_id: ERR_IMPACT_DELTA_EXCEEDS_THRESHOLD
    http_status: 422
    applies_to: "POST .../substitution-requests/{id}/approve"

  - priority: 20
    category: business_safety
    check: "Regulatory sign-off presence/need per requires_regulatory_signoff"
    error_id: ERR_REGULATORY_SIGNOFF_REQUIRED
    http_status: 422
    applies_to: "POST .../substitution-requests/{id}/approve"

  - priority: 21
    category: business_constraint
    check: "Route-regulatory only when requires_regulatory_signoff == true"
    error_id: ERR_REGULATORY_SIGNOFF_NOT_REQUIRED
    http_status: 422
    applies_to: "POST .../substitution-requests/{id}/route-regulatory"

  - priority: 22
    category: business_referential
    check: "Cascade guards: discontinue blocked by active sources (ERR_ACTIVE_SOURCES_EXIST) or open substitutions (ERR_OPEN_SUBSTITUTIONS_EXIST); disqualify blocked by open CAPAs (ERR_OPEN_CAPAS_EXIST); revoke blocked by ACTIVE contract (ERR_ACTIVE_CONTRACT_EXISTS); retire spec in use (ERR_SPEC_IN_USE); duplicate in-progress qualification (ERR_QUALIFICATION_IN_PROGRESS); second open audit (ERR_AUDIT_ALREADY_OPEN) — the error_id column names the first-listed representative"
    error_id: ERR_ACTIVE_SOURCES_EXIST
    http_status: 409
    applies_to: "discontinue, disqualify, revoke, retire, qualification create, audit start"

  - priority: 23
    category: business_fiscal
    check: "shipped_qty_kg > 0, annual_committed_volume_kg > 0, index values > 0, 0 < pass_through <= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "contract and coa creation"

  - priority: 24
    category: state
    check: "OCC: expected_<parent>_version matches current parent version on guarded endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /sourcing/ingredients/{id}/specs, POST /sourcing/ingredients/{id}/approved-sources, POST /sourcing/approved-sources/{id}/contracts"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving, mandatory default) ---
  - method: POST
    path: "/sourcing/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default before any call is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. Also runs all time-based sweeps (contract expiry, declaration expiry, overdue CAPA recompute, composite risk recompute)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "Sweep: ACTIVE contracts with window_end <= clock -> EXPIRED"
      - "Sweep: CURRENT declarations with valid_until <= clock -> EXPIRED; parent ACTIVE sources -> SUSPENDED (reason MANUAL)"
      - "Sweep: open_overdue_capa_count recomputed per supplier; composite risk recomputed; auto-suspend at >= 70"

  # --- Ingredients ---
  - method: POST
    path: "/sourcing/ingredients"
    description: "Create an ingredient (DRAFT)"
    roles: [ProcurementManager]
    code: 201
    input: [ingredient_code, name, allergen_profile, requires_dual_source]
    output: Ingredient
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/sourcing/ingredients"
    description: "List ingredients"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, SpecAuthor, PlatformAdmin]
    code: 200
    input: ["status?", "requires_dual_source?", "active_spec_id?", "limit?", "offset?"]
    output: "Ingredient[]"
    side_effects: []

  - method: GET
    path: "/sourcing/ingredients/{id}"
    description: "Get one ingredient"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, SpecAuthor, PlatformAdmin]
    code: 200
    input: []
    output: Ingredient
    side_effects: []

  - method: POST
    path: "/sourcing/ingredients/{id}/activate"
    description: "Activate ingredient (requires an EFFECTIVE spec)"
    roles: [ProcurementManager]
    code: 200
    input: []
    output: Ingredient
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/sourcing/ingredients/{id}/discontinue"
    description: "Discontinue ingredient"
    roles: [ProcurementManager]
    code: 200
    input: []
    output: Ingredient
    side_effects: ["status -> DISCONTINUED; EFFECTIVE spec -> RETIRED; active_spec_id=null"]

  # --- Specs ---
  - method: POST
    path: "/sourcing/ingredients/{id}/specs"
    description: "Create a spec version (DRAFT). OCC-guarded on ingredient version."
    roles: [SpecAuthor]
    code: 201
    input: [spec_version_label, effective_date, version_note, expected_ingredient_version, "supersedes_spec_id?"]
    output: IngredientSpec
    side_effects: ["status=DRAFT; author_user_id=X-User-ID; increments Ingredient.version by 1"]

  - method: GET
    path: "/sourcing/ingredients/{id}/specs"
    description: "List spec versions of an ingredient"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, SpecAuthor, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "IngredientSpec[]"
    side_effects: []

  - method: GET
    path: "/sourcing/ingredients/{id}/specs/{specId}"
    description: "Get one spec"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, SpecAuthor, PlatformAdmin]
    code: 200
    input: []
    output: IngredientSpec
    side_effects: []

  - method: POST
    path: "/sourcing/ingredients/{id}/specs/{specId}/parameters"
    description: "Add a spec parameter (spec must be DRAFT)"
    roles: [SpecAuthor]
    code: 201
    input: [parameter_name, criticality, uom, target_value, min_value, max_value]
    output: SpecParameter
    side_effects: ["spec must be DRAFT else ERR_INVALID_STATE"]

  - method: GET
    path: "/sourcing/ingredients/{id}/specs/{specId}/parameters"
    description: "List parameters of a spec"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, SpecAuthor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "SpecParameter[]"
    side_effects: []

  - method: POST
    path: "/sourcing/ingredients/{id}/specs/{specId}/submit"
    description: "Submit spec for review (author only)"
    roles: [SpecAuthor]
    code: 200
    input: []
    output: IngredientSpec
    side_effects: ["status -> PENDING_REVIEW"]

  - method: POST
    path: "/sourcing/ingredients/{id}/specs/{specId}/approve"
    description: "Approve spec (not the author)"
    roles: [QualityManager]
    code: 200
    input: []
    output: IngredientSpec
    side_effects: ["status -> APPROVED; reviewed_by_user_id set"]

  - method: POST
    path: "/sourcing/ingredients/{id}/specs/{specId}/reject"
    description: "Reject spec (not the author)"
    roles: [QualityManager]
    code: 200
    input: []
    output: IngredientSpec
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/sourcing/ingredients/{id}/specs/{specId}/revise"
    description: "Return rejected spec to DRAFT (author only)"
    roles: [SpecAuthor]
    code: 200
    input: []
    output: IngredientSpec
    side_effects: ["status -> DRAFT"]

  - method: POST
    path: "/sourcing/ingredients/{id}/specs/{specId}/make-effective"
    description: "Make approved spec effective at/after effective_date"
    roles: [QualityManager]
    code: 200
    input: []
    output: IngredientSpec
    side_effects:
      - "status -> EFFECTIVE; superseded spec -> SUPERSEDED"
      - "ingredient.active_spec_id updated"
      - "stale-pin sweep: ACTIVE sources pinned to superseded spec -> SUSPENDED (MANUAL)"
      - "dual-source recompute"

  - method: POST
    path: "/sourcing/ingredients/{id}/specs/{specId}/retire"
    description: "Retire a DRAFT/REJECTED spec not in use"
    roles: [QualityManager]
    code: 200
    input: []
    output: IngredientSpec
    side_effects: ["status -> RETIRED"]

  # --- Suppliers ---
  - method: POST
    path: "/sourcing/suppliers"
    description: "Register a supplier (PROSPECT)"
    roles: [ProcurementManager]
    code: 201
    input: [supplier_code, legal_name, risk_tier, country_of_operation]
    output: Supplier
    side_effects: ["status=PROSPECT"]

  - method: GET
    path: "/sourcing/suppliers"
    description: "List suppliers"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, SpecAuthor, PlatformAdmin]
    code: 200
    input: ["status?", "risk_tier?", "limit?", "offset?"]
    output: "Supplier[]"
    side_effects: []

  - method: GET
    path: "/sourcing/suppliers/{id}"
    description: "Get one supplier"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, SpecAuthor, PlatformAdmin]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: POST
    path: "/sourcing/suppliers/{id}/suspend"
    description: "Manually suspend a QUALIFIED supplier"
    roles: [QualityManager]
    code: 200
    input: []
    output: Supplier
    side_effects: ["status -> SUSPENDED; ACTIVE sources cascade to SUSPENDED (SUPPLIER_SUSPENDED); dual-source recompute"]

  - method: POST
    path: "/sourcing/suppliers/{id}/disqualify"
    description: "Disqualify a SUSPENDED supplier with no open CAPAs"
    roles: [QualityManager]
    code: 200
    input: []
    output: Supplier
    side_effects: ["status -> DISQUALIFIED; all non-REVOKED sources -> REVOKED; their CURRENT declarations -> SUPERSEDED"]

  # --- Qualifications ---
  - method: POST
    path: "/sourcing/suppliers/{id}/qualifications"
    description: "Open a qualification (supplier PROSPECT or SUSPENDED); moves supplier to IN_QUALIFICATION"
    roles: [SupplierQualityEngineer]
    code: 201
    input: [questionnaire_score, document_pack_complete]
    output: SupplierQualification
    side_effects: ["supplier -> IN_QUALIFICATION; requalification_cycle += 1 when from SUSPENDED"]

  - method: GET
    path: "/sourcing/suppliers/{id}/qualifications"
    description: "List qualifications of a supplier"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SupplierQualification[]"
    side_effects: []

  - method: POST
    path: "/sourcing/suppliers/{id}/qualifications/{qualificationId}/evaluate"
    description: "Move qualification to UNDER_EVALUATION"
    roles: [QualityManager]
    code: 200
    input: []
    output: SupplierQualification
    side_effects: ["status -> UNDER_EVALUATION"]

  - method: POST
    path: "/sourcing/suppliers/{id}/qualifications/{qualificationId}/decide"
    description: "Approve or reject a qualification under evaluation"
    roles: [QualityManager]
    code: 200
    input: [decision, decision_note]
    output: SupplierQualification
    side_effects: ["status -> APPROVED or REJECTED; supplier -> QUALIFIED or PROSPECT/SUSPENDED"]

  # --- Approved Sources (ASL) ---
  - method: POST
    path: "/sourcing/ingredients/{id}/approved-sources"
    description: "Create an ApprovedSource (PROVISIONAL). OCC-guarded on ingredient version."
    roles: [ProcurementManager]
    code: 201
    input: [supplier_id, pinned_spec_id, expected_ingredient_version]
    output: ApprovedSource
    side_effects: ["status=PROVISIONAL; increments Ingredient.version by 1"]

  - method: GET
    path: "/sourcing/ingredients/{id}/approved-sources"
    description: "List approved sources of an ingredient"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, SpecAuthor, PlatformAdmin]
    code: 200
    input: ["status?", "supplier_id?", "limit?", "offset?"]
    output: "ApprovedSource[]"
    side_effects: []

  - method: GET
    path: "/sourcing/approved-sources/{id}"
    description: "Get one approved source"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, SpecAuthor, PlatformAdmin]
    code: 200
    input: []
    output: ApprovedSource
    side_effects: []

  - method: POST
    path: "/sourcing/ingredients/{id}/approved-sources/{sourceId}/activate"
    description: "Activate a PROVISIONAL source (declarations + QUALIFIED supplier + EFFECTIVE pinned spec required)"
    roles: [ProcurementManager]
    code: 200
    input: []
    output: ApprovedSource
    side_effects: ["status -> ACTIVE; dual-source recompute"]

  - method: POST
    path: "/sourcing/ingredients/{id}/approved-sources/{sourceId}/suspend"
    description: "Manually suspend an ACTIVE source"
    roles: [ProcurementManager]
    code: 200
    input: []
    output: ApprovedSource
    side_effects: ["status -> SUSPENDED (MANUAL); dual-source recompute"]

  - method: POST
    path: "/sourcing/ingredients/{id}/approved-sources/{sourceId}/reinstate"
    description: "Reinstate a SUSPENDED source"
    roles: [ProcurementManager]
    code: 200
    input: []
    output: ApprovedSource
    side_effects: ["status -> ACTIVE; suspension_reason=NONE; dual-source recompute"]

  - method: POST
    path: "/sourcing/ingredients/{id}/approved-sources/{sourceId}/revoke"
    description: "Revoke a source with no ACTIVE contract"
    roles: [ProcurementManager]
    code: 200
    input: []
    output: ApprovedSource
    side_effects: ["status -> REVOKED; CURRENT declarations -> SUPERSEDED; dual-source recompute"]

  # --- Declarations ---
  - method: POST
    path: "/sourcing/approved-sources/{id}/declarations"
    description: "Collect a regulatory declaration; supersedes any CURRENT one of the same type"
    roles: [RegulatoryAffairs]
    code: 201
    input: [declaration_type, payload, valid_from, valid_until]
    output: RegulatoryDeclaration
    side_effects: ["prior CURRENT declaration of same type -> SUPERSEDED"]

  - method: GET
    path: "/sourcing/approved-sources/{id}/declarations"
    description: "List declarations of a source"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: ["declaration_type?", "status?", "limit?", "offset?"]
    output: "RegulatoryDeclaration[]"
    side_effects: []

  # --- Contracts ---
  - method: POST
    path: "/sourcing/approved-sources/{id}/contracts"
    description: "Create a supply contract (PENDING). OCC-guarded on approved source version."
    roles: [ProcurementManager]
    code: 201
    input: [annual_committed_volume_kg, index_base_value, index_pass_through_pct, window_start, window_end, expected_approved_source_version]
    output: SupplyContract
    side_effects: ["status=PENDING; increments ApprovedSource.version by 1"]

  - method: GET
    path: "/sourcing/approved-sources/{id}/contracts"
    description: "List contracts of a source"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SupplyContract[]"
    side_effects: []

  - method: POST
    path: "/sourcing/approved-sources/{id}/contracts/{contractId}/activate"
    description: "Activate a PENDING contract inside its window (no overlap with other ACTIVE contracts)"
    roles: [ProcurementManager]
    code: 200
    input: []
    output: SupplyContract
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/sourcing/approved-sources/{id}/contracts/{contractId}/terminate"
    description: "Terminate a PENDING or ACTIVE contract"
    roles: [ProcurementManager]
    code: 200
    input: []
    output: SupplyContract
    side_effects: ["status -> TERMINATED"]

  - method: GET
    path: "/sourcing/approved-sources/{id}/contracts/{contractId}/rebate"
    description: "Computed read: annual rebate for a contract per annual_rebate calculation"
    roles: [ProcurementManager, QualityManager, PlatformAdmin]
    code: 200
    input: []
    output: "{ contract_id: string, rebate_rate: number, accepted_value_total: number, total_rebate: number, line_count: integer }"
    side_effects: ["read-only; evaluates calculation annual_rebate over the contract's ACCEPTED/CONDITIONALLY_ACCEPTED CoAs"]

  # --- Flat read aliases (FK reverse-reachability) ---
  - method: GET
    path: "/sourcing/specs"
    description: "List spec versions across ingredients (filtered)"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, SpecAuthor, PlatformAdmin]
    code: 200
    input: ["ingredient_id?", "supersedes_spec_id?", "status?", "limit?", "offset?"]
    output: "IngredientSpec[]"
    side_effects: []

  - method: GET
    path: "/sourcing/specs/{specId}"
    description: "Get one spec by id (flat alias)"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, SpecAuthor, PlatformAdmin]
    code: 200
    input: []
    output: IngredientSpec
    side_effects: []

  - method: GET
    path: "/sourcing/specs/{id}/parameters"
    description: "List parameters of a spec (flat alias)"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, SpecAuthor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "SpecParameter[]"
    side_effects: []

  - method: GET
    path: "/sourcing/specs/{id}/approved-sources"
    description: "List approved sources pinned to a spec (flat alias)"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, SpecAuthor, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ApprovedSource[]"
    side_effects: []

  - method: GET
    path: "/sourcing/suppliers/{id}/approved-sources"
    description: "List approved sources of a supplier (reverse lookup)"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, SpecAuthor, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ApprovedSource[]"
    side_effects: []

  - method: GET
    path: "/sourcing/contracts/{contractId}"
    description: "Get one contract by id (flat alias)"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: []
    output: SupplyContract
    side_effects: []

  - method: GET
    path: "/sourcing/contracts/{id}/coas"
    description: "List CoAs registered against a contract (reverse lookup)"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CertificateOfAnalysis[]"
    side_effects: []

  - method: GET
    path: "/sourcing/coas/{coaId}"
    description: "Get one CoA by id (flat alias)"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: []
    output: CertificateOfAnalysis
    side_effects: []

  - method: GET
    path: "/sourcing/coas/{id}/findings"
    description: "List OOS findings of a CoA (flat alias)"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: ["disposition?", "limit?", "offset?"]
    output: "CoAOutOfSpecFinding[]"
    side_effects: []

  - method: GET
    path: "/sourcing/approved-sources/{id}/substitution-requests"
    description: "List substitution requests referencing a source as from or to (reverse lookup)"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SubstitutionRequest[]"
    side_effects: []

  - method: GET
    path: "/sourcing/substitution-requests/{requestId}"
    description: "Get one substitution request by id (flat alias)"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: []

  - method: GET
    path: "/sourcing/substitution-requests/{id}/assessment"
    description: "Get the FormulaImpactAssessment of a request (flat alias; array of 0-1)"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: []
    output: "FormulaImpactAssessment[]"
    side_effects: []

  - method: GET
    path: "/sourcing/audits/{auditId}"
    description: "Get one audit by id (flat alias)"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: []
    output: SupplierAudit
    side_effects: []

  - method: GET
    path: "/sourcing/audits/{id}/corrective-actions"
    description: "List CAPAs of an audit (flat alias)"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CorrectiveAction[]"
    side_effects: []

  # --- Price index ---
  - method: POST
    path: "/sourcing/price-index-observations"
    description: "Record a market price index observation (immutable log)"
    roles: [PlatformAdmin]
    code: 201
    input: [index_name, observed_at, index_value]
    output: PriceIndexObservation
    side_effects: []

  - method: GET
    path: "/sourcing/price-index-observations"
    description: "List index observations"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, SpecAuthor, PlatformAdmin]
    code: 200
    input: ["index_name?", "limit?", "offset?"]
    output: "PriceIndexObservation[]"
    side_effects: []

  # --- CoAs ---
  - method: POST
    path: "/sourcing/approved-sources/{id}/coas"
    description: "Register a CoA lot (source must be ACTIVE; referenced contract must be ACTIVE)"
    roles: [SupplierQualityEngineer]
    code: 201
    input: [contract_id, lot_number, shipped_qty_kg, received_at, measured_values]
    output: CertificateOfAnalysis
    side_effects: ["status=REGISTERED; registered_by_user_id=X-User-ID"]

  - method: GET
    path: "/sourcing/approved-sources/{id}/coas"
    description: "List CoAs of a source"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: ["status?", "contract_id?", "limit?", "offset?"]
    output: "CertificateOfAnalysis[]"
    side_effects: []

  - method: GET
    path: "/sourcing/approved-sources/{id}/coas/{coaId}"
    description: "Get one CoA"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: []
    output: CertificateOfAnalysis
    side_effects: []

  - method: POST
    path: "/sourcing/approved-sources/{id}/coas/{coaId}/start-review"
    description: "Start CoA review: findings auto-created, provisional score computed"
    roles: [QualityManager]
    code: 200
    input: []
    output: CertificateOfAnalysis
    side_effects: ["status -> UNDER_REVIEW; findings created; provisional_deviation_score computed"]

  - method: GET
    path: "/sourcing/approved-sources/{id}/coas/{coaId}/findings"
    description: "List OOS findings of a CoA"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: ["disposition?", "limit?", "offset?"]
    output: "CoAOutOfSpecFinding[]"
    side_effects: []

  - method: POST
    path: "/sourcing/approved-sources/{id}/coas/{coaId}/findings/{findingId}/disposition"
    description: "Disposition a finding (ACCEPT_AS_IS | DOWNGRADED_TO_MINOR | REJECT_LOT)"
    roles: [QualityManager]
    code: 200
    input: [disposition, disposition_note]
    output: CoAOutOfSpecFinding
    side_effects: ["disposition set; CoA must be UNDER_REVIEW"]

  - method: POST
    path: "/sourcing/approved-sources/{id}/coas/{coaId}/close-review"
    description: "Close CoA review with ACCEPT or REJECT (not the registrar)"
    roles: [QualityManager]
    code: 200
    input: [outcome]
    output: CertificateOfAnalysis
    side_effects:
      - "final_deviation_score computed"
      - "ACCEPT: unit_price_applied computed; contract.cumulative_shipped_kg += shipped_qty_kg; status ACCEPTED or CONDITIONALLY_ACCEPTED"
      - "REJECT: status REJECTED; no volume accrual"
      - "supplier composite risk recomputed; auto-suspend at >= 70"

  # --- Substitution requests ---
  - method: POST
    path: "/sourcing/ingredients/{id}/substitution-requests"
    description: "Create a substitution request (REQUESTED)"
    roles: [ProcurementManager]
    code: 201
    input: [from_approved_source_id, to_approved_source_id, reason_code, formula_unit_cost_sensitivities]
    output: SubstitutionRequest
    side_effects: ["status=REQUESTED; requested_by_user_id=X-User-ID"]

  - method: GET
    path: "/sourcing/ingredients/{id}/substitution-requests"
    description: "List substitution requests of an ingredient"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SubstitutionRequest[]"
    side_effects: []

  - method: POST
    path: "/sourcing/ingredients/{id}/substitution-requests/{requestId}/assess"
    description: "Run formula impact assessment"
    roles: [SupplierQualityEngineer]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: ["status -> IMPACT_ASSESSED; FormulaImpactAssessment created; requires_regulatory_signoff computed"]

  - method: GET
    path: "/sourcing/ingredients/{id}/substitution-requests/{requestId}/assessment"
    description: "Get the FormulaImpactAssessment of a request (array of 0-1)"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: []
    output: "FormulaImpactAssessment[]"
    side_effects: []

  - method: POST
    path: "/sourcing/ingredients/{id}/substitution-requests/{requestId}/route-regulatory"
    description: "Route an assessed request to regulatory when sign-off required"
    roles: [SupplierQualityEngineer]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: ["status -> PENDING_REGULATORY"]

  - method: POST
    path: "/sourcing/ingredients/{id}/substitution-requests/{requestId}/regulatory-signoff"
    description: "Record Regulatory Affairs sign-off on a PENDING_REGULATORY request"
    roles: [RegulatoryAffairs]
    code: 200
    input: [signoff_note]
    output: SubstitutionRequest
    side_effects: ["sign-off recorded (status unchanged)"]

  - method: POST
    path: "/sourcing/ingredients/{id}/substitution-requests/{requestId}/approve"
    description: "Approve an assessed or regulatory-cleared request (not the requester)"
    roles: [QualityManager]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/sourcing/ingredients/{id}/substitution-requests/{requestId}/reject"
    description: "Reject a request (not the requester)"
    roles: [QualityManager]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/sourcing/ingredients/{id}/substitution-requests/{requestId}/execute"
    description: "Execute an approved substitution; suspends the replaced source"
    roles: [ProcurementManager]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: ["status -> EXECUTED; from-source -> SUSPENDED (MANUAL); dual-source recompute"]

  - method: POST
    path: "/sourcing/ingredients/{id}/substitution-requests/{requestId}/cancel"
    description: "Cancel a non-terminal request (requester only)"
    roles: [ProcurementManager]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: ["status -> CANCELLED"]

  # --- Audits ---
  - method: POST
    path: "/sourcing/suppliers/{id}/audits"
    description: "Schedule a supplier audit"
    roles: [SupplierQualityEngineer]
    code: 201
    input: [scheduled_window_start, scheduled_window_end]
    output: SupplierAudit
    side_effects: ["status=SCHEDULED; cadence_source computed (ESCALATED if supplier SUSPENDED or overdue CAPAs > 0)"]

  - method: GET
    path: "/sourcing/suppliers/{id}/audits"
    description: "List audits of a supplier"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SupplierAudit[]"
    side_effects: []

  - method: POST
    path: "/sourcing/suppliers/{id}/audits/{auditId}/start"
    description: "Start a scheduled audit inside its window (only one open audit per supplier)"
    roles: [SupplierQualityEngineer]
    code: 200
    input: []
    output: SupplierAudit
    side_effects: ["status -> IN_PROGRESS"]

  - method: POST
    path: "/sourcing/suppliers/{id}/audits/{auditId}/issue-report"
    description: "Issue audit report with score"
    roles: [SupplierQualityEngineer]
    code: 200
    input: [audit_score, findings_summary]
    output: SupplierAudit
    side_effects: ["status -> REPORT_ISSUED"]

  - method: POST
    path: "/sourcing/suppliers/{id}/audits/{auditId}/close"
    description: "Close an audit once all CAPAs verified; schedules next audit per cadence"
    roles: [QualityManager]
    code: 200
    input: []
    output: SupplierAudit
    side_effects: ["status -> CLOSED; supplier.last_audit_closed_at set; composite risk recomputed; next audit auto-scheduled"]

  - method: POST
    path: "/sourcing/suppliers/{id}/audits/{auditId}/cancel"
    description: "Cancel a SCHEDULED audit"
    roles: [QualityManager]
    code: 200
    input: []
    output: SupplierAudit
    side_effects: ["status -> CANCELLED"]

  # --- Corrective actions ---
  - method: POST
    path: "/sourcing/suppliers/{id}/audits/{auditId}/corrective-actions"
    description: "Raise a CAPA on a REPORT_ISSUED audit"
    roles: [QualityManager]
    code: 201
    input: [description, due_date]
    output: CorrectiveAction
    side_effects: ["status=OPEN; audit must be REPORT_ISSUED else ERR_INVALID_STATE"]

  - method: GET
    path: "/sourcing/suppliers/{id}/audits/{auditId}/corrective-actions"
    description: "List CAPAs of an audit"
    roles: [ProcurementManager, QualityManager, SupplierQualityEngineer, RegulatoryAffairs, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CorrectiveAction[]"
    side_effects: []

  - method: POST
    path: "/sourcing/suppliers/{id}/audits/{auditId}/corrective-actions/{capaId}/submit-response"
    description: "Submit or resubmit a CAPA response"
    roles: [SupplierQualityEngineer]
    code: 200
    input: [response_text]
    output: CorrectiveAction
    side_effects: ["status OPEN|REJECTED -> SUBMITTED"]

  - method: POST
    path: "/sourcing/suppliers/{id}/audits/{auditId}/corrective-actions/{capaId}/verify"
    description: "Verify a submitted CAPA"
    roles: [QualityManager]
    code: 200
    input: [verification_note]
    output: CorrectiveAction
    side_effects: ["status -> VERIFIED; overdue recompute; composite risk recompute"]

  - method: POST
    path: "/sourcing/suppliers/{id}/audits/{auditId}/corrective-actions/{capaId}/reject-response"
    description: "Reject a submitted CAPA response"
    roles: [QualityManager]
    code: 200
    input: [verification_note]
    output: CorrectiveAction
    side_effects: ["status -> REJECTED; overdue recompute"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist" }
  - { id: ERR_CROSS_REFERENCE_MISMATCH, http: 422, condition: "FK coherence violated (spec not of this ingredient, contract not of this source, sources not of this ingredient)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, type mismatch, min-length violation, non-positive quantity, invalid enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource state does not permit the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempted a step forbidden by segregation of duties (author vs approver, registrar vs closer, requester vs approver/canceller)" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness constraint violated (codes, labels, lot numbers, index observations, non-revoked ASL triple)" }
  - { id: ERR_NO_SPEC_PARAMETERS, http: 409, condition: "Spec submitted for review with zero parameters" }
  - { id: ERR_PARAMETER_BOUNDS_INVALID, http: 422, condition: "A SpecParameter violates min<max or min<=target<=max at approval time" }
  - { id: ERR_SPEC_NOT_YET_EFFECTIVE, http: 422, condition: "make-effective before the spec's effective_date" }
  - { id: ERR_SUPERSEDES_NOT_EFFECTIVE, http: 409, condition: "supersedes_spec_id references a spec not currently EFFECTIVE" }
  - { id: ERR_SPEC_IN_USE, http: 409, condition: "Retire blocked: ApprovedSource rows reference this spec in PROVISIONAL or ACTIVE status" }
  - { id: ERR_NO_EFFECTIVE_SPEC, http: 409, condition: "Ingredient activation requires an EFFECTIVE spec" }
  - { id: ERR_SPEC_NOT_EFFECTIVE, http: 409, condition: "Pinned spec is not EFFECTIVE (source activation/reinstatement, substitution assess)" }
  - { id: ERR_ACTIVE_SOURCES_EXIST, http: 409, condition: "Ingredient discontinuation blocked by PROVISIONAL or ACTIVE sources" }
  - { id: ERR_OPEN_SUBSTITUTIONS_EXIST, http: 409, condition: "Ingredient discontinuation blocked by non-terminal substitution requests" }
  - { id: ERR_QUALIFICATION_IN_PROGRESS, http: 409, condition: "Another qualification for this supplier is SUBMITTED or UNDER_EVALUATION" }
  - { id: ERR_QUALIFICATION_SCORE_TOO_LOW, http: 422, condition: "APPROVE requires questionnaire_score >= 70" }
  - { id: ERR_DOCUMENT_PACK_INCOMPLETE, http: 422, condition: "APPROVE requires document_pack_complete == true" }
  - { id: ERR_SUPPLIER_NOT_QUALIFIED, http: 409, condition: "Source activation/reinstatement requires supplier QUALIFIED" }
  - { id: ERR_OPEN_CAPAS_EXIST, http: 409, condition: "Supplier disqualification or audit close blocked by CAPAs not in VERIFIED status" }
  - { id: ERR_DECLARATION_MISSING, http: 422, condition: "Required CURRENT declaration missing or outside its validity window" }
  - { id: ERR_SOURCE_NOT_ACTIVE, http: 409, condition: "ApprovedSource not ACTIVE (contract activation, CoA registration, substitution assess/execute)" }
  - { id: ERR_ACTIVE_CONTRACT_EXISTS, http: 409, condition: "Source revocation blocked by an ACTIVE contract" }
  - { id: ERR_CONTRACT_WINDOW_NOT_OPEN, http: 422, condition: "Contract activation outside [window_start, window_end)" }
  - { id: ERR_CONTRACT_WINDOW_OVERLAP, http: 409, condition: "Another ACTIVE contract of the same source overlaps this window (half-open arithmetic)" }
  - { id: ERR_MEASURED_VALUES_INCOMPLETE, http: 422, condition: "measured_values do not cover every spec parameter exactly once" }
  - { id: ERR_FINDINGS_UNDISPOSITIONED, http: 409, condition: "close-review with findings still in REPORTED disposition" }
  - { id: ERR_FINDINGS_REQUIRE_REJECTION, http: 422, condition: "outcome=ACCEPT with a REJECT_LOT finding present" }
  - { id: ERR_DEVIATION_SCORE_TOO_HIGH, http: 422, condition: "outcome=ACCEPT with deviation score >= 150" }
  - { id: ERR_REGULATORY_SIGNOFF_REQUIRED, http: 422, condition: "Substitution approval requires regulatory sign-off" }
  - { id: ERR_REGULATORY_SIGNOFF_NOT_REQUIRED, http: 422, condition: "route-regulatory on a request whose requires_regulatory_signoff is false" }
  - { id: ERR_IMPACT_DELTA_EXCEEDS_THRESHOLD, http: 422, condition: "Auto-approval blocked: |impact_delta_per_unit| > 0.5000 without regulatory path" }
  - { id: ERR_AUDIT_WINDOW_NOT_OPEN, http: 422, condition: "Audit start outside [scheduled_window_start, scheduled_window_end)" }
  - { id: ERR_AUDIT_ALREADY_OPEN, http: 409, condition: "Another audit of this supplier is IN_PROGRESS or REPORT_ISSUED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SpecAuthor
    description: "R&D specification author; drafts and submits spec versions; cannot approve own specs"
    identity: opaque
    exclusive_operations:
      - "POST /sourcing/ingredients/{id}/specs — create spec version"
      - "POST .../specs/{id}/parameters — add parameter"
      - "POST .../specs/{id}/submit — submit for review (self only)"
      - "POST .../specs/{id}/revise — return rejected spec to draft (self only)"
    shared_operations:
      - "GET read endpoints"

  - name: QualityManager
    description: "Quality organization approver; approves specs, reviews CoAs, decides qualifications, verifies CAPAs, approves substitutions; never the author/registrar/requester of the item under decision"
    identity: opaque
    exclusive_operations:
      - "POST .../specs/{id}/approve / reject / make-effective / retire"
      - "POST .../coas/{id}/start-review / close-review"
