              captures: { e_body_county: $.data.error_id }
            - call: "POST /signature-batches"
              payload: { petition_id: "${pet_id}", circulator_id: "${c1_id}", county_id: "${alpha_id}", affidavit_signed: true, is_supplemental: true, cure_period_id: "00000000-0000-0000-0000-000000009999" }
              as: Proponent
              as_user_id: "prop-1"
              captures: { e_body_cure: $.data.error_id }
            - call: "POST /fraud-referrals"
              payload: { petition_id: "${pet_id}", circulator_id: "${c1_id}", referral_type: "FORGED_SIGNATURES", narrative: "Batch does not exist.", batch_id: "00000000-0000-0000-0000-000000009999" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { e_body_batch: $.data.error_id }
            - call: "POST /circulation-assignments"
              payload: { petition_id: "${pet_id}", circulator_id: "${c1_id}", effective_from: "2026-08-10T00:00:00Z", effective_to: "2026-08-20T00:00:00Z", assigned_county_codes: ["ZULU"], expected_circulator_version: "${c1_v}" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { e_body_code: $.data.error_id }
          assert:
            - "The twelve GET-by-id probes return, in order, ERR_VERIFICATION_STANDARD_NOT_FOUND, ERR_COUNTY_NOT_FOUND, ERR_VOTER_RECORD_NOT_FOUND, ERR_PETITION_NOT_FOUND, ERR_CIRCULATOR_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_BATCH_NOT_FOUND, ERR_SIGNATURE_RECORD_NOT_FOUND, ERR_ROUND_NOT_FOUND, ERR_CURE_PERIOD_NOT_FOUND, ERR_CHALLENGE_NOT_FOUND, ERR_FRAUD_REFERRAL_NOT_FOUND - all 404, all distinct"
            - "${e_round2} == ERR_ROUND_NOT_FOUND, ${e_cure2} == ERR_CURE_PERIOD_NOT_FOUND, ${e_chal2} == ERR_CHALLENGE_NOT_FOUND, ${e_ref2} == ERR_FRAUD_REFERRAL_NOT_FOUND, ${e_asg2} == ERR_ASSIGNMENT_NOT_FOUND and ${e_rec2} == ERR_SIGNATURE_RECORD_NOT_FOUND - the mutating routes agree with the reads and never report a state or ownership error for an id that does not exist"
            - "${e_body_std} == ERR_VERIFICATION_STANDARD_NOT_FOUND (404) from priority 6"
            - "${e_body_order} == ERR_PETITION_NOT_FOUND - with petition_id, circulator_id and county_id all unresolvable, the first declared key wins"
            - "${e_body_circ} == ERR_CIRCULATOR_NOT_FOUND and ${e_body_county} == ERR_COUNTY_NOT_FOUND - resolving the keys one at a time walks down the declared order"
            - "${e_body_cure} == ERR_CURE_PERIOD_NOT_FOUND, not ERR_SUPPLEMENTAL_WITHOUT_CURE_PERIOD - existence at priority 6 precedes linkage at priority 13"
            - "${e_body_batch} == ERR_BATCH_NOT_FOUND (404) for the optional batch_id of a referral"
            - "${e_body_code} == ERR_COUNTY_NOT_FOUND - every entry of assigned_county_codes is resolved against County.county_code, and an unknown code is an existence failure rather than a shape failure"

  # ---------------------------------------------------------------------------
  # Section 7 of 9: rbac. Guide claim types: exclusive operations, shared
  # operations, peer_roles (entity-backed isolation) and segregation_of_duties.
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: exclusive_operations_denied_to_every_other_role
        claim_type: exclusive_operation
        grounds:
          - roles[SosAdmin].exclusive_operations
          - roles[ElectionsExaminer].exclusive_operations
          - roles[TitleExaminer].exclusive_operations
          - roles[Proponent].exclusive_operations
          - roles[CountyClerk].exclusive_operations
          - roles[Challenger].exclusive_operations
          - validations[priority 3]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          SosAdmin is not a superuser in this program: format review, tallying, title and
          summary drafting, affidavit verification, line validation, petition filing and
          challenge filing are all closed to it, and this instance proves that by denying the
          administrator its way into five other roles' exclusive operations. Because the role
          check sits at priority 3, every probe can name a non-existent resource and must
          still return ERR_UNAUTHORIZED rather than a 404, which also proves no role list is
          being consulted after the lookup. Read endpoints with narrower role lists (the
          voter roll, the invoice, the distribution report) are included so that GET is not
          treated as universally public.
        test_recipe:
          setup:
            - "Almost no domain state is required: every probe must be refused before any lookup, so all path ids are the literal 00000000-0000-0000-0000-000000009999."
            - "One VerificationStandard and one DRAFT Petition are created only so the title-summary probe can carry a server-issued version rather than a literal; neither is ever named in a probe path."
