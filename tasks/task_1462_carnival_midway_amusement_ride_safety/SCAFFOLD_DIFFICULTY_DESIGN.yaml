            - { call: "POST /midway/ticket-sales", payload: { product_id: "${prod_id}", operating_day_id: "${day_id}", quantity: 5, holder_height_in: 60 }, as: TicketClerk, as_user_id: "${clerk_id}", captures: { sale_id: "$.data.id" } }
            - { call: "POST /midway/ride-redemptions", payload: { wristband_id: "${sale_id}", ride_id: "${ride_id}" }, as: RideOperator, as_user_id: "${op_id}", captures: { r1: "$.data.id" } }
            - { call: "POST /midway/ride-redemptions", payload: { wristband_id: "${sale_id}", ride_id: "${ride_id}" }, as: RideOperator, as_user_id: "${op_id}", captures: { r2: "$.data.id" } }
