  - rule_id: resource_temporal_overlap
    instances:
      - name: station_turnaround_buffer_inflates_the_new_interval_on_both_sides
        grounds:
          - validations.priority_32
          - entities.MedicalStation.fields.turnaround_buffer_minutes
          - entities.CombineBooking.fields.starts_at
          - endpoints.POST_draft-ops_combine-bookings
        distinguishing_aspect: |
          Station ST-ORTHO-1 carries a 15-minute turnaround, so a 09:50-10:30 request is
          inflated to [09:35, 10:45) and collides with the 09:00-09:45 exam even though the raw
          intervals do not touch, while a 10:00-10:45 request inflated to [09:45, 11:00) is
          allowed because half-open adjacency at 09:45 is not an overlap. Comparing raw
          intervals accepts the conflict; inflating only one side rejects the legal booking.
