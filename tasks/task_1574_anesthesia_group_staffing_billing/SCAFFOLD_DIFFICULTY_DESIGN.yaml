# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_1574_anesthesia_group_staffing_billing
#
# Cross-reference of SCAFFOLD.yaml §1.1-§1.7 against the nine Difficulty Rules
# of SKILL.md §0.5. Every grounds ref resolves into SCAFFOLD.yaml; every
# test_recipe drives empty-DB -> precondition -> trigger using only §1.5
# endpoints. All money/unit literals were precomputed by executing the §1.3
# formulas (round_half_up, TIME_UNIT_MINUTES=15, CF table, caps) as code.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (two different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_charge_diverge_on_actual_minutes
        grounds:
          - calculations.provisional_charge
          - calculations.final_charge
          - entities.AnesthesiaCase.fields.provisional_charge_cents
          - entities.AnesthesiaCase.fields.final_charge_cents
        distinguishing_aspect: |
          Money-domain dual variant on AnesthesiaCase/BillingClaim: the
          forward-looking provisional charge uses SCHEDULED minutes (120 min ->
          13.0 units -> 104000 cents) while the chronological final charge uses
          ACTUAL minutes (150 min -> 15.0 units -> 120000 cents); identical
          case/assignment data yields 104000 != 120000.
        test_recipe:
          setup:
            - "Site S; fee schedule P100 base_units=5, contracted_max_cents=1000000"
            - "Provider MD (ANESTHESIOLOGIST, credentials/DEA valid through 2027-01-31)"
            - "Roster 2026-08-10 (slots 1, day_end 1020) PUBLISHED; case P100 [540,660) P1 non-emergency"
            - "MD CASE_PRIMARY assignment CONFIRMED; provisional charge computed off scheduled 120 minutes"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P100", base_units: 5, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Avery", provider_type: "ANESTHESIOLOGIST", npi: "1000000001", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { md_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 1, scheduled_day_end_minute: 1020 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", emergency_flag: false, scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: Scheduler
              captures: { case_id: $.data.id, case_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${case_id}/assignments"
              payload: { provider_id: "${md_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${case_ver}" }
              as: Scheduler
              captures: { asg_id: $.data.id }
            - call: "POST /anesthesia-ops/assignments/${asg_id}/accept"
              payload: {}
              as: AttendingAnesthesiologist
              as_user_id: "${md_id}"
            - call: "GET /anesthesia-ops/cases/${case_id}"
              as: Scheduler
              captures: { prov_charge: $.data.provisional_charge_cents }
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases/${case_id}/start"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T11:30:00Z" }
              as: GroupAdministrator
          trigger:
            - call: "POST /anesthesia-ops/cases/${case_id}/complete"
              payload: {}
              as: Scheduler
              captures: { final_charge: $.data.final_charge_cents }
            - call: "GET /anesthesia-ops/claims"
              payload: { case_id: "${case_id}" }
              as: Scheduler
              captures: { claim_mod: "$.data[0].modifier_code", claim_units: "$.data[0].units_total", claim_charge: "$.data[0].charge_cents" }
          assert:
            - "AnesthesiaCase.${case_id}.provisional_charge_cents == 104000  # (5 base + round_half_up(120/15)=8.0 + P1 0 + no-emergency 0) = 13.0 units x PERSONAL_CF 8000"
            - "AnesthesiaCase.${case_id}.final_charge_cents == 120000  # actual 150 min -> 10.0 time units -> 15.0 units x 8000"
            - "Exactly one BillingClaim for the case: modifier_code == PERSONAL, units_total == 15.0, charge_cents == 120000"
            - "${prov_charge} == 104000 and ${final_charge} == 120000 and they differ for identical case data (scheduled vs actual minutes)"

      - name: realtime_vs_period_risk_score_diverge_on_case_terminality
        grounds:
          - calculations.compliance_risk_score
          - entities.ComplianceAudit.fields.realtime_score
          - entities.ComplianceAudit.fields.period_score
          - entities.ComplianceAudit.fields.risk_band
        distinguishing_aspect: |
          Audit-score dual variant on the ComplianceAudit entity domain (vs the
          BillingClaim money domain of the sibling instance): realtime_score sums
          OPEN findings on NON-terminal cases only, period_score sums OPEN
          findings on terminal cases only — the same OPEN finding set
          {CREDENTIAL_LAPSE(10) on a SCHEDULED case, TEFRA_GAP(30) on a
          COMPLETED case} yields realtime 10 != period 30.
        test_recipe:
          setup:
            - "Site S; fee P100 base_units=5; providers D (ANESTHESIOLOGIST, 2027 creds), C1 (CRNA, 2027 creds), P2 (CRNA, creds initially 2026-08-15)"
            - "Roster 2026-08-10 (slots 1, day_end 1020) PUBLISHED"
            - "Case B [600,660) with P2 CASE_PRIMARY PROPOSED; then P2 credentials shortened to 2026-08-08 -> CREDENTIAL_LAPSE (MINOR 10) finding auto-raised on a new OPEN audit (case B SCHEDULED -> realtime bucket)"
            - "Case A [540,600) with C1 CASE_PRIMARY CONFIRMED and D CASE_DIRECTING CONFIRMED; NO attestation created for (case A, D)"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P100", base_units: 5, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Direct", provider_type: "ANESTHESIOLOGIST", npi: "1000000002", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { d_id: $.data.id }
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna One", provider_type: "CRNA", npi: "1000000003", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { c1_id: $.data.id }
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna Two", provider_type: "CRNA", npi: "1000000004", credential_expires_on: "2026-08-15", dea_expires_on: "2026-08-15" }
              as: GroupAdministrator
              captures: { p2_id: $.data.id, p2_ver: $.data.version }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 1, scheduled_day_end_minute: 1020 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 600, scheduled_end_minute: 660 }
              as: Scheduler
              captures: { caseb_id: $.data.id, caseb_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${caseb_id}/assignments"
              payload: { provider_id: "${p2_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${caseb_ver}" }
              as: Scheduler
            - call: "PATCH /anesthesia-ops/providers/${p2_id}/credentials"
              payload: { credential_expires_on: "2026-08-08", dea_expires_on: "2026-08-08", expected_provider_version: "${p2_ver}" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 600 }
              as: Scheduler
              captures: { casea_id: $.data.id, casea_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${casea_id}/assignments"
              payload: { provider_id: "${c1_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${casea_ver}" }
              as: Scheduler
              captures: { asga_id: $.data.id }
            - call: "POST /anesthesia-ops/assignments/${asga_id}/accept"
              payload: {}
              as: CRNA
              as_user_id: "${c1_id}"
            - call: "GET /anesthesia-ops/cases/${casea_id}"
              as: Scheduler
              captures: { casea_v2: $.data.version }
            - call: "POST /anesthesia-ops/cases/${casea_id}/assignments"
              payload: { provider_id: "${d_id}", assignment_role: "CASE_DIRECTING", expected_case_version: "${casea_v2}" }
              as: Scheduler
              captures: { asgd_id: $.data.id }
            - call: "POST /anesthesia-ops/assignments/${asgd_id}/accept"
              payload: {}
              as: AttendingAnesthesiologist
              as_user_id: "${d_id}"
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases/${casea_id}/start"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:00Z" }
              as: GroupAdministrator
          trigger:
            - call: "POST /anesthesia-ops/cases/${casea_id}/complete"
              payload: {}
              as: Scheduler
            - call: "GET /anesthesia-ops/audits"
              payload: { roster_id: "${roster_id}" }
              as: ComplianceAuditor
              captures: { audit_id: "$.data[0].id", rt: "$.data[0].realtime_score", ps: "$.data[0].period_score", band: "$.data[0].risk_band" }
          assert:
            - "ComplianceAudit.${audit_id}.realtime_score == 10  # CREDENTIAL_LAPSE (MINOR 10) on SCHEDULED case B only"
            - "ComplianceAudit.${audit_id}.period_score == 30  # TEFRA_GAP (MAJOR 30) on COMPLETED case A only"
            - "ComplianceAudit.${audit_id}.risk_band == ELEVATED  # band derives from period_score; 20 <= 30 < 50"
            - "${rt} == 10 != ${ps} == 30: identical OPEN finding set, different score per variant (forward-looking exposure vs chronological actuals)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (three different modes a / b / c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: charge_units_multi_input_tier_and_emergency_branch
        grounds:
          - calculations.charge_units
        distinguishing_aspect: |
          Combinatorial mode (a): charge_units combines >= 3 inputs (base_units,
          time_units with 0.1 round_half_up, PS tier table branch P4 -> +2,
          emergency_flag branch -> +2) with non-linear interaction; 97 minutes
          rounds 6.4666... -> 6.5, so units_total = 7 + 6.5 + 2 + 2 = 17.5.
        test_recipe:
          setup:
            - "Site S; fee P200 base_units=7, max 1000000; CRNA provider (2027 creds)"
            - "Roster 2026-08-10 (slots 1, day_end 1200) PUBLISHED; case P200 [480,577) P4 emergency_flag=true; CRNA primary CONFIRMED"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P200", base_units: 7, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna One", provider_type: "CRNA", npi: "1000000003", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { crna_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 1, scheduled_day_end_minute: 1200 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P200", physical_status: "P4", emergency_flag: true, scheduled_start_minute: 480, scheduled_end_minute: 577 }
              as: Scheduler
              captures: { case_id: $.data.id, case_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${case_id}/assignments"
              payload: { provider_id: "${crna_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${case_ver}" }
              as: Scheduler
              captures: { asg_id: $.data.id }
            - call: "POST /anesthesia-ops/assignments/${asg_id}/accept"
              payload: {}
              as: CRNA
              as_user_id: "${crna_id}"
            - call: "GET /anesthesia-ops/cases/${case_id}"
              as: Scheduler
              captures: { prov_charge: $.data.provisional_charge_cents }
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases/${case_id}/start"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:37:00Z" }
              as: GroupAdministrator
          trigger:
            - call: "POST /anesthesia-ops/cases/${case_id}/complete"
              payload: {}
              as: Scheduler
            - call: "GET /anesthesia-ops/claims"
              payload: { case_id: "${case_id}" }
              as: Scheduler
              captures: { claim_units: "$.data[0].units_total", claim_mod: "$.data[0].modifier_code", claim_charge: "$.data[0].charge_cents" }
          assert:
            - "${prov_charge} == 131250  # provisional: 17.5 units x CRNA_SOLO_CF 7500 (CRNA solo, no CONFIRMED directing)"
            - "BillingClaim.units_total == 17.5  # 7 base + round_half_up(97/15)=6.5 + P4 2 + emergency 2"
            - "BillingClaim.modifier_code == QZ and charge_cents == 131250  # actual minutes == scheduled -> final equals provisional here"

      - name: direction_split_odd_gross_cent_remainder_pinned_order
        grounds:
          - calculations.direction_split
          - calculations.modifier_determination
        distinguishing_aspect: |
          Combinatorial mode (b): nested rounding order pinned (round units to
          0.1 -> multiply by DIRECTION_CF 8001 -> round gross cents -> round
          physician half -> remainder to primary). With 13.0 units, gross =
          104013 (odd): physician QY claim 52007, primary QX claim 52006; a naive
          round-each-half order would yield 52007+52007=104014 != gross.
        test_recipe:
          setup:
            - "Site S; fee P300 base_units=5; physicians D and D2 (ANESTHESIOLOGIST, 2027 creds); C1 (CRNA, 2027 creds)"
            - "Roster 2026-08-10 (slots 1, day_end 1200) PUBLISHED; case P300 [540,660) P1"
            - "C1 CASE_PRIMARY CONFIRMED; D CASE_DIRECTING CONFIRMED; attestation (case, D) SUBMITTED by D and VERIFIED by D2 (segregation of duties)"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P300", base_units: 5, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Direct", provider_type: "ANESTHESIOLOGIST", npi: "1000000002", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { d_id: $.data.id }
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Peer", provider_type: "ANESTHESIOLOGIST", npi: "1000000005", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { d2_id: $.data.id }
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna One", provider_type: "CRNA", npi: "1000000003", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { c1_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 1, scheduled_day_end_minute: 1200 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P300", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: Scheduler
              captures: { case_id: $.data.id, case_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${case_id}/assignments"
              payload: { provider_id: "${c1_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${case_ver}" }
              as: Scheduler
              captures: { asg_p: $.data.id }
            - call: "POST /anesthesia-ops/assignments/${asg_p}/accept"
              payload: {}
              as: CRNA
              as_user_id: "${c1_id}"
            - call: "GET /anesthesia-ops/cases/${case_id}"
              as: Scheduler
              captures: { case_v2: $.data.version }
            - call: "POST /anesthesia-ops/cases/${case_id}/assignments"
              payload: { provider_id: "${d_id}", assignment_role: "CASE_DIRECTING", expected_case_version: "${case_v2}" }
              as: Scheduler
              captures: { asg_d: $.data.id }
            - call: "POST /anesthesia-ops/assignments/${asg_d}/accept"
              payload: {}
              as: AttendingAnesthesiologist
              as_user_id: "${d_id}"
            - call: "POST /anesthesia-ops/attestations"
              payload: { case_id: "${case_id}", physician_id: "${d_id}" }
              as: Scheduler
              captures: { att_id: $.data.id }
            - call: "POST /anesthesia-ops/attestations/${att_id}/submit"
              payload: { step_preanesthetic_exam: true, step_prescribes_plan: true, step_participates_key_portions: true, step_ensures_qualified_personnel: true, step_monitors_course: true, step_available_for_emergencies: true, step_post_anesthesia_care: true }
              as: AttendingAnesthesiologist
              as_user_id: "${d_id}"
            - call: "POST /anesthesia-ops/attestations/${att_id}/verify"
              payload: {}
              as: AttendingAnesthesiologist
              as_user_id: "${d2_id}"
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases/${case_id}/start"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T11:00:00Z" }
              as: GroupAdministrator
          trigger:
            - call: "POST /anesthesia-ops/cases/${case_id}/complete"
              payload: {}
              as: Scheduler
              captures: { final_charge: $.data.final_charge_cents }
            - call: "GET /anesthesia-ops/claims"
              payload: { case_id: "${case_id}", provider_id: "${d_id}" }
              as: Scheduler
              captures: { phys_mod: "$.data[0].modifier_code", phys_charge: "$.data[0].charge_cents" }
            - call: "GET /anesthesia-ops/claims"
              payload: { case_id: "${case_id}", provider_id: "${c1_id}" }
              as: Scheduler
              captures: { prim_mod: "$.data[0].modifier_code", prim_charge: "$.data[0].charge_cents" }
          assert:
            - "Physician claim (${d_id}): modifier_code == QY (peak == 1), charge_cents == 52007  # round_half_up(104013/2)"
            - "Primary claim (${c1_id}): modifier_code == QX, charge_cents == 52006  # gross remainder 104013 - 52007"
            - "${phys_charge} + ${prim_charge} == 104013 == round_half_up(13.0 * 8001)  # odd gross; naive per-half rounding would double-count the odd cent"
            - "AnesthesiaCase.${case_id}.final_charge_cents == 104013"

      - name: daily_cap_waterfall_circular_dependency_pinned_order
        grounds:
          - calculations.daily_cap_waterfall
          - calculations.standby_pay
          - calculations.late_stay_pay
          - entities.StipendLedgerEntry.fields.applied_amount_cents
        distinguishing_aspect: |
          Combinatorial mode (c): circular-looking dependency — each entry's
          applied_amount_cents depends on the running applied total of earlier
          entries, which itself mutates on every create/void; the pinned order
          (restart the walk in created_at ASC after every change) makes it
          deterministic. STANDBY 40000 (created first) consumes the cap, so
          LATE_STAY 36000 is truncated to 10000 (reverse order would give
          36000 / 14000).
        test_recipe:
          setup:
            - "Site S with StipendAgreement covering 2026-08-10 (standby_full 40000, standby_partial 15000, late_stay_rate 200/min, call 12000)"
            - "CRNA P (2027 creds); roster 2026-08-10 (slots 2, day_end 1020) PUBLISHED"
            - "Case X [600,660) primary P CONFIRMED; case Y [700,800) primary P CONFIRMED"
            - "Clock 09:30 -> cancel case X (notice 30 < 120 -> STANDBY 40000, created_at t1)"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/stipend-agreements"
              payload: { site_id: "${site_id}", effective_from: "2026-08-10", effective_to: "2026-08-10", call_stipend_cents: 12000, late_stay_rate_cents_per_minute: 200, standby_full_cents: 40000, standby_partial_cents: 15000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna One", provider_type: "CRNA", npi: "1000000003", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 2, scheduled_day_end_minute: 1020 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
