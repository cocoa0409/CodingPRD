  # =================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_cascade_holds_milestones_refund_paymentstatus
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.SpaceHold.COMMITTED_to_RELEASED
          - state_machines.Booking.DEPOSIT_PAID_to_REFUNDED
          - calculations.cancellation_refund
          - entities.PaymentMilestone.fields.milestone_status
        distinguishing_aspect: |
          Depth-3 chain from one trigger (cancel): cancel mutates Booking -> that mutation releases
          its COMMITTED SpaceHolds AND posts an OUTBOUND refund Payment -> the refund Payment mutates
          amount_paid_cents which itself drives payment_status DEPOSIT_PAID -> REFUNDED. Each link is
          caused by the previous one, not directly by the cancel call.
        test_recipe:
          setup:
            - "Confirmed booking, FLEXIBLE venue (CONFIRMED retention 0.00 -> full refund), deposit 783800 paid, two COMMITTED holds"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vflex", cancellation_tier: "FLEXIBLE" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
