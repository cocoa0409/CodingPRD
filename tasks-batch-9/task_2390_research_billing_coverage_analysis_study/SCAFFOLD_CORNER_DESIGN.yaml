        excluded_because:
          difficulty_instance: "boundary_precision_check / aging_bucket_flips_at_day_31_and_is_stale_between_runs"
          rationale: "That instance runs the op twice over a multi-charge study and asserts which rows were re-bucketed, which were skipped for not being UNBILLED, and the charges_aged_count / visits_missed_count the run reports."

  # =========================================================================
  # SECTION 6 - errors
  # =========================================================================
  - section: errors
    instances:
      - name: duplicate_protocol_number_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_PROTOCOL_NUMBER]
          - validations[priority 29]
        distinguishing_aspect: "Global uniqueness on protocol_number: a second registration reusing AMC-2390-C50 returns 409 ERR_DUPLICATE_PROTOCOL_NUMBER even though every other field differs, and the study collection still holds exactly one row with that number."
        test_recipe:
          setup:
            - "One registered study with protocol_number AMC-2390-C50."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C50", title: "Corner duplicate probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id" }
          trigger:
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C50", title: "Different title, same number", sponsor_name: "Vantage Biologics", funding_source: "FEDERALLY_FUNDED", ind_ide_status: "NONE", therapeutic_intent: false }
              as: ResearchBillingManager
              as_user_id: "mgr_2"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "trigger response 409 with error_id == \"ERR_DUPLICATE_PROTOCOL_NUMBER\""
            - "GET /research-billing/studies returns total_count == 1 and that row is ${study_id} with sponsor_name \"Northgate Therapeutics\""
            - "registering protocol_number \"AMC-2390-C51\" with the same rejected body returns 201 - only the number collided"

      - name: pagination_limit_above_the_maximum_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_PAGINATION]
          - validations[priority 4]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit 101 is one past the declared maximum of 100, so the list read returns 400 ERR_INVALID_PAGINATION rather than clamping, while limit 100 on the same collection succeeds."
        test_recipe:
          setup:
            - "One registered study so the collection is non-empty."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C52", title: "Corner pagination probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id" }
          trigger:
            - call: "GET /research-billing/studies?limit=101"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "trigger response 400 with error_id == \"ERR_INVALID_PAGINATION\""
            - "GET /research-billing/studies?limit=100 returns 200 with total_count == 1"
            - "GET /research-billing/studies?limit=0 and GET /research-billing/studies?offset=-1 both return 400 ERR_INVALID_PAGINATION"
            - "GET /research-billing/studies with no pagination parameters returns 200 with limit defaulted to 10 and offset 0"

      - name: short_paid_remittance_equal_to_the_net_total_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REMITTANCE_AMOUNT_INVALID]
          - validations[priority 44]
          - calculations.sponsor_invoice_net_total
        distinguishing_aspect: "SHORT_PAID requires amount_paid_cents strictly below net_total_cents, so 40000 against a net of exactly 40000 is refused 422 - the boundary belongs to PAID_IN_FULL, and the invoice stays SUBMITTED with amount_paid_cents 0."
        test_recipe:
          setup:
            - "One INVESTIGATOR_INITIATED study (indirect rate 0.0) with a single sponsor-held charge of 40000 placed on invoice 1 and submitted, giving net_total_cents 40000."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C53", title: "Corner remittance probe", sponsor_name: "Northgate Therapeutics", funding_source: "INVESTIGATOR_INITIATED", ind_ide_status: "NONE", therapeutic_intent: false }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "J9999", description: "Investigational infusion", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 55000, negotiated_unit_cents: 40000, units_per_occurrence: 1, expected_occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "GET /research-billing/studies/${study_id}"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_v3: "$.data.version" }
            - call: "POST /research-billing/studies/${study_id}/budget-build"
              payload: { source_analysis_id: "${analysis_id}", basis: "COVERAGE_DRIVEN", indirect_rate_pct: 30.0, expected_study_version: "${study_v3}" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { effective_rate: "$.data.effective_indirect_rate_pct" }
            - call: "POST /research-billing/charges"
              payload: { study_id: "${study_id}", charge_code: "J9999", service_date: "2026-08-01", amount_cents: 40000 }
              as: StudyCoordinator
              as_user_id: "coord_1"
              captures: { charge_id: "$.data.id" }
            - call: "POST /research-billing/charges/${charge_id}/review"
              payload: { decision: "HOLD_FOR_SPONSOR" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "GET /research-billing/studies/${study_id}"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_v_before_invoice: "$.data.version" }
            - call: "POST /research-billing/sponsor-invoices"
              payload: { study_id: "${study_id}", period_end_date: "2026-08-31", expected_study_version: "${study_v_before_invoice}" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { invoice_id: "$.data.id", net_total: "$.data.net_total_cents" }
            - call: "POST /research-billing/sponsor-invoices/${invoice_id}/submit"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { status_after_submit: "$.data.status" }
          trigger:
            - call: "POST /research-billing/sponsor-invoices/${invoice_id}/remittance"
              payload: { outcome: "SHORT_PAID", amount_paid_cents: 40000 }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "setup: effective_rate == 0.0, net_total == 40000 (subtotal 40000, indirect 0, gross 40000 under the 1000000 credit threshold) and status_after_submit == \"SUBMITTED\""
            - "trigger response 422 with error_id == \"ERR_REMITTANCE_AMOUNT_INVALID\""
            - "GET /research-billing/studies/${study_id}/sponsor-invoices returns that invoice still at status \"SUBMITTED\" with amount_paid_cents == 0 and short_paid == false"
            - "GET /research-billing/charges/${charge_id} still shows billing_state == \"INVOICED_SPONSOR\""
            - "outcome SHORT_PAID with amount_paid_cents 39999 returns 200 with status \"PAID\", short_paid == true and sponsor_written_off_cents == 1 on the study"
            - "outcome PAID_IN_FULL with amount_paid_cents 39999 returns 422 ERR_REMITTANCE_AMOUNT_INVALID - the rule is symmetric"

      - name: charge_review_without_an_analysis_effective_at_service_date_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_EFFECTIVE_ANALYSIS]
          - validations[priority 24]
          - calculations.charge_routing_expectation.variants
        distinguishing_aspect: "An APPROVED analysis exists but was approved on 2026-08-05, after the charge's 2026-08-01 service date, so the as_of_service_date candidate set is empty and the review is refused 409 - the persisted expected_routing_target, computed under current_effective, still reads SPONSOR."
        test_recipe:
          setup:
            - "One study whose only analysis was approved at 2026-08-05T00:00:00Z, and one charge on item J9999 with service_date 2026-08-01 posted after that approval."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
