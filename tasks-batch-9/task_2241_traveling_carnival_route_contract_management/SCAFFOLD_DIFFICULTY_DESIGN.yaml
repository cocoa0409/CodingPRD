        grounds:
          - state_machines.Settlement.PROVISIONAL_to_FINAL
          - state_machines.RouteStop.TEARDOWN_to_CLOSED
          - state_machines.CrewAssignment.SCHEDULED_to_COMPLETED
          - state_machines.Route.IN_PROGRESS_to_CLOSED
          - calculations.worker_duty_exposure
          - entities.Route.fields.closed_stop_count
        distinguishing_aspect: |
          This cascade runs in the opposite direction to the execute cascade — it is a CLOSE-OUT chain whose deepest
          hop touches a grandparent-of-a-sibling: finalize (hop 1) closes the stop, the closing stop completes every
          SCHEDULED CrewAssignment (hop 2), each completion re-derives Worker.worked_days_count under the WORKED_BASIS
