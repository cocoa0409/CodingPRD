              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9L2-RHX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v1: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9L2-A", expected_rail_car_version: "${car_v1}" }
              as: RailroadAgent
              captures: { cyc1_id: $.data.id }
          trigger:
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9L2-B", expected_rail_car_version: "${car_v1}" }
              as: RailroadAgent
              captures: { error_id: $.data.error_id, message: $.data.message }
            - call: "GET /demurrage/rail-cars/${car_id}"
              payload: {}
              as: RailroadAgent
              captures: { car_v2: $.data.version, active_cycle_count: $.data.active_cycle_count }
            - call: "POST /demurrage/placement-cycles"
