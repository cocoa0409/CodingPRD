            - { call: "POST /trainees/${t1_id}/enrollment", payload: { action: "ENROLL" }, as: ProgramCoordinator, as_user_id: "coord-admin-0" }
            - { call: "POST /cohorts/${coh_id}/advance", payload: { to_status: "SCHEDULED" }, as: ProgramCoordinator, as_user_id: "coord-admin-0" }
            - { call: "POST /cohorts/${coh_id}/advance", payload: { to_status: "IN_SESSION" }, as: ProgramCoordinator, as_user_id: "coord-admin-0" }
