scenario: "Chart Ranking Rules, Streaming Weighting & Manipulation Enforcement (Billboard): chart methodology defining the weighting of sales, on-demand streams, programmed streams and airplay with periodic revisions, data provider integration for sales and streaming with reporting cutoffs and territory scoping, bundle and merchandise sale rules limiting what counts as an album sale, chart eligibility rules covering release configuration, price floors and availability windows, manipulation detection for artificial streaming, bulk purchases and ticket bundles with disqualification, recurrent rules moving older titles off charts and re-entry conditions, genre chart classification disputes and reclassification, chart week calendar and holiday adjustments"

domain_name: chart-ranking-streaming-weighting
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - rate_threshold_triggers
    - optimistic_concurrency
    - cascading_side_effects
    - ops_run_checkpoint
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Chart
    parent: null
    common_fields: true
    fields:
      - name: chart_code
        type: string
        source: input
        description: Unique business code identifying the chart (e.g. HOT100, BB200, GENRE-COUNTRY-50)
        constraints: unique across all charts, immutable after creation
      - name: title
        type: string
        source: input
        description: Human-readable chart name
      - name: chart_kind
        type: enum
        source: input
        description: "Structural kind of chart; ALBUMS charts admit TitleProduct entries of product_kind ALBUM only; SINGLES charts admit TRACK only"
        constraints: "one of {SINGLES, ALBUMS}"
      - name: chart_scope
        type: enum
        source: input
        description: "Whether the chart is genre-scoped; GENRE charts require genre_tag and admit genre disputes, MAIN charts do not"
        constraints: "one of {MAIN, GENRE}"
      - name: genre_tag
        type: string
        source: input
        description: "Genre classification tag; required iff chart_scope == GENRE, forbidden otherwise"
        constraints: required when chart_scope is GENRE; must be null when chart_scope is MAIN
      - name: current_methodology_version_id
        type: string
        source: system
        description: "System-maintained reference to the MethodologyVersion whose status is ACTIVE for this chart; re-pointed by activation and freeze-resolution cascades"
      - name: recurrent_rule_id
        type: string
        source: input
        description: "FK -> RecurrentRule.id; the recurrent policy governing this chart; every chart must reference exactly one recurrent rule at creation"

  - name: MethodologyVersion
    parent: Chart
    common_fields: true
    fields:
      - name: chart_id
        type: string
        source: input
        description: "FK -> Chart.id; the chart this methodology revision belongs to"
      - name: version_label
        type: string
        source: input
        description: Human label for the revision (e.g. "2026-Q4 revision")
      - name: w_sales
        type: number
        source: input
        description: "Weight applied to unit sales component in chart points"
        constraints: ">= 0, scale 4 decimal places"
      - name: w_on_demand
        type: number
        source: input
        description: Weight applied to on-demand stream-equivalent component
        constraints: ">= 0, scale 4 decimal places"
      - name: w_programmed
        type: number
        source: input
        description: Weight applied to programmed stream-equivalent component
        constraints: ">= 0, scale 4 decimal places"
      - name: w_airplay
        type: number
        source: input
        description: Weight applied to airplay audience component
        constraints: ">= 0, scale 4 decimal places"
      - name: paid_stream_divisor
        type: integer
        source: input
        description: "On-demand paid streams per one stream-equivalent unit (SEA)"
        constraints: ">= 1"
      - name: ad_stream_divisor
        type: integer
        source: input
        description: "On-demand ad-supported streams per one stream-equivalent unit (SEA)"
        constraints: ">= 1"
      - name: prog_stream_divisor
        type: integer
        source: input
        description: Programmed streams per one stream-equivalent unit
        constraints: ">= 1"
      - name: tea_rate
        type: integer
        source: input
        description: "Track-equivalent-album rate: this many on-demand paid-equivalent track streams of album tracks count as one album unit on ALBUMS charts"
        constraints: ">= 1"
      - name: effective_from
        type: datetime
        source: input
        description: "Earliest chart week whose publish may use this version; a week can only be computed under a version whose effective_from <= week.opens_at"
      - name: status
        type: enum
        source: system
        description: Lifecycle state of this methodology revision
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUPERSEDED, FROZEN}; see state_machines.MethodologyVersion"

  - name: ChartWeek
    parent: Chart
    common_fields: true
    fields:
      - name: chart_id
        type: string
        source: input
        description: "FK -> Chart.id; the chart this weekly cycle belongs to"
      - name: week_index
        type: integer
        source: input
        description: "Monotonic week number within the chart's calendar"
        constraints: unique per chart_id
      - name: opens_at
        type: datetime
        source: input
        description: "Start of the consumption reporting window (inclusive)"
      - name: closes_at
        type: datetime
        source: input
        description: "End of the consumption reporting window (exclusive); half-open interval [opens_at, closes_at)"
      - name: reporting_cutoff
        type: datetime
        source: input
        description: "Latest event_time a report may carry and still be attributed to this week; normally equals closes_at but moved earlier by holiday adjustment"
      - name: status
        type: enum
        source: system
        description: Cycle state of the week
        default: OPEN
        constraints: "one of {OPEN, LOCKED, COMPUTED, PUBLISHED}; see state_machines.ChartWeek"
      - name: computed_methodology_version_id
        type: string
        source: system
        description: "System-maintained reference to the MethodologyVersion under which points were computed; pinned at the compute transition"
      - name: holiday_adjusted
        type: boolean
        source: system
        description: "True after a successful holiday adjustment shift on this week"
        default: false

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: provider_code
        type: string
        source: input
        description: "Unique code for the data provider (e.g. DSP-ALPHA, RETAIL-POS-9)"
        constraints: unique across all providers
      - name: display_name
        type: string
        source: input
        description: Human-readable provider name
      - name: feed_kind
        type: enum
        source: input
        description: "Which consumption component this provider's feeds may carry"
        constraints: "one of {SALES, STREAM_ON_DEMAND, STREAM_PROGRAMMED, AIRPLAY}"
      - name: territory
        type: enum
        source: input
        description: "Territory scope of the provider's feed; only DOMESTIC reports count toward chart points"
        constraints: "one of {DOMESTIC, INTERNATIONAL}"
      - name: status
        type: enum
        source: system
        description: Whether the provider's feeds are currently accepted
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: TitleProduct
    parent: null
    common_fields: true
    fields:
      - name: upc
        type: string
        source: input
        description: "Product barcode; unique per TitleProduct"
        constraints: unique across all title products
      - name: title
        type: string
        source: input
        description: Display title of the product
      - name: artist_name
        type: string
        source: input
        description: Primary artist credit
      - name: product_kind
        type: enum
        source: input
        description: "Whether the product is a single track or an album package; gates chart_kind admission"
        constraints: "one of {TRACK, ALBUM}"
      - name: genre_tag
        type: string
        source: input
        description: "Primary genre classification; matchable against GENRE charts' genre_tag"
      - name: release_date
        type: datetime
        source: input
        description: "Commercial release date; eligibility requires first chart week to open no earlier than release_date"
      - name: base_price_cents
        type: integer
        source: input
        description: "Current list price in cents; price-floor eligibility compares against the chart's floor"
        constraints: ">= 0"
      - name: label_account_id
        type: string
        source: input
        description: "FK -> LabelAccount.id; the label account that owns this product; ownership checks for dispute filing compare X-User-ID against this field"
      - name: availability_policy
        type: object
        source: input
        description: "Availability window policy with keys available_from (ISO datetime) and available_until (ISO datetime or null for open-ended); a title outside this window on a week's opens_at is ineligible"
        constraints: "available_from < available_until when both present"
      - name: eligibility_posture
        type: enum
        source: computed
        description: "Cached posture for the title's standing: ELIGIBLE normally; DISQUALIFIED after a manipulation investigation reaches DISQUALIFIED; reinstated to ELIGIBLE by explicit reinstate action"
        default: ELIGIBLE
        constraints: "one of {ELIGIBLE, DISQUALIFIED}"

  - name: LabelAccount
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the label
      - name: account_code
        type: string
        source: input
        description: Unique account code
        constraints: unique across all label accounts
      - name: strike_count
        type: integer
        source: computed
        description: "Cumulative confirmed manipulation strikes across all of the label's products; incremented on investigation DISQUALIFY confirmation and on suspicious-report CONFIRMED; drives THREE_STRIKES suspension"
        default: 0
      - name: account_status
        type: enum
        source: system
        description: Standing of the label account
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}; see state_machines.LabelAccount"

  - name: RecurrentRule
    parent: null
    common_fields: true
    fields:
      - name: rule_code
        type: string
        source: input
        description: Unique code of the recurrent policy
        constraints: unique across all recurrent rules
      - name: max_weeks
        type: integer
        source: input
        description: "Maximum number of published chart weeks a title may appear on this chart before recurrent removal evaluates"
        constraints: ">= 1"
      - name: min_rank
        type: integer
        source: input
        description: "Recurrent removal triggers when weeks_on_chart >= max_weeks AND current rank > min_rank (strictly worse than this rank)"
        constraints: ">= 1"
      - name: reentry_min_rank
        type: integer
        source: input
        description: "A RECURRENT_REMOVED entry may re-enter only with rank <= reentry_min_rank; rank exactly equal to reentry_min_rank qualifies (inclusive)"
        constraints: ">= 1"
      - name: description
        type: string
        source: input
        description: Free-text description of the recurrent policy

  - name: ConsumptionReport
    parent: Provider
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; submitting provider"
      - name: title_product_id
        type: string
        source: input
        description: "FK -> TitleProduct.id; product the consumption concerns"
      - name: chart_week_id
        type: string
        source: input
        description: "FK -> ChartWeek.id; the week this report is attributed to"
      - name: component_kind
        type: enum
        source: input
        description: "Which component of consumption this report carries; must match provider.feed_kind"
        constraints: "one of {SALES, STREAM_ON_DEMAND_PAID, STREAM_ON_DEMAND_AD, STREAM_PROGRAMMED, AIRPLAY}"
      - name: quantity
        type: integer
        source: input
        description: "Raw units: units sold, stream count, or airplay audience impressions"
        constraints: "> 0"
      - name: event_time
        type: datetime
        source: input
        description: "Time of the consumption; must fall within [week.opens_at, week.reporting_cutoff) to be accepted"
      - name: file_fingerprint
        type: string
        source: input
        description: "Content hash of the provider file; duplicate fingerprint from the same provider is rejected as a re-delivered batch"
      - name: status
        type: enum
        source: system
        description: Review state of the report
        default: RECEIVED
        constraints: "one of {RECEIVED, ACCEPTED, QUARANTINED, REJECTED, EXCLUDED}; see state_machines.ConsumptionReport"
      - name: review_reason
        type: string
        source: system
        description: "Free-text reason recorded when the report is QUARANTINED or REJECTED"

  - name: SaleBatch
    parent: TitleProduct
    common_fields: true
    fields:
      - name: title_product_id
        type: string
        source: input
        description: "FK -> TitleProduct.id; album product this sale batch concerns; must be product_kind ALBUM"
      - name: channel
        type: enum
        source: input
        description: "Sales channel of the batch; D2C (direct-to-consumer) and RETAIL are countable toward album units; TICKET_BUNDLE and MERCH_BUNDLE attach an album to a non-music primary item and are never countable"
        constraints: "one of {D2C, RETAIL, TICKET_BUNDLE, MERCH_BUNDLE}"
      - name: quantity
        type: integer
        source: input
        description: Gross units in the batch
        constraints: "> 0"
      - name: buyer_key
        type: string
        source: input
        description: "Pseudonymous buyer identifier; per-buyer cap of MAX_ALBUM_UNITS_PER_BUYER_PER_WEEK countable units applies per (buyer_key, title_product, chart week)"
      - name: chart_week_id
        type: string
        source: input
        description: "FK -> ChartWeek.id; week the batch is attributed to"
      - name: countable_units
        type: integer
        source: computed
        description: "Units from this batch that count toward album points: 0 for TICKET_BUNDLE/MERCH_BUNDLE; min(quantity, remaining per-buyer cap headroom) for D2C/RETAIL, allocated in created_at ASC order with quantity ASC tie-break"
        default: 0
      - name: review_status
        type: enum
        source: system
        description: "Bulk-purchase review state; UNDER_REVIEW batches contribute 0 countable units until CLEARED"
        default: CLEARED
        constraints: "one of {CLEARED, UNDER_REVIEW, REJECTED}"

  - name: ManipulationSignal
    parent: TitleProduct
    common_fields: true
    fields:
      - name: title_product_id
        type: string
        source: input
        description: "FK -> TitleProduct.id; product the signal concerns"
      - name: chart_week_id
        type: string
        source: input
        description: "FK -> ChartWeek.id; week the signal attaches to"
      - name: signal_kind
        type: enum
        source: input
        description: "Class of manipulation signal"
        constraints: "one of {ARTIFICIAL_STREAMING, BULK_PURCHASE, TICKET_BUNDLE_ABUSE}"
      - name: evidence
        type: string
        source: input
        description: Free-text evidence description
      - name: status
        type: enum
        source: system
        description: Triage state of the signal
        default: OPEN
        constraints: "one of {OPEN, DISMISSED, ESCALATED}; see state_machines.ManipulationSignal"

  - name: Investigation
    parent: ManipulationSignal
    common_fields: true
    fields:
      - name: signal_id
        type: string
        source: input
        description: "FK -> ManipulationSignal.id; the escalated signal under investigation; at most one Investigation per signal (unique)"
      - name: assigned_to
        type: string
        source: input
        description: "Opaque investigator operator id; segregation of duties forbids this equalling the signal filer's X-User-ID"
      - name: finding
        type: enum
        source: input
        description: "Investigation outcome; null while OPEN"
        constraints: "one of {DISMISSED, QUARANTINE_REPORTS, DISQUALIFY} or null"
      - name: notes
        type: string
        source: input
        description: Investigator notes
      - name: status
        type: enum
        source: system
        description: Case state
        default: OPEN
        constraints: "one of {OPEN, CLOSED}; see state_machines.Investigation"

  - name: ChartEntry
    parent: ChartWeek
    common_fields: true
    fields:
      - name: chart_week_id
        type: string
        source: input
        description: "FK -> ChartWeek.id; the week this entry belongs to"
      - name: title_product_id
        type: string
        source: input
        description: "FK -> TitleProduct.id; the ranked product"
      - name: points
        type: number
        source: computed
        description: "Chart points computed under the week's pinned methodology version; scale 4 decimal places, round-half-up at the final step only"
        default: 0
      - name: rank
        type: integer
        source: computed
        description: "Ordinal position; assigned at publish by points DESC with tie-break title created_at ASC"
      - name: weeks_on_chart
        type: integer
        source: computed
        description: "Cumulative count of published entries for (chart, title) including this week"
        default: 0
      - name: peak_rank
        type: integer
        source: computed
        description: "Best (lowest numeric) rank achieved so far on this chart by this title"
      - name: entry_status
        type: enum
        source: system
        description: "Recurrent lifecycle of the entry"
        default: ACTIVE
        constraints: "one of {ACTIVE, RECURRENT_REMOVED, RE_ENTERED}; see state_machines.ChartEntry"

  - name: GenreDispute
    parent: TitleProduct
    common_fields: true
    fields:
      - name: title_product_id
        type: string
        source: input
        description: "FK -> TitleProduct.id; product whose genre classification is disputed"
      - name: chart_id
        type: string
        source: input
        description: "FK -> Chart.id; the GENRE chart whose classification is disputed"
      - name: filed_by_label_id
        type: string
        source: input
        description: "FK -> LabelAccount.id; the filing label; must equal the title's owning label (LabelRep ownership check)"
      - name: claimed_genre
        type: string
        source: input
        description: Genre the filer claims the product belongs to
      - name: resolution
        type: enum
        source: input
        description: "Resolution outcome; null while FILED/UNDER_REVIEW"
        constraints: "one of {UPHOLD, RECLASSIFY} or null"
      - name: status
        type: enum
        source: system
        description: Dispute workflow state
        default: FILED
        constraints: "one of {FILED, UNDER_REVIEW, RESOLVED_UPHELD, RESOLVED_RECLASSIFIED}; see state_machines.GenreDispute"
      - name: reentries_processed
        type: boolean
        source: system
        description: "True after the re-entry evaluation cascade has run for the affected chart following RECLASSIFY resolution"
        default: false

  - name: ChartFreeze
    parent: Chart
    common_fields: true
    fields:
      - name: chart_id
        type: string
        source: input
        description: "FK -> Chart.id; the frozen chart"
      - name: reason
        type: string
        source: input
        description: Reason for the freeze
      - name: expected_chart_version
        type: integer
        source: input
        description: "OCC precondition: caller's last-observed version of the Chart; mismatch rejects with ERR_STALE_VERSION"
      - name: resolved_by_methodology_version_id
        type: string
        source: input
        description: "Reference supplied at resolve time naming the MethodologyVersion that must already be ACTIVE before the freeze can be lifted"
      - name: status
        type: enum
        source: system
        description: Freeze lifecycle
        default: ACTIVE
        constraints: "one of {ACTIVE, RESOLVED}"

state_machines:
  - entity: MethodologyVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /charts/{id}/methodology-versions/{id}/activate"
        actor: ChartManager
        preconditions:
          - "methodology.chart_id resolves to an existing Chart"
          - "chart has no ChartFreeze with status == ACTIVE"
          - "methodology.effective_from is not null"
        side_effects:
          - "prior ACTIVE MethodologyVersion of the same chart (if any) transitions ACTIVE -> SUPERSEDED, its version increments by 1"
          - "chart.current_methodology_version_id re-pointed to this version; chart.version increments by 1"
          - "every ChartWeek of this chart with status == COMPUTED is invalidated back to LOCKED, its computed_methodology_version_id cleared, its version increments by 1, and every ChartEntry of such a week has points reset to 0 and rank cleared (null), version incremented"
          - "this MethodologyVersion.version increments by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: another MethodologyVersion of the same chart transitions DRAFT -> ACTIVE"
        actor: system
        preconditions: []
        side_effects:
          - "this MethodologyVersion.version increments by 1"
      - from: DRAFT
        to: FROZEN
        trigger: "POST /charts/{id}/freeze"
        actor: system
        preconditions: []
        side_effects:
          - "this MethodologyVersion.version increments by 1"
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /charts/{id}/freeze"
        actor: system
        preconditions: []
        side_effects:
          - "this MethodologyVersion.version increments by 1"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /charts/{id}/freeze/{id}/resolve"
        actor: ChartManager
        preconditions:
          - "this MethodologyVersion is the version named by chart_freeze.resolved_by_methodology_version_id"
        side_effects:
          - "prior ACTIVE MethodologyVersion of the same chart (if any) transitions ACTIVE -> SUPERSEDED"
          - "chart.current_methodology_version_id re-pointed to this version"
          - "every ChartWeek of this chart with status == COMPUTED is invalidated back to LOCKED, computed_methodology_version_id cleared, and its ChartEntry rows reset (points 0, rank null)"
          - "this MethodologyVersion.version increments by 1"
      - from: FROZEN
        to: SUPERSEDED
        trigger: "POST /charts/{id}/freeze/{id}/resolve"
        actor: system
        preconditions:
          - "this MethodologyVersion is not the version named by chart_freeze.resolved_by_methodology_version_id"
        side_effects:
          - "this MethodologyVersion.version increments by 1"

  - entity: ChartWeek
    initial_state: OPEN
    terminal_states: [PUBLISHED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /chart-weeks/{id}/lock"
        actor: ChartManager
        preconditions:
          - "logical clock current time >= chart_week.closes_at"
          - "chart has no ChartFreeze with status == ACTIVE"
        side_effects:
          - "all ConsumptionReport rows of this week still in status RECEIVED transition to REJECTED with review_reason 'late-arriving at lock', version incremented"
          - "chart_week.version increments by 1"
      - from: LOCKED
        to: COMPUTED
        trigger: "POST /chart-weeks/{id}/compute"
        actor: ChartManager
        preconditions:
          - "chart has no ChartFreeze with status == ACTIVE"
          - "chart.current_methodology_version_id is not null and that MethodologyVersion has status == ACTIVE"
          - "methodology.effective_from <= chart_week.opens_at"
        side_effects:
          - "chart_week.computed_methodology_version_id pinned to chart.current_methodology_version_id"
          - "ChartEntry rows created or recomputed for every eligible title with points computed by chart_points under the pinned methodology; titles previously holding an entry on this week have their entry refreshed"
          - "chart_week.version increments by 1"
      - from: COMPUTED
        to: LOCKED
        trigger: "system: methodology activation or freeze-resolution cascade invalidates computed weeks"
        actor: system
        preconditions: []
        side_effects:
          - "chart_week.computed_methodology_version_id cleared to null"
          - "every ChartEntry of this week has points reset to 0 and rank cleared to null, version incremented"
          - "chart_week.version increments by 1"
      - from: COMPUTED
        to: PUBLISHED
        trigger: "POST /chart-weeks/{id}/publish"
        actor: ChartManager
        preconditions:
          - "chart_week.computed_methodology_version_id equals chart.current_methodology_version_id"
          - "chart has no ChartFreeze with status == ACTIVE"
        side_effects:
          - "rank assignment: entries sorted by points DESC, tie-break title created_at ASC; rank assigned 1..N in that order"
          - "weeks_on_chart computed per entry as count of published entries for (chart, title) including this week; peak_rank recomputed as min over all published ranks"
          - "recurrent sweep per chart.recurrent_rule_id: entry transitions ACTIVE -> RECURRENT_REMOVED when weeks_on_chart >= rule.max_weeks AND rank > rule.min_rank"
          - "chart_week.version increments by 1"
      - from: OPEN
        to: OPEN
        trigger: "POST /chart-weeks/{id}/holiday-adjust"
        actor: ChartManager
        preconditions:
          - "chart_week.status == OPEN"
          - "payload.new_reporting_cutoff < current chart_week.reporting_cutoff"
          - "payload.new_reporting_cutoff >= chart_week.opens_at"
        side_effects:
          - "chart_week.reporting_cutoff set to new_reporting_cutoff"
          - "chart_week.holiday_adjusted set to true"
          - "all ConsumptionReport rows of this week with status in {RECEIVED, ACCEPTED} and event_time >= new_reporting_cutoff transition to REJECTED with review_reason 'outside adjusted cutoff', version incremented"
          - "chart_week.version increments by 1"

  - entity: ConsumptionReport
    initial_state: RECEIVED
    terminal_states: [REJECTED, EXCLUDED]
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /consumption-reports/{id}/accept"
        actor: ChartOps
        preconditions:
          - "report.provider.status == ACTIVE"
          - "report.chart_week.status == OPEN"
          - "report.event_time within [chart_week.opens_at, chart_week.reporting_cutoff)"
          - "report.component_kind is permitted by provider.feed_kind"
          - "no ChartFreeze with status == ACTIVE exists for the week's chart"
        side_effects:
          - "consumption_report.version increments by 1"
      - from: RECEIVED
        to: QUARANTINED
        trigger: "POST /consumption-reports/{id}/quarantine"
        actor: ChartOps
        preconditions:
          - "report.chart_week.status == OPEN"
        side_effects:
          - "consumption_report.version increments by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /consumption-reports/{id}/reject"
        actor: ChartOps
        preconditions:
          - "report.chart_week.status == OPEN"
        side_effects:
          - "consumption_report.version increments by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "system: chart week lock or holiday adjustment discards in-flight reports"
        actor: system
        preconditions: []
        side_effects:
          - "review_reason set to 'late-arriving at lock' or 'outside adjusted cutoff'"
          - "consumption_report.version increments by 1"
      - from: ACCEPTED
        to: EXCLUDED
        trigger: "system: investigation resolved with finding QUARANTINE_REPORTS or DISQUALIFY"
        actor: system
        preconditions: []
        side_effects:
          - "any ChartWeek of the report's chart with status == COMPUTED is invalidated back to LOCKED (entries reset, computed_methodology_version_id cleared)"
          - "consumption_report.version increments by 1"

  - entity: ManipulationSignal
    initial_state: OPEN
    terminal_states: [DISMISSED, ESCALATED]
    transitions:
      - from: OPEN
        to: DISMISSED
        trigger: "POST /manipulation-signals/{id}/dismiss"
        actor: ChartOps
        preconditions: []
        side_effects:
          - "manipulation_signal.version increments by 1"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /manipulation-signals/{id}/escalate"
        actor: ChartOps
        preconditions:
          - "signal.title_product.label_account.account_status == ACTIVE"
        side_effects:
          - "an Investigation is created for this signal with status OPEN (assigned_to taken from payload, must differ from the escalating ChartOps user's X-User-ID)"
          - "if signal.signal_kind == ARTIFICIAL_STREAMING: every ConsumptionReport of the same (title_product_id, chart_week_id) with component_kind in {STREAM_ON_DEMAND_PAID, STREAM_ON_DEMAND_AD, STREAM_PROGRAMMED} and status == ACCEPTED transitions to QUARANTINED"
          - "if signal.signal_kind == BULK_PURCHASE: every SaleBatch of the same (title_product_id, chart_week_id) with review_status == CLEARED transitions to UNDER_REVIEW and its countable_units set to 0"
          - "if signal.signal_kind == TICKET_BUNDLE_ABUSE: every SaleBatch of the same (title_product_id, chart_week_id) with channel in {TICKET_BUNDLE, MERCH_BUNDLE} and review_status == CLEARED transitions to UNDER_REVIEW"
          - "manipulation_signal.version increments by 1"

  - entity: Investigation
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /investigations/{id}/resolve"
        actor: Investigator
        preconditions:
          - "investigation.assigned_to == X-User-ID of the resolving Investigator (segregation of duties: resolver must be the assigned investigator, who differs from the filer)"
          - "payload.finding in {DISMISSED, QUARANTINE_REPORTS, DISQUALIFY}"
        side_effects:
          - "investigation.finding recorded; investigation.version increments by 1"
          - "if finding == DISMISSED: reports and sale batches quarantined or under-review for this signal's (title, week) are restored (QUARANTINED -> ACCEPTED; SaleBatch UNDER_REVIEW -> CLEARED with countable_units recomputed under per-buyer cap)"
          - "if finding == QUARANTINE_REPORTS: all ConsumptionReport rows of the signal's (title_product_id, chart_week_id) with status in {ACCEPTED, QUARANTINED} transition to EXCLUDED; affected COMPUTED weeks invalidated to LOCKED"
          - "if finding == DISQUALIFY: title_product.eligibility_posture set to DISQUALIFIED; all ChartEntry rows of the title on the signal's week transition to RECURRENT_REMOVED (removed from ranking); all ConsumptionReport rows of the title for that week with status in {ACCEPTED, QUARANTINED} transition to EXCLUDED; label_account.strike_count increments by 1; if label_account.strike_count reaches 3 the label transitions ACTIVE -> SUSPENDED; affected COMPUTED weeks invalidated to LOCKED"

  - entity: SaleBatch
    initial_state: CLEARED
    terminal_states: [REJECTED]
    transitions:
      - from: CLEARED
        to: UNDER_REVIEW
        trigger: "system: BULK_PURCHASE or TICKET_BUNDLE_ABUSE signal escalation"
        actor: system
        preconditions: []
        side_effects:
          - "sale_batch.countable_units set to 0"
          - "sale_batch.version increments by 1"
      - from: UNDER_REVIEW
        to: CLEARED
        trigger: "system: investigation resolved DISMISSED"
        actor: system
        preconditions: []
        side_effects:
          - "sale_batch.countable_units recomputed under per-buyer cap allocation in created_at ASC order with quantity ASC tie-break"
          - "sale_batch.version increments by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system: investigation resolved QUARANTINE_REPORTS or DISQUALIFY"
        actor: system
        preconditions: []
        side_effects:
          - "sale_batch.countable_units remains 0"
          - "sale_batch.version increments by 1"

  - entity: ChartEntry
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RECURRENT_REMOVED
        trigger: "system: recurrent sweep at publish, or DISQUALIFY investigation"
        actor: system
        preconditions:
          - "recurrent sweep path: entry.weeks_on_chart >= rule.max_weeks AND entry.rank > rule.min_rank (rank strictly worse than min_rank)"
        side_effects:
          - "chart_entry.version increments by 1"
      - from: RECURRENT_REMOVED
        to: RE_ENTERED
        trigger: "system: re-entry evaluation after a genre reclassification cascade, or at a later publish"
        actor: system
        preconditions:
          - "the title is again eligible and its computed rank on the re-evaluated week satisfies rank <= rule.reentry_min_rank (inclusive)"
        side_effects:
          - "chart_entry.version increments by 1"

  - entity: GenreDispute
    initial_state: FILED
    terminal_states: [RESOLVED_UPHELD, RESOLVED_RECLASSIFIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /genre-disputes/{id}/review"
        actor: ChartOps
        preconditions: []
        side_effects:
          - "genre_dispute.version increments by 1"
      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /genre-disputes/{id}/resolve with resolution == UPHOLD"
        actor: ChartManager
        preconditions: []
        side_effects:
          - "genre_dispute.version increments by 1"
      - from: UNDER_REVIEW
        to: RESOLVED_RECLASSIFIED
        trigger: "POST /genre-disputes/{id}/resolve with resolution == RECLASSIFY"
        actor: ChartManager
        preconditions:
          - "dispute.chart.chart_scope == GENRE"
          - "payload.new_genre_tag equals dispute.chart.genre_tag"
        side_effects:
          - "title_product.genre_tag set to payload.new_genre_tag; title_product.version increments by 1"
          - "genre_dispute.reentries_processed set to true"
          - "re-entry evaluation cascade on the dispute's chart: every ChartEntry with entry_status == RECURRENT_REMOVED on weeks of this chart whose title is now eligible is re-evaluated; entries whose computed rank on their week satisfies rank <= chart.recurrent_rule.reentry_min_rank transition RECURRENT_REMOVED -> RE_ENTERED"
          - "genre_dispute.version increments by 1"

  - entity: LabelAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: strike_count reaches 3 (THREE_STRIKES)"
        actor: system
        preconditions:
          - "label_account.strike_count >= 3"
        side_effects:
          - "label_account.version increments by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /label-accounts/{id}/reinstate"
        actor: ChartManager
        preconditions: []
        side_effects:
          - "label_account.version increments by 1"

  - entity: TitleProduct
    initial_state: ELIGIBLE
    terminal_states: []
    transitions:
      - from: ELIGIBLE
        to: DISQUALIFIED
        trigger: "system: investigation resolved with finding DISQUALIFY"
        actor: system
        preconditions: []
        side_effects:
          - "title_product.eligibility_posture set to DISQUALIFIED; version increments by 1"
      - from: DISQUALIFIED
        to: ELIGIBLE
        trigger: "POST /titles/{id}/reinstate"
        actor: ChartManager
        preconditions: []
        side_effects:
          - "title_product.eligibility_posture set to ELIGIBLE; version increments by 1"

concurrency_rules:
  - rule_id: methodology-activation-stale-chart
    parent_entity: Chart
    write_endpoint: "POST /charts/{id}/methodology-versions/{id}/activate"
    occ_field: "expected_chart_version"
    description: |
      Activating a methodology version against a Chart whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just activated a different methodology revision (which
      legitimately supersedes the prior ACTIVE version) and the current writer's
      view of the chart is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: freeze-creation-stale-chart
    parent_entity: Chart
    write_endpoint: "POST /charts/{id}/freeze"
    occ_field: "expected_chart_version"
    description: |
      Freezing a Chart whose version has advanced since the client last observed
      it is rejected. This captures the case where another writer has just frozen
      or unfrozen the same chart and the current writer's view of the chart's
      freeze posture is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: chart_points
    trigger: "POST /chart-weeks/{id}/compute (initial) and recompute after invalidation cascades"
    algorithm: weighted_scoring
    formula: |
      sea_paid = floor(sum of quantity over ACCEPTED ConsumptionReport rows for (title, week)
                       with component_kind == STREAM_ON_DEMAND_PAID / methodology.paid_stream_divisor)
      sea_ad   = floor(sum of quantity over ACCEPTED ConsumptionReport rows for (title, week)
                       with component_kind == STREAM_ON_DEMAND_AD / methodology.ad_stream_divisor)
      sea_prog = floor(sum of quantity over ACCEPTED ConsumptionReport rows for (title, week)
                       with component_kind == STREAM_PROGRAMMED / methodology.prog_stream_divisor)
      airplay  = sum of quantity over ACCEPTED ConsumptionReport rows for (title, week)
                 with component_kind == AIRPLAY
      sales_units = sum of countable_units over SaleBatch rows of (title, week) with review_status == CLEARED
                  + sum of quantity over ACCEPTED ConsumptionReport rows with component_kind == SALES
      if chart.chart_kind == ALBUMS and title.product_kind == ALBUM:
          tea_units = floor(sea_paid / methodology.tea_rate)
          points = methodology.w_sales * sales_units
                 + methodology.w_on_demand * tea_units
                 + methodology.w_programmed * sea_prog
                 + methodology.w_airplay * airplay
      else:
          points = methodology.w_sales * sales_units
                 + methodology.w_on_demand * (sea_paid + sea_ad)
                 + methodology.w_programmed * sea_prog
                 + methodology.w_airplay * airplay
      Round ONLY the final points value to 4 decimal places, round-half-up.
      Divisions are integer floors applied per component BEFORE weighting; weights are never rounded.
    input_set: "ConsumptionReport rows of (title, chart_week) with status == ACCEPTED and provider.territory == DOMESTIC only; SaleBatch rows with review_status == CLEARED; reports with status in {RECEIVED, QUARANTINED, REJECTED, EXCLUDED} contribute zero; providers with territory == INTERNATIONAL contribute zero"
    constants:
      POINTS_SCALE: 4
      ROUNDING: round_half_up
    precision: "4 decimal places on final points only; intermediate component sums are exact integers; division floors before weighting"
    variants:
      - name: singles_track_formula
        when: "chart.chart_kind == SINGLES, or title.product_kind == TRACK"
        difference: "on-demand component is sea_paid + sea_ad summed; no TEA conversion"
      - name: albums_tea_formula
        when: "chart.chart_kind == ALBUMS and title.product_kind == ALBUM"
        difference: "on-demand paid component is converted to album units via floor(sea_paid / tea_rate); ad-supported on-demand streams do not count toward album points at all"

  - name: countable_album_units
    trigger: "SaleBatch creation (D2C/RETAIL channels) and recompute on investigation dismissal"
    algorithm: waterfall_allocation
    formula: |
      For each (buyer_key, title_product_id, chart_week_id) group:
        eligible batches = SaleBatch rows with review_status == CLEARED
                           and channel in {D2C, RETAIL}, ordered by created_at ASC,
                           tie-break quantity ASC.
        headroom = MAX_ALBUM_UNITS_PER_BUYER_PER_WEEK
        for each batch in order:
          batch.countable_units = min(batch.quantity, headroom)
          headroom = headroom - batch.countable_units
        Batches with channel in {TICKET_BUNDLE, MERCH_BUNDLE} always have countable_units = 0.
      If total eligible quantity is an exact multiple of the cap, the LAST batch in
      created_at order (quantity ASC tie-break) receives 0 units; cap allocation is
      strictly fill-in-order with no proportional split.
    input_set: "SaleBatch rows of (buyer_key, title_product_id, chart_week_id) with review_status == CLEARED; UNDER_REVIEW and REJECTED batches contribute 0 and consume no headroom"
    constants:
      MAX_ALBUM_UNITS_PER_BUYER_PER_WEEK: 4
      PRICE_FLOOR_CENTS: 300
    precision: integer units
    variants:
      - name: sales_report_variant
        when: "units arrive as ConsumptionReport rows with component_kind == SALES instead of SaleBatch rows"
        difference: "per-buyer cap is not applicable (no buyer_key); full quantity counts, added directly into sales_units in chart_points"
    variants_note: "SaleBatch channel-based exclusion plus per-buyer cap vs uncapped SALES report path produces different album-unit totals for identical gross quantities."

  - name: recurrent_weeks_count
    trigger: "POST /chart-weeks/{id}/publish (per entry) and re-entry evaluation"
    algorithm: aggregation
    formula: |
      weeks_on_chart(entry) = count of ChartEntry rows e' for the same (chart, title)
        such that e'.chart_week is PUBLISHED, e'.entry_status != RECURRENT_REMOVED at
        its own publish time, e'.chart_week.week_index < entry.chart_week.week_index
        ... plus 1 for the current entry.
      peak_rank(entry) = min over ranks of all published entries of (chart, title)
        including the current week's rank.
      removal condition: weeks_on_chart >= rule.max_weeks AND rank > rule.min_rank.
      re-entry condition: rank <= rule.reentry_min_rank (inclusive boundary).
    input_set: "ChartEntry rows whose chart_week.status == PUBLISHED at the time of counting, for the same (chart_id, title_product_id), ordered by week_index ASC"
    constants: {}
    precision: integer counts and ranks
    variants:
      - name: provisional_weeks_count
        when: "week is COMPUTED but not yet PUBLISHED (preview surface in compute response)"
        difference: "counts only PUBLISHED prior weeks; the current week is excluded, so provisional weeks_on_chart is one less than the value that publish will compute"
      - name: final_weeks_count
        when: "at publish time"
        difference: "includes the current week's entry; this is the value stored on the ChartEntry row"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a role declared in roles; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc and POST /_events/emit (PlatformAdmin only, still authenticated)"
  - priority: 2
    category: auth
    check: "acting role is permitted on the endpoint per roles matrix; ownership checks where declared (LabelRep must own the title for dispute filing; Investigator must be assigned_to for resolve)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path id and every FK id in payload resolves to an existing entity, validated left-to-right (chart, then methodology version, then week, then others)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "OCC precondition where declared: expected_chart_version equals chart.version (concurrency_rules)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /charts/{id}/methodology-versions/{id}/activate, POST /charts/{id}/freeze"
  - priority: 5
    category: state
    check: "chart has no ChartFreeze with status == ACTIVE (freeze gate) for week lock/compute/publish, report accept, methodology activation"
    error_id: ERR_CHART_FROZEN
    http_status: 409
    applies_to: "POST /chart-weeks/{id}/lock, POST /chart-weeks/{id}/compute, POST /chart-weeks/{id}/publish, POST /consumption-reports/{id}/accept, POST /charts/{id}/methodology-versions/{id}/activate"
  - priority: 6
    category: state
    check: "target entity is in a state from which the requested transition is declared in state_machines (report review requires RECEIVED; week transitions per ChartWeek machine; dispute review requires FILED; dispute resolve requires UNDER_REVIEW; signal actions require OPEN; investigation resolve requires OPEN)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "label account standing: signal escalation requires label_account.account_status == ACTIVE; consumption report acceptance requires provider.status == ACTIVE"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "POST /manipulation-signals/{id}/escalate, POST /consumption-reports/{id}/accept"
  - priority: 8
    category: business_temporal
    check: "week lock requires logical clock current time >= chart_week.closes_at"
    error_id: ERR_WEEK_NOT_CLOSED
    http_status: 409
    applies_to: "POST /chart-weeks/{id}/lock"
  - priority: 9
    category: business_temporal
    check: "compute requires the ACTIVE methodology version with effective_from <= chart_week.opens_at"
    error_id: ERR_NO_ACTIVE_METHODOLOGY
    http_status: 409
    applies_to: "POST /chart-weeks/{id}/compute"
  - priority: 10
    category: business_temporal
    check: "consumption report event_time must satisfy chart_week.opens_at <= event_time < chart_week.reporting_cutoff (half-open window against the possibly holiday-adjusted cutoff)"
    error_id: ERR_REPORTING_CUTOFF_PASSED
    http_status: 422
    applies_to: "POST /providers/{id}/reports, POST /consumption-reports/{id}/accept"
  - priority: 11
    category: business_temporal
    check: "chart week intervals of the same chart must not overlap: half-open [opens_at, closes_at) intervals; a new week whose opens_at equals an existing week's closes_at is adjacent and permitted; any strict overlap is rejected"
    error_id: ERR_WEEK_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /charts/{id}/weeks"
  - priority: 12
    category: business_temporal
    check: "title availability window: chart entry creation at compute requires title.availability_policy.available_from <= week.opens_at AND (available_until is null OR week.opens_at < available_until)"
    error_id: ERR_AVAILABILITY_WINDOW
    http_status: 422
    applies_to: "POST /chart-weeks/{id}/compute (per-title evaluation; offending titles are skipped, not erroring the whole compute)"
  - priority: 13
    category: business_constraint
    check: "report component_kind must be permitted by provider.feed_kind (SALES provider may only submit SALES; STREAM_ON_DEMAND may submit PAID or AD; STREAM_PROGRAMMED only STREAM_PROGRAMMED; AIRPLAY only AIRPLAY)"
    error_id: ERR_COMPONENT_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /providers/{id}/reports"
  - priority: 14
    category: business_constraint
    check: "duplicate file_fingerprint from the same provider is rejected as a re-delivered batch"
    error_id: ERR_DUPLICATE_REPORT_BATCH
    http_status: 409
    applies_to: "POST /providers/{id}/reports"
  - priority: 15
    category: business_constraint
    check: "genre chart admission: a title may only receive an entry on a GENRE chart when title.genre_tag == chart.genre_tag; on a MAIN chart no genre match is required; ALBUMS charts admit product_kind ALBUM only, SINGLES charts admit TRACK only"
    error_id: ERR_GENRE_MISMATCH
    http_status: 422
    applies_to: "POST /chart-weeks/{id}/compute (per-title evaluation)"
  - priority: 16
    category: business_constraint
    check: "genre dispute filing requires dispute.chart.chart_scope == GENRE and claimed_genre != title.genre_tag; filing label must be the title's owning label"
    error_id: ERR_DISPUTE_INVALID
    http_status: 422
    applies_to: "POST /genre-disputes"
  - priority: 17
    category: business_constraint
    check: "dispute reclassification requires payload.new_genre_tag == dispute.chart.genre_tag"
    error_id: ERR_RECLASSIFICATION_TARGET_MISMATCH
    http_status: 422
    applies_to: "POST /genre-disputes/{id}/resolve"
  - priority: 18
    category: business_constraint
    check: "at most one Investigation per ManipulationSignal"
    error_id: ERR_SIGNAL_ALREADY_ESCALATED
    http_status: 409
    applies_to: "POST /manipulation-signals/{id}/escalate"
  - priority: 19
    category: business_safety
    check: "segregation of duties: investigation.assigned_to must differ from the escalating ChartOps user's X-User-ID at escalate time, and the resolving Investigator's X-User-ID must equal investigation.assigned_to"
    error_id: ERR_DUTY_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "POST /manipulation-signals/{id}/escalate, POST /investigations/{id}/resolve"
  - priority: 20
    category: business_safety
    check: "title eligibility posture: compute skips titles with eligibility_posture == DISQUALIFIED; publish of a week containing an entry for a DISQUALIFIED title is rejected"
    error_id: ERR_TITLE_DISQUALIFIED
    http_status: 409
    applies_to: "POST /chart-weeks/{id}/publish, POST /chart-weeks/{id}/compute (per-title evaluation)"
  - priority: 21
    category: business_fiscal
    check: "price floor: at compute, a title is eligible only if title.base_price_cents >= PRICE_FLOOR_CENTS (global constant, 300 cents); boundary is inclusive (a title priced exactly at 300 cents passes)"
    error_id: ERR_PRICE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /chart-weeks/{id}/compute (per-title evaluation)"
  - priority: 22
    category: business_fiscal
    check: "release window: a title's first chart entry requires week.opens_at >= title.release_date"
    error_id: ERR_RELEASE_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /chart-weeks/{id}/compute (per-title evaluation)"
  - priority: 23
    category: business_constraint
    check: "sale batch channel: SaleBatch.title_product must have product_kind == ALBUM; TICKET_BUNDLE and MERCH_BUNDLE channels are recorded but never countable"
    error_id: ERR_BUNDLE_CHANNEL_INVALID
    http_status: 422
    applies_to: "POST /titles/{id}/sale-batches"
  - priority: 24
    category: business_constraint
    check: "holiday adjustment: new_reporting_cutoff must be < current reporting_cutoff and >= opens_at; only OPEN weeks may be adjusted"
    error_id: ERR_HOLIDAY_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /chart-weeks/{id}/holiday-adjust"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Startup default is exactly 2026-09-01T00:00:00Z before any set_current_utc call; the clock never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: [logical clock advanced; all subsequent time-based preconditions evaluate against this clock]

  - method: POST
    path: "/charts"
    description: "Create a chart"
    roles: [ChartManager]
    code: 201
    input: [chart_code, title, chart_kind, chart_scope, "genre_tag?", recurrent_rule_id]
    output: Chart
    side_effects: ["chart.version set to 1", "current_methodology_version_id null until first activation"]

  - method: GET
    path: "/charts"
    description: "List charts with pagination"
    roles: [PlatformAdmin, ChartManager, ChartOps, DataProvider, LabelRep, Investigator]
    code: 200
    input: ["limit?", "offset?", "current_methodology_version_id?"]
    output: "Chart[]"
    side_effects: []

  - method: GET
    path: "/charts/{id}"
    description: "Fetch one chart"
    roles: [PlatformAdmin, ChartManager, ChartOps, DataProvider, LabelRep, Investigator]
    code: 200
    input: []
    output: Chart
    side_effects: []

  - method: POST
    path: "/charts/{id}/methodology-versions"
    description: "Create a methodology revision (DRAFT) for the chart"
    roles: [ChartManager]
    code: 201
    input: [version_label, w_sales, w_on_demand, w_programmed, w_airplay, paid_stream_divisor, ad_stream_divisor, prog_stream_divisor, tea_rate, effective_from]
    output: MethodologyVersion
    side_effects: []

  - method: GET
    path: "/charts/{id}/methodology-versions"
    description: "List methodology versions of a chart"
    roles: [PlatformAdmin, ChartManager, ChartOps, DataProvider, LabelRep, Investigator]
    code: 200
    input: ["limit?", "offset?"]
    output: "MethodologyVersion[]"
    side_effects: []

  - method: POST
    path: "/charts/{id}/methodology-versions/{mid}/activate"
    description: "Activate a DRAFT or FROZEN methodology version; supersedes the prior ACTIVE version and invalidates COMPUTED weeks"
    roles: [ChartManager]
    code: 200
    input: [expected_chart_version]
    output: MethodologyVersion
    side_effects: ["increments Chart.version by 1", "prior ACTIVE version -> SUPERSEDED", "COMPUTED weeks -> LOCKED with entries reset"]

  - method: POST
    path: "/charts/{id}/freeze"
    description: "Freeze a chart: all methodology versions move to FROZEN, week transitions are blocked"
    roles: [ChartManager]
    code: 201
    input: [reason, expected_chart_version]
    output: ChartFreeze
    side_effects: ["all MethodologyVersion rows of the chart -> FROZEN", "increments Chart.version by 1"]

