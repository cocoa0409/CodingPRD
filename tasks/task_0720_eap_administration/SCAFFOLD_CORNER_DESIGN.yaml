# =============================================================================
# task_0720_eap_administration — §1.9 Scaffold Corner Design
# Breadth probe: enumerates testable claims from §1.1-§1.7 not covered by §1.8.
# Standard fixture literals match SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_contract_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.EmployerContract, endpoints]
        distinguishing_aspect: "POST /eap/contracts with required fields returns 201; status=ACTIVE, version=1, sessions_committed=0, utilization_rate=0, crisis_sla_minutes defaults to 15, reporting_min_cohort defaults to 5."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /eap/contracts"
              payload: { employer_name: "Acme2", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id, c_status: $.data.status, c_v: $.data.version }
          assert:
            - "response status 201"
            - "EmployerContract.${c_id}.status == ACTIVE"
            - "EmployerContract.${c_id}.version == 1"
            - "EmployerContract.${c_id}.sessions_committed == 0"
            - "EmployerContract.${c_id}.crisis_sla_minutes == 15"
            - "EmployerContract.${c_id}.reporting_min_cohort == 5"

      - name: get_contract_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.EmployerContract, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /eap/contracts/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /eap/contracts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_contract_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.EmployerContract, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /eap/contracts missing required session_rate_cents returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /eap/contracts"
              payload: { employer_name: "NoRate", sessions_per_issue: 2, annual_session_cap: 10, annual_reimbursement_budget_cents: 100000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_case_invalid_presenting_issue_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Case.fields.presenting_issue, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /eap/cases with presenting_issue not in the enum set returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Contract + published plan + employee exist."]
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "EnumCo", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std" }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl Q", external_ref: "EQ1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /eap/cases"
              payload: { contract_id: "${c_id}", employee_id: "${e_id}", presenting_issue: "NOT_A_REAL_ISSUE" }
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: list_contracts_pagination_envelope
        claim_type: Listing
        grounds: [entities.EmployerContract, response_envelope]
        distinguishing_aspect: "GET /eap/contracts returns response_type=array with pagination fields total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["Two contracts exist."]
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "L1", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000 }
              as: ProgramAdmin
            - call: "POST /eap/contracts"
              payload: { employer_name: "L2", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000 }
              as: ProgramAdmin
          trigger:
            - call: "GET /eap/contracts?limit=1&offset=0"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response status 200"
            - "response envelope response_type == array"
            - "data length == 1 and total_count == 2 and has_more == true"

      - name: utilization_report_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.UtilizationReport]
        distinguishing_aspect: "UtilizationReport has common_fields:false — it exposes id and created_at but no version field and has no update endpoint."
        test_recipe:
          setup: ["A built report exists for a contract with reporting_min_cohort=1."]
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "RepCo", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000, reporting_min_cohort: 1 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /eap/contracts/${c_id}/reports"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { rep_id: $.data.id }
          trigger:
            - call: "GET /eap/reports/${rep_id}"
              payload: {}
              as: ProgramAdmin
              captures: { rid: $.data.id }
          assert:
            - "response status 200"
            - "UtilizationReport.${rep_id} response data has no version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: claim_review_from_paid_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Claim, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A PAID claim is terminal; POST /eap/claims/{id}/review on it returns ERR_INVALID_STATE (409), no side effects."
        test_recipe:
          setup: ["A claim driven all the way to PAID."]
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "PaidCo", sessions_per_issue: 1, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std", copay_cents: 0 }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl Pd", external_ref: "EPD1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "Dr Pd", specialties: ["STRESS"] }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /eap/cases"
              payload: { contract_id: "${c_id}", employee_id: "${e_id}", presenting_issue: "STRESS" }
              as: CareCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /eap/cases/${case_id}/authorize"
              payload: { expected_contract_version: "${c_v}" }
              as: CareCoordinator
            - call: "POST /eap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-02T10:00:00Z" }
              as: CareCoordinator
              captures: { s1_id: $.data.id }
            - call: "POST /eap/sessions/${s1_id}/status"
              payload: { to_status: "COMPLETED" }
              as: Provider
            - call: "POST /eap/claims"
              payload: { contract_id: "${c_id}", session_id: "${s1_id}", billed_cents: 12000 }
              as: Provider
              captures: { claim_id: $.data.id }
            - call: "POST /eap/claims/${claim_id}/review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/claims/${claim_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/claims/${claim_id}/pay"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /eap/claims/${claim_id}/review"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Claim.${claim_id}.status == PAID"

      - name: referral_decline_then_reassign_excludes_decliner
        claim_type: Valid Transition
        grounds: [state_machines.Referral.DECLINED_to_REQUESTED, calculations.provider_selection]
        distinguishing_aspect: "After P1 declines, POST /eap/referrals/{id}/reassign selects a different eligible provider P2 (P1 excluded) and returns status REQUESTED."
        test_recipe:
          setup: ["Two eligible STRESS providers P1, P2. Referral auto-assigned to P1, then P1 declines."]
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "ReassignCo", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std", worklife_referrals_per_year: 5 }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl Ra", external_ref: "ERA1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "P1", network_status: "IN_NETWORK", specialties: ["STRESS"], accepting: true }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "P2", network_status: "IN_NETWORK", specialties: ["STRESS"], accepting: true }
              as: ProgramAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /eap/referrals"
              payload: { employee_id: "${e_id}", referral_type: "WORKLIFE", required_specialty: "STRESS" }
              as: CareCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /eap/referrals/${ref_id}/decline"
              payload: {}
              as: Provider
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /eap/referrals/${ref_id}/reassign"
              payload: {}
              as: CareCoordinator
              captures: { new_prov: $.data.provider_id, st: $.data.status }
          assert:
            - "Referral.${ref_id}.status == REQUESTED"
            - "Referral.${ref_id}.provider_id == ${p2_id}"
            - "Provider.${p2_id}.active_referral_count == 1"

      - name: crisis_resolve_escalatable_disposition_returns_not_resolvable
        claim_type: Precondition Enforcement
        grounds: [state_machines.CrisisContact.TRIAGED_to_RESOLVED, "errors[ERR_DISPOSITION_NOT_RESOLVABLE]"]
        distinguishing_aspect: "A TRIAGED contact with disposition EMERGENCY_DISPATCH cannot be directly resolved; POST /eap/crisis-contacts/{id}/resolve returns ERR_DISPOSITION_NOT_RESOLVABLE (409)."
        test_recipe:
          setup: ["Crisis contact triaged with EMERGENCY_DISPATCH disposition (severity HIGH, not IMMINENT)."]
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "CrisisCo", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000, crisis_sla_minutes: 15 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /eap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eap/crisis-contacts"
              payload: { contract_id: "${c_id}", severity: "HIGH" }
              as: CrisisCounselor
              captures: { cc_id: $.data.id }
            - call: "POST /eap/crisis-contacts/${cc_id}/triage"
              payload: { disposition: "EMERGENCY_DISPATCH" }
              as: CrisisCounselor
          trigger:
            - call: "POST /eap/crisis-contacts/${cc_id}/resolve"
              payload: {}
              as: CrisisCounselor
              captures: { err: $.data.error_id }
          assert:
            - "response status 409"
            - "data.error_id == ERR_DISPOSITION_NOT_RESOLVABLE"

      - name: crisis_imminent_resolve_blocked_requires_escalation
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=9]", "errors[ERR_IMMINENT_REQUIRES_ESCALATION]", state_machines.CrisisContact.TRIAGED_to_RESOLVED]
        distinguishing_aspect: "An IMMINENT-severity contact triaged ROUTINE_REFERRAL still cannot resolve directly: ERR_IMMINENT_REQUIRES_ESCALATION (409, priority 9) fires before the disposition check."
        test_recipe:
          setup: ["IMMINENT crisis contact triaged with ROUTINE_REFERRAL."]
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "ImmCo", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000, crisis_sla_minutes: 15 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /eap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eap/crisis-contacts"
              payload: { contract_id: "${c_id}", severity: "IMMINENT" }
              as: CrisisCounselor
              captures: { cc_id: $.data.id }
            - call: "POST /eap/crisis-contacts/${cc_id}/triage"
              payload: { disposition: "ROUTINE_REFERRAL" }
              as: CrisisCounselor
          trigger:
            - call: "POST /eap/crisis-contacts/${cc_id}/resolve"
              payload: {}
              as: CrisisCounselor
              captures: { err: $.data.error_id }
          assert:
            - "response status 409"
            - "data.error_id == ERR_IMMINENT_REQUIRES_ESCALATION"

      - name: case_close_with_scheduled_session_returns_open_sessions
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Case.clinical_status=OPEN_to_clinical_status=CLOSED", "errors[ERR_CASE_HAS_OPEN_SESSIONS]"]
        distinguishing_aspect: "Closing a case that still has a SCHEDULED session returns ERR_CASE_HAS_OPEN_SESSIONS (409); clinical_status stays OPEN."
        test_recipe:
          setup: ["Authorized case with one SCHEDULED (not completed) session."]
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "CloseCo", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std" }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl Cl", external_ref: "ECL1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "Dr Cl", specialties: ["STRESS"] }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /eap/cases"
              payload: { contract_id: "${c_id}", employee_id: "${e_id}", presenting_issue: "STRESS" }
              as: CareCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /eap/cases/${case_id}/authorize"
              payload: { expected_contract_version: "${c_v}" }
              as: CareCoordinator
            - call: "POST /eap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-02T10:00:00Z" }
              as: CareCoordinator
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /eap/cases/${case_id}/close"
              payload: {}
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status 409"
            - "data.error_id == ERR_CASE_HAS_OPEN_SESSIONS"
            - "Case.${case_id}.clinical_status == OPEN"

      - name: contract_reinstate_does_not_restore_revoked_cases
        claim_type: Compensation
        grounds: [state_machines.EmployerContract.SUSPENDED_to_ACTIVE, "state_machines.Case.funding_status=AUTHORIZED_to_funding_status=REVOKED"]
        distinguishing_aspect: "After suspend revokes an authorized case, reinstating the contract returns status ACTIVE but the case stays funding_status=REVOKED (revocation is permanent)."
        test_recipe:
          setup: ["Active contract with one authorized case; contract suspended (case revoked)."]
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "ReinCo", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std" }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl Re", external_ref: "ERE1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/cases"
              payload: { contract_id: "${c_id}", employee_id: "${e_id}", presenting_issue: "STRESS" }
              as: CareCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /eap/cases/${case_id}/authorize"
              payload: { expected_contract_version: "${c_v}" }
              as: CareCoordinator
            - call: "GET /eap/contracts/${c_id}"
              payload: {}
              as: ProgramAdmin
              captures: { c_v2: $.data.version }
            - call: "POST /eap/contracts/${c_id}/suspend"
              payload: { expected_contract_version: "${c_v2}" }
              as: ProgramAdmin
              captures: { c_v3: $.data.version }
          trigger:
            - call: "POST /eap/contracts/${c_id}/reinstate"
              payload: { expected_contract_version: "${c_v3}" }
              as: ProgramAdmin
              captures: { st: $.data.status }
          assert:
            - "EmployerContract.${c_id}.status == ACTIVE"
            - "Case.${case_id}.funding_status == REVOKED"

      - name: error_case_parallel_exhausted_already_covered
        claim_type: Valid Transition
        grounds: ["state_machines.Case.funding_status=AUTHORIZED_to_funding_status=EXHAUSTED"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / case_parallel_dimensions_evolve_independently
          rationale: "The AUTHORIZED->EXHAUSTED funding transition and its parallelism with clinical_status are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: claim_out_of_network_provisional_uses_70pct_factor
        claim_type: Correct Result
        grounds: [calculations.claim_provisional_reimbursement, entities.Provider.fields.network_status]
        distinguishing_aspect: "OUT_OF_NETWORK provider: base = floor(12000*7/10)=8400; billed 15000 capped to 8400; minus copay 2000 => provisional_cents == 6400."
        test_recipe:
          setup: ["Completed session delivered by an OUT_OF_NETWORK provider; plan copay 2000."]
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "OonCo", sessions_per_issue: 1, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std", copay_cents: 2000 }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl Oo", external_ref: "EOO1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "Dr Oon", network_status: "OUT_OF_NETWORK", specialties: ["STRESS"] }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /eap/cases"
              payload: { contract_id: "${c_id}", employee_id: "${e_id}", presenting_issue: "STRESS" }
              as: CareCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /eap/cases/${case_id}/authorize"
              payload: { expected_contract_version: "${c_v}" }
              as: CareCoordinator
            - call: "POST /eap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-02T10:00:00Z" }
              as: CareCoordinator
              captures: { s1_id: $.data.id }
            - call: "POST /eap/sessions/${s1_id}/status"
              payload: { to_status: "COMPLETED" }
              as: Provider
          trigger:
            - call: "POST /eap/claims"
              payload: { contract_id: "${c_id}", session_id: "${s1_id}", billed_cents: 15000 }
              as: Provider
              captures: { prov_cents: $.data.provisional_cents }
          assert:
            - "Claim.provisional_cents == 6400"

      - name: report_cell_suppression_below_k_cohort
        claim_type: Correct Result
        grounds: [calculations.report_issue_breakdown, entities.UtilizationReport.fields.issue_breakdown]
        distinguishing_aspect: "With reporting_min_cohort=2, a window with 3 distinct employees (report passes) but only 1 employee on GRIEF marks the GRIEF cell -1 while STRESS (2 employees) shows its true count."
        test_recipe:
          setup: ["Contract reporting_min_cohort=2; cases: 2 distinct employees with STRESS, 1 employee with GRIEF (3 distinct total)."]
          setup_api_calls:
            - call: "POST /eap/contracts"
