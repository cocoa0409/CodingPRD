      - name: campaign_window_and_runnability_errors_are_triggerable
        claim_type: error_triggerability
        grounds:
          - errors.ERR_INVALID_TIME_WINDOW
          - errors.ERR_CAMPAIGN_NOT_RUNNABLE
          - state_machines.MarkdownCampaign[SCHEDULED -> CLOSED]
        distinguishing_aspect: "A window ending at 12:00 is refused as not a whole number of days even though window_end_at is strictly after window_start_at; a run before window_start_at is refused; but a run at exactly window_end_at is legal and closes the campaign — only the run after that is refused. The same error id therefore covers a too-early run and a run on a CLOSED campaign, and never a run at the boundary."
        test_recipe:
          setup:
            - "One ACTIVE channel exists and no campaign has been created yet; the logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /recommerce/channels"
              payload: { code: "RESALE-MP", channel_type: "RESALE_MARKETPLACE", allowed_assortment: "RESALE_ONLY", max_resale_price_ratio_bp: 7000, region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { chan_id: "$.data.id" }
          trigger:
            - call: "POST /recommerce/markdown-campaigns"
              payload: { channel_id: "${chan_id}", product_category: "OUTERWEAR", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-09-15T12:00:00Z", cadence_days: 7, step_bp: 1500, floor_pct_bp: 6000 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { e_window: "$.data.error_id" }
            - call: "POST /recommerce/markdown-campaigns"
              payload: { channel_id: "${chan_id}", product_category: "OUTERWEAR", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-09-15T00:00:00Z", cadence_days: 7, step_bp: 1500, floor_pct_bp: 6000 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { camp_id: "$.data.id", camp_status: "$.data.status", camp_runs: "$.data.run_count", camp_last: "$.data.last_run_at" }
            - call: "POST /recommerce/markdown-campaigns/${camp_id}/cadence-runs"
              payload: {}
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { e_early: "$.data.error_id" }
            - call: "POST /recommerce/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/markdown-campaigns/${camp_id}/cadence-runs"
              payload: {}
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { seq: "$.data.run_sequence_no", evaluated: "$.data.evaluated_unit_count", marked: "$.data.marked_down_unit_count", total_md: "$.data.total_markdown_minor" }
            - call: "GET /recommerce/markdown-campaigns/${camp_id}"
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { closed_status: "$.data.status", closed_runs: "$.data.run_count", closed_last: "$.data.last_run_at" }
            - call: "POST /recommerce/markdown-campaigns/${camp_id}/cadence-runs"
              payload: {}
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { e_closed: "$.data.error_id" }
            - call: "GET /recommerce/markdown-campaigns/${camp_id}"
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { final_runs: "$.data.run_count", final_last: "$.data.last_run_at" }
          assert:
            - "${e_window} == ERR_INVALID_TIME_WINDOW with HTTP 422 — [2026-09-01T00:00:00Z, 2026-09-15T12:00:00Z) is 14.5 days, not a whole number of days"
            - "the whole-day campaign returns 201 with ${camp_status} == SCHEDULED, ${camp_runs} == 0 and ${camp_last} == null"
            - "${e_early} == ERR_CAMPAIGN_NOT_RUNNABLE with HTTP 409 at 2026-08-01 — strictly before window_start_at"
            - "the run at exactly window_end_at returns 200 with ${seq} == 1, ${evaluated} == 0, ${marked} == 0 and ${total_md} == 0"
            - "${closed_status} == CLOSED, ${closed_runs} == 1 and ${closed_last} == 2026-09-15T00:00:00Z — the boundary run counts and closes"
            - "${e_closed} == ERR_CAMPAIGN_NOT_RUNNABLE with HTTP 409 on the CLOSED campaign"
            - "${final_runs} == 1 and ${final_last} == 2026-09-15T00:00:00Z — the refused run incremented nothing"

      - name: report_overlap_publication_and_restatement_errors_are_triggerable
