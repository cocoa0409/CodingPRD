              payload: {}
              as: Landlord
              as_user_id: "${landlord12_id}"
            - call: "POST /hcv/contracts/${contractC_id}/activate"
              payload: {}
              as: HousingAuthorityAdmin
            - call: "POST /hcv/contracts/${contractC_id}/inspections"
              payload: { inspection_type: "ANNUAL", scheduled_date: "2026-08-05" }
