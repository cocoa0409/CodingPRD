        claim_type: optimistic_concurrency
        grounds: [entities.Facility.fields.acceptance_posture, state_machines.Ticket.INSPECTED_to_POSTED]
        distinguishing_aspect: "A successful post with the correct expected_facility_version advances Facility.version by exactly 1 (from ${fac_v} to fac_v+1)."
        test_recipe:
