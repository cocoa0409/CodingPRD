              captures: { inm: $.data.id }
            - call: "POST /inmates/${inm}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 600, memo: "commissary deposit" }
              as: HealthServicesAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates/${inm}/copay-charges"
              payload: { encounter_type: "SICK_CALL" }
              as: HealthServicesAdmin
              captures: { chg: $.data.id }
            - call: "POST /inmates/${inm}/grievances"
              payload: { grievance_text: "co-pay charged for a nurse-initiated visit", grieved_event_at: "2026-05-02T00:00:00Z", subject_copay_charge_id: "${chg}" }
              as: Inmate
              as_user_id: "${inm}"
              captures: { grv: $.data.id }
            - call: "POST /grievances/${grv}/accept"
              payload: {}
              as: GrievanceCoordinator
              as_user_id: "u-gc-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /grievances/${grv}/decide"
              payload: { outcome: "GRANTED" }
              as: GrievanceCoordinator
              as_user_id: "u-gc-1"
          assert:
            - "L1 Grievance.${grv}.status == DECIDED and Grievance.${grv}.outcome == GRANTED"
            - "L2 CopayCharge.${chg}.status == REVERSED and CopayCharge.${chg}.reversal_grievance_id == ${grv}"
            - "L3 a LedgerEntry exists for ${inm} with entry_type == REVERSAL, amount_cents == 500 and source_copay_charge_id == ${chg}"
            - "L4 Inmate.${inm}.account_balance_cents == 600"
            - "L5 Inmate.${inm}.indigent_flag == false"
            - "The inmate has exactly 3 LedgerEntry rows and their amount_cents sum to 600"

      - name: transport_no_show_depth3_referral_cap_cancel
        grounds:
          - state_machines.TransportOrder.DISPATCHED_to_NO_SHOW
          - state_machines.SpecialtyReferral.SCHEDULED_to_AUTHORIZED
