            - { call: "POST /servicing/loans", payload: { loan_number: "LN-RBAC-1", borrower_name: "Role Denied", principal_balance_cents: 22000000, monthly_pi_cents: 140000, closing_date: "2026-07-01", escrow_required: false }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
