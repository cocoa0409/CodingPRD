          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Confirm is exclusive to CategoryManager; the owning Retailer calling it gets 403 ERR_UNAUTHORIZED at priority 2 — before any state or shelf-cap check."
        test_recipe:
          setup:
