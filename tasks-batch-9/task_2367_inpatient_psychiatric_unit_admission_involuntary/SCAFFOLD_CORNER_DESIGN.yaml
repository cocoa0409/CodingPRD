      - name: unit_posture_re_derived_from_child_bed_status_changes
        claim_type: side_effect
        grounds:
          - state_machines.Unit.transitions
          - calculations.unit_posture_and_effective_availability
          - endpoints[PATCH /behavioral-health/beds/{id}]
        distinguishing_aspect: "Unit posture is a compound state derived from its Bed children and re-derived on every child change, and the derivation is not monotone in bed count: taking beds out of service walks a five-STANDARD-bed unit OPEN 5 -> OPEN 2 -> RESTRICTED with effective 0 -> CLOSED, because restricted_threshold is max(1, floor(licensed * 0.20)) and the AVAILABLE SECLUSION bed never counts."
        test_recipe:
          setup:
            - "One charge nurse; clock set to 2026-09-03T08:00:00Z."
