            - "GET /fleet/markets/${mkt_atl} reports in_service_unit_count back to 0: the consignment decremented the census"

      - name: unknown_vehicle_path_id_returns_404_before_the_market_scope_check
        claim_type: cascading_validation
        grounds:
          - validations[priority 4 ERR_MARKET_SCOPE_VIOLATION]
          - validations[priority 5 ERR_MARKET_NOT_FOUND]
        distinguishing_aspect: "Priority 4's scope check is explicitly documented as running AFTER existence so the market can be resolved, so an operator from the wrong market hitting an unknown vehicle id must see the 404, not the 403 - the ordering is observable only when both checks would fail."
        test_recipe:
          setup:
            - "Two markets, ATL and DFW. No vehicle exists at all."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
            - call: "POST /fleet/markets"
              payload: { code: "DFW", name: "Dallas", region: "CENTRAL", transport_hub_distance_km: 35, transfer_cost_per_km_cents: 300, storage_cost_per_day_cents: 700, prep_capacity_per_day: 4, registration_lead_days: 2 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_dfw: $.data.id }
          trigger:
            - call: "POST /fleet/vehicles/00000000-0000-4000-8000-0000000000aa/usage"
              payload: { odometer_km: 100, rented_days_delta: 1, available_days_delta: 1, revenue_cents_delta: 5500 }
              as: MarketOperator
              as_user_id: "${mkt_dfw}"
              captures: { order_error: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_VEHICLE_NOT_FOUND\""
            - "the response is NOT 403 ERR_MARKET_SCOPE_VIOLATION even though the DFW operator could not have touched any ATL vehicle"
            - "no Vehicle row and no LedgerEntry row is created"

      - name: priority_ordering_between_two_simultaneously_violated_rules
        excluded_because:
          difficulty_instance: stale_plan_version_outranks_frozen_posture_on_allocation_create
          rationale: "The `Priority Ordering` claim and the `Priority conflict` pattern are both covered by §1.8's dedicated rule: that instance violates priority 8 and priority 26 in one request and asserts the priority-8 error, and prep_sequence_temporal_outranks_prep_daily_capacity_constraint does the same for the 15/22 pair."

      - name: cross_entity_validation_depends_on_another_entity_state
        excluded_because:
          difficulty_instance: redistribution_depart_blocked_by_suspended_destination_market
          rationale: "The `Cross-entity validation` pattern - validity depends on the state of a different entity, tested both valid and invalid - is covered there for the destination market, and vehicle_in_fleet_blocked_by_grandparent_plan_not_locked covers the two-hop variant."

      - name: temporal_validation_detects_a_future_conflict
        excluded_because:
          difficulty_instance: vehicle_transfer_windows_half_open_adjacency_allowed
          rationale: "The `Temporal validation` pattern - an operation that is valid now but creates a future conflict - is exactly that instance: each transfer window is individually legal and the conflict exists only between the two windows, with the half-open boundary making touching endpoints legal."

      - name: aggregate_validation_over_individually_valid_rows
        excluded_because:
          difficulty_instance: prep_sequence_temporal_outranks_prep_daily_capacity_constraint
          rationale: "The `Aggregate validation` pattern - each row individually valid but the collective exceeding a limit - is covered there through ERR_PREP_CAPACITY_EXCEEDED: every PREPARATION task fits a free bay, yet the third one on the same calendar date breaches Market.prep_capacity_per_day."

  # ===========================================================================
  # §1.5 has no bulk endpoint, so the guide's `Bulk action` row has no instance.
  - section: endpoints
    instances:

      - name: vehicle_segment_create_read_list_round_trip_with_no_write_surface
        claim_type: standard_crud
        grounds:
          - endpoints[POST /fleet/vehicle-segments]
          - endpoints[GET /fleet/vehicle-segments/{segment_id}]
          - endpoints[GET /fleet/vehicle-segments]
        distinguishing_aspect: "VehicleSegment is the cleanest CRUD triple in the scaffold and it deliberately stops at C-R-L: §1.5 declares no PATCH and no DELETE for any of the thirteen entities, so the U and D halves of standard CRUD must be absent rather than merely unused."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /fleet/vehicle-segments"
              payload: { code: "MIDSIZE", name: "Midsize sedan", baseline_daily_rate_cents: 5500, target_utilization_pct: 0.80, target_revenue_per_unit_month_cents: 132000, mileage_band_soft_limit_km: 40000, mileage_band_hard_limit_km: 60000, recondition_cap_cents: 90000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { seg_mid: $.data.id }
            - call: "GET /fleet/vehicle-segments/${seg_mid}"
              payload: {}
              as: RemarketingManager
              as_user_id: "u-rm-1"
            - call: "GET /fleet/vehicle-segments"
              payload: { code: "MIDSIZE", limit: 10, offset: 0 }
              as: RemarketingManager
              as_user_id: "u-rm-1"
          assert:
            - "the create returns HTTP 201 with version 1 and all eight input fields echoed, including target_utilization_pct 0.80 as a number rather than a string"
            - "the single read returns HTTP 200 with an identical body"
            - "the filtered list returns total_count 1 with data[0].id == \"${seg_mid}\""
            - "§1.5 declares exactly these three VehicleSegment endpoints: there is no PATCH /fleet/vehicle-segments/{segment_id} and no DELETE, so a segment's economics are immutable once published"

