  - rule_id: non_linear_state_machine
    instances:

      - name: report_rejection_revision_cycle_returns_to_draft_then_accepts
        grounds:
          - state_machines.TransactionDayReport.UNDER_AUDIT_to_REJECTED
          - state_machines.TransactionDayReport.REJECTED_to_DRAFT
          - state_machines.TransactionDayReport.DRAFT_to_SUBMITTED
          - entities.TransactionDayReport.fields.submission_count
          - entities.TransactionDayReport.fields.rejection_reason
        distinguishing_aspect: |
          Non-linearity type: CYCLE on TransactionDayReport. The row travels
          DRAFT -> SUBMITTED -> UNDER_AUDIT -> REJECTED -> DRAFT -> SUBMITTED ->
          UNDER_AUDIT -> ACCEPTED, revisiting DRAFT and SUBMITTED, and ends with
          submission_count == 2 and rejection_reason back to null.
        test_recipe:
          setup:
            - "One facility, one ACTIVE agreement."
            - "A 2026-04 report has been submitted once, audited, rejected for understated days, reopened to DRAFT, resubmitted with corrected figures and re-opened for audit."
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100, overflow_daily_surcharge_cents: 400, remittance_grace_days: 20 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Rent A Car", brand_code: "AVX", contact_email: "ops@avex.example" }
              as: FacilityAdmin
              captures: { conc_a_id: $.data.id }
            - call: "POST /rac/concession-agreements"
              payload: { facility_id: "${fac_id}", concessionaire_id: "${conc_a_id}", contract_year_index: 1, term_start_date: "2026-01-01", term_end_date: "2026-12-31", mag_annual_cents: 12000000, percentage_rent_rate_bps: 1000, rent_settlement_basis: "CUMULATIVE_YTD" }
              as: FacilityAdmin
              captures: { agr_a_id: $.data.id }
            - call: "POST /rac/concession-agreements/${agr_a_id}/execute"
              payload: {}
              as: FacilityAdmin
            - call: "POST /rac/transaction-day-reports"
              payload: { agreement_id: "${agr_a_id}", period_year: 2026, period_month: 4, reported_gross_revenue_cents: 3000000, reported_on_airport_transaction_days: 900 }
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /rac/transaction-day-reports/${rep_id}/submit"
              payload: {}
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
            - call: "POST /rac/transaction-day-reports/${rep_id}/begin-audit"
              payload: {}
              as: AuditOfficer
              as_user_id: "aud-1"
            - call: "POST /rac/transaction-day-reports/${rep_id}/reject"
              payload: { rejection_reason: "Understated on-airport transaction days" }
              as: AuditOfficer
              as_user_id: "aud-1"
            - call: "POST /rac/transaction-day-reports/${rep_id}/reopen"
              payload: {}
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
            - call: "POST /rac/transaction-day-reports/${rep_id}/submit"
              payload: {}
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
            - call: "POST /rac/transaction-day-reports/${rep_id}/begin-audit"
              payload: {}
              as: AuditOfficer
              as_user_id: "aud-1"
          trigger:
            - call: "POST /rac/transaction-day-reports/${rep_id}/accept"
              payload: { audited_gross_revenue_cents: 3000000, audited_on_airport_transaction_days: 1200 }
              as: AuditOfficer
              as_user_id: "aud-1"
          assert:
            - "TransactionDayReport.${rep_id}.status == ACCEPTED"
            - "TransactionDayReport.${rep_id}.submission_count == 2"
            - "TransactionDayReport.${rep_id}.rejection_reason == null"
            - "TransactionDayReport.${rep_id}.audited_on_airport_transaction_days == 1200"
            - "TransactionDayReport.${rep_id}.revenue_variance_cents == 0"
            - "TransactionDayReport.${rep_id}.variance_assessment_cents == 0"
            - "ConcessionAgreement.${agr_a_id}.transaction_days_ytd == 1200"
            - "ConcessionAgreement.${agr_a_id}.compliance_status == COMPLIANT"

      - name: agreement_contract_and_compliance_axes_advance_independently
        grounds:
          - state_machines.ConcessionAgreement.ACTIVE_to_SUSPENDED
          - state_machines.ConcessionAgreement.SUSPENDED_to_ACTIVE
          - state_machines.ConcessionAgreement.COMPLIANT_to_COVENANT_BREACH
          - entities.ConcessionAgreement.fields.contract_status
          - entities.ConcessionAgreement.fields.compliance_status
        distinguishing_aspect: |
          Non-linearity type: TWO INDEPENDENT STATUS AXES on one ConcessionAgreement
          row (a different entity from the cyclic TransactionDayReport). The audit
          acceptance drives compliance_status COMPLIANT -> COVENANT_BREACH without
          touching contract_status, and the subsequent reinstate drives
          contract_status SUSPENDED -> ACTIVE while compliance_status stays
          COVENANT_BREACH.
        test_recipe:
          setup:
            - "One facility, one agreement executed to ACTIVE with compliance_status COMPLIANT."
            - "A 2026-05 report reporting 4,000,000 cents gross is UNDER_AUDIT."
            - "The agreement has then been suspended, so contract_status is SUSPENDED while compliance_status is still COMPLIANT."
