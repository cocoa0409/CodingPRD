            - "AdministrationRecord.${adm_id}.administering_nurse_id == ${rn_id}"
            - "AdministrationRecord.${adm_id}.protocol_mode == AUTHORIZED"
            - "AdministrationRecord.${adm_id}.medication_code == ALBUTEROL and dose_amount == 2"
            - "Filter by visit_id: total_count == 1 and data[0].id == ${adm_id}"
            - "Filter by authorization_id: total_count == 1 and data[0].id == ${adm_id}"
            - "Filter by lot_id: total_count == 1 and data[0].id == ${adm_id}"
            - "Filter by administering_nurse_id: total_count == 1 and data[0].id == ${adm_id}"

  - section: rbac
    instances:

      - name: request_without_role_header_returns_unauthenticated
        claim_type: denied_operation
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: "Priority 1 fires before every other row: a POST /health-office/schools carrying no X-User-Role header returns 401 ERR_UNAUTHENTICATED and creates no School, even though the payload itself is perfectly valid."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Anchor Elementary", building_code: "ANC61", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { existing_sch_id: $.data.id }
          trigger:
            - call: "POST /health-office/schools"
              payload: { name: "Ghost Elementary", building_code: "GST61", cot_capacity: 2, emergency_protocol_enabled: true }
              captures: { err: $.data.error_id }
          assert:
            - "The trigger is sent with neither X-User-Role nor X-User-ID"
            - "HTTP status == 401"
            - "data.error_id == ERR_UNAUTHENTICATED"
            - "No School row with building_code GST61 exists afterwards"

      - name: guardian_cannot_create_a_school_returns_forbidden
        claim_type: denied_operation
        grounds:
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles.Guardian
          - roles.DistrictHealthAdmin
        distinguishing_aspect: "POST /health-office/schools lists only DistrictHealthAdmin, so a Guardian calling it is refused with 403 ERR_ROLE_NOT_PERMITTED at priority 2, before any existence or payload row runs."
        test_recipe:
          setup: ["One School and one ENROLLED student whose id doubles as the Guardian's X-User-ID."]
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Beacon Elementary", building_code: "BCN62", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Bo Iversen", grade_level: 3, date_of_birth: "2017-05-05T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /health-office/schools"
              payload: { name: "Guardian Annex", building_code: "GRD62", cot_capacity: 2, emergency_protocol_enabled: true }
              as: Guardian
              as_user_id: "${stu_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "No School row with building_code GRD62 exists afterwards"

      - name: guardian_cannot_consent_on_another_students_order
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.Guardian
          - state_machines.MedicationAuthorization.CONSENT_PENDING_to_CONSENT_GRANTED
        distinguishing_aspect: "Guardian identity is entity_backed:Student, so consenting on an order whose student_id differs from X-User-ID is refused with 403 ERR_NOT_RESOURCE_OWNER and the order stays CONSENT_PENDING."
        test_recipe:
          setup:
            - "School CANDLE63 with one RN and two ENROLLED students, A and B."
            - "One ALBUTEROL order for student B, still at (CONSENT_PENDING, UNVERIFIED)."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Candlewood Elementary", building_code: "CDL63", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Cass Ahmed", grade_level: 4, date_of_birth: "2016-06-06T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_a_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Cleo Ahmed", grade_level: 6, date_of_birth: "2014-06-06T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: ["ASTHMA"], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_b_id: $.data.id }
            - call: "POST /health-office/medication-authorizations"
              payload: { student_id: "${stu_b_id}", medication_code: "ALBUTEROL", route: "INHALED", dose_amount: 2, dose_unit: "PUFF", schedule_type: "SCHEDULED", max_doses_per_day: 2, valid_from: "2026-07-01T00:00:00Z", valid_until: "2027-06-30T00:00:00Z" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { auth_b_id: $.data.id }
          trigger:
            - call: "POST /health-office/medication-authorizations/${auth_b_id}/consent"
              payload: { decision: "GRANT" }
              as: Guardian
              as_user_id: "${stu_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "MedicationAuthorization.${auth_b_id}.consent_status == CONSENT_PENDING"
            - "MedicationAuthorization.${auth_b_id}.clinical_status == UNVERIFIED"
            - "MedicationAuthorization.${auth_b_id}.dispensable == false"

      - name: health_aide_cannot_reopen_a_closed_encounter
        claim_type: denied_operation
        grounds:
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles.HealthAide
          - roles.SchoolNurse
          - endpoints[POST /health-office/health-visits/{id}/reopen]
        distinguishing_aspect: "reopen is a SchoolNurse-exclusive operation, so a HealthAide calling it is refused with 403 ERR_ROLE_NOT_PERMITTED at priority 2 — before the reopen-window and reopen-count rows are even evaluated — and reopen_count stays 0."
        test_recipe:
          setup:
            - "School DRIFT64 with an RN on an ACTIVE Monday block, one delegated HEALTH_AIDE nurse row and one ENROLLED student."
            - "Clock at 2026-08-03T09:00:00Z, an RN-owned encounter driven to CLOSED, then clock at 2026-08-03T09:30:00Z (well inside the 120-minute reopen window)."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Driftwood Elementary", building_code: "DRF64", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Dee Aponte", credential: "HEALTH_AIDE", weekly_contracted_minutes: 900, delegation_authorized: true }
              as: DistrictHealthAdmin
              captures: { aide_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Dax Miller", grade_level: 2, date_of_birth: "2018-07-07T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: DistrictHealthAdmin
            - call: "POST /health-office/health-visits"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", nurse_id: "${rn_id}", complaint_code: "INJURY", acuity: "ROUTINE" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /health-office/health-visits/${visit_id}/assess"
              payload: { assessment_note: "Ice pack applied" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
            - call: "POST /health-office/health-visits/${visit_id}/dispose"
              payload: { disposition: "RETURN_TO_CLASS" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:30:00Z" }
              as: DistrictHealthAdmin
            - call: "POST /health-office/health-visits/${visit_id}/close"
