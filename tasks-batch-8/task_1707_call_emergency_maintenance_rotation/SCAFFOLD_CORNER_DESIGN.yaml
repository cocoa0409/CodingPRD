            - { call: "POST /v1/technicians", payload: { full_name: "Terry Two", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t2: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "R-6", building_code: "BR" }, as: PropertyAdmin, captures: { u: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-03T08:00:00Z" }, as: PropertyAdmin, captures: { sh1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t2}", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-03T08:00:00Z" }, as: PropertyAdmin, captures: { sh2: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh1}/start", as: PropertyAdmin }
            - { call: "POST /v1/rotation-shifts/${sh2}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "A", caller_phone: "555", category: "NO_POWER", description: "outage" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
          trigger:
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t2}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_NOT_ASSIGNED_TECHNICIAN (403); ticket stays DISPATCHED"]

      - name: supervisor_capability_gate_enforced
        claim_type: role_permission
        grounds: [roles.MaintenanceSupervisor, "errors[ERR_NOT_SUPERVISOR_CAPABLE]", entities.Technician.fields.capability]
        distinguishing_aspect: "The MaintenanceSupervisor role header is not enough — X-User-ID must resolve to a Technician with capability SUPERVISOR."
        test_recipe:
          setup: ["mitigated ticket + WO; T1 has capability TECHNICIAN only"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "R-7", building_code: "BR" }, as: PropertyAdmin, captures: { u: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-03T08:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "A", caller_phone: "555", category: "LEAK_MINOR", description: "leak" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/call-tickets/${tk}/mitigate", payload: { mitigation_notes: "done", unit_uninhabitable: false }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "GET /v1/work-orders?call_ticket_id=${tk}", as: Dispatcher, captures: { wo: "$.data[0].id" } }
          trigger:
            - { call: "POST /v1/work-orders/${wo}/assign", payload: { technician_id: "${t1}" }, as: MaintenanceSupervisor, as_user_id: "${t1}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_NOT_SUPERVISOR_CAPABLE (403) — technician-capability id under a supervisor role header"]

      - name: vendor_cannot_read_unit
        claim_type: role_permission
        grounds: [roles.Vendor, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Vendor is deliberately excluded from unit reads (read surface is role-scoped, not all-authenticated)."
        test_recipe:
          setup: ["unit + vendor exist"]
          setup_api_calls:
            - { call: "POST /v1/units", payload: { unit_number: "R-8", building_code: "BR" }, as: PropertyAdmin, captures: { u: $.data.id } }
            - { call: "POST /v1/vendors", payload: { name: "NoseyCo", trade: "GENERAL", per_incident_limit_cents: 100000 }, as: PropertyAdmin, captures: { v1: $.data.id } }
          trigger:
            - { call: "GET /v1/units/${u}", as: Vendor, as_user_id: "${v1}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_FORBIDDEN_ROLE (403)"]

  # ---------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_dispatch_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[dispatch-stale-call-ticket]", "errors[ERR_STALE_CALL_TICKET_VERSION]"]
        distinguishing_aspect: "From ESCALATED the state precondition still passes, so only the version check discriminates: re-dispatch carrying the pre-dispatch version is rejected 412; carrying the current version succeeds."
        test_recipe:
          setup: ["T1 on ACTIVE shift; ticket TRIAGED then dispatched (version advanced), then escalated (version advanced again)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "L-1", building_code: "BL" }, as: PropertyAdmin, captures: { u: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-03T08:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "A", caller_phone: "555", category: "NO_POWER", description: "outage" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { v_stale: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${v_stale}" }, as: Dispatcher }
            - { call: "POST /v1/call-tickets/${tk}/escalate", as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { v_fresh: $.data.version } }
          trigger:
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${v_stale}" }, as: Dispatcher, captures: { err: $.data.error_id } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${v_fresh}" }, as: Dispatcher, captures: { st: $.data.status, vnow: $.data.version } }
          assert:
            - "stale re-dispatch: 412 ERR_STALE_CALL_TICKET_VERSION"
            - "fresh re-dispatch: 200, status == DISPATCHED, version incremented above ${v_fresh}"

      - name: occ_transfer_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[transfer-stale-rotation-shift]", "errors[ERR_STALE_ROTATION_SHIFT_VERSION]"]
        distinguishing_aspect: "Transfer keeps the shift PUBLISHED, so the state check cannot distinguish a stale writer; only expected_rotation_shift_version does (412), and the current version then succeeds."
        test_recipe:
          setup: ["T1/T2/T3 technicians; shift S PUBLISHED for T1, version captured at creation"]
          setup_api_calls:
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Terry Two", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t2: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Tom Three", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t3: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-05T08:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /v1/rotation-shifts/${sh}/transfer", payload: { to_technician_id: "${t2}", expected_rotation_shift_version: "${v1}" }, as: PropertyAdmin, captures: { v2: $.data.version } }
            - { call: "POST /v1/rotation-shifts/${sh}/transfer", payload: { to_technician_id: "${t3}", expected_rotation_shift_version: "${v1}" }, as: PropertyAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /v1/rotation-shifts/${sh}/transfer", payload: { to_technician_id: "${t3}", expected_rotation_shift_version: "${v2}" }, as: PropertyAdmin, captures: { owner: $.data.technician_id } }
          assert:
            - "first transfer succeeds (version 1 -> 2; technician -> T2)"
            - "second transfer with the ORIGINAL version: 412 ERR_STALE_ROTATION_SHIFT_VERSION (state is still PUBLISHED — OCC is the only guard)"
            - "third transfer with the current version succeeds; technician_id == ${t3}"

      - name: escalation_checkpoint_advances_levels
        claim_type: ops_run_checkpoint
        grounds: [state_machines.CallTicket.DISPATCHED_to_ESCALATED, entities.CallTicket.fields.escalation_level]
        distinguishing_aspect: "The ops-run evaluates elapsed time since dispatched_at: >15 min promotes DISPATCHED -> ESCALATED level 1; >30 min on an ESCALATED ticket raises level 2; a ticket under 15 min is untouched."
        test_recipe:
          setup: ["T1 on ACTIVE shift 00:00-12:00; ticket A dispatched 00:00; ticket B dispatched 00:05 (both NO_POWER)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "L-2", building_code: "BL" }, as: PropertyAdmin, captures: { u: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-03T12:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "A", caller_phone: "555", category: "NO_POWER", description: "A" }, as: Dispatcher, captures: { tka: $.data.id } }
            - { call: "POST /v1/call-tickets/${tka}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tka}", as: Dispatcher, captures: { tva: $.data.version } }
            - { call: "POST /v1/call-tickets/${tka}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tva}" }, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:05:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "B", caller_phone: "555", category: "NO_POWER", description: "B" }, as: Dispatcher, captures: { tkb: $.data.id } }
            - { call: "POST /v1/call-tickets/${tkb}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tkb}", as: Dispatcher, captures: { tvb: $.data.version } }
            - { call: "POST /v1/call-tickets/${tkb}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tvb}" }, as: Dispatcher }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:16:00Z" }, as: PropertyAdmin }
            - { call: "POST /_ops/evaluate-escalations", as: PropertyAdmin, captures: { ec1: $.data.evaluated_count } }
            - { call: "GET /v1/call-tickets/${tka}", as: Dispatcher, captures: { sta1: $.data.status, lvA1: $.data.escalation_level } }
            - { call: "GET /v1/call-tickets/${tkb}", as: Dispatcher, captures: { stb1: $.data.status, lvB1: $.data.escalation_level } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:36:00Z" }, as: PropertyAdmin }
            - { call: "POST /_ops/evaluate-escalations", as: PropertyAdmin }
            - { call: "GET /v1/call-tickets/${tka}", as: Dispatcher, captures: { lvA2: $.data.escalation_level } }
            - { call: "GET /v1/call-tickets/${tkb}", as: Dispatcher, captures: { stb2: $.data.status, lvB2: $.data.escalation_level } }
          assert:
            - "after 00:16 evaluation: A ESCALATED level 1 (16 min > 15); B still DISPATCHED level 0 (11 min <= 15)"
            - "evaluated_count == 2 (both open dispatched-family tickets scanned)"
            - "after 00:36 evaluation: A level 2 (36 > 30 on ESCALATED); B ESCALATED level 1 (31 > 15 from DISPATCHED — level 2 requires a prior ESCALATED state)"

      - name: logical_clock_default_timestamp
        claim_type: system_default
        grounds: [entities.CallTicket.fields.received_at]
        distinguishing_aspect: "With no set_current_utc call, the logical clock reads exactly 2026-08-01T00:00:00Z — the ticket's received_at proves the server never falls back to wall time."
        test_recipe:
          setup: ["fresh server state (per-test isolation); unit exists; NO clock call is made"]
          setup_api_calls:
            - { call: "POST /v1/units", payload: { unit_number: "L-3", building_code: "BL" }, as: PropertyAdmin, captures: { u: $.data.id } }
          trigger:
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "A", caller_phone: "555", category: "OTHER", description: "default clock probe" }, as: Dispatcher, captures: { ra: $.data.received_at } }
          assert: ["received_at == 2026-08-01T00:00:00Z (pinned startup default)"]

  # ---------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: transfer_response_immediately_reflects_mutation
        claim_type: immediate_consistency
        grounds: [complexity_profile, state_machines.RotationShift.PUBLISHED_to_PUBLISHED]
        distinguishing_aspect: "Immediate consistency: the transfer response body already carries the new technician_id and incremented version; a follow-up read agrees byte-for-byte."
        test_recipe:
          setup: ["T1/T2 technicians; shift S PUBLISHED for T1 with captured version"]
          setup_api_calls:
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Terry Two", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t2: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-05T08:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /v1/rotation-shifts/${sh}/transfer", payload: { to_technician_id: "${t2}", expected_rotation_shift_version: "${v1}" }, as: PropertyAdmin, captures: { ow: $.data.technician_id, v2: $.data.version } }
            - { call: "GET /v1/rotation-shifts/${sh}", as: PropertyAdmin, captures: { ow2: $.data.technician_id, v3: $.data.version } }
          assert:
            - "transfer response: technician_id == ${t2} and version == ${v1} + 1 (mutation visible in the same response)"
            - "subsequent GET returns identical technician_id and version (no lag, no reconciliation pass)"

  # ---------------------------------------------------------------
  - section: errors
    instances:
      - name: deactivated_technician_not_dispatchable
        claim_type: violation_to_error
        grounds: [state_machines.Technician.ACTIVE_to_INACTIVE, "errors[ERR_TECHNICIAN_NOT_ON_SHIFT]"]
        distinguishing_aspect: "Deactivation is effective immediately: an INACTIVE technician with a perfectly good ACTIVE shift is rejected at dispatch."
        test_recipe:
          setup: ["T1 with ACTIVE shift covering now; ticket TRIAGED; then T1 deactivated"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "V-1", building_code: "BV" }, as: PropertyAdmin, captures: { u: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-03T08:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "A", caller_phone: "555", category: "NO_POWER", description: "outage" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "POST /v1/technicians/${t1}/deactivate", as: PropertyAdmin, captures: { st: $.data.status } }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
          trigger:
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "deactivate returned status == INACTIVE"
            - "dispatch to the INACTIVE technician: error_id == ERR_TECHNICIAN_NOT_ON_SHIFT (409); ticket stays TRIAGED"

      - name: relocation_activate_before_start_date_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_BEFORE_START_DATE]", state_machines.RelocationCase.APPROVED_to_ACTIVE]
        distinguishing_aspect: "Temporal gate: activation before the case's start_date is rejected even though the state (APPROVED) is correct."
        test_recipe:
          setup: ["uninhabitable-mitigated ticket; RC (start 2026-08-05) APPROVED; clock still 2026-08-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Sam Sup", capability: "SUPERVISOR", base_hourly_rate_cents: 6000, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { sup1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "E-1", building_code: "BE" }, as: PropertyAdmin, captures: { u: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-01T08:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "A", caller_phone: "555", category: "FLOOD", description: "flood" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/call-tickets/${tk}/mitigate", payload: { mitigation_notes: "extracted", unit_uninhabitable: true }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/relocation-cases", payload: { unit_id: "${u}", call_ticket_id: "${tk}", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-07T00:00:00Z", nightly_rate_cents: 10000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { rc: $.data.id } }
            - { call: "POST /v1/relocation-cases/${rc}/approve", as: MaintenanceSupervisor, as_user_id: "${sup1}" }
          trigger:
            - { call: "POST /v1/relocation-cases/${rc}/activate", as: MaintenanceSupervisor, as_user_id: "${sup1}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_BEFORE_START_DATE (409) — now 2026-08-01 < start 2026-08-05; case stays APPROVED"]

      - name: err_stub_work_order_invalid_state
        claim_type: violation_to_error
        grounds: ["errors[ERR_WORK_ORDER_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: relocation_end_blocked_by_open_unit_work_order
          rationale: "Asserted as the failure path of the named §1.8 instance (relocation end blocked by OPEN unit work order)."

      - name: err_stub_vendor_authorization_invalid_state
        claim_type: violation_to_error
        grounds: ["errors[ERR_VENDOR_AUTHORIZATION_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: state_precedes_fiscal_on_authorize
          rationale: "Asserted as the winning error of the state-vs-fiscal priority conflict."

      - name: err_stub_incident_record_not_submitted
        claim_type: violation_to_error
        grounds: ["errors[ERR_INCIDENT_RECORD_NOT_SUBMITTED]"]
