scaffold_corner_design:
  - section: entities
    instances:
      - name: envelope_create_returns_201_with_initial_state
        claim_type: creation
        grounds:
          - entities.Envelope.fields.status
          - entities.Envelope.fields.is_sealed
          - state_machines.Envelope.initial_state
          - endpoints.POST_/esign/envelopes
        distinguishing_aspect: "A POST with all required fields returns 201 and an envelope whose status is CREATED, is_sealed false and version 1."
        test_recipe:
          setup:
            - "one STANDARD account and one GLOBAL retention policy"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Std Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Created envelope", routing_mode: "SEQUENTIAL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id, env_status: $.data.status, env_version: $.data.version, env_sealed: $.data.is_sealed }
          assert:
            - "Envelope.${env_id}.status == \"CREATED\""
            - "Envelope.${env_id}.is_sealed == false"
            - "Envelope.${env_id}.version == 1"
            - "http status == 201"
      - name: envelope_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_ENVELOPE_NOT_FOUND]
          - validations[priority=5]
          - endpoints.GET_/esign/envelopes/{id}
        distinguishing_aspect: "A GET for an id that has never been created returns 404 with ERR_ENVELOPE_NOT_FOUND and no envelope body."
        test_recipe:
          setup:
            - "no envelope exists with the probed id"
          setup_api_calls:
            - call: "GET /esign/envelopes/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { missing_err: $.data.error_id }
          trigger:
            - call: "GET /esign/envelopes/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_code: $.data.error_id }
          assert:
            - "response error_id == \"ERR_ENVELOPE_NOT_FOUND\""
            - "http status == 404"
      - name: recipient_create_requires_existing_envelope
        claim_type: parent_relationships
        grounds:
          - entities.Recipient.fields.envelope_id
          - errors[ERR_ENVELOPE_NOT_FOUND]
          - endpoints.POST_/esign/envelopes/{id}/recipients
        distinguishing_aspect: "Adding a recipient under an envelope id that does not exist returns 404 with ERR_ENVELOPE_NOT_FOUND before any recipient row is written."
        test_recipe:
          setup:
            - "no envelope exists with the probed id"
          setup_api_calls:
            - call: "GET /esign/envelopes/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { probe_err: $.data.error_id }
          trigger:
            - call: "POST /esign/envelopes/00000000-0000-0000-0000-000000000000/recipients"
              payload: { role: "SIGNER", email: "orphan@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${probe_err}"
              captures: { err_code: $.data.error_id }
          assert:
            - "response error_id == \"ERR_ENVELOPE_NOT_FOUND\""
            - "http status == 404"
      - name: field_placement_missing_required_field_type_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=34]
          - endpoints.POST_/esign/envelopes/{id}/fields
        distinguishing_aspect: "Omitting the required field_type returns 400 with ERR_INVALID_REQUEST rather than succeeding with a null enum."
        test_recipe:
          setup:
            - "one envelope with a document and a recipient"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Std Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Field envelope", routing_mode: "SEQUENTIAL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "Field.pdf", page_count: 3 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "field@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${rec_id}", page_number: 1 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { err_code: $.data.error_id }
          assert:
            - "response error_id == \"ERR_INVALID_REQUEST\""
            - "http status == 400"
      - name: account_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.Account.fields.tier
          - entities.Account.fields.page_allowance
          - entities.Account.fields.credit_balance
          - entities.Account.fields.status
        distinguishing_aspect: "Creating an account with only name and state_code yields tier STANDARD, page_allowance 25, credit_balance 1000 and status ACTIVE."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /esign/accounts"
              payload: { name: "Defaults Co", state_code: "TX" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, tier: $.data.tier, allowance: $.data.page_allowance, balance: $.data.credit_balance, status: $.data.status }
          assert:
            - "Account.${acct_id}.tier == \"STANDARD\""
            - "Account.${acct_id}.page_allowance == 25"
            - "Account.${acct_id}.credit_balance == 1000"
            - "Account.${acct_id}.status == \"ACTIVE\""
  - section: state_machines
    instances:
      - name: sign_from_already_signed_returns_recipient_terminal
        claim_type: invalid_transition
        grounds:
          - state_machines.Recipient.SIGNING_to_SIGNED
          - errors[ERR_RECIPIENT_TERMINAL]
          - validations[priority=14]
        distinguishing_aspect: "A second sign request from a recipient already in SIGNED returns 409 with ERR_RECIPIENT_TERMINAL and does not advance signed_at."
        test_recipe:
          setup:
            - "one envelope with a single authenticated, consented SIGNER whose SIGNATURE field is filled, already signed"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Std Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Idempotency envelope", routing_mode: "SEQUENTIAL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "Idem.pdf", page_count: 3 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "idem@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${rec_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 1, value: "Idem" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/send"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/recipients/${rec_id}/sessions"
              payload: { consent_to_electronic_records: true }
              as: Recipient
              as_user_id: "${rec_id}"
            - call: "POST /esign/recipients/${rec_id}/sign"
              payload: {}
              as: Recipient
              as_user_id: "${rec_id}"
              captures: { signed_at_1: $.data.signed_at }
          trigger:
            - call: "POST /esign/recipients/${rec_id}/sign"
              payload: {}
              as: Recipient
              as_user_id: "${rec_id}"
              captures: { err_code: $.data.error_id }
          assert:
            - "response error_id == \"ERR_RECIPIENT_TERMINAL\""
            - "http status == 409"
            - "Recipient.${rec_id}.signed_at == ${signed_at_1}  (unchanged by the rejected second call)"
      - name: template_publish_transitions_draft_to_published
        claim_type: valid_transition
        grounds:
          - state_machines.Template.DRAFT_to_PUBLISHED
          - entities.Template.fields.status
          - endpoints.POST_/esign/templates/{id}/publish
        distinguishing_aspect: "Publishing a DRAFT template moves it to PUBLISHED and bumps its version by one."
        test_recipe:
          setup:
            - "one account and one DRAFT template owned by it"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/templates"
              payload: { owning_account_id: "${acct_id}", name: "NDA Template", default_routing_mode: "SEQUENTIAL", default_auth_level: "EMAIL_ACCESS", page_count: 4, role_slot_count: 2 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { tpl_id: $.data.id, tpl_v: $.data.version }
          trigger:
            - call: "POST /esign/templates/${tpl_id}/publish"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
              captures: { tpl_status: $.data.status, tpl_v2: $.data.version }
          assert:
            - "Template.${tpl_id}.status == \"PUBLISHED\""
            - "Template.${tpl_id}.version == ${tpl_v} + 1"
      - name: template_archive_from_draft_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Template.PUBLISHED_to_ARCHIVED
          - errors[ERR_INVALID_ENVELOPE_STATE]
        distinguishing_aspect: "Archiving a template that was never published is rejected, proving the archive transition's from-state is PUBLISHED and not any state."
        test_recipe:
          setup:
            - "one account and one DRAFT template"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/templates"
              payload: { owning_account_id: "${acct_id}", name: "Draft Template", default_routing_mode: "SEQUENTIAL", default_auth_level: "EMAIL_ACCESS", page_count: 2, role_slot_count: 1 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { tpl_id: $.data.id }
          trigger:
            - call: "POST /esign/templates/${tpl_id}/archive"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
              captures: { err_code: $.data.error_id }
          assert:
            - "response error_id != null  (a DRAFT template carries no PUBLISHED -> ARCHIVED transition)"
            - "Template.${tpl_id}.status == \"DRAFT\""
      - name: bulk_send_all_rows_invalid_sets_failed
        claim_type: side_effect_execution
        grounds:
          - state_machines.BulkSendBatch.CREATED_to_FAILED
          - entities.BulkSendBatch.fields.failed_count
          - endpoints.POST_/esign/bulk-sends/{id}/process
        distinguishing_aspect: "Processing a bulk send whose every row is rejected lands the batch in FAILED with succeeded_count 0 and failed_count equal to total_rows."
        test_recipe:
          setup:
            - "one PUBLISHED template and a bulk send batch of 2 rows"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/templates"
              payload: { owning_account_id: "${acct_id}", name: "Bulk Template", default_routing_mode: "SEQUENTIAL", default_auth_level: "EMAIL_ACCESS", page_count: 3, role_slot_count: 1 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { tpl_id: $.data.id }
            - call: "POST /esign/templates/${tpl_id}/publish"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/bulk-sends"
              payload: { account_id: "${acct_id}", template_id: "${tpl_id}", total_rows: 2 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /esign/bulk-sends/${batch_id}/process"
              payload: { rows: [{ email: "not-an-email" }, { email: "" }] }
              as: Account
              as_user_id: "${acct_id}"
              captures: { batch_status: $.data.status, succ: $.data.succeeded_count, fail: $.data.failed_count }
          assert:
            - "BulkSendBatch.${batch_id}.status == \"FAILED\""
            - "BulkSendBatch.${batch_id}.succeeded_count == 0"
            - "BulkSendBatch.${batch_id}.failed_count == 2"
      - name: void_from_completed_returns_envelope_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Envelope.COMPLETED
          - errors[ERR_ENVELOPE_TERMINAL]
          - validations[priority=11]
        distinguishing_aspect: "A COMPLETED envelope admits no further transition, so a void attempt returns ERR_ENVELOPE_TERMINAL and the sealed envelope is untouched."
        excluded_because:
          difficulty_instance: send_voided_and_held_envelope_returns_409_state_error
          rationale: "The same ERR_ENVELOPE_TERMINAL terminal-state rejection is asserted as the primary outcome of that §1.8 instance."
  - section: calculations
    instances:
      - name: credit_spend_consumption_matches_tiered_formula
        claim_type: correct_result
        grounds:
          - calculations.credit_spend_consumption
          - entities.Account.fields.credit_balance
        distinguishing_aspect: "A 25-page single-signer envelope on a STANDARD account debits exactly 1 credit, the base unit with all overage terms zero."
        excluded_because:
          difficulty_instance: credit_spend_consumption_tiered_and_status_conditional
          rationale: "The tiered credit formula's exact numeric result is asserted as the primary outcome of that §1.8 instance."
      - name: envelope_page_fee_precision_per_document
        claim_type: precision
        grounds:
          - calculations.envelope_page_fee
          - calculations.envelope_page_fee.variants[sum_then_round]
        distinguishing_aspect: "The per-document rounding order is observable: three 70-page documents at a 25-page allowance yield 185.04, not the sum-then-round 185.03."
        excluded_because:
          difficulty_instance: envelope_page_fee_per_document_rounding_order
          rationale: "The nested-rounding-order divergence is asserted as the primary outcome of that §1.8 instance."
      - name: audit_chain_hash_is_deterministic_over_event_order
        claim_type: correct_result
        grounds:
          - calculations.audit_chain_hash
          - entities.AuditEvent.fields.sequence_number
          - entities.AuditEvent.fields.event_hash
        distinguishing_aspect: "The certificate_hash is a pure function of the ordered event chain: reading the certificate twice yields the same 64-character hash, and the chain's event_count equals the number of AuditEvent rows."
        test_recipe:
          setup:
            - "one SEQUENTIAL envelope sent and delivered, so at least two audit events exist"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Std Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Chain envelope", routing_mode: "SEQUENTIAL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "Chain.pdf", page_count: 5 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "chain@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${rec_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 1, value: "Chain" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/send"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/feed"
              payload: { feed_event: "DELIVERED" }
              as: Account
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /esign/envelopes/${env_id}/audit-certificate"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
              captures: { cert_1: $.data.certificate_hash, count_1: $.data.event_count }
            - call: "GET /esign/envelopes/${env_id}/audit-certificate"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
              captures: { cert_2: $.data.certificate_hash, count_2: $.data.event_count }
          assert:
            - "Envelope.${env_id} certificate_hash == ${cert_1} and {{cert_2}}  (the hash is stable across reads)"
            - "Envelope.${env_id} event_count == ${count_1} and the chain's event_count equals the number of AuditEvent rows for the envelope"
            - "the certificate_hash string has length 64"
  - section: validations
    instances:
      - name: duplicate_recipient_email_same_order_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=25]
          - errors[ERR_DUPLICATE_RECIPIENT]
          - endpoints.POST_/esign/envelopes/{id}/recipients
        distinguishing_aspect: "Two recipients sharing an email at the same routing_order are rejected with ERR_DUPLICATE_RECIPIENT, while the same email at a different routing_order is accepted."
        test_recipe:
          setup:
            - "one envelope with a first signer at routing_order 1"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Std Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Duplicate envelope", routing_mode: "SEQUENTIAL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "dup@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { first_id: $.data.id }
          trigger:
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "dup@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { err_code: $.data.error_id }
          assert:
            - "response error_id == \"ERR_DUPLICATE_RECIPIENT\""
            - "http status == 409"
      - name: sod_violation_when_signer_seals_own_envelope
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_SOD_VIOLATION]
          - endpoints.POST_/esign/envelopes/{id}/complete
        distinguishing_aspect: "An account whose identity authenticated and signed a recipient of an envelope is refused the seal with ERR_SOD_VIOLATION at priority 4, above every existence and state check."
        test_recipe:
          setup:
            - "one envelope whose single SIGNER authenticated under the account's own X-User-ID, so the sealing identity participated in signing"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Std Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "SoD envelope", routing_mode: "SEQUENTIAL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "SoD.pdf", page_count: 3 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "sod@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${rec_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 1, value: "SoD" }
              as: Account
              as_user_id: "${acct_id}"
