              captures: { pq_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pq_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${cz_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-01T00:00:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
              captures: { a1_id: $.data.id, i1_id: $.data.incident_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:30:00Z" }
              as: PlatformAdmin
            - call: "POST /alarms/${a1_id}/clear"
              payload: { cleared_at: "2026-08-01T00:30:00Z" }
              as: NocAnalyst
            - call: "POST /incidents/${i1_id}/response"
              payload: { target_response_state: "TRIAGED" }
              as: NocAnalyst
            - call: "POST /incidents/${i1_id}/response"
              payload: { target_response_state: "MITIGATED" }
              as: NocAnalyst
            - call: "POST /incidents/${i1_id}/resolve"
              payload: { resolution_note: "fault 1 cleared" }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-04T00:00:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
              captures: { a2_id: $.data.id, i2_id: $.data.incident_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:30:00Z" }
              as: PlatformAdmin
            - call: "POST /alarms/${a2_id}/clear"
              payload: { cleared_at: "2026-08-04T00:30:00Z" }
              as: NocAnalyst
            - call: "POST /incidents/${i2_id}/response"
              payload: { target_response_state: "TRIAGED" }
              as: NocAnalyst
            - call: "POST /incidents/${i2_id}/response"
              payload: { target_response_state: "MITIGATED" }
              as: NocAnalyst
            - call: "POST /incidents/${i2_id}/resolve"
              payload: { resolution_note: "fault 2 cleared" }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-07T00:00:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
              captures: { a3_id: $.data.id, i3_id: $.data.incident_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:30:00Z" }
              as: PlatformAdmin
            - call: "POST /alarms/${a3_id}/clear"
              payload: { cleared_at: "2026-08-07T00:30:00Z" }
              as: NocAnalyst
            - call: "POST /incidents/${i3_id}/response"
              payload: { target_response_state: "TRIAGED" }
              as: NocAnalyst
            - call: "POST /incidents/${i3_id}/response"
