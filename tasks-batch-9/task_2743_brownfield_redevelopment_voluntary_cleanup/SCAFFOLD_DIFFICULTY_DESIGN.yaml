          exactly 180 days old and must be accepted (aai_expires_on becomes
          2027-04-18), while 2026-04-17 is 181 days old and must be refused with
          ERR_AAI_REPORT_STALE. Two sibling sites make the pair observable in one
          run with no other input difference.
        test_recipe:
          setup:
            - "Clock 2026-08-01; one redeveloper and one consultant."
            - "Site A and site B, both UNDER_CONTRACT with planned_acquisition_date 2026-10-15, each with its own LiabilityProtection in AAI_PENDING."
            - "One APPROVED PHASE_I per site: site A's report is dated 2026-04-18 (exactly 180 days before the reference date), site B's is dated 2026-04-17 (181 days)."
          setup_api_calls:
            - *k_clock0
            - *k_redev
            - *k_consult
            - *k_site
            - *k_prot
            - &k_pA180
              call: "POST /assessment-phases"
              payload:
                site_id: "${site_id}"
                consultant_party_id: "${consult_id}"
                phase_type: PHASE_I
                field_start_date: "2026-03-01"
                field_end_date: "2026-04-10"
