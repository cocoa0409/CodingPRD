      - name: project_suspend_cascades_deployment_housing_lodging_and_counters
        grounds:
          - "state_machines.ConstructionProject.transitions.IN_PROGRESS_to_SUSPENDED"
          - "state_machines.VolunteerDeployment.transitions.CONFIRMED_to_CANCELLED"
          - "entities.HousingAssignment.fields.status"
          - "entities.LodgingSite.fields.peak_committed_beds"
          - "entities.VolunteerGroup.fields.active_deployment_count"
          - "entities.ConstructionProject.fields.confirmed_deployment_count"
        distinguishing_aspect: "One SUSPEND ripples four levels away from the project: deployment CANCELLED with cancellation_reason PROJECT_SUSPENDED (hop 1), housing assignment RELEASED with release_reason DEPLOYMENT_CANCELLED (hop 2), LodgingSite peak_committed_beds back to 0 and status FULL->OPEN (hop 3), group.active_deployment_count and project.confirmed_deployment_count back to 0 (hop 4). An implementation that stops at hop 1 leaves 12 beds phantom-occupied and the site FULL. A subsequent RESUME must NOT resurrect any of them."
        test_recipe:
          setup:
            - "Case C10 with project P10 requiring {FRAMING 300 (critical), ROOFING 150, GENERAL_LABOR 300}; PERMITTED then STARTED."
            - "Group G10 with 12 members and skill_profile {FRAMING 5, ROOFING 2, GENERAL_LABOR 12}, requires_housing true."
            - "LodgingSite L10 with bed_capacity 12."
            - "HousingAssignment 2026-09-07 -> 2026-09-12 books all 12 beds on nights 09-07..09-11, driving peak_committed_beds to 12 and status to FULL."
            - "Deployment 2026-09-07..2026-09-11 scores 6000 bps and is CONFIRMED (housing covers every night of the stay)."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
