  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict  (3 instances; three DIFFERENT
  #          category pairs: auth/existence, concurrency/business_fiscal,
  #          business_safety/business_fiscal)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: unauthorized_role_outranks_missing_abstract_on_decision_negative
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - endpoints.POST./abstracts/{abstractId}/decision
        distinguishing_aspect: |
          A single call violates the auth rule at priority 2 (an Author calling a
          ProgramChair-only endpoint) and the existence rule at priority 4 (the
          abstractId in the path does not exist). Priority 2 wins, so the body is
          ERR_UNAUTHORIZED with HTTP 403 and never ERR_ABSTRACT_NOT_FOUND / 404 -
          an implementation that looks the path id up before checking the role
          returns 404 here and fails.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 created and left at DRAFT."
            - "Author Ada exists, so no identity lookup can fail at priority 3."
            - "The abstract id 00000000-0000-4000-8000-0000000009ff is never created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "GET /conferences/${conf_id}"
              as: ConferenceAdmin
              captures: { conf_v0: "$.data.version" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
          trigger:
            - call: "POST /abstracts/00000000-0000-4000-8000-0000000009ff/decision"
              payload: { decision: "ORAL", expected_conference_version: "${conf_v0}" }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 403"
            - "response_type == error"
            - "data.error_id == ERR_UNAUTHORIZED"
            - "data.error_id != ERR_ABSTRACT_NOT_FOUND"
            - "Conference.${conf_id}.accepted_oral_count == 0"

      - name: stale_conference_version_outranks_exhausted_oral_capacity_negative
        grounds:
          - validations[priority=8]
          - validations[priority=21]
          - concurrency_rules[decision-commit-stale-conference]
          - entities.Conference.fields.accepted_oral_count
        distinguishing_aspect: |
          The same decision call violates the concurrency rule at priority 8
          (expected_conference_version was read before the REVIEW_CLOSED
          transition bumped Conference.version) and the fiscal rule at priority 21
          (oral_slot_capacity is 0 and downgrade is disallowed). Priority 8 wins:
          ERR_STALE_CONFERENCE_VERSION with HTTP 412, not
          ERR_FORMAT_CAPACITY_EXHAUSTED with 422 - the stale check must run before
          any capacity arithmetic is attempted.
        test_recipe:
          setup:
