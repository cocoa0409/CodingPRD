# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3037_franchise_supply_chain_center_profit_sharing_rebate
#
# Breadth probe: enumerates every testable claim the scaffold's §1.1–§1.7
# surface declares that §1.8 does not already cover.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: supply_center_create_returns_all_declared_fields
        claim_type: Creation
        grounds:
          - entities.SupplyCenter
          - endpoints.POST_/supply-centers
        distinguishing_aspect: "POST /supply-centers with center_code, display_name, base_weekly_capacity_units returns 201 with system-generated id, created_at, updated_at, version=1, status=DRAFT, posture=ACTIVE, ops_run_index=0, rebate_pool_balance_cents=0, rebate_pool_locked_cents=0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SupplyChainAdmin
          trigger:
            - &k_center
              call: "POST /supply-centers"
              payload: { center_code: "SC-001", display_name: "Midwest Supply Center", base_weekly_capacity_units: 50000 }
              as: SupplyChainAdmin
              captures: { center_id: $.data.id, center_v: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "SupplyCenter.${center_id}.center_code == \"SC-001\""
            - "SupplyCenter.${center_id}.display_name == \"Midwest Supply Center\""
            - "SupplyCenter.${center_id}.base_weekly_capacity_units == 50000"
            - "SupplyCenter.${center_id}.surge_capacity_multiplier == 1.0"
            - "SupplyCenter.${center_id}.status == DRAFT"
            - "SupplyCenter.${center_id}.posture == ACTIVE"
            - "SupplyCenter.${center_id}.ops_run_index == 0"
            - "SupplyCenter.${center_id}.rebate_pool_balance_cents == 0"
            - "SupplyCenter.${center_id}.version == 1"

      - name: store_get_returns_stored_configuration_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Store
          - endpoints.GET_/supply-centers/{id}/stores/{id}
        distinguishing_aspect: "Every Store field round-trips through GET exactly as posted, including credit_limit_cents and computed defaults."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center created."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-200", operator_name: "Beta Franchise Inc", credit_limit_cents: 500000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
          trigger:
            - call: "GET /supply-centers/${center_id}/stores/${store_id}"
              payload: {}
              as: Any
          assert:
            - "the response status is 200"
            - "Store.${store_id}.store_number == \"ST-200\""
            - "Store.${store_id}.operator_name == \"Beta Franchise Inc\""
            - "Store.${store_id}.credit_limit_cents == 500000"
            - "Store.${store_id}.status == ONBOARDING"
            - "Store.${store_id}.compliance_tier == FULL_COMPLIANCE"
            - "Store.${store_id}.rebate_eligibility_status == ELIGIBLE"
            - "Store.${store_id}.outstanding_balance_cents == 0"

      - name: products_list_paginates_with_limit_offset
        claim_type: Listing
        grounds:
          - endpoints.GET_/supply-centers/{id}/products
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three products on file, limit=2&offset=0 returns 2 rows with total_count=3 and has_more=true, and offset=2 returns the remaining 1 row with has_more=false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center created."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "P1", name: "Product 1", category: "DOUGH", base_cost_cents_per_unit: 100 }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "P2", name: "Product 2", category: "FOOD_INGREDIENT", base_cost_cents_per_unit: 200 }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "P3", name: "Product 3", category: "EQUIPMENT", base_cost_cents_per_unit: 300 }
              as: SupplyChainAdmin
          trigger:
            - call: "GET /supply-centers/${center_id}/products"
              payload: { limit: 2, offset: 0 }
              as: Any
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET with limit=2&offset=2 returns exactly 1 row with has_more == false"

      - name: product_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/supply-centers/{id}/products/{id}
          - errors.ERR_PRODUCT_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID produces 404 ERR_PRODUCT_NOT_FOUND, not a generic 404."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center created."
          setup_api_calls:
            - *k_clock
            - *k_center
          trigger:
            - call: "GET /supply-centers/${center_id}/products/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Any
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404"
            - "error_id == ERR_PRODUCT_NOT_FOUND"
            - "response_type is error"

      - name: store_create_missing_credit_limit_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Store.fields.credit_limit_cents
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "credit_limit_cents is a required input with no default; omitting it returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center created."
          setup_api_calls:
            - *k_clock
            - *k_center
          trigger:
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-NOCL", operator_name: "No Credit Limit" }
              as: SupplyChainAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: product_shelf_life_defaults_to_null_for_non_perishables
        claim_type: Defaults
        grounds:
          - entities.Product.fields.shelf_life_days
        distinguishing_aspect: "shelf_life_days has no default and is not required; omitting it for non-perishables stores null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center created."
          setup_api_calls:
            - *k_clock
            - *k_center
          trigger:
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "OVEN-01", name: "Pizza Oven", category: "EQUIPMENT", base_cost_cents_per_unit: 500000 }
              as: SupplyChainAdmin
              captures: { product_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Product.${product_id}.shelf_life_days is null"
            - "Product.${product_id}.is_promotion_eligible == false"

      - name: purchase_order_totals_are_computed_not_input
        claim_type: Computed Fields
        grounds:
          - entities.PurchaseOrder.fields.subtotal_cents
          - entities.PurchaseOrder.fields.markup_cents
          - entities.PurchaseOrder.fields.total_cents
        distinguishing_aspect: "subtotal_cents, markup_cents, and total_cents are computed fields; client input is ignored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center ACTIVE with product and price book. Store ACTIVE."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "D1", name: "Dough", category: "DOUGH", base_cost_cents_per_unit: 1000 }
              as: SupplyChainAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${prod_id}", store_tier: "STANDARD", markup_pct: 0.15, min_quantity: 1, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z", expected_center_version: "${center_v}" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-COMP", operator_name: "Comp", credit_limit_cents: 1000000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { po_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 10 }
              as: StoreManager
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/submit"
              payload: { expected_store_version: "${store_v}" }
              as: StoreManager
              as_user_id: "${store_id}"
          assert:
            - "PurchaseOrder.${po_id}.subtotal_cents == 11500"
            - "PurchaseOrder.${po_id}.markup_cents == 1500"
            - "PurchaseOrder.${po_id}.total_cents == 11500"
            - "PurchaseOrder.${po_id}.delivery_fee_cents == 0"

      - name: order_line_unit_price_is_computed_at_creation
        claim_type: Computed Fields
        grounds:
          - entities.OrderLine.fields.unit_price_cents
          - entities.OrderLine.fields.extended_price_cents
        distinguishing_aspect: "unit_price_cents and extended_price_cents are computed from the PriceBook at line creation time; client cannot supply them."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center ACTIVE. Store ACTIVE. DRAFT PO exists."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "D1", name: "Dough", category: "DOUGH", base_cost_cents_per_unit: 1000 }
              as: SupplyChainAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${prod_id}", store_tier: "STANDARD", markup_pct: 0.15, min_quantity: 1, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z", expected_center_version: "${center_v}" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-COMP2", operator_name: "Comp2", credit_limit_cents: 1000000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { po_id: $.data.id }
          trigger:
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 5 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { line_id: $.data.id }
          assert:
            - "the response status is 201"
            - "OrderLine.${line_id}.unit_price_cents == 1150"
            - "OrderLine.${line_id}.extended_price_cents == 5750"

      - name: route_code_enum_rejects_invalid_day
        claim_type: Type Constraints
        grounds:
          - entities.DeliveryRoute.fields.day_of_week
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "day_of_week is a closed enum; invalid values like FUNDAY are rejected with 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center created."
          setup_api_calls:
            - *k_clock
            - *k_center
          trigger:
            - call: "POST /supply-centers/${center_id}/routes"
              payload: { route_code: "R1", day_of_week: "FUNDAY", truck_capacity_units: 1000, assigned_store_ids: [] }
              as: RouteCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: store_number_unique_per_center
        claim_type: Type Constraints
        grounds:
          - entities.Store.fields.store_number
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "store_number must be unique within a center; duplicate returns 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center created. One store exists."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-DUP", operator_name: "First", credit_limit_cents: 100000 }
              as: SupplyChainAdmin
          trigger:
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-DUP", operator_name: "Second", credit_limit_cents: 200000 }
              as: SupplyChainAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: purchase_order_fk_to_store_and_center
        claim_type: Parent Relationships
        grounds:
          - entities.PurchaseOrder.fields.store_id
          - entities.PurchaseOrder.fields.center_id
        distinguishing_aspect: "PurchaseOrder has two FKs; both must resolve to existing entities within the same center scope."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center A and Center B created. Store in Center A."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers"
              payload: { center_code: "SC-B", display_name: "Center B", base_weekly_capacity_units: 50000 }
              as: SupplyChainAdmin
              captures: { center_b_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-A1", operator_name: "A1", credit_limit_cents: 100000 }
              as: SupplyChainAdmin
              captures: { store_a_id: $.data.id }
          trigger:
            - call: "POST /supply-centers/${center_b_id}/stores/${store_a_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_a_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404"
            - "error_id == ERR_STORE_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: supply_center_activate_from_draft
        claim_type: Valid Transition
        grounds:
          - state_machines.SupplyCenter.DRAFT_to_ACTIVE
        distinguishing_aspect: "POST /activate on DRAFT center transitions to ACTIVE with no side effects."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center in DRAFT."
          setup_api_calls:
            - *k_clock
            - *k_center
          trigger:
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
          assert:
            - "SupplyCenter.${center_id}.status == ACTIVE"

      - name: supply_center_suspend_cascades_to_routes_and_pos
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SupplyCenter.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "Suspending center cancels PLANNED routes and rejects DRAFT/SUBMITTED POs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center ACTIVE with one PLANNED route and one SUBMITTED PO."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "P", name: "P", category: "DOUGH", base_cost_cents_per_unit: 100 }
              as: SupplyChainAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${prod_id}", store_tier: "STANDARD", markup_pct: 0.1, min_quantity: 1, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z", expected_center_version: "${center_v}" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-SUS", operator_name: "Sus", credit_limit_cents: 1000000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/routes"
              payload: { route_code: "R-SUS", day_of_week: "MONDAY", truck_capacity_units: 10000, assigned_store_ids: ["${store_id}"] }
              as: RouteCoordinator
              captures: { route_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { po_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 10 }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/submit"
              payload: { expected_store_version: "${store_v}" }
              as: StoreManager
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /supply-centers/${center_id}/suspend"
              payload: { reason: "cascade test" }
              as: SupplyChainAdmin
          assert:
            - "SupplyCenter.${center_id}.status == SUSPENDED"
            - "DeliveryRoute.${route_id}.status == CANCELLED"
            - "PurchaseOrder.${po_id}.status == REJECTED"

      - name: store_activate_requires_active_compliance
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Store.ONBOARDING_to_ACTIVE
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "Store cannot activate without at least one ACTIVE ComplianceAgreement."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center ACTIVE. Store ONBOARDING with no agreements."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-NOC", operator_name: "NoComp", credit_limit_cents: 100000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
          trigger:
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409"
            - "error_id == ERR_INVALID_STATE_TRANSITION"

      - name: purchase_order_submit_from_draft
        claim_type: Valid Transition
        grounds:
          - state_machines.PurchaseOrder.DRAFT_to_SUBMITTED
        distinguishing_aspect: "Submit transitions PO from DRAFT to SUBMITTED and computes totals."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center ACTIVE, Store ACTIVE, DRAFT PO with one line."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "P", name: "P", category: "DOUGH", base_cost_cents_per_unit: 1000 }
              as: SupplyChainAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${prod_id}", store_tier: "STANDARD", markup_pct: 0.15, min_quantity: 1, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z", expected_center_version: "${center_v}" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-VAL", operator_name: "Val", credit_limit_cents: 1000000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { po_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 10 }
              as: StoreManager
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/submit"
              payload: { expected_store_version: "${store_v}" }
              as: StoreManager
              as_user_id: "${store_id}"
          assert:
            - "PurchaseOrder.${po_id}.status == SUBMITTED"
            - "PurchaseOrder.${po_id}.subtotal_cents == 11500"

      - name: purchase_order_confirm_from_submitted
        claim_type: Valid Transition
        grounds:
          - state_machines.PurchaseOrder.SUBMITTED_to_CONFIRMED
        distinguishing_aspect: "Confirm transitions PO from SUBMITTED to CONFIRMED and assigns route."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center ACTIVE, Store ACTIVE, SUBMITTED PO, PLANNED route covering store, OPEN capacity plan."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "P", name: "P", category: "DOUGH", base_cost_cents_per_unit: 100 }
              as: SupplyChainAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/price-books"
