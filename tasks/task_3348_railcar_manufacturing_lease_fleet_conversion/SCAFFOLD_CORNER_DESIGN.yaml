      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${ws_id}
          qty_ordered: 10
          unit_cost_cents: 1000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-21'
        as: SupplyChainCoordinator
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${ws_id}
          qty_ordered: 10
          unit_cost_cents: 1000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-21'
        as: SupplyChainCoordinator
      trigger:
      - call: GET /api/v1/component-purchase-orders
        payload: {}
        as: PlatformAdmin
        captures:
          page1_rtype: $.response_type
          page1_req: $.meta.api_request_id
          page1_first: $.data[0].id
      - call: GET /api/v1/component-purchase-orders
        payload:
          offset: 10
        as: PlatformAdmin
        captures:
          page2_last: $.data[1].id
          page2_first: $.data[0].id
      - call: GET /api/v1/component-purchase-orders
        payload:
          status: PLACED
        as: PlatformAdmin
        captures:
          filtered_first: $.data[0].id
      assert:
      - 'The list response uses the §1.0 array envelope: response_type == ${page1_rtype} == "array" with
        meta.api_request_id == ${page1_req} non-empty and the rows under data'
      - The default page returns exactly 10 rows, with the first row ${page1_first}
      - That page reports total_count == 12 and has_more == true
      - The offset=10 page returns exactly the remaining 2 rows, ${page2_first} and ${page2_last}, both
        distinct from the 10 already seen
      - The offset=10 page reports total_count == 12 and has_more == false, so offset advances the window
        without changing the total
      - 'The status=PLACED filter is applied before pagination: it still reports total_count == 12 and
        its first row is ${filtered_first} == ${page1_first}, since all 12 rows are PLACED'
      - Every listed row carries status PLACED, the state POST /component-purchase-orders assigns at creation
  - name: endpoint_action_settle_returns_gate_covered_by_1_8
    claim_type: Conditional action
    grounds:
    - state_machines.LeaseFleetCar.UNDER_REPAIR_to_HELD
    - errors[ERR_UNSETTLED_RETURNS]
    - POST /api/v1/lease-fleet-cars/{id}/settle-returns
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / settle_returns_gated_on_car_return_settlement
      rationale: 'Asserted as the failure path and the success path of the named §1.8 instance: its trigger
        drives POST /api/v1/lease-fleet-cars/{id}/settle-returns while the car is UNDER_REPAIR and its
        CarReturn is still PENDING, pinning HTTP 409 with data.error_id == "ERR_UNSETTLED_RETURNS", then
        proves the same call returns HTTP 200 with status HELD once POST /api/v1/car-returns/{id}/settle
        flips that CarReturn to SETTLED.'
  - name: endpoint_action_sale_void_restores_car_covered_by_1_8
    claim_type: Action endpoint
