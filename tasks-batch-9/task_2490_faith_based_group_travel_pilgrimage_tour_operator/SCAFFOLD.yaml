scenario: |
  2490. Faith-Based Group Travel & Pilgrimage Tour Operator (religious group tour operator): itinerary design with sacred site access, service schedules and local clergy coordination, group leader recruitment with free-travel thresholds and commission arrangements, tiered pricing by group size with deposit schedule and payment plan administration, air block negotiation with name change deadlines and deviation requests, land operator contracting with hotels, guides and motorcoaches under local conditions, travel protection, medical coverage and pre-existing condition waivers for older travelers, destination risk monitoring with itinerary modification and cancellation policy, group rooming assignments, dietary needs and mobility accommodations
domain_name: pilgrimage-group-travel-operations
api_prefix: ""   # flat topology: every collection is a top-level path (/programs, /departures, /pilgrims, ...)

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit FK fields; no nesting in URL paths beyond
  # reverse-reachability sub-resources (/pilgrims/{id}/payment-plans).

  state_machine_shape: cyclic
  # AirBlock: OFFERED -> COUNTERED -> OFFERED negotiation rounds.
  # Pilgrim: three independent state dimensions on one row
  #          (booking_status x payment_status x protection_status).
  # Departure: SALES_CLOSED -> OPEN_FOR_SALE reopen loop, plus posture-driven gating.

  relationship_patterns:
    - one_to_many          # Program -> Departure, Departure -> Pilgrim
    - many_to_many         # Departure <-> LandResource via LandAssignment; Departure <-> SacredSite via ServiceBooking
    - self_referential     # Pilgrim.roommate_pilgrim_id -> Pilgrim.id (mutual rooming pointer)
    - cross_aggregate      # RiskAdvisory (country-scoped) drives Departure posture across programs

  role_model: segregation_of_duties
  # The operator who proposes an itinerary modification may not ratify it, and the
  # administrator who records a medical review may not decide the waiver.

  consistency_model: immediate

difficulty_level: expert_plus
# 13 entities / 61 endpoints / 56 error codes / 13 calculation rules / 10 state machines.
# Deliberately above the Expert band per the "harder than expert" instruction; the
# extra surface is load-bearing (two distinct temporal-overlap geometries, two
# conserved quantities, three parallel state dimensions on Pilgrim).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: marketing name of the pilgrimage product
        constraints: "1..160 chars"
      - name: destination_country
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country the itinerary operates in; joins RiskAdvisory.country"
        constraints: "exactly 2 uppercase letters"
      - name: faith_tradition
        type: enum
        source: input
        description: religious tradition the services follow
        constraints: "one of {CATHOLIC, ORTHODOX, PROTESTANT, JEWISH, MUSLIM, INTERFAITH}"
      - name: duration_days
        type: integer
        source: input
        description: nominal itinerary length in days
        constraints: ">= 2 and <= 40"
      - name: price_tiers
        type: array
        source: input
        description: "group-size price ladder; the tiered_pricing source of truth"
        constraints: |
          Each item is an object { tier_code: string, min_pax: integer, max_pax: integer,
          per_pax_price_cents: integer, single_supplement_cents: integer, deposit_cents: integer }.
          At least 1 item; tier_code unique; min_pax >= 1; max_pax >= min_pax; sorted by min_pax ASC;
          consecutive tiers must be contiguous (next.min_pax == prev.max_pax + 1) with no gaps and no overlaps.
          Violations -> ERR_INVALID_REQUEST.
      - name: cancellation_grid
        type: array
        source: input
        description: "days-before-departure penalty ladder used by calculations.pilgrim_cancellation_settlement"
        constraints: |
          Each item is an object { min_days_before: integer, penalty_bp: integer }.
          At least 1 item; min_days_before >= 0, unique, sorted DESC; penalty_bp in 0..10000;
          the ladder MUST contain an entry with min_days_before == 0. Violations -> ERR_INVALID_REQUEST.
      - name: departure_count
        type: integer
        source: computed
        description: "count of Departure rows with program_id == this.id (all statuses)"
        default: 0

  - name: Departure
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the product this dated departure instantiates"
      - name: departure_date
        type: string
        source: input
        description: "outbound calendar date, YYYY-MM-DD (UTC calendar)"
        constraints: "valid ISO date; must be strictly after the logical clock date at creation"
      - name: return_date
        type: string
        source: input
        description: "inbound calendar date, YYYY-MM-DD"
        constraints: "valid ISO date; strictly after departure_date"
      - name: min_pax
        type: integer
        source: input
        description: minimum confirmed paying travelers required to operate
        constraints: ">= 1"
      - name: max_pax
        type: integer
        source: input
        description: hard ceiling on non-cancelled travelers
        constraints: ">= min_pax"
      - name: deposit_due_date
        type: string
        source: input
        description: "calendar date by which each traveler's deposit is expected, YYYY-MM-DD"
      - name: final_payment_due_date
        type: string
        source: input
        description: "calendar date by which each traveler's balance is expected, YYYY-MM-DD"
        constraints: "strictly after deposit_due_date and strictly before departure_date"
      - name: mobility_accessible_coach
        type: boolean
        source: input
        description: whether the contracted motorcoach fleet for this departure has a wheelchair lift
        default: false
      - name: status
        type: enum
        source: computed
        description: sales/operations lifecycle position
        default: PLANNING
        constraints: "one of {PLANNING, OPEN_FOR_SALE, SALES_CLOSED, OPERATED, CANCELLED}"
      - name: risk_posture
        type: enum
        source: computed
        description: "derived from published RiskAdvisory rows for Program.destination_country; see calculations.departure_risk_posture"
        default: OPEN
        constraints: "one of {OPEN, WATCH, RESTRICTED, SUSPENDED}"
      - name: governing_advisory_id
        type: string
        source: computed
        description: "FK -> RiskAdvisory.id; the single advisory that produced the current risk_posture, or null when posture == OPEN"
        default: null
      - name: paying_pax_count
        type: integer
        source: computed
        description: "count of Pilgrim rows with departure_id == this.id AND is_paying == true AND booking_status IN {DEPOSITED, CONFIRMED}"
        default: 0
      - name: provisional_tier_code
        type: string
        source: computed
        description: "tier_code selected by the provisional variant of calculations.departure_group_size_tier"
        default: null
      - name: provisional_per_pax_price_cents
        type: integer
        source: computed
        description: per_pax_price_cents of the provisional tier
        default: 0
      - name: provisional_single_supplement_cents
        type: integer
        source: computed
        description: single_supplement_cents of the provisional tier
        default: 0
      - name: provisional_deposit_cents
        type: integer
        source: computed
        description: deposit_cents of the provisional tier; the amount a payment must reach to move a Pilgrim INQUIRY -> DEPOSITED
        default: 0
      - name: final_tier_code
        type: string
        source: computed
        description: "tier_code selected by the final variant of calculations.departure_group_size_tier at close-sales"
        default: null
      - name: final_per_pax_price_cents
        type: integer
        source: computed
        description: per_pax_price_cents of the final tier
        default: 0
      - name: land_cost_total_cents
        type: integer
        source: computed
        description: "USD-cent land cost from calculations.departure_land_cost_rollup (round-per-line-then-sum)"
        default: 0
      - name: itinerary_cost_delta_cents
        type: integer
        source: computed
        description: running sum of cost_delta_cents of every RATIFIED itinerary modification on this departure
        default: 0
      - name: service_coverage_ok
        type: boolean
        source: computed
        description: "true iff every ServiceBooking on this departure with status != CANCELLED numbers >= 1 and none were force-cancelled by a risk suspension"
        default: true
      - name: pending_modification_required
        type: boolean
        source: computed
        description: true while an itinerary modification awaits a ratify/reject decision; blocks close-sales
        default: false
      - name: pending_modification_reason
        type: string
        source: computed
        description: "free text or the literal RISK_SUSPENSION when the modification was raised by an advisory cascade"
        default: null
      - name: pending_modification_proposed_by_user_id
        type: string
        source: computed
        description: "X-User-ID that proposed the open modification, or null when raised by the advisory cascade; segregation-of-duties compares against the ratifier"
        default: null
      - name: pending_modification_cost_delta_cents
        type: integer
        source: computed
        description: cost delta the open modification would apply on ratification
        default: 0
      - name: ratified_modification_count
        type: integer
        source: computed
        description: number of itinerary modifications ratified on this departure
        default: 0
      - name: sweep_run_count
        type: integer
        source: computed
        description: number of times the payment sweep has run on this departure
        default: 0
      - name: last_sweep_at
        type: datetime
        source: computed
        description: logical-clock timestamp of the most recent payment sweep
        default: null

  - name: GroupLeaderAgreement
    parent: null
    common_fields: true
    fields:
      - name: departure_id
        type: string
        source: input
        description: "FK -> Departure.id; the departure this leader recruits for"
      - name: leader_name
        type: string
        source: input
        description: name of the recruiting group leader (parish/clergy contact)
        constraints: "1..120 chars"
      - name: leader_user_id
        type: string
        source: input
        description: "opaque operator-supplied identifier of the leader; uniqueness key together with departure_id for supersede semantics"
        constraints: "1..64 chars"
      - name: free_travel_threshold
        type: integer
        source: input
        description: number of recruited paying travelers that earns one free seat
        constraints: ">= 1 and <= 60"
      - name: commission_mode
        type: enum
        source: input
        description: how the leader is compensated
        constraints: "one of {PER_PAX_CASH, FREE_SEAT_CREDIT, HYBRID}"
      - name: commission_rate_cents_per_pax
        type: integer
        source: input
        description: cash commission per recruited paying traveler
        constraints: ">= 0 and <= 100000"
      - name: accrual_basis
        type: enum
        source: input
        description: which variant of calculations.leader_benefit_accrual the snapshot fields use
        default: RECRUITED
        constraints: "one of {RECRUITED, TRAVELED}"
      - name: status
        type: enum
        source: computed
        description: agreement lifecycle position
        default: PENDING_COUNTERSIGN
        constraints: "one of {PENDING_COUNTERSIGN, ACTIVE, TERMINATED, SETTLED}"
      - name: recruited_paying_count
        type: integer
        source: computed
        description: "candidate count under the snapshot variant (accrual_basis == RECRUITED) of calculations.leader_benefit_accrual"
        default: 0
      - name: earned_free_seats
        type: integer
        source: computed
        description: "floor(recruited_paying_count / free_travel_threshold)"
        default: 0
      - name: free_seats_granted_count
        type: integer
        source: computed
        description: "count of Pilgrim rows with recruited_by_agreement_id == this.id AND is_paying == false AND booking_status != CANCELLED"
        default: 0
      - name: commission_payable_cents
        type: integer
        source: computed
        description: cash commission payable under the snapshot variant
        default: 0
      - name: settled_recruited_count
        type: integer
        source: computed
        description: candidate count under the settlement variant (basis TRAVELED); written only at settle
        default: 0
      - name: settled_earned_free_seats
        type: integer
        source: computed
        description: free seats earned under the settlement variant; written only at settle
        default: 0
      - name: settled_commission_cents
        type: integer
        source: computed
        description: cash commission payable under the settlement variant; written only at settle
        default: 0
      - name: superseded_by_agreement_id
        type: string
        source: computed
        description: "FK -> GroupLeaderAgreement.id; set on the prior agreement when a newer one for the same (departure_id, leader_user_id) supersedes it"
        default: null

  - name: Pilgrim
    parent: null
    common_fields: true
    fields:
      - name: departure_id
        type: string
        source: input
        description: "FK -> Departure.id; the departure this traveler books"
      - name: recruited_by_agreement_id
        type: string
        source: input
        description: "FK -> GroupLeaderAgreement.id; the recruiting leader agreement, or null for a direct booking"
        default: null
      - name: roommate_pilgrim_id
        type: string
        source: computed
        description: "FK -> Pilgrim.id; mutual rooming partner within the same departure, or null; written only by POST /pilgrims/{pilgrimId}/rooming"
        default: null
      - name: full_name
        type: string
        source: input
        description: traveler legal name as it will appear on documents
        constraints: "1..120 chars"
      - name: date_of_birth
        type: string
        source: input
        description: "YYYY-MM-DD; drives age_at_departure and the protection age band"
        constraints: "valid ISO date strictly before Departure.departure_date"
      - name: age_at_departure
        type: integer
        source: computed
        description: "full years between date_of_birth and Departure.departure_date, floored"
        default: 0
      - name: room_type_requested
        type: enum
        source: input
        description: rooming preference captured at booking
        constraints: "one of {SINGLE, DOUBLE, TWIN}"
      - name: room_type_assigned
        type: enum
        source: computed
        description: rooming type actually assigned
        default: null
        constraints: "one of {SINGLE, DOUBLE, TWIN} or null"
      - name: room_label
        type: string
        source: computed
        description: hotel room label the traveler is assigned to within the departure
        default: null
      - name: ground_floor
        type: boolean
        source: computed
        description: whether the assigned room is on an accessible ground floor
        default: false
      - name: dietary_codes
        type: array
        source: computed
        description: "array of dietary requirement codes written by POST /pilgrims/{pilgrimId}/rooming; each item one of {NONE, VEGETARIAN, GLUTEN_FREE, KOSHER, HALAL, DIABETIC, LOW_SODIUM}"
        default: ["NONE"]
        constraints: "1..4 items, no duplicates; NONE cannot be combined with any other code"
      - name: mobility_code
        type: enum
        source: input
        description: mobility accommodation need
        default: NONE
        constraints: "one of {NONE, CANE, WALKER, WHEELCHAIR}"
      - name: risk_acknowledged
        type: boolean
        source: input
        description: traveler signed the elevated-risk acknowledgement; required to book onto a RESTRICTED departure
        default: false
      - name: is_free_seat_grant
        type: boolean
        source: input
        description: request flag marking this booking as a leader free-travel seat rather than a paying booking
        default: false
      - name: is_paying
        type: boolean
        source: computed
        description: "false while this booking occupies a leader free seat, true otherwise; recomputed by calculations.leader_benefit_accrual cascades"
        default: true
      - name: booking_status
        type: enum
        source: computed
        description: booking lifecycle dimension
        default: INQUIRY
        constraints: "one of {INQUIRY, DEPOSITED, CONFIRMED, CANCELLED}"
      - name: payment_status
        type: enum
        source: computed
        description: money dimension, independent of booking_status
        default: UNPAID
        constraints: "one of {UNPAID, DEPOSIT_PAID, PLAN_ACTIVE, PAID_IN_FULL, IN_DEFAULT, REFUNDED}"
      - name: protection_status
        type: enum
        source: computed
        description: travel-protection dimension, independent of booking_status and payment_status
        default: NONE
        constraints: "one of {NONE, QUOTED, MEDICAL_REVIEWED, WAIVER_APPROVED, WAIVER_DECLINED, PURCHASED, VOIDED}; mirrors the pilgrim's own TravelProtection.status"
      - name: price_locked_cents
        type: integer
        source: computed
        description: "per-pax price frozen at DEPOSITED -> CONFIRMED; re-frozen by a group-size repricing cascade while payment_status != PAID_IN_FULL"
        default: null
      - name: single_supplement_applied_cents
        type: integer
        source: computed
        description: single supplement charged; non-zero only when room_type_assigned == SINGLE
        default: 0
      - name: deviation_type
        type: enum
        source: computed
        description: air deviation recorded against this traveler
        default: NONE
        constraints: "one of {NONE, ORIGIN_CHANGE, DATE_DEVIATION, CLASS_UPGRADE}"
      - name: deviation_fee_cents
        type: integer
        source: computed
        description: fee from calculations.air_deviation_fee
        default: 0
      - name: invoice_total_cents
        type: integer
        source: computed
        description: "land invoice total from calculations.pilgrim_invoice_total (excludes protection premium)"
        default: 0
      - name: protection_premium_cents
        type: integer
        source: computed
        description: "premium of this traveler's TravelProtection when its status == PURCHASED, else 0"
        default: 0
      - name: cash_applied_cents
        type: integer
        source: computed
        description: "sum of Payment.amount_cents for this pilgrim with Payment.status == APPLIED"
        default: 0
      - name: credit_balance_cents
        type: integer
        source: computed
        description: applied cash not yet allocated to any installment
        default: 0
      - name: ticketed_name
        type: string
        source: computed
        description: name filed against the air block; occupying a held seat
        default: null
      - name: refund_cents
        type: integer
        source: computed
        description: refund issued at cancellation by calculations.pilgrim_cancellation_settlement
        default: 0
      - name: penalty_retained_cents
        type: integer
        source: computed
        description: cash retained as cancellation penalty
        default: 0

  - name: PaymentPlan
    parent: null
    common_fields: true
    fields:
      - name: pilgrim_id
        type: string
        source: input
        description: "FK -> Pilgrim.id; the traveler this plan bills"
      - name: plan_type
        type: enum
        source: input
        description: installment shape
        constraints: "one of {SINGLE_BALANCE, MONTHLY_3, MONTHLY_6}"
      - name: first_due_date
        type: string
        source: input
        description: "YYYY-MM-DD due date of installment 1; later installments are monthly from here"
        constraints: "valid ISO date, on or after the logical clock date, on or before Departure.final_payment_due_date"
      - name: installment_count
        type: integer
        source: computed
        description: "1 for SINGLE_BALANCE, 3 for MONTHLY_3, 6 for MONTHLY_6"
        default: 1
      - name: total_scheduled_cents
        type: integer
        source: computed
        description: Pilgrim.invoice_total_cents captured at plan creation
        default: 0
      - name: installments
        type: array
        source: computed
        description: "ordered installment ledger produced by calculations.payment_plan_schedule and mutated by calculations.payment_waterfall_allocation"
        constraints: |
          Each item is an object { sequence_no: integer (1-based, ascending, contiguous),
          due_date: string YYYY-MM-DD, amount_due_cents: integer,
          amount_paid_cents: integer, status: one of {SCHEDULED, PARTIALLY_PAID, PAID, PAST_DUE, WAIVED} }.
      - name: past_due_count
        type: integer
        source: computed
        description: number of items in installments with status == PAST_DUE
        default: 0
      - name: status
        type: enum
        source: computed
        description: plan lifecycle position
        default: ACTIVE
        constraints: "one of {ACTIVE, COMPLETED, DEFAULTED, SUPERSEDED}"
      - name: superseded_by_plan_id
        type: string
        source: computed
        description: "FK -> PaymentPlan.id; set on the prior plan when a replacement plan is created for the same pilgrim"
        default: null

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: pilgrim_id
        type: string
        source: input
        description: "FK -> Pilgrim.id; the traveler whose ledger this cash lands on"
      - name: amount_cents
        type: integer
        source: input
        description: cash amount received
        constraints: ">= 1"
      - name: method
        type: enum
        source: input
        description: tender type
        constraints: "one of {CARD, ACH, CHECK, PARISH_TRANSFER}"
      - name: received_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the cash was received; must be <= the logical clock"
      - name: status
        type: enum
        source: computed
        description: whether this cash still counts toward the pilgrim's applied total
        default: APPLIED
        constraints: "one of {APPLIED, REVERSED}"
      - name: allocation
        type: array
        source: computed
        description: |
          audit of where this payment landed; each item is an object
          { target: one of {INSTALLMENT, CREDIT}, sequence_no: integer or null, amount_cents: integer }.
          Written by calculations.payment_waterfall_allocation and consumed in reverse order on reversal.
      - name: reversed_at
        type: datetime
        source: computed
        description: logical-clock instant the reversal was recorded
        default: null

  - name: AirBlock
    parent: null
    common_fields: true
    fields:
      - name: departure_id
        type: string
        source: input
        description: "FK -> Departure.id; the departure this seat block serves"
      - name: carrier_code
        type: string
        source: input
        description: "IATA carrier code"
        constraints: "exactly 2 uppercase alphanumeric characters"
      - name: seats_held
        type: integer
        source: input
        description: seats the carrier is holding for the group
        constraints: ">= 1 and <= 400"
      - name: offered_fare_cents
        type: integer
        source: computed
        description: "fare per seat in the carrier's most recent offer; written by POST /air-blocks/{airBlockId}/negotiation-rounds with party = CARRIER_OFFER"
        default: 0
      - name: countered_fare_cents
        type: integer
        source: computed
        description: fare per seat in the operator's most recent counter
        default: null
      - name: contracted_fare_cents
        type: integer
        source: computed
        description: fare per seat frozen at confirmation
        default: null
      - name: negotiation_round
        type: integer
        source: computed
        description: increments by 1 on every carrier offer, including re-offers after a counter
        default: 0
      - name: name_change_deadline_utc
        type: datetime
        source: input
        description: "ISO 8601 UTC instant after which ticketed names may no longer be written"
      - name: deposit_deadline_utc
        type: datetime
        source: input
        description: "ISO 8601 UTC instant by which the block deposit is due; an OFFERED block past this instant expires on the next write"
      - name: seats_assigned
        type: integer
        source: computed
        description: "count of Pilgrim rows with departure_id == this.departure_id AND ticketed_name IS NOT NULL AND booking_status IN {DEPOSITED, CONFIRMED}"
        default: 0
      - name: status
        type: enum
        source: computed
        description: negotiation/lifecycle position
        default: DRAFT
        constraints: "one of {DRAFT, OFFERED, COUNTERED, CONFIRMED, RELEASED, EXPIRED}"

  - name: SacredSite
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: sacred site name
        constraints: "1..160 chars"
      - name: country
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country the site is in"
        constraints: "exactly 2 uppercase letters"
      - name: access_regime
        type: enum
        source: input
        description: how access is granted
        constraints: "one of {OPEN_ACCESS, PERMIT_REQUIRED, TICKETED_SLOT}"
      - name: daily_capacity_pax
        type: integer
        source: input
        description: maximum group pax the site admits per calendar day
        constraints: ">= 1 and <= 5000"
      - name: turnaround_buffer_minutes
        type: integer
        source: input
        description: minutes appended to the END of every booked service interval before the next group may start
        constraints: ">= 0 and <= 240"
      - name: requires_local_clergy
        type: boolean
        source: input
        description: whether a service at this site needs a named local celebrant before it may be confirmed
        default: false

  - name: ServiceBooking
    parent: null
    common_fields: true
    fields:
      - name: departure_id
        type: string
        source: input
        description: "FK -> Departure.id; the departure whose itinerary contains this service"
      - name: sacred_site_id
        type: string
        source: input
        description: "FK -> SacredSite.id; the site hosting the service"
      - name: service_type
        type: enum
        source: input
        description: kind of service scheduled
        constraints: "one of {MASS, LITURGY, PRAYER_SERVICE, GUIDED_VISIT}"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "ISO 8601 UTC start instant of the service"
      - name: duration_minutes
        type: integer
        source: input
        description: service length excluding the site turnaround buffer
        constraints: ">= 10 and <= 480"
      - name: buffered_end_utc
        type: datetime
        source: computed
        description: "scheduled_start_utc + duration_minutes + SacredSite.turnaround_buffer_minutes; the exclusive end of the occupied half-open interval"
      - name: pax_count
        type: integer
        source: input
        description: travelers attending, charged against the site's daily capacity
        constraints: ">= 1"
      - name: permit_reference
        type: string
        source: input
        description: "site permit or slot reference; optional at creation and required before POST /service-bookings/{serviceBookingId}/confirm when SacredSite.access_regime == PERMIT_REQUIRED"
        default: null
      - name: clergy_contact_name
        type: string
        source: computed
        description: named local celebrant recorded at clergy confirmation
        default: null
      - name: clergy_tradition
        type: enum
        source: computed
        description: tradition of the named celebrant
        default: null
        constraints: "one of {CATHOLIC, ORTHODOX, PROTESTANT, JEWISH, MUSLIM, INTERFAITH} or null"
      - name: status
        type: enum
        source: computed
        description: service booking lifecycle position
        default: SITE_HELD
        constraints: "one of {SITE_HELD, CLERGY_CONFIRMED, CONFIRMED, CANCELLED}"
      - name: cancelled_by_risk
        type: boolean
        source: computed
        description: true when this booking was cancelled by a risk-suspension cascade rather than by an operator
        default: false

  - name: LandResource
    parent: null
    common_fields: true
    fields:
      - name: operator_name
        type: string
        source: input
        description: land operator (DMC) holding this resource under contract
        constraints: "1..120 chars"
      - name: country
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country of performance; determines local conditions"
        constraints: "exactly 2 uppercase letters"
      - name: resource_type
        type: enum
        source: input
        description: kind of land capacity
        constraints: "one of {HOTEL_ROOM_BLOCK, MOTORCOACH, GUIDE}"
      - name: units_total
        type: integer
        source: input
        description: units the operator guarantees per calendar day
        constraints: ">= 1 and <= 500"
      - name: unit_rate_local_cents
        type: integer
        source: input
        description: local-currency minor units charged per unit per day
        constraints: ">= 1"
      - name: fx_rate_bp
        type: integer
        source: input
        description: "local-to-USD conversion in basis points (10000 == parity); pinned per resource contract"
        constraints: ">= 1 and <= 1000000"
      - name: force_majeure_notice_days
        type: integer
        source: input
        description: local-conditions notice window for penalty-free termination under force majeure
        constraints: ">= 0 and <= 180"

  - name: LandAssignment
    parent: null
    common_fields: true
    fields:
      - name: land_resource_id
        type: string
        source: input
        description: "FK -> LandResource.id; the capacity pool being drawn down"
      - name: departure_id
        type: string
        source: input
        description: "FK -> Departure.id; the departure consuming the capacity"
      - name: date_from
        type: string
        source: input
        description: "first occupied calendar date, YYYY-MM-DD (interval is CLOSED-inclusive at both ends)"
      - name: date_to
        type: string
        source: input
        description: "last occupied calendar date, YYYY-MM-DD; must be >= date_from"
      - name: units_requested
        type: integer
        source: input
        description: units drawn from the pool for every date in the closed interval
        constraints: ">= 1"
      - name: days_inclusive
        type: integer
        source: computed
        description: "(date_to - date_from) in days + 1; the closed-interval day count used for billing"
        default: 1
      - name: line_local_cents
        type: integer
        source: computed
        description: "units_requested * days_inclusive * LandResource.unit_rate_local_cents"
        default: 0
      - name: line_usd_cents
        type: integer
        source: computed
        description: "round_half_up(line_local_cents * LandResource.fx_rate_bp / 10000); the per-line rounded figure that the rollup sums"
        default: 0
      - name: status
        type: enum
        source: computed
        description: contracting lifecycle position
        default: DRAFT
        constraints: "one of {DRAFT, COUNTERSIGNED, TERMINATED}"
      - name: terminated_penalty_free
        type: boolean
        source: computed
        description: whether termination fell inside LandResource.force_majeure_notice_days of date_from
        default: false

  - name: TravelProtection
    parent: null
    common_fields: true
    fields:
      - name: pilgrim_id
        type: string
        source: input
        description: "FK -> Pilgrim.id; the insured traveler"
      - name: plan_code
        type: enum
        source: input
        description: protection product selected
        constraints: "one of {BASIC, STANDARD, PREMIER}"
      - name: medical_limit_cents
        type: integer
        source: input
        description: emergency medical coverage limit; above MEDICAL_UPLIFT_THRESHOLD_CENTS it triggers the medical uplift
        constraints: ">= 100000"
      - name: pre_existing_waiver_requested
        type: boolean
        source: input
        description: traveler asked for the pre-existing condition exclusion waiver
        default: false
      - name: insured_trip_cost_cents
        type: integer
        source: computed
        description: Pilgrim.invoice_total_cents captured at quote time
        default: 0
      - name: age_band
        type: enum
        source: computed
        description: "band from Pilgrim.age_at_departure; A <= 39, B 40..64, C 65..74, D >= 75"
        default: A
        constraints: "one of {A, B, C, D}"
      - name: base_premium_cents
        type: integer
        source: computed
        description: age-banded premium before uplifts
        default: 0
      - name: medical_uplift_cents
        type: integer
        source: computed
        description: uplift charged when medical_limit_cents exceeds the threshold
        default: 0
      - name: waiver_surcharge_cents
        type: integer
        source: computed
        description: capped surcharge charged when an eligible pre-existing waiver is granted
        default: 0
      - name: premium_cents
        type: integer
        source: computed
        description: "base_premium_cents + medical_uplift_cents + waiver_surcharge_cents"
        default: 0
      - name: questionnaire_complete
        type: boolean
        source: computed
        description: medical questionnaire recorded
        default: false
      - name: stable_period_days
        type: integer
        source: computed
        description: days the traveler's pre-existing condition has been medically stable
        default: 0
      - name: medical_review_by_user_id
        type: string
        source: computed
        description: "X-User-ID that recorded the medical review; the waiver decider MUST differ from this value"
        default: null
      - name: waiver_eligible
        type: boolean
        source: computed
        description: "see calculations.waiver_eligibility; questionnaire complete, stable period met, and inside the post-deposit purchase window"
        default: false
      - name: status
        type: enum
        source: computed
        description: protection record lifecycle position
        default: QUOTED
        constraints: "one of {QUOTED, MEDICAL_REVIEWED, WAIVER_APPROVED, WAIVER_DECLINED, PURCHASED, VOIDED}"
      - name: deposit_reference_date
        type: string
        source: computed
        description: "YYYY-MM-DD calendar date of the pilgrim's INQUIRY -> DEPOSITED transition; anchors the waiver purchase window"
        default: null

  - name: RiskAdvisory
    parent: null
    common_fields: true
    fields:
      - name: country
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country the advisory covers; joins Program.destination_country"
        constraints: "exactly 2 uppercase letters"
      - name: level
        type: enum
        source: input
        description: advisory severity
        constraints: "one of {NORMAL, EXERCISE_CAUTION, RECONSIDER, DO_NOT_TRAVEL}"
      - name: effective_from
        type: datetime
        source: input
        description: "ISO 8601 UTC instant from which the advisory governs posture; an advisory whose effective_from is after the logical clock does not yet govern"
      - name: source
        type: string
        source: input
        description: issuing authority reference
        constraints: "1..120 chars"
      - name: status
        type: enum
        source: computed
        description: advisory lifecycle position
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, SUPERSEDED}"
      - name: affected_departure_count
        type: integer
        source: computed
        description: number of Departure rows whose risk_posture was recomputed by this advisory's publication
        default: 0

state_machines:
  - entity: Departure
    initial_state: PLANNING
    terminal_states: [OPERATED, CANCELLED]
    transitions:
      - from: PLANNING
        to: OPEN_FOR_SALE
        trigger: "POST /departures/{departureId}/open-sales"
        actor: ProgramManager
        preconditions:
          - "departure.status == PLANNING"
          - "risk_posture IN {OPEN, WATCH, RESTRICTED} (SUSPENDED -> ERR_DEPARTURE_SUSPENDED_NO_NEW_BOOKINGS)"
          - "count(ServiceBooking where departure_id == departure.id AND status != CANCELLED) >= 1 (else ERR_DEPARTURE_INVALID_STATE)"
        side_effects:
          - "recompute Departure.paying_pax_count, provisional_tier_code, provisional_per_pax_price_cents, provisional_single_supplement_cents, provisional_deposit_cents via calculations.departure_group_size_tier (provisional variant)"
          - "increments Departure.version by 1"
      - from: OPEN_FOR_SALE
        to: SALES_CLOSED
        trigger: "POST /departures/{departureId}/close-sales"
        actor: ProgramManager
        preconditions:
          - "departure.status == OPEN_FOR_SALE"
          - "departure.pending_modification_required == false (else ERR_PENDING_MODIFICATION_UNRATIFIED)"
          - "count(Pilgrim where departure_id == departure.id AND is_paying == true AND booking_status == CONFIRMED AND payment_status == PAID_IN_FULL) >= departure.min_pax (else ERR_MIN_PAX_NOT_MET)"
          - "a price tier of Program.price_tiers contains that count (else ERR_NO_APPLICABLE_PRICE_TIER)"
        side_effects:
          - "writes Departure.final_tier_code and Departure.final_per_pax_price_cents via calculations.departure_group_size_tier (final variant)"
          - "recomputes Departure.land_cost_total_cents via calculations.departure_land_cost_rollup"
          - "increments Departure.version by 1"
        note: "This is the only writer of the final variant; the provisional fields are left untouched so the two variants remain independently observable."
      - from: SALES_CLOSED
        to: OPEN_FOR_SALE
        trigger: "POST /departures/{departureId}/open-sales"
        actor: ProgramManager
        preconditions:
          - "departure.status == SALES_CLOSED"
          - "risk_posture IN {OPEN, WATCH, RESTRICTED}"
          - "count(ServiceBooking where departure_id == departure.id AND status != CANCELLED) >= 1"
        side_effects:
          - "clears Departure.final_tier_code to null and Departure.final_per_pax_price_cents to 0"
          - "recomputes the provisional tier fields via calculations.departure_group_size_tier (provisional variant)"
          - "increments Departure.version by 1"
        note: "Reopen loop: SALES_CLOSED -> OPEN_FOR_SALE -> SALES_CLOSED may repeat; each close-sales re-derives the final variant from scratch."
      - from: SALES_CLOSED
        to: OPERATED
        trigger: "POST /departures/{departureId}/payment-sweep with the logical clock at or after departure_date"
        actor: FinanceController
        preconditions:
          - "departure.status == SALES_CLOSED"
          - "date(clock_now) >= departure.departure_date"
        side_effects:
          - "runs the past-due sweep described on the PaymentPlan machine, then sets status OPERATED"
          - "increments Departure.sweep_run_count by 1 and sets last_sweep_at to clock_now"
          - "increments Departure.version by 1"
      - from: "PLANNING | OPEN_FOR_SALE | SALES_CLOSED"
        to: CANCELLED
        trigger: "POST /departures/{departureId}/cancel"
        actor: RiskOfficer
        preconditions:
          - "departure.status IN {PLANNING, OPEN_FOR_SALE, SALES_CLOSED}"
        side_effects:
          - "cascade hop 1: every Pilgrim with booking_status IN {INQUIRY, DEPOSITED, CONFIRMED} moves to CANCELLED with payment_status REFUNDED and refund_cents computed by calculations.pilgrim_cancellation_settlement using penalty_bp = 0 (operator-initiated cancellation is always penalty-free)"
          - "cascade hop 2: because those pilgrims cancelled, every PaymentPlan of each with status == ACTIVE moves to SUPERSEDED and each of its installments with status IN {SCHEDULED, PARTIALLY_PAID, PAST_DUE} moves to WAIVED"
          - "cascade hop 3: because those pilgrims cancelled, every GroupLeaderAgreement with departure_id == departure.id and status IN {PENDING_COUNTERSIGN, ACTIVE} moves to TERMINATED with recruited_paying_count, earned_free_seats and commission_payable_cents recomputed to 0"
          - "every ServiceBooking with status != CANCELLED moves to CANCELLED with cancelled_by_risk = false, releasing SacredSite daily capacity and its buffered interval"
          - "every AirBlock with status IN {DRAFT, OFFERED, COUNTERED} moves to EXPIRED; with status == CONFIRMED moves to RELEASED"
          - "every LandAssignment with status IN {DRAFT, COUNTERSIGNED} moves to TERMINATED, releasing LandResource units; terminated_penalty_free = (date_from - date(clock_now) in days) >= LandResource.force_majeure_notice_days"
          - "increments Departure.version by 1"

  - entity: Pilgrim
    initial_state: "booking_status = INQUIRY, payment_status = UNPAID, protection_status = NONE"
    terminal_states: ["booking_status = CANCELLED"]
    transitions:
      - from: "booking_status = <none> (row creation)"
        to: "booking_status = INQUIRY"
        trigger: "POST /pilgrims"
        actor: "ProgramManager | GroupLeader"
        preconditions:
          - "departure.status IN {PLANNING, OPEN_FOR_SALE}"
          - "departure.risk_posture != SUSPENDED (else ERR_DEPARTURE_SUSPENDED_NO_NEW_BOOKINGS)"
          - "if departure.risk_posture == RESTRICTED then risk_acknowledged == true (else ERR_RISK_ACKNOWLEDGEMENT_REQUIRED)"
          - "if mobility_code IN {WHEELCHAIR, WALKER} then departure.mobility_accessible_coach == true (else ERR_MOBILITY_UNSUPPORTED)"
          - "if recruited_by_agreement_id is not null then that agreement.departure_id == departure_id AND agreement.status IN {PENDING_COUNTERSIGN, ACTIVE} (else ERR_AGREEMENT_DEPARTURE_MISMATCH)"
          - "if is_free_seat_grant == true then recruited_by_agreement_id is not null AND agreement.earned_free_seats > agreement.free_seats_granted_count (else ERR_NO_EARNED_FREE_SEAT)"
          - "count(Pilgrim where departure_id == departure_id AND booking_status != CANCELLED) < departure.max_pax (else ERR_DEPARTURE_INVALID_STATE)"
        side_effects:
          - "is_paying = NOT is_free_seat_grant; age_at_departure computed from date_of_birth and departure.departure_date"
          - "if is_free_seat_grant == true, increments the agreement's free_seats_granted_count"
          - "recomputes the recruiting agreement's recruited_paying_count / earned_free_seats / commission_payable_cents via calculations.leader_benefit_accrual (snapshot variant)"
      - from: "booking_status = INQUIRY"
        to: "booking_status = DEPOSITED"
        trigger: "POST /pilgrims/{pilgrimId}/payments where the payment brings cash_applied_cents to >= departure.provisional_deposit_cents"
        actor: FinanceController
        preconditions:
          - "pilgrim.booking_status == INQUIRY"
          - "pilgrim.is_paying == true (free-seat grants skip straight to CONFIRMED via the confirm endpoint)"
        side_effects:
          - "payment_status UNPAID -> DEPOSIT_PAID"
          - "sets the pilgrim's TravelProtection.deposit_reference_date (when a protection row exists) to date(clock_now); anchors calculations.waiver_eligibility"
          - "recomputes departure.paying_pax_count and the provisional tier fields"
          - "recomputes AirBlock.seats_assigned for the departure's air blocks"
      - from: "booking_status = DEPOSITED"
        to: "booking_status = CONFIRMED"
        trigger: "POST /pilgrims/{pilgrimId}/confirm"
        actor: ProgramManager
        preconditions:
          - "pilgrim.booking_status == DEPOSITED OR (pilgrim.is_paying == false AND pilgrim.booking_status == INQUIRY)"
          - "departure.status == OPEN_FOR_SALE"
          - "departure.risk_posture != SUSPENDED"
          - "if pilgrim.age_at_departure >= SENIOR_PROTECTION_AGE then a TravelProtection with pilgrim_id == pilgrim.id and status == PURCHASED exists (else ERR_SENIOR_PROTECTION_REQUIRED)"
          - "pilgrim.room_type_assigned is not null (else ERR_PILGRIM_NOT_ACTIVE)"
        side_effects:
          - "price_locked_cents = departure.provisional_per_pax_price_cents"
          - "recomputes invoice_total_cents via calculations.pilgrim_invoice_total"
          - "recomputes departure.paying_pax_count and the provisional tier fields"
          - "recomputes the recruiting agreement's snapshot fields via calculations.leader_benefit_accrual"
      - from: "booking_status IN {INQUIRY, DEPOSITED, CONFIRMED}"
        to: "booking_status = CANCELLED"
        trigger: "POST /pilgrims/{pilgrimId}/cancel"
        actor: ProgramManager
        preconditions:
          - "pilgrim.booking_status != CANCELLED (else ERR_PILGRIM_NOT_ACTIVE)"
        side_effects:
          - "computes refund_cents and penalty_retained_cents via calculations.pilgrim_cancellation_settlement; payment_status -> REFUNDED"
          - "clears ticketed_name to null, which decrements AirBlock.seats_assigned for the departure's blocks"
          - "clears room_label / room_type_assigned / ground_floor and, when roommate_pilgrim_id was set, clears the partner's roommate_pilgrim_id and recomputes that partner's single_supplement_applied_cents and invoice_total_cents"
          - "cascade hop 1: because the pilgrim cancelled, its PaymentPlan with status == ACTIVE moves to SUPERSEDED and every installment with status IN {SCHEDULED, PARTIALLY_PAID, PAST_DUE} moves to WAIVED"
          - "cascade hop 1 (second limb): its TravelProtection with status NOT IN {PURCHASED, VOIDED} moves to VOIDED with premium_cents, base_premium_cents, medical_uplift_cents and waiver_surcharge_cents all zeroed, and pilgrim.protection_status -> VOIDED"
          - "cascade hop 2: because the pilgrim is no longer a paying recruit, the recruiting GroupLeaderAgreement's recruited_paying_count and earned_free_seats are recomputed; when earned_free_seats becomes < free_seats_granted_count, the free-seat Pilgrim rows granted under it (ordered by created_at DESC) are flipped to is_paying = true one at a time until free_seats_granted_count <= earned_free_seats, and each flipped row gets price_locked_cents = departure.provisional_per_pax_price_cents plus a recomputed invoice_total_cents"
          - "cascade hop 3: because departure.paying_pax_count changed, the provisional tier fields are recomputed; when provisional_per_pax_price_cents changed, every Pilgrim on the departure with booking_status IN {DEPOSITED, CONFIRMED} AND payment_status != PAID_IN_FULL is re-priced (price_locked_cents re-frozen to the new provisional price, single_supplement_applied_cents re-read from provisional_single_supplement_cents when room_type_assigned == SINGLE, invoice_total_cents recomputed) — ordered by created_at ASC"
      - from: "payment_status = DEPOSIT_PAID"
        to: "payment_status = PLAN_ACTIVE"
        trigger: "POST /pilgrims/{pilgrimId}/payment-plans"
        actor: FinanceController
        preconditions:
          - "pilgrim.booking_status IN {DEPOSITED, CONFIRMED}"
          - "pilgrim.invoice_total_cents > 0"
          - "expected_pilgrim_version == pilgrim.version (else ERR_STALE_PILGRIM_VERSION)"
        side_effects:
          - "any prior PaymentPlan with status == ACTIVE moves to SUPERSEDED, its installments' amount_paid_cents are summed back into pilgrim.credit_balance_cents and its installments move to WAIVED, and superseded_by_plan_id is set to the new plan"
          - "the new plan's installments are generated by calculations.payment_plan_schedule, then pilgrim.credit_balance_cents is drained into them by calculations.payment_waterfall_allocation"
          - "increments Pilgrim.version by 1"
        note: "payment_status stays PLAN_ACTIVE unless the drained credit already covers the schedule, in which case it becomes PAID_IN_FULL in the same request."
      - from: "payment_status IN {DEPOSIT_PAID, PLAN_ACTIVE, IN_DEFAULT}"
        to: "payment_status = PAID_IN_FULL"
        trigger: "POST /pilgrims/{pilgrimId}/payments where the allocation leaves every installment PAID"
        actor: FinanceController
        preconditions:
          - "pilgrim.booking_status != CANCELLED (else ERR_PILGRIM_NOT_ACTIVE)"
          - "amount_cents <= invoice_total_cents + protection_premium_cents - cash_applied_cents (else ERR_OVERPAYMENT_NOT_ALLOWED)"
        side_effects:
          - "allocates by calculations.payment_waterfall_allocation; the plan's status becomes COMPLETED when every installment is PAID"
          - "recomputes departure.paying_pax_count-derived provisional tier fields is NOT performed here (payment does not change the paying set)"
      - from: "payment_status IN {PLAN_ACTIVE, PAID_IN_FULL}"
        to: "payment_status IN {PLAN_ACTIVE, DEPOSIT_PAID}"
        trigger: "POST /payments/{paymentId}/reverse"
        actor: FinanceController
        preconditions:
          - "payment.status == APPLIED (else ERR_PAYMENT_ALREADY_REVERSED)"
          - "pilgrim.booking_status != CANCELLED (else ERR_PILGRIM_NOT_ACTIVE)"
        side_effects:
          - "un-allocates the payment by walking payment.allocation in reverse order (CREDIT entries first, then INSTALLMENT entries by sequence_no DESC), restoring the compensating invariant named in calculations.pilgrim_cash_conservation"
          - "payment.status -> REVERSED, payment.reversed_at = clock_now; pilgrim.cash_applied_cents decreases by payment.amount_cents"
          - "payment_status is re-derived: PAID_IN_FULL only while every installment is PAID; otherwise PLAN_ACTIVE when an ACTIVE plan exists; otherwise DEPOSIT_PAID when cash_applied_cents >= departure.provisional_deposit_cents; otherwise UNPAID"
      - from: "protection_status = NONE"
        to: "protection_status = QUOTED"
        trigger: "POST /travel-protections"
        actor: ProtectionAdministrator
        preconditions:
          - "pilgrim.booking_status IN {INQUIRY, DEPOSITED, CONFIRMED}"
          - "no TravelProtection with pilgrim_id == pilgrim.id and status IN {QUOTED, MEDICAL_REVIEWED, PURCHASED} exists (else ERR_PROTECTION_INVALID_STATE)"
        side_effects:
          - "quotes the premium via calculations.protection_premium; writes protection_status = QUOTED on the Pilgrim"
        note: "This dimension advances independently of booking_status and payment_status; a QUOTED protection may sit on an INQUIRY pilgrim with payment_status UNPAID."
      - from: "protection_status = QUOTED"
        to: "protection_status = MEDICAL_REVIEWED"
        trigger: "POST /travel-protections/{travelProtectionId}/medical-review"
        actor: ProtectionAdministrator
        preconditions:
          - "protection.status == QUOTED (else ERR_PROTECTION_INVALID_STATE)"
        side_effects:
          - "records questionnaire_complete, stable_period_days and medical_review_by_user_id = X-User-ID; protection.status -> MEDICAL_REVIEWED"
          - "recomputes waiver_eligible via calculations.waiver_eligibility and re-quotes the premium via calculations.protection_premium"
      - from: "protection_status = MEDICAL_REVIEWED"
        to: "protection_status IN {WAIVER_APPROVED, WAIVER_DECLINED}"
        trigger: "POST /travel-protections/{travelProtectionId}/waiver-decision"
        actor: ProtectionAdministrator
        preconditions:
          - "protection.status == MEDICAL_REVIEWED"
          - "X-User-ID != protection.medical_review_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "if decision == APPROVE then protection.waiver_eligible == true (else ERR_WAIVER_NOT_ELIGIBLE)"
        side_effects:
          - "decision APPROVE: protection.status -> WAIVER_APPROVED, pilgrim.protection_status -> WAIVER_APPROVED, waiver_surcharge_cents recomputed and premium_cents refreshed"
          - "decision DECLINE: protection.status -> WAIVER_DECLINED, pilgrim.protection_status -> WAIVER_DECLINED, waiver_surcharge_cents forced to 0 and premium_cents refreshed"
      - from: "protection_status IN {QUOTED, WAIVER_APPROVED, WAIVER_DECLINED}"
        to: "protection_status = PURCHASED"
        trigger: "POST /travel-protections/{travelProtectionId}/purchase"
        actor: ProtectionAdministrator
        preconditions:
          - "protection.status IN {QUOTED, WAIVER_APPROVED, WAIVER_DECLINED} (else ERR_PROTECTION_INVALID_STATE)"
          - "pilgrim.booking_status IN {INQUIRY, DEPOSITED, CONFIRMED}"
          - "if protection.pre_existing_waiver_requested == true then protection.status != QUOTED (else ERR_PROTECTION_INVALID_STATE)"
        side_effects:
          - "protection.status -> PURCHASED; pilgrim.protection_status -> PURCHASED; pilgrim.protection_premium_cents = protection.premium_cents"

  - entity: AirBlock
    initial_state: DRAFT
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /air-blocks/{airBlockId}/negotiation-rounds with party = CARRIER_OFFER"
        actor: AirDeskAgent
        preconditions:
          - "air_block.status == DRAFT"
          - "departure.status IN {PLANNING, OPEN_FOR_SALE}"
        side_effects:
          - "offered_fare_cents and name_change_deadline_utc overwritten from the payload; negotiation_round += 1"
          - "increments AirBlock.version by 1"
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /air-blocks/{airBlockId}/negotiation-rounds with party = OPERATOR_COUNTER"
        actor: AirDeskAgent
        preconditions:
          - "air_block.status == OFFERED"
          - "fare_cents < air_block.offered_fare_cents (a counter must improve on the standing offer, else ERR_AIR_BLOCK_INVALID_STATE)"
        side_effects:
          - "countered_fare_cents = fare_cents; seats_held overwritten from requested_seats when supplied"
          - "increments AirBlock.version by 1"
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /air-blocks/{airBlockId}/negotiation-rounds with party = CARRIER_OFFER"
        actor: AirDeskAgent
        preconditions:
          - "air_block.status == COUNTERED"
        side_effects:
          - "offered_fare_cents and name_change_deadline_utc overwritten from the payload; negotiation_round += 1"
          - "increments AirBlock.version by 1"
        note: "Cycle: OFFERED -> COUNTERED -> OFFERED may repeat without bound; negotiation_round counts only carrier offers."
      - from: OFFERED
        to: CONFIRMED
        trigger: "POST /air-blocks/{airBlockId}/confirm"
        actor: AirDeskAgent
        preconditions:
          - "air_block.status == OFFERED"
          - "clock_now <= air_block.deposit_deadline_utc (else the block moves to EXPIRED and the call fails with ERR_AIR_BLOCK_INVALID_STATE)"
          - "no other AirBlock on the same departure has status == CONFIRMED (else ERR_AIR_BLOCK_INVALID_STATE)"
        side_effects:
          - "contracted_fare_cents = offered_fare_cents; recomputes seats_assigned"
          - "increments AirBlock.version by 1"
      - from: OFFERED
        to: EXPIRED
        trigger: "system, evaluated on any write against the block once clock_now > deposit_deadline_utc"
        actor: system
        preconditions:
          - "air_block.status IN {DRAFT, OFFERED, COUNTERED}"
          - "clock_now > air_block.deposit_deadline_utc"
        side_effects:
          - "increments AirBlock.version by 1"
      - from: CONFIRMED
        to: RELEASED
        trigger: "system, cascaded from POST /departures/{departureId}/cancel"
        actor: system
        preconditions:
          - "air_block.status == CONFIRMED"
        side_effects:
          - "clears every Pilgrim.ticketed_name on the departure; seats_assigned -> 0"
          - "increments AirBlock.version by 1"

  - entity: ServiceBooking
    initial_state: SITE_HELD
    terminal_states: [CANCELLED]
    transitions:
      - from: "<none> (row creation)"
        to: SITE_HELD
        trigger: "POST /service-bookings"
        actor: ProgramManager
        preconditions:
          - "departure.status IN {PLANNING, OPEN_FOR_SALE} (else ERR_DEPARTURE_INVALID_STATE)"
          - "sacred_site.country == program.destination_country (else ERR_SERVICE_BOOKING_INVALID_STATE)"
          - "if sacred_site.access_regime != OPEN_ACCESS then permit_reference is a non-empty string (else ERR_PERMIT_REFERENCE_REQUIRED)"
          - "the buffered half-open interval does not collide with another booking at the same site per validations[priority=60] (else ERR_SITE_SLOT_CONFLICT)"
          - "the site's aggregate daily pax for date(scheduled_start_utc) stays <= daily_capacity_pax (else ERR_SITE_DAILY_CAPACITY_EXCEEDED)"
        side_effects:
          - "buffered_end_utc = scheduled_start_utc + duration_minutes + sacred_site.turnaround_buffer_minutes"
          - "occupies pax_count of the site's daily capacity, decreasing the free capacity tracked by calculations.site_capacity_conservation"
      - from: SITE_HELD
        to: CLERGY_CONFIRMED
        trigger: "POST /service-bookings/{serviceBookingId}/clergy-confirm"
        actor: ProgramManager
        preconditions:
          - "service_booking.status == SITE_HELD"
          - "sacred_site.requires_local_clergy == true (else ERR_SERVICE_BOOKING_INVALID_STATE)"
          - "clergy_tradition == program.faith_tradition OR program.faith_tradition == INTERFAITH (else ERR_CLERGY_NOT_CONFIRMED)"
        side_effects:
          - "records clergy_contact_name and clergy_tradition"
      - from: "SITE_HELD | CLERGY_CONFIRMED"
        to: CONFIRMED
        trigger: "POST /service-bookings/{serviceBookingId}/confirm"
        actor: ProgramManager
        preconditions:
          - "if sacred_site.requires_local_clergy == true then service_booking.status == CLERGY_CONFIRMED (else ERR_CLERGY_NOT_CONFIRMED)"
          - "if sacred_site.requires_local_clergy == false then service_booking.status == SITE_HELD (else ERR_SERVICE_BOOKING_INVALID_STATE)"
          - "departure.risk_posture IN {OPEN, WATCH} (else ERR_DEPARTURE_POSTURE_BLOCKS_CONFIRM)"
        side_effects:
          - "sets Departure.service_coverage_ok = true when no risk-cancelled booking remains on the departure"
      - from: "SITE_HELD | CLERGY_CONFIRMED | CONFIRMED"
        to: CANCELLED
        trigger: "POST /service-bookings/{serviceBookingId}/cancel"
        actor: ProgramManager
        preconditions:
          - "service_booking.status != CANCELLED (else ERR_SERVICE_BOOKING_INVALID_STATE)"
        side_effects:
          - "releases pax_count of the site's daily capacity and vacates the buffered interval, restoring calculations.site_capacity_conservation to its pre-hold value"
          - "cancelled_by_risk = false"
      - from: "SITE_HELD | CLERGY_CONFIRMED | CONFIRMED"
        to: CANCELLED
        trigger: "system, cascaded from POST /risk-advisories/{riskAdvisoryId}/publish when the departure's posture becomes SUSPENDED"
        actor: system
        preconditions:
          - "service_booking.status != CANCELLED"
          - "departure.risk_posture == SUSPENDED"
        side_effects:
          - "cancelled_by_risk = true; releases pax_count of the site's daily capacity and vacates the buffered interval"
          - "because at least one booking was risk-cancelled, sets Departure.service_coverage_ok = false"

  - entity: LandAssignment
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: "<none> (row creation)"
        to: DRAFT
        trigger: "POST /land-assignments"
        actor: LandContractor
        preconditions:
          - "departure.status IN {PLANNING, OPEN_FOR_SALE, SALES_CLOSED} (else ERR_DEPARTURE_INVALID_STATE)"
          - "land_resource.country == program.destination_country (else ERR_LAND_ASSIGNMENT_INVALID_STATE)"
          - "date_to >= date_from"
          - "for every calendar date in the CLOSED interval [date_from, date_to], the aggregate occupancy check of validations[priority=61] holds (else ERR_LAND_RESOURCE_OVERSUBSCRIBED)"
        side_effects:
          - "days_inclusive, line_local_cents and line_usd_cents computed per calculations.departure_land_cost_rollup line rules"
          - "occupies units_requested of the resource on every date of the closed interval"
      - from: DRAFT
        to: COUNTERSIGNED
        trigger: "POST /land-assignments/{landAssignmentId}/countersign"
        actor: LandContractor
        preconditions:
          - "land_assignment.status == DRAFT"
          - "departure.status != CANCELLED"
        side_effects:
          - "recomputes Departure.land_cost_total_cents via calculations.departure_land_cost_rollup (only COUNTERSIGNED lines enter the rollup)"
          - "increments LandAssignment.version by 1"
      - from: "DRAFT | COUNTERSIGNED"
        to: TERMINATED
        trigger: "POST /land-assignments/{landAssignmentId}/terminate"
        actor: LandContractor
        preconditions:
          - "land_assignment.status IN {DRAFT, COUNTERSIGNED} (else ERR_LAND_ASSIGNMENT_INVALID_STATE)"
        side_effects:
          - "terminated_penalty_free = ((date_from - date(clock_now)) in days >= land_resource.force_majeure_notice_days)"
          - "releases units_requested on every date of the closed interval"
          - "recomputes Departure.land_cost_total_cents"

  - entity: GroupLeaderAgreement
    initial_state: PENDING_COUNTERSIGN
    terminal_states: [TERMINATED, SETTLED]
    transitions:
      - from: "<none> (row creation)"
        to: PENDING_COUNTERSIGN
        trigger: "POST /group-leader-agreements"
        actor: ProgramManager
        preconditions:
          - "departure.status IN {PLANNING, OPEN_FOR_SALE} (else ERR_DEPARTURE_INVALID_STATE)"
          - "expected_departure_version == departure.version (else ERR_STALE_DEPARTURE_VERSION)"
        side_effects:
          - "any prior GroupLeaderAgreement with the same (departure_id, leader_user_id) and status IN {PENDING_COUNTERSIGN, ACTIVE} moves to TERMINATED with superseded_by_agreement_id set to the new row, and every Pilgrim that referenced it keeps recruited_by_agreement_id pointing at the superseded row"
          - "increments Departure.version by 1"
      - from: PENDING_COUNTERSIGN
        to: ACTIVE
        trigger: "POST /group-leader-agreements/{agreementId}/countersign"
        actor: GroupLeader
        preconditions:
          - "agreement.status == PENDING_COUNTERSIGN (else ERR_AGREEMENT_INVALID_STATE)"
          - "X-User-ID == agreement.id (the GroupLeader role is entity_backed:GroupLeaderAgreement)"
        side_effects:
          - "recomputes recruited_paying_count, earned_free_seats and commission_payable_cents via calculations.leader_benefit_accrual (snapshot variant)"
      - from: ACTIVE
        to: SETTLED
        trigger: "POST /group-leader-agreements/{agreementId}/settle"
        actor: FinanceController
        preconditions:
          - "agreement.status == ACTIVE (else ERR_AGREEMENT_INVALID_STATE)"
          - "departure.status IN {SALES_CLOSED, OPERATED} (else ERR_DEPARTURE_INVALID_STATE)"
        side_effects:
          - "writes settled_recruited_count, settled_earned_free_seats and settled_commission_cents via calculations.leader_benefit_accrual (settlement variant); the snapshot fields are left untouched so both variants stay observable"
      - from: "PENDING_COUNTERSIGN | ACTIVE"
        to: TERMINATED
        trigger: "system, cascaded from POST /departures/{departureId}/cancel or from a superseding agreement create"
        actor: system
        preconditions:
          - "agreement.status IN {PENDING_COUNTERSIGN, ACTIVE}"
        side_effects:
          - "recruited_paying_count, earned_free_seats and commission_payable_cents recomputed to 0 when the cause was a departure cancellation"

  - entity: PaymentPlan
    initial_state: ACTIVE
    terminal_states: [COMPLETED, DEFAULTED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /pilgrims/{pilgrimId}/payments whose allocation leaves every installment status == PAID"
        actor: FinanceController
        preconditions:
          - "plan.status == ACTIVE"
        side_effects:
          - "pilgrim.payment_status -> PAID_IN_FULL"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /departures/{departureId}/payment-sweep"
        actor: FinanceController
        preconditions:
          - "plan.status == ACTIVE"
          - "after the sweep marks overdue installments PAST_DUE, plan.past_due_count >= PLAN_DEFAULT_PAST_DUE_COUNT"
        side_effects:
          - "sweep hop 1: every installment with status IN {SCHEDULED, PARTIALLY_PAID} whose due_date < date(clock_now) moves to PAST_DUE and past_due_count is refreshed"
          - "sweep hop 2: because past_due_count reached the threshold, plan.status -> DEFAULTED and pilgrim.payment_status -> IN_DEFAULT"
          - "sweep hop 3: because the pilgrim is IN_DEFAULT, its ticketed_name is cleared, which decrements AirBlock.seats_assigned on the departure's blocks"
          - "increments Departure.sweep_run_count by 1 and sets Departure.last_sweep_at"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /pilgrims/{pilgrimId}/payment-plans (replacement plan) or POST /pilgrims/{pilgrimId}/cancel"
        actor: FinanceController
        preconditions:
          - "plan.status == ACTIVE"
        side_effects:
          - "every installment with status IN {SCHEDULED, PARTIALLY_PAID, PAST_DUE} moves to WAIVED"
          - "on the replacement path only: the sum of installments' amount_paid_cents is returned to pilgrim.credit_balance_cents before the new plan drains it, keeping calculations.pilgrim_cash_conservation exact"

  - entity: RiskAdvisory
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /risk-advisories/{riskAdvisoryId}/publish"
        actor: RiskOfficer
        preconditions:
          - "advisory.status == DRAFT (else ERR_ADVISORY_INVALID_STATE)"
          - "advisory.effective_from <= clock_now (else ERR_ADVISORY_EFFECTIVE_IN_FUTURE)"
        side_effects:
          - "any other RiskAdvisory with the same country and status == PUBLISHED moves to SUPERSEDED"
          - "cascade hop 1: every Departure whose Program.destination_country == advisory.country and whose status IN {PLANNING, OPEN_FOR_SALE, SALES_CLOSED} has risk_posture and governing_advisory_id recomputed via calculations.departure_risk_posture; affected_departure_count records how many rows were visited; a departure whose posture became SUSPENDED and whose status was OPEN_FOR_SALE also moves to SALES_CLOSED"
          - "cascade hop 2: because a departure's posture became SUSPENDED, every ServiceBooking on it with status != CANCELLED moves to CANCELLED with cancelled_by_risk = true, releasing SacredSite daily capacity and buffered intervals"
          - "cascade hop 3: because service bookings were risk-cancelled, that Departure's service_coverage_ok flips to false, pending_modification_required flips to true, pending_modification_reason is set to the literal RISK_SUSPENSION, pending_modification_proposed_by_user_id is set to null and pending_modification_cost_delta_cents to 0"
          - "cascade hop 4: because pending_modification_required is true, POST /departures/{departureId}/close-sales on that departure is rejected with ERR_PENDING_MODIFICATION_UNRATIFIED until a ratify-modification decision clears the flag"
          - "also, on a SUSPENDED departure every AirBlock with status IN {DRAFT, OFFERED, COUNTERED} moves to EXPIRED and a CONFIRMED block moves to RELEASED"
          - "increments each affected Departure.version by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system, cascaded from a later POST /risk-advisories/{riskAdvisoryId}/publish for the same country"
        actor: system
        preconditions:
          - "advisory.status == PUBLISHED"
        side_effects:
          - "the superseding advisory recomputes posture for the same country's departures; a downgrade to NORMAL restores risk_posture OPEN and clears governing_advisory_id, but risk-cancelled ServiceBooking rows are NOT resurrected and pending_modification_required stays true"

  - entity: "Departure.pending_modification (itinerary modification sub-machine)"
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: PROPOSED
        trigger: "POST /departures/{departureId}/itinerary-modification"
        actor: ProgramManager
        preconditions:
          - "departure.status IN {PLANNING, OPEN_FOR_SALE, SALES_CLOSED} (else ERR_DEPARTURE_INVALID_STATE)"
          - "departure.pending_modification_required == false (else ERR_DEPARTURE_INVALID_STATE)"
        side_effects:
          - "pending_modification_required = true; pending_modification_reason = modification_reason; pending_modification_proposed_by_user_id = X-User-ID; pending_modification_cost_delta_cents = cost_delta_cents"
          - "increments Departure.version by 1"
      - from: PROPOSED
        to: NONE
        trigger: "POST /departures/{departureId}/ratify-modification"
        actor: RiskOfficer
        preconditions:
          - "departure.pending_modification_required == true (else ERR_NO_PENDING_MODIFICATION)"
          - "X-User-ID != departure.pending_modification_proposed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "itinerary_cost_delta_cents += pending_modification_cost_delta_cents; ratified_modification_count += 1"
          - "pending_modification_required = false, pending_modification_reason = null, pending_modification_proposed_by_user_id = null, pending_modification_cost_delta_cents = 0"
          - "calculations.departure_land_cost_rollup recomputed"
          - "increments Departure.version by 1"
        note: "A cascade-raised modification carries pending_modification_proposed_by_user_id set to the publishing RiskOfficer's id, so that officer cannot ratify their own advisory-driven change."

  - entity: TravelProtection
    initial_state: QUOTED
    terminal_states: [PURCHASED, VOIDED]
    transitions:
      - from: QUOTED
        to: MEDICAL_REVIEWED
        trigger: "POST /travel-protections/{travelProtectionId}/medical-review"
        actor: ProtectionAdministrator
        preconditions:
          - "protection.status == QUOTED (else ERR_PROTECTION_INVALID_STATE)"
          - "pilgrim.booking_status != CANCELLED (else ERR_PILGRIM_NOT_ACTIVE)"
        side_effects:
          - "questionnaire_complete and stable_period_days written; medical_review_by_user_id = X-User-ID"
          - "calculations.waiver_eligibility writes waiver_eligible; calculations.protection_premium re-run"
      - from: MEDICAL_REVIEWED
        to: WAIVER_APPROVED
        trigger: "POST /travel-protections/{travelProtectionId}/waiver-decision with decision = APPROVE"
        actor: ProtectionAdministrator
        preconditions:
          - "protection.status == MEDICAL_REVIEWED (else ERR_PROTECTION_INVALID_STATE)"
          - "X-User-ID != protection.medical_review_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "(clock_now - deposit_reference_date) in days <= WAIVER_PURCHASE_WINDOW_DAYS (else ERR_WAIVER_WINDOW_CLOSED)"
          - "protection.waiver_eligible == true (else ERR_WAIVER_NOT_ELIGIBLE)"
        side_effects:
          - "waiver_surcharge_cents recomputed by calculations.protection_premium and capped at WAIVER_SURCHARGE_CAP_CENTS; premium_cents refreshed"
          - "pilgrim.protection_status -> WAIVER_APPROVED"
      - from: MEDICAL_REVIEWED
        to: WAIVER_DECLINED
        trigger: "POST /travel-protections/{travelProtectionId}/waiver-decision with decision = DECLINE"
        actor: ProtectionAdministrator
        preconditions:
          - "protection.status == MEDICAL_REVIEWED (else ERR_PROTECTION_INVALID_STATE)"
          - "X-User-ID != protection.medical_review_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "waiver_surcharge_cents forced to 0; premium_cents refreshed"
          - "pilgrim.protection_status -> WAIVER_DECLINED"
        note: "A DECLINE is accepted even when the purchase window has closed, so ERR_WAIVER_WINDOW_CLOSED is reachable only on the APPROVE branch."
      - from: "QUOTED | WAIVER_APPROVED | WAIVER_DECLINED"
        to: PURCHASED
        trigger: "POST /travel-protections/{travelProtectionId}/purchase"
        actor: ProtectionAdministrator
        preconditions:
          - "protection.status IN {QUOTED, WAIVER_APPROVED, WAIVER_DECLINED} (else ERR_PROTECTION_INVALID_STATE)"
          - "if protection.pre_existing_waiver_requested == true then protection.status != QUOTED (else ERR_PROTECTION_INVALID_STATE)"
          - "pilgrim.booking_status != CANCELLED (else ERR_PILGRIM_NOT_ACTIVE)"
        side_effects:
          - "pilgrim.protection_status -> PURCHASED; pilgrim.protection_premium_cents = premium_cents"
        note: "MEDICAL_REVIEWED is deliberately NOT a purchasable state: a reviewed waiver request must be decided one way or the other first."
      - from: "QUOTED | MEDICAL_REVIEWED | WAIVER_APPROVED | WAIVER_DECLINED"
        to: VOIDED
        trigger: "system, cascaded from POST /pilgrims/{pilgrimId}/cancel or POST /departures/{departureId}/cancel"
        actor: system
        preconditions:
          - "protection.status NOT IN {PURCHASED, VOIDED}"
        side_effects:
          - "premium_cents, base_premium_cents, medical_uplift_cents and waiver_surcharge_cents zeroed; pilgrim.protection_status -> VOIDED and pilgrim.protection_premium_cents -> 0"
        note: "A PURCHASED policy is never voided by a cancellation: the premium is non-refundable, which is why calculations.pilgrim_cancellation_settlement never touches protection money."

concurrency_rules:
  - rule_id: payment-plan-create-stale-pilgrim
    parent_entity: Pilgrim
    write_endpoint: "POST /pilgrims/{pilgrimId}/payment-plans"
    occ_field: "expected_pilgrim_version"
    description: |
      Creating a PaymentPlan against a Pilgrim whose version has advanced since the
      client last observed it is rejected. A replacement plan legitimately supersedes
      the prior ACTIVE plan (returning its paid amounts to credit_balance_cents before
      re-draining them), so the write cannot be filtered out by a state precondition —
      the stale-version check is what stops a client from rescheduling against a
      pilgrim ledger it no longer understands.
    error_id: ERR_STALE_PILGRIM_VERSION
    http_status: 412
  - rule_id: leader-agreement-create-stale-departure
    parent_entity: Departure
    write_endpoint: "POST /group-leader-agreements"
    occ_field: "expected_departure_version"
    description: |
      Creating a GroupLeaderAgreement against a Departure whose version has advanced
      since the client last observed it is rejected. A new agreement for the same
      (departure_id, leader_user_id) legitimately supersedes the prior one by moving it
      to TERMINATED, so a second create against unchanged state would itself succeed;
      the stale-version check is the only deterministic guard against renegotiating on
      an outdated view of the departure.
    error_id: ERR_STALE_DEPARTURE_VERSION
    http_status: 412

calculations:
  - name: departure_group_size_tier
    trigger: |
      Provisional variant: POST /pilgrims (create), POST /pilgrims/{pilgrimId}/payments (when it
      moves booking_status INQUIRY -> DEPOSITED), POST /pilgrims/{pilgrimId}/confirm,
      POST /pilgrims/{pilgrimId}/cancel, POST /departures/{departureId}/open-sales.
      Final variant: POST /departures/{departureId}/close-sales only.
    algorithm: tiered_pricing
    formula: |
      # candidate_count depends on the variant (see variants:)
      candidate_count = count(Pilgrim P where
          P.departure_id == D.id
          AND P.is_paying == true
          AND <variant status filter>)

      # the provisional variant floors the count at 1, so an empty roster is quoted at the
      # smallest-group tier and provisional_deposit_cents is never 0; the final variant does NOT
      # floor, so an empty fully-paid set has no tier at all.
      effective_count = max(1, candidate_count) for the provisional variant
      effective_count = candidate_count          for the final variant

      # tier selection: the single Program.price_tiers item whose closed range contains effective_count
      tier = the item T of program.price_tiers where T.min_pax <= effective_count <= T.max_pax
      if no such item exists (final variant with effective_count == 0, or a count above the
      largest tier's max_pax):
          reject the request with ERR_NO_APPLICABLE_PRICE_TIER (422)

      # writes (provisional variant)
      D.provisional_tier_code                 = tier.tier_code
      D.provisional_per_pax_price_cents        = tier.per_pax_price_cents
      D.provisional_single_supplement_cents    = tier.single_supplement_cents
      D.provisional_deposit_cents              = tier.deposit_cents
      # writes (final variant)
      D.final_tier_code                        = tier.tier_code
      D.final_per_pax_price_cents              = tier.per_pax_price_cents
    input_set: |
      Pilgrim rows of the departure with is_paying == true. Free-seat grants (is_paying == false)
      NEVER enter either count. Rows with booking_status == CANCELLED never enter either count.
      Tier ranges are closed at both ends; because Program.price_tiers is validated contiguous and
      non-overlapping, at most one tier can match, so no tie-break is needed.
    constants:
      TIER_RANGE_SEMANTICS: "closed interval [min_pax, max_pax]; boundary is inclusive on both ends"
    precision: "integer cents; no rounding — tier prices are stored as integers"
    variants:
      - name: provisional
        when: "any paying-set mutation on an OPEN_FOR_SALE or PLANNING departure"
        difference: "status filter is `P.booking_status IN {DEPOSITED, CONFIRMED}` — forward-looking: deposited-but-unconfirmed travelers are counted as if they will travel"
      - name: final
        when: "POST /departures/{departureId}/close-sales"
        difference: "status filter is `P.booking_status == CONFIRMED AND P.payment_status == PAID_IN_FULL` — only fully-paid confirmed travelers count, so the same roster routinely selects a SMALLER group and therefore a HIGHER per-pax tier price than the provisional variant"

  - name: leader_benefit_accrual
    trigger: |
      Snapshot variant: POST /pilgrims (create), POST /pilgrims/{pilgrimId}/confirm,
      POST /pilgrims/{pilgrimId}/cancel, POST /group-leader-agreements/{agreementId}/countersign.
      Settlement variant: POST /group-leader-agreements/{agreementId}/settle only.
    algorithm: threshold
    formula: |
      recruited = count(Pilgrim P where
          P.recruited_by_agreement_id == A.id
          AND P.is_paying == true
          AND <variant status filter>)
      earned_free_seats = floor(recruited / A.free_travel_threshold)
      per_pax = <variant price basis>
      free_seat_value_cents      = earned_free_seats * per_pax
      cash_commission_gross_cents = recruited * A.commission_rate_cents_per_pax

      if A.commission_mode == PER_PAX_CASH:
          commission = cash_commission_gross_cents
      elif A.commission_mode == FREE_SEAT_CREDIT:
          commission = 0
      else:  # HYBRID — cash commission is net of the value of the free seats already earned
          commission = max(0, cash_commission_gross_cents - free_seat_value_cents)

      # writes (snapshot variant)
      A.recruited_paying_count  = recruited
      A.earned_free_seats       = earned_free_seats
      A.commission_payable_cents = commission
      # writes (settlement variant)
      A.settled_recruited_count      = recruited
      A.settled_earned_free_seats    = earned_free_seats
      A.settled_commission_cents     = commission
    input_set: |
      Pilgrim rows whose recruited_by_agreement_id equals this agreement's id, is_paying == true.
      Free-seat grants recruited under the agreement are excluded from `recruited` (is_paying == false)
      but counted separately in free_seats_granted_count.
    constants:
      FLOOR_SEMANTICS: "integer floor division; 2 recruits against a threshold of 3 earns 0 seats"
      ACCRUAL_BASIS_FIELD: "GroupLeaderAgreement.accrual_basis records the contractual basis for audit only; the variant is selected by the calling endpoint, never by this field"
    precision: "integer cents; max() applied after the subtraction, never before"
    variants:
      - name: snapshot
        when: "recruiting-set mutations while the departure is selling"
        difference: "status filter `P.booking_status IN {DEPOSITED, CONFIRMED}`; price basis `Departure.provisional_per_pax_price_cents`"
      - name: settlement
        when: "POST /group-leader-agreements/{agreementId}/settle after the departure closed sales"
        difference: "status filter `P.booking_status == CONFIRMED AND P.payment_status == PAID_IN_FULL`; price basis `Departure.final_per_pax_price_cents`. Both the count and the price basis differ from the snapshot, so the same roster yields a different earned_free_seats AND a different commission figure."

  - name: pilgrim_invoice_total
    trigger: "POST /pilgrims/{pilgrimId}/confirm, POST /pilgrims/{pilgrimId}/rooming, POST /pilgrims/{pilgrimId}/air-deviation, and every re-pricing cascade hop that rewrites Pilgrim.price_locked_cents"
    algorithm: constraint_propagation
    formula: |
      # STEP ORDER IS PINNED. Evaluating the grant tier on the post-fee total instead of on
      # gross_cents produces a different invoice_total_cents whenever the service fee pushes
      # gross_cents across a grant breakpoint.
      effective_per_pax_cents = coalesce(P.price_locked_cents, D.provisional_per_pax_price_cents)

      # 1. gross
      gross_cents = effective_per_pax_cents
                  + P.single_supplement_applied_cents
                  + P.deviation_fee_cents

      # 2. grant tier keyed on gross_cents (NOT on the total, NOT on the net)
      if   gross_cents >= GRANT_TIER_2_FLOOR_CENTS: grant_bp = GRANT_TIER_2_BP
      elif gross_cents >= GRANT_TIER_1_FLOOR_CENTS: grant_bp = GRANT_TIER_1_BP
      else:                                          grant_bp = 0

      # 3. grant
      grant_cents = round_half_up(gross_cents * grant_bp / 10000)

      # 4. net
      net_cents = gross_cents - grant_cents

      # 5. service fee keyed on net_cents (post-grant)
      service_fee_cents = round_half_up(net_cents * SERVICE_FEE_BP / 10000)

      # 6. total
      P.invoice_total_cents = net_cents + service_fee_cents
    input_set: |
      Single Pilgrim row plus its Departure's provisional tier fields. The protection premium is
      NOT part of invoice_total_cents; it is tracked separately on Pilgrim.protection_premium_cents
      and only enters the overpayment ceiling in validations[priority=70].
    constants:
      GRANT_TIER_2_FLOOR_CENTS: 500000
      GRANT_TIER_2_BP: 500
      GRANT_TIER_1_FLOOR_CENTS: 300000
      GRANT_TIER_1_BP: 300
      SERVICE_FEE_BP: 350
    precision: "round_half_up to whole cents, applied independently at step 3 and step 5; no other rounding"

  - name: departure_land_cost_rollup
    trigger: "POST /land-assignments (line fields only), POST /land-assignments/{landAssignmentId}/countersign, POST /land-assignments/{landAssignmentId}/terminate, POST /departures/{departureId}/close-sales"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round each line to whole USD cents FIRST, then sum the
      # rounded lines. Summing local amounts and rounding once at the end is FORBIDDEN and
      # yields a different total (off-by-cents) whenever two or more lines have fractional parts.
      lines = LandAssignment rows L where
                L.departure_id == D.id
                AND L.status == COUNTERSIGNED
              ordered by L.date_from ASC, then L.created_at ASC
      for each L in lines:
          R = LandResource with id == L.land_resource_id
          L.days_inclusive   = (date(L.date_to) - date(L.date_from)) in days + 1
          L.line_local_cents = L.units_requested * L.days_inclusive * R.unit_rate_local_cents
          L.line_usd_cents   = round_half_up(L.line_local_cents * R.fx_rate_bp / 10000)
      D.land_cost_total_cents = sum over lines of L.line_usd_cents
    input_set: |
      Only LandAssignment rows in status COUNTERSIGNED enter the rollup. DRAFT rows occupy
      resource units (so they participate in the oversubscription check) but contribute 0 to the
      cost. TERMINATED rows contribute 0 and release their units.
    constants:
      FX_DENOMINATOR: 10000
      DAY_COUNT_SEMANTICS: "closed-inclusive: date_from == date_to yields days_inclusive == 1"
    precision: "round_half_up to whole cents PER LINE, then integer summation; the ordering above is stated for determinism even though integer addition is commutative"

  - name: protection_premium
    trigger: "POST /travel-protections, POST /travel-protections/{travelProtectionId}/medical-review, POST /travel-protections/{travelProtectionId}/waiver-decision, POST /travel-protections/{travelProtectionId}/purchase"
    algorithm: weighted_scoring
    formula: |
      TP.insured_trip_cost_cents = P.invoice_total_cents      # captured at each (re-)quote

      # age band from the pilgrim's age at departure
      if   P.age_at_departure >= 75: TP.age_band = D ; band_bp = AGE_BAND_D_BP
      elif P.age_at_departure >= 65: TP.age_band = C ; band_bp = AGE_BAND_C_BP
      elif P.age_at_departure >= 40: TP.age_band = B ; band_bp = AGE_BAND_B_BP
      else:                          TP.age_band = A ; band_bp = AGE_BAND_A_BP

      TP.base_premium_cents = round_half_up(TP.insured_trip_cost_cents * band_bp / 10000)

      # medical uplift — STRICTLY GREATER THAN the threshold; exactly at the threshold there is no uplift
      if TP.medical_limit_cents > MEDICAL_UPLIFT_THRESHOLD_CENTS:
          TP.medical_uplift_cents = round_half_up(TP.base_premium_cents * MEDICAL_UPLIFT_BP / 10000)
      else:
          TP.medical_uplift_cents = 0

      # pre-existing condition waiver surcharge — capped
      if TP.pre_existing_waiver_requested == true
         AND TP.waiver_eligible == true
         AND P.protection_status != WAIVER_DECLINED:
          TP.waiver_surcharge_cents = min(
              round_half_up(TP.base_premium_cents * WAIVER_SURCHARGE_BP / 10000),
              WAIVER_SURCHARGE_CAP_CENTS)
      else:
          TP.waiver_surcharge_cents = 0

      TP.premium_cents = TP.base_premium_cents + TP.medical_uplift_cents + TP.waiver_surcharge_cents
    input_set: "one TravelProtection row plus its Pilgrim's age_at_departure, invoice_total_cents and protection_status"
    constants:
      AGE_BAND_A_BP: 400
      AGE_BAND_B_BP: 620
      AGE_BAND_C_BP: 910
      AGE_BAND_D_BP: 1280
      MEDICAL_UPLIFT_THRESHOLD_CENTS: 5000000
      MEDICAL_UPLIFT_BP: 1500
      WAIVER_SURCHARGE_BP: 2200
      WAIVER_SURCHARGE_CAP_CENTS: 45000
    precision: "round_half_up to whole cents applied independently to base, uplift and surcharge; the min() cap is applied AFTER rounding the surcharge"

  - name: waiver_eligibility
    trigger: "POST /travel-protections/{travelProtectionId}/medical-review, and re-evaluated at POST /travel-protections/{travelProtectionId}/waiver-decision"
    algorithm: threshold
    formula: |
      if TP.deposit_reference_date is null:
          TP.waiver_eligible = false      # the pilgrim never reached DEPOSITED
      else:
          days_since_deposit = (date(clock_now) - date(TP.deposit_reference_date)) in days
          TP.waiver_eligible =
              TP.questionnaire_complete == true
              AND TP.stable_period_days >= WAIVER_STABLE_PERIOD_MIN_DAYS
              AND days_since_deposit <= WAIVER_PURCHASE_WINDOW_DAYS
      # days_since_deposit == WAIVER_PURCHASE_WINDOW_DAYS is still ELIGIBLE (<=);
      # WAIVER_PURCHASE_WINDOW_DAYS + 1 is not, and a waiver-decision APPROVE then
      # fails with ERR_WAIVER_WINDOW_CLOSED.
    input_set: "one TravelProtection row plus the logical clock"
    constants:
      WAIVER_STABLE_PERIOD_MIN_DAYS: 60
      WAIVER_PURCHASE_WINDOW_DAYS: 21
    precision: "integer whole days on the UTC calendar; no partial-day arithmetic"

  - name: air_deviation_fee
    trigger: "POST /pilgrims/{pilgrimId}/air-deviation"
    algorithm: threshold
    formula: |
      if deviation_type == ORIGIN_CHANGE:  base = DEVIATION_ORIGIN_CHANGE_FEE_CENTS
      elif deviation_type == DATE_DEVIATION: base = DEVIATION_DATE_FEE_CENTS
      else: # CLASS_UPGRADE — priced off the confirmed block fare
            base = round_half_up(AB.contracted_fare_cents * DEVIATION_UPGRADE_BP / 10000)

      days_to_departure = (date(D.departure_date) - date(clock_now)) in days
      multiplier_bp = DEVIATION_LATE_MULTIPLIER_BP if days_to_departure <= DEVIATION_LATE_WINDOW_DAYS
                      else DEVIATION_NORMAL_MULTIPLIER_BP

      P.deviation_fee_cents = round_half_up(base * multiplier_bp / 10000)
      P.deviation_type      = deviation_type
      # then calculations.pilgrim_invoice_total re-runs for P
    input_set: "one Pilgrim row, the departure's single AirBlock with status == CONFIRMED, and the logical clock"
    constants:
      DEVIATION_ORIGIN_CHANGE_FEE_CENTS: 12500
      DEVIATION_DATE_FEE_CENTS: 9000
      DEVIATION_UPGRADE_BP: 4500
      DEVIATION_LATE_WINDOW_DAYS: 30
      DEVIATION_LATE_MULTIPLIER_BP: 15000
      DEVIATION_NORMAL_MULTIPLIER_BP: 10000
    precision: "round_half_up to whole cents, applied to the CLASS_UPGRADE base and again to the multiplied fee"

  - name: payment_plan_schedule
    trigger: "POST /pilgrims/{pilgrimId}/payment-plans"
    algorithm: waterfall_allocation
    formula: |
      PL.installment_count = { SINGLE_BALANCE: 1, MONTHLY_3: 3, MONTHLY_6: 6 }[PL.plan_type]
      PL.total_scheduled_cents = P.invoice_total_cents
      n = PL.installment_count
      base_amount = PL.total_scheduled_cents // n            # integer floor division
      remainder   = PL.total_scheduled_cents - base_amount * n

      # the remainder cents load onto the EARLIEST installments, one cent each
      for i in 1..n:
          amount_due = base_amount + (1 if i <= remainder else 0)
          due_date   = add_months(PL.first_due_date, i - 1)   # same day-of-month, clamped to
                                                              # the last day of a shorter month
          installments[i] = { sequence_no: i, due_date: due_date,
                              amount_due_cents: amount_due,
                              amount_paid_cents: 0, status: SCHEDULED }
    input_set: "one Pilgrim row's invoice_total_cents at plan-creation time; prior plans do not reduce it (their paid amounts are returned to credit_balance_cents first)"
    constants:
      REMAINDER_PLACEMENT: "earliest-first: sequence_no 1..remainder each carry one extra cent"
    precision: "integer cents; sum(amount_due_cents) == total_scheduled_cents exactly, by construction"

  - name: payment_waterfall_allocation
    trigger: "POST /pilgrims/{pilgrimId}/payments, and the credit drain inside POST /pilgrims/{pilgrimId}/payment-plans"
    algorithm: waterfall_allocation
    formula: |
      remaining = amount_to_allocate
      plan = the PaymentPlan of P with status == ACTIVE (at most one exists)

      if plan is null:
          P.credit_balance_cents += remaining
          allocation = [ { target: CREDIT, sequence_no: null, amount_cents: remaining } ]
          # with no plan the ledger is judged directly against the invoice
          P.payment_status = PAID_IN_FULL if P.cash_applied_cents >= P.invoice_total_cents
                             else DEPOSIT_PAID if P.cash_applied_cents >= D.provisional_deposit_cents
                             else UNPAID
      else:
          allocation = []
          # buckets ordered by due_date ASC, then sequence_no ASC (tie-break), then created_at ASC
          # of the owning plan as the final fallback. `id` is never consulted.
          for I in plan.installments where I.status IN {SCHEDULED, PARTIALLY_PAID, PAST_DUE}
              ordered by I.due_date ASC, I.sequence_no ASC:
              if remaining == 0: break
              need = I.amount_due_cents - I.amount_paid_cents
              take = min(need, remaining)
              I.amount_paid_cents += take
              remaining -= take
              I.status = PAID if I.amount_paid_cents == I.amount_due_cents else PARTIALLY_PAID  # installment-level enum, distinct from Pilgrim.payment_status
              allocation.append({ target: INSTALLMENT, sequence_no: I.sequence_no, amount_cents: take })
          if remaining > 0:
              P.credit_balance_cents += remaining
              allocation.append({ target: CREDIT, sequence_no: null, amount_cents: remaining })
          plan.past_due_count = count(I in plan.installments where I.status == PAST_DUE)
          if every I in plan.installments has status == PAID:
              plan.status = COMPLETED ; P.payment_status = PAID_IN_FULL

      # reversal (POST /payments/{paymentId}/reverse) walks `allocation` in REVERSE list order:
      # CREDIT entries are removed from P.credit_balance_cents first because they were appended
      # last, then INSTALLMENT entries in descending sequence_no, each restoring
      # I.amount_paid_cents -= amount_cents and re-deriving I.status.
    input_set: "the pilgrim's single ACTIVE PaymentPlan and its installments array; WAIVED installments are never funded"
    constants:
      BUCKET_ORDER: "due_date ASC, then sequence_no ASC, then owning plan created_at ASC; id is never a decision input"
    precision: "integer cents; every allocated cent is recorded in Payment.allocation so reversal is exact"

  - name: pilgrim_cash_conservation
    trigger: "asserted after POST /pilgrims/{pilgrimId}/payments, POST /payments/{paymentId}/reverse, and POST /pilgrims/{pilgrimId}/payment-plans"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY #1 — pilgrim_cash_applied_total (money).
      # This identity MUST hold after every forward action and after every compensating action.
      sum over PaymentPlan PL where PL.pilgrim_id == P.id AND PL.status IN {ACTIVE, COMPLETED, DEFAULTED}
          of ( sum over I in PL.installments of I.amount_paid_cents )
        + P.credit_balance_cents
        == P.cash_applied_cents
        == sum over Payment PM where PM.pilgrim_id == P.id AND PM.status == APPLIED of PM.amount_cents
      # SUPERSEDED plans contribute 0 because their paid amounts were returned to
      # credit_balance_cents at supersede time and then re-drained into the replacement plan.
    input_set: "all PaymentPlan and Payment rows of one Pilgrim; SUPERSEDED plans excluded from the installment sum"
    constants:
      DRIFT_TOLERANCE_CENTS: 0
    precision: "exact integer equality; a single cent of drift is a failure"

  - name: site_capacity_conservation
    trigger: "asserted after POST /service-bookings and after POST /service-bookings/{serviceBookingId}/cancel (operator or risk-cascade)"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY #2 — site_day_free_pax (sacred-site pax slots, not money).
      # For a SacredSite S and a calendar date d:
      occupied(S, d) = sum over ServiceBooking B where
                           B.sacred_site_id == S.id
                           AND date(B.scheduled_start_utc) == d
                           AND B.status IN {SITE_HELD, CLERGY_CONFIRMED, CONFIRMED}
                       of B.pax_count
      free(S, d) = S.daily_capacity_pax - occupied(S, d)
      # Forward action POST /service-bookings decreases free(S, d) by exactly pax_count.
      # Compensating action .../cancel increases it by exactly pax_count, so
      # free(S, d) after hold-then-cancel == free(S, d) before the hold, for every d.
      # A risk-cascade cancellation restores capacity identically to an operator cancellation.
    input_set: "ServiceBooking rows at one site on one UTC calendar date; CANCELLED rows never occupy"
    constants:
      DRIFT_TOLERANCE_PAX: 0
    precision: "exact integer equality per (site, date) pair"

  - name: departure_risk_posture
    trigger: "POST /risk-advisories/{riskAdvisoryId}/publish (for every departure of the advisory's country) and re-read on every Departure write"
    algorithm: projection
    formula: |
      candidates = RiskAdvisory rows A where
          A.country == program.destination_country
          AND A.status == PUBLISHED
          AND A.effective_from <= clock_now
      if candidates is empty:
          D.risk_posture = OPEN ; D.governing_advisory_id = null
      else:
          # ranking expression over entity fields; ties broken by effective_from DESC, then created_at DESC
          rank(A) = { NORMAL: 0, EXERCISE_CAUTION: 1, RECONSIDER: 2, DO_NOT_TRAVEL: 3 }[A.level]
          governing = the candidate maximising ( rank(A), A.effective_from, A.created_at )
                      in that lexicographic order
          D.governing_advisory_id = governing.id
          D.risk_posture = { NORMAL: OPEN, EXERCISE_CAUTION: WATCH,
                             RECONSIDER: RESTRICTED, DO_NOT_TRAVEL: SUSPENDED }[governing.level]
          if governing.level == NORMAL: D.governing_advisory_id = null
    input_set: |
      Published, already-effective advisories for the departure's destination country. DRAFT
      advisories and advisories with effective_from > clock_now are excluded. Because at most one
      advisory per country is PUBLISHED at a time (publishing supersedes the prior), the candidate
      set is normally a singleton; the ranking is stated so that the outcome is defined even when
      several countries' feeds overlap during a migration.
    constants:
      LEVEL_RANK: "NORMAL=0, EXERCISE_CAUTION=1, RECONSIDER=2, DO_NOT_TRAVEL=3"
    precision: "enum mapping; no arithmetic"

  - name: pilgrim_cancellation_settlement
    trigger: "POST /pilgrims/{pilgrimId}/cancel and the pilgrim-cancel hop of POST /departures/{departureId}/cancel"
    algorithm: threshold
    formula: |
      days_before = (date(D.departure_date) - date(clock_now)) in days

      # bucket selection: the grid entry with the GREATEST min_days_before that days_before
      # still reaches. The comparison is `days_before >= min_days_before` (INCLUSIVE), so
      # days_before exactly equal to a breakpoint sits in the MORE GENEROUS bucket.
      bucket = the item G of program.cancellation_grid maximising G.min_days_before
               subject to days_before >= G.min_days_before
      penalty_bp = bucket.penalty_bp

      # overrides, applied in this order
      if D.risk_posture == SUSPENDED:        penalty_bp = 0   # advisory waiver
      if the cancel is a hop of POST /departures/{departureId}/cancel: penalty_bp = 0

      P.penalty_retained_cents = min(P.cash_applied_cents,
                                     round_half_up(P.invoice_total_cents * penalty_bp / 10000))
      P.refund_cents           = P.cash_applied_cents - P.penalty_retained_cents
      # the travel-protection premium is never refunded and never penalised; it is not part of
      # invoice_total_cents and not part of cash_applied_cents-derived refund arithmetic beyond
      # the cash the traveler actually paid.
    input_set: "one Pilgrim row, its Departure, that Departure's Program.cancellation_grid, and the logical clock"
    constants:
      BUCKET_COMPARISON: ">= (inclusive) against min_days_before"
      NEGATIVE_DAYS: "days_before < 0 (cancellation after the departure date) falls in the min_days_before == 0 bucket"
    precision: "round_half_up to whole cents for the penalty, then integer subtraction for the refund"

validations:
  # ---- priority 1: authentication -------------------------------------------------------
  - priority: 1
    category: auth
    rule: "X-Role header absent, empty, or not one of the seven roles in the RBAC matrix"
    applies_to: "every endpoint including GET endpoints and POST /_clock/set_current_utc"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401

  # ---- priority 10-12: authorization ----------------------------------------------------
  - priority: 10
    category: authorization
    rule: "X-Role is a recognised role but is not listed in the target endpoint's roles:"
    applies_to: "every endpoint"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    notes: |
      For the entity_backed role GroupLeader this rule also fires when X-User-ID does not equal
      the id of a GroupLeaderAgreement, or when the addressed resource does not belong to that
      agreement (a GroupLeader may only read pilgrims whose recruited_by_agreement_id equals
      their own agreement id).
  - priority: 12
    category: authorization
    rule: |
      Segregation of duties: the acting X-User-ID equals the user who performed the paired
      upstream step.
        * POST /departures/{departureId}/ratify-modification when
          X-User-ID == Departure.pending_modification_proposed_by_user_id
        * POST /travel-protections/{travelProtectionId}/waiver-decision when
          X-User-ID == TravelProtection.medical_review_by_user_id
    applies_to: "POST /departures/{departureId}/ratify-modification, POST /travel-protections/{travelProtectionId}/waiver-decision"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403

  # ---- priority 20: path existence ------------------------------------------------------
  - priority: 20
    category: existence
    rule: "the id in the URL path does not identify a stored row of the addressed collection"
    applies_to: "every endpoint carrying a path parameter"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_DEPARTURE_NOT_FOUND | ERR_PILGRIM_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_AIR_BLOCK_NOT_FOUND | ERR_SACRED_SITE_NOT_FOUND | ERR_SERVICE_BOOKING_NOT_FOUND | ERR_LAND_RESOURCE_NOT_FOUND | ERR_LAND_ASSIGNMENT_NOT_FOUND | ERR_PAYMENT_PLAN_NOT_FOUND | ERR_PAYMENT_NOT_FOUND | ERR_PROTECTION_NOT_FOUND | ERR_ADVISORY_NOT_FOUND"
    http_status: 404
    notes: "the code is chosen by the collection segment that owns the failing path parameter, evaluated left to right"

  # ---- priority 24-25: request shape ----------------------------------------------------
  - priority: 24
    category: request_shape
    rule: |
      A required input field is absent or null; a field carries the wrong JSON type; an enum
      field carries a value outside its declared set; an integer money/count field is negative;
      date_to < date_from; return_date < departure_date; final_payment_due_date < deposit_due_date;
      Program.price_tiers is empty, has overlapping ranges, has a gap between consecutive ranges,
      or has min_pax > max_pax in any item; Program.cancellation_grid is empty or has no item with
      min_days_before == 0; installment plan_type outside {SINGLE_BALANCE, MONTHLY_3, MONTHLY_6};
      POST /_clock/set_current_utc current_utc not an RFC3339 UTC instant.
    applies_to: "every endpoint with a request body"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
  - priority: 25
    category: request_shape
    rule: "limit < 1, limit > 100, offset < 0, or either not an integer"
    applies_to: "every list endpoint"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400

  # ---- priority 26: body foreign keys ---------------------------------------------------
  - priority: 26
    category: existence
    rule: "a foreign-key id supplied in the request body does not identify a stored row"
    applies_to: "POST /departures (program_id), POST /group-leader-agreements (departure_id), POST /pilgrims (departure_id, recruited_by_agreement_id), POST /air-blocks (departure_id), POST /service-bookings (departure_id, sacred_site_id), POST /land-assignments (land_resource_id, departure_id), POST /travel-protections (pilgrim_id), POST /pilgrims/{pilgrimId}/rooming (roommate_pilgrim_id)"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_DEPARTURE_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_PILGRIM_NOT_FOUND | ERR_SACRED_SITE_NOT_FOUND | ERR_LAND_RESOURCE_NOT_FOUND"
    http_status: 404
    notes: "body foreign keys are checked in the order they appear in the endpoint's input: list"

  # ---- priority 40-49: state ------------------------------------------------------------
  - priority: 40
    category: state
    rule: |
      the Departure is not in a state that admits the request:
        * POST /departures/{id}/open-sales requires PLANNING or SALES_CLOSED
        * POST /departures/{id}/close-sales requires OPEN_FOR_SALE
        * POST /departures/{id}/cancel requires PLANNING, OPEN_FOR_SALE or SALES_CLOSED
        * POST /departures/{id}/payment-sweep requires OPEN_FOR_SALE or SALES_CLOSED
        * POST /departures/{id}/itinerary-modification and .../ratify-modification require
          PLANNING, OPEN_FOR_SALE or SALES_CLOSED; itinerary-modification additionally requires
          pending_modification_required == false, so a second proposal on top of an unratified
          one is rejected with this code
        * POST /pilgrims and POST /air-blocks and POST /land-assignments and POST /service-bookings
          require the referenced Departure to be PLANNING or OPEN_FOR_SALE
        * OPERATED and CANCELLED are terminal and admit no transition
    applies_to: "all departure action endpoints and every child-creating endpoint"
    error_id: ERR_DEPARTURE_INVALID_STATE
    http_status: 409
  - priority: 41
    category: state
    rule: |
      the Pilgrim's booking_status does not admit the request:
        * POST /pilgrims/{id}/payments, .../payment-plans, .../confirm, .../rooming,
          .../ticket-name, .../air-deviation and POST /travel-protections require
          booking_status IN {INQUIRY, DEPOSITED, CONFIRMED}
        * POST /pilgrims/{id}/confirm additionally requires booking_status == DEPOSITED
        * POST /pilgrims/{id}/cancel requires booking_status != CANCELLED
        * CANCELLED is terminal
    applies_to: "every /pilgrims/{pilgrimId}/... action, POST /travel-protections"
    error_id: ERR_PILGRIM_NOT_ACTIVE
    http_status: 409
    notes: "deliberately ranked ABOVE the fiscal ceiling at priority 80, so a payment against a CANCELLED pilgrim that would also overshoot the invoice returns ERR_PILGRIM_NOT_ACTIVE"
  - priority: 42
    category: state
    rule: |
      POST /air-blocks/{id}/negotiation-rounds requires status IN {DRAFT, OFFERED, COUNTERED} and
      the party to match the standing state (CARRIER_OFFER from DRAFT or COUNTERED,
      OPERATOR_COUNTER from OFFERED only); a counter whose fare_cents is not below the standing
      offered_fare_cents is rejected here too. POST /air-blocks/{id}/confirm requires status ==
      OFFERED and no other CONFIRMED block on the same departure. CONFIRMED, RELEASED and EXPIRED
      admit no negotiation round; a write against a block whose deposit_deadline_utc has passed
      first moves it to EXPIRED and then fails with this code.
    applies_to: "POST /air-blocks/{airBlockId}/negotiation-rounds, POST /air-blocks/{airBlockId}/confirm"
    error_id: ERR_AIR_BLOCK_INVALID_STATE
    http_status: 409
  - priority: 43
    category: state
    rule: "POST /service-bookings/{id}/clergy-confirm requires SITE_HELD; .../confirm requires CLERGY_CONFIRMED; .../cancel requires status != CANCELLED"
    applies_to: "POST /service-bookings/{serviceBookingId}/clergy-confirm, .../confirm, .../cancel"
    error_id: ERR_SERVICE_BOOKING_INVALID_STATE
    http_status: 409
  - priority: 44
    category: state
    rule: "POST /land-assignments/{id}/countersign requires DRAFT; .../terminate requires DRAFT or COUNTERSIGNED"
    applies_to: "POST /land-assignments/{landAssignmentId}/countersign, .../terminate"
    error_id: ERR_LAND_ASSIGNMENT_INVALID_STATE
    http_status: 409
  - priority: 45
    category: state
    rule: "POST /group-leader-agreements/{id}/countersign requires PENDING_COUNTERSIGN; .../settle requires ACTIVE and a Departure in SALES_CLOSED or OPERATED"
    applies_to: "POST /group-leader-agreements/{agreementId}/countersign, .../settle"
    error_id: ERR_AGREEMENT_INVALID_STATE
    http_status: 409
  - priority: 46
    category: state
    rule: "POST /travel-protections/{id}/medical-review requires QUOTED; .../waiver-decision requires MEDICAL_REVIEWED; .../purchase requires QUOTED, WAIVER_APPROVED or WAIVER_DECLINED; PURCHASED and VOIDED are terminal"
    applies_to: "POST /travel-protections/{travelProtectionId}/medical-review, .../waiver-decision, .../purchase"
    error_id: ERR_PROTECTION_INVALID_STATE
    http_status: 409
  - priority: 47
    category: state
    rule: "POST /risk-advisories/{id}/publish requires status == DRAFT; PUBLISHED and SUPERSEDED cannot be published again"
    applies_to: "POST /risk-advisories/{riskAdvisoryId}/publish"
    error_id: ERR_ADVISORY_INVALID_STATE
    http_status: 409
  - priority: 48
    category: state
    rule: "POST /payments/{paymentId}/reverse when Payment.status is already REVERSED"
    applies_to: "POST /payments/{paymentId}/reverse"
    error_id: ERR_PAYMENT_ALREADY_REVERSED
    http_status: 409
  - priority: 49
    category: state
    rule: "POST /departures/{id}/ratify-modification when pending_modification_required is false (nothing was proposed, or the previous proposal was already ratified)"
    applies_to: "POST /departures/{departureId}/ratify-modification"
    error_id: ERR_NO_PENDING_MODIFICATION
    http_status: 409

  # ---- priority 50-51: optimistic concurrency -------------------------------------------
  - priority: 50
    category: occ
    rule: "expected_pilgrim_version does not equal the current Pilgrim.version"
    applies_to: "POST /pilgrims/{pilgrimId}/payment-plans"
    error_id: ERR_STALE_PILGRIM_VERSION
    http_status: 412
  - priority: 51
    category: occ
    rule: "expected_departure_version does not equal the current Departure.version"
    applies_to: "POST /group-leader-agreements"
    error_id: ERR_STALE_DEPARTURE_VERSION
    http_status: 412

  # ---- priority 52-57: business_safety --------------------------------------------------
  - priority: 52
    category: business_safety
    rule: "POST /pilgrims with mobility_code IN {WHEELCHAIR, WALKER} against a Departure whose mobility_accessible_coach is false"
    applies_to: "POST /pilgrims"
    error_id: ERR_MOBILITY_UNSUPPORTED
    http_status: 422
    notes: "ranked ABOVE the referential agreement/departure match at priority 70: a wheelchair traveler booked with a foreign leader's agreement onto a non-accessible departure returns ERR_MOBILITY_UNSUPPORTED"
  - priority: 53
    category: business_safety
    rule: "POST /pilgrims/{id}/rooming assigning ground_floor false to a pilgrim whose mobility_code IN {WHEELCHAIR, WALKER}"
    applies_to: "POST /pilgrims/{pilgrimId}/rooming"
    error_id: ERR_MOBILITY_ACCOMMODATION_UNMET
    http_status: 422
  - priority: 54
    category: business_safety
    rule: "POST /pilgrims against a Departure whose risk_posture == SUSPENDED"
    applies_to: "POST /pilgrims"
    error_id: ERR_DEPARTURE_SUSPENDED_NO_NEW_BOOKINGS
    http_status: 422
  - priority: 55
    category: business_safety
    rule: "POST /pilgrims/{id}/confirm on a Departure whose risk_posture == RESTRICTED while Pilgrim.risk_acknowledged is false"
    applies_to: "POST /pilgrims/{pilgrimId}/confirm"
    error_id: ERR_RISK_ACKNOWLEDGEMENT_REQUIRED
    http_status: 422
  - priority: 56
    category: business_safety
    rule: "POST /pilgrims/{id}/confirm on a Departure whose risk_posture == SUSPENDED (no acknowledgement can unlock a suspended departure)"
    applies_to: "POST /pilgrims/{pilgrimId}/confirm"
    error_id: ERR_DEPARTURE_POSTURE_BLOCKS_CONFIRM
    http_status: 422
  - priority: 57
    category: business_safety
    rule: "POST /pilgrims/{id}/confirm when age_at_departure >= SENIOR_PROTECTION_AGE (70) and the pilgrim has no TravelProtection row in status PURCHASED"
    applies_to: "POST /pilgrims/{pilgrimId}/confirm"
    error_id: ERR_SENIOR_PROTECTION_REQUIRED
    http_status: 422

  # ---- priority 58-61: business_temporal ------------------------------------------------
  - priority: 58
    category: business_temporal
    rule: "POST /pilgrims/{id}/ticket-name when clock_now > AirBlock.name_change_deadline_utc of the departure's CONFIRMED air block"
    applies_to: "POST /pilgrims/{pilgrimId}/ticket-name"
    error_id: ERR_NAME_CHANGE_DEADLINE_PASSED
    http_status: 422
    notes: "ranked ABOVE the seat-exhaustion constraint at priority 62, so a late ticket-name request on a full block returns ERR_NAME_CHANGE_DEADLINE_PASSED"
  - priority: 59
    category: business_temporal
    rule: "POST /pilgrims/{id}/rooming supplying dietary_codes that intersect {KOSHER, HALAL} when (departure_date - clock_now) in days < DIETARY_LEAD_TIME_MIN_DAYS (21)"
    applies_to: "POST /pilgrims/{pilgrimId}/rooming"
    error_id: ERR_DIETARY_LEAD_TIME_UNMET
    http_status: 422
    notes: "exactly 21 days before departure is still accepted; 20 days is rejected"
  - priority: 60
    category: business_temporal
    rule: "POST /travel-protections/{id}/waiver-decision with decision APPROVE when (clock_now - deposit_reference_date) in days > WAIVER_PURCHASE_WINDOW_DAYS (21)"
    applies_to: "POST /travel-protections/{travelProtectionId}/waiver-decision"
    error_id: ERR_WAIVER_WINDOW_CLOSED
    http_status: 422
  - priority: 61
    category: business_temporal
    rule: "POST /risk-advisories/{id}/publish when effective_from > clock_now (an advisory may not be published before it takes effect)"
    applies_to: "POST /risk-advisories/{riskAdvisoryId}/publish"
    error_id: ERR_ADVISORY_EFFECTIVE_IN_FUTURE
    http_status: 422

  # ---- priority 62-69: business_constraint ----------------------------------------------
  - priority: 62
    category: business_constraint
    rule: "POST /pilgrims/{id}/ticket-name when the departure's CONFIRMED AirBlock has seats_assigned >= seats_held and this pilgrim does not already hold a seat"
    applies_to: "POST /pilgrims/{pilgrimId}/ticket-name"
    error_id: ERR_AIR_BLOCK_SEATS_EXHAUSTED
    http_status: 409
    notes: "seats_assigned == seats_held - 1 is accepted (it consumes the last seat); seats_assigned == seats_held is rejected"
  - priority: 63
    category: business_constraint
    rule: |
      POST /service-bookings when the requested half-open buffered interval overlaps an existing
      booking at the same sacred site in status {SITE_HELD, CLERGY_CONFIRMED, CONFIRMED}:
        new_start < existing_buffered_end AND existing_start < new_buffered_end
      where buffered_end = scheduled_start_utc + duration_minutes + site.turnaround_buffer_minutes.
      Touching exactly at a buffered_end boundary is NOT an overlap.
    applies_to: "POST /service-bookings"
    error_id: ERR_SITE_SLOT_CONFLICT
    http_status: 409
  - priority: 64
    category: business_constraint
    rule: "POST /service-bookings when sum of pax_count over non-CANCELLED bookings at the same sacred site on the same UTC calendar date, including the new one, exceeds SacredSite.daily_capacity_pax"
    applies_to: "POST /service-bookings"
    error_id: ERR_SITE_DAILY_CAPACITY_EXCEEDED
    http_status: 409
    notes: "an aggregate check that fires even when every individual booking passes the interval check at priority 63"
  - priority: 65
    category: business_constraint
    rule: |
      POST /land-assignments when, for any single calendar date d in the requested closed-inclusive
      range [date_from, date_to], the sum of units_requested over existing LandAssignment rows of
      the same LandResource in status {DRAFT, COUNTERSIGNED} whose own closed-inclusive range
      contains d, plus the requested units_requested, exceeds LandResource.units_total.
      Sharing a single endpoint date DOES count as overlap.
    applies_to: "POST /land-assignments"
    error_id: ERR_LAND_RESOURCE_OVERSUBSCRIBED
    http_status: 409
  - priority: 66
    category: business_constraint
    rule: "POST /pilgrims/{id}/rooming when the number of pilgrims already assigned to the same room_label on the same departure, plus this one, exceeds the capacity of room_type_assigned (SINGLE 1, DOUBLE 2, TWIN 2)"
    applies_to: "POST /pilgrims/{pilgrimId}/rooming"
    error_id: ERR_ROOM_CAPACITY_EXCEEDED
    http_status: 409
  - priority: 67
    category: business_constraint
    rule: "any recomputation of departure_group_size_tier under the final variant finds no cancellation-grid-eligible price tier covering the fully-paid confirmed count (including a count of zero)"
    applies_to: "POST /departures/{departureId}/close-sales"
    error_id: ERR_NO_APPLICABLE_PRICE_TIER
    http_status: 422
  - priority: 68
    category: business_constraint
    rule: "POST /departures/{id}/close-sales when the count of CONFIRMED paying pilgrims is below Departure.min_pax"
    applies_to: "POST /departures/{departureId}/close-sales"
    error_id: ERR_MIN_PAX_NOT_MET
    http_status: 422
  - priority: 69
    category: business_constraint
    rule: "POST /departures/{id}/close-sales or POST /pilgrims/{id}/confirm while Departure.pending_modification_required is true"
    applies_to: "POST /departures/{departureId}/close-sales, POST /pilgrims/{pilgrimId}/confirm"
    error_id: ERR_PENDING_MODIFICATION_UNRATIFIED
    http_status: 422

  # ---- priority 70-76: business_referential ---------------------------------------------
  - priority: 70
    category: business_referential
    rule: "POST /pilgrims with recruited_by_agreement_id whose GroupLeaderAgreement.departure_id differs from the supplied departure_id, or whose status is neither PENDING_COUNTERSIGN nor ACTIVE"
    applies_to: "POST /pilgrims"
    error_id: ERR_AGREEMENT_DEPARTURE_MISMATCH
    http_status: 422
  - priority: 71
    category: business_referential
    rule: "roommate_pilgrim_id refers to a pilgrim on a different departure, to the pilgrim themself, to a CANCELLED pilgrim, or to a pilgrim whose room_type_requested differs from this pilgrim's"
    applies_to: "POST /pilgrims/{pilgrimId}/rooming"
    error_id: ERR_ROOMMATE_INVALID
    http_status: 422
  - priority: 72
    category: business_referential
    rule: "POST /pilgrims/{id}/ticket-name or POST /pilgrims/{id}/air-deviation when the departure has no AirBlock in status CONFIRMED"
    applies_to: "POST /pilgrims/{pilgrimId}/ticket-name, POST /pilgrims/{pilgrimId}/air-deviation"
    error_id: ERR_AIR_BLOCK_NOT_CONFIRMED
    http_status: 422
  - priority: 73
    category: business_referential
    rule: "POST /service-bookings/{id}/confirm when the site requires_local_clergy and clergy_contact_name is null, or the booking never recorded a clergy tradition matching the program's faith_tradition"
    applies_to: "POST /service-bookings/{serviceBookingId}/clergy-confirm, POST /service-bookings/{serviceBookingId}/confirm"
    error_id: ERR_CLERGY_NOT_CONFIRMED
    http_status: 422
  - priority: 74
    category: business_referential
    rule: "POST /service-bookings/{id}/confirm when SacredSite.access_regime == PERMIT_REQUIRED and the booking has no permit_reference"
    applies_to: "POST /service-bookings/{serviceBookingId}/confirm"
    error_id: ERR_PERMIT_REFERENCE_REQUIRED
    http_status: 422
  - priority: 75
    category: business_referential
    rule: "POST /travel-protections/{id}/waiver-decision with decision APPROVE while waiver_eligible is false for a reason other than the closed purchase window (questionnaire incomplete, or stable_period_days < 60)"
    applies_to: "POST /travel-protections/{travelProtectionId}/waiver-decision"
    error_id: ERR_WAIVER_NOT_ELIGIBLE
    http_status: 422
  - priority: 76
    category: business_referential
    rule: "POST /pilgrims with is_free_seat_grant true when the referenced agreement's earned_free_seats minus free_seats_granted_count is not greater than zero"
    applies_to: "POST /pilgrims"
    error_id: ERR_NO_EARNED_FREE_SEAT
    http_status: 422

  # ---- priority 80: business_fiscal -----------------------------------------------------
  - priority: 80
    category: business_fiscal
    rule: "POST /pilgrims/{id}/payments when cash_applied_cents + amount_cents would exceed invoice_total_cents + protection_premium_cents"
    applies_to: "POST /pilgrims/{pilgrimId}/payments"
    error_id: ERR_OVERPAYMENT_NOT_ALLOWED
    http_status: 422
    notes: "the lowest-ranked rule in the ladder; every state, safety, temporal, constraint and referential rule above it wins when both are violated"

endpoints:
  # ---- test-driving surface -------------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an explicit RFC3339 UTC instant. Every deadline, window, day-count and age computation in this scaffold reads this clock and never the host wall clock. Before any call to this endpoint the logical clock reads exactly the fixed startup default 2026-08-01T00:00:00Z; it MUST NOT fall back to real wall-clock time."
    roles: [ProgramManager, RiskOfficer, AirDeskAgent, LandContractor, FinanceController, ProtectionAdministrator]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock advanced or rewound; no stored row is recomputed by this call alone"]

  # ---- Program -------------------------------------------------------------------------
  - method: POST
    path: "/programs"
    description: "Register a pilgrimage product with its group-size price tiers and cancellation grid."
    roles: [ProgramManager]
    code: 201
    input: [name, destination_country, faith_tradition, duration_days, price_tiers, cancellation_grid]
    output: Program
    side_effects: ["price_tiers validated contiguous, non-overlapping and ascending; cancellation_grid validated to contain a min_days_before == 0 bucket; departure_count initialised to 0"]
  - method: GET
    path: "/programs/{programId}"
    description: "Read one program with its tier table, cancellation grid and departure_count."
    roles: [ProgramManager, RiskOfficer, AirDeskAgent, LandContractor, FinanceController, ProtectionAdministrator]
    code: 200
    input: []
    output: Program
    side_effects: []

  # ---- Departure -----------------------------------------------------------------------
  - method: POST
    path: "/departures"
    description: "Create a dated departure of a program, in PLANNING."
    roles: [ProgramManager]
    code: 201
    input: [program_id, departure_date, return_date, min_pax, max_pax, deposit_due_date, final_payment_due_date, mobility_accessible_coach]
    output: Departure
    side_effects: ["status = PLANNING; Program.departure_count incremented; calculations.departure_risk_posture evaluated so a departure created into an already-published advisory starts at the correct posture; calculations.departure_group_size_tier (provisional) evaluated over an empty roster, leaving provisional_tier_code null"]
  - method: GET
    path: "/departures/{departureId}"
    description: "Read one departure with its provisional and final tier snapshots, posture, land cost rollup and pending-modification fields."
    roles: [ProgramManager, RiskOfficer, AirDeskAgent, LandContractor, FinanceController, ProtectionAdministrator]
    code: 200
    input: []
    output: Departure
    side_effects: []
  - method: GET
    path: "/departures"
    description: "List departures, filterable by parent program, by governing advisory, by lifecycle status and by risk posture."
    roles: [ProgramManager, RiskOfficer, AirDeskAgent, LandContractor, FinanceController, ProtectionAdministrator]
    code: 200
    input: ["program_id?", "governing_advisory_id?", "status?", "risk_posture?", "limit?", "offset?"]
    output: Departure[]
    side_effects: []
  - method: POST
    path: "/departures/{departureId}/open-sales"
    description: "Move a PLANNING or SALES_CLOSED departure to OPEN_FOR_SALE, re-opening the roster."
    roles: [ProgramManager]
    code: 200
    input: []
    output: Departure
    side_effects: ["status = OPEN_FOR_SALE; final_tier_code and final_per_pax_price_cents cleared; calculations.departure_group_size_tier (provisional) recomputed; calculations.departure_risk_posture re-read"]
  - method: POST
    path: "/departures/{departureId}/close-sales"
    description: "Close the roster, freeze the final group-size tier and re-price every confirmed traveler."
    roles: [ProgramManager]
    code: 200
    input: []
    output: Departure
    side_effects: ["status = SALES_CLOSED; calculations.departure_group_size_tier (FINAL variant) selects the tier from fully-paid confirmed payers only; every CONFIRMED Pilgrim has price_locked_cents rewritten to final_per_pax_price_cents and calculations.pilgrim_invoice_total re-run; each such pilgrim's QUOTED TravelProtection is re-quoted through calculations.protection_premium; calculations.departure_land_cost_rollup recomputed; service_coverage_ok set true only when every ServiceBooking of the departure is CONFIRMED"]
  - method: POST
    path: "/departures/{departureId}/cancel"
    description: "Cancel the departure and unwind every dependent booking, seat block, land line, service and payment plan."
    roles: [ProgramManager]
    code: 200
    input: [cancellation_reason]
    output: Departure
    side_effects: ["status = CANCELLED; hop 1 — every non-CANCELLED Pilgrim moves to booking_status CANCELLED with calculations.pilgrim_cancellation_settlement forced to penalty_bp 0 (full refund); hop 2 — each of those pilgrims' ACTIVE PaymentPlan moves to SUPERSEDED and each QUOTED/WAIVER_APPROVED/WAIVER_DECLINED TravelProtection moves to VOIDED with premium_cents zeroed; hop 3 — every non-CANCELLED ServiceBooking moves to CANCELLED with cancelled_by_risk false and site capacity restored, every DRAFT/COUNTERSIGNED LandAssignment moves to TERMINATED with terminated_penalty_free true, every CONFIRMED AirBlock moves to RELEASED, and every ACTIVE GroupLeaderAgreement moves to TERMINATED with commission_payable_cents zeroed; land_cost_total_cents recomputed to 0"]
  - method: POST
    path: "/departures/{departureId}/payment-sweep"
    description: "Run the due-date sweep: mark overdue installments PAST_DUE and default the plans that have crossed the tolerance."
    roles: [FinanceController]
    code: 200
    input: []
    output: Departure
    side_effects: ["for every ACTIVE PaymentPlan of every non-CANCELLED Pilgrim of this departure, each installment with due_date < clock_now and status IN {SCHEDULED, PARTIALLY_PAID} becomes PAST_DUE and past_due_count is recomputed; hop 2 — a plan whose past_due_count >= PLAN_DEFAULT_PAST_DUE_COUNT (2) moves to DEFAULTED and its Pilgrim's payment_status becomes IN_DEFAULT; hop 3 — an IN_DEFAULT pilgrim in booking_status CONFIRMED reverts to DEPOSITED, which re-runs calculations.departure_group_size_tier (provisional) and calculations.leader_benefit_accrual (snapshot) for the recruiting agreement; sweep_run_count incremented and last_sweep_at set to clock_now"]
  - method: POST
    path: "/departures/{departureId}/itinerary-modification"
    description: "Propose an itinerary change (sacred-site substitution, date shift or coach swap) that must be ratified by a second officer before sales can close."
    roles: [ProgramManager, RiskOfficer]
    code: 200
    input: [modification_reason, cost_delta_cents]
    output: Departure
    side_effects: ["pending_modification_required = true; pending_modification_reason and pending_modification_cost_delta_cents recorded; pending_modification_proposed_by_user_id set to the acting X-User-ID; itinerary_cost_delta_cents left untouched until ratification"]
  - method: POST
    path: "/departures/{departureId}/ratify-modification"
    description: "Second-officer ratification of a pending itinerary modification; the proposer may not ratify their own proposal."
    roles: [ProgramManager, RiskOfficer]
    code: 200
    input: []
    output: Departure
    side_effects: ["pending_modification_required = false; itinerary_cost_delta_cents increased by pending_modification_cost_delta_cents; ratified_modification_count incremented; pending_modification_reason and pending_modification_proposed_by_user_id cleared; calculations.departure_land_cost_rollup recomputed"]

  # ---- GroupLeaderAgreement -------------------------------------------------------------
  - method: POST
    path: "/group-leader-agreements"
    description: "Offer a group-leader agreement on a departure. Guarded by optimistic concurrency on the parent departure: the caller must echo the Departure.version it read."
    roles: [ProgramManager]
    code: 201
    input: [departure_id, leader_name, leader_user_id, free_travel_threshold, commission_mode, commission_rate_cents_per_pax, accrual_basis, expected_departure_version]
    output: GroupLeaderAgreement
    side_effects: ["status = PENDING_COUNTERSIGN; any prior ACTIVE or PENDING_COUNTERSIGN agreement for the same (departure_id, leader_user_id) moves to TERMINATED and has superseded_by_agreement_id set to the new agreement's id; Departure.version incremented"]
  - method: GET
    path: "/group-leader-agreements/{agreementId}"
    description: "Read one leader agreement with its live accrual snapshot and, once settled, its settlement figures."
    roles: [ProgramManager, FinanceController, GroupLeader]
    code: 200
    input: []
    output: GroupLeaderAgreement
    side_effects: []
  - method: GET
    path: "/group-leader-agreements"
    description: "List leader agreements, filterable by departure, by superseding agreement and by status."
    roles: [ProgramManager, FinanceController, GroupLeader]
    code: 200
    input: ["departure_id?", "superseded_by_agreement_id?", "status?", "limit?", "offset?"]
    output: GroupLeaderAgreement[]
    side_effects: []
  - method: POST
    path: "/group-leader-agreements/{agreementId}/countersign"
    description: "Leader accepts the agreement, activating recruitment credit."
    roles: [GroupLeader]
    code: 200
    input: []
    output: GroupLeaderAgreement
    side_effects: ["status = ACTIVE; calculations.leader_benefit_accrual (snapshot variant) evaluated so an agreement countersigned after recruits already exist picks up their count immediately"]
  - method: POST
    path: "/group-leader-agreements/{agreementId}/settle"
    description: "Freeze the leader's earned free seats and commission using the traveled basis."
    roles: [FinanceController]
    code: 200
    input: []
    output: GroupLeaderAgreement
    side_effects: ["calculations.leader_benefit_accrual (SETTLEMENT variant) writes settled_recruited_count, settled_earned_free_seats and settled_commission_cents from fully-paid confirmed travelers at the final tier price; status = SETTLED"]

  # ---- Pilgrim -------------------------------------------------------------------------
  - method: POST
    path: "/pilgrims"
    description: "Book a traveler onto a departure, optionally credited to a recruiting leader agreement and optionally as that leader's earned free seat."
    roles: [ProgramManager, GroupLeader]
    code: 201
    input: [departure_id, full_name, date_of_birth, room_type_requested, "recruited_by_agreement_id?", "mobility_code?", "is_free_seat_grant?", "risk_acknowledged?"]
    output: Pilgrim
    side_effects: ["booking_status = INQUIRY, payment_status = UNPAID, protection_status = NONE; age_at_departure computed from date_of_birth against Departure.departure_date; is_paying = NOT is_free_seat_grant; price_locked_cents set to Departure.provisional_per_pax_price_cents for a paying traveler and to 0 for a free-seat grant; single_supplement_applied_cents set to Departure.provisional_single_supplement_cents when room_type_requested == SINGLE; calculations.pilgrim_invoice_total run; calculations.departure_group_size_tier (provisional) recomputed on the departure; calculations.leader_benefit_accrual (snapshot) recomputed on the agreement, and free_seats_granted_count incremented when is_free_seat_grant is true; Pilgrim.version starts at 1"]
  - method: GET
    path: "/pilgrims/{pilgrimId}"
    description: "Read one traveler with rooming, ticketing, invoice, payment and protection fields."
    roles: [ProgramManager, RiskOfficer, AirDeskAgent, FinanceController, ProtectionAdministrator, GroupLeader]
    code: 200
    input: []
    output: Pilgrim
    side_effects: []
  - method: GET
    path: "/pilgrims"
    description: "List travelers, filterable by departure, by recruiting leader agreement, by rooming partner and by booking status."
    roles: [ProgramManager, RiskOfficer, AirDeskAgent, FinanceController, ProtectionAdministrator, GroupLeader]
    code: 200
    input: ["departure_id?", "recruited_by_agreement_id?", "roommate_pilgrim_id?", "booking_status?", "limit?", "offset?"]
    output: Pilgrim[]
    side_effects: []
  - method: POST
    path: "/pilgrims/{pilgrimId}/confirm"
    description: "Confirm a deposited traveler for travel; gated on the departure's risk posture, on senior protection, and on there being no unratified itinerary modification."
    roles: [ProgramManager]
    code: 200
    input: []
    output: Pilgrim
    side_effects: ["booking_status = CONFIRMED; calculations.pilgrim_invoice_total re-run; calculations.departure_group_size_tier (provisional) recomputed; calculations.leader_benefit_accrual (snapshot) recomputed on the recruiting agreement; Pilgrim.version incremented"]
  - method: POST
    path: "/pilgrims/{pilgrimId}/cancel"
    description: "Cancel one traveler, applying the program's cancellation grid to compute the retained penalty and the refund."
    roles: [ProgramManager, FinanceController]
    code: 200
    input: [cancellation_reason]
    output: Pilgrim
    side_effects: ["booking_status = CANCELLED; calculations.pilgrim_cancellation_settlement writes penalty_retained_cents and refund_cents; hop 2 — the ACTIVE PaymentPlan moves to SUPERSEDED and the non-terminal TravelProtection moves to VOIDED with premium_cents zeroed; hop 3 — the departure's provisional tier is recomputed by calculations.departure_group_size_tier and the recruiting agreement's calculations.leader_benefit_accrual (snapshot) is recomputed, which can drop earned_free_seats; the seat held on a CONFIRMED AirBlock is released by decrementing seats_assigned when this pilgrim had a ticketed_name; Pilgrim.version incremented"]
  - method: POST
    path: "/pilgrims/{pilgrimId}/rooming"
    description: "Assign the room, floor, rooming partner and dietary requirements for a traveler."
    roles: [ProgramManager]
    code: 200
    input: [room_type_assigned, room_label, ground_floor, "roommate_pilgrim_id?", "dietary_codes?"]
    output: Pilgrim
    side_effects: ["room_type_assigned, room_label, ground_floor and dietary_codes written; roommate_pilgrim_id written on both travelers so the pairing is mutual; single_supplement_applied_cents set to Departure.provisional_single_supplement_cents when room_type_assigned == SINGLE and cleared to 0 otherwise; calculations.pilgrim_invoice_total re-run; Pilgrim.version incremented"]
  - method: POST
    path: "/pilgrims/{pilgrimId}/ticket-name"
    description: "Submit the traveler's ticketed name into the confirmed air block, consuming one held seat."
    roles: [AirDeskAgent]
    code: 200
    input: [ticketed_name]
    output: Pilgrim
    side_effects: ["ticketed_name written; the departure's CONFIRMED AirBlock has seats_assigned incremented, unless this pilgrim already held a seat in which case the count is unchanged; Pilgrim.version incremented"]
  - method: POST
    path: "/pilgrims/{pilgrimId}/air-deviation"
    description: "Record an air deviation request (origin change, date deviation or class upgrade) and price its fee against the confirmed block fare and the days remaining to departure."
    roles: [AirDeskAgent]
    code: 200
    input: [deviation_type]
    output: Pilgrim
    side_effects: ["calculations.air_deviation_fee writes deviation_type and deviation_fee_cents; calculations.pilgrim_invoice_total re-run, which can move the invoice across a grant breakpoint; a QUOTED TravelProtection on this pilgrim is re-quoted by calculations.protection_premium; Pilgrim.version incremented"]
  - method: POST
    path: "/pilgrims/{pilgrimId}/payment-plans"
    description: "Create the traveler's installment plan against the current invoice. Guarded by optimistic concurrency on the parent pilgrim: the caller must echo the Pilgrim.version it read, so a plan built on a pre-deviation or pre-repricing invoice is rejected rather than written."
    roles: [FinanceController]
    code: 201
    input: [plan_type, first_due_date, expected_pilgrim_version]
    output: PaymentPlan
    side_effects: ["any existing ACTIVE plan of this pilgrim moves to SUPERSEDED, has superseded_by_plan_id set to the new plan's id, and every cent already recorded in its installments is returned to Pilgrim.credit_balance_cents; status = ACTIVE; calculations.payment_plan_schedule builds the installments array from Pilgrim.invoice_total_cents; calculations.payment_waterfall_allocation then drains the whole of Pilgrim.credit_balance_cents into the new installments, earliest due_date first; calculations.pilgrim_cash_conservation asserted; Pilgrim.version incremented"]
  - method: GET
    path: "/payment-plans/{paymentPlanId}"
    description: "Read one installment plan with its full installments array and past_due_count."
    roles: [FinanceController, ProgramManager]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: []
  - method: GET
    path: "/payment-plans"
    description: "List installment plans, filterable by traveler, by superseding plan and by status."
    roles: [FinanceController, ProgramManager]
    code: 200
    input: ["pilgrim_id?", "superseded_by_plan_id?", "status?", "limit?", "offset?"]
    output: PaymentPlan[]
    side_effects: []

  # ---- Payment -------------------------------------------------------------------------
  - method: POST
    path: "/pilgrims/{pilgrimId}/payments"
    description: "Record cash received from a traveler and allocate it across the active plan's installments, earliest due date first, with any overflow parked as credit."
    roles: [FinanceController]
    code: 201
    input: [amount_cents, method, "received_at?"]
    output: Payment
    side_effects: ["status = APPLIED; received_at defaults to clock_now; calculations.payment_waterfall_allocation fills installments in due_date ASC then sequence_no ASC order and writes the per-bucket allocation array on the Payment; Pilgrim.cash_applied_cents increased by amount_cents; payment_status re-derived across {UNPAID, DEPOSIT_PAID, PLAN_ACTIVE, PAID_IN_FULL}; a pilgrim in booking_status INQUIRY whose cash_applied_cents has reached Departure.provisional_deposit_cents moves to DEPOSITED, which stamps deposit_reference_date on any TravelProtection of this pilgrim and recomputes calculations.departure_group_size_tier (provisional) and calculations.leader_benefit_accrual (snapshot); calculations.pilgrim_cash_conservation asserted; Pilgrim.version incremented"]
  - method: GET
    path: "/payments/{paymentId}"
    description: "Read one cash receipt with its per-installment allocation breakdown."
    roles: [FinanceController, ProgramManager]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/payments"
    description: "List cash receipts, filterable by traveler and by applied/reversed status."
    roles: [FinanceController, ProgramManager]
    code: 200
    input: ["pilgrim_id?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: POST
    path: "/payments/{paymentId}/reverse"
    description: "Compensating action for a receipt: un-allocate exactly the cents this payment placed, in reverse allocation order, leaving no drift."
    roles: [FinanceController]
    code: 200
    input: [reversal_reason]
    output: Payment
    side_effects: ["status = REVERSED and reversed_at = clock_now; the allocation array is walked in reverse list order, so CREDIT entries are removed from Pilgrim.credit_balance_cents before INSTALLMENT entries are unwound in descending sequence_no, each restoring the installment's amount_paid_cents and re-deriving its status; a COMPLETED plan reverts to ACTIVE; Pilgrim.cash_applied_cents decreased by amount_cents; payment_status re-derived; a pilgrim who falls back below Departure.provisional_deposit_cents while still in booking_status DEPOSITED reverts to INQUIRY, which recomputes calculations.departure_group_size_tier (provisional) and calculations.leader_benefit_accrual (snapshot); calculations.pilgrim_cash_conservation asserted; Pilgrim.version incremented"]

  # ---- AirBlock ------------------------------------------------------------------------
  - method: POST
    path: "/air-blocks"
    description: "Open an air block negotiation with a carrier for a departure, in DRAFT."
    roles: [AirDeskAgent]
    code: 201
    input: [departure_id, carrier_code, seats_held, name_change_deadline_utc, deposit_deadline_utc]
    output: AirBlock
    side_effects: ["status = DRAFT; negotiation_round = 0; offered_fare_cents, countered_fare_cents and contracted_fare_cents all 0; seats_assigned = 0"]
  - method: GET
    path: "/air-blocks/{airBlockId}"
    description: "Read one air block with its negotiation history counters, deadlines and seat usage."
    roles: [AirDeskAgent, ProgramManager, FinanceController]
    code: 200
    input: []
    output: AirBlock
    side_effects: []
  - method: GET
    path: "/air-blocks"
    description: "List air blocks, filterable by departure and by negotiation status."
    roles: [AirDeskAgent, ProgramManager, FinanceController]
    code: 200
    input: ["departure_id?", "status?", "limit?", "offset?"]
    output: AirBlock[]
    side_effects: []
  - method: POST
    path: "/air-blocks/{airBlockId}/negotiation-rounds"
    description: "Append one negotiation round. party = CARRIER_OFFER records the carrier's standing fare and pushes the block to OFFERED; party = OPERATOR_COUNTER records the operator's improved counter and pushes it to COUNTERED. The OFFERED -> COUNTERED -> OFFERED loop may repeat without bound."
    roles: [AirDeskAgent]
    code: 200
    input: [party, fare_cents, "name_change_deadline_utc?", "requested_seats?"]
    output: AirBlock
    side_effects: ["CARRIER_OFFER sets status = OFFERED, overwrites offered_fare_cents, increments negotiation_round, and overwrites name_change_deadline_utc when supplied; OPERATOR_COUNTER sets status = COUNTERED, writes countered_fare_cents and overwrites seats_held from requested_seats when supplied, leaving negotiation_round unchanged; a block whose deposit_deadline_utc has already passed instead moves to EXPIRED and the call fails; AirBlock.version incremented"]
  - method: POST
    path: "/air-blocks/{airBlockId}/confirm"
    description: "Accept the carrier's standing offer, contracting the block and opening ticketing."
    roles: [AirDeskAgent]
    code: 200
    input: []
    output: AirBlock
    side_effects: ["status = CONFIRMED; contracted_fare_cents = offered_fare_cents; seats_assigned recomputed from the count of pilgrims on the departure that already carry a ticketed_name; AirBlock.version incremented"]

  # ---- SacredSite ----------------------------------------------------------------------
  - method: POST
    path: "/sacred-sites"
    description: "Register a sacred site with its access regime, per-day pax capacity and turnaround buffer."
    roles: [ProgramManager]
    code: 201
    input: [name, country, access_regime, daily_capacity_pax, turnaround_buffer_minutes, requires_local_clergy]
    output: SacredSite
    side_effects: []
  - method: GET
    path: "/sacred-sites/{sacredSiteId}"
    description: "Read one sacred site with its capacity and access rules."
    roles: [ProgramManager, RiskOfficer, LandContractor]
    code: 200
    input: []
    output: SacredSite
    side_effects: []

  # ---- ServiceBooking ------------------------------------------------------------------
  - method: POST
    path: "/service-bookings"
    description: "Hold a service slot (Mass, liturgy, procession, guided devotion) at a sacred site for a departure. The slot occupies its scheduled minutes plus the site's turnaround buffer, and also draws down the site's per-day pax capacity."
    roles: [ProgramManager]
    code: 201
    input: [departure_id, sacred_site_id, service_type, scheduled_start_utc, duration_minutes, pax_count, "permit_reference?"]
    output: ServiceBooking
    side_effects: ["status = SITE_HELD; buffered_end_utc computed as scheduled_start_utc + duration_minutes + SacredSite.turnaround_buffer_minutes; the half-open interval check at validations priority 63 and the per-day aggregate check at priority 64 both run before the row is written; cancelled_by_risk = false; Departure.service_coverage_ok set false because a newly held service is not yet CONFIRMED; calculations.site_capacity_conservation asserted"]
  - method: GET
    path: "/service-bookings/{serviceBookingId}"
    description: "Read one service booking with its buffered interval, clergy details and permit reference."
    roles: [ProgramManager, RiskOfficer, LandContractor]
    code: 200
    input: []
    output: ServiceBooking
    side_effects: []
  - method: GET
    path: "/service-bookings"
    description: "List service bookings, filterable by departure, by sacred site and by status."
    roles: [ProgramManager, RiskOfficer, LandContractor]
    code: 200
    input: ["departure_id?", "sacred_site_id?", "status?", "limit?", "offset?"]
    output: ServiceBooking[]
    side_effects: []
  - method: POST
    path: "/service-bookings/{serviceBookingId}/clergy-confirm"
    description: "Record the local clergy contact who will preside, matching the program's faith tradition."
    roles: [ProgramManager]
    code: 200
    input: [clergy_contact_name, clergy_tradition]
    output: ServiceBooking
    side_effects: ["status = CLERGY_CONFIRMED; clergy_contact_name and clergy_tradition written"]
  - method: POST
    path: "/service-bookings/{serviceBookingId}/confirm"
    description: "Confirm the service slot once clergy and, where the access regime demands it, the permit reference are in place."
    roles: [ProgramManager]
    code: 200
    input: []
    output: ServiceBooking
    side_effects: ["status = CONFIRMED; Departure.service_coverage_ok recomputed to true only when every non-CANCELLED ServiceBooking of the departure is CONFIRMED"]
  - method: POST
    path: "/service-bookings/{serviceBookingId}/cancel"
    description: "Release a held or confirmed service slot, returning its minutes and its pax slots to the site."
    roles: [ProgramManager, RiskOfficer]
    code: 200
    input: [cancellation_reason]
    output: ServiceBooking
    side_effects: ["status = CANCELLED; cancelled_by_risk = false for an operator-initiated cancel; the site's buffered interval and its per-day pax occupancy are both released, so calculations.site_capacity_conservation holds exactly; Departure.service_coverage_ok recomputed"]

  # ---- LandResource --------------------------------------------------------------------
  - method: POST
    path: "/land-resources"
    description: "Register a land operator's capacity pool (hotel rooms, guides or motorcoaches) with its local unit rate, FX rate in basis points and force-majeure notice period."
    roles: [LandContractor]
    code: 201
    input: [operator_name, country, resource_type, units_total, unit_rate_local_cents, fx_rate_bp, force_majeure_notice_days]
    output: LandResource
    side_effects: []
  - method: GET
    path: "/land-resources/{landResourceId}"
    description: "Read one land capacity pool with its rate and FX basis."
    roles: [LandContractor, ProgramManager, FinanceController]
    code: 200
    input: []
    output: LandResource
    side_effects: []

  # ---- LandAssignment -----------------------------------------------------------------
  - method: POST
    path: "/land-assignments"
    description: "Draw units of a land resource for a departure over a closed-inclusive date range. Occupancy is counted per calendar date across DRAFT and COUNTERSIGNED lines, and a shared endpoint date does count as overlap."
    roles: [LandContractor]
    code: 201
    input: [land_resource_id, departure_id, date_from, date_to, units_requested]
    output: LandAssignment
    side_effects: ["status = DRAFT; days_inclusive computed as the inclusive day count of [date_from, date_to]; line_local_cents and line_usd_cents computed by calculations.departure_land_cost_rollup for this line; the per-date aggregate oversubscription check at validations priority 65 runs before the row is written; Departure.land_cost_total_cents is NOT changed, because only COUNTERSIGNED lines enter the rollup"]
  - method: GET
    path: "/land-assignments/{landAssignmentId}"
    description: "Read one land line with its inclusive day count, local amount and converted USD amount."
    roles: [LandContractor, ProgramManager, FinanceController]
    code: 200
    input: []
    output: LandAssignment
    side_effects: []
  - method: GET
    path: "/land-assignments"
    description: "List land lines, filterable by capacity pool, by departure and by status."
    roles: [LandContractor, ProgramManager, FinanceController]
    code: 200
    input: ["land_resource_id?", "departure_id?", "status?", "limit?", "offset?"]
    output: LandAssignment[]
    side_effects: []
  - method: POST
    path: "/land-assignments/{landAssignmentId}/countersign"
    description: "Countersign a draft land line under the operator's local conditions, admitting it to the departure's land cost."
    roles: [LandContractor]
    code: 200
    input: []
    output: LandAssignment
    side_effects: ["status = COUNTERSIGNED; calculations.departure_land_cost_rollup recomputed for the departure, rounding each countersigned line to whole USD cents before summing"]
  - method: POST
    path: "/land-assignments/{landAssignmentId}/terminate"
    description: "Terminate a land line, releasing its units; whether the termination is penalty-free depends on the operator's force-majeure notice period."
    roles: [LandContractor]
    code: 200
    input: [termination_reason]
    output: LandAssignment
    side_effects: ["status = TERMINATED; terminated_penalty_free set true when (date_from - clock_now) in days >= LandResource.force_majeure_notice_days, else false; the units are released for every date in the line's range; calculations.departure_land_cost_rollup recomputed, dropping this line's contribution"]

  # ---- TravelProtection ----------------------------------------------------------------
  - method: POST
    path: "/travel-protections"
    description: "Quote travel protection and medical coverage for a traveler, priced off the traveler's current invoice, age band, medical limit and any pre-existing condition waiver request."
    roles: [ProtectionAdministrator]
    code: 201
    input: [pilgrim_id, plan_code, medical_limit_cents, pre_existing_waiver_requested]
    output: TravelProtection
    side_effects: ["status = QUOTED; pilgrim.protection_status = QUOTED; questionnaire_complete = false, stable_period_days = 0, waiver_eligible = false; deposit_reference_date stamped from the pilgrim's deposit date when the pilgrim is already DEPOSITED or beyond, else null; calculations.protection_premium writes insured_trip_cost_cents, age_band, base_premium_cents, medical_uplift_cents, waiver_surcharge_cents (0 at quote time) and premium_cents"]
  - method: GET
    path: "/travel-protections/{travelProtectionId}"
    description: "Read one protection quote or policy with its premium decomposition."
    roles: [ProtectionAdministrator, ProgramManager, FinanceController]
    code: 200
    input: []
    output: TravelProtection
    side_effects: []
  - method: GET
    path: "/travel-protections"
    description: "List protection rows, filterable by traveler and by status."
    roles: [ProtectionAdministrator, ProgramManager, FinanceController]
    code: 200
    input: ["pilgrim_id?", "status?", "limit?", "offset?"]
    output: TravelProtection[]
    side_effects: []
  - method: POST
    path: "/travel-protections/{travelProtectionId}/medical-review"
    description: "Record the medical questionnaire outcome and the traveler's stable period, then derive waiver eligibility. The reviewing user is stamped so the same user cannot also decide the waiver."
    roles: [ProtectionAdministrator]
    code: 200
    input: [questionnaire_complete, stable_period_days]
    output: TravelProtection
    side_effects: ["status = MEDICAL_REVIEWED; medical_review_by_user_id set to the acting X-User-ID; calculations.waiver_eligibility writes waiver_eligible; pilgrim.protection_status = MEDICAL_REVIEWED"]
  - method: POST
    path: "/travel-protections/{travelProtectionId}/waiver-decision"
    description: "Approve or decline the pre-existing condition waiver. Must be performed by a user other than the medical reviewer."
    roles: [ProtectionAdministrator]
    code: 200
    input: [decision]
    output: TravelProtection
    side_effects: ["decision APPROVE sets status = WAIVER_APPROVED and pilgrim.protection_status = WAIVER_APPROVED; decision DECLINE sets status = WAIVER_DECLINED and pilgrim.protection_status = WAIVER_DECLINED; calculations.waiver_eligibility re-evaluated against the clock; calculations.protection_premium re-run, so an approved waiver adds the capped surcharge and a declined waiver leaves it at 0"]
  - method: POST
    path: "/travel-protections/{travelProtectionId}/purchase"
    description: "Bind the protection policy at the standing premium."
    roles: [ProtectionAdministrator]
    code: 200
    input: []
    output: TravelProtection
    side_effects: ["status = PURCHASED; pilgrim.protection_status = PURCHASED; pilgrim.protection_premium_cents = premium_cents, which also raises the overpayment ceiling checked at validations priority 80"]

  # ---- RiskAdvisory --------------------------------------------------------------------
  - method: POST
    path: "/risk-advisories"
    description: "Draft a destination risk advisory for a country at a given level and effective date."
    roles: [RiskOfficer]
    code: 201
    input: [country, level, effective_from, source]
    output: RiskAdvisory
    side_effects: ["status = DRAFT; affected_departure_count = 0; no departure posture changes while the advisory is a draft"]
  - method: GET
    path: "/risk-advisories/{riskAdvisoryId}"
    description: "Read one advisory with its level, effective date and the number of departures it governs."
    roles: [RiskOfficer, ProgramManager, ProtectionAdministrator, FinanceController]
    code: 200
    input: []
    output: RiskAdvisory
    side_effects: []
  - method: POST
    path: "/risk-advisories/{riskAdvisoryId}/publish"
    description: "Publish the advisory, re-deriving the posture of every departure to that country and cascading itinerary and booking consequences four levels deep."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: RiskAdvisory
    side_effects: ["status = PUBLISHED; any previously PUBLISHED advisory for the same country moves to SUPERSEDED; hop 1 — every non-terminal Departure whose program destination_country matches has calculations.departure_risk_posture re-run, writing risk_posture and governing_advisory_id, and affected_departure_count is set to the number of departures touched; hop 2 — on a departure that lands on SUSPENDED, every non-CANCELLED ServiceBooking moves to CANCELLED with cancelled_by_risk = true and its site capacity restored, service_coverage_ok set false, every AirBlock in {DRAFT, OFFERED, COUNTERED} moves to EXPIRED and a CONFIRMED block moves to RELEASED, and pending_modification_required is set true with reason ADVISORY_SUSPENSION and pending_modification_proposed_by_user_id set to the publishing X-User-ID; hop 3 — every CONFIRMED Pilgrim on a SUSPENDED departure reverts to booking_status DEPOSITED and has ticketed_name cleared, which recomputes calculations.departure_group_size_tier (provisional); hop 4 — the recruiting GroupLeaderAgreement of each reverted pilgrim has calculations.leader_benefit_accrual (snapshot) recomputed, which can reduce earned_free_seats and commission_payable_cents"]

errors:
  # ---- authentication / authorization ---------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-Role header absent, empty, or not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed on the target endpoint, or a GroupLeader addresses an agreement or traveler that is not theirs"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID is the same user who proposed the itinerary modification now being ratified, or who performed the medical review whose waiver is now being decided"

  # ---- request shape --------------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, out-of-set enum, negative money or count, inverted date range, malformed price_tiers or cancellation_grid, or a non-RFC3339 clock instant"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit < 1, limit > 100, offset < 0, or either not an integer on a list endpoint"

  # ---- existence ------------------------------------------------------------------------
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "no Program with the given id, in the path or as a body foreign key"
  - id: ERR_DEPARTURE_NOT_FOUND
    http: 404
    condition: "no Departure with the given id, in the path or as a body foreign key"
  - id: ERR_PILGRIM_NOT_FOUND
    http: 404
    condition: "no Pilgrim with the given id, in the path or as a body foreign key including roommate_pilgrim_id"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no GroupLeaderAgreement with the given id, in the path or as recruited_by_agreement_id"
  - id: ERR_AIR_BLOCK_NOT_FOUND
    http: 404
    condition: "no AirBlock with the given id"
  - id: ERR_SACRED_SITE_NOT_FOUND
    http: 404
    condition: "no SacredSite with the given id, in the path or as a body foreign key"
  - id: ERR_SERVICE_BOOKING_NOT_FOUND
    http: 404
    condition: "no ServiceBooking with the given id"
  - id: ERR_LAND_RESOURCE_NOT_FOUND
    http: 404
    condition: "no LandResource with the given id, in the path or as a body foreign key"
  - id: ERR_LAND_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no LandAssignment with the given id"
  - id: ERR_PAYMENT_PLAN_NOT_FOUND
    http: 404
    condition: "no PaymentPlan with the given id"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "no Payment with the given id"
  - id: ERR_PROTECTION_NOT_FOUND
    http: 404
    condition: "no TravelProtection with the given id"
  - id: ERR_ADVISORY_NOT_FOUND
    http: 404
    condition: "no RiskAdvisory with the given id"

  # ---- state ----------------------------------------------------------------------------
  - id: ERR_DEPARTURE_INVALID_STATE
    http: 409
    condition: "the departure's lifecycle status does not admit the requested action, or a child row is created against a departure past OPEN_FOR_SALE"
  - id: ERR_PILGRIM_NOT_ACTIVE
    http: 409
    condition: "the traveler's booking_status does not admit the requested action; in particular a CANCELLED traveler admits nothing"
  - id: ERR_AIR_BLOCK_INVALID_STATE
    http: 409
    condition: "negotiation round or confirmation requested from a block state that does not admit it, a counter that fails to improve on the standing offer, a second CONFIRMED block on one departure, or a write against a block whose deposit deadline has lapsed"
  - id: ERR_SERVICE_BOOKING_INVALID_STATE
    http: 409
    condition: "clergy-confirm, confirm or cancel requested from a service-booking state that does not admit it"
  - id: ERR_LAND_ASSIGNMENT_INVALID_STATE
    http: 409
    condition: "countersign requested on a line that is not DRAFT, or terminate requested on a line that is already TERMINATED"
  - id: ERR_AGREEMENT_INVALID_STATE
    http: 409
    condition: "countersign requested on an agreement that is not PENDING_COUNTERSIGN, or settle requested on an agreement that is not ACTIVE or whose departure has not closed sales"
  - id: ERR_PROTECTION_INVALID_STATE
    http: 409
    condition: "medical-review, waiver-decision or purchase requested from a protection state that does not admit it"
  - id: ERR_ADVISORY_INVALID_STATE
    http: 409
    condition: "publish requested on an advisory that is not DRAFT"
  - id: ERR_PAYMENT_ALREADY_REVERSED
    http: 409
    condition: "reverse requested on a Payment whose status is already REVERSED"
  - id: ERR_NO_PENDING_MODIFICATION
    http: 409
    condition: "ratify-modification requested while pending_modification_required is false"

  # ---- optimistic concurrency -----------------------------------------------------------
  - id: ERR_STALE_PILGRIM_VERSION
    http: 412
    condition: "expected_pilgrim_version does not match the current Pilgrim.version at POST /pilgrims/{pilgrimId}/payment-plans"
  - id: ERR_STALE_DEPARTURE_VERSION
    http: 412
    condition: "expected_departure_version does not match the current Departure.version at POST /group-leader-agreements"

  # ---- business_safety ------------------------------------------------------------------
  - id: ERR_MOBILITY_UNSUPPORTED
    http: 422
    condition: "a traveler requiring a wheelchair or walker is booked onto a departure whose coach is not mobility accessible"
  - id: ERR_MOBILITY_ACCOMMODATION_UNMET
    http: 422
    condition: "rooming assigns a non-ground-floor room to a traveler who requires a wheelchair or walker"
  - id: ERR_DEPARTURE_SUSPENDED_NO_NEW_BOOKINGS
    http: 422
    condition: "a new traveler is booked onto a departure whose risk_posture is SUSPENDED"
  - id: ERR_RISK_ACKNOWLEDGEMENT_REQUIRED
    http: 422
    condition: "confirmation attempted on a RESTRICTED departure while the traveler has not acknowledged the destination risk"
  - id: ERR_DEPARTURE_POSTURE_BLOCKS_CONFIRM
    http: 422
    condition: "confirmation attempted on a departure whose risk_posture is SUSPENDED, which no acknowledgement can unlock"
  - id: ERR_SENIOR_PROTECTION_REQUIRED
    http: 422
    condition: "confirmation attempted for a traveler aged at least SENIOR_PROTECTION_AGE (70) at departure who holds no PURCHASED travel protection"

  # ---- business_temporal ----------------------------------------------------------------
  - id: ERR_NAME_CHANGE_DEADLINE_PASSED
    http: 422
    condition: "a ticketed name is submitted after the confirmed air block's name_change_deadline_utc"
  - id: ERR_DIETARY_LEAD_TIME_UNMET
    http: 422
    condition: "kosher or halal catering is requested fewer than DIETARY_LEAD_TIME_MIN_DAYS (21) days before departure"
  - id: ERR_WAIVER_WINDOW_CLOSED
    http: 422
    condition: "a pre-existing condition waiver is approved more than WAIVER_PURCHASE_WINDOW_DAYS (21) days after the traveler's deposit reference date"
  - id: ERR_ADVISORY_EFFECTIVE_IN_FUTURE
    http: 422
    condition: "publish requested on an advisory whose effective_from is later than the logical clock"

  # ---- business_constraint --------------------------------------------------------------
  - id: ERR_AIR_BLOCK_SEATS_EXHAUSTED
    http: 409
    condition: "a ticketed name would take a seat beyond the confirmed block's seats_held"
  - id: ERR_SITE_SLOT_CONFLICT
    http: 409
    condition: "a requested service slot's buffered interval overlaps a live booking at the same sacred site"
  - id: ERR_SITE_DAILY_CAPACITY_EXCEEDED
    http: 409
    condition: "the requested pax_count would push a sacred site's same-day live pax total above daily_capacity_pax"
  - id: ERR_LAND_RESOURCE_OVERSUBSCRIBED
    http: 409
    condition: "on at least one calendar date in the requested inclusive range, live unit draws on the land resource would exceed units_total"
  - id: ERR_ROOM_CAPACITY_EXCEEDED
    http: 409
    condition: "a rooming assignment would put more travelers in a room label than the assigned room type holds"
  - id: ERR_NO_APPLICABLE_PRICE_TIER
    http: 422
    condition: "the final group-size count, including a count of zero, falls outside every tier range in the program's price_tiers"
  - id: ERR_MIN_PAX_NOT_MET
    http: 422
    condition: "close-sales attempted while confirmed paying travelers number fewer than the departure's min_pax"
  - id: ERR_PENDING_MODIFICATION_UNRATIFIED
    http: 422
    condition: "close-sales or traveler confirmation attempted while an itinerary modification is still awaiting second-officer ratification"

  # ---- business_referential -------------------------------------------------------------
  - id: ERR_AGREEMENT_DEPARTURE_MISMATCH
    http: 422
    condition: "the recruiting leader agreement belongs to a different departure, or is TERMINATED or SETTLED"
  - id: ERR_ROOMMATE_INVALID
    http: 422
    condition: "the nominated rooming partner is on a different departure, is the traveler themself, is cancelled, or requested a different room type"
  - id: ERR_AIR_BLOCK_NOT_CONFIRMED
    http: 422
    condition: "ticketing or an air deviation is requested while the departure has no CONFIRMED air block"
  - id: ERR_CLERGY_NOT_CONFIRMED
    http: 422
    condition: "a service is confirmed at a site that requires local clergy without a clergy contact whose tradition matches the program"
  - id: ERR_PERMIT_REFERENCE_REQUIRED
    http: 422
    condition: "a service is confirmed at a PERMIT_REQUIRED site without a permit reference"
  - id: ERR_WAIVER_NOT_ELIGIBLE
    http: 422
    condition: "a pre-existing condition waiver is approved while the questionnaire is incomplete or the stable period is shorter than WAIVER_STABLE_PERIOD_MIN_DAYS (60)"
  - id: ERR_NO_EARNED_FREE_SEAT
    http: 422
    condition: "a free-seat grant is booked against an agreement whose earned free seats are already fully granted"

  # ---- business_fiscal ------------------------------------------------------------------
  - id: ERR_OVERPAYMENT_NOT_ALLOWED
    http: 422
    condition: "a receipt would push the traveler's applied cash above invoice_total_cents plus protection_premium_cents"

roles:
  - name: ProgramManager
    description: "Owns products, departures, rosters, rooming, itineraries and sacred-site services. The commercial operator of the pilgrimage."
    identity: opaque
    exclusive_operations:
      - "POST /programs"
      - "POST /departures"
      - "POST /departures/{departureId}/open-sales"
      - "POST /departures/{departureId}/close-sales"
      - "POST /departures/{departureId}/cancel"
      - "POST /group-leader-agreements"
      - "POST /pilgrims/{pilgrimId}/confirm"
      - "POST /pilgrims/{pilgrimId}/rooming"
      - "POST /sacred-sites"
      - "POST /service-bookings"
      - "POST /service-bookings/{serviceBookingId}/clergy-confirm"
      - "POST /service-bookings/{serviceBookingId}/confirm"
    shared_operations:
      - "POST /pilgrims (shared with GroupLeader)"
      - "POST /pilgrims/{pilgrimId}/cancel (shared with FinanceController)"
      - "POST /departures/{departureId}/itinerary-modification (shared with RiskOfficer)"
      - "POST /departures/{departureId}/ratify-modification (shared with RiskOfficer, and barred to the proposing user)"
      - "POST /service-bookings/{serviceBookingId}/cancel (shared with RiskOfficer)"
      - "POST /_clock/set_current_utc and every GET endpoint except the leader-scoped reads"
  - name: RiskOfficer
    description: "Owns destination risk advisories and the itinerary consequences of a posture change."
    identity: opaque
    exclusive_operations:
      - "POST /risk-advisories"
      - "POST /risk-advisories/{riskAdvisoryId}/publish"
    shared_operations:
      - "POST /departures/{departureId}/itinerary-modification (shared with ProgramManager)"
      - "POST /departures/{departureId}/ratify-modification (shared with ProgramManager, and barred to the proposing user)"
      - "POST /service-bookings/{serviceBookingId}/cancel (shared with ProgramManager)"
      - "POST /_clock/set_current_utc, GET /departures, GET /pilgrims, GET /service-bookings and the other operational reads"
  - name: AirDeskAgent
    description: "Negotiates air blocks with carriers and administers ticketed names and deviation requests."
    identity: opaque
    exclusive_operations:
      - "POST /air-blocks"
      - "POST /air-blocks/{airBlockId}/negotiation-rounds"
      - "POST /air-blocks/{airBlockId}/confirm"
      - "POST /pilgrims/{pilgrimId}/ticket-name"
      - "POST /pilgrims/{pilgrimId}/air-deviation"
    shared_operations:
      - "POST /_clock/set_current_utc, GET /air-blocks, GET /pilgrims, GET /departures"
  - name: LandContractor
    description: "Contracts hotels, guides and motorcoaches and manages their capacity pools and local-currency lines."
    identity: opaque
    exclusive_operations:
      - "POST /land-resources"
      - "POST /land-assignments"
      - "POST /land-assignments/{landAssignmentId}/countersign"
      - "POST /land-assignments/{landAssignmentId}/terminate"
    shared_operations:
      - "POST /_clock/set_current_utc, GET /land-resources, GET /land-assignments, GET /sacred-sites, GET /service-bookings, GET /departures"
  - name: FinanceController
    description: "Owns deposit schedules, payment plans, cash receipts, reversals, delinquency sweeps and leader settlement."
    identity: opaque
    exclusive_operations:
      - "POST /departures/{departureId}/payment-sweep"
      - "POST /group-leader-agreements/{agreementId}/settle"
      - "POST /pilgrims/{pilgrimId}/payment-plans"
      - "POST /pilgrims/{pilgrimId}/payments"
      - "POST /payments/{paymentId}/reverse"
    shared_operations:
      - "POST /pilgrims/{pilgrimId}/cancel (shared with ProgramManager)"
      - "POST /_clock/set_current_utc, GET /payment-plans, GET /payments, GET /pilgrims, GET /departures, GET /travel-protections"
  - name: ProtectionAdministrator
    description: "Quotes travel protection, runs medical review, decides pre-existing condition waivers and binds policies."
    identity: opaque
    exclusive_operations:
      - "POST /travel-protections"
      - "POST /travel-protections/{travelProtectionId}/medical-review"
      - "POST /travel-protections/{travelProtectionId}/waiver-decision"
      - "POST /travel-protections/{travelProtectionId}/purchase"
    shared_operations:
      - "POST /_clock/set_current_utc, GET /travel-protections, GET /pilgrims, GET /departures, GET /risk-advisories"
  - name: GroupLeader
    description: "A recruited parish or ministry leader acting under one countersigned agreement. X-User-ID is the id of that GroupLeaderAgreement, and the leader may only read the agreement and the travelers they recruited."
    identity: "entity_backed:GroupLeaderAgreement"
    exclusive_operations:
      - "POST /group-leader-agreements/{agreementId}/countersign"
    shared_operations:
      - "POST /pilgrims (shared with ProgramManager, and only with recruited_by_agreement_id equal to the leader's own agreement)"
      - "GET /group-leader-agreements/{agreementId}, GET /group-leader-agreements, GET /pilgrims/{pilgrimId}, GET /pilgrims (all scoped to the leader's own agreement)"
