            - "Call 1: HTTP 200, stage == 'PERFORMANCE_PLAN' - exactly one rung - with discretionary_hold now true, last_action_by_user_id == 'hrbp-1', and Team.formal_action_count STILL 1 because the case was already inside the formal-action band"
            - "Call 2: HTTP 200, stage == 'REFERRED', Employee.${e1_id}.escalation_stage == 'REFERRED' and formal_action_count still 1"
            - "Call 3: HTTP 409 ERR_ESCALATION_AT_CEILING, stage still 'REFERRED' and EscalationCase.${case1}.version unchanged by the refusal"
            - "Call 4: HTTP 200, stage == 'PERFORMANCE_PLAN' and discretionary_hold back to false - REFERRED is a ceiling, not a terminal stage"
            - "Calls 5 and 6: HTTP 409 ERR_ESCALATION_TERMINAL (not AT_CEILING and not AT_FLOOR) with ${case2}.stage still 'CURED' and Employee.${e2_id}.escalation_stage still 'NONE'"

      - name: cycle_lock_cascades_into_weeks_and_neighborhoods_and_blocks_child_writes
        claim_type: cascade_down
        grounds:
          - state_machines.PolicyCycle.OPEN_to_LOCKED
          - state_machines.AttendanceWeek.FINALIZED_to_LOCKED
          - validations[priority=44, ERR_CYCLE_LOCKED]
        excluded_because:
          difficulty_instance: cycle_lock_freezes_space_and_blocks_every_child_write
          rationale: "That §1.8 instance already locks a cycle that owns a FINALIZED week, an OPEN week, a COMMITTED allocation and a live neighborhood, then asserts the FINALIZED -> LOCKED week cascade, allocation_state := FROZEN on a neighborhood whose utilization is unchanged, and ERR_CYCLE_LOCKED on the signal, finalize, amend, seat-allocation-create and commit paths - including the band-44 over band-50 precedence proof that a LOCKED week's amend still answers ERR_CYCLE_LOCKED. A §1.9 copy would re-run the same cascade with a smaller fixture and could only weaken it."

      - name: recalibration_lifecycle_demands_draft_then_submitted_inside_a_recalibration_window
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RecalibrationReview
          - errors[ERR_REVIEW_NOT_DRAFT]
          - errors[ERR_REVIEW_NOT_SUBMITTED]
          - errors[ERR_CYCLE_NOT_RECALIBRATING]
          - validations[priority=28, ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "Three independent gates guard the same two endpoints and they are ranked: the cross-entity recalibration-window gate (band 54) only speaks when the row-level lifecycle gate (band 50) is satisfied, and segregation of duties (band 28) outranks both - so the same ADOPT call answers a different error depending on which gate is repaired."
        test_recipe:
          setup:
            - "A cycle with one team and NO employees, so the frozen measurement snapshot is fully determined: collaboration_index 0.00, chargeback 0, qualifying_band_count 0. The cycle starts OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN30", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-A", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t_a: $.data.id }
            - call: "POST /recalibration-reviews"
              payload: { policy_cycle_id: "${cyc_id}", review_label: "R-1", proposed_days_in_office_delta: 0 }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { rev1: $.data.id }
          trigger:
            - call: "POST /recalibration-reviews/${rev1}/submit"
              payload: {}
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { e_window: "$.data.error_id" }
            - call: "POST /policy-cycles/${cyc_id}/posture"
              payload: { target_posture: "RECALIBRATING" }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { cyc_v2: $.data.version }
            - call: "POST /recalibration-reviews/${rev1}/decision"
              payload: { decision: "ADOPT", expected_policy_cycle_version: "${cyc_v2}" }
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { e_not_submitted: "$.data.error_id" }
            - call: "POST /recalibration-reviews/${rev1}/submit"
              payload: {}
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
            - call: "POST /recalibration-reviews/${rev1}/submit"
              payload: {}
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { e_resubmit: "$.data.error_id" }
            - call: "POST /recalibration-reviews/${rev1}/decision"
              payload: { decision: "REJECT", expected_policy_cycle_version: "${cyc_v2}" }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { e_sod: "$.data.error_id" }
            - call: "POST /recalibration-reviews/${rev1}/decision"
              payload: { decision: "REJECT", expected_policy_cycle_version: "${cyc_v2}", decision_reason: "measurement window closed without a change" }
              as: ComplianceAuditor
              as_user_id: "aud-1"
            - call: "GET /policy-cycles/${cyc_id}"
              payload: {}
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { cyc_v3: $.data.version }
            - call: "POST /recalibration-reviews/${rev1}/decision"
              payload: { decision: "ADOPT", expected_policy_cycle_version: "${cyc_v3}" }
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { e_after: "$.data.error_id" }
          assert:
            - "Call 1: HTTP 409 ERR_CYCLE_NOT_RECALIBRATING - the review is a valid DRAFT, so only the window gate can fire, and state stays 'DRAFT'"
            - "Call 2: HTTP 200, posture == 'RECALIBRATING', version == 2"
            - "Call 3: HTTP 409 ERR_REVIEW_NOT_SUBMITTED - with the window now open, the band-50 lifecycle gate is the one that speaks, and it outranks the band-54 window gate that call 1 hit"
            - "Call 4: HTTP 200, state == 'SUBMITTED', submitted_by_user_id == 'wpo-1', collaboration_index == 0.00, meets_collaboration_target == false (0.00 < 70.00), total_space_chargeback_cents == 0, qualifying_band_count == 0, equity_variance_pct == 0.00, equity_flag == false"
            - "Call 5: HTTP 409 ERR_REVIEW_NOT_DRAFT, state still 'SUBMITTED' and the frozen snapshot is not recomputed"
            - "Call 6: HTTP 409 ERR_SEGREGATION_OF_DUTIES because the deciding X-User-ID equals submitted_by_user_id - band 28 outranks everything else on this endpoint, and the supplied version was CORRECT so the band-40 OCC check cannot be what fired"
            - "Call 7: HTTP 200, state == 'REJECTED', decided_by_user_id == 'aud-1', no Team field changed (expected_days_in_office_per_week still 3, entitled_seats still 10), PolicyCycle.posture back to 'OPEN' and version == 3"
            - "Call 9: HTTP 409 ERR_REVIEW_NOT_SUBMITTED - the version was refreshed so OCC passes, and the band-50 gate again outranks the band-54 window gate even though the posture has left RECALIBRATING"

      - name: recalibration_adopt_shifts_every_team_and_reruns_the_entitlement_tier
        claim_type: cross_entity
        grounds:
          - state_machines.RecalibrationReview.SUBMITTED_to_ADOPTED
          - calculations.team_seat_entitlement
          - validations[priority=80, ERR_BELOW_DAYS_FLOOR]
        distinguishing_aspect: "One ADOPT rewrites expected_days_in_office_per_week on EVERY team in the cycle and re-runs the entitlement tier from the NEW base, so a team can change tier bracket as a side effect of a policy vote; and the days floor is checked against every team BEFORE anything is written, so a delta that only one team cannot absorb changes nothing at all."
        test_recipe:
          setup:
            - "A cycle with days_in_office_floor 2 and two teams: T-A 12 planned / 3 days (expected_daily_attendance 8, base 8, tier 0.20, buffer 2, entitled 10) and T-B 40 planned / 5 days (eda 40, base 40, tier 0.06, buffer 3, entitled 43). Two reviews are prepared: R-DOWN2 with delta -2 and R-DOWN1 with delta -1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN31", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-A", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t_a: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-B", expected_days_in_office_per_week: 5, core_collaboration_days: ["MON", "TUE", "WED", "THU", "FRI"], headcount_planned: 40, signal_corroboration_required: true }
              as: WorkplaceProgramOffice
              captures: { t_b: $.data.id }
            - call: "POST /policy-cycles/${cyc_id}/posture"
              payload: { target_posture: "RECALIBRATING", note: "H1 recalibration vote" }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
            - call: "POST /recalibration-reviews"
              payload: { policy_cycle_id: "${cyc_id}", review_label: "R-DOWN2", proposed_days_in_office_delta: -2 }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { rev_d2: $.data.id }
            - call: "POST /recalibration-reviews/${rev_d2}/submit"
              payload: {}
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
            - call: "GET /policy-cycles/${cyc_id}"
              payload: {}
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { cyc_v2: $.data.version }
          trigger:
            - call: "POST /recalibration-reviews/${rev_d2}/decision"
              payload: { decision: "ADOPT", expected_policy_cycle_version: "${cyc_v2}" }
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { e_floor: "$.data.error_id" }
            - call: "POST /recalibration-reviews"
              payload: { policy_cycle_id: "${cyc_id}", review_label: "R-DOWN1", proposed_days_in_office_delta: -1 }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { rev_d1: $.data.id }
            - call: "POST /recalibration-reviews/${rev_d1}/submit"
              payload: {}
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
            - call: "POST /recalibration-reviews/${rev_d1}/decision"
              payload: { decision: "ADOPT", expected_policy_cycle_version: "${cyc_v2}", decision_reason: "collaboration outcomes support one fewer anchor day" }
              as: ComplianceAuditor
              as_user_id: "aud-1"
            - call: "GET /teams?policy_cycle_id=${cyc_id}"
              payload: { policy_cycle_id: "${cyc_id}" }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
          assert:
            - "Call 1: HTTP 409 ERR_BELOW_DAYS_FLOOR - T-A would land on 3 - 2 == 1, below the floor of 2, even though T-B could absorb the delta; both teams are untouched (T-A days 3 / entitled 10, T-B days 5 / entitled 43) and RecalibrationReview.${rev_d2}.state is still 'SUBMITTED'"
            - "Call 1 wrote nothing to the cycle either: PolicyCycle.posture is still 'RECALIBRATING' and version is still ${cyc_v2}, which is why call 4 can reuse the same version"
            - "Call 4: HTTP 200, state == 'ADOPTED', decision_reason stored"
            - "Call 4 cascade on T-A: expected_days_in_office_per_week == 2, expected_daily_attendance == 5 (ceil(12 * 2 / 5) == ceil(4.8)), base_entitlement == 5, buffer_seats_entitled == 1 (ceil(5 * 0.20) == 1), entitled_seats == 6"
            - "Call 4 cascade on T-B: expected_days_in_office_per_week == 4, expected_daily_attendance == 32 (ceil(40 * 4 / 5)), base_entitlement == 32, buffer_seats_entitled == 2 (ceil(32 * 0.06) == ceil(1.92)), entitled_seats == 34 - the tier bracket is still keyed on the NEW base 32, not on the old 40"
            - "Call 4 also returns the cycle to normal operation: PolicyCycle.posture == 'OPEN' and version == ${cyc_v2} + 1"
            - "Call 5: the list is ordered T-A then T-B by team_code ASC, which is the declared processing order of the cascade, and both rows show the new values"

  - section: calculations
    instances:

      - name: required_days_and_severity_multiplier_are_keyed_on_the_eligibility_class
        claim_type: constants_applied
        grounds:
          - calculations.required_days_for_week
          - calculations.non_compliance_pressure
          - calculations.pressure_derived_stage
        distinguishing_aspect: "One identical week of zero attendance produces three different outcomes purely from the employee's class: FULLY_REMOTE demands 0 days and cannot breach at all (multiplier 0.0), HYBRID inherits the TEAM's expected days, and ONSITE_REQUIRED uses the flat policy constant 5 with the 1.5 multiplier - so the class is read at finalize time from the employee, not from the week."
