            - "GET /wholesale-rates with currency_code EUR returns total_count == 4: nothing was superseded or deleted"
            - "valuing the EUR manifest at the 920000 quote would give 108696 and at the future 850000 quote 117647; neither value may appear"

      - name: rate_card_derivation_rounds_both_spreads_half_up
        claim_type: precision
        grounds:
          - calculations.rate_card_derivation
          - entities.RateCard.fields.buy_spread_bps
          - entities.RateCard.fields.sell_spread_bps
        distinguishing_aspect: "Both derived rates are round_half_up on integer micros and they round in opposite directions from the same mid: from mid 912345 with a 555 bps buy spread the exact product 962980.1475 truncates to 962980, while the 445 bps sell spread's exact product 871745.6475 rounds up to 871746."
        test_recipe:
          setup:
            - "Branch BR-ZRH (NORTH) and the CHF profile with a 912345-micro mid effective 2026-07-01."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-ZRH", name: "Zurich", region_code: "NORTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
            - call: "POST /currencies"
              payload: { iso_code: "CHF", display_name: "Swiss Franc", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [1000, 2000, 5000, 20000] }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "CHF", mid_rate_micros: 912345, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
          trigger:
