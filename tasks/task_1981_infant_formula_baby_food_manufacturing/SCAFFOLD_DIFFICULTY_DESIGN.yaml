                storage_condition: "REFRIGERATED"
              as: QA_MANAGER
              captures: { ingp_id: $.data.id }
            - call: "POST /api/v1/formulas"
              payload:
                formula_code: "IF-PRI-1"
                product_name: "Priority Test Formula"
                nutrient_profile_id: "${npp_id}"
                ingredients:
                  - ingredient_id: "${ingp_id}"
                    percentage_by_weight: 99.999
                    is_critical: true
                process_type: "DRY_BLEND"
              as: REGULATORY_AFFAIRS
              captures: { fp_id: $.data.id }
          trigger:
            - call: "POST /api/v1/formulas/${fp_id}/submit-for-review"
              payload: {}
              as: REGULATORY_AFFAIRS
              captures: { err_result: $.data.error_id }
