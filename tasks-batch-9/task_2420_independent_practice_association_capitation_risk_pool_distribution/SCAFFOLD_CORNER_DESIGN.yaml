          assert:
            - "${pool_v6_due} == \"2027-06-29T23:59:59Z\" — pool_year_end plus the 180-day PROFESSIONAL lag, not the 270-day INSTITUTIONAL lag"
            - "RiskPool.${pool_v6}.funded_cents == 18600 (expected 20000 less the 1400 remittance withhold) and ${pool_v6_fee} == 1860, ${pool_v6_savings} == 10044"
            - "call 2 returns HTTP 422 with ${window_error} == \"ERR_SETTLEMENT_WINDOW_NOT_OPEN\" and RiskPool.${pool_v6}.status is still \"SETTLEMENT_PROPOSED\""
            - "${pool_v6_status} == \"SETTLED\" after the clock reaches 2027-06-30T00:00:00Z — only the clock changed between the two identical requests"
            - "${pd_v6_share} == 1400 and ${pd_v6_release} == 1050 (round_half_up(1400 * 7500 / 10000)) and ${pd_v6_net} == 11094 (1050 + 10044)"
            - "${agr_v6_withheld} == 0 — the settled distribution drains the withheld balance"
            - "${agr_v6_forfeited} == 350 — the unreleased 1400 - 1050 remainder is forfeited"

      - name: pediatric_enrollee_assigned_to_internal_medicine_rejected
