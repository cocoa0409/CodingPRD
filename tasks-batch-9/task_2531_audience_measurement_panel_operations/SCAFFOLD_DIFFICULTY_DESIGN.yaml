            - "Run A over [2026-08-10T00:00:00Z, 2026-08-11T00:00:00Z) edited, weighted FINAL and PUBLISHED at clock 2026-08-12T00:00:00Z."
            - "Run B over [2026-08-11T00:00:00Z, 2026-08-12T00:00:00Z) left OPEN and still pinned to RS-2026Q3."
            - "A STANDARD-tier client contracted to the market with one SCHEDULED_DATASET deliverable placed on the still-OPEN run B."
            - "A DRAFT proposed rule set, a MethodologyChange assessed MATERIAL (720-hour lead, deadline 2026-09-11T00:00:00Z) and NOTIFIED, with the single notification already ACKNOWLEDGED."
            - "Clock advanced to exactly 2026-09-11T00:00:00Z so the disclosure period has just elapsed."
