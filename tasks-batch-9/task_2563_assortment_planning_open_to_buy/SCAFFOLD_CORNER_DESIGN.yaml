            - "${m1_status} == IN_SEASON, which is what makes the actuals posts admissible at all under priority 10; the duplicate-week rejection is therefore not a masked ERR_PLAN_MONTH_NOT_OPEN"

      - name: size_curve_set_is_validated_and_replaced_atomically
        claim_type: priority_ordering
        grounds:
          - validations[priority=26].ERR_SIZE_CURVE_EMPTY
          - validations[priority=27].ERR_SIZE_CURVE_NOT_BALANCED
          - endpoints[PUT /otb/option-plans/{id}/size-curve]
        distinguishing_aspect: "The unit of validation is the whole submitted cells ARRAY, not any single cell: emptiness, the 10000-bps sum, label uniqueness and sort-order uniqueness are all set-level predicates. Emptiness is separated from imbalance by priority - an empty array sums to 0, which also violates the balance rule, yet it must surface ERR_SIZE_CURVE_EMPTY because priority 26 sits above priority 27. Both uniqueness violations collapse into the single balance error even though the sum is a perfect 10000. Finally, every rejected PUT must leave the previously stored set byte-for-byte intact, because the endpoint replaces the set wholesale."
        test_recipe:
          setup:
            - "an OPEN OptionPlan (depth 6, cluster of 40 stores at sales_index 11500) carrying a valid four-cell curve of 2500 bps each"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Metro A", climate_zone: "TEMPERATE", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op_id: $.data.id, op_status: $.data.status }
            - call: "PUT /otb/option-plans/${op_id}/size-curve"
              payload: { cells: [ { size_label: "S", size_sort_order: 1, pct_bps: 2500 }, { size_label: "M", size_sort_order: 2, pct_bps: 2500 }, { size_label: "L", size_sort_order: 3, pct_bps: 2500 }, { size_label: "XL", size_sort_order: 4, pct_bps: 2500 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { c0_label: "$.data[0].size_label", c0_units: "$.data[0].allocated_units", c3_units: "$.data[3].allocated_units" }
          trigger:
            - call: "PUT /otb/option-plans/${op_id}/size-curve"
              payload: { cells: [] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { empty_error: $.data.error_id }
            - call: "PUT /otb/option-plans/${op_id}/size-curve"
              payload: { cells: [ { size_label: "S", size_sort_order: 1, pct_bps: 2500 }, { size_label: "M", size_sort_order: 2, pct_bps: 2500 }, { size_label: "L", size_sort_order: 3, pct_bps: 2500 }, { size_label: "XL", size_sort_order: 4, pct_bps: 2499 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { sum_error: $.data.error_id }
            - call: "PUT /otb/option-plans/${op_id}/size-curve"
              payload: { cells: [ { size_label: "S", size_sort_order: 1, pct_bps: 2500 }, { size_label: "S", size_sort_order: 2, pct_bps: 2500 }, { size_label: "L", size_sort_order: 3, pct_bps: 2500 }, { size_label: "XL", size_sort_order: 4, pct_bps: 2500 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { dup_label_error: $.data.error_id }
            - call: "PUT /otb/option-plans/${op_id}/size-curve"
              payload: { cells: [ { size_label: "S", size_sort_order: 1, pct_bps: 2500 }, { size_label: "M", size_sort_order: 1, pct_bps: 2500 }, { size_label: "L", size_sort_order: 3, pct_bps: 2500 }, { size_label: "XL", size_sort_order: 4, pct_bps: 2500 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { dup_order_error: $.data.error_id }
            - call: "GET /otb/option-plans/${op_id}/size-curve-cells"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { after_label: "$.data[0].size_label", after_units: "$.data[0].allocated_units", after_last: "$.data[3].allocated_units" }
          assert:
            - "the baseline PUT is accepted with ${c0_label} == S, ${c0_units} == 69 and ${c3_units} == 69: target_units = round_half_up(6 * 40 * 11500 / 10000) = 276 and every cell's raw_units_x10000 is exactly 690000, so each rounds to 69 and the four sum to 276 with delta 0 - no remainder pass runs"
            - "${empty_error} == ERR_SIZE_CURVE_EMPTY (422), NOT ERR_SIZE_CURVE_NOT_BALANCED: an empty array sums to 0 and so violates priority 27 as well, and the priority order is the only thing that decides which code is returned"
            - "${sum_error} == ERR_SIZE_CURVE_NOT_BALANCED (422) for a total of 9999 - one basis point short of 10000, with every label and sort order distinct"
            - "${dup_label_error} == ERR_SIZE_CURVE_NOT_BALANCED (422): the sum is a perfect 10000 and the sort orders are 1..4, so only the repeated size_label S can be the cause, and it surfaces under the BALANCE error rather than a dedicated duplicate code"
            - "${dup_order_error} == ERR_SIZE_CURVE_NOT_BALANCED (422): the sum is again 10000 and all four labels are distinct, so only the repeated size_sort_order 1 can be the cause - the same error_id covers three structurally different set defects"
            - "${after_label} == S, ${after_units} == 69 and ${after_last} == 69 with total_count 4: all four rejected PUTs were atomic no-ops, so the stored set is still the baseline and not a partial write of any rejected array"
            - "${op_status} == OPEN throughout and OptionPlan.target_units_per_option is still null: the PUT never slots the OptionPlan, so none of these outcomes can be confused with cascade-B link 5"

      - name: plan_scope_mismatch_has_two_independent_conjuncts
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=20].ERR_PLAN_SCOPE_MISMATCH
          - validations[priority=19].ERR_VENDOR_NOT_AUTHORIZED_FOR_CATEGORY
          - entities.AssortmentItem.fields.vendor_id
        distinguishing_aspect: "Priority 20 is a two-clause cross-entity check and each clause is falsified on its own with the other clause satisfied. Clause 1 walks AssortmentItem -> OptionPlan -> category_plan_id and compares it to PlanMonth -> category_plan_id; the mismatching item deliberately lives under a SECOND plan of the SAME category, so the higher-priority category-authorization check at priority 19 still passes and cannot mask the result. Clause 2 compares the request body's vendor_id against AssortmentItem.vendor_id using a second vendor that is AUTHORIZED and category-authorized, so neither priority 13 nor priority 19 can fire. A control call that fixes only the offending field is accepted in each case."
        test_recipe:
          setup:
            - "an APPROVED SPRING 2027 plan for category DRSS with month M1 LOCKED_PLAN and item A on vendor ATLS"
            - "a second DRAFT plan (FALL 2027) for the SAME category DRSS carrying its own OptionPlan and item B, also on vendor ATLS"
