              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Plan E Revision", total_authorized_shares: 1000000, common_shares_outstanding: 200000000, fiscal_year_start_date: "2026-01-01", current_fiscal_year_label: "FY2026", burn_rate_limit_bps: 500, fungible_ratio_full_value_bps: 15000, low_reserve_threshold_bps: 0 }
