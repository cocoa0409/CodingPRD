  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: occ_stale_version_beats_wrong_stage_on_change_order_create
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - concurrency_rules[change-order-create-stale-project]
          - errors[ERR_STALE_PROJECT_VERSION]
          - errors[ERR_PROJECT_NOT_ACTIVATED]
        distinguishing_aspect: |
          Category pair state(p5, ERR_STALE_PROJECT_VERSION) vs business-stage(p8,
          ERR_PROJECT_NOT_ACTIVATED): a change-order create that is BOTH against a DRAFT project
          AND carries a stale expected_project_version returns ERR_STALE_PROJECT_VERSION (412)
          because the OCC check at priority 5 fires before the activation-stage check.
        test_recipe:
          setup:
            - "A DRAFT Project (never activated); client captured its version, then a milestone create bumped Project.version so the client's held version is now stale."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Prihaus" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "Iota", contact_email: "i@iota.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "Iota Logo", service_type: "LOGO", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 10000, sequence_index: 1 }
              as: StudioOps
          trigger:
            - call: "POST /studios/${sid}/change-orders"
              payload: { project_id: "${pid}", reason: "SCOPE_ADD", delta_cents: 5000, expected_project_version: "${pv0}" }
              as: StudioOps
          assert:
            - "Response error_id == ERR_STALE_PROJECT_VERSION"
            - "HTTP status == 412"
            - "error_id is NOT ERR_PROJECT_NOT_ACTIVATED (OCC at priority 5 wins over stage check at priority 8)"

      - name: interval_overlap_beats_revision_limit_distinct_category_pair
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_INTERVAL_OVERLAP]
          - errors[ERR_REVISION_LIMIT_REACHED]
        distinguishing_aspect: |
          A different category pair: business_temporal interval-overlap (p8, ERR_INTERVAL_OVERLAP)
          vs business_safety revision-limit (p9, ERR_REVISION_LIMIT_REACHED). These two checks
          guard distinct endpoints, so the conflict is exhibited as two single-failure probes whose
          winning error_ids differ — license-overlap returns ERR_INTERVAL_OVERLAP, an exhausted
          concept returns ERR_REVISION_LIMIT_REACHED — confirming the two priorities are ordered
          and never collapse to one error.
        test_recipe:
          setup:
            - "Probe A: an activated project with one RESERVED License [2026-03-01,2026-03-10]; a second License create with an overlapping window."
            - "Probe B: a CONCEPT-stage concept with revision_limit=1, already at rounds_used=1 and PRESENTED; one more request-revision is attempted."
          setup_api_calls:
            - call: "POST /studios"
