# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2137 — Spare Parts Planning & Aftermarket Support
# Breadth walk of references/claim-extraction-guide.md against §1.1–§1.7.
# =============================================================================
scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:

      - name: part_create_returns_system_and_default_fields
        claim_type: Creation
        grounds:
          - entities.Part.fields.lifecycle_state
          - entities.Part.fields.criticality_class
          - entities.Part.fields.hazmat
          - endpoints["POST /aftermarket/parts"]
        distinguishing_aspect: "A part created with only the five required inputs comes back with lifecycle_state ACTIVE, criticality_class DESIRABLE, criticality_score 0, stocking_policy MAKE_TO_ORDER, hazmat false, max_stock_units 0, all four stock counters 0, replenishment_status NORMAL and version 1."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /aftermarket/parts"
              payload: { part_number: "CRN-1", description: "Corner probe part", unit_cost_cents: 2500, lead_time_days: 14, weight_kg: 0.5 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /aftermarket/parts/${p_id}"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
          assert:
            - "response HTTP status of the create == 201"
            - "Part.${p_id}.lifecycle_state == ACTIVE"
            - "Part.${p_id}.criticality_class == DESIRABLE and criticality_score == 0"
            - "Part.${p_id}.stocking_policy == MAKE_TO_ORDER"
            - "Part.${p_id}.hazmat == false and max_stock_units == 0"
            - "Part.${p_id}.on_hand_units == 0, allocated_units == 0, quarantine_units == 0, in_transit_units == 0, available_units == 0"
            - "Part.${p_id}.replenishment_status == NORMAL"
            - "Part.${p_id}.safety_stock_units == 0 and reorder_point_units == 0"
            - "Part.${p_id}.version == 1 and id is a bare UUID with no type prefix"
            - "Part.${p_id}.current_list_unit_price_cents == 0 (no ACTIVE DESIRABLE rule exists yet)"

      - name: parts_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints["GET /aftermarket/parts"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three parts stored, GET /aftermarket/parts?limit=2&offset=0 returns exactly 2 rows, total_count 3 and has_more true; offset=2 returns 1 row and has_more false."
        test_recipe:
          setup:
            - "three parts exist and no other entities"
          setup_api_calls:
            - call: "POST /aftermarket/parts"
              payload: { part_number: "PG-1", description: "Page part 1", unit_cost_cents: 100, lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/parts"
              payload: { part_number: "PG-2", description: "Page part 2", unit_cost_cents: 200, lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/parts"
              payload: { part_number: "PG-3", description: "Page part 3", unit_cost_cents: 300, lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "GET /aftermarket/parts"
              payload: { limit: 2, offset: 0 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "GET /aftermarket/parts"
              payload: { limit: 2, offset: 2 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
          assert:
            - "first response: 2 items, meta pagination total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second response: 1 item, total_count == 3, has_more == false"
            - "response_type == array on both"

      - name: part_get_with_unknown_uuid_returns_part_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_PART_NOT_FOUND]
          - endpoints["GET /aftermarket/parts/{id}"]
        distinguishing_aspect: "GET /aftermarket/parts/{unknown-uuid} answers HTTP 404 with error_id ERR_PART_NOT_FOUND and the error response envelope, not an empty 200."
        test_recipe:
          setup:
            - "one part exists so the collection is non-empty"
          setup_api_calls:
            - call: "POST /aftermarket/parts"
              payload: { part_number: "NF-1", description: "Not found probe", unit_cost_cents: 100, lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "GET /aftermarket/parts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 404"
            - "response_type == error and data.error_id == ERR_PART_NOT_FOUND"

      - name: part_create_missing_required_unit_cost_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /aftermarket/parts without unit_cost_cents answers HTTP 400 ERR_INVALID_REQUEST and stores nothing."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /aftermarket/parts"
              payload: { part_number: "BAD-1", description: "Missing cost", lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /aftermarket/parts returns total_count == 0"

      - name: dealer_create_with_invalid_tier_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Dealer.fields.tier
          - validations[priority=7]
        distinguishing_aspect: "tier BRONZE is not a member of {PLATINUM, GOLD, SILVER}, so POST /aftermarket/dealers answers HTTP 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /aftermarket/dealers"
              payload: { dealer_code: "D-BAD", tier: "BRONZE", region: "NA", credit_limit_cents: 1000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 400 and data.error_id == ERR_INVALID_REQUEST"

      - name: stock_ledger_entry_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.StockLedgerEntry
          - endpoints["GET /aftermarket/parts/{id}/ledger-entries"]
        distinguishing_aspect: "StockLedgerEntry has common_fields false, so a receipt row exposes id, created_at, part_id, entry_type, delta_units, balance_after_units, source_ref_type, source_ref_id and occurred_at, and no updated_at or version field; §1.5 declares no write endpoint for it."
        test_recipe:
          setup:
            - "part LED-1 with a STOCK ReplenishmentOrder for 12 units approved, shipped and received"
          setup_api_calls:
            - call: "POST /aftermarket/parts"
              payload: { part_number: "LED-1", description: "Ledger probe", unit_cost_cents: 500, lead_time_days: 10, weight_kg: 1.0 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
            - call: "POST /aftermarket/replenishment-orders"
              payload: { part_id: "${p_id}", order_type: "STOCK", qty: 12 }
              as: InventoryController
              as_user_id: "ctrl-1"
              captures: { ro_id: $.data.id }
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/approve"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/ship"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/receive"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
          trigger:
            - call: "GET /aftermarket/parts/${p_id}/ledger-entries"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
          assert:
            - "total_count == 1"
            - "the row has entry_type RECEIPT, delta_units == 12, balance_after_units == 12, source_ref_type == REPLENISHMENT_ORDER, source_ref_id == ${ro_id}"
            - "the row has no version field and no updated_at field"
            - "occurred_at equals the logical clock default instant 2026-08-01T00:00:00Z"

      - name: installed_unit_create_with_unknown_model_returns_model_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_MODEL_NOT_FOUND]
        distinguishing_aspect: "A body foreign key that does not resolve produces the parent-specific 404 ERR_MODEL_NOT_FOUND, not a generic 400."
        test_recipe:
          setup:
            - "one dealer exists so dealer_id resolves and only model_id is dangling"
          setup_api_calls:
            - call: "POST /aftermarket/dealers"
              payload: { dealer_code: "D-PAR", tier: "GOLD", region: "NA", credit_limit_cents: 1000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /aftermarket/installed-units"
              payload: { model_id: "00000000-0000-4000-8000-000000000000", dealer_id: "${d_id}", serial_number: "SN-PAR", build_revision: 10, commission_date: "2025-06-01T00:00:00Z", region: "NA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 404 and data.error_id == ERR_MODEL_NOT_FOUND"
            - "GET /aftermarket/installed-units?dealer_id=${d_id} returns total_count == 0"

      - name: applicability_junction_is_reachable_from_both_sides
        claim_type: Creation
        grounds:
          - entities.PartApplicability.fields.part_id
          - entities.PartApplicability.fields.model_id
          - endpoints["GET /aftermarket/part-applicabilities"]
        distinguishing_aspect: "The many-to-many junction row is discoverable by part_id and by model_id independently, which is the graph-topology contract for PartApplicability."
        test_recipe:
          setup:
            - "one model, two parts, and one applicability row per part against that model on disjoint build-revision ranges"
          setup_api_calls:
            - call: "POST /aftermarket/equipment-models"
              payload: { model_code: "EM-JN", name: "Junction model", production_end_date: "2025-01-01T00:00:00Z", support_end_date: "2035-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_id: $.data.id }
            - call: "POST /aftermarket/parts"
              payload: { part_number: "JN-1", description: "Junction part 1", unit_cost_cents: 100, lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p1_id: $.data.id }
            - call: "POST /aftermarket/parts"
              payload: { part_number: "JN-2", description: "Junction part 2", unit_cost_cents: 100, lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p2_id: $.data.id }
            - call: "POST /aftermarket/part-applicabilities"
              payload: { part_id: "${p1_id}", model_id: "${m_id}", effective_from_build_revision: 0, effective_to_build_revision: 99, qty_per_unit: 1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/part-applicabilities"
              payload: { part_id: "${p2_id}", model_id: "${m_id}", effective_from_build_revision: 100, qty_per_unit: 2 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "GET /aftermarket/part-applicabilities"
              payload: { model_id: "${m_id}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "GET /aftermarket/part-applicabilities"
              payload: { part_id: "${p1_id}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
          assert:
            - "the model-filtered response has total_count == 2"
            - "the part-filtered response has total_count == 1 and its qty_per_unit == 1 and effective_to_build_revision == 99"
            - "both rows have applicability_status == ACTIVE"

      - name: superseded_part_is_reachable_from_its_successor_by_filter
        claim_type: Retrieval
        grounds:
          - entities.Part.fields.superseded_by_part_id
          - endpoints["GET /aftermarket/parts"]
        distinguishing_aspect: "After OLD-2 is superseded by NEW-2, GET /aftermarket/parts?superseded_by_part_id={new_id} returns exactly the predecessor — the self-referential FK's reverse lookup."
        test_recipe:
          setup:
            - "two ACTIVE parts, the first superseded by the second"
          setup_api_calls:
            - call: "POST /aftermarket/parts"
              payload: { part_number: "OLD-2", description: "Predecessor", unit_cost_cents: 100, lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { pa_id: $.data.id }
            - call: "POST /aftermarket/parts"
              payload: { part_number: "NEW-2", description: "Successor", unit_cost_cents: 120, lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { pb_id: $.data.id }
            - call: "POST /aftermarket/parts/${pa_id}/supersede"
              payload: { successor_part_id: "${pb_id}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "GET /aftermarket/parts"
              payload: { superseded_by_part_id: "${pb_id}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
          assert:
            - "total_count == 1 and the single row's id == ${pa_id}"
            - "Part.${pa_id}.lifecycle_state == SUPERSEDED and stocking_policy == NO_STOCK"
            - "Part.${pb_id}.lifecycle_state == ACTIVE and superseded_by_part_id == null"

      - name: supersession_cycle_is_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=13]
          - errors[ERR_SUPERSESSION_CYCLE]
        distinguishing_aspect: "With OLD-3 already superseded by NEW-3, superseding NEW-3 by OLD-3 would close a cycle in the self-referential chain and answers HTTP 409 ERR_SUPERSESSION_CYCLE."
        test_recipe:
          setup:
            - "part OLD-3 in lifecycle_state SUPERSEDED pointing at ACTIVE part NEW-3"
          setup_api_calls:
            - call: "POST /aftermarket/parts"
              payload: { part_number: "OLD-3", description: "Cycle predecessor", unit_cost_cents: 100, lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { pa_id: $.data.id }
            - call: "POST /aftermarket/parts"
              payload: { part_number: "NEW-3", description: "Cycle successor", unit_cost_cents: 120, lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { pb_id: $.data.id }
            - call: "POST /aftermarket/parts/${pa_id}/supersede"
              payload: { successor_part_id: "${pb_id}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /aftermarket/parts/${pb_id}/supersede"
              payload: { successor_part_id: "${pa_id}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409 and data.error_id == ERR_SUPERSESSION_CYCLE"
            - "Part.${pb_id}.lifecycle_state == ACTIVE and superseded_by_part_id == null"

  # ==========================================================================
  - section: state_machines
    instances:

      - name: part_reinstate_from_active_returns_lifecycle_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Part.PHASE_OUT_to_ACTIVE
          - errors[ERR_PART_LIFECYCLE_INVALID]
        distinguishing_aspect: "reinstate is declared only from PHASE_OUT, so calling it on a freshly created ACTIVE part answers HTTP 409 ERR_PART_LIFECYCLE_INVALID and leaves version at 1."
        test_recipe:
          setup:
            - "one part in lifecycle_state ACTIVE with version 1"
          setup_api_calls:
            - call: "POST /aftermarket/parts"
              payload: { part_number: "INV-1", description: "Invalid transition probe", unit_cost_cents: 100, lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /aftermarket/parts/${p_id}/reinstate"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409 and data.error_id == ERR_PART_LIFECYCLE_INVALID"
            - "Part.${p_id}.lifecycle_state == ACTIVE and Part.${p_id}.version == 1"

      - name: part_reinstate_blocked_while_campaign_submitted
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Part.PHASE_OUT_to_ACTIVE
          - errors[ERR_PART_LIFECYCLE_INVALID]
        distinguishing_aspect: "The reinstate precondition forbids returning a part to ACTIVE while any campaign on it is SUBMITTED, APPROVED or ALLOCATING; with one SUBMITTED campaign the call answers HTTP 409 ERR_PART_LIFECYCLE_INVALID."
        test_recipe:
          setup:
            - "part RST-1 in PHASE_OUT with a CURRENT 12-month INSTALLED_BASE_RATE forecast of 0 units"
            - "one LastTimeBuyCampaign on that part in status SUBMITTED"
          setup_api_calls:
            - call: "POST /aftermarket/parts"
              payload: { part_number: "RST-1", description: "Reinstate probe", unit_cost_cents: 100, lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
            - call: "POST /aftermarket/parts/${p_id}/forecasts"
              payload: { horizon_months: 12, method: "INSTALLED_BASE_RATE" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/parts/${p_id}/phase-out"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "GET /aftermarket/parts/${p_id}"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_v: $.data.version }
            - call: "POST /aftermarket/last-time-buy-campaigns"
              payload: { part_id: "${p_id}", method: "FLAT_RATE", coverage_years: 3, ltb_window_start: "2026-09-01T00:00:00Z", ltb_window_end: "2026-10-01T00:00:00Z", expected_part_version: "${p_v}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { c_id: $.data.id }
            - call: "POST /aftermarket/last-time-buy-campaigns/${c_id}/submit"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /aftermarket/parts/${p_id}/reinstate"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409 and data.error_id == ERR_PART_LIFECYCLE_INVALID"
            - "Part.${p_id}.lifecycle_state == PHASE_OUT"
            - "LastTimeBuyCampaign.${c_id}.status == SUBMITTED"

      - name: work_order_close_blocked_by_reserved_line
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=25]
          - errors[ERR_OPEN_LINES_BLOCK_CLOSE]
        distinguishing_aspect: "A work order carrying one RESERVED line cannot close: HTTP 409 ERR_OPEN_LINES_BLOCK_CLOSE, and after the line is cancelled the same close succeeds and stamps closed_at."
        test_recipe:
          setup:
            - "one ACTIVE DESIRABLE price rule with base_uplift_pct 0.35, max_uplift_pct 0.60, min_margin_pct 0.20"
            - "a GOLD dealer, an ACTIVE installed unit and an ACTIVE applicability row from build revision 0"
            - "part CLS-1 with 10 units received and one RESERVED line for qty 2 on an OPEN work order"
          setup_api_calls:
            - call: "POST /aftermarket/price-rules"
              payload: { criticality_class: "DESIRABLE", base_uplift_pct: 0.35, max_uplift_pct: 0.60, min_margin_pct: 0.20 }
              as: PricingAnalyst
              as_user_id: "pricing-1"
            - call: "POST /aftermarket/dealers"
              payload: { dealer_code: "D-CLS", tier: "GOLD", region: "NA", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { d_id: $.data.id }
            - call: "POST /aftermarket/equipment-models"
              payload: { model_code: "EM-K10", name: "Kiln K10", production_end_date: "2025-01-01T00:00:00Z", support_end_date: "2035-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_id: $.data.id }
            - call: "POST /aftermarket/installed-units"
              payload: { model_id: "${m_id}", dealer_id: "${d_id}", serial_number: "SN-K101", build_revision: 100, commission_date: "2025-06-01T00:00:00Z", region: "NA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { u_id: $.data.id }
            - call: "POST /aftermarket/parts"
              payload: { part_number: "CLS-1", description: "Close-block probe", unit_cost_cents: 1333, lead_time_days: 30, weight_kg: 1.0 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
            - call: "POST /aftermarket/part-applicabilities"
              payload: { part_id: "${p_id}", model_id: "${m_id}", effective_from_build_revision: 0, qty_per_unit: 1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/replenishment-orders"
              payload: { part_id: "${p_id}", order_type: "STOCK", qty: 10 }
              as: InventoryController
              as_user_id: "ctrl-1"
              captures: { ro_id: $.data.id }
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/approve"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/ship"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/receive"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/work-orders"
              payload: { installed_unit_id: "${u_id}", work_type: "SCHEDULED_MAINTENANCE", downtime_priority: "PLANNED" }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /aftermarket/work-orders/${wo_id}/part-lines"
              payload: { part_id: "${p_id}", qty_requested: 2 }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /aftermarket/work-orders/${wo_id}/close"
              payload: {}
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
            - call: "POST /aftermarket/work-order-part-lines/${line_id}/cancel"
              payload: {}
              as: DealerUser
              as_user_id: "${d_id}"
            - call: "POST /aftermarket/work-orders/${wo_id}/close"
              payload: {}
              as: DealerUser
