          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication is priority 1, ahead of authorisation and schema: a call with no X-User-Role header at all is 401, not 403 and not 400, even though the endpoint would also have rejected the (absent) role."
