      - name: take_exceedance_cascade_full_hop_chain
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: take_exceedance_cascade_six_hops_from_report_to_compliance_score
          rationale: >-
            A plain end-to-end walk of the take-exceedance cascade would restate
            that instance hop for hop. It already asserts all six hops from the
            monitoring report through the permit, plan, action and consultation
            to the proponent's re-derived compliance score, including the
            intermediate rows that must NOT move. The breadth-side value left
            over is the re-arm and the asymmetric unwind, which is what
            the_take_threshold_re_arms_after_a_rejection_and_fires_a_second_time
            asserts instead.

      - name: registry_write_cascade_across_aggregates
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: species_uplisting_cascade_four_hops_from_registry_write
          rationale: >-
            The only other multi-hop cascade whose trigger is a write to a
            different aggregate root is the listing change on Species, and that
            §1.8 instance already asserts the fan-out to every PresenceDetermination,
            ProjectAction and Consultation reached through the registry, plus the
            rows outside the affected county that must stay untouched. A breadth
            duplicate would add no new corner.

      - name: clock_driven_expiry_cascade
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: clock_advance_expiry_cascade_releases_commitments_without_bank_movement
          rationale: >-
            The third cascade family is triggered by the clock rather than by a
            resource write, and its distinctive corner is that RELEASED
            commitments leave credits_transferred alone — the same target state
            carrying a different side-effect set depending on the source state.
            That §1.8 instance owns it end to end, including the ConservationBank
            ledger identity after the release.

      - name: mitigation_cost_variant_divergence
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: mitigation_preliminary_vs_final_variant_divergence
          rationale: >-
            The scaffold declares exactly two dual-variant calculations, and this
            is the first. The §1.8 instance already drives PRELIMINARY and FINAL
            over identical inputs to different unit totals and then shows the
            variant switch mid-plan, which is the whole corner; a breadth probe
            could only re-derive the same two numbers.

      - name: compliance_score_variant_divergence
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: compliance_standing_rolling_vs_lifetime_variant_divergence
          rationale: >-
            The second dual-variant calculation is likewise owned in depth: the
            §1.8 instance makes ROLLING_12_MONTH and LIFETIME disagree on
            byte-identical data by moving only the clock, and pins the window and
            decay boundaries. The breadth side keeps only the consistency-model
            aspect — that the field changes with no write at all — which is
            asserted in the consistency_model section below.

  # ==========================================================================
  # From Consistency Model — §1.0 declares consistency_model: eventual, scoped
  # to exactly two response fields. Everything else reconciles inside the
  # mutating request, so the single claim worth making is the contrast.
  # ==========================================================================
  - section: consistency_model
    instances:

      - name: two_compliance_fields_lag_the_clock_while_every_other_derived_field_is_immediate
        claim_type: eventual
        grounds:
          - complexity_profile.consistency_model
          - calculations.compliance_standing_score
          - entities.Proponent.fields.compliance_standing_score
          - endpoints["GET /proponents/{id}"]
        distinguishing_aspect: >-
          The eventual-consistency surface of this API is exactly two fields on
          one resource, and their lag is driven by the logical clock rather than
          by a background worker: GET /proponents/{id} re-derives
          compliance_standing_score and compliance_variant_applied on every read,
          so the same row answers differently at different clock positions with
          no intervening write by anybody — including when the reader is the
          Auditor, a role that has no write privileges at all. Every other
          derived field in the scaffold is the opposite: the plan's endowment and
          reserve aggregates and the bank ledger are reconciled inside the
          mutating request and then never move on their own, no matter how far
          the clock advances.
        test_recipe:
          setup:
            - "Canonical fixture through permit issuance, so the plan carries endowment_base_cents 4487959, changed_circumstance_reserve_cents 538555 and endowment_required_cents 5026514, and the bank shows credits_transferred 59.72."
            - "Clock at 2027-05-16T00:00:00Z; one report for [2027-01-01, 2027-04-01) is filed and then REJECTED, planting exactly one penalty event (W_REJECTED_REPORT 11) dated 2027-05-16T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
