  # =========================================================================
  # Rule 6 — boundary precision on different metrics and endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: out_of_service_ratio_boundary_at_activation
        grounds:
          - validations[priority=52]
          - calculations.displacement_revenue_impact
          - state_machines.RenovationPhase.PLANNED_to_ACTIVE
          - entities.RenovationPhase.fields.ooo_pct_at_activation
          - errors[ERR_OOO_CAP_EXCEEDED]
        distinguishing_aspect: |
          Numeric threshold metric: the out-of-service ratio compared with <= against MAX_OOO_PCT
          0.25 on POST /pip/renovation-phases/{id}/activate, where 50/200 == 0.25 exactly is
          admitted (and lands in the 0.00-recapture band) while 51/200 == 0.255 is refused.
        test_recipe:
          setup:
            - "One 200-key property with adr_baseline_cents 18000 and occupancy_baseline_pct 0.70, and a plan holding one BACK_OF_HOUSE item, issued and acknowledged."
            - "Phase 1 closes 50 keys from 2026-09-01 to 2026-09-10; phase 2 closes 1 key from 2026-09-13 to 2026-09-20 and is created while rooms_out_of_service_current is still 0, so it passes the creation-time cap."
            - "Clock moved to 2026-09-01 and phase 1 activated, taking rooms_out_of_service_current to 50."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Stonebridge Hotels LLC", contact_email: "ops@stonebridgeh.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Stonebridge Gateway", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "BACK_OF_HOUSE", standards_reference: "BOH-4.1.1", brand_estimated_cost_cents: 500000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { boh_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/plans/${plan_id}/acknowledge"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "POST /pip/renovation-phases"
              payload: { plan_id: "${plan_id}", phase_number: 1, start_date: "2026-09-01", end_date: "2026-09-10", rooms_out_of_service: 50 }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { phase1_id: $.data.id }
            - call: "POST /pip/renovation-phases"
              payload: { plan_id: "${plan_id}", phase_number: 2, start_date: "2026-09-13", end_date: "2026-09-20", rooms_out_of_service: 1 }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { phase2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/renovation-phases/${phase1_id}/activate"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
          trigger:
            - call: "POST /pip/renovation-phases/${phase2_id}/activate"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
          assert:
            - "RenovationPhase.${phase1_id}.status == ACTIVE and RenovationPhase.${phase1_id}.ooo_pct_at_activation == 0.2500 (a ratio of exactly 0.25 is admitted)"
            - "RenovationPhase.${phase1_id}.displacement_revenue_impact_cents == 6300000 (500 displaced room-nights, zero compression recapture at ratio 0.25)"
            - "the trigger call returns 409 with error_id == ERR_OOO_CAP_EXCEEDED (51/200 == 0.255 is strictly above the cap)"
            - "RenovationPhase.${phase2_id}.status == PLANNED and RenovationPhase.${phase2_id}.ooo_pct_at_activation == null"
            - "Property.${prop_id}.rooms_out_of_service_current == 50"

      - name: empty_scope_cost_summary_zero_denominator
        grounds:
          - calculations.plan_scope_cost
          - calculations.funding_requirement
          - state_machines.ScopeDispute.FILED_to_RESOLVED_REMOVED
          - state_machines.PipItem.SCOPED_to_REMOVED_BY_DISPUTE
