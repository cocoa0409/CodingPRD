        claim_type: boundary_edge
        grounds: ["calculations.slush_triage_score"]
        distinguishing_aspect: "Length factor boundary: 69999 falls in [50000, 69999] -> 20, so MEMOIR(10)+20+PROSPECT(10) = 40; 70000 falls in [70000, 120000] -> 40, so 10+40+10 = 60. One word flips 20 points."
        test_recipe:
          setup: ["agency, agent, PROSPECT author"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency TB", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
