      - name: plan_overlap_adjacent_half_open_allowed
        claim_type: satisfaction_pass
        grounds: ["validations[priority=7]", "errors[ERR_PLAN_WINDOW_OVERLAP]"]
        distinguishing_aspect: "Half-open adjacency: plan2 starting exactly when plan1 ends ([01-01, 06-30) then [06-30, 12-31)) does NOT overlap — touching endpoints are allowed."
        test_recipe:
          setup: ["Clock 2026-01-01; rep with plan1 [2026-01-01, 2026-06-30)"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "ADJ Branch", region: "W" }
              as: FirmAdmin
              captures: { adj_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "930002", full_name: "ADJ Rep", branch_id: "${adj_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { adj_rep: $.data.id, adj_rep_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /supervision-plans"
              payload: { rep_id: "${adj_rep}", start_date: "2026-01-01", end_date: "2026-06-30", conditions: ["A"], expected_representative_version: "${adj_rep_v}" }
