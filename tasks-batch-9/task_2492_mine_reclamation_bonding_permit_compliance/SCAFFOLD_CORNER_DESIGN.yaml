      - name: permit_parallel_dimensions_advance_independently
        claim_type: parallel_dimensions
        grounds:
          - state_machines.Permit.status
          - state_machines.Permit.compliance_posture
        excluded_because:
          difficulty_instance: non_linear_state_machine / permit_status_and_compliance_posture_advance_independently
          rationale: "The parallel-shape claim (status and compliance_posture move on disjoint triggers and combine correctly) is the whole subject of that §1.8 instance."

      - name: permit_revision_cycle_terminates_at_round_cap
        claim_type: cyclic_bounded
        grounds:
          - state_machines.PermitRevision.SUBMITTED_to_INFO_REQUESTED
          - state_machines.PermitRevision.INFO_REQUESTED_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / permit_revision_info_request_cycle_bounded_by_round_cap
          rationale: "The cyclic-shape claim including the REVISION_ROUND_CAP termination condition is asserted end-to-end by that §1.8 instance."

      - name: release_rescission_reverses_all_approval_side_effects
        claim_type: compensation
        grounds:
          - state_machines.BondReleaseApplication.APPROVED_to_RESCINDED
        excluded_because:
          difficulty_instance: compensating_invariant / release_rescission_restores_permit_bond_money_ledger
          rationale: "The compensation side-effect pattern (every approval side effect reversed with no ledger drift) is that §1.8 instance's conserved-quantity assertion."

      - name: forfeiture_finalize_cascade_down_to_operator_and_instruments
        claim_type: cascade_down
        grounds:
          - state_machines.Permit.status.ISSUED_to_FORFEITED
          - state_machines.Operator.self_bond_status.QUALIFIED_to_DISQUALIFIED
        excluded_because:
          difficulty_instance: transitive_cascade / forfeiture_finalize_cascade_reaches_second_permit_bond_deficiency
          rationale: "The multi-level cascade-down pattern from proceeding to permit to operator to a second permit's instrument is asserted link-by-link there."

