      - "CredentialingFile.version increments by 1"
      - "on APPROVE: Provider.credentialing_status=CLEARED, recred_state->CURRENT, credentialing_completed_date & recred_due_date set"
      - "on DENY: Provider.credentialing_status=CONDITIONAL; REQUESTED/SUBMITTED enrollments -> REJECTED"

  # ---- Payer enrollments ----
  - method: POST
    path: "/providers/{id}/payer-enrollments"
    description: "Request a payer enrollment for a provider"
    roles: [EnrollmentCoordinator]
    code: 201
    input: [payer_id]
    output: PayerEnrollment
    side_effects: ["status=REQUESTED; requested_at=current_utc"]

  - method: GET
    path: "/providers/{id}/payer-enrollments"
    description: "List a provider's payer enrollments (reverse-reachability)"
    roles: [EnrollmentCoordinator, CredentialingSpecialist, MedicalDirector, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "PayerEnrollment[]"
    side_effects: []

  - method: GET
    path: "/payer-enrollments"
    description: "List payer enrollments (filter by payer_id; reverse-reachability for PayerEnrollment.payer_id FK)"
    roles: [EnrollmentCoordinator, SystemAdmin]
    code: 200
    input: ["payer_id?", "limit?", "offset?"]
    output: "PayerEnrollment[]"
    side_effects: []

  - method: GET
    path: "/payer-enrollments/{id}"
    description: "Get a single payer enrollment (includes computed effective_date, status)"
    roles: [EnrollmentCoordinator, CredentialingSpecialist, MedicalDirector, SystemAdmin]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: []

  - method: POST
    path: "/payer-enrollments/{id}/submit"
    description: "Submit enrollment to payer (REQUESTED -> SUBMITTED)"
    roles: [EnrollmentCoordinator]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: ["status=SUBMITTED"]

  - method: POST
    path: "/payer-enrollments/{id}/activate"
    description: "Activate enrollment (SUBMITTED -> ACTIVE); computes effective_date"
    roles: [EnrollmentCoordinator]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: ["effective_date=enrollment_effective_date calc; status=ACTIVE"]

  - method: POST
    path: "/payer-enrollments/{id}/terminate"
    description: "Terminate an active enrollment (ACTIVE -> TERMINATED), freeing a panel slot"
    roles: [EnrollmentCoordinator]
    code: 200
    input: [termination_reason]
    output: PayerEnrollment
    side_effects: ["status=TERMINATED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  # --- not found ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-referenced resource does not exist" }
  - { id: ERR_REFERENCED_RESOURCE_NOT_FOUND, http: 404, condition: "A body foreign key (payer_id/reviewer_id/sanctions_source_id) references a missing or cross-org resource" }
  # --- input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/malformed field, bad enum, npi not 10 digits, or expiration_date not strictly after issued_date" }
  - { id: ERR_CAQH_REQUIRED, http: 400, condition: "Application submit attempted with no caqh_id on the provider" }
  - { id: ERR_NO_LICENSE_ON_FILE, http: 409, condition: "Application submit attempted with no STATE_LICENSE credential item" }
  - { id: ERR_RESOLUTION_NOTE_REQUIRED, http: 400, condition: "Resolve attempted without a non-empty resolution_note" }
  - { id: ERR_TERMINATION_REASON_REQUIRED, http: 400, condition: "Terminate attempted without a non-empty termination_reason" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_credentialing_file_version does not match current CredentialingFile.version" }
  # --- state ---
  - { id: ERR_APPLICATION_NOT_DRAFT, http: 409, condition: "submit-application requires application_status==DRAFT" }
  - { id: ERR_APPLICATION_NOT_SUBMITTED, http: 409, condition: "begin-verification requires application_status==SUBMITTED" }
  - { id: ERR_APPLICATION_NOT_IN_VERIFICATION, http: 409, condition: "finalize-verification requires application_status==IN_VERIFICATION" }
  - { id: ERR_VERIFICATIONS_INCOMPLETE, http: 409, condition: "finalize-verification while a CredentialItem is still PENDING_PSV" }
  - { id: ERR_VERIFICATION_NOT_OPEN, http: 409, condition: "complete attempted on a VerificationRequest not in OPEN" }
  - { id: ERR_ITEM_NOT_REJECTED, http: 409, condition: "reverify attempted on a CredentialItem not in REJECTED" }
  - { id: ERR_CREDENTIAL_LAPSED, http: 409, condition: "PASS verification attempted on a CredentialItem whose expirable_band==LAPSED" }
  - { id: ERR_RECRED_NOT_DUE, http: 409, condition: "start-recredentialing while recred_state != RECRED_DUE" }
  - { id: ERR_FILE_NOT_ASSEMBLING, http: 409, condition: "open-review while review_status != ASSEMBLING" }
  - { id: ERR_FILE_NOT_UNDER_REVIEW, http: 409, condition: "finalize while review_status != UNDER_REVIEW" }
  - { id: ERR_PROVIDER_NOT_READY, http: 409, condition: "open-review while Provider.application_status != READY_FOR_REVIEW" }
  - { id: ERR_ENROLLMENT_NOT_REQUESTED, http: 409, condition: "submit while PayerEnrollment.status != REQUESTED" }
  - { id: ERR_ENROLLMENT_NOT_SUBMITTED, http: 409, condition: "activate while PayerEnrollment.status != SUBMITTED" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "terminate while PayerEnrollment.status != ACTIVE" }
  - { id: ERR_SCREENING_NOT_OPEN, http: 409, condition: "resolve while SanctionsScreening.status != OPEN" }
  # --- business safety / referential / constraint ---
  - { id: ERR_PROVIDER_EXCLUDED, http: 403, condition: "open-review while Provider.credentialing_status==EXCLUDED (open OIG/SAM HIT)" }
  - { id: ERR_PROVIDER_NOT_CLEARED, http: 409, condition: "enrollment submit/activate while Provider.credentialing_status != CLEARED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "vote cast by the same user that initiated the provider's application" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "a reviewer attempts a second vote on the same CredentialingFile" }
  - { id: ERR_REVIEWER_ORG_MISMATCH, http: 409, condition: "reviewer belongs to a different org than the file's provider" }
  - { id: ERR_QUORUM_NOT_MET, http: 409, condition: "finalize with fewer than 3 non-ABSTAIN votes" }
  - { id: ERR_REVIEW_OUTCOME_MISMATCH, http: 409, condition: "finalize decision contradicts the peer_review_tally outcome" }
  - { id: ERR_PANEL_AT_CAPACITY, http: 409, condition: "activate would push the Payer ACTIVE enrollment count above panel_capacity" }
  # --- business temporal (interval overlap) ---
  - { id: ERR_CREDENTIAL_INTERVAL_OVERLAP, http: 409, condition: "new CredentialItem's [issued_date,expiration_date] interval overlaps an existing same-type item (closed-closed, adjacency allowed)" }
  - { id: ERR_DUPLICATE_PAYER_ENROLLMENT, http: 409, condition: "a non-terminal PayerEnrollment with the same payer already exists for the provider (ongoing-singleton window)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator; creates orgs, payers, sanctions sources, reviewers; controls the deterministic clock"
    identity: opaque
    exclusive_operations:
      - "POST /credentialing-orgs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /payers"
      - "POST /sanctions-sources"
      - "POST /peer-reviewers"
      - "GET (all read endpoints)"

  - name: CredentialingSpecialist
    description: "Owns provider intake, application/CAQH submission, credential items, and primary-source verification. The specialist who submits a provider's application is barred (segregation of duties) from voting on that provider's peer review."
    identity: opaque
    exclusive_operations:
      - "POST /providers"
      - "POST /providers/{id}/submit-application"
      - "POST /providers/{id}/begin-verification"
      - "POST /providers/{id}/finalize-verification"
      - "POST /providers/{id}/start-recredentialing"
      - "POST /providers/{id}/credential-items"
      - "POST /credential-items/{id}/reverify"
      - "POST /credential-items/{id}/verification-requests"
      - "POST /verification-requests/{id}/complete"
    shared_operations:
      - "POST /providers/{id}/credentialing-files (with MedicalDirector)"
      - "GET (read endpoints)"

  - name: MedicalDirector
    description: "Chairs peer review; opens and finalizes credentialing files; may register reviewers and cast a chair ballot"
    identity: opaque
    exclusive_operations:
      - "POST /credentialing-files/{id}/open-review"
      - "POST /credentialing-files/{id}/finalize"
    shared_operations:
      - "POST /peer-reviewers (with SystemAdmin)"
      - "POST /providers/{id}/credentialing-files (with CredentialingSpecialist)"
      - "POST /credentialing-files/{id}/cast-vote (with PeerReviewer)"
      - "GET (read endpoints)"

  - name: PeerReviewer
    description: "Committee member who casts weighted peer-review ballots"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /credentialing-files/{id}/cast-vote (with MedicalDirector)"
      - "GET (read endpoints)"

  - name: EnrollmentCoordinator
    description: "Owns payer enrollment lifecycle and panel management"
    identity: opaque
    exclusive_operations:
      - "POST /providers/{id}/payer-enrollments"
      - "POST /payer-enrollments/{id}/submit"
      - "POST /payer-enrollments/{id}/activate"
      - "POST /payer-enrollments/{id}/terminate"
    shared_operations:
      - "POST /payers (with SystemAdmin)"
      - "GET (read endpoints)"

  - name: ComplianceOfficer
    description: "Owns OIG/SAM sanctions screening and resolution"
    identity: opaque
    exclusive_operations:
      - "POST /providers/{id}/sanctions-screenings"
      - "POST /sanctions-screenings/{id}/resolve"
    shared_operations:
      - "POST /sanctions-sources (with SystemAdmin)"
      - "GET (read endpoints)"
