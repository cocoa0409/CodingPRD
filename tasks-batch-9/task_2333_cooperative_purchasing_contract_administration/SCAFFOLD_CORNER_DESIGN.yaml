          - errors.ERR_AUDIT_PACKAGE_INCOMPLETE
          - entities.Solicitation.fields.certified_at
        distinguishing_aspect: >-
          On an AWARDED solicitation with no contract the projection finds exactly seven of the eight required codes and lands on ROUND_HALF_UP(100 * 7 / 8, 2) == 87.50, which is refused for certification; executing the contract supplies CONTRACT_EXECUTION and only then does a re-assembly reach 100.00 and unlock CERTIFY. The denominator stays 8 throughout because no amendment has ever been approved.
