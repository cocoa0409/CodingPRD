# =============================================================================
# Task 1455 — Foundry & Casting Operations (sand/investment) — Seed Tables
# =============================================================================

scenario: |
  Foundry & Casting Operations (sand/investment): pattern/tooling & shrink allowance, melt heat chemistry & spectro certification, pour schedule & mold cycle, shakeout/cleaning & grinding routing, X-ray/porosity disposition & scrap coding, alloy return & remelt accounting, sand reclamation, casting warranty & machining allowance

domain_name: foundry-casting-operations
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit        # spectro certification, X-ray disposition, scrap coding, SoD, warranty audit trail
  secondary_archetype: temporal_windowing    # pour-slot bookings and furnace maintenance windows
  complexity_layers:
    - optimistic_concurrency                 # OCC on MeltHeat.version (sample supersede) and Foundry.version (run-ops)
    - cascading_side_effects                 # disposition SCRAP chain; sand DISCARDED quarantine chain
    - dual_variant_calculation               # scrap credit provisional-vs-final; warranty credit STANDARD-vs-MACHINING_ALLOWANCE
    - ops_run_checkpoint                     # POST /api/foundries/{id}/run-ops advances cooling, expiry, closeout, posture
  entity_topology: flat                      # all collections flat under /api, FK references in bodies
  state_machine_shape: cyclic                # MeltHeat correction loop, WarrantyClaim review loop, SandBatch reclaim loop, Casting rework loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate                        # Casting -> Order, Mold -> SandBatch, ScrapRecord -> ReturnLot
    - self_referential                       # Pattern.parent_pattern_id revision chain
  role_model: segregation_of_duties          # spectro certifier may not disposition castings from own heat; claim approver may not settle
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Foundry
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Foundry site name" }
      - { name: sand_available_kg, type: number, source: computed, description: "Sum of current_weight_kg over SandBatches of this foundry with status IN_SERVICE" }
      - { name: alloy_available_kg, type: number, source: computed, description: "Sum of remaining_weight_kg over ReturnLots of this foundry with status ASSAYED" }
      - { name: posture, type: enum, source: computed, description: "OPEN | CURTAILED | EMBARGO — derived from sand_available_kg vs CURTAIL_THRESHOLD_KG=500; EMBARGO when sand_available_kg == 0, CURTAILED when 0 < sand_available_kg <= 500, OPEN otherwise" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone epoch counter incremented by run-ops" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: foundry_id, type: string, source: input, description: "FK -> Foundry.id; owning foundry" }
      - { name: company_name, type: string, source: input, description: "Customer company name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Informational credit limit" }

  - name: Pattern
    parent: null
    common_fields: true
    fields:
      - { name: foundry_id, type: string, source: input, description: "FK -> Foundry.id; owning foundry" }
      - { name: parent_pattern_id, type: string, source: input, required: false, default: null, description: "FK -> Pattern.id; previous revision this pattern supersedes once ACTIVE; null for first revision" }
      - { name: part_number, type: string, source: input, description: "Customer part number" }
      - { name: alloy_shrink_class, type: enum, source: input, description: "FERROUS | ALUMINUM — drives shrink-allowance lookup" }
      - { name: mold_process, type: enum, source: input, description: "SAND | INVESTMENT — drives machining-allowance cap and shrink lookup" }
      - { name: finish_dimensions_mm, type: array, source: input, description: "Ordered finished-casting axis dimensions (mm), length 1..5" }
      - { name: machining_allowance_mm, type: number, source: input, description: "Requested machining stock per axis (mm); capped by MA_CAP[process] in pattern_dimensions_mm" }
      - { name: impressions, type: integer, source: input, description: "Cavities per mold; castings produced per mold pour" }
      - { name: pattern_dimensions_mm, type: array, source: computed, description: "Per-axis (finish + min(machining_allowance_mm, MA_CAP[process])) * (1 + SHRINK[alloy_shrink_class][process]), 1 dp round_half_up" }
      - { name: qualification_attempts, type: integer, source: system, default: 0, description: "Number of qualify submissions" }
      - { name: status, type: enum, source: system, description: "DRAFT | QUALIFICATION | ACTIVE | SUPERSEDED | RETIRED" }

  - name: CustomerOrder
    parent: null
    common_fields: true
    fields:
      - { name: foundry_id, type: string, source: input, description: "FK -> Foundry.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ordering customer (ownership anchor)" }
      - { name: pattern_id, type: string, source: input, description: "FK -> Pattern.id; pattern (revision) to cast" }
      - { name: quantity, type: integer, source: input, description: "Ordered casting count" }
      - { name: overage_pct, type: number, source: input, default: 0.10, description: "Allowed production overage fraction; pipeline cap = ceil(quantity * (1 + overage_pct))" }
      - { name: unit_price_cents, type: integer, source: input, description: "Price per accepted casting" }
      - { name: machining_allowance_pct, type: number, source: input, description: "Fraction of unit price credited per unit under MACHINING_ALLOWANCE warranty variant" }
      - { name: warranty_months, type: integer, source: input, description: "Warranty window length measured from fulfilled_at" }
      - { name: warranty_budget_cents, type: integer, source: input, description: "Cap on total settled warranty credit for this order" }
      - { name: accepted_count, type: integer, source: computed, default: 0, description: "Castings of this order with quality_status ACCEPTED or USE_AS_IS" }
      - { name: scrapped_count, type: integer, source: computed, default: 0, description: "Castings of this order with quality_status SCRAPPED" }
      - { name: pipeline_count, type: integer, source: computed, default: 0, description: "Planned castings = sum over non-SCRAPPED molds referencing this order of pattern.impressions" }
      - { name: settled_total_cents, type: integer, source: computed, default: 0, description: "Sum of settled_credit_cents over this order's SETTLED claims" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Logical timestamp when accepted_count first reached quantity; null until then" }
      - { name: status, type: enum, source: system, description: "RECEIVED | IN_PRODUCTION | FULFILLED | CLOSED | CANCELLED" }

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - { name: foundry_id, type: string, source: input, description: "FK -> Foundry.id" }
      - { name: kind, type: enum, source: input, description: "FURNACE | MOLDING_LINE" }
      - { name: label, type: string, source: input, description: "Human label, e.g. 'Cupola-1', 'Line-B'" }
      - { name: daily_tap_capacity_kg, type: number, source: input, required: false, description: "FURNACE only: max summed tap_weight_kg per UTC date" }
      - { name: daily_minute_capacity, type: integer, source: input, required: false, description: "MOLDING_LINE only: max summed pour-slot minutes per UTC date" }
      - { name: cleanup_buffer_minutes, type: integer, source: input, required: false, description: "MOLDING_LINE only: mandatory idle buffer after each pour slot" }
      - { name: maintenance_windows, type: array, source: input, default: [], description: "FURNACE only: list of {start_iso, end_iso} CLOSED intervals; touching endpoints conflict" }

  - name: MeltHeat
    parent: null
    common_fields: true
    fields:
      - { name: foundry_id, type: string, source: input, description: "FK -> Foundry.id" }
      - { name: furnace_id, type: string, source: input, description: "FK -> Equipment.id; Equipment.kind must be FURNACE" }
      - { name: alloy_grade, type: string, source: input, description: "Grade code, e.g. GJS-400-15" }
      - { name: chemistry_spec, type: object, source: input, description: "Per-element {min,max} percent map plus optional ce_max; snapshot pinned at heat creation" }
      - { name: charge_total_kg, type: number, source: computed, default: 0, description: "Sum of all charge addition weights" }
      - { name: charge_composition, type: object, source: computed, description: "Projected per-element percent = weight-weighted average over charge additions (see projected_chemistry)" }
      - { name: last_sample_reading, type: object, source: system, description: "Most recent spectro reading per element; superseded by each new sample" }
      - { name: last_sample_passed, type: boolean, source: system, default: false, description: "Whether last_sample_reading certified against chemistry_spec" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the Spectrographer whose sample certified the heat; null until CERTIFIED" }
      - { name: last_correction_masses, type: object, source: computed, description: "Element->kg map applied by the most recent AUTO_CORRECT charge (frozen-baseline formula)" }
      - { name: tapped_weight_kg, type: number, source: system, description: "Weight tapped to ladle; set at tap" }
      - { name: tapped_date, type: string, source: system, description: "UTC date (YYYY-MM-DD) of tap, from logical clock" }
      - { name: remaining_metal_kg, type: number, source: computed, description: "tapped_weight_kg minus metal committed by completed pour slots" }
      - { name: status, type: enum, source: system, description: "CHARGING | SAMPLED | CERTIFIED | TAPPED | POURED_OUT" }

  - name: PourSlot
    parent: null
    common_fields: true
    fields:
      - { name: molding_line_id, type: string, source: input, description: "FK -> Equipment.id; Equipment.kind must be MOLDING_LINE" }
      - { name: heat_id, type: string, source: input, description: "FK -> MeltHeat.id" }
      - { name: mold_ids, type: array, source: input, description: "Ordered list of FK -> Mold.id poured on this slot; all must be ASSEMBLED at booking" }
      - { name: start_at, type: datetime, source: input, description: "Slot start (logical clock); half-open interval [start_at, end_at)" }
      - { name: end_at, type: datetime, source: input, description: "Slot end (exclusive); must be after start_at" }
      - { name: status, type: enum, source: system, description: "BOOKED | COMPLETED | CANCELLED | EXPIRED" }

  - name: Mold
    parent: null
    common_fields: true
    fields:
      - { name: pattern_id, type: string, source: input, description: "FK -> Pattern.id; must be ACTIVE" }
      - { name: sand_batch_id, type: string, source: input, description: "FK -> SandBatch.id; must be IN_SERVICE with sufficient current_weight_kg" }
      - { name: order_id, type: string, source: input, description: "FK -> CustomerOrder.id this mold produces for" }
      - { name: pour_slot_id, type: string, source: system, description: "FK -> PourSlot.id; set when booked onto a slot, cleared on cancel/expire" }
      - { name: sand_weight_kg, type: number, source: input, description: "Sand committed from the batch for this mold" }
      - { name: metal_weight_kg, type: number, source: input, description: "Total poured metal for the mold (all impressions incl. gating)" }
      - { name: cooling_hours, type: integer, source: input, description: "Required cooling time after pour before shakeout" }
      - { name: poured_at, type: datetime, source: system, description: "Logical timestamp of pour (slot completion)" }
      - { name: status, type: enum, source: system, description: "ASSEMBLED | POURED | COOLED | SHAKEOUT | CLOSED | SCRAPPED" }

  - name: Casting
    parent: null
    common_fields: true
    fields:
      - { name: mold_id, type: string, source: system, description: "FK -> Mold.id; set at creation (pour cascade)" }
      - { name: order_id, type: string, source: system, description: "FK -> CustomerOrder.id; copied from mold at creation" }
      - { name: cavity_index, type: integer, source: system, description: "1-based impression index within the mold" }
      - { name: casting_weight_kg, type: number, source: computed, description: "mold.metal_weight_kg / pattern.impressions, 2 dp round_half_up, per-mold remainder to last cavity" }
      - { name: routing_status, type: enum, source: system, description: "SHAKEOUT | CLEANING | GRINDING | FINAL_INSPECTION | COMPLETE" }
      - { name: quality_status, type: enum, source: system, description: "PENDING | ACCEPTED | USE_AS_IS | REWORK | SCRAPPED" }

  - name: InspectionReport
    parent: null
    common_fields: true
    fields:
      - { name: casting_id, type: string, source: input, description: "FK -> Casting.id; casting must be at routing_status FINAL_INSPECTION" }
      - { name: porosity_grade, type: integer, source: input, description: "ASTM X-ray porosity severity 1..8 (8 worst)" }
      - { name: defect_type, type: enum, source: input, description: "NONE | POROSITY | SHRINKAGE | INCLUSION | MISRUN | CRACK" }
      - { name: zone, type: enum, source: input, description: "A | B | C — casting zone severity weighting (A most critical)" }
      - { name: disposited_by_user_id, type: string, source: system, description: "X-User-ID of dispositioning QualityInspector" }
      - { name: disposition, type: enum, source: system, description: "ACCEPT | USE_AS_IS | REWORK | SCRAP; null until dispositioned" }
      - { name: status, type: enum, source: system, description: "RECORDED | DISPOSITIONED" }

  - name: ScrapRecord
    parent: null
    common_fields: true
    fields:
      - { name: casting_id, type: string, source: system, description: "FK -> Casting.id; scrapped casting" }
      - { name: return_lot_id, type: string, source: system, description: "FK -> ReturnLot.id credited with the scrap metal" }
      - { name: scrap_code, type: enum, source: system, description: "POROSITY | SHRINKAGE | INCLUSION | MISRUN | CRACK | PROCESS — coded at disposition" }
      - { name: provisional_weight_kg, type: number, source: computed, description: "casting_weight_kg * SCRAP_PROVISIONAL_YIELD (0.85), 2 dp round_half_up" }
      - { name: actual_weight_kg, type: number, source: input, description: "Scale weight recorded at weigh; null until WEIGHED" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | WEIGHED" }

  - name: ReturnLot
    parent: null
    common_fields: true
    fields:
      - { name: foundry_id, type: string, source: input, description: "FK -> Foundry.id" }
      - { name: alloy_grade, type: string, source: input, description: "Grade code of returned alloy" }
      - { name: collected_weight_kg, type: number, source: input, description: "Weight physically collected (gates, risers, sprues)" }
      - { name: scrap_credited_kg, type: number, source: computed, default: 0, description: "Sum of credited scrap weights (provisional at disposition, reconciled at weigh)" }
      - { name: consumed_weight_kg, type: number, source: computed, default: 0, description: "Weight charged into heats from this lot" }
      - { name: downgraded_weight_kg, type: number, source: computed, default: 0, description: "Weight removed from circulation by a failing assay" }
      - { name: remaining_weight_kg, type: number, source: computed, description: "collected_weight_kg + scrap_credited_kg - consumed_weight_kg - downgraded_weight_kg" }
      - { name: assay_composition, type: object, source: system, description: "Per-element percent map recorded at assay" }
      - { name: status, type: enum, source: system, description: "COLLECTED | ASSAYED | CONSUMED | DOWNGRADED" }

  - name: SandBatch
    parent: null
    common_fields: true
    fields:
      - { name: foundry_id, type: string, source: input, description: "FK -> Foundry.id" }
      - { name: virgin_weight_kg, type: number, source: input, description: "New sand charged at creation" }
      - { name: max_loi_pct, type: number, source: input, description: "Maximum acceptable loss-on-ignition percent" }
      - { name: last_loi_pct, type: number, source: system, description: "Most recent LOI test reading" }
      - { name: current_weight_kg, type: number, source: computed, description: "Loose usable sand (post-reclaim credits)" }
      - { name: committed_weight_kg, type: number, source: computed, default: 0, description: "Sand inside ASSEMBLED/POURED/COOLED molds" }
      - { name: spent_weight_kg, type: number, source: computed, default: 0, description: "Shaken-out sand awaiting reclamation" }
      - { name: pending_reclaim_kg, type: number, source: computed, default: 0, description: "Reclaimed sand awaiting test while RECLAIMING" }
      - { name: discarded_weight_kg, type: number, source: computed, default: 0, description: "Sand lost/discarded" }
      - { name: status, type: enum, source: system, description: "MIXED | IN_SERVICE | RECLAIMING | DISCARDED" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> CustomerOrder.id; order must be FULFILLED or CLOSED at filing" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; copied from the order; filer must own it" }
      - { name: claim_type, type: enum, source: input, description: "DEFECT | MACHINING_SHORTFALL — selects warranty_credit variant" }
      - { name: claim_qty, type: integer, source: input, description: "Castings covered by the claim" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount demanded by customer" }
      - { name: freight_cents, type: integer, source: input, default: 0, description: "Return freight; credited only under MACHINING_ALLOWANCE variant" }
      - { name: appeal_used, type: boolean, source: system, default: false, description: "Whether the single appeal has been consumed" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "WarrantyManager who approved/denied most recently" }
      - { name: credit_variant_applied, type: enum, source: system, description: "STANDARD | MACHINING_ALLOWANCE; recorded at settle" }
      - { name: settled_credit_cents, type: integer, source: computed, description: "Credit computed at settle per warranty_credit; null until SETTLED" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED | SETTLED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Pattern
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RETIRED]
    transitions:
      - from: DRAFT
        to: QUALIFICATION
        trigger: "POST /api/patterns/{id}/qualify"
        actor: PatternMaker
        preconditions:
          - "measured_dimensions_mm length == finish_dimensions_mm length (ERR_INVALID_REQUEST)"
        side_effects:
          - "qualification_attempts += 1"
          - "Immediately evaluated: if every |measured - pattern_dimensions_mm[axis]| <= 0.3mm -> auto-advance to ACTIVE, else auto-revert to DRAFT"
        note: "QUALIFICATION is a transient evaluation state; the request response shows the resolved state"
      - from: QUALIFICATION
        to: ACTIVE
        trigger: "system (automatic on qualification pass)"
        actor: system
        preconditions:
          - "If parent_pattern_id is set: parent must currently be ACTIVE (a sibling revision already activated -> ERR_ACTIVE_REVISION_EXISTS, pattern returns to DRAFT)"
          - "No other ACTIVE pattern with the same part_number (ERR_ACTIVE_REVISION_EXISTS, pattern returns to DRAFT)"
        side_effects:
          - "If parent_pattern_id is set and that pattern is ACTIVE: parent pattern -> SUPERSEDED"
      - from: QUALIFICATION
        to: DRAFT
        trigger: "system (automatic on qualification fail)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/patterns/{id}/retire"
        actor: PatternMaker
        preconditions:
          - "No molds referencing this pattern in ASSEMBLED, POURED, or COOLED (ERR_PATTERN_HAS_OPEN_MOLDS)"
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when a child revision pattern becomes ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CustomerOrder
    initial_state: RECEIVED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: RECEIVED
        to: IN_PRODUCTION
        trigger: "system (automatic when the first mold is created for the order)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: FULFILLED
        trigger: "system (automatic when accepted_count >= quantity; equality triggers)"
        actor: system
        preconditions: []
        side_effects:
          - "fulfilled_at := logical now"
      - from: FULFILLED
        to: CLOSED
        trigger: "system (during run-ops when no claims in FILED, UNDER_REVIEW, INFO_REQUESTED, or APPROVED reference the order)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: Customer | FoundryAdmin
        preconditions:
          - "No molds referencing this order in ASSEMBLED, POURED, or COOLED (ERR_INVALID_STATE)"
        side_effects: []
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: Customer | FoundryAdmin
        preconditions:
          - "No molds referencing this order in ASSEMBLED, POURED, or COOLED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: MeltHeat
    initial_state: CHARGING
    terminal_states: [POURED_OUT]
    transitions:
      - from: CHARGING
        to: CHARGING
        trigger: "POST /api/heats/{id}/charges (material or AUTO_CORRECT addition)"
        actor: MeltSupervisor
        preconditions:
          - "Each RETURN_LOT addition references a ReturnLot with status ASSAYED (ERR_RETURN_LOT_NOT_ASSAYED)"
          - "Each RETURN_LOT addition weight <= lot.remaining_weight_kg (ERR_RETURN_LOT_INSUFFICIENT)"
          - "expected_heat_version == heat.version (ERR_STALE_VERSION)"
        side_effects:
          - "charge_total_kg += added weight; charge_composition recomputed (projected_chemistry)"
          - "RETURN_LOT additions: lot.remaining_weight_kg -= weight and lot.consumed_weight_kg += weight; lot -> CONSUMED when remaining reaches exactly 0"
          - "increments MeltHeat.version by 1"
      - from: CHARGING
        to: SAMPLED
        trigger: "POST /api/heats/{id}/samples with a failing reading"
        actor: Spectrographer
        preconditions:
          - "charge_total_kg > 0 (ERR_INVALID_STATE)"
          - "expected_heat_version == heat.version (ERR_STALE_VERSION)"
        side_effects:
          - "last_sample_reading := reading; last_sample_passed := false"
          - "increments MeltHeat.version by 1"
      - from: CHARGING
        to: CERTIFIED
        trigger: "POST /api/heats/{id}/samples with a passing reading"
        actor: Spectrographer
        preconditions:
          - "charge_total_kg > 0 (ERR_INVALID_STATE)"
          - "expected_heat_version == heat.version (ERR_STALE_VERSION)"
        side_effects:
          - "last_sample_reading := reading; last_sample_passed := true; certified_by_user_id := X-User-ID"
          - "increments MeltHeat.version by 1"
      - from: SAMPLED
        to: CHARGING
        trigger: "POST /api/heats/{id}/charges (corrective loop-back)"
        actor: MeltSupervisor
        preconditions:
          - "last_sample_passed == false (ERR_INVALID_STATE)"
          - "RETURN_LOT/weight preconditions as on CHARGING->CHARGING"
          - "expected_heat_version == heat.version (ERR_STALE_VERSION)"
        side_effects:
          - "Same charge/chemistry/lot side effects as CHARGING->CHARGING"
          - "increments MeltHeat.version by 1"
      - from: SAMPLED
        to: CERTIFIED
        trigger: "POST /api/heats/{id}/samples (re-sample supersedes prior reading)"
        actor: Spectrographer
        preconditions:
          - "expected_heat_version == heat.version (ERR_STALE_VERSION)"
        side_effects:
          - "last_sample_reading := reading; last_sample_passed := true; certified_by_user_id := X-User-ID"
          - "increments MeltHeat.version by 1"
      - from: SAMPLED
        to: SAMPLED
        trigger: "POST /api/heats/{id}/samples (failing re-sample)"
        actor: Spectrographer
        preconditions:
          - "expected_heat_version == heat.version (ERR_STALE_VERSION)"
        side_effects:
          - "last_sample_reading := reading; last_sample_passed := false"
          - "increments MeltHeat.version by 1"
      - from: CERTIFIED
        to: TAPPED
        trigger: "POST /api/heats/{id}/tap (from CHARGING/SAMPLED the call fails ERR_HEAT_NOT_CERTIFIED)"
        actor: MeltSupervisor
        preconditions:
          - "Sum of tapped_weight_kg over heats of the same furnace with tapped_date == today + tap_weight_kg <= furnace.daily_tap_capacity_kg; equality allowed (ERR_FURNACE_CAPACITY_EXCEEDED)"
          - "Logical now must not fall inside any of the furnace's maintenance_windows (closed interval) (ERR_INVALID_STATE)"
        side_effects:
          - "tapped_weight_kg := payload; tapped_date := UTC date of logical now; remaining_metal_kg := tapped_weight_kg"
          - "increments MeltHeat.version by 1"
      - from: TAPPED
        to: POURED_OUT
        trigger: "system (during run-ops when no BOOKED pour slots reference the heat)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PourSlot
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /api/pour-slots/{id}/complete"
        actor: LineOperator
        preconditions:
          - "heat.status == TAPPED (ERR_HEAT_NOT_TAPPED)"
          - "logical now within [start_at, end_at) (ERR_SLOT_NOT_IN_WINDOW)"
          - "Every mold on the slot still ASSEMBLED (ERR_INVALID_STATE)"
          - "Every mold's sand_batch status == IN_SERVICE (ERR_SAND_BATCH_INACTIVE)"
          - "heat.remaining_metal_kg >= sum of mold.metal_weight_kg over slot molds (ERR_METAL_INSUFFICIENT)"
        side_effects:
          - "Each mold -> POURED with poured_at := now; heat.remaining_metal_kg -= sum(mold.metal_weight_kg)"
          - "For each mold, create pattern.impressions Castings (order_id from mold, routing_status=SHAKEOUT, quality_status=PENDING, casting_weight_kg per casting_weight rule)"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /api/pour-slots/{id}/cancel"
        actor: LineOperator
        side_effects:
          - "Every mold on the slot: pour_slot_id := null (stays ASSEMBLED)"
      - from: BOOKED
        to: EXPIRED
        trigger: "system (during run-ops when logical now > end_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Every mold on the slot: pour_slot_id := null (stays ASSEMBLED)"
      - from: BOOKED
        to: CANCELLED
        trigger: "system (sand-quarantine cascade: a mold on the slot is SCRAPPED)"
        actor: system
        preconditions: []
        side_effects:
          - "Remaining ASSEMBLED molds on the slot: pour_slot_id := null"
        note: "Cascade link 3 of the sand-quarantine chain"

  - entity: Mold
    initial_state: ASSEMBLED
    terminal_states: [CLOSED, SCRAPPED]
    transitions:
      - from: ASSEMBLED
        to: POURED
        trigger: "system (its pour slot completes)"
        actor: system
        preconditions: []
        side_effects:
          - "poured_at := now; castings created (see PourSlot COMPLETED)"
      - from: POURED
        to: COOLED
        trigger: "system (during run-ops when logical now >= poured_at + cooling_hours)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COOLED
        to: SHAKEOUT
        trigger: "POST /api/molds/{id}/shakeout"
        actor: LineOperator
        preconditions: []
        side_effects:
          - "sand_batch: committed_weight_kg -= mold.sand_weight_kg; spent_weight_kg += mold.sand_weight_kg"
      - from: SHAKEOUT
        to: CLOSED
        trigger: "system (during run-ops when every casting of the mold has routing_status COMPLETE or quality_status SCRAPPED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSEMBLED
        to: SCRAPPED
        trigger: "system (sand-quarantine cascade: its sand batch is DISCARDED)"
        actor: system
        preconditions: []
        side_effects:
          - "If pour_slot_id set: that BOOKED slot -> CANCELLED (cascade), pour_slot_id := null"
          - "order.pipeline_count recomputed (mold excluded)"

  - entity: Casting
    initial_state: "routing_status=SHAKEOUT, quality_status=PENDING (parallel dimensions)"
    terminal_states: ["routing_status=COMPLETE", "quality_status=SCRAPPED"]
    transitions:
      - from: "routing SHAKEOUT"
        to: "routing CLEANING"
        trigger: "POST /api/castings/{id}/advance"
        actor: LineOperator
        preconditions:
          - "mold.status == SHAKEOUT or CLOSED (ERR_INVALID_STATE)"
          - "quality_status not SCRAPPED (ERR_INVALID_STATE)"
        side_effects: []
      - from: "routing CLEANING"
        to: "routing GRINDING"
        trigger: "POST /api/castings/{id}/advance"
        actor: LineOperator
        preconditions: ["quality_status not SCRAPPED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: "routing GRINDING"
        to: "routing FINAL_INSPECTION"
        trigger: "POST /api/castings/{id}/advance"
        actor: LineOperator
        preconditions: ["quality_status not SCRAPPED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: "routing FINAL_INSPECTION"
        to: "routing COMPLETE"
        trigger: "POST /api/castings/{id}/advance"
        actor: LineOperator
        preconditions:
          - "quality_status in {ACCEPTED, USE_AS_IS} (ERR_INVALID_STATE)"
        side_effects: []
      - from: "routing FINAL_INSPECTION"
        to: "routing GRINDING"
        trigger: "system (inspection disposition REWORK sends the casting back)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "quality PENDING"
        to: "quality ACCEPTED"
        trigger: "system (inspection disposition ACCEPT)"
        actor: system
        preconditions: []
        side_effects:
          - "order.accepted_count += 1; if accepted_count >= quantity: order -> FULFILLED (fulfilled_at := now)"
      - from: "quality PENDING"
        to: "quality USE_AS_IS"
        trigger: "system (inspection disposition USE_AS_IS)"
        actor: system
        preconditions: []
        side_effects:
          - "order.accepted_count += 1; if accepted_count >= quantity: order -> FULFILLED"
      - from: "quality PENDING"
        to: "quality REWORK"
        trigger: "system (inspection disposition REWORK)"
        actor: system
        preconditions: []
        side_effects:
          - "routing_status FINAL_INSPECTION -> GRINDING"
      - from: "quality REWORK"
        to: "quality PENDING"
        trigger: "system (a new InspectionReport is recorded for the casting after rework)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "quality PENDING"
        to: "quality SCRAPPED"
        trigger: "system (inspection disposition SCRAP)"
        actor: system
        preconditions: []
        side_effects:
          - "ScrapRecord created (cascade: scrap_code from defect_type, provisional_weight_kg computed, return_lot_id from disposition payload)"
          - "order.scrapped_count += 1"

  - entity: InspectionReport
    initial_state: RECORDED
    terminal_states: [DISPOSITIONED]
    transitions:
      - from: RECORDED
        to: DISPOSITIONED
        trigger: "POST /api/inspections/{id}/disposition (from DISPOSITIONED: ERR_DISPOSITION_EXISTS, not the generic terminal error)"
        actor: QualityInspector
        preconditions:
          - "Segregation of duties: X-User-ID != certified_by_user_id of the heat that poured the casting (trace casting.mold_id -> mold.pour_slot_id -> slot.heat_id) (ERR_SEGREGATION_OF_DUTIES)"
          - "disposition USE_AS_IS requires porosity_grade <= 4 (ERR_DISPOSITION_RULE_VIOLATED)"
          - "disposition SCRAP requires scrap_code in payload (ERR_INVALID_REQUEST)"
          - "disposition REWORK requires defect_type in {POROSITY, SHRINKAGE, INCLUSION} (ERR_DISPOSITION_RULE_VIOLATED)"
        side_effects:
          - "disposition := payload decision; disposited_by_user_id := X-User-ID"
          - "Branch ACCEPT: casting quality -> ACCEPTED (order.accepted_count += 1; possible order FULFILLED)"
          - "Branch USE_AS_IS: casting quality -> USE_AS_IS (same order effects as ACCEPT)"
          - "Branch REWORK: casting quality -> REWORK; casting routing FINAL_INSPECTION -> GRINDING"
          - "Branch SCRAP: casting quality -> SCRAPPED (order.scrapped_count += 1); ScrapRecord created with provisional_weight_kg = casting_weight_kg * 0.85; credited ReturnLot.remaining_weight_kg += provisional_weight_kg and lot.scrap_credited_kg += provisional_weight_kg; foundry.alloy_available_kg recomputed"

  - entity: ScrapRecord
    initial_state: PROVISIONAL
    terminal_states: [WEIGHED]
    transitions:
      - from: PROVISIONAL
        to: WEIGHED
        trigger: "POST /api/scrap-records/{id}/weigh"
        actor: QualityInspector
        preconditions:
          - "actual_weight_kg >= 0 (ERR_INVALID_REQUEST)"
          - "lot.remaining_weight_kg + (actual_weight_kg - provisional_weight_kg) >= 0 (ERR_RETURN_LOT_INSUFFICIENT)"
        side_effects:
          - "actual_weight_kg := payload"
          - "ReturnLot.scrap_credited_kg += (actual - provisional); ReturnLot.remaining_weight_kg += (actual - provisional); foundry.alloy_available_kg recomputed"

  - entity: ReturnLot
    initial_state: COLLECTED
    terminal_states: [CONSUMED, DOWNGRADED]
    transitions:
      - from: COLLECTED
        to: ASSAYED
        trigger: "POST /api/return-lots/{id}/assay with all elements within the grade's spec"
        actor: Spectrographer
        preconditions: []
        side_effects:
          - "assay_composition := payload; foundry.alloy_available_kg recomputed"
      - from: COLLECTED
        to: DOWNGRADED
        trigger: "POST /api/return-lots/{id}/assay with any element outside the grade spec (contaminated)"
        actor: Spectrographer
        preconditions: []
        side_effects:
          - "downgraded_weight_kg := remaining_weight_kg; remaining_weight_kg := 0; foundry.alloy_available_kg recomputed"
      - from: ASSAYED
        to: CONSUMED
        trigger: "system (automatic when remaining_weight_kg reaches exactly 0 via heat charges)"
        actor: system
        preconditions: []
        side_effects:
          - "foundry.alloy_available_kg recomputed"

  - entity: SandBatch
    initial_state: MIXED
    terminal_states: [DISCARDED]
    transitions:
      - from: MIXED
        to: IN_SERVICE
        trigger: "POST /api/sand-batches/{id}/test with loi_pct <= max_loi_pct (equality passes)"
        actor: QualityInspector
        preconditions: []
        side_effects:
          - "last_loi_pct := payload; foundry.posture recomputed"
      - from: MIXED
        to: DISCARDED
        trigger: "POST /api/sand-batches/{id}/test with loi_pct > max_loi_pct"
        actor: QualityInspector
        preconditions: []
        side_effects:
          - "discarded_weight_kg += current_weight_kg; current_weight_kg := 0; foundry.posture recomputed"
      - from: IN_SERVICE
        to: RECLAIMING
        trigger: "POST /api/sand-batches/{id}/reclaim"
        actor: LineOperator
        preconditions:
          - "spent_weight_kg > 0 (ERR_INVALID_STATE)"
          - "reclaimed_weight_kg + loss_weight_kg == spent_weight_kg exactly (ERR_SAND_MASS_MISMATCH)"
        side_effects:
          - "pending_reclaim_kg := reclaimed_weight_kg; discarded_weight_kg += loss_weight_kg; spent_weight_kg := 0"
      - from: RECLAIMING
        to: IN_SERVICE
        trigger: "POST /api/sand-batches/{id}/test with loi_pct <= max_loi_pct"
        actor: QualityInspector
        preconditions: []
        side_effects:
          - "current_weight_kg += pending_reclaim_kg; pending_reclaim_kg := 0; last_loi_pct := payload; foundry.posture recomputed"
      - from: RECLAIMING
        to: DISCARDED
        trigger: "POST /api/sand-batches/{id}/test with loi_pct > max_loi_pct"
        actor: QualityInspector
        preconditions: []
        side_effects:
          - "discarded_weight_kg += current_weight_kg + pending_reclaim_kg + committed_weight_kg; current/committed/pending := 0"
          - "Quarantine cascade: every mold with sand_batch_id == this batch and status ASSEMBLED -> SCRAPPED; each such mold's BOOKED pour slot -> CANCELLED with mold links cleared; order.pipeline_count recomputed; foundry.posture recomputed"

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [SETTLED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /api/claims/{id}/review action=START"
        actor: WarrantyManager
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/claims/{id}/review action=APPROVE"
        actor: WarrantyManager
        preconditions: []
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/claims/{id}/review action=DENY"
        actor: WarrantyManager
        preconditions: []
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /api/claims/{id}/review action=REQUEST_INFO"
        actor: WarrantyManager
        preconditions: []
        side_effects: []
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /api/claims/{id}/review action=RESPOND"
        actor: Customer
        preconditions:
          - "X-User-ID == claim.customer_id (ERR_FORBIDDEN_OWNER)"
        side_effects: []
      - from: DENIED
        to: UNDER_REVIEW
        trigger: "POST /api/claims/{id}/review action=APPEAL"
        actor: Customer
        preconditions:
          - "X-User-ID == claim.customer_id (ERR_FORBIDDEN_OWNER)"
          - "appeal_used == false (ERR_APPEAL_ALREADY_USED)"
        side_effects:
          - "appeal_used := true"
      - from: APPROVED
        to: SETTLED
        trigger: "POST /api/claims/{id}/settle"
        actor: WarrantyManager
        preconditions:
          - "Segregation of duties: X-User-ID != reviewed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "order.status in {FULFILLED, CLOSED} (ERR_INVALID_STATE)"
          - "warranty_credit <= order.warranty_budget_cents - order.settled_total_cents (ERR_WARRANTY_BUDGET_EXCEEDED)"
        side_effects:
          - "settled_credit_cents computed per warranty_credit variant; credit_variant_applied recorded"
          - "order.settled_total_cents += settled_credit_cents"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: heat-sample-stale-heat
    parent_entity: MeltHeat
    write_endpoint: "POST /api/heats/{id}/samples"
    occ_field: "expected_heat_version"
    description: |
      Recording a spectro sample against a MeltHeat whose version has advanced
      since the client last observed it is rejected. A new sample legitimately
      supersedes the previous reading, so a client holding a stale observed
      version must re-read the heat before submitting.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: heat-charge-stale-heat
    parent_entity: MeltHeat
    write_endpoint: "POST /api/heats/{id}/charges"
    occ_field: "expected_heat_version"
    description: |
      Adding charge material against a MeltHeat whose version has advanced
      since the client last observed it is rejected, because charge chemistry
      projections are computed from the most recent charge composition.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: run-ops-stale-foundry
    parent_entity: Foundry
    write_endpoint: "POST /api/foundries/{id}/run-ops"
    occ_field: "expected_foundry_version"
    description: |
      Advancing a Foundry ops epoch against a stale observed version is
      rejected; the client must re-read the foundry so epoch-sensitive
      decisions (expiry, closeout, cooling) observe current state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: pattern_dimensions
    trigger: "Pattern creation (POST /api/patterns)"
    algorithm: constraint_propagation
    formula: |
      for each axis i:
        eff_ma = min(machining_allowance_mm, MA_CAP_MM[mold_process])
        pattern_dimensions_mm[i] = round_half_up( (finish_dimensions_mm[i] + eff_ma) * (1 + SHRINK[alloy_shrink_class][mold_process]), 1 )
    input_set: "The pattern's own finish_dimensions_mm, machining_allowance_mm, alloy_shrink_class, mold_process"
    constants:
      SHRINK_FERROUS_SAND: 0.0104
      SHRINK_FERROUS_INVESTMENT: 0.0120
      SHRINK_ALUMINUM_SAND: 0.0130
      SHRINK_ALUMINUM_INVESTMENT: 0.0110
      MA_CAP_SAND_MM: 6.0
      MA_CAP_INVESTMENT_MM: 2.5
    precision: "1 decimal place per axis, round_half_up per axis (per-axis rounding pinned; never round the sum)"
    note: "Combinatorial mode (a): >=3 inputs (finish dim, allowance, shrink class, process) with nested min() and conditional branches on process/class."

  - name: qualification_evaluation
    trigger: "POST /api/patterns/{id}/qualify"
    algorithm: threshold
    formula: |
      pass = all( abs(measured_dimensions_mm[i] - pattern_dimensions_mm[i]) <= QUALIFY_TOL_MM for each axis i )
      if pass: status ACTIVE (and supersede parent revision); else: status back to DRAFT
    input_set: "measured_dimensions_mm payload vs computed pattern_dimensions_mm"
    constants:
      QUALIFY_TOL_MM: 0.3
    precision: "comparison at 1 decimal place; boundary: deviation exactly 0.3 passes (<=)"

  - name: spectro_certification
    trigger: "POST /api/heats/{id}/samples"
    algorithm: threshold
    formula: |
      element_pass = for every element e in chemistry_spec.elements: spec[e].min <= reading[e] <= spec[e].max  (both bounds inclusive)
      ce_pass = true unless chemistry_spec.ce_max is present:
        CE = reading.C + reading.Si / 3 + reading.P / 2 ; ce_pass = (CE <= ce_max)
      certified = element_pass AND ce_pass
    input_set: "The sample reading vs the heat's pinned chemistry_spec snapshot"
    constants: {}
    precision: "2 decimal places on reading values; inclusive bounds at both ends"

  - name: projected_chemistry
    trigger: "POST /api/heats/{id}/charges (every charge addition)"
    algorithm: aggregation
    formula: |
      for each element e:
        charge_composition[e] = round_half_up( sum(addition.weight_kg * addition.composition[e]) / sum(addition.weight_kg), 4 )
      charge_total_kg = sum(addition.weight_kg)
      Elements absent from an addition's composition count as 0 for that addition.
    input_set: "All charge additions recorded on the heat (VIRGIN, RETURN_LOT, and AUTO_CORRECT generated additions)"
    constants: {}
    precision: "4 decimal places, round_half_up"

  - name: corrective_charge_masses
    trigger: "POST /api/heats/{id}/charges with mode=AUTO_CORRECT"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (frozen-baseline single pass — no iteration):
      1. W0 = charge_total_kg BEFORE this correction; C0[e] = charge_composition[e] BEFORE this correction.
      2. target[e] = (spec[e].min + spec[e].max) / 2 for every element e where C0[e] < spec[e].min (only under-range elements are corrected).
      3. deficit[e] = target[e] - C0[e].
      4. mass[e] = round_half_up( deficit[e]/100 * W0 / (ADDITIVE_PURITY - target[e]/100), 2 )   # W0 is frozen for ALL elements
      5. Apply all masses; charge_total_kg += sum(mass); charge_composition recomputed AFTER all masses are fixed.
      masses for elements already in range are 0 and produce no addition.
    input_set: "Heat's charge_composition and chemistry_spec at the moment of the call"
    constants:
      ADDITIVE_PURITY: 1.00
    precision: "2 decimal places per element mass, round_half_up; W0 frozen across elements"
    note: "Combinatorial mode (c): circular-looking dependency (corrective mass changes total weight which changes dilution) resolved by the pinned frozen-baseline evaluation order."

  - name: scrap_credit
    trigger: "Base: inspection disposition SCRAP. Reconciliation: POST /api/scrap-records/{id}/weigh"
    algorithm: aggregation
    formula: |
      provisional_weight_kg = round_half_up( casting_weight_kg * SCRAP_PROVISIONAL_YIELD, 2 )
      credited = provisional_weight_kg at disposition; at weigh, credited += (actual_weight_kg - provisional_weight_kg)
      ReturnLot.scrap_credited_kg and remaining_weight_kg track credited at all times.
    input_set: "The scrapped casting's casting_weight_kg; the credited ReturnLot"
    constants:
      SCRAP_PROVISIONAL_YIELD: 0.85
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "At disposition SCRAP (before the casting is weighed)"
        difference: "Uses estimated recoverable weight = casting_weight_kg * 0.85"
      - name: final
        when: "At POST /api/scrap-records/{id}/weigh (scale weight known)"
        difference: "Credits the actual scale weight; the delta (actual - provisional) is applied to the same ReturnLot so provisional and final credits differ for identical scrap whenever actual != provisional"
    note: "Dual-variant calculation #1 (entity domain: remelt cost accounting on ScrapRecord/ReturnLot)."

  - name: warranty_credit
    trigger: "POST /api/claims/{id}/settle"
    algorithm: tiered_pricing
    formula: |
      STANDARD (claim_type == DEFECT):
        credit = min(claimed_amount_cents, unit_price_cents * claim_qty)
      MACHINING_ALLOWANCE (claim_type == MACHINING_SHORTFALL):
        credit = min(claimed_amount_cents, round_half_up(unit_price_cents * machining_allowance_pct * claim_qty, 0) + freight_cents)
      Then budget check: credit must be <= order.warranty_budget_cents - order.settled_total_cents else ERR_WARRANTY_BUDGET_EXCEEDED.
    input_set: "The claim and its order's unit_price_cents, machining_allowance_pct, budget fields"
    constants: {}
    precision: "integer cents; per-claim rounding before budget comparison"
    variants:
      - name: standard
        when: "claim_type == DEFECT"
        difference: "Full unit-price credit up to the claimed amount; freight ignored"
      - name: machining_allowance
        when: "claim_type == MACHINING_SHORTFALL"
        difference: "Credit capped at machining-allowance fraction of price plus freight; produces a different credit for identical claim_qty/claimed_amount whenever freight or the allowance fraction bind"
    note: "Dual-variant calculation #2 (entity domain: commercial settlement on WarrantyClaim/CustomerOrder) — distinct domain from scrap_credit."

  - name: sand_reclaim_rounding
    trigger: "POST /api/sand-batches/{id}/reclaim"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER: each reclaim event's reclaimed_weight_kg and loss_weight_kg are individually
      rounded to 0.1 kg (round_half_up) BEFORE being applied to the batch accumulators; accumulators are
      never re-rounded. (Sum-then-round is explicitly NOT used: 3 events of 33.35 kg each credit
      3 * 33.4 = 100.2 kg, not round(100.05) = 100.1 kg.)
    input_set: "The reclaim payload vs the batch's spent_weight_kg"
    constants: {}
    precision: "0.1 kg per reclaim event, round_half_up per event"
    note: "Combinatorial mode (b): nested rounding order pinned."

  - name: foundry_posture
    trigger: "Any SandBatch status/weight transition, mold creation, shakeout, reclaim, or test on the foundry"
    algorithm: threshold
    formula: |
      sand_available_kg = sum(current_weight_kg for batches of foundry with status == IN_SERVICE)
      if sand_available_kg == 0: posture = EMBARGO
      elif sand_available_kg <= CURTAIL_THRESHOLD_KG: posture = CURTAILED
      else: posture = OPEN
      Gates (slot booking only — mold creation is governed by per-batch checks):
             EMBARGO blocks POST /api/pour-slots (ERR_FOUNDRY_EMBARGO);
             CURTAILED blocks POST /api/pour-slots (ERR_FOUNDRY_CURTAILED).
      Boundary: sand_available_kg exactly 500 -> CURTAILED; exactly 500.01 -> OPEN.
    input_set: "All SandBatches of the foundry with status IN_SERVICE"
    constants:
      CURTAIL_THRESHOLD_KG: 500
    precision: "2 decimal places on sand_available_kg"

  - name: order_fulfillment
    trigger: "Casting quality transitions to ACCEPTED or USE_AS_IS"
    algorithm: threshold
    formula: |
      accepted_count = count of order's castings with quality_status in {ACCEPTED, USE_AS_IS}
      if order.status == IN_PRODUCTION AND accepted_count >= quantity: order -> FULFILLED
      Boundary: equality (accepted_count == quantity) triggers; nothing beyond quantity is required.
    input_set: "All castings whose order_id == order.id"
    constants: {}
    precision: "integer counts"

  - name: pipeline_capacity
    trigger: "POST /api/molds"
    algorithm: aggregation
    formula: |
      cap = ceil(order.quantity * (1 + order.overage_pct))
      pipeline_count = sum(pattern.impressions for molds of the order with status != SCRAPPED)
      creating a mold requires: pipeline_count + pattern.impressions <= cap (ERR_ORDER_QUANTITY_EXCEEDED)
    input_set: "All non-SCRAPPED molds referencing the order"
    constants: {}
    precision: "integer castings"

  - name: daily_load_checks
    trigger: "POST /api/heats/{id}/tap (furnace leg) and POST /api/pour-slots (line leg)"
    algorithm: aggregation
    formula: |
      Furnace leg: sum(tapped_weight_kg over heats with furnace_id == F and tapped_date == today) + new_tap
                   <= furnace.daily_tap_capacity_kg (equality passes; ERR_FURNACE_CAPACITY_EXCEEDED otherwise)
      Line leg: sum(duration_minutes(end_at - start_at) over BOOKED/COMPLETED slots of the line on the same
                UTC date) + new_duration <= line.daily_minute_capacity (equality passes; ERR_LINE_MINUTES_EXCEEDED)
    input_set: "Tapped heats of the furnace for the UTC date; non-terminal slots of the line for the UTC date"
    constants: {}
    precision: "kg at 2 dp; whole minutes"

  - name: slot_overlap
    trigger: "POST /api/pour-slots"
    algorithm: interval_merge
    formula: |
      Pour slots use HALF-OPEN intervals [start_at, end_at) plus a mandatory cleanup buffer B =
      line.cleanup_buffer_minutes appended after each slot. A new slot conflicts with an existing BOOKED or
      COMPLETED slot s on the same line UNLESS:
        new.start_at >= s.end_at + B   OR   new.end_at + B <= s.start_at
      Equality at the buffer boundary is allowed (no conflict).
      Furnace maintenance windows instead use CLOSED intervals [start, end]: they conflict iff
        new.start <= existing.end AND existing.start <= new.end
      so touching endpoints (new.start == existing.end) DO conflict.
    input_set: "All BOOKED/COMPLETED slots of the molding line (slot leg); all windows of the furnace (window leg)"
    constants: {}
    precision: "second-precision timestamps"
    note: "Two different interval semantics on two different resources (half-open+buffer vs closed-inclusive)."

  - name: casting_weight
    trigger: "Pour slot completion (casting creation)"
    algorithm: aggregation
    formula: |
      base = round_half_up(mold.metal_weight_kg / pattern.impressions, 2)
      cavities 1..impressions-1 get base; the LAST cavity gets
        round_half_up(mold.metal_weight_kg - base * (impressions - 1), 2)
      so per-mold weights sum exactly to metal_weight_kg (remainder assigned to last cavity, never by id).
    input_set: "The mold's metal_weight_kg and its pattern's impressions"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: alloy_mass_invariant
    trigger: "Verified after every ReturnLot mutation (assay, consume via charge, scrap credit, weigh)"
    algorithm: aggregation
    formula: |
      INVARIANT (alloy mass): collected_weight_kg + scrap_credited_kg == consumed_weight_kg + remaining_weight_kg + downgraded_weight_kg
      Forward/compensating pair: heat-charge consumption (remaining -> consumed) vs scrap credit / weigh
      reconciliation (scrap_credited -> remaining). Any drift violates the invariant.
    input_set: "The ReturnLot row"
    constants: {}
    precision: "2 decimal places"

  - name: sand_mass_invariant
    trigger: "Verified after every SandBatch mutation (mold create, shakeout, reclaim, test/discard)"
    algorithm: aggregation
    formula: |
      INVARIANT (sand mass): virgin_weight_kg == current_weight_kg + committed_weight_kg + spent_weight_kg + pending_reclaim_kg + discarded_weight_kg
      Forward/compensating pair: mold creation commits sand (current -> committed); shakeout + reclaim +
      test return or discard it (committed -> spent -> pending -> current | discarded). Any drift violates the invariant.
    input_set: "The SandBatch row"
    constants: {}
    precision: "2 decimal places"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted on this endpoint; for action-scoped endpoints (claims review) the action must be permitted for the role; entity_backed ownership: Customer may only act on own orders/claims"
    error_id: "ERR_UNAUTHORIZED_ROLE | ERR_FORBIDDEN_OWNER"
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path parameters and body FK references exist (pattern, order, customer, equipment, heat, slot, mold, casting, inspection, scrap record, return lot, sand batch, claim); body FK references must also belong to the SAME foundry as the resource being written — cross-foundry references resolve as not found"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition exists (incl. terminal lockdown)"
    error_id: "ERR_INVALID_STATE | ERR_ALREADY_TERMINAL"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Metallurgical/quality safety gates: heat CERTIFIED before tap; heat TAPPED before slot completion; segregation of duties (spectro certifier vs disposer; claim approver vs settler); sand batch IN_SERVICE at pour"
    error_id: "ERR_HEAT_NOT_CERTIFIED | ERR_HEAT_NOT_TAPPED | ERR_SEGREGATION_OF_DUTIES | ERR_SAND_BATCH_INACTIVE"
    http_status: 409
    applies_to: "tap, slot complete, disposition, settle"

  - priority: 6
    category: business_referential
    check: "Referenced resources in required lifecycle state: pattern ACTIVE for mold creation; return lot ASSAYED for consumption; claim order FULFILLED/CLOSED at filing"
    error_id: "ERR_PATTERN_NOT_ACTIVE | ERR_RETURN_LOT_NOT_ASSAYED"
    http_status: 409
    applies_to: "mold creation, heat charges, claim creation"

  - priority: 7
    category: business_constraint
    check: "Structural constraints: pour-slot half-open+buffer overlap; furnace closed-window overlap; active-revision uniqueness per part_number; equipment kind matches usage"
    error_id: "ERR_SLOT_WINDOW_CONFLICT | ERR_FURNACE_WINDOW_CONFLICT | ERR_ACTIVE_REVISION_EXISTS | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "slot booking, window creation, pattern creation/qualification"

  - priority: 8
    category: business_temporal
    check: "Time-based rules vs logical clock: slot/window not in the past; slot completion inside [start,end); warranty claim filed within warranty_months of fulfilled_at"
    error_id: "ERR_SLOT_IN_PAST | ERR_SLOT_NOT_IN_WINDOW | ERR_CLAIM_WINDOW_EXPIRED"
    http_status: 409
    applies_to: "slot booking, window creation, slot completion, claim creation"

  - priority: 9
    category: business_fiscal
    check: "Capacity/budget/resource accounting: furnace daily tap capacity; line daily minutes; order pipeline cap; return-lot sufficiency; heat remaining metal; batch sand sufficiency; warranty budget; sand mass balance; LOI bounds"
    error_id: "ERR_FURNACE_CAPACITY_EXCEEDED | ERR_LINE_MINUTES_EXCEEDED | ERR_ORDER_QUANTITY_EXCEEDED | ERR_RETURN_LOT_INSUFFICIENT | ERR_METAL_INSUFFICIENT | ERR_SAND_INSUFFICIENT | ERR_WARRANTY_BUDGET_EXCEEDED | ERR_SAND_MASS_MISMATCH"
    http_status: 422
    applies_to: "tap, slot booking, mold creation, charges, slot completion, settle, reclaim, test"

  - priority: 10
    category: business_constraint
    check: "Posture gating: EMBARGO blocks mold creation and slot booking; CURTAILED blocks slot booking (posture is derived from sand availability; gates evaluated after per-resource checks so resource-specific errors win)"
    error_id: "ERR_FOUNDRY_EMBARGO | ERR_FOUNDRY_CURTAILED"
    http_status: 409
    applies_to: "slot booking"

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; default time fixed) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (server startup default; never falls back to wall-clock)."
    roles: [FoundryAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["All subsequent temporal validations use the new logical time"]

  # --- Foundry ---
  - method: POST
    path: "/api/foundries"
    description: "Create a foundry site"
    roles: [FoundryAdmin]
    code: 201
    input: [name]
    output: Foundry
    side_effects: ["sand_available_kg=0, alloy_available_kg=0, posture=EMBARGO, ops_run_index=0"]
  - method: GET
    path: "/api/foundries/{id}"
    description: "Get a foundry (posture, inventories, version)"
    roles: [FoundryAdmin, PatternMaker, MeltSupervisor, Spectrographer, LineOperator, QualityInspector, WarrantyManager, Customer]
    code: 200
    input: []
    output: Foundry
    side_effects: []
  - method: POST
    path: "/api/foundries/{id}/run-ops"
    description: "Advance the ops epoch: expire BOOKED slots past end_at, advance POURED molds to COOLED when cooling_hours elapsed, close FULFILLED orders with no open claims, move TAPPED heats with no BOOKED slots to POURED_OUT, close SHAKEOUT molds whose castings are all terminal, recompute posture"
    roles: [FoundryAdmin]
    code: 200
    input: [expected_foundry_version]
    output: Foundry
    side_effects:
      - "ops_run_index += 1; increments Foundry.version by 1"
      - "BOOKED slots with now > end_at -> EXPIRED (mold links cleared)"
      - "POURED molds with now >= poured_at + cooling_hours -> COOLED"
      - "SHAKEOUT molds with all castings terminal -> CLOSED"
      - "TAPPED heats with no BOOKED slots -> POURED_OUT"
      - "FULFILLED orders with no open claims -> CLOSED"
      - "posture recomputed"

  # --- Customer ---
  - method: POST
    path: "/api/customers"
    description: "Register a customer"
    roles: [FoundryAdmin]
    code: 201
    input: [foundry_id, company_name, credit_limit_cents]
    output: Customer
    side_effects: []
  - method: GET
    path: "/api/customers/{id}"
    description: "Get a customer"
    roles: [FoundryAdmin, WarrantyManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/api/customers"
    description: "List customers (reverse-reachability for Customer.foundry_id)"
    roles: [FoundryAdmin, WarrantyManager]
    code: 200
    input: ["foundry_id?", "limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  # --- Pattern ---
  - method: POST
    path: "/api/patterns"
    description: "Create a pattern (optionally a revision of another pattern); pattern_dimensions_mm computed"
    roles: [PatternMaker]
    code: 201
    input: [foundry_id, part_number, alloy_shrink_class, mold_process, finish_dimensions_mm, machining_allowance_mm, impressions, "parent_pattern_id?"]
    output: Pattern
    side_effects: ["status=DRAFT; if parent_pattern_id given and that pattern already has an ACTIVE child revision -> ERR_ACTIVE_REVISION_EXISTS"]
  - method: GET
    path: "/api/patterns/{id}"
    description: "Get a pattern"
    roles: [FoundryAdmin, PatternMaker, LineOperator, Customer]
    code: 200
    input: []
    output: Pattern
    side_effects: []
  - method: GET
    path: "/api/patterns"
    description: "List patterns (reverse-reachability for Pattern.foundry_id and Pattern.parent_pattern_id)"
    roles: [FoundryAdmin, PatternMaker, LineOperator, Customer]
    code: 200
    input: ["foundry_id?", "parent_pattern_id?", "status?", "limit?", "offset?"]
    output: "Pattern[]"
    side_effects: []
  - method: POST
    path: "/api/patterns/{id}/qualify"
    description: "Submit qualification measurements; pass -> ACTIVE, fail -> back to DRAFT"
    roles: [PatternMaker]
    code: 200
    input: [measured_dimensions_mm]
    output: Pattern
    side_effects: ["qualification_attempts += 1; on pass: parent revision (if ACTIVE) -> SUPERSEDED"]
  - method: POST
    path: "/api/patterns/{id}/retire"
    description: "Retire an ACTIVE pattern with no open molds"
    roles: [PatternMaker]
    code: 200
    input: []
    output: Pattern
    side_effects: ["status -> RETIRED"]

  # --- CustomerOrder ---
  - method: POST
    path: "/api/orders"
    description: "Place a casting order"
    roles: [Customer, FoundryAdmin]
    code: 201
    input: [foundry_id, customer_id, pattern_id, quantity, "overage_pct?", unit_price_cents, machining_allowance_pct, warranty_months, warranty_budget_cents]
    output: CustomerOrder
    side_effects: ["status=RECEIVED; Customer role must own customer_id (ERR_FORBIDDEN_OWNER)"]
  - method: GET
    path: "/api/orders/{id}"
    description: "Get an order"
    roles: [FoundryAdmin, LineOperator, WarrantyManager, Customer]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: []
  - method: GET
    path: "/api/orders"
    description: "List orders (reverse-reachability for CustomerOrder.foundry_id/customer_id/pattern_id)"
    roles: [FoundryAdmin, LineOperator, WarrantyManager, Customer]
    code: 200
    input: ["foundry_id?", "customer_id?", "pattern_id?", "status?", "limit?", "offset?"]
    output: "CustomerOrder[]"
    side_effects: []
  - method: POST
    path: "/api/orders/{id}/cancel"
    description: "Cancel an order with no open molds"
    roles: [Customer, FoundryAdmin]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: ["status -> CANCELLED"]

  # --- Equipment ---
  - method: POST
    path: "/api/equipment"
    description: "Register a furnace or molding line"
    roles: [FoundryAdmin]
    code: 201
    input: [foundry_id, kind, label, "daily_tap_capacity_kg?", "daily_minute_capacity?", "cleanup_buffer_minutes?"]
    output: Equipment
    side_effects: []
  - method: GET
    path: "/api/equipment/{id}"
    description: "Get equipment"
    roles: [FoundryAdmin, MeltSupervisor, LineOperator]
    code: 200
