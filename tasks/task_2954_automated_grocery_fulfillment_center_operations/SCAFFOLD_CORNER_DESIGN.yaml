              captures: { fresh_v: $.data.version }
          trigger:
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "00000000-0000-4000-8000-0000000000f1", customer_order_id: "00000000-0000-4000-8000-0000000000f2", units: 3, expected_order_version: "${stale_v}" }
              as: Customer
