      - name: trade_in_grade_dispute_regrade_cycle
        grounds:
          - state_machines.TradeIn.status
          - entities.TradeIn.fields.dispute_count
          - entities.TradeIn.fields.latest_report_sequence_no
          - entities.DiagnosticReport.fields.report_type
          - calculations.trade_in_credit.variants.final_graded
          - endpoints.POST_/trade-ins/{id}/regrade
        distinguishing_aspect: |
          TradeIn.status cycles GRADED -> DISPUTED -> GRADED, but unlike the delinquency cycle
          the second occupancy of GRADED is NOT identical to the first: dispute_count is a
          monotonic counter that survives the loop (1, and never reset to 0), the grading
          fields are rewritten from the newest report only (credit_final 45000, not the
          superseded 31750), and latest_report_sequence_no advances to 2 while
          credit_estimate_cents stays pinned at its declaration-time 38250 so
          credit_variance_cents flips sign from -6500 to +6750. An implementation that
          re-derives the credit from all reports, or resets the loop counter on re-entry,
          diverges immediately.
