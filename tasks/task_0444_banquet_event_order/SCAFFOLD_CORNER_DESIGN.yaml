          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: "CLASSROOM factor 0.5 on a max_capacity=100 room yields effective 50; an event with billable 80 (>50) make-definite -> ERR_CAPACITY_EXCEEDED."
        test_recipe:
