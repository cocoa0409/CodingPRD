            - "BuildingConfiguration.${cfg_locked_id}.status == CRITERIA_STALE and its version == ${cfg_locked_v} + 1"
            - "BuildingConfiguration.${cfg_draft_id}.status is still DRAFT with version 1 and every computed load field still null"
            - "BuildingConfiguration.${cfg_other_id}.status is still LOCKED with version == ${cfg_other_v}"
            - "Jurisdiction.${j2_id}.criteria_revision == 1 — the revision is per jurisdiction, not per territory"
            - "re-locking ${cfg_locked_id} would recompute design_wind_pressure_psf at exposure D, but no automatic re-lock happened"

      - name: jurisdiction_criteria_revision_voids_designs_and_packages_downward
        claim_type: cascade_down
        grounds:
          - state_machines.BuildingConfiguration.transitions[LOCKED->CRITERIA_STALE].side_effects
          - state_machines.EngineeringDesign.transitions[APPROVED->VOIDED].side_effects
          - state_machines.DrawingPackage.transitions[SEALED->VOIDED].side_effects
        excluded_because:
          difficulty_instance: jurisdiction_criteria_revision_cascade_depth_five
          rationale: "That §1.8 instance already walks the whole downward cascade in one request — jurisdiction revision, configuration to CRITERIA_STALE, design to VOIDED, package to VOIDED, order to permit_hold/ENG_REWORK and its SCHEDULED lot to CANCELLED — and asserts every hop, so a separate cascade_down corner would be a strict subset."

      - name: builder_suspension_cascades_across_orders_and_loads
        claim_type: cross_entity
        grounds:
          - state_machines.Builder.transitions[AUTHORIZED->SUSPENDED].side_effects
        excluded_because:
          difficulty_instance: builder_suspension_cascade_depth_three
          rationale: "The §1.8 instance drives exactly this cross-entity side effect — suspending a builder sets commercial_hold on its orders, cancels their PLANNED loads and recomputes the pounds ledger — and asserts all three hops plus the versions they bump."

      - name: order_production_status_bubbles_up_from_lot_children
        claim_type: bubble_up
        grounds:
          - calculations.order_production_status_rollup
          - state_machines.Order.transitions[PROD_IN_FABRICATION->PROD_COMPLETE]
        excluded_because:
          difficulty_instance: order_parallel_engineering_and_production_dimensions
          rationale: "That §1.8 instance already drives the parent's production dimension purely from its ProductionLot children — PROD_RELEASED to PROD_IN_FABRICATION on the first scheduled lot and on to PROD_COMPLETE only once all three required lot_types are COMPLETE — while the engineering dimension stays put."

      - name: load_lifecycle_keeps_the_order_pounds_ledger_in_sync
        claim_type: ledger_sync
        grounds:
          - calculations.order_shippable_weight_ledger
          - state_machines.ShipmentLoad.transitions[PLANNED->CANCELLED].side_effects
        excluded_because:
          difficulty_instance: load_cancel_restores_shippable_pounds_ledger
          rationale: "The §1.8 compensating-invariant instance already asserts assigned_weight_lbs and unassigned_weight_lbs after every load create and cancel and proves the two always re-sum to total_shippable_weight_lbs."

      - name: cancel_release_compensates_the_release_transition
        claim_type: compensation
        grounds:
          - state_machines.Order.transitions[PROD_RELEASED->PROD_NOT_RELEASED].side_effects
        excluded_because:
          difficulty_instance: cancel_release_restores_builder_credit_cents_ledger
          rationale: "The §1.8 instance already exercises the compensating path end to end — credit_used_cents moved by -price_delta_cents, final_price_cents and price_delta_cents cleared, the three weight fields reset to 0 and released_at nulled — with zero drift against the post-acceptance value."

      - name: order_carries_two_independent_status_dimensions
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - entities.Order.fields.engineering_status
          - entities.Order.fields.production_status
        excluded_because:
          difficulty_instance: order_parallel_engineering_and_production_dimensions
          rationale: "The parallel shape is the substance of that §1.8 instance, which pins the intermediate combinations (ENG_PENDING, PROD_NOT_RELEASED) and (ENG_SEALED, PROD_IN_FABRICATION) that a single-status model cannot express."

