              captures: { u_v: $.data.version }
          trigger:
            - call: "POST /valve-mfg/actuator-packages"
              payload: { valve_unit_id: "${u_id}", actuator_type: "PNEUMATIC", output_torque_nm: 900.0, sizing_basis: "CATALOG", expected_valve_unit_version: "${u_v} - 1", supply_pressure_bar: 5.5 }
              as: ProductEngineer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_VALVE_UNIT_VERSION"
            - "HTTP status == 412"
            - "ValveUnit.${u_id}.version == ${u_v}"
            - "no ActuatorPackage row references ValveUnit.${u_id}"

      - name: corner_datasheet_revision_with_stale_order_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[datasheet-revision-stale-order]
          - validations[priority=35]
          - errors[ERR_STALE_ORDER_VERSION]
        distinguishing_aspect: "The stale-version gate on datasheet revisions fires even though the order sits in CLARIFICATION_REQUESTED and the state precondition is satisfied: datasheet_revision_no stays 1 and the status does not return to UNDER_REVIEW."
        test_recipe:
          setup:
            - "An order in CLARIFICATION_REQUESTED after one clarification round; its version captured from the review-action response."
          setup_api_calls:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-OCC2", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/engineered-orders"
              payload: { order_code: "ETO-OCC2", model_id: "${m_id}", ordered_qty: 2, unit_price_cents: 900000, customer_credit_limit_cents: 5000000, datasheet_break_torque_nm: 420.0, datasheet_torque_source: "VENDOR_MEASURED" }
              as: ProductEngineer
              captures: { o_id: $.data.id }
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "REQUEST_CLARIFICATION" }
              as: QualityManager
              captures: { o_v: $.data.version }
          trigger:
            - call: "POST /valve-mfg/engineered-orders/${o_id}/datasheet-revisions"
              payload: { datasheet_break_torque_nm: 455.0, datasheet_torque_source: "CUSTOMER_STATED", expected_engineered_order_version: "${o_v} - 1" }
              as: ProductEngineer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_ORDER_VERSION"
            - "HTTP status == 412"
            - "EngineeredOrder.${o_id}.status == CLARIFICATION_REQUESTED"
            - "EngineeredOrder.${o_id}.datasheet_revision_no == 1"
            - "EngineeredOrder.${o_id}.datasheet_break_torque_nm == 420.0"
            - "EngineeredOrder.${o_id}.version == ${o_v}"

      - name: corner_cascading_side_effects_layer
        claim_type: cascading_side_effects
        excluded_because: "The four-hop chain (heat lot QUARANTINE -> component HOLD -> unit DECERTIFIED -> order HELD with its issued doc package VOIDED) is probed end-to-end, including the non-terminal-only rule, by §1.8 instance heat_lot_quarantine_cascades_four_hops_to_order_hold; the license-side three-link cascade is probed by second_major_finding_freezes_license_and_holds_order."

      - name: corner_dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        excluded_because: "Variant divergence, variant selection and the frozen-at-decision reconciliation are probed by §1.8 instances actuator_sizing_catalog_variant_vs_datasheet_variant and fugitive_emission_peak_variant_vs_time_weighted_variant, which pin both variants' outputs and the delta on the same fixture."

      - name: corner_version_pinning_on_approval_layer
        claim_type: derived_field_reconciliation
        excluded_because: "Pinning at APPROVE and the spec_stale re-derivation after the pinned model is superseded or withdrawn are probed by §1.8 instance production_release_blocked_by_withdrawn_pinned_model, which asserts the pinned revision, the recomputed spec_stale and the refused release."

