          assert:
            - "GarnishmentOrder.${ord_id}.withheld_cents == 50000"
            - "GarnishmentOrder.${ord_id}.refunded_cents == 20000"
            - "GarnishmentOrder.${ord_id}.remaining_balance_cents == 20000"
            - "50000 == 50000 - 20000 + 20000 (total == withheld - refunded + remaining)"
            - "GarnishmentOrder.${ord_id}.processing_status == SATISFIED (refund does not reopen terminal state)"

      - name: audit_chain_genesis_linkage_invariant
        grounds:
          - calculations.audit_chain_integrity
          - entities.AuditLogEntry.fields.prev_hash
          - entities.AuditLogEntry.fields.entry_hash
        distinguishing_aspect: |
          Conserved quantity = audit-chain linkage (a different conserved
          quantity from the money ledger): for the employer's AuditLogEntry
          sequence ordered by creation, prev_hash[i] == entry_hash[i-1] and
          entry_hash[i] == sha256(prev_hash[i] | payload_hash[i] | created_at[i])
          must hold after every mutation; the invariant is verified by
