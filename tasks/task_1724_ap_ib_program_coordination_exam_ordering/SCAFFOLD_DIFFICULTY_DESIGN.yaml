              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co1: $.data.id }
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_BIOLOGY", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co2: $.data.id }
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CHEM", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co3: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T Auth", email: "auth@x.edu" }
              as: ApCoordinator
              captures: { t_auth: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T Proctor", email: "proc@x.edu" }
              as: ApCoordinator
              captures: { p: $.data.id }
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t_auth}", course_id: "${co1}" }
              as: ApCoordinator
              captures: { ta1: $.data.id }
            - call: "POST /teacher-authorizations/${ta1}/complete-training"
              as: Teacher
              as_user_id: "${t_auth}"
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t_auth}", course_id: "${co2}" }
              as: ApCoordinator
              captures: { ta2: $.data.id }
            - call: "POST /teacher-authorizations/${ta2}/complete-training"
              as: Teacher
              as_user_id: "${t_auth}"
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t_auth}", course_id: "${co3}" }
              as: ApCoordinator
              captures: { ta3: $.data.id }
            - call: "POST /teacher-authorizations/${ta3}/complete-training"
              as: Teacher
              as_user_id: "${t_auth}"
            - call: "POST /exam-sessions"
              payload: { course_id: "${co1}", room_name: "P1", room_capacity: 5, start_at: "2027-05-05T09:00:00Z", end_at: "2027-05-05T10:00:00Z" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /exam-sessions"
              payload: { course_id: "${co2}", room_name: "P2", room_capacity: 5, start_at: "2027-05-05T10:30:00Z", end_at: "2027-05-05T12:00:00Z" }
              as: ApCoordinator
              captures: { s2: $.data.id }
            - call: "POST /exam-sessions"
              payload: { course_id: "${co3}", room_name: "P3", room_capacity: 5, start_at: "2027-05-05T10:29:00Z", end_at: "2027-05-05T12:00:00Z" }
              as: ApCoordinator
              captures: { s3: $.data.id }
            - call: "POST /proctor-assignments"
              payload: { session_id: "${s1}", teacher_id: "${p}" }
              as: ApCoordinator
          trigger:
            - call: "POST /proctor-assignments"
              payload: { session_id: "${s2}", teacher_id: "${p}" }
              as: ApCoordinator
              captures: { pa2: $.data.id }
            - call: "POST /proctor-assignments"
              payload: { session_id: "${s3}", teacher_id: "${p}" }
              as: ApCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "30-minute gap (10:00 end → 10:30 start) is allowed: ProctorAssignment.${pa2}.status == ASSIGNED (conflict requires gap < 30 minutes)"
            - "29-minute gap (10:00 end → 10:29 start) fails with ERR_PROCTOR_OVERLAP (409) — buffered semantics, unlike the room's half-open adjacency"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (money vs seat count)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: register_cancel_conserves_student_balance
        grounds:
          - calculations.student_balance
          - calculations.school_rebate
          - state_machines.ExamRegistration.REGISTERED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity MONEY: the register→cancel compensating pair must
          leave both the student's balance and the cycle rebate bit-identical to
          their pre-pair values (9800 and 882), pinned by the formulas
          balance = Σ net_fee over non-CANCELLED registrations and rebate =
          Σ round_half_up(net × 900bp). The second invariant conserves a
          different quantity (seat count).
        test_recipe:
          setup:
            - "Cycle OPEN (rebate 900bp); courses co1, co2 both fee 9800"
            - "Student s1 registered in co1 (rA): balance 9800, cycle rebate 882"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co1: $.data.id }
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_BIOLOGY", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co2: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co1}" }
              as: Student
              as_user_id: "${s1}"
              captures: { rA: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co2}" }
              as: Student
              as_user_id: "${s1}"
              captures: { rB: $.data.id }
            - call: "POST /registrations/${rB}/cancel"
              as: ApCoordinator
            - call: "GET /students/${s1}/statement"
              as: ApCoordinator
            - call: "GET /exam-cycles/${cy}"
              as: ApCoordinator
          assert:
            - "After register+cancel pair: statement.balance_cents == 9800 (identical to pre-pair value; invariant balance = Σ net_fee over non-CANCELLED registrations)"
            - "ExamCycle.${cy}.rebate_cents == 882 (identical to pre-pair value: round_half_up(9800 x 0.09); zero drift from the pair)"
            - "ExamRegistration.${rB}.registration_status == CANCELLED and score_status == VOID"

      - name: register_cancel_conserves_session_seats
        grounds:
          - calculations.session_seating
          - calculations.order_invoice
          - entities.ExamSession.fields.seats_reserved
        distinguishing_aspect: |
          Conserved quantity SEAT COUNT (and the derived draft-order quantity):
          a register→cancel pair on a course with a SCHEDULED session must leave
          seats_reserved == 1 and the DRAFT order's estimate_total_cents == 9800,
          bit-identical to pre-pair values. A different conserved quantity than
          the money invariant.
        test_recipe:
          setup:
            - "Cycle OPEN; course ACTIVE; student s0 registered before scheduling (seats 1); DRAFT order exists (estimate 9800)"
            - "Session SCHEDULED with capacity 5"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T Instructor", email: "inst@x.edu" }
              as: ApCoordinator
              captures: { t1: $.data.id }
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${co}" }
              as: ApCoordinator
              captures: { ta1: $.data.id }
            - call: "POST /teacher-authorizations/${ta1}/complete-training"
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /students"
              payload: { full_name: "Stu Zero", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s0: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu One", grade_level: 12, subgroup_code: "FRL" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s0}", course_id: "${co}" }
              as: Student
              as_user_id: "${s0}"
            - call: "POST /exam-orders"
              payload: { cycle_id: "${cy}" }
              as: ApCoordinator
              captures: { ord: $.data.id }
            - call: "POST /exam-sessions"
              payload: { course_id: "${co}", room_name: "GYM", room_capacity: 5, start_at: "2027-05-05T09:00:00Z", end_at: "2027-05-05T11:00:00Z" }
              as: ApCoordinator
              captures: { se: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /registrations/${r1}/cancel"
              as: ApCoordinator
            - call: "GET /exam-sessions/${se}"
              as: ApCoordinator
            - call: "GET /exam-orders/${ord}"
              as: ApCoordinator
          assert:
            - "After register+cancel pair: ExamSession.${se}.seats_reserved == 1 (identical to pre-pair; invariant seats_reserved = count of course's REGISTERED registrations)"
            - "ExamOrder.${ord}.estimate_total_cents == 9800 (identical to pre-pair; the cancelled registration drops out of the live estimate)"
            - "ExamSession.${se}.status == SCHEDULED (unaffected by the pair)"
