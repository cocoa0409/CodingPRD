          trigger:
            - call: "POST /blend-batches"
              payload: { formulation_id: "${form}", virgin_lot_id: "${lot_v2}", regrind_lot_id: "${lot_r2}", colorant_lot_id: "${lot_c}", target_batch_kg: 1000 }
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
