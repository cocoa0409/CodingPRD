  - method: GET
    path: "/correspondent-banking/closure-plans/{closurePlanId}"
    description: "Read one closure plan including the wind-down cap, the released amount, the obligation counters and the current allocation lines."
    roles: [PlatformAdmin, SanctionsOfficer, ComplianceAnalyst, FIGRelationshipManager, CommitteeApprover]
    code: 200
    input: []
    output: ClosurePlan
    side_effects: []

  - method: POST
    path: "/correspondent-banking/closure-plans/{closurePlanId}/submission"
    description: "Submit a drafted plan for committee approval."
    roles: [FIGRelationshipManager, ComplianceAnalyst]
    code: 200
    input: []
    output: ClosurePlan
    side_effects: ["requires state DRAFT, else ERR_INVALID_CLOSURE_STATE", "sets state PENDING_APPROVAL"]

  - method: POST
    path: "/correspondent-banking/closure-plans/{closurePlanId}/approval"
    description: "Committee approves or rejects the plan. Approval computes the wind-down cap under the plan's cap basis — the declared forward projection and the chronological actual basis can differ on identical data."
    roles: [CommitteeApprover]
    code: 200
    input: ["action"]
    output: ClosurePlan
    side_effects: ["requires state PENDING_APPROVAL", "APPROVE re-runs calculations.notice_period_days, then calculations.wind_down_cap (variant selected by cap_basis) and writes wind_down_cap_usd and approved_by_user_id = X-User-ID", "ERR_INSUFFICIENT_ACTIVITY_HISTORY (422) when cap_basis is CHRONOLOGICAL_ACTUAL and the respondent has no ActivityObservation rows", "ERR_SEGREGATION_OF_DUTIES (409) when X-User-ID equals drafted_by_user_id", "REJECT sets state ABORTED with abort_reason COMMERCIAL_DECISION and returns the respondent to its pre-exit dd_state with payment_posture SCREEN_ONLY"]

  - method: POST
    path: "/correspondent-banking/closure-plans/{closurePlanId}/progression"
    description: "Serve notice, begin wind-down, close the relationship or abort the plan. Closing requires the notice period to have elapsed and the obligation to be fully settled."
    roles: [FIGRelationshipManager, ComplianceAnalyst]
    code: 200
    input: ["action", "abort_reason?"]
    output: ClosurePlan
    side_effects: ["SERVE_NOTICE requires state APPROVED and writes notice_served_at = the logical clock and wind_down_end_at = notice_served_at + notice_period_days", "BEGIN_WIND_DOWN requires state NOTICE_SERVED and sets the respondent's payment_posture to WIND_DOWN_ONLY", "CLOSE requires state WIND_DOWN, the logical clock >= wind_down_end_at (else ERR_NOTICE_PERIOD_NOT_ELAPSED) and outstanding_obligation_cents == 0 (else ERR_OBLIGATION_OUTSTANDING); it writes closed_at and moves the respondent to TERMINATED with payment_posture BLOCKED", "ABORT requires an abort_reason and a state before CLOSED; it returns the respondent to APPROVED or RESTRICTED with payment_posture SCREEN_ONLY", "increments RespondentBank.version by 1"]

  - method: POST
    path: "/correspondent-banking/closure-plans/{closurePlanId}/settlement-allocation"
    description: "Allocate a settlement amount across the respondent's expected corridors, or reverse the most recent allocation. The allocation lines are rounded per line and the residue lands entirely on the largest corridor, so ALLOCATE followed by REVERSE restores the obligation counters exactly."
    roles: [FIGRelationshipManager]
    code: 200
    input: ["action", "amount_cents"]
    output: ClosurePlan
    side_effects: ["requires state APPROVED, NOTICE_SERVED or WIND_DOWN", "calculations.settlement_allocation", "ALLOCATE: ERR_SETTLEMENT_EXCEEDS_OUTSTANDING when amount_cents > outstanding_obligation_cents", "REVERSE: ERR_NO_ALLOCATION_TO_REVERSE when allocation_round == 0 and ERR_REVERSAL_AMOUNT_MISMATCH when amount_cents != last_allocated_cents", "preserves outstanding_obligation_cents + settled_cents == original_obligation_cents after every call"]

  # ---------------- test-driving surface -----------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, cadence, window and SLA rule in this domain reads. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. The clock may be moved forward or backward."
    roles: [PlatformAdmin]
    code: 200
    input: ["current_utc"]
    output: null
    side_effects: ["replaces the logical clock value; performs no state transitions of its own, so overdue marking, lapsing and closure still require their explicit endpoints"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication and authorization ------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role missing, or X-User-Role not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_RESPONDENT_SCOPE_VIOLATION
    http: 403
    condition: "a RespondentContact addresses a resource that does not belong to the RespondentBank whose id equals its X-User-ID"

  # --- existence -----------------------------------------------------------
  - id: ERR_RESPONDENT_NOT_FOUND
    http: 404
    condition: "respondentId does not resolve to a RespondentBank"
  - id: ERR_JURISDICTION_PROFILE_NOT_FOUND
    http: 404
    condition: "jurisdictionProfileId does not resolve, or a jurisdiction_code carried in the body has no JurisdictionProfile"
  - id: ERR_BENEFICIAL_OWNER_NOT_FOUND
    http: 404
    condition: "beneficialOwnerId, or a body-supplied parent_owner_id, does not resolve to a BeneficialOwner"
  - id: ERR_QUESTIONNAIRE_NOT_FOUND
    http: 404
    condition: "questionnaireId does not resolve to a DueDiligenceQuestionnaire"
  - id: ERR_CONTROL_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "controlAssessmentId does not resolve to a ControlAssessment"
  - id: ERR_NESTED_RELATIONSHIP_NOT_FOUND
    http: 404
    condition: "nestedRelationshipId, or a body-supplied nested_relationship_id, does not resolve to a NestedRelationship"
  - id: ERR_MONITORING_PROFILE_NOT_FOUND
    http: 404
    condition: "monitoringProfileId does not resolve to a TransactionMonitoringProfile"
  - id: ERR_ACTIVITY_OBSERVATION_NOT_FOUND
    http: 404
    condition: "activityObservationId, or a body-supplied activity_observation_id, does not resolve to an ActivityObservation"
  - id: ERR_MONITORING_ALERT_NOT_FOUND
    http: 404
    condition: "monitoringAlertId, or a body-supplied monitoring_alert_id, does not resolve to a MonitoringAlert"
  - id: ERR_INFORMATION_REQUEST_NOT_FOUND
    http: 404
    condition: "informationRequestId does not resolve to an InformationRequest"
  - id: ERR_ADVERSE_MEDIA_EVENT_NOT_FOUND
    http: 404
    condition: "adverseMediaEventId does not resolve to an AdverseMediaEvent"
  - id: ERR_PERIODIC_REFRESH_NOT_FOUND
    http: 404
    condition: "periodicRefreshId does not resolve to a PeriodicRefresh"
  - id: ERR_PAYMENT_INSTRUCTION_NOT_FOUND
    http: 404
    condition: "paymentInstructionId does not resolve to a PaymentInstruction"
  - id: ERR_CLOSURE_PLAN_NOT_FOUND
    http: 404
    condition: "closurePlanId does not resolve to a ClosurePlan"

  # --- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST_BODY
    http: 400
    condition: "a required input field is absent or has the wrong JSON type"
  - id: ERR_INVALID_ENUM_VALUE
    http: 400
    condition: "an enum-typed field or an action discriminator carries a value outside its declared set"
  - id: ERR_FIELD_OUT_OF_RANGE
    http: 400
    condition: "a numeric field violates its declared bounds (ownership_pct, self_rating, assessed_rating, tolerance_pct, basel_aml_index, corridor_risk_weight, amount_usd, amount_cents, expected_corridors length)"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100, offset negative, or either not an integer"
  - id: ERR_INVALID_DATE_FORMAT
    http: 400
    condition: "an ISO-8601 instant, ISO-8601 date or YYYY-MM month value does not parse"

  # --- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_RESPONDENT_VERSION
    http: 412
    condition: "expected_respondent_version does not equal the addressed RespondentBank's current version — the client's view of the respondent was superseded by an earlier accepted write"

  # --- state preconditions -------------------------------------------------
  - id: ERR_INVALID_RESPONDENT_STATE
    http: 409
    condition: "the RespondentBank's dd_state does not permit the requested operation"
  - id: ERR_INVALID_QUESTIONNAIRE_STATE
    http: 409
    condition: "the DueDiligenceQuestionnaire's state does not permit submission, assessment, return or a new control-assessment row"
  - id: ERR_INVALID_OWNER_STATE
    http: 409
    condition: "the BeneficialOwner's verification_status does not permit the requested verification action"
  - id: ERR_INVALID_NESTED_STATE
    http: 409
    condition: "the NestedRelationship's state does not permit the requested adjudication action"
  - id: ERR_INVALID_MONITORING_PROFILE_STATE
    http: 409
    condition: "the TransactionMonitoringProfile's calibration_state does not permit the requested calibration action"
  - id: ERR_INVALID_ALERT_STATE
    http: 409
    condition: "the MonitoringAlert's state does not permit the requested disposition action"
  - id: ERR_INVALID_RFI_STATE
    http: 409
    condition: "the InformationRequest's state does not permit dispatch, response, overdue marking or adjudication"
  - id: ERR_INVALID_MEDIA_STATE
    http: 409
    condition: "the AdverseMediaEvent has already been CONFIRMED or DISMISSED"
  - id: ERR_INVALID_REFRESH_STATE
    http: 409
    condition: "the PeriodicRefresh's state does not permit the requested progression action"
  - id: ERR_INVALID_PAYMENT_STATE
    http: 409
    condition: "the PaymentInstruction's screening_state does not permit the requested decision"
  - id: ERR_INVALID_CLOSURE_STATE
    http: 409
    condition: "the ClosurePlan's state does not permit submission, approval, progression or settlement allocation"
  - id: ERR_ROUNDS_EXHAUSTED
    http: 409
    condition: "a questionnaire has already been returned for clarification three times, or an information request has already been declared insufficient twice"

  # --- business safety / regulatory ---------------------------------------
  - id: ERR_RESPONDENT_PAYMENT_POSTURE_BLOCKED
    http: 403
    condition: "a payment instruction is submitted, or a release attempted, while the respondent's payment_posture is BLOCKED (or SCREEN_ONLY for a release)"
  - id: ERR_RESPONDENT_RELATIONSHIP_CLOSED
    http: 403
    condition: "a write is attempted against a TERMINATED respondent, or against an EXITING respondent outside closure progression, payment screening and RFI handling"
  - id: ERR_SANCTIONED_PAYMENT_RELEASE_FORBIDDEN
    http: 403
    condition: "a release or rescreen is attempted on a PaymentInstruction whose screening_state is BLOCKED_SANCTIONS; only REJECT is permitted"
  - id: ERR_LICENSE_NOT_IN_GOOD_STANDING
    http: 422
    condition: "approval attempted while license_status is not ACTIVE or CONDITIONAL, regulator_standing is not GOOD_STANDING, or license_verified_at is null"
  - id: ERR_OWNERSHIP_CHAIN_INCOMPLETE
    http: 422
    condition: "approval attempted while ownership_verified is false — verified_ownership_pct below 75.00 or a verified direct legal entity at or above 25.00 with no verified child"
  - id: ERR_RATING_EXCEEDS_JURISDICTION_CEILING
    http: 422
    condition: "approval attempted with a risk_rating worse than the home jurisdiction's max_permitted_risk_rating, or with risk_rating UNRATED or PROHIBITED"
  - id: ERR_UNDISCLOSED_NESTING_OUTSTANDING
    http: 422
    condition: "approval, or widening payment_posture to OPEN, attempted while undisclosed_nested_count is greater than 0"
  - id: ERR_HOME_JURISDICTION_SANCTIONED
    http: 422
    condition: "a respondent is created, amended past PROSPECT or approved while its home jurisdiction is COMPREHENSIVELY_SANCTIONED"

  # --- nested prohibition ladder (evaluated in this order) -----------------
  - id: ERR_NESTED_CYCLE_DETECTED
    http: 422
    condition: "the nested chain would revisit a respondent already present in the chain"
  - id: ERR_NESTED_SANCTIONED_JURISDICTION
    http: 422
    condition: "the downstream jurisdiction is COMPREHENSIVELY_SANCTIONED"
  - id: ERR_NESTED_JURISDICTION_PROHIBITS_NESTING
    http: 422
    condition: "the downstream jurisdiction carries nested_correspondent_prohibited"
  - id: ERR_NESTED_DEPTH_EXCEEDED
    http: 422
    condition: "the relationship's computed depth reaches 3, or a declared chain would exceed depth 4"
  - id: ERR_PAYABLE_THROUGH_NOT_PERMITTED
    http: 422
    condition: "a PAYABLE_THROUGH relationship is confirmed for a respondent whose nested_activity_permitted is false"

  # --- business referential ------------------------------------------------
  - id: ERR_NESTED_DISCLOSURE_MISSING
    http: 422
    condition: "involves_nested_party is true but nested_relationship_id is absent, or references a relationship that is not DISCLOSED or CONFIRMED"
  - id: ERR_CROSS_RESPONDENT_REFERENCE
    http: 422
    condition: "a body-supplied parent_owner_id, monitoring_alert_id, activity_observation_id or nested_relationship_id belongs to a different respondent than the one addressed in the path"
  - id: ERR_CONTROL_DOMAINS_INCOMPLETE
    http: 422
    condition: "a questionnaire is submitted without a row for all eight control domains, or assessed under REFRESH_FINAL while a row is missing its assessed_rating"
  - id: ERR_MONITORING_PROFILE_SUPERSEDED
    http: 422
    condition: "an observation is posted against a SUPERSEDED monitoring profile"
  - id: ERR_REFRESH_NOT_REASSESSED
    http: 422
    condition: "a refresh cycle is completed without a REFRESH_FINAL risk assessment taken at or after the cycle's started_at"

  # --- ownership graph constraints ----------------------------------------
  - id: ERR_OWNERSHIP_CYCLE_DETECTED
    http: 422
    condition: "the supplied parent_owner_id has the node being created among its own ancestors"
  - id: ERR_OWNERSHIP_DEPTH_EXCEEDED
    http: 422
    condition: "the resulting ownership chain would be deeper than four levels"
  - id: ERR_OWNERSHIP_PCT_EXCEEDS_100
    http: 422
    condition: "the ownership percentages of the owners sharing one parent (or of the direct owners) would exceed 100.00"

  # --- uniqueness, overlap and segregation of duties ----------------------
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "a uniqueness constraint is violated: swift_bic, jurisdiction_code, (questionnaire_id, control_domain), a repeated corridor jurisdiction inside one profile, (monitoring_profile_id, period_month, corridor_jurisdiction_code), or a second open questionnaire for the respondent"
  - id: ERR_MONITORING_INTERVAL_OVERLAP
    http: 409
    condition: "a new monitoring profile's CLOSED effective interval touches or overlaps an existing profile of the same respondent — adjacency counts as overlap"
  - id: ERR_REFRESH_WINDOW_OVERLAP
    http: 409
    condition: "a new refresh cycle's HALF-OPEN window interior-overlaps a SCHEDULED or IN_PROGRESS cycle of the same respondent — adjacency is allowed"
  - id: ERR_CLOSURE_PLAN_ALREADY_OPEN
    http: 409
    condition: "the respondent already has a ClosurePlan in DRAFT, PENDING_APPROVAL, APPROVED, NOTICE_SERVED or WIND_DOWN"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting X-User-ID already performed the incompatible prior step: scored the respondent it is now approving, submitted the questionnaire it is now assessing, drafted the closure plan it is now approving, or adjudicated the information request raised from the alert it is now disposing"

  # --- temporal ------------------------------------------------------------
  - id: ERR_REFRESH_BUFFER_VIOLATION
    http: 422
    condition: "a refresh cycle's window_start falls within 30 days after a COMPLETED cycle's scheduled_due_date"
  - id: ERR_EFFECTIVE_INTERVAL_INVALID
    http: 422
    condition: "a monitoring profile's effective_to is not strictly after its effective_from"
  - id: ERR_EVENT_DATE_IN_FUTURE
    http: 422
    condition: "an adverse-media event_date is after the logical clock"
  - id: ERR_OBSERVATION_PERIOD_IN_FUTURE
    http: 422
    condition: "an observation's period_month is after the logical clock's calendar month"
  - id: ERR_RFI_NOT_YET_OVERDUE
    http: 422
    condition: "an information request is marked overdue while the logical clock is still before due_at, or escalated before the next 72-hour window has elapsed"
  - id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http: 422
    condition: "a closure plan is closed while the logical clock is still before wind_down_end_at"

  # --- fiscal --------------------------------------------------------------
  - id: ERR_WIND_DOWN_CAP_EXCEEDED
    http: 422
    condition: "releasing a payment during wind-down would push wind_down_released_usd past wind_down_cap_usd"
  - id: ERR_AGGREGATE_THRESHOLD_EXCEEDED
    http: 422
    condition: "the buffered aggregate monitoring threshold would exceed 500000000.00"
  - id: ERR_SETTLEMENT_EXCEEDS_OUTSTANDING
    http: 422
    condition: "an allocation's amount_cents is greater than the plan's outstanding_obligation_cents"
  - id: ERR_NO_ALLOCATION_TO_REVERSE
    http: 422
    condition: "a reversal is requested while allocation_round is 0"
  - id: ERR_REVERSAL_AMOUNT_MISMATCH
    http: 422
    condition: "a reversal's amount_cents does not equal the plan's last_allocated_cents"
  - id: ERR_INSUFFICIENT_ACTIVITY_HISTORY
    http: 422
    condition: "a CHRONOLOGICAL_ACTUAL wind-down cap is requested for a respondent with no ActivityObservation rows"
  - id: ERR_OBLIGATION_OUTSTANDING
    http: 422
    condition: "a closure plan is closed while outstanding_obligation_cents is greater than 0"

# =============================================================================
# §1.7 RBAC Matrix
# Role model: segregation_of_duties. The analyst that scores a respondent cannot
# approve it; the manager that drafts an exit cannot approve it; the officer
# that adjudicated an RFI cannot dispose of the alert it came from; the
# respondent itself can only ever supply and answer, never assess or decide.
# =============================================================================
roles:

  - name: RespondentContact
    description: "The respondent bank acting on its own file: completes the CDDQ, declares owners and nested relationships, answers information requests and submits payment instructions. Sees only its own data."
    identity: "entity_backed:RespondentBank"
    exclusive_operations:
      - "POST /correspondent-banking/questionnaires/{questionnaireId}/submission"
      - "POST /correspondent-banking/information-requests/{informationRequestId}/response"
    shared_operations:
      - "POST /correspondent-banking/respondents/{respondentId}/questionnaires (with ComplianceAnalyst)"
      - "POST /correspondent-banking/questionnaires/{questionnaireId}/control-assessments (self_rating only; with ComplianceAnalyst)"
      - "POST /correspondent-banking/respondents/{respondentId}/beneficial-owners (with ComplianceAnalyst)"
      - "POST /correspondent-banking/respondents/{respondentId}/nested-relationships (restricted to discovery_source QUESTIONNAIRE; with ComplianceAnalyst and SanctionsOfficer)"
      - "POST /correspondent-banking/respondents/{respondentId}/payment-instructions (with FIGRelationshipManager and PlatformAdmin)"
      - "every GET scoped to its own respondent id"

  - name: ComplianceAnalyst
    description: "Runs due diligence: verifies ownership and licensing, assesses the questionnaire, scores risk, adjudicates nested relationships, calibrates monitoring, raises and adjudicates information requests, triages adverse media and drives refresh cycles."
    identity: opaque
    exclusive_operations:
      - "POST /correspondent-banking/respondents/{respondentId}/risk-assessment"
      - "POST /correspondent-banking/beneficial-owners/{beneficialOwnerId}/verification"
      - "POST /correspondent-banking/questionnaires/{questionnaireId}/assessment-decision"
      - "PATCH /correspondent-banking/control-assessments/{controlAssessmentId}"
      - "POST /correspondent-banking/respondents/{respondentId}/monitoring-profiles"
      - "POST /correspondent-banking/monitoring-profiles/{monitoringProfileId}/calibration"
    shared_operations:
      - "POST /correspondent-banking/respondents/{respondentId}/licensing-verification (with PlatformAdmin)"
      - "POST /correspondent-banking/respondents/{respondentId}/restriction (with SanctionsOfficer)"
      - "POST /correspondent-banking/nested-relationships/{nestedRelationshipId}/adjudication (with SanctionsOfficer)"
      - "POST /correspondent-banking/monitoring-alerts/{monitoringAlertId}/disposition (with SanctionsOfficer)"
      - "POST /correspondent-banking/respondents/{respondentId}/information-requests, /dispatch and /adjudication (with SanctionsOfficer)"
      - "POST /correspondent-banking/information-requests/{informationRequestId}/overdue-marking (with PlatformAdmin)"
      - "POST /correspondent-banking/respondents/{respondentId}/adverse-media-events and /triage (with SanctionsOfficer)"
      - "POST /correspondent-banking/respondents/{respondentId}/periodic-refreshes and /progression (with PlatformAdmin)"
      - "POST /correspondent-banking/respondents/{respondentId}/closure-plans, /submission and /progression (with FIGRelationshipManager)"
      - "POST /correspondent-banking/monitoring-profiles/{monitoringProfileId}/observations (with PlatformAdmin)"
      - "all business GET endpoints"

  - name: SanctionsOfficer
    description: "Owns the sanctions and screening surface: maintains jurisdiction profiles, decides held and blocked payments, prohibits nested relationships and can restrict a relationship unilaterally."
    identity: opaque
    exclusive_operations:
      - "POST /correspondent-banking/payment-instructions/{paymentInstructionId}/screening-decision"
    shared_operations:
      - "POST /correspondent-banking/jurisdiction-profiles and PATCH /correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId} (with PlatformAdmin)"
      - "POST /correspondent-banking/respondents/{respondentId}/restriction (with ComplianceAnalyst)"
      - "POST /correspondent-banking/respondents/{respondentId}/nested-relationships and /adjudication (with ComplianceAnalyst)"
      - "POST /correspondent-banking/respondents/{respondentId}/monitoring-alerts and /disposition (with ComplianceAnalyst)"
      - "POST /correspondent-banking/respondents/{respondentId}/information-requests, /dispatch and /adjudication (with ComplianceAnalyst)"
      - "POST /correspondent-banking/respondents/{respondentId}/adverse-media-events and /triage (with ComplianceAnalyst)"
      - "all business GET endpoints"

  - name: FIGRelationshipManager
    description: "Commercial owner of the correspondent relationship: onboards respondents, maintains expected activity, submits payment instructions and drives orderly exits including settlement allocation."
    identity: opaque
    exclusive_operations:
      - "POST /correspondent-banking/closure-plans/{closurePlanId}/settlement-allocation"
    shared_operations:
      - "POST /correspondent-banking/respondents and PATCH /correspondent-banking/respondents/{respondentId} (with PlatformAdmin)"
      - "POST /correspondent-banking/respondents/{respondentId}/payment-instructions (with RespondentContact and PlatformAdmin)"
      - "POST /correspondent-banking/respondents/{respondentId}/closure-plans, /submission and /progression (with ComplianceAnalyst)"
      - "all business GET endpoints"

  - name: CommitteeApprover
    description: "The correspondent banking committee: the only role that can approve or decline a respondent relationship and the only role that can approve a closure plan. Performs no assessment work of its own, which is what makes the segregation-of-duties checks meaningful."
    identity: opaque
    exclusive_operations:
      - "POST /correspondent-banking/respondents/{respondentId}/approval"
      - "POST /correspondent-banking/closure-plans/{closurePlanId}/approval"
    shared_operations:
      - "all business GET endpoints"

  - name: PlatformAdmin
    description: "Operator of the platform: reference data, activity feeds, the periodic sweep and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /correspondent-banking/refresh-sweeps"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /correspondent-banking/jurisdiction-profiles and PATCH /correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId} (with SanctionsOfficer)"
      - "POST /correspondent-banking/respondents and PATCH /correspondent-banking/respondents/{respondentId} (with FIGRelationshipManager)"
      - "POST /correspondent-banking/respondents/{respondentId}/licensing-verification (with ComplianceAnalyst)"
      - "POST /correspondent-banking/monitoring-profiles/{monitoringProfileId}/observations (with ComplianceAnalyst)"
      - "POST /correspondent-banking/information-requests/{informationRequestId}/overdue-marking (with ComplianceAnalyst)"
      - "POST /correspondent-banking/respondents/{respondentId}/periodic-refreshes and /progression (with ComplianceAnalyst)"
      - "POST /correspondent-banking/respondents/{respondentId}/payment-instructions (with RespondentContact and FIGRelationshipManager)"
      - "all business GET endpoints"
