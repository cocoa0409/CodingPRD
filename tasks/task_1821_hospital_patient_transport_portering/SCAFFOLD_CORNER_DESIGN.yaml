  # ==================================================================
  # Section: validations
  # ==================================================================
  - section: validations
    instances:
      - name: offer_on_cancelled_request_state_beats_safety
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=7]"]
        distinguishing_aspect: "A cancelled CONTACT-isolation request offered to a non-isolation-certified transporter violates state AND safety; priority 6 returns ERR_INVALID_REQUEST_STATE, not the isolation error."
        test_recipe:
          setup: ["R1 (CONTACT, W4->IMG) cancelled while QUEUED; T2 ON_SHIFT without isolation certification; current request version fetched fresh"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T Two", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"] }, as: TransportSupervisor, captures: { t2: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t2}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t2}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t2}" }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY", isolation_precaution: "CONTACT" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id } }
            - { call: "POST /transport/requests/${r1}/close", payload: { action: "CANCEL", reason: "ORDER_WITHDRAWN" }, as: RequestingClinician, as_user_id: "clin-1" }
            - { call: "GET /transport/requests/${r1}", as: TransportDispatcher, captures: { r_v_now: $.data.version } }
          trigger:
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t2}", expected_request_version: "${r_v_now}" }, as: TransportDispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST_STATE (state priority 6 beats isolation safety priority 7; OCC passes because version is fresh)"

      - name: duplicate_active_request_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_ACTIVE_REQUEST]"]
        distinguishing_aspect: "Second request with the same patient_ref and destination while the first is QUEUED is rejected."
        test_recipe:
          setup: ["R1 (PX, W4->IMG) QUEUED"]
          setup_api_calls:
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "PX", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /transport/requests", payload: { patient_ref: "PX", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "URGENT", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_ACTIVE_REQUEST, http 409"

      - name: supersede_patient_mismatch_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_NOT_DUPLICATE]"]
        distinguishing_aspect: "SUPERSEDE requires the target to share patient_ref; two QUEUED requests for different patients cannot be consolidated."
        test_recipe:
          setup: ["R1 (PX, W4->IMG) QUEUED; R2 (PY, W4->IMG) QUEUED"]
          setup_api_calls:
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "PX", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "PY", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /transport/requests/${r1}/close", payload: { action: "SUPERSEDE", duplicate_of_id: "${r2}" }, as: TransportDispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_DUPLICATE, http 409"

      - name: schedule_in_past_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SCHEDULE_IN_PAST]"]
        distinguishing_aspect: "A scheduled_pickup_time before the logical clock is rejected at creation."
        test_recipe:
          setup: ["clock at 2026-08-01T00:00:00Z; locations W4, IMG"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
          trigger:
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY", scheduled_pickup_time: "2026-07-01T10:00:00Z" }, as: RequestingClinician, as_user_id: "clin-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SCHEDULE_IN_PAST, http 422"

      - name: travel_edge_duplicate_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_TRAVEL_EDGE_DUPLICATE]"]
        distinguishing_aspect: "TravelEdge (from,to) is unique; recreating the same directed pair fails."
        test_recipe:
          setup: ["Locations W4, IMG; edge W4->IMG exists"]
          setup_api_calls:
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
          trigger:
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 12, airborne_minutes: 18 }, as: TransportSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRAVEL_EDGE_DUPLICATE, http 409"

      - name: demand_curve_conflict_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DEMAND_CURVE_CONFLICT]"]
        distinguishing_aspect: "DemandCurve (day_type, hour_block, priority) is unique."
        test_recipe:
          setup: ["Row (WEEKDAY, 9, STAT) exists"]
          setup_api_calls:
            - { call: "POST /transport/demand-curves", payload: { day_type: "WEEKDAY", hour_block: 9, priority: "STAT", expected_requests: 2, mean_service_minutes: 30 }, as: TransportSupervisor }
          trigger:
            - { call: "POST /transport/demand-curves", payload: { day_type: "WEEKDAY", hour_block: 9, priority: "STAT", expected_requests: 5, mean_service_minutes: 25 }, as: TransportSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DEMAND_CURVE_CONFLICT, http 409"

      - name: adequacy_window_out_of_range_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "hour_block 22 with window_hours 3 exceeds the 24-hour grid and fails schema validation."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /transport/staffing/adequacy", payload: { date: "2026-08-03", hour_block: 22, window_hours: 3, variant: "FORECAST" }, as: TransportSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (22 + 3 > 24)"

