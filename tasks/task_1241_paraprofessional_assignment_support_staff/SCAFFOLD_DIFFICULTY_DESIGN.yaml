              captures: { mins_end: $.data.weekly_scheduled_minutes }
            - call: "GET /sped-staffing/absence-reports/${ab1}"
              as: Any
              captures: { ab_status: $.data.status }
          assert:
            - "after accept: Paraprofessional.${p2}.weekly_scheduled_minutes == 300"
            - "after accept: AbsenceReport.${ab1}.status == COVERED"
            - "after cancel: Paraprofessional.${p2}.weekly_scheduled_minutes == 0 (full compensation)"
            - "after cancel: AbsenceReport.${ab1}.status == BACKFILL_PENDING (re-opened)"
