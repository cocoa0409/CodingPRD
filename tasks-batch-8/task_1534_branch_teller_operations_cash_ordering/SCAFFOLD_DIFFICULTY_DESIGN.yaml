# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# branch-teller-operations
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: drawer_expected_strict_vs_lenient_with_instrument
        grounds:
          - calculations.expected_drawer_cash
          - entities.TellerDrawer.fields.expected_cash_cents
        distinguishing_aspect: |
          On the TellerDrawer domain, STRICT includes instrument-purchase cash
          (face + fee) while LENIENT excludes it: after a $3,000.00 cashier's
          check purchase with the $8.00 fee, STRICT expected cash exceeds
          LENIENT by exactly 300800 cents.
        test_recipe:
          setup:
            - "Branch B (vault 50000000, drawer limit 100000000, threshold 1000), teller T with an OPEN drawer for today, account A with balance 0"
            - "An approved ISSUE_INSTRUMENT TellerRequest for a CASHIERS_CHECK of 300000 cents, fee not waived, has been executed"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 100000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 0 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/drawers/${d_id}/teller-requests"
              payload: { type: "ISSUE_INSTRUMENT", params: { account_id: "${a_id}", instrument_type: "CASHIERS_CHECK", amount_cents: 300000, fee_waived: false } }
              as: Teller
              as_user_id: "${t_id}"
              captures: { r_id: $.data.id }
            - call: "POST /api/teller-requests/${r_id}/approve"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
          trigger:
            - call: "GET /api/drawers/${d_id}/expected-cash"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { strict_amt: $.data.expected_cash_cents }
            - call: "GET /api/drawers/${d_id}/expected-cash"
              payload: { variant: "LENIENT" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { lenient_amt: $.data.expected_cash_cents }
          assert:
            - "${strict_amt} == 300800"
            - "${lenient_amt} == 0"
            - "TellerDrawer.${d_id}.expected_cash_cents == 300800 (STRICT is the stored default)"

      - name: forecast_trailing_vs_weighted_divergence
        grounds:
          - calculations.forecast_cash_need
        distinguishing_aspect: |
          On the Branch/CashOrder domain, with 4 same-day-of-week samples the
          TRAILING variant uses the plain same-DOW mean (250000) while WEIGHTED
          always blends 70/30 (227500) — identical transaction history, two
          different forecast values.
        test_recipe:
          setup:
            - "Branch B with vault_cash_cents 50000000; teller T with drawer; account A funded with 100000000"
            - "Posted Monday cash sessions on 2026-08-03/10/17/24 with net outflows 260000, 200000, 240000, 300000"
            - "Other-DOW samples: Tue 2026-08-04 net 180000, Wed 2026-08-12 net 160000, Thu 2026-08-20 net 140000, Sat 2026-08-22 net 220000"
            - "Logical clock at 2026-08-28T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 100000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 100000000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            # --- Monday 2026-08-03: withdrawal 260000 ---
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d1: $.data.id }
            - call: "POST /api/drawers/${d1}/buy-from-vault"
              payload: { amount_cents: 1000000 }
              as: Teller
              as_user_id: "${t_id}"
            - call: "POST /api/drawers/${d1}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_WITHDRAWAL", amount_cents: 260000 }
              as: Teller
              as_user_id: "${t_id}"
            # --- Tuesday 2026-08-04: withdrawal 180000 ---
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "POST /api/drawers/${d1}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_WITHDRAWAL", amount_cents: 180000 }
              as: Teller
              as_user_id: "${t_id}"
            # --- Monday 2026-08-10: 200000 ---
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "POST /api/drawers/${d1}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_WITHDRAWAL", amount_cents: 200000 }
              as: Teller
              as_user_id: "${t_id}"
            # --- Wednesday 2026-08-12: 160000 ---
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "POST /api/drawers/${d1}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_WITHDRAWAL", amount_cents: 160000 }
              as: Teller
              as_user_id: "${t_id}"
            # --- Monday 2026-08-17: 240000 ---
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T00:00:00Z" }
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "POST /api/drawers/${d1}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_WITHDRAWAL", amount_cents: 240000 }
              as: Teller
              as_user_id: "${t_id}"
            # --- Thursday 2026-08-20: 140000 ---
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "POST /api/drawers/${d1}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_WITHDRAWAL", amount_cents: 140000 }
              as: Teller
              as_user_id: "${t_id}"
            # --- Saturday 2026-08-22: 220000 ---
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "POST /api/drawers/${d1}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_WITHDRAWAL", amount_cents: 220000 }
              as: Teller
              as_user_id: "${t_id}"
            # --- Monday 2026-08-24: 300000 ---
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-24T00:00:00Z" }
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "POST /api/drawers/${d1}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_WITHDRAWAL", amount_cents: 300000 }
              as: Teller
              as_user_id: "${t_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-28T00:00:00Z" }
              as: BranchManager
              as_user_id: "mgr-1"
          trigger:
            - call: "GET /api/branches/${b_id}/cash-forecast"
              payload: { delivery_date: "2026-08-31" }
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { proj: $.data.projected_need_cents, weighted: $.data.weighted_need_cents, sugg: $.data.suggested_order_cents }
          assert:
            - "${proj} == 250000"
            - "${weighted} == 227500"
            - "${sugg} == 0 (vault 50000000 covers the need)"

  - rule_id: combinatorial_formula
    instances:
      - name: instrument_fee_pinned_evaluation_order
        grounds:
          - calculations.instrument_fee
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the cash total received at the
          window includes the fee, but the fee is a flat per-instrument constant
          decided BEFORE the total — a $500.00 money order costs exactly
          50200 cents cash (fee 200), the account ledger is never debited, and
          fee_waived=true drops the fee to 0 without changing the face amount.
        test_recipe:
          setup:
            - "Branch B (vault 50000000, drawer limit 1000000, threshold 1000); teller T with OPEN drawer; account A balance 777000"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 777000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/drawers/${d_id}/teller-requests"
              payload: { type: "ISSUE_INSTRUMENT", params: { account_id: "${a_id}", instrument_type: "MONEY_ORDER", amount_cents: 50000, fee_waived: false } }
              as: Teller
              as_user_id: "${t_id}"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /api/teller-requests/${r_id}/approve"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
            - call: "GET /api/transactions"
              payload: { drawer_id: "${d_id}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { tx_fee: "$.data[0].fee_cents", tx_type: "$.data[0].type" }
            - call: "GET /api/accounts/${a_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_bal: $.data.balance_cents }
            - call: "GET /api/drawers/${d_id}/expected-cash"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { exp: $.data.expected_cash_cents }
          assert:
            - "${tx_type} == MONEY_ORDER_PURCHASE"
            - "${tx_fee} == 200"
            - "${exp} == 50200 (face 50000 + fee 200 received in cash)"
            - "${a_bal} == 777000 (account ledger untouched by a cash instrument purchase)"

      - name: cash_order_step_rounding_before_capacity_clamp
        grounds:
          - calculations.order_quantity
        distinguishing_aspect: |
          Mode (b) nested rounding: the request is floored to the 100000-cent
          step BEFORE the vault-capacity clamp, and the clamp is itself
          step-floored — a 1234567 request becomes exactly 1200000, and a
          vault with only 50000 cents of headroom clamps to 0 and is rejected
          (ERR_ORDER_BELOW_MINIMUM) rather than ordering 50000.
        test_recipe:
          setup:
            - "Branch B1 with vault_cash_cents 99950000 (50000 below the 100000000 capacity); branch B2 with vault 50000000"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B1", drawer_limit_cents: 1000000, vault_cash_cents: 99950000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b1_id: $.data.id, b1_ver: $.data.version }
            - call: "POST /api/branches"
              payload: { name: "B2", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b2_id: $.data.id, b2_ver: $.data.version }
          trigger:
            - call: "POST /api/branches/${b1_id}/cash-orders"
              payload: { delivery_date: "2026-08-03", expected_branch_version: "${b1_ver}", requested_amount_cents: 500000 }
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { err1: $.data.error_id }
            - call: "POST /api/branches/${b2_id}/cash-orders"
              payload: { delivery_date: "2026-08-03", expected_branch_version: "${b2_ver}", requested_amount_cents: 1234567 }
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { o2_ordered: $.data.ordered_amount_cents, o2_suggested: $.data.suggested_order_cents }
          assert:
            - "${err1} == ERR_ORDER_BELOW_MINIMUM"
            - "${o2_ordered} == 1200000 (floor(1234567/100000)*100000 — step rounding happens before the capacity clamp, which does not bind here)"
            - "${o2_suggested} == 0 (no history -> projected need 0; suggestion floored at 0)"

  - rule_id: non_linear_state_machine
    instances:
      - name: drawer_close_reopen_cycle_carries_cash
        grounds:
          - state_machines.TellerDrawer.CLOSED_to_OPEN
          - concurrency_rules[drawer-close-stale-drawer]
        distinguishing_aspect: |
          TellerDrawer's machine is cyclic (CLOSED -> OPEN on a later business
          date) and the cycle carries state: the new drawer's cash balance is
          the prior CLOSED drawer's counted cash, not zero.
        test_recipe:
          setup:
            - "Branch B; teller T; day 1 drawer opened, one 50000 cash deposit posted, counted 50000, attested BALANCED, closed"
            - "Logical clock advanced to the next business date"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 0 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d1: $.data.id }
            - call: "POST /api/drawers/${d1}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_DEPOSIT", amount_cents: 50000 }
              as: Teller
              as_user_id: "${t_id}"
            - call: "POST /api/drawers/${d1}/count"
              payload: { counted_cash_cents: 50000 }
              as: Teller
              as_user_id: "${t_id}"
            - call: "POST /api/drawers/${d1}/attest"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { d1_ver: $.data.version }
            - call: "POST /api/drawers/${d1}/close"
              payload: { expected_drawer_version: "${d1_ver}" }
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: BranchManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d2: $.data.id, d2_bal: $.data.cash_balance_cents, d2_date: $.data.business_date, d2_status: $.data.status }
          assert:
            - "${d2_status} == OPEN"
            - "${d2_bal} == 50000 (carry-forward of the prior CLOSED drawer's counted cash)"
            - "${d2_date} == 2026-08-02"
            - "TellerDrawer.${d1}.status == CLOSED (cycle: the same teller moved CLOSED -> OPEN across business dates)"

      - name: ctr_filing_amended_refiled_cycle
        grounds:
          - state_machines.CTRFiling.FILED_to_AMENDED
          - state_machines.CTRFiling.AMENDED_to_FILED
          - calculations.ctr_daily_aggregation
        distinguishing_aspect: |
          CTRFiling is cyclic: a void that drops same-day cash-in to the
          threshold or below flips FILED -> AMENDED, and a later deposit that
          pushes it back over flips AMENDED -> FILED with refreshed totals.
        test_recipe:
          setup:
            - "Branch B; teller T with OPEN drawer; account A balance 0"
            - "Deposits of 600000 and 500000 have filed a CTR (total 1100000 > 1000000)"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 0 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_DEPOSIT", amount_cents: 600000 }
              as: Teller
              as_user_id: "${t_id}"
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_DEPOSIT", amount_cents: 500000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { tx2: $.data.id }
          trigger:
            - call: "POST /api/transactions/${tx2}/void"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "GET /api/ctr-filings"
              payload: { account_id: "${a_id}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { f_status: "$.data[0].status", f_in: "$.data[0].total_cash_in_cents" }
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_DEPOSIT", amount_cents: 450000 }
              as: Teller
              as_user_id: "${t_id}"
            - call: "GET /api/ctr-filings"
              payload: { account_id: "${a_id}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { f2_status: "$.data[0].status", f2_in: "$.data[0].total_cash_in_cents", f2_dir: "$.data[0].trigger_direction" }
          assert:
            - "${f_status} == AMENDED (void dropped cash-in to 600000, at or below the 1000000 threshold)"
            - "${f_in} == 600000"
            - "${f2_status} == FILED (the 450000 deposit pushed cash-in back over)"
            - "${f2_in} == 1050000"
            - "${f2_dir} == CASH_IN"

  - rule_id: transitive_cascade
    instances:
      - name: attest_severe_variance_cascades_to_case_and_suspension
        grounds:
          - state_machines.TellerDrawer.COUNTING_to_OUT_OF_BALANCE
          - state_machines.Teller.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 chain from the attest trigger: the drawer's OUT_OF_BALANCE
          mutation (link 1) creates an OverShortCase because |variance| >=
          threshold (link 2), and that case — because |variance| >= 2x the
          threshold — suspends the teller (link 3). Each link is caused by the
          previous link, not by the attest directly.
        test_recipe:
          setup:
            - "Branch B (threshold 1000); teller T with OPEN drawer; one 50000 cash deposit posted (expected 50000)"
            - "Teller counts only 45000 — variance -5000, severe (>= 2x threshold)"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 0 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_DEPOSIT", amount_cents: 50000 }
              as: Teller
              as_user_id: "${t_id}"
            - call: "POST /api/drawers/${d_id}/count"
              payload: { counted_cash_cents: 45000 }
              as: Teller
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /api/drawers/${d_id}/attest"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { d_status: $.data.status, d_var: $.data.variance_cents }
            - call: "GET /api/over-short-cases"
              payload: { drawer_id: "${d_id}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { c_status: "$.data[0].status", c_var: "$.data[0].variance_cents" }
            - call: "GET /api/tellers/${t_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_status: $.data.status }
          assert:
            - "${d_status} == OUT_OF_BALANCE"
            - "${d_var} == -5000"
            - "${c_status} == OPEN"
            - "${c_var} == -5000"
            - "${t_status} == SUSPENDED (cascade link 3: severe variance auto-suspends the teller)"

      - name: void_instrument_purchase_amends_ctr
        grounds:
          - state_machines.TellerTransaction.POSTED_to_VOIDED
          - state_machines.CTRFiling.FILED_to_AMENDED
          - calculations.ctr_daily_aggregation
        distinguishing_aspect: |
          Depth-2 chain from the void trigger (a different trigger than the
          attest cascade): voiding the instrument transaction mutates the
          drawer/account ledgers (link 1), and that mutation drops same-day
          non-exempt cash-in at or below the CTR threshold, amending the
          FILED CTR (link 2).
        test_recipe:
          setup:
            - "Branch B; teller T with OPEN drawer; account A balance 0"
            - "A 600000 cash deposit plus an executed 500000 cashier's check purchase (fee 800) have filed a CTR (cash-in 1100000)"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 0 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_DEPOSIT", amount_cents: 600000 }
              as: Teller
              as_user_id: "${t_id}"
            - call: "POST /api/drawers/${d_id}/teller-requests"
              payload: { type: "ISSUE_INSTRUMENT", params: { account_id: "${a_id}", instrument_type: "CASHIERS_CHECK", amount_cents: 500000, fee_waived: false } }
              as: Teller
              as_user_id: "${t_id}"
              captures: { r_id: $.data.id }
            - call: "POST /api/teller-requests/${r_id}/approve"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "GET /api/transactions"
              payload: { drawer_id: "${d_id}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { cc_tx: "$.data[1].id" }
            - call: "GET /api/ctr-filings"
              payload: { account_id: "${a_id}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { pre_status: "$.data[0].status", pre_in: "$.data[0].total_cash_in_cents" }
          trigger:
            - call: "POST /api/transactions/${cc_tx}/void"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "GET /api/ctr-filings"
              payload: { account_id: "${a_id}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { f_status: "$.data[0].status", f_in: "$.data[0].total_cash_in_cents" }
            - call: "GET /api/drawers/${d_id}/expected-cash"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { exp: $.data.expected_cash_cents }
          assert:
            - "${pre_status} == FILED"
            - "${pre_in} == 1100000 (deposit 600000 + instrument face 500000; the 800 fee never counts)"
            - "${f_status} == AMENDED"
            - "${f_in} == 600000"
            - "${exp} == 600000 (drawer expected cash dropped by face+fee 500800 on the void)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_branch_reported_before_insufficient_funds
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_BRANCH_FROZEN]
          - errors[ERR_INSUFFICIENT_FUNDS]
        distinguishing_aspect: |
          business_safety (priority 5) vs business_fiscal (priority 9): a
          withdrawal on an audit-frozen branch whose account also lacks funds
          must report ERR_BRANCH_FROZEN, not ERR_INSUFFICIENT_FUNDS /
          ERR_INSUFFICIENT_DRAWER_CASH.
        test_recipe:
          setup:
            - "Branch B; teller T with OPEN drawer (cash 0); account A balance 100"
            - "A SURPRISE audit has frozen the branch"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 100 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/branches/${b_id}/audits"
              payload: { type: "SURPRISE" }
              as: Auditor
              as_user_id: "aud-1"
          trigger:
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_WITHDRAWAL", amount_cents: 50000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BRANCH_FROZEN (priority 5 safety beats priority 9 fiscal: the account's 100-cent balance and the drawer's empty cash would both fail fiscal checks)"

      - name: stale_drawer_state_reported_before_transaction_limit
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_TRANSACTION_OVER_LIMIT]
        distinguishing_aspect: |
          state (priority 4) vs business_fiscal (priority 9): a 600000-cent
          withdrawal (over the 500000 teller limit) against a drawer already
          in COUNTING must report ERR_INVALID_STATE, not
          ERR_TRANSACTION_OVER_LIMIT — a different error-category pair than
          frozen_branch_reported_before_insufficient_funds.
        test_recipe:
          setup:
            - "Branch B; teller T with drawer; account A balance 100000000; drawer funded with 1000000 from the vault"
            - "The drawer has been counted (status COUNTING)"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 100000000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/drawers/${d_id}/buy-from-vault"
              payload: { amount_cents: 999999 }
              as: Teller
              as_user_id: "${t_id}"
            - call: "POST /api/drawers/${d_id}/count"
              payload: { counted_cash_cents: 999999 }
              as: Teller
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_WITHDRAWAL", amount_cents: 600000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE (drawer is COUNTING; priority 4 state beats priority 9 over-limit)"

  - rule_id: boundary_precision_check
    instances:
      - name: ctr_threshold_exactly_vs_one_cent_over
        grounds:
          - calculations.ctr_daily_aggregation
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Metric: same-day non-exempt cash-in total; endpoint: POST
          transactions. The trigger is strictly-greater: exactly 1000000 cents
          files nothing, while 1000001 files a FILED CTR.
        test_recipe:
          setup:
            - "Branch B; teller T with OPEN drawer; account A balance 0"
            - "Deposits of 600000 and 400000 bring same-day cash-in to exactly 1000000"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
