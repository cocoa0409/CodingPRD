  - rule_id: transitive_cascade
    instances:

      - name: death_event_depth5_freeze_discontinue_void_deescalate
        grounds:
          - state_machines.Inmate.IN_CUSTODY_to_DECEASED
          - state_machines.MedicationOrder.ACTIVE_to_DISCONTINUED
          - state_machines.MedicationAdministration.SCHEDULED_to_VOIDED
          - calculations.mortality_review_due_at
          - entities.MedicationOrder.fields.escalated_to_prescriber
        distinguishing_aspect: |
          Depth-5 chain from the death event: DECEASED (L1) causes the records FREEZE (L2),
          the freeze causes the ACTIVE order to be DISCONTINUED (L3), the discontinuation
          causes the remaining SCHEDULED dose to be VOIDED (L4), and the voiding causes the
          prescriber escalation to be withdrawn - counters reset to 0 and
          escalated_to_prescriber set false (L5).
        test_recipe:
          setup:
            - "Logical clock advanced from 2026-05-01T00:00:00Z to 2026-05-03T08:00:00Z."
            - "One inmate with one ACTIVE DOT order carrying four scheduled doses."
            - "Three doses recorded MISSED in a row, so consecutive_missed_count is 3 and escalated_to_prescriber is true; the fourth dose is still SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "B-1080", full_name: "Jamie Kohl", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
