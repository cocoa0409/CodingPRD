              as: PricingAnalyst
              captures: { pl_ok: $.data.id }
            - call: "POST /brand-ops/pack-formats/${pack_id}/price-lists"
              payload: { channel: "AUTOMOTIVE", list_price_cents: 520, map_price_cents: 320, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", expected_pack_format_version: "${pack_v2}" }
