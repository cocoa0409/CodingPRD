      - 'POST /significant-change-requests as AgencyAuthorizingOfficial: HTTP 403 ERR_FORBIDDEN_ROLE — reported instead of
        the ERR_INVALID_STATE a non-AUTHORIZED offering would earn'
      - 'the same two writes as CspComplianceLead: HTTP 201 for the control implementation and HTTP 201 for the finding'
      - CloudServiceOffering.${offering_id}.version is unchanged by all seven refusals and equals 4 before the two accepted
        writes
