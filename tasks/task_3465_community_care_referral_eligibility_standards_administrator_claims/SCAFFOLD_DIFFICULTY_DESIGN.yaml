              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "RURAL", choice_requested: false, expected_veteran_version: "${v20_v}" }
              as: EligibilityClerk
              captures: { a20: $.data.id, a20_wait: $.data.wait_days, a20_fail: $.data.wait_standard_failed, a20_elig: $.data.eligible }
            - call: "POST /community-care/veterans/${v21}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "RURAL", choice_requested: false, expected_veteran_version: "${v21_v}" }
              as: EligibilityClerk
              captures: { a21: $.data.id, a21_wait: $.data.wait_days, a21_fail: $.data.wait_standard_failed, a21_elig: $.data.eligible }
          assert:
            - "Assessment.${a20}: wait_days == 20, wait_standard_failed == false (20 > 20 is false), eligible == false"
            - "Assessment.${a21}: wait_days == 21, wait_standard_failed == true (21 > 20), eligible == true"

