            - { call: "POST /sap/students", payload: { student_number: "S-2101", full_name: "Floor Within", program_id: "${prog}" }, as: Registrar, captures: { stu_a: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-2102", full_name: "Floor Over", program_id: "${prog}" }, as: Registrar, captures: { stu_b: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu_a}", term_id: "${t1}", attempted_credits: 100 }, as: Registrar, captures: { e_a1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e_a1}/post", payload: { earned_credits: 100, quality_points: 300.0, gpa_hours: 100 }, as: Registrar }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu_b}", term_id: "${t1}", attempted_credits: 100 }, as: Registrar, captures: { e_b1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e_b1}/post", payload: { earned_credits: 100, quality_points: 300.0, gpa_hours: 100 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu_a}", term_id: "${t2}", attempted_credits: 81 }, as: Registrar, captures: { e_a2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e_a2}/post", payload: { earned_credits: 21, quality_points: 63.0, gpa_hours: 81 }, as: Registrar }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu_b}", term_id: "${t2}", attempted_credits: 82 }, as: Registrar, captures: { e_b2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e_b2}/post", payload: { earned_credits: 22, quality_points: 66.0, gpa_hours: 82 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
          trigger:
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu_a}&term_id=${t2}", as: AidOfficer, captures: { a_maxtf: "$.data[0].max_tf_exceeded", a_head: "$.data[0].max_tf_headroom_credits", a_result: "$.data[0].result_standing" } }
            - { call: "GET /sap/evaluations?student_id=${stu_b}&term_id=${t2}", as: AidOfficer, captures: { b_maxtf: "$.data[0].max_tf_exceeded", b_head: "$.data[0].max_tf_headroom_credits", b_result: "$.data[0].result_standing", b_pace: "$.data[0].pace_pct" } }
          assert:
            - "A: max_tf_headroom_credits == 0 (181 - 181) and max_tf_exceeded == false (strict >: 181 + 0 > 181 is false)"
            - "A: result_standing == WARNING (pace 66.85 < 67.00; NOT suspended by max-TF)"
            - "B: max_tf_headroom_credits == -1 and max_tf_exceeded == true (182 > 181)"
            - "B: result_standing == SUSPENSION even though pace 67.03 passes (cap is floor(181.5) = 181; a round() cap of 182 would acquit B)"

