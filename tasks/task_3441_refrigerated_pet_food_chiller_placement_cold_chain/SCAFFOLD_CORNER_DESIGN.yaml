              captures: { ch1_serial: "$.data[0].serial_no" }
          trigger:
            - call: "POST /cold-chain/chillers"
              payload: { model: "COMPACT", serial_prefix: "DP", quantity: 2, serial_start_seq: 1 }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "GET /cold-chain/chillers"
              as: ProductionPlanner
          assert:
            - "first batch minted DP-0001"
            - "second batch (would mint DP-0001, DP-0002): http 409, error_id == ERR_SERIAL_NOT_UNIQUE"
            - "GET /chillers total_count == 1 (atomic rejection, no partial batch)"
