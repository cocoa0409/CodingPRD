        claim_type: conditional_action
        grounds:
          - endpoints[POST /habitat-conservation-plans/{id}/decision]
          - endpoints[POST /monitoring-reports/{id}/adjudication]
          - validations[priority=7]
          - validations[priority=9]
        distinguishing_aspect: >-
          Every action endpoint takes a small closed vocabulary — APPROVE /
          RETURN_FOR_REVISION, ACCEPT / REJECT, CHANGED / UNFORESEEN — and a value
          outside it is a 400, never a 409, even when the target row is ALSO in a
          state that would refuse the legal value. That ordering (priority 7 above
