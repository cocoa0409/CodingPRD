  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: voiding_a_placed_order_restores_the_batch_quantity_ledger_exactly
        grounds:
          - state_machines.Order.PLACED_to_VOIDED
          - state_machines.KitchenTicket.QUEUED_to_VOIDED
          - calculations.batch_qty_invariant
          - entities.ProductionBatch.fields.remaining_qty
          - entities.ProductionBatch.fields.reserved_qty
          - entities.Store.fields.hot_case_slots_used
        distinguishing_aspect: |
          The compensation must land on the RESERVED column, not the discard or sale column:
          baked_qty 40 = remaining 40 + reserved 0 + sold 0 + discarded 0 both before the placement and
          after the void, with remaining 28 / reserved 12 in between, and the batch status stays HOLDING
          while Store.hot_case_slots_used stays 1 throughout. An implementation that routes the released
          units through discarded_qty, or that lets the batch fall to SOLD_OUT / DISCARDED, satisfies the
          sum but breaks the column-by-column reconciliation.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T11:00:00Z, store in LUNCH with a PUBLISHED plan for 2026-08-01"
            - "one pretzel batch of 40 units HOLDING in slot 1 of BC-1, hot_case_slots_used 1"
            - "one anonymous TOUCHSCREEN order with a 12-unit pretzel line plus a coffee line, so a BEVERAGE ticket keeps the order in PLACED and the reservation alive"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
