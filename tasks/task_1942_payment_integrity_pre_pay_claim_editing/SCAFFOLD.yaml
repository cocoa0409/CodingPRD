scenario: |
  1942. Payment Integrity & Pre-Pay Claim Editing (health plan payment integrity): edit library (clinical/coding/policy) maintenance & versioning, pre-pay claim suspension & reviewer workflow, provider dispute & edit override tracking, savings measurement & false-positive rate, vendor edit comparison & duplication avoidance, high-dollar claim itemized bill review, DRG validation & readmission review, provider abrasion monitoring

domain_name: payment-integrity-editing
api_prefix: /payment-integrity
list_ordering: "All list endpoints return rows ordered by created_at ASC (earliest first) unless the endpoint states otherwise; no id-based ordering is used anywhere."

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: npi, type: string, source: input, description: "National Provider Identifier; free-text, no uniqueness constraint" }
      - { name: name, type: string, source: input, description: "Provider display name" }
      - { name: status, type: enum, source: input, description: "ACTIVE | TERMINATED; TERMINATED providers cannot pass claim screening", default: ACTIVE, constraints: "enum {ACTIVE, TERMINATED}" }

  - name: EditRule
    parent: null
    common_fields: true
    fields:
      - { name: edit_code, type: string, source: input, description: "Business code of the edit (e.g. 'MU-UNIT-01'); free-text" }
      - { name: category, type: enum, source: input, description: "Edit family", constraints: "enum {CLINICAL, CODING, POLICY}" }
      - { name: source, type: enum, source: input, description: "INTERNAL = plan-authored; VENDOR = externally supplied edit mirrored into the library", constraints: "enum {INTERNAL, VENDOR}" }
      - { name: description, type: string, source: input, description: "Human-readable rationale", default: "" }
      - { name: active_version_count, type: integer, source: computed, description: "Count of EditVersion rows of this rule with status ACTIVE; maintained on approve/retire/suspend/reactivate" }

  - name: EditVersion
    parent: EditRule
    common_fields: true
    fields:
      - { name: edit_rule_id, type: string, source: input, description: "FK -> EditRule.id; owning rule" }
      - { name: version_number, type: integer, source: system, description: "Sequential per rule, starts at 1, assigned at creation in created_at order" }
      - { name: severity, type: enum, source: input, description: "DENY = full line denial; SUSPEND = pend for reviewer; MONITOR = record only", constraints: "enum {DENY, SUSPEND, MONITOR}" }
      - { name: applies_to_claim_types, type: array, source: input, description: "Non-empty list of claim_type values the edit fires on", constraints: "each in {PROFESSIONAL, INSTITUTIONAL_INPATIENT, INSTITUTIONAL_OUTPATIENT}; min length 1" }
      - { name: logic_expression, type: string, source: input, description: "Opaque rule logic text; engine treats any eligible line as hit" }
      - { name: effective_from, type: datetime, source: input, description: "Window start (inclusive); half-open window [effective_from, effective_to)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end (exclusive); omitted/null = open-ended", default: null }
      - { name: status, type: enum, source: system, description: "Lifecycle state; see state machine", default: DRAFT, constraints: "enum {DRAFT, PENDING_APPROVAL, ACTIVE, SUSPENDED, RETIRED}" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the EditLibrarian who created the version; used for SoD" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the EditApprover who approved; null until approved", default: null }
      - { name: resolved_hits_count, type: integer, source: computed, description: "Count of EditHits pinned to this version with status in {CONFIRMED, RELEASED_FALSE_POSITIVE}" }
      - { name: fp_hits_count, type: integer, source: computed, description: "Count of EditHits pinned to this version with status RELEASED_FALSE_POSITIVE" }
      - { name: fp_rate, type: number, source: computed, description: "fp_hits_count / resolved_hits_count, 4 decimal places round_half_up; 0 when resolved_hits_count = 0" }

  - name: VendorEdit
    parent: null
    common_fields: true
    fields:
      - { name: vendor_name, type: string, source: input, description: "Vendor identifier string" }
      - { name: vendor_edit_key, type: string, source: input, description: "Vendor's own edit key" }
      - { name: description, type: string, source: input, description: "Vendor edit description", default: "" }
      - { name: mapped_edit_rule_id, type: string, source: input, description: "FK -> EditRule.id; internal rule this vendor edit duplicates/complements; null until mapped", default: null }
      - { name: comparison_status, type: enum, source: input, description: "Duplication verdict from vendor edit comparison", default: UNMAPPED, constraints: "enum {UNMAPPED, DUPLICATE, COMPLEMENTARY}" }
      - { name: conflict_policy, type: enum, source: system, description: "Attribution policy when both internal and vendor edit hit the same line; fixed INTERNAL_FIRST", default: INTERNAL_FIRST, constraints: "enum {INTERNAL_FIRST}" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: claim_number, type: string, source: input, description: "Provider-assigned claim number; free-text" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; submitting provider; must equal X-User-ID when role Provider" }
      - { name: member_id, type: string, source: input, description: "Member (patient) identifier string" }
      - { name: claim_type, type: enum, source: input, description: "Claim form type", constraints: "enum {PROFESSIONAL, INSTITUTIONAL_INPATIENT, INSTITUTIONAL_OUTPATIENT}" }
      - { name: total_billed_cents, type: integer, source: input, description: "Header billed total; must equal sum of line billed_cents at run-edits", constraints: ">= 1" }
      - { name: service_from, type: datetime, source: input, description: "Earliest service date" }
      - { name: service_to, type: datetime, source: input, description: "Latest service date; >= service_from" }
      - { name: admission_date, type: datetime, source: input, description: "Inpatient admission date; required iff claim_type == INSTITUTIONAL_INPATIENT", default: null }
      - { name: discharge_date, type: datetime, source: input, description: "Inpatient discharge date; required iff claim_type == INSTITUTIONAL_INPATIENT; >= admission_date", default: null }
      - { name: drg_code, type: string, source: input, description: "Provider-assigned DRG; required iff INSTITUTIONAL_INPATIENT; must be a key of DRG_WEIGHTS at run-edits", default: null }
      - { name: discharge_disposition, type: enum, source: input, description: "Discharge disposition; TRANSFER triggers per-diem proration", default: HOME, constraints: "enum {HOME, TRANSFER}" }
      - { name: status, type: enum, source: system, description: "Lifecycle state; see state machine", default: RECEIVED, constraints: "enum {RECEIVED, PENDED, DETERMINED, READY_TO_PAY, DENIED, PAID}" }
      - { name: initial_allowed_cents, type: integer, source: computed, description: "Baseline allowed set at run-edits: DRG payment for INSTITUTIONAL_INPATIENT, else total_billed_cents; updated on DRG_REASSIGNED" }
      - { name: allowed_amount_cents, type: integer, source: computed, description: "Current allowed = initial_allowed - denied + releases/adjustments; invariant: allowed_amount_cents + denied_amount_cents == initial_allowed_cents" }
      - { name: denied_amount_cents, type: integer, source: computed, description: "Current denied total from applied hits and adjustments" }
      - { name: high_dollar_flag, type: boolean, source: computed, description: "true iff total_billed_cents >= HIGH_DOLLAR_THRESHOLD_CENTS; computed at run-edits" }
      - { name: readmission_flag, type: boolean, source: computed, description: "true iff readmission detection matched a qualifying prior discharge; computed at run-edits" }
      - { name: determined_at, type: datetime, source: system, description: "Timestamp of entry into DETERMINED; dispute window anchor; null until determined", default: null }

  - name: ClaimLine
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; owning claim" }
      - { name: line_number, type: integer, source: input, description: "1-based line ordinal; unique within claim", constraints: ">= 1; unique per claim" }
      - { name: procedure_code, type: string, source: input, description: "CPT/HCPCS/revenue code string" }
      - { name: units, type: integer, source: input, description: "Service units", default: 1, constraints: ">= 1" }
      - { name: billed_cents, type: integer, source: input, description: "Line billed amount", constraints: ">= 1" }
      - { name: allowed_cents, type: integer, source: computed, description: "Line-level allowed after hit application/releases" }
      - { name: denied_cents, type: integer, source: computed, description: "Line-level denied from applied hits" }

  - name: EditHit
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; hit claim" }
      - { name: claim_line_id, type: string, source: input, description: "FK -> ClaimLine.id; line the edit fired on" }
      - { name: edit_version_id, type: string, source: input, description: "FK -> EditVersion.id; version PINNED at screening time; never re-pointed even if the version is later suspended/retired" }
      - { name: vendor_edit_id, type: string, source: input, description: "FK -> VendorEdit.id; set when the firing entry is a vendor-supplied edit; null for internal", default: null }
      - { name: status, type: enum, source: system, description: "Hit lifecycle", default: FIRED, constraints: "enum {FIRED, CONFIRMED, OVERRIDDEN, RELEASED_FALSE_POSITIVE, SUPERSEDED}" }
      - { name: applied, type: boolean, source: computed, description: "false when provider abrasion tier == HIGH at screening (monitor-only): hit recorded, no dollars denied, no ReviewTask created; otherwise true" }
      - { name: expected_savings_cents, type: integer, source: computed, description: "Full line billed_cents for DENY severity at fire time" }
      - { name: attributed_savings_cents, type: integer, source: computed, description: "Savings credited to this hit after internal-first waterfall attribution on the same line" }
      - { name: released_cents, type: integer, source: computed, description: "Amount returned to the provider via override/dispute/supersede; 0 while FIRED/CONFIRMED", default: 0 }
      - { name: confirmed_by_user_id, type: string, source: system, description: "X-User-ID of the reviewer whose UPHOLD decision confirmed the hit; used for dispute SoD", default: null }
      - { name: resolved_at, type: datetime, source: system, description: "Timestamp the hit left FIRED; null while FIRED", default: null }

  - name: ReviewTask
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; claim under review" }
      - { name: edit_hit_id, type: string, source: input, description: "FK -> EditHit.id; one task per applied hit" }
      - { name: status, type: enum, source: system, description: "Task lifecycle", default: PENDING, constraints: "enum {PENDING, IN_REVIEW, ESCALATED, DECIDED, CANCELLED}" }
      - { name: assigned_reviewer_user_id, type: string, source: system, description: "Assignee operator id; set by assign", default: null }
      - { name: requires_senior, type: boolean, source: system, description: "true once the task has been ESCALATED; decide then requires SeniorReviewer", default: false }
      - { name: outcome, type: enum, source: input, description: "Reviewer verdict; null until DECIDED", default: null, constraints: "enum {UPHOLD, OVERRIDE}" }
      - { name: decision_reason, type: string, source: input, description: "Free-text rationale", default: "" }

  - name: Dispute
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; disputed claim" }
      - { name: edit_hit_id, type: string, source: input, description: "FK -> EditHit.id; the CONFIRMED hit being disputed" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; disputing provider; must equal claim.provider_id and X-User-ID" }
      - { name: reason, type: string, source: input, description: "Provider dispute narrative" }
      - { name: status, type: enum, source: system, description: "Dispute lifecycle", default: SUBMITTED, constraints: "enum {SUBMITTED, UNDER_REVIEW, AWAITING_PROVIDER_INFO, DECIDED}" }
      - { name: outcome, type: enum, source: input, description: "Adjudication verdict; null until DECIDED", default: null, constraints: "enum {UPHELD, OVERTURNED, PARTIAL}" }
      - { name: released_cents, type: integer, source: input, description: "For PARTIAL: amount returned to provider; 0 < released_cents <= hit.attributed_savings_cents; ignored otherwise", default: 0 }
      - { name: submitted_at, type: datetime, source: system, description: "Creation timestamp; decision deadline anchor (submitted_at + 60 days)" }
      - { name: decided_at, type: datetime, source: system, description: "Decision timestamp; null until DECIDED", default: null }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of the DisputeAdjudicator who decided; SoD vs hit.confirmed_by_user_id", default: null }

  - name: ItemizedBillReview
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; reviewed claim" }
      - { name: provider_id, type: string, source: computed, description: "FK -> Provider.id; denormalized from claim at creation for occupancy checks" }
      - { name: status, type: enum, source: system, description: "IBR lifecycle", default: REQUESTED, constraints: "enum {REQUESTED, DOCUMENTS_RECEIVED, IN_AUDIT, COMPLETED, EXPIRED}" }
      - { name: requested_at, type: datetime, source: system, description: "Creation timestamp; occupancy interval start" }
      - { name: due_at, type: datetime, source: system, description: "requested_at + IBR_DOCUMENTS_DUE_DAYS (30); expire allowed only after this" }
      - { name: completed_at, type: datetime, source: system, description: "Completion timestamp; occupancy interval end = completed_at + IBR_OCCUPANCY_BUFFER_DAYS (14); null until COMPLETED", default: null }
      - { name: findings_cents, type: integer, source: input, description: "Auditor-identified improper amount recorded at complete; informational", constraints: ">= 0" }
      - { name: repriced_total_cents, type: integer, source: computed, description: "Contract reprice of all claim lines (per-line round then sum); set at complete" }
      - { name: auditor_user_id, type: string, source: system, description: "X-User-ID of the SeniorReviewer who completed the audit", default: null }

  - name: InpatientReview
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; inpatient claim under review" }
      - { name: review_type, type: enum, source: system, description: "DRG_VALIDATION (every inpatient claim) | READMISSION (flagged only)", constraints: "enum {DRG_VALIDATION, READMISSION}" }
      - { name: status, type: enum, source: system, description: "Review lifecycle", default: OPEN, constraints: "enum {OPEN, FINDINGS_RECORDED, DECIDED}" }
      - { name: provider_drg_code, type: string, source: system, description: "DRG copied from claim at creation" }
      - { name: audited_drg_code, type: string, source: input, description: "Auditor DRG; recorded via record-findings; must be a key of DRG_WEIGHTS when supplied", default: null }
      - { name: prior_claim_id, type: string, source: system, description: "FK -> Claim.id; the matched prior discharge claim for READMISSION reviews; null for DRG_VALIDATION", default: null }
      - { name: gap_days, type: integer, source: computed, description: "(admission_date - prior discharge_date) in days for READMISSION; null otherwise", default: null }
      - { name: outcome, type: enum, source: input, description: "Decision; null until DECIDED", default: null, constraints: "enum {NO_CHANGE, DRG_REASSIGNED, DENIED_READMISSION, PARTIAL_REDUCTION}" }
      - { name: payment_delta_cents, type: integer, source: computed, description: "Signed delta applied to claim.allowed_amount_cents at decide; negative reduces payment", default: 0 }

  - name: ProviderAbrasionProfile
    parent: Provider
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; 1:1 with Provider, auto-created at provider creation" }
      - { name: confirmed_count, type: integer, source: computed, description: "Hits on this provider's claims resolved CONFIRMED (trailing 90 days by resolved_at)", default: 0 }
      - { name: overridden_count, type: integer, source: computed, description: "Hits resolved OVERRIDDEN (trailing 90 days)", default: 0 }
      - { name: fp_count, type: integer, source: computed, description: "Hits resolved RELEASED_FALSE_POSITIVE (trailing 90 days)", default: 0 }
      - { name: superseded_count, type: integer, source: computed, description: "Hits resolved SUPERSEDED (trailing 90 days)", default: 0 }
      - { name: denied_cents_lifetime, type: integer, source: computed, description: "Lifetime sum of attributed_savings_cents over resolved hits", default: 0 }
      - { name: released_cents_lifetime, type: integer, source: computed, description: "Lifetime sum of released_cents over resolved hits", default: 0 }
      - { name: open_ibr_count, type: integer, source: computed, description: "ItemizedBillReviews of this provider in {REQUESTED, DOCUMENTS_RECEIVED, IN_AUDIT}", default: 0 }
      - { name: standard_index, type: number, source: computed, description: "round4(0.6 * overturn_rate + 0.4 * fp_rate) over trailing-90-day resolved hits; 0 when none resolved", default: 0 }
      - { name: regulatory_index, type: number, source: computed, description: "round4(released_cents_lifetime / max(1, denied_cents_lifetime)); lifetime, dollar-weighted", default: 0 }
      - { name: tier, type: enum, source: computed, description: "HIGH iff standard_index >= 0.50; MEDIUM iff >= 0.25; else LOW; keyed on standard_index ONLY", default: LOW, constraints: "enum {LOW, MEDIUM, HIGH}" }
      - { name: monitor_only, type: boolean, source: computed, description: "true iff tier == HIGH; new hits for this provider are applied=false", default: false }

  - name: SavingsPeriod
    parent: null
    common_fields: true
    fields:
      - { name: period_key, type: string, source: input, description: "Calendar month key 'YYYY-MM'; unique", constraints: "format YYYY-MM; unique" }
      - { name: status, type: enum, source: system, description: "Period lifecycle", default: OPEN, constraints: "enum {OPEN, RECONCILING, FINALIZED}" }
      - { name: provisional_savings_cents, type: integer, source: computed, description: "Sum of attributed_savings_cents over hits created in the period, ANY hit status (optimistic pipeline view); computed at finalize", default: 0 }
      - { name: finalized_savings_cents, type: integer, source: computed, description: "Sum over hits resolved in the period of (attributed - released); FIRED hits excluded; computed at finalize", default: 0 }
      - { name: pending_pipeline_cents, type: integer, source: computed, description: "Sum of attributed_savings_cents over hits still FIRED at finalize, created in the period; computed at finalize", default: 0 }
      - { name: reversed_cents, type: integer, source: computed, description: "Sum of released_cents over hits resolved in the period with status in {OVERRIDDEN, RELEASED_FALSE_POSITIVE, SUPERSEDED}; computed at finalize", default: 0 }
      - { name: finalized_at, type: datetime, source: system, description: "Finalize timestamp; null until FINALIZED", default: null }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: EditVersion
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /payment-integrity/edit-versions/{id}/submit"
        actor: EditLibrarian
        preconditions: ["version.status == DRAFT"]
        side_effects: ["status = PENDING_APPROVAL"]
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /payment-integrity/edit-versions/{id}/approve"
        actor: EditApprover
        preconditions:
          - "expected_edit_rule_version == EditRule.version (OCC)"
          - "X-User-ID != created_by_user_id (SoD author != approver)"
          - "if severity == DENY and applies_to_claim_types contains INSTITUTIONAL_INPATIENT then clinical_review_attestation == true"
          - "half-open window [effective_from, effective_to) does not overlap any other ACTIVE version of the same EditRule"
        side_effects:
          - "status = ACTIVE; approved_by_user_id = X-User-ID"
          - "EditRule.active_version_count recomputed; EditRule.version incremented by 1"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /payment-integrity/edit-versions/{id}/reject"
        actor: EditApprover
        preconditions: ["version.status == PENDING_APPROVAL"]
        side_effects: ["status = DRAFT"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /payment-integrity/edit-versions/{id}/suspend OR system auto-suspension when fp_rate >= FP_SUSPEND_THRESHOLD (0.25) with resolved_hits_count >= FP_MIN_SAMPLE (4), evaluated on every hit resolution and at SavingsPeriod finalize"
        actor: EditApprover | system
        preconditions: ["version.status == ACTIVE"]
        side_effects:
          - "status = SUSPENDED"
          - "every ReviewTask in {PENDING, IN_REVIEW} whose edit_hit is pinned to this version is CANCELLED, and each such EditHit becomes SUPERSEDED with released_cents = attributed_savings_cents, and each owning Claim is rebalanced (allowed += released, denied -= released) and re-evaluates its gate bubble-up"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /payment-integrity/edit-versions/{id}/reactivate"
        actor: EditApprover
        preconditions: ["version.status == SUSPENDED", "fp_rate < FP_SUSPEND_THRESHOLD (0.25)"]
        side_effects: ["status = ACTIVE"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /payment-integrity/edit-versions/{id}/retire"
        actor: EditApprover
        preconditions:
          - "version.status in {ACTIVE, SUSPENDED}"
          - "no EditHit pinned to this version has status == FIRED (ERR_EDIT_VERSION_IN_USE)"
        side_effects: ["status = RETIRED", "EditRule.active_version_count recomputed"]
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /payment-integrity/edit-versions/{id}/retire"
        actor: EditApprover
        preconditions:
          - "version.status in {ACTIVE, SUSPENDED}"
          - "no EditHit pinned to this version has status == FIRED"
        side_effects: ["status = RETIRED", "EditRule.active_version_count recomputed"]

  - entity: Claim
    initial_state: RECEIVED
    terminal_states: [PAID]
    transitions:
      - from: RECEIVED
        to: PENDED
        trigger: "POST /payment-integrity/claims/{id}/run-edits when screening produces any applied EditHit, any auto-created review, or high_dollar_flag == true"
        actor: PlanAdmin
        preconditions:
          - "claim.status == RECEIVED"
          - "claim has >= 1 ClaimLine (ERR_NO_CLAIM_LINES)"
          - "sum(ClaimLine.billed_cents) == total_billed_cents (ERR_LINE_AMOUNT_MISMATCH)"
          - "Provider.status == ACTIVE (ERR_PROVIDER_TERMINATED)"
          - "if INSTITUTIONAL_INPATIENT: drg_code is a key of DRG_WEIGHTS (ERR_DRG_CODE_UNKNOWN)"
        side_effects:
          - "initial_allowed_cents = drg_payment (inpatient) else total_billed_cents; allowed = initial_allowed; denied = 0"
          - "high_dollar_flag evaluated (>= 10,000,000 cents); if true an ItemizedBillReview is auto-created in REQUESTED (due_at = now + 30d), and that creation increments ProviderAbrasionProfile.open_ibr_count by 1"
          - "readmission detection runs for INSTITUTIONAL_INPATIENT; a match sets readmission_flag = true and auto-creates an InpatientReview(READMISSION) with prior_claim_id and gap_days"
          - "every INSTITUTIONAL_INPATIENT claim auto-creates an InpatientReview(DRG_VALIDATION)"
          - "edit engine fires one EditHit per eligible ACTIVE edit version per line; applied = (provider tier != HIGH); attributed_savings computed via internal-first waterfall; applied hits subtract attributed from claim.allowed/denied"
          - "one ReviewTask(PENDING) is auto-created per applied EditHit; ProviderAbrasionProfile counters are unchanged while hits are FIRED"
      - from: RECEIVED
        to: READY_TO_PAY
        trigger: "POST /payment-integrity/claims/{id}/run-edits when screening produces no applied hit, no review, and no high-dollar flag"
        actor: PlanAdmin
        preconditions: ["same as RECEIVED -> PENDED"]
        side_effects: ["initial_allowed/allowed/denied initialized as above; determined_at = now"]
      - from: PENDED
        to: DETERMINED
        trigger: "system bubble-up: the last non-terminal ReviewTask of the claim becomes DECIDED or CANCELLED"
        actor: system
        preconditions: ["all ReviewTasks of the claim in {DECIDED, CANCELLED}"]
        side_effects:
          - "status = DETERMINED; determined_at = now (if not already set)"
          - "immediate gate re-evaluation: if no ItemizedBillReview in {REQUESTED, DOCUMENTS_RECEIVED, IN_AUDIT} and no InpatientReview in {OPEN, FINDINGS_RECORDED}: -> READY_TO_PAY if allowed_amount_cents > 0 else -> DENIED"
      - from: DETERMINED
        to: READY_TO_PAY
        trigger: "system bubble-up: last open ItemizedBillReview reaches {COMPLETED, EXPIRED} or last open InpatientReview reaches DECIDED, with allowed_amount_cents > 0"
        actor: system
        preconditions: ["all gates terminal", "allowed_amount_cents > 0"]
        side_effects: ["status = READY_TO_PAY"]
      - from: DETERMINED
        to: DENIED
        trigger: "system bubble-up: gates all terminal with allowed_amount_cents == 0"
        actor: system
        preconditions: ["all gates terminal", "allowed_amount_cents == 0"]
        side_effects: ["status = DENIED"]
      - from: DENIED
        to: READY_TO_PAY
        trigger: "system compensation: a dispute OVERTURNED/PARTIAL or task OVERRIDE/supersede release raises allowed_amount_cents > 0 while all gates are terminal"
        actor: system
        preconditions: ["allowed_amount_cents > 0 after rebalance", "all gates terminal"]
        side_effects: ["status = READY_TO_PAY"]
      - from: READY_TO_PAY
        to: PENDED
        trigger: "system: a manual ItemizedBillReview is created on this claim"
        actor: SeniorReviewer
        preconditions: []
        side_effects: ["status = PENDED (gates reopened)"]
      - from: READY_TO_PAY
        to: PAID
        trigger: "POST /payment-integrity/claims/{id}/pay"
        actor: PlanAdmin
        preconditions: ["claim.status == READY_TO_PAY"]
        side_effects: ["status = PAID"]

  - entity: ReviewTask
    initial_state: PENDING
    terminal_states: [DECIDED, CANCELLED]
    transitions:
      - from: PENDING
        to: IN_REVIEW
        trigger: "POST /payment-integrity/review-tasks/{id}/assign"
        actor: SeniorReviewer
        preconditions:
          - "task.status in {PENDING, ESCALATED}"
          - "assignee's current IN_REVIEW task count < MAX_IN_REVIEW_TASKS (3) (ERR_REVIEWER_CAPACITY_EXCEEDED)"
          - "if task.status == ESCALATED then assignee_role == SeniorReviewer (ERR_SENIOR_REVIEW_REQUIRED)"
        side_effects: ["assigned_reviewer_user_id = reviewer_user_id", "status = IN_REVIEW"]
      - from: ESCALATED
        to: IN_REVIEW
        trigger: "POST /payment-integrity/review-tasks/{id}/assign"
        actor: SeniorReviewer
        preconditions: ["same as PENDING -> IN_REVIEW", "assignee_role must be SeniorReviewer"]
        side_effects: ["assigned_reviewer_user_id = reviewer_user_id", "status = IN_REVIEW"]
      - from: IN_REVIEW
        to: ESCALATED
        trigger: "POST /payment-integrity/review-tasks/{id}/escalate"
        actor: Reviewer | SeniorReviewer
        preconditions: ["task.status == IN_REVIEW", "X-User-ID == assigned_reviewer_user_id"]
        side_effects: ["status = ESCALATED", "requires_senior = true", "assigned_reviewer_user_id = null"]
      - from: IN_REVIEW
        to: DECIDED
        trigger: "POST /payment-integrity/review-tasks/{id}/decide"
        actor: Reviewer | SeniorReviewer
        preconditions:
          - "task.status == IN_REVIEW"
          - "X-User-ID == assigned_reviewer_user_id (ERR_NOT_RESOURCE_OWNER)"
          - "if requires_senior then caller role == SeniorReviewer (ERR_SENIOR_REVIEW_REQUIRED)"
        side_effects:
          - "outcome UPHOLD: hit -> CONFIRMED (confirmed_by_user_id = X-User-ID, resolved_at = now); claim amounts unchanged"
          - "outcome OVERRIDE: hit -> OVERRIDDEN with released_cents = attributed_savings_cents; claim.allowed += released, claim.denied -= released; line allowed/denied rebalanced"
          - "ProviderAbrasionProfile counters and indices recomputed for the resolved hit"
          - "claim bubble-up re-evaluation (PENDED -> DETERMINED -> READY_TO_PAY|DENIED)"
      - from: PENDING
        to: CANCELLED
        trigger: "system: pinned EditVersion auto/manual suspension cascade"
        actor: system
        preconditions: ["task.status in {PENDING, IN_REVIEW}"]
        side_effects: ["hit -> SUPERSEDED (released = attributed)", "claim rebalanced", "claim bubble-up re-evaluation"]
      - from: IN_REVIEW
        to: CANCELLED
        trigger: "system: pinned EditVersion suspension cascade"
        actor: system
        preconditions: ["task.status in {PENDING, IN_REVIEW}"]
        side_effects: ["hit -> SUPERSEDED (released = attributed)", "claim rebalanced", "claim bubble-up re-evaluation"]

  - entity: EditHit
    initial_state: FIRED
    terminal_states: [CONFIRMED, OVERRIDDEN, RELEASED_FALSE_POSITIVE, SUPERSEDED]
    transitions:
      - from: FIRED
        to: CONFIRMED
        trigger: "ReviewTask decide UPHOLD"
        actor: Reviewer | SeniorReviewer
        preconditions: ["hit.status == FIRED", "hit.applied == true"]
        side_effects: ["resolved_at = now", "confirmed_by_user_id set", "EditVersion.resolved_hits_count recomputed", "ProviderAbrasionProfile recomputed"]
      - from: FIRED
        to: OVERRIDDEN
        trigger: "ReviewTask decide OVERRIDE, or Dispute decide PARTIAL (released_cents < attributed)"
        actor: Reviewer | SeniorReviewer | DisputeAdjudicator
        preconditions: ["hit.status in {FIRED, CONFIRMED} depending on path: task override requires FIRED; dispute PARTIAL requires CONFIRMED"]
        side_effects: ["released_cents set", "claim and line rebalanced", "resolved_at = now", "abrasion recomputed"]
      - from: CONFIRMED
        to: OVERRIDDEN
        trigger: "Dispute decide PARTIAL"
        actor: DisputeAdjudicator
        preconditions: ["hit.status == CONFIRMED"]
        side_effects: ["released_cents = dispute.released_cents", "claim and line rebalanced", "abrasion recomputed"]
      - from: CONFIRMED
        to: RELEASED_FALSE_POSITIVE
        trigger: "Dispute decide OVERTURNED"
        actor: DisputeAdjudicator
        preconditions: ["hit.status == CONFIRMED"]
        side_effects:
          - "released_cents = attributed_savings_cents; claim.allowed += released, claim.denied -= released; line rebalanced"
          - "EditVersion.fp_hits_count += 1; resolved_hits_count recomputed; fp_rate recomputed; if fp_rate >= 0.25 and resolved_hits_count >= 4 and version status == ACTIVE then version auto -> SUSPENDED (cascade hop 2-3)"
          - "version suspension cancels open ReviewTasks pinned to it; those hits -> SUPERSEDED (cascade hop 4)"
          - "ProviderAbrasionProfile counters/indices/tier recomputed"
          - "claim bubble-up re-evaluation (DENIED -> READY_TO_PAY when allowed > 0 and gates terminal)"
      - from: FIRED
        to: SUPERSEDED
        trigger: "system: pinned EditVersion suspension cascade cancels its ReviewTask"
        actor: system
        preconditions: ["hit.status == FIRED"]
        side_effects: ["released_cents = attributed_savings_cents", "claim rebalanced", "resolved_at = now", "abrasion recomputed (superseded_count)"]

  - entity: Dispute
    initial_state: SUBMITTED
    terminal_states: [DECIDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /payment-integrity/disputes/{id}/start-review"
        actor: DisputeAdjudicator
        preconditions: ["dispute.status == SUBMITTED"]
        side_effects: ["status = UNDER_REVIEW"]
      - from: UNDER_REVIEW
        to: AWAITING_PROVIDER_INFO
        trigger: "POST /payment-integrity/disputes/{id}/request-info"
        actor: DisputeAdjudicator
        preconditions: ["dispute.status == UNDER_REVIEW"]
        side_effects: ["status = AWAITING_PROVIDER_INFO"]
      - from: AWAITING_PROVIDER_INFO
        to: UNDER_REVIEW
        trigger: "POST /payment-integrity/disputes/{id}/submit-info"
        actor: Provider
        preconditions: ["dispute.status == AWAITING_PROVIDER_INFO", "X-User-ID == dispute.provider_id"]
        side_effects: ["status = UNDER_REVIEW"]
      - from: UNDER_REVIEW
        to: DECIDED
        trigger: "POST /payment-integrity/disputes/{id}/decide"
        actor: DisputeAdjudicator
        preconditions:
          - "dispute.status == UNDER_REVIEW (ERR_DISPUTE_NOT_DECIDABLE)"
          - "X-User-ID != hit.confirmed_by_user_id (SoD, ERR_SOD_REVIEWER_ADJUDICATION)"
          - "now <= submitted_at + DECISION_DEADLINE_DAYS (60) (ERR_DECISION_DEADLINE_PASSED)"
          - "if outcome == PARTIAL: 0 < released_cents <= hit.attributed_savings_cents (ERR_INVALID_RELEASE_AMOUNT)"
        side_effects:
          - "UPHELD: no hit or amount changes"
          - "OVERTURNED: hit -> RELEASED_FALSE_POSITIVE (full release cascade; see EditHit machine)"
          - "PARTIAL: hit -> OVERRIDDEN with released_cents; claim rebalanced"
          - "decided_at = now; adjudicated_by_user_id = X-User-ID"

  - entity: ItemizedBillReview
    initial_state: REQUESTED
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: DOCUMENTS_RECEIVED
        trigger: "POST /payment-integrity/itemized-bill-reviews/{id}/receive-documents"
        actor: Provider
        preconditions: ["ibr.status == REQUESTED", "X-User-ID == ibr.provider_id"]
        side_effects: ["status = DOCUMENTS_RECEIVED"]
      - from: DOCUMENTS_RECEIVED
        to: IN_AUDIT
        trigger: "POST /payment-integrity/itemized-bill-reviews/{id}/start-audit"
        actor: SeniorReviewer
        preconditions: ["ibr.status == DOCUMENTS_RECEIVED"]
        side_effects: ["status = IN_AUDIT"]
      - from: IN_AUDIT
        to: COMPLETED
        trigger: "POST /payment-integrity/itemized-bill-reviews/{id}/complete"
        actor: SeniorReviewer
        preconditions: ["ibr.status == IN_AUDIT"]
        side_effects:
          - "repriced_total_cents = itemized reprice of claim lines (per-line round_half_up then sum)"
          - "claim.allowed_amount_cents adjusted by (claim.allowed - repriced_total_cents applied against current allowed; floor at 0); denied rebalanced so allowed + denied == initial_allowed holds after setting allowed = min(current allowed, repriced_total) and denied = initial_allowed - allowed"
          - "completed_at = now; auditor_user_id = X-User-ID; ProviderAbrasionProfile.open_ibr_count -= 1"
          - "claim bubble-up re-evaluation"
      - from: REQUESTED
        to: EXPIRED
        trigger: "POST /payment-integrity/itemized-bill-reviews/{id}/expire"
        actor: PlanAdmin
        preconditions: ["ibr.status == REQUESTED", "now > due_at (ERR_IBR_NOT_YET_EXPIRABLE)"]
        side_effects: ["status = EXPIRED", "ProviderAbrasionProfile.open_ibr_count -= 1", "claim bubble-up re-evaluation"]

  - entity: InpatientReview
    initial_state: OPEN
    terminal_states: [DECIDED]
    transitions:
      - from: OPEN
        to: FINDINGS_RECORDED
        trigger: "POST /payment-integrity/inpatient-reviews/{id}/record-findings"
        actor: SeniorReviewer
        preconditions: ["review.status == OPEN", "if audited_drg_code supplied it must be a key of DRG_WEIGHTS (ERR_DRG_CODE_UNKNOWN)"]
        side_effects: ["status = FINDINGS_RECORDED", "audited_drg_code stored when supplied"]
      - from: FINDINGS_RECORDED
        to: DECIDED
        trigger: "POST /payment-integrity/inpatient-reviews/{id}/decide"
        actor: SeniorReviewer
        preconditions:
          - "review.status == FINDINGS_RECORDED"
          - "DRG_REASSIGNED requires audited_drg_code != null and != provider_drg_code (ERR_INVALID_REQUEST)"
          - "DENIED_READMISSION requires review_type == READMISSION (ERR_INVALID_REQUEST)"
        side_effects:
          - "NO_CHANGE: payment_delta_cents = 0"
          - "DRG_REASSIGNED: recompute drg_payment with audited_drg_code; payment_delta_cents = new - old initial_allowed; claim.initial_allowed_cents = new; claim.allowed = max(0, allowed + delta); denied = initial_allowed - allowed"
          - "DENIED_READMISSION: payment_delta_cents = -allowed_amount_cents; claim.allowed = 0; denied = initial_allowed; claim re-evaluates to DENIED when gates terminal"
          - "PARTIAL_REDUCTION: requires audited_drg_code; payment_delta_cents = -round_half_up((drg_payment(provider_drg_code) - drg_payment(audited_drg_code)) / 2)"
          - "claim bubble-up re-evaluation"

  - entity: SavingsPeriod
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: RECONCILING
        trigger: "POST /payment-integrity/savings-periods/{id}/begin-reconciliation"
        actor: PlanAdmin
        preconditions: ["period.status == OPEN"]
        side_effects: ["status = RECONCILING"]
      - from: RECONCILING
        to: FINALIZED
        trigger: "POST /payment-integrity/savings-periods/{id}/finalize"
        actor: PlanAdmin
        preconditions: ["period.status == RECONCILING"]
        side_effects:
          - "compute provisional_savings_cents, finalized_savings_cents, pending_pipeline_cents, reversed_cents over hits with created_at/resolved_at in the period month"
          - "ops-run checkpoint: re-evaluate auto-suspension (fp_rate >= 0.25, sample >= 4) for every ACTIVE EditVersion"
          - "finalized_at = now"

# =============================================================================
# Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: edit-approve-stale-rule-version
    parent_entity: EditRule
    write_endpoint: "POST /payment-integrity/edit-versions/{id}/approve"
    occ_field: expected_edit_rule_version
    description: |
      Approving an EditVersion with an expected_edit_rule_version older than the
      EditRule's current version is rejected. Approving any version of the rule
      advances EditRule.version (the set of ACTIVE versions changes), so a client
      acting on a previously observed rule version holds a stale view of which
      windows are ACTIVE and must re-read before approving.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: dispute-create-stale-claim-version
    parent_entity: Claim
    write_endpoint: "POST /payment-integrity/claims/{id}/disputes"
    occ_field: expected_claim_version
    description: |
      Creating a Dispute against a Claim whose version has advanced since the
      client last observed it is rejected. Disputes target individual hits of a
      shared claim and each mutation (task decisions, other disputes, releases)
      advances Claim.version, so a stale-version create would adjudicate against
      dollar amounts the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: drg_base_payment
    trigger: "run-edits for INSTITUTIONAL_INPATIENT claims (initial_allowed) and InpatientReview decide DRG_REASSIGNED / PARTIAL_REDUCTION"
    algorithm: tiered_pricing
    formula: |
      LOS = (discharge_date - admission_date) in whole days
      base = round_half_up(BASE_RATE_CENTS * DRG_WEIGHTS[drg_code])
      outlier_addon = (LOS > OUTLIER_LOS_THRESHOLD)
                      ? min((LOS - OUTLIER_LOS_THRESHOLD) * OUTLIER_PER_DIEM_CENTS,
                            round_half_up(OUTLIER_CAP_PCT * base))
                      : 0
      gross = base + outlier_addon
      if discharge_disposition == TRANSFER:
          per_diem = round_half_up(base / MEAN_LOS[drg_code])
          payment = min(gross, LOS * per_diem)
      else:
          payment = gross
      Rounding order is pinned: round base first, then outlier cap, then per_diem; payment is an exact integer min.
    input_set: "the single claim being screened/decided; LOS, drg_code, discharge_disposition"
    constants:
      BASE_RATE_CENTS: 1000000
      DRG_WEIGHTS: { "470": 1.5, "193": 0.95, "392": 0.72 }
      MEAN_LOS: { "470": 5, "193": 4, "392": 3 }
      OUTLIER_LOS_THRESHOLD: 10
      OUTLIER_PER_DIEM_CENTS: 50000
      OUTLIER_CAP_PCT: 0.20
    precision: "integer cents; round_half_up at each pinned step"
    variants:
      - name: transfer_proration
        when: "discharge_disposition == TRANSFER"
        difference: "payment = min(gross, LOS * per_diem) instead of gross; identical inputs except disposition produce different payment"

  - name: itemized_reprice
    trigger: "ItemizedBillReview complete"
    algorithm: aggregation
    formula: |
      for each ClaimLine of the claim (any status of review):
          repriced_line_cents = round_half_up(billed_cents * (1 - CONTRACT_DISCOUNT))
      repriced_total_cents = sum(repriced_line_cents)
      PINNED ROUNDING ORDER: round per line first, then sum.
      (Sum-then-round of the same lines can differ by cents; the per-line order is authoritative.)
    input_set: "all ClaimLine rows of the reviewed claim"
    constants:
      CONTRACT_DISCOUNT: 0.065
    precision: "integer cents; per-line round_half_up then integer sum"

  - name: edit_savings_attribution
    trigger: "run-edits, per claim line, when >= 1 edit fires on the line"
    algorithm: waterfall_allocation
    formula: |
      hits with applied == false (monitor-only provider) are attributed 0 and excluded from the waterfall
      order the remaining hits on the line by: (edit source INTERNAL before VENDOR), then EditVersion.effective_from ASC, then EditHit.created_at ASC
      running = 0
      for each hit in that order:
          hit.attributed_savings_cents = min(hit.expected_savings_cents, max(0, line.billed_cents - running))
          running += hit.attributed_savings_cents
      effect: a vendor hit on a line already fully denied by an internal edit is attributed 0 — savings are never double-counted.
    input_set: "all EditHits created for one ClaimLine in this screening run"
    precision: "integer cents, no rounding"

  - name: savings_measurement
    trigger: "SavingsPeriod finalize"
    algorithm: aggregation
    formula: |
      let H = EditHits with created_at in the period month
      provisional_savings_cents = sum(h.attributed_savings_cents for h in H)                       # any status
      finalized_savings_cents   = sum(h.attributed_savings_cents - h.released_cents
                                      for h in H where h.status in {CONFIRMED, OVERRIDDEN, RELEASED_FALSE_POSITIVE, SUPERSEDED}
                                      and h.resolved_at in the period month)
      pending_pipeline_cents    = sum(h.attributed_savings_cents for h in H where h.status == FIRED at finalize time)
      reversed_cents            = sum(h.released_cents for h in H where h.status in {OVERRIDDEN, RELEASED_FALSE_POSITIVE, SUPERSEDED}
                                      and h.resolved_at in the period month)
      Invariant (pinned): for every hit, attributed == (attributed - released) + released, so
      provisional == finalized + pending_pipeline + reversed whenever all hits of H resolved inside the period.
    input_set: "EditHits by created_at month (provisional/pending) and resolved_at month (finalized/reversed)"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "pipeline/optimistic view"
        difference: "counts unresolved FIRED hits at full attributed value; ignores releases"
      - name: finalized
        when: "audited view"
        difference: "excludes FIRED hits entirely and nets out released_cents; identical hit population yields a smaller number whenever any hit is pending or released"

  - name: false_positive_rate
    trigger: "every EditHit resolution (CONFIRMED or RELEASED_FALSE_POSITIVE) pinned to the version, and SavingsPeriod finalize"
    algorithm: threshold
    formula: |
      resolved_hits_count = count of hits pinned to the version with status in {CONFIRMED, RELEASED_FALSE_POSITIVE}
      fp_hits_count       = count of those with status == RELEASED_FALSE_POSITIVE
      fp_rate             = round_half_up(fp_hits_count / resolved_hits_count, 4)   (0 when resolved == 0)
      auto-suspend when: fp_rate >= FP_SUSPEND_THRESHOLD AND resolved_hits_count >= FP_MIN_SAMPLE
      Boundary is INCLUSIVE: fp_rate exactly 0.2500 with sample >= 4 suspends.
    input_set: "EditHits pinned to the EditVersion, statuses {CONFIRMED, RELEASED_FALSE_POSITIVE} only (OVERRIDDEN and SUPERSEDED are excluded from the edit-quality rate)"
    constants:
      FP_SUSPEND_THRESHOLD: 0.25
      FP_MIN_SAMPLE: 4
    precision: "4 decimal places, round_half_up"

  - name: provider_abrasion_index
    trigger: "every EditHit resolution on a claim of the provider, and IBR open/close for open_ibr_count"
    algorithm: weighted_scoring
    formula: |
      let W = hits on this provider's claims with resolved_at in [now - 90 days, now]
      resolved = |W|; confirmed_c, overridden_c, fp_c, superseded_c = counts by status
      overturn_rate = (overridden_c + fp_c) / resolved          (0 when resolved == 0)
      fp_rate       = fp_c / resolved                            (0 when resolved == 0)
      standard_index  = round_half_up(0.6 * overturn_rate + 0.4 * fp_rate, 4)
      tier = HIGH iff standard_index >= 0.50; MEDIUM iff standard_index >= 0.25; else LOW
      monitor_only = (tier == HIGH)
    input_set: "resolved hits trailing 90 days (standard), lifetime dollars (regulatory variant)"
    constants:
      WEIGHT_OVERTURN: 0.6
      WEIGHT_FP: 0.4
      TIER_MEDIUM_MIN: 0.25
      TIER_HIGH_MIN: 0.50
    precision: "4 decimal places, round_half_up"
    variants:
      - name: regulatory
        when: "regulatory reporting view; never drives tier"
        difference: "round_half_up(released_cents_lifetime / max(1, denied_cents_lifetime), 4) — lifetime and dollar-weighted instead of 90-day and count-weighted; identical events produce a different index (e.g. 0.5000 vs 0.4000)"

  - name: readmission_detection
    trigger: "run-edits for INSTITUTIONAL_INPATIENT claims"
    algorithm: chronological
    formula: |
      candidates = other claims c' where c'.provider_id == claim.provider_id
                   AND c'.member_id == claim.member_id
                   AND c'.claim_type == INSTITUTIONAL_INPATIENT
                   AND c'.status in {READY_TO_PAY, DENIED, PAID}
                   AND c'.discharge_date <= claim.admission_date
      order candidates by discharge_date DESC, tie-break created_at ASC
      take the first candidate; gap_days = (claim.admission_date - c'.discharge_date) in whole days
      if 0 <= gap_days <= READMISSION_WINDOW_DAYS: readmission_flag = true and an
          InpatientReview(READMISSION, prior_claim_id = c'.id, gap_days) is created
      Boundary is INCLUSIVE: gap_days exactly 30 flags; 31 does not.
    input_set: "finalized inpatient claims of the same provider+member discharged on/before admission"
    constants:
      READMISSION_WINDOW_DAYS: 30
    precision: "whole days"

  - name: high_dollar_evaluation
    trigger: "run-edits, before edit engine"
    algorithm: threshold
    formula: |
      high_dollar_flag = (total_billed_cents >= HIGH_DOLLAR_THRESHOLD_CENTS)
      Boundary is INCLUSIVE: exactly 10,000,000 cents ($100,000.00) flags; 9,999,999 does not.
      When flagged, an ItemizedBillReview(REQUESTED, due_at = now + 30 days) is auto-created.
    input_set: "the claim header"
    constants:
      HIGH_DOLLAR_THRESHOLD_CENTS: 10000000
      IBR_DOCUMENTS_DUE_DAYS: 30
      IBR_OCCUPANCY_BUFFER_DAYS: 14
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "caller role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "ownership: Provider role acts only on own provider_id resources (claim create, line add, dispute create, submit-info, receive-documents); task decide/escalate require X-User-ID == assigned_reviewer_user_id", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "ownership-scoped endpoints" }
  - { priority: 4, category: business_constraint, check: "request schema: required fields present, types correct, no unknown fields", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: business_constraint, check: "enum fields carry a declared enum member", error_id: ERR_INVALID_ENUM, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "path and body references resolve left-to-right: provider, claim, edit rule, edit version, edit hit, review task, dispute, IBR, inpatient review, savings period, vendor edit", error_id: ERR_PROVIDER_NOT_FOUND, http_status: 404, applies_to: "endpoints with provider_id" }
  - { priority: 5, category: existence, check: "claim id resolves", error_id: ERR_CLAIM_NOT_FOUND, http_status: 404, applies_to: "claim-scoped endpoints" }
  - { priority: 5, category: existence, check: "edit rule id resolves", error_id: ERR_EDIT_RULE_NOT_FOUND, http_status: 404, applies_to: "edit-rule-scoped endpoints" }
  - { priority: 5, category: existence, check: "edit version id resolves", error_id: ERR_EDIT_VERSION_NOT_FOUND, http_status: 404, applies_to: "edit-version endpoints" }
  - { priority: 5, category: existence, check: "edit hit id resolves (body reference on dispute create)", error_id: ERR_EDIT_HIT_NOT_FOUND, http_status: 404, applies_to: "POST /payment-integrity/claims/{id}/disputes, GET hit endpoints" }
  - { priority: 5, category: existence, check: "review task id resolves", error_id: ERR_REVIEW_TASK_NOT_FOUND, http_status: 404, applies_to: "review-task endpoints" }
  - { priority: 5, category: existence, check: "dispute id resolves", error_id: ERR_DISPUTE_NOT_FOUND, http_status: 404, applies_to: "dispute endpoints" }
  - { priority: 5, category: existence, check: "itemized bill review id resolves", error_id: ERR_IBR_NOT_FOUND, http_status: 404, applies_to: "IBR endpoints" }
  - { priority: 5, category: existence, check: "inpatient review id resolves", error_id: ERR_INPATIENT_REVIEW_NOT_FOUND, http_status: 404, applies_to: "inpatient-review endpoints" }
  - { priority: 5, category: existence, check: "savings period id resolves", error_id: ERR_SAVINGS_PERIOD_NOT_FOUND, http_status: 404, applies_to: "savings-period endpoints" }
  - { priority: 5, category: existence, check: "vendor edit id resolves", error_id: ERR_VENDOR_EDIT_NOT_FOUND, http_status: 404, applies_to: "vendor-edit endpoints" }
  - { priority: 6, category: state, check: "OCC: expected_edit_rule_version == EditRule.version on approve; expected_claim_version == Claim.version on dispute create", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST approve, POST disputes" }
  - { priority: 7, category: state, check: "claim in correct state: run-edits requires RECEIVED; pay requires READY_TO_PAY; line add requires RECEIVED", error_id: ERR_CLAIM_NOT_SCREENABLE, http_status: 409, applies_to: "POST run-edits" }
  - { priority: 7, category: state, check: "pay requires READY_TO_PAY", error_id: ERR_CLAIM_NOT_PAYABLE, http_status: 409, applies_to: "POST pay" }
  - { priority: 7, category: state, check: "line add requires claim RECEIVED", error_id: ERR_CLAIM_LINES_LOCKED, http_status: 409, applies_to: "POST lines" }
  - { priority: 7, category: state, check: "edit version transition valid from current status (submit: DRAFT; approve/reject: PENDING_APPROVAL; suspend: ACTIVE; reactivate: SUSPENDED; retire: ACTIVE|SUSPENDED; terminal RETIRED accepts none)", error_id: ERR_EDIT_VERSION_NOT_APPROVABLE, http_status: 409, applies_to: "edit-version action endpoints" }
  - { priority: 7, category: state, check: "task assign requires PENDING|ESCALATED; decide/escalate require IN_REVIEW", error_id: ERR_REVIEW_TASK_NOT_DECIDABLE, http_status: 409, applies_to: "review-task action endpoints" }
  - { priority: 7, category: state, check: "dispute decide requires UNDER_REVIEW; request-info requires UNDER_REVIEW; submit-info requires AWAITING_PROVIDER_INFO; start-review requires SUBMITTED", error_id: ERR_DISPUTE_NOT_DECIDABLE, http_status: 409, applies_to: "dispute action endpoints" }
  - { priority: 7, category: state, check: "dispute create requires claim.status in {DETERMINED, READY_TO_PAY, DENIED, PAID} and hit.status == CONFIRMED", error_id: ERR_DISPUTE_NOT_OPEN, http_status: 409, applies_to: "POST disputes" }
  - { priority: 7, category: state, check: "IBR transitions valid from current status (receive-documents: REQUESTED; start-audit: DOCUMENTS_RECEIVED; complete: IN_AUDIT; expire: REQUESTED)", error_id: ERR_IBR_NOT_COMPLETABLE, http_status: 409, applies_to: "IBR action endpoints" }
  - { priority: 7, category: state, check: "inpatient review: record-findings requires OPEN; decide requires FINDINGS_RECORDED", error_id: ERR_INPATIENT_REVIEW_NOT_DECIDABLE, http_status: 409, applies_to: "inpatient-review action endpoints" }
  - { priority: 7, category: state, check: "begin-reconciliation requires OPEN; finalize requires RECONCILING", error_id: ERR_PERIOD_NOT_FINALIZABLE, http_status: 409, applies_to: "savings-period action endpoints" }
  - { priority: 8, category: business_safety, check: "approve of DENY edit applicable to INSTITUTIONAL_INPATIENT requires clinical_review_attestation == true", error_id: ERR_CLINICAL_ATTESTATION_REQUIRED, http_status: 422, applies_to: "POST approve" }
  - { priority: 8, category: business_safety, check: "segregation of duties: approver X-User-ID != EditVersion.created_by_user_id", error_id: ERR_SOD_AUTHOR_APPROVAL, http_status: 403, applies_to: "POST approve" }
  - { priority: 8, category: business_safety, check: "segregation of duties: dispute adjudicator X-User-ID != hit.confirmed_by_user_id", error_id: ERR_SOD_REVIEWER_ADJUDICATION, http_status: 403, applies_to: "POST dispute decide" }
  - { priority: 8, category: business_safety, check: "run-edits on a claim of a TERMINATED provider is blocked", error_id: ERR_PROVIDER_TERMINATED, http_status: 422, applies_to: "POST run-edits" }
  - { priority: 8, category: business_safety, check: "ESCALATED task assign requires assignee_role == SeniorReviewer; decide on requires_senior task requires SeniorReviewer role", error_id: ERR_SENIOR_REVIEW_REQUIRED, http_status: 403, applies_to: "review-task assign/decide" }
  - { priority: 9, category: business_constraint, check: "approve: half-open window [effective_from, effective_to) must not overlap any other ACTIVE version of the same EditRule; adjacency (effective_from == other.effective_to) is allowed", error_id: ERR_EDIT_WINDOW_OVERLAP, http_status: 409, applies_to: "POST approve" }
  - { priority: 9, category: business_constraint, check: "at most one non-DECIDED dispute per edit hit", error_id: ERR_DISPUTE_ALREADY_OPEN, http_status: 409, applies_to: "POST disputes" }
  - { priority: 9, category: business_constraint, check: "assignee IN_REVIEW task count < MAX_IN_REVIEW_TASKS (3)", error_id: ERR_REVIEWER_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST assign" }
  - { priority: 9, category: business_constraint, check: "period_key unique across SavingsPeriods", error_id: ERR_DUPLICATE_PERIOD_KEY, http_status: 409, applies_to: "POST savings-periods" }
  - { priority: 10, category: business_temporal, check: "dispute create: now <= claim.determined_at + DISPUTE_WINDOW_DAYS (45), inclusive", error_id: ERR_DISPUTE_WINDOW_EXPIRED, http_status: 422, applies_to: "POST disputes" }
  - { priority: 10, category: business_temporal, check: "dispute decide: now <= dispute.submitted_at + DECISION_DEADLINE_DAYS (60), inclusive", error_id: ERR_DECISION_DEADLINE_PASSED, http_status: 422, applies_to: "POST dispute decide" }
  - { priority: 10, category: business_temporal, check: "manual IBR create: provider has no other IBR whose occupancy interval [requested_at, completed_at + 14 days] (closed, buffered; open IBRs use now as interval end) contains now", error_id: ERR_PROVIDER_AUDIT_OVERLAP, http_status: 409, applies_to: "POST itemized-bill-reviews" }
  - { priority: 10, category: business_temporal, check: "IBR expire allowed only when now > due_at", error_id: ERR_IBR_NOT_YET_EXPIRABLE, http_status: 422, applies_to: "POST IBR expire" }
  - { priority: 11, category: business_referential, check: "retire requires no FIRED hits pinned to the version", error_id: ERR_EDIT_VERSION_IN_USE, http_status: 409, applies_to: "POST retire" }
  - { priority: 11, category: business_referential, check: "dispute edit_hit_id must belong to the path claim; IBR/inpatient review claim references consistent", error_id: ERR_HIT_NOT_ON_CLAIM, http_status: 422, applies_to: "POST disputes" }
  - { priority: 11, category: business_referential, check: "drg_code (claim screening) and audited_drg_code (record-findings) must be keys of DRG_WEIGHTS", error_id: ERR_DRG_CODE_UNKNOWN, http_status: 422, applies_to: "POST run-edits, POST record-findings" }
  - { priority: 12, category: business_fiscal, check: "run-edits: sum(line billed_cents) == total_billed_cents", error_id: ERR_LINE_AMOUNT_MISMATCH, http_status: 422, applies_to: "POST run-edits" }
  - { priority: 12, category: business_fiscal, check: "run-edits: at least one claim line", error_id: ERR_NO_CLAIM_LINES, http_status: 422, applies_to: "POST run-edits" }
  - { priority: 12, category: business_fiscal, check: "PARTIAL dispute: 0 < released_cents <= hit.attributed_savings_cents", error_id: ERR_INVALID_RELEASE_AMOUNT, http_status: 422, applies_to: "POST dispute decide" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Providers ---
  - { method: POST, path: "/payment-integrity/providers", description: "Create provider; auto-creates its ProviderAbrasionProfile", roles: [PlanAdmin], code: 201, input: [npi, name], output: Provider, side_effects: ["ProviderAbrasionProfile created with zeroed counters, tier LOW"] }
  - { method: GET, path: "/payment-integrity/providers", description: "List providers", roles: [Any], code: 200, input: ["status?"], output: "Provider[]", side_effects: [] }
  - { method: GET, path: "/payment-integrity/providers/{id}", description: "Get provider", roles: [Any], code: 200, input: [], output: Provider, side_effects: [] }
  - { method: PATCH, path: "/payment-integrity/providers/{id}", description: "Update provider status (ACTIVE/TERMINATED)", roles: [PlanAdmin], code: 200, input: [status], output: Provider, side_effects: [] }

  # --- Edit library ---
  - { method: POST, path: "/payment-integrity/edit-rules", description: "Create edit rule", roles: [EditLibrarian], code: 201, input: [edit_code, category, source, "description?"], output: EditRule, side_effects: ["active_version_count = 0"] }
  - { method: GET, path: "/payment-integrity/edit-rules", description: "List edit rules", roles: [Any], code: 200, input: ["category?", "source?"], output: "EditRule[]", side_effects: [] }
  - { method: GET, path: "/payment-integrity/edit-rules/{id}", description: "Get edit rule", roles: [Any], code: 200, input: [], output: EditRule, side_effects: [] }
  - { method: POST, path: "/payment-integrity/edit-rules/{ruleId}/versions", description: "Create edit version (DRAFT); does not bump EditRule.version", roles: [EditLibrarian], code: 201, input: [severity, applies_to_claim_types, logic_expression, effective_from, "effective_to?"], output: EditVersion, side_effects: ["created_by_user_id = X-User-ID", "version_number assigned"] }
  - { method: GET, path: "/payment-integrity/edit-rules/{ruleId}/versions", description: "List versions of a rule", roles: [Any], code: 200, input: [], output: "EditVersion[]", side_effects: [] }
  - { method: GET, path: "/payment-integrity/edit-versions/{id}", description: "Get edit version", roles: [Any], code: 200, input: [], output: EditVersion, side_effects: [] }
  - { method: GET, path: "/payment-integrity/edit-versions", description: "List edit versions across rules (filtered-list reverse reachability for EditVersion.edit_rule_id)", roles: [Any], code: 200, input: ["edit_rule_id?", "status?"], output: "EditVersion[]", side_effects: [] }
  - { method: POST, path: "/payment-integrity/edit-versions/{id}/submit", description: "DRAFT -> PENDING_APPROVAL", roles: [EditLibrarian], code: 200, input: [], output: EditVersion, side_effects: [] }
  - { method: POST, path: "/payment-integrity/edit-versions/{id}/approve", description: "PENDING_APPROVAL -> ACTIVE (OCC on EditRule.version, SoD, attestation, window overlap)", roles: [EditApprover], code: 200, input: [expected_edit_rule_version, "clinical_review_attestation?"], output: EditVersion, side_effects: ["increments EditRule.version by 1", "approved_by_user_id set", "EditRule.active_version_count recomputed"] }
  - { method: POST, path: "/payment-integrity/edit-versions/{id}/reject", description: "PENDING_APPROVAL -> DRAFT", roles: [EditApprover], code: 200, input: ["rejection_reason?"], output: EditVersion, side_effects: [] }
  - { method: POST, path: "/payment-integrity/edit-versions/{id}/suspend", description: "ACTIVE -> SUSPENDED (manual)", roles: [EditApprover], code: 200, input: ["note?"], output: EditVersion, side_effects: ["cancels open ReviewTasks pinned to this version; their hits -> SUPERSEDED with full release; claims rebalanced"] }
  - { method: POST, path: "/payment-integrity/edit-versions/{id}/reactivate", description: "SUSPENDED -> ACTIVE; requires fp_rate < 0.25", roles: [EditApprover], code: 200, input: [], output: EditVersion, side_effects: [] }
  - { method: POST, path: "/payment-integrity/edit-versions/{id}/retire", description: "ACTIVE|SUSPENDED -> RETIRED; blocked while FIRED hits reference it", roles: [EditApprover], code: 200, input: [], output: EditVersion, side_effects: ["EditRule.active_version_count recomputed"] }

  # --- Vendor edits ---
  - { method: POST, path: "/payment-integrity/vendor-edits", description: "Ingest a vendor edit", roles: [PlanAdmin], code: 201, input: [vendor_name, vendor_edit_key, "description?"], output: VendorEdit, side_effects: ["comparison_status = UNMAPPED"] }
  - { method: GET, path: "/payment-integrity/vendor-edits", description: "List vendor edits", roles: [Any], code: 200, input: ["vendor_name?", "comparison_status?", "mapped_edit_rule_id?"], output: "VendorEdit[]", side_effects: [] }
  - { method: GET, path: "/payment-integrity/vendor-edits/{id}", description: "Get vendor edit", roles: [Any], code: 200, input: [], output: VendorEdit, side_effects: [] }
  - { method: POST, path: "/payment-integrity/vendor-edits/{id}/map", description: "Map vendor edit to an internal EditRule with comparison verdict", roles: [PaymentIntegrityAnalyst], code: 200, input: [edit_rule_id, comparison_status], output: VendorEdit, side_effects: [] }

  # --- Claims ---
  - { method: POST, path: "/payment-integrity/claims", description: "Submit claim (provider_id must equal X-User-ID)", roles: [Provider], code: 201, input: [claim_number, provider_id, member_id, claim_type, total_billed_cents, service_from, service_to, "admission_date?", "discharge_date?", "drg_code?", "discharge_disposition?"], output: Claim, side_effects: ["status = RECEIVED"] }
  - { method: GET, path: "/payment-integrity/claims", description: "List claims", roles: [Any], code: 200, input: ["provider_id?", "status?", "member_id?"], output: "Claim[]", side_effects: [] }
  - { method: GET, path: "/payment-integrity/claims/{id}", description: "Get claim", roles: [Any], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: POST, path: "/payment-integrity/claims/{id}/lines", description: "Add claim line (claim must be RECEIVED; caller must own claim)", roles: [Provider], code: 201, input: [line_number, procedure_code, billed_cents, "units?"], output: ClaimLine, side_effects: ["line allowed/denied initialized on run-edits"] }
  - { method: GET, path: "/payment-integrity/claims/{id}/lines", description: "List claim lines", roles: [Any], code: 200, input: [], output: "ClaimLine[]", side_effects: [] }
  - { method: GET, path: "/payment-integrity/claims/{id}/edit-hits", description: "List edit hits of a claim", roles: [Any], code: 200, input: [], output: "EditHit[]", side_effects: [] }
  - { method: POST, path: "/payment-integrity/claims/{id}/run-edits", description: "Screen claim: DRG payment, readmission detection, high-dollar eval, edit engine, task creation", roles: [PlanAdmin], code: 200, input: [], output: Claim, side_effects: ["see Claim state machine RECEIVED -> PENDED/READY_TO_PAY", "increments Claim.version by 1"] }
  - { method: POST, path: "/payment-integrity/claims/{id}/pay", description: "READY_TO_PAY -> PAID", roles: [PlanAdmin], code: 200, input: [], output: Claim, side_effects: ["increments Claim.version by 1"] }

  # --- Edit hits ---
  - { method: GET, path: "/payment-integrity/edit-hits", description: "List edit hits (multi-FK filtered list)", roles: [Any], code: 200, input: ["claim_line_id?", "edit_version_id?", "vendor_edit_id?", "status?"], output: "EditHit[]", side_effects: [] }
  - { method: GET, path: "/payment-integrity/edit-hits/{id}", description: "Get edit hit", roles: [Any], code: 200, input: [], output: EditHit, side_effects: [] }

  # --- Review tasks ---
  - { method: GET, path: "/payment-integrity/review-tasks", description: "List review tasks", roles: [Any], code: 200, input: ["claim_id?", "edit_hit_id?", "assigned_reviewer_user_id?", "status?"], output: "ReviewTask[]", side_effects: [] }
  - { method: GET, path: "/payment-integrity/review-tasks/{id}", description: "Get review task", roles: [Any], code: 200, input: [], output: ReviewTask, side_effects: [] }
  - { method: POST, path: "/payment-integrity/review-tasks/{id}/assign", description: "Assign task -> IN_REVIEW; capacity and seniority checks", roles: [SeniorReviewer], code: 200, input: [reviewer_user_id, "assignee_role?"], output: ReviewTask, side_effects: [] }
  - { method: POST, path: "/payment-integrity/review-tasks/{id}/decide", description: "UPHOLD confirms hit; OVERRIDE releases hit and rebalances claim", roles: [Reviewer, SeniorReviewer], code: 200, input: [outcome, "decision_reason?"], output: ReviewTask, side_effects: ["hit resolution cascades: abrasion recompute, claim rebalance, claim bubble-up", "increments Claim.version by 1"] }
  - { method: POST, path: "/payment-integrity/review-tasks/{id}/escalate", description: "IN_REVIEW -> ESCALATED; requires senior reassignment", roles: [Reviewer, SeniorReviewer], code: 200, input: ["reason?"], output: ReviewTask, side_effects: ["requires_senior = true"] }

  # --- Disputes ---
  - { method: POST, path: "/payment-integrity/claims/{id}/disputes", description: "Open dispute on a CONFIRMED hit (OCC on Claim.version; 45-day window)", roles: [Provider], code: 201, input: [edit_hit_id, reason, expected_claim_version], output: Dispute, side_effects: ["increments Claim.version by 1", "submitted_at = now"] }
  - { method: GET, path: "/payment-integrity/disputes", description: "List disputes", roles: [Any], code: 200, input: ["claim_id?", "edit_hit_id?", "provider_id?", "status?"], output: "Dispute[]", side_effects: [] }
  - { method: GET, path: "/payment-integrity/disputes/{id}", description: "Get dispute", roles: [Any], code: 200, input: [], output: Dispute, side_effects: [] }
  - { method: POST, path: "/payment-integrity/disputes/{id}/start-review", description: "SUBMITTED -> UNDER_REVIEW", roles: [DisputeAdjudicator], code: 200, input: [], output: Dispute, side_effects: [] }
  - { method: POST, path: "/payment-integrity/disputes/{id}/request-info", description: "UNDER_REVIEW -> AWAITING_PROVIDER_INFO", roles: [DisputeAdjudicator], code: 200, input: ["info_request_note?"], output: Dispute, side_effects: [] }
  - { method: POST, path: "/payment-integrity/disputes/{id}/submit-info", description: "AWAITING_PROVIDER_INFO -> UNDER_REVIEW (provider owner only)", roles: [Provider], code: 200, input: ["info_response?"], output: Dispute, side_effects: [] }
  - { method: POST, path: "/payment-integrity/disputes/{id}/decide", description: "UPHELD | OVERTURNED | PARTIAL; overturn cascade releases hit as false positive and may auto-suspend the edit version", roles: [DisputeAdjudicator], code: 200, input: [outcome, "released_cents?", "decision_note?"], output: Dispute, side_effects: ["EditHit resolution cascade (see EditHit/Claim machines)", "increments Claim.version by 1"] }

  # --- Itemized bill reviews ---
  - { method: POST, path: "/payment-integrity/claims/{id}/itemized-bill-reviews", description: "Manual IBR on a screened claim; provider occupancy (closed interval + 14d buffer) enforced", roles: [SeniorReviewer], code: 201, input: [], output: ItemizedBillReview, side_effects: ["claim READY_TO_PAY -> PENDED", "ProviderAbrasionProfile.open_ibr_count += 1", "requested_at = now, due_at = now + 30d"] }
  - { method: GET, path: "/payment-integrity/itemized-bill-reviews", description: "List IBRs", roles: [Any], code: 200, input: ["claim_id?", "provider_id?", "status?"], output: "ItemizedBillReview[]", side_effects: [] }
  - { method: GET, path: "/payment-integrity/itemized-bill-reviews/{id}", description: "Get IBR", roles: [Any], code: 200, input: [], output: ItemizedBillReview, side_effects: [] }
  - { method: POST, path: "/payment-integrity/itemized-bill-reviews/{id}/receive-documents", description: "REQUESTED -> DOCUMENTS_RECEIVED (provider owner)", roles: [Provider], code: 200, input: [], output: ItemizedBillReview, side_effects: [] }
  - { method: POST, path: "/payment-integrity/itemized-bill-reviews/{id}/start-audit", description: "DOCUMENTS_RECEIVED -> IN_AUDIT", roles: [SeniorReviewer], code: 200, input: [], output: ItemizedBillReview, side_effects: [] }
  - { method: POST, path: "/payment-integrity/itemized-bill-reviews/{id}/complete", description: "IN_AUDIT -> COMPLETED; reprices claim and rebalances allowed/denied", roles: [SeniorReviewer], code: 200, input: [findings_cents], output: ItemizedBillReview, side_effects: ["itemized_reprice applied", "open_ibr_count -= 1", "claim bubble-up", "increments Claim.version by 1"] }
  - { method: POST, path: "/payment-integrity/itemized-bill-reviews/{id}/expire", description: "REQUESTED -> EXPIRED once past due_at", roles: [PlanAdmin], code: 200, input: [], output: ItemizedBillReview, side_effects: ["open_ibr_count -= 1", "claim bubble-up"] }

  # --- Inpatient reviews ---
  - { method: GET, path: "/payment-integrity/inpatient-reviews", description: "List inpatient reviews", roles: [Any], code: 200, input: ["claim_id?", "prior_claim_id?", "review_type?", "status?"], output: "InpatientReview[]", side_effects: [] }
  - { method: GET, path: "/payment-integrity/inpatient-reviews/{id}", description: "Get inpatient review", roles: [Any], code: 200, input: [], output: InpatientReview, side_effects: [] }
  - { method: POST, path: "/payment-integrity/inpatient-reviews/{id}/record-findings", description: "OPEN -> FINDINGS_RECORDED; optional audited DRG", roles: [SeniorReviewer], code: 200, input: ["audited_drg_code?", "findings_note?"], output: InpatientReview, side_effects: [] }
  - { method: POST, path: "/payment-integrity/inpatient-reviews/{id}/decide", description: "FINDINGS_RECORDED -> DECIDED; applies DRG reassignment or readmission denial to claim", roles: [SeniorReviewer], code: 200, input: [outcome, "decision_note?"], output: InpatientReview, side_effects: ["payment_delta applied to claim", "claim bubble-up", "increments Claim.version by 1"] }

  # --- Abrasion profiles ---
  - { method: GET, path: "/payment-integrity/abrasion-profiles", description: "List abrasion profiles", roles: [Any], code: 200, input: ["provider_id?"], output: "ProviderAbrasionProfile[]", side_effects: [] }
  - { method: GET, path: "/payment-integrity/abrasion-profiles/{id}", description: "Get abrasion profile", roles: [Any], code: 200, input: [], output: ProviderAbrasionProfile, side_effects: [] }

  # --- Savings periods ---
  - { method: POST, path: "/payment-integrity/savings-periods", description: "Create savings period (unique period_key)", roles: [PlanAdmin], code: 201, input: [period_key], output: SavingsPeriod, side_effects: [] }
  - { method: GET, path: "/payment-integrity/savings-periods", description: "List savings periods", roles: [Any], code: 200, input: ["status?"], output: "SavingsPeriod[]", side_effects: [] }
  - { method: GET, path: "/payment-integrity/savings-periods/{id}", description: "Get savings period", roles: [Any], code: 200, input: [], output: SavingsPeriod, side_effects: [] }
  - { method: POST, path: "/payment-integrity/savings-periods/{id}/begin-reconciliation", description: "OPEN -> RECONCILING", roles: [PlanAdmin], code: 200, input: [], output: SavingsPeriod, side_effects: [] }
  - { method: POST, path: "/payment-integrity/savings-periods/{id}/finalize", description: "RECONCILING -> FINALIZED; computes savings variants and runs edit auto-suspension checkpoint", roles: [PlanAdmin], code: 200, input: [], output: SavingsPeriod, side_effects: ["savings_measurement", "false_positive_rate checkpoint suspensions"] }

  # --- Test-driving clock ---
  - { method: POST, "path": "/payment-integrity/_clock/set_current_utc", description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [PlanAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock updated"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "role not in endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity-backed caller does not own the target resource; or reviewer decides/escalates a task not assigned to them" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, type mismatch, or unknown field in payload" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "enum field carries an undeclared member" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "provider reference does not resolve" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "claim reference does not resolve" }
  - { id: ERR_EDIT_RULE_NOT_FOUND, http: 404, condition: "edit rule reference does not resolve" }
  - { id: ERR_EDIT_VERSION_NOT_FOUND, http: 404, condition: "edit version reference does not resolve" }
  - { id: ERR_EDIT_HIT_NOT_FOUND, http: 404, condition: "edit hit reference does not resolve" }
  - { id: ERR_REVIEW_TASK_NOT_FOUND, http: 404, condition: "review task reference does not resolve" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "dispute reference does not resolve" }
  - { id: ERR_IBR_NOT_FOUND, http: 404, condition: "itemized bill review reference does not resolve" }
  - { id: ERR_INPATIENT_REVIEW_NOT_FOUND, http: 404, condition: "inpatient review reference does not resolve" }
  - { id: ERR_SAVINGS_PERIOD_NOT_FOUND, http: 404, condition: "savings period reference does not resolve" }
  - { id: ERR_VENDOR_EDIT_NOT_FOUND, http: 404, condition: "vendor edit reference does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_edit_rule_version != EditRule.version on approve; expected_claim_version != Claim.version on dispute create" }
  - { id: ERR_CLAIM_NOT_SCREENABLE, http: 409, condition: "run-edits on a claim not in RECEIVED" }
  - { id: ERR_CLAIM_NOT_PAYABLE, http: 409, condition: "pay on a claim not in READY_TO_PAY" }
  - { id: ERR_CLAIM_LINES_LOCKED, http: 409, condition: "line add on a claim not in RECEIVED" }
  - { id: ERR_EDIT_VERSION_NOT_APPROVABLE, http: 409, condition: "edit-version action invalid from current status (incl. any action on RETIRED)" }
  - { id: ERR_REVIEW_TASK_NOT_DECIDABLE, http: 409, condition: "task action invalid from current status (decide/escalate require IN_REVIEW; assign requires PENDING|ESCALATED)" }
  - { id: ERR_DISPUTE_NOT_DECIDABLE, http: 409, condition: "dispute action invalid from current status (decide requires UNDER_REVIEW)" }
  - { id: ERR_DISPUTE_NOT_OPEN, http: 409, condition: "dispute create while claim not finalized (not in {DETERMINED, READY_TO_PAY, DENIED, PAID}) or hit not CONFIRMED" }
  - { id: ERR_IBR_NOT_COMPLETABLE, http: 409, condition: "IBR action invalid from current status" }
  - { id: ERR_INPATIENT_REVIEW_NOT_DECIDABLE, http: 409, condition: "inpatient review action invalid from current status" }
  - { id: ERR_PERIOD_NOT_FINALIZABLE, http: 409, condition: "begin-reconciliation requires OPEN; finalize requires RECONCILING" }
  - { id: ERR_CLINICAL_ATTESTATION_REQUIRED, http: 422, condition: "approving a DENY edit applicable to INSTITUTIONAL_INPATIENT without clinical_review_attestation == true" }
  - { id: ERR_SOD_AUTHOR_APPROVAL, http: 403, condition: "approver X-User-ID equals EditVersion.created_by_user_id" }
  - { id: ERR_SOD_REVIEWER_ADJUDICATION, http: 403, condition: "dispute adjudicator X-User-ID equals hit.confirmed_by_user_id" }
  - { id: ERR_PROVIDER_TERMINATED, http: 422, condition: "run-edits on a claim whose provider is TERMINATED" }
  - { id: ERR_SENIOR_REVIEW_REQUIRED, http: 403, condition: "ESCALATED task assigned to non-senior assignee, or requires_senior task decided by non-SeniorReviewer" }
  - { id: ERR_EDIT_WINDOW_OVERLAP, http: 409, condition: "approve would create overlapping half-open windows among ACTIVE versions of the same rule" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "a non-DECIDED dispute already exists for the same edit hit" }
  - { id: ERR_REVIEWER_CAPACITY_EXCEEDED, http: 409, condition: "assignee already holds MAX_IN_REVIEW_TASKS (3) IN_REVIEW tasks" }
  - { id: ERR_DUPLICATE_PERIOD_KEY, http: 409, condition: "savings period with the same period_key exists" }
  - { id: ERR_DISPUTE_WINDOW_EXPIRED, http: 422, condition: "now > claim.determined_at + 45 days at dispute create" }
  - { id: ERR_DECISION_DEADLINE_PASSED, http: 422, condition: "now > dispute.submitted_at + 60 days at dispute decide" }
  - { id: ERR_PROVIDER_AUDIT_OVERLAP, http: 409, condition: "manual IBR collides with the provider's existing occupancy interval (requested_at .. completed_at + 14d, closed)" }
  - { id: ERR_IBR_NOT_YET_EXPIRABLE, http: 422, condition: "expire attempted at or before due_at" }
  - { id: ERR_EDIT_VERSION_IN_USE, http: 409, condition: "retire while FIRED hits are pinned to the version" }
  - { id: ERR_HIT_NOT_ON_CLAIM, http: 422, condition: "dispute edit_hit_id does not belong to the path claim" }
  - { id: ERR_DRG_CODE_UNKNOWN, http: 422, condition: "drg_code/audited_drg_code not a key of DRG_WEIGHTS" }
  - { id: ERR_LINE_AMOUNT_MISMATCH, http: 422, condition: "sum of line billed_cents != total_billed_cents at run-edits" }
  - { id: ERR_NO_CLAIM_LINES, http: 422, condition: "run-edits with zero claim lines" }
  - { id: ERR_INVALID_RELEASE_AMOUNT, http: 422, condition: "PARTIAL dispute released_cents out of (0, attributed_savings_cents]" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: Provider
    description: "Network provider submitting claims, disputing denials, supplying itemized bills and dispute info"
    identity: "entity_backed:Provider"
    exclusive_operations: ["create claim", "add claim line", "create dispute", "dispute submit-info", "IBR receive-documents"]
    shared_operations: ["read endpoints (role Any)"]
  - name: PlanAdmin
    description: "Health plan operator running screening, payment, savings periods, vendor ingestion, provider administration, clock"
    identity: opaque
    exclusive_operations: ["create/patch provider", "run-edits", "pay claim", "create vendor edit", "savings period lifecycle", "IBR expire", "set clock"]
    shared_operations: ["read endpoints (role Any)"]
  - name: EditLibrarian
    description: "Maintains the edit library; authors edit versions and submits them for approval"
    identity: opaque
    exclusive_operations: ["create edit rule", "create edit version", "submit edit version"]
    shared_operations: ["read endpoints (role Any)"]
  - name: EditApprover
    description: "Approves/rejects/suspends/reactivates/retires edit versions; SoD: may not approve a version they authored"
    identity: opaque
    exclusive_operations: ["approve edit version", "reject edit version", "suspend edit version", "reactivate edit version", "retire edit version"]
    shared_operations: ["read endpoints (role Any)"]
  - name: Reviewer
    description: "Pre-pay claim reviewer; decides assigned non-escalated review tasks"
    identity: opaque
    exclusive_operations: ["decide assigned task (non-escalated)", "escalate assigned task"]
    shared_operations: ["read endpoints (role Any)"]
  - name: SeniorReviewer
    description: "Senior reviewer; assigns tasks, decides escalated tasks, runs itemized bill audits and inpatient reviews"
    identity: opaque
    exclusive_operations: ["assign review task", "decide escalated task", "manual IBR create", "IBR start-audit/complete", "inpatient review record-findings/decide"]
    shared_operations: ["decide assigned task", "escalate assigned task", "read endpoints (role Any)"]
  - name: DisputeAdjudicator
    description: "Adjudicates provider disputes; SoD: may not decide a dispute on a hit they confirmed as reviewer"
    identity: opaque
    exclusive_operations: ["dispute start-review", "dispute request-info", "dispute decide"]
    shared_operations: ["read endpoints (role Any)"]
  - name: PaymentIntegrityAnalyst
    description: "Payment integrity analytics; maps vendor edits against the internal library for duplication avoidance"
    identity: opaque
    exclusive_operations: ["vendor edit map"]
    shared_operations: ["read endpoints (role Any)"]
