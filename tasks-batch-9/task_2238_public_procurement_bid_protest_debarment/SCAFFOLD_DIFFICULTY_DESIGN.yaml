  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cancelled_solicitation_state_error_precedes_untimely_protest_temporal_error
        grounds:
          - validations[priority=11]
          - validations[priority=31]
          - errors[ERR_SOLICITATION_NOT_PROTESTABLE]
          - errors[ERR_PROTEST_UNTIMELY]
        distinguishing_aspect: |
          Error-category pair is (state, business_temporal): the request violates
          priority 11 ERR_SOLICITATION_NOT_PROTESTABLE and priority 31
          ERR_PROTEST_UNTIMELY at once, and the state category must win with HTTP 409
          ERR_SOLICITATION_NOT_PROTESTABLE.
        test_recipe:
          setup:
            - "logical clock starts at its default 2026-08-01T00:00:00Z"
            - "one Vendor V10 with protest_fee_balance_cents 100000"
            - "one Solicitation S7 with estimated_value_cents 10000000, no addenda, issued by U-OFFICER-1, original_bid_due_utc 2026-08-27T00:00:00Z"
            - "V10 submitted Bid B10 at total_price_cents 5000000, so S7 could be opened; bids_opened_at_utc is 2026-08-27T00:00:00Z, making the EVALUATION_ERROR deadline 2026-09-03T00:00:00Z"
            - "B10 determined RESPONSIVE, moving S7 to EVALUATION; S7 then cancelled, so S7.status is CANCELLED and B10 is NONRESPONSIVE (V10 still has standing_basis ACTUAL_BIDDER)"
            - "the clock is moved to 2026-09-10T00:00:00Z, strictly past the EVALUATION_ERROR deadline, so both violations hold at once"
