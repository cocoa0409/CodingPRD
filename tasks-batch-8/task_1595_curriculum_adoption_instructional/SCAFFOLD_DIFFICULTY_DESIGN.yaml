            - call: "GET /materials/${mat_id}/inventory-lots"
              as: WarehouseManager
              captures: { oh_ship: "$.data[0].on_hand_units", tr_ship: "$.data[0].in_transit_units", dl_ship: "$.data[0].delivered_units", tot_ship: "$.data[0].total_received_units" }
            - call: "POST /distribution-orders/${do1}/transitions"
