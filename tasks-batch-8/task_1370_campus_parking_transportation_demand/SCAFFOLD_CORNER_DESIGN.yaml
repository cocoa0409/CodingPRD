            - "captured fine_a == 4000 (WRONG_ZONE base, no event on lot A)"

      - name: claim_offer_at_exact_expiry_succeeds
        claim_type: correct_result
        grounds: ["state_machines.WaitlistEntry.OFFERED_to_CLAIMED", "errors[ERR_OFFER_EXPIRED]"]
        distinguishing_aspect: "Offer expiry is strict-greater-than: a claim at exactly offer_expires_at (72h mark) still succeeds and produces a full-term-priced permit (84000)."
        test_recipe:
          setup: ["quota-1 allocation; occupier permit cancelled at 2026-08-01T00:00:00Z auto-offered patron W (offer_expires_at 2026-08-04T00:00:00Z); clock set to exactly 2026-08-04T00:00:00Z"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "Occ", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { occ_id: $.data.id }
            - call: "POST /parking/patrons"
              payload: { full_name: "W", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
