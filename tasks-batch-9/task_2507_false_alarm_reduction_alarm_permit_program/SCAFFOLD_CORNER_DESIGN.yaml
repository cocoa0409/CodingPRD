              payload: { alarm_site_id: "${site_id}", triggering_incident_id: "${inc1_id}", basis: "EXCESSIVE_FALSE_ALARMS", effective_from: "2026-09-30T01:00:00Z", effective_through: "2026-10-30T01:00:00Z", expected_alarm_site_version: "${site_v_now}" }
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { err_stale_site: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_ALARM_SITE_VERSION"
            - "AlarmSite.${site_id}.version is exactly ${site_v_now} + 1 (the SiteContact write) and no SuspensionOrder row exists"
            - "retrying with the freshly read version still fails, but with 409 ERR_SUSPENSION_BASIS_NO_LONGER_MET (1 < suspension_threshold_count 6), which proves the 412 came from the version guard alone"

      - name: payment_record_create_with_a_stale_site_version_returns_412
        claim_type: Violation -> Error
