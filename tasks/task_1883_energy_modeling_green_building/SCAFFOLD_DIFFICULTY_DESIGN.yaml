      - name: performance_report_closed_tiling
        grounds:
          - calculations.report_period_tiling
          - errors[ERR_REPORT_PERIOD_OVERLAP]
          - errors[ERR_REPORT_PERIOD_GAP]
        distinguishing_aspect: |
          Closed-inclusive interval semantics on PerformanceReport (different
          resource and different interval arithmetic than the half-open
          commissioning rule): a shared boundary day is a conflict
          (ERR_REPORT_PERIOD_OVERLAP), a skipped day is a gap
          (ERR_REPORT_PERIOD_GAP), and only exact tiling start == anchor_end + 1
          day is accepted.
