        claim_type: role_denial
        grounds: ["roles[LAND_MANAGER]", "roles[DIVISION_PRESIDENT]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "LAND_MANAGER calling POST /communities (a DIVISION_PRESIDENT exclusive) returns 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: LAND_MANAGER, captures: {err: $.data.error_id} }
          assert:
            - "response HTTP 403 with error_id == ERR_FORBIDDEN"

  # ==================================================================
  # Section: cross_cutting (complexity layers)
  # ==================================================================
  - section: cross_cutting
    instances:
      - name: pacing_plan_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pacing-plan-create-stale-community]"]
        distinguishing_aspect: "After a successful plan create bumps community version, a second create carrying the previously observed version returns 412 ERR_STALE_VERSION; the first plan is SUPERSEDED and the new one PUBLISHED on success."
        test_recipe:
          setup: ["community created then opened; client holds version observed after open"]
          setup_api_calls:
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 10, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT, captures: {plan1: $.data.id} }
          trigger:
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-10-01T00:00:00Z", period_end: "2026-10-31T00:00:00Z", max_starts: 8, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT, captures: {err: $.data.error_id} }
            - { call: "GET /communities/${com}", as: DIVISION_PRESIDENT, captures: {comv2: $.data.version} }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-10-01T00:00:00Z", period_end: "2026-10-31T00:00:00Z", max_starts: 8, expected_community_version: "${comv2}"}, as: DIVISION_PRESIDENT, captures: {plan2: $.data.id} }
            - { call: "GET /communities/${com}/pacing-plans", as: DIVISION_PRESIDENT, captures: {p1st: "$.data[0].state", p2st: "$.data[1].state"} }
          assert:
            - "second create with stale version returns HTTP 412 ERR_STALE_VERSION"
            - "retry with fresh version succeeds (201)"
            - "plan1 state == SUPERSEDED and plan2 state == PUBLISHED after the successful retry"

      - name: takedown_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[takedown-create-stale-contract]"]
        distinguishing_aspect: "Two takedown creates carrying the same observed contract version: the first succeeds (version bumps), the second with the stale version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["contract ACTIVE at version v after execute; community exists"]
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
          trigger:
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {err: $.data.error_id} }
          assert:
            - "first create returns 201"
            - "second create with the same observed version returns HTTP 412 ERR_STALE_VERSION"

      - name: idempotent_home_create_replay
        claim_type: idempotency
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "POST /communities/{id}/homes replayed with the same Idempotency-Key and identical body returns the same home id and does not consume a second lot or bump standing_spec_count; the same key with a different body returns 409 ERR_IDEMPOTENCY_REPLAY_MISMATCH."
        test_recipe:
          setup: ["standard open community with lots, plan, capacity"]
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 10}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 10, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id", lot2: "$.data[1].id"} }
          trigger:
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {h1: $.data.id} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {h1b: $.data.id} }
            - { call: "GET /communities/${com}", as: COMMUNITY_MANAGER, captures: {ssc: $.data.standing_spec_count} }
          assert:
            - "replay with same Idempotency-Key and identical body returns the same home id (${h1} == ${h1b})"
            - "Community.standing_spec_count == 1 (no double-count), only one lot CONSUMED"
            - "same key with a modified body (e.g. base_price_cents 41000000) returns HTTP 409 ERR_IDEMPOTENCY_REPLAY_MISMATCH"

  # ==================================================================
  # Section: consistency (immediate model)
  # ==================================================================
  - section: consistency
    instances:
      - name: write_then_read_immediate_consistency
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Every mutation is visible in the same request's response AND in an immediately following GET: home start bumps standing_spec_count and starts_this_period observable via GET /communities/{id}."
        test_recipe:
          setup: ["standard open community with lots, plan, capacity"]
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 10}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 10, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id"} }
          trigger:
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {h1: $.data.id} }
            - { call: "GET /communities/${com}", as: COMMUNITY_MANAGER, captures: {ssc: $.data.standing_spec_count, stp: $.data.starts_this_period} }
          assert:
            - "GET immediately after create shows standing_spec_count == 1 and starts_this_period == 1"

      - name: pacing_plan_supersede_resets_starts_counter
        claim_type: epoch_reset
        grounds: [entities.Community.fields.starts_this_period, state_machines.PacingPlan]
        distinguishing_aspect: "starts_this_period counts only homes created within the CURRENT PUBLISHED plan's period: starting one home under plan P1 (September) then publishing P2 (October, max_starts 5) resets the count to 0, restoring full quota — while lifetime community counters are unaffected."
        test_recipe:
          setup: ["open community; plan P1 (Sep, max_starts 10) with one home started; then plan P2 (Oct) published"]
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", committed_units: 10}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 10, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT, captures: {plan1: $.data.id} }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id"} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER }
            - { call: "GET /communities/${com}", as: DIVISION_PRESIDENT, captures: {comv2: $.data.version, stp1: $.data.starts_this_period} }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-10-01T00:00:00Z", period_end: "2026-10-31T00:00:00Z", max_starts: 5, expected_community_version: "${comv2}"}, as: DIVISION_PRESIDENT, captures: {plan2: $.data.id} }
          trigger:
            - { call: "GET /communities/${com}", as: DIVISION_PRESIDENT, captures: {stp2: $.data.starts_this_period} }
            - { call: "GET /communities/${com}/pacing-plans", as: DIVISION_PRESIDENT, captures: {pl1: "$.data[0].state", pl2: "$.data[1].state"} }
          assert:
            - "starts_this_period == 1 under P1; == 0 after P2 is published (counter resets with the new plan period)"
            - "P1 state == SUPERSEDED, P2 state == PUBLISHED"
