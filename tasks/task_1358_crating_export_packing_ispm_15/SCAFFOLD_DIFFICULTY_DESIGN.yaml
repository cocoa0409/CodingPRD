# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) — task 1358
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: job_quote_provisional_vs_final_labor
        grounds:
          - calculations.job_quote
          - calculations.labor_booking_cost
          - entities.PackingJob.fields.quoted_price_cents
          - entities.PackingJob.fields.invoiced_total_cents
        distinguishing_aspect: |
          Same items, two algorithm variants on the PackingJob fiscal domain:
          PROVISIONAL uses ceil(volume_m3 * 1.5) estimated hours (1h -> 8500 cents),
          FINAL at close uses the COMPLETED booking's actual 3.0 hours (25500 cents);
          identical item data therefore yields two different literal totals
          (34139 provisional snapshot vs 54151 final invoice).
        test_recipe:
          setup:
            - "Customer (credit 100000000), SHOP/FOB job, one Item 100x80x60 cm / 40 kg / STANDARD / declared 500000"
            - "WoodBatch HT-2026-0001 (5000 bf, 4 stamps, expires 2027-12-31)"
            - "Design approved against batch; quote accepted; 3.0h SHOP booking CONFIRMED; crate built/packed/sealed; 40FT container loaded+locked+gated out; docs finalized+released; job SHIPPED then DELIVERED; booking COMPLETED"
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Acme Machines", site_code: "ACME-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Pump assembly", length_cm: 100, width_cm: 80, height_cm: 60, weight_kg: 40, fragile_class: STANDARD, declared_value_cents: 500000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0001", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 5000, stamps_acquired: 4 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design_id: $.data.id } }
            - { call: "POST /crating/designs/${design_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /crating/crews", payload: { name: "Shop Crew A", capabilities: [SHOP_BUILD] }, as: ShopForeman, captures: { crew_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/labor-bookings", payload: { crew_id: "${crew_id}", mode: SHOP, start_at: "2026-08-10T09:00:00Z", end_at: "2026-08-10T12:00:00Z" }, as: ShopForeman, captures: { booking_id: $.data.id } }
            - { call: "POST /crating/labor-bookings/${booking_id}/confirm", payload: {}, as: ShopForeman }
            - { call: "POST /crating/packing-jobs/${job_id}/start-packing", payload: {}, as: ShopForeman }
            - { call: "POST /crating/items/${item_id}/crates", payload: { design_id: "${design_id}" }, as: ShopForeman, captures: { crate_id: $.data.id } }
            - { call: "POST /crating/crates/${crate_id}/build", payload: {}, as: ShopForeman }
            - { call: "POST /crating/crates/${crate_id}/pack", payload: { indicator_g: 75, moisture_barrier: NONE }, as: ShopForeman }
            - { call: "POST /crating/crates/${crate_id}/seal", payload: {}, as: ComplianceOfficer }
            - { call: "POST /crating/containers", payload: { container_no: "MSCU1234567", size: 40FT, dunnage_weight_kg: 0 }, as: LogisticsCoordinator, captures: { cont_id: $.data.id } }
            - { call: "POST /crating/containers/${cont_id}/load-crate", payload: { crate_id: "${crate_id}" }, as: LogisticsCoordinator }
            - { call: "POST /crating/containers/${cont_id}/lock", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /crating/containers/${cont_id}/gate-out", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /crating/packing-jobs/${job_id}/packing-list", payload: { lines: [ { crate_id: "${crate_id}", description: "Pump assembly", qty: 1, net_weight_kg: 40.0, gross_weight_kg: 140.8 } ] }, as: SalesRep }
            - { call: "POST /crating/packing-jobs/${job_id}/commercial-invoice", payload: { lines: [ { crate_id: "${crate_id}", description: "Pump assembly", qty: 1, unit_price_cents: 500000, duty_rate_bp: 0 } ] }, as: SalesRep }
            - { call: "POST /crating/packing-jobs/${job_id}/finalize-docs", payload: {}, as: SalesRep }
            - { call: "POST /crating/packing-jobs/${job_id}/release-docs", payload: {}, as: ComplianceOfficer }
            - { call: "POST /crating/packing-jobs/${job_id}/ship", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /crating/packing-jobs/${job_id}/deliver", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /crating/labor-bookings/${booking_id}/complete", payload: {}, as: ShopForeman }
          trigger:
            - { call: "POST /crating/packing-jobs/${job_id}/close", payload: {}, as: SalesRep, captures: { inv_total: $.data.invoiced_total_cents, job_status: $.data.status } }
          assert:
            - "GET /quote provisional quoted_price_cents == 34139 (wood 19600 + est labor 1h*8500 + protection 900 = subtotal 29000; handling 8% = 2320; fuel 9% of 31320 = 2819)"
            - "close response invoiced_total_cents == 54151 (FINAL variant: actual 3.0h = 25500 -> subtotal 46000; handling 3680; fuel 4471)"
            - "invoiced_total_cents != quoted_price_cents for identical item data — variants diverge on the labor input set"
            - "PackingJob.${job_id}.status == CLOSED"
      - name: claim_settlement_declared_vs_depreciated_cap
        grounds:
          - calculations.claim_settlement
          - entities.DamageClaim.fields.amount_approved_cents
        distinguishing_aspect: |
          Same declared value (200000) and same claimed amount (250000) on the
          DamageClaim domain: IMPACT uses the DECLARED_VALUE variant (cap 200000)
          while MOISTURE uses the DEPRECIATED variant (3 whole weeks after delivery
          -> cap 200000 * 0.97 = 194000) — two variants, two different approved
          amounts for identical claim inputs.
        test_recipe:
          setup:
            - "Delivered SHOP job (default clock 2026-08-01T00:00:00Z at deliver), one crate, item declared_value_cents 200000, invoice line 200000 (passes undervaluation)"
            - "Logical clock advanced to 2026-08-25T00:00:00Z (24 days <= 30 window; 3 whole weeks of depreciation)"
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Beacon Tools", site_code: "BEAC-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "CNC spindle", length_cm: 100, width_cm: 80, height_cm: 60, weight_kg: 40, fragile_class: STANDARD, declared_value_cents: 200000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0002", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 5000, stamps_acquired: 4 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design_id: $.data.id } }
            - { call: "POST /crating/designs/${design_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /crating/packing-jobs/${job_id}/start-packing", payload: {}, as: ShopForeman }
            - { call: "POST /crating/items/${item_id}/crates", payload: { design_id: "${design_id}" }, as: ShopForeman, captures: { crate_id: $.data.id } }
            - { call: "POST /crating/crates/${crate_id}/build", payload: {}, as: ShopForeman }
            - { call: "POST /crating/crates/${crate_id}/pack", payload: { indicator_g: 75, moisture_barrier: NONE }, as: ShopForeman }
            - { call: "POST /crating/crates/${crate_id}/seal", payload: {}, as: ComplianceOfficer }
            - { call: "POST /crating/containers", payload: { container_no: "TGHU7654321", size: 40FT, dunnage_weight_kg: 0 }, as: LogisticsCoordinator, captures: { cont_id: $.data.id } }
            - { call: "POST /crating/containers/${cont_id}/load-crate", payload: { crate_id: "${crate_id}" }, as: LogisticsCoordinator }
            - { call: "POST /crating/containers/${cont_id}/lock", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /crating/containers/${cont_id}/gate-out", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /crating/packing-jobs/${job_id}/packing-list", payload: { lines: [ { crate_id: "${crate_id}", description: "CNC spindle", qty: 1, net_weight_kg: 40.0, gross_weight_kg: 140.8 } ] }, as: SalesRep }
            - { call: "POST /crating/packing-jobs/${job_id}/commercial-invoice", payload: { lines: [ { crate_id: "${crate_id}", description: "CNC spindle", qty: 1, unit_price_cents: 200000, duty_rate_bp: 0 } ] }, as: SalesRep }
            - { call: "POST /crating/packing-jobs/${job_id}/finalize-docs", payload: {}, as: SalesRep }
            - { call: "POST /crating/packing-jobs/${job_id}/release-docs", payload: {}, as: ComplianceOfficer }
            - { call: "POST /crating/packing-jobs/${job_id}/ship", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /crating/packing-jobs/${job_id}/deliver", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /crating/_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /crating/packing-jobs/${job_id}/claims", payload: { crate_id: "${crate_id}", claim_type: IMPACT, description: "Forklift puncture", amount_claimed_cents: 250000 }, as: Customer, as_user_id: "${cust_id}", captures: { claim_impact: $.data.id } }
            - { call: "POST /crating/claims/${claim_impact}/review", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /crating/packing-jobs/${job_id}/claims", payload: { crate_id: "${crate_id}", claim_type: MOISTURE, description: "Barrier failure, rust", amount_claimed_cents: 250000 }, as: Customer, as_user_id: "${cust_id}", captures: { claim_moist: $.data.id } }
            - { call: "POST /crating/claims/${claim_moist}/review", payload: {}, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /crating/claims/${claim_impact}/approve", payload: {}, as: ClaimsAdjuster, captures: { approved_impact: $.data.amount_approved_cents } }
            - { call: "POST /crating/claims/${claim_moist}/approve", payload: {}, as: ClaimsAdjuster, captures: { approved_moist: $.data.amount_approved_cents } }
          assert:
            - "IMPACT claim amount_approved_cents == 200000 (DECLARED_VALUE variant: min(250000, 200000))"
            - "MOISTURE claim amount_approved_cents == 194000 (DEPRECIATED variant: 200000 * (1 - 0.01*3 weeks))"
            - "approved_impact != approved_moist for identical claimed amounts — variant selection by claim_type"

  - rule_id: combinatorial_formula
    instances:
      - name: job_total_price_pinned_evaluation_order
        grounds:
          - calculations.job_quote
          - calculations.crate_design_geometry
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: handling-fee tier is keyed on the
          subtotal, but fuel surcharge is computed on (subtotal + handling); the
          scaffold pins lines -> subtotal -> handling -> fuel -> total. Asserted
          with literals: subtotal 29000, handling 2320 (8% tier, < 500000),
          fuel 2819 (9% of 31320), total 34139.
        test_recipe:
          setup:
            - "Customer, SHOP/FOB job in QUOTED, one Item 100x80x60 / 40 kg / STANDARD (design not yet needed — provisional quote is computable from items; here a design is created+approved so wood/protection lines are exact: 56 bf, indicator 75G, barrier NONE)"
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Quote Co", site_code: "QTE-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Pump assembly", length_cm: 100, width_cm: 80, height_cm: 60, weight_kg: 40, fragile_class: STANDARD, declared_value_cents: 500000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0010", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 5000, stamps_acquired: 4 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design_id: $.data.id } }
            - { call: "POST /crating/designs/${design_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
          trigger:
            - { call: "GET /crating/packing-jobs/${job_id}/quote", payload: {}, as: SalesRep, captures: { q_total: $.data.quoted_price_cents, q_sub: $.data.subtotal_cents, q_handling: $.data.handling_fee_cents, q_fuel: $.data.fuel_surcharge_cents, q_cw: $.data.total_chargeable_weight_kg, q_hours: $.data.estimated_labor_hours } }
          assert:
            - "subtotal_cents == 29000 (wood 56bf*350=19600, no tier discount <200bf; labor ceil(0.48*1.5)=1h*8500; protection 75G=900, barrier NONE=0; hazmat 0)"
            - "handling_fee_cents == 2320 (8% of subtotal 29000 — tier keyed on SUBTOTAL, not total)"
            - "fuel_surcharge_cents == 2819 (9% of subtotal+handling = 31320, round_half_up 2818.8)"
            - "quoted_price_cents == 34139"
            - "total_chargeable_weight_kg == 96.0 (dimensional 480000/5000 exceeds actual 40)"
            - "estimated_labor_hours == 1"
      - name: invoice_duty_per_line_rounding_order
        grounds:
          - calculations.invoice_totals
          - entities.CommercialInvoice.fields.duty_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: duty is rounded PER LINE then summed (pinned);
          lines 10100 and 10300 at 750 bp give per-line duties 758 + 773 = 1531,
          while the forbidden sum-then-round order gives round(20400*0.075) = 1530 —
          the two orders diverge by exactly 1 cent and the scaffold pins per-line.
        test_recipe:
          setup:
            - "Customer, SHOP job, two Items 50x50x50 / 50 kg / STANDARD; designs approved; quote accepted (job DESIGN); two Crates created pinning the designs"
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Duty Co", site_code: "DTY-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: EXW }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Valve A", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 50, fragile_class: STANDARD, declared_value_cents: 10100 }, as: SalesRep, captures: { item1_id: $.data.id, item1_v: $.data.version } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Valve B", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 50, fragile_class: STANDARD, declared_value_cents: 10300 }, as: SalesRep, captures: { item2_id: $.data.id, item2_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0011", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 5000, stamps_acquired: 4 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item1_id}/designs", payload: { expected_item_version: "${item1_v}" }, as: CratingDesigner, captures: { design1_id: $.data.id } }
            - { call: "POST /crating/designs/${design1_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design1_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
            - { call: "POST /crating/items/${item2_id}/designs", payload: { expected_item_version: "${item2_v}" }, as: CratingDesigner, captures: { design2_id: $.data.id } }
            - { call: "POST /crating/designs/${design2_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design2_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /crating/items/${item1_id}/crates", payload: { design_id: "${design1_id}" }, as: ShopForeman, captures: { crate1_id: $.data.id } }
            - { call: "POST /crating/items/${item2_id}/crates", payload: { design_id: "${design2_id}" }, as: ShopForeman, captures: { crate2_id: $.data.id } }
          trigger:
            - { call: "POST /crating/packing-jobs/${job_id}/commercial-invoice", payload: { lines: [ { crate_id: "${crate1_id}", description: "Valve A", qty: 1, unit_price_cents: 10100, duty_rate_bp: 750 }, { crate_id: "${crate2_id}", description: "Valve B", qty: 1, unit_price_cents: 10300, duty_rate_bp: 750 } ] }, as: SalesRep, captures: { inv_total: $.data.invoice_total_cents, duty_total: $.data.duty_total_cents } }
          assert:
            - "invoice_total_cents == 20400"
            - "duty_total_cents == 1531 (per-line: round(757.5)=758 + round(772.5)=773)"
            - "duty_total_cents != 1530 — the forbidden sum-then-round value"

  - rule_id: non_linear_state_machine
    instances:
      - name: crate_design_revision_cycle
        grounds:
          - state_machines.CrateDesign.DRAFT_to_IN_REVIEW
          - state_machines.CrateDesign.IN_REVIEW_to_REJECTED
          - state_machines.CrateDesign.REJECTED_to_DRAFT
          - state_machines.CrateDesign.IN_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Cyclic machine on CrateDesign: DRAFT -> IN_REVIEW -> REJECTED -> DRAFT
          (revision increments 1 -> 2) -> IN_REVIEW -> APPROVED; the loop-back edge
          REJECTED -> DRAFT distinguishes this from a linear pipeline.
        test_recipe:
          setup:
            - "Customer, job, one item, active wood batch; design created (revision 1, DRAFT)"
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Cycle Co", site_code: "CYC-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Gearbox", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 50, fragile_class: DELICATE, declared_value_cents: 80000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0020", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 5000, stamps_acquired: 4 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design_id: $.data.id } }
            - { call: "POST /crating/designs/${design_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design_id}/reject", payload: { reason: "insufficient clearance" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /crating/designs/${design_id}/revise", payload: {}, as: CratingDesigner, captures: { rev_after: $.data.revision, state_after_revise: $.data.status } }
            - { call: "POST /crating/designs/${design_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer, captures: { state_final: $.data.status, rev_final: $.data.revision } }
          assert:
            - "after revise: status == DRAFT and revision == 2 (loop edge REJECTED -> DRAFT increments revision)"
            - "after resubmit+approve: status == APPROVED with revision == 2"
            - "WoodBatch.${batch_id}.reserved_board_feet == 27 (reservation lands only after the cycle completes)"
      - name: crate_reopen_reseal_stamp_cycle
        grounds:
          - state_machines.Crate.PACKED_to_SEALED
          - state_machines.Crate.SEALED_to_REOPENED
          - state_machines.Crate.REOPENED_to_PACKED
        distinguishing_aspect: |
          Cyclic machine on Crate: SEALED -> REOPENED -> PACKED -> SEALED with
          compensating stamp control — the first serial is voided (never reused)
          and the re-seal mints the next serial; batch stamp ledger stays balanced.
        test_recipe:
          setup:
            - "Full chain to a SEALED crate for a STANDARD 50x50x50 / 40 kg item (batch HT-2026-0021 with 2 stamps); first seal mints ISPM15-HT-2026-0021-0001"
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Reopen Co", site_code: "ROP-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Motor", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 40, fragile_class: STANDARD, declared_value_cents: 60000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0021", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 5000, stamps_acquired: 2 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design_id: $.data.id } }
            - { call: "POST /crating/designs/${design_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}" }
