# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role, or missing X-User-ID for an entity-backed role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the role is not permitted for this operation, or an entity-backed actor acts on a resource it does not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a resource id in the path does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "a foreign-key id in the body references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, bad type, out-of-range value, or invalid enum"
  - id: ERR_DUPLICATE
    http: 409
    condition: "uniqueness violation: member/instructor email, or belt rank code/order within a program"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the parent's current version (OCC)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a state from which the requested transition is allowed"
  - id: ERR_WAIVER_NOT_SIGNED
    http: 422
    condition: "an attendance, promotion test, or tournament registration is attempted for a member with waiver_signed == false"
  - id: ERR_MEMBER_NOT_ACTIVE
    http: 422
    condition: "an operation requiring an ACTIVE member is attempted while account_status is FROZEN/SUSPENDED/WITHDRAWN"
  - id: ERR_RANK_TERMINAL
    http: 422
    condition: "a promotion test is scheduled for an enrollment already at a terminal belt rank (next_rank_code == null) or whose enrollment is not ACTIVE"
  - id: ERR_NOT_ELIGIBLE_FOR_TEST
    http: 422
    condition: "promotion-test eligibility fails: insufficient rank attendance or insufficient days in rank"
  - id: ERR_INSTRUCTOR_DOUBLE_BOOKED
    http: 409
    condition: "a class session or private-lesson confirmation overlaps another booking on the same instructor"
  - id: ERR_PROGRAM_MISMATCH
    http: 422
    condition: "an attendance enrollment's program_id does not match the class session's program_id"
  - id: ERR_CLASS_FULL
    http: 409
    condition: "a check-in would push confirmed_count past the session capacity"
  - id: ERR_ALREADY_CHECKED_IN
    http: 409
    condition: "the member already holds a CONFIRMED attendance for this class session"
  - id: ERR_EVENT_IN_PAST
    http: 422
    condition: "a tournament registration's event_date is not strictly in the future"
  - id: ERR_TEST_BALANCE_TOO_HIGH
    http: 422
    condition: "promotion-test scheduling blocked because the member's outstanding_balance_cents exceeds TEST_BALANCE_CEILING_CENTS"
  - id: ERR_VALIDATION
    http: 422
    condition: "a generic business-rule violation not covered by a more specific code (e.g. ends_at <= starts_at, empty line_items, term_months not in allowed set)"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: FrontDesk
    description: "Front-desk staff: manages programs, members, families, instructors, billing, contracts, pro-shop fulfilment."
    identity: "opaque"
    exclusive_operations:
      - "POST /dojo/programs"
      - "POST /dojo/programs/{id}/archive"
      - "POST /dojo/programs/{id}/belt-ranks"
      - "POST /dojo/families"
      - "POST /dojo/members"
      - "POST /dojo/instructors"
      - "POST /dojo/members/{id}/freeze"
      - "POST /dojo/members/{id}/unfreeze"
      - "POST /dojo/members/{id}/withdraw"
      - "POST /dojo/enrollments"
      - "POST /dojo/contracts"
      - "POST /dojo/contracts/{id}/run-billing"
      - "POST /dojo/contracts/{id}/terminate"
      - "POST /dojo/invoices/{id}/waive"
      - "POST /dojo/invoices/{id}/mark-overdue"
      - "POST /dojo/attendances/{id}/cancel"
      - "POST /dojo/pro-shop-orders/{id}/fulfill"
      - "POST /dojo/_clock/advance"
    shared_operations:
      - "POST /dojo/members/{id}/sign-waiver"
      - "POST /dojo/class-sessions"
      - "POST /dojo/class-sessions/{id}/cancel"
      - "POST /dojo/attendances"
      - "POST /dojo/promotion-tests"
      - "POST /dojo/promotion-tests/{id}/cancel"
      - "POST /dojo/invoices/{id}/pay"
      - "POST /dojo/private-lessons"
      - "POST /dojo/private-lessons/{id}/cancel"
      - "POST /dojo/tournament-registrations"
      - "POST /dojo/tournament-registrations/{id}/withdraw"
      - "POST /dojo/pro-shop-orders"
      - "POST /dojo/pro-shop-orders/{id}/cancel"
      - "all GET reads"
  - name: Instructor
    description: "Teaching staff: runs classes, administers/grades tests, confirms/completes private lessons."
    identity: "entity_backed:Instructor"
    exclusive_operations:
