              payload: { order_id: "${o1}" }
              as: Picker
              as_user_id: "${picker_1}"
            - call: "POST /mfc/pick-batches/${b_sel}/orders"
              payload: { order_id: "${o2}" }
              as: Picker
              as_user_id: "${picker_1}"
