              captures: { fc_ded_id: $.data.id }
            - call: "GET /fiscal/budget-cycles/${cyc_id}"
              payload: {}
              as: BudgetAnalyst
              captures: { cyc_v1: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v1}" }
              as: BudgetAnalyst
              captures: { fc_gen_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_ded_id}/adopt"
              payload: {}
              as: BudgetDirector
