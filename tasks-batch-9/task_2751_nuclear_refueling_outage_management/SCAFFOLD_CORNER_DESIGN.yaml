            - "Rad areas UNIT_1 / CTMT-EL471 and UNIT_1 / CTMT-EL500, both dose_rate_mrem_per_hr 25 with survey_buffer_hours 2, so the two permits occupy different areas and cannot conflict on window."
            - "Outage UNIT_1 / 1R24 with dose_budget_total_mrem 5000, driven to SCOPE_LOCKED with two APPROVED work orders."
            - "Heavy permit: 5 workers, 5 hours, shielding_factor 0 -> per-worker 125.00, collective 625.00 (flag true), contingency 125.00, committed 750.00."
            - "Light permit: 2 workers, 6 hours, shielding_factor 0.5 -> per-worker 75.00, collective 150.00 (flag false), contingency 30.00, committed 180.00."
            - "Total committed if both are approved is 930.00 against a 5000 mrem budget, so neither the dose-budget gate nor the ALARA posture gate interferes."
