  - rule_id: resource_temporal_overlap
    instances:
      - name: promotion_enrollment_windows_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=11]
          - entities.PromotionEnrollment.fields.starts_on
          - errors.ERR_ENROLLMENT_WINDOW_OVERLAP
        distinguishing_aspect: |
          Interval semantics — half-open [starts_on, ends_on) on
          PromotionEnrollment: window B starting exactly at window A's ends_on
          is ADJACENT and legal, while a one-second-earlier B overlaps and is
          rejected. The resource is the (track, time) pair; TERMINATED windows
          stop blocking. Compare the placement-slot rule, whose resource is a
          discrete slot with a re-open grace (ROTATED_OUT rows never block).
        test_recipe:
          setup:
            - "Artist with LIVE release and focus track; no fraud holds."
            - "Enrollment A [2026-09-10T00:00:00Z, 2026-09-20T00:00:00Z) exists ENROLLED."
          setup_api_calls:
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/artists"
              payload: { stage_name: "Win", primary_genre: "POP", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_wn: $.data.id }
