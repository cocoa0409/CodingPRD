  # =====================================================================
  # Rule 7 - cross_entity_state_dependency
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: selection_approval_gated_by_pattern_asset_state_and_unblocked_by_refurbishment
        grounds:
          - validations[priority=35]
          - state_machines.PatternAsset.IN_REFURB_to_QUALIFIED
          - state_machines.Selection.PROPOSED_to_APPROVED
          - calculations.pattern_wear_index
        distinguishing_aspect: |
          The gate lives on a THIRD entity that the request never names: approving a Selection
          requires at least one QUALIFIED PatternAsset for the model, and the pattern is driven
          WORN by a pour that happens after the Selection was already PROPOSED. Nothing about the
          Selection changes between the rejected and the accepted approve call - only the
          PatternAsset's state does - so an implementation that caches selection validity, or
          that only checks the pattern at creation time, fails.
        test_recipe:
          setup:
            - "Foundry FDY-NORTH, PumpModel HSC-14, MaterialSealConfig MSC-CI-P11 and DutyApplication APP-1001 as in rule 1 instance 1, with npsh_margin_m 0.60 so the safety floor is satisfied."
            - "PatternAsset PAT-HSC14-A created with wear_threshold 1 and QUALIFIED, the model's only pattern."
            - "Selection created and PROPOSED by eng-101 while the pattern was QUALIFIED."
            - "CastingLot H-9001 then poured from that pattern, taking wear_index to 1 and the pattern to WORN; the lot is inspected and ACCEPTED so no lot blocks refurbishment."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
