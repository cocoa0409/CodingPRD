            - { call: "POST /charts", payload: { account_id: "${acct1}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart1: $.data.id } }
            - { call: "POST /patient-accounts/${acct1}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart1}", coder_id: "${s1_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg1: $.data.id } }
