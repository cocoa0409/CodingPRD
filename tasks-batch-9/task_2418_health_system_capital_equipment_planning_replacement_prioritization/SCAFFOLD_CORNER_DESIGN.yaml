              captures: { e_cont_released: $.data.error_id }
          assert:
            - "Trigger step 1: HTTP 200 with contingency_status RELEASED, released_contingency_cents 5000000, allocated_cents still 100000000, committed_cents 0, available_cents 105000000, posture ACTIVE, version 2"
            - "Trigger step 1 preserves the invariant allocated + released == committed + available (100000000 + 5000000 == 0 + 105000000)"
