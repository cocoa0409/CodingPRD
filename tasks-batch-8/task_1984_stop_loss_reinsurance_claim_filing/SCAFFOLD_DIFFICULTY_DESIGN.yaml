              captures: { err: $.data.error_id }
          assert:
            - "Second submit fails with error_id == ERR_INVALID_STATE (state check fires before deadline check)"

      - name: business_referential_vs_business_constraint_on_laser_create
        grounds:
          - validations[priority=5]
          - validations[priority=9]
        distinguishing_aspect: |
          Pair (business_referential, business_constraint): a laser create with
          a member_id from a DIFFERENT plan AND a lasered deductible below the
          contract base fails with the referential error (priority 5), not the
          constraint error (priority 9).
        test_recipe:
          setup:
            - "Plans P1 and P2; contract C1 on P1; member M2 belongs to P2"
          setup_api_calls:
