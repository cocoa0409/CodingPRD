            - { call: "POST /curriculum/proposals/${pb}/decisions", payload: { action: "APPROVE" }, as: CurriculumCommittee, as_user_id: "cc-1" }
            - { call: "POST /curriculum/proposals/${pb}/decisions", payload: { action: "APPROVE" }, as: FacultySenate, as_user_id: "sen-1", captures: { pb_final_score: $.data.substantive_change_score, pb_final_flag: $.data.accreditor_notification_required } }
          assert:
            - "captured pa_prov_score == 35 and pa_prov_flag == false (cross-listing factor excluded from PROVISIONAL)"
            - "captured pa_final_score == 50 and pa_final_flag == true — exactly 50 triggers because the rule is >= 50"
            - "captured pb_final_score == 35 and pb_final_flag == false (below threshold; no cross-listing on D)"
      - name: zero_cohort_deactivation_exempts_teach_out
        grounds:
          - validations[priority=13]
          - state_machines.Proposal.REGISTRAR_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Boundary metric = declared_remaining_cohorts (zero-count edge) observed at the
          decisions endpoint (different metric and a different failing arm than the score
          threshold instance): exactly 0 cohorts exempts the DEACTIVATION from the teach-out
          requirement (Registrar APPROVE succeeds with no plan), while 1 cohort makes the
          same call fail with ERR_TEACH_OUT_NOT_COMMITTED.
