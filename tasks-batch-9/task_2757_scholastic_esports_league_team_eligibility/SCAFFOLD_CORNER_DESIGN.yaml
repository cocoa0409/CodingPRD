          - rbac.IntegrityOfficer.shared_operations
        distinguishing_aspect: |
          The mirror image of the refusal instance: every endpoint whose `roles` list has
          more than one entry is exercised by its NON-primary role, and each call must
          succeed with exactly the same effect as the primary role's call — including the
          user-id capture fields (reported_by_user_id), which must record whoever actually
          called rather than a hard-coded role.
