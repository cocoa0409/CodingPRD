  # ===========================================================================
  # Rule 6 — boundary_precision_check (two instances, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: install_threshold_exactly_one_million_vs_one_below
        grounds:
          - calculations.runtime_fee_assessment
          - endpoints.POST_/install-reports/{id}/review
        distinguishing_aspect: |
          Numeric threshold metric on the review/accept endpoint: billable installs
          accumulating to exactly 1,000,000 (>= threshold) triggers charging on the
          NEXT install while a lifetime total of 999,999 leaves the invoice at 0;
          the >= boundary is load-bearing.
        test_recipe:
          setup:
            - "PRO org, revenue gate met; SHIPPED project with one report of exactly 1,000,000 billable installs"
          setup_api_calls:
            - call: "POST /tiers"
