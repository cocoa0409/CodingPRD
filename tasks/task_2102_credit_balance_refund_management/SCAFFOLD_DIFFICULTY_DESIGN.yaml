            - call: "GET /refund-batches/${batch_esc_id}"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "disb-1"
              captures: { batch_esc_v: "$.data.version" }
            - call: "POST /refund-batches/${batch_esc_id}/lock"
              payload: { expected_refund_batch_version: "${batch_esc_v}" }
              as: DisbursementOfficer
              as_user_id: "disb-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /refund-batches/${batch_esc_id}/issue"
              payload: { starting_check_number: "100001" }
              as: DisbursementOfficer
              as_user_id: "disb-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-10T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /patient-accounts/${acct_es2_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 100, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-16T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /ops/run-aging-sweep"
              payload: {}
              as: SystemAdmin
              as_user_id: "sysadmin-1"
          trigger:
            - call: "POST /escheatment-records"
              payload: { check_disbursement_id: "${chk_es1_id}", basis: "ISSUE_DATE" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { esr_issue_id: "$.data.id" }
            - call: "POST /escheatment-records"
              payload: { check_disbursement_id: "${chk_es2_id}", basis: "LAST_CONTACT" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { esr_contact_id: "$.data.id" }
          assert:
            - "EscheatmentRecord.${esr_issue_id}.state_code == CA"
            - "EscheatmentRecord.${esr_issue_id}.dormancy_days == 1095"
            - "EscheatmentRecord.${esr_issue_id}.dormancy_start_at == 2026-08-20T00:00:00.000Z"
            - "EscheatmentRecord.${esr_issue_id}.escheat_due_at == 2029-08-19T00:00:00.000Z"
            - "EscheatmentRecord.${esr_issue_id}.due_diligence_open_at == 2029-04-21T00:00:00.000Z"
            - "EscheatmentRecord.${esr_contact_id}.dormancy_start_at == 2026-11-10T00:00:00.000Z"
            - "EscheatmentRecord.${esr_contact_id}.escheat_due_at == 2029-11-09T00:00:00.000Z"
            - "EscheatmentRecord.${esr_contact_id}.due_diligence_open_at == 2029-07-12T00:00:00.000Z"
            - "EscheatmentRecord.${esr_contact_id}.escheat_due_at != EscheatmentRecord.${esr_issue_id}.escheat_due_at"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: offset_admin_fee_rounded_per_line_then_residual_to_last_waterfall_line
        grounds:
          - calculations.offset_waterfall_allocation
          - entities.OffsetApplication.fields.admin_fee_share_cents
          - entities.OffsetApplication.fields.applied_cents
          - entities.OffsetApplication.fields.sequence
          - concurrency_rules[offset-apply-stale-notice]
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. The 1000-cent admin
          fee is prorated over waterfall lines 3333 / 3333 / 3334 of a 10000-cent
          pool: rounding per line gives 333 / 333 / 333 (sum 999) and the 1-cent
          residual is pinned to the highest-sequence line, producing 333 / 333 /
          334, whereas summing first and rounding once would put 1000 on one line.
        test_recipe:
          setup:
            - "One MEDICARE payer with take_back_allowed true and three accounts OA1, OA2, OA3 created in that order, each charged +10000 on 2026-08-01 and paid by the PAYER -13333, -13333 and -15000 respectively on 2026-08-05."
            - "A single sweep on 2026-08-15 identified credit balances of 3333, 3333 and 5000 cents in that account order; all three were attributed PROPORTIONAL to attribution PAYER, so payer_portion_cents equals the full credit on each."
            - "A take-back notice TB-1 for 10000 cents with admin_fee_cents 1000 was recorded on 2026-08-16 and is in state RECEIVED with remaining_unapplied_cents 10000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /payers"
              payload: { name: "Medicare Region A", payer_code: "MCR", payer_type: "MEDICARE", take_back_allowed: true }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_med_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-OA1", mrn: "MRN-OA1", patient_name: "Otto Ames", guarantor_state_code: "CA", primary_payer_id: "${payer_med_id}", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { acct_oa1_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-OA2", mrn: "MRN-OA2", patient_name: "Olive Ames", guarantor_state_code: "CA", primary_payer_id: "${payer_med_id}", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { acct_oa2_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-OA3", mrn: "MRN-OA3", patient_name: "Omar Ames", guarantor_state_code: "CA", primary_payer_id: "${payer_med_id}", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { acct_oa3_id: "$.data.id" }
            - call: "POST /patient-accounts/${acct_oa1_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 10000, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /patient-accounts/${acct_oa2_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 10000, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /patient-accounts/${acct_oa3_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 10000, source: "SYSTEM" }
