  - rule_id: compensating_invariant
    instances:
      - name: committed_tonnage_conserved_across_clear_and_cancel
        grounds:
          - entities.DeliveryAsset.fields.committed_quantity_mt
          - state_machines.DeliveryOrder.SCHEDULED_to_CLEARED
          - state_machines.DeliveryOrder.CLEARED_to_CANCELLED
          - endpoints["POST /delivery-orders/{id}/cancel"].side_effects
        distinguishing_aspect: |
          The conserved quantity is physical tonnage on a DeliveryAsset:
          committed_quantity_mt must always equal the sum of planned_quantity_mt over that
          asset's orders in {SCHEDULED, CLEARED, PUMPING}. The forward move (clear) must NOT
          change it (1200.000 before and after), and the compensating move (cancel) must return
          it to the exact pre-create value 0.000 while also unwinding port_clearance_ref,
          cleared_at and the nomination's fulfillment_status - no residue.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z, later advanced to 2026-08-10T06:30:00Z"
            - "Port NLRTM, grade MGO-DMA, index quote 705.00, customer with credit_limit_usd 5000000.00"
            - "Barge Alpha with committed_quantity_mt 0.000 before any order exists"
            - "Nomination A for 1200.000 mt, APPROVED and CONFIRMED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: OpsCoordinator
