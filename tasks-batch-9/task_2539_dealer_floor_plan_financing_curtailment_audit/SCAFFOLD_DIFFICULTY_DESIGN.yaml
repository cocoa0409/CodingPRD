            - "Third trigger call returns 422 and ${err18b} == \"ERR_AUDIT_NOTICE_TOO_SHORT\" because 2026-08-05 is only 4 days after the clock, short of AUDIT_NOTICE_DAYS 7"
            - "${au18a_status} == \"RECONCILED_CLEAN\" with units_in_scope_count == 0 and sot_exposure_cents == 0"
