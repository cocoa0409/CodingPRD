            - "PSPSEvent.${fresh_id}.benefit_variant == PRE_EVENT and duration_hours == 0"
            - "PSPSEvent.${fresh_id}.confirmed_scope_count == 0, excluded_scope_count == 0, impacted_customer_count == 0"
            - "PSPSEvent.${fresh_id}.ignition_risk_avoided_score == 0.00, customer_impact_score == 0.00, net_benefit_ratio == 0.0000"
            - "PSPSEvent.${fresh_id}.actual_de_energized_at is null, actual_restored_at is null, cancellation_reason is null"
            - "PSPSEvent.${fresh_id}.version == 1"

      - name: damage_finding_found_at_is_stamped_from_the_logical_clock
        claim_type: System Fields
        grounds:
          - entities.DamageFinding.fields.found_at
          - endpoints.POST_/damage-findings
