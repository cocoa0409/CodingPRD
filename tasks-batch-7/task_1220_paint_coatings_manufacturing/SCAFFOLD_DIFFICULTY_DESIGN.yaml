  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: voc_rule_half_open_window_overlap
        grounds:
          - state_machines.VocRule.DRAFT_to_ACTIVE
          - errors[ERR_VOC_RULE_OVERLAP]
        distinguishing_aspect: |
          VocRule resource uses half-open interval semantics [effective_from,
          effective_to): a successor starting exactly at the predecessor's
          effective_to is adjacency, not overlap, and activates cleanly; a rule
          starting one month earlier intersects and is rejected. A wildcard-rule
          window that geometrically intersects a CA rule is allowed because the
          (category, state_code) key differs.
        test_recipe:
          setup:
            - "No rules exist; clock 2026-05-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/voc-rules"
              payload: { category: "NONFLAT", state_code: "CA", max_voc_gpl: 100, effective_from: "2026-01-01", effective_to: "2027-06-01" }
              as: RegulatoryClerk
              captures: { r1: $.data.id }
            - { call: "POST /coatings/voc-rules/${r1}/activate", payload: {}, as: RegulatoryClerk }
          trigger:
            - call: "POST /coatings/voc-rules"
              payload: { category: "NONFLAT", state_code: "CA", max_voc_gpl: 50, effective_from: "2027-06-01" }
              as: RegulatoryClerk
              captures: { r2: $.data.id }
            - { call: "POST /coatings/voc-rules/${r2}/activate", payload: {}, as: RegulatoryClerk }
            - call: "POST /coatings/voc-rules"
              payload: { category: "NONFLAT", state_code: "CA", max_voc_gpl: 60, effective_from: "2027-05-01", effective_to: "2028-01-01" }
              as: RegulatoryClerk
              captures: { r3: $.data.id }
            - { call: "POST /coatings/voc-rules/${r3}/activate", payload: {}, as: RegulatoryClerk, captures: { err: $.data.error_id } }
            - call: "POST /coatings/voc-rules"
              payload: { category: "NONFLAT", state_code: "*", max_voc_gpl: 250, effective_from: "2026-06-01", effective_to: "2027-01-01" }
              as: RegulatoryClerk
              captures: { r4: $.data.id }
            - { call: "POST /coatings/voc-rules/${r4}/activate", payload: {}, as: RegulatoryClerk }
          assert:
            - "VocRule.${r2}.status == ACTIVE (adjacency at 2027-06-01 allowed under half-open semantics)"
            - "err == ERR_VOC_RULE_OVERLAP (R3 [2027-05-01, 2028-01-01) intersects R1's window)"
            - "VocRule.${r4}.status == ACTIVE (wildcard key does not collide with the CA key despite geometric overlap)"

      - name: mill_washdown_buffer_conflict
        grounds:
          - calculations.mill_reservation
          - errors[ERR_MILL_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Mill resource uses closed intervals plus a conditional 30-minute washdown
          buffer — a different interval semantics than VocRule's half-open
          adjacency: same-family batches may touch (12:00 == 12:00), cross-family
          batches must leave 30 minutes, and exactly 30 minutes passes.
        test_recipe:
          setup:
            - "F1 (LATEX_EXTERIOR) ACTIVE; F2 custom (LATEX_INTERIOR) ACTIVE; M1 capacity 200"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
