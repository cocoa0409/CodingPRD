            - "GET /compliance/refund-obligations with booking_id = ${bk_id} returns total_count == 2"
            - "the FARE obligation has amount_cents == 60000 (only segment 2 is un-flown) and the ANCILLARY obligation has amount_cents == 3000"
            - "Booking.${bk_id}.total_refund_obligated_cents == 63000"
