            - "AccrualPeriod.${pc_id}.significant_exposure_count == 1 and requires_significant_exposure_disclosure == true"
            - "FieldAction.${fa_c_id}.execution_state == NOT_STARTED and executed_cost_cents == 0"

      - name: supplier_settlement_cascades_five_hops_into_sibling_recovery_revaluation
        grounds:
          - state_machines.SupplierRecovery.ASSERTED_to_SETTLED
          - calculations.supplier_recovery_recognized
          - calculations.supplier_collectability_rating
          - entities.Supplier.fields.realization_bps
          - entities.Supplier.fields.collectability_rating
          - entities.Supplier.fields.open_recovery_asset_cents
          - entities.SupplierRecovery.fields.collectability_rating_at_valuation
        distinguishing_aspect: |
          A different trigger and a longer chain than the field-action instance: closing ONE
          recovery as SETTLED walks five hops — HOP 1 revalues the settled row to 8000000
          under CONTRACTUAL_FLOOR while the supplier is still LOW, HOP 2 recomputes the
          supplier aggregates, HOP 3 lifts realization_bps to 4706 and the rating LOW ->
          MEDIUM, HOP 4 revalues the untouched sibling recovery from 1000000 to 2400000, and
          HOP 5 recomputes open_recovery_asset_cents to 2400000 — so a row nobody addressed
          changes value because of a rating change two hops upstream.
        test_recipe:
          setup:
            - "One OPEN AccrualPeriod 2026-Q3 exists so the settlement has a booking period."
            - "Supplier SUP-2 has credit_rating AAA (base HIGH), annual_purchase_volume_cents 1000000000 and contractual_recovery_cap_bps 5000, so its cap is 500000000 cents and never binds."
            - "One earlier recovery of 9000000 cents was asserted and then WRITTEN_OFF, so written_off_recovery_cents == 9000000, closed_recovery_count == 1, realization_bps == 0 and collectability_rating has already been downgraded two notches to LOW."
            - "Two further recoveries were then created and asserted while the supplier was LOW: REC-1 for 10000000 cents (recognized 2500000) created first and REC-2 for 4000000 cents (recognized 1000000) created second, so open_recovery_asset_cents == 3500000."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { ps_id: $.data.id }
            - call: "POST /warranty/suppliers"
              payload: { supplier_code: "SUP-2", name: "Northline Components AB", credit_rating: "AAA", annual_purchase_volume_cents: 1000000000, contractual_recovery_cap_bps: 5000 }
              as: WarrantyAnalyst
              captures: { sup2_id: $.data.id }
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-N", name: "Nordic Dishwasher Platform", launch_date: "2023-05-01", base_warranty_months: 24, standard_cost_per_claim_cents: 16000, reserve_cap_cents: 80000000 }
              as: WarrantyAnalyst
              captures: { fam_n_id: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_n_id}", mode_code: "FM-N-PUMP", description: "Supplied circulation pump seizure", severity: "FUNCTIONAL", cost_per_claim_cents: 16000, supplier_id: "${sup2_id}" }
              as: WarrantyAnalyst
              captures: { fm_n_id: $.data.id }
            - call: "POST /warranty/supplier-recoveries"
              payload: { supplier_id: "${sup2_id}", failure_mode_id: "${fm_n_id}", asserted_amount_cents: 9000000 }
              as: WarrantyAnalyst
              captures: { rec0_id: $.data.id }
            - call: "POST /warranty/supplier-recoveries/${rec0_id}/assert"
              payload: {}
              as: WarrantyAnalyst
            - call: "POST /warranty/supplier-recoveries/${rec0_id}/close"
              payload: { outcome: "WRITTEN_OFF" }
              as: ReserveController
            - call: "POST /warranty/supplier-recoveries"
              payload: { supplier_id: "${sup2_id}", failure_mode_id: "${fm_n_id}", asserted_amount_cents: 10000000 }
              as: WarrantyAnalyst
              captures: { rec1_id: $.data.id }
            - call: "POST /warranty/supplier-recoveries/${rec1_id}/assert"
              payload: {}
              as: WarrantyAnalyst
            - call: "POST /warranty/supplier-recoveries"
              payload: { supplier_id: "${sup2_id}", failure_mode_id: "${fm_n_id}", asserted_amount_cents: 4000000 }
              as: WarrantyAnalyst
              captures: { rec2_id: $.data.id }
            - call: "POST /warranty/supplier-recoveries/${rec2_id}/assert"
              payload: {}
              as: WarrantyAnalyst
          trigger:
            - call: "POST /warranty/supplier-recoveries/${rec1_id}/close"
              payload: { outcome: "SETTLED", settled_amount_cents: 8000000 }
              as: ReserveController
          assert:
            - "HOP 1: SupplierRecovery.${rec1_id}.status == SETTLED, settled_amount_cents == 8000000, recognized_recovery_cents == 8000000, valuation_variant == CONTRACTUAL_FLOOR, settled_period_id == ${ps_id}, collectability_rating_at_valuation == LOW"
            - "HOP 2: Supplier.${sup2_id}.realized_recovery_cents == 8000000 and Supplier.${sup2_id}.closed_recovery_count == 2"
            - "HOP 3: Supplier.${sup2_id}.realization_bps == 4706 and Supplier.${sup2_id}.collectability_rating == MEDIUM"
            - "HOP 4: SupplierRecovery.${rec2_id}.recognized_recovery_cents == 2400000, collectability_rating_at_valuation == MEDIUM, status still ASSERTED, asserted_amount_cents still 4000000"
            - "HOP 5: Supplier.${sup2_id}.open_recovery_asset_cents == 2400000"
            - "Supplier.${sup2_id}.gross_asserted_recovery_cents == 23000000"
            - "Supplier.${sup2_id}.written_off_recovery_cents == 9000000"
            - "SupplierRecovery.${rec0_id}.recognized_recovery_cents == 0 (a WRITTEN_OFF row is never revalued by HOP 4)"

