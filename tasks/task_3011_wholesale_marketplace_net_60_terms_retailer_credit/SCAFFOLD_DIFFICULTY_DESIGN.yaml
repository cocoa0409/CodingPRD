              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
            - call: "POST /wholesale/brands"
              payload: { name: "Brand M", contact_email: "m@b.com", min_order_value_cents: 1000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
