            - "Dispatch-ready PA chain; agreement committed 500; commitment committed 100 (tolerance = 20.0 t); S1 (20.5 t) DISPATCHED and DELIVERED wet, S2 (10 t) still BOOKED, S3 (5 t) DISPATCHED before the rejection; clock default 2026-08-01"
