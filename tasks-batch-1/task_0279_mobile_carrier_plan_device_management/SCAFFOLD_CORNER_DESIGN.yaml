        excluded_because:
          difficulty_instance: combinatorial_formula / account_base_subtotal_round_per_line_then_sum_mode_b
          rationale: "Round-per-line-then-sum PLAN_BASE subtotal (18888) is asserted at cycle close by that §1.8 instance."

      - name: stub_upgrade_payoff_value_covered
