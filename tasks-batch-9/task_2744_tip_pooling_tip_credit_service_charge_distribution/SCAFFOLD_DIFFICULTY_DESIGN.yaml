  - rule_id: non_linear_state_machine
    instances:
      - name: pay_period_cycle_open_computed_approved_reopen_open
        grounds:
          - state_machines.PayPeriod
          - state_machines.PayPeriod.APPROVED_to_OPEN
          - state_machines.PayLine.FINAL_to_SUPERSEDED
          - entities.PayPeriod.fields.compute_variant
          - entities.PayPeriod.fields.approved_by_user_id
          - complexity_profile.state_machine_shape
        distinguishing_aspect: >-
          The PayPeriod machine is cyclic rather than linear: APPROVED is not terminal, reopen walks
          the period back to OPEN, and the second lap through compute must reproduce the first lap's
          figures exactly while leaving the first lap's PayLine behind as a SUPERSEDED audit row.
          The cycle also has to clear compute_variant, computed_by_user_id and approved_by_user_id,
          so a naive implementation that only flips status will leak PER_SHIFT into the reopened
          period and recompute the wrong variant.
        test_recipe:
          setup:
            - "The Texas wage world: one location at 725/213 with tip credit claimed and no pool policy, one SERVER employee with notice on file, two CLOSED and DECLARED 480-minute shifts declaring 5000 and 500 cents."
            - "The period has already been computed by op_prep_1 and approved by op_comp_1, so its single PayLine is FINAL under the PER_SHIFT variant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
