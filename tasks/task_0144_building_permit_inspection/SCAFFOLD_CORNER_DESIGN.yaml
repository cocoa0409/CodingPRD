            - "PermitApplication.${permit_id}.amount_paid == 100.00"
            - "PermitApplication.${permit_id}.balance_due == 65.00"

      - name: min_floor_base_fee_applied
        claim_type: Constants Applied
        grounds:
          - calculations.base_permit_fee
          - entities.Jurisdiction.fields.minimum_permit_fee
        distinguishing_aspect: "A tiny valuation 2000 yields raw tiered 20.00 which is floored to minimum_permit_fee 100.00, giving base 100.00 and total 165.00."
