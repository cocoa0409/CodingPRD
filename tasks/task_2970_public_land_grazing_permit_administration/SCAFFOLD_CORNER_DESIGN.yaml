      - name: corner_authorized_officer_exclusives_rejected_for_every_other_role
        claim_type: role_denied_operation
        grounds:
          - rbac.AuthorizedOfficer.exclusive_operations
          - rbac.RangeSpecialist.shared_operations
          - validations.priority_3
          - validations.priority_6
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The AuthorizedOfficer owns every approval-side write — registry creation, permit issuance/renewal/transfer, AOI issue/non-use/accept/void, bill void, assessment review, decision finalize and make-effective, closures, unauthorized-use billing and project approval — and each is refused to the authoring RangeSpecialist even though that role can *create* the same document. The contrast that makes the boundary falsifiable is the last call: POST /annual-operating-instructions is a SHARED operation, so the very same RangeSpecialist passes the role gate there and fails at the body-FK lookup instead."
