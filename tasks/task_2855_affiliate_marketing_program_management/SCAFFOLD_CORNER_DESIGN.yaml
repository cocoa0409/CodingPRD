              captures: { e_limit: "$.data.error_id" }
            - call: "POST /affiliate-applications/${app_id}/decide"
              payload: { decision: "REJECT", decision_notes: "disclosure never fixed after two rounds", expected_affiliate_version: "${aff_v1}" }
              as: PartnerManager
