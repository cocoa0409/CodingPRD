      - name: investigation_opener_cannot_clear_their_own_investigation
        claim_type: segregation_of_duties
        grounds:
          - "validations[priority 44]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - entities.Investigation.fields.opened_by_user_id
        distinguishing_aspect: "The opener pr_open_1 is denied on both clear and substantiate for the investigation it opened, while a second reviewer pr_resolve_2 succeeds on the same OPEN row, so the check compares X-User-ID against opened_by_user_id and not merely the role."
