            - "IdrSubmission.${idr_m_id}.qpa_cents == 15000 (single candidate: unit 30000 x (1 - 0.50))"

      - name: fifth_counter_expires_case_at_round_count_five
        grounds:
          - state_machines.NegotiationCase.COUNTERED_to_EXPIRED
          - entities.NegotiationCase.fields.round_count
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Zero-vs-threshold count boundary on a different metric and endpoint:
          counters 1-4 keep the case COUNTERED; the counter that pushes
          round_count to exactly 5 (>= 5, not > 5) flips the case to terminal
          EXPIRED in the same request, and a sixth counter is rejected
          ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Claim N PRICED (33000 fixture). NegotiationCase open, payer offer 30000."
            - "Four provider counters (50000, then payer re-offer 40000 between each) bring round_count to 4 with case COUNTERED."
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
