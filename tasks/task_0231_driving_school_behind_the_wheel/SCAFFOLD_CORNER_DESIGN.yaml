      - name: derived_wallet_balance_reconciles_after_two_entries
        claim_type: derived_field_reconciliation
        grounds: [entities.Student.fields.wallet_balance_cents, entities.WalletEntry.fields.amount_cents]
        distinguishing_aspect: "Two ADMIN_ADJUSTMENT entries (+5000 then -1500) leave wallet_balance_cents == 3500 (derived sum reconciled after each write)."
