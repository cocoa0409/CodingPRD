        distinguishing_aspect: |
          Interval semantics: CLOSED-CLOSED DATE INTERVALS PADDED BY A 14-DAY RECOVERY BUFFER, over the
          COOPERATING TEACHER as the contended resource. An existing placement 2026-09-01..2026-10-26
          expands to the blocked interval [2026-08-18, 2026-11-09], so a second term whose first day is
          exactly 2026-11-09 conflicts - touching a closed padded bound is an overlap - while 2026-11-10
          would be clear. The two-phase design is part of the probe: the routing filter compares raw
          intervals and therefore accepts the back-to-back term, and only confirmation applies the
          padding. The sibling instance contends a different resource (the observation cycle calendar of
          one supervisor/placement) under the opposite convention - HALF-OPEN instants with no buffer,
          where touching is legal.
