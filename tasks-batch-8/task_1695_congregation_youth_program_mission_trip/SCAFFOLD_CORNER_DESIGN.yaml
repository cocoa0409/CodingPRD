            - "prog_status == CLOSED once T1 is terminal"
            - "e_notopen == ERR_PROGRAM_NOT_OPEN (child creation gated on program state)"

      - name: itinerary_vehicle_code_conditional_requirement
        claim_type: violation_to_error
        grounds:
          - entities.ItineraryItem.fields.vehicle_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "vehicle_code is required exactly when segment_type == TRAVEL and forbidden otherwise: TRAVEL without it and SERVICE with it both fail shape validation."
        test_recipe:
          setup: ["program; trip in DRAFT"]
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id} }
