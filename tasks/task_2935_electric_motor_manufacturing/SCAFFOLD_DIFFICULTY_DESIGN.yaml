  - rule_id: cross_entity_state_dependency
    instances:

      - name: work_order_creation_blocked_while_pinned_design_sits_in_review
        grounds:
          - validations[priority=40]
          - errors[ERR_DESIGN_NOT_RELEASED]
          - endpoints[POST /work-orders]
          - state_machines.MotorDesign.REVISION_OPEN_to_IN_REVIEW
          - concurrency_rules.work-order-create-stale-design
        distinguishing_aspect: |
          The gate on POST /work-orders reads the design's CURRENT status, not the status it had
          when the customer order was confirmed: the order is legitimately CONFIRMED against a
          RELEASED design, the design then cycles RELEASED -> REVISION_OPEN -> IN_REVIEW, and the
          work order must be refused from the IN_REVIEW state even though a released version of
          that design demonstrably existed. Re-approval unblocks it, but only with a re-read
          version, because every design transition also bumped MotorDesign.version — so the
          cross-entity state check and the OCC guard both have to pass at once.
        test_recipe:
          setup:
            - "Design D1 released by u_rev_1, so the order can be confirmed."
            - "Order o1 for 12 units CONFIRMED while the design is RELEASED."
            - "Design then moved RELEASED -> REVISION_OPEN -> IN_REVIEW by its author; revision_index is 1."
