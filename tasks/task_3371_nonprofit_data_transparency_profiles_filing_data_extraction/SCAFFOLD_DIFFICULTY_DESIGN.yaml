              call: "POST /nonprofits/organizations"
              payload: { legal_name: "Northgate Pantry", ein: "111222333", org_type: "501C3", state_code: "MN" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { ng_id: $.data.id }
            - &sg_org
