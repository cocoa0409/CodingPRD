  - method: GET
    path: "/v1/projects/{id}/domains"
    description: "List domains of a project"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Domain[]"
    side_effects: []

  - method: GET
    path: "/v1/domains/{id}"
    description: "Get domain"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: []
    output: Domain
    side_effects: []

  - method: PATCH
    path: "/v1/domains/{id}"
    description: "Rename a domain with OCC"
    roles: [TeamOwner]
    code: 200
    input: ["name?", expected_domain_version]
    output: Domain
    side_effects: ["OCC check; global name uniqueness re-validated; increments Domain.version by 1"]

  - method: POST
    path: "/v1/domains/{id}/verify"
    description: "Submit domain verification outcome"
    roles: [TeamOwner, Developer]
    code: 200
    input: [outcome]
    output: Domain
    side_effects: ["PENDING -> VERIFIED (spawn Certificate ISSUING) or FAILED"]

  - method: POST
    path: "/v1/domains/{id}/reverify"
    description: "Reset a FAILED domain back to PENDING for retry"
    roles: [TeamOwner, Developer]
    code: 200
    input: []
    output: Domain
    side_effects: ["verification_status FAILED -> PENDING"]

  - method: DELETE
    path: "/v1/domains/{id}"
    description: "Remove domain assignment"
    roles: [TeamOwner]
    code: 204
    input: []
    output: null
    side_effects: ["ACTIVE certificates of the domain -> REVOKED"]

  # --- Certificates ---
  - method: GET
    path: "/v1/domains/{id}/certificates"
    description: "List certificates of a domain"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Certificate[]"
    side_effects: []

  - method: GET
    path: "/v1/certificates/{id}"
    description: "Get certificate"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: []
    output: Certificate
    side_effects: []

  - method: POST
    path: "/v1/certificates/{id}/complete"
    description: "Mark issuance complete (system)"
    roles: [SystemWebhook]
    code: 200
    input: []
    output: Certificate
    side_effects: ["ISSUING -> ACTIVE; not_before/not_after set; prior ACTIVE -> EXPIRED; suspended domain -> ACTIVE"]

  - method: POST
    path: "/v1/certificates/{id}/revoke"
    description: "Revoke certificate"
    roles: [TeamOwner]
    code: 200
    input: []
    output: Certificate
    side_effects: ["ACTIVE -> REVOKED; domain.certificate_id=null; domain -> SUSPENDED"]

  # --- Redirects ---
  - method: POST
    path: "/v1/projects/{id}/redirects"
    description: "Create redirect rule"
    roles: [TeamOwner, Developer]
    code: 201
    input: [source, target, status_code, priority]
    output: Redirect
    side_effects: []

  - method: GET
    path: "/v1/projects/{id}/redirects"
    description: "List redirects of a project (sorted by priority ASC)"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Redirect[]"
    side_effects: []

  - method: GET
    path: "/v1/redirects/{id}"
    description: "Get redirect"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: []
    output: Redirect
    side_effects: []

  - method: DELETE
    path: "/v1/redirects/{id}"
    description: "Delete redirect"
    roles: [TeamOwner, Developer]
    code: 204
    input: []
    output: null
    side_effects: []

  # --- Usage periods & events ---
  - method: POST
    path: "/v1/teams/{teamId}/usage-periods"
    description: "Open a usage period"
    roles: [TeamBillingManager, PlatformAdmin]
    code: 201
    input: [period_start, period_end]
    output: UsagePeriod
    side_effects: ["status=OPEN; counters zeroed; only one OPEN period per team (ERR_USAGE_PERIOD_OVERLAP)"]

  - method: GET
    path: "/v1/teams/{teamId}/usage-periods"
    description: "List usage periods of a team"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "UsagePeriod[]"
    side_effects: []

  - method: GET
    path: "/v1/usage-periods"
    description: "List usage periods across teams, filterable by team_id"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager]
    code: 200
    input: ["team_id?", "status?", "limit?", "offset?"]
    output: "UsagePeriod[]"
    side_effects: []

  - method: GET
    path: "/v1/usage-periods/{id}"
    description: "Get usage period with aggregates"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager]
    code: 200
    input: []
    output: UsagePeriod
    side_effects: []

  - method: POST
    path: "/v1/usage-periods/{id}/close"
    description: "Close period: convert ESTIMATED events, compute final bill"
    roles: [TeamBillingManager, PlatformAdmin]
    code: 200
    input: []
    output: UsagePeriod
    side_effects: ["ESTIMATED events -> RECORDED; final_bill_cents + per-event effective_rate_cents computed; total_due_cents = final_bill_cents + prorated_charges_cents; status -> CLOSED"]

  - method: POST
    path: "/v1/usage-periods/{id}/invoice"
    description: "Invoice a closed period"
    roles: [TeamBillingManager]
    code: 200
    input: []
    output: UsagePeriod
    side_effects: ["status -> INVOICED; team.prorated_charges_cents reset to 0"]

  - method: POST
    path: "/v1/teams/{teamId}/usage-events"
    description: "Ingest a metering event into the team's OPEN period"
    roles: [SystemWebhook, PlatformAdmin]
    code: 201
    input: [deployment_id, event_type, "bandwidth_bytes?", "invocations?", region, "edge_execution?", "status?"]
    output: UsageEvent
    side_effects: ["period aggregates updated; projected_bill_cents recomputed; matching AlertRules evaluated; ACTIVE SpendCap evaluated (may trip and cascade)"]

  - method: GET
    path: "/v1/usage-periods/{id}/usage-events"
    description: "List events of a period"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager]
    code: 200
    input: ["event_type?", "deployment_id?", "status?", "limit?", "offset?"]
    output: "UsageEvent[]"
    side_effects: []

  - method: GET
    path: "/v1/usage-events"
    description: "List usage events across teams, filterable by team_id or deployment_id"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager]
    code: 200
    input: ["team_id?", "deployment_id?", "event_type?", "limit?", "offset?"]
    output: "UsageEvent[]"
    side_effects: []

  - method: GET
    path: "/v1/usage-events/{id}"
    description: "Get a usage event by id"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager]
    code: 200
    input: []
    output: UsageEvent
    side_effects: []

  # --- Alert rules ---
  - method: POST
    path: "/v1/teams/{teamId}/alert-rules"
    description: "Create usage alert rule"
    roles: [TeamBillingManager]
    code: 201
    input: [metric, threshold_value, "window_minutes?"]
    output: AlertRule
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/v1/teams/{teamId}/alert-rules"
    description: "List alert rules"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "AlertRule[]"
    side_effects: []

  - method: GET
    path: "/v1/alert-rules"
    description: "List alert rules across teams, filterable by team_id"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager]
    code: 200
    input: ["team_id?", "limit?", "offset?"]
    output: "AlertRule[]"
    side_effects: []

  - method: GET
    path: "/v1/alert-rules/{id}"
    description: "Get alert rule"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager]
    code: 200
    input: []
    output: AlertRule
    side_effects: []

  - method: DELETE
    path: "/v1/alert-rules/{id}"
    description: "Disable alert rule"
    roles: [TeamBillingManager]
    code: 204
    input: []
    output: null
    side_effects: ["status -> DISABLED"]

  # --- Spend caps ---
  - method: POST
    path: "/v1/teams/{teamId}/spend-caps"
    description: "Create spend cap (one per team)"
    roles: [TeamBillingManager]
    code: 201
    input: [cap_cents, action]
    output: SpendCap
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/v1/teams/{teamId}/spend-caps"
    description: "List spend caps of a team (0 or 1)"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "SpendCap[]"
    side_effects: []

  - method: GET
    path: "/v1/spend-caps"
    description: "List spend caps across teams, filterable by team_id"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager]
    code: 200
    input: ["team_id?", "limit?", "offset?"]
    output: "SpendCap[]"
    side_effects: []

  - method: GET
    path: "/v1/spend-caps/{id}"
    description: "Get spend cap"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager]
    code: 200
    input: []
    output: SpendCap
    side_effects: []

  - method: PATCH
    path: "/v1/spend-caps/{id}"
    description: "Update cap amount/action with OCC; may reset TRIPPED -> ACTIVE"
    roles: [TeamBillingManager]
    code: 200
    input: ["cap_cents?", "action?", expected_spendcap_version]
    output: SpendCap
    side_effects: ["OCC check; increments SpendCap.version by 1; if TRIPPED and projected bill < new cap_cents: status -> ACTIVE (project stays SUSPENDED until resume)"]

  - method: DELETE
    path: "/v1/spend-caps/{id}"
    description: "Disable spend cap"
    roles: [TeamBillingManager]
    code: 204
    input: []
    output: null
    side_effects: ["status -> DISABLED"]

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Certificate expiry sweep: ACTIVE certs with not_after <= clock -> EXPIRED (+ renewal cascade when domain VERIFIED); AlertRule auto-reset sweep"]

  # --- Usage summary (computed read) ---
  - method: GET
    path: "/v1/teams/{teamId}/usage-summary"
    description: "Computed read: current OPEN period aggregates and projected bill"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager]
    code: 200
    input: []
    output: UsagePeriod
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role undeclared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_TEAM_NOT_FOUND, http: 404, condition: "Team id does not exist" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "Project id does not exist" }
  - { id: ERR_DEPLOYMENT_NOT_FOUND, http: 404, condition: "Deployment id does not exist" }
  - { id: ERR_DOMAIN_NOT_FOUND, http: 404, condition: "Domain id does not exist" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "Certificate id does not exist" }
  - { id: ERR_ENV_VAR_NOT_FOUND, http: 404, condition: "EnvironmentVariable id does not exist" }
  - { id: ERR_REDIRECT_NOT_FOUND, http: 404, condition: "Redirect id does not exist" }
  - { id: ERR_USAGE_PERIOD_NOT_FOUND, http: 404, condition: "UsagePeriod id does not exist" }
  - { id: ERR_ALERT_RULE_NOT_FOUND, http: 404, condition: "AlertRule id does not exist" }
  - { id: ERR_SPEND_CAP_NOT_FOUND, http: 404, condition: "SpendCap id does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "plan_tier references no PlanCatalogEntry" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, unknown enum value, or empty scopes array" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state permitting the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match current entity version (OCC)" }
  - { id: ERR_PROJECT_ARCHIVED, http: 409, condition: "Mutation attempted on an ARCHIVED project or its children" }
  - { id: ERR_PROJECT_SUSPENDED, http: 409, condition: "Deploy/promote/rollback attempted while project SUSPENDED (spend cap breach)" }
  - { id: ERR_USAGE_PERIOD_CLOSED, http: 409, condition: "Usage event ingested when no OPEN period exists for the team" }
  - { id: ERR_USAGE_PERIOD_OVERLAP, http: 409, condition: "Opening a period while another period of the team is OPEN or the [start,end) interval overlaps an existing period" }
  - { id: ERR_INVALID_PERIOD_RANGE, http: 422, condition: "period_end must be strictly after period_start" }
  - { id: ERR_USAGE_EVENT_SHAPE, http: 422, condition: "BANDWIDTH events require bandwidth_bytes>=1 and invocations==0; INVOCATION events require invocations>=1 and bandwidth_bytes==0" }
  - { id: ERR_ENV_SCOPE_OVERLAP, http: 409, condition: "Another env var with same key in project already covers one of the requested scopes" }
  - { id: ERR_DOMAIN_ALREADY_ASSIGNED, http: 409, condition: "Domain name already assigned to any project" }
  - { id: ERR_SPEND_CAP_EXISTS, http: 409, condition: "Team already has a non-DISABLED spend cap" }
  - { id: ERR_MEMBER_ALREADY_EXISTS, http: 409, condition: "Email already a member of the team" }
  - { id: ERR_REDIRECT_PRIORITY_CONFLICT, http: 409, condition: "Another redirect in the project already uses this priority" }
  - { id: ERR_SEAT_LIMIT_EXCEEDED, http: 422, condition: "seats_used == seat_limit at member insert (boundary: at limit is rejected)" }
  - { id: ERR_BUILD_MINUTES_EXHAUSTED, http: 402, condition: "reserved + estimated_build_minutes > included_build_minutes at deployment admission" }
  - { id: ERR_BUILD_CONCURRENCY_EXCEEDED, http: 409, condition: "Team BUILDING count >= build_concurrency_limit at build-start" }
  - { id: ERR_NO_PRIOR_DEPLOYMENT, http: 409, condition: "Rollback requested with no prior production deployment" }
  - { id: ERR_CANNOT_CANCEL_PRODUCTION, http: 409, condition: "Cancel attempted on a PROMOTED/production deployment" }
  - { id: ERR_SPEND_CAP_STILL_TRIPPED, http: 409, condition: "Resume attempted while projected bill still >= ACTIVE BLOCK_DEPLOYS_AND_SUSPEND cap" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; manages plan catalog and clock; superset read access"
    identity: opaque
    exclusive_operations:
      - "POST /v1/plan-catalog"
      - "POST /v1/teams"
      - "POST /v1/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across the surface"
      - "POST /v1/teams/{teamId}/usage-periods"
      - "POST /v1/usage-periods/{id}/close"
      - "POST /v1/teams/{teamId}/usage-events"
      - "PATCH /v1/teams/{id}"

  - name: TeamOwner
    description: "Team owner; membership, project lifecycle, promote, rollback, archive, resume"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /v1/teams/{teamId}/members"
      - "DELETE /v1/teams/{teamId}/members/{id}"
      - "POST /v1/projects/{id}/archive"
      - "POST /v1/projects/{id}/resume"
      - "POST /v1/projects/{id}/rollback"
      - "PATCH /v1/domains/{id}"
      - "DELETE /v1/domains/{id}"
      - "POST /v1/certificates/{id}/revoke"
    shared_operations:
      - "POST /v1/teams/{teamId}/projects"
      - "PATCH /v1/projects/{id}"
      - "POST /v1/deployments/{id}/promote"
      - "POST /v1/deployments/{id}/cancel"
      - "env var and domain and redirect create/patch"
      - "GET endpoints across the surface"

  - name: TeamBillingManager
    description: "Billing manager; usage periods, alert rules, spend caps, plan changes"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /v1/usage-periods/{id}/invoice"
      - "POST /v1/teams/{teamId}/alert-rules"
      - "DELETE /v1/alert-rules/{id}"
      - "POST /v1/teams/{teamId}/spend-caps"
      - "PATCH /v1/spend-caps/{id}"
      - "DELETE /v1/spend-caps/{id}"
    shared_operations:
      - "POST /v1/teams/{teamId}/usage-periods"
      - "POST /v1/usage-periods/{id}/close"
      - "PATCH /v1/teams/{id}"
      - "GET endpoints across the surface"

  - name: Developer
    description: "Developer; creates projects, env vars, domains, redirects; cancels and promotes deployments"
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /v1/teams/{teamId}/projects"
      - "PATCH /v1/projects/{id}"
      - "POST /v1/deployments/{id}/promote"
      - "POST /v1/deployments/{id}/cancel"
      - "env var create/patch/delete"
      - "domain create/verify/reverify"
      - "redirect create/delete"
      - "GET endpoints across the surface"

  - name: Viewer
    description: "Read-only member"
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "GET endpoints across the surface"

  - name: SystemWebhook
    description: "Git/build worker integration; emits git events, build lifecycle, and certificate completion"
    identity: opaque
    exclusive_operations:
      - "POST /v1/git-events"
      - "POST /v1/deployments/{id}/build-start"
      - "POST /v1/deployments/{id}/build-complete"
      - "POST /v1/certificates/{id}/complete"
    shared_operations:
      - "POST /v1/teams/{teamId}/usage-events"
