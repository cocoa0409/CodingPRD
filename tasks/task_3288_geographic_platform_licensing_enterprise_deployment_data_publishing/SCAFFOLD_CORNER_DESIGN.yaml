          assert:
            - "response 403 and err == ERR_INSUFFICIENT_USER_LEVEL"
            - "sharing_level remains ORGANIZATION and version unchanged"

      - name: segregation_of_duties_blocks_self_decision
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", errors.ERR_SEGREGATION_OF_DUTIES_VIOLATION]
        distinguishing_aspect: "A ComplianceOfficer whose X-User-ID equals the EV submitter's NamedUser id cannot decide the EV — even though the role is correct, the identity check rejects with 403."
        test_recipe:
          setup: ["Base chain; EV submitted by ada and moved UNDER_REVIEW by another officer."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
            - *c_user
            - *c_accept
            - call: "POST /geo-orgs/eligibility-verifications"
