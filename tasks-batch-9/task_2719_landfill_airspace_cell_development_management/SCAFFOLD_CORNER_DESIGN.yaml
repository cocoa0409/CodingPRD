              payload: { certified_net_tons: 100.00 }
              as: ScaleOperator
              as_user_id: "${lf_id}"
            - call: "POST /waste-loads/${l2_id}/clear-screening"
              payload: {}
              as: ScaleOperator
              as_user_id: "${lf_id}"
              captures: { l2_gate: $.data.gate_charge_amount }
            - call: "POST /waste-loads/${l2_id}/certify-weight"
              payload: { certified_net_tons: 92.00 }
              as: ScaleOperator
              as_user_id: "${lf_id}"
            - call: "POST /waste-loads/${l1_id}/clear-screening"
              payload: {}
              as: ScaleOperator
              as_user_id: "${lf_id}"
              captures: { l1_gate: $.data.gate_charge_amount }
            - call: "POST /waste-loads/${l1_id}/certify-weight"
              payload: { certified_net_tons: 45.25 }
              as: ScaleOperator
              as_user_id: "${lf_id}"
          trigger:
            - call: "POST /operating-days/${od_id}/close"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { od_tons: $.data.tons_placed, od_dens: $.data.effective_density_tons_per_cy, od_air: $.data.airspace_consumed_cy }
            - call: "GET /operating-days/${od_id}/waste-loads"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { lf_consumed: $.data.consumed_airspace_cy, lf_life: $.data.remaining_life_years }
          assert:
            - "gate charges priced on MANIFEST tons: ${l1_gate} == 1850.00, ${l2_gate} == 4162.50, ${l3_gate} == 1387.50"
            - "L-1 finalizes first (cumulative 0): tier1_tons 45.25, host_royalty_amount == 76.93 (round(45.25 * 42.50 * 0.04, 2)), final_charge_amount == 2169.75"
            - "L-2 finalizes second (cumulative 45.25): tier1_tons 54.75 and tier2_tons 37.25, comp1 == 93.08, comp2 == 110.82, host_royalty_amount == 203.90, final_charge_amount == 4458.90 — the tier boundary is crossed INSIDE this load"
            - "L-3 finalizes third (cumulative 137.25): tier1_tons 0 and tier2_tons 100.00, host_royalty_amount == 297.50, final_charge_amount == 4922.50 — a clearing-order implementation would have given L-3 the tier-1 allowance and produced 4795.00 instead"
            - "${od_tons} == 237.25, ${od_dens} == 0.8500 (ALTERNATIVE_TARP factor 1.0 and a 5000 sf face impose no penalty, so the clamp caps the value at 0.85) and ${od_air} == 279.12"
