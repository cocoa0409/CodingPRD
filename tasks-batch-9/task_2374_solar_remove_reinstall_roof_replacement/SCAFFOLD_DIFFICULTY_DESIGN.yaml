  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_posture_priority_10_outranks_bin_capacity_priority_29_on_storage
        grounds:
          - validations[priority=10]
          - validations[priority=29]
          - errors.ERR_PROJECT_POSTURE_FROZEN
          - calculations.project_posture
        distinguishing_aspect: |
          Pairs business_safety (priority 10) against business_fiscal (priority 29) in a single request
          that violates both: the project is FROZEN by an OPEN CRITICAL finding and the only bin is
          already full. The response must be ERR_PROJECT_POSTURE_FROZEN (409), not
          ERR_BIN_CAPACITY_EXCEEDED, and the unit must remain REMOVED with no storage_bin_id.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A HOST_OWNED project consented by roofer and solar owner, one circuit S1, and one bin BIN-A with capacity_slots 1."
            - "Two panels u1 and u2 are registered on S1; the circuit is de-energized and both panels are removed while posture is still OPEN."
            - "u1 is stored, so BIN-A.occupied_slots == 1 == capacity_slots."
            - "A CRITICAL MOISTURE_INTRUSION finding is then recorded, so posture becomes FROZEN while u2 is still REMOVED."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
