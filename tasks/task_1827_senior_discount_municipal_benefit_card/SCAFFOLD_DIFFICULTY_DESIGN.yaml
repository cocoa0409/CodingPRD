            - { call: "POST /senior-benefits/applications/${app_x}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "X-AGE" }, as: Applicant, captures: { xdoc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_x}/documents/${xdoc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_x}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "X-INC" }, as: Applicant, captures: { xdoc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_x}/documents/${xdoc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_x}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "X-RES" }, as: Applicant, captures: { xdoc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_x}/documents/${xdoc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_x}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_x: $.data.cardholder_id } }
            - { call: "GET /senior-benefits/cardholders/${ch_x}/cards", as: ProgramAdministrator, captures: { card_x: "$.data[0].id" } }
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Yara Senior", date_of_birth: "1960-01-01", annual_income_cents: 900000, residency_address: "3 Elm St" }, as: Applicant, captures: { app_y: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_y}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_y}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "Y-AGE" }, as: Applicant, captures: { ydoc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_y}/documents/${ydoc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_y}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "Y-INC" }, as: Applicant, captures: { ydoc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_y}/documents/${ydoc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_y}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "Y-RES" }, as: Applicant, captures: { ydoc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_y}/documents/${ydoc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_y}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_y: $.data.cardholder_id } }
            - { call: "GET /senior-benefits/cardholders/${ch_y}/cards", as: ProgramAdministrator, captures: { card_y: "$.data[0].id" } }
            - { call: "POST /senior-benefits/merchants", payload: { name: "Velocity Mart", reimbursement_rate_pct: 10, monthly_reimbursement_cap_cents: 100000 }, as: ProgramAdministrator, captures: { m_id: $.data.id } }
            - { call: "POST /senior-benefits/merchants/${m_id}/offers", payload: { category: GROCERY, discount_pct: 10, max_discount_cents: 100, valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T20:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_x}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_x}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_x}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_x}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_y}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_y}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_y}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_y}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T08:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_y}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_y}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_y}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_y}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_y}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}", captures: { y5_status: $.data.status } }
          trigger:
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T10:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_x}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}", captures: { x_probe_status: $.data.status } }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_y}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}", captures: { y_err: $.data.error_id } }
          assert:
            - "X probe transaction status == POSTED: calendar_day_count == 1 (< 5) so no auto-flag, even though trailing_24h_count == 5 — had the trailing-24h variant governed flagging it would be FLAGGED"
            - "Y's 5th transaction on 2026-08-11 (y5_status) == FLAGGED (calendar-day count 5 >= 5); fraud_flag_count == 1 so no suspension"
            - "Y probe at 2026-08-11T10:00 is rejected with error_id ERR_VELOCITY_HARD_LIMIT: trailing_24h_count == 9 + 1 == 10 >= 10, even though calendar_day_count == 6 would only flag"
            - "The two variants therefore produce different inclusion sets and different outcomes for the same history"

  - rule_id: combinatorial_formula
    instances:
      - name: discount_min_chain_selects_monthly_remaining
        grounds:
          - calculations.discount_amount
          - entities.UsageTransaction.fields.discount_cents
        distinguishing_aspect: |
          Combinatorial mode (a) — a >= 3-input formula with nested min and
          state-dependent branching: purchase 2000 at 25% gives raw 500, the
          per-transaction cap is 700, and the cardholder's monthly remaining is
          exactly 100 after 4900 of prior same-month discounts; the min chain
          selects the state-dependent remaining (100), not raw (500) or cap (700).
        test_recipe:
          setup:
            - "Cardholder onboarded with ACTIVE card; merchant (rate 10, cap 100000) with GROCERY offer 25% off, max_discount_cents 700, window [2026-01-01, 2027-01-01)"
            - "Clock 2026-08-03T10:00:00Z: four transactions of purchase 2800, each discount = min(700 raw, 700 cap, remaining) = 700"
            - "Clock 2026-08-04T10:00:00Z: three more purchase 2800 transactions (day counts 1-3), discounts 700 each — month_used == 4900, remaining == 100"
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Minnie Chain", date_of_birth: "1959-03-03", annual_income_cents: 800000, residency_address: "4 Pine St" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "M-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "M-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "M-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_id: $.data.cardholder_id } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}/cards", as: ProgramAdministrator, captures: { card_id: "$.data[0].id" } }
            - { call: "POST /senior-benefits/merchants", payload: { name: "Min Mart", reimbursement_rate_pct: 10, monthly_reimbursement_cap_cents: 100000 }, as: ProgramAdministrator, captures: { m_id: $.data.id } }
            - { call: "POST /senior-benefits/merchants/${m_id}/offers", payload: { category: GROCERY, discount_pct: 25, max_discount_cents: 700, valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 2800 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 2800 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 2800 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 2800 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T10:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 2800 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 2800 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 2800 }, as: MerchantOperator, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 2000 }, as: MerchantOperator, as_user_id: "${m_id}", captures: { txn_id: $.data.id, disc: $.data.discount_cents, st: $.data.status } }
          assert:
            - "UsageTransaction.${txn_id}.discount_cents == 100 — min(raw 500, cap 700, monthly remaining 5000-4900 == 100) selects the remaining"
            - "UsageTransaction.${txn_id}.status == POSTED (4th transaction that day, below the flag threshold)"
            - "discount_cents (100) != raw (500) and != cap (700): all three min-chain terms are distinguishable"

      - name: claim_rounding_per_line_then_sum
        grounds:
          - calculations.merchant_claim_amount
          - entities.ReimbursementClaim.fields.provisional_amount_cents
        distinguishing_aspect: |
          Combinatorial mode (b) — nested rounding where order matters (different
          mode from instance discount_min_chain_selects_monthly_remaining): three
          lines of discount 101 at 50% reimburse to round_half_up(50.5)=51 per line,
          summed 153; the alternative sum-then-round order gives
          round_half_up(303*0.5)=round_half_up(151.5)=152. The scaffold pins
          round-per-line-then-sum, so the claim is 153, not 152.
        test_recipe:
          setup:
            - "Cardholder onboarded with ACTIVE card; merchant rate 50 cap 100000; GROCERY offer 10% max 1000 over [2026-01-01, 2027-01-01)"
            - "Clock 2026-08-05T10:00:00Z: three transactions of purchase 1010, discount_cents == 101 each (round_half_up(101.0))"
            - "Clock 2026-09-01: period 2026-08 closed"
          setup_api_calls:
