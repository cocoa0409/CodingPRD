              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { e1: $.data.id }
            - call: "GET /scouting/draft-boards/${b1}"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { bv: $.data.version }
          trigger:
            - call: "POST /scouting/draft-boards/${b1}/entries/reorder"
              payload: { entry_id: "${e1}", new_rank: 0, expected_board_version: "${bv}" }
