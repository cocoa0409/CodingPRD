            - { call: "POST /visits", payload: { storm_event_id: "${e}", contract_site_id: "${cs}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { v1: $.data.id } }
          trigger:
