            - call: "GET /roi/requests/${rq}"
              payload: {}
              as: BillingClerk
              as_user_id: "u-bill-1"
            - call: "GET /roi/requests/${rq}/turnaround"
              payload: {}
              as: BillingClerk
              as_user_id: "u-bill-1"
            - call: "GET /roi/requests"
              payload: { fulfillment_status: "COMPILATION" }
              as: PrivacyOfficer
              as_user_id: "u-privacy-1"
            - call: "GET /roi/requests/${rq}/compliance-events"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "u-privacy-1"
          assert:
            - "before the accept, the turnaround read reports statutory_due_at null, breached false and penalty_exposure_cents 0 — nothing is deadlined until intake accepts"
            - "the accept response body itself already carries fulfillment_status \"COMPILATION\", statutory_anchor_at \"2026-08-01T00:00:00Z\" and statutory_due_at \"2026-08-31T00:00:00Z\""
            - "the immediately following GET /roi/requests/${rq}, performed by a DIFFERENT user in a different role, returns byte-identical fulfillment_status and statutory_due_at values — no re-read, retry or sweep is needed"
            - "the immediately following turnaround read returns statutory_due_at \"2026-08-31T00:00:00Z\", tolled_seconds 0, extension_applied false, breached false, days_late_strict 0, days_late_business 0, chargeable_days 0, penalty_exposure_cents 0"
            - "GET /roi/requests?fulfillment_status=COMPILATION returns total_count == 1 containing ${rq} — the index the list reads is current as of the same instant, so a just-moved request is never missing from its new bucket"
            - "GET /roi/requests/${rq}/compliance-events returns total_count == 0: an on-time accept appends no event, so the empty log is itself an immediate, exact read"

      - name: derived_aggregates_settle_inside_the_write_that_moves_them
        claim_type: immediate_consistency
        grounds:
          - envelope.consistency_model
          - calculations.request_page_ledger
          - calculations.facility_money_ledger
          - entities.Facility.receivable_cents
        distinguishing_aspect: >
          Aggregates that live on a DIFFERENT entity from the one being written are
          the interesting case for an immediate model: a segment disposition must
          leave the parent's page ledger correct on the next read, and an invoice
          issue must leave the facility's receivable correct on the next read, with
          no recompute endpoint and no sweep in between. The compliance sweep is
          then run to prove it changes none of those numbers.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; CA fee rule; facility; patient; ATTORNEY requester with a VALID authorization."
