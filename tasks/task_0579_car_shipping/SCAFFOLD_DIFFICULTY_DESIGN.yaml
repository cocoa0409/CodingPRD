            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1200, transport_type: "OPEN", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_id: $.data.id }
            - call: "POST /shipment-orders/${order_id}/vehicles"
              payload: { make: "Honda", model: "Civic", year: 2020, declared_value_cents: 1000000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "GET /shipment-orders/${order_id}"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_vq: $.data.version }
            - call: "POST /shipment-orders/${order_id}/quotes"
              payload: { expected_order_version: "${order_vq}" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { quote_id: $.data.id }
            - call: "POST /shipment-orders/${order_id}/quotes/${quote_id}/accept"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "POST /shipment-orders/${order_id}/ledger-entries"
              payload: { kind: "DEPOSIT", amount_cents: 20000 }
              as: Broker
            - call: "POST /shipment-orders/${order_id}/listings"
              payload: { offered_carrier_pay_cents: 50000 }
              as: Broker
              captures: { listing_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Rev Carrier", mc_number: "MC-1818", cargo_insurance_limit_cents: 3000000, insurance_expiry_date: "2027-01-01T00:00:00Z", equipment_type: "OPEN" }
              as: Broker
              captures: { carrier_id: $.data.id }
            - call: "POST /listings/${listing_id}/offers"
              payload: { ask_pay_cents: 50000, pickup_eta: "2026-06-02T09:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /listings/${listing_id}/offers/${offer_id}/accept"
              payload: {}
              as: Broker
              captures: { assignment_id: $.data.id }
          trigger:
            - call: "POST /assignments/${assignment_id}/revoke"
              payload: {}
