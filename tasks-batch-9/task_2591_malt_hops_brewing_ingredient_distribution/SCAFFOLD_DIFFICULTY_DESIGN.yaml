      - name: declare_default_posts_settlement_holds_brewer_freezes_order_and_releases_pallets
        cascade_depth: 5
        grounds:
          - state_machines.HopContract.ACTIVE_to_DEFAULTED
          - calculations.contract_default_settlement
          - calculations.brewer_credit_posture
          - state_machines.SalesOrder.APPROVED_to_ON_HOLD
          - state_machines.ColdChainShipment.STAGED_to_HELD
          - calculations.zone_occupancy_projection
        chain: |
          LINK 1 — POST /hop-contracts/{id}/declare-default runs
          contract_default_settlement (MARKET_SETTLED, because the parent program is
          HARVEST_REPORTED) for settlement_total_cents 1014900 and adds it to
          Brewer.ar_balance_cents.
          LINK 2 (caused by link 1's ar_balance_cents increase) — the Brewer re-runs
          brewer_credit_posture: credit_exposure_cents becomes
          1014900 + 168380 = 1183280 against a 1000000 limit, so
          credit_utilization_pct is 118.33 and credit_status flips
          GOOD_STANDING -> HOLD.
          LINK 3 (caused by link 2's credit_status becoming HOLD) — every CONFIRMED
          order of that brewer whose credit_status is APPROVED transitions
          credit_status APPROVED -> ON_HOLD while fulfillment_status stays CONFIRMED.
          LINK 4 (caused by link 3's order going ON_HOLD) — that order's STAGED
          ColdChainShipment transitions STAGED -> HELD.
          LINK 5 (caused by link 4's HELD transition) — the shipment leaves the
          zone_occupancy_projection input set, so ColdStorageZone.occupied_pallets
          falls from 3 to 0.
        distinguishing_aspect: |
          A different trigger and the opposite direction of travel from the
          harvest-report cascade: the entry point is a fiscal event
          (declare-default) rather than a supply event, and the chain runs from
          money OUTWARD into physical warehouse space —
          contract -> brewer AR -> brewer posture -> order credit dimension ->
          shipment -> zone pallets. No line is trimmed and no order is repriced
          anywhere in this chain; total_cents stays at 168380 throughout.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer 'Thin Margin Brewing' with credit_limit_cents 1000000, cold_chain_certified true, legacy_trailing_lbs 0."
            - "Crop-year program 2026, HARVEST_REPORTED at 100.00 percent so MARKET_SETTLED applies and no contract is short."
            - "Hop variety Citra with spot_price_cents_per_lb 51.00, available_spot_lbs 20000."
            - "Malt product Pale Ale Malt with a 20000 lb lot analysed and released by two different users."
            - "Cold storage zone Z1 with capacity_pallets 10 and temp_setpoint_c 2.0."
            - "An ACTIVE 5000 lb contract at 250.00 cents/lb with committed_lbs 0 and remaining_lbs 5000 — untouched by the order below."
            - "A CONFIRMED order with credit_status APPROVED carrying a 1000 lb malt line and an 880 lb SPOT Citra line, total_cents 168380, and a STAGED 3-pallet shipment in Z1 covering the current clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Thin Margin Brewing", brewery_license_no: "BR-0008", credit_terms_days: 30, credit_limit_cents: 1000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { b3_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { prog26_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { citra_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { malt_pale_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${malt_pale_id}", lot_code: "LOT-2602", quantity_lbs: 20000 }
              as: WarehouseOperator
              captures: { lot3_id: $.data.id }
            - call: "POST /malt-lots/${lot3_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 92.00 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
            - call: "POST /malt-lots/${lot3_id}/release"
              payload: { release_note: "cleared" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
            - call: "POST /cold-storage-zones"
              payload: { zone_code: "Z1", temp_setpoint_c: 2.0, capacity_pallets: 10, tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { zone1_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${b3_id}", variety_id: "${citra_id}", crop_year_program_id: "${prog26_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 250.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { cb_id: $.data.id }
            - call: "POST /crop-year-programs/${prog26_id}/report-harvest"
              payload: { harvest_yield_pct: 100.00, reported_note: "full crop" }
              as: AllocationManager
            - call: "POST /sales-orders"
              payload: { brewer_id: "${b3_id}", requested_ship_date: "2026-09-20T00:00:00Z", purchase_order_ref: "PO-5001" }
              as: Brewer
              as_user_id: "${b3_id}"
              captures: { ob_id: $.data.id }
            - call: "POST /sales-orders/${ob_id}/lines"
              payload: { item_type: "MALT", quantity: 1000, uom: "LB", malt_lot_id: "${lot3_id}" }
              as: Brewer
              as_user_id: "${b3_id}"
              captures: { lb1_id: $.data.id }
            - call: "POST /sales-orders/${ob_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "${citra_id}" }
              as: Brewer
              as_user_id: "${b3_id}"
              captures: { lb2_id: $.data.id }
            - call: "POST /sales-orders/${ob_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${b3_id}"
            - call: "POST /sales-orders/${ob_id}/credit-decision"
              payload: { decision: "APPROVE", decision_note: "within limit" }
              as: CreditManager
            - call: "GET /sales-orders/${ob_id}"
              payload: {}
              as: WarehouseOperator
              captures: { ob_v: $.data.version }
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${ob_id}", cold_storage_zone_id: "${zone1_id}", expected_sales_order_version: "${ob_v}", pallet_count: 3, stage_from: "2026-08-01T00:00:00Z", stage_until: "2026-08-02T00:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { sb_id: $.data.id }
          trigger:
            - call: "POST /hop-contracts/${cb_id}/declare-default"
              payload: { default_reason: "brewer repudiated the crop-year commitment" }
              as: AllocationManager
              as_user_id: "alloc-mgr-1"
              captures: { settle_total: $.data.settlement_total_cents }
          assert:
            - "BEFORE the trigger: SalesOrder.${ob_id}.total_cents == 168380 and SalesOrder.${ob_id}.credit_status == APPROVED"
            - "BEFORE the trigger: Brewer.${b3_id}.credit_utilization_pct == 16.84 and Brewer.${b3_id}.credit_status == GOOD_STANDING"
            - "BEFORE the trigger: ColdChainShipment.${sb_id}.status == STAGED and ColdStorageZone.${zone1_id}.occupied_pallets == 3"
            - "LINK 1: HopContract.${cb_id}.status == DEFAULTED and HopContract.${cb_id}.settlement_variant == MARKET_SETTLED"
            - "LINK 1: HopContract.${cb_id}.settlement_damages_cents == 995000 and HopContract.${cb_id}.settlement_admin_fee_cents == 19900"
            - "LINK 1: ${settle_total} == 1014900 and Brewer.${b3_id}.ar_balance_cents == 1014900"
            - "LINK 1: HopContract.${cb_id}.defaulted_lbs == 5000 and HopContract.${cb_id}.remaining_lbs == 0 and HopContract.${cb_id}.defaulted_by_user_id == alloc-mgr-1"
            - "LINK 2: Brewer.${b3_id}.open_order_exposure_cents == 168380"
            - "LINK 2: Brewer.${b3_id}.credit_exposure_cents == 1183280"
            - "LINK 2: Brewer.${b3_id}.credit_utilization_pct == 118.33"
            - "LINK 2: Brewer.${b3_id}.credit_status == HOLD"
            - "LINK 3: SalesOrder.${ob_id}.credit_status == ON_HOLD"
            - "LINK 3: SalesOrder.${ob_id}.fulfillment_status == CONFIRMED (the fulfillment dimension is untouched)"
            - "LINK 3: SalesOrder.${ob_id}.total_cents == 168380 and SalesOrder.${ob_id}.fee_variant == PROVISIONAL (no repricing in this cascade)"
            - "LINK 4: ColdChainShipment.${sb_id}.status == HELD"
            - "LINK 5: ColdStorageZone.${zone1_id}.occupied_pallets == 0"
            - "OrderLine.${lb1_id}.status == OPEN and OrderLine.${lb2_id}.status == OPEN (no line was trimmed)"
            - "MaltLot.${lot3_id}.committed_lbs == 1000 (committed poundage is not released by a credit hold)"

      - name: temperature_excursion_fails_yeast_quarantines_hops_and_mints_replacement_job
        cascade_depth: 3
        grounds:
          - calculations.cold_chain_excursion_assessment
          - state_machines.ColdChainShipment.IN_TRANSIT_to_EXCURSION_FLAGGED
          - state_machines.YeastPropagationJob.READY_to_FAILED
          - state_machines.OrderLine.OPEN_to_QUARANTINED
          - entities.YeastPropagationJob.fields.replaces_job_id
          - errors.ERR_COLD_CHAIN_EXCURSION
        chain: |
          LINK 1 — the third POST /cold-chain-shipments/{id}/readings pushes
          excursion_minutes to 35, strictly above MAX_EXCURSION_MINUTES 30, so the
          shipment transitions IN_TRANSIT -> EXCURSION_FLAGGED.
          LINK 2 (caused by link 1's flag) — the READY YeastPropagationJob behind the
          order's YEAST line transitions READY -> FAILED with failure_reason
          COLD_CHAIN_EXCURSION, and the cold-chain HOP line transitions
          OPEN -> QUARANTINED.
          LINK 3 (caused by link 2's job failure) — a replacement
          YeastPropagationJob is minted in REQUESTED with replaces_job_id pointing at
          the failed job and pitch_date pushed out by the strain's
          propagation_lead_time_days, from 2026-08-15 to 2026-08-22.
        distinguishing_aspect: |
          A third, physical trigger — an append-only telemetry reading, not an
          allocation report and not a fiscal declaration — and it is the only cascade
          of the three that CREATES a row (the replacement propagation job) rather
          than only mutating existing ones. Nothing about credit or freight moves
          here: ar_balance_cents stays 0 and total_cents stays 119380.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000, cold_chain_certified true."
            - "Yeast strain WLP001, ALE, propagation_lead_time_days 7, list_price_cents_per_l 1200.00, viability_pct_at_ship 92.0, cells_per_ml_slurry_billion 1.2, min_batch_l 20.0, vessel_max_l 2000.0."
            - "Malt product Pale Ale Malt and a recipe 'Flagship Ale' referencing WLP001."
            - "Hop variety Citra with cold_storage_required true, pallet_quantity_lbs 880."
            - "A YeastPropagationJob for pitch_date 2026-08-15, walked REQUESTED -> PROPAGATING -> READY."
            - "Cold storage zone Z1 with capacity_pallets 10 and temp_setpoint_c 2.0."
            - "A PICKED, credit-APPROVED order with a 20.0 L YEAST line on that job and an 880 lb SPOT Citra line, total_cents 119380."
            - "An IN_TRANSIT 2-pallet shipment in Z1 with reefer_setpoint_c 2.0 and reefer_tolerance_c 2.0, so the in-tolerance band is 0.0 through 4.0 degrees."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Reefer Run Brewing", brewery_license_no: "BR-0009", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { b4_id: $.data.id }
            - call: "POST /yeast-strains"
              payload: { strain_code: "WLP001", name: "California Ale", fermentation_type: "ALE", propagation_lead_time_days: 7, list_price_cents_per_l: 1200.00, viability_pct_at_ship: 92.0, cells_per_ml_slurry_billion: 1.2, min_batch_l: 20.0, vessel_max_l: 2000.0 }
              as: WarehouseOperator
              captures: { wlp001_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { malt_pale_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { citra_id: $.data.id }
            - call: "POST /cold-storage-zones"
              payload: { zone_code: "Z1", temp_setpoint_c: 2.0, capacity_pallets: 10, tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { zone1_id: $.data.id }
            - call: "POST /brewer-recipes"
              payload: { brewer_id: "${b4_id}", malt_product_id: "${malt_pale_id}", yeast_strain_id: "${wlp001_id}", name: "Flagship Ale", batch_volume_bbl: 30.0, original_gravity_plato: 12.50, target_color_lovibond: 2.50, target_extract_pct: 80.00, target_protein_pct: 11.00, requested_pitch_rate_million_cells_per_ml_per_plato: 0.75, adjunct_pct: 0.0 }
              as: Brewer
