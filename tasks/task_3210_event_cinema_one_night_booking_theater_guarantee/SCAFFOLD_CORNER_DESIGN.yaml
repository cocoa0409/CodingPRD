              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 100, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { floor_err: "$.data.error_id" }
          assert:
            - "the response status is 422"
            - "the error names the floor rule — ${floor_err} == ERR_GUARANTEE_BELOW_FLOOR"
            - "the guarantee would have been inside the booking's own ceiling, so only the cross-entity floor is violated"
            - "no booking was created — GET /event-cinema/bookings?circuit_id=${circ_id} returns 0 rows"

      - name: territory_gate_outranks_the_floor_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=13]
          - validations[priority=26]
          - errors[ERR_TERRITORY_UNLICENSED]
          - errors[ERR_GUARANTEE_BELOW_FLOOR]
        distinguishing_aspect: "Where safety and fiscal both fail, safety wins: a below-floor guarantee submitted for an unlicensed venue yields ERR_TERRITORY_UNLICENSED, not ERR_GUARANTEE_BELOW_FLOOR."
        test_recipe:
          setup:
            - "Standard CA fixture plus a Nevada venue; booking guarantee 100 cents, deliberately below the 1000000-cent floor, with a line at the Nevada venue."
          setup_api_calls:
            - *k_clock
            - *k_dist
