          trigger:
            - call: "POST /ca/certificate-profiles/${profile_id}/crl-publications"
              payload: { this_update: "2026-08-01T00:00:00Z", next_update: "2026-08-01T12:00:00Z", expected_profile_version: "${profile_version_v2}" }
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
              captures: { crl_1_id: $.data.id, crl_1_number: $.data.crl_number }
            - call: "GET /ca/certificate-profiles/${profile_id}/crl-publications"
              payload: {}
              as: COMPLIANCE_AUDITOR
          assert:
            - "HTTP 201 on the publication"
            - "${crl_1_number} == 1"
            - "CrlPublication.${crl_1_id}.entry_count == 0"
            - "CrlPublication.${crl_1_id}.revoked_serials == []"
            - "CrlPublication.${crl_1_id}.published_by_user_id == u_rev_1"
            - "the CrlPublication response body contains no `version` key and no `updated_at` key"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint for /ca/certificate-profiles/{id}/crl-publications"
            - "CertificateProfile.${profile_id}.last_crl_number == 1"
            - "CertificateProfile.${profile_id}.last_crl_next_update == 2026-08-01T12:00:00Z"
            - "the closing list call returns total_count == 1"

