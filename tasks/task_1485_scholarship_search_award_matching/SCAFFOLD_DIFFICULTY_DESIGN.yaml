        grounds:
          - state_machines.Disbursement.SENT_to_CONFIRMED
          - state_machines.Award."funding_status=DISBURSING_to_funding_status=FULLY_DISBURSED"
          - state_machines.DonorReport.GENERATED_to_DRAFT
          - calculations.fund_availability
        distinguishing_aspect: |
          Depth-3 chain from ONE trigger (disbursement confirm): (1) confirm mutates
          Award (net_confirmed reaches amount -> FULLY_DISBURSED); (2) that Award
          transition itself creates the ThankYouLetter (REQUIRED, donor not
          anonymous); (3) the letter creation itself flips the donor's GENERATED
          DonorReport back to DRAFT. Each link is caused by the previous link, and
          the trigger differs from the sibling instance's award-accept origin.
