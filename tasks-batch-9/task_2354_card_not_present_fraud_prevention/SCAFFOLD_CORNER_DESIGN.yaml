              captures: { lead1_id: $.data.id, lead1_v: $.data.version }
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.5417 }
              as: CheckoutService
              captures: { a1_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${a1_id}/score"
              payload: {}
              as: CheckoutService
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.5417 }
              as: CheckoutService
              captures: { a2_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${a2_id}/score"
              payload: {}
              as: CheckoutService
            - call: "GET /fraud/review-cases"
              payload: { assessment_id: "${a1_id}" }
              as: ReviewLead
              as_user_id: "${lead1_id}"
              captures: { case1_id: "$.data[0].id" }
            - call: "GET /fraud/review-cases"
              payload: { assessment_id: "${a2_id}" }
              as: ReviewLead
              as_user_id: "${lead1_id}"
              captures: { case2_id: "$.data[0].id" }
            - call: "POST /fraud/review-cases/${case1_id}/assign"
              payload: { analyst_id: "${an1_id}", expected_analyst_version: "${an1_v}" }
              as: ReviewLead
              as_user_id: "${lead1_id}"
            - call: "POST /fraud/review-cases/${case2_id}/assign"
              payload: { analyst_id: "${lead1_id}", expected_analyst_version: "${lead1_v}" }
              as: ReviewLead
              as_user_id: "${lead1_id}"
          trigger:
            - call: "POST /fraud/review-cases/${case1_id}/resolve"
              payload: { action: "DECLINE", resolution_note: "lead override on another analyst's case" }
              as: ReviewLead
              as_user_id: "${lead1_id}"
            - call: "POST /fraud/review-cases/${case2_id}/resolve"
              payload: { action: "APPROVE", resolution_note: "lead resolves own case" }
              as: RiskAnalyst
              as_user_id: "${lead1_id}"
          assert:
            - "First trigger call: HTTP status == 200 even though assigned_analyst_id == ${an1_id} != the acting X-User-ID"
            - "ReviewCase.${case1_id}.state == RESOLVED_DECLINE"
            - "Analyst.${an1_id}.open_case_count == 0 and resolved_case_count == 1 (the holder's counters move, not the lead's)"
            - "CheckoutAssessment.${a1_id}.state == DECIDED_DECLINE with decision_reason MANUAL_REVIEW"
            - "Second trigger call: HTTP status == 200 (a RiskAnalyst resolving the case they own is the shared path)"
            - "ReviewCase.${case2_id}.state == RESOLVED_APPROVE"
            - "Analyst.${lead1_id}.open_case_count == 0 and resolved_case_count == 1"
            - "Customer.${cust_id}.approved_count == 1, declined_count == 1, lifetime_net_approved_cents == 20000"

      - name: pack_activation_by_its_own_author_rejected
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - validations[priority=56]
          - errors[ERR_ACTIVATION_SEGREGATION_VIOLATION]
        distinguishing_aspect: "X-User-ID is tracked across two steps of the same workflow: activating with the identity recorded in created_by_user_id is 409 ERR_ACTIVATION_SEGREGATION_VIOLATION, and only a second engineer token flips the pack ACTIVE and stamps activated_by_user_id."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; DRAFT pack P-sod created by eng-author-1 with one valid rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P-sod", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { pack_id: $.data.id }
            - call: "POST /fraud/rule-packs/${pack_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
          trigger:
            - call: "POST /fraud/rule-packs/${pack_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-approver-2"
          assert:
            - "First trigger call: HTTP status == 409 and data.error_id == ERR_ACTIVATION_SEGREGATION_VIOLATION"
            - "RulePack.${pack_id}.status == DRAFT, activated_at == null, activated_by_user_id == null, version == 1"
            - "Second trigger call: HTTP status == 200"
            - "RulePack.${pack_id}.status == ACTIVE, activated_at == 2026-08-01T00:00:00Z, activated_by_user_id == \"eng-approver-2\", created_by_user_id == \"eng-author-1\", version == 2"

      - name: review_lead_x_user_id_must_name_an_analyst_row_rejected
        claim_type: unauthorized_denial
        grounds:
          - roles.ReviewLead.identity
          - validations[priority=4]
          - errors[ERR_INVALID_USER_CONTEXT]
        distinguishing_aspect: "ReviewLead is entity_backed:Analyst, so its X-User-ID is resolved against the Analyst table before anything else: an unknown analyst id gives 401 ERR_INVALID_USER_CONTEXT (not 403 and not 404), while the opaque roles never pay that cost."
        test_recipe:
          setup:
            - "BOOT-W plus one REVIEW assessment producing case C1 in QUEUED, and one real analyst AN1 (SENIOR, [BEHAVIORAL], capacity 2, version 1)."
          setup_api_calls:
            - call: "POST /fraud/analysts"
              payload: { display_name: "AN1", seniority: "SENIOR", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 2 }
              as: PlatformAdmin
              captures: { an1_id: $.data.id, an1_v: $.data.version }
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.5417 }
              as: CheckoutService
              captures: { asmt_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${asmt_id}/score"
              payload: {}
              as: CheckoutService
            - call: "GET /fraud/review-cases"
              payload: { assessment_id: "${asmt_id}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
              captures: { case_id: "$.data[0].id" }
          trigger:
            - call: "POST /fraud/review-cases/${case_id}/assign"
              payload: { analyst_id: "${an1_id}", expected_analyst_version: "${an1_v}" }
              as: ReviewLead
              as_user_id: "00000000-0000-0000-0000-000000000000"
            - call: "POST /fraud/rule-packs/${pack_id}/rules"
              payload: { code: "DEV_EMULATOR", signal_family: "DEVICE", points: 45, evaluation_order: 5, hard_decline: true }
              as: PolicyEngineer
              as_user_id: "00000000-0000-0000-0000-000000000000"
          assert:
            - "First trigger call: HTTP status == 401 and data.error_id == ERR_INVALID_USER_CONTEXT"
            - "ReviewCase.${case_id}.state == QUEUED and Analyst.${an1_id}.version == 1"
            - "Second trigger call: data.error_id != ERR_INVALID_USER_CONTEXT — PolicyEngineer identity is opaque, so the same unknown id is accepted and the request fails only on the ACTIVE-pack gate (409 ERR_RULE_PACK_NOT_DRAFT)"

      - name: missing_or_unknown_role_header_rejected
        claim_type: unauthorized_denial
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_MISSING_ROLE]
          - errors[ERR_INVALID_ROLE]
        distinguishing_aspect: "The two header failures are distinct and both precede routing: an absent X-User-Role is 401 ERR_MISSING_ROLE while a syntactically fine but unknown role name is 401 ERR_INVALID_ROLE — neither degrades into 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; empty database otherwise."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/customers"
              payload: { email: "norole@example.com", home_country: "US" }
              as: NONE
            - call: "POST /fraud/customers"
              payload: { email: "badrole@example.com", home_country: "US" }
              as: FraudManager
            - call: "GET /fraud/customers"
              payload: {}
              as: NONE
          assert:
            - "First trigger call (no X-User-Role header at all): HTTP status == 401 and data.error_id == ERR_MISSING_ROLE"
            - "Second trigger call (X-User-Role: FraudManager, not one of the five §1.7 roles): HTTP status == 401 and data.error_id == ERR_INVALID_ROLE"
            - "Third trigger call: HTTP status == 401 and data.error_id == ERR_MISSING_ROLE — reads are gated too"
            - "GET /fraud/customers as PlatformAdmin returns total_count == 0"

  # ===========================================================================
  # complexity_profile.complexity_layers = [optimistic_concurrency,
  # cascading_side_effects, dual_variant_calculation, selector_policy].
  # The selector_policy layer has no row in the claim-extraction guide's layer
  # table; it is covered by calculations /
  # auto_assign_prefers_most_headroom_then_cheapest_seniority and
  # auto_assign_with_empty_eligible_pool_rejected above.
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_analyst_version_on_case_assign
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[case-assign-stale-analyst]
          - validations[priority=52]
          - errors[ERR_STALE_ANALYST_VERSION]
        distinguishing_aspect: "The OCC token is the PARENT Analyst's version, not the case's: a successful first assignment bumps the analyst to version 2, so replaying the original expected_analyst_version on a second case is 412 ERR_STALE_ANALYST_VERSION, and re-reading the version makes the identical request succeed."
        test_recipe:
          setup:
            - "BOOT-W plus two REVIEW assessments producing cases C1 and C2 (both BEHAVIORAL, blended 50.00)."
            - "Analyst AN1: SENIOR, [BEHAVIORAL], shift_capacity_cases 2, version 1 captured as an1_v so capacity can never be the reason for a refusal."
          setup_api_calls:
            - call: "POST /fraud/analysts"
              payload: { display_name: "AN1", seniority: "SENIOR", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 2 }
              as: PlatformAdmin
              captures: { an1_id: $.data.id, an1_v: $.data.version }
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.5417 }
              as: CheckoutService
              captures: { a1_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${a1_id}/score"
              payload: {}
              as: CheckoutService
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.5417 }
              as: CheckoutService
              captures: { a2_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${a2_id}/score"
              payload: {}
              as: CheckoutService
            - call: "GET /fraud/review-cases"
              payload: { assessment_id: "${a1_id}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
              captures: { case1_id: "$.data[0].id" }
            - call: "GET /fraud/review-cases"
              payload: { assessment_id: "${a2_id}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
              captures: { case2_id: "$.data[0].id" }
            - call: "POST /fraud/review-cases/${case1_id}/assign"
              payload: { analyst_id: "${an1_id}", expected_analyst_version: "${an1_v}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
          trigger:
            - call: "POST /fraud/review-cases/${case2_id}/assign"
              payload: { analyst_id: "${an1_id}", expected_analyst_version: "${an1_v}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
            - call: "POST /fraud/review-cases/${case2_id}/assign"
              payload: { analyst_id: "${an1_id}", expected_analyst_version: "${an1_v} + 1" }
              as: ReviewLead
              as_user_id: "${an1_id}"
          assert:
            - "${an1_v} == 1 and Analyst.${an1_id}.version == 2 after the setup assignment"
            - "First trigger call: HTTP status == 412 and data.error_id == ERR_STALE_ANALYST_VERSION"
            - "ReviewCase.${case2_id}.state == QUEUED and Analyst.${an1_id}.open_case_count == 1 after the stale attempt"
            - "Second trigger call: HTTP status == 200"
            - "ReviewCase.${case2_id}.state == ASSIGNED and assigned_analyst_id == ${an1_id}"
            - "Analyst.${an1_id}.open_case_count == 2 and version == 3"

      - name: stale_expected_customer_version_on_exception_decision
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[exception-decision-stale-customer]
          - validations[priority=53]
          - errors[ERR_STALE_CUSTOMER_VERSION]
        distinguishing_aspect: "The exception decision guards on the CUSTOMER's version, which two unrelated posture writes have already advanced from 1 to 3: replaying the version observed at customer creation is 412 ERR_STALE_CUSTOMER_VERSION, and the current version approves the exception and bumps the customer to 4."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; customer CU1 tier HIGH_VALUE created with version 1 captured as cust_v."
            - "CU1 was moved ACTIVE -> LOCKED (version 2) and back LOCKED -> ACTIVE (version 3), so the captured token is two writes behind."
            - "Analysts AN1 (requester, RiskAnalyst identity) and LEAD1 (decider) exist; exception E1 (AUTO_APPROVE_UNDER_AMOUNT, max_amount_cents 100000) is REQUESTED by AN1 and does not itself touch Customer.version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/customers"
              payload: { email: "occ@example.com", home_country: "US", tier: "HIGH_VALUE" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id, cust_v: $.data.version }
            - call: "POST /fraud/analysts"
              payload: { display_name: "AN1", seniority: "SENIOR", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 2 }
              as: PlatformAdmin
              captures: { an1_id: $.data.id }
            - call: "POST /fraud/analysts"
              payload: { display_name: "LEAD1", seniority: "LEAD", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 3 }
              as: PlatformAdmin
              captures: { lead1_id: $.data.id }
            - call: "POST /fraud/customers/${cust_id}/posture"
              payload: { account_status: "LOCKED", reason: "manual hold during review" }
              as: PlatformAdmin
            - call: "POST /fraud/customers/${cust_id}/posture"
              payload: { account_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /fraud/policy-exceptions"
              payload: { customer_id: "${cust_id}", scope: "AUTO_APPROVE_UNDER_AMOUNT", max_amount_cents: 100000, effective_from: "2026-08-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", justification: "VIP buyer, small basket auto approve" }
              as: RiskAnalyst
              as_user_id: "${an1_id}"
              captures: { exc_id: $.data.id }
          trigger:
            - call: "POST /fraud/policy-exceptions/${exc_id}/decision"
              payload: { action: "APPROVE", expected_customer_version: "${cust_v}", decision_note: "stale token" }
              as: ReviewLead
              as_user_id: "${lead1_id}"
            - call: "POST /fraud/policy-exceptions/${exc_id}/decision"
              payload: { action: "APPROVE", expected_customer_version: "${cust_v} + 2", decision_note: "current token" }
              as: ReviewLead
              as_user_id: "${lead1_id}"
          assert:
            - "${cust_v} == 1 and Customer.${cust_id}.version == 3 after the two posture writes"
            - "Customer.${cust_id}.account_status == ACTIVE and locked_reason == null"
            - "First trigger call: HTTP status == 412 and data.error_id == ERR_STALE_CUSTOMER_VERSION"
            - "PolicyException.${exc_id}.state == REQUESTED and Customer.${cust_id}.version == 3 after the stale attempt"
            - "Second trigger call: HTTP status == 200"
            - "PolicyException.${exc_id}.state == APPROVED and approved_by_analyst_id == ${lead1_id}"
            - "Customer.${cust_id}.version == 4"

      - name: multi_level_cascade_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.ChargebackRecord.transitions[REPRESENTED->LOST]
        excluded_because:
          difficulty_instance: chargeback_loss_reprices_open_review_queue
          rationale: "The deepest chain in the domain (5 links, chargeback LOST -> outcome_label -> customer ledger -> good_customer_flag -> every open case re-priced) is asserted link by link there, which is exactly this layer's claim."

      - name: both_blend_variants_produce_their_expected_results
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.blended_risk_score.variants
        excluded_because:
          difficulty_instance: blended_score_weighted_vs_rule_dominant_diverge
          rationale: "Identical inputs are scored under WEIGHTED (39.95, APPROVE) and RULE_DOMINANT (48.25, REVIEW) there, with the 8.30 delta and the band change both asserted."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: scoring_side_effects_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.CheckoutAssessment.transitions[PENDING_SIGNALS->DECIDED_APPROVE]
        distinguishing_aspect: "consistency_model is immediate: the score response itself already carries the computed blended_score and decision, and reads issued immediately afterwards show the customer ledger, the device counters and the address cluster counters fully updated — no denormalised field lags behind the write."
        test_recipe:
          setup:
            - "BOOT-W. One assessment A1 (amount_cents 20000, model_raw_probability 0.4021) has already been scored to DECIDED_APPROVE so that the second approval is the one that flips good_customer_flag."
          setup_api_calls:
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { a1_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${a1_id}/score"
              payload: {}
              as: CheckoutService
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /fraud/checkout-assessments/${a2_id}/score"
              payload: {}
              as: CheckoutService
            - call: "GET /fraud/customers/${cust_id}"
              payload: {}
              as: CheckoutService
            - call: "GET /fraud/devices/${dev_id}"
              payload: {}
              as: CheckoutService
            - call: "GET /fraud/addresses/${addr_id}"
              payload: {}
              as: CheckoutService
          assert:
            - "The score response body itself already contains state DECIDED_APPROVE, rule_score 20, model_points 53.25, blended_score 39.95, decision APPROVE, decision_reason SCORE_BAND, decided_at 2026-08-01T00:00:00Z and good_customer_at_decision false"
            - "GET customer (same logical instant): approved_count == 2, lifetime_net_approved_cents == 40000, good_customer_flag == true"
            - "GET device: approved_use_count == 2, distinct_customer_count == 1, reputation == NEW (3 approvals are still required for TRUSTED)"
            - "GET address: approved_use_count == 2, distinct_customer_count == 1, drop_risk_state == CLEAN, reshipper_confidence == 0.00"
            - "No second read is needed for any of these values to settle"
