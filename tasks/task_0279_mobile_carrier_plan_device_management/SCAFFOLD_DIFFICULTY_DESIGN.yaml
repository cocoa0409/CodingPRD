  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: line_activate_requires_plan_active
        grounds:
          - state_machines.Line.PENDING_ACTIVATION_to_ACTIVE
          - entities.Plan.fields.status
          - errors[ERR_PLAN_RETIRED]
        distinguishing_aspect: |
          Line's PENDING_ACTIVATION -> ACTIVE transition depends on the Plan entity's state (Plan.status must
          be ACTIVE): a line on a RETIRED plan cannot activate. Entity pair Line->Plan.
        test_recipe:
          setup:
            - "A PENDING_ACTIVATION line whose plan has been RETIRED after the line was provisioned; SIM ISSUED."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "M", holder_email: "m@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-M", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000070" }
              as: CarrierAgent
            - call: "POST /plans/${plan_id}/retire"
              payload: {}
              as: CarrierAgent
          trigger:
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_PLAN_RETIRED (Line activation blocked by Plan.status==RETIRED)"

      - name: line_reconnect_requires_account_active
        grounds:
          - state_machines.Line.SUSPENDED_to_ACTIVE
          - entities.Account.fields.status
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
        distinguishing_aspect: |
          Line's SUSPENDED -> ACTIVE transition depends on a different entity pair (Line->Account): a suspended
          line on a non-ACTIVE (DELINQUENT) account cannot reconnect — a VOLUNTARY suspend so the fiscal gate
          is not the cause. Different pair from the Line->Plan dependency.
        test_recipe:
          setup:
            - "A SUSPENDED line (suspend_reason VOLUNTARY) on an account later marked DELINQUENT (non-ACTIVE)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "N", holder_email: "n@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-N", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000080" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /lines/${line_id}/suspend"
              payload: { suspend_reason: "VOLUNTARY" }
              as: CarrierAgent
            - call: "POST /accounts/${acc_id}/mark-delinquent"
              payload: { delinquent: true }
              as: BillingSystem
          trigger:
            - call: "POST /lines/${line_id}/reconnect"
              payload: {}
              as: CarrierAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_ACCOUNT_NOT_ACTIVE (reconnect blocked by Account.status != ACTIVE)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: daypass_addon_overlap_half_open_on_line
        grounds:
          - validations[priority=11]
          - entities.AddOn.fields.window_start
          - entities.AddOn.fields.window_end
          - errors[ERR_ADDON_OVERLAP]
        distinguishing_aspect: |
          Two ROAMING_DAYPASS add-ons on the same Line resource use half-open [window_start, window_end)
          interval semantics: a new add-on 2026-06-12..2026-06-16 overlaps an existing 2026-06-10..2026-06-15
          (shared days 12-14) and is rejected; exact adjacency (start == prior end) would be allowed.
        test_recipe:
          setup:
            - "An ACTIVE line with one ROAMING_DAYPASS add-on covering 2026-06-10..2026-06-15 (half-open)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "O", holder_email: "o@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-O", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000090" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /addons"
              payload: { line_id: "${line_id}", addon_type: "ROAMING_DAYPASS", daily_fee_cents: 1000, window_start: "2026-06-10T00:00:00Z", window_end: "2026-06-15T00:00:00Z" }
              as: Subscriber
              as_user_id: "${acc_id}"
              captures: { addon1_id: $.data.id }
          trigger:
            - call: "POST /addons"
              payload: { line_id: "${line_id}", addon_type: "ROAMING_DAYPASS", daily_fee_cents: 1000, window_start: "2026-06-12T00:00:00Z", window_end: "2026-06-16T00:00:00Z" }
              as: Subscriber
              as_user_id: "${acc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_ADDON_OVERLAP (half-open overlap on shared days 12-14)"

      - name: portin_number_in_use_uniqueness_on_line_pool
        grounds:
          - validations[priority=9]
          - entities.Line.fields.phone_number
          - errors[ERR_NUMBER_IN_USE]
        distinguishing_aspect: |
          The number pool is a different resource with point-occupancy interval semantics (a phone_number is
          held for the whole interval a line is live, not a day-range): a PORT_IN of a number already held by a
          live Line collides and is rejected — aggregate-capacity-of-one geometry, distinct from the daypass day-range.
        test_recipe:
          setup:
            - "Line A is ACTIVE holding phone_number imported as 12025550111 via a completed PORT_IN."
            - "Line B is PENDING_ACTIVATION and attempts to PORT_IN the same number 12025550111."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "P", holder_email: "p@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v0: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-P", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v0}" }
              as: CarrierAgent
              captures: { la: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${la}", sim_type: "PHYSICAL", iccid: "8901000000000000100" }
              as: CarrierAgent
            - call: "POST /lines/${la}/activate"
              payload: {}
              as: CarrierAgent
              captures: { acc_v1: $.data.version }
            - call: "POST /port-requests"
              payload: { line_id: "${la}", direction: "PORT_IN", external_number: "12025550111", donor_carrier: "OtherCo", account_pin: "5555" }
              as: Subscriber
              as_user_id: "${acc_id}"
              captures: { pr_a: $.data.id }
            - call: "POST /port-requests/${pr_a}/validate"
              payload: { account_pin: "5555" }
              as: PortingOps
            - call: "POST /port-requests/${pr_a}/complete"
              payload: {}
              as: PortingOps
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v1}" }
              as: CarrierAgent
              captures: { lb: $.data.id }
          trigger:
            - call: "POST /port-requests"
              payload: { line_id: "${lb}", direction: "PORT_IN", external_number: "12025550111", donor_carrier: "OtherCo", account_pin: "6666" }
              as: Subscriber
              as_user_id: "${acc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_NUMBER_IN_USE (number 12025550111 already held by live Line ${la})"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: number_pool_conserved_on_portin_revert
        grounds:
          - state_machines.PortRequest.VALIDATED_to_COMPLETED
          - state_machines.PortRequest.COMPLETED_to_REVERTED
          - entities.Line.fields.phone_number
        distinguishing_aspect: |
          Conserved quantity #1 — the count of live phone numbers: complete(PORT_IN) imports number 12025550112
          (count of distinct non-null Line.phone_number rises by 1) and revert(PORT_IN) releases it (count falls
          by 1), leaving the global live-number count exactly as before the pair. Formula: COUNT(Line where phone_number != null).
        test_recipe:
          setup:
            - "A PENDING_ACTIVATION line; baseline live-number count = 0 across the system before the port pair."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "Q", holder_email: "q@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-Q", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /port-requests"
              payload: { line_id: "${line_id}", direction: "PORT_IN", external_number: "12025550112", donor_carrier: "OtherCo", account_pin: "7777" }
              as: Subscriber
              as_user_id: "${acc_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /port-requests/${pr_id}/validate"
              payload: { account_pin: "7777" }
              as: PortingOps
            - call: "POST /port-requests/${pr_id}/complete"
              payload: {}
              as: PortingOps
          trigger:
            - call: "POST /port-requests/${pr_id}/revert"
              payload: {}
              as: PortingOps
          assert:
            - "After complete, Line.${line_id}.phone_number == 12025550112 (live-number count rose to 1)"
            - "After revert, Line.${line_id}.phone_number == null (live-number count back to 0; COUNT(Line where phone_number != null) unchanged across the pair)"

      - name: eip_outstanding_conserved_on_upgrade_payoff
        grounds:
          - state_machines.InstallmentPlan.ACTIVE_to_CANCELLED
          - calculations.upgrade_payoff
          - calculations.eip_schedule
          - entities.Account.fields.total_eip_outstanding_cents
        distinguishing_aspect: |
          Conserved quantity #2 (different type — device financing balance, not number count):
          total_eip_outstanding_cents == SUM(InstallmentPlan.remaining_balance_cents where status==ACTIVE) MUST
          hold after an upgrade. Old EIP remaining 90000 -> CANCELLED (settled); new EIP financed 100000 ->
          outstanding becomes exactly 100000, with no drift from the old balance.
        test_recipe:
          setup:
            - "ACTIVE line with ACTIVE EIP (device retail 99900, down 9900 -> remaining 90000). total_eip_outstanding=90000."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "R", holder_email: "r@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-R", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /devices"
              payload: { model: "Phone Z", sku: "PZ-1", retail_price_cents: 99900, stock_count: 5 }
              as: CarrierAgent
              captures: { dev_old: $.data.id }
            - call: "POST /devices"
              payload: { model: "Phone Z2", sku: "PZ-2", retail_price_cents: 119900, stock_count: 5 }
              as: CarrierAgent
              captures: { dev_new: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000110" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /installment-plans"
              payload: { line_id: "${line_id}", device_id: "${dev_old}", term_months: 24, down_payment_cents: 9900 }
              as: CarrierAgent
              captures: { old_eip: $.data.id }
          trigger:
            - call: "POST /upgrades"
              payload: { line_id: "${line_id}", old_installment_plan_id: "${old_eip}", new_device_id: "${dev_new}", new_term_months: 24, new_down_payment_cents: 19900, trade_in_credit_cents: 50000 }
              as: CarrierAgent
              captures: { up_id: $.data.id, new_eip: $.data.new_installment_plan_id }
          assert:
            - "UpgradeOrder.${up_id}.payoff_charge_cents == 40000 (max(0, 90000 - 50000))"
            - "InstallmentPlan.${old_eip}.status == CANCELLED and remaining_balance_cents == 0"
            - "New InstallmentPlan.${new_eip}.financed_cents == 100000 (119900 - 19900) and remaining_balance_cents == 100000"
            - "Account.${acc_id}.total_eip_outstanding_cents == 100000 == SUM(remaining over ACTIVE EIPs); no drift from the old 90000"
