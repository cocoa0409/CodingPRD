            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Set B right", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o5: $.data.id }
            - call: "PATCH /blinds/openings/${o1}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED" }
              as: Designer
              as_user_id: "${d1}"
            - call: "PATCH /blinds/openings/${o2}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED" }
              as: Designer
              as_user_id: "${d1}"
            - call: "PATCH /blinds/openings/${o3}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "MOTORIZED", motorization_option: "BATTERY" }
              as: Designer
              as_user_id: "${d1}"
            - call: "PATCH /blinds/openings/${o4}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED" }
              as: Designer
              as_user_id: "${d1}"
            - call: "PATCH /blinds/openings/${o5}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED" }
              as: Designer
              as_user_id: "${d1}"
            - call: "GET /blinds/consultations/${c1}"
              as: Designer
              as_user_id: "${d1}"
              captures: { cv1: $.data.version }
            - call: "POST /blinds/quotes"
              payload: { consultation_id: "${c1}", expected_consultation_version: "${cv1}" }
              as: Designer
              as_user_id: "${d1}"
              captures: { q1: $.data.id, sub: $.data.subtotal_cents, fee: $.data.install_fee_cents }
            - call: "POST /blinds/quotes/${q1}/present"
              as: Designer
              as_user_id: "${d1}"
            - call: "POST /blinds/quotes/${q1}/accept"
              as: Designer
              as_user_id: "${d1}"
              captures: { qv1: $.data.version }
          trigger:
            - call: "POST /blinds/vendor-orders"
              payload: { quote_id: "${q1}", opening_ids: ["${o1}", "${o2}", "${o3}"], expected_quote_version: "${qv1}", preferred_vendor_id: "${v1}" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { ord_a: $.data.id, a_cost: $.data.order_cost_cents, a_promised: $.data.promised_ship_date, a_ids: $.data.opening_ids }
            - call: "GET /blinds/quotes/${q1}"
              as: Franchisee
              as_user_id: "${t1}"
              captures: { qv2: $.data.version }
            - call: "POST /blinds/vendor-orders"
              payload: { quote_id: "${q1}", opening_ids: ["${o4}", "${o5}"], expected_quote_version: "${qv2}", preferred_vendor_id: "${v1}" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { ord_b: $.data.id, b_cost: $.data.order_cost_cents, b_promised: $.data.promised_ship_date }
            - call: "POST /blinds/vendor-orders/${ord_a}/ship"
              as: VendorRep
              as_user_id: "${v1}"
            - call: "POST /blinds/vendor-orders/${ord_a}/receive"
              as: Franchisee
              as_user_id: "${t1}"
            - call: "POST /blinds/install-jobs"
              payload: { vendor_order_id: "${ord_a}", designer_id: "${d1}", scheduled_start_at: "2026-08-20T09:00:00.000Z", scheduled_end_at: "2026-08-20T13:00:00.000Z", service_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { j_a: $.data.id, channels: $.data.motorized_channel_count, comm: $.data.commissioning_status }
          assert:
            - "the quote is the pinned fixture: the captured ${sub} == 37300 (4 x 4960 + 17460) and ${fee} == 22500 (7500 + 2500 x 5 + 4500 x 1)"
            - "three openings produce ONE row: the captured ${a_ids} is exactly [${o1}, ${o2}, ${o3}] and GET /blinds/vendor-orders?quote_id=${q1} returns total_count 2 after both placements, not five"
            - "the captured ${a_cost} == 11500: round_half_up(27380 x 0.42) = 11499.6 over the SUMMED retail; rounding each opening separately (2083 + 2083 + 7333) would give 11499"
            - "the captured ${b_cost} == 4166: round_half_up(9920 x 0.42) = 4166.4, and the two order costs do NOT sum to a single 37300-wide rounding - each order rounds once over its own set"
            - "the motorization adder is a property of the SET: the captured ${a_promised} == 2026-08-14 (10 + 3 days from effective date 2026-08-01) while ${b_promised} == 2026-08-11 (10 days), from the same vendor at the same instant"
            - "the captured ${channels} == 1 and ${comm} == PENDING: only O3 carries a motor, so the frozen channel count is 1 even though the job covers three openings"
            - "Territory.${t1}.open_order_exposure_cents == 4166 after order A is received - exposure drops by the whole set at once - and every one of O1, O2 and O3 has measure_status ORDERED"

      - name: corner_install_completion_reads_the_order_state_underneath_it
        claim_type: Conditional action
        grounds:
          - validations.priority_29_ERR_ORDER_NOT_RECEIVED
          - endpoints.POST_/blinds/install-jobs/{id}/complete
        excluded_because:
          difficulty_instance: install_completion_rechecks_the_order_state_a_remake_moved_underneath_it
          rationale: "The conditional character of POST /blinds/install-jobs/{id}/complete - it succeeds or reports ERR_ORDER_NOT_RECEIVED depending on a state a remake changed on a DIFFERENT entity between scheduling and sign-off - is exactly the cross-entity dependency built there, together with the true-up it posts."

      - name: corner_commissioning_endpoints_are_conditional_on_the_channel_count
        claim_type: Conditional action
        grounds:
          - validations.priority_38_ERR_CHANNEL_COUNT_EXCEEDS_ORDER
          - state_machines.InstallJob.commissioning_status
        excluded_because:
          difficulty_instance: commissioning_dimension_cycles_through_failed_while_install_status_stays_scheduled
          rationale: "Whether the pair and verify endpoints are applicable at all is decided by InstallJob.motorized_channel_count, and the whole conditional surface - PENDING to PAIRED to VERIFIED or FAILED, with the attempt ceiling - is walked there on a parallel state machine. The non-applicable branch is covered in this file by verify_before_pair_and_pair_on_a_non_motorized_job_are_different_refusals."

  # -------------------------------------------------------------------
  # Guide section 6 - Errors (no table: every error code must be triggerable)
  # -------------------------------------------------------------------
  - section: errors
    instances:
      - name: all_eleven_not_found_codes_are_triggerable_and_none_substitutes_for_another
        claim_type: Every error code is triggerable
        grounds:
          - errors.ERR_TERRITORY_NOT_FOUND
          - errors.ERR_DESIGNER_NOT_FOUND
          - errors.ERR_SAMPLE_KIT_NOT_FOUND
          - errors.ERR_LEAD_NOT_FOUND
          - errors.ERR_CONSULTATION_NOT_FOUND
          - errors.ERR_SAMPLE_CHECKOUT_NOT_FOUND
          - errors.ERR_OPENING_NOT_FOUND
          - errors.ERR_QUOTE_NOT_FOUND
          - errors.ERR_VENDOR_NOT_FOUND
          - errors.ERR_VENDOR_ORDER_NOT_FOUND
          - errors.ERR_INSTALL_JOB_NOT_FOUND
        distinguishing_aspect: "The catalog declares one existence code per entity, and an implementation that answers a generic ERR_NOT_FOUND - or reuses ERR_TERRITORY_NOT_FOUND everywhere - passes every other test in the suite. This instance asks for all eleven, each from its own collection segment, using one syntactically valid id that belongs to nothing."
        test_recipe:
          setup:
            - "An empty system. No fixture is needed: the whole point is that nothing exists under the probed id."
          setup_api_calls: []
          trigger:
            - call: "GET /blinds/territories/11111111-1111-4111-8111-111111111111"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { e_territory: $.data.error_id }
            - call: "GET /blinds/designers/11111111-1111-4111-8111-111111111111"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { e_designer: $.data.error_id }
            - call: "GET /blinds/sample-kits/11111111-1111-4111-8111-111111111111"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { e_kit: $.data.error_id }
            - call: "GET /blinds/leads/11111111-1111-4111-8111-111111111111"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { e_lead: $.data.error_id }
            - call: "GET /blinds/consultations/11111111-1111-4111-8111-111111111111"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { e_consultation: $.data.error_id }
            - call: "GET /blinds/sample-checkouts/11111111-1111-4111-8111-111111111111"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { e_checkout: $.data.error_id }
            - call: "GET /blinds/openings/11111111-1111-4111-8111-111111111111"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { e_opening: $.data.error_id }
            - call: "GET /blinds/quotes/11111111-1111-4111-8111-111111111111"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { e_quote: $.data.error_id }
            - call: "GET /blinds/vendors/11111111-1111-4111-8111-111111111111"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { e_vendor: $.data.error_id }
            - call: "GET /blinds/vendor-orders/11111111-1111-4111-8111-111111111111"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { e_order: $.data.error_id }
            - call: "GET /blinds/install-jobs/11111111-1111-4111-8111-111111111111"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { e_job: $.data.error_id }
          assert:
            - "each capture is the code named after its own entity: ${e_territory} == ERR_TERRITORY_NOT_FOUND, ${e_designer} == ERR_DESIGNER_NOT_FOUND, ${e_kit} == ERR_SAMPLE_KIT_NOT_FOUND, ${e_lead} == ERR_LEAD_NOT_FOUND, ${e_consultation} == ERR_CONSULTATION_NOT_FOUND, ${e_checkout} == ERR_SAMPLE_CHECKOUT_NOT_FOUND"
            - "and the second half: ${e_opening} == ERR_OPENING_NOT_FOUND, ${e_quote} == ERR_QUOTE_NOT_FOUND, ${e_vendor} == ERR_VENDOR_NOT_FOUND, ${e_order} == ERR_VENDOR_ORDER_NOT_FOUND, ${e_job} == ERR_INSTALL_JOB_NOT_FOUND"
            - "the eleven captured values are pairwise distinct - no single code stands in for the collection it was not declared for"
            - "every one of the eleven responses is HTTP 404 with response_type error, a non-empty data.message, and a meta block"
            - "the same code appears from the body-FK direction too: POST /blinds/openings with replaces_opening_id 11111111-1111-4111-8111-111111111111 answers ERR_OPENING_NOT_FOUND, and POST /blinds/vendor-orders with preferred_vendor_id set to it answers ERR_VENDOR_NOT_FOUND"

      - name: every_http_status_class_in_the_catalog_is_reachable_with_its_declared_code
        claim_type: Every error code is triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_VALUE_OUT_OF_RANGE
          - errors.ERR_STALE_CONSULTATION_VERSION
          - errors.ERR_QUOTE_NOT_DRAFT
        distinguishing_aspect: "Seven failures in one instance, chosen so that each lands in a different HTTP status class: 401, 403, 404, 400, 422, 412 and 409. Implementations habitually collapse this into 400-for-everything or 422-for-everything; the catalog assigns a status per code and this instance reads the status, not only the id."
        test_recipe:
          setup:
            - "One ACTIVE territory, one designer, one ROUTED lead, one SCHEDULED consultation with one configured LT-SHEER / CORDED opening."
            - "The consultation's version is captured BEFORE a second opening is measured, so a stale value is available."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "First", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
            - call: "PATCH /blinds/openings/${o1}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED" }
              as: Designer
              as_user_id: "${d1}"
            - call: "GET /blinds/consultations/${c1}"
              as: Designer
              as_user_id: "${d1}"
              captures: { cv_stale: $.data.version }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Second", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o2: $.data.id }
            - call: "PATCH /blinds/openings/${o2}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED" }
              as: Designer
              as_user_id: "${d1}"
              captures: { cv_fresh_marker: $.data.version }
          trigger:
            - call: "GET /blinds/consultations/${c1}"
              as: Designer
              as_user_id: ""
              captures: { e_401: $.data.error_id }
            - call: "POST /blinds/territories"
              payload: { legal_name: "Pirate Blinds", postal_codes: ["30501"] }
              as: Designer
              as_user_id: "${d1}"
              captures: { e_403: $.data.error_id }
            - call: "GET /blinds/designers/11111111-1111-4111-8111-111111111111"
              as: Franchisee
              as_user_id: "${t1}"
              captures: { e_404: $.data.error_id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Bad mount", room_type: "OFFICE", mount_type: "SIDE_MOUNT", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { e_400: $.data.error_id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-06T15:00:00.000Z", scheduled_end_at: "2026-08-06T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { e_422: $.data.error_id }
            - call: "POST /blinds/quotes"
              payload: { consultation_id: "${c1}", expected_consultation_version: "${cv_stale}" }
              as: Designer
              as_user_id: "${d1}"
              captures: { e_412: $.data.error_id }
            - call: "GET /blinds/consultations/${c1}"
              as: Designer
              as_user_id: "${d1}"
              captures: { cv_fresh: $.data.version }
            - call: "POST /blinds/quotes"
              payload: { consultation_id: "${c1}", expected_consultation_version: "${cv_fresh}" }
              as: Designer
              as_user_id: "${d1}"
              captures: { q1: $.data.id }
            - call: "POST /blinds/quotes/${q1}/present"
              as: Designer
              as_user_id: "${d1}"
              captures: { presented: $.data.status }
            - call: "POST /blinds/quotes/${q1}/present"
              as: Designer
              as_user_id: "${d1}"
              captures: { e_409: $.data.error_id }
          assert:
            - "an empty X-User-ID header gives the captured ${e_401} == ERR_UNAUTHENTICATED at HTTP 401 - the role check never runs, so the response cannot be a 403"
            - "the captured ${e_403} == ERR_ROLE_NOT_PERMITTED at HTTP 403: chartering is Franchisor-only and a Designer is a peer, not a subordinate"
            - "the captured ${e_404} == ERR_DESIGNER_NOT_FOUND at HTTP 404"
            - "the captured ${e_400} == ERR_INVALID_REQUEST at HTTP 400: SIDE_MOUNT is an undeclared enum member, which is a shape fault"
            - "the captured ${e_422} == ERR_VALUE_OUT_OF_RANGE at HTTP 422: an interval whose end does not follow its start is well-shaped JSON with an impossible value, which is a DIFFERENT class from the 400 above"
            - "the captured ${e_412} == ERR_STALE_CONSULTATION_VERSION at HTTP 412, using the version captured before the second opening was measured"
            - "the retry with the captured ${cv_fresh} succeeds as ${q1} with subtotal_cents 9920, so the 412 was purely about the version"
            - "the captured ${presented} == PRESENTED and the replay gives ${e_409} == ERR_QUOTE_NOT_DRAFT at HTTP 409 - a state conflict, not a validation fault"
            - "the seven statuses are 401, 403, 404, 400, 422, 412 and 409 and no two of these calls share one; every body carries data.error_id plus data.message and nothing else under data"

      - name: corner_every_fiscal_and_temporal_code_is_triggerable
        claim_type: Every error code is triggerable
        grounds:
          - errors.ERR_CREDIT_LIMIT_EXCEEDED
          - errors.ERR_VENDOR_CAPACITY_EXCEEDED
          - errors.ERR_QUOTE_EXPIRED
          - errors.ERR_REMAKE_WINDOW_CLOSED
        excluded_because:
          difficulty_instance: vendor_capacity_conflict_outranks_credit_limit_on_the_same_placement
          rationale: "ERR_VENDOR_CAPACITY_EXCEEDED and ERR_CREDIT_LIMIT_EXCEEDED are the two hardest codes in the catalog to reach because each needs a whole fixture built to a numeric edge, and both are triggered there in one instance. ERR_DESIGNER_CALENDAR_CONFLICT, ERR_SAMPLE_KIT_HOLD_CONFLICT, ERR_QUOTE_EXPIRED and ERR_REVISION_LIMIT_REACHED are likewise each triggered by a §1.8 instance of their own."

      - name: the_pair_attempt_budget_is_spent_only_by_accepted_calls_and_then_locks_the_job
        claim_type: Every error code is triggerable
        grounds:
          - errors.ERR_COMMISSIONING_ATTEMPT_LIMIT
          - errors.ERR_COMMISSIONING_NOT_VERIFIED
          - validations.priority_39_ERR_COMMISSIONING_ATTEMPT_LIMIT
          - state_machines.InstallJob.commissioning_status
          - entities.InstallJob.fields.commissioning_attempt_count
        distinguishing_aspect: "ERR_COMMISSIONING_ATTEMPT_LIMIT is the one code in the catalog no short path reaches: it needs three ACCEPTED pair calls, each separated by a verify that lands on FAILED because the paired channel count is short of the frozen two, and only the FOURTH pair is refused. The job is then permanently uncompletable, which the trailing complete call proves - and the whole sequence never moves install_status."
        test_recipe:
          setup:
            - "One ACTIVE territory, one ACTIVE designer holding MOTORIZATION, one vendor supporting MOTORIZED lifts and both the MATTER and HOMEKIT hubs, concurrent_capacity 2."
            - "A consultation carrying TWO motorized openings - WD-FAUX / MOTORIZED / HARDWIRED at 60.000 x 84.000 and LT-SHEER / MOTORIZED / BATTERY at 24.000 x 48.000 - so the install job freezes motorized_channel_count at 2."
            - "The quote is presented and accepted, both openings go on one vendor order, the order is shipped and received, one install job is created, and the clock sits inside the appointment window with commissioning_status PENDING and commissioning_attempt_count 0."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
