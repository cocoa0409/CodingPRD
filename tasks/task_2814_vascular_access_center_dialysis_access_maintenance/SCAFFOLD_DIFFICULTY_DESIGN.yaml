              captures: { cath_id: $.data.id }
            - call: "POST /vascular-accesses/${cath_id}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${cath_id}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
              captures: { cath_v: $.data.version }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVF", laterality: "LEFT", site: "FOREARM", placed_on: "2026-06-20" }
              as: AccessCoordinator
              captures: { avf_id: $.data.id }
            - call: "POST /vascular-accesses/${avf_id}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${avf_id}/status"
              payload: { to_status: "MATURING" }
              as: AccessCoordinator
            - call: "POST /surveillance-readings"
              payload: { access_id: "${avf_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-20T08:00:00Z", access_flow_ml_min: 500, venous_pressure_mmhg: 110, recirculation_pct: 1.0, kind: "ROUTINE" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /surveillance-readings"
              payload: { access_id: "${avf_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-28T08:00:00Z", access_flow_ml_min: 620, venous_pressure_mmhg: 115, recirculation_pct: 1.0, kind: "ROUTINE" }
              as: FacilityCoordinator
