            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_wn}", title: "TW", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_wn}"
              captures: { trk_wn: $.data.id }
