      - name: set_predecessor_refuses_to_close_a_loop
        claim_type: error_triggerable
        grounds: ["errors[ERR_ACTIVITY_CYCLE]", "validations[priority=16]"]
        distinguishing_aspect: "Both loop shapes are refused by the same rule: naming the activity itself, and naming a successor whose own chain already reaches back to the activity. The chain is a DAG at creation, so only this endpoint can close a cycle."
        test_recipe:
          setup:
            - "Outage UNIT_1 / 1R24 in PLANNING with A1 as a root activity and A2 whose predecessor_activity_id is A1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "A1 cavity flood-up", planned_start_offset_hours: 0, planned_duration_hours: 100 }
              as: OutagePlanner
              captures: { a1_id: "$.data.id" }
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "A2 core offload", planned_start_offset_hours: 100, planned_duration_hours: 150, predecessor_activity_id: "${a1_id}" }
              as: OutagePlanner
              captures: { a2_id: "$.data.id" }
          trigger:
            - call: "POST /schedule-activities/${a1_id}/set-predecessor"
              payload: { predecessor_activity_id: "${a2_id}" }
              as: OutagePlanner
              captures: { e_cycle: "$.data.error_id" }
            - call: "POST /schedule-activities/${a2_id}/set-predecessor"
              payload: { predecessor_activity_id: "${a2_id}" }
              as: OutagePlanner
              captures: { e_self: "$.data.error_id" }
          assert:
            - "${e_cycle} == ERR_ACTIVITY_CYCLE with HTTP 422 — the A1 -> A2 -> A1 loop is detected by walking the chain, not by a one-hop check"
            - "${e_self} == ERR_ACTIVITY_CYCLE with HTTP 422 for the self-reference"
            - "ScheduleActivity.${a1_id}.predecessor_activity_id is still null and ScheduleActivity.${a2_id}.predecessor_activity_id is still ${a1_id}"
            - "Outage.${o_id}.projected_duration_hours == 275.00 — 250.00 of chain inflated 0.1 per hop is unchanged by the two refusals"

      - name: predecessor_from_another_outage_is_refused
        claim_type: error_triggerable
        grounds: ["errors[ERR_PREDECESSOR_OUTAGE_MISMATCH]", "validations[priority=14]"]
        distinguishing_aspect: "The predecessor id resolves to a real activity, so the priority-5 existence rule passes and the request reaches priority 14, which rejects it purely because the activity belongs to a different outage. A schedule may not be chained across two refuelling outages."
        test_recipe:
          setup:
            - "Two outages: UNIT_1 / 1R24 owning activity A1, and UNIT_2 / 2R24 owning nothing yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o1_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_2", designation: "2R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o2_id: "$.data.id" }
            - call: "POST /outages/${o1_id}/schedule-activities"
              payload: { label: "A1 cavity flood-up on unit 1", planned_start_offset_hours: 0, planned_duration_hours: 100 }
              as: OutagePlanner
              captures: { a1_id: "$.data.id" }
          trigger:
            - call: "POST /outages/${o2_id}/schedule-activities"
              payload: { label: "Cross-unit dependency attempt", planned_start_offset_hours: 0, planned_duration_hours: 50, predecessor_activity_id: "${a1_id}" }
              as: OutagePlanner
              captures: { e_mismatch: "$.data.error_id" }
          assert:
            - "${e_mismatch} == ERR_PREDECESSOR_OUTAGE_MISMATCH with HTTP 422, not a 404 — the referenced activity exists"
            - "GET /schedule-activities?outage_id=${o2_id} returns 0 rows with total_count == 0"
            - "Outage.${o2_id}.projected_duration_hours == 0.00 — nothing entered the second outage's schedule"

