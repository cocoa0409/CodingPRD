              as: NurseCaseManager
              as_user_id: "${nurse_id}"
            - call: "GET /admissions/${adm_a_id}"
              payload: {}
              as: RehabPhysician
              as_user_id: "${phys_id}"
              captures: { adm_a_v: $.data.version }
            - call: "POST /plans-of-care"
              payload: { admission_id: "${adm_a_id}", expected_admission_version: "${adm_a_v}", target_los_days: 14, weekly_minutes_target: 900, disciplines: ["PT"], three_hour_rule_mode: "DAILY_3HR" }
              as: RehabPhysician
              as_user_id: "${phys_id}"
            - call: "GET /admissions/${adm_b_id}"
              payload: {}
              as: RehabPhysician
              as_user_id: "${phys_id}"
              captures: { adm_b_v: $.data.version }
            - call: "POST /plans-of-care"
