        grounds:
          - validations[priority=280]
          - validations[priority=330]
          - errors[ERR_DUPLICATE_RESOURCE]
          - errors[ERR_DISTRIBUTION_LIMIT_EXCEEDED]
          - entities.Engagement.fields.max_distribution_recipients
        distinguishing_aspect: |
          Pair (business_constraint, business_fiscal): with max_distribution_recipients set to 1 and
          one live REQUESTED distribution for 'Acme Corp', a second request for the same recipient
          violates both priority 280 and priority 330 and must return ERR_DUPLICATE_RESOURCE, while a
          request for a different recipient violates only priority 330 and returns
          ERR_DISTRIBUTION_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Engagement 'Proseware' has max_distribution_recipients 1."
            - "One ReportDistribution for recipient_name 'Acme Corp' exists in status REQUESTED, so the live count already equals the ceiling."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Proseware", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"], max_distribution_recipients: 1 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
            - call: "POST /soc/report-distributions"
              payload: { engagement_id: "${eng}", recipient_name: "Acme Corp", recipient_email: "soc@acme.example" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /soc/report-distributions"
              payload: { engagement_id: "${eng}", recipient_name: "Acme Corp", recipient_email: "audit@acme.example" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { err_dup: $.data.error_id }
            - call: "POST /soc/report-distributions"
              payload: { engagement_id: "${eng}", recipient_name: "Globex", recipient_email: "soc@globex.example" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { err_limit: $.data.error_id }
          assert:
            - "${err_dup} == ERR_DUPLICATE_RESOURCE with HTTP status 409"
            - "${err_limit} == ERR_DISTRIBUTION_LIMIT_EXCEEDED with HTTP status 409"
            - "GET /soc/report-distributions?engagement_id=${eng} returns total_count == 1"
            - "ReportDistribution.${d1}.status == REQUESTED"

