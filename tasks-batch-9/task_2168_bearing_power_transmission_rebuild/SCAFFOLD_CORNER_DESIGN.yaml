  # ===========================================================================
  - section: calculations
    instances:

      - name: failure_cause_ladder_selects_the_first_matching_clause
        claim_type: correct_result
        grounds:
          - calculations.failure_cause_coding
          - entities.Inspection.fields.failure_cause_code
          - entities.Inspection.fields.cause_confidence
          - entities.VibrationReading.fields.defect_ratio_outer
        distinguishing_aspect: "Four submitted inspections on one order, each linked to a different reading, resolve to OUTER_RACE_SPALL/HIGH (outer ratio 4.5), OUTER_RACE_SPALL/HIGH on the exact 3.0 == 3.0 tie, INNER_RACE_SPALL/HIGH (inner ratio 4.5) and MISALIGNMENT/MEDIUM (zone D with both ratios at 1.0)."
        test_recipe:
          setup:
            - "One order on a rebuild_count 0 core, four route readings on the same asset, and four DRAFT inspections each carrying one IN_SPEC BORE measurement of 85 um."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Coding Mill", account_code: "COD-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "COD-01-GBX", criticality: "STANDARD", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-COD-1", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", labor_hours: 3.0 }
              as: Planner
              captures: { order_id: $.data.id }
            - call: "POST /shop/vibration-readings"
              payload: { customer_asset_id: "${asset_id}", reading_at: "2026-08-02T06:00:00Z", overall_velocity_mm_s: 3.20, bpfo_amplitude_g: 0.90, bpfi_amplitude_g: 0.30, baseline_amplitude_g: 0.20 }
              as: ReliabilityEngineer
              captures: { vr_outer: $.data.id }
            - call: "POST /shop/vibration-readings"
              payload: { customer_asset_id: "${asset_id}", reading_at: "2026-08-02T06:05:00Z", overall_velocity_mm_s: 3.20, bpfo_amplitude_g: 0.60, bpfi_amplitude_g: 0.60, baseline_amplitude_g: 0.20 }
              as: ReliabilityEngineer
              captures: { vr_tie: $.data.id }
            - call: "POST /shop/vibration-readings"
              payload: { customer_asset_id: "${asset_id}", reading_at: "2026-08-02T06:10:00Z", overall_velocity_mm_s: 3.20, bpfo_amplitude_g: 0.30, bpfi_amplitude_g: 0.90, baseline_amplitude_g: 0.20 }
              as: ReliabilityEngineer
              captures: { vr_inner: $.data.id }
            - call: "POST /shop/vibration-readings"
              payload: { customer_asset_id: "${asset_id}", reading_at: "2026-08-02T06:15:00Z", overall_velocity_mm_s: 4.60, bpfo_amplitude_g: 0.20, bpfi_amplitude_g: 0.20, baseline_amplitude_g: 0.20 }
              as: ReliabilityEngineer
              captures: { vr_mis: $.data.id }
            - call: "POST /shop/inspections"
              payload: { rebuild_order_id: "${order_id}", linked_vibration_reading_id: "${vr_outer}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { i_outer: $.data.id }
            - call: "POST /shop/inspections/${i_outer}/measurements"
              payload: { feature_code: "BORE", measured_um: 85 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections"
              payload: { rebuild_order_id: "${order_id}", linked_vibration_reading_id: "${vr_tie}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { i_tie: $.data.id }
            - call: "POST /shop/inspections/${i_tie}/measurements"
              payload: { feature_code: "BORE", measured_um: 85 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections"
              payload: { rebuild_order_id: "${order_id}", linked_vibration_reading_id: "${vr_inner}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { i_inner: $.data.id }
