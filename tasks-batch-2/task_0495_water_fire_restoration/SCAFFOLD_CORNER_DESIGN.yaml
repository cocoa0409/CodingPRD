# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Water & Fire Restoration / Disaster Cleanup
# Breadth probe over the claim-extraction-guide sections. Each instance grounds
# in SCAFFOLD.yaml §1.1-§1.7 and drives from empty-DB via §1.5 endpoints.
# `excluded_because:` stubs point at the §1.8 instance that already covers them.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_claim_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.InsuranceClaim.fields.status
          - entities.InsuranceClaim.fields.settled_estimate_id
        distinguishing_aspect: "POST /restoration/claims with required fields returns 201; status defaults OPEN, settled_estimate_id null, id/created_at/version system-minted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "PC1", peril: "WATER", coverage_limit_cents: 100000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id, st: $.data.status }
          assert:
            - "response status == 201"
            - "InsuranceClaim.${claim_id}.status == OPEN"
            - "InsuranceClaim.${claim_id}.settled_estimate_id == null"
            - "InsuranceClaim.${claim_id}.version == 1"

      - name: create_job_missing_water_category_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.LossJob.fields.water_category
          - entities.LossJob.fields.water_class
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A WATER job created without water_category/water_class violates the conditional-required rule and returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A claim exists."]
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "PC2", peril: "WATER", coverage_limit_cents: 100000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "X", loss_type: "WATER" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_job_computes_antimicrobial_required_for_category3
        claim_type: Computed Fields
        grounds:
          - entities.LossJob.fields.antimicrobial_required
        distinguishing_aspect: "A WATER category-3 (black water) job has antimicrobial_required computed true; client cannot override it."
        test_recipe:
          setup: ["A claim exists."]
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "PC3", peril: "WATER", coverage_limit_cents: 100000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "X", loss_type: "WATER", water_category: 3, water_class: 3 }
              as: Dispatcher
              captures: { job_id: $.data.id, amr: $.data.antimicrobial_required }
          assert:
            - "LossJob.${job_id}.antimicrobial_required == true"

      - name: create_job_invalid_enum_loss_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.LossJob.fields.loss_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A loss_type outside {WATER,FIRE,SMOKE} is rejected with ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A claim exists."]
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "PC4", peril: "WATER", coverage_limit_cents: 100000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "X", loss_type: "FLOOD" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: get_job_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /restoration/jobs/{id} for a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /restoration/jobs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_job_unknown_claim_returns_reference_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.LossJob.fields.claim_id
          - validations[priority=4]
          - errors[ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: "A job referencing a non-existent claim_id returns ERR_REFERENCE_NOT_FOUND (404), distinct from path-not-found."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /restoration/jobs"
              payload: { claim_id: "00000000-0000-0000-0000-000000000000", property_address: "X", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_REFERENCE_NOT_FOUND"

      - name: equipment_unit_create_defaults_available
        claim_type: Defaults
        grounds:
          - entities.EquipmentUnit.fields.status
          - entities.EquipmentUnit.fields.active_placement_id
        distinguishing_aspect: "A freshly registered EquipmentUnit defaults to status AVAILABLE with active_placement_id null."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "AM-C", kind: "AIR_MOVER" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id, st: $.data.status }
          assert:
            - "response status == 201"
            - "EquipmentUnit.${unit_id}.status == AVAILABLE"
            - "EquipmentUnit.${unit_id}.active_placement_id == null"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: start_mitigation_without_chambers_returns_no_chambers
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.LossJob.DISPATCHED_to_MITIGATION
          - errors[ERR_NO_CHAMBERS]
        distinguishing_aspect: "start-mitigation on a DISPATCHED job with zero chambers fails ERR_NO_CHAMBERS (409); no transition occurs."
        test_recipe:
          setup: ["A WATER job DISPATCHED with no chambers."]
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "PC5", peril: "WATER", coverage_limit_cents: 500000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "T", certification: "WRT" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "X", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /restoration/jobs/${job_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /restoration/jobs/${job_id}/start-mitigation"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_NO_CHAMBERS"
            - "LossJob.${job_id}.status == DISPATCHED"

      - name: complete_without_approved_estimate_returns_no_approved_estimate
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.LossJob.MONITORING_to_COMPLETED
          - errors[ERR_NO_APPROVED_ESTIMATE]
        distinguishing_aspect: "complete on a fully-dried, equipment-cleared MONITORING job that has no APPROVED estimate fails ERR_NO_APPROVED_ESTIMATE (409)."
        test_recipe:
          setup: ["A WATER job in MONITORING, chamber R1 DRIED, all equipment removed, but NO approved estimate."]
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "PC6", peril: "WATER", coverage_limit_cents: 9000000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "T", certification: "ASD" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "AM-C6", kind: "AIR_MOVER" }
              as: PlatformAdmin
              captures: { am: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "DH-C6", kind: "DEHUMIDIFIER" }
              as: PlatformAdmin
              captures: { dh: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "X", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /restoration/jobs/${job_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "R1", floor_area_sqft: 100, wet_wall_linear_ft: 0, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ch1: $.data.id }
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${am}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pl_am: $.data.id }
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${dh}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pl_dh: $.data.id }
            - call: "POST /restoration/jobs/${job_id}/start-mitigation"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/jobs/${job_id}/begin-monitoring"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/chambers/${ch1}/readings"
              payload: { temp_f: 72, relative_humidity_pct: 38, moisture_content_pct: 15 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/placements/${pl_am}/remove"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/placements/${pl_dh}/remove"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /restoration/jobs/${job_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_NO_APPROVED_ESTIMATE"

      - name: complete_with_active_placement_returns_equipment_still_deployed
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.LossJob.MONITORING_to_COMPLETED
          - errors[ERR_EQUIPMENT_STILL_DEPLOYED]
        distinguishing_aspect: "complete on a dried job with an APPROVED estimate but an ACTIVE placement still present fails ERR_EQUIPMENT_STILL_DEPLOYED (409)."
        test_recipe:
          setup: ["A WATER MONITORING job, chamber R1 DRIED, APPROVED estimate, but one air-mover placement still ACTIVE."]
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "PC7", peril: "WATER", coverage_limit_cents: 9000000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
