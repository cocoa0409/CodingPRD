  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_shape_for_success_and_error
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Every response wraps data in the fixed envelope: success has meta.api_request_id + meta.api_request_timestamp + response_type object/array + data; errors carry response_type error with data.error_id and data.message."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "GET /district/fiscal-years/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "Success response: meta.api_request_id and meta.api_request_timestamp present, response_type == object, data carries the FiscalYear"
            - "Error response: response_type == error with data.error_id == ERR_FISCAL_YEAR_NOT_FOUND and a human-readable data.message"

      - name: subresource_lists_reverse_reach_fk_children
        claim_type: standard_crud
        grounds: [entities.BudgetVersion.fields.fiscal_year_id, entities.EnrollmentProjection.fields.fiscal_year_id, entities.BondProposal.fields.fiscal_year_id]
        distinguishing_aspect: "Every FK has a reverse-reachability GET: a fiscal year's projections, budget versions, and bond proposals are each listable under the parent's sub-resource path and return arrays (empty when no children)."
        test_recipe:
          setup: ["FY2028 OPEN with one ELEMENTARY projection and one budget version; no bond proposals"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 1200 }
              as: BudgetAnalyst
              captures: { ep: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
          trigger:
            - call: "GET /district/fiscal-years/${fy}/enrollment-projections"
              as: Auditor
              captures: { ep0: "$.data[0].id" }
            - call: "GET /district/fiscal-years/${fy}/budget-versions"
              as: Auditor
              captures: { bv0: "$.data[0].id" }
            - call: "GET /district/fiscal-years/${fy}/bond-proposals"
              as: Auditor
          assert:
            - "GET projections returns exactly [${ep}]; GET budget-versions returns exactly [${bv}]"
            - "GET bond-proposals returns an empty array with total_count 0 (array shape even when empty)"

      - name: revenue_estimate_computed_read_matches_formula
        claim_type: computed_read
        grounds: [calculations.total_revenue_and_balance]
        distinguishing_aspect: "The estimate's computed read exposes every derived field: capped_operating_levy 8,500,000.00, total_levy 9,700,000.00, state_aid 13,204,000.00, total_revenue 23,404,000.00 — recomputed fields visible in a single GET."
        test_recipe:
          setup: ["FY2028 OPEN with three projections (1200/800/1000) and a budget version carrying a revenue estimate"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 1200 }
              as: BudgetAnalyst
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "MIDDLE", projected_pupils: 800 }
              as: BudgetAnalyst
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "HIGH", projected_pupils: 1000 }
              as: BudgetAnalyst
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
            - call: "POST /district/budget-versions/${bv}/revenue-estimates"
              payload: { operating_levy_request: 8500000, debt_service_levy: 1200000, other_revenue: 500000, cpi_rate: 0.034 }
              as: BusinessManager
              captures: { re: $.data.id }
          trigger:
            - call: "GET /district/budget-versions/${bv}/revenue-estimates"
              as: Auditor
              captures: { aid: "$.data[0].state_aid", levy: "$.data[0].total_levy", rev: "$.data[0].total_revenue", capped: "$.data[0].capped_operating_levy" }
          assert:
            - "capped_operating_levy == 8500000.00 (request below PTELL cap 9,306,000 passes through)"
            - "total_levy == 9700000.00; state_aid == 13204000.00; total_revenue == 23404000.00 (13,204,000 + 9,700,000 + 500,000)"

      - name: budget_version_total_appropriations_recomputed_on_line_add
        claim_type: computed_read
        grounds: [entities.BudgetVersion.fields.total_appropriations]
        distinguishing_aspect: "Derived-field reconciliation is immediate: total_appropriations reflects each line creation in the same request and in subsequent reads."
        test_recipe:
          setup: ["FY2028 OPEN with budget version v1"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
          trigger:
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "EDUCATION", function_code: "1100", object_code: "100", cost_center: "DISTRICT", appropriation_amount: 12000000 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "OPERATIONS", function_code: "2500", object_code: "300", cost_center: "DISTRICT", appropriation_amount: 6000000 }
              as: BudgetAnalyst
            - call: "GET /district/budget-versions/${bv}"
              as: Auditor
              captures: { total: $.data.total_appropriations }
          assert:
            - "BudgetVersion.${bv}.total_appropriations == 18000000.00 after the two line creates (immediate consistency)"

