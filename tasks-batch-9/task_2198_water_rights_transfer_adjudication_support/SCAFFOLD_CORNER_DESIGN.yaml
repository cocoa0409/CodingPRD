          assert:
            - "HTTP 422 with error_id ERR_APPLICATION_SCOPE_INCOMPLETE."
            - "ERR_STUDY_RIGHT_MISMATCH (422) must NOT be returned even though the cited study belongs to R2."
            - "No TransferApplication row is created."

      - name: val_priority_stale_parent_version_precedes_state_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=15]
          - validations[priority=17]
          - concurrency_rules[application-submit-stale-right]
        distinguishing_aspect: >-
          Re-submitting an already SUBMITTED application while ALSO presenting the
          pre-submit right version returns 412 STALE_RIGHT_VERSION, not 409
          INVALID_STATE: concurrency at priority 15 is checked before lifecycle
          state at priority 17, so a lost update is reported as a lost update.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; right certified at 195.00 AF with a DRAFT application for 100.00 AF and a DRAFT injury analysis. The right's version is captured immediately BEFORE the first submit."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 100.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app: "$.data.id"}}
            - {call: "POST /transfer-applications/${app}/injury-analyses", payload: {method: SEASONAL_AVERAGE, pod_move_miles: 0.00, return_flow_credit_af: 78.00}, as: WaterRightsAnalyst}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v2: "$.data.version"}}
            - {call: "POST /transfer-applications/${app}/submit", payload: {expected_water_right_version: "${wr_v2}"}, as: WaterRightsAnalyst}
          trigger:
            - {call: "POST /transfer-applications/${app}/submit", payload: {expected_water_right_version: "${wr_v2}"}, as: WaterRightsAnalyst, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 412 with error_id ERR_STALE_RIGHT_VERSION."
            - "ERR_INVALID_STATE (409) must NOT be returned even though the application is already SUBMITTED."
            - "The right's ledger is untouched by the rejected call: 95.00 / 100.00 / 0.00 and its version is unchanged from the value written by the first submit."
            - "The application stays SUBMITTED with escrowed_af 100.00 and its version does not move."

      - name: val_priority_state_check_precedes_analysis_prerequisite
        claim_type: priority_ordering
        grounds:
          - validations[priority=17]
          - validations[priority=25]
        distinguishing_aspect: >-
          A disposition attempted on a DRAFT application that also has no injury
          analysis returns 409 INVALID_STATE, not 422 INJURY_ANALYSIS_MISSING —
          lifecycle state at priority 17 is checked before the evidentiary
          prerequisite at priority 25, which is why the prerequisite error is only
          observable on the publish path.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; right certified at 195.00 AF with a DRAFT application for 100.00 AF and NO injury analysis at all."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
