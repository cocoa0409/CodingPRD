              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "B3", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_a_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "B4", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_b_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_a_id}", full_name: "Ada", email: "ada2@x.com" }
              as: PropertyManager
              captures: { res_a_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_b_id}", full_name: "Bo", email: "bo2@x.com" }
              as: PropertyManager
              captures: { res_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PropertyManager
            - call: "POST /amenities"
              payload: { property_id: "${prop_id}", name: "Gym", amenity_type: "GYM", capacity: 1, base_rate_cents_per_hour: 1000, deposit_cents: 0, buffer_minutes: 0, open_minute: 0, close_minute: 1440 }
              as: PropertyManager
              captures: { amenity_id: $.data.id, amenity_v: $.data.version }
            - call: "POST /amenity-bookings"
              payload: { amenity_id: "${amenity_id}", resident_id: "${res_a_id}", start_at: "2026-06-12T10:00:00Z", end_at: "2026-06-12T11:00:00Z", expected_amenity_version: "${amenity_v}" }
              as: Resident
              as_user_id: "${res_a_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /amenity-bookings/${booking_id}/cancel"
