      - name: dispute_request_info_twice_in_a_row_is_an_invalid_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.Dispute.transitions.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.Dispute.transitions.INFO_REQUESTED_to_UNDER_REVIEW
          - validations[priority=8][ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          From INFO_REQUESTED the only legal trigger is resubmit, so a second
          request-info is 409 ERR_INVALID_STATE_TRANSITION and NOT 422
          ERR_INFO_ROUND_LIMIT — info_request_count is 1, still under the cap of
          2 — and a second resubmit from UNDER_REVIEW is likewise a 409, proving
          both directions of the loop are from-state guarded.
