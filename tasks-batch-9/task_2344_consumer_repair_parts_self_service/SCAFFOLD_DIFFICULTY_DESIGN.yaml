# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2344 — Consumer Repair Parts & Self-Service Repair Program
# 9 difficulty rules / 20 instances. Every instance grounds in SCAFFOLD.yaml
# §1.1-§1.7 only; every asserted number was produced by executing the
# §1.3 formulas with their declared constants.
# Logical clock starts at 2026-08-01T00:00:00Z and only ever moves forward.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: core_credit_provisional_hold_vs_final_settlement_diverge
        grounds:
          - calculations.core_return_credit_settlement
          - entities.PartsOrder.fields.core_credit_provisional_cents
          - entities.PartsOrder.fields.core_credit_final_cents
          - state_machines.PartsOrder.PENDING_CORE_to_CORE_RECEIVED
          - state_machines.PartsOrder.CORE_RECEIVED_to_CORE_CREDIT_ISSUED
        distinguishing_aspect: |
          This instance lives in the core-return money domain (PartsOrder / PartCatalogItem
          cents ledger): the PROVISIONAL_HOLD variant stamps the raw face value 5000 at
          confirm while FINAL_SETTLEMENT grades the identical face value by condition and
          lateness down to 2100, a 2900-cent divergence on the same inputs.
        test_recipe:
          setup:
            - "Region profile US-CA exists with requires_public_manual=false and max_documentation_fee_cents=2000."
            - "ProductModel CRX-1000 is TIER_A_SELF_SERVICE with a PUBLISHED DISASSEMBLY_GUIDE revision 1 carrying 4 safety warnings."
            - "PartCatalogItem SKU-BATT-CORE is PUBLISHED, COMPONENT, UNRESTRICTED, list 8000 cents, core_return_required=true, core_credit_cents=2500."
            - "A consumer order for quantity 2 of that part is acknowledged, confirmed at clock 2026-08-01 and DELIVERED."
            - "The logical clock is then moved to 2026-09-08, i.e. 8 whole days past the 2026-08-31 core deadline."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/product-models"
              payload: { model_code: "CRX-1000", product_family: "CRX", market_release_date: "2025-01-15T00:00:00Z", repairability_tier: "TIER_A_SELF_SERVICE" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { model_id: $.data.id }
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-BATT-CORE", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 8000, core_return_required: true, core_credit_cents: 2500 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_id: $.data.id }
            - call: "POST /repair-program/part-compatibilities"
              payload: { part_id: "${part_id}", model_id: "${model_id}", effective_from: "2025-02-01T00:00:00Z", self_service_eligible: true, install_minutes: 30 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/part-catalog-items/${part_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "GET /repair-program/product-models/${model_id}"
              payload: {}
              as: DocumentationEngineer
              captures: { mv1: $.data.version }
            - call: "POST /repair-program/manual-revisions"
              payload: { model_id: "${model_id}", doc_type: "DISASSEMBLY_GUIDE", covered_part_skus: ["SKU-BATT-CORE"], safety_warning_count: 4, expected_model_version: "${mv1}" }
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
              captures: { guide_id: $.data.id }
            - call: "POST /repair-program/manual-revisions/${guide_id}/submit"
              payload: {}
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
            - call: "POST /repair-program/manual-revisions/${guide_id}/review-decision"
              payload: { decision: "APPROVE", review_note: "warnings and coverage verified" }
              as: SafetyReviewer
              as_user_id: "u_rev_1"
            - call: "POST /repair-program/manual-revisions/${guide_id}/publish"
              payload: {}
              as: SafetyReviewer
              as_user_id: "u_rev_1"
            - call: "POST /repair-program/eligibility-assessments"
              payload: { model_id: "${model_id}", part_id: "${part_id}", region_code: "US-CA", requester_class: "SELF_REPAIR_CONSUMER" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { assessment_id: $.data.id }
            - call: "POST /repair-program/parts-orders"
              payload: { assessment_id: "${assessment_id}", region_code: "US-CA", buyer_class: "SELF_REPAIR_CONSUMER" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { order_id: $.data.id, ov1: $.data.version }
            - call: "POST /repair-program/parts-orders/${order_id}/lines"
              payload: { part_id: "${part_id}", quantity: 2, expected_order_version: "${ov1}" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { line_id: $.data.id }
            - call: "POST /repair-program/parts-orders/${order_id}/request-disclosure"
              payload: {}
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
            - call: "POST /repair-program/parts-orders/${order_id}/acknowledgments"
              payload: { warranty_impact_class_ack: "WARRANTY_PRESERVED_WITH_LOG", liability_warning_version: "LW-CRX-1000-R1", acknowledged_scope: "FULL_SELF_REPAIR" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
            - call: "POST /repair-program/parts-orders/${order_id}/confirm"
              payload: {}
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
            - call: "POST /repair-program/parts-orders/${order_id}/deliver"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /repair-program/parts-orders/${order_id}/core-returns"
              payload: { core_condition: "DAMAGED_SHELL", received_at: "2026-09-08T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
          assert:
            - "PartsOrder.${order_id}.parts_subtotal_cents == 16000"
            - "PartsOrder.${order_id}.documentation_fee_cents == 980"
            - "PartsOrder.${order_id}.core_deposit_cents == 5000"
            - "PartsOrder.${order_id}.total_due_cents == 21980"
            - "PartsOrder.${order_id}.core_return_due_at == 2026-08-31T00:00:00Z"
            - "PartsOrder.${order_id}.core_credit_provisional_cents == 5000"
            - "PartsOrder.${order_id}.core_days_late == 8"
            - "PartsOrder.${order_id}.core_credit_final_cents == 2100"
            - "PartsOrder.${order_id}.core_credit_provisional_cents - PartsOrder.${order_id}.core_credit_final_cents == 2900"
            - "PartsOrder.${order_id}.core_return_status == CORE_CREDIT_ISSUED"
            - "PartsOrder.${order_id}.fulfillment_status == CLOSED"
            - "PartCatalogItem.${part_id}.core_face_value_committed_cents == 5000"
            - "PartCatalogItem.${part_id}.core_liability_outstanding_cents == 0"
            - "PartCatalogItem.${part_id}.core_credit_settled_cents == 2100"
            - "PartCatalogItem.${part_id}.core_credit_forfeited_cents == 2900"

      - name: provider_compliance_score_rolling_attested_vs_live_recompute_split_bands
        grounds:
          - calculations.provider_compliance_score
          - entities.RepairProvider.fields.attested_compliance_score
          - entities.RepairProvider.fields.parts_access_tier
          - entities.TrainingCertification.fields.valid_from
          - entities.DefectiveReturnCase.fields.root_cause_code
        distinguishing_aspect: |
          This instance lives in the provider-governance scoring domain (RepairProvider /
          TrainingCertification / DefectiveReturnCase), not the money ledger of the first
          instance: on one frozen data set ROLLING_ATTESTED scores 50 (TIER_3_STANDARD)
          because it counts only clock-in-window certifications and closed cases, while
          LIVE_RECOMPUTE scores 73 (TIER_2_SAFETY) on the same rows.
        test_recipe:
          setup:
            - "Region profile US-CA exists; ProductModel CRX-2000 is TIER_C_AUTHORIZED_ONLY with a PUBLISHED DISASSEMBLY_GUIDE (3 warnings) and a PUBLISHED CALIBRATION_PROCEDURE."
            - "PartCatalogItem SKU-CAL-SENSOR is PUBLISHED, COMPONENT, UNRESTRICTED, list 5000 cents, requires_calibration=true."
            - "RepairProvider has technician_count 9 (required_cert_count 3) and 10 training credits; one certification is in force at the 2026-08-01 clock and two more start 2026-10-01, so active_cert_count is 3 and AUTHORIZE succeeds."
            - "The provider's delivered order line failed its only calibration attempt (400 ppm) and carries an ANALYSIS_COMPLETE defective-return case with root_cause_code PROVIDER_INSTALL_ERROR."
            - "The logical clock never leaves 2026-08-01T00:00:00Z, so the two future certifications stay outside the rolling window."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/product-models"
              payload: { model_code: "CRX-2000", product_family: "CRX", market_release_date: "2025-03-01T00:00:00Z", repairability_tier: "TIER_C_AUTHORIZED_ONLY" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { model_id: $.data.id }
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-CAL-SENSOR", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 5000, core_return_required: false, requires_calibration: true }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_id: $.data.id }
            - call: "POST /repair-program/part-compatibilities"
              payload: { part_id: "${part_id}", model_id: "${model_id}", effective_from: "2025-04-01T00:00:00Z", self_service_eligible: false, install_minutes: 45 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/part-catalog-items/${part_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "GET /repair-program/product-models/${model_id}"
              payload: {}
              as: DocumentationEngineer
              captures: { mv1: $.data.version }
            - call: "POST /repair-program/manual-revisions"
              payload: { model_id: "${model_id}", doc_type: "DISASSEMBLY_GUIDE", covered_part_skus: ["SKU-CAL-SENSOR"], safety_warning_count: 3, expected_model_version: "${mv1}" }
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
              captures: { guide_id: $.data.id }
            - call: "POST /repair-program/manual-revisions/${guide_id}/submit"
              payload: {}
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
            - call: "POST /repair-program/manual-revisions/${guide_id}/review-decision"
              payload: { decision: "APPROVE", review_note: "coverage complete" }
              as: SafetyReviewer
              as_user_id: "u_rev_1"
            - call: "POST /repair-program/manual-revisions/${guide_id}/publish"
              payload: {}
              as: SafetyReviewer
              as_user_id: "u_rev_1"
            - call: "GET /repair-program/product-models/${model_id}"
              payload: {}
              as: DocumentationEngineer
              captures: { mv2: $.data.version }
            - call: "POST /repair-program/manual-revisions"
              payload: { model_id: "${model_id}", doc_type: "CALIBRATION_PROCEDURE", covered_part_skus: ["SKU-CAL-SENSOR"], safety_warning_count: 2, expected_model_version: "${mv2}" }
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
              captures: { calproc_id: $.data.id }
            - call: "POST /repair-program/manual-revisions/${calproc_id}/submit"
              payload: {}
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
            - call: "POST /repair-program/manual-revisions/${calproc_id}/review-decision"
              payload: { decision: "APPROVE", review_note: "procedure verified" }
              as: SafetyReviewer
              as_user_id: "u_rev_1"
            - call: "POST /repair-program/manual-revisions/${calproc_id}/publish"
              payload: {}
              as: SafetyReviewer
              as_user_id: "u_rev_1"
            - call: "POST /repair-program/repair-providers"
              payload: { legal_name: "Northwind Repair LLC", region_code: "US-CA", requested_access_tier: "TIER_2_SAFETY", technician_count: 9 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { provider_id: $.data.id }
            - call: "POST /repair-program/repair-providers/${provider_id}/begin-training"
              payload: { training_credit_grant: 10 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/training-certifications"
              payload: { provider_id: "${provider_id}", technician_user_id: "u_tech_1", course_code: "CRS_GENERAL_REPAIR", valid_from: "2026-07-01T00:00:00Z", valid_until: "2027-07-01T00:00:00Z", exam_score: 88 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/training-certifications"
              payload: { provider_id: "${provider_id}", technician_user_id: "u_tech_2", course_code: "CRS_GENERAL_REPAIR", valid_from: "2026-10-01T00:00:00Z", valid_until: "2027-10-01T00:00:00Z", exam_score: 90 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/training-certifications"
              payload: { provider_id: "${provider_id}", technician_user_id: "u_tech_3", course_code: "CRS_GENERAL_REPAIR", valid_from: "2026-10-01T00:00:00Z", valid_until: "2027-10-01T00:00:00Z", exam_score: 90 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/repair-providers/${provider_id}/authorization-decision"
              payload: { decision: "AUTHORIZE", decision_reason: "training coverage met", granted_access_tier: "TIER_2_SAFETY" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/eligibility-assessments"
              payload: { model_id: "${model_id}", part_id: "${part_id}", region_code: "US-CA", requester_class: "AUTHORIZED_PROVIDER", provider_id: "${provider_id}" }
              as: RepairProviderTech
              as_user_id: "u_tech_1"
              captures: { assessment_id: $.data.id }
            - call: "POST /repair-program/parts-orders"
              payload: { assessment_id: "${assessment_id}", region_code: "US-CA", buyer_class: "AUTHORIZED_PROVIDER", provider_id: "${provider_id}" }
              as: RepairProviderTech
              as_user_id: "u_tech_1"
              captures: { order_id: $.data.id, ov1: $.data.version }
            - call: "POST /repair-program/parts-orders/${order_id}/lines"
              payload: { part_id: "${part_id}", quantity: 1, expected_order_version: "${ov1}" }
              as: RepairProviderTech
              as_user_id: "u_tech_1"
              captures: { line_id: $.data.id }
            - call: "POST /repair-program/parts-orders/${order_id}/request-disclosure"
              payload: {}
              as: RepairProviderTech
              as_user_id: "u_tech_1"
            - call: "POST /repair-program/parts-orders/${order_id}/acknowledgments"
              payload: { warranty_impact_class_ack: "WARRANTY_PRESERVED", liability_warning_version: "LW-CRX-2000-R1", acknowledged_scope: "PROVIDER_MANAGED" }
              as: RepairProviderTech
              as_user_id: "u_tech_1"
            - call: "POST /repair-program/parts-orders/${order_id}/confirm"
              payload: {}
              as: RepairProviderTech
              as_user_id: "u_tech_1"
            - call: "POST /repair-program/parts-orders/${order_id}/deliver"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/parts-orders/${order_id}/lines/${line_id}/calibrate"
              payload: { measured_offset_ppm: 400 }
              as: RepairProviderTech
              as_user_id: "u_tech_1"
            - call: "POST /repair-program/defective-returns"
              payload: { order_line_id: "${line_id}", reported_failure_code: "CALIBRATION_DRIFT", quantity: 1 }
              as: RepairProviderTech
              as_user_id: "u_tech_1"
              captures: { case_id: $.data.id }
            - call: "POST /repair-program/defective-returns/${case_id}/receive"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/defective-returns/${case_id}/analysis"
              payload: { root_cause_code: "PROVIDER_INSTALL_ERROR", defect_confirmed: true, analysis_note: "torque spec not followed" }
              as: FailureAnalysisEngineer
              as_user_id: "u_fae_1"
          trigger:
            - call: "GET /repair-program/repair-providers/${provider_id}/compliance-score"
              payload: { variant: "ROLLING_ATTESTED" }
              as: ComplianceOfficer
              captures: { rolling_score: $.data.score }
            - call: "GET /repair-program/repair-providers/${provider_id}/compliance-score"
              payload: { variant: "LIVE_RECOMPUTE" }
              as: ComplianceOfficer
              captures: { live_score: $.data.score }
          assert:
            - "PartsOrderLine.${line_id}.line_total_cents == 4592"
            - "PartsOrder.${order_id}.documentation_fee_cents == 860"
            - "PartsOrder.${order_id}.total_due_cents == 5452"
            - "DefectiveReturnCase.${case_id}.provisional_credit_cents == 2296"
            - "RepairProvider.${provider_id}.required_cert_count == 3"
            - "RepairProvider.${provider_id}.active_cert_count == 3"
            - "RepairProvider.${provider_id}.attested_compliance_score == 70"
            - "RepairProvider.${provider_id}.parts_access_tier == TIER_2_SAFETY"
            - "ROLLING_ATTESTED response: cert_coverage_ratio == 0.3333 (1 of 3), breach_count == 0, calibration_failure_ratio == 1.0"
            - "ROLLING_ATTESTED response: score == 50 and access_tier_band == TIER_3_STANDARD"
            - "LIVE_RECOMPUTE response: cert_coverage_ratio == 1.0, breach_count == 1, calibration_failure_ratio == 1.0"
            - "LIVE_RECOMPUTE response: score == 73 and access_tier_band == TIER_2_SAFETY"
            - "${live_score} - ${rolling_score} == 23 on identical stored rows"

  - rule_id: combinatorial_formula
    instances:
      - name: order_pricing_rounds_each_line_once_before_summing_subtotal
        grounds:
          - calculations.parts_order_pricing
          - entities.PartsOrderLine.fields.unit_price_cents
          - entities.PartsOrderLine.fields.line_total_cents
          - entities.PartsOrder.fields.parts_subtotal_cents
          - state_machines.PartsOrder.DRAFT_to_PENDING_DISCLOSURE
        distinguishing_aspect: |
          Mode (b) — pinned intermediate rounding order: the four multipliers stay
          unrounded, round_half_up fires exactly once per line at step 6 and the display
          unit price at step 7 is never multiplied, so the subtotal is 4503 rather than
          4502 (sum-then-round) or 4504 (round-unit-then-multiply).
        test_recipe:
          setup:
            - "Region profile US-CA exists with max_documentation_fee_cents 2000 and requires_public_manual false."
            - "ProductModel CRX-3000 is TIER_C_AUTHORIZED_ONLY (tier surcharge 1.12) with a PUBLISHED DISASSEMBLY_GUIDE carrying 3 safety warnings and covering both SKUs."
            - "Two PUBLISHED COMPONENT parts SKU-HINGE-A and SKU-HINGE-B both list at 1005 cents, both UNRESTRICTED, neither core-returnable."
            - "A consumer DRAFT order holds line 1 = 3 units of SKU-HINGE-A and line 2 = 1 unit of SKU-HINGE-B; buyer multiplier 1.00 and volume multiplier 1.00 apply to both."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/product-models"
              payload: { model_code: "CRX-3000", product_family: "CRX", market_release_date: "2025-05-01T00:00:00Z", repairability_tier: "TIER_C_AUTHORIZED_ONLY" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { model_id: $.data.id }
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-HINGE-A", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 1005, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_a: $.data.id }
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-HINGE-B", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 1005, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_b: $.data.id }
            - call: "POST /repair-program/part-compatibilities"
              payload: { part_id: "${part_a}", model_id: "${model_id}", effective_from: "2025-06-01T00:00:00Z", self_service_eligible: true, install_minutes: 20 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/part-compatibilities"
              payload: { part_id: "${part_b}", model_id: "${model_id}", effective_from: "2025-06-01T00:00:00Z", self_service_eligible: true, install_minutes: 20 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/part-catalog-items/${part_a}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/part-catalog-items/${part_b}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "GET /repair-program/product-models/${model_id}"
              payload: {}
              as: DocumentationEngineer
              captures: { mv1: $.data.version }
            - call: "POST /repair-program/manual-revisions"
              payload: { model_id: "${model_id}", doc_type: "DISASSEMBLY_GUIDE", covered_part_skus: ["SKU-HINGE-A", "SKU-HINGE-B"], safety_warning_count: 3, expected_model_version: "${mv1}" }
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
              captures: { guide_id: $.data.id }
            - call: "POST /repair-program/manual-revisions/${guide_id}/submit"
              payload: {}
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
            - call: "POST /repair-program/manual-revisions/${guide_id}/review-decision"
              payload: { decision: "APPROVE", review_note: "both hinges covered" }
              as: SafetyReviewer
              as_user_id: "u_rev_1"
            - call: "POST /repair-program/manual-revisions/${guide_id}/publish"
              payload: {}
              as: SafetyReviewer
              as_user_id: "u_rev_1"
            - call: "POST /repair-program/eligibility-assessments"
              payload: { model_id: "${model_id}", part_id: "${part_a}", region_code: "US-CA", requester_class: "SELF_REPAIR_CONSUMER" }
