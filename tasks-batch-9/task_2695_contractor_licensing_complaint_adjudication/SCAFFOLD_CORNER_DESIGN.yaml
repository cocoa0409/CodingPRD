            - "${at_ceiling} == 40 (the second setup credit landed exactly on the ceiling and returned 200)"
            - "response http status == 422"
            - "${err} == ERR_CE_HOURS_CEILING_EXCEEDED"
            - "License.${lc_id}.ce_hours_completed == 40"

      - name: corner_approval_cascade_runs_three_hops_in_one_request
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - "endpoints[POST /licensing/license-applications/{id}/decision].side_effects"
        excluded_because:
          difficulty_instance: application_approval_cascade_mints_license_designation_and_qualifier_count
          rationale: "That §1.8 transitive-cascade instance already asserts all three hops of the approval cascade in one request — the minted ACTIVE License with its 24-month term, the RESPONSIBLE_MANAGING_EMPLOYEE designation, the qualifier count increment and the NON_COMPLIANT posture stamp — leaving nothing for a separate corner probe."

      - name: corner_citation_penalty_switches_variant_after_the_hearing
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations[citation_civil_penalty].variants
          - entities[Citation].penalty_variant
        excluded_because:
          difficulty_instance: citation_penalty_initial_assessment_vs_post_hearing_mitigation
          rationale: "The §1.8 dual-variant instance issues the citation under INITIAL_ASSESSMENT, then decides the appeal with a timely correction so the POST_HEARING_RECALCULATION variant applies the 25% mitigation credit, asserting both figures and the penalty_variant flip plus the licensee ledger delta."

  - section: consistency model
    instances:

      - name: corner_approval_is_immediately_readable_on_every_touched_row
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - "endpoints[POST /licensing/license-applications/{id}/decision].side_effects"
          - entities[License].compliance_posture
        distinguishing_aspect: "The consistency model is immediate, so the reads that follow the approval call in the same test — the new License, its designation, the qualifier's count and the licensee's ledger fields — must already show the cascaded values with no sweep, retry or delay."
        test_recipe:
          setup:
            - "clock at 2026-08-01 with one SUBMITTED C-10 application whose gates are all satisfied and a qualifier holding no designations"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/trade-classifications"
              payload: { code: "C-10", name: "Electrical", hazard_tier: 3, min_experience_months: 48, min_net_worth_cents: 250000, required_bond_amount_cents: 1500000, required_ce_hours: 8, renewal_base_fee_cents: 45000, mediation_required: true }
              as: BoardAdmin
              captures: { cls_id: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Immediate Read Electric LLC", entity_type: "LLC", contact_email: "immediate@x.test" }
              as: LicensingAnalyst
              captures: { lic_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals"
              payload: { full_name: "Ima Immediate", verified_experience_months: 60 }
              as: LicensingAnalyst
              captures: { qi_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals/${qi_id}/exam-results"
              payload: { exam_type: "LAW_AND_BUSINESS", score: 88, taken_on: "2025-03-01" }
              as: LicensingAnalyst
            - call: "POST /licensing/qualifying-individuals/${qi_id}/exam-results"
              payload: { exam_type: "TRADE", trade_code: "C-10", score: 84, taken_on: "2025-03-01" }
              as: LicensingAnalyst
            - call: "POST /licensing/license-applications"
              payload: { licensee_id: "${lic_id}", classification_id: "${cls_id}", qualifying_individual_id: "${qi_id}", application_type: "ORIGINAL", declared_net_worth_cents: 400000 }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/license-applications/${app_id}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
          trigger:
            - call: "POST /licensing/license-applications/${app_id}/decision"
              payload: { outcome: "APPROVED" }
              as: LicensingAnalyst
              captures: { app_status: $.data.status }
            - call: "GET /licensing/licenses?application_id=${app_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { lc_id: "$.data[0].id" }
            - call: "GET /licensing/qualifier-assignments?license_id=${lc_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { qa_id: "$.data[0].id" }
          assert:
            - "trigger call 1 response http status == 200 and ${app_status} == APPROVED"
            - "trigger call 2 response total_count == 1"
            - "License.${lc_id}.status == ACTIVE"
            - "License.${lc_id}.issued_on == 2026-08-01"
            - "License.${lc_id}.expires_on == 2028-08-01"
            - "License.${lc_id}.compliance_posture == NON_COMPLIANT"
            - "License.${lc_id}.qualifying_individual_id == ${qi_id}"
            - "trigger call 3 response total_count == 1"
            - "QualifierAssignment.${qa_id}.relationship_type == RESPONSIBLE_MANAGING_EMPLOYEE"
            - "QualifierAssignment.${qa_id}.status == ACTIVE"
            - "QualifierAssignment.${qa_id}.effective_from == 2026-08-01"
            - "QualifyingIndividual.${qi_id}.active_qualification_count == 1"
