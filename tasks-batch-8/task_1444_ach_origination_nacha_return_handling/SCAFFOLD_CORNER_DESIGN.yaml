  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID fails ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ach/originators/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_UNAUTHENTICATED (http 401)"

      - name: priority_conflicts_covered_by_difficulty_design
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=8]", "validations[priority=9]", "validations[priority=11]"]
        excluded_because:
          difficulty_instance: state_vs_fiscal_on_entries_append
          rationale: "State-vs-fiscal (that instance) and safety-vs-temporal (safety_vs_temporal_on_reversal) dual-failure priority conflicts are asserted there."

      - name: append_with_undefined_window_kind_returns_no_eligible_window
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_ELIGIBLE_WINDOW]", entities.AchFile.fields.requested_window_kind]
        distinguishing_aspect: "Quoted-fee computation needs a rate card: appending to a file whose requested SAME_DAY_3 has no CutoffWindow row fails ERR_NO_ELIGIBLE_WINDOW (422)."
        test_recipe:
          setup: ["Originator ACTIVE; only NEXT_DAY window defined; file req SAME_DAY_3 effective 2026-08-03"]
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Win3 Co", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "SAME_DAY_3", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_id: "$.data.id", f_v: "$.data.version" }
          trigger:
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 100000, receiver_account: "w3-1", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_NO_ELIGIBLE_WINDOW (http 422); AchFile.${f_id}.entry_count == 0 (atomic reject)"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: bulk_append_is_atomic_on_mixed_validity
        claim_type: bulk_semantics
        grounds: ["endpoints(POST /ach/ach-files/{id}/entries)", "errors[ERR_SAME_DAY_INELIGIBLE]"]
        distinguishing_aspect: "A bulk append carrying one valid and one over-cap entry rejects the WHOLE batch: entry_count stays 0 and quoted fee is not recomputed."
