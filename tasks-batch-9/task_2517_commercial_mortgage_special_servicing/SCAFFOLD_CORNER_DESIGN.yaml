        distinguishing_aspect: "The ledger must move twice, not once: an EFFECTIVE 4,600,000.00 reduction is retired to RECALCULATED the instant a newer appraisal is accepted, dropping trust.total_ara_usd to 0.00 and restoring the full 65,000.00 advance obligation, and only when the replacement reduction is itself made EFFECTIVE does the ledger settle at 3,700,000.00 with a 40,950.00 obligation. Skipping the intermediate reset double-counts the collateral."
