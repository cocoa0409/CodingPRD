        source: system
        description: "Starts at 1, increments by 1 on every mutation."
      - name: seat_assignment_id
        type: string
        source: input
        description: "FK -> SeatAssignment.id; the assignment being forwarded or resold."
      - name: transfer_type
        type: enum
        source: input
        description: "FORWARD gifts the seat to a recipient account at no charge; RESALE lists it on the marketplace for a price."
