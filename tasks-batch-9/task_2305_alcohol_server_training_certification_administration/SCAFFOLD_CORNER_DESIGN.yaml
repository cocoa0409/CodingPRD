          Under a CONDITIONAL jurisdiction whose mandated_tracks is [ON_PREMISE] only, an
          OFF_PREMISE location resolves to training_requirement VOLUNTARY and
          compliance_posture NOT_APPLICABLE, short-circuiting the 95.00/80.00 thresholds
