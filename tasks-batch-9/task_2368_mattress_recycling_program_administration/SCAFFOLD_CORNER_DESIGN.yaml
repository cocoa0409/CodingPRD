  - section: rbac
    instances:

      - name: six_roles_share_the_program_read_but_only_admin_writes_the_forecast
        claim_type: Allowed role succeeds
        grounds:
          - rbac.ProgramAdministrator.shared_operations
          - rbac.Registrant.shared_operations
          - endpoints[GET /state-programs/{id}]
          - endpoints[PATCH /state-programs/{id}/cost-forecast]
        distinguishing_aspect: "All six roles read GET /state-programs/{id} with HTTP 200 while the same six-role set is not extended to the forecast PATCH, so shared_operations is per-endpoint rather than per-entity."
        test_recipe:
          setup:
            - "WA program with one registrant, one site, one hauler and one recycler so every entity-backed role has a real X-User-ID."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "WA", program_name: "Washington Mattress Stewardship Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_wa_id: $.data.id }
            - call: "POST /registrants"
              payload: { legal_name: "Cascadia Sleep Wholesale", registrant_type: "MANUFACTURER", home_state_code: "WA" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { reg_id: $.data.id }
            - call: "POST /collection-sites"
              payload: { state_program_id: "${prog_wa_id}", operator_name: "Puget Transfer Station", site_type: "TRANSFER_STATION", region_code: "NORTH" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { site_id: $.data.id }
            - call: "POST /haulers"
              payload: { state_program_id: "${prog_wa_id}", company_name: "Sound Hauling Co", service_regions: ["NORTH"], per_unit_rate_cents: 450, per_km_rate_cents: 180, max_route_payment_cents: 200000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { hauler_id: $.data.id }
            - call: "POST /recyclers"
              payload: { state_program_id: "${prog_wa_id}", facility_name: "Cascade Fiber Recovery", accepted_unit_classes: ["MATTRESS"] }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { recycler_id: $.data.id }
          trigger:
            - call: "GET /state-programs/${prog_wa_id}"
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "GET /state-programs/${prog_wa_id}"
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "GET /state-programs/${prog_wa_id}"
              as: Registrant
              as_user_id: "${reg_id}"
