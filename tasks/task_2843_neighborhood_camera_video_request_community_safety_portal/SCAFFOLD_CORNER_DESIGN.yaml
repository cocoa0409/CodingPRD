      - name: moderation_gates_each_return_their_own_error
        claim_type: error_triggerability
        grounds:
          - errors.ERR_POST_NOT_PUBLISHED
          - errors.ERR_CASE_ALREADY_DECIDED
          - validations[priority=22]
          - validations[priority=24]
        distinguishing_aspect: "Once a case is open the post leaves PUBLISHED, so a third neighbour's flag is refused with 409 ERR_POST_NOT_PUBLISHED; and after UPHELD_PUBLISH the case is terminal, so a second decision on the same case is 409 ERR_CASE_ALREADY_DECIDED even though the post is PUBLISHED again."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; author A and three flaggers N1, N2, N3, all with alert_radius_m 0; A's post has been flagged by N1 and N2 so it is FLAGGED, and mod-1 has opened a case, so the post is UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Author A", email: "authora@example.test", home_x_m: 0, home_y_m: 0, alert_radius_m: 0 }
              as: Anonymous
              captures: { a_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "N1", email: "n1@example.test", home_x_m: 10, home_y_m: 0, alert_radius_m: 0 }
              as: Anonymous
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "N2", email: "n2@example.test", home_x_m: 20, home_y_m: 0, alert_radius_m: 0 }
              as: Anonymous
              captures: { n2_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "N3", email: "n3@example.test", home_x_m: 30, home_y_m: 0, alert_radius_m: 0 }
              as: Anonymous
              captures: { n3_id: "$.data.id" }
            - call: "POST /neighborhood-safety/resident-posts"
              payload: { author_resident_id: "${a_id}", body: "Someone left a bicycle unlocked by the mailboxes overnight.", category: "SAFETY_REPORT", post_x_m: 0, post_y_m: 0 }
              as: Resident
              as_user_id: "${a_id}"
              captures: { post_id: "$.data.id" }
            - call: "POST /neighborhood-safety/resident-posts/${post_id}/flag"
              payload: { flag_reason: "I do not think this is accurate." }
              as: Resident
              as_user_id: "${n1_id}"
            - call: "POST /neighborhood-safety/resident-posts/${post_id}/flag"
              payload: { flag_reason: "Agreed, this is misleading." }
              as: Resident
              as_user_id: "${n2_id}"
              captures: { p_state1: "$.data.state", p_v1: "$.data.version" }
            - call: "POST /neighborhood-safety/moderation-cases"
              payload: { resident_post_id: "${post_id}", opened_reason: "RESIDENT_FLAGS", expected_resident_post_version: "${p_v1}" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { case_id: "$.data.id", case_state0: "$.data.state" }
          trigger:
            - call: "POST /neighborhood-safety/resident-posts/${post_id}/flag"
              payload: { flag_reason: "Third resident piling on." }
              as: Resident
              as_user_id: "${n3_id}"
              captures: { e_not_published: "$.data.error_id" }
            - call: "POST /neighborhood-safety/moderation-cases/${case_id}/decide"
              payload: { decision: "UPHELD_PUBLISH", decision_note: "Report is accurate and carries no discriminatory content." }
              as: Moderator
              as_user_id: "mod-2"
              captures: { case_state1: "$.data.state", case_dec: "$.data.decision", case_by: "$.data.decided_by_user_id" }
            - call: "POST /neighborhood-safety/moderation-cases/${case_id}/decide"
              payload: { decision: "REMOVE_INACCURATE", decision_note: "Changed my mind after the fact." }
              as: Moderator
              as_user_id: "mod-2"
              captures: { e_decided: "$.data.error_id" }
            - call: "GET /neighborhood-safety/resident-posts/${post_id}"
              payload: {}
              as: Moderator
              as_user_id: "mod-2"
              captures: { p_state2: "$.data.state", p_count2: "$.data.flag_count", p_reason2: "$.data.auto_flag_reason" }
          assert:
            - "${p_state1} == FLAGGED and ${case_state0} == OPEN"
            - "the third flag returns 409 with ${e_not_published} == ERR_POST_NOT_PUBLISHED"
            - "the uphold returns 200 with ${case_state1} == DECIDED, ${case_dec} == UPHELD_PUBLISH and ${case_by} == mod-2"
            - "the second decision returns 409 with ${e_decided} == ERR_CASE_ALREADY_DECIDED"
            - "${p_state2} == PUBLISHED and ${p_reason2} == null"
            - "${p_count2} == 2 — the refused third flag was never counted"
            - "Resident.${a_id}.accuracy_strike_count == 0 and Resident.${a_id}.post_privilege_state == UNRESTRICTED"

      - name: certifying_a_report_twice_returns_report_already_certified
        claim_type: error_triggerability
        grounds:
          - errors.ERR_REPORT_ALREADY_CERTIFIED
          - validations[priority=26]
          - endpoints[POST /neighborhood-safety/transparency-reports/{id}/certify]
          - entities.TransparencyReport.fields.variant
        distinguishing_aspect: "Certification is a one-way variant switch: the first certify by a second admin returns 200 with variant CERTIFIED and published_share_rate_bps repointed at the certified branch, and the identical second call returns 409 ERR_REPORT_ALREADY_CERTIFIED without touching certified_at, certified_by_user_id or version."
