            - "Trigger 4 one second later: HTTP 409 and ${err_late} == ERR_APPEAL_WINDOW_CLOSED"
            - "Page.${page_out}.classification_state is still HUMAN_CONFIRMED, appeal_count == 0, and its version is unchanged by the refused filing"
            - "PageClassification.${cls_out}.review_state is still CONFIRMED"
            - "GET /appeals filtered by classification_id == ${cls_out} returns total_count == 0"

      - name: claim_filing_window_runs_from_the_latest_cited_window_end
