          difficulty_instance: non_linear_state_machine / picture_lock_break_and_relock_leaves_pipeline_stage_at_qc
          rationale: "That §1.8 instance asserts picture_status cycling LOCKED -> LOCK_BROKEN -> LOCKED while pipeline_stage stays QC, which is exactly this claim."

