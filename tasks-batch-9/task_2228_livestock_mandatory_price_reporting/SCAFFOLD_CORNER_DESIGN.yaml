        grounds:
          - validations.priority_8_ERR_REPORT_NOT_PUBLISHED
          - roles.PublicUser
        distinguishing_aspect: |
          The confidentiality boundary on the read side, which is invisible to
          every other role: the identical GET on the identical report is a 403 for
          PublicUser and a 200 for MarketAnalyst while the report is UNPUBLISHED,
          the report is absent from PublicUser's listing and present in the
