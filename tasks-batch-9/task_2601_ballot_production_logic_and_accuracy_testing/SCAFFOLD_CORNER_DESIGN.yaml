      - name: sm_withdraw_draft_contest_returns_409_contest_state_invalid
        claim_type: invalid_transitions
        grounds:
          - state_machines.Contest.transitions
          - errors.ERR_CONTEST_STATE_INVALID
          - endpoints.POST /contests/{id}/withdraw
        distinguishing_aspect: "Withdrawal exists only on the CERTIFIED -> WITHDRAWN edge: the same call is refused both before certification (DRAFT) and after withdrawal (WITHDRAWN is terminal), so the endpoint is legal in exactly one of the contest's three states."
        test_recipe:
          setup:
            - "An election in SETUP with one DRAFT contest that has one FILED candidate (enough to certify a 1-seat contest)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1, rotation_required: false }
              as: BallotCoordinator
              captures: { ct: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Ana Alvarez", ballot_name: "Alvarez", filing_received_at: "2026-06-01T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_alv: $.data.id }
          trigger:
            - call: "POST /contests/${ct}/withdraw"
              payload: { withdrawn_reason: "Filed in the wrong district" }
              as: ElectionsDirector
              captures: { err1: $.data.error_id }
            - call: "POST /contests/${ct}/certify"
              payload: {}
              as: ElectionsDirector
              captures: { st2: $.data.status }
            - call: "POST /contests/${ct}/withdraw"
              payload: { withdrawn_reason: "Court order 2026-08-01" }
              as: ElectionsDirector
              captures: { st3: $.data.status }
            - call: "POST /contests/${ct}/withdraw"
              payload: { withdrawn_reason: "Second attempt" }
              as: ElectionsDirector
              captures: { err2: $.data.error_id }
            - call: "GET /contests/${ct}"
              payload: {}
              as: ElectionsDirector
              captures: { reason_final: $.data.withdrawn_reason }
          assert:
            - "Call 1: HTTP 409 with ${err1} == \"ERR_CONTEST_STATE_INVALID\"; the contest is still DRAFT and Election.${el}.certified_contest_count is still 0."
            - "Call 2: ${st2} == \"CERTIFIED\", Candidate.${c_alv}.status == \"CERTIFIED\", Contest.${ct}.certified_candidate_count == 1, certified_at == \"2026-08-01T00:00:00Z\", Election.${el}.certified_contest_count == 1."
            - "Call 3: ${st3} == \"WITHDRAWN\" with withdrawn_reason \"Court order 2026-08-01\", ballot_order_index null, and Election.${el}.certified_contest_count back to 0."
            - "Call 4: HTTP 409 with ${err2} == \"ERR_CONTEST_STATE_INVALID\" - WITHDRAWN is terminal."
            - "${reason_final} == \"Court order 2026-08-01\": the rejected fourth call did not overwrite the stored reason with \"Second attempt\"."

