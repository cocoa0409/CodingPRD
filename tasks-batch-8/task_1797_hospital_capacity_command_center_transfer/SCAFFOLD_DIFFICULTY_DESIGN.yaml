  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (boarding minutes vs hold expiry timestamp;
  #          different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: boarding_huddle_at_exactly_120_minutes
        grounds:
          - calculations.boarding_escalation_check
          - state_machines.BoardingRecord.escalation_status
        distinguishing_aspect: |
          Metric boarding_minutes, endpoint heartbeat: the >= 120 threshold means
          119 minutes produces no huddle while exactly 120 does. Pinned as >=
          (not >).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Facility F; ED admission A with open boarding record BR (WAITING / NONE)"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Boundary Facility", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "ED-1", label: "E1", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { eb: $.data.id }
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${eb}", patient_ref: "PB1", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { adm: $.data.id }
            - call: "POST /cc/facilities/${fac}/boarding-records"
              payload: { admission_id: "${adm}" }
              as: TransferCenterCoordinator
              captures: { br: $.data.id }
          trigger:
            - call: "POST /cc/boarding-records/${br}/heartbeat"
              payload: { observed_minutes: 119 }
              as: TransferCenterCoordinator
            - call: "POST /cc/boarding-records/${br}/heartbeat"
              payload: { observed_minutes: 120 }
              as: TransferCenterCoordinator
          assert:
            - "after 119: BoardingRecord.${br}.boarding_minutes == 119 and escalation_status == NONE and huddle_count_24h == 0"
            - "after exactly 120: escalation_status == HUDDLE_CALLED and huddle_count_24h == 1"
            - "GET /cc/boarding-records/${br}/huddles returns exactly 1 huddle with trigger_reason == AUTO_THRESHOLD"

      - name: hold_expires_at_exactly_expires_at
        grounds:
          - calculations.hold_expiry_check
          - state_machines.BedHold.ACTIVE_to_EXPIRED
          - state_machines.TransferRequest.HOLD_PLACED_to_ACCEPTED
        distinguishing_aspect: |
          Metric expires_at timestamp, endpoint sweep (different metric and
          endpoint from the boarding heartbeat): the >= rule means a hold is
          still ACTIVE at expires_at - 1 minute and becomes EXPIRED when now is
          exactly equal to expires_at.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Facility F; bed b1 CARDIAC/CRITICAL/AIRBORNE; physician Dr ON_CALL CARDIAC"
            - "TR ACCEPTED; hold H created at 00:00 with default ttl 60 -> expires_at 2026-08-01T01:00:00Z; bed HELD; TR HOLD_PLACED"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Expiry Facility", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr E", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PE1", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC", priority: "EMERGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
            - call: "POST /cc/transfer-requests/${tr}/bed-holds"
              payload: { bed_id: "${b1}" }
              as: TransferCenterCoordinator
              captures: { hold: $.data.id }
          trigger:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:59:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/_sweeps/run"
              payload: {}
              as: SystemAdministrator
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/_sweeps/run"
              payload: {}
              as: SystemAdministrator
              captures: { expired: $.data.expired_hold_ids }
          assert:
            - "after the 00:59 sweep: BedHold.${hold}.status == ACTIVE (now < expires_at)"
            - "after the 01:00 sweep (now == expires_at): expired_hold_ids contains ${hold} and BedHold.${hold}.status == EXPIRED"
            - "Bed.${b1}.status == AVAILABLE and cooling_until == 2026-08-01T01:45:00Z"
            - "TransferRequest.${tr}.status == ACCEPTED (placement looped back)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (Facility->TransferRequest;
  #          Bed->BedHold — different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: diversion_full_blocks_transfer_intake
        grounds:
          - state_machines.Facility.ACCEPTING_to_DIVERT_FULL
          - errors[ERR_FACILITY_ON_DIVERSION]
          - validations[priority=15]
        distinguishing_aspect: |
          Entity pair Facility -> TransferRequest: the request's own state is a
          valid initial INTAKE, but intake is gated on the FACILITY's derived
          diversion_status; under DIVERT_FULL (an ACTIVE full diversion whose
          window contains now) intake fails with ERR_FACILITY_ON_DIVERSION.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:30:00Z; Facility F with an ACTIVE FULL diversion over [2026-08-01T00:00:00Z, 2026-08-01T02:00:00Z)"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Gate Facility", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/diversions"
              payload: { level: "FULL", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T02:00:00Z" }
              as: HouseSupervisor
              as_user_id: "hs_1"
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:30:00Z" }
              as: SystemAdministrator
          trigger:
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PG1", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and error_id == ERR_FACILITY_ON_DIVERSION"
            - "no TransferRequest is created (GET /cc/facilities/${fac}/transfer-requests returns total_count == 0)"

      - name: out_of_service_bed_blocks_hold_create
        grounds:
          - state_machines.Bed.AVAILABLE_to_OUT_OF_SERVICE
          - errors[ERR_BED_NOT_AVAILABLE]
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair Bed -> BedHold (different pair from Facility ->
          TransferRequest): the transfer request is correctly ACCEPTED, but the
          hold's target bed is OUT_OF_SERVICE; the hold cannot be created and
          fails with ERR_BED_NOT_AVAILABLE driven purely by the BED's state.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Facility F; bed b1 CARDIAC/CRITICAL/AIRBORNE; physician Dr ON_CALL CARDIAC"
            - "TR ACCEPTED; then b1 moved AVAILABLE -> OUT_OF_SERVICE"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "OOS Facility", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr O", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PO1", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
            - call: "POST /cc/beds/${b1}/status"
              payload: { to_status: "OUT_OF_SERVICE" }
              as: BedManager
          trigger:
            - call: "POST /cc/transfer-requests/${tr}/bed-holds"
              payload: { bed_id: "${b1}" }
              as: TransferCenterCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and error_id == ERR_BED_NOT_AVAILABLE"
            - "TransferRequest.${tr}.status remains ACCEPTED (no hold placed)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (diversion half-open vs bed cooling
  #          closed-buffer — different interval semantics, different resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: diversion_windows_half_open_adjacency
        grounds:
          - calculations.diversion_window_overlap
          - errors[ERR_DIVERSION_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [starts_at, ends_at) on resource
          Facility — a new window starting exactly at the previous window's
          ends_at is adjacent, not overlapping, and is accepted; a window
          straddling the interior is rejected with ERR_DIVERSION_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Facility F; ACTIVE diversion D1 [00:00, 02:00)"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Window Facility", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/diversions"
              payload: { level: "FULL", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T02:00:00Z" }
              as: HouseSupervisor
              as_user_id: "hs_1"
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /cc/facilities/${fac}/diversions"
              payload: { level: "SERVICE", service: "CARDIAC", starts_at: "2026-08-01T02:00:00Z", ends_at: "2026-08-01T04:00:00Z" }
              as: HouseSupervisor
              as_user_id: "hs_2"
              captures: { d2: $.data.id }
            - call: "POST /cc/facilities/${fac}/diversions"
              payload: { level: "FULL", starts_at: "2026-08-01T01:00:00Z", ends_at: "2026-08-01T03:00:00Z" }
              as: HouseSupervisor
              as_user_id: "hs_1"
              captures: { err: $.data.error_id }
          assert:
            - "adjacent create [02:00, 04:00) succeeds with 201 (DiversionEvent.${d2} exists, status ACTIVE) because D1.ends_at == D2.starts_at under half-open semantics"
            - "straddling create [01:00, 03:00) fails with 409 ERR_DIVERSION_WINDOW_OVERLAP"

      - name: bed_cooling_buffer_closed_interval
        grounds:
          - calculations.bed_cooling_window
          - errors[ERR_BED_HOLD_WINDOW_CONFLICT]
          - state_machines.Bed.HELD_to_AVAILABLE
        distinguishing_aspect: |
          Interval semantics: CLOSED residual turnover buffer on resource Bed —
          different from the diversion half-open rule. After a hold releases at
          00:30 with turnover 45, cooling_until = 01:15; a new hold at 01:14 is
          rejected (now < cooling_until), while one arriving exactly at 01:15 is
          allowed — the mirror-image boundary of the diversion adjacency rule.
        test_recipe:
          setup:
            - "Clock starts 2026-08-01T00:00:00Z; Facility F; bed b1 CARDIAC/CRITICAL/AIRBORNE turnover 45; physician Dr ON_CALL CARDIAC"
            - "TR1 ACCEPTED with ACTIVE hold H1 on b1 (placed 00:00); TR2 ACCEPTED (waiting for the same bed)"
            - "H1 released at 00:30 -> b1 AVAILABLE with cooling_until 2026-08-01T01:15:00Z"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Cooling Facility", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr C", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PW1", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr1: $.data.id }
            - call: "POST /cc/transfer-requests/${tr1}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr1}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
            - call: "POST /cc/transfer-requests/${tr1}/bed-holds"
              payload: { bed_id: "${b1}" }
              as: TransferCenterCoordinator
              captures: { h1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PW2", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr2: $.data.id }
            - call: "POST /cc/transfer-requests/${tr2}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr2}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:30:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/bed-holds/${h1}/release"
              payload: {}
              as: TransferCenterCoordinator
          trigger:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:14:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/transfer-requests/${tr2}/bed-holds"
              payload: { bed_id: "${b1}" }
              as: TransferCenterCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:15:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/transfer-requests/${tr2}/bed-holds"
              payload: { bed_id: "${b1}" }
              as: TransferCenterCoordinator
              captures: { h2: $.data.id }
          assert:
            - "at 01:14: 409 ERR_BED_HOLD_WINDOW_CONFLICT (now < cooling_until 01:15)"
            - "at exactly 01:15: hold create succeeds 201; BedHold.${h2}.status == ACTIVE and Bed.${b1}.status == HELD and cooling_until cleared to null"
            - "TransferRequest.${tr2}.status == HOLD_PLACED"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (bed status counts vs transfer pipeline
  #          counts — different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: bed_status_count_conservation_hold_release
        grounds:
          - state_machines.Bed.AVAILABLE_to_HELD
          - state_machines.Bed.HELD_to_AVAILABLE
          - entities.Facility.fields.available_beds
          - entities.Facility.fields.held_beds
        distinguishing_aspect: |
          Conserved quantity: per-facility bed-status census. The forward action
          (hold create: AVAILABLE -1, HELD +1) paired with its compensating
          action (hold release: HELD -1, AVAILABLE +1) leaves every status count
          equal to its pre-action value; available + held + occupied +
          out_of_service == staffed_beds (3) at every observation.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Facility F with 3 staffed beds (b1 CARDIAC/CRITICAL/AIRBORNE, b2/b3 CARDIAC/CRITICAL/NONE); physician Dr ON_CALL CARDIAC; TR ACCEPTED"
            - "Pre-action census: available_beds == 3, held_beds == 0, occupied_beds == 0, out_of_service_beds == 0"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Invariant Facility", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr I", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B2", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-2", label: "B3", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PI1", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
          trigger:
            - call: "POST /cc/transfer-requests/${tr}/bed-holds"
              payload: { bed_id: "${b1}" }
              as: TransferCenterCoordinator
              captures: { h1: $.data.id }
            - call: "POST /cc/bed-holds/${h1}/release"
              payload: {}
              as: TransferCenterCoordinator
          assert:
            - "after hold create: Facility.${fac}.available_beds == 2 and held_beds == 1 (sum still 3)"
            - "after compensating release: available_beds == 3 and held_beds == 0 — exactly the pre-action census"
            - "invariant held throughout: available_beds + held_beds + occupied_beds + out_of_service_beds == staffed_beds == 3"
            - "Bed.${b1}.status == AVAILABLE and cooling_until == 2026-08-01T00:45:00Z (compensation restores count but records turnover honestly)"

      - name: transfer_pipeline_count_conservation_cancel
        grounds:
          - state_machines.TransferRequest.CONSULT_PENDING_to_DECLINED
          - entities.Facility.fields.active_inbound_transfers
        distinguishing_aspect: |
          Conserved quantity: transfer pipeline accounting (different quantity
          type from bed census): non_terminal_count + terminal_count == total
          requests created. Creating 3 requests then cancelling 1 and declining
          1 (DECLINED is non-terminal) yields non_terminal 2 + terminal 1 == 3.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Facility F; physician Dr ON_CALL CARDIAC"
            - "TR1 INTAKE, TR2 INTAKE, TR3 INTAKE (active_inbound_transfers == 3, terminal == 0)"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Pipeline Facility", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr P", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PTA", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PTB", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr2: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PTC", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "ELECTIVE" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr3: $.data.id }
          trigger:
            - call: "POST /cc/transfer-requests/${tr1}/cancel"
              payload: {}
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr2}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr2}/consult-response"
              payload: { decision: "DECLINE", decline_reason: "NO_CAPACITY" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
          assert:
            - "TransferRequest.${tr1}.status == CANCELLED (terminal)"
            - "TransferRequest.${tr2}.status == DECLINED (non-terminal — re-consultable, so still inside the pipeline)"
            - "Facility.${fac}.active_inbound_transfers == 2"
            - "conservation: non_terminal (2: DECLINED + INTAKE) + terminal (1: CANCELLED) == 3 == total requests created; intake+decline+cancel left no phantom requests"
