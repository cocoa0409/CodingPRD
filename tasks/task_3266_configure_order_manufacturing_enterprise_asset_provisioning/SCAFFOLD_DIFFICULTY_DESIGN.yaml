  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_requires_configuration_validated
        grounds:
          - state_machines.Order."build DRAFT"_to_"build SUBMITTED"
          - state_machines.Configuration
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair Order -> Configuration: submit is only defined when every line's
          configuration is VALIDATED or LOCKED; an order whose configuration sits in
          DRAFT (never validated) must be rejected even though the order itself is in
          a valid state for submission.
        test_recipe:
          setup:
            - "Account A14 (STANDARD, credit 10,000,000c); chassis L14; component CPU14 ALLOWED, stock 10"
            - "Configuration C14 left in DRAFT (never validated); Order O14 with line qty 1 of C14"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A14", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { a14_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L14", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l14_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "CPU14", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { cpu14_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l14_id}", component_id: "${cpu14_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a14_id}"
                chassis_model_id: "${l14_id}"
                component_selections: [{ component_id: "${cpu14_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a14_id}"
              captures: { c14_id: $.data.id, c14_v: $.data.version }
            - { call: "POST /api/orders", payload: { account_id: "${a14_id}", po_number: "PO-14" }, as: CustomerUser, as_user_id: "${a14_id}", captures: { o14_id: $.data.id } }
            - { call: "POST /api/orders/${o14_id}/lines", payload: { configuration_id: "${c14_id}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${a14_id}" }
          trigger:
            - { call: "POST /api/orders/${o14_id}/submit", payload: { expected_configuration_version: "${c14_v}" }, as: CustomerUser, as_user_id: "${a14_id}", captures: { err14: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (409)   # configuration DRAFT blocks the order's submit transition"
            - "Order.${o14_id}.build_status == DRAFT"
            - "CustomerAccount.${a14_id}.outstanding_cents == 0   # no debit applied"

      - name: wave_release_requires_order_built
        grounds:
          - state_machines.DeploymentWave.PLANNED_to_RELEASED
          - state_machines.Order
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair DeploymentWave -> Order (different pair from Order -> Configuration):
          release is defined only when the owning order's build_status == BUILT;
          releasing while the order is still IN_PRODUCTION must be rejected even
          though the wave itself is PLANNED and its window is valid.
        test_recipe:
          setup:
            - "Account A15 (STANDARD, credit 10,000,000c); chassis L15; component RAM15 ALLOWED, stock 5"
            - "Configuration C15 VALIDATED; Order O15 qty 1 SUBMITTED; job allocated+started (order IN_PRODUCTION, not BUILT)"
            - "Wave W15 PLANNED with a valid future window"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A15", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { a15_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L15", category: "DESKTOP", base_price_cents: 80000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l15_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "RAM15", kind: "MEMORY", price_cents: 8000, lead_time_days: 2, stock_on_hand: 5, revision: "A01" }, as: PlatformAdmin, captures: { ram15_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l15_id}", component_id: "${ram15_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a15_id}"
                chassis_model_id: "${l15_id}"
                component_selections: [{ component_id: "${ram15_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a15_id}"
              captures: { c15_id: $.data.id }
            - { call: "POST /api/configurations/${c15_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a15_id}", captures: { c15_v: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${a15_id}", po_number: "PO-15" }, as: CustomerUser, as_user_id: "${a15_id}", captures: { o15_id: $.data.id } }
            - { call: "POST /api/orders/${o15_id}/lines", payload: { configuration_id: "${c15_id}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${a15_id}" }
            - { call: "POST /api/orders/${o15_id}/submit", payload: { expected_configuration_version: "${c15_v}" }, as: CustomerUser, as_user_id: "${a15_id}" }
            - call: "GET /api/orders/${o15_id}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                j15_id: $.data[0].id
            - { call: "POST /api/build-jobs/${j15_id}/allocate", payload: {}, as: FactoryOps }
            - { call: "POST /api/build-jobs/${j15_id}/start", payload: {}, as: FactoryOps }
            - call: "POST /api/orders/${o15_id}/deployment-waves"
              payload:
                wave_label: "W15"
                ship_window_start: "2026-09-03T00:00:00Z"
                ship_window_end: "2026-09-08T00:00:00Z"
                destinations: [{ employee_ref: "HQ", address: "9 Z St", units: 1 }]
              as: AccountManager
              captures: { w15_id: $.data.id }
          trigger:
            - { call: "POST /api/deployment-waves/${w15_id}/release", payload: {}, as: AccountManager, captures: { err15: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (409)   # order IN_PRODUCTION, not BUILT"
            - "DeploymentWave.${w15_id}.status == PLANNED"
            - "Order.${o15_id}.ship_status == PENDING"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: entitlement_closed_interval_duplicate_rejected
        grounds:
          - validations[priority=17]
          - entities.SupportEntitlement.fields.coverage_start
          - entities.SupportEntitlement.fields.coverage_end
        distinguishing_aspect: |
          Closed-interval semantics on the SupportEntitlement resource: coverage
          [start, end] includes BOTH endpoints, so a second ACTIVE entitlement for the
          same line and tier whose start equals the first entitlement's end DOES
          overlap and is rejected — the opposite of the half-open wave rule.
        test_recipe:
          setup:
            - "Account A16 (STANDARD, credit 10,000,000c); chassis L16 LAPTOP; component CPU16 ALLOWED, stock 5"
            - "Configuration C16 VALIDATED; Order O16 qty 1 SUBMITTED"
            - "NBD entitlement E1 on the line covering closed [2026-09-01T00:00:00Z, 2027-09-01T00:00:00Z]"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A16", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { a16_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L16", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l16_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "CPU16", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 5, revision: "A01" }, as: PlatformAdmin, captures: { cpu16_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l16_id}", component_id: "${cpu16_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a16_id}"
                chassis_model_id: "${l16_id}"
                component_selections: [{ component_id: "${cpu16_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a16_id}"
              captures: { c16_id: $.data.id }
            - { call: "POST /api/configurations/${c16_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a16_id}", captures: { c16_v: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${a16_id}", po_number: "PO-16" }, as: CustomerUser, as_user_id: "${a16_id}", captures: { o16_id: $.data.id } }
            - { call: "POST /api/orders/${o16_id}/lines", payload: { configuration_id: "${c16_id}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${a16_id}", captures: { ol16_id: $.data.id } }
            - { call: "POST /api/orders/${o16_id}/submit", payload: { expected_configuration_version: "${c16_v}" }, as: CustomerUser, as_user_id: "${a16_id}" }
            - { call: "POST /api/order-lines/${ol16_id}/support-entitlements", payload: { tier: "NBD", coverage_start: "2026-09-01T00:00:00Z", coverage_end: "2027-09-01T00:00:00Z" }, as: AccountManager, captures: { se16_id: $.data.id } }
          trigger:
            - { call: "POST /api/order-lines/${ol16_id}/support-entitlements", payload: { tier: "NBD", coverage_start: "2027-09-01T00:00:00Z", coverage_end: "2028-09-01T00:00:00Z" }, as: AccountManager, captures: { err16: $.data.error_id } }
          assert:
            - "error_id == ERR_ENTITLEMENT_OVERLAP (422)   # closed interval: touching at the endpoint still overlaps"
            - "exactly one ACTIVE SupportEntitlement remains on OrderLine.${ol16_id}"

      - name: wave_half_open_window_overlap_rejected
        grounds:
          - validations[priority=13]
          - entities.DeploymentWave.fields.ship_window_start
        distinguishing_aspect: |
          Half-open interval semantics on the DeploymentWave resource (different
          resource and different geometry from the closed entitlement interval): a
          wave whose start falls strictly inside another wave's [start, end) window
          is rejected, while (per the sibling boundary instance) exact end == start
          adjacency is allowed.
        test_recipe:
          setup:
            - "Account A17 (STANDARD, credit 20,000,000c); chassis L17; component NIC17 ALLOWED, stock 10"
            - "Configuration C17 VALIDATED; Order O17 qty 3 DROP_SHIP_EMPLOYEES SUBMITTED"
            - "Wave WA [2026-09-05T00:00:00Z, 2026-09-10T00:00:00Z) exists"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A17", account_tier: "STANDARD", credit_limit_cents: 20000000 }, as: PlatformAdmin, captures: { a17_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L17", category: "LAPTOP", base_price_cents: 50000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l17_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "NIC17", kind: "NIC", price_cents: 2000, lead_time_days: 2, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { nic17_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l17_id}", component_id: "${nic17_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a17_id}"
                chassis_model_id: "${l17_id}"
                component_selections: [{ component_id: "${nic17_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a17_id}"
              captures: { c17_id: $.data.id }
            - { call: "POST /api/configurations/${c17_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a17_id}", captures: { c17_v: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${a17_id}", po_number: "PO-17" }, as: CustomerUser, as_user_id: "${a17_id}", captures: { o17_id: $.data.id } }
            - { call: "POST /api/orders/${o17_id}/lines", payload: { configuration_id: "${c17_id}", qty: 3, ship_to_mode: "DROP_SHIP_EMPLOYEES" }, as: CustomerUser, as_user_id: "${a17_id}" }
            - { call: "POST /api/orders/${o17_id}/submit", payload: { expected_configuration_version: "${c17_v}" }, as: CustomerUser, as_user_id: "${a17_id}" }
            - call: "POST /api/orders/${o17_id}/deployment-waves"
              payload:
                wave_label: "WA"
                ship_window_start: "2026-09-05T00:00:00Z"
                ship_window_end: "2026-09-10T00:00:00Z"
                destinations: [{ employee_ref: "EA", address: "1 A St", units: 1 }]
              as: AccountManager
              captures: { w17a_id: $.data.id }
          trigger:
            - call: "POST /api/orders/${o17_id}/deployment-waves"
              payload:
                wave_label: "WB"
                ship_window_start: "2026-09-09T00:00:00Z"
                ship_window_end: "2026-09-20T00:00:00Z"
                destinations: [{ employee_ref: "EB", address: "2 B St", units: 1 }]
              as: AccountManager
              captures: { err17: $.data.error_id }
          assert:
            - "error_id == ERR_WAVE_WINDOW_OVERLAP (422)   # start inside [start, end) of a live wave"
            - "exactly one DeploymentWave exists for Order.${o17_id} and it remains PLANNED"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: outstanding_cents_submit_cancel_invariant
        grounds:
          - state_machines.Order."build SUBMITTED"_to_"build CANCELLED"
          - entities.CustomerAccount.fields.outstanding_cents
        distinguishing_aspect: |
          Conserved quantity: CustomerAccount.outstanding_cents. Forward action
          (submit, += total_cents) paired with its compensating action (cancel from
          SUBMITTED, -= total_cents) MUST return the account's outstanding balance to
          its exact pre-submit value of 0 — no drift.
        test_recipe:
          setup:
            - "Account A18 (STANDARD, credit 10,000,000c, outstanding 0); chassis L18; component CPU18 ALLOWED, stock 5"
            - "Configuration C18 VALIDATED; Order O18 qty 1 (total 120000c) SUBMITTED -> outstanding 120000"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A18", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { a18_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L18", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l18_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "CPU18", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 5, revision: "A01" }, as: PlatformAdmin, captures: { cpu18_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l18_id}", component_id: "${cpu18_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a18_id}"
                chassis_model_id: "${l18_id}"
                component_selections: [{ component_id: "${cpu18_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a18_id}"
              captures: { c18_id: $.data.id }
            - { call: "POST /api/configurations/${c18_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a18_id}", captures: { c18_v: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${a18_id}", po_number: "PO-18" }, as: CustomerUser, as_user_id: "${a18_id}", captures: { o18_id: $.data.id } }
            - { call: "POST /api/orders/${o18_id}/lines", payload: { configuration_id: "${c18_id}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${a18_id}" }
            - { call: "POST /api/orders/${o18_id}/submit", payload: { expected_configuration_version: "${c18_v}" }, as: CustomerUser, as_user_id: "${a18_id}" }
          trigger:
            - { call: "POST /api/orders/${o18_id}/cancel", payload: {}, as: CustomerUser, as_user_id: "${a18_id}" }
          assert:
            - "after submit: CustomerAccount.${a18_id}.outstanding_cents == 120000"
            - "after cancel: CustomerAccount.${a18_id}.outstanding_cents == 0   # invariant: forward + compensating leave the conserved quantity unchanged"
            - "Order.${o18_id}.build_status == CANCELLED and its BuildJob is CANCELLED"

      - name: parts_stocking_reservation_cancel_invariant
        grounds:
          - state_machines.SupportEntitlement.ACTIVE_to_CANCELLED
          - entities.Component.fields.reserved_units
        distinguishing_aspect: |
          Different conserved quantity: Component.reserved_units. Creating an
          ONSITE_4H entitlement with parts stocking reserves 1 unit of the stocked
          part; cancelling the entitlement releases exactly that unit, returning the
          component's reserved_units to its pre-entitlement value with no drift —
          a different conserved pool from outstanding_cents.
        test_recipe:
          setup:
            - "Account A19 (STANDARD, credit 10,000,000c); chassis L19 SERVER; component PSU19 ALLOWED, stock 10"
            - "PSU19 doubles as the stocked spare part (reserved_part_component_id)"
            - "Configuration C19 VALIDATED; Order O19 qty 1 SUBMITTED; no allocation yet so PSU19 reserved_units == 0"
            - "ONSITE_4H entitlement with parts stocking created -> PSU19 reserved_units == 1"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A19", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { a19_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L19", category: "SERVER", base_price_cents: 200000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l19_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "PSU19", kind: "PSU", price_cents: 9000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { psu19_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l19_id}", component_id: "${psu19_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a19_id}"
                chassis_model_id: "${l19_id}"
                component_selections: [{ component_id: "${psu19_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a19_id}"
              captures: { c19_id: $.data.id }
            - { call: "POST /api/configurations/${c19_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a19_id}", captures: { c19_v: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${a19_id}", po_number: "PO-19" }, as: CustomerUser, as_user_id: "${a19_id}", captures: { o19_id: $.data.id } }
            - { call: "POST /api/orders/${o19_id}/lines", payload: { configuration_id: "${c19_id}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${a19_id}", captures: { ol19_id: $.data.id } }
            - { call: "POST /api/orders/${o19_id}/submit", payload: { expected_configuration_version: "${c19_v}" }, as: CustomerUser, as_user_id: "${a19_id}" }
            - { call: "POST /api/order-lines/${ol19_id}/support-entitlements", payload: { tier: "ONSITE_4H", coverage_start: "2026-09-01T00:00:00Z", coverage_end: "2027-09-01T00:00:00Z", parts_stocking_required: true, reserved_part_component_id: "${psu19_id}" }, as: AccountManager, captures: { se19_id: $.data.id } }
          trigger:
            - { call: "POST /api/support-entitlements/${se19_id}/cancel", payload: {}, as: AccountManager }
          assert:
            - "after entitlement create: Component.${psu19_id}.reserved_units == 1 and Component.${psu19_id}.available_units == 9"
            - "after cancel: Component.${psu19_id}.reserved_units == 0 and Component.${psu19_id}.available_units == 10   # invariant restored"
            - "SupportEntitlement.${se19_id}.status == CANCELLED"
