  # ===========================================================================
  # Rule 5: priority_pair_validation_conflict — different error-category pairs.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_on_ic_memo_create
        grounds:
          - validations[priority=6]
          - validations[priority=9]
        distinguishing_aspect: |
          Pair: state (priority 6) vs business_referential (priority 9). A memo
          create against a Deal in DRAFT (state violation) AND with a
          scenario_id from another deal (referential violation) MUST surface
          ERR_INVALID_STATE (priority 6 wins), not ERR_SCENARIO_NOT_COMPUTED.
        test_recipe:
          setup:
            - "Deal D_A in DRAFT (never submitted); Deal D_B in UNDERWRITING with computed Scenario S_B"
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-PA", deal_name: "A", strategy: "CORE", target_purchase_price_cents: 100000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_a: $.data.id, deal_a_v: $.data.version }
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-PB", deal_name: "B", strategy: "CORE", target_purchase_price_cents: 200000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_b: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_b}/properties"
              payload: { address_line: "1 X", market: "M", property_type: "OFFICE", units: 10, rentable_sqft: 20000, year_built: 2000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { prop_b: $.data.id }
            - call: "POST /re-underwriting/properties/${prop_b}/rent-roll"
              payload: { period_month: "2026-06", occupied_units: 9, total_units: 10, gross_potential_rent_cents: 1000000, collected_rent_cents: 900000, source_doc_ref: "rr" }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_b}/operating-expenses"
              payload: { period_year: 2025, category: "TAXES", amount_cents: 1000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_b}/assumptions"
              payload: { label: "B", market_rent_growth_yr1_bps: 200, market_rent_growth_steady_bps: 200, expense_growth_bps: 200, exit_cap_rate_bps: 600, hold_period_years: 5, capex_per_unit_cents: 100000, lease_up_months: 0 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { assum_b: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_b}/submit-underwriting"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_b_v2: $.data.version }
            - call: "POST /re-underwriting/deals/${deal_b}/scenarios"
              payload: { scenario_kind: "BASE", assumption_id: "${assum_b}", occupancy_stress_pct: 90, expected_deal_version: "${deal_b_v2}" }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { scen_b: $.data.id }
            - call: "POST /re-underwriting/scenarios/${scen_b}/compute"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
          trigger:
            # Attempt to create IC memo on D_A (which is in DRAFT = state violation)
            # referencing scen_b (which belongs to D_B = referential violation)
            - call: "POST /re-underwriting/deals/${deal_a}/ic-memos"
              payload: { scenario_id: "${scen_b}", recommendation: "PURSUE", thesis: "t", risks: "r", expected_deal_version: "${deal_a_v}" }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state check at priority 6 wins over referential check at priority 9)"
            - "HTTP status == 409"

      - name: business_fiscal_vs_business_safety_on_debt_sizing
        grounds:
          - validations[priority=13]
          - validations[priority=15]
        distinguishing_aspect: |
          Pair: business_fiscal (priority 13, ERR_NOI_NONPOSITIVE) vs
          business_safety (priority 15, ERR_DUPLICATE_VOTE). Different pair from
          state_vs_business_referential above. Independently exercised: a
          debt-sizing on a non-positive-NOI scenario returns
          ERR_NOI_NONPOSITIVE; a duplicate vote returns ERR_DUPLICATE_VOTE. The
          scaffold's priority ordering (13 < 15) means fiscal dominates when
          both apply, but these endpoints don't co-fire, so each is exercised
          separately as a priority-vs-other-checks probe.
        test_recipe:
          setup:
            - "Deal D1 in UNDERWRITING with Scenario S_BAD whose computed_noi_yr1_cents <= 0 (achieved by setting occupancy_stress_pct = 5 — extremely low)"
            - "Deal D2 in IC_REVIEW with memo UNDER_VOTE and IC_Member u-ic-1 has already voted"
