scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (>= 2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: incident_damage_fee_estimate_vs_final
        grounds:
          - calculations.damage_assessment
          - entities.Incident.fields.damage_fee_estimate_cents
          - entities.Incident.fields.member_damage_fee_cents
        distinguishing_aspect: "On the same DAMAGE incident with repair_cost_cents 30000 the estimate variant writes 15000 while the final variant writes 3000, because the estimate ignores the membership tier and the final scales by the PLUS liability percentage."
        test_recipe:
          setup:
            - "One approved individual member with an ACTIVE PLUS-tier primary membership"
            - "One pod with capacity 4 hosting one AVAILABLE vehicle"
            - "One CONFIRMED reservation on that vehicle for that member"
            - "One OPEN DAMAGE incident with repair_cost_cents 30000 on that reservation"
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Dana Dual", email: "dana.dual@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_dana_id: $.data.id }
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "GET /car-share/members/{m_dana_id}/memberships"
              as: PodOperator
              captures: { ms_dana_id: "$.data[0].id" }
            - call: "POST /car-share/pods"
              payload: { name: "Campus Hill", site_type: "CAMPUS", capacity: 4, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_hill_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_hill_id}", vin: "VIN3158A1", model: "Prius", capacity_seats: 5, next_service_miles: 60000 }
              as: FleetAdmin
              captures: { veh_a1_id: $.data.id, veh_a1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_dana_id}", pod_id: "${pod_hill_id}", vehicle_id: "${veh_a1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_a1_ver}" }
              as: Member
              as_user_id: "${m_dana_id}"
              captures: { res_a1_id: $.data.id }
            - call: "POST /car-share/incidents"
              payload: { reservation_id: "${res_a1_id}", vehicle_id: "${veh_a1_id}", member_id: "${m_dana_id}", incident_type: "DAMAGE", repair_cost_cents: 30000 }
              as: PodOperator
              captures: { inc_a1_id: $.data.id, inc_a1_ver: $.data.version }
          trigger:
            - call: "POST /car-share/incidents/{id}/party-split"
              payload: { expected_incident_version: "${inc_a1_ver}" }
              as: PodOperator
          assert:
            - "Incident.${inc_a1_id}.damage_fee_estimate_cents == 15000"
            - "Incident.${inc_a1_id}.member_damage_fee_cents == 3000"
            - "Incident.${inc_a1_id}.damage_fee_estimate_cents != Incident.${inc_a1_id}.member_damage_fee_cents"

      - name: reservation_charge_late_variant_divergence
        grounds:
          - calculations.charge_with_late_penalty_and_fuel_adjustment
          - calculations.late_return_penalty
          - entities.Reservation.fields.charge_total_cents
        distinguishing_aspect: "For a reservation returned 75 minutes past end_at the C2 penalty is a flat 8000 because the overage band resolves to zero ledger delta, while the competing hour-scaled variant would post 6000 times the block count, and on the reservation charge the escalating-late variant yields late_fee_cents 6104 while the flat variant yields 6105."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T12:00:00Z"
            - "One approved individual member with an ACTIVE membership and one AVAILABLE vehicle in a campus pod"
            - "One CONFIRMED reservation with end_at 2026-09-05T13:00:00Z, reserved_hours 4"
            - "One posted fuel-card transaction of 4000 cents on the vehicle"
            - "One OPEN DAMAGE incident whose assignment lands on the low-severity branch, so no automatic fee posting occurs"
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Rhea Return", email: "rhea.return@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_rhea_id: $.data.id }
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Campus Flat", site_type: "CAMPUS", capacity: 4, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_flat_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_flat_id}", vin: "VIN3158B1", model: "Corolla", capacity_seats: 5, next_service_miles: 50000 }
              as: FleetAdmin
              captures: { veh_b1_id: $.data.id, veh_b1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_rhea_id}", pod_id: "${pod_flat_id}", vehicle_id: "${veh_b1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_b1_ver}" }
              as: Member
              as_user_id: "${m_rhea_id}"
              captures: { res_b1_id: $.data.id }
            - call: "POST /car-share/fuel-card-transactions"
              payload: { reservation_id: "${res_b1_id}", vehicle_id: "${veh_b1_id}", amount_cents: 4000, gallons_hundredths: 1000 }
              as: Member
              as_user_id: "${m_rhea_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /car-share/incidents"
              payload: { reservation_id: "${res_b1_id}", vehicle_id: "${veh_b1_id}", member_id: "${m_rhea_id}", incident_type: "DAMAGE", repair_cost_cents: 6000 }
              as: PodOperator
              captures: { inc_b1_id: $.data.id, inc_b1_ver: $.data.version }
            - call: "POST /car-share/incidents/{id}/party-split"
              payload: { expected_incident_version: "${inc_b1_ver}" }
              as: PodOperator
          trigger:
            - call: "POST /car-share/reservations/{id}/resolve-overdue"
              payload: {}
              as: PodOperator
          assert:
            - "Reservation.${res_b1_id}.status == CLOSED"
            - "Reservation.${res_b1_id}.status_before_overdue == CONFIRMED"
            - "Reservation.${res_b1_id}.charge_total_cents == 9944"
            - "Reservation.${res_b1_id}.late_minutes == 15750"
            - "Member.${m_rhea_id}.wallet_credit_cents == 8000"
            - "Member.${m_rhea_id}.wallet_hold_cents == 0"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (>= 2 instances, different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: late_fee_nested_rounding_order_mode_b
        grounds:
          - calculations.charge_with_late_penalty_and_fuel_adjustment
          - validations[priority=23]
          - entities.Reservation.fields.charge_total_cents
        distinguishing_aspect: "Mode (b) nested rounding: rounding each of the three escalating 30-minute blocks to 1725, 2018 and 2361 and then summing yields late_fee_cents 6104, whereas summing the unrounded rates 1725.0, 2018.25, 2361.3525 and rounding once yields 6105, so the pinned order produces charge_total_cents 10203 rather than 10204 for a 6-point fuel deficit."
        test_recipe:
          setup:
            - "One approved member with an ACTIVE membership and an AVAILABLE campus-pod vehicle"
            - "One CONFIRMED reservation end_at 2026-09-05T13:00:00Z with reserved_hours 4"
            - "Logical clock advanced to 2026-09-10T12:00:00Z so the reservation is overdue"
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Nora Nested", email: "nora.nested@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_nora_id: $.data.id }
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Campus Rounding", site_type: "CAMPUS", capacity: 4, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_rnd_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_rnd_id}", vin: "VIN3158C1", model: "Civic", capacity_seats: 5, next_service_miles: 40000 }
              as: FleetAdmin
              captures: { veh_c1_id: $.data.id, veh_c1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_nora_id}", pod_id: "${pod_rnd_id}", vehicle_id: "${veh_c1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_c1_ver}" }
              as: Member
              as_user_id: "${m_nora_id}"
              captures: { res_c1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /car-share/reservations/{id}/reopen-overdue"
              payload: {}
              as: PodOperator
          assert:
            - "Reservation.${res_c1_id}.late_minutes == 8610"
            - "late_fee_cents == 6104 and fuel_surcharge_cents == 324"
            - "Reservation.${res_c1_id}.charge_total_cents == 10811"

      - name: shift_bundle_fee_tier_band_ordering_mode_a
        grounds:
          - calculations.shift_bundle_fee
          - calculations.pod_utilization
          - entities.PodShiftBundle.fields.bundle_fee_cents
          - validations[priority=25]
        distinguishing_aspect: "Mode (a) non-linear three-input interaction: the surcharge band is evaluated top-down and the first matching row wins, so three source vehicles relocating into an empty destination pod (source_available 0, dest_available 0) must take the balanced band and yield bundle_fee_cents 18200, never the empty-destination band 34600."
        test_recipe:
          setup:
            - "One destination pod with capacity 6 and zero vehicles, so dest_available is 0"
            - "Three AVAILABLE vehicles in a source campus pod, all outside monthly_pods"
          setup_api_calls:
            - call: "POST /car-share/pods"
              payload: { name: "North Campus", site_type: "CAMPUS", capacity: 6, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_north_id: $.data.id, pod_north_ver: $.data.version }
            - call: "POST /car-share/pods"
              payload: { name: "Airport Hub", site_type: "AIRPORT", capacity: 6, fuel_floor_pct: 35 }
              as: FleetAdmin
              captures: { pod_air_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_air_id}", vin: "VIN3158D1", model: "Fit", capacity_seats: 5, next_service_miles: 45000 }
              as: FleetAdmin
              captures: { veh_d1_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_air_id}", vin: "VIN3158D2", model: "Fit", capacity_seats: 5, next_service_miles: 45000 }
              as: FleetAdmin
              captures: { veh_d2_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_air_id}", vin: "VIN3158D3", model: "Fit", capacity_seats: 5, next_service_miles: 45000 }
              as: FleetAdmin
              captures: { veh_d3_id: $.data.id }
          trigger:
            - call: "POST /car-share/shift-bundles"
              payload: { source_pod_id: "${pod_air_id}", dest_pod_id: "${pod_north_id}", scheduled_start: "2026-09-12T02:00:00Z", scheduled_end: "2026-09-12T06:00:00Z", monthly_pods: ["${veh_d1_id}", "${veh_d2_id}", "${veh_d3_id}"], expected_pod_version_profile: "${pod_north_ver}" }
              as: PodOperator
              captures: { bundle_d_id: $.data.id }
          assert:
            - "PodShiftBundle.${bundle_d_id}.bundle_fee_cents == 18200"
            - "Pod.${pod_north_id}.available_bays == 3"
            - "Pod.${pod_air_id}.available_bays == 6"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (>= 2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: membership_freeze_frozen_and_reopen_cycle
        grounds:
          - state_machines.Membership.ACTIVE_to_FROZEN
          - state_machines.Membership.FROZEN_to_ACTIVE
          - state_machines.Membership.CLOSED_to_ACTIVE
          - calculations.membership_thaw_and_residual_release
          - entities.Membership.fields.status_before_freeze
        distinguishing_aspect: "Cyclic shape on Membership: ACTIVE -> FROZEN -> ACTIVE -> CLOSED -> ACTIVE, where the thaw target is the preserved status_before_freeze rather than always-ACTIVE, so a membership frozen from SUSPENDED thaws back to SUSPENDED."
        test_recipe:
          setup:
            - "One approved individual member with an ACTIVE primary membership driven into SUSPENDED"
            - "One OPEN DAMAGE incident on that member's reservation"
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Hana Cycle", email: "hana.cycle@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_hana_id: $.data.id }
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "GET /car-share/members/{m_hana_id}/memberships"
              as: PodOperator
              captures: { ms_hana_id: "$.data[0].id" }
            - call: "POST /car-share/memberships/{id}/suspend"
              payload: {}
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Campus Cycle", site_type: "CAMPUS", capacity: 4, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_cyc_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_cyc_id}", vin: "VIN3158E1", model: "Leaf", capacity_seats: 5, next_service_miles: 30000 }
              as: FleetAdmin
              captures: { veh_e1_id: $.data.id, veh_e1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_hana_id}", pod_id: "${pod_cyc_id}", vehicle_id: "${veh_e1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_e1_ver}" }
              as: Member
              as_user_id: "${m_hana_id}"
              captures: { res_e1_id: $.data.id }
            - call: "POST /car-share/incidents"
              payload: { reservation_id: "${res_e1_id}", vehicle_id: "${veh_e1_id}", member_id: "${m_hana_id}", incident_type: "DAMAGE", repair_cost_cents: 9000 }
              as: PodOperator
              captures: { inc_e1_id: $.data.id, inc_e1_ver: $.data.version }
          trigger:
            - call: "POST /car-share/incidents/{id}/party-split"
              payload: { expected_incident_version: "${inc_e1_ver}" }
              as: PodOperator
          assert:
            - "Membership.${ms_hana_id}.status == FROZEN"
            - "Membership.${ms_hana_id}.status_before_freeze == SUSPENDED"
            - "Membership.${ms_hana_id}.tier == FROZEN"
            - "Incident.${inc_e1_id}.status == ASSESSED"
            - "Membership.${ms_hana_id}.status != ACTIVE"

      - name: reservation_overdue_revert_cyclic_dimension
        grounds:
          - state_machines.Reservation.CLOSED_to_OVERDUE
          - state_machines.Reservation.OVERDUE_to_CLOSED
          - entities.Reservation.fields.status_before_overdue
          - calculations.charge_with_late_penalty_and_fuel_adjustment
        distinguishing_aspect: "Cyclic shape on Reservation: RETURNED -> OVERDUE -> CLOSED, where the resolution must re-apply the preserved status dimension rather than land in RETURNED, and the charge is recomputed on both the reopen and the resolution edge."
        test_recipe:
          setup:
            - "One approved member with an ACTIVE membership, one AVAILABLE campus-pod vehicle"
            - "One CONFIRMED reservation with end_at 2026-09-05T13:00:00Z"
            - "Logical clock advanced to 2026-09-10T12:00:00Z so the sweep detects lateness"
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Omar Overdue", email: "omar.overdue@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_omar_id: $.data.id }
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Campus Overdue", site_type: "CAMPUS", capacity: 4, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_ovd_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_ovd_id}", vin: "VIN3158F1", model: "Bolt", capacity_seats: 5, next_service_miles: 35000 }
              as: FleetAdmin
              captures: { veh_f1_id: $.data.id, veh_f1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_omar_id}", pod_id: "${pod_ovd_id}", vehicle_id: "${veh_f1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_f1_ver}" }
              as: Member
              as_user_id: "${m_omar_id}"
              captures: { res_f1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /car-share/reservations/{id}/reopen-overdue"
              payload: {}
              as: PodOperator
          trigger:
            - call: "POST /car-share/reservations/{id}/resolve-overdue"
              payload: {}
              as: PodOperator
          assert:
            - "Reservation.${res_f1_id}.status == CLOSED"
            - "Reservation.${res_f1_id}.status_before_overdue == CONFIRMED"
            - "Reservation.${res_f1_id}.status != RETURNED"
            - "Reservation.${res_f1_id}.late_minutes == 15750"
            - "Reservation.${res_f1_id}.charge_total_cents == 9944"

  # ===========================================================================
  # Rule 4 — transitive_cascade (>= 2 instances, depth >= 3 and depth >= 2,
  #          different triggering transitions)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: damage_split_three_hop_cascade
        grounds:
          - state_machines.Incident.OPEN_to_ASSESSED
          - state_machines.Incident.ASSESSED_to_FEE_CHARGED
          - state_machines.Membership.ACTIVE_to_FROZEN
          - state_machines.Vehicle.AVAILABLE_to_MAINTENANCE
          - state_machines.MaintenanceOrder.SCHEDULED_to_BLOCKED
          - state_machines.MaintenanceOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.Incident.FEE_CHARGED_to_CLOSED
          - entities.Vehicle.fields.use_status
        distinguishing_aspect: "Depth-4 chain triggered by the incident assessment: the assessment hop sets Incident.severity_score 4 and moves to FEE_CHARGED, that hop freezes the Membership, the freeze opens a blocking MaintenanceOrder that itself sets Vehicle.use_status to MAINTENANCE, and the order completion hop closes the Incident and thaws the membership."
        test_recipe:
          setup:
            - "One approved individual member with an ACTIVE primary membership"
            - "One AVAILABLE campus-pod vehicle in a pod whose capacity admits one blocking maintenance window"
            - "One CONFIRMED reservation start_at 2026-09-05T09:00:00Z, end_at 2026-09-05T13:00:00Z, so the assessment hop 1 produces assigned block count 2"
            - "Logical clock at 2026-09-05T10:00:00Z so the assessment-hop lateness term T2 is 2 and severity_score is 4"
            - "One OPEN DAMAGE incident with repair_cost_cents 12000"
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Fiona Frozen", email: "fiona.frozen@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_fiona_id: $.data.id }
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "GET /car-share/members/{m_fiona_id}/memberships"
              as: PodOperator
              captures: { ms_fiona_id: "$.data[0].id" }
            - call: "POST /car-share/pods"
              payload: { name: "Campus Cascade", site_type: "CAMPUS", capacity: 4, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_cas_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_cas_id}", vin: "VIN3158G1", model: "Ioniq", capacity_seats: 5, next_service_miles: 20000 }
              as: FleetAdmin
              captures: { veh_g1_id: $.data.id, veh_g1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_fiona_id}", pod_id: "${pod_cas_id}", vehicle_id: "${veh_g1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_g1_ver}" }
              as: Member
              as_user_id: "${m_fiona_id}"
              captures: { res_g1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /car-share/incidents"
              payload: { reservation_id: "${res_g1_id}", vehicle_id: "${veh_g1_id}", member_id: "${m_fiona_id}", incident_type: "DAMAGE", repair_cost_cents: 12000 }
              as: PodOperator
              captures: { inc_g1_id: $.data.id, inc_g1_ver: $.data.version }
          trigger:
            - call: "POST /car-share/incidents/{id}/party-split"
              payload: { expected_incident_version: "${inc_g1_ver}" }
              as: PodOperator
          assert:
            - "Incident.${inc_g1_id}.severity_score == 4"
            - "Incident.${inc_g1_id}.status == FEE_CHARGED"
            - "Incident.${inc_g1_id}.insurance_layer == STANDARD"
            - "Membership.${ms_fiona_id}.status == FROZEN"
            - "Membership.${ms_fiona_id}.status_before_freeze == ACTIVE"

      - name: reservation_close_two_hop_cascade
        grounds:
          - state_machines.Reservation.RETURNED_to_CLOSED
          - state_machines.Vehicle.IN_USE_to_AVAILABLE
          - state_machines.Reservation.CONFIRMED_to_IN_USE
          - calculations.strike_escalation
          - entities.Reservation.fields.charge_total_cents
          - entities.Member.fields.referral_invites
        distinguishing_aspect: "Depth-3 chain from a different trigger (the reservation close, not the incident split): the lateness sweep hop captures status_before_overdue and recomputes the charge, the resolution hop posts the C2 ledger penalty and writes charge_total_cents 9944, and the close hop issues the referral credit of 500 wallet cents plus 10 invites on top of the 2000 hold release."
        test_recipe:
          setup:
            - "One approved member with an ACTIVE membership and one AVAILABLE campus-pod vehicle"
            - "One CONFIRMED reservation end_at 2026-09-05T13:00:00Z, reserved_hours 4"
            - "Logical clock at 2026-09-10T12:00:00Z"
            - "One posted fuel-card transaction of 4000 cents"
          setup_api_calls:
