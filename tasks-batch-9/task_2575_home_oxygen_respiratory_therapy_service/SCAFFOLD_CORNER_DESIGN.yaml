      - name: equipment_selection_excludes_ineligible_units
        claim_type: input_set_filtering
        grounds:
          - calculations.equipment_selection
          - errors[ERR_NO_ELIGIBLE_EQUIPMENT]
        distinguishing_aspect: |
          Five independent exclusion predicates are made to fire at once against a 3.0 lpm
          prescription — under-capacity, overdue maintenance, an OPEN CLASS_III recall on the model
          (a class that quarantines nothing, so the unit is still IN_STOCK and only the recall
          predicate can remove it), a liquid unit at a branch whose certification was later
          withdrawn, and a unit belonging to a different branch — so the candidate set is empty.
        test_recipe:
          setup:
            - "Branch H1 is created liquid_oxygen_certified true (the only way to admit a LIQUID_RESERVOIR unit past priority 90), then PATCHed to false."
            - "Branch H2 is a second branch used only to hold an otherwise perfect unit."
            - "One ACTIVE certificate prescribing 3.0 lpm for a patient at H1, and one PENDING_SETUP contract."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: true, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
