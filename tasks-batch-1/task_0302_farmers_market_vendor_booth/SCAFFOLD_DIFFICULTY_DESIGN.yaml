# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Farmers Market & Vendor Booth Management — Expert band
# 9 Difficulty Rules x >= 2 instances each = 18 instances total.
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only.
#
# Standard market policy used across recipes (pin once, reuse):
#   season_fee_cents=50000, daily_fee_cents=4000, commission_bps=700 (7%),
#   voucher_face_value_cents=200, season window 2026-06-01 .. 2026-09-30.
#   size multipliers: SINGLE=100, DOUBLE=180, CORNER=150 (basis-hundredths).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: assignment_fee_season_vs_daily_diverge
        grounds:
          - calculations.assignment_fee
          - entities.BoothAssignment.fields.fee_charged_cents
          - state_machines.BoothAssignment.REQUESTED_to_RESERVED
        distinguishing_aspect: |
          On the BoothAssignment domain, the SEASON variant charges season_fee_cents*size_mult
          (one flat charge) while the DAILY variant charges daily_fee_cents*size_mult per day;
          for the same CORNER booth a SEASON assignment locks 75000 and a DAILY assignment locks
          6000 — different fee_charged_cents from the same booth/market inputs.
        test_recipe:
          setup:
            - "Market with season_fee_cents=50000, daily_fee_cents=4000, commission_bps=700, voucher_face_value_cents=200, season 2026-06-01..2026-09-30."
            - "One CORNER booth (allowed_categories empty)."
            - "One ACTIVE vendor with an APPROVED PRODUCE application and a VERIFIED HEALTH permit not required for PRODUCE."
            - "One SCHEDULED MarketDay 2026-06-06."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /booths"
              payload: { market_id: "${mkt}", label: "A-12", grid_row: 1, grid_col: 12, size_class: "CORNER", allowed_categories: [] }
              as: MarketAdmin
              captures: { booth: $.data.id, booth_v: $.data.version }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "Acme Farm", contact_email: "acme@x.com" }
              as: MarketAdmin
              captures: { ven: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${ven}", product_category: "PRODUCE" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/start-review"
              payload: {}
              as: MarketAdmin
            - call: "POST /applications/${app}/approve"
              payload: { review_note: "ok" }
              as: MarketAdmin
            - call: "POST /market-days"
              payload: { market_id: "${mkt}", market_date: "2026-06-06" }
              as: MarketAdmin
              captures: { day: $.data.id }
          trigger:
            - call: "POST /booth-assignments"
              payload: { market_id: "${mkt}", booth_id: "${booth}", vendor_id: "${ven}", assignment_type: "SEASON", expected_booth_version: "${booth_v}" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { season_asg: $.data.id }
          assert:
            - "BoothAssignment.${season_asg}.assignment_type == SEASON"
            - "BoothAssignment.${season_asg}.fee_charged_cents == 75000"
            - "BoothAssignment.${season_asg}.status == RESERVED"

      - name: commission_provisional_vs_final_diverge
        grounds:
          - calculations.commission
          - entities.SalesReport.fields.commission_cents
          - state_machines.SalesReport.SUBMITTED_to_RECONCILED
        distinguishing_aspect: |
          On the SalesReport domain, the provisional variant bills commission on full gross_sales
          (30000*0.07=2100) while the final variant bills on verified_sales = min(gross, reconciled
          tokens * face) = min(30000, 40*200=8000)=8000, yielding 8000*0.07=560 — a different
          commission_cents on the identical SalesReport row.
        test_recipe:
          setup:
            - "Standard market; one SINGLE booth; one ACTIVE vendor; one OPEN MarketDay 2026-06-06."
            - "Vendor has a RESERVED DAILY assignment, a PRESENT CheckIn on that day, and a DRAFT SalesReport with gross_sales_cents=30000, tokens_accepted=50."
            - "A VoucherBatch (tokens_issued=100) on the day; the vendor has VoucherRedemptions totalling 40 tokens, all RECONCILED."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /booths"
              payload: { market_id: "${mkt}", label: "B-01", grid_row: 0, grid_col: 1, size_class: "SINGLE", allowed_categories: [] }
              as: MarketAdmin
              captures: { booth: $.data.id, booth_v: $.data.version }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "Acme Farm", contact_email: "acme@x.com" }
              as: MarketAdmin
              captures: { ven: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${ven}", product_category: "CRAFTS" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/start-review"
              payload: {}
              as: MarketAdmin
            - call: "POST /applications/${app}/approve"
              payload: { review_note: "ok" }
              as: MarketAdmin
            - call: "POST /market-days"
              payload: { market_id: "${mkt}", market_date: "2026-06-06" }
              as: MarketAdmin
              captures: { day: $.data.id }
            - call: "POST /market-days/${day}/open"
              payload: {}
              as: MarketAdmin
            - call: "POST /booth-assignments"
              payload: { market_id: "${mkt}", booth_id: "${booth}", vendor_id: "${ven}", assignment_type: "DAILY", market_day_id: "${day}" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { asg: $.data.id }
            - call: "POST /check-ins"
              payload: { market_id: "${mkt}", booth_assignment_id: "${asg}", market_day_id: "${day}" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { ci: $.data.id }
            - call: "POST /check-ins/${ci}/arrive"
              payload: {}
              as: Vendor
              as_user_id: "${ven}"
            - call: "POST /voucher-batches"
              payload: { market_id: "${mkt}", market_day_id: "${day}", tokens_issued: 100 }
              as: MarketManager
              captures: { batch: $.data.id }
            - call: "POST /voucher-redemptions"
              payload: { market_id: "${mkt}", voucher_batch_id: "${batch}", vendor_id: "${ven}", market_day_id: "${day}", token_count: 40 }
              as: Vendor
              as_user_id: "${ven}"
              captures: { red: $.data.id }
            - call: "POST /voucher-redemptions/${red}/reconcile"
              payload: {}
              as: MarketManager
            - call: "POST /sales-reports"
              payload: { market_id: "${mkt}", check_in_id: "${ci}", gross_sales_cents: 30000, tokens_accepted: 50 }
              as: Vendor
              as_user_id: "${ven}"
              captures: { sr: $.data.id }
            - call: "POST /sales-reports/${sr}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${ven}"
          trigger:
            - call: "POST /sales-reports/${sr}/reconcile"
              payload: {}
              as: MarketManager
          assert:
            - "Before trigger, SalesReport.${sr}.commission_cents == 2100 (provisional on gross 30000)"
            - "SalesReport.${sr}.reconciled_token_count == 40"
            - "SalesReport.${sr}.commission_cents == 560 (final on verified 8000)"
            - "SalesReport.${sr}.status == RECONCILED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: voucher_liability_nested_min_branch  # MODE (a): >=3 inputs, nested min, conditional branch
        grounds:
          - calculations.voucher_liability_ledger
          - entities.Market.fields.voucher_liability_cents
          - entities.VoucherBatch.fields.tokens_redeemed
        distinguishing_aspect: |
          MODE (a): voucher_liability combines >=3 inputs (face value 200, per-redemption token_count,
          per-batch tokens_issued cap) with a nested min(tokens_issued, sum RECONCILED token_count)
          and a status branch (only RECONCILED rows enter the sum); two redemptions 40+30=70 under a
          100-token batch give tokens_redeemed=70 and liability 200*70=14000.
        test_recipe:
          setup:
            - "Standard market; OPEN MarketDay 2026-06-06; VoucherBatch tokens_issued=100."
            - "Two vendors each submit a redemption (40 and 30 tokens); both RECONCILED."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { v1: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V2", contact_email: "v2@x.com" }
              as: MarketAdmin
              captures: { v2: $.data.id }
            - call: "POST /market-days"
              payload: { market_id: "${mkt}", market_date: "2026-06-06" }
              as: MarketAdmin
              captures: { day: $.data.id }
            - call: "POST /market-days/${day}/open"
              payload: {}
              as: MarketAdmin
            - call: "POST /voucher-batches"
              payload: { market_id: "${mkt}", market_day_id: "${day}", tokens_issued: 100 }
              as: MarketManager
              captures: { batch: $.data.id }
            - call: "POST /voucher-redemptions"
              payload: { market_id: "${mkt}", voucher_batch_id: "${batch}", vendor_id: "${v1}", market_day_id: "${day}", token_count: 40 }
              as: Vendor
              as_user_id: "${v1}"
              captures: { r1: $.data.id }
            - call: "POST /voucher-redemptions"
              payload: { market_id: "${mkt}", voucher_batch_id: "${batch}", vendor_id: "${v2}", market_day_id: "${day}", token_count: 30 }
              as: Vendor
              as_user_id: "${v2}"
              captures: { r2: $.data.id }
            - call: "POST /voucher-redemptions/${r1}/reconcile"
              payload: {}
              as: MarketManager
          trigger:
            - call: "POST /voucher-redemptions/${r2}/reconcile"
              payload: {}
              as: MarketManager
          assert:
            - "VoucherBatch.${batch}.tokens_redeemed == 70"
            - "VoucherRedemption.${r2}.reimbursed_cents == 6000"
            - "Market.${mkt}.voucher_liability_cents == 14000"

      - name: market_fee_ledger_pinned_eval_order  # MODE (c): circular-looking, pinned evaluation order
        grounds:
          - calculations.market_fee_ledger
          - calculations.assignment_fee
          - entities.Market.fields.total_fees_collected_cents
        distinguishing_aspect: |
          MODE (c): total_fees_collected_cents looks circular (assignment fee feeds the market ledger
          which is read back), but the order is pinned — STEP 1 locks each assignment's
          fee_charged_cents/fee_refunded_cents in isolation, STEP 2 sums only then. One SEASON CORNER
          (75000) plus one DAILY DOUBLE (7200) yields exactly 82200, not a fixed-point iteration.
        test_recipe:
          setup:
            - "Standard market; CORNER booth + DOUBLE booth (allowed_categories empty)."
            - "Two ACTIVE vendors with APPROVED applications; one OPEN MarketDay 2026-06-06."
            - "Vendor1 holds a RESERVED SEASON assignment on CORNER; Vendor2 holds a RESERVED DAILY assignment on DOUBLE for the day."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /booths"
              payload: { market_id: "${mkt}", label: "C-1", grid_row: 0, grid_col: 1, size_class: "CORNER", allowed_categories: [] }
              as: MarketAdmin
              captures: { booth_c: $.data.id, booth_c_v: $.data.version }
            - call: "POST /booths"
              payload: { market_id: "${mkt}", label: "D-1", grid_row: 0, grid_col: 2, size_class: "DOUBLE", allowed_categories: [] }
              as: MarketAdmin
              captures: { booth_d: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { v1: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V2", contact_email: "v2@x.com" }
              as: MarketAdmin
              captures: { v2: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${v1}", product_category: "CRAFTS" }
              as: Vendor
              as_user_id: "${v1}"
              captures: { app1: $.data.id }
            - call: "POST /applications/${app1}/start-review"
              payload: {}
              as: MarketAdmin
            - call: "POST /applications/${app1}/approve"
              payload: { review_note: "ok" }
              as: MarketAdmin
            - call: "POST /applications"
              payload: { vendor_id: "${v2}", product_category: "FLOWERS" }
              as: Vendor
              as_user_id: "${v2}"
              captures: { app2: $.data.id }
            - call: "POST /applications/${app2}/start-review"
              payload: {}
              as: MarketAdmin
            - call: "POST /applications/${app2}/approve"
              payload: { review_note: "ok" }
              as: MarketAdmin
            - call: "POST /market-days"
              payload: { market_id: "${mkt}", market_date: "2026-06-06" }
              as: MarketAdmin
              captures: { day: $.data.id }
            - call: "POST /market-days/${day}/open"
              payload: {}
              as: MarketAdmin
            - call: "POST /booth-assignments"
              payload: { market_id: "${mkt}", booth_id: "${booth_c}", vendor_id: "${v1}", assignment_type: "SEASON", expected_booth_version: "${booth_c_v}" }
              as: Vendor
              as_user_id: "${v1}"
              captures: { asg_season: $.data.id }
          trigger:
            - call: "POST /booth-assignments"
              payload: { market_id: "${mkt}", booth_id: "${booth_d}", vendor_id: "${v2}", assignment_type: "DAILY", market_day_id: "${day}" }
              as: Vendor
              as_user_id: "${v2}"
              captures: { asg_daily: $.data.id }
          assert:
            - "BoothAssignment.${asg_season}.fee_charged_cents == 75000"
            - "BoothAssignment.${asg_daily}.fee_charged_cents == 7200"
            - "Market.${mkt}.total_fees_collected_cents == 82200"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_reject_resubmit_cycle
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_REJECTED
          - state_machines.Application.REJECTED_to_SUBMITTED
          - state_machines.Application.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          The Application state machine is cyclic: SUBMITTED->UNDER_REVIEW->REJECTED->SUBMITTED
          loops back, distinct from any linear pipeline; a rejected application returns to SUBMITTED
          with review_note cleared and can be reviewed again.
        test_recipe:
          setup:
            - "Standard market; one ACTIVE-or-PROSPECT vendor; an Application SUBMITTED."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { ven: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${ven}", product_category: "CRAFTS" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/start-review"
              payload: {}
              as: MarketAdmin
            - call: "POST /applications/${app}/reject"
              payload: { review_note: "needs detail" }
              as: MarketAdmin
          trigger:
            - call: "POST /applications/${app}/resubmit"
              payload: {}
              as: Vendor
              as_user_id: "${ven}"
          assert:
            - "BoothAssignment unaffected; Application.${app}.status == SUBMITTED"
            - "Application.${app}.review_note == null"

      - name: sales_report_dispute_resubmit_cycle
        grounds:
          - state_machines.SalesReport.SUBMITTED_to_DISPUTED
          - state_machines.SalesReport.DISPUTED_to_SUBMITTED
          - entities.SalesReport.fields.commission_cents
        distinguishing_aspect: |
          On a different entity (SalesReport), the machine cycles SUBMITTED->DISPUTED->SUBMITTED:
          the manager disputes, the vendor re-submits corrected figures, and provisional commission
          is recomputed (e.g., gross corrected 30000->20000 changes commission 2100->1400).
        test_recipe:
          setup:
            - "Standard market; OPEN day; PRESENT check-in; a SalesReport SUBMITTED with gross_sales_cents=30000 (provisional commission 2100)."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /booths"
              payload: { market_id: "${mkt}", label: "B-01", grid_row: 0, grid_col: 1, size_class: "SINGLE", allowed_categories: [] }
              as: MarketAdmin
              captures: { booth: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { ven: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${ven}", product_category: "CRAFTS" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/start-review"
              payload: {}
              as: MarketAdmin
            - call: "POST /applications/${app}/approve"
              payload: { review_note: "ok" }
              as: MarketAdmin
            - call: "POST /market-days"
              payload: { market_id: "${mkt}", market_date: "2026-06-06" }
              as: MarketAdmin
              captures: { day: $.data.id }
            - call: "POST /market-days/${day}/open"
              payload: {}
              as: MarketAdmin
            - call: "POST /booth-assignments"
              payload: { market_id: "${mkt}", booth_id: "${booth}", vendor_id: "${ven}", assignment_type: "DAILY", market_day_id: "${day}" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { asg: $.data.id }
            - call: "POST /check-ins"
              payload: { market_id: "${mkt}", booth_assignment_id: "${asg}", market_day_id: "${day}" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { ci: $.data.id }
            - call: "POST /check-ins/${ci}/arrive"
              payload: {}
              as: Vendor
              as_user_id: "${ven}"
            - call: "POST /sales-reports"
              payload: { market_id: "${mkt}", check_in_id: "${ci}", gross_sales_cents: 30000, tokens_accepted: 0 }
              as: Vendor
              as_user_id: "${ven}"
              captures: { sr: $.data.id }
            - call: "POST /sales-reports/${sr}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${ven}"
            - call: "POST /sales-reports/${sr}/dispute"
              payload: {}
              as: MarketManager
          trigger:
            - call: "POST /sales-reports/${sr}/submit"
              payload: { gross_sales_cents: 20000, tokens_accepted: 0 }
              as: Vendor
              as_user_id: "${ven}"
          assert:
            - "SalesReport.${sr}.status == SUBMITTED"
            - "SalesReport.${sr}.commission_cents == 1400"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: weather_cancel_day_to_assignment_to_market_ledger  # depth >= 3
        grounds:
          - state_machines.MarketDay.OPEN_to_CANCELLED
          - state_machines.BoothAssignment.RESERVED_to_CANCELLED  # via the [..]_to_CANCELLED transition
          - calculations.fee_refund
          - calculations.market_fee_ledger
        distinguishing_aspect: |
          Depth-3 chain from MarketDay weather cancel: (1) MarketDay->CANCELLED, which causes
          (2) each DAILY BoothAssignment on that day->CANCELLED and its fee_refunded_cents to be set,
          which itself causes (3) Market.total_fees_collected_cents to be recomputed. Each hop is
          caused by the prior hop, not directly by the cancel call.
        test_recipe:
          setup:
            - "Standard market; SINGLE booth; ACTIVE vendor; OPEN MarketDay 2026-06-06; a RESERVED DAILY assignment (fee_charged 4000) — total_fees_collected_cents == 4000."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /booths"
              payload: { market_id: "${mkt}", label: "B-01", grid_row: 0, grid_col: 1, size_class: "SINGLE", allowed_categories: [] }
              as: MarketAdmin
              captures: { booth: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { ven: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${ven}", product_category: "CRAFTS" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/start-review"
              payload: {}
              as: MarketAdmin
            - call: "POST /applications/${app}/approve"
              payload: { review_note: "ok" }
              as: MarketAdmin
            - call: "POST /market-days"
              payload: { market_id: "${mkt}", market_date: "2026-06-06" }
              as: MarketAdmin
              captures: { day: $.data.id }
            - call: "POST /market-days/${day}/open"
              payload: {}
              as: MarketAdmin
            - call: "POST /booth-assignments"
              payload: { market_id: "${mkt}", booth_id: "${booth}", vendor_id: "${ven}", assignment_type: "DAILY", market_day_id: "${day}" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /market-days/${day}/cancel"
              payload: { cancellation_reason: "WEATHER" }
              as: MarketAdmin
          assert:
            - "MarketDay.${day}.status == CANCELLED"
            - "MarketDay.${day}.daily_fee_refundable == true"
            - "BoothAssignment.${asg}.status == CANCELLED"
            - "BoothAssignment.${asg}.fee_refunded_cents == 4000"
            - "Market.${mkt}.total_fees_collected_cents == 0"

      - name: complete_season_to_booth_to_waitlist_promotion  # depth >= 2 from a different trigger
        grounds:
          - state_machines.BoothAssignment.RESERVED_to_COMPLETED  # via [RESERVED,ACTIVE]_to_COMPLETED
          - state_machines.BoothAssignment.WAITLISTED_to_RESERVED
          - entities.Booth.fields.season_holder_assignment_id
        distinguishing_aspect: |
          Different trigger (assignment complete, not day cancel): completing a SEASON assignment
          (1) frees the booth (Booth.status OPEN, season_holder cleared), which itself causes
          (2) the rank-1 WAITLISTED SEASON assignment to be promoted to RESERVED and re-take the booth.
          Two caused hops originating from the complete transition.
        test_recipe:
          setup:
            - "Standard market; CORNER booth; two ACTIVE vendors V1,V2 with APPROVED applications."
            - "V1 holds a RESERVED SEASON assignment on the booth (created first); V2's later SEASON request was auto-WAITLISTED at rank 1."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /booths"
              payload: { market_id: "${mkt}", label: "C-1", grid_row: 0, grid_col: 1, size_class: "CORNER", allowed_categories: [] }
              as: MarketAdmin
              captures: { booth: $.data.id, booth_v0: $.data.version }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { v1: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V2", contact_email: "v2@x.com" }
              as: MarketAdmin
              captures: { v2: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${v1}", product_category: "CRAFTS" }
              as: Vendor
              as_user_id: "${v1}"
              captures: { app1: $.data.id }
            - call: "POST /applications/${app1}/start-review"
              payload: {}
              as: MarketAdmin
            - call: "POST /applications/${app1}/approve"
              payload: { review_note: "ok" }
              as: MarketAdmin
            - call: "POST /applications"
              payload: { vendor_id: "${v2}", product_category: "FLOWERS" }
              as: Vendor
              as_user_id: "${v2}"
              captures: { app2: $.data.id }
            - call: "POST /applications/${app2}/start-review"
              payload: {}
              as: MarketAdmin
            - call: "POST /applications/${app2}/approve"
              payload: { review_note: "ok" }
              as: MarketAdmin
            - call: "POST /booth-assignments"
              payload: { market_id: "${mkt}", booth_id: "${booth}", vendor_id: "${v1}", assignment_type: "SEASON", expected_booth_version: "${booth_v0}" }
              as: Vendor
              as_user_id: "${v1}"
              captures: { asg1: $.data.id, booth_v1: $.data.version }
            - call: "GET /booths/${booth}"
              payload: {}
              as: MarketAdmin
              captures: { booth_v_held: $.data.version }
            - call: "POST /booth-assignments"
              payload: { market_id: "${mkt}", booth_id: "${booth}", vendor_id: "${v2}", assignment_type: "SEASON", allow_waitlist: true, expected_booth_version: "${booth_v_held}" }
              as: Vendor
              as_user_id: "${v2}"
              captures: { asg2: $.data.id }
          trigger:
            - call: "POST /booth-assignments/${asg1}/complete"
              payload: {}
              as: MarketAdmin
          assert:
            - "BoothAssignment.${asg1}.status == COMPLETED"
            - "BoothAssignment.${asg2}.status == RESERVED"
            - "BoothAssignment.${asg2}.fee_charged_cents == 75000"
            - "Booth.${booth}.season_holder_assignment_id == ${asg2}"

