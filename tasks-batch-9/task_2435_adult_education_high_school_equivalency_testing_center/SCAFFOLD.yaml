scenario: |
  Generate task harder than expert level!

  2435. Adult Education & High School Equivalency Testing Center (adult education program and testing center): student intake, orientation and standardized pre-testing for functioning level placement, class assignment across literacy, high school equivalency preparation and English language acquisition, attendance hour tracking and post-testing intervals for measurable skill gain, testing center authorization, proctor certification and exam scheduling with identity verification, accommodation requests and alternate format testing, credential issuance, transcript ordering and state records, performance reporting on employment and postsecondary transitions, funding allocation tied to outcome measures

domain_name: adult-education-hse-testing
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic_free
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Flat topology: every entity is a top-level collection joined by explicit FK
    fields (no deep URL nesting except reverse-reachability sub-resource reads).
    Parallel state shape: ExamRegistration carries two independent state axes
    (registration_status x identity_status); cycles exist on AccommodationRequest
    (INFO_REQUESTED -> SUBMITTED), Proctor (LAPSED -> CERTIFIED), ExamSession
    (SCHEDULED -> DRAFT) and Student (ENROLLED -> PLACED); TestingCenter branches
    (APPLIED -> PROVISIONAL | FULL_AUTHORIZED) with divergent side-effect sets.
    Segregation of duties: the operator user id that records an OutcomeRecord may
    never be the operator user id that certifies it.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name captured at intake.
        constraints: non-empty, max 120 chars
      - name: email
        type: string
        source: input
        description: Contact email; unique across Students.
        constraints: unique, must contain '@'
      - name: primary_track
        type: enum
        source: input
        description: Instructional track the learner enters on.
        constraints: one of LITERACY, HSE_PREP, ESL
      - name: intake_status
        type: enum
        source: system
        description: Intake lifecycle state (see state_machines.Student).
        default: INTAKE_STARTED
        constraints: one of INTAKE_STARTED, ORIENTED, PLACED, ENROLLED, EXITED
      - name: orientation_completed_at
        type: datetime
        source: system
        description: Logical-clock instant orientation was recorded; null before that.
        default: null
      - name: placement_efl_level
        type: integer
        source: computed
        description: Educational functioning level from the earliest SCORED PRE_TEST (calculations.efl_placement_level).
        default: null
        constraints: 1..6 or null
      - name: total_instructional_hours
        type: number
        source: computed
        description: Sum of posted_hours over this student's Enrollments (calculations.instructional_hour_ledger).
        default: 0
        constraints: 2 decimal places, >= 0
      - name: voucher_granted_cents
        type: integer
        source: computed
        description: Lifetime sum of positive voucher adjustments granted to this student.
        default: 0
      - name: voucher_balance_cents
        type: integer
        source: computed
        description: Unspent voucher cents available to offset exam fees.
        default: 0
        constraints: ">= 0"
      - name: voucher_spent_cents
        type: integer
        source: computed
        description: Voucher cents currently applied to non-refunded ExamRegistrations.
        default: 0
        constraints: ">= 0; voucher_granted_cents == voucher_balance_cents + voucher_spent_cents"
      - name: self_pay_authorized
        type: boolean
        source: input
        description: Whether the learner may owe an out-of-pocket exam balance.
        default: false
      - name: exam_fee_owed_cents
        type: integer
        source: computed
        description: Sum of fee_due_cents over this student's non-refunded ExamRegistrations.
        default: 0
      - name: credential_status
        type: enum
        source: computed
        description: Credential posture derived from CredentialIssuance rows.
        default: NONE
        constraints: one of NONE, ISSUED, REVOKED
      - name: active_enrollment_count
        type: integer
        source: computed
        description: Count of this student's Enrollments with status ACTIVE.
        default: 0

  - name: TestingCenter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Center display name.
        constraints: non-empty
      - name: state_code
        type: string
        source: input
        description: Two-letter state code owning the authorization.
        constraints: exactly 2 uppercase letters
      - name: authorization_status
        type: enum
        source: system
        description: Authorization posture (see state_machines.TestingCenter).
        default: APPLIED
        constraints: one of APPLIED, PROVISIONAL, FULL_AUTHORIZED, SUSPENDED, WITHDRAWN
      - name: allowed_subtests
        type: array
        source: computed
        description: Subtests this center may schedule; set by the authorization branch taken.
        default: []
        constraints: subset of MATH, RLA, SCIENCE, SOCIAL_STUDIES
      - name: max_sessions_per_week
        type: integer
        source: computed
        description: Weekly ExamSession ceiling implied by the authorization branch (PROVISIONAL 2, FULL_AUTHORIZED 20).
        default: 0
      - name: authorized_at
        type: datetime
        source: system
        description: Logical-clock instant of the first authorization grant.
        default: null
      - name: suspended_reason
        type: string
        source: input
        description: Reason text supplied on suspension; null until suspended.
        default: null

  - name: TestingRoom
    parent: TestingCenter
    common_fields: true
    fields:
      - name: testing_center_id
        type: string
        source: input
        description: FK -> TestingCenter.id; owning center, taken from the path on creation.
      - name: room_code
        type: string
        source: input
        description: Room label unique within the center.
        constraints: unique per testing_center_id
      - name: seat_capacity
        type: integer
        source: input
        description: Physical seat count in the room.
        constraints: ">= 1, <= 200"
      - name: turnaround_buffer_minutes
        type: integer
        source: input
        description: Mandatory clean-down gap between two ExamSessions in this room.
        default: 45
        constraints: 0..120
      - name: status
        type: enum
        source: system
        description: Room availability posture (see state_machines.TestingRoom).
        default: ACTIVE
        constraints: one of ACTIVE, OUT_OF_SERVICE
      - name: service_note
        type: string
        source: input
        description: Maintenance note recorded when the room is taken out of service; null while ACTIVE.
        default: null

  - name: Proctor
    parent: TestingCenter
    common_fields: true
    fields:
      - name: testing_center_id
        type: string
        source: input
        description: FK -> TestingCenter.id; employing center, taken from the path on creation.
      - name: full_name
        type: string
        source: input
        description: Proctor legal name.
        constraints: non-empty
      - name: certification_status
        type: enum
        source: system
        description: Certification posture (see state_machines.Proctor).
        default: PENDING
        constraints: one of PENDING, CERTIFIED, LAPSED, REVOKED
      - name: certification_expires_at
        type: datetime
        source: system
        description: Expiry instant recorded by the latest CERTIFY/RENEW decision; null while PENDING.
        default: null
      - name: daily_hour_cap
        type: number
        source: input
        description: Maximum proctored session hours per UTC calendar day.
        default: 8.00
        constraints: "> 0, <= 12, 2 decimal places"
      - name: assigned_session_count
        type: integer
        source: computed
        description: Count of ExamSessions currently pointing at this proctor with status in SCHEDULED, IN_PROGRESS, COMPLETED.
        default: 0

  - name: ClassSection
    parent: null
    common_fields: true
    fields:
      - name: program_track
        type: enum
        source: input
        description: Track this section teaches.
        constraints: one of LITERACY, HSE_PREP, ESL
      - name: title
        type: string
        source: input
        description: Section title.
        constraints: non-empty
      - name: instructor_user_id
        type: string
        source: input
        description: Opaque staff identifier of the assigned instructor (operator id, not an entity reference).
        constraints: non-empty
      - name: min_efl_level
        type: integer
        source: input
        description: Lowest educational functioning level accepted for enrollment.
        constraints: 1..6
      - name: max_efl_level
        type: integer
        source: input
        description: Highest educational functioning level accepted for enrollment.
        constraints: 1..6, >= min_efl_level
      - name: seats_total
        type: integer
        source: input
        description: Total seats in the section.
        constraints: ">= 1, <= 60"
      - name: seats_taken
        type: integer
        source: computed
        description: Count of Enrollments on this section with status ACTIVE.
        default: 0
      - name: seats_available
        type: integer
        source: computed
        description: seats_total - seats_taken; conserved by enroll/withdraw.
        default: null
      - name: weekly_hours
        type: number
        source: input
        description: Scheduled instructional hours per week.
        constraints: "> 0, <= 40, 2 decimal places"
      - name: status
        type: enum
        source: system
        description: Section lifecycle state (see state_machines.ClassSection).
        default: PLANNED
        constraints: one of PLANNED, OPEN, IN_SESSION, CLOSED

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; the enrolled learner.
      - name: class_section_id
        type: string
        source: input
        description: FK -> ClassSection.id; the section the learner is assigned to.
      - name: status
        type: enum
        source: system
        description: Enrollment lifecycle state (see state_machines.Enrollment).
        default: ACTIVE
        constraints: one of ACTIVE, COMPLETED, WITHDRAWN
      - name: entry_efl_level
        type: integer
        source: computed
        description: Copy of Student.placement_efl_level frozen at enrollment creation.
        constraints: 1..6
      - name: posted_hours
        type: number
        source: computed
        description: Sum of AttendanceEntry.hours for this enrollment where status == POSTED.
        default: 0
        constraints: 2 decimal places, >= 0
      - name: post_test_eligible
        type: boolean
        source: computed
        description: Recomputed by calculations.post_test_eligibility on every posted_hours change.
        default: false
      - name: withdrawn_at
        type: datetime
        source: system
        description: Logical-clock instant of withdrawal; null otherwise.
        default: null
      - name: exit_reason
        type: string
        source: system
        description: Reason recorded on WITHDRAWN or COMPLETED transitions; null while ACTIVE.
        default: null

  - name: AttendanceEntry
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id; taken from the path on creation.
      - name: attendance_date
        type: string
        source: input
        description: UTC calendar date (YYYY-MM-DD) the hours were delivered.
        constraints: ISO date, must be <= logical clock date
      - name: hours
        type: number
        source: input
        description: Instructional hours delivered on attendance_date.
        constraints: "> 0, <= 8, multiple of 0.25"
      - name: status
        type: enum
        source: system
        description: POSTED on creation; VOIDED after a correction.
        default: POSTED
        constraints: one of POSTED, VOIDED
      - name: void_reason
        type: string
        source: input
        description: Correction reason recorded on void; null while POSTED.
        default: null
      - name: posted_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the Instructor who posted the hours.

  - name: TestEvent
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; the tested learner.
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id; required for POST_TEST, null for intake PRE_TEST.
        default: null
      - name: purpose
        type: enum
        source: input
        description: Whether this administration places the learner or measures gain.
        constraints: one of PRE_TEST, POST_TEST
      - name: test_form
        type: enum
        source: input
        description: Standardized instrument administered.
        constraints: one of CASAS_R_900, CASAS_M_900, BEST_PLUS
      - name: scheduled_for
        type: datetime
        source: input
        description: Planned administration instant.
        constraints: must be >= logical clock at creation
      - name: test_date
        type: datetime
        source: system
        description: Logical-clock instant at scoring; null while SCHEDULED.
        default: null
      - name: scale_score
        type: integer
        source: input
        description: Raw scale score recorded at scoring; null while SCHEDULED.
        default: null
        constraints: 0..999
      - name: efl_level
        type: integer
        source: computed
        description: Educational functioning level from calculations.efl_placement_level.
        default: null
        constraints: 1..6 or null
      - name: status
        type: enum
        source: system
        description: Test event state (see state_machines.TestEvent).
        default: SCHEDULED
        constraints: one of SCHEDULED, SCORED, INVALIDATED
      - name: invalidation_reason
        type: string
        source: system
        description: Cascade reason recorded when the event is invalidated; null otherwise.
        default: null

  - name: ExamSession
    parent: null
    common_fields: true
    fields:
      - name: testing_room_id
        type: string
        source: input
        description: FK -> TestingRoom.id; room occupied by this session.
      - name: proctor_id
        type: string
        source: input
        description: FK -> Proctor.id; assigned proctor, null while DRAFT.
        default: null
      - name: subtest
        type: enum
        source: input
        description: High school equivalency subtest administered.
        constraints: one of MATH, RLA, SCIENCE, SOCIAL_STUDIES
      - name: starts_at
        type: datetime
        source: input
        description: Session start instant (inclusive).
      - name: ends_at
        type: datetime
        source: input
        description: Session end instant (exclusive).
        constraints: "> starts_at; ends_at - starts_at <= 6 hours"
      - name: requested_seats
        type: integer
        source: input
        description: Seats the center wants to open for this session.
        constraints: ">= 1"
      - name: seat_capacity
        type: integer
        source: computed
        description: min(requested_seats, TestingRoom.seat_capacity).
      - name: seats_taken
        type: integer
        source: computed
        description: Count of ExamRegistrations on this session with registration_status in REGISTERED, CHECKED_IN, SCORED.
        default: 0
      - name: duration_hours
        type: number
        source: computed
        description: (ends_at - starts_at) in hours, 2 decimal places.
      - name: supported_formats
        type: array
        source: input
        description: Alternate testing formats this session can deliver.
        default: ["STANDARD", "EXTRA_TIME"]
        constraints: subset of STANDARD, EXTRA_TIME, LARGE_PRINT, BRAILLE, AUDIO
      - name: status
        type: enum
        source: system
        description: Session state (see state_machines.ExamSession).
        default: DRAFT
        constraints: one of DRAFT, SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED
      - name: cancel_reason
        type: string
        source: input
        description: Reason recorded on cancellation; null otherwise.
        default: null

  - name: ExamRegistration
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; the registered candidate.
      - name: exam_session_id
        type: string
        source: input
        description: FK -> ExamSession.id; the session seat consumed.
      - name: accommodation_request_id
        type: string
        source: input
        description: FK -> AccommodationRequest.id; approved accommodation applied to this sitting, null when standard.
        default: null
      - name: identity_verified_by_proctor_id
        type: string
        source: system
        description: FK -> Proctor.id; proctor who verified candidate identity, null until verification.
        default: null
      - name: registration_status
        type: enum
        source: system
        description: Seat/attempt axis (see state_machines.ExamRegistration registration_status).
        default: REGISTERED
        constraints: one of REGISTERED, CHECKED_IN, SCORED, CANCELLED, CANCELLED_BY_CENTER, RESULT_INVALIDATED
      - name: identity_status
        type: enum
        source: system
        description: Identity axis, independent of registration_status.
        default: UNVERIFIED
        constraints: one of UNVERIFIED, VERIFIED, ID_REJECTED
      - name: identity_document_type
        type: string
        source: input
        description: Document class presented at verification; null until verification.
        default: null
      - name: prior_scored_attempts
        type: integer
        source: computed
        description: Count of this student's earlier ExamRegistrations on the same subtest with registration_status in SCORED, RESULT_INVALIDATED, frozen at creation.
        default: 0
      - name: gross_fee_cents
        type: integer
        source: computed
        description: Retake-multiplied base fee (calculations.exam_fee_assessment step 3).
        default: 0
      - name: accommodation_surcharge_cents
        type: integer
        source: computed
        description: Alternate-format surcharge (calculations.exam_fee_assessment step 4).
        default: 0
      - name: discount_cents
        type: integer
        source: computed
        description: Attendance-tier discount (calculations.exam_fee_assessment step 6).
        default: 0
      - name: voucher_applied_cents
        type: integer
        source: computed
        description: Voucher cents consumed by this registration; returned on refund.
        default: 0
      - name: fee_due_cents
        type: integer
        source: computed
        description: Out-of-pocket remainder after voucher application.
        default: 0
      - name: scale_score
        type: integer
        source: input
        description: Subtest scale score recorded at result entry; null before.
        default: null
        constraints: 100..200
      - name: result_outcome
        type: enum
        source: computed
        description: PASSED when scale_score >= 145, else FAILED; null before result entry.
        default: null
        constraints: one of PASSED, FAILED or null
      - name: checked_in_at
        type: datetime
        source: system
        description: Logical-clock instant of check-in; null before.
        default: null
      - name: refunded_cents
        type: integer
        source: computed
        description: Voucher cents returned to the student by cancellation of this registration.
        default: 0

  - name: AccommodationRequest
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; requesting learner.
      - name: requested_format
        type: enum
        source: input
        description: Alternate testing format requested.
        constraints: one of EXTRA_TIME, LARGE_PRINT, BRAILLE, AUDIO
      - name: documentation_ref
        type: string
        source: input
        description: Reference to supporting documentation on file.
        constraints: non-empty
      - name: status
        type: enum
        source: system
        description: Review state (see state_machines.AccommodationRequest).
        default: SUBMITTED
        constraints: one of SUBMITTED, INFO_REQUESTED, APPROVED, DENIED, EXPIRED
      - name: info_request_rounds
        type: integer
        source: computed
        description: Number of information requests issued so far; hard cap 2.
        default: 0
        constraints: 0..2
      - name: granted_format
        type: enum
        source: input
        description: Format actually approved; may differ from requested_format. Null unless APPROVED.
        default: null
        constraints: one of EXTRA_TIME, LARGE_PRINT, BRAILLE, AUDIO or null
      - name: valid_until
        type: datetime
        source: input
        description: Instant the approval lapses (exclusive); null unless APPROVED.
        default: null
      - name: decision_note
        type: string
        source: input
        description: Reviewer note recorded on info request or decision.
        default: null

  - name: OutcomeRecord
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; learner the outcome is claimed for.
      - name: funding_period_id
        type: string
        source: input
        description: FK -> FundingPeriod.id; period the outcome is claimed against.
      - name: credential_issuance_id
        type: string
        source: input
        description: FK -> CredentialIssuance.id; required for measure_type CREDENTIAL_ATTAINMENT, null otherwise.
        default: null
      - name: measure_type
        type: enum
        source: input
        description: Outcome measure claimed.
        constraints: one of EFL_GAIN, CREDENTIAL_ATTAINMENT, EMPLOYMENT_Q2, POSTSECONDARY_ENROLLMENT
      - name: evidence_ref
        type: string
        source: input
        description: Reference to the evidence artifact on file.
        constraints: non-empty
      - name: status
        type: enum
        source: system
        description: Certification state (see state_machines.OutcomeRecord).
        default: RECORDED
        constraints: one of RECORDED, CERTIFIED, REJECTED, RESCINDED
      - name: recorded_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID that created the record.
      - name: certified_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID that certified the record; must differ from recorded_by_user_id.
        default: null
      - name: weight
        type: number
        source: computed
        description: Funding weight of measure_type (calculations.funding_allocation constants).
      - name: allocated_cents
        type: integer
        source: computed
        description: Cents committed to this outcome by the latest allocation run; 0 when unallocated, deferred or revoked.
        default: 0
      - name: allocation_status
        type: enum
        source: system
        description: Allocation posture of this outcome line.
        default: UNALLOCATED
        constraints: one of UNALLOCATED, COMMITTED, DEFERRED, REVOKED
      - name: rescission_reason
        type: string
        source: system
        description: Cascade reason recorded on rescission; null otherwise.
        default: null

  - name: CredentialIssuance
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; credential holder.
      - name: credential_type
        type: enum
        source: input
        description: Credential class issued.
        default: HSE_DIPLOMA
        constraints: one of HSE_DIPLOMA
      - name: composite_score
        type: integer
        source: computed
        description: Sum of the four best passing subtest scores (calculations.credential_eligibility).
      - name: subtest_scores
        type: object
        source: computed
        description: Map of subtest -> best passing scale_score used for issuance.
      - name: qualifying_registration_ids
        type: array
        source: computed
        description: ExamRegistration.id values (array of ids, not a single navigable FK) whose results support this credential; discoverable via GET /exam-registrations?student_id=.
      - name: status
        type: enum
        source: system
        description: Credential state (see state_machines.CredentialIssuance).
        default: ISSUED
        constraints: one of ISSUED, VOIDED
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of issuance.
      - name: void_reason
        type: string
        source: system
        description: Cascade reason recorded on void; null otherwise.
        default: null

  - name: TranscriptOrder
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; ordering learner, taken from the path on creation.
      - name: credential_issuance_id
        type: string
        source: input
        description: FK -> CredentialIssuance.id; credential whose transcript is ordered.
      - name: copies
        type: integer
        source: input
        description: Number of sealed copies ordered.
        constraints: 1..10
      - name: delivery
        type: enum
        source: input
        description: Delivery speed.
        constraints: one of STANDARD, RUSH
      - name: destination_type
        type: enum
        source: input
        description: Recipient class for state-records routing.
        constraints: one of SELF, EMPLOYER, POSTSECONDARY, STATE_RECORDS
      - name: base_charge_cents
        type: integer
        source: computed
        description: Copy fee plus rush fee (calculations.transcript_charge step 1).
      - name: waiver_cents
        type: integer
        source: computed
        description: Tiered waiver keyed on the pre-fee subtotal (calculations.transcript_charge step 2).
        default: 0
      - name: state_records_fee_cents
        type: integer
        source: computed
        description: Records-maintenance fee keyed on the post-waiver net (calculations.transcript_charge step 4).
        default: 0
      - name: total_charge_cents
        type: integer
        source: computed
        description: net + state_records_fee_cents (calculations.transcript_charge step 5).
      - name: status
        type: enum
        source: system
        description: Order state (see state_machines.TranscriptOrder).
        default: QUEUED
        constraints: one of QUEUED, FULFILLED, HELD
      - name: fulfilled_at
        type: datetime
        source: system
        description: Logical-clock instant of fulfilment; null otherwise.
        default: null
      - name: hold_reason
        type: string
        source: system
        description: Cascade reason recorded when the order is held; null otherwise.
        default: null

  - name: FundingPeriod
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: Program-year label.
        constraints: non-empty
      - name: start_date
        type: string
        source: input
        description: First UTC date in the outcome window (inclusive).
        constraints: ISO date
      - name: end_date
        type: string
        source: input
        description: First UTC date after the outcome window (exclusive).
        constraints: ISO date, > start_date
      - name: rate_cents_per_weight
        type: integer
        source: input
        description: Cents paid per unit of outcome weight.
        constraints: ">= 1"
      - name: total_cents
        type: integer
        source: input
        description: Total pool for the period.
        constraints: ">= 0"
      - name: committed_cents
        type: integer
        source: computed
        description: Cents committed to COMMITTED outcome lines.
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: total_cents - committed_cents; conserved across allocation and revocation.
        default: null
      - name: allocation_run_count
        type: integer
        source: computed
        description: Number of successful allocation runs on this period.
        default: 0
      - name: last_allocation_run_at
        type: datetime
        source: system
        description: Logical-clock instant of the latest allocation run; null before the first.
        default: null
      - name: last_allocation_variant
        type: enum
        source: input
        description: Variant used by the latest allocation run; null before the first.
        default: null
        constraints: one of PROVISIONAL, FINAL or null
      - name: status
        type: enum
        source: system
        description: Period state (see state_machines.FundingPeriod).
        default: OPEN
        constraints: one of OPEN, CLOSED

state_machines:
  - entity: Student
    initial_state: INTAKE_STARTED
    terminal_states: [EXITED]
    transitions:
      - from: INTAKE_STARTED
        to: ORIENTED
        trigger: "POST /students/{studentId}/orientation-completion"
        actor: Registrar
        preconditions: ["intake_status == INTAKE_STARTED"]
        side_effects:
          - "orientation_completed_at = logical clock now"
          - "increments Student.version by 1"
      - from: ORIENTED
        to: PLACED
        trigger: "system, on POST /test-events/{testEventId}/score when purpose == PRE_TEST and this is the student's earliest SCORED PRE_TEST ordered by test_date ASC, tie-break created_at ASC"
        actor: system
        preconditions: ["intake_status == ORIENTED", "TestEvent.purpose == PRE_TEST", "TestEvent.status becomes SCORED"]
        side_effects:
          - "placement_efl_level = TestEvent.efl_level (calculations.efl_placement_level)"
          - "increments Student.version by 1"
      - from: PLACED
        to: ENROLLED
        trigger: "system, on POST /enrollments success"
        actor: system
        preconditions: ["intake_status == PLACED", "active_enrollment_count becomes >= 1"]
        side_effects:
          - "active_enrollment_count += 1"
          - "increments Student.version by 1"
      - from: ENROLLED
        to: PLACED
        trigger: "system, on POST /enrollments/{enrollmentId}/withdraw or on the ClassSection CLOSED cascade, when active_enrollment_count reaches 0"
        actor: system
        preconditions: ["intake_status == ENROLLED", "active_enrollment_count becomes 0"]
        side_effects:
          - "active_enrollment_count = 0"
          - "increments Student.version by 1"
        note: "Cycle ENROLLED -> PLACED -> ENROLLED; a learner may re-enrol after withdrawing from every section."
      - from: ENROLLED
        to: EXITED
        trigger: "system, on POST /credentials success when active_enrollment_count == 0"
        actor: system
        preconditions: ["active_enrollment_count == 0", "CredentialIssuance created with status ISSUED"]
        side_effects:
          - "credential_status = ISSUED"
          - "increments Student.version by 1"
      - from: PLACED
        to: EXITED
        trigger: "system, on POST /credentials success when active_enrollment_count == 0"
        actor: system
        preconditions: ["active_enrollment_count == 0", "CredentialIssuance created with status ISSUED"]
        side_effects:
          - "credential_status = ISSUED"
          - "increments Student.version by 1"

  - entity: TestingCenter
    initial_state: APPLIED
    terminal_states: [SUSPENDED, WITHDRAWN]
    transitions:
      - from: APPLIED
        to: PROVISIONAL
        trigger: "POST /testing-centers/{centerId}/authorization-decision with decision == GRANT_PROVISIONAL"
        actor: StateAuthority
        preconditions: ["authorization_status == APPLIED"]
        side_effects:
          - "allowed_subtests = [MATH, RLA]"
          - "max_sessions_per_week = 2"
          - "authorized_at = logical clock now"
          - "increments TestingCenter.version by 1"
        note: "Branch A of the authorization fork; narrower subtest scope than GRANT_FULL."
      - from: APPLIED
        to: FULL_AUTHORIZED
        trigger: "POST /testing-centers/{centerId}/authorization-decision with decision == GRANT_FULL"
        actor: StateAuthority
        preconditions: ["authorization_status == APPLIED"]
        side_effects:
          - "allowed_subtests = [MATH, RLA, SCIENCE, SOCIAL_STUDIES]"
          - "max_sessions_per_week = 20"
          - "authorized_at = logical clock now"
          - "increments TestingCenter.version by 1"
        note: "Branch B of the same fork with a different side-effect set."
      - from: PROVISIONAL
        to: FULL_AUTHORIZED
        trigger: "POST /testing-centers/{centerId}/authorization-decision with decision == GRANT_FULL"
        actor: StateAuthority
        preconditions: ["authorization_status == PROVISIONAL"]
        side_effects:
          - "allowed_subtests = [MATH, RLA, SCIENCE, SOCIAL_STUDIES]"
          - "max_sessions_per_week = 20"
          - "authorized_at unchanged"
          - "increments TestingCenter.version by 1"
      - from: APPLIED
        to: WITHDRAWN
        trigger: "POST /testing-centers/{centerId}/authorization-decision with decision == WITHDRAW"
        actor: StateAuthority
        preconditions: ["authorization_status == APPLIED"]
        side_effects:
          - "allowed_subtests = []"
          - "increments TestingCenter.version by 1"
      - from: PROVISIONAL
        to: SUSPENDED
        trigger: "POST /testing-centers/{centerId}/suspend"
        actor: StateAuthority
        preconditions: ["authorization_status in {PROVISIONAL, FULL_AUTHORIZED}"]
        side_effects:
          - "suspended_reason = request suspended_reason; allowed_subtests = []; max_sessions_per_week = 0"
          - "CASCADE link 1: every TestingRoom of this center with status ACTIVE -> OUT_OF_SERVICE, ordered by created_at ASC"
          - "CASCADE link 2 (caused by link 1): every ExamSession in those rooms with status in {DRAFT, SCHEDULED} -> CANCELLED with cancel_reason CENTER_SUSPENDED, ordered by created_at ASC; Proctor.assigned_session_count decremented for the session's proctor"
          - "CASCADE link 3 (caused by link 2): every ExamRegistration on each cancelled session with registration_status == REGISTERED -> CANCELLED_BY_CENTER; refunded_cents = voucher_applied_cents; ExamSession.seats_taken decremented"
          - "CASCADE link 4 (caused by link 3): for each refunded registration, Student.voucher_balance_cents += refunded_cents, Student.voucher_spent_cents -= refunded_cents, Student.exam_fee_owed_cents -= fee_due_cents"
          - "increments version by 1 on every entity touched by links 1-4"
      - from: FULL_AUTHORIZED
        to: SUSPENDED
        trigger: "POST /testing-centers/{centerId}/suspend"
        actor: StateAuthority
        preconditions: ["authorization_status in {PROVISIONAL, FULL_AUTHORIZED}"]
        side_effects:
          - "identical cascade to the PROVISIONAL -> SUSPENDED transition (links 1-4)"

  - entity: TestingRoom
    initial_state: ACTIVE
    terminal_states: [OUT_OF_SERVICE]
    transitions:
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "POST /testing-rooms/{roomId}/out-of-service"
        actor: CenterAdministrator
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "status = OUT_OF_SERVICE; the room can no longer host NEW ExamSessions (validations priority 44)"
          - "already-created ExamSessions in this room are NOT cancelled and keep their own status"
          - "increments TestingRoom.version by 1"
        note: "Maintenance retirement of a room while its center stays authorized; a second call from OUT_OF_SERVICE is refused with ERR_ROOM_OUT_OF_SERVICE."
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "system, on the TestingCenter -> SUSPENDED cascade link 1"
        actor: system
        preconditions: ["status == ACTIVE", "owning TestingCenter moved to SUSPENDED"]
        side_effects:
          - "status = OUT_OF_SERVICE"
          - "increments TestingRoom.version by 1"

  - entity: Proctor
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /proctors/{proctorId}/certification-decision with decision == CERTIFY"
        actor: StateAuthority
        preconditions: ["certification_status == PENDING", "expires_at > logical clock now"]
        side_effects:
          - "certification_expires_at = request expires_at"
          - "increments Proctor.version by 1"
      - from: CERTIFIED
        to: LAPSED
        trigger: "system, lazily evaluated at POST /exam-sessions/{sessionId}/proctor-assignment and POST /exam-registrations/{registrationId}/check-in when logical clock now >= certification_expires_at"
        actor: system
        preconditions: ["certification_status == CERTIFIED", "logical clock now >= certification_expires_at"]
        side_effects:
          - "certification_status = LAPSED before the triggering request is rejected with ERR_PROCTOR_CERTIFICATION_LAPSED"
          - "increments Proctor.version by 1"
      - from: LAPSED
        to: CERTIFIED
        trigger: "POST /proctors/{proctorId}/certification-decision with decision == RENEW"
        actor: StateAuthority
        preconditions: ["certification_status == LAPSED", "expires_at > logical clock now"]
        side_effects:
          - "certification_expires_at = request expires_at"
          - "increments Proctor.version by 1"
        note: "Cycle CERTIFIED -> LAPSED -> CERTIFIED (renewal loop)."
      - from: CERTIFIED
        to: REVOKED
        trigger: "POST /proctors/{proctorId}/certification-decision with decision == REVOKE"
        actor: StateAuthority
        preconditions: ["certification_status in {PENDING, CERTIFIED, LAPSED}"]
        side_effects:
          - "certification_expires_at unchanged; assigned_session_count = 0"
          - "CASCADE link 1: every ExamSession with proctor_id == this proctor and status == SCHEDULED -> DRAFT with proctor_id = null, ordered by created_at ASC"
          - "CASCADE link 2a (caused by link 1): every ExamRegistration on those reverted sessions with identity_status == VERIFIED -> identity_status = UNVERIFIED and identity_verified_by_proctor_id = null"
          - "CASCADE link 2b: every ExamRegistration with identity_verified_by_proctor_id == this proctor and registration_status == SCORED -> RESULT_INVALIDATED, ordered by created_at ASC"
          - "CASCADE link 3 (caused by link 2b): every CredentialIssuance with status == ISSUED whose qualifying_registration_ids contains an invalidated registration -> VOIDED with void_reason PROCTOR_REVOKED; Student.credential_status = REVOKED"
          - "CASCADE link 4 (caused by link 3): every TranscriptOrder with status == QUEUED and credential_issuance_id == the voided credential -> HELD with hold_reason CREDENTIAL_VOIDED; every OutcomeRecord with credential_issuance_id == the voided credential and status in {RECORDED, CERTIFIED} -> RESCINDED with rescission_reason CREDENTIAL_VOIDED"
          - "CASCADE link 5 (caused by link 4): for each rescinded OutcomeRecord with allocation_status == COMMITTED, FundingPeriod.committed_cents -= allocated_cents, FundingPeriod.available_cents += allocated_cents, allocation_status = REVOKED, allocated_cents = 0"
          - "increments version by 1 on every entity touched by links 1-5"
      - from: LAPSED
        to: REVOKED
        trigger: "POST /proctors/{proctorId}/certification-decision with decision == REVOKE"
        actor: StateAuthority
        preconditions: ["certification_status in {PENDING, CERTIFIED, LAPSED}"]
        side_effects:
          - "identical cascade to the CERTIFIED -> REVOKED transition (links 1-5)"
      - from: PENDING
        to: REVOKED
        trigger: "POST /proctors/{proctorId}/certification-decision with decision == REVOKE"
        actor: StateAuthority
        preconditions: ["certification_status in {PENDING, CERTIFIED, LAPSED}"]
        side_effects:
          - "identical cascade to the CERTIFIED -> REVOKED transition (links 1-5); with no assignments the cascade is a no-op beyond the status change"

  - entity: ClassSection
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /class-sections/{sectionId}/status-transition with target_status == OPEN"
        actor: ProgramCoordinator
        preconditions: ["status == PLANNED"]
        side_effects: ["increments ClassSection.version by 1"]
      - from: OPEN
        to: IN_SESSION
        trigger: "POST /class-sections/{sectionId}/status-transition with target_status == IN_SESSION"
        actor: ProgramCoordinator
        preconditions: ["status == OPEN"]
        side_effects: ["increments ClassSection.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /class-sections/{sectionId}/status-transition with target_status == CLOSED"
        actor: ProgramCoordinator
        preconditions: ["status in {OPEN, IN_SESSION}"]
        side_effects:
          - "CASCADE link 1: every Enrollment on this section with status == ACTIVE, ordered by created_at ASC, transitions to COMPLETED when posted_hours >= 40.00 else to WITHDRAWN, exit_reason = SECTION_CLOSED, withdrawn_at = logical clock now for WITHDRAWN only; seats_taken decremented per enrollment"
          - "CASCADE link 2 (caused by link 1): Student.active_enrollment_count decremented per closed enrollment; when it reaches 0 and intake_status == ENROLLED the student transitions ENROLLED -> PLACED"
          - "increments version by 1 on every entity touched"
      - from: IN_SESSION
        to: CLOSED
        trigger: "POST /class-sections/{sectionId}/status-transition with target_status == CLOSED"
        actor: ProgramCoordinator
        preconditions: ["status in {OPEN, IN_SESSION}"]
        side_effects: ["identical cascade to the OPEN -> CLOSED transition (links 1-2)"]

  - entity: Enrollment
    initial_state: ACTIVE
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /enrollments/{enrollmentId}/withdraw"
        actor: ProgramCoordinator
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "withdrawn_at = logical clock now; exit_reason = request reason"
          - "ClassSection.seats_taken -= 1 (seats_available recomputed)"
          - "Student.active_enrollment_count -= 1; when it reaches 0 and intake_status == ENROLLED the student transitions ENROLLED -> PLACED"
          - "increments version by 1 on Enrollment, ClassSection and Student"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system, on the ClassSection OPEN|IN_SESSION -> CLOSED cascade when posted_hours >= 40.00"
        actor: system
        preconditions: ["status == ACTIVE", "posted_hours >= 40.00"]
        side_effects:
          - "exit_reason = SECTION_CLOSED"
          - "ClassSection.seats_taken -= 1; Student.active_enrollment_count -= 1"
          - "increments version by 1 on Enrollment, ClassSection and Student"
        note: "Conditional cascade: the same parent transition sends under-attended enrollments to WITHDRAWN instead."

  - entity: AttendanceEntry
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /attendance-entries/{entryId}/void"
        actor: ProgramCoordinator
        preconditions:
          - "status == POSTED"
          - "expected_enrollment_version == Enrollment.version"
          - "Enrollment.status == ACTIVE"
        side_effects:
          - "void_reason = request void_reason"
          - "CASCADE link 1: Enrollment.posted_hours -= hours; Enrollment.post_test_eligible recomputed (calculations.post_test_eligibility); Student.total_instructional_hours -= hours"
          - "CASCADE link 2 (caused by link 1, only when Enrollment.posted_hours drops below 40.00): every TestEvent with this enrollment_id, purpose == POST_TEST and status in {SCHEDULED, SCORED} -> INVALIDATED with invalidation_reason HOURS_WITHDRAWN, ordered by created_at ASC"
          - "CASCADE link 3 (caused by link 2): every OutcomeRecord for this student with measure_type == EFL_GAIN and status in {RECORDED, CERTIFIED} whose measurable skill gain is no longer supported under the FINAL variant of calculations.msg_determination -> RESCINDED with rescission_reason POST_TEST_INVALIDATED"
          - "CASCADE link 4 (caused by link 3): for each rescinded OutcomeRecord with allocation_status == COMMITTED, FundingPeriod.committed_cents -= allocated_cents, FundingPeriod.available_cents += allocated_cents, allocation_status = REVOKED, allocated_cents = 0"
          - "increments version by 1 on every entity touched by links 1-4"

  - entity: TestEvent
    initial_state: SCHEDULED
    terminal_states: [INVALIDATED]
    transitions:
      - from: SCHEDULED
        to: SCORED
        trigger: "POST /test-events/{testEventId}/score"
        actor: Instructor
        preconditions: ["status == SCHEDULED"]
        side_effects:
          - "test_date = logical clock now; efl_level = calculations.efl_placement_level(test_form, scale_score)"
          - "when purpose == PRE_TEST and this is the student's earliest SCORED PRE_TEST: Student.placement_efl_level = efl_level and Student ORIENTED -> PLACED"
          - "increments TestEvent.version by 1 (and Student.version by 1 when placement is written)"
      - from: SCORED
        to: INVALIDATED
        trigger: "system, on the AttendanceEntry POSTED -> VOIDED cascade link 2"
        actor: system
        preconditions: ["status == SCORED", "purpose == POST_TEST", "Enrollment.posted_hours dropped below 40.00"]
        side_effects:
          - "invalidation_reason = HOURS_WITHDRAWN; efl_level and scale_score retained for audit"
          - "increments TestEvent.version by 1"
      - from: SCHEDULED
        to: INVALIDATED
        trigger: "system, on the AttendanceEntry POSTED -> VOIDED cascade link 2"
        actor: system
        preconditions: ["status == SCHEDULED", "purpose == POST_TEST", "Enrollment.posted_hours dropped below 40.00"]
        side_effects:
          - "invalidation_reason = HOURS_WITHDRAWN"
          - "increments TestEvent.version by 1"

  - entity: ExamSession
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /exam-sessions/{sessionId}/proctor-assignment"
        actor: CenterAdministrator
        preconditions:
          - "status == DRAFT"
          - "Proctor.certification_status == CERTIFIED after lazy lapse evaluation"
          - "Proctor.testing_center_id == the room's testing_center_id"
          - "no proctor interval overlap (validations priority 82) and daily cap satisfied (priority 83)"
        side_effects:
          - "proctor_id = request proctor_id; Proctor.assigned_session_count += 1"
          - "increments ExamSession.version by 1 and Proctor.version by 1"
      - from: SCHEDULED
        to: DRAFT
        trigger: "system, on the Proctor -> REVOKED cascade link 1"
        actor: system
        preconditions: ["status == SCHEDULED", "proctor_id == the revoked proctor"]
        side_effects:
          - "proctor_id = null"
          - "identity_status of REGISTERED registrations on this session reset to UNVERIFIED (cascade link 2a)"
          - "increments ExamSession.version by 1"
        note: "Cycle DRAFT -> SCHEDULED -> DRAFT; the session can be re-assigned to another certified proctor."
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system, on the first POST /exam-registrations/{registrationId}/check-in for this session"
        actor: system
        preconditions: ["status == SCHEDULED"]
        side_effects: ["increments ExamSession.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system, on POST /exam-registrations/{registrationId}/result when no registration on this session remains in CHECKED_IN"
        actor: system
        preconditions: ["status == IN_PROGRESS", "count of registrations with registration_status == CHECKED_IN becomes 0"]
        side_effects: ["increments ExamSession.version by 1"]
        note: "Compound: session completion is derived from the aggregate state of its registrations."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /exam-sessions/{sessionId}/cancel, or system on the TestingCenter -> SUSPENDED cascade link 2"
        actor: CenterAdministrator
        preconditions: ["status in {DRAFT, SCHEDULED}"]
        side_effects:
          - "cancel_reason set; Proctor.assigned_session_count decremented when proctor_id is not null"
          - "every ExamRegistration with registration_status == REGISTERED -> CANCELLED_BY_CENTER with refunded_cents = voucher_applied_cents; seats_taken decremented"
          - "for each refunded registration: Student.voucher_balance_cents += refunded_cents, Student.voucher_spent_cents -= refunded_cents, Student.exam_fee_owed_cents -= fee_due_cents"
          - "increments version by 1 on every entity touched"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /exam-sessions/{sessionId}/cancel, or system on the TestingCenter -> SUSPENDED cascade link 2"
        actor: CenterAdministrator
        preconditions: ["status in {DRAFT, SCHEDULED}"]
        side_effects: ["identical to the DRAFT -> CANCELLED transition"]

  - entity: ExamRegistration
    initial_state: REGISTERED
    terminal_states: [CANCELLED, CANCELLED_BY_CENTER, RESULT_INVALIDATED]
    note: "Parallel dimensions: registration_status (below) evolves independently of identity_status (second block). Both axes live on the same row."
    transitions:
      - from: REGISTERED
        to: CHECKED_IN
        trigger: "POST /exam-registrations/{registrationId}/check-in"
        actor: Proctor
        preconditions:
          - "registration_status == REGISTERED"
          - "identity_status == VERIFIED (cross-axis gate)"
          - "ExamSession.status in {SCHEDULED, IN_PROGRESS}"
          - "acting Proctor id == ExamSession.proctor_id"
          - "Proctor.certification_status == CERTIFIED after lazy lapse evaluation"
          - "logical clock now within [ExamSession.starts_at - 60 minutes, ExamSession.ends_at)"
        side_effects:
          - "checked_in_at = logical clock now"
          - "ExamSession SCHEDULED -> IN_PROGRESS on the first check-in"
          - "increments ExamRegistration.version by 1 and ExamSession.version by 1"
      - from: CHECKED_IN
        to: SCORED
        trigger: "POST /exam-registrations/{registrationId}/result"
        actor: Proctor
        preconditions: ["registration_status == CHECKED_IN", "acting Proctor id == ExamSession.proctor_id"]
        side_effects:
          - "scale_score = request scale_score; result_outcome = PASSED when scale_score >= 145 else FAILED"
          - "ExamSession IN_PROGRESS -> COMPLETED when no CHECKED_IN registration remains"
          - "increments ExamRegistration.version by 1"
      - from: SCORED
        to: RESULT_INVALIDATED
        trigger: "system, on the Proctor -> REVOKED cascade link 2b"
        actor: system
        preconditions: ["registration_status == SCORED", "identity_verified_by_proctor_id == the revoked proctor"]
        side_effects:
          - "result_outcome retained for audit; credential cascade links 3-5 follow"
          - "increments ExamRegistration.version by 1"
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /exam-registrations/{registrationId}/cancel"
        actor: Registrar
        preconditions: ["registration_status == REGISTERED"]
        side_effects:
          - "refunded_cents = voucher_applied_cents; ExamSession.seats_taken -= 1"
          - "Student.voucher_balance_cents += refunded_cents; Student.voucher_spent_cents -= refunded_cents; Student.exam_fee_owed_cents -= fee_due_cents"
          - "increments version by 1 on ExamRegistration, ExamSession and Student"
      - from: REGISTERED
        to: CANCELLED_BY_CENTER
        trigger: "system, on ExamSession -> CANCELLED (manual cancel or TestingCenter suspension cascade link 3)"
        actor: system
        preconditions: ["registration_status == REGISTERED"]
        side_effects:
          - "refunded_cents = voucher_applied_cents; ExamSession.seats_taken -= 1"
          - "Student.voucher_balance_cents += refunded_cents; Student.voucher_spent_cents -= refunded_cents; Student.exam_fee_owed_cents -= fee_due_cents"
          - "increments version by 1 on ExamRegistration and Student"

  - entity: ExamRegistration
    state_field: identity_status
    initial_state: UNVERIFIED
    terminal_states: []
    note: "Second, independent axis on the same ExamRegistration row (parallel state dimensions)."
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /exam-registrations/{registrationId}/identity-verification with decision == VERIFIED"
        actor: Proctor
        preconditions:
          - "identity_status in {UNVERIFIED, ID_REJECTED}"
          - "registration_status == REGISTERED"
          - "acting Proctor id == ExamSession.proctor_id"
        side_effects:
          - "identity_document_type = request identity_document_type; identity_verified_by_proctor_id = acting proctor id"
          - "increments ExamRegistration.version by 1"
      - from: UNVERIFIED
        to: ID_REJECTED
        trigger: "POST /exam-registrations/{registrationId}/identity-verification with decision == REJECTED"
        actor: Proctor
        preconditions: ["identity_status in {UNVERIFIED, ID_REJECTED}", "registration_status == REGISTERED", "acting Proctor id == ExamSession.proctor_id"]
        side_effects:
          - "identity_document_type = request identity_document_type; identity_verified_by_proctor_id stays null"
          - "increments ExamRegistration.version by 1"
      - from: ID_REJECTED
        to: VERIFIED
        trigger: "POST /exam-registrations/{registrationId}/identity-verification with decision == VERIFIED (second document presented)"
        actor: Proctor
        preconditions: ["identity_status == ID_REJECTED", "registration_status == REGISTERED", "acting Proctor id == ExamSession.proctor_id"]
        side_effects:
          - "identity_document_type = request identity_document_type; identity_verified_by_proctor_id = acting proctor id"
          - "increments ExamRegistration.version by 1"
      - from: VERIFIED
        to: UNVERIFIED
        trigger: "system, on the Proctor -> REVOKED cascade link 2a"
        actor: system
        preconditions: ["identity_status == VERIFIED", "the session hosting this registration reverted SCHEDULED -> DRAFT"]
        side_effects:
          - "identity_verified_by_proctor_id = null; identity_document_type retained"
          - "increments ExamRegistration.version by 1"

  - entity: AccommodationRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /accommodation-requests/{requestId}/info-request"
        actor: CenterAdministrator
        preconditions: ["status == SUBMITTED", "info_request_rounds < 2"]
        side_effects:
          - "info_request_rounds += 1; decision_note = request note"
          - "increments AccommodationRequest.version by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /accommodation-requests/{requestId}/resubmission"
        actor: Registrar
        preconditions: ["status == INFO_REQUESTED"]
        side_effects:
          - "documentation_ref = request documentation_ref"
          - "increments AccommodationRequest.version by 1"
        note: "Cycle SUBMITTED -> INFO_REQUESTED -> SUBMITTED, capped at 2 rounds by the info-request precondition."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /accommodation-requests/{requestId}/decision with decision == APPROVE"
        actor: CenterAdministrator
        preconditions: ["status == SUBMITTED", "granted_format present", "valid_until > logical clock now"]
        side_effects:
          - "granted_format and valid_until written from the request; decision_note recorded"
          - "increments AccommodationRequest.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /accommodation-requests/{requestId}/decision with decision == DENY"
        actor: CenterAdministrator
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "decision_note recorded; granted_format stays null"
          - "increments AccommodationRequest.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system, lazily evaluated at POST /exam-registrations when logical clock now >= valid_until"
        actor: system
        preconditions: ["status == APPROVED", "logical clock now >= valid_until"]
        side_effects:
          - "status = EXPIRED before the triggering registration is rejected with ERR_ACCOMMODATION_EXPIRED"
          - "increments AccommodationRequest.version by 1"

  - entity: OutcomeRecord
    initial_state: RECORDED
    terminal_states: [REJECTED, RESCINDED]
    transitions:
      - from: RECORDED
        to: CERTIFIED
        trigger: "POST /outcome-records/{outcomeId}/certification with decision == CERTIFY"
        actor: StateAuthority
        preconditions:
          - "status == RECORDED"
          - "FundingPeriod.status == OPEN"
          - "acting X-User-ID != recorded_by_user_id (segregation of duties)"
          - "for measure_type == EFL_GAIN: calculations.msg_determination FINAL variant reports msg_achieved == true"
          - "for measure_type == CREDENTIAL_ATTAINMENT: linked CredentialIssuance.status == ISSUED"
        side_effects:
          - "certified_by_user_id = acting X-User-ID"
          - "increments OutcomeRecord.version by 1"
      - from: RECORDED
        to: REJECTED
        trigger: "POST /outcome-records/{outcomeId}/certification with decision == REJECT"
        actor: StateAuthority
        preconditions: ["status == RECORDED", "FundingPeriod.status == OPEN", "acting X-User-ID != recorded_by_user_id"]
        side_effects:
          - "certified_by_user_id = acting X-User-ID"
          - "increments OutcomeRecord.version by 1"
      - from: CERTIFIED
        to: RESCINDED
        trigger: "system, on AttendanceEntry void cascade link 3 or Proctor revocation cascade link 4"
        actor: system
        preconditions: ["status in {RECORDED, CERTIFIED}", "supporting evidence withdrawn"]
        side_effects:
          - "rescission_reason set (POST_TEST_INVALIDATED or CREDENTIAL_VOIDED)"
          - "when allocation_status == COMMITTED: FundingPeriod.committed_cents -= allocated_cents, FundingPeriod.available_cents += allocated_cents, allocation_status = REVOKED, allocated_cents = 0"
          - "increments version by 1 on OutcomeRecord and FundingPeriod"
      - from: RECORDED
        to: RESCINDED
        trigger: "system, on AttendanceEntry void cascade link 3 or Proctor revocation cascade link 4"
        actor: system
        preconditions: ["status in {RECORDED, CERTIFIED}", "supporting evidence withdrawn"]
        side_effects:
          - "rescission_reason set; allocation_status unchanged when UNALLOCATED or DEFERRED"
          - "increments OutcomeRecord.version by 1"

  - entity: CredentialIssuance
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "system, on the Proctor -> REVOKED cascade link 3"
        actor: system
        preconditions: ["status == ISSUED", "a qualifying ExamRegistration moved to RESULT_INVALIDATED"]
        side_effects:
          - "void_reason = PROCTOR_REVOKED; Student.credential_status = REVOKED"
          - "QUEUED TranscriptOrders for this credential -> HELD (cascade link 4)"
          - "OutcomeRecords linked to this credential -> RESCINDED (cascade link 4), with funding revocation in link 5"
          - "increments version by 1 on every entity touched"

  - entity: TranscriptOrder
    initial_state: QUEUED
    terminal_states: [FULFILLED, HELD]
    transitions:
      - from: QUEUED
        to: FULFILLED
        trigger: "POST /transcript-orders/{orderId}/fulfillment"
        actor: Registrar
        preconditions: ["status == QUEUED", "CredentialIssuance.status == ISSUED"]
        side_effects:
          - "fulfilled_at = logical clock now"
          - "increments TranscriptOrder.version by 1"
      - from: QUEUED
        to: HELD
        trigger: "system, on the CredentialIssuance ISSUED -> VOIDED cascade link 4"
        actor: system
        preconditions: ["status == QUEUED", "linked credential moved to VOIDED"]
        side_effects:
          - "hold_reason = CREDENTIAL_VOIDED"
          - "increments TranscriptOrder.version by 1"

  - entity: FundingPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /funding-periods/{periodId}/allocation-run"
        actor: StateAuthority
        preconditions:
          - "status == OPEN"
          - "expected_funding_period_version == version"
        side_effects:
          - "calculations.funding_allocation runs over the qualifying outcome set for the requested variant"
          - "each selected OutcomeRecord: allocated_cents = its line amount, allocation_status = COMMITTED; each outcome the pool cannot cover: allocation_status = DEFERRED, allocated_cents = 0"
          - "committed_cents += sum of committed line amounts; available_cents = total_cents - committed_cents"
          - "allocation_run_count += 1; last_allocation_run_at = logical clock now; last_allocation_variant = requested variant"
          - "increments FundingPeriod.version by 1 and each touched OutcomeRecord.version by 1"
        note: "Self-transition: a later run legitimately supersedes the previous view of the pool, which is why the OCC guard in concurrency_rules is required."
      - from: OPEN
        to: CLOSED
        trigger: "POST /funding-periods/{periodId}/close"
        actor: StateAuthority
        preconditions: ["status == OPEN"]
        side_effects:
          - "every OutcomeRecord on this period with allocation_status == DEFERRED stays DEFERRED and can no longer be allocated"
          - "increments FundingPeriod.version by 1"

concurrency_rules:
  - rule_id: registration-create-stale-session
    parent_entity: ExamSession
    write_endpoint: "POST /exam-registrations"
    occ_field: "expected_exam_session_version"
    description: |
      Creating an ExamRegistration against an ExamSession whose version has
      advanced since the client last observed it is rejected. The stale view
      may have been produced by another registrar consuming a seat, by a
      proctor re-assignment, or by the session moving to IN_PROGRESS; in each
      case the seat arithmetic the client reasoned about no longer holds.
    error_id: ERR_STALE_EXAM_SESSION_VERSION
    http_status: 412
  - rule_id: attendance-void-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /attendance-entries/{entryId}/void"
    occ_field: "expected_enrollment_version"
    description: |
      Voiding an AttendanceEntry against an Enrollment whose version has
      advanced since the client last observed it is rejected. Because the void
      cascade decides post-test invalidation from posted_hours, a stale view of
      the enrollment would decide the 40.00-hour threshold crossing from hours
      that no longer reflect the ledger.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412
  - rule_id: allocation-run-stale-period
    parent_entity: FundingPeriod
    write_endpoint: "POST /funding-periods/{periodId}/allocation-run"
    occ_field: "expected_funding_period_version"
    description: |
      Running allocation against a FundingPeriod whose version has advanced
      since the client last observed it is rejected. A later run legitimately
      supersedes the earlier committed view of the pool, so an operator working
      from a stale available_cents figure must re-read before committing.
    error_id: ERR_STALE_FUNDING_PERIOD_VERSION
    http_status: 412

calculations:
  - name: efl_placement_level
    trigger: "POST /test-events/{testEventId}/score (writes TestEvent.efl_level; also writes Student.placement_efl_level when the scored event is the student's earliest SCORED PRE_TEST)"
    algorithm: threshold
    formula: |
      bands = EFL_BANDS[test_form]           # ascending list of (level, lower_bound)
      efl_level = max(level for (level, lower_bound) in bands if scale_score >= lower_bound)
      # lower_bound comparison is inclusive (>=). A score exactly on a band floor
      # takes the HIGHER level.
    input_set: "The single TestEvent being scored; no aggregation."
    constants:
      EFL_BANDS_CASAS_R_900: { 1: 0, 2: 201, 3: 211, 4: 221, 5: 236, 6: 246 }
      EFL_BANDS_CASAS_M_900: { 1: 0, 2: 194, 3: 203, 4: 214, 5: 227, 6: 236 }
      EFL_BANDS_BEST_PLUS: { 1: 0, 2: 401, 3: 418, 4: 439, 5: 473, 6: 507 }
    precision: "integer level 1..6; no rounding"

  - name: instructional_hour_ledger
    trigger: "POST /enrollments/{enrollmentId}/attendance-entries and POST /attendance-entries/{entryId}/void (both list Enrollment.posted_hours and Student.total_instructional_hours in their side effects)"
    algorithm: aggregation
    formula: |
      Enrollment.posted_hours =
        sum(AttendanceEntry.hours
            for entries where enrollment_id == this enrollment
            and status == POSTED)                       # VOIDED entries excluded
      Student.total_instructional_hours =
        sum(Enrollment.posted_hours
            for enrollments where student_id == this student
            and status in {ACTIVE, COMPLETED, WITHDRAWN})  # every enrollment state counts
    input_set: "AttendanceEntry rows with status == POSTED only; the void transition removes the voided row's hours from both aggregates."
    constants:
      HOURS_INCREMENT: 0.25
    precision: "2 decimal places, round_half_up; sums are exact multiples of 0.25 so no residue accumulates"
    note: "Order-insensitive sum; no tie-break needed. Conserved quantity for compensating_invariant: posted_hours must always equal the POSTED-row sum."

  - name: post_test_eligibility
    trigger: "recomputed as a side effect of every Enrollment.posted_hours change (attendance post and attendance void); enforced at POST /test-events when purpose == POST_TEST"
    algorithm: threshold
    formula: |
      hours_ok = Enrollment.posted_hours >= MIN_POST_TEST_HOURS          # inclusive
      pre_test = the student's earliest SCORED PRE_TEST ordered by test_date ASC, tie-break created_at ASC
      interval_ok = pre_test is not null and
                    (clock_now - pre_test.test_date) >= MIN_POST_TEST_DAY_INTERVAL days   # inclusive
      Enrollment.post_test_eligible = hours_ok        # the stored flag tracks the hour gate only
      POST /test-events acceptance for POST_TEST = hours_ok AND interval_ok
    input_set: "Enrollment.posted_hours (POSTED entries only) plus the student's earliest SCORED PRE_TEST."
    constants:
      MIN_POST_TEST_HOURS: 40.00
      MIN_POST_TEST_DAY_INTERVAL: 30
    precision: "hours compared at 2 decimal places; the day interval is computed as whole UTC days between test_date and clock_now, floor"

  - name: msg_determination
    trigger: "GET /students/{studentId}/skill-gain; enforced at POST /outcome-records/{outcomeId}/certification for measure_type == EFL_GAIN; re-evaluated by the AttendanceEntry void cascade (link 3)"
    algorithm: forward_looking
    formula: |
      window = [FundingPeriod.start_date, FundingPeriod.end_date)     # half-open, inclusive start
      pre  = the student's TestEvent with purpose == PRE_TEST, status == SCORED,
             test_date inside window, ordered by test_date ASC, tie-break created_at ASC -> first
      posts = the student's TestEvents with purpose == POST_TEST, status == SCORED,
              test_date inside window                                  # INVALIDATED excluded
      if pre is null or posts is empty: msg_achieved = false, post = null
      BEST_POST  variant: post = posts ordered by (efl_level DESC, test_date ASC, created_at ASC) -> first
      LATEST_POST variant: post = posts ordered by (test_date DESC, created_at DESC) -> first
      msg_achieved = post.efl_level > pre.efl_level
    input_set: "SCORED TestEvents of one student whose test_date falls in the funding period window; INVALIDATED and SCHEDULED events are excluded."
    constants:
      DEFAULT_PREVIEW_VARIANT: BEST_POST
      CERTIFICATION_VARIANT: LATEST_POST
    precision: "integer EFL level comparison; strict > required for a gain"
    variants:
      - name: BEST_POST
        when: "GET /students/{studentId}/skill-gain default and variant=BEST_POST; the provisional/programmatic view"
        difference: "Selects the highest-scoring post-test in the window, so a later regression is ignored and msg_achieved can be true."
      - name: LATEST_POST
        when: "POST /outcome-records/{outcomeId}/certification for EFL_GAIN, and the AttendanceEntry void cascade re-evaluation; the audited final view"
        difference: "Selects the chronologically last post-test in the window, so a later regression governs and msg_achieved can be false on the same data."

  - name: exam_fee_assessment
    trigger: "POST /exam-registrations (writes gross_fee_cents, accommodation_surcharge_cents, discount_cents, voucher_applied_cents, fee_due_cents)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned; steps must run exactly in this sequence.
      step1: base = SUBTEST_FEE_CENTS[ExamSession.subtest]
      step2: multiplier = RETAKE_BASE ** min(prior_scored_attempts, RETAKE_EXPONENT_CAP)
      step3: gross_fee_cents = round_half_up(base * multiplier)
      step4: accommodation_surcharge_cents =
               ALT_FORMAT_SURCHARGE_CENTS if (accommodation_request_id is not null and
                 AccommodationRequest.granted_format in {LARGE_PRINT, BRAILLE, AUDIO}) else 0
      step5: billable = gross_fee_cents + accommodation_surcharge_cents
      step6: tier_pct = 0  if Student.total_instructional_hours < 12.00
                        25 if 12.00 <= hours < 40.00
                        50 if 40.00 <= hours < 100.00
                        75 if hours >= 100.00
             discount_cents = floor(billable * tier_pct / 100)          # floor, never round
      step7: net = billable - discount_cents
      step8: voucher_applied_cents = min(net, Student.voucher_balance_cents)
      step9: fee_due_cents = net - voucher_applied_cents
      # ledger writes: Student.voucher_balance_cents -= voucher_applied_cents,
      # Student.voucher_spent_cents += voucher_applied_cents,
      # Student.exam_fee_owed_cents += fee_due_cents
    input_set: "One ExamSession (subtest), the registering Student's total_instructional_hours and voucher_balance_cents at request time, prior_scored_attempts counted over the student's earlier ExamRegistrations on the SAME subtest with registration_status in {SCORED, RESULT_INVALIDATED}, and the linked AccommodationRequest.granted_format when present."
    constants:
      SUBTEST_FEE_CENTS: { MATH: 3000, RLA: 3400, SCIENCE: 3000, SOCIAL_STUDIES: 3000 }
      ALT_FORMAT_SURCHARGE_CENTS: 1200
      RETAKE_BASE: 1.25
      RETAKE_EXPONENT_CAP: 2
      TIER_BREAKPOINT_HOURS: [12.00, 40.00, 100.00]
    precision: "integer cents; step3 round_half_up, step6 floor. No other rounding is permitted."

  - name: funding_allocation
    trigger: "POST /funding-periods/{periodId}/allocation-run (writes OutcomeRecord.allocated_cents / allocation_status and FundingPeriod.committed_cents / available_cents); previewed by GET /funding-periods/{periodId}/allocation-preview"
    algorithm: waterfall_allocation
    formula: |
      candidates =
        OutcomeRecords where funding_period_id == period.id
        and allocation_status == UNALLOCATED
        and status in STATUS_FILTER[variant]
        ordered by created_at ASC                        # allocation order, never by id
      # PINNED ROUNDING ORDER: round each line, then sum. The alternative
      # (sum the weights, multiply, then round once) is explicitly rejected.
      for each candidate in order:
        line_cents = round_half_up(period.rate_cents_per_weight * MEASURE_WEIGHT[measure_type])
        if line_cents <= period.available_cents_running:
          allocated_cents = line_cents; allocation_status = COMMITTED
          period.available_cents_running -= line_cents
        else:
          allocated_cents = 0; allocation_status = DEFERRED      # no partial allocation
      committed_delta = sum(line_cents of COMMITTED lines)        # sum AFTER per-line rounding
      period.committed_cents += committed_delta
      period.available_cents  = period.total_cents - period.committed_cents
    input_set: "OutcomeRecords of the period with allocation_status == UNALLOCATED; STATUS_FILTER picks which review states qualify. RESCINDED, REJECTED, COMMITTED, DEFERRED and REVOKED rows never re-enter a run."
    constants:
      MEASURE_WEIGHT: { EFL_GAIN: 1.00, CREDENTIAL_ATTAINMENT: 1.50, EMPLOYMENT_Q2: 1.25, POSTSECONDARY_ENROLLMENT: 1.40 }
      STATUS_FILTER_PROVISIONAL: [RECORDED, CERTIFIED]
      STATUS_FILTER_FINAL: [CERTIFIED]
      DEFAULT_VARIANT: FINAL
    precision: "integer cents; round_half_up per line, then exact integer sum. Sum-then-round is a defect."
    variants:
      - name: PROVISIONAL
        when: "allocation-run or allocation-preview with variant=PROVISIONAL; mid-year forecast"
        difference: "Includes RECORDED (not yet certified) outcomes, so committed_cents can exceed the FINAL figure on identical data."
      - name: FINAL
        when: "allocation-run or allocation-preview default and variant=FINAL; period-close settlement"
        difference: "Counts only CERTIFIED outcomes, so RECORDED rows contribute nothing."

  - name: transcript_charge
    trigger: "POST /students/{studentId}/transcript-orders (writes base_charge_cents, waiver_cents, state_records_fee_cents, total_charge_cents)"
    algorithm: constraint_propagation
    formula: |
      # The waiver tier is keyed on the order total, and the order total includes a
      # state-records fee that is itself keyed on the post-waiver total. The loop is
      # broken by pinning this evaluation order; no other order is permitted.
      step1: base_charge_cents = COPY_FEE_CENTS * copies + (RUSH_FEE_CENTS if delivery == RUSH else 0)
      step2: waiver_pct = 0  if base_charge_cents < 3000
                          10 if 3000 <= base_charge_cents < 6000
                          20 if base_charge_cents >= 6000
             waiver_cents = floor(base_charge_cents * waiver_pct / 100)
      step3: net = base_charge_cents - waiver_cents
      step4: state_records_fee_cents = 0   if net == 0
                                      200 if 0 < net < 3000
                                      500 if net >= 3000
      step5: total_charge_cents = net + state_records_fee_cents
      # The state-records fee NEVER re-enters the step2 tier decision.
    input_set: "One TranscriptOrder request: copies and delivery only. destination_type does not affect the charge."
    constants:
      COPY_FEE_CENTS: 1500
      RUSH_FEE_CENTS: 2500
      WAIVER_BREAKPOINTS_CENTS: [3000, 6000]
      STATE_RECORDS_FEE_BREAKPOINT_CENTS: 3000
    precision: "integer cents; step2 floor. Tier comparisons are >= on the lower bound."

  - name: credential_eligibility
    trigger: "POST /credentials (writes composite_score, subtest_scores, qualifying_registration_ids); recomputed as the gate that rejects issuance with ERR_CREDENTIAL_REQUIREMENTS_NOT_MET"
    algorithm: aggregation
    formula: |
      for each subtest in REQUIRED_SUBTESTS:
        pool = the student's ExamRegistrations where ExamSession.subtest == subtest
               and registration_status == SCORED                    # RESULT_INVALIDATED excluded
        best = pool ordered by (scale_score DESC, created_at ASC) -> first
        subtest_scores[subtest] = best.scale_score if best is not null else null
      all_passed = every subtest has a score and every score >= PASS_SCORE_PER_SUBTEST
      composite_score = sum(subtest_scores.values()) when all_passed else null
      eligible = all_passed and composite_score >= COMPOSITE_MIN     # inclusive
      qualifying_registration_ids = the four selected registration ids ordered by subtest
                                    in REQUIRED_SUBTESTS order
    input_set: "ExamRegistrations of one student with registration_status == SCORED, grouped by the session's subtest; four distinct subtests required."
    constants:
      REQUIRED_SUBTESTS: [MATH, RLA, SCIENCE, SOCIAL_STUDIES]
      PASS_SCORE_PER_SUBTEST: 145
      COMPOSITE_MIN: 580
    precision: "integer scores; both gates inclusive (>=)"

  - name: proctor_daily_load
    trigger: "POST /exam-sessions/{sessionId}/proctor-assignment (gate for ERR_PROCTOR_DAILY_CAP_EXCEEDED)"
    algorithm: aggregation
    formula: |
      target_date = UTC calendar date of the candidate session's starts_at
      existing = sum(ExamSession.duration_hours
                     for sessions where proctor_id == candidate proctor
                     and status in {SCHEDULED, IN_PROGRESS, COMPLETED}
                     and UTC date of starts_at == target_date)
      projected = existing + candidate.duration_hours
      reject when projected > Proctor.daily_hour_cap        # exactly at the cap is allowed
    input_set: "ExamSessions of one proctor on one UTC calendar date with status in {SCHEDULED, IN_PROGRESS, COMPLETED}; DRAFT and CANCELLED sessions are excluded."
    constants:
      DEFAULT_DAILY_HOUR_CAP: 8.00
    precision: "hours at 2 decimal places, round_half_up on duration_hours; comparison is strict > for rejection"

  - name: room_occupation_conflict
    trigger: "POST /exam-sessions (gate for ERR_ROOM_BUFFER_CONFLICT)"
    algorithm: interval_merge
    formula: |
      buffer = TestingRoom.turnaround_buffer_minutes
      occupied = ExamSessions where testing_room_id == this room
                 and status in {DRAFT, SCHEDULED, IN_PROGRESS, COMPLETED}   # CANCELLED excluded
      conflict = any(existing) where
        candidate.starts_at < existing.ends_at + buffer AND
        existing.starts_at  < candidate.ends_at + buffer
      # Both intervals are inflated by the buffer on their trailing edge, so a gap
      # of EXACTLY buffer minutes is accepted and a gap of buffer-1 minutes is not.
    input_set: "Non-cancelled ExamSessions in the same TestingRoom."
    constants:
      DEFAULT_TURNAROUND_BUFFER_MINUTES: 45
    precision: "minute resolution; comparisons strict (<) so touching buffered edges do not conflict"

  - name: proctor_interval_conflict
    trigger: "POST /exam-sessions/{sessionId}/proctor-assignment (gate for ERR_PROCTOR_TIME_CONFLICT)"
    algorithm: interval_merge
    formula: |
      occupied = ExamSessions where proctor_id == candidate proctor
                 and status in {SCHEDULED, IN_PROGRESS, COMPLETED}
      conflict = any(existing) where
        candidate.starts_at < existing.ends_at AND existing.starts_at < candidate.ends_at
      # Half-open [starts_at, ends_at) with ZERO buffer: back-to-back sessions where
      # candidate.starts_at == existing.ends_at are accepted. Aggregate load is a
      # separate gate (calculations.proctor_daily_load).
    input_set: "Assigned ExamSessions of one proctor across all rooms and centers."
    constants:
      PROCTOR_BUFFER_MINUTES: 0
    precision: "minute resolution; strict (<) comparisons on both sides"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path id resolves, validated left to right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND (ERR_STUDENT_NOT_FOUND, ERR_TESTING_CENTER_NOT_FOUND, ERR_TESTING_ROOM_NOT_FOUND, ERR_PROCTOR_NOT_FOUND, ERR_CLASS_SECTION_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_ATTENDANCE_ENTRY_NOT_FOUND, ERR_TEST_EVENT_NOT_FOUND, ERR_EXAM_SESSION_NOT_FOUND, ERR_EXAM_REGISTRATION_NOT_FOUND, ERR_ACCOMMODATION_REQUEST_NOT_FOUND, ERR_OUTCOME_RECORD_NOT_FOUND, ERR_CREDENTIAL_NOT_FOUND, ERR_TRANSCRIPT_ORDER_NOT_FOUND, ERR_FUNDING_PERIOD_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: auth
    check: "entity_backed roles act only inside their own scope: CenterAdministrator X-User-ID == the TestingCenter id in the path or the center owning the addressed room/session; Proctor X-User-ID == ExamSession.proctor_id of the addressed registration; Student X-User-ID == the addressed Student id or the owner of the addressed resource"
    error_id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    applies_to: "all CenterAdministrator, Proctor and Student operations"
  - priority: 5
    category: business_constraint
    check: "request body has every required field, types match, enum values are members of the declared set, numeric constraints hold (hours multiple of 0.25, copies 1..10, scale_score ranges, seat counts, state_code shape)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 6
    category: business_constraint
    check: "limit within 1..100 and offset >= 0 on list endpoints"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 7
    category: business_temporal
    check: "the requested clock instant is not earlier than the current logical clock"
    error_id: ERR_CLOCK_BACKWARD
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 10
    category: existence
    check: "every FK supplied in the body resolves (student_id, class_section_id, exam_session_id, accommodation_request_id, credential_issuance_id, funding_period_id, proctor_id, testing_room_id, enrollment_id)"
    error_id: "matching ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /enrollments, POST /test-events, POST /exam-sessions, POST /exam-sessions/{sessionId}/proctor-assignment, POST /exam-registrations, POST /accommodation-requests, POST /outcome-records, POST /credentials, POST /students/{studentId}/transcript-orders"
  - priority: 20
    category: state
    check: "the OCC field equals the parent's current version (expected_exam_session_version, expected_enrollment_version, expected_funding_period_version)"
    error_id: "ERR_STALE_EXAM_SESSION_VERSION | ERR_STALE_ENROLLMENT_VERSION | ERR_STALE_FUNDING_PERIOD_VERSION"
    http_status: 412
    applies_to: "POST /exam-registrations, POST /attendance-entries/{entryId}/void, POST /funding-periods/{periodId}/allocation-run"
  - priority: 30
    category: state
    check: "the addressed resource is in a state the transition declares as `from` (see state_machines)"
    error_id: "ERR_INVALID_INTAKE_STATE | ERR_CENTER_DECISION_NOT_ALLOWED | ERR_ROOM_OUT_OF_SERVICE | ERR_PROCTOR_DECISION_NOT_ALLOWED | ERR_SECTION_TRANSITION_NOT_ALLOWED | ERR_ENROLLMENT_NOT_ACTIVE | ERR_ATTENDANCE_ALREADY_VOIDED | ERR_TEST_EVENT_NOT_SCHEDULED | ERR_SESSION_NOT_ASSIGNABLE | ERR_SESSION_NOT_CANCELLABLE | ERR_REGISTRATION_NOT_OPEN | ERR_REGISTRATION_NOT_CHECKED_IN | ERR_IDENTITY_ALREADY_VERIFIED | ERR_ACCOMMODATION_NOT_PENDING | ERR_ACCOMMODATION_NOT_INFO_REQUESTED | ERR_OUTCOME_NOT_CERTIFIABLE | ERR_TRANSCRIPT_ORDER_NOT_QUEUED | ERR_FUNDING_PERIOD_CLOSED"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 31
    category: state
    check: "student intake gates: PRE_TEST scheduling requires intake_status in {ORIENTED, PLACED, ENROLLED}; enrollment requires placement_efl_level not null; exam registration requires intake_status in {PLACED, ENROLLED}"
    error_id: "ERR_STUDENT_NOT_ORIENTED | ERR_PLACEMENT_TEST_MISSING | ERR_STUDENT_NOT_PLACED"
    http_status: 409
    applies_to: "POST /test-events, POST /enrollments, POST /exam-registrations"
  - priority: 40
    category: state
    check: "the TestingCenter owning the addressed room/session is authorized: authorization_status in {PROVISIONAL, FULL_AUTHORIZED}; a SUSPENDED center is reported separately from a never-authorized one"
    error_id: "ERR_CENTER_NOT_AUTHORIZED | ERR_CENTER_SUSPENDED"
    http_status: 409
    applies_to: "POST /testing-centers/{centerId}/rooms, POST /exam-sessions, POST /exam-sessions/{sessionId}/proctor-assignment, POST /exam-registrations"
  - priority: 41
    category: state
    check: "the ClassSection accepts enrollment: status in {OPEN, IN_SESSION}"
    error_id: ERR_SECTION_NOT_ACCEPTING_ENROLLMENT
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 42
    category: state
    check: "the linked CredentialIssuance is ISSUED (not VOIDED)"
    error_id: ERR_CREDENTIAL_NOT_ISSUED
    http_status: 409
    applies_to: "POST /students/{studentId}/transcript-orders, POST /transcript-orders/{orderId}/fulfillment, POST /outcome-records with measure_type == CREDENTIAL_ATTAINMENT"
  - priority: 43
    category: state
    check: "the FundingPeriod is OPEN"
    error_id: ERR_FUNDING_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /outcome-records, POST /outcome-records/{outcomeId}/certification, POST /funding-periods/{periodId}/allocation-run, POST /funding-periods/{periodId}/close"
  - priority: 44
    category: state
    check: "the addressed TestingRoom is ACTIVE (a room turned OUT_OF_SERVICE by maintenance retirement or by center suspension cannot host new sittings)"
    error_id: ERR_ROOM_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /exam-sessions"
  - priority: 45
    category: state
    check: "the referenced ExamSession is SCHEDULED (a DRAFT session without an assigned proctor, or one already IN_PROGRESS, COMPLETED or CANCELLED, does not sell seats)"
    error_id: ERR_SESSION_NOT_OPEN_FOR_REGISTRATION
    http_status: 409
    applies_to: "POST /exam-registrations"
  - priority: 50
    category: business_safety
    check: "the proctor is currently certified after lazy lapse evaluation: certification_status == CERTIFIED and logical clock now < certification_expires_at"
    error_id: "ERR_PROCTOR_NOT_CERTIFIED | ERR_PROCTOR_CERTIFICATION_LAPSED"
    http_status: 409
    applies_to: "POST /exam-sessions/{sessionId}/proctor-assignment, POST /exam-registrations/{registrationId}/check-in, POST /exam-registrations/{registrationId}/identity-verification, POST /exam-registrations/{registrationId}/result"
  - priority: 51
    category: business_safety
    check: "candidate identity is verified before seating: identity_status == VERIFIED (UNVERIFIED or ID_REJECTED is refused)"
    error_id: ERR_IDENTITY_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /exam-registrations/{registrationId}/check-in"
  - priority: 52
    category: business_safety
    check: "segregation of duties: the acting X-User-ID differs from OutcomeRecord.recorded_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /outcome-records/{outcomeId}/certification"
  - priority: 53
    category: business_safety
    check: "the session's subtest is inside the owning center's allowed_subtests"
    error_id: ERR_SUBTEST_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /exam-sessions, POST /exam-registrations"
  - priority: 60
    category: business_referential
    check: "the referenced AccommodationRequest belongs to the registering student"
    error_id: ERR_ACCOMMODATION_OWNER_MISMATCH
    http_status: 409
    applies_to: "POST /exam-registrations"
  - priority: 61
    category: business_referential
    check: "the referenced AccommodationRequest is APPROVED and, after lazy expiry evaluation, not EXPIRED"
    error_id: "ERR_ACCOMMODATION_NOT_APPROVED | ERR_ACCOMMODATION_EXPIRED"
    http_status: 409
    applies_to: "POST /exam-registrations"
  - priority: 62
    category: business_referential
    check: "the ExamSession's supported_formats contains the accommodation's granted_format"
    error_id: ERR_ACCOMMODATION_FORMAT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /exam-registrations"
  - priority: 63
    category: business_referential
    check: "measure_type == CREDENTIAL_ATTAINMENT requires credential_issuance_id present and its CredentialIssuance.student_id == the outcome's student_id"
    error_id: ERR_OUTCOME_EVIDENCE_MISMATCH
    http_status: 409
    applies_to: "POST /outcome-records"
  - priority: 64
    category: business_referential
    check: "certifying an EFL_GAIN outcome requires calculations.msg_determination FINAL variant to report msg_achieved == true"
    error_id: ERR_MSG_NOT_SUPPORTED
    http_status: 409
    applies_to: "POST /outcome-records/{outcomeId}/certification"
  - priority: 70
    category: business_temporal
    check: "the ExamSession has not started yet: starts_at > logical clock now"
    error_id: ERR_SESSION_IN_PAST
    http_status: 422
    applies_to: "POST /exam-sessions, POST /exam-registrations"
  - priority: 71
    category: business_temporal
    check: "a POST_TEST may be scheduled only once MIN_POST_TEST_DAY_INTERVAL (30) whole UTC days have elapsed since the earliest SCORED PRE_TEST's test_date"
    error_id: ERR_POST_TEST_INTERVAL_NOT_MET
    http_status: 409
    applies_to: "POST /test-events with purpose == POST_TEST"
  - priority: 72
    category: business_temporal
    check: "session window is valid: ends_at > starts_at and duration <= 6 hours; scheduled_for on a TestEvent is not before the logical clock"
    error_id: ERR_INVALID_SESSION_WINDOW
    http_status: 422
    applies_to: "POST /exam-sessions, POST /test-events"
  - priority: 73
    category: business_temporal
    check: "check-in happens inside the seating window [starts_at - 60 minutes, ends_at)"
    error_id: ERR_CHECK_IN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /exam-registrations/{registrationId}/check-in"
  - priority: 74
    category: business_temporal
    check: "an approval's valid_until is in the future relative to the logical clock; attendance_date is not in the future"
    error_id: ERR_INVALID_EFFECTIVE_WINDOW
    http_status: 422
    applies_to: "POST /accommodation-requests/{requestId}/decision, POST /enrollments/{enrollmentId}/attendance-entries"
  - priority: 80
    category: business_constraint
    check: "a POST_TEST requires Enrollment.posted_hours >= MIN_POST_TEST_HOURS (40.00)"
    error_id: ERR_POST_TEST_HOURS_NOT_MET
    http_status: 409
    applies_to: "POST /test-events with purpose == POST_TEST"
  - priority: 81
    category: business_constraint
    check: "no room occupation conflict under calculations.room_occupation_conflict (buffered on both trailing edges)"
    error_id: ERR_ROOM_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /exam-sessions"
  - priority: 82
    category: business_constraint
    check: "no proctor interval conflict under calculations.proctor_interval_conflict (half-open, zero buffer)"
    error_id: ERR_PROCTOR_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /exam-sessions/{sessionId}/proctor-assignment"
  - priority: 83
    category: business_constraint
    check: "projected daily proctoring load does not exceed Proctor.daily_hour_cap (calculations.proctor_daily_load; exactly at the cap is allowed)"
    error_id: ERR_PROCTOR_DAILY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /exam-sessions/{sessionId}/proctor-assignment"
  - priority: 84
    category: business_constraint
    check: "the student has no other Enrollment with status == ACTIVE on a section with the same program_track"
    error_id: ERR_DUPLICATE_ACTIVE_ENROLLMENT
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 85
    category: business_constraint
    check: "Student.placement_efl_level is within [ClassSection.min_efl_level, ClassSection.max_efl_level] inclusive"
    error_id: ERR_EFL_LEVEL_OUT_OF_RANGE
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 86
    category: business_constraint
    check: "the student has no other TestEvent with the same purpose in status SCHEDULED"
    error_id: ERR_TEST_EVENT_CONFLICT
    http_status: 409
    applies_to: "POST /test-events"
  - priority: 87
    category: business_constraint
    check: "the student has no CredentialIssuance with status == ISSUED"
    error_id: ERR_DUPLICATE_CREDENTIAL
    http_status: 409
    applies_to: "POST /credentials"
  - priority: 88
    category: business_constraint
    check: "calculations.credential_eligibility reports eligible == true (four passing subtests, composite >= 580)"
    error_id: ERR_CREDENTIAL_REQUIREMENTS_NOT_MET
    http_status: 409
    applies_to: "POST /credentials"
  - priority: 89
    category: business_constraint
    check: "info_request_rounds < 2 before issuing another information request"
    error_id: ERR_INFO_REQUEST_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /accommodation-requests/{requestId}/info-request"
  - priority: 90
    category: business_constraint
    check: "ClassSection.seats_taken < seats_total"
    error_id: ERR_SECTION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 91
    category: business_constraint
    check: "ExamSession.seats_taken < seat_capacity, and the student has no other ExamRegistration on this session with registration_status in {REGISTERED, CHECKED_IN, SCORED}"
    error_id: "ERR_SESSION_SEATS_EXHAUSTED | ERR_DUPLICATE_REGISTRATION"
    http_status: 409
    applies_to: "POST /exam-registrations"
  - priority: 100
    category: business_fiscal
    check: "when Student.self_pay_authorized == false, voucher_balance_cents must cover the post-discount net (fee_due_cents would be 0)"
    error_id: ERR_VOUCHER_INSUFFICIENT
    http_status: 402
    applies_to: "POST /exam-registrations"
  - priority: 101
    category: business_fiscal
    check: "a voucher adjustment must not drive voucher_balance_cents below 0"
    error_id: ERR_VOUCHER_ADJUSTMENT_INVALID
    http_status: 422
    applies_to: "POST /students/{studentId}/voucher-adjustments"

endpoints:
  # ---- Student ------------------------------------------------------------
  - method: POST
    path: "/students"
    description: "Intake a new adult-education student; starts in intake_status INTAKE_STARTED."
    roles: [ProgramCoordinator, StateAuthority]
    code: 201
    input: [full_name, email, primary_track, "self_pay_authorized?"]
    output: Student
    side_effects: ["creates Student with intake_status=INTAKE_STARTED, placement_efl_level=null, voucher_granted_cents=0, voucher_balance_cents=0, voucher_spent_cents=0, credential_status=NONE, active_enrollment_count=0"]
  - method: POST
    path: "/students/{studentId}/orientation-completion"
    description: "Record completion of orientation; INTAKE_STARTED -> ORIENTED."
    roles: [Registrar, ProgramCoordinator]
    code: 200
    input: []
    output: Student
    side_effects: ["intake_status INTAKE_STARTED -> ORIENTED", "sets orientation_completed_at", "increments Student.version by 1"]
  - method: POST
    path: "/students/{studentId}/voucher-adjustments"
    description: "Grant or claw back exam-fee voucher funds for a student (cents ledger)."
    roles: [ProgramCoordinator, StateAuthority]
    code: 200
    input: [delta_cents]
    output: Student
    side_effects: ["adds delta_cents to voucher_granted_cents and voucher_balance_cents", "rejects with ERR_VOUCHER_ADJUSTMENT_INVALID when the result would be negative", "increments Student.version by 1"]
  - method: GET
    path: "/students/{studentId}"
    description: "Read one student with computed hour, voucher and credential fields."
    roles: [ProgramCoordinator, StateAuthority, Registrar, Instructor, Student]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/students"
    description: "List students, newest first by created_at ASC ordering key with offset pagination."
    roles: [ProgramCoordinator, StateAuthority, Registrar, Instructor]
    code: 200
    input: ["intake_status?", "primary_track?", "credential_status?", "limit?", "offset?"]
    output: Student[]
    side_effects: []
  - method: GET
    path: "/students/{studentId}/skill-gain"
    description: "Computed read of measurable-skill-gain determination for the student under calculations.msg_determination; variant defaults to BEST_POST."
    roles: [ProgramCoordinator, StateAuthority, Registrar]
    code: 200
    input: ["variant?", "funding_period_id?"]
    output: "{student_id, variant, entry_efl_level, post_efl_level, best_post_scale_score, latest_post_scale_score, levels_gained, msg_achieved}"
    side_effects: []

  # ---- TestingCenter -----------------------------------------------------
  - method: POST
    path: "/testing-centers"
    description: "Register a testing-center authorization application; starts APPLIED."
    roles: [StateAuthority]
    code: 201
    input: [name, state_code]
    output: TestingCenter
    side_effects: ["creates TestingCenter with authorization_status=APPLIED, allowed_subtests=[], max_sessions_per_week=0"]
  - method: POST
    path: "/testing-centers/{centerId}/authorization-decision"
    description: "State decision on a center's authorization: GRANT_PROVISIONAL, GRANT_FULL or WITHDRAW."
    roles: [StateAuthority]
    code: 200
    input: [decision, "allowed_subtests?", "max_sessions_per_week?"]
    output: TestingCenter
    side_effects: ["APPLIED|PROVISIONAL -> PROVISIONAL|FULL_AUTHORIZED|WITHDRAWN per calculations-free branch in state_machines", "sets allowed_subtests and max_sessions_per_week per the branch taken", "sets authorized_at", "increments TestingCenter.version by 1"]
  - method: POST
    path: "/testing-centers/{centerId}/suspend"
    description: "Suspend an authorized center; cascades to rooms, sessions, registrations and vouchers."
    roles: [StateAuthority]
    code: 200
    input: [suspended_reason]
    output: TestingCenter
    side_effects: ["PROVISIONAL|FULL_AUTHORIZED -> SUSPENDED", "cascade link 1: every ACTIVE TestingRoom of this center -> OUT_OF_SERVICE", "cascade link 2: every DRAFT|SCHEDULED ExamSession in those rooms -> CANCELLED", "cascade link 3: every REGISTERED ExamRegistration on those sessions -> CANCELLED_BY_CENTER", "cascade link 4: refunds voucher_applied_cents back to Student.voucher_balance_cents and decreases voucher_spent_cents and exam_fee_owed_cents", "increments TestingCenter.version by 1"]
  - method: GET
    path: "/testing-centers/{centerId}"
    description: "Read one testing center."
    roles: [StateAuthority, ProgramCoordinator, CenterAdministrator, Registrar]
    code: 200
    input: []
    output: TestingCenter
    side_effects: []
  - method: GET
    path: "/testing-centers"
    description: "List testing centers with offset pagination."
    roles: [StateAuthority, ProgramCoordinator, Registrar]
    code: 200
    input: ["authorization_status?", "state_code?", "limit?", "offset?"]
    output: TestingCenter[]
    side_effects: []

  # ---- TestingRoom -------------------------------------------------------
  - method: POST
    path: "/testing-centers/{centerId}/rooms"
    description: "Add a testing room to an authorized center; testing_center_id is taken from the path."
    roles: [CenterAdministrator, StateAuthority]
    code: 201
    input: [room_code, seat_capacity, "turnaround_buffer_minutes?"]
    output: TestingRoom
    side_effects: ["creates TestingRoom with status=ACTIVE and testing_center_id from the path", "increments TestingCenter.version by 1"]
  - method: GET
    path: "/testing-rooms/{roomId}"
    description: "Read one testing room."
    roles: [CenterAdministrator, StateAuthority, ProgramCoordinator]
    code: 200
    input: []
    output: TestingRoom
    side_effects: []
  - method: GET
    path: "/testing-rooms"
    description: "List testing rooms, filterable by owning center (FK reverse-reachability for TestingRoom.testing_center_id)."
    roles: [CenterAdministrator, StateAuthority, ProgramCoordinator]
    code: 200
    input: ["testing_center_id?", "status?", "limit?", "offset?"]
    output: TestingRoom[]
    side_effects: []

  - method: POST
    path: "/testing-rooms/{roomId}/out-of-service"
    description: "Take a room out of service for maintenance while its center stays authorized; already-scheduled sessions in the room are left untouched, but no new sitting may be scheduled in it."
    roles: [CenterAdministrator, StateAuthority]
    code: 200
    input: [service_note]
    output: TestingRoom
    side_effects: ["ACTIVE -> OUT_OF_SERVICE", "a second call on an OUT_OF_SERVICE room is refused with ERR_ROOM_OUT_OF_SERVICE", "increments TestingRoom.version by 1"]

  # ---- Proctor -----------------------------------------------------------
  - method: POST
    path: "/testing-centers/{centerId}/proctors"
    description: "Register a proctor candidate at a center; starts PENDING, testing_center_id from the path."
    roles: [CenterAdministrator, StateAuthority]
    code: 201
    input: [full_name, "daily_hour_cap?"]
    output: Proctor
    side_effects: ["creates Proctor with certification_status=PENDING, certification_expires_at=null, assigned_session_count=0"]
  - method: POST
    path: "/proctors/{proctorId}/certification-decision"
    description: "State decision on proctor certification: CERTIFY, RENEW or REVOKE; REVOKE cascades five links."
    roles: [StateAuthority]
    code: 200
    input: [decision, "certification_expires_at?"]
    output: Proctor
    side_effects: ["PENDING -> CERTIFIED on CERTIFY, LAPSED -> CERTIFIED on RENEW, PENDING|CERTIFIED|LAPSED -> REVOKED on REVOKE", "sets certification_expires_at on CERTIFY|RENEW", "REVOKE cascade link 1: this proctor's SCHEDULED ExamSessions revert SCHEDULED -> DRAFT with proctor_id cleared", "REVOKE cascade link 2a: registrations verified by this proctor -> identity_status UNVERIFIED; link 2b: SCORED registrations proctored by this proctor -> INVALIDATED", "REVOKE cascade link 3: CredentialIssuance rows whose qualifying_registration_ids include an invalidated registration -> VOIDED, with dependent QUEUED TranscriptOrders -> HELD", "REVOKE cascade link 4: CERTIFIED OutcomeRecords resting on those credentials -> RESCINDED and their allocated_cents returned to FundingPeriod.available_cents", "increments Proctor.version by 1"]
  - method: GET
    path: "/proctors/{proctorId}"
    description: "Read one proctor, including lazily evaluated certification lapse."
    roles: [CenterAdministrator, StateAuthority, ProgramCoordinator, Proctor]
    code: 200
    input: []
    output: Proctor
    side_effects: []
  - method: GET
    path: "/proctors"
    description: "List proctors, filterable by owning center (FK reverse-reachability for Proctor.testing_center_id)."
    roles: [CenterAdministrator, StateAuthority, ProgramCoordinator]
    code: 200
    input: ["testing_center_id?", "certification_status?", "limit?", "offset?"]
    output: Proctor[]
    side_effects: []

  # ---- ClassSection ------------------------------------------------------
  - method: POST
    path: "/class-sections"
    description: "Create an instructional section for a program track; starts PLANNED."
    roles: [ProgramCoordinator]
    code: 201
    input: [program_track, title, instructor_user_id, min_efl_level, max_efl_level, seats_total, weekly_hours]
    output: ClassSection
    side_effects: ["creates ClassSection with status=PLANNED, seats_taken=0, seats_available=seats_total"]
  - method: POST
    path: "/class-sections/{sectionId}/status-transition"
    description: "Move a section between PLANNED, OPEN, IN_SESSION and CLOSED; CLOSED cascades to enrollments."
    roles: [ProgramCoordinator]
    code: 200
    input: [target_status]
    output: ClassSection
    side_effects: ["PLANNED -> OPEN, OPEN -> IN_SESSION, OPEN|IN_SESSION -> CLOSED", "on CLOSED, conditional cascade: ACTIVE Enrollments with posted_hours >= 40.00 -> COMPLETED, otherwise -> WITHDRAWN, and Student.active_enrollment_count is decremented", "increments ClassSection.version by 1"]
  - method: GET
    path: "/class-sections/{sectionId}"
    description: "Read one class section with seat counts."
    roles: [ProgramCoordinator, StateAuthority, Instructor, Registrar]
    code: 200
    input: []
    output: ClassSection
    side_effects: []
  - method: GET
    path: "/class-sections"
    description: "List class sections with offset pagination."
    roles: [ProgramCoordinator, StateAuthority, Instructor, Registrar]
    code: 200
    input: ["program_track?", "status?", "limit?", "offset?"]
    output: ClassSection[]
    side_effects: []

  # ---- Enrollment --------------------------------------------------------
  - method: POST
    path: "/enrollments"
    description: "Assign a placed student to an accepting section; snapshots entry_efl_level."
    roles: [ProgramCoordinator]
    code: 201
    input: [student_id, class_section_id]
    output: Enrollment
    side_effects: ["creates Enrollment with status=ACTIVE, posted_hours=0, post_test_eligible=false, entry_efl_level=Student.placement_efl_level", "increments ClassSection.seats_taken and decrements seats_available", "sets Student.intake_status to ENROLLED and increments Student.active_enrollment_count", "increments ClassSection.version by 1"]
  - method: POST
    path: "/enrollments/{enrollmentId}/withdraw"
    description: "Withdraw an active enrollment and release its seat."
    roles: [ProgramCoordinator, Instructor]
    code: 200
    input: [exit_reason]
    output: Enrollment
    side_effects: ["ACTIVE -> WITHDRAWN", "sets withdrawn_at and exit_reason", "decrements ClassSection.seats_taken and increments seats_available", "decrements Student.active_enrollment_count and sets Student.intake_status to PLACED when it reaches 0", "increments Enrollment.version by 1"]
  - method: GET
    path: "/enrollments/{enrollmentId}"
    description: "Read one enrollment with posted_hours and post_test_eligible."
    roles: [ProgramCoordinator, StateAuthority, Instructor, Registrar, Student]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/enrollments"
    description: "List enrollments, filterable by student or section (FK reverse-reachability for Enrollment.student_id and Enrollment.class_section_id)."
    roles: [ProgramCoordinator, StateAuthority, Instructor, Registrar]
    code: 200
    input: ["student_id?", "class_section_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  # ---- AttendanceEntry ---------------------------------------------------
  - method: POST
    path: "/enrollments/{enrollmentId}/attendance-entries"
    description: "Post instructional hours against an active enrollment; enrollment_id is taken from the path."
    roles: [Instructor, ProgramCoordinator]
    code: 201
    input: [attendance_date, hours]
    output: AttendanceEntry
    side_effects: ["creates AttendanceEntry with status=POSTED and posted_by_user_id from X-User-ID", "adds hours to Enrollment.posted_hours and Student.total_instructional_hours", "re-evaluates Enrollment.post_test_eligible per calculations.post_test_eligibility", "increments Enrollment.version by 1"]
  - method: POST
    path: "/attendance-entries/{entryId}/void"
    description: "Void a posted attendance entry under optimistic concurrency on the parent enrollment; cascades four links."
    roles: [Instructor, ProgramCoordinator]
    code: 200
    input: [void_reason, expected_enrollment_version]
    output: AttendanceEntry
    side_effects: ["POSTED -> VOIDED", "cascade link 1: subtracts hours from Enrollment.posted_hours and Student.total_instructional_hours", "cascade link 2: re-evaluates Enrollment.post_test_eligible and invalidates SCHEDULED POST_TEST TestEvents that lose their hour basis", "cascade link 3: re-runs calculations.msg_determination FINAL and rescinds CERTIFIED EFL_GAIN OutcomeRecords that no longer qualify", "cascade link 4: returns rescinded allocated_cents to FundingPeriod.available_cents and decrements committed_cents", "increments Enrollment.version by 1"]
  - method: GET
    path: "/attendance-entries/{entryId}"
    description: "Read one attendance entry."
    roles: [Instructor, ProgramCoordinator, StateAuthority]
    code: 200
    input: []
    output: AttendanceEntry
    side_effects: []
  - method: GET
    path: "/attendance-entries"
    description: "List attendance entries, filterable by enrollment (FK reverse-reachability for AttendanceEntry.enrollment_id)."
    roles: [Instructor, ProgramCoordinator, StateAuthority]
    code: 200
    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: AttendanceEntry[]
    side_effects: []

  # ---- TestEvent ---------------------------------------------------------
  - method: POST
    path: "/test-events"
    description: "Schedule a standardized PRE_TEST or POST_TEST for a student; POST_TEST enforces the hour and interval gates."
    roles: [Registrar, ProgramCoordinator]
    code: 201
    input: [student_id, purpose, test_form, scheduled_for, "enrollment_id?"]
    output: TestEvent
    side_effects: ["creates TestEvent with status=SCHEDULED, test_date=null, efl_level=null", "for purpose=POST_TEST evaluates calculations.post_test_eligibility (hours then interval)"]
  - method: POST
    path: "/test-events/{testEventId}/score"
    description: "Record a scale score for a scheduled test event and derive its EFL level."
    roles: [Instructor]
    code: 200
    input: [scale_score]
    output: TestEvent
    side_effects: ["SCHEDULED -> SCORED", "sets test_date = logical clock now and computes efl_level per calculations.efl_placement_level", "when this is the student's earliest SCORED PRE_TEST, writes Student.placement_efl_level and moves intake_status ORIENTED -> PLACED", "increments TestEvent.version by 1"]
  - method: GET
    path: "/test-events/{testEventId}"
    description: "Read one test event."
    roles: [Registrar, ProgramCoordinator, StateAuthority, Student]
    code: 200
    input: []
    output: TestEvent
    side_effects: []
  - method: GET
    path: "/test-events"
    description: "List test events, filterable by student or enrollment (FK reverse-reachability for TestEvent.student_id and TestEvent.enrollment_id)."
    roles: [Registrar, ProgramCoordinator, StateAuthority]
    code: 200
    input: ["student_id?", "enrollment_id?", "purpose?", "status?", "limit?", "offset?"]
    output: TestEvent[]
    side_effects: []

  # ---- ExamSession -------------------------------------------------------
  - method: POST
    path: "/exam-sessions"
    description: "Schedule an exam sitting in a room of an authorized center; enforces buffered room occupation."
    roles: [CenterAdministrator]
    code: 201
    input: [testing_room_id, subtest, starts_at, ends_at, requested_seats, "supported_formats?"]
    output: ExamSession
    side_effects: ["creates ExamSession with status=DRAFT, proctor_id=null, seats_taken=0", "computes seat_capacity=min(requested_seats, TestingRoom.seat_capacity) and duration_hours", "evaluates calculations.room_occupation_conflict against existing DRAFT|SCHEDULED|IN_PROGRESS sessions in the same room"]
  - method: POST
    path: "/exam-sessions/{sessionId}/proctor-assignment"
    description: "Assign a certified proctor to a session; enforces half-open interval conflict and the daily hour cap."
    roles: [CenterAdministrator]
    code: 200
    input: [proctor_id]
    output: ExamSession
    side_effects: ["DRAFT -> SCHEDULED", "sets proctor_id and increments Proctor.assigned_session_count", "lazily lapses the proctor when the logical clock has passed certification_expires_at", "evaluates calculations.proctor_interval_conflict and calculations.proctor_daily_load", "increments ExamSession.version by 1"]
  - method: POST
    path: "/exam-sessions/{sessionId}/cancel"
    description: "Cancel a session that has not been completed; cancels its live registrations and refunds vouchers."
    roles: [CenterAdministrator, StateAuthority]
    code: 200
    input: [cancel_reason]
    output: ExamSession
    side_effects: ["DRAFT|SCHEDULED -> CANCELLED", "cascade: REGISTERED ExamRegistrations -> CANCELLED_BY_CENTER with refunded_cents = voucher_applied_cents returned to Student.voucher_balance_cents and ExamSession.seats_taken decremented", "decrements Proctor.assigned_session_count when a proctor was assigned", "increments ExamSession.version by 1"]
  - method: GET
    path: "/exam-sessions/{sessionId}"
    description: "Read one exam session with seat counts and duration."
    roles: [CenterAdministrator, StateAuthority, ProgramCoordinator, Registrar, Proctor]
    code: 200
    input: []
    output: ExamSession
    side_effects: []
  - method: GET
    path: "/exam-sessions"
    description: "List exam sessions, filterable by room or proctor (FK reverse-reachability for ExamSession.testing_room_id and ExamSession.proctor_id)."
    roles: [CenterAdministrator, StateAuthority, ProgramCoordinator, Registrar, Proctor]
    code: 200
    input: ["testing_room_id?", "proctor_id?", "subtest?", "status?", "limit?", "offset?"]
    output: ExamSession[]
    side_effects: []

  # ---- ExamRegistration --------------------------------------------------
  - method: POST
    path: "/exam-registrations"
    description: "Register a placed student for a seat on a scheduled session under optimistic concurrency on the session; assesses the exam fee."
    roles: [Registrar, Student]
    code: 201
    input: [student_id, exam_session_id, expected_exam_session_version, "accommodation_request_id?"]
    output: ExamRegistration
    side_effects: ["creates ExamRegistration with registration_status=REGISTERED and identity_status=UNVERIFIED", "computes prior_scored_attempts, gross_fee_cents, accommodation_surcharge_cents, discount_cents, voucher_applied_cents and fee_due_cents per calculations.exam_fee_assessment", "decrements Student.voucher_balance_cents, increments voucher_spent_cents and exam_fee_owed_cents", "increments ExamSession.seats_taken", "lazily expires an APPROVED AccommodationRequest whose valid_until has passed", "increments ExamSession.version by 1"]
  - method: POST
    path: "/exam-registrations/{registrationId}/identity-verification"
    description: "Proctor records the identity check outcome for a registration (VERIFIED or REJECTED)."
    roles: [Proctor]
    code: 200
    input: [decision, "identity_document_type?"]
    output: ExamRegistration
    side_effects: ["identity_status UNVERIFIED|ID_REJECTED -> VERIFIED on decision VERIFIED, UNVERIFIED -> ID_REJECTED on decision REJECTED", "sets identity_verified_by_proctor_id to X-User-ID and identity_document_type", "increments ExamRegistration.version by 1"]
  - method: POST
    path: "/exam-registrations/{registrationId}/check-in"
    description: "Seat an identity-verified candidate inside the seating window; starts the session on first check-in."
    roles: [Proctor]
    code: 200
    input: []
    output: ExamRegistration
    side_effects: ["registration_status REGISTERED -> CHECKED_IN", "sets checked_in_at from the logical clock", "moves the ExamSession SCHEDULED -> IN_PROGRESS on the first check-in", "increments ExamRegistration.version by 1"]
  - method: POST
    path: "/exam-registrations/{registrationId}/result"
    description: "Record the scale score for a seated candidate and derive PASS or FAIL."
    roles: [Proctor]
    code: 200
    input: [scale_score]
    output: ExamRegistration
    side_effects: ["registration_status CHECKED_IN -> SCORED", "computes result_outcome from PASS_SCORE_PER_SUBTEST", "moves the ExamSession IN_PROGRESS -> COMPLETED once no registration remains CHECKED_IN", "increments ExamRegistration.version by 1"]
  - method: POST
    path: "/exam-registrations/{registrationId}/cancel"
    description: "Cancel a registration before it is scored and release the seat and voucher funds."
    roles: [Registrar, Student]
    code: 200
    input: []
    output: ExamRegistration
    side_effects: ["registration_status REGISTERED -> CANCELLED", "refunds voucher_applied_cents into Student.voucher_balance_cents, decrements voucher_spent_cents and exam_fee_owed_cents, sets refunded_cents", "decrements ExamSession.seats_taken", "increments ExamRegistration.version by 1"]
  - method: GET
    path: "/exam-registrations/{registrationId}"
    description: "Read one exam registration with its fee breakdown and both status axes."
    roles: [ProgramCoordinator, StateAuthority, CenterAdministrator, Proctor, Student]
    code: 200
    input: []
    output: ExamRegistration
    side_effects: []
  - method: GET
    path: "/exam-registrations"
    description: "List exam registrations, filterable by student, session, accommodation or verifying proctor (FK reverse-reachability for all four ExamRegistration FKs)."
    roles: [ProgramCoordinator, StateAuthority, CenterAdministrator, Proctor, Registrar]
    code: 200
    input: ["student_id?", "exam_session_id?", "accommodation_request_id?", "identity_verified_by_proctor_id?", "registration_status?", "identity_status?", "limit?", "offset?"]
    output: ExamRegistration[]
    side_effects: []

  # ---- AccommodationRequest ---------------------------------------------
  - method: POST
    path: "/accommodation-requests"
    description: "Submit an accommodation and alternate-format testing request for a student."
    roles: [Student, Registrar]
    code: 201
    input: [student_id, requested_format, documentation_ref]
    output: AccommodationRequest
    side_effects: ["creates AccommodationRequest with status=SUBMITTED and info_request_rounds=0"]
  - method: POST
    path: "/accommodation-requests/{requestId}/info-request"
    description: "Ask the student for more documentation; at most two rounds per request."
    roles: [CenterAdministrator]
    code: 200
    input: [decision_note]
    output: AccommodationRequest
    side_effects: ["SUBMITTED -> INFO_REQUESTED", "increments info_request_rounds", "increments AccommodationRequest.version by 1"]
  - method: POST
    path: "/accommodation-requests/{requestId}/resubmission"
    description: "Student supplies the requested documentation, returning the request to review."
    roles: [Student, Registrar]
    code: 200
    input: [documentation_ref]
    output: AccommodationRequest
    side_effects: ["INFO_REQUESTED -> SUBMITTED", "replaces documentation_ref", "increments AccommodationRequest.version by 1"]
  - method: POST
    path: "/accommodation-requests/{requestId}/decision"
    description: "Approve (with granted_format and valid_until) or deny an accommodation request."
    roles: [CenterAdministrator]
    code: 200
    input: [decision, "granted_format?", "valid_until?", "decision_note?"]
    output: AccommodationRequest
    side_effects: ["SUBMITTED -> APPROVED on APPROVE, SUBMITTED -> DENIED on DENY", "sets granted_format, valid_until and decision_note", "increments AccommodationRequest.version by 1"]
  - method: GET
    path: "/accommodation-requests/{requestId}"
    description: "Read one accommodation request, including lazily evaluated expiry."
    roles: [Registrar, ProgramCoordinator, StateAuthority, Student]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects: []
  - method: GET
    path: "/accommodation-requests"
    description: "List accommodation requests, filterable by student (FK reverse-reachability for AccommodationRequest.student_id)."
    roles: [Registrar, ProgramCoordinator, StateAuthority]
    code: 200
    input: ["student_id?", "status?", "requested_format?", "limit?", "offset?"]
    output: AccommodationRequest[]
    side_effects: []

  # ---- OutcomeRecord -----------------------------------------------------
  - method: POST
    path: "/outcome-records"
    description: "Record a performance-reporting outcome (EFL gain, credential, employment, postsecondary) inside an open funding period."
    roles: [ProgramCoordinator, StateAuthority]
    code: 201
    input: [student_id, funding_period_id, measure_type, evidence_ref, "credential_issuance_id?"]
    output: OutcomeRecord
    side_effects: ["creates OutcomeRecord with status=RECORDED, allocation_status=UNALLOCATED, allocated_cents=0", "sets recorded_by_user_id from X-User-ID", "sets weight from MEASURE_WEIGHT for the measure_type"]
  - method: POST
    path: "/outcome-records/{outcomeId}/certification"
    description: "Certify or reject a recorded outcome; the certifier must not be the recorder."
    roles: [StateAuthority, ProgramCoordinator]
    code: 200
    input: [decision]
    output: OutcomeRecord
    side_effects: ["RECORDED -> CERTIFIED on CERTIFY, RECORDED -> REJECTED on REJECT", "sets certified_by_user_id from X-User-ID", "for measure_type=EFL_GAIN evaluates calculations.msg_determination in the FINAL variant", "increments OutcomeRecord.version by 1"]
  - method: GET
    path: "/outcome-records/{outcomeId}"
    description: "Read one outcome record with weight and allocation figures."
    roles: [StateAuthority, ProgramCoordinator, Registrar]
    code: 200
    input: []
    output: OutcomeRecord
    side_effects: []
  - method: GET
    path: "/outcome-records"
    description: "List outcome records, filterable by student, funding period or credential (FK reverse-reachability for all three OutcomeRecord FKs)."
    roles: [StateAuthority, ProgramCoordinator, Registrar]
    code: 200
    input: ["student_id?", "funding_period_id?", "credential_issuance_id?", "measure_type?", "status?", "allocation_status?", "limit?", "offset?"]
    output: OutcomeRecord[]
    side_effects: []

  # ---- CredentialIssuance ------------------------------------------------
  - method: POST
    path: "/credentials"
    description: "Issue a high-school-equivalency credential from the student's best scored subtest results."
    roles: [StateAuthority]
    code: 201
    input: [student_id, "credential_type?"]
    output: CredentialIssuance
    side_effects: ["creates CredentialIssuance with status=ISSUED and issued_at from the logical clock", "computes subtest_scores, composite_score and qualifying_registration_ids per calculations.credential_eligibility", "sets Student.credential_status=ISSUED and, when active_enrollment_count == 0, intake_status=EXITED"]
  - method: GET
    path: "/credentials/{credentialId}"
    description: "Read one issued credential with its subtest score map."
    roles: [StateAuthority, ProgramCoordinator, Student]
    code: 200
    input: []
    output: CredentialIssuance
    side_effects: []
  - method: GET
    path: "/credentials"
    description: "List credentials, filterable by student (FK reverse-reachability for CredentialIssuance.student_id)."
    roles: [StateAuthority, ProgramCoordinator]
    code: 200
    input: ["student_id?", "status?", "credential_type?", "limit?", "offset?"]
    output: CredentialIssuance[]
    side_effects: []

  # ---- TranscriptOrder ---------------------------------------------------
  - method: POST
    path: "/students/{studentId}/transcript-orders"
    description: "Order transcript copies against an issued credential; student_id comes from the path."
    roles: [Student, Registrar]
    code: 201
    input: [credential_issuance_id, copies, delivery, destination_type]
    output: TranscriptOrder
    side_effects: ["creates TranscriptOrder with status=QUEUED", "computes base_charge_cents, waiver_cents, state_records_fee_cents and total_charge_cents per calculations.transcript_charge"]
  - method: POST
    path: "/transcript-orders/{orderId}/fulfillment"
    description: "Mark a queued transcript order as fulfilled and released to state records."
    roles: [Registrar, ProgramCoordinator]
    code: 200
    input: []
    output: TranscriptOrder
    side_effects: ["QUEUED -> FULFILLED", "sets fulfilled_at from the logical clock", "increments TranscriptOrder.version by 1"]
  - method: GET
    path: "/transcript-orders/{orderId}"
    description: "Read one transcript order with its charge breakdown."
    roles: [ProgramCoordinator, StateAuthority, Student]
    code: 200
    input: []
    output: TranscriptOrder
    side_effects: []
  - method: GET
    path: "/transcript-orders"
    description: "List transcript orders, filterable by student or credential (FK reverse-reachability for TranscriptOrder.student_id and TranscriptOrder.credential_issuance_id)."
    roles: [ProgramCoordinator, StateAuthority]
    code: 200
    input: ["student_id?", "credential_issuance_id?", "status?", "limit?", "offset?"]
    output: TranscriptOrder[]
    side_effects: []

  # ---- FundingPeriod -----------------------------------------------------
  - method: POST
    path: "/funding-periods"
    description: "Open a performance-funding period with a total pool and a per-weight rate."
    roles: [StateAuthority]
    code: 201
    input: [label, start_date, end_date, rate_cents_per_weight, total_cents]
    output: FundingPeriod
    side_effects: ["creates FundingPeriod with status=OPEN, committed_cents=0, available_cents=total_cents, allocation_run_count=0"]
  - method: POST
    path: "/funding-periods/{periodId}/allocation-run"
    description: "Run outcome-based funding allocation under optimistic concurrency on the period; variant selects PROVISIONAL or FINAL eligibility."
    roles: [StateAuthority]
    code: 200
    input: [variant, expected_funding_period_version]
    output: FundingPeriod
    side_effects: ["OPEN -> OPEN self-transition", "allocates per calculations.funding_allocation, writing OutcomeRecord.allocated_cents and allocation_status COMMITTED or DEFERRED", "increases committed_cents and decreases available_cents", "sets last_allocation_variant, last_allocation_run_at and increments allocation_run_count", "increments FundingPeriod.version by 1"]
  - method: POST
    path: "/funding-periods/{periodId}/close"
    description: "Close a funding period, freezing further outcome recording and allocation."
    roles: [StateAuthority]
    code: 200
    input: []
    output: FundingPeriod
    side_effects: ["OPEN -> CLOSED", "increments FundingPeriod.version by 1"]
  - method: GET
    path: "/funding-periods/{periodId}"
    description: "Read one funding period with committed and available cents."
    roles: [StateAuthority, ProgramCoordinator]
    code: 200
    input: []
    output: FundingPeriod
    side_effects: []
  - method: GET
    path: "/funding-periods"
    description: "List funding periods with offset pagination."
    roles: [StateAuthority, ProgramCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FundingPeriod[]
    side_effects: []
  - method: GET
    path: "/funding-periods/{periodId}/allocation-preview"
    description: "Computed read: what calculations.funding_allocation would allocate for the given variant without writing anything."
    roles: [StateAuthority, ProgramCoordinator]
    code: 200
    input: ["variant?"]
    output: "{funding_period_id, variant, total_weight, line_count, projected_committed_cents, projected_available_cents, deferred_line_count}"
    side_effects: []

  # ---- Logical clock (test-driving) --------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every window, interval and expiry rule reads. Before any call the clock reads exactly the startup default 2026-08-01T00:00:00Z and never falls back to wall-clock time; the clock may only move forward."
    roles: [StateAuthority, ProgramCoordinator, Registrar, CenterAdministrator, Instructor]
    code: 200
    input: [current_utc]
    output: "{current_utc}"
    side_effects: ["advances the logical clock", "rejects a value earlier than the current logical clock with ERR_CLOCK_BACKWARD"]
  - method: GET
    path: "/_clock/current_utc"
    description: "Read the current logical UTC clock value (startup default 2026-08-01T00:00:00Z)."
    roles: [StateAuthority, ProgramCoordinator, Registrar, CenterAdministrator, Instructor, Proctor, Student]
    code: 200
    input: []
    output: "{current_utc}"
    side_effects: []

errors:
  # --- auth / request shape ------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_FORBIDDEN_SCOPE
    http: 403
    condition: "an entity_backed role addresses a resource outside its own scope (wrong center, wrong session, wrong student)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the user certifying an OutcomeRecord is the same X-User-ID that recorded it"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, enum value outside the declared set, or numeric constraint violated (hours not a multiple of 0.25, copies outside 1..10, TestEvent.scale_score outside 0..999, ExamRegistration.scale_score outside 100..200)"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative"
  # --- not found ------------------------------------------------------------
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "student id in the path or body does not resolve"
  - id: ERR_TESTING_CENTER_NOT_FOUND
    http: 404
    condition: "testing center id in the path does not resolve"
  - id: ERR_TESTING_ROOM_NOT_FOUND
    http: 404
    condition: "testing room id in the path or body does not resolve"
  - id: ERR_PROCTOR_NOT_FOUND
    http: 404
    condition: "proctor id in the path or body does not resolve"
  - id: ERR_CLASS_SECTION_NOT_FOUND
    http: 404
    condition: "class section id in the path or body does not resolve"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "enrollment id in the path or body does not resolve"
  - id: ERR_ATTENDANCE_ENTRY_NOT_FOUND
    http: 404
    condition: "attendance entry id in the path does not resolve"
  - id: ERR_TEST_EVENT_NOT_FOUND
    http: 404
    condition: "test event id in the path does not resolve"
  - id: ERR_EXAM_SESSION_NOT_FOUND
    http: 404
    condition: "exam session id in the path or body does not resolve"
  - id: ERR_EXAM_REGISTRATION_NOT_FOUND
    http: 404
    condition: "exam registration id in the path does not resolve"
  - id: ERR_ACCOMMODATION_REQUEST_NOT_FOUND
    http: 404
    condition: "accommodation request id in the path or body does not resolve"
  - id: ERR_OUTCOME_RECORD_NOT_FOUND
    http: 404
    condition: "outcome record id in the path does not resolve"
  - id: ERR_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "credential id in the path or body does not resolve"
  - id: ERR_TRANSCRIPT_ORDER_NOT_FOUND
    http: 404
    condition: "transcript order id in the path does not resolve"
  - id: ERR_FUNDING_PERIOD_NOT_FOUND
    http: 404
    condition: "funding period id in the path or body does not resolve"
  # --- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_EXAM_SESSION_VERSION
    http: 412
    condition: "expected_exam_session_version does not equal the ExamSession's current version at POST /exam-registrations"
  - id: ERR_STALE_ENROLLMENT_VERSION
    http: 412
    condition: "expected_enrollment_version does not equal the parent Enrollment's current version at POST /attendance-entries/{entryId}/void"
  - id: ERR_STALE_FUNDING_PERIOD_VERSION
    http: 412
    condition: "expected_funding_period_version does not equal the FundingPeriod's current version at POST /funding-periods/{periodId}/allocation-run"
  # --- state ---------------------------------------------------------------
  - id: ERR_INVALID_INTAKE_STATE
    http: 409
    condition: "orientation completion attempted on a student whose intake_status is not INTAKE_STARTED"
  - id: ERR_STUDENT_NOT_ORIENTED
    http: 409
    condition: "test event scheduled for a student still in INTAKE_STARTED or already EXITED"
  - id: ERR_PLACEMENT_TEST_MISSING
    http: 409
    condition: "enrollment attempted for a student whose placement_efl_level is null (no scored PRE_TEST)"
  - id: ERR_STUDENT_NOT_PLACED
    http: 409
    condition: "exam registration attempted for a student whose intake_status is not PLACED or ENROLLED"
  - id: ERR_CENTER_DECISION_NOT_ALLOWED
    http: 409
    condition: "authorization decision does not match the center's current authorization_status (e.g. GRANT_PROVISIONAL on an already FULL_AUTHORIZED center, any decision on WITHDRAWN or SUSPENDED)"
  - id: ERR_CENTER_NOT_AUTHORIZED
    http: 409
    condition: "the owning center is still APPLIED or has been WITHDRAWN"
  - id: ERR_CENTER_SUSPENDED
    http: 409
    condition: "the owning center is SUSPENDED"
  - id: ERR_ROOM_OUT_OF_SERVICE
    http: 409
    condition: "the addressed testing room is OUT_OF_SERVICE"
  - id: ERR_PROCTOR_DECISION_NOT_ALLOWED
    http: 409
    condition: "certification decision does not match the proctor's current certification_status (e.g. RENEW on PENDING, any decision on REVOKED)"
  - id: ERR_SECTION_TRANSITION_NOT_ALLOWED
    http: 409
    condition: "target_status is not reachable from the section's current status"
  - id: ERR_SECTION_NOT_ACCEPTING_ENROLLMENT
    http: 409
    condition: "enrollment attempted on a section whose status is PLANNED or CLOSED"
  - id: ERR_ENROLLMENT_NOT_ACTIVE
    http: 409
    condition: "attendance posting or withdrawal attempted on an enrollment that is not ACTIVE"
  - id: ERR_ATTENDANCE_ALREADY_VOIDED
    http: 409
    condition: "void attempted on an attendance entry that is already VOIDED"
  - id: ERR_TEST_EVENT_NOT_SCHEDULED
    http: 409
    condition: "scoring attempted on a test event that is SCORED or INVALIDATED"
  - id: ERR_SESSION_NOT_ASSIGNABLE
    http: 409
    condition: "proctor assignment attempted on a session whose status is not DRAFT"
  - id: ERR_SESSION_NOT_CANCELLABLE
    http: 409
    condition: "cancellation attempted on a session whose status is not DRAFT or SCHEDULED"
  - id: ERR_SESSION_NOT_OPEN_FOR_REGISTRATION
    http: 409
    condition: "registration attempted on a session that is DRAFT, IN_PROGRESS, COMPLETED or CANCELLED"
  - id: ERR_REGISTRATION_NOT_OPEN
    http: 409
    condition: "check-in, identity verification or cancellation attempted on a registration whose registration_status is not REGISTERED"
  - id: ERR_REGISTRATION_NOT_CHECKED_IN
    http: 409
    condition: "result recording attempted on a registration whose registration_status is not CHECKED_IN"
  - id: ERR_IDENTITY_ALREADY_VERIFIED
    http: 409
    condition: "a REJECTED decision is submitted for a registration whose identity_status is already VERIFIED"
  - id: ERR_ACCOMMODATION_NOT_PENDING
    http: 409
    condition: "info request or decision attempted on an accommodation request whose status is not SUBMITTED"
  - id: ERR_ACCOMMODATION_NOT_INFO_REQUESTED
    http: 409
    condition: "resubmission attempted on an accommodation request whose status is not INFO_REQUESTED"
  - id: ERR_OUTCOME_NOT_CERTIFIABLE
    http: 409
    condition: "certification attempted on an outcome record that is already CERTIFIED, REJECTED or RESCINDED"
  - id: ERR_CREDENTIAL_NOT_ISSUED
    http: 409
    condition: "the referenced credential is VOIDED rather than ISSUED"
  - id: ERR_TRANSCRIPT_ORDER_NOT_QUEUED
    http: 409
    condition: "fulfillment attempted on a transcript order whose status is not QUEUED"
  - id: ERR_FUNDING_PERIOD_CLOSED
    http: 409
    condition: "outcome recording, certification, allocation run or close attempted on a CLOSED funding period"
  # --- business safety -----------------------------------------------------
  - id: ERR_PROCTOR_NOT_CERTIFIED
    http: 409
    condition: "the proctor's certification_status is PENDING or REVOKED"
  - id: ERR_PROCTOR_CERTIFICATION_LAPSED
    http: 409
    condition: "the proctor's certification_expires_at is at or before the logical clock, so the proctor lazily lapsed to LAPSED"
  - id: ERR_IDENTITY_NOT_VERIFIED
    http: 409
    condition: "check-in attempted while identity_status is UNVERIFIED or ID_REJECTED"
  - id: ERR_SUBTEST_NOT_AUTHORIZED
    http: 409
    condition: "the session's subtest is not in the owning center's allowed_subtests"
  # --- business referential -----------------------------------------------
  - id: ERR_ACCOMMODATION_OWNER_MISMATCH
    http: 409
    condition: "the referenced accommodation request belongs to a different student than the registration"
  - id: ERR_ACCOMMODATION_NOT_APPROVED
    http: 409
    condition: "the referenced accommodation request is SUBMITTED, INFO_REQUESTED or DENIED"
  - id: ERR_ACCOMMODATION_EXPIRED
    http: 409
    condition: "the referenced accommodation request lazily expired because valid_until is at or before the logical clock"
  - id: ERR_ACCOMMODATION_FORMAT_UNAVAILABLE
    http: 409
    condition: "the session's supported_formats does not contain the accommodation's granted_format"
  - id: ERR_OUTCOME_EVIDENCE_MISMATCH
    http: 409
    condition: "measure_type CREDENTIAL_ATTAINMENT recorded without credential_issuance_id, or with a credential belonging to another student"
  - id: ERR_MSG_NOT_SUPPORTED
    http: 409
    condition: "certification of an EFL_GAIN outcome whose FINAL-variant msg_determination reports msg_achieved false"
  # --- business temporal ---------------------------------------------------
  - id: ERR_SESSION_IN_PAST
    http: 422
    condition: "the session's starts_at is at or before the logical clock"
  - id: ERR_POST_TEST_INTERVAL_NOT_MET
    http: 409
    condition: "fewer than 30 whole UTC days have elapsed since the earliest scored PRE_TEST's test_date"
  - id: ERR_INVALID_SESSION_WINDOW
    http: 422
    condition: "ends_at is not strictly after starts_at, the window exceeds 6 hours, or a test event's scheduled_for precedes the logical clock"
  - id: ERR_CHECK_IN_WINDOW_CLOSED
    http: 409
    condition: "check-in attempted outside [starts_at - 60 minutes, ends_at)"
  - id: ERR_INVALID_EFFECTIVE_WINDOW
    http: 422
    condition: "an approval's valid_until is at or before the logical clock, or an attendance_date is in the future"
  - id: ERR_CLOCK_BACKWARD
    http: 422
    condition: "the requested logical clock value precedes the current logical clock"
  # --- business constraint -------------------------------------------------
  - id: ERR_POST_TEST_HOURS_NOT_MET
    http: 409
    condition: "the enrollment's posted_hours is below MIN_POST_TEST_HOURS (40.00)"
  - id: ERR_ROOM_BUFFER_CONFLICT
    http: 409
    condition: "the requested session window overlaps an existing session in the same room once turnaround_buffer_minutes is added to both trailing edges"
  - id: ERR_PROCTOR_TIME_CONFLICT
    http: 409
    condition: "the proctor already has a live session whose half-open interval overlaps this one"
  - id: ERR_PROCTOR_DAILY_CAP_EXCEEDED
    http: 409
    condition: "the proctor's projected proctoring hours for that UTC date would exceed daily_hour_cap"
  - id: ERR_DUPLICATE_ACTIVE_ENROLLMENT
    http: 409
    condition: "the student already has an ACTIVE enrollment on a section with the same program_track"
  - id: ERR_EFL_LEVEL_OUT_OF_RANGE
    http: 409
    condition: "the student's placement_efl_level falls outside the section's inclusive [min_efl_level, max_efl_level] band"
  - id: ERR_TEST_EVENT_CONFLICT
    http: 409
    condition: "the student already has a SCHEDULED test event with the same purpose"
  - id: ERR_DUPLICATE_CREDENTIAL
    http: 409
    condition: "the student already holds an ISSUED credential"
  - id: ERR_CREDENTIAL_REQUIREMENTS_NOT_MET
    http: 409
    condition: "fewer than four passing subtest results, or composite_score below COMPOSITE_MIN (580)"
  - id: ERR_INFO_REQUEST_LIMIT_REACHED
    http: 409
    condition: "a third information request is attempted on an accommodation request (info_request_rounds already 2)"
  - id: ERR_SECTION_CAPACITY_EXCEEDED
    http: 409
    condition: "the section's seats_taken already equals seats_total"
  - id: ERR_SESSION_SEATS_EXHAUSTED
    http: 409
    condition: "the session's seats_taken already equals seat_capacity"
  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "the student already has a REGISTERED, CHECKED_IN or SCORED registration on this session"
  # --- business fiscal -----------------------------------------------------
  - id: ERR_VOUCHER_INSUFFICIENT
    http: 402
    condition: "the student is not self_pay_authorized and voucher_balance_cents cannot cover the post-discount net fee"
  - id: ERR_VOUCHER_ADJUSTMENT_INVALID
    http: 422
    condition: "a voucher adjustment would drive voucher_balance_cents below 0"

roles:
  - name: StateAuthority
    description: "State adult-education agency officer: authorizes testing centers, certifies proctors, issues credentials, certifies outcome measures and administers performance funding."
    identity: "opaque"
    exclusive_operations: ["create testing centers", "decide center authorization", "suspend a center", "decide proctor certification", "issue credentials", "create funding periods", "run funding allocation", "close funding periods"]
    shared_operations: ["read every entity", "record outcome records", "certify or reject outcome records", "add rooms and proctors to a center", "cancel exam sessions", "intake students", "adjust student vouchers", "set the logical clock"]
  - name: ProgramCoordinator
    description: "Adult-education program coordinator: owns class sections, enrollments, the attendance ledger and outcome recording."
    identity: "opaque"
    exclusive_operations: ["create class sections", "transition class-section status", "create enrollments", "void attendance entries"]
    shared_operations: ["intake students", "complete student orientation", "adjust student vouchers", "post attendance entries", "withdraw enrollments", "schedule test events", "record outcome records", "certify or reject outcome records", "fulfil transcript orders", "read students, sections, enrollments, attendance, test events, sessions, registrations, accommodations, outcomes, credentials, transcripts and funding periods", "set the logical clock"]
  - name: Registrar
    description: "Program registrar: runs intake orientation, testing appointments, exam registrations and transcript/state-records service."
    identity: "opaque"
    exclusive_operations: []
    shared_operations: ["complete student orientation", "schedule test events", "create exam registrations", "cancel exam registrations", "submit and resubmit accommodation requests", "order transcripts on a student's behalf", "fulfil transcript orders", "read students, sections, enrollments, test events, sessions, registrations, accommodations and outcomes", "set the logical clock"]
  - name: Instructor
    description: "Classroom instructor: posts instructional hours for the sections they teach and administers standardized test scoring."
    identity: "opaque"
    exclusive_operations: ["score test events"]
    shared_operations: ["post attendance entries", "withdraw enrollments", "read students, sections, enrollments, attendance entries and test events", "set the logical clock"]
  - name: CenterAdministrator
    description: "Administrator of one authorized testing center; X-User-ID is that center's id. Also rules on accommodation and alternate-format requests the center must be able to deliver."
    identity: "entity_backed:TestingCenter"
    exclusive_operations: ["create exam sessions", "assign proctors to sessions", "issue accommodation information requests", "decide accommodation requests"]
    shared_operations: ["add rooms to their own center", "register proctors at their own center", "cancel their own center's exam sessions", "read their own center, its rooms, proctors, sessions and registrations", "set the logical clock"]
  - name: Proctor
    description: "Certified exam proctor; X-User-ID is that proctor's id. Performs identity verification, seating and result entry for the sessions they are assigned to."
    identity: "entity_backed:Proctor"
    exclusive_operations: ["record identity verification", "check candidates in", "record exam results"]
    shared_operations: ["read their own proctor record, their assigned sessions and those sessions' registrations", "read the logical clock"]
  - name: Student
    description: "Adult-education learner acting on their own record; X-User-ID is that student's id."
    identity: "entity_backed:Student"
    exclusive_operations: []
    shared_operations: ["submit and resubmit their own accommodation requests", "create and cancel their own exam registrations", "order their own transcripts", "read their own student record, enrollments, test events, registrations, accommodation requests, credentials and transcript orders", "read the logical clock"]
