        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB; a request is sent with no auth headers."]
          setup_api_calls: []
          trigger:
            - call: "POST /studios"
              payload: { name: "S" }
              as: Anonymous
          assert:
            - "error_id == ERR_UNAUTHENTICATED and HTTP status == 401 (no role/id headers present)"

