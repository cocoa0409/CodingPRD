      - name: funding_exhaustion_and_clawback_below_obligations_both_reject_at_the_fiscal_band
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PROGRAM_FUNDING_EXHAUSTED]
          - errors[ERR_FUNDING_BELOW_OBLIGATIONS]
          - endpoints.POST /sharps/programs/{id}/funding-adjustments
          - entities.SponsorshipProgram.fields.available_cents
        distinguishing_aspect: "The two fiscal 422s are mirror images on the same balance: issuance is refused when available_cents (35) cannot cover the next reservation (1465), and a clawback is refused when it would push funding_ceiling_cents (1500 - 500 = 1000) below reserved + committed (1465). The boundary is inclusive on the clawback side — trimming the ceiling to exactly 1465 is accepted and flips the program to EXHAUSTED with available_cents == 0."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; CA rule; MANUFACTURER sponsor; program NW-THIN with a 1500-cent ceiling and a 5000-cent per-kit allowance (so the allowance never interferes)."
            - "Dana's enrollment is ACTIVE and her ONE_QUART kit is issued, reserving 1465 and leaving available_cents == 35."
            - "Fern's enrollment is ACTIVE against the same program with no kit yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
