        distinguishing_aspect: "compliance-review is the ComplianceOfficer's exclusive operation: the OpsCoordinator who raised the nomination is refused with 403 ERR_ROLE_NOT_PERMITTED and the nomination stays PENDING_REVIEW with compliance_reviewer_user_id null, so the reviewer identity can never be self-stamped by the intake role."
        test_recipe:
          setup:
            - "Clock set to 2026-08-05T00:00:00Z"
