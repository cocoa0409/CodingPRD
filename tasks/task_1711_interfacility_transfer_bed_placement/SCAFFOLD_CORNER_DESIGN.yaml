              as: SendingPhysician
              as_user_id: "${phys_s}"
              captures: { pkt_v2: $.data.version, pkt_docs: $.data.document_status }
            - call: "POST /clinical-packets/${pkt_id}/documents"
              payload: { documents: ["LABS"], expected_clinical_packet_version: "${pkt_v}" }
              as: SendingPhysician
              as_user_id: "${phys_s}"
              captures: { err: $.data.error_id }
            - call: "POST /clinical-packets/${pkt_id}/documents"
              payload: { documents: ["LABS"], expected_clinical_packet_version: "${pkt_v2}" }
              as: SendingPhysician
              as_user_id: "${phys_s}"
              captures: { pkt_overall: $.data.overall_status }
          assert:
            - "first upload (version 1 -> 2) succeeds; document_status still INCOMPLETE (LABS missing)"
            - "stale upload with the original version -> error_id == ERR_STALE_VERSION with http 412; received_documents unchanged (LABS NOT added)"
            - "retry with the fresh version succeeds and overall_status becomes READY"

