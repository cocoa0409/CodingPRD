              captures: { p_id: $.data.id, p_st0: $.data.status }
            - call: "POST /culinary/price-change-proposals/${p_id}/submit"
              as: RecipeDeveloper
              as_user_id: "user-dev-1"
              captures: { e_submit: $.data.error_id }
            - call: "POST /culinary/menu-items/${mi_id}/activate"
              as: CulinaryDirector
              captures: { mi_st1: $.data.status }
            - call: "POST /culinary/price-change-proposals/${p_id}/submit"
              as: RecipeDeveloper
