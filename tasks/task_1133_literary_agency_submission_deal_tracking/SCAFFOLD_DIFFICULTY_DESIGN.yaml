  # ===========================================================================
  # Rule 6 — boundary_precision_check (2 instances, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: manuscript_accept_eval_score_69_vs_70
        grounds:
          - state_machines.Manuscript.EVALUATED_to_ACCEPTED
          - validations[priority=11]
        distinguishing_aspect: |
          Numeric threshold metric (eval_score) on POST /manuscripts/{id}/accept:
          the rule is >= 70, so 70 exactly must succeed while 69 must fail with
          ERR_SCORE_BELOW_THRESHOLD — a one-integer boundary on the score metric.
        test_recipe:
          setup:
            - "Agency; agent; author; two manuscripts both EVALUATED — ms69 with eval_score 69, ms70 with eval_score 70"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency B1", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "FICTION", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { q1: $.data.id } }
            - { call: "POST /query-letters/${q1}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q1}/request-manuscript", payload: { title: "Book 69" }, as: Agent, as_user_id: "${agent1}", captures: { ms69: $.data.id } }
            - { call: "POST /manuscripts/${ms69}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms69}/evaluate", payload: { eval_score: 69 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "YA", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { q2: $.data.id } }
            - { call: "POST /query-letters/${q2}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q2}/request-manuscript", payload: { title: "Book 70" }, as: Agent, as_user_id: "${agent1}", captures: { ms70: $.data.id } }
            - { call: "POST /manuscripts/${ms70}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms70}/evaluate", payload: { eval_score: 70 }, as: Agent, as_user_id: "${agent1}" }
          trigger:
            - { call: "POST /manuscripts/${ms69}/accept", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { err69: $.data.error_id } }
            - { call: "POST /manuscripts/${ms70}/accept", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { st70: $.data.status } }
          assert:
            - "${err69} == ERR_SCORE_BELOW_THRESHOLD   # 69 < 70 rejected, http 409"
            - "Manuscript.${ms69}.status == EVALUATED"
            - "${st70} == ACCEPTED   # 70 >= 70 succeeds — boundary is inclusive"

      - name: submission_round_open_empty_vs_single_queue
        grounds:
          - state_machines.SubmissionRound.DRAFT_to_OPEN
          - validations[priority=13]
        distinguishing_aspect: |
          DIFFERENT metric (a zero-count / empty-set edge, not a numeric score)
          on a DIFFERENT endpoint (POST /submission-rounds/{id}/open): a round
          with zero QUEUED submissions fails ERR_EMPTY_ROUND, while a round with
          exactly one QUEUED submission opens — the empty-collection boundary.
        test_recipe:
          setup:
            - "Signed pipeline for manuscript ms1; round rEmpty with NO submissions; round rOne with exactly one QUEUED submission (editor edA)"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency B2", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed A", imprint: "IA", email: "eda@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { edA: $.data.id } }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "FICTION", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { q1: $.data.id } }
            - { call: "POST /query-letters/${q1}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q1}/request-manuscript", payload: { title: "Book One" }, as: Agent, as_user_id: "${agent1}", captures: { ms1: $.data.id } }
            - { call: "POST /manuscripts/${ms1}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/evaluate", payload: { eval_score: 80 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/accept", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements", payload: { author_id: "${author1}", manuscript_id: "${ms1}", agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}", captures: { agr1: $.data.id } }
            - { call: "POST /client-agreements/${agr1}/offer", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements/${agr1}/sign", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submission-rounds", payload: { manuscript_id: "${ms1}", agent_id: "${agent1}", max_editors: 5 }, as: Agent, as_user_id: "${agent1}", captures: { rEmpty: $.data.id, rvEmpty: $.data.version } }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "YA", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { q2: $.data.id } }
            - { call: "POST /query-letters/${q2}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q2}/request-manuscript", payload: { title: "Book Two" }, as: Agent, as_user_id: "${agent1}", captures: { ms2: $.data.id } }
            - { call: "POST /manuscripts/${ms2}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms2}/evaluate", payload: { eval_score: 82 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms2}/accept", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements", payload: { author_id: "${author1}", manuscript_id: "${ms2}", agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}", captures: { agr2: $.data.id } }
            - { call: "POST /client-agreements/${agr2}/offer", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements/${agr2}/sign", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submission-rounds", payload: { manuscript_id: "${ms2}", agent_id: "${agent1}", max_editors: 5 }, as: Agent, as_user_id: "${agent1}", captures: { rOne: $.data.id, rvOne: $.data.version } }
            - { call: "POST /submissions", payload: { submission_round_id: "${rOne}", editor_id: "${edA}" }, as: Agent, as_user_id: "${agent1}", captures: { sOne: $.data.id } }
          trigger:
            - { call: "POST /submission-rounds/${rEmpty}/open", payload: { expected_submission_round_version: "${rvEmpty}" }, as: Agent, as_user_id: "${agent1}", captures: { errE: $.data.error_id } }
            - { call: "POST /submission-rounds/${rOne}/open", payload: { expected_submission_round_version: "${rvOne}" }, as: Agent, as_user_id: "${agent1}", captures: { stO: $.data.status } }
          assert:
            - "${errE} == ERR_EMPTY_ROUND   # zero QUEUED submissions, http 409"
            - "SubmissionRound.${rEmpty}.status == DRAFT"
            - "${stO} == OPEN   # exactly one QUEUED submission is sufficient"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (2 instances, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submission_send_requires_round_open
        grounds:
          - state_machines.Submission.QUEUED_to_SENT
          - validations[priority=13]
        distinguishing_aspect: |
          Entity pair Submission -> SubmissionRound: the QUEUED -> SENT
          transition on Submission is gated by the parent round's state; while
          the round is DRAFT the send is rejected ERR_ROUND_NOT_OPEN, and it
          succeeds only after the round transitions DRAFT -> OPEN.
        test_recipe:
          setup:
            - "Signed pipeline; round r1 DRAFT with one QUEUED submission s1 to editor edA"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency X1", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
