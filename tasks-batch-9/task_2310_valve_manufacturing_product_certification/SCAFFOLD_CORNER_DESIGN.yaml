            - "Foundry.${f_id}.revoked_qualification_count == 0"

      - name: corner_qualification_requalify_reopens_expired_window
        claim_type: cyclic
        grounds:
          - state_machines.FoundryQualification.QUALIFIED_to_EXPIRED
          - state_machines.FoundryQualification.EXPIRED_to_PENDING
          - endpoints[POST /valve-mfg/_clock/set_current_utc]
        distinguishing_aspect: "The qualification loop closes: once the clock passes valid_until the row reads EXPIRED, and REQUALIFY with a strictly later window returns it to PENDING with requalification_count 1 and qualified_by_user_id cleared."
        test_recipe:
          setup:
            - "A QUALIFIED CASTING/CF8M qualification valid 2026-01-01 to 2026-12-31."
            - "The logical clock is then moved to 2027-01-15T00:00:00Z, so a read reports EXPIRED."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-C8", name: "Corner Cycle Castings", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications"
              payload: { foundry_id: "${f_id}", process: "CASTING", material_grade: "CF8M", max_pressure_class: 600, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ProcurementSpecialist
              captures: { q_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications/${q_id}/actions"
              payload: { action: "QUALIFY" }
              as: QualityManager
              as_user_id: "qm-c9"
            - call: "POST /valve-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: Any
            - call: "GET /valve-mfg/foundry-qualifications/${q_id}"
              payload: {}
              as: Any
          trigger:
            - call: "POST /valve-mfg/foundry-qualifications/${q_id}/actions"
              payload: { action: "REQUALIFY", valid_from: "2027-02-01T00:00:00Z", valid_until: "2027-12-31T00:00:00Z" }
              as: ProcurementSpecialist
              captures: { q_after: $.data.status }
          assert:
            - "${q_after} == PENDING"
            - "FoundryQualification.${q_id}.requalification_count == 1"
            - "FoundryQualification.${q_id}.valid_from == 2027-02-01T00:00:00Z"
            - "FoundryQualification.${q_id}.valid_until == 2027-12-31T00:00:00Z"
            - "FoundryQualification.${q_id}.qualified_by_user_id == null"

