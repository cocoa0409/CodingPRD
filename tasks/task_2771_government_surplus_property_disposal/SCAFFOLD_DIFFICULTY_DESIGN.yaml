            - "SurplusAsset.${a_f}.fair_market_value_cents == 985946 and SurplusAsset.${a_c}.fair_market_value_cents == 297620 — the gate never alters the valuation"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: cesd_lot_creation_requires_active_venue
        grounds:
          - validations[priority=40]
          - errors.ERR_VENUE_CLOSED
          - state_machines.SaleVenue
          - entities.SaleVenue.fields.status
          - entities.AuctionLot.fields.lot_number
        distinguishing_aspect: |
          The gate lives on a third entity that the request only references: the asset is perfectly
          disposable and the window is valid, yet the create fails because SaleVenue.status == CLOSED.
          CLOSED is terminal, so the caller cannot reopen the venue and must re-address the lot to a
          different venue, whose own lot_number counter starts at 0001 independently.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one STATE_AGENCY organization DOT-01 with an ACCEPTED turn-in"
            - "asset M: FURNITURE, cost 104500, acquired 2024-05-20, assessed C6 / functional / repair 0 -> fair_market_value_cents 12540, which is below DE_MINIMIS_SCREENING_THRESHOLD_CENTS so the asset may be listed straight out of ASSESSED"
            - "venue AUS-01 (capacity 4) and venue AUS-02 (capacity 4), both created ACTIVE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag_st: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag_st}", custody_location: "Austin Yard 4" }
              as: AgencyOfficer
              as_user_id: "${ag_st}"
              captures: { ti1: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti1}", category: "FURNITURE", description: "Four-drawer lateral file cabinets, lot of six", acquisition_cost_cents: 104500, acquisition_date: "2024-05-20" }
              as: AgencyOfficer
              as_user_id: "${ag_st}"
              captures: { a_m: "$.data.id", a_m_v: "$.data.version" }
            - call: "POST /turn-ins/${ti1}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag_st}"
            - call: "POST /assets/${a_m}/condition-assessments"
              payload: { condition_code: "C6", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-30", expected_asset_version: "${a_m_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
            - call: "POST /turn-ins/${ti1}/review"
              payload: { decision: "ACCEPT" }
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /venues"
              payload: { name: "Austin Surplus Yard", venue_code: "AUS-01", concurrent_lot_capacity: 4, buyer_premium_pct: 0.105, sales_tax_pct: 0.0635 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { v_closed: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Round Rock Surplus Annex", venue_code: "AUS-02", concurrent_lot_capacity: 4, buyer_premium_pct: 0.105, sales_tax_pct: 0.0635 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { v_open: "$.data.id" }
          trigger:
            - call: "POST /venues/${v_closed}/status"
              payload: { status: "CLOSED" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /auction-lots"
              payload: { asset_id: "${a_m}", venue_id: "${v_closed}", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-05T00:00:00Z" }
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /auction-lots"
              payload: { asset_id: "${a_m}", venue_id: "${v_open}", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-05T00:00:00Z" }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { lot_ok: "$.data.id" }
          assert:
            - "SurplusAsset.${a_m}.fair_market_value_cents == 12540 and screening_exempt is true, so disposition_status is ASSESSED and no ScreeningCycle is required"
            - "SaleVenue.${v_closed}.status == CLOSED and version == 2 after the status call"
            - "the lot create against ${v_closed} returns 409 with error.code == ERR_VENUE_CLOSED — the asset and the window are both valid; only the referenced venue disqualifies the request"
            - "after the refusal SaleVenue.${v_closed}.active_lot_count == 0 and SurplusAsset.${a_m}.disposition_status == ASSESSED with version unchanged at 2"
            - "GET /auction-lots?venue_id=${v_closed} returns total_count 0 — no partial row was written"
            - "the lot create against ${v_open} returns 201: AuctionLot.${lot_ok}.status == DRAFT, venue_id == ${v_open}"
            - "AuctionLot.${lot_ok}.lot_number == \"AUS-02-0001\" — the counter is per-venue, so the closed venue's rejected attempt consumed no number"
            - "AuctionLot.${lot_ok}.reserve_price_cents == 7524 — round_half_up(12540 * 0.60) — and reserve_source == COMPUTED"
            - "AuctionLot.${lot_ok}.required_deposit_cents == 0 — the reserve is far below DEPOSIT_THRESHOLD_CENTS"
            - "SaleVenue.${v_open}.active_lot_count == 1 and SurplusAsset.${a_m}.disposition_status == LISTED"

      - name: cesd_transfer_order_requires_unlapsed_donee_certification
        grounds:
          - validations[priority=60]
          - errors.ERR_DONEE_CERTIFICATION_INVALID
          - entities.Agency.fields.federal_donee_status
          - entities.Agency.fields.donee_certification_expires_on
          - calculations.transfer_order_price
        distinguishing_aspect: |
          The dependency is on a *date field of a third entity*, not on that entity's state field: the
          nonprofit is ACTIVE and CERTIFIED, its award is valid, and the asset is AWARDED_TRANSFER, yet
          the transfer order is refused because the certification lapsed one day before the logical clock.
          Unlike cesd_lot_creation_requires_active_venue the blocking entity can be repaired in place,
          and the same request then prices normally at the nonprofit tier.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "organizations DOT-01 (STATE_AGENCY, turning in) and NPO-13 (ELIGIBLE_NONPROFIT) created with federal_donee_status CERTIFIED and donee_certification_expires_on 2026-07-31 — certified but lapsed by one day"
            - "one ACCEPTED turn-in with a 2019 pickup assessed C4 / functional / repair 185000 -> fair_market_value_cents 297620"
            - "a ScreeningCycle advanced twice so current_tier == ELIGIBLE_NONPROFIT, NPO-13's request filed and awarded, leaving the asset AWARDED_TRANSFER"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
