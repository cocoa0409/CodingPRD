            - *k_pl4
            - *k_pl5
            - *k_seat1
            - *k_seat2
            - *k_seat3
            - *k_seat4
            - *k_seat5
            - *k_charter
            - *k_round1
            - *k_rev1
            - *k_srev1
            - *k_rev2
            - *k_srev2
            - *k_rev3
            - *k_srev3
            - *k_rev4
            - *k_srev4
            - *k_rev5
            - *k_srev5
            - *k_close_round
            - *x_board_review
            - *x_get_panel
            - *x_slate
            - *x_get_slots
            - *x_get_cyc
            - *x_approve1
            - *x_get_awards
            - *x_accept
            - *x_get_inst
            - { call: "POST /grants/work-samples/${ws1a}/screen", payload: { disposition: FLAGGED_IDENTIFYING }, as: ProgramOfficer, as_user_id: "officer-1" }
            - *x_cycle_awarded
          trigger:
            - { call: "POST /grants/payment-installments/${inst1}/release", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1", captures: { err_p70: "$.data.error_id" } }
            - { call: "POST /grants/work-samples/${ws1a}/redact", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/payment-installments/${inst1}/release", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1", captures: { err_p80: "$.data.error_id" } }
            - *x_clock_jan1
            - *x_rel1
          assert:
            - "Both rules are violated on the first call: posture is FROZEN (unresolved_breach_count 1) and the clock 2026-10-16 is before scheduled_date 2027-01-01"
            - "The first release returns 409 ERR_CYCLE_POSTURE_FROZEN — the P70 cross-entity-state error, not the P80 temporal one"
            - "After redaction only the temporal rule is violated and the identical release returns 409 ERR_INSTALLMENT_NOT_DUE"
            - "After the clock reaches 2027-01-01 the identical release returns 200 with status RELEASED"
            - "The installment's released_by and released_at stay null through both rejections"

      - name: conflict_safety_p75_outranks_panel_membership_p90
        grounds:
          - validations[priority=75]
          - validations[priority=90]
          - state_machines.ConflictDeclaration.DECLARED_to_BLOCKING
          - state_machines.Panelist.SEATED_to_RECUSED
        distinguishing_aspect: |
          A panelist seated on a second panel who also carries a BLOCKING conflict on the
          application must get ERR_CONFLICT_BLOCKS_REVIEW, while an unconflicted panelist on
          that same second panel gets ERR_PANELIST_NOT_ON_PANEL for the identical request, so
          an implementation that validates membership before conflicts reports the wrong error
          for the first caller.
        test_recipe:
          setup:
            - "CycleMain panel SCORING with app1 assigned to it"
            - "A second LITERARY_ARTS panel on a disjoint deliberation window carries two seated readers, plx and ply"
            - "plx has a SAME_INSTITUTION conflict on app1 screened BLOCKING; ply has none"
          setup_api_calls:
            - *k_clock_sep
            - *k_cycle
            - *k_disc
            - *k_open
            - *k_art1
            - *k_app1
            - *k_ws1a
            - *k_ws1b
            - *k_sub1
            - *k_clock_oct16
            - *k_close_cycle
            - *k_elig1
            - *k_panel_review
            - *k_panel
            - *k_pl1
            - *k_pl2
            - *k_pl3
            - *k_pl4
            - *k_pl5
            - *k_seat1
            - *k_seat2
            - *k_seat3
            - *k_seat4
            - *k_seat5
            - *k_charter
            - *k_round1
            - { call: "POST /grants/panels", payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", required_seats: 3, required_regions: [NORTH, CENTRAL, SOUTH], deliberation_window_start: "2026-12-01T00:00:00Z", deliberation_window_end: "2027-01-01T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1", captures: { pan2: "$.data.id" } }
            - { call: "POST /grants/panelists", payload: { panel_id: "${pan2}", person_email: "plx.tribal@example.org", full_name: "Xan Perez", region: TRIBAL, expertise_codes: [LITERARY_ARTS], is_chair: true }, as: ProgramOfficer, as_user_id: "officer-1", captures: { plx: "$.data.id" } }
            - { call: "POST /grants/panelists", payload: { panel_id: "${pan2}", person_email: "ply.coastal@example.org", full_name: "Yu Lindqvist", region: COASTAL, expertise_codes: [LITERARY_ARTS], is_chair: false }, as: ProgramOfficer, as_user_id: "officer-1", captures: { ply: "$.data.id" } }
            - { call: "POST /grants/panelists/${plx}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/panelists/${ply}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/conflicts", payload: { panelist_id: "${plx}", application_id: "${app1}", relationship_type: SAME_INSTITUTION, disclosure_note: "The applicant chairs the board of the press that publishes my anthology." }, as: ProgramOfficer, as_user_id: "officer-1", captures: { cfx: "$.data.id" } }
            - { call: "POST /grants/conflicts/${cfx}/screen", payload: { disposition: BLOCKING }, as: ProgramOfficer, as_user_id: "officer-1" }
          trigger:
