            - "Assignment.${asg_id}.guaranteed_hours_total == 520, guaranteed_hours_remaining == 520, guaranteed_hours_consumed == 0, guaranteed_hours_waived == 0, end_date still 2026-09-05"
            - "Assignment.${asg_id}.projected_gross_bill_cents == 7800000, projected_pay_cost_cents == 5411380, projected_margin_cents == 2388620, projected_margin_pct == 0.3062"
