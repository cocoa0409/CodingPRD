            - "Farm.${farm_id}.refunds_issued_cents == 5200"

      # --- Instance 2: depth-2 group confirm cascade to SOLD_OUT ---
      - name: group_confirm_cascade_depth2_seats_then_soldout
        grounds:
          - state_machines.GroupBooking.QUOTED_to_CONFIRMED
          - entities.AdmissionWindow.fields.seats_committed
          - state_machines.AdmissionWindow.SCHEDULED_to_SOLD_OUT
          - calculations.window_seats
        distinguishing_aspect: |
          Depth-2 from a different trigger (group confirm, not closure): confirming a group of headcount 10
          on a capacity-10 window (L1) drives AdmissionWindow.seats_committed to 10; that committed-seat change
          (L2) drives seats_available to 0 which flips window.status to SOLD_OUT — the L2 hop is caused by the
          L1 seat commit, not directly by the confirm call.
        test_recipe:
          setup:
            - "Farm OPEN; ACTIVE policy; window capacity 10; a FIELD_TRIP GroupBooking of headcount 10 (4 adult 6 child), QUOTED."
