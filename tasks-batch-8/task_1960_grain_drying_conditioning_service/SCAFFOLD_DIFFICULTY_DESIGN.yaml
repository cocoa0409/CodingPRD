            - { call: "POST /grain-drying/moisture-tests/${test2}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
          trigger:
            - { call: "GET /grain-drying/grain-lots/${lot1}/charge-preview", as: ElevatorManager, captures: { ch1: $.data.drying_charge_cents, rate1: $.data.rate_cents_per_pt_bu } }
            - { call: "GET /grain-drying/grain-lots/${lot2}/charge-preview", as: ElevatorManager, captures: { ch2: $.data.drying_charge_cents, rate2: $.data.rate_cents_per_pt_bu } }
          assert:
