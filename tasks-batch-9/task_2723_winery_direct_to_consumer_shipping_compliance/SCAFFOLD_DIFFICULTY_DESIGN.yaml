# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2723 — Winery Direct-to-Consumer Shipping Compliance
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. Every money/liter
# literal in an `assert:` was computed by executing the pinned formulas of
# §1.3 against the fixture values pinned in the same instance's setup.
#
# Shared fixture conventions used throughout:
#   logical clock default                 2026-08-01T00:00:00Z
#   Winery "Estate 1"                     annual_production_gallons 120000
#                                         -> small-producer credit 1500 bps applies
#   StateRule TX                           excise 55 c/L, large-format surcharge 20 c/L,
#                                         cap 100000 c, sales tax 825 bps,
#                                         tax_on_shipping true, excise_in_tax_base false,
#                                         per_consumer_limit 27.000 L / ROLLING_12_MONTHS
#   shipping                              1500 + 220 c/L, tier x1.00 <=9.000 L,
#                                         x0.90 <=18.000 L, x0.80 above; club discount 2500 bps
#   handling fee                          900 c unless pre_fee_total_cents >= 20000
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: remittance_accrual_vs_delivery_basis_diverge
        grounds:
          - calculations.remittance_due_amounts
          - entities.TaxRemittance.fields.basis
          - entities.TaxRemittance.fields.excise_due_cents
          - entities.TaxRemittance.fields.shipment_count
          - state_machines.Order.DRAFT_to_CLEARED
          - state_machines.Shipment.IN_TRANSIT_to_DELIVERED
          - validations[priority=68]
        distinguishing_aspect: |
          Two remittances over the identical July window and the identical two orders return
          different due amounts because ACCRUAL_BASIS selects on Order.cleared_at while
          DELIVERY_BASIS selects on Shipment.delivered_at: 422 c excise / 2 shipments versus
          211 c excise / 1 shipment, from one order cleared 2026-07-28 but delivered 2026-08-03.
        test_recipe:
          setup:
            - "Winery Estate 1 (120000 gallons) holds an ACTIVE TX permit 2026-01-01..2026-12-31 and an APPROVED GSO enrollment."
            - "Consumer Ada is ID-verified and of age (born 1985-04-02)."
            - "Order 1 (6 x 750 ml @ 4200 c) is cleared 2026-07-10 and delivered 2026-07-20."
            - "Order 2 (identical lines) is cleared 2026-07-28 but delivered 2026-08-03."
            - "The logical clock ends at 2026-08-05, after both deliveries."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /dtc/state-rules"
              payload: { state_code: "TX", allows_dtc: true, per_consumer_limit_liters: 27.000, per_consumer_period: "ROLLING_12_MONTHS", per_winery_annual_limit_liters: 5000.000, excise_rate_per_liter_cents: 55, large_format_surcharge_cents_per_liter: 20, excise_cap_cents_per_shipment: 100000, sales_tax_rate_bps: 825, tax_on_shipping: true, excise_in_tax_base: false, adult_signature_required: true, requires_carrier_program: true, reporting_frequency: "MONTHLY", zero_filing_required: true, min_purchaser_age: 21, renewal_lead_days: 45 }
              as: PlatformAdmin
              captures: { sr_tx_id: $.data.id }
            - call: "POST /dtc/state-permits"
              payload: { winery_id: "${w_id}", state_code: "TX", permit_number: "TX-DTC-1", permit_type: "DIRECT_SHIPPER", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { p_tx_id: $.data.id }
            - call: "POST /dtc/state-permits/${p_tx_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/carrier-programs"
              payload: { carrier_code: "GSO", program_name: "Wine Shipper TX", states_served: ["TX"], requires_enrollment: true, adult_signature_service_code: "AS21" }
              as: PlatformAdmin
              captures: { cp_id: $.data.id }
            - call: "GET /dtc/wineries/${w_id}"
              payload: {}
              as: PlatformAdmin
              captures: { w_v1: $.data.version }
            - call: "POST /dtc/carrier-enrollments"
              payload: { winery_id: "${w_id}", carrier_program_id: "${cp_id}", account_number: "ACCT-1", expected_winery_version: "${w_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { ce_id: $.data.id }
            - call: "POST /dtc/carrier-enrollments/${ce_id}/decision"
              payload: { decision: "APPROVED" }
              as: CarrierAgent
            - call: "POST /dtc/consumers"
              payload: { full_name: "Ada Buyer", email: "ada@example.com", birthdate: "1985-04-02", address_line: "12 Vine St", city: "Austin", state_code: "TX", zip_code: "78701" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /dtc/consumers/${c_id}/id-verification"
              payload: { id_verification_method: "DOCUMENT" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /dtc/consumers/${c_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { c_v1: $.data.version }
            - call: "POST /dtc/orders"
              payload: { winery_id: "${w_id}", consumer_id: "${c_id}", ship_to_address_line: "12 Vine St", ship_to_state_code: "TX", ship_to_zip: "78701", lines: [{ sku: "CAB-750", bottle_ml: 750, bottles: 6, unit_price_cents: 4200 }], expected_consumer_version: "${c_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /dtc/orders/${o1_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/shipments"
              payload: { order_id: "${o1_id}", carrier_enrollment_id: "${ce_id}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /dtc/shipments/${s1_id}/scan"
              payload: { scan_type: "PICKUP" }
              as: CarrierAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/shipments/${s1_id}/scan"
              payload: { scan_type: "DELIVERED", signed_by: "Ada Buyer", signer_age_verified: true }
              as: CarrierAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /dtc/consumers/${c_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { c_v2: $.data.version }
            - call: "POST /dtc/orders"
              payload: { winery_id: "${w_id}", consumer_id: "${c_id}", ship_to_address_line: "12 Vine St", ship_to_state_code: "TX", ship_to_zip: "78701", lines: [{ sku: "CAB-750", bottle_ml: 750, bottles: 6, unit_price_cents: 4200 }], expected_consumer_version: "${c_v2}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /dtc/orders/${o2_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/shipments"
              payload: { order_id: "${o2_id}", carrier_enrollment_id: "${ce_id}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /dtc/shipments/${s2_id}/scan"
              payload: { scan_type: "PICKUP" }
              as: CarrierAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/shipments/${s2_id}/scan"
              payload: { scan_type: "DELIVERED", signed_by: "Ada Buyer", signer_age_verified: true }
              as: CarrierAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dtc/remittances"
              payload: { winery_id: "${w_id}", state_code: "TX", period_type: "MONTHLY", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", basis: "ACCRUAL_BASIS" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { r_acc_id: $.data.id }
            - call: "POST /dtc/remittances"
              payload: { winery_id: "${w_id}", state_code: "TX", period_type: "MONTHLY", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", basis: "DELIVERY_BASIS" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { r_del_id: $.data.id }
          assert:
            - "Order.${o1_id}.excise_tax_cents == 211 and Order.${o1_id}.sales_tax_cents == 2284 and Order.${o1_id}.total_cents == 30185"
            - "Order.${o2_id}.excise_tax_cents == 211 and Order.${o2_id}.sales_tax_cents == 2284"
            - "TaxRemittance.${r_acc_id}.shipment_count == 2"
            - "TaxRemittance.${r_acc_id}.liters_total == 9.000"
            - "TaxRemittance.${r_acc_id}.excise_accrued_cents == 422 and TaxRemittance.${r_acc_id}.excise_due_cents == 422"
            - "TaxRemittance.${r_acc_id}.sales_tax_accrued_cents == 4568 and TaxRemittance.${r_acc_id}.sales_tax_due_cents == 4568"
            - "TaxRemittance.${r_acc_id}.included_order_ids == [\"${o1_id}\", \"${o2_id}\"]"
            - "TaxRemittance.${r_del_id}.shipment_count == 1"
            - "TaxRemittance.${r_del_id}.liters_total == 4.500"
            - "TaxRemittance.${r_del_id}.excise_due_cents == 211"
            - "TaxRemittance.${r_del_id}.sales_tax_due_cents == 2284"
            - "TaxRemittance.${r_del_id}.included_order_ids == [\"${o1_id}\"]"
            - "both POST /dtc/remittances calls return 201 — same (winery, state, MONTHLY, July) is legal because the basis differs (validations priority 68)"

      - name: consumer_risk_screening_vs_audit_diverge
        grounds:
          - calculations.consumer_compliance_risk_score
          - calculations.consumer_rolling_volume_liters
          - entities.Consumer.fields.risk_score_screening
          - entities.Consumer.fields.risk_score_audit
          - entities.Consumer.fields.screening_tier
          - entities.VolumeLedgerEntry.fields.occurred_at
        distinguishing_aspect: |
          One MANUAL_ADJUSTMENT of 22.500 L dated 2025-06-01 — outside the ROLLING_12_MONTHS
          window that ends at the 2026-08-01 clock — scores 0 under the SCREENING variant and
          25 under the AUDIT variant, because SCREENING restricts f3 to in-window settled liters
          while AUDIT reads all-time liters; the consumer therefore stays STANDARD and orderable.
        test_recipe:
          setup:
            - "Winery Estate 1, StateRule TX (per_consumer_limit_liters 27.000, ROLLING_12_MONTHS) and ID-verified Consumer Ada exist."
            - "The logical clock is 2026-08-01T00:00:00Z, so the rolling window opens 2025-08-01."
            - "A single MANUAL_ADJUSTMENT ledger entry of 22.500 L for TX is dated 2025-06-01, two months BEFORE the window opens."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /dtc/state-rules"
              payload: { state_code: "TX", allows_dtc: true, per_consumer_limit_liters: 27.000, per_consumer_period: "ROLLING_12_MONTHS", per_winery_annual_limit_liters: 5000.000, excise_rate_per_liter_cents: 55, large_format_surcharge_cents_per_liter: 20, excise_cap_cents_per_shipment: 100000, sales_tax_rate_bps: 825, tax_on_shipping: true, excise_in_tax_base: false, adult_signature_required: true, requires_carrier_program: true, reporting_frequency: "MONTHLY", zero_filing_required: true, min_purchaser_age: 21, renewal_lead_days: 45 }
              as: PlatformAdmin
              captures: { sr_tx_id: $.data.id }
            - call: "POST /dtc/consumers"
              payload: { full_name: "Ada Buyer", email: "ada@example.com", birthdate: "1985-04-02", address_line: "12 Vine St", city: "Austin", state_code: "TX", zip_code: "78701" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /dtc/consumers/${c_id}/id-verification"
              payload: { id_verification_method: "DOCUMENT" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
          trigger:
            - call: "POST /dtc/volume-ledger-entries"
              payload: { consumer_id: "${c_id}", winery_id: "${w_id}", state_code: "TX", liters: 22.500, occurred_at: "2025-06-01T00:00:00Z", reason: "Historical volume migrated from legacy compliance system" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { vle_id: $.data.id }
          assert:
            - "the POST returns 201 and VolumeLedgerEntry.${vle_id}.event_type == \"MANUAL_ADJUSTMENT\""
            - "VolumeLedgerEntry.${vle_id}.liters == 22.500 and VolumeLedgerEntry.${vle_id}.occurred_at == \"2025-06-01T00:00:00Z\""
            - "Consumer.${c_id}.risk_score_screening == 0"
            - "Consumer.${c_id}.risk_score_audit == 25"
            - "Consumer.${c_id}.screening_tier == \"STANDARD\""
            - "GET /dtc/consumers/${c_id}/volume-summary returns risk_score_screening 0 and risk_score_audit 25 in the same payload"
            - "Consumer.${c_id}.rolling_liters_by_state has no TX volume inside the window (0.000), while the AUDIT scope sees 22.500"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sales_tax_round_per_line_then_sum_beats_sum_then_round
        grounds:
          - calculations.order_sales_tax_cents
          - calculations.order_charge_evaluation_chain
          - entities.OrderLine.fields.allocated_shipping_cents
          - entities.OrderLine.fields.line_taxable_cents
          - entities.OrderLine.fields.line_sales_tax_cents
          - entities.Order.fields.sales_tax_cents
        distinguishing_aspect: |
          Mode (b) rounding-order sensitivity: two lines whose taxable bases are each exactly
          10008 c at 825 bps give 826 + 826 = 1652 c when each line is rounded half-up and then
          summed, but 1651 c when the bases are summed (20016 c) and rounded once — the scaffold
          pins round-per-line-then-sum, so Order.sales_tax_cents MUST be 1652.
        test_recipe:
          setup:
            - "Winery Estate 1 and StateRule TX (sales tax 825 bps, tax_on_shipping true, excise_in_tax_base false) exist."
            - "Consumer Ada exists; no screening is involved because every money field is frozen by POST /dtc/orders."
            - "The order carries TWO lines of 3 x 750 ml @ 2921 c, i.e. 2.250 L and 8763 c each, 4.500 L and 17526 c in total."
            - "Shipping is 1500 + 220*4.500 = 2490 c at tier x1.00, and the whole 2490 c enters the tax base split 1245/1245 by equal liters."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /dtc/state-rules"
              payload: { state_code: "TX", allows_dtc: true, per_consumer_limit_liters: 27.000, per_consumer_period: "ROLLING_12_MONTHS", per_winery_annual_limit_liters: 5000.000, excise_rate_per_liter_cents: 55, large_format_surcharge_cents_per_liter: 20, excise_cap_cents_per_shipment: 100000, sales_tax_rate_bps: 825, tax_on_shipping: true, excise_in_tax_base: false, adult_signature_required: true, requires_carrier_program: true, reporting_frequency: "MONTHLY", zero_filing_required: true, min_purchaser_age: 21, renewal_lead_days: 45 }
              as: PlatformAdmin
              captures: { sr_tx_id: $.data.id }
            - call: "POST /dtc/consumers"
              payload: { full_name: "Ada Buyer", email: "ada@example.com", birthdate: "1985-04-02", address_line: "12 Vine St", city: "Austin", state_code: "TX", zip_code: "78701" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "GET /dtc/consumers/${c_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { c_v1: $.data.version }
          trigger:
            - call: "POST /dtc/orders"
              payload: { winery_id: "${w_id}", consumer_id: "${c_id}", ship_to_address_line: "12 Vine St", ship_to_state_code: "TX", ship_to_zip: "78701", lines: [{ sku: "CAB-750", bottle_ml: 750, bottles: 3, unit_price_cents: 2921 }, { sku: "MER-750", bottle_ml: 750, bottles: 3, unit_price_cents: 2921 }], expected_consumer_version: "${c_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { o_id: $.data.id }
          assert:
            - "Order.${o_id}.total_liters == 4.500 and Order.${o_id}.subtotal_cents == 17526"
            - "Order.${o_id}.shipping_gross_cents == 2490 and Order.${o_id}.shipping_cents == 2490"
            - "Order.${o_id}.excise_tax_cents == 211"
            - "GET /dtc/orders/${o_id}/lines returns two rows with line_index 1 and 2"
            - "each OrderLine.allocated_shipping_cents == 1245 (2490 split by equal liters, remainder 0)"
            - "each OrderLine.line_taxable_cents == 10008 and each OrderLine.line_sales_tax_cents == 826"
            - "Order.${o_id}.sales_tax_cents == 1652 — NOT 1651, which is what summing the bases and rounding once would produce"
            - "Order.${o_id}.pre_fee_total_cents == 21879 and Order.${o_id}.compliance_handling_fee_cents == 0"
            - "Order.${o_id}.total_cents == 21879"

      - name: handling_fee_waiver_uses_pre_fee_total_pinned_order
        grounds:
          - calculations.order_charge_evaluation_chain
          - entities.Order.fields.pre_fee_total_cents
          - entities.Order.fields.compliance_handling_fee_cents
          - entities.Order.fields.shipping_discount_cents
          - entities.ClubSubscription.fields.cadence
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: the club order's pre_fee_total_cents is 19119 c, which
          is below FEE_WAIVER_THRESHOLD_CENTS 20000, so the 900 c fee applies and total_cents is
          20019 c. Testing the threshold against total_cents instead would waive the fee and
          return 19119 c — the same inputs, one step out of order.
        test_recipe:
          setup:
            - "Winery Estate 1 and StateRule TX exist; Consumer Ada is STANDARD tier so a club subscription may be opened."
            - "ClubSubscription: MONTHLY, 6 x 750 ml @ 2600 c, next_run_date 2026-08-15, annual_allotment 12."
            - "The order is placed against that subscription, so the 2500 bps club shipping discount applies."
            - "Chain: liters 4.500, subtotal 15600, shipping_gross 2490 at tier x1.00, discount round_half_up(2490*0.25)=623, shipping 1867, excise 211, tax base 15600+1867=17467 at 825 bps = 1441."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /dtc/state-rules"
              payload: { state_code: "TX", allows_dtc: true, per_consumer_limit_liters: 27.000, per_consumer_period: "ROLLING_12_MONTHS", per_winery_annual_limit_liters: 5000.000, excise_rate_per_liter_cents: 55, large_format_surcharge_cents_per_liter: 20, excise_cap_cents_per_shipment: 100000, sales_tax_rate_bps: 825, tax_on_shipping: true, excise_in_tax_base: false, adult_signature_required: true, requires_carrier_program: true, reporting_frequency: "MONTHLY", zero_filing_required: true, min_purchaser_age: 21, renewal_lead_days: 45 }
              as: PlatformAdmin
              captures: { sr_tx_id: $.data.id }
            - call: "POST /dtc/consumers"
              payload: { full_name: "Ada Buyer", email: "ada@example.com", birthdate: "1985-04-02", address_line: "12 Vine St", city: "Austin", state_code: "TX", zip_code: "78701" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /dtc/club-subscriptions"
              payload: { consumer_id: "${c_id}", winery_id: "${w_id}", cadence: "MONTHLY", sku: "CLUB-750", bottles_per_shipment: 6, bottle_ml: 750, unit_price_cents: 2600, next_run_date: "2026-08-15", annual_allotment: 12 }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { cs_id: $.data.id }
            - call: "GET /dtc/consumers/${c_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { c_v1: $.data.version }
          trigger:
            - call: "POST /dtc/orders"
              payload: { winery_id: "${w_id}", consumer_id: "${c_id}", club_subscription_id: "${cs_id}", ship_to_address_line: "12 Vine St", ship_to_state_code: "TX", ship_to_zip: "78701", lines: [{ sku: "CLUB-750", bottle_ml: 750, bottles: 6, unit_price_cents: 2600 }], expected_consumer_version: "${c_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { o_id: $.data.id }
          assert:
            - "Order.${o_id}.subtotal_cents == 15600 and Order.${o_id}.total_liters == 4.500"
            - "Order.${o_id}.shipping_gross_cents == 2490 and Order.${o_id}.shipping_tiered_cents == 2490"
            - "Order.${o_id}.shipping_discount_cents == 623 and Order.${o_id}.shipping_cents == 1867"
            - "Order.${o_id}.excise_tax_cents == 211 and Order.${o_id}.sales_tax_cents == 1441"
            - "Order.${o_id}.pre_fee_total_cents == 19119"
            - "Order.${o_id}.compliance_handling_fee_cents == 900 — the waiver test reads pre_fee_total_cents, which is 881 c short of the 20000 c threshold"
            - "Order.${o_id}.total_cents == 20019 — a post-fee comparison would have waived the fee and produced 19119"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_dimensions_compliance_and_fulfillment_independent
        grounds:
          - state_machines.Order.CLEARED_to_SUSPENDED_PERMIT
