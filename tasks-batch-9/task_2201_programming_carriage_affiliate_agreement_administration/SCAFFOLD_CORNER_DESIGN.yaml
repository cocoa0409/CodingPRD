              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                bo_id: "id"
            - call: "POST /carriage/rights-windows"
              payload:
                agreement_id: "${am_id}"
                content_title_id: "${ct_id}"
                platform: "LINEAR"
                territory_code: "US"
                window_start: "2026-09-05T20:00:00Z"
                window_end: "2026-09-06T00:00:00Z"
                exclusivity: "NON_EXCLUSIVE"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
