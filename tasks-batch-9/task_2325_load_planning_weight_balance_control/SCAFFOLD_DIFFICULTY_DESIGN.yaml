      - name: load_sheet_branch_accept_vs_reject_divergent_side_effects
        entity: LoadSheet
        shape: "branching fork ISSUED -> {ACCEPTED, REJECTED_BY_CAPTAIN} with divergent side-effect sets"
        grounds:
          - state_machines.LoadSheet.transitions.ISSUED_to_ACCEPTED
          - state_machines.LoadSheet.transitions.ISSUED_to_REJECTED_BY_CAPTAIN
          - state_machines.LoadPlan.transitions.SHEET_ISSUED_to_COMPUTED
        distinguishing_aspect: |
          A third, different entity. From one state the sheet forks into two arms
          whose side-effect sets do not overlap: accept releases the flight and
          promotes assigned cargo to LOADED while leaving the plan at
          SHEET_ISSUED; reject leaves the flight at OPEN, touches no CargoItem and
          drags the parent plan back to COMPUTED so a corrected sheet can be
