              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 10000, declaration_date: "2026-03-01", record_date: "2026-03-10", payable_date: "2026-03-20", expected_reit_version: "${reit_v}" }
              as: ComplianceOfficer
              captures: { d1_id: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "Dom", holder_type: "INDIVIDUAL" }
              as: ComplianceOfficer
              captures: { sh_dom: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "Pub", holder_type: "ENTITY" }
              as: ComplianceOfficer
              captures: { sh_pub: $.data.id }
            - call: "POST /reit-compliance/shareholder-snapshots"
              payload: { reit_id: "${reit_id}", snapshot_date: "2026-06-30", total_shares_outstanding: 1000 }
              as: ComplianceOfficer
              captures: { snap_id: $.data.id }
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${sh_dom}", shares_held: 600 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${sh_pub}", shares_held: 400 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-snapshots/${snap_id}/finalize"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/approve"
              payload: {}
              as: BoardDirector
              as_user_id: "director-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FIVE_FIFTY_BLOCKED (http 409)"

      - name: error_stale_version_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / create_adjustment_bad_enum_and_stale_version
          rationale: "ERR_STALE_VERSION directly asserted in corner instance stale_version_on_dividend_create_rejected; the §1.8 instance exercises the same rule's priority interaction."

      - name: error_requirement_not_posted_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_REQUIREMENT_NOT_POSTED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / dividend_declare_requires_posted_requirement
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_invalid_date_range_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_DATE_RANGE]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / snapshot_point_date_collision_on_half_year_grid
          rationale: "Asserted via the off-grid snapshot date in the named §1.8 instance and in dividend_record_date_before_declaration_rejected."

      - name: error_duplicate_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / snapshot_point_date_collision_on_half_year_grid
          rationale: "ERR_DUPLICATE asserted in the named §1.8 instance and in duplicate_ticker_rejected."

