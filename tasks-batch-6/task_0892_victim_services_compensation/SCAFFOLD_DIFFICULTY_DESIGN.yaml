          - state_machines.Claim.DRAFT_to_SUBMITTED
          - entities.Claim.fields.disability_start_date
          - errors[ERR_WAGE_PERIOD_OVERLAP]
        distinguishing_aspect: "LOST_WAGE disability periods are half-open [start,end): claim2 [2026-02-01,2026-03-01) is adjacent to claim1 [2026-01-01,2026-02-01) and is accepted; claim3 [2026-01-15,2026-02-15) overlaps claim1 and is rejected. Resource = case wage timeline."
        test_recipe:
          setup:
            - "ELIGIBLE case; LOST_WAGE claim1 [2026-01-01,2026-02-01) SUBMITTED; LOST_WAGE claim2 [2026-02-01,2026-03-01) SUBMITTED (adjacent, accepted); LOST_WAGE claim3 [2026-01-15,2026-02-15) created but not yet submitted."
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "DUI", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: Adjudicator
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "LOST_WAGE", weekly_wage_cents: 100000, num_weeks: 4, disability_start_date: "2026-01-01", disability_end_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { claim1: $.data.id }
            - call: "POST /compensation/claims/${claim1}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "LOST_WAGE", weekly_wage_cents: 100000, num_weeks: 4, disability_start_date: "2026-02-01", disability_end_date: "2026-03-01" }
              as: IntakeCounselor
              captures: { claim2: $.data.id }
            - call: "POST /compensation/claims/${claim2}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
              captures: { claim2_status: $.data.status }
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "LOST_WAGE", weekly_wage_cents: 100000, num_weeks: 4, disability_start_date: "2026-01-15", disability_end_date: "2026-02-15" }
              as: IntakeCounselor
              captures: { claim3: $.data.id }
          trigger:
            - call: "POST /compensation/claims/${claim3}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
              captures: { err: $.data.error_id }
          assert:
            - "${claim2_status} == SUBMITTED"
            - "${err} == ERR_WAGE_PERIOD_OVERLAP"

      - name: collateral_closed_periods_touching_endpoint_rejected
        grounds:
          - validations[priority=12]
          - state_machines.CollateralSource.DECLARED_to_CONFIRMED
          - entities.CollateralSource.fields.coverage_start_date
          - errors[ERR_COLLATERAL_PERIOD_OVERLAP]
        distinguishing_aspect: "CollateralSource coverage is a CLOSED interval [start,end]: confirming s2 [2026-02-01,2026-03-01] while same-type s1 [2026-01-01,2026-02-01] is already CONFIRMED conflicts because the shared endpoint 2026-02-01 is inside both closed intervals — adjacency conflicts here, unlike the half-open wage rule. Resource = CollateralSource."
        test_recipe:
          setup:
            - "ELIGIBLE case; MEDICAL claim; CONFIRMED HEALTH_INSURANCE collateral s1 [2026-01-01,2026-02-01]; s2 HEALTH_INSURANCE [2026-02-01,2026-03-01] still DECLARED."
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: Adjudicator
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "MEDICAL", claimed_amount_cents: 1000000 }
              as: IntakeCounselor
              captures: { claim_id: $.data.id }
            - call: "POST /compensation/collateral-sources"
              payload: { claim_id: "${claim_id}", source_type: "HEALTH_INSURANCE", amount_cents: 200000, coverage_start_date: "2026-01-01", coverage_end_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { cs1_id: $.data.id }
            - call: "POST /compensation/collateral-sources/${cs1_id}/transition"
              payload: { to_status: "CONFIRMED" }
              as: Adjudicator
            - call: "POST /compensation/collateral-sources"
              payload: { claim_id: "${claim_id}", source_type: "HEALTH_INSURANCE", amount_cents: 150000, coverage_start_date: "2026-02-01", coverage_end_date: "2026-03-01" }
              as: IntakeCounselor
              captures: { cs2_id: $.data.id }
          trigger:
            - call: "POST /compensation/collateral-sources/${cs2_id}/transition"
              payload: { to_status: "CONFIRMED" }
              as: Adjudicator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_COLLATERAL_PERIOD_OVERLAP"

  - rule_id: compensating_invariant
    instances:
      - name: disbursement_clawback_conserves_budget_disbursed
        grounds:
          - state_machines.Disbursement.PAID_to_CLAWED_BACK
          - state_machines.Disbursement.SCHEDULED_to_PAID
          - entities.Program.fields.budget_disbursed_cents
        distinguishing_aspect: "Conserved quantity = Program.budget_disbursed_cents: PAID adds amount_cents (+1,000,000) and CLAWED_BACK subtracts it (-1,000,000); after the pair the ledger returns to 0, and Award.amount_paid_cents returns to 0."
        test_recipe:
          setup:
            - "ELIGIBLE case, APPROVED claim net=1,000,000, Award FINALIZED, disbursement 1,000,000 PAID (budget_disbursed=1,000,000)."
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: Adjudicator
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "MEDICAL", claimed_amount_cents: 1000000 }
              as: IntakeCounselor
              captures: { claim_id: $.data.id }
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "APPROVED", verified_amount_cents: 1000000 }
              as: Adjudicator
            - call: "POST /compensation/awards"
              payload: { case_id: "${case_id}", expected_program_version: "${prog_v}" }
              as: Adjudicator
              captures: { award_id: $.data.id }
            - call: "POST /compensation/awards/${award_id}/transition"
              payload: { to_status: "APPROVED" }
              as: Adjudicator
            - call: "POST /compensation/awards/${award_id}/transition"
              payload: { to_status: "FINALIZED" }
              as: FinanceOfficer
            - call: "POST /compensation/disbursements"
              payload: { award_id: "${award_id}", payee_type: "MEDICAL_PROVIDER", amount_cents: 1000000, pay_run_date: "2026-05-10" }
              as: FinanceOfficer
              captures: { disb_id: $.data.id }
            - call: "POST /compensation/disbursements/${disb_id}/transition"
              payload: { to_status: "PAID" }
              as: FinanceOfficer
          trigger:
            - call: "POST /compensation/disbursements/${disb_id}/transition"
              payload: { to_status: "CLAWED_BACK" }
              as: FinanceOfficer
            - call: "GET /compensation/programs/${prog_id}"
              payload: {}
              as: ProgramAdmin
              captures: { disbursed: $.data.budget_disbursed_cents }
            - call: "GET /compensation/awards/${award_id}"
              payload: {}
              as: FinanceOfficer
              captures: { paid: $.data.amount_paid_cents, pay: $.data.payment_status }
          assert:
            - "${disbursed} == 0"
            - "${paid} == 0"
            - "${pay} == UNPAID"

      - name: receipt_void_conserves_budget_recovered
        grounds:
          - state_machines.RecoveryReceipt.RECORDED_to_VOID
          - calculations.recovery_recovered
          - entities.Program.fields.budget_recovered_cents
          - entities.RestitutionRecovery.fields.recovered_amount_cents
        distinguishing_aspect: "Conserved quantity = Program.budget_recovered_cents (and RestitutionRecovery.recovered_amount_cents): recording a 200,000 receipt adds it and voiding it subtracts it, returning both totals to 0 — a different conserved quantity than budget_disbursed."
        test_recipe:
          setup:
            - "Program; case; RestitutionRecovery ordered=500,000; one RECORDED receipt of 200,000 (recovered=200,000, budget_recovered=200,000)."
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/recoveries"
              payload: { case_id: "${case_id}", offender_name: "John Doe", ordered_amount_cents: 500000 }
              as: RecoveryOfficer
              captures: { rec_id: $.data.id }
            - call: "POST /compensation/recoveries/${rec_id}/receipts"
              payload: { amount_cents: 200000, received_date: "2026-05-05" }
              as: RecoveryOfficer
              captures: { receipt_id: $.data.id }
          trigger:
            - call: "POST /compensation/receipts/${receipt_id}/transition"
              payload: { to_status: "VOID" }
              as: RecoveryOfficer
            - call: "GET /compensation/recoveries/${rec_id}"
              payload: {}
              as: RecoveryOfficer
              captures: { recovered: $.data.recovered_amount_cents }
            - call: "GET /compensation/programs/${prog_id}"
              payload: {}
              as: ProgramAdmin
              captures: { budget_recovered: $.data.budget_recovered_cents }
          assert:
            - "${recovered} == 0"
            - "${budget_recovered} == 0"
