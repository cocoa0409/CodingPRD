                records:
                  - { person_ref: "e01", department: "ENG", completed: true }
                  - { person_ref: "e02", department: "ENG", completed: true }
                  - { person_ref: "e03", department: "ENG", completed: true }
                  - { person_ref: "e04", department: "ENG", completed: true }
                  - { person_ref: "e05", department: "ENG", completed: true }
                  - { person_ref: "e06", department: "ENG", completed: true }
                  - { person_ref: "e07", department: "ENG", completed: true }
                  - { person_ref: "e08", department: "ENG", completed: true }
                  - { person_ref: "e09", department: "ENG", completed: true }
                  - { person_ref: "e10", department: "ENG", completed: true }
                  - { person_ref: "e11", department: "ENG", completed: true }
                  - { person_ref: "e12", department: "ENG", completed: true }
                  - { person_ref: "e13", department: "ENG", completed: true }
                  - { person_ref: "e14", department: "ENG", completed: true }
                  - { person_ref: "e15", department: "ENG", completed: true }
                  - { person_ref: "e16", department: "ENG", completed: true }
                  - { person_ref: "e17", department: "ENG", completed: true }
                  - { person_ref: "e18", department: "ENG", completed: true }
                  - { person_ref: "e19", department: "ENG", completed: true }
                  - { person_ref: "e20", department: "ENG", completed: true }
                  - { person_ref: "p01", department: "OPS", completed: true }
                  - { person_ref: "p02", department: "OPS", completed: true }
                  - { person_ref: "p03", department: "OPS", completed: true }
                  - { person_ref: "p04", department: "OPS", completed: true }
                  - { person_ref: "p05", department: "OPS", completed: true }
                  - { person_ref: "p06", department: "OPS", completed: true }
                  - { person_ref: "p07", department: "OPS", completed: true }
                  - { person_ref: "p08", department: "OPS", completed: true }
                  - { person_ref: "p09", department: "OPS", completed: true }
                  - { person_ref: "p10", department: "OPS", completed: false }
              as: BusinessOwner
              as_user_id: "${bo_id}"
              captures: { ro_pct: $.data.completion_pct }
          trigger:
            - call: "POST /compliance/training-rollouts/${ro_id}/complete"
              payload: {}
              as: BusinessOwner
              as_user_id: "${bo_id}"
              captures: { ro_status: $.data.status }
          assert:
            - "TrainingRollout.${ro_id}.completion_pct == 95.0 (per-department rounded mean: (100.0 + 90.0) / 2; pooled would give 96.7)"
            - "TrainingRollout.${ro_id}.assigned_count == 30 and completed_count == 29"
            - "POST complete succeeds; status == COMPLETED (95.0 >= 95.0 threshold)"

      - name: cf_compliance_index_evaluation_order
        grounds:
          - calculations.compliance_index
          - entities.CommitteeReport.fields.metrics
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — tier weights depend on category shares,
          shares depend on the total, the total is the sum of the categories; the pinned
          evaluation order (counts -> total -> shares -> tier lookup -> penalty sum) yields
          exactly 40.0 for c1=1, c2=1, c3=1, while any order that derives penalties before
          shares is ill-defined.
        test_recipe:
          setup:
            - "One CRITICAL-obligation plan IN_EXECUTION with target 2026-08-10 (approved while register is at version 0)"
            - "An APPROVED mapping (weight 4, never-reviewed control -> effectiveness 0.5) keeps gap residual at 30.0 so NO zero-coverage escalation fires"
            - "One extra RegulatoryChange left in PENDING_TRIAGE"
            - "Logical clock advanced to 2026-08-20T00:00:00Z: plan flips OVERDUE and one DEADLINE_BREACH escalation is OPEN"
            - "Report window [2026-08-01, 2026-09-01)"
          setup_api_calls:
            - call: "POST /compliance/business-owners"
              payload: { name: "Rhea Patel", department: "OPS", email: "rhea@x.com" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { bo_id: $.data.id }
            - call: "POST /compliance/regulatory-changes"
              payload: { citation: "CI-1", title: "Change one", summary: "s", feed_source: "FED_REGISTER", jurisdiction: "US-FED", regulator: "CFPB", published_at: "2026-07-15T00:00:00Z", effective_date: "2026-09-15T00:00:00Z", severity_hint: "CRITICAL" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ch1: $.data.id }
            - call: "POST /compliance/regulatory-changes/${ch1}/triage"
