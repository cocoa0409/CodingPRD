  - rule_id: cross_entity_state_dependency
    instances:
      - name: dataset_delivery_gated_on_parent_records_request_status
        grounds:
          - validations[priority=120]
          - state_machines.Dataset.RAW_to_CLEANING
          - state_machines.RecordsRequest.AWAITING_AGENCY_RESPONSE_to_PARTIALLY_RELEASED
          - calculations.dataset_retention_expiry
          - entities.Dataset.fields.format_negotiation_status
        distinguishing_aspect: |
          Whether a Dataset may leave RAW is decided entirely by a field on a DIFFERENT entity - the
          parent RecordsRequest's status - and by a retention policy stored on a THIRD entity (the Desk,
          reached only through RecordsRequest.desk_id). Nothing about the Dataset row itself changes
          between the refused call and the accepted one; only the parent's status does, and the accepted
          call must reach two hops out to stamp retention_expires_at.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "One Desk with retention_policy_days 1095, one Agency."
            - "One RecordsRequest submitted and left in AWAITING_AGENCY_RESPONSE (the agency has not yet decided)."
            - "One Investigation and one RAW Dataset whose negotiated_format is CSV, linked to that request."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
