scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: boil_off_rule86_vs_rule882
    grounds:
    - calculations.boil_off_yield
    - state_machines.EvaporatorBatch.FILLING_to_BOILING
    distinguishing_aspect: 'Same batch inputs produce two different syrup figures because the

      provisional variant divides by RULE_86 (86) while the final variant

      divides by RULE_88_2 (88.2): 3.81 != 3.72 for identical 160 gal @ 2.05 brix.

      '
    test_recipe:
      setup:
      - Season 2027 OPEN; bush North Woods LIVE with one ACTIVE 100-tap line; window 2027-03-01..2027-03-10 OPEN; tapper and boiler ACTIVE
      - 'run1: 100 gal @ 2.0 brix collected at clock 2027-03-02T00:00:00Z, CONFIRMED'
      - 'run2: 60 gal @ 3.0 brix collected at clock 2027-03-03T00:00:00Z, CONFIRMED'
      - batch (capacity 200) drawn 100 from run1 and 60 from run2; boil started at clock 2027-03-04T12:00:00Z
      setup_api_calls:
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-02-15T00:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/seasons
        payload:
          year: 2027
          opens_on: '2027-02-01'
          closes_on: '2027-04-15'
          planned_taps: 10000
        as: SugarhouseManager
        captures:
          season_id: $.data.id
      - call: POST /sugarhouse/seasons/${season_id}/open
        as: SugarhouseManager
        captures:
          season_v: $.data.version
      - call: POST /sugarhouse/sugarbushes
        payload:
          season_id: ${season_id}
          name: North Woods
          tap_capacity: 5000
        as: SugarhouseManager
        captures:
          bush_id: $.data.id
      - call: POST /sugarhouse/sugarbushes/${bush_id}/begin-tapping
        as: SugarhouseManager
      - call: POST /sugarhouse/tap-lines
        payload:
          sugarbush_id: ${bush_id}
          line_code: L1
          tap_count: 100
          vacuum_target_inhg: 25.0
        as: SugarhouseManager
        captures:
          line1_id: $.data.id
      - call: POST /sugarhouse/tap-lines/${line1_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/sugarbushes/${bush_id}/go-live
        as: SugarhouseManager
      - call: POST /sugarhouse/weather-windows
        payload:
          season_id: ${season_id}
          opens_at: '2027-03-01T00:00:00Z'
          closes_at: '2027-03-10T00:00:00Z'
          forecast_min_f: 28.0
          forecast_max_f: 42.0
          expected_season_version: ${season_v}
        as: SugarhouseManager
        captures:
          win_id: $.data.id
      - call: POST /sugarhouse/crew-members
        payload:
          season_id: ${season_id}
          name: Tammy Tapper
          crew_role: TAPPER
        as: SugarhouseManager
        captures:
          tapper_id: $.data.id
      - call: POST /sugarhouse/crew-members/${tapper_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/crew-members
        payload:
          season_id: ${season_id}
          name: Bob Boiler
          crew_role: BOILER
        as: SugarhouseManager
        captures:
          boiler_id: $.data.id
      - call: POST /sugarhouse/crew-members/${boiler_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-03-01T12:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/weather-windows/${win_id}/open
        as: SugarhouseManager
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-03-02T00:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/sap-runs
        payload:
          sugarbush_id: ${bush_id}
          weather_window_id: ${win_id}
          collected_by: ${tapper_id}
          gallons_collected: 100.0
          measured_brix: 2.0
        as: FieldCrew
        as_user_id: ${tapper_id}
        captures:
          run1_id: $.data.id
      - call: POST /sugarhouse/sap-runs/${run1_id}/confirm
        as: FieldCrew
        as_user_id: ${tapper_id}
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-03-03T00:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/sap-runs
        payload:
          sugarbush_id: ${bush_id}
          weather_window_id: ${win_id}
          collected_by: ${tapper_id}
          gallons_collected: 60.0
          measured_brix: 3.0
        as: FieldCrew
        as_user_id: ${tapper_id}
        captures:
          run2_id: $.data.id
      - call: POST /sugarhouse/sap-runs/${run2_id}/confirm
        as: FieldCrew
        as_user_id: ${tapper_id}
      - call: POST /sugarhouse/batches
        payload:
          season_id: ${season_id}
          boiled_by: ${boiler_id}
          evaporator_capacity_gal: 200
        as: SugarMaker
        as_user_id: ${boiler_id}
        captures:
          batch_id: $.data.id
      - call: POST /sugarhouse/batches/${batch_id}/intakes
        payload:
          sap_run_id: ${run1_id}
          gallons_drawn: 100.0
        as: SugarMaker
        as_user_id: ${boiler_id}
      - call: POST /sugarhouse/batches/${batch_id}/intakes
        payload:
          sap_run_id: ${run2_id}
          gallons_drawn: 60.0
        as: SugarMaker
        as_user_id: ${boiler_id}
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-03-04T12:00:00Z'
        as: SugarhouseManager
      trigger:
      - call: POST /sugarhouse/batches/${batch_id}/start-boil
        as: SugarMaker
        as_user_id: ${boiler_id}
        captures:
          est: $.data.estimated_syrup_gallons
          exp: $.data.expected_syrup_gallons
      assert:
      - EvaporatorBatch.${batch_id}.sap_gallons_in == 160.00
      - EvaporatorBatch.${batch_id}.input_brix == 2.05
      - EvaporatorBatch.${batch_id}.estimated_syrup_gallons == 3.81  (Rule of 86)
      - EvaporatorBatch.${batch_id}.expected_syrup_gallons == 3.72  (Rule of 88.2)
      - estimated_syrup_gallons != expected_syrup_gallons for identical inputs
  - name: royalty_provisional_vs_final_settlement
    grounds:
    - calculations.lease_royalty_accrual
    - state_machines.Season.CLOSED_to_RECONCILED
    - state_machines.EvaporatorBatch.BOILING_to_FINISHED
    distinguishing_aspect: 'Lease royalty (financial domain, distinct from batch yield domain):

      SHARE_OF_SYRUP provisional accrual (per-batch Rule-of-86, double-rounded)

      yields 0.86 gal while final settlement (volume-share of measured syrup,

      single rounding at reconcile) yields 0.87 gal for the same batch data.

      '
    test_recipe:
      setup:
      - Season 2027 OPEN; bush Leased Hill (LEASED via ACTIVE lease, SHARE_OF_SYRUP 30%) LIVE with one ACTIVE 100-tap line; window OPEN; tapper and boiler ACTIVE
      - 'run3: 245 gal @ 1.0 brix collected 2027-03-05T08:00:00Z, CONFIRMED'
      - batch Y fully drawn from run3, boil started 2027-03-05T18:00:00Z, FINISHED with finished_brix 66.5, measured 2.90
      - lot graded GOLDEN (eval flavor 90, transmittance 80.0) so reconcile is unblocked; season CLOSED
      setup_api_calls:
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-02-15T00:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/seasons
        payload:
          year: 2027
          opens_on: '2027-02-01'
          closes_on: '2027-04-15'
          planned_taps: 10000
        as: SugarhouseManager
        captures:
          season_id: $.data.id
      - call: POST /sugarhouse/seasons/${season_id}/open
        as: SugarhouseManager
        captures:
          season_v: $.data.version
      - call: POST /sugarhouse/sugarbushes
        payload:
          season_id: ${season_id}
          name: Leased Hill
          tap_capacity: 5000
        as: SugarhouseManager
        captures:
          bush_id: $.data.id
      - call: POST /sugarhouse/leases
        payload:
          sugarbush_id: ${bush_id}
          landowner_name: Landowner Lou
          royalty_basis: SHARE_OF_SYRUP
          share_pct: 30.0
          certified_organic_required: false
          term_start: '2027-01-01'
          term_end: '2027-12-31'
        as: SugarhouseManager
        captures:
          lease_id: $.data.id
      - call: POST /sugarhouse/leases/${lease_id}/submit-audit
        as: SugarhouseManager
      - call: POST /sugarhouse/leases/${lease_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/sugarbushes/${bush_id}/begin-tapping
        as: SugarhouseManager
      - call: POST /sugarhouse/tap-lines
        payload:
          sugarbush_id: ${bush_id}
          line_code: L1
          tap_count: 100
          vacuum_target_inhg: 25.0
        as: SugarhouseManager
        captures:
          line1_id: $.data.id
      - call: POST /sugarhouse/tap-lines/${line1_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/sugarbushes/${bush_id}/go-live
        as: SugarhouseManager
      - call: POST /sugarhouse/weather-windows
        payload:
          season_id: ${season_id}
          opens_at: '2027-03-01T00:00:00Z'
          closes_at: '2027-03-10T00:00:00Z'
          forecast_min_f: 28.0
          forecast_max_f: 42.0
          expected_season_version: ${season_v}
        as: SugarhouseManager
        captures:
          win_id: $.data.id
      - call: POST /sugarhouse/crew-members
        payload:
          season_id: ${season_id}
          name: Tammy Tapper
          crew_role: TAPPER
        as: SugarhouseManager
        captures:
          tapper_id: $.data.id
      - call: POST /sugarhouse/crew-members/${tapper_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/crew-members
        payload:
          season_id: ${season_id}
          name: Bob Boiler
          crew_role: BOILER
        as: SugarhouseManager
        captures:
          boiler_id: $.data.id
      - call: POST /sugarhouse/crew-members/${boiler_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/crew-members
        payload:
          season_id: ${season_id}
          name: Gail Grader
          crew_role: GRADER
        as: SugarhouseManager
        captures:
          grader_id: $.data.id
      - call: POST /sugarhouse/crew-members/${grader_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-03-01T12:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/weather-windows/${win_id}/open
        as: SugarhouseManager
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-03-05T08:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/sap-runs
        payload:
          sugarbush_id: ${bush_id}
          weather_window_id: ${win_id}
          collected_by: ${tapper_id}
          gallons_collected: 245.0
          measured_brix: 1.0
        as: FieldCrew
        as_user_id: ${tapper_id}
        captures:
          run3_id: $.data.id
      - call: POST /sugarhouse/sap-runs/${run3_id}/confirm
        as: FieldCrew
        as_user_id: ${tapper_id}
      - call: POST /sugarhouse/batches
        payload:
          season_id: ${season_id}
          boiled_by: ${boiler_id}
          evaporator_capacity_gal: 300
        as: SugarMaker
        as_user_id: ${boiler_id}
        captures:
          batch_id: $.data.id
      - call: POST /sugarhouse/batches/${batch_id}/intakes
        payload:
          sap_run_id: ${run3_id}
          gallons_drawn: 245.0
        as: SugarMaker
        as_user_id: ${boiler_id}
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-03-05T18:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/batches/${batch_id}/start-boil
        as: SugarMaker
        as_user_id: ${boiler_id}
      - call: POST /sugarhouse/batches/${batch_id}/finish
        payload:
          finished_brix: 66.5
          measured_syrup_gallons: 2.9
        as: SugarMaker
        as_user_id: ${boiler_id}
      - call: GET /sugarhouse/syrup-lots
        payload: {}
        as: SugarhouseManager
        captures:
          lot_id: $.data[0].id
      - call: POST /sugarhouse/syrup-lots/${lot_id}/evaluations
        payload:
          evaluator_id: ${grader_id}
          flavor_score: 90
        as: SugarMaker
        as_user_id: ${grader_id}
      - call: POST /sugarhouse/syrup-lots/${lot_id}/grade
        payload:
          light_transmittance_pct: 80.0
        as: SugarMaker
        as_user_id: ${grader_id}
      trigger:
      - call: POST /sugarhouse/seasons/${season_id}/close
        as: SugarhouseManager
      - call: POST /sugarhouse/seasons/${season_id}/reconcile
        as: SugarhouseManager
      - call: GET /sugarhouse/leases/${lease_id}
        as: SugarhouseManager
      assert:
      - 'Lease.${lease_id}.accrued_royalty_gallons == 0.86  (provisional: per-batch double rounding)'
      - 'Lease.${lease_id}.settled_royalty_gallons == 0.87  (final: single rounding of measured share)'
      - accrued_royalty_gallons != settled_royalty_gallons for identical batch data
- rule_id: combinatorial_formula
  instances:
  - name: weighted_brix_with_deterioration
    grounds:
    - calculations.weighted_input_brix
    distinguishing_aspect: "Mode (a) \u2014 >=3 inputs with non-linear interaction: per-intake\nmax(BRIX_FLOOR, brix - min(1.0, 0.2*floor(hours/24))) deterioration\nbranch, then volume-weighted average;\
      \ the 60h/36h holds land on\nfloor() day boundaries 2 and 1, giving eff 1.6 / 2.8 and input_brix 2.05.\n"
    test_recipe:
      setup:
      - 'Batch X setup as in boil_off_rule86_vs_rule882: run1 100 gal @2.0 collected 2027-03-02T00:00:00Z; run2 60 gal @3.0 collected 2027-03-03T00:00:00Z; both fully drawn; clock at 2027-03-04T12:00:00Z'
      setup_api_calls:
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-02-15T00:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/seasons
        payload:
          year: 2027
          opens_on: '2027-02-01'
