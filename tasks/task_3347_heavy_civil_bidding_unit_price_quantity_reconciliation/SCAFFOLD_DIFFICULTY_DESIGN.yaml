  - name: temporally_intersecting_surety_commitments_exhaust_aggregate_capacity
    grounds:
    - calculations.surety_exposure_capacity
    - entities.SuretyCommitment.fields.reserved_at
    - entities.SuretyCommitment.fields.released_at
    - errors[ERR_AGGREGATE_CAPACITY_EXCEEDED]
    - validations[priority=35]
    distinguishing_aspect: 'A different interval semantics on a different resource entity: instead of comparing two

      coverage intervals of the same bond_type for intersection, this rule sums the face

      amounts of every commitment whose [reserved_at, released_at) interval intersects the new

      one, across projects, and compares that aggregate against the shared endowment — so two

      reservations that never share a moment may each consume the whole pool, while two that

      do overlap cannot.

      '
    test_recipe:
      setup:
      - one Surety with 200000000 cents of aggregate capacity holding a live 120000000-cent commitment on project A, with a second project B open and distinct
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
