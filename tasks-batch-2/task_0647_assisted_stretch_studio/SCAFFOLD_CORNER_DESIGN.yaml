        claim_type: valid_transition
        grounds:
          - state_machines.CreditPack.status.ACTIVE_to_DEPLETED
          - state_machines.CreditPack.status.DEPLETED_to_ACTIVE
        distinguishing_aspect: "A 1-credit pack hits DEPLETED after its only booking holds the credit; a free-cancel release returns the credit and the pack flips back to ACTIVE."
        test_recipe:
          setup: ["Member with intro completed; a 1-credit pack."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
