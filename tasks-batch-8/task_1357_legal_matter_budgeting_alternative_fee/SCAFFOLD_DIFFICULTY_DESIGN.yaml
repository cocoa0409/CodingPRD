            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P1", bar_number: "B001", role_title: "PARTNER", standard_rate_cents: 50000 }
              as: FirmAdmin
              captures: { tk_p1: $.data.id }
            - call: "POST /firms/${firm_id}/clients"
              payload: { display_name: "C1", client_number: "CL1" }
              as: FirmAdmin
              captures: { client_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients/${client_id}/matters"
              payload: { matter_number: "M1", title: "M1", litigation_stage: "DISCOVERY", responsible_partner_id: "${tk_p1}" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
              captures: { matter_id: $.data.id, matter_v0: $.data.version }
            - call: "POST /firms/${firm_id}/matters/${matter_id}/fee_arrangements"
              payload: { arrangement_type: "FLAT_FEE", flat_fee_cents: 200000, fiscal_year_index: 2026 }
              as: PricingAnalyst
              captures: { arr_id: $.data.id }
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/submit"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/activate"
              payload: { expected_matter_version: "${matter_v0}" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/matters/${matter_id}/phase_budgets"
              payload: { litigation_stage: "DISCOVERY", task_code: "L110", original_budget_cents: 200000 }
              as: PricingAnalyst
              captures: { pb_id: $.data.id }
            - call: "POST /firms/${firm_id}/phase_budgets/${pb_id}/activate"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/matters/${matter_id}/time_entries"
              payload: { timekeeper_id: "${tk_p1}", task_code: "L110", litigation_stage: "DISCOVERY", hours_worked_milli: 1000, hourly_rate_cents: 33334, entry_date: "2026-08-05" }
              as: Timekeeper
              as_user_id: "${tk_p1}"
              captures: { te1_id: $.data.id }
            - call: "POST /firms/${firm_id}/matters/${matter_id}/time_entries"
              payload: { timekeeper_id: "${tk_p1}", task_code: "L110", litigation_stage: "DISCOVERY", hours_worked_milli: 1000, hourly_rate_cents: 33333, entry_date: "2026-08-06" }
              as: Timekeeper
              as_user_id: "${tk_p1}"
              captures: { te2_id: $.data.id }
            - call: "POST /firms/${firm_id}/matters/${matter_id}/time_entries"
              payload: { timekeeper_id: "${tk_p1}", task_code: "L110", litigation_stage: "DISCOVERY", hours_worked_milli: 1000, hourly_rate_cents: 33333, entry_date: "2026-08-07" }
              as: Timekeeper
              as_user_id: "${tk_p1}"
              captures: { te3_id: $.data.id }
            - call: "POST /firms/${firm_id}/time_entries/${te1_id}/submit"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/time_entries/${te2_id}/submit"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/time_entries/${te3_id}/submit"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/time_entries/${te1_id}/approve"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/time_entries/${te2_id}/approve"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/time_entries/${te3_id}/approve"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/matters/${matter_id}/write_down_requests"
              payload: { time_entry_ids: ["${te1_id}", "${te2_id}", "${te3_id}"], requested_amount_cents: 50000, reason_code: "CLIENT_RELATIONS" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
              captures: { wdr_id: $.data.id }
            - call: "POST /firms/${firm_id}/write_down_requests/${wdr_id}/submit"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P2", bar_number: "B002", role_title: "PARTNER", standard_rate_cents: 60000 }
              as: FirmAdmin
              captures: { tk_p2: $.data.id }
            - call: "POST /firms/${firm_id}/write_down_requests/${wdr_id}/decide"
