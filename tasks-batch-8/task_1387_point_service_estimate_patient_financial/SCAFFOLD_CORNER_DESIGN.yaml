# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml (§1.9) — patient-financial-clearance
# Breadth coverage of every §1.1-§1.7 testable claim not already covered by
# §1.8. Sections follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: patient_create_returns_201_with_system_defaults
        claim_type: creation
        grounds: [entities.Patient, endpoints.POST_/clearance/patients]
        distinguishing_aspect: "Valid registration persists mrn/full_name/date_of_birth and server-minted id, created_at, updated_at, version == 1; response envelope carries meta.api_request_id and response_type object."
        test_recipe:
          setup: ["Empty DB; clock at startup default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-E-1", full_name: "Pat Entity", date_of_birth: "1990-01-01" }
              as: Registrar
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "GET /clearance/patients/${pat_id}"
              as: Registrar
          assert:
            - "POST returns 201; data.id is a UUID without any type prefix; data.version == 1"
            - "data.created_at == 2026-08-01T00:00:00.000Z (startup default clock) and data.updated_at == created_at"
            - "GET /clearance/patients/${pat_id} returns the same field values (retrieval round-trip)"

      - name: patient_create_missing_mrn_returns_400
        claim_type: required_fields
        grounds: [entities.Patient.fields.mrn, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "mrn is a required input field; omitting it fails request-shape validation with ERR_INVALID_REQUEST before any persistence."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clearance/patients"
              payload: { full_name: "No Mrn", date_of_birth: "1990-01-01" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "http 400 and error_id == ERR_INVALID_REQUEST; no patient row is created and a retry that includes mrn succeeds"

      - name: charge_item_create_with_wrong_type_returns_400
        claim_type: type_constraints
        grounds: [entities.ChargeItem.fields.requires_auth_prior, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "requires_auth_prior is boolean-typed; a string value violates the type constraint."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Knee", list_price_cents: 5000000, requires_auth_prior: "yes" }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 400 and error_id == ERR_INVALID_REQUEST"

      - name: estimate_create_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.Estimate.fields.patient_responsibility_cents]
        distinguishing_aspect: "patient_responsibility_cents is source:computed; a client-supplied value is ignored and the priced result reflects the calculation, not the input."
        test_recipe:
          setup:
            - "INS-A fixture: charge 27447; contract ACME (MPR 50) rate 3000000; patient with snapshot (ded 150000/50000, oop 600000/100000, coins 20); case service 2026-08-20"
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Knee", list_price_cents: 5000000, requires_auth_prior: false }
              as: SystemAdmin
            - call: "POST /clearance/payer-contracts"
              payload: { payer_code: "ACME", payer_name: "Acme Health", bundling_rule: "MULTIPLE_PROCEDURE_REDUCTION", reduction_pct: 50 }
              as: SystemAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /clearance/payer-contracts/${pc_id}/rates"
              payload: { cpt_code: "27447", rate_cents: 3000000, effective_from: "2026-01-01" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-E-2", full_name: "Pat Computed", date_of_birth: "1990-02-02" }
              as: Registrar
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v}", payer_code: "ACME", member_id: "M-E2", deductible_total_cents: 150000, deductible_met_cents: 50000, oop_max_cents: 600000, oop_met_cents: 100000, coinsurance_pct: 20 }
              as: Registrar
              captures: { snap_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee" }
              as: Registrar
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }], patient_responsibility_cents: 1 }
              as: FinancialCounselor
              captures: { est_id: $.data.id }
            - call: "POST /clearance/estimates/${est_id}/price"
              payload: {}
              as: FinancialCounselor
          assert:
            - "Estimate.${est_id}.patient_responsibility_cents == 500000 after price (client-supplied 1 ignored)"
            - "before pricing the estimate's computed money fields are 0, never the client-supplied value"

      - name: case_get_not_found_returns_error_envelope_404
        claim_type: not_found
        grounds: [entities.FinancialClearanceCase, "errors[ERR_NOT_FOUND]", response_envelope]
        distinguishing_aspect: "Unknown id hits existence validation (priority 3) and the error body follows the fixed envelope: response_type error with data.error_id and data.message."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /clearance/cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "http 404; data.error_id == ERR_NOT_FOUND; data.message is a non-empty string; response_type == \"error\""

      - name: estimates_list_pagination_and_status_filter
        claim_type: listing
        grounds: ["endpoints.GET_/clearance/cases/{id}/estimates", response_envelope, entities.Estimate.fields.status]
        distinguishing_aspect: "List endpoints expose limit/offset/total_count/has_more with defaults limit=10 offset=0; status filter narrows the set; a fresh estimate starts in DRAFT (initial_state claim folded in here)."
        test_recipe:
          setup:
            - "INS-A fixture patient+case; two estimate revisions created (E1 SUPERSEDED, E2 DRAFT)"
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Knee", list_price_cents: 5000000, requires_auth_prior: false }
              as: SystemAdmin
            - call: "POST /clearance/payer-contracts"
              payload: { payer_code: "ACME", payer_name: "Acme Health", bundling_rule: "NONE" }
              as: SystemAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /clearance/payer-contracts/${pc_id}/rates"
              payload: { cpt_code: "27447", rate_cents: 3000000, effective_from: "2026-01-01" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-E-3", full_name: "Pat List", date_of_birth: "1990-03-03" }
              as: Registrar
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v}", payer_code: "ACME", member_id: "M-E3", deductible_total_cents: 150000, deductible_met_cents: 50000, oop_max_cents: 600000, oop_met_cents: 100000, coinsurance_pct: 20 }
              as: Registrar
              captures: { snap_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee" }
              as: Registrar
              captures: { case_id: $.data.id, case_v1: $.data.version }
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v1}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est1: $.data.id, est1_status: $.data.status }
            - call: "GET /clearance/cases/${case_id}"
              as: FinancialCounselor
              captures: { case_v2: $.data.version }
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v2}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est2: $.data.id }
          trigger:
            - call: "GET /clearance/cases/${case_id}/estimates"
              as: FinancialCounselor
            - call: "GET /clearance/estimates"
              payload: { case_id: "${case_id}", status: "DRAFT" }
              as: FinancialCounselor
              captures: { only_id: "$.data[0].id" }
            - call: "GET /clearance/cases/${case_id}/estimates"
              payload: { limit: 1, offset: 0 }
              as: FinancialCounselor
          assert:
            - "E1 was created with status DRAFT (initial state) and is now SUPERSEDED; E2 is DRAFT"
            - "unfiltered list: total_count == 2, limit == 10, offset == 0, has_more == false, response_type == \"array\""
            - "filtered by status=DRAFT: exactly 1 row and its id == ${est2}"
            - "limit=1: exactly 1 row, total_count == 2, has_more == true"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: accept_draft_estimate_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Estimate, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ACCEPT is not in DRAFT's transition set; the attempt is rejected and no side effects fire (case stays OPEN, required_deposit stays 0)."
        test_recipe:
          setup: ["Patient with case (service 2026-08-20) and a DRAFT INSURED estimate (never priced)"]
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Knee", list_price_cents: 5000000, requires_auth_prior: false }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-SM-1", full_name: "Pat State", date_of_birth: "1991-01-01" }
              as: Registrar
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v}", payer_code: "ACME", member_id: "M-SM1", deductible_total_cents: 150000, deductible_met_cents: 50000, oop_max_cents: 600000, oop_met_cents: 100000, coinsurance_pct: 20 }
              as: Registrar
              captures: { snap_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee" }
              as: Registrar
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /clearance/estimates/${est_id}/accept"
              payload: {}
              as: FinancialCounselor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409"
            - "Estimate.${est_id}.status remains DRAFT; Case.${case_id}.status remains OPEN and required_deposit_cents == 0"

      - name: finalize_finalized_estimate_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Estimate, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "FINALIZED is terminal: a second finalize is rejected and no second VarianceRecord is created."
        test_recipe:
          setup: ["GFE case: estimate priced/presented/ACCEPTED and already FINALIZED with actual 750000 (gfe_total 750000, delta 0, not dispute-eligible)"]
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "95999", description: "Lab panel", list_price_cents: 1000000, requires_auth_prior: false }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-SM-2", full_name: "Pat Terminal", date_of_birth: "1991-02-02" }
              as: Registrar
              captures: { pat_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Lab" }
              as: Registrar
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v}", pricing_mode: "UNINSURED_GFE", lines: [{ cpt_code: "95999", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_id: $.data.id }
            - call: "POST /clearance/estimates/${est_id}/price"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/estimates/${est_id}/present"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/estimates/${est_id}/accept"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/estimates/${est_id}/finalize"
              payload: { actual_billed_cents: 750000 }
              as: FinancialCounselor
          trigger:
            - call: "POST /clearance/estimates/${est_id}/finalize"
              payload: { actual_billed_cents: 800000 }
              as: FinancialCounselor
              captures: { err: $.data.error_id }
            - call: "GET /clearance/estimates/${est_id}/variance-records"
              as: ClearanceSupervisor
          assert:
            - "error_id == ERR_INVALID_STATE, http 409"
            - "exactly 1 VarianceRecord exists for the estimate (total_count == 1) with actual_billed_cents == 750000"

      - name: refund_pledged_deposit_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Deposit, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REFUND is only defined from POSTED; a PLEDGED deposit holds no captured funds and rejects the refund."
        test_recipe:
          setup: ["Patient with case (service 2026-08-20) and a PLEDGED deposit of 100000 (never posted)"]
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-SM-3", full_name: "Pat Pledge", date_of_birth: "1991-03-03" }
              as: Registrar
              captures: { pat_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee" }
              as: Registrar
              captures: { case_id: $.data.id }
            - call: "POST /clearance/cases/${case_id}/deposits"
              payload: { amount_cents: 100000, method: "CARD" }
              as: FinancialCounselor
              captures: { dep_id: $.data.id }
          trigger:
            - call: "POST /clearance/deposits/${dep_id}/refund"
              payload: {}
              as: ClearanceSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409; Deposit.${dep_id}.status remains PLEDGED"

      - name: auth_appeal_cycle_denied_to_approved
        claim_type: valid_transition
        grounds: [state_machines.Authorization.DENIED_to_APPEALED, state_machines.Authorization.APPEALED_to_APPROVED]
        distinguishing_aspect: "The appeal cycle REQUESTED -> DENIED -> APPEALED -> APPROVED is traversable; auth_number is minted only on the terminal APPROVED arrival."
        test_recipe:
          setup: ["Patient with case (service 2026-08-20); authorization for [27447] in REQUESTED (requested by ur-1)"]
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-SM-4", full_name: "Pat Appeal", date_of_birth: "1991-04-04" }
              as: Registrar
              captures: { pat_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee" }
              as: Registrar
              captures: { case_id: $.data.id }
            - call: "POST /clearance/cases/${case_id}/authorizations"
              payload: { cpt_codes: ["27447"], payer_code: "ACME" }
              as: UtilizationReviewer
              as_user_id: "ur-1"
              captures: { auth_id: $.data.id }
          trigger:
            - call: "POST /clearance/authorizations/${auth_id}/decide"
              payload: { decision: "DENIED", medical_necessity_met: false }
              as: UtilizationReviewer
              as_user_id: "ur-2"
              captures: { st1: $.data.status }
            - call: "POST /clearance/authorizations/${auth_id}/appeal"
              payload: {}
              as: UtilizationReviewer
              as_user_id: "ur-1"
              captures: { st2: $.data.status }
            - call: "POST /clearance/authorizations/${auth_id}/decide"
              payload: { decision: "APPROVED", medical_necessity_met: true, valid_from: "2026-08-10", valid_to: "2026-08-31" }
              as: UtilizationReviewer
              as_user_id: "ur-2"
              captures: { st3: $.data.status, auth_num: $.data.auth_number }
          assert:
            - "statuses traverse REQUESTED -> DENIED -> APPEALED -> APPROVED (${st1} == DENIED, ${st2} == APPEALED, ${st3} == APPROVED)"
            - "auth_number is non-null only after the final APPROVED"
            - "decided_by_user_id == \"ur-2\" and requested_by_user_id == \"ur-1\" (segregation recorded)"

      - name: decide_denied_with_necessity_true_returns_422
        claim_type: precondition_enforcement
        grounds: ["validations[priority=19]", "errors[ERR_MEDICAL_NECESSITY_CONFLICT]"]
        distinguishing_aspect: "DENIED is inconsistent with medical_necessity_met=true; the decide is rejected and the authorization stays REQUESTED."
        test_recipe:
          setup: ["Patient with case; authorization REQUESTED by ur-1"]
          setup_api_calls:
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-SM-5", full_name: "Pat Necessity", date_of_birth: "1991-05-05" }
              as: Registrar
              captures: { pat_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee" }
              as: Registrar
              captures: { case_id: $.data.id }
            - call: "POST /clearance/cases/${case_id}/authorizations"
              payload: { cpt_codes: ["27447"], payer_code: "ACME" }
              as: UtilizationReviewer
              as_user_id: "ur-1"
              captures: { auth_id: $.data.id }
          trigger:
            - call: "POST /clearance/authorizations/${auth_id}/decide"
              payload: { decision: "DENIED", medical_necessity_met: true }
              as: UtilizationReviewer
              as_user_id: "ur-2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MEDICAL_NECESSITY_CONFLICT, http 422; Authorization.${auth_id}.status remains REQUESTED"

      - name: case_cancel_cascades_all_children
        claim_type: side_effect_execution
        grounds: [state_machines.FinancialClearanceCase.IN_REVIEW_to_CANCELLED]
        distinguishing_aspect: "Cancellation fans out one level to every child aggregate with conditional (non-terminal-only) semantics: PRICED estimate CANCELLED, PLEDGED deposit CANCELLED, POSTED deposit REFUNDED at the 100% tier (13 business days out), REQUESTED authorization WITHDRAWN, DRAFT plan CANCELLED; the already-CANCELLED rows are not double-mutated."
        test_recipe:
          setup:
            - "INS-A fixture: charge 27447; contract ACME (MPR 50) rate 3000000; patient with snapshot; case service 2026-08-20"
            - "Estimate priced (PRICED, not presented); deposits 100000 POSTED and 50000 PLEDGED; authorization REQUESTED; payment plan DRAFT"
            - "Clock at 2026-08-03T09:00:00Z (13 business days before service -> 100% refund tier)"
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Knee", list_price_cents: 5000000, requires_auth_prior: false }
              as: SystemAdmin
            - call: "POST /clearance/payer-contracts"
              payload: { payer_code: "ACME", payer_name: "Acme Health", bundling_rule: "MULTIPLE_PROCEDURE_REDUCTION", reduction_pct: 50 }
              as: SystemAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /clearance/payer-contracts/${pc_id}/rates"
              payload: { cpt_code: "27447", rate_cents: 3000000, effective_from: "2026-01-01" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-SM-6", full_name: "Pat Cancel", date_of_birth: "1991-06-06" }
              as: Registrar
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v}", payer_code: "ACME", member_id: "M-SM6", deductible_total_cents: 150000, deductible_met_cents: 50000, oop_max_cents: 600000, oop_met_cents: 100000, coinsurance_pct: 20 }
              as: Registrar
              captures: { snap_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee" }
              as: Registrar
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_id: $.data.id }
            - call: "POST /clearance/estimates/${est_id}/price"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/cases/${case_id}/deposits"
              payload: { amount_cents: 100000, method: "CARD" }
              as: FinancialCounselor
              captures: { dep_posted: $.data.id }
            - call: "POST /clearance/deposits/${dep_posted}/post"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/cases/${case_id}/deposits"
              payload: { amount_cents: 50000, method: "CASH" }
              as: FinancialCounselor
              captures: { dep_pledged: $.data.id }
            - call: "POST /clearance/cases/${case_id}/authorizations"
              payload: { cpt_codes: ["27447"], payer_code: "ACME" }
              as: UtilizationReviewer
              as_user_id: "ur-1"
              captures: { auth_id: $.data.id }
            - call: "POST /clearance/cases/${case_id}/payment-plans"
              payload: { principal_cents: 99999, num_installments: 2 }
              as: FinancialCounselor
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /clearance/cases/${case_id}/cancel"
              payload: {}
              as: ClearanceSupervisor
              captures: { case_status: $.data.status }
            - call: "GET /clearance/estimates/${est_id}"
              as: ClearanceSupervisor
              captures: { est_status: $.data.status }
            - call: "GET /clearance/cases/${case_id}/deposits"
              as: ClearanceSupervisor
              captures: { dep0_status: "$.data[0].status", dep0_refund: "$.data[0].refund_amount_cents", dep1_status: "$.data[1].status" }
            - call: "GET /clearance/cases/${case_id}/authorizations"
              as: ClearanceSupervisor
              captures: { auth_status: "$.data[0].status" }
            - call: "GET /clearance/cases/${case_id}/payment-plans"
              as: ClearanceSupervisor
              captures: { plan_status: "$.data[0].status" }
          assert:
            - "Case.${case_id}.status == CANCELLED"
            - "Estimate.${est_id}.status == CANCELLED (was PRICED, non-terminal)"
            - "POSTED Deposit.${dep_posted}: status == REFUNDED, refund_amount_cents == 100000 (100% tier), refund_reason == SERVICE_CANCELLED; case.deposit_posted_cents == 0"
            - "PLEDGED Deposit.${dep_pledged}: status == CANCELLED with refund_amount_cents null"
            - "Authorization.${auth_id}.status == WITHDRAWN; PaymentPlan.${plan_id}.status == CANCELLED"

      - name: snapshot_superseded_by_newer_verification
        claim_type: side_effect_execution
        grounds: [state_machines.EligibilitySnapshot.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "Creating a second snapshot for the same (patient, payer_code) flips exactly the prior one to SUPERSEDED; a snapshot for a different payer_code is unaffected."
        test_recipe:
          setup: ["Patient with ACTIVE snapshot S1 for payer ACME"]
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-SM-7", full_name: "Pat Snap", date_of_birth: "1991-07-07" }
              as: Registrar
              captures: { pat_id: $.data.id, pat_v1: $.data.version }
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v1}", payer_code: "ACME", member_id: "M-1", deductible_total_cents: 150000, deductible_met_cents: 50000, oop_max_cents: 600000, oop_met_cents: 100000, coinsurance_pct: 20 }
              as: Registrar
              captures: { snap1: $.data.id }
            - call: "GET /clearance/patients/${pat_id}"
              as: Registrar
              captures: { pat_v2: $.data.version }
          trigger:
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v2}", payer_code: "ACME", member_id: "M-1", deductible_total_cents: 150000, deductible_met_cents: 100000, oop_max_cents: 600000, oop_met_cents: 100000, coinsurance_pct: 20 }
              as: Registrar
              captures: { snap2: $.data.id }
            - call: "GET /clearance/eligibility-snapshots"
              payload: { patient_id: "${pat_id}", status: "ACTIVE" }
              as: Registrar
              captures: { active_id: "$.data[0].id" }
            - call: "GET /clearance/eligibility-snapshots/${snap1}"
              as: Registrar
              captures: { snap1_status: $.data.status }
          assert:
            - "Snapshot.${snap1}.status == SUPERSEDED; Snapshot.${snap2}.status == ACTIVE"
            - "exactly one ACTIVE snapshot remains for the patient and it is ${snap2}"
            - "Patient.version advanced by 1 per snapshot creation (was 1 at registration, 2 after S1, 3 after S2)"

      - name: estimate_supersede_side_effect
        claim_type: side_effect_execution
        grounds: [state_machines.Estimate.PRICED_to_SUPERSEDED]
        excluded_because:
          difficulty_instance: estimate_supersede_active_cardinality_conservation
          rationale: "The supersede cascade (prior non-locked estimate flips to SUPERSEDED on new revision) is asserted by the named §1.8 instance across three consecutive creates."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: bundling_mpr_tie_break_by_cpt_and_quantity
        claim_type: correct_result
        grounds: [calculations.bundled_contract_pricing]
        distinguishing_aspect: "Equal-rate lines are ranked by cpt_code ASC (not input order): 90001 (qty 1) becomes primary at 100% and 90002 (qty 3) secondary at 50% even though 90002 is listed first, giving allowed 2500000; input-order ranking would give 3500000."
        test_recipe:
          setup:
            - "Charge items 90001 and 90002; contract ACME MULTIPLE_PROCEDURE_REDUCTION 50% with both rates 1000000 from 2026-01-01"
            - "Patient with snapshot (ded 0/0, oop 5000000/0, coins 0); case service 2026-08-20; DRAFT INSURED estimate with lines [90002 x3 listed first, 90001 x1]"
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
