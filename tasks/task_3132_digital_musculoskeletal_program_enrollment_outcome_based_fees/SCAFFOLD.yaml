# =============================================================================
# SCAFFOLD.yaml — task_3132_digital_musculoskeletal_program_enrollment_outcome_based_fees
# Digital Musculoskeletal Program Enrollment & Outcome-Based Fees
# §1.0 through §1.7 (preamble + seven seed tables)
# =============================================================================

scenario: |
  Digital Musculoskeletal Program Enrollment & Outcome-Based Fees (Hinge Health): eligibility
  determination from employer or health plan files with musculoskeletal condition screening,
  program assignment across acute, chronic and surgery-avoidance tracks with clinical review,
  sensor or camera-guided exercise therapy sessions with adherence tracking and coach escalation,
  physical therapist and physician consult scheduling within the digital program, engagement
  outreach cadence with dropout risk modeling, outcome measurement on pain, function and
  downstream claims with attribution windows, fee structures tied to engagement milestones or
  measured savings with client reporting, transition to in-person care when the program is
  not appropriate

domain_name: digital-msk-program-enrollment-outcome-fees
api_prefix: /msk

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - selector_policy
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
#
# Week model: every temporal rule is expressed in whole ISO weeks counted from
# Monday 2026-09-07T00:00:00Z, which is week_index 1. week_index N spans
# [2026-09-07T00:00:00Z + 7*(N-1) days, 2026-09-07T00:00:00Z + 7*N days) —
# half-open, so an instant exactly on a week boundary belongs to the later week.
# The logical clock default is 2026-09-01T00:00:00Z (see POST /_clock/set_current_utc).
# =============================================================================
entities:

  - name: ClientAccount
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Employer or health plan legal name"
      - name: client_type
        type: enum
        source: input
        description: "Contracting counterparty type"
        constraints: "one of EMPLOYER | HEALTH_PLAN"
      - name: billing_model
        type: enum
        source: input
        description: "Which fee structure the client contract uses"
        default: ENGAGEMENT_MILESTONE
        constraints: "one of ENGAGEMENT_MILESTONE | OUTCOME_SHARED_SAVINGS"
      - name: savings_share_rate
        type: number
        source: input
        description: "Share of attributed downstream savings billed when billing_model is OUTCOME_SHARED_SAVINGS"
        default: 0.30
        constraints: "0 <= savings_share_rate <= 1"
      - name: expected_monthly_engagement_rate
        type: number
        source: input
        description: "Contractual expected share of assigned members reaching the engagement milestone"
        default: 0.60
        constraints: "0 <= expected_monthly_engagement_rate <= 1"
      - name: account_status
        type: enum
        source: system
        description: "Lifecycle state of the client contract"
        constraints: "one of ACTIVE | SUSPENDED | CLOSED"

  - name: ProgramTrack
    parent: null
    common_fields: false
    fields:
      - name: track_code
        type: enum
        source: input
        description: "Which digital MSK care track this configuration row describes"
        constraints: "one of ACUTE | CHRONIC | SURGERY_AVOIDANCE"
      - name: base_fee_per_member_cents
        type: integer
        source: input
        description: "Monthly platform fee per member assigned to this track"
      - name: expected_sessions_per_week
        type: integer
        source: input
        description: "Prescribed exercise sessions per week used as the adherence denominator"
      - name: pain_reduction_target_points
        type: number
        source: input
        description: "Pain-score point reduction a member must reach for the outcome milestone"
      - name: function_gain_target_points
        type: number
        source: input
        description: "Function-score point gain a member must reach for the outcome milestone"
      - name: min_adherence_rate
        type: number
        source: input
        description: "Adherence rate a member must hold to remain engagement-milestone eligible"
        default: 0.70
      - name: severity_weights
        type: object
        source: input
        description: "Map from claim severity to the savings weight used by attributed_savings_severity_bucket; the map carries exactly two keys, LOW and HIGH"

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: client_account_id
        type: string
        source: input
        description: "FK -> ClientAccount.id; the employer or health plan that sponsors this member"
      - name: external_member_ref
        type: string
        source: input
        description: "Client-side member identifier from the roster file"
        constraints: "unique per client_account_id"
      - name: full_name
        type: string
        source: input
        description: "Member name as carried on the roster"
      - name: date_of_birth
        type: datetime
        source: input
        description: "Date of birth, ISO 8601 date at 00:00:00Z"
      - name: musculo_condition_code
        type: enum
        source: input
        description: "Primary musculoskeletal condition carried on the roster"
        constraints: "one of KNEE_OA | LOW_BACK | SHOULDER | HIP | NECK | OTHER"
      - name: baseline_pain_score
        type: number
        source: input
        description: "Baseline pain score 0-10 captured at eligibility determination"
        constraints: "0 <= baseline_pain_score <= 10"
      - name: baseline_function_score
        type: number
        source: input
        description: "Baseline function score 0-100 captured at eligibility determination"
        constraints: "0 <= baseline_function_score <= 100"
      - name: red_flag_multipliers
        type: array
        source: input
        description: "Clinical red-flag multipliers carried on the member's roster row"
        default: []
      - name: red_flag_weight
        type: number
        source: computed
        description: "Sum over red_flag_multipliers of (multiplier - 1.0), rounded to 2 places"
      - name: coach_escalated
        type: boolean
        source: computed
        description: "True once the weekly reconciliation escalates this member to a coach"
        default: false
      - name: member_status
        type: enum
        source: system
        description: "Eligibility and program state of the member"
        constraints: "one of PENDING_ELIGIBILITY | ELIGIBLE | INELIGIBLE | ENROLLED | GRADUATED | DROPPED"
      - name: eligibility_basis
        type: enum
        source: system
        description: "Which screening rule decided this member's eligibility"
        constraints: "one of MSK_FLAG | NO_MSK_FLAG | COVERAGE_TERM | DEMOGRAPHICS"

  - name: EligibilityFile
    parent: null
    common_fields: true
    fields:
      - name: client_account_id
        type: string
        source: input
        description: "FK -> ClientAccount.id; the client that supplied this roster file"
      - name: file_period
        type: string
        source: input
        description: "Billing period the roster covers, formatted YYYY-MM"
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: roster_format
        type: enum
        source: input
        description: "Roster layout, which also selects the monthly-fee variant"
        constraints: "one of STANDARD | LEGACY"
      - name: file_status
        type: enum
        source: system
        description: "Processing state of the roster file"
        constraints: "one of INGESTED | SCREENED | ASSIGNED | CLOSED"
      - name: member_row_count
        type: integer
        source: computed
        description: "Count of member rows on the roster, stamped when the file is screened"
      - name: eligible_member_count
        type: integer
        source: computed
        description: "Count of members on this file that screened ELIGIBLE"
      - name: ineligible_member_count
        type: integer
        source: computed
        description: "Count of members on this file that screened INELIGIBLE"
      - name: screened_member_count
        type: integer
        source: computed
        description: "eligible_member_count + ineligible_member_count"
      - name: total_monthly_fee_cents
        type: integer
        source: computed
        description: "Chronological weighted payability-ratio variant of the monthly roster fee"
      - name: provisional_total_monthly_fee_cents
        type: integer
        source: computed
        description: "Forward-looking payability-ratio variant of the monthly roster fee"
      - name: fee_variance_cents
        type: integer
        source: computed
        description: "total_monthly_fee_cents - provisional_total_monthly_fee_cents"

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member being enrolled"
      - name: eligibility_file_id
        type: string
        source: input
        description: "FK -> EligibilityFile.id; the roster file that produced this enrollment"
      - name: program_track_id
        type: string
        source: input
        description: "FK -> ProgramTrack.id; assigned track, null until clinical review conducts"
      - name: enrollment_status
        type: enum
        source: system
        description: "Enrollment lifecycle state"
        constraints: "one of PENDING_SCREENING | PENDING_CLINICAL_REVIEW | AWAITING_TRANSITION_REVIEW | ACTIVE | ACTIVATION_FAILED | COMPLETED | DROPPED | TRANSITIONED"
      - name: clinical_review_outcome
        type: enum
        source: system
        description: "Clinical decision recorded for this enrollment"
        constraints: "one of APPROVED | REJECTED; null until a ClinicalReview is conducted"
      - name: clinical_reviewing_clinician_id
        type: string
        source: system
        description: "id of the Clinician on the conducted ClinicalReview for this enrollment; null until a review is conducted"
      - name: review_pending_since
        type: datetime
        source: computed
        description: "Instant the enrollment entered PENDING_CLINICAL_REVIEW; the anchor for the review-reconciliation window"
      - name: enrolled_at
        type: datetime
        source: system
        description: "Instant the enrollment became ACTIVE; null otherwise"
      - name: enrolled_week
        type: integer
        source: system
        description: "week_index of enrolled_at; the unique adversary-week anchor"
      - name: completed_week
        type: integer
        source: computed
        description: "week_index of the FINALIZED outcome measurement that completed the program; null otherwise"
      - name: dropout_week
        type: integer
        source: system
        description: "week_index of dropout; null unless enrollment_status is DROPPED"
      - name: transition_reason
        type: enum
        source: system
        description: "Registered reason a clinician asked for in-person care"
        constraints: "one of CLINICIAN_REQUEST | NO_ENGAGEMENT | ADVERSE_EVENT; null until registered"
      - name: pending_transition_clinician_id
        type: string
        source: system
        description: "approving_clinician_id registered on the pending in-person transition review; null when no review is pending"
      - name: weeks_active
        type: integer
        source: computed
        description: "Week-difference between Enrollment.enrolled_at and the current logical clock instant; not the member's weeks across the whole relationship with the client"
      - name: adherence_rate
        type: number
        source: computed
        description: "Completed prescribed sessions divided by weeks_active-scaled prescription"
      - name: adherence_scored_through_week
        type: integer
        source: computed
        description: "Highest week_index already included in adherence_rate"
      - name: pain_reduction_points
        type: number
        source: computed
        description: "baseline pain score minus the pain score of the FINALIZED measurement"
      - name: function_gain_points
        type: number
        source: computed
        description: "Completed measurement's function score minus its window baseline function score, rounded to 1 decimal; the window baseline is the preceding measurement's function score (Member.baseline_function_score for the first window)"
      - name: dropout_risk_score
        type: integer
        source: computed
        description: "Deterministic 0-100 weekly attrition risk score driven by member-sourced adherence and missed sessions"
      - name: dropout_risk_as_of_week
        type: integer
        source: computed
        description: "Latest week_index whose exercise-session history entered dropout_risk_score"
      - name: coach_escalation_required
        type: boolean
        source: computed
        description: "True once dropout_risk_score reaches the coach-escalation threshold"
        default: false
      - name: consult_cancellation_count
        type: integer
        source: computed
        description: "Number of this enrollment's consults that were cancelled"
        default: 0
      - name: projected_engagement_milestone
        type: integer
        source: computed
        description: "1 when weeks_active >= 1 AND adherence_rate >= ProgramTrack.min_adherence_rate, else 0"
      - name: attributed_savings_cents
        type: integer
        source: computed
        description: "Sum of un-superseded attributed savings across this enrollment's claim windows (read via GET /outcome-measurements?enrollment_id=...)"

  - name: ClinicalReview
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment under review"
      - name: reviewer_id
        type: string
        source: input
        description: "id of the Clinician conducting the review"
      - name: reviewed_track_id
        type: string
        source: input
        description: "id of the ProgramTrack this reviewer assigns; ignored when the decision is REJECT"
      - name: review_decision
        type: enum
        source: input
        description: "Clinical decision, supplied when the review is conducted"
        constraints: "one of APPROVE | REJECT"
      - name: review_notes
        type: string
        source: input
        description: "Free-text clinical note"
      - name: review_status
        type: enum
        source: system
        description: "Clinical review lifecycle state"
        constraints: "one of SUBMITTED | CONDUCTED"
      - name: review_opened_at
        type: datetime
        source: system
        description: "Instant the review was submitted; starts the review-reconciliation window"
      - name: conducted_at
        type: datetime
        source: computed
        description: "Instant the review was conducted; null while SUBMITTED"

  - name: ExerciseSession
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment this session belongs to"
      - name: session_date
        type: datetime
        source: input
        description: "Instant the session occurred"
      - name: session_week
        type: integer
        source: input
        description: "week_index the session is booked into; must equal week_index(session_date)"
      - name: recorded_via
        type: enum
        source: input
        description: "Capture modality of the guided session"
        constraints: "one of SENSOR | CAMERA"
      - name: session_status
        type: enum
        source: system
        description: "Session lifecycle state"
        constraints: "one of SCHEDULED | COMPLETED | MISSED"
      - name: planned_reps
        type: integer
        source: input
        description: "Prescribed repetition count sent to the wearable or camera coach"
      - name: completed_reps
        type: integer
        source: computed
        description: "Repetitions actually completed; 0 while SCHEDULED"
      - name: planned_minutes
        type: integer
        source: input
        description: "Prescribed session duration in minutes"
      - name: completed_minutes
        type: integer
        source: computed
        description: "Minutes actually completed; 0 while SCHEDULED"
      - name: pain_score_before
        type: number
        source: computed
        description: "Pain score in force at session completion, snapshotted from the member's latest recorded measurement"
      - name: scheduled_send_at
        type: datetime
        source: system
        description: "Instant the session booking was created; the half-open anchor for the weekly session cut"
      - name: pain_score_after
        type: number
        source: input
        description: "Post-session pain score reported by the member; null when not reported"
      - name: track_restricted
        type: boolean
        source: input
        description: "True when the member is on a surgery-avoidance restriction for this session"
        default: false
      - name: adherence_numerator
        type: number
        source: computed
        description: "1 when the session is COMPLETED, 0 otherwise"
      - name: adherence_denominator
        type: number
        source: computed
        description: "1, doubled to 2 when track_restricted is true"

  - name: ClaimLine
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment whose window this downstream claim falls in"
      - name: claim_service_date
        type: datetime
        source: input
        description: "Instant the downstream service was rendered"
      - name: claim_service_week
        type: integer
        source: input
        description: "week_index the claim is attributed to; drives the half-open window boundary"
      - name: claim_severity
        type: enum
        source: input
        description: "Grouper severity of the downstream claim"
        constraints: "one of LOW | MODERATE | HIGH"
      - name: amount_cents
        type: integer
        source: input
        description: "Paid amount of the downstream claim line"
        constraints: "amount_cents >= 0"
      - name: claim_source
        type: enum
        source: input
        description: "Where the downstream claim originated"
        constraints: "one of MEDICAL | PHARMACY"
      - name: claim_superseded
        type: boolean
        source: system
        description: "True once a replacement line instance has taken over this window"
        default: false
      - name: line_instance_version
        type: integer
        source: system
        description: "Monotonic instance counter for this claim line, starting at 1 and incrementing each time the line is reinstated"

  - name: OutreachContact
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment this outreach targets"
      - name: contact_week
        type: integer
        source: input
        description: "week_index the outreach is scheduled for; 1 through 4 are inclusive, week 5 and beyond are exclusive"
      - name: channel
        type: enum
        source: input
        description: "Outreach channel"
        constraints: "one of PUSH | SMS | PHONE"
      - name: contact_occurred_at
        type: datetime
        source: input
        description: "Instant the outreach was placed; the anchor for the 504-hour dropout attribution window"
      - name: outreach_status
        type: enum
        source: system
        description: "Delivery state of the outreach contact"
        constraints: "one of QUEUED | DELIVERED | FAILED"
      - name: scheduled_send_at
        type: datetime
        source: computed
        description: "Instant the outreach becomes eligible to send"

  - name: Clinician
    parent: null
    common_fields: false
    fields:
      - name: full_name
        type: string
        source: input
        description: "Clinician name"
      - name: discipline
        type: enum
        source: input
        description: "Clinical discipline; a discipline may hold at most one complete 60-minute block per day"
        constraints: "one of PHYSICAL_THERAPIST | PHYSICIAN"
      - name: license_number
        type: string
        source: input
        description: "State license number"
      - name: clinician_status
        type: enum
        source: system
        description: "Clinician availability state"
        constraints: "one of AVAILABLE | LIMITED | DEACTIVATED"
      - name: weekly_capacity_slots
        type: integer
        source: input
        description: "Bookable slots per week"
      - name: weekly_completed_minutes
        type: integer
        source: computed
        description: "Sum of duration_minutes over COMPLETED appointments in the current ISO week"
      - name: weekly_scheduled_minutes
        type: integer
        source: computed
        description: "Sum of duration_minutes over SCHEDULED and COMPLETED appointments in the current ISO week"

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment the consult is booked against"
      - name: clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; the physical therapist or physician conducting the consult"
      - name: appointment_date
        type: datetime
        source: input
        description: "Calendar day of the consult at 00:00:00Z"
      - name: start_minute
        type: integer
        source: input
        description: "Minutes from midnight of appointment_date at which the consult begins"
        constraints: "0 <= start_minute <= 1439"
      - name: duration_minutes
        type: integer
        source: input
        description: "Consult length in minutes; START_TO_START booking buffers are applied on the clinician timeline"
        constraints: "15 <= duration_minutes <= 120"
      - name: slot_type
        type: enum
        source: input
        description: "Consult kind"
        constraints: "one of INITIAL_CONSULT | FOLLOW_UP"
      - name: appointment_status
        type: enum
        source: system
        description: "Consult lifecycle state"
        constraints: "one of SCHEDULED | COMPLETED | CANCELLED | NO_SHOW"
      - name: cancelled_at
        type: datetime
        source: computed
        description: "Instant the consult was cancelled; null otherwise"

  - name: OutcomeMeasurement
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment this measurement belongs to"
      - name: measurement_week
        type: integer
        source: input
        description: "week_index this measurement covers"
      - name: pain_score
        type: number
        source: input
        description: "Reported pain score 0-10"
        constraints: "0 <= pain_score <= 10"
      - name: function_score
        type: number
        source: input
        description: "Reported function score 0-100"
        constraints: "0 <= function_score <= 100"
      - name: measurement_status
        type: enum
        source: system
        description: "Whether this measurement is a live end-of-window claimant"
        constraints: "one of RECORDED | SUPERSEDED | FINALIZED"
      - name: claim_window_rank
        type: integer
        source: system
        description: "1-based index of this measurement's 4-week attribution window within the enrollment"
      - name: window_start_week
        type: integer
        source: computed
        description: "First week_index of this measurement's 4-week window (inclusive)"
      - name: window_end_week
        type: integer
        source: computed
        description: "Last week_index of this measurement's 4-week window (inclusive)"
      - name: baseline_pain_score
        type: number
        source: system
        description: "Pain score of the immediately preceding measurement, or Member.baseline_pain_score for the first window"
      - name: baseline_function_score
        type: number
        source: system
        description: "Function score of the immediately preceding measurement, or Member.baseline_function_score for the first window"
      - name: pain_delta_points
        type: number
        source: computed
        description: "baseline_pain_score - pain_score, rounded to 1 decimal"
      - name: function_delta_points
        type: number
        source: computed
        description: "function_score - baseline_function_score, rounded to 1 decimal"
      - name: attributed_savings_cents
        type: integer
        source: computed
        description: "Downstream claim savings attributed to this measurement's window, pinned to the order-free severity-bucket variant"

  - name: FeeInvoice
    parent: null
    common_fields: true
    fields:
      - name: client_account_id
        type: string
        source: input
        description: "FK -> ClientAccount.id; the client being invoiced"
      - name: billing_period
        type: string
        source: input
        description: "Billing period covered, formatted YYYY-MM"
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: billing_model_snapshot
        type: string
        source: system
        description: "ClientAccount.billing_model captured at invoice creation"
      - name: milestone_member_count
        type: integer
        source: computed
        description: "Members on this client whose enrollment has projected_engagement_milestone == 1"
      - name: milestone_engagement_component_cents
        type: integer
        source: computed
        description: "Engagement-milestone fee component"
      - name: savings_share_component_cents
        type: integer
        source: computed
        description: "Measured-savings fee component"
      - name: additional_fee_component_cents
        type: integer
        source: computed
        description: "Fee arising from outcome files whose reconciliation window lapsed after the invoice was created"
      - name: recalculated_component_cents
        type: integer
        source: computed
        description: "Full recompute of the milestone component including every reconciliation delta"
      - name: provisional_amount_cents
        type: integer
        source: computed
        description: "Forward-looking invoice total"
      - name: final_amount_cents
        type: integer
        source: computed
        description: "Chronological invoice total"
      - name: net_delta_cents
        type: integer
        source: computed
        description: "final_amount_cents - provisional_amount_cents"
      - name: finalized_total_cents
        type: integer
        source: computed
        description: "Amount actually billed once FINALIZED; null while the invoice is not FINALIZED"
      - name: invoice_status
        type: enum
        source: system
        description: "Invoice lifecycle state"
        constraints: "one of DRAFT | FINALIZED | VOID"

  - name: CareTransition
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment moved to in-person care"
      - name: approving_clinician_id
        type: string
        source: input
        description: "id of the Clinician approving the in-person handoff; must differ from Enrollment.clinical_reviewing_clinician_id"
      - name: transition_status
        type: enum
        source: system
        description: "Handoff lifecycle state"
        constraints: "one of PENDING | COMPLETED"
      - name: transitioned_at
        type: datetime
        source: computed
        description: "Instant the handoff completed"
      - name: handoff_referral_count
        type: integer
        source: computed
        description: "Number of in-person referrals issued for this enrollment across all CareTransition rows"# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:

  # ---------------------------------------------------------------------------
  # M1 — ClientAccount: branching fork-join with eligibility-gated rejoin
  # ---------------------------------------------------------------------------
  - entity: ClientAccount
    field: account_status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /msk/clients/{id}/close"
        actor: BillingOps
        preconditions:
          - "No EligibilityFile for this client in SCREENED status"
          - "No FeeInvoice for this client in DRAFT status"
        side_effects:
          - "ClientAccount.account_status = CLOSED"
          - "ClientAccount.version increments by 1"
          - "Every EligibilityFile of this client whose file_status is not CLOSED is set to CLOSED, and each such file's version increments by 1"
          - "Every Member of this client whose member_status is PENDING_ELIGIBILITY or ELIGIBLE is set to INELIGIBLE with eligibility_basis = COVERAGE_TERM, and each such member's version increments by 1"
          - "For each Member set to INELIGIBLE by this transition: every Enrollment on that member whose enrollment_status is PENDING_SCREENING or PENDING_CLINICAL_REVIEW is set to ACTIVATION_FAILED, and that Enrollment.version increments by 1"
        note: "Depth-3 cascade: ClientAccount -> Member -> Enrollment, each hop caused by the previous hop, not by the close call itself."

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /msk/clients/{id}/suspend"
        actor: BillingOps
        preconditions:
          - "A reason is supplied"
        side_effects:
          - "ClientAccount.account_status = SUSPENDED"
          - "ClientAccount.version increments by 1"
          - "Every FeeInvoice for this client in DRAFT status is set to VOID"
          - "Every Enrollment of this client in AWAITING_TRANSITION_REVIEW status is set to ACTIVE"
          - "For each Enrollment reverted out of AWAITING_TRANSITION_REVIEW: that Enrollment.version increments by 1, pain_reduction_points = 0.0, function_gain_points = 0.0, attributed_savings_cents = 0, completed_week = null, pending_transition_clinician_id = null"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /msk/clients/{id}/reinstate"
        actor: BillingOps
        preconditions:
          - "ClientAccount.account_status is SUSPENDED"
        side_effects:
          - "ClientAccount.account_status = ACTIVE"
          - "ClientAccount.version increments by 1"
        note: "Reinstatement rejoins the fork at ACTIVE. It does NOT restore voided DRAFT invoices or resurrect reverted enrollments — those side effects are not compensated."

      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /msk/clients/{id}/close"
        actor: BillingOps
        preconditions:
          - "No EligibilityFile for this client in SCREENED status"
          - "No FeeInvoice for this client in DRAFT status"
        side_effects:
          - "ClientAccount.account_status = CLOSED"
          - "ClientAccount.version increments by 1"
          - "Every EligibilityFile of this client whose file_status is not CLOSED is set to CLOSED, and each such file's version increments by 1"
          - "Every Member of this client whose member_status is PENDING_ELIGIBILITY or ELIGIBLE is set to INELIGIBLE with eligibility_basis = COVERAGE_TERM, and each such member's version increments by 1"
          - "For each Member set to INELIGIBLE by this transition: every Enrollment on that member whose enrollment_status is PENDING_SCREENING or PENDING_CLINICAL_REVIEW is set to ACTIVATION_FAILED, and that Enrollment.version increments by 1"

  # ---------------------------------------------------------------------------
  # M2 — Member: status dim x eligibility_basis dim (parallel, non-linear)
  # ---------------------------------------------------------------------------
  - entity: Member
    field: member_status
    initial_state: PENDING_ELIGIBILITY
    terminal_states: [DROPPED]
    parity_dimensions:
      dimension_a: member_status
      dimension_b: eligibility_basis
      description: "member_status and eligibility_basis advance as independent axes on the same row; no stated assignment couples them and both are separately observable."
    transitions:
      - from: PENDING_ELIGIBILITY
        to: ELIGIBLE
        trigger: "POST /msk/eligibility-files/{id}/screen"
        actor: EnrollmentOps
        preconditions:
          - "Member carries at least one row whose musculo_condition_code is not OTHER"
          - "Member.date_of_birth is at least 18 years before the current logical clock instant"
        side_effects:
          - "Member.member_status = ELIGIBLE"
          - "Member.eligibility_basis = MSK_FLAG"
          - "Member.version increments by 1"

      - from: PENDING_ELIGIBILITY
        to: INELIGIBLE
        trigger: "POST /msk/eligibility-files/{id}/screen"
        actor: EnrollmentOps
        preconditions:
          - "Member carries no row whose musculo_condition_code is not OTHER"
        side_effects:
          - "Member.member_status = INELIGIBLE"
          - "Member.eligibility_basis = NO_MSK_FLAG"
          - "Member.version increments by 1"

      - from: [PENDING_ELIGIBILITY, ELIGIBLE]
        to: ELIGIBLE
        trigger: "POST /msk/members/{id}/recompute_eligibility"
        actor: EligibilityService
        preconditions:
          - "Member is at least 18 years before the current logical clock instant"
          - "Member.eligibility_basis is NOT COVERAGE_TERM"
        side_effects:
          - "Member.eligibility_basis = DEMOGRAPHICS"
          - "Member.member_status = ELIGIBLE"
          - "Member.version increments by 1"

      - from: [PENDING_ELIGIBILITY, ELIGIBLE]
        to: INELIGIBLE
        trigger: "POST /msk/members/{id}/recompute_eligibility"
        actor: EligibilityService
        preconditions:
          - "Member.date_of_birth is less than 18 years before the current logical clock instant"
        side_effects:
          - "Member.member_status = INELIGIBLE"
          - "Member.eligibility_basis = DEMOGRAPHICS"
          - "Member.version increments by 1"

      - from: ELIGIBLE
        to: ENROLLED
        trigger: "POST /msk/enrollments/reconcile_reviews (activation leg)"
        actor: ClinicalReviewService
        preconditions:
          - "At least one Enrollment on this member is in PENDING_CLINICAL_REVIEW status with clinical_review_outcome = APPROVED"
        side_effects:
          - "Member.member_status = ENROLLED"
          - "Member.version increments by 1"

      - from: ENROLLED
        to: GRADUATED
        trigger: "POST /msk/enrollments/{id}/complete"
        actor: ClinicalReviewService
        preconditions:
          - "Enrollment.enrollment_status is ACTIVE"
          - "Enrollment has exactly one OutcomeMeasurement in FINALIZED status"
        side_effects:
          - "Member.member_status = GRADUATED"
          - "Member.version increments by 1"
        note: "Cross-entity guard: this transition is reachable only while Enrollment is ACTIVE — see rule 7 instance member_graduation_requires_active_enrollment."

      - from: [ELIGIBLE, ENROLLED]
        to: DROPPED
        trigger: "POST /msk/enrollments/{id}/drop"
        actor: EnrollmentOps
        preconditions:
          - "Enrollment.enrollment_status is ACTIVE"
        side_effects:
          - "Member.member_status = DROPPED"
          - "Member.version increments by 1"

      - from: ENROLLED
        to: ELIGIBLE
        trigger: "POST /msk/enrollments/{id}/drop"
        actor: EnrollmentOps
        preconditions:
          - "Enrollment.enrollment_status is DROPPED"
          - "Member.member_status is ENROLLED"
        side_effects:
          - "Member.member_status = ELIGIBLE"
          - "Member.version increments by 1"
        note: "CYCLIC EDGE: a dropped enrollment returns its member to ELIGIBLE, from which a new enrollment may be created — Member.member_status therefore cycles ELIGIBLE -> ENROLLED -> ELIGIBLE across enrollment attempts."

  # ---------------------------------------------------------------------------
  # M3 — EligibilityFile: linear 4-state pipeline; fee variants computed at SCREENED
  # ---------------------------------------------------------------------------
  - entity: EligibilityFile
    field: file_status
    initial_state: INGESTED
    terminal_states: [CLOSED]
    transitions:
      - from: INGESTED
        to: SCREENED
        trigger: "POST /msk/eligibility-files/{id}/screen"
        actor: EnrollmentOps
        preconditions:
          - "EligibilityFile.file_status is INGESTED"
          - "EligibilityFile carries at least one member row"
        side_effects:
          - "EligibilityFile.file_status = SCREENED"
          - "EligibilityFile.version increments by 1"
          - "Recompute EligibilityFile.eligible_member_count, ineligible_member_count, screened_member_count"
          - "Recompute EligibilityFile.total_monthly_fee_cents (chronological weighted payability-ratio variant)"
          - "Recompute EligibilityFile.provisional_total_monthly_fee_cents (forward-looking payability-ratio variant)"
          - "Recompute EligibilityFile.fee_variance_cents = total_monthly_fee_cents - provisional_total_monthly_fee_cents"
          - "Every Member row on this file transitions PENDING_ELIGIBILITY -> ELIGIBLE or PENDING_ELIGIBILITY -> INELIGIBLE"

      - from: SCREENED
        to: ASSIGNED
        trigger: "POST /msk/eligibility-files/{id}/assign-tracks"
        actor: EnrollmentOps
        preconditions:
          - "EligibilityFile.file_status is SCREENED"
          - "EligibilityFile.eligible_member_count >= 1"
        side_effects:
          - "EligibilityFile.file_status = ASSIGNED"
          - "EligibilityFile.version increments by 1"
          - "Create one Enrollment in PENDING_SCREENING status for every member on this file whose member_status is ELIGIBLE"
          - "For each created Enrollment: Enrollment.eligibility_file_id = this file, Enrollment.member_id = the member, Enrollment.version = 1"
          - "Every created Enrollment auto-advances PENDING_SCREENING -> PENDING_CLINICAL_REVIEW, stamping review_pending_since = the current logical clock instant"

      - from: ASSIGNED
        to: CLOSED
        trigger: "POST /msk/eligibility-files/{id}/close-file"
        actor: EnrollmentOps
        preconditions:
          - "EligibilityFile.file_status is ASSIGNED"
          - "No Enrollment created from this file is in PENDING_SCREENING status"
        side_effects:
          - "EligibilityFile.file_status = CLOSED"
          - "EligibilityFile.version increments by 1"

  # ---------------------------------------------------------------------------
  # M4 — Enrollment: cyclic review loop + branching clinical decision + revert
  # ---------------------------------------------------------------------------
  - entity: Enrollment
    field: enrollment_status
    initial_state: PENDING_SCREENING
    terminal_states: [COMPLETED, DROPPED, TRANSITIONED]
    transitions:
      - from: PENDING_SCREENING
        to: PENDING_CLINICAL_REVIEW
        trigger: "system (EligibilityFile.ASSIGNED auto-advance immediately after creation)"
        actor: system
        preconditions:
          - "Enrollment was created by POST /msk/eligibility-files/{id}/assign-tracks"
        side_effects:
          - "Enrollment.enrollment_status = PENDING_CLINICAL_REVIEW"
          - "Enrollment.review_pending_since = the current logical clock instant"
          - "Enrollment.version increments by 1"

      - from: PENDING_CLINICAL_REVIEW
        to: AWAITING_TRANSITION_REVIEW
        trigger: "POST /msk/enrollments/{id}/transition-reviews"
        actor: Clinician
        preconditions:
          - "Enrollment.enrollment_status is PENDING_CLINICAL_REVIEW"
          - "Enrollment.clinical_review_outcome is not APPROVED"
          - "reason is one of CLINICIAN_REQUEST | NO_ENGAGEMENT | ADVERSE_EVENT"
        side_effects:
          - "Enrollment.enrollment_status = AWAITING_TRANSITION_REVIEW"
          - "Enrollment.transition_reason = the supplied reason"
          - "Enrollment.pending_transition_clinician_id = the id of the Clinician creating this review"
          - "Enrollment.version increments by 1"

      - from: AWAITING_TRANSITION_REVIEW
        to: PENDING_CLINICAL_REVIEW
        trigger: "POST /msk/transition-reviews/{id}/deny"
        actor: ClinicalReviewService
        preconditions:
          - "Enrollment.enrollment_status is AWAITING_TRANSITION_REVIEW"
          - "approving_clinician_id equals Enrollment.pending_transition_clinician_id"
        side_effects:
          - "Enrollment.enrollment_status = PENDING_CLINICAL_REVIEW"
          - "Enrollment.review_pending_since = the current logical clock instant"
          - "Enrollment.transition_reason = null"
          - "Enrollment.pending_transition_clinician_id = null"
          - "Enrollment.version increments by 1"
        note: "CYCLIC EDGE: PENDING_CLINICAL_REVIEW -> AWAITING_TRANSITION_REVIEW -> PENDING_CLINICAL_REVIEW. A denied handoff returns the enrollment to the review queue, so the two states form a lasting loop rather than a one-way demotion."

      - from: [PENDING_CLINICAL_REVIEW, AWAITING_TRANSITION_REVIEW]
        to: ACTIVE
        trigger: "POST /msk/transition-reviews/{id}/approve"
        actor: Clinician
        preconditions:
          - "approving_clinician_id differs from Enrollment.clinical_reviewing_clinician_id"
        side_effects:
          - "Enrollment.enrollment_status = ACTIVE"
          - "Enrollment.enrolled_at = the current logical clock instant"
          - "Enrollment.enrolled_week = week_index(enrolled_at)"
          - "Enrollment.pain_reduction_points = 0.0"
          - "Enrollment.function_gain_points = 0.0"
          - "Enrollment.attributed_savings_cents = 0"
          - "Enrollment.completed_week = null"
          - "Enrollment.transition_reason = null"
          - "Enrollment.pending_transition_clinician_id = null"
          - "Create one CareTransition in PENDING status for this enrollment, with approving_clinician_id = the approving clinician"
          - "If every active Enrollment on the Member is now ACTIVE: Member.member_status = ENROLLED"
          - "Enrollment.version increments by 1"

      - from: [PENDING_SCREENING, PENDING_CLINICAL_REVIEW]
        to: ACTIVATION_FAILED
        trigger: "system (Member becomes INELIGIBLE, or the sponsoring client closes)"
        actor: system
        preconditions:
          - "Enrollment.member_status is INELIGIBLE"
        side_effects:
          - "Enrollment.enrollment_status = ACTIVATION_FAILED"
          - "Enrollment.version increments by 1"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /msk/enrollments/{id}/complete"
        actor: ClinicalReviewService
        preconditions:
          - "Enrollment.enrollment_status is ACTIVE"
          - "Enrollment has exactly one OutcomeMeasurement in FINALIZED status"
        side_effects:
          - "Enrollment.enrollment_status = COMPLETED"
          - "Enrollment.completed_week = week_index of the FINALIZED measurement's measurement_date"
          - "Member.member_status = GRADUATED"
          - "Enrollment.version increments by 1"

      - from: ACTIVE
        to: DROPPED
        trigger: "POST /msk/enrollments/{id}/drop"
        actor: EnrollmentOps
        preconditions:
          - "Enrollment.enrollment_status is ACTIVE"
          - "The enrollment is in its first four measured weeks: week_index of the current logical clock instant minus Enrollment.enrolled_week is less than 4"
          - "Either the member has missed 3 consecutive scheduled ExerciseSession rows, or 2 OutreachContact rows in week_index 1 through 4 are FAILED"
        side_effects:
          - "Enrollment.enrollment_status = DROPPED"
          - "Enrollment.dropout_week = week_index of the current logical clock instant"
          - "Member.member_status = DROPPED"
          - "Enrollment.version increments by 1"

      - from: ACTIVE
        to: TRANSITIONED
        trigger: "POST /msk/care-transitions/{id}/complete"
        actor: Clinician
        preconditions:
          - "Enrollment.enrollment_status is ACTIVE"
          - "The CareTransition carries a valid in-person referral"
        side_effects:
          - "Enrollment.enrollment_status = TRANSITIONED"
          - "CareTransition.transition_status = COMPLETED"
          - "CareTransition.transitioned_at = the current logical clock instant"
          - "CareTransition.handoff_referral_count increments by 1"
          - "Member.member_status = ELIGIBLE"
          - "Enrollment.version increments by 1"

  # ---------------------------------------------------------------------------
  # M5 — ClinicalReview: cyclic revision loop
  # ---------------------------------------------------------------------------
  - entity: ClinicalReview
    field: review_status
    initial_state: SUBMITTED
    terminal_states: [CONDUCTED]
    transitions:
      - from: SUBMITTED
        to: CONDUCTED
        trigger: "POST /msk/clinical-reviews/{id}/conduct"
        actor: Clinician
        preconditions:
          - "ClinicalReview.review_status is SUBMITTED"
          - "Enrollment.enrollment_status is PENDING_CLINICAL_REVIEW"
          - "review_decision is APPROVE"
          - "reviewed_track_id identifies an existing ProgramTrack"
        side_effects:
          - "ClinicalReview.review_status = CONDUCTED"
          - "ClinicalReview.conducted_at = the current logical clock instant"
          - "ClinicalReview.version increments by 1"
          - "Enrollment.program_track_id = reviewed_track_id"
          - "Enrollment.clinical_review_outcome = APPROVED"
          - "Enrollment.clinical_reviewing_clinician_id = reviewer_id"
          - "Enrollment.enrollment_status = AWAITING_TRANSITION_REVIEW"
          - "Enrollment.transition_reason = CLINICIAN_REQUEST"
          - "Enrollment.pending_transition_clinician_id = reviewer_id"
          - "Enrollment.version increments by 1"

      - from: CONDUCTED
        to: SUBMITTED
        trigger: "POST /msk/clinical-reviews/{id}/reopen"
        actor: ClinicalReviewService
        preconditions:
          - "ClinicalReview.review_status is CONDUCTED"
          - "Enrollment.enrollment_status is AWAITING_TRANSITION_REVIEW"
        side_effects:
          - "ClinicalReview.review_status = SUBMITTED"
          - "ClinicalReview.conducted_at = null"
          - "ClinicalReview.version increments by 1"
          - "Enrollment.clinical_review_outcome = null"
          - "Enrollment.program_track_id = null"
          - "Enrollment.enrollment_status = PENDING_CLINICAL_REVIEW"
          - "Enrollment.review_pending_since = the current logical clock instant"
          - "Enrollment.transition_reason = null"
          - "Enrollment.pending_transition_clinician_id = null"
          - "Enrollment.version increments by 1"
        note: "CYCLIC REVISION LOOP: SUBMITTED -> CONDUCTED -> SUBMITTED with no round ceiling. A reopened review must be conducted again before the enrollment can reach ACTIVE."

      - from: CONDUCTED
        to: CONDUCTED
        trigger: "POST /msk/clinical-reviews/{id}/conduct"
        actor: Clinician
        preconditions: []
        side_effects: []
        note: "REJECTED TRANSITION: a conducted review cannot be conducted a second time. The request is refused with ERR_REVIEW_ALREADY_CONDUCTED and no side effect of any kind fires."

      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /msk/clinical-reviews/{id}/conduct"
        actor: Clinician
        preconditions:
          - "Enrollment.enrollment_status is NOT PENDING_CLINICAL_REVIEW"
        side_effects: []
        note: "REJECTED TRANSITION: the enrollment is not in the review queue. The request is refused with ERR_ENROLLMENT_NOT_IN_REVIEW with no side effect."

  # ---------------------------------------------------------------------------
  # M6 — ExerciseSession: linear pipeline + automatic system MISSED transition
  # ---------------------------------------------------------------------------
  - entity: ExerciseSession
    field: session_status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /msk/exercise-sessions/{id}/complete"
        actor: Member
        preconditions:
          - "ExerciseSession.session_status is SCHEDULED"
          - "Enrollment.enrollment_status is ACTIVE"
          - "session_week equals week_index of the current logical clock instant"
          - "completed_denominator_units is at least 0"
          - "pain_score_after is supplied"
        side_effects:
          - "ExerciseSession.session_status = COMPLETED"
          - "ExerciseSession.completed_reps = planned_reps"
          - "ExerciseSession.completed_minutes = planned_minutes"
          - "ExerciseSession.pain_score_before = the member's latest recorded pain score"
          - "ExerciseSession.adherence_numerator = min(1, completed_denominator_units + (1.0 if pain_score_after <= pain_score_before else 0.0))"
          - "ExerciseSession.adherence_denominator = 1 * (2 if track_restricted else 1)"
          - "Recompute Enrollment.adherence_rate over COMPLETED sessions whose session_week is less than the current week_index"
          - "does NOT recompute Enrollment.dropout_risk_score: a member-sourced session completion never moves the member-sourced risk score. The breach that follows from this session's completed_denominator_units, if fractional, may breach the week's inclusivity cut and is applied by the next weekly reconciliation"
          - "Recompute Enrollment.adherence_scored_through_week"
          - "Recompute Enrollment.weeks_active"
          - "Recompute Enrollment.projected_engagement_milestone"
          - "ExerciseSession.version increments by 1"
          - "Enrollment.version increments by 1"

      - from: SCHEDULED
        to: MISSED
        trigger: "system (weekly reconciliation at 2026-09-07T00:00:00Z + 7 * W days)"
        actor: system
        preconditions:
          - "ExerciseSession.session_status is SCHEDULED"
          - "session_week < the week_index of the current logical clock instant"
        side_effects:
          - "ExerciseSession.session_status = MISSED"
          - "ExerciseSession.adherence_numerator = 0"
          - "Recompute Enrollment.adherence_rate over COMPLETED sessions whose session_week is less than the current week_index"
          - "Recompute Enrollment.dropout_risk_score"
          - "Recompute Enrollment.dropout_risk_as_of_week"
          - "ExerciseSession.version increments by 1"
          - "Enrollment.version increments by 1"

      - from: MISSED
        to: COMPLETED
        trigger: "POST /msk/exercise-sessions/{id}/complete"
        actor: Member
        preconditions: []
        side_effects: []
        note: "REJECTED TRANSITION: a missed session can never be completed retroactively. The request is refused with ERR_INVALID_STATE and no session credit is granted."

  # ---------------------------------------------------------------------------
  # M7 — OutreachContact: linear pipeline + automatic window-lapse FAILED
  # ---------------------------------------------------------------------------
  - entity: OutreachContact
    field: outreach_status
    initial_state: QUEUED
    terminal_states: [DELIVERED, FAILED]
    transitions:
      - from: QUEUED
        to: DELIVERED
        trigger: "POST /msk/outreach-contacts/{id}/deliver"
        actor: OutreachService
        preconditions:
          - "OutreachContact.outreach_status is QUEUED"
          - "Enrollment.enrollment_status is ACTIVE"
          - "contact_week equals week_index of the current logical clock instant"
          - "the member has missed 3 or fewer consecutive scheduled ExerciseSession rows"
        side_effects:
          - "OutreachContact.outreach_status = DELIVERED"
          - "OutreachContact.contact_occurred_at = the current logical clock instant"
          - "Recompute Enrollment.dropout_risk_score"
          - "Recompute Enrollment.dropout_risk_as_of_week"
          - "OutreachContact.version increments by 1"
          - "Enrollment.version increments by 1"

      - from: QUEUED
        to: FAILED
        trigger: "system (weekly reconciliation at 2026-09-07T00:00:00Z + 7 * W days)"
        actor: system
        preconditions:
          - "OutreachContact.outreach_status is QUEUED"
          - "contact_week < the week_index of the current logical clock instant"
        side_effects:
          - "OutreachContact.outreach_status = FAILED"
          - "Recompute Enrollment.dropout_risk_score"
          - "OutreachContact.version increments by 1"
          - "Enrollment.version increments by 1"

      - from: DELIVERED
        to: QUEUED
        trigger: "POST /msk/outreach-contacts/{id}/deliver"
        actor: OutreachService
        preconditions: []
        side_effects: []
        note: "REJECTED TRANSITION: an outreach contact cannot be re-delivered. The request is refused with ERR_INVALID_STATE."

  # ---------------------------------------------------------------------------
  # M8 — Clinician: branching availability with revert
  # ---------------------------------------------------------------------------
  - entity: Clinician
    field: clinician_status
    initial_state: AVAILABLE
    terminal_states: [DEACTIVATED]
    transitions:
      - from: AVAILABLE
        to: LIMITED
        trigger: "POST /msk/clinicians/{id}/limit"
        actor: ClinicalOps
        preconditions:
          - "Clinician.clinician_status is AVAILABLE"
        side_effects:
          - "Clinician.clinician_status = LIMITED"
          - "Clinician.version increments by 1"

      - from: LIMITED
        to: AVAILABLE
        trigger: "POST /msk/clinicians/{id}/restore"
        actor: ClinicalOps
        preconditions:
          - "Clinician.clinician_status is LIMITED"
        side_effects:
          - "Clinician.clinician_status = AVAILABLE"
          - "Clinician.version increments by 1"

      - from: [AVAILABLE, LIMITED]
        to: DEACTIVATED
        trigger: "POST /msk/clinicians/{id}/deactivate"
        actor: ClinicalOps
        preconditions:
          - "No Appointment for this clinician is in SCHEDULED status"
        side_effects:
          - "Clinician.clinician_status = DEACTIVATED"
          - "Clinician.version increments by 1"
          - "Every Appointment for this clinician in SCHEDULED status is set to CANCELLED"
          - "For each such Appointment: cancelled_at = the current logical clock instant, and Enrollment.pain_reduction_points on that appointment's enrollment is set to 0.0"
          - "For each affected enrollment: Enrollment.consult_cancellation_count increments by 1 and Enrollment.version increments by 1"
          - "increments Clinician.version by 1"

  # ---------------------------------------------------------------------------
  # M9 — Appointment: linear pipeline + automatic NO_SHOW with cascading revert
  # ---------------------------------------------------------------------------
  - entity: Appointment
    field: appointment_status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /msk/appointments/{id}/complete"
        actor: Clinician
        preconditions:
          - "Appointment.appointment_status is SCHEDULED"
          - "the appointment's start instant is at or before the current logical clock instant"
        side_effects:
          - "Appointment.appointment_status = COMPLETED"
          - "Recompute Clinician.weekly_completed_minutes for the ISO week of appointment_date"
          - "Appointment.version increments by 1"
          - "Clinician.version increments by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /msk/appointments/{id}/cancel"
        actor: "Clinician, EnrollmentOps"
        preconditions:
          - "Appointment.appointment_status is SCHEDULED"
        side_effects:
          - "Appointment.appointment_status = CANCELLED"
          - "Appointment.cancelled_at = the current logical clock instant"
          - "Enrollment.consult_cancellation_count on this appointment's enrollment increments by 1"
          - "Enrollment.version increments by 1"
          - "Appointment.version increments by 1"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (weekly reconciliation at 2026-09-07T00:00:00Z + 7 * W days)"
        actor: system
        preconditions:
          - "Appointment.appointment_status is SCHEDULED"
          - "the appointment's start instant is strictly before the current logical clock instant"
        side_effects:
          - "Appointment.appointment_status = NO_SHOW"
          - "Enrollment.pain_reduction_points on this appointment's enrollment is set to 0.0"
          - "Enrollment.function_gain_points on this appointment's enrollment is set to 0.0"
          - "Enrollment.version increments by 1"
          - "Appointment.version increments by 1"

  # ---------------------------------------------------------------------------
  # M10 — OutcomeMeasurement: linear pipeline; FINALIZED measurements are locked
  # ---------------------------------------------------------------------------
  - entity: OutcomeMeasurement
    field: measurement_status
    initial_state: RECORDED
    terminal_states: [SUPERSEDED, FINALIZED]
    transitions:
      - from: RECORDED
        to: SUPERSEDED
        trigger: "POST /msk/outcome-measurements/{id}/supersede"
        actor: ClinicalReviewService
        preconditions:
          - "OutcomeMeasurement.measurement_status is RECORDED"
          - "The replacement measurement belongs to the same enrollment and the same claim window rank"
        side_effects:
          - "OutcomeMeasurement.measurement_status = SUPERSEDED"
          - "OutcomeMeasurement.attributed_savings_cents = 0"
          - "Recompute Enrollment.attributed_savings_cents as the sum of attributed_savings_cents over OutcomeMeasurement rows of this enrollment whose measurement_status is RECORDED or FINALIZED"
          - "OutcomeMeasurement.version increments by 1"
          - "Enrollment.version increments by 1"

      - from: RECORDED
        to: FINALIZED
        trigger: "POST /msk/enrollments/reconcile-reviews (finalization leg)"
        actor: ClinicalReviewService
        preconditions:
          - "OutcomeMeasurement.measurement_status is RECORDED"
          - "The measurement's 4-week claim window has lapsed: window_end_week < week_index of the current logical clock instant"
          - "Enrollment.enrollment_status is ACTIVE"
          - "The enrollment carries no FINALIZED measurement yet"
        side_effects:
          - "OutcomeMeasurement.measurement_status = FINALIZED"
          - "Enrollment.pain_reduction_points = OutcomeMeasurement.pain_delta_points"
          - "Enrollment.function_gain_points = OutcomeMeasurement.function_delta_points"
          - "OutcomeMeasurement.version increments by 1"
          - "Enrollment.version increments by 1"

      - from: FINALIZED
        to: SUPERSEDED
        trigger: "POST /msk/outcome-measurements/{id}/supersede"
        actor: ClinicalReviewService
        preconditions: []
        side_effects: []
        note: "REJECTED TRANSITION: a FINALIZED measurement is locked and can never be superseded. The request is refused with ERR_MEASUREMENT_FINALIZED."

  # ---------------------------------------------------------------------------
  # M11 — FeeInvoice: branching with revert
  # ---------------------------------------------------------------------------
  - entity: FeeInvoice
    field: invoice_status
    initial_state: DRAFT
    terminal_states: [FINALIZED, VOID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /msk/fee-invoices/{id}/finalize"
        actor: BillingOps
        preconditions:
          - "FeeInvoice.invoice_status is DRAFT"
          - "ClientAccount.account_status is ACTIVE"
          - "FeeInvoice.additional_fee_component_cents is 0"
        side_effects:
          - "FeeInvoice.invoice_status = FINALIZED"
          - "FeeInvoice.billing_model_snapshot = ClientAccount.billing_model"
          - "Recompute FeeInvoice.milestone_engagement_component_cents (time-allocation variant)"
          - "Recompute FeeInvoice.savings_share_component_cents"
          - "Recompute FeeInvoice.provisional_amount_cents"
          - "Recompute FeeInvoice.final_amount_cents"
          - "Recompute FeeInvoice.net_delta_cents"
          - "FeeInvoice.finalized_total_cents = final_amount_cents"
          - "FeeInvoice.version increments by 1"

      - from: DRAFT
        to: VOID
        trigger: "POST /msk/fee-invoices/{id}/void"
        actor: BillingOps
        preconditions:
          - "FeeInvoice.invoice_status is DRAFT"
        side_effects:
          - "FeeInvoice.invoice_status = VOID"
          - "FeeInvoice.version increments by 1"

      - from: FINALIZED
        to: DRAFT
        trigger: "POST /msk/fee-invoices/{id}/reopen"
        actor: BillingOps
        preconditions:
          - "FeeInvoice.invoice_status is FINALIZED"
          - "ClientAccount.account_status is ACTIVE"
        side_effects:
          - "FeeInvoice.invoice_status = DRAFT"
          - "FeeInvoice.finalized_total_cents = null"
          - "FeeInvoice.version increments by 1"

      - from: VOID
        to: DRAFT
        trigger: "POST /msk/fee-invoices/{id}/reopen"
        actor: BillingOps
        preconditions: []
        side_effects: []
        note: "REJECTED TRANSITION: a voided invoice can never be reopened. The request is refused with ERR_INVOICE_ALREADY_VOID."

  # ---------------------------------------------------------------------------
  # M12 — CareTransition: linear pipeline
  # ---------------------------------------------------------------------------
  - entity: CareTransition
    field: transition_status
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /msk/care-transitions/{id}/complete"
        actor: Clinician
        preconditions:
          - "CareTransition.transition_status is PENDING"
          - "Enrollment.enrollment_status is ACTIVE"
        side_effects:
          - "CareTransition.transition_status = COMPLETED"
          - "CareTransition.transitioned_at = the current logical clock instant"
          - "CareTransition.handoff_referral_count increments by 1"
          - "Enrollment.enrollment_status = TRANSITIONED"
          - "Member.member_status = ELIGIBLE"
          - "CareTransition.version increments by 1"
          - "Enrollment.version increments by 1"
        note: "Reached identically from both activation paths: the CareTransition seeded by POST /msk/transition-reviews/{id}/approve and the one opened directly by POST /msk/care-transitions while the enrollment is already ACTIVE."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:

  - rule_id: eligibility-file-assignment-stale-client
    parent_entity: ClientAccount
    write_endpoint: "POST /msk/eligibility-files/{id}/assign-tracks"
    occ_field: "expected_client_account_version"
    description: |
      Assigning program tracks off an eligibility file against a client account
      whose version has advanced since the client last observed it is rejected.
      A client account may legitimately carry several eligibility files and its
      version advances every time one of them is screened, so the assigning
      writer's view of the account is stale whenever another file has moved
      through screening.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: enrollment-activation-stale-file
    parent_entity: EligibilityFile
    write_endpoint: "POST /msk/transition-reviews/{id}/approve"
    occ_field: "expected_eligibility_file_version"
    description: |
      Activating an enrollment against the eligibility file whose roster
      produced it, while that file's version has advanced since the client last
      observed it, is rejected. A roster file is re-screened and re-assigned as
      corrections land, so an approval carrying the version read at file
      ingestion is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: roster_fee_payability_weighted
    trigger: "EligibilityFile transitions INGESTED -> SCREENED"
    algorithm: chronological
    formula: |
      For each Member m on the eligibility file, evaluated in the SCREENED state:
        weight(m) = 1.00 if m.member_status == ELIGIBLE
                  = 0.50 if m.member_status == INELIGIBLE

      Base fee:
        base = the base_fee_per_member_cents of the ProgramTrack whose track_code
               is ACUTE (the roster base, in force before any clinical assignment)
        When EligibilityFile.roster_format == LEGACY: base = floor(base * 0.75)
        NESTED ROUNDING, PINNED: the LEGACY floor is applied per member BEFORE the
        weighted sum. Summing first and flooring once afterwards returns different
        cents whenever any member's base is not an exact multiple of 4.

      Weighted numerator:
        weighted_numerator = sum over m of ( base(m) * 100 * weight(m) )

      Chronological variant (base):
        total_monthly_fee_cents = round_half_up( weighted_numerator / eligible_member_count )
        INCLUSION SET: every Member row on this file, in roster row order.
        ZERO-DENOMINATOR RULE: if eligible_member_count == 0 then
          total_monthly_fee_cents = 0.
        EVALUATION ORDER: weights are resolved from member_status first, then
        divided by eligible_member_count, then rounded once at the end.

      Forward-looking variant (provisional):
        provisional_total_monthly_fee_cents =
          round_half_up( weighted_numerator / ( member_row_count * expected_monthly_engagement_rate ) )
        INCLUSION SET: the same weighted numerator over every Member row.
        DECLARED DIVERGENCE: the forward-looking variant projects the eligible
        denominator from the contract's expected_monthly_engagement_rate rather
        than from the members that actually screened in, so the two variants
        return different cents for the same roster whenever the observed
        eligible share differs from the contractual expectation.

      fee_variance_cents = total_monthly_fee_cents - provisional_total_monthly_fee_cents
    input_set: "Member rows on the eligibility file; only rows with a non-null musculo_condition_code"
    constants:
      ELIGIBLE_WEIGHT: 1.00
      INELIGIBLE_WEIGHT: 0.50
      LEGACY_ROSTER_MULTIPLIER: 0.75
    precision: "integer cents, round_half_up applied once at the end of each variant"
    variants:
      - name: chronological_actual_payability
        when: "Default reading, used for the billed roster fee"
        difference: "Divides the weighted numerator by the count of members that actually screened ELIGIBLE."
      - name: forward_looking_expected_payability
        when: "Contracted projection, used for the provisional roster fee"
        difference: "Divides the same weighted numerator by member_row_count * expected_monthly_engagement_rate instead of the observed eligible count."

  - name: attributed_savings_severity_bucket
    trigger: "OutcomeMeasurement creation and re-evaluation at window lapse; also used by FeeInvoice"
    algorithm: aggregation
    formula: |
      Inclusion set: every ClaimLine of this enrollment whose
        claim_service_week is at or after OutcomeMeasurement.window_start_week
        and strictly before OutcomeMeasurement.window_end_week + 1
        (half-open on the upper end), and whose claim_superseded is false.

      ProgramTrack.severity_weights carries exactly two keys, LOW and HIGH; a
      MODERATE line takes the LOW weight (declared collation ruling).

      severity_weight(line, w) = ProgramTrack.severity_weights["HIGH"] if the line
                                 is a HIGH-severity surgical line evaluated in week w
                               = ProgramTrack.severity_weights["LOW"] otherwise
      selected_severity_weight(line) = the MAXIMUM, taken in collation order, of
                                       severity_weight(line, w) over the window's
                                       evaluation weeks w

      attributed_savings_cents = round_half_up(
        sum over included lines of
          ( line.amount_cents * selected_severity_weight(line) * window_engagement_rate )
      )

      window_engagement_rate = Enrollment.adherence_rate as recomputed within the
        measurement's window (the same value used by the engagement milestone).

      VERSION-PINNED VARIANT (base, the authoritative one):
        Instances of ClaimLine are versioned. The savings attributed to the
        window use the ClaimLine instance that is current at the instant the
        measurement is evaluated, and that instance's amount_cents is frozen for
        the life of this attribution. Laguna never reprocesses a line that was
        amended after the window was evaluated.
      BILLING-TIME RE-EVALUATION VARIANT (deliberately divergent, separately persisted):
        The same formula re-evaluated with each line's superseded instance
        substituted and with the engagement rate recomputed as of the invoice
        creation instant. This variant sets FeeInvoice.savings_share_component_cents
        and MUST NOT write OutcomeMeasurement.attributed_savings_cents or
        Enrollment.attributed_savings_cents, which stay on the version-pinned
        variant. The two readings therefore diverge on the same underlying window
        whenever a line has been superseded, and both are observable on their own
        endpoint.

      ORDER: sum first over lines in ascending claim_service_week, then
      ascending created_at for ties, then round once.
    input_set: "ClaimLine rows in the window whose claim_superseded is false and claim_service_week in [window_start_week, window_end_week + 1)"
    constants:
      SEVERITY_WEIGHT_RECORD: {}
    precision: "integer cents, round_half_up applied once after the sum"
    variants:
      - name: version_pinned_current_line
        when: "Default and authoritative; used whenever attributed_savings_cents is persisted"
        difference: "Uses each ClaimLine instance current at evaluation time and freezes that amount for the life of the attribution; writes OutcomeMeasurement.attributed_savings_cents and Enrollment.attributed_savings_cents."
      - name: billing_time_reevaluation
        when: "Invoice construction only; writes FeeInvoice.savings_share_component_cents"
        difference: "Substitutes superseded line instances and recomputes the engagement rate at invoice creation, so the same window yields a different cent total from the version-pinned reading."

  - name: engagement_milestone_trigger
    trigger: "ExerciseSession completion, weekly reconciliation, and FeeInvoice creation"
    algorithm: threshold
    formula: |
      projected_engagement_milestone = 1 when BOTH:
        Enrollment.weeks_active >= 1
        Enrollment.adherence_rate >= ProgramTrack.min_adherence_rate
      projected_engagement_milestone = 0 otherwise.

      adhered_group(<comparison>) = { e in enrollments of this client :
          e.enrollment_status == ACTIVE
          AND e.weeks_active >= 1
          AND <comparison>(e.adherence_rate, e.track.min_adherence_rate) }

      milestone_member_count = |adhered_group(e.adherence_rate >= e.track.min_adherence_rate)|
      milestone_engagement_component_cents = round_half_up(
        sum over e in adhered_group(>=) of
          ( e.track.base_fee_per_member_cents * e.weeks_active / 4 ) )

      BOUNDARY: the comparison is `>=`, so a member landing exactly on the
      track's min_adherence_rate is inside the group.
    input_set: "Enrollments of the client whose enrollment_status is ACTIVE"
    constants:
      MILESTONE_MEMBER_UNIT_CENTS: 1000000
      WEEKLY_TRACK_FEE_DIVISOR: 100
    precision: "integer cents, round_half_up applied once after the sum"
    variants:
      - name: inclusive_boundary
        when: "Default; used for billing"
        difference: "Members exactly at min_adherence_rate count as having met the engagement milestone."
      - name: strict_boundary
        when: "Internal trending report only, never used for billing"
        difference: "Requires adherence_rate strictly greater than min_adherence_rate, so members exactly on the boundary are excluded."

  - name: invoice_milestone_time_allocation
    trigger: "FeeInvoice finalization, client suspension, daily reconciliation"
    algorithm: waterfall_allocation
    formula: |
      INCLUSION SET: every Enrollment e of this client with
        e.enrolled_week >= week_index(billing_period first day, inclusive)
        and e.enrolled_week < week_index(billing_period first day + 1 month, exclusive).

      months_active(e) = floor((current_week - e.enrolled_week) / 4)
      pinned_share(e) = round_half_up(e.track.base_fee_per_member_cents * months_active(e))
      trailing_delta(e) = round_half_up(
          e.track.base_fee_per_member_cents
          * ((current_week - e.enrolled_week) - 4 * months_active(e)) / 4 )

      provisional_amount_cents (forward-looking at invoice creation):
        = sum over the inclusion set of pinned_share(e)
          + round_half_up(sum over RECORDED measurements in the period of attributed_savings_cents
                          * ClientAccount.savings_share_rate)

      final_amount_cents (chronological, recomputed at finalization):
        = recomputed_component_cents
          + round_half_up(sum over RECORDED AND FINALIZED measurements in the period
                          of attributed_savings_cents * ClientAccount.savings_share_rate)

      recomputed_component_cents (FULL RECOMPUTE of the pinned component, expressed
      as a formula over the current tables rather than as a running adjustment):
        = sum over the inclusion set of ( pinned_share(e) + trailing_delta(e) )
        + sum over every member m that the milestone recompute at finalization moves
            from outside adhered_group(>=) to inside it, of
              membership_delta(m) = round_half_up( m.track.base_fee_per_member_cents
                                                    * m.weeks_active / 4 )
        - sum over every member m that the milestone recompute at finalization moves
            from inside adhered_group(>=) to outside it, of the same membership_delta(m)

      additional_fee_component_cents (fee arising from reconciliations that LAPSED
      AFTER this invoice was created: an enrollment of this client that reaches
      COMPLETED with a completed_week inside the billing period strictly after the
      invoice's own created_at):
        = sum over each such enrollment e of round_half_up(
            e.track.base_fee_per_member_cents * e.weeks_active / 4 )
        It is 0 at creation and stays 0 while no later reconciliation lands in the
        period; POST /msk/fee-invoices/{id}/finalize refuses a non-zero value.

      net_delta_cents = final_amount_cents - provisional_amount_cents

      EVALUATION ORDER (pinned): pinned shares are computed before the
      alternatives branch is summed; the engagement component is computed before
      the savings component; every component is rounded once, at the end.
    input_set: "Enrollments whose enrolled_week falls in the billing period; measurements not SUPERSEDED"
    constants:
      WEEKS_PER_MONTH: 4
    precision: "integer cents, round_half_up applied once per component"
    variants:
      - name: forward_looking_invoice
        when: "Provisional amount quoted at invoice creation"
        difference: "Only measurements already RECORDED enter the savings share; members who have not yet cleared their waiver deadline are excluded from the engagement component."
      - name: chronological_invoice
        when: "Final amount billed when the invoice is FINALIZED"
        difference: "Adds every reconciliation delta, counts FINALIZED measurements, and so returns a different total for identical underlying data."

  - name: dropout_risk_score
    trigger: "ExerciseSession completion, ExerciseSession weekly MISSED reconciliation, ExerciseSession creation (recompute only), and the client's weekly reconciliation"
    algorithm: weighted_scoring
    formula: |
      INCLUSION SET: every ExerciseSession of this enrollment whose
        session_week is at or after Enrollment.enrolled_week and strictly before
        the current week_index (half-open upper bound — sessions booked into the
        current week never enter).

      consecutive_missed = length of the maximal run of consecutive week_index
        values ending at (current week_index - 1) whose scheduled sessions all
        carry session_status == MISSED

      lapsed_outreach_count = count of OutreachContact rows of this enrollment
        whose contact_week is in 1..4 inclusive and whose outreach_status is
        FAILED because the contact expired without a member-sourced delivery

      explicit_failed_outreach_count = count of OutreachContact rows of this
        enrollment whose contact_week is in 1..4 inclusive and whose
        outreach_status is FAILED with an explicit negative delivery event

      raw = 12 * consecutive_missed
          + 15 * (lapsed_outreach_count + explicit_failed_outreach_count)
          + 40 * (1 if Enrollment.adherence_rate < 0.35 else 0)
          + 20 * (1 if weeks_active >= 4 and Enrollment.adherence_rate < 0.50 else 0)

      dropout_risk_score = min(100, raw)
      dropout_risk_as_of_week = the current week_index

      ORDER: consecutive_missed is computed over weeks in ascending order;
      ties in any per-week ordering break on created_at ascending, never on id.
    input_set: "ExerciseSession rows of this enrollment with session_week in [enrolled_week, current week_index)"
    constants:
      PER_MISSED_WEEK: 12
      PER_FAILED_OUTREACH: 15
      LOW_ADHERENCE_PENALTY: 40
      LOW_ADHERENCE_THRESHOLD: 0.35
      STALE_ENGAGEMENT_PENALTY: 20
      STALE_ENGAGEMENT_START_WEEK: 4
      STALE_ENGAGEMENT_THRESHOLD: 0.50
      SCORE_CEILING: 100

  - name: spine_red_flags_weight
    trigger: "POST /msk/clients/{id}/run-weekly-reconciliation, once per advanced week"
    algorithm: weighted_scoring
    formula: |
      red_flag_weight = sum over m in Member.red_flag_multipliers of (m - 1.0)

      INCLUDED: every Member of a client whose member_status is ELIGIBLE or
      ENROLLED and whose musculo_condition_code is LOW_BACK or NECK.

      The reconciliation runs exactly once for each advanced week, and compares
      that week's red_flag_weight against ESCALATION_THRESHOLD with a
      strictly-greater test — a member landing exactly on 0.30 is not escalated
      and no week is ever processed twice.

      CONTRAST WITH THE AUTHORITATIVE FORMULA: the engagement_milestone_trigger
      uses an inclusive `>=` comparison against
      ProgramTrack.min_adherence_rate, a value that reaches at most 1, whereas
      spine_red_flags_weight uses a strictly-greater `>` comparison against the
      sub-unit threshold 0.30. The two boundaries sit on different metrics and
      are reached through different endpoints; they must not be merged.
    input_set: "Members carrying a LOW_BACK or NECK condition code whose member_status is ELIGIBLE or ENROLLED"
    constants:
      ESCALATION_THRESHOLD: 0.30
    precision: "2 decimal places, round_half_up"

  - name: adherence_rate_restricted
    trigger: "ExerciseSession creation and completion, weekly reconciliation"
    algorithm: aggregation
    formula: |
      INCLUSION SET: every ExerciseSession bound to THIS enrollment whose
        session_week is at or after Enrollment.enrolled_week and whose
        session_week is strictly less than the current week_index. Session-scoped
        — a session bound to a different enrollment never enters, even when the
        same member owns both enrollments.

      weeks_active = week_index(current logical clock instant) - Enrollment.enrolled_week

      adherence_rate = round_half_up(
          sum over included sessions of adherence_numerator
          / sum over included sessions of adherence_denominator
        , 2)

      adherence_scored_through_week = the current week_index

      ZERO-DENOMINATOR RULE: when the inclusion set is empty, adherence_rate
      is 0.0 — not null, and not an error.

      EXCLUSION RULE: an ExerciseSession bound to an enrollment that was
      DROPPED is dropped from the inclusion set and never contributes to any
      later enrollment's adherence_rate.

      CURRENT-WEEK EXCLUSION: sessions booked into the week the clock currently
      sits in never enter, whether they are COMPLETED or MISSED.
    input_set: "ExerciseSession rows of this enrollment with session_week in [enrolled_week, current week_index)"
    constants:
      ADHERENCE_SCALE: 2
    precision: "2 decimal places, round_half_up"

  - name: review_reconciliation_ladder
    trigger: "POST /msk/enrollments/reconcile-reviews; also applied at weekly reconciliation"
    algorithm: chronological
    formula: |
      INCLUSION SET: every Enrollment whose review_pending_since is non-null.

      For each enrollment, in ascending order of review_pending_since and, for
      ties, ascending created_at, never id:

        weeks_pending = floor( (current logical clock instant - review_pending_since)
                               / (7 days) )

        weekly_outreach_required_this_week = 2 if weeks_pending >= 1 else 1

        lapsed(f) = f.review_pending_since + 7 days
        lapsed_c = c.review_opened_at + 7 days

        at step 2: if any ClinicalReview on this enrollment is SUBMITTED and
          lapsed_c <= the current instant, set ClinicalReview.review_status = CONDUCTED
          with review_decision = REJECT. If several qualify, process them in
          ascending review_opened_at.

        at step 3: if Enrollment.transition_reason == NO_ENGAGEMENT and its
          created_at is strictly before the instant 14 days ago, process the
          enrollment as ACTIVATION_FAILED, writing every field of that
          transition. For ties, ascending created_at.

        at step 4: for every EligibilityFile still in INGESTED status, if
          lapsed(f) <= the current instant, process the file as SCREENED and
          recompute the two roster-fee variants.

      The ladder is idempotent: a second call makes no further change.
    input_set: "Enrollments with a non-null review_pending_since; EligibilityFile rows in INGESTED"
    constants:
      REVIEW_LAPSE_DAYS: 7
      NO_ENGAGEMENT_STALE_DAYS: 14
      WEEKLY_OUTREACH_AFTER_FIRST_LAPSE: 2
    precision: "not applicable (state-only ladder)"

  - name: retention_credit_compensation
    trigger: "POST /msk/clients/{id}/suspend"
    algorithm: aggregation
    formula: |
      INCLUSION SET: every FeeInvoice of this client whose invoice_status is DRAFT.

      draft_invoice_count_before = count of DRAFT invoices of this client
      retained_credit_amount_cents = sum over those invoices of provisional_amount_cents

      On suspend:
        every such invoice is set to VOID, so
          draft_invoice_count_after = 0
        and the member-week supply is reverted:
          sum over enrollments of this client of weeks_active  (unchanged by the void)
        and the milestone-count side is referenced, not persisted:
          proposal_member_count   (read-only view)
          proposal_amount_cents   (read-only view)

      CONSERVED QUANTITIES (both must hold after any forward/compensating pair):
        draft_invoice_count_before - draft_invoice_count_after
          == number of invoices voided by this transition
        retained_credit_amount_cents
          == sum over the voided invoices of provisional_amount_cents

      REINSTATEMENT INVARIANT: POST /msk/clients/{id}/reinstate does NOT restore any
      voided invoice, so retained_credit_amount_cents stays at zero after the
      pair. Any implementation that re-creates the voided DRAFT invoices drifts
      this quantity and fails.
    input_set: "FeeInvoice rows of this client with invoice_status DRAFT"
    constants:
      CREDIT_SCALE: 100
    precision: "integer cents, round_half_up applied once per component"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present, and X-User-Role names a role declared in §1.7"
    error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "X-User-ID is permitted for the requested operation under the §1.7 role matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all write endpoints

  - priority: 3
    category: existence
    check: "The referenced resource exists; when several ids on the path are unknown the leftmost segment wins and produces that resource's 404"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all path-addressed endpoints

  - priority: 4
    category: state
    check: "The enrollment a clinical review is conducted against is PENDING_CLINICAL_REVIEW; an enrollment that has moved on cannot accept a recorded decision"
    error_id: ERR_ENROLLMENT_NOT_IN_REVIEW
    http_status: 409
    applies_to: ["POST /msk/clinical-reviews/{id}/conduct"]

  - priority: 5
    category: business_safety
    check: "No clinical-reviewing clinician may also approve the in-person transition on the same enrollment: approving_clinician_id must differ from Enrollment.clinical_reviewing_clinician_id"
    error_id: ERR_CLINICIAN_DUAL_ROLE
    http_status: 403
    applies_to: ["POST /msk/transition-reviews/{id}/approve", "POST /msk/care-transitions/{id}/complete"]

  - priority: 6
    category: business_safety
    check: "A vital-signs reading supplied on a session or measurement must not contradict the recorded baseline: pain_score_after must be within [0, 10] and function_score within [0, 100]"
    error_id: ERR_VITALS_OUT_OF_RANGE
    http_status: 422
    applies_to: ["POST /msk/outcome-measurements", "POST /msk/exercise-sessions/{id}/complete"]

  - priority: 7
    category: business_constraint
    check: "The two encounter slots occupied on a clinician's day must not start less than 60 minutes apart, and no single complete 60-minute block may be occupied twice in one day"
    error_id: ERR_APPOINTMENT_OVERLAP
    http_status: 422
    applies_to: ["POST /msk/appointments"]

  - priority: 8
    category: business_constraint
    check: "The aggregate scheduled minutes for one clinician in one ISO week must not exceed weekly_capacity_slots times 60; a booking landing exactly on the cap is permitted"
    error_id: ERR_CLINICIAN_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["POST /msk/appointments"]

  - priority: 9
    category: business_constraint
    check: "A single enrollment may not carry two ExerciseSession rows in the same ISO week: session_week must be unique per enrollment"
    error_id: ERR_WEEK_ALREADY_SCHEDULED
    http_status: 409
    applies_to: ["POST /msk/enrollments/{id}/sessions"]

  - priority: 9
    category: business_constraint
    check: "A new roster file's period must be strictly later than the client's greatest existing non-superseded roster period exactly when the file is challenged for recency; the recency check is applied only on the challenged path, not on every ingest"
    error_id: ERR_FILE_PERIOD_REGRESSION
    http_status: 409
    applies_to: ["POST /msk/eligibility-files"]

  - priority: 10
    category: business_referential
    check: "A member must be older than 18 years at the current logical clock instant when the enrollment is opened"
    error_id: ERR_PATIENT_UNDERAGE
    http_status: 422
    applies_to: ["POST /msk/enrollments"]

  - priority: 10
    category: business_temporal
    check: "A downstream claim line may not be recorded into an attribution window that has already lapsed at the current week_index"
    error_id: ERR_CLAIM_LINE_WINDOW_CLOSED
    http_status: 409
    applies_to: ["POST /msk/claim-lines"]

  - priority: 11
    category: business_temporal
    check: "An outreach contact may not be queued into a week that has already passed at the current week_index"
    error_id: ERR_OUTREACH_WEEK_LAPSED
    http_status: 409
    applies_to: ["POST /msk/outreach-contacts"]

  - priority: 12
    category: business_constraint
    check: "A single enrollment may not carry two outcome measurements for the same week: measurement_week must be unique per enrollment exactly when a measurement for that week has already been RECORDED and not SUPERSEDED"
    error_id: ERR_MEASUREMENT_WEEK_DUPLICATE
    http_status: 409
    applies_to: ["POST /msk/outcome-measurements"]

  - priority: 13
    category: business_fiscal
    check: "The client's account_status must be ACTIVE for any write that creates billable work"
    error_id: ERR_CLIENT_NOT_ACTIVE
    http_status: 422
    applies_to: ["POST /msk/eligibility-files", "POST /msk/fee-invoices"]

  - priority: 12
    category: business_fiscal
    check: "An invoice may not be finalized while it carries a non-zero additional_fee_component_cents: every reconciliation delta must first be reconciled"
    error_id: ERR_INVOICE_UNRECONCILED
    http_status: 422
    applies_to: ["POST /msk/fee-invoices/{id}/finalize"]

  - priority: 13
    category: business_fiscal
    check: "A duplicate savings attribution is refused: the same enrollment and claim window rank may not enter two FeeInvoices with overlapping billing periods"
    error_id: ERR_DUPLICATE_SAVINGS_ATTRIBUTION
    http_status: 409
    applies_to: ["POST /msk/fee-invoices"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Eligibility files ---
  - method: POST
    path: "/msk/eligibility-files"
    description: "Ingest an employer or health plan roster for a member period; cross-checks the rosters of previous periods for any client"
    roles: [EnrollmentOps]
    code: 201
    input: [client_account_id, file_period, roster_format]
    output: EligibilityFile
    side_effects:
      - "file_status = INGESTED"
      - "eligible_member_count = 0, ineligible_member_count = 0, screened_member_count = 0"
      - "total_monthly_fee_cents = 0, provisional_total_monthly_fee_cents = 0, fee_variance_cents = 0"
      - "increments ClientAccount.version by 1"

  - method: GET
    path: "/msk/eligibility-files"
    description: "List roster files, optionally filtered by client"
    roles: [EnrollmentOps, ClinicalOps, BillingOps]
    code: 200
    input: ["client_account_id?", "file_status?", "limit?", "offset?"]
    output: EligibilityFile[]
    side_effects: []

  - method: GET
    path: "/msk/eligibility-files/{id}"
    description: "Read a roster file"
    roles: [EnrollmentOps, ClinicalOps, BillingOps]
    code: 200
    input: []
    output: EligibilityFile
    side_effects: []

  - method: POST
    path: "/msk/eligibility-files/{id}/screen"
    description: "Apply the musculoskeletal screening rules to every member row and compute both roster-fee variants"
    roles: [EnrollmentOps]
    code: 200
    input: []
    output: EligibilityFile
    side_effects:
      - "file_status = SCREENED"
      - "recomputes eligible_member_count, ineligible_member_count, screened_member_count"
      - "runs calculations.roster_fee_payability_weighted for both variants"
      - "recomputes total_monthly_fee_cents, provisional_total_monthly_fee_cents, fee_variance_cents"
      - "moves every member row PENDING_ELIGIBILITY -> ELIGIBLE or -> INELIGIBLE"
      - "increments EligibilityFile.version by 1"

  - method: POST
    path: "/msk/eligibility-files/{id}/assign-tracks"
    description: "Create enrollments for every eligible member on the file and seed a clinical review for each"
    roles: [EnrollmentOps]
    code: 200
    input: [expected_client_account_version]
    output: EligibilityFile
    side_effects:
      - "file_status = ASSIGNED"
      - "creates one Enrollment per eligible member, each starting PENDING_SCREENING and auto-advancing to PENDING_CLINICAL_REVIEW; no ClinicalReview is seeded, so seed one with POST /msk/clinical-reviews"
      - "increments EligibilityFile.version by 1"
      - "increments ClientAccount.version by 1"

  - method: POST
    path: "/msk/eligibility-files/{id}/close-file"
    description: "Close a roster file once its enrollments have left screening"
    roles: [EnrollmentOps]
    code: 200
    input: []
    output: EligibilityFile
    side_effects: ["file_status = CLOSED", "increments EligibilityFile.version by 1"]

  # --- Members ---
  - method: POST
    path: "/msk/members"
    description: "Add a member row to a roster file, carrying the roster's clinical screening fields"
    roles: [EnrollmentOps]
    code: 201
    input: [client_account_id, eligibility_file_id, external_member_ref, full_name, date_of_birth, musculo_condition_code, baseline_pain_score, baseline_function_score, "red_flag_multipliers?"]
    output: Member
    side_effects:
      - "member_status = PENDING_ELIGIBILITY"
      - "increments the owning EligibilityFile.version by 1"

  - method: GET
    path: "/msk/members"
    description: "List members, optionally filtered by client or by the roster file they arrived on"
    roles: [EnrollmentOps, ClinicalOps, BillingOps]
    code: 200
    input: ["client_account_id?", "eligibility_file_id?", "member_status?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: GET
    path: "/msk/members/{id}"
    description: "Read a member"
    roles: [EnrollmentOps, ClinicalOps, BillingOps]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/msk/members/{id}/recompute_eligibility"
    description: "Re-run the demographic eligibility rule against the current logical clock"
    roles: [EligibilityService]
    code: 200
    input: []
    output: Member
    side_effects:
      - "sets eligibility_basis = DEMOGRAPHICS"
      - "increments Member.version by 1"

  # --- Program tracks ---
  - method: POST
    path: "/msk/program-tracks"
    description: "Create a care-track configuration"
    roles: [ClinicalOps]
    code: 201
    input: [track_code, base_fee_per_member_cents, expected_sessions_per_week, pain_reduction_target_points, function_gain_target_points, min_adherence_rate, severity_weights]
    output: ProgramTrack
    side_effects: []

  - method: GET
    path: "/msk/program-tracks"
    description: "List care-track configurations"
    roles: [ClinicalOps, ClinicalOps, EnrollmentOps, BillingOps]
    code: 200
    input: ["track_code?", "limit?", "offset?"]
    output: ProgramTrack[]
    side_effects: []

  - method: GET
    path: "/msk/program-tracks/{id}"
    description: "Read a care-track configuration"
    roles: [ClinicalOps, ClinicalOps, EnrollmentOps, BillingOps]
    code: 200
    input: []
    output: ProgramTrack
    side_effects: []

  # --- Enrollments ---
  - method: POST
    path: "/msk/enrollments"
    description: "Open an enrollment for a member, optionally pinned to a specific eligibility file"
    roles: [EnrollmentOps]
    code: 201
    input: [member_id, "eligibility_file_id?"]
    output: Enrollment
    side_effects:
      - "enrollment_status = PENDING_CLINICAL_REVIEW"
      - "review_pending_since = the current logical clock instant"
      - "pain_reduction_points = 0.0, function_gain_points = 0.0, attributed_savings_cents = 0"
      - "does NOT create a ClinicalReview; seed one with POST /msk/clinical-reviews"
      - "increments Member.version by 1"

  - method: GET
    path: "/msk/enrollments"
    description: "List enrollments, optionally filtered by member or by the roster file that produced them"
    roles: [EnrollmentOps, ClinicalOps, BillingOps]
    code: 200
    input: ["member_id?", "eligibility_file_id?", "program_track_id?", "enrollment_status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: GET
    path: "/msk/enrollments/{id}"
    description: "Read an enrollment, including its window anchors and the three outcome headline blocks"
    roles: [EnrollmentOps, ClinicalOps, BillingOps]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/msk/enrollments/{id}/drop"
    description: "Drop an active enrollment; refuses while the fifth week or a later week is running"
    roles: [EnrollmentOps]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "enrollment_status = DROPPED"
      - "dropout_week = the current week_index"
      - "Member.member_status = DROPPED"
      - "increments Enrollment.version by 1, increments Member.version by 1"

  - method: POST
    path: "/msk/enrollments/{id}/complete"
    description: "Complete the program once exactly one outcome measurement has been finalized"
    roles: [ClinicalReviewService]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "enrollment_status = COMPLETED"
      - "completed_week = week_index of the FINALIZED measurement"
      - "Member.member_status = GRADUATED"
      - "increments Enrollment.version by 1, increments Member.version by 1"

  - method: POST
    path: "/msk/enrollments/{id}/transition-reviews"
    description: "Register a clinician's request to move the member to in-person care outside the five-week window"
    roles: [Clinician]
    code: 201
    input: [reason]
    output: Enrollment
    side_effects:
      - "enrollment_status = AWAITING_TRANSITION_REVIEW"
      - "transition_reason = the supplied reason"
      - "pending_transition_clinician_id = the acting clinician"
      - "increments Enrollment.version by 1"

  - method: POST
    path: "/msk/enrollments/reconcile-reviews"
    description: "Run the review reconciliation ladder over every enrollment with a pending review window"
    roles: [ClinicalReviewService]
    code: 200
    input: []
    output: "{ reconciled_enrollment_count: integer, accelerated_enrollment_count: integer }"
    side_effects:
      - "runs calculations.review_reconciliation_ladder"
      - "increments version on every touched entity"

  # --- Clinical reviews ---
  - method: POST
    path: "/msk/clinical-reviews"
    description: "Seed a clinical review for an enrollment awaiting one"
    roles: [EnrollmentOps]
    code: 201
    input: [enrollment_id, reviewer_id, review_notes]
    output: ClinicalReview
    side_effects: ["review_status = SUBMITTED", "review_opened_at = the current logical clock instant"]

  - method: GET
    path: "/msk/clinical-reviews"
    description: "List clinical reviews, optionally filtered by enrollment"
    roles: [ClinicalOps, EnrollmentOps, ClinicalOps]
    code: 200
    input: ["enrollment_id?", "review_status?", "limit?", "offset?"]
    output: ClinicalReview[]
    side_effects: []

  - method: GET
    path: "/msk/clinical-reviews/{id}"
    description: "Read a clinical review"
    roles: [ClinicalOps, EnrollmentOps, ClinicalOps]
    code: 200
    input: []
    output: ClinicalReview
    side_effects: []

  - method: POST
    path: "/msk/clinical-reviews/{id}/conduct"
    description: "Record the clinical decision on a submitted review"
    roles: [Clinician]
    code: 200
    input: [review_decision, reviewed_track_id]
    output: ClinicalReview
    side_effects:
      - "review_status = CONDUCTED, conducted_at = the current logical clock instant"
      - "on APPROVE: writes Enrollment.program_track_id, clinical_review_outcome = APPROVED, clinical_reviewing_clinician_id, enrollment_status = AWAITING_TRANSITION_REVIEW, transition_reason = CLINICIAN_REQUEST, pending_transition_clinician_id"
      - "increments ClinicalReview.version by 1, increments Enrollment.version by 1"

  - method: POST
    path: "/msk/clinical-reviews/{id}/reopen"
    description: "Return a conducted review to the queue, undoing its clinical decision"
    roles: [ClinicalReviewService]
    code: 200
    input: []
    output: ClinicalReview
    side_effects:
      - "review_status = SUBMITTED, conducted_at = null"
      - "clears Enrollment.clinical_review_outcome, program_track_id, transition_reason, pending_transition_clinician_id; enrollment_status = PENDING_CLINICAL_REVIEW"
      - "increments ClinicalReview.version by 1, increments Enrollment.version by 1"

  # --- Transition reviews ---
  - method: POST
    path: "/msk/transition-reviews/{id}/approve"
    description: "Approve the in-person handoff for a pending transition review, activating the enrollment; the path segment is the ENROLLMENT awaiting the transition review, not a separate review row"
    roles: [Clinician]
    code: 200
    input: [approving_clinician_id, expected_eligibility_file_version]
    output: Enrollment
    side_effects:
      - "enrollment_status = ACTIVE with enrolled_at and enrolled_week stamped"
      - "creates a CareTransition in PENDING status"
      - "Member.member_status = ENROLLED when every active enrollment on the member is ACTIVE"
      - "increments Enrollment.version by 1"
      - "increments Member.version by 1"
      - "increments the eligibility file's version by 1"

  - method: POST
    path: "/msk/transition-reviews/{id}/deny"
    description: "Deny the in-person handoff and return the enrollment to the review queue; the path segment is the ENROLLMENT awaiting the transition review"
    roles: [ClinicalReviewService]
    code: 200
    input: [approving_clinician_id]
    output: Enrollment
    side_effects:
      - "enrollment_status = PENDING_CLINICAL_REVIEW"
      - "clears transition_reason and pending_transition_clinician_id"
      - "increments Enrollment.version by 1"

  # --- Exercise sessions ---
  - method: POST
    path: "/msk/enrollments/{id}/sessions"
    description: "Book a sensor- or camera-guided exercise session into an ISO week"
    roles: [EnrollmentOps]
    code: 201
    input: [session_date, session_week, recorded_via, planned_reps, planned_minutes, "track_restricted?"]
    output: ExerciseSession
    side_effects:
      - "session_status = SCHEDULED, completed_reps = 0, completed_minutes = 0"
      - "scheduled_send_at = the current logical clock instant"
      - "increments Enrollment.version by 1"

  - method: GET
    path: "/msk/exercise-sessions"
    description: "List exercise sessions, optionally filtered by enrollment"
    roles: [EnrollmentOps, ClinicalOps, Member]
    code: 200
    input: ["enrollment_id?", "session_status?", "limit?", "offset?"]
    output: ExerciseSession[]
    side_effects: []

  - method: GET
    path: "/msk/exercise-sessions/{id}"
    description: "Read an exercise session"
    roles: [EnrollmentOps, ClinicalOps, Member]
    code: 200
    input: []
    output: ExerciseSession
    side_effects: []

  - method: POST
    path: "/msk/exercise-sessions/{id}/complete"
    description: "Record the completion of a guided exercise session and its adherence credit"
    roles: [Member]
    code: 200
    input: [completed_denominator_units, pain_score_after]
    output: ExerciseSession
    side_effects:
      - "session_status = COMPLETED, completed_reps = planned_reps, completed_minutes = planned_minutes"
      - "sets adherence_numerator, adherence_denominator, pain_score_before"
      - "recomputes Enrollment.adherence_rate, adherence_scored_through_week, weeks_active, projected_engagement_milestone"
      - "increments ExerciseSession.version by 1, increments Enrollment.version by 1"

  # --- Outreach ---
  - method: POST
    path: "/msk/outreach-contacts"
    description: "Queue an engagement outreach contact into weeks 1 through 4"
    roles: [OutreachService]
    code: 201
    input: [enrollment_id, contact_week, channel, "contact_occurred_at?"]
    output: OutreachContact
    side_effects:
      - "outreach_status = QUEUED, scheduled_send_at = the current logical clock instant"
      - "does NOT recompute Enrollment.dropout_risk_score"
      - "increments Enrollment.version by 1"

  - method: GET
    path: "/msk/outreach-contacts"
    description: "List outreach contacts, optionally filtered by enrollment"
    roles: [OutreachService, EnrollmentOps]
    code: 200
    input: ["enrollment_id?", "outreach_status?", "limit?", "offset?"]
    output: OutreachContact[]
    side_effects: []

  - method: GET
    path: "/msk/outreach-contacts/{id}"
    description: "Read an outreach contact"
    roles: [OutreachService, EnrollmentOps]
    code: 200
    input: []
    output: OutreachContact
    side_effects: []

  - method: POST
    path: "/msk/outreach-contacts/{id}/deliver"
    description: "Mark a queued outreach contact delivered"
    roles: [OutreachService]
    code: 200
    input: []
    output: OutreachContact
    side_effects:
      - "outreach_status = DELIVERED, contact_occurred_at = the current logical clock instant"
      - "sets the week's inclusivity cut to the smaller of the sender-supplied contact_occurred_at and the current logical clock instant"
      - "does NOT recompute Enrollment.dropout_risk_score: a member-sourced delivery never moves the member-sourced risk score"
      - "increments OutreachContact.version by 1, increments Enrollment.version by 1"

  # --- Clinicians ---
  - method: POST
    path: "/msk/clinicians"
    description: "Register a physical therapist or physician in the digital program"
    roles: [ClinicalOps]
    code: 201
    input: [full_name, discipline, license_number, weekly_capacity_slots]
    output: Clinician
    side_effects: ["clinician_status = AVAILABLE, weekly_completed_minutes = 0"]

  - method: GET
    path: "/msk/clinicians"
    description: "List clinicians, optionally filtered by discipline"
    roles: [ClinicalOps, EnrollmentOps, BillingOps]
    code: 200
    input: ["discipline?", "limit?", "offset?"]
    output: Clinician[]
    side_effects: []

  - method: GET
    path: "/msk/clinicians/{id}"
    description: "Read a clinician"
    roles: [ClinicalOps, EnrollmentOps, BillingOps]
    code: 200
    input: []
    output: Clinician
    side_effects: []

  - method: POST
    path: "/msk/clinicians/{id}/limit"
    description: "Move a clinician to limited availability"
    roles: [ClinicalOps]
    code: 200
    input: []
    output: Clinician
    side_effects: ["clinician_status = LIMITED", "increments Clinician.version by 1"]

  - method: POST
    path: "/msk/clinicians/{id}/restore"
    description: "Restore a limited clinician to full availability"
    roles: [ClinicalOps]
    code: 200
    input: []
    output: Clinician
    side_effects: ["clinician_status = AVAILABLE", "increments Clinician.version by 1"]

  - method: POST
    path: "/msk/clinicians/{id}/deactivate"
    description: "Deactivate a clinician and cascade-cancel every scheduled consult"
    roles: [ClinicalOps]
    code: 200
    input: []
    output: Clinician
    side_effects:
      - "clinician_status = DEACTIVATED"
      - "cancels every SCHEDULED appointment of this clinician, stamping cancelled_at"
      - "cascades to revert Enrollment.pain_reduction_points on each affected enrollment"
      - "increments Clinician.version by 1, increments Enrollment.version by 1 per affected enrollment"

  # --- Appointments ---
  - method: POST
    path: "/msk/appointments"
    description: "Book a physical therapist or physician consult on a clinician's timeline"
    roles: [EnrollmentOps]
    code: 201
    input: [enrollment_id, clinician_id, appointment_date, start_minute, duration_minutes, slot_type]
    output: Appointment
    side_effects: ["appointment_status = SCHEDULED"]

  - method: GET
    path: "/msk/appointments"
    description: "List appointments, optionally filtered by enrollment"
    roles: [EnrollmentOps, ClinicalOps, Clinician]
    code: 200
    input: ["enrollment_id?", "clinician_id?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  - method: GET
    path: "/msk/appointments/{id}"
    description: "Read an appointment"
    roles: [EnrollmentOps, ClinicalOps, Clinician]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/msk/appointments/{id}/cancel"
    description: "Cancel a scheduled consult"
    roles: [Clinician, EnrollmentOps]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "appointment_status = CANCELLED, cancelled_at = the current logical clock instant"
      - "increments Enrollment.consult_cancellation_count by 1 and Enrollment.version by 1"
      - "increments Appointment.version by 1"

  - method: POST
    path: "/msk/appointments/{id}/complete"
    description: "Mark a consult completed"
    roles: [Clinician]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "appointment_status = COMPLETED"
      - "recomputes Clinician.weekly_completed_minutes"
      - "increments Appointment.version by 1, increments Clinician.version by 1"

  # --- Outcome measurements ---
  - method: POST
    path: "/msk/outcome-measurements"
    description: "Record an outcome measurement with its window anchor and deltas"
    roles: [Member]
    code: 201
    input: [enrollment_id, measurement_week, pain_score, function_score]
    output: OutcomeMeasurement
    side_effects:
      - "measurement_status = RECORDED"
      - "stamps claim_window_rank, window_start_week, window_end_week, baseline_pain_score, baseline_function_score"
      - "recomputes pain_delta_points, function_delta_points, attributed_savings_cents"
      - "recomputes Enrollment.attributed_savings_cents"
      - "increments Enrollment.version by 1"

  - method: GET
    path: "/msk/outcome-measurements"
    description: "List outcome measurements, optionally filtered by enrollment"
    roles: [ClinicalOps, EnrollmentOps, BillingOps, Member]
    code: 200
    input: ["enrollment_id?", "measurement_status?", "limit?", "offset?"]
    output: OutcomeMeasurement[]
    side_effects: []

  - method: GET
    path: "/msk/outcome-measurements/{id}"
    description: "Read an outcome measurement"
    roles: [ClinicalOps, EnrollmentOps, BillingOps, Member]
    code: 200
    input: []
    output: OutcomeMeasurement
    side_effects: []

  - method: POST
    path: "/msk/outcome-measurements/{id}/supersede"
    description: "Attach a replacement measurement to the same claim window, superseding the current one"
    roles: [ClinicalReviewService]
    code: 200
    input: [replacement_measurement_id]
    output: OutcomeMeasurement
    side_effects:
      - "measurement_status = SUPERSEDED, attributed_savings_cents = 0"
      - "recomputes Enrollment.attributed_savings_cents"
      - "increments OutcomeMeasurement.version by 1, increments Enrollment.version by 1"

  - method: POST
    path: "/msk/outcome-measurements/{id}/finalize"
    description: "Finalize a recorded outcome measurement once its 4-week claim window has lapsed"
    roles: [ClinicalReviewService]
    code: 200
    input: []
    output: OutcomeMeasurement
    side_effects:
      - "measurement_status = FINALIZED"
      - "writes Enrollment.pain_reduction_points = pain_delta_points and Enrollment.function_gain_points = function_delta_points"
      - "increments OutcomeMeasurement.version by 1, increments Enrollment.version by 1"

  - method: POST
    path: "/msk/exercise-sessions/{id}/weekly-transition"
    description: "Apply the weekly session cut to one booked session, moving a schedule that has just gone inclusive to MISSED"
    roles: [EligibilityService]
    code: 200
    input: [session_week]
    output: ExerciseSession
    side_effects:
      - "session_status = MISSED when session_week has just gone inclusive, otherwise no change"
      - "recomputes Enrollment.adherence_rate"
      - "increments ExerciseSession.version by 1, increments Enrollment.version by 1"

  # --- Claim lines ---
  - method: POST
    path: "/msk/claim-lines"
    description: "Record a downstream medical or pharmacy claim line against an enrollment's attribution window"
    roles: [EnrollmentOps]
    code: 201
    input: [enrollment_id, claim_service_date, claim_service_week, claim_severity, amount_cents, claim_source]
    output: ClaimLine
    side_effects:
      - "claim_superseded = false, line_instance_version = 1"
      - "Recompute OutcomeMeasurement.attributed_savings_cents for every RECORDED measurement of this enrollment whose window contains claim_service_week, using the version-pinned variant only"
      - "Recompute Enrollment.attributed_savings_cents"
      - "increments Enrollment.version by 1 per touched enrollment"

  - method: GET
    path: "/msk/claim-lines"
    description: "List downstream claim lines, optionally filtered by enrollment or by the measurement whose window claims them"
    roles: [EnrollmentOps, BillingOps, ClinicalOps]
    code: 200
    input: ["enrollment_id?", "outcome_measurement_id?", "claim_service_week?", "claim_source?", "limit?", "offset?"]
    output: ClaimLine[]
    side_effects: []

  - method: GET
    path: "/msk/claim-lines/{id}"
    description: "Read a downstream claim line"
    roles: [EnrollmentOps, BillingOps, ClinicalOps]
    code: 200
    input: []
    output: ClaimLine
    side_effects: []

  - method: POST
    path: "/msk/claim-lines/{id}/supersede"
    description: "Mark a claim line instance superseded and reinstate a replacement instance in the same window"
    roles: [EnrollmentOps]
    code: 200
    input: [replacement_amount_cents, replacement_claim_severity]
    output: ClaimLine
    side_effects:
      - "claim_superseded = true on the superseded instance"
      - "creates a replacement ClaimLine with line_instance_version = prior + 1"
      - "Recompute OutcomeMeasurement.attributed_savings_cents for RECORDED measurements whose window contains this line, using the version-pinned variant only"
      - "increments ClaimLine.version by 1, increments Enrollment.version by 1"

  - method: POST
    path: "/msk/claim-lines/{id}/reinstate"
    description: "Reverse the record-instance splice: withdraw a line instance from its window and report how the window is now composed"
    roles: [EnrollmentOps]
    code: 200
    input: [withdraw_instance_version]
    output: ClaimLine
    side_effects:
      - "withdraws the named instance version from the window"
      - "reports line_instance_count, window_claim_week_span, window_claim_count and distinct_weeks_on_claim_head of the recomposed window in the response"
      - "increments ClaimLine.version by 1"

  # --- Fee invoices ---
  - method: POST
    path: "/msk/fee-invoices"
    description: "Create a draft invoice for a client and billing period"
    roles: [BillingOps]
    code: 201
    input: [client_account_id, billing_period]
    output: FeeInvoice
    side_effects:
      - "invoice_status = DRAFT"
      - "runs calculations.invoice_milestone_time_allocation forward-looking variant"
      - "stamps provisional_amount_cents, milestone_member_count, milestone_engagement_component_cents, savings_share_component_cents, additional_fee_component_cents"
      - "increments ClientAccount.version by 1"

  - method: GET
    path: "/msk/fee-invoices"
    description: "List invoices, optionally filtered by client"
    roles: [BillingOps, ClinicalOps]
    code: 200
    input: ["client_account_id?", "invoice_status?", "limit?", "offset?"]
    output: FeeInvoice[]
    side_effects: []

  - method: GET
    path: "/msk/fee-invoices/{id}"
    description: "Read a client-facing invoice report, including every fee-structure component and the reconciled total"
    roles: [BillingOps, ClinicalOps]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: []

  - method: POST
    path: "/msk/fee-invoices/{id}/finalize"
    description: "Finalize a draft invoice and pin the billed total"
    roles: [BillingOps]
    code: 200
    input: []
    output: FeeInvoice
    side_effects:
      - "invoice_status = FINALIZED"
      - "stamps billing_model_snapshot"
      - "runs calculations.invoice_milestone_time_allocation chronological variant"
      - "recomputes final_amount_cents, net_delta_cents, recomputed_component_cents, finalized_total_cents"
      - "increments FeeInvoice.version by 1"

  - method: POST
    path: "/msk/fee-invoices/{id}/void"
    description: "Void a draft invoice"
    roles: [BillingOps]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["invoice_status = VOID", "increments FeeInvoice.version by 1"]

  - method: POST
    path: "/msk/fee-invoices/{id}/reopen"
    description: "Return a finalized invoice to draft for correction"
    roles: [BillingOps]
    code: 200
    input: []
    output: FeeInvoice
    side_effects:
      - "invoice_status = DRAFT, finalized_total_cents = null"
      - "increments FeeInvoice.version by 1"

  # --- Care transitions ---
  - method: POST
    path: "/msk/care-transitions"
    description: "Open a pending in-person handoff for an active enrollment"
    roles: [Clinician]
    code: 201
    input: [enrollment_id, approving_clinician_id]
    output: CareTransition
    side_effects: ["transition_status = PENDING", "increments Enrollment.version by 1"]

  - method: GET
    path: "/msk/care-transitions"
    description: "List care transitions, optionally filtered by enrollment"
    roles: [ClinicalOps, EnrollmentOps, ClinicalOps]
    code: 200
    input: ["enrollment_id?", "transition_status?", "limit?", "offset?"]
    output: CareTransition[]
    side_effects: []

  - method: GET
    path: "/msk/care-transitions/{id}"
    description: "Read a care transition"
    roles: [ClinicalOps, EnrollmentOps, ClinicalOps]
    code: 200
    input: []
    output: CareTransition
    side_effects: []

  - method: POST
    path: "/msk/care-transitions/{id}/complete"
    description: "Move the member to in-person care and close the digital enrollment"
    roles: [Clinician]
    code: 200
    input: []
    output: CareTransition
    side_effects:
      - "transition_status = COMPLETED, transitioned_at = the current logical clock instant, handoff_referral_count increments"
      - "enrollment_status = TRANSITIONED, Member.member_status = ELIGIBLE"
      - "increments CareTransition.version by 1, increments Enrollment.version by 1"

  # --- Clients ---
  - method: POST
    path: "/msk/clients"
    description: "Create an employer or health plan account"
    roles: [ClinicalOps]
    code: 201
    input: [legal_name, client_type, "billing_model?", "savings_share_rate?", "expected_monthly_engagement_rate?"]
    output: ClientAccount
    side_effects:
      - "account_status = ACTIVE"
      - "creates the supplied program-track configurations under this client"

  - method: GET
    path: "/msk/clients"
    description: "List client accounts, with an optional entitlement filter that also governs the activation leg"
    roles: [ClinicalOps, BillingOps, EnrollmentOps]
    code: 200
    input: ["entitlement_filter?", "client_status?", "limit?", "offset?"]
    output: ClientAccount[]
    side_effects: []

  - method: GET
    path: "/msk/clients/{id}"
    description: "Read a client account"
    roles: [ClinicalOps, BillingOps]
    code: 200
    input: []
    output: ClientAccount
    side_effects: []

  - method: GET
    path: "/msk/clients/{id}/engagement-report"
    description: "Read the client engagement report, including the per-enrollment outcome headline blocks"
    roles: [BillingOps, ClinicalOps]
    code: 200
    input: []
    output: ClientAccount
    side_effects: []

  - method: POST
    path: "/msk/clients/{id}/suspend"
    description: "Suspend a client account, end its in-progress handoffs and void its draft invoices"
    roles: [BillingOps]
    code: 200
    input: [reason]
    output: ClientAccount
    side_effects:
      - "account_status = SUSPENDED"
      - "voids every DRAFT invoice of this client"
      - "reverts every AWAITING_TRANSITION_REVIEW enrollment to ACTIVE, clears transition_reason and pending_transition_clinician_id, and resets pain_reduction_points, function_gain_points, attributed_savings_cents and completed_week"
      - "ends every CareTransition of this client in PENDING status: transition_reason = NO_ENGAGEMENT"
      - "increments ClientAccount.version by 1, increments Enrollment.version and CareTransition.version per affected row"

  - method: POST
    path: "/msk/clients/{id}/reinstate"
    description: "Reinstate a suspended client account"
    roles: [BillingOps]
    code: 200
    input: []
    output: ClientAccount
    side_effects: ["account_status = ACTIVE", "increments ClientAccount.version by 1"]

  - method: POST
    path: "/msk/clients/{id}/close"
    description: "Close a client account and cascade the coverage end through members and enrollments"
    roles: [BillingOps]
    code: 200
    input: []
    output: ClientAccount
    side_effects:
      - "account_status = CLOSED"
      - "sets every PENDING_ELIGIBILITY member of this client to INELIGIBLE with eligibility_basis = COVERAGE_TERM"
      - "cascades to set every PENDING_SCREENING enrollment on those members to ACTIVATION_FAILED"
      - "increments ClientAccount.version by 1, increments Member.version and Enrollment.version per affected row"

  - method: POST
    path: "/msk/clients/{id}/recompute_engagement-tier"
    description: "Recompute the client's engagement tier from the authoritative milestone formula"
    roles: [BillingOps]
    code: 200
    input: []
    output: ClientAccount
    side_effects:
      - "runs calculations.engagement_milestone_trigger with the inclusive_boundary variant"
      - "increments ClientAccount.version by 1"

  # --- Test-driving endpoints ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z; before any call the clock reads that instant and never falls back to real wall-clock time."
    roles: [ClinicalOps]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "sets the logical clock used by every temporal rule"
      - "does not itself advance any week-scoped state; week-scoped reconciliation runs through POST /msk/clients/{id}/run-weekly-reconciliation"

  - method: POST
    path: "/msk/clients/{id}/run-weekly-reconciliation"
    description: "Advance the client's shared week-schedule cursor by one week and run the whole weekly sweep"
    roles: [ClinicalOps]
    code: 200
    input: []
    output: "{ advanced_week_index: integer, missed_session_count: integer, lapsed_outreach_count: integer, no_show_count: integer, activation_failed_count: integer, screened_file_count: integer }"
    side_effects:
      - "advances the client's shared week-schedule cursor by exactly one week"
      - "moves every SCHEDULED exercise session whose session_week precedes the new cursor to MISSED"
      - "moves every QUEUED outreach contact whose contact_week precedes the new cursor to FAILED"
      - "moves every SCHEDULED appointment whose start instant strictly precedes the current logical clock instant to NO_SHOW and cascades the outcome revert"
      - "runs calculations.review_reconciliation_ladder, including the activation-failed leg for stale NO_ENGAGEMENT reviews and the screening leg for lapsed INGESTED files"
      - "increments ClientAccount.version by 1"

  - method: POST
    path: "/msk/clients/{id}/retention-credit"
    description: "Read the retention-credit view for a client: the draft invoices on file and the credit they carry"
    roles: [BillingOps]
    code: 200
    input: []
    output: "{ draft_invoice_count: integer, retained_credit_amount_cents: integer, proposal_member_count: integer, proposal_amount_cents: integer }"
    side_effects: []

  - method: POST
    path: "/msk/clients/{id}/membership-roll"
    description: "Read the client's membership roll as of a requested entitlement week"
    roles: [BillingOps]
    code: 200
    input: [as_of_week_index]
    output: "{ proposed_member_count: integer, proposed_amount_cents: integer, entitled_member_count: integer, entitled_amount_cents: integer }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  - id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role is absent, or X-User-Role names no role declared in §1.7"

  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not permitted to perform the requested operation under the §1.7 matrix"

  - id: ERR_CLINICIAN_DUAL_ROLE
    http: 403
    condition: "The clinician approving the in-person transition is the same clinician who conducted the clinical review on that enrollment"

  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A resource addressed by path segment does not exist; when several segments are unknown the leftmost wins"

  - id: ERR_VITALS_OUT_OF_RANGE
    http: 422
    condition: "A recorded pain score falls outside [0, 10] or a recorded function score falls outside [0, 100]"

  - id: ERR_APPOINTMENT_OVERLAP
    http: 422
    condition: "The requested consult starts fewer than 60 minutes after an existing consult on the same clinician's day, or would occupy an already-occupied 60-minute block"

  - id: ERR_WEEK_ALREADY_SCHEDULED
    http: 409
    condition: "The enrollment already carries an exercise session booked into the requested ISO week"

  - id: ERR_INVALID_REFERENCE
    http: 422
    condition: "A referenced resource exists but is not in a state that allows this write (for example a program track on a member whose enrollment is not under review)"

  - id: ERR_FILE_PERIOD_REGRESSION
    http: 409
    condition: "The requested roster period is not strictly later than the client's greatest existing roster period"

  - id: ERR_CLIENT_NOT_ACTIVE
    http: 422
    condition: "The client account is SUSPENDED or CLOSED, so billable work may not be created"

  - id: ERR_INVOICE_UNRECONCILED
    http: 422
    condition: "An invoice still carries a non-zero additional_fee_component_cents when finalization is requested"

  - id: ERR_DUPLICATE_SAVINGS_ATTRIBUTION
    http: 409
    condition: "The same enrollment and claim window rank would enter a second invoice with an overlapping billing period"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "The expected version carried on the request no longer matches the stored version of the parent entity"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state that permits this operation"

  - id: ERR_ENROLLMENT_NOT_IN_REVIEW
    http: 409
    condition: "A clinical review is conducted while the enrollment is not in PENDING_CLINICAL_REVIEW"

  - id: ERR_REVIEW_ALREADY_CONDUCTED
    http: 409
    condition: "A clinical review that is already CONDUCTED is conducted a second time"

  - id: ERR_TRANSITION_NOT_PENDING
    http: 409
    condition: "A transition review is approved or denied while no transition review is pending on the enrollment"

  - id: ERR_TRANSITION_REVIEWER_MISMATCH
    http: 403
    condition: "The clinician denying the handoff is not the clinician who registered the pending transition review"

  - id: ERR_MEASUREMENT_FINALIZED
    http: 409
    condition: "A FINALIZED outcome measurement is superseded"

  - id: ERR_MEASUREMENT_WINDOW_OPEN
    http: 409
    condition: "An outcome measurement is finalized while its claim window is still open"

  - id: ERR_MEASUREMENT_LIMIT_REACHED
    http: 409
    condition: "A second FINALIZED measurement is requested for one enrollment"

  - id: ERR_NO_FINALIZED_MEASUREMENT
    http: 409
    condition: "An enrollment is completed while it carries no FINALIZED outcome measurement"

  - id: ERR_DROPOUT_WINDOW_CLOSED
    http: 409
    condition: "An enrollment in its fifth or a later measured week is dropped"

  - id: ERR_DROPOUT_CRITERIA_NOT_MET
    http: 422
    condition: "An enrollment is dropped while neither the consecutive-missed nor the failed-outreach criterion holds"

  - id: ERR_OUTREACH_WINDOW_CLOSED
    http: 409
    condition: "An outreach contact is queued with a contact_week outside 1 through 4"

  - id: ERR_OUTREACH_CONTACT_LIMIT
    http: 409
    condition: "The member's weekly outreach requirement for the week is already satisfied"

  - id: ERR_INVOICE_ALREADY_VOID
    http: 409
    condition: "A voided invoice is reopened"

  - id: ERR_SESSION_ACTIVATION_FAILED
    http: 409
    condition: "An exercise session is booked against an enrollment whose status is ACTIVATION_FAILED"

  - id: ERR_PAIN_WORSENED
    http: 422
    condition: "A completed session reports a pain score worse than the pre-session score by more than the tolerated delta"

  - id: ERR_SESSION_WEEK_CLOSED
    http: 409
    condition: "A scheduled session is completed outside the ISO week it was booked into"

  - id: ERR_CLINICIAN_CAPACITY_EXCEEDED
    http: 422
    condition: "A booking would push the clinician past weekly_capacity_slots times 60 minutes of scheduled consults in one ISO week"

  - id: ERR_OUTREACH_WEEK_LAPSED
    http: 409
    condition: "An outreach contact is queued into a week that has already passed"

  - id: ERR_MEASUREMENT_WEEK_DUPLICATE
    http: 409
    condition: "The enrollment already carries a measurement for the requested week"

  - id: ERR_CLAIM_LINE_WINDOW_CLOSED
    http: 409
    condition: "A downstream claim line is recorded into an attribution window that has already lapsed, so the window no longer accepts additional lines"

  - id: ERR_PATIENT_UNDERAGE
    http: 422
    condition: "The member's date of birth is less than 18 years before the current logical clock instant at screening time"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: EnrollmentOps
    description: "Program operations; ingests rosters, screens members, queues the digital program, books consults"
    identity: opaque
    exclusive_operations:
      - "POST /msk/eligibility-files — Ingest a roster file"
      - "POST /msk/eligibility-files/{id}/screen — Screen a roster file"
      - "POST /msk/eligibility-files/{id}/assign-tracks — Assign program tracks"
      - "POST /msk/eligibility-files/{id}/close-file — Close a roster file"
      - "POST /msk/members — Add a member row"
      - "POST /msk/enrollments — Open an enrollment"
      - "POST /msk/enrollments/{id}/drop — Drop an enrollment"
      - "POST /msk/enrollments/{id}/sessions — Book an exercise session"
      - "POST /msk/clinical-reviews — Seed a clinical review"
      - "POST /msk/appointments — Book a consult"
      - "POST /msk/claim-lines — Record a downstream claim line"
      - "POST /msk/claim-lines/{id}/supersede — Supersede a claim line instance"
      - "POST /msk/claim-lines/{id}/reinstate — Reinstate a claim line instance"
    shared_operations:
      - "GET /msk/eligibility-files, GET /msk/members, GET /msk/enrollments, GET /msk/exercise-sessions, GET /msk/outreach-contacts, GET /msk/appointments, GET /msk/clients"

  - name: ClinicalOps
    description: "Clinical administration; owns client contracts, care-track configuration and the clinician roster"
    identity: opaque
    exclusive_operations:
      - "POST /msk/clients — Create a client account"
      - "POST /msk/clinicians — Register a clinician"
      - "POST /msk/clinicians/{id}/limit — Limit a clinician"
      - "POST /msk/clinicians/{id}/restore — Restore a clinician"
      - "POST /msk/clinicians/{id}/deactivate — Deactivate a clinician"
      - "POST /msk/program-tracks — Create a care-track configuration"
      - "POST /_clock/set_current_utc — Set the logical clock"
      - "POST /msk/clients/{id}/run-weekly-reconciliation — Run the weekly sweep"
    shared_operations:
      - "GET /msk/clinicians, GET /msk/program-tracks, GET /msk/fee-invoices, GET /msk/clients, GET /msk/clients/{id}/engagement-report, GET /msk/clinical-reviews, GET /msk/care-transitions, GET /msk/eligibility-files, GET /msk/members, GET /msk/enrollments, GET /msk/exercise-sessions, GET /msk/appointments, GET /msk/outcome-measurements, GET /msk/claim-lines"

  - name: Clinician
    description: "Physical therapist or physician; conducts clinical reviews and consults, and approves in-person handoffs"
    identity: entity_backed:Clinician
    exclusive_operations:
      - "POST /msk/clinical-reviews/{id}/conduct — Conduct a clinical review"
      - "POST /msk/enrollments/{id}/transition-reviews — Register a transition review"
      - "POST /msk/transition-reviews/{id}/approve — Approve the in-person handoff"
      - "POST /msk/appointments/{id}/cancel — Cancel a consult"
      - "POST /msk/appointments/{id}/complete — Complete a consult"
      - "POST /msk/care-transitions — Open an in-person handoff"
      - "POST /msk/care-transitions/{id}/complete — Complete the in-person handoff"
    shared_operations:
      - "GET /msk/appointments"

  - name: BillingOps
    description: "Finance operations; builds and finalizes invoices, closes and suspends client contracts"
    identity: opaque
    exclusive_operations:
      - "POST /msk/fee-invoices — Create a draft invoice"
      - "POST /msk/fee-invoices/{id}/finalize — Finalize an invoice"
      - "POST /msk/fee-invoices/{id}/void — Void an invoice"
      - "POST /msk/fee-invoices/{id}/reopen — Reopen a finalized invoice"
      - "POST /msk/clients/{id}/suspend — Suspend a client"
      - "POST /msk/clients/{id}/reinstate — Reinstate a client"
      - "POST /msk/clients/{id}/close — Close a client"
      - "POST /msk/clients/{id}/recompute_engagement-tier — Recompute the engagement tier"
      - "POST /msk/clients/{id}/retention-credit — Read the retention-credit view"
      - "POST /msk/clients/{id}/membership-roll — Read the membership roll"
    shared_operations:
      - "GET /msk/fee-invoices, GET /msk/eligibility-files, GET /msk/members, GET /msk/enrollments, GET /msk/outcome-measurements, GET /msk/clinicians, GET /msk/clients, GET /msk/claim-lines"

  - name: Member
    description: "Program participant; completes guided exercise sessions and records outcome measurements"
    identity: entity_backed:Member
    exclusive_operations:
      - "POST /msk/exercise-sessions/{id}/complete — Complete a guided exercise session"
      - "POST /msk/outcome-measurements — Record an outcome measurement"
    shared_operations:
      - "GET /msk/exercise-sessions, GET /msk/outcome-measurements"

  - name: EligibilityService
    description: "Internal screening service that re-runs the demographic eligibility rule and applies the weekly session cut; not a human operator"
    identity: opaque
    exclusive_operations:
      - "POST /msk/members/{id}/recompute_eligibility — Recompute member eligibility"
      - "POST /msk/exercise-sessions/{id}/weekly-transition — Apply the weekly session cut"
    shared_operations: []

  - name: OutreachService
    description: "Engagement outreach service that queues and delivers outreach contacts"
    identity: opaque
    exclusive_operations:
      - "POST /msk/outreach-contacts — Queue an outreach contact"
      - "POST /msk/outreach-contacts/{id}/deliver — Deliver an outreach contact"
    shared_operations:
      - "GET /msk/outreach-contacts"

  - name: ClinicalReviewService
