      - name: bulk_action_one_billing_run_ages_three_unrelated_entity_families
        claim_type: bulk_action
        grounds:
          - endpoints[POST /swim-club/seasons/{id}/billing-runs]
          - state_machines[WaitlistEntry].OFFERED_to_EXPIRED
          - state_machines[Membership].INVOICED_to_DELINQUENT
          - state_machines[Certification].VALID_to_EXPIRED
        distinguishing_aspect: |
          A single POST with an empty body has to sweep three families that share nothing but the
          season, and its four steps run in a fixed order: the offer expiry in step 2 vacates a slot
          that step 3 immediately refills with the next queued household, so one call both closes and
          opens an offer. The run is a checkpoint rather than a projection, so a second identical call
          must be a no-op - including leaving the freshly extended offer alone, which is the assertion
          that catches an implementation that re-runs the selector unconditionally.
        test_recipe:
          setup:
            - "Two categories: COUPLE (bond 0, waitlist_required false) and FAMILY (waitlist_required true)."
            - "One OPEN 2027 season with dues_due_date 2027-04-15."
            - "Household HM with a COUPLE membership joined on the open_date and invoiced while the clock reads 2027-06-01, so its balance is 31050 and its dues_status is INVOICED."
            - "Households HA and HB, created in that order, each holding a WAITING FAMILY waitlist entry; HA therefore owns the earlier queue_key_at."
            - "One lifeguard holding a LIFEGUARD certification that expires 2027-06-20 and a CPR_AED certification that expires 2028-05-31."
            - "The clock is advanced from 2027-06-01T09:00Z to 2027-07-01T09:00Z before the trigger, which puts the offer expiry and the certification expiry in the past and the dues due date long past."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_couple_id: $.data.id }
            - call: "POST /swim-club/membership-categories"
              payload: { code: "FAMILY", label: "Family", bond_cents: 120000, initiation_fee_cents: 45000, seasonal_dues_cents: 78000, guest_pass_allotment: 4, max_household_size: 6, volunteer_credits_required: 4, waitlist_required: true, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_family_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
              captures: { s_v0: $.data.version }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Billing Household HM", address_line: "311 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h_m_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_m_id}", membership_category_id: "${cat_couple_id}", season_id: "${s27_id}", join_date: "2027-05-22", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_id}/invoice"
              payload: {}
              as: Treasurer
              captures: { m_dues_0: $.data.dues_status, m_balance_0: $.data.balance_due_cents, m_v0: $.data.version }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Waitlist Household HA", address_line: "312 Cedar Court", residency: "IN_DISTRICT", member_count: 5, prior_member: false }
              as: MembershipChair
              captures: { h_a_id: $.data.id }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Waitlist Household HB", address_line: "313 Cedar Court", residency: "IN_DISTRICT", member_count: 5, prior_member: false }
              as: MembershipChair
              captures: { h_b_id: $.data.id }
            - call: "POST /swim-club/waitlist-entries"
              payload: { household_id: "${h_a_id}", membership_category_id: "${cat_family_id}" }
              as: MembershipChair
              captures: { w_a_id: $.data.id, w_a_status_0: $.data.status }
            - call: "POST /swim-club/waitlist-entries"
              payload: { household_id: "${h_b_id}", membership_category_id: "${cat_family_id}" }
              as: MembershipChair
              captures: { w_b_id: $.data.id, w_b_status_0: $.data.status }
            - call: "POST /swim-club/waitlist-entries/next-offer"
              payload: { membership_category_id: "${cat_family_id}" }
              as: MembershipChair
              captures: { offered_id: $.data.id, w_a_offered_at: $.data.offered_at, w_a_expires: $.data.offer_expires_at }
            - call: "POST /swim-club/lifeguards"
              payload: { full_name: "Lapsing Guard", hire_date: "2026-05-01" }
              as: PoolManager
              captures: { lg_id: $.data.id }
            - call: "POST /swim-club/certifications"
              payload: { lifeguard_id: "${lg_id}", cert_type: "LIFEGUARD", issued_on: "2026-06-01", expires_on: "2027-06-20" }
              as: PoolManager
              captures: { cert_lg_id: $.data.id, cert_lg_status_0: $.data.status }
            - call: "POST /swim-club/certifications"
              payload: { lifeguard_id: "${lg_id}", cert_type: "CPR_AED", issued_on: "2026-06-01", expires_on: "2028-05-31" }
              as: PoolManager
              captures: { cert_cpr_id: $.data.id, cert_cpr_status_0: $.data.status }
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /swim-club/seasons/${s27_id}/billing-runs"
              payload: {}
              as: Treasurer
              captures: { s_v1: $.data.version, s_status_after: $.data.status }
            - call: "GET /swim-club/waitlist-entries/${w_a_id}"
              payload: {}
              as: MembershipChair
              captures: { w_a_status_1: $.data.status }
            - call: "GET /swim-club/waitlist-entries/${w_b_id}"
              payload: {}
              as: MembershipChair
              captures: { w_b_status_1: $.data.status, w_b_offered_at_1: $.data.offered_at, w_b_expires_1: $.data.offer_expires_at }
            - call: "GET /swim-club/memberships/${m_id}"
              payload: {}
              as: Treasurer
              captures: { m_dues_1: $.data.dues_status, m_balance_1: $.data.balance_due_cents, m_access_1: $.data.access_status, m_v1: $.data.version }
            - call: "GET /swim-club/certifications/${cert_lg_id}"
              payload: {}
              as: PoolManager
              captures: { cert_lg_status_1: $.data.status }
            - call: "GET /swim-club/certifications/${cert_cpr_id}"
              payload: {}
              as: PoolManager
              captures: { cert_cpr_status_1: $.data.status }
            - call: "GET /swim-club/lifeguards/${lg_id}"
              payload: {}
              as: PoolManager
              captures: { lg_lgc_1: $.data.has_valid_lifeguard_cert, lg_cprc_1: $.data.has_valid_cpr_cert, lg_emp_1: $.data.employment_status }
            - call: "POST /swim-club/seasons/${s27_id}/billing-runs"
              payload: {}
              as: Treasurer
              captures: { s_v2: $.data.version }
            - call: "GET /swim-club/waitlist-entries/${w_b_id}"
              payload: {}
              as: MembershipChair
              captures: { w_b_status_2: $.data.status, w_b_offered_at_2: $.data.offered_at }
            - call: "GET /swim-club/memberships/${m_id}"
              payload: {}
              as: Treasurer
              captures: { m_dues_2: $.data.dues_status, m_v2: $.data.version }
            - call: "GET /swim-club/waitlist-entries"
              payload: { membership_category_id: "${cat_family_id}", status: "OFFERED" }
              as: MembershipChair
              captures: { offered_list: $.data }
          assert:
            - "before the run: ${w_a_status_0} == WAITING, ${w_b_status_0} == WAITING, ${offered_id} == ${w_a_id} (HA holds the earlier queue_key_at), ${w_a_offered_at} == 2027-06-01T09:00:00Z and ${w_a_expires} == 2027-06-15T09:00:00Z == offered_at + OFFER_WINDOW_DAYS 14"
            - "before the run: ${m_dues_0} == INVOICED with ${m_balance_0} == 31050, ${cert_lg_status_0} == VALID and ${cert_cpr_status_0} == VALID"
            - "the run is HTTP 200 and returns the Season, with ${s_v1} == ${s_v0} + 1 and ${s_status_after} == OPEN: a billing run never changes the season's own status"
            - "step 2: ${w_a_status_1} == EXPIRED, reached without any client call, because 2027-07-01T09:00Z > ${w_a_expires}"
            - "step 3: ${w_b_status_1} == OFFERED with ${w_b_offered_at_1} == 2027-07-01T09:00:00Z and ${w_b_expires_1} == 2027-07-15T09:00:00Z - the vacated slot was refilled inside the same call, so one request both expired and created an offer"
            - "step 4: ${m_dues_1} == DELINQUENT with ${m_balance_1} == 31050 unchanged and ${m_access_1} == ACTIVE, so ageing the dues dimension left the access dimension alone; ${m_v1} == ${m_v0} + 1"
            - "step 1: ${cert_lg_status_1} == EXPIRED while ${cert_cpr_status_1} == VALID, because only the LIFEGUARD certification's expires_on 2027-06-20 is before the clock date"
            - "${lg_lgc_1} == false, ${lg_cprc_1} == true and ${lg_emp_1} == ACTIVE: an expiry recomputes the flags but only a revocation may set INACTIVE"
            - "the second run is HTTP 200 with ${s_v2} == ${s_v1} + 1, but ${w_b_status_2} == OFFERED with ${w_b_offered_at_2} == ${w_b_offered_at_1} - the live offer is neither expired nor re-issued, and no third household exists to be offered"
            - "${m_dues_2} == DELINQUENT and ${m_v2} == ${m_v1}: an already-delinquent membership is not touched twice, so the sweep is idempotent on every family it already aged"
            - "${offered_list} holds exactly one row, ${w_b_id}: step 3 never extends two live offers for the same category"

      - name: action_endpoint_write_off_settles_one_dimension_and_cascades_the_other
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /swim-club/memberships/{id}/write-off]
          - state_machines[Membership].DELINQUENT_to_WRITTEN_OFF
          - state_machines[PartyReservation].CONFIRMED_to_CANCELLED_BY_SUSPENSION
          - validations[priority=44]
        distinguishing_aspect: |
          One action endpoint writes both Membership dimensions in a single request - dues_status to
          the terminal WRITTEN_OFF and access_status to SUSPENDED - and the access move is what fires
          the child cascade, so the swim-team registration and the future party are collateral rather
          than direct effects. The refund on that cascade is deliberately half, never full, because the
          cause is the member's own account, and the account-credit auto-apply rule is deliberately
          skipped, so the credit sits on the household instead of settling anything. The reserve is
          proved untouched, and a second write-off is refused as terminal rather than as invalid.
        test_recipe:
          setup:
            - "One COUPLE category with bond 0 and party_privileges true; one OPEN 2027 season."
            - "One household with a membership joined on the open_date and invoiced, one CONFIRMED MINI registration, and one CONFIRMED PAVILION party for 2027-07-15T14:00Z-18:00Z (12 guests, 8 hosts, total 16200) covered by a CONFIRMED PRIMARY shift."
            - "The registration is created before the party, because a household with party charges outstanding cannot register a swimmer under priority 80."
            - "A reserve contribution of 100000 is booked on the season, so the untouched-reserve assertion has a non-zero figure to check."
            - "The clock is then advanced to 2027-07-01T09:00Z and a billing run drives the membership to DELINQUENT."
