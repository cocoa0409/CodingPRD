            - { call: "POST /audit-counts/${aud}/start", payload: {}, as: FieldAuditor, as_user_id: "aud-1" }
            - { call: "GET /audit-counts/${aud}", payload: {}, as: JobberAdmin, captures: { aud_v: "$.data.version" } }
          trigger:
            - { call: "POST /audit-counts/${aud}/certify", payload: { expected_audit_count_version: "${aud_v}" }, as: JobberAdmin, as_user_id: "admin-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE (http 409); audit remains IN_PROGRESS"

  # ============================ ENDPOINTS ============================
  - section: endpoints
    instances:
      - name: list_filter_by_fk_scoped
        claim_type: pagination_filtering
        grounds: [endpoints, entities.ServiceVisit.fields.store_agreement_id]
        distinguishing_aspect: "GET /service-visits?store_agreement_id=X returns exactly X's visits — FK filters scope the collection."
        test_recipe:
          setup: ["two ACTIVE agreements on two stores; one visit each"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "FilterFK" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "FK A", store_code: "FA1", total_facings: 50 }, as: JobberAdmin, captures: { storeA: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "FK B", store_code: "FB1", total_facings: 50 }, as: JobberAdmin, captures: { storeB: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${storeA}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agrA: "$.data.id" } }
            - { call: "POST /agreements/${agrA}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agrA}/accept", payload: {}, as: RetailerManager, as_user_id: "${storeA}" }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${storeB}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agrB: "$.data.id" } }
            - { call: "POST /agreements/${agrB}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agrB}/accept", payload: {}, as: RetailerManager, as_user_id: "${storeB}" }
            - { call: "POST /routes", payload: { program_id: "${prog}", name: "Route F", assigned_driver_id: "drv-1" }, as: JobberAdmin, captures: { route: "$.data.id" } }
            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agrA}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { vA: "$.data.id" } }
            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agrB}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { vB: "$.data.id" } }
          trigger:
            - { call: "GET /service-visits", payload: { store_agreement_id: "${agrA}" }, as: JobberAdmin, captures: { first_id: "$.data[0].id" } }
          assert:
            - "filtered list has meta.total_count == 1 and data[0].id == ${vA} (== first_id); ${vB} is absent"

      - name: computed_read_settlement_fields
        claim_type: computed_fields
        grounds: [entities.SettlementStatement, calculations.settlement_net_payable]
        distinguishing_aspect: "GET on a generated statement returns every computed money field with exact literals for a 10-unit @200 period."
        test_recipe:
          setup: ["ACTIVE agreement (est shrink 0); directive 200; SALE 10 units"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "ReadCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "ReadStore", store_code: "RD1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
