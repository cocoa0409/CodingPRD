  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: extra_pickup_same_day_double_booking_rejected
        grounds:
          - validations[priority=11]
          - state_machines.ExtraPickupRequest.REQUESTED_to_SCHEDULED
          - entities.ExtraPickupRequest.fields.requested_date
        distinguishing_aspect: |
          Point-interval (single calendar day) collision on the ExtraPickupRequest resource:
          scheduling a second extra pickup on a requested_date already held by a SCHEDULED request
          on the same account is rejected with ERR_DATE_DOUBLE_BOOKED — exact-day equality semantics.
        test_recipe:
          setup:
            - "ACTIVE STANDARD account with one already-SCHEDULED extra pickup on 2026-03-27 and a second REQUESTED extra pickup also on 2026-03-27."
          setup_api_calls:
