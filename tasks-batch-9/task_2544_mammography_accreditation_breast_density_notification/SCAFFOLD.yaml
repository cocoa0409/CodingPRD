    side_effects: ["calculations.supplemental_coverage_determination writes coverage_outcome, coverage_tier, allowed_amount_cents, covered_amount_cents, patient_responsibility_cents, governing_state_code", "status -> COVERAGE_DETERMINED", "SupplementalScreeningOrder.version incremented"]

  - method: POST
    path: "/supplemental-orders/{id}/schedule"
    description: "Schedules the supplemental study against the facility's concurrent capacity"
    roles: [AccreditationCoordinator]
    code: 200
    input: [appointment_start]
    output: SupplementalScreeningOrder
    side_effects: ["calculations.supplemental_appointment_occupancy enforced with closed-interval semantics and 15 minutes of turnover", "appointment_end computed; status -> SCHEDULED", "Exam.follow_up_status -> PENDING"]

  - method: POST
    path: "/supplemental-orders/{id}/complete"
    description: "Records completion of the supplemental study"
    roles: [AccreditationCoordinator]
    code: 200
    input: ["completion_note?"]
    output: SupplementalScreeningOrder
    side_effects: ["status -> COMPLETED, completed_at stamped", "Exam.follow_up_status -> COMPLETED when no other non-terminal order remains"]

  # --- EquipmentFailureEvent ------------------------------------------------
  - method: GET
    path: "/equipment-failures/{id}"
    description: "Reads one equipment failure event"
    roles: [AccreditationCoordinator, AccreditationBodyReviewer, FdaInspector, QualityAssuranceOfficer, InterpretingPhysician, Technologist, MedicalPhysicist]
    code: 200
    input: []
    output: EquipmentFailureEvent
    side_effects: []

  - method: POST
    path: "/equipment-failures/{id}/restore"
    description: "Verifies the repair and returns the unit to service when a qualifying post-repair survey has passed"
    roles: [AccreditationCoordinator]
    code: 200
    input: [repair_note]
    output: EquipmentFailureEvent
    side_effects: ["status -> REPAIR_VERIFIED, resolved_at stamped", "MammographyUnit.operational_state -> IN_SERVICE when no other OPEN qualifying failure remains", "calculations.facility_compliance_posture recomputed"]

  # --- RepeatImagingRecord --------------------------------------------------
  - method: GET
    path: "/repeat-records/{id}"
    description: "Reads one repeat imaging record"
    roles: [AccreditationCoordinator, AccreditationBodyReviewer, FdaInspector, QualityAssuranceOfficer, InterpretingPhysician, Technologist, MedicalPhysicist]
    code: 200
    input: []
    output: RepeatImagingRecord
    side_effects: []

  - method: GET
    path: "/repeat-records"
    description: "Filtered repeat-record list — FK reverse-reachability for RepeatImagingRecord.equipment_failure_id"
    roles: [AccreditationCoordinator, AccreditationBodyReviewer, FdaInspector, QualityAssuranceOfficer, InterpretingPhysician, Technologist, MedicalPhysicist]
    code: 200
    input: ["exam_id?", "equipment_failure_id?", "reason_code?", "retracted?", "limit?", "offset?"]
    output: RepeatImagingRecord[]
    side_effects: []

  - method: POST
    path: "/repeat-records/{id}/retract"
    description: "Retracts a repeat record documented in error; fully compensates the image ledger"
    roles: [QualityAssuranceOfficer]
    code: 200
    input: [retraction_reason]
    output: RepeatImagingRecord
    side_effects: ["retracted -> true", "Exam.repeat_image_count and the unit's image ledger recomputed; total_images_acquired returns to exactly its pre-documentation value", "MammographyUnit.version incremented"]

  # --- RadiologistAuditCycle -----------------------------------------------
  - method: GET
    path: "/audit-cycles/{id}"
    description: "Reads one audit cycle including the metrics frozen at close"
    roles: [AccreditationCoordinator, AccreditationBodyReviewer, FdaInspector, QualityAssuranceOfficer, InterpretingPhysician, Technologist, MedicalPhysicist]
    code: 200
    input: []
    output: RadiologistAuditCycle
    side_effects: []

  - method: GET
    path: "/audit-cycles/{id}/metrics"
    description: "Read-only preview of calculations.radiologist_audit_metrics under either variant without locking the cycle"
    roles: [AccreditationCoordinator, AccreditationBodyReviewer, FdaInspector, QualityAssuranceOfficer, InterpretingPhysician, Technologist, MedicalPhysicist]
    code: 200
    input: ["variant?"]
    output: "{ variant: string, screening_exam_count: integer, recall_count: integer, biopsy_count: integer, cancer_count: integer, excluded_exam_count: integer, recall_rate_pct: number, ppv_pct: number, abnormal_interpretation_flag: boolean }"
    side_effects: ["none — the cycle is not mutated; defaults to PPV1_SCREENING when variant is omitted"]

  - method: POST
    path: "/audit-cycles/{id}/close"
    description: "Closes (or re-closes) an audit cycle under the requested PPV variant; the closer must not be the audited radiologist"
    roles: [QualityAssuranceOfficer]
    code: 200
    input: [variant]
    output: RadiologistAuditCycle
    side_effects: ["calculations.radiologist_audit_metrics runs and freezes every metric field plus variant_at_close", "status -> LOCKED from OPEN or AMENDED; locked_at stamped", "RadiologistAuditCycle.version incremented"]

# =============================================================================
# §1.6 Error Code Catalog
# Every code below is triggerable through at least one §1.5 endpoint.
# =============================================================================
errors:

  # --- authentication / authorization / ownership ---------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role is not one of the seven declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_ACTOR_NOT_AT_FACILITY
    http: 403
    condition: "An entity_backed actor's X-User-ID does not resolve to a Personnel row of the target facility with the matching role_type"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The QA officer recording a pathology outcome is the exam's interpreting physician, the QA officer closing an audit cycle is the audited radiologist, or a survey decision is recorded by the wrong side of the physicist/coordinator split"
  - id: ERR_NOT_INTERPRETING_PHYSICIAN
    http: 403
    condition: "An amendment is attempted by someone other than the exam's interpreting_physician_id"

  # --- existence ------------------------------------------------------------
  - id: ERR_STATE_POLICY_NOT_FOUND
    http: 404
    condition: "state_policy_id in path or body does not exist"
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "Facility id in path does not exist"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "MammographyUnit id in path or body does not exist"
  - id: ERR_PERSONNEL_NOT_FOUND
    http: 404
    condition: "Personnel id in path or body (technologist_id) does not exist"
  - id: ERR_SURVEY_NOT_FOUND
    http: 404
    condition: "PhysicistSurvey id in path does not exist"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "AnnualInspection id in path does not exist"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "ClinicalImageReviewSubmission id in path does not exist"
  - id: ERR_EXAM_NOT_FOUND
    http: 404
    condition: "Exam id in path, or any element of exam_ids, does not exist"
  - id: ERR_LETTER_NOT_FOUND
    http: 404
    condition: "NotificationLetter id in path does not exist"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "SupplementalScreeningOrder id in path does not exist"
  - id: ERR_FAILURE_EVENT_NOT_FOUND
    http: 404
    condition: "EquipmentFailureEvent id in path or body does not exist"
  - id: ERR_REPEAT_RECORD_NOT_FOUND
    http: 404
    condition: "RepeatImagingRecord id in path does not exist"
  - id: ERR_AUDIT_CYCLE_NOT_FOUND
    http: 404
    condition: "RadiologistAuditCycle id in path does not exist"

  # --- schema / uniqueness --------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, unknown enum value, numeric value out of the declared range, malformed state code, or a conditional field pairing violation (ce_hours with READ_VOLUME, exam_count with CATEGORY_1_CE, equipment_failure_id without reason_code EQUIPMENT_FAILURE)"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "StatePolicy.state_code already registered, or MammographyUnit.model_serial already used within the facility"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_UNIT_VERSION
    http: 412
    condition: "expected_unit_version does not match the MammographyUnit's current version"
  - id: ERR_STALE_EXAM_VERSION
    http: 412
    condition: "expected_exam_version does not match the Exam's current version"

  # --- state preconditions --------------------------------------------------
  - id: ERR_SURVEY_NOT_DECIDABLE
    http: 409
    condition: "submit called on a survey not in DRAFT, or remediate called on a survey not in FAILED_ACTION_REQUIRED"
  - id: ERR_SUBMISSION_NOT_REVIEWABLE
    http: 409
    condition: "review called on a submission not in SUBMITTED"
  - id: ERR_SUBMISSION_NOT_REVISABLE
    http: 409
    condition: "resubmit called on a submission not in REVISION_REQUIRED"
  - id: ERR_SUBMISSION_NOT_WITHDRAWABLE
    http: 409
    condition: "withdraw called on a submission not in SUBMITTED"
  - id: ERR_INSPECTION_ALREADY_CLOSED
    http: 409
    condition: "close called on an inspection already in CLOSED"
  - id: ERR_LETTER_NOT_SENDABLE
    http: 409
    condition: "send called on a letter not in QUEUED"
  - id: ERR_LETTER_NOT_SENT
    http: 409
    condition: "mark-undeliverable called on a letter not in SENT"
  - id: ERR_ORDER_NOT_DETERMINABLE
    http: 409
    condition: "coverage-determination called on an order not in RECOMMENDED"
  - id: ERR_ORDER_NOT_SCHEDULABLE
    http: 409
    condition: "schedule called on an order not in COVERAGE_DETERMINED or LOST_TO_FOLLOW_UP"
  - id: ERR_ORDER_NOT_COMPLETABLE
    http: 409
    condition: "complete called on an order not in SCHEDULED"
  - id: ERR_EXAM_NOT_INTERPRETABLE
    http: 409
    condition: "interpret called on an exam not in AWAITING_INTERPRETATION or DELAYED"
  - id: ERR_EXAM_NOT_AMENDABLE
    http: 409
    condition: "amend called on an exam not in INTERPRETED_FINAL or AMENDED"
  - id: ERR_OUTCOME_ALREADY_RECORDED
    http: 409
    condition: "outcome called on an exam whose pathology_result is already BENIGN or MALIGNANT"
  - id: ERR_AUDIT_CYCLE_NOT_CLOSABLE
    http: 409
    condition: "close called on a cycle not in OPEN or AMENDED"
  - id: ERR_FAILURE_ALREADY_RESOLVED
    http: 409
    condition: "restore called on a failure event already in REPAIR_VERIFIED"
  - id: ERR_REPEAT_RECORD_ALREADY_RETRACTED
    http: 409
    condition: "retract called on a record whose retracted flag is already true"
  - id: ERR_UNIT_NOT_IN_SERVICE
    http: 409
    condition: "An exam is recorded on a unit whose operational_state is OUT_OF_SERVICE"
  - id: ERR_FACILITY_SUSPENDED
    http: 409
    condition: "A supplemental appointment is scheduled while the facility's compliance_posture is SUSPENDED"

  # --- safety / compliance --------------------------------------------------
  - id: ERR_TECHNOLOGIST_NOT_QUALIFIED
    http: 422
    condition: "The named technologist's qualification_status is not QUALIFIED"
  - id: ERR_PHYSICIAN_NOT_QUALIFIED
    http: 422
    condition: "The interpreting physician's qualification_status is not QUALIFIED at interpretation or amendment"
  - id: ERR_MODALITY_NOT_CERTIFIED
    http: 422
    condition: "The acting person's modality_certifications do not include the unit's modality"
  - id: ERR_UNIT_ACCREDITATION_SUSPENDED
    http: 409
    condition: "An exam, a new clinical image review, or a restore-to-service is attempted on a unit whose accreditation_status is SUSPENDED"
  - id: ERR_OPEN_LEVEL_1_FINDING
    http: 409
    condition: "A clinical image packet is submitted or resubmitted while the facility has a LEVEL_1 inspection finding still in CORRECTIVE_ACTION_REQUIRED"
  - id: ERR_POST_REPAIR_SURVEY_MISSING
    http: 409
    condition: "A unit is restored to service without a PASSED POST_REPAIR survey whose effective_start is at or after the failure's detected_at"

  # --- referential integrity ------------------------------------------------
  - id: ERR_EXAM_UNIT_MISMATCH
    http: 422
    condition: "A clinical image packet contains an exam belonging to a different MammographyUnit"
  - id: ERR_PACKET_EXAM_NOT_FINAL
    http: 422
    condition: "A clinical image packet contains an exam whose report_status is not INTERPRETED_FINAL or AMENDED"
  - id: ERR_PACKET_TOO_SMALL
    http: 422
    condition: "A clinical image packet has fewer than 2 distinct exam ids, or contains duplicates"
  - id: ERR_FAILURE_UNIT_MISMATCH
    http: 422
    condition: "The referenced EquipmentFailureEvent belongs to a different unit than the exam being repeated"
  - id: ERR_NOT_AN_INTERPRETING_PHYSICIAN
    http: 422
    condition: "An audit cycle is opened on a Personnel row whose role_type is not INTERPRETING_PHYSICIAN"

  # --- temporal -------------------------------------------------------------
  - id: ERR_FUTURE_TIMESTAMP
    http: 422
    condition: "A client-supplied historical instant (performed_at, detected_at, inspection_date, awarded_on, initial_qualification_on) is after the logical clock"
  - id: ERR_SURVEY_WINDOW_INVALID
    http: 422
    condition: "effective_end is not after effective_start, or the window exceeds 396 days"
  - id: ERR_SURVEY_WINDOW_OVERLAP
    http: 409
    condition: "The new survey window overlaps a live same-type window on the unit; abutting windows (new.effective_start == existing.effective_end) are allowed"
  - id: ERR_REACCREDITATION_WINDOW_CLOSED
    http: 409
    condition: "A clinical image review is submitted or resubmitted after the unit's accreditation_expires_on has passed"
  - id: ERR_AUDIT_PERIOD_NOT_ELAPSED
    http: 409
    condition: "An audit cycle is closed before the logical clock reaches period_end"
  - id: ERR_APPOINTMENT_IN_PAST
    http: 422
    condition: "appointment_start is before the logical clock"
  - id: ERR_CLOCK_REWIND
    http: 422
    condition: "A set_current_utc request would move the logical clock backwards"

  # --- constraint -----------------------------------------------------------
  - id: ERR_REACCREDITATION_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "A submission or resubmission is attempted while reaccreditation_attempts_remaining is 0"
  - id: ERR_SUBMISSION_ALREADY_OPEN
    http: 409
    condition: "A second clinical image review is created while one is still SUBMITTED or REVISION_REQUIRED on the unit"
  - id: ERR_AUDIT_CYCLE_OVERLAP
    http: 409
    condition: "A new audit cycle's period overlaps an existing cycle of the same radiologist, or a second OPEN cycle is requested"
  - id: ERR_AMENDMENT_NO_CHANGE
    http: 422
    condition: "An amendment supplies neither a different birads_assessment nor a different density_category"
  - id: ERR_DENSITY_CATEGORY_REQUIRED
    http: 422
    condition: "A SCREENING exam is interpreted without a density_category"
  - id: ERR_EXAM_NOT_ELIGIBLE_FOR_SUPPLEMENTAL
    http: 422
    condition: "A supplemental order is recommended for an exam that is not INTERPRETED_FINAL/AMENDED or has no density_category"
  - id: ERR_COVERAGE_NOT_DETERMINED
    http: 409
    condition: "An order is scheduled while coverage_outcome is still UNDETERMINED"
  - id: ERR_SUPPLEMENTAL_CAPACITY_CONFLICT
    http: 409
    condition: "The requested buffered appointment interval collides with at least supplemental_concurrent_capacity SCHEDULED orders at the facility"

  # --- fiscal ---------------------------------------------------------------
  - id: ERR_INVALID_DEPOSIT_AMOUNT
    http: 422
    condition: "amount_cents is not a positive integer"
  - id: ERR_INSUFFICIENT_PREPAID_CREDIT
    http: 402
    condition: "prepaid_credit_cents is below the 250000-cent application fee at submit or resubmit time"

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
#
# The three entity_backed clinical roles are all backed by Personnel and are
# distinguished by Personnel.role_type; X-User-ID for those roles MUST equal the
# id of a Personnel row of the target facility with the matching role_type.
# The four operational roles are opaque operator identifiers.
#
# Segregation of duties enforced by §1.4 priorities 4-6:
#   · survey decision (MedicalPhysicist, must be the survey's own physicist_id)
#     vs remediation decision (AccreditationCoordinator)
#   · pathology outcome (QualityAssuranceOfficer) must not be the exam's
#     interpreting physician
#   · audit-cycle close (QualityAssuranceOfficer) must not be the audited
#     radiologist
#   · packet submission (AccreditationCoordinator) vs packet review decision
#     (AccreditationBodyReviewer)
#   · inspection recording and closure (FdaInspector) is closed to the facility
# All seven roles share every read endpoint.
# =============================================================================
roles:

  - name: AccreditationCoordinator
    description: "Facility-side accreditation and compliance operator: registers the facility, its units and its staff, funds and files clinical image packets, runs remediations, generates and dispatches patient letters, manages supplemental orders and fires the compliance run"
    identity: opaque
    exclusive_operations:
      - "POST /facilities"
      - "POST /facilities/{id}/funding-deposits"
      - "POST /facilities/{id}/units"
      - "POST /facilities/{id}/personnel"
      - "POST /personnel/{id}/credits"
      - "POST /personnel/{id}/qualification-reviews"
      - "POST /units/{id}/clinical-image-reviews"
      - "POST /clinical-image-reviews/{id}/resubmit"
      - "POST /clinical-image-reviews/{id}/withdraw"
      - "POST /physicist-surveys/{id}/remediate"
      - "POST /equipment-failures/{id}/restore"
      - "POST /exams/{id}/notification-letters"
      - "POST /notification-letters/{id}/send"
      - "POST /notification-letters/{id}/mark-undeliverable"
      - "POST /supplemental-orders/{id}/coverage-determination"
      - "POST /supplemental-orders/{id}/schedule"
      - "POST /supplemental-orders/{id}/complete"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /facilities/{id}/compliance-runs"
      - "POST /units/{id}/equipment-failures"
      - "POST /exams/{id}/repeat-records"
      - "POST /exams/{id}/supplemental-orders"
      - "every GET endpoint"

  - name: AccreditationBodyReviewer
    description: "Accreditation body (ACR or state) image reviewer; the only role that may decide a clinical image packet, and never the role that files one"
    identity: opaque
    exclusive_operations:
      - "POST /clinical-image-reviews/{id}/review"
    shared_operations:
      - "POST /state-policies"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"

  - name: FdaInspector
    description: "Federal or state MQSA inspector; records annual inspection findings and closes corrective actions. Facility roles cannot record or close their own inspections"
    identity: opaque
    exclusive_operations:
      - "POST /facilities/{id}/inspections"
      - "POST /inspections/{id}/close"
    shared_operations:
      - "POST /state-policies"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"

  - name: QualityAssuranceOfficer
    description: "Independent quality assurance officer; records pathology outcomes, retracts mis-documented repeat records, and opens and closes radiologist audit cycles — never on their own reads"
    identity: opaque
    exclusive_operations:
      - "POST /exams/{id}/outcome"
      - "POST /repeat-records/{id}/retract"
      - "POST /personnel/{id}/audit-cycles"
      - "POST /audit-cycles/{id}/close"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /facilities/{id}/compliance-runs"
      - "every GET endpoint"

  - name: InterpretingPhysician
    description: "MQSA-qualified interpreting radiologist; the only role that may interpret or amend an exam, and the clinical origin of a supplemental screening recommendation"
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /exams/{id}/interpret"
      - "POST /exams/{id}/amend"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /exams/{id}/supplemental-orders"
      - "every GET endpoint"

  - name: Technologist
    description: "MQSA-qualified radiologic technologist; acquires exams (technologist_id must equal their own X-User-ID) and documents repeats"
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /exams"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /units/{id}/equipment-failures"
      - "POST /exams/{id}/repeat-records"
      - "every GET endpoint"

  - name: MedicalPhysicist
    description: "MQSA-qualified medical physicist; opens survey records and submits their own survey decisions, but may not record the coordinator-side remediation of a failed survey"
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /units/{id}/physicist-surveys"
      - "POST /physicist-surveys/{id}/submit"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /units/{id}/equipment-failures"
      - "every GET endpoint"
