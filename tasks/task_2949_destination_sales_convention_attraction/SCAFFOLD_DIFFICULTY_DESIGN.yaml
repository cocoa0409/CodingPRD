              as: SalesManager
              captures: { opp_one_id: $.data.id }
            - call: "POST /opportunities/${opp_one_id}/qualify"
              payload: {}
              as: SalesManager
              captures: { opp_one_v: $.data.version }
            - call: "POST /bid-packages"
              payload: { opportunity_id: "${opp_one_id}", expected_opportunity_version: "${opp_one_v}" }
              as: SalesManager
              as_user_id: "sales-11"
              captures: { bid_one_id: $.data.id }
            - call: "POST /bid-packages/${bid_one_id}/request-incentive"
              payload: { incentive_request_amount: 9000.00, service_commitment_codes: ["AIRPORT_SHUTTLE"] }
              as: SalesManager
              as_user_id: "sales-11"
              captures: { cap_one: $.data.incentive_cap_amount }
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
