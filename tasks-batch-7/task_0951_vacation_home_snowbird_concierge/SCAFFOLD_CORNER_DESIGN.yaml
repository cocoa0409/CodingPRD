        distinguishing_aspect: "Rung 34 depends on the state of a DIFFERENT entity: with the property VACANT (so the seasonal transition's own occupancy precondition passes) but a turnover in CLEANING, BEGIN_CLOSE returns 409 ERR_TURNOVER_IN_FLIGHT and no WinterizationRecord is created."
