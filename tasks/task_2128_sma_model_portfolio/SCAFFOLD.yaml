# =============================================================================
# Task 2128 — Separately Managed Account & Model Portfolio Delivery
# SMA sponsor platform seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!! 2128. Separately Managed Account & Model Portfolio Delivery (SMA sponsor platform): model publication & sponsor platform distribution, account-level customization (restrictions/tax overlay), trade order generation & block/allocation, drift monitoring & rebalancing triggers, tax-loss harvesting & wash sale coordination, fee billing & sponsor revenue split, performance dispersion analysis across accounts, model change notification & implementation lag

domain_name: sma-model-delivery
api_prefix: /sma

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  difficulty_level: expert
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval

  entity_topology: graph
  # Twelve peer entities linked by explicit foreign keys, including a
  # self-referential TaxLot -> TaxLot split edge and a SponsorDistribution
  # junction that joins Sponsor x ModelVersion. No URL nesting beyond
  # action sub-paths; every relationship is an FK, not a path segment.

  state_machine_shape: parallel
  # Account carries two INDEPENDENT state dimensions on one row
  # (implementation_status x billing_status). ModelVersion is cyclic
  # (PENDING_APPROVAL -> DRAFT on reject). TradeOrder is cyclic
  # (BLOCKED -> ALLOCATED -> BLOCKED on unwind). HarvestProposal is
  # branching (PROPOSED -> {APPROVED, REJECTED, SUPERSEDED}).

  relationship_patterns:
    - one_to_many          # Account -> TaxLot, Block -> TradeOrder
    - many_to_many         # Sponsor <-> ModelVersion via SponsorDistribution
    - self_referential     # TaxLot.parent_tax_lot_id -> TaxLot.id (split slices)
    - cross_aggregate      # TradeOrder references Account, Security AND ModelVersion

  role_model: segregation_of_duties
  # The X-User-ID that submitted a ModelVersion may not approve or reject it,
  # even when acting under the ComplianceOfficer role.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Security
    parent: null
    common_fields: true
    fields:
      - { name: ticker, type: string, source: input, description: "Uppercase exchange ticker; globally unique", constraints: "1-8 chars, [A-Z]+, unique across all Security rows" }
      - { name: name, type: string, source: input, description: "Issuer / instrument display name" }
      - { name: asset_class, type: enum, source: input, description: "US_EQUITY | GLOBAL_EQUITY | FIXED_INCOME | CASH_EQUIV", constraints: "one of the four listed members" }
      - { name: last_price_cents, type: integer, source: input, description: "Current mark used by every valuation, drift, generation and harvest computation", constraints: ">= 1" }
      - { name: restricted_globally, type: boolean, source: input, default: false, description: "When true the platform blocks any BUY of this security into any Account" }

  - name: Sponsor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Sponsor broker-dealer / wirehouse name" }
      - { name: platform_code, type: string, source: input, description: "Short sponsor platform code; globally unique", constraints: "2-12 chars, unique across all Sponsor rows" }
      - { name: revenue_share_bps, type: integer, source: input, description: "Sponsor's cut of every FeeInvoice.gross_fee_cents, in basis points of the gross fee", constraints: "0 <= revenue_share_bps <= 9000" }
      - { name: implementation_lag_days, type: integer, source: input, default: 2, description: "Contractual days an Account has to implement a newly published ModelVersion after notification", constraints: "0 <= implementation_lag_days <= 10" }
      - { name: min_account_value_cents, type: integer, source: input, default: 0, description: "Minimum Account.market_value_cents required before an implementation may run", constraints: ">= 0" }
      - { name: account_count, type: integer, source: computed, default: 0, description: "Count of Account rows whose sponsor_id equals this Sponsor.id" }

  - name: Model
    parent: null
    common_fields: true
    fields:
      - { name: manager_name, type: string, source: input, description: "Asset-manager firm that owns the strategy" }
      - { name: name, type: string, source: input, description: "Strategy display name" }
      - { name: strategy_code, type: string, source: input, description: "Short strategy code; globally unique", constraints: "2-12 chars, unique across all Model rows" }
      - { name: asset_class, type: enum, source: input, description: "US_EQUITY | GLOBAL_EQUITY | FIXED_INCOME | CASH_EQUIV", constraints: "one of the four listed members" }
      - { name: base_fee_bps, type: integer, source: input, description: "Tier-1 annual management fee in basis points; tiers 2 and 3 discount off this value", constraints: "1 <= base_fee_bps <= 500" }
      - { name: drift_threshold_bps, type: integer, source: input, default: 300, description: "Account.drift_bps at or above this value marks the account DRIFTED", constraints: "1 <= drift_threshold_bps <= 10000" }
      - { name: published_model_version_id, type: string, source: computed, default: null, description: "Denormalized pointer to the ModelVersion of this Model currently in status PUBLISHED, or null when none has ever been published. Not a parent link and not an ownership edge; the owning edge is ModelVersion.model_id." }
      - { name: version_count, type: integer, source: computed, default: 0, description: "Count of ModelVersion rows whose model_id equals this Model.id" }

  - name: ModelVersion
    parent: Model
    common_fields: true
    fields:
      - { name: model_id, type: string, source: input, description: "FK -> Model.id; the strategy this version belongs to" }
      - { name: version_number, type: integer, source: system, description: "Sequential per Model, starting at 1, assigned as Model.version_count + 1 at creation" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PENDING_APPROVAL | APPROVED | PUBLISHED | SUPERSEDED", constraints: "at most one ModelVersion per Model may be in status PUBLISHED at any time" }
      - { name: sleeves, type: array, source: input, default: [], description: "Array of sleeve objects { security_id, target_weight_bps, max_position_bps }. security_id must be an existing Security.id; target_weight_bps is an integer 1..10000; max_position_bps is an integer 1..10000 defaulting to 10000. At most one sleeve per security_id." }
      - { name: sleeve_count, type: integer, source: computed, default: 0, description: "Length of the sleeves array" }
      - { name: total_target_weight_bps, type: integer, source: computed, default: 0, description: "Sum of sleeves[*].target_weight_bps; must equal exactly 10000 before submit is allowed" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID that performed the DRAFT -> PENDING_APPROVAL transition" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID that performed the PENDING_APPROVAL -> APPROVED transition" }
      - { name: rejection_note, type: string, source: system, default: null, description: "Reviewer note recorded on the PENDING_APPROVAL -> DRAFT revision loop" }
      - { name: published_at, type: datetime, source: system, default: null, description: "Logical clock instant of the APPROVED -> PUBLISHED transition" }
      - { name: superseded_at, type: datetime, source: system, default: null, description: "Logical clock instant of the PUBLISHED -> SUPERSEDED transition" }
      - { name: distribution_count, type: integer, source: computed, default: 0, description: "Count of SponsorDistribution rows whose model_version_id equals this ModelVersion.id" }

  - name: SponsorDistribution
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id; the sponsor platform receiving the model" }
      - { name: model_version_id, type: string, source: input, description: "FK -> ModelVersion.id; the exact version being distributed" }
      - { name: model_id, type: string, source: computed, description: "FK -> Model.id; copied from ModelVersion.model_id at creation. Together with sponsor_id this is the resource key the effective-window overlap rule occupies." }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | ACTIVE | LAPSED" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the distribution's effective window" }
      - { name: effective_until, type: datetime, source: input, default: null, description: "EXCLUSIVE end of the distribution's effective window; null means open-ended", constraints: "when non-null must be strictly greater than effective_from" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "Logical clock instant of the PENDING -> ACTIVE transition" }
      - { name: lapsed_at, type: datetime, source: system, default: null, description: "Logical clock instant of the ACTIVE -> LAPSED transition driven by the publish cascade" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id; the platform that custodies this SMA account" }
      - { name: model_id, type: string, source: input, description: "FK -> Model.id; the strategy this account tracks" }
      - { name: account_number, type: string, source: input, description: "Sponsor-facing account number; globally unique", constraints: "3-20 chars, unique across all Account rows" }
      - { name: current_model_version_id, type: string, source: system, default: null, description: "FK -> ModelVersion.id; the version whose sleeves currently define this account's targets" }
      - { name: pending_model_version_id, type: string, source: system, default: null, description: "FK -> ModelVersion.id; the newly published version this account has been notified of but has not implemented yet" }
      - { name: implementation_status, type: enum, source: system, default: SYNCED, description: "Dimension 1 of 2: PENDING_IMPLEMENTATION | SYNCED | DRIFTED | SUSPENDED. Evolves independently of billing_status." }
      - { name: billing_status, type: enum, source: system, default: CURRENT, description: "Dimension 2 of 2: CURRENT | INVOICED | DELINQUENT | WRITTEN_OFF. Evolves independently of implementation_status." }
      - { name: cash_cents, type: integer, source: system, default: 0, description: "Settled cash balance in cents" }
      - { name: cash_reserve_bps, type: integer, source: input, default: 100, description: "Fraction of market value held back from investment during generation", constraints: "0 <= cash_reserve_bps <= 2000" }
      - { name: market_value_cents, type: integer, source: computed, default: 0, description: "= cash_cents + sum over TaxLot rows with account_id = this.id AND status = OPEN of (shares_open * Security.last_price_cents)" }
      - { name: drift_basis, type: enum, source: input, default: SETTLED, description: "SETTLED | TRADE_DATE — selects which variant of the drift calculation is the account's default" }
      - { name: drift_bps, type: integer, source: computed, default: null, description: "Result of the most recent drift evaluation" }
      - { name: drift_basis_used, type: enum, source: system, default: null, description: "SETTLED | TRADE_DATE — the basis actually applied by the most recent drift evaluation" }
      - { name: drift_evaluated_at, type: datetime, source: system, default: null, description: "Logical clock instant of the most recent drift evaluation" }
      - { name: tax_overlay_enabled, type: boolean, source: input, default: false, description: "When false the account may not create HarvestProposal rows" }
      - { name: harvest_budget_cents, type: integer, source: input, default: 0, description: "Annual ceiling on realized_loss_ytd_cents", constraints: ">= 0" }
      - { name: realized_loss_ytd_cents, type: integer, source: computed, default: 0, description: "Running sum of per-lot losses realized this year; gains never reduce it" }
      - { name: fees_billed_ytd_cents, type: integer, source: computed, default: 0, description: "Running sum of gross_fee_cents over FeeInvoice rows of this account currently in status ISSUED, PAID or WRITTEN_OFF" }
      - { name: notified_at, type: datetime, source: system, default: null, description: "Logical clock instant this account was notified of a model change by the publish cascade" }
      - { name: implementation_deadline, type: datetime, source: system, default: null, description: "= notified_at + Sponsor.implementation_lag_days days" }
      - { name: last_implementation_lag_days, type: integer, source: system, default: null, description: "Whole days between notified_at and the instant the implementation actually ran" }
      - { name: implemented_late, type: boolean, source: system, default: false, description: "True when the most recent implementation ran strictly after implementation_deadline" }
      - { name: latest_return_bps, type: integer, source: system, default: null, description: "Most recently recorded period return in basis points; feeds dispersion analysis" }
      - { name: latest_return_period_end, type: datetime, source: system, default: null, description: "period_end of the most recently recorded performance observation" }
      - { name: latest_ending_value_cents, type: integer, source: system, default: null, description: "Ending market value of the most recent performance observation; the weight used by the ASSET_WEIGHTED dispersion variant" }
      - { name: next_order_sequence, type: integer, source: system, default: 1, description: "Monotonic counter assigned to TradeOrder.sequence_number and TaxLot.sequence_number for this account" }

  - name: AccountRestriction
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the customized account" }
      - { name: security_id, type: string, source: input, description: "FK -> Security.id; the restricted instrument" }
      - { name: restriction_type, type: enum, source: input, description: "DO_NOT_BUY | DO_NOT_HOLD | MAX_POSITION" }
      - { name: max_position_bps, type: integer, source: input, default: null, description: "Cap applied when restriction_type = MAX_POSITION; must be null for the other two types", constraints: "1 <= max_position_bps <= 10000 when restriction_type = MAX_POSITION" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | LIFTED" }
      - { name: lifted_at, type: datetime, source: system, default: null, description: "Logical clock instant of the ACTIVE -> LIFTED transition" }

  - name: TradeOrder
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; the account the order belongs to" }
      - { name: security_id, type: string, source: system, description: "FK -> Security.id; the instrument traded" }
      - { name: model_version_id, type: string, source: system, description: "FK -> ModelVersion.id; the version whose sleeves produced this order" }
      - { name: block_id, type: string, source: system, default: null, description: "FK -> Block.id; set while the order is BLOCKED or ALLOCATED, cleared on cancel" }
      - { name: sequence_number, type: integer, source: system, description: "Account-scoped monotonic sequence taken from Account.next_order_sequence" }
      - { name: side, type: enum, source: system, description: "BUY | SELL" }
      - { name: shares, type: integer, source: system, description: "Absolute share count requested", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | BLOCKED | ALLOCATED | CANCELLED | STALE" }
      - { name: source, type: enum, source: system, description: "IMPLEMENTATION | REBALANCE" }
      - { name: target_shares, type: integer, source: system, description: "Post-trade target share count the generator solved for" }
      - { name: effective_weight_bps, type: integer, source: system, description: "The post-restriction effective weight in bps that produced target_shares" }
      - { name: allocated_shares, type: integer, source: system, default: 0, description: "Shares actually allocated to this order from its block" }
      - { name: fill_price_cents, type: integer, source: system, default: null, description: "Copied from Block.avg_fill_price_cents at allocation" }

  - name: Block
    parent: null
    common_fields: true
    fields:
      - { name: security_id, type: string, source: system, description: "FK -> Security.id; every member order trades this instrument" }
      - { name: side, type: enum, source: system, description: "BUY | SELL; every member order carries this side" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | FILLED | ALLOCATED" }
      - { name: requested_shares, type: integer, source: computed, default: 0, description: "Sum of shares over member TradeOrder rows in status BLOCKED or ALLOCATED" }
      - { name: filled_shares, type: integer, source: system, default: 0, description: "Street fill quantity recorded by execute" }
      - { name: allocated_shares, type: integer, source: computed, default: 0, description: "Sum of allocated_shares over member TradeOrder rows" }
      - { name: unallocated_shares, type: integer, source: computed, default: 0, description: "= filled_shares - allocated_shares; the conserved residual" }
      - { name: avg_fill_price_cents, type: integer, source: system, default: null, description: "Average street execution price recorded by execute" }
      - { name: order_count, type: integer, source: computed, default: 0, description: "Count of member TradeOrder rows in status BLOCKED or ALLOCATED" }
      - { name: executed_at, type: datetime, source: system, default: null, description: "Logical clock instant of the OPEN -> FILLED transition" }
      - { name: allocated_at, type: datetime, source: system, default: null, description: "Logical clock instant of the FILLED -> ALLOCATED transition" }

  - name: TaxLot
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owner of the lot" }
      - { name: security_id, type: string, source: system, description: "FK -> Security.id; instrument held" }
      - { name: parent_tax_lot_id, type: string, source: system, default: null, description: "FK -> TaxLot.id; set on a CLOSED slice carved out of a partially consumed parent lot" }
      - { name: opening_trade_order_id, type: string, source: system, default: null, description: "FK -> TradeOrder.id; the BUY order whose allocation opened this lot; null for transfer-in lots" }
      - { name: closing_trade_order_id, type: string, source: system, default: null, description: "FK -> TradeOrder.id; the SELL order whose allocation closed this lot; null when closed by a harvest execution or still open" }
      - { name: sequence_number, type: integer, source: system, description: "Account-scoped monotonic sequence taken from Account.next_order_sequence" }
      - { name: origin, type: enum, source: input, default: TRANSFER_IN, description: "TRANSFER_IN | TRADE — TRADE marks an acquisition that taints the wash-sale lookback" }
      - { name: open_date, type: datetime, source: system, description: "Logical clock instant the lot was acquired" }
      - { name: shares_open, type: integer, source: system, description: "Shares still held in this lot; 0 once CLOSED or REVERSED" }
      - { name: shares_closed, type: integer, source: system, default: 0, description: "Shares disposed out of this lot" }
      - { name: cost_basis_cents, type: integer, source: system, description: "Total cost basis attached to the shares currently represented by this row" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED | REVERSED" }
      - { name: realized_gain_cents, type: integer, source: system, default: null, description: "Signed proceeds minus basis on disposal; negative means a realized loss" }
      - { name: close_date, type: datetime, source: system, default: null, description: "Logical clock instant of disposal" }
      - { name: wash_window_start, type: datetime, source: system, default: null, description: "= close_date - 30 days, set only when realized_gain_cents < 0" }
      - { name: wash_window_end, type: datetime, source: system, default: null, description: "= close_date + 30 days, set only when realized_gain_cents < 0" }

  - name: HarvestProposal
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account harvesting losses" }
      - { name: security_id, type: string, source: input, description: "FK -> Security.id; the instrument being sold" }
      - { name: replacement_security_id, type: string, source: input, default: null, description: "FK -> Security.id; the proposed replacement instrument, or null" }
      - { name: shares, type: integer, source: input, description: "Shares to dispose", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | APPROVED | EXECUTED | REJECTED | SUPERSEDED" }
      - { name: quoted_price_cents, type: integer, source: system, description: "Security.last_price_cents captured at proposal creation" }
      - { name: target_loss_cents, type: integer, source: computed, description: "Signed NET realized amount over the HIFO-selected slices at quoted_price_cents; negative means a net loss" }
      - { name: proposed_loss_cents, type: integer, source: computed, description: "Absolute value of the sum of the NEGATIVE per-slice realized amounts only; gains are NOT netted against it" }
      - { name: realized_loss_cents, type: integer, source: computed, default: null, description: "Recomputed at execution against the execution-time Security.last_price_cents; may differ from proposed_loss_cents" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID that performed the PROPOSED -> APPROVED transition" }
      - { name: rejection_note, type: string, source: system, default: null, description: "Reviewer note recorded on the PROPOSED -> REJECTED transition" }
      - { name: executed_at, type: datetime, source: system, default: null, description: "Logical clock instant of the APPROVED -> EXECUTED transition" }

  - name: FeeInvoice
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the billed account" }
      - { name: period_start, type: datetime, source: input, description: "INCLUSIVE start of the billing period" }
      - { name: period_end, type: datetime, source: input, description: "EXCLUSIVE end of the billing period", constraints: "must be strictly greater than period_start" }
      - { name: billing_days, type: integer, source: computed, description: "Whole UTC days from period_start inclusive to period_end exclusive" }
      - { name: average_daily_value_cents, type: integer, source: input, description: "Average daily billable market value for the period", constraints: ">= 0" }
      - { name: tier1_fee_cents, type: integer, source: computed, description: "Prorated, independently rounded fee on the first tier slice" }
      - { name: tier2_fee_cents, type: integer, source: computed, description: "Prorated, independently rounded fee on the second tier slice" }
      - { name: tier3_fee_cents, type: integer, source: computed, description: "Prorated, independently rounded fee on the third tier slice" }
      - { name: gross_fee_cents, type: integer, source: computed, description: "= tier1_fee_cents + tier2_fee_cents + tier3_fee_cents" }
      - { name: sponsor_share_cents, type: integer, source: computed, description: "Sponsor's cut of the gross fee" }
      - { name: platform_share_cents, type: integer, source: computed, description: "Platform's cut of the gross fee" }
      - { name: manager_share_cents, type: integer, source: computed, description: "Residual cut: gross minus sponsor minus platform" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | PAID | VOIDED | WRITTEN_OFF" }
      - { name: issued_at, type: datetime, source: system, default: null, description: "Logical clock instant of the DRAFT -> ISSUED transition" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Logical clock instant of the ISSUED -> PAID transition" }
      - { name: voided_at, type: datetime, source: system, default: null, description: "Logical clock instant of the void transition" }
      - { name: void_reason, type: string, source: system, default: null, description: "Free-text reason recorded on void" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # ModelVersion — CYCLIC: PENDING_APPROVAL -> DRAFT revision loop
  # ---------------------------------------------------------------------------
  - entity: ModelVersion
    state_field: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "POST /sma/model-versions/{model_version_id}/sleeves"
        actor: PortfolioManager
        preconditions:
          - "ModelVersion.status == DRAFT"
          - "every sleeves[*].security_id resolves to an existing Security"
          - "no two sleeve entries share the same security_id"
        side_effects:
          - "replaces ModelVersion.sleeves wholesale with the supplied array"
          - "recomputes sleeve_count and total_target_weight_bps"
          - "increments ModelVersion.version by 1"

      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /sma/model-versions/{model_version_id}/submit"
        actor: PortfolioManager
        preconditions:
          - "ModelVersion.status == DRAFT"
          - "ModelVersion.sleeve_count >= 1"
          - "ModelVersion.total_target_weight_bps == 10000 exactly (else ERR_WEIGHTS_NOT_BALANCED)"
        side_effects:
          - "sets submitted_by_user_id = X-User-ID of this request"
          - "clears rejection_note to null"
          - "increments ModelVersion.version by 1"

      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /sma/model-versions/{model_version_id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "ModelVersion.status == PENDING_APPROVAL"
          - "X-User-ID != ModelVersion.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets approved_by_user_id = X-User-ID of this request"
          - "version-pins the sleeves array: no further sleeve edit is reachable from APPROVED"
          - "increments ModelVersion.version by 1"

      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /sma/model-versions/{model_version_id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "ModelVersion.status == PENDING_APPROVAL"
          - "X-User-ID != ModelVersion.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets rejection_note to the supplied text"
          - "clears submitted_by_user_id to null so the revision may be resubmitted by anyone"
          - "increments ModelVersion.version by 1"
        note: "This edge closes the revision cycle DRAFT -> PENDING_APPROVAL -> DRAFT. Sleeves become editable again."

      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /sma/model-versions/{model_version_id}/publish"
        actor: PortfolioManager
        preconditions:
          - "ModelVersion.status == APPROVED"
        side_effects:
          - "CASCADE-A HOP 1: sets published_at = current logical clock; sets Model.published_model_version_id = this ModelVersion.id; increments ModelVersion.version by 1"
          - "CASCADE-A HOP 2 (caused by HOP 1 only, because a Model may hold at most one PUBLISHED version): the sibling ModelVersion of the same Model previously in status PUBLISHED transitions PUBLISHED -> SUPERSEDED with superseded_at = clock"
          - "CASCADE-A HOP 3 (caused by HOP 2 only, because a distribution may not carry a superseded version): every SponsorDistribution with model_version_id = the superseded version and status = ACTIVE transitions ACTIVE -> LAPSED with lapsed_at = clock"
          - "CASCADE-A HOP 4 (caused by HOP 3 only, because the account's feed just lapsed): every Account whose sponsor_id appears among the lapsed distributions AND whose current_model_version_id = the superseded version AND whose implementation_status IN {SYNCED, DRIFTED} transitions to PENDING_IMPLEMENTATION, sets pending_model_version_id = the newly published version, notified_at = clock, implementation_deadline = clock + Sponsor.implementation_lag_days days, implemented_late = false. Accounts in SUSPENDED or PENDING_IMPLEMENTATION are skipped (conditional cascade)."
          - "CASCADE-A HOP 5 (caused by HOP 4 only, because the account's targets are now stale): every TradeOrder of those accounts with model_version_id = the superseded version and status IN {PROPOSED, BLOCKED} transitions to STALE, clears block_id, and its Block recomputes requested_shares and order_count"

  # ---------------------------------------------------------------------------
  # SponsorDistribution — guarded linear with cascade-driven LAPSED
  # ---------------------------------------------------------------------------
  - entity: SponsorDistribution
    state_field: status
    shape: guarded
    initial_state: PENDING
    terminal_states: [LAPSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /sma/sponsor-distributions/{sponsor_distribution_id}/activate"
        actor: SponsorOperator
        preconditions:
          - "SponsorDistribution.status == PENDING"
          - "X-User-ID == SponsorDistribution.sponsor_id"
          - "the referenced ModelVersion.status == PUBLISHED (else ERR_MODEL_VERSION_NOT_PUBLISHED)"
        side_effects:
          - "sets activated_at = current logical clock"
          - "increments SponsorDistribution.version by 1"
        note: "Cross-entity guard: SponsorDistribution's own transition is gated on ModelVersion.status."

      - from: ACTIVE
        to: LAPSED
        trigger: "system event: CASCADE-A HOP 3 of POST /sma/model-versions/{model_version_id}/publish"
        actor: system
        preconditions:
          - "the distribution's model_version_id equals the ModelVersion that just transitioned PUBLISHED -> SUPERSEDED"
        side_effects:
          - "sets lapsed_at = current logical clock"
          - "increments SponsorDistribution.version by 1"
          - "triggers CASCADE-A HOP 4 on every Account fed by this distribution"

  # ---------------------------------------------------------------------------
  # Account — PARALLEL DIMENSION 1 of 2: implementation_status
  # ---------------------------------------------------------------------------
  - entity: Account
    state_field: implementation_status
    shape: parallel
    initial_state: SYNCED
    terminal_states: []
    note: "This dimension evolves independently of billing_status; the only coupling point is CASCADE-C HOP 3."
    transitions:
      - from: SYNCED
        to: DRIFTED
        trigger: "POST /sma/accounts/{account_id}/drift-evaluations"
        actor: SponsorOperator
        preconditions:
          - "Account.implementation_status == SYNCED"
          - "Account.billing_status != WRITTEN_OFF"
          - "the evaluated drift_bps >= Model.drift_threshold_bps (inclusive comparison)"
        side_effects:
          - "sets drift_bps, drift_basis_used and drift_evaluated_at"
          - "increments Account.version by 1"

      - from: DRIFTED
        to: SYNCED
        trigger: "POST /sma/accounts/{account_id}/drift-evaluations"
        actor: SponsorOperator
        preconditions:
          - "Account.implementation_status == DRIFTED"
          - "the evaluated drift_bps < Model.drift_threshold_bps"
        side_effects:
          - "sets drift_bps, drift_basis_used and drift_evaluated_at"
          - "increments Account.version by 1"
        note: "Closes the DRIFTED -> SYNCED -> DRIFTED monitoring cycle."

      - from: DRIFTED
        to: DRIFTED
        trigger: "POST /sma/accounts/{account_id}/rebalances"
        actor: SponsorOperator
        preconditions:
          - "Account.implementation_status == DRIFTED (else ERR_ACCOUNT_NOT_DRIFTED)"
          - "Account.billing_status != WRITTEN_OFF"
          - "Account.current_model_version_id is not null"
          - "the generation produced at least one TradeOrder (else ERR_NO_TRADES_GENERATED)"
        side_effects:
          - "creates one PROPOSED TradeOrder per security with a tradable delta, source = REBALANCE, model_version_id = current_model_version_id"
          - "advances Account.next_order_sequence by the number of orders created"
          - "increments Account.version by 1"

      - from: SYNCED
        to: PENDING_IMPLEMENTATION
        trigger: "system event: CASCADE-A HOP 4 of POST /sma/model-versions/{model_version_id}/publish"
        actor: system
        preconditions:
          - "an ACTIVE SponsorDistribution feeding this account just transitioned to LAPSED"
          - "Account.current_model_version_id == the superseded ModelVersion.id"
        side_effects:
          - "sets pending_model_version_id, notified_at, implementation_deadline, implemented_late = false"
          - "increments Account.version by 1"
          - "triggers CASCADE-A HOP 5 on this account's PROPOSED and BLOCKED TradeOrders"

      - from: DRIFTED
        to: PENDING_IMPLEMENTATION
        trigger: "system event: CASCADE-A HOP 4 of POST /sma/model-versions/{model_version_id}/publish"
        actor: system
        preconditions:
          - "an ACTIVE SponsorDistribution feeding this account just transitioned to LAPSED"
          - "Account.current_model_version_id == the superseded ModelVersion.id"
        side_effects:
          - "identical to the SYNCED -> PENDING_IMPLEMENTATION edge; the pending drift result is retained in drift_bps but no longer gates rebalancing"
          - "increments Account.version by 1"

      - from: PENDING_IMPLEMENTATION
        to: SYNCED
        trigger: "POST /sma/accounts/{account_id}/implementations"
        actor: SponsorOperator
        preconditions:
          - "Account.implementation_status == PENDING_IMPLEMENTATION"
          - "Account.billing_status != WRITTEN_OFF"
          - "a SponsorDistribution exists with sponsor_id = Account.sponsor_id, model_version_id = Account.pending_model_version_id, status = ACTIVE, and effective_from <= clock < effective_until (or effective_until is null) — else ERR_DISTRIBUTION_NOT_ACTIVE"
          - "Account.market_value_cents >= Sponsor.min_account_value_cents (else ERR_BELOW_SPONSOR_MINIMUM)"
          - "the generation produced at least one TradeOrder (else ERR_NO_TRADES_GENERATED)"
        side_effects:
          - "sets current_model_version_id = pending_model_version_id, then clears pending_model_version_id to null"
          - "sets last_implementation_lag_days = whole UTC days between notified_at and clock"
          - "sets implemented_late = true when clock > implementation_deadline, else false"
          - "creates one PROPOSED TradeOrder per security with a tradable delta, source = IMPLEMENTATION, model_version_id = the newly current version"
          - "advances Account.next_order_sequence by the number of orders created"
          - "increments Account.version by 1"

      - from: SYNCED
        to: SUSPENDED
        trigger: "POST /sma/accounts/{account_id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "Account.implementation_status IN {SYNCED, DRIFTED, PENDING_IMPLEMENTATION}"
        side_effects:
          - "increments Account.version by 1"

      - from: DRIFTED
        to: SUSPENDED
        trigger: "POST /sma/accounts/{account_id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "Account.implementation_status IN {SYNCED, DRIFTED, PENDING_IMPLEMENTATION}"
        side_effects:
          - "increments Account.version by 1"

      - from: PENDING_IMPLEMENTATION
        to: SUSPENDED
        trigger: "POST /sma/accounts/{account_id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "Account.implementation_status IN {SYNCED, DRIFTED, PENDING_IMPLEMENTATION}"
        side_effects:
          - "pending_model_version_id, notified_at and implementation_deadline are retained unchanged"
          - "increments Account.version by 1"

      - from: SUSPENDED
        to: SYNCED
        trigger: "POST /sma/accounts/{account_id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "Account.implementation_status == SUSPENDED"
          - "Account.billing_status != WRITTEN_OFF (else ERR_ACCOUNT_WRITTEN_OFF)"
          - "Account.pending_model_version_id is null"
        side_effects:
          - "increments Account.version by 1"

      - from: SUSPENDED
        to: PENDING_IMPLEMENTATION
        trigger: "POST /sma/accounts/{account_id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "Account.implementation_status == SUSPENDED"
          - "Account.billing_status != WRITTEN_OFF"
          - "Account.pending_model_version_id is not null"
        side_effects:
          - "increments Account.version by 1"
        note: "Reinstatement returns the account to whichever implementation state its pending pointer implies."

      - from: SYNCED
        to: SUSPENDED
        trigger: "system event: CASCADE-C HOP 3 of POST /sma/fee-invoices/{fee_invoice_id}/write-off"
        actor: system
        preconditions:
          - "Account.billing_status just transitioned DELINQUENT -> WRITTEN_OFF"
        side_effects:
          - "triggers CASCADE-C HOP 4 on this account's PROPOSED and BLOCKED TradeOrders"
          - "increments Account.version by 1"
        note: "The ONLY edge that couples the billing dimension into the implementation dimension."

  # ---------------------------------------------------------------------------
  # Account — PARALLEL DIMENSION 2 of 2: billing_status
  # ---------------------------------------------------------------------------
  - entity: Account
    state_field: billing_status
    shape: parallel
    initial_state: CURRENT
    terminal_states: [WRITTEN_OFF]
    note: "This dimension evolves independently of implementation_status; a SUSPENDED account still bills, and a DELINQUENT account still trades."
    transitions:
      - from: CURRENT
        to: INVOICED
        trigger: "POST /sma/fee-invoices/{fee_invoice_id}/issue"
        actor: BillingOfficer
        preconditions:
          - "Account.billing_status == CURRENT"
          - "FeeInvoice.status == DRAFT"
        side_effects:
          - "adds FeeInvoice.gross_fee_cents to Account.fees_billed_ytd_cents"
          - "increments Account.version by 1"

      - from: INVOICED
        to: CURRENT
        trigger: "POST /sma/fee-invoices/{fee_invoice_id}/pay"
        actor: BillingOfficer
        preconditions:
          - "Account.billing_status IN {INVOICED, DELINQUENT}"
          - "FeeInvoice.status == ISSUED"
          - "Account.cash_cents >= FeeInvoice.gross_fee_cents (else ERR_INSUFFICIENT_CASH)"
        side_effects:
          - "debits Account.cash_cents by gross_fee_cents"
          - "increments Account.version by 1"

      - from: INVOICED
        to: CURRENT
        trigger: "POST /sma/fee-invoices/{fee_invoice_id}/void"
        actor: BillingOfficer
        preconditions:
          - "FeeInvoice.status == ISSUED"
        side_effects:
          - "COMPENSATION: subtracts FeeInvoice.gross_fee_cents from Account.fees_billed_ytd_cents, restoring the pre-issue value exactly"
          - "increments Account.version by 1"

      - from: INVOICED
        to: DELINQUENT
        trigger: "POST /sma/fee-invoices/{fee_invoice_id}/mark-delinquent"
        actor: BillingOfficer
        preconditions:
          - "Account.billing_status == INVOICED"
          - "FeeInvoice.status == ISSUED"
          - "current logical clock >= FeeInvoice.period_end + 30 days (else ERR_PAYMENT_TERM_NOT_ELAPSED)"
        side_effects:
          - "increments Account.version by 1"

      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /sma/fee-invoices/{fee_invoice_id}/pay"
        actor: BillingOfficer
        preconditions:
          - "Account.billing_status == DELINQUENT"
          - "FeeInvoice.status == ISSUED"
          - "Account.cash_cents >= FeeInvoice.gross_fee_cents"
        side_effects:
          - "debits Account.cash_cents by gross_fee_cents"
          - "increments Account.version by 1"

      - from: DELINQUENT
        to: WRITTEN_OFF
        trigger: "POST /sma/fee-invoices/{fee_invoice_id}/write-off"
        actor: BillingOfficer
        preconditions:
          - "Account.billing_status == DELINQUENT"
          - "FeeInvoice.status == ISSUED"
        side_effects:
          - "CASCADE-C HOP 1: FeeInvoice transitions ISSUED -> WRITTEN_OFF"
          - "CASCADE-C HOP 2 (caused by HOP 1 only): Account.billing_status transitions DELINQUENT -> WRITTEN_OFF"
          - "CASCADE-C HOP 3 (caused by HOP 2 only, because a written-off account may not keep trading): Account.implementation_status transitions to SUSPENDED regardless of its prior value"
          - "CASCADE-C HOP 4 (caused by HOP 3 only): every TradeOrder of this account with status IN {PROPOSED, BLOCKED} transitions to CANCELLED, clears block_id, and its Block recomputes requested_shares and order_count"
          - "Account.fees_billed_ytd_cents is NOT reduced — a written-off fee stays billed"
          - "increments Account.version by 1"

  # ---------------------------------------------------------------------------
  # AccountRestriction — linear
  # ---------------------------------------------------------------------------
  - entity: AccountRestriction
    state_field: status
    shape: linear
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /sma/account-restrictions/{account_restriction_id}/lift"
        actor: ComplianceOfficer
        preconditions:
          - "AccountRestriction.status == ACTIVE"
        side_effects:
          - "sets lifted_at = current logical clock"
          - "the restriction stops participating in effective-weight computation from the next generation onward"
          - "increments AccountRestriction.version by 1"

  # ---------------------------------------------------------------------------
  # TradeOrder — CYCLIC: BLOCKED -> ALLOCATED -> BLOCKED via block unwind
  # ---------------------------------------------------------------------------
  - entity: TradeOrder
    state_field: status
    shape: cyclic
    initial_state: PROPOSED
    terminal_states: [CANCELLED, STALE]
    transitions:
      - from: PROPOSED
        to: BLOCKED
        trigger: "POST /sma/blocks"
        actor: SponsorOperator
        preconditions:
          - "TradeOrder.status == PROPOSED"
          - "all listed orders share one security_id and one side (else ERR_BLOCK_COMPOSITION_INVALID)"
          - "the order's Account.implementation_status != SUSPENDED (else ERR_ACCOUNT_SUSPENDED)"
          - "for a BUY: the security is not restricted for that account (else ERR_SECURITY_RESTRICTED)"
          - "for a BUY: no CLOSED TaxLot of (account, security) with realized_gain_cents < 0 has a wash window covering the current clock date (else ERR_WASH_SALE_WINDOW_CONFLICT)"
        side_effects:
          - "sets block_id on the order"
          - "Block.requested_shares and Block.order_count recomputed"
          - "increments TradeOrder.version by 1"

      - from: BLOCKED
        to: ALLOCATED
        trigger: "POST /sma/blocks/{block_id}/allocate"
        actor: PlatformAdmin
        preconditions:
          - "Block.status == FILLED"
          - "TradeOrder.status == BLOCKED"
          - "every member order's Account.implementation_status != SUSPENDED"
          - "for a BUY: the member account's cash_cents covers its allocation cost (else ERR_INSUFFICIENT_CASH)"
        side_effects:
          - "CASCADE-B HOP 1: sets allocated_shares from the pro-rata waterfall and fill_price_cents = Block.avg_fill_price_cents"
          - "CASCADE-B HOP 2 (caused by HOP 1 only, because shares actually changed hands): a BUY opens a TaxLot with origin = TRADE and debits Account.cash_cents; a SELL closes OPEN lots HIFO, splitting a partially consumed lot into a CLOSED slice with parent_tax_lot_id, and credits Account.cash_cents"
          - "CASCADE-B HOP 3 (caused by HOP 2 only, because a disposal produced a negative realized amount): each CLOSED slice with realized_gain_cents < 0 stamps wash_window_start = close_date - 30 days and wash_window_end = close_date + 30 days, and Account.realized_loss_ytd_cents increases by the absolute value of that slice's loss"
          - "an order whose pro-rata allocation resolves to 0 shares transitions to CANCELLED instead of ALLOCATED"
          - "increments TradeOrder.version by 1"

      - from: ALLOCATED
        to: BLOCKED
        trigger: "POST /sma/blocks/{block_id}/unwind"
        actor: PlatformAdmin
        preconditions:
          - "Block.status == ALLOCATED"
          - "every TaxLot whose opening_trade_order_id is a member order is still in status OPEN (else ERR_UNWIND_BLOCKED)"
        side_effects:
          - "COMPENSATION: resets allocated_shares to 0 and fill_price_cents to null"
          - "each TaxLot opened by this allocation transitions OPEN -> REVERSED with shares_open = 0, and Account.cash_cents is credited back by that lot's cost_basis_cents"
          - "each TaxLot closed by this allocation is restored: an in-place close returns to OPEN with shares_open = shares_closed, shares_closed = 0, realized_gain_cents = null, close_date = null, wash_window_start = null, wash_window_end = null; a split slice transitions to REVERSED and its parent lot regains the slice's shares_closed and cost_basis_cents"
          - "Account.realized_loss_ytd_cents is decreased by exactly the amount CASCADE-B HOP 3 added"
          - "increments TradeOrder.version by 1"
        note: "Closes the BLOCKED -> ALLOCATED -> BLOCKED cycle."

      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /sma/trade-orders/{trade_order_id}/cancel"
        actor: SponsorOperator
        preconditions:
          - "TradeOrder.status == PROPOSED"
        side_effects:
          - "increments TradeOrder.version by 1"

      - from: BLOCKED
        to: CANCELLED
        trigger: "POST /sma/trade-orders/{trade_order_id}/cancel"
        actor: SponsorOperator
        preconditions:
          - "TradeOrder.status == BLOCKED"
          - "the owning Block.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "clears block_id and recomputes Block.requested_shares and Block.order_count"
          - "increments TradeOrder.version by 1"

      - from: PROPOSED
        to: STALE
        trigger: "system event: CASCADE-A HOP 5 of POST /sma/model-versions/{model_version_id}/publish"
        actor: system
        preconditions:
          - "the owning Account just entered PENDING_IMPLEMENTATION"
          - "TradeOrder.model_version_id == the superseded ModelVersion.id"
        side_effects:
          - "increments TradeOrder.version by 1"

      - from: BLOCKED
        to: STALE
        trigger: "system event: CASCADE-A HOP 5 of POST /sma/model-versions/{model_version_id}/publish"
        actor: system
        preconditions:
          - "the owning Account just entered PENDING_IMPLEMENTATION"
          - "TradeOrder.model_version_id == the superseded ModelVersion.id"
        side_effects:
          - "clears block_id and recomputes Block.requested_shares and Block.order_count"
          - "increments TradeOrder.version by 1"

      - from: PROPOSED
        to: CANCELLED
        trigger: "system event: CASCADE-C HOP 4 of POST /sma/fee-invoices/{fee_invoice_id}/write-off"
        actor: system
        preconditions:
          - "the owning Account just entered implementation_status SUSPENDED via the write-off cascade"
        side_effects:
          - "increments TradeOrder.version by 1"

      - from: BLOCKED
        to: CANCELLED
        trigger: "system event: CASCADE-C HOP 4 of POST /sma/fee-invoices/{fee_invoice_id}/write-off"
        actor: system
        preconditions:
          - "the owning Account just entered implementation_status SUSPENDED via the write-off cascade"
        side_effects:
          - "clears block_id and recomputes Block.requested_shares and Block.order_count"
          - "increments TradeOrder.version by 1"

  # ---------------------------------------------------------------------------
  # Block — CYCLIC: FILLED -> ALLOCATED -> FILLED via unwind
  # ---------------------------------------------------------------------------
  - entity: Block
    state_field: status
    shape: cyclic
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: FILLED
        trigger: "POST /sma/blocks/{block_id}/execute"
        actor: PlatformAdmin
        preconditions:
          - "Block.status == OPEN"
          - "Block.order_count >= 1"
          - "1 <= filled_shares <= Block.requested_shares (else ERR_FILL_EXCEEDS_REQUEST)"
        side_effects:
          - "records filled_shares, avg_fill_price_cents and executed_at"
          - "unallocated_shares becomes filled_shares (allocated_shares is still 0), preserving filled_shares == allocated_shares + unallocated_shares"
          - "increments Block.version by 1"

      - from: FILLED
        to: ALLOCATED
        trigger: "POST /sma/blocks/{block_id}/allocate"
        actor: PlatformAdmin
        preconditions:
          - "Block.status == FILLED"
        side_effects:
          - "drives CASCADE-B on every member order (see TradeOrder BLOCKED -> ALLOCATED)"
          - "sets allocated_at, recomputes allocated_shares and unallocated_shares"
          - "increments Block.version by 1"

      - from: ALLOCATED
        to: FILLED
        trigger: "POST /sma/blocks/{block_id}/unwind"
        actor: PlatformAdmin
        preconditions:
          - "Block.status == ALLOCATED"
          - "every TaxLot opened by this block is still OPEN (else ERR_UNWIND_BLOCKED)"
        side_effects:
          - "COMPENSATION: clears allocated_at, recomputes allocated_shares to 0 and unallocated_shares back to filled_shares"
          - "increments Block.version by 1"
        note: "Closes the FILLED -> ALLOCATED -> FILLED cycle; filled_shares == allocated_shares + unallocated_shares holds at every point of the round trip."

  # ---------------------------------------------------------------------------
  # TaxLot — branching with compensating REVERSED branch
  # ---------------------------------------------------------------------------
  - entity: TaxLot
    state_field: status
    shape: branching
    initial_state: OPEN
    terminal_states: [REVERSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /sma/blocks/{block_id}/allocate (SELL side) or POST /sma/harvest-proposals/{harvest_proposal_id}/execute"
        actor: system
        preconditions:
          - "TaxLot.status == OPEN"
          - "the lot is selected by the HIFO disposal walk"
        side_effects:
          - "sets shares_closed, shares_open = 0, realized_gain_cents, close_date, and closing_trade_order_id when driven by an allocation"
          - "when realized_gain_cents < 0 also sets wash_window_start and wash_window_end"
          - "increments TaxLot.version by 1"

      - from: OPEN
        to: OPEN
        trigger: "POST /sma/blocks/{block_id}/allocate (SELL side, partial consumption) or POST /sma/harvest-proposals/{harvest_proposal_id}/execute"
        actor: system
        preconditions:
          - "the HIFO walk consumes strictly fewer shares than TaxLot.shares_open"
        side_effects:
          - "reduces shares_open and cost_basis_cents by the consumed portion"
          - "creates a NEW TaxLot row in status CLOSED with parent_tax_lot_id pointing at this lot, carrying the consumed shares, the carved basis, realized_gain_cents and the wash window"
          - "increments TaxLot.version by 1"

      - from: OPEN
        to: REVERSED
        trigger: "POST /sma/blocks/{block_id}/unwind"
        actor: system
        preconditions:
          - "the lot's opening_trade_order_id is a member order of the unwound block"
        side_effects:
          - "COMPENSATION: sets shares_open = 0 and credits Account.cash_cents by cost_basis_cents"
          - "increments TaxLot.version by 1"

      - from: CLOSED
        to: OPEN
        trigger: "POST /sma/blocks/{block_id}/unwind"
        actor: system
        preconditions:
          - "the lot was closed IN PLACE (parent_tax_lot_id is null) by a member order of the unwound block"
        side_effects:
          - "COMPENSATION: shares_open = shares_closed, shares_closed = 0, realized_gain_cents = null, close_date = null, wash windows cleared"
          - "increments TaxLot.version by 1"

      - from: CLOSED
        to: REVERSED
        trigger: "POST /sma/blocks/{block_id}/unwind"
        actor: system
        preconditions:
          - "the lot is a split slice (parent_tax_lot_id is not null) produced by a member order of the unwound block"
        side_effects:
          - "COMPENSATION: the parent lot regains this slice's shares_closed and cost_basis_cents"
          - "increments TaxLot.version by 1"

  # ---------------------------------------------------------------------------
  # HarvestProposal — BRANCHING fork with divergent side-effect sets
  # ---------------------------------------------------------------------------
  - entity: HarvestProposal
    state_field: status
    shape: branching
    initial_state: PROPOSED
    terminal_states: [EXECUTED, REJECTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /sma/harvest-proposals/{harvest_proposal_id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "HarvestProposal.status == PROPOSED"
          - "Account.implementation_status != SUSPENDED"
        side_effects:
          - "sets approved_by_user_id = X-User-ID"
          - "increments HarvestProposal.version by 1"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /sma/harvest-proposals/{harvest_proposal_id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "HarvestProposal.status == PROPOSED"
        side_effects:
          - "sets rejection_note; realized_loss_cents stays null; NO tax lot is touched"
          - "increments HarvestProposal.version by 1"
        note: "Divergent branch: reject writes only rejection_note, approve writes only approved_by_user_id."

      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system event: POST /sma/harvest-proposals creating a newer proposal for the same (account_id, security_id)"
        actor: system
        preconditions:
          - "an existing HarvestProposal for the same (account_id, security_id) is in status PROPOSED"
        side_effects:
          - "increments HarvestProposal.version by 1"
        note: "Third branch out of PROPOSED; this is the supersede semantics the OCC rule harvest-create-stale-account guards."

      - from: APPROVED
        to: EXECUTED
        trigger: "POST /sma/harvest-proposals/{harvest_proposal_id}/execute"
        actor: PortfolioManager
        preconditions:
          - "HarvestProposal.status == APPROVED"
          - "Account.implementation_status != SUSPENDED"
          - "the account still holds at least HarvestProposal.shares OPEN shares of the security (else ERR_INSUFFICIENT_SHARES)"
          - "Account.realized_loss_ytd_cents + the re-evaluated loss <= Account.harvest_budget_cents (else ERR_HARVEST_BUDGET_EXCEEDED)"
        side_effects:
          - "re-runs the HIFO disposal walk against the EXECUTION-time Security.last_price_cents, closing or splitting lots exactly as the SELL allocation path does"
          - "sets realized_loss_cents to the re-evaluated per-slice loss total, which may differ from proposed_loss_cents"
          - "credits Account.cash_cents by shares * execution-time last_price_cents"
          - "increments Account.realized_loss_ytd_cents by realized_loss_cents"
          - "stamps wash_window_start / wash_window_end on every closed slice whose realized_gain_cents < 0"
          - "sets executed_at = current logical clock"
          - "increments HarvestProposal.version by 1 and Account.version by 1"

  # ---------------------------------------------------------------------------
  # FeeInvoice — branching with compensating VOIDED branch
  # ---------------------------------------------------------------------------
  - entity: FeeInvoice
    state_field: status
    shape: branching
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /sma/fee-invoices/{fee_invoice_id}/issue"
        actor: BillingOfficer
        preconditions:
          - "FeeInvoice.status == DRAFT"
          - "Account.billing_status == CURRENT (else ERR_INVALID_STATE)"
          - "Account.billing_status != WRITTEN_OFF"
        side_effects:
          - "sets issued_at; adds gross_fee_cents to Account.fees_billed_ytd_cents; Account.billing_status CURRENT -> INVOICED"
          - "increments FeeInvoice.version by 1"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /sma/fee-invoices/{fee_invoice_id}/void"
        actor: BillingOfficer
        preconditions:
          - "FeeInvoice.status == DRAFT"
        side_effects:
          - "sets voided_at and void_reason; Account.fees_billed_ytd_cents unchanged (nothing was ever added)"
          - "increments FeeInvoice.version by 1"

      - from: ISSUED
        to: VOIDED
        trigger: "POST /sma/fee-invoices/{fee_invoice_id}/void"
        actor: BillingOfficer
        preconditions:
          - "FeeInvoice.status == ISSUED"
        side_effects:
          - "COMPENSATION: subtracts gross_fee_cents from Account.fees_billed_ytd_cents, restoring the exact pre-issue value; Account.billing_status returns to CURRENT"
          - "sets voided_at and void_reason"
          - "increments FeeInvoice.version by 1"

      - from: ISSUED
        to: PAID
        trigger: "POST /sma/fee-invoices/{fee_invoice_id}/pay"
        actor: BillingOfficer
        preconditions:
          - "FeeInvoice.status == ISSUED"
          - "Account.cash_cents >= gross_fee_cents (else ERR_INSUFFICIENT_CASH)"
        side_effects:
          - "sets paid_at; debits Account.cash_cents by gross_fee_cents; Account.billing_status returns to CURRENT"
          - "Account.fees_billed_ytd_cents is NOT changed by payment"
          - "increments FeeInvoice.version by 1"

      - from: ISSUED
        to: WRITTEN_OFF
        trigger: "POST /sma/fee-invoices/{fee_invoice_id}/write-off"
        actor: BillingOfficer
        preconditions:
          - "FeeInvoice.status == ISSUED"
          - "Account.billing_status == DELINQUENT (else ERR_INVALID_STATE)"
        side_effects:
          - "drives CASCADE-C HOPS 1-4 (see Account.billing_status DELINQUENT -> WRITTEN_OFF)"
          - "increments FeeInvoice.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's version only
# =============================================================================
concurrency_rules:
  - rule_id: distribution-create-stale-model-version
    parent_entity: ModelVersion
    write_endpoint: "POST /sma/sponsor-distributions"
    occ_field: "expected_model_version_version"
    description: |
      Creating a SponsorDistribution against a ModelVersion whose version has
      advanced since the client last observed it is rejected. Distributing the
      same version to an additional sponsor is a legitimate operation, so the
      write cannot be rejected by any state precondition; the only thing that
      makes the second write wrong is that the client's view of the model
      version — including its distribution_count and its publication state — is
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: harvest-create-stale-account
    parent_entity: Account
    write_endpoint: "POST /sma/harvest-proposals"
    occ_field: "expected_account_version"
    description: |
      Creating a HarvestProposal against an Account whose version has advanced
      since the client last observed it is rejected. A newer proposal for the
      same (account_id, security_id) legitimately supersedes the prior PROPOSED
      one, so a later write observing the same account state would itself
      succeed; the stale-version check is what distinguishes a deliberate
      re-proposal from one computed against an out-of-date lot ledger.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  - name: effective_sleeve_weights
    trigger: "runs inside POST /sma/accounts/{account_id}/rebalances and POST /sma/accounts/{account_id}/implementations, before trade_order_generation"
    algorithm: constraint_propagation
    formula: |
      # Inputs: the driving ModelVersion.sleeves, and the Account's
      # AccountRestriction rows with status == ACTIVE.
      # Output: eff[s] in integer basis points for every sleeve security s,
      # plus cash_target_bps. Sum(eff) + cash_target_bps == 10000 exactly.

      base[s]  = sleeve.target_weight_bps
      excluded = { s : an ACTIVE AccountRestriction exists on (account, s.security_id)
                       with restriction_type IN {DO_NOT_BUY, DO_NOT_HOLD} }
      cap[s]   = min( sleeve.max_position_bps,
                      max_position_bps of the ACTIVE MAX_POSITION restriction on
                      (account, s.security_id) if one exists else 10000 )

      for s in excluded: eff[s] = 0 ; pinned.add(s)

      # ORDER IS PINNED. The value of eff[s] depends on `residual`, `residual`
      # depends on which securities are pinned, and which securities become
      # pinned depends on eff[s]. The loop below is the ONLY admissible
      # evaluation order; it terminates after at most CAP_PASSES passes.
      for pass in 1 .. CAP_PASSES:                      # CAP_PASSES = 3
          free     = [ s not in pinned ], ordered by Security.ticker ASC
          if free is empty: break
          residual = 10000 - sum( eff[s] for s in pinned )
          pool     = sum( base[s] for s in free )
          for s in free: eff[s] = floor( residual * base[s] / pool )
          remainder = residual - sum( eff[s] for s in free )
          # hand out the remainder one basis point at a time, walking `free`
          # in Security.ticker ASC order, wrapping if remainder > len(free)
          for k in 0 .. remainder-1: eff[ free[ k mod len(free) ] ] += 1
          breached = [ s in free : eff[s] > cap[s] ]
          if breached is empty: break
          for s in breached: eff[s] = cap[s] ; pinned.add(s)

      cash_target_bps = 10000 - sum( eff[s] over all sleeve securities )
    input_set: "sleeves of Account.current_model_version_id for a rebalance, or of Account.pending_model_version_id for an implementation; AccountRestriction rows with status == ACTIVE only — LIFTED restrictions are ignored"
    constants:
      CAP_PASSES: 3
      TOTAL_BPS: 10000
    precision: "integer basis points; floor on the pro-rata division, remainder distributed one bps at a time in Security.ticker ASC order"
    variants: []

  # ---------------------------------------------------------------------------
  - name: trade_order_generation
    trigger: "POST /sma/accounts/{account_id}/rebalances (source = REBALANCE) and POST /sma/accounts/{account_id}/implementations (source = IMPLEMENTATION)"
    algorithm: threshold
    formula: |
      mv               = Account.market_value_cents
      cash_reserve     = max( MIN_CASH_RESERVE_CENTS,
                              floor( mv * Account.cash_reserve_bps / 10000 ) )
      investable       = mv - cash_reserve
      generation_set   = { securities in the driving ModelVersion.sleeves }
                         UNION
                         { securities with a non-zero settled position, i.e. a
                           TaxLot with status OPEN and shares_open > 0 }
      for s in generation_set, walked in Security.ticker ASC order:
          e                = eff[s] from effective_sleeve_weights, 0 if s has no sleeve
          target_shares[s] = floor( floor( investable * e / 10000 )
                                    / Security.last_price_cents )
          current[s]       = sum of shares_open over OPEN TaxLots of (account, s)
          delta            = target_shares[s] - current[s]
          if abs(delta) * Security.last_price_cents < MIN_TRADE_CENTS: skip s
          create TradeOrder{ side = BUY if delta > 0 else SELL,
                             shares = abs(delta),
                             target_shares = target_shares[s],
                             effective_weight_bps = e,
                             sequence_number = Account.next_order_sequence++ }
      if no TradeOrder was created: reject with ERR_NO_TRADES_GENERATED
    input_set: "settled positions only (TaxLot.status == OPEN); PROPOSED / BLOCKED / ALLOCATED TradeOrder rows do NOT reduce the delta, so back-to-back generations are additive by design"
    constants:
      MIN_CASH_RESERVE_CENTS: 10000
      MIN_TRADE_CENTS: 5000
    precision: "integer shares; the two floors are applied in the order written — cents first, then shares. Rounding to shares before applying the weight is NOT admissible."
    variants: []

  # ---------------------------------------------------------------------------
  - name: account_drift_bps
    trigger: "POST /sma/accounts/{account_id}/drift-evaluations"
    algorithm: weighted_scoring
    formula: |
      # positions[] and cash are supplied by the selected variant below.
      mv = cash + sum over s of ( positions[s] * Security.last_price_cents )
      for s in ( sleeve securities of Account.current_model_version_id
                 UNION securities with positions[s] != 0 ):
          actual_bps[s] = round_half_up( positions[s] * Security.last_price_cents
                                         * 10000 / mv )
          deviation[s]  = abs( actual_bps[s] - eff[s] )   # eff from effective_sleeve_weights
      drift_bps = max over s of deviation[s]
      # cash is deliberately EXCLUDED from the deviation scan.
      breached  = ( drift_bps >= Model.drift_threshold_bps )   # INCLUSIVE
    input_set: "sleeve securities of Account.current_model_version_id plus every security with a non-zero position under the selected variant"
    constants:
      TOTAL_BPS: 10000
    precision: "round_half_up to integer basis points per position BEFORE the deviation is taken; taking the deviation on unrounded weights is NOT admissible"
    variants:
      - name: SETTLED
        when: "the `basis` request field is SETTLED, or is omitted and Account.drift_basis == SETTLED"
        difference: "positions[s] = sum of shares_open over TaxLot rows of (account, s) with status == OPEN; cash = Account.cash_cents. Open orders are invisible."
      - name: TRADE_DATE
        when: "the `basis` request field is TRADE_DATE, or is omitted and Account.drift_basis == TRADE_DATE"
        difference: |
          positions[s] = the SETTLED shares plus the signed pending delta from
          every TradeOrder of the account with status IN {PROPOSED, BLOCKED}
          (+shares for BUY, -shares for SELL);
          cash = Account.cash_cents
                 - sum( BUY shares * Security.last_price_cents )
                 + sum( SELL shares * Security.last_price_cents )
          over those same orders. Identical stored data therefore yields a
          different drift_bps under the two variants.

  # ---------------------------------------------------------------------------
  - name: block_pro_rata_allocation
    trigger: "POST /sma/blocks/{block_id}/allocate"
    algorithm: waterfall_allocation
    formula: |
      F      = Block.filled_shares
      orders = member TradeOrder rows with status == BLOCKED
      R      = sum( o.shares for o in orders )
      for o in orders: alloc[o] = floor( F * o.shares / R )
      remainder = F - sum( alloc[o] )
      # remainder is handed out one whole share at a time, walking the orders
      # sorted by ( o.shares DESC, o.created_at ASC ) and wrapping if needed
      for k in 0 .. remainder-1:
          alloc[ sorted_orders[ k mod len(orders) ] ] += 1
      # INVARIANT: sum( alloc[o] ) == F exactly, and therefore
      # Block.filled_shares == Block.allocated_shares + Block.unallocated_shares
      # holds before allocation (0 + F), after allocation (F + 0) and after the
      # compensating unwind (0 + F).
    input_set: "member TradeOrder rows in status BLOCKED only; CANCELLED and STALE members are excluded from R and receive nothing"
    constants: {}
    precision: "integer shares; floor then largest-request-first remainder distribution, ties broken by created_at ASC"
    variants: []

  # ---------------------------------------------------------------------------
  - name: hifo_disposal_ledger
    trigger: "the SELL side of POST /sma/blocks/{block_id}/allocate, and POST /sma/harvest-proposals/{harvest_proposal_id}/execute; also evaluated read-only at POST /sma/harvest-proposals to populate target_loss_cents and proposed_loss_cents"
    algorithm: chronological
    formula: |
      # HIFO: highest cost per share first.
      candidates = TaxLot rows of (account, security) with status == OPEN and
                   shares_open > 0, sorted by
                   ( cost_basis_cents / shares_open ) DESC, then created_at ASC
      remaining  = shares to dispose ; slices = []
      for lot in candidates:
          if remaining == 0: break
          take  = min( lot.shares_open, remaining )
          basis = round_half_up( lot.cost_basis_cents * take / lot.shares_open )
          realized = take * price_cents - basis
          if take == lot.shares_open:
              # IN-PLACE close: mutate the lot itself, no new row
              lot.status = CLOSED ; lot.shares_closed = take ; lot.shares_open = 0
              lot.realized_gain_cents = realized
          else:
              # SPLIT: carve a CLOSED slice out, parent keeps the rest
              new slice{ parent_tax_lot_id = lot.id, shares_closed = take,
                         shares_open = 0, cost_basis_cents = basis,
                         realized_gain_cents = realized, status = CLOSED }
              lot.shares_open      -= take
              lot.cost_basis_cents -= basis
          if realized < 0:
              stamp wash_window_start = close_date - WASH_WINDOW_DAYS days
              stamp wash_window_end   = close_date + WASH_WINDOW_DAYS days
          slices.append(realized) ; remaining -= take
      if remaining > 0: reject with ERR_INSUFFICIENT_SHARES

      target_loss_cents   = sum( slices )                       # SIGNED, gains net in
      proposed_loss_cents = abs( sum( r for r in slices if r < 0 ) )  # losses ONLY
      # The two differ whenever the walk touches both a losing and a winning lot.
    input_set: "TaxLot rows with status == OPEN and shares_open > 0 for the exact (account_id, security_id) pair; CLOSED and REVERSED lots are never candidates"
    constants:
      WASH_WINDOW_DAYS: 30
    precision: "round_half_up on the carved basis; the residual basis stays with the parent lot so parent.cost_basis + slice.cost_basis equals the original exactly"
    variants:
      - name: PROPOSAL_QUOTE
        when: "evaluated read-only at POST /sma/harvest-proposals"
        difference: "price_cents = Security.last_price_cents at proposal creation, stored as HarvestProposal.quoted_price_cents; no lot is mutated; results land in target_loss_cents and proposed_loss_cents"
      - name: EXECUTION_ACTUAL
        when: "evaluated at POST /sma/harvest-proposals/{harvest_proposal_id}/execute"
        difference: "price_cents = Security.last_price_cents at execution time; the walk is re-run from scratch against the CURRENT lot ledger and mutates it; the result lands in realized_loss_cents and may differ from proposed_loss_cents whenever the mark or the lot ledger moved in between"

  # ---------------------------------------------------------------------------
  - name: fee_invoice_tiered_split
    trigger: "POST /sma/fee-invoices"
    algorithm: tiered_pricing
    formula: |
      billing_days = whole UTC days from period_start inclusive to period_end
                     exclusive
      adv          = average_daily_value_cents
      slice1 = min( adv, TIER1_CEILING_CENTS )
      slice2 = max( 0, min( adv, TIER2_CEILING_CENTS ) - TIER1_CEILING_CENTS )
      slice3 = max( 0, adv - TIER2_CEILING_CENTS )
      bps1   = Model.base_fee_bps
      bps2   = Model.base_fee_bps - TIER2_DISCOUNT_BPS
      bps3   = Model.base_fee_bps - TIER3_DISCOUNT_BPS

      # ROUNDING ORDER IS PINNED. Each tier's PRORATED fee is rounded to whole
      # cents INDEPENDENTLY with round_half_up, and gross_fee_cents is the SUM
      # of those three already-rounded numbers. Summing the exact tier fees and
      # rounding once at the end is NOT admissible and produces a different
      # number of cents.
      tier1_fee_cents = round_half_up( slice1 * bps1 * billing_days / (10000 * DAYS_IN_YEAR) )
      tier2_fee_cents = round_half_up( slice2 * bps2 * billing_days / (10000 * DAYS_IN_YEAR) )
      tier3_fee_cents = round_half_up( slice3 * bps3 * billing_days / (10000 * DAYS_IN_YEAR) )
      gross_fee_cents = tier1_fee_cents + tier2_fee_cents + tier3_fee_cents

      # SPLIT ORDER IS PINNED. Sponsor and platform are rounded independently;
      # the manager absorbs the residual. Rounding the manager share directly is
      # NOT admissible and breaks the conservation invariant below.
      sponsor_share_cents  = round_half_up( gross_fee_cents * Sponsor.revenue_share_bps / 10000 )
      platform_share_cents = round_half_up( gross_fee_cents * PLATFORM_FEE_BPS / 10000 )
      manager_share_cents  = gross_fee_cents - sponsor_share_cents - platform_share_cents
      # INVARIANT: gross_fee_cents == sponsor_share_cents + manager_share_cents
      #                               + platform_share_cents, always, and the
      # compensating void restores Account.fees_billed_ytd_cents exactly.
    input_set: "Model.base_fee_bps of the Account's Model and Sponsor.revenue_share_bps of the Account's Sponsor, both read at invoice creation; the average daily value is supplied by the caller and is not derived from lots"
    constants:
      TIER1_CEILING_CENTS: 25000000
      TIER2_CEILING_CENTS: 100000000
      TIER2_DISCOUNT_BPS: 10
      TIER3_DISCOUNT_BPS: 20
      DAYS_IN_YEAR: 365
      PLATFORM_FEE_BPS: 500
      PAYMENT_TERM_DAYS: 30
    precision: "round_half_up to whole cents, applied per tier and per non-residual share; never on the manager residual"
    variants: []

  # ---------------------------------------------------------------------------
  - name: cross_account_dispersion
    trigger: "GET /sma/model-versions/{model_version_id}/dispersion"
    algorithm: aggregation
    formula: |
      cohort = Account rows with current_model_version_id == {model_version_id}
               AND implementation_status != SUSPENDED
               AND latest_return_bps IS NOT NULL
      if cohort is empty: reject with ERR_DISPERSION_SET_EMPTY
      n  = count(cohort)
      r_i = Account.latest_return_bps
      v_i = Account.latest_ending_value_cents
      dispersion_bps        = max(r_i) - min(r_i)          # same under both variants
      min_return_bps        = min(r_i)
      max_return_bps        = max(r_i)
      # mean_return_bps and mean_abs_deviation_bps are variant-specific.
    input_set: "Accounts currently tracking this exact ModelVersion; SUSPENDED accounts and accounts that never reported a performance observation are excluded from n, from the mean and from the min/max scan"
    constants: {}
    precision: "round_half_up to integer basis points, applied once to the mean and once to the mean absolute deviation; intermediate sums stay exact"
    variants:
      - name: EQUAL_WEIGHTED
        when: "the `basis` query field is EQUAL_WEIGHTED or is omitted"
        difference: "mean_return_bps = round_half_up( sum(r_i) / n ); mean_abs_deviation_bps = round_half_up( sum( abs(r_i - mean_return_bps) ) / n ). Every account counts once regardless of size."
      - name: ASSET_WEIGHTED
        when: "the `basis` query field is ASSET_WEIGHTED"
        difference: "mean_return_bps = round_half_up( sum(r_i * v_i) / sum(v_i) ); mean_abs_deviation_bps = round_half_up( sum( v_i * abs(r_i - mean_return_bps) ) / sum(v_i) ). Identical stored data therefore yields a different mean and a different dispersion of that mean."

  # ---------------------------------------------------------------------------
  - name: wash_sale_window_geometry
    trigger: "evaluated at POST /sma/harvest-proposals (lookback clause) and at POST /sma/blocks (window-occupation clause)"
    algorithm: interval_merge
    formula: |
      # Interval semantics for this resource: a CLOSED interval measured in
      # whole UTC dates, formed as a SYMMETRIC +/- WASH_WINDOW_DAYS buffer
      # around a POINT event (the disposal date). Both endpoints are inside the
      # window. The occupied resource key is the (Account, Security) pair.

      # Clause L (lookback, at proposal creation):
      #   reject when a TaxLot exists with account_id = A, security_id = S,
      #   origin = TRADE, status IN {OPEN, CLOSED}, and
      #   date(open_date) IN [ date(clock) - 30 , date(clock) + 30 ]
      #   (inclusive at BOTH ends: a purchase exactly 30 days before the
      #   proposal collides; 31 days before does not)

      # Clause W (window occupation, at block creation for a BUY):
      #   reject when a TaxLot exists with account_id = A, security_id = S,
      #   status = CLOSED, realized_gain_cents < 0, and
      #   date(clock) IN [ date(wash_window_start) , date(wash_window_end) ]
      #   (inclusive at BOTH ends)
    input_set: "TaxLot rows scoped to the exact (account_id, security_id) pair; TRANSFER_IN lots never satisfy clause L, REVERSED lots never satisfy either clause"
    constants:
      WASH_WINDOW_DAYS: 30
    precision: "whole UTC dates; the time-of-day component of open_date, close_date and the clock is discarded before comparison"
    variants: []

  # ---------------------------------------------------------------------------
  - name: distribution_effective_window
    trigger: "POST /sma/sponsor-distributions"
    algorithm: interval_merge
    formula: |
      # Interval semantics for this resource: a HALF-OPEN interval on the
      # instant timeline, [effective_from, effective_until), with a null
      # effective_until meaning +infinity. ADJACENCY IS ALLOWED: a new window
      # whose effective_from equals an existing window's effective_until does
      # NOT collide. There is no buffer of any kind. The occupied resource key
      # is the (sponsor_id, model_id) pair.
      occupants = SponsorDistribution rows with the same sponsor_id and the same
                  model_id and status IN {PENDING, ACTIVE}
                  # LAPSED rows have vacated the resource and never collide
      collide(a, b) = ( a.effective_from <  coalesce(b.effective_until, +inf) )
                  AND ( b.effective_from <  coalesce(a.effective_until, +inf) )
      if any occupant collides: reject with ERR_DISTRIBUTION_WINDOW_OVERLAP
    input_set: "SponsorDistribution rows with status IN {PENDING, ACTIVE} on the same (sponsor_id, model_id) key; LAPSED rows are excluded"
    constants: {}
    precision: "instant comparison at full ISO-8601 precision; strict `<` on both sides makes touching endpoints legal"
    variants: []

  # ---------------------------------------------------------------------------
  - name: billing_period_window
    trigger: "POST /sma/fee-invoices"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN [period_start, period_end) on the (account_id) key.
      # Adjacency allowed. VOIDED invoices have vacated the resource.
      occupants = FeeInvoice rows of the same account_id with
                  status IN {DRAFT, ISSUED, PAID, WRITTEN_OFF}
      collide(a, b) = ( a.period_start < b.period_end )
                  AND ( b.period_start < a.period_end )
      if any occupant collides: reject with ERR_BILLING_PERIOD_OVERLAP
    input_set: "FeeInvoice rows of the same account with status != VOIDED"
    constants: {}
    precision: "instant comparison at full ISO-8601 precision"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role names one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "when the acting role is SponsorOperator on a mutating endpoint, X-User-ID equals the Sponsor.id that owns the target resource: Account.sponsor_id for account-scoped writes, SponsorDistribution.sponsor_id for activate, the body's sponsor_id for account creation, and the sponsor of every member order's account for block creation"
    error_id: ERR_SPONSOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /sma/accounts, POST /sma/accounts/{account_id}/deposits, POST /sma/accounts/{account_id}/transfers-in, POST /sma/accounts/{account_id}/implementations, POST /sma/accounts/{account_id}/drift-evaluations, POST /sma/accounts/{account_id}/rebalances, POST /sma/accounts/{account_id}/performance-observations, POST /sma/sponsor-distributions/{sponsor_distribution_id}/activate, POST /sma/blocks, POST /sma/trade-orders/{trade_order_id}/cancel"

  - priority: 4
    category: auth
    check: "the acting X-User-ID differs from ModelVersion.submitted_by_user_id (segregation of duties: a submitter may never clear or reject their own submission)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /sma/model-versions/{model_version_id}/approve, POST /sma/model-versions/{model_version_id}/reject"

  - priority: 5
    category: existence
    check: "every id in the request path resolves to an existing row, validated left to right"
    error_id: "ERR_SECURITY_NOT_FOUND | ERR_SPONSOR_NOT_FOUND | ERR_MODEL_NOT_FOUND | ERR_MODEL_VERSION_NOT_FOUND | ERR_DISTRIBUTION_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_RESTRICTION_NOT_FOUND | ERR_TRADE_ORDER_NOT_FOUND | ERR_BLOCK_NOT_FOUND | ERR_TAX_LOT_NOT_FOUND | ERR_HARVEST_PROPOSAL_NOT_FOUND | ERR_INVOICE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id"

  - priority: 6
    category: existence
    check: "every reference id in the request body resolves to an existing row, validated in the order the fields are listed in the endpoint's input"
    error_id: "ERR_SECURITY_NOT_FOUND | ERR_SPONSOR_NOT_FOUND | ERR_MODEL_NOT_FOUND | ERR_MODEL_VERSION_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_TRADE_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /sma/model-versions, POST /sma/model-versions/{model_version_id}/sleeves, POST /sma/sponsor-distributions, POST /sma/accounts, POST /sma/accounts/{account_id}/transfers-in, POST /sma/account-restrictions, POST /sma/blocks, POST /sma/harvest-proposals, POST /sma/fee-invoices"

  - priority: 7
    category: business_constraint
    check: "every required input field is present; every value matches its declared type, enum membership and numeric range; max_position_bps is present when restriction_type is MAX_POSITION and absent otherwise; period_end > period_start; effective_until > effective_from when non-null"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 8
    category: state
    check: "the supplied expected_<parent>_version equals the parent row's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /sma/sponsor-distributions, POST /sma/harvest-proposals"

  - priority: 9
    category: state
    check: "the target Account (or, for block creation, EVERY member order's account) has implementation_status != SUSPENDED"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "POST /sma/accounts/{account_id}/deposits, POST /sma/accounts/{account_id}/transfers-in, POST /sma/accounts/{account_id}/implementations, POST /sma/accounts/{account_id}/drift-evaluations, POST /sma/accounts/{account_id}/rebalances, POST /sma/blocks, POST /sma/blocks/{block_id}/allocate, POST /sma/harvest-proposals, POST /sma/harvest-proposals/{harvest_proposal_id}/approve, POST /sma/harvest-proposals/{harvest_proposal_id}/execute"

  - priority: 10
    category: state
    check: "the target Account has billing_status != WRITTEN_OFF"
    error_id: ERR_ACCOUNT_WRITTEN_OFF
    http_status: 409
    applies_to: "POST /sma/accounts/{account_id}/deposits, POST /sma/accounts/{account_id}/transfers-in, POST /sma/accounts/{account_id}/implementations, POST /sma/accounts/{account_id}/drift-evaluations, POST /sma/accounts/{account_id}/rebalances, POST /sma/accounts/{account_id}/reinstate, POST /sma/harvest-proposals, POST /sma/fee-invoices"

  - priority: 11
    category: state
    check: "the subject row is in the from-state the requested transition declares in §1.2 (a Model with no published version for account creation, an Account not in DRIFTED for a rebalance, an Account not in PENDING_IMPLEMENTATION for an implementation, and every other from-state mismatch)"
    error_id: "ERR_MODEL_NOT_PUBLISHED | ERR_ACCOUNT_NOT_DRIFTED | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 12
    category: business_referential
    check: "the referenced sibling row is in the state the operation requires: the ModelVersion is PUBLISHED for distribution creation and activation; an ACTIVE SponsorDistribution covering the clock exists for the account's sponsor and pending version at implementation time"
    error_id: "ERR_MODEL_VERSION_NOT_PUBLISHED | ERR_DISTRIBUTION_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /sma/sponsor-distributions, POST /sma/sponsor-distributions/{sponsor_distribution_id}/activate, POST /sma/accounts/{account_id}/implementations"

  - priority: 13
    category: business_safety
    check: "no BUY order in the block targets a security that is restricted for its account — Security.restricted_globally is true, or an ACTIVE AccountRestriction of type DO_NOT_BUY or DO_NOT_HOLD exists on (account, security)"
    error_id: ERR_SECURITY_RESTRICTED
    http_status: 422
    applies_to: "POST /sma/blocks"

  - priority: 14
    category: business_safety
    check: "wash-sale coordination, both clauses of wash_sale_window_geometry: at proposal creation, no TRADE-origin TaxLot of (account, security) was opened inside the closed +/-30-day lookback around the clock, and replacement_security_id != security_id; at block creation for a BUY, the clock date lies outside every [wash_window_start, wash_window_end] closed interval stamped on a losing CLOSED lot of (account, security)"
    error_id: ERR_WASH_SALE_WINDOW_CONFLICT
    http_status: 422
    applies_to: "POST /sma/harvest-proposals, POST /sma/blocks"

  - priority: 15
    category: business_temporal
    check: "the new distribution's half-open [effective_from, effective_until) window does not collide with any PENDING or ACTIVE distribution on the same (sponsor_id, model_id) key; touching endpoints are legal"
    error_id: ERR_DISTRIBUTION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /sma/sponsor-distributions"

  - priority: 16
    category: business_temporal
    check: "the new invoice's half-open [period_start, period_end) window does not collide with any non-VOIDED invoice of the same account"
    error_id: ERR_BILLING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /sma/fee-invoices"

  - priority: 17
    category: business_temporal
    check: "the current logical clock is at or after FeeInvoice.period_end + 30 days"
    error_id: ERR_PAYMENT_TERM_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /sma/fee-invoices/{fee_invoice_id}/mark-delinquent"

  - priority: 18
    category: business_constraint
    check: "the declared unique key is free: Security.ticker, Sponsor.platform_code, Model.strategy_code, Account.account_number"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /sma/securities, POST /sma/sponsors, POST /sma/models, POST /sma/accounts"

  - priority: 19
    category: business_constraint
    check: "ModelVersion.sleeve_count >= 1 and ModelVersion.total_target_weight_bps == 10000 exactly"
    error_id: ERR_WEIGHTS_NOT_BALANCED
    http_status: 422
    applies_to: "POST /sma/model-versions/{model_version_id}/submit"

  - priority: 20
    category: business_constraint
    check: "the trade_order_ids list is non-empty, every listed order is in status PROPOSED, and all of them share one security_id and one side"
    error_id: ERR_BLOCK_COMPOSITION_INVALID
    http_status: 422
    applies_to: "POST /sma/blocks"

  - priority: 21
    category: business_constraint
    check: "1 <= filled_shares <= Block.requested_shares"
    error_id: ERR_FILL_EXCEEDS_REQUEST
    http_status: 422
    applies_to: "POST /sma/blocks/{block_id}/execute"

  - priority: 22
    category: business_constraint
    check: "every TaxLot whose opening_trade_order_id is a member order of the block is still in status OPEN"
    error_id: ERR_UNWIND_BLOCKED
    http_status: 409
    applies_to: "POST /sma/blocks/{block_id}/unwind"

  - priority: 23
    category: business_constraint
    check: "the dispersion cohort is non-empty"
    error_id: ERR_DISPERSION_SET_EMPTY
    http_status: 422
    applies_to: "GET /sma/model-versions/{model_version_id}/dispersion"

  - priority: 24
    category: business_fiscal
    check: "Account.market_value_cents >= Sponsor.min_account_value_cents"
    error_id: ERR_BELOW_SPONSOR_MINIMUM
    http_status: 422
    applies_to: "POST /sma/accounts/{account_id}/implementations"

  - priority: 25
    category: business_fiscal
    check: "the account holds at least the requested share count across OPEN TaxLot rows of the security, so the HIFO disposal walk can complete"
    error_id: ERR_INSUFFICIENT_SHARES
    http_status: 422
    applies_to: "POST /sma/harvest-proposals, POST /sma/harvest-proposals/{harvest_proposal_id}/execute"

  - priority: 26
    category: business_fiscal
    check: "Account.tax_overlay_enabled is true and Account.realized_loss_ytd_cents + proposed_loss_cents <= Account.harvest_budget_cents (evaluated on the loss figure the completed HIFO walk produced)"
    error_id: ERR_HARVEST_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /sma/harvest-proposals, POST /sma/harvest-proposals/{harvest_proposal_id}/execute"

  - priority: 27
    category: business_fiscal
    check: "every BUY allocation is covered by its account's cash_cents, and an invoice payment is covered by the account's cash_cents"
    error_id: ERR_INSUFFICIENT_CASH
    http_status: 422
    applies_to: "POST /sma/blocks/{block_id}/allocate, POST /sma/fee-invoices/{fee_invoice_id}/pay"

  - priority: 28
    category: business_constraint
    check: "trade_order_generation produced at least one TradeOrder"
    error_id: ERR_NO_TRADES_GENERATED
    http_status: 422
    applies_to: "POST /sma/accounts/{account_id}/rebalances, POST /sma/accounts/{account_id}/implementations"

# =============================================================================
# §1.5 API Endpoint Table
# All list endpoints accept limit/offset per §1.0 and return results ordered by
# created_at ASC; TradeOrder and TaxLot lists break created_at ties by
# sequence_number ASC. No list ordering ever consults `id`.
# =============================================================================
endpoints:

  # --------------------------- Security -------------------------------------
  - method: POST
    path: "/sma/securities"
    description: "Register a tradable instrument with its current mark"
    roles: [PlatformAdmin]
    code: 201
    input: [ticker, name, asset_class, last_price_cents, "restricted_globally?"]
    output: Security
    side_effects: ["rejects a duplicate ticker with ERR_DUPLICATE_KEY"]

  - method: GET
    path: "/sma/securities/{security_id}"
    description: "Read one instrument"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: []
    output: Security
    side_effects: []

  - method: POST
    path: "/sma/securities/{security_id}/price"
    description: "Re-mark an instrument; every later valuation, drift evaluation, generation and harvest uses the new mark. Already-stored TaxLot.cost_basis_cents and FeeInvoice figures are NOT retroactively changed."
    roles: [PlatformAdmin]
    code: 200
    input: [last_price_cents]
    output: Security
    side_effects:
      - "updates last_price_cents and increments Security.version by 1"
      - "no Account.drift_bps is recomputed until the next drift evaluation"

  # --------------------------- Sponsor --------------------------------------
  - method: POST
    path: "/sma/sponsors"
    description: "Register a sponsor platform. The returned id is the X-User-ID a SponsorOperator must present."
    roles: [PlatformAdmin]
    code: 201
    input: [name, platform_code, revenue_share_bps, "implementation_lag_days?", "min_account_value_cents?"]
    output: Sponsor
    side_effects: ["rejects a duplicate platform_code with ERR_DUPLICATE_KEY"]

  - method: GET
    path: "/sma/sponsors/{sponsor_id}"
    description: "Read one sponsor platform"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: []
    output: Sponsor
    side_effects: []

  # --------------------------- Model ----------------------------------------
  - method: POST
    path: "/sma/models"
    description: "Register a model strategy"
    roles: [PortfolioManager]
    code: 201
    input: [manager_name, name, strategy_code, asset_class, base_fee_bps, "drift_threshold_bps?"]
    output: Model
    side_effects: ["rejects a duplicate strategy_code with ERR_DUPLICATE_KEY"]

  - method: GET
    path: "/sma/models/{model_id}"
    description: "Read one model, including its published_model_version_id pointer"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: []
    output: Model
    side_effects: []

  # --------------------------- ModelVersion ---------------------------------
  - method: POST
    path: "/sma/model-versions"
    description: "Open a DRAFT version of a model; version_number is Model.version_count + 1"
    roles: [PortfolioManager]
    code: 201
    input: [model_id]
    output: ModelVersion
    side_effects: ["increments Model.version_count and Model.version by 1"]

  - method: GET
    path: "/sma/model-versions/{model_version_id}"
    description: "Read one model version including its sleeves array and its current version integer"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: []
    output: ModelVersion
    side_effects: []

  - method: GET
    path: "/sma/model-versions"
    description: "List model versions, filtered by owning model and/or status"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: ["model_id?", "status?", "limit?", "offset?"]
    output: ModelVersion[]
    side_effects: []

  - method: POST
    path: "/sma/model-versions/{model_version_id}/sleeves"
    description: "Replace the sleeve array of a DRAFT version wholesale"
    roles: [PortfolioManager]
    code: 200
    input: [sleeves]
    output: ModelVersion
    side_effects:
      - "recomputes sleeve_count and total_target_weight_bps"
      - "increments ModelVersion.version by 1"

  - method: POST
    path: "/sma/model-versions/{model_version_id}/submit"
    description: "DRAFT -> PENDING_APPROVAL; records the submitting X-User-ID"
    roles: [PortfolioManager]
    code: 200
    input: []
    output: ModelVersion
    side_effects: ["sets submitted_by_user_id", "increments ModelVersion.version by 1"]

  - method: POST
    path: "/sma/model-versions/{model_version_id}/approve"
    description: "PENDING_APPROVAL -> APPROVED; the submitter's X-User-ID may not approve"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ModelVersion
    side_effects: ["sets approved_by_user_id", "version-pins the sleeves", "increments ModelVersion.version by 1"]

  - method: POST
    path: "/sma/model-versions/{model_version_id}/reject"
    description: "PENDING_APPROVAL -> DRAFT revision loop; the submitter's X-User-ID may not reject"
    roles: [ComplianceOfficer]
    code: 200
    input: [rejection_note]
    output: ModelVersion
    side_effects: ["sets rejection_note, clears submitted_by_user_id", "increments ModelVersion.version by 1"]

  - method: POST
    path: "/sma/model-versions/{model_version_id}/publish"
    description: "APPROVED -> PUBLISHED; drives CASCADE-A hops 1-5"
    roles: [PortfolioManager]
    code: 200
    input: []
    output: ModelVersion
    side_effects:
      - "sets published_at and Model.published_model_version_id"
      - "supersedes the prior PUBLISHED sibling version"
      - "lapses that version's ACTIVE SponsorDistribution rows"
      - "notifies every SYNCED or DRIFTED account fed by those distributions"
      - "stales those accounts' PROPOSED and BLOCKED orders"
      - "increments ModelVersion.version by 1"

  - method: GET
    path: "/sma/model-versions/{model_version_id}/dispersion"
    description: "Cross-account performance dispersion for the cohort tracking this exact version"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: ["basis?"]
    output: "{ model_version_id: string, basis: string, account_count: integer, mean_return_bps: integer, mean_abs_deviation_bps: integer, dispersion_bps: integer, min_return_bps: integer, max_return_bps: integer }"
    side_effects: ["rejects an empty cohort with ERR_DISPERSION_SET_EMPTY"]

  # --------------------------- SponsorDistribution --------------------------
  - method: POST
    path: "/sma/sponsor-distributions"
    description: "Publish a PUBLISHED model version onto a sponsor platform for a half-open effective window. OCC guarded on the model version."
    roles: [PortfolioManager]
    code: 201
    input: [sponsor_id, model_version_id, effective_from, "effective_until?", expected_model_version_version]
    output: SponsorDistribution
    side_effects:
      - "copies model_id from the referenced ModelVersion"
      - "increments ModelVersion.distribution_count by 1"
      - "increments ModelVersion.version by 1"

  - method: GET
    path: "/sma/sponsor-distributions/{sponsor_distribution_id}"
    description: "Read one distribution"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: []
    output: SponsorDistribution
    side_effects: []

  - method: GET
    path: "/sma/sponsor-distributions"
    description: "List distributions filtered by sponsor, model version, model and/or status"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: ["sponsor_id?", "model_version_id?", "model_id?", "status?", "limit?", "offset?"]
    output: SponsorDistribution[]
    side_effects: []

  - method: POST
    path: "/sma/sponsor-distributions/{sponsor_distribution_id}/activate"
    description: "PENDING -> ACTIVE; only the owning sponsor may activate, and only while the model version is still PUBLISHED"
    roles: [SponsorOperator]
    code: 200
    input: []
    output: SponsorDistribution
    side_effects: ["sets activated_at", "increments SponsorDistribution.version by 1"]

  # --------------------------- Account --------------------------------------
  - method: POST
    path: "/sma/accounts"
    description: "Open an SMA account against a model that already has a published version; the account starts SYNCED on that version with zero cash"
    roles: [SponsorOperator]
    code: 201
    input: [sponsor_id, model_id, account_number, "cash_reserve_bps?", "drift_basis?", "tax_overlay_enabled?", "harvest_budget_cents?"]
    output: Account
    side_effects:
      - "sets current_model_version_id = Model.published_model_version_id"
      - "sets implementation_status = SYNCED and billing_status = CURRENT"
      - "increments Sponsor.account_count and Sponsor.version by 1"

  - method: GET
    path: "/sma/accounts/{account_id}"
    description: "Read one account including both state dimensions, its version integer and its derived market value"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/sma/accounts"
    description: "List accounts filtered by sponsor, model, current or pending model version, and either state dimension"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: ["sponsor_id?", "model_id?", "current_model_version_id?", "pending_model_version_id?", "implementation_status?", "billing_status?", "limit?", "offset?"]
    output: Account[]
    side_effects: []

  - method: POST
    path: "/sma/accounts/{account_id}/deposits"
    description: "Credit settled cash into the account"
    roles: [SponsorOperator]
    code: 200
    input: [amount_cents]
    output: Account
    side_effects: ["increases cash_cents and market_value_cents", "increments Account.version by 1"]

  - method: POST
    path: "/sma/accounts/{account_id}/transfers-in"
    description: "Book an existing position into the account as an OPEN tax lot. origin TRANSFER_IN records an in-kind delivery; origin TRADE records an externally executed purchase and therefore taints the wash-sale lookback."
    roles: [SponsorOperator]
    code: 201
    input: [security_id, shares, cost_basis_cents, "origin?"]
    output: TaxLot
    side_effects:
      - "creates an OPEN TaxLot with open_date = current logical clock and sequence_number from Account.next_order_sequence"
      - "raises Account.market_value_cents"
      - "increments Account.version by 1"

  - method: POST
    path: "/sma/accounts/{account_id}/suspend"
    description: "Freeze the implementation dimension; billing continues unaffected"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: ["sets implementation_status = SUSPENDED", "increments Account.version by 1"]

  - method: POST
    path: "/sma/accounts/{account_id}/reinstate"
    description: "Unfreeze the implementation dimension, returning to PENDING_IMPLEMENTATION when a pending version is outstanding, otherwise to SYNCED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: ["increments Account.version by 1"]

  - method: POST
    path: "/sma/accounts/{account_id}/implementations"
    description: "Adopt the pending model version and generate the implementation trade orders. trade_order_ids is ordered by Security.ticker ASC, matching generation order."
    roles: [SponsorOperator]
    code: 200
    input: []
    output: "{ account_id: string, current_model_version_id: string, generated_order_count: integer, trade_order_ids: string[], last_implementation_lag_days: integer, implemented_late: boolean }"
    side_effects:
      - "promotes pending_model_version_id to current_model_version_id"
      - "records last_implementation_lag_days and implemented_late"
      - "creates PROPOSED TradeOrder rows with source = IMPLEMENTATION"
      - "sets implementation_status = SYNCED"
      - "increments Account.version by 1"

  - method: POST
    path: "/sma/accounts/{account_id}/drift-evaluations"
    description: "Evaluate drift under the requested basis, or under Account.drift_basis when basis is omitted, and move the implementation dimension between SYNCED and DRIFTED"
    roles: [SponsorOperator, PortfolioManager]
    code: 200
    input: ["basis?"]
    output: Account
    side_effects:
      - "sets drift_bps, drift_basis_used and drift_evaluated_at"
      - "moves implementation_status SYNCED -> DRIFTED when drift_bps >= Model.drift_threshold_bps, or DRIFTED -> SYNCED when strictly below"
      - "increments Account.version by 1"

  - method: POST
    path: "/sma/accounts/{account_id}/rebalances"
    description: "Generate rebalance trade orders for a DRIFTED account against its current model version. trade_order_ids is ordered by Security.ticker ASC."
    roles: [SponsorOperator]
    code: 200
    input: []
    output: "{ account_id: string, model_version_id: string, generated_order_count: integer, trade_order_ids: string[] }"
    side_effects:
      - "creates PROPOSED TradeOrder rows with source = REBALANCE"
      - "advances Account.next_order_sequence"
      - "increments Account.version by 1"

  - method: POST
    path: "/sma/accounts/{account_id}/performance-observations"
    description: "Record the account's period return and ending value; feeds cross-account dispersion"
    roles: [SponsorOperator, PlatformAdmin]
    code: 200
    input: [period_end, gross_return_bps, ending_value_cents]
    output: Account
    side_effects:
      - "sets latest_return_bps, latest_return_period_end and latest_ending_value_cents"
      - "increments Account.version by 1"

  # --------------------------- AccountRestriction ---------------------------
  - method: POST
    path: "/sma/account-restrictions"
    description: "Attach a customization restriction to an account"
    roles: [ComplianceOfficer]
    code: 201
    input: [account_id, security_id, restriction_type, "max_position_bps?"]
    output: AccountRestriction
    side_effects: ["increments Account.version by 1"]

  - method: GET
    path: "/sma/account-restrictions/{account_restriction_id}"
    description: "Read one restriction"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: []
    output: AccountRestriction
    side_effects: []

  - method: GET
    path: "/sma/account-restrictions"
    description: "List restrictions filtered by account, security and/or status"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: ["account_id?", "security_id?", "status?", "limit?", "offset?"]
    output: AccountRestriction[]
    side_effects: []

  - method: POST
    path: "/sma/account-restrictions/{account_restriction_id}/lift"
    description: "ACTIVE -> LIFTED; the restriction stops shaping effective weights from the next generation onward"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AccountRestriction
    side_effects: ["sets lifted_at", "increments AccountRestriction.version and Account.version by 1"]

  # --------------------------- TradeOrder -----------------------------------
  - method: GET
    path: "/sma/trade-orders/{trade_order_id}"
    description: "Read one trade order"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: []
    output: TradeOrder
    side_effects: []

  - method: GET
    path: "/sma/trade-orders"
    description: "List trade orders filtered by account, security, model version, block, status, source and/or side; ordered by created_at ASC then sequence_number ASC"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: ["account_id?", "security_id?", "model_version_id?", "block_id?", "status?", "source?", "side?", "limit?", "offset?"]
    output: TradeOrder[]
    side_effects: []

  - method: POST
    path: "/sma/trade-orders/{trade_order_id}/cancel"
    description: "Cancel a PROPOSED order, or a BLOCKED order while its block is still OPEN"
    roles: [SponsorOperator]
    code: 200
    input: []
    output: TradeOrder
    side_effects: ["clears block_id and recomputes the block's requested_shares and order_count", "increments TradeOrder.version by 1"]

  # --------------------------- Block ----------------------------------------
  - method: POST
    path: "/sma/blocks"
    description: "Aggregate PROPOSED orders sharing one security and one side into a street block"
    roles: [SponsorOperator]
    code: 201
    input: [trade_order_ids]
    output: Block
    side_effects:
      - "moves every listed order PROPOSED -> BLOCKED and stamps block_id"
      - "sets requested_shares, order_count, side and security_id from the members"

  - method: GET
    path: "/sma/blocks/{block_id}"
    description: "Read one block including the conserved triple filled_shares / allocated_shares / unallocated_shares"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: []
    output: Block
    side_effects: []

  - method: GET
    path: "/sma/blocks"
    description: "List blocks filtered by security, status and/or side"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: ["security_id?", "status?", "side?", "limit?", "offset?"]
    output: Block[]
    side_effects: []

  - method: POST
    path: "/sma/blocks/{block_id}/execute"
    description: "Record the street fill; OPEN -> FILLED"
    roles: [PlatformAdmin]
    code: 200
    input: [filled_shares, avg_fill_price_cents]
    output: Block
    side_effects: ["sets filled_shares, avg_fill_price_cents, executed_at and unallocated_shares", "increments Block.version by 1"]

  - method: POST
    path: "/sma/blocks/{block_id}/allocate"
    description: "Run the pro-rata waterfall and book the resulting tax lots; FILLED -> ALLOCATED; drives CASCADE-B hops 1-3"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Block
    side_effects:
      - "sets allocated_shares on every member order"
      - "opens or closes TaxLot rows and moves Account.cash_cents"
      - "stamps wash windows and raises Account.realized_loss_ytd_cents on losing disposals"
      - "increments Block.version by 1"

  - method: POST
    path: "/sma/blocks/{block_id}/unwind"
    description: "Compensating reversal of an allocation; ALLOCATED -> FILLED with every share, every lot and every realized-loss counter restored"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Block
    side_effects:
      - "resets member orders to BLOCKED with allocated_shares = 0"
      - "reverses or restores every TaxLot the allocation touched and returns the cash"
      - "reduces Account.realized_loss_ytd_cents by exactly what the allocation added"
      - "increments Block.version by 1"

  # --------------------------- TaxLot ---------------------------------------
  - method: GET
    path: "/sma/tax-lots/{tax_lot_id}"
    description: "Read one tax lot"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: []
    output: TaxLot
    side_effects: []

  - method: GET
    path: "/sma/tax-lots"
    description: "List tax lots filtered by account, security, parent lot, opening or closing order, status and/or origin; ordered by created_at ASC then sequence_number ASC"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: ["account_id?", "security_id?", "parent_tax_lot_id?", "opening_trade_order_id?", "closing_trade_order_id?", "status?", "origin?", "limit?", "offset?"]
    output: TaxLot[]
    side_effects: []

  # --------------------------- HarvestProposal ------------------------------
  - method: POST
    path: "/sma/harvest-proposals"
    description: "Propose a tax-loss harvest. Quotes the HIFO disposal at the current mark and supersedes any prior PROPOSED proposal for the same account and security. OCC guarded on the account."
    roles: [PortfolioManager]
    code: 201
    input: [account_id, security_id, shares, "replacement_security_id?", expected_account_version]
    output: HarvestProposal
    side_effects:
      - "sets quoted_price_cents, target_loss_cents and proposed_loss_cents"
      - "moves any prior PROPOSED proposal for the same (account_id, security_id) to SUPERSEDED"
      - "increments Account.version by 1"

  - method: GET
    path: "/sma/harvest-proposals/{harvest_proposal_id}"
    description: "Read one harvest proposal"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: []
    output: HarvestProposal
    side_effects: []

  - method: GET
    path: "/sma/harvest-proposals"
    description: "List harvest proposals filtered by account, security, replacement security and/or status"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: ["account_id?", "security_id?", "replacement_security_id?", "status?", "limit?", "offset?"]
    output: HarvestProposal[]
    side_effects: []

  - method: POST
    path: "/sma/harvest-proposals/{harvest_proposal_id}/approve"
    description: "PROPOSED -> APPROVED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: HarvestProposal
    side_effects: ["sets approved_by_user_id", "increments HarvestProposal.version by 1"]

  - method: POST
    path: "/sma/harvest-proposals/{harvest_proposal_id}/reject"
    description: "PROPOSED -> REJECTED; no lot is touched"
    roles: [ComplianceOfficer]
    code: 200
    input: [rejection_note]
    output: HarvestProposal
    side_effects: ["sets rejection_note", "increments HarvestProposal.version by 1"]

  - method: POST
    path: "/sma/harvest-proposals/{harvest_proposal_id}/execute"
    description: "APPROVED -> EXECUTED; re-runs the HIFO walk at the execution-time mark, closes or splits lots, credits cash and stamps wash windows"
    roles: [PortfolioManager]
    code: 200
    input: []
    output: HarvestProposal
    side_effects:
      - "sets realized_loss_cents and executed_at"
      - "closes or splits TaxLot rows and stamps wash_window_start / wash_window_end on losing slices"
      - "credits Account.cash_cents and raises Account.realized_loss_ytd_cents"
      - "increments HarvestProposal.version and Account.version by 1"

  # --------------------------- FeeInvoice -----------------------------------
  - method: POST
    path: "/sma/fee-invoices"
    description: "Compute a DRAFT fee invoice: tiered, day-prorated, per-tier rounded, then split three ways with the manager absorbing the residual"
    roles: [BillingOfficer]
    code: 201
    input: [account_id, period_start, period_end, average_daily_value_cents]
    output: FeeInvoice
    side_effects: ["sets billing_days, the three tier fees, gross_fee_cents and the three share fields"]

  - method: GET
    path: "/sma/fee-invoices/{fee_invoice_id}"
    description: "Read one invoice"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: []

  - method: GET
    path: "/sma/fee-invoices"
    description: "List invoices filtered by account and/or status"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, SponsorOperator, BillingOfficer]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: FeeInvoice[]
    side_effects: []

  - method: POST
    path: "/sma/fee-invoices/{fee_invoice_id}/issue"
    description: "DRAFT -> ISSUED; adds the gross fee to the account's YTD billed total and moves the billing dimension to INVOICED"
    roles: [BillingOfficer]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["sets issued_at", "raises Account.fees_billed_ytd_cents", "increments FeeInvoice.version and Account.version by 1"]

  - method: POST
    path: "/sma/fee-invoices/{fee_invoice_id}/pay"
    description: "ISSUED -> PAID; debits account cash and returns the billing dimension to CURRENT"
    roles: [BillingOfficer]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["sets paid_at", "debits Account.cash_cents", "leaves fees_billed_ytd_cents unchanged", "increments FeeInvoice.version and Account.version by 1"]

  - method: POST
    path: "/sma/fee-invoices/{fee_invoice_id}/void"
    description: "Compensating void of a DRAFT or ISSUED invoice; restores fees_billed_ytd_cents to its exact pre-issue value"
    roles: [BillingOfficer]
    code: 200
    input: [void_reason]
    output: FeeInvoice
    side_effects: ["sets voided_at and void_reason", "reverses the YTD billed contribution when the invoice was ISSUED", "increments FeeInvoice.version and Account.version by 1"]

  - method: POST
    path: "/sma/fee-invoices/{fee_invoice_id}/mark-delinquent"
    description: "Moves the billing dimension INVOICED -> DELINQUENT once the 30-day payment term has elapsed past period_end"
    roles: [BillingOfficer]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["sets Account.billing_status = DELINQUENT", "increments Account.version by 1"]

  - method: POST
    path: "/sma/fee-invoices/{fee_invoice_id}/write-off"
    description: "ISSUED -> WRITTEN_OFF on a DELINQUENT account; drives CASCADE-C hops 1-4 across the billing dimension, the implementation dimension and the account's open orders"
    roles: [BillingOfficer]
    code: 200
    input: []
    output: FeeInvoice
    side_effects:
      - "sets Account.billing_status = WRITTEN_OFF and Account.implementation_status = SUSPENDED"
      - "cancels every PROPOSED and BLOCKED TradeOrder of the account"
      - "leaves fees_billed_ytd_cents unchanged"
      - "increments FeeInvoice.version and Account.version by 1"

  # --------------------------- Test-driving surface -------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every deadline, wash window, effective window, billing period and lag computation reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no entity is mutated; nothing is recomputed until the next business call"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,            http: 401, condition: "X-User-Role or X-User-ID missing, empty, or naming an unknown role" }
  - { id: ERR_FORBIDDEN_ROLE,             http: 403, condition: "the acting role is not listed for the endpoint in §1.5" }
  - { id: ERR_SPONSOR_SCOPE_VIOLATION,    http: 403, condition: "a SponsorOperator acts on a resource belonging to a different Sponsor.id than its X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES,      http: 403, condition: "the X-User-ID approving or rejecting a ModelVersion equals its submitted_by_user_id" }
  - { id: ERR_SECURITY_NOT_FOUND,         http: 404, condition: "a referenced Security.id does not exist" }
  - { id: ERR_SPONSOR_NOT_FOUND,          http: 404, condition: "a referenced Sponsor.id does not exist" }
  - { id: ERR_MODEL_NOT_FOUND,            http: 404, condition: "a referenced Model.id does not exist" }
  - { id: ERR_MODEL_VERSION_NOT_FOUND,    http: 404, condition: "a referenced ModelVersion.id does not exist" }
  - { id: ERR_DISTRIBUTION_NOT_FOUND,     http: 404, condition: "a referenced SponsorDistribution.id does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND,          http: 404, condition: "a referenced Account.id does not exist" }
  - { id: ERR_RESTRICTION_NOT_FOUND,      http: 404, condition: "a referenced AccountRestriction.id does not exist" }
  - { id: ERR_TRADE_ORDER_NOT_FOUND,      http: 404, condition: "a referenced TradeOrder.id does not exist" }
  - { id: ERR_BLOCK_NOT_FOUND,            http: 404, condition: "a referenced Block.id does not exist" }
  - { id: ERR_TAX_LOT_NOT_FOUND,          http: 404, condition: "a referenced TaxLot.id does not exist" }
  - { id: ERR_HARVEST_PROPOSAL_NOT_FOUND, http: 404, condition: "a referenced HarvestProposal.id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND,          http: 404, condition: "a referenced FeeInvoice.id does not exist" }
  - { id: ERR_INVALID_REQUEST,            http: 400, condition: "a required field is missing, or a value violates its type, enum membership or numeric range" }
  - { id: ERR_STALE_VERSION,              http: 412, condition: "expected_model_version_version or expected_account_version does not equal the parent row's current version" }
  - { id: ERR_DUPLICATE_KEY,              http: 409, condition: "ticker, platform_code, strategy_code or account_number is already taken" }
  - { id: ERR_INVALID_STATE,              http: 409, condition: "the subject row is not in the from-state the requested transition declares and no more specific state error applies" }
  - { id: ERR_ACCOUNT_SUSPENDED,          http: 409, condition: "the target account, or a member order's account, has implementation_status SUSPENDED" }
  - { id: ERR_ACCOUNT_WRITTEN_OFF,        http: 409, condition: "the target account has billing_status WRITTEN_OFF" }
  - { id: ERR_ACCOUNT_NOT_DRIFTED,        http: 409, condition: "a rebalance was requested on an account whose implementation_status is not DRIFTED" }
  - { id: ERR_MODEL_NOT_PUBLISHED,        http: 409, condition: "an account was opened against a model whose published_model_version_id is null" }
  - { id: ERR_MODEL_VERSION_NOT_PUBLISHED,http: 409, condition: "a distribution was created for or activated against a ModelVersion whose status is not PUBLISHED" }
  - { id: ERR_DISTRIBUTION_NOT_ACTIVE,    http: 409, condition: "no ACTIVE SponsorDistribution covering the current clock links the account's sponsor to its pending model version" }
  - { id: ERR_DISTRIBUTION_WINDOW_OVERLAP,http: 409, condition: "the new half-open effective window collides with a PENDING or ACTIVE distribution on the same sponsor and model" }
  - { id: ERR_BILLING_PERIOD_OVERLAP,     http: 409, condition: "the new half-open billing period collides with a non-VOIDED invoice of the same account" }
  - { id: ERR_PAYMENT_TERM_NOT_ELAPSED,   http: 409, condition: "delinquency was declared before period_end plus 30 days" }
  - { id: ERR_UNWIND_BLOCKED,             http: 409, condition: "a TaxLot opened by the block being unwound is no longer OPEN" }
  - { id: ERR_WEIGHTS_NOT_BALANCED,       http: 422, condition: "a version was submitted with no sleeves or with sleeve weights not summing to exactly 10000" }
  - { id: ERR_SECURITY_RESTRICTED,        http: 422, condition: "a BUY order in the block targets a globally restricted security or one under an ACTIVE DO_NOT_BUY / DO_NOT_HOLD restriction for its account" }
  - { id: ERR_WASH_SALE_WINDOW_CONFLICT,  http: 422, condition: "a harvest proposal falls inside the closed 30-day purchase lookback or names the harvested security as its own replacement, or a BUY block is created while a losing lot's wash window covers the clock date" }
  - { id: ERR_HARVEST_BUDGET_EXCEEDED,    http: 422, condition: "tax overlay is disabled, or realized_loss_ytd_cents plus the proposed loss would exceed harvest_budget_cents" }
  - { id: ERR_INSUFFICIENT_SHARES,        http: 422, condition: "the account holds fewer OPEN shares of the security than the harvest requests" }
  - { id: ERR_INSUFFICIENT_CASH,          http: 422, condition: "a BUY allocation or an invoice payment exceeds the account's cash_cents" }
  - { id: ERR_BELOW_SPONSOR_MINIMUM,      http: 422, condition: "the account's market value is below the sponsor's minimum at implementation time" }
  - { id: ERR_BLOCK_COMPOSITION_INVALID,  http: 422, condition: "the order list is empty, contains a non-PROPOSED order, or mixes securities or sides" }
  - { id: ERR_FILL_EXCEEDS_REQUEST,       http: 422, condition: "filled_shares is below 1 or above the block's requested_shares" }
  - { id: ERR_NO_TRADES_GENERATED,        http: 422, condition: "a rebalance or implementation produced no tradable delta" }
  - { id: ERR_DISPERSION_SET_EMPTY,       http: 422, condition: "no non-suspended account tracking the version has ever reported a performance observation" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operations desk of the SMA platform: instrument master, street execution and allocation, logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /sma/securities"
      - "POST /sma/securities/{security_id}/price"
      - "POST /sma/sponsors"
      - "POST /sma/blocks/{block_id}/execute"
      - "POST /sma/blocks/{block_id}/allocate"
      - "POST /sma/blocks/{block_id}/unwind"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /sma/accounts/{account_id}/performance-observations (shared with SponsorOperator)"
      - "every GET endpoint"

  - name: PortfolioManager
    description: "Asset-manager staff who author, submit and publish model versions, distribute them to sponsors, and run tax-loss harvesting"
    identity: "opaque"
    exclusive_operations:
      - "POST /sma/models"
      - "POST /sma/model-versions"
      - "POST /sma/model-versions/{model_version_id}/sleeves"
      - "POST /sma/model-versions/{model_version_id}/submit"
      - "POST /sma/model-versions/{model_version_id}/publish"
      - "POST /sma/sponsor-distributions"
      - "POST /sma/harvest-proposals"
      - "POST /sma/harvest-proposals/{harvest_proposal_id}/execute"
    shared_operations:
      - "POST /sma/accounts/{account_id}/drift-evaluations (shared with SponsorOperator)"
      - "every GET endpoint"

  - name: ComplianceOfficer
    description: "Independent reviewer: approves or rejects model versions, owns account restrictions, freezes accounts, and gates harvest proposals"
    identity: "opaque"
    exclusive_operations:
      - "POST /sma/model-versions/{model_version_id}/approve"
      - "POST /sma/model-versions/{model_version_id}/reject"
      - "POST /sma/account-restrictions"
      - "POST /sma/account-restrictions/{account_restriction_id}/lift"
      - "POST /sma/accounts/{account_id}/suspend"
      - "POST /sma/accounts/{account_id}/reinstate"
      - "POST /sma/harvest-proposals/{harvest_proposal_id}/approve"
      - "POST /sma/harvest-proposals/{harvest_proposal_id}/reject"
    shared_operations:
      - "every GET endpoint"
    note: "Segregation of duties: an X-User-ID that submitted a ModelVersion may not approve or reject that version even while acting as ComplianceOfficer."

  - name: SponsorOperator
    description: "Sponsor platform operations. X-User-ID is the Sponsor.id, so every write is scoped to that sponsor's own distributions, accounts and orders."
    identity: "entity_backed:Sponsor"
    exclusive_operations:
      - "POST /sma/sponsor-distributions/{sponsor_distribution_id}/activate"
      - "POST /sma/accounts"
      - "POST /sma/accounts/{account_id}/deposits"
      - "POST /sma/accounts/{account_id}/transfers-in"
      - "POST /sma/accounts/{account_id}/implementations"
      - "POST /sma/accounts/{account_id}/rebalances"
      - "POST /sma/trade-orders/{trade_order_id}/cancel"
      - "POST /sma/blocks"
    shared_operations:
      - "POST /sma/accounts/{account_id}/drift-evaluations (shared with PortfolioManager)"
      - "POST /sma/accounts/{account_id}/performance-observations (shared with PlatformAdmin)"
      - "every GET endpoint"

  - name: BillingOfficer
    description: "Fee billing and sponsor revenue split; owns the whole FeeInvoice lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /sma/fee-invoices"
      - "POST /sma/fee-invoices/{fee_invoice_id}/issue"
      - "POST /sma/fee-invoices/{fee_invoice_id}/pay"
      - "POST /sma/fee-invoices/{fee_invoice_id}/void"
      - "POST /sma/fee-invoices/{fee_invoice_id}/mark-delinquent"
      - "POST /sma/fee-invoices/{fee_invoice_id}/write-off"
    shared_operations:
      - "every GET endpoint"
