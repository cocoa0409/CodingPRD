              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${app2_id}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${app2_id}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /classes"
              payload: { trust_fund_id: "${fund_id}", course_code: "CN-101", instructor_user_id: "inst-1", instructor_name: "I. Mason", instructor_rate_cents_per_hour: 6000, facility: "SHOP-A", rti_credit_value: 8, capacity: 1, start_minute: 600, end_minute: 720 }
              as: TrustAdmin
              captures: { cls_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { class_id: "${cls_id}", apprentice_id: "${app1_id}" }
              as: TrustAdmin
              captures: { enr1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { class_id: "${cls_id}", apprentice_id: "${app2_id}" }
