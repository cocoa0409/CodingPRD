            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2026-09-01", allocated_points: 10000 }, as: FinanceAdmin, captures: { bud: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "A", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e1: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E2", full_name: "B", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e2: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${e2}", type: PEER, points_requested: 100, reason_code: TEAMWORK, message: "hi", idempotency_key: "sm-bc-1" }, as: Employee, as_user_id: "${e1}", captures: { nom: $.data.id } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HRAdmin }
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { b_posture: $.data.posture, b_res: $.data.reserved_points } }
            - { call: "GET /api/nominations/${nom}", payload: {}, as: HRAdmin, captures: { n_st: $.data.status } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${e2}", type: PEER, points_requested: 100, reason_code: INNOVATION, message: "after close", idempotency_key: "sm-bc-2" }, as: Employee, as_user_id: "${e1}", captures: { err: $.data.error_id } }
          assert:
            - "${b_posture} == CLOSED and ${b_res} == 0"
            - "${n_st} == EXPIRED (review deadline 2026-08-15 passed before close; ordering: expiry sweep precedes budget close)"
            - "${err} == ERR_BUDGET_NOT_FOUND"

      - name: return_window_boundary_14_days
        claim_type: precondition_enforcement
        grounds: ["validations[priority=13]", "errors[ERR_RETURN_NOT_ALLOWED]"]
        distinguishing_aspect: "request-return at delivered_at + 14 days exactly is allowed (inclusive); at +15 days it is rejected ERR_RETURN_NOT_ALLOWED."
        test_recipe:
          setup: ["order delivered at 2026-08-03 (clock set before delivery)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: HRAdmin }
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "M1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 2000, reason_code: DELIVERY, message: "g", idempotency_key: "sm-rw-1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "V", vendor_code: "V1", daily_ship_capacity: 10, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "M", name: "Mug", category: "MERCH", point_cost: 100, cash_value_cents: 500, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item: $.data.id } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "sm-rw-r1" }, as: Employee, as_user_id: "${emp}", captures: { ord: $.data.id } }
            - { call: "POST /api/redemption-orders/${ord}/submit", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ord}/mark-shipped", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ord}/mark-delivered", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "sm-rw-r2" }, as: Employee, as_user_id: "${emp}", captures: { ord2: $.data.id } }
            - { call: "POST /api/redemption-orders/${ord2}/submit", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ord2}/mark-shipped", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ord2}/mark-delivered", payload: {}, as: VendorOps }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: HRAdmin }
            - { call: "POST /api/redemption-orders/${ord}/request-return", payload: { reason: "exactly 14 days" }, as: Employee, as_user_id: "${emp}", captures: { st1: $.data.fulfillment_status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T00:00:01Z" }, as: HRAdmin }
            - { call: "POST /api/redemption-orders/${ord2}/request-return", payload: { reason: "too late" }, as: Employee, as_user_id: "${emp}", captures: { err: $.data.error_id } }
          assert:
            - "${st1} == RETURN_REQUESTED"
            - "${err} == ERR_RETURN_NOT_ALLOWED"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: tier_boundary_exactly_1000_silver
        claim_type: boundary
        grounds: [calculations.tier_assignment]
        distinguishing_aspect: "Tier thresholds are inclusive lower bounds: lifetime_granted 999 leaves BRONZE; exactly 1000 promotes to SILVER."
        test_recipe:
          setup: ["employee with one approved 999-point award"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 100000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "M1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 999, reason_code: TEAMWORK, message: "g1", idempotency_key: "calc-tier-1" }, as: Manager, as_user_id: "${mgr}", captures: { n1: $.data.id, n1_v: $.data.version } }
            - { call: "POST /api/nominations/${n1}/approve", payload: { expected_nomination_version: "${n1_v}" }, as: HRAdmin }
          trigger:
            - { call: "GET /api/employees/${emp}", payload: {}, as: HRAdmin, captures: { t1: $.data.recognition_tier } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 1, reason_code: INNOVATION, message: "g2", idempotency_key: "calc-tier-2" }, as: Manager, as_user_id: "${mgr}", captures: { n2: $.data.id, n2_v: $.data.version } }
            - { call: "POST /api/nominations/${n2}/approve", payload: { expected_nomination_version: "${n2_v}" }, as: HRAdmin }
            - { call: "GET /api/employees/${emp}", payload: {}, as: HRAdmin, captures: { t2: $.data.recognition_tier, life: $.data.lifetime_granted_points } }
          assert:
            - "${t1} == BRONZE (999 < 1000)"
            - "${life} == 1000 and ${t2} == SILVER (>= 1000)"

      - name: de_minimis_cap_all_or_nothing
        claim_type: boundary
        grounds: [calculations.de_minimis_exclusion]
        distinguishing_aspect: "De-minimis is all-or-nothing against the 10000-cent annual cap: a first 6000-cent item is excluded (ytd 6000 <= 10000); a second 6000-cent item would land at 12000 > 10000, so the SECOND item is FULLY taxable (taxable_value_cents == 6000, not the 4000 excess)."
        test_recipe:
          setup: ["employee granted 4000 points; two deliveries of a de_minimis_eligible 2000-point / 6000-cent item"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 }, grossup_enabled: true }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 100000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "M1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 4000, reason_code: DELIVERY, message: "g", idempotency_key: "calc-dm-1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "V", vendor_code: "V1", daily_ship_capacity: 10, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "PLQ", name: "Plaque", category: "MERCH", point_cost: 2000, cash_value_cents: 6000, taxable_class: MERCHANDISE, de_minimis_eligible: true, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item: $.data.id } }
          trigger:
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "calc-dm-r1" }, as: Employee, as_user_id: "${emp}", captures: { o1: $.data.id } }
            - { call: "POST /api/redemption-orders/${o1}/submit", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${o1}/mark-shipped", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${o1}/mark-delivered", payload: {}, as: VendorOps, captures: { tr1: $.data.tax_record_id } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "calc-dm-r2" }, as: Employee, as_user_id: "${emp}", captures: { o2: $.data.id } }
            - { call: "POST /api/redemption-orders/${o2}/submit", payload: {}, as: VendorOps }
