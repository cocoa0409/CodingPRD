        grounds:
          - state_machines.Appeal.DECIDED_to_ACCEPTED
          - state_machines.Appeal.DECIDED_to_ESCALATED
          - state_machines.Appeal.ESCALATED_to_CLOSED
        distinguishing_aspect: |
          The Appeal machine is a branching fork-join: DECIDED forks to ACCEPTED
