            - "One ACTIVE OWNED EquipmentItem with insured_value_cents 8160000."
            - "One INSPECTED Claim on that item with repair_estimate_cents 3000000 and actual_value_at_loss_cents 8160000."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
