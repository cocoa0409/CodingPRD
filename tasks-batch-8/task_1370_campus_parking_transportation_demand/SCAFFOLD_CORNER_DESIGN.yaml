  # ============================================================ calculations
  - section: calculations
    instances:
      - name: refund_prorated_after_term_start
        claim_type: correct_result
        grounds: ["calculations.permit_refund_calculation"]
        distinguishing_aspect: "Cancellation after valid_from refunds the prorated remainder minus the 500-cent admin fee: full-term 84000 permit cancelled on 2026-09-28 leaves 55 of 112 days -> round(84000*55/112) - 500 = 40750."
        test_recipe:
          setup: ["patron bought a full-term permit (84000) at clock 2026-08-01; clock advanced to 2026-09-28"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "R", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { r_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LR", name: "Lot R", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_r: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_r}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_r: $.data.id }
            - call: "GET /parking/allocations/${alloc_r}"
              as: ParkingAdmin
              captures: { v_r: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${r_id}", allocation_id: "${alloc_r}", plate_number: "R111", expected_allocation_version: "${v_r}" }
              as: ParkingAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /parking/transportation-funds"
              payload: { fund_code: "PTS_OPERATING" }
              as: ParkingAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-28T00:00:00Z" }
              as: ParkingAdmin
          trigger:
            - call: "POST /parking/permits/${permit_id}/cancel"
              payload: {}
              as: ParkingAdmin
              captures: { refund: $.data.refund_cents, p_status: $.data.status }
            - call: "GET /parking/transportation-funds/${fund_id}"
              as: ParkingAdmin
              captures: { fund_rev: $.data.permit_revenue_cents }
          assert:
            - "captured refund == 40750 (round_half_up(84000 * 55 / 112) - 500 = 41250 - 500) and p_status == CANCELLED"
            - "captured fund_rev == 43250 (84000 - 40750)"

      - name: refund_full_before_term_start
        claim_type: correct_result
        grounds: ["calculations.permit_refund_calculation"]
        excluded_because:
          difficulty_instance: purchase_cancel_restores_allocation_seats
          rationale: "The full-refund-before-valid_from branch (refund == fee_paid 84000, no admin fee) is asserted verbatim in the named §1.8 instance."

      - name: lot_availability_aggregation
