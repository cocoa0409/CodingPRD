# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Propane / Heating Oil Delivery (Expert)
# Breadth probe over the claim-extraction-guide taxonomy.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "POST /accounts with all required fields returns 201; service_status=ACTIVE, credit_balance_cents=0, version=1, id/created_at minted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { customer_name: "New Nora", region_code: "NE_01", fuel_type: "HEATING_OIL" }
              as: AccountManager
              captures: { acct_id: $.data.id, svc: $.data.service_status, ver: $.data.version }
          assert:
            - "response_type == object"
            - "Account.${acct_id}.service_status == ACTIVE"
            - "Account.${acct_id}.credit_balance_cents == 0"
            - "Account.${acct_id}.version == 1"

      - name: get_account_returns_stored_data
        claim_type: Retrieval
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "GET /accounts/{id} returns the account with matching id and fields."
        test_recipe:
          setup: ["One account exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Read Ray", region_code: "NE_02", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Dispatcher
              captures: { got: $.data.id, region: $.data.region_code }
          assert:
            - "got == ${acct_id}"
            - "Account.${acct_id}.region_code == NE_02"

      - name: list_accounts_paginated_with_total_count
        claim_type: Listing
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "GET /accounts returns a paginated array with total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["Two accounts exist."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "A One", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
            - call: "POST /accounts"
              payload: { customer_name: "A Two", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
          trigger:
            - call: "GET /accounts"
              payload: {}
              as: Dispatcher
          assert:
            - "response_type == array"
            - "total_count >= 2"

      - name: get_account_not_found
        claim_type: Not Found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "endpoints"
        distinguishing_aspect: "GET /accounts/{nonexistent} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: create_account_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Account.fields.region_code"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /accounts missing region_code returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { customer_name: "No Region", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: create_tank_invalid_fuel_enum_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Account.fields.fuel_type"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /accounts with fuel_type not in {PROPANE, HEATING_OIL} returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { customer_name: "Bad Fuel", region_code: "NE_01", fuel_type: "COAL" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: tank_defaults_applied_when_omitted
        claim_type: Defaults
        grounds: [entities.Tank.fields.reorder_threshold_pct, entities.Tank.fields.delivery_mode, entities.Tank.fields.monitor_installed]
        distinguishing_aspect: "POST tank omitting reorder_threshold_pct/delivery_mode/monitor_installed applies defaults 30 / WILL_CALL / false."
        test_recipe:
          setup: ["One account."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Def Dee", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1500 }
              as: AccountManager
              captures: { thr: $.data.reorder_threshold_pct, mode: $.data.delivery_mode, mon: $.data.monitor_installed }
          assert:
            - "thr == 30"
            - "mode == WILL_CALL"
            - "mon == false"

      - name: system_fields_ignored_on_input
        claim_type: System Fields
        grounds: [entities.Account.fields.service_status, entities.Account.fields.credit_balance_cents]
        distinguishing_aspect: "Client-supplied service_status/credit_balance_cents/id are ignored; server sets ACTIVE/0 and mints id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { customer_name: "Sneaky Sam", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { svc: $.data.service_status, credit: $.data.credit_balance_cents }
          assert:
            - "svc == ACTIVE   # any input override ignored"
            - "credit == 0"

      - name: monitor_reading_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.TankMonitorReading]
        distinguishing_aspect: "TankMonitorReading is common_fields:false (id + created_at only); no version field, no update endpoint exists."
        test_recipe:
          setup: ["A tank with one reading."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Imm Ida", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1500, current_gallons: 100 }
              as: AccountManager
              captures: { tank_id: $.data.id }
          trigger:
            - call: "POST /tanks/${tank_id}/readings"
              payload: { reading_gallons: 200, read_at: "2026-01-01T00:00:00Z" }
              as: Driver
              captures: { rid: $.data.id }
          assert:
            - "TankMonitorReading.${rid}.id is present   # reading created; no version/update surface declared"

      - name: tank_requires_existing_account_parent
        claim_type: Parent Relationships
        grounds:
          - "entities.Tank.fields.account_id"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /accounts/{bad}/tanks against a non-existent account returns ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts/00000000-0000-0000-0000-000000000000/tanks"
              payload: { capacity_gallons: 500, k_factor: 1500 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: tank_account_fk_reverse_reachable
        claim_type: Foreign key references validated
        grounds: [entities.Tank.fields.account_id, endpoints]
        distinguishing_aspect: "GET /tanks?account_id={id} returns the tanks whose account_id == id (FK reverse-reachability)."
        test_recipe:
          setup: ["Account with two tanks."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "FK Fred", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1500 }
              as: AccountManager
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 300, k_factor: 1200 }
              as: AccountManager
          trigger:
            - call: "GET /tanks"
              payload: { account_id: "${acct_id}" }
              as: Dispatcher
          assert:
            - "response_type == array"
            - "total_count == 2"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: account_starts_active
        claim_type: Initial State
        grounds: [state_machines.Account.ACTIVE_to_SUSPENDED, entities.Account.fields.service_status]
        distinguishing_aspect: "Newly created Account has service_status == ACTIVE (initial_state)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { customer_name: "Init Ivy", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { svc: $.data.service_status }
          assert:
            - "svc == ACTIVE"

      - name: suspend_then_reactivate_account
        claim_type: Valid Transition
        grounds: [state_machines.Account.ACTIVE_to_SUSPENDED, state_machines.Account.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "ACTIVE->SUSPENDED via /suspend then SUSPENDED->ACTIVE via /reactivate; service_status follows."
        test_recipe:
          setup: ["An ACTIVE account."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Susp Sue", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/suspend"
              payload: {}
              as: AccountManager
              captures: { s1: $.data.service_status }
          trigger:
            - call: "POST /accounts/${acct_id}/reactivate"
              payload: {}
              as: AccountManager
              captures: { s2: $.data.service_status }
          assert:
            - "s1 == SUSPENDED"
            - "Account.${acct_id}.service_status == ACTIVE"

      - name: reactivate_active_account_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Account.SUSPENDED_to_ACTIVE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Reactivate on an ACTIVE account (not SUSPENDED) returns ERR_INVALID_STATE; no state change."
        test_recipe:
          setup: ["An ACTIVE account."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Active Al", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/reactivate"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: closed_account_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Account.ACTIVE_to_CLOSED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "From CLOSED (terminal), suspend is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["An account with no open orders/leases, closed."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Closed Cleo", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/close"
              payload: {}
              as: AccountManager
              captures: { s: $.data.service_status }
          trigger:
            - call: "POST /accounts/${acct_id}/suspend"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "s == CLOSED"
            - "err == ERR_INVALID_STATE"

      - name: close_account_with_open_order_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Account.ACTIVE_to_CLOSED"
          - "errors[ERR_ACCOUNT_HAS_OPEN_ORDERS]"
        distinguishing_aspect: "Close on an account holding a CREATED delivery order returns ERR_ACCOUNT_HAS_OPEN_ORDERS."
        test_recipe:
          setup: ["Account with a CREATED will-call order."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Open Olga", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1500, current_gallons: 100 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders"
              payload: { tank_id: "${tank_id}", requested_gallons: 100 }
              as: Dispatcher
          trigger:
            - call: "POST /accounts/${acct_id}/close"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ACCOUNT_HAS_OPEN_ORDERS"

      - name: priceplan_activate_expires_prior_active
        claim_type: Side Effect Execution
        grounds: [state_machines.PricePlan.DRAFT_to_ACTIVE, state_machines.PricePlan.ACTIVE_to_EXPIRED, entities.Account.fields.active_price_plan_id]
        distinguishing_aspect: "Activating a second plan expires the first (ACTIVE->EXPIRED) and Account.active_price_plan_id points to the new plan."
        test_recipe:
          setup: ["Account with one ACTIVE FIXED plan; a second DRAFT FIXED plan."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Plan Pam", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans"
              payload: { plan_type: "FIXED", locked_price_cents_per_gallon: 300 }
              as: AccountManager
              captures: { plan1_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans/${plan1_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /accounts/${acct_id}/price-plans"
              payload: { plan_type: "FIXED", locked_price_cents_per_gallon: 280 }
              as: AccountManager
              captures: { plan2_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/price-plans/${plan2_id}/activate"
              payload: {}
              as: AccountManager
            - call: "GET /price-plans/${plan1_id}"
              payload: {}
              as: AccountManager
              captures: { p1_status: $.data.status }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { active_id: $.data.active_price_plan_id }
          assert:
            - "PricePlan.${plan1_id}.status == EXPIRED"
            - "active_id == ${plan2_id}"

      - name: route_auto_completes_when_last_order_delivered
        claim_type: Bubble up
        grounds: [state_machines.DeliveryRoute.DISPATCHED_to_COMPLETED, state_machines.DeliveryOrder.SCHEDULED_to_DELIVERED]
        distinguishing_aspect: "When the last SCHEDULED order on a DISPATCHED route is DELIVERED, the route auto-transitions DISPATCHED->COMPLETED."
        test_recipe:
          setup: ["Account ACTIVE FIXED plan; PASSED tank; one order SCHEDULED on a DISPATCHED route."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Comp Cob", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans"
              payload: { plan_type: "FIXED", locked_price_cents_per_gallon: 300 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1500, current_gallons: 100 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /tanks/${tank_id}/inspections"
              payload: { result: "PASSED", inspected_at: "2026-01-01T00:00:00Z" }
              as: Inspector
            - call: "POST /trucks"
              payload: { region_code: "NE_01", daily_capacity_gallons: 1000 }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-03-01T00:00:00Z", window_start: "2026-03-01T09:00:00Z", window_end: "2026-03-01T12:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders"
              payload: { tank_id: "${tank_id}", requested_gallons: 200 }
              as: Dispatcher
              captures: { order_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/assign"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /trucks/${truck_id}/routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/deliver"
              payload: { delivered_gallons: 200, expected_account_version: "${acct_v}" }
              as: Driver
            - call: "GET /routes/${route_id}"
              payload: {}
              as: Dispatcher
              captures: { route_status: $.data.status }
          assert:
            - "DeliveryRoute.${route_id}.status == COMPLETED"

      - name: dispatch_empty_route_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.DeliveryRoute.PLANNING_to_DISPATCHED"
          - "errors[ERR_ROUTE_EMPTY]"
        distinguishing_aspect: "Dispatching a PLANNING route with zero SCHEDULED orders returns ERR_ROUTE_EMPTY."
        test_recipe:
          setup: ["A PLANNING route with no orders."]
          setup_api_calls:
            - call: "POST /trucks"
              payload: { region_code: "NE_01", daily_capacity_gallons: 1000 }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-03-02T00:00:00Z", window_start: "2026-03-02T09:00:00Z", window_end: "2026-03-02T12:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /trucks/${truck_id}/routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ROUTE_EMPTY"

      - name: order_hold_resume_cycle_corner
        claim_type: cyclic
        grounds: [state_machines.DeliveryOrder.SCHEDULED_to_HOLD, state_machines.DeliveryOrder.HOLD_to_SCHEDULED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / delivery_order_hold_resume_cycle
          rationale: "The SCHEDULED<->HOLD cycle with reservation release/re-reserve is the named §1.8 instance."

      - name: deliver_overfill_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.DeliveryOrder.SCHEDULED_to_DELIVERED"
          - "errors[ERR_DELIVERY_OVERFILL]"
          - "validations[priority=12]"
        distinguishing_aspect: "Deliver where current_gallons + delivered_gallons > capacity_gallons returns ERR_DELIVERY_OVERFILL."
        test_recipe:
          setup: ["Account ACTIVE FIXED plan; tank capacity 500 current 400 PASSED; order SCHEDULED on DISPATCHED route; deliver 200 (400+200>500)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Over Otto", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans"
              payload: { plan_type: "FIXED", locked_price_cents_per_gallon: 300 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1500, current_gallons: 400 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /tanks/${tank_id}/inspections"
              payload: { result: "PASSED", inspected_at: "2026-01-01T00:00:00Z" }
              as: Inspector
            - call: "POST /trucks"
              payload: { region_code: "NE_01", daily_capacity_gallons: 1000 }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-03-03T00:00:00Z", window_start: "2026-03-03T09:00:00Z", window_end: "2026-03-03T12:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders"
              payload: { tank_id: "${tank_id}", requested_gallons: 200 }
              as: Dispatcher
              captures: { order_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/assign"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /trucks/${truck_id}/routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/deliver"
              payload: { delivered_gallons: 200, expected_account_version: "${acct_v}" }
              as: Driver
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DELIVERY_OVERFILL"

  # ===========================================================================
  - section: calculations
    instances:
      - name: monthly_installment_round_half_up
        claim_type: Correct Result
        grounds: [calculations.monthly_installment, entities.BudgetPlan.fields.monthly_installment_cents]
        distinguishing_aspect: "estimated 1000 gal * 305 c = 305000 / 12 = 25416.67 -> round_half_up 25417."
        test_recipe:
          setup: ["An account."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Round Rod", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/budget-plans"
              payload: { plan_year_start: "2026-01-01T00:00:00Z", estimated_annual_gallons: 1000, estimated_price_cents_per_gallon: 305 }
              as: AccountManager
              captures: { mi: $.data.monthly_installment_cents }
          assert:
            - "mi == 25417   # monthly_installment_cents == round_half_up(305000/12)"

      - name: delivery_price_market_volume_tier2
        claim_type: Constants Applied
        grounds: [calculations.delivery_price, entities.PricePlan.fields.plan_type, entities.MarketPrice.fields.market_price_cents_per_gallon]
        distinguishing_aspect: "MARKET base 350, delivered 320 (>=300 tier2) subtracts 12 => 338; invoice 320*338 + off_route 2500."
        test_recipe:
          setup: ["Account ACTIVE MARKET plan; ACTIVE MarketPrice 350; PASSED tank cap 700 cur 100; order 320 STANDARD on DISPATCHED route."]
          setup_api_calls:
            - call: "POST /market-prices"
              payload: { region_code: "NE_01", fuel_type: "PROPANE", market_price_cents_per_gallon: 350 }
              as: AccountManager
            - call: "POST /accounts"
              payload: { customer_name: "Mkt Mia", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans"
              payload: { plan_type: "MARKET" }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans/${plan_id}/activate"
              payload: {}
