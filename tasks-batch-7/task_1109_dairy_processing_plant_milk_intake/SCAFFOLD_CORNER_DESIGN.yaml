# =============================================================================
# Task 1109 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: producer_creation_returns_system_fields
        claim_type: creation
        grounds: [entities.Producer]

        distinguishing_aspect: "POST /dairy/producers with valid input returns 201 and a body containing id, created_at, updated_at, version=1, plus the three input fields and computed rolling_rejection_count_30d=0, quality_flag=STANDARD, status=ACTIVE."
        test_recipe:
          setup: ["Empty DB; clock at default"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
          trigger:
            - call: "POST /dairy/producers"
              payload: { producer_code: "PX1", farm_name: "Farm X1", base_hauling_rate_cents_per_cwt: 150 }
              as: PlantController
              captures: { pid: $.data.id, ver: $.data.version, rf: $.data.quality_flag, rc: $.data.rolling_rejection_count_30d, st: $.data.status }
          assert:
            - "Producer.${pid}.version == 1"
            - "Producer.${pid}.quality_flag == STANDARD"
            - "Producer.${pid}.rolling_rejection_count_30d == 0"
            - "Producer.${pid}.status == ACTIVE"

      - name: producer_list_pagination
        claim_type: listing
        grounds: [entities.Producer, endpoints]

        distinguishing_aspect: "GET /dairy/producers respects limit/offset and reports total_count and has_more correctly when more than `limit` producers exist."
        test_recipe:
          setup: ["12 producers created"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PL1", farm_name: "F1", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PL2", farm_name: "F2", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PL3", farm_name: "F3", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PL4", farm_name: "F4", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PL5", farm_name: "F5", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PL6", farm_name: "F6", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PL7", farm_name: "F7", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PL8", farm_name: "F8", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PL9", farm_name: "F9", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PL10", farm_name: "F10", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PL11", farm_name: "F11", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PL12", farm_name: "F12", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
          trigger:
            - call: "GET /dairy/producers?limit=10&offset=0"
              as: PlantController
              captures: { page_total: "$.data[0].id" }
          assert:
            - "Response envelope contains limit=10, offset=0, total_count=12, has_more=true"

      - name: producer_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Producer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /dairy/producers/{random-uuid} returns 404 with ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
          trigger:
            - call: "GET /dairy/producers/11111111-1111-4111-8111-111111111111"
              as: PlantController
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND"

      - name: tanker_receipt_net_weight_computed
        claim_type: computed_field
        grounds: [entities.TankerReceipt.fields.net_weight_lbs]

        distinguishing_aspect: "TankerReceipt.net_weight_lbs is computed by the server (= gross - tare) even if client attempts to inject it; input value ignored."
        test_recipe:
          setup: ["Producer, hauler, permit all set up"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PC1", farm_name: "FC1", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "HC1", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
          trigger:
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 75000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { net: $.data.net_weight_lbs }
          assert:
            - "TankerReceipt.net_weight_lbs == 45000 (gross 75000 - tare 30000)"

      - name: tanker_receipt_tare_must_be_less_than_gross
        claim_type: type_constraints
        grounds: [entities.TankerReceipt.fields.tare_weight_lbs, "errors[ERR_INVALID_INPUT]"]

        distinguishing_aspect: "TankerReceipt creation with tare_weight_lbs >= gross_weight_lbs fails validation."
        test_recipe:
          setup: ["Producer, hauler created"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PC2", farm_name: "FC2", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "HC2", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
          trigger:
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 30000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_INPUT"

      - name: producer_code_required_field
        claim_type: required_fields
        grounds: [entities.Producer.fields.producer_code, "errors[ERR_INVALID_INPUT]"]

        distinguishing_aspect: "POST /dairy/producers without producer_code returns 400 ERR_INVALID_INPUT."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
          trigger:
            - call: "POST /dairy/producers"
              payload: { farm_name: "NoCode", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_INPUT"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: tanker_receipt_initial_state_quarantine
        claim_type: initial_state
        grounds: [state_machines.TankerReceipt]

        distinguishing_aspect: "A newly created TankerReceipt has disposition == QUARANTINE."
        test_recipe:
          setup: ["Producer, hauler exist"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PS1", farm_name: "FS1", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "HS1", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
          trigger:
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 50000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { disp: $.data.disposition }
          assert:
            - "TankerReceipt.disposition == QUARANTINE"

      - name: lab_test_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.LabTest]

        distinguishing_aspect: "Once LabTest is COMPLETED (terminal), no further transitions allowed; second complete returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Receipt with one COMPLETED lab test"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PT1", farm_name: "FT1", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "HT1", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 50000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { rcpt: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 0, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests/${lt}/complete"
              payload: {}
              as: LabTechnician
          trigger:
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests/${lt}/complete"
              payload: {}
              as: LabTechnician
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 ERR_INVALID_STATE — COMPLETED is terminal"

      - name: receipt_reject_without_criterion_fails
        claim_type: precondition_enforcement
        grounds: [state_machines.TankerReceipt.QUARANTINE_to_REJECTED, "errors[ERR_NO_REJECTION_CRITERION]"]

        distinguishing_aspect: "POST /reject on a receipt whose lab tests all pass returns ERR_NO_REJECTION_CRITERION (rejection requires at least one matching criterion)."
        test_recipe:
          setup: ["Receipt with passing lab tests"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PU1", farm_name: "FU1", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "HU1", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 50000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { rcpt: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 0, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt1: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests"
              payload: { test_type: "SCC", result_value: 300000, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt2: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests/${lt1}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests/${lt2}/complete"
              payload: {}
              as: LabTechnician
          trigger:
            - call: "POST /dairy/tanker-receipts/${rcpt}/reject"
              payload: {}
              as: QualityAssuranceManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 ERR_NO_REJECTION_CRITERION"

      - name: release_blocked_when_lab_tests_pending
        claim_type: precondition_enforcement
        grounds: [state_machines.TankerReceipt.QUARANTINE_to_RELEASED_FOR_PROCESSING, "errors[ERR_LAB_TESTS_PENDING]"]

        distinguishing_aspect: "POST /release when only ANTIBIOTIC lab test is COMPLETED but SCC is DRAFT returns ERR_LAB_TESTS_PENDING."
        test_recipe:
          setup: ["Receipt with only ANTIBIOTIC completed; SCC never created"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PV1", farm_name: "FV1", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "HV1", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-V1", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 50000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { rcpt: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 0, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt1: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests/${lt1}/complete"
              payload: {}
              as: LabTechnician
          trigger:
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { prod_v_1: "$.data.version" }
            - call: "POST /dairy/tanker-receipts/${rcpt}/release"
              payload: { expected_producer_version: "${prod_v_1}" }
              as: QualityAssuranceManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 ERR_LAB_TESTS_PENDING"

      - name: temperature_boundary_45F
        claim_type: precondition_enforcement
        grounds: [state_machines.TankerReceipt.QUARANTINE_to_RELEASED_FOR_PROCESSING, "errors[ERR_TEMPERATURE_EXCEEDED]"]

        distinguishing_aspect: "Receipt with temperature_f == 45 releases; with temperature_f == 46 (or any value > 45) returns ERR_TEMPERATURE_EXCEEDED."
        test_recipe:
          setup: ["Receipt with temperature_f=46 and otherwise clean"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PW1", farm_name: "FW1", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "HW1", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-W1", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 50000, tare_weight_lbs: 30000, temperature_f: 46 }
              as: QualityAssuranceManager
              captures: { rcpt: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 0, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt1: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests"
              payload: { test_type: "SCC", result_value: 300000, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt2: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests/${lt1}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests/${lt2}/complete"
              payload: {}
              as: LabTechnician
          trigger:
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { prod_v_2: "$.data.version" }
            - call: "POST /dairy/tanker-receipts/${rcpt}/release"
              payload: { expected_producer_version: "${prod_v_2}" }
              as: QualityAssuranceManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 ERR_TEMPERATURE_EXCEEDED (temperature 46 > 45)"

      - name: complete_run_blocked_by_unfinished_batches
        claim_type: precondition_enforcement
        grounds: [state_machines.PasteurizerRun.RUNNING_to_COMPLETE, "errors[ERR_BATCHES_UNFINISHED]"]

        distinguishing_aspect: "POST /complete on a RUNNING run with a batch still IN_PRODUCTION returns ERR_BATCHES_UNFINISHED."
        test_recipe:
          setup: ["Run RUNNING with one batch IN_PRODUCTION"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T06:00:00Z" }
              as: PlantController
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-X1", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/pasteurizer-runs"
              payload: { pasteurizer_id: "HTST-1", scheduled_start_at: "2026-05-10T08:00:00Z", scheduled_end_at: "2026-05-10T12:00:00Z", flow_rate_gph: 5000, min_hold_temp_f: 161 }
              as: PasteurizerOperator
              captures: { run_id: $.data.id }
            - call: "POST /dairy/pasteurizer-runs/${run_id}/cip-cycles"
              payload: { started_at: "2026-05-10T06:00:00Z", caustic_conductivity_ms: 90.0, rinse_ph: 7.0 }
              as: PasteurizerOperator
              captures: { cip: $.data.id }
            - call: "POST /dairy/pasteurizer-runs/${run_id}/cip-cycles/${cip}/validate"
              payload: {}
              as: QualityAssuranceManager
            - call: "POST /dairy/pasteurizer-runs/${run_id}/start"
              payload: {}
              as: PasteurizerOperator
            - call: "POST /dairy/pasteurizer-runs/${run_id}/batches"
              payload: { product_code: "WHOLE_MILK", quantity_gallons: 1000, shelf_life_days: 14 }
              as: PasteurizerOperator
              captures: { batch: $.data.id }
            - call: "POST /dairy/pasteurizer-runs/${run_id}/batches/${batch}/begin"
              payload: {}
              as: PasteurizerOperator
          trigger:
            - call: "POST /dairy/pasteurizer-runs/${run_id}/complete"
              payload: {}
              as: PasteurizerOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 ERR_BATCHES_UNFINISHED"

      - name: cancel_run_blocked_by_in_production_batch
        claim_type: precondition_enforcement
        grounds: [state_machines.PasteurizerRun.SCHEDULED_to_CANCELLED, "errors[ERR_BATCH_IN_PRODUCTION]"]

        distinguishing_aspect: "POST /cancel on a SCHEDULED run whose batch is IN_PRODUCTION returns ERR_BATCH_IN_PRODUCTION."
        test_recipe:
          setup: ["Run with IN_PRODUCTION batch (requires the run to be RUNNING first to begin a batch) — but for this corner, the run state is the issue: cancel requires SCHEDULED"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T06:00:00Z" }
              as: PlantController
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-X2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/pasteurizer-runs"
              payload: { pasteurizer_id: "HTST-1", scheduled_start_at: "2026-05-10T08:00:00Z", scheduled_end_at: "2026-05-10T12:00:00Z", flow_rate_gph: 5000, min_hold_temp_f: 161 }
              as: PasteurizerOperator
              captures: { run_id: $.data.id }
            - call: "POST /dairy/pasteurizer-runs/${run_id}/cip-cycles"
              payload: { started_at: "2026-05-10T06:00:00Z", caustic_conductivity_ms: 90.0, rinse_ph: 7.0 }
              as: PasteurizerOperator
              captures: { cip: $.data.id }
