scaffold_difficulty_design:
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_payout_pro_rata_vs_deposit_forfeit
        grounds:
          - calculations.refund_payout
          - entities.TreatmentPackage.fields.refund_mode
          - entities.RefundClaim.fields.refund_amount_cents
          - state_machines.RefundClaim.PENDING_to_PAID
        distinguishing_aspect: |
          Same collected amount (500000) and deposit (50000) on RefundClaim yields refund_amount_cents==450000
          under PRO_RATA but 425000 under DEPOSIT_FORFEIT (extra 25000 GUARANTEE_FEE clawback) — a calculation on
          the RefundClaim/TreatmentPackage domain, distinct from the SurgeryCase financial-axis variant below.
        test_recipe:
          setup:
            - "Two PAID_IN_FULL, HEALED SurgeryCases that missed their guarantee (final VA 0.5 < 1.0); one on a PRO_RATA package, one on a DEPOSIT_FORFEIT package, both base 500000 / deposit 50000."
          setup_api_calls:
            - call: "POST /refractive/packages"
              payload: { tier: "STANDARD", base_price_cents: 500000, deposit_cents: 50000, enhancement_window_days: 365, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "PRO_RATA" }
              as: Coordinator
              captures: { pkg_pr: $.data.id }
            - call: "POST /refractive/packages"
              payload: { tier: "STANDARD", base_price_cents: 500000, deposit_cents: 50000, enhancement_window_days: 365, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "DEPOSIT_FORFEIT" }
              as: Coordinator
              captures: { pkg_df: $.data.id }
            - call: "POST /refractive/surgeons"
              payload: { full_name: "Dr A", max_daily_cases: 5 }
              as: Coordinator
              captures: { surg_id: $.data.id }
            - call: "POST /refractive/suites"
              payload: { name: "S1", turnaround_buffer_minutes: 15, daily_case_cap: 5 }
              as: Coordinator
              captures: { suite_id: $.data.id }
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat1: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P2", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat2: $.data.id }
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr1: $.data.id }
            - call: "POST /refractive/screenings/${scr1}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /refractive/screenings/${scr1}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat2}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr2: $.data.id }
            - call: "POST /refractive/screenings/${scr2}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /refractive/screenings/${scr2}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/cases"
              payload: { patient_id: "${pat1}", screening_id: "${scr1}", package_id: "${pkg_pr}" }
              as: Coordinator
              captures: { case1: $.data.id, case1_v: $.data.version }
            - call: "POST /refractive/cases"
              payload: { patient_id: "${pat2}", screening_id: "${scr2}", package_id: "${pkg_df}" }
              as: Coordinator
              captures: { case2: $.data.id, case2_v: $.data.version }
            - call: "POST /refractive/cases/${case1}/financing"
              payload: { down_payment_cents: 500000, term_months: 1, apr_bps: 0 }
              as: Coordinator
            - call: "POST /refractive/cases/${case2}/financing"
              payload: { down_payment_cents: 500000, term_months: 1, apr_bps: 0 }
              as: Coordinator
            - call: "POST /refractive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: Coordinator
            - call: "POST /refractive/cases/${case1}/bookings"
              payload: { suite_id: "${suite_id}", surgeon_id: "${surg_id}", slot_start: "2026-06-01T09:00:00Z", slot_end: "2026-06-01T10:00:00Z", expected_case_version: "${case1_v}" }
              as: Coordinator
            - call: "POST /refractive/cases/${case2}/bookings"
              payload: { suite_id: "${suite_id}", surgeon_id: "${surg_id}", slot_start: "2026-06-01T11:00:00Z", slot_end: "2026-06-01T12:00:00Z", expected_case_version: "${case2_v}" }
              as: Coordinator
            - call: "POST /refractive/cases/${case1}/consent"
              payload: { drops_regimen_started: true, signed_by_patient_id: "${pat1}" }
              as: Patient
              as_user_id: "${pat1}"
            - call: "POST /refractive/cases/${case2}/consent"
              payload: { drops_regimen_started: true, signed_by_patient_id: "${pat2}" }
              as: Patient
              as_user_id: "${pat2}"
            - call: "POST /refractive/cases/${case1}/operate"
              payload: {}
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/cases/${case2}/operate"
              payload: {}
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: Coordinator
            - call: "POST /refractive/cases/${case1}/heal"
              payload: { final_uncorrected_va: 0.5 }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/cases/${case2}/heal"
              payload: { final_uncorrected_va: 0.5 }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/refund-claims"
              payload: { case_id: "${case1}" }
              as: Coordinator
              captures: { claim_pr: $.data.id }
            - call: "POST /refractive/refund-claims"
              payload: { case_id: "${case2}" }
              as: Coordinator
              captures: { claim_df: $.data.id }
          trigger:
            - call: "POST /refractive/refund-claims/${claim_pr}/adjudicate"
              payload: { decision: "PAY" }
              as: Coordinator
              captures: { pr_amount: $.data.refund_amount_cents }
            - call: "POST /refractive/refund-claims/${claim_df}/adjudicate"
              payload: { decision: "PAY" }
              as: Coordinator
              captures: { df_amount: $.data.refund_amount_cents }
          assert:
            - "RefundClaim.${claim_pr}.refund_amount_cents == 450000"
            - "RefundClaim.${claim_df}.refund_amount_cents == 425000"
            - "RefundClaim.${claim_pr}.refund_amount_cents - RefundClaim.${claim_df}.refund_amount_cents == 25000"

      - name: financing_deposit_paid_vs_paid_in_full_variant
        grounds:
          - state_machines.SurgeryCase.financial_status=UNFUNDED_to_financial_status=DEPOSIT_PAID
          - state_machines.SurgeryCase.financial_status=UNFUNDED_to_financial_status=PAID_IN_FULL
          - entities.FinancingPlan.fields.status
          - entities.SurgeryCase.fields.financial_status
        distinguishing_aspect: |
          Same POST /cases/{id}/financing endpoint on the SurgeryCase domain produces divergent outcomes: down_payment < base
          yields FinancingPlan.status==OPEN + case.financial_status==DEPOSIT_PAID, while down_payment == base yields
          FinancingPlan.status==SETTLED + case.financial_status==PAID_IN_FULL — a distinct entity domain from the RefundClaim variant.
        test_recipe:
          setup:
            - "Two PLANNED/UNFUNDED cases on the same STANDARD package (base 500000, deposit 50000)."
          setup_api_calls:
            - call: "POST /refractive/packages"
              payload: { tier: "STANDARD", base_price_cents: 500000, deposit_cents: 50000, enhancement_window_days: 365, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "PRO_RATA" }
              as: Coordinator
              captures: { pkg: $.data.id }
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/surgeons"
              payload: { full_name: "Dr A", max_daily_cases: 5 }
              as: Coordinator
              captures: { surg_id: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat1: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P2", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat2: $.data.id }
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr1: $.data.id }
            - call: "POST /refractive/screenings/${scr1}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /refractive/screenings/${scr1}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat2}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr2: $.data.id }
            - call: "POST /refractive/screenings/${scr2}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /refractive/screenings/${scr2}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/cases"
              payload: { patient_id: "${pat1}", screening_id: "${scr1}", package_id: "${pkg}" }
              as: Coordinator
              captures: { case1: $.data.id }
            - call: "POST /refractive/cases"
              payload: { patient_id: "${pat2}", screening_id: "${scr2}", package_id: "${pkg}" }
              as: Coordinator
              captures: { case2: $.data.id }
          trigger:
            - call: "POST /refractive/cases/${case1}/financing"
              payload: { down_payment_cents: 100000, term_months: 12, apr_bps: 1200 }
              as: Coordinator
              captures: { plan1_status: $.data.status }
            - call: "POST /refractive/cases/${case2}/financing"
              payload: { down_payment_cents: 500000, term_months: 1, apr_bps: 0 }
              as: Coordinator
              captures: { plan2_status: $.data.status }
          assert:
            - "FinancingPlan(case1).status == OPEN"
            - "SurgeryCase.${case1}.financial_status == DEPOSIT_PAID"
            - "FinancingPlan(case2).status == SETTLED"
            - "SurgeryCase.${case2}.financial_status == PAID_IN_FULL"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: amortized_installment_three_input_nonlinear
        grounds:
          - calculations.amortized_installment
          - entities.FinancingPlan.fields.monthly_installment_cents
          - entities.FinancingPlan.fields.apr_bps
        distinguishing_aspect: |
          monthly_installment_cents is a mode-(a) non-linear formula over three inputs (principal 400000, apr_bps 1200, term_months 12)
          with a compound-interest factor (1+r)^n and ceil rounding, producing exactly 35540 — not a tiered/rounding-order variant.
        test_recipe:
          setup:
            - "A PLANNED/UNFUNDED case on a STANDARD package base 500000, about to be financed with down 100000, apr 1200 bps, 12 months (principal 400000)."
          setup_api_calls:
            - call: "POST /refractive/packages"
              payload: { tier: "STANDARD", base_price_cents: 500000, deposit_cents: 50000, enhancement_window_days: 365, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "PRO_RATA" }
              as: Coordinator
              captures: { pkg: $.data.id }
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/surgeons"
              payload: { full_name: "Dr A", max_daily_cases: 5 }
              as: Coordinator
              captures: { surg_id: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat1: $.data.id }
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr1: $.data.id }
            - call: "POST /refractive/screenings/${scr1}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /refractive/screenings/${scr1}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/cases"
              payload: { patient_id: "${pat1}", screening_id: "${scr1}", package_id: "${pkg}" }
              as: Coordinator
              captures: { case1: $.data.id }
          trigger:
            - call: "POST /refractive/cases/${case1}/financing"
              payload: { down_payment_cents: 100000, term_months: 12, apr_bps: 1200 }
              as: Coordinator
              captures: { inst: $.data.monthly_installment_cents }
          assert:
            - "FinancingPlan(case1).monthly_installment_cents == 35540"

      - name: ablation_then_residual_ordered_dependency
        grounds:
          - calculations.ablation_depth_estimate
          - calculations.residual_bed
          - entities.CandidacyScreening.fields.ablation_depth_um
          - entities.CandidacyScreening.fields.residual_stromal_bed_um
        distinguishing_aspect: |
          Mode-(c) ordered dependency: residual_stromal_bed_um consumes ablation_depth_um, so evaluation order is pinned
          (ablation first). With thickness 550, error 3.0: ablation_depth_um==36 and residual_stromal_bed_um==404 (550-110-36) —
          a different combinatorial mode from the compound-interest formula above.
        test_recipe:
          setup:
            - "A DRAFT screening with corneal_thickness_um 550, refractive_error_diopters 3.0, about to be submitted."
          setup_api_calls:
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat1: $.data.id }
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr1: $.data.id }
          trigger:
            - call: "POST /refractive/screenings/${scr1}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { ab: $.data.ablation_depth_um, res: $.data.residual_stromal_bed_um }
          assert:
            - "CandidacyScreening.${scr1}.ablation_depth_um == 36"
            - "CandidacyScreening.${scr1}.residual_stromal_bed_um == 404"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: surgery_case_parallel_clinical_financial_axes
        grounds:
          - state_machines.SurgeryCase.financial_status=UNFUNDED_to_financial_status=DEPOSIT_PAID
          - state_machines.SurgeryCase.clinical_status=PLANNED_to_clinical_status=SCHEDULED
          - entities.SurgeryCase.fields.clinical_status
          - entities.SurgeryCase.fields.financial_status
        distinguishing_aspect: |
          On one SurgeryCase row, clinical_status and financial_status advance independently: financing flips financial_status to
          DEPOSIT_PAID while clinical_status stays PLANNED; a later booking flips clinical_status to SCHEDULED while financial_status
          is unchanged — parallel dimensions on the SurgeryCase entity (distinct entity from the cyclic EnhancementRequest below).
        test_recipe:
          setup:
            - "A PLANNED/UNFUNDED case on a STANDARD package (base 500000, deposit 50000)."
          setup_api_calls:
            - call: "POST /refractive/packages"
              payload: { tier: "STANDARD", base_price_cents: 500000, deposit_cents: 50000, enhancement_window_days: 365, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "PRO_RATA" }
              as: Coordinator
              captures: { pkg: $.data.id }
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/surgeons"
              payload: { full_name: "Dr A", max_daily_cases: 5 }
              as: Coordinator
              captures: { surg_id: $.data.id }
            - call: "POST /refractive/suites"
              payload: { name: "S1", turnaround_buffer_minutes: 15, daily_case_cap: 5 }
              as: Coordinator
              captures: { suite_id: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat1: $.data.id }
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr1: $.data.id }
            - call: "POST /refractive/screenings/${scr1}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /refractive/screenings/${scr1}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/cases"
              payload: { patient_id: "${pat1}", screening_id: "${scr1}", package_id: "${pkg}" }
              as: Coordinator
              captures: { case1: $.data.id, case1_v: $.data.version }
          trigger:
            - call: "POST /refractive/cases/${case1}/financing"
              payload: { down_payment_cents: 100000, term_months: 12, apr_bps: 1200 }
              as: Coordinator
            - call: "POST /refractive/cases/${case1}/bookings"
              payload: { suite_id: "${suite_id}", surgeon_id: "${surg_id}", slot_start: "2026-06-01T09:00:00Z", slot_end: "2026-06-01T10:00:00Z", expected_case_version: "${case1_v}" }
              as: Coordinator
          assert:
            - "SurgeryCase.${case1}.financial_status == DEPOSIT_PAID"
            - "SurgeryCase.${case1}.clinical_status == SCHEDULED"

      - name: enhancement_request_cyclic_rescreen_revision_loop
        grounds:
          - state_machines.EnhancementRequest.REQUESTED_to_RE_SCREENING
          - state_machines.EnhancementRequest.RE_SCREENING_to_REQUESTED
          - entities.EnhancementRequest.fields.status
          - entities.EnhancementRequest.fields.re_screening_id
        distinguishing_aspect: |
          EnhancementRequest loops REQUESTED -> RE_SCREENING -> REQUESTED: return-for-revision moves it back to REQUESTED and clears
          re_screening_id, then a second rescreen re-enters RE_SCREENING — a genuine cycle on the EnhancementRequest entity, distinct
          from the SurgeryCase parallel axes above.
        test_recipe:
          setup:
            - "A HEALED origin case (STANDARD 365d window), within window, with a REQUESTED EnhancementRequest and a separately APPROVED re-screening available."
          setup_api_calls:
            - call: "POST /refractive/packages"
              payload: { tier: "STANDARD", base_price_cents: 500000, deposit_cents: 50000, enhancement_window_days: 365, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "PRO_RATA" }
              as: Coordinator
              captures: { pkg: $.data.id }
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/surgeons"
              payload: { full_name: "Dr A", max_daily_cases: 5 }
              as: Coordinator
              captures: { surg_id: $.data.id }
            - call: "POST /refractive/suites"
              payload: { name: "S1", turnaround_buffer_minutes: 15, daily_case_cap: 5 }
              as: Coordinator
