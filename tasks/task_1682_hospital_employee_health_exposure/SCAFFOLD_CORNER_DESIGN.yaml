              as: StaffEmployee
              as_user_id: "${emp_id}"
              captures: { err3: $.data.error_id }
          assert:
            - "${err1} == ERR_FORBIDDEN_ROLE (nurse on physician-exclusive decide)"
            - "${err2} == ERR_FORBIDDEN_ROLE (physician on ComplianceOfficer-exclusive clock)"
            - "${err3} == ERR_FORBIDDEN_ROLE (StaffEmployee on nurse-exclusive create)"

      - name: sod_source_consent_recorder_must_differ
        claim_type: violation_to_error
