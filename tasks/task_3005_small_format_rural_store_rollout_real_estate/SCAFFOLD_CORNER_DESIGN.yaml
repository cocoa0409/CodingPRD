              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DC_CAPACITY_EXCEEDED (409); DistributionCenter.${dcid}.assigned_store_count == 1 and remaining_capacity == 0"

      - name: opening_plan_create_too_soon_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_OPENING_TOO_EARLY]
        distinguishing_aspect: "opening_date 30 days out from the default clock (2026-09-01) violates the 45-day lead rule -> ERR_OPENING_TOO_EARLY at creation."
