  # ===========================================================================
  # Rule 9 — compensating_invariant: forward action + compensating action leave
  # a named conserved quantity unchanged, over DIFFERENT conserved quantities.
  # Instance 1: SelectionNotice sea-day buckets (allocated == remaining +
  # reserved + consumed) under create-then-cancel.
  # Instance 2: Invoice amount_outstanding_cents (due + adjusted - paid) under
  # payment-then-waive.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: notice_sea_day_invariant_create_then_cancel
        grounds:
          - calculations.sea_day_accounting
          - entities.SelectionNotice.fields.remaining_sea_days
          - state_machines.Deployment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: the SelectionNotice sea-day partition invariant
          allocated_sea_days == remaining_sea_days + reserved_sea_days +
          consumed_sea_days. Forward action (deployment create: remaining -=
          planned, reserved += planned) paired with its compensating action
          (deployment cancel: reserved -= planned, remaining += planned) MUST
          return the notice to exactly (remaining 30, reserved 0, consumed 0) —
          the invariant holds after BOTH the forward and the compensating leg
          with zero drift.
        test_recipe:
          setup:
            - "Fishery F, operator OP, vessel V ACTIVE, observer OBS LEAD"
            - "Plan P published; notice N for V accepted (allocated 30, remaining 30, reserved 0, consumed 0)"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-CI1", name: "BSAI CompInv 1", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
            - call: "POST /observer-program/vessel-operators"
              payload: { legal_name: "Ci1 Ops LLC", license_number: "LIC-CI1-1", contact_person_ref: "person-ci1-op" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /observer-program/observers"
              payload: { person_ref: "person-ci1-obs", full_name: "Cid Observer", home_port: "Kodiak", certification_level: "LEAD" }
              as: ProgramAdmin
              captures: { obs_id: $.data.id }
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Ci1", permit_number: "PERMIT-CI1", home_port: "Kodiak", length_ft: 55, gear_type: "TRAWL" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { v_id: $.data.id }
            - call: "PATCH /observer-program/vessels/${v_id}"
              payload: { status: "ACTIVE" }
              as: ProgramAdmin
            - call: "POST /observer-program/coverage-plans"
              payload: { fishery_id: "${fish_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", projected_fleet_effort_days: 100, projected_em_effort_days: 0 }
              as: ProgramCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /observer-program/coverage-plans/${plan_id}/publish"
              payload: {}
              as: ProgramCoordinator
              captures: { plan_v: $.data.version }
            - call: "POST /observer-program/coverage-plans/${plan_id}/selection-runs"
              payload: { notice_response_deadline: "2026-09-05T00:00:00Z", expected_coverage_plan_version: "${plan_v}" }
              as: ProgramCoordinator
            - call: "GET /observer-program/selection-notices"
              payload: { coverage_plan_id: "${plan_id}", vessel_id: "${v_id}" }
              as: ProgramCoordinator
              captures: { n_id: "$.data[0].id" }
            - call: "POST /observer-program/selection-notices/${n_id}/accept"
              payload: {}
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { n_v: $.data.version, n_rem0: $.data.remaining_sea_days, n_res0: $.data.reserved_sea_days, n_cons0: $.data.consumed_sea_days }
          trigger:
            - call: "POST /observer-program/deployments"
              payload: { selection_notice_id: "${n_id}", observer_id: "${obs_id}", scheduled_departure_date: "2026-09-10T00:00:00Z", scheduled_return_date: "2026-09-19T00:00:00Z", expected_selection_notice_version: "${n_v}" }
              as: ProgramCoordinator
              captures: { d_id: $.data.id }
            - call: "GET /observer-program/selection-notices/${n_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { n_rem1: $.data.remaining_sea_days, n_res1: $.data.reserved_sea_days, n_cons1: $.data.consumed_sea_days }
            - call: "POST /observer-program/deployments/${d_id}/cancel"
              payload: {}
              as: ProgramCoordinator
            - call: "GET /observer-program/selection-notices/${n_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { n_rem2: $.data.remaining_sea_days, n_res2: $.data.reserved_sea_days, n_cons2: $.data.consumed_sea_days, n_alloc2: $.data.allocated_sea_days }
          assert:
            - "Forward leg (create, planned 10): remaining_sea_days == 20, reserved_sea_days == 10, consumed_sea_days == 0"
            - "Invariant after forward leg: 30 == 20 + 10 + 0"
            - "Compensating leg (cancel): remaining_sea_days == 30, reserved_sea_days == 0, consumed_sea_days == 0 — EXACTLY the pre-forward values"
            - "Invariant after compensation: allocated 30 == 30 + 0 + 0 (zero drift)"
            - "Deployment.${d_id}.status == CANCELLED"

      - name: invoice_outstanding_invariant_compensating_adjustments
        grounds:
          - entities.Invoice.fields.amount_outstanding_cents
          - state_machines.Invoice.ISSUED_to_ISSUED
          - state_machines.Invoice.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Conserved quantity: the Invoice balance identity
          amount_outstanding_cents == amount_due_cents + amount_adjusted_cents -
          amount_paid_cents. Forward action (adjustment +5000 on a 413763-cent
          ISSUED invoice -> outstanding 418763) paired with its compensating
          action (adjustment -5000 -> outstanding back to exactly 413763) MUST
          restore the pre-forward balance with zero drift, and the identity
          holds after EVERY leg. The scaffold declares waive only from
          ISSUED|DISPUTED|OVERDUE, so the payment-then-waive pairing is not
          reachable from PARTIALLY_PAID; the ISSUED->ISSUED adjustment self-loop
          is the declared compensating pair. Different conserved quantity (money
          identity vs sea-day partition) from instance 1.
