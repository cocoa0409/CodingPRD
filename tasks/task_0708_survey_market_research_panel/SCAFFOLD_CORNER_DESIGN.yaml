          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "RR", irb_protocol_number: "IRB-RR", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_RR", target_n: 2 }
              as: ResearchManager
              captures: { cid: $.data.id }
            - call: "POST /studies/${sid}/launch"
