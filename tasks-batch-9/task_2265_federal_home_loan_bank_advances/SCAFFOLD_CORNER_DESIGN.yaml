      - name: custodian_cannot_review_eligibility_unauthorized
        claim_type: role_cannot_perform_others_exclusive
        grounds: ["roles.CreditOfficer.exclusive_operations", "roles.CollateralCustodian.scope", "errors[ERR_UNAUTHORIZED]"]
