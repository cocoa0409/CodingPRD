              as: StormwaterProgramManager
            - call: "GET /stormwater/control-measures/${pe_id}"
              payload: {}
              as: StormwaterProgramManager
            - call: "GET /stormwater/outfalls/${of1_id}"
              payload: {}
              as: StormwaterProgramManager
            - call: "GET /stormwater/construction-sites/${site_a_id}"
              payload: {}
