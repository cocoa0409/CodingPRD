        claim_type: Priority conflict
        excluded_because:
          difficulty_instance: nurse_not_active_safety_outranks_weekly_authorized_hours_fiscal
          rationale: >-
            That §1.8 instance builds one assignment call that violates priority 16 and priority 36
            together and pins the response to ERR_NURSE_NOT_ACTIVE, which is exactly this
            priority-conflict claim; repeating it here would duplicate the whole setup.
        grounds:
          - validations[priority 16 ERR_NURSE_NOT_ACTIVE]
          - validations[priority 36 ERR_WEEKLY_HOURS_EXCEEDED]

      - name: overlap_check_outranks_the_nurse_weekly_ceiling
        claim_type: Priority conflict
        excluded_because:
          difficulty_instance: nurse_shift_overlap_temporal_outranks_nurse_weekly_ceiling_constraint
          rationale: >-
            The paired violation of priority 23 and priority 32 on a single assignment call, plus the
            assertion that the response is ERR_NURSE_SHIFT_OVERLAP, is already the whole content of
            that §1.8 instance.
        grounds:
          - validations[priority 23 ERR_NURSE_SHIFT_OVERLAP]
          - validations[priority 32 ERR_NURSE_WEEKLY_LIMIT_EXCEEDED]

      - name: weekly_authorized_minutes_equality_is_allowed
        claim_type: Aggregate validation
        excluded_because:
          difficulty_instance: weekly_authorized_minutes_boundary_equality_allowed_at_2400
          rationale: >-
            That instance walks the aggregate ceiling to exactly 2400 committed minutes, proves the
            equality case is accepted and then proves the next minute is rejected, covering both legs
            of the aggregate-validation claim for priority 36.
        grounds:
          - validations[priority 36 ERR_WEEKLY_HOURS_EXCEEDED]
          - calculations.authorization_weekly_utilization

      - name: case_creation_rejects_a_pending_authorization
        claim_type: Cross-entity validation
        excluded_because:
          difficulty_instance: case_creation_requires_the_authorization_out_of_pending
          rationale: >-
            The §1.8 instance files the case against a PENDING authorization, asserts
            ERR_AUTHORIZATION_NOT_ACTIVE, then activates the authorization and repeats the identical
            call successfully - both the invalid and the valid leg of this cross-entity claim.
        grounds:
          - validations[priority 11 ERR_AUTHORIZATION_NOT_ACTIVE]
          - endpoints[POST /pdn/cases]

      - name: resume_rejected_while_the_patient_is_hospitalized
        claim_type: Cross-entity validation
        excluded_because:
          difficulty_instance: case_resume_blocked_until_the_patient_is_out_of_hospital
          rationale: >-
            That instance already drives the hospitalization hold, the refused resume with
            ERR_PATIENT_HOSPITALIZED, the incident close that returns the patient home and the resume
            that then succeeds, so priority 12 is fully covered on both sides.
        grounds:
          - validations[priority 12 ERR_PATIENT_HOSPITALIZED]
          - state_machines.Case[ON_HOLD -> ACTIVE]

      - name: nurse_rest_buffer_rejects_a_back_to_back_shift
        claim_type: Temporal validation
        excluded_because:
          difficulty_instance: nurse_rest_buffer_rejects_adjacent_shift_but_allows_a_sixty_minute_gap
          rationale: >-
            The sixty-minute rest buffer is tested there at a zero gap (rejected) and at exactly sixty
            minutes (accepted), which is the complete temporal-validation claim for priority 23.
        grounds:
          - validations[priority 23 ERR_NURSE_SHIFT_OVERLAP]
          - calculations.auto_staff_selector

      - name: patient_home_concurrency_rejects_a_strict_overlap
        claim_type: Temporal validation
        excluded_because:
          difficulty_instance: patient_home_concurrency_allows_adjacency_and_blocks_strict_overlap
          rationale: >-
            That instance contrasts an adjacent second shift in the same home (accepted) with a
            one-minute strict overlap (rejected with ERR_PATIENT_CONCURRENCY_EXCEEDED), covering
            priority 24 at both boundaries.
        grounds:
          - validations[priority 24 ERR_PATIENT_CONCURRENCY_EXCEEDED]
          - entities.Shift.start_at

