            - "the first trigger call returns data.error_id == ERR_TERMINAL_NOT_OWNER"
            - "Shipment.${shipment_id}.status == IN_TRANSIT"
            - "StorageAsset.${origin_id}.on_hand_tons == 5000.000"
            - "StorageAsset.${dest_id}.on_hand_tons == 0.000"
            - "the second trigger call returns HTTP status 200"
            - "Shipment.${shipment_id}.status == DELIVERED"
            - "Shipment.${shipment_id}.received_tons == 20"
            - "StorageAsset.${origin_id}.on_hand_tons == 4980.000"
            - "StorageAsset.${origin_id}.reserved_tons == 0.000"
            - "StorageAsset.${dest_id}.on_hand_tons == 20.000"

      - name: a_run_approved_by_its_own_author_is_forbidden
        claim_type: segregation_of_duties
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=12]
          - complexity_profile.role_model
          - entities.ProductionRun.fields.created_by_user_id
        distinguishing_aspect: |
          Both signatures come from the same role, so only the X-User-ID separates them: eng-author's own
          approval of the run they created is 403 ERR_SEGREGATION_OF_DUTIES and leaves the run PLANNED with
          no provisional price, while eng-approver's identical call approves it. The duties rule is checked
          after the role check and before the campaign's own state and catalyst gates.
        test_recipe:
          setup:
            - "One plant, one train with an ACTIVE zero-hour charge and one PLANNED run PR-1 created by eng-author."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1200 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 0, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_ammonia_tons: 5000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/production-runs/{id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
            - call: "POST /nitrogen-ops/production-runs/{id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
          assert:
            - "the first trigger call returns HTTP status 403"
            - "the first trigger call returns data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "ProductionRun.${run_id}.status == PLANNED"
            - "ProductionRun.${run_id}.provisional_unit_cost_usd_per_ton == null"
            - "ProductionRun.${run_id}.version == 1"
            - "ProductionRun.${run_id}.created_by_user_id == eng-author"
            - "the second trigger call returns HTTP status 200"
            - "ProductionRun.${run_id}.status == APPROVED"
            - "ProductionRun.${run_id}.version == 2"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_expected_run_version_is_rejected_on_reserve
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-reserve-stale-run]
          - errors[ERR_STALE_RUN_VERSION]
          - validations[priority=11]
        distinguishing_aspect: |
          The reservation is legal on state alone — the pool has ample ammonia — so only the version
          decides: one below the run's current version is 412 ERR_STALE_RUN_VERSION with the pool and both
          versions untouched, and the very same call at the current version succeeds and advances the run's
          version by exactly one.
        test_recipe:
          setup:
            - "One plant, one train with an ACTIVE zero-hour charge, one APPROVED run PR-1 (target_ammonia_tons 5000) and one UNALLOCATED order PO-1 for 1000 tons of a non-regulated UREA line (0.58 ammonia tons per ton)."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1200 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 0, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge_id: $.data.id }
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "UREA", ammonia_tons_per_product_ton: 0.58, conversion_cost_usd_per_ton: 38.00, regulated: false, priority_rank: 1 }
              as: CommercialManager
              captures: { line_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-1", asset_kind: "TANK", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { tank_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_ammonia_tons: 5000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs/{id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
              captures: { run_ver: $.data.version }
            - call: "POST /nitrogen-ops/production-orders"
              payload: { run_id: "${run_id}", product_line_id: "${line_id}", destination_asset_id: "${tank_id}", order_code: "PO-1", requested_tons: 1000 }
              as: CommercialManager
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/production-orders/{id}/reserve"
              payload: { reserve_tons: 1000, expected_run_version: "${run_ver} - 1" }
              as: CommercialManager
            - call: "POST /nitrogen-ops/production-orders/{id}/reserve"
              payload: { reserve_tons: 1000, expected_run_version: "${run_ver}" }
              as: CommercialManager
          assert:
            - "the first trigger call returns HTTP status 412"
            - "the first trigger call returns data.error_id == ERR_STALE_RUN_VERSION"
            - "ProductionOrder.${order_id}.allocation_status == UNALLOCATED"
            - "ProductionOrder.${order_id}.version == 1"
            - "ProductionRun.${run_id}.version == ${run_ver}"
            - "ProductionRun.${run_id}.unallocated_ammonia_tons == 5000.000"
            - "the second trigger call returns HTTP status 200"
            - "ProductionOrder.${order_id}.allocation_status == RESERVED"
            - "ProductionOrder.${order_id}.reserved_tons == 1000"
            - "ProductionOrder.${order_id}.allocated_ammonia_tons == 580.000"
            - "ProductionRun.${run_id}.unallocated_ammonia_tons == 4420.000"

      - name: a_stale_expected_origin_asset_version_is_rejected_on_book
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[shipment-book-stale-storage]
          - errors[ERR_STALE_STORAGE_VERSION]
          - calculations.shipment_freight_total
        distinguishing_aspect: |
          The second OCC rule guards a different parent with a different field and code: booking against
          one version below the origin tank's current version is 412 ERR_STALE_STORAGE_VERSION with no
          freight priced and no tonnage held, while the same booking at the current version prices the
          TRUCK move at 450.00 + 38.25 = 488.25 and holds 20 tons.
        test_recipe:
          setup:
            - "One plant with UREA tank UT-1 (capacity 20000) opened at 5000 tons and UREA terminal UT-2 (capacity 20000)."
            - "DRAFT shipment SH-1 moves 20 tons 50 miles by TRUCK from UT-1 to UT-2; the tank's version after its opening balance is captured."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-1", asset_kind: "TANK", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { origin_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-2", asset_kind: "TERMINAL", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { dest_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets/{id}/opening-balance"
              payload: { opening_balance_tons: 5000 }
              as: LogisticsCoordinator
              captures: { origin_ver: $.data.version }
            - call: "POST /nitrogen-ops/shipments"
              payload: { origin_asset_id: "${origin_id}", dest_asset_id: "${dest_id}", shipment_code: "SH-1", mode: "TRUCK", tons: 20, distance_miles: 50, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-06T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { shipment_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/shipments/{id}/book"
              payload: { expected_origin_asset_version: "${origin_ver} - 1" }
              as: LogisticsCoordinator
            - call: "POST /nitrogen-ops/shipments/{id}/book"
              payload: { expected_origin_asset_version: "${origin_ver}" }
              as: LogisticsCoordinator
          assert:
            - "the first trigger call returns HTTP status 412"
            - "the first trigger call returns data.error_id == ERR_STALE_STORAGE_VERSION"
            - "Shipment.${shipment_id}.status == DRAFT"
            - "Shipment.${shipment_id}.freight_total_usd == null"
            - "StorageAsset.${origin_id}.version == ${origin_ver}"
            - "StorageAsset.${origin_id}.reserved_tons == 0.000"
            - "the second trigger call returns HTTP status 200"
            - "Shipment.${shipment_id}.status == BOOKED"
            - "Shipment.${shipment_id}.base_freight_usd == 450.00"
            - "Shipment.${shipment_id}.fuel_surcharge_usd == 38.25"
            - "Shipment.${shipment_id}.freight_total_usd == 488.25"
            - "Shipment.${shipment_id}.freight_per_ton_usd == 24.4125"
            - "StorageAsset.${origin_id}.reserved_tons == 20.000"
            - "StorageAsset.${origin_id}.available_tons == 4980.000"

      - name: plant_version_increments_once_per_write_and_not_on_reads
        claim_type: optimistic_concurrency
        grounds:
          - entities.Plant.fields.version
          - endpoints[POST /nitrogen-ops/plants/{id}/gas-index]
          - endpoints[POST /nitrogen-ops/plants/{id}/permit-status]
          - endpoints[GET /nitrogen-ops/plants/{id}]
        distinguishing_aspect: |
          Version is a write counter, not a read counter: three successive writes to the same plant take it
          from 1 to 4 in single steps, and two intervening reads that re-derive the hedged blend, the
          exceeded pollutants and the operating posture leave it exactly where it was.
        test_recipe:
          setup:
            - "One freshly created plant at version 1 and no other rows."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
          trigger:
            - call: "GET /nitrogen-ops/plants/{id}"
              payload: {}
              as: CommercialManager
            - call: "POST /nitrogen-ops/plants/{id}/gas-index"
              payload: { spot_gas_index_usd_per_mmbtu: 5.10 }
              as: RegulatoryAdmin
            - call: "POST /nitrogen-ops/plants/{id}/permit-status"
              payload: { permit_status: "SUSPENDED" }
              as: RegulatoryAdmin
            - call: "GET /nitrogen-ops/plants/{id}"
              payload: {}
              as: CommercialManager
            - call: "POST /nitrogen-ops/plants/{id}/permit-status"
              payload: { permit_status: "ACTIVE" }
              as: RegulatoryAdmin
          assert:
            - "the first trigger call returns data.version == 1 and data.operating_posture == NORMAL"
            - "the gas-index call returns data.version == 2 and data.spot_gas_index_usd_per_mmbtu == 5.10"
            - "the suspending permit-status call returns data.version == 3 and data.operating_posture == FROZEN"
            - "the fourth trigger call returns data.version == 3 and data.operating_posture == FROZEN"
            - "the reinstating permit-status call returns data.version == 4 and data.operating_posture == NORMAL"
            - "Plant.${plant_id}.hedged_blend_usd_per_mmbtu == null"

      - name: posture_relaxes_when_the_exceeding_reading_ages_out_of_the_window
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.emissions_rolling_30d
          - calculations.plant_operating_posture
          - entities.Plant.fields.exceeded_pollutants
          - endpoints[POST /nitrogen-ops/_clock/set_current_utc]
        distinguishing_aspect: |
          The threshold resets with no write at all. A single NOX reading of 13.200 tons against a 12.00-ton
          ceiling puts the plant at RESTRICTED; at a clock of 2026-08-30 the reading is still inside the
          left-exclusive 30-day window so the posture holds, and at 2026-08-31 the reading falls exactly on
          the excluded left edge, the aggregate drops to 0 and the posture returns to NORMAL. The reading's
          own stored exceedance flag, taken as at ingestion, stays true throughout.
        test_recipe:
          setup:
            - "One plant with permit_limit_tons_30d 12.00, the clock at its 2026-08-01T00:00:00Z default, and no quotes."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/emissions-readings"
              payload: { plant_id: "${plant_id}", pollutant: "NOX", rate_lb_per_hour: 55.0, interval_hours: 480, reading_at: "2026-08-01T00:00:00Z" }
              as: RegulatoryAdmin
              captures: { reading_id: $.data.id }
            - call: "POST /nitrogen-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "GET /nitrogen-ops/plants/{id}"
              payload: {}
              as: RegulatoryAdmin
            - call: "POST /nitrogen-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "GET /nitrogen-ops/plants/{id}"
              payload: {}
              as: RegulatoryAdmin
          assert:
            - "the emissions-readings call returns HTTP status 201"
            - "EmissionsReading.${reading_id}.tons == 13.200"
            - "EmissionsReading.${reading_id}.rolling_30d_tons == 13.200"
            - "EmissionsReading.${reading_id}.exceedance == true"
            - "the third trigger call returns data.exceeded_pollutants == [NOX] and data.operating_posture == RESTRICTED"
            - "the fifth trigger call returns data.exceeded_pollutants == [] and data.operating_posture == NORMAL"
            - "EmissionsReading.${reading_id}.exceedance == true"
            - "EmissionsReading.${reading_id}.rolling_30d_tons == 13.200"

      - name: the_five_level_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.Turnaround.APPROVED_to_IN_PROGRESS
          - state_machines.ProductionRun.APPROVED_to_PLANNED
        excluded_because:
          difficulty_instance: transitive_cascade / run_completion_derates_catalyst_and_reverts_unrelated_approved_run
          rationale: "One completion is followed through the charge, the train and an unrelated approved campaign, with the ordering and the fixed point both asserted."

      - name: both_unit_cost_variants_and_the_switch_delta_are_asserted
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.run_ammonia_unit_cost
        excluded_because:
          difficulty_instance: dual_variant_calc / run_unit_cost_provisional_month_match_vs_final_chronological_waterfall
          rationale: "That instance asserts the PROVISIONAL and FINAL figures on the same run from the same hedge book and the delta between them."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: the_reserve_response_itself_carries_every_derived_change
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /nitrogen-ops/production-orders/{id}/reserve]
          - entities.ProductionOrder.fields.allocated_ammonia_tons
        distinguishing_aspect: |
          Nothing lags behind a write. The reserve call's own 200 body already shows allocation_status
          RESERVED and allocated_ammonia_tons 580.000, and the very next read of the parent run — with no
          intervening call of any kind — already shows unallocated_ammonia_tons 4420.000 and version 3, so
          no reconciliation step is needed to make the derived figures agree.
        test_recipe:
          setup:
            - "One plant, one train with an ACTIVE zero-hour charge, one APPROVED run PR-1 (target_ammonia_tons 5000, version 2) and one UNALLOCATED order PO-1 for 1000 tons of a non-regulated UREA line (0.58 ammonia tons per ton)."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1200 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 0, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge_id: $.data.id }
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "UREA", ammonia_tons_per_product_ton: 0.58, conversion_cost_usd_per_ton: 38.00, regulated: false, priority_rank: 1 }
              as: CommercialManager
              captures: { line_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-1", asset_kind: "TANK", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { tank_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_ammonia_tons: 5000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs/{id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
              captures: { run_ver: $.data.version }
            - call: "POST /nitrogen-ops/production-orders"
              payload: { run_id: "${run_id}", product_line_id: "${line_id}", destination_asset_id: "${tank_id}", order_code: "PO-1", requested_tons: 1000 }
              as: CommercialManager
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/production-orders/{id}/reserve"
              payload: { reserve_tons: 1000, expected_run_version: "${run_ver}" }
              as: CommercialManager
            - call: "GET /nitrogen-ops/production-runs/{id}"
              payload: {}
              as: CommercialManager
          assert:
            - "the first trigger call returns HTTP status 200"
            - "the first trigger call returns data.allocation_status == RESERVED"
            - "the first trigger call returns data.reserved_tons == 1000"
            - "the first trigger call returns data.allocated_ammonia_tons == 580.000"
            - "the first trigger call returns data.version == 2"
            - "the second trigger call returns data.unallocated_ammonia_tons == 4420.000"
            - "the second trigger call returns data.version == 3"
            - "the second trigger call returns data.status == APPROVED"
