              as: Volunteer
              as_user_id: "${vol_b}"
            - call: "POST /volunteers/${vol_b}/vet"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /volunteers/${vol_b}/availability-windows"
              payload: { starts_at: "2026-01-05T00:00:00Z", ends_at: "2026-03-01T00:00:00Z", window_kind: "HARD", hours_offered: 45.00 }
              as: Volunteer
              as_user_id: "${vol_b}"
