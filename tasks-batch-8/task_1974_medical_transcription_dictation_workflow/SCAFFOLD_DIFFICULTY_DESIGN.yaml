  # ---------------------------------------------------------------- Rule 6 --
  - rule_id: boundary_precision_check
    instances:
      - name: qa_pass_threshold_exactly_80
        grounds:
          - calculations.qa_accuracy_score
          - entities.QAReview.fields.outcome
        distinguishing_aspect: |
          Metric accuracy_score on POST /qa-reviews: PASS threshold is inclusive
          (>= 80.0) — a score of exactly 80.0 (m=4) passes while 79.0
          (m=4, i=1) fails; the boundary sits on the numeric score, distinct
          from instance 2's character-count boundary on a different endpoint.
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window; jobs J80 and J79 claimed + submitted at T0"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j80: $.data.id } }
            - { call: "POST /dictation-jobs/${j80}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j80}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j79: $.data.id } }
            - { call: "POST /dictation-jobs/${j79}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j79}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
          trigger:
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j80}", critical_error_count: 0, major_error_count: 4, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01", captures: { s80: $.data.accuracy_score, o80: $.data.outcome } }
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j79}", critical_error_count: 0, major_error_count: 4, minor_error_count: 1 }, as: QASupervisor, as_user_id: "qa-01", captures: { s79: $.data.accuracy_score, o79: $.data.outcome } }
          assert:
            - "J80: accuracy_score == 80.0, outcome == PASS, job DELIVERED     # >= is inclusive at exactly 80.0"
            - "J79: accuracy_score == 79.0, outcome == FAIL, job EDITING rework_count == 1"

      - name: line_count_ceil_boundary_65_66
        grounds:
          - calculations.visible_chars_and_line_count
          - entities.Transcript.fields.line_count
          - entities.Transcript.fields.visible_char_count
        distinguishing_aspect: |
          Metric line_count on POST /dictation-jobs/{id}/submit: ceil(chars/65)
          boundary — exactly 65 visible chars bills 1 line, 66 bills 2. Distinct
          metric and endpoint from the accuracy_score boundary of instance 1.
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window; jobs J65 and J66 claimed at T0"
