scenario: |
  Performance Improvement Plan & Progressive Discipline (HR business partner team): performance concern documentation & manager coaching log, PIP creation with measurable goals & timeline, HR review & legal risk assessment, check-in cadence & evidence collection, outcome decision (success/extension/termination) & approval, consistency review across similar cases, employee response & rebuttal handling, correlation with performance rating cycle

domain_name: performance-improvement-plan
api_prefix: /hr-org-units

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
    - version_pinning_on_approval
    - derived_field_reconciliation

  entity_topology: hierarchical
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: HROrgUnit
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Org unit name" }
      - { name: current_utc, type: datetime, source: system, description: "Logical clock for this org unit; default 2026-08-01T00:00:00Z; advances only via POST /_clock/set_current_utc" }
      - { name: pip_policy_version, type: integer, source: system, default: 1, description: "Monotonically increasing policy version; bumped whenever a PIPTemplate is published; PIPs snapshot this at issuance" }

  - name: Employee
    parent: HROrgUnit
    common_fields: true
    fields:
      - { name: hr_org_unit_id, type: string, source: system, description: "FK -> HROrgUnit.id" }
      - { name: full_name, type: string, source: input, description: "Employee legal name" }
      - { name: email, type: string, source: input, description: "Work email, unique within org unit" }
      - { name: job_family, type: enum, source: input, description: "ENGINEERING | SALES | OPERATIONS | SUPPORT | FINANCE — used by consistency review cohort matching" }
      - { name: job_level, type: integer, source: input, description: "Numeric grade 1..10 — used by consistency review cohort matching" }
      - { name: manager_id, type: string, source: input, required: false, description: "FK -> Employee.id; nullable (top of chain). Self-referential." }
      - { name: employment_status, type: enum, source: system, description: "ACTIVE | ON_NOTICE | TERMINATED | RESIGNED" }
      - { name: active_pip_id, type: string, source: computed, required: false, description: "FK -> PerformanceImprovementPlan.id of the employee's currently in-flight PIP (null if none). Reconciled whenever a PIP enters/leaves ACTIVE or EXTENDED." }
      - { name: terminated_at, type: datetime, source: system, required: false, description: "Set when employment_status flips to TERMINATED" }

  - name: RatingCycle
    parent: HROrgUnit
    common_fields: true
    fields:
      - { name: hr_org_unit_id, type: string, source: system, description: "FK -> HROrgUnit.id" }
      - { name: label, type: string, source: input, description: "e.g., '2026-H1'" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the rating window" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the rating window" }
      - { name: status, type: enum, source: system, description: "OPEN | CALIBRATION | PUBLISHED | ARCHIVED" }

  - name: ManagerCoachingLogEntry
    parent: Employee
    common_fields: false
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id (the subject of coaching)" }
      - { name: author_manager_id, type: string, source: system, description: "FK -> Employee.id (the manager who wrote this entry, from X-User-ID)" }
      - { name: occurred_at, type: datetime, source: input, description: "When the coaching conversation happened" }
      - { name: category, type: enum, source: input, description: "QUALITY | VELOCITY | ATTENDANCE | CONDUCT | COLLABORATION" }
      - { name: severity, type: enum, source: input, description: "INFORMAL | DOCUMENTED | ESCALATED" }
      - { name: narrative, type: string, source: input, description: "Free-text description of the concern and coaching given; min 40 chars" }
      - { name: concern_id, type: string, source: system, required: false, description: "FK -> PerformanceConcern.id, populated when this entry is linked to a formal concern" }

  - name: PerformanceConcern
    parent: Employee
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id" }
      - { name: raised_by_manager_id, type: string, source: system, description: "FK -> Employee.id (from X-User-ID)" }
      - { name: category, type: enum, source: input, description: "QUALITY | VELOCITY | ATTENDANCE | CONDUCT | COLLABORATION" }
      - { name: summary, type: string, source: input, description: "Short concern summary; min 20 chars" }
      - { name: coaching_log_entry_ids, type: array, source: input, description: "Array of FK -> ManagerCoachingLogEntry.id; at least 2 entries required at OPEN->SUBMITTED; entries must all reference this employee and be in {DOCUMENTED, ESCALATED}" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED_INSUFFICIENT | SUPERSEDED_BY_PIP" }
      - { name: submitted_at, type: datetime, source: system, required: false, description: "When status flipped DRAFT->SUBMITTED" }
      - { name: decided_at, type: datetime, source: system, required: false, description: "When status flipped SUBMITTED->ACCEPTED/REJECTED_INSUFFICIENT" }
      - { name: decided_by_hrbp_id, type: string, source: system, required: false, description: "FK -> Employee.id of deciding HRBP; must differ from raised_by_manager_id (segregation of duties)" }

  - name: PIPTemplate
    parent: HROrgUnit
    common_fields: true
    fields:
      - { name: hr_org_unit_id, type: string, source: system, description: "FK -> HROrgUnit.id" }
      - { name: name, type: string, source: input, description: "Template display name" }
      - { name: category, type: enum, source: input, description: "QUALITY | VELOCITY | ATTENDANCE | CONDUCT | COLLABORATION" }
      - { name: goal_blueprints, type: array, source: input, description: "Array of {metric_key, target_value, unit, weight} blueprints; 1..5 entries; weights must sum to 100" }
      - { name: duration_days, type: integer, source: input, description: "Plan length in days; 30..180" }
      - { name: check_in_cadence_days, type: integer, source: input, description: "Days between required check-ins; 7..30; must divide duration_days evenly" }
      - { name: template_status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED" }
      - { name: published_at, type: datetime, source: system, required: false, description: "When PUBLISHED" }
      - { name: published_version, type: integer, source: system, required: false, description: "Snapshot of HROrgUnit.pip_policy_version at publication time; used to pin PIPs" }

  - name: PerformanceImprovementPlan
    parent: Employee
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id" }
      - { name: concern_id, type: string, source: input, description: "FK -> PerformanceConcern.id (must be ACCEPTED and not already bound to another non-terminal PIP)" }
      - { name: template_id, type: string, source: input, description: "FK -> PIPTemplate.id (must be PUBLISHED at issuance)" }
      - { name: template_published_version, type: integer, source: system, description: "Pinned from PIPTemplate.published_version at issuance; never changes" }
      - { name: policy_version_at_issuance, type: integer, source: system, description: "Pinned from HROrgUnit.pip_policy_version at issuance" }
      - { name: issuing_hrbp_id, type: string, source: system, description: "FK -> Employee.id (from X-User-ID); must differ from concern.raised_by_manager_id (segregation of duties)" }
      - { name: start_date, type: datetime, source: input, description: "Plan window start (inclusive)" }
      - { name: end_date, type: datetime, source: computed, description: "= start_date + template.duration_days; exclusive" }
      - { name: check_in_interval_days, type: integer, source: system, description: "Copied from template at issuance" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | ACTIVE | EXTENDED | CLOSED_SUCCESS | CLOSED_FAILED | CLOSED_TERMINATED | CLOSED_WITHDRAWN" }
      - { name: provisional_attainment_ratio, type: number, source: computed, description: "See calculation pip_attainment_ratio; uses PROVISIONAL variant" }
      - { name: final_attainment_ratio, type: number, source: computed, required: false, description: "See calculation pip_attainment_ratio; uses FINAL variant; null until outcome decision" }
      - { name: extension_count, type: integer, source: system, default: 0, description: "Number of EXTENDED cycles consumed; max 1" }
      - { name: rebuttal_window_closes_at, type: datetime, source: system, required: false, description: "= outcome_decision.decided_at + REBUTTAL_WINDOW_DAYS (5 days); null until outcome proposed" }
      - { name: closed_at, type: datetime, source: system, required: false, description: "When status flipped to any CLOSED_*" }

  - name: PIPGoal
    parent: PerformanceImprovementPlan
    common_fields: true
    fields:
      - { name: pip_id, type: string, source: system, description: "FK -> PerformanceImprovementPlan.id" }
      - { name: metric_key, type: string, source: system, description: "Copied from template blueprint" }
      - { name: target_value, type: number, source: system, description: "Copied from template blueprint" }
      - { name: unit, type: string, source: system, description: "Copied from template blueprint" }
      - { name: weight, type: integer, source: system, description: "Copied from template blueprint; 1..100; goal weights within a PIP sum to 100" }
      - { name: current_value, type: number, source: computed, default: 0, description: "Latest measured value; updated by CheckIn evidence" }
      - { name: goal_status, type: enum, source: system, description: "PENDING | ON_TRACK | AT_RISK | MET | NOT_MET | WAIVED" }

  - name: CheckIn
    parent: PerformanceImprovementPlan
    common_fields: true
    fields:
      - { name: pip_id, type: string, source: system, description: "FK -> PerformanceImprovementPlan.id" }
      - { name: scheduled_for, type: datetime, source: input, description: "When this check-in is scheduled; must land within plan window; adjacent check-ins must be exactly check_in_interval_days apart" }
      - { name: sequence_index, type: integer, source: system, description: "Ordinal within the plan, 1-based" }
      - { name: held_at, type: datetime, source: system, required: false, description: "When the check-in was actually held; null until held" }
      - { name: manager_attended, type: boolean, source: input, default: false, description: "Whether the direct manager attended" }
      - { name: hrbp_attended, type: boolean, source: input, default: false, description: "Whether the HRBP attended" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | MISSED | CANCELLED" }
      - { name: notes, type: string, source: input, required: false, description: "Free-text notes; min 20 chars when status -> HELD" }

  - name: EvidenceItem
    parent: CheckIn
    common_fields: false
    fields:
      - { name: check_in_id, type: string, source: system, description: "FK -> CheckIn.id" }
      - { name: pip_goal_id, type: string, source: input, description: "FK -> PIPGoal.id; must belong to the same PIP as the check-in" }
      - { name: observed_value, type: number, source: input, description: "The measured value of the goal metric at this check-in" }
      - { name: source, type: enum, source: input, description: "MANAGER_OBSERVATION | SYSTEM_REPORT | PEER_FEEDBACK | SELF_REPORT" }
      - { name: submitted_by_id, type: string, source: system, description: "FK -> Employee.id (from X-User-ID)" }
      - { name: submitted_at, type: datetime, source: system, description: "When submitted" }
      - { name: admissibility, type: enum, source: system, description: "PENDING_REVIEW | ADMISSIBLE | INADMISSIBLE — set by HRBP adjudication" }
      - { name: admissibility_decided_by_id, type: string, source: system, required: false, description: "FK -> Employee.id of deciding HRBP; must differ from submitted_by_id when submitted_by is the PIP's issuing HRBP (segregation of duties)" }

  - name: LegalReview
    parent: PerformanceImprovementPlan
    common_fields: true
    fields:
      - { name: pip_id, type: string, source: system, description: "FK -> PerformanceImprovementPlan.id" }
      - { name: requested_by_hrbp_id, type: string, source: system, description: "FK -> Employee.id" }
      - { name: assigned_counsel_id, type: string, source: input, description: "FK -> Employee.id of LegalCounsel; must differ from issuing_hrbp_id and raised_by_manager_id" }
      - { name: risk_score, type: integer, source: computed, required: false, description: "0..100 composite legal risk; null until counsel submits" }
      - { name: risk_factors, type: array, source: input, description: "Array of factor codes from {PROTECTED_CLASS, RECENT_LEAVE, WHISTLEBLOWER_HISTORY, PRIOR_COMPLAINT, RETALIATION_WINDOW, DOCUMENTATION_GAP}; each contributes a fixed weight (see calculation legal_risk_score)" }
      - { name: recommendation, type: enum, source: input, description: "PROCEED | PROCEED_WITH_CAUTION | HOLD | REJECT" }
      - { name: rationale, type: string, source: input, description: "Free text; min 40 chars" }
      - { name: status, type: enum, source: system, description: "REQUESTED | IN_REVIEW | SUBMITTED | OVERRIDDEN" }
      - { name: submitted_at, type: datetime, source: system, required: false, description: "When counsel submitted" }
      - { name: decided_by_director_id, type: string, source: system, required: false, description: "FK -> Employee.id of HRDirector when OVERRIDDEN" }

  - name: OutcomeDecision
    parent: PerformanceImprovementPlan
    common_fields: true
    fields:
      - { name: pip_id, type: string, source: system, description: "FK -> PerformanceImprovementPlan.id" }
      - { name: proposed_by_hrbp_id, type: string, source: system, description: "FK -> Employee.id; must differ from issuing_hrbp_id if issuing HRBP is still active (segregation of duties between plan author and outcome proposer only when the plan was issued under current policy_version; otherwise allowed)" }
      - { name: proposed_outcome, type: enum, source: input, description: "SUCCESS | EXTENSION | TERMINATION" }
      - { name: final_attainment_ratio_at_decision, type: number, source: computed, description: "Snapshot of PIP.final_attainment_ratio (FINAL variant) at propose time" }
      - { name: rationale, type: string, source: input, description: "min 40 chars" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | SUPERSEDED" }
      - { name: decided_at, type: datetime, source: system, required: false, description: "When APPROVED/REJECTED" }
      - { name: decided_by_director_id, type: string, source: system, required: false, description: "FK -> Employee.id of HRDirector; must differ from proposed_by_hrbp_id (segregation of duties)" }

  - name: EmployeeRebuttal
    parent: PerformanceImprovementPlan
    common_fields: true
    fields:
      - { name: pip_id, type: string, source: system, description: "FK -> PerformanceImprovementPlan.id" }
      - { name: outcome_decision_id, type: string, source: system, description: "FK -> OutcomeDecision.id (the decision being rebutted)" }
      - { name: submitted_by_employee_id, type: string, source: system, description: "FK -> Employee.id; must equal pip.employee_id (only the subject employee may rebut)" }
      - { name: body, type: string, source: input, description: "min 100 chars" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | UPHELD | OVERRULED" }
      - { name: reviewed_by_hrbp_id, type: string, source: system, required: false, description: "FK -> Employee.id; must differ from both the original outcome proposer AND the issuing HRBP (segregation of duties)" }
      - { name: resolution, type: enum, source: input, required: false, description: "UPHELD | OVERRULED; required when -> UPHELD/OVERRULED" }
      - { name: resolution_rationale, type: string, source: input, required: false, description: "min 40 chars when resolution is set" }

  - name: ConsistencyReview
    parent: HROrgUnit
    common_fields: true
    fields:
      - { name: hr_org_unit_id, type: string, source: system, description: "FK -> HROrgUnit.id" }
      - { name: target_pip_id, type: string, source: input, description: "FK -> PerformanceImprovementPlan.id being audited" }
      - { name: cohort_pip_ids, type: array, source: computed, description: "Server-computed cohort: PIPs in same HROrgUnit with same template.category and employee.job_family and |employee.job_level - target.employee.job_level| <= 1, status in {CLOSED_SUCCESS, CLOSED_FAILED, CLOSED_TERMINATED}, decided within trailing 365 days of target's outcome decided_at; sorted by outcome_decision.decided_at ASC, tie-break created_at ASC" }
      - { name: cohort_size, type: integer, source: computed, description: "len(cohort_pip_ids)" }
      - { name: outcome_disparity_score, type: number, source: computed, description: "See calculation consistency_disparity_score" }
      - { name: rating_alignment_score, type: number, source: computed, description: "See calculation rating_alignment_score" }
      - { name: status, type: enum, source: system, description: "OPEN | ADJUDICATED_CONSISTENT | ADJUDICATED_INCONSISTENT" }
      - { name: opened_by_hrbp_id, type: string, source: system, description: "FK -> Employee.id" }
      - { name: adjudicated_by_director_id, type: string, source: system, required: false, description: "FK -> Employee.id of HRDirector; must differ from opened_by_hrbp_id (segregation of duties)" }
      - { name: adjudication_notes, type: string, source: input, required: false, description: "min 40 chars when adjudicating" }

  - name: RatingCycleOutcomeLink
    parent: PerformanceImprovementPlan
    common_fields: false
    fields:
      - { name: pip_id, type: string, source: system, description: "FK -> PerformanceImprovementPlan.id" }
      - { name: rating_cycle_id, type: string, source: system, description: "FK -> RatingCycle.id" }
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id" }
      - { name: pip_outcome_at_link, type: enum, source: system, description: "SUCCESS | EXTENSION | TERMINATION — copied from the APPROVED OutcomeDecision" }
      - { name: rating_cycle_status_at_link, type: enum, source: system, description: "Snapshot of RatingCycle.status at link creation" }
      - { name: link_created_at, type: datetime, source: system, description: "When the link was written" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: PerformanceConcern
    initial_state: DRAFT
    terminal_states: [REJECTED_INSUFFICIENT, SUPERSEDED_BY_PIP]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/performance-concerns/{concernId}/submit"
        actor: Manager
        preconditions:
          - "Concern.status == DRAFT (ERR_INVALID_STATE)"
          - "Acting manager (X-User-ID) == concern.raised_by_manager_id (ERR_FORBIDDEN)"
          - "len(coaching_log_entry_ids) >= 2 (ERR_INSUFFICIENT_COACHING_HISTORY)"
          - "Every entry in coaching_log_entry_ids resolves to ManagerCoachingLogEntry with employee_id == concern.employee_id (ERR_COACHING_ENTRY_MISMATCH)"
          - "Every referenced entry has severity IN {DOCUMENTED, ESCALATED} (ERR_COACHING_ENTRY_NOT_FORMAL)"
        side_effects:
          - "submitted_at = current_utc"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/performance-concerns/{concernId}/accept"
        actor: HRBusinessPartner
        preconditions:
          - "Concern.status == SUBMITTED (ERR_INVALID_STATE)"
          - "Acting HRBP (X-User-ID) != concern.raised_by_manager_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Employee.employment_status == ACTIVE (ERR_EMPLOYEE_NOT_ACTIVE)"
        side_effects:
          - "decided_at = current_utc; decided_by_hrbp_id = X-User-ID"
          - "Every linked ManagerCoachingLogEntry.severity flips to ESCALATED (cascade)"

      - from: SUBMITTED
        to: REJECTED_INSUFFICIENT
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/performance-concerns/{concernId}/reject"
        actor: HRBusinessPartner
        preconditions:
          - "Concern.status == SUBMITTED (ERR_INVALID_STATE)"
          - "Acting HRBP (X-User-ID) != concern.raised_by_manager_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_at = current_utc; decided_by_hrbp_id = X-User-ID"

      - from: ACCEPTED
        to: SUPERSEDED_BY_PIP
        trigger: "system (automatic when a PIP referencing this concern transitions DRAFT -> ISSUED)"
        actor: system
        preconditions:
          - "The new PIP.concern_id == this concern.id"
        side_effects: []

  - entity: PIPTemplate
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /hr-org-units/{ouId}/pip-templates/{templateId}/publish"
        actor: HRBusinessPartner
        preconditions:
          - "Template.template_status == DRAFT (ERR_INVALID_STATE)"
          - "goal_blueprints non-empty and weights sum to 100 (ERR_TEMPLATE_WEIGHT_SUM)"
          - "duration_days %% check_in_cadence_days == 0 (ERR_TEMPLATE_CADENCE_MISMATCH)"
        side_effects:
          - "published_at = current_utc"
          - "HROrgUnit.pip_policy_version += 1"
          - "published_version = HROrgUnit.pip_policy_version (post-increment)"

      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /hr-org-units/{ouId}/pip-templates/{templateId}/retire"
        actor: HRBusinessPartner
        preconditions:
          - "Template.template_status == PUBLISHED (ERR_INVALID_STATE)"
          - "No PerformanceImprovementPlan references this template with status IN {DRAFT, ISSUED, ACTIVE, EXTENDED} (ERR_TEMPLATE_IN_USE)"
        side_effects: []

  - entity: PerformanceImprovementPlan
    initial_state: DRAFT
    terminal_states: [CLOSED_SUCCESS, CLOSED_FAILED, CLOSED_TERMINATED, CLOSED_WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/issue"
        actor: HRBusinessPartner
        preconditions:
          - "PIP.status == DRAFT (ERR_INVALID_STATE)"
          - "Acting HRBP (X-User-ID) == pip.issuing_hrbp_id (ERR_FORBIDDEN)"
          - "All PIPGoal rows for the PIP have been materialized from the template (system check)"
          - "Concern.status == ACCEPTED (ERR_CONCERN_NOT_ACCEPTED)"
          - "Employee has no other PIP with status IN {ISSUED, ACTIVE, EXTENDED} (ERR_ACTIVE_PIP_EXISTS)"
          - "expected_pip_version in request body == pip.version (ERR_STALE_VERSION)"
        side_effects:
          - "Concern.status -> SUPERSEDED_BY_PIP"
          - "Employee.active_pip_id = pip.id"
          - "pip.version += 1"

      - from: ISSUED
        to: ACTIVE
        trigger: "system (automatic when current_utc >= start_date AND the first CheckIn is in SCHEDULED status)"
        actor: system
        preconditions:
          - "current_utc >= start_date"
          - "exists CheckIn for this PIP with status == SCHEDULED"
        side_effects: []

      - from: ACTIVE
        to: EXTENDED
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/extend (only via an APPROVED OutcomeDecision whose proposed_outcome == EXTENSION)"
        actor: system
        preconditions:
          - "extension_count < 1 (ERR_EXTENSION_LIMIT_EXCEEDED)"
        side_effects:
          - "end_date += template.duration_days // 2 (rounded down to whole days)"
          - "extension_count += 1"
          - "pip.version += 1"

      - from: EXTENDED
        to: ACTIVE
        trigger: "system (automatic upon APPROVED extension outcome)"
        actor: system
        preconditions: []
        side_effects: []
        note: "EXTENDED is a transient marker; system immediately re-enters ACTIVE for the extension window"

      - from: ACTIVE
        to: CLOSED_SUCCESS
        trigger: "system (automatic upon APPROVED OutcomeDecision with proposed_outcome == SUCCESS)"
        actor: system
        preconditions:
          - "Rebuttal window behavior: if a SUBMITTED or UNDER_REVIEW EmployeeRebuttal exists, the close is deferred until the rebuttal reaches UPHELD or OVERRULED; if OVERRULED, PIP -> CLOSED_FAILED instead"
        side_effects:
          - "Employee.active_pip_id = null"
          - "closed_at = current_utc"
          - "Create RatingCycleOutcomeLink for every RatingCycle in the same org unit whose [window_start, window_end) intersects [pip.start_date, pip.end_date) and whose status IN {OPEN, CALIBRATION, PUBLISHED}"

      - from: ACTIVE
        to: CLOSED_FAILED
        trigger: "system (upon APPROVED OutcomeDecision with proposed_outcome == EXTENSION when extension_count would exceed 1, OR upon an OVERRULED rebuttal against a SUCCESS outcome)"
        actor: system
        preconditions: []
        side_effects:
          - "Employee.active_pip_id = null"
          - "closed_at = current_utc"

      - from: ACTIVE
        to: CLOSED_TERMINATED
        trigger: "system (upon APPROVED OutcomeDecision with proposed_outcome == TERMINATION, after rebuttal window resolution)"
        actor: system
        preconditions:
          - "LegalReview for this PIP exists with status IN {SUBMITTED, OVERRIDDEN} (ERR_LEGAL_REVIEW_REQUIRED)"
        side_effects:
          - "Employee.employment_status = TERMINATED; terminated_at = current_utc"
          - "Employee.active_pip_id = null"
          - "closed_at = current_utc"
          - "Create RatingCycleOutcomeLink rows as in CLOSED_SUCCESS"

      - from: ISSUED
        to: CLOSED_WITHDRAWN
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/withdraw"
        actor: HRBusinessPartner
        preconditions:
          - "PIP.status IN {ISSUED, ACTIVE} (ERR_INVALID_STATE)"
          - "Acting HRBP == pip.issuing_hrbp_id (ERR_FORBIDDEN)"
          - "No OutcomeDecision exists for this PIP with status IN {PROPOSED, APPROVED} (ERR_OUTCOME_ALREADY_PROPOSED)"
        side_effects:
          - "Employee.active_pip_id = null"
          - "closed_at = current_utc"
          - "All CheckIn rows for this PIP with status == SCHEDULED flip to CANCELLED"

      - from: ACTIVE
        to: CLOSED_WITHDRAWN
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/withdraw"
        actor: HRBusinessPartner
        preconditions:
          - "same as ISSUED -> CLOSED_WITHDRAWN"
        side_effects:
          - "same as ISSUED -> CLOSED_WITHDRAWN"

  - entity: CheckIn
    initial_state: SCHEDULED
    terminal_states: [HELD, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/check-ins/{checkInId}/mark-held"
        actor: HRBusinessPartner
        preconditions:
          - "CheckIn.status == SCHEDULED (ERR_INVALID_STATE)"
          - "PIP.status IN {ACTIVE, EXTENDED} (ERR_PIP_NOT_ACTIVE)"
          - "manager_attended == true AND hrbp_attended == true in request (ERR_CHECKIN_QUORUM)"
          - "notes present, length >= 20 (ERR_INVALID_REQUEST)"
          - "current_utc >= scheduled_for (ERR_CHECKIN_TOO_EARLY)"
        side_effects:
          - "held_at = current_utc"
          - "For each EvidenceItem submitted against this CheckIn with admissibility == ADMISSIBLE: PIPGoal.current_value := observed_value of the most recent ADMISSIBLE evidence (by submitted_at DESC, tie-break created_at DESC); goal_status recomputed via goal_status_rule"
          - "PIP.provisional_attainment_ratio recomputed (PROVISIONAL variant)"

      - from: SCHEDULED
        to: MISSED
        trigger: "system (automatic when current_utc > scheduled_for + 3 days AND status still SCHEDULED)"
        actor: system
        preconditions: []
        side_effects:
          - "PIP.provisional_attainment_ratio recomputed (missed check-ins count as 0-progress for the interval)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade when PIP -> CLOSED_WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EvidenceItem
    initial_state: PENDING_REVIEW
    terminal_states: [ADMISSIBLE, INADMISSIBLE]
    transitions:
      - from: PENDING_REVIEW
        to: ADMISSIBLE
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/check-ins/{checkInId}/evidence/{evidenceId}/admit"
        actor: HRBusinessPartner
        preconditions:
          - "EvidenceItem.admissibility == PENDING_REVIEW (ERR_INVALID_STATE)"
          - "CheckIn.status == SCHEDULED (evidence is adjudicated before the check-in is held) (ERR_CHECKIN_ALREADY_HELD)"
          - "If evidence.submitted_by_id == pip.issuing_hrbp_id then acting HRBP != pip.issuing_hrbp_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "admissibility_decided_by_id = X-User-ID"

      - from: PENDING_REVIEW
        to: INADMISSIBLE
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/check-ins/{checkInId}/evidence/{evidenceId}/exclude"
        actor: HRBusinessPartner
        preconditions:
          - "same as admit"
        side_effects:
          - "admissibility_decided_by_id = X-User-ID"

  - entity: LegalReview
    initial_state: REQUESTED
    terminal_states: [SUBMITTED, OVERRIDDEN]
    transitions:
      - from: REQUESTED
        to: IN_REVIEW
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/legal-reviews/{reviewId}/claim"
        actor: LegalCounsel
        preconditions:
          - "LegalReview.status == REQUESTED (ERR_INVALID_STATE)"
          - "Acting counsel (X-User-ID) == assigned_counsel_id (ERR_FORBIDDEN)"
        side_effects: []

      - from: IN_REVIEW
        to: SUBMITTED
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/legal-reviews/{reviewId}/submit"
        actor: LegalCounsel
        preconditions:
          - "LegalReview.status == IN_REVIEW (ERR_INVALID_STATE)"
          - "Acting counsel == assigned_counsel_id (ERR_FORBIDDEN)"
          - "risk_factors, recommendation, rationale present (ERR_INVALID_REQUEST)"
        side_effects:
          - "risk_score computed via legal_risk_score calculation"
          - "submitted_at = current_utc"
          - "If recommendation == REJECT: any PROPOSED OutcomeDecision for this PIP flips to SUPERSEDED (cascade)"

      - from: SUBMITTED
        to: OVERRIDDEN
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/legal-reviews/{reviewId}/override"
        actor: HRDirector
        preconditions:
          - "LegalReview.status == SUBMITTED (ERR_INVALID_STATE)"
          - "recommendation == REJECT (only REJECT may be overridden) (ERR_LEGAL_OVERRIDE_NOT_ALLOWED)"
        side_effects:
          - "decided_by_director_id = X-User-ID"

  - entity: OutcomeDecision
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/outcome-decisions/{decisionId}/approve"
        actor: HRDirector
        preconditions:
          - "OutcomeDecision.status == PROPOSED (ERR_INVALID_STATE)"
          - "Acting director (X-User-ID) != proposed_by_hrbp_id (ERR_SEGREGATION_OF_DUTIES)"
          - "PIP.status IN {ACTIVE, EXTENDED} (ERR_PIP_NOT_ACTIVE)"
          - "If proposed_outcome == TERMINATION: LegalReview for this PIP exists with status IN {SUBMITTED, OVERRIDDEN} AND recommendation != REJECT (unless OVERRIDDEN) (ERR_LEGAL_REVIEW_REQUIRED)"
          - "If proposed_outcome == EXTENSION: pip.extension_count < 1 (ERR_EXTENSION_LIMIT_EXCEEDED)"
          - "If proposed_outcome == SUCCESS: pip.final_attainment_ratio >= 0.80 (ERR_ATTAINMENT_BELOW_THRESHOLD)"
          - "current_utc >= pip.end_date (ERR_PLAN_STILL_RUNNING)"
          - "expected_pip_version in request body == pip.version (ERR_STALE_VERSION)"
        side_effects:
          - "decided_at = current_utc; decided_by_director_id = X-User-ID"
          - "pip.rebuttal_window_closes_at = decided_at + 5 days"
          - "If proposed_outcome == SUCCESS and no rebuttal within window: PIP -> CLOSED_SUCCESS"
          - "If proposed_outcome == EXTENSION: PIP -> EXTENDED (then ACTIVE); end_date extended"
          - "If proposed_outcome == TERMINATION and no rebuttal within window: PIP -> CLOSED_TERMINATED (cascades to Employee.employment_status = TERMINATED)"
          - "pip.version += 1"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/outcome-decisions/{decisionId}/reject"
        actor: HRDirector
        preconditions:
          - "OutcomeDecision.status == PROPOSED (ERR_INVALID_STATE)"
          - "Acting director != proposed_by_hrbp_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_at = current_utc; decided_by_director_id = X-User-ID"

      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system (cascade when LegalReview.recommendation == REJECT is submitted, or when a newer OutcomeDecision is PROPOSED for the same PIP)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EmployeeRebuttal
    initial_state: SUBMITTED
    terminal_states: [UPHELD, OVERRULED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/rebuttals/{rebuttalId}/start-review"
        actor: HRBusinessPartner
        preconditions:
          - "Rebuttal.status == SUBMITTED (ERR_INVALID_STATE)"
          - "Acting HRBP != pip.issuing_hrbp_id AND acting HRBP != outcome_decision.proposed_by_hrbp_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_hrbp_id = X-User-ID"

      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/rebuttals/{rebuttalId}/resolve (resolution=UPHELD)"
        actor: HRBusinessPartner
        preconditions:
          - "Rebuttal.status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "Acting HRBP == reviewed_by_hrbp_id (ERR_FORBIDDEN)"
          - "resolution_rationale present, >= 40 chars (ERR_INVALID_REQUEST)"
        side_effects:
          - "If the rebutted OutcomeDecision was APPROVED with proposed_outcome == SUCCESS: PIP proceeds to CLOSED_SUCCESS"

      - from: UNDER_REVIEW
        to: OVERRULED
        trigger: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/rebuttals/{rebuttalId}/resolve (resolution=OVERRULED)"
        actor: HRBusinessPartner
        preconditions:
          - "same as UPHELD"
        side_effects:
          - "If the rebutted OutcomeDecision was APPROVED with proposed_outcome == SUCCESS: PIP -> CLOSED_FAILED (outcome reversed)"
          - "If the rebutted OutcomeDecision was APPROVED with proposed_outcome == TERMINATION: PIP -> CLOSED_FAILED and Employee.employment_status remains ACTIVE (termination rescinded)"

  - entity: ConsistencyReview
    initial_state: OPEN
    terminal_states: [ADJUDICATED_CONSISTENT, ADJUDICATED_INCONSISTENT]
    transitions:
      - from: OPEN
        to: ADJUDICATED_CONSISTENT
        trigger: "POST /hr-org-units/{ouId}/consistency-reviews/{reviewId}/adjudicate (adjudication=CONSISTENT)"
        actor: HRDirector
        preconditions:
          - "Review.status == OPEN (ERR_INVALID_STATE)"
          - "Acting director != opened_by_hrbp_id (ERR_SEGREGATION_OF_DUTIES)"
          - "cohort_size >= 3 (ERR_COHORT_TOO_SMALL)"
        side_effects:
          - "adjudicated_by_director_id = X-User-ID"

      - from: OPEN
        to: ADJUDICATED_INCONSISTENT
        trigger: "POST /hr-org-units/{ouId}/consistency-reviews/{reviewId}/adjudicate (adjudication=INCONSISTENT)"
        actor: HRDirector
        preconditions:
          - "same as CONSISTENT"
        side_effects:
          - "adjudicated_by_director_id = X-User-ID"

  - entity: RatingCycle
    initial_state: OPEN
    terminal_states: [ARCHIVED]
    transitions:
      - from: OPEN
        to: CALIBRATION
        trigger: "POST /hr-org-units/{ouId}/rating-cycles/{cycleId}/calibrate"
        actor: HRBusinessPartner
        preconditions:
          - "RatingCycle.status == OPEN (ERR_INVALID_STATE)"
          - "current_utc >= window_end (ERR_CYCLE_STILL_OPEN)"
        side_effects: []

      - from: CALIBRATION
        to: PUBLISHED
        trigger: "POST /hr-org-units/{ouId}/rating-cycles/{cycleId}/publish"
        actor: HRDirector
        preconditions:
          - "RatingCycle.status == CALIBRATION (ERR_INVALID_STATE)"
        side_effects: []

      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /hr-org-units/{ouId}/rating-cycles/{cycleId}/archive"
        actor: HRDirector
        preconditions:
          - "RatingCycle.status == PUBLISHED (ERR_INVALID_STATE)"
          - "current_utc >= window_end + 365 days (ERR_CYCLE_TOO_RECENT)"
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: pip-issue-stale-version
    parent_entity: PerformanceImprovementPlan
    write_endpoint: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/issue"
    occ_field: "expected_pip_version"
    description: |
      Issuing a PIP against a version the client has not observed is rejected.
      A second issuer acting on a stale view (e.g., after another writer has
      already added a CheckIn or amended the plan window) carries a stale
      expected_pip_version and is rejected with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: outcome-approve-stale-version
    parent_entity: PerformanceImprovementPlan
    write_endpoint: "POST /hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/outcome-decisions/{decisionId}/approve"
    occ_field: "expected_pip_version"
    description: |
      Approving an OutcomeDecision pins final state on the PIP. If the
      PIP's version has advanced since the director last read it (for
      example a CheckIn was held, evidence was admitted, or another
      OutcomeDecision superseded this one), the approval is rejected
      with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: pip_attainment_ratio
    trigger: "PIPGoal.current_value update (via CheckIn mark-held), CheckIn MISSED transition, outcome decision proposal"
    algorithm: weighted_scoring
    formula: |
      # Per-goal attainment is clamped to [0, 1].
      # For each PIPGoal g of the PIP:
      #   attainment_g = clamp(g.current_value / g.target_value, 0, 1)   if g.goal_status != WAIVED
      #   attainment_g = 1.0                                              if g.goal_status == WAIVED
      # ratio = sum(attainment_g * g.weight) / sum(g.weight where g.goal_status != WAIVED)
      # If every goal is WAIVED: ratio := 1.0
      # Rounding: round_half_up to 4 decimal places AFTER the weighted sum
      #   (do NOT round per-goal attainment before weighting).
    input_set: "PIPGoal rows of the PIP; variant determines which goals are included (see variants)"
    precision: "4 decimal places, round_half_up, applied once at the end"
    variants:
      - name: PROVISIONAL
        when: "Recomputed continuously during plan execution; reflects only ADMISSIBLE evidence from HELD check-ins"
        difference: "Includes only PIPGoal rows whose latest evidence is ADMISSIBLE; goals with no admissible evidence contribute attainment 0 but their weight still counts in the denominator"
      - name: FINAL
        when: "Computed once at OutcomeDecision proposal time; freezes the input set"
        difference: "Includes every PIPGoal regardless of evidence admissibility; for goals whose latest evidence is INADMISSIBLE or absent, uses the most recent HELD check-in's value if any, else 0; MISSED check-ins contribute a flat 0.5 attainment factor for the interval's goals (proportional penalty), capped so total ratio <= 1.0"

  - name: goal_status_rule
    trigger: "PIPGoal.current_value update"
    algorithm: threshold
    formula: |
      # pct = current_value / target_value
      # If pct >= 1.00               -> MET
      # Elsif pct >= 0.70            -> ON_TRACK
      # Elsif pct >= 0.40            -> AT_RISK
      # Else                         -> NOT_MET
      # Boundary: '>= 0.70' is inclusive (0.70 maps to ON_TRACK, 0.6999 to AT_RISK).
    constants:
      TIER_MET: 1.00
      TIER_ON_TRACK: 0.70
      TIER_AT_RISK: 0.40

  - name: legal_risk_score
    trigger: "LegalReview SUBMITTED transition"
    algorithm: weighted_scoring
    formula: |
      # Tiered, non-linear interaction with a floor and a documentation-gap multiplier.
      # base = sum(weight(f) for f in risk_factors)
      # Weights: PROTECTED_CLASS=20, RECENT_LEAVE=15, WHISTLEBLOWER_HISTORY=30,
      #          PRIOR_COMPLAINT=10, RETALIATION_WINDOW=25, DOCUMENTATION_GAP=0
      # If DOCUMENTATION_GAP in risk_factors:
      #     base = base * 2  (multiplicative interaction with other factors)
      # If base >= 50 AND WHISTLEBLOWER_HISTORY in risk_factors:
      #     base = base + 10  (compound trigger)
      # risk_score = clamp(base, 0, 100)
    constants:
      W_PROTECTED_CLASS: 20
      W_RECENT_LEAVE: 15
      W_WHISTLEBLOWER: 30
      W_PRIOR_COMPLAINT: 10
      W_RETALIATION: 25
      DOC_GAP_MULTIPLIER: 2
      COMPOUND_THRESHOLD: 50
      COMPOUND_BONUS: 10
    precision: "integer, floor after multiplication"

  - name: consistency_disparity_score
    trigger: "ConsistencyReview creation"
    algorithm: aggregation
    formula: |
      # Compare target PIP outcome distribution to cohort.
      # target_outcome = the APPROVED OutcomeDecision.proposed_outcome of the target PIP
      # cohort_outcomes = proposed_outcome of APPROVED OutcomeDecisions for cohort_pip_ids
      # p_target_in_cohort = count(cohort == target_outcome) / cohort_size
      # p_termination_in_cohort = count(cohort == TERMINATION) / cohort_size
      # disparity = |p_termination_in_cohort - (1 if target==TERMINATION else 0)|
      #           + 0.5 * (1 - p_target_in_cohort)
      # Rounded half-up to 4 decimal places.
      # Empty cohort (cohort_size == 0): disparity := null and the ConsistencyReview
      # cannot be created (ERR_COHORT_TOO_SMALL at creation).
    input_set: "cohort_pip_ids as computed by the cohort selector on ConsistencyReview"
    precision: "4 decimal places, round_half_up"

  - name: rating_alignment_score
    trigger: "ConsistencyReview creation"
    algorithm: aggregation
    formula: |
      # Correlates PIP outcome with rating cycle outcomes.
      # Consider the RatingCycleOutcomeLink rows for the target PIP.
      # If no links exist: score := 0.0
      # Else: score = (number of links where the link's RatingCycle was in PUBLISHED status at link time)
      #               / (total links)
      # Rounded half-up to 4 decimal places.
    input_set: "RatingCycleOutcomeLink rows where pip_id == target_pip_id"
    precision: "4 decimal places, round_half_up"

  - name: pip_end_date_extension
    trigger: "PIP EXTENDED transition"
    algorithm: projection
    formula: |
      # extension_days = floor(template.duration_days / 2)
      # new_end_date = old_end_date + extension_days
      # No rounding beyond floor (duration_days is integer).
    precision: "whole days, floor"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role has permission for the endpoint"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right: org unit, employee, concern/template/pip, check-in, evidence, review, decision, rebuttal"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Path resources belong to their declared parents (employee in org unit, pip under employee, etc.)"
    error_id: ERR_PARENT_MISMATCH
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 5
    category: state
    check: "OCC expected_pip_version (when present) matches pip.version; evaluated BEFORE any business check on PIP-mutating endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../pips/{pipId}/issue, POST .../outcome-decisions/{decisionId}/approve"

  - priority: 6
    category: state
    check: "Target resource state permits the transition (per state machine preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: acting user is not barred from this step (concern accept/reject, evidence admit/exclude, outcome approve, legal override, rebuttal review, consistency adjudicate)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "transition endpoints with SoD preconditions"

  - priority: 8
    category: business_safety
    check: "Employee is ACTIVE (employment_status == ACTIVE) for concern accept, PIP create, PIP issue"
    error_id: ERR_EMPLOYEE_NOT_ACTIVE
    http_status: 409
    applies_to: "concern accept, POST pips, POST pips/{id}/issue"

  - priority: 9
    category: business_temporal
    check: "Check-in timing rules: mark-held requires current_utc >= scheduled_for; scheduled_for must be within [pip.start_date, pip.end_date)"
    error_id: ERR_CHECKIN_TOO_EARLY
    http_status: 409
    applies_to: "check-in schedule/mark-held endpoints"

  - priority: 10
    category: business_temporal
    check: "Plan window rules: outcome approve requires current_utc >= pip.end_date; rating cycle calibrate requires current_utc >= window_end; archive requires window_end + 365d"
    error_id: ERR_PLAN_STILL_RUNNING
    http_status: 409
    applies_to: "outcome-decisions/{id}/approve, rating-cycle transitions"

  - priority: 11
    category: business_referential
    check: "Foreign-key integrity: concern.template/pip/goal/check-in/employee references resolve AND satisfy state filters (concern ACCEPTED, template PUBLISHED, goal belongs to pip, check-in belongs to pip)"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "POST endpoints with FK body fields"

  - priority: 12
    category: business_constraint
    check: "Coaching-log composition: >= 2 entries, all owned by the concern's employee, all severity IN {DOCUMENTED, ESCALATED}"
    error_id: ERR_INSUFFICIENT_COACHING_HISTORY
    http_status: 422
    applies_to: "POST concerns/{id}/submit"

  - priority: 13
    category: business_constraint
    check: "Template geometry: goal weights sum to 100, duration_days %% cadence == 0, 30 <= duration_days <= 180, 7 <= cadence <= 30"
    error_id: ERR_TEMPLATE_WEIGHT_SUM
    http_status: 422
    applies_to: "POST pip-templates, POST pip-templates/{id}/publish"

  - priority: 14
    category: business_constraint
    check: "Single-active-PIP invariant per employee"
    error_id: ERR_ACTIVE_PIP_EXISTS
    http_status: 409
    applies_to: "POST pips, POST pips/{id}/issue"

  - priority: 15
    category: business_constraint
    check: "Check-in cadence: adjacent scheduled_for values exactly check_in_interval_days apart; sequence_index contiguous"
    error_id: ERR_CHECKIN_CADENCE_VIOLATION
    http_status: 422
    applies_to: "POST pips/{id}/check-ins"

  - priority: 16
    category: business_constraint
    check: "Check-in quorum: manager_attended AND hrbp_attended must both be true at mark-held"
    error_id: ERR_CHECKIN_QUORUM
    http_status: 422
    applies_to: "POST check-ins/{id}/mark-held"

  - priority: 17
    category: business_constraint
    check: "Outcome precondition: SUCCESS requires final_attainment_ratio >= 0.80"
    error_id: ERR_ATTAINMENT_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST outcome-decisions (proposed_outcome=SUCCESS), POST outcome-decisions/{id}/approve"

  - priority: 18
    category: business_constraint
    check: "Extension precondition: extension_count < 1"
    error_id: ERR_EXTENSION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST outcome-decisions (proposed_outcome=EXTENSION), POST outcome-decisions/{id}/approve (EXTENSION)"

  - priority: 19
    category: business_safety
    check: "TERMINATION outcome requires a LegalReview with status IN {SUBMITTED, OVERRIDDEN} and recommendation != REJECT (unless OVERRIDDEN)"
    error_id: ERR_LEGAL_REVIEW_REQUIRED
    http_status: 409
    applies_to: "POST outcome-decisions (proposed_outcome=TERMINATION), POST outcome-decisions/{id}/approve (TERMINATION)"

  - priority: 20
    category: business_constraint
    check: "ConsistencyReview cohort must have at least 3 comparable closed PIPs"
    error_id: ERR_COHORT_TOO_SMALL
    http_status: 422
    applies_to: "POST consistency-reviews, POST consistency-reviews/{id}/adjudicate"

  - priority: 21
    category: business_fiscal
    check: "Rebuttal submission must land within the rebuttal window: current_utc <= outcome_decision.decided_at + 5 days"
    error_id: ERR_REBUTTAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST pips/{id}/rebuttals"

  - priority: 22
    category: business_constraint
    check: "String length floors: concern.summary >= 20, coaching narrative >= 40, legal rationale >= 40, outcome rationale >= 40, rebuttal body >= 100, adjudication notes >= 40"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "corresponding POST endpoints"

  - priority: 23
    category: business_constraint
    check: "Enum membership and range checks on input fields"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Org units & clock ---
  - method: POST
    path: "/hr-org-units"
    description: "Create an HR org unit"
    roles: [HRSystemAdmin]
    code: 201
    input: [name]
    output: HROrgUnit
    side_effects: ["current_utc initialized to 2026-08-01T00:00:00Z; pip_policy_version = 1"]

  - method: GET
    path: "/hr-org-units/{ouId}"
    description: "Get an org unit"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: []
    output: HROrgUnit
    side_effects: []

  - method: POST
    path: "/hr-org-units/{ouId}/_clock/set_current_utc"
    description: "Set the org unit's logical clock (test-driving). Server starts at 2026-08-01T00:00:00Z before any call; this endpoint is the only way time advances."
    roles: [HRSystemAdmin]
    code: 200
    input: [to_iso8601]
    output: HROrgUnit
    side_effects:
      - "current_utc = to_iso8601 (must be monotonically non-decreasing)"
      - "Triggers system transitions whose preconditions now hold (PIP ISSUED->ACTIVE, CheckIn MISSED sweep)"

  # --- Employees ---
  - method: POST
    path: "/hr-org-units/{ouId}/employees"
    description: "Create an employee"
    roles: [HRSystemAdmin]
    code: 201
    input: [full_name, email, job_family, job_level, "manager_id?"]
    output: Employee
    side_effects: ["employment_status = ACTIVE"]

  - method: GET
    path: "/hr-org-units/{ouId}/employees/{empId}"
    description: "Get an employee"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: GET
    path: "/hr-org-units/{ouId}/employees"
    description: "List employees"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: ["job_family?", "job_level?", "employment_status?", "manager_id?", "limit?", "offset?"]
    output: "Employee[]"
    side_effects: []

  # --- Coaching log ---
  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/coaching-log-entries"
    description: "Append a coaching log entry (author must be the employee's direct manager)"
    roles: [Manager]
    code: 201
    input: [occurred_at, category, severity, narrative]
    output: ManagerCoachingLogEntry
    side_effects: []

  - method: GET
    path: "/hr-org-units/{ouId}/employees/{empId}/coaching-log-entries"
    description: "List coaching entries for an employee"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager]
    code: 200
    input: ["category?", "severity?", "concern_id?", "limit?", "offset?"]
    output: "ManagerCoachingLogEntry[]"
    side_effects: []

  # --- Performance concerns ---
  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/performance-concerns"
    description: "Raise a performance concern"
    roles: [Manager]
    code: 201
    input: [category, summary, coaching_log_entry_ids]
    output: PerformanceConcern
    side_effects: ["status = DRAFT; raised_by_manager_id = X-User-ID"]

  - method: GET
    path: "/hr-org-units/{ouId}/employees/{empId}/performance-concerns"
    description: "List concerns for an employee"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: "PerformanceConcern[]"
    side_effects: []

  - method: GET
    path: "/hr-org-units/{ouId}/employees/{empId}/performance-concerns/{concernId}"
    description: "Get a concern"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager]
    code: 200
    input: []
    output: PerformanceConcern
    side_effects: []

  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/performance-concerns/{concernId}/submit"
    description: "Submit a DRAFT concern for HR review"
    roles: [Manager]
    code: 200
    input: []
    output: PerformanceConcern
    side_effects: ["status -> SUBMITTED; submitted_at = current_utc"]

  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/performance-concerns/{concernId}/accept"
    description: "HRBP accepts a SUBMITTED concern"
    roles: [HRBusinessPartner]
    code: 200
    input: []
    output: PerformanceConcern
    side_effects: ["status -> ACCEPTED; linked coaching entries escalate to ESCALATED"]

  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/performance-concerns/{concernId}/reject"
    description: "HRBP rejects a SUBMITTED concern as insufficient"
    roles: [HRBusinessPartner]
    code: 200
    input: []
    output: PerformanceConcern
    side_effects: ["status -> REJECTED_INSUFFICIENT"]

  # --- PIP Templates ---
  - method: POST
    path: "/hr-org-units/{ouId}/pip-templates"
    description: "Create a PIP template"
    roles: [HRBusinessPartner]
    code: 201
    input: [name, category, goal_blueprints, duration_days, check_in_cadence_days]
    output: PIPTemplate
    side_effects: ["template_status = DRAFT"]

  - method: GET
    path: "/hr-org-units/{ouId}/pip-templates"
    description: "List templates"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: ["template_status?", "category?", "limit?", "offset?"]
    output: "PIPTemplate[]"
    side_effects: []

  - method: GET
    path: "/hr-org-units/{ouId}/pip-templates/{templateId}"
    description: "Get a template"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: []
    output: PIPTemplate
    side_effects: []

  - method: POST
    path: "/hr-org-units/{ouId}/pip-templates/{templateId}/publish"
    description: "Publish a template (bumps org-unit policy version)"
    roles: [HRBusinessPartner]
    code: 200
    input: []
    output: PIPTemplate
    side_effects: ["template_status -> PUBLISHED; HROrgUnit.pip_policy_version += 1; published_version pinned"]

  - method: POST
    path: "/hr-org-units/{ouId}/pip-templates/{templateId}/retire"
    description: "Retire a PUBLISHED template"
    roles: [HRBusinessPartner]
    code: 200
    input: []
    output: PIPTemplate
    side_effects: ["template_status -> RETIRED"]

  # --- PIPs ---
  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips"
    description: "Create a PIP (in DRAFT) bound to an ACCEPTED concern and a PUBLISHED template"
    roles: [HRBusinessPartner]
    code: 201
    input: [concern_id, template_id, start_date]
    output: PerformanceImprovementPlan
    side_effects:
      - "status = DRAFT; issuing_hrbp_id = X-User-ID"
      - "template_published_version & policy_version_at_issuance pinned"
      - "end_date computed"
      - "PIPTGoal rows materialized from template.goal_blueprints (status=PENDING, current_value=0)"

  - method: GET
    path: "/hr-org-units/{ouId}/employees/{empId}/pips"
    description: "List PIPs for an employee"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PerformanceImprovementPlan[]"
    side_effects: []

  - method: GET
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}"
    description: "Get a PIP"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: []
    output: PerformanceImprovementPlan
    side_effects: []

  - method: GET
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/goals"
    description: "List goals for a PIP"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: ["goal_status?", "limit?", "offset?"]
    output: "PIPGoal[]"
    side_effects: []

  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/issue"
    description: "Issue a DRAFT PIP (OCC-guarded)"
    roles: [HRBusinessPartner]
    code: 200
    input: [expected_pip_version]
    output: PerformanceImprovementPlan
    side_effects: ["status -> ISSUED; concern -> SUPERSEDED_BY_PIP; employee.active_pip_id = pip.id; pip.version += 1"]

  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/withdraw"
    description: "Withdraw an ISSUED/ACTIVE PIP"
    roles: [HRBusinessPartner]
    code: 200
    input: []
    output: PerformanceImprovementPlan
    side_effects: ["status -> CLOSED_WITHDRAWN; scheduled check-ins CANCELLED; employee.active_pip_id = null"]

  # --- Check-ins ---
  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/check-ins"
    description: "Schedule a check-in"
    roles: [HRBusinessPartner]
    code: 201
    input: [scheduled_for]
    output: CheckIn
    side_effects: ["status = SCHEDULED; sequence_index assigned"]

  - method: GET
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/check-ins"
    description: "List check-ins for a PIP"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CheckIn[]"
    side_effects: []

  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/check-ins/{checkInId}/mark-held"
    description: "Mark a check-in held (triggers goal update + attainment recompute)"
    roles: [HRBusinessPartner]
    code: 200
    input: [manager_attended, hrbp_attended, notes]
    output: CheckIn
    side_effects: ["status -> HELD; goal_status + provisional_attainment_ratio recomputed"]

  # --- Evidence ---
  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/check-ins/{checkInId}/evidence"
    description: "Submit evidence against a goal for a check-in"
    roles: [Manager, HRBusinessPartner]
    code: 201
    input: [pip_goal_id, observed_value, source]
    output: EvidenceItem
    side_effects: ["admissibility = PENDING_REVIEW; submitted_by_id = X-User-ID; submitted_at = current_utc"]

  - method: GET
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/check-ins/{checkInId}/evidence"
    description: "List evidence for a check-in"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager]
    code: 200
    input: ["admissibility?", "pip_goal_id?", "limit?", "offset?"]
    output: "EvidenceItem[]"
    side_effects: []

  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/check-ins/{checkInId}/evidence/{evidenceId}/admit"
    description: "HRBP adjudicates evidence ADMISSIBLE"
    roles: [HRBusinessPartner]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: ["admissibility -> ADMISSIBLE"]

  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/check-ins/{checkInId}/evidence/{evidenceId}/exclude"
    description: "HRBP adjudicates evidence INADMISSIBLE"
    roles: [HRBusinessPartner]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: ["admissibility -> INADMISSIBLE"]

  # --- Legal reviews ---
  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/legal-reviews"
    description: "Request a legal review for a PIP"
    roles: [HRBusinessPartner]
    code: 201
    input: [assigned_counsel_id]
    output: LegalReview
    side_effects: ["status = REQUESTED"]

  - method: GET
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/legal-reviews"
    description: "List legal reviews for a PIP"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "LegalReview[]"
    side_effects: []

  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/legal-reviews/{reviewId}/claim"
    description: "Assigned counsel claims the review"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: LegalReview
    side_effects: ["status -> IN_REVIEW"]

  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/legal-reviews/{reviewId}/submit"
    description: "Counsel submits risk assessment"
    roles: [LegalCounsel]
    code: 200
    input: [risk_factors, recommendation, rationale]
    output: LegalReview
    side_effects: ["risk_score computed; status -> SUBMITTED; if REJECT: PROPOSED outcome-decisions SUPERSEDED"]

  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/legal-reviews/{reviewId}/override"
    description: "HR Director overrides a REJECT recommendation"
    roles: [HRDirector]
    code: 200
    input: []
    output: LegalReview
    side_effects: ["status -> OVERRIDDEN; decided_by_director_id = X-User-ID"]

  # --- Outcome decisions ---
  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/outcome-decisions"
    description: "Propose an outcome for a PIP"
    roles: [HRBusinessPartner]
    code: 201
    input: [proposed_outcome, rationale]
    output: OutcomeDecision
    side_effects: ["status = PROPOSED; final_attainment_ratio_at_decision computed (FINAL variant); existing PROPOSED decisions for this PIP -> SUPERSEDED"]

  - method: GET
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/outcome-decisions"
    description: "List outcome decisions for a PIP"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "OutcomeDecision[]"
    side_effects: []

  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/outcome-decisions/{decisionId}/approve"
    description: "HR Director approves an outcome (OCC-guarded)"
    roles: [HRDirector]
    code: 200
    input: [expected_pip_version]
    output: OutcomeDecision
    side_effects: ["status -> APPROVED; decided_at set; rebuttal_window_closes_at = decided_at + 5 days; pip.status transitions per outcome"]

  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/outcome-decisions/{decisionId}/reject"
    description: "HR Director rejects an outcome"
    roles: [HRDirector]
    code: 200
    input: []
    output: OutcomeDecision
    side_effects: ["status -> REJECTED"]

  # --- Rebuttals ---
  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/rebuttals"
    description: "Employee submits a rebuttal within the 5-day window"
    roles: [Employee]
    code: 201
    input: [outcome_decision_id, body]
    output: EmployeeRebuttal
    side_effects: ["status = SUBMITTED; submitted_by_employee_id = X-User-ID (must equal pip.employee_id)"]

  - method: GET
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/rebuttals"
    description: "List rebuttals"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "EmployeeRebuttal[]"
    side_effects: []

  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/rebuttals/{rebuttalId}/start-review"
    description: "HRBP starts review (must not be issuing HRBP or outcome proposer)"
    roles: [HRBusinessPartner]
    code: 200
    input: []
    output: EmployeeRebuttal
    side_effects: ["status -> UNDER_REVIEW; reviewed_by_hrbp_id = X-User-ID"]

  - method: POST
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/rebuttals/{rebuttalId}/resolve"
    description: "HRBP resolves the rebuttal"
    roles: [HRBusinessPartner]
    code: 200
    input: [resolution, resolution_rationale]
    output: EmployeeRebuttal
    side_effects: ["status -> UPHELD or OVERRULED; PIP outcome may reverse"]

  # --- Rating cycles ---
  - method: POST
    path: "/hr-org-units/{ouId}/rating-cycles"
    description: "Create a rating cycle"
    roles: [HRBusinessPartner]
    code: 201
    input: [label, window_start, window_end]
    output: RatingCycle
    side_effects: ["status = OPEN"]

  - method: GET
    path: "/hr-org-units/{ouId}/rating-cycles"
    description: "List rating cycles"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RatingCycle[]"
    side_effects: []

  - method: POST
    path: "/hr-org-units/{ouId}/rating-cycles/{cycleId}/calibrate"
    description: "Move cycle to CALIBRATION"
    roles: [HRBusinessPartner]
    code: 200
    input: []
    output: RatingCycle
    side_effects: ["status -> CALIBRATION"]

  - method: POST
    path: "/hr-org-units/{ouId}/rating-cycles/{cycleId}/publish"
    description: "Publish cycle ratings"
    roles: [HRDirector]
    code: 200
    input: []
    output: RatingCycle
    side_effects: ["status -> PUBLISHED"]

  - method: POST
    path: "/hr-org-units/{ouId}/rating-cycles/{cycleId}/archive"
    description: "Archive a PUBLISHED cycle"
    roles: [HRDirector]
    code: 200
    input: []
    output: RatingCycle
    side_effects: ["status -> ARCHIVED"]

  # --- RatingCycleOutcomeLink ---
  - method: GET
    path: "/hr-org-units/{ouId}/employees/{empId}/pips/{pipId}/rating-cycle-outcome-links"
    description: "List PIP<->rating-cycle links (system-generated)"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: ["rating_cycle_id?", "limit?", "offset?"]
    output: "RatingCycleOutcomeLink[]"
    side_effects: []

  # --- Consistency reviews ---
  - method: POST
    path: "/hr-org-units/{ouId}/consistency-reviews"
    description: "Open a consistency review against a closed PIP"
    roles: [HRBusinessPartner]
    code: 201
    input: [target_pip_id]
    output: ConsistencyReview
    side_effects: ["status = OPEN; cohort computed; outcome_disparity_score & rating_alignment_score computed"]

  - method: GET
    path: "/hr-org-units/{ouId}/consistency-reviews"
    description: "List consistency reviews"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ConsistencyReview[]"
    side_effects: []

  - method: GET
    path: "/hr-org-units/{ouId}/consistency-reviews/{reviewId}"
    description: "Get a consistency review"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel]
    code: 200
    input: []
    output: ConsistencyReview
    side_effects: []

  - method: POST
    path: "/hr-org-units/{ouId}/consistency-reviews/{reviewId}/adjudicate"
    description: "HR Director adjudicates"
    roles: [HRDirector]
    code: 200
    input: [adjudication, adjudication_notes]
    output: ConsistencyReview
    side_effects: ["status -> ADJUDICATED_CONSISTENT or ADJUDICATED_INCONSISTENT"]


  # =========================================================================
  # Flat query endpoints — alternate access paths that satisfy FK
  # reverse-reachability per §1.5. Each child entity has a single-resource
