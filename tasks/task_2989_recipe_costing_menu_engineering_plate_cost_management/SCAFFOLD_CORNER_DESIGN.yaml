              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { portion0: $.data.portion_cost_micros }
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-MW", name: "Grilled Cheese", recipe_id: "${grill_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { mi_id: $.data.id }
            - call: "POST /culinary/menu-items/${mi_id}/plate-cost"
              as: CostAnalyst
              captures: { plate0: $.data.plate_cost_cents }
            - call: "POST /culinary/menu-items/${mi_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/menu-period-reviews"
              payload: { unit_id: "${unit_id}", period_start: "2026-07-01T00:00:00.000Z", period_end: "2026-08-01T00:00:00.000Z", basis: "SALES_MIX_BASED" }
              as: CostAnalyst
              captures: { rev_id: $.data.id, rev_st0: $.data.status }
          trigger:
            - call: "POST /culinary/menu-period-reviews/${rev_id}/mix-lines"
              payload: { menu_item_id: "00000000-0000-4000-8000-00000000beef", units_sold: 100, gross_sales_cents: 40000 }
              as: CostAnalyst
              captures: { e_item: $.data.error_id }
            - call: "POST /culinary/menu-period-reviews/00000000-0000-4000-8000-00000000cafe/mix-lines"
              payload: { menu_item_id: "${mi_id}", units_sold: 100, gross_sales_cents: 40000 }
              as: CostAnalyst
              captures: { e_review: $.data.error_id }
            - call: "POST /culinary/menu-period-reviews/${rev_id}/mix-lines"
              payload: { menu_item_id: "${mi_id}", units_sold: 100, gross_sales_cents: 40000 }
              as: CostAnalyst
              captures: { ml_id: $.data.id, ml_rev: $.data.period_review_id, ml_item: $.data.menu_item_id, ml_snap: $.data.plate_cost_cents_snapshot, ml_pct: $.data.mix_pct_bps, ml_cm: $.data.cm_per_unit_cents, ml_class: $.data.margin_class }
            - call: "GET /culinary/menu-period-reviews/${rev_id}"
              as: CostAnalyst
              captures: { rev_st1: $.data.status, rev_units: $.data.total_units_sold, rev_sales: $.data.total_gross_sales_cents }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-15T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed2_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed2_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 33000000, effective_from: "2026-07-15T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed2_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { portion1: $.data.portion_cost_micros }
            - call: "POST /culinary/menu-items/${mi_id}/plate-cost"
              as: CostAnalyst
              captures: { plate1: $.data.plate_cost_cents }
            - call: "GET /culinary/menu-period-reviews/${rev_id}/mix-lines"
              payload: { limit: 10, offset: 0 }
              as: CostAnalyst
              captures: { ml_snap_after: "$.data[0].plate_cost_cents_snapshot", ml_units_after: "$.data[0].units_sold", ml_total: $.pagination.total_count }
          assert:
            - "${portion0} == 970018, ${plate0} == 103 and ${rev_st0} == OPEN"
            - "${e_item} == ERR_MENU_ITEM_NOT_FOUND (404) and ${e_review} == ERR_PERIOD_REVIEW_NOT_FOUND (404) — the two ends of the link fail differently, and the review-level 404 wins on the path even though the body is valid"
            - "the link is minted with ${ml_rev} == ${rev_id} taken from the PATH (period_review_id is a system field, not an input), ${ml_item} == ${mi_id} and ${ml_snap} == 103 copied from the item at load time"
            - "${ml_pct} == 0, ${ml_cm} == 0 and ${ml_class} == UNCLASSIFIED — the line carries no mix figures until a classification runs"
            - "${rev_st1} == MIX_LOADED (the first line auto-advances the review), ${rev_units} == 100 and ${rev_sales} == 40000"
            - "the plate cost then genuinely moves: ${portion1} == 1455027 == round_half_up(round_half_up(400*33000000/2268)/4) and ${plate1} == 151 == round_half_up((1484128 + 22262)/10000)"
            - "${ml_snap_after} == 103, NOT 151, with ${ml_units_after} == 100 and ${ml_total} == 1 — the snapshot is a value copy taken at link time and the period's history is immune to later re-costing"

      - name: action_endpoint_state_transition_with_cross_entity_preconditions
        claim_type: action_endpoint
        excluded_because:
          difficulty_instance: menu_item_activation_requires_backing_recipe_active
          rationale: "The action-endpoint row asks for a state transition that fires on its trigger and refuses when its preconditions fail. The §1.8 cross_entity_state_dependency instance already drives POST /culinary/menu-items/{menu_item_id}/activate through every arm of that pattern: the transition succeeding from DRAFT, and each cross-entity precondition failing on its own — the recipe not ACTIVE, the plate cost not FRESH and the allergen mask undeclared — with the ordering between them pinned. Re-deriving a second action endpoint here would duplicate that walk with weaker figures."

  - section: errors
    instances:
      - name: every_not_found_names_the_resource_the_path_addresses
        claim_type: every_error_triggerable
        grounds:
          - validations[priority 4] ERR_UNIT_NOT_FOUND
          - validations[priority 6] ERR_PRICE_FEED_NOT_FOUND
          - validations[priority 10] ERR_PROPOSAL_NOT_FOUND
          - validations[priority 11] ERR_SPEC_CHANGE_ORDER_NOT_FOUND
          - validations[priority 13] ERR_LTO_NOT_FOUND
        distinguishing_aspect: "Five distinct 404s that a single generic NOT_FOUND would collapse into one. The sweep also feeds a REAL id of the wrong type into each path — a Unit id in the price-feed path and a PriceFeed id in the proposal path — so an implementation that looks the id up in a shared table, or that returns the first matching row of any type, is caught even though both ids exist."
        test_recipe:
          setup:
            - "One Unit STORE-001 in MW and one DRAFT PriceFeed, created only so their ids can be pushed down the wrong paths. Nothing else exists: no proposal, no spec change order and no LTO campaign anywhere in the system."
          setup_api_calls:
            - call: "POST /culinary/units"
              payload: { code: "STORE-001", name: "Downtown", region_code: "MW" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed_id: $.data.id }
          trigger:
            - call: "GET /culinary/units/00000000-0000-4000-8000-000000000001"
              as: PlatformAdmin
              captures: { e_unit: $.data.error_id }
            - call: "GET /culinary/price-feeds/00000000-0000-4000-8000-000000000002"
              as: CostAnalyst
              captures: { e_feed: $.data.error_id }
            - call: "GET /culinary/price-change-proposals/00000000-0000-4000-8000-000000000003"
              as: CostAnalyst
              captures: { e_prop: $.data.error_id }
            - call: "GET /culinary/spec-change-orders/00000000-0000-4000-8000-000000000004"
              as: RecipeDeveloper
              captures: { e_sco: $.data.error_id }
            - call: "GET /culinary/lto-campaigns/00000000-0000-4000-8000-000000000005"
              as: CostAnalyst
              captures: { e_lto: $.data.error_id }
            - call: "GET /culinary/price-feeds/${unit_id}"
              as: CostAnalyst
              captures: { e_cross_feed: $.data.error_id }
            - call: "GET /culinary/price-change-proposals/${feed_id}"
              as: CostAnalyst
              captures: { e_cross_prop: $.data.error_id }
            - call: "GET /culinary/spec-change-orders/${unit_id}"
              as: RecipeDeveloper
              captures: { e_cross_sco: $.data.error_id }
            - call: "GET /culinary/lto-campaigns/${feed_id}"
              as: CostAnalyst
              captures: { e_cross_lto: $.data.error_id }
            - call: "GET /culinary/units/${unit_id}"
              as: PlatformAdmin
              captures: { ok_code: $.data.code }
          assert:
            - "${e_unit} == ERR_UNIT_NOT_FOUND, ${e_feed} == ERR_PRICE_FEED_NOT_FOUND, ${e_prop} == ERR_PROPOSAL_NOT_FOUND, ${e_sco} == ERR_SPEC_CHANGE_ORDER_NOT_FOUND and ${e_lto} == ERR_LTO_NOT_FOUND — five different ids, five different codes, all HTTP 404"
            - "${e_cross_feed} == ERR_PRICE_FEED_NOT_FOUND for a Unit id that exists, ${e_cross_prop} == ERR_PROPOSAL_NOT_FOUND for a PriceFeed id that exists, ${e_cross_sco} == ERR_SPEC_CHANGE_ORDER_NOT_FOUND and ${e_cross_lto} == ERR_LTO_NOT_FOUND — existence is scoped per entity type, so a real id of the wrong type is still absent"
            - "${ok_code} == STORE-001 — the same path with the right id returns 200, so the sweep is not passing by rejecting everything"

      - name: authentication_outranks_authorization_and_both_outrank_existence_and_schema
        claim_type: every_error_triggerable
        grounds:
          - validations[priority 1] ERR_UNAUTHENTICATED
          - validations[priority 2] ERR_UNAUTHORIZED
          - validations[priority 3] ERR_INVALID_REQUEST
          - validations[priority 9] ERR_MENU_ITEM_NOT_FOUND
        distinguishing_aspect: "The top of the priority ladder, probed where two rules are violated at once. A request with no role header and a malformed body returns 401 and not 400; a forbidden role pointed at a non-existent id returns 403 and not 404; a forbidden role with a malformed body returns 403 and not 400. An unrecognised role string is an authorization failure and not an authentication one, because the header IS present."
        test_recipe:
          setup:
            - "One Unit STORE-001 in MW, created by the only role allowed to: PlatformAdmin. Nothing else is needed — every arm below is rejected before it can touch domain state."
          setup_api_calls:
            - call: "POST /culinary/units"
              payload: { code: "STORE-001", name: "Downtown", region_code: "MW" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "GET /culinary/units/${unit_id}"
              as: "(no X-User-Role and no X-User-ID header at all)"
              captures: { e_none: $.data.error_id }
            - call: "GET /culinary/units/${unit_id}"
              as: ""
              as_user_id: "user-admin-1"
              captures: { e_empty_role: $.data.error_id }
            - call: "GET /culinary/units/${unit_id}"
              as: PlatformAdmin
              as_user_id: ""
              captures: { e_empty_user: $.data.error_id }
            - call: "POST /culinary/units"
              payload: { region_code: "MW" }
              as: "(no X-User-Role and no X-User-ID header at all)"
              captures: { e_none_bad_body: $.data.error_id }
            - call: "POST /culinary/units"
              payload: { code: "STORE-002", name: "Uptown", region_code: "MW" }
              as: CostAnalyst
              captures: { e_role: $.data.error_id }
            - call: "POST /culinary/units"
              payload: { region_code: "MW" }
              as: CostAnalyst
              captures: { e_role_bad_body: $.data.error_id }
            - call: "POST /culinary/menu-items/00000000-0000-4000-8000-00000000feed/activate"
              as: RecipeDeveloper
              captures: { e_role_missing_id: $.data.error_id }
            - call: "GET /culinary/units/${unit_id}"
              as: SousChef
              captures: { e_unknown_role: $.data.error_id }
            - call: "POST /culinary/units"
              payload: { region_code: "MW" }
              as: PlatformAdmin
              captures: { e_schema: $.data.error_id }
            - call: "GET /culinary/recipe-components"
              payload: { limit: 0, offset: 0 }
              as: PlatformAdmin
              captures: { e_limit: $.data.error_id }
          assert:
            - "${e_none} == ERR_UNAUTHENTICATED (401) — both headers absent"
            - "${e_empty_role} == ERR_UNAUTHENTICATED (401) and ${e_empty_user} == ERR_UNAUTHENTICATED (401): priority 1 demands present AND non-empty, so a header sent as an empty string is not a header"
            - "${e_none_bad_body} == ERR_UNAUTHENTICATED (401), NOT ERR_INVALID_REQUEST — priority 1 runs before the body is ever parsed"
            - "${e_role} == ERR_UNAUTHORIZED (403) — CostAnalyst is a declared role but is not in the roles list of POST /culinary/units"
            - "${e_role_bad_body} == ERR_UNAUTHORIZED (403), NOT ERR_INVALID_REQUEST — priority 2 still beats priority 3"
            - "${e_role_missing_id} == ERR_UNAUTHORIZED (403), NOT ERR_MENU_ITEM_NOT_FOUND: activate is CulinaryDirector-only, and priority 2 beats priority 9, so a forbidden caller learns nothing about whether the id exists"
            - "${e_unknown_role} == ERR_UNAUTHORIZED (403), NOT 401 — the header is present and non-empty, it simply names no declared role, which priority 2 owns"
            - "${e_schema} == ERR_INVALID_REQUEST (400) — with the right role, the same malformed body finally reaches the schema gate, proving the earlier 401/403 were ordering and not just body rejection"
            - "${e_limit} == ERR_INVALID_REQUEST (400) — limit must be within 1..100, so 0 is out of range even for an authorized caller"

      - name: menu_item_status_gates_the_submission_but_not_the_plate_cost_or_the_draft
        claim_type: every_error_triggerable
        grounds:
          - validations[priority 20] ERR_MENU_ITEM_INVALID_STATE
          - endpoints[POST /culinary/menu-items/{menu_item_id}/plate-cost]
          - endpoints[POST /culinary/price-change-proposals]
        distinguishing_aspect: "One status, three different answers on the same DRAFT item: the plate cost recomputes (it must, or the item could never be activated), the proposal is created (creation is ungated), and the submission is refused with ERR_MENU_ITEM_INVALID_STATE — as is loading the DRAFT item into a period review. Activating the item then makes the very same submit succeed with no other change, which is what proves the error was about status and not about the projection."
        test_recipe:
          setup:
