        payload: {}
        as: DonorAdvocate
        as_user_id: ${adv_id}
      assert:
      - HTTP 200 with advocacy_status == DISCLOSED
      - disclosure_sequence == 1 and disclosure_at == 2026-08-01T00:00:00Z
      - cooling_off_ends_at == 2026-08-08T00:00:00Z (7 directed days, no non-directed surcharge, no halving)
      - medical_status and psychosocial_status remain PENDING and overall_status remains REFERRED
      - attestation_at and final_risk_index remain null
