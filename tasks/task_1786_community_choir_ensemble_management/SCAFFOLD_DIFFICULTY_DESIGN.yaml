          trigger:
            - { call: "POST /v1/program-pieces/${p_id}/confirm", payload: {}, as: ChoirDirector, captures: { err: $.data.error_id } }
            - { call: "POST /v1/guest-contracts/${gc}/accept", payload: {}, as: ChoirDirector }
            - { call: "POST /v1/program-pieces/${p_id}/confirm", payload: {}, as: ChoirDirector }
          assert:
            - "First confirm error_id == ERR_CONTRACT_NOT_ACCEPTED"
            - "After contract ACCEPTED: ProgramPiece.${p_id}.status == CONFIRMED"

      - name: member_activation_requires_invoice_paid
        grounds:
          - state_machines.Member.ENROLLED_to_ACTIVE
          - state_machines.DuesInvoice.ISSUED_to_PAID
          - calculations.performance_eligibility
        distinguishing_aspect: |
          Pair Member->DuesInvoice (different pair than piece->contract): member
          stays ENROLLED with performance_eligible false until the invoice reaches
          PAID, at which point the bubble-up flips status to ACTIVE.
        test_recipe:
          setup:
            - "Season OPEN; member ENROLLED via audition ACCEPT; invoice ISSUED but unpaid"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/dues-invoices", payload: { member_id: "${m_id}" }, as: Treasurer, captures: { inv: $.data.id } }
          trigger:
            - { call: "GET /v1/members/${m_id}", payload: {}, as: Treasurer }
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m_id}", amount_cents: 18000, method: "CARD" }, as: Treasurer }
            - { call: "GET /v1/members/${m_id}", payload: {}, as: Treasurer }
          assert:
            - "Before payment: Member.${m_id}.status == ENROLLED and performance_eligible == false"
            - "DuesInvoice.${inv}.status == PAID after payment"
            - "After payment: Member.${m_id}.status == ACTIVE and performance_eligible == true (bubble-up)"

  # ---------------------------------------------------------------- rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_booking_half_open_overlap
        grounds:
          - validations[priority=11]
          - errors[ERR_VENUE_OVERLAP]
          - entities.VenueBooking.fields.start_at
        distinguishing_aspect: |
          Half-open interval semantics on Venue: [18:00,21:00) then [21:00,23:00)
          is permitted (adjacency), while [20:00,22:00) intersects and is rejected.
        test_recipe:
          setup:
            - "Season REHEARSING; venue capacity 100; two concerts; booking1 2026-09-10 18:00-21:00 exists (REQUESTED)"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/dues-invoices", payload: { member_id: "${m_id}" }, as: Treasurer }
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m_id}", amount_cents: 18000, method: "CARD" }, as: Treasurer }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "REHEARSING" }, as: President }
            - { call: "POST /v1/venues", payload: { name: "Hall", capacity: 100 }, as: President, captures: { v_id: $.data.id } }
            - { call: "POST /v1/concerts", payload: { season_id: "${s_id}", title: "Gala", expected_attendance: 80 }, as: ChoirDirector, captures: { c1: $.data.id } }
            - { call: "POST /v1/venue-bookings", payload: { concert_id: "${c1}", venue_id: "${v_id}", start_at: "2026-09-10T18:00:00Z", end_at: "2026-09-10T21:00:00Z", deposit_cents: 1000 }, as: ChoirDirector }
            - { call: "POST /v1/concerts", payload: { season_id: "${s_id}", title: "Late Show", expected_attendance: 50 }, as: ChoirDirector, captures: { c2: $.data.id } }
            - { call: "POST /v1/concerts", payload: { season_id: "${s_id}", title: "Clash", expected_attendance: 50 }, as: ChoirDirector, captures: { c3: $.data.id } }
          trigger:
            - { call: "POST /v1/venue-bookings", payload: { concert_id: "${c2}", venue_id: "${v_id}", start_at: "2026-09-10T21:00:00Z", end_at: "2026-09-10T23:00:00Z", deposit_cents: 1000 }, as: ChoirDirector, captures: { b2: $.data.id } }
            - { call: "POST /v1/venue-bookings", payload: { concert_id: "${c3}", venue_id: "${v_id}", start_at: "2026-09-10T20:00:00Z", end_at: "2026-09-10T22:00:00Z", deposit_cents: 1000 }, as: ChoirDirector, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent booking ${b2} created with status == REQUESTED (half-open adjacency allowed)"
            - "Overlapping booking error_id == ERR_VENUE_OVERLAP"

      - name: audition_slot_buffered_overlap
        grounds:
          - validations[priority=11]
          - errors[ERR_AUDITION_OVERLAP]
          - entities.Season.fields.audition_slot_minutes
        distinguishing_aspect: |
          Different resource (season audition schedule) and different interval
          semantics (fixed 30-minute buffered slots): 10:29 start conflicts with
          a 10:00 slot, while exactly 30 minutes later (10:30) is permitted.
        test_recipe:
          setup:
            - "Season OPEN with audition_slot_minutes 30; two APPLICANT members; audition A at 2026-08-02T10:00"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000, audition_slot_minutes: 30 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "A One", email: "a1@x.org" }, as: ChoirDirector, captures: { m1: $.data.id } }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "A Two", email: "a2@x.org" }, as: ChoirDirector, captures: { m2: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m1}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector }
          trigger:
            - { call: "POST /v1/auditions", payload: { member_id: "${m2}", scheduled_at: "2026-08-02T10:29:00Z" }, as: ChoirDirector, captures: { err: $.data.error_id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m2}", scheduled_at: "2026-08-02T10:30:00Z" }, as: ChoirDirector, captures: { a2: $.data.id } }
          assert:
            - "10:29 booking error_id == ERR_AUDITION_OVERLAP (< 30 minute buffer)"
            - "10:30 booking ${a2} created with status == SCHEDULED (buffer boundary inclusive)"

  # ---------------------------------------------------------------- rule 9
  - rule_id: compensating_invariant
    instances:
      - name: library_copy_conservation
        grounds:
          - entities.MusicScore.fields.copies_available
          - entities.MusicScore.fields.copies_lost
          - state_machines.ScoreCheckout.CHECKED_OUT_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity = physical copies: copy_count(3) == copies_available
          + open checkouts + copies_lost at every step of checkout/return/mark-lost.
        test_recipe:
          setup:
            - "Season OPEN; two ENROLLED members; score copy_count 3, replacement 7000"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 4 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "A One", email: "a1@x.org" }, as: ChoirDirector, captures: { m1: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m1}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a1: $.data.id } }
            - { call: "POST /v1/auditions/${a1}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a1}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "A Two", email: "a2@x.org" }, as: ChoirDirector, captures: { m2: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m2}", scheduled_at: "2026-08-02T11:00:00Z" }, as: ChoirDirector, captures: { a2: $.data.id } }
            - { call: "POST /v1/auditions/${a2}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a2}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/music-scores", payload: { title: "Mass in G", copy_count: 3, replacement_cost_cents: 7000 }, as: Librarian, captures: { sc: $.data.id } }
          trigger:
            - { call: "POST /v1/score-checkouts", payload: { score_id: "${sc}", member_id: "${m1}", due_date: "2026-08-10T00:00:00Z" }, as: Librarian, captures: { co1: $.data.id } }
            - { call: "POST /v1/score-checkouts", payload: { score_id: "${sc}", member_id: "${m2}", due_date: "2026-08-10T00:00:00Z" }, as: Librarian, captures: { co2: $.data.id } }
            - { call: "POST /v1/score-checkouts/${co1}/return", payload: {}, as: Librarian }
            - { call: "POST /v1/score-checkouts/${co2}/mark-lost", payload: {}, as: Librarian }
            - { call: "GET /v1/music-scores/${sc}", payload: {}, as: Librarian }
          assert:
            - "After checkout pair: copies_available was 1; after return of co1 it was 2 (compensating action restores the count)"
            - "MusicScore.${sc}.copies_available == 2 and copies_lost == 1"
            - "Invariant holds: 3 == copies_available (2) + open checkouts (0) + copies_lost (1)"
            - "Member.${m2}.ledger_balance_cents == 7000"

      - name: scholarship_pool_conservation
        grounds:
          - calculations.scholarship_pool_ledger
          - state_machines.ScholarshipGrant.APPROVED_to_APPLIED
          - state_machines.ScholarshipGrant.APPROVED_to_REVOKED
        distinguishing_aspect: |
          Conserved quantity = money (not physical units): pool 50000 == available
          + reserved + spent across approve (20000), apply (12000 of a 12000
          balance, excess released), second approve (5000) and revoke.
        test_recipe:
          setup:
            - "Season OPEN pool 50000; member ENROLLED; invoice 18000 with 6000 paid (balance 12000); grant1 REQUESTED 20000"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/dues-invoices", payload: { member_id: "${m_id}" }, as: Treasurer, captures: { inv: $.data.id } }
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m_id}", amount_cents: 6000, method: "CARD" }, as: Treasurer }
            - { call: "POST /v1/scholarship-grants", payload: { member_id: "${m_id}", requested_cents: 20000 }, as: Treasurer, captures: { g1: $.data.id } }
            - { call: "POST /v1/scholarship-grants/${g1}/decision", payload: { decision: "APPROVE" }, as: Treasurer }
          trigger:
            - { call: "POST /v1/scholarship-grants/${g1}/apply", payload: { invoice_id: "${inv}" }, as: Treasurer }
            - { call: "POST /v1/scholarship-grants", payload: { member_id: "${m_id}", requested_cents: 5000 }, as: Treasurer, captures: { g2: $.data.id } }
            - { call: "POST /v1/scholarship-grants/${g2}/decision", payload: { decision: "APPROVE" }, as: Treasurer }
            - { call: "POST /v1/scholarship-grants/${g2}/revoke", payload: {}, as: Treasurer }
            - { call: "GET /v1/seasons/${s_id}", payload: {}, as: Treasurer }
          assert:
            - "DuesInvoice.${inv}.status == WAIVED (scholarship zeroed the 12000 balance)"
            - "Member.${m_id}.status == ACTIVE (WAIVED bubble-up)"
            - "Season.${s_id}.pool_spent_cents == 12000"
            - "Season.${s_id}.pool_reserved_cents == 0 (revoke restored the second 5000)"
            - "Season.${s_id}.pool_available_cents == 38000; invariant 50000 == 38000 + 0 + 12000"
