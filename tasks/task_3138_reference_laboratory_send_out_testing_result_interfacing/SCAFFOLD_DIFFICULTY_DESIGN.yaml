# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3138_reference_laboratory_send_out_testing_result_interfacing
#
# Depth probe: the nine §0.5 Difficulty Rules, two instances each (18 total).
# Every instance grounds in §1.1-§1.7 of SCAFFOLD.yaml and carries an executable
# setup_api_calls chain. Anchors (&name) are YAML aliases for the shared
# empty-DB fixture chain; each instance expands to a self-contained recipe.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      # -----------------------------------------------------------------------
      - name: order_charge_provisional_vs_final_on_one_ferritin_line
        grounds:
          - calculations.order_price_reconciliation
          - calculations.volume_tier_price
          - calculations.rush_priority_surcharge
          - entities.SendOutOrder.fields.provisional_charge_cents
          - entities.SendOutOrder.fields.order_final_charge_cents
          - entities.SendOutOrder.fields.charge_variance_cents
          - state_machines.SendOutOrder.S_IN_TESTING_to_S_INTERIM_REPORTED
        distinguishing_aspect: |
          On SendOutOrder, the provisional variant reads only catalog list prices while the
          final variant reads the contracted client price with the volume tier and the rush
          surcharge, so for one and the same ferritin line the two variants return 1200.00 and
          1150.00 and the delta is exactly -50.00; a single-variant implementation would
          return the same number twice.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T07:00:00Z. One ACTIVE client, one certified result interface build, one published ROUTINE ferritin catalog entry (list 1200, client 1000, floor 450, base_tat 6), one GOLD_SST serum specimen received at 2026-09-01T06:30:00Z, and a 3.0 mL specimen."
            - "One ROUTINE send-out order for that specimen with a single ferritin line in PENDING, probed by a RUNNING analyzer window covering the clock."
          setup_api_calls:
            - &clk
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T07:00:00Z" }
              as: ReferenceLabOperations
            - &c1
              call: "POST /reference-lab/client-laboratories"
              payload: { name: "Valley Regional Medical Center", clia_number: "45D-1001", client_type: "HOSPITAL", state_code: "UT", billing_arrangement: "CLIENT", credit_limit_cents: 5000000 }
              as: ReferenceLabOperations
              captures: { c1_id: $.data.id }
            - &t1
              call: "POST /reference-lab/test-catalog-entries"
              payload: { test_code: "FERRITIN", test_name: "Ferritin, Serum", test_category: "ROUTINE", method: "IMMUNOASSAY", required_specimen_type: "SERUM_SST", container_type: "GOLD_SST", min_volume_ml: 1.0, transport_temperature: "AMBIENT", stability_hours_ambient: 72, stability_hours_refrigerated: 168, stability_hours_frozen: 720, base_tat_hours: 6, list_price_cents: 1200, client_price_cents: 1000, floor_price_cents: 450, critical_value_low: 5, critical_value_high: 400, reflex_test_code: null, reflex_condition: "NONE", reflex_within_hours: 24, reflex_min_remaining_hours: 12, is_utilization_managed: true }
              as: LabClientAdmin
              as_user_id: "${c1_id}"
              captures: { t1_id: $.data.id }
            - &t1p
              call: "POST /reference-lab/test-catalog-entries/${t1_id}/publish"
              payload: {}
              as: LabClientAdmin
              as_user_id: "${c1_id}"
            - &ib
              call: "POST /reference-lab/interface-builds"
              payload: { client_laboratory_id: "${c1_id}", build_version_label: "v1", format: "HL7_V2_5_1", order_interface_enabled: true, result_interface_enabled: true }
              as: InterfaceAnalyst
              captures: { ib_id: $.data.id }
            - &ibs
              call: "POST /reference-lab/interface-builds/${ib_id}/start-build"
              payload: {}
              as: InterfaceAnalyst
            - &ibc
              call: "POST /reference-lab/interface-builds/${ib_id}/certify"
              payload: {}
              as: InterfaceAnalyst
            - &c1v
              call: "GET /reference-lab/client-laboratories/${c1_id}"
              payload: {}
              as: ReferenceLabOperations
              captures: { c1_v: $.data.version }
            - &cr
              call: "POST /reference-lab/courier-runs"
              payload: { client_laboratory_id: "${c1_id}", route_code: "SLC-AM", origin_city: "Provo", destination_city: "Salt Lake City", vehicle_id: "VAN-7", scheduled_departure_at: "2026-09-01T05:00:00Z", scheduled_arrival_at: "2026-09-01T09:30:00Z", scheduled_pickup_at: "2026-09-01T05:00:00Z", scheduled_delivery_at: "2026-09-01T09:30:00Z", temperature_control_mode: "AMBIENT", expected_client_laboratory_version: "${c1_v}" }
              as: CourierCoordinator
              captures: { cr_id: $.data.id }
            - &pr
              call: "POST /reference-lab/client-laboratories/${c1_id}/publish-requirements"
              payload: {}
              as: ReferenceLabOperations
            - &act
              call: "POST /reference-lab/client-laboratories/${c1_id}/activate"
              payload: {}
              as: ReferenceLabOperations
            - &spec1
              call: "POST /reference-lab/specimens"
              payload: { client_laboratory_id: "${c1_id}", courier_run_id: "${cr_id}", accession_number: "ACC-1001", patient_mrn: "MRN-5001", specimen_type: "SERUM_SST", container_type: "GOLD_SST", volume_ml: 3.0, collection_at: "2026-09-01T06:00:00Z", received_at: "2026-09-01T06:30:00Z", transport_temperature: "AMBIENT", condition: "ACCEPTABLE", condition_reason_code: null }
              as: AccessioningTechnologist
              captures: { sp1_id: $.data.id }
            - &ord1
              call: "POST /reference-lab/send-out-orders"
              payload: { client_laboratory_id: "${c1_id}", specimen_id: "${sp1_id}", order_number: "REQ-1001", patient_mrn: "MRN-5001", client_requested_at: "2026-09-01T06:35:00Z", priority: "ROUTINE", test_lines: [{ test_catalog_entry_id: "${t1_id}", line_sequence: 1 }], override_utilization_guard: false }
              as: AccessioningTechnologist
              captures: { o1_id: $.data.id, l1_id: "$.data.test_lines[0].id" }
            - &run1
              call: "POST /reference-lab/instrument-runs"
              payload: { test_catalog_entry_id: "${t1_id}", instrument_code: "IMM-01", section: "CORE", decontamination_buffer_minutes: 30, reserved_start_at: "2026-09-01T07:00:00Z", reserved_end_at: "2026-09-01T12:00:00Z" }
              as: MedicalTechnologist
              captures: { ir1_id: $.data.id }
            - &acc1
              call: "POST /reference-lab/specimens/${sp1_id}/accession"
              payload: {}
              as: AccessioningTechnologist
            - &oadm1
              call: "POST /reference-lab/send-out-orders/${o1_id}/accession"
              payload: {}
              as: AccessioningTechnologist
              captures: { o1_prov: $.data.provisional_charge_cents }
            - &o1ver
              call: "GET /reference-lab/send-out-orders/${o1_id}"
              payload: {}
              as: ReferenceLabOperations
              captures: { o1_v: $.data.version }
            - &beg1
              call: "POST /reference-lab/specimens/${sp1_id}/begin-testing"
              payload: {}
              as: MedicalTechnologist
              captures: { sp1_status: $.data.status }
            - &ent1
              call: "POST /reference-lab/send-out-orders/${o1_id}/enter-results"
              payload: { expected_send_out_order_version: "${o1_v}", result_lines: [{ order_test_line_id: "${l1_id}", result_value: 250.0, result_units: "ng/mL", critical_value_notified_to: null, critical_value_notified_at: null }] }
              as: MedicalTechnologist
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: ReferenceLabOperations
            - call: "POST /reference-lab/send-out-orders/${o1_id}/release-results"
              payload: { interpretive_comment: "Ferritin within reference interval." }
              as: Pathologist
              captures: { o1_fin: $.data.order_final_charge_cents, o1_var: $.data.charge_variance_cents, o1_tat: $.data.tat_credit_cents }
          assert:
            - "OrderTestLine.${l1_id}.billed_cents == 1000.00"
            - "SendOutOrder.${o1_id}.provisional_charge_cents == 1200.00"
            - "SendOutOrder.${o1_id}.order_final_charge_cents == 1150.00"
            - "SendOutOrder.${o1_id}.charge_variance_cents == -50.00"
            - "SendOutOrder.${o1_id}.rush_tier == RUSH and effective_tat_hours == 3.0 and expected_result_at == 2026-09-01T09:30:00Z"
            - "SendOutOrder.${o1_id}.tat_credit_cents == 17.25, being 1150.00 billed times one full overrun hour times 0.015"
            - "SendOutOrder.${o1_id}.order_status == RESULT_RELEASED and billing_status == BILLED"

      # -----------------------------------------------------------------------
      - name: client_utilization_forward_vs_settled_metric_divergence
        grounds:
          - calculations.client_utilization_dual_metric
          - entities.ClientLaboratory.fields.forward_utilization_score
          - entities.ClientLaboratory.fields.settled_utilization_score
          - entities.ClientLaboratory.fields.utilization_flag
          - validations.priority_18_business_constraint
        distinguishing_aspect: |
          On ClientLaboratory, the forward variant counts by client_requested_at over live
          lines while the settled variant counts by result_released_at over FINAL lines only,
          so three submitted-not-released lines make the two scores 3 and 0 rather than
          agreeing; the divergence is a genuine dataset difference, not the same figure.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T07:00:00Z. One ACTIVE client with three ferritin lines split across two orders, none of them released."
            - "One separate order whose single thyroglobulin line HAS been released inside the trailing window."
          setup_api_calls:
            - *clk
            - *c1
            - *t1
            - *t1p
            - &t2a
              call: "POST /reference-lab/test-catalog-entries"
              payload: { test_code: "THYROGLOBULIN", test_name: "Thyroglobulin, Serum", test_category: "ROUTINE", method: "IMMUNOASSAY", required_specimen_type: "SERUM_SST", container_type: "GOLD_SST", min_volume_ml: 1.0, transport_temperature: "AMBIENT", stability_hours_ambient: 72, stability_hours_refrigerated: 168, stability_hours_frozen: 720, base_tat_hours: 6, list_price_cents: 2600, client_price_cents: 2200, floor_price_cents: 0, critical_value_low: null, critical_value_high: null, reflex_test_code: null, reflex_condition: "NONE", reflex_within_hours: 24, reflex_min_remaining_hours: 6, is_utilization_managed: false }
              as: LabClientAdmin
              as_user_id: "${c1_id}"
              captures: { t2a_id: $.data.id }
            - call: "POST /reference-lab/test-catalog-entries/${t2a_id}/publish"
              payload: {}
              as: LabClientAdmin
              as_user_id: "${c1_id}"
            - *ib
            - *ibs
            - *ibc
            - *c1v
            - *cr
            - *pr
            - *act
            - *spec1
            - *ord1
            - *run1
            - *acc1
            - *oadm1
            - *beg1
            - &addon1
              call: "POST /reference-lab/send-out-orders/${o1_id}/order-add-on-test"
              payload: { test_catalog_entry_id: "${t1_id}", line_sequence: 2, add_on_at: "2026-09-01T07:30:00Z" }
              as: AccessioningTechnologist
            - call: "POST /reference-lab/send-out-orders/${o1_id}/order-add-on-test"
              payload: { test_catalog_entry_id: "${t1_id}", line_sequence: 3, add_on_at: "2026-09-01T07:31:00Z" }
              as: AccessioningTechnologist
            - &spec2
              call: "POST /reference-lab/specimens"
              payload: { client_laboratory_id: "${c1_id}", courier_run_id: "${cr_id}", accession_number: "ACC-1002", patient_mrn: "MRN-5002", specimen_type: "SERUM_SST", container_type: "GOLD_SST", volume_ml: 3.0, collection_at: "2026-09-01T06:00:00Z", received_at: "2026-09-01T06:30:00Z", transport_temperature: "AMBIENT", condition: "ACCEPTABLE", condition_reason_code: null }
              as: AccessioningTechnologist
              captures: { sp2_id: $.data.id }
            - call: "POST /reference-lab/send-out-orders"
              payload: { client_laboratory_id: "${c1_id}", specimen_id: "${sp2_id}", order_number: "REQ-1002", patient_mrn: "MRN-5002", client_requested_at: "2026-09-01T06:36:00Z", priority: "ROUTINE", test_lines: [{ test_catalog_entry_id: "${t2a_id}", line_sequence: 1 }], override_utilization_guard: false }
              as: AccessioningTechnologist
              captures: { o2_id: $.data.id, l2_id: "$.data.test_lines[0].id" }
            - call: "POST /reference-lab/instrument-runs"
              payload: { test_catalog_entry_id: "${t2a_id}", instrument_code: "IMM-02", section: "CORE", decontamination_buffer_minutes: 30, reserved_start_at: "2026-09-01T07:00:00Z", reserved_end_at: "2026-09-01T12:00:00Z" }
              as: MedicalTechnologist
              captures: { ir2_id: $.data.id }
            - call: "POST /reference-lab/specimens/${sp2_id}/accession"
              payload: {}
              as: AccessioningTechnologist
            - call: "POST /reference-lab/send-out-orders/${o2_id}/accession"
              payload: {}
              as: AccessioningTechnologist
            - call: "POST /reference-lab/specimens/${sp2_id}/begin-testing"
              payload: {}
              as: MedicalTechnologist
              captures: { o2_v: $.data.version }
            - call: "POST /reference-lab/send-out-orders/${o2_id}/enter-results"
              payload: { expected_send_out_order_version: "${o2_v}", result_lines: [{ order_test_line_id: "${l2_id}", result_value: 12.0, result_units: "ng/mL", critical_value_notified_to: null, critical_value_notified_at: null }] }
              as: MedicalTechnologist
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: ReferenceLabOperations
            - call: "POST /reference-lab/send-out-orders/${o2_id}/release-results"
              payload: { interpretive_comment: "Thyroglobulin below the assay ceiling." }
              as: Pathologist
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T11:00:00Z" }
              as: ReferenceLabOperations
          trigger:
            - call: "GET /reference-lab/client-laboratories/${c1_id}"
              payload: {}
              as: UtilizationReviewer
              captures: { fwd: $.data.forward_utilization_score, setl: $.data.settled_utilization_score }
          assert:
            - "ClientLaboratory.${c1_id}.forward_utilization_score == 4"
            - "ClientLaboratory.${c1_id}.settled_utilization_score == 1"
            - "ClientLaboratory.${c1_id}.forward_utilization_score - ClientLaboratory.${c1_id}.settled_utilization_score == 3"
            - "ClientLaboratory.${c1_id}.utilization_flag == false"
            - "the forward and settled variants are computed from the same line set but return 4 and 1, so the two are not the same metric"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      # -----------------------------------------------------------------------
      - name: volume_tier_rate_selection_with_floor_applied_last
        grounds:
          - calculations.volume_tier_price
          - entities.TestCatalogEntry.fields.floor_price_cents
          - entities.OrderTestLine.fields.billed_cents
          - state_machines.SendOutOrder.S_IN_TESTING_to_S_INTERIM_REPORTED
        distinguishing_aspect: |
          Volume_tier_price mode (a): the tier is selected from a count of at least three
          interacting inputs (reportable line count, contracted price, catalog floor) and the
          floor is applied after the discount, so a six-line order prices its panel line at
          120000.00 — below the five-line price of 127500.00 — rather than monotonically
          decreasing as a naive rate table would.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T07:00:00Z. One ACTIVE client, a certified build, and two published entries: ferritin (client 1000, floor 450) and a genetic panel (client 150000, floor 120000)."
            - "A 4.0 mL EDTA whole-blood specimen with a six-line order: three ferritin lines and three panel lines."
          setup_api_calls:
            - *clk
            - *c1
            - *t1
            - *t1p
            - &t5
              call: "POST /reference-lab/test-catalog-entries"
              payload: { test_code: "HEREDITARY_CANCER_PANEL", test_name: "Hereditary Cancer Panel, 84 genes", test_category: "GENETIC", method: "NEXT_GENERATION_SEQUENCING", required_specimen_type: "WHOLE_BLOOD_EDTA", container_type: "LAVENDER_TOP", min_volume_ml: 3.0, transport_temperature: "AMBIENT", stability_hours_ambient: 72, stability_hours_refrigerated: 168, stability_hours_frozen: 720, base_tat_hours: 336, list_price_cents: 180000, client_price_cents: 150000, floor_price_cents: 120000, critical_value_low: null, critical_value_high: null, reflex_test_code: null, reflex_condition: "NONE", reflex_within_hours: 24, reflex_min_remaining_hours: 12, is_utilization_managed: false }
              as: LabClientAdmin
              as_user_id: "${c1_id}"
              captures: { t5_id: $.data.id }
            - call: "POST /reference-lab/test-catalog-entries/${t5_id}/publish"
              payload: {}
              as: LabClientAdmin
              as_user_id: "${c1_id}"
            - *ib
            - *ibs
            - *ibc
            - *c1v
            - *cr
            - *pr
            - *act
            - &spec6
              call: "POST /reference-lab/specimens"
              payload: { client_laboratory_id: "${c1_id}", courier_run_id: "${cr_id}", accession_number: "ACC-2001", patient_mrn: "MRN-6001", specimen_type: "WHOLE_BLOOD_EDTA", container_type: "LAVENDER_TOP", volume_ml: 4.0, collection_at: "2026-09-01T06:00:00Z", received_at: "2026-09-01T06:30:00Z", transport_temperature: "AMBIENT", condition: "ACCEPTABLE", condition_reason_code: null }
              as: AccessioningTechnologist
              captures: { sp6_id: $.data.id }
            - &ord6
              call: "POST /reference-lab/send-out-orders"
              payload: { client_laboratory_id: "${c1_id}", specimen_id: "${sp6_id}", order_number: "REQ-2001", patient_mrn: "MRN-6001", client_requested_at: "2026-09-01T06:35:00Z", priority: "ROUTINE", test_lines: [{ test_catalog_entry_id: "${t1_id}", line_sequence: 1 }, { test_catalog_entry_id: "${t1_id}", line_sequence: 2 }, { test_catalog_entry_id: "${t1_id}", line_sequence: 3 }, { test_catalog_entry_id: "${t5_id}", line_sequence: 4 }, { test_catalog_entry_id: "${t5_id}", line_sequence: 5 }, { test_catalog_entry_id: "${t5_id}", line_sequence: 6 }], override_utilization_guard: false }
              as: AccessioningTechnologist
              captures: { o6_id: $.data.id, l6a: "$.data.test_lines[0].id", l6b: "$.data.test_lines[3].id" }
            - &run6
              call: "POST /reference-lab/instrument-runs"
              payload: { test_catalog_entry_id: "${t5_id}", instrument_code: "NGS-01", section: "MOLECULAR", decontamination_buffer_minutes: 30, reserved_start_at: "2026-09-01T07:00:00Z", reserved_end_at: "2026-09-01T12:00:00Z" }
              as: MedicalTechnologist
              captures: { ir6_id: $.data.id }
            - call: "POST /reference-lab/specimens/${sp6_id}/accession"
              payload: {}
              as: AccessioningTechnologist
            - call: "POST /reference-lab/send-out-orders/${o6_id}/accession"
              payload: {}
              as: AccessioningTechnologist
            - call: "POST /reference-lab/specimens/${sp6_id}/begin-testing"
              payload: {}
              as: MedicalTechnologist
              captures: { o6_v: $.data.version }
            - call: "POST /reference-lab/send-out-orders/${o6_id}/enter-results"
              payload: { expected_send_out_order_version: "${o6_v}", result_lines: [{ order_test_line_id: "${l6a}", result_value: 180.0, result_units: "ng/mL", critical_value_notified_to: null, critical_value_notified_at: null }, { order_test_line_id: "${l6b}", result_value: 0.0, result_units: "variant_count", critical_value_notified_to: null, critical_value_notified_at: null }] }
              as: MedicalTechnologist
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T20:00:00Z" }
              as: ReferenceLabOperations
            - call: "POST /reference-lab/send-out-orders/${o6_id}/release-results"
              payload: { interpretive_comment: "Panel negative for reportable variants; ferritin normal." }
              as: Pathologist
              captures: { o6_base: $.data.order_final_charge_cents, o6_var: $.data.charge_variance_cents }
          assert:
            - "OrderTestLine.${l6a}.billed_cents == 720.00"
            - "OrderTestLine.${l6b}.billed_cents == 120000.00"
            - "SendOutOrder.${o6_id}.provisional_charge_cents == 543600.00"
            - "SendOutOrder.${o6_id}.order_final_charge_cents == 416484.00, being round_half_up(362160.00 * 1.15, 2) where 362160.00 is three 720.00 ferritin lines plus three 120000.00 floor-clamped panel lines"
            - "SendOutOrder.${o6_id}.charge_variance_cents == -127116.00, being 416484.00 final minus 543600.00 provisional"
            - "SendOutOrder.${o6_id}.rush_tier == STANDARD and SendOutOrder.${o6_id}.effective_tat_hours == 336.0"

      # -----------------------------------------------------------------------
      - name: rush_tier_keys_on_the_tat_the_tier_itself_changes
        grounds:
          - calculations.rush_priority_surcharge
          - calculations.order_price_reconciliation
          - entities.SendOutOrder.fields.rush_tier
          - entities.SendOutOrder.fields.effective_tat_hours
          - entities.SendOutOrder.fields.expected_result_at
        distinguishing_aspect: |
          Rush_priority_surcharge mode (c): step 3 re-reads the first-pass TAT that step 2
          produced from the tier, so the value is only well defined because the scaffold pins
          candidate then first pass then at most one escalation then freeze; a ROUTINE order on
          a 6-hour assay lands on RUSH with effective_tat_hours 3.0, not STANDARD with 6.0.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T07:00:00Z. One ACTIVE client, a certified build, and three published entries with base_tat_hours 6.0 (ferritin), 24.0 (procalcitonin) and 23.5 (troponin)."
            - "Three specimens each with one single-line ROUTINE order, all probed by RUNNING analyzer windows."
          setup_api_calls:
            - *clk
            - *c1
            - *t1
            - *t1p
            - &t8
              call: "POST /reference-lab/test-catalog-entries"
              payload: { test_code: "PROCALCITONIN", test_name: "Procalcitonin, Serum", test_category: "ROUTINE", method: "IMMUNOASSAY", required_specimen_type: "SERUM_SST", container_type: "GOLD_SST", min_volume_ml: 1.0, transport_temperature: "AMBIENT", stability_hours_ambient: 24, stability_hours_refrigerated: 72, stability_hours_frozen: 720, base_tat_hours: 24, list_price_cents: 3800, client_price_cents: 3200, floor_price_cents: 0, critical_value_low: null, critical_value_high: null, reflex_test_code: null, reflex_condition: "NONE", reflex_within_hours: 24, reflex_min_remaining_hours: 6, is_utilization_managed: false }
              as: LabClientAdmin
              as_user_id: "${c1_id}"
              captures: { t8_id: $.data.id }
            - call: "POST /reference-lab/test-catalog-entries/${t8_id}/publish"
              payload: {}
              as: LabClientAdmin
              as_user_id: "${c1_id}"
            - &t9
              call: "POST /reference-lab/test-catalog-entries"
