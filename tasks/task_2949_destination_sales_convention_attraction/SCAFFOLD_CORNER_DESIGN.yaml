            - "${rank_c_1} == SECOND and ${posture_c} == NONE - exactly one hold is promoted per vacated window"
            - "swapping only the creation order of the two SECOND holds must swap the winner, proving created_at ASC is the tie-break and the id is not"

      - name: planner_score_falls_through_the_tier_b_floor_as_losses_accumulate
        claim_type: constants_applied
        grounds:
          - calculations.planner_relationship_score
          - global_constants.TIER_B_SCORE_FLOOR
          - global_constants.ROLLING_WINDOW_DAYS
        distinguishing_aspect: "Each LOST opportunity subtracts 5 from both variants: a planner starting at lifetime 36 / TIER_B drops to 31 (still TIER_B, the floor is 30 and inclusive) and then to 26 / TIER_C. The ROLLING_24M variant, which excludes the legacy counters entirely, is clamped at 0 rather than going negative."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; planner with legacy_definite_count 2 and legacy_definite_room_nights 6000 (lifetime 2*12 + 12 == 36, TIER_B); two QUALIFIED opportunities with total_room_nights_requested 1800 and 600"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org", legacy_definite_count: 2, legacy_definite_room_nights: 6000 }
              as: BureauAdmin
              captures: { planner_id: $.data.id, score_0: $.data.relationship_score_lifetime, rolling_0: $.data.relationship_score_rolling_24m, tier_0: $.data.tier }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "First Loss 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { opp_1_id: $.data.id }
            - call: "POST /opportunities/${opp_1_id}/qualify"
              payload: {}
              as: SalesManager
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "Second Loss 2028", arrival_date: "2028-06-10", departure_date: "2028-06-12", peak_rooms_requested: 400, total_room_nights_requested: 600, attendance_estimate: 3000, exhibit_sqft_requested: 40000, rate_ceiling_amount: 199.00 }
              as: SalesManager
              captures: { opp_2_id: $.data.id }
            - call: "POST /opportunities/${opp_2_id}/qualify"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /opportunities/${opp_1_id}/lose"
              payload: { lost_reason: "RATE_TOO_HIGH" }
              as: SalesManager
            - call: "GET /meeting-planners/${planner_id}"
              payload: {}
              as: SalesManager
              captures: { score_1: $.data.relationship_score_lifetime, rolling_1: $.data.relationship_score_rolling_24m, tier_1: $.data.tier, lost_1: $.data.lost_count }
            - call: "POST /opportunities/${opp_2_id}/lose"
              payload: { lost_reason: "DATES_UNAVAILABLE" }
              as: SalesManager
            - call: "GET /meeting-planners/${planner_id}"
              payload: {}
              as: SalesManager
              captures: { score_2: $.data.relationship_score_lifetime, rolling_2: $.data.relationship_score_rolling_24m, tier_2: $.data.tier, lost_2: $.data.lost_count, touch: $.data.last_touch_at }
          assert:
            - "${score_0} == 36, ${rolling_0} == 0, ${tier_0} == TIER_B"
            - "${score_1} == 31, ${tier_1} == TIER_B, ${lost_1} == 1 - 31 is still at or above the TIER_B floor of 30"
            - "${score_2} == 26, ${tier_2} == TIER_C, ${lost_2} == 2"
            - "${rolling_1} == 0 and ${rolling_2} == 0 - the rolling variant is clamped at 0, never negative, and never sees the legacy counters"
            - "${touch} == 2026-08-01T00:00:00Z - the loss counted as a planner touch"
            - "GET /meeting-planners?tier=TIER_C returns this planner and GET /meeting-planners?tier=TIER_B does not"

      - name: board_report_window_is_half_open_on_definite_at
        claim_type: chronological_boundary
        grounds:
          - calculations.board_report_rollup
          - entities.BoardReport.fields.definite_room_nights
        distinguishing_aspect: "The report window is [period_start, period_end): a booking whose definite_at equals period_start is counted while one whose definite_at equals period_end is not, so the FY report shows definite_opportunity_count 1 / definite_room_nights 1800 and cost_per_definite_room_night 7.00 (12600.00 / 1800) even though two bookings exist in the database."
        test_recipe:
          setup:
            - "CANONICAL DEFINITE CHAIN run twice against the same fund and planner but on two halls and two hotel sets: chain 1 entirely at clock 2027-01-01T00:00:00Z (opportunity ${opp_1_id}, definite_at 2027-01-01T00:00:00Z, definite_room_nights 1800, decision total_charge_amount 12600.00), chain 2 entirely at clock 2027-07-01T00:00:00Z (opportunity ${opp_2_id}, definite_at 2027-07-01T00:00:00Z, definite_room_nights 1800, decision total_charge_amount 12600.00)"
            - "one LodgingTaxReceipt of 20000.00 received_at 2027-01-01T00:00:00Z and one of 30000.00 received_at 2027-07-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /board-reports"
              payload: { period_start: "2027-01-01", period_end: "2027-07-01" }
              as: BoardAnalyst
              captures: { report_id: $.data.id, definite_count: $.data.definite_opportunity_count, definite_nights: $.data.definite_room_nights, spend: $.data.incentive_spend_committed_amount, tax: $.data.lodging_tax_recognized_amount, cost: $.data.cost_per_definite_room_night, attrition: $.data.attrition_recovered_amount }
          assert:
            - "${definite_count} == 1 and ${definite_nights} == 1800 - only ${opp_1_id} is inside [2027-01-01, 2027-07-01)"
            - "${spend} == 12600.00 and ${tax} == 20000.00 - the 2027-07-01 decision and receipt sit exactly on the exclusive upper bound"
            - "${cost} == 7.00 (12600.00 / 1800)"
            - "${attrition} == 0.00 - neither opportunity has reached SERVICED"
            - "a second report over [2027-07-01, 2028-01-01) picks up the other booking: definite_opportunity_count 1, incentive_spend_committed_amount 12600.00, lodging_tax_recognized_amount 30000.00"

      - name: board_report_cost_per_night_is_null_not_zero_on_an_empty_window
        claim_type: precision
        grounds:
          - calculations.board_report_rollup.precision
          - entities.BoardReport.fields.cost_per_definite_room_night
        distinguishing_aspect: "With no definite room nights in the window the ratio is undefined and must be stored as null, not 0.00; every count is 0, every money field is 0.00 and lost_room_nights_by_reason is the empty object - the three shapes are deliberately different."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; empty database apart from the clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /board-reports"
              payload: { period_start: "2026-01-01", period_end: "2026-07-01" }
              as: BoardAnalyst
              captures: { cost: $.data.cost_per_definite_room_night, nights: $.data.definite_room_nights, count: $.data.definite_opportunity_count, lost_map: $.data.lost_room_nights_by_reason, spend: $.data.incentive_spend_committed_amount, tax: $.data.lodging_tax_recognized_amount, attrition: $.data.attrition_recovered_amount, status: $.data.status }
          assert:
            - "HTTP 201, ${count} == 0, ${nights} == 0"
            - "${cost} == null - explicitly not 0.00"
            - "${lost_map} == {} - an empty object, not null and not an empty list"
            - "${spend} == 0.00, ${tax} == 0.00, ${attrition} == 0.00, ${status} == DRAFT"

      - name: board_report_buckets_lost_room_nights_by_reason
        claim_type: aggregation
        grounds:
          - calculations.board_report_rollup
          - entities.Opportunity.fields.lost_reason
        distinguishing_aspect: "Lost business is grouped by lost_reason over total_room_nights_requested (not definite_room_nights, which is 0 for a lost lead), so two RATE_TOO_HIGH losses of 1800 and 400 collapse into one 2200 bucket alongside a 600 DATES_UNAVAILABLE bucket, and reasons with no losses are absent from the map rather than present with 0."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; planner CDA; three QUALIFIED opportunities with total_room_nights_requested 1800, 400 and 600"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
