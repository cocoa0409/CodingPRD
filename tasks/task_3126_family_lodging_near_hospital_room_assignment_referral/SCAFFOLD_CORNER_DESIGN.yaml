      - name: mutations_visible_immediately_in_same_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the respond ACCEPT response body itself shows assignment_status ACCEPTED with no re-read delay, and a subsequent GET agrees field-for-field."
        test_recipe:
          setup:
            - "Verified request OFFERED."
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/houses/${house_id}/rooms"
              payload: { room_number: "101", bed_count: 2, occupancy_limit: 2 }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { room_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id, fam_v: $.data.version }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/stay-requests"
              payload: { family_id: "${fam_id}", house_id: "${house_id}", referral_id: "${ref_id}", expected_nights: 3, self_reported_acuity: "MODERATE", expected_family_version: "${fam_v}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /api/stay-requests/${sr_id}/offer"
              payload: { room_id: "${room_id}" }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { sr_v: $.data.version }
          trigger:
            - call: "POST /api/stay-requests/${sr_id}/respond"
              payload: { decision: "ACCEPT", expected_stay_request_version: "${sr_v}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { resp_status: $.data.assignment_status }
            - call: "GET /api/stay-requests/${sr_id}"
              payload: {}
              as: FamilyContact
              as_user_id: "${fam_id}"
          assert:
            - "the respond response body already shows assignment_status == ACCEPTED"
            - "the subsequent GET agrees: StayRequest.${sr_id}.assignment_status == ACCEPTED and offered_room_id == ${room_id}"


