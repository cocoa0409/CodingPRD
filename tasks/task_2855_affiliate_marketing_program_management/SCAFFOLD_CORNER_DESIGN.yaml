      - name: case_failed_verification_loops_back_to_open_then_escalates_to_upheld
        claim_type: idempotency
        grounds:
          - state_machines.PolicyViolationCase.REMEDIATION_SUBMITTED_to_OPEN
          - state_machines.PolicyViolationCase.OPEN_to_ESCALATED
          - state_machines.PolicyViolationCase.ESCALATED_to_UPHELD
          - entities.PolicyViolationCase.fields.failed_verification_count
          - errors[ERR_CASE_INVALID_TRANSITION]
          - errors[ERR_CASE_ALREADY_TERMINAL]
        distinguishing_aspect: "ESCALATE is refused with ERR_CASE_INVALID_TRANSITION until failed_verification_count reaches ESCALATION_FAILED_ROUNDS (2); the case must traverse the OPEN -> REMEDIATION_REQUESTED -> REMEDIATION_SUBMITTED -> OPEN loop exactly twice, after which ESCALATE succeeds and the UPHELD case refuses any further action with ERR_CASE_ALREADY_TERMINAL."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-07-05T00:00:00Z."
            - "One Network and one CONTENT partner still PENDING_APPLICATION (case transitions only require status != TERMINATED)."
            - "One OPEN TRADEMARK_BIDDING case opened by cmp-001 with detected_at equal to the clock, so severity_weight is 20 and both fraud scores read 20 / 20.0 — far below FRAUD_SUSPENSION_THRESHOLD (70)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /networks"
              payload: { name: "Corner Network", fee_model: "PERCENT_OF_COMMISSION", fee_bps: 0, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: "$.data.id" }
            - call: "POST /affiliates"
              payload: { legal_name: "Beacon Content LLC", contact_email: "beacon@example.com", partner_type: "CONTENT", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_id: "$.data.id" }
            - call: "POST /policy-violation-cases"
              payload: { affiliate_id: "${aff_id}", violation_type: "TRADEMARK_BIDDING", evidence_ref: "sem-report-0001", detected_at: "2026-07-05T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /policy-violation-cases/${case_id}/transition"
              payload: { action: "ESCALATE", note: "straight to escalation" }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
              captures: { err_early: "$.data.error_id" }
            - call: "POST /policy-violation-cases/${case_id}/transition"
              payload: { action: "REQUEST_REMEDIATION", note: "stop bidding on brand terms" }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
            - call: "POST /policy-violation-cases/${case_id}/transition"
              payload: { action: "SUBMIT_REMEDIATION", note: "keywords paused", remediation_evidence_ref: "screenshot-a" }
              as: AffiliatePartner
              as_user_id: "${aff_id}"
            - call: "POST /policy-violation-cases/${case_id}/transition"
              payload: { action: "VERIFY", note: "brand terms still live", verify_outcome: "FAILED" }
              as: ComplianceAnalyst
              as_user_id: "cmp-002"
            - call: "POST /policy-violation-cases/${case_id}/transition"
              payload: { action: "REQUEST_REMEDIATION", note: "second request" }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
            - call: "POST /policy-violation-cases/${case_id}/transition"
              payload: { action: "SUBMIT_REMEDIATION", note: "negative keywords added", remediation_evidence_ref: "screenshot-b" }
              as: AffiliatePartner
              as_user_id: "${aff_id}"
            - call: "POST /policy-violation-cases/${case_id}/transition"
              payload: { action: "VERIFY", note: "still bidding", verify_outcome: "FAILED" }
              as: ComplianceAnalyst
              as_user_id: "cmp-002"
            - call: "POST /policy-violation-cases/${case_id}/transition"
              payload: { action: "ESCALATE", note: "two failed rounds" }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
            - call: "POST /policy-violation-cases/${case_id}/transition"
              payload: { action: "VERIFY", note: "violation confirmed", verify_outcome: "UPHELD" }
              as: ComplianceAnalyst
              as_user_id: "cmp-002"
            - call: "POST /policy-violation-cases/${case_id}/transition"
              payload: { action: "REQUEST_REMEDIATION", note: "one more chance" }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
              captures: { err_terminal: "$.data.error_id" }
            - call: "GET /affiliates/${aff_id}"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
          assert:
            - "the first ESCALATE returns HTTP 409 with data.error_id == \"ERR_CASE_INVALID_TRANSITION\" and leaves state == \"OPEN\" with failed_verification_count == 0"
            - "PolicyViolationCase.${case_id}.severity_weight == 20 and opened_by_user_id == \"cmp-001\""
            - "after the first VERIFY FAILED: state == \"OPEN\" and failed_verification_count == 1"
            - "after the second VERIFY FAILED: state == \"OPEN\" and failed_verification_count == 2"
            - "the second ESCALATE returns HTTP 200 with state == \"ESCALATED\""
            - "the VERIFY UPHELD returns state == \"UPHELD\" and last_note == \"violation confirmed\""
            - "the REQUEST_REMEDIATION after UPHELD returns HTTP 409 with data.error_id == \"ERR_CASE_ALREADY_TERMINAL\" and state stays \"UPHELD\""
            - "Affiliate.${aff_id}.fraud_risk_score == 20 and fraud_risk_score_trailing == 20.0 — UPHELD still contributes full weight"
            - "Affiliate.${aff_id}.open_violation_case_count == 1 and status is still \"PENDING_APPLICATION\" (20 < 70, so no auto-suspension)"

