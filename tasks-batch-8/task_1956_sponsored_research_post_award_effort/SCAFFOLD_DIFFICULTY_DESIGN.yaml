# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1956: Sponsored Research Post-Award & Effort Reporting
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is executable from
# empty-DB via its setup_api_calls chain. Money is integer cents.
# Default logical clock at server start: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: loc_cash_basis_vs_invoice_accrual_basis
        grounds:
          - calculations.drawdown_eligible_pool
          - entities.GrantAward.fields.available_draw_pool_cents
          - entities.Receivable.fields.amount_cents
        distinguishing_aspect: |
          Same posted expenditure set on two identically-budgeted awards yields 350000 in the LOC
          award's cash-basis available_draw_pool_cents (undisbursed SUPPLIES 50000 and its F&A share
          excluded) but 425000 as the invoice-basis Receivable.amount_cents on the accrual award —
          two valid basis conventions over two different entity domains (DrawdownRequest vs Receivable).
        test_recipe:
          setup:
            - "LOC award L and INVOICE award I, both: TRAVEL 100000 + MATERIALS_SUPPLIES 50000 + EQUIPMENT 200000 (directs 350000, MTDC 150000, F&A 5000bps = 75000, obligated 425000), ACTIVE"
            - "Both post: E1 TRAVEL 100000 cash_disbursed=true, E2 SUPPLIES 50000 cash_disbursed=false, E3 EQUIPMENT 200000 cash_disbursed=true (txn 2026-03-01)"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp_loc: $.data.id } }
            - { call: "POST /api/sponsors", payload: { name: "NIH-INV", sponsor_type: "FEDERAL", payment_method: "COST_REIMBURSABLE_INVOICE", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 1000 }, as: SponsoredProgramsOfficer, captures: { sp_inv: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp_loc}", pi_id: "${pi}", award_number: "L-001", title: "LOC project", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 425000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw_l: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp_inv}", pi_id: "${pi}", award_number: "I-001", title: "Invoice project", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 425000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw_i: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw_l}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator, captures: { l_travel: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw_l}", category: "MATERIALS_SUPPLIES", authorized_cents: 50000 }, as: GrantCoordinator, captures: { l_mat: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw_l}", category: "EQUIPMENT", authorized_cents: 200000 }, as: GrantCoordinator, captures: { l_equip: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw_i}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator, captures: { i_travel: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw_i}", category: "MATERIALS_SUPPLIES", authorized_cents: 50000 }, as: GrantCoordinator, captures: { i_mat: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw_i}", category: "EQUIPMENT", authorized_cents: 200000 }, as: GrantCoordinator, captures: { i_equip: $.data.id } }
            - { call: "POST /api/awards/${aw_l}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/awards/${aw_i}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw_l}", budget_line_id: "${l_travel}", expenditure_type: "TRAVEL", amount_cents: 100000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /api/expenditures/${e1}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw_l}", budget_line_id: "${l_mat}", expenditure_type: "SUPPLIES", amount_cents: 50000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: false }, as: GrantCoordinator, captures: { e2: $.data.id } }
            - { call: "POST /api/expenditures/${e2}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw_l}", budget_line_id: "${l_equip}", expenditure_type: "EQUIPMENT", amount_cents: 200000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e3: $.data.id } }
            - { call: "POST /api/expenditures/${e3}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw_i}", budget_line_id: "${i_travel}", expenditure_type: "TRAVEL", amount_cents: 100000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { g1: $.data.id } }
            - { call: "POST /api/expenditures/${g1}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw_i}", budget_line_id: "${i_mat}", expenditure_type: "SUPPLIES", amount_cents: 50000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: false }, as: GrantCoordinator, captures: { g2: $.data.id } }
            - { call: "POST /api/expenditures/${g2}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw_i}", budget_line_id: "${i_equip}", expenditure_type: "EQUIPMENT", amount_cents: 200000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { g3: $.data.id } }
            - { call: "POST /api/expenditures/${g3}/post", payload: {}, as: GrantsAccountant }
          trigger:
            - { call: "GET /api/awards/${aw_l}", as: GrantsAccountant, captures: { pool_l: $.data.available_draw_pool_cents } }
            - { call: "POST /api/receivables", payload: { award_id: "${aw_i}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z" }, as: GrantsAccountant, captures: { r_amt: $.data.amount_cents } }
          assert:
            - "pool_l == 350000  (cash basis: (100000+200000) + round(0.5*100000))"
            - "r_amt == 425000  (accrual basis: (100000+50000+200000) + round(0.5*150000))"
            - "pool_l != r_amt — identical expenditure data, different basis, 75000 delta"
            - "Expenditure.${g2}.invoiced_receivable_id is set while the LOC pool never includes the undisbursed E2"

      - name: fringe_provisional_vs_actual_trueup
        grounds:
          - calculations.fringe_benefit_charge
          - calculations.fringe_trueup_adjustment
          - state_machines.EffortCycle.CERTIFYING_to_CLOSED
        distinguishing_aspect: |
          Identical salary base (444444 cents) is fringed at the provisional 2795 bps during the year
          (per-line rounded total 124223) and trued up at cycle close to the actual 2800 bps via a
          +222 adjustment (final 124445) — provisional and actual are both valid figures for the same
          postings at different times, and the delta posts as a reconciliation, not a restatement.
        test_recipe:
          setup:
            - "LOC award F: SAL 500000 + FRINGE 150000 (directs 650000, MTDC 650000, F&A 5000bps = 325000, obligated 975000), ACTIVE, fringe_rate_bps 2795"
            - "Person RND (IBS 13333332, 12mo -> ibs_monthly 1111111, under cap), commitment 40.00% on F"
            - "Salary postings s1 (effort 30.00, 1mo, 2026-02-01) -> amount 333333; s2 (effort 10.00, 1mo, 2026-03-01) -> amount 111111"
            - "Cycle 2026-H1 [2026-01-01, 2026-07-01) 6 months, CERTIFYING; AWARD statement charged 6.67; NON_SPONSORED charged 0.0"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "R. Nd", role_type: "RESEARCH_STAFF", institutional_base_salary_annual_cents: 13333332, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { rnd: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "F-001", title: "Fringe project", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 975000, fringe_rate_bps: 2795 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "PERSONNEL_SALARIES", authorized_cents: 500000 }, as: GrantCoordinator, captures: { sal: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "FRINGE_BENEFITS", authorized_cents: 150000 }, as: GrantCoordinator, captures: { fr: $.data.id } }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/effort-commitments", payload: { award_id: "${aw}", person_id: "${rnd}", committed_effort_pct: 40.0, is_key_personnel: false }, as: GrantCoordinator }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${sal}", expenditure_type: "SALARY", person_id: "${rnd}", effort_pct: 30.0, period_months: 1, transaction_date: "2026-02-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /api/expenditures/${s1}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${sal}", expenditure_type: "SALARY", person_id: "${rnd}", effort_pct: 10.0, period_months: 1, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /api/expenditures/${s2}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/effort-cycles", payload: { cycle_code: "2026-H1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", cycle_months: 6 }, as: GrantsAccountant, captures: { cyc: $.data.id } }
            - { call: "POST /api/effort-cycles/${cyc}/open", payload: {}, as: GrantsAccountant }
            - { call: "GET /api/effort-statements", payload: { cycle_id: "${cyc}", award_id: "${aw}" }, as: GrantsAccountant, captures: { st_a: "$.data[0].id", st_a_v: "$.data[0].version" } }
            - { call: "GET /api/effort-statements", payload: { cycle_id: "${cyc}", person_id: "${rnd}", statement_kind: "NON_SPONSORED" }, as: GrantsAccountant, captures: { st_n: "$.data[0].id", st_n_v: "$.data[0].version" } }
            - { call: "POST /api/effort-statements/${st_a}/certify", payload: { certified_effort_pct: 6.67, expected_effort_statement_version: "${st_a_v}" }, as: ResearchStaff, as_user_id: "${rnd}" }
            - { call: "POST /api/effort-statements/${st_n}/certify", payload: { certified_effort_pct: 93.33, expected_effort_statement_version: "${st_n_v}", payroll_adjustment_note: "institutional teaching and administration allocation" }, as: ResearchStaff, as_user_id: "${rnd}" }
            - { call: "GET /api/budget-lines/${fr}", as: GrantsAccountant, captures: { fr_before: $.data.spent_cents } }
          trigger:
            - { call: "POST /api/effort-cycles/${cyc}/close", payload: { actual_fringe_rate_bps: 2800 }, as: GrantsAccountant }
            - { call: "GET /api/budget-lines/${fr}", as: GrantsAccountant, captures: { fr_after: $.data.spent_cents } }
          assert:
            - "fr_before == 124223  (provisional: round(333333*0.2795)=93167 + round(111111*0.2795)=31056)"
            - "fr_after == 124445  (true-up: + round(444444*5/10000) = +222)"
            - "fr_after - fr_before == 222 — the provisional/actual delta posts as a reconciliation adjustment"
            - "EffortCycle.${cyc}.status == CLOSED"
  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes (a), (b), (c) — all three)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: salary_cap_min_proration_branches
        grounds:
          - calculations.salary_charge_with_cap
          - entities.Expenditure.fields.over_cap_cents
        distinguishing_aspect: |
          Mode (a): a >= 3-input non-linear formula (IBS x appointment_months x salary cap x effort x
          months) whose nested min() picks different branches: PA (IBS 24000000/12 = 2000000 monthly)
          is capped at 1666667 and produces a 166667 over-cap institutional share, while PB
          (13500000/9 = 1500000 monthly) bills the full IBS rate with zero over-cap.
        test_recipe:
          setup:
            - "FED-LOC sponsor, cap 20000000 (cap_monthly = round(20000000/12) = 1666667)"
            - "Award G: SAL 3000000 + FRINGE 900000 (directs 3900000, MTDC 3900000, F&A 1950000, obligated 5850000), ACTIVE, fringe 3000"
            - "PA (PI, IBS 24000000, 12mo) committed 50% key; PB (staff, IBS 13500000, 9mo -> 1500000/mo) committed 25%"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "P. Alpha", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 24000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pa: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "P. Beta", role_type: "RESEARCH_STAFF", institutional_base_salary_annual_cents: 13500000, appointment_months: 9 }, as: SponsoredProgramsOfficer, captures: { pb: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pa}", award_number: "G-001", title: "Cap project", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 5850000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "PERSONNEL_SALARIES", authorized_cents: 3000000 }, as: GrantCoordinator, captures: { sal: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "FRINGE_BENEFITS", authorized_cents: 900000 }, as: GrantCoordinator }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/effort-commitments", payload: { award_id: "${aw}", person_id: "${pa}", committed_effort_pct: 50.0, is_key_personnel: true }, as: GrantCoordinator }
            - { call: "POST /api/effort-commitments", payload: { award_id: "${aw}", person_id: "${pb}", committed_effort_pct: 25.0, is_key_personnel: false }, as: GrantCoordinator }
          trigger:
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${sal}", expenditure_type: "SALARY", person_id: "${pa}", effort_pct: 50.0, period_months: 1, transaction_date: "2026-02-15T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { ea: $.data.id } }
            - { call: "POST /api/expenditures/${ea}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${sal}", expenditure_type: "SALARY", person_id: "${pb}", effort_pct: 25.0, period_months: 2, transaction_date: "2026-02-15T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { eb: $.data.id } }
            - { call: "POST /api/expenditures/${eb}/post", payload: {}, as: GrantsAccountant }
            - { call: "GET /api/expenditures/${ea}", as: GrantsAccountant, captures: { ea_amt: $.data.amount_cents, ea_over: $.data.over_cap_cents, ea_fr: $.data.fringe_cents } }
            - { call: "GET /api/expenditures/${eb}", as: GrantsAccountant, captures: { eb_amt: $.data.amount_cents, eb_over: $.data.over_cap_cents } }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { cs_met: $.data.cost_share_met_cents } }
          assert:
            - "ea_amt == 833334  (capped branch: round(1666667 * 0.50 * 1) = round(833333.5))"
            - "ea_over == 166667  (over-cap: round((2000000-1666667) * 0.50 * 1) = round(166666.5))"
            - "ea_fr == 250000   (fringe on the capped charge: round(833334 * 0.30) = round(250000.2))"
            - "eb_amt == 750000  (uncapped branch: round(1500000 * 0.25 * 2))"
            - "eb_over == 0"
            - "cs_met == 166667  (over-cap lands in institutional cost share, not in any budget line)"

      - name: fringe_per_line_rounding_then_sum
        grounds:
          - calculations.fringe_benefit_charge
          - entities.BudgetLine.fields.spent_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — fringe rounded per salary line then summed
          (93167 + 31056 = 124223) differs from sum-then-round (round(444444 * 0.2795) = 124222);
          the scaffold pins PER-LINE rounding, so the FRINGE_BENEFITS line shows 124223.
        test_recipe:
          setup:
            - "Award F2 (own fixture): SAL 500000 + FRINGE 150000, obligated 975000, fringe 2795 bps, ACTIVE"
            - "Person RND (ibs_monthly 1111111), commitment 40%, two salary postings 333333 and 111111 in Feb/Mar 2026"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "R. Nd", role_type: "RESEARCH_STAFF", institutional_base_salary_annual_cents: 13333332, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { rnd: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "F2-001", title: "Fringe rounding", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 975000, fringe_rate_bps: 2795 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "PERSONNEL_SALARIES", authorized_cents: 500000 }, as: GrantCoordinator, captures: { sal: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "FRINGE_BENEFITS", authorized_cents: 150000 }, as: GrantCoordinator, captures: { fr: $.data.id } }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/effort-commitments", payload: { award_id: "${aw}", person_id: "${rnd}", committed_effort_pct: 40.0 }, as: GrantCoordinator }
          trigger:
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${sal}", expenditure_type: "SALARY", person_id: "${rnd}", effort_pct: 30.0, period_months: 1, transaction_date: "2026-02-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /api/expenditures/${s1}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${sal}", expenditure_type: "SALARY", person_id: "${rnd}", effort_pct: 10.0, period_months: 1, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /api/expenditures/${s2}/post", payload: {}, as: GrantsAccountant }
            - { call: "GET /api/budget-lines/${fr}", as: GrantsAccountant, captures: { fr_spent: $.data.spent_cents } }
          assert:
            - "Expenditure.${s1}.fringe_cents == 93167  (round(333333 * 0.2795) = round(93166.5735))"
            - "Expenditure.${s2}.fringe_cents == 31056  (round(111111 * 0.2795) = round(31055.5245))"
            - "fr_spent == 124223  (per-line-then-sum; aggregate order would give round(444444*0.2795) = 124222)"
            - "fr_spent != 124222"

      - name: f_and_a_evaluation_order_at_budget_load
        grounds:
          - calculations.f_and_a_accrual
          - calculations.budget_load_ceiling_check
          - entities.BudgetLine.fields.authorized_cents
        distinguishing_aspect: |
          Mode (c): the budget total looks circular (total = directs + F&A, but F&A depends on the
          category mix of directs) — the scaffold pins the order: (1) sum directs, (2) subtract
          EQUIPMENT/PARTICIPANT_SUPPORT and the non-eligible SUBAWARDS portion to get MTDC,
          (3) F&A = rate x MTDC, (4) total = directs + F&A. With rate 5000 bps the F&A line computes
          to 5250000 (MTDC 10500000), NOT 6500000 (naive rate x total directs).
        test_recipe:
          setup:
