      - name: availability_patch_leaves_omitted_fields_alone_and_a_null_clears_the_blackout
        claim_type: defaults
        grounds:
          - endpoints[POST /udrp/panelists/{id}/availability].side_effects
          - entities.Panelist.fields.unavailable_from
          - entities.Panelist.fields.max_overlapping_engagements
        distinguishing_aspect: "Every input on this endpoint is optional, so it is a partial update: the ceiling change must not disturb the blackout, the status change must not disturb either, and an explicit null on unavailable_from clears the whole interval rather than being treated as an omission."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one roster panelist, Marta Kowalska (PL), created with max_overlapping_engagements 3 and no blackout."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/panelists"
              payload: { full_name: "Marta Kowalska", nationality_code: "PL", roster_admitted_at: "2021-02-01T00:00:00Z", max_overlapping_engagements: 3 }
              as: ProviderAdmin
              captures: { pan_id: "$.data.id", cap0: "$.data.max_overlapping_engagements", status0: "$.data.status", from0: "$.data.unavailable_from" }
          trigger:
            - call: "POST /udrp/panelists/${pan_id}/availability"
              payload: { max_overlapping_engagements: 6 }
              as: ProviderAdmin
              captures: { cap1: "$.data.max_overlapping_engagements", status1: "$.data.status", from1: "$.data.unavailable_from", to1: "$.data.unavailable_to" }
            - call: "POST /udrp/panelists/${pan_id}/availability"
              payload: { unavailable_from: "2026-09-10T00:00:00Z", unavailable_to: "2026-09-20T00:00:00Z" }
              as: Panelist
              as_user_id: "${pan_id}"
              captures: { cap2: "$.data.max_overlapping_engagements", from2: "$.data.unavailable_from", to2: "$.data.unavailable_to" }
            - call: "POST /udrp/panelists/${pan_id}/availability"
              payload: { status: "UNAVAILABLE" }
              as: ProviderAdmin
              captures: { status3: "$.data.status", cap3: "$.data.max_overlapping_engagements", from3: "$.data.unavailable_from", to3: "$.data.unavailable_to" }
            - call: "POST /udrp/panelists/${pan_id}/availability"
              payload: { max_overlapping_engagements: 21 }
              as: ProviderAdmin
              captures: { err_cap: "$.data.error_id" }
            - call: "POST /udrp/panelists/${pan_id}/availability"
              payload: { status: "RETIRED" }
              as: ProviderAdmin
              captures: { err_status: "$.data.error_id" }
            - call: "POST /udrp/panelists/${pan_id}/availability"
              payload: { status: "AVAILABLE", unavailable_from: null }
              as: ProviderAdmin
              captures: { status4: "$.data.status", from4: "$.data.unavailable_from", to4: "$.data.unavailable_to", cap4: "$.data.max_overlapping_engagements" }
          assert:
            - "Creation gives status AVAILABLE, max_overlapping_engagements 3 and unavailable_from null"
            - "After the ceiling-only call the ceiling is 6 while status is still AVAILABLE and both blackout endpoints are still null"
            - "After the blackout-only call unavailable_from is 2026-09-10T00:00:00Z, unavailable_to is 2026-09-20T00:00:00Z and the ceiling is still 6"
            - "After the status-only call status is UNAVAILABLE while the ceiling is still 6 and the blackout endpoints are unchanged"
            - "max_overlapping_engagements 21 returns HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST' (the declared range is 1-20) and the stored ceiling is still 6"
            - "status RETIRED returns HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST' and the stored status is still UNAVAILABLE"
            - "The final call sets status AVAILABLE and clears the interval: unavailable_from and unavailable_to are both null, while the ceiling stays 6"

      - name: manual_lock_cycles_the_domain_and_refuses_an_undeclared_lock_status
        claim_type: valid_transition
        grounds:
          - endpoints[POST /udrp/domains/{id}/lock].side_effects
          - state_machines.DomainName.lock_status
          - entities.DomainName.fields.locked_at
        distinguishing_aspect: "The out-of-band lock surface is the only way UNLOCKED and LOCKED can be reached without a case driving it, and it must write and clear locked_at symmetrically while bumping DomainName.version on every accepted call and on none of the refused ones."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9033; domain lockcycle.example, created UNLOCKED."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Lockcycle Registrar", iana_id: "IANA-9033", contact_email: "abuse@lockcyclereg.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "lockcycle.example", registrar_id: "${reg_id}", registrant_name_public: "Lockcycle Holder", registrant_email_public: "lc@proxy.example", registration_date: "2020-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_id: "$.data.id", lock0: "$.data.lock_status", locked_at0: "$.data.locked_at", ver0: "$.data.version" }
          trigger:
            - call: "POST /udrp/domains/${dom_id}/lock"
              payload: { lock_status: "LOCKED" }
              as: RegistrarAgent
              as_user_id: "${reg_id}"
              captures: { lock1: "$.data.lock_status", locked_at1: "$.data.locked_at", ver1: "$.data.version" }
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/domains/${dom_id}/lock"
              payload: { lock_status: "UNLOCKED" }
              as: ProviderAdmin
              captures: { lock2: "$.data.lock_status", locked_at2: "$.data.locked_at", ver2: "$.data.version" }
            - call: "POST /udrp/domains/${dom_id}/lock"
              payload: { lock_status: "FROZEN" }
              as: ProviderAdmin
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /udrp/domains/${dom_id}/lock"
              payload: { lock_status: "TRANSFER_EXECUTED" }
              as: ProviderAdmin
              captures: { err_terminal: "$.data.error_id" }
            - call: "GET /udrp/domains/${dom_id}"
              payload: {}
              as: RegistrarAgent
              as_user_id: "${reg_id}"
              captures: { lock3: "$.data.lock_status", locked_at3: "$.data.locked_at", ver3: "$.data.version" }
          assert:
            - "The domain is created UNLOCKED with locked_at null"
            - "The LOCKED call returns lock_status LOCKED with locked_at 2026-08-01T00:00:00Z and a version strictly greater than the created version"
            - "The UNLOCKED call at the later clock returns lock_status UNLOCKED with locked_at back to null and the version advanced again"
            - "lock_status FROZEN returns HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST' - only UNLOCKED and LOCKED are accepted on this surface"
            - "lock_status TRANSFER_EXECUTED also returns HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST', because the executed states are reachable only through implementation"
            - "The final read still shows UNLOCKED with locked_at null and the same version as after the second accepted call - neither refusal wrote anything"

      - name: implementation_is_the_registrar_action_that_closes_the_case
        claim_type: side_effect_execution
        grounds:
          - endpoints[POST /udrp/decisions/{id}/implement].side_effects
        excluded_because:
          difficulty_instance: boundary_precision_check / implementation_deadline_instant_is_still_inside_the_waiting_period
          rationale: "That instance drives implement at the deadline instant and one second later, asserting the whole success cascade - domain TRANSFER_EXECUTED, case IMPLEMENTED with refiling_bar_until, seats DISCHARGED and both load counters decremented."

      - name: replace_returns_the_predecessor_row_pointing_at_its_successor
        claim_type: side_effect_execution
        grounds:
          - endpoints[POST /udrp/appointments/{id}/replace].side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / replacing_one_seated_panelist_unconstitutes_the_panel_and_voids_the_draft
          rationale: "That instance reads the successor id out of the predecessor's replaced_by_appointment_id and asserts every link of the replacement cascade, including the voided draft and the honoraria reset."

  - section: errors
    note: |
      Error-catalogue claims that no other section reaches: the two distinct uses of
      ERR_RESOURCE_NOT_FOUND (nested sub-resource scoping at priority 35) and the uniformity of the
      error envelope across the status codes. Every other error id in §1.6 is triggered by a §1.8
      instance or by an instance in one of the other §1.9 sections.
    instances:
      - name: nested_sub_resource_ids_are_scoped_to_the_case_in_the_path
        claim_type: not_found
        grounds:
          - validations[priority=35].ERR_RESOURCE_NOT_FOUND
          - validations[priority=30].ERR_CASE_NOT_FOUND
        distinguishing_aspect: "A real verification id borrowed from another case is not merely unknown - it exists, and the check is that its parent case matches the path. Priority 35 answers ERR_RESOURCE_NOT_FOUND for the mismatched child while priority 30 answers ERR_CASE_NOT_FOUND when the case segment itself is fabricated, so the same fabricated pair yields two different 404s depending on which segment is wrong."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9034; two domains nested-a.example and nested-b.example on that registrar; complainant Nested Ltd (country_code GB); two cases A and B, each cleared through compliance so each owns exactly one REQUESTED RegistrarVerification."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Nested Registrar", iana_id: "IANA-9034", contact_email: "abuse@nestedreg.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
