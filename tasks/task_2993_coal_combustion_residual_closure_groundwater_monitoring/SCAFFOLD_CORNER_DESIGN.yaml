          - validations.priority_26_ERR_INVALID_WELL_STATE
          - validations.priority_38_ERR_RESULT_WELL_NOT_IN_PROGRAM
          - validations.priority_41_ERR_INSUFFICIENT_BACKGROUND_DATA
        distinguishing_aspect: |
          The evaluation links two rows, and the link must be checked on three axes before any statistics
          happen: the well must exist, it must still be CERTIFIED, and it must be a DOWNGRADIENT well of the
          program's own unit. A background well of the right unit and a downgradient well of the wrong unit
          both fail, with the same error, while a decommissioned downgradient well of the right unit fails
          earlier on state. The valid link is proved by reaching the data-sufficiency error instead.
