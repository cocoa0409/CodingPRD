            - "GET /mmm/model-runs/${run1} shows fitted_by_user_id == md-1 and published_by_user_id == al-1: two DIFFERENT users on the same row, which is the point of splitting fit from publish."
            - "GET /mmm/experiments/${exp1} shows designed_by_user_id == ed-1 and decided_by_user_id == null."
            - "GET /mmm/budget-scenarios/${scen} shows created_by_user_id == bp-1, approved_by_user_id == null and status == OPTIMIZED."
