              payload: { facility_id: "${f_id}", name: "Department A", cost_center_code: "CC-A", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_a_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Department B", cost_center_code: "CC-B", downtime_budget_cents: 5000000 }
