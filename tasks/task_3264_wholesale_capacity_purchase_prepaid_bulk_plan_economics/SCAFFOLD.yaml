# =============================================================================
# PRD Benchmark Scaffold — task_3264
# Wholesale Capacity Purchase & Prepaid Bulk Plan Economics (Mint Mobile)
# =============================================================================

scenario: |
  Wholesale Capacity Purchase & Prepaid Bulk Plan Economics (Mint Mobile): wholesale
  agreements with a host network purchasing data, voice and messaging capacity at
  negotiated rates, prepaid multi-month plan sales where customers pay in advance for
  three, six or twelve months with breakage and deferred revenue, data allotment design
  with deprioritization above thresholds during congestion, activation and porting flows
  handled digitally without retail stores, subscriber identity module and embedded
  profile distribution through retail partners and direct shipping, customer support
  outsourcing with self-service deflection targets, renewal pricing step-ups after
  introductory periods with churn management, roaming and international add-on
  provisioning.

domain_name: wholesale-capacity-prepaid-plans
api_prefix: /carriers

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (10 entities, 11 state machines)
# =============================================================================
entities:
  - name: CapacityAgreement
    parent: null
    common_fields: true
    fields:
      - { name: host_network_name, type: string, source: input, description: "Host network operator legal name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state this agreement is priced for", constraints: "2 uppercase letters" }
      - { name: data_rate_microcents_per_mb, type: integer, source: input, description: "Negotiated data rate in microcents per megabyte" }
      - { name: voice_rate_microcents_per_min, type: integer, source: input, description: "Negotiated voice rate in microcents per minute" }
      - { name: sms_rate_microcents_per_msg, type: integer, source: input, description: "Negotiated SMS rate in microcents per message" }
      - { name: committed_data_mb, type: integer, source: input, description: "Monthly committed data volume in megabytes", constraints: ">= 1" }
      - { name: committed_voice_minutes, type: integer, source: input, description: "Monthly committed voice minutes", constraints: ">= 1" }
      - { name: committed_sms_messages, type: integer, source: input, description: "Monthly committed SMS message count", constraints: ">= 1" }
      - { name: agreement_status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | CLOSED" }
      - { name: congestion_active, type: boolean, source: computed, description: "Derived: true when congestion_index is at or above the trigger index; gates deprioritization" }
      - { name: congestion_index, type: integer, source: computed, description: "Whole-percent over-subscription ratio of sold allotments to committed data" }
      - { name: allocated_data_mb, type: integer, source: computed, description: "Sum over Plans in status OFFERED or ACTIVE of data_allotment_mb times the plan's contributing subscriber count" }
      - { name: remaining_data_mb, type: integer, source: computed, description: "committed_data_mb minus allocated_data_mb; recomputed in the same pass, never incremented, and legitimately negative when the sold catalogue exceeds the contracted volume, in which case its magnitude is the billable overage volume" }
      - { name: resolved_purchase_cost_microcents, type: integer, source: computed, description: "Last resolved purchase cost under the forward-looking variant" }

  - name: Plan
    parent: CapacityAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> CapacityAgreement.id; the agreement this plan draws capacity from" }
      - { name: plan_code, type: string, source: input, description: "Operator-facing plan code", constraints: "unique within an agreement" }
      - { name: term_months, type: integer, source: input, description: "Prepaid term length in months", constraints: "one of 3, 6, 12" }
      - { name: intro_price_cents, type: integer, source: input, description: "Price charged for a subscriber's first term on this plan", constraints: ">= 1" }
      - { name: renewal_price_cents, type: integer, source: input, description: "Price charged for every later term", constraints: "strictly greater than intro_price_cents" }
      - { name: data_allotment_mb, type: integer, source: input, description: "Monthly high-speed data allotment before deprioritization", constraints: ">= 1" }
      - { name: voice_allotment_min, type: integer, source: input, description: "Monthly voice minutes included" }
      - { name: sms_allotment_msg, type: integer, source: input, description: "Monthly SMS messages included" }
      - { name: deprioritization_threshold_mb, type: integer, source: computed, description: "Derived as data_allotment_mb when the plan is offered; client-supplied values are ignored" }
      - { name: plan_status, type: enum, source: system, description: "DRAFT | OFFERED | ACTIVE | RETIRED" }

  - name: Subscriber
    parent: null
    common_fields: true
    fields:
      - { name: msisdn, type: string, source: input, description: "The mobile number the subscriber keeps", constraints: "unique across non-CHURNED subscribers; 11 digits" }
      - { name: full_name, type: string, source: input, description: "Subscriber legal name" }
      - { name: state_code, type: string, source: input, description: "Subscriber home state; decides which SIM media and agreement serve them" }
      - { name: subscriber_status, type: enum, source: system, description: "PENDING_PORT | ACTIVE | GRACE | SUSPENDED | CHURNED" }
      - { name: allocation_status, type: enum, source: computed, description: "NONE | HELD | ALLOCATED; HELD means an in-flight port reservation holds capacity for this subscriber" }
      - { name: cycle_index, type: integer, source: computed, description: "1-based ordinal of the subscriber's currently OPEN cycle inside its term" }
      - { name: cycles_rolled, type: integer, source: computed, description: "Count of cycles that have rolled closed for the current term" }
      - { name: data_used_mb_cycle, type: integer, source: computed, description: "High-speed data consumed in the currently OPEN cycle; resets to 0 when a cycle rolls" }
      - { name: deprioritized_this_cycle, type: boolean, source: computed, description: "True once data_used_mb_cycle reaches the plan's deprioritization threshold during a congested cycle" }
      - { name: cycle_deprioritization_days, type: integer, source: computed, description: "Distinct calendar days in the OPEN cycle on which deprioritized_this_cycle was true" }
      - { name: support_seconds_used, type: integer, source: computed, description: "Agent handling seconds booked across this subscriber's support cases" }
      - { name: support_seconds_budget, type: integer, source: computed, description: "Outsourced support budget in agent seconds; starts at 600 and is raised by support top-ups" }
      - { name: self_service_deflection_count, type: integer, source: computed, description: "Support cases for this subscriber closed self-service with zero agent seconds booked" }

  - name: PrepaidTerm
    parent: Subscriber
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id; the subscriber this prepaid term covers" }
      - { name: plan_id, type: string, source: system, description: "FK -> Plan.id; the plan whose allotments this term draws" }
      - { name: term_status, type: enum, source: system, description: "QUOTED | PURCHASED | AWAITING_ACTIVATION | ACTIVE | RENEWAL_DUE | ACTIVE_RENEWAL | GRACE | EXPIRED | REFUNDED | VOIDED" }
      - { name: term_price_cents, type: integer, source: computed, description: "Price charged for this term; intro_price_cents for a first term, renewal_price_cents thereafter" }
      - { name: starts_at, type: datetime, source: system, description: "Instant the first cycle of this term opened; null until the term activates" }
      - { name: expires_at, type: datetime, source: computed, description: "starts_at plus term_months calendar months" }
      - { name: deferred_revenue_cents, type: integer, source: computed, description: "Unearned portion of term_price_cents; only ever recomputed at a cycle roll or at churn" }
      - { name: earned_revenue_cents, type: integer, source: computed, description: "term_price_cents minus deferred_revenue_cents" }
      - { name: breakage_days, type: integer, source: computed, description: "Whole days of unearned term kept by the operator when the term lapsed or churned" }
      - { name: breakage_cents_recognized, type: integer, source: computed, description: "Revenue recognized out of the breakage window, floored to whole cents" }
      - { name: void_reason, type: enum, source: system, description: "SPARE_INVENTORY | PORT_TERMINATED; null unless term_status is VOIDED" }

  - name: Activation
    parent: Subscriber
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id; the subscriber being activated" }
      - { name: prepaid_term_id, type: string, source: system, description: "FK -> PrepaidTerm.id; the paid term this activation consumes" }
      - { name: retail_partner_id, type: string, source: system, description: "FK -> RetailPartner.id; required when activation_channel is RETAIL_PARTNER, null otherwise" }
      - { name: activation_channel, type: enum, source: input, description: "DIGITAL | RETAIL_PARTNER" }
      - { name: activation_status, type: enum, source: system, description: "REQUESTED | PROVISIONED | COMPLETED | FAILED" }
      - { name: port_status, type: enum, source: system, description: "NONE | SUBMITTED | CONFIRMED | REJECTED | CANCELLED; the independent porting dimension of this row" }
      - { name: porting_msisdn, type: string, source: input, description: "The number being ported in from the losing carrier", constraints: "11 digits" }
      - { name: losing_carrier, type: string, source: input, description: "Name of the carrier losing the number" }
      - { name: account_number_last4, type: string, source: input, description: "Last four characters of the losing-carrier account number" }
      - { name: rejection_code, type: string, source: system, description: "Losing-carrier rejection code; null unless port_status is REJECTED" }
      - { name: held_data_mb, type: integer, source: computed, description: "Agreement data capacity held for this port; equals the plan's data_allotment_mb while port_status is SUBMITTED or CONFIRMED, 0 otherwise" }
      - { name: provisioned_msisdn, type: string, source: computed, description: "The msisdn that became live; null until activation_status is PROVISIONED" }
      - { name: accepted_msisdn, type: string, source: computed, description: "The msisdn actually live after the activation settled; equals provisioned_msisdn once COMPLETED" }

  - name: RetailPartner
    parent: null
    common_fields: true
    fields:
      - { name: partner_name, type: string, source: input, description: "Retail partner trading name", constraints: "unique" }
      - { name: partner_status, type: enum, source: system, description: "ACTIVE | DEFLECTED | SUSPENDED" }
      - { name: partner_state_codes, type: array, source: input, description: "State codes this partner may hold SIM media for", constraints: "non-empty" }
      - { name: shipment_sla_days, type: integer, source: input, description: "Days from release to delivery for this partner", default: 2 }

  - name: SimInventory
    parent: RetailPartner
    common_fields: true
    fields:
      - { name: retail_partner_id, type: string, source: system, description: "FK -> RetailPartner.id; the partner holding this block, null for direct-to-subscriber inventory" }
      - { name: reserved_for_activation_id, type: string, source: system, description: "FK -> Activation.id; the activation this block is reserved for, null when unreserved" }
      - { name: sim_media_type, type: enum, source: input, description: "PHYSICAL_SIM | ESIM_PROFILE" }
      - { name: state_code, type: string, source: input, description: "State code this inventory block is scoped to; SIM media never crosses state lines" }
      - { name: unit_count, type: integer, source: input, description: "Number of SIM units or eSIM profiles in this block", constraints: ">= 1" }
      - { name: inventory_status, type: enum, source: system, description: "AVAILABLE | RESERVED_PREPAID | SHIPPED | DELIVERED | DEPLETED | RETURNED" }
      - { name: reserved_count, type: integer, source: computed, description: "Units currently reserved but not yet shipped" }
      - { name: shipment_channel, type: enum, source: system, description: "RETAIL_PARTNER_STOCK | DIRECT_TO_SUBSCRIBER; null before a shipment is requested" }
      - { name: units_shipped, type: integer, source: computed, description: "Units released under the current shipment for this block; 0 before release" }
      - { name: shipment_sla_days, type: integer, source: computed, description: "SLA days copied from the receiving RetailPartner at release; null for direct-to-subscriber blocks" }

  - name: CycleRecord
    parent: PrepaidTerm
    common_fields: false
    fields:
      - { name: prepaid_term_id, type: string, source: system, description: "FK -> PrepaidTerm.id; the term this cycle belongs to" }
      - { name: cycle_index, type: integer, source: system, description: "1-based cycle ordinal inside the term; term_months is the last one" }
      - { name: cycle_status, type: enum, source: system, description: "OPEN | ROLLED" }
      - { name: opened_at, type: datetime, source: system, description: "Instant this cycle opened" }
      - { name: closed_at, type: datetime, source: system, description: "Instant this cycle rolled closed; null while OPEN" }
      - { name: cycle_data_used_mb, type: integer, source: computed, description: "Frozen high-speed data usage recorded for this cycle at roll" }
      - { name: cycle_deprioritization_days, type: integer, source: computed, description: "Frozen count of deprioritized days recorded for this cycle at roll" }
      - { name: earned_cents, type: integer, source: computed, description: "Whole cents earned for this cycle; the running sum of these integers is what deferred_revenue_cents subtracts" }

  - name: SupportCase
    parent: Subscriber
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id; the subscriber this case concerns" }
      - { name: topic_code, type: enum, source: input, description: "ROAMING_SETUP | DEPRIORITIZATION_COMPLAINT | PORT_STATUS | REFUND_REQUEST | RENEWAL_PRICING | SIM_REPLACEMENT" }
      - { name: case_status, type: enum, source: system, description: "OPEN | ASSIGNED | RESOLVED_SELF_SERVICE | RESOLVED_AGENT | ESCALATED | CLOSED" }
      - { name: handling_seconds, type: integer, source: computed, description: "Agent seconds booked against this case; 0 while self-service resolved" }
      - { name: sla_due_at, type: datetime, source: computed, description: "created_at plus the topic's SLA hours; drives automatic escalation at a cycle roll" }
      - { name: escalation_reason, type: enum, source: system, description: "SLA_BREACH | SELF_SERVICE_FAILED; null unless case_status is ESCALATED" }

  - name: AddOn
    parent: Subscriber
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id; the subscriber buying the add-on" }
      - { name: addon_type, type: enum, source: input, description: "ROAMING | INTERNATIONAL_LD" }
      - { name: addon_status, type: enum, source: system, description: "REQUESTED | ACTIVE | EXPIRED | CANCELLED | VOIDED" }
      - { name: addon_price_cents, type: integer, source: computed, description: "Price resolved from the derived roaming rate card" }
      - { name: per_day_allotment_mb, type: integer, source: input, description: "Daily roaming data allotment in MB; 0 for INTERNATIONAL_LD" }
      - { name: addon_days, type: integer, source: input, description: "Duration of the add-on in days", constraints: "one of 1, 7, 30" }
      - { name: start_at, type: datetime, source: system, description: "Instant the add-on became ACTIVE; null while REQUESTED" }
      - { name: end_at, type: datetime, source: computed, description: "start_at plus addon_days calendar days" }
      - { name: deprovisioned_msisdn, type: string, source: system, description: "The msisdn actually deprovisioned when the parent subscriber churned" }
# =============================================================================
# Table 2: State Machine Table (11 machines; Activation carries two parallel dims)
# =============================================================================
state_machines:
  # --- M1: CapacityAgreement.status -----------------------------------------
  - entity: CapacityAgreement
    field: agreement_status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    shape: linear
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /capacity-agreements/{agreement_id}/activate"
        actor: CapacityPlanner
        preconditions:
          - "committed_data_mb >= 1 and committed_voice_minutes >= 1 and committed_sms_messages >= 1"
          - "At least one Plan on this agreement is in status OFFERED"
        side_effects:
          - "Recomputes allocated_data_mb and remaining_data_mb in one pass via wholesale_allocated_data_mb"
          - "Recomputes congestion_index and congestion_active via congestion_index"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /capacity-agreements/{agreement_id}/suspend, or system when a recompute finds allocated_data_mb > committed_data_mb"
        actor: "CapacityPlanner or system"
        preconditions:
          - "Manual: agreement_status is ACTIVE"
          - "Auto: allocated_data_mb strictly exceeds committed_data_mb * OVERSALE_LIMIT_NUM / OVERSALE_LIMIT_DEN after a recompute triggered by any capacity-allocation event"
        side_effects:
          - "Pins remaining_data_mb to the negative overshoot so the overshoot is readable as billable overage volume"
          - "Leaves every already-ACTIVE PrepaidTerm and ACTIVE Subscriber untouched so existing service continues"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /capacity-agreements/{agreement_id}/reactivate"
        actor: CapacityPlanner
        preconditions:
          - "allocated_data_mb <= committed_data_mb (over-allocation resolved by a churn, a held-port release, or a plan withdraw)"
        side_effects:
          - "Recomputes allocated_data_mb, remaining_data_mb and congestion_index"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /capacity-agreements/{agreement_id}/close"
        actor: CapacityPlanner
        preconditions:
          - "No Plan on this agreement is in status DRAFT"
          - "No PrepaidTerm on any Plan of this agreement is in status QUOTED, PURCHASED, AWAITING_ACTIVATION or RENEWAL_DUE"
        side_effects:
          - "Sets plan_status = RETIRED on every Plan of this agreement"

      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /capacity-agreements/{agreement_id}/close"
        actor: CapacityPlanner
        preconditions:
          - "No PrepaidTerm on any Plan of this agreement is in status QUOTED, PURCHASED or AWAITING_ACTIVATION"
        side_effects:
          - "Sets plan_status = RETIRED on every Plan of this agreement"

  # --- M2: Plan.status (cyclic: DRAFT ⇄ OFFERED, OFFERED ⇄ ACTIVE) ----------
  - entity: Plan
    field: plan_status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /plans/{plan_id}/offer"
        actor: CapacityPlanner
        preconditions:
          - "The parent CapacityAgreement.agreement_status is DRAFT or ACTIVE"
          - "term_months is one of 3, 6, 12"
          - "renewal_price_cents > intro_price_cents"
        side_effects:
          - "Sets deprioritization_threshold_mb = data_allotment_mb"
          - "Recomputes the parent agreement's allocated_data_mb and remaining_data_mb"

      - from: OFFERED
        to: ACTIVE
        trigger: "POST /prepaid-terms/{term_id}/purchase, the first purchase against this plan"
        actor: Subscriber
        preconditions:
          - "The parent agreement is ACTIVE"
          - "remaining_data_mb >= data_allotment_mb"
        side_effects:
          - "Recomputes the parent agreement's allocated_data_mb and remaining_data_mb"

      - from: ACTIVE
        to: OFFERED
        trigger: "system, fired when the plan's last non-terminal PrepaidTerm leaves a non-terminal status"
        actor: system
        preconditions:
          - "No PrepaidTerm on this plan is in status QUOTED, PURCHASED, AWAITING_ACTIVATION, ACTIVE, RENEWAL_DUE or ACTIVE_RENEWAL"
        side_effects:
          - "Recomputes the parent agreement's allocated_data_mb and remaining_data_mb"

      - from: OFFERED
        to: DRAFT
        trigger: "POST /plans/{plan_id}/withdraw"
        actor: CapacityPlanner
        preconditions:
          - "No PrepaidTerm on this plan is in status QUOTED, PURCHASED, AWAITING_ACTIVATION, ACTIVE, RENEWAL_DUE or ACTIVE_RENEWAL"
        side_effects:
          - "Recomputes the parent agreement's allocated_data_mb and remaining_data_mb"

      - from: "DRAFT, OFFERED or ACTIVE"
        to: RETIRED
        trigger: "system, fired when the parent agreement transitions to CLOSED"
        actor: system
        preconditions:
          - "The parent CapacityAgreement.agreement_status is CLOSED"
        side_effects:
          - "Rejects later POST /prepaid-terms and POST /prepaid-terms/{term_id}/purchase against this plan with ERR_PLAN_RETIRED"

  # --- M3: Subscriber.status ------------------------------------------------
  - entity: Subscriber
    field: subscriber_status
    initial_state: PENDING_PORT
    terminal_states: [CHURNED]
    shape: branching
    transitions:
      - from: PENDING_PORT
        to: ACTIVE
        trigger: "system, fired when the subscriber's Activation.activation_status becomes COMPLETED"
        actor: system
        preconditions:
          - "The subscriber's Activation.activation_status is COMPLETED"
        side_effects:
          - "Sets allocation_status = ALLOCATED"
          - "Recomputes the parent agreement's allocated_data_mb, remaining_data_mb and congestion_index"

      - from: PENDING_PORT
        to: GRACE
        trigger: "POST /activations/{activation_id}/fail"
        actor: SupportAgent
        preconditions:
          - "The subscriber's Activation.activation_status is FAILED"
        side_effects:
          - "Sets the subscriber's PrepaidTerm.term_status = GRACE"
          - "Schedules synthetic churn at the next POST /subscribers/{subscriber_id}/run_cycle"

      - from: PENDING_PORT
        to: CHURNED
        trigger: "system, fired when the subscriber's Activation.port_status becomes REJECTED and the subscriber declines the spare number"
        actor: system
        preconditions:
          - "The subscriber's Activation.port_status is REJECTED"
          - "The subscriber has not called POST /subscribers/{subscriber_id}/keep_requested_msisdn"
        side_effects:
          - "Releases the port hold, setting Activation.held_data_mb = 0"
          - "Recomputes the parent agreement's allocated_data_mb, remaining_data_mb and congestion_index"
          - "Closes every SupportCase for this subscriber in status OPEN or ASSIGNED as CLOSED"

      - from: GRACE
        to: ACTIVE
        trigger: "POST /subscribers/{subscriber_id}/resume_activation"
        actor: SupportAgent
        preconditions:
          - "An Activation for this subscriber is in status REQUESTED or PROVISIONED"
          - "The subscriber's PrepaidTerm.term_status is GRACE"
        side_effects:
          - "Sets allocation_status = HELD"
          - "Sets the PrepaidTerm.term_status = AWAITING_ACTIVATION"

      - from: GRACE
        to: CHURNED
        trigger: "system, fired at the first cycle roll after the subscriber entered GRACE"
        actor: system
        preconditions:
          - "The subscriber's PrepaidTerm.term_status is GRACE at the moment a CycleRecord would open"
        side_effects:
          - "Sets the PrepaidTerm.term_status = EXPIRED with breakage_days and breakage_cents_recognized written by early_churn_revenue_recognition"
          - "Recomputes the parent agreement's allocated_data_mb, remaining_data_mb and congestion_index"
          - "Closes every SupportCase for this subscriber in status OPEN or ASSIGNED as CLOSED"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /subscribers/{subscriber_id}/suspend"
        actor: SupportAgent
        preconditions:
          - "subscriber_status is ACTIVE"
        side_effects:
          - "Leaves allocated_data_mb on the agreement unchanged, because the prepaid term is still committed capacity"
          - "Rejects POST /add-ons for this subscriber with ERR_SUBSCRIBER_NOT_ACTIVE"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /subscribers/{subscriber_id}/resume"
        actor: SupportAgent
        preconditions:
          - "subscriber_status is SUSPENDED"
        side_effects:
          - "Recomputes congestion_index on the parent agreement"

      - from: ACTIVE
        to: CHURNED
        trigger: "POST /subscribers/{subscriber_id}/cancel"
        actor: Subscriber
        preconditions:
          - "The subscriber owns the resource (X-User-ID equals the subscriber id)"
          - "No Activation for this subscriber has port_status SUBMITTED"
          - "The expected_Subscriber_version carried in the body equals the subscriber's current version"
        side_effects:
          - "Sets the subscriber's PrepaidTerm.term_status = EXPIRED and writes breakage_days, breakage_cents_recognized, deferred_revenue_cents and earned_revenue_cents by early_churn_revenue_recognition"
          - "Sets every AddOn for this subscriber with addon_status IN {REQUESTED, ACTIVE} to VOIDED with deprovisioned_msisdn = Subscriber.accepted_msisdn"
          - "Closes every SupportCase for this subscriber in status OPEN, ASSIGNED or ESCALATED as CLOSED"
          - "Recomputes the parent Plan.plan_status, the parent agreement's allocated_data_mb, remaining_data_mb and congestion_index"

      - from: SUSPENDED
        to: CHURNED
        trigger: "POST /subscribers/{subscriber_id}/cancel"
        actor: Subscriber
        preconditions:
          - "The subscriber owns the resource (X-User-ID equals the subscriber id)"
          - "The expected_Subscriber_version carried in the body equals the subscriber's current version"
        side_effects:
          - "Sets the subscriber's PrepaidTerm.term_status = EXPIRED and writes breakage_days, breakage_cents_recognized, deferred_revenue_cents and earned_revenue_cents by early_churn_revenue_recognition"
          - "Sets every AddOn for this subscriber with addon_status IN {REQUESTED, ACTIVE} to VOIDED"
          - "Recomputes the parent Plan.plan_status and the parent agreement's allocated_data_mb, remaining_data_mb and congestion_index"

  # --- M4: PrepaidTerm.status (cyclic: ACTIVE → RENEWAL_DUE → ACTIVE_RENEWAL → RENEWAL_DUE)
  - entity: PrepaidTerm
    field: term_status
    initial_state: QUOTED
    terminal_states: [EXPIRED, REFUNDED, VOIDED]
    shape: cyclic
    transitions:
      - from: QUOTED
        to: PURCHASED
        trigger: "POST /prepaid-terms/{term_id}/purchase"
        actor: Subscriber
        preconditions:
          - "The parent Plan.plan_status is OFFERED or ACTIVE"
          - "The plan's parent CapacityAgreement.agreement_status is ACTIVE"
          - "remaining_data_mb >= the plan's data_allotment_mb"
          - "No other PrepaidTerm for the same subscriber_id is in a non-terminal status"
        side_effects:
          - "Sets term_price_cents by prepaid_term_price"
          - "Sets deferred_revenue_cents and earned_revenue_cents by schedule_formula_provisional_vs_final (provisional variant)"
          - - "Recomputes the parent Plan.plan_status (OFFERED to ACTIVE)"
          - "Recomputes the parent agreement's allocated_data_mb, remaining_data_mb and congestion_index"

      - from: PURCHASED
        to: AWAITING_ACTIVATION
        trigger: "POST /activations"
        actor: Subscriber
        preconditions:
          - "No Activation already references this prepaid_term_id"
        side_effects:
          - "Sets the parent Subscriber.allocation_status = HELD"
          - "Records the plan's data_allotment_mb as the hold carried by the new Activation"

      - from: AWAITING_ACTIVATION
        to: ACTIVE
        trigger: "system, fired when the subscriber's Activation.activation_status becomes COMPLETED"
        actor: system
        preconditions:
          - "The subscriber's Activation.activation_status is COMPLETED"
        side_effects:
          - "Sets starts_at to the instant the first CycleRecord opened and expires_at = starts_at plus term_months calendar months"
          - "Sets the parent Subscriber.cycle_index = 1 and data_used_mb_cycle = 0"
          - "Opens the first CycleRecord with cycle_status OPEN"
          - "Recomputes the parent agreement's allocated_data_mb, remaining_data_mb and congestion_index"

      - from: AWAITING_ACTIVATION
        to: PURCHASED
        trigger: "POST /activations/{activation_id}/fail"
        actor: SupportAgent
        preconditions:
          - "The subscriber's Activation.activation_status is FAILED"
        side_effects:
          - "Releases the port hold carried on the Activation (held_data_mb = 0)"
          - "Turns the Activation into REQUESTED on the spare msisdn delivered by the SimInventory block"

      - from: AWAITING_ACTIVATION
        to: GRACE
        trigger: "system, fired when the parent Subscriber transitions PENDING_PORT to GRACE"
        actor: system
        preconditions:
          - "The subscriber's Activation.activation_status is FAILED"
        side_effects:
          - "Parks the term: it neither commits capacity nor earns revenue while in GRACE"
          - "Recomputes the parent agreement's allocated_data_mb and remaining_data_mb"

      - from: GRACE
        to: AWAITING_ACTIVATION
        trigger: "POST /carriers/subscribers/{subscriber_id}/resume_activation"
        actor: SupportAgent
        preconditions:
          - "An Activation for this subscriber is in status REQUESTED or PROVISIONED"
        side_effects:
          - "Recomputes the parent agreement's allocated_data_mb and remaining_data_mb"

      - from: ACTIVE
        to: RENEWAL_DUE
        trigger: "system, fired when the term's final CycleRecord (cycle_index == term_months) rolls"
        actor: system
        side_effects:
          - "Opens a SupportCase with topic_code RENEWAL_PRICING, case_status OPEN and the renewal SLA window"
          - "Uses schedule_formula_provisional_vs_final (final variant) to write earned_revenue_cents and deferred_revenue_cents for the closed cycle"

      - from: RENEWAL_DUE
        to: ACTIVE_RENEWAL
        trigger: "POST /prepaid-terms/{term_id}/accept_step_up"
        actor: Subscriber
        preconditions:
          - "The parent Plan.plan_status is OFFERED or ACTIVE"
          - "The plan's parent CapacityAgreement.agreement_status is ACTIVE"
          - "remaining_data_mb >= the plan's data_allotment_mb"
        side_effects:
          - "Sets term_price_cents = renewal_price_cents and expires_at = expires_at plus term_months calendar months"
          - "Resets the parent Subscriber: cycle_index = 1, cycles_rolled = 0, data_used_mb_cycle = 0, deprioritized_this_cycle = false, cycle_deprioritization_days = 0"
          - "Opens a fresh CycleRecord with cycle_index 1 and cycle_status OPEN"
          - "Closes the subscriber's SupportCase with topic_code RENEWAL_PRICING as CLOSED"
          - "Sets every AddOn for this subscriber with addon_status IN {REQUESTED, ACTIVE} to VOIDED with deprovisioned_msisdn = Subscriber.accepted_msisdn"
          - "Recomputes the parent agreement's allocated_data_mb, remaining_data_mb and congestion_index"

      - from: ACTIVE_RENEWAL
        to: RENEWAL_DUE
        trigger: "system, fired when the renewed term's final CycleRecord rolls"
        actor: system
        side_effects:
          - "Opens a SupportCase with topic_code RENEWAL_PRICING, case_status OPEN"

      - from: RENEWAL_DUE
        to: EXPIRED
        trigger: "POST /subscribers/{subscriber_id}/cancel, or system when a cycle rolls past the renewal due point with no step-up"
        actor: "Subscriber or system"
        preconditions:
          - "No successor PrepaidTerm exists for this subscriber_id"
        side_effects:
          - "Writes breakage_days and breakage_cents_recognized by early_churn_revenue_recognition"
          - "Churns the parent Subscriber (subscriber_status = CHURNED)"
          - "Recomputes the parent Plan.plan_status and the parent agreement's allocated_data_mb, remaining_data_mb and congestion_index"

      - from: GRACE
        to: EXPIRED
        trigger: "system, fired at the first CycleRecord-less churn while the subscriber is in GRACE"
        actor: system
        preconditions:
          - "The parent Subscriber.subscriber_status is CHURNED"
        side_effects:
          - "Writes breakage_days and breakage_cents_recognized by early_churn_revenue_recognition"
          - "Recomputes the parent Plan.plan_status and the parent agreement's allocated_data_mb, remaining_data_mb and congestion_index"

      - from: "PURCHASED or AWAITING_ACTIVATION"
        to: REFUNDED
        trigger: "POST /prepaid-terms/{term_id}/cancel"
        actor: "Subscriber or SupportAgent"
        preconditions:
          - "starts_at is null, so no cycle has ever opened for this term"
        side_effects:
          - "Sets deferred_revenue_cents = 0 and earned_revenue_cents = 0"
          - "Releases any held capacity for this subscriber's msisdn through settlement_clearing"
          - "Recomputes the parent Plan.plan_status and the parent agreement's allocated_data_mb, remaining_data_mb and congestion_index"

      - from: AWAITING_ACTIVATION
        to: VOIDED
        trigger: "system, fired when the subscriber's SimInventory block has no reservable unit and the spare path is exhausted"
        actor: system
        preconditions:
          - "No SimInventory block for the subscriber's state_code has unit_count - reserved_count >= 1"
        side_effects:
          - "Sets void_reason = SPARE_INVENTORY"
          - "Sets deferred_revenue_cents = 0 and earned_revenue_cents = 0"
          - "Releases the subscriber's held capacity through settlement_clearing"
          - "Recomputes the parent agreement's allocated_data_mb, remaining_data_mb and congestion_index"

      - from: "PURCHASED or AWAITING_ACTIVATION"
        to: VOIDED
        trigger: "POST /activations/{activation_id}/reject-port followed by the subscriber declining the spare number"
        actor: system
        preconditions:
          - "The subscriber's Activation.port_status is REJECTED"
        side_effects:
          - "Sets void_reason = PORT_TERMINATED"
          - "Churns the parent Subscriber (subscriber_status = CHURNED)"
          - "Recomputes the parent agreement's allocated_data_mb, remaining_data_mb and congestion_index"

  # --- M5: Activation.activation_status ------------------------------------
  - entity: Activation
    field: activation_status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, FAILED]
    shape: branching
    transitions:
      - from: REQUESTED
        to: PROVISIONED
        trigger: "POST /activations/{activation_id}/provision"
        actor: System
        preconditions:
          - "A SimInventory block scoped to the subscriber's state_code has unit_count - reserved_count >= 1"
          - "When activation_channel is RETAIL_PARTNER, the referenced partner has partner_status ACTIVE and lists the subscriber's state_code in partner_state_codes"
        side_effects:
          - "Reserves one unit on that block: reserved_count += 1, reserved_for_activation_id = this activation, inventory_status = RESERVED_PREPAID"
          - "Sets provisioned_msisdn: the subscriber's requested msisdn when the subscriber is PENDING_PORT on that same number, else the subscriber's current msisdn"
          - "When activation_channel is RETAIL_PARTNER, sets the block's shipment_channel = RETAIL_PARTNER_STOCK and shipment_sla_days copied from the partner"
          - "Sets the parent Subscriber.allocation_status = HELD and recomputes the parent agreement's allocated_data_mb and remaining_data_mb"

      - from: PROVISIONED
        to: COMPLETED
        trigger: "POST /activations/{activation_id}/complete"
        actor: "Subscriber or SupportAgent"
        preconditions:
          - "The subscriber's PrepaidTerm.term_status is AWAITING_ACTIVATION"
          - "port_status is NONE, CANCELLED, CONFIRMED or REJECTED, so a rejected or cancelled port still lets the activation go live on the spare number"
        side_effects:
          - "Sets accepted_msisdn = provisioned_msisdn when no port settled, else accepted_msisdn = porting_msisdn; sets held_data_mb = 0"
          - "Sets the parent Subscriber.subscriber_status = ACTIVE and allocation_status = ALLOCATED"
          - "Sets the parent PrepaidTerm.term_status = ACTIVE and opens its first CycleRecord"
          - "Recomputes the parent Plan.plan_status and the parent agreement's allocated_data_mb, remaining_data_mb and congestion_index"

      - from: REQUESTED
        to: FAILED
        trigger: "POST /activations/{activation_id}/fail"
        actor: SupportAgent
        preconditions:
          - "No SimInventory block scoped to the subscriber's state_code has unit_count - reserved_count >= 1"
        side_effects:
          - "Sets the parent Subscriber.subscriber_status = GRACE"
          - "Sets the parent PrepaidTerm.term_status = PURCHASED"
          - "Decrements the reserving block's reserved_count when a reservation had been taken"

      - from: PROVISIONED
        to: FAILED
        trigger: "POST /activations/{activation_id}/fail"
        actor: SupportAgent
        preconditions:
          - "The activation's SimInventory block has inventory_status SHIPPED or DELIVERED with a shipment_sla_days window that has elapsed"
        side_effects:
          - "Sets the parent Subscriber.subscriber_status = GRACE"
          - "Sets the parent PrepaidTerm.term_status = PURCHASED"
          - "Sets the block's inventory_status back to RETURNED and reopens its reserved_count by the reserved units"

  # --- M6: Activation.port_status (parallel dimension on the same row) -----
  - entity: Activation
    field: port_status
    initial_state: NONE
    terminal_states: [REJECTED, CANCELLED]
    shape: parallel
    transitions:
      - from: NONE
        to: SUBMITTED
        trigger: "POST /activations/{activation_id}/submit-port"
        actor: Subscriber
        preconditions:
          - "activation_status is PROVISIONED or COMPLETED, so both a not-yet-live number and a live number can be ported"
          - "The subscriber's msisdn equals the submitted porting_msisdn when activation_status is PROVISIONED"
          - "No other Activation holds port_status SUBMITTED with the same losing_carrier and account_number_last4"
        side_effects:
          - "Sets held_data_mb = the plan's data_allotment_mb"
          - "Sets the parent Subscriber.allocation_status = HELD"
          - "Recomputes the parent agreement's allocated_data_mb and remaining_data_mb (the hold and the allocation are counted exactly once, never twice)"

      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /activations/{activation_id}/confirm-port"
        actor: SupportAgent
        preconditions:
          - "port_status is SUBMITTED"
        side_effects:
          - "Sets the parent Subscriber.subscriber_status = ACTIVE and allocation_status = ALLOCATED"
          - "Recomputes the parent agreement's allocated_data_mb and remaining_data_mb"

      - from: CONFIRMED
        to: NONE
        trigger: "system, fired when activation_status becomes COMPLETED at the end of a port"
        actor: system
        preconditions:
          - "activation_status is COMPLETED and the confirmed port has just settled"
        side_effects:
          - "Sets held_data_mb = 0"
          - "Sets accepted_msisdn = porting_msisdn"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /activations/{activation_id}/reject-port"
        actor: SupportAgent
        preconditions:
          - "port_status is SUBMITTED"
        side_effects:
          - "Sets rejection_code to the supplied losing-carrier code"
          - "Sets held_data_mb = 0"
          - "Sets the parent Subscriber.subscriber_status = GRACE and allocation_status = NONE when activation_status is PROVISIONED, because the activation has not yet gone live"
          - "Leaves the parent Subscriber.subscriber_status = ACTIVE and allocation_status = ALLOCATED when activation_status is COMPLETED, because the live term still holds its capacity"
          - "Recomputes the parent agreement's allocated_data_mb, remaining_data_mb and congestion_index"

      - from: CONFIRMED
        to: REJECTED
        trigger: "POST /activations/{activation_id}/reject-port"
        actor: SupportAgent
        preconditions:
          - "port_status is CONFIRMED"
          - "activation_status is not COMPLETED"
        side_effects:
          - "Sets held_data_mb = 0 and the parent Subscriber.allocation_status = NONE"
          - "Recomputes the parent agreement's allocated_data_mb and remaining_data_mb"

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /activations/{activation_id}/cancel-port"
        actor: Subscriber
        preconditions:
          - "port_status is SUBMITTED"
        side_effects:
          - "Sets held_data_mb = 0"
          - "Sets the parent Subscriber.allocation_status = HELD when activation_status is PROVISIONED, because the term is still awaiting activation"
          - "Leaves the parent Subscriber.allocation_status = ALLOCATED when activation_status is COMPLETED"
          - "Recomputes the parent agreement's allocated_data_mb and remaining_data_mb"

  # --- M7: RetailPartner.status -------------------------------------------
  - entity: RetailPartner
    field: partner_status
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    shape: linear
    transitions:
      - from: ACTIVE
        to: DEFLECTED
        trigger: "system, fired when the partner's delivered shipments exceed its released shipments by two or more"
        actor: system
        preconditions:
          - "The partner has 2 or more SimInventory blocks whose inventory_status is SHIPPED and whose shipment_sla_days window has elapsed"
        side_effects:
          - "Rejects new POST /sim-inventories and RETAIL_PARTNER POST /activations against this partner with ERR_PARTNER_SUSPENDED"

      - from: DEFLECTED
        to: ACTIVE
        trigger: "POST /retail-partners/{partner_id}/reinstate"
        actor: CapacityPlanner
        preconditions:
          - "The partner has no SimInventory block with inventory_status SHIPPED whose shipment_sla_days window has elapsed"
        side_effects: []

      - from: "ACTIVE or DEFLECTED"
        to: SUSPENDED
        trigger: "POST /retail-partners/{partner_id}/suspend"
        actor: CapacityPlanner
        preconditions:
          - "partner_status is ACTIVE or DEFLECTED"
        side_effects:
          - "Rejects RETAIL_PARTNER activations against this partner with ERR_PARTNER_SUSPENDED"

  # --- M8: SimInventory.status --------------------------------------------
  - entity: SimInventory
    field: inventory_status
    initial_state: AVAILABLE
    terminal_states: [DEPLETED]
    shape: branching
    transitions:
      - from: AVAILABLE
        to: RESERVED_PREPAID
        trigger: "POST /activations/{activation_id}/provision"
        actor: System
        preconditions:
          - "unit_count - reserved_count >= 1"
          - "The subscribing subscriber's state_code equals this block's state_code"
        side_effects:
          - "Increments reserved_count by 1 and sets reserved_for_activation_id"

      - from: RESERVED_PREPAID
        to: SHIPPED
        trigger: "system, fired when a shipment release reaches the block"
        actor: system
        preconditions:
          - "The block's reserved_for_activation_id activation has activation_status PROVISIONED"
        side_effects:
          - "Sets units_shipped = reserved_count and decrements reserved_count by that amount"
          - "Copies the receiving partner's shipment_sla_days when shipment_channel is RETAIL_PARTNER_STOCK"

      - from: SHIPPED
        to: DELIVERED
        trigger: "system, fired when the shipment_sla_days window elapses on the logical clock"
        actor: system
        preconditions:
          - "The block's state_code matches the destination state recorded on the activation"
        side_effects: []

      - from: AVAILABLE
        to: AVAILABLE
        trigger: "system, fired by a DIGITAL POST /activations/{activation_id}/provision that reserves a unit"
        actor: system
        preconditions:
          - "The reserving activation's activation_channel is DIGITAL"
        side_effects:
          - "Sets shipment_channel = DIRECT_TO_SUBSCRIBER and leaves shipment_sla_days null, because the block ships straight to the subscriber rather than to a partner"

      - from: "AVAILABLE or RESERVED_PREPAID or SHIPPED or DELIVERED"
        to: RETURNED
        trigger: "POST /sim-inventories/{inventory_id}/return"
        actor: "FulfillmentOperator"
        preconditions:
          - "inventory_status is RESERVED_PREPAID, SHIPPED or DELIVERED"
        side_effects:
          - "Reopens reserved_count by units_shipped and sets units_shipped = 0"
          - "Sets the reserving Activation.activation_status = FAILED when it was PROVISIONED, which cascades the subscriber into GRACE and the term back to PURCHASED"

      - from: "AVAILABLE or RESERVED_PREPAID or SHIPPED or DELIVERED or RETURNED"
        to: DEPLETED
        trigger: "system, fired when unit_count - reserved_count equals 0 and every unit has shipped"
        actor: system
        preconditions:
          - "unit_count - reserved_count == 0"
        side_effects:
          - "Rejects further reservations from this block with ERR_SIM_INVENTORY_DEPLETED"

  # --- M9: CycleRecord.status (self-loop OPEN → OPEN) ---------------------
  - entity: CycleRecord
    field: cycle_status
    initial_state: OPEN
    terminal_states: [ROLLED]
    shape: cyclic
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /subscribers/{subscriber_id}/consume_data"
        actor: System
        preconditions:
          - "The subscriber's subscriber_status is ACTIVE"
          - "The subscriber's PrepaidTerm.term_status IN {ACTIVE, ACTIVE_RENEWAL}"
        side_effects:
          - "Increments the parent Subscriber.data_used_mb_cycle by the consumed megabytes"
          - "Applies deprioritization_check: sets deprioritized_this_cycle true when data_used_mb_cycle >= the plan's deprioritization_threshold_mb and the agreement's congestion_active is true"
          - "Sets the parent Subscriber.cycle_deprioritization_days to the number of distinct days on which deprioritized_this_cycle was true, including the current day when the threshold is met"

      - from: OPEN
        to: ROLLED
        trigger: "POST /subscribers/{subscriber_id}/run_cycle"
        actor: "CapacityPlanner or system"
        preconditions:
          - "cycle_status is OPEN"
        side_effects:
          - "Sets closed_at to the current logical clock and freezes cycle_data_used_mb and cycle_deprioritization_days"
          - "Writes earned_cents for this cycle by schedule_formula_provisional_vs_final (final variant) and recomputes the parent PrepaidTerm.deferred_revenue_cents by deferred_revenue_aging"
          - "Increments the parent Subscriber.cycles_rolled and resets data_used_mb_cycle = 0, deprioritized_this_cycle = false and cycle_deprioritization_days = 0"
          - "When cycle_index < the plan's term_months, opens the next CycleRecord with the next cycle_index and sets the parent Subscriber.cycle_index to it"
          - "When cycle_index == the plan's term_months, sets the parent PrepaidTerm.term_status = RENEWAL_DUE and opens a RENEWAL_PRICING SupportCase"
          - "Escalates every SupportCase for this subscriber whose sla_due_at <= closed_at, setting escalation_reason = SLA_BREACH"
          - "Closes every SupportCase for this subscriber in status RESOLVED_SELF_SERVICE or RESOLVED_AGENT"
          - "Expires every AddOn for this subscriber whose end_at <= closed_at, setting addon_status = EXPIRED"

      - from: "ROLLED"
        to: "ROLLED (no transition permitted)"
        trigger: "POST /subscribers/{subscriber_id}/run_cycle on an already rolled cycle"
        actor: "CapacityPlanner or system"
        preconditions:
          - "Never taken: a ROLLED cycle is terminal for this machine"
        side_effects:
          - "None; the endpoint rejects with ERR_CYCLE_ALREADY_ROLLED"

  # --- M10: SupportCase.status -------------------------------------------
  - entity: SupportCase
    field: case_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: branching
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /support-cases/{case_id}/assign"
        actor: SupportAgent
        preconditions:
          - "case_status is OPEN"
          - "The subscriber's support_seconds_used plus the topic's routing estimate does not exceed the subscriber's support_seconds_budget"
        side_effects:
          - "Books the topic's routing estimate into handling_seconds and increments the parent Subscriber.support_seconds_used by it"

      - from: OPEN
        to: RESOLVED_SELF_SERVICE
        trigger: "POST /support-cases/{case_id}/resolve_self_service"
        actor: Subscriber
        preconditions:
          - "case_status is OPEN"
          - "The current logical clock is at least 60 seconds after the case's created_at"
        side_effects:
          - "Increments the parent Subscriber.self_service_deflection_count by 1"
          - "Leaves handling_seconds at 0 so support_seconds_used gains nothing"

      - from: ASSIGNED
        to: RESOLVED_AGENT
        trigger: "POST /support-cases/{case_id}/resolve_agent"
        actor: SupportAgent
        preconditions:
          - "case_status is ASSIGNED or ESCALATED"
          - "The subscriber's support_seconds_used plus the reported agent seconds does not exceed the subscriber's support_seconds_budget"
        side_effects:
          - "Adds the reported agent seconds to handling_seconds and to the parent Subscriber.support_seconds_used"

      - from: ESCALATED
        to: RESOLVED_AGENT
        trigger: "POST /support-cases/{case_id}/resolve_agent"
        actor: SupportAgent
        preconditions:
          - "case_status is ESCALATED"
          - "The subscriber's support_seconds_used plus the reported agent seconds does not exceed the subscriber's support_seconds_budget"
        side_effects:
          - "Adds the reported agent seconds to handling_seconds and to the parent Subscriber.support_seconds_used"

      - from: "OPEN or ASSIGNED"
        to: ESCALATED
        trigger: "POST /support-cases/{case_id}/escalate, or system at a cycle roll whose closed_at is at or after this case's sla_due_at"
        actor: "SupportAgent or system"
        preconditions:
          - "Manual: the current logical clock is at or after sla_due_at"
          - "Auto: the cycle roll instant is at or after sla_due_at while case_status is OPEN or ASSIGNED"
        side_effects:
          - "Sets escalation_reason = SLA_BREACH on the automatic path and SELF_SERVICE_FAILED on the manual path"
          - "Increments the parent Subscriber.support_seconds_used by the topic's escalation estimate"

      - from: "RESOLVED_SELF_SERVICE or RESOLVED_AGENT"
        to: CLOSED
        trigger: "system, fired at any cycle roll for the same subscriber"
        actor: system
        preconditions:
          - "case_status is RESOLVED_SELF_SERVICE or RESOLVED_AGENT"
        side_effects:
          - "Leaves handling_seconds and self_service_deflection_count unchanged"

  # --- M11: AddOn.status --------------------------------------------------
  - entity: AddOn
    field: addon_status
    initial_state: REQUESTED
    terminal_states: [EXPIRED, CANCELLED, VOIDED]
    shape: linear
    transitions:
      - from: REQUESTED
        to: ACTIVE
        trigger: "POST /add-ons/{addon_id}/activate"
        actor: System
        preconditions:
          - "The parent Subscriber.subscriber_status is ACTIVE"
          - "The parent Subscriber's PrepaidTerm.term_status IN {ACTIVE, ACTIVE_RENEWAL}"
          - "addon_days is one of 1, 7, 30"
        side_effects:
          - "Sets start_at to the current logical clock and end_at = start_at plus addon_days calendar days"
          - "Sets addon_price_cents by roaming_rate_card"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system, fired at a cycle roll whose closed_at is at or after end_at"
        actor: system
        preconditions:
          - "The cycle roll instant is at or after end_at"
        side_effects:
          - "Sets addon_price_cents = 0 and leaves end_at unchanged"

      - from: "REQUESTED or ACTIVE"
        to: CANCELLED
        trigger: "POST /add-ons/{addon_id}/cancel"
        actor: Subscriber
        preconditions:
          - "addon_status is REQUESTED or ACTIVE"
        side_effects:
          - "Sets addon_price_cents = 0 and end_at = start_at"

      - from: ACTIVE
        to: VOIDED
        trigger: "system, fired when the parent Subscriber churns or accepts a renewal step-up"
        actor: system
        preconditions:
          - "The parent Subscriber.subscriber_status is CHURNED, or the parent PrepaidTerm transitioned RENEWAL_DUE to ACTIVE_RENEWAL"
        side_effects:
          - "Sets deprovisioned_msisdn = the parent Subscriber.accepted_msisdn"
          - "Sets addon_price_cents = 0"

# =============================================================================
# Table 2b: Concurrency Rules (§1.2.1 — true races resolved by OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: term-purchase-stale-agreement
    parent_entity: CapacityAgreement
    write_endpoint: "POST /prepaid-terms"
    occ_field: "expected_CapacityAgreement_version"
    description: |
      Creating a PrepaidTerm against a CapacityAgreement whose version has advanced since
      the client last observed it is rejected. This captures the case where another writer
      has just created a term that legitimately allocated capacity and recomputed the
      agreement's allocated_data_mb and remaining_data_mb under the purchase rules, so the
      current writer is reasoning about superseded committed and remaining volumes.
    error_id: ERR_STALE_VERSION
    http_status: 412
    note: "expected_CapacityAgreement_version is a required body field on POST /carriers/prepaid-terms only. Every other agreement-versioned endpoint accepts it optionally and performs the same check when it is present."

  - rule_id: subscriber-cancel-stale-subscriber
    parent_entity: Subscriber
    write_endpoint: "POST /subscribers/{subscriber_id}/cancel"
    occ_field: "expected_Subscriber_version"
    description: |
      Cancelling a Subscriber whose version has advanced since the client last observed it
      is rejected. Between the read and the cancel, a cycle roll legitimately advanced the
      subscriber's cycles_rolled, data_used_mb_cycle and allocation_status, so the client's
      view of the subscriber is stale and the capacity release it would perform is based on
      superseded data.
    error_id: ERR_STALE_VERSION
    http_status: 412
    note: "expected_Subscriber_version is a required body field on POST /carriers/subscribers/{subscriber_id}/cancel."

# =============================================================================
# Table 3: Calculation Rules Table (13 calculations)
# =============================================================================
calculations:
  - name: wholesale_forward_overage_cost
    trigger: "POST /capacity-agreements/{agreement_id}/resolve-purchase (forward variant) and GET /capacity-agreements/{agreement_id}/usage-summary (chronological variant)"
    algorithm: forward_looking
    formula: |
      overage_rate_data = ceil(data_rate_microcents_per_mb * OVERAGE_MULTIPLIER_NUM / OVERAGE_MULTIPLIER_DEN)
      data_volume_cost_microcents = the MARGINAL reading of wholesale_volume_tier_cost applied
                                    to committed_data_mb
      committed_volume_cost_microcents = data_volume_cost_microcents
                                       + committed_voice_minutes * voice_rate_microcents_per_min
                                       + committed_sms_messages  * sms_rate_microcents_per_msg

      FORWARD-LOOKING variant (committed obligations):
        projected_allotment_mb = sum over Plans p on this agreement with p.plan_status IN {OFFERED, ACTIVE}
                                 of p.data_allotment_mb * contributing_subscribers(p)
        projected_overage_mb   = max(0, projected_allotment_mb - committed_data_mb)
        projected_overage_cost_microcents = projected_overage_mb * overage_rate_data
        resolved_purchase_cost_microcents =
              committed_volume_cost_microcents + projected_overage_cost_microcents

      CHRONOLOGICAL variant (as incurred):
        rolled_overage_mb   = sum over CycleRecords c with c.cycle_status = ROLLED of
                              max(0, c.cycle_data_used_mb - plan_of(c).data_allotment_mb)
        as_incurred_overage_cost_microcents = rolled_overage_mb * overage_rate_data
        as_incurred_cost_microcents =
              committed_volume_cost_microcents + as_incurred_overage_cost_microcents
      contributing_subscribers(p) is defined in wholesale_allocated_data_mb.
      committed_volume_cost_microcents is identical in both variants, so the two endpoints differ
      only by projected_overage_cost_microcents versus as_incurred_overage_cost_microcents.
    input_set: |
      Both variants use only Plans with plan_status IN {OFFERED, ACTIVE}; DRAFT and RETIRED plans
      contribute nothing. The forward variant reads the catalogue only. The chronological variant
      reads CycleRecord rows whose cycle_status is ROLLED and ignores CycleRecord rows that are OPEN.
    constants:
      OVERAGE_MULTIPLIER_NUM: 115
      OVERAGE_MULTIPLIER_DEN: 100
      OVERSALE_LIMIT_NUM: 120
      OVERSALE_LIMIT_DEN: 100
      TIER1_DATA_MB: 500000
    precision: "microcents are integers; ceil at the overage-rate step only"
    variants:
      - name: forward_looking_committed
        when: "POST /capacity-agreements/{agreement_id}/resolve-purchase"
        difference: "Charges projected overage from the offered catalogue, so a plan that is OFFERED but never sold still raises the resolved cost"
      - name: chronological_as_incurred
        when: "GET /capacity-agreements/{agreement_id}/usage-summary"
        difference: "Charges only overage actually rolled through CycleRecord rows, so it is strictly less than the forward variant whenever any offered plan has unsold allotment"
    note: "Both variants share the same committed-volume term; only the overage term differs."

  - name: wholesale_allocated_data_mb
    trigger: "every capacity-allocation event: plan offer, withdraw or retire, term purchase, activation provision, activation complete, activation fail, port submit, port confirm, port reject, port cancel, subscriber churn"
    algorithm: constraint_propagation
    formula: |
      contributing_subscribers(p) = count of Subscriber rows s such that
          s.allocation_status IN {HELD, ALLOCATED}
          AND the current non-terminal PrepaidTerm of s references p
      allocated_data_mb =
          sum over Plans p on this agreement with p.plan_status IN {OFFERED, ACTIVE}
          of p.data_allotment_mb * contributing_subscribers(p)
      remaining_data_mb = committed_data_mb - allocated_data_mb
      Both fields are recomputed in one pass over the same subscriber-term set. A HELD
      subscriber counts exactly once whether the hold comes from an in-flight port
      reservation or from a term awaiting activation.
      The sellable ceiling is committed_data_mb * OVERSALE_LIMIT_NUM / OVERSALE_LIMIT_DEN; a
      purchase is admitted while allocated_data_mb would stay at or below it, so remaining_data_mb
      is permitted to go negative by up to the oversale allowance.
    input_set: "All Plans on the agreement whose plan_status is OFFERED or ACTIVE; all Subscribers holding a non-terminal PrepaidTerm on those plans"
    precision: "integer megabytes; exact"
    note: "Non-CHURNED subscribers in PENDING_PORT carry allocation_status HELD or NONE and never double-count."

  - name: prepaid_term_price
    trigger: "POST /prepaid-terms/{term_id}/purchase and POST /prepaid-terms/{term_id}/accept_step_up"
    algorithm: threshold
    formula: |
      term_price_cents = intro_price_cents    when no prior PrepaidTerm exists for this subscriber_id on this plan
      term_price_cents = renewal_price_cents  when at least one prior PrepaidTerm exists for this subscriber_id on this plan
      A prior term counts when its term_status is in {PURCHASED, AWAITING_ACTIVATION, ACTIVE, RENEWAL_DUE,
      ACTIVE_RENEWAL, GRACE, EXPIRED}; REFUNDED and VOIDED terms do not count, so a refunded first
      purchase still leaves the subscriber entitled to the intro price.
      When several prior terms exist, "prior" is decided by ascending created_at.
    input_set: "PrepaidTerms for this subscriber on this plan whose term_status is not QUOTED, REFUNDED or VOIDED"
    constants:
      FIRST_TERM_ORDINAL: 1
    precision: "integer cents; exact"

  - name: schedule_formula_provisional_vs_final
    trigger: "POST /prepaid-terms/{term_id}/purchase writes the provisional value; POST /subscribers/{subscriber_id}/run_cycle writes the final value for the cycle it closes"
    algorithm: aggregation
    formula: |
      PROVISIONAL variant, written at purchase before any usage exists:
        provisional_earned_cents(k)  = ceil(term_price_cents * k / term_months)
        provisional_deferred_cents(k)= term_price_cents - provisional_earned_cents(k)
        at purchase: deferred_revenue_cents = provisional_deferred_cents(1)
                     earned_revenue_cents   = provisional_earned_cents(1)

      FINAL variant, written at each cycle roll:
        formula_floor_cents(k) = ceil(term_price_cents / term_months)
        quality_cents(k)       = ceil(term_price_cents * QUALITY_SHARE_NUM / QUALITY_SHARE_DEN
                                      * c.cycle_deprioritization_days / DAYS_PER_CYCLE)
        final_earned_cents(k)  = formula_floor_cents(k) + quality_cents(k)
        c.earned_cents         = final_earned_cents(k)
        running_earned         = sum of c.earned_cents over CycleRecords of this term with cycle_status ROLLED
        earned_revenue_cents   = min(term_price_cents, running_earned)
        deferred_revenue_cents = term_price_cents - earned_revenue_cents
      Order is pinned: per-cycle earned cents are computed and frozen as integers on the CycleRecord,
      then the running sum of those integers is subtracted from term_price_cents. The scaffold never
      sums unrounded values and never rounds after summing.
    input_set: "CycleRecords for this term in ascending cycle_index; only rows with cycle_status ROLLED contribute to running_earned"
    constants:
      QUALITY_SHARE_NUM: 3
      QUALITY_SHARE_DEN: 20
      DAYS_PER_CYCLE: 30
    precision: "integer cents; ceil at each per-cycle step, then integer sum"
    variants:
      - name: provisional_schedule
        when: "read from PrepaidTerm.immediately after POST /prepaid-terms/{term_id}/purchase"
        difference: "Ignores deprioritization entirely, so a subscriber deprioritized for the whole of cycle 1 has final_earned_cents(1) strictly greater than provisional_earned_cents(1)"
      - name: final_blended
        when: "read from PrepaidTerm after at least one POST /subscribers/{subscriber_id}/run_cycle"
        difference: "Adds the deprioritization quality term per cycle, so two terms with identical term_price_cents and term_months diverge once their cycle_deprioritization_days differ"

  - name: early_churn_revenue_recognition
    trigger: "POST /subscribers/{subscriber_id}/cancel and POST /prepaid-terms/{term_id}/cancel on a term whose starts_at is set"
    algorithm: aggregation
    formula: |
      cycles_remaining   = term_months - count of CycleRecords for this term with cycle_status ROLLED
      remaining_days     = cycles_remaining * DAYS_PER_CYCLE
      breakage_days      = min(remaining_days, BREAKAGE_CAP_DAYS)
      breakage_cents_recognized = floor(term_price_cents * breakage_days / (term_months * DAYS_PER_CYCLE))
      earned_revenue_cents   = min(term_price_cents, earned_revenue_cents + breakage_cents_recognized)
      deferred_revenue_cents = term_price_cents - earned_revenue_cents
      The write-back is one-way: deferred_revenue_cents only ever decreases here, never increases.
    input_set: "CycleRecords for this term with cycle_status ROLLED; the currently OPEN cycle does not count as remaining or as elapsed"
    constants:
      DAYS_PER_CYCLE: 30
      BREAKAGE_CAP_DAYS: 30
    precision: "integer cents and integer days; floor at the breakage step"
    note: "Because breakage_days is capped at 30, a 12-month term churned in its first cycle recognizes at most one extra cycle of revenue."

  - name: deprioritization_check
    trigger: "POST /subscribers/{subscriber_id}/consume_data and POST /subscribers/{subscriber_id}/run_cycle"
    algorithm: threshold
    formula: |
      After each consume_data call on an OPEN cycle:
        deprioritized_this_cycle = (data_used_mb_cycle >= deprioritization_threshold_mb)
                                   AND agreement.congestion_active
      The comparison is inclusive: a subscriber that lands exactly on deprioritization_threshold_mb
      is deprioritized; a subscriber one megabyte below it is not.
      Once true, deprioritized_this_cycle stays true for the remainder of the cycle.
      cycle_deprioritization_days is incremented at most once per distinct calendar day, and
      freezes onto the CycleRecord at roll via cycle_deprioritization_days.
      A cycle that closes with deprioritized_this_cycle still true and cycle_data_used_mb exactly
      equal to the threshold still records one deprioritization day.
    input_set: "The subscriber's currently OPEN CycleRecord and the agreement's congestion_active flag"
    constants:
      DEPRIORITIZATION_GRACE_MB: 0
    precision: "integer megabytes; exact"

  - name: congestion_index
    trigger: "every capacity-allocation event listed in wholesale_allocated_data_mb, plus POST /carriers/subscribers/{id}/consume_data and POST /carriers/subscribers/{id}/run_cycle"
    algorithm: aggregation
    formula: |
      congestion_index  = max(0, round_half_up(100 * allocated_data_mb / committed_data_mb))
      congestion_active = congestion_index >= CONGESTION_TRIGGER_INDEX
      The index states how full the bought pipe already is with sold allotment, so it reads above 100
      whenever the catalogue has been oversold past the contracted volume. congestion_active is
      derived, never client-supplied, and deprioritization_check consults the flag rather than the
      index, so a test can pin the flag without recomputing the index.
    input_set: "allocated_data_mb as defined in wholesale_allocated_data_mb; an agreement with no contributing subscribers reads 0"

  - name: breakage_revenue
    trigger: "system whenever a PrepaidTerm reaches EXPIRED without a successor term"
    algorithm: aggregation
    formula: |
      total_breakage_cents = sum over PrepaidTerms t on this agreement with t.term_status = EXPIRED
                             of t.breakage_cents_recognized
      total_term_price_cents = sum over the same terms of t.term_price_cents
      breakage_rate_ppm = round_half_up(1000000 * total_breakage_cents / total_term_price_cents)
                          when total_term_price_cents > 0, else 0
      A term whose breakage_cents_recognized is 0 still sits in the denominator.
    input_set: "All PrepaidTerms on the agreement in status EXPIRED at the instant of evaluation; REFUNDED, VOIDED and non-terminal terms are excluded from numerator and denominator"
    constants:
      BREAKAGE_RATE_SCALE: 1000000
    precision: "integer cents for the totals; breakage_rate_ppm is parts per million, round_half_up"

  - name: deferred_revenue_aging
    trigger: "each POST /subscribers/{subscriber_id}/run_cycle, and the term's final cycle"
    algorithm: chronological
    formula: |
      Process this term's CycleRecords in ascending cycle_index, carrying an integer accumulator:
        carry(0)   = 0
        carry(k)   = c_k.earned_cents + carry(k-1)
        deferred(k)= term_price_cents - carry(k)
      Rows are ordered by ascending cycle_index; never by created_at and never by id, because a
      CycleRecord row is created at term activation for every cycle of the term at once and their
      created_at values are therefore meaningless for ordering.
      After the final cycle (k == term_months), deferred(term_months) is 0.
    input_set: "CycleRecords for the term in ascending cycle_index, regardless of cycle_status"
    precision: "integer cents; running accumulator over already-frozen integer per-cycle values"
    note: "Replaying the same cycles in descending order produces a different deferred(k) sequence, so the order is pinned."

  - name: wholesale_volume_tier_cost
    trigger: "POST /capacity-agreements/{agreement_id}/resolve-purchase (marginal variant) and GET /capacity-agreements/{agreement_id}/usage-summary (blended variant)"
    algorithm: tiered_pricing
    formula: |
      tier2_rate = ceil(data_rate_microcents_per_mb * TIER2_MULT_NUM / TIER2_MULT_DEN)

      MARGINAL variant (the discounted rate applies only to volume ABOVE the breakpoint):
        marginal_volume_cost_microcents =
            min(committed_data_mb, TIER1_DATA_MB) * data_rate_microcents_per_mb
          + max(0, committed_data_mb - TIER1_DATA_MB) * tier2_rate

      RETROACTIVE variant (once the breakpoint is crossed the discounted rate applies to the
      WHOLE committed volume, the classic retroactive volume-discount reading):
        retroactive_rate = tier2_rate                                   when committed_data_mb > TIER1_DATA_MB
                         = data_rate_microcents_per_mb                   otherwise
        retroactive_volume_cost_microcents = committed_data_mb * retroactive_rate
      Rounding order is pinned: the marginal branch ceilings the discounted unit rate and charges
      it only above the breakpoint; the retroactive branch applies the same ceilinged rate to every
      unit, so it is strictly cheaper than the marginal branch once the breakpoint is crossed and
      identical below it.
    input_set: "The agreement's committed_data_mb and data_rate_microcents_per_mb; Plans do not enter this calculation"
    constants:
      TIER1_DATA_MB: 500000
      TIER2_MULT_NUM: 92
      TIER2_MULT_DEN: 100
    precision: "microcents are integers; ceil on the marginal tier rate, round_half_up on the blended rate"
    variants:
      - name: marginal_tiered
        when: "POST /capacity-agreements/{agreement_id}/resolve-purchase"
        difference: "Discounts only the volume above TIER1_DATA_MB, so it is strictly cheaper than the blended variant whenever committed_data_mb > TIER1_DATA_MB"
      - name: retroactive_blended
        when: "GET /capacity-agreements/{agreement_id}/usage-summary"
        difference: "Applies the discounted rate to every megabyte once the breakpoint is crossed, so it is lower than the marginal variant by (min(committed_data_mb, TIER1_DATA_MB) * (data_rate_microcents_per_mb - tier2_rate)) and identical to it below the breakpoint"

  - name: overage_threshold_split
    trigger: "POST /subscribers/{subscriber_id}/consume_data and POST /subscribers/{subscriber_id}/run_cycle"
    algorithm: threshold
    formula: |
      For a subscriber whose plan has data_allotment_mb = A and whose cycle usage is U:
        in_allotment_mb = min(U, A)
        overage_mb      = max(0, U - A)
      The allotment boundary is inclusive: U == A yields overage_mb = 0 and U == A + 1 yields
      overage_mb = 1. A prepaid subscriber is never billed individually for overage; the value is
      recorded so the chronological variant of wholesale_forward_overage_cost can sum it.
    input_set: "The subscriber's current cycle usage and the plan's data_allotment_mb"
    precision: "integer megabytes; exact"

  - name: roaming_rate_card
    trigger: "POST /add-ons/{addon_id}/activate"
    algorithm: tiered_pricing
    formula: |
      base_day_rate_cents = round_half_up(BASE_ROAMING_30D_CENTS / 30)       # 30 for the standard card
      tier 30 days: addon_price_cents = BASE_ROAMING_30D_CENTS
      tier 7 days:  addon_price_cents = ceil(base_day_rate_cents * 7 * SHORT_TERM_MULT_NUM / SHORT_TERM_MULT_DEN)
      tier 1 day:   addon_price_cents = ceil(base_day_rate_cents * 1 * SHORT_TERM_MULT_NUM / SHORT_TERM_MULT_DEN)
      addon_type INTERNATIONAL_LD ignores the tier ladder and uses INTL_LD_FLAT_CENTS.
      The tier ladder is evaluated in the order 30 day, then 7 day, then 1 day; the first matching
      tier wins and no ladder is applied twice.
    input_set: "addon_days and addon_type from the AddOn row"
    constants:
      BASE_ROAMING_30D_CENTS: 900
      SHORT_TERM_MULT_NUM: 13
      SHORT_TERM_MULT_DEN: 10
      INTL_LD_FLAT_CENTS: 500
    precision: "integer cents; round_half_up on the base day rate, ceil on every short-term tier"

  - name: support_outsourcing_budget
    trigger: "POST /support-cases/{case_id}/assign, POST /support-cases/{case_id}/resolve_agent, POST /support-cases/{case_id}/escalate, POST /support-cases/{case_id}/resolve_self_service and POST /subscribers/{subscriber_id}/support_top_ups"
    algorithm: aggregation
    formula: |
      support_seconds_used = sum of handling_seconds over every SupportCase whose subscriber_id
                             belongs to this subscriber, including cases already CLOSED
      self_service_deflection_count = count of SupportCases for this subscriber in status
                             RESOLVED_SELF_SERVICE or CLOSED whose handling_seconds == 0 and
                             whose escalation_reason is null
      budget_remaining = support_seconds_budget - support_seconds_used
      support_seconds_budget starts at DEFAULT_SUPPORT_BUDGET_SECONDS and rises by the granted
      seconds of each POST /subscribers/{subscriber_id}/support_top_ups call.
    input_set: "SupportCases for this subscriber; cases in OPEN or ASSIGNED with no booked seconds contribute 0 to used"
    constants:
      DEFAULT_SUPPORT_BUDGET_SECONDS: 600
    precision: "integer seconds; exact"

  - name: support_case_topic_window
    trigger: "POST /carriers/support-cases and every support-case transition"
    algorithm: threshold
    formula: |
      sla_due_at          = created_at + SLA_HOURS[topic_code]
      routing_seconds     = ROUTING_SECONDS[topic_code]        booked by POST /carriers/support-cases/{id}/assign
      escalation_seconds  = ESCALATION_SECONDS[topic_code]     booked by POST /carriers/support-cases/{id}/escalate
      handling_seconds of a case is the running sum of every booking ever made against it, so a case
      that is assigned, escalated and then agent-resolved carries routing + escalation + agent
      seconds. support_seconds_used is the running sum over the subscriber's cases.
    input_set: "One row per topic_code; the wait is evaluated against the logical clock, never wall-clock time"
    constants:
      SLA_HOURS:
        PORT_STATUS: 4
        DEPRIORITIZATION_COMPLAINT: 8
        SIM_REPLACEMENT: 12
        ROAMING_SETUP: 24
        RENEWAL_PRICING: 24
        REFUND_REQUEST: 48
      ROUTING_SECONDS:
        PORT_STATUS: 120
        DEPRIORITIZATION_COMPLAINT: 240
        SIM_REPLACEMENT: 150
        ROAMING_SETUP: 180
        RENEWAL_PRICING: 180
        REFUND_REQUEST: 300
      ESCALATION_SECONDS: 60
    precision: "integer seconds and whole hours; exact"

  - name: settlement_clearing
    trigger: "every capacity-allocation event on a subscriber: activation provision, activation complete, activation fail, port submit, port confirm, port reject, port cancel, term purchase, term refund, term void, subscriber churn"
    algorithm: aggregation
    formula: |
      For every allocation event, both fields are RECOMPUTED from the same term set:
        allocated_data_mb = wholesale_allocated_data_mb(agreement)
        remaining_data_mb = committed_data_mb - allocated_data_mb
      Invariant, checked after every event while agreement_status IN {ACTIVE, SUSPENDED}:
        allocated_data_mb + remaining_data_mb == committed_data_mb
      A term purchase followed by a refund of that same term leaves allocated_data_mb at its exact
      pre-purchase value, because nothing is incremented or decremented in place; both sides are
      derived afresh from the term set.
    input_set: "All Plans and Subscribers contributing to the agreement, as defined in wholesale_allocated_data_mb"
    precision: "integer megabytes; exact"
    note: "The named conserved quantity is the agreement's megabyte balance: allocated_data_mb plus remaining_data_mb equals committed_data_mb at every rest point."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role names a role in §1.7; an entity_backed role's X-User-ID must be the id of an existing instance of that entity"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "For a Subscriber acting on its own rows, X-User-ID equals that row's subscriber_id; for a RetailPartner acting on its own inventory, X-User-ID equals sim_inventory.retail_partner_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /activations, POST /activations/{activation_id}/complete, POST /activations/{activation_id}/submit-port, POST /activations/{activation_id}/cancel-port, POST /prepaid-terms/{term_id}/purchase, POST /prepaid-terms/{term_id}/accept_step_up, POST /prepaid-terms/{term_id}/cancel, POST /add-ons, POST /add-ons/{addon_id}/cancel, POST /sim-inventories, POST /support-cases/{case_id}/resolve_self_service, POST /subscribers/{subscriber_id}/cancel, POST /subscribers/{subscriber_id}/keep_requested_msisdn"

  - priority: 4
    category: existence
    check: "Every path id exists; ids are resolved left to right and the first missing one decides the error_id"
    error_id: "ERR_AGREEMENT_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_SUBSCRIBER_NOT_FOUND / ERR_TERM_NOT_FOUND / ERR_ACTIVATION_NOT_FOUND / ERR_PARTNER_NOT_FOUND / ERR_SIM_INVENTORY_NOT_FOUND / ERR_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: existence
    check: "Body foreign keys resolve, checked in the order the fields appear in the endpoint's input list"
    error_id: "ERR_AGREEMENT_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_SUBSCRIBER_NOT_FOUND / ERR_TERM_NOT_FOUND / ERR_PARTNER_NOT_FOUND / ERR_SIM_INVENTORY_NOT_FOUND"
    http_status: 404
    applies_to: "POST /plans, POST /prepaid-terms, POST /activations, POST /sim-inventories, POST /support-cases"

  - priority: 6
    category: state
    check: "The target row's lifecycle state permits the requested transition; the precondition is stated on the matching transition in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 7
    category: state
    check: "The target row is not already terminal for this action: a second cancel on REFUNDED or VOIDED terms, a second complete on COMPLETED activations, a second reject on REJECTED ports, a second roll on ROLLED cycles"
    error_id: "ERR_TERM_ALREADY_TERMINAL / ERR_ACTIVATION_ALREADY_TERMINAL / ERR_PORT_ALREADY_TERMINAL / ERR_CYCLE_ALREADY_ROLLED"
    http_status: 409
    applies_to: "POST /prepaid-terms/{term_id}/cancel, POST /activations/{activation_id}/complete, POST /activations/{activation_id}/reject-port, POST /activations/{activation_id}/cancel-port, POST /subscribers/{subscriber_id}/run_cycle"

  - priority: 8
    category: business_temporal
    check: "The agreement is not SUSPENDED for any action that would allocate capacity against it"
    error_id: ERR_AGREEMENT_SUSPENDED
    http_status: 409
    applies_to: "POST /prepaid-terms, POST /prepaid-terms/{term_id}/purchase, POST /prepaid-terms/{term_id}/accept_step_up"

  - priority: 9
    category: business_temporal
    check: "The agreement is not CLOSED and the plan is not RETIRED for any action that sells or extends a term"
    error_id: "ERR_AGREEMENT_CLOSED / ERR_PLAN_RETIRED"
    http_status: 409
    applies_to: "POST /prepaid-terms, POST /prepaid-terms/{term_id}/purchase, POST /prepaid-terms/{term_id}/accept_step_up, POST /plans/{plan_id}/offer"

  - priority: 10
    category: business_constraint
    check: "The reservation is admitted only while allocated_data_mb + the plan's data_allotment_mb stays at or below committed_data_mb * OVERSALE_LIMIT_NUM / OVERSALE_LIMIT_DEN (120%); at the boundary the purchase succeeds and one megabyte past it fails"
    error_id: ERR_INSUFFICIENT_AGREEMENT_CAPACITY
    http_status: 409
    applies_to: "POST /prepaid-terms, POST /prepaid-terms/{term_id}/purchase, POST /prepaid-terms/{term_id}/accept_step_up, POST /activations"

  - priority: 11
    category: business_constraint
    check: "The subscriber holds no other PrepaidTerm in a non-terminal status; one number carries one live term"
    error_id: ERR_DUPLICATE_ACTIVE_TERM
    http_status: 409
    applies_to: "POST /prepaid-terms, POST /prepaid-terms/{term_id}/purchase, POST /prepaid-terms/{term_id}/accept_step_up"

  - priority: 12
    category: business_referential
    check: "For RETAIL_PARTNER activations the referenced partner is ACTIVE and lists the subscriber's state_code in partner_state_codes"
    error_id: "ERR_PARTNER_NOT_AUTHORIZED_FOR_STATE / ERR_PARTNER_SUSPENDED"
    http_status: 422
    applies_to: "POST /activations, POST /activations/{activation_id}/provision, POST /sim-inventories"

  - priority: 13
    category: business_constraint
    check: "An activatable SIM media block exists for the subscriber's state_code with unit_count - reserved_count >= 1; SIM media is state-scoped and never crosses state lines"
    error_id: ERR_NO_ACTIVATABLE_SIM_MEDIA
    http_status: 422
    applies_to: "POST /activations, POST /activations/{activation_id}/provision"

  - priority: 14
    category: business_constraint
    check: "Reservations are counted against a block as an aggregate: the units already reserved by activations whose reservation window is still open plus the units this request would reserve must stay at or below unit_count; equality is admitted and one unit past it fails"
    error_id: ERR_SIM_INVENTORY_DEPLETED
    http_status: 409
    applies_to: "POST /sim-inventories, POST /activations/{activation_id}/provision"

  - priority: 15
    category: business_constraint
    check: "The subscriber's subscriber_status is ACTIVE and its term_status is ACTIVE or ACTIVE_RENEWAL for a consume_data call or a new add-on"
    error_id: "ERR_SUBSCRIBER_NOT_ACTIVE / ERR_TERM_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /add-ons, POST /add-ons/{addon_id}/activate, POST /subscribers/{subscriber_id}/consume_data"

  - priority: 16
    category: business_referential
    check: "A port-in request's porting_msisdn plus losing_carrier plus account_number_last4 is not already held by another Activation with port_status SUBMITTED"
    error_id: ERR_MSISDN_ALREADY_IN_FLIGHT
    http_status: 409
    applies_to: "POST /activations/{activation_id}/submit-port"

  - priority: 17
    category: business_temporal
    check: "A port submit names the subscriber's own msisdn, so the number being ported and the number on the subscriber row agree"
    error_id: ERR_MSISDN_MISMATCH
    http_status: 422
    applies_to: "POST /activations/{activation_id}/submit-port"

  - priority: 18
    category: business_constraint
    check: "deprioritization_threshold_mb is derived from data_allotment_mb and never accepted from a client; when supplied in the body it is ignored and the derived value is stored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /plans, PUT /plans/{plan_id}"

  - priority: 19
    category: business_constraint
    check: "term_months is one of 3, 6, 12 and renewal_price_cents is strictly greater than intro_price_cents"
    error_id: ERR_INVALID_PLAN_TERM
    http_status: 422
    applies_to: "POST /plans, PUT /plans/{plan_id}, POST /plans/{plan_id}/offer"

  - priority: 20
    category: business_constraint
    check: "addon_days is one of 1, 7, 30, and per_day_allotment_mb is 0 for INTERNATIONAL_LD and at least 1 for ROAMING"
    error_id: ERR_INVALID_ADDON_WINDOW
    http_status: 422
    applies_to: "POST /add-ons, POST /add-ons/{addon_id}/activate"

  - priority: 21
    category: business_temporal
    check: "A self-service resolution is accepted only once the case is at least 60 seconds old on the logical clock"
    error_id: ERR_SELF_SERVICE_TOO_EARLY
    http_status: 409
    applies_to: "POST /support-cases/{case_id}/resolve_self_service"

  - priority: 22
    category: business_fiscal
    check: "The seconds booked by an assignment, an escalation or an agent resolution keep the subscriber's support_seconds_used within support_seconds_budget"
    error_id: ERR_SUPPORT_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /support-cases/{case_id}/assign, POST /support-cases/{case_id}/resolve_agent, POST /support-cases/{case_id}/escalate"

  - priority: 23
    category: business_temporal
    check: "A manual escalation is accepted only at or after the case's sla_due_at"
    error_id: ERR_SLA_NOT_DUE
    http_status: 409
    applies_to: "POST /support-cases/{case_id}/escalate"

  - priority: 24
    category: business_constraint
    check: "retail_partner_id is present exactly when activation_channel is RETAIL_PARTNER, and shipment_channel agrees with whether the block has a partner"
    error_id: ERR_RETAIL_CHANNEL_MISMATCH
    http_status: 422
    applies_to: "POST /activations, POST /sim-inventories"

  - priority: 25
    category: business_safety
    check: "A subscriber cannot churn while its Activation has port_status SUBMITTED; the in-flight port must be cancelled or rejected first"
    error_id: ERR_PORT_IN_FLIGHT
    http_status: 409
    applies_to: "POST /subscribers/{subscriber_id}/cancel, POST /prepaid-terms/{term_id}/cancel"

  - priority: 26
    category: business_fiscal
    check: "A term is refundable only while starts_at is null; once the first cycle has opened the term leaves the book only through breakage recognition"
    error_id: ERR_TERM_ALREADY_STARTED
    http_status: 409
    applies_to: "POST /prepaid-terms/{term_id}/cancel"

  - priority: 27
    category: business_temporal
    check: "A roaming add-on being activated may not overlap an add-on already ACTIVE for the same subscriber; windows are half-open [start_at, end_at), so an add-on starting exactly at an existing window's end_at is admitted and one second earlier is rejected"
    error_id: ERR_ADDON_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /add-ons/{addon_id}/activate"

# =============================================================================
# Table 5: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 6: API Endpoint Table
# =============================================================================
endpoints:
  # --- CapacityAgreement ---
  - method: POST
    path: "/carriers/capacity-agreements"
    description: "Create a wholesale capacity agreement with a host network"
    roles: [CapacityPlanner]
    code: 201
    input: [host_network_name, state_code, data_rate_microcents_per_mb, voice_rate_microcents_per_min, sms_rate_microcents_per_msg, committed_data_mb, committed_voice_minutes, committed_sms_messages, "congestion_active?"]
    output: CapacityAgreement
    side_effects:
      - "agreement_status=DRAFT, congestion_active defaults to false"
      - "allocated_data_mb=0 and remaining_data_mb=committed_data_mb (wholesale_allocated_data_mb)"
      - "congestion_index=0 (congestion_index)"

  - method: GET
    path: "/carriers/capacity-agreements/{id}"
    description: "Read one capacity agreement with its derived allocation and congestion fields"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin, Subscriber, RetailPartner]
    code: 200
    input: []
    output: CapacityAgreement
    side_effects: []

  - method: POST
    path: "/carriers/capacity-agreements/{id}/activate"
    description: "Move an agreement from DRAFT to ACTIVE and open its capacity for sale"
    roles: [CapacityPlanner]
    code: 200
    input: ["expected_CapacityAgreement_version?"]
    output: CapacityAgreement
    side_effects:
      - "agreement_status=ACTIVE (M1 DRAFT_to_ACTIVE)"
      - "Recomputes allocated_data_mb and remaining_data_mb (wholesale_allocated_data_mb)"
      - "Recomputes congestion_index (congestion_index)"
      - "Increments CapacityAgreement.version by 1"

  - method: POST
    path: "/carriers/capacity-agreements/{id}/suspend"
    description: "Suspend an agreement so no further capacity can be sold against it"
    roles: [CapacityPlanner]
    code: 200
    input: ["expected_CapacityAgreement_version?"]
    output: CapacityAgreement
    side_effects:
      - "agreement_status=SUSPENDED (M1 ACTIVE_to_SUSPENDED)"
      - "Pins remaining_data_mb to 0"
      - "Increments CapacityAgreement.version by 1"

  - method: POST
    path: "/carriers/capacity-agreements/{id}/reactivate"
    description: "Reactivate a suspended agreement once over-allocation is resolved"
    roles: [CapacityPlanner]
    code: 200
    input: ["expected_CapacityAgreement_version?"]
    output: CapacityAgreement
    side_effects:
      - "agreement_status=ACTIVE (M1 SUSPENDED_to_ACTIVE)"
      - "Recomputes allocated_data_mb, remaining_data_mb and congestion_index"
      - "Increments CapacityAgreement.version by 1"

  - method: POST
    path: "/carriers/capacity-agreements/{id}/close"
    description: "Close an agreement permanently and retire every plan on it"
    roles: [CapacityPlanner]
    code: 200
    input: ["expected_CapacityAgreement_version?"]
    output: CapacityAgreement
    side_effects:
      - "agreement_status=CLOSED (M1 ACTIVE_to_CLOSED or SUSPENDED_to_CLOSED)"
      - "Sets plan_status=RETIRED on every Plan of this agreement (M2 to_RETIRED)"
      - "Increments CapacityAgreement.version by 1"

  - method: POST
    path: "/carriers/capacity-agreements/{id}/resolve-purchase"
    description: "Resolve the forward-looking purchase commitment, storing the resolved cost on the agreement"
    roles: [CapacityPlanner]
    code: 200
    input: ["expected_CapacityAgreement_version?"]
    output: "{ resolved_purchase_cost_microcents: integer, projected_overage_data_mb: integer, projected_overage_cost_microcents: integer, committed_volume_cost_microcents: integer, monthly_committed_cost_microcents: integer, data_volume_cost_microcents: integer, marginal_tier_rate_microcents: integer }"
    side_effects:
      - "Sets resolved_purchase_cost_microcents, projected_overage_cost_microcents, committed_volume_cost_microcents and data_volume_cost_microcents by wholesale_forward_overage_cost (forward variant) and wholesale_volume_tier_cost (marginal variant); data_volume_cost_microcents is the marginal tiered data leg alone"
      - "Increments CapacityAgreement.version by 1"

  - method: GET
    path: "/carriers/capacity-agreements/{id}/usage-summary"
    description: "Read the as-incurred cost, blended tier cost, allocation and breakage rate for an agreement"
    roles: [CapacityPlanner, SupportAgent, PlatformAdmin]
    code: 200
    input: []
    output: "{ as_incurred_cost_microcents: integer, as_incurred_overage_cost_microcents: integer, committed_volume_cost_microcents: integer, data_volume_cost_microcents: integer, retroactive_volume_cost_microcents: integer, allocated_data_mb: integer, remaining_data_mb: integer, breakage_rate_ppm: integer, congestion_index: integer, congestion_active: boolean }"
    side_effects: []

  # --- Plan ---
  - method: POST
    path: "/carriers/plans"
    description: "Create a prepaid plan on an agreement"
    roles: [CapacityPlanner]
    code: 201
    input: [agreement_id, plan_code, term_months, intro_price_cents, renewal_price_cents, data_allotment_mb, voice_allotment_min, sms_allotment_msg]
    output: Plan
    side_effects:
      - "plan_status=DRAFT"
      - "Recomputes the parent agreement's allocated_data_mb and remaining_data_mb (wholesale_allocated_data_mb)"

  - method: GET
    path: "/carriers/plans/{id}"
    description: "Read one plan, including the derived deprioritization threshold"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin, Subscriber, RetailPartner]
    code: 200
    input: []
    output: Plan
    side_effects: []

  - method: GET
    path: "/carriers/plans"
    description: "List plans, filterable by the agreement they belong to"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin, Subscriber, RetailPartner]
    code: 200
    input: [agreement_id, "plan_status?", "limit?", "offset?"]
    output: "Plan[]"
    side_effects: []

  - method: POST
    path: "/carriers/plans/{id}/offer"
    description: "Offer a draft plan for sale, deriving its deprioritization threshold"
    roles: [CapacityPlanner]
    code: 200
    input: ["expected_CapacityAgreement_version?"]
    output: Plan
    side_effects:
      - "plan_status=OFFERED (M2 DRAFT_to_OFFERED)"
      - "Sets deprioritization_threshold_mb = data_allotment_mb"
      - "Recomputes the parent agreement's allocated_data_mb and remaining_data_mb"
      - "Increments Plan.version by 1 and CapacityAgreement.version by 1"

  - method: POST
    path: "/carriers/plans/{id}/withdraw"
    description: "Withdraw an offered plan back to draft"
    roles: [CapacityPlanner]
    code: 200
    input: ["expected_CapacityAgreement_version?"]
    output: Plan
    side_effects:
      - "plan_status=DRAFT (M2 OFFERED_to_DRAFT)"
      - "Recomputes the parent agreement's allocated_data_mb and remaining_data_mb"
      - "Increments Plan.version by 1 and CapacityAgreement.version by 1"

  # --- Subscriber ---
  - method: POST
    path: "/carriers/subscribers"
    description: "Create a subscriber awaiting activation, on a number they intend to port in"
    roles: [CapacityPlanner, SupportAgent]
    code: 201
    input: [msisdn, full_name, state_code]
    output: Subscriber
    side_effects:
      - "subscriber_status=PENDING_PORT, allocation_status=NONE"
      - "cycle_index=0, cycles_rolled=0, data_used_mb_cycle=0, deprioritized_this_cycle=false"
      - "support_seconds_budget=600 and support_seconds_used=0 (support_outsourcing_budget)"

  - method: GET
    path: "/carriers/subscribers/{id}"
    description: "Read one subscriber with usage, allocation and support counters"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin, Subscriber, RetailPartner]
    code: 200
    input: []
    output: Subscriber
    side_effects: []

  - method: GET
    path: "/carriers/subscribers"
    description: "List subscribers, filterable by state and status, with pagination"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin]
    code: 200
    input: [state_code, "subscriber_status?", "limit?", "offset?"]
    output: "Subscriber[]"
    side_effects: []

  - method: POST
    path: "/carriers/subscribers/{id}/cancel"
    description: "Churn a subscriber, recognising breakage and returning capacity to the agreement"
    roles: [Subscriber]
    code: 200
    input: [expected_Subscriber_version]
    output: Subscriber
    side_effects:
      - "subscriber_status=CHURNED (M3 ACTIVE_to_CHURNED or SUSPENDED_to_CHURNED)"
      - "Sets the subscriber's PrepaidTerm.term_status=EXPIRED and writes breakage_days, breakage_cents_recognized, earned_revenue_cents and deferred_revenue_cents (early_churn_revenue_recognition)"
      - "Sets every AddOn in {REQUESTED, ACTIVE} to VOIDED with deprovisioned_msisdn (M11 ACTIVE_to_VOIDED)"
      - "Closes every SupportCase in {OPEN, ASSIGNED, ESCALATED} as CLOSED (M10 to_CLOSED)"
      - "Recomputes Plan.plan_status (M2 ACTIVE_to_OFFERED when the plan empties)"
      - "Recomputes the agreement's allocated_data_mb and remaining_data_mb (settlement_clearing)"
      - "Increments Subscriber.version by 1"

  - method: POST
    path: "/carriers/subscribers/{id}/suspend"
    description: "Suspend an active subscriber, keeping the prepaid term's capacity committed"
    roles: [SupportAgent]
    code: 200
    input: ["expected_Subscriber_version?"]
    output: Subscriber
    side_effects:
      - "subscriber_status=SUSPENDED (M3 ACTIVE_to_SUSPENDED)"
      - "Leaves the agreement's allocated_data_mb unchanged, because the term is still committed"
      - "Increments Subscriber.version by 1"

  - method: POST
    path: "/carriers/subscribers/{id}/resume"
    description: "Return a suspended subscriber to active service"
    roles: [SupportAgent]
    code: 200
    input: ["expected_Subscriber_version?"]
    output: Subscriber
    side_effects:
      - "subscriber_status=ACTIVE (M3 SUSPENDED_to_ACTIVE)"
      - "Recomputes congestion_index (congestion_index)"
      - "Increments Subscriber.version by 1"

  - method: POST
    path: "/carriers/subscribers/{id}/consume_data"
    description: "Record high-speed data consumed in the subscriber's open cycle"
    roles: [CapacityPlanner]
    code: 200
    input: [data_mb]
    output: Subscriber
    side_effects:
      - "Increments data_used_mb_cycle (M9 OPEN_to_OPEN)"
      - "Applies deprioritization_check when the agreement's congestion_active is true"
      - "Records overage_mb for the agreement's chronological overage (overage_threshold_split)"
      - "Increments Subscriber.version by 1"

  - method: POST
    path: "/carriers/subscribers/{id}/run_cycle"
    description: "Roll the subscriber's open cycle closed, ageing revenue and firing the cycle's cascades"
    roles: [CapacityPlanner]
    code: 200
    input: []
    output: Subscriber
    side_effects:
      - "M9 OPEN_to_ROLLED on the open CycleRecord: freezes cycle_data_used_mb and cycle_deprioritization_days"
      - "Writes CycleRecord.earned_cents and recomputes PrepaidTerm.deferred_revenue_cents (schedule_formula_provisional_vs_final final variant, deferred_revenue_aging)"
      - "Increments cycles_rolled and resets data_used_mb_cycle, deprioritized_this_cycle and cycle_deprioritization_days"
      - "Opens the next cycle, or sets the term to RENEWAL_DUE and opens a RENEWAL_PRICING SupportCase on the final cycle (M4 ACTIVE_to_RENEWAL_DUE)"
      - "Escalates SupportCases whose sla_due_at <= the roll instant (M10 to_ESCALATED)"
      - "Closes SupportCases in {RESOLVED_SELF_SERVICE, RESOLVED_AGENT} (M10 to_CLOSED)"
      - "Expires AddOns whose end_at <= the roll instant (M11 ACTIVE_to_EXPIRED)"
      - "Churns a subscriber still in GRACE (M3 GRACE_to_CHURNED)"
      - "Delivers a SimInventory block whose shipment_sla_days window has elapsed (M8 SHIPPED_to_DELIVERED)"
      - "Increments Subscriber.version by 1"

  - method: POST
    path: "/carriers/subscribers/{id}/support_top_ups"
    description: "Raise the subscriber's outsourced support budget in agent seconds"
    roles: [SupportAgent]
    code: 200
    input: [granted_seconds]
    output: Subscriber
    side_effects:
      - "support_seconds_budget += granted_seconds (support_outsourcing_budget)"
      - "Increments Subscriber.version by 1"

  # --- PrepaidTerm ---
  - method: POST
    path: "/carriers/prepaid-terms"
    description: "Quote a prepaid term for a subscriber against a plan, under OCC on the agreement"
    roles: [Subscriber]
    code: 201
    input: [subscriber_id, plan_id, expected_CapacityAgreement_version]
    output: PrepaidTerm
    side_effects:
      - "term_status=QUOTED, term_price_cents=0, deferred_revenue_cents=0"
      - "Increments CapacityAgreement.version by 1"

  - method: GET
    path: "/carriers/prepaid-terms/{id}"
    description: "Read one prepaid term with its deferred and earned revenue fields"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin, Subscriber, RetailPartner]
    code: 200
    input: []
    output: PrepaidTerm
    side_effects: []

  - method: GET
    path: "/carriers/prepaid-terms"
    description: "List prepaid terms, filterable by subscriber, plan and status"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin, Subscriber, RetailPartner]
    code: 200
    input: [subscriber_id, plan_id, "term_status?", "limit?", "offset?"]
    output: "PrepaidTerm[]"
    side_effects: []

  - method: POST
    path: "/carriers/prepaid-terms/{id}/purchase"
    description: "Purchase the quoted prepaid term, charging the intro price and deferring the unearned part"
    roles: [Subscriber]
    code: 200
    input: ["expected_CapacityAgreement_version?"]
    output: PrepaidTerm
    side_effects:
      - "term_status=PURCHASED (M4 QUOTED_to_PURCHASED)"
      - "Sets term_price_cents by prepaid_term_price"
      - "Sets deferred_revenue_cents and earned_revenue_cents by schedule_formula_provisional_vs_final (provisional variant)"
      - "Recomputes Plan.plan_status (M2 OFFERED_to_ACTIVE)"
      - "Recomputes the agreement's allocated_data_mb and remaining_data_mb (wholesale_allocated_data_mb)"
      - "Increments PrepaidTerm.version by 1 and CapacityAgreement.version by 1"

  - method: POST
    path: "/carriers/prepaid-terms/{id}/accept_step_up"
    description: "Renew a term at the step-up price after the introductory period"
    roles: [Subscriber]
    code: 200
    input: ["expected_CapacityAgreement_version?"]
    output: PrepaidTerm
    side_effects:
      - "term_status=ACTIVE_RENEWAL (M4 RENEWAL_DUE_to_ACTIVE_RENEWAL)"
      - "Sets term_price_cents=renewal_price_cents by prepaid_term_price and extends expires_at"
      - "Resets the subscriber's cycle counters and opens a fresh cycle at index 1"
      - "Closes the RENEWAL_PRICING SupportCase as CLOSED"
      - "Voids every AddOn in {REQUESTED, ACTIVE} with deprovisioned_msisdn=accepted_msisdn (M11 ACTIVE_to_VOIDED)"
      - "Recomputes the agreement's allocated_data_mb and remaining_data_mb"
      - "Increments PrepaidTerm.version by 1 and CapacityAgreement.version by 1"

  - method: POST
    path: "/carriers/prepaid-terms/{id}/cancel"
    description: "Cancel a prepaid term, refunding an unstarted term or recognising breakage on a started one"
    roles: [Subscriber, SupportAgent]
    code: 200
    input: []
    output: PrepaidTerm
    side_effects:
      - "Unstarted term: term_status=REFUNDED (M4 PURCHASED_to_REFUNDED or AWAITING_ACTIVATION_to_REFUNDED) with deferred_revenue_cents and earned_revenue_cents zeroed"
      - "Started term: term_status=EXPIRED with breakage_days and breakage_cents_recognized written by early_churn_revenue_recognition"
      - "Releases capacity through settlement_clearing: the agreement's allocated_data_mb and remaining_data_mb are recomputed"
      - "Recomputes the parent Plan.plan_status (M2 ACTIVE_to_OFFERED when the plan empties)"
      - "Increments PrepaidTerm.version by 1"

  # --- CycleRecord ---
  - method: GET
    path: "/carriers/cycles/{id}"
    description: "Read one cycle record with its frozen usage and earned cents"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin, Subscriber, RetailPartner]
    code: 200
    input: []
    output: CycleRecord
    side_effects: []

  - method: GET
    path: "/carriers/cycles"
    description: "List cycle records, filterable by the term they belong to"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin, Subscriber, RetailPartner]
    code: 200
    input: [prepaid_term_id, "cycle_status?", "limit?", "offset?"]
    output: "CycleRecord[]"
    side_effects: []

  # --- Activation ---
  - method: POST
    path: "/carriers/activations"
    description: "Request a digital or retail-partner activation for a purchased term"
    roles: [Subscriber]
    code: 201
    input: [subscriber_id, prepaid_term_id, activation_channel, "retail_partner_id?", "porting_msisdn?", "losing_carrier?", "account_number_last4?"]
    output: Activation
    side_effects:
      - "activation_status=REQUESTED and port_status=NONE"
      - "Sets the parent PrepaidTerm.term_status=AWAITING_ACTIVATION (M4 PURCHASED_to_AWAITING_ACTIVATION)"
      - "Increments Activation.version by 1"

  - method: GET
    path: "/carriers/activations/{id}"
    description: "Read one activation with both its provisioning and porting dimensions"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin, Subscriber, RetailPartner]
    code: 200
    input: []
    output: Activation
    side_effects: []

  - method: GET
    path: "/carriers/activations"
    description: "List activations, filterable by subscriber, term, partner and both state dimensions"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin, Subscriber, RetailPartner]
    code: 200
    input: [subscriber_id, prepaid_term_id, retail_partner_id, "activation_status?", "port_status?", "limit?", "offset?"]
    output: "Activation[]"
    side_effects: []

  - method: POST
    path: "/carriers/activations/{id}/provision"
    description: "Reserve state-scoped SIM media and mint the number the activation will go live on"
    roles: [CapacityPlanner]
    code: 200
    input: []
    output: Activation
    side_effects:
      - "activation_status=PROVISIONED (M5 REQUESTED_to_PROVISIONED)"
      - "Reserves one unit on a matching SimInventory block: reserved_count += 1, reserved_for_activation_id set, inventory_status=RESERVED_PREPAID (M8 AVAILABLE_to_RESERVED_PREPAID)"
      - "Sets provisioned_msisdn and, on the retail channel, the block's shipment_channel and shipment_sla_days"
      - "Sets the parent Subscriber.allocation_status=HELD"
      - "Recomputes the agreement's allocated_data_mb and remaining_data_mb (wholesale_allocated_data_mb)"
      - "Increments Activation.version by 1"

  - method: POST
    path: "/carriers/activations/{id}/complete"
    description: "Complete an activation, settling any submitted port and starting the first cycle"
    roles: [Subscriber, SupportAgent]
    code: 200
    input: []
    output: Activation
    side_effects:
      - "activation_status=COMPLETED; port_status returns to NONE when it was SUBMITTED (M6 SUBMITTED_to_NONE)"
      - "Sets accepted_msisdn = porting_msisdn when the port settled, else provisioned_msisdn; sets held_data_mb=0"
      - "Sets the parent Subscriber.subscriber_status=ACTIVE and allocation_status=ALLOCATED (M3 PENDING_PORT_to_ACTIVE)"
      - "Sets the parent PrepaidTerm.term_status=ACTIVE, starts_at, expires_at and opens the first CycleRecord (M4 AWAITING_ACTIVATION_to_ACTIVE)"
      - "Recomputes Plan.plan_status and the agreement's allocated_data_mb, remaining_data_mb and congestion_index"
      - "Increments Activation.version by 1"

  - method: POST
    path: "/carriers/activations/{id}/fail"
    description: "Fail an activation, sending the subscriber into grace and the term back to purchased"
    roles: [SupportAgent]
    code: 200
    input: [failure_reason]
    output: Activation
    side_effects:
      - "activation_status=FAILED (M5 REQUESTED_to_FAILED or PROVISIONED_to_FAILED)"
      - "Sets the parent Subscriber.subscriber_status=GRACE (M3 PENDING_PORT_to_GRACE)"
      - "Sets the parent PrepaidTerm.term_status=PURCHASED (M4 AWAITING_ACTIVATION_to_PURCHASED)"
      - "Withdraws the media reservation: reserved_count -= 1 (M8 RESERVED_PREPAID_to_AVAILABLE)"
      - "Recomputes the agreement's allocated_data_mb and remaining_data_mb"
      - "Increments Activation.version by 1"

  - method: POST
    path: "/carriers/activations/{id}/submit-port"
    description: "Submit a port-in request that holds capacity for the number being ported"
    roles: [Subscriber]
    code: 200
    input: [porting_msisdn, losing_carrier, account_number_last4]
    output: Activation
    side_effects:
      - "port_status=SUBMITTED (M6 NONE_to_SUBMITTED)"
      - "Sets held_data_mb to the plan's data_allotment_mb"
      - "Sets the parent Subscriber.allocation_status=HELD"
      - "Recomputes the agreement's allocated_data_mb and remaining_data_mb (the hold is counted exactly once)"
      - "Increments Activation.version by 1"

  - method: POST
    path: "/carriers/activations/{id}/reject-port"
    description: "Record a losing-carrier port rejection and release the held capacity"
    roles: [SupportAgent]
    code: 200
    input: [rejection_code]
    output: Activation
    side_effects:
      - "port_status=REJECTED (M6 SUBMITTED_to_REJECTED)"
      - "Sets held_data_mb=0 and the parent Subscriber.allocation_status=NONE"
      - "Sets the parent Subscriber.subscriber_status=GRACE"
      - "Recomputes the agreement's allocated_data_mb, remaining_data_mb and congestion_index"
      - "Increments Activation.version by 1"

  - method: POST
    path: "/carriers/activations/{id}/confirm-port"
    description: "Record a losing-carrier port confirmation, putting the ported number live"
    roles: [SupportAgent]
    code: 200
    input: []
    output: Activation
    side_effects:
      - "port_status=CONFIRMED (M6 SUBMITTED_to_CONFIRMED)"
      - "Sets the parent Subscriber.subscriber_status=ACTIVE and allocation_status=ALLOCATED (M3 PENDING_PORT_to_ACTIVE)"
      - "Recomputes the agreement's allocated_data_mb and remaining_data_mb (settlement_clearing)"
      - "Increments Activation.version by 1"

  - method: POST
    path: "/carriers/activations/{id}/cancel-port"
    description: "Withdraw a submitted port request and release the capacity it held"
    roles: [Subscriber]
    code: 200
    input: []
    output: Activation
    side_effects:
      - "port_status=CANCELLED (M6 SUBMITTED_to_CANCELLED)"
      - "Sets held_data_mb=0"
      - "Sets the parent Subscriber.allocation_status=HELD when activation_status is PROVISIONED, and leaves it ALLOCATED when activation_status is COMPLETED"
      - "Recomputes the agreement's allocated_data_mb and remaining_data_mb (settlement_clearing)"
      - "Increments Activation.version by 1"

  # --- RetailPartner and SimInventory ---
  - method: POST
    path: "/carriers/retail-partners"
    description: "Onboard a retail partner that will hold SIM media for a set of states"
    roles: [CapacityPlanner]
    code: 201
    input: [partner_name, partner_state_codes, "shipment_sla_days?"]
    output: RetailPartner
    side_effects:
      - "partner_status=ACTIVE"

  - method: GET
    path: "/carriers/retail-partners/{id}"
    description: "Read one retail partner"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin, Subscriber, RetailPartner]
    code: 200
    input: []
    output: RetailPartner
    side_effects: []

  - method: POST
    path: "/carriers/retail-partners/{id}/suspend"
    description: "Suspend a retail partner so its media can no longer serve new activations"
    roles: [CapacityPlanner]
    code: 200
    input: ["expected_RetailPartner_version?"]
    output: RetailPartner
    side_effects:
      - "partner_status=SUSPENDED (M7 to_SUSPENDED)"
      - "Rejects RETAIL_PARTNER activations against this partner with ERR_PARTNER_SUSPENDED"
      - "Increments RetailPartner.version by 1"

  - method: POST
    path: "/carriers/retail-partners/{id}/reinstate"
    description: "Return a deflected retail partner to active service"
    roles: [CapacityPlanner]
    code: 200
    input: ["expected_RetailPartner_version?"]
    output: RetailPartner
    side_effects:
      - "partner_status=ACTIVE (M7 DEFLECTED_to_ACTIVE)"
      - "Increments RetailPartner.version by 1"

  - method: POST
    path: "/carriers/sim-inventories"
    description: "Register a state-scoped block of physical SIM units or eSIM profiles"
    roles: [CapacityPlanner, RetailPartner]
    code: 201
    input: [state_code, sim_media_type, unit_count, "retail_partner_id?"]
    output: SimInventory
    side_effects:
      - "inventory_status=AVAILABLE, reserved_count=0, units_shipped=0"

  - method: GET
    path: "/carriers/sim-inventories/{id}"
    description: "Read one SIM inventory block with its reservation and shipment fields"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin, Subscriber, RetailPartner]
    code: 200
    input: []
    output: SimInventory
    side_effects: []

  - method: GET
    path: "/carriers/sim-inventories"
    description: "List SIM inventory blocks, filterable by state, media, partner and reservation"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin, RetailPartner]
    code: 200
    input: [state_code, sim_media_type, inventory_status, retail_partner_id, reserved_for_activation_id, "limit?", "offset?"]
    output: "SimInventory[]"
    side_effects: []

  - method: POST
    path: "/carriers/sim-inventories/{id}/return"
    description: "Return shipped SIM media, reopening the reservation and failing the waiting activation"
    roles: [FulfillmentOperator]
    code: 200
    input: ["expected_SimInventory_version?"]
    output: SimInventory
    side_effects:
      - "inventory_status=RETURNED (M8 to_RETURNED), reopening reserved_count by units_shipped and zeroing units_shipped"
      - "Sets the reserving Activation.activation_status=FAILED, which cascades the subscriber into GRACE and the term back to PURCHASED"
      - "Recomputes the agreement's allocated_data_mb and remaining_data_mb"
      - "Increments SimInventory.version by 1"

  # --- SupportCase ---
  - method: POST
    path: "/carriers/support-cases"
    description: "Open a support case against a subscriber"
    roles: [Subscriber, SupportAgent]
    code: 201
    input: [subscriber_id, topic_code]
    output: SupportCase
    side_effects:
      - "case_status=OPEN, handling_seconds=0"
      - "Sets sla_due_at = created_at plus the topic's SLA hours"

  - method: GET
    path: "/carriers/support-cases/{id}"
    description: "Read one support case with its SLA window and escalation reason"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin, Subscriber]
    code: 200
    input: []
    output: SupportCase
    side_effects: []

  - method: GET
    path: "/carriers/support-cases"
    description: "List support cases, filterable by subscriber and status"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin]
    code: 200
    input: [subscriber_id, case_status, topic_code, "limit?", "offset?"]
    output: "SupportCase[]"
    side_effects: []

  - method: POST
    path: "/carriers/support-cases/{id}/assign"
    description: "Assign an open case to an agent and book its routing estimate"
    roles: [SupportAgent]
    code: 200
    input: []
    output: SupportCase
    side_effects:
      - "case_status=ASSIGNED (M10 OPEN_to_ASSIGNED)"
      - "Books the topic's routing estimate into handling_seconds and adds it to Subscriber.support_seconds_used (support_outsourcing_budget)"
      - "Increments SupportCase.version by 1"

  - method: POST
    path: "/carriers/support-cases/{id}/resolve_self_service"
    description: "Resolve a case in self-service with zero agent seconds, counting a deflection"
    roles: [Subscriber]
    code: 200
    input: []
    output: SupportCase
    side_effects:
      - "case_status=RESOLVED_SELF_SERVICE (M10 OPEN_to_RESOLVED_SELF_SERVICE)"
      - "Increments Subscriber.self_service_deflection_count by 1 and leaves support_seconds_used unchanged (support_outsourcing_budget)"
      - "Increments SupportCase.version by 1"

  - method: POST
    path: "/carriers/support-cases/{id}/resolve_agent"
    description: "Resolve a case through an agent, booking the reported handling seconds"
    roles: [SupportAgent]
    code: 200
    input: [agent_seconds]
    output: SupportCase
    side_effects:
      - "case_status=RESOLVED_AGENT (M10 ASSIGNED_to_RESOLVED_AGENT or ESCALATED_to_RESOLVED_AGENT)"
      - "Adds agent_seconds to handling_seconds and to Subscriber.support_seconds_used (support_outsourcing_budget)"
      - "Increments SupportCase.version by 1"

  - method: POST
    path: "/carriers/support-cases/{id}/escalate"
    description: "Escalate a case once its SLA window has elapsed"
    roles: [SupportAgent]
    code: 200
    input: []
    output: SupportCase
    side_effects:
      - "case_status=ESCALATED (M10 OPEN_to_ESCALATED or ASSIGNED_to_ESCALATED) with escalation_reason=SELF_SERVICE_FAILED"
      - "Adds the topic's escalation estimate to Subscriber.support_seconds_used (support_outsourcing_budget)"
      - "Increments SupportCase.version by 1"

  # --- AddOn ---
  - method: POST
    path: "/carriers/add-ons"
    description: "Request a roaming or international long-distance add-on"
    roles: [Subscriber]
    code: 201
    input: [subscriber_id, addon_type, addon_days, per_day_allotment_mb]
    output: AddOn
    side_effects:
      - "addon_status=REQUESTED, addon_price_cents=0"

  - method: GET
    path: "/carriers/add-ons/{id}"
    description: "Read one add-on with its resolved price and window"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin, Subscriber]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  - method: GET
    path: "/carriers/add-ons"
    description: "List add-ons, filterable by subscriber and status"
    roles: [CapacityPlanner, SupportAgent, FulfillmentOperator, PlatformAdmin, Subscriber]
    code: 200
    input: [subscriber_id, addon_status, addon_type, "limit?", "offset?"]
    output: "AddOn[]"
    side_effects: []

  - method: POST
    path: "/carriers/add-ons/{id}/activate"
    description: "Activate a requested add-on and resolve its price from the rate card"
    roles: [CapacityPlanner]
    code: 200
    input: []
    output: AddOn
    side_effects:
      - "addon_status=ACTIVE (M11 REQUESTED_to_ACTIVE)"
      - "Sets start_at, end_at and addon_price_cents (roaming_rate_card)"
      - "Rejects with ERR_ADDON_WINDOW_OVERLAP when the window intersects an add-on already ACTIVE for the same subscriber"
      - "Increments AddOn.version by 1"

  # --- Test-driving clock endpoint ---
  - method: POST
    path: "/carriers/_clock/set_current_utc"
    description: "Set the logical clock used by SLA windows, add-on expiry and shipment delivery. Default startup time is 2026-09-01T00:00:00Z; before any call the clock reads exactly that and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects:
      - "Sets the server's logical clock; all datetime comparisons use it"

# =============================================================================
# Table 7: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, X-User-Role not one of the declared roles, or an entity_backed role's X-User-ID does not name an existing instance"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Subscriber acts on a row whose subscriber_id differs from X-User-ID, or a RetailPartner acts on a block whose retail_partner_id differs"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "The agreement id in the path or body does not exist"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "The plan id in the path or body does not exist"
  - id: ERR_SUBSCRIBER_NOT_FOUND
    http: 404
    condition: "The subscriber id in the path or body does not exist"
  - id: ERR_TERM_NOT_FOUND
    http: 404
    condition: "The prepaid term id in the path does not exist"
  - id: ERR_ACTIVATION_NOT_FOUND
    http: 404
    condition: "The activation id in the path does not exist"
  - id: ERR_PARTNER_NOT_FOUND
    http: 404
    condition: "The retail partner id in the path or body does not exist"
  - id: ERR_SIM_INVENTORY_NOT_FOUND
    http: 404
    condition: "The sim inventory id in the path does not exist"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "The support case id in the path does not exist"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "The cycle id in the path does not exist"
  - id: ERR_ADDON_NOT_FOUND
    http: 404
    condition: "The add-on id in the path does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row's lifecycle state does not permit the requested transition"
  - id: ERR_TERM_ALREADY_TERMINAL
    http: 409
    condition: "A cancel is attempted on a term already in REFUNDED or VOIDED"
  - id: ERR_ACTIVATION_ALREADY_TERMINAL
    http: 409
    condition: "A complete or fail is attempted on an activation already in COMPLETED or FAILED"
  - id: ERR_PORT_ALREADY_TERMINAL
    http: 409
    condition: "A port action is attempted on an activation whose port_status is already REJECTED"
  - id: ERR_CYCLE_ALREADY_ROLLED
    http: 409
    condition: "A cycle roll is attempted on a CycleRecord already in ROLLED"
  - id: ERR_AGREEMENT_SUSPENDED
    http: 409
    condition: "A capacity-allocating action is attempted against an agreement in SUSPENDED"
  - id: ERR_AGREEMENT_CLOSED
    http: 409
    condition: "A term sale or plan offer is attempted against an agreement in CLOSED"
  - id: ERR_PLAN_RETIRED
    http: 409
    condition: "A term sale is attempted against a plan in RETIRED, or a plan sale is attempted against a withdrawn plan"
  - id: ERR_INSUFFICIENT_AGREEMENT_CAPACITY
    http: 409
    condition: "The agreement's remaining_data_mb is less than the plan's data_allotment_mb"
  - id: ERR_DUPLICATE_ACTIVE_TERM
    http: 409
    condition: "The subscriber already holds a PrepaidTerm in a non-terminal status"
  - id: ERR_PARTNER_NOT_AUTHORIZED_FOR_STATE
    http: 422
    condition: "A retail-partner activation or inventory block names a state the partner does not list in partner_state_codes"
  - id: ERR_PARTNER_SUSPENDED
    http: 422
    condition: "A retail-partner activation or inventory block names a partner in DEFLECTED or SUSPENDED"
  - id: ERR_NO_ACTIVATABLE_SIM_MEDIA
    http: 422
    condition: "No SimInventory block scoped to the subscriber's state_code has unit_count - reserved_count >= 1"
  - id: ERR_SIM_INVENTORY_DEPLETED
    http: 409
    condition: "The referenced block has unit_count - reserved_count == 0"
  - id: ERR_SUBSCRIBER_NOT_ACTIVE
    http: 409
    condition: "consume_data or an add-on is attempted for a subscriber whose subscriber_status is not ACTIVE"
  - id: ERR_TERM_NOT_ACTIVE
    http: 409
    condition: "consume_data or an add-on activation is attempted for a subscriber whose term_status is neither ACTIVE nor ACTIVE_RENEWAL"
  - id: ERR_MSISDN_ALREADY_IN_FLIGHT
    http: 409
    condition: "Another activation already holds port_status SUBMITTED for the same losing_carrier and account_number_last4"
  - id: ERR_MSISDN_MISMATCH
    http: 422
    condition: "A port submit names a porting_msisdn that differs from the subscriber's msisdn"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, an unknown field is supplied, or a derived field (deprioritization_threshold_mb) is supplied by the client"
  - id: ERR_INVALID_PLAN_TERM
    http: 422
    condition: "term_months is not one of 3, 6, 12, or renewal_price_cents is not strictly greater than intro_price_cents"
  - id: ERR_INVALID_ADDON_WINDOW
    http: 422
    condition: "addon_days is not one of 1, 7, 30, or per_day_allotment_mb contradicts the addon_type"
  - id: ERR_SELF_SERVICE_TOO_EARLY
    http: 409
    condition: "A self-service resolution is attempted within 60 seconds of the case's created_at"
  - id: ERR_SUPPORT_BUDGET_EXCEEDED
    http: 402
    condition: "The seconds an assignment, escalation or agent resolution would book exceed the subscriber's support_seconds_budget"
  - id: ERR_SLA_NOT_DUE
    http: 409
    condition: "A manual escalation is attempted before the case's sla_due_at"
  - id: ERR_RETAIL_CHANNEL_MISMATCH
    http: 422
    condition: "retail_partner_id is supplied for a DIGITAL activation, or omitted for a RETAIL_PARTNER activation"
  - id: ERR_PORT_IN_FLIGHT
    http: 409
    condition: "A subscriber cancel is attempted while its activation has port_status SUBMITTED"
  - id: ERR_TERM_ALREADY_STARTED
    http: 409
    condition: "A refund-style cancel is attempted for a term whose starts_at is set"
  - id: ERR_ADDON_WINDOW_OVERLAP
    http: 409
    condition: "The add-on window being activated intersects an add-on window already ACTIVE for the same subscriber, under half-open interval semantics"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "An expected_CapacityAgreement_version or expected_Subscriber_version does not equal the parent's current version"

# =============================================================================
# Table 8: RBAC Matrix
# =============================================================================
roles:
  - name: CapacityPlanner
    description: "Wholesale operator staff who buy capacity and manage the prepaid catalogue"
    identity: "opaque"
    exclusive_operations:
      - "POST /carriers/capacity-agreements and all agreement lifecycle actions"
      - "POST /carriers/plans, offer and withdraw"
      - "POST /carriers/retail-partners"
      - "POST /carriers/activations/{id}/provision"
      - "POST /carriers/subscribers/{id}/consume_data and run_cycle"
      - "POST /carriers/add-ons/{id}/activate"
    shared_operations:
      - "All GET endpoints"
      - "POST /carriers/sim-inventories"
  - name: SupportAgent
    description: "Outsourced care agent working the support queue and activation exceptions"
    identity: "opaque"
    exclusive_operations:
      - "POST /carriers/activations/{id}/fail, reject-port"
      - "POST /carriers/support-cases/{id}/assign, resolve_agent, escalate"
      - "POST /carriers/subscribers/{id}/support_top_ups"
    shared_operations:
      - "All GET endpoints"
      - "POST /carriers/activations/{id}/complete"
      - "POST /carriers/subscribers"
  - name: FulfillmentOperator
    description: "Warehouse and partner-fulfilment operator handling SIM media"
    identity: "opaque"
    exclusive_operations:
      - "POST /carriers/sim-inventories/{id}/return"
    shared_operations:
      - "All GET endpoints"
  - name: PlatformAdmin
    description: "Platform operator who owns the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /carriers/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: Subscriber
    description: "Prepaid subscriber acting on their own number, terms, activations, cases and add-ons"
    identity: "entity_backed:Subscriber"
    exclusive_operations:
      - "POST /carriers/prepaid-terms and purchase and accept_step_up"
      - "POST /carriers/activations and submit-port"
      - "POST /carriers/add-ons"
      - "POST /carriers/support-cases/{id}/resolve_self_service"
      - "POST /carriers/subscribers/{id}/cancel"
    shared_operations:
      - "All GET endpoints"
      - "POST /carriers/support-cases"
      - "POST /carriers/activations/{id}/complete"
  - name: RetailPartner
    description: "Retail partner holding state-scoped SIM media"
    identity: "entity_backed:RetailPartner"
    exclusive_operations:
      - "POST /carriers/sim-inventories for its own inventory"
    shared_operations:
      - "All GET endpoints"
