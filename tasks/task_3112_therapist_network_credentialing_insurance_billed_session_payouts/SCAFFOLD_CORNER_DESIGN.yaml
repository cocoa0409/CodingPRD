              as: OpsAdmin
              captures: { session_total: $.data.0.id }
          assert:
            - "the first request returns 404 with ${error_missing_clinician} == ERR_CLINICIAN_NOT_FOUND"
            - "the second request returns 404 with ${error_missing_patient} == ERR_PATIENT_NOT_FOUND"
            - "the session list reads an empty array with total_count == 0, so neither rejected request persisted a row"
            - "both errors carry response_type error with an error_id and a message"

