scenario: |
  2883. Police Recruit Academy & Field Training (municipal police academy): recruit selection pipeline with background investigation, medical, psychological and physical fitness standards, academy curriculum mapped to state certification requirements with hours by topic, examination, remediation and dismissal criteria during the academy phase, field training program with rotating trainers, standardized evaluation guidelines and daily observation reports, probationary period milestones with extension and separation decisions, training records maintenance for certification and future litigation, instructor certification and lesson plan approval, attrition analysis by stage with recruiting pipeline forecasting
domain_name: police-recruit-academy-field-training
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - version_pinning_on_approval

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no nesting in URL paths beyond
  # action/sub-resource segments. CertificationStandard, AcademyClass, Recruit,
  # Instructor, LessonPlan, CourseSession, Examination and FieldTrainingRotation
  # are all addressable at the top level by their own id.

  state_machine_shape: cyclic
  # Four independent state dimensions live on Recruit (pipeline_stage x
  # clearance_status x academy_status x probation_status). Examination,
  # ScreeningRecord, LessonPlan, CourseSession, FieldTrainingRotation,
  # Instructor and AcademyClass each carry at least one revision/remediation
  # loop (A -> B -> A).

  relationship_patterns:
    - one_to_many          # AcademyClass -> Recruit; CourseSession -> AttendanceRecord
    - many_to_many         # Recruit x CourseSession via AttendanceRecord; Recruit x Instructor via FieldTrainingRotation
    - self_referential     # FieldTrainingRotation.prior_rotation_id -> FieldTrainingRotation.id
    - cross_aggregate      # CourseSession pins LessonPlan.approved_revision_number across the class aggregate

  role_model: segregation_of_duties
  # Two enforced separations: (i) the operator who records screening findings
  # may not adjudicate the same ScreeningRecord; (ii) an Instructor may serve as
  # FTO for a given Recruit at most once across the whole field-training program
  # ("rotating trainers").

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CertificationStandard
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: code
        type: string
        source: input
        description: "State POST commission standard code, e.g. 'POST-2026-BASIC'"
        constraints: "1..40 chars; unique across CertificationStandard"
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code the standard belongs to"
        constraints: "exactly 2 uppercase letters"
      - name: min_total_hours
        type: number
        source: input
        description: "Minimum credited academy contact hours required for certification"
        constraints: "> 0; 2 decimal places"
      - name: min_passing_score
        type: number
        source: input
        description: "Minimum Examination raw_score that counts as a pass (inclusive lower bound)"
        constraints: "0 < value <= 100; 2 decimal places"
      - name: max_remediation_attempts
        type: integer
        source: input
        description: "How many remediation retests a Recruit may take per topic after the first failure"
        constraints: ">= 0; total attempts allowed = 1 + max_remediation_attempts"
      - name: max_absence_hours
        type: number
        source: input
        description: "Cumulative unexcused absence hours a Recruit may accrue before mandatory dismissal review"
        constraints: ">= 0; 2 decimal places"
      - name: topic_requirements
        type: array
        source: input
        description: "Curriculum map: array of { topic_code, required_hours, exam_required }"
        constraints: "1..20 items; topic_code unique within the array, 1..24 chars uppercase; required_hours > 0; exam_required boolean"
      - name: fitness_event_floor_points
        type: integer
        source: input
        description: "Per-event points floor used by calculations.physical_fitness_composite"
        default: 10
        constraints: "0..25"
      - name: fitness_pass_score
        type: integer
        source: input
        description: "Minimum physical fitness composite that clears the PHYSICAL_FITNESS screening"
        default: 60
        constraints: "0..100"

  - name: AcademyClass
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: certification_standard_id
        type: string
        source: input
        description: "FK -> CertificationStandard.id; the standard this cohort is certified against; pinned at creation and immutable"
      - name: class_code
        type: string
        source: input
        description: "Cohort identifier, e.g. '2026-A'"
        constraints: "1..24 chars; unique across AcademyClass"
      - name: start_date
        type: string
        source: input
        description: "ISO 8601 calendar date (YYYY-MM-DD) the academy phase opens"
      - name: planned_seats
        type: integer
        source: input
        description: "Budgeted recruit seats for the cohort; used by the pipeline forecast report"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Cohort posture; gates certify-graduates"
        default: FORMING
        constraints: "FORMING | IN_SESSION | AT_RISK | GRADUATED"
      - name: credited_topic_hours_total
        type: number
        source: computed
        description: "Conserved quantity: sum of TrainingRecordEntry.hours_delta over entries with kind IN {HOURS_CREDIT, HOURS_REVERSAL} and academy_class_id == this class; 2 decimal places"
      - name: unmet_topic_hours
        type: object
        source: computed
        description: "Map topic_code -> remaining class-wide required hours = max(0, required_hours - delivered_hours_for_topic), where delivered_hours_for_topic sums CourseSession.scheduled_hours over sessions of this class with status == DELIVERED and that topic_code; 2 decimal places. The map always carries exactly one entry per topic_requirements entry of the class standard, in the order those entries were declared, and reads the full required_hours when no session of that topic has been delivered"
      - name: projected_topic_hours
        type: object
        source: computed
        description: "Map topic_code -> delivered_plus_scheduled hours = sum of CourseSession.scheduled_hours over sessions of this class with that topic_code and status IN {DELIVERED, SCHEDULED, UNDER_MIN_ENROLLMENT}; 2 decimal places. The map always carries exactly one entry per topic_requirements entry of the class standard, in the order those entries were declared, and reads 0.00 for a topic with no such session"
      - name: graduated_count
        type: integer
        source: computed
        description: "Count of Recruit rows of this class whose pipeline_stage == CERTIFIED"

  - name: Recruit
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: academy_class_id
        type: string
        source: input
        description: "FK -> AcademyClass.id; the cohort the recruit belongs to; immutable after creation"
      - name: applicant_number
        type: string
        source: input
        description: "Agency applicant file number"
        constraints: "1..24 chars; unique across Recruit"
      - name: full_name
        type: string
        source: input
        description: "Recruit legal name as printed on the certification record"
        constraints: "1..120 chars"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 calendar date (YYYY-MM-DD)"
      - name: age_bracket
        type: enum
        source: input
        description: "Fitness standard bracket used by calculations.physical_fitness_composite"
        constraints: "AGE_20_29 | AGE_30_39 | AGE_40_49"
      - name: pipeline_stage
        type: enum
        source: system
        description: "State dimension 1 of 4 - selection/training pipeline position"
        default: APPLICANT
        constraints: "APPLICANT | SCREENING | ACADEMY | FIELD_TRAINING | PROBATION | CERTIFIED | DISMISSED | WITHDRAWN"
      - name: clearance_status
        type: enum
        source: computed
        description: "State dimension 2 of 4 - aggregate of this recruit's four ScreeningRecord rows; evolves independently of pipeline_stage"
        default: PENDING
        constraints: "PENDING | PARTIAL | CLEARED | DISQUALIFIED"
      - name: academy_status
        type: enum
        source: system
        description: "State dimension 3 of 4 - academy-phase standing; loops IN_PROGRESS <-> REMEDIATION"
        default: NOT_STARTED
        constraints: "NOT_STARTED | IN_PROGRESS | REMEDIATION | DISMISSAL_PENDING | COMPLETE"
      - name: probation_status
        type: enum
        source: system
        description: "State dimension 4 of 4 - probationary period standing; loops ACTIVE <-> EXTENSION_REQUIRED"
        default: NOT_APPLICABLE
        constraints: "NOT_APPLICABLE | ACTIVE | EXTENSION_REQUIRED | PASSED | SEPARATED"
      - name: credited_hours_total
        type: number
        source: computed
        description: "ATTENDED_BASIS academy hours per calculations.certified_hours_variant; 2 decimal places"
      - name: scheduled_basis_hours_total
        type: number
        source: computed
        description: "SCHEDULED_BASIS academy hours per calculations.certified_hours_variant; 2 decimal places"
      - name: per_topic_credited_hours
        type: object
        source: computed
        description: "Map topic_code -> ATTENDED_BASIS credited hours per calculations.topic_hours_ledger; 2 decimal places each"
      - name: unexcused_absence_hours
        type: number
        source: computed
        description: "Cumulative unexcused absence hours per calculations.absence_hours_accrual; 2 decimal places"
      - name: make_up_hours_owed
        type: number
        source: computed
        description: "Sum of CourseSession.scheduled_hours over this recruit's AttendanceRecord rows with status == ABSENT_EXCUSED and ledger_status == CREDITED; 2 decimal places"
      - name: remediation_attempts_used
        type: integer
        source: computed
        description: "Max over this recruit's Examination rows of (attempt_number - 1)"
      - name: probation_start
        type: string
        source: system
        description: "ISO 8601 calendar date; set when pipeline_stage enters PROBATION; null before that"
      - name: probation_base_days
        type: integer
        source: system
        description: "Base probationary length in days; set when pipeline_stage enters PROBATION"
        default: 365
      - name: probation_extension_days
        type: integer
        source: computed
        description: "Extension granted per calculations.probation_schedule step 3"
        default: 0
      - name: probation_milestone_due_date
        type: string
        source: computed
        description: "ISO 8601 calendar date per calculations.probation_schedule step 1; null when probation_start is null"
      - name: probation_milestone_score
        type: number
        source: computed
        description: "Competency score selected by calculations.probation_schedule step 2; null when no qualifying rotation exists; 2 decimal places"
      - name: probation_scheduled_end
        type: string
        source: computed
        description: "ISO 8601 calendar date per calculations.probation_schedule step 4; null when probation_start is null"
      - name: dismissal_reason_code
        type: enum
        source: system
        description: "Reason recorded on the dismissal/withdrawal decision; null while the recruit is not DISMISSED or WITHDRAWN"
        constraints: "ACADEMIC_FAILURE | ABSENCE_LIMIT | INTEGRITY | MEDICAL | FIELD_TRAINING_FAILURE | PROBATION_SEPARATION | VOLUNTARY_WITHDRAWAL"

  - name: ScreeningRecord
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: recruit_id
        type: string
        source: input
        description: "FK -> Recruit.id; the recruit being screened"
      - name: screening_type
        type: enum
        source: input
        description: "Which selection standard this record covers"
        constraints: "BACKGROUND | MEDICAL | PSYCHOLOGICAL | PHYSICAL_FITNESS; unique per (recruit_id, screening_type)"
      - name: status
        type: enum
        source: system
        description: "Screening lifecycle; RETEST_REQUIRED loops back to FINDINGS_RECORDED"
        default: ORDERED
        constraints: "ORDERED | FINDINGS_RECORDED | RETEST_REQUIRED | CLEARED | WAIVED | DISQUALIFIED"
      - name: attempt_number
        type: integer
        source: system
        description: "Increments each time findings are recorded after a RETEST_REQUIRED adjudication"
        default: 1
      - name: raw_metrics
        type: object
        source: input
        description: "Findings payload. For PHYSICAL_FITNESS: { push_ups: integer, sit_ups: integer, run_1_5_mile_seconds: integer, vertical_jump_inches: number }. For other types: { summary: string }"
      - name: composite_score
        type: number
        source: computed
        description: "Physical fitness composite per calculations.physical_fitness_composite; null for screening_type != PHYSICAL_FITNESS"
      - name: disqualifier_codes
        type: array
        source: input
        description: "Array of uppercase finding codes recorded with the findings; empty array means no adverse finding"
      - name: waiver_justification
        type: string
        source: input
        description: "Required narrative when the adjudication decision is WAIVE; null otherwise"
      - name: findings_recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who recorded findings; segregation-of-duties anchor"
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who adjudicated; MUST differ from findings_recorded_by_user_id"
      - name: findings_recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant the current attempt's findings were recorded; ISO 8601 UTC instant at second precision, e.g. 2026-08-01T00:00:00Z"

  - name: Instructor
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: badge_number
        type: string
        source: input
        description: "Sworn badge number"
        constraints: "1..16 chars; unique across Instructor"
      - name: full_name
        type: string
        source: input
        description: "Instructor legal name"
        constraints: "1..120 chars"
      - name: certification_status
        type: enum
        source: system
        description: "Instructor certification lifecycle; EXPIRED can be re-certified (loop)"
        default: UNCERTIFIED
        constraints: "UNCERTIFIED | CERTIFIED | EXPIRED | REVOKED"
      - name: certification_expires_at
        type: datetime
        source: system
        description: "Logical-clock instant the instructor certification lapses; null while UNCERTIFIED; ISO 8601 UTC instant at second precision, e.g. 2026-08-01T00:00:00Z"
      - name: authorized_topic_codes
        type: array
        source: system
        description: "Topic codes this instructor may teach; replaced wholesale on each certify call"
      - name: fto_certified
        type: boolean
        source: system
        description: "True when the instructor is certified as a Field Training Officer"
        default: false
      - name: active_trainee_count
        type: integer
        source: computed
        description: "Conserved quantity: count of FieldTrainingRotation rows with fto_instructor_id == this instructor and status IN {ACTIVE, REMEDIAL}"
      - name: revocation_reason
        type: string
        source: system
        description: "Narrative recorded when certification is revoked; null otherwise"

  - name: LessonPlan
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; the authoring instructor; immutable after creation"
      - name: topic_code
        type: string
        source: input
        description: "Curriculum topic this plan teaches; must match a topic_code in the certification standard of any class that schedules it"
        constraints: "1..24 chars uppercase"
      - name: title
        type: string
        source: input
        description: "Lesson plan title"
        constraints: "1..160 chars"
      - name: contact_hours
        type: number
        source: input
        description: "Classroom contact hours the plan is written for"
        constraints: "> 0; 2 decimal places"
      - name: status
        type: enum
        source: system
        description: "Approval lifecycle; REVISION_REQUESTED -> SUBMITTED -> APPROVED forms a revision loop"
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | REVISION_REQUESTED"
      - name: revision_number
        type: integer
        source: system
        description: "Increments by 1 on every accepted revision submission"
        default: 1
      - name: approved_revision_number
        type: integer
        source: system
        description: "revision_number captured at the moment of approval; null while never approved; CourseSession pins this value"
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock instant of approval; ISO 8601 UTC instant at second precision, e.g. 2026-08-01T00:00:00Z; null while never approved"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AcademyDirector who approved; null while never approved"
      - name: reviewer_notes
        type: string
        source: system
        description: "Notes recorded by the reviewer when revision is requested; null otherwise"

  - name: CourseSession
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: academy_class_id
        type: string
        source: input
        description: "FK -> AcademyClass.id; the cohort receiving the session"
      - name: lesson_plan_id
        type: string
        source: input
        description: "FK -> LessonPlan.id; the approved plan being delivered"
      - name: instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; the instructor of record for this delivery (may differ from the plan author)"
      - name: room_code
        type: string
        source: input
        description: "Classroom / range identifier used by the instructor-buffer overlap rule"
        constraints: "1..16 chars uppercase"
      - name: starts_at
        type: datetime
        source: input
        description: "Session start, ISO 8601 UTC instant at second precision, e.g. 2026-08-01T00:00:00Z; interval is half-open [starts_at, ends_at)"
      - name: ends_at
        type: datetime
        source: input
        description: "Session end, ISO 8601 UTC instant at second precision, e.g. 2026-08-01T00:00:00Z; must be strictly after starts_at"
      - name: min_enrollment
        type: integer
        source: input
        description: "Minimum non-voided AttendanceRecord rows required for the session to remain SCHEDULED"
        default: 3
        constraints: ">= 0"
      - name: scheduled_hours
        type: number
        source: computed
        description: "(ends_at - starts_at) expressed in hours, ROUND_HALF_UP to 2 decimal places"
      - name: topic_code
        type: string
        source: computed
        description: "Copied from the referenced LessonPlan.topic_code at creation; immutable thereafter"
      - name: pinned_lesson_plan_revision
        type: integer
        source: computed
        description: "LessonPlan.approved_revision_number captured at session creation; delivery requires it to still equal the plan's approved_revision_number"
      - name: status
        type: enum
        source: system
        description: "Delivery lifecycle; SCHEDULED <-> UNDER_MIN_ENROLLMENT is a loop"
        default: SCHEDULED
        constraints: "SCHEDULED | UNDER_MIN_ENROLLMENT | DELIVERED | CANCELLED | VOIDED"
      - name: enrolled_count
        type: integer
        source: computed
        description: "Conserved quantity: count of AttendanceRecord rows with course_session_id == this session and ledger_status != VOIDED"
      - name: credited_hours_total
        type: number
        source: computed
        description: "Sum of AttendanceRecord.credited_hours over this session's rows with ledger_status == CREDITED; 2 decimal places"
      - name: void_reason
        type: string
        source: system
        description: "Narrative recorded when a delivered session is voided; null otherwise"

  - name: AttendanceRecord
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: course_session_id
        type: string
        source: input
        description: "FK -> CourseSession.id; the session attended"
      - name: recruit_id
        type: string
        source: input
        description: "FK -> Recruit.id; the recruit whose attendance this row records"
      - name: status
        type: enum
        source: input
        description: "Attendance outcome recorded by the coordinator"
        constraints: "PRESENT | PARTIAL | ABSENT_EXCUSED | ABSENT_UNEXCUSED"
      - name: present_hours
        type: number
        source: input
        description: "Hours physically present; must equal CourseSession.scheduled_hours when status == PRESENT, must be 0 when status starts with ABSENT_, must satisfy 0 < present_hours < scheduled_hours when status == PARTIAL"
        constraints: ">= 0; 2 decimal places"
      - name: ledger_status
        type: enum
        source: system
        description: "Hours-ledger lifecycle for this row"
        default: PROVISIONAL
        constraints: "PROVISIONAL | CREDITED | VOIDED"
      - name: credited_hours
        type: number
        source: computed
        description: "Per-session credited hours per calculations.topic_hours_ledger; 0.00 while ledger_status != CREDITED"
      - name: counted_absence_hours
        type: number
        source: computed
        description: "CourseSession.scheduled_hours when status == ABSENT_UNEXCUSED and ledger_status == CREDITED, else 0.00; 2 decimal places"
      - name: void_reason
        type: string
        source: system
        description: "Narrative recorded when the row is voided by a cascade; null otherwise"

  - name: Examination
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: recruit_id
        type: string
        source: input
        description: "FK -> Recruit.id; the examinee"
      - name: topic_code
        type: string
        source: input
        description: "Curriculum topic examined; must be a topic_code with exam_required == true in the class's certification standard"
        constraints: "1..24 chars uppercase"
      - name: attempt_number
        type: integer
        source: system
        description: "1 for the initial sitting; incremented by each assign-remediation call"
        default: 1
      - name: raw_score
        type: number
        source: system
        description: "Score recorded by the grade call; null while SCHEDULED or REMEDIATION_ASSIGNED"
        constraints: "0..100; 2 decimal places"
      - name: passing_score
        type: number
        source: computed
        description: "Snapshot of the class certification standard's min_passing_score taken at Examination creation; immutable"
      - name: status
        type: enum
        source: system
        description: "Examination lifecycle; FAILED -> REMEDIATION_ASSIGNED -> FAILED is the remediation loop"
        default: SCHEDULED
        constraints: "SCHEDULED | PASSED | FAILED | REMEDIATION_ASSIGNED | FAILED_FINAL"
      - name: remediation_hours
        type: number
        source: system
        description: "Cumulative remediation hours assigned across all assign-remediation calls on this row"
        default: 0
      - name: graded_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent grading; ISO 8601 UTC instant at second precision, e.g. 2026-08-01T00:00:00Z; null while never graded"
      - name: graded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who graded most recently; null while never graded"

  - name: FieldTrainingRotation
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: recruit_id
        type: string
        source: input
        description: "FK -> Recruit.id; the trainee"
      - name: fto_instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; the assigned Field Training Officer"
      - name: prior_rotation_id
        type: string
        source: input
        description: "FK -> FieldTrainingRotation.id; self-referential link to the rotation this one follows; null for phase 1"
      - name: phase_number
        type: integer
        source: input
        description: "Field training phase index"
        constraints: "1..4; unique per (recruit_id, phase_number) across rows with status != ABORTED"
      - name: start_date
        type: string
        source: input
        description: "ISO 8601 calendar date; interval is CLOSED [start_date, end_date] - adjacency counts as overlap"
      - name: end_date
        type: string
        source: input
        description: "ISO 8601 calendar date; must be >= start_date"
      - name: status
        type: enum
        source: system
        description: "Rotation lifecycle; ACTIVE <-> REMEDIAL is a loop driven by competency_score"
        default: PLANNED
        constraints: "PLANNED | ACTIVE | REMEDIAL | COMPLETED | ABORTED"
      - name: dor_count
        type: integer
        source: computed
        description: "Count of ObservationReport rows with field_training_rotation_id == this rotation and voided == false"
      - name: remedial_flag_count
        type: integer
        source: computed
        description: "Count of non-voided ObservationReport rows of this rotation with not_responding_to_training == true"
      - name: competency_score
        type: number
        source: computed
        description: "TERMINAL_WEIGHTED variant of calculations.field_training_competency_score; null while dor_count == 0; 2 decimal places"
      - name: rolling_mean_score
        type: number
        source: computed
        description: "ROLLING_MEAN variant of calculations.field_training_competency_score; null while dor_count == 0; 2 decimal places"
      - name: final_narrative
        type: string
        source: system
        description: "Narrative recorded on completion; null otherwise"
      - name: abort_reason
        type: string
        source: system
        description: "Narrative recorded on abort; null otherwise"

  - name: ObservationReport
    parent: null
    common_fields: true
    kind: event
    fields:
      - name: field_training_rotation_id
        type: string
        source: input
        description: "FK -> FieldTrainingRotation.id; the rotation this daily observation report belongs to"
      - name: author_instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; the authoring FTO; MUST equal the rotation's fto_instructor_id"
      - name: observed_on
        type: string
        source: input
        description: "ISO 8601 calendar date of the observed shift; unique per (field_training_rotation_id, observed_on) among non-voided rows"
      - name: dimension_ratings
        type: object
        source: input
        description: "Standardized evaluation guideline ratings: { officer_safety, driving, report_writing, decision_making, demeanor } each integer 1..7 where 4 is acceptable"
      - name: not_responding_to_training
        type: boolean
        source: input
        description: "Standardized 'not responding to training' flag raised by the FTO"
        default: false
      - name: narrative
        type: string
        source: input
        description: "Documented behaviour narrative retained for certification and litigation"
        constraints: "1..2000 chars"
      - name: dor_mean
        type: number
        source: computed
        description: "Arithmetic mean of the five dimension_ratings values, ROUND_HALF_UP to 2 decimal places"
      - name: voided
        type: boolean
        source: system
        description: "Set true when the parent rotation is aborted; voided reports are excluded from every score"
        default: false

  - name: TrainingRecordEntry
    parent: null
    common_fields: false
    kind: event
    fields:
      - name: recruit_id
        type: string
        source: system
        description: "FK -> Recruit.id; the subject of the record entry"
      - name: academy_class_id
        type: string
        source: system
        description: "FK -> AcademyClass.id; the cohort the entry rolls up to"
      - name: kind
        type: enum
        source: system
        description: "Record category retained for certification audit and future litigation"
        constraints: "STAGE_ENTRY | ADVERSE_EXIT | HOURS_CREDIT | HOURS_REVERSAL | SCREENING_ADJUDICATION | EXAM_RESULT | DOR_FILED | PROBATION_DECISION | CERTIFICATION_ISSUED"
      - name: stage_code
        type: string
        source: system
        description: "Pipeline stage the entry refers to (SCREENING | ACADEMY | FIELD_TRAINING | PROBATION); null for entries that are not stage-scoped"
      - name: hours_delta
        type: number
        source: system
        description: "Signed hours movement; positive on HOURS_CREDIT, negative on HOURS_REVERSAL, 0.00 for every other kind; 2 decimal places"
        default: 0
      - name: topic_code
        type: string
        source: system
        description: "Curriculum topic the entry refers to; null when not topic-scoped"
      - name: actor_role
        type: string
        source: system
        description: "X-User-Role of the actor that caused the entry, or 'system' for cascade-generated entries"
      - name: actor_user_id
        type: string
        source: system
        description: "X-User-ID of the actor that caused the entry; 'system' for cascade-generated entries"
      - name: subject_entity
        type: string
        source: system
        description: "Entity name the entry documents, e.g. 'CourseSession'"
      - name: subject_entity_id
        type: string
        source: system
        description: "Identifier of the documented row; identity only, never used in any business decision"
      - name: detail
        type: string
        source: system
        description: "Human-readable summary retained verbatim in the litigation record"
      - name: recorded_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of the entry; ISO 8601 UTC instant at second precision, e.g. 2026-08-01T00:00:00Z"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
# Recruit carries FOUR independent state dimensions on the same row. Each is a
# separate machine below (dimension: names the field it governs). They evolve
# independently: e.g. clearance_status can reach DISQUALIFIED while
# pipeline_stage is still SCREENING, and academy_status can reach
# DISMISSAL_PENDING while pipeline_stage is still ACADEMY.
state_machines:
  - entity: Recruit
    dimension: pipeline_stage
    initial_state: APPLICANT
    terminal_states: [CERTIFIED, DISMISSED, WITHDRAWN]
    transitions:
      - from: APPLICANT
        to: SCREENING
        trigger: "POST /recruits/{recruitId}/screenings (auto-advance on the FIRST ScreeningRecord ordered for this recruit)"
        actor: system
        preconditions:
          - "recruit.pipeline_stage == APPLICANT"
          - "no ScreeningRecord row exists with recruit_id == recruit.id"
        side_effects:
          - "pipeline_stage := SCREENING"
          - "append TrainingRecordEntry { kind: STAGE_ENTRY, stage_code: 'SCREENING', hours_delta: 0.00, actor_role: 'system' }"
        note: "Makes SCREENING reachable without a dedicated call; advance-stage is not used for this hop."
      - from: SCREENING
        to: ACADEMY
        trigger: "POST /recruits/{recruitId}/advance-stage { to_stage: 'ACADEMY' }"
        actor: TrainingCoordinator
        preconditions:
          - "recruit.clearance_status == CLEARED"
          - "recruit.academy_class_id resolves to an AcademyClass with status IN {FORMING, IN_SESSION, AT_RISK}"
        side_effects:
          - "pipeline_stage := ACADEMY"
          - "academy_status := IN_PROGRESS (from NOT_STARTED)"
          - "append TrainingRecordEntry { kind: STAGE_ENTRY, stage_code: 'ACADEMY', hours_delta: 0.00 }"
      - from: ACADEMY
        to: FIELD_TRAINING
        trigger: "POST /recruits/{recruitId}/advance-stage { to_stage: 'FIELD_TRAINING' }"
        actor: TrainingCoordinator
        preconditions:
          - "recruit.academy_status == COMPLETE"
        side_effects:
          - "pipeline_stage := FIELD_TRAINING"
          - "append TrainingRecordEntry { kind: STAGE_ENTRY, stage_code: 'FIELD_TRAINING', hours_delta: 0.00 }"
      - from: FIELD_TRAINING
        to: PROBATION
        trigger: "POST /recruits/{recruitId}/advance-stage { to_stage: 'PROBATION', probation_start, probation_base_days? }"
        actor: TrainingCoordinator
        preconditions:
          - "count of FieldTrainingRotation rows with recruit_id == recruit.id and status == COMPLETED is >= 1"
          - "no FieldTrainingRotation row of this recruit has status == PLANNED"
        side_effects:
          - "pipeline_stage := PROBATION"
          - "probation_start := request probation_start; probation_base_days := request probation_base_days or 365"
          - "probation_status := ACTIVE (from NOT_APPLICABLE)"
          - "recompute calculations.probation_schedule -> probation_milestone_due_date, probation_milestone_score, probation_extension_days, probation_scheduled_end"
          - "append TrainingRecordEntry { kind: STAGE_ENTRY, stage_code: 'PROBATION', hours_delta: 0.00 }"
        note: "Phase 2+ rotations may run while pipeline_stage == PROBATION; that is what lets a rotation flipping to REMEDIAL push the probation schedule."
      - from: PROBATION
        to: CERTIFIED
        trigger: "POST /academy-classes/{classId}/certify-graduates (per-recruit, bulk)"
        actor: AcademyDirector
        preconditions:
          - "recruit.probation_status == PASSED"
          - "recruit.credited_hours_total >= standard.min_total_hours (ATTENDED_BASIS variant)"
          - "for every topic_requirements entry t: recruit.per_topic_credited_hours[t.topic_code] >= t.required_hours"
          - "for every topic_requirements entry t with exam_required == true: an Examination row exists with recruit_id == recruit.id, topic_code == t.topic_code and status == PASSED"
        side_effects:
          - "pipeline_stage := CERTIFIED"
          - "append TrainingRecordEntry { kind: CERTIFICATION_ISSUED, stage_code: 'PROBATION', hours_delta: 0.00 }"
          - "AcademyClass.graduated_count re-derived"
        note: "Recruits failing any precondition are SKIPPED (reported in the response's skipped array), not rejected."
      - from: SCREENING
        to: DISMISSED
        trigger: "POST /recruits/{recruitId}/dismiss { reason_code, justification } with reason_code != VOLUNTARY_WITHDRAWAL"
        actor: AcademyDirector
        preconditions:
          - "recruit.pipeline_stage NOT IN {CERTIFIED, DISMISSED, WITHDRAWN}"
        side_effects:
          - "pipeline_stage := DISMISSED; dismissal_reason_code := reason_code"
          - "every ScreeningRecord of this recruit with status IN {ORDERED, FINDINGS_RECORDED, RETEST_REQUIRED} is left untouched (terminal-only cascade)"
          - "append TrainingRecordEntry { kind: ADVERSE_EXIT, stage_code: 'SCREENING', hours_delta: 0.00 }"
      - from: ACADEMY
        to: DISMISSED
        trigger: "POST /recruits/{recruitId}/dismiss { reason_code, justification } with reason_code != VOLUNTARY_WITHDRAWAL"
        actor: AcademyDirector
        preconditions:
          - "recruit.pipeline_stage NOT IN {CERTIFIED, DISMISSED, WITHDRAWN}"
        side_effects:
          - "pipeline_stage := DISMISSED; dismissal_reason_code := reason_code"
          - "every AttendanceRecord of this recruit with ledger_status == PROVISIONAL is set ledger_status := VOIDED, void_reason := 'recruit exited pipeline'"
          - "each CourseSession that lost a row re-derives enrolled_count; a SCHEDULED session whose enrolled_count < min_enrollment moves to UNDER_MIN_ENROLLMENT"
          - "append TrainingRecordEntry { kind: ADVERSE_EXIT, stage_code: 'ACADEMY', hours_delta: 0.00 }"
      - from: FIELD_TRAINING
        to: DISMISSED
        trigger: "POST /recruits/{recruitId}/dismiss { reason_code, justification } with reason_code != VOLUNTARY_WITHDRAWAL"
        actor: AcademyDirector
        preconditions:
          - "recruit.pipeline_stage NOT IN {CERTIFIED, DISMISSED, WITHDRAWN}"
        side_effects:
          - "pipeline_stage := DISMISSED; dismissal_reason_code := reason_code"
          - "every FieldTrainingRotation of this recruit with status IN {PLANNED, ACTIVE, REMEDIAL} is set status := ABORTED, abort_reason := 'recruit exited pipeline'; each such rotation's non-voided ObservationReport rows get voided := true; each affected Instructor re-derives active_trainee_count"
          - "append TrainingRecordEntry { kind: ADVERSE_EXIT, stage_code: 'FIELD_TRAINING', hours_delta: 0.00 }"
      - from: PROBATION
        to: DISMISSED
        trigger: "POST /recruits/{recruitId}/dismiss { reason_code, justification } with reason_code != VOLUNTARY_WITHDRAWAL"
        actor: AcademyDirector
        preconditions:
          - "recruit.pipeline_stage NOT IN {CERTIFIED, DISMISSED, WITHDRAWN}"
        side_effects:
          - "pipeline_stage := DISMISSED; dismissal_reason_code := reason_code"
          - "probation_status := SEPARATED (from ACTIVE or EXTENSION_REQUIRED)"
          - "every FieldTrainingRotation of this recruit with status IN {PLANNED, ACTIVE, REMEDIAL} is set status := ABORTED; affected Instructor rows re-derive active_trainee_count"
          - "append TrainingRecordEntry { kind: ADVERSE_EXIT, stage_code: 'PROBATION', hours_delta: 0.00 }"
      - from: SCREENING
        to: WITHDRAWN
        trigger: "POST /recruits/{recruitId}/dismiss { reason_code: 'VOLUNTARY_WITHDRAWAL', justification }"
        actor: AcademyDirector
        preconditions:
          - "recruit.pipeline_stage NOT IN {CERTIFIED, DISMISSED, WITHDRAWN}"
        side_effects:
          - "pipeline_stage := WITHDRAWN; dismissal_reason_code := VOLUNTARY_WITHDRAWAL"
          - "append TrainingRecordEntry { kind: ADVERSE_EXIT, stage_code: 'SCREENING', hours_delta: 0.00 }"
        note: "The same dismiss endpoint routes to WITHDRAWN instead of DISMISSED purely on reason_code; the ADVERSE_EXIT entry is written in both cases and WITHDRAWN exits are excluded from the attrition numerator."
      - from: ACADEMY
        to: WITHDRAWN
        trigger: "POST /recruits/{recruitId}/dismiss { reason_code: 'VOLUNTARY_WITHDRAWAL', justification }"
        actor: AcademyDirector
        preconditions:
          - "recruit.pipeline_stage NOT IN {CERTIFIED, DISMISSED, WITHDRAWN}"
        side_effects:
          - "pipeline_stage := WITHDRAWN; dismissal_reason_code := VOLUNTARY_WITHDRAWAL"
          - "every AttendanceRecord of this recruit with ledger_status == PROVISIONAL is set ledger_status := VOIDED"
          - "each affected CourseSession re-derives enrolled_count and may move SCHEDULED -> UNDER_MIN_ENROLLMENT"
          - "append TrainingRecordEntry { kind: ADVERSE_EXIT, stage_code: 'ACADEMY', hours_delta: 0.00 }"

  - entity: Recruit
    dimension: clearance_status
    initial_state: PENDING
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: PENDING
        to: PARTIAL
        trigger: "POST /screening-records/{screeningRecordId}/adjudicate (system re-derivation after any adjudication)"
        actor: system
        preconditions:
          - "at least one ScreeningRecord of the recruit has status IN {CLEARED, WAIVED}"
          - "fewer than 4 ScreeningRecord rows of the recruit have status IN {CLEARED, WAIVED}"
          - "no ScreeningRecord of the recruit has status == DISQUALIFIED"
        side_effects:
          - "clearance_status := PARTIAL"
        note: "Evolves independently of pipeline_stage; a PARTIAL recruit stays in pipeline_stage SCREENING."
      - from: PARTIAL
        to: CLEARED
        trigger: "POST /screening-records/{screeningRecordId}/adjudicate (system re-derivation after any adjudication)"
        actor: system
        preconditions:
          - "all four screening_type values BACKGROUND, MEDICAL, PSYCHOLOGICAL, PHYSICAL_FITNESS have a ScreeningRecord of this recruit with status IN {CLEARED, WAIVED}"
        side_effects:
          - "clearance_status := CLEARED"
      - from: PENDING
        to: DISQUALIFIED
        trigger: "POST /screening-records/{screeningRecordId}/adjudicate { decision: 'DISQUALIFY' }"
        actor: BackgroundInvestigator | MedicalExaminer | TrainingCoordinator
        preconditions:
          - "the adjudicated ScreeningRecord reaches status DISQUALIFIED"
        side_effects:
          - "clearance_status := DISQUALIFIED"
          - "append TrainingRecordEntry { kind: SCREENING_ADJUDICATION, stage_code: 'SCREENING', hours_delta: 0.00 }"
      - from: PARTIAL
        to: DISQUALIFIED
        trigger: "POST /screening-records/{screeningRecordId}/adjudicate { decision: 'DISQUALIFY' }"
        actor: BackgroundInvestigator | MedicalExaminer | TrainingCoordinator
        preconditions:
          - "the adjudicated ScreeningRecord reaches status DISQUALIFIED"
        side_effects:
          - "clearance_status := DISQUALIFIED"
          - "append TrainingRecordEntry { kind: SCREENING_ADJUDICATION, stage_code: 'SCREENING', hours_delta: 0.00 }"

  - entity: Recruit
    dimension: academy_status
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /recruits/{recruitId}/advance-stage { to_stage: 'ACADEMY' }"
        actor: TrainingCoordinator
        preconditions:
          - "pipeline_stage transition SCREENING -> ACADEMY succeeds"
        side_effects:
          - "academy_status := IN_PROGRESS"
      - from: IN_PROGRESS
        to: REMEDIATION
        trigger: "POST /examinations/{examinationId}/assign-remediation"
        actor: TrainingCoordinator
        preconditions:
          - "the Examination reaches status REMEDIATION_ASSIGNED"
          - "recruit.academy_status == IN_PROGRESS"
        side_effects:
          - "academy_status := REMEDIATION"
      - from: REMEDIATION
        to: IN_PROGRESS
        trigger: "POST /examinations/{examinationId}/grade (passing score)"
        actor: TrainingCoordinator
        preconditions:
          - "the graded Examination reaches status PASSED"
          - "no other Examination of this recruit has status IN {FAILED, REMEDIATION_ASSIGNED}"
        side_effects:
          - "academy_status := IN_PROGRESS"
        note: "Closes the REMEDIATION loop; academy_status oscillates IN_PROGRESS <-> REMEDIATION once per remediation cycle."
      - from: IN_PROGRESS
        to: DISMISSAL_PENDING
        trigger: "POST /examinations/{examinationId}/grade (failing score on the final permitted attempt) OR POST /course-sessions/{courseSessionId}/deliver (absence threshold breach)"
        actor: system
        preconditions:
          - "the graded Examination reaches status FAILED_FINAL, OR recruit.unexcused_absence_hours > standard.max_absence_hours after the delivery"
        side_effects:
          - "academy_status := DISMISSAL_PENDING"
          - "every AttendanceRecord of this recruit with ledger_status == PROVISIONAL is set ledger_status := VOIDED, void_reason := 'academy dismissal pending'"
          - "each CourseSession that lost a row re-derives enrolled_count; every such session with status == SCHEDULED and enrolled_count < min_enrollment moves to UNDER_MIN_ENROLLMENT"
          - "append TrainingRecordEntry { kind: EXAM_RESULT or ADVERSE_EXIT, stage_code: 'ACADEMY', hours_delta: 0.00 }"
      - from: REMEDIATION
        to: DISMISSAL_PENDING
        trigger: "POST /examinations/{examinationId}/grade (failing score on the final permitted attempt)"
        actor: system
        preconditions:
          - "the graded Examination reaches status FAILED_FINAL"
        side_effects:
          - "academy_status := DISMISSAL_PENDING"
          - "every AttendanceRecord of this recruit with ledger_status == PROVISIONAL is set ledger_status := VOIDED, void_reason := 'academy dismissal pending'"
          - "each CourseSession that lost a row re-derives enrolled_count; every such session with status == SCHEDULED and enrolled_count < min_enrollment moves to UNDER_MIN_ENROLLMENT"
          - "append TrainingRecordEntry { kind: EXAM_RESULT, stage_code: 'ACADEMY', hours_delta: 0.00 }"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /recruits/{recruitId}/advance-stage { to_stage: 'FIELD_TRAINING' } is REJECTED unless academy_status is already COMPLETE; COMPLETE is reached by POST /course-sessions/{courseSessionId}/deliver when the class curriculum is satisfied for this recruit"
        actor: system
        preconditions:
          - "recruit.academy_status == IN_PROGRESS"
          - "for every topic_requirements entry t of the class standard: recruit.per_topic_credited_hours[t.topic_code] >= t.required_hours"
          - "for every topic_requirements entry t with exam_required == true: an Examination of this recruit with topic_code == t.topic_code has status == PASSED"
          - "recruit.unexcused_absence_hours <= standard.max_absence_hours"
        side_effects:
          - "academy_status := COMPLETE"
          - "append TrainingRecordEntry { kind: STAGE_ENTRY, stage_code: 'ACADEMY', hours_delta: 0.00, detail: 'academy curriculum satisfied' }"

  - entity: Recruit
    dimension: probation_status
    initial_state: NOT_APPLICABLE
    terminal_states: [PASSED, SEPARATED]
    transitions:
      - from: NOT_APPLICABLE
        to: ACTIVE
        trigger: "POST /recruits/{recruitId}/advance-stage { to_stage: 'PROBATION' }"
        actor: TrainingCoordinator
        preconditions:
          - "pipeline_stage transition FIELD_TRAINING -> PROBATION succeeds"
        side_effects:
          - "probation_status := ACTIVE"
          - "recompute calculations.probation_schedule"
      - from: ACTIVE
        to: EXTENSION_REQUIRED
        trigger: "POST /field-training-rotations/{rotationId}/observation-reports (system cascade when the rotation flips ACTIVE -> REMEDIAL)"
        actor: system
        preconditions:
          - "a FieldTrainingRotation of this recruit transitioned ACTIVE -> REMEDIAL in this request"
          - "recruit.probation_status == ACTIVE"
        side_effects:
          - "probation_status := EXTENSION_REQUIRED"
          - "because probation_status changed, recompute calculations.probation_schedule -> probation_milestone_score, probation_extension_days, probation_scheduled_end"
          - "append TrainingRecordEntry { kind: PROBATION_DECISION, stage_code: 'PROBATION', hours_delta: 0.00, detail: 'extension required after remedial rotation' }"
      - from: EXTENSION_REQUIRED
        to: ACTIVE
        trigger: "POST /recruits/{recruitId}/probation-decisions { decision: 'EXTEND' } OR POST /field-training-rotations/{rotationId}/abort (compensating cascade)"
        actor: AcademyDirector | system
        preconditions:
          - "recruit.probation_status == EXTENSION_REQUIRED"
          - "for the abort cascade: no FieldTrainingRotation of this recruit remains with status == REMEDIAL"
        side_effects:
          - "probation_status := ACTIVE"
          - "recompute calculations.probation_schedule"
          - "append TrainingRecordEntry { kind: PROBATION_DECISION, stage_code: 'PROBATION', hours_delta: 0.00 }"
        note: "Closes the ACTIVE <-> EXTENSION_REQUIRED loop. The abort path is the compensating action for the DOR cascade."
      - from: ACTIVE
        to: PASSED
        trigger: "POST /recruits/{recruitId}/probation-decisions { decision: 'PASS' }"
        actor: AcademyDirector
        preconditions:
          - "recruit.probation_status == ACTIVE"
          - "logical clock date >= recruit.probation_milestone_due_date"
          - "recruit.probation_milestone_score is not null"
        side_effects:
          - "probation_status := PASSED"
          - "append TrainingRecordEntry { kind: PROBATION_DECISION, stage_code: 'PROBATION', hours_delta: 0.00 }"
      - from: EXTENSION_REQUIRED
        to: SEPARATED
        trigger: "POST /recruits/{recruitId}/probation-decisions { decision: 'SEPARATE' }"
        actor: AcademyDirector
        preconditions:
          - "recruit.probation_status == EXTENSION_REQUIRED"
        side_effects:
          - "probation_status := SEPARATED"
          - "pipeline_stage := DISMISSED; dismissal_reason_code := PROBATION_SEPARATION"
          - "every FieldTrainingRotation of this recruit with status IN {PLANNED, ACTIVE, REMEDIAL} is set status := ABORTED; affected Instructor rows re-derive active_trainee_count"
          - "append TrainingRecordEntry { kind: ADVERSE_EXIT, stage_code: 'PROBATION', hours_delta: 0.00 }"
      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /recruits/{recruitId}/probation-decisions { decision: 'SEPARATE' }"
        actor: AcademyDirector
        preconditions:
          - "recruit.probation_status == ACTIVE"
        side_effects:
          - "probation_status := SEPARATED"
          - "pipeline_stage := DISMISSED; dismissal_reason_code := PROBATION_SEPARATION"
          - "append TrainingRecordEntry { kind: ADVERSE_EXIT, stage_code: 'PROBATION', hours_delta: 0.00 }"

  - entity: ScreeningRecord
    initial_state: ORDERED
    terminal_states: [CLEARED, WAIVED, DISQUALIFIED]
    transitions:
      - from: ORDERED
        to: FINDINGS_RECORDED
        trigger: "POST /screening-records/{screeningRecordId}/findings"
        actor: BackgroundInvestigator | MedicalExaminer | TrainingCoordinator
        preconditions:
          - "screening_record.status == ORDERED"
          - "the acting role matches the screening_type per the RBAC matrix"
          - "for screening_type == PHYSICAL_FITNESS: raw_metrics carries all four event keys"
        side_effects:
          - "status := FINDINGS_RECORDED; raw_metrics, disqualifier_codes stored"
          - "findings_recorded_by_user_id := X-User-ID; findings_recorded_at := logical clock"
          - "for PHYSICAL_FITNESS: composite_score := calculations.physical_fitness_composite"
      - from: FINDINGS_RECORDED
        to: CLEARED
        trigger: "POST /screening-records/{screeningRecordId}/adjudicate { decision: 'CLEAR' }"
        actor: BackgroundInvestigator | MedicalExaminer | TrainingCoordinator
        preconditions:
          - "screening_record.status == FINDINGS_RECORDED"
          - "X-User-ID != screening_record.findings_recorded_by_user_id (segregation of duties)"
          - "screening_record.disqualifier_codes is empty"
          - "for PHYSICAL_FITNESS: composite_score >= standard.fitness_pass_score"
        side_effects:
          - "status := CLEARED; adjudicated_by_user_id := X-User-ID"
          - "Recruit.clearance_status re-derived (PENDING -> PARTIAL -> CLEARED)"
          - "append TrainingRecordEntry { kind: SCREENING_ADJUDICATION, stage_code: 'SCREENING', hours_delta: 0.00 }"
      - from: FINDINGS_RECORDED
        to: WAIVED
        trigger: "POST /screening-records/{screeningRecordId}/adjudicate { decision: 'WAIVE', waiver_justification }"
        actor: BackgroundInvestigator | MedicalExaminer
        preconditions:
          - "screening_record.status == FINDINGS_RECORDED"
          - "X-User-ID != screening_record.findings_recorded_by_user_id"
          - "waiver_justification is a non-empty string"
          - "screening_type IN {BACKGROUND, MEDICAL, PSYCHOLOGICAL} (physical fitness shortfalls are never waivable)"
        side_effects:
          - "status := WAIVED; waiver_justification stored; adjudicated_by_user_id := X-User-ID"
          - "Recruit.clearance_status re-derived"
          - "append TrainingRecordEntry { kind: SCREENING_ADJUDICATION, stage_code: 'SCREENING', hours_delta: 0.00 }"
      - from: FINDINGS_RECORDED
        to: DISQUALIFIED
        trigger: "POST /screening-records/{screeningRecordId}/adjudicate { decision: 'DISQUALIFY' }"
        actor: BackgroundInvestigator | MedicalExaminer | TrainingCoordinator
        preconditions:
          - "screening_record.status == FINDINGS_RECORDED"
          - "X-User-ID != screening_record.findings_recorded_by_user_id"
        side_effects:
          - "status := DISQUALIFIED; adjudicated_by_user_id := X-User-ID"
          - "Recruit.clearance_status := DISQUALIFIED"
          - "append TrainingRecordEntry { kind: SCREENING_ADJUDICATION, stage_code: 'SCREENING', hours_delta: 0.00 }"
      - from: FINDINGS_RECORDED
        to: RETEST_REQUIRED
        trigger: "POST /screening-records/{screeningRecordId}/adjudicate { decision: 'RETEST' }"
        actor: TrainingCoordinator
        preconditions:
          - "screening_record.status == FINDINGS_RECORDED"
          - "X-User-ID != screening_record.findings_recorded_by_user_id"
          - "screening_type == PHYSICAL_FITNESS"
          - "composite_score < standard.fitness_pass_score"
        side_effects:
          - "status := RETEST_REQUIRED; adjudicated_by_user_id := X-User-ID"
          - "Recruit.clearance_status unchanged"
      - from: RETEST_REQUIRED
        to: FINDINGS_RECORDED
        trigger: "POST /screening-records/{screeningRecordId}/findings (retest)"
        actor: TrainingCoordinator
        preconditions:
          - "screening_record.status == RETEST_REQUIRED"
        side_effects:
          - "status := FINDINGS_RECORDED; attempt_number += 1"
          - "raw_metrics, disqualifier_codes replaced; composite_score recomputed"
          - "findings_recorded_by_user_id := X-User-ID; adjudicated_by_user_id := null"
        note: "Closes the FINDINGS_RECORDED <-> RETEST_REQUIRED loop; the segregation-of-duties comparison is re-armed against the new recorder."

  - entity: Instructor
    initial_state: UNCERTIFIED
    terminal_states: [REVOKED]
    transitions:
      - from: UNCERTIFIED
        to: CERTIFIED
        trigger: "POST /instructors/{instructorId}/certify"
        actor: AcademyDirector
        preconditions:
          - "instructor.certification_status IN {UNCERTIFIED, EXPIRED}"
          - "certification_expires_at is strictly after the current logical clock"
        side_effects:
          - "certification_status := CERTIFIED; certification_expires_at, authorized_topic_codes, fto_certified replaced from the request"
      - from: EXPIRED
        to: CERTIFIED
        trigger: "POST /instructors/{instructorId}/certify (re-certification)"
        actor: AcademyDirector
        preconditions:
          - "instructor.certification_status == EXPIRED"
          - "certification_expires_at is strictly after the current logical clock"
        side_effects:
          - "certification_status := CERTIFIED; certification_expires_at, authorized_topic_codes, fto_certified replaced"
        note: "Closes the CERTIFIED -> EXPIRED -> CERTIFIED loop."
      - from: CERTIFIED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (system sweep)"
        actor: system
        preconditions:
          - "instructor.certification_status == CERTIFIED"
          - "the new logical clock instant is strictly after instructor.certification_expires_at"
        side_effects:
          - "certification_status := EXPIRED"
          - "no LessonPlan or CourseSession is touched by expiry; expiry is enforced at the next scheduling attempt"
      - from: CERTIFIED
        to: REVOKED
        trigger: "POST /instructors/{instructorId}/revoke-certification { reason }"
        actor: AcademyDirector
        preconditions:
          - "instructor.certification_status IN {CERTIFIED, EXPIRED}"
        side_effects:
          - "certification_status := REVOKED; fto_certified := false; revocation_reason := reason"
          - "CASCADE L2 (because certification_status became REVOKED): every LessonPlan with instructor_id == this instructor and status == APPROVED moves APPROVED -> REVISION_REQUESTED, approved_revision_number := null, reviewer_notes := 'authoring instructor certification revoked'"
          - "CASCADE L3 (because those LessonPlans left APPROVED): every CourseSession whose lesson_plan_id is in that set and whose status IN {SCHEDULED, UNDER_MIN_ENROLLMENT} moves to CANCELLED"
          - "CASCADE L4 (because those CourseSessions were cancelled): each affected AcademyClass re-derives projected_topic_hours; a class with status == IN_SESSION for which any topic_requirements entry t has projected_topic_hours[t.topic_code] < t.required_hours moves IN_SESSION -> AT_RISK"
          - "every FieldTrainingRotation with fto_instructor_id == this instructor and status IN {PLANNED, ACTIVE, REMEDIAL} moves to ABORTED, abort_reason := 'FTO certification revoked'; active_trainee_count re-derived"
      - from: EXPIRED
        to: REVOKED
        trigger: "POST /instructors/{instructorId}/revoke-certification { reason }"
        actor: AcademyDirector
        preconditions:
          - "instructor.certification_status == EXPIRED"
        side_effects:
          - "certification_status := REVOKED; fto_certified := false; revocation_reason := reason"
          - "the same L2 -> L3 -> L4 cascade chain as from CERTIFIED"

  - entity: LessonPlan
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /lesson-plans/{lessonPlanId}/approve"
        actor: AcademyDirector
        preconditions:
          - "lesson_plan.status == SUBMITTED"
          - "the authoring Instructor has certification_status == CERTIFIED"
          - "lesson_plan.topic_code IS IN the authoring instructor's authorized_topic_codes"
          - "the acting X-User-ID differs from the authoring instructor's user id (lesson_plan.instructor_id); segregation of duties, ERR_SAME_ACTOR_ADJUDICATION"
        side_effects:
          - "status := APPROVED; approved_revision_number := revision_number; approved_at := logical clock; approved_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /lesson-plans/{lessonPlanId}/request-revision { reviewer_notes }"
        actor: AcademyDirector
        preconditions:
          - "lesson_plan.status == SUBMITTED"
        side_effects:
          - "status := REVISION_REQUESTED; reviewer_notes stored"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /lesson-plans/{lessonPlanId}/revisions { expected_lesson_plan_version, contact_hours, revision_notes }"
        actor: AcademyInstructor
        preconditions:
          - "lesson_plan.status IN {REVISION_REQUESTED, APPROVED}"
          - "X-User-ID == lesson_plan.instructor_id"
          - "request expected_lesson_plan_version == lesson_plan.version"
        side_effects:
          - "status := SUBMITTED; revision_number += 1; contact_hours replaced; reviewer_notes := null"
          - "increments LessonPlan.version by 1"
        note: "Closes the SUBMITTED -> REVISION_REQUESTED -> SUBMITTED revision loop."
      - from: APPROVED
        to: SUBMITTED
        trigger: "POST /lesson-plans/{lessonPlanId}/revisions { expected_lesson_plan_version, contact_hours, revision_notes }"
        actor: AcademyInstructor
        preconditions:
          - "lesson_plan.status == APPROVED"
          - "X-User-ID == lesson_plan.instructor_id"
          - "request expected_lesson_plan_version == lesson_plan.version"
        side_effects:
          - "status := SUBMITTED; revision_number += 1; approved_revision_number is LEFT UNCHANGED so already-created CourseSession rows keep a resolvable pin"
          - "increments LessonPlan.version by 1"
        note: "A new revision legitimately supersedes the approved one; sessions created before this revision now hold a stale pin and are blocked at delivery by ERR_LESSON_PLAN_NOT_APPROVED."
      - from: APPROVED
        to: REVISION_REQUESTED
        trigger: "POST /instructors/{instructorId}/revoke-certification (system cascade L2)"
        actor: system
        preconditions:
          - "lesson_plan.status == APPROVED"
          - "the authoring Instructor's certification_status became REVOKED in this request"
        side_effects:
          - "status := REVISION_REQUESTED; approved_revision_number := null; reviewer_notes := 'authoring instructor certification revoked'"

  - entity: CourseSession
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: UNDER_MIN_ENROLLMENT
        trigger: "system cascade whenever this session's enrolled_count is re-derived downward (recruit exits pipeline, academy_status -> DISMISSAL_PENDING)"
        actor: system
        preconditions:
          - "course_session.status == SCHEDULED"
          - "course_session.enrolled_count < course_session.min_enrollment after the re-derivation"
        side_effects:
          - "status := UNDER_MIN_ENROLLMENT"
      - from: UNDER_MIN_ENROLLMENT
        to: SCHEDULED
        trigger: "POST /course-sessions/{courseSessionId}/attendance"
        actor: TrainingCoordinator
        preconditions:
          - "course_session.status == UNDER_MIN_ENROLLMENT"
          - "course_session.enrolled_count >= course_session.min_enrollment after the new row is added"
        side_effects:
          - "status := SCHEDULED"
        note: "Closes the SCHEDULED <-> UNDER_MIN_ENROLLMENT loop."
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /course-sessions/{courseSessionId}/deliver"
        actor: TrainingCoordinator
        preconditions:
          - "course_session.status == SCHEDULED"
          - "the referenced LessonPlan has status == APPROVED"
          - "course_session.pinned_lesson_plan_revision == LessonPlan.approved_revision_number"
          - "the session Instructor has certification_status == CERTIFIED and course_session.topic_code IS IN its authorized_topic_codes"
          - "current logical clock is >= course_session.ends_at"
        side_effects:
          - "status := DELIVERED"
          - "every AttendanceRecord of this session with ledger_status == PROVISIONAL moves to CREDITED; credited_hours and counted_absence_hours computed per calculations.topic_hours_ledger"
          - "for each credited row append TrainingRecordEntry { kind: HOURS_CREDIT, stage_code: 'ACADEMY', topic_code: session.topic_code, hours_delta: +credited_hours }"
          - "each attending Recruit re-derives credited_hours_total, scheduled_basis_hours_total, per_topic_credited_hours, unexcused_absence_hours, make_up_hours_owed"
          - "AcademyClass re-derives credited_topic_hours_total, unmet_topic_hours, projected_topic_hours; a class with status == FORMING moves to IN_SESSION"
          - "any Recruit whose unexcused_absence_hours is now STRICTLY GREATER THAN standard.max_absence_hours has academy_status set to DISMISSAL_PENDING (with its own PROVISIONAL-attendance void cascade)"
          - "any Recruit whose curriculum is now fully satisfied has academy_status IN_PROGRESS -> COMPLETE"
      - from: DELIVERED
        to: VOIDED
        trigger: "POST /course-sessions/{courseSessionId}/void-delivery { reason }"
        actor: TrainingCoordinator
        preconditions:
          - "course_session.status == DELIVERED"
        side_effects:
          - "status := VOIDED; void_reason := reason"
          - "every AttendanceRecord of this session with ledger_status == CREDITED moves to VOIDED; credited_hours and counted_absence_hours reset to 0.00"
          - "for each reversed row append TrainingRecordEntry { kind: HOURS_REVERSAL, stage_code: 'ACADEMY', topic_code: session.topic_code, hours_delta: -previous_credited_hours }"
          - "each affected Recruit and the AcademyClass re-derive their hour aggregates; AcademyClass.credited_topic_hours_total returns to its pre-delivery value exactly"
          - "a Recruit whose academy_status == COMPLETE but whose curriculum is no longer satisfied reverts academy_status COMPLETE -> IN_PROGRESS"
        note: "Compensating action for deliver; the named conserved quantity is AcademyClass.credited_topic_hours_total."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /instructors/{instructorId}/revoke-certification (system cascade L3)"
        actor: system
        preconditions:
          - "course_session.status == SCHEDULED"
          - "the referenced LessonPlan left APPROVED in this request as cascade L2"
        side_effects:
          - "status := CANCELLED"
          - "every AttendanceRecord of this session with ledger_status == PROVISIONAL moves to VOIDED, void_reason := 'session cancelled'"
      - from: UNDER_MIN_ENROLLMENT
        to: CANCELLED
        trigger: "POST /instructors/{instructorId}/revoke-certification (system cascade L3)"
        actor: system
        preconditions:
          - "course_session.status == UNDER_MIN_ENROLLMENT"
          - "the referenced LessonPlan left APPROVED in this request as cascade L2"
        side_effects:
          - "status := CANCELLED"
          - "every AttendanceRecord of this session with ledger_status == PROVISIONAL moves to VOIDED, void_reason := 'session cancelled'"

  - entity: AttendanceRecord
    initial_state: PROVISIONAL
    terminal_states: [VOIDED]
    transitions:
      - from: PROVISIONAL
        to: CREDITED
        trigger: "POST /course-sessions/{courseSessionId}/deliver"
        actor: TrainingCoordinator
        preconditions:
          - "attendance_record.ledger_status == PROVISIONAL"
          - "the parent CourseSession reaches status DELIVERED in this request"
        side_effects:
          - "ledger_status := CREDITED; credited_hours := calculations.topic_hours_ledger per-session value; counted_absence_hours computed"
          - "append TrainingRecordEntry { kind: HOURS_CREDIT, hours_delta: +credited_hours }"
      - from: CREDITED
        to: VOIDED
        trigger: "POST /course-sessions/{courseSessionId}/void-delivery { reason }"
        actor: TrainingCoordinator
        preconditions:
          - "attendance_record.ledger_status == CREDITED"
        side_effects:
          - "ledger_status := VOIDED; credited_hours := 0.00; counted_absence_hours := 0.00; void_reason := reason"
          - "append TrainingRecordEntry { kind: HOURS_REVERSAL, hours_delta: -previous_credited_hours }"
      - from: PROVISIONAL
        to: VOIDED
        trigger: "system cascade from Recruit academy_status -> DISMISSAL_PENDING, Recruit pipeline_stage -> DISMISSED/WITHDRAWN, or CourseSession -> CANCELLED"
        actor: system
        preconditions:
          - "attendance_record.ledger_status == PROVISIONAL"
        side_effects:
          - "ledger_status := VOIDED; void_reason set by the cascading trigger"
          - "the parent CourseSession re-derives enrolled_count"

  - entity: Examination
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED_FINAL]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /examinations/{examinationId}/grade { raw_score }"
        actor: TrainingCoordinator
        preconditions:
          - "examination.status == SCHEDULED"
          - "the examinee's academy_status IN {IN_PROGRESS, REMEDIATION}"
          - "raw_score >= examination.passing_score (INCLUSIVE lower bound)"
        side_effects:
          - "status := PASSED; raw_score, graded_at, graded_by_user_id stored"
          - "append TrainingRecordEntry { kind: EXAM_RESULT, stage_code: 'ACADEMY', topic_code, hours_delta: 0.00 }"
          - "if the recruit's academy_status == REMEDIATION and no other Examination of the recruit has status IN {FAILED, REMEDIATION_ASSIGNED}: academy_status REMEDIATION -> IN_PROGRESS"
          - "if the curriculum is now fully satisfied: academy_status IN_PROGRESS -> COMPLETE"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /examinations/{examinationId}/grade { raw_score }"
        actor: TrainingCoordinator
        preconditions:
          - "examination.status == SCHEDULED"
          - "raw_score < examination.passing_score"
          - "examination.attempt_number < 1 + standard.max_remediation_attempts"
        side_effects:
          - "status := FAILED; raw_score, graded_at, graded_by_user_id stored"
          - "append TrainingRecordEntry { kind: EXAM_RESULT, stage_code: 'ACADEMY', topic_code, hours_delta: 0.00 }"
      - from: REMEDIATION_ASSIGNED
        to: PASSED
        trigger: "POST /examinations/{examinationId}/grade { raw_score }"
        actor: TrainingCoordinator
        preconditions:
          - "examination.status == REMEDIATION_ASSIGNED"
          - "the examinee's academy_status IN {IN_PROGRESS, REMEDIATION}"
          - "raw_score >= examination.passing_score (INCLUSIVE lower bound)"
        side_effects:
          - "status := PASSED; raw_score, graded_at, graded_by_user_id stored"
          - "append TrainingRecordEntry { kind: EXAM_RESULT, stage_code: 'ACADEMY', topic_code, hours_delta: 0.00 }"
          - "if the recruit's academy_status == REMEDIATION and no other Examination of the recruit has status IN {FAILED, REMEDIATION_ASSIGNED}: academy_status REMEDIATION -> IN_PROGRESS"
          - "if the curriculum is now fully satisfied: academy_status IN_PROGRESS -> COMPLETE"
      - from: REMEDIATION_ASSIGNED
        to: FAILED
        trigger: "POST /examinations/{examinationId}/grade { raw_score }"
        actor: TrainingCoordinator
        preconditions:
          - "examination.status == REMEDIATION_ASSIGNED"
          - "raw_score < examination.passing_score"
          - "examination.attempt_number < 1 + standard.max_remediation_attempts"
        side_effects:
          - "status := FAILED; raw_score, graded_at, graded_by_user_id stored"
          - "append TrainingRecordEntry { kind: EXAM_RESULT, stage_code: 'ACADEMY', topic_code, hours_delta: 0.00 }"
        note: "Closes the FAILED -> REMEDIATION_ASSIGNED -> FAILED remediation loop on a single row."
      - from: FAILED
        to: REMEDIATION_ASSIGNED
        trigger: "POST /examinations/{examinationId}/assign-remediation { remediation_hours }"
        actor: TrainingCoordinator
        preconditions:
          - "examination.status == FAILED"
          - "the examinee's remediation_attempts_used < standard.max_remediation_attempts (the budget is per recruit and shared across topics)"
        side_effects:
          - "status := REMEDIATION_ASSIGNED; attempt_number += 1; remediation_hours += request remediation_hours"
          - "the examinee's academy_status IN_PROGRESS -> REMEDIATION"
      - from: SCHEDULED
        to: FAILED_FINAL
        trigger: "POST /examinations/{examinationId}/grade { raw_score }"
        actor: TrainingCoordinator
        preconditions:
          - "examination.status == SCHEDULED"
          - "raw_score < examination.passing_score"
          - "examination.attempt_number >= 1 + standard.max_remediation_attempts"
        side_effects:
          - "CASCADE L1: status := FAILED_FINAL; raw_score, graded_at, graded_by_user_id stored"
          - "CASCADE L2 (because the Examination became FAILED_FINAL): the examinee's academy_status moves to DISMISSAL_PENDING"
          - "CASCADE L3 (because academy_status became DISMISSAL_PENDING): every AttendanceRecord of that recruit with ledger_status == PROVISIONAL moves to VOIDED and each affected CourseSession re-derives enrolled_count"
          - "CASCADE L4 (because enrolled_count dropped): every affected CourseSession with status == SCHEDULED whose enrolled_count < min_enrollment moves to UNDER_MIN_ENROLLMENT"
          - "append TrainingRecordEntry { kind: EXAM_RESULT, stage_code: 'ACADEMY', topic_code, hours_delta: 0.00 }"
      - from: REMEDIATION_ASSIGNED
        to: FAILED_FINAL
        trigger: "POST /examinations/{examinationId}/grade { raw_score }"
        actor: TrainingCoordinator
        preconditions:
          - "examination.status == REMEDIATION_ASSIGNED"
          - "raw_score < examination.passing_score"
          - "examination.attempt_number >= 1 + standard.max_remediation_attempts"
        side_effects:
          - "the same L1 -> L2 -> L3 -> L4 cascade chain as from SCHEDULED"

  - entity: FieldTrainingRotation
    initial_state: PLANNED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /field-training-rotations/{rotationId}/activate"
        actor: TrainingCoordinator
        preconditions:
          - "rotation.status == PLANNED"
          - "the assigned Instructor (rotation.fto_instructor_id) has certification_status == CERTIFIED and fto_certified == true"
          - "the trainee Recruit has pipeline_stage IN {FIELD_TRAINING, PROBATION}"
          - "no other FieldTrainingRotation of this recruit has status == ACTIVE or REMEDIAL"
        side_effects:
          - "status := ACTIVE"
          - "the assigned Instructor re-derives active_trainee_count (+1)"
      - from: ACTIVE
        to: REMEDIAL
        trigger: "POST /field-training-rotations/{rotationId}/observation-reports (system cascade)"
        actor: system
        preconditions:
          - "rotation.status == ACTIVE"
          - "rotation.competency_score recomputed in this request is STRICTLY LESS THAN FTO_REMEDIAL_THRESHOLD (4.00)"
        side_effects:
          - "CASCADE L2: status := REMEDIAL"
          - "CASCADE L3 (because the rotation became REMEDIAL): if the trainee's probation_status == ACTIVE it moves to EXTENSION_REQUIRED"
          - "CASCADE L4 (because probation_status became EXTENSION_REQUIRED): calculations.probation_schedule is re-derived, so probation_milestone_score, probation_extension_days and probation_scheduled_end all move"
          - "the assigned Instructor's active_trainee_count is UNCHANGED (REMEDIAL still counts toward FTO load)"
      - from: REMEDIAL
        to: ACTIVE
        trigger: "POST /field-training-rotations/{rotationId}/observation-reports"
        actor: FieldTrainingOfficer
        preconditions:
          - "rotation.status == REMEDIAL"
          - "rotation.competency_score recomputed in this request is >= FTO_REMEDIAL_THRESHOLD (4.00)"
        side_effects:
          - "status := ACTIVE"
        note: "Closes the ACTIVE <-> REMEDIAL loop. The trainee's probation_status is NOT automatically restored here - only the abort path or an explicit EXTEND decision closes that loop."
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /field-training-rotations/{rotationId}/complete { final_narrative }"
        actor: TrainingCoordinator
        preconditions:
          - "rotation.status == ACTIVE"
          - "rotation.dor_count >= 1"
          - "current logical clock date is >= rotation.end_date"
        side_effects:
          - "status := COMPLETED; final_narrative stored"
          - "the assigned Instructor re-derives active_trainee_count (-1)"
          - "the trainee re-derives calculations.probation_schedule when probation_start is not null"
      - from: REMEDIAL
        to: COMPLETED
        trigger: "POST /field-training-rotations/{rotationId}/complete { final_narrative }"
        actor: TrainingCoordinator
        preconditions:
          - "rotation.status == REMEDIAL"
          - "rotation.dor_count >= 1"
          - "current logical clock date is >= rotation.end_date"
        side_effects:
          - "status := COMPLETED; final_narrative stored"
          - "the assigned Instructor re-derives active_trainee_count (-1)"
          - "the trainee re-derives calculations.probation_schedule when probation_start is not null"
      - from: PLANNED
        to: ABORTED
        trigger: "POST /field-training-rotations/{rotationId}/abort { reason }"
        actor: TrainingCoordinator
        preconditions:
          - "rotation.status == PLANNED"
        side_effects:
          - "status := ABORTED; abort_reason := reason"
          - "the assigned Instructor's active_trainee_count is UNCHANGED (PLANNED never counted)"
      - from: ACTIVE
        to: ABORTED
        trigger: "POST /field-training-rotations/{rotationId}/abort { reason }"
        actor: TrainingCoordinator
        preconditions:
          - "rotation.status == ACTIVE"
        side_effects:
          - "status := ABORTED; abort_reason := reason"
          - "every non-voided ObservationReport of this rotation gets voided := true; dor_count, remedial_flag_count, competency_score and rolling_mean_score re-derived (competency_score becomes null)"
          - "the assigned Instructor re-derives active_trainee_count (-1), restoring the pre-activation value"
      - from: REMEDIAL
        to: ABORTED
        trigger: "POST /field-training-rotations/{rotationId}/abort { reason }"
        actor: TrainingCoordinator
        preconditions:
          - "rotation.status == REMEDIAL"
        side_effects:
          - "status := ABORTED; abort_reason := reason"
          - "every non-voided ObservationReport of this rotation gets voided := true; competency_score becomes null"
          - "the assigned Instructor re-derives active_trainee_count (-1), restoring the pre-activation value"
          - "COMPENSATION: if the trainee's probation_status == EXTENSION_REQUIRED and no FieldTrainingRotation of the trainee remains with status == REMEDIAL, probation_status returns to ACTIVE and calculations.probation_schedule is re-derived, restoring probation_extension_days and probation_scheduled_end to their pre-cascade values"
        note: "Compensating action for the DOR cascade; the named conserved quantity is Instructor.active_trainee_count."

  - entity: AcademyClass
    initial_state: FORMING
    terminal_states: [GRADUATED]
    transitions:
      - from: FORMING
        to: IN_SESSION
        trigger: "POST /course-sessions/{courseSessionId}/deliver (first delivered session of the class)"
        actor: system
        preconditions:
          - "academy_class.status == FORMING"
          - "a CourseSession of this class reached status DELIVERED in this request"
        side_effects:
          - "status := IN_SESSION"
      - from: IN_SESSION
        to: AT_RISK
        trigger: "POST /instructors/{instructorId}/revoke-certification (system cascade L4) OR POST /course-sessions/{courseSessionId}/void-delivery"
        actor: system
        preconditions:
          - "academy_class.status == IN_SESSION"
          - "after re-derivation, some topic_requirements entry t of the class standard has projected_topic_hours[t.topic_code] < t.required_hours"
        side_effects:
          - "status := AT_RISK"
      - from: AT_RISK
        to: IN_SESSION
        trigger: "POST /course-sessions (a replacement session restores projected hours)"
        actor: TrainingCoordinator
        preconditions:
          - "academy_class.status == AT_RISK"
          - "after re-derivation, every topic_requirements entry t has projected_topic_hours[t.topic_code] >= t.required_hours"
        side_effects:
          - "status := IN_SESSION"
        note: "Closes the IN_SESSION <-> AT_RISK posture loop."
      - from: IN_SESSION
        to: GRADUATED
        trigger: "POST /academy-classes/{classId}/certify-graduates"
        actor: AcademyDirector
        preconditions:
          - "academy_class.status IN {IN_SESSION, AT_RISK}"
          - "at least one Recruit of the class satisfied every certification precondition and moved to CERTIFIED in this request"
        side_effects:
          - "status := GRADUATED"
          - "graduated_count re-derived"
        note: "When ZERO recruits qualify the class posture is LEFT UNCHANGED and the response reports certified_count == 0 - the empty-set edge is not an error."
      - from: AT_RISK
        to: GRADUATED
        trigger: "POST /academy-classes/{classId}/certify-graduates"
        actor: AcademyDirector
        preconditions:
          - "academy_class.status == AT_RISK"
          - "at least one Recruit of the class moved to CERTIFIED in this request"
        side_effects:
          - "status := GRADUATED"
          - "graduated_count re-derived"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: rotation-create-stale-recruit
    parent_entity: Recruit
    write_endpoint: "POST /field-training-rotations"
    occ_field: "expected_recruit_version"
    description: |
      Creating a FieldTrainingRotation against a Recruit whose version has
      advanced since the client last observed it is rejected with 412. A
      later-phase rotation legitimately supersedes the trainee's prior
      field-training assignment (prior_rotation_id chains them), so a second
      create against the same trainee would itself succeed under the product
      semantics; the stale-version check is what pins which observation of the
      trainee the assignment was written against. Recruit.version is bumped by
      every stage advance, probation re-derivation and rotation activation, so
      an assignment written against an out-of-date trainee snapshot is refused.
    error_id: ERR_STALE_RECRUIT_VERSION
    http_status: 412

  - rule_id: lesson-plan-revision-stale-plan
    parent_entity: LessonPlan
    write_endpoint: "POST /lesson-plans/{lessonPlanId}/revisions"
    occ_field: "expected_lesson_plan_version"
    description: |
      Submitting a revision against a LessonPlan whose version has advanced
      since the client last observed it is rejected with 412. A new revision
      legitimately supersedes the currently approved revision, so a second
      revision submission is valid product behaviour on its own; the
      stale-version check pins which revision the author was editing. Approval,
      revision-request and the instructor-revocation cascade all bump
      LessonPlan.version, so a revision written against a superseded snapshot
      is refused.
    error_id: ERR_STALE_LESSON_PLAN_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: topic_hours_ledger
    trigger: "on POST /course-sessions/{courseSessionId}/deliver, on POST /course-sessions/{courseSessionId}/void-delivery, and on read via GET /recruits/{recruitId}/certification-progress"
    algorithm: aggregation
    formula: |
      # --- per-session credit (this is where the rounding ORDER is pinned) ---
      attendance_factor(ar) =
          1.00  when ar.status == PRESENT
          0.75  when ar.status == PARTIAL          # PARTIAL_CREDIT_FACTOR
          0.00  when ar.status == ABSENT_EXCUSED
          0.00  when ar.status == ABSENT_UNEXCUSED

      session_credited_hours(ar) =
          ROUND_HALF_UP( ar.present_hours * attendance_factor(ar), 2 )

      # --- PINNED EVALUATION ORDER: round PER SESSION first, THEN sum. ---
      # "sum the unrounded per-session products and round once at the end" is
      # explicitly NOT the rule and produces a different cent value.
      per_topic_credited_hours(recruit, topic) =
          SUM over AttendanceRecord ar of recruit where
              ar.ledger_status == CREDITED
              AND ar.course_session.status == DELIVERED
              AND ar.course_session.topic_code == topic
          of session_credited_hours(ar)

      credited_hours_total(recruit) =
          SUM over every topic of per_topic_credited_hours(recruit, topic)
          # the per-topic sums are already 2-dp values; no further rounding applied
    input_set: "AttendanceRecord rows with ledger_status == CREDITED whose CourseSession.status == DELIVERED. Rows with ledger_status IN {PROVISIONAL, VOIDED} and sessions with status IN {SCHEDULED, UNDER_MIN_ENROLLMENT, CANCELLED, VOIDED} are excluded."
    constants:
      PARTIAL_CREDIT_FACTOR: 0.75
    precision: "2 decimal places, ROUND_HALF_UP, applied per AttendanceRecord row BEFORE summation"
    worked_example: |
      Three DELIVERED sessions of the same topic, each scheduled_hours == 2.00,
      each with an AttendanceRecord status == PARTIAL and present_hours == 1.50:
        session_credited_hours = ROUND_HALF_UP(1.50 * 0.75, 2) = ROUND_HALF_UP(1.125, 2) = 1.13
        per_topic_credited_hours = 1.13 + 1.13 + 1.13 = 3.39      <-- PINNED RESULT
        (sum-then-round would give ROUND_HALF_UP(3.375, 2) = 3.38 -- WRONG)

  - name: certified_hours_variant
    trigger: "on read via GET /recruits/{recruitId}/certification-progress (basis selects the variant) and on every Recruit hour-aggregate re-derivation"
    algorithm: aggregation
    formula: |
      ATTENDED_BASIS(recruit)  = calculations.topic_hours_ledger.credited_hours_total(recruit)

      SCHEDULED_BASIS(recruit) =
          SUM over AttendanceRecord ar of recruit where
              ar.ledger_status == CREDITED
              AND ar.course_session.status == DELIVERED
              AND ar.status IN {PRESENT, PARTIAL, ABSENT_EXCUSED}
          of ar.course_session.scheduled_hours
          # seat-time-on-roster: the recruit is credited the full scheduled block
          # for any session they were rostered to and not unexcused-absent from
    input_set: "Identical row set for both variants (ledger_status == CREDITED, session DELIVERED); the variants differ only in what each row contributes - the rounded attendance-weighted product vs the whole scheduled block."
    constants: {}
    precision: "2 decimal places, ROUND_HALF_UP"
    variants:
      - name: ATTENDED_BASIS
        when: "Written to Recruit.credited_hours_total; the ONLY basis that gates academy_status -> COMPLETE and PROBATION -> CERTIFIED"
        difference: "Each row contributes ROUND_HALF_UP(present_hours * attendance_factor, 2); PARTIAL rows lose 25% and ABSENT_EXCUSED rows contribute 0.00"
      - name: SCHEDULED_BASIS
        when: "Written to Recruit.scheduled_basis_hours_total and returned by GET /recruits/{recruitId}/certification-progress?basis=SCHEDULED; used for state reporting only"
        difference: "Each qualifying row contributes the FULL CourseSession.scheduled_hours regardless of present_hours"
    worked_example: |
      Three DELIVERED 2.00-hour sessions, all PARTIAL with present_hours 1.50:
        ATTENDED_BASIS  = 3.39   (1.13 x 3)
        SCHEDULED_BASIS = 6.00   (2.00 x 3)
      Same rows, same request, two different numbers.

  - name: field_training_competency_score
    trigger: "on POST /field-training-rotations/{rotationId}/observation-reports, on POST /field-training-rotations/{rotationId}/abort, and on GET /academy-classes/{classId}/attrition-analysis"
    algorithm: weighted_scoring
    formula: |
      dor_rating_sum(dor) = officer_safety + driving + report_writing
                          + decision_making + demeanor          # 5 integers, each 1..7
      dor_mean(dor)       = ROUND_HALF_UP(dor_rating_sum(dor) / 5, 2)   # stored on the row

      DORS = non-voided ObservationReport rows of the rotation,
             ordered by observed_on ASC, tie-break created_at ASC
      N = count(DORS)
      if N == 0: both variants are null

      # --- ROLLING_MEAN: one pooled mean over every rating, no intermediate rounding
      ROLLING_MEAN = ROUND_HALF_UP( SUM over DORS of dor_rating_sum(dor) / (5 * N), 2 )

      # --- TERMINAL_WEIGHTED: recency-weighted two-bucket mean
      k        = min(3, N)
      RECENT   = the last k rows of DORS
      EARLIER  = DORS minus RECENT
      recent_mean  = SUM over RECENT  of dor_rating_sum / (5 * k)          # unrounded
      earlier_mean = SUM over EARLIER of dor_rating_sum / (5 * (N - k))    # unrounded
                     ... and when EARLIER is empty, earlier_mean := recent_mean
      TERMINAL_WEIGHTED = ROUND_HALF_UP( RECENT_WEIGHT * recent_mean
                                      + EARLIER_WEIGHT * earlier_mean, 2 )
    input_set: "ObservationReport rows with field_training_rotation_id == rotation.id AND voided == false. Aborting a rotation voids every row, so both variants return to null."
    constants:
      RECENT_WINDOW: 3
      RECENT_WEIGHT: 0.60
      EARLIER_WEIGHT: 0.40
      FTO_REMEDIAL_THRESHOLD: 4.00
    precision: "2 decimal places, ROUND_HALF_UP, applied ONCE at the end of each variant; the intermediate bucket means are NOT rounded"
    variants:
      - name: TERMINAL_WEIGHTED
        when: "Written to FieldTrainingRotation.competency_score; the ONLY variant that drives the ACTIVE <-> REMEDIAL transition and calculations.probation_schedule step 2"
        difference: "Weights the most recent 3 DORs at 0.60 and all earlier DORs at 0.40, so a late slump dominates"
      - name: ROLLING_MEAN
        when: "Written to FieldTrainingRotation.rolling_mean_score and reported by GET /academy-classes/{classId}/attrition-analysis"
        difference: "Pools every rating equally; recency carries no extra weight"
    worked_example: |
      Four DORs, ratings uniform within each report: 6,6,3,3 (rating sums 30,30,15,15):
        ROLLING_MEAN      = ROUND_HALF_UP(90 / 20, 2)                        = 4.50
        RECENT = last 3 (30,15,15) -> recent_mean = 60/15 = 4.0
        EARLIER = (30)             -> earlier_mean = 30/5 = 6.0
        TERMINAL_WEIGHTED = ROUND_HALF_UP(0.60*4.0 + 0.40*6.0, 2)            = 4.80
      Same four rows, two different scores; only 4.80 gates the REMEDIAL flip.

  - name: physical_fitness_composite
    trigger: "on POST /screening-records/{screeningRecordId}/findings when screening_type == PHYSICAL_FITNESS (initial attempt and every retest)"
    algorithm: threshold
    formula: |
      # 4 event inputs + the recruit's age_bracket = 5 inputs interacting non-linearly
      standards(age_bracket) = FITNESS_STANDARDS[recruit.age_bracket]

      ratio(push_ups)             = raw_metrics.push_ups             / standards.push_ups
      ratio(sit_ups)              = raw_metrics.sit_ups              / standards.sit_ups
      ratio(vertical_jump_inches) = raw_metrics.vertical_jump_inches / standards.vertical_jump_inches
      ratio(run_1_5_mile_seconds) = standards.run_1_5_mile_seconds / raw_metrics.run_1_5_mile_seconds
                                    # INVERTED: lower elapsed time is better

      points(e) = 25  when ratio(e) >= 1.20
                = 20  when 1.00 <= ratio(e) <  1.20
                = 12  when 0.85 <= ratio(e) <  1.00
                =  6  when 0.70 <= ratio(e) <  0.85
                =  0  when ratio(e) <  0.70
      # ratios are compared UNROUNDED against the tier bounds

      raw = points(push_ups) + points(sit_ups)
          + points(run_1_5_mile_seconds) + points(vertical_jump_inches)

      # non-linear gate: one weak event caps the whole composite below the pass mark
      composite = MIN(raw, 59)   when MIN over e of points(e) < standard.fitness_event_floor_points
                = MIN(raw, 100)  otherwise
      fitness_pass = composite >= standard.fitness_pass_score
    input_set: "The single ScreeningRecord.raw_metrics object of the current attempt plus Recruit.age_bracket; earlier attempts are ignored entirely."
    constants:
      FITNESS_STANDARDS:
        AGE_20_29: { push_ups: 30, sit_ups: 38, run_1_5_mile_seconds: 750, vertical_jump_inches: 18 }
        AGE_30_39: { push_ups: 24, sit_ups: 32, run_1_5_mile_seconds: 810, vertical_jump_inches: 16 }
        AGE_40_49: { push_ups: 18, sit_ups: 26, run_1_5_mile_seconds: 900, vertical_jump_inches: 14 }
      TIER_BOUNDS: [1.20, 1.00, 0.85, 0.70]
      TIER_POINTS: [25, 20, 12, 6, 0]
      COMPOSITE_FLOOR_CAP: 59
    precision: "composite is an integer; ratios are exact unrounded quotients"
    worked_example: |
      AGE_20_29, fitness_event_floor_points 10, fitness_pass_score 60.
      A) push_ups 36 (36/30 = 1.20 -> 25, exactly ON the >= 1.20 bound),
         sit_ups 38 (1.00 -> 20), run 700 (750/700 = 1.0714 -> 20),
         vertical_jump 13 (13/18 = 0.7222 -> 6).
         raw = 71, MIN points = 6 < 10  ->  composite = MIN(71, 59) = 59  -> FAIL
      B) identical except vertical_jump 16 (16/18 = 0.8889 -> 12).
         raw = 77, MIN points = 12 >= 10 -> composite = MIN(77, 100) = 77 -> PASS
      A 3-inch jump difference moves the composite by 18 points, not 6.

  - name: probation_schedule
    trigger: "on POST /recruits/{recruitId}/advance-stage { to_stage: 'PROBATION' }, on every Recruit.probation_status transition, and on every FieldTrainingRotation transition into COMPLETED, REMEDIAL or ABORTED"
    algorithm: constraint_propagation
    formula: |
      # This formula LOOKS circular: the milestone date appears to depend on the
      # scheduled end, the scheduled end depends on the extension, the extension
      # depends on the milestone score, and the milestone score depends on the
      # milestone date. The evaluation order below is PINNED as a single forward
      # pass with NO iteration and NO fixed-point search.
      #
      # STEP 1 - milestone date, derived from probation_base_days ONLY.
      #          It MUST NOT be derived from probation_scheduled_end.
      probation_milestone_due_date =
          recruit.probation_start + FLOOR(recruit.probation_base_days * MILESTONE_FRACTION) days

      # STEP 2 - milestone score: an explicit selector over the trainee's rotations.
      #   eligibility filter : FieldTrainingRotation rows with recruit_id == recruit.id
      #                        AND status IN {COMPLETED, REMEDIAL}
      #                        AND end_date <= probation_milestone_due_date
      #                        AND competency_score IS NOT NULL
      #   ranking expression : end_date DESC
      #   tie-break          : created_at DESC   (never id)
      #   empty-set fallback : probation_milestone_score := null
      probation_milestone_score = competency_score (TERMINAL_WEIGHTED) of the top-ranked row

      # STEP 3 - extension tier, keyed on the STEP 2 score.
      probation_extension_days =
            0   when probation_milestone_score IS NULL
          | 0   when probation_milestone_score >= 5.00
          | 30  when 4.00 <= probation_milestone_score <  5.00
          | 60  when probation_milestone_score <  4.00

      # STEP 4 - scheduled end, LAST. Nothing above reads this value.
      probation_scheduled_end =
          recruit.probation_start + (recruit.probation_base_days + probation_extension_days) days
    input_set: "FieldTrainingRotation rows of this recruit with status IN {COMPLETED, REMEDIAL}; PLANNED, ACTIVE and ABORTED rotations are excluded, which is why aborting a REMEDIAL rotation restores the pre-cascade extension."
    constants:
      MILESTONE_FRACTION: 0.5
      DEFAULT_BASE_DAYS: 365
      EXTENSION_TIER_BOUNDS: [5.00, 4.00]
      EXTENSION_TIER_DAYS: [0, 30, 60]
    precision: "dates are ISO 8601 calendar dates; day arithmetic is exact calendar addition; scores compared at 2 decimal places"
    worked_example: |
      probation_start 2027-01-01, probation_base_days 365.
        STEP 1: FLOOR(365 * 0.5) = 182 days -> probation_milestone_due_date = 2027-07-02
        STEP 2: one COMPLETED rotation, end_date 2027-03-31, competency_score 4.80 -> selected
        STEP 3: 4.00 <= 4.80 < 5.00 -> probation_extension_days = 30
        STEP 4: 2027-01-01 + (365 + 30) days -> probation_scheduled_end = 2028-01-31
      With no qualifying rotation: extension 0 -> probation_scheduled_end = 2028-01-01.
      A naive implementation that derived STEP 1 from probation_scheduled_end would
      get 2027-07-17 for the milestone date and can then select a different rotation.

  - name: absence_hours_accrual
    trigger: "on POST /course-sessions/{courseSessionId}/deliver and on POST /course-sessions/{courseSessionId}/void-delivery"
    algorithm: threshold
    formula: |
      unexcused_absence_hours(recruit) =
          SUM over AttendanceRecord ar of recruit where
              ar.status == ABSENT_UNEXCUSED
              AND ar.ledger_status == CREDITED
              AND ar.course_session.status == DELIVERED
          of ar.course_session.scheduled_hours

      # STRICTLY GREATER THAN. Landing exactly ON the limit does NOT trigger.
      dismissal_review_required = unexcused_absence_hours > standard.max_absence_hours
      when dismissal_review_required: recruit.academy_status := DISMISSAL_PENDING
    input_set: "ABSENT_UNEXCUSED AttendanceRecord rows with ledger_status == CREDITED only; PROVISIONAL and VOIDED rows contribute 0.00, so void-delivery walks the accrual back down."
    constants: {}
    precision: "2 decimal places, ROUND_HALF_UP on each session's scheduled_hours before summation"
    worked_example: |
      standard.max_absence_hours == 4.00.
        Two DELIVERED 2.00-hour sessions, both ABSENT_UNEXCUSED -> 4.00.
        4.00 > 4.00 is FALSE  -> academy_status stays IN_PROGRESS.
        A third DELIVERED 0.50-hour session, ABSENT_UNEXCUSED    -> 4.50.
        4.50 > 4.00 is TRUE   -> academy_status := DISMISSAL_PENDING.

  - name: attrition_and_pipeline_forecast
    trigger: "on GET /academy-classes/{classId}/attrition-analysis and GET /academy-classes/{classId}/pipeline-forecast"
    algorithm: aggregation
    formula: |
      STAGES = ["SCREENING", "ACADEMY", "FIELD_TRAINING", "PROBATION"]   # fixed order

      entered(stage) =
          COUNT of DISTINCT recruit_id over TrainingRecordEntry rows where
              academy_class_id == class.id
              AND kind == 'STAGE_ENTRY'
              AND stage_code == stage
      adverse_exits(stage) =
          COUNT of DISTINCT recruit_id over TrainingRecordEntry rows where
              academy_class_id == class.id
              AND kind == 'ADVERSE_EXIT'
              AND stage_code == stage
              AND the recruit's dismissal_reason_code != 'VOLUNTARY_WITHDRAWAL'
      # window: every entry ever written up to the current logical clock, inclusive.
      # Voluntary withdrawals are counted in `voluntary_exits(stage)` and reported
      # separately; they never enter the attrition numerator.

      attrition_rate(stage) = ROUND_HALF_UP(adverse_exits(stage) / entered(stage), 4)
                              when entered(stage) > 0
                            = null   when entered(stage) == 0      # empty-set edge

      # PINNED ORDER: the product is rounded to 4 dp BEFORE it is divided into.
      survival_to_certification =
          ROUND_HALF_UP( PRODUCT over stages with entered(stage) > 0
                           of (1 - attrition_rate(stage)), 4 )
          # stages with attrition_rate null contribute a factor of 1.0000

      voluntary_exits(stage) =
          COUNT of DISTINCT recruit_id over TrainingRecordEntry rows where
              academy_class_id == class.id
              AND kind == 'ADVERSE_EXIT'
              AND stage_code == stage
              AND the recruit's dismissal_reason_code == 'VOLUNTARY_WITHDRAWAL'
      voluntary_exits_total = SUM over STAGES of voluntary_exits(stage)

      required_applicants(target_sworn_officers) =
            CEIL( target_sworn_officers / survival_to_certification )
              when survival_to_certification > 0
          | null when survival_to_certification == 0

      # PINNED forward pass, evaluated in STAGE_ORDER, each step floored:
      per_stage_expected["SCREENING"] = required_applicants(target_sworn_officers)
      per_stage_expected[next]        = FLOOR( per_stage_expected[prev]
                                               * (1 - attrition_rate(prev)) )
          # a stage whose attrition_rate is null contributes a factor of 1 (its
          # expected count carries the previous stage's value through unchanged)
    input_set: "TrainingRecordEntry rows of kind STAGE_ENTRY and ADVERSE_EXIT scoped to this academy_class_id. HOURS_CREDIT / HOURS_REVERSAL / EXAM_RESULT / DOR_FILED / SCREENING_ADJUDICATION / PROBATION_DECISION / CERTIFICATION_ISSUED entries are excluded."
    constants:
      STAGE_ORDER: ["SCREENING", "ACADEMY", "FIELD_TRAINING", "PROBATION"]
    precision: "attrition_rate and survival_to_certification: 4 decimal places, ROUND_HALF_UP; required_applicants: integer, CEIL"
    worked_example: |
      SCREENING entered 10 / adverse 2 -> 0.2000
      ACADEMY   entered  8 / adverse 1 -> 0.1250
      FIELD_TRAINING entered 7 / adverse 0 -> 0.0000
      PROBATION entered  0             -> null (factor 1.0000)
        survival_to_certification = ROUND_HALF_UP(0.8 * 0.875 * 1.0 * 1.0, 4) = 0.7000
        required_applicants(25) = CEIL(25 / 0.7000) = CEIL(35.7142...) = 36
        required_applicants(40) = CEIL(40 / 0.7000) = CEIL(57.1428...) = 58
      per_stage_expected for target 25:
        SCREENING      = 36
        ACADEMY        = FLOOR(36 * (1 - 0.2000)) = FLOOR(28.80) = 28
        FIELD_TRAINING = FLOOR(28 * (1 - 0.1250)) = FLOOR(24.50) = 24
        PROBATION      = FLOOR(24 * (1 - 0.0000)) = 24
      If one of the three SCREENING exits above had dismissal_reason_code
      VOLUNTARY_WITHDRAWAL it would NOT be in adverse_exits(SCREENING); it would
      appear only in voluntary_exits(SCREENING) = 1 and voluntary_exits_total = 1.

  - name: session_scheduled_hours
    trigger: "on POST /course-sessions (creation) and on every read of CourseSession"
    algorithm: aggregation
    formula: |
      scheduled_hours = ROUND_HALF_UP( (ends_at - starts_at) in seconds / 3600, 2 )
    input_set: "The single CourseSession row's own starts_at and ends_at."
    constants: {}
    precision: "2 decimal places, ROUND_HALF_UP"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the eight roles declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list AND, where section 1.7 scopes a shared operation by subject, the acting role owns that subject: on POST /screening-records/{screeningRecordId}/findings and /adjudicate the target ScreeningRecord.screening_type must be owned by the acting role (BackgroundInvestigator -> BACKGROUND; MedicalExaminer -> MEDICAL or PSYCHOLOGICAL; TrainingCoordinator -> PHYSICAL_FITNESS)"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "for entity_backed roles: X-User-ID equals the owning foreign key of the target resource (AcademyInstructor -> LessonPlan.instructor_id, FieldTrainingOfficer -> FieldTrainingRotation.fto_instructor_id, Recruit -> Recruit.id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /lesson-plans/{lessonPlanId}/revisions, POST /field-training-rotations/{rotationId}/observation-reports, GET /recruits/{recruitId}, GET /recruits/{recruitId}/certification-progress"
  - priority: 10
    category: existence
    check: "every path-templated id resolves to an existing row, validated left to right"
    error_id: "ERR_CERTIFICATION_STANDARD_NOT_FOUND | ERR_ACADEMY_CLASS_NOT_FOUND | ERR_RECRUIT_NOT_FOUND | ERR_SCREENING_RECORD_NOT_FOUND | ERR_INSTRUCTOR_NOT_FOUND | ERR_LESSON_PLAN_NOT_FOUND | ERR_COURSE_SESSION_NOT_FOUND | ERR_ATTENDANCE_RECORD_NOT_FOUND | ERR_EXAMINATION_NOT_FOUND | ERR_ROTATION_NOT_FOUND | ERR_OBSERVATION_REPORT_NOT_FOUND | ERR_TRAINING_RECORD_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 12
    category: existence
    check: "every foreign-key id supplied in the request body resolves to an existing row"
    error_id: "ERR_CERTIFICATION_STANDARD_NOT_FOUND | ERR_ACADEMY_CLASS_NOT_FOUND | ERR_RECRUIT_NOT_FOUND | ERR_INSTRUCTOR_NOT_FOUND | ERR_LESSON_PLAN_NOT_FOUND | ERR_ROTATION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /academy-classes, POST /recruits, POST /lesson-plans, POST /course-sessions, POST /course-sessions/{courseSessionId}/attendance, POST /examinations, POST /field-training-rotations, POST /field-training-rotations/{rotationId}/observation-reports"
  - priority: 20
    category: business_constraint
    check: "request body shape: required fields present, types correct, enum members valid, numeric ranges honored, ISO 8601 dates/instants well formed, dimension_ratings carries exactly the five keys with integers 1..7"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 21
    category: business_constraint
    check: "CourseSession ends_at is strictly after starts_at; FieldTrainingRotation end_date >= start_date"
    error_id: ERR_INVALID_INTERVAL
    http_status: 400
    applies_to: "POST /course-sessions, POST /field-training-rotations"
  - priority: 22
    category: business_constraint
    check: "pagination limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "every list endpoint"
  - priority: 23
    category: business_constraint
    check: "POST /_clock/set_current_utc target instant is not earlier than the current logical clock"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 400
    applies_to: "POST /_clock/set_current_utc"
  - priority: 24
    category: business_constraint
    check: "uniqueness: CertificationStandard.code, AcademyClass.class_code, Recruit.applicant_number, Instructor.badge_number"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /certification-standards, POST /academy-classes, POST /recruits, POST /instructors"
  - priority: 30
    category: state
    check: "OCC: request expected_recruit_version equals Recruit.version / expected_lesson_plan_version equals LessonPlan.version"
    error_id: "ERR_STALE_RECRUIT_VERSION | ERR_STALE_LESSON_PLAN_VERSION"
    http_status: 412
    applies_to: "POST /field-training-rotations, POST /lesson-plans/{lessonPlanId}/revisions"
  - priority: 39
    category: state
    check: "the subject Recruit's pipeline_stage is not one of the terminal states CERTIFIED, DISMISSED, WITHDRAWN. This gate is evaluated BEFORE the priority-40 per-entity state family: once a recruit is terminal, every mutation naming it returns ERR_RECRUIT_TERMINAL rather than the narrower ERR_STAGE_TRANSITION_NOT_ALLOWED / ERR_PROBATION_NOT_ACTIVE / ERR_INVALID_STATE that the same request would also violate"
    error_id: ERR_RECRUIT_TERMINAL
    http_status: 409
    applies_to: "POST /recruits/{recruitId}/screenings, POST /recruits/{recruitId}/advance-stage, POST /recruits/{recruitId}/dismiss, POST /recruits/{recruitId}/probation-decisions, POST /examinations, POST /field-training-rotations, POST /course-sessions/{courseSessionId}/attendance"
  - priority: 40
    category: state
    check: "the target row is in a state from which the requested transition is declared in section 1.2"
    error_id: "ERR_INVALID_STATE | ERR_SCREENING_ALREADY_ADJUDICATED | ERR_SESSION_NOT_DELIVERABLE | ERR_SESSION_NOT_VOIDABLE | ERR_ROTATION_NOT_ACTIVE | ERR_PROBATION_NOT_ACTIVE | ERR_STAGE_TRANSITION_NOT_ALLOWED"
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 42
    category: state
    check: "the examinee's academy_status is IN_PROGRESS or REMEDIATION (not NOT_STARTED, DISMISSAL_PENDING or COMPLETE)"
    error_id: ERR_RECRUIT_NOT_IN_ACADEMY
    http_status: 409
    applies_to: "POST /examinations, POST /examinations/{examinationId}/grade, POST /examinations/{examinationId}/assign-remediation, POST /course-sessions/{courseSessionId}/attendance"
  - priority: 50
    category: business_safety
    check: "the session/plan Instructor has certification_status == CERTIFIED and the topic_code is in its authorized_topic_codes"
    error_id: ERR_INSTRUCTOR_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /course-sessions, POST /course-sessions/{courseSessionId}/deliver, POST /lesson-plans/{lessonPlanId}/approve"
  - priority: 51
    category: business_safety
    check: "the session Instructor's certification_expires_at is strictly after the current logical clock"
    error_id: ERR_INSTRUCTOR_CERT_EXPIRED
    http_status: 422
    applies_to: "POST /course-sessions, POST /course-sessions/{courseSessionId}/deliver"
  - priority: 52
    category: business_safety
    check: "the referenced LessonPlan has status == APPROVED and course_session.pinned_lesson_plan_revision equals LessonPlan.approved_revision_number"
    error_id: ERR_LESSON_PLAN_NOT_APPROVED
    http_status: 422
    applies_to: "POST /course-sessions, POST /course-sessions/{courseSessionId}/deliver"
  - priority: 53
    category: business_safety
    check: "the recruit's clearance_status == CLEARED before entering the academy phase"
    error_id: ERR_CLEARANCE_INCOMPLETE
    http_status: 422
    applies_to: "POST /recruits/{recruitId}/advance-stage"
  - priority: 54
    category: business_safety
    check: "a ScreeningRecord carrying a non-empty disqualifier_codes array is not adjudicated CLEAR; PHYSICAL_FITNESS shortfalls are never adjudicated WAIVE"
    error_id: ERR_DISQUALIFIER_UNWAIVED
    http_status: 422
    applies_to: "POST /screening-records/{screeningRecordId}/adjudicate"
  - priority: 55
    category: business_safety
    check: "PHYSICAL_FITNESS composite_score >= standard.fitness_pass_score when the decision is CLEAR"
    error_id: ERR_FITNESS_STANDARD_NOT_MET
    http_status: 422
    applies_to: "POST /screening-records/{screeningRecordId}/adjudicate"
  - priority: 56
    category: business_safety
    check: "segregation of duties: the X-User-ID adjudicating a ScreeningRecord differs from its findings_recorded_by_user_id, AND the X-User-ID approving a LessonPlan differs from the authoring Instructor's user_id"
    error_id: ERR_SAME_ACTOR_ADJUDICATION
    http_status: 422
    applies_to: "POST /screening-records/{screeningRecordId}/adjudicate, POST /lesson-plans/{lessonPlanId}/approve"
  - priority: 57
    category: business_safety
    check: "the assigned FTO has certification_status == CERTIFIED and fto_certified == true"
    error_id: ERR_FTO_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /field-training-rotations/{rotationId}/activate"
  - priority: 60
    category: business_temporal
    check: "CLOSED-interval overlap on the trainee: the candidate rotation's [start_date, end_date] must not intersect any existing rotation of the same recruit_id with status IN {PLANNED, ACTIVE, REMEDIAL, COMPLETED}; adjacency (end_date == other.start_date) COUNTS as an intersection"
    error_id: ERR_ROTATION_DATE_OVERLAP
    http_status: 409
    applies_to: "POST /field-training-rotations"
  - priority: 61
    category: business_temporal
    check: "the ObservationReport observed_on falls within the rotation's CLOSED [start_date, end_date] interval"
    error_id: ERR_DOR_OUTSIDE_ROTATION_WINDOW
    http_status: 422
    applies_to: "POST /field-training-rotations/{rotationId}/observation-reports"
  - priority: 62
    category: business_constraint
    check: "HALF-OPEN interval overlap on the instructor: the candidate session's [starts_at, ends_at) must not intersect any session of the same instructor_id with status IN {SCHEDULED, UNDER_MIN_ENROLLMENT, DELIVERED}; same-room adjacency (gap == 0) is ALLOWED, but a gap < 15 minutes between sessions in DIFFERENT room_code values is a conflict"
    error_id: ERR_INSTRUCTOR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /course-sessions"
  - priority: 63
    category: business_constraint
    check: "rotating trainers: the candidate fto_instructor_id must not already appear as fto_instructor_id on any rotation of the same recruit_id with status IN {PLANNED, ACTIVE, REMEDIAL, COMPLETED}"
    error_id: ERR_TRAINER_ROTATION_VIOLATION
    http_status: 409
    applies_to: "POST /field-training-rotations"
  - priority: 64
    category: business_constraint
    check: "the ObservationReport author_instructor_id equals the rotation's fto_instructor_id"
    error_id: ERR_DOR_AUTHOR_NOT_ASSIGNED_FTO
    http_status: 422
    applies_to: "POST /field-training-rotations/{rotationId}/observation-reports"
  - priority: 65
    category: business_constraint
    check: "at most one non-voided ObservationReport per (field_training_rotation_id, observed_on)"
    error_id: ERR_DUPLICATE_DOR
    http_status: 409
    applies_to: "POST /field-training-rotations/{rotationId}/observation-reports"
  - priority: 66
    category: business_constraint
    check: "at most one AttendanceRecord per (course_session_id, recruit_id) regardless of ledger_status"
    error_id: ERR_ATTENDANCE_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /course-sessions/{courseSessionId}/attendance"
  - priority: 67
    category: business_constraint
    check: "at most one ScreeningRecord per (recruit_id, screening_type)"
    error_id: ERR_DUPLICATE_SCREENING_TYPE
    http_status: 409
    applies_to: "POST /recruits/{recruitId}/screenings"
  - priority: 68
    category: business_constraint
    check: "present_hours consistency: == scheduled_hours when status == PRESENT, == 0 when status starts with ABSENT_, and strictly between 0 and scheduled_hours when status == PARTIAL"
    error_id: ERR_PRESENT_HOURS_INCONSISTENT
    http_status: 422
    applies_to: "POST /course-sessions/{courseSessionId}/attendance"
  - priority: 70
    category: business_referential
    check: "the topic_code exists as a topic_requirements entry on the certification standard of the relevant AcademyClass"
    error_id: ERR_TOPIC_NOT_IN_STANDARD
    http_status: 422
    applies_to: "POST /course-sessions, POST /examinations"
  - priority: 71
    category: business_referential
    check: "the topic_requirements entry for this topic_code has exam_required == true"
    error_id: ERR_EXAM_NOT_REQUIRED_FOR_TOPIC
    http_status: 422
    applies_to: "POST /examinations"
  - priority: 72
    category: business_referential
    check: "prior_rotation_id, when supplied, references a rotation of the SAME recruit whose phase_number is exactly one less than the candidate's"
    error_id: ERR_PRIOR_ROTATION_MISMATCH
    http_status: 422
    applies_to: "POST /field-training-rotations"
  - priority: 80
    category: business_fiscal
    check: "aggregate FTO capacity: the assigned Instructor must have at most FTO_MAX_CONCURRENT_TRAINEES - 1 == 1 existing rotation with status IN {PLANNED, ACTIVE, REMEDIAL} whose CLOSED [start_date, end_date] interval intersects the candidate's interval"
    error_id: ERR_FTO_LOAD_EXCEEDED
    http_status: 409
    applies_to: "POST /field-training-rotations"
  - priority: 81
    category: business_fiscal
    check: "remediation budget is per RECRUIT and shared across topics, not per examination: recruit.remediation_attempts_used < standard.max_remediation_attempts. A recruit who has already consumed the budget on one topic cannot be granted remediation on a second, different topic even though that second examination's own attempt_number is still 1"
    error_id: ERR_REMEDIATION_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /examinations/{examinationId}/assign-remediation"
  - priority: 82
    category: business_fiscal
    check: "probation milestone gate: the current logical clock date is >= recruit.probation_milestone_due_date before a PASS decision is accepted"
    error_id: ERR_MILESTONE_NOT_REACHED
    http_status: 409
    applies_to: "POST /recruits/{recruitId}/probation-decisions"

# =============================================================================
# 1.5 API Endpoint Table   (api_prefix is "", so every path is top-level: flat topology)
# =============================================================================
endpoints:
  # --- CertificationStandard -------------------------------------------------
  - method: POST
    path: "/certification-standards"
    description: "Register a state POST certification standard with its curriculum map"
    roles: [AcademyDirector]
    code: 201
    input: [code, state_code, min_total_hours, min_passing_score, max_remediation_attempts, max_absence_hours, topic_requirements, "fitness_event_floor_points?", "fitness_pass_score?"]
    output: CertificationStandard
    side_effects: ["none"]
  - method: GET
    path: "/certification-standards/{standardId}"
    description: "Read one certification standard"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, BackgroundInvestigator, MedicalExaminer, AcademyInstructor, FieldTrainingOfficer]
    code: 200
    input: []
    output: CertificationStandard
    side_effects: ["none"]
  - method: GET
    path: "/certification-standards"
    description: "List certification standards"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, AcademyInstructor]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: CertificationStandard[]
    side_effects: ["none"]

  # --- AcademyClass ---------------------------------------------------------
  - method: POST
    path: "/academy-classes"
    description: "Open a recruit cohort against a certification standard"
    roles: [AcademyDirector]
    code: 201
    input: [certification_standard_id, class_code, start_date, planned_seats]
    output: AcademyClass
    side_effects: ["status initialised to FORMING"]
  - method: GET
    path: "/academy-classes/{classId}"
    description: "Read one cohort including credited_topic_hours_total, unmet_topic_hours and projected_topic_hours"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, AcademyInstructor, FieldTrainingOfficer]
    code: 200
    input: []
    output: AcademyClass
    side_effects: ["none"]
  - method: GET
    path: "/academy-classes"
    description: "List cohorts; filterable by owning certification standard (FK reverse-reachability for AcademyClass.certification_standard_id)"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian]
    code: 200
    input: ["certification_standard_id?", "status?", "limit?", "offset?"]
    output: AcademyClass[]
    side_effects: ["none"]
  - method: POST
    path: "/academy-classes/{classId}/certify-graduates"
    description: "Bulk-certify every eligible recruit of the cohort; ineligible recruits are SKIPPED, not rejected, and a zero-eligible run leaves the cohort posture unchanged. Each `skipped` entry is shaped { recruit_id: string, reason_code: string } where reason_code is the FIRST applicable of PROBATION_NOT_PASSED (pipeline_stage != PROBATION or probation_status != PASSED), HOURS_SHORTFALL (the recruit's own credited_hours_total, ATTENDED_BASIS, below the standard's min_total_hours - reachable whenever min_total_hours exceeds the sum of the topic_requirements hours, because academy completion only gates the per-topic minima), TOPIC_SHORTFALL (any topic_requirement entry t with recruit.per_topic_credited_hours[t.topic_code] < t.required_hours), EXAM_NOT_PASSED (any required topic without a PASSED Examination), evaluated in exactly that order; `skipped` is ordered by the recruit's created_at ascending. The cohort must be IN_SESSION or AT_RISK: on a FORMING or GRADUATED cohort the whole call is ERR_INVALID_STATE at validation priority 40, which is what makes a second certification run on the same cohort a 409 rather than a zero-count success."
    roles: [AcademyDirector]
    code: 200
    input: []
    output: "{ academy_class_id: string, class_status: string, certified_count: integer, certified_recruit_ids: string[], skipped: object[] }"
    side_effects:
      - "each eligible Recruit moves pipeline_stage PROBATION -> CERTIFIED"
      - "one TrainingRecordEntry { kind: CERTIFICATION_ISSUED } per certified recruit"
      - "AcademyClass.graduated_count re-derived; status -> GRADUATED only when certified_count >= 1"
  - method: GET
    path: "/academy-classes/{classId}/attrition-analysis"
    description: "Per-stage attrition report per calculations.attrition_and_pipeline_forecast, plus each active rotation's ROLLING_MEAN score. `stages` carries exactly one entry per STAGE_ORDER stage, in STAGE_ORDER, each shaped { stage_code: string, entered: integer, adverse_exits: integer, voluntary_exits: integer, attrition_rate: number|null }. `rolling_mean_scores` is an object keyed by rotation_id whose value is that rotation's ROLLING_MEAN variant score (2 decimal places, null while dor_count == 0), covering every rotation of the cohort with status IN {ACTIVE, REMEDIAL}."
    roles: [AcademyDirector, RecordsCustodian, TrainingCoordinator]
    code: 200
    input: []
    output: "{ academy_class_id: string, stages: object[], survival_to_certification: number, voluntary_exits_total: integer, rolling_mean_scores: object }"
    side_effects: ["none"]
  - method: GET
    path: "/academy-classes/{classId}/pipeline-forecast"
    description: "Recruiting pipeline forecast: applicants required to yield a target number of sworn officers"
    roles: [AcademyDirector, RecordsCustodian]
    code: 200
    input: [target_sworn_officers]
    output: "{ academy_class_id: string, target_sworn_officers: integer, survival_to_certification: number, required_applicants: integer, per_stage_expected: object }"
    side_effects: ["none"]

  # --- Recruit -------------------------------------------------------------
  - method: POST
    path: "/recruits"
    description: "Enrol an applicant into a cohort; pipeline_stage starts at APPLICANT and all four state dimensions at their initial values"
    roles: [TrainingCoordinator, AcademyDirector]
    code: 201
    input: [academy_class_id, applicant_number, full_name, date_of_birth, age_bracket]
    output: Recruit
    side_effects: ["none"]
  - method: GET
    path: "/recruits/{recruitId}"
    description: "Read one recruit including all four state dimensions and every derived hour/probation field"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, BackgroundInvestigator, MedicalExaminer, FieldTrainingOfficer, Recruit]
    code: 200
    input: []
    output: Recruit
    side_effects: ["none"]
  - method: GET
    path: "/recruits"
    description: "List recruits; filterable by cohort (FK reverse-reachability for Recruit.academy_class_id) and by any state dimension"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian]
    code: 200
    input: ["academy_class_id?", "pipeline_stage?", "clearance_status?", "academy_status?", "probation_status?", "limit?", "offset?"]
    output: Recruit[]
    side_effects: ["none"]
  - method: POST
    path: "/recruits/{recruitId}/advance-stage"
    description: "Advance pipeline_stage one hop; probation_start and probation_base_days are required/honoured only for to_stage == PROBATION"
    roles: [TrainingCoordinator]
    code: 200
    input: [to_stage, "probation_start?", "probation_base_days?"]
    output: Recruit
    side_effects:
      - "pipeline_stage advances per section 1.2"
      - "SCREENING -> ACADEMY also sets academy_status := IN_PROGRESS"
      - "FIELD_TRAINING -> PROBATION also sets probation_status := ACTIVE and runs calculations.probation_schedule"
      - "one TrainingRecordEntry { kind: STAGE_ENTRY } appended"
      - "increments Recruit.version by 1"
  - method: POST
    path: "/recruits/{recruitId}/dismiss"
    description: "Record a dismissal or voluntary withdrawal decision; reason_code VOLUNTARY_WITHDRAWAL routes to WITHDRAWN, every other code to DISMISSED"
    roles: [AcademyDirector]
    code: 200
    input: [reason_code, justification]
    output: Recruit
    side_effects:
      - "pipeline_stage := DISMISSED or WITHDRAWN; dismissal_reason_code stored"
      - "PROVISIONAL AttendanceRecord rows voided; affected sessions may move SCHEDULED -> UNDER_MIN_ENROLLMENT"
      - "non-terminal FieldTrainingRotation rows aborted; affected Instructor.active_trainee_count re-derived"
      - "one TrainingRecordEntry { kind: ADVERSE_EXIT } appended"
      - "increments Recruit.version by 1"
  - method: POST
    path: "/recruits/{recruitId}/probation-decisions"
    description: "Record a probationary milestone decision: PASS, EXTEND or SEPARATE"
    roles: [AcademyDirector]
    code: 200
    input: [decision, justification]
    output: Recruit
    side_effects:
      - "probation_status transitions per section 1.2"
      - "calculations.probation_schedule re-derived"
      - "SEPARATE also sets pipeline_stage := DISMISSED with dismissal_reason_code PROBATION_SEPARATION"
      - "one TrainingRecordEntry { kind: PROBATION_DECISION } appended (ADVERSE_EXIT for SEPARATE)"
      - "increments Recruit.version by 1"
  - method: GET
    path: "/recruits/{recruitId}/certification-progress"
    description: "Curriculum progress report, recomputed from current state on every read and persisted nowhere. The basis query parameter selects the ATTENDED (default) or SCHEDULED variant of calculations.certified_hours_variant and is echoed back in data.basis. `per_topic_hours` and `unmet_topic_hours` each carry exactly one entry per topic_requirements entry of the cohort standard, in the order those entries were declared, with unmet_topic_hours[t] = max(0.00, t.required_hours - per_topic_hours[t]) computed on the SELECTED basis. `exam_status` carries one entry per topic_requirements entry with exam_required == true, in that same declared order, whose value is that topic's Examination status or 'NOT_TAKEN' when no Examination row exists. `eligible_for_certification` is a curriculum verdict that ALWAYS reads the ATTENDED basis - true only when the ATTENDED total reaches min_total_hours, every ATTENDED-basis unmet topic hour is 0.00 and every exam_status entry is 'PASSED' - so basis=SCHEDULED never flips it"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, Recruit]
    code: 200
    input: ["basis?"]
    output: "{ recruit_id: string, basis: string, total_hours: number, per_topic_hours: object, unmet_topic_hours: object, exam_status: object, unexcused_absence_hours: number, make_up_hours_owed: number, eligible_for_certification: boolean }"
    side_effects: ["none"]

  # --- ScreeningRecord -----------------------------------------------------
  - method: POST
    path: "/recruits/{recruitId}/screenings"
    description: "Order one selection screening for a recruit; the FIRST such order auto-advances pipeline_stage APPLICANT -> SCREENING"
    roles: [TrainingCoordinator]
    code: 201
    input: [screening_type]
    output: ScreeningRecord
    side_effects:
      - "status initialised to ORDERED"
      - "on the first screening of the recruit: pipeline_stage := SCREENING plus one TrainingRecordEntry { kind: STAGE_ENTRY, stage_code: 'SCREENING' }, and Recruit.version increments by 1"
  - method: GET
    path: "/screening-records/{screeningRecordId}"
    description: "Read one screening record including composite_score and the two segregation-of-duties actor ids"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, BackgroundInvestigator, MedicalExaminer]
    code: 200
    input: []
    output: ScreeningRecord
    side_effects: ["none"]
  - method: GET
    path: "/screening-records"
    description: "List screening records; filterable by recruit (FK reverse-reachability for ScreeningRecord.recruit_id)"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, BackgroundInvestigator, MedicalExaminer]
    code: 200
    input: ["recruit_id?", "screening_type?", "status?", "limit?", "offset?"]
    output: ScreeningRecord[]
    side_effects: ["none"]
  - method: POST
    path: "/screening-records/{screeningRecordId}/findings"
    description: "Record (or re-record after a RETEST adjudication) the findings of a screening; the acting role must own the screening_type"
    roles: [BackgroundInvestigator, MedicalExaminer, TrainingCoordinator]
    code: 200
    input: [raw_metrics, disqualifier_codes]
    output: ScreeningRecord
    side_effects:
      - "status := FINDINGS_RECORDED; findings_recorded_by_user_id := X-User-ID; findings_recorded_at := logical clock"
      - "attempt_number += 1 when coming from RETEST_REQUIRED, and adjudicated_by_user_id resets to null"
      - "for PHYSICAL_FITNESS: composite_score := calculations.physical_fitness_composite"
  - method: POST
    path: "/screening-records/{screeningRecordId}/adjudicate"
    description: "Adjudicate a screening: CLEAR, WAIVE, DISQUALIFY or RETEST. The acting X-User-ID must differ from findings_recorded_by_user_id"
    roles: [BackgroundInvestigator, MedicalExaminer, TrainingCoordinator]
    code: 200
    input: [decision, "waiver_justification?"]
    output: ScreeningRecord
    side_effects:
      - "status moves per section 1.2; adjudicated_by_user_id := X-User-ID"
      - "Recruit.clearance_status re-derived across all four screening types; Recruit.version increments by 1"
      - "one TrainingRecordEntry { kind: SCREENING_ADJUDICATION } appended for CLEAR, WAIVE and DISQUALIFY"

  # --- Instructor ----------------------------------------------------------
  - method: POST
    path: "/instructors"
    description: "Register an academy instructor / field training officer; certification_status starts UNCERTIFIED"
    roles: [AcademyDirector]
    code: 201
    input: [badge_number, full_name]
    output: Instructor
    side_effects: ["none"]
  - method: GET
    path: "/instructors/{instructorId}"
    description: "Read one instructor including authorized_topic_codes and the conserved active_trainee_count"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, AcademyInstructor, FieldTrainingOfficer]
    code: 200
    input: []
    output: Instructor
    side_effects: ["none"]
  - method: GET
    path: "/instructors"
    description: "List instructors"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian]
    code: 200
    input: ["certification_status?", "fto_certified?", "limit?", "offset?"]
    output: Instructor[]
    side_effects: ["none"]
  - method: POST
    path: "/instructors/{instructorId}/certify"
    description: "Grant or renew instructor certification for a set of curriculum topics"
    roles: [AcademyDirector]
    code: 200
    input: [certification_expires_at, authorized_topic_codes, fto_certified]
    output: Instructor
    side_effects:
      - "certification_status := CERTIFIED (from UNCERTIFIED or EXPIRED); authorized_topic_codes and fto_certified replaced wholesale"
      - "increments Instructor.version by 1"
  - method: POST
    path: "/instructors/{instructorId}/revoke-certification"
    description: "Revoke instructor certification for cause; head of cascade C"
    roles: [AcademyDirector]
    code: 200
    input: [reason]
    output: Instructor
    side_effects:
      - "certification_status := REVOKED (terminal); authorized_topic_codes cleared; fto_certified := false"
      - "every APPROVED LessonPlan of the instructor moves APPROVED -> REVISION_REQUESTED"
      - "every SCHEDULED or UNDER_MIN_ENROLLMENT CourseSession of those plans moves to CANCELLED"
      - "each affected AcademyClass.projected_topic_hours is re-derived and may move IN_SESSION -> AT_RISK"
      - "every non-terminal FieldTrainingRotation with this instructor as FTO is aborted; active_trainee_count -> 0"

  # --- LessonPlan ----------------------------------------------------------
  - method: POST
    path: "/lesson-plans"
    description: "Submit a lesson plan for one curriculum topic; status starts SUBMITTED"
    roles: [AcademyInstructor, TrainingCoordinator]
    code: 201
    input: [instructor_id, topic_code, title, contact_hours]
    output: LessonPlan
    side_effects: ["none"]
  - method: GET
    path: "/lesson-plans/{lessonPlanId}"
    description: "Read one lesson plan including approved_revision_number"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, AcademyInstructor]
    code: 200
    input: []
    output: LessonPlan
    side_effects: ["none"]
  - method: GET
    path: "/lesson-plans"
    description: "List lesson plans; filterable by authoring instructor (FK reverse-reachability for LessonPlan.instructor_id)"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, AcademyInstructor]
    code: 200
    input: ["instructor_id?", "topic_code?", "status?", "limit?", "offset?"]
    output: LessonPlan[]
    side_effects: ["none"]
  - method: POST
    path: "/lesson-plans/{lessonPlanId}/revisions"
    description: "Revise a lesson plan under optimistic concurrency control on the plan's own version"
    roles: [AcademyInstructor, TrainingCoordinator]
    code: 200
    input: [expected_lesson_plan_version, contact_hours, revision_notes]
    output: LessonPlan
    side_effects:
      - "contact_hours replaced; revision_number += 1; status := SUBMITTED (from REVISION_REQUESTED or APPROVED); reviewer_notes := null"
      - "approved_revision_number, approved_at and approved_by_user_id are LEFT UNCHANGED (see section 1.2 LessonPlan APPROVED -> SUBMITTED) so CourseSession rows created earlier keep a resolvable pin; it is the plan leaving APPROVED that blocks their delivery with ERR_LESSON_PLAN_NOT_APPROVED"
      - "increments LessonPlan.version by 1"
  - method: POST
    path: "/lesson-plans/{lessonPlanId}/approve"
    description: "Approve a lesson plan and pin the approved revision; the approving user may not be the authoring instructor's user"
    roles: [AcademyDirector]
    code: 200
    input: []
    output: LessonPlan
    side_effects:
      - "status := APPROVED; approved_revision_number := the plan's current revision_number; approved_at and approved_by_user_id stamped"
      - "increments LessonPlan.version by 1"
  - method: POST
    path: "/lesson-plans/{lessonPlanId}/request-revision"
    description: "Send a lesson plan back for revision; legal from SUBMITTED only. An APPROVED plan is NOT sent back this way - it leaves APPROVED either through POST /lesson-plans/{lessonPlanId}/revisions (author-driven, status returns to SUBMITTED) or through the instructor-revocation cascade, so request-revision on an APPROVED plan is ERR_INVALID_STATE. Bumps LessonPlan.version"
    roles: [AcademyDirector]
    code: 200
    input: [reviewer_notes]
    output: LessonPlan
    side_effects:
      - "status := REVISION_REQUESTED; reviewer_notes stored; approved_revision_number, approved_at and approved_by_user_id cleared to null"
      - "when coming from APPROVED: every SCHEDULED or UNDER_MIN_ENROLLMENT CourseSession of the plan moves to CANCELLED and each affected AcademyClass.projected_topic_hours is re-derived"

  # --- CourseSession -------------------------------------------------------
  - method: POST
    path: "/course-sessions"
    description: "Schedule one delivery of an approved lesson plan to a cohort in a room, taught by a topic-authorized instructor"
    roles: [TrainingCoordinator]
    code: 201
    input: [academy_class_id, lesson_plan_id, instructor_id, room_code, starts_at, ends_at, "min_enrollment?"]
    output: CourseSession
    side_effects:
      - "status initialised to SCHEDULED; scheduled_hours := calculations.session_scheduled_hours; topic_code copied from the lesson plan; pinned_lesson_plan_revision := the plan's approved_revision_number"
      - "AcademyClass.projected_topic_hours re-derived; an AT_RISK cohort returns to IN_SESSION once no topic is projected short"
  - method: GET
    path: "/course-sessions/{courseSessionId}"
    description: "Read one course session including enrolled_count and credited_hours_total"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, AcademyInstructor]
    code: 200
    input: []
    output: CourseSession
    side_effects: ["none"]
  - method: GET
    path: "/course-sessions"
    description: "List course sessions; filterable by cohort, lesson plan and instructor (FK reverse-reachability for all three CourseSession FKs)"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, AcademyInstructor]
    code: 200
    input: ["academy_class_id?", "lesson_plan_id?", "instructor_id?", "topic_code?", "status?", "limit?", "offset?"]
    output: CourseSession[]
    side_effects: ["none"]
  - method: POST
    path: "/course-sessions/{courseSessionId}/attendance"
    description: "Record one recruit's attendance for a session; the row is PROVISIONAL until the session is delivered"
    roles: [AcademyInstructor, TrainingCoordinator]
    code: 201
    input: [recruit_id, status, present_hours]
    output: AttendanceRecord
    side_effects:
      - "ledger_status initialised to PROVISIONAL; credited_hours := 0.00 until delivery"
      - "CourseSession.enrolled_count re-derived; an UNDER_MIN_ENROLLMENT session may return to SCHEDULED"
  - method: GET
    path: "/attendance-records/{attendanceRecordId}"
    description: "Read one attendance record"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, AcademyInstructor]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: ["none"]
  - method: GET
    path: "/attendance-records"
    description: "List attendance records; filterable by session and by recruit (FK reverse-reachability for both AttendanceRecord FKs)"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, AcademyInstructor]
    code: 200
    input: ["course_session_id?", "recruit_id?", "ledger_status?", "limit?", "offset?"]
    output: AttendanceRecord[]
    side_effects: ["none"]
  - method: POST
    path: "/course-sessions/{courseSessionId}/deliver"
    description: "Close out a taught session: credit curriculum hours to every attendee and to the cohort ledger"
    roles: [AcademyInstructor, TrainingCoordinator]
    code: 200
    input: []
    output: CourseSession
    side_effects:
      - "status := DELIVERED; delivered_at := logical clock; the cohort moves FORMING -> IN_SESSION on its first delivered session"
      - "every PROVISIONAL AttendanceRecord moves to CREDITED with credited_hours per calculations.topic_hours_ledger"
      - "CourseSession.credited_hours_total := sum of the rows' credited_hours"
      - "AcademyClass.credited_topic_hours_total += CourseSession.credited_hours_total; unmet_topic_hours and projected_topic_hours re-derived"
      - "each attendee's Recruit.credited_hours_total, per_topic_credited_hours and unexcused_absence_hours re-derived; make_up_hours_owed may trigger"
      - "one TrainingRecordEntry { kind: HOURS_CREDIT } per credited attendance row"
  - method: POST
    path: "/course-sessions/{courseSessionId}/void-delivery"
    description: "Compensating reversal of a delivery: undoes every credit so the cohort ledger returns to its pre-delivery value"
    roles: [AcademyDirector]
    code: 200
    input: [reason]
    output: CourseSession
    side_effects:
      - "status := VOIDED (terminal); delivered_at cleared to null"
      - "every CREDITED AttendanceRecord moves to VOIDED with credited_hours reset to 0.00"
      - "AcademyClass.credited_topic_hours_total -= the session's credited_hours_total; CourseSession.credited_hours_total := 0.00"
      - "unmet_topic_hours and projected_topic_hours re-derived on the cohort, which moves IN_SESSION -> AT_RISK; each attendee's derived hour fields re-derived"
      - "one TrainingRecordEntry { kind: HOURS_REVERSAL } per voided attendance row"

  # --- Examination ---------------------------------------------------------
  - method: POST
    path: "/examinations"
    description: "Schedule a topic examination for a recruit; attempt_number is derived from the recruit's prior examinations on the same topic"
    roles: [TrainingCoordinator, AcademyInstructor]
    code: 201
    input: [recruit_id, topic_code]
    output: Examination
    side_effects:
      - "status initialised to SCHEDULED; passing_score copied from the cohort's certification standard min_passing_score"
      - "attempt_number := 1 + the count of the recruit's non-VOIDED examinations on the same topic_code"
  - method: GET
    path: "/examinations/{examinationId}"
    description: "Read one examination"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, AcademyInstructor, Recruit]
    code: 200
    input: []
    output: Examination
    side_effects: ["none"]
  - method: GET
    path: "/examinations"
    description: "List examinations; filterable by recruit (FK reverse-reachability for Examination.recruit_id)"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, AcademyInstructor]
    code: 200
    input: ["recruit_id?", "topic_code?", "status?", "limit?", "offset?"]
    output: Examination[]
    side_effects: ["none"]
  - method: POST
    path: "/examinations/{examinationId}/grade"
    description: "Grade an examination; head of cascade A when the attempt budget is exhausted"
    roles: [AcademyInstructor, TrainingCoordinator]
    code: 200
    input: [raw_score]
    output: Examination
    side_effects:
      - "raw_score stored; graded_at and graded_by_user_id stamped"
      - "status := PASSED when raw_score >= passing_score"
      - "status := FAILED when raw_score < passing_score and attempt_number <= standard.max_remediation_attempts"
      - "status := FAILED_FINAL when raw_score < passing_score and attempt_number > standard.max_remediation_attempts"
      - "FAILED_FINAL also drives Recruit.academy_status -> DISMISSAL_PENDING, voids the recruit's PROVISIONAL AttendanceRecord rows, re-derives each affected CourseSession.enrolled_count (which may move SCHEDULED -> UNDER_MIN_ENROLLMENT), and appends one TrainingRecordEntry { kind: EXAM_RESULT }"
      - "Recruit.remediation_attempts_used re-derived; Recruit.version increments by 1"
  - method: POST
    path: "/examinations/{examinationId}/assign-remediation"
    description: "Assign remedial instruction hours after a FAILED attempt, re-opening the retest loop"
    roles: [TrainingCoordinator]
    code: 200
    input: [remediation_hours]
    output: Examination
    side_effects:
      - "status := REMEDIATION_ASSIGNED; remediation_hours stored"
      - "Recruit.academy_status -> REMEDIATION; Recruit.version increments by 1"

  # --- FieldTrainingRotation -----------------------------------------------
  - method: POST
    path: "/field-training-rotations"
    description: "Plan one field training phase for a recruit under a rotating FTO, guarded by optimistic concurrency on the recruit's version"
    roles: [TrainingCoordinator]
    code: 201
    input: [recruit_id, fto_instructor_id, phase_number, start_date, end_date, expected_recruit_version, "prior_rotation_id?"]
    output: FieldTrainingRotation
    side_effects:
      - "status initialised to PLANNED; competency_score and rolling_mean_score initialised to null"
      - "increments Recruit.version by 1"
  - method: GET
    path: "/field-training-rotations/{rotationId}"
    description: "Read one rotation including dor_count, remedial_flag_count and both competency variants"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, FieldTrainingOfficer, Recruit]
    code: 200
    input: []
    output: FieldTrainingRotation
    side_effects: ["none"]
  - method: GET
    path: "/field-training-rotations"
    description: "List rotations; filterable by recruit, by FTO and by predecessor rotation (FK reverse-reachability for all three FieldTrainingRotation FKs, including the self-referential one)"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, FieldTrainingOfficer]
    code: 200
    input: ["recruit_id?", "fto_instructor_id?", "prior_rotation_id?", "status?", "limit?", "offset?"]
    output: FieldTrainingRotation[]
    side_effects: ["none"]
  - method: POST
    path: "/field-training-rotations/{rotationId}/activate"
    description: "Put a planned rotation into service; the FTO must still be CERTIFIED and fto_certified at this moment"
    roles: [TrainingCoordinator]
    code: 200
    input: []
    output: FieldTrainingRotation
    side_effects:
      - "status := ACTIVE"
      - "Instructor.active_trainee_count += 1 on the FTO"
  - method: POST
    path: "/field-training-rotations/{rotationId}/complete"
    description: "Close a rotation from ACTIVE or REMEDIAL; requires at least one non-voided ObservationReport and a logical clock date at or after end_date. Completing a REMEDIAL rotation is legal - the FTO threshold gates the ACTIVE <-> REMEDIAL loop, not this transition - and it does NOT clear a trainee's EXTENSION_REQUIRED probation posture"
    roles: [FieldTrainingOfficer, TrainingCoordinator]
    code: 200
    input: [final_narrative]
    output: FieldTrainingRotation
    side_effects:
      - "status := COMPLETED (terminal); final_narrative stored"
      - "Instructor.active_trainee_count -= 1 on the FTO"
  - method: POST
    path: "/field-training-rotations/{rotationId}/abort"
    description: "Compensating abort of an in-flight rotation: reverses the trainee-load reservation taken at activation"
    roles: [AcademyDirector, TrainingCoordinator]
    code: 200
    input: [reason]
    output: FieldTrainingRotation
    side_effects:
      - "status := ABORTED (terminal); abort_reason stored"
      - "Instructor.active_trainee_count -= 1 on the FTO when the rotation was ACTIVE or REMEDIAL; unchanged when it was PLANNED"
      - "every ObservationReport of the rotation is marked voided := true; dor_count, remedial_flag_count, competency_score and rolling_mean_score reset to their empty-set values"
  - method: POST
    path: "/field-training-rotations/{rotationId}/observation-reports"
    description: "File one standardized daily observation report; head of cascade B"
    roles: [FieldTrainingOfficer]
    code: 201
    input: [author_instructor_id, observed_on, dimension_ratings, narrative, "not_responding_to_training?"]
    output: ObservationReport
    side_effects:
      - "dor_mean computed from dimension_ratings; rotation dor_count += 1 and remedial_flag_count re-derived"
      - "rotation competency_score (TERMINAL_WEIGHTED) and rolling_mean_score (ROLLING_MEAN) re-derived per calculations.field_training_competency_score"
      - "rotation may move ACTIVE -> REMEDIAL when the recomputed TERMINAL_WEIGHTED competency_score is STRICTLY LESS THAN FTO_REMEDIAL_THRESHOLD (4.00), and REMEDIAL -> ACTIVE when it is >= 4.00. not_responding_to_training only increments remedial_flag_count; it never gates the flip on its own"
      - "ACTIVE -> REMEDIAL also drives Recruit.probation_status ACTIVE -> EXTENSION_REQUIRED, re-runs calculations.probation_schedule (moving probation_extension_days and probation_scheduled_end) and increments Recruit.version by 1"
      - "one TrainingRecordEntry { kind: DOR_FILED } appended"

  # --- ObservationReport ---------------------------------------------------
  - method: GET
    path: "/observation-reports/{observationReportId}"
    description: "Read one daily observation report"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, FieldTrainingOfficer, Recruit]
    code: 200
    input: []
    output: ObservationReport
    side_effects: ["none"]
  - method: GET
    path: "/observation-reports"
    description: "List observation reports; filterable by rotation and by authoring instructor (FK reverse-reachability for both ObservationReport FKs)"
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, FieldTrainingOfficer]
    code: 200
    input: ["field_training_rotation_id?", "author_instructor_id?", "voided?", "limit?", "offset?"]
    output: ObservationReport[]
    side_effects: ["none"]

  # --- TrainingRecordEntry (append-only, immutable) ------------------------
  - method: GET
    path: "/training-record-entries/{trainingRecordEntryId}"
    description: "Read one immutable training-record entry (certification and litigation-hold evidence)"
    roles: [AcademyDirector, RecordsCustodian, TrainingCoordinator]
    code: 200
    input: []
    output: TrainingRecordEntry
    side_effects: ["none"]
  - method: GET
    path: "/training-record-entries"
    description: "List training-record entries in append order; filterable by recruit and by cohort (FK reverse-reachability for both TrainingRecordEntry FKs)"
    roles: [AcademyDirector, RecordsCustodian, TrainingCoordinator]
    code: 200
    input: ["recruit_id?", "academy_class_id?", "kind?", "stage_code?", "limit?", "offset?"]
    output: TrainingRecordEntry[]
    side_effects: ["none"]

  # --- Test-driving clock --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint (last resort under section 1.5's priority ladder): set the service's logical UTC clock. The clock defaults to 2026-08-01T00:00:00Z at process start and every timestamp field, certification-expiry check and probation date derivation reads from it."
    roles: [AcademyDirector, TrainingCoordinator, RecordsCustodian, BackgroundInvestigator, MedicalExaminer, AcademyInstructor, FieldTrainingOfficer]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "logical clock replaced"
      - "system sweep: every Instructor with certification_status == CERTIFIED whose certification_expires_at is strictly earlier than the new instant moves to EXPIRED (see section 1.2 Instructor). No LessonPlan, CourseSession, Recruit or AcademyClass row is mutated and no other derived field is recomputed by this call alone"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is absent, empty, or names a role outside the eight declared in section 1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting X-User-Role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource it does not own: AcademyInstructor whose X-User-ID differs from LessonPlan.instructor_id, FieldTrainingOfficer whose X-User-ID differs from FieldTrainingRotation.fto_instructor_id, or Recruit whose X-User-ID differs from the target Recruit.id"

  # --- existence -------------------------------------------------------------
  - id: ERR_CERTIFICATION_STANDARD_NOT_FOUND
    http: 404
    condition: "no CertificationStandard has the given id, whether addressed in the path or referenced as AcademyClass.certification_standard_id"
  - id: ERR_ACADEMY_CLASS_NOT_FOUND
    http: 404
    condition: "no AcademyClass has the given id, whether addressed in the path or referenced as Recruit.academy_class_id or CourseSession.academy_class_id"
  - id: ERR_RECRUIT_NOT_FOUND
    http: 404
    condition: "no Recruit has the given id, whether addressed in the path or referenced as AttendanceRecord.recruit_id, Examination.recruit_id, ScreeningRecord.recruit_id or FieldTrainingRotation.recruit_id"
  - id: ERR_SCREENING_RECORD_NOT_FOUND
    http: 404
    condition: "no ScreeningRecord has the given id"
  - id: ERR_INSTRUCTOR_NOT_FOUND
    http: 404
    condition: "no Instructor has the given id, whether addressed in the path or referenced as LessonPlan.instructor_id, CourseSession.instructor_id, FieldTrainingRotation.fto_instructor_id or ObservationReport.author_instructor_id"
  - id: ERR_LESSON_PLAN_NOT_FOUND
    http: 404
    condition: "no LessonPlan has the given id, whether addressed in the path or referenced as CourseSession.lesson_plan_id"
  - id: ERR_COURSE_SESSION_NOT_FOUND
    http: 404
    condition: "no CourseSession has the given id"
  - id: ERR_ATTENDANCE_RECORD_NOT_FOUND
    http: 404
    condition: "no AttendanceRecord has the given id"
  - id: ERR_EXAMINATION_NOT_FOUND
    http: 404
    condition: "no Examination has the given id"
  - id: ERR_ROTATION_NOT_FOUND
    http: 404
    condition: "no FieldTrainingRotation has the given id, whether addressed in the path or referenced as FieldTrainingRotation.prior_rotation_id"
  - id: ERR_OBSERVATION_REPORT_NOT_FOUND
    http: 404
    condition: "no ObservationReport has the given id"
  - id: ERR_TRAINING_RECORD_ENTRY_NOT_FOUND
    http: 404
    condition: "no TrainingRecordEntry has the given id"

  # --- request shape / protocol ---------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is missing, a type is wrong, an enum member is unknown, a numeric value is out of range, an ISO 8601 value is malformed, or dimension_ratings does not carry exactly the five declared keys with integer values in 1..7"
  - id: ERR_INVALID_INTERVAL
    http: 400
    condition: "CourseSession ends_at is not strictly after starts_at, or FieldTrainingRotation end_date is earlier than start_date"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit is not an integer in 1..100, or offset is not an integer >= 0"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 400
    condition: "POST /_clock/set_current_utc names an instant earlier than the current logical clock"
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "CertificationStandard.code, AcademyClass.class_code, Recruit.applicant_number or Instructor.badge_number repeats a value already stored"

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_RECRUIT_VERSION
    http: 412
    condition: "POST /field-training-rotations carries an expected_recruit_version that does not equal the target Recruit's current version"
  - id: ERR_STALE_LESSON_PLAN_VERSION
    http: 412
    condition: "POST /lesson-plans/{lessonPlanId}/revisions carries an expected_lesson_plan_version that does not equal the target LessonPlan's current version"

  # --- state machine ---------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested trigger is not declared for the target entity's current state in section 1.2 and no more specific state error applies (for example approving a lesson plan that is already APPROVED, certifying an instructor whose certification_status is REVOKED, completing a FieldTrainingRotation that has zero ObservationReport rows, or completing a FieldTrainingRotation whose end_date is later than the current logical clock date)"
  - id: ERR_SCREENING_ALREADY_ADJUDICATED
    http: 409
    condition: "findings or adjudication is submitted for a ScreeningRecord whose status is already CLEARED, WAIVED or DISQUALIFIED (all terminal)"
  - id: ERR_SESSION_NOT_DELIVERABLE
    http: 409
    condition: "POST /course-sessions/{courseSessionId}/deliver targets a session whose status is not SCHEDULED or UNDER_MIN_ENROLLMENT, or a session whose ends_at is later than the current logical clock (a session cannot be delivered before it has finished)"
  - id: ERR_SESSION_NOT_VOIDABLE
    http: 409
    condition: "POST /course-sessions/{courseSessionId}/void-delivery targets a session whose status is not DELIVERED"
  - id: ERR_ROTATION_NOT_ACTIVE
    http: 409
    condition: "an observation report is filed against, or completion is requested for, a rotation whose status is not ACTIVE or REMEDIAL"
  - id: ERR_PROBATION_NOT_ACTIVE
    http: 409
    condition: "POST /recruits/{recruitId}/probation-decisions targets a recruit whose probation_status is not ACTIVE or EXTENSION_REQUIRED"
  - id: ERR_STAGE_TRANSITION_NOT_ALLOWED
    http: 409
    condition: "POST /recruits/{recruitId}/advance-stage names a to_stage that is not the single legal successor of the recruit's current pipeline_stage"
  - id: ERR_RECRUIT_TERMINAL
    http: 409
    condition: "any mutation targets a Recruit whose pipeline_stage is CERTIFIED, DISMISSED or WITHDRAWN"
  - id: ERR_RECRUIT_NOT_IN_ACADEMY
    http: 409
    condition: "an examination or attendance operation targets a recruit whose academy_status is not IN_PROGRESS or REMEDIATION"

  # --- business safety (certification and standards integrity) --------------
  - id: ERR_INSTRUCTOR_NOT_AUTHORIZED
    http: 422
    condition: "the instructor's certification_status is not CERTIFIED, or the topic_code is absent from its authorized_topic_codes"
  - id: ERR_INSTRUCTOR_CERT_EXPIRED
    http: 422
    condition: "the instructor's certification_expires_at is at or before the logical clock at the moment of the session's scheduled start"
  - id: ERR_LESSON_PLAN_NOT_APPROVED
    http: 422
    condition: "a CourseSession is scheduled against, or delivered from, a LessonPlan whose status is not APPROVED, or whose approved_revision_number no longer equals the session's pinned_lesson_plan_revision"
  - id: ERR_CLEARANCE_INCOMPLETE
    http: 422
    condition: "a recruit is advanced past SCREENING while clearance_status is PENDING or PARTIAL"
  - id: ERR_DISQUALIFIER_UNWAIVED
    http: 422
    condition: "a screening is CLEARED while its disqualifier_codes list is non-empty, or WAIVED without a non-empty waiver_justification, or a PHYSICAL_FITNESS screening is adjudicated WAIVE at all (fitness shortfalls are never waivable)"
  - id: ERR_FITNESS_STANDARD_NOT_MET
    http: 422
    condition: "a PHYSICAL_FITNESS screening is CLEARED or the recruit is advanced past SCREENING while the screening's composite_score is below the standard's fitness_pass_score, or any single event scores below fitness_event_floor_points"
  - id: ERR_SAME_ACTOR_ADJUDICATION
    http: 422
    condition: "the X-User-ID adjudicating a screening equals its findings_recorded_by_user_id, or the X-User-ID approving a lesson plan equals the X-User-ID of the authoring instructor"
  - id: ERR_FTO_NOT_CERTIFIED
    http: 422
    condition: "the instructor named as fto_instructor_id has fto_certified false or certification_status other than CERTIFIED"

  # --- business temporal -----------------------------------------------------
  - id: ERR_ROTATION_DATE_OVERLAP
    http: 409
    condition: "the candidate rotation's CLOSED [start_date, end_date] interval intersects another non-aborted rotation of the same recruit; adjacency (shared boundary date) counts as an intersection"
  - id: ERR_DOR_OUTSIDE_ROTATION_WINDOW
    http: 422
    condition: "observed_on falls outside the rotation's CLOSED [start_date, end_date] window, or is later than the logical clock's date"
  - id: ERR_INSTRUCTOR_SCHEDULE_CONFLICT
    http: 409
    condition: "the candidate session's HALF-OPEN [starts_at, ends_at) interval intersects another live session of the same instructor, or is separated from one in a different room_code by a gap of less than 15 minutes"

  # --- business constraint ---------------------------------------------------
  - id: ERR_TRAINER_ROTATION_VIOLATION
    http: 409
    condition: "the named fto_instructor_id already holds a non-aborted rotation for the same recruit, breaking the rotating-trainer requirement"
  - id: ERR_DOR_AUTHOR_NOT_ASSIGNED_FTO
    http: 422
    condition: "author_instructor_id is not the rotation's fto_instructor_id"
  - id: ERR_DUPLICATE_DOR
    http: 409
    condition: "a non-voided ObservationReport already exists for the same rotation and observed_on date"
  - id: ERR_ATTENDANCE_ALREADY_RECORDED
    http: 409
    condition: "a non-voided AttendanceRecord already exists for the same course_session_id and recruit_id"
  - id: ERR_DUPLICATE_SCREENING_TYPE
    http: 409
    condition: "a ScreeningRecord already exists for the same recruit_id and screening_type, whatever its status: a retest re-enters the SAME row via POST /screening-records/{screeningRecordId}/findings and increments its attempt_number, so a second row of the same type is never legitimate - not even after the first reached CLEARED, WAIVED or DISQUALIFIED"
  - id: ERR_PRESENT_HOURS_INCONSISTENT
    http: 422
    condition: "present_hours is negative, exceeds the session's scheduled_hours, or contradicts the declared attendance status (PRESENT requires present_hours == scheduled_hours; PARTIAL requires 0 < present_hours < scheduled_hours; ABSENT_EXCUSED and ABSENT_UNEXCUSED require present_hours == 0)"

  # --- business referential --------------------------------------------------
  - id: ERR_TOPIC_NOT_IN_STANDARD
    http: 422
    condition: "the topic_code is not a topic_requirements key on the certification standard of the relevant AcademyClass"
  - id: ERR_EXAM_NOT_REQUIRED_FOR_TOPIC
    http: 422
    condition: "the topic_requirements entry for the topic_code has exam_required false"
  - id: ERR_PRIOR_ROTATION_MISMATCH
    http: 422
    condition: "prior_rotation_id names a rotation belonging to a different recruit, whose phase_number is not exactly one less than the candidate's, or whose status is not COMPLETED; or prior_rotation_id is null while phase_number > 1"

  # --- business fiscal / capacity -------------------------------------------
  - id: ERR_FTO_LOAD_EXCEEDED
    http: 409
    condition: "the assigned Instructor already holds FTO_MAX_CONCURRENT_TRAINEES (2) or more rotations with status IN {PLANNED, ACTIVE, REMEDIAL} whose CLOSED [start_date, end_date] interval intersects the candidate rotation's interval"
  - id: ERR_REMEDIATION_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "POST /examinations/{examinationId}/assign-remediation is requested when the recruit's remediation_attempts_used has already reached the standard's max_remediation_attempts. The budget is per recruit and shared across topics, so it can be exhausted on topic A and then block a first remediation on topic B"
  - id: ERR_MILESTONE_NOT_REACHED
    http: 409
    condition: "POST /recruits/{recruitId}/probation-decisions carries decision PASS while the current logical clock date is earlier than the recruit's probation_milestone_due_date; EXTEND and SEPARATE are never gated by the milestone date"

# =============================================================================
# 1.7 RBAC Matrix   (role_model: segregation_of_duties)
#
# Segregation of duties is enforced through X-User-ID, not only X-User-Role:
#   - the user who records a screening's findings may not adjudicate that screening
#     (ERR_SAME_ACTOR_ADJUDICATION, priority 56)
#   - the user who authored a lesson plan may not approve it
#     (ERR_SAME_ACTOR_ADJUDICATION, priority 56)
#   - an instructor may serve as FTO for a given recruit at most once
#     (ERR_TRAINER_ROTATION_VIOLATION, priority 63) - the "rotating trainers" requirement
# =============================================================================
roles:
  - name: AcademyDirector
    description: "Commanding officer of the academy. Sole authority for certification standards, cohort creation, instructor certification and revocation, lesson plan approval, adverse actions (dismissal, probation decisions, delivery voids) and graduation certification."
    identity: "opaque"
    exclusive_operations:
      - "POST /certification-standards"
      - "POST /academy-classes"
      - "POST /instructors"
      - "POST /instructors/{instructorId}/certify"
      - "POST /instructors/{instructorId}/revoke-certification"
      - "POST /lesson-plans/{lessonPlanId}/approve"
      - "POST /lesson-plans/{lessonPlanId}/request-revision"
      - "POST /recruits/{recruitId}/dismiss"
      - "POST /recruits/{recruitId}/probation-decisions"
      - "POST /course-sessions/{courseSessionId}/void-delivery"
      - "POST /academy-classes/{classId}/certify-graduates"
    shared_operations:
      - "POST /recruits (with TrainingCoordinator)"
      - "POST /field-training-rotations/{rotationId}/abort (with TrainingCoordinator)"
      - "every GET endpoint except GET /recruits/{recruitId}/certification-progress restrictions"
      - "POST /_clock/set_current_utc (with every role)"

  - name: TrainingCoordinator
    description: "Runs the day-to-day pipeline: enrols applicants, orders screenings, advances stages, schedules sessions and examinations, assigns remediation, and plans/activates field training rotations."
    identity: "opaque"
    exclusive_operations:
      - "POST /recruits/{recruitId}/screenings"
      - "POST /recruits/{recruitId}/advance-stage"
      - "POST /course-sessions"
      - "POST /examinations/{examinationId}/assign-remediation"
      - "POST /field-training-rotations"
      - "POST /field-training-rotations/{rotationId}/activate"
    shared_operations:
      - "POST /recruits (with AcademyDirector)"
      - "POST /screening-records/{screeningRecordId}/findings and /adjudicate, restricted to screening_type PHYSICAL_FITNESS (with BackgroundInvestigator and MedicalExaminer on their own types)"
      - "POST /lesson-plans and POST /lesson-plans/{lessonPlanId}/revisions (with AcademyInstructor)"
      - "POST /course-sessions/{courseSessionId}/attendance and /deliver (with AcademyInstructor)"
      - "POST /examinations and POST /examinations/{examinationId}/grade (with AcademyInstructor)"
      - "POST /field-training-rotations/{rotationId}/complete (with FieldTrainingOfficer)"
      - "POST /field-training-rotations/{rotationId}/abort (with AcademyDirector)"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc (with every role)"

  - name: BackgroundInvestigator
    description: "Sworn investigator who conducts and adjudicates the background investigation leg of the selection pipeline."
    identity: "opaque"
    exclusive_operations:
      - "POST /screening-records/{screeningRecordId}/findings for screening_type BACKGROUND"
      - "POST /screening-records/{screeningRecordId}/adjudicate for screening_type BACKGROUND"
    shared_operations:
      - "GET /screening-records, GET /screening-records/{screeningRecordId}, GET /recruits/{recruitId}, GET /certification-standards/{standardId}"
      - "POST /_clock/set_current_utc (with every role)"

  - name: MedicalExaminer
    description: "Contract physician/psychologist who conducts and adjudicates the medical and psychological legs of the selection pipeline."
    identity: "opaque"
    exclusive_operations:
      - "POST /screening-records/{screeningRecordId}/findings for screening_type MEDICAL or PSYCHOLOGICAL"
      - "POST /screening-records/{screeningRecordId}/adjudicate for screening_type MEDICAL or PSYCHOLOGICAL"
    shared_operations:
      - "GET /screening-records, GET /screening-records/{screeningRecordId}, GET /recruits/{recruitId}, GET /certification-standards/{standardId}"
      - "POST /_clock/set_current_utc (with every role)"

  - name: AcademyInstructor
    description: "Certified classroom instructor. Authors lesson plans, records attendance and closes out taught sessions, and grades examinations. Never approves its own plan."
    identity: "entity_backed:Instructor"
    exclusive_operations: []
    shared_operations:
      - "POST /lesson-plans and POST /lesson-plans/{lessonPlanId}/revisions, restricted to plans whose instructor_id equals X-User-ID (with TrainingCoordinator)"
      - "POST /course-sessions/{courseSessionId}/attendance and /deliver (with TrainingCoordinator)"
      - "POST /examinations and POST /examinations/{examinationId}/grade (with TrainingCoordinator)"
      - "GET /certification-standards, GET /academy-classes/{classId}, GET /instructors, GET /lesson-plans, GET /course-sessions, GET /attendance-records, GET /examinations"
      - "POST /_clock/set_current_utc (with every role)"

  - name: FieldTrainingOfficer
    description: "Certified FTO (fto_certified true) who supervises a probationary recruit during one rotation and files the standardized daily observation reports."
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /field-training-rotations/{rotationId}/observation-reports"
    shared_operations:
      - "POST /field-training-rotations/{rotationId}/complete (with TrainingCoordinator)"
      - "GET /field-training-rotations, GET /field-training-rotations/{rotationId}, GET /observation-reports, GET /observation-reports/{observationReportId}, GET /instructors/{instructorId}, GET /recruits/{recruitId}"
      - "POST /_clock/set_current_utc (with every role)"

  - name: RecordsCustodian
    description: "Custodian of training records for certification audit and future litigation. Read-only by design: may inspect every record and every report but may never mutate one, so the evidentiary chain cannot be altered by its keeper."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /training-record-entries and GET /training-record-entries/{trainingRecordEntryId} (with AcademyDirector and TrainingCoordinator)"
      - "GET /academy-classes/{classId}/attrition-analysis and GET /academy-classes/{classId}/pipeline-forecast (with AcademyDirector)"
      - "every other GET endpoint except GET /recruits/{recruitId}/certification-progress"
      - "POST /_clock/set_current_utc (with every role)"

  - name: Recruit
    description: "The recruit themself. May read only their own record, their own certification progress, their own examinations, their own rotations and their own observation reports."
    identity: "entity_backed:Recruit"
    exclusive_operations: []
    shared_operations:
      - "GET /recruits/{recruitId} restricted to recruitId == X-User-ID (with AcademyDirector, TrainingCoordinator, RecordsCustodian, BackgroundInvestigator, MedicalExaminer, FieldTrainingOfficer)"
      - "GET /recruits/{recruitId}/certification-progress restricted to recruitId == X-User-ID (with AcademyDirector, TrainingCoordinator, RecordsCustodian)"
      - "GET /examinations/{examinationId}, GET /field-training-rotations/{rotationId}, GET /observation-reports/{observationReportId} restricted to rows whose recruit_id chain resolves to X-User-ID"
      - "POST /_clock/set_current_utc (with every role)"
