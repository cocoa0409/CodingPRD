      - name: seat_entitlement_tier_keyed_on_base_not_total
        grounds:
          - calculations.team_seat_entitlement
          - entities.Team.fields.expected_daily_attendance
          - entities.Team.fields.base_entitlement
          - entities.Team.fields.buffer_seats_entitled
          - entities.Team.fields.entitled_seats
        distinguishing_aspect: |
          Combinatorial mode (c): the buffer tier looks like it should depend on
          the entitled total, which itself contains the buffer, and the pinned
          order resolves the apparent circularity by keying the tier on
          base_entitlement ONLY - so headcount 125 at 1 expected day (base 25)
          takes the 0.12 tier and lands on buffer 3 / entitled 28, whereas keying
          the tier off the 28-seat total would take the 0.06 tier and land on
          buffer 2 / entitled 27.
        test_recipe:
          setup:
            - "One OPEN cycle whose days_in_office_floor is 1 so that 1-day teams are legal."
            - "No teams, neighborhoods or employees exist yet; the four POST /teams calls are the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-ENT", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 1, badge_weight: 0.50, network_weight: 0.50, collaboration_target_score: 60.00, equity_variance_threshold_pct: 15.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "TA-BASE25", expected_days_in_office_per_week: 1, core_collaboration_days: ["WED"], headcount_planned: 125, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { ta_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "TB-BASE26", expected_days_in_office_per_week: 1, core_collaboration_days: ["WED"], headcount_planned: 130, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { tb_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "TC-BASE10", expected_days_in_office_per_week: 1, core_collaboration_days: ["WED"], headcount_planned: 50, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { tc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "TD-BASE11", expected_days_in_office_per_week: 1, core_collaboration_days: ["WED"], headcount_planned: 51, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { td_id: $.data.id }
          assert:
            - "Team.${ta_id}.expected_daily_attendance == 25 and Team.${ta_id}.base_entitlement == 25"
            - "Team.${ta_id}.buffer_seats_entitled == 3 and Team.${ta_id}.entitled_seats == 28"
            - "Team.${ta_id}.entitled_seats != 27, which is what keying the buffer tier off the entitled total would produce"
            - "Team.${tb_id}.base_entitlement == 26 and Team.${tb_id}.buffer_seats_entitled == 2 and Team.${tb_id}.entitled_seats == 28"
            - "Team.${ta_id}.entitled_seats == Team.${tb_id}.entitled_seats even though their buffer_seats_entitled differ by 1, proving the tier boundary sits at base 25/26"
            - "Team.${tc_id}.base_entitlement == 10 and Team.${tc_id}.buffer_seats_entitled == 2 and Team.${tc_id}.entitled_seats == 12"
            - "Team.${td_id}.base_entitlement == 11 and Team.${td_id}.buffer_seats_entitled == 2 and Team.${td_id}.entitled_seats == 13"
            - "PolicyCycle.${cyc_id}.enrolled_team_count == 4"

  - rule_id: non_linear_state_machine
    instances:

      - name: attendance_week_finalize_amend_refinalize_cycle
        grounds:
          - state_machines.AttendanceWeek.OPEN_to_FINALIZED
          - state_machines.AttendanceWeek.FINALIZED_to_AMENDED
          - state_machines.AttendanceWeek.AMENDED_to_FINALIZED
          - entities.AttendanceWeek.fields.amendment_reason
          - entities.EscalationCase.fields.prior_case_id
          - validations[priority=50]
        distinguishing_aspect: |
          AttendanceWeek is the CYCLIC machine: FINALIZED -> AMENDED -> FINALIZED
          is a true loop that re-enters a state already visited, and each lap
          recomputes the whole cascade against the signals present at that
          moment, so the same week reports credited_days 2, then 0 while amended,
          then 3 - and because the first lap's case was CURED by the amendment,
          the second lap opens a SECOND EscalationCase whose prior_case_id points
          at the first.
        test_recipe:
          setup:
            - "One OPEN cycle, team T1-CORE (5 expected days, headcount 25, corroboration off), employee E-1001 left unclassified so required_days is 5."
            - "An OPEN AttendanceWeek for 2026-W37 carrying two BADGE signals of 480 minutes on 2026-09-08 and 2026-09-09."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CYC", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T1-CORE", expected_days_in_office_per_week: 5, core_collaboration_days: ["MON", "TUE", "WED", "THU", "FRI"], headcount_planned: 25, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t1_id: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t1_id}", employee_number: "E-1001", work_email: "e1001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e1_id: $.data.id }
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e1_id}", iso_week: "2026-W37", week_start_date: "2026-09-07" }
              as: SystemIntegration
              captures: { w1_id: $.data.id }
            - call: "POST /attendance-weeks/${w1_id}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-08", minutes_present: 480, dedupe_key: "B-0908" }
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w1_id}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-09", minutes_present: 480, dedupe_key: "B-0909" }
              as: SystemIntegration
          trigger:
            - call: "POST /attendance-weeks/${w1_id}/finalize"
              payload: {}
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w1_id}/amend"
              payload: { amendment_reason: "badge reader outage on 2026-09-10 confirmed by facilities" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /attendance-weeks/${w1_id}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-10", minutes_present: 480, dedupe_key: "B-0910" }
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w1_id}/finalize"
              payload: {}
              as: SystemIntegration
          assert:
            - "After the first finalize: AttendanceWeek.${w1_id}.status == FINALIZED, credited_days == 2, shortfall_days == 3, Employee.${e1_id}.non_compliance_pressure == 5.50, Employee.${e1_id}.escalation_stage == WRITTEN_WARNING"
            - "After the amend: AttendanceWeek.${w1_id}.status == AMENDED, credited_days == 0, shortfall_days == 0, Employee.${e1_id}.cumulative_shortfall_days == 0, Employee.${e1_id}.non_compliance_pressure == 0.00, Employee.${e1_id}.escalation_stage == NONE"
            - "After the amend the first EscalationCase.stage == CURED"
            - "After the second finalize: AttendanceWeek.${w1_id}.status == FINALIZED, credited_days == 3, shortfall_days == 2"
            - "After the second finalize: Employee.${e1_id}.non_compliance_pressure == 4.00 and Employee.${e1_id}.escalation_stage == WRITTEN_WARNING"
            - "GET /escalation-cases?employee_id=${e1_id} returns exactly 2 rows"
            - "The second EscalationCase.prior_case_id equals the id of the first (CURED) case and its opened_pressure == 4.00"
            - "AttendanceWeek.${w1_id}.amendment_reason == 'badge reader outage on 2026-09-10 confirmed by facilities' and finalized_at was re-stamped by the second finalize"
            - "Team.${t1_id}.formal_action_count == 1 and PolicyCycle.${cyc_id}.formal_action_total == 1 after the second finalize"

      - name: relocation_parallel_dimensions_reverse_order_and_join
        grounds:
          - state_machines.RemoteLocationRequest.SUBMITTED_to_UNDER_REVIEW
          - state_machines.RemoteLocationRequest.UNDER_REVIEW_to_UNDER_REVIEW
          - state_machines.RemoteLocationRequest.UNDER_REVIEW_to_APPROVED
          - entities.RemoteLocationRequest.fields.tax_review_status
          - entities.RemoteLocationRequest.fields.security_review_status
          - validations[priority=50]
        distinguishing_aspect: |
          RemoteLocationRequest is the PARALLEL machine: tax_review_status and
          security_review_status are two independent dimensions on one row, so
          recording the security dimension first leaves tax_review_status at
          PENDING while status moves to UNDER_REVIEW, the join at /decide is
          refused with ERR_REVIEWS_INCOMPLETE until BOTH dimensions have left
          PENDING, and the second review is a self-loop that does not move status.
        test_recipe:
          setup:
            - "One OPEN cycle, one team, one ACTIVE employee holding an APPROVED FULLY_REMOTE classification."
            - "A SUBMITTED RemoteLocationRequest for US_TX at data tier INTERNAL with both dimensions PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-PAR", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T1-CORE", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t1_id: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t1_id}", employee_number: "E-1001", work_email: "e1001@corp.example", home_timezone: "America/Chicago", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e1_id: $.data.id, e1_v: $.data.version }
            - call: "POST /eligibility-classifications"
              payload: { employee_id: "${e1_id}", requested_class: "FULLY_REMOTE", justification_code: "TALENT_RETENTION", effective_from: "2026-09-01", expected_employee_version: "${e1_v}" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { cls_id: $.data.id }
            - call: "POST /eligibility-classifications/${cls_id}/submit"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /eligibility-classifications/${cls_id}/decision"
              payload: { decision: "APPROVE" }
              as: PeopleManager
              as_user_id: "mgr-1"
            - call: "POST /remote-location-requests"
              payload: { employee_id: "${e1_id}", jurisdiction_code: "US_TX", data_classification_tier: "INTERNAL", proposed_start_date: "2026-10-01" }
              as: Employee
              as_user_id: "${e1_id}"
              captures: { rlr_id: $.data.id }
          trigger:
            - call: "POST /remote-location-requests/${rlr_id}/security-review"
              payload: { review_outcome: "CLEARED", control_gap_count: 0 }
              as: ComplianceAuditor
            - call: "POST /remote-location-requests/${rlr_id}/decide"
              payload: { decision: "APPROVE" }
              as: WorkplaceProgramOffice
            - call: "POST /remote-location-requests/${rlr_id}/tax-review"
              payload: { review_outcome: "CLEARED", licensing_gap_count: 0, tax_nexus_registration_cost_cents: 0 }
              as: HRBusinessPartner
            - call: "POST /remote-location-requests/${rlr_id}/decide"
              payload: { decision: "APPROVE" }
              as: WorkplaceProgramOffice
          assert:
            - "After the security review: RemoteLocationRequest.${rlr_id}.status == UNDER_REVIEW, security_review_status == CLEARED, tax_review_status == PENDING"
            - "The first decide returns ERR_REVIEWS_INCOMPLETE with HTTP 409 and leaves status == UNDER_REVIEW"
            - "After the tax review: tax_review_status == CLEARED, security_review_status still CLEARED, status still UNDER_REVIEW (the second review is a self-loop)"
            - "After the second decide: RemoteLocationRequest.${rlr_id}.status == APPROVED and decision_reason == BOTH_REVIEWS_CLEARED"
            - "RemoteLocationRequest.${rlr_id}.preliminary_risk_score == 14 and final_risk_score == 14 (all three penalty inputs are 0)"
            - "A third POST /remote-location-requests/${rlr_id}/security-review returns ERR_REVIEW_ALREADY_RECORDED with HTTP 409"

      - name: exception_request_info_round_loop_with_gate
        grounds:
          - state_machines.ExceptionRequest.SUBMITTED_to_INFO_REQUESTED
          - state_machines.ExceptionRequest.INFO_REQUESTED_to_SUBMITTED
          - state_machines.ExceptionRequest.SUBMITTED_to_APPROVED
          - entities.ExceptionRequest.fields.info_round_count
          - entities.ExceptionRequest.fields.interactive_process_required
          - validations[priority=64]
        distinguishing_aspect: |
          ExceptionRequest is the second CYCLIC machine and its loop carries a
          counter that gates the exit: SUBMITTED -> INFO_REQUESTED -> SUBMITTED
          can repeat without bound, an APPROVE attempted at info_round_count 0 on
          an interactive-process request is refused with
          ERR_INTERACTIVE_PROCESS_PENDING, and after two completed laps
          info_round_count is exactly 2 and the approval succeeds - but only for
          an AccommodationSpecialist caller.
        test_recipe:
          setup:
            - "One OPEN cycle, one team, one ACTIVE employee E-1001 with disability_accommodation_on_file false."
            - "A SUBMITTED MEDICAL ExceptionRequest for 2026-09-07..2026-09-11 requesting 2 relief days, so interactive_process_required is true and info_round_count is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-IPL", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T1-CORE", expected_days_in_office_per_week: 5, core_collaboration_days: ["MON", "TUE", "WED", "THU", "FRI"], headcount_planned: 25, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t1_id: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t1_id}", employee_number: "E-1001", work_email: "e1001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e1_id: $.data.id }
            - call: "POST /exception-requests"
              payload: { employee_id: "${e1_id}", category: "MEDICAL", requested_relief_days: 2, start_date: "2026-09-07", end_date: "2026-09-11", rationale: "post-operative recovery, two office days per week not feasible" }
              as: Employee
              as_user_id: "${e1_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /exception-requests/${req_id}/adjudicate"
              payload: { decision: "APPROVE", granted_relief_days: 2 }
              as: AccommodationSpecialist
              as_user_id: "acc-1"
            - call: "POST /exception-requests/${req_id}/request-info"
              payload: { info_needed: "clinician note covering the requested window" }
              as: AccommodationSpecialist
              as_user_id: "acc-1"
            - call: "POST /exception-requests/${req_id}/respond"
              payload: { response_note: "note attached" }
              as: Employee
              as_user_id: "${e1_id}"
            - call: "POST /exception-requests/${req_id}/request-info"
              payload: { info_needed: "expected duration of the restriction" }
              as: AccommodationSpecialist
              as_user_id: "acc-1"
            - call: "POST /exception-requests/${req_id}/respond"
              payload: { response_note: "restriction expected to last six weeks" }
              as: Employee
              as_user_id: "${e1_id}"
            - call: "POST /exception-requests/${req_id}/adjudicate"
              payload: { decision: "APPROVE", granted_relief_days: 2 }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /exception-requests/${req_id}/adjudicate"
              payload: { decision: "APPROVE", granted_relief_days: 2 }
              as: AccommodationSpecialist
              as_user_id: "acc-1"
          assert:
            - "ExceptionRequest.${req_id}.interactive_process_required == true (MEDICAL category)"
            - "The first adjudicate returns ERR_INTERACTIVE_PROCESS_PENDING with HTTP 409 and leaves status == SUBMITTED, info_round_count == 0"
            - "After the first request-info: status == INFO_REQUESTED, info_needed == 'clinician note covering the requested window', info_round_count == 0"
            - "After the first respond: status == SUBMITTED, info_round_count == 1"
            - "After the second respond: status == SUBMITTED, info_round_count == 2, response_note == 'restriction expected to last six weeks'"
            - "The HRBusinessPartner adjudicate returns ERR_ACCOMMODATION_SPECIALIST_REQUIRED with HTTP 409 and leaves status == SUBMITTED"
            - "The AccommodationSpecialist adjudicate succeeds: ExceptionRequest.${req_id}.status == APPROVED, granted_relief_days == 2, adjudicated_by_user_id == 'acc-1', info_round_count still 2"
            - "Employee.${e1_id}.approved_relief_days_total == 2"
            - "A second POST /exception-requests/${req_id}/request-info returns ERR_REQUEST_NOT_SUBMITTED with HTTP 409"

  - rule_id: transitive_cascade
    instances:

      - name: finalize_week_depth_six_to_cycle_totals
        grounds:
          - state_machines.AttendanceWeek.OPEN_to_FINALIZED.side_effects[LINK 1..LINK 6]
          - calculations.non_compliance_pressure
          - calculations.pressure_derived_stage
          - calculations.aggregate_compliance_rate
          - entities.Team.fields.escalated_headcount
          - entities.PolicyCycle.fields.formal_action_total
        distinguishing_aspect: |
          One finalize call propagates through six causally chained links -
          week -> employee pressure -> a newly created EscalationCase ->
          that case's stage under pressure_derived_stage -> Team.formal_action_count
          -> PolicyCycle.formal_action_total and aggregate_compliance_rate. Nothing
          past LINK 1 is named in the request; the EscalationCase row does not exist
          before the call and lands directly at WRITTEN_WARNING because LINK 4 runs
          inside the same cascade that LINK 3 opened it at COACHING.
        test_recipe:
          setup:
            - "One OPEN cycle, team T1-CORE (5 expected days, corroboration off), two ACTIVE unclassified employees E-1001 and E-1002 (so both fall back to ONSITE_REQUIRED, required_days 5)."
            - "An OPEN AttendanceWeek for E-1001 covering 2026-W37 with two BADGE signals of 480 minutes on 2026-09-08 and 2026-09-09; E-1002 has no weeks at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-D6", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
