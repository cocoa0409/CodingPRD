              as: PlatformAdmin
              captures: { err_fs: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_FINANCIAL_STANDARD_NOT_MET"
            - "GET /clearing/participants/${p_fs2} reports financial_standard_status == FAIL and required_min_net_capital_cents == 500000000"
            - "POST /clearing/participants/${p_fs2}/financial-review with net_capital_cents 600000000 flips financial_standard_status to PASS and the subsequent activate succeeds"

      - name: unknown_security_on_trade_submission_returns_not_found
        claim_type: Violation → Error
        grounds:
          - errors[ERR_SECURITY_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A trade submission naming a non-existent security is refused at the existence priority with ERR_SECURITY_NOT_FOUND rather than the business-level self-trade or deadline errors."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Participant NF2 is ACTIVE."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "NotFound Co", lei: "LEI-NF2", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_nf2: $.data.id }
            - call: "POST /clearing/participants/${p_nf2}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_nf2}", security_id: "11111111-1111-4111-8111-111111111111", side: "BUY", quantity: 1, trade_price_cents: 1, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_nf2}"
              captures: { err_nf2: $.data.error_id }
          assert:
            - "the response status is 404 and data.error_id == ERR_SECURITY_NOT_FOUND, not ERR_SELF_TRADE_FORBIDDEN"
            - "the request also names the acting participant as its own counterparty, yet the existence check at priority 3 runs before the safety rule at priority 8"
            - "GET /clearing/trade-submissions returns zero rows"

  # ===========================================================================
  - section: rbac
    instances:

      - name: risk_officer_cannot_activate_participant
        claim_type: exclusive_operation
        grounds:
          - roles[RiskOfficer]
          - roles[PlatformAdmin]
          - endpoints.POST_/clearing/participants/{id}/activate
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Activation is a PlatformAdmin exclusive, so the RiskOfficer role — which owns fund sizing and default management — is refused with ERR_UNAUTHORIZED, enforcing segregation between admitting a member and sizing its fund."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Participant RB1 is PENDING with a passing capital level."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Rbac Alpha", lei: "LEI-RB1", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_rb1: $.data.id }
          trigger:
            - call: "POST /clearing/participants/${p_rb1}/activate"
              payload: {}
              as: RiskOfficer
              captures: { err_rbac: $.data.error_id }
          assert:
            - "the response status is 403 and data.error_id == ERR_UNAUTHORIZED"
            - "GET /clearing/participants/${p_rb1} still reports membership_status == PENDING"
            - "the same call issued as PlatformAdmin succeeds with 200 and moves membership_status to ACTIVE"

