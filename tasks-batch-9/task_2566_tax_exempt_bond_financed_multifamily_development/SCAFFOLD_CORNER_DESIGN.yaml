            guarded-transition claim: the same issue request is refused with
            ERR_REG_AGREEMENT_NOT_RECORDED while the agreement is DRAFT and
            succeeds unchanged once the agreement reaches RECORDED, with the
            allocation and pool aggregates asserted on both sides of the guard.

      - name: the_agreement_amendment_loop_repeats_and_counts_only_the_recordings_that_complete_it
        claim_type: cyclic
        grounds:
          - state_machines[RegulatoryAgreement].transitions[RECORDED->AMENDMENT_PENDING]
          - state_machines[RegulatoryAgreement].transitions[AMENDMENT_PENDING->RECORDED]
          - endpoints[POST /regulatory-agreements/{id}/amend]
          - endpoints[POST /regulatory-agreements/{id}/record]
          - entities.RegulatoryAgreement.fields.amendment_count
          - entities.RegulatoryAgreement.fields.extended_use_end_date
          - entities.Project.fields.extended_use_end_date
          - validations[priority=131]
          - errors[ERR_EXTENDED_USE_TOO_SHORT]
          - errors[ERR_REG_AGREEMENT_STATE_INVALID]
        distinguishing_aspect: |
          The amendment loop is the one unbounded cycle in the covenant machine, and
          the counter attached to it counts completions rather than attempts: opening
          an amendment leaves amendment_count untouched and only the re-recording that
          closes the loop increments it, so an implementation that bumps the counter
          on the amend call is off by one after the very first cycle. The loop also has
          a deferred write semantics that is easy to get wrong - the new term is
          stamped on the agreement while the amendment is pending, but the dates
          mirrored onto the project are re-derived only at re-recording, so a read
          between the two calls must still show the old horizon. Two passes are run to
          show the cycle repeats, the pending state admits no second amend, and the
          gap rule is enforced on the amend path against the amended compliance period
          rather than the original one.
