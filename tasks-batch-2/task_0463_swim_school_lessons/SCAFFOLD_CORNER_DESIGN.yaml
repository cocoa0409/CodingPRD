# =============================================================================
# Swim School & Lesson Program — §1.9 Scaffold Corner Design
# Breadth probe: every testable claim in §1.1-§1.7 not covered by §1.8.
# section: / claim_type: values come from references/claim-extraction-guide.md.
# excluded_because: stubs point to §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_class_session_capacity_copied_from_level_ratio
        claim_type: Computed Fields
        grounds:
          - entities.ClassSession.fields.capacity
          - calculations.session_capacity
        distinguishing_aspect: "Creating a ClassSession at a Level with max_students_per_instructor=4 yields capacity==4 (snapshotted at creation), enrolled_count==0, waitlist_count==0, status==DRAFT; client-supplied capacity is ignored."
        test_recipe:
          setup: ["A Level with ratio 4 exists."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Level 1", sequence_order: 1, min_age_months: 36, max_age_months: 72, max_students_per_instructor: 4, monthly_tuition_cents: 12000 }
              as: SchoolAdmin
              captures: { lvl1_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Coach A", certified_level_ids: ["${lvl1_id}"] }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${lvl1_id}", instructor_id: "${inst_id}", lane_number: 1, day_of_week: 1, start_minute: 600, end_minute: 645 }
              as: SchoolAdmin
              captures: { sess_id: $.data.id }
          assert:
            - "response.status == 201"
            - "ClassSession.${sess_id}.capacity == 4"
            - "ClassSession.${sess_id}.enrolled_count == 0"
            - "ClassSession.${sess_id}.waitlist_count == 0"
            - "ClassSession.${sess_id}.status == DRAFT"

      - name: student_age_months_computed_against_clock
        claim_type: Computed Fields
        grounds:
          - entities.Student.fields.age_months
          - entities.Student.fields.birthdate
        distinguishing_aspect: "A student born 2021-01-01 read with the clock at 2026-01-01 returns age_months==60 (exactly 5 years); age_months is computed, not client-supplied."
        test_recipe:
          setup: ["Clock at 2026-01-01; one Level-1 parent and student born 2021-01-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /levels"
              payload: { name: "Level 1", sequence_order: 1, min_age_months: 0, max_age_months: 200, max_students_per_instructor: 4, monthly_tuition_cents: 12000 }
              as: SchoolAdmin
              captures: { lvl1_id: $.data.id }
            - call: "POST /parents"
              payload: { full_name: "Pat Parent", email: "pat@x.com" }
              as: SchoolAdmin
              captures: { parent_id: $.data.id }
            - call: "POST /parents/${parent_id}/students"
              payload: { full_name: "Kid One", birthdate: "2021-01-01T00:00:00Z", current_level_id: "${lvl1_id}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { stu_id: $.data.id }
          trigger:
            - call: "GET /students/${stu_id}"
              payload: {}
              as: Parent
              as_user_id: "${parent_id}"
          assert:
            - "Student.${stu_id}.age_months == 60"

      - name: get_class_session_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_CLASS_SESSION_NOT_FOUND]
        distinguishing_aspect: "GET /class-sessions/{id} with a well-formed but non-existent UUID returns ERR_CLASS_SESSION_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /class-sessions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_CLASS_SESSION_NOT_FOUND"

      - name: create_level_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.Level.fields.monthly_tuition_cents
        distinguishing_aspect: "POST /levels missing monthly_tuition_cents (a required input field) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /levels"
              payload: { name: "Level 1", sequence_order: 1, min_age_months: 36, max_age_months: 72, max_students_per_instructor: 4 }
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_location_default_status_open
        claim_type: Defaults
        grounds:
          - entities.Location.fields.status
        distinguishing_aspect: "POST /locations without status returns status==OPEN (the declared default)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Location.${loc_id}.status == OPEN"

      - name: list_class_sessions_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints
        distinguishing_aspect: "GET /class-sessions returns an array response_type with pagination fields total_count and has_more present."
        test_recipe:
          setup: ["Empty DB (zero sessions still returns a well-formed paginated envelope)."]
          setup_api_calls: []
          trigger:
            - call: "GET /class-sessions"
              payload: {}
              as: SchoolAdmin
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "response.data.total_count == 0"
            - "response.data.has_more == false"

      - name: fk_reverse_lookup_students_by_parent_subresource
        claim_type: Parent Relationships
        grounds:
          - entities.Student.fields.parent_id
          - endpoints
        distinguishing_aspect: "GET /parents/{id}/students returns the array of that parent's students (sub-resource reverse lookup for Student.parent_id), length 1 after one add."
        test_recipe:
          setup: ["One parent with one student."]
          setup_api_calls:
            - call: "POST /levels"
              payload: { name: "Level 1", sequence_order: 1, min_age_months: 0, max_age_months: 200, max_students_per_instructor: 4, monthly_tuition_cents: 12000 }
              as: SchoolAdmin
              captures: { lvl1_id: $.data.id }
            - call: "POST /parents"
              payload: { full_name: "Pat Parent", email: "pat@x.com" }
              as: SchoolAdmin
              captures: { parent_id: $.data.id }
            - call: "POST /parents/${parent_id}/students"
              payload: { full_name: "Kid One", birthdate: "2021-01-01T00:00:00Z", current_level_id: "${lvl1_id}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { stu_id: $.data.id }
          trigger:
            - call: "GET /parents/${parent_id}/students"
              payload: {}
              as: Parent
              as_user_id: "${parent_id}"
          assert:
            - "response.status == 200"
            - "response.data.total_count == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: pause_waitlisted_enrollment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Enrollment.ACTIVE_to_PAUSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Pausing an enrollment that is WAITLISTED (not ACTIVE) is rejected ERR_INVALID_STATE (409); pause is only legal from ACTIVE."
        test_recipe:
          setup: ["Capacity-1 session full with S1 ACTIVE; S2 WAITLISTED. Attempt to pause S2's WAITLISTED enrollment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Solo", sequence_order: 1, min_age_months: 36, max_age_months: 200, max_students_per_instructor: 1, monthly_tuition_cents: 12000 }
              as: SchoolAdmin
              captures: { lvl_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Coach A", certified_level_ids: ["${lvl_id}"] }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${lvl_id}", instructor_id: "${inst_id}", lane_number: 1, day_of_week: 1, start_minute: 600, end_minute: 645 }
              as: SchoolAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /class-sessions/${sess_id}/open"
              payload: {}
              as: SchoolAdmin
              captures: { sess_v0: $.data.version }
            - call: "POST /parents"
              payload: { full_name: "P1", email: "p1@x.com" }
              as: SchoolAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /parents/${p1_id}/students"
              payload: { full_name: "S1", birthdate: "2021-01-01T00:00:00Z", current_level_id: "${lvl_id}" }
              as: Parent
              as_user_id: "${p1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${s1_id}", class_session_id: "${sess_id}", expected_class_session_version: "${sess_v0}" }
              as: Parent
              as_user_id: "${p1_id}"
              captures: { enr1_id: $.data.id }
            - call: "POST /parents"
              payload: { full_name: "P2", email: "p2@x.com" }
              as: SchoolAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /parents/${p2_id}/students"
              payload: { full_name: "S2", birthdate: "2021-01-01T00:00:00Z", current_level_id: "${lvl_id}" }
              as: Parent
              as_user_id: "${p2_id}"
              captures: { s2_id: $.data.id }
            - call: "GET /class-sessions/${sess_id}"
              payload: {}
              as: SchoolAdmin
              captures: { sess_v_cur: $.data.version }
            - call: "POST /enrollments"
              payload: { student_id: "${s2_id}", class_session_id: "${sess_id}", expected_class_session_version: "${sess_v_cur}" }
              as: Parent
              as_user_id: "${p2_id}"
              captures: { enr2_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr2_id}/pause"
              payload: {}
              as: Parent
              as_user_id: "${p2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: approve_draft_assessment_returns_assessment_not_submitted
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Assessment.SUBMITTED_to_APPROVED
          - errors[ERR_ASSESSMENT_NOT_SUBMITTED]
        distinguishing_aspect: "Approving an Assessment still in DRAFT (never submitted) is rejected ERR_ASSESSMENT_NOT_SUBMITTED (409); approve is only legal from SUBMITTED."
        test_recipe:
          setup: ["A DRAFT assessment on an ACTIVE Level-1 enrollment, not yet submitted."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Level 2", sequence_order: 2, min_age_months: 36, max_age_months: 200, max_students_per_instructor: 6, monthly_tuition_cents: 13000 }
              as: SchoolAdmin
              captures: { lvl2_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Level 1", sequence_order: 1, next_level_id: "${lvl2_id}", min_age_months: 36, max_age_months: 200, max_students_per_instructor: 4, monthly_tuition_cents: 12000 }
              as: SchoolAdmin
              captures: { lvl1_id: $.data.id }
            - call: "POST /levels/${lvl1_id}/skills"
              payload: { name: "Back Float 10s", weight: 1.0 }
              as: SchoolAdmin
              captures: { sk1_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Coach A", certified_level_ids: ["${lvl1_id}"] }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${lvl1_id}", instructor_id: "${inst_id}", lane_number: 1, day_of_week: 1, start_minute: 600, end_minute: 645 }
              as: SchoolAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /class-sessions/${sess_id}/open"
              payload: {}
              as: SchoolAdmin
              captures: { sess_v: $.data.version }
            - call: "POST /parents"
              payload: { full_name: "Pat Parent", email: "pat@x.com" }
              as: SchoolAdmin
              captures: { parent_id: $.data.id }
            - call: "POST /parents/${parent_id}/students"
              payload: { full_name: "Kid One", birthdate: "2021-01-01T00:00:00Z", current_level_id: "${lvl1_id}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", class_session_id: "${sess_id}", expected_class_session_version: "${sess_v}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /assessments"
              payload: { enrollment_id: "${enr_id}", skill_scores: [ { skill_id: "${sk1_id}", score: 1.0 } ] }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "POST /assessments/${asmt_id}/approve"
              payload: {}
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ASSESSMENT_NOT_SUBMITTED"

      - name: reopen_closed_session_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ClassSession.OPEN_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Opening a ClassSession already in terminal CLOSED is rejected ERR_INVALID_STATE (409); CLOSED is terminal with no outbound transition."
        test_recipe:
          setup: ["An OPEN session is closed; we then try to open it again."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Level 1", sequence_order: 1, min_age_months: 0, max_age_months: 200, max_students_per_instructor: 4, monthly_tuition_cents: 12000 }
              as: SchoolAdmin
              captures: { lvl1_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Coach A", certified_level_ids: ["${lvl1_id}"] }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${lvl1_id}", instructor_id: "${inst_id}", lane_number: 1, day_of_week: 1, start_minute: 600, end_minute: 645 }
              as: SchoolAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /class-sessions/${sess_id}/open"
              payload: {}
              as: SchoolAdmin
            - call: "POST /class-sessions/${sess_id}/close"
              payload: {}
              as: SchoolAdmin
          trigger:
            - call: "POST /class-sessions/${sess_id}/open"
              payload: {}
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: enrollment_initial_state_active_when_seat_free
        claim_type: Initial State
        grounds:
          - state_machines.Enrollment.initial_state
          - state_machines.Enrollment.WAITLISTED_to_ACTIVE
        distinguishing_aspect: "A new enrollment into an OPEN session with a free seat and a CURRENT account is created directly ACTIVE (not left WAITLISTED), with enrolled_count incremented to 1."
        test_recipe:
          setup: ["OPEN Level-1 session, capacity 4, 0 ACTIVE; parent CURRENT; eligible student."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Level 1", sequence_order: 1, min_age_months: 36, max_age_months: 200, max_students_per_instructor: 4, monthly_tuition_cents: 12000 }
              as: SchoolAdmin
              captures: { lvl1_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Coach A", certified_level_ids: ["${lvl1_id}"] }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${lvl1_id}", instructor_id: "${inst_id}", lane_number: 1, day_of_week: 1, start_minute: 600, end_minute: 645 }
              as: SchoolAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /class-sessions/${sess_id}/open"
              payload: {}
              as: SchoolAdmin
              captures: { sess_v: $.data.version }
            - call: "POST /parents"
              payload: { full_name: "Pat Parent", email: "pat@x.com" }
              as: SchoolAdmin
              captures: { parent_id: $.data.id }
            - call: "POST /parents/${parent_id}/students"
              payload: { full_name: "Kid One", birthdate: "2021-01-01T00:00:00Z", current_level_id: "${lvl1_id}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", class_session_id: "${sess_id}", expected_class_session_version: "${sess_v}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { enr_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Enrollment.${enr_id}.status == ACTIVE"
            - "ClassSession.${sess_id}.enrolled_count == 1"

      - name: close_session_cascade_withdraws_all_enrollments
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ClassSession.OPEN_to_CLOSED
          - entities.Enrollment.fields.status
          - entities.ClassSession.fields.enrolled_count
        distinguishing_aspect: "Closing an OPEN session cascade-withdraws its ACTIVE and WAITLISTED enrollments to WITHDRAWN and drives enrolled_count and waitlist_count to 0."
        test_recipe:
          setup: ["Capacity-1 session with S1 ACTIVE and S2 WAITLISTED. Close the session."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Solo", sequence_order: 1, min_age_months: 36, max_age_months: 200, max_students_per_instructor: 1, monthly_tuition_cents: 12000 }
              as: SchoolAdmin
              captures: { lvl_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Coach A", certified_level_ids: ["${lvl_id}"] }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${lvl_id}", instructor_id: "${inst_id}", lane_number: 1, day_of_week: 1, start_minute: 600, end_minute: 645 }
              as: SchoolAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /class-sessions/${sess_id}/open"
              payload: {}
              as: SchoolAdmin
              captures: { sess_v0: $.data.version }
            - call: "POST /parents"
              payload: { full_name: "P1", email: "p1@x.com" }
              as: SchoolAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /parents/${p1_id}/students"
              payload: { full_name: "S1", birthdate: "2021-01-01T00:00:00Z", current_level_id: "${lvl_id}" }
              as: Parent
              as_user_id: "${p1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${s1_id}", class_session_id: "${sess_id}", expected_class_session_version: "${sess_v0}" }
              as: Parent
              as_user_id: "${p1_id}"
              captures: { enr1_id: $.data.id }
            - call: "POST /parents"
              payload: { full_name: "P2", email: "p2@x.com" }
              as: SchoolAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /parents/${p2_id}/students"
              payload: { full_name: "S2", birthdate: "2021-01-01T00:00:00Z", current_level_id: "${lvl_id}" }
              as: Parent
              as_user_id: "${p2_id}"
              captures: { s2_id: $.data.id }
            - call: "GET /class-sessions/${sess_id}"
              payload: {}
              as: SchoolAdmin
              captures: { sess_v_cur: $.data.version }
            - call: "POST /enrollments"
              payload: { student_id: "${s2_id}", class_session_id: "${sess_id}", expected_class_session_version: "${sess_v_cur}" }
              as: Parent
              as_user_id: "${p2_id}"
              captures: { enr2_id: $.data.id }
          trigger:
            - call: "POST /class-sessions/${sess_id}/close"
              payload: {}
              as: SchoolAdmin
          assert:
            - "ClassSession.${sess_id}.status == CLOSED"
            - "Enrollment.${enr1_id}.status == WITHDRAWN"
            - "Enrollment.${enr2_id}.status == WITHDRAWN"
            - "ClassSession.${sess_id}.enrolled_count == 0"
            - "ClassSession.${sess_id}.waitlist_count == 0"

      - name: withdrawn_enrollment_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Enrollment.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Pausing a WITHDRAWN enrollment (terminal) is rejected ERR_INVALID_STATE (409); no transition leaves WITHDRAWN."
        test_recipe:
          setup: ["An ACTIVE enrollment that is then withdrawn."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Level 1", sequence_order: 1, min_age_months: 36, max_age_months: 200, max_students_per_instructor: 4, monthly_tuition_cents: 12000 }
              as: SchoolAdmin
              captures: { lvl1_id: $.data.id }
            - call: "POST /instructors"
