# ============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design (breadth probe)
# Human Milk Bank Donor Screening & Pasteurization (task 2821)
#
# Walked row-by-row against references/claim-extraction-guide.md over this
# scaffold's §1.1-§1.7. Every numeric literal in `assert:` was computed by
# executing the corresponding §1.3 formula (or §1.1 default) in Python.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as
# `excluded_because:` stubs with no test_recipe.
#
# Standing conventions used by every recipe below:
#   * The logical clock is set explicitly as the first setup call so that no
#     recipe depends on the startup default 2026-08-01T00:00:00Z.
#   * Test user ids: u-intake-1, u-md-1, u-tech-1, u-qa-1 (culture),
#     u-qa-2 (release), u-pharm-1, u-presc-1, u-admin-1, plus donor-identity
#     ids captured from the created Donor rows.
#   * The standard qualification block for a donor is: POST /donors ->
#     /health-history {2, false, false, 3, 15} (base 30, screening 50,
#     questionnaire ACCEPTED, donor SCREENING) -> /serology-panels (five
#     NON_REACTIVE markers) -> /physician-approvals -> /qualify (surveillance
#     30 <= 60), which lands the donor in QUALIFIED.
#   * expected_*_version values are always ${var}s captured from a GET taken
#     immediately before the write, because every cascade bumps parent.version.
# ============================================================================

scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:

      - name: donor_creation_returns_declared_defaults
        claim_type: creation
        grounds:
          - endpoints[POST /milk-bank/donors]
          - entities.Donor.fields.status
          - entities.Donor.fields.screening_risk_score
          - entities.Donor.fields.surveillance_risk_score
          - entities.Donor.fields.reimbursement_balance_cents
          - entities.Donor.fields.lifetime_accepted_volume_ml
          - entities.Donor.fields.temporary_deferral_count
          - entities.Donor.fields.active_deferral_until_date
          - response_envelope.success
        distinguishing_aspect: "A freshly created Donor carries every §1.1 computed default at once: status APPLICANT, both risk scores 0, ledger 0, lifetime volume 0, deferral count 0, active_deferral_until_date null, qualified_at null, version 1."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-05T08:00:00Z."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
          trigger:
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
          assert:
            - "response_type == object and data.id is a non-empty string"
            - "Donor.${d1}.donor_code == DNR-0001"
            - "Donor.${d1}.zone_code == Z2"
            - "Donor.${d1}.status == APPLICANT"
            - "Donor.${d1}.screening_risk_score == 0"
            - "Donor.${d1}.surveillance_risk_score == 0"
            - "Donor.${d1}.reimbursement_balance_cents == 0"
            - "Donor.${d1}.lifetime_accepted_volume_ml == 0"
            - "Donor.${d1}.temporary_deferral_count == 0"
            - "Donor.${d1}.active_deferral_until_date == null"
            - "Donor.${d1}.qualified_at == null"
            - "Donor.${d1}.qualified_by_user_id == null"
            - "Donor.${d1}.version == 1"

      - name: shipment_retrieval_returns_stored_provisional_reimbursement
        claim_type: retrieval
        grounds:
          - endpoints[GET /milk-bank/shipments/{id}]
          - entities.Shipment.fields.estimated_reimbursement_cents
          - entities.Shipment.fields.zone_code
          - entities.Shipment.fields.status
        distinguishing_aspect: "GET /shipments/{id} returns the row exactly as POST /shipments stored it: zone_code Z2 copied from the owning donor, estimated_reimbursement_cents 2125 from the PROVISIONAL_AT_DISPATCH variant, final and credited amounts still null, status IN_TRANSIT."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 in zone Z2 is QUALIFIED."
            - "Shipment TRK-0001 was dispatched with 1 container and no dry ice, so 1850/1 + 275 = 2125 was stored as the provisional amount."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/shipments", payload: { donor_id: "${d1}", tracking_code: "TRK-0001", container_count: 1, uses_dry_ice: false, declared_volume_ml: 800, shipped_on: "2026-08-02" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { s1: "$.data.id" } }
          trigger:
            - { call: "GET /milk-bank/shipments/${s1}", payload: {}, as: IntakeCoordinator, as_user_id: "u-intake-1" }
          assert:
            - "Shipment.${s1}.tracking_code == TRK-0001"
            - "Shipment.${s1}.zone_code == Z2"
            - "Shipment.${s1}.status == IN_TRANSIT"
            - "Shipment.${s1}.estimated_reimbursement_cents == 2125"
            - "Shipment.${s1}.final_reimbursement_cents == null"
            - "Shipment.${s1}.credited_reimbursement_cents == null"
            - "Shipment.${s1}.excursion_minutes == null"
            - "Shipment.${s1}.received_at == null"
            - "Shipment.${s1}.version == 1"

      - name: donor_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /milk-bank/donors]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three donors created at the same logical instant, GET /donors?limit=2 returns 2 rows with total_count 3 and has_more true ordered by created_at DESC then donor_code ASC, and offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; three APPLICANT donors DNR-0001, DNR-0002, DNR-0003 exist, all created at the same logical instant so donor_code ASC is the tie-break."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0002", full_name: "Bea Ortiz", email: "bea.ortiz@example.org", zone_code: "Z1" }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0003", full_name: "Cyd Park", email: "cyd.park@example.org", zone_code: "Z3" }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
          trigger:
            - { call: "GET /milk-bank/donors", payload: { limit: 2, offset: 0 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "GET /milk-bank/donors", payload: { limit: 2, offset: 2 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
          assert:
            - "first response: response_type == array, len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "first response: data[0].donor_code == DNR-0001 and data[1].donor_code == DNR-0002"
            - "second response: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "second response: data[0].donor_code == DNR-0003"

      - name: donor_get_with_unknown_id_returns_resource_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /milk-bank/donors/{id}]
          - validations[priority=5]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown donor id on GET /donors/{id} returns ERR_RESOURCE_NOT_FOUND with HTTP 404, not an empty object."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; one donor exists so the table is non-empty and the 404 cannot be an artefact of an empty database."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
          trigger:
            - { call: "GET /milk-bank/donors/00000000-0000-4000-8000-000000000000", payload: {}, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { err: "$.data.error_id" } }
          assert:
            - "http_status == 404"
            - "${err} == ERR_RESOURCE_NOT_FOUND"

      - name: shipment_create_missing_shipped_on_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /milk-bank/shipments]
          - validations[priority=10]
          - errors[ERR_INVALID_REQUEST]
          - entities.Shipment.fields.shipped_on
        distinguishing_aspect: "Omitting the required input field shipped_on on POST /shipments returns ERR_INVALID_REQUEST (422) and creates no Shipment row, while an extra unknown body field is silently ignored rather than rejected."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 in zone Z2 is QUALIFIED so priority 44 cannot pre-empt the field check."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
          trigger:
            - { call: "POST /milk-bank/shipments", payload: { donor_id: "${d1}", tracking_code: "TRK-0001", container_count: 1, uses_dry_ice: false, declared_volume_ml: 800 }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /milk-bank/shipments", payload: { donor_id: "${d1}" }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
          assert:
            - "http_status == 422"
            - "${err} == ERR_INVALID_REQUEST"
            - "second response: total_count == 0 and len(data) == 0"

      - name: prescription_create_applies_declared_optional_defaults
        claim_type: defaults
        grounds:
          - endpoints[POST /milk-bank/prescriptions]
          - entities.Prescription.fields.requires_preterm_milk
          - entities.Prescription.fields.subsidy_required
          - entities.Prescription.fields.subsidy_program_id
          - entities.Prescription.fields.cumulative_dispensed_ml
          - entities.Prescription.fields.priority_tier
        distinguishing_aspect: "Omitting requires_preterm_milk, subsidy_required and subsidy_program_id yields false, false and null respectively, while priority_tier is derived as 1 from (NICU_INPATIENT, CRITICAL) and waitlist_position is assigned 1."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; no other prescription exists, so the new order takes waitlist_position 1 in the tier 1 bucket."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
          trigger:
            - { call: "POST /milk-bank/prescriptions", payload: { prescription_code: "RX-0001", patient_reference: "NICU-A1", patient_type: "NICU_INPATIENT", clinical_acuity: "CRITICAL", prescribed_ml: 500, needed_by_date: "2026-12-01" }, as: Prescriber, as_user_id: "u-presc-1", captures: { rx: "$.data.id" } }
          assert:
            - "Prescription.${rx}.requires_preterm_milk == false"
            - "Prescription.${rx}.subsidy_required == false"
            - "Prescription.${rx}.subsidy_program_id == null"
            - "Prescription.${rx}.priority_tier == 1"
            - "Prescription.${rx}.cumulative_dispensed_ml == 0"
            - "Prescription.${rx}.remaining_ml == 500"
            - "Prescription.${rx}.waitlist_position == 1"
            - "Prescription.${rx}.status == QUEUED"
            - "Prescription.${rx}.prescriber_user_id == u-presc-1"
            - "Prescription.${rx}.version == 1"

      - name: donation_remaining_ml_is_computed_and_body_value_ignored
        claim_type: computed_fields
        grounds:
          - endpoints[POST /milk-bank/shipments/{id}/donations]
          - entities.Donation.fields.remaining_ml
          - entities.Donation.fields.donor_id
          - entities.Donation.fields.status
          - validations[priority=10]
        distinguishing_aspect: "remaining_ml is initialised to volume_ml (700) and donor_id is copied from the shipment; a body that also sends remaining_ml 1 and status ALLOCATED is accepted with those read-only fields ignored, not rejected."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 is QUALIFIED and shipment TRK-0001 was received ACCEPTED (-18.0 C, 0 excursion minutes)."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/shipments", payload: { donor_id: "${d1}", tracking_code: "TRK-0001", container_count: 1, uses_dry_ice: false, declared_volume_ml: 700, shipped_on: "2026-08-02" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { s1: "$.data.id" } }
            - { call: "POST /milk-bank/shipments/${s1}/receive", payload: { excursion_minutes: 0, arrival_max_temp_celsius: -18.0, verified_volume_ml: 700 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "GET /milk-bank/shipments/${s1}", payload: {}, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { sv1: "$.data.version" } }
          trigger:
            - { call: "POST /milk-bank/shipments/${s1}/donations", payload: { container_label: "C1", expressed_on: "2026-07-10", volume_ml: 700, kcal_per_oz: 20.0, milk_class: "TERM", expected_shipment_version: "${sv1}" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { dn1: "$.data.id" } }
          assert:
            - "Donation.${dn1}.volume_ml == 700"
            - "Donation.${dn1}.remaining_ml == 700"
            - "Donation.${dn1}.status == ELIGIBLE"
            - "Donation.${dn1}.donor_id == ${d1}"
            - "Donation.${dn1}.shipment_id == ${s1}"
            - "Donation.${dn1}.version == 1"

      - name: donor_system_fields_are_server_generated
        claim_type: system_fields
        grounds:
          - endpoints[POST /milk-bank/donors]
          - endpoints[POST /milk-bank/donors/{id}/qualify]
          - entities.Donor.fields.qualified_by_user_id
          - validations[priority=10]
        distinguishing_aspect: "qualified_by_user_id is taken from the X-User-ID header of the qualify call (u-md-1) and never from a client-supplied body field; the id in the POST /donors response is server-minted and stable across a later GET."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 has an ACCEPTED questionnaire, a NON_REACTIVE panel and an ACTIVE approval, so qualification succeeds."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
          trigger:
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "GET /milk-bank/donors/${d1}", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
          assert:
            - "Donor.${d1}.status == QUALIFIED"
            - "Donor.${d1}.qualified_by_user_id == u-md-1"
            - "Donor.${d1}.qualified_at == 2026-08-05T08:00:00Z"
            - "second response: data.id == ${d1}"
            - "Donor.${d1}.version == 3"

      - name: donation_enum_and_range_constraints_are_enforced_separately
        claim_type: type_constraints
        grounds:
          - endpoints[POST /milk-bank/shipments/{id}/donations]
          - entities.Donation.fields.milk_class
          - entities.Donation.fields.volume_ml
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_FIELD_OUT_OF_RANGE]
        distinguishing_aspect: "An out-of-enum milk_class MIXED on a Donation is ERR_INVALID_REQUEST (priority 10) while an in-type but out-of-range volume_ml 1201 is ERR_FIELD_OUT_OF_RANGE (priority 11) — two different error categories from the same endpoint."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 is QUALIFIED and shipment TRK-0001 is ACCEPTED."
            - "Donation.milk_class admits only PRETERM and TERM (MIXED exists only as a Pool target), and volume_ml is constrained to 50..1200."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
