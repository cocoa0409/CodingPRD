              as: PanhellenicAdmin
              captures: { ch_q: $.data.id }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 cesd2", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
              captures: { rnd: $.data.id }
            - call: "POST /rush/pnms/register"
              payload: { full_name: "Qx", gpa: 3.50 }
              as: Anonymous
              captures: { qx: $.data.id }
            - call: "POST /rush/pnms/${qx}/activate"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch_q}", scheduled_start_utc: "2026-09-05T18:00:00Z", duration_minutes: 60, capacity: 10 }
              as: ChapterOfficer
              as_user_id: "${ch_q}"
              captures: { p_q: $.data.id }
            - call: "POST /rush/parties/${p_q}/open"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_q}"
            - call: "POST /rush/invitations"
              payload: { party_id: "${p_q}", pnm_id: "${qx}" }
              as: ChapterOfficer
              as_user_id: "${ch_q}"
              captures: { inv_qx: $.data.id }
            - call: "POST /rush/invitations/${inv_qx}/accept"
              payload: {}
              as: PNM
              as_user_id: "${qx}"
            - call: "POST /rush/parties/${p_q}/complete"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_q}"
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
            - call: "GET /rush/chapters/${ch_q}"
              payload: {}
              as: PanhellenicAdmin
              captures: { ch_q_v: $.data.version }
            - call: "POST /rush/bid-matches"
              payload: { round_id: "${rnd}", chapter_id: "${ch_q}", pnm_id: "${qx}", expected_chapter_version: "${ch_q_v}" }
              as: ChapterOfficer
              as_user_id: "${ch_q}"
              captures: { bid_qx: $.data.id, err_create: $.data.error_id }
          trigger:
            - call: "POST /rush/bid-matches/${bid_qx}/accept"
              payload: {}
              as: PNM
              as_user_id: "${qx}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_create is null (the POST /bid-matches succeeded in MUTUAL_SELECTION because manual create at priority 12 is allowed only in BID_DAY; if it was rejected, err_create == 'ERR_ROUND_PHASE_MISMATCH' and the test instead asserts on that earlier rejection — pinned distinguishing_aspect already covers the cross-entity dependency at the manual-create boundary)."
            - "RecruitmentRound ${rnd}.phase == MUTUAL_SELECTION (no advance to BID_DAY happened)."
            - "Either (a) the create returned 409 with err_create == 'ERR_ROUND_PHASE_MISMATCH', OR (b) if create succeeded then the trigger accept returns 409 with err_id == 'ERR_ROUND_PHASE_MISMATCH' — both branches assert the cross-entity gate Round.phase=BID_DAY is required."
            - "PNM ${qx}.status != BID_ACCEPTED."

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

