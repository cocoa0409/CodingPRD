            - { call: "POST /credit-attempts/${a_c}/mark-ready", as: DocumentationSpecialist, as_user_id: "${m_spec}" }
            - { call: "POST /certification-projects/${p_id}/submit-phase", payload: { phase: "CONSTRUCTION" }, as: ProjectAdministrator, as_user_id: "${m_admin}" }
            - { call: "POST /credit-attempts/${a_c}/begin-review", as: CertificationReviewer }
            - { call: "POST /credit-attempts/${a_c}/award", payload: { raw_points_earned: 0 }, as: CertificationReviewer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /certification-projects/${p_id}/issue-decision", payload: { decision: "CERTIFY" }, as: CertificationReviewer }
            - { call: "POST /performance-reports", payload: { project_id: "${p_id}", period_start: "2027-01-01T00:00:00Z", period_end: "2027-12-31T00:00:00Z", actual_annual_energy_cost_cents: 13110000 }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { r1: $.data.id, gap: $.data.performance_gap_pct } }
            - { call: "POST /performance-reports/${r1}/submit", as: ProjectAdministrator, as_user_id: "${m_admin}" }
          trigger:
            - { call: "POST /performance-reports/${r1}/verify", payload: { outcome: "ACCEPT" }, as: CertificationReviewer }
          assert:
            - "Captured gap == 15.00 (round_half_up(1710000/11400000*100, 2dp))"
            - "PerformanceReport.${r1}.within_tolerance == true (15.00 <= 15.00 inclusive)"
            - "HTTP 200: PerformanceReport.${r1}.status == ACCEPTED"

      - name: certification_fee_ceil_and_cap
        claim_type: constants_applied
        grounds: ["calculations.certification_fee", "entities.CertificationProject.fields.fee_balance_cents"]
        distinguishing_aspect: "Fee formula constants: sqft 120001 -> ceil(120.001)=121 -> 250000+5000*121 = 855000; sqft 999999 -> min(250000+5000*1000, 2000000) = 2000000 (cap binds)."
        test_recipe:
          setup: ["Two PRESCRIPTIVE projects each with one READY prerequisite attempt: P1 sqft 120001 budget 5000000; P2 sqft 999999 budget 10000000"]
          setup_api_calls:
            - { call: "POST /team-members", payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }, as: ProgramAdmin, captures: { m_admin: $.data.id } }
            - { call: "POST /team-members", payload: { full_name: "Dana Docs", email: "dana@x.com", specialty: "DOCUMENTATION" }, as: ProgramAdmin, captures: { m_spec: $.data.id } }
            - { call: "POST /credit-library-entries", payload: { credit_code: "EAp1", title: "Fundamental Commissioning", category: "ENERGY_ATMOSPHERE", points_possible: 0, is_prerequisite: true, phase_eligibility: "BOTH", requires_energy_model: false }, as: ProgramAdmin, captures: { e_p: $.data.id } }
            - { call: "POST /certification-projects", payload: { project_name: "Ceil Tower", rating_system: "LEED_BD_C", compliance_path: "PRESCRIPTIVE", gross_floor_area_sqft: 120001, target_level: "CERTIFIED", fee_budget_cents: 5000000 }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { p1: $.data.id } }
            - { call: "POST /credit-attempts", payload: { project_id: "${p1}", credit_library_entry_id: "${e_p}", phase: "DESIGN", documentation_owner_id: "${m_spec}" }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { a_1: $.data.id } }
            - { call: "GET /certification-projects/${p1}", as: Any, captures: { p1_v: $.data.version } }
            - { call: "POST /certification-projects/${p1}/lock-strategy", payload: { expected_project_version: "${p1_v}" }, as: ProjectAdministrator, as_user_id: "${m_admin}" }
            - { call: "POST /credit-attempts/${a_1}/assign-owner", payload: { documentation_owner_id: "${m_spec}" }, as: ProjectAdministrator, as_user_id: "${m_admin}" }
            - { call: "POST /credit-attempts/${a_1}/mark-ready", as: DocumentationSpecialist, as_user_id: "${m_spec}" }
            - { call: "POST /certification-projects", payload: { project_name: "Cap Tower", rating_system: "LEED_BD_C", compliance_path: "PRESCRIPTIVE", gross_floor_area_sqft: 999999, target_level: "CERTIFIED", fee_budget_cents: 10000000 }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { p2: $.data.id } }
            - { call: "POST /credit-attempts", payload: { project_id: "${p2}", credit_library_entry_id: "${e_p}", phase: "DESIGN", documentation_owner_id: "${m_spec}" }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { a_2: $.data.id } }
            - { call: "GET /certification-projects/${p2}", as: Any, captures: { p2_v: $.data.version } }
            - { call: "POST /certification-projects/${p2}/lock-strategy", payload: { expected_project_version: "${p2_v}" }, as: ProjectAdministrator, as_user_id: "${m_admin}" }
            - { call: "POST /credit-attempts/${a_2}/assign-owner", payload: { documentation_owner_id: "${m_spec}" }, as: ProjectAdministrator, as_user_id: "${m_admin}" }
            - { call: "POST /credit-attempts/${a_2}/mark-ready", as: DocumentationSpecialist, as_user_id: "${m_spec}" }
          trigger:
            - { call: "POST /certification-projects/${p1}/submit-phase", payload: { phase: "DESIGN" }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { bal1: $.data.fee_balance_cents } }
            - { call: "POST /certification-projects/${p2}/submit-phase", payload: { phase: "DESIGN" }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { bal2: $.data.fee_balance_cents } }
          assert:
            - "Captured bal1 == 4145000 (5000000 - 855000; ceil(120001/1000)=121 applied before multiplication)"
            - "Captured bal2 == 8000000 (10000000 - 2000000; FEE_CAP_CENTS binds over 5250000)"

      - name: energy_improvement_variant_divergence
        claim_type: variant_divergence
        grounds: ["calculations.energy_cost_improvement"]
        excluded_because:
          difficulty_instance: energy_model_provisional_vs_final_improvement
          rationale: "Both variants computed and asserted with exact literals (10.00 vs 5.00) in the §1.8 instance."

      - name: level_projection_variant_selection
        claim_type: variant_selection
        grounds: ["calculations.certification_level_of_points"]
        excluded_because:
          difficulty_instance: project_optimistic_vs_conservative_level
          rationale: "Optimistic vs conservative input sets asserted on the same portfolio in the §1.8 instance."

      - name: incentive_stacking_cap_binds
        claim_type: correct_result
        grounds: ["calculations.incentive_stacking_waterfall"]
        excluded_because:
          difficulty_instance: incentive_stacking_cap_waterfall
          rationale: "Waterfall with binding cap asserted at 20000000 in the §1.8 instance; the below-cap path is covered by corner instance derived_field_recalc_and_waterfall_below_cap (complexity_layers section)."

  - section: validations
    instances:
      - name: create_project_missing_auth_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers fails with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /certification-projects", payload: { project_name: "NoAuth Tower", rating_system: "LEED_BD_C", compliance_path: "PRESCRIPTIVE", gross_floor_area_sqft: 120000, target_level: "CERTIFIED", fee_budget_cents: 5000000 }, as: ProjectAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400, captured err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (headers stripped by the test harness)"

      - name: assign_owner_invalid_specialty_rejected
