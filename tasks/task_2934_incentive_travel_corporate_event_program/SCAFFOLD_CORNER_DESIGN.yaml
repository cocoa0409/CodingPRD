  instances:
  - name: stale_expected_program_version_on_registration_create_is_rejected
    claim_type: optimistic_concurrency
    grounds:
    - §1.2.1 rule registration-create-stale-program (write_endpoint POST /registrations, occ_field expected_program_version,
      error ERR_STALE_PROGRAM_VERSION, 412)
    - §1.4 the OCC precondition check
    - §1.1 Program.version
    - §1.0 complexity_layers optimistic_concurrency
    distinguishing_aspect: |
      The first of the two §1.2.1 rules, and the one guarding the entity that everything else hangs off. The recipe is built so that the version the client holds goes stale for a completely ordinary reason — another seat was created — rather than through any notion of two callers acting together: the reads and writes are strictly sequential. What distinguishes it from the activity rule is the parent entity and the failure it prevents: POST /registrations is legitimately re-issuable, so without the guard a client acting on an old view of the program could add a seat after the gross-up policy locked or the budget was re-approved. The complementary case, where the version is correct but the program state is wrong, is left to the state instances.
