            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /accounts/${acct_id}/close"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /children/${child_id}/weight-measurements"
              payload: { weight_grams: 8500 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CHILD_ARCHIVED"
            - "Child.${child_id}.archived == true"
            - "Child.${child_id}.weight_grams == 7000"
            - "Child.${child_id}.stage == S2"

      - name: corner_activate_an_already_active_subscription_rejected
        claim_type: idempotency
        grounds: ["state_machines.Subscription.DRAFT_to_ACTIVE", "errors[ERR_SUBSCRIPTION_STATE_INVALID]"]
        distinguishing_aspect: "The second activate observes lifecycle_state ACTIVE, fails at priority 22 with ERR_SUBSCRIPTION_STATE_INVALID (409), and does NOT re-set anchor_date."
        test_recipe:
