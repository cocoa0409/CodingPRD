          - entities.RenewalForecast.fields.variance_cents
          - entities.RenewalForecast.fields.finance_state
        distinguishing_aspect: |
          Metric 3 on a third endpoint (POST /renewal-forecasts/{id}/reconcile):
          the tolerance test is a strict `>` over integer cross-multiplication,
          so a variance of exactly 1050000 on a 21000000 CS number RECONCILES
          while 1050001 flags.
