# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3165_salvage_vehicle_online_auction_member_licensing_title
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7 claims not already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Corners §1.8 covers appear as
# excluded_because stubs. Clock default before any set call:
# 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: vehicle_create_returns_defaults_and_assigns_status
        claim_type: Creation
        grounds:
          - entities.Vehicle
          - endpoints.POST_/vehicles
        distinguishing_aspect: "POST /vehicles with required fields returns 201 with status ASSIGNED, image_count 0, primary_damage NONE, run_and_drive_status UNKNOWN, title_brand NONE, version 1, assigned_at == logical clock 2026-09-01T00:00:00Z."
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z. One CA yard, one STANDARD seller."
          setup_api_calls:
            - call: "POST /salvage-auction/yards"
              payload: { name: "CA Yard", state_code: "CA", daily_storage_rate_cents: 1000, free_storage_days: 1 }
              as: PlatformAdmin
              captures: { yard_id: $.data.id }
            - call: "POST /salvage-auction/sellers"
              payload: { name: "Insurer A", seller_type: "INSURER", fee_schedule: "STANDARD" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
          trigger:
            - call: "POST /salvage-auction/vehicles"
              payload: { seller_id: "${seller_id}", yard_id: "${yard_id}", vin: "1HGCM82633A004352", year: 2019, make: "Honda", model: "Accord", lot_type: "STANDARD", reserve_price_cents: 0, sale_type: "PURE", odometer_reading: 50000 }
              as: SellerAgent
              as_user_id: "${seller_id}"
              captures: { vehicle_id: $.data.id }
          assert:
            - "response status 201; Vehicle.${vehicle_id}.status == ASSIGNED"
            - "Vehicle.${vehicle_id}.image_count == 0 and damage_codes == [] (default applied)"
            - "Vehicle.${vehicle_id}.primary_damage == NONE and run_and_drive_status == UNKNOWN and title_brand == NONE"
            - "Vehicle.${vehicle_id}.version == 1 and assigned_at == 2026-09-01T00:00:00Z (logical clock default)"
            - "response carries non-null id, created_at, updated_at and meta.api_request_id"

      - name: member_create_country_code_defaults_to_us
        claim_type: Defaults
        grounds:
          - entities.Member.fields.country_code
          - endpoints.POST_/members
        distinguishing_aspect: "Omitting country_code on member creation stores the default 'US' — the member is NOT treated as an exporter."
        test_recipe:
          setup: ["Empty database, clock default."]
          setup_api_calls: []
          trigger:
            - call: "POST /salvage-auction/members"
              payload: { email: "b1@x.com", full_name: "Buyer One", home_state: "CA", tier: "PREMIER" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
          assert:
            - "Member.${member_id}.country_code == \"US\""
            - "Member.${member_id}.status == ACTIVE and version == 1"

      - name: vehicle_vin_must_be_seventeen_chars
        claim_type: Type Constraints
        grounds:
          - entities.Vehicle.fields.vin
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "A 16-character VIN fails the type/format constraint with 400 ERR_INVALID_REQUEST before any state or uniqueness check."
        test_recipe:
          setup: ["One CA yard, one STANDARD seller."]
          setup_api_calls:
            - call: "POST /salvage-auction/yards"
              payload: { name: "CA Yard", state_code: "CA", daily_storage_rate_cents: 1000, free_storage_days: 1 }
              as: PlatformAdmin
              captures: { yard_id: $.data.id }
            - call: "POST /salvage-auction/sellers"
              payload: { name: "Insurer A", seller_type: "INSURER", fee_schedule: "STANDARD" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
          trigger:
            - call: "POST /salvage-auction/vehicles"
              payload: { seller_id: "${seller_id}", yard_id: "${yard_id}", vin: "SHORTVIN1234567X", year: 2019, make: "Honda", model: "Accord", lot_type: "STANDARD", reserve_price_cents: 0, sale_type: "PURE", odometer_reading: 50000 }
              as: SellerAgent
              as_user_id: "${seller_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and ${err} == ERR_INVALID_REQUEST (VIN 16 chars, needs 17)"

      - name: vehicles_list_filters_and_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/vehicles
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /vehicles?status=ASSIGNED returns only ASSIGNED rows; limit=1&offset=0 on a 2-row filtered set reports total_count 2 and has_more true; offset=1 has_more false."
        test_recipe:
          setup: ["One yard, one seller, two ASSIGNED vehicles."]
          setup_api_calls:
            - call: "POST /salvage-auction/yards"
              payload: { name: "CA Yard", state_code: "CA", daily_storage_rate_cents: 1000, free_storage_days: 1 }
              as: PlatformAdmin
              captures: { yard_id: $.data.id }
            - call: "POST /salvage-auction/sellers"
              payload: { name: "Insurer A", seller_type: "INSURER", fee_schedule: "STANDARD" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /salvage-auction/vehicles"
              payload: { seller_id: "${seller_id}", yard_id: "${yard_id}", vin: "1HGCM82633A004352", year: 2019, make: "Honda", model: "Accord", lot_type: "STANDARD", reserve_price_cents: 0, sale_type: "PURE", odometer_reading: 50000 }
              as: SellerAgent
              as_user_id: "${seller_id}"
            - call: "POST /salvage-auction/vehicles"
              payload: { seller_id: "${seller_id}", yard_id: "${yard_id}", vin: "5YJSA1E26HF1B0007", year: 2020, make: "Tesla", model: "Model S", lot_type: "STANDARD", reserve_price_cents: 0, sale_type: "PURE", odometer_reading: 30000 }
              as: SellerAgent
              as_user_id: "${seller_id}"
          trigger:
            - call: "GET /salvage-auction/vehicles"
              payload: { status: "ASSIGNED", limit: 1, offset: 0 }
              as: Auctioneer
          assert:
            - "response_type is array; exactly 1 row returned with total_count == 2 and has_more == true"
            - "GET /vehicles?status=ASSIGNED&limit=1&offset=1 returns 1 row with total_count == 2 and has_more == false"
            - "GET /vehicles?status=SOLD returns 0 rows with total_count == 0"
            - "GET /vehicles with no params returns 2 rows under the default limit 10"

      - name: vehicle_get_unknown_id_returns_vehicle_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/vehicles/{id}
          - errors.ERR_VEHICLE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid unallocated UUID produces the entity-specific 404 ERR_VEHICLE_NOT_FOUND, not a generic 404 and not a 400."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /salvage-auction/vehicles/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Auctioneer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and ${err} == ERR_VEHICLE_NOT_FOUND"
            - "response_type is error and data carries error_id and message"

      - name: title_record_reverse_reachable_from_vehicle
        claim_type: Parent Relationships
        grounds:
          - entities.TitleRecord.fields.vehicle_id
          - endpoints.GET_/vehicles/{id}/title
        distinguishing_aspect: "GET /vehicles/{id}/title returns an array of length 0 before title receipt and length 1 after — FK reverse reachability in sub-resource form for a 1:1 relationship."
        test_recipe:
          setup: ["One yard, one seller, one ASSIGNED vehicle with no title."]
          setup_api_calls:
            - call: "POST /salvage-auction/yards"
              payload: { name: "CA Yard", state_code: "CA", daily_storage_rate_cents: 1000, free_storage_days: 1 }
              as: PlatformAdmin
              captures: { yard_id: $.data.id }
            - call: "POST /salvage-auction/sellers"
              payload: { name: "Insurer A", seller_type: "INSURER", fee_schedule: "STANDARD" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /salvage-auction/vehicles"
              payload: { seller_id: "${seller_id}", yard_id: "${yard_id}", vin: "1HGCM82633A004352", year: 2019, make: "Honda", model: "Accord", lot_type: "STANDARD", reserve_price_cents: 0, sale_type: "PURE", odometer_reading: 50000 }
              as: SellerAgent
              as_user_id: "${seller_id}"
              captures: { vehicle_id: $.data.id }
          trigger:
            - call: "GET /salvage-auction/vehicles/${vehicle_id}/title"
              payload: {}
              as: TitleClerk
              captures: { pre_count: "$.data" }
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/title"
              payload: { title_type: "CLEAN" }
              as: TitleClerk
              captures: { title_id: $.data.id }
            - call: "GET /salvage-auction/vehicles/${vehicle_id}/title"
              payload: {}
              as: TitleClerk
          assert:
            - "before receipt the sub-resource returns an empty array"
            - "after POST the sub-resource returns exactly 1 row with id == ${title_id}, status RECEIVED, transferability TRANSFERABLE, jurisdiction_state == CA (copied from the yard, not the member)"

      - name: bid_is_immutable_event_row_without_version
        claim_type: Immutability
        grounds:
          - entities.Bid
        distinguishing_aspect: "Bid has common_fields: false — the row carries id and created_at but no version/updated_at, and no update endpoint exists; its only mutable projection is the is_winning flag maintained by the outbid cascade."
        test_recipe:
          setup: ["CA yard, seller, PURE vehicle listed and open in a live auction."]
          setup_api_calls:
            - call: "POST /salvage-auction/yards"
              payload: { name: "CA Yard", state_code: "CA", daily_storage_rate_cents: 1000, free_storage_days: 1 }
              as: PlatformAdmin
              captures: { yard_id: $.data.id }
            - call: "POST /salvage-auction/sellers"
              payload: { name: "Insurer A", seller_type: "INSURER", fee_schedule: "STANDARD" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /salvage-auction/members"
              payload: { email: "b1@x.com", full_name: "Buyer One", home_state: "CA", tier: "BASIC" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /salvage-auction/vehicles"
              payload: { seller_id: "${seller_id}", yard_id: "${yard_id}", vin: "1HGCM82633A004352", year: 2019, make: "Honda", model: "Accord", lot_type: "STANDARD", reserve_price_cents: 0, sale_type: "PURE", odometer_reading: 50000, damage_codes: ["FRONT"] }
              as: SellerAgent
              as_user_id: "${seller_id}"
              captures: { vehicle_id: $.data.id }
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/title"
              payload: { title_type: "SALVAGE" }
              as: TitleClerk
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/condition"
              payload: { primary_damage: "FRONT", run_and_drive_status: "RUN_AND_DRIVE" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/1" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/2" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/3" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/4" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/5" }
              as: YardOperator
            - call: "GET /salvage-auction/vehicles/${vehicle_id}"
              payload: {}
              as: YardOperator
              captures: { vehicle_v: $.data.version }
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/mark-ready"
              payload: { expected_vehicle_version: "${vehicle_v}" }
              as: YardOperator
            - call: "POST /salvage-auction/auctions"
              payload: { name: "A1", scheduled_start: "2026-09-01T00:00:00Z" }
              as: Auctioneer
              captures: { auc1: $.data.id }
            - call: "POST /salvage-auction/auctions/${auc1}/items"
              payload: { vehicle_id: "${vehicle_id}" }
              as: Auctioneer
              captures: { item1: $.data.id }
            - call: "POST /salvage-auction/auctions/${auc1}/start"
              payload: {}
              as: Auctioneer
            - call: "POST /salvage-auction/auctions/${auc1}/items/${item1}/open-lot"
              payload: {}
              as: Auctioneer
          trigger:
            - call: "POST /salvage-auction/bids"
              payload: { auction_item_id: "${item1}", amount_cents: 1000000 }
              as: Buyer
              as_user_id: "${member_id}"
              captures: { bid_id: $.data.id }
          assert:
            - "Bid.${bid_id} response data contains id and created_at but NO version field and NO updated_at field"
            - "Bid.${bid_id}.bid_type == LIVE and is_winning == true and placed_at == 2026-09-01T00:00:00Z"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: mark_ready_from_sale_ready_rejected_as_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Vehicle.AWAITING_CONDITION_to_SALE_READY
          - errors.ERR_VEHICLE_INVALID_STATE
        distinguishing_aspect: "mark-ready is declared only from AWAITING_CONDITION; calling it again once the vehicle is already SALE_READY is an invalid-from rejection (409), not a no-op success."
        test_recipe:
          setup: ["CA yard; seller; vehicle fully prepared and already marked SALE_READY."]
          setup_api_calls:
            - call: "POST /salvage-auction/yards"
              payload: { name: "CA Yard", state_code: "CA", daily_storage_rate_cents: 1000, free_storage_days: 1 }
              as: PlatformAdmin
              captures: { yard_id: $.data.id }
            - call: "POST /salvage-auction/sellers"
              payload: { name: "Insurer A", seller_type: "INSURER", fee_schedule: "STANDARD" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /salvage-auction/vehicles"
              payload: { seller_id: "${seller_id}", yard_id: "${yard_id}", vin: "1HGCM82633A004352", year: 2019, make: "Honda", model: "Accord", lot_type: "STANDARD", reserve_price_cents: 0, sale_type: "PURE", odometer_reading: 50000, damage_codes: ["FRONT"] }
              as: SellerAgent
              as_user_id: "${seller_id}"
              captures: { vehicle_id: $.data.id }
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/title"
              payload: { title_type: "SALVAGE" }
              as: TitleClerk
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/condition"
              payload: { primary_damage: "FRONT", run_and_drive_status: "RUN_AND_DRIVE" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/1" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/2" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/3" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/4" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/5" }
              as: YardOperator
            - call: "GET /salvage-auction/vehicles/${vehicle_id}"
              payload: {}
              as: YardOperator
              captures: { vehicle_v: $.data.version }
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/mark-ready"
              payload: { expected_vehicle_version: "${vehicle_v}" }
              as: YardOperator
            - call: "GET /salvage-auction/vehicles/${vehicle_id}"
              payload: {}
              as: YardOperator
              captures: { vehicle_v2: $.data.version }
          trigger:
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/mark-ready"
              payload: { expected_vehicle_version: "${vehicle_v2}" }
              as: YardOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and ${err} == ERR_VEHICLE_INVALID_STATE"
            - "Vehicle.${vehicle_id}.status == SALE_READY (unchanged) and version unchanged"

      - name: terminal_state_lockdown_loaded_out_vehicle_rejects_cancel
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Vehicle
          - errors.ERR_VEHICLE_NOT_CANCELLABLE
        distinguishing_aspect: "LOADED_OUT is terminal: cancel on a fully loaded-out vehicle is rejected ERR_VEHICLE_NOT_CANCELLABLE and no side effects fire."
        test_recipe:
          setup: ["Full happy path: CA yard, seller, US buyer; PURE vehicle sold at 1000000, paid 1120000, gate pass slot 2026-09-02T14:00-18:00, clock moved to 2026-09-02T15:00, checked in, completed (vehicle LOADED_OUT)."]
          setup_api_calls:
            - call: "POST /salvage-auction/yards"
              payload: { name: "CA Yard", state_code: "CA", daily_storage_rate_cents: 1000, free_storage_days: 1 }
              as: PlatformAdmin
              captures: { yard_id: $.data.id }
            - call: "POST /salvage-auction/sellers"
              payload: { name: "Insurer A", seller_type: "INSURER", fee_schedule: "STANDARD" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /salvage-auction/members"
              payload: { email: "b1@x.com", full_name: "Buyer One", home_state: "CA", tier: "BASIC" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /salvage-auction/vehicles"
              payload: { seller_id: "${seller_id}", yard_id: "${yard_id}", vin: "1HGCM82633A004352", year: 2019, make: "Honda", model: "Accord", lot_type: "STANDARD", reserve_price_cents: 0, sale_type: "PURE", odometer_reading: 50000, damage_codes: ["FRONT"] }
              as: SellerAgent
              as_user_id: "${seller_id}"
              captures: { vehicle_id: $.data.id }
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/title"
              payload: { title_type: "SALVAGE" }
              as: TitleClerk
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/condition"
              payload: { primary_damage: "FRONT", run_and_drive_status: "RUN_AND_DRIVE" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/1" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/2" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/3" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/4" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/5" }
              as: YardOperator
            - call: "GET /salvage-auction/vehicles/${vehicle_id}"
              payload: {}
              as: YardOperator
              captures: { vehicle_v: $.data.version }
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/mark-ready"
              payload: { expected_vehicle_version: "${vehicle_v}" }
              as: YardOperator
            - call: "POST /salvage-auction/auctions"
              payload: { name: "A1", scheduled_start: "2026-09-01T00:00:00Z" }
              as: Auctioneer
              captures: { auc1: $.data.id }
            - call: "POST /salvage-auction/auctions/${auc1}/items"
              payload: { vehicle_id: "${vehicle_id}" }
              as: Auctioneer
              captures: { item1: $.data.id }
            - call: "POST /salvage-auction/auctions/${auc1}/start"
              payload: {}
              as: Auctioneer
            - call: "POST /salvage-auction/auctions/${auc1}/items/${item1}/open-lot"
              payload: {}
              as: Auctioneer
            - call: "POST /salvage-auction/bids"
              payload: { auction_item_id: "${item1}", amount_cents: 1000000 }
              as: Buyer
              as_user_id: "${member_id}"
            - call: "POST /salvage-auction/auctions/${auc1}/items/${item1}/close-lot"
              payload: {}
              as: Auctioneer
              captures: { sale_id: $.data.id }
            - call: "POST /salvage-auction/sales/${sale_id}/payments"
              payload: { amount_cents: 1120000 }
              as: Buyer
              as_user_id: "${member_id}"
            - call: "POST /salvage-auction/sales/${sale_id}/gate-passes"
              payload: { slot_start: "2026-09-02T14:00:00Z", slot_end: "2026-09-02T18:00:00Z" }
              as: Buyer
              as_user_id: "${member_id}"
              captures: { gp_id: $.data.id }
            - call: "POST /salvage-auction/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T15:00:00Z" }
              as: PlatformAdmin
            - call: "POST /salvage-auction/gate-passes/${gp_id}/check-in"
              payload: {}
              as: YardOperator
            - call: "POST /salvage-auction/gate-passes/${gp_id}/complete"
              payload: {}
              as: YardOperator
          trigger:
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/cancel"
              payload: {}
              as: SellerAgent
              as_user_id: "${seller_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and ${err} == ERR_VEHICLE_NOT_CANCELLABLE"
            - "Vehicle.${vehicle_id}.status == LOADED_OUT (terminal, unchanged)"

      - name: auto_transition_fifth_image_advances_vehicle
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Vehicle.ASSIGNED_to_AWAITING_CONDITION
        excluded_because:
          difficulty_instance: boundary_precision_check / image_count_five_threshold_for_mark_ready
          rationale: "The 4-vs-5 boundary instance asserts the auto-transition both below and at the threshold."

      - name: auction_auto_completes_when_last_item_closes
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Auction.LIVE_to_COMPLETED
        distinguishing_aspect: "Closing the only LIVE item of a live auction flips Auction.status LIVE -> COMPLETED automatically — a child-driven parent transition with no explicit auction close call."
        test_recipe:
          setup: ["CA yard; seller; US buyer; PURE vehicle open in a live auction with one winning bid 1000000."]
          setup_api_calls:
            - call: "POST /salvage-auction/yards"
              payload: { name: "CA Yard", state_code: "CA", daily_storage_rate_cents: 1000, free_storage_days: 1 }
              as: PlatformAdmin
              captures: { yard_id: $.data.id }
            - call: "POST /salvage-auction/sellers"
              payload: { name: "Insurer A", seller_type: "INSURER", fee_schedule: "STANDARD" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /salvage-auction/members"
              payload: { email: "b1@x.com", full_name: "Buyer One", home_state: "CA", tier: "BASIC" }
              as: PlatformAdmin
