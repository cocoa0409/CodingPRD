  - name: order_cancellation_conserves_inventory_and_locks
    grounds:
    - state_machines.PurchaseOrder.STRUCTURED_to_CANCELLED
    - state_machines.Vehicle.RESERVED_to_LISTED
    - state_machines.FinancingPrequalification.LOCKED_to_PREQUALIFIED
    distinguishing_aspect: 'Conserved quantity: listing-lock accounting. Reserve then cancel

      leaves exactly the pre-reserve world: Vehicle back LISTED, the

      prequalification''s lock count back to zero (status PREQUALIFIED,

      locked_order_id null), and no orphan TitleRegistration rows — a

      different conserved quantity (inventory/lock cardinality) than money.

      '
    test_recipe:
      setup:
      - a financed order in APPOINTMENT_SET (vehicle RESERVED, prequalification LOCKED, appointment SCHEDULED, TitleRegistration PENDING)
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Inv2 U
          email: inv2@x.com
          state_code: GA
        as: PlatformAdmin
