# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Aggregate Quarry & Crushed-Stone Operations
# 9 rule groups, 22 instances. Every recipe replays from empty-DB using only
# SCAFFOLD.yaml §1.5 endpoints. Default logical clock: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: muckpile_design_vs_reconciled_tonnage
        grounds:
          - calculations.blast_tonnage_estimate
          - calculations.muckpile_remaining
          - entities.Muckpile.fields.estimated_tons
          - entities.Muckpile.fields.actual_fed_tons
          - state_machines.Muckpile.OPEN_to_DEPLETED
        distinguishing_aspect: |
          Entity domain ShotPlan/Muckpile: the DESIGN variant (geometric
          estimate 3792.6 t from pattern dimensions) and the RECONCILED variant
          (belt-measured actual_fed_tons 1000.0 after one run) diverge for
          identical blast data; remaining_tons = 2792.6 pins the delta.
        test_recipe:
          setup:
            - "Site with 200 permitted acres, bond rate 12000/acre, bond 100000 posted (posture OPERATING)"
            - "Bench BENCH-1400 (5.0 ac) RELEASED; ShotPlan (20 holes, 8x10 ft, 40 ft deep, 50 lbs/hole) FIRED; muckpile created"
            - "Spec A57 (COARSE, 12.50) + spec FINE-1 (FINE, 9.00); stockpiles A/B (capacity 5000 each); belt scale certified through 2026-08-01"
            - "One COMPLETED run input 1000.0 with outputs 620.0 to pile A and 350.0 to pile B; clock 2026-08-01T10:00:00Z"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /reclamation-bonds", payload: { site_id: "${site}", surety_name: "SuretyCo", amount_usd: 100000 }, as: FinanceClerk, captures: { bond: $.data.id } }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "BENCH-1400", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { bench: $.data.id } }
            - { call: "POST /benches/${bench}/release", payload: {}, as: SiteManager }
            - { call: "POST /shot-plans", payload: { bench_id: "${bench}", hole_count: 20, burden_ft: 8, spacing_ft: 10, hole_depth_ft: 40, explosive_per_hole_lbs: 50 }, as: BlastForeman, as_user_id: "bf-1", captures: { plan: $.data.id, est_tons: $.data.estimated_tons } }
            - { call: "POST /shot-plans/${plan}/submit", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/approve", payload: {}, as: SiteManager, as_user_id: "sm-1" }
            - { call: "POST /training-records", payload: { miner_name: "Blaster One", miner_user_id: "bf-1", course_type: "TASK_TRAINING", completed_on: "2026-01-15" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: QuarryAdmin }
            - { call: "POST /shot-plans/${plan}/start-drilling", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/complete-drilling", payload: { drilled_hole_count: 20 }, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/load", payload: { loaded_explosive_lbs: 1000 }, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/fire", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "GET /muckpiles", payload: { shot_plan_id: "${plan}" }, as: SiteManager, as_user_id: "sm-1", captures: { mp: "$.data[0].id" } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 }, { sieve: "No4", min_pct: 0, max_pct: 10 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { specA: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "FINE-1", category: "FINE", gradation_bands: [ { sieve: "No4", min_pct: 90, max_pct: 100 }, { sieve: "No200", min_pct: 0, max_pct: 5 } ], base_price_per_ton: 9.00 }, as: QuarryAdmin, captures: { specB: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${specA}", capacity_tons: 5000 }, as: SiteManager, captures: { pileA: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${specB}", capacity_tons: 5000 }, as: SiteManager, captures: { pileB: $.data.id } }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "BELT-01", scale_type: "BELT" }, as: QuarryAdmin, captures: { belt: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${belt}", calibrated_on: "2026-02-02", as_found_error_pct: 0.10, as_left_error_pct: 0.05 }, as: QuarryAdmin }
            - { call: "POST /plant-runs", payload: { site_id: "${site}", muckpile_id: "${mp}", belt_scale_id: "${belt}", circuit_line: "PRIMARY" }, as: PlantOperator, as_user_id: "po-1", captures: { run: $.data.id } }
            - { call: "POST /plant-runs/${run}/start", payload: {}, as: PlantOperator, as_user_id: "po-1" }
            - { call: "POST /plant-runs/${run}/complete", payload: { input_tons: 1000.0, outputs: [ { stockpile_id: "${pileA}", product_spec_id: "${specA}", tons: 620.0 }, { stockpile_id: "${pileB}", product_spec_id: "${specB}", tons: 350.0 } ] }, as: PlantOperator, as_user_id: "po-1" }
          trigger:
            - { call: "GET /muckpiles/${mp}", payload: {}, as: PlantOperator, as_user_id: "po-1" }
          assert:
            - "Muckpile.${mp}.estimated_tons == 3792.6 (design variant: 20*8*10*40/27 yd3 x 1.6, 1 dp round_half_up)"
            - "Muckpile.${mp}.actual_fed_tons == 1000.0 (reconciled variant: belt-measured run input)"
            - "Muckpile.${mp}.remaining_tons == 2792.6"
            - "Muckpile.${mp}.status == OPEN"
            - "ShotPlan.${plan}.powder_factor == 0.26"
            - "the two variants diverge: estimated_tons (3792.6) != actual_fed_tons (1000.0) for identical blast data"

      - name: royalty_provisional_flat_vs_final_marginal_tier
        grounds:
          - calculations.royalty_amount
          - entities.ScaleTicket.fields.royalty_provisional_usd
          - entities.RoyaltyStatement.fields.royalty_due_usd
        distinguishing_aspect: |
          Entity domain ScaleTicket/RoyaltyStatement (different from the
          muckpile instance): the PROVISIONAL variant (flat base rate per
          ticket) totals 13.00 while the FINAL variant (marginal YTD tier with
          the 50-ton threshold crossed inside ticket 2) totals 13.30 for the
          identical two tickets.
        test_recipe:
          setup:
            - "Site; spec A57; stockpile with on_hand 200.0 (adjustment); ACTIVE agreement base 0.25/ton, tier 0.40/ton beyond 50 t YTD; zone; order qty 100 CONFIRMED"
            - "Certified TRUCK scale; clock 2026-01-10T12:00:00Z; two COMPLETED tickets of net 26.000 t each in January"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id, pile_v: $.data.version } }
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 200.0, reason: "opening survey", expected_stockpile_version: "${pile_v}" }, as: SiteManager }
            - { call: "POST /royalty-agreements", payload: { site_id: "${site}", landowner_name: "LW", base_rate_per_ton: 0.25, tier_threshold_tons: 50, tier_rate_per_ton: 0.40, effective_from: "2026-01-01" }, as: FinanceClerk, captures: { agr: $.data.id } }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "TRUCK-01", scale_type: "TRUCK" }, as: QuarryAdmin, captures: { scale: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${scale}", calibrated_on: "2025-12-01", as_found_error_pct: 0.10, as_left_error_pct: 0.10 }, as: QuarryAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-10T12:00:00Z" }, as: QuarryAdmin }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 100 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id } }
            - { call: "POST /sales-orders/${ord}/confirm", payload: {}, as: SalesAgent, as_user_id: "sa-1" }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-1", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe1: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets", payload: { queue_entry_id: "${qe1}", sales_order_id: "${ord}", scale_id: "${scale}", gross_lbs: 80000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { tkt1: $.data.id } }
            - { call: "POST /queue-entries/${qe1}/begin-scale-out", payload: {}, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets/${tkt1}/weigh-out", payload: { tare_lbs: 28000 }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-2", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe2: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets", payload: { queue_entry_id: "${qe2}", sales_order_id: "${ord}", scale_id: "${scale}", gross_lbs: 80000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { tkt2: $.data.id } }
            - { call: "POST /queue-entries/${qe2}/begin-scale-out", payload: {}, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets/${tkt2}/weigh-out", payload: { tare_lbs: 28000 }, as: ScaleHouseOperator, as_user_id: "sh-1" }
          trigger:
            - { call: "POST /royalty-statements", payload: { site_id: "${site}", period_start: "2026-01-01", period_end: "2026-02-01" }, as: FinanceClerk, as_user_id: "fc-1", captures: { stmt: $.data.id } }
          assert:
            - "ScaleTicket.${tkt1}.royalty_provisional_usd == 6.50 and ScaleTicket.${tkt2}.royalty_provisional_usd == 6.50 (provisional variant total 13.00)"
            - "RoyaltyStatement.${stmt}.royalty_due_usd == 13.30 (final variant: t1 26.000 t all at base = 6.50; t2 splits 24 t base = 6.00 + 2 t tier = 0.80 -> 6.80)"
            - "RoyaltyStatement.${stmt}.tons_sold == 52.000, ytd_tons_before == 0, ytd_tons_after == 52.000"
            - "final variant 13.30 != provisional total 13.00 for identical ticket data"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial formulas across different modes (a), (b), (c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: delivered_price_multi_input_quote
        grounds:
          - calculations.delivered_price_quote
          - entities.SalesOrder.fields.quoted_unit_delivered_per_ton
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: volume-tier factor
          (average-rate 0.95 at qty 500), zone freight, and a fuel-surcharge
          tier selected by the material+freight subtotal combine into
          11.88 + 6.00 + 1.43 = 19.31/ton; total 9655.00.
        test_recipe:
          setup:
            - "Spec A57 base_price_per_ton 12.50 (COARSE); zone Z-LOCAL base_freight_per_ton 6.00; order quantity 500 t"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
          trigger:
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 500 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id } }
          assert:
            - "SalesOrder.${ord}.quoted_material_per_ton == 11.88 (round_half_up(12.50 x 0.95, 2) from 11.875)"
            - "SalesOrder.${ord}.quoted_freight_per_ton == 6.00"
            - "SalesOrder.${ord}.quoted_surcharge_per_ton == 1.43 (subtotal 17.88 < 20.00 -> 8% -> round(1.4304) = 1.43)"
            - "SalesOrder.${ord}.quoted_unit_delivered_per_ton == 19.31"
            - "SalesOrder.${ord}.quoted_total_usd == 9655.00"

      - name: royalty_per_ticket_rounding_order
        grounds:
          - calculations.royalty_amount
          - entities.RoyaltyStatement.fields.royalty_due_usd
        distinguishing_aspect: |
          Mode (b) — nested rounding order: the scaffold pins
          round-per-ticket-then-sum. Two 10.010 t tickets at 0.50/ton yield
          round(5.005) = 5.01 each -> 10.02; summing tons first would yield
          round(20.020 x 0.50) = 10.01. Asserted statement total is 10.02.
        test_recipe:
          setup:
            - "Site; spec; stockpile on_hand 100.0; agreement base 0.50/ton, tier threshold 1000000 (never crossed), tier 0.75; zone; order qty 25 CONFIRMED; certified scale; default clock"
            - "Two COMPLETED tickets of net 10.010 t each (gross 48020, tare 28000)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id, pile_v: $.data.version } }
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 100.0, reason: "opening survey", expected_stockpile_version: "${pile_v}" }, as: SiteManager }
            - { call: "POST /royalty-agreements", payload: { site_id: "${site}", landowner_name: "LW", base_rate_per_ton: 0.50, tier_threshold_tons: 1000000, tier_rate_per_ton: 0.75, effective_from: "2026-01-01" }, as: FinanceClerk }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "TRUCK-01", scale_type: "TRUCK" }, as: QuarryAdmin, captures: { scale: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${scale}", calibrated_on: "2026-02-02", as_found_error_pct: 0.10, as_left_error_pct: 0.10 }, as: QuarryAdmin }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 25 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id } }
            - { call: "POST /sales-orders/${ord}/confirm", payload: {}, as: SalesAgent, as_user_id: "sa-1" }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-1", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe1: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets", payload: { queue_entry_id: "${qe1}", sales_order_id: "${ord}", scale_id: "${scale}", gross_lbs: 48020 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { tkt1: $.data.id } }
            - { call: "POST /queue-entries/${qe1}/begin-scale-out", payload: {}, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets/${tkt1}/weigh-out", payload: { tare_lbs: 28000 }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-2", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe2: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets", payload: { queue_entry_id: "${qe2}", sales_order_id: "${ord}", scale_id: "${scale}", gross_lbs: 48020 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { tkt2: $.data.id } }
            - { call: "POST /queue-entries/${qe2}/begin-scale-out", payload: {}, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets/${tkt2}/weigh-out", payload: { tare_lbs: 28000 }, as: ScaleHouseOperator, as_user_id: "sh-1" }
          trigger:
            - { call: "POST /royalty-statements", payload: { site_id: "${site}", period_start: "2026-08-01", period_end: "2026-09-01" }, as: FinanceClerk, as_user_id: "fc-1", captures: { stmt: $.data.id } }
          assert:
            - "ScaleTicket.${tkt1}.net_tons == 10.010 and ScaleTicket.${tkt2}.net_tons == 10.010"
            - "RoyaltyStatement.${stmt}.royalty_due_usd == 10.02 (round_half_up(10.010 x 0.50, 2) = 5.01 per ticket, summed)"
            - "sum-first-then-round would yield 10.01; the pinned order forbids it"

      - name: bond_posture_circular_evaluation_order
        grounds:
          - calculations.disturbed_acreage_and_bond
          - calculations.posture_derivation
          - state_machines.Bench.RECLAMATION_IN_PROGRESS_to_RECLAIMED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          the complete-reclamation guard reads the PRE-transition posture
          (RESTRICTED, allowed) and only afterwards do acres -> bond_required ->
          adequacy -> posture recompute; the same request ends with posture
          OPERATING because reclaiming 3.0 ac drops bond_required to 48000.00
          (<= 50000 posted).
        test_recipe:
          setup:
            - "Site permitted 200 ac, rate 12000; bond 50000 posted; B1 (1400 ft, 4.0 ac) MINED_OUT; B2 (1380 ft, 3.0 ac) in RECLAMATION_IN_PROGRESS; posture RESTRICTED (bond_required 66000 > 50000)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B1", elevation_ft: 1400, acreage: 4.0 }, as: SiteManager, captures: { b1: $.data.id } }
            - { call: "POST /benches/${b1}/release", payload: {}, as: SiteManager }
            - { call: "POST /reclamation-bonds", payload: { site_id: "${site}", surety_name: "SuretyCo", amount_usd: 50000 }, as: FinanceClerk, captures: { bond: $.data.id } }
            - { call: "POST /benches/${b1}/mark-mined-out", payload: {}, as: SiteManager }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B2", elevation_ft: 1380, acreage: 3.0 }, as: SiteManager, captures: { b2: $.data.id } }
            - { call: "POST /benches/${b2}/release", payload: {}, as: SiteManager }
            - { call: "POST /benches/${b2}/mark-mined-out", payload: {}, as: SiteManager }
            - { call: "POST /benches/${b2}/start-reclamation", payload: {}, as: SiteManager }
          trigger:
            - { call: "POST /benches/${b2}/complete-reclamation", payload: {}, as: SiteManager }
            - { call: "GET /sites/${site}", payload: {}, as: SiteManager, as_user_id: "sm-1" }
          assert:
            - "Bench.${b2}.status == RECLAIMED (guard accepted PRE-transition RESTRICTED posture)"
            - "QuarrySite.${site}.disturbed_acres == 4.0"
            - "QuarrySite.${site}.bond_required_usd == 48000.00"
            - "QuarrySite.${site}.bond_adequacy == ADEQUATE"
            - "QuarrySite.${site}.posture == OPERATING (recompute happened after the transition, in the pinned order)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: shotplan_drill_redrill_cycle
        grounds:
          - state_machines.ShotPlan.DRILLED_to_DRILLING
          - state_machines.ShotPlan.DRILLING_to_DRILLED
        distinguishing_aspect: |
          Cyclic shape on ShotPlan: DRILLING -> DRILLED -> DRILLING -> DRILLED
          is legal; the redrill loop resets drilled_hole_count to 0, so the
          second complete-drilling must re-report all 20 holes.
        test_recipe:
          setup:
            - "Site OPERATING (bond 100000 posted, bench 1400 ft 5.0 ac RELEASED); ShotPlan APPROVED then DRILLING"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /reclamation-bonds", payload: { site_id: "${site}", surety_name: "SuretyCo", amount_usd: 100000 }, as: FinanceClerk }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "BENCH-1400", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { bench: $.data.id } }
            - { call: "POST /benches/${bench}/release", payload: {}, as: SiteManager }
            - { call: "POST /shot-plans", payload: { bench_id: "${bench}", hole_count: 20, burden_ft: 8, spacing_ft: 10, hole_depth_ft: 40, explosive_per_hole_lbs: 50 }, as: BlastForeman, as_user_id: "bf-1", captures: { plan: $.data.id } }
            - { call: "POST /shot-plans/${plan}/submit", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/approve", payload: {}, as: SiteManager, as_user_id: "sm-1" }
            - { call: "POST /shot-plans/${plan}/start-drilling", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
          trigger:
            - { call: "POST /shot-plans/${plan}/complete-drilling", payload: { drilled_hole_count: 20 }, as: BlastForeman, as_user_id: "bf-1" }
