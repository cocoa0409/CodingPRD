scaffold_corner_design:
- section: entities
  instances:
  - name: program_creation_persists_the_commercial_envelope_and_initialises_counters
    claim_type: creation
    grounds:
    - entities.CustomerProgram
    - endpoints[POST /customer-programs]
    distinguishing_aspect: 'Every input field is echoed and all eleven computed counters are initialised in one
      write: open_commitment_pieces seeds from committed_pieces while allocated/shipped/quarantined start at zero
      and delivery_posture starts BLOCKED.'
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /customer-programs
        payload:
          program_code: PGM-1
          customer_name: Bramble Industrial Supply
          application_class: INDUSTRIAL
          ppap_level: 1
          committed_pieces: 500000
          minimum_order_quantity: 1000
          required_salt_spray_hours: 96
          biocompatibility_required: false
          min_fatigue_margin: 1.2
          required_ppk: 1.0
          amortization_method: FORECAST_BASIS
        as: ProgramManager
        captures:
          prog_id: $.data.id
          prog_v: $.data.version
      assert:
      - HTTP 201
      - CustomerProgram.program_code == 'PGM-1'
      - CustomerProgram.application_class == 'INDUSTRIAL'
      - CustomerProgram.committed_pieces == 500000
      - CustomerProgram.open_commitment_pieces == 500000
      - CustomerProgram.allocated_pieces == 0
      - CustomerProgram.shipped_pieces == 0
      - CustomerProgram.quarantined_lot_count == 0
      - CustomerProgram.delivery_posture == 'BLOCKED'
      - CustomerProgram.quote_frozen == false
      - CustomerProgram.quoted_qty is null
      - CustomerProgram.quoted_unit_price_cents is null
      - CustomerProgram.version == 1
      - CustomerProgram.id is a non-null string; created_at and updated_at are present
  - name: program_optional_inputs_fall_back_to_their_declared_defaults
    claim_type: defaults
    grounds:
    - entities.CustomerProgram.required_salt_spray_hours
    - entities.CustomerProgram.biocompatibility_required
    - entities.CustomerProgram.min_fatigue_margin
    - entities.CustomerProgram.required_ppk
    distinguishing_aspect: All four optional inputs are omitted together; each takes its §1.1 default (0, false,
      1.000, 1.000) rather than null.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /customer-programs
        payload:
          program_code: PGM-DEF
          customer_name: Bramble Industrial Supply
          application_class: INDUSTRIAL
          ppap_level: 1
          committed_pieces: 500000
          minimum_order_quantity: 1000
          amortization_method: FORECAST_BASIS
        as: ProgramManager
        captures:
          prog_id: $.data.id
          prog_v: $.data.version
      assert:
      - HTTP 201
      - CustomerProgram.required_salt_spray_hours == 0
      - CustomerProgram.biocompatibility_required == false
      - CustomerProgram.min_fatigue_margin == 1.000
      - CustomerProgram.required_ppk == 1.000
      - CustomerProgram.amortization_method == 'FORECAST_BASIS'
  - name: program_creation_missing_required_amortization_method_is_rejected
    claim_type: required_fields
    grounds:
    - validations[priority 4]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: amortization_method has source input and no default, so its absence is a body error
      rather than a silently defaulted FORECAST_BASIS.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /customer-programs
        payload:
          program_code: PGM-NOAMORT
          customer_name: Bramble Industrial Supply
          application_class: INDUSTRIAL
          ppap_level: 1
          committed_pieces: 500000
          minimum_order_quantity: 1000
        as: ProgramManager
      assert:
      - HTTP 400
      - data.error_id == 'ERR_INVALID_REQUEST'
      - no CustomerProgram row is created
  - name: program_creation_with_invalid_enum_application_class_rejected
    claim_type: type_constraints
    grounds:
    - entities.CustomerProgram.application_class
    - validations[priority 4]
    distinguishing_aspect: application_class is constrained to five members; AEROSPACE is not one of them and
      must be refused at the body-validation rung, before any uniqueness or FK work.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /customer-programs
        payload:
          program_code: PGM-BADENUM
          customer_name: Bramble Industrial Supply
          application_class: AEROSPACE
          ppap_level: 1
          committed_pieces: 500000
          minimum_order_quantity: 1000
          required_salt_spray_hours: 96
          biocompatibility_required: false
          min_fatigue_margin: 1.2
          required_ppk: 1.0
          amortization_method: FORECAST_BASIS
        as: ProgramManager
        captures:
          prog_id: $.data.id
          prog_v: $.data.version
      assert:
      - HTTP 400
      - data.error_id == 'ERR_INVALID_REQUEST'
  - name: program_retrieval_returns_the_stored_row_unchanged
    claim_type: retrieval
    grounds:
    - endpoints[GET /customer-programs/{id}]
    distinguishing_aspect: A read-only GET returns the identical field values the creation response carried and
      does not advance version.
    test_recipe:
      setup:
      - One CustomerProgram exists (PGM-1, INDUSTRIAL, 500000 committed).
      setup_api_calls:
      - call: POST /customer-programs
        payload:
          program_code: PGM-1
          customer_name: Bramble Industrial Supply
          application_class: INDUSTRIAL
          ppap_level: 1
          committed_pieces: 500000
          minimum_order_quantity: 1000
          required_salt_spray_hours: 96
          biocompatibility_required: false
          min_fatigue_margin: 1.2
          required_ppk: 1.0
          amortization_method: FORECAST_BASIS
        as: ProgramManager
        captures:
          prog_id: $.data.id
          prog_v: $.data.version
      trigger:
      - call: GET /customer-programs/${prog_id}
        payload: {}
        as: ProgramManager
      assert:
      - HTTP 200
      - CustomerProgram.id == ${prog_id}
      - CustomerProgram.program_code == 'PGM-1'
      - CustomerProgram.open_commitment_pieces == 500000
      - CustomerProgram.version == 1
