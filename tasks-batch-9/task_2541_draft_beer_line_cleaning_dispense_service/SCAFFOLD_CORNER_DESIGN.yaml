      - name: corner_second_balance_proposal_carrying_the_pre_proposal_line_version_is_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.balance-record-create-stale-line
          - validations[11].ERR_STALE_LINE_VERSION
          - endpoints.POST_balance_records
        distinguishing_aspect: |
          Every accepted proposal increments BeerLine.version, so the second
          proposal re-using the version the technician read before the first one
          is ERR_STALE_LINE_VERSION (412) and persists nothing; re-reading the
          line yields 2 and the same payload is then accepted, taking the line to
          3 with exactly two PROPOSED records on file.
        test_recipe:
          setup:
            - "ServiceAccount 'Anchor Alehouse' ACTIVE with an ACTIVE contract; BeerLine #1 32ft/4ft/0.375in ALE at version 1."
            - "Technician 'Dana Ruiz'; visit IN_PROGRESS at 2026-08-05T09:00:00Z."
