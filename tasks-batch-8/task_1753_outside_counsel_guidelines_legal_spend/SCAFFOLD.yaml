scenario: |
  Outside Counsel Guidelines & Legal Spend Management (corporate legal operations): guideline publication & firm acknowledgment, e-billing invoice submission with UTBMS coding, automated rule enforcement (block billing/staffing/rate) & line-item rejection, rate approval cycle & annual increase caps, timekeeper qualification & staffing ratio compliance, appeal of rejected charges, accrual collection & matter forecast, panel firm performance scorecard

domain_name: outside-counsel-spend
api_prefix: /legal-departments

complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: ledger reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hierarchical
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: LegalDepartment
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal department display name" }
      - { name: annual_rate_increase_cap_pct, type: number, source: input, description: "Hard cap (percent, e.g. 5.00) applied to per-timekeeper rate increases between consecutive effective years" }
      - { name: partner_ratio_min_pct, type: number, source: input, description: "Minimum partner-hour share (percent of total billable hours) required on each OPEN matter under the staffing-ratio rule" }
      - { name: partner_ratio_max_pct, type: number, source: input, description: "Maximum partner-hour share (percent of total billable hours) permitted on each OPEN matter under the staffing-ratio rule" }
      - { name: guideline_notice_days, type: integer, source: input, description: "Mandatory notice gap (in days) between the effective_date of a newly published GuidelineVersion and the effective_date of the version it supersedes" }
      - { name: acknowledgment_window_days, type: integer, source: input, description: "Days after publication a panel firm has to acknowledge a GuidelineVersion before its acknowledgment flips PENDING→OVERDUE" }

  - name: PanelFirm
    parent: LegalDepartment
    common_fields: true
    fields:
      - { name: legal_department_id, type: string, source: system, description: "FK -> LegalDepartment.id; owning legal department" }
      - { name: firm_name, type: string, source: input, description: "Panel firm display name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | OFFBOARDED", constraints: "ACTIVE on creation; SUSPENDED blocks new invoices and new rate cards; OFFBOARDED is terminal" }
      - { name: scorecard_overall_pct, type: number, source: computed, description: "Latest computed scorecard overall score (0-100), refreshed by POST /panel-firms/{id}/scorecards/recompute" }

  - name: GuidelineVersion
    parent: LegalDepartment
    common_fields: true
    fields:
      - { name: legal_department_id, type: string, source: system, description: "FK -> LegalDepartment.id; owning legal department" }
      - { name: version_label, type: string, source: input, description: "Human label, e.g. 'OCG-2026-A'" }
      - { name: effective_date, type: datetime, source: input, description: "ISO-8601 date at which this guideline becomes effective" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED", constraints: "DRAFT on create; PUBLISHED via publish; SUPERSEDED auto when a newer version publishes" }

  - name: GuidelineAcknowledgment
    parent: PanelFirm
    common_fields: true
    fields:
      - { name: panel_firm_id, type: string, source: system, description: "FK -> PanelFirm.id; acknowledging firm" }
      - { name: guideline_version_id, type: string, source: system, description: "FK -> GuidelineVersion.id; the guideline version being acknowledged" }
      - { name: status, type: enum, source: system, description: "PENDING | ACKNOWLEDGED | OVERDUE", constraints: "PENDING on cascade-create at guideline publication; OVERDUE set by clock sweep; ACKNOWLEDGED terminal" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Timestamp of acknowledgment; null until ACKNOWLEDGED" }

  - name: Matter
    parent: LegalDepartment
    common_fields: true
    fields:
      - { name: legal_department_id, type: string, source: system, description: "FK -> LegalDepartment.id; owning legal department" }
      - { name: panel_firm_id, type: string, source: input, description: "FK -> PanelFirm.id; engaged panel firm" }
      - { name: title, type: string, source: input, description: "Matter title" }
      - { name: engagement_status, type: enum, source: system, description: "PENDING | ENGAGED | CLOSED", constraints: "PENDING on create; ENGAGED once firm accepts; CLOSED terminal-ish (reopen allowed to ENGAGED)" }
      - { name: budget_cents, type: integer, source: input, description: "Matter budget cap in cents" }
      - { name: billed_to_date_cents, type: integer, source: computed, description: "Sum of approved line-item amounts (post-appeal) across all non-voided invoices on this matter" }
      - { name: accrual_outstanding_cents, type: integer, source: computed, description: "Sum of accrual amounts for periods that have not yet been matched by a submitted invoice" }

  - name: RateCard
    parent: PanelFirm
    common_fields: true
    fields:
      - { name: panel_firm_id, type: string, source: system, description: "FK -> PanelFirm.id; owning firm" }
      - { name: effective_year, type: integer, source: input, description: "Calendar year this rate card covers (e.g. 2026)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED", constraints: "REJECTED→DRAFT allowed (revision loop); APPROVED→SUPERSEDED when a later-year card is approved" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of SUBMITTED transition" }

  - name: Timekeeper
    parent: PanelFirm
    common_fields: true
    fields:
      - { name: panel_firm_id, type: string, source: system, description: "FK -> PanelFirm.id; employing firm" }
      - { name: full_name, type: string, source: input, description: "Timekeeper full name" }
      - { name: tk_class, type: enum, source: input, description: "PARTNER | ASSOCIATE | PARALEGAL", constraints: "Drives the rate-increase sub-cap" }
      - { name: qualification_status, type: enum, source: system, description: "PENDING | QUALIFIED | DISQUALIFIED", constraints: "PENDING on create; QUALIFIED after legal ops approves; DISQUALIFIED terminal" }

  - name: TimekeeperRate
    parent: RateCard
    common_fields: true
    fields:
      - { name: rate_card_id, type: string, source: system, description: "FK -> RateCard.id; parent rate card" }
      - { name: timekeeper_id, type: string, source: input, description: "FK -> Timekeeper.id; the timekeeper this rate applies to" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Proposed hourly rate in cents for this rate card's effective_year" }
      - { name: approved_rate_cents, type: integer, source: computed, description: "Server-set on card approval; equals hourly_rate_cents if within cap, else the cap-clamped value" }

  - name: Invoice
    parent: Matter
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "FK -> Matter.id; billed matter" }
      - { name: panel_firm_id, type: string, source: system, description: "FK -> PanelFirm.id; resolved from Matter.panel_firm_id at creation" }
      - { name: invoice_number, type: string, source: input, description: "Firm-supplied invoice number; unique per panel firm" }
      - { name: billing_period_start, type: datetime, source: input, description: "ISO-8601 start of billing period" }
      - { name: billing_period_end, type: datetime, source: input, description: "ISO-8601 end of billing period (exclusive)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | PARTIALLY_APPROVED | REJECTED | PAID | VOID", constraints: "SUBMITTED on create; auto-transitions to UNDER_REVIEW immediately; APPROVED/PARTIALLY_APPROVED/REJECTED derived from line-item review" }
      - { name: submitted_total_cents, type: integer, source: computed, description: "Sum of all line-item amounts as submitted" }
      - { name: approved_total_cents, type: integer, source: computed, description: "Provisional approved total: sum of line-item amounts with review_status in {APPROVED, ADJUSTED_APPROVED} (uses adjusted_amount_cents when present); recomputed on every line-item review action and on appeal resolution" }
      - { name: final_payable_cents, type: integer, source: computed, description: "Final payable: identical formula to approved_total_cents but frozen when invoice reaches PAID; until then tracks approved_total_cents" }

  - name: InvoiceLineItem
    parent: Invoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; parent invoice" }
      - { name: timekeeper_id, type: string, source: input, description: "FK -> Timekeeper.id; billing timekeeper" }
      - { name: utbms_task_code, type: string, source: input, description: "Single UTBMS task code, e.g. 'L120'", constraints: "Exactly one task code per line item; multiple codes in one line is the block-billing violation pattern" }
      - { name: narrative, type: string, source: input, description: "Free-text narrative; scanned by the block-billing detector for multi-task conjunction markers" }
      - { name: hours, type: number, source: input, description: "Hours billed, 2-decimal precision" }
      - { name: rate_cents, type: integer, source: input, description: "Rate asserted by firm in cents/hour; validated against the timekeeper's approved_rate_cents for the matching effective_year" }
      - { name: amount_cents, type: integer, source: computed, description: "= round_half_up(hours * rate_cents) — per-line rounding pinned before any aggregation" }
      - { name: review_status, type: enum, source: system, description: "PENDING | APPROVED | ADJUSTED_APPROVED | REJECTED | REINSTATED | UPHELD", constraints: "PENDING on submit; APPROVED/ADJUSTED_APPROVED/REJECTED set by rule engine or reviewer; REINSTATED/UPHELD set by appeal resolution" }
      - { name: adjusted_amount_cents, type: integer, source: input, description: "Reviewer-supplied adjusted amount when review_status = ADJUSTED_APPROVED; otherwise null" }
      - { name: rejection_reason_code, type: enum, source: system, description: "BLOCK_BILLING | RATE_EXCEEDS_APPROVED | UNAPPROVED_TIMEKEEPER | STAFFING_RATIO | OVER_BUDGET | null", constraints: "Set when review_status transitions to REJECTED; cleared on REINSTATED" }

  - name: Appeal
    parent: InvoiceLineItem
    common_fields: true
    fields:
      - { name: invoice_line_item_id, type: string, source: system, description: "FK -> InvoiceLineItem.id; the rejected line item being appealed" }
      - { name: rationale, type: string, source: input, description: "Firm's appeal rationale" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | GRANTED | DENIED", constraints: "SUBMITTED on create; UNDER_REVIEW on reviewer claim; GRANTED/DENIED terminal" }
      - { name: resolution_note, type: string, source: input, description: "Reviewer note recorded on GRANTED/DENIED" }

  - name: Accrual
    parent: Matter
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "FK -> Matter.id; matter this accrual forecasts spend for" }
      - { name: period_year, type: integer, source: input, description: "Accrual period year" }
      - { name: period_month, type: integer, source: input, description: "Accrual period month (1-12)" }
      - { name: amount_cents, type: integer, source: input, description: "Unbilled estimate for this period in cents" }
      - { name: matched_invoice_id, type: string, source: system, description: "FK -> Invoice.id; the invoice that consumed this accrual (set when an invoice covering this period is submitted); null while unmatched" }

  - name: MatterForecast
    parent: Matter
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "FK -> Matter.id; parent matter (1:1)" }
      - { name: lifecycle_estimate_cents, type: integer, source: input, description: "Legal ops's lifecycle estimate of total spend on the matter" }
      - { name: wip_estimate_cents, type: integer, source: computed, description: "Work-in-progress estimate: sum of unmatched accruals plus unbilled forecast allowance; pinned evaluation order (see calculations.matter_forecast_reconciliation)" }
      - { name: variance_cents, type: integer, source: computed, description: "= lifecycle_estimate_cents - (billed_to_date_cents + wip_estimate_cents); negative means projected overrun" }

  - name: ScorecardSnapshot
    parent: PanelFirm
    common_fields: true
    fields:
      - { name: panel_firm_id, type: string, source: system, description: "FK -> PanelFirm.id; scored firm" }
      - { name: period_year, type: integer, source: input, description: "Scorecard period year" }
      - { name: period_month, type: integer, source: input, description: "Scorecard period month (1-12)" }
      - { name: on_time_ack_pct, type: number, source: computed, description: "Percent of guideline acknowledgments ACKNOWLEDGED on or before due date in the trailing 12 months" }
      - { name: rejection_rate_pct, type: number, source: computed, description: "Percent of reviewed line items whose final review_status is REJECTED or UPHELD (trailing 12 months)" }
      - { name: appeal_uphold_rate_pct, type: number, source: computed, description: "Percent of resolved appeals with status DENIED (trailing 12 months); higher is worse" }
      - { name: accrual_timeliness_pct, type: number, source: computed, description: "Percent of accruals submitted on or before the 5th of the following month (trailing 12 months)" }
      - { name: overall_pct, type: number, source: computed, description: "Weighted score per calculations.firm_scorecard_score" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PanelFirm
    initial_state: ACTIVE
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /legal-departments/{deptId}/panel-firms/{firmId}/suspend"
        actor: LegalOpsReviewer
        preconditions: []
        side_effects:
          - "every Appeal filed on any InvoiceLineItem belonging to an Invoice whose panel_firm_id = this firm, where the appeal's status is SUBMITTED or UNDER_REVIEW, auto-transitions to DENIED with resolution_note = 'AUTO_DENIED_FIRM_SUSPENDED' (cascade hop 1)"
          - "each such auto-DENIED appeal triggers the standard DENIED side effects: its InvoiceLineItem transitions REJECTED → UPHELD and the parent Invoice.approved_total_cents is recomputed (cascade hop 2)"
          - "increments PanelFirm.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /legal-departments/{deptId}/panel-firms/{firmId}/reinstate"
        actor: LegalOpsReviewer
        preconditions: []
        side_effects:
          - "increments PanelFirm.version by 1"
      - from: SUSPENDED
        to: OFFBOARDED
        trigger: "POST /legal-departments/{deptId}/panel-firms/{firmId}/offboard"
        actor: LegalOpsReviewer
        preconditions:
          - "no Invoice under any Matter engaged to this firm is in SUBMITTED or UNDER_REVIEW (ERR_FIRM_HAS_OPEN_INVOICES)"
        side_effects:
          - "all Matter where panel_firm_id = this firm and engagement_status = ENGAGED transition engagement_status to CLOSED"
          - "all Timekeeper of this firm with qualification_status = PENDING transition to DISQUALIFIED"
          - "all RateCard of this firm in DRAFT or SUBMITTED transition to REJECTED"
          - "increments PanelFirm.version by 1"

  - entity: GuidelineVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /legal-departments/{deptId}/guideline-versions/{gvId}/publish"
        actor: LegalOpsReviewer
        preconditions:
          - "no other GuidelineVersion of this LegalDepartment has status = PUBLISHED with effective_date >= this.effective_date (ERR_GUIDELINE_OVERLAP)"
          - "if another GuidelineVersion of this LegalDepartment has status = PUBLISHED: (this.effective_date - prior.effective_date) MUST be >= LegalDepartment.guideline_notice_days days (ERR_NOTICE_GAP_VIOLATION)"
        side_effects:
          - "the prior PUBLISHED GuidelineVersion (if any) transitions to SUPERSEDED"
          - "for every PanelFirm of this LegalDepartment with status = ACTIVE: cascade-create one GuidelineAcknowledgment with status = PENDING"
          - "increments GuidelineVersion.version by 1"

  - entity: GuidelineAcknowledgment
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /legal-departments/{deptId}/panel-firms/{firmId}/acknowledgments/{ackId}/acknowledge"
        actor: PanelFirmUser
        preconditions:
          - "acting PanelFirmUser's panel_firm_id MUST equal this acknowledgment's panel_firm_id (ERR_FIRM_MISMATCH)"
        side_effects:
          - "sets acknowledged_at to the logical clock"
          - "increments GuidelineAcknowledgment.version by 1"
      - from: PENDING
        to: OVERDUE
        trigger: "system clock sweep (POST /_clock/set_current_utc advances clock past due date)"
        actor: system
        preconditions:
          - "logical clock > parent GuidelineVersion publication timestamp + LegalDepartment.acknowledgment_window_days"
        side_effects:
          - "increments GuidelineAcknowledgment.version by 1"
      - from: OVERDUE
        to: ACKNOWLEDGED
        trigger: "POST /legal-departments/{deptId}/panel-firms/{firmId}/acknowledgments/{ackId}/acknowledge"
        actor: PanelFirmUser
        preconditions:
          - "acting PanelFirmUser's panel_firm_id MUST equal this acknowledgment's panel_firm_id (ERR_FIRM_MISMATCH)"
        side_effects:
          - "sets acknowledged_at to the logical clock"
          - "increments GuidelineAcknowledgment.version by 1"

  - entity: Matter
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ENGAGED
        trigger: "POST /legal-departments/{deptId}/matters/{matterId}/engage"
        actor: PanelFirmUser
        preconditions:
          - "acting PanelFirmUser's panel_firm_id MUST equal Matter.panel_firm_id (ERR_FIRM_MISMATCH)"
          - "PanelFirm.status MUST be ACTIVE (ERR_FIRM_NOT_ACTIVE)"
          - "the PanelFirm MUST have an ACKNOWLEDGED GuidelineAcknowledgment for the currently-PUBLISHED GuidelineVersion of this LegalDepartment, if any PUBLISHED version exists (ERR_ACK_OUTSTANDING)"
        side_effects:
          - "increments Matter.version by 1"
      - from: ENGAGED
        to: CLOSED
        trigger: "POST /legal-departments/{deptId}/matters/{matterId}/close"
        actor: LegalOpsReviewer
        preconditions:
          - "no Invoice on this Matter in SUBMITTED or UNDER_REVIEW (ERR_MATTER_HAS_OPEN_INVOICES)"
          - "no Appeal on any InvoiceLineItem of this Matter in SUBMITTED or UNDER_REVIEW (ERR_MATTER_HAS_OPEN_APPEALS)"
        side_effects:
          - "increments Matter.version by 1"
      - from: CLOSED
        to: ENGAGED
        trigger: "POST /legal-departments/{deptId}/matters/{matterId}/reopen"
        actor: LegalOpsReviewer
        preconditions:
          - "PanelFirm.status MUST be ACTIVE (ERR_FIRM_NOT_ACTIVE)"
        side_effects:
          - "increments Matter.version by 1"

  - entity: RateCard
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /legal-departments/{deptId}/panel-firms/{firmId}/rate-cards/{cardId}/submit"
        actor: PanelFirmUser
        preconditions:
          - "acting PanelFirmUser's panel_firm_id MUST equal RateCard.panel_firm_id (ERR_FIRM_MISMATCH)"
          - "PanelFirm.status MUST be ACTIVE (ERR_FIRM_NOT_ACTIVE)"
          - "every Timekeeper referenced by a TimekeeperRate on this card has qualification_status = QUALIFIED (ERR_TIMEKEEPER_NOT_QUALIFIED)"
          - "no other RateCard of this firm with the same effective_year in status SUBMITTED or APPROVED (ERR_RATE_CARD_YEAR_CONFLICT)"
        side_effects:
          - "sets submitted_at to the logical clock"
          - "increments RateCard.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /legal-departments/{deptId}/panel-firms/{firmId}/rate-cards/{cardId}/approve"
        actor: LegalOpsReviewer
        preconditions:
          - "annual rate increase for every TimekeeperRate on the card MUST be <= the sub-cap for that timekeeper's tk_class (see calculations.annual_rate_increase_pct); violators are clamped into approved_rate_cents rather than blocking approval"
        side_effects:
          - "for each TimekeeperRate on this card: set approved_rate_cents = min(hourly_rate_cents, cap-clamped ceiling derived from prior-year approved_rate_cents)"
          - "any other RateCard of this firm with status = APPROVED transitions to SUPERSEDED"
          - "increments RateCard.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /legal-departments/{deptId}/panel-firms/{firmId}/rate-cards/{cardId}/reject"
        actor: LegalOpsReviewer
        preconditions: []
        side_effects:
          - "increments RateCard.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /legal-departments/{deptId}/panel-firms/{firmId}/rate-cards/{cardId}/revise"
        actor: PanelFirmUser
        preconditions:
          - "acting PanelFirmUser's panel_firm_id MUST equal RateCard.panel_firm_id (ERR_FIRM_MISMATCH)"
        side_effects:
          - "increments RateCard.version by 1"

  - entity: Timekeeper
    initial_state: PENDING
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /legal-departments/{deptId}/panel-firms/{firmId}/timekeepers/{tkId}/qualify"
        actor: LegalOpsReviewer
        preconditions:
          - "PanelFirm.status MUST be ACTIVE (ERR_FIRM_NOT_ACTIVE)"
        side_effects:
          - "increments Timekeeper.version by 1"
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "POST /legal-departments/{deptId}/panel-firms/{firmId}/timekeepers/{tkId}/disqualify"
        actor: LegalOpsReviewer
        preconditions:
          - "no InvoiceLineItem referencing this timekeeper is in review_status = PENDING (ERR_TIMEKEEPER_HAS_PENDING_LINES)"
        side_effects:
          - "increments Timekeeper.version by 1"

  - entity: Invoice
    initial_state: SUBMITTED
    terminal_states: [PAID, VOID]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system auto-transition immediately after POST /legal-departments/{deptId}/matters/{matterId}/invoices"
        actor: system
        preconditions: []
        side_effects:
          - "rule engine runs on each InvoiceLineItem in order: (a) if block-billing detector fires, set REJECTED/BLOCK_BILLING; (b) else if rate_cents > timekeeper's approved_rate_cents for the billing-period year, set REJECTED/RATE_EXCEEDS_APPROVED; (c) else if timekeeper is not QUALIFIED, set REJECTED/UNAPPROVED_TIMEKEEPER; (d) else if rate_cents does not match any approved_rate_cents on the firm's card for that year but is below it, leave PENDING for manual review (rate-not-on-card); (e) else set APPROVED"
          - "approved_total_cents is computed per calculations.invoice_payable_amount (provisional variant)"
          - "invoice aggregate status derivation (re-evaluated after every line-item review action and appeal resolution): if any line is PENDING → invoice stays UNDER_REVIEW; else if all lines in {APPROVED, ADJUSTED_APPROVED, REINSTATED} → APPROVED; else if all lines in {REJECTED, UPHELD} → REJECTED; else → PARTIALLY_APPROVED"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "system auto-transition when every InvoiceLineItem has review_status in {APPROVED, ADJUSTED_APPROVED}"
        actor: system
        preconditions: []
        side_effects:
          - "Matter.billed_to_date_cents increases by Invoice.approved_total_cents"
          - "any unmatched Accrual whose (period_year, period_month) falls within [billing_period_start, billing_period_end) has matched_invoice_id set to this invoice, and Matter.accrual_outstanding_cents decreases by that accrual's amount_cents"
      - from: UNDER_REVIEW
        to: PARTIALLY_APPROVED
        trigger: "system auto-transition when at least one InvoiceLineItem has review_status in {APPROVED, ADJUSTED_APPROVED, REINSTATED} AND at least one has review_status in {REJECTED, UPHELD}"
        actor: system
        preconditions: []
        side_effects:
          - "Matter.billed_to_date_cents increases by Invoice.approved_total_cents"
          - "unmatched Accrual matching is identical to the APPROVED branch"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system auto-transition when every InvoiceLineItem has review_status = REJECTED"
        actor: system
        preconditions: []
        side_effects:
          - "Matter.billed_to_date_cents is unchanged"
      - from: APPROVED
        to: PAID
        trigger: "POST /legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/pay"
        actor: LegalOpsReviewer
        preconditions: []
        side_effects:
          - "final_payable_cents is frozen to approved_total_cents"
          - "increments Invoice.version by 1"
      - from: PARTIALLY_APPROVED
        to: PAID
        trigger: "POST /legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/pay"
        actor: LegalOpsReviewer
        preconditions:
          - "no Appeal on any of this invoice's line items is in SUBMITTED or UNDER_REVIEW (ERR_OPEN_APPEALS)"
        side_effects:
          - "final_payable_cents is frozen to approved_total_cents (post-appeal)"
          - "increments Invoice.version by 1"
      - from: REJECTED
        to: VOID
        trigger: "POST /legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/void"
        actor: PanelFirmUser
        preconditions:
          - "acting PanelFirmUser's panel_firm_id MUST equal Invoice.panel_firm_id (ERR_FIRM_MISMATCH)"
        side_effects:
          - "increments Invoice.version by 1"

  - entity: InvoiceLineItem
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "system rule engine on invoice auto-review, OR POST /legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/approve"
        actor: "system | LegalOpsReviewer"
        preconditions: []
        side_effects:
          - "Invoice.approved_total_cents recomputed"
      - from: PENDING
        to: ADJUSTED_APPROVED
        trigger: "POST /legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/adjust"
        actor: LegalOpsReviewer
        preconditions:
          - "adjusted_amount_cents in request body MUST be >= 0 and < amount_cents (ERR_INVALID_ADJUSTMENT)"
        side_effects:
          - "Invoice.approved_total_cents recomputed using adjusted_amount_cents for this line"
      - from: PENDING
        to: REJECTED
        trigger: "system rule engine on invoice auto-review, OR POST /legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/reject"
        actor: "system | LegalOpsReviewer"
        preconditions: []
        side_effects:
          - "sets rejection_reason_code"
          - "Invoice.approved_total_cents recomputed"
      - from: APPROVED
        to: REJECTED
        trigger: "POST /legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/reject"
        actor: LegalOpsReviewer
        preconditions:
          - "parent Invoice.status is APPROVED or PARTIALLY_APPROVED (post-approval correction path)"
        side_effects:
          - "sets rejection_reason_code"
          - "Invoice.approved_total_cents recomputed (this line now excluded)"
          - "Matter.billed_to_date_cents decreases by this line's prior contribution (compensating debit)"
      - from: ADJUSTED_APPROVED
        to: REJECTED
        trigger: "POST /legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/reject"
        actor: LegalOpsReviewer
        preconditions:
          - "parent Invoice.status is APPROVED or PARTIALLY_APPROVED"
        side_effects:
          - "sets rejection_reason_code"
          - "Invoice.approved_total_cents recomputed"
          - "Matter.billed_to_date_cents decreases by this line's adjusted_amount_cents (compensating debit)"
      - from: REJECTED
        to: REINSTATED
        trigger: "system side effect of Appeal transitioning to GRANTED"
        actor: system
        preconditions: []
        side_effects:
          - "clears rejection_reason_code"
          - "Invoice.approved_total_cents recomputed (line amount is now included)"
          - "Matter.billed_to_date_cents increases by this line's amount_cents (compensating credit on top of the amount already booked at APPROVED/PARTIALLY_APPROVED)"
      - from: REJECTED
        to: UPHELD
        trigger: "system side effect of Appeal transitioning to DENIED"
        actor: system
        preconditions: []
        side_effects:
          - "Invoice.approved_total_cents recomputed (no change in amount; status flip only)"

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/appeals/{appealId}/claim"
        actor: LegalOpsReviewer
        preconditions: []
        side_effects:
          - "increments Appeal.version by 1"
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/appeals/{appealId}/grant"
        actor: LegalOpsReviewer
        preconditions: []
        side_effects:
          - "InvoiceLineItem transitions REJECTED → REINSTATED (cascade hop 1)"
          - "Invoice.approved_total_cents recomputed (cascade hop 2)"
          - "Matter.billed_to_date_cents increases by the line's amount_cents (cascade hop 3)"
          - "increments Appeal.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/appeals/{appealId}/deny"
        actor: LegalOpsReviewer
        preconditions: []
        side_effects:
          - "InvoiceLineItem transitions REJECTED → UPHELD (cascade hop 1)"
          - "Invoice.approved_total_cents recomputed (cascade hop 2)"
          - "increments Appeal.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: invoice-create-stale-matter
    parent_entity: Matter
    write_endpoint: "POST /legal-departments/{deptId}/matters/{matterId}/invoices"
    occ_field: "expected_matter_version"
    description: |
      Creating an Invoice against a Matter whose version has advanced since
      the client last observed it is rejected. Invoice creation bumps
      Matter.version (spend-cache side effect), so a second create carrying
      the previously-observed version is deterministically stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: rate-card-create-stale-firm
    parent_entity: PanelFirm
    write_endpoint: "POST /legal-departments/{deptId}/panel-firms/{firmId}/rate-cards"
    occ_field: "expected_panel_firm_version"
    description: |
      Creating a RateCard against a PanelFirm whose version has advanced
      since the client last observed it is rejected. Rate-card creation
      legitimately supersedes the prior APPROVED card on approval and bumps
      PanelFirm.version, so a second create carrying the previously-observed
      version is deterministically stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: invoice_payable_amount
    trigger: "invoice auto-review; any line-item review action (approve/adjust/reject); any appeal resolution"
    algorithm: aggregation
    formula: |
      # Per-line rounding pinned BEFORE aggregation:
      line_amount(line) =
        if line.review_status == ADJUSTED_APPROVED: line.adjusted_amount_cents
        elif line.review_status in {APPROVED, REINSTATED}: line.amount_cents
        else: 0
      invoice.approved_total_cents = sum over line in invoice.line_items of line_amount(line)
    input_set: "all InvoiceLineItem rows of the invoice regardless of review_status; the status filter is applied inside line_amount"
    constants:
      ROUNDING: "round_half_up at the per-line amount_cents computation only; no rounding at the sum step"
    precision: "integer cents; per-line round_half_up pinned before sum"
    variants:
      - name: provisional
        when: "computed on every review action while invoice is not PAID"
        difference: "includes REINSTATED lines as soon as the appeal GRANTED cascade lands; mutable"
      - name: final
        when: "computed on transition to PAID"
        difference: "frozen value assigned to final_payable_cents; never recomputed afterwards, so two reads of the same invoice (one pre-PAID after a pending appeal, one post-PAID) can yield different numbers for identical line-item data"

  - name: annual_rate_increase_pct
    trigger: "RateCard APPROVED transition"
    algorithm: tiered_pricing
    formula: |
      # Per-timekeeper sub-cap keyed on tk_class, then clamped:
      sub_cap_pct(tk_class) =
        PARTNER   -> LegalDepartment.annual_rate_increase_cap_pct          # full cap
        ASSOCIATE -> LegalDepartment.annual_rate_increase_cap_pct * 0.80   # 80% of cap
        PARALEGAL -> LegalDepartment.annual_rate_increase_cap_pct * 0.60   # 60% of cap
      prior = prior-year APPROVED RateCard of the same firm (by effective_year DESC,
              tie-break created_at ASC — never id); if none exists, this card's
              hourly_rate_cents is the baseline (no clamping).
      for each TimekeeperRate tr on the new card:
        prior_rate = prior card's TimekeeperRate for tr.timekeeper_id; if missing, no clamp
        ceiling_cents = floor(prior_rate.approved_rate_cents * (1 + sub_cap_pct(tr.timekeeper.tk_class) / 100))
        tr.approved_rate_cents = min(tr.hourly_rate_cents, ceiling_cents)
    input_set: "TimekeeperRate rows of the new RateCard, plus the firm's most recent APPROVED RateCard (strictly earlier effective_year)"
    constants:
      ASSOCIATE_SUB_CAP_FACTOR: 0.80
      PARALEGAL_SUB_CAP_FACTOR: 0.60
      PRIOR_CARD_TIE_BREAK: "effective_year DESC, created_at ASC"
    precision: "integer cents; floor at the ceiling computation"
    variants: []

  - name: block_billing_detection
    trigger: "invoice auto-review (system)"
    algorithm: constraint_propagation
    formula: |
      # Per-line rounding pinned: each task-code segment is computed then summed.
      # A line violates block-billing when its narrative contains >= 2 distinct
      # UTBMS task-code markers of the form /L[0-9]{3}/ in the narrative text
      # (in addition to the structured utbms_task_code field). The detector is
      # regex-based and case-sensitive on the 'L' prefix.
      distinct_codes_in_narrative = set(re.findall(r"L[0-9]{3}", line.narrative))
      if len(distinct_codes_in_narrative) >= 2:
        line.review_status = REJECTED
        line.rejection_reason_code = BLOCK_BILLING
    input_set: "every InvoiceLineItem on the invoice at auto-review time"
    constants:
      MIN_DISTINCT_CODES_FOR_BLOCK: 2
      NARRATIVE_REGEX: "L[0-9]{3}"
    precision: "not numeric; deterministic regex scan"
    variants: []

  - name: staffing_ratio_compliance
    trigger: "invoice auto-review (system); also exposed via GET .../matters/{matterId}/staffing-ratio for ad-hoc checks"
    algorithm: aggregation
    formula: |
      # Two valid bases produce different results — the scaffold pins BOTH variants
      # and the invoice auto-review rule uses BILLED_HOURS only.
      partner_hours = sum(line.hours for line in matter.invoice_lines
                          where line.timekeeper.tk_class == PARTNER
                          and   line.review_status in {APPROVED, ADJUSTED_APPROVED, REINSTATED})
      total_hours   = sum(line.hours for line in matter.invoice_lines
                          where line.review_status in {APPROVED, ADJUSTED_APPROVED, REINSTATED})
      ratio_pct = if total_hours == 0 then null else partner_hours / total_hours * 100
      violation when ratio_pct is not null and
        (ratio_pct < LegalDepartment.partner_ratio_min_pct
         or ratio_pct > LegalDepartment.partner_ratio_max_pct)
      # Boundary: comparison is strict — exactly at min or exactly at max is COMPLIANT.
    input_set: "all InvoiceLineItem rows across all non-VOID invoices of the matter, filtered to approved-equivalent review statuses"
    constants:
      BOUNDARY_SEMANTIC: "inclusive at both min and max"
    precision: "ratio_pct computed at 4-decimal precision before comparison; boundary compares the rounded value"
    variants:
      - name: billed_hours_basis
        when: "used by invoice auto-review enforcement"
        difference: "numerator and denominator drawn from actual billed hours as above"
      - name: headcount_weighted_basis
        when: "used by the GET staffing-ratio advisory endpoint when ?basis=HEADCOUNT"
        difference: "partner headcount among QUALIFIED timekeepers on the firm / total QUALIFIED timekeepers; ignores actual billing — two bases produce different pct values for identical underlying data"

  - name: matter_forecast_reconciliation
    trigger: "GET .../matters/{matterId}/forecast; any Accrual create; any invoice approval transition"
    algorithm: projection
    formula: |
      # Circular-looking dependency pinned to a strict evaluation order:
      #   (1) billed_to_date_cents is read FIRST from Matter (already maintained
      #       by invoice side effects).
      #   (2) wip_estimate_cents = sum of Accrual.amount_cents for accruals of
      #       this matter where matched_invoice_id IS NULL.
      #   (3) variance_cents = lifecycle_estimate_cents - (billed_to_date_cents + wip_estimate_cents).
      # Under no circumstances does wip_estimate_cents depend on variance_cents
      # or vice versa — the order above makes the value well-defined.
    input_set: "Matter.billed_to_date_cents; all Accrual rows of the matter with matched_invoice_id IS NULL; MatterForecast.lifecycle_estimate_cents"
    constants:
      EVALUATION_ORDER: "billed_to_date -> wip -> variance"
    precision: "integer cents"
    variants: []

  - name: firm_scorecard_score
    trigger: "POST /legal-departments/{deptId}/panel-firms/{firmId}/scorecards/recompute"
    algorithm: weighted_scoring
    formula: |
      # Four input metrics, each already computed as a percent (0-100) for the
      # trailing 12-month window ending at the logical clock:
      #   on_time_ack_pct, rejection_rate_pct, appeal_uphold_rate_pct, accrual_timeliness_pct.
      # Higher is better for on_time_ack and accrual_timeliness; higher is WORSE
      # for rejection_rate and appeal_uphold_rate. Invert the latter two.
      overall_pct =
          0.30 * on_time_ack_pct
        + 0.30 * (100 - rejection_rate_pct)
        + 0.20 * (100 - appeal_uphold_rate_pct)
        + 0.20 * accrual_timeliness_pct
      # Per-metric rounding pinned BEFORE weighting: each input metric is
      # rounded to 2 decimals round_half_up; overall_pct is rounded to 2
      # decimals round_half_up after the weighted sum.
    input_set: "GuidelineAcknowledgment, InvoiceLineItem, Appeal, Accrual rows of this firm whose created_at falls within the trailing 12-month window [clock - 12 months, clock]"
    constants:
      W_ACK: 0.30
      W_REJECTION: 0.30
      W_APPEAL: 0.20
      W_ACCRUAL: 0.20
      WINDOW_MONTHS: 12
    precision: "2 decimal places round_half_up per metric and on overall"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role value is one of the declared §1.7 roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "acting role is listed on the endpoint's roles: array"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "path-template resources exist, validated left-to-right: legal_department_id, panel_firm_id, matter_id, etc."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "target resource is in a state from which the requested transition is permitted per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "block-billing, unapproved-timekeeper, and staffing-ratio rule enforcement during invoice auto-review (regulatory-style controls; run before fiscal checks)"
    error_id: "line-level rejection (rejection_reason_code set); no request-level error"
    http_status: 200
    applies_to: "POST /legal-departments/{deptId}/matters/{matterId}/invoices (auto-review phase)"

  - priority: 6
    category: business_referential
    check: "FK references resolve within scope: Timekeeper belongs to the engaged PanelFirm; Matter.panel_firm_id is ACTIVE; Accrual period not already matched"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "endpoints that take FK inputs"

  - priority: 7
    category: business_constraint
    check: "uniqueness and window constraints: invoice_number unique per firm; RateCard effective_year not in conflict; guideline notice-gap honored"
    error_id: "ERR_DUPLICATE_INVOICE_NUMBER | ERR_RATE_CARD_YEAR_CONFLICT | ERR_NOTICE_GAP_VIOLATION"
    http_status: 409
    applies_to: "invoice create; rate-card submit; guideline publish"

  - priority: 8
    category: business_temporal
    check: "billing_period_end > billing_period_start; guideline effective_date not in the past; accrual period not in the future"
    error_id: ERR_INVALID_TEMPORAL
    http_status: 422
    applies_to: "invoice create; guideline publish; accrual create"

  - priority: 9
    category: business_fiscal
    check: "fiscal gates: invoice approved_total would exceed Matter.budget_cents (ERR_OVER_BUDGET); OCC expected_*_version matches current (ERR_STALE_VERSION)"
    error_id: "ERR_OVER_BUDGET | ERR_STALE_VERSION"
    http_status: 409
    applies_to: "invoice create (over-budget warning is line-level REJECTED with reason OVER_BUDGET); OCC-guarded write endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- LegalDepartment ---
  - method: POST
    path: "/legal-departments"
    description: "Create a legal department (root tenant)"
    roles: [LegalOpsReviewer]
    code: 201
    input: [name, annual_rate_increase_cap_pct, partner_ratio_min_pct, partner_ratio_max_pct, guideline_notice_days, acknowledgment_window_days]
    output: LegalDepartment
    side_effects: ["version = 1"]

  - method: GET
    path: "/legal-departments/{deptId}"
    description: "Get a legal department"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: []
    output: LegalDepartment
    side_effects: []

  - method: GET
    path: "/legal-departments"
    description: "List legal departments (paginated)"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "LegalDepartment[]"
    side_effects: []

  # --- PanelFirm ---
  - method: POST
    path: "/legal-departments/{deptId}/panel-firms"
    description: "Onboard a panel firm"
    roles: [LegalOpsReviewer]
    code: 201
    input: [firm_name]
    output: PanelFirm
    side_effects: ["status = ACTIVE", "version = 1"]

  - method: GET
    path: "/legal-departments/{deptId}/panel-firms/{firmId}"
    description: "Get a panel firm"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: []
    output: PanelFirm
    side_effects: []

  - method: GET
    path: "/legal-departments/{deptId}/panel-firms"
    description: "List panel firms of a department"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "PanelFirm[]"
    side_effects: []

  - method: POST
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/suspend"
    description: "Suspend a panel firm"
    roles: [LegalOpsReviewer]
    code: 200
    input: []
    output: PanelFirm
    side_effects: ["state machine transition"]

  - method: POST
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/reinstate"
    description: "Reinstate a suspended panel firm"
    roles: [LegalOpsReviewer]
    code: 200
    input: []
    output: PanelFirm
    side_effects: ["state machine transition"]

  - method: POST
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/offboard"
    description: "Offboard a suspended panel firm (terminal)"
    roles: [LegalOpsReviewer]
    code: 200
    input: []
    output: PanelFirm
    side_effects: ["state machine transition with cascade to Matters, Timekeepers, RateCards"]

  # --- GuidelineVersion ---
  - method: POST
    path: "/legal-departments/{deptId}/guideline-versions"
    description: "Create a draft guideline version"
    roles: [LegalOpsReviewer]
    code: 201
    input: [version_label, effective_date]
    output: GuidelineVersion
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/legal-departments/{deptId}/guideline-versions/{gvId}"
    description: "Get a guideline version"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: []
    output: GuidelineVersion
    side_effects: []

  - method: GET
    path: "/legal-departments/{deptId}/guideline-versions"
    description: "List guideline versions of a department"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "GuidelineVersion[]"
    side_effects: []

  - method: POST
    path: "/legal-departments/{deptId}/guideline-versions/{gvId}/publish"
    description: "Publish a guideline version (cascades: supersedes prior PUBLISHED; creates PENDING acknowledgments for all ACTIVE firms)"
    roles: [LegalOpsReviewer]
    code: 200
    input: []
    output: GuidelineVersion
    side_effects: ["state machine transition with cascade"]

  # --- GuidelineAcknowledgment ---
  - method: GET
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/acknowledgments/{ackId}"
    description: "Get a single acknowledgment"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: []
