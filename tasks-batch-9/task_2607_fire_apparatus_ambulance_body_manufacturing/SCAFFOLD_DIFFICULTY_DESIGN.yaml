            - "the second size-6 trip on the identical window is rejected 409 ERR_BAY_CAPACITY_EXCEEDED: 6 + 6 == 12 > 10"
            - "trip 3 (size 4) on the identical window is ADMITTED: 6 + 4 == 10 is exactly max_concurrent_visitors, and pairwise overlap alone is never a conflict"
