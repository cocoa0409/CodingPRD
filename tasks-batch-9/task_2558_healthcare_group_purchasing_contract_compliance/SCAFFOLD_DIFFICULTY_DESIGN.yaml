  # ═══════════════════════════════════════════════════════════════════════════
  - rule_id: combinatorial_formula
    instances:
      - name: tier_discount_local_exception_and_floor_clamp_interaction
        grounds:
          - calculations.tier_activated_price
          - entities.ContractItem.fields.floor_price_cents
          - entities.PriceActivation.fields.price_clamped
          - entities.PriceActivation.fields.tier_code_at_activation
          - state_machines.PriceActivation.null_to_DRAFT
        distinguishing_aspect: |
          Mode (a): three inputs interact non-linearly through a nested min-then-clamp —
          tier discount selection, the LOCAL_EXCEPTION ceiling min(requested, tier_price),
          and the floor clamp — so on base 10000 / floor 8200 at TIER_2 a requested 8000
          resolves to 8200 with price_clamped true while on base 10010 / floor 0 the same
          TIER_2 discount rounds 8508.5 to 8509 and a requested 9000 is ceilinged to 8509
          with price_clamped false.
        test_recipe:
          setup:
            - "ACTIVE contract with the shared three-tier ladder."
            - "Catalog item V-1 at base_price_cents 10000 with floor_price_cents 8200, and catalog item V-2 at base_price_cents 10010 with floor_price_cents 0."
            - "Member M-1 with item_master MI-1 and MI-2, holding a commitment elected at TIER_2 with committed_volume_units 5000 whose letter of participation is COUNTERSIGNED, so election_status is ACTIVE and current_tier_code is TIER_2."
          setup_api_calls:
            - call: "POST /gpo/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractManager
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-SUT-1", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, share_basis: "COLLECTED", leakage_alert_threshold_pct: 15.00, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 }, { tier_code: "TIER_1", min_committed_volume_units: 2000, min_compliance_pct: 80.00, discount_bps: 800 }, { tier_code: "TIER_2", min_committed_volume_units: 5000, min_compliance_pct: 90.00, discount_bps: 1500 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 }, { min_gross_pool_cents: 100000, holdback_bps: 250 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/contracts/${c1}/items"
              payload: { vendor_item_number: "V-1", item_description: "Suture 3-0 absorbable", uom: "EA", units_per_uom: 1, base_price_cents: 10000, floor_price_cents: 8200, requires_evidence: false }
              as: ContractManager
              captures: { i1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/items"
              payload: { vendor_item_number: "V-2", item_description: "Suture 4-0 absorbable", uom: "EA", units_per_uom: 1, base_price_cents: 10010, floor_price_cents: 0, requires_evidence: false }
              as: ContractManager
              captures: { i2: $.data.id }
            - call: "POST /gpo/members"
