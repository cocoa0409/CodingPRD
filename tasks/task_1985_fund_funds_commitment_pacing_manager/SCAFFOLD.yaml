    code: 200
    input: ["limit?, offset?, status?"]
    output: "SecondaryBid[]"
    side_effects: []

  - method: GET
    path: "/fof/vehicles/{id}/snapshots"
    description: "List holding snapshots for a vehicle"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?, as_of_quarter?"]
    output: "HoldingSnapshot[]"
    side_effects: []

  - method: GET
    path: "/fof/pacing-plans/{planId}"
    description: "Get one pacing plan by id (flat form)"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: PacingPlan
    side_effects: []

  - method: GET
    path: "/fof/pacing-plans/{id}/proposals"
    description: "List proposals drawing against a pacing plan"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?"]
    output: "InvestmentProposal[]"
    side_effects: []

  - method: GET
    path: "/fof/programs/{id}/proposals"
    description: "List proposals for a program"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
