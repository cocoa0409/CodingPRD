          department_id: ${dept_lab_id}
          revenue_code_id: ${rc_lab_id}
          cdm_number: CDM-40001
          description: Comprehensive metabolic panel
          code_type: CPT
          code_value: '80053'
          cost_basis_cents: 60000
          medicare_rate_cents: 18000
          market_p75_cents: 200000
          effective_from: '2026-09-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
