      - name: damage_event_routing_and_condition_guards_are_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority 10 ERR_DAMAGE_EVENT_INVALID_STATE]
          - validations[priority 10 ERR_VEHICLE_INVALID_CONDITION_STATE]
          - validations[priority 12 ERR_TOTAL_LOSS_DETERMINATION_REQUIRED]
          - validations[priority 12 ERR_TOTAL_LOSS_NOT_APPLICABLE]
          - validations[priority 13 ERR_OPEN_DAMAGE_BLOCKS_LISTING]
        distinguishing_aspect: "total_loss_required is frozen at report time and routes the event irreversibly: the ordinary recovery path is closed to the 2,000,000-cent event and the total-loss path is closed to the 400,000-cent one, so the SAME two endpoints swap roles between the two events on identical vehicles."
        test_recipe:
          setup:
            - "One ATL market with prep_capacity_per_day 2; MIDSIZE segment with an ACTIVE MID-2026 policy; RISK program; AUCTION channel."
            - "Two vehicles under one 2-unit allocation, both IN_SERVICE as of 2026-01-15T00:00:00Z with odometer 0, so each has net_book_value_cents 2800000 at report time (0 elapsed months, 0 km)."
            - "Vehicle 1 carries a 400000-cent damage event: 400000 * 10000 < 2800000 * 7000, so total_loss_required is false."
            - "Vehicle 2 carries a 2000000-cent damage event: 2000000 * 10000 >= 2800000 * 7000, so total_loss_required is true."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
