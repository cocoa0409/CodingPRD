              payload: { project_name: "P", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-08-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
          assert:
            - "Top-level keys include meta, response_type, data"
            - "meta.api_request_id matches /^req_/"
            - "response_type == 'object'"

      - name: error_envelope_shape
        claim_type: response_envelope
        grounds:
          - response_envelope
        distinguishing_aspect: "Error response has response_type=='error' and data.error_id + data.message."
