        test_recipe:
          setup: ["standard fixture; two reservations at the same dealer, 6-day and 7-day windows, two units"]
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-K1", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
