              payload: { evaluated_by_id: "${rate_id}", evaluation_method: "DETAILED_HYDRAULIC", scour_code: 2, foundation_type: "SPREAD_FOOTING", observed_scour_depth_m: 2.6 }
              as: RatingEngineer
              as_user_id: "${rate_id}"
              captures: { se_id: $.data.id }
            - call: "POST /scour-evaluations/${se_id}/finalize"
              payload: {}
              as: RatingEngineer
              as_user_id: "${rate_id}"
            - call: "GET /plans-of-action?bridge_id=${br_id}"
              payload: { bridge_id: "${br_id}" }
              as: DistrictEngineer
              as_user_id: "${dist_id}"
              captures: { poa_id: "$.data[0].id" }
            - call: "PUT /plans-of-action/${poa_id}"
              payload: { monitoring_frequency_months: 3, closure_trigger_stage_m: 4.5, countermeasure_type: "RIPRAP" }
              as: DistrictEngineer
              as_user_id: "${dist_id}"
          trigger:
            - call: "PUT /plans-of-action/${poa_id}"
              payload: { monitoring_frequency_months: 3, closure_trigger_stage_m: 4.5, countermeasure_type: "RIPRAP" }
