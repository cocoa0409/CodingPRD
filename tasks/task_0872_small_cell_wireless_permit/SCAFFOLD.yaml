scenario: "Small-Cell & Wireless Facility Permit (ROW): application & node/site, ROW & design-standard review, shot-clock & batch, fee & recurring rental, collocation vs new pole, aesthetic/historic review, inspection & activation, denial/appeal"
domain_name: small-cell-wireless-permit
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - scheduled_actions

  entity_topology: hybrid
  # PermitApplication -> Node is a strict parent-child tree; Node also holds
  # cross-cutting FKs to SupportStructure and ROWSegment (peer resources), and
  # FeeInvoice/RecurringRental/Appeal/IncompletenessNotice hang off the tree.

  state_machine_shape: cyclic
  # PermitApplication is cyclic (SUBMITTED<->INCOMPLETE completeness loop) AND
  # branching (UNDER_REVIEW -> {GRANTED, PARTIALLY_GRANTED, DENIED}); Node runs
  # two parallel review dimensions that fork-join into APPROVED/REJECTED.

  relationship_patterns:
    - one_to_many        # PermitApplication -> Node ; FeeInvoice -> Payment ; Node -> RecurringRental
    - cross_aggregate    # Node -> SupportStructure, Node -> ROWSegment

  role_model: segregation_of_duties
  # Approver who issues a decision must not be any user who reviewed a node
  # (four-eyes). Applicant / ROWReviewer / AestheticReviewer / Approver /
  # Inspector own disjoint operations; PlatformAdmin seeds infrastructure.

  consistency_model: immediate

# =====================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =====================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: legal name of the wireless provider / carrier
      - name: contact_email
        type: string
        source: input
        description: primary contact email
      - name: certification_status
        type: enum
        source: system
        description: provider standing with the ROW authority
        default: REGISTERED
        constraints: "one of {REGISTERED}; every applicant is created REGISTERED (reserved for future standing rules)"
      - name: master_agreement_signed
        type: boolean
        source: system
        description: whether the ROW master license agreement has been executed; required before any application may be submitted
        default: false
      - name: master_agreement_signed_at
        type: datetime
        source: system
        description: logical-clock timestamp when the master agreement was signed; null until signed
        default: null

  - name: SupportStructure
    parent: null
    common_fields: true
    fields:
      - name: structure_type
        type: enum
        source: input
        description: "kind of vertical asset the node attaches to; one of {EXISTING_UTILITY, EXISTING_MUNICIPAL, NEW_POLE}"
        constraints: "EXISTING_* are pre-existing poles a COLLOCATION reuses; NEW_POLE is a proposed replacement/new pole (capacity is usually 1)"
      - name: max_collocations
        type: integer
        source: input
        description: total number of small-cell slots this structure can physically host
        constraints: ">= 1"
      - name: reserved_collocations
        type: integer
        source: system
        description: slots held by nodes whose design review passed but which are not yet ACTIVATED (states APPROVED/PERMITTED); maintained by reserve/release side effects
        default: 0
      - name: active_collocations
        type: integer
        source: system
        description: slots occupied by ACTIVATED nodes; maintained by activation side effect
        default: 0
      - name: available_collocations
        type: integer
        source: computed
        description: "max_collocations - reserved_collocations - active_collocations"
      - name: status
        type: enum
        source: system
        description: structure lifecycle
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"
      - name: in_design_district
        type: enum
        source: input
        description: "aesthetic design-district classification of the structure's location; one of {NONE, STANDARD, HISTORIC}"
        default: NONE
      - name: location_desc
        type: string
        source: input
        description: human-readable location of the structure
        default: null

  - name: ROWSegment
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: descriptive name of the right-of-way segment
      - name: corridor_code
        type: string
        source: input
        description: municipal corridor identifier
      - name: last_paved_at
        type: datetime
        source: input
        description: logical-clock timestamp when this segment was last repaved; null if never paved (no moratorium)
        default: null
      - name: moratorium_months
        type: integer
        source: input
        description: length of the pavement-cut moratorium window measured from last_paved_at, in whole months
        default: 36
      - name: in_historic_district
        type: boolean
        source: input
        description: whether the segment lies in a historic district (nodes here require aesthetic/historic review)
        default: false

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; set from X-User-ID of the acting Applicant at creation"
      - name: project_name
        type: string
        source: input
        description: applicant's label for this batch
        default: null
      - name: status
        type: enum
        source: system
        description: application lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, INCOMPLETE, UNDER_REVIEW, GRANTED, PARTIALLY_GRANTED, DENIED, DEEMED_GRANTED, WITHDRAWN, UNDER_APPEAL, APPEAL_GRANTED, APPEAL_DENIED}"
      - name: node_count
        type: integer
        source: computed
        description: count of child Nodes (any status)
      - name: shot_clock_base_days
        type: integer
        source: computed
        description: "60 if every child Node is COLLOCATION, else 90 (any NEW_POLE node forces the longer FCC clock); null until submitted"
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock timestamp of first submission; null in DRAFT
        default: null
      - name: toll_days_accumulated
        type: number
        source: system
        description: total tolling time (in days) contributed by cured IncompletenessNotices; added to the shot clock
        default: 0
      - name: shot_clock_deadline
        type: datetime
        source: computed
        description: "submitted_at + shot_clock_base_days days + toll_days_accumulated; the instant after which an undecided application may be DEEMED_GRANTED; null until submitted"
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock timestamp when a decision (grant/partial/deny/deemed) was recorded; null otherwise
        default: null

  - name: Node
    parent: PermitApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> PermitApplication.id; the batch this node belongs to"
      - name: support_structure_id
        type: string
        source: input
        description: "FK -> SupportStructure.id; the pole this node attaches to (existing pole for COLLOCATION, a NEW_POLE structure for new construction)"
      - name: row_segment_id
        type: string
        source: input
        description: "FK -> ROWSegment.id; the right-of-way segment the node sits in"
      - name: facility_type
        type: enum
        source: input
        description: "one of {COLLOCATION, NEW_POLE}; drives fee rate and shot-clock length"
      - name: proposed_construction_date
        type: datetime
        source: input
        description: logical-clock date the applicant proposes to build/excavate (checked against the segment pavement moratorium for NEW_POLE nodes)
      - name: location_desc
        type: string
        source: input
        description: human-readable node location
        default: null
      - name: status
        type: enum
        source: system
        description: node lifecycle state
        default: PROPOSED
        constraints: "one of {PROPOSED, IN_REVIEW, APPROVED, REJECTED, PERMITTED, ACTIVATED, DENIED, WITHDRAWN}"
      - name: design_review_status
        type: enum
        source: system
        description: outcome dimension of the ROW/design-standard review
        default: PENDING
        constraints: "one of {PENDING, PASS, FAIL}"
      - name: aesthetic_review_status
        type: enum
        source: system
        description: outcome dimension of the aesthetic/historic review; auto-set to WAIVED at submit when the segment is not in a historic district and the structure is not in a design district
        default: PENDING
        constraints: "one of {PENDING, PASS, FAIL, WAIVED}"

  - name: NodeReview
    parent: Node
    common_fields: false
    fields:
      - name: node_id
        type: string
        source: input
        description: "FK -> Node.id; the node this review record pertains to"
      - name: review_type
        type: enum
        source: input
        description: "one of {DESIGN_STANDARD, AESTHETIC_HISTORIC}"
      - name: outcome
        type: enum
        source: input
        description: "one of {PASS, FAIL}"
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the reviewer who recorded this review; used for the four-eyes SoD check at decision time
      - name: findings
        type: string
        source: input
        description: free-text review notes
        default: null

  - name: Inspection
    parent: Node
    common_fields: false
    fields:
      - name: node_id
        type: string
        source: input
        description: "FK -> Node.id; the node inspected"
      - name: outcome
        type: enum
        source: input
        description: "one of {PASS, FAIL}"
      - name: inspector_user_id
        type: string
        source: system
        description: X-User-ID of the inspector who recorded this inspection
      - name: scheduled_start
        type: datetime
        source: input
        description: scheduled inspection window start
        default: null
      - name: scheduled_end
        type: datetime
        source: input
        description: scheduled inspection window end
        default: null
      - name: notes
        type: string
        source: input
        description: inspection notes
        default: null

  - name: FeeInvoice
    parent: PermitApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> PermitApplication.id; the application this invoice bills"
      - name: fee_variant
        type: enum
        source: system
        description: which calculation produced the current assessed amount; PROVISIONAL at submit, FINAL once the application is decided
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: assessed_amount_cents
        type: integer
        source: system
        description: current total application fee owed (recomputed to FINAL on decision)
        default: 0
      - name: paid_amount_cents
        type: integer
        source: system
        description: gross sum of CAPTURED PAYMENT-type Payments against this invoice
        default: 0
      - name: refunded_amount_cents
        type: integer
        source: system
        description: gross sum of CAPTURED REFUND-type Payments against this invoice
        default: 0
      - name: outstanding_amount_cents
        type: integer
        source: computed
        description: "assessed_amount_cents - paid_amount_cents + refunded_amount_cents"
      - name: status
        type: enum
        source: system
        description: invoice state
        default: OPEN
        constraints: "one of {OPEN, PAID, REFUNDED}"

  - name: Payment
    parent: FeeInvoice
    common_fields: false
    fields:
      - name: fee_invoice_id
        type: string
        source: input
        description: "FK -> FeeInvoice.id; the invoice this payment applies to"
      - name: amount_cents
        type: integer
        source: input
        description: positive amount of this payment or refund, in cents
        constraints: "> 0"
      - name: payment_type
        type: enum
        source: input
        description: "one of {PAYMENT, REFUND}; REFUNDs are created by the system during withdraw/deny compensation"
        default: PAYMENT
      - name: status
        type: enum
        source: system
        description: settlement state (this benchmark captures synchronously)
        default: CAPTURED
        constraints: "one of {CAPTURED}"

  - name: RecurringRental
    parent: Node
    common_fields: true
    fields:
      - name: node_id
        type: string
        source: input
        description: "FK -> Node.id; the activated node this ROW rental bills"
      - name: status
        type: enum
        source: system
        description: rental period state
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, EXPIRED, VOID}"
      - name: billing_year
        type: integer
        source: system
        description: calendar year the period bills
      - name: period_start
        type: datetime
        source: system
        description: half-open interval start (inclusive)
      - name: period_end
        type: datetime
        source: system
        description: half-open interval end (exclusive); Jan 1 of the following year for the first prorated period
      - name: estimated_amount_cents
        type: integer
        source: system
        description: provisional rental computed at permit grant using decided_at as the proration reference
        default: 0
      - name: actual_amount_cents
        type: integer
        source: system
        description: final rental computed at activation using the activation date as the proration reference; 0 until ACTIVE
        default: 0

  - name: IncompletenessNotice
    parent: PermitApplication
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> PermitApplication.id; the application found incomplete"
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock timestamp the notice was issued (tolling begins)
      - name: cured_at
        type: datetime
        source: system
        description: logical-clock timestamp the applicant cured the deficiency (tolling ends); null while open
        default: null
      - name: toll_days
        type: number
        source: system
        description: "(cured_at - issued_at) in days; 0 while open"
        default: 0
      - name: deficiencies
        type: string
        source: input
        description: reviewer description of what is missing
        default: null

  - name: Appeal
    parent: PermitApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> PermitApplication.id; the denied/partially-granted application under appeal"
      - name: grounds
        type: string
        source: input
        description: applicant's basis for appeal
      - name: status
        type: enum
        source: system
        description: appeal state
        default: FILED
        constraints: "one of {FILED, OVERTURNED, UPHELD}"
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the Approver who decided the appeal; null until decided
        default: null
      - name: decision_notes
        type: string
        source: input
        description: notes recorded with the appeal decision
        default: null

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: PermitApplication
    initial_state: DRAFT
    terminal_states: [GRANTED, DEEMED_GRANTED, WITHDRAWN, APPEAL_GRANTED, APPEAL_DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "acting Applicant owns the application (X-User-ID == applicant_id)"
          - "Applicant.master_agreement_signed == true"
          - "node_count >= 1"
          - "every child Node has support_structure_id, row_segment_id and proposed_construction_date set"
        side_effects:
          - "set submitted_at = current logical clock"
          - "compute shot_clock_base_days (60 if all nodes COLLOCATION else 90) and shot_clock_deadline (calc application_shot_clock_deadline)"
          - "create FeeInvoice (fee_variant=PROVISIONAL, assessed_amount_cents = calc application_fee provisional variant, status=OPEN)"
          - "each Node PROPOSED -> IN_REVIEW"
          - "for each Node whose ROWSegment.in_historic_district == false AND SupportStructure.in_design_district == NONE: set aesthetic_review_status = WAIVED"
      - from: SUBMITTED
        to: INCOMPLETE
        trigger: "POST /applications/{id}/completeness-review {complete:false}"
        actor: ROWReviewer
        preconditions: ["application.status == SUBMITTED"]
        side_effects:
          - "create IncompletenessNotice (issued_at = current clock, cured_at = null)"
        note: "tolling begins; the shot clock is paused until cure"
      - from: INCOMPLETE
        to: SUBMITTED
        trigger: "POST /applications/{id}/cure"
        actor: Applicant
        preconditions:
          - "acting Applicant owns the application"
          - "application.status == INCOMPLETE"
          - "the latest IncompletenessNotice has cured_at == null"
        side_effects:
          - "set latest IncompletenessNotice.cured_at = current clock and toll_days = (cured_at - issued_at) in days"
          - "toll_days_accumulated += that toll_days"
          - "recompute shot_clock_deadline (calc application_shot_clock_deadline)"
        note: "revision loop: completeness cycle SUBMITTED<->INCOMPLETE"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/completeness-review {complete:true}"
        actor: ROWReviewer
        preconditions: ["application.status == SUBMITTED"]
        side_effects: ["nodes remain IN_REVIEW; substantive ROW/design and aesthetic review may now proceed"]
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /applications/{id}/decision"
        actor: Approver
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "acting Approver's X-User-ID is not the reviewer_user_id of any NodeReview under this application (four-eyes SoD)"
          - "every child Node is in APPROVED (no node still IN_REVIEW)"
          - "every child Node's design_review_status == PASS and aesthetic_review_status in {PASS, WAIVED}"
        side_effects:
          - "set decided_at = current clock"
          - "each Node APPROVED -> PERMITTED"
          - "for each PERMITTED node create RecurringRental (status=PENDING, estimated_amount_cents = calc recurring_rental_amount estimate variant with ref = decided_at)"
          - "recompute FeeInvoice to FINAL (calc application_fee final variant; fee_variant=FINAL)"
      - from: UNDER_REVIEW
        to: PARTIALLY_GRANTED
        trigger: "POST /applications/{id}/decision"
        actor: Approver
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "four-eyes SoD holds"
          - "no child Node is still IN_REVIEW"
          - "at least one Node is APPROVED and at least one Node is REJECTED"
        side_effects:
          - "set decided_at = current clock"
          - "each APPROVED Node -> PERMITTED; each REJECTED Node -> DENIED (release reserved SupportStructure slot: reserved_collocations -= 1)"
          - "for each PERMITTED node create RecurringRental (PENDING, estimate variant)"
          - "recompute FeeInvoice to FINAL over PERMITTED nodes only; if paid_amount_cents - refunded_amount_cents > new assessed_amount_cents, create a REFUND Payment for the excess"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /applications/{id}/decision"
        actor: Approver
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "four-eyes SoD holds"
          - "no child Node is still IN_REVIEW"
          - "every child Node is REJECTED"
        side_effects:
          - "set decided_at = current clock"
          - "each Node REJECTED -> DENIED (release reserved SupportStructure slot: reserved_collocations -= 1)"
          - "recompute FeeInvoice to FINAL (assessed_amount_cents = 0 permitted nodes); create a REFUND Payment for any net collected (paid_amount_cents - refunded_amount_cents) and set FeeInvoice.status = REFUNDED"
      - from: SUBMITTED
        to: DEEMED_GRANTED
        trigger: "POST /applications/{id}/evaluate-deadline"
        actor: PlatformAdmin
        preconditions:
          - "current logical clock > shot_clock_deadline (strict)"
          - "application.status in {SUBMITTED, INCOMPLETE, UNDER_REVIEW}"
        side_effects:
          - "set decided_at = current clock"
          - "each Node not in {REJECTED, DENIED, WITHDRAWN} -> PERMITTED"
          - "for each PERMITTED node create RecurringRental (PENDING, estimate variant)"
          - "recompute FeeInvoice to FINAL over PERMITTED nodes"
        note: "boundary: at clock == shot_clock_deadline this is rejected with ERR_SHOT_CLOCK_NOT_EXPIRED"
      - from: INCOMPLETE
        to: DEEMED_GRANTED
        trigger: "POST /applications/{id}/evaluate-deadline"
        actor: PlatformAdmin
        preconditions: ["current clock > shot_clock_deadline", "application.status == INCOMPLETE"]
        side_effects: ["same as SUBMITTED -> DEEMED_GRANTED"]
      - from: UNDER_REVIEW
        to: DEEMED_GRANTED
        trigger: "POST /applications/{id}/evaluate-deadline"
        actor: PlatformAdmin
        preconditions: ["current clock > shot_clock_deadline", "application.status == UNDER_REVIEW"]
        side_effects: ["same as SUBMITTED -> DEEMED_GRANTED"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["acting Applicant owns the application", "application.status in {DRAFT, SUBMITTED, INCOMPLETE, UNDER_REVIEW, GRANTED, PARTIALLY_GRANTED}"]
        side_effects:
          - "each non-terminal Node -> WITHDRAWN"
          - "each WITHDRAWN Node that held a reserved slot releases it (reserved_collocations -= 1); each WITHDRAWN Node's PENDING RecurringRental -> VOID"
          - "if a FeeInvoice exists and net collected (paid_amount_cents - refunded_amount_cents) > 0, create a REFUND Payment for the full net and set FeeInvoice.status = REFUNDED"
        note: "withdraw is reachable from every non-appeal, non-terminal state (and from GRANTED/PARTIALLY_GRANTED as a surrender)"
      - from: DENIED
        to: UNDER_APPEAL
        trigger: "POST /applications/{id}/appeal"
        actor: Applicant
        preconditions: ["acting Applicant owns the application", "application.status in {DENIED, PARTIALLY_GRANTED}"]
        side_effects: ["create Appeal (status=FILED)"]
      - from: PARTIALLY_GRANTED
        to: UNDER_APPEAL
        trigger: "POST /applications/{id}/appeal"
        actor: Applicant
        preconditions: ["acting Applicant owns the application", "application.status in {DENIED, PARTIALLY_GRANTED}"]
        side_effects: ["create Appeal (status=FILED)"]
      - from: UNDER_APPEAL
        to: APPEAL_GRANTED
        trigger: "POST /appeals/{id}/decision {uphold:false}"
        actor: Approver
        preconditions:
          - "application.status == UNDER_APPEAL"
          - "acting Approver is not the reviewer_user_id of any NodeReview under this application (four-eyes SoD)"
        side_effects:
          - "set Appeal.status = OVERTURNED, decided_by_user_id = X-User-ID"
          - "each previously DENIED Node -> PERMITTED; create RecurringRental (PENDING, estimate variant with ref = current clock) for each"
          - "recompute FeeInvoice to FINAL over the enlarged PERMITTED set"
      - from: UNDER_APPEAL
        to: APPEAL_DENIED
        trigger: "POST /appeals/{id}/decision {uphold:true}"
        actor: Approver
        preconditions: ["application.status == UNDER_APPEAL", "four-eyes SoD holds"]
        side_effects: ["set Appeal.status = UPHELD, decided_by_user_id = X-User-ID"]

  - entity: Node
    initial_state: PROPOSED
    terminal_states: [ACTIVATED, DENIED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: IN_REVIEW
        trigger: "system, on parent PermitApplication DRAFT -> SUBMITTED"
        actor: system
        preconditions: ["parent application submitted"]
        side_effects: ["aesthetic_review_status set to WAIVED when neither historic district nor design district applies"]
      - from: IN_REVIEW
        to: IN_REVIEW
        trigger: "POST /nodes/{id}/design-review"
        actor: ROWReviewer
        preconditions:
          - "node.status == IN_REVIEW"
          - "parent application.status == UNDER_REVIEW"
          - "SupportStructure.status == ACTIVE (cross-entity)"
          - "on outcome PASS: reserved_collocations + active_collocations < max_collocations on the referenced SupportStructure"
          - "on outcome PASS for a NEW_POLE node: proposed_construction_date is NOT within the ROWSegment pavement moratorium window"
          - "expected_support_structure_version matches SupportStructure.version (OCC)"
        side_effects:
          - "create NodeReview (review_type=DESIGN_STANDARD, reviewer_user_id = X-User-ID)"
          - "set design_review_status = outcome"
          - "on PASS: SupportStructure.reserved_collocations += 1"
          - "increments SupportStructure.version by 1"
          - "evaluate join: see design/aesthetic fork-join below"
        note: "records one review dimension; node stays IN_REVIEW until the fork-join resolves"
      - from: IN_REVIEW
        to: IN_REVIEW
        trigger: "POST /nodes/{id}/aesthetic-review"
        actor: AestheticReviewer
        preconditions:
          - "node.status == IN_REVIEW"
          - "parent application.status == UNDER_REVIEW"
          - "aesthetic_review_status == PENDING (a WAIVED node needs no aesthetic review)"
        side_effects:
          - "create NodeReview (review_type=AESTHETIC_HISTORIC, reviewer_user_id = X-User-ID)"
          - "set aesthetic_review_status = outcome"
          - "evaluate join"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "system fork-join, after a review sets a dimension"
        actor: system
        preconditions: ["design_review_status == PASS", "aesthetic_review_status in {PASS, WAIVED}"]
        side_effects: []
        note: "parallel dimensions design_review_status x aesthetic_review_status join to APPROVED only when both are satisfied"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "system fork-join, after a review sets a dimension"
        actor: system
        preconditions: ["design_review_status == FAIL OR aesthetic_review_status == FAIL"]
        side_effects: ["if a slot was already reserved by a prior design PASS, release it (SupportStructure.reserved_collocations -= 1)"]
      - from: APPROVED
        to: PERMITTED
        trigger: "system, on parent application decision GRANTED/PARTIALLY_GRANTED/DEEMED_GRANTED"
        actor: system
        preconditions: ["parent application transitioned to a granting state"]
        side_effects: ["RecurringRental (PENDING) created by the parent transition"]
      - from: REJECTED
        to: DENIED
        trigger: "system, on parent application decision"
        actor: system
        preconditions: ["parent application decided"]
        side_effects: ["release reserved slot if still held (reserved_collocations -= 1)"]
      - from: PERMITTED
        to: ACTIVATED
        trigger: "POST /nodes/{id}/activate"
        actor: Inspector
        preconditions:
          - "node.status == PERMITTED (cross-entity: parent application in a granting state)"
          - "the node's latest Inspection.outcome == PASS"
          - "parent application's FeeInvoice.outstanding_amount_cents == 0 (fully paid)"
        side_effects:
          - "the node's RecurringRental PENDING -> ACTIVE; set actual_amount_cents = calc recurring_rental_amount actual variant (ref = current clock), period_start = current clock, period_end = Jan 1 of the following year, billing_year = current year"
          - "SupportStructure.reserved_collocations -= 1; SupportStructure.active_collocations += 1"
      - from: DENIED
        to: PERMITTED
        trigger: "system, on Appeal OVERTURNED"
        actor: system
        preconditions: ["parent application UNDER_APPEAL -> APPEAL_GRANTED"]
        side_effects: ["RecurringRental (PENDING) created by the appeal transition"]
      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "system, on parent application withdraw"
        actor: system
        preconditions: ["parent application withdrawn"]
        side_effects: ["release reserved slot if held"]
      - from: PERMITTED
        to: WITHDRAWN
        trigger: "system, on parent application withdraw (surrender)"
        actor: system
        preconditions: ["parent application withdrawn from GRANTED/PARTIALLY_GRANTED"]
        side_effects: ["release reserved slot; PENDING RecurringRental -> VOID"]

  - entity: RecurringRental
    initial_state: PENDING
    terminal_states: [EXPIRED, VOID]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /nodes/{id}/activate (on the node this rental belongs to)"
        actor: Inspector
        preconditions: ["parent Node PERMITTED -> ACTIVATED"]
        side_effects: ["set actual_amount_cents, period_start, period_end, billing_year (calc recurring_rental_amount actual variant)"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /rentals/{id}/renew"
        actor: PlatformAdmin
        preconditions:
          - "rental.status == ACTIVE"
          - "requested [period_start, period_end) does not overlap any non-VOID RecurringRental of the same node (half-open; adjacency allowed)"
        side_effects: ["current rental -> EXPIRED; create a new RecurringRental (ACTIVE) for the requested period"]
      - from: PENDING
        to: VOID
        trigger: "system, on parent Node WITHDRAWN"
        actor: system
        preconditions: ["parent node withdrawn before activation"]
        side_effects: []

  - entity: SupportStructure
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /support-structures/{id}/retire"
        actor: PlatformAdmin
        preconditions:
          - "structure.status == ACTIVE"
          - "reserved_collocations == 0 and active_collocations == 0 (no slot may be held)"
        side_effects: ["set status = RETIRED", "increments SupportStructure.version by 1"]
        note: "a RETIRED structure rejects further design reviews (ERR_STRUCTURE_NOT_ACTIVE)"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [OVERTURNED, UPHELD]
    transitions:
      - from: FILED
        to: OVERTURNED
        trigger: "POST /appeals/{id}/decision {uphold:false}"
        actor: Approver
        preconditions: ["appeal.status == FILED", "four-eyes SoD holds vs node reviewers"]
        side_effects: ["parent application UNDER_APPEAL -> APPEAL_GRANTED; denied nodes -> PERMITTED"]
      - from: FILED
        to: UPHELD
        trigger: "POST /appeals/{id}/decision {uphold:true}"
        actor: Approver
        preconditions: ["appeal.status == FILED", "four-eyes SoD holds"]
        side_effects: ["parent application UNDER_APPEAL -> APPEAL_DENIED"]

# =====================================================================
# §1.2.1 Concurrency Rules (OCC — the only sanctioned write-write mechanism)
# =====================================================================
concurrency_rules:
  - rule_id: design-review-stale-structure
    parent_entity: SupportStructure
    write_endpoint: "POST /nodes/{id}/design-review"
    occ_field: "expected_support_structure_version"
    description: |
      Recording a design review that reserves a collocation slot against a
      SupportStructure whose version has advanced since the reviewer last read
      it is rejected. This captures the case where another node's design PASS
      has just consumed a slot (legitimately advancing the structure's version)
      and the current reviewer's view of the structure's remaining capacity is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: payment-stale-invoice
    parent_entity: FeeInvoice
    write_endpoint: "POST /fee-invoices/{id}/payments"
    occ_field: "expected_fee_invoice_version"
    description: |
      Recording a payment against a FeeInvoice whose version has advanced since
      the payer last read it is rejected. This captures the case where another
      writer has just posted a payment (legitimately advancing the invoice
      version and reducing the outstanding balance) and the current payer's view
      of the amount owed is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: application_shot_clock_deadline
    trigger: "on PermitApplication DRAFT->SUBMITTED (submit) and on INCOMPLETE->SUBMITTED (cure)"
    algorithm: threshold
    formula: |
      base_days = NEW_POLE_SHOT_CLOCK_DAYS if any(node.facility_type == "NEW_POLE"
                                                  for node in application.nodes)
                  else COLLOCATION_SHOT_CLOCK_DAYS
      shot_clock_base_days = base_days
      # toll_days_accumulated is the running sum of cured notice durations (days)
      shot_clock_deadline = submitted_at
                            + timedelta(days=base_days)
                            + timedelta(days=toll_days_accumulated)
    input_set: "all child Nodes of the application (any status); submitted_at is the first-submission clock value and is NOT reset by the completeness cycle"
    constants:
      COLLOCATION_SHOT_CLOCK_DAYS: 60
      NEW_POLE_SHOT_CLOCK_DAYS: 90
    precision: "datetime arithmetic; deadline rendered ISO-8601 UTC with three fractional digits"
    variants: []

  - name: application_fee
    trigger: "on submit (PROVISIONAL) and on any granting/denying decision (FINAL)"
    algorithm: aggregation
    formula: |
      def per_node_total(node):
          base = NEW_POLE_APP_FEE_CENTS if node.facility_type == "NEW_POLE"
                 else COLLOCATION_APP_FEE_CENTS
          # ROW administrative technology surcharge, rounded PER NODE to whole cents
          return round_half_up(base * (1 + TECH_SURCHARGE_PCT))
      # Rounding order is pinned: round each node's surcharged fee to cents,
      # THEN sum. (sum-then-round would differ by a cent for some batches.)
      assessed_amount_cents = sum(per_node_total(n) for n in counted_nodes)
    input_set: "counted_nodes depends on variant (see variants)"
    constants:
      COLLOCATION_APP_FEE_CENTS: 47533
      NEW_POLE_APP_FEE_CENTS: 95066
      TECH_SURCHARGE_PCT: 0.0825
    precision: "round_half_up to whole cents, applied per node before summation"
    variants:
      - name: provisional
        when: "at submit"
        difference: "counted_nodes = all child Nodes as filed"
      - name: final
        when: "at decision (grant/partial/deny/deemed) and on appeal grant"
        difference: "counted_nodes = only Nodes ending in PERMITTED; denied/withdrawn nodes are excluded, which can also drop the surviving-node count and thus the fee"

  - name: recurring_rental_amount
    trigger: "estimate at permit grant (RecurringRental creation); actual at node activation"
    algorithm: decay_function
    formula: |
      year = ref_date.year
      days_in_year = (date(year,12,31) - date(year,1,1)).days + 1     # 365 for 2026
      remaining_days = (date(year,12,31) - ref_date.date()).days + 1  # inclusive of ref day and Dec 31
      amount_cents = round_half_up(ANNUAL_ROW_RENTAL_PER_NODE_CENTS
                                   * remaining_days / days_in_year)
    input_set: "single node; ref_date differs by variant"
    constants:
      ANNUAL_ROW_RENTAL_PER_NODE_CENTS: 27000
    precision: "round_half_up to whole cents"
    variants:
      - name: estimate
        when: "at permit grant (application decision / deemed / appeal grant)"
        difference: "ref_date = decided_at (or current clock at appeal grant) -> estimated_amount_cents"
      - name: actual
        when: "at node activation"
        difference: "ref_date = activation clock (>= decided_at) -> actual_amount_cents; strictly <= the estimate because fewer days remain"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every resource named in the path exists (validated left-to-right)"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints (entity-specific NOT_FOUND per §1.6)"

  - priority: 4
    category: state
    check: "target resource is in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "four-eyes segregation of duties: the acting Approver's X-User-ID is not the reviewer_user_id of any NodeReview under this application"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /applications/{id}/decision, POST /appeals/{id}/decision"

  - priority: 6
    category: business_referential
    check: "applicant has signed the ROW master agreement"
    error_id: ERR_MASTER_AGREEMENT_REQUIRED
    http_status: 422
    applies_to: "POST /applications/{id}/submit"

  - priority: 7
    category: business_referential
    check: "no child Node is still IN_REVIEW when a decision is requested"
    error_id: ERR_NODES_PENDING_REVIEW
    http_status: 409
    applies_to: "POST /applications/{id}/decision"

  - priority: 8
    category: business_referential
    check: "submit requires >=1 node and each node fully specified (structure, segment, construction date)"
    error_id: ERR_NO_NODES
    http_status: 422
    applies_to: "POST /applications/{id}/submit"

  - priority: 9
    category: business_safety
    check: "the referenced SupportStructure.status == ACTIVE"
    error_id: ERR_STRUCTURE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /nodes/{id}/design-review"

  - priority: 10
    category: business_temporal
    check: "for a NEW_POLE node on design PASS: proposed_construction_date is not within [last_paved_at, last_paved_at + moratorium_months) of the ROWSegment"
    error_id: ERR_PAVEMENT_MORATORIUM
    http_status: 409
    applies_to: "POST /nodes/{id}/design-review"

  - priority: 11
    category: business_constraint
    check: "on design PASS: reserved_collocations + active_collocations < max_collocations on the SupportStructure"
    error_id: ERR_STRUCTURE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /nodes/{id}/design-review"

  - priority: 12
    category: business_temporal
    check: "requested rental [period_start, period_end) does not overlap any non-VOID RecurringRental of the same node (half-open; adjacency allowed)"
    error_id: ERR_RENTAL_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /rentals/{id}/renew"

  - priority: 13
    category: business_safety
    check: "the node's latest Inspection.outcome == PASS before activation"
    error_id: ERR_INSPECTION_NOT_PASSED
    http_status: 409
    applies_to: "POST /nodes/{id}/activate"

  - priority: 14
    category: business_fiscal
    check: "the application's FeeInvoice.outstanding_amount_cents == 0 before activation"
    error_id: ERR_INVOICE_UNPAID
    http_status: 402
    applies_to: "POST /nodes/{id}/activate"

  - priority: 15
    category: business_fiscal
    check: "payment amount_cents > 0 and does not exceed outstanding_amount_cents"
    error_id: ERR_INVALID_PAYMENT_AMOUNT
    http_status: 422
    applies_to: "POST /fee-invoices/{id}/payments"

  - priority: 16
    category: business_temporal
    check: "evaluate-deadline only deems granted when current clock > shot_clock_deadline (strict)"
    error_id: ERR_SHOT_CLOCK_NOT_EXPIRED
    http_status: 409
    applies_to: "POST /applications/{id}/evaluate-deadline"

  - priority: 17
    category: business_constraint
    check: "OCC: expected_support_structure_version / expected_fee_invoice_version equals the current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /nodes/{id}/design-review, POST /fee-invoices/{id}/payments"

  - priority: 18
    category: business_constraint
    check: "request body has all required fields, valid enum members, positive integers where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

