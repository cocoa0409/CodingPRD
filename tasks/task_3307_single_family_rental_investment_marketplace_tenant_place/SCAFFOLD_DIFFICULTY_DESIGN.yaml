        grounds:
          - state_machines.Offer.DRAFT_to_SUBMITTED
          - state_machines.Listing.transitions
        distinguishing_aspect: |
          Offer -> Listing pair: an offer may only SUBMIT while its Listing is
          in {LISTED, OFFER_PENDING}; on a merely CERTIFIED listing the same
          submit is rejected, and the listing flips LISTED->OFFER_PENDING on
          the first successful submit.
        test_recipe:
          setup:
            - "Seller S, buyer B (funds 100000000), program P (min 50, no lease req); listing L CERTIFIED but not yet PUBLISHed; offer O created"
          setup_api_calls:
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
