  - rule_id: compensating_invariant
    instances:
      - name: review_slot_conservation_queue_then_withdraw
        grounds:
          - calculations.review_capacity_allocation
          - entities.ReviewCapacityWindow.fields.slots_reserved
          - entities.ReviewCapacityWindow.fields.slots_consumed
          - entities.ReviewCapacityWindow.fields.slots_available
          - state_machines.Submission.WAITING_FOR_REVIEW_to_DEVELOPER_WITHDRAWN
          - state_machines.Submission.WAITING_FOR_REVIEW_to_IN_REVIEW
          - state_machines.Submission.IN_REVIEW_to_APPROVED
          - entities.Submission.fields.review_window_id
        distinguishing_aspect: |
          Withdrawal is the exact compensating action for a queue reservation (available 4 -> 5, review_window_id
          back to null) while a reviewer decision is NOT compensable: APPROVE moves the slot from reserved to
          consumed and leaves slots_available pinned at 4 forever, yet
          slots_reserved + slots_consumed + slots_available == capacity_slots == 5 at every single observation.
