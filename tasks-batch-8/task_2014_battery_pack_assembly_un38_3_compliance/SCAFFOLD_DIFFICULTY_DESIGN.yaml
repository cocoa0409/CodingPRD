      - name: pack_disposition_invariant_delivered_then_returned_leaves_pack_scrapped
        grounds:
          - entities.BatteryPack.fields.disposition
          - state_machines.BatteryPack.DELIVERED_to_RETURNED
          - state_machines.ReturnAuthorization
        distinguishing_aspect: |
          Conserved quantity = pack disposition lifecycle. Forward = DELIVERED
          (disposition IN_SERVICE); compensating = RMA flow drives pack to
          RETURNED + SCRAPPED. Invariant: at end of RMA close, pack is
          SCRAPPED, RMA is CLOSED, and pack's is_safe_discharged == true —
          i.e., no pack that has gone through the safe-discharge return flow
          may remain IN_SERVICE.
        test_recipe:
          setup:
            - "Program; lot; BOM; pack PK fully shipped to DELIVERED, disposition IN_SERVICE"
            - "RMA opened by cs-1 with target_soc=25.0"
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-R", storage_capacity_wh: 10000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-R", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 40.0, measured_voltage_v: 3.55, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-R", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { bom_id: $.data.id, bom_v: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v}" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { pack_id: $.data.id, pack_v0: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records"
              payload: { weld_count: 8, current_amps: 80.0, pulse_ms: 15, electrode_force_n: 30.0, weld_profile_used: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { wr_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records/${wr_id}/certify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares"
              payload: { firmware_version: "1.0.0", binary_sha256: "66b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1", supports_soc_hysteresis: false }
