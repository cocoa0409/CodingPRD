  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_priority_6_beats_business_temporal_priority_18_and_rejects_patch_of_approved_coe
        grounds:
          - validations[priority 6 ERR_COE_NOT_IN_DRAFT]
          - validations[priority 18 ERR_RESIDENCY_DATE_BEFORE_MOVE]
          - endpoints[PATCH /mep/coes/{coe_id}]
          - state_machines.CertificateOfEligibility.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          One PATCH call violates BOTH the state gate (priority 6, category state - the row is
          APPROVED, not DRAFT/RETURNED_FOR_CORRECTION) and the temporal gate (priority 18,
          category business_temporal - residency_date 2026-06-01 precedes move_date 2026-06-15).
          The response must be ERR_COE_NOT_IN_DRAFT / 409, never ERR_RESIDENCY_DATE_BEFORE_MOVE /
          422, proving the ladder is walked in priority order rather than field-validation-first.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea, one ACTIVE BASIC Recruiter"
