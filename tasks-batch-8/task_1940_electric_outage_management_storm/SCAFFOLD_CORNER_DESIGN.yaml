              as: Dispatcher
              captures: { cr_a: $.data.id }
            - call: "POST /om/damage-assessments"
              payload: { outage_id: "${ot}", damage_class: "MINOR", estimated_repair_minutes: 10, requires_switching: false }
              as: FieldCrewLead
              as_user_id: "${cr_a}"
              captures: { da: $.data.id }
            - { call: "POST /om/damage-assessments/${da}/submit", payload: {}, as: FieldCrewLead, as_user_id: "${cr_a}" }
          trigger:
            - { call: "POST /om/damage-assessments/${da}/accept", payload: { expected_outage_version: "${ot_v} - 1" }, as: Dispatcher, captures: { err: $.data.error_id } }
            - { call: "POST /om/damage-assessments/${da}/accept", payload: { expected_outage_version: "${ot_v}" }, as: Dispatcher, captures: { st: $.data.assessment_status } }
          assert:
            - "Stale: ${err} == ERR_STALE_OUTAGE_VERSION (http 412) for version ${ot_v} - 1"
            - "Exact: ${st} == ACCEPTED for the observed current version ${ot_v}"

      - name: clock_sweep_recomputes_outage_priority_score
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.outage_priority_score
          - state_machines.PriorityCustomer.CERTIFIED_to_SUSPENDED
        distinguishing_aspect: "Derived field reconciliation across entities: after the clock sweep suspends the only LIFE_SUPPORT customer, the outage's priority_score drops the 10000 bonus while gaining age and missed-ETR terms — 10010 before, 4410 after."
        test_recipe:
          setup: ["Feeder with CERTIFIED LIFE_SUPPORT customer (through 2026-08-12T00:00:00Z); outage confirmed {10, EQUIPMENT} at 2026-08-10T00:00:00Z (provisional ETR 02:20Z)"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm CC3", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 2000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/priority-customers"
              payload: { account_ref: "A-1", priority_class: "LIFE_SUPPORT", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { pc: $.data.id }
            - { call: "POST /om/priority-customers/${pc}/certify", payload: { certified_through: "2026-08-12T00:00:00Z" }, as: Dispatcher }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot: $.data.id }
            - { call: "POST /om/outages/${ot}/confirm", payload: { customers_affected: 10, cause_code: "EQUIPMENT" }, as: Dispatcher }
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:05:00Z" }, as: EmergencyDirector }
            - { call: "GET /om/outages/${ot}", payload: {}, as: Dispatcher, captures: { s_pre: $.data.priority_score } }
          trigger:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:01Z" }, as: EmergencyDirector }
            - { call: "GET /om/outages/${ot}", payload: {}, as: Dispatcher, captures: { s_post: $.data.priority_score, missed: $.data.etr_missed } }
          assert:
            - "Before expiry: ${s_pre} == 10010 (10000 LIFE_SUPPORT + 0 + 10 customers + floor(5min)=0 age + 0 missed)"
            - "After the sweep suspends the customer: ${s_post} == 4410 (0 + 0 + 10 + floor(48h)*50 = 2400 + 2000 missed-ETR) and ${missed} == true (now past ETR 02:20Z on 08-10)"
            - "The score changed without any direct write to the outage — pure derived-field reconciliation"

