              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
            - call: "POST /advancement/prospects/${p_id}/assessments"
              payload: { assessed_capacity_cents: 30000000, engagement_score: 80, philanthropy_score: 70, recency_score: 60, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a_id: $.data.id }
            - call: "POST /advancement/assessments/${a_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${p_id}", expected_fundraiser_version: "${f_ver}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/prospects/${p_id}/moves"
              payload: { target_stage: "CULTIVATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "GET /advancement/prospects/${p_id}"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { p_ver: $.data.version }
            - call: "POST /advancement/proposals"
              payload: { prospect_id: "${p_id}", proposal_type: "OUTRIGHT", ask_amount_cents: 1000000, designation_purpose: "Programs", expected_prospect_version: "${p_ver}" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { prop_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "PATCH /advancement/proposals/${prop_id}"
              payload: { designation_purpose: "Programs v2" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { v1: $.data.version }
            - call: "PATCH /advancement/proposals/${prop_id}"
              payload: { ask_amount_cents: 1500000 }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { v2: $.data.version }
          assert:
            - "v0 == 1 and v1 == 2 and v2 == 3  # exactly +1 per mutation"
            - "updated_at refreshes on each PATCH"

      - name: derived_field_reconciles_immediately_after_payment
        claim_type: derived_field_reconciliation
        grounds: [entities.Prospect.fields.lifetime_given_cents, entities.Prospect.fields.recognition_society_id]
        distinguishing_aspect: "The prospect's lifetime_given_cents and recognition_society_id reflect a new payment in the very next read — no lag under the immediate consistency model."
        test_recipe:
          setup: ["BRONZE society at 100000; one prospect"]
          setup_api_calls:
            - call: "POST /advancement/recognition-societies"
              payload: { name: "Bronze Circle", level: "BRONZE", threshold_cash_cents: 100000 }
              as: DonorRelationsOfficer
              as_user_id: "dro-1"
              captures: { soc_id: $.data.id }
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /advancement/gift-payments"
              payload: { donor_prospect_id: "${p_id}", amount_cents: 250000, received_at: "2026-08-10T00:00:00Z", payment_method: "CARD" }
              as: FinanceSteward
              as_user_id: "fin-1"
            - call: "GET /advancement/prospects/${p_id}"
              payload: {}
              as: FinanceSteward
              as_user_id: "fin-1"
              captures: { lifetime: $.data.lifetime_given_cents, soc: $.data.recognition_society_id }
          assert:
            - "lifetime == 250000  # recomputed synchronously inside the payment write"
            - "soc == ${soc_id}  # 250000 >= 100000 crosses BRONZE immediately"

