      - name: cross_role_writes_are_forbidden_on_every_exclusive_operation
        claim_type: forbidden_operations
        grounds:
          - roles
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
          - complexity_profile.role_model
        distinguishing_aspect: "The peer role model admits no override: eight exclusive writes are each attempted by a role that is plausible in the domain but not the declared owner, and all eight return 403 — even when the path id does not exist, because priority 2 precedes priority 5."
