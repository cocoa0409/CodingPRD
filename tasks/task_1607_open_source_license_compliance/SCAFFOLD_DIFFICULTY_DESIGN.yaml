scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: obligation_determination_saas_vs_onpremise_agpl
        grounds:
          - calculations.obligation_determination
          - entities.Product.fields.distribution_model
          - entities.BomEntry.fields.obligation_determination
        distinguishing_aspect: |
          Same AGPL-3.0 component produces different obligation_determination based on
          Product.distribution_model — SaaS triggers FULL_SOURCE_DISCLOSURE while
          ON_PREMISE triggers SOURCE_DISCLOSURE. Tests dual-variant calculation on
          the BomEntry entity domain.
        test_recipe:
          setup:
            - "Product A with distribution_model=SaaS exists"
            - "Product B with distribution_model=ON_PREMISE exists"
            - "Component with declared_license_spdx=AGPL-3.0 exists"
            - "Both products have completed scans with BOMs containing the AGPL component"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "SAAS-PROD"
                product_name: "SaaS Product"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_saas_id: "$.data.id"
                prod_saas_v: "$.data.version"
            - call: "POST /oss-products"
              payload:
                product_code: "ONPREM-PROD"
                product_name: "OnPrem Product"
                distribution_model: "ON_PREMISE"
              as: ComplianceAnalyst
              captures:
                prod_onprem_id: "$.data.id"
                prod_onprem_v: "$.data.version"
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/agpl-lib@1.0.0"
                component_name: "agpl-lib"
                version: "1.0.0"
                declared_license_spdx: "AGPL-3.0"
              as: ComplianceAnalyst
              captures:
                comp_agpl_id: "$.data.id"
            - call: "POST /oss-products/${prod_saas_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_saas_v}"
              as: ComplianceAnalyst
              captures:
                scan_saas_id: "$.data.id"
            - call: "POST /oss-products/${prod_onprem_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_onprem_v}"
              as: ComplianceAnalyst
              captures:
                scan_onprem_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_saas_id}"
              as: PlatformAdmin
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_onprem_id}"
              as: PlatformAdmin
          trigger:
            - call: "GET /oss-products/${prod_saas_id}/boms"
              as: ComplianceAnalyst
              captures:
                bom_saas_id: "$.data[0].id"
            - call: "GET /oss-products/${prod_onprem_id}/boms"
              as: ComplianceAnalyst
              captures:
                bom_onprem_id: "$.data[0].id"
            - call: "GET /oss-products/${prod_saas_id}/boms/${bom_saas_id}/entries"
              as: ComplianceAnalyst
              captures:
                entry_saas: "$.data[0]"
            - call: "GET /oss-products/${prod_onprem_id}/boms/${bom_onprem_id}/entries"
              as: ComplianceAnalyst
              captures:
                entry_onprem: "$.data[0]"
          assert:
            - "entry_saas.obligation_determination == FULL_SOURCE_DISCLOSURE"
            - "entry_onprem.obligation_determination == SOURCE_DISCLOSURE"
            - "entry_saas.obligation_determination != entry_onprem.obligation_determination"

      - name: release_gate_strict_mode_embedded_vs_saas
        grounds:
          - calculations.release_gate_evaluation
          - entities.Product.fields.distribution_model
          - entities.ReleaseGate.fields.evaluation_result
        distinguishing_aspect: |
          Same BOM with 2 warning findings produces CONDITIONAL_PASS for SaaS product but FAIL for
          EMBEDDED product (strict_mode variant with MAX_WARNINGS_FOR_CONDITIONAL=0).
          Tests dual-variant calculation on the ReleaseGate entity domain.
        test_recipe:
          setup:
            - "Product SaaS with distribution_model=SaaS, BOM finalized with 2 HIGH vulnerabilities (warnings)"
            - "Product Embedded with distribution_model=EMBEDDED, identical BOM with 2 HIGH vulnerabilities"
            - "Both products have notice_file_generated=true"
            - "Both products have all obligations fulfilled"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "SAAS-GATE"
                product_name: "SaaS Gate"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_saas_gate_id: "$.data.id"
                prod_saas_gate_v: "$.data.version"
            - call: "POST /oss-products"
              payload:
                product_code: "EMBED-GATE"
                product_name: "Embedded Gate"
                distribution_model: "EMBEDDED"
              as: ComplianceAnalyst
              captures:
                prod_embed_id: "$.data.id"
                prod_embed_v: "$.data.version"
            - call: "POST /oss-products/${prod_saas_gate_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_saas_gate_v}"
              as: ComplianceAnalyst
              captures:
                scan_sg_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_sg_id}"
              as: PlatformAdmin
            - call: "POST /oss-products/${prod_embed_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_embed_v}"
              as: ComplianceAnalyst
              captures:
                scan_eg_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_eg_id}"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_saas_gate_id}/boms"
              as: ComplianceAnalyst
              captures:
                bom_sg_id: "$.data[0].id"
                bom_sg_v: "$.data[0].version"
            - call: "GET /oss-products/${prod_embed_id}/boms"
              as: ComplianceAnalyst
              captures:
                bom_eg_id: "$.data[0].id"
                bom_eg_v: "$.data[0].version"
            - call: "POST /oss-products/${prod_saas_gate_id}/boms/${bom_sg_id}/generate-notice"
              as: ComplianceAnalyst
            - call: "POST /oss-products/${prod_embed_id}/boms/${bom_eg_id}/generate-notice"
              as: ComplianceAnalyst
            - call: "POST /oss-products/${prod_saas_gate_id}/release-gates"
              payload:
                bom_id: "${bom_sg_id}"
                release_version: "1.0.0"
              as: ReleaseManager
              captures:
                gate_sg_id: "$.data.id"
            - call: "POST /oss-products/${prod_embed_id}/release-gates"
              payload:
                bom_id: "${bom_eg_id}"
                release_version: "1.0.0"
              as: ReleaseManager
              captures:
                gate_eg_id: "$.data.id"
          trigger:
            - call: "POST /oss-products/${prod_saas_gate_id}/release-gates/${gate_sg_id}/evaluate"
              payload:
                expected_bom_version: "${bom_sg_v}"
              as: ReleaseManager
            - call: "POST /oss-products/${prod_embed_id}/release-gates/${gate_eg_id}/evaluate"
              payload:
                expected_bom_version: "${bom_eg_v}"
              as: ReleaseManager
          assert:
            - "ReleaseGate.${gate_sg_id}.evaluation_result == CONDITIONAL_PASS"
            - "ReleaseGate.${gate_eg_id}.evaluation_result == FAIL"
            - "ReleaseGate.${gate_sg_id}.evaluation_result != ReleaseGate.${gate_eg_id}.evaluation_result"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: obligation_determination_multi_input
        grounds:
          - calculations.obligation_determination
          - entities.BomEntry.fields.dependency_scope
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs (effective_classification, distribution_model,
          dependency_scope) and non-linear interaction (TEST scope short-circuits to NONE
          regardless of other inputs; SaaS+AGPL upgrades to FULL_SOURCE_DISCLOSURE).
        test_recipe:
          setup:
            - "Product with distribution_model=MOBILE_APP"
            - "Component with STRONG_COPYLEFT license (GPL-3.0)"
            - "BomEntry with dependency_scope=RUNTIME and another with dependency_scope=TEST"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "MOBILE-APP"
                product_name: "Mobile App"
                distribution_model: "MOBILE_APP"
              as: ComplianceAnalyst
              captures:
                prod_mobile_id: "$.data.id"
                prod_mobile_v: "$.data.version"
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/gpl-lib@2.0.0"
                component_name: "gpl-lib"
                version: "2.0.0"
                declared_license_spdx: "GPL-3.0"
              as: ComplianceAnalyst
              captures:
                comp_gpl_id: "$.data.id"
            - call: "POST /oss-products/${prod_mobile_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_mobile_v}"
              as: ComplianceAnalyst
              captures:
                scan_mobile_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_mobile_id}"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_mobile_id}/boms"
              as: ComplianceAnalyst
              captures:
                bom_mobile_id: "$.data[0].id"
          trigger:
            - call: "GET /oss-products/${prod_mobile_id}/boms/${bom_mobile_id}/entries"
              as: ComplianceAnalyst
          assert:
            - "BomEntry with dependency_scope=RUNTIME has obligation_determination == FULL_SOURCE_DISCLOSURE"
            - "BomEntry with dependency_scope=TEST has obligation_determination == NONE"
            - "Same component, different scope → different obligation (short-circuit evaluation)"

      - name: remediation_sla_circular_dependency
        grounds:
          - calculations.remediation_sla_deadline
          - entities.VulnerabilityFinding.fields.remediation_deadline
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency: deadline depends on Product.compliance_posture,
          but posture depends on whether findings are past deadline. Evaluation order must be
          pinned: compute deadline first from severity, then apply license_change_flag cap,
          then apply posture-based cap using CURRENT posture (not derived).
        test_recipe:
          setup:
            - "Product initially COMPLIANT"
            - "CRITICAL vulnerability detected at T0"
            - "At T0+2 days, Product becomes BLOCKED (from another finding)"
            - "At T0+3 days, the CRITICAL finding is confirmed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload:
                to_iso8601: "2026-08-01T00:00:00Z"
              as: PlatformAdmin
            - call: "POST /oss-products"
              payload:
                product_code: "SLA-TEST"
                product_name: "SLA Test"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_sla_id: "$.data.id"
                prod_sla_v: "$.data.version"
            - call: "POST /oss-vulnerabilities"
              payload:
                cve_id: "CVE-2024-0001"
                severity: "CRITICAL"
                cvss_score: 9.8
                published_at: "2026-08-01T00:00:00Z"
                affected_package_url: "pkg:npm/test-lib@1.0.0"
              as: SecurityAnalyst
              captures:
                vuln_crit_id: "$.data.id"
            - call: "POST /oss-products/${prod_sla_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_sla_v}"
              as: ComplianceAnalyst
              captures:
                scan_sla_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_sla_id}"
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload:
                to_iso8601: "2026-08-03T00:00:00Z"
              as: PlatformAdmin
            - call: "POST /_vulnerability-feed/simulate"
              payload:
                cve_id: "CVE-2024-0002"
                severity: "CRITICAL"
                cvss_score: 10.0
                published_at: "2026-08-03T00:00:00Z"
                affected_package_url: "pkg:npm/other-lib@2.0.0"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_sla_id}/vulnerability-findings"
              as: SecurityAnalyst
              captures:
                finding_crit_id: "$.data[0].id"
          trigger:
            - call: "POST /oss-products/${prod_sla_id}/vulnerability-findings/${finding_crit_id}/confirm"
              as: SecurityAnalyst
          assert:
            - "VulnerabilityFinding.${finding_crit_id}.remediation_deadline == '2026-08-06T00:00:00Z'"
            - "Deadline uses CRITICAL_SLA_DAYS=7 from detection, capped by BLOCKED_PRODUCT_SLA_DAYS=3 from now"
            - "min(2026-08-01+7d, 2026-08-03+3d) = min(2026-08-08, 2026-08-06) = 2026-08-06"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: license_approval_cyclic_withdraw_resubmit
        grounds:
          - state_machines.LicenseApprovalRequest
          - entities.LicenseApprovalRequest.fields.status
        distinguishing_aspect: |
          LicenseApprovalRequest exhibits cyclic shape: PENDING → LEGAL_REVIEW → WITHDRAWN,
          then new request can be created for same component (cycle through WITHDRAWN).
          Different from linear approval chains.
        test_recipe:
          setup:
            - "Product exists with RESTRICTED component in BOM"
            - "LicenseApprovalRequest created for the component"
            - "Request withdrawn at LEGAL_REVIEW stage"
            - "New request created for same component"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "CYCLE-TEST"
                product_name: "Cycle Test"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_cycle_id: "$.data.id"
                prod_cycle_v: "$.data.version"
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/restricted-lib@1.0.0"
                component_name: "restricted-lib"
                version: "1.0.0"
                declared_license_spdx: "CC-BY-NC-4.0"
              as: ComplianceAnalyst
              captures:
                comp_restricted_id: "$.data.id"
            - call: "POST /oss-products/${prod_cycle_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_cycle_v}"
              as: ComplianceAnalyst
              captures:
                scan_cycle_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_cycle_id}"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_cycle_id}/license-approvals"
              as: ComplianceAnalyst
              captures:
                approval_1_id: "$.data[0].id"
            - call: "POST /oss-products/${prod_cycle_id}/license-approvals/${approval_1_id}/assign-legal"
              as: LegalCounsel
            - call: "POST /oss-products/${prod_cycle_id}/license-approvals/${approval_1_id}/withdraw"
              as: ComplianceAnalyst
          trigger:
            - call: "POST /oss-products/${prod_cycle_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_cycle_v}"
              as: ComplianceAnalyst
              captures:
                scan_cycle_2_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_cycle_2_id}"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_cycle_id}/license-approvals"
              as: ComplianceAnalyst
          assert:
            - "First LicenseApprovalRequest status == WITHDRAWN"
            - "Second LicenseApprovalRequest created for same component"
            - "Second request status == PENDING"
            - "Cycle: PENDING → LEGAL_REVIEW → WITHDRAWN → (new) PENDING"

      - name: vulnerability_finding_branching_mitigate_vs_direct
        grounds:
          - state_machines.VulnerabilityFinding
          - entities.VulnerabilityFinding.fields.status
        distinguishing_aspect: |
          VulnerabilityFinding exhibits branching: CONFIRMED → MITIGATED → REMEDIATED vs
          CONFIRMED → REMEDIATED directly. Both paths valid, different side-effect timing.
          Different entity from LicenseApprovalRequest.
        test_recipe:
          setup:
            - "Two identical CRITICAL findings on same product"
            - "Finding A: CONFIRMED → MITIGATED → REMEDIATED (3-step)"
            - "Finding B: CONFIRMED → REMEDIATED (2-step direct)"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "BRANCH-TEST"
                product_name: "Branch Test"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_branch_id: "$.data.id"
                prod_branch_v: "$.data.version"
            - call: "POST /oss-products/${prod_branch_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_branch_v}"
              as: ComplianceAnalyst
              captures:
                scan_branch_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_branch_id}"
              as: PlatformAdmin
            - call: "POST /oss-vulnerabilities"
              payload:
                cve_id: "CVE-2024-BRANCH-A"
                severity: "CRITICAL"
                cvss_score: 9.5
                published_at: "2026-08-01T00:00:00Z"
                affected_package_url: "pkg:npm/lib-a@1.0.0"
              as: SecurityAnalyst
              captures:
                vuln_a_id: "$.data.id"
            - call: "POST /oss-vulnerabilities"
              payload:
                cve_id: "CVE-2024-BRANCH-B"
                severity: "CRITICAL"
                cvss_score: 9.5
                published_at: "2026-08-01T00:00:00Z"
                affected_package_url: "pkg:npm/lib-b@1.0.0"
              as: SecurityAnalyst
              captures:
                vuln_b_id: "$.data.id"
            - call: "GET /oss-products/${prod_branch_id}/vulnerability-findings"
              as: SecurityAnalyst
              captures:
                finding_a_id: "$.data[0].id"
                finding_b_id: "$.data[1].id"
            - call: "POST /oss-products/${prod_branch_id}/vulnerability-findings/${finding_a_id}/confirm"
              as: SecurityAnalyst
            - call: "POST /oss-products/${prod_branch_id}/vulnerability-findings/${finding_b_id}/confirm"
              as: SecurityAnalyst
            - call: "POST /oss-products/${prod_branch_id}/vulnerability-findings/${finding_a_id}/mitigate"
              as: SecurityAnalyst
          trigger:
            - call: "POST /oss-products/${prod_branch_id}/vulnerability-findings/${finding_a_id}/verify-remediation"
              payload:
                verification_evidence_uri: "s3://evidence/finding-a-fix.zip"
              as: SecurityAnalyst
            - call: "POST /oss-products/${prod_branch_id}/vulnerability-findings/${finding_b_id}/verify-remediation"
              payload:
                verification_evidence_uri: "s3://evidence/finding-b-fix.zip"
              as: SecurityAnalyst
          assert:
            - "Finding A path: OPEN → CONFIRMED → MITIGATED → REMEDIATED (4 states)"
            - "Finding B path: OPEN → CONFIRMED → REMEDIATED (3 states)"
            - "Both reach REMEDIATED but through different intermediate states"
            - "Both decrement Product.high_severity_vulnerability_count"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: scan_completion_cascade_depth_3
        grounds:
          - state_machines.DependencyScan.SCORING_to_COMPLETED
          - state_machines.BillOfMaterials.DRAFT_to_FINALIZED
          - state_machines.Product.COMPLIANT_to_BLOCKED
        distinguishing_aspect: |
          Depth-3 cascade: DependencyScan completes → BillOfMaterials finalized →
          Product posture escalates to BLOCKED (if PROHIBITED component found).
          Trigger: POST /_scan-worker/process-next.
        test_recipe:
          setup:
            - "Product in COMPLIANT posture"
            - "Scan created with manifest containing PROHIBITED component (WTFPL)"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "CASCADE-3"
                product_name: "Cascade Depth 3"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_cascade_id: "$.data.id"
                prod_cascade_v: "$.data.version"
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/wtfpl-lib@1.0.0"
                component_name: "wtfpl-lib"
                version: "1.0.0"
                declared_license_spdx: "WTFPL"
              as: ComplianceAnalyst
            - call: "POST /oss-products/${prod_cascade_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_cascade_v}"
              as: ComplianceAnalyst
              captures:
                scan_cascade_id: "$.data.id"
          trigger:
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_cascade_id}"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_cascade_id}"
              as: ComplianceAnalyst
            - call: "GET /oss-products/${prod_cascade_id}/boms"
              as: ComplianceAnalyst
          assert:
            - "DependencyScan.status == COMPLETED"
            - "BillOfMaterials.status == FINALIZED"
            - "BillOfMaterials.bom_posture == RED"
            - "Product.compliance_posture == BLOCKED"
            - "Cascade depth: Scan → BOM → Product (3 levels)"

      - name: license_override_cascade_depth_2
        grounds:
          - "endpoints[POST /oss-components/{componentId}/override-classification].side_effects"
          - state_machines.BillOfMaterials
        distinguishing_aspect: |
          Depth-2 cascade: Component override → BomEntry obligation_determination recomputed →
          BillOfMaterials bom_posture recomputed. Trigger: POST /oss-components/{id}/override-classification.
          Different trigger from scan completion.
        test_recipe:
          setup:
            - "Product with FINALIZED BOM containing PERMISSIVE component"
            - "BOM posture is GREEN"
            - "LegalCounsel overrides component to STRONG_COPYLEFT"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "CASCADE-2"
                product_name: "Cascade Depth 2"
                distribution_model: "ON_PREMISE"
              as: ComplianceAnalyst
              captures:
                prod_cascade2_id: "$.data.id"
                prod_cascade2_v: "$.data.version"
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/mit-lib@1.0.0"
                component_name: "mit-lib"
                version: "1.0.0"
                declared_license_spdx: "MIT"
              as: ComplianceAnalyst
              captures:
                comp_mit_id: "$.data.id"
            - call: "POST /oss-products/${prod_cascade2_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_cascade2_v}"
              as: ComplianceAnalyst
              captures:
                scan_cascade2_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_cascade2_id}"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_cascade2_id}/boms"
              as: ComplianceAnalyst
              captures:
                bom_cascade2_id: "$.data[0].id"
          trigger:
            - call: "POST /oss-components/${comp_mit_id}/override-classification"
              payload:
                policy_override_classification: "STRONG_COPYLEFT"
                rationale: "Discovered additional GPL-licensed code in repository"
              as: LegalCounsel
            - call: "GET /oss-products/${prod_cascade2_id}/boms/${bom_cascade2_id}"
              as: ComplianceAnalyst
            - call: "GET /oss-products/${prod_cascade2_id}/boms/${bom_cascade2_id}/entries"
              as: ComplianceAnalyst
          assert:
            - "Component.effective_classification == STRONG_COPYLEFT"
            - "BomEntry.obligation_determination recomputed to SOURCE_DISCLOSURE"
            - "BillOfMaterials.bom_posture recomputed (may change from GREEN to YELLOW)"
            - "Cascade depth: Component → BomEntry → BOM (2 levels)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_conflict
        grounds:
          - "validations[priority=4]"
          - "validations[priority=6]"
        distinguishing_aspect: |
          Error-category pair: state (ERR_PRODUCT_BLOCKED, priority 4) vs
          business_safety (ERR_PROHIBITED_COMPONENT, priority 6).
          When Product is BLOCKED AND scan contains PROHIBITED component,
          ERR_PRODUCT_BLOCKED wins (priority 4 < 6).
        test_recipe:
          setup:
            - "Product in BLOCKED posture"
            - "Scan manifest contains PROHIBITED component"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "PRIO-1"
                product_name: "Priority Test 1"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_prio_id: "$.data.id"
                prod_prio_v: "$.data.version"
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/wtfpl-lib@1.0.0"
                component_name: "wtfpl-lib"
                version: "1.0.0"
                declared_license_spdx: "WTFPL"
              as: ComplianceAnalyst
            - call: "POST /oss-products/${prod_prio_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_prio_v}"
              as: ComplianceAnalyst
              captures:
                scan_prio_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_prio_id}"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_prio_id}"
              as: ComplianceAnalyst
              captures:
                prod_prio_v2: "$.data.version"
          trigger:
            - call: "POST /oss-products/${prod_prio_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_prio_v2}"
              as: ComplianceAnalyst
              captures:
                error_response: "$.data"
          assert:
            - "error_response.error_id == ERR_PRODUCT_BLOCKED"
            - "error_response.error_id != ERR_PROHIBITED_COMPONENT"
            - "State check (priority 4) fires before business_safety (priority 6)"

      - name: business_referential_vs_business_temporal_conflict
        grounds:
          - "validations[priority=8]"
          - "validations[priority=9]"
        distinguishing_aspect: |
          Error-category pair: business_referential (ERR_INCOMPATIBLE_LICENSE, priority 8) vs
          business_temporal (ERR_APPROVAL_EXPIRED, priority 9).
          When RemediationPlan has incompatible target AND approval expired,
          ERR_INCOMPATIBLE_LICENSE wins (priority 8 < 9).
        test_recipe:
          setup:
            - "Product with CONFIRMED CRITICAL finding"
            - "LicenseApprovalRequest expired (expiry_at < now)"
            - "RemediationPlan targets component with PROHIBITED license"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "PRIO-2"
                product_name: "Priority Test 2"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_prio2_id: "$.data.id"
                prod_prio2_v: "$.data.version"
            - call: "POST /oss-products/${prod_prio2_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_prio2_v}"
              as: ComplianceAnalyst
              captures:
                scan_prio2_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_prio2_id}"
              as: PlatformAdmin
            - call: "POST /oss-vulnerabilities"
              payload:
                cve_id: "CVE-2024-PRIO2"
                severity: "CRITICAL"
                cvss_score: 9.0
                published_at: "2026-08-01T00:00:00Z"
                affected_package_url: "pkg:npm/vuln-lib@1.0.0"
              as: SecurityAnalyst
            - call: "GET /oss-products/${prod_prio2_id}/vulnerability-findings"
              as: SecurityAnalyst
              captures:
                finding_prio2_id: "$.data[0].id"
            - call: "POST /oss-products/${prod_prio2_id}/vulnerability-findings/${finding_prio2_id}/confirm"
              as: SecurityAnalyst
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/bad-target@1.0.0"
                component_name: "bad-target"
                version: "1.0.0"
                declared_license_spdx: "WTFPL"
              as: ComplianceAnalyst
              captures:
                comp_bad_id: "$.data.id"
            - call: "POST /_clock/set_current_utc"
              payload:
                to_iso8601: "2026-12-01T00:00:00Z"
              as: PlatformAdmin
          trigger:
            - call: "POST /oss-products/${prod_prio2_id}/remediation-plans"
              payload:
                finding_id: "${finding_prio2_id}"
                plan_type: "REPLACE"
                target_component_id: "${comp_bad_id}"
                migration_effort_days: 5
              as: EngineeringManager
              captures:
                error_response: "$.data"
          assert:
            - "error_response.error_id == ERR_INCOMPATIBLE_LICENSE"
            - "error_response.error_id != ERR_APPROVAL_EXPIRED"
            - "business_referential (priority 8) fires before business_temporal (priority 9)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: warning_findings_threshold_exactly_3_vs_4
        grounds:
          - calculations.release_gate_evaluation
          - entities.ReleaseGate.fields.warning_findings_count
        distinguishing_aspect: |
          Metric: warning_findings_count. Boundary: MAX_WARNINGS_FOR_CONDITIONAL = 3.
          Exactly 3 warnings → CONDITIONAL_PASS; 4 warnings → FAIL.
          Endpoint: POST /oss-products/{id}/release-gates/{id}/evaluate.
        test_recipe:
          setup:
            - "Product with BOM finalized, notice generated, all obligations fulfilled"
            - "Exactly 3 HIGH vulnerabilities (warnings) in one scenario"
            - "Exactly 4 HIGH vulnerabilities in another scenario"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "BOUNDARY-3"
                product_name: "Boundary 3"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_b3_id: "$.data.id"
                prod_b3_v: "$.data.version"
            - call: "POST /oss-products"
              payload:
                product_code: "BOUNDARY-4"
                product_name: "Boundary 4"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_b4_id: "$.data.id"
                prod_b4_v: "$.data.version"
            - call: "POST /oss-products/${prod_b3_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_b3_v}"
              as: ComplianceAnalyst
              captures:
                scan_b3_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_b3_id}"
              as: PlatformAdmin
            - call: "POST /oss-products/${prod_b4_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_b4_v}"
              as: ComplianceAnalyst
              captures:
                scan_b4_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_b4_id}"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_b3_id}/boms"
              as: ComplianceAnalyst
              captures:
                bom_b3_id: "$.data[0].id"
                bom_b3_v: "$.data[0].version"
            - call: "GET /oss-products/${prod_b4_id}/boms"
              as: ComplianceAnalyst
              captures:
                bom_b4_id: "$.data[0].id"
                bom_b4_v: "$.data[0].version"
            - call: "POST /oss-products/${prod_b3_id}/boms/${bom_b3_id}/generate-notice"
              as: ComplianceAnalyst
            - call: "POST /oss-products/${prod_b4_id}/boms/${bom_b4_id}/generate-notice"
              as: ComplianceAnalyst
            - call: "POST /oss-products/${prod_b3_id}/release-gates"
              payload:
                bom_id: "${bom_b3_id}"
                release_version: "1.0.0"
              as: ReleaseManager
              captures:
                gate_b3_id: "$.data.id"
            - call: "POST /oss-products/${prod_b4_id}/release-gates"
              payload:
                bom_id: "${bom_b4_id}"
                release_version: "1.0.0"
              as: ReleaseManager
              captures:
                gate_b4_id: "$.data.id"
          trigger:
            - call: "POST /oss-products/${prod_b3_id}/release-gates/${gate_b3_id}/evaluate"
              payload:
                expected_bom_version: "${bom_b3_v}"
              as: ReleaseManager
            - call: "POST /oss-products/${prod_b4_id}/release-gates/${gate_b4_id}/evaluate"
              payload:
                expected_bom_version: "${bom_b4_v}"
              as: ReleaseManager
          assert:
            - "ReleaseGate.${gate_b3_id}.warning_findings_count == 3"
            - "ReleaseGate.${gate_b3_id}.evaluation_result == CONDITIONAL_PASS"
            - "ReleaseGate.${gate_b4_id}.warning_findings_count == 4"
            - "ReleaseGate.${gate_b4_id}.evaluation_result == FAIL"
            - "Boundary: 3 == CONDITIONAL_PASS, 4 == FAIL (>3, not >=3)"

      - name: obligations_fulfilled_pct_exactly_100_vs_99_99
        grounds:
          - calculations.release_gate_evaluation
          - entities.ReleaseGate.fields.obligations_fulfilled_pct
        distinguishing_aspect: |
          Metric: obligations_fulfilled_pct. Boundary: 100.0%.
          100.00% → PASS eligible; 99.99% → FAIL.
          Different metric from warning_findings_count; different endpoint path detail.
        test_recipe:
          setup:
            - "Product A: BOM with 100 obligation tickets, all 100 fulfilled (100.00%)"
            - "Product B: BOM with 100 obligation tickets, 99 fulfilled (99.00%)"
            - "No blocking or warning findings"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "PCT-100"
                product_name: "Percent 100"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
