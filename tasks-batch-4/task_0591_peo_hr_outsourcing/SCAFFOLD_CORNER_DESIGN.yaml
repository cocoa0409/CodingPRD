scaffold_corner_design:
  - section: entities
    instances:
      - name: create_client_applies_declared_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - entities.ClientCompany.fields.status
          - entities.ClientCompany.fields.credit_limit_cents
          - entities.ClientCompany.fields.wc_experience_mod
          - endpoints[POST /clients]
        distinguishing_aspect: "A client created with only the three required fields comes back with status PROSPECT, credit_limit_cents 5000000, wc_experience_mod 1.0, part_time_monthly_hours_total 0, service_agreement_signed false, outstanding_balance_cents 0, delinquency_strikes 0, version 1 and a server-minted UUID id with no type prefix."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Alpha Only", fein: "20-0000001", state_code: "CA" }
              as: PeoAdmin
              captures: { c_id: $.data.id, c_version: $.data.version }
          trigger:
            - call: "GET /clients/${c_id}"
              payload: {}
              as: PeoAdmin
          assert:
            - "HTTP 201 on create; response_type == 'object' and meta.api_request_id is present"
            - "ClientCompany.${c_id}.status == PROSPECT"
            - "ClientCompany.${c_id}.credit_limit_cents == 5000000 and wc_experience_mod == 1.0"
            - "ClientCompany.${c_id}.part_time_monthly_hours_total == 0 and service_agreement_signed == false"
            - "ClientCompany.${c_id}.outstanding_balance_cents == 0, delinquency_strikes == 0, active_employee_count == 0, fte_count == 0, is_ale == false"
            - "ClientCompany.${c_id}.version == 1 and id is a bare UUID (no 'cli_' prefix)"

      - name: get_client_with_unknown_id_returns_client_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_CLIENT_NOT_FOUND]
          - endpoints[GET /clients/{id}]
        distinguishing_aspect: "A syntactically valid but unknown UUID on GET /clients/{id} returns HTTP 404 with error_id ERR_CLIENT_NOT_FOUND and an error-shaped envelope."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Beta Only", fein: "20-0000002", state_code: "CA" }
              as: PeoAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PeoAdmin
          assert:
            - "HTTP 404 with data.error_id == 'ERR_CLIENT_NOT_FOUND' and response_type == 'error'"
            - "The existing client ${c_id} is unaffected"

      - name: create_worksite_employee_missing_required_salary_rejected
        claim_type: required_fields
        grounds:
          - entities.WorksiteEmployee.fields.annual_salary_cents
          - validations[priority=20]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting annual_salary_cents (source: input, no default) on POST /clients/{id}/worksite-employees returns HTTP 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup:
            - "One ACTIVE client and one WC class code."
          setup_api_calls:
            - call: "POST /wc-policies"
              payload: { master_policy_number: "WCM-C-001", carrier_name: "Granite Mutual", policy_year: 2026, master_ein: "98-7654321" }
              as: PeoAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /wc-policies/${policy_id}/class-codes"
              payload: { class_code: "8810", description: "Clerical office", base_rate_per_100_cents: 250 }
              as: PeoAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Gamma Co", fein: "20-0000003", state_code: "CA", service_agreement_signed: true }
              as: PeoAdmin
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/activate"
              payload: {}
              as: PeoAdmin
          trigger:
            - call: "POST /clients/${c_id}/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "No", last_name: "Salary", ssn_last4: "0001", birth_year: 1990, hire_date: "2026-05-01" }
              as: ClientAdmin
              as_user_id: "${c_id}"
          assert:
            - "HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /worksite-employees?client_id=${c_id} returns total_count == 0"

      - name: invalid_enum_employment_type_rejected
        claim_type: type_constraints
        grounds:
          - entities.WorksiteEmployee.fields.employment_type
          - validations[priority=20]
        distinguishing_aspect: "employment_type 'CONTRACTOR' is not a declared enum member (FULL_TIME | PART_TIME) and is rejected with HTTP 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One ACTIVE client and one WC class code."
          setup_api_calls:
            - call: "POST /wc-policies"
              payload: { master_policy_number: "WCM-C-002", carrier_name: "Granite Mutual", policy_year: 2026, master_ein: "98-7654321" }
              as: PeoAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /wc-policies/${policy_id}/class-codes"
              payload: { class_code: "8810", description: "Clerical office", base_rate_per_100_cents: 250 }
              as: PeoAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Delta Co", fein: "20-0000004", state_code: "CA", service_agreement_signed: true }
              as: PeoAdmin
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/activate"
              payload: {}
              as: PeoAdmin
          trigger:
            - call: "POST /clients/${c_id}/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "Bad", last_name: "Enum", ssn_last4: "0002", birth_year: 1990, hire_date: "2026-05-01", annual_salary_cents: 2400120, employment_type: "CONTRACTOR" }
              as: ClientAdmin
              as_user_id: "${c_id}"
          assert:
            - "HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST'"

      - name: worksite_employee_computed_fields_start_at_declared_zero_values
        claim_type: computed_fields
        grounds:
          - entities.WorksiteEmployee.fields.benefits_eligible
          - entities.WorksiteEmployee.fields.ytd_taxable_wages_cents
          - entities.WorksiteEmployee.fields.status
        distinguishing_aspect: "A freshly hired employee has status PENDING_ONBOARDING, benefits_eligible false (not ACTIVE yet, even though hire_date is in the past), and all three ytd_* accumulators at 0 — none of them accept client input."
        test_recipe:
          setup:
            - "One ACTIVE client and one WC class code; logical clock at its default 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /wc-policies"
              payload: { master_policy_number: "WCM-C-003", carrier_name: "Granite Mutual", policy_year: 2026, master_ein: "98-7654321" }
              as: PeoAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /wc-policies/${policy_id}/class-codes"
              payload: { class_code: "8810", description: "Clerical office", base_rate_per_100_cents: 250 }
              as: PeoAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Epsilon Co", fein: "20-0000005", state_code: "CA", service_agreement_signed: true }
              as: PeoAdmin
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/activate"
              payload: {}
              as: PeoAdmin
          trigger:
            - call: "POST /clients/${c_id}/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "New", last_name: "Hire", ssn_last4: "0003", birth_year: 1990, hire_date: "2026-05-01", annual_salary_cents: 2400120 }
              as: ClientAdmin
              as_user_id: "${c_id}"
              captures: { e_id: $.data.id }
          assert:
            - "WorksiteEmployee.${e_id}.status == PENDING_ONBOARDING and employment_type == FULL_TIME (declared default)"
            - "WorksiteEmployee.${e_id}.benefits_eligible == false"
            - "WorksiteEmployee.${e_id}.ytd_taxable_wages_cents == 0, ytd_ss_taxable_cents == 0, ytd_futa_taxable_cents == 0"
            - "WorksiteEmployee.${e_id}.version == 1 and termination_date == null"
            - "ClientCompany.${c_id}.active_employee_count == 0 (hiring alone does not activate)"

      - name: worksite_employee_list_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints[GET /worksite-employees]
          - entities.WorksiteEmployee.fields.client_id
        distinguishing_aspect: "GET /worksite-employees?client_id=...&limit=1&offset=0 returns response_type 'array' with exactly 1 row, total_count 2 and has_more true; offset=1 returns the second row with has_more false."
        test_recipe:
          setup:
            - "One ACTIVE client with two hired employees."
          setup_api_calls:
            - call: "POST /wc-policies"
              payload: { master_policy_number: "WCM-C-004", carrier_name: "Granite Mutual", policy_year: 2026, master_ein: "98-7654321" }
              as: PeoAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /wc-policies/${policy_id}/class-codes"
              payload: { class_code: "8810", description: "Clerical office", base_rate_per_100_cents: 250 }
              as: PeoAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Zeta Co", fein: "20-0000006", state_code: "CA", service_agreement_signed: true }
              as: PeoAdmin
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/activate"
              payload: {}
              as: PeoAdmin
            - call: "POST /clients/${c_id}/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "One", last_name: "Ap", ssn_last4: "0004", birth_year: 1990, hire_date: "2026-05-01", annual_salary_cents: 2400120 }
              as: ClientAdmin
              as_user_id: "${c_id}"
              captures: { e1: $.data.id }
            - call: "POST /clients/${c_id}/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "Two", last_name: "Bp", ssn_last4: "0005", birth_year: 1990, hire_date: "2026-05-01", annual_salary_cents: 2400120 }
              as: ClientAdmin
              as_user_id: "${c_id}"
              captures: { e2: $.data.id }
          trigger:
            - call: "GET /worksite-employees"
              payload: { client_id: "${c_id}", limit: 1, offset: 0 }
              as: PeoAdmin
            - call: "GET /worksite-employees"
              payload: { client_id: "${c_id}", limit: 1, offset: 1 }
              as: PeoAdmin
          assert:
            - "First call: response_type == 'array', 1 row returned, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "Second call: 1 row returned, total_count == 2, has_more == false"
            - "A limit of 0 or 101 returns HTTP 400 ERR_INVALID_REQUEST"

      - name: hire_under_unknown_client_returns_client_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=10]
          - errors[ERR_CLIENT_NOT_FOUND]
          - endpoints[POST /clients/{id}/worksite-employees]
        distinguishing_aspect: "The path client id is validated before the body: POSTing a worksite employee under an unknown client id returns HTTP 404 ERR_CLIENT_NOT_FOUND even though the body is well-formed."
        test_recipe:
          setup:
            - "One WC class code exists so the body FK would resolve."
          setup_api_calls:
            - call: "POST /wc-policies"
              payload: { master_policy_number: "WCM-C-005", carrier_name: "Granite Mutual", policy_year: 2026, master_ein: "98-7654321" }
              as: PeoAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /wc-policies/${policy_id}/class-codes"
              payload: { class_code: "8810", description: "Clerical office", base_rate_per_100_cents: 250 }
              as: PeoAdmin
              captures: { cc_id: $.data.id }
          trigger:
            - call: "POST /clients/00000000-0000-4000-8000-000000000001/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "Ghost", last_name: "Hire", ssn_last4: "0006", birth_year: 1990, hire_date: "2026-05-01", annual_salary_cents: 2400120 }
              as: PeoAdmin
          assert:
            - "HTTP 404 with data.error_id == 'ERR_CLIENT_NOT_FOUND'"

  - section: state_machines
    instances:
      - name: activate_already_active_client_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.ClientCompany.PROSPECT_to_ACTIVE
          - validations[priority=40]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The second POST /clients/{id}/activate observes status ACTIVE (not PROSPECT) and is rejected with HTTP 409 ERR_INVALID_STATE; version does not advance a second time."
        test_recipe:
          setup:
            - "One client with service_agreement_signed true, already activated once."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Eta Co", fein: "20-0000007", state_code: "CA", service_agreement_signed: true }
              as: PeoAdmin
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/activate"
              payload: {}
              as: PeoAdmin
              captures: { v_after_first: $.data.version }
          trigger:
            - call: "POST /clients/${c_id}/activate"
              payload: {}
              as: PeoAdmin
          assert:
            - "First activate: status == ACTIVE and version == 2"
            - "Second activate: HTTP 409 with data.error_id == 'ERR_INVALID_STATE'"
            - "ClientCompany.${c_id}.version is still 2 (the rejected call mutates nothing)"

      - name: activate_client_without_signed_agreement_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ClientCompany.PROSPECT_to_ACTIVE
          - entities.ClientCompany.fields.service_agreement_signed
        distinguishing_aspect: "activate on a PROSPECT client whose service_agreement_signed is false fails the transition precondition and returns HTTP 409 ERR_INVALID_STATE; the client stays PROSPECT."
        test_recipe:
          setup:
            - "One PROSPECT client with service_agreement_signed left at its default false."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Theta Co", fein: "20-0000008", state_code: "CA" }
              as: PeoAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /clients/${c_id}/activate"
              payload: {}
              as: PeoAdmin
          assert:
            - "HTTP 409 with data.error_id == 'ERR_INVALID_STATE'"
            - "ClientCompany.${c_id}.status == PROSPECT and version == 1"

      - name: fund_a_draft_payroll_run_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.PayrollRun.UNFUNDED_to_DEBIT_PENDING
          - validations[priority=40]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The funding dimension may only leave UNFUNDED when the processing dimension is APPROVED; funding a run still in DRAFT returns HTTP 409 ERR_INVALID_STATE and leaves funding_status UNFUNDED."
        test_recipe:
          setup:
            - "ACTIVE client with one ACTIVE employee and a DRAFT payroll run (never calculated)."
          setup_api_calls:
            - call: "POST /wc-policies"
              payload: { master_policy_number: "WCM-C-006", carrier_name: "Granite Mutual", policy_year: 2026, master_ein: "98-7654321" }
              as: PeoAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /wc-policies/${policy_id}/class-codes"
              payload: { class_code: "8810", description: "Clerical office", base_rate_per_100_cents: 250 }
              as: PeoAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Iota Co", fein: "20-0000009", state_code: "CA", service_agreement_signed: true }
              as: PeoAdmin
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/activate"
              payload: {}
              as: PeoAdmin
            - call: "POST /clients/${c_id}/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "Ken", last_name: "Lok", ssn_last4: "0007", birth_year: 1990, hire_date: "2026-05-01", annual_salary_cents: 2400120 }
              as: ClientAdmin
              as_user_id: "${c_id}"
              captures: { e1: $.data.id, e1_v: $.data.version }
            - call: "POST /worksite-employees/${e1}/onboarding-packet"
              payload: { expected_employee_version: "${e1_v}", i9_completed: true, w4_completed: true, direct_deposit_completed: true }
              as: ClientAdmin
              as_user_id: "${c_id}"
              captures: { p1: $.data.id }
            - call: "POST /onboarding-packets/${p1}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${c_id}"
            - call: "POST /onboarding-packets/${p1}/review"
              payload: { decision: "APPROVE" }
              as: PeoAdmin
            - call: "POST /clients/${c_id}/payroll-runs"
              payload: { period_start: "2026-05-01", period_end: "2026-05-15", check_date: "2026-05-20" }
              as: PayrollSpecialist
              as_user_id: "ps-1"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /payroll-runs/${r1}/fund"
              payload: {}
              as: PayrollSpecialist
              as_user_id: "ps-1"
          assert:
            - "PayrollRun.${r1} was created with processing_status == DRAFT and funding_status == UNFUNDED (initial states)"
            - "HTTP 409 with data.error_id == 'ERR_INVALID_STATE'"
            - "PayrollRun.${r1}.funding_status is still UNFUNDED"

      - name: submit_an_approved_packet_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.OnboardingPacket.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "APPROVED is a terminal packet state: a further submit is refused with HTTP 409 ERR_INVALID_STATE and the employee stays ACTIVE."
        test_recipe:
          setup:
            - "ACTIVE client with one employee whose packet is APPROVED (employee ACTIVE)."
          setup_api_calls:
            - call: "POST /wc-policies"
              payload: { master_policy_number: "WCM-C-007", carrier_name: "Granite Mutual", policy_year: 2026, master_ein: "98-7654321" }
              as: PeoAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /wc-policies/${policy_id}/class-codes"
              payload: { class_code: "8810", description: "Clerical office", base_rate_per_100_cents: 250 }
              as: PeoAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Kappa Co", fein: "20-0000010", state_code: "CA", service_agreement_signed: true }
              as: PeoAdmin
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/activate"
              payload: {}
              as: PeoAdmin
            - call: "POST /clients/${c_id}/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "Mel", last_name: "Nor", ssn_last4: "0008", birth_year: 1990, hire_date: "2026-05-01", annual_salary_cents: 2400120 }
              as: ClientAdmin
              as_user_id: "${c_id}"
              captures: { e1: $.data.id, e1_v: $.data.version }
            - call: "POST /worksite-employees/${e1}/onboarding-packet"
              payload: { expected_employee_version: "${e1_v}", i9_completed: true, w4_completed: true, direct_deposit_completed: true }
              as: ClientAdmin
              as_user_id: "${c_id}"
              captures: { p1: $.data.id }
            - call: "POST /onboarding-packets/${p1}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${c_id}"
            - call: "POST /onboarding-packets/${p1}/review"
              payload: { decision: "APPROVE" }
              as: PeoAdmin
          trigger:
            - call: "POST /onboarding-packets/${p1}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${c_id}"
          assert:
            - "HTTP 409 with data.error_id == 'ERR_INVALID_STATE'"
            - "OnboardingPacket.${p1}.status == APPROVED and WorksiteEmployee.${e1}.status == ACTIVE"

      - name: fourth_packet_submission_after_three_returns_hits_revision_limit
        claim_type: precondition_enforcement
        grounds:
          - state_machines.OnboardingPacket.RETURNED_to_SUBMITTED
          - entities.OnboardingPacket.fields.revision_rounds
          - errors[ERR_PACKET_REVISION_LIMIT]
        distinguishing_aspect: "After three RETURN decisions revision_rounds == 3 == MAX_PACKET_REVISION_ROUNDS, so the next submit is refused with HTTP 422 ERR_PACKET_REVISION_LIMIT — the cycle has a termination condition."
        test_recipe:
          setup:
            - "ACTIVE client with one employee whose packet has been submitted and RETURNED three times (revision_rounds == 3, status RETURNED)."
          setup_api_calls:
            - call: "POST /wc-policies"
              payload: { master_policy_number: "WCM-C-008", carrier_name: "Granite Mutual", policy_year: 2026, master_ein: "98-7654321" }
              as: PeoAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /wc-policies/${policy_id}/class-codes"
              payload: { class_code: "8810", description: "Clerical office", base_rate_per_100_cents: 250 }
              as: PeoAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Lambda Co", fein: "20-0000011", state_code: "CA", service_agreement_signed: true }
              as: PeoAdmin
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/activate"
              payload: {}
              as: PeoAdmin
            - call: "POST /clients/${c_id}/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "Oli", last_name: "Pax", ssn_last4: "0009", birth_year: 1990, hire_date: "2026-05-01", annual_salary_cents: 2400120 }
              as: ClientAdmin
              as_user_id: "${c_id}"
              captures: { e1: $.data.id, e1_v: $.data.version }
            - call: "POST /worksite-employees/${e1}/onboarding-packet"
              payload: { expected_employee_version: "${e1_v}", i9_completed: true, w4_completed: true, direct_deposit_completed: true }
              as: ClientAdmin
              as_user_id: "${c_id}"
              captures: { p1: $.data.id }
            - call: "POST /onboarding-packets/${p1}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${c_id}"
            - call: "POST /onboarding-packets/${p1}/review"
              payload: { decision: "RETURN", reviewer_note: "round 1" }
              as: PeoAdmin
            - call: "POST /onboarding-packets/${p1}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${c_id}"
            - call: "POST /onboarding-packets/${p1}/review"
              payload: { decision: "RETURN", reviewer_note: "round 2" }
              as: PeoAdmin
            - call: "POST /onboarding-packets/${p1}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${c_id}"
            - call: "POST /onboarding-packets/${p1}/review"
              payload: { decision: "RETURN", reviewer_note: "round 3" }
              as: PeoAdmin
              captures: { rr: $.data.revision_rounds }
          trigger:
            - call: "POST /onboarding-packets/${p1}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${c_id}"
          assert:
            - "Before the trigger: OnboardingPacket.${p1}.status == RETURNED and revision_rounds == 3"
            - "HTTP 422 with data.error_id == 'ERR_PACKET_REVISION_LIMIT'"
            - "OnboardingPacket.${p1}.status is still RETURNED"

      - name: new_packet_supersedes_and_voids_the_previous_one
        claim_type: side_effect_execution
        grounds:
          - state_machines.OnboardingPacket.RETURNED_to_VOIDED
          - concurrency_rules[packet-create-stale-employee]
