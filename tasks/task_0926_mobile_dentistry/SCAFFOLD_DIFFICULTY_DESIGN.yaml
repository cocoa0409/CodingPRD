              as: DentalAssistant
              as_user_id: "${asst_id}"
              captures: { enc_id: $.data.id }
            - call: "POST /mobile-dentistry/encounters/${enc_id}/screen"
              payload: { performing_staff_id: "${hyg_id}", cavitated_lesion_count: 1, pain_reported: false, abscess_or_swelling: false, untreated_decay_present: true }
              as: FieldHygienist
              as_user_id: "${hyg_id}"
