  # ----------------------------------------------------------- release orders
  - method: POST
    path: /vpc/vehicles/{vehicleId}/allocations
    description: "Allocate a shipping-ready unit to a dealer. The server assigns the carrier via calculations.carrier_selection; the client never supplies one. Re-allocating supersedes the prior ALLOCATED order. Guarded by OCC on the vehicle (§1.2.1 allocation-create-stale-vehicle)."
    roles: [DistributionManager]
    code: 201
    input: ["dealer_id", "pickup_window_start", "pickup_window_end", "expected_vehicle_version"]
    output: ReleaseOrder
    side_effects:
      - "ReleaseOrder created in ALLOCATED with truck_carrier_id from calculations.carrier_selection, route_zone copied from dealer.route_zone, allocated_at stamped"
      - "supersede path: prior ALLOCATED order -> CANCELLED and new order's superseded_release_order_id set"
      - "truck_carrier.committed_slots / available_slots and dealer.open_allocation_count recomputed (INVARIANT S)"
      - "vehicle.processing_status -> ALLOCATED; vehicle.storage_charge_provisional_cents := calculations.vehicle_storage_charge PROVISIONAL; center.provisional_storage_accrued_cents recomputed"
      - "vehicle.version += 1"

  - method: GET
    path: /vpc/release-orders/{releaseOrderId}
    description: "Read one release order with its freight settlement breakdown."
    roles: *all_roles
    code: 200
    input: []
    output: ReleaseOrder
    side_effects: []

  - method: GET
    path: /vpc/release-orders
    description: "List release orders, filterable by unit, dealer, carrier, supersede lineage, hold-cancellation lineage and status."
    roles: *all_roles
    code: 200
    input: ["vehicle_id?", "dealer_id?", "truck_carrier_id?", "superseded_release_order_id?", "cancelled_by_hold_order_id?", "status?", "route_zone?", "limit?", "offset?"]
    output: ReleaseOrder[]
    side_effects: []

  - method: POST
    path: /vpc/release-orders/{releaseOrderId}/dispatch
    description: "Release the unit to the assigned carrier and settle freight."
    roles: [DistributionManager]
    code: 200
    input: []
    output: ReleaseOrder
    side_effects:
      - "calculations.carrier_window_capacity_conflict evaluated (ERR_CARRIER_WINDOW_CAPACITY)"
      - "status ALLOCATED -> RELEASED; dispatched_at stamped; vehicle.processing_status -> RELEASED"
      - "calculations.release_freight_settlement stamps base_linehaul_cents, fuel_surcharge_cents, zone_accessorial_cents, gross_freight_cents, freight_discount_cents and freight_total_cents"

  - method: POST
    path: /vpc/release-orders/{releaseOrderId}/gate-out
    description: "Gate the unit out of the yard and finalize storage."
    roles: [DistributionManager]
    code: 200
    input: []
    output: ReleaseOrder
    side_effects:
      - "status RELEASED -> GATED_OUT; gated_out_at stamped"
      - "vehicle.yard_presence -> DEPARTED; vehicle.gate_out_at stamped; processing_status -> GATED_OUT"
      - "vehicle.storage_charge_final_cents := calculations.vehicle_storage_charge FINAL; storage_charge_provisional_cents -> 0"
      - "center.realized_storage_revenue_cents, provisional_storage_accrued_cents, yard_occupied_slots, yard_free_slots and yard_posture recomputed"
      - "truck_carrier.committed_slots / available_slots recomputed (INVARIANT S)"

  - method: POST
    path: /vpc/release-orders/{releaseOrderId}/cancel
    description: "Cancel an allocation or release manually; reverses the carrier commitment, dealer quota usage and provisional storage accrual."
    roles: [DistributionManager]
    code: 200
    input: []
    output: ReleaseOrder
    side_effects:
      - "status ALLOCATED|RELEASED -> CANCELLED; vehicle.processing_status reverts to SHIPPING_READY"
      - "truck_carrier.committed_slots / available_slots and dealer.open_allocation_count recomputed (INVARIANT S restored)"
      - "vehicle.storage_charge_provisional_cents -> 0; center.provisional_storage_accrued_cents recomputed"

  - method: POST
    path: /vpc/release-orders/{releaseOrderId}/delivery-confirmation
    description: "Dealer acknowledges delivery of a gated-out unit. Only the consignee dealer may call it."
    roles: [Dealer]
    code: 200
    input: []
    output: ReleaseOrder
    side_effects: ["status GATED_OUT -> DELIVERED; no yard or carrier field changes"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
    applies_to: ["all endpoints"]

  - id: ERR_FORBIDDEN_ROLE
    http_status: 403
    condition: "The acting role is valid but not listed in the endpoint's §1.5 roles"
    applies_to: ["all endpoints"]

  - id: ERR_CENTER_NOT_FOUND
    http_status: 404
    condition: "centerId path parameter does not resolve"
    applies_to: ["GET /vpc/processing-centers/{centerId}", "GET /vpc/processing-centers/{centerId}/dwell-metrics", "POST /vpc/processing-centers/{centerId}/accessory-kits", "POST /vpc/processing-centers/{centerId}/hold-orders"]

  - id: ERR_BERTH_NOT_FOUND
    http_status: 404
    condition: "berthId path parameter does not resolve"
    applies_to: ["GET /vpc/berths/{berthId}"]

  - id: ERR_VESSEL_NOT_FOUND
    http_status: 404
    condition: "vesselId path parameter does not resolve"
    applies_to: ["GET /vpc/vessels/{vesselId}", "POST /vpc/vessels/{vesselId}/start-discharge", "POST /vpc/vessels/{vesselId}/complete-discharge", "POST /vpc/vessels/{vesselId}/vehicles"]

  - id: ERR_VEHICLE_NOT_FOUND
    http_status: 404
    condition: "vehicleId path parameter does not resolve"
    applies_to: ["GET /vpc/vehicles/{vehicleId}", "POST /vpc/vehicles/{vehicleId}/damage-surveys", "POST /vpc/vehicles/{vehicleId}/repair-orders", "POST /vpc/vehicles/{vehicleId}/accessory-work-orders", "POST /vpc/vehicles/{vehicleId}/quality-inspections", "POST /vpc/vehicles/{vehicleId}/prep-complete", "POST /vpc/vehicles/{vehicleId}/allocations"]

  - id: ERR_SURVEY_NOT_FOUND
    http_status: 404
    condition: "surveyId path parameter does not resolve"
    applies_to: ["GET /vpc/damage-surveys/{surveyId}", "POST /vpc/damage-surveys/{surveyId}/submit", "POST /vpc/damage-surveys/{surveyId}/claims"]

  - id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    condition: "claimId path parameter does not resolve"
    applies_to: ["GET /vpc/carrier-claims/{claimId}", "POST /vpc/carrier-claims/{claimId}/carrier-response", "POST /vpc/carrier-claims/{claimId}/resubmit", "POST /vpc/carrier-claims/{claimId}/settle"]

  - id: ERR_REPAIR_ORDER_NOT_FOUND
    http_status: 404
    condition: "repairOrderId path parameter does not resolve"
    applies_to: ["GET /vpc/repair-orders/{repairOrderId}", "POST /vpc/repair-orders/{repairOrderId}/authorize", "POST /vpc/repair-orders/{repairOrderId}/complete"]

  - id: ERR_KIT_NOT_FOUND
    http_status: 404
    condition: "kitId path parameter does not resolve"
    applies_to: ["GET /vpc/accessory-kits/{kitId}"]

  - id: ERR_WORK_ORDER_NOT_FOUND
    http_status: 404
    condition: "workOrderId path parameter does not resolve"
    applies_to: ["GET /vpc/accessory-work-orders/{workOrderId}", "POST /vpc/accessory-work-orders/{workOrderId}/kit", "POST /vpc/accessory-work-orders/{workOrderId}/install", "POST /vpc/accessory-work-orders/{workOrderId}/void"]

  - id: ERR_INSPECTION_NOT_FOUND
    http_status: 404
    condition: "inspectionId path parameter does not resolve"
    applies_to: ["GET /vpc/quality-inspections/{inspectionId}", "POST /vpc/quality-inspections/{inspectionId}/complete"]

  - id: ERR_HOLD_ORDER_NOT_FOUND
    http_status: 404
    condition: "holdOrderId path parameter does not resolve"
    applies_to: ["GET /vpc/hold-orders/{holdOrderId}", "POST /vpc/hold-orders/{holdOrderId}/lift"]

  - id: ERR_DEALER_NOT_FOUND
    http_status: 404
    condition: "dealerId path parameter does not resolve"
    applies_to: ["GET /vpc/dealers/{dealerId}"]

  - id: ERR_CARRIER_NOT_FOUND
    http_status: 404
    condition: "carrierId path parameter does not resolve"
    applies_to: ["GET /vpc/truck-carriers/{carrierId}", "PATCH /vpc/truck-carriers/{carrierId}"]

  - id: ERR_RELEASE_ORDER_NOT_FOUND
    http_status: 404
    condition: "releaseOrderId path parameter does not resolve"
    applies_to: ["GET /vpc/release-orders/{releaseOrderId}", "POST /vpc/release-orders/{releaseOrderId}/dispatch", "POST /vpc/release-orders/{releaseOrderId}/gate-out", "POST /vpc/release-orders/{releaseOrderId}/cancel", "POST /vpc/release-orders/{releaseOrderId}/delivery-confirmation"]

  - id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    condition: "A foreign key supplied in the request body does not resolve (processing_center_id, berth_id, accessory_kit_id, carrier_claim_id, dealer_id, or the SINGLE_VIN hold's vehicle_id)"
    applies_to: ["POST /vpc/berths", "POST /vpc/vessels", "POST /vpc/vehicles/{vehicleId}/accessory-work-orders", "POST /vpc/vehicles/{vehicleId}/repair-orders", "POST /vpc/vehicles/{vehicleId}/allocations", "POST /vpc/processing-centers/{centerId}/hold-orders"]

  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "Schema violation: missing required field, invalid enum member, out-of-range number, VIN not exactly 17 characters, interval end not strictly after start, PASS with defect_count >= 1, FAIL with defect_count == 0, DISPUTE without a conceded amount below claimed_amount_cents, revised_claim_amount_cents above claimed_amount_cents, MODEL_LINE hold without model_line, SINGLE_VIN hold without vehicle_id"
    applies_to: ["all write endpoints"]

  - id: ERR_DUPLICATE_KEY
    http_status: 409
    condition: "Uniqueness violation on ProcessingCenter.port_code, Vessel.voyage_code within a center, Berth.berth_code within a center, Vehicle.vin, AccessoryKit.kit_code within a center, Dealer.dealer_code or TruckCarrier.carrier_code"
    applies_to: ["POST /vpc/processing-centers", "POST /vpc/berths", "POST /vpc/vessels", "POST /vpc/vessels/{vesselId}/vehicles", "POST /vpc/processing-centers/{centerId}/accessory-kits", "POST /vpc/dealers", "POST /vpc/truck-carriers"]

  - id: ERR_STALE_VEHICLE_VERSION
    http_status: 412
    condition: "expected_vehicle_version does not equal the vehicle's current version (§1.2.1 allocation-create-stale-vehicle)"
    applies_to: ["POST /vpc/vehicles/{vehicleId}/allocations"]

  - id: ERR_STALE_SURVEY_VERSION
    http_status: 412
    condition: "expected_damage_survey_version does not equal the survey's current version (§1.2.1 claim-create-stale-survey)"
    applies_to: ["POST /vpc/damage-surveys/{surveyId}/claims"]

  - id: ERR_INVALID_STATE
    http_status: 409
    condition: "The requested transition does not exist from the resource's current state, or a required companion state is wrong (e.g. superseding a RELEASED order, installing while the unit is not ACCESSORY_IN_PROGRESS)"
    applies_to: ["all state-changing endpoints"]

  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: "The acting X-User-ID is the same person as a conflicting prior actor: opening a quality inspection on a unit this user installed accessories on, lifting a hold this user applied, or settling a claim this user filed"
    applies_to: ["POST /vpc/vehicles/{vehicleId}/quality-inspections", "POST /vpc/hold-orders/{holdOrderId}/lift", "POST /vpc/carrier-claims/{claimId}/settle"]

  - id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: "A Dealer acts on a release order whose dealer_id is not the caller's X-User-ID"
    applies_to: ["POST /vpc/release-orders/{releaseOrderId}/delivery-confirmation"]

  - id: ERR_VEHICLE_STOP_SHIP_BLOCKED
    http_status: 409
    condition: "The unit is covered by an OPEN recall or stop-ship HoldOrder (stop_ship_blocked == true): rejected at allocation, and at gate-out for a unit that was already RELEASED when the hold landed"
    applies_to: ["POST /vpc/vehicles/{vehicleId}/allocations", "POST /vpc/release-orders/{releaseOrderId}/gate-out"]

  - id: ERR_VEHICLE_DAMAGE_BLOCKED
    http_status: 409
    condition: "vehicle.damage_status is SURVEY_DAMAGE_OPEN or REPAIR_AUTHORIZED"
    applies_to: ["POST /vpc/vehicles/{vehicleId}/prep-complete"]

  - id: ERR_CLAIM_REQUIRED
    http_status: 409
    condition: "claim_mandatory == true and no CarrierClaim exists for the unit's survey (prep-complete), or an escalated repair is authorized with no live claim behind it (authorize)"
    applies_to: ["POST /vpc/vehicles/{vehicleId}/prep-complete", "POST /vpc/repair-orders/{repairOrderId}/authorize"]

  - id: ERR_YARD_GRIDLOCK
    http_status: 409
    condition: "The destination center's yard_posture is GRIDLOCK at the moment of discharge"
    applies_to: ["POST /vpc/vessels/{vesselId}/vehicles"]

  - id: ERR_BERTH_WINDOW_CONFLICT
    http_status: 409
    condition: "The requested berth window overlaps a SCHEDULED or DISCHARGING voyage on the same berth once the turnaround buffer is applied on both sides"
    applies_to: ["POST /vpc/vessels"]

  - id: ERR_BERTH_WINDOW_NOT_OPEN
    http_status: 409
    condition: "Discharge is started before the logical clock reaches berth_window_start"
    applies_to: ["POST /vpc/vessels/{vesselId}/start-discharge"]

  - id: ERR_CARRIER_WINDOW_CAPACITY
    http_status: 409
    condition: "Dispatch would make more RELEASED pickup windows overlap at some instant than the carrier's concurrent_load_capacity"
    applies_to: ["POST /vpc/release-orders/{releaseOrderId}/dispatch"]

  - id: ERR_VESSEL_DISCHARGE_INCOMPLETE
    http_status: 409
    condition: "The unit's discharging voyage has not reached DISCHARGE_COMPLETE"
    applies_to: ["POST /vpc/vehicles/{vehicleId}/prep-complete"]

  - id: ERR_ACCESSORY_WORK_OPEN
    http_status: 409
    condition: "A quality inspection is completed while at least one AccessoryWorkOrder of the unit is still KITTED"
    applies_to: ["POST /vpc/quality-inspections/{inspectionId}/complete"]

  - id: ERR_KIT_INSUFFICIENT
    http_status: 409
    condition: "kit.available_qty < work_order.qty at kitting time"
    applies_to: ["POST /vpc/accessory-work-orders/{workOrderId}/kit"]

  - id: ERR_CLAIM_REVISION_LIMIT
    http_status: 409
    condition: "revision_round has already reached MAX_CLAIM_REVISIONS (3)"
    applies_to: ["POST /vpc/carrier-claims/{claimId}/resubmit"]

  - id: ERR_CLAIM_NOT_WARRANTED
    http_status: 409
    condition: "The survey's severity_index is below 25, so no carrier claim may be filed"
    applies_to: ["POST /vpc/damage-surveys/{surveyId}/claims"]

  - id: ERR_CLAIM_ALREADY_OPEN
    http_status: 409
    condition: "A CarrierClaim for this survey exists in FILED, ACCEPTED_PENDING_SETTLEMENT, DISPUTED or SETTLED — only an all-DENIED history may be re-filed against"
    applies_to: ["POST /vpc/damage-surveys/{surveyId}/claims"]

  - id: ERR_NO_ELIGIBLE_CARRIER
    http_status: 409
    condition: "calculations.carrier_selection finds no ACTIVE carrier serving the dealer's route zone with a free slot"
    applies_to: ["POST /vpc/vehicles/{vehicleId}/allocations"]

  - id: ERR_NO_UNITS_DISCHARGED
    http_status: 409
    condition: "A voyage is closed while discharged_unit_count == 0"
    applies_to: ["POST /vpc/vessels/{vesselId}/complete-discharge"]

  - id: ERR_DEALER_QUOTA_EXCEEDED
    http_status: 409
    condition: "dealer.open_allocation_count has already reached dealer.allocation_quota"
    applies_to: ["POST /vpc/vehicles/{vehicleId}/allocations"]

  - id: ERR_SETTLEMENT_EXCEEDS_RECOVERABLE
    http_status: 422
    condition: "settled_amount_cents exceeds the claim's recoverable_amount_cents under its active basis"
    applies_to: ["POST /vpc/carrier-claims/{claimId}/settle"]

# =============================================================================
# §1.7 RBAC Permission Matrix
# =============================================================================
roles:
  - name: PortOperationsPlanner
    description: "Schedules berths and voyages and discharges units into the holding yard."
    identity: opaque
    exclusive_operations:
      - "POST /vpc/processing-centers"
      - "POST /vpc/berths"
      - "POST /vpc/vessels"
      - "POST /vpc/vessels/{vesselId}/start-discharge"
      - "POST /vpc/vessels/{vesselId}/complete-discharge"
      - "POST /vpc/vessels/{vesselId}/vehicles"
    shared_operations:
      - "all GET reads except the Dealer-visible release-order reads"
      - "POST /vpc/_clock/set_current_utc"

  - name: DamageSurveyor
    description: "Surveys arrival damage, files and revises carrier claims, and estimates and completes repairs."
    identity: opaque
    exclusive_operations:
      - "POST /vpc/vehicles/{vehicleId}/damage-surveys"
      - "POST /vpc/damage-surveys/{surveyId}/submit"
      - "POST /vpc/damage-surveys/{surveyId}/claims"
      - "POST /vpc/carrier-claims/{claimId}/resubmit"
      - "POST /vpc/vehicles/{vehicleId}/repair-orders"
      - "POST /vpc/repair-orders/{repairOrderId}/complete"
    shared_operations:
      - "all GET reads except the Dealer-visible release-order reads"
      - "POST /vpc/_clock/set_current_utc"

  - name: AccessoryTechnician
    description: "Receives kit stock and runs port-installed option work orders."
    identity: opaque
    exclusive_operations:
      - "POST /vpc/processing-centers/{centerId}/accessory-kits"
      - "POST /vpc/vehicles/{vehicleId}/accessory-work-orders"
      - "POST /vpc/accessory-work-orders/{workOrderId}/kit"
      - "POST /vpc/accessory-work-orders/{workOrderId}/install"
      - "POST /vpc/accessory-work-orders/{workOrderId}/void"
    shared_operations:
      - "all GET reads except the Dealer-visible release-order reads"
      - "POST /vpc/_clock/set_current_utc"

  - name: QualityInspector
    description: "Inspects units and records preparation to shipping condition. Subject to SoD-1 against accessory installers."
    identity: opaque
    exclusive_operations:
      - "POST /vpc/vehicles/{vehicleId}/quality-inspections"
      - "POST /vpc/quality-inspections/{inspectionId}/complete"
      - "POST /vpc/vehicles/{vehicleId}/prep-complete"
    shared_operations:
      - "all GET reads except the Dealer-visible release-order reads"
      - "POST /vpc/_clock/set_current_utc"

  - name: DistributionManager
    description: "Manages dealers, carriers, holds, allocations, releases and claim adjudication. Subject to SoD-2 (hold apply vs lift) and SoD-3 (claim file vs settle)."
    identity: opaque
    exclusive_operations:
      - "POST /vpc/dealers"
      - "POST /vpc/truck-carriers"
      - "PATCH /vpc/truck-carriers/{carrierId}"
      - "POST /vpc/processing-centers/{centerId}/hold-orders"
      - "POST /vpc/hold-orders/{holdOrderId}/lift"
      - "POST /vpc/carrier-claims/{claimId}/carrier-response"
      - "POST /vpc/carrier-claims/{claimId}/settle"
      - "POST /vpc/repair-orders/{repairOrderId}/authorize"
      - "POST /vpc/vehicles/{vehicleId}/allocations"
      - "POST /vpc/release-orders/{releaseOrderId}/dispatch"
      - "POST /vpc/release-orders/{releaseOrderId}/gate-out"
      - "POST /vpc/release-orders/{releaseOrderId}/cancel"
    shared_operations:
      - "all GET reads"
      - "POST /vpc/_clock/set_current_utc"

  - name: Dealer
    description: "Consignee dealer. X-User-ID is the Dealer entity id; may only see units and release orders and confirm delivery of its own."
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /vpc/release-orders/{releaseOrderId}/delivery-confirmation"
    shared_operations:
      - "GET /vpc/vehicles/{vehicleId}"
      - "GET /vpc/vehicles"
      - "GET /vpc/release-orders/{releaseOrderId}"
      - "GET /vpc/release-orders"
      - "POST /vpc/_clock/set_current_utc"

segregation_of_duties:
  - id: SoD-1
    rule: "The QualityInspector opening a quality inspection on a unit must not be the X-User-ID recorded as installed_by_user_id on any AccessoryWorkOrder of that unit whose status is INSTALLED, or whose status is KITTED after a reopen (installed_by_user_id is retained across the reopen precisely so this check survives the rework cycle)."
    enforced_at: "POST /vpc/vehicles/{vehicleId}/quality-inspections"
    error_id: ERR_SEGREGATION_OF_DUTIES

  - id: SoD-2
    rule: "The DistributionManager lifting a HoldOrder must not be its applied_by_user_id."
    enforced_at: "POST /vpc/hold-orders/{holdOrderId}/lift"
    error_id: ERR_SEGREGATION_OF_DUTIES

  - id: SoD-3
    rule: "The DistributionManager settling a CarrierClaim must not be its filed_by_user_id."
    enforced_at: "POST /vpc/carrier-claims/{claimId}/settle"
    error_id: ERR_SEGREGATION_OF_DUTIES
