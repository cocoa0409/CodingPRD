  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: trip_matching_self_loop_then_offer_with_parallel_fare_axis
        grounds:
          - state_machines.TripRequest.status.RECEIVED_to_MATCHING
          - state_machines.TripRequest.status.MATCHING_to_MATCHING
          - state_machines.TripRequest.status.MATCHING_to_OFFERED
          - state_machines.TripRequest.fare_status.UNPRICED_to_QUOTED
          - entities.TripRequest.fields.match_attempt_count
        distinguishing_aspect: |
          Cyclic shape on the status axis combined with an independent parallel axis: with no OPEN
          block the trip takes the MATCHING -> MATCHING self-loop and match_attempt_count stays 0
          (the counter tracks offers, not rounds), while the fare axis remains UNPRICED throughout;
          only when a block is opened does the same trigger produce OFFERED, count 1 and fare_status
          QUOTED. This is the status/fare-axis instance; the PoolAssignment instance below is the
          branching one and the SubsidyReport instance is the certify/amend cycle.
        test_recipe:
          setup:
            - "Zone RBM ACTIVE; stops S0 and S4 approved; rider R1 FULL."
            - "Block B1 (V1/D1) 06:00-10:00Z exists but is still SCHEDULED, so the pool_match_selection candidate set is empty (only OPEN blocks are candidates)."
            - "Trip T1: R1, S0->S4, requested_pickup 07:00Z, party_size 1, status RECEIVED, fare_status UNPRICED, match_attempt_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S0", corridor_index: 0, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s0_id: $.data.id }
            - call: "POST /virtual-stops/${s0_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S4", corridor_index: 4, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /virtual-stops/${s4_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: true }
              as: ZoneAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "R1", fare_category: "FULL", mobility_device: "NONE" }
              as: ZoneAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { b1_id: $.data.id }
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${r1_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:00:00Z", party_size: 1 }
              as: Rider
              as_user_id: "${r1_id}"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /trip-requests/${t1_id}/match"
              payload: {}
              as: Dispatcher
            - call: "POST /trip-requests/${t1_id}/match"
              payload: {}
              as: Dispatcher
            - call: "POST /vehicle-blocks/${b1_id}/open"
              payload: {}
              as: Dispatcher
            - call: "POST /trip-requests/${t1_id}/match"
              payload: {}
              as: Dispatcher
          assert:
            - "trigger step 1 responds 200 with data.status == MATCHING, data.match_attempt_count == 0 and data.fare_status == UNPRICED"
            - "trigger step 2 responds 200 with data.status == MATCHING (self-loop, not an error) and data.match_attempt_count == 0"
            - "trigger step 4 responds 200 with data.status == OFFERED and data.match_attempt_count == 1"
            - "TripRequest.${t1_id}.status == OFFERED"
            - "TripRequest.${t1_id}.fare_status == QUOTED"
            - "TripRequest.${t1_id}.quoted_fare_cents == 325"
            - "TripRequest.${t1_id}.assigned_block_id == ${b1_id}"
