              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { enr1_id: $.data.id }
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub2_id}", provider_id: "${prov_id}", eligibility_check_id: "${chk2_id}", certified_address_id: "${addr2_id}", service_type: "BROADBAND", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { enr2_id: $.data.id }
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
