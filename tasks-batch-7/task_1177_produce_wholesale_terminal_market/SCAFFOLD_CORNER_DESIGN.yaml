            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer A", credit_limit_cents: 1000000 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", lines: [ { lot_id: "${lot}", quantity: 10, unit_price: 10.00 } ] }, as: SalesDesk, captures: { ord: "$.data.id" } }
            - { call: "POST /market/sales-orders/${ord}/confirm", payload: {}, as: SalesDesk }
            - { call: "POST /market/sales-orders/${ord}/pick", payload: {}, as: Receiver }
          trigger:
            - { call: "POST /market/sales-orders/${ord}/deliver", payload: {}, as: Receiver, captures: { ost: "$.data.status" } }
