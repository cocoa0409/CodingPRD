              payload: { full_name: "Alice Author", license_number: "CA-AL-C710", license_state: "CA" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { apr_a_id: $.data.id, apr_a_v1: $.data.version }
