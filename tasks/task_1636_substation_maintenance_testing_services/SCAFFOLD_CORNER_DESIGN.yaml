scaffold_corner_design:
  - section: entities
    instances:
      - name: substation_creation_defaults_applied
        claim_type: creation_and_defaults
        grounds: ["entities.Substation", "endpoints.\"POST /substations\""]
        distinguishing_aspect: "POST /substations with only required inputs returns 201; system supplies status ACTIVE, version 1, and server-minted id/created_at."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub G", code: "SUB-G", region: "North" }
              as: OperationsManager
              captures: { sub_id: $.data.id, sub_status: $.data.status, sub_v: $.data.version }
          trigger:
            - call: "GET /substations"
              payload: {}
              as: OperationsManager
          assert:
            - "created substation status == ACTIVE (default applied), version == 1, id non-empty"
            - "GET /substations total_count == 1"
      - name: asset_computed_condition_score_input_ignored
        claim_type: computed_field_ignores_input
        grounds: ["entities.Asset.fields.condition_score"]
        distinguishing_aspect: "condition_score is source:computed — a client-supplied value must be ignored and the server computes 100.00 on creation."
        test_recipe:
          setup: ["substation and POWER_TRANSFORMER policy exist"]
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub H", code: "SUB-H", region: "South" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
          trigger:
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2022-01-01T00:00:00Z", condition_score: 5 }
              as: OperationsManager
              captures: { a_score: $.data.condition_score, a_crit: $.data.criticality }
              # negative-form name: payload deliberately smuggles a non-contract field; server must ignore it
          assert:
            - "response condition_score == 100.00 (client-supplied 5 ignored)"
            - "response criticality == MEDIUM (default applied when omitted)"
      - name: asset_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /assets without required voltage_kv fails with ERR_VALIDATION 400 before any business rule runs."
        test_recipe:
          setup: ["substation and policy exist"]
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub I", code: "SUB-I", region: "East" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
          trigger:
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", install_date: "2022-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION and HTTP status == 400"
      - name: asset_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.Asset.fields.asset_class", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "asset_class outside the declared enum is rejected at schema validation."
        test_recipe:
          setup: ["substation exists"]
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub J", code: "SUB-J", region: "West" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "FUSION_REACTOR", voltage_kv: 115, install_date: "2022-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"
      - name: get_asset_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /assets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status == 404"
      - name: asset_missing_policy_returns_policy_not_found
        claim_type: parent_relationship
        grounds: ["validations[priority=6]", "errors[ERR_POLICY_NOT_FOUND]"]
        distinguishing_aspect: "Creating an asset of a class with no AssetClassPolicy fails with the domain-specific ERR_POLICY_NOT_FOUND, not generic ERR_NOT_FOUND."
        test_recipe:
          setup: ["substation exists; no CIRCUIT_BREAKER policy"]
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub K", code: "SUB-K", region: "North" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "CIRCUIT_BREAKER", voltage_kv: 34.5, install_date: "2021-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_POLICY_NOT_FOUND and HTTP status == 404"
      - name: asset_list_pagination_defaults
        claim_type: listing_pagination
        grounds: ["response_envelope", "endpoints.\"GET /assets\""]
        distinguishing_aspect: "Twelve assets under the default pagination (limit 10) return 10 rows with has_more true and total_count 12; offset 10 returns the remaining 2 with has_more false."
        test_recipe:
          setup: ["substation, policy, and 12 assets"]
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub L", code: "SUB-L", region: "South" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-02T00:00:00Z" }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-03T00:00:00Z" }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-04T00:00:00Z" }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-05T00:00:00Z" }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-06T00:00:00Z" }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-07T00:00:00Z" }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-08T00:00:00Z" }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-09T00:00:00Z" }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-10T00:00:00Z" }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-11T00:00:00Z" }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-12T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "GET /assets"
              payload: {}
              as: OperationsManager
            - call: "GET /assets"
              payload: { offset: 10 }
              as: OperationsManager
          assert:
            - "first page: 10 rows, total_count == 12, has_more == true (default limit 10 applied)"
            - "second page (offset 10): 2 rows, has_more == false"
      - name: fk_body_reference_returns_not_found
        claim_type: parent_relationship
        grounds: ["validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A body-supplied FK (asset_id) that does not resolve fails with 404 ERR_NOT_FOUND at priority 5, after schema validation."
        test_recipe:
          setup: ["technician exists"]
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "Tech FK", employee_code: "EMP-FK" }
              as: OperationsManager
              captures: { tech_id: $.data.id }
          trigger:
            - call: "POST /test-events"
              payload: { asset_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", test_type: "OIL_MOISTURE", value_primary: 10, measured_at: "2026-07-01T00:00:00Z" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status == 404"
      - name: duplicate_substation_code_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_KEY]"]
        distinguishing_aspect: "Second substation with an already-used code fails with ERR_DUPLICATE_KEY 409."
        test_recipe:
          setup: ["one substation with code SUB-DUP"]
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "First", code: "SUB-DUP", region: "North" }
              as: OperationsManager
          trigger:
            - call: "POST /substations"
              payload: { name: "Second", code: "SUB-DUP", region: "South" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_KEY and HTTP status == 409"
      - name: duplicate_step_sequence_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=7]", "entities.SwitchingStep.fields.sequence_no"]
        distinguishing_aspect: "Two switching steps with the same sequence_no within one window violate the per-window uniqueness."
        test_recipe:
          setup: ["REQUESTED window with one step sequence_no 1"]
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub M", code: "SUB-M", region: "East" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /outage-windows"
              payload: { substation_id: "${sub_id}", asset_id: "${asset_id}", start_ts: "2026-09-15T08:00:00Z", end_ts: "2026-09-15T16:00:00Z", purpose: "Steps" }
              as: OutageCoordinator
              captures: { ow_id: $.data.id }
            - call: "POST /outage-windows/${ow_id}/switching-steps"
              payload: { sequence_no: 1, description: "Step one" }
              as: OutageCoordinator
          trigger:
            - call: "POST /outage-windows/${ow_id}/switching-steps"
              payload: { sequence_no: 1, description: "Duplicate sequence" }
              as: OutageCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_KEY"

  - section: state_machines
    instances:
      - name: outage_terminal_lockdown_cancel_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.OutageWindow", "errors[ERR_STATE_TRANSITION]"]
        distinguishing_aspect: "From terminal CANCELLED no further transition is possible — a second cancel is rejected with ERR_STATE_TRANSITION and no side effects repeat (approved_outage_hours untouched)."
        test_recipe:
          setup: ["window created then cancelled while REQUESTED"]
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub SM1", code: "SUB-SM1", region: "North" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /outage-windows"
              payload: { substation_id: "${sub_id}", asset_id: "${asset_id}", start_ts: "2026-09-25T08:00:00Z", end_ts: "2026-09-25T16:00:00Z", purpose: "Lockdown probe" }
              as: OutageCoordinator
              captures: { ow_id: $.data.id }
            - call: "POST /outage-windows/${ow_id}/cancel"
              payload: {}
              as: OutageCoordinator
          trigger:
            - call: "POST /outage-windows/${ow_id}/cancel"
              payload: {}
              as: OutageCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STATE_TRANSITION (terminal lockdown; second identical trigger is not idempotent)"
      - name: approve_already_approved_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.OutageWindow.REQUESTED_to_APPROVED"]
        distinguishing_aspect: "Approve is valid only from REQUESTED; a second approve on an APPROVED window fails and must not double-add approved_outage_hours."
        test_recipe:
          setup: ["APPROVED 8h window"]
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub SM2", code: "SUB-SM2", region: "South" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /outage-windows"
              payload: { substation_id: "${sub_id}", asset_id: "${asset_id}", start_ts: "2026-10-05T08:00:00Z", end_ts: "2026-10-05T16:00:00Z", purpose: "Double approve" }
              as: OutageCoordinator
              as_user_id: "coord-1"
              captures: { ow_id: $.data.id }
            - call: "POST /outage-windows/${ow_id}/approve"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-mgr-1"
          trigger:
            - call: "POST /outage-windows/${ow_id}/approve"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-mgr-2"
              captures: { err: $.data.error_id }
            - call: "GET /assets/${asset_id}"
              payload: {}
              as: OperationsManager
              captures: { hours: $.data.approved_outage_hours }
          assert:
            - "error_id == ERR_STATE_TRANSITION"
            - "Asset.approved_outage_hours == 8.00 (added once, not twice)"
      - name: step_execute_out_of_order_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=18]", "errors[ERR_STEP_ORDER_VIOLATION]"]
        distinguishing_aspect: "Step 2 cannot execute while step 1 is still PENDING — strict ascending sequence order is enforced."
        test_recipe:
          setup: ["window SWITCHING with steps 1 (PENDING) and 2 (PENDING)"]
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub SM3", code: "SUB-SM3", region: "West" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /outage-windows"
              payload: { substation_id: "${sub_id}", asset_id: "${asset_id}", start_ts: "2026-08-16T08:00:00Z", end_ts: "2026-08-16T16:00:00Z", purpose: "Order probe" }
              as: OutageCoordinator
              as_user_id: "coord-1"
              captures: { ow_id: $.data.id }
            - call: "POST /outage-windows/${ow_id}/switching-steps"
              payload: { sequence_no: 1, description: "First" }
              as: OutageCoordinator
            - call: "POST /outage-windows/${ow_id}/switching-steps"
              payload: { sequence_no: 2, description: "Second" }
              as: OutageCoordinator
              captures: { step2_id: $.data.id }
            - call: "POST /outage-windows/${ow_id}/approve"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T09:00:00Z" }
              as: OperationsManager
            - call: "POST /outage-windows/${ow_id}/begin-switching"
              payload: {}
              as: SwitchingSupervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /switching-steps/${step2_id}/execute"
              payload: {}
              as: SwitchingSupervisor
              as_user_id: "sup-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STEP_ORDER_VIOLATION (step 1 not yet VERIFIED)"
      - name: step_verify_by_same_supervisor_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.SwitchingStep.EXECUTED_to_VERIFIED", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties on switching: the operator who executed a step cannot verify it; a different supervisor succeeds."
        test_recipe:
          setup: ["window SWITCHING; step 1 EXECUTED by sup-1"]
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub SM4", code: "SUB-SM4", region: "North" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /outage-windows"
              payload: { substation_id: "${sub_id}", asset_id: "${asset_id}", start_ts: "2026-08-17T08:00:00Z", end_ts: "2026-08-17T16:00:00Z", purpose: "SoD probe" }
              as: OutageCoordinator
              as_user_id: "coord-1"
              captures: { ow_id: $.data.id }
            - call: "POST /outage-windows/${ow_id}/switching-steps"
              payload: { sequence_no: 1, description: "Only step" }
              as: OutageCoordinator
              captures: { step1_id: $.data.id }
            - call: "POST /outage-windows/${ow_id}/approve"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T09:00:00Z" }
              as: OperationsManager
            - call: "POST /outage-windows/${ow_id}/begin-switching"
              payload: {}
              as: SwitchingSupervisor
              as_user_id: "sup-1"
            - call: "POST /switching-steps/${step1_id}/execute"
              payload: {}
              as: SwitchingSupervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /switching-steps/${step1_id}/verify"
              payload: {}
              as: SwitchingSupervisor
              as_user_id: "sup-1"
              captures: { err: $.data.error_id }
            - call: "POST /switching-steps/${step1_id}/verify"
              payload: {}
              as: SwitchingSupervisor
              as_user_id: "sup-2"
              captures: { st: $.data.status }
          assert:
            - "verify by executor sup-1 rejected with error_id == ERR_SEGREGATION_OF_DUTIES"
            - "verify by sup-2 succeeds and step status == VERIFIED"
      - name: outage_approve_by_requester_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.OutageWindow.REQUESTED_to_APPROVED", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The OperationsManager approving must differ from the requesting coordinator's identity check is on requested_by — here the coordinator obtained an OperationsManager-granted approval attempt carrying the same X-User-ID as requested_by."
        test_recipe:
