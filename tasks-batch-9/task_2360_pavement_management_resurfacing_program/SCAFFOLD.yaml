# =============================================================================
# task_2360 — Pavement Management & Resurfacing Program
# Scaffold seed tables (§1.0–§1.7). Difficulty (§1.8) and corner (§1.9) designs
# live in the sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml /
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2360. Pavement Management & Resurfacing Program (city pavement management program): network condition survey with automated distress collection and condition index calculation, deterioration modeling and treatment selection across crack seal, mill-and-overlay and reconstruction, budget scenario analysis showing network condition outcomes at different funding levels, project bundling by geography, utility coordination and moratorium rules after new pavement, coordination with water, sewer and franchise utility work before resurfacing, resident notification, parking restrictions and driveway access during construction, warranty, pavement quality acceptance and contractor performance measurement, complaint and pothole response integration with the capital program

domain_name: pavement-management-resurfacing
api_prefix: /pavement

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §0.1–§0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation          # finite annual funding competed for by treatment candidates, committed on award, released on cancel-award
  secondary_archetype: compliance_audit        # moratorium protection of new pavement, utility clearance gates, segregation of duties on quality acceptance
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # NetworkSegment ↔ ResurfacingProject is many-to-many through ProjectSegment;
  # TreatmentCandidate ↔ BudgetScenario is many-to-many through ScenarioAllocation;
  # every collection is addressed flat (no nested resource paths), FK-linked only.

  state_machine_shape: parallel
  # ResurfacingProject carries two independent dimensions (delivery_status ×
  # quality_status); ProjectSegment carries (work_state × notice_state);
  # UtilityCoordination and AcceptanceTest are cyclic; ServiceRequest branches.

  relationship_patterns:
    - many_to_many          # ProjectSegment, ScenarioAllocation junctions
    - cross_aggregate       # ProjectSegment mutates NetworkSegment across the project aggregate
    - one_to_many           # ConditionSurvey → DistressObservation, ResurfacingProject → UtilityCoordination

  role_model: segregation_of_duties
  # The Contractor who submits an AcceptanceTest names a witness Inspector; that
  # same Inspector user id may not sign the project's final acceptance. Budget
  # commitment (BudgetOfficer) is separated from project preparation
  # (PavementEngineer); the cut-permit applicant (UtilityCoordinator) is
  # separated from the moratorium waiver approver (PavementEngineer).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities · 53 endpoints · 45 error codes · 11 calculations (5 with
  # variants) · 12 state machines (2 parallel, 3 cyclic, 1 branching)

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: NetworkSegment
    parent: null
    common_fields: true
    description: "One block-face of city pavement — the managed asset. Resource with lifecycle-free identity but heavily derived condition fields."
    fields:
      - { name: street_name, type: string, source: input, description: "Street name", constraints: "1..120 chars" }
      - { name: from_node, type: string, source: input, description: "Upstream cross-street / node label", constraints: "1..80 chars" }
      - { name: to_node, type: string, source: input, description: "Downstream cross-street / node label", constraints: "1..80 chars" }
      - { name: geo_zone, type: string, source: input, description: "Geographic bundling zone label used to bundle segments into projects", constraints: "1..40 chars" }
      - { name: functional_class, type: enum, source: input, description: "Roadway class driving rate tables and decay parameters", constraints: "ARTERIAL | COLLECTOR | LOCAL" }
      - { name: surface_type, type: enum, source: input, description: "Existing surface", constraints: "ASPHALT | COMPOSITE" }
      - { name: length_ft, type: number, source: input, description: "Segment centerline length in feet", constraints: "> 0, 2 decimals" }
      - { name: width_ft, type: number, source: input, description: "Curb-to-curb width in feet", constraints: ">= 8, 2 decimals" }
      - { name: area_sy, type: number, source: computed, description: "Pavement area in square yards — calculations.segment_area_sy", constraints: "2 decimals" }
      - { name: baseline_condition_index, type: number, source: input, description: "PCI at the moment of the last treatment (or at inventory load when never treated); the anchor of the deterioration model", constraints: "0..100, 1 decimal" }
      - { name: last_treatment_type, type: enum, source: system, description: "Treatment last placed on this segment", default: NONE, constraints: "NONE | CRACK_SEAL | MILL_AND_OVERLAY | RECONSTRUCTION" }
      - { name: last_treatment_date, type: datetime, source: input, description: "ISO 8601 UTC date of the last treatment; null when never treated (model age then measured from created_at)", default: null }
      - { name: decay_coefficient, type: number, source: computed, description: "PCI points lost per year before the knee — from calculations.model_projected_condition_index DECAY_TABLE keyed on functional_class" }
      - { name: decay_knee_coefficient, type: number, source: computed, description: "Additional PCI points lost per year after KNEE_YEARS — from DECAY_TABLE keyed on functional_class" }
      - { name: condition_index, type: number, source: computed, description: "Current PCI in use for treatment selection — calculations.effective_condition_index (SURVEY_MEASURED when a sealed survey observation exists, else MODEL_PROJECTED)", constraints: "0..100, 1 decimal" }
      - { name: condition_index_source, type: enum, source: computed, description: "Which variant produced condition_index", constraints: "SURVEY_MEASURED | MODEL_PROJECTED" }
      - { name: condition_band, type: enum, source: computed, description: "Band of condition_index — GOOD when >= 70.0, FAIR when >= 50.0, POOR when >= 25.0, else FAILED", constraints: "GOOD | FAIR | POOR | FAILED" }
      - { name: moratorium_until, type: datetime, source: system, description: "Utility-cut moratorium expiry stamped when a treatment is accepted; null when no moratorium", default: null }
      - { name: active_project_count, type: integer, source: computed, description: "Count of ProjectSegment rows referencing this segment whose work_state IN {PLANNED, IN_PROGRESS, WORK_COMPLETE, REMEDIATION_REQUIRED}", default: 0 }
      - { name: open_service_request_count, type: integer, source: computed, description: "Count of ServiceRequest rows on this segment whose request_status IN {NEW, TRIAGED_PATCH, DEFERRED_TO_CAPITAL}", default: 0 }

  - name: ConditionSurvey
    parent: null
    common_fields: true
    description: "One network condition survey campaign. Automated distress collection lands as DistressObservation children; sealing freezes the survey and republishes segment condition."
    fields:
      - { name: survey_year, type: integer, source: input, description: "Program year of the survey", constraints: "2020..2040" }
      - { name: collection_method, type: enum, source: input, description: "How distress was collected", constraints: "AUTOMATED_LCMS | MANUAL_WALK" }
      - { name: survey_status, type: enum, source: system, description: "Lifecycle state — see state_machines.ConditionSurvey", default: OPEN, constraints: "OPEN | SEALED" }
      - { name: observation_count, type: integer, source: computed, description: "Count of DistressObservation rows on this survey in any qc_status", default: 0 }
      - { name: accepted_observation_count, type: integer, source: computed, description: "Count of DistressObservation rows on this survey with qc_status == ACCEPTED", default: 0 }
      - { name: network_condition_index, type: number, source: computed, description: "Area-weighted network PCI over ACCEPTED observations, stamped at seal — calculations.network_condition_index", default: null }
      - { name: sealed_at, type: datetime, source: system, description: "Logical-clock instant of sealing; null while OPEN", default: null }

  - name: DistressObservation
    parent: ConditionSurvey
    common_fields: true
    description: "Automated distress collection record for one segment within one survey. QC decides whether it feeds the condition index."
    fields:
      - { name: survey_id, type: string, source: input, description: "FK -> ConditionSurvey.id; the survey this observation was collected under" }
      - { name: segment_id, type: string, source: input, description: "FK -> NetworkSegment.id; the surveyed segment" }
      - { name: alligator_cracking_sqft, type: number, source: input, description: "Fatigue (alligator) cracking area in square feet", constraints: ">= 0" }
      - { name: longitudinal_cracking_lf, type: number, source: input, description: "Longitudinal + transverse cracking in linear feet", constraints: ">= 0" }
      - { name: rutting_depth_in, type: number, source: input, description: "Mean wheelpath rut depth in inches", constraints: ">= 0, <= 4" }
      - { name: patching_sqft, type: number, source: input, description: "Existing patch area in square feet", constraints: ">= 0" }
      - { name: iri_in_per_mi, type: number, source: input, description: "International Roughness Index, inches per mile", constraints: ">= 0, <= 600" }
      - { name: sample_coverage_pct, type: number, source: input, description: "Percentage of the segment actually imaged by the collection van", constraints: ">= 25, <= 100" }
      - { name: deduct_total, type: number, source: computed, description: "Coverage-adjusted deduct value — calculations.survey_measured_condition_index step 6", constraints: "2 decimals" }
      - { name: measured_condition_index, type: number, source: computed, description: "SURVEY_MEASURED PCI variant for this observation — calculations.survey_measured_condition_index", constraints: "0..100, 1 decimal" }
      - { name: qc_status, type: enum, source: system, description: "QC lifecycle — see state_machines.DistressObservation", default: PENDING, constraints: "PENDING | ACCEPTED | FLAGGED | REJECTED" }
      - { name: qc_note, type: string, source: system, description: "Reviewer note captured on the QC decision; null while PENDING", default: null }

  - name: TreatmentCandidate
    parent: ConditionSurvey
    common_fields: true
    description: "A treatment proposal for one segment produced by the selection rules of one sealed survey. Priced and benefit-scored so scenarios can rank it."
    fields:
      - { name: survey_id, type: string, source: system, description: "FK -> ConditionSurvey.id; the sealed survey that generated this candidate" }
      - { name: segment_id, type: string, source: system, description: "FK -> NetworkSegment.id; the segment to be treated" }
      - { name: treatment_type, type: enum, source: system, description: "Selected treatment — calculations.treatment_selection, or the engineer override", constraints: "CRACK_SEAL | MILL_AND_OVERLAY | RECONSTRUCTION" }
      - { name: selection_condition_index, type: number, source: system, description: "Snapshot of NetworkSegment.condition_index at generation time; the selection and benefit math both use this snapshot, never the live field", constraints: "0..100, 1 decimal" }
      - { name: expected_service_life_years, type: integer, source: computed, description: "Service life of treatment_type — SERVICE_LIFE constant in calculations.candidate_benefit_cost_ratio" }
      - { name: treatment_pci_gain, type: number, source: computed, description: "PCI points the treatment restores — calculations.candidate_benefit_cost_ratio step 1", constraints: "0..100, 1 decimal" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Engineer's estimate — calculations.candidate_estimated_cost_cents" }
      - { name: benefit_cost_ratio, type: number, source: computed, description: "PCI-years-square-yards per $1,000 — calculations.candidate_benefit_cost_ratio", constraints: "4 decimals" }
      - { name: candidate_status, type: enum, source: system, description: "Lifecycle — see state_machines.TreatmentCandidate", default: RECOMMENDED, constraints: "RECOMMENDED | OVERRIDDEN | CONSUMED | SUPERSEDED" }
      - { name: override_reason, type: string, source: system, description: "Engineer's justification recorded when treatment_type was overridden; null otherwise", default: null }

  - name: BudgetScenario
    parent: ConditionSurvey
    common_fields: true
    description: "A funding-level what-if over one sealed survey's candidate pool. Running it performs the waterfall allocation and projects network condition; adopting it makes it the capital program of record."
    fields:
      - { name: survey_id, type: string, source: input, description: "FK -> ConditionSurvey.id; the sealed survey supplying the candidate pool" }
      - { name: scenario_name, type: string, source: input, description: "Scenario label, e.g. 'FY27 at $4.0M'", constraints: "1..80 chars" }
      - { name: funding_cents, type: integer, source: input, description: "Total funding available to allocate", constraints: ">= 0" }
      - { name: strategy, type: enum, source: input, description: "Ranking strategy for the waterfall", constraints: "WORST_FIRST | BENEFIT_COST | HYBRID" }
      - { name: horizon_years, type: integer, source: input, description: "Projection horizon for network condition outcome", constraints: "1..20" }
      - { name: analysis_date, type: datetime, source: system, description: "Logical-clock instant at creation; all age math in this scenario is measured from here" }
      - { name: scenario_status, type: enum, source: system, description: "Lifecycle — see state_machines.BudgetScenario", default: DRAFT, constraints: "DRAFT | COMPUTED | ADOPTED | SUPERSEDED" }
      - { name: allocation_count, type: integer, source: computed, description: "Count of ScenarioAllocation rows on this scenario with allocation_status IN {FUNDED, DEFERRED}", default: 0 }
      - { name: funded_cost_cents, type: integer, source: computed, description: "Sum of allocated_cents over ScenarioAllocation rows with allocation_status == FUNDED", default: 0 }
      - { name: backlog_cents, type: integer, source: computed, description: "Sum of TreatmentCandidate.estimated_cost_cents over ScenarioAllocation rows with allocation_status == DEFERRED", default: 0 }
      - { name: committed_cents, type: integer, source: computed, description: "Sum of award_amount_cents over ResurfacingProject rows on this scenario whose delivery_status IN {AWARDED, IN_CONSTRUCTION, SUBSTANTIALLY_COMPLETE, ACCEPTED}", default: 0 }
      - { name: uncommitted_cents, type: integer, source: computed, description: "funding_cents - committed_cents; the conserved quantity of calculations.scenario_funding_conservation", default: 0 }
      - { name: projected_network_pci, type: number, source: computed, description: "Area-weighted network PCI at analysis_date + horizon_years under this funding level — calculations.projected_network_pci", default: null }
      - { name: do_nothing_network_pci, type: number, source: computed, description: "Same projection with zero segments funded — the comparison arm of the scenario", default: null }
      - { name: adopted_by_user_id, type: string, source: system, description: "X-User-ID of the BudgetOfficer who adopted this scenario; null until ADOPTED. That officer may not later award a project from this scenario (segregation of duties).", default: null }

  - name: ScenarioAllocation
    parent: BudgetScenario
    common_fields: true
    description: "Junction row: one candidate's fate inside one scenario. Produced by the waterfall run or added manually by the budget officer."
    fields:
      - { name: scenario_id, type: string, source: input, description: "FK -> BudgetScenario.id; the scenario this allocation belongs to" }
      - { name: candidate_id, type: string, source: input, description: "FK -> TreatmentCandidate.id; the candidate being funded or deferred" }
      - { name: rank, type: integer, source: system, description: "1-based position in the scenario's ranking order; MANUAL_ADD rows take max(existing rank) + 1", constraints: ">= 1" }
      - { name: allocation_status, type: enum, source: system, description: "Outcome — see state_machines.ScenarioAllocation", constraints: "FUNDED | DEFERRED | WITHDRAWN" }
      - { name: allocated_cents, type: integer, source: computed, description: "TreatmentCandidate.estimated_cost_cents when FUNDED, else 0", default: 0 }
      - { name: source, type: enum, source: system, description: "How the row came to exist", constraints: "AUTO_RUN | MANUAL_ADD" }

  - name: Contractor
    parent: null
    common_fields: true
    description: "A paving contractor. Standing is a derived posture that gates new awards; the scorecard carries two divergent scores."
    fields:
      - { name: legal_name, type: string, source: input, description: "Contractor legal name", constraints: "1..120 chars" }
      - { name: max_concurrent_projects, type: integer, source: input, description: "Crew capacity — how many of this contractor's projects may hold overlapping construction windows", default: 2, constraints: "1..10" }
      - { name: standing, type: enum, source: computed, description: "Award posture derived from interim_performance_score — GOOD_STANDING when >= 80.0, WATCH when >= 60.0, else SUSPENDED", default: GOOD_STANDING, constraints: "GOOD_STANDING | WATCH | SUSPENDED" }
      - { name: interim_performance_score, type: number, source: computed, description: "INTERIM variant of calculations.contractor_performance_score — optimistic, includes in-flight projects; this is the value that drives standing", default: 100.0 }
      - { name: final_performance_score, type: number, source: computed, description: "FINAL variant of calculations.contractor_performance_score — realized, accepted projects only; published for procurement", default: null }
      - { name: passed_test_count, type: integer, source: computed, description: "AcceptanceTest rows with test_status == PASSED across this contractor's projects", default: 0 }
      - { name: failed_test_count, type: integer, source: computed, description: "AcceptanceTest rows with test_status == FAILED across this contractor's projects", default: 0 }
      - { name: remediation_event_count, type: integer, source: computed, description: "Number of times one of this contractor's projects entered quality_status == REMEDIATION_REQUIRED", default: 0 }
      - { name: days_late_total, type: integer, source: computed, description: "Sum of ResurfacingProject.days_late over this contractor's projects with delivery_status == ACCEPTED", default: 0 }
      - { name: accepted_project_count, type: integer, source: computed, description: "Count of this contractor's projects with delivery_status == ACCEPTED", default: 0 }

  - name: ResurfacingProject
    parent: BudgetScenario
    common_fields: true
    description: "A geographic bundle of funded segments delivered as one construction contract. Two independent state dimensions: delivery_status and quality_status."
    fields:
      - { name: scenario_id, type: string, source: input, description: "FK -> BudgetScenario.id; the adopted scenario funding this project" }
      - { name: contractor_id, type: string, source: system, description: "FK -> Contractor.id; null until award, cleared on cancel-award" , default: null }
      - { name: project_name, type: string, source: input, description: "Project label", constraints: "1..80 chars" }
      - { name: geo_zone, type: string, source: input, description: "Bundling zone; every ProjectSegment's NetworkSegment.geo_zone must equal this value", constraints: "1..40 chars" }
      - { name: planned_start_date, type: datetime, source: input, description: "Planned construction window start (inclusive)" }
      - { name: planned_end_date, type: datetime, source: input, description: "Planned construction window end (exclusive for segment conflict math, inclusive for contractor capacity math)" }
      - { name: delivery_status, type: enum, source: system, description: "Delivery dimension — see state_machines.ResurfacingProject (delivery)", default: DRAFT, constraints: "DRAFT | COORDINATING | BID_READY | AWARDED | IN_CONSTRUCTION | SUBSTANTIALLY_COMPLETE | ACCEPTED" }
      - { name: quality_status, type: enum, source: system, description: "Quality dimension, evolves independently of delivery_status — see state_machines.ResurfacingProject (quality)", default: NOT_STARTED, constraints: "NOT_STARTED | TESTING | REMEDIATION_REQUIRED | QUALITY_ACCEPTED" }
      - { name: segment_count, type: integer, source: computed, description: "Count of ProjectSegment rows with work_state != REMOVED", default: 0 }
      - { name: planned_area_sy, type: number, source: computed, description: "Sum of ProjectSegment.line_area_sy over rows with work_state != REMOVED; conserved quantity of calculations.project_area_conservation", default: 0 }
      - { name: bundle_base_cents, type: integer, source: computed, description: "Per-line-rounded construction cost plus one mobilization — calculations.project_bundle_base_cents", default: 0 }
      - { name: contingency_cents, type: integer, source: computed, description: "Contingency, tier keyed on bundle_base_cents — calculations.project_total_estimate_cents step 2", default: 0 }
      - { name: utility_share_cents, type: integer, source: computed, description: "Utility trench-restoration share — calculations.project_total_estimate_cents step 3", default: 0 }
      - { name: project_total_estimate_cents, type: integer, source: computed, description: "bundle_base_cents + contingency_cents + utility_share_cents — calculations.project_total_estimate_cents", default: 0 }
      - { name: award_amount_cents, type: integer, source: system, description: "Awarded contract amount; null until award, cleared on cancel-award", default: null }
      - { name: clearance_outstanding_count, type: integer, source: computed, description: "Count of UtilityCoordination rows on this project whose coordination_status NOT IN {CLEARED, CLEARED_AFTER_WORK}", default: 0 }
      - { name: open_remediation_count, type: integer, source: computed, description: "Count of ProjectSegment rows on this project with work_state == REMEDIATION_REQUIRED", default: 0 }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock instant of final acceptance; null until ACCEPTED", default: null }
      - { name: days_late, type: integer, source: computed, description: "max(0, whole days from planned_end_date to substantial_completion_at); 0 until substantial completion", default: 0 }
      - { name: substantial_completion_at, type: datetime, source: system, description: "Logical-clock instant the contractor declared substantial completion", default: null }
      - { name: accepting_inspector_user_id, type: string, source: system, description: "X-User-ID of the Inspector who signed final acceptance; null until ACCEPTED", default: null }

  - name: ProjectSegment
    parent: ResurfacingProject
    common_fields: true
    description: "Junction row: one segment's treatment inside one project. Two independent dimensions: work_state and notice_state (resident notification, parking restriction, driveway access)."
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> ResurfacingProject.id; the bundle this line belongs to" }
      - { name: segment_id, type: string, source: input, description: "FK -> NetworkSegment.id; the segment being treated" }
      - { name: candidate_id, type: string, source: input, description: "FK -> TreatmentCandidate.id; the funded candidate this line executes" }
      - { name: treatment_type, type: enum, source: system, description: "Copied from the candidate at creation", constraints: "CRACK_SEAL | MILL_AND_OVERLAY | RECONSTRUCTION" }
      - { name: line_area_sy, type: number, source: system, description: "Copied from NetworkSegment.area_sy at creation", constraints: "2 decimals" }
      - { name: line_cost_cents, type: integer, source: computed, description: "Per-line construction cost, rounded before summation — calculations.project_bundle_base_cents step 1" }
      - { name: design_thickness_in, type: number, source: input, description: "Design lift thickness used by the thickness pay factor", default: 2.0, constraints: "0.5..12.0" }
      - { name: work_window_start, type: datetime, source: input, description: "Start of this line's construction occupancy of the segment; compared as a HALF-OPEN interval [start, end) against other lines on the same NetworkSegment" }
      - { name: work_window_end, type: datetime, source: input, description: "End of this line's construction occupancy, exclusive — a line may start exactly when another ends" }
      - { name: work_state, type: enum, source: system, description: "Construction dimension — see state_machines.ProjectSegment (work)", default: PLANNED, constraints: "PLANNED | IN_PROGRESS | WORK_COMPLETE | REMEDIATION_REQUIRED | ACCEPTED | REMOVED" }
      - { name: notice_state, type: enum, source: system, description: "Resident-notification dimension, evolves independently of work_state — see state_machines.ProjectSegment (notice)", default: PENDING, constraints: "PENDING | SCHEDULED | DELIVERED" }
      - { name: parking_restriction_start, type: datetime, source: system, description: "Start of the no-parking window published to residents; null until scheduled", default: null }
      - { name: parking_restriction_end, type: datetime, source: system, description: "End of the no-parking window; null until scheduled", default: null }
      - { name: driveway_access_plan, type: enum, source: system, description: "Driveway access commitment published with the notice; null until scheduled", default: null, constraints: "MAINTAINED | LIMITED_NIGHTLY | BLOCKED_WITH_ALT" }
      - { name: notice_delivered_at, type: datetime, source: system, description: "Logical-clock instant the notice was delivered; null until DELIVERED", default: null }
      - { name: notice_round, type: integer, source: system, description: "1 on first schedule, incremented on every reschedule", default: 1 }
      - { name: pay_factor, type: number, source: computed, description: "Pay factor of the decided AcceptanceTest with the highest test_round on this line — calculations.acceptance_pay_factor; null until a test is decided", default: null }
      - { name: test_count, type: integer, source: computed, description: "Count of AcceptanceTest rows on this line in any test_status", default: 0 }

  - name: UtilityCoordination
    parent: ResurfacingProject
    common_fields: true
    description: "Clearance round with one utility owner before resurfacing. Cyclic: a declared conflict routes through scheduled utility work and back into a fresh clearance request."
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ResurfacingProject.id; the project seeking clearance" }
      - { name: utility, type: enum, source: system, description: "Utility owner on the coordination roster", constraints: "WATER | SEWER | FRANCHISE_GAS | FRANCHISE_TELECOM" }
      - { name: coordination_status, type: enum, source: system, description: "Lifecycle — see state_machines.UtilityCoordination", default: CLEARANCE_REQUESTED, constraints: "CLEARANCE_REQUESTED | CONFLICT_DECLARED | WORK_SCHEDULED | WORK_COMPLETE | CLEARED | CLEARED_AFTER_WORK" }
      - { name: planned_work_start, type: datetime, source: system, description: "Utility's planned work window start, recorded when a conflict is declared with a schedule; null otherwise", default: null }
      - { name: planned_work_end, type: datetime, source: system, description: "Utility's planned work window end; null otherwise", default: null }
      - { name: work_completed_at, type: datetime, source: system, description: "Logical-clock instant the utility reported its work complete", default: null }
      - { name: round_count, type: integer, source: system, description: "Clearance round number; starts at 1, incremented on every re-request after utility work", default: 1 }
      - { name: response_note, type: string, source: system, description: "Latest note from the utility response", default: null }

  - name: CutPermit
    parent: NetworkSegment
    common_fields: true
    description: "A utility's request to cut into a segment. Moratorium on newly accepted pavement forces waiver review and a tiered degradation fee."
    fields:
      - { name: segment_id, type: string, source: input, description: "FK -> NetworkSegment.id; the segment to be cut" }
      - { name: applicant_utility, type: enum, source: input, description: "Utility asking for the cut", constraints: "WATER | SEWER | FRANCHISE_GAS | FRANCHISE_TELECOM" }
      - { name: requested_start, type: datetime, source: input, description: "Requested cut window start" }
      - { name: requested_end, type: datetime, source: input, description: "Requested cut window end", constraints: "> requested_start" }
      - { name: cut_area_sqft, type: number, source: input, description: "Trench area to be cut, square feet", constraints: "> 0" }
      - { name: emergency, type: boolean, source: input, description: "True for emergency repairs (leak, gas odor) — halves the moratorium multiplier, floored at 1.0", default: false }
      - { name: permit_status, type: enum, source: system, description: "Lifecycle — see state_machines.CutPermit; initial state depends on the segment's moratorium", constraints: "PENDING | MORATORIUM_REVIEW | APPROVED | DENIED" }
      - { name: moratorium_remaining_days, type: integer, source: computed, description: "Whole days from the logical clock to NetworkSegment.moratorium_until, floored at 0 — calculations.cut_permit_degradation_fee step 1", default: 0 }
      - { name: fee_multiplier, type: number, source: computed, description: "Moratorium tier multiplier after any emergency reduction — calculations.cut_permit_degradation_fee step 3", constraints: "1 decimal" }
      - { name: degradation_fee_cents, type: integer, source: computed, description: "Pavement degradation fee charged to the utility — calculations.cut_permit_degradation_fee" }
      - { name: waiver_reason, type: string, source: system, description: "Justification recorded when a MORATORIUM_REVIEW permit is approved; null otherwise", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock instant of the approve/deny decision", default: null }
      - { name: cut_completed_at, type: datetime, source: system, description: "Logical-clock instant the utility reported the trench backfilled and restored; null while the cut is open. An APPROVED permit with a null value blocks the paving crew (ERR_OPEN_CUT_ON_SEGMENT).", default: null }

  - name: AcceptanceTest
    parent: ProjectSegment
    common_fields: true
    description: "Pavement quality acceptance test on one project line. Cyclic: a failed test can be retested, superseding the prior round."
    fields:
      - { name: project_segment_id, type: string, source: input, description: "FK -> ProjectSegment.id; the line under test" }
      - { name: core_density_pct, type: number, source: input, description: "In-place density as a percentage of the reference maximum", constraints: "70..105, 1 decimal" }
      - { name: iri_in_per_mi, type: number, source: input, description: "As-built smoothness, inches per mile", constraints: ">= 0, <= 400" }
      - { name: thickness_in, type: number, source: input, description: "Measured core thickness, inches", constraints: "> 0, 2 decimals" }
      - { name: witness_inspector_user_id, type: string, source: input, description: "X-User-ID of the Inspector who witnessed coring; may not later sign the project's final acceptance (segregation of duties)" }
      - { name: test_round, type: integer, source: system, description: "1 for the first test on the line, incremented for each retest", default: 1 }
      - { name: computed_pay_factor, type: number, source: computed, description: "Composite pay factor — calculations.acceptance_pay_factor", constraints: "4 decimals" }
      - { name: computed_outcome, type: enum, source: computed, description: "System verdict from the pay factor components — calculations.acceptance_pay_factor step 5", constraints: "PASS | FAIL" }
      - { name: test_status, type: enum, source: system, description: "Lifecycle — see state_machines.AcceptanceTest", default: SUBMITTED, constraints: "SUBMITTED | PASSED | FAILED | RETEST_ORDERED | SUPERSEDED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the Inspector who decided this test; null while SUBMITTED", default: null }
      - { name: decision_note, type: string, source: system, description: "Note recorded with the decision", default: null }

  - name: ServiceRequest
    parent: NetworkSegment
    common_fields: true
    description: "Resident complaint / pothole report. Branching: triage either schedules a patch or defers the segment to the capital program."
    fields:
      - { name: segment_id, type: string, source: input, description: "FK -> NetworkSegment.id; the complained-about segment" }
      - { name: capital_project_id, type: string, source: system, description: "FK -> ResurfacingProject.id; set when triage defers the complaint to a capital project, null otherwise", default: null }
      - { name: complaint_type, type: enum, source: input, description: "What the resident reported", constraints: "POTHOLE | CRACKING | PONDING | UTILITY_CUT_SETTLEMENT" }
      - { name: reported_severity, type: enum, source: input, description: "Resident-reported severity; drives the SLA clock", constraints: "LOW | MEDIUM | HIGH" }
      - { name: location_note, type: string, source: input, description: "Free-text location detail", constraints: "1..200 chars" }
      - { name: request_status, type: enum, source: system, description: "Lifecycle — see state_machines.ServiceRequest", default: NEW, constraints: "NEW | TRIAGED_PATCH | DEFERRED_TO_CAPITAL | CLOSED_PATCHED | CLOSED_BY_CAPITAL | CLOSED_DUPLICATE" }
      - { name: sla_due_at, type: datetime, source: computed, description: "created_at + SLA_HOURS[reported_severity] — calculations.service_request_sla" }
      - { name: sla_breached, type: boolean, source: computed, description: "True when the closing instant (or the logical clock while open) is strictly after sla_due_at — calculations.service_request_sla step 2", default: false }
      - { name: triaged_at, type: datetime, source: system, description: "Logical-clock instant of triage; null while NEW", default: null }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock instant of closure; null while open", default: null }
      - { name: closure_code, type: enum, source: system, description: "Why the request closed; null while open", default: null, constraints: "PATCHED | CAPITAL_RESURFACED | DUPLICATE" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- survey ---
  - entity: ConditionSurvey
    initial_state: OPEN
    terminal_states: [SEALED]
    shape: linear
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /pavement/condition-surveys/{id}/seal"
        actor: PavementEngineer
        preconditions:
          - "survey_status == OPEN"
          - "accepted_observation_count >= 1 (else ERR_SURVEY_HAS_NO_ACCEPTED_OBSERVATIONS)"
          - "no DistressObservation on this survey has qc_status == PENDING (else ERR_OBSERVATIONS_PENDING_QC)"
        side_effects:
          - "stamps sealed_at = logical clock now"
          - "computes network_condition_index per calculations.network_condition_index"
          - "CASCADE L1: for every DistressObservation on this survey with qc_status == ACCEPTED, sets its NetworkSegment.condition_index = observation.measured_condition_index, condition_index_source = SURVEY_MEASURED, and recomputes condition_band"
          - "CASCADE L2: because those segments' condition_index changed, every TreatmentCandidate with candidate_status IN {RECOMMENDED, OVERRIDDEN} whose segment_id is one of those segments and whose survey_id != this survey moves to SUPERSEDED"
          - "CASCADE L3: because those candidates became SUPERSEDED, every ScenarioAllocation referencing them with allocation_status IN {FUNDED, DEFERRED} moves to WITHDRAWN and its allocated_cents is set to 0"
          - "CASCADE L4: because those allocations were withdrawn, each affected BudgetScenario recomputes allocation_count, funded_cost_cents and backlog_cents"
        note: "Sealing is the only way a survey leaves OPEN; there is no un-seal."

  # ----------------------------------------------------------- observation ---
  - entity: DistressObservation
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    shape: branching_with_revisit
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /pavement/distress-observations/{id}/qc with qc_decision == ACCEPT"
        actor: PavementEngineer
        preconditions:
          - "parent ConditionSurvey.survey_status == OPEN (else ERR_SURVEY_NOT_OPEN)"
          - "qc_status IN {PENDING, FLAGGED} (else ERR_OBSERVATION_ALREADY_DECIDED)"
        side_effects:
          - "records qc_note"
          - "increments ConditionSurvey.accepted_observation_count"
      - from: PENDING
        to: FLAGGED
        trigger: "POST /pavement/distress-observations/{id}/qc with qc_decision == FLAG"
        actor: PavementEngineer
        preconditions:
          - "parent ConditionSurvey.survey_status == OPEN"
          - "qc_status == PENDING"
        side_effects:
          - "records qc_note; observation remains excluded from accepted_observation_count and from the seal cascade until re-decided"
      - from: PENDING
        to: REJECTED
        trigger: "POST /pavement/distress-observations/{id}/qc with qc_decision == REJECT"
        actor: PavementEngineer
        preconditions:
          - "parent ConditionSurvey.survey_status == OPEN"
          - "qc_status IN {PENDING, FLAGGED}"
        side_effects:
          - "records qc_note; observation never contributes to condition_index"
      - from: FLAGGED
        to: ACCEPTED
        trigger: "POST /pavement/distress-observations/{id}/qc with qc_decision == ACCEPT"
        actor: PavementEngineer
        preconditions:
          - "parent ConditionSurvey.survey_status == OPEN"
          - "qc_status == FLAGGED"
        side_effects:
          - "records qc_note"
          - "increments ConditionSurvey.accepted_observation_count"
        note: "FLAGGED is revisitable; ACCEPTED and REJECTED are terminal."
      - from: FLAGGED
        to: REJECTED
        trigger: "POST /pavement/distress-observations/{id}/qc with qc_decision == REJECT"
        actor: PavementEngineer
        preconditions:
          - "parent ConditionSurvey.survey_status == OPEN"
          - "qc_status == FLAGGED"
        side_effects:
          - "records qc_note"

  # ------------------------------------------------------------- candidate ---
  - entity: TreatmentCandidate
    initial_state: RECOMMENDED
    terminal_states: [SUPERSEDED]
    shape: cyclic
    transitions:
      - from: RECOMMENDED
        to: OVERRIDDEN
        trigger: "POST /pavement/treatment-candidates/{id}/override"
        actor: PavementEngineer
        preconditions:
          - "candidate_status == RECOMMENDED (else ERR_CANDIDATE_NOT_OVERRIDABLE)"
          - "requested treatment_type != current treatment_type (else ERR_INVALID_REQUEST)"
          - "no BudgetScenario on this candidate's survey has scenario_status == ADOPTED (else ERR_SURVEY_PROGRAM_LOCKED)"
        side_effects:
          - "sets treatment_type to the requested value and records override_reason"
          - "recomputes expected_service_life_years, treatment_pci_gain, estimated_cost_cents and benefit_cost_ratio from the new treatment_type using the unchanged selection_condition_index snapshot"
      - from: RECOMMENDED
        to: CONSUMED
        trigger: "POST /pavement/project-segments (this candidate placed into a project bundle)"
        actor: PavementEngineer
        preconditions:
          - "candidate_status IN {RECOMMENDED, OVERRIDDEN}"
        side_effects:
          - "candidate is locked against override while consumed"
      - from: OVERRIDDEN
        to: CONSUMED
        trigger: "POST /pavement/project-segments (this candidate placed into a project bundle)"
        actor: PavementEngineer
        preconditions:
          - "candidate_status IN {RECOMMENDED, OVERRIDDEN}"
        side_effects:
          - "candidate is locked against override while consumed"
      - from: CONSUMED
        to: RECOMMENDED
        trigger: "DELETE /pavement/project-segments/{id} (the consuming line is removed)"
        actor: PavementEngineer
        preconditions:
          - "the removed ProjectSegment.work_state == PLANNED"
          - "override_reason IS NULL"
        side_effects:
          - "candidate returns to the scenario's re-plannable pool"
        note: "Conditional restore: candidates that carry an override_reason return to OVERRIDDEN instead."
      - from: CONSUMED
        to: OVERRIDDEN
        trigger: "DELETE /pavement/project-segments/{id} (the consuming line is removed)"
        actor: PavementEngineer
        preconditions:
          - "the removed ProjectSegment.work_state == PLANNED"
          - "override_reason IS NOT NULL"
        side_effects:
          - "candidate returns to the pool with its override intact"
      - from: RECOMMENDED
        to: SUPERSEDED
        trigger: "system — POST /pavement/condition-surveys/{id}/seal on a later survey covering the same segment (CASCADE L2)"
        actor: system
        preconditions:
          - "a newer ConditionSurvey sealed with an ACCEPTED observation on this candidate's segment_id"
        side_effects:
          - "cascades WITHDRAWN onto every ScenarioAllocation referencing this candidate"
      - from: OVERRIDDEN
        to: SUPERSEDED
        trigger: "system — POST /pavement/condition-surveys/{id}/seal on a later survey covering the same segment (CASCADE L2)"
        actor: system
        preconditions:
          - "a newer ConditionSurvey sealed with an ACCEPTED observation on this candidate's segment_id"
        side_effects:
          - "cascades WITHDRAWN onto every ScenarioAllocation referencing this candidate"

  # -------------------------------------------------------------- scenario ---
  - entity: BudgetScenario
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: COMPUTED
        trigger: "POST /pavement/budget-scenarios/{id}/run"
        actor: PavementEngineer
        preconditions:
          - "scenario_status IN {DRAFT, COMPUTED} (else ERR_SCENARIO_NOT_RUNNABLE)"
          - "parent ConditionSurvey.survey_status == SEALED"
        side_effects:
          - "creates one ScenarioAllocation per pool candidate per calculations.scenario_waterfall_allocation (allocation_status FUNDED or DEFERRED, source AUTO_RUN)"
          - "recomputes allocation_count, funded_cost_cents, backlog_cents, uncommitted_cents"
          - "computes projected_network_pci and do_nothing_network_pci per calculations.projected_network_pci"
      - from: COMPUTED
        to: COMPUTED
        trigger: "POST /pavement/budget-scenarios/{id}/run (re-run after funding or override changes)"
        actor: PavementEngineer
        preconditions:
          - "scenario_status == COMPUTED"
          - "no ResurfacingProject on this scenario has delivery_status != DRAFT (else ERR_SCENARIO_HAS_PROGRAMMED_PROJECTS)"
        side_effects:
          - "deletes every ScenarioAllocation on this scenario with source == AUTO_RUN, then re-allocates from the current candidate pool"
          - "MANUAL_ADD allocations survive the re-run and keep their rank"
          - "recomputes allocation_count, funded_cost_cents, backlog_cents, projected_network_pci, do_nothing_network_pci"
        note: "Cycle: a scenario can be re-run any number of times while nothing is committed."
      - from: COMPUTED
        to: ADOPTED
        trigger: "POST /pavement/budget-scenarios/{id}/adopt"
        actor: BudgetOfficer
        preconditions:
          - "scenario_status == COMPUTED (else ERR_SCENARIO_NOT_ADOPTABLE)"
          - "allocation_count >= 1"
        side_effects:
          - "every other BudgetScenario on the same survey_id with scenario_status == ADOPTED moves to SUPERSEDED"
          - "sets uncommitted_cents = funding_cents - committed_cents"
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system — POST /pavement/budget-scenarios/{id}/adopt on a sibling scenario of the same survey"
        actor: system
        preconditions:
          - "scenario_status == ADOPTED"
          - "a sibling scenario on the same survey_id is being adopted"
        side_effects:
          - "projects already created under the superseded scenario keep their scenario_id but can no longer receive new awards (ERR_SCENARIO_NOT_ADOPTED)"

  # ------------------------------------------------------------ allocation ---
  - entity: ScenarioAllocation
    initial_state: FUNDED
    terminal_states: [WITHDRAWN]
    shape: linear
    transitions:
      - from: FUNDED
        to: WITHDRAWN
        trigger: "system — CASCADE L3 of POST /pavement/condition-surveys/{id}/seal"
        actor: system
        preconditions:
          - "the referenced TreatmentCandidate moved to SUPERSEDED"
        side_effects:
          - "sets allocated_cents = 0"
          - "parent BudgetScenario recomputes allocation_count, funded_cost_cents, backlog_cents"
      - from: DEFERRED
        to: WITHDRAWN
        trigger: "system — CASCADE L3 of POST /pavement/condition-surveys/{id}/seal"
        actor: system
        preconditions:
          - "the referenced TreatmentCandidate moved to SUPERSEDED"
        side_effects:
          - "parent BudgetScenario recomputes allocation_count and backlog_cents"
    note: "DEFERRED is the other initial value the waterfall may assign at creation; FUNDED and DEFERRED never convert into each other without a re-run (which deletes AUTO_RUN rows outright)."

  # ------------------------------------------------- project (delivery dim) ---
  - entity: ResurfacingProject
    dimension: delivery_status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    shape: parallel
    transitions:
      - from: DRAFT
        to: COORDINATING
        trigger: "POST /pavement/projects/{id}/advance with action == START_COORDINATION"
        actor: PavementEngineer
        preconditions:
          - "delivery_status == DRAFT (else ERR_PROJECT_NOT_DRAFT)"
          - "segment_count >= 1 (else ERR_PROJECT_HAS_NO_SEGMENTS)"
        side_effects:
          - "creates four UtilityCoordination rows (WATER, SEWER, FRANCHISE_GAS, FRANCHISE_TELECOM), each coordination_status CLEARANCE_REQUESTED, round_count 1"
          - "sets clearance_outstanding_count = 4"
      - from: COORDINATING
        to: BID_READY
        trigger: "POST /pavement/projects/{id}/advance with action == BID_READY"
        actor: PavementEngineer
        preconditions:
          - "delivery_status == COORDINATING (else ERR_PROJECT_NOT_COORDINATING)"
          - "segment_count >= 1 (else ERR_PROJECT_HAS_NO_SEGMENTS)"
          - "clearance_outstanding_count == 0 — every UtilityCoordination on the project is CLEARED or CLEARED_AFTER_WORK (else ERR_UTILITY_CLEARANCE_PENDING)"
        side_effects:
          - "recomputes bundle_base_cents, contingency_cents, utility_share_cents and project_total_estimate_cents"
      - from: BID_READY
        to: AWARDED
        trigger: "POST /pavement/projects/{id}/award"
        actor: BudgetOfficer
        preconditions:
          - "delivery_status == BID_READY (else ERR_PROJECT_NOT_BID_READY)"
          - "parent BudgetScenario.scenario_status == ADOPTED (else ERR_SCENARIO_NOT_ADOPTED)"
          - "Contractor.standing == GOOD_STANDING (else ERR_CONTRACTOR_NOT_IN_GOOD_STANDING)"
          - "contractor capacity per validations[priority=70] (else ERR_CONTRACTOR_CAPACITY_EXCEEDED)"
          - "award_amount_cents <= BudgetScenario.uncommitted_cents (else ERR_SCENARIO_FUNDS_EXCEEDED)"
        side_effects:
          - "sets contractor_id and award_amount_cents"
          - "parent BudgetScenario.committed_cents += award_amount_cents and uncommitted_cents = funding_cents - committed_cents"
          - "increments BudgetScenario.version by 1"
      - from: AWARDED
        to: BID_READY
        trigger: "POST /pavement/projects/{id}/cancel-award"
        actor: BudgetOfficer
        preconditions:
          - "delivery_status == AWARDED (else ERR_PROJECT_NOT_AWARDED)"
        side_effects:
          - "COMPENSATION: parent BudgetScenario.committed_cents -= the project's award_amount_cents and uncommitted_cents = funding_cents - committed_cents, restoring calculations.scenario_funding_conservation exactly"
          - "clears contractor_id and award_amount_cents to null"
          - "increments BudgetScenario.version by 1"
      - from: AWARDED
        to: IN_CONSTRUCTION
        trigger: "POST /pavement/projects/{id}/advance with action == START_CONSTRUCTION"
        actor: PavementEngineer
        preconditions:
          - "delivery_status == AWARDED (else ERR_PROJECT_NOT_AWARDED)"
          - "every ProjectSegment with work_state != REMOVED has notice_state == DELIVERED (else ERR_NOTICES_NOT_DELIVERED)"
          - "no NetworkSegment under a non-REMOVED line has an APPROVED CutPermit with cut_completed_at IS NULL (else ERR_OPEN_CUT_ON_SEGMENT)"
        side_effects:
          - "every ProjectSegment with work_state == PLANNED moves to IN_PROGRESS"
          - "each affected NetworkSegment keeps active_project_count unchanged (PLANNED and IN_PROGRESS both count as active)"
      - from: IN_CONSTRUCTION
        to: SUBSTANTIALLY_COMPLETE
        trigger: "POST /pavement/projects/{id}/substantial-completion"
        actor: Contractor
        preconditions:
          - "delivery_status == IN_CONSTRUCTION (else ERR_PROJECT_NOT_IN_CONSTRUCTION)"
          - "X-User-ID == contractor_id (else ERR_NOT_PROJECT_CONTRACTOR)"
          - "no ProjectSegment on the project has work_state IN {PLANNED, IN_PROGRESS} (else ERR_LINES_WORK_INCOMPLETE)"
        side_effects:
          - "stamps substantial_completion_at = logical clock now and computes days_late = max(0, whole days from planned_end_date to substantial_completion_at)"
          - "Contractor.interim_performance_score is recomputed (schedule component now uses realized lateness) and standing re-derived"
      - from: SUBSTANTIALLY_COMPLETE
        to: ACCEPTED
        trigger: "POST /pavement/projects/{id}/accept"
        actor: Inspector
        preconditions:
          - "delivery_status == SUBSTANTIALLY_COMPLETE (else ERR_PROJECT_NOT_SUBSTANTIALLY_COMPLETE)"
          - "quality_status == QUALITY_ACCEPTED (else ERR_REMEDIATION_OUTSTANDING)"
          - "X-User-ID is not the witness_inspector_user_id of any AcceptanceTest on this project (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "stamps accepted_at and accepting_inspector_user_id"
          - "CASCADE L1: every ProjectSegment with work_state == WORK_COMPLETE moves to ACCEPTED"
          - "CASCADE L2: because each line was accepted, its NetworkSegment records last_treatment_type = line.treatment_type, last_treatment_date = accepted_at, baseline_condition_index = min(100.0, condition_index + candidate.treatment_pci_gain), condition_index = that same value, condition_index_source = MODEL_PROJECTED, condition_band recomputed, active_project_count decremented, and moratorium_until = accepted_at + MORATORIUM_YEARS[line.treatment_type] where MORATORIUM_YEARS = { CRACK_SEAL: 1, MILL_AND_OVERLAY: 3, RECONSTRUCTION: 5 } calendar years"
          - "CASCADE L3: because moratorium_until advanced on those segments, every CutPermit on them with permit_status == PENDING moves to MORATORIUM_REVIEW and its moratorium_remaining_days, fee_multiplier and degradation_fee_cents are recomputed against the new moratorium"
          - "CASCADE L4: because those segments were resurfaced under this project, every ServiceRequest on them with request_status == DEFERRED_TO_CAPITAL and capital_project_id == this project moves to CLOSED_BY_CAPITAL with closure_code CAPITAL_RESURFACED, closed_at = accepted_at, and the segment's open_service_request_count is decremented"
          - "Contractor.accepted_project_count += 1, days_late_total += days_late, final_performance_score and interim_performance_score recomputed, standing re-derived"

  # -------------------------------------------------- project (quality dim) ---
  - entity: ResurfacingProject
    dimension: quality_status
    initial_state: NOT_STARTED
    terminal_states: []
    shape: parallel
    transitions:
      - from: NOT_STARTED
        to: TESTING
        trigger: "system — POST /pavement/acceptance-tests (first test submitted on any line of the project)"
        actor: system
        preconditions:
          - "quality_status == NOT_STARTED"
        side_effects:
          - "delivery_status is untouched — the two dimensions advance independently"
      - from: TESTING
        to: REMEDIATION_REQUIRED
        trigger: "system — CASCADE L2 of POST /pavement/acceptance-tests/{id}/decide with decision == FAIL"
        actor: system
        preconditions:
          - "a ProjectSegment on this project entered work_state == REMEDIATION_REQUIRED"
        side_effects:
          - "open_remediation_count = count of ProjectSegment rows with work_state == REMEDIATION_REQUIRED"
          - "CASCADE L3: because the project's quality_status became REMEDIATION_REQUIRED, Contractor.remediation_event_count += 1, interim_performance_score is recomputed and standing re-derived"
      - from: REMEDIATION_REQUIRED
        to: TESTING
        trigger: "system — POST /pavement/acceptance-tests (retest submitted for the remediated line, which returns it to IN_PROGRESS)"
        actor: system
        preconditions:
          - "open_remediation_count reaches 0 after the line leaves REMEDIATION_REQUIRED"
        side_effects:
          - "Contractor.remediation_event_count is NOT decremented — the event is historical"
        note: "Cycle: quality can bounce TESTING → REMEDIATION_REQUIRED → TESTING once per failed line."
      - from: TESTING
        to: QUALITY_ACCEPTED
        trigger: "system — POST /pavement/acceptance-tests/{id}/decide with decision == PASS (bubble-up)"
        actor: system
        preconditions:
          - "open_remediation_count == 0"
          - "every ProjectSegment with work_state != REMOVED has work_state == WORK_COMPLETE"
        side_effects:
          - "unlocks the SUBSTANTIALLY_COMPLETE → ACCEPTED delivery transition"

  # ---------------------------------------------- project segment (work dim) ---
  - entity: ProjectSegment
    dimension: work_state
    initial_state: PLANNED
    terminal_states: [ACCEPTED, REMOVED]
    shape: cyclic
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "system — POST /pavement/projects/{id}/advance with action == START_CONSTRUCTION"
        actor: system
        preconditions:
          - "parent ResurfacingProject.delivery_status transitions AWARDED → IN_CONSTRUCTION"
        side_effects:
          - "line becomes eligible for acceptance-test submission"
      - from: IN_PROGRESS
        to: WORK_COMPLETE
        trigger: "system — POST /pavement/acceptance-tests/{id}/decide with decision == PASS"
        actor: system
        preconditions:
          - "the decided AcceptanceTest has the highest test_round on this line"
        side_effects:
          - "sets pay_factor = the decided test's computed_pay_factor"
          - "bubbles up to parent quality_status per state_machines.ResurfacingProject (quality)"
      - from: IN_PROGRESS
        to: REMEDIATION_REQUIRED
        trigger: "system — CASCADE L1 of POST /pavement/acceptance-tests/{id}/decide with decision == FAIL"
        actor: system
        preconditions:
          - "the decided AcceptanceTest has the highest test_round on this line"
        side_effects:
          - "sets pay_factor = the failed test's computed_pay_factor"
          - "CASCADE L2: because this line entered REMEDIATION_REQUIRED, parent ResurfacingProject.open_remediation_count += 1 and quality_status moves TESTING → REMEDIATION_REQUIRED"
      - from: REMEDIATION_REQUIRED
        to: IN_PROGRESS
        trigger: "system — POST /pavement/acceptance-tests (retest submitted on this line)"
        actor: system
        preconditions:
          - "a new AcceptanceTest is submitted with test_round = prior max + 1"
        side_effects:
          - "the prior FAILED / RETEST_ORDERED test on this line moves to SUPERSEDED"
          - "parent ResurfacingProject.open_remediation_count -= 1"
        note: "Cycle: IN_PROGRESS → REMEDIATION_REQUIRED → IN_PROGRESS repeats per failed round."
      - from: WORK_COMPLETE
        to: ACCEPTED
        trigger: "system — CASCADE L1 of POST /pavement/projects/{id}/accept"
        actor: system
        preconditions:
          - "parent ResurfacingProject.delivery_status transitions SUBSTANTIALLY_COMPLETE → ACCEPTED"
        side_effects:
          - "drives CASCADE L2..L4 onto NetworkSegment, CutPermit and ServiceRequest"
      - from: PLANNED
        to: REMOVED
        trigger: "DELETE /pavement/project-segments/{id}"
        actor: PavementEngineer
        preconditions:
          - "work_state == PLANNED (else ERR_PROJECT_SEGMENT_NOT_REMOVABLE)"
          - "parent ResurfacingProject.delivery_status IN {DRAFT, COORDINATING} (else ERR_PROJECT_SCOPE_LOCKED)"
        side_effects:
          - "COMPENSATION: parent ResurfacingProject.segment_count -= 1 and planned_area_sy -= line_area_sy, restoring calculations.project_area_conservation exactly"
          - "NetworkSegment.active_project_count -= 1"
          - "TreatmentCandidate returns to RECOMMENDED or OVERRIDDEN per state_machines.TreatmentCandidate"
          - "recomputes bundle_base_cents, contingency_cents, utility_share_cents, project_total_estimate_cents"
          - "increments ResurfacingProject.version by 1"

  # -------------------------------------------- project segment (notice dim) ---
  - entity: ProjectSegment
    dimension: notice_state
    initial_state: PENDING
    terminal_states: []
    shape: cyclic
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /pavement/project-segments/{id}/notice with action == SCHEDULE"
        actor: PavementEngineer
        preconditions:
          - "notice_state == PENDING (else ERR_NOTICE_ALREADY_SCHEDULED)"
          - "work_state IN {PLANNED, IN_PROGRESS, REMEDIATION_REQUIRED} (else ERR_LINE_NOT_NOTIFIABLE)"
          - "parking window and driveway plan supplied (else ERR_INVALID_REQUEST)"
          - "no NOTICE_BUFFER_HOURS conflict per validations[priority=70] (else ERR_NOTICE_WINDOW_CONFLICT)"
          - "parking_restriction_start >= logical clock now + NOTICE_LEAD_HOURS, checked BEFORE the window-conflict test (else ERR_NOTICE_LEAD_TIME_TOO_SHORT)"
        side_effects:
          - "records parking_restriction_start, parking_restriction_end, driveway_access_plan; notice_round stays 1"
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /pavement/project-segments/{id}/notice with action == DELIVER"
        actor: PavementEngineer
        preconditions:
          - "notice_state == SCHEDULED (else ERR_NOTICE_NOT_SCHEDULED)"
          - "no lead-time re-check at delivery — the 72-hour gate was enforced when the window was scheduled"
        side_effects:
          - "stamps notice_delivered_at = logical clock now"
          - "unblocks the project's BID_READY and START_CONSTRUCTION preconditions for this line"
      - from: DELIVERED
        to: SCHEDULED
        trigger: "POST /pavement/project-segments/{id}/notice with action == RESCHEDULE"
        actor: PavementEngineer
        preconditions:
          - "notice_state == DELIVERED (else ERR_NOTICE_NOT_DELIVERED)"
          - "work_state != ACCEPTED"
          - "new window supplied and free of NOTICE_BUFFER_HOURS conflicts (else ERR_NOTICE_WINDOW_CONFLICT)"
          - "new parking_restriction_start >= logical clock now + NOTICE_LEAD_HOURS (else ERR_NOTICE_LEAD_TIME_TOO_SHORT), checked BEFORE the window-conflict test"
        side_effects:
          - "overwrites the parking window and driveway plan, clears notice_delivered_at to null, increments notice_round by 1"
        note: "Cycle: DELIVERED → SCHEDULED → DELIVERED can repeat; each round re-arms the 72-hour lead-time gate."

  # ------------------------------------------------- utility coordination ---
  - entity: UtilityCoordination
    initial_state: CLEARANCE_REQUESTED
    terminal_states: [CLEARED, CLEARED_AFTER_WORK]
    shape: cyclic
    transitions:
      - from: CLEARANCE_REQUESTED
        to: CLEARED
        trigger: "POST /pavement/utility-coordinations/{id}/respond with response == CLEAR"
        actor: UtilityCoordinator
        preconditions:
          - "coordination_status == CLEARANCE_REQUESTED (else ERR_COORDINATION_NOT_PENDING)"
          - "round_count == 1"
        side_effects:
          - "parent ResurfacingProject.clearance_outstanding_count -= 1"
      - from: CLEARANCE_REQUESTED
        to: CLEARED_AFTER_WORK
        trigger: "POST /pavement/utility-coordinations/{id}/respond with response == CLEAR"
        actor: UtilityCoordinator
        preconditions:
          - "coordination_status == CLEARANCE_REQUESTED"
          - "round_count >= 2 — the utility already performed work in an earlier round"
        side_effects:
          - "parent ResurfacingProject.clearance_outstanding_count -= 1"
          - "parent ResurfacingProject.utility_share_cents becomes non-zero on the next estimate recompute per calculations.project_total_estimate_cents step 3"
      - from: CLEARANCE_REQUESTED
        to: CONFLICT_DECLARED
        trigger: "POST /pavement/utility-coordinations/{id}/respond with response == CONFLICT"
        actor: UtilityCoordinator
        preconditions:
          - "coordination_status == CLEARANCE_REQUESTED"
        side_effects:
          - "records response_note; clearance_outstanding_count is unchanged (still outstanding)"
      - from: CONFLICT_DECLARED
        to: WORK_SCHEDULED
        trigger: "POST /pavement/utility-coordinations/{id}/respond with response == SCHEDULE_WORK"
        actor: UtilityCoordinator
        preconditions:
          - "coordination_status == CONFLICT_DECLARED (else ERR_COORDINATION_NOT_IN_CONFLICT)"
          - "planned_work_start and planned_work_end supplied with planned_work_end > planned_work_start (else ERR_INVALID_REQUEST)"
          - "planned_work_end <= parent ResurfacingProject.planned_start_date (else ERR_UTILITY_WORK_AFTER_PAVING)"
        side_effects:
          - "records planned_work_start, planned_work_end"
      - from: WORK_SCHEDULED
        to: WORK_COMPLETE
        trigger: "POST /pavement/utility-coordinations/{id}/complete-work"
        actor: UtilityCoordinator
        preconditions:
          - "coordination_status == WORK_SCHEDULED (else ERR_COORDINATION_WORK_NOT_SCHEDULED)"
        side_effects:
          - "stamps work_completed_at = logical clock now"
      - from: WORK_COMPLETE
        to: CLEARANCE_REQUESTED
        trigger: "POST /pavement/utility-coordinations/{id}/respond with response == RE_REQUEST"
        actor: UtilityCoordinator
        preconditions:
          - "coordination_status == WORK_COMPLETE (else ERR_COORDINATION_NOT_WORK_COMPLETE)"
        side_effects:
          - "increments round_count by 1"
        note: "Cycle: CLEARANCE_REQUESTED → CONFLICT_DECLARED → WORK_SCHEDULED → WORK_COMPLETE → CLEARANCE_REQUESTED; round_count records how many rounds were needed and decides whether the terminal state is CLEARED or CLEARED_AFTER_WORK."

  # ------------------------------------------------------------ cut permit ---
  - entity: CutPermit
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    shape: branching
    transitions:
      - from: null
        to: PENDING
        trigger: "POST /pavement/cut-permits (segment has no active moratorium, or emergency == true)"
        actor: UtilityCoordinator
        preconditions:
          - "NetworkSegment.moratorium_until IS NULL OR moratorium_until <= logical clock now OR emergency == true"
        side_effects:
          - "computes moratorium_remaining_days, fee_multiplier, degradation_fee_cents per calculations.cut_permit_degradation_fee"
      - from: null
        to: MORATORIUM_REVIEW
        trigger: "POST /pavement/cut-permits (segment under moratorium and emergency == false)"
        actor: UtilityCoordinator
        preconditions:
          - "NetworkSegment.moratorium_until > logical clock now AND emergency == false"
        side_effects:
          - "computes moratorium_remaining_days, fee_multiplier, degradation_fee_cents per calculations.cut_permit_degradation_fee"
      - from: PENDING
        to: MORATORIUM_REVIEW
        trigger: "system — CASCADE L3 of POST /pavement/projects/{id}/accept"
        actor: system
        preconditions:
          - "the permit's NetworkSegment.moratorium_until advanced past the logical clock as a consequence of a line acceptance"
        side_effects:
          - "recomputes moratorium_remaining_days, fee_multiplier and degradation_fee_cents against the new moratorium_until"
      - from: PENDING
        to: APPROVED
        trigger: "POST /pavement/cut-permits/{id}/decide with decision == APPROVE"
        actor: PavementEngineer
        preconditions:
          - "permit_status == PENDING (else ERR_CUT_PERMIT_ALREADY_DECIDED)"
          - "no ProjectSegment on the segment has work_state == IN_PROGRESS (else ERR_CUT_BLOCKED_ACTIVE_CONSTRUCTION)"
        side_effects:
          - "stamps decided_at; degradation_fee_cents is frozen at its current value"
      - from: MORATORIUM_REVIEW
        to: APPROVED
        trigger: "POST /pavement/cut-permits/{id}/decide with decision == APPROVE and waiver_reason supplied"
        actor: PavementEngineer
        preconditions:
          - "permit_status == MORATORIUM_REVIEW"
          - "waiver_reason is a non-empty string (else ERR_MORATORIUM_WAIVER_REQUIRED)"
          - "no ProjectSegment on the segment has work_state == IN_PROGRESS (else ERR_CUT_BLOCKED_ACTIVE_CONSTRUCTION)"
        side_effects:
          - "records waiver_reason, stamps decided_at"
      - from: PENDING
        to: DENIED
        trigger: "POST /pavement/cut-permits/{id}/decide with decision == DENY"
        actor: PavementEngineer
        preconditions:
          - "permit_status IN {PENDING, MORATORIUM_REVIEW}"
        side_effects:
          - "stamps decided_at; degradation_fee_cents remains recorded for the record but is not charged"
      - from: MORATORIUM_REVIEW
        to: DENIED
        trigger: "POST /pavement/cut-permits/{id}/decide with decision == DENY"
        actor: PavementEngineer
        preconditions:
          - "permit_status IN {PENDING, MORATORIUM_REVIEW}"
        side_effects:
          - "stamps decided_at"

  # -------------------------------------------------------- acceptance test ---
  - entity: AcceptanceTest
    initial_state: SUBMITTED
    terminal_states: [PASSED, SUPERSEDED]
    shape: cyclic
    transitions:
      - from: SUBMITTED
        to: PASSED
        trigger: "POST /pavement/acceptance-tests/{id}/decide with decision == PASS"
        actor: Inspector
        preconditions:
          - "test_status == SUBMITTED (else ERR_TEST_ALREADY_DECIDED)"
          - "computed_outcome == PASS (else ERR_TEST_DECISION_CONFLICTS_COMPUTED)"
          - "X-User-ID != witness_inspector_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "records decided_by_user_id and decision_note"
          - "line ProjectSegment.work_state IN_PROGRESS → WORK_COMPLETE and pay_factor = computed_pay_factor"
          - "Contractor.passed_test_count += 1, interim_performance_score recomputed, standing re-derived"
          - "parent project quality_status may bubble TESTING → QUALITY_ACCEPTED"
      - from: SUBMITTED
        to: FAILED
        trigger: "POST /pavement/acceptance-tests/{id}/decide with decision == FAIL"
        actor: Inspector
        preconditions:
          - "test_status == SUBMITTED (else ERR_TEST_ALREADY_DECIDED)"
          - "X-User-ID != witness_inspector_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "records decided_by_user_id and decision_note"
          - "CASCADE L1: line ProjectSegment.work_state IN_PROGRESS → REMEDIATION_REQUIRED with pay_factor = computed_pay_factor"
          - "CASCADE L2: parent ResurfacingProject.open_remediation_count += 1 and quality_status TESTING → REMEDIATION_REQUIRED"
          - "CASCADE L3: Contractor.remediation_event_count += 1, failed_test_count += 1, interim_performance_score recomputed"
          - "CASCADE L4: because interim_performance_score dropped, Contractor.standing is re-derived to the band the new score implies — GOOD_STANDING → WATCH when the score lands in [60.0, 80.0), GOOD_STANDING → SUSPENDED when a contractor's only decided test fails and the score lands below 60.0, or WATCH → SUSPENDED"
      - from: SUBMITTED
        to: RETEST_ORDERED
        trigger: "POST /pavement/acceptance-tests/{id}/decide with decision == RETEST"
        actor: Inspector
        preconditions:
          - "test_status == SUBMITTED"
          - "X-User-ID != witness_inspector_user_id"
        side_effects:
          - "records decided_by_user_id; the line stays IN_PROGRESS and no contractor counter moves"
        note: "RETEST is the no-fault path: the inspector rejects the sample, not the work."
      - from: FAILED
        to: SUPERSEDED
        trigger: "system — POST /pavement/acceptance-tests (a higher test_round is submitted on the same line)"
        actor: system
        preconditions:
          - "a new AcceptanceTest on the same project_segment_id with test_round = this.test_round + 1"
        side_effects:
          - "line work_state REMEDIATION_REQUIRED → IN_PROGRESS and parent open_remediation_count -= 1"
      - from: RETEST_ORDERED
        to: SUPERSEDED
        trigger: "system — POST /pavement/acceptance-tests (a higher test_round is submitted on the same line)"
        actor: system
        preconditions:
          - "a new AcceptanceTest on the same project_segment_id with test_round = this.test_round + 1"
        side_effects:
          - "no work_state change — the line was already IN_PROGRESS"

  # -------------------------------------------------------- service request ---
  - entity: ServiceRequest
    initial_state: NEW
    terminal_states: [CLOSED_PATCHED, CLOSED_BY_CAPITAL, CLOSED_DUPLICATE]
    shape: branching
    transitions:
      - from: NEW
        to: TRIAGED_PATCH
        trigger: "POST /pavement/service-requests/{id}/triage with disposition == PATCH"
        actor: PavementEngineer
        preconditions:
          - "request_status == NEW (else ERR_SERVICE_REQUEST_NOT_NEW)"
        side_effects:
          - "stamps triaged_at; capital_project_id stays null"
      - from: NEW
        to: DEFERRED_TO_CAPITAL
        trigger: "POST /pavement/service-requests/{id}/triage with disposition == DEFER_TO_CAPITAL and target_project_id"
        actor: PavementEngineer
        preconditions:
          - "request_status == NEW (else ERR_SERVICE_REQUEST_NOT_NEW)"
          - "the target ResurfacingProject has delivery_status NOT IN {ACCEPTED} and contains a ProjectSegment on this ServiceRequest.segment_id with work_state != REMOVED (else ERR_TARGET_PROJECT_NOT_ELIGIBLE)"
        side_effects:
          - "stamps triaged_at and sets capital_project_id = target_project_id"
          - "divergent from the PATCH branch: the request now closes automatically with the capital project instead of by a patch crew"
      - from: TRIAGED_PATCH
        to: CLOSED_PATCHED
        trigger: "POST /pavement/service-requests/{id}/close with closure_code == PATCHED"
        actor: PavementEngineer
        preconditions:
          - "request_status == TRIAGED_PATCH (else ERR_SERVICE_REQUEST_NOT_TRIAGED)"
        side_effects:
          - "stamps closed_at, recomputes sla_breached against closed_at"
          - "NetworkSegment.open_service_request_count -= 1"
      - from: NEW
        to: CLOSED_DUPLICATE
        trigger: "POST /pavement/service-requests/{id}/close with closure_code == DUPLICATE"
        actor: PavementEngineer
        preconditions:
          - "request_status IN {NEW, TRIAGED_PATCH, DEFERRED_TO_CAPITAL}"
        side_effects:
          - "stamps closed_at; NetworkSegment.open_service_request_count -= 1; capital_project_id is left as-is for audit"
      - from: DEFERRED_TO_CAPITAL
        to: CLOSED_DUPLICATE
        trigger: "POST /pavement/service-requests/{id}/close with closure_code == DUPLICATE"
        actor: PavementEngineer
        preconditions:
          - "request_status IN {NEW, TRIAGED_PATCH, DEFERRED_TO_CAPITAL}"
        side_effects:
          - "stamps closed_at; NetworkSegment.open_service_request_count -= 1"
      - from: DEFERRED_TO_CAPITAL
        to: CLOSED_BY_CAPITAL
        trigger: "system — CASCADE L4 of POST /pavement/projects/{id}/accept"
        actor: system
        preconditions:
          - "capital_project_id == the accepted project and the request's segment was one of the accepted lines"
        side_effects:
          - "stamps closed_at = project.accepted_at, closure_code = CAPITAL_RESURFACED, recomputes sla_breached"
          - "NetworkSegment.open_service_request_count -= 1"

  # -------------------------------------------------- contractor standing ---
  - entity: Contractor
    initial_state: GOOD_STANDING
    terminal_states: []
    shape: cyclic
    transitions:
      - from: GOOD_STANDING
        to: WATCH
        trigger: "system — any recompute of interim_performance_score (acceptance-test decision, substantial completion, project acceptance)"
        actor: system
        preconditions:
          - "60.0 <= interim_performance_score < 80.0"
        side_effects:
          - "new awards are refused with ERR_CONTRACTOR_NOT_IN_GOOD_STANDING; existing awards continue"
      - from: WATCH
        to: SUSPENDED
        trigger: "system — any recompute of interim_performance_score"
        actor: system
        preconditions:
          - "interim_performance_score < 60.0"
        side_effects:
          - "new awards are refused"
      - from: WATCH
        to: GOOD_STANDING
        trigger: "system — any recompute of interim_performance_score"
        actor: system
        preconditions:
          - "interim_performance_score >= 80.0"
        side_effects:
          - "awards are permitted again"
        note: "Cycle: standing can recover as passing tests accumulate."
      - from: SUSPENDED
        to: WATCH
        trigger: "system — any recompute of interim_performance_score"
        actor: system
        preconditions:
          - "60.0 <= interim_performance_score < 80.0"
        side_effects:
          - "still barred from new awards"
      - from: GOOD_STANDING
        to: SUSPENDED
        trigger: "system — any recompute of interim_performance_score"
        actor: system
        preconditions:
          - "interim_performance_score < 60.0"
        side_effects:
          - "new awards are refused"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-create-stale-scenario
    parent_entity: BudgetScenario
    write_endpoint: "POST /pavement/scenario-allocations"
    occ_field: "expected_scenario_version"
    description: |
      Adding a manual allocation to a BudgetScenario whose version has advanced
      since the client last read it is rejected. A manual add is legitimately
      repeatable — a second, strictly later request carrying a fresh version
      would itself succeed — so the only deterministic guard is the stale-version
      check: the caller's expected_scenario_version must equal the scenario's
      current version, which every run, adopt, award, cancel-award and prior
      manual add advances.
    error_id: ERR_STALE_SCENARIO_VERSION
    http_status: 412

  - rule_id: project-segment-add-stale-project
    parent_entity: ResurfacingProject
    write_endpoint: "POST /pavement/project-segments"
    occ_field: "expected_project_version"
    description: |
      Adding a line to a ResurfacingProject whose version has advanced since the
      client last read the bundle is rejected. Adding lines is legitimately
      repeatable (each add names a different segment), so no state precondition
      can reject the later writer; the stale-version check is what protects a
      bundle whose cost, area and segment roster the client is reasoning about
      from a superseded read.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: segment_area_sy
    trigger: "POST /pavement/segments (creation only; length_ft and width_ft are immutable afterwards)"
    algorithm: aggregation
    formula: |
      area_sy = round_half_up(length_ft * width_ft / 9.0, 2)
    input_set: "the segment's own length_ft and width_ft"
    constants: { SQFT_PER_SY: 9.0 }
    precision: "2 decimal places, round_half_up"

  - name: survey_measured_condition_index
    trigger: "POST /pavement/distress-observations (on create) and re-evaluated on POST /pavement/condition-surveys/{id}/seal for ACCEPTED observations"
    algorithm: weighted_scoring
    formula: |
      area_sqft      = segment.length_ft * segment.width_ft
      alligator_pct  = round_half_up(alligator_cracking_sqft / area_sqft * 100.0, 2)
      patch_pct      = round_half_up(patching_sqft          / area_sqft * 100.0, 2)
      crack_density  = round_half_up(longitudinal_cracking_lf / segment.length_ft * 100.0, 2)
      rut_excess_in  = max(0.0, rutting_depth_in - RUT_FREE_IN)
      iri_excess     = max(0.0, iri_in_per_mi - IRI_FREE)
      deduct_raw     = 0.45*alligator_pct + 0.18*crack_density + 40.0*rut_excess_in
                       + 0.12*patch_pct + 0.08*iri_excess
      coverage_factor = round_half_up(100.0 / sample_coverage_pct, 4)
      deduct_total    = round_half_up(deduct_raw * coverage_factor, 2)
      measured_condition_index = round_half_up(clamp(100.0 - deduct_total, 0.0, 100.0), 1)
      # ROUNDING ORDER IS PINNED: the three percentage terms round to 2 dp first;
      # deduct_raw is NOT rounded; deduct_total rounds to 2 dp after the coverage
      # scale-up; the final PCI rounds to 1 dp after the subtraction. Rounding the
      # weighted sum before the coverage scale-up is WRONG.
    input_set: "one DistressObservation and its NetworkSegment's length_ft / width_ft"
    constants: { RUT_FREE_IN: 0.25, IRI_FREE: 95.0, ALLIGATOR_W: 0.45, CRACK_W: 0.18, RUT_W: 40.0, PATCH_W: 0.12, IRI_W: 0.08 }
    precision: "percentages 2 dp, deduct_total 2 dp, PCI 1 dp, round_half_up"

  - name: model_projected_condition_index
    trigger: "POST /pavement/segments (initial condition_index), and inside calculations.projected_network_pci for every horizon projection"
    algorithm: decay_function
    formula: |
      anchor_date   = segment.last_treatment_date IF NOT NULL ELSE segment.created_at
      age_years     = floor(whole_days_between(anchor_date, evaluation_instant) / 365)
      A             = DECAY_TABLE[segment.functional_class].decay_coefficient
      B             = DECAY_TABLE[segment.functional_class].decay_knee_coefficient
      pci_raw       = segment.baseline_condition_index - A*age_years - B*max(0, age_years - KNEE_YEARS)
      model_pci     = round_half_up(clamp(pci_raw, 0.0, 100.0), 1)
    input_set: "the segment's baseline_condition_index, anchor date and functional_class; NO survey data participates"
    constants:
      KNEE_YEARS: 8
      DECAY_TABLE: "{ ARTERIAL: {A: 2.2, B: 1.6}, COLLECTOR: {A: 1.8, B: 1.3}, LOCAL: {A: 1.4, B: 1.0} }"
      DAYS_PER_YEAR: 365
    precision: "1 decimal place, round_half_up; age_years is an integer floor of whole days / 365"

  - name: effective_condition_index
    trigger: "NetworkSegment.condition_index is a stored derived field written at segment creation, at POST /pavement/condition-surveys/{id}/seal (CASCADE L1) and at POST /pavement/projects/{id}/accept (CASCADE L2). It is NEVER recomputed on read."
    algorithm: projection
    formula: |
      condition_index        = <the value written by the most recent of the three writing events>
      condition_index_source = SURVEY_MEASURED when the last writer was a survey seal,
                               MODEL_PROJECTED when it was segment creation or a project acceptance
      condition_band         = GOOD  when condition_index >= 70.0
                               FAIR  when condition_index >= 50.0
                               POOR  when condition_index >= 25.0
                               FAILED otherwise
    input_set: "exactly one of the two variants below wins per writing event"
    variants:
      - name: SURVEY_MEASURED
        when: "a ConditionSurvey with an ACCEPTED DistressObservation on this segment is sealed"
        difference: "condition_index := that observation's measured_condition_index (distress-deduct math, calculations.survey_measured_condition_index). Ignores baseline_condition_index and age entirely."
      - name: MODEL_PROJECTED
        when: "the segment is created, or a ProjectSegment on it is ACCEPTED by CASCADE L2 of project acceptance"
        difference: "condition_index := calculations.model_projected_condition_index at that instant (creation) or min(100.0, condition_index + candidate.treatment_pci_gain) (acceptance). Ignores all distress measurements — for identical field data the two variants publish different PCI values, and only the SURVEY_MEASURED value can move a segment into a worse condition_band than its age implies."
    precision: "1 decimal place, round_half_up"

  - name: network_condition_index
    trigger: "POST /pavement/condition-surveys/{id}/seal"
    algorithm: aggregation
    formula: |
      pool = DistressObservation rows on this survey with qc_status == ACCEPTED
             (PENDING is impossible at seal, FLAGGED and REJECTED are excluded)
      network_condition_index = round_half_up(
          SUM over pool of (segment.area_sy * observation.measured_condition_index)
          / SUM over pool of segment.area_sy , 1)
    input_set: "ACCEPTED observations of this survey only; each (survey_id, segment_id) pair is unique by validations[priority=66], so no segment is double-weighted; order-insensitive, no tie-break needed"
    constants: {}
    precision: "1 decimal place, round_half_up"

  - name: treatment_selection
    trigger: "POST /pavement/condition-surveys/{id}/generate-candidates"
    algorithm: threshold
    formula: |
      candidate pool = NetworkSegment rows that have an ACCEPTED DistressObservation on
                       this sealed survey AND whose condition_index < NO_TREATMENT_CEILING
      for each pooled segment (snapshot selection_condition_index = segment.condition_index):
        if selection_condition_index >= CRACK_SEAL_FLOOR      -> CRACK_SEAL
        elif selection_condition_index >= OVERLAY_FLOOR       -> MILL_AND_OVERLAY
        else                                                  -> RECONSTRUCTION
      # Boundaries are inclusive-at-the-floor: exactly 70.0 selects CRACK_SEAL,
      # 69.9 selects MILL_AND_OVERLAY; exactly 40.0 selects MILL_AND_OVERLAY,
      # 39.9 selects RECONSTRUCTION; exactly 90.0 yields NO candidate at all.
      generation order = segment.condition_index ASC, then NetworkSegment.created_at ASC
    input_set: "segments with an ACCEPTED observation on the sealed survey and condition_index < 90.0; segments whose only observation was FLAGGED or REJECTED are excluded"
    constants: { NO_TREATMENT_CEILING: 90.0, CRACK_SEAL_FLOOR: 70.0, OVERLAY_FLOOR: 40.0 }
    precision: "comparisons on condition_index at 1 decimal place"

  - name: candidate_estimated_cost_cents
    trigger: "POST /pavement/condition-surveys/{id}/generate-candidates and POST /pavement/treatment-candidates/{id}/override"
    algorithm: tiered_pricing
    formula: |
      base_rate              = BASE_RATE_CENTS_PER_SY[treatment_type][segment.functional_class]
      width_factor           = round_half_up(max(1.00, min(1.25, 1.00 + 0.01*(segment.width_ft - 24.0))), 4)
      snapshot_band          = band_of(selection_condition_index)   # same thresholds as condition_band
      condition_penalty      = 1.12 if snapshot_band == FAILED
                               else 1.05 if snapshot_band == POOR
                               else 1.00
      mobilization_cents     = MOBILIZATION_CENTS[treatment_type]
      estimated_cost_cents   = round_half_up(segment.area_sy * base_rate * width_factor * condition_penalty)
                               + mobilization_cents
      # EVALUATION ORDER PINNED: the three factors multiply the area in this order at
      # full precision, the product rounds ONCE to whole cents, and mobilization is
      # added AFTER that rounding.
    input_set: "the candidate's treatment_type, its segment's functional_class / width_ft / area_sy, and the frozen selection_condition_index snapshot (never the live condition_index)"
    constants:
      BASE_RATE_CENTS_PER_SY: "{ CRACK_SEAL: {LOCAL: 350, COLLECTOR: 420, ARTERIAL: 500}, MILL_AND_OVERLAY: {LOCAL: 2800, COLLECTOR: 3300, ARTERIAL: 4100}, RECONSTRUCTION: {LOCAL: 9500, COLLECTOR: 11000, ARTERIAL: 13500} }"
      MOBILIZATION_CENTS: "{ CRACK_SEAL: 250000, MILL_AND_OVERLAY: 850000, RECONSTRUCTION: 850000 }"
      WIDTH_FREE_FT: 24.0
    precision: "width_factor 4 dp; cost integer cents, round_half_up"

  - name: candidate_benefit_cost_ratio
    trigger: "POST /pavement/condition-surveys/{id}/generate-candidates and POST /pavement/treatment-candidates/{id}/override"
    algorithm: weighted_scoring
    formula: |
      expected_service_life_years = SERVICE_LIFE_YEARS[treatment_type]
      treatment_pci_gain = round_half_up(min(PCI_GAIN_CAP[treatment_type],
                                             100.0 - selection_condition_index), 1)
      benefit_pci_years_sy = round_half_up(treatment_pci_gain
                                           * expected_service_life_years
                                           * segment.area_sy, 2)
      cost_thousands = estimated_cost_cents / 100000.0        # cents -> $1,000 units
      benefit_cost_ratio = round_half_up(benefit_pci_years_sy / cost_thousands, 4)
    input_set: "one candidate; uses its own estimated_cost_cents (mobilization included) and the frozen selection_condition_index"
    constants:
      SERVICE_LIFE_YEARS: "{ CRACK_SEAL: 5, MILL_AND_OVERLAY: 15, RECONSTRUCTION: 30 }"
      PCI_GAIN_CAP: "{ CRACK_SEAL: 8.0, MILL_AND_OVERLAY: 45.0, RECONSTRUCTION: 100.0 }"
    precision: "gain 1 dp, benefit 2 dp, ratio 4 dp, round_half_up"

  - name: scenario_waterfall_allocation
    trigger: "POST /pavement/budget-scenarios/{id}/run"
    algorithm: waterfall_allocation
    formula: |
      pool = TreatmentCandidate rows with survey_id == scenario.survey_id
             AND candidate_status IN {RECOMMENDED, OVERRIDDEN, CONSUMED}
             (SUPERSEDED candidates are excluded)
      rank the pool by strategy:
        WORST_FIRST  : selection_condition_index ASC, then area_sy DESC, then created_at ASC
        BENEFIT_COST : benefit_cost_ratio DESC, then estimated_cost_cents ASC, then created_at ASC
        HYBRID       : partition A = candidates with selection_condition_index < HYBRID_TRIAGE_PCI
                       ordered by selection_condition_index ASC then created_at ASC;
                       partition B = the rest ordered by benefit_cost_ratio DESC then created_at ASC;
                       A entirely precedes B
      remaining_cents = scenario.funding_cents
      for each candidate in rank order (rank starts at 1 and increments for EVERY pool member):
        if candidate.estimated_cost_cents <= remaining_cents:
            create ScenarioAllocation(allocation_status=FUNDED, source=AUTO_RUN,
                                      allocated_cents=candidate.estimated_cost_cents)
            remaining_cents -= candidate.estimated_cost_cents
        else:
            create ScenarioAllocation(allocation_status=DEFERRED, source=AUTO_RUN,
                                      allocated_cents=0)
            # SCAN DOES NOT STOP: a later, cheaper candidate that still fits IS funded.
      funded_cost_cents = SUM(allocated_cents of FUNDED rows)
      backlog_cents     = SUM(candidate.estimated_cost_cents of DEFERRED rows)
      allocation_count  = count of FUNDED + DEFERRED rows
    input_set: "candidates of the scenario's survey with candidate_status IN {RECOMMENDED, OVERRIDDEN, CONSUMED}; WITHDRAWN allocations from a prior seal cascade are deleted with the other AUTO_RUN rows on re-run"
    constants: { HYBRID_TRIAGE_PCI: 40.0 }
    precision: "integer cents; the affordability test is `cost <= remaining` so a candidate costing exactly the remaining balance IS funded"
    variants:
      - name: STOP_AT_FIRST_MISS
        when: "NOT USED — documented only to pin the rejected reading"
        difference: "A reading that halts the scan at the first unaffordable candidate would leave later affordable candidates DEFERRED. This scaffold explicitly rejects it: the scan continues to the end of the pool."

  - name: projected_network_pci
    trigger: "POST /pavement/budget-scenarios/{id}/run (both arms are computed in the same request)"
    algorithm: decay_function
    formula: |
      pool = segments that have an ACCEPTED DistressObservation on the scenario's survey
      H    = scenario.horizon_years
      A, B = DECAY_TABLE[segment.functional_class]
      current_age_years = floor(whole_days_between(anchor_date, scenario.analysis_date) / 365)
      # unfunded arm: incremental decay over the horizon, knee-aware
      incremental_loss = A*H
                         + B*max(0, (current_age_years + H) - KNEE_YEARS)
                         - B*max(0, current_age_years - KNEE_YEARS)
      unfunded_pci = round_half_up(clamp(segment.condition_index - incremental_loss, 0.0, 100.0), 1)
      # funded arm: the treatment resets the clock, so only H years of decay apply
      post_treatment_pci = min(100.0, candidate.selection_condition_index + candidate.treatment_pci_gain)
      funded_pci = round_half_up(clamp(post_treatment_pci - A*H - B*max(0, H - KNEE_YEARS), 0.0, 100.0), 1)
      # each segment's projected PCI is rounded to 1 dp BEFORE area-weighting
      projected_network_pci  = round_half_up(SUM(area_sy * seg_pci_funded_or_unfunded) / SUM(area_sy), 1)
      do_nothing_network_pci = round_half_up(SUM(area_sy * unfunded_pci)               / SUM(area_sy), 1)
    input_set: "segments with an ACCEPTED observation on the scenario's survey; a segment counts as funded when a ScenarioAllocation of THIS scenario with allocation_status == FUNDED references a candidate on it"
    constants: { KNEE_YEARS: 8 }
    precision: "per-segment 1 dp then area-weighted mean to 1 dp, round_half_up"
    variants:
      - name: FUNDED_ARM
        when: "written to projected_network_pci"
        difference: "funded segments use the post-treatment reset curve"
      - name: DO_NOTHING_ARM
        when: "written to do_nothing_network_pci"
        difference: "every segment uses the unfunded incremental-decay curve regardless of allocation, giving the comparison arm of the funding-level analysis"

  - name: project_bundle_base_cents
    trigger: "POST /pavement/project-segments, DELETE /pavement/project-segments/{id}, POST /pavement/projects/{id}/advance with action == BID_READY"
    algorithm: aggregation
    formula: |
      # STEP 1 — per line, rounded individually:
      line_cost_cents = round_half_up(line_area_sy
                                      * BASE_RATE_CENTS_PER_SY[treatment_type][segment.functional_class]
                                      * width_factor
                                      * condition_penalty)
                        # width_factor and condition_penalty exactly as in
                        # calculations.candidate_estimated_cost_cents; NO mobilization here
      # STEP 2 — sum the ALREADY-ROUNDED line costs:
      construction_cents = SUM(line_cost_cents) over ProjectSegment rows with work_state != REMOVED
      # ROUNDING ORDER PINNED: round per line item, THEN sum. Summing the raw
      # products and rounding once at the end is WRONG and differs by cents.
      # STEP 3 — one mobilization for the whole bundle:
      mobilization_cents = 250000 if EVERY non-REMOVED line has treatment_type == CRACK_SEAL
                           else 850000
      bundle_base_cents = construction_cents + mobilization_cents
    input_set: "ProjectSegment rows of the project with work_state != REMOVED; REMOVED lines contribute nothing"
    constants: { CRACK_SEAL_ONLY_MOBILIZATION_CENTS: 250000, MIXED_MOBILIZATION_CENTS: 850000 }
    precision: "each line rounds to whole cents before summation; the sum is exact"

  - name: project_total_estimate_cents
    trigger: "POST /pavement/project-segments, DELETE /pavement/project-segments/{id}, POST /pavement/projects/{id}/advance with action == BID_READY"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER PINNED — the contingency tier is keyed on bundle_base_cents,
      # NOT on project_total_estimate_cents. Keying the tier on the total would be
      # circular (the total contains the contingency); this scaffold resolves the
      # apparent circularity by fixing the tier lookup to the pre-contingency base.
      # 1. line costs                    (calculations.project_bundle_base_cents step 1)
      # 2. bundle_base_cents             (step 3 of the same calculation)
      # 3. contingency tier on the BASE:
      contingency_pct = 0.15 if bundle_base_cents <  TIER_1_CENTS
                        else 0.10 if bundle_base_cents < TIER_2_CENTS
                        else 0.07
      contingency_cents = round_half_up(bundle_base_cents * contingency_pct)
      # 4. utility restoration share, also keyed on the BASE:
      utility_share_cents = round_half_up(bundle_base_cents * UTILITY_SHARE_PCT)
                            IF the project has >= 1 UtilityCoordination with
                            coordination_status == CLEARED_AFTER_WORK
                            ELSE 0
      # 5. total:
      project_total_estimate_cents = bundle_base_cents + contingency_cents + utility_share_cents
    input_set: "the project's own bundle_base_cents plus its UtilityCoordination roster"
    constants: { TIER_1_CENTS: 5000000, TIER_2_CENTS: 50000000, UTILITY_SHARE_PCT: 0.03 }
    precision: "integer cents, round_half_up; tier comparisons are strict `<` at the boundary so a base of exactly 5,000,000 cents takes 0.10"

  - name: contractor_performance_score
    trigger: "POST /pavement/acceptance-tests/{id}/decide, POST /pavement/projects/{id}/substantial-completion, POST /pavement/projects/{id}/accept (interim on all three; final on acceptance), and read-only on GET /pavement/contractors/{id}/scorecard"
    algorithm: weighted_scoring
    formula: |
      quality_component(passed, failed) = 100.00 if (passed + failed) == 0
                                          else round_half_up(100.0*passed/(passed+failed), 2)
      schedule_component(days_late)     = round_half_up(clamp(100.0 - 2.5*days_late, 0.0, 100.0), 2)
      remediation_component(events)     = round_half_up(clamp(100.0 - 8.0*events, 0.0, 100.0), 2)
      score(q, s, r) = round_half_up(0.45*q + 0.30*s + 0.25*r, 1)
      # ROUNDING ORDER PINNED: each component rounds to 2 dp, then the weighted sum
      # rounds to 1 dp. Rounding only at the end is WRONG.
      standing = GOOD_STANDING if interim_performance_score >= 80.0
                 else WATCH    if interim_performance_score >= 60.0
                 else SUSPENDED
    input_set: "see the two variants — they differ in which projects contribute"
    constants: { QUALITY_W: 0.45, SCHEDULE_W: 0.30, REMEDIATION_W: 0.25, LATE_DAY_PENALTY: 2.5, REMEDIATION_PENALTY: 8.0, GOOD_STANDING_FLOOR: 80.0, WATCH_FLOOR: 60.0 }
    precision: "components 2 dp, score 1 dp, round_half_up"
    variants:
      - name: INTERIM
        when: "written to Contractor.interim_performance_score on every recompute; THIS is the variant that derives standing"
        difference: "counts AcceptanceTest decisions and remediation events across ALL of the contractor's projects regardless of delivery_status, but counts schedule lateness only for projects that have reached SUBSTANTIALLY_COMPLETE or ACCEPTED (an in-flight project contributes 0 late days even when the logical clock is already past its planned_end_date) — optimistic on schedule, pessimistic on quality."
      - name: FINAL
        when: "written to Contractor.final_performance_score on project acceptance and reported by GET /pavement/contractors/{id}/scorecard; null while accepted_project_count == 0"
        difference: "restricted to projects with delivery_status == ACCEPTED: only tests on lines of accepted projects feed the quality component, only remediation events on accepted projects feed the remediation component, and days_late_total (accepted projects only) feeds schedule. For a contractor with one accepted clean project and one in-flight failing project the two variants disagree — FINAL stays 100.0 while INTERIM drops."

  - name: acceptance_pay_factor
    trigger: "POST /pavement/acceptance-tests (computed at submission and frozen)"
    algorithm: threshold
    formula: |
      density_pf    = 1.00 if core_density_pct >= 96.0
                      else 0.98 if core_density_pct >= 94.0
                      else 0.95 if core_density_pct >= 92.0
                      else 0.00                          # 0.00 marks a failing component
      smoothness_pf = 1.02 if iri_in_per_mi <= 60.0
                      else 1.00 if iri_in_per_mi <= 95.0
                      else 0.97 if iri_in_per_mi <= 120.0
                      else 0.00
      thickness_pf  = 1.00 if thickness_in >= line.design_thickness_in
                      else 0.96 if thickness_in >= line.design_thickness_in - THICKNESS_TOLERANCE_IN
                      else 0.00
      if min(density_pf, smoothness_pf, thickness_pf) == 0.00:
          computed_pay_factor = 0.0000
          computed_outcome    = FAIL
      else:
          computed_pay_factor = round_half_up(min(PAY_FACTOR_CAP,
                                                  density_pf * smoothness_pf * thickness_pf), 4)
          computed_outcome    = PASS if computed_pay_factor >= PASS_FLOOR else FAIL
    input_set: "one AcceptanceTest and its ProjectSegment.design_thickness_in"
    constants: { THICKNESS_TOLERANCE_IN: 0.25, PAY_FACTOR_CAP: 1.02, PASS_FLOOR: 0.95 }
    precision: "4 decimal places, round_half_up; the cap applies after multiplication so a bonus-smoothness/full-density/full-thickness test yields exactly 1.0200"

  - name: cut_permit_degradation_fee
    trigger: "POST /pavement/cut-permits, and recomputed by CASCADE L3 of POST /pavement/projects/{id}/accept while permit_status == PENDING"
    algorithm: tiered_pricing
    formula: |
      # STEP 1
      moratorium_remaining_days = 0 if segment.moratorium_until IS NULL
                                  else max(0, floor(whole_seconds_between(now, segment.moratorium_until) / 86400))
      # STEP 2 — tier on remaining moratorium
      tier_multiplier = 3.0 if moratorium_remaining_days >= 1096
                        else 2.0 if moratorium_remaining_days >= 366
                        else 1.5 if moratorium_remaining_days >= 1
                        else 1.0
      # STEP 3 — emergency relief, floored at 1.0
      fee_multiplier = max(1.0, tier_multiplier - EMERGENCY_RELIEF) if emergency == true
                       else tier_multiplier
      # STEP 4
      base_fee_cents = max(MIN_FEE_CENTS, round_half_up(cut_area_sqft * FEE_PER_SQFT_CENTS))
      degradation_fee_cents = round_half_up(base_fee_cents * fee_multiplier)
    input_set: "one CutPermit, its NetworkSegment.moratorium_until and the logical clock at computation time"
    constants: { FEE_PER_SQFT_CENTS: 850, MIN_FEE_CENTS: 45000, EMERGENCY_RELIEF: 0.5, TIER_3Y_DAYS: 1096, TIER_1Y_DAYS: 366 }
    precision: "integer cents, round_half_up; tier comparisons are `>=` so exactly 366 remaining days takes 2.0 while 365 takes 1.5"

  - name: service_request_sla
    trigger: "POST /pavement/service-requests (sla_due_at), and sla_breached is re-evaluated on every read and on closure"
    algorithm: threshold
    formula: |
      sla_due_at   = created_at + SLA_HOURS[reported_severity] hours
      reference    = closed_at IF request_status is a CLOSED_* state ELSE logical clock now
      sla_breached = (reference > sla_due_at)        # strictly greater; equality is NOT a breach
    input_set: "one ServiceRequest"
    constants: { SLA_HOURS: "{ HIGH: 72, MEDIUM: 168, LOW: 720 }" }
    precision: "second resolution; boundary is strict `>`"

  - name: scenario_funding_conservation
    trigger: "invariant — asserted after POST /pavement/projects/{id}/award and after POST /pavement/projects/{id}/cancel-award"
    algorithm: aggregation
    formula: |
      committed_cents   = SUM(award_amount_cents) over ResurfacingProject rows of the scenario
                          whose delivery_status IN {AWARDED, IN_CONSTRUCTION,
                                                    SUBSTANTIALLY_COMPLETE, ACCEPTED}
      uncommitted_cents = funding_cents - committed_cents
      INVARIANT: funding_cents == committed_cents + uncommitted_cents  (always, exactly)
      COMPENSATION: award(X) followed by cancel-award on the same project restores
      committed_cents and uncommitted_cents to their exact pre-award values, for any X,
      with zero drift — cancel-award subtracts the stored award_amount_cents, never a
      recomputed estimate.
    input_set: "all ResurfacingProject rows of one BudgetScenario"
    constants: {}
    precision: "integer cents, exact"

  - name: project_area_conservation
    trigger: "invariant — asserted after POST /pavement/project-segments and after DELETE /pavement/project-segments/{id}"
    algorithm: aggregation
    formula: |
      project.planned_area_sy = round_half_up(SUM(line_area_sy) over ProjectSegment rows
                                              of the project with work_state != REMOVED, 2)
      project.segment_count   = count of those rows
      segment.active_project_count = count of ProjectSegment rows referencing the segment
                                     with work_state IN {PLANNED, IN_PROGRESS,
                                                         WORK_COMPLETE, REMEDIATION_REQUIRED}
      INVARIANT: add-then-remove leaves planned_area_sy, segment_count and
      active_project_count at their exact pre-add values, and returns the candidate to
      RECOMMENDED or OVERRIDDEN — the conserved quantity is pavement area under plan.
    input_set: "one project's non-REMOVED lines, and one segment's non-terminal lines"
    constants: {}
    precision: "area 2 dp, counts integer, exact"

  - name: service_request_backlog_conservation
    trigger: "invariant — asserted after POST /pavement/service-requests/{id}/triage, after POST /pavement/service-requests/{id}/close and after CASCADE L4 of POST /pavement/projects/{id}/accept"
    algorithm: aggregation
    formula: |
      segment.open_service_request_count = count of ServiceRequest rows on the segment with
          request_status IN {NEW, TRIAGED_PATCH, DEFERRED_TO_CAPITAL}
      INVARIANT: the counter decrements exactly once per request that leaves the open set,
      whether it leaves by explicit close, by DUPLICATE close, or by the CLOSED_BY_CAPITAL
      cascade — triage (NEW -> TRIAGED_PATCH / DEFERRED_TO_CAPITAL) never changes it, and
      the count never goes negative. The conserved quantity is open complaint volume.
    input_set: "all ServiceRequest rows of one NetworkSegment"
    constants: {}
    precision: "integer, exact"

# =============================================================================
# §1.4 Validation Rules Table  (evaluated in ascending priority order; the
# FIRST violated rule wins and short-circuits every later rule)
# =============================================================================
validations:

  # ---- 10..30 : envelope-level checks, in this order, for every endpoint ----
  - priority: 10
    rule: "X-User-ID and X-Role headers must both be present and non-empty on every endpoint (including POST /pavement/_clock/set_current_utc)"
    category: auth
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 20
    rule: "X-Role must be one of the six declared roles and must be permitted for the requested operation per §1.7"
    category: authz
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 21
    rule: "when X-Role == Contractor, X-User-ID must be the id of an existing Contractor row (entity-backed identity)"
    category: authz
    error_id: ERR_UNKNOWN_CONTRACTOR_IDENTITY
    http_status: 403
    applies_to: "all endpoints called with X-Role: Contractor"

  - priority: 22
    rule: "a Contractor caller may only act on a ResurfacingProject whose contractor_id equals the caller's X-User-ID"
    category: ownership
    error_id: ERR_NOT_PROJECT_CONTRACTOR
    http_status: 403
    applies_to: "POST /pavement/projects/{id}/substantial-completion, GET /pavement/projects/{id} with X-Role: Contractor"

  - priority: 24
    rule: "segregation of duties: (a) on POST /pavement/acceptance-tests/{id}/decide the X-User-ID must differ from the test's witness_inspector_user_id — the inspector who witnessed the coring may not decide it; (b) on POST /pavement/projects/{id}/award the X-User-ID must differ from the funding scenario's adopted_by_user_id — the officer who adopted the program may not award from it"
    category: segregation_of_duties
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /pavement/acceptance-tests/{id}/decide, POST /pavement/projects/{id}/award"

  - priority: 30
    rule: "request shape: all required body fields present, JSON types correct, enum values in range, numeric fields within their declared bounds (length_ft > 0, width_ft > 0, sample_coverage_pct in (0,100], core_density_pct in [0,100], horizon_years in [1,20], funding_cents >= 0, cut_area_sqft > 0), pagination limit in [1,100] and offset >= 0, timestamps ISO-8601 UTC, and every window end strictly after its start"
    category: request_shape
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  # ---- 40 : existence of every referenced row, checked in body order ----
  - priority: 40
    rule: "the path id must resolve to an existing row of the addressed collection"
    category: existence
    error_id: "ERR_SEGMENT_NOT_FOUND | ERR_SURVEY_NOT_FOUND | ERR_OBSERVATION_NOT_FOUND | ERR_CANDIDATE_NOT_FOUND | ERR_SCENARIO_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_PROJECT_SEGMENT_NOT_FOUND | ERR_COORDINATION_NOT_FOUND | ERR_CUT_PERMIT_NOT_FOUND | ERR_ACCEPTANCE_TEST_NOT_FOUND | ERR_SERVICE_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path id"

  - priority: 42
    rule: "every foreign key supplied in the body must resolve to an existing row; checked in declared body-field order (survey_id, then segment_id, then candidate_id, then project_id, then contractor_id, then capital_project_id)"
    category: existence
    error_id: "the matching *_NOT_FOUND code from priority 40"
    http_status: 404
    applies_to: "POST /pavement/distress-observations, POST /pavement/budget-scenarios, POST /pavement/scenario-allocations, POST /pavement/projects, POST /pavement/project-segments, POST /pavement/cut-permits, POST /pavement/acceptance-tests, POST /pavement/service-requests"

  # ---- 44 : optimistic concurrency (see §1.2.1) ----
  - priority: 44
    rule: "expected_scenario_version must equal the BudgetScenario's current version"
    category: concurrency
    error_id: ERR_STALE_SCENARIO_VERSION
    http_status: 412
    applies_to: "POST /pavement/scenario-allocations"

  - priority: 44
    rule: "expected_project_version must equal the ResurfacingProject's current version"
    category: concurrency
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /pavement/project-segments"

  # ---- 50 : the acting entity's own state ----
  - priority: 50
    rule: "the survey must be OPEN to accept distress observations, QC decisions or a seal"
    category: state
    error_id: ERR_SURVEY_NOT_OPEN
    http_status: 409
    applies_to: "POST /pavement/distress-observations, POST /pavement/distress-observations/{id}/qc, POST /pavement/condition-surveys/{id}/seal"

  - priority: 50
    rule: "the survey must have survey_status == SEALED before candidates can be generated"
    category: state
    error_id: ERR_SURVEY_NOT_SEALED
    http_status: 409
    applies_to: "POST /pavement/condition-surveys/{id}/generate-candidates"

  - priority: 50
    rule: "a candidate may be overridden only while candidate_status IN {RECOMMENDED, OVERRIDDEN}"
    category: state
    error_id: ERR_CANDIDATE_NOT_OVERRIDABLE
    http_status: 409
    applies_to: "POST /pavement/treatment-candidates/{id}/override"

  - priority: 50
    rule: "a scenario may be run or re-run only while scenario_status IN {DRAFT, COMPUTED}"
    category: state
    error_id: ERR_SCENARIO_NOT_RUNNABLE
    http_status: 409
    applies_to: "POST /pavement/budget-scenarios/{id}/run"

  - priority: 50
    rule: "a scenario may be adopted only while scenario_status == COMPUTED"
    category: state
    error_id: ERR_SCENARIO_NOT_ADOPTABLE
    http_status: 409
    applies_to: "POST /pavement/budget-scenarios/{id}/adopt"

  - priority: 50
    rule: "manual scenario allocations require scenario_status IN {DRAFT, COMPUTED}; an ADOPTED or SUPERSEDED scenario is frozen"
    category: state
    error_id: ERR_SCENARIO_FROZEN
    http_status: 409
    applies_to: "POST /pavement/scenario-allocations"

  - priority: 50
    rule: "the project's delivery_status must permit the requested action: advance COORDINATING requires DRAFT; advance BID_READY requires COORDINATING; award requires BID_READY; cancel-award requires AWARDED; advance IN_CONSTRUCTION requires AWARDED; substantial-completion requires IN_CONSTRUCTION; accept requires SUBSTANTIALLY_COMPLETE"
    category: state
    error_id: "ERR_PROJECT_NOT_DRAFT | ERR_PROJECT_NOT_COORDINATING | ERR_PROJECT_NOT_BID_READY | ERR_PROJECT_NOT_AWARDED | ERR_PROJECT_NOT_IN_CONSTRUCTION | ERR_PROJECT_NOT_SUBSTANTIALLY_COMPLETE"
    note: "PRIORITY PAIR A — on POST /pavement/projects/{id}/award this state rule (50) outranks the fiscal rule ERR_SCENARIO_FUNDS_EXCEEDED (76): an award attempt on a COORDINATING project for an amount far beyond the scenario's uncommitted_cents returns ERR_PROJECT_NOT_BID_READY, never ERR_SCENARIO_FUNDS_EXCEEDED."
    http_status: 409
    applies_to: "POST /pavement/projects/{id}/advance, /award, /cancel-award, /substantial-completion, /accept"

  - priority: 50
    rule: "project lines may be added or removed only while delivery_status IN {DRAFT, COORDINATING}"
    category: state
    error_id: ERR_PROJECT_SCOPE_LOCKED
    http_status: 409
    applies_to: "POST /pavement/project-segments, DELETE /pavement/project-segments/{id}"

  - priority: 50
    rule: "the notice action must match the line's notice_state: SCHEDULE requires PENDING, DELIVER requires SCHEDULED, RESCHEDULE requires DELIVERED"
    category: state
    error_id: "ERR_NOTICE_ALREADY_SCHEDULED | ERR_NOTICE_NOT_SCHEDULED | ERR_NOTICE_NOT_DELIVERED"
    http_status: 409
    applies_to: "POST /pavement/project-segments/{id}/notice"

  - priority: 50
    rule: "utility coordination responses require coordination_status == CLEARANCE_REQUESTED; complete-work requires WORK_SCHEDULED"
    category: state
    error_id: "ERR_COORDINATION_NOT_PENDING | ERR_COORDINATION_WORK_NOT_SCHEDULED"
    http_status: 409
    applies_to: "POST /pavement/utility-coordinations/{id}/respond, POST /pavement/utility-coordinations/{id}/complete-work"

  - priority: 50
    rule: "a cut permit may be decided only while permit_status IN {PENDING, MORATORIUM_REVIEW}"
    category: state
    error_id: ERR_CUT_PERMIT_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /pavement/cut-permits/{id}/decide"

  - priority: 50
    rule: "an acceptance test may be decided only while test_status == SUBMITTED"
    category: state
    error_id: ERR_TEST_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /pavement/acceptance-tests/{id}/decide"

  - priority: 50
    rule: "triage requires request_status == NEW; close requires request_status IN {NEW, TRIAGED_PATCH, DEFERRED_TO_CAPITAL}"
    category: state
    error_id: "ERR_SERVICE_REQUEST_NOT_NEW | ERR_SERVICE_REQUEST_ALREADY_CLOSED"
    http_status: 409
    applies_to: "POST /pavement/service-requests/{id}/triage, POST /pavement/service-requests/{id}/close"

  - priority: 50
    rule: "acceptance tests may be submitted only for a line that is on the street under active construction — work_state IN {IN_PROGRESS, REMEDIATION_REQUIRED}; a PLANNED line has no pavement to core and a WORK_COMPLETE / ACCEPTED / REMOVED line has already been signed off"
    category: state
    error_id: ERR_LINE_NOT_TESTABLE
    http_status: 409
    applies_to: "POST /pavement/acceptance-tests"

  # ---- 52 : safety rules that outrank referential and fiscal checks ----
  - priority: 52
    rule: "a cut permit cannot be created for a segment with an active construction line (any ProjectSegment on the segment with work_state IN {IN_PROGRESS, REMEDIATION_REQUIRED}) — worker safety outranks every roster, moratorium and fee consideration"
    category: business_safety
    error_id: ERR_CUT_BLOCKED_ACTIVE_CONSTRUCTION
    http_status: 409
    applies_to: "POST /pavement/cut-permits"

  - priority: 52
    rule: "a project cannot advance to IN_CONSTRUCTION while any non-REMOVED line's segment has an APPROVED CutPermit whose cut_completed_at is null (open trench under the paving crew)"
    category: business_safety
    error_id: ERR_OPEN_CUT_ON_SEGMENT
    http_status: 409
    applies_to: "POST /pavement/projects/{id}/advance with action == START_CONSTRUCTION"
    note: "PRIORITY PAIR B — this safety rule (52) outranks the notice-completeness rule ERR_NOTICES_NOT_DELIVERED (66) on the same action: a project holding BOTH an open approved trench and an undelivered resident notice returns ERR_OPEN_CUT_ON_SEGMENT, never ERR_NOTICES_NOT_DELIVERED."

  # ---- 58 : temporal rules ----
  - priority: 58
    rule: "a resident notice window must start at least NOTICE_LEAD_HOURS (72) after the logical clock at scheduling time"
    category: business_temporal
    error_id: ERR_NOTICE_LEAD_TIME_TOO_SHORT
    http_status: 422
    applies_to: "POST /pavement/project-segments/{id}/notice with action IN {SCHEDULE, RESCHEDULE}"
    note: "PRIORITY PAIR C — this temporal rule (58) outranks the overlap rule ERR_NOTICE_WINDOW_CONFLICT (70) on the same action: a window that is both inside the 72-hour lead time AND buffered-overlapping a sibling line's window returns ERR_NOTICE_LEAD_TIME_TOO_SHORT, never ERR_NOTICE_WINDOW_CONFLICT."

  - priority: 58
    rule: "a project's planned_start_date must be on or after the adopting scenario's analysis_date, and planned_end_date must be strictly after planned_start_date"
    category: business_temporal
    error_id: ERR_PROJECT_WINDOW_BEFORE_ANALYSIS_DATE
    http_status: 422
    applies_to: "POST /pavement/projects"

  - priority: 58
    rule: "substantial-completion actual_end_date must be on or after the project's planned_start_date"
    category: business_temporal
    error_id: ERR_COMPLETION_BEFORE_START
    http_status: 422
    applies_to: "POST /pavement/projects/{id}/substantial-completion"

  # ---- 64 : referential / roster rules ----
  - priority: 64
    rule: "the applicant_utility on a cut permit must appear on the coordination roster — some UtilityCoordination row anywhere in the system must carry the same `utility` enum value"
    category: business_referential
    error_id: ERR_UTILITY_NOT_ON_COORDINATION_ROSTER
    http_status: 422
    applies_to: "POST /pavement/cut-permits"

  - priority: 64
    rule: "a project line's candidate must reference the same segment as the line, must belong to the project's scenario's survey, and must have a FUNDED ScenarioAllocation in that scenario"
    category: business_referential
    error_id: "ERR_CANDIDATE_SEGMENT_MISMATCH | ERR_CANDIDATE_NOT_FUNDED"
    http_status: 422
    applies_to: "POST /pavement/project-segments"

  - priority: 64
    rule: "a project line's NetworkSegment.geo_zone must equal the ResurfacingProject.geo_zone — a bundle is a geographic package and may not reach outside its zone"
    category: business_referential
    error_id: ERR_SEGMENT_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /pavement/project-segments"

  - priority: 64
    rule: "a manual scenario allocation's candidate must belong to the scenario's survey"
    category: business_referential
    error_id: ERR_CANDIDATE_SURVEY_MISMATCH
    http_status: 422
    applies_to: "POST /pavement/scenario-allocations"

  - priority: 64
    rule: "a project must reference a scenario whose scenario_status == ADOPTED"
    category: business_referential
    error_id: ERR_SCENARIO_NOT_ADOPTED
    http_status: 422
    applies_to: "POST /pavement/projects"

  # ---- 66 : uniqueness and cross-entity-state gates ----
  - priority: 66
    rule: "at most one DistressObservation per (survey_id, segment_id) pair"
    category: business_constraint
    error_id: ERR_DUPLICATE_OBSERVATION
    http_status: 409
    applies_to: "POST /pavement/distress-observations"

  - priority: 66
    rule: "at most one non-REMOVED ProjectSegment per (project_id, segment_id) pair, and at most one non-REMOVED ProjectSegment per candidate"
    category: business_constraint
    error_id: "ERR_DUPLICATE_PROJECT_SEGMENT | ERR_CANDIDATE_ALREADY_PROGRAMMED"
    http_status: 409
    applies_to: "POST /pavement/project-segments"

  - priority: 66
    rule: "a line may not have two undecided tests at once: no AcceptanceTest on the project_segment_id may have test_status == SUBMITTED"
    category: business_constraint
    error_id: ERR_TEST_ALREADY_PENDING
    http_status: 409
    applies_to: "POST /pavement/acceptance-tests"

  - priority: 66
    rule: "candidates may be generated only once per survey — no TreatmentCandidate row may already reference the survey"
    category: business_constraint
    error_id: ERR_CANDIDATES_ALREADY_GENERATED
    http_status: 409
    applies_to: "POST /pavement/condition-surveys/{id}/generate-candidates"

  - priority: 66
    rule: "a project may advance to BID_READY only when it has at least one non-REMOVED line"
    category: business_constraint
    error_id: ERR_PROJECT_HAS_NO_SEGMENTS
    http_status: 422
    applies_to: "POST /pavement/projects/{id}/advance with action == BID_READY"

  - priority: 66
    rule: "a project may advance to BID_READY only when every UtilityCoordination on it has coordination_status IN {CLEARED, CLEARED_AFTER_WORK}"
    category: business_constraint
    error_id: ERR_UTILITY_CLEARANCE_PENDING
    http_status: 409
    applies_to: "POST /pavement/projects/{id}/advance with action == BID_READY"

  - priority: 66
    rule: "a project may be awarded only to a Contractor whose standing == GOOD_STANDING"
    category: business_constraint
    error_id: ERR_CONTRACTOR_NOT_IN_GOOD_STANDING
    http_status: 409
    applies_to: "POST /pavement/projects/{id}/award"

  - priority: 66
    rule: "a project may advance to IN_CONSTRUCTION only when every non-REMOVED line has notice_state == DELIVERED"
    category: business_constraint
    error_id: ERR_NOTICES_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /pavement/projects/{id}/advance with action == IN_CONSTRUCTION"

  - priority: 66
    rule: "a project may be accepted only when every non-REMOVED line satisfies acceptance: a CRACK_SEAL line needs no AcceptanceTest, while every MILL_AND_OVERLAY or RECONSTRUCTION line must have an AcceptanceTest with test_status == PASSED at its highest test_round"
    category: business_constraint
    error_id: ERR_ACCEPTANCE_TESTS_INCOMPLETE
    http_status: 409
    applies_to: "POST /pavement/projects/{id}/accept"

  - priority: 66
    rule: "a scenario may be adopted only when it has at least one ScenarioAllocation"
    category: business_constraint
    error_id: ERR_SCENARIO_HAS_NO_ALLOCATIONS
    http_status: 422
    applies_to: "POST /pavement/budget-scenarios/{id}/adopt"

  - priority: 66
    rule: "a scenario may be re-run only when every ResurfacingProject referencing it has delivery_status == DRAFT"
    category: business_constraint
    error_id: ERR_SCENARIO_HAS_PROGRAMMED_PROJECTS
    http_status: 409
    applies_to: "POST /pavement/budget-scenarios/{id}/run"

  - priority: 66
    rule: "a survey may be sealed only when no DistressObservation on it has qc_status == PENDING, and at least one has qc_status == ACCEPTED"
    category: business_constraint
    error_id: "ERR_OBSERVATIONS_PENDING_QC | ERR_SURVEY_HAS_NO_ACCEPTED_OBSERVATIONS"
    http_status: 409
    applies_to: "POST /pavement/condition-surveys/{id}/seal"

  - priority: 66
    rule: "a cut permit in permit_status == MORATORIUM_REVIEW may be approved only when a non-empty waiver_reason accompanies the decision; a PENDING permit needs none"
    category: business_constraint
    error_id: ERR_MORATORIUM_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST /pavement/cut-permits/{id}/decide with decision == APPROVE"

  # ---- 70 : capacity and temporal-overlap checks ----
  - priority: 70
    rule: "a new project line's HALF-OPEN work window [work_window_start, work_window_end) must not overlap the window of any other non-REMOVED line on the same NetworkSegment; windows that merely touch (one ends exactly when the next begins) are ALLOWED"
    category: resource_overlap
    error_id: ERR_SEGMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /pavement/project-segments"

  - priority: 70
    rule: "awarding must not push the contractor over max_concurrent_projects: count the contractor's projects with delivery_status IN {AWARDED, IN_CONSTRUCTION} whose CLOSED interval [planned_start_date, planned_end_date] intersects the target project's closed interval; touching endpoints DO count as an intersection"
    category: capacity
    error_id: ERR_CONTRACTOR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /pavement/projects/{id}/award"

  - priority: 70
    rule: "a notice window, expanded by NOTICE_BUFFER_HOURS (24) on both sides and compared as a CLOSED interval, must not overlap the notice window of any other non-REMOVED line on the same NetworkSegment whose notice_state IN {SCHEDULED, DELIVERED}"
    category: resource_overlap
    error_id: ERR_NOTICE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /pavement/project-segments/{id}/notice with action IN {SCHEDULE, RESCHEDULE}"

  # ---- 76 : fiscal checks last of all ----
  - priority: 76
    rule: "award_amount_cents must not exceed the adopting scenario's uncommitted_cents"
    category: business_fiscal
    error_id: ERR_SCENARIO_FUNDS_EXCEEDED
    http_status: 422
    applies_to: "POST /pavement/projects/{id}/award"

  - priority: 76
    rule: "award_amount_cents must be within AWARD_TOLERANCE_PCT (10%) of the project's project_total_estimate_cents"
    category: business_fiscal
    error_id: ERR_AWARD_OUTSIDE_ESTIMATE_TOLERANCE
    http_status: 422
    applies_to: "POST /pavement/projects/{id}/award"

  - priority: 76
    rule: "a manual allocation's allocated_cents must not push the scenario's funded_cost_cents above funding_cents"
    category: business_fiscal
    error_id: ERR_ALLOCATION_EXCEEDS_FUNDING
    http_status: 422
    applies_to: "POST /pavement/scenario-allocations"

  # ---- rules completing the §1.2 error surface ----
  - priority: 50
    rule: "a QC decision requires qc_status IN {PENDING, FLAGGED}; ACCEPTED and REJECTED are terminal"
    category: state
    error_id: ERR_OBSERVATION_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /pavement/distress-observations/{id}/qc"

  - priority: 50
    rule: "notices may only be managed while the line's work_state IN {PLANNED, IN_PROGRESS, REMEDIATION_REQUIRED}"
    category: state
    error_id: ERR_LINE_NOT_NOTIFIABLE
    http_status: 409
    applies_to: "POST /pavement/project-segments/{id}/notice"

  - priority: 50
    rule: "respond with response == SCHEDULE_WORK requires coordination_status == CONFLICT_DECLARED; respond with response == RE_REQUEST requires coordination_status == WORK_COMPLETE"
    category: state
    error_id: "ERR_COORDINATION_NOT_IN_CONFLICT | ERR_COORDINATION_NOT_WORK_COMPLETE"
    http_status: 409
    applies_to: "POST /pavement/utility-coordinations/{id}/respond"

  - priority: 50
    rule: "close with closure_code == PATCHED requires request_status == TRIAGED_PATCH; a NEW or DEFERRED_TO_CAPITAL request can only be closed as DUPLICATE"
    category: state
    error_id: ERR_SERVICE_REQUEST_NOT_TRIAGED
    http_status: 409
    applies_to: "POST /pavement/service-requests/{id}/close"

  - priority: 50
    rule: "substantial completion requires that no ProjectSegment on the project still has work_state IN {PLANNED, IN_PROGRESS}"
    category: state
    error_id: ERR_LINES_WORK_INCOMPLETE
    http_status: 409
    applies_to: "POST /pavement/projects/{id}/substantial-completion"

  - priority: 50
    rule: "a line may be removed only while its work_state == PLANNED"
    category: state
    error_id: ERR_PROJECT_SEGMENT_NOT_REMOVABLE
    http_status: 409
    applies_to: "DELETE /pavement/project-segments/{id}"

  - priority: 50
    rule: "final acceptance requires quality_status == QUALITY_ACCEPTED — an outstanding remediation blocks acceptance even though delivery_status is SUBSTANTIALLY_COMPLETE (the two dimensions gate each other only here)"
    category: cross_entity_state
    error_id: ERR_REMEDIATION_OUTSTANDING
    http_status: 409
    applies_to: "POST /pavement/projects/{id}/accept"

  - priority: 50
    rule: "an APPROVED cut permit may report completion only once (cut_completed_at must be null)"
    category: state
    error_id: ERR_CUT_NOT_APPROVED_OR_ALREADY_COMPLETE
    http_status: 409
    applies_to: "POST /pavement/cut-permits/{id}/complete-cut"

  - priority: 58
    rule: "scheduled utility work must finish on or before the project's planned_start_date — utilities dig before the paver, never after"
    category: business_temporal
    error_id: ERR_UTILITY_WORK_AFTER_PAVING
    http_status: 422
    applies_to: "POST /pavement/utility-coordinations/{id}/respond with response == SCHEDULE_WORK"

  - priority: 64
    rule: "a DEFER_TO_CAPITAL triage target must be a ResurfacingProject with delivery_status != ACCEPTED that contains a non-REMOVED ProjectSegment on the request's segment_id"
    category: business_referential
    error_id: ERR_TARGET_PROJECT_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /pavement/service-requests/{id}/triage"

  - priority: 66
    rule: "a candidate may not be overridden once any BudgetScenario on its survey has scenario_status == ADOPTED — the program of record is frozen"
    category: business_constraint
    error_id: ERR_SURVEY_PROGRAM_LOCKED
    http_status: 409
    applies_to: "POST /pavement/treatment-candidates/{id}/override"

  - priority: 66
    rule: "an inspector may not decide PASS on a test whose computed_outcome == FAIL — the pay-factor math is binding on the PASS path (FAIL and RETEST remain available regardless of computed_outcome)"
    category: business_constraint
    error_id: ERR_TEST_DECISION_CONFLICTS_COMPUTED
    http_status: 422
    applies_to: "POST /pavement/acceptance-tests/{id}/decide with decision == PASS"

# =============================================================================
# §1.5 Endpoint Table
# =============================================================================
endpoints:

  # -------------------------------------------------------- logical clock ---
  - method: POST
    path: /pavement/_clock/set_current_utc
    purpose: "Test-driving endpoint (§1.5 priority-3 last resort): sets the logical clock that every timestamp, age, SLA, moratorium and lead-time rule reads. MANDATORY DEFAULT: before any call, the logical clock is 2026-08-01T00:00:00Z."
    roles: [PavementEngineer, BudgetOfficer, UtilityCoordinator, Inspector, Contractor, Resident]
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock; no entity is mutated and no derived field is recomputed by this call alone"

  # ------------------------------------------------------ network segment ---
  - method: POST
    path: /pavement/segments
    purpose: "Load one pavement inventory segment. Computes area_sy and seeds condition_index from the deterioration model (MODEL_PROJECTED)."
    roles: [PavementEngineer]
    input: [street_name, from_node, to_node, geo_zone, functional_class, surface_type, length_ft, width_ft, baseline_condition_index, "last_treatment_date?"]
    output: NetworkSegment
    side_effects:
      - "computes area_sy per calculations.segment_area_sy"
      - "sets decay_coefficient and decay_knee_coefficient from DECAY_TABLE[functional_class]"
      - "computes condition_index per calculations.model_projected_condition_index at the current logical clock, sets condition_index_source = MODEL_PROJECTED and derives condition_band"
      - "initialises active_project_count = 0, open_service_request_count = 0, moratorium_until = null"

  - method: GET
    path: /pavement/segments/{id}
    purpose: "Read one segment with its stored condition_index, band, moratorium and counters."
    roles: [PavementEngineer, BudgetOfficer, UtilityCoordinator, Inspector, Contractor, Resident]
    input: []
    output: NetworkSegment
    side_effects: []

  - method: GET
    path: /pavement/segments
    purpose: "List the network with filtering; supports the geographic bundling workflow."
    roles: [PavementEngineer, BudgetOfficer, UtilityCoordinator, Inspector, Contractor, Resident]
    input: ["geo_zone?", "functional_class?", "condition_band?", "limit?", "offset?"]
    output: NetworkSegment[]
    side_effects: []

  # ----------------------------------------------------- condition survey ---
  - method: POST
    path: /pavement/condition-surveys
    purpose: "Open a network condition survey for one program year."
    roles: [PavementEngineer]
    input: [survey_year, collection_method]
    output: ConditionSurvey
    side_effects:
      - "survey_status = OPEN, observation_count = 0, accepted_observation_count = 0"

  - method: GET
    path: /pavement/condition-surveys/{id}
    purpose: "Read one survey including its sealed network_condition_index."
    roles: [PavementEngineer, BudgetOfficer, Inspector]
    input: []
    output: ConditionSurvey
    side_effects: []

  - method: GET
    path: /pavement/condition-surveys
    purpose: "List surveys."
    roles: [PavementEngineer, BudgetOfficer, Inspector]
    input: ["survey_status?", "survey_year?", "limit?", "offset?"]
    output: ConditionSurvey[]
    side_effects: []

  - method: POST
    path: /pavement/condition-surveys/{id}/seal
    purpose: "Seal the survey: freeze the network condition index and publish measured PCI onto every surveyed segment, cascading through stale candidates, allocations and scenarios."
    roles: [PavementEngineer]
    input: []
    output: ConditionSurvey
    side_effects:
      - "state_machines.ConditionSurvey OPEN -> SEALED with its four-level cascade"
      - "stamps sealed_at and network_condition_index"

  - method: POST
    path: /pavement/condition-surveys/{id}/generate-candidates
    purpose: "Run treatment selection over the sealed survey and emit one TreatmentCandidate per eligible segment, ordered worst-PCI-first."
    roles: [PavementEngineer]
    input: []
    output: TreatmentCandidate[]
    side_effects:
      - "creates TreatmentCandidate rows per calculations.treatment_selection, each with estimated_cost_cents and benefit_cost_ratio computed"
      - "segments with condition_index >= NO_TREATMENT_CEILING (90.0) produce no candidate"

  # ------------------------------------------------- distress observation ---
  - method: POST
    path: /pavement/distress-observations
    purpose: "Record one segment's automated distress collection and compute its SURVEY_MEASURED condition index."
    roles: [PavementEngineer]
    input: [survey_id, segment_id, alligator_cracking_sqft, longitudinal_cracking_lf, rutting_depth_in, patching_sqft, iri_in_per_mi, sample_coverage_pct]
    output: DistressObservation
    side_effects:
      - "computes deduct_total and measured_condition_index per calculations.survey_measured_condition_index"
      - "qc_status = PENDING; increments ConditionSurvey.observation_count"

  - method: GET
    path: /pavement/distress-observations/{id}
    purpose: "Read one distress observation."
    roles: [PavementEngineer, BudgetOfficer, Inspector]
    input: []
    output: DistressObservation
    side_effects: []

  - method: GET
    path: /pavement/distress-observations
    purpose: "List distress observations, filterable by survey and by segment (reverse reachability for both FKs)."
    roles: [PavementEngineer, BudgetOfficer, Inspector]
    input: ["survey_id?", "segment_id?", "qc_status?", "limit?", "offset?"]
    output: DistressObservation[]
    side_effects: []

  - method: POST
    path: /pavement/distress-observations/{id}/qc
    purpose: "Accept, flag or reject an observation. Only ACCEPTED observations reach the seal cascade."
    roles: [PavementEngineer]
    input: [qc_decision, "qc_note?"]
    output: DistressObservation
    side_effects:
      - "state_machines.DistressObservation transition; ACCEPT increments ConditionSurvey.accepted_observation_count"

  # ---------------------------------------------------- treatment candidate ---
  - method: GET
    path: /pavement/treatment-candidates/{id}
    purpose: "Read one treatment candidate with its cost and benefit-cost ratio."
    roles: [PavementEngineer, BudgetOfficer, Inspector]
    input: []
    output: TreatmentCandidate
    side_effects: []

  - method: GET
    path: /pavement/treatment-candidates
    purpose: "List candidates, filterable by survey and by segment (reverse reachability for both FKs)."
    roles: [PavementEngineer, BudgetOfficer, Inspector]
    input: ["survey_id?", "segment_id?", "candidate_status?", "treatment_type?", "limit?", "offset?"]
    output: TreatmentCandidate[]
    side_effects: []

  - method: POST
    path: /pavement/treatment-candidates/{id}/override
    purpose: "Engineer override of the model-selected treatment; re-prices the candidate against the unchanged PCI snapshot."
    roles: [PavementEngineer]
    input: [treatment_type, override_reason]
    output: TreatmentCandidate
    side_effects:
      - "state_machines.TreatmentCandidate RECOMMENDED -> OVERRIDDEN"
      - "recomputes expected_service_life_years, treatment_pci_gain, estimated_cost_cents, benefit_cost_ratio"

  # -------------------------------------------------------- budget scenario ---
  - method: POST
    path: /pavement/budget-scenarios
    purpose: "Create a funding-level what-if over one sealed survey."
    roles: [BudgetOfficer, PavementEngineer]
    input: [survey_id, scenario_name, funding_cents, strategy, horizon_years]
    output: BudgetScenario
    side_effects:
      - "stamps analysis_date = logical clock now; scenario_status = DRAFT; all money and PCI outputs null/zero until the first run"

  - method: GET
    path: /pavement/budget-scenarios/{id}
    purpose: "Read one scenario with its allocation totals, committed/uncommitted split and both projection arms."
    roles: [BudgetOfficer, PavementEngineer, Inspector]
    input: []
    output: BudgetScenario
    side_effects: []

  - method: GET
    path: /pavement/budget-scenarios
    purpose: "List scenarios, filterable by survey (reverse reachability for survey_id)."
    roles: [BudgetOfficer, PavementEngineer, Inspector]
    input: ["survey_id?", "scenario_status?", "limit?", "offset?"]
    output: BudgetScenario[]
    side_effects: []

  - method: POST
    path: /pavement/budget-scenarios/{id}/run
    purpose: "Run the waterfall at this funding level and project network condition at the horizon under both the funded and the do-nothing arm."
    roles: [PavementEngineer, BudgetOfficer]
    input: []
    output: BudgetScenario
    side_effects:
      - "state_machines.BudgetScenario DRAFT -> COMPUTED, or COMPUTED -> COMPUTED on re-run (deletes AUTO_RUN allocations first, keeps MANUAL_ADD rows)"
      - "creates ScenarioAllocation rows per calculations.scenario_waterfall_allocation"
      - "computes projected_network_pci and do_nothing_network_pci per calculations.projected_network_pci"

  - method: POST
    path: /pavement/budget-scenarios/{id}/adopt
    purpose: "Adopt this funding level as the capital program of record; supersedes any sibling scenario of the same survey."
    roles: [BudgetOfficer]
    input: []
    output: BudgetScenario
    side_effects:
      - "state_machines.BudgetScenario COMPUTED -> ADOPTED; sibling ADOPTED scenarios move to SUPERSEDED"
      - "records adopted_by_user_id = X-User-ID (the segregation-of-duties anchor for awards)"
      - "sets uncommitted_cents = funding_cents - committed_cents"

  # ----------------------------------------------------- scenario allocation ---
  - method: POST
    path: /pavement/scenario-allocations
    purpose: "Budget officer adds one candidate to the scenario by hand, outside the waterfall. Optimistically concurrent on the parent scenario."
    roles: [BudgetOfficer]
    input: [scenario_id, candidate_id, expected_scenario_version]
    output: ScenarioAllocation
    side_effects:
      - "creates the row with source = MANUAL_ADD, allocation_status = FUNDED, allocated_cents = candidate.estimated_cost_cents, rank = max(existing rank) + 1"
      - "parent BudgetScenario recomputes allocation_count, funded_cost_cents and uncommitted_cents"
      - "increments BudgetScenario.version by 1"

  - method: GET
    path: /pavement/scenario-allocations/{id}
    purpose: "Read one allocation."
    roles: [BudgetOfficer, PavementEngineer, Inspector]
    input: []
    output: ScenarioAllocation
    side_effects: []

  - method: GET
    path: /pavement/scenario-allocations
    purpose: "List allocations, filterable by scenario and by candidate (reverse reachability for both FKs); ordered by rank ascending."
    roles: [BudgetOfficer, PavementEngineer, Inspector]
    input: ["scenario_id?", "candidate_id?", "allocation_status?", "source?", "limit?", "offset?"]
    output: ScenarioAllocation[]
    side_effects: []

  # -------------------------------------------------------------- contractor ---
  - method: POST
    path: /pavement/contractors
    purpose: "Register a paving contractor with its crew capacity."
    roles: [PavementEngineer]
    input: [legal_name, max_concurrent_projects]
    output: Contractor
    side_effects:
      - "standing = GOOD_STANDING, interim_performance_score = 100.0, final_performance_score = null, all counters 0"

  - method: GET
    path: /pavement/contractors/{id}
    purpose: "Read one contractor with its standing and both performance scores."
    roles: [PavementEngineer, BudgetOfficer, Inspector, Contractor]
    input: []
    output: Contractor
    side_effects: []

  - method: GET
    path: /pavement/contractors
    purpose: "List contractors."
    roles: [PavementEngineer, BudgetOfficer, Inspector]
    input: ["standing?", "limit?", "offset?"]
    output: Contractor[]
    side_effects: []

  - method: GET
    path: /pavement/contractors/{id}/scorecard
    purpose: "Computed read: contractor performance measurement showing BOTH variants of calculations.contractor_performance_score side by side with their component breakdown."
    roles: [PavementEngineer, BudgetOfficer, Inspector, Contractor]
    input: []
    output: "{ contractor_id: string, standing: string, interim_performance_score: number, interim_quality_component: number, interim_schedule_component: number, interim_remediation_component: number, final_performance_score: number, final_quality_component: number, final_schedule_component: number, final_remediation_component: number, passed_test_count: integer, failed_test_count: integer, remediation_event_count: integer, days_late_total: integer, accepted_project_count: integer }"
    side_effects: []

  # ------------------------------------------------------ resurfacing project ---
  - method: POST
    path: /pavement/projects
    purpose: "Create a resurfacing project (a geographic bundle) under an adopted scenario."
    roles: [PavementEngineer]
    input: [scenario_id, project_name, geo_zone, planned_start_date, planned_end_date]
    output: ResurfacingProject
    side_effects:
      - "delivery_status = DRAFT, quality_status = NOT_STARTED, contractor_id = null, all money and counters zero"

  - method: GET
    path: /pavement/projects/{id}
    purpose: "Read one project with both state dimensions, the estimate breakdown and its counters."
    roles: [PavementEngineer, BudgetOfficer, UtilityCoordinator, Inspector, Contractor]
    input: []
    output: ResurfacingProject
    side_effects: []

  - method: GET
    path: /pavement/projects
    purpose: "List projects, filterable by scenario and by contractor (reverse reachability for both FKs)."
    roles: [PavementEngineer, BudgetOfficer, UtilityCoordinator, Inspector, Contractor]
    input: ["scenario_id?", "contractor_id?", "delivery_status?", "quality_status?", "geo_zone?", "limit?", "offset?"]
    output: ResurfacingProject[]
    side_effects: []

  - method: POST
    path: /pavement/projects/{id}/advance
    purpose: "Drive the delivery dimension forward: START_COORDINATION opens the utility roster, BID_READY prices the bundle, START_CONSTRUCTION puts crews on the street."
    roles: [PavementEngineer]
    input: [action]
    output: ResurfacingProject
    side_effects:
      - "action == START_COORDINATION: DRAFT -> COORDINATING and creates the four UtilityCoordination rows"
      - "action == BID_READY: COORDINATING -> BID_READY and recomputes bundle_base_cents, contingency_cents, utility_share_cents, project_total_estimate_cents"
      - "action == START_CONSTRUCTION: AWARDED -> IN_CONSTRUCTION and moves every PLANNED line to IN_PROGRESS"

  - method: POST
    path: /pavement/projects/{id}/award
    purpose: "Award the bundle to a contractor, committing scenario funds. Segregated from adoption."
    roles: [BudgetOfficer]
    input: [contractor_id, award_amount_cents]
    output: ResurfacingProject
    side_effects:
      - "BID_READY -> AWARDED; sets contractor_id and award_amount_cents"
      - "parent BudgetScenario.committed_cents += award_amount_cents, uncommitted_cents recomputed, version += 1"

  - method: POST
    path: /pavement/projects/{id}/cancel-award
    purpose: "Compensating action: unwind an award and return the money to the scenario with zero drift."
    roles: [BudgetOfficer]
    input: ["cancellation_reason?"]
    output: ResurfacingProject
    side_effects:
      - "AWARDED -> BID_READY; clears contractor_id and award_amount_cents"
      - "parent BudgetScenario.committed_cents -= the stored award_amount_cents, uncommitted_cents recomputed, version += 1"

  - method: POST
    path: /pavement/projects/{id}/substantial-completion
    purpose: "Contractor declares substantial completion; realized lateness enters the INTERIM performance score."
    roles: [Contractor]
    input: []
    output: ResurfacingProject
    side_effects:
      - "IN_CONSTRUCTION -> SUBSTANTIALLY_COMPLETE; stamps substantial_completion_at and days_late"
      - "recomputes Contractor.interim_performance_score and re-derives standing"

  - method: POST
    path: /pavement/projects/{id}/accept
    purpose: "Final acceptance: publishes the new pavement onto the network, opens the utility-cut moratorium, re-prices pending cut permits and closes deferred complaints."
    roles: [Inspector]
    input: ["acceptance_note?"]
    output: ResurfacingProject
    side_effects:
      - "SUBSTANTIALLY_COMPLETE -> ACCEPTED with CASCADE L1..L4 per state_machines.ResurfacingProject (delivery)"
      - "recomputes Contractor.final_performance_score, interim_performance_score and standing"

  # -------------------------------------------------------- project segment ---
  - method: POST
    path: /pavement/project-segments
    purpose: "Add one funded candidate's segment to a project bundle. Optimistically concurrent on the parent project."
    roles: [PavementEngineer]
    input: [project_id, segment_id, candidate_id, work_window_start, work_window_end, expected_project_version, "design_thickness_in?"]
    output: ProjectSegment
    side_effects:
      - "copies treatment_type from the candidate and line_area_sy from the segment; computes line_cost_cents"
      - "work_state = PLANNED, notice_state = PENDING, notice_round = 1 (the round counter only advances on RESCHEDULE)"
      - "TreatmentCandidate -> CONSUMED"
      - "parent project segment_count += 1, planned_area_sy += line_area_sy, estimate recomputed, version += 1"
      - "NetworkSegment.active_project_count += 1"

  - method: GET
    path: /pavement/project-segments/{id}
    purpose: "Read one project line with both of its state dimensions."
    roles: [PavementEngineer, BudgetOfficer, UtilityCoordinator, Inspector, Contractor, Resident]
    input: []
    output: ProjectSegment
    side_effects: []

  - method: GET
    path: /pavement/project-segments
    purpose: "List project lines, filterable by project, segment and candidate (reverse reachability for all three FKs)."
    roles: [PavementEngineer, BudgetOfficer, UtilityCoordinator, Inspector, Contractor, Resident]
    input: ["project_id?", "segment_id?", "candidate_id?", "work_state?", "notice_state?", "limit?", "offset?"]
    output: ProjectSegment[]
    side_effects: []

  - method: DELETE
    path: /pavement/project-segments/{id}
    purpose: "Compensating action: pull a planned line back out of the bundle, restoring every conserved quantity and returning the candidate to the pool."
    roles: [PavementEngineer]
    input: []
    output: ProjectSegment
    side_effects:
      - "work_state PLANNED -> REMOVED"
      - "parent project segment_count -= 1, planned_area_sy -= line_area_sy, estimate recomputed, version += 1"
      - "NetworkSegment.active_project_count -= 1"
      - "TreatmentCandidate returns to RECOMMENDED (no override_reason) or OVERRIDDEN (override_reason present)"

  - method: POST
    path: /pavement/project-segments/{id}/notice
    purpose: "Resident notification workflow for one line: SCHEDULE publishes the parking-restriction window and driveway access plan, DELIVER records delivery, RESCHEDULE re-arms the whole gate for a new window."
    roles: [PavementEngineer]
    input: [action, "parking_restriction_start?", "parking_restriction_end?", "driveway_access_plan?"]
    output: ProjectSegment
    side_effects:
      - "SCHEDULE: notice_state PENDING -> SCHEDULED, records the window and plan, notice_round = 1"
      - "DELIVER: notice_state SCHEDULED -> DELIVERED, stamps notice_delivered_at"
      - "RESCHEDULE: notice_state DELIVERED -> SCHEDULED, overwrites the window, clears notice_delivered_at, notice_round += 1"

  # ---------------------------------------------------- utility coordination ---
  - method: GET
    path: /pavement/utility-coordinations/{id}
    purpose: "Read one utility clearance row."
    roles: [PavementEngineer, UtilityCoordinator, BudgetOfficer, Inspector]
    input: []
    output: UtilityCoordination
    side_effects: []

  - method: GET
    path: /pavement/utility-coordinations
    purpose: "List clearance rows, filterable by project (reverse reachability for project_id). Ordered by created_at ascending, which is the roster creation order WATER, SEWER, FRANCHISE_GAS, FRANCHISE_TELECOM."
    roles: [PavementEngineer, UtilityCoordinator, BudgetOfficer, Inspector]
    input: ["project_id?", "coordination_status?", "utility?", "limit?", "offset?"]
    output: UtilityCoordination[]
    side_effects: []

  - method: POST
    path: /pavement/utility-coordinations/{id}/respond
    purpose: "Utility answers the clearance request: CLEAR, CONFLICT, SCHEDULE_WORK (with a pre-paving window) or RE_REQUEST after its work is done."
    roles: [UtilityCoordinator]
    input: [response, "response_note?", "planned_work_start?", "planned_work_end?"]
    output: UtilityCoordination
    side_effects:
      - "CLEAR from round_count == 1 -> CLEARED; CLEAR from round_count >= 2 -> CLEARED_AFTER_WORK (which switches on the project's utility_share_cents)"
      - "CONFLICT -> CONFLICT_DECLARED; SCHEDULE_WORK -> WORK_SCHEDULED; RE_REQUEST -> CLEARANCE_REQUESTED with round_count += 1"
      - "CLEAR decrements parent ResurfacingProject.clearance_outstanding_count"

  - method: POST
    path: /pavement/utility-coordinations/{id}/complete-work
    purpose: "Utility reports its pre-paving work finished."
    roles: [UtilityCoordinator]
    input: []
    output: UtilityCoordination
    side_effects:
      - "WORK_SCHEDULED -> WORK_COMPLETE; stamps work_completed_at"

  # -------------------------------------------------------------- cut permit ---
  - method: POST
    path: /pavement/cut-permits
    purpose: "Utility applies to cut into city pavement. The initial state branches on the segment's moratorium, and the degradation fee is tiered on the remaining moratorium."
    roles: [UtilityCoordinator]
    input: [segment_id, applicant_utility, requested_start, requested_end, cut_area_sqft, emergency]
    output: CutPermit
    side_effects:
      - "permit_status = PENDING (no active moratorium, or emergency) or MORATORIUM_REVIEW (inside moratorium, non-emergency)"
      - "computes moratorium_remaining_days, fee_multiplier and degradation_fee_cents per calculations.cut_permit_degradation_fee"

  - method: GET
    path: /pavement/cut-permits/{id}
    purpose: "Read one cut permit with its moratorium tier and fee."
    roles: [PavementEngineer, UtilityCoordinator, Inspector]
    input: []
    output: CutPermit
    side_effects: []

  - method: GET
    path: /pavement/cut-permits
    purpose: "List cut permits, filterable by segment (reverse reachability for segment_id)."
    roles: [PavementEngineer, UtilityCoordinator, Inspector]
    input: ["segment_id?", "permit_status?", "applicant_utility?", "limit?", "offset?"]
    output: CutPermit[]
    side_effects: []

  - method: POST
    path: /pavement/cut-permits/{id}/decide
    purpose: "City decides the cut application; a MORATORIUM_REVIEW permit needs a written waiver."
    roles: [PavementEngineer]
    input: [decision, "waiver_reason?"]
    output: CutPermit
    side_effects:
      - "APPROVE -> APPROVED (records waiver_reason when reviewing a moratorium), DENY -> DENIED; stamps decided_at"

  - method: POST
    path: /pavement/cut-permits/{id}/complete-cut
    purpose: "Utility reports the trench backfilled and restored, clearing the safety block on paving."
    roles: [UtilityCoordinator]
    input: []
    output: CutPermit
    side_effects:
      - "stamps cut_completed_at, releasing validations[priority=52] ERR_OPEN_CUT_ON_SEGMENT"

  # --------------------------------------------------------- acceptance test ---
  - method: POST
    path: /pavement/acceptance-tests
    purpose: "Inspector submits pavement quality acceptance measurements for one line; the composite pay factor and the system verdict are computed and frozen at submission."
    roles: [Inspector]
    input: [project_segment_id, core_density_pct, iri_in_per_mi, thickness_in, witness_inspector_user_id]
    output: AcceptanceTest
    side_effects:
      - "computes computed_pay_factor and computed_outcome per calculations.acceptance_pay_factor"
      - "test_round = prior max on the line + 1; any FAILED or RETEST_ORDERED test on the line moves to SUPERSEDED"
      - "a REMEDIATION_REQUIRED line returns to IN_PROGRESS and parent open_remediation_count -= 1"
      - "parent project quality_status NOT_STARTED -> TESTING on the first test"

  - method: GET
    path: /pavement/acceptance-tests/{id}
    purpose: "Read one acceptance test with its pay factor and verdict."
    roles: [PavementEngineer, Inspector, BudgetOfficer, Contractor]
    input: []
    output: AcceptanceTest
    side_effects: []

  - method: GET
    path: /pavement/acceptance-tests
    purpose: "List acceptance tests, filterable by line (reverse reachability for project_segment_id)."
    roles: [PavementEngineer, Inspector, BudgetOfficer, Contractor]
    input: ["project_segment_id?", "test_status?", "limit?", "offset?"]
    output: AcceptanceTest[]
    side_effects: []

  - method: POST
    path: /pavement/acceptance-tests/{id}/decide
    purpose: "A second inspector decides the test. PASS completes the line, FAIL drives the four-level remediation cascade into contractor standing, RETEST is the no-fault path."
    roles: [Inspector]
    input: [decision, "decision_note?"]
    output: AcceptanceTest
    side_effects:
      - "PASS -> PASSED: line IN_PROGRESS -> WORK_COMPLETE, pay_factor set, Contractor.passed_test_count += 1, quality may bubble to QUALITY_ACCEPTED"
      - "FAIL -> FAILED: CASCADE L1..L4 onto line, project quality, contractor counters and contractor standing"
      - "RETEST -> RETEST_ORDERED: no counter moves, line stays IN_PROGRESS"

  # -------------------------------------------------------- service request ---
  - method: POST
    path: /pavement/service-requests
    purpose: "Resident reports a pothole or other pavement complaint; the SLA clock starts immediately."
    roles: [Resident, PavementEngineer]
    input: [segment_id, complaint_type, reported_severity, location_note]
    output: ServiceRequest
    side_effects:
      - "request_status = NEW; computes sla_due_at per calculations.service_request_sla"
      - "NetworkSegment.open_service_request_count += 1"

  - method: GET
    path: /pavement/service-requests/{id}
    purpose: "Read one service request with its SLA state."
    roles: [PavementEngineer, BudgetOfficer, Inspector, Resident]
    input: []
    output: ServiceRequest
    side_effects: []

  - method: GET
    path: /pavement/service-requests
    purpose: "List service requests, filterable by segment and by capital project (reverse reachability for both FKs)."
    roles: [PavementEngineer, BudgetOfficer, Inspector, Resident]
    input: ["segment_id?", "capital_project_id?", "request_status?", "reported_severity?", "limit?", "offset?"]
    output: ServiceRequest[]
    side_effects: []

  - method: POST
    path: /pavement/service-requests/{id}/triage
    purpose: "Integration point with the capital program: PATCH keeps the complaint in maintenance, DEFER_TO_CAPITAL attaches it to a resurfacing project so it closes when the street is rebuilt."
    roles: [PavementEngineer]
    input: [disposition, "target_project_id?"]
    output: ServiceRequest
    side_effects:
      - "PATCH -> TRIAGED_PATCH, capital_project_id stays null"
      - "DEFER_TO_CAPITAL -> DEFERRED_TO_CAPITAL, sets capital_project_id"
      - "stamps triaged_at; open_service_request_count is UNCHANGED by triage"

  - method: POST
    path: /pavement/service-requests/{id}/close
    purpose: "Close a complaint by patch or as a duplicate."
    roles: [PavementEngineer]
    input: [closure_code]
    output: ServiceRequest
    side_effects:
      - "PATCHED requires TRIAGED_PATCH -> CLOSED_PATCHED; DUPLICATE closes from any open state -> CLOSED_DUPLICATE"
      - "stamps closed_at, recomputes sla_breached, NetworkSegment.open_service_request_count -= 1"

# =============================================================================
# §1.6 Error Catalog  (every code is triggerable; see §1.9 for the coverage walk)
# =============================================================================
errors:
  # ---- envelope / identity ----
  - { error_id: ERR_UNAUTHENTICATED, http_status: 401, when: "X-User-ID or X-Role header missing or empty on any endpoint" }
  - { error_id: ERR_UNAUTHORIZED, http_status: 403, when: "X-Role is not permitted for the requested operation per §1.7" }
  - { error_id: ERR_UNKNOWN_CONTRACTOR_IDENTITY, http_status: 403, when: "X-Role is Contractor but X-User-ID is not an existing Contractor.id" }
  - { error_id: ERR_NOT_PROJECT_CONTRACTOR, http_status: 403, when: "a Contractor caller acts on a project whose contractor_id is not the caller" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, when: "the witnessing inspector decides the same acceptance test, or the adopting budget officer awards from the scenario they adopted" }
  - { error_id: ERR_INVALID_REQUEST, http_status: 400, when: "missing or malformed required body field, bad enum, out-of-range number, non-ISO timestamp, end <= start, limit outside 1..100, offset < 0, or an override that does not change treatment_type" }
  # ---- existence ----
  - { error_id: ERR_SEGMENT_NOT_FOUND, http_status: 404, when: "segment id or segment_id does not resolve" }
  - { error_id: ERR_SURVEY_NOT_FOUND, http_status: 404, when: "survey id or survey_id does not resolve" }
  - { error_id: ERR_OBSERVATION_NOT_FOUND, http_status: 404, when: "distress observation id does not resolve" }
  - { error_id: ERR_CANDIDATE_NOT_FOUND, http_status: 404, when: "candidate id or candidate_id does not resolve" }
  - { error_id: ERR_SCENARIO_NOT_FOUND, http_status: 404, when: "scenario id or scenario_id does not resolve" }
  - { error_id: ERR_ALLOCATION_NOT_FOUND, http_status: 404, when: "scenario allocation id does not resolve" }
  - { error_id: ERR_CONTRACTOR_NOT_FOUND, http_status: 404, when: "contractor id or contractor_id does not resolve" }
  - { error_id: ERR_PROJECT_NOT_FOUND, http_status: 404, when: "project id, project_id, capital_project_id or target_project_id does not resolve" }
  - { error_id: ERR_PROJECT_SEGMENT_NOT_FOUND, http_status: 404, when: "project line id or project_segment_id does not resolve" }
  - { error_id: ERR_COORDINATION_NOT_FOUND, http_status: 404, when: "utility coordination id does not resolve" }
  - { error_id: ERR_CUT_PERMIT_NOT_FOUND, http_status: 404, when: "cut permit id does not resolve" }
  - { error_id: ERR_ACCEPTANCE_TEST_NOT_FOUND, http_status: 404, when: "acceptance test id does not resolve" }
  - { error_id: ERR_SERVICE_REQUEST_NOT_FOUND, http_status: 404, when: "service request id does not resolve" }
  # ---- optimistic concurrency (§1.2.1) ----
  - { error_id: ERR_STALE_SCENARIO_VERSION, http_status: 412, when: "expected_scenario_version does not equal BudgetScenario.version on POST /pavement/scenario-allocations" }
  - { error_id: ERR_STALE_PROJECT_VERSION, http_status: 412, when: "expected_project_version does not equal ResurfacingProject.version on POST /pavement/project-segments" }
  # ---- survey / observation state ----
  - { error_id: ERR_SURVEY_NOT_OPEN, http_status: 409, when: "observations, QC decisions or a seal are attempted on a survey whose survey_status != OPEN" }
  - { error_id: ERR_SURVEY_NOT_SEALED, http_status: 409, when: "candidate generation is attempted on a survey whose survey_status != SEALED" }
  - { error_id: ERR_OBSERVATIONS_PENDING_QC, http_status: 409, when: "a seal is attempted while some observation is still qc_status == PENDING" }
  - { error_id: ERR_SURVEY_HAS_NO_ACCEPTED_OBSERVATIONS, http_status: 409, when: "a seal is attempted with accepted_observation_count == 0" }
  - { error_id: ERR_OBSERVATION_ALREADY_DECIDED, http_status: 409, when: "QC is attempted on an ACCEPTED or REJECTED observation" }
  - { error_id: ERR_DUPLICATE_OBSERVATION, http_status: 409, when: "a second observation is created for the same survey_id and segment_id" }
  - { error_id: ERR_CANDIDATES_ALREADY_GENERATED, http_status: 409, when: "candidate generation is run twice on the same survey" }
  # ---- candidate ----
  - { error_id: ERR_CANDIDATE_NOT_OVERRIDABLE, http_status: 409, when: "override is attempted on a CONSUMED or SUPERSEDED candidate" }
  - { error_id: ERR_SURVEY_PROGRAM_LOCKED, http_status: 409, when: "override is attempted after a scenario on the candidate's survey reached ADOPTED" }
  # ---- scenario / allocation ----
  - { error_id: ERR_SCENARIO_NOT_RUNNABLE, http_status: 409, when: "run is attempted on an ADOPTED or SUPERSEDED scenario" }
  - { error_id: ERR_SCENARIO_NOT_ADOPTABLE, http_status: 409, when: "adopt is attempted on a scenario whose scenario_status != COMPUTED" }
  - { error_id: ERR_SCENARIO_HAS_NO_ALLOCATIONS, http_status: 422, when: "adopt is attempted on a COMPUTED scenario with allocation_count == 0 (empty candidate pool)" }
  - { error_id: ERR_SCENARIO_HAS_PROGRAMMED_PROJECTS, http_status: 409, when: "re-run is attempted while some project on the scenario has advanced past DRAFT" }
  - { error_id: ERR_SCENARIO_FROZEN, http_status: 409, when: "a manual allocation is attempted on an ADOPTED or SUPERSEDED scenario" }
  - { error_id: ERR_CANDIDATE_SURVEY_MISMATCH, http_status: 422, when: "a manual allocation references a candidate from a different survey than the scenario's" }
  - { error_id: ERR_ALLOCATION_EXCEEDS_FUNDING, http_status: 422, when: "a manual allocation would push funded_cost_cents above funding_cents" }
  # ---- project delivery state ----
  - { error_id: ERR_SCENARIO_NOT_ADOPTED, http_status: 422, when: "a project is created under, or awarded from, a scenario whose scenario_status != ADOPTED" }
  - { error_id: ERR_PROJECT_WINDOW_BEFORE_ANALYSIS_DATE, http_status: 422, when: "planned_start_date precedes the scenario's analysis_date" }
  - { error_id: ERR_PROJECT_NOT_DRAFT, http_status: 409, when: "START_COORDINATION is attempted on a project whose delivery_status != DRAFT" }
  - { error_id: ERR_PROJECT_NOT_COORDINATING, http_status: 409, when: "BID_READY is attempted on a project whose delivery_status != COORDINATING" }
  - { error_id: ERR_PROJECT_NOT_BID_READY, http_status: 409, when: "award is attempted on a project whose delivery_status != BID_READY" }
  - { error_id: ERR_PROJECT_NOT_AWARDED, http_status: 409, when: "cancel-award or START_CONSTRUCTION is attempted on a project whose delivery_status != AWARDED" }
  - { error_id: ERR_PROJECT_NOT_IN_CONSTRUCTION, http_status: 409, when: "substantial-completion is attempted on a project whose delivery_status != IN_CONSTRUCTION" }
  - { error_id: ERR_PROJECT_NOT_SUBSTANTIALLY_COMPLETE, http_status: 409, when: "accept is attempted on a project whose delivery_status != SUBSTANTIALLY_COMPLETE" }
  - { error_id: ERR_PROJECT_HAS_NO_SEGMENTS, http_status: 422, when: "START_COORDINATION or BID_READY is attempted with segment_count == 0 (empty bundle)" }
  - { error_id: ERR_PROJECT_SCOPE_LOCKED, http_status: 409, when: "a line is added or removed after the project left DRAFT/COORDINATING" }
  - { error_id: ERR_UTILITY_CLEARANCE_PENDING, http_status: 409, when: "BID_READY is attempted while clearance_outstanding_count > 0" }
  - { error_id: ERR_NOTICES_NOT_DELIVERED, http_status: 409, when: "START_CONSTRUCTION is attempted while some non-REMOVED line has notice_state != DELIVERED" }
  - { error_id: ERR_OPEN_CUT_ON_SEGMENT, http_status: 409, when: "START_CONSTRUCTION is attempted while a segment under the project has an APPROVED CutPermit with cut_completed_at == null" }
  - { error_id: ERR_LINES_WORK_INCOMPLETE, http_status: 409, when: "substantial-completion is attempted while some line is still PLANNED or IN_PROGRESS" }
  - { error_id: ERR_COMPLETION_BEFORE_START, http_status: 422, when: "the substantial-completion instant precedes planned_start_date" }
  - { error_id: ERR_REMEDIATION_OUTSTANDING, http_status: 409, when: "accept is attempted while quality_status != QUALITY_ACCEPTED" }
  - { error_id: ERR_ACCEPTANCE_TESTS_INCOMPLETE, http_status: 409, when: "accept is attempted while some non-CRACK_SEAL line lacks a PASSED test at its highest test_round" }
  # ---- award: contractor, capacity, money ----
  - { error_id: ERR_CONTRACTOR_NOT_IN_GOOD_STANDING, http_status: 409, when: "award is attempted to a contractor whose standing is WATCH or SUSPENDED" }
  - { error_id: ERR_CONTRACTOR_CAPACITY_EXCEEDED, http_status: 409, when: "the award would give the contractor more than max_concurrent_projects with intersecting closed construction intervals" }
  - { error_id: ERR_SCENARIO_FUNDS_EXCEEDED, http_status: 422, when: "award_amount_cents exceeds the scenario's uncommitted_cents" }
  - { error_id: ERR_AWARD_OUTSIDE_ESTIMATE_TOLERANCE, http_status: 422, when: "award_amount_cents deviates from project_total_estimate_cents by more than 10%" }
  # ---- project line ----
  - { error_id: ERR_CANDIDATE_SEGMENT_MISMATCH, http_status: 422, when: "the line's candidate references a different segment than the line's segment_id" }
  - { error_id: ERR_CANDIDATE_NOT_FUNDED, http_status: 422, when: "the line's candidate has no FUNDED ScenarioAllocation in the project's scenario" }
  - { error_id: ERR_SEGMENT_ZONE_MISMATCH, http_status: 422, when: "the line's segment sits in a different geo_zone than the project" }
  - { error_id: ERR_CANDIDATE_ALREADY_PROGRAMMED, http_status: 409, when: "the candidate already backs a non-REMOVED line" }
  - { error_id: ERR_DUPLICATE_PROJECT_SEGMENT, http_status: 409, when: "the same segment is added twice to one project with both lines non-REMOVED" }
  - { error_id: ERR_SEGMENT_WINDOW_CONFLICT, http_status: 409, when: "the line's half-open work window overlaps another non-REMOVED line's window on the same segment" }
  - { error_id: ERR_PROJECT_SEGMENT_NOT_REMOVABLE, http_status: 409, when: "removal is attempted on a line whose work_state != PLANNED" }
  # ---- resident notice ----
  - { error_id: ERR_LINE_NOT_NOTIFIABLE, http_status: 409, when: "a notice action is attempted on a line whose work_state is WORK_COMPLETE, ACCEPTED or REMOVED" }
  - { error_id: ERR_NOTICE_ALREADY_SCHEDULED, http_status: 409, when: "SCHEDULE is attempted on a line whose notice_state != PENDING" }
  - { error_id: ERR_NOTICE_NOT_SCHEDULED, http_status: 409, when: "DELIVER is attempted on a line whose notice_state != SCHEDULED" }
  - { error_id: ERR_NOTICE_NOT_DELIVERED, http_status: 409, when: "RESCHEDULE is attempted on a line whose notice_state != DELIVERED" }
  - { error_id: ERR_NOTICE_LEAD_TIME_TOO_SHORT, http_status: 422, when: "the scheduled parking-restriction window starts less than NOTICE_LEAD_HOURS (72) after the logical clock" }
  - { error_id: ERR_NOTICE_WINDOW_CONFLICT, http_status: 409, when: "the buffered closed notice window overlaps another scheduled or delivered notice window on the same segment" }
  # ---- utility coordination ----
  - { error_id: ERR_COORDINATION_NOT_PENDING, http_status: 409, when: "CLEAR or CONFLICT is attempted on a row whose coordination_status != CLEARANCE_REQUESTED" }
  - { error_id: ERR_COORDINATION_NOT_IN_CONFLICT, http_status: 409, when: "SCHEDULE_WORK is attempted on a row whose coordination_status != CONFLICT_DECLARED" }
  - { error_id: ERR_COORDINATION_WORK_NOT_SCHEDULED, http_status: 409, when: "complete-work is attempted on a row whose coordination_status != WORK_SCHEDULED" }
  - { error_id: ERR_COORDINATION_NOT_WORK_COMPLETE, http_status: 409, when: "RE_REQUEST is attempted on a row whose coordination_status != WORK_COMPLETE" }
  - { error_id: ERR_UTILITY_WORK_AFTER_PAVING, http_status: 422, when: "scheduled utility work would end after the project's planned_start_date" }
  # ---- cut permit / moratorium ----
  - { error_id: ERR_CUT_BLOCKED_ACTIVE_CONSTRUCTION, http_status: 409, when: "a cut permit is created for, or approved on, a segment with a line in IN_PROGRESS or REMEDIATION_REQUIRED" }
  - { error_id: ERR_UTILITY_NOT_ON_COORDINATION_ROSTER, http_status: 422, when: "the applicant_utility appears on no UtilityCoordination row in the system" }
  - { error_id: ERR_CUT_PERMIT_ALREADY_DECIDED, http_status: 409, when: "decide is attempted on an APPROVED or DENIED permit" }
  - { error_id: ERR_MORATORIUM_WAIVER_REQUIRED, http_status: 422, when: "a MORATORIUM_REVIEW permit is approved without a non-empty waiver_reason" }
  - { error_id: ERR_CUT_NOT_APPROVED_OR_ALREADY_COMPLETE, http_status: 409, when: "complete-cut is attempted on a permit that is not APPROVED or already has cut_completed_at" }
  # ---- acceptance testing ----
  - { error_id: ERR_LINE_NOT_TESTABLE, http_status: 409, when: "a test is submitted for a line whose work_state is not IN_PROGRESS or REMEDIATION_REQUIRED" }
  - { error_id: ERR_TEST_ALREADY_PENDING, http_status: 409, when: "a second test is submitted on a line that already has a SUBMITTED test" }
  - { error_id: ERR_TEST_ALREADY_DECIDED, http_status: 409, when: "decide is attempted on a test whose test_status != SUBMITTED" }
  - { error_id: ERR_TEST_DECISION_CONFLICTS_COMPUTED, http_status: 422, when: "PASS is decided on a test whose computed_outcome == FAIL" }
  # ---- service requests ----
  - { error_id: ERR_SERVICE_REQUEST_NOT_NEW, http_status: 409, when: "triage is attempted on a request whose request_status != NEW" }
  - { error_id: ERR_SERVICE_REQUEST_NOT_TRIAGED, http_status: 409, when: "close with closure_code PATCHED is attempted from a state other than TRIAGED_PATCH" }
  - { error_id: ERR_SERVICE_REQUEST_ALREADY_CLOSED, http_status: 409, when: "close is attempted on an already-closed request" }
  - { error_id: ERR_TARGET_PROJECT_NOT_ELIGIBLE, http_status: 422, when: "DEFER_TO_CAPITAL names a project that is ACCEPTED or has no non-REMOVED line on the request's segment" }

# =============================================================================
# §1.7 RBAC Table  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: PavementEngineer
    identity: opaque
    description: "Owns the technical program: inventory, surveys, QC, treatment selection and overrides, project scoping and bundling, resident notices, cut-permit decisions and complaint triage."
    exclusive_operations:
      - "POST /pavement/segments"
      - "POST /pavement/condition-surveys, POST /pavement/condition-surveys/{id}/seal, POST /pavement/condition-surveys/{id}/generate-candidates"
      - "POST /pavement/distress-observations, POST /pavement/distress-observations/{id}/qc"
      - "POST /pavement/treatment-candidates/{id}/override"
      - "POST /pavement/contractors"
      - "POST /pavement/projects, POST /pavement/projects/{id}/advance"
      - "POST /pavement/project-segments, DELETE /pavement/project-segments/{id}, POST /pavement/project-segments/{id}/notice"
      - "POST /pavement/cut-permits/{id}/decide"
      - "POST /pavement/service-requests/{id}/triage, POST /pavement/service-requests/{id}/close"
    shared_operations:
      - "POST /pavement/budget-scenarios and POST /pavement/budget-scenarios/{id}/run (shared with BudgetOfficer)"
      - "POST /pavement/service-requests (shared with Resident)"
      - "all GET endpoints"
      - "POST /pavement/_clock/set_current_utc"
    forbidden_operations:
      - "POST /pavement/budget-scenarios/{id}/adopt, POST /pavement/scenario-allocations, POST /pavement/projects/{id}/award, POST /pavement/projects/{id}/cancel-award (BudgetOfficer only)"
      - "POST /pavement/acceptance-tests, POST /pavement/acceptance-tests/{id}/decide, POST /pavement/projects/{id}/accept (Inspector only)"
      - "POST /pavement/utility-coordinations/{id}/respond, POST /pavement/utility-coordinations/{id}/complete-work, POST /pavement/cut-permits, POST /pavement/cut-permits/{id}/complete-cut (UtilityCoordinator only)"
      - "POST /pavement/projects/{id}/substantial-completion (Contractor only)"

  - name: BudgetOfficer
    identity: opaque
    description: "Owns the money: scenario adoption, manual allocations, award and award cancellation. Segregated from acceptance and from the technical program."
    exclusive_operations:
      - "POST /pavement/budget-scenarios/{id}/adopt"
      - "POST /pavement/scenario-allocations"
      - "POST /pavement/projects/{id}/award"
      - "POST /pavement/projects/{id}/cancel-award"
    shared_operations:
      - "POST /pavement/budget-scenarios and POST /pavement/budget-scenarios/{id}/run (shared with PavementEngineer)"
      - "all GET endpoints except GET /pavement/service-requests filtered views are also open to Resident"
      - "POST /pavement/_clock/set_current_utc"
    forbidden_operations:
      - "every PavementEngineer exclusive operation"
      - "every Inspector, UtilityCoordinator and Contractor exclusive operation"
      - "awarding a project from a scenario this same X-User-ID adopted (ERR_SEGREGATION_OF_DUTIES)"

  - name: UtilityCoordinator
    identity: opaque
    description: "Acts for the water, sewer and franchise utilities: answers clearance requests, schedules and reports pre-paving work, and applies for pavement cuts."
    exclusive_operations:
      - "POST /pavement/utility-coordinations/{id}/respond"
      - "POST /pavement/utility-coordinations/{id}/complete-work"
      - "POST /pavement/cut-permits"
      - "POST /pavement/cut-permits/{id}/complete-cut"
    shared_operations:
      - "GET /pavement/segments, GET /pavement/segments/{id}, GET /pavement/projects, GET /pavement/projects/{id}, GET /pavement/project-segments, GET /pavement/project-segments/{id}, GET /pavement/utility-coordinations, GET /pavement/utility-coordinations/{id}, GET /pavement/cut-permits, GET /pavement/cut-permits/{id}"
      - "POST /pavement/_clock/set_current_utc"
    forbidden_operations:
      - "POST /pavement/cut-permits/{id}/decide — the city decides its own cuts, never the applicant"
      - "every PavementEngineer, BudgetOfficer, Inspector and Contractor exclusive operation"

  - name: Inspector
    identity: opaque
    description: "Owns pavement quality acceptance: submits test measurements, decides tests (never one they witnessed) and signs final project acceptance."
    exclusive_operations:
      - "POST /pavement/acceptance-tests"
      - "POST /pavement/acceptance-tests/{id}/decide"
      - "POST /pavement/projects/{id}/accept"
    shared_operations:
      - "read access across surveys, candidates, scenarios, projects, lines, tests, permits and service requests"
      - "POST /pavement/_clock/set_current_utc"
    forbidden_operations:
      - "deciding an acceptance test whose witness_inspector_user_id equals the caller (ERR_SEGREGATION_OF_DUTIES)"
      - "every PavementEngineer, BudgetOfficer, UtilityCoordinator and Contractor exclusive operation"

  - name: Contractor
    identity: "entity_backed:Contractor"
    description: "The awarded paving contractor. X-User-ID IS the Contractor.id, so every access is scoped to its own projects."
    exclusive_operations:
      - "POST /pavement/projects/{id}/substantial-completion (only on a project whose contractor_id == X-User-ID)"
    shared_operations:
      - "GET /pavement/projects and GET /pavement/projects/{id} for its own projects, GET /pavement/project-segments, GET /pavement/acceptance-tests, GET /pavement/contractors/{id}, GET /pavement/contractors/{id}/scorecard, GET /pavement/segments"
      - "POST /pavement/_clock/set_current_utc"
    forbidden_operations:
      - "acting on another contractor's project (ERR_NOT_PROJECT_CONTRACTOR)"
      - "every PavementEngineer, BudgetOfficer, UtilityCoordinator and Inspector exclusive operation"

  - name: Resident
    identity: opaque
    description: "A member of the public. May report pavement complaints and read the public-facing network, notice and complaint views only."
    exclusive_operations: []
    shared_operations:
      - "POST /pavement/service-requests (shared with PavementEngineer)"
      - "GET /pavement/segments, GET /pavement/segments/{id}, GET /pavement/project-segments, GET /pavement/project-segments/{id}, GET /pavement/service-requests, GET /pavement/service-requests/{id}"
      - "POST /pavement/_clock/set_current_utc"
    forbidden_operations:
      - "every mutating endpoint other than POST /pavement/service-requests"
      - "reading surveys, observations, candidates, scenarios, allocations, contractors, projects, coordinations, cut permits and acceptance tests"
