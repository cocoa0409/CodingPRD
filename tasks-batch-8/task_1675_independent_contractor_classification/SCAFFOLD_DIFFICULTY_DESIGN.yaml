          - entities.ContractAgreement.fields.start_date
        distinguishing_aspect: |
          Resource = ContractAgreement per (contractor_id, jurisdiction_id);
          interval semantics = half-open [start_date, end_date): a new contract
          overlapping an existing non-terminal one is rejected, but pure
          adjacency (new.start == existing.end) is ALLOWED — no buffer period.
        test_recipe:
          setup:
