              as: CommitteeMember
              as_user_id: "${mem_fin_id}"
            - call: "POST /governance/motions/${motion_ips_e_id}/votes"
              payload: { member_id: "${mem_hr_id}", vote: "FOR" }
              as: CommitteeMember
              as_user_id: "${mem_hr_id}"
            - call: "POST /governance/motions/${motion_ips_e_id}/close"
              payload: {}
