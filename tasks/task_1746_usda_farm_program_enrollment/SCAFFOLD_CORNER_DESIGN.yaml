  # ===========================================================================
  # Section: validations — priority ordering beyond §1.8, satisfaction-passes
  # ===========================================================================
  - section: validations
    instances:
      - name: field_acres_exceed_tract_cropland_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_CROPLAND_EXCEEDED]"]
        distinguishing_aspect: "Sum of Field.acres on a tract exceeding tract.cropland_acres is rejected."
        test_recipe:
          setup: ["Tract with cropland 50.00; one field already 50.00"]
          setup_api_calls:
            - { call: "POST /fsa/farms", payload: { farm_number: "F15", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T1", base_acres: 50.00, cropland_acres: 50.00 }, as: CountySpecialist, captures: { tract_id: "$.data.id" } }
            - { call: "POST /fsa/tracts/${tract_id}/fields", payload: { field_number: "1", acres: 50.00 }, as: CountySpecialist }
          trigger:
            - { call: "POST /fsa/tracts/${tract_id}/fields", payload: { field_number: "2", acres: 1.00 }, as: CountySpecialist, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_CROPLAND_EXCEEDED"

      - name: membership_share_sum_must_equal_100
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_SHARE_SUM_INVALID]"]
        distinguishing_aspect: "Membership shares on a farm not summing to 100.00 are rejected (aggregate validation)."
        test_recipe:
          setup: ["Farm with a single 60.00% membership"]
          setup_api_calls:
