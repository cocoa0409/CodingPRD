    description: "Award new-item slots. Forks every SUBMITTED presentation: those with >= 1 awarded item → ACCEPTED, those with none → DECLINED plus their open slotting deals → REJECTED. Creates one Authorization per awarded item in Item.upc ASC order. An empty authorized_item_ids array is legal and declines the whole deck."
