            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - *k_echeck
            - *k_echeck_ok
            - *k_clock_sep10
            - *k_quote_ech50k
            - *k_txn_ech
            - *k_cap_ech
            - *k_batch_0912
            - *k_close_batch1
            - *k_clock_sep15
            - call: "POST /portal/payment-transactions/${txn_ech}/ach-return"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /portal/payment-transactions/${txn_ech}/re-present"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
            - call: "POST /portal/payment-transactions/${txn_ech}/ach-return"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portal/payment-transactions/${txn_ech}/re-present"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "first re-present (count 0) succeeds: funds_status == RE_PRESENTED, representment_count == 1"
            - "second ach-return (RE_PRESENTED -> RETURNED) succeeds and representment_count stays 1"
            - "second re-present returns 409 and err_id == ERR_REPRESENTMENT_EXHAUSTED — the == 1 boundary is enforced exactly"
            - "err_id != ERR_INVALID_STATE: RETURNED is a valid from-state; only the count blocks"

      - name: tier_coverage_inclusive_max_exact_lands_no_gap
        grounds:
          - calculations.agency_absorbed_monthly_invoice
          - errors.ERR_TIER_COVERAGE_GAP
        distinguishing_aspect: |
          Metric: cumulative monthly volume in cents; endpoint:
          close-period. An absorbed month whose cumulative volume lands exactly
          on the top band's inclusive max (2000000) is fully covered and bills
          41035; one more cent would hit ERR_TIER_COVERAGE_GAP because no band
          above exists in this setup.
        test_recipe:
          setup:
            - "Absorbed agency with ONLY bands [0,500000]@250bp+20 and [500001,2000000]@190bp+15 for 2026-09; two captured ECHECK transactions of 1000000 each."
          setup_api_calls:
            - *k_clock
            - *b_agency
            - *b_account
            - *b_verify
            - *b_attest
            - *b_agency_on
            - *b_tier1
            - *b_tier2
            - *b_service
            - *b_service_on
            - *k_payer
            - *k_echeck
            - *k_echeck_ok
