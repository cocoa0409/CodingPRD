              as: ContractsOfficer
              as_user_id: "co-1"
              captures: { succ_id: $.data.id }
            - call: "POST /api/pricing-contracts/${k_id}/amend"
              payload: { expected_contract_version: "${k_v}", default_discount_pct: 32 }
              as: ContractsOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "captured succ_id non-null (first amend succeeds at the observed version)"
            - "captured err == 'ERR_STALE_VERSION' (same expected version now stale after the first amend bumped it)"

