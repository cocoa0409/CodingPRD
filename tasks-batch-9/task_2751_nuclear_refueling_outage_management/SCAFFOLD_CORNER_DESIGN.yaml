            - "Outage UNIT_1 / 1R24 with dose_budget_total_mrem 5000 and two APPROVED work orders; the flag is computed at permit creation, so no approval is needed."
            - "Permit X: 4 workers, 3.00 h, shielding 0 -> per-worker 75.00, collective 300.00, contingency 60.00, committed 360.00."
            - "Permit Y: 4 workers, 2.99 h, shielding 0 -> per-worker 74.75, collective 299.00, contingency 59.80, committed 358.80."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
