              payload: { customers_affected: 100, cause_code: "TREE" }
              as: Dispatcher
              captures: { ot_v: $.data.version }
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T01:00:00Z" }, as: EmergencyDirector }
          trigger:
            - { call: "POST /om/outages/${ot}/etr-revisions", payload: { published_etr: "2026-08-10T09:00:00Z", revision_reason: "WEATHER_DELAY", expected_outage_version: "${ot_v}" }, as: Dispatcher, captures: { seq1: $.data.revision_seq } }
            - { call: "POST /om/outages/${ot}/etr-revisions", payload: { published_etr: "2026-08-10T10:00:00Z", revision_reason: "CREW_DELAYED", expected_outage_version: "${ot_v}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "First revision with the observed version succeeds: ${seq1} == 2 (outage version now 3)"
            - "Second revision with the now-stale version: ${err} == ERR_STALE_OUTAGE_VERSION (http 412); no seq 3 created; current_etr remains \"2026-08-10T09:00:00Z\""

