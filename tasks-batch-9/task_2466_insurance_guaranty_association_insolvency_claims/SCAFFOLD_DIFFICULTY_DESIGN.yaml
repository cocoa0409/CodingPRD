          assert:
            - "VendorAssignment.${asg_def}.status == ASSIGNED"
            - "${err} == ERR_ADJUSTER_ENGAGEMENT_OVERLAP with HTTP 409"
            - "VendorAssignment.${asg_2}.status == ASSIGNED"
            - "VendorAssignment.${asg_1}.status == SUPERSEDED"
            - "CoveredClaim.${clm_id}.status == ADJUSTING"
            - "GET /claims/${clm_id}/vendor-assignments returns exactly 3 rows"

  - rule_id: compensating_invariant
    instances:
      - name: estate_ledger_identity_holds_across_remittance_distribution_and_closure
        grounds:
          - calculations.insolvency_ledger_recompute
          - state_machines.Insolvency.TRIGGERED_to_CLOSED
          - entities.Insolvency.fields.estate_returned_cents
          - calculations.distribution_waterfall
        distinguishing_aspect: |
          LEDGER_IDENTITY must hold after every estate movement: 1000000 remitted stays equal to
          distributed plus undistributed plus returned as the balance moves 1000000/0/0 then
          890000/110000/0 then 890000/0/110000, with no cent created or lost at closure.
        test_recipe:
          setup:
            - "Insolvency in TRIGGERED with a PERSONAL_AUTO profile and policy PA-1001 in CANCELLED_BY_ORDER."
            - "CoveredClaim C-1 in APPROVED with net_payable_cents 890000 (gross_loss_cents 900000 less the 10000 statutory deductible)."
            - "No vendor invoices posted and no unearned premium refund filed, so class 1 and class 3 are empty."
            - "estate_remitted_cents 1000000 with estate_distributed_cents 0, estate_undistributed_cents 1000000 and estate_returned_cents 0."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2, statutory_deductible_cents: 10000 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
              captures: { pol_id: $.data.id }
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "POST /claims"
              payload: { insolvency_id: "${ins_id}", policy_id: "${pol_id}", claim_number: "C-1", claimant_name: "Ben Ortiz", claimant_state_code: "MI", loss_date: "2026-01-15", gross_loss_cents: 900000 }
              as: CoverageAnalyst
              captures: { clm_id: $.data.id }
            - call: "POST /claims/${clm_id}/screen"
              payload: { decision: "COVERED" }
              as: CoverageAnalyst
              as_user_id: "analyst-1"
            - call: "POST /claims/${clm_id}/vendor-assignments"
              payload: { vendor_type: "ADJUSTER", vendor_name: "Kestrel Claims Services", settlement_authority_cents: 900000, hourly_rate_cents: 18000, engagement_start: "2026-08-01", engagement_end: "2026-08-31" }
              as: AssociationAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /claims/${clm_id}/recommend"
              payload: { recommended_amount_cents: 890000 }
              as: ClaimsAdjuster
              as_user_id: "${asg_id}"
            - call: "POST /claims/${clm_id}/approve"
              payload: {}
              as: ClaimsCommitteeOfficer
              as_user_id: "officer-1"
            - call: "POST /insolvencies/${ins_id}/estate-remittances"
              payload: { amount_cents: 1000000, remittance_ref: "EA-2026-01" }
              as: ReceiverLiaison
            - call: "GET /insolvencies/${ins_id}"
              payload: {}
              as: AssociationAdmin
              captures: { ins_v: $.data.version }
          trigger:
            - call: "POST /insolvencies/${ins_id}/distributions"
              payload: { distribution_amount_cents: 890000, expected_insolvency_version: "${ins_v}" }
              as: AssociationAdmin
              captures: { dist_undist: $.data.estate_undistributed_cents }
            - call: "POST /insolvencies/${ins_id}/close"
              payload: {}
              as: AssociationAdmin
          assert:
            - "${dist_undist} == 110000"
            - "CoveredClaim.${clm_id}.status == PAID"
            - "CoveredClaim.${clm_id}.paid_amount_cents == 890000"
            - "Insolvency.${ins_id}.status == CLOSED"
            - "Insolvency.${ins_id}.estate_remitted_cents == 1000000"
            - "Insolvency.${ins_id}.estate_distributed_cents == 890000"
            - "Insolvency.${ins_id}.estate_undistributed_cents == 0"
            - "Insolvency.${ins_id}.estate_returned_cents == 110000"
            - "Insolvency.${ins_id}.reserved_claim_cents == 0"

      - name: declined_referral_fully_reverses_the_pending_referral_counter
        grounds:
          - state_machines.CoveredClaim.ADJUSTING_to_REFERRAL_PENDING
          - state_machines.CoveredClaim.REFERRAL_PENDING_to_ADJUSTING
          - entities.Insolvency.fields.referral_pending_count
          - entities.CoveredClaim.fields.pre_referral_status
        distinguishing_aspect: |
          Parking a claim with a sister association increments referral_pending_count to 1 and stashes
          pre_referral_status ADJUSTING; a DECLINED disposition must undo both, returning the counter to
          0, restoring status ADJUSTING and clearing pre_referral_status with no residual drift in
          remand_count or reserved_claim_cents.
        test_recipe:
          setup:
            - "Insolvency in TRIGGERED with referral_pending_count 0."
            - "PERSONAL_AUTO policy PA-1001 in CANCELLED_BY_ORDER held by a Michigan policyholder."
            - "CoveredClaim C-1 in ADJUSTING for an Ohio-resident claimant, with one ASSIGNED ADJUSTER engagement."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2, statutory_deductible_cents: 10000 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
              captures: { pol_id: $.data.id }
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "POST /claims"
              payload: { insolvency_id: "${ins_id}", policy_id: "${pol_id}", claim_number: "C-1", claimant_name: "Ben Ortiz", claimant_state_code: "OH", loss_date: "2026-01-15", gross_loss_cents: 900000 }
              as: CoverageAnalyst
              captures: { clm_id: $.data.id }
            - call: "POST /claims/${clm_id}/screen"
              payload: { decision: "COVERED" }
              as: CoverageAnalyst
              as_user_id: "analyst-1"
            - call: "POST /claims/${clm_id}/vendor-assignments"
              payload: { vendor_type: "ADJUSTER", vendor_name: "Kestrel Claims Services", settlement_authority_cents: 900000, hourly_rate_cents: 18000, engagement_start: "2026-08-01", engagement_end: "2026-08-31" }
              as: AssociationAdmin
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /claims/${clm_id}/referrals"
              payload: { target_state_code: "OH", basis: "CLAIMANT_RESIDENCE" }
              as: AssociationAdmin
              captures: { ref_id: $.data.id }
            - call: "POST /claims/${clm_id}/referrals/${ref_id}/respond"
              payload: { disposition: "DECLINED", response_note: "Ohio association denies jurisdiction" }
              as: AssociationAdmin
          assert:
            - "SisterAssociationReferral.${ref_id}.status == DECLINED"
            - "SisterAssociationReferral.${ref_id}.basis_state_code == OH"
            - "SisterAssociationReferral.${ref_id}.responded_at_utc == 2026-08-01T00:00:00Z"
            - "CoveredClaim.${clm_id}.status == ADJUSTING"
            - "CoveredClaim.${clm_id}.pre_referral_status == null"
            - "CoveredClaim.${clm_id}.net_payable_cents == 890000"
            - "CoveredClaim.${clm_id}.remand_count == 0"
            - "VendorAssignment.${asg_id}.status == ASSIGNED"
            - "Insolvency.${ins_id}.referral_pending_count == 0"

      - name: claim_reserve_and_payments_always_sum_to_the_net_payable
        grounds:
          - state_machines.CoveredClaim.APPROVED_to_PARTIALLY_PAID
          - state_machines.CoveredClaim.PARTIALLY_PAID_to_PAID
          - entities.Insolvency.fields.reserved_claim_cents
          - calculations.insolvency_ledger_recompute
        distinguishing_aspect: |
          Across two distribution runs the compensating pair reserved_claim_cents plus
          paid_amount_cents must stay pinned to net_payable_cents 3000000: it reads 3000000/0 after
          approval, 2000000/1000000 after the partial run and 0/3000000 after the closing run, and the
          engagement only closes on the run that reaches PAID.
        test_recipe:
          setup:
            - "Insolvency in TRIGGERED with a PERSONAL_AUTO profile and policy PA-1001 in CANCELLED_BY_ORDER."
            - "CoveredClaim C-1 in APPROVED with net_payable_cents 3000000 and paid_amount_cents 0, so reserved_claim_cents is 3000000."
            - "One ASSIGNED ADJUSTER engagement with no invoices, so class 1 is empty."
            - "estate_remitted_cents 3000000, all of it undistributed."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2, statutory_deductible_cents: 10000 }
