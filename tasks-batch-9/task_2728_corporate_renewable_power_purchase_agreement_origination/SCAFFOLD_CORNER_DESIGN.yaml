            - "before the trigger TermSheetRound.${round1_id}.status == COUNTERED with round_number 1, TermSheetRound.${round2_id}.status == OPEN with round_number 2, proposed_by OFFTAKER and response_deadline == ${round2_deadline} == 2026-08-15T00:00:00Z, and Deal.${deal_id}.status == UNDER_NEGOTIATION with round_count 2"
            - "the trigger returns 201 with TermSheetRound.${round3_id}.round_number == 3, status OPEN and proposed_by DEVELOPER"
            - "TermSheetRound.${round2_id}.status is now EXPIRED, because its response_deadline 2026-08-15T00:00:00Z is behind the clock 2026-08-20T00:00:00Z"
            - "TermSheetRound.${round1_id}.status is still COUNTERED - a terminal round is not re-expired by the sweep"
            - "Deal.${deal_id}.status is back to TERM_SHEET_ISSUED and round_count == 3"
            - "GET /ppa/deals/${deal_id}/rounds with status OPEN returns total_count 1 whose data[0].id == ${round3_id}"

      - name: rating_change_downgrade_watchlists_buyer_and_shortfalls_the_deal
        claim_type: cross_entity
        grounds:
          - state_machines.Offtaker.QUALIFIED_to_WATCHLIST
          - state_machines.Deal.credit_status.APPROVED_to_SUPPORT_SHORTFALL
          - calculations.unsecured_credit_limit
          - calculations.credit_support_requirement
          - endpoints.POST_/ppa/offtakers/{id}/rating-change
        distinguishing_aspect: |
          One write to the OFFTAKER rewrites money on the DEAL. A downgrade from A to
          BB with leverage moving 2.5 -> 5.0 drops the buyer PRIME -> SUBPRIME, which
          collapses the unsecured line from 3000000.00 to 300000.00, which turns a deal
          that needed no collateral at all into one that needs 1250000.00, which flips
          credit_status APPROVED -> SUPPORT_SHORTFALL and arms a cure deadline. The
          deal's own status dimension must not move, and the buyer's sustainability
          score must not move either - only the credit chain does.
        test_recipe:
          setup:
            - "CHAIN B: buyer NW QUALIFIED at 83.70 PRIME with a 3000000.00 unsecured line; deal D (25.000 MW, base 22.00, no escalation, AS_GENERATED, SHARED) at TERMS_AGREED with contract price 22.75, exposure 1394550.00, credit_support_required_usd 0.00 and credit_status APPROVED with nothing posted."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "SP15 EZ GEN HUB", iso: "CAISO", settlement_point_type: "HUB" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { hub_id: $.data.id }
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
            - call: "POST /ppa/offtakers/${buyer_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2029-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "${hub_id}", product_type: "VIRTUAL_CFD", contracted_mw: 25.000, term_years: 12, first_delivery_year: 2026, commercial_operation_deadline: "2029-12-31T00:00:00Z", settlement_frequency: "HOURLY", base_fixed_price_usd_per_mwh: 22.00, escalation_pct_per_year: 0.0, shape_product: "AS_GENERATED", basis_responsibility: "SHARED" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { deal_id: $.data.id }
            - call: "POST /ppa/deals/${deal_id}/rounds"
              payload: { proposed_by: "DEVELOPER", proposed_fixed_price_usd_per_mwh: 22.00, proposed_escalation_pct_per_year: 0.0, proposed_shape_product: "AS_GENERATED", proposed_basis_responsibility: "SHARED", response_deadline: "2026-08-15T00:00:00Z" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { round_id: $.data.id }
            - call: "GET /ppa/deals/${deal_id}"
              as: Originator
              as_user_id: "u_orig_1"
              captures: { deal_v1: $.data.version }
            - call: "POST /ppa/deals/${deal_id}/allocations"
              payload: { offtaker_id: "${buyer_id}", allocated_mw: 25.000, expected_deal_version: "${deal_v1}" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { alloc_id: $.data.id }
            - call: "POST /ppa/allocations/${alloc_id}/decision"
              payload: { decision: "CONFIRM" }
              as: OfftakerRep
              as_user_id: "${buyer_id}"
            - call: "POST /ppa/rounds/${round_id}/respond"
              payload: { response: "ACCEPT" }
              as: OfftakerRep
              as_user_id: "${buyer_id}"
