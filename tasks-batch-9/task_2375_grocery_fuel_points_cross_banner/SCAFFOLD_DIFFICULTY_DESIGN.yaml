            - call: "POST /members"
              payload: { banner_id: "${bs_id}", alt_id: "5550000004", card_number: "4000000000000004", full_name: "Di Partner" }
              as: ProgramAdmin
              captures: { m4_id: $.data.id }
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m4_id}", site_id: "${g4_id}", transacted_at: "2026-08-05T10:00:00Z", lines: [{ category: "GROCERY", amount_cents: 60000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${g4_id}"
              captures: { t4_id: $.data.id }
            - call: "POST /purchase-transactions/${t4_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${g4_id}"
            - call: "GET /members/${m4_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${p1_id}"
              captures: { mv4a: $.data.version }
            - call: "POST /fuel-redemptions"
