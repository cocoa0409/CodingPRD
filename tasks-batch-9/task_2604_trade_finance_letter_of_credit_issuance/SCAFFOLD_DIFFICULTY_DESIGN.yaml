            - "DocumentaryCredit.${ca_id}.commission_bps_applied == 15"
            - "DocumentaryCredit.${ca_id}.base_commission_cents == 25000"
            - "DocumentaryCredit.${ca_id}.chargeable_utilisation_cents == 5025000"
            - "CreditFacility.${fa_id}.allocated_cents == 5025000"
            - "CreditFacility.${fa_id}.available_cents == 0"
            - "CreditFacility.${fa_id}.restrict_threshold_cents == 4773750"
            - "CreditFacility.${fa_id}.utilisation_posture == RESTRICTED"
            - "CreditFacility.${fa_id}.status == SUSPENDED"
            - "CreditFacility.${fa_id}.suspended_reason == RESTRICT_THRESHOLD_BREACH"
            - "trigger call 2 returns HTTP 422 with error_id == ERR_FACILITY_LIMIT_EXCEEDED"
            - "DocumentaryCredit.${cb_id}.status == APPROVED"
            - "DocumentaryCredit.${cb_id}.committed_allocation_cents == 0"
            - "CreditFacility.${fb_id}.allocated_cents == 0"
            - "CreditFacility.${fb_id}.available_cents == 5024999"
