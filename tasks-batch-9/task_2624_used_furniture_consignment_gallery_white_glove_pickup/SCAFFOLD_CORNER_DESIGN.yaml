            - "data.listed_at == \"2026-08-01T00:00:00Z\" and data.days_on_floor == 0"
            - "data.markdown_sequence == 1 and data.current_price_cents == 51000 and data.list_price_cents == 51000"
            - "data.clearance_relocation_pending == false because 51000 is not below the 50000 clearance threshold"
            - "GET /floor-zones/${zone_front_id} reports occupied_sqft == 20 and utilization_state == \"NORMAL\""

