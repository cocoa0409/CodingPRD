              as: ComplianceOfficer
              captures: { bs_ca: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "TX", tax_id: "606-06-0606", primary_owner_name: "Tex Holder", dividend_option: "CASH" }
              as: TransferAgentOperator
              captures: { acc_t: $.data.id }
            - call: "POST /shareholder-accounts/${acc_t}/activate"
