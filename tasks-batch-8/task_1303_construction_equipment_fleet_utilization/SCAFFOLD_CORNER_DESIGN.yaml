            - "cheaper_variant == TIE (strict < on both comparisons fails)"

      - name: residual_value_floors_at_salvage_when_over_depreciated
        claim_type: correct_result
        grounds: [calculations.residual_value]
        distinguishing_aspect: "The min(age, life) saturation plus salvage floor: age 19 months against useful_life 12 saturates the depreciation term, landing residual exactly on salvage_value_cents == 900000 (floor equality, not below)."
        test_recipe:
          setup: ["Clock 2026-08-01; Class C307 salvage 900000 expected_life_hours 12000; Equipment E307 OWNED acquisition_cost 1000000, acquisition_date 2025-01-01, useful_life_months 12, zero hours"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-307", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 900000 }
              as: FleetAdmin
              captures: { c307_id: $.data.id }
