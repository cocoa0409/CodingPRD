        claim_type: Error Triggerability
        grounds:
          - errors.ERR_FLEX_POOL_EXHAUSTED
          - errors.ERR_LABOR_BUDGET_EXCEEDED
          - calculations.planned_labor_cost
        distinguishing_aspect: "Both money-side approve gates are reachable in isolation: a plan needing 6 bodies with a 1-body flex pool fails at priority 37 with a generous budget, while a fully staffed plan whose 103200 cents of planned labor exceeds a 100000 cent budget fails at priority 38 with a full pool."
