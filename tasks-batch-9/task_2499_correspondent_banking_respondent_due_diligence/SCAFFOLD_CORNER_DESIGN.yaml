            - "InformationRequest.${rfi_id}.sent_at is null"
            - "InformationRequest.${rfi_id}.due_at is null"
            - "InformationRequest.${rfi_id}.escalation_level == 0"
            - "InformationRequest.${rfi_id}.insufficiency_rounds == 0"

      - name: initial_state_monitoring_profile_created_in_provisional
        claim_type: initial_state
        grounds:
          - state_machines.TransactionMonitoringProfile.initial_state
          - endpoints[POST /correspondent-banking/respondents/{respondentId}/monitoring-profiles]
          - entities.TransactionMonitoringProfile.fields.calibration_state
        distinguishing_aspect: "A new monitoring profile starts PROVISIONAL with recalibration_reason null even though its thresholds are already computed, so VOLUME_BREACH and COUNT_BREACH alerts stay suppressed until CALIBRATE."
        test_recipe:
          setup: ["One respondent in DD_IN_PROGRESS under DE; the DE profile is the only corridor."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
