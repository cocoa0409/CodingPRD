            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl1}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-1", captures: { app1: $.data.id } }
            - { call: "POST /admissions/applications/${app1}/submit", payload: {}, as: Parent, as_user_id: "fam-1" }
            - { call: "POST /admissions/aid-applications", payload: { application_id: "${app1}", reported_annual_income_cents: 5500000, household_size: 4 }, as: Parent, as_user_id: "fam-1", captures: { aid1: $.data.id } }
            - { call: "POST /admissions/aid-applications/${aid1}/verify", payload: { verified_annual_income_cents: 5500000 }, as: FinancialAidOfficer, as_user_id: "fao-1" }
            - { call: "POST /admissions/aid-applications/${aid1}/finalize-award", payload: {}, as: FinancialAidOfficer, as_user_id: "fao-2" }
            - { call: "POST /admissions/aid-applications/${aid1}/accept-award", payload: {}, as: Parent, as_user_id: "fam-1" }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-2", first_name: "A2", last_name: "Two", date_of_birth: "2013-01-02" }, as: Parent, as_user_id: "fam-2", captures: { apl2: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl2}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-2", captures: { app2: $.data.id } }
            - { call: "POST /admissions/applications/${app2}/submit", payload: {}, as: Parent, as_user_id: "fam-2" }
            - { call: "POST /admissions/aid-applications", payload: { application_id: "${app2}", reported_annual_income_cents: 5500000, household_size: 4 }, as: Parent, as_user_id: "fam-2", captures: { aid2: $.data.id } }
            - { call: "POST /admissions/aid-applications/${aid2}/verify", payload: { verified_annual_income_cents: 5500000 }, as: FinancialAidOfficer, as_user_id: "fao-1" }
            - { call: "POST /admissions/aid-applications/${aid2}/finalize-award", payload: {}, as: FinancialAidOfficer, as_user_id: "fao-2" }
            - { call: "POST /admissions/aid-applications/${aid2}/accept-award", payload: {}, as: Parent, as_user_id: "fam-2" }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-3", first_name: "A3", last_name: "Three", date_of_birth: "2013-01-03" }, as: Parent, as_user_id: "fam-3", captures: { apl3: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl3}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-3", captures: { app3: $.data.id } }
