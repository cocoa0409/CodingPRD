              payload: { assigned_steward_id: "${std_id}", due_at: "2026-08-20T00:00:00Z", plan_note: "Backfill missing tax ids from the ERP extract" }
              as: DataOwner
              as_user_id: "${own_id}"
              captures: { p_status: $.data.status, p_assigned: $.data.assigned_steward_id, p_planned_by: $.data.planned_by_steward_id, p_weight: $.data.severity_weight }
            - call: "GET /mdm/stewards/${std_id}"
              as: GovernanceAdmin
              captures: { std_load: $.data.open_finding_load }
            - call: "GET /mdm/stewards/${own_id}"
              as: GovernanceAdmin
              captures: { own_load: $.data.open_finding_load }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_weight: $.data.open_finding_weight }
          assert:
            - "setup: ${run_mult} == 1.00 (posture_before OPEN), ${run_score} == 50.00 (round(40 * 45.00 / 90.00, 2) == 20.00 of 40), ${run_findings} == 1"
            - "setup: ${f_weight} == 8.00 (HIGH base 8 x multiplier 1.00) and ${f_gap} == 45.00"
            - "HTTP 200, ${p_status} == REMEDIATION_PLANNED, ${p_assigned} == ${std_id}, ${p_planned_by} == ${own_id}"
            - "${std_load} == 1 - the ASSIGNED steward carries the load"
            - "${own_load} == 0 - the acting reviewer does not"
            - "${dom_weight} == 8.00 and ${p_weight} == 8.00 - the pinned severity_weight and the open-set sum are both untouched by planning"

      - name: publication_and_curation_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.MasterRecord.UNPUBLISHED_to_PUBLISHED
          - entities.MasterRecord.fields.curation_status
        distinguishing_aspect: "MasterRecord carries two orthogonal state dimensions on one row. Publishing must move publication_status only and leave curation_status at CURATED; the combined state (CURATED, PUBLISHED) is what increments domain.published_master_record_count."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; domain CUSTOMER ACTIVE with posture OPEN (DATA_OWNER + DATA_STEWARD assignments, ACTIVE AUTHORITATIVE registration on CERTIFIED source ERP, one ACTIVE rule QR1, activated); one CANDIDATE master record with all 5 expected attributes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Olivia Owner", email: "olivia@mdm.test", certification_level: "PRINCIPAL" }
              as: GovernanceAdmin
              captures: { own_id: $.data.id }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${own_id}", steward_role: "DATA_OWNER", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v2: $.data.version }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v2}" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "ERP", name: "ERP Core", trust_tier: 4 }
              as: GovernanceAdmin
              captures: { erp_id: $.data.id }
            - call: "POST /mdm/source-systems/${erp_id}/certify"
              payload: {}
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v3: $.data.version }
            - call: "POST /mdm/source-registrations"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", role: "AUTHORITATIVE", trust_rank: 1, effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v3}" }
              as: GovernanceAdmin
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 40, threshold_pct: 90.00, severity: "HIGH" }
              as: DataSteward
              as_user_id: "${std_id}"
            - call: "POST /mdm/domains/${dom_id}/activate"
              as: GovernanceAdmin
              captures: { act_status: $.data.status, act_posture: $.data.governance_posture }
            - call: "POST /mdm/master-records"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", natural_key: "ERP-CUST-4001", attributes: { legal_name: "Delta Corp", tax_id: "TX-40", billing_city: "Fargo", contact_email: "d@delta.test", duns: "40-400" }, last_verified_at: "2026-08-01T00:00:00Z" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { rec_id: $.data.id, rec_cur0: $.data.curation_status, rec_pub0: $.data.publication_status, rec_comp: $.data.completeness_pct }
          trigger:
            - call: "POST /mdm/master-records/${rec_id}/curate"
              payload: {}
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { cur_cur: $.data.curation_status, cur_pub: $.data.publication_status }
            - call: "POST /mdm/master-records/${rec_id}/publish"
              payload: {}
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { pub_cur: $.data.curation_status, pub_pub: $.data.publication_status, pub_at: $.data.published_at }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
