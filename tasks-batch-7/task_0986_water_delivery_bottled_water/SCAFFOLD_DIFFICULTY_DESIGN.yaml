        distinguishing_aspect: |
          Invoice has a cyclic shape: OPEN <-> DISPUTED via dispute/resolve-dispute,
          with a branch DISPUTED -> VOID. The same invoice can re-enter OPEN after
          dispute resolution. This is a cycle on the Invoice entity (distinct from
          CoolerRental's cycle below).
