              as_user_id: "u-rev-1"
            - call: "POST /carriage/audit-engagements/${eng_id}/findings"
              payload:
                subscriber_report_id: "${r_id}"
                audited_subscribers: 140000
              as: AuditManager
              as_user_id: "u-audit-1"
