    side_effects: ["block_status SCHEDULED -> HELD", "each participant's contract.season_practice_minutes increased by duration_minutes", "burnout_score refreshed per calculations.burnout_score ROLLING_7DAY with obligation escalation and its cascades", "for block_type TRYOUT every TRYOUT_INVITED participant -> TRYOUT_COMPLETED", "version incremented"]
  - method: POST
