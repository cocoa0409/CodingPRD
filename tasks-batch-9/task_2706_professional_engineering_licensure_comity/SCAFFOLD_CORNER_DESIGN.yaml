            - call: "POST /cpc-reports/${rep_milo}/accept"
              payload: {}
              as: BoardReviewer
              as_user_id: "REV-2"
            - call: "POST /cpc-audits"
              payload: { audit_cycle_label: "2026-BIENNIUM-C", sample_pct: 1.0, as_of_period_end: "2028-01-15T00:00:00Z" }
              as: BoardReviewer
