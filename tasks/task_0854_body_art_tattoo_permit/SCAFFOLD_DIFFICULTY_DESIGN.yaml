              as_user_id: "${est_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /body-art/artists/${a1_id}/bbp-training"
              payload: { completed_on: "2026-04-01T00:00:00Z" }
              as: Artist
              as_user_id: "${a1_id}"
            - call: "POST /body-art/artists/${a1_id}/activate"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
          trigger:
            - call: "POST /body-art/procedure-logs"
              payload: { establishment_id: "${est_id}", artist_id: "${a1_id}", client_age: 27, procedure_type: "TATTOO", started_at: "2026-05-01T09:00:00Z", ended_at: "2026-05-01T10:00:00Z", aftercare_provided: true }
              as: Artist
              as_user_id: "${a1_id}"
              captures: { pl1_id: $.data.id }
            - call: "POST /body-art/procedure-logs"
              payload: { establishment_id: "${est_id}", artist_id: "${a1_id}", client_age: 34, procedure_type: "TATTOO", started_at: "2026-05-01T10:00:00Z", ended_at: "2026-05-01T11:00:00Z", aftercare_provided: true }
              as: Artist
