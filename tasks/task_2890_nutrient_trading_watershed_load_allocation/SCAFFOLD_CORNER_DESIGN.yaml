            - "trigger call 2 responds 201 with data.computed_load_lbs_yr == 98422.25"
            - "trigger call 3 responds 201 with data.computed_load_lbs_yr == 4921.11"
            - "trigger call 4 responds 201 with data.computed_load_lbs_yr == 3936.89"
            - "every trigger response has data.qa_status == \"ACCEPTED\""
