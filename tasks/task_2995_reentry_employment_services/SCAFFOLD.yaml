  - method: GET
    path: /supervision-cases/{id}
    description: "Reads one supervision case."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: []
    output: SupervisionCase
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_SUPERVISION_CASE_NOT_FOUND]

  - method: GET
    path: /supervision-cases
    description: "Lists supervision cases; filter by participant to reach a participant's cases."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: ["limit?", "offset?", "participant_id?", "status?", "work_authorization_status?", "officer_user_id?"]
    output: SupervisionCase[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_VALIDATION]

  - method: POST
    path: /supervision-cases/{id}/status
    description: "Advances the supervision case lifecycle. Officer-owned."
    roles: [SupervisionOfficer]
    input: [to_status]
    output: SupervisionCase
    side_effects:
      - "on REVOKED, work_authorization_status APPROVED → SUSPENDED and the participant's future SCHEDULED shifts cascade to CONFLICTED, driving placement schedule_compliance and participant engagement_posture"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_SUPERVISION_CASE_NOT_FOUND, ERR_NOT_CASE_OFFICER, ERR_SUPERVISION_CASE_INVALID_STATE]

  - method: POST
    path: /supervision-cases/{id}/work-authorization
    description: "Grants, denies, suspends or restores permission to work, with the approved daily window."
    roles: [SupervisionOfficer]
    input: [decision, "approved_window_start_minute?", "approved_window_end_minute?"]
    output: SupervisionCase
    side_effects:
      - "authorization_change_count incremented"
      - "on SUSPENDED, future SCHEDULED shifts cascade to CONFLICTED; placement schedule_compliance, participant engagement_posture, placement projected_subsidy_cents and the grant ledger all recompute, possibly promoting a DEFERRED support request"
      - "on restoration to APPROVED, the CONFLICTED shifts that still fit the new window return to SCHEDULED and every derived field recomputes back"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_SUPERVISION_CASE_NOT_FOUND, ERR_NOT_CASE_OFFICER, ERR_SUPERVISION_CASE_INVALID_STATE]

  # ---- EmployerPartnership -------------------------------------------------
  - method: POST
    path: /employer-partnerships
