            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: ["MANUFACTURING_READINESS", "SALES_SELL_IN_PLAN"], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 999, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { fz_g2_id: $.data.id }
