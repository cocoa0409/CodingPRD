      - name: remediation_submission_is_allowed_only_before_the_due_date
        claim_type: conditional_action
        grounds:
          - "validations[priority=68]"
          - "state_machines.FacilityStandardReview[OPEN -> REMEDIATION_SUBMITTED]"
          - errors[ERR_REMEDIATION_WINDOW_CLOSED]
        distinguishing_aspect: "Two MAJOR reviews at the same affiliate share the due date 2026-03-31: one is remediated at clock 2026-03-15 and succeeds, the other is attempted at clock 2026-04-01 and returns 409 ERR_REMEDIATION_WINDOW_CLOSED — the action itself is legal from OPEN, only the clock decides."
        test_recipe:
          setup:
            - "The logical clock starts at 2026-03-01T00:00:00Z."
            - "One affiliate with two MAJOR reviews (score 60) in different categories, both dated 2026-03-01, so both get remediation_due_date 2026-03-01 + REMEDIATION_DAYS[MAJOR] 30 == 2026-03-31."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /affiliates"
              payload: { name: "Remediation Club", level: "HIGH_A", market_city: "Winston", meal_stipend_cents_per_day: 2800 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { rw_aff: $.data.id }
            - call: "POST /affiliates/${rw_aff}/facility-reviews"
              payload: { category: "CLUBHOUSE", review_date: "2026-03-01", score: 60 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { rw_r1: $.data.id, rw_due1: $.data.remediation_due_date }
            - call: "POST /affiliates/${rw_aff}/facility-reviews"
              payload: { category: "LIGHTING", review_date: "2026-03-01", score: 60 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { rw_r2: $.data.id, rw_due2: $.data.remediation_due_date }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: AffiliateOperator
              as_user_id: "${rw_aff}"
            - call: "POST /facility-reviews/${rw_r1}/disposition"
              payload: { action: "SUBMIT_REMEDIATION", remediation_note: "clubhouse repairs completed" }
              as: AffiliateOperator
              as_user_id: "${rw_aff}"
              captures: { rw_r1_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: AffiliateOperator
              as_user_id: "${rw_aff}"
            - call: "POST /facility-reviews/${rw_r2}/disposition"
              payload: { action: "SUBMIT_REMEDIATION", remediation_note: "lighting rig replaced" }
              as: AffiliateOperator
              as_user_id: "${rw_aff}"
              captures: { rw_err: $.data.error_id }
            - call: "GET /affiliates/${rw_aff}/facility-reviews"
              payload: { status: "OPEN" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { rw_open_first: "$.data[0].id" }
          assert:
            - "Both reviews are created with deficiency_level == MAJOR, status == OPEN and remediation_due_date == 2026-03-31"
            - "Affiliate.${rw_aff}.facility_status == DEFICIENT with open_major_deficiency_count == 2 and facility_score == 60.00"
            - "At clock 2026-03-15 the first submission returns 200 with FacilityStandardReview.${rw_r1}.status == REMEDIATION_SUBMITTED and a non-null remediation_submitted_at"
            - "At clock 2026-04-01 the second submission returns 409 with error_id == ERR_REMEDIATION_WINDOW_CLOSED and ${rw_r2} stays OPEN with is_overdue == true"
            - "The affiliate has no agreement, so the posture gate is irrelevant here and priority 68 is the only rule under test"

  # ==========================================================================
  - section: errors
    instances:

      - name: waive_is_refused_on_a_major_deficiency
        claim_type: error_triggerable
        grounds:
          - errors[ERR_WAIVER_NOT_PERMITTED]
          - "state_machines.FacilityStandardReview[OPEN -> WAIVED]"
        distinguishing_aspect: "A score-60 review cannot be waived (422 ERR_WAIVER_NOT_PERMITTED) while a score-75 review at the same affiliate can, so the waiver gate is keyed on deficiency_level MINOR and not on review status."
        test_recipe:
          setup:
            - "The logical clock is at 2026-03-01T00:00:00Z."
            - "One affiliate with a MAJOR review (score 60, CLUBHOUSE) and a MINOR review (score 75, LIGHTING)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /affiliates"
              payload: { name: "Waiver Club", level: "SINGLE_A", market_city: "Fayetteville", meal_stipend_cents_per_day: 2600 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { wv_aff: $.data.id }
            - call: "POST /affiliates/${wv_aff}/facility-reviews"
              payload: { category: "CLUBHOUSE", review_date: "2026-03-01", score: 60 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { wv_major: $.data.id }
            - call: "POST /affiliates/${wv_aff}/facility-reviews"
              payload: { category: "LIGHTING", review_date: "2026-03-01", score: 75 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { wv_minor: $.data.id }
          trigger:
            - call: "POST /facility-reviews/${wv_major}/disposition"
              payload: { action: "WAIVE", note: "requesting relief" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { wv_err: $.data.error_id }
            - call: "POST /facility-reviews/${wv_minor}/disposition"
              payload: { action: "WAIVE", note: "lighting relief granted" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { wv_minor_status: $.data.status }
            - call: "GET /affiliates/${wv_aff}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { wv_score: $.data.facility_score, wv_status: $.data.facility_status }
          assert:
            - "WAIVE on the MAJOR review returns 422 with error_id == ERR_WAIVER_NOT_PERMITTED and it stays OPEN"
            - "WAIVE on the MINOR review returns 200 with status == WAIVED"
            - "After the waiver Affiliate.${wv_aff}.facility_score == 60.00 (only the non-WAIVED CLUBHOUSE review remains in the mean)"
            - "Affiliate.${wv_aff}.facility_status == DEFICIENT because the MAJOR review is still open"

      - name: uniqueness_conflicts_on_pool_season_and_on_active_agreement
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_POOL_SEASON]
          - errors[ERR_DUPLICATE_ACTIVE_AGREEMENT]
          - "validations[priority=45]"
        distinguishing_aspect: "Two different uniqueness scopes are violated in one fixture: a second SigningPool for season 2026 is refused outright, while a second agreement for the same affiliate is created happily and only refused at SUBMIT time, because the constraint is scoped to agreements already in SUBMITTED or ACTIVE rather than to the row itself."
        test_recipe:
          setup:
            - "The logical clock is at 2026-08-01T00:00:00Z."
            - "One affiliate whose first agreement has been SUBMITted, plus one SigningPool for season 2026."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
