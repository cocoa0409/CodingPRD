# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task 2755 Berry Harvest Labor & Packing Ops
#
# §1.8 test-targeting index. Every instance grounds in SCAFFOLD.yaml §1.1-§1.7;
# every numeric assert below was produced by executing the referenced
# calculations[].formula against its constants, not estimated.
#
# Logical clock: the server starts at 2026-08-01T00:00:00Z
# (endpoints POST /berry-ops/_clock/set_current_utc). Chains that do not touch
# the clock run at that default instant.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: payroll_period_average_diverges_from_per_session_guarantee
        grounds:
          - calculations.session_pay_per_session
          - calculations.payroll_period_averaged_settlement
          - calculations.crew_wage_ledger
          - state_machines.PayrollRun.LOCKED_to_SETTLED
          - entities.PayrollRun.fields.reconciliation_delta_cents
        distinguishing_aspect: |
          The two variants read the SAME two approved tallies and disagree on the
          payable amount because the per-session variant multiplies each
          session's hours by the minimum wage separately (topping up the slow
          session by 4050 cents) while the period variant sums the hours first
          and finds the period already above the floor, so
          PayrollRun.settled_net_cents == 9900 while the sum of the sessions'
          net_cents == 13950 and reconciliation_delta_cents == -4050.
        test_recipe:
          setup:
            - "One STRAWBERRY block with a single passing water sample, so food_safety_posture is CLEARED."
            - "One DOMESTIC crew (no housing deduction) with one picker whose hygiene training is valid, support plan complete, crew CERTIFIED."
            - "One harvest window 2026-08-03T06:00:00Z -> 2026-08-04T14:00:00Z, piece rate 45 cents, clamshell 1.00 lb, CONFIRMED then OPEN."
            - "Two approved pick sessions of the same picker: 2026-08-03 (3.00 h, 20 clamshells, 0 culled) and 2026-08-04 (3.00 h, 200 clamshells, 0 culled)."
            - "One DRAFT payroll run over 2026-08-03..2026-08-04 for that crew."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-DV1", variety: "STRAWBERRY", acres: 12.50, planting_year: 2023, irrigation_source_code: "WELL-1" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-DV1", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/pickers"
              payload: { crew_id: "${crew}", full_name: "Picker One", hygiene_training_on: "2026-06-01" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { pk1: $.data.id }
            - call: "POST /berry-ops/crews/${crew}/support-plan"
              payload: { housing_unit_code: "H-1", beds_confirmed: 1, transport_route_code: "R-1", vehicle_seats: 1 }
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/crews/${crew}/certify"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-04T14:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/harvest-windows/${win}/confirm"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/harvest-windows/${win}/open"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/pick-sessions"
              payload: { harvest_window_id: "${win}", picker_id: "${pk1}", work_date: "2026-08-03" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { ses_a: $.data.id }
            - call: "POST /berry-ops/pick-sessions/${ses_a}/tally"
              payload: { hours_worked: 3.00, clamshells_filled: 20, culled_clamshells: 0 }
              as: CrewSupervisor
              as_user_id: "sup-1"
            - call: "POST /berry-ops/pick-sessions/${ses_a}/approve"
              payload: {}
              as: PayrollClerk
              as_user_id: "clerk-1"
            - call: "POST /berry-ops/pick-sessions"
              payload: { harvest_window_id: "${win}", picker_id: "${pk1}", work_date: "2026-08-04" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { ses_b: $.data.id }
            - call: "POST /berry-ops/pick-sessions/${ses_b}/tally"
              payload: { hours_worked: 3.00, clamshells_filled: 200, culled_clamshells: 0 }
              as: CrewSupervisor
              as_user_id: "sup-1"
            - call: "POST /berry-ops/pick-sessions/${ses_b}/approve"
              payload: {}
              as: PayrollClerk
              as_user_id: "clerk-1"
            - call: "POST /berry-ops/payroll-runs"
              payload: { crew_id: "${crew}", period_start_date: "2026-08-03", period_end_date: "2026-08-04" }
              as: PayrollClerk
              as_user_id: "clerk-1"
              captures: { run: $.data.id }
          trigger:
            - call: "POST /berry-ops/payroll-runs/${run}/lock"
              payload: {}
              as: PayrollClerk
              as_user_id: "clerk-1"
            - call: "POST /berry-ops/payroll-runs/${run}/settle"
              payload: {}
              as: PayrollClerk
              as_user_id: "clerk-2"
          assert:
            - "PickSession.${ses_a}.piece_cents == 900 and PickSession.${ses_a}.guarantee_floor_cents == 4950 and PickSession.${ses_a}.makeup_cents == 4050 and PickSession.${ses_a}.net_cents == 4950"
            - "PickSession.${ses_b}.piece_cents == 9000 and PickSession.${ses_b}.makeup_cents == 0 and PickSession.${ses_b}.net_cents == 9000"
            - "PayrollRun.${run}.bound_session_count == 2 and PayrollRun.${run}.period_hours == 6.00 and PayrollRun.${run}.period_piece_cents == 9900"
            - "PayrollRun.${run}.period_floor_cents == 9900 and PayrollRun.${run}.period_makeup_cents == 0"
            - "PayrollRun.${run}.settled_gross_cents == 9900 and PayrollRun.${run}.settled_net_cents == 9900"
            - "PayrollRun.${run}.accrued_gross_cents == 13950 and PayrollRun.${run}.reconciliation_delta_cents == -4050"
            - "Crew.${crew}.accrued_wage_cents == 0 and Crew.${crew}.settled_wage_cents == 9900 and Crew.${crew}.reconciliation_delta_cents == -4050"
            - "PickSession.${ses_a}.status == SETTLED and PickSession.${ses_b}.status == SETTLED"
            - "PayrollRun.${run}.status == SETTLED"

      - name: lot_forecast_shelf_life_diverges_from_verified_shelf_life
        grounds:
          - calculations.lot_shelf_life
          - entities.FruitLot.fields.forecast_shelf_life_days
          - entities.FruitLot.fields.verified_shelf_life_days
          - state_machines.FruitLot.PACKED_to_COOLING
          - state_machines.FruitLot.COOLING_to_COOLED
        distinguishing_aspect: |
          The same STRAWBERRY grade-A lot is scored twice on the fruit-quality
          side of the domain (not the money side): the forecast variant uses the
          PLANNED cool end and a zero exit-temperature penalty and yields
          forecast_shelf_life_days == 5, while the verified variant uses the
          ACTUAL 5.50 h cool run and the measured 37.0 degF exit pulp and yields
          verified_shelf_life_days == 2 with shelf_life_expires_on 2026-08-05.
        test_recipe:
          setup:
            - "One STRAWBERRY block, one crew and one PLANNED harvest window spanning 2026-08-03."
            - "One forced-air tunnel with slot_capacity 4."
            - "One grade-A STRAWBERRY lot of 130 clamshells at 1.00 lb, pack_completed_at 2026-08-03T06:00:00Z."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-DV2", variety: "STRAWBERRY", acres: 8.00, planting_year: 2022, irrigation_source_code: "WELL-2" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-DV2", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T18:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/cooling-tunnels"
              payload: { name: "TUN-DV2", slot_capacity: 4, target_pulp_temp_f: 34.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { tun: $.data.id, tun_v: $.data.version }
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "A", clamshell_count: 130, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T06:00:00Z", field_pulp_temp_f: 68.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { lot: $.data.id }
          trigger:
            - call: "POST /berry-ops/fruit-lots/${lot}/start-cooling"
              payload: { cooling_tunnel_id: "${tun}", cool_start_at: "2026-08-03T09:30:00Z", planned_cool_end_at: "2026-08-03T13:30:00Z", entry_pulp_temp_f: 60.0, pallet_slots: 1, expected_cooling_tunnel_version: "${tun_v}" }
              as: PackhouseOperator
              as_user_id: "pack-1"
            - call: "POST /berry-ops/fruit-lots/${lot}/complete-cooling"
              payload: { cool_complete_at: "2026-08-03T15:00:00Z", exit_pulp_temp_f: 37.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
          assert:
            - "FruitLot.${lot}.field_delay_hours == 3.50"
            - "FruitLot.${lot}.forecast_shelf_life_days == 5"
            - "FruitLot.${lot}.cool_hours == 5.50"
            - "FruitLot.${lot}.verified_shelf_life_days == 2"
            - "FruitLot.${lot}.verified_shelf_life_days != FruitLot.${lot}.forecast_shelf_life_days"
            - "FruitLot.${lot}.shelf_life_expires_on == 2026-08-05"
            - "FruitLot.${lot}.cold_chain_status == COOLED and FruitLot.${lot}.disposition_status == UNCOMMITTED"
            - "CoolingTunnel.${tun}.committed_slots == 0"

  - rule_id: combinatorial_formula
    instances:

      - name: window_crew_requirement_ceiling_over_maturity_adjusted_capacity
        grounds:
          - calculations.window_crew_requirement
          - entities.HarvestWindow.fields.effective_pick_rate_lbs_per_hour
          - entities.HarvestWindow.fields.required_picker_count
          - state_machines.HarvestWindow.PLANNED_to_CONFIRMED
        distinguishing_aspect: |
          Mode (a): three independent inputs (variety base pick rate, a maturity
          multiplier switched by a brix threshold, and window length) combine
          multiplicatively into a capacity that is then DIVIDED into the planned
          volume and rounded UP, so BLUEBERRY at brix 12.5 over 7.50 h yields
          effective_pick_rate_lbs_per_hour 19.80 and required_picker_count 3 for
          300.00 lbs even though 300/148.5 is only 2.02 pickers.
        test_recipe:
          setup:
            - "One BLUEBERRY block (base pick rate 18, brix target 12.0) with no water sample, so posture is RESTRICTED but not QUARANTINED — enough to confirm a window."
            - "One crew, and one PLANNED window 2026-08-05T05:00:00Z -> 2026-08-05T12:30:00Z with forecast_brix 12.5 and planned_volume_lbs 300.00."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-CF1", variety: "BLUEBERRY", acres: 20.00, planting_year: 2019, irrigation_source_code: "WELL-3" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-CF1", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 4, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-05T05:00:00Z", end_at: "2026-08-05T12:30:00Z", forecast_brix: 12.5, planned_volume_lbs: 300.00, piece_rate_cents_per_clamshell: 60, clamshell_net_weight_lbs: 1.25 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
          trigger:
            - call: "POST /berry-ops/harvest-windows/${win}/confirm"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
          assert:
            - "HarvestWindow.${win}.window_hours == 7.50"
            - "HarvestWindow.${win}.effective_pick_rate_lbs_per_hour == 19.80"
            - "HarvestWindow.${win}.required_picker_count == 3"
            - "HarvestWindow.${win}.status == CONFIRMED"

      - name: commitment_settlement_rounds_each_shipped_line_before_summing
        grounds:
          - calculations.commitment_settlement
          - entities.LotAllocation.fields.line_discount_cents
          - entities.BuyerCommitment.fields.settled_revenue_cents
          - state_machines.BuyerCommitment.OPEN_to_SETTLED
        distinguishing_aspect: |
          Mode (b): the shelf-life discount is applied and rounded ONCE PER
          SHIPPED LINE and only then summed, so settled_revenue_cents == 76098;
          rounding the aggregate instead (round_half_up(80104 * 0.05) = 4005)
          would give 76099, a one-cent divergence that only a per-line
          implementation reproduces.
        test_recipe:
          setup:
            - "One STRAWBERRY block with three passing water samples (40, 50, 60 MPN) so water_status is COMPLIANT — required to ship."
            - "One crew and one PLANNED harvest window spanning 2026-08-03."
            - "One tunnel with slot_capacity 2."
            - "Two grade-A STRAWBERRY lots, 130 and 95 clamshells at 1.00 lb, each cooled with field_delay 2.00 h, cool_hours 4.00 and exit pulp 40.0 degF, so each carries verified_shelf_life_days 4 and shelf_life_expires_on 2026-08-07."
            - "One buyer commitment: 220.00 lbs at 380 cents/lb, shelf_life_guarantee_days 5, delivery window 2026-08-01..2026-08-10."
            - "Two shipped allocation lines of 120.50 lbs and 90.30 lbs, both shipped_at 2026-08-04T10:00:00Z, then the clock advanced to 2026-08-11T00:00:00Z."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-CF2", variety: "STRAWBERRY", acres: 10.00, planting_year: 2021, irrigation_source_code: "WELL-4" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-24", generic_ecoli_mpn: 50 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-28", generic_ecoli_mpn: 60 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-CF2", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T05:00:00Z", end_at: "2026-08-03T17:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/cooling-tunnels"
              payload: { name: "TUN-CF2", slot_capacity: 2, target_pulp_temp_f: 34.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { tun: $.data.id, tun_v1: $.data.version }
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "A", clamshell_count: 130, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T06:00:00Z", field_pulp_temp_f: 66.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { lot1: $.data.id }
            - call: "POST /berry-ops/fruit-lots/${lot1}/start-cooling"
              payload: { cooling_tunnel_id: "${tun}", cool_start_at: "2026-08-03T08:00:00Z", planned_cool_end_at: "2026-08-03T12:00:00Z", entry_pulp_temp_f: 58.0, pallet_slots: 1, expected_cooling_tunnel_version: "${tun_v1}" }
              as: PackhouseOperator
              as_user_id: "pack-1"
            - call: "POST /berry-ops/fruit-lots/${lot1}/complete-cooling"
              payload: { cool_complete_at: "2026-08-03T12:00:00Z", exit_pulp_temp_f: 40.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "A", clamshell_count: 95, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T06:00:00Z", field_pulp_temp_f: 66.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { lot2: $.data.id }
            - call: "GET /berry-ops/cooling-tunnels/${tun}"
              payload: {}
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { tun_v2: $.data.version }
            - call: "POST /berry-ops/fruit-lots/${lot2}/start-cooling"
              payload: { cooling_tunnel_id: "${tun}", cool_start_at: "2026-08-03T08:00:00Z", planned_cool_end_at: "2026-08-03T12:00:00Z", entry_pulp_temp_f: 58.0, pallet_slots: 1, expected_cooling_tunnel_version: "${tun_v2}" }
              as: PackhouseOperator
              as_user_id: "pack-1"
            - call: "POST /berry-ops/fruit-lots/${lot2}/complete-cooling"
              payload: { cool_complete_at: "2026-08-03T12:00:00Z", exit_pulp_temp_f: 40.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
            - call: "POST /berry-ops/buyer-commitments"
              payload: { buyer_name: "BigMart", buyer_user_id: "buyer-1", variety: "STRAWBERRY", volume_commitment_lbs: 220.00, price_cents_per_lb: 380, shelf_life_guarantee_days: 5, window_start_date: "2026-08-01", window_end_date: "2026-08-10" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { com: $.data.id, com_v1: $.data.version }
            - call: "POST /berry-ops/lot-allocations"
              payload: { fruit_lot_id: "${lot1}", buyer_commitment_id: "${com}", allocated_lbs: 120.50, expected_buyer_commitment_version: "${com_v1}" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { alloc1: $.data.id }
            - call: "GET /berry-ops/buyer-commitments/${com}"
              payload: {}
              as: SalesManager
              as_user_id: "sales-1"
              captures: { com_v2: $.data.version }
            - call: "POST /berry-ops/lot-allocations"
              payload: { fruit_lot_id: "${lot2}", buyer_commitment_id: "${com}", allocated_lbs: 90.30, expected_buyer_commitment_version: "${com_v2}" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { alloc2: $.data.id }
            - call: "POST /berry-ops/lot-allocations/${alloc1}/ship"
              payload: { shipped_at: "2026-08-04T10:00:00Z" }
              as: SalesManager
              as_user_id: "sales-1"
            - call: "POST /berry-ops/lot-allocations/${alloc2}/ship"
              payload: { shipped_at: "2026-08-04T10:00:00Z" }
              as: SalesManager
              as_user_id: "sales-1"
            - call: "POST /berry-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /berry-ops/buyer-commitments/${com}/settle"
              payload: {}
              as: SalesManager
              as_user_id: "sales-1"
          assert:
            - "FruitLot.${lot1}.verified_shelf_life_days == 4 and FruitLot.${lot2}.verified_shelf_life_days == 4"
            - "LotAllocation.${alloc1}.shelf_life_shortfall_days == 1 and LotAllocation.${alloc2}.shelf_life_shortfall_days == 1"
            - "LotAllocation.${alloc1}.line_gross_cents == 45790 and LotAllocation.${alloc1}.line_discount_cents == 2290 and LotAllocation.${alloc1}.line_net_cents == 43500"
            - "LotAllocation.${alloc2}.line_gross_cents == 34314 and LotAllocation.${alloc2}.line_discount_cents == 1716 and LotAllocation.${alloc2}.line_net_cents == 32598"
            - "BuyerCommitment.${com}.settled_revenue_cents == 76098"
            - "BuyerCommitment.${com}.settled_revenue_cents != 76099"
            - "BuyerCommitment.${com}.shipped_lbs == 210.80 and BuyerCommitment.${com}.fill_pct == 0.9582"
            - "BuyerCommitment.${com}.fill_status == FILLED and BuyerCommitment.${com}.shortfall_penalty_cents == 0"
            - "BuyerCommitment.${com}.settled_net_cents == 76098 and BuyerCommitment.${com}.status == SETTLED"

