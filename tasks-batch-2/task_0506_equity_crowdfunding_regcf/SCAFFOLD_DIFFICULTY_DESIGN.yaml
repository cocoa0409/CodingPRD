            - call: "POST /offerings/${a_id}/form-c/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings/${a_id}/form-c/qualify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings/${a_id}/go-live"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "SAFE", min_target_cents: 100000, max_target_cents: 1000000, deadline_at: "2026-05-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { b_id: $.data.id }
            - call: "POST /offerings/${b_id}/form-c/submit"
