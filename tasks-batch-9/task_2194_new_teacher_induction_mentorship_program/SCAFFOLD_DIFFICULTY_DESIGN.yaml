            - "ContactLog.${il2_id}.credited_minutes == 0"
            - "ContactLog.${il2_id}.stipend_cents == 0"
            - "ContactLog.${il2_id}.void_reason == Model lesson was delivered by a different mentor"
            - "MentorMatch.${match_id}.verified_minutes_total == 120"
            - "Mentor.${mentor_id}.verified_minutes_lifetime == 120"
            - "NoviceTeacher.${novice_id}.verified_contact_minutes == 120"
            - "MentorMatch.${match_id}.accrued_stipend_cents == 8400"
            - "Mentor.${mentor_id}.stipend_accrued_cents == 8400"
            - "MentorMatch.${match_id}.verified_minutes_total == ContactLog.${il1_id}.credited_minutes, the sum over the remaining VERIFIED logs"
            - "NoviceTeacher.${novice_id}.readiness_index_live == 9.00"

      - name: clawback_conserves_stipend_cents
        grounds:
          - state_machines.StipendDisbursement.APPROVED_to_PAID
          - state_machines.StipendDisbursement.PAID_to_CLAWED_BACK
          - entities.Mentor.fields.stipend_paid_cents
          - entities.Mentor.fields.stipend_clawed_back_cents
          - concurrency_rules[stipend-draft-stale-mentor]
        distinguishing_aspect: |
          A DIFFERENT CONSERVED QUANTITY - disbursed STIPEND CENTS, not contact minutes:
          the clawback moves the full net_cents from Mentor.stipend_paid_cents to
          Mentor.stipend_clawed_back_cents so their sum stays exactly 8400, and the
          disbursement row keeps net_cents 8400 rather than being zeroed.
        test_recipe:
          setup:
            - "Open Site, CERTIFIED MATH Mentor, MATH NoviceTeacher, ACTIVE MentorMatch with subject_match_tier EXACT."
            - "Clock advanced to 2026-08-04T12:00:00Z."
            - "One VERIFIED ONE_ON_ONE log dated 2026-08-03 of 120 minutes -> credited 120, stipend 8400 cents."
            - "Clock advanced to 2026-10-05T00:00:00Z so the 2026-Q3 period is closed."
            - "A StipendDisbursement for period_code 2026-Q3 prepared by u-preparer-1 with gross_cents 8400 and net_cents 8400, APPROVED by the distinct user u-approver-1 (segregation of duties), then PAID with payment_reference ACH-2026-Q3-0001, which lifts Mentor.stipend_paid_cents to 8400."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 1 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /mentors"
              payload: { site_id: "${site_id}", full_name: "Rosa Alvarez", subject_endorsements: ["MATH"], caseload_cap: 2 }
              as: ProgramAdmin
              captures: { mentor_id: $.data.id }
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "FOUNDATIONS", hours: 8.00, completed_on: "2026-07-10" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "OBSERVATION_PROTOCOL", hours: 6.00, completed_on: "2026-07-11" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "EQUITY", hours: 4.00, completed_on: "2026-07-12" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "CERTIFY" }
              as: ProgramAdmin
              captures: { mentor_v1: $.data.version }
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Dana Pike", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_id: $.data.id }
            - call: "POST /mentor-matches"
              payload: { novice_id: "${novice_id}", mentor_id: "${mentor_id}", expected_mentor_version: "${mentor_v1}" }
              as: ProgramAdmin
              captures: { match_id: $.data.id }
            - call: "POST /mentor-matches/${match_id}/disposition"
              payload: { decision: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /contact-logs"
              payload: { match_id: "${match_id}", contact_date: "2026-08-03", minutes: 120, contact_type: "ONE_ON_ONE", description: "Weekly one-on-one planning conference with the novice teacher and formative data review" }
              as: Mentor
              as_user_id: "${mentor_id}"
              captures: { kl1_id: $.data.id }
            - call: "POST /contact-logs/${kl1_id}/review"
              payload: { decision: "VERIFY", note: "Minutes corroborated by the site sign-in sheet" }
              as: SiteInductionLead
              as_user_id: "${site_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /mentors/${mentor_id}"
              payload: {}
              as: ProgramAdmin
              captures: { mentor_v2: $.data.version }
            - call: "POST /stipend-disbursements"
              payload: { mentor_id: "${mentor_id}", period_code: "2026-Q3", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-30T23:59:59Z", expected_mentor_version: "${mentor_v2}" }
              as: ProgramAdmin
              as_user_id: "u-preparer-1"
              captures: { disb_id: $.data.id }
            - call: "POST /stipend-disbursements/${disb_id}/status"
              payload: { status: "APPROVED" }
              as: ProgramAdmin
              as_user_id: "u-approver-1"
            - call: "POST /stipend-disbursements/${disb_id}/status"
              payload: { status: "PAID", payment_reference: "ACH-2026-Q3-0001" }
              as: ProgramAdmin
              as_user_id: "u-approver-1"
          trigger:
            - call: "POST /stipend-disbursements/${disb_id}/status"
              payload: { status: "CLAWED_BACK", clawback_reason: "District audit reversed the quarter after a duplicate payment was found" }
              as: ProgramAdmin
              as_user_id: "u-program-office-1"
          assert:
            - "StipendDisbursement.${disb_id}.status == CLAWED_BACK"
            - "StipendDisbursement.${disb_id}.net_cents == 8400"
            - "StipendDisbursement.${disb_id}.gross_cents == 8400"
            - "StipendDisbursement.${disb_id}.clawback_reason == District audit reversed the quarter after a duplicate payment was found"
            - "Mentor.${mentor_id}.stipend_paid_cents == 0"
            - "Mentor.${mentor_id}.stipend_clawed_back_cents == 8400"
            - "Mentor.${mentor_id}.stipend_paid_cents + Mentor.${mentor_id}.stipend_clawed_back_cents == 8400"
            - "Mentor.${mentor_id}.stipend_accrued_cents == 8400, unchanged by the clawback"
