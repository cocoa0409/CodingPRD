# =============================================================================
# Task 2273 — Faculty Credential Verification for Accreditation
# SCAFFOLD.yaml — §1.0 through §1.7 (single source of truth for downstream
# PRD / unit-test / implementation generation).
#
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  2273. Faculty Credential Verification for Accreditation (university accreditation and faculty
  roster office): terminal degree and discipline alignment verification against course assignments,
  tested experience justification with documented alternative credentials, official transcript
  collection and foreign credential evaluation, faculty roster generation by term and course with
  exceptions flagged, adjunct and clinical faculty credentialing before contract issuance,
  substantive change and new program faculty adequacy, ongoing professional development
  documentation, accreditor review response and remediation of unqualified assignments

domain_name: faculty-credential-accreditation
api_prefix: "/"

# =============================================================================
# Step 0 — Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - conditional_feature_flags

  entity_topology: flat
  # Every entity is a root collection addressed by its own id; relationships are
  # expressed only through FK fields in request bodies and filtered-list GETs.
  # DisciplineTaxonomy is self-referential, so the reference graph is a forest
  # overlaid with cross-aggregate edges (Program/Term/Section/Assignment).

  state_machine_shape: cyclic
  # CourseAssignment cycles VERIFIED_QUALIFIED -> EXCEPTION_FLAGGED ->
  # REMEDIATION_IN_PROGRESS -> VERIFIED_QUALIFIED; AccreditorReview cycles
  # REMEDIATION_REQUIRED -> RESPONSE_SUBMITTED -> REMEDIATION_REQUIRED;
  # FacultyMember carries two independent state dimensions on one row
  # (dossier_status x appointment_status); AccreditorReview.findings forks.

  relationship_patterns:
    - one_to_many
    - self_referential      # DisciplineTaxonomy.parent_discipline_id
    - cross_aggregate       # CourseAssignment spans Section/Faculty/Program/Term/Roster
    - many_to_many          # CourseAssignment is the junction of FacultyMember x CourseSection

  role_model: segregation_of_duties
  # The CredentialAnalyst who verified a faculty member's CredentialRecord may not
  # decide that faculty member's TestedExperienceJustification, and the
  # AccreditationLiaison who certifies a roster may not be a user who decided any
  # justification counted inside it.

  consistency_model: immediate
  # Every cascade, derived-field recompute and ledger adjustment is visible in the
  # response of the request that triggered it.

  difficulty_level: beyond_expert
  # 13 entities / 70 endpoints / 46 error codes / 12 calculations (2 dual-variant
  # plus 3 differentiated combinatorial modes) / 13 state machines across 11
  # entities (FacultyMember and CredentialRecord each carry two independent state
  # dimensions) / 35 ordered validations / 2 OCC rules.

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- discipline
  - name: DisciplineTaxonomy
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "CIP-style discipline code; unique across all DisciplineTaxonomy rows", constraints: "non-empty, unique" }
      - { name: name, type: string, source: input, description: "Human-readable discipline name" }
      - { name: parent_discipline_id, type: string, source: input, description: "FK -> DisciplineTaxonomy.id; null for a root discipline. Only ONE level of parenthood is honored by discipline-alignment checks — a grandparent discipline never matches.", default: null }
      - { name: min_graduate_credit_hours, type: number, source: input, description: "Graduate credit hours in this discipline required by the COURSEWORK_18 qualification policy", default: 18, constraints: ">= 0" }
      - { name: required_terminal_degree_level, type: enum, source: input, description: "Terminal degree the accreditor expects for this discipline", constraints: "MASTERS | DOCTORATE" }

  # ------------------------------------------------------------------ program
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Academic program name" }
      - { name: discipline_id, type: string, source: input, description: "FK -> DisciplineTaxonomy.id; the program's home discipline, also used as the professional-development relevance anchor" }
      - { name: degree_level, type: enum, source: input, description: "Credential the program awards", constraints: "CERTIFICATE | ASSOCIATE | BACHELORS | MASTERS | DOCTORATE" }
      - { name: qualification_policy, type: enum, source: input, description: "Feature flag selecting which variant of assignment_qualification_determination applies to this program's sections", constraints: "DEGREE_FIELD | COURSEWORK_18" }
      - { name: adequacy_basis, type: enum, source: input, description: "Feature flag selecting which variant of program_faculty_adequacy is persisted onto adequacy_ratio / adequacy_status", constraints: "HEADCOUNT | CREDIT_HOUR_COVERAGE" }
      - { name: min_terminal_ratio, type: number, source: input, description: "Adequacy ratio at or above which the program is ADEQUATE", default: 0.75, constraints: "0 <= x <= 1" }
      - { name: is_substantive_change, type: boolean, source: input, description: "True when the program is a substantive change filing requiring accreditor pre-approval before launch", default: false }
      - { name: credential_budget_cents, type: integer, source: input, description: "Ceiling for foreign-credential-evaluation spending charged to this program", constraints: ">= 0" }
      - { name: budget_reserved_cents, type: integer, source: computed, description: "= sum(CredentialEvaluation.fee_cents where billed_program_id == this.id AND status IN {ORDERED, IN_REVIEW})", default: 0 }
      - { name: budget_spent_cents, type: integer, source: computed, description: "= sum(share_cents allocated to this program by evaluation_cost_allocation across all CredentialEvaluation rows with status COMPLETED)", default: 0 }
      - { name: launch_status, type: enum, source: system, description: "Substantive-change / new-program launch gate", default: PLANNING, constraints: "PLANNING | ADEQUACY_REVIEW | APPROVED_TO_LAUNCH | ADEQUACY_DENIED" }
      - { name: adequacy_ratio, type: number, source: computed, description: "Latest persisted program_faculty_adequacy result under this.adequacy_basis, 4 decimal places", default: 0.0 }
      - { name: adequacy_status, type: enum, source: computed, description: "ADEQUATE | AT_RISK | INSUFFICIENT — derived from adequacy_ratio vs min_terminal_ratio", default: INSUFFICIENT }
      - { name: unqualified_assignment_count, type: integer, source: computed, description: "Count of CourseAssignment rows with status IN {EXCEPTION_FLAGGED, REMEDIATION_IN_PROGRESS} whose CourseSection.program_id == this.id and whose Term.status != CLOSED", default: 0 }
      - { name: adequacy_term_id, type: string, source: computed, description: "Term.id of the FacultyRoster whose recompute last wrote adequacy_ratio; null before the first roster generation", default: null }

  # --------------------------------------------------------------------- term
  - name: Term
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Term code such as 2026FA; unique across all Term rows", constraints: "non-empty, unique" }
      - { name: start_date, type: datetime, source: input, description: "First instructional day, date-only ISO 8601 (YYYY-MM-DD)" }
      - { name: end_date, type: datetime, source: input, description: "Last instructional day, date-only ISO 8601", constraints: ">= start_date" }
      - { name: census_date, type: datetime, source: input, description: "Official enrollment census day; anchors the professional-development rolling window", constraints: "start_date <= census_date <= end_date" }
      - { name: status, type: enum, source: system, description: "PLANNING -> OPEN -> ROSTER_LOCKED -> CLOSED", default: PLANNING, constraints: "PLANNING | OPEN | ROSTER_LOCKED | CLOSED" }

  # ----------------------------------------------------------- faculty member
  - name: FacultyMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Faculty member legal name" }
      - { name: email, type: string, source: input, description: "Institutional email; unique across all FacultyMember rows", constraints: "unique" }
      - { name: employment_class, type: enum, source: input, description: "Drives max term load and required professional-development hours", constraints: "FULL_TIME | ADJUNCT | CLINICAL | GRADUATE_ASSISTANT" }
      - { name: home_program_id, type: string, source: input, description: "FK -> Program.id; the program that owns the appointment and whose discipline anchors PD relevance" }
      - { name: dossier_status, type: enum, source: system, description: "Credential-dossier dimension: INCOMPLETE | UNDER_REVIEW | VERIFIED | DEFICIENT — recomputed by faculty_dossier_recompute after every credential/transcript/evaluation event", default: INCOMPLETE }
      - { name: appointment_status, type: enum, source: system, description: "Appointment dimension, independent of dossier_status: PROSPECT | CREDENTIALED_ELIGIBLE | CONTRACTED | SEPARATED", default: PROSPECT }
      - { name: deficiency_codes, type: array, source: computed, description: "De-duplicated string array produced by faculty_dossier_recompute and appended in that rule's declared code order; empty exactly when dossier_status == VERIFIED", default: [] }
      - { name: highest_verified_degree_level, type: enum, source: computed, description: "Greatest effective_degree_level over the faculty's eligible CredentialRecord rows; null when there are none", default: null, constraints: "NON_DEGREE_GRADUATE | BACHELORS | MASTERS | DOCTORATE | null" }
      - { name: assigned_credit_hours, type: number, source: computed, description: "Conserved ledger: = sum(CourseSection.credit_hours) over CourseAssignment rows for this faculty with status IN {PENDING_VERIFICATION, VERIFIED_QUALIFIED, EXCEPTION_FLAGGED, REMEDIATION_IN_PROGRESS} whose Term.status != CLOSED", default: 0 }
      - { name: pd_hours_current_cycle, type: number, source: computed, description: "total_hours output of professional_development_compliance for the anchor term (see that calculation's input_set)", default: 0 }
      - { name: pd_compliant, type: boolean, source: computed, description: "pd_compliant output of professional_development_compliance for the anchor term", default: false }

  # -------------------------------------------------------- credential record
  - name: CredentialRecord
    parent: null
    common_fields: true
    fields:
      - { name: faculty_member_id, type: string, source: input, description: "FK -> FacultyMember.id" }
      - { name: degree_level, type: enum, source: input, description: "Credential as claimed by the faculty member", constraints: "NON_DEGREE_GRADUATE | BACHELORS | MASTERS | DOCTORATE" }
      - { name: discipline_id, type: string, source: input, description: "FK -> DisciplineTaxonomy.id; the discipline of the degree or of the graduate coursework block" }
      - { name: conferring_institution, type: string, source: input, description: "Name of the conferring institution" }
      - { name: is_foreign_institution, type: boolean, source: input, description: "True when the conferring institution is outside the accreditor's jurisdiction, requiring a COMPLETED credential evaluation before the record counts", default: false }
      - { name: graduate_credit_hours_in_discipline, type: number, source: input, description: "Graduate credit hours the official transcript shows in this record's discipline_id", default: 0, constraints: ">= 0" }
      - { name: transcript_status, type: enum, source: system, description: "NOT_REQUESTED -> REQUESTED -> UNOFFICIAL_ONLY | OFFICIAL_RECEIVED", default: NOT_REQUESTED }
      - { name: verification_status, type: enum, source: system, description: "PENDING -> VERIFIED | REJECTED; VERIFIED -> REPUDIATED", default: PENDING }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the CredentialAnalyst who last decided this record; anchors the segregation-of-duties rule", default: null }
      - { name: effective_degree_level, type: enum, source: computed, description: "= equivalency_degree_level of the record's CredentialEvaluation with status COMPLETED and equivalency_verdict EQUIVALENT when is_foreign_institution == true, else = degree_level", default: null }
      - { name: effective_discipline_id, type: string, source: computed, description: "Mirrors CredentialEvaluation.equivalency_discipline_id (DisciplineTaxonomy.id) of the record's COMPLETED + EQUIVALENT evaluation when is_foreign_institution == true, else mirrors this.discipline_id", default: null }

  # ---------------------------------------------------- credential evaluation
  - name: CredentialEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: credential_record_id, type: string, source: input, description: "FK -> CredentialRecord.id; must reference a record with is_foreign_institution == true" }
      - { name: billed_program_id, type: string, source: input, description: "FK -> Program.id; the program whose credential_budget_cents reserves fee_cents at order time" }
      - { name: evaluator_agency, type: string, source: input, description: "Foreign-credential evaluation agency name" }
      - { name: page_count, type: integer, source: input, description: "Pages of foreign transcript submitted for evaluation; drives the tiered page fee", constraints: ">= 0" }
      - { name: service_level, type: enum, source: input, description: "STANDARD | EXPEDITED — EXPEDITED applies the 1.45 multiplier" }
      - { name: fee_cents, type: integer, source: computed, description: "Output of evaluation_fee_cents, frozen at order time and never recomputed" }
      - { name: status, type: enum, source: system, description: "ORDERED -> IN_REVIEW -> COMPLETED; ORDERED | IN_REVIEW -> VOIDED", default: ORDERED }
      - { name: equivalency_degree_level, type: enum, source: input, description: "Degree level the agency deems equivalent; supplied on the COMPLETED transition only", default: null, constraints: "NON_DEGREE_GRADUATE | BACHELORS | MASTERS | DOCTORATE | null" }
      - { name: equivalency_discipline_id, type: string, source: input, description: "FK -> DisciplineTaxonomy.id; discipline the agency deems equivalent, supplied on the COMPLETED transition only", default: null }
      - { name: equivalency_verdict, type: enum, source: input, description: "EQUIVALENT | PARTIAL | NOT_EQUIVALENT — supplied on the COMPLETED transition only; only EQUIVALENT makes the underlying record eligible", default: null }
      - { name: allocation_shares, type: array, source: computed, description: "Output of evaluation_cost_allocation, written on the COMPLETED transition: array of { program_id, weight_credit_hours, share_cents } ordered as allocated", default: [] }

  # -------------------------------------------------------------- course section
  - name: CourseSection
    parent: null
    common_fields: true
    fields:
      - { name: course_code, type: string, source: input, description: "Catalog code, e.g. JOUR-201" }
      - { name: title, type: string, source: input, description: "Section title" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; supplies the qualification_policy applied to this section's assignments" }
      - { name: term_id, type: string, source: input, description: "FK -> Term.id" }
      - { name: discipline_id, type: string, source: input, description: "FK -> DisciplineTaxonomy.id; the discipline the instructor must align to" }
      - { name: course_level, type: enum, source: input, description: "LOWER_DIVISION | UPPER_DIVISION | GRADUATE | DOCTORAL — maps to the required degree rank" }
      - { name: credit_hours, type: number, source: input, description: "Credit hours carried by this section; the unit of the faculty load ledger", constraints: "> 0" }
      - { name: delivery_mode, type: enum, source: input, description: "IN_PERSON | ONLINE_SYNC | ONLINE_ASYNC — ONLINE_ASYNC sections occupy no meeting interval" }
      - { name: building_code, type: string, source: input, description: "Building the section meets in; drives the 15-minute travel buffer. Required unless delivery_mode == ONLINE_ASYNC", default: null }
      - { name: meeting_days, type: array, source: input, description: "Array of MON|TUE|WED|THU|FRI|SAT|SUN; empty array required when delivery_mode == ONLINE_ASYNC", default: [] }
      - { name: meeting_start_minute, type: integer, source: input, description: "Meeting start as minutes from local midnight; null only when delivery_mode == ONLINE_ASYNC", default: null, constraints: "0 <= x <= 1439" }
      - { name: meeting_end_minute, type: integer, source: input, description: "Meeting end as minutes from local midnight, half-open upper bound; null only when delivery_mode == ONLINE_ASYNC", default: null, constraints: "meeting_start_minute < x <= 1440" }
      - { name: instructor_of_record_id, type: string, source: computed, description: "Mirrors CourseAssignment.faculty_member_id of this section's assignment with assignment_role == INSTRUCTOR_OF_RECORD and status NOT IN {SUPERSEDED, WITHDRAWN}; null when there is none", default: null }

  # ----------------------------------------------------------- course assignment
  - name: CourseAssignment
    parent: null
    common_fields: true
    fields:
      - { name: course_section_id, type: string, source: input, description: "FK -> CourseSection.id" }
      - { name: faculty_member_id, type: string, source: input, description: "FK -> FacultyMember.id" }
      - { name: assignment_role, type: enum, source: input, description: "INSTRUCTOR_OF_RECORD | CO_INSTRUCTOR — a second INSTRUCTOR_OF_RECORD supersedes the prior one" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED_QUALIFIED | EXCEPTION_FLAGGED | REMEDIATION_IN_PROGRESS | SUPERSEDED | WITHDRAWN", default: PENDING_VERIFICATION }
      - { name: qualification_basis, type: enum, source: computed, description: "TERMINAL_DEGREE | COURSEWORK_18_HOUR | TESTED_EXPERIENCE | NONE — how the instructor qualifies for this section", default: NONE }
      - { name: exception_code, type: enum, source: computed, description: "NO_OFFICIAL_TRANSCRIPT | FOREIGN_EVALUATION_MISSING | DEGREE_LEVEL_INSUFFICIENT | DISCIPLINE_MISALIGNED | DOSSIER_DEFICIENT; null unless status IN {EXCEPTION_FLAGGED, REMEDIATION_IN_PROGRESS}", default: null }
      - { name: alignment_score, type: number, source: computed, description: "0.0000–1.0000 discipline-alignment score from assignment_qualification_determination; informational and independent of status", default: 0.0 }
      - { name: remediation_action, type: enum, source: system, description: "REASSIGN_PENDING | TESTED_EXPERIENCE_PENDING | CREDENTIAL_UPDATE_PENDING; null unless status == REMEDIATION_IN_PROGRESS", default: null }
      - { name: superseded_by_assignment_id, type: string, source: system, description: "Mirrors CourseAssignment.id of the assignment that superseded this row; null unless status == SUPERSEDED", default: null }

  # ------------------------------------------- tested experience justification
  - name: TestedExperienceJustification
    parent: null
    common_fields: true
    fields:
      - { name: course_assignment_id, type: string, source: input, description: "FK -> CourseAssignment.id; the unqualified assignment this justification backs" }
      - { name: narrative, type: string, source: input, description: "Documented justification narrative" }
      - { name: alternative_credential_codes, type: array, source: input, description: "String array of documented alternative credentials; only distinct values count, capped at 4 by the score formula", default: [] }
      - { name: documented_years_experience, type: number, source: input, description: "Documented years of discipline-relevant professional experience", constraints: ">= 0" }
      - { name: industry_certification_level, type: enum, source: input, description: "NONE | PRACTITIONER | ADVANCED | BOARD_CERTIFIED" }
      - { name: supervisor_attestation_on_file, type: boolean, source: input, description: "True when the signed supervisor attestation document is on file; a hard precondition for approval", default: false }
      - { name: tested_experience_score, type: number, source: computed, description: "Output of tested_experience_score, 4 decimal places; recomputed on creation and on every SUBMITTED transition", default: 0.0 }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> UNDER_REVIEW -> APPROVED | REJECTED; REJECTED -> DRAFT; DRAFT | SUBMITTED -> WITHDRAWN", default: DRAFT }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the CredentialAnalyst who issued the APPROVED/REJECTED decision; anchors segregation of duties on roster certification", default: null }
      - { name: decision_rationale, type: string, source: system, description: "Free-text rationale captured with the decision", default: null }

  # ------------------------------------------------------------ faculty roster
  - name: FacultyRoster
    parent: null
    common_fields: true
    fields:
      - { name: term_id, type: string, source: input, description: "FK -> Term.id" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: status, type: enum, source: system, description: "DRAFT -> GENERATED -> CERTIFIED; CERTIFIED -> SUPERSEDED when a later roster is created for the same (program_id, term_id)", default: DRAFT }
      - { name: generation_epoch, type: integer, source: system, description: "Increments by 1 on every generate call only; snapshot recomputes triggered by cascades do NOT advance it", default: 0 }
      - { name: total_assignment_count, type: integer, source: computed, description: "Count of included assignments (see roster_snapshot_recompute input_set)", default: 0 }
      - { name: distinct_faculty_count, type: integer, source: computed, description: "Count of distinct faculty_member_id over included assignments", default: 0 }
      - { name: flagged_exception_count, type: integer, source: computed, description: "Count of included assignments with status IN {EXCEPTION_FLAGGED, REMEDIATION_IN_PROGRESS}", default: 0 }
      - { name: terminal_qualified_headcount, type: integer, source: computed, description: "Count of distinct faculty_member_id over included assignments with status == VERIFIED_QUALIFIED and qualification_basis IN {TERMINAL_DEGREE, COURSEWORK_18_HOUR}", default: 0 }
      - { name: credit_hours_total, type: number, source: computed, description: "Sum of CourseSection.credit_hours over included assignments", default: 0 }
      - { name: credit_hours_terminal_qualified, type: number, source: computed, description: "Sum of CourseSection.credit_hours over included assignments with status == VERIFIED_QUALIFIED and qualification_basis IN {TERMINAL_DEGREE, COURSEWORK_18_HOUR}", default: 0 }
      - { name: adequacy_ratio_snapshot, type: number, source: computed, description: "program_faculty_adequacy result under Program.adequacy_basis for (program_id, term_id), 4 decimal places", default: 0.0 }
      - { name: certification_readiness, type: enum, source: computed, description: "READY | BLOCKED — READY only when flagged_exception_count == 0 AND adequacy_ratio_snapshot >= Program.min_terminal_ratio AND every included faculty has dossier_status == VERIFIED", default: BLOCKED }
      - { name: blocking_reason_codes, type: array, source: computed, description: "Array drawn from {EXCEPTIONS_OUTSTANDING, ADEQUACY_BELOW_MINIMUM, DOSSIER_DEFICIENT}, appended in exactly that declared order by roster_snapshot_recompute; empty exactly when certification_readiness == READY", default: [] }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock instant of certification; null until CERTIFIED", default: null }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the certifying AccreditationLiaison; null until CERTIFIED", default: null }

  # ---------------------------------------------------------- faculty contract
  - name: FacultyContract
    parent: null
    common_fields: true
    fields:
      - { name: faculty_member_id, type: string, source: input, description: "FK -> FacultyMember.id" }
      - { name: term_id, type: string, source: input, description: "FK -> Term.id" }
      - { name: employment_class, type: enum, source: input, description: "Contracted class for this term; must equal FacultyMember.employment_class", constraints: "FULL_TIME | ADJUNCT | CLINICAL | GRADUATE_ASSISTANT" }
      - { name: contract_credit_hours, type: number, source: input, description: "Credit hours the contract commits", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ISSUED -> COUNTERSIGNED; ISSUED -> SUPERSEDED when a later contract is issued for the same (faculty_member_id, term_id); ISSUED | COUNTERSIGNED -> VOIDED", default: ISSUED }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant of issuance" }
      - { name: countersigned_at, type: datetime, source: system, description: "Logical-clock instant of countersignature; null until COUNTERSIGNED", default: null }
      - { name: dossier_snapshot_status, type: enum, source: system, description: "FacultyMember.dossier_status pinned at issuance (always VERIFIED, since issuance requires it)" }
      - { name: credential_snapshot_version, type: integer, source: system, description: "FacultyMember.version pinned at issuance; lets an auditor detect that the dossier moved after the contract was cut" }

  # ------------------------------------------------ professional development
  - name: ProfessionalDevelopmentRecord
    parent: null
    common_fields: true
    fields:
      - { name: faculty_member_id, type: string, source: input, description: "FK -> FacultyMember.id" }
      - { name: discipline_id, type: string, source: input, description: "FK -> DisciplineTaxonomy.id; the discipline of the activity, compared against the home program's discipline for relevance" }
      - { name: activity_type, type: enum, source: input, description: "CONFERENCE | CERTIFICATION | COURSEWORK | INDUSTRY_PLACEMENT | PUBLICATION" }
      - { name: contact_hours, type: number, source: input, description: "Documented contact hours", constraints: "> 0" }
      - { name: activity_date, type: datetime, source: input, description: "Date-only ISO 8601 date the activity concluded; must not be after the logical clock date" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> VERIFIED | REJECTED; only VERIFIED rows enter the compliance window", default: SUBMITTED }
      - { name: discipline_relevant, type: boolean, source: computed, description: "True when discipline_id == Program(FacultyMember.home_program_id).discipline_id OR DisciplineTaxonomy(discipline_id).parent_discipline_id == that program discipline", default: false }

  # --------------------------------------------------------- accreditor review
  - name: AccreditorReview
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: review_type, type: enum, source: input, description: "SUBSTANTIVE_CHANGE | COMPREHENSIVE | FOCUSED_FOLLOWUP" }
      - { name: window_start_date, type: datetime, source: input, description: "First day of the on-site review window, date-only ISO 8601; interval is FULLY CLOSED on both ends" }
      - { name: window_end_date, type: datetime, source: input, description: "Last day of the review window, date-only ISO 8601, inclusive", constraints: ">= window_start_date" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> IN_PROGRESS -> FINDINGS_ISSUED | REMEDIATION_REQUIRED; REMEDIATION_REQUIRED -> RESPONSE_SUBMITTED -> REMEDIATION_REQUIRED | CLOSED_ACCEPTED | CLOSED_SANCTION; FINDINGS_ISSUED -> CLOSED_ACCEPTED", default: SCHEDULED }
      - { name: finding_count, type: integer, source: system, description: "Number of findings the accreditor issues, captured verbatim from the findings submission (0 before findings). It is the branch selector — > 0 goes to REMEDIATION_REQUIRED, 0 goes to FINDINGS_ISSUED — and is deliberately INDEPENDENT of len(unqualified_assignment_ids): an accreditor may record documentation findings on a roster with zero unqualified assignments", default: 0, constraints: ">= 0" }
      - { name: unqualified_assignment_ids, type: array, source: computed, description: "CourseAssignment.id values in status PENDING_VERIFICATION, EXCEPTION_FLAGGED or REMEDIATION_IN_PROGRESS on the anchor roster, ordered by CourseAssignment.created_at ASC", default: [] }
      - { name: preliminary_risk_index, type: number, source: computed, description: "First-pass index (2 decimal places) from accreditor_review_risk_index; the tier is selected from THIS value, never from risk_index", default: 0.0 }
      - { name: risk_tier, type: enum, source: computed, description: "LOW | MODERATE | HIGH — selected from preliminary_risk_index only", default: LOW }
      - { name: risk_index, type: number, source: computed, description: "preliminary_risk_index * tier multiplier, capped at 100.00, 2 decimal places", default: 0.0 }
      - { name: response_due_date, type: datetime, source: computed, description: "Logical-clock date at findings issuance + tier response days; null before findings", default: null }
      - { name: response_round, type: integer, source: system, description: "Increments by 1 on every RESPONSE_SUBMITTED transition", default: 0 }
      - { name: response_narrative, type: string, source: system, description: "Narrative captured with the latest response submission", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # -------------------------------------------------------------- Term (linear)
  - entity: Term
    state_field: status
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: OPEN
        trigger: "POST /terms/{termId}/status with to_status=OPEN"
        actor: RegistrarOfficer
        preconditions: []
        side_effects: ["Term.version increments by 1"]
      - from: OPEN
        to: ROSTER_LOCKED
        trigger: "POST /terms/{termId}/status with to_status=ROSTER_LOCKED"
        actor: RegistrarOfficer
        preconditions: []
        side_effects:
          - "CourseSection creation and all CourseAssignment mutations for sections in this term are rejected with ERR_TERM_LOCKED"
          - "Term.version increments by 1"
      - from: ROSTER_LOCKED
        to: OPEN
        trigger: "POST /terms/{termId}/status with to_status=OPEN"
        actor: RegistrarOfficer
        preconditions: ["No FacultyRoster for this term has status == CERTIFIED (ERR_ROSTER_CERTIFIED)"]
        side_effects: ["Term.version increments by 1"]
        note: "Revision loop — lets the registrar reopen a term that was locked prematurely."
      - from: ROSTER_LOCKED
        to: CLOSED
        trigger: "POST /terms/{termId}/status with to_status=CLOSED"
        actor: RegistrarOfficer
        preconditions: ["Every FacultyRoster with this term_id has status IN {CERTIFIED, SUPERSEDED} (ERR_ROSTER_NOT_READY)"]
        side_effects:
          - "For every FacultyMember holding an assignment in this term, assigned_credit_hours is recomputed and drops this term's credit hours (the ledger excludes CLOSED terms); FacultyMember.version increments by 1 for each"
          - "Term.version increments by 1"

  # --------------------------------------- Program.launch_status (branch+cycle)
  - entity: Program
    state_field: launch_status
    initial_state: PLANNING
    terminal_states: [APPROVED_TO_LAUNCH]
    transitions:
      - from: PLANNING
        to: ADEQUACY_REVIEW
        trigger: "POST /programs/{programId}/launch-review"
        actor: ProgramDean
        preconditions:
          - "X-User-ID == programId (ERR_NOT_RESOURCE_OWNER)"
          - "A FacultyRoster exists for (programId, body.term_id) with status IN {GENERATED, CERTIFIED} (ERR_ROSTER_NOT_FOUND)"
        side_effects:
          - "program_faculty_adequacy is recomputed from that roster and written to adequacy_ratio / adequacy_status / adequacy_term_id"
          - "Program.version increments by 1"
      - from: ADEQUACY_REVIEW
        to: APPROVED_TO_LAUNCH
        trigger: "POST /programs/{programId}/launch-decision with decision=APPROVE"
        actor: AccreditationLiaison
        preconditions:
          - "Program.adequacy_status == ADEQUATE (ERR_PROGRAM_ADEQUACY_INSUFFICIENT)"
          - "If is_substantive_change == true, an AccreditorReview with review_type == SUBSTANTIVE_CHANGE and status == CLOSED_ACCEPTED exists for this program (ERR_INVALID_STATE)"
        side_effects: ["Program.version increments by 1"]
      - from: ADEQUACY_REVIEW
        to: ADEQUACY_DENIED
        trigger: "POST /programs/{programId}/launch-decision with decision=DENY"
        actor: AccreditationLiaison
        preconditions: []
        side_effects: ["Program.version increments by 1"]
      - from: ADEQUACY_DENIED
        to: ADEQUACY_REVIEW
        trigger: "POST /programs/{programId}/launch-review"
        actor: ProgramDean
        preconditions:
          - "X-User-ID == programId (ERR_NOT_RESOURCE_OWNER)"
          - "A FacultyRoster exists for (programId, body.term_id) with status IN {GENERATED, CERTIFIED} (ERR_ROSTER_NOT_FOUND)"
        side_effects:
          - "program_faculty_adequacy is recomputed and rewritten"
          - "Program.version increments by 1"
        note: "Revision loop — a denied program re-enters review after remediating its roster."

  # ------------------------- CredentialRecord.transcript_status (linear/forked)
  - entity: CredentialRecord
    state_field: transcript_status
    initial_state: NOT_REQUESTED
    terminal_states: [OFFICIAL_RECEIVED]
    transitions:
      - from: NOT_REQUESTED
        to: REQUESTED
        trigger: "POST /credential-records/{credentialRecordId}/transcript with transcript_status=REQUESTED"
        actor: RegistrarOfficer
        preconditions: []
        side_effects: ["CredentialRecord.version increments by 1"]
      - from: NOT_REQUESTED
        to: UNOFFICIAL_ONLY
        trigger: "POST /credential-records/{credentialRecordId}/transcript with transcript_status=UNOFFICIAL_ONLY"
        actor: RegistrarOfficer
        preconditions: []
        side_effects: ["faculty_dossier_recompute runs; TRANSCRIPT_NOT_OFFICIAL may enter deficiency_codes", "CredentialRecord.version and FacultyMember.version increment by 1"]
      - from: REQUESTED
        to: UNOFFICIAL_ONLY
        trigger: "POST /credential-records/{credentialRecordId}/transcript with transcript_status=UNOFFICIAL_ONLY"
        actor: RegistrarOfficer
        preconditions: []
        side_effects: ["faculty_dossier_recompute runs", "CredentialRecord.version and FacultyMember.version increment by 1"]
      - from: NOT_REQUESTED
        to: OFFICIAL_RECEIVED
        trigger: "POST /credential-records/{credentialRecordId}/transcript with transcript_status=OFFICIAL_RECEIVED"
        actor: RegistrarOfficer
        preconditions: []
        side_effects: ["faculty_dossier_recompute runs", "CredentialRecord.version and FacultyMember.version increment by 1"]
      - from: REQUESTED
        to: OFFICIAL_RECEIVED
        trigger: "POST /credential-records/{credentialRecordId}/transcript with transcript_status=OFFICIAL_RECEIVED"
        actor: RegistrarOfficer
        preconditions: []
        side_effects: ["faculty_dossier_recompute runs", "CredentialRecord.version and FacultyMember.version increment by 1"]
      - from: UNOFFICIAL_ONLY
        to: OFFICIAL_RECEIVED
        trigger: "POST /credential-records/{credentialRecordId}/transcript with transcript_status=OFFICIAL_RECEIVED"
        actor: RegistrarOfficer
        preconditions: []
        side_effects: ["faculty_dossier_recompute runs; TRANSCRIPT_NOT_OFFICIAL leaves deficiency_codes", "CredentialRecord.version and FacultyMember.version increment by 1"]

  # ------------------------------------ CredentialRecord.verification_status
  - entity: CredentialRecord
    state_field: verification_status
    initial_state: PENDING
    terminal_states: [REJECTED, REPUDIATED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /credential-records/{credentialRecordId}/verification with decision=VERIFY"
        actor: CredentialAnalyst
        preconditions: ["transcript_status IN {UNOFFICIAL_ONLY, OFFICIAL_RECEIVED} (ERR_INVALID_STATE)"]
        side_effects:
          - "verified_by_user_id = acting X-User-ID"
          - "faculty_dossier_recompute runs; when deficiency_codes becomes empty, dossier_status moves to VERIFIED and — if appointment_status == PROSPECT — appointment_status moves to CREDENTIALED_ELIGIBLE"
          - "CredentialRecord.version and FacultyMember.version increment by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /credential-records/{credentialRecordId}/verification with decision=REJECT"
        actor: CredentialAnalyst
        preconditions: []
        side_effects:
          - "verified_by_user_id = acting X-User-ID"
          - "faculty_dossier_recompute runs; REJECTED records are excluded from the dossier evidence set entirely"
          - "CredentialRecord.version and FacultyMember.version increment by 1"
      - from: VERIFIED
        to: REPUDIATED
        trigger: "POST /credential-records/{credentialRecordId}/verification with decision=REPUDIATE"
        actor: CredentialAnalyst
        preconditions: []
        side_effects:
          - "verified_by_user_id = acting X-User-ID"
          - "CASCADE-A HOP 1 — faculty_dossier_recompute runs for this record's faculty_member_id: CREDENTIAL_REPUDIATED enters deficiency_codes and dossier_status moves VERIFIED -> DEFICIENT"
          - "CASCADE-A HOP 2 — because dossier_status became DEFICIENT, every CourseAssignment of that faculty with status IN {PENDING_VERIFICATION, VERIFIED_QUALIFIED}, whose CourseSection.term_id has Term.status != CLOSED and whose (program_id, term_id) FacultyRoster is not CERTIFIED, moves to EXCEPTION_FLAGGED with exception_code = DOSSIER_DEFICIENT; assigned_credit_hours is unchanged because those assignments still occupy load"
          - "CASCADE-A HOP 3 — because those assignments changed status, roster_snapshot_recompute runs on every FacultyRoster with status == GENERATED that includes them: flagged_exception_count rises, blocking_reason_codes gains DOSSIER_DEFICIENT and EXCEPTIONS_OUTSTANDING, certification_readiness becomes BLOCKED; generation_epoch is NOT advanced"
          - "CASCADE-A HOP 4 — because those rosters recomputed, each affected Program has adequacy_ratio, adequacy_status, adequacy_term_id and unqualified_assignment_count rewritten from the roster snapshot"
          - "CASCADE-A HOP 5 — because a Program's adequacy fields were rewritten and the program is no longer clean (adequacy_status != ADEQUATE or unqualified_assignment_count > 0), every AccreditorReview of that program with status == RESPONSE_SUBMITTED returns to REMEDIATION_REQUIRED, its risk metrics are recomputed from the current anchor roster and response_due_date = clock date + tier response days; response_round is unchanged"
          - "CredentialRecord.version, FacultyMember.version and the version of every touched CourseAssignment / FacultyRoster / Program / AccreditorReview increment by 1"
        note: "Depth-5 transitive cascade. appointment_status is deliberately NOT touched — the two FacultyMember dimensions are independent."

  # ------------------------------- FacultyMember.dossier_status (derived dim 1)
  - entity: FacultyMember
    state_field: dossier_status
    initial_state: INCOMPLETE
    terminal_states: []
    transitions:
      - from: INCOMPLETE
        to: UNDER_REVIEW
        trigger: "system — faculty_dossier_recompute after POST /credential-records creates the faculty's first non-REJECTED record"
        actor: system
        preconditions: ["At least one CredentialRecord with verification_status == PENDING exists"]
        side_effects: ["deficiency_codes rewritten", "FacultyMember.version increments by 1"]
      - from: UNDER_REVIEW
        to: VERIFIED
        trigger: "system — faculty_dossier_recompute after a verification / transcript / evaluation event leaves deficiency_codes empty"
        actor: system
        preconditions: ["deficiency_codes == [] after recompute"]
        side_effects:
          - "deficiency_codes = []"
          - "If appointment_status == PROSPECT it moves to CREDENTIALED_ELIGIBLE in the same request"
          - "FacultyMember.version increments by 1"
      - from: UNDER_REVIEW
        to: DEFICIENT
        trigger: "system — faculty_dossier_recompute when no CredentialRecord is PENDING any more and deficiency_codes is non-empty"
        actor: system
        preconditions: ["No CredentialRecord with verification_status == PENDING AND deficiency_codes != []"]
        side_effects: ["deficiency_codes rewritten", "FacultyMember.version increments by 1"]
      - from: VERIFIED
        to: DEFICIENT
        trigger: "system — CASCADE-A HOP 1 (record repudiation) or an OFFICIAL_RECEIVED record losing its foreign-evaluation support"
        actor: system
        preconditions: ["deficiency_codes != [] after recompute AND no CredentialRecord is PENDING"]
        side_effects:
          - "deficiency_codes gains CREDENTIAL_REPUDIATED and/or FOREIGN_EVALUATION_INCOMPLETE"
          - "appointment_status is NOT changed — an already CONTRACTED faculty stays CONTRACTED, which is precisely the exception the accreditor reads"
          - "FacultyMember.version increments by 1"
      - from: DEFICIENT
        to: UNDER_REVIEW
        trigger: "system — faculty_dossier_recompute after POST /credential-records adds a replacement record in PENDING"
        actor: system
        preconditions: ["At least one CredentialRecord with verification_status == PENDING exists"]
        side_effects: ["FacultyMember.version increments by 1"]
      - from: DEFICIENT
        to: VERIFIED
        trigger: "system — faculty_dossier_recompute after the deficiency is cured (evaluation COMPLETED + EQUIVALENT, or transcript upgraded to OFFICIAL_RECEIVED)"
        actor: system
        preconditions: ["deficiency_codes == [] after recompute"]
        side_effects: ["If appointment_status == PROSPECT it moves to CREDENTIALED_ELIGIBLE", "FacultyMember.version increments by 1"]

  # --------------------------- FacultyMember.appointment_status (parallel dim 2)
  - entity: FacultyMember
    state_field: appointment_status
    initial_state: PROSPECT
    terminal_states: [SEPARATED]
    transitions:
      - from: PROSPECT
        to: CREDENTIALED_ELIGIBLE
        trigger: "system — the first time dossier_status becomes VERIFIED"
        actor: system
        preconditions: ["dossier_status == VERIFIED"]
        side_effects: ["FacultyMember.version increments by 1"]
      - from: CREDENTIALED_ELIGIBLE
        to: CONTRACTED
        trigger: "POST /faculty-contracts/{contractId}/countersignature"
        actor: Instructor
        preconditions: ["The contract's status == ISSUED (ERR_INVALID_STATE)", "X-User-ID == contract.faculty_member_id (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["FacultyContract.status = COUNTERSIGNED, countersigned_at = clock", "FacultyMember.version and FacultyContract.version increment by 1"]
      - from: CONTRACTED
        to: CREDENTIALED_ELIGIBLE
        trigger: "POST /faculty-contracts/{contractId}/void on the faculty's last non-VOIDED contract"
        actor: ProgramDean
        preconditions: ["No other FacultyContract for this faculty has status IN {ISSUED, COUNTERSIGNED} after the void"]
        side_effects: ["Compensation — the appointment reverts exactly to CREDENTIALED_ELIGIBLE, never to PROSPECT", "FacultyMember.version and FacultyContract.version increment by 1"]
      - from: PROSPECT
        to: SEPARATED
        trigger: "POST /faculty-members/{facultyMemberId}/separation"
        actor: RegistrarOfficer
        preconditions: []
        side_effects: ["FacultyMember.version increments by 1"]
      - from: CREDENTIALED_ELIGIBLE
        to: SEPARATED
        trigger: "POST /faculty-members/{facultyMemberId}/separation"
        actor: RegistrarOfficer
        preconditions: ["No CourseAssignment of this faculty in status IN {PENDING_VERIFICATION, VERIFIED_QUALIFIED, EXCEPTION_FLAGGED, REMEDIATION_IN_PROGRESS} belongs to a (program, term) whose FacultyRoster is CERTIFIED (ERR_ROSTER_CERTIFIED)"]
        side_effects:
          - "CASCADE-C HOP 1 — every CourseAssignment of this faculty in status IN {PENDING_VERIFICATION, VERIFIED_QUALIFIED, EXCEPTION_FLAGGED, REMEDIATION_IN_PROGRESS} moves to WITHDRAWN"
          - "CASCADE-C HOP 2 — because those assignments left the ledger set, assigned_credit_hours becomes 0 and every CourseSection whose instructor_of_record_id pointed at this faculty resets it to null"
          - "CASCADE-C HOP 3 — because assignments were withdrawn, roster_snapshot_recompute runs on every GENERATED FacultyRoster that included them and each affected Program is rewritten"
          - "Every ISSUED or COUNTERSIGNED FacultyContract of this faculty moves to VOIDED"
          - "FacultyMember.version and the version of every touched entity increment by 1"
      - from: CONTRACTED
        to: SEPARATED
        trigger: "POST /faculty-members/{facultyMemberId}/separation"
        actor: RegistrarOfficer
        preconditions: ["No CourseAssignment of this faculty in status IN {PENDING_VERIFICATION, VERIFIED_QUALIFIED, EXCEPTION_FLAGGED, REMEDIATION_IN_PROGRESS} belongs to a (program, term) whose FacultyRoster is CERTIFIED (ERR_ROSTER_CERTIFIED)"]
        side_effects: ["Identical CASCADE-C hops as CREDENTIALED_ELIGIBLE -> SEPARATED"]

  # ------------------------------------------------- CredentialEvaluation
  - entity: CredentialEvaluation
    state_field: status
    initial_state: ORDERED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: ORDERED
        to: IN_REVIEW
        trigger: "POST /credential-evaluations/{evaluationId}/status with to_status=IN_REVIEW"
        actor: CredentialAnalyst
        preconditions: []
        side_effects: ["billed program's budget_reserved_cents is unchanged (ORDERED and IN_REVIEW both reserve)", "CredentialEvaluation.version increments by 1"]
      - from: IN_REVIEW
        to: COMPLETED
        trigger: "POST /credential-evaluations/{evaluationId}/status with to_status=COMPLETED"
        actor: CredentialAnalyst
        preconditions:
          - "equivalency_degree_level, equivalency_discipline_id and equivalency_verdict are all present in the body (ERR_INVALID_REQUEST)"
          - "equivalency_discipline_id references an existing DisciplineTaxonomy (ERR_DISCIPLINE_NOT_FOUND)"
        side_effects:
          - "billed_program.budget_reserved_cents decreases by fee_cents"
          - "evaluation_cost_allocation runs; allocation_shares is written and every receiving Program's budget_spent_cents increases by its share_cents"
          - "The underlying CredentialRecord's effective_degree_level / effective_discipline_id are rewritten when equivalency_verdict == EQUIVALENT"
          - "faculty_dossier_recompute runs; FOREIGN_EVALUATION_INCOMPLETE leaves deficiency_codes when the verdict is EQUIVALENT and dossier_status may move to VERIFIED"
          - "CredentialEvaluation.version, CredentialRecord.version, FacultyMember.version and every touched Program.version increment by 1"
      - from: ORDERED
        to: VOIDED
        trigger: "POST /credential-evaluations/{evaluationId}/status with to_status=VOIDED"
        actor: CredentialAnalyst
        preconditions: []
        side_effects:
          - "Compensation — billed_program.budget_reserved_cents decreases by fee_cents, returning it to its exact pre-order value; budget_spent_cents is untouched"
          - "CredentialEvaluation.version and Program.version increment by 1"
      - from: IN_REVIEW
        to: VOIDED
        trigger: "POST /credential-evaluations/{evaluationId}/status with to_status=VOIDED"
        actor: CredentialAnalyst
        preconditions: []
        side_effects: ["Identical compensation as ORDERED -> VOIDED"]

  # -------------------------------------------------- CourseAssignment (cyclic)
  - entity: CourseAssignment
    state_field: status
    initial_state: PENDING_VERIFICATION
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED_QUALIFIED
        trigger: "POST /course-assignments (immediate determination) or POST /faculty-rosters/{rosterId}/generate"
        actor: system
        preconditions: ["assignment_qualification_determination returns qualified == true"]
        side_effects:
          - "qualification_basis = TERMINAL_DEGREE or COURSEWORK_18_HOUR, exception_code = null, alignment_score written"
          - "FacultyMember.assigned_credit_hours already includes this section's credit_hours from creation and does not change"
          - "CourseAssignment.version increments by 1 when the determination happens after creation"
      - from: PENDING_VERIFICATION
        to: EXCEPTION_FLAGGED
        trigger: "POST /course-assignments (immediate determination) or POST /faculty-rosters/{rosterId}/generate"
        actor: system
        preconditions: ["assignment_qualification_determination returns qualified == false"]
        side_effects:
          - "exception_code set per the precedence order in assignment_qualification_determination, alignment_score written"
          - "Owning Program.unqualified_assignment_count increases by 1"
      - from: VERIFIED_QUALIFIED
        to: EXCEPTION_FLAGGED
        trigger: "system — CASCADE-A HOP 2, or POST /faculty-rosters/{rosterId}/generate re-running the determination after credential evidence changed"
        actor: system
        preconditions: ["The assignment's (program_id, term_id) FacultyRoster is not CERTIFIED (ERR_ROSTER_CERTIFIED)"]
        side_effects:
          - "exception_code set (DOSSIER_DEFICIENT for the cascade path)"
          - "Owning Program.unqualified_assignment_count increases by 1 and the covering GENERATED roster recomputes"
      - from: EXCEPTION_FLAGGED
        to: REMEDIATION_IN_PROGRESS
        trigger: "POST /course-assignments/{assignmentId}/remediation, or POST /accreditor-reviews/{reviewId}/findings"
        actor: ProgramDean
        preconditions:
          - "X-User-ID == CourseSection.program_id when the actor is ProgramDean (ERR_NOT_RESOURCE_OWNER)"
          - "Term.status IN {OPEN, ROSTER_LOCKED} (ERR_TERM_LOCKED)"
        side_effects:
          - "remediation_action set from the request body (or REASSIGN_PENDING when driven by findings issuance)"
          - "Covering GENERATED roster recomputes: flagged_exception_count is unchanged, but accreditor_review_risk_index now counts this assignment in exception_persistence"
      - from: REMEDIATION_IN_PROGRESS
        to: VERIFIED_QUALIFIED
        trigger: "POST /course-assignments/{assignmentId}/reverification, or CASCADE-B HOP 1 (justification APPROVED)"
        actor: CredentialAnalyst
        preconditions: ["assignment_qualification_determination returns qualified == true, or an APPROVED TestedExperienceJustification exists for this assignment"]
        side_effects:
          - "qualification_basis = TERMINAL_DEGREE / COURSEWORK_18_HOUR / TESTED_EXPERIENCE, exception_code = null, remediation_action = null"
          - "Covering GENERATED roster recomputes: flagged_exception_count decreases by 1; adequacy_ratio_snapshot rises only when the basis is NOT TESTED_EXPERIENCE"
          - "Owning Program.unqualified_assignment_count decreases by 1"
        note: "Closes the VERIFIED_QUALIFIED -> EXCEPTION_FLAGGED -> REMEDIATION_IN_PROGRESS -> VERIFIED_QUALIFIED cycle."
      - from: REMEDIATION_IN_PROGRESS
        to: EXCEPTION_FLAGGED
        trigger: "POST /course-assignments/{assignmentId}/reverification"
        actor: CredentialAnalyst
        preconditions: ["assignment_qualification_determination still returns qualified == false and no APPROVED TestedExperienceJustification exists"]
        side_effects: ["remediation_action = null, exception_code recomputed", "Covering GENERATED roster recomputes"]
      - from: PENDING_VERIFICATION
        to: SUPERSEDED
        trigger: "system — POST /course-assignments creates a newer INSTRUCTOR_OF_RECORD assignment for the same section"
        actor: system
        preconditions: ["The new assignment's assignment_role == INSTRUCTOR_OF_RECORD and this row's assignment_role == INSTRUCTOR_OF_RECORD"]
        side_effects:
          - "superseded_by_assignment_id = the new assignment's id"
          - "FacultyMember.assigned_credit_hours for the superseded instructor decreases by CourseSection.credit_hours"
          - "CourseSection.instructor_of_record_id now mirrors the new assignment's faculty_member_id"
      - from: VERIFIED_QUALIFIED
        to: SUPERSEDED
        trigger: "system — POST /course-assignments creates a newer INSTRUCTOR_OF_RECORD assignment for the same section"
        actor: system
        preconditions: ["Same as above"]
        side_effects: ["Same as above, plus the covering GENERATED roster recomputes"]
      - from: EXCEPTION_FLAGGED
        to: SUPERSEDED
        trigger: "system — POST /course-assignments creates a newer INSTRUCTOR_OF_RECORD assignment for the same section"
        actor: system
        preconditions: ["Same as above"]
        side_effects: ["Same as above, plus Program.unqualified_assignment_count decreases by 1 and the covering GENERATED roster recomputes"]
      - from: REMEDIATION_IN_PROGRESS
        to: SUPERSEDED
        trigger: "system — POST /course-assignments creates a newer INSTRUCTOR_OF_RECORD assignment for the same section"
        actor: system
        preconditions: ["Same as above"]
        side_effects: ["Same as above; any SUBMITTED or UNDER_REVIEW TestedExperienceJustification for this assignment moves to WITHDRAWN"]
      - from: PENDING_VERIFICATION
        to: WITHDRAWN
        trigger: "POST /course-assignments/{assignmentId}/withdrawal, or CASCADE-C HOP 1 (faculty separation)"
        actor: ProgramDean
        preconditions:
          - "X-User-ID == CourseSection.program_id when the actor is ProgramDean (ERR_NOT_RESOURCE_OWNER)"
          - "Term.status IN {OPEN, ROSTER_LOCKED} (ERR_TERM_LOCKED)"
          - "The covering FacultyRoster is not CERTIFIED (ERR_ROSTER_CERTIFIED)"
          - "The program has no AccreditorReview in status IN {IN_PROGRESS, FINDINGS_ISSUED, REMEDIATION_REQUIRED} whose closed window contains the clock date (ERR_ACCREDITOR_REVIEW_LOCKOUT)"
        side_effects:
          - "Compensation — FacultyMember.assigned_credit_hours decreases by exactly CourseSection.credit_hours, restoring the pre-creation value"
          - "CourseSection.instructor_of_record_id resets to null when this row held it"
      - from: VERIFIED_QUALIFIED
        to: WITHDRAWN
        trigger: "POST /course-assignments/{assignmentId}/withdrawal, or CASCADE-C HOP 1"
        actor: ProgramDean
        preconditions: ["Same as PENDING_VERIFICATION -> WITHDRAWN"]
        side_effects: ["Same compensation, plus the covering GENERATED roster recomputes and the Program is rewritten"]
      - from: EXCEPTION_FLAGGED
        to: WITHDRAWN
        trigger: "POST /course-assignments/{assignmentId}/withdrawal, or CASCADE-C HOP 1"
        actor: ProgramDean
        preconditions: ["Same as PENDING_VERIFICATION -> WITHDRAWN"]
        side_effects: ["Same compensation, plus Program.unqualified_assignment_count decreases by 1 and the covering roster recomputes"]
      - from: REMEDIATION_IN_PROGRESS
        to: WITHDRAWN
        trigger: "POST /course-assignments/{assignmentId}/withdrawal, or CASCADE-C HOP 1"
        actor: ProgramDean
        preconditions: ["Same as PENDING_VERIFICATION -> WITHDRAWN"]
        side_effects: ["Same compensation; any SUBMITTED or UNDER_REVIEW TestedExperienceJustification for this assignment moves to WITHDRAWN"]

  # ----------------------------- TestedExperienceJustification (branch + cycle)
  - entity: TestedExperienceJustification
    state_field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tested-experience-justifications/{justificationId}/status with to_status=SUBMITTED"
        actor: ProgramDean
        preconditions:
          - "X-User-ID == CourseSection.program_id of the backed assignment (ERR_NOT_RESOURCE_OWNER)"
          - "The backed CourseAssignment.status IN {EXCEPTION_FLAGGED, REMEDIATION_IN_PROGRESS} (ERR_INVALID_STATE)"
        side_effects: ["tested_experience_score recomputed from the current field values", "version increments by 1"]
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /tested-experience-justifications/{justificationId}/review"
        actor: CredentialAnalyst
        preconditions: []
        side_effects: ["version increments by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /tested-experience-justifications/{justificationId}/decision with decision=APPROVE"
        actor: CredentialAnalyst
        preconditions:
          - "supervisor_attestation_on_file == true (ERR_ATTESTATION_MISSING)"
          - "documented_years_experience >= 3 AND tested_experience_score >= 0.70 (ERR_TESTED_EXPERIENCE_INSUFFICIENT)"
          - "X-User-ID != verified_by_user_id of every CredentialRecord of the backed assignment's faculty (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id = acting X-User-ID, decision_rationale stored"
          - "CASCADE-B HOP 1 — the backed CourseAssignment moves to VERIFIED_QUALIFIED with qualification_basis = TESTED_EXPERIENCE, exception_code = null, remediation_action = null"
          - "CASCADE-B HOP 2 — because that assignment left the exception set, roster_snapshot_recompute runs on the covering GENERATED FacultyRoster: flagged_exception_count decreases by 1 while adequacy_ratio_snapshot does NOT rise, because TESTED_EXPERIENCE is excluded from the qualified numerator"
          - "CASCADE-B HOP 3 — because the roster snapshot changed, Program.adequacy_ratio / adequacy_status / unqualified_assignment_count are rewritten and blocking_reason_codes may keep ADEQUACY_BELOW_MINIMUM, leaving certification_readiness BLOCKED with zero exceptions"
          - "version increments by 1 on the justification, the assignment, the roster and the program"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /tested-experience-justifications/{justificationId}/decision with decision=REJECT"
        actor: CredentialAnalyst
        preconditions: ["X-User-ID != verified_by_user_id of every CredentialRecord of the backed assignment's faculty (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects:
          - "decided_by_user_id = acting X-User-ID, decision_rationale stored"
          - "The backed CourseAssignment is NOT touched — it stays in REMEDIATION_IN_PROGRESS or EXCEPTION_FLAGGED, and no roster or program recompute occurs"
          - "version increments by 1"
        note: "Divergent branch — the APPROVE arm fires a three-hop cascade, the REJECT arm fires none."
      - from: REJECTED
        to: DRAFT
        trigger: "POST /tested-experience-justifications/{justificationId}/status with to_status=SUBMITTED is rejected; the dean instead re-opens with POST /tested-experience-justifications/{justificationId}/revision"
        actor: ProgramDean
        preconditions: ["X-User-ID == CourseSection.program_id of the backed assignment (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["decided_by_user_id and decision_rationale reset to null", "version increments by 1"]
        note: "Revision loop — a rejected justification returns to DRAFT so the dean can add credentials and resubmit."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /tested-experience-justifications/{justificationId}/status with to_status=WITHDRAWN"
        actor: ProgramDean
        preconditions: ["X-User-ID == CourseSection.program_id of the backed assignment (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["version increments by 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /tested-experience-justifications/{justificationId}/status with to_status=WITHDRAWN, or the backed assignment moving to SUPERSEDED / WITHDRAWN"
        actor: ProgramDean
        preconditions: ["X-User-ID == CourseSection.program_id of the backed assignment when driven by the API (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["version increments by 1"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "system — the backed assignment moves to SUPERSEDED or WITHDRAWN"
        actor: system
        preconditions: []
        side_effects: ["version increments by 1"]

  # ---------------------------------------------- FacultyRoster (self-cycle)
  - entity: FacultyRoster
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: GENERATED
        trigger: "POST /faculty-rosters/{rosterId}/generate"
        actor: AccreditationLiaison
        preconditions: ["Term.status IN {OPEN, ROSTER_LOCKED} (ERR_TERM_LOCKED)"]
        side_effects:
          - "generation_epoch increases by 1"
          - "Every included assignment in PENDING_VERIFICATION is decided by assignment_qualification_determination; every EXCEPTION_FLAGGED assignment is re-evaluated and returns to VERIFIED_QUALIFIED when the evidence now passes; REMEDIATION_IN_PROGRESS assignments are left untouched"
          - "roster_snapshot_recompute writes all snapshot fields, certification_readiness and blocking_reason_codes"
          - "Program.adequacy_ratio / adequacy_status / adequacy_term_id / unqualified_assignment_count are rewritten"
          - "FacultyRoster.version, each touched CourseAssignment.version and Program.version increment by 1"
      - from: GENERATED
        to: GENERATED
        trigger: "POST /faculty-rosters/{rosterId}/generate"
        actor: AccreditationLiaison
        preconditions: ["Term.status IN {OPEN, ROSTER_LOCKED} (ERR_TERM_LOCKED)"]
        side_effects: ["Identical to DRAFT -> GENERATED; generation_epoch increases by 1 on every call"]
        note: "Self-cycle — regeneration is the operator's normal reconciliation loop."
      - from: GENERATED
        to: CERTIFIED
        trigger: "POST /faculty-rosters/{rosterId}/certification"
        actor: AccreditationLiaison
        preconditions:
          - "certification_readiness == READY (ERR_ROSTER_NOT_READY)"
          - "Term.status IN {OPEN, ROSTER_LOCKED} (ERR_TERM_LOCKED)"
          - "The program has no AccreditorReview with status == REMEDIATION_REQUIRED (ERR_INVALID_STATE)"
          - "X-User-ID != decided_by_user_id of every TestedExperienceJustification whose backed assignment is included in this roster (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "certified_at = clock instant, certified_by_user_id = acting X-User-ID"
          - "Every included CourseAssignment becomes immutable: withdrawal, remediation and reverification are rejected with ERR_ROSTER_CERTIFIED"
          - "FacultyRoster.version increments by 1"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "system — POST /faculty-rosters creates a new roster for the same (program_id, term_id)"
        actual_actor: system
        actor: system
        preconditions: []
        side_effects:
          - "The new roster is created in DRAFT with generation_epoch 0"
          - "Assignments included in the superseded roster become mutable again"
          - "FacultyRoster.version increments by 1"

  # ------------------------------------------------- FacultyContract
  - entity: FacultyContract
    state_field: status
    initial_state: ISSUED
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: ISSUED
        to: COUNTERSIGNED
        trigger: "POST /faculty-contracts/{contractId}/countersignature"
        actor: Instructor
        preconditions: ["X-User-ID == faculty_member_id (ERR_NOT_RESOURCE_OWNER)", "FacultyMember.appointment_status != SEPARATED (ERR_FACULTY_SEPARATED)"]
        side_effects: ["countersigned_at = clock", "FacultyMember.appointment_status moves CREDENTIALED_ELIGIBLE -> CONTRACTED", "FacultyContract.version and FacultyMember.version increment by 1"]
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system — POST /faculty-contracts issues a newer contract for the same (faculty_member_id, term_id)"
        actor: system
        preconditions: []
        side_effects: ["FacultyContract.version increments by 1"]
      - from: ISSUED
        to: VOIDED
        trigger: "POST /faculty-contracts/{contractId}/void"
        actor: ProgramDean
        preconditions: ["X-User-ID == FacultyMember.home_program_id (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["FacultyContract.version increments by 1"]
      - from: COUNTERSIGNED
        to: VOIDED
        trigger: "POST /faculty-contracts/{contractId}/void"
        actor: ProgramDean
        preconditions: ["X-User-ID == FacultyMember.home_program_id (ERR_NOT_RESOURCE_OWNER)"]
        side_effects:
          - "Compensation — when no other FacultyContract of this faculty remains in {ISSUED, COUNTERSIGNED}, appointment_status returns to CREDENTIALED_ELIGIBLE"
          - "FacultyContract.version and FacultyMember.version increment by 1"

  # ------------------------------------- ProfessionalDevelopmentRecord (linear)
  - entity: ProfessionalDevelopmentRecord
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /pd-records/{pdRecordId}/status with to_status=VERIFIED"
        actor: CredentialAnalyst
        preconditions: []
        side_effects:
          - "professional_development_compliance re-runs for the faculty: pd_hours_current_cycle and pd_compliant are rewritten"
          - "ProfessionalDevelopmentRecord.version and FacultyMember.version increment by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /pd-records/{pdRecordId}/status with to_status=REJECTED"
        actor: CredentialAnalyst
        preconditions: []
        side_effects: ["The record never enters the compliance window; pd_hours_current_cycle is unchanged", "version increments by 1"]

  # ------------------------------------- AccreditorReview (branch + cycle)
  - entity: AccreditorReview
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED_ACCEPTED, CLOSED_SANCTION]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /accreditor-reviews/{reviewId}/status with to_status=IN_PROGRESS"
        actor: AccreditorReviewer
        preconditions: ["clock date >= window_start_date (ERR_INVALID_WINDOW)"]
        side_effects:
          - "The program enters accreditor lockout: CourseAssignment creation and withdrawal, and CredentialEvaluation ordering billed to that program, are rejected with ERR_ACCREDITOR_REVIEW_LOCKOUT while the clock date lies inside the closed window"
          - "AccreditorReview.version increments by 1"
      - from: IN_PROGRESS
        to: REMEDIATION_REQUIRED
        trigger: "POST /accreditor-reviews/{reviewId}/findings when finding_count > 0"
        actor: AccreditorReviewer
        preconditions: ["A FacultyRoster with status IN {GENERATED, CERTIFIED} exists for the program (ERR_ROSTER_NOT_FOUND)"]
        side_effects:
          - "unqualified_assignment_ids, finding_count, preliminary_risk_index, risk_tier, risk_index and response_due_date are written from the state observed BEFORE the remediation cascade below"
          - "Every listed assignment in EXCEPTION_FLAGGED moves to REMEDIATION_IN_PROGRESS with remediation_action = REASSIGN_PENDING"
          - "The anchor roster recomputes (flagged_exception_count unchanged) and the Program is rewritten"
          - "AccreditorReview.version and each touched CourseAssignment / FacultyRoster / Program version increment by 1"
      - from: IN_PROGRESS
        to: FINDINGS_ISSUED
        trigger: "POST /accreditor-reviews/{reviewId}/findings when finding_count == 0"
        actor: AccreditorReviewer
        preconditions: ["A FacultyRoster with status IN {GENERATED, CERTIFIED} exists for the program (ERR_ROSTER_NOT_FOUND)"]
        side_effects:
          - "Risk metrics are written; response_due_date is written from the LOW/MODERATE/HIGH tier as usual"
          - "No remediation cascade fires — this is the clean-review branch"
          - "AccreditorReview.version increments by 1"
      - from: FINDINGS_ISSUED
        to: CLOSED_ACCEPTED
        trigger: "POST /accreditor-reviews/{reviewId}/status with to_status=CLOSED_ACCEPTED"
        actor: AccreditorReviewer
        preconditions: ["Program.adequacy_status == ADEQUATE AND Program.unqualified_assignment_count == 0 (ERR_PROGRAM_ADEQUACY_INSUFFICIENT)"]
        side_effects: ["Lockout ends", "AccreditorReview.version increments by 1"]
      - from: REMEDIATION_REQUIRED
        to: RESPONSE_SUBMITTED
        trigger: "POST /accreditor-reviews/{reviewId}/response"
        actor: AccreditationLiaison
        preconditions: ["clock date <= response_due_date (ERR_RESPONSE_WINDOW_CLOSED)"]
        side_effects: ["response_round increases by 1, response_narrative stored", "AccreditorReview.version increments by 1"]
      - from: RESPONSE_SUBMITTED
        to: REMEDIATION_REQUIRED
        trigger: "POST /accreditor-reviews/{reviewId}/status with to_status=REMEDIATION_REQUIRED, or CASCADE-A HOP 5 (the program stopped being clean)"
        actor: AccreditorReviewer
        preconditions: []
        side_effects:
          - "Risk metrics recomputed against the current anchor roster; response_due_date = clock date + tier response days"
          - "response_round is NOT reset"
          - "AccreditorReview.version increments by 1"
        note: "Negotiation cycle — the accreditor can bounce a response back an unbounded number of rounds."
      - from: RESPONSE_SUBMITTED
        to: CLOSED_ACCEPTED
        trigger: "POST /accreditor-reviews/{reviewId}/status with to_status=CLOSED_ACCEPTED"
        actor: AccreditorReviewer
        preconditions: ["Program.adequacy_status == ADEQUATE AND Program.unqualified_assignment_count == 0 (ERR_PROGRAM_ADEQUACY_INSUFFICIENT)"]
        side_effects: ["Lockout ends", "AccreditorReview.version increments by 1"]
      - from: RESPONSE_SUBMITTED
        to: CLOSED_SANCTION
        trigger: "POST /accreditor-reviews/{reviewId}/status with to_status=CLOSED_SANCTION"
        actor: AccreditorReviewer
        preconditions: ["response_round >= 2 (ERR_INVALID_STATE)"]
        side_effects:
          - "Lockout ends; Program.launch_status is NOT changed (sanction handling is a separate governance process)"
          - "AccreditorReview.version increments by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-section
    parent_entity: CourseSection
    write_endpoint: "POST /course-assignments"
    occ_field: "expected_section_version"
    description: |
      Creating an INSTRUCTOR_OF_RECORD CourseAssignment against a CourseSection whose
      version has advanced since the client last observed it is rejected. This captures the
      case where another writer has already named an instructor of record for that section
      (which legitimately supersedes the prior assignment under the CourseAssignment
      PENDING_VERIFICATION/VERIFIED_QUALIFIED/EXCEPTION_FLAGGED -> SUPERSEDED transitions),
      so the current writer's view of the section — and of who currently holds it — is stale.
    error_id: ERR_STALE_SECTION_VERSION
    http_status: 412

  - rule_id: contract-issue-stale-faculty
    parent_entity: FacultyMember
    write_endpoint: "POST /faculty-contracts"
    occ_field: "expected_faculty_version"
    description: |
      Issuing a FacultyContract against a FacultyMember whose version has advanced since the
      client last observed it is rejected. A later contract for the same (faculty_member_id,
      term_id) legitimately supersedes the earlier one, and dossier movement (verification,
      repudiation, evaluation completion) also advances the faculty version, so a stale
      expected_faculty_version means the credentialing evidence the dean relied on is no
      longer the evidence of record.
    error_id: ERR_STALE_FACULTY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---------------------------------------------------------- alignment score
  - name: discipline_alignment_score
    description: |
      Graph-proximity score between a credential's discipline and a course section's
      discipline over the DisciplineTaxonomy forest. Only ONE level of parenthood is
      honored: a grandparent never earns the parent score and falls through to the
      code-prefix rule.
    trigger: "Every run of assignment_qualification_determination and professional_development_compliance"
    inputs: ["source DisciplineTaxonomy (record / PD activity discipline)", "target DisciplineTaxonomy (section / program discipline)", "DisciplineTaxonomy.parent_discipline_id", "DisciplineTaxonomy.code"]
    algorithm: threshold
    formula: |
      if source.id == target.id:                                          return 1.0000
      if source.id == target.parent_discipline_id
         or target.id == source.parent_discipline_id:                      return 0.7100
      if source.parent_discipline_id is not null
         and source.parent_discipline_id == target.parent_discipline_id:   return 0.6500   # siblings
      if source.code[0:2] == target.code[0:2]:                            return 0.4000
      return 0.0000
    constants:
      EXACT_SCORE: 1.0000
      PARENT_CHILD_SCORE: 0.7100
      SIBLING_SCORE: 0.6500
      CODE_PREFIX_SCORE: 0.4000
      UNRELATED_SCORE: 0.0000
      ALIGNMENT_PASS_THRESHOLD: 0.70
    precision: "4 decimal places, round_half_up"
    notes: |
      PARENT_CHILD_SCORE (0.7100) is deliberately just above ALIGNMENT_PASS_THRESHOLD and
      SIBLING_SCORE (0.6500) just below it, so a parent discipline aligns and a sibling
      discipline does not.

  # ------------------------------------- DUAL VARIANT #1 (CourseAssignment domain)
  - name: assignment_qualification_determination
    description: |
      Decides whether a CourseAssignment is qualified, and if not, which exception_code
      the accreditor sees. The variant is selected by the owning Program's
      qualification_policy feature flag.
    trigger: "POST /course-assignments (immediate determination), POST /faculty-rosters/{rosterId}/generate, POST /course-assignments/{assignmentId}/reverification, and CASCADE-A HOP 2"
    inputs:
      - "CourseSection.course_level, CourseSection.discipline_id"
      - "DisciplineTaxonomy.required_terminal_degree_level and min_graduate_credit_hours of the section discipline"
      - "Program.qualification_policy (variant selector)"
      - "All CredentialRecord rows of the assigned FacultyMember with verification_status, transcript_status, is_foreign_institution, effective_degree_level, effective_discipline_id, graduate_credit_hours_in_discipline"
      - "CredentialEvaluation rows of those records with status and equivalency_verdict"
      - "FacultyMember.dossier_status"
    algorithm: threshold
    formula: |
      DEGREE_RANK = { NON_DEGREE_GRADUATE: 0, BACHELORS: 1, MASTERS: 2, DOCTORATE: 3 }
      course_requirement = MASTERS   if course_level IN {LOWER_DIVISION, UPPER_DIVISION}
                           DOCTORATE if course_level IN {GRADUATE, DOCTORAL}
      required_rank = max(DEGREE_RANK[course_requirement],
                          DEGREE_RANK[section_discipline.required_terminal_degree_level])

      # A record's effective level/discipline is effective_degree_level /
      # effective_discipline_id when non-null (a COMPLETED EQUIVALENT foreign
      # evaluation wrote them), otherwise degree_level / discipline_id.
      official_set = records with verification_status == VERIFIED
                                 and transcript_status == OFFICIAL_RECEIVED
      eligible_set = official_set minus records that are is_foreign_institution == true
                     and have no CredentialEvaluation with status == COMPLETED
                     and equivalency_verdict == EQUIVALENT

      degree_hit = exists r in eligible_set with
                     DEGREE_RANK[effective_level(r)] >= required_rank
                     and discipline_alignment_score(effective_discipline(r),
                             section.discipline_id) >= 0.70
      coursework_hours = sum of r.graduate_credit_hours_in_discipline over r in eligible_set
                         with discipline_alignment_score(effective_discipline(r),
                                 section.discipline_id) >= 0.70
      coursework_hit = coursework_hours >= section_discipline.min_graduate_credit_hours

      # ---- VARIANT SELECTION on Program.qualification_policy ----
      if policy == DEGREE_FIELD:   credential_pass = degree_hit
                                   basis_if_pass   = TERMINAL_DEGREE
      if policy == COURSEWORK_18:  credential_pass = degree_hit or coursework_hit
                                   basis_if_pass   = TERMINAL_DEGREE if degree_hit
                                                     else COURSEWORK_18_HOUR

      alignment_score = max over r in eligible_set of
                          discipline_alignment_score(effective_discipline(r), section.discipline_id)
                        (0.0000 when eligible_set is empty)

      if credential_pass and faculty.dossier_status == VERIFIED:
          qualified = true;  qualification_basis = basis_if_pass;  exception_code = null
      else:
          qualified = false; qualification_basis = NONE
          # exception_code precedence — FIRST matching row wins
          1. NO_OFFICIAL_TRANSCRIPT      if official_set is empty
          2. FOREIGN_EVALUATION_MISSING  if official_set is non-empty and eligible_set is empty
          3. DEGREE_LEVEL_INSUFFICIENT   if not credential_pass and alignment_score >= 0.70
          4. DISCIPLINE_MISALIGNED       if not credential_pass and alignment_score < 0.70
          5. DOSSIER_DEFICIENT           if credential_pass (so the only defect is the dossier)
    constants:
      ALIGNMENT_PASS_THRESHOLD: 0.70
      DEFAULT_COURSEWORK_HOURS: 18
    precision: "alignment_score at 4 decimal places, round_half_up"
    variants:
      - name: DEGREE_FIELD
        when: "Program.qualification_policy == DEGREE_FIELD"
        difference: "Only a terminal degree at or above required_rank whose discipline aligns can qualify; accumulated graduate coursework is ignored entirely, and qualification_basis can never be COURSEWORK_18_HOUR."
      - name: COURSEWORK_18
        when: "Program.qualification_policy == COURSEWORK_18"
        difference: "The degree test runs first, but a faculty who fails it still qualifies when aligned graduate credit hours reach the section discipline's min_graduate_credit_hours; qualification_basis is then COURSEWORK_18_HOUR, which is EXCLUDED from the program_faculty_adequacy numerator."
    divergence_case: |
      Faculty holds (a) a MASTERS in a SIBLING discipline — alignment 0.6500, below the
      0.70 threshold — and (b) a NON_DEGREE_GRADUATE record in the section's own discipline
      with graduate_credit_hours_in_discipline = 18. Both records are VERIFIED and
      OFFICIAL_RECEIVED and domestic, and the faculty's dossier_status is VERIFIED.
        DEGREE_FIELD  -> qualified = false, qualification_basis = NONE,
                         exception_code = DEGREE_LEVEL_INSUFFICIENT,
                         alignment_score = 1.0000
        COURSEWORK_18 -> qualified = true,  qualification_basis = COURSEWORK_18_HOUR,
                         exception_code = null, alignment_score = 1.0000
      alignment_score is 1.0000 in BOTH variants because record (b) matches the section
      discipline exactly, and that is exactly why the DEGREE_FIELD arm reports
      DEGREE_LEVEL_INSUFFICIENT (precedence row 3) rather than DISCIPLINE_MISALIGNED:
      the aligned credential simply is not a degree. DISCIPLINE_MISALIGNED requires
      alignment_score < 0.70, which happens when the faculty holds ONLY record (a).

  # ------------------------------------------- DUAL VARIANT #2 (Program domain)
  - name: program_faculty_adequacy
    description: |
      Share of the program's teaching load carried by terminal-degree-qualified faculty,
      used for substantive-change and new-program adequacy review. The variant is selected
      by the Program's adequacy_basis feature flag.
    trigger: "POST /faculty-rosters/{rosterId}/generate, POST /faculty-rosters/{rosterId}/certification, POST /programs/{programId}/launch-review, GET /programs/{programId}/adequacy, roster_snapshot_recompute, and CASCADE-A HOP 4 / CASCADE-B HOP 3 / CASCADE-C HOP 3"
    inputs:
      - "Included assignment set of the anchor FacultyRoster (see roster_snapshot_recompute)"
      - "CourseAssignment.status and CourseAssignment.qualification_basis"
      - "CourseSection.credit_hours"
      - "Program.adequacy_basis (variant selector), Program.min_terminal_ratio"
    algorithm: aggregation
    formula: |
      included = assignments of the anchor roster (status NOT IN {SUPERSEDED, WITHDRAWN})
      terminal = included rows with status == VERIFIED_QUALIFIED
                                 and qualification_basis == TERMINAL_DEGREE

      # ---- VARIANT SELECTION on Program.adequacy_basis ----
      if basis == HEADCOUNT:
          denom = count(distinct faculty_member_id over included)
          num   = count(distinct faculty_member_id over terminal)
      if basis == CREDIT_HOUR_COVERAGE:
          denom = sum(CourseSection.credit_hours over included)
          num   = sum(CourseSection.credit_hours over terminal)

      adequacy_ratio = 0.0000 if denom == 0 else round_half_up_4(num / denom)
      adequacy_status = ADEQUATE     if adequacy_ratio >= min_terminal_ratio
                        AT_RISK      if adequacy_ratio >= min_terminal_ratio - AT_RISK_BAND
                        INSUFFICIENT otherwise
      unqualified_assignment_count = count of included rows with status IN
                        {PENDING_VERIFICATION, EXCEPTION_FLAGGED, REMEDIATION_IN_PROGRESS}
    constants:
      AT_RISK_BAND: 0.15
      DEFAULT_MIN_TERMINAL_RATIO: 0.75
    precision: "adequacy_ratio at 4 decimal places, round_half_up"
    variants:
      - name: HEADCOUNT
        when: "Program.adequacy_basis == HEADCOUNT"
        difference: "Counts distinct faculty; one terminal-degree instructor teaching a single 1-credit section counts exactly as much as an unqualified instructor teaching four 4-credit sections."
      - name: CREDIT_HOUR_COVERAGE
        when: "Program.adequacy_basis == CREDIT_HOUR_COVERAGE"
        difference: "Weights by CourseSection.credit_hours, so the same roster can be AT_RISK under HEADCOUNT and INSUFFICIENT under CREDIT_HOUR_COVERAGE."
    divergence_case: |
      Roster with two faculty: F1 VERIFIED_QUALIFIED / TERMINAL_DEGREE on a 1-credit-hour
      section, F2 VERIFIED_QUALIFIED / COURSEWORK_18_HOUR on a 4-credit-hour section.
      min_terminal_ratio = 0.60.
        HEADCOUNT             -> 1/2 = 0.5000 -> AT_RISK      (0.5000 >= 0.60 - 0.15)
        CREDIT_HOUR_COVERAGE  -> 1/5 = 0.2000 -> INSUFFICIENT (0.2000 <  0.45)
    edge_cases:
      - "denom == 0 (no included assignments) -> adequacy_ratio 0.0000, adequacy_status INSUFFICIENT, never a division error"
      - "TESTED_EXPERIENCE and COURSEWORK_18_HOUR assignments are counted in denom but never in num, so a roster with zero exceptions can still be INSUFFICIENT"

  # -------------------------------- COMBINATORIAL MODE (a): tiered + multiplier
  - name: evaluation_fee_cents
    description: |
      Price of a foreign-credential evaluation, frozen onto CredentialEvaluation.fee_cents
      at order time. Nested page brackets, a foreign-institution surcharge, a service-level
      multiplier, then a floor and a cap applied in that order.
    trigger: "POST /credential-evaluations (value is frozen; later page_count edits are impossible because page_count is immutable)"
    inputs: ["page_count", "service_level", "CredentialRecord.is_foreign_institution"]
    algorithm: tiered_pricing
    formula: |
      billable = max(0, page_count - FREE_PAGES)
      bracket_a = min(billable, BRACKET_A_PAGES)                                  @ RATE_A
      bracket_b = min(max(0, billable - BRACKET_A_PAGES), BRACKET_B_PAGES)        @ RATE_B
      bracket_c = max(0, billable - BRACKET_A_PAGES - BRACKET_B_PAGES)            @ RATE_C
      page_charge = bracket_a*RATE_A + bracket_b*RATE_B + bracket_c*RATE_C
      subtotal = BASE_FEE_CENTS + page_charge
                 + (FOREIGN_SURCHARGE_CENTS if is_foreign_institution else 0)
      raw = round_half_up_0(subtotal * (EXPEDITE_MULTIPLIER if service_level == EXPEDITED
                                        else 1.00))
      fee_cents = min(FEE_CAP_CENTS, max(FEE_FLOOR_CENTS, raw))
    constants:
      BASE_FEE_CENTS: 9000
      FREE_PAGES: 4
      BRACKET_A_PAGES: 8
      RATE_A: 240
      BRACKET_B_PAGES: 12
      RATE_B: 180
      RATE_C: 120
      FOREIGN_SURCHARGE_CENTS: 2500
      EXPEDITE_MULTIPLIER: 1.45
      FEE_FLOOR_CENTS: 15000
      FEE_CAP_CENTS: 95000
    precision: "integer cents, round_half_up applied once to subtotal * multiplier BEFORE the floor and cap"
    worked_examples:
      - "page_count 24, foreign, EXPEDITED  -> billable 20 = 8@240 + 12@180 = 4080; subtotal 9000+4080+2500 = 15580; 15580 * 1.45 = 22591.0 -> 22591"
      - "page_count 24, foreign, STANDARD   -> subtotal 15580 -> 15580 (divergence delta vs EXPEDITED = 7011)"
      - "page_count 12, foreign, EXPEDITED  -> billable 8 (bracket A exactly) -> 13420 * 1.45 = 19459.0 -> 19459"
      - "page_count 13, foreign, EXPEDITED  -> billable 9 (first bracket-B page) -> 13600 * 1.45 = 19720.0 -> 19720; the 261-cent step proves RATE_B, not RATE_A, priced page 9"
      - "page_count 4, foreign, STANDARD    -> billable 0, subtotal 9000+0+2500 = 11500 -> raw 11500 -> FEE_FLOOR_CENTS 15000 (every evaluation is foreign by validation priority 17, so the floor is only reachable through the low-page/STANDARD corner)"
      - "page_count 600, foreign, EXPEDITED -> subtotal 84700 -> 122815 -> FEE_CAP_CENTS 95000"

  # ------------------------ COMBINATORIAL MODE (b): floor-then-residual sharing
  - name: evaluation_cost_allocation
    description: |
      Splits a COMPLETED evaluation's frozen fee_cents across every Program whose teaching
      load the credentialed faculty actually carries. Each share is floored, then the
      leftover cents are handed out one at a time — so the shares always re-sum to
      fee_cents exactly and no cent is invented or lost.
    trigger: "POST /credential-evaluations/{evaluationId}/status with to_status=COMPLETED"
    inputs:
      - "CredentialEvaluation.fee_cents (frozen at order time)"
      - "CourseAssignment rows of the record's FacultyMember with status NOT IN {SUPERSEDED, WITHDRAWN}"
      - "CourseSection.program_id, CourseSection.credit_hours, Term.status"
      - "Program.created_at (deterministic tie-break)"
    algorithm: waterfall_allocation
    formula: |
      weights = for each Program p, weight_credit_hours(p) =
                  sum(CourseSection.credit_hours) over the faculty's assignments with
                  status NOT IN {SUPERSEDED, WITHDRAWN} whose section has program_id == p
                  and whose Term.status != CLOSED
      drop programs with weight_credit_hours == 0
      if weights is empty:
          allocation_shares = [ { program_id: billed_program_id,
                                  weight_credit_hours: 0, share_cents: fee_cents } ]
      else:
          total_weight = sum(weight_credit_hours)
          share_cents(p) = floor(fee_cents * weight_credit_hours(p) / total_weight)
          residual = fee_cents - sum(share_cents)
          order = programs sorted by weight_credit_hours DESC, then Program.created_at ASC
          hand out 1 cent to order[0], order[1], ... until residual is exhausted
                   (wrapping around the same order if residual > len(order))
      every receiving Program.budget_spent_cents increases by its share_cents
    constants: {}
    precision: "integer cents; floor per share then residual distribution — never round each share independently"
    worked_examples:
      - "fee_cents 22591 over weights 3 (Program A, created first), 3 (Program B), 4 (Program C, created last): floors 6777 / 6777 / 9036 = 22590, residual 1 -> weight DESC puts C first -> 6777 / 6777 / 9037"
      - "fee_cents 22591 over equal weights 3 / 3 / 3: floors 7530 / 7530 / 7530 = 22590, residual 1 -> weights tie, so Program.created_at ASC puts A first -> 7531 / 7530 / 7530"
      - "Naively rounding each share (round_half_up(22591*3/10) = 6777, ... = 9036) would total 22590 and lose a cent; the residual pass is what conserves the fee"

  # ---------------------- COMBINATORIAL MODE (c): weighted sum then tier select
  - name: accreditor_review_risk_index
    description: |
      Multi-factor risk score written when an accreditor issues findings or bounces a
      response back. The response tier is chosen from the PRELIMINARY index only and is
      never re-derived from the multiplied index — a MODERATE review that lands above 60
      after the multiplier keeps its MODERATE 60-day response window.
    trigger: "POST /accreditor-reviews/{reviewId}/findings and POST /accreditor-reviews/{reviewId}/status with to_status=REMEDIATION_REQUIRED (and CASCADE-A HOP 5)"
    inputs:
      - "Anchor FacultyRoster = the FacultyRoster for this program with status IN {GENERATED, CERTIFIED} and the greatest created_at (tie-break created_at ASC is irrelevant; ids are never used)"
      - "CourseAssignment rows in (program_id, anchor_roster.term_id) with status NOT IN {SUPERSEDED, WITHDRAWN}"
      - "FacultyMember.dossier_status of the distinct faculty on those assignments"
      - "FacultyRoster.adequacy_ratio_snapshot, Program.min_terminal_ratio"
      - "Logical clock date (for response_due_date)"
    algorithm: weighted_scoring
    formula: |
      total = count(included assignments)
      u = 0 if total == 0 else count(status IN {PENDING_VERIFICATION, EXCEPTION_FLAGGED,
                                                REMEDIATION_IN_PROGRESS}) / total
      d = 0 if distinct_faculty == 0 else
          count(distinct faculty with dossier_status IN {INCOMPLETE, DEFICIENT}) / distinct_faculty
      e = 0 if total == 0 else count(status == REMEDIATION_IN_PROGRESS) / total
      g = 0 if min_terminal_ratio == 0 or adequacy_ratio_snapshot >= min_terminal_ratio
          else min(1, (min_terminal_ratio - adequacy_ratio_snapshot) / min_terminal_ratio)

      preliminary_risk_index = round_half_up_2(100 * (W_UNQUALIFIED*u + W_DOSSIER*d
                                                     + W_PERSISTENCE*e + W_ADEQUACY*g))
      # SINGLE-PASS TIER SELECTION — reads preliminary_risk_index and nothing else
      risk_tier = LOW      if preliminary_risk_index <  MODERATE_FLOOR
                  MODERATE if preliminary_risk_index <  HIGH_FLOOR
                  HIGH     otherwise
      risk_index = min(INDEX_CAP, round_half_up_2(preliminary_risk_index
                                                  * TIER_MULTIPLIER[risk_tier]))
      response_due_date = clock date + TIER_RESPONSE_DAYS[risk_tier] days
      # u, d, e and g are read BEFORE the findings remediation cascade moves any
      # EXCEPTION_FLAGGED assignment to REMEDIATION_IN_PROGRESS.
    constants:
      W_UNQUALIFIED: 0.40
      W_DOSSIER: 0.25
      W_PERSISTENCE: 0.20
      W_ADEQUACY: 0.15
      MODERATE_FLOOR: 30
      HIGH_FLOOR: 60
      TIER_MULTIPLIER: { LOW: 1.00, MODERATE: 1.10, HIGH: 1.25 }
      TIER_RESPONSE_DAYS: { LOW: 90, MODERATE: 60, HIGH: 30 }
      INDEX_CAP: 100.00
    precision: "2 decimal places, round_half_up, applied to preliminary_risk_index and again to risk_index"
    worked_examples:
      - "4 included assignments, 3 of them unqualified (1 of those already REMEDIATION_IN_PROGRESS), 2 distinct faculty of which 1 is DEFICIENT, adequacy_ratio_snapshot 0.3000 with min_terminal_ratio 0.60: u = 0.75, d = 0.5, e = 0.25, g = 0.5 -> preliminary_risk_index = 100*(0.30+0.125+0.05+0.075) = 55.00 -> MODERATE -> risk_index = 55.00*1.10 = 60.50, response_due_date = clock 2026-08-01 + 60 days = 2026-09-30"
      - "risk_index 60.50 is at or above HIGH_FLOOR, yet risk_tier stays MODERATE and the window stays 60 days — re-tiering from risk_index would wrongly yield HIGH and 30 days"

  # -------------------------------------------------- tested experience scoring
  - name: tested_experience_score
    description: "Weighted score for a tested-experience justification, gating approval of a non-degree-credentialed instructor."
    trigger: "POST /tested-experience-justifications, POST /tested-experience-justifications/{justificationId} (field update), and the DRAFT -> SUBMITTED transition"
    inputs: ["documented_years_experience", "industry_certification_level", "alternative_credential_codes"]
    algorithm: weighted_scoring
    formula: |
      years_factor = min(1.0, documented_years_experience / YEARS_FULL_CREDIT)
      cert_factor  = CERT_FACTOR[industry_certification_level]
      codes_factor = min(1.0, count(alternative_credential_codes) / CODES_FULL_CREDIT)
      tested_experience_score = round_half_up_4(W_YEARS*years_factor
                                               + W_CERT*cert_factor
                                               + W_CODES*codes_factor)
    constants:
      W_YEARS: 0.50
      W_CERT: 0.30
      W_CODES: 0.20
      YEARS_FULL_CREDIT: 8
      CODES_FULL_CREDIT: 4
      CERT_FACTOR: { NONE: 0.00, PRACTITIONER: 0.50, ADVANCED: 0.75, BOARD_CERTIFIED: 1.00 }
      APPROVAL_SCORE_THRESHOLD: 0.70
      APPROVAL_MIN_YEARS: 3
    precision: "4 decimal places, round_half_up"
    worked_examples:
      - "years 8, PRACTITIONER, 1 code  -> 0.50*1.0 + 0.30*0.50 + 0.20*0.25 = 0.7000 — exactly AT the approval threshold, approval SUCCEEDS"
      - "years 8, PRACTITIONER, 0 codes -> 0.50*1.0 + 0.15 + 0.00 = 0.6500 — below threshold, ERR_TESTED_EXPERIENCE_INSUFFICIENT"
      - "years 6, ADVANCED, 3 codes     -> 0.375 + 0.225 + 0.15 = 0.7500 — approval succeeds"
      - "years 2, BOARD_CERTIFIED, 4 codes -> 0.125 + 0.30 + 0.20 = 0.6250 — fails both the score threshold and APPROVAL_MIN_YEARS"

  # ------------------------------------------------- dossier constraint solver
  - name: faculty_dossier_recompute
    description: |
      Re-derives FacultyMember.deficiency_codes, dossier_status and
      highest_verified_degree_level from the faculty's entire credential evidence set.
      Runs to a fixed point in a single pass — codes never depend on each other.
    trigger: "POST /credential-records, POST /credential-records/{credentialRecordId}/transcript, POST /credential-records/{credentialRecordId}/verification, POST /credential-evaluations/{evaluationId}/status with to_status=COMPLETED"
    inputs: ["All CredentialRecord rows of the faculty", "Their CredentialEvaluation rows", "CredentialRecord.created_at (for the repudiation-replacement test)"]
    algorithm: constraint_propagation
    formula: |
      live = records with verification_status != REJECTED
      deficiency_codes = [] and is appended in exactly this order:
        NO_CREDENTIAL_ON_FILE          if live is empty
        TRANSCRIPT_NOT_OFFICIAL        if any r in live with verification_status != REPUDIATED
                                          and transcript_status != OFFICIAL_RECEIVED
        FOREIGN_EVALUATION_INCOMPLETE  if any r in live with verification_status != REPUDIATED
                                          and is_foreign_institution == true and no
                                          CredentialEvaluation with status == COMPLETED and
                                          equivalency_verdict == EQUIVALENT
        CREDENTIAL_REPUDIATED          if any r in live with verification_status == REPUDIATED
                                          for which no later-created (created_at ASC) record
                                          with the same (degree_level, discipline_id) and
                                          verification_status != REJECTED exists
      dossier_status = INCOMPLETE   if live is empty
                       UNDER_REVIEW if any r in live with verification_status == PENDING
                       VERIFIED     if deficiency_codes == []
                       DEFICIENT    otherwise
      highest_verified_degree_level = the maximum DEGREE_RANK effective_degree_level over
                       records with verification_status == VERIFIED (null when none)
      if dossier_status == VERIFIED and appointment_status == PROSPECT:
          appointment_status = CREDENTIALED_ELIGIBLE
    constants: {}
    precision: "n/a — enumerations only"
    notes: |
      A PENDING record outranks any deficiency: dossier_status is UNDER_REVIEW even when
      TRANSCRIPT_NOT_OFFICIAL is already in deficiency_codes. This is what makes the
      DEFICIENT -> UNDER_REVIEW -> VERIFIED cure path reachable after a repudiation.

  # ------------------------------------------------------ roster snapshot
  - name: roster_snapshot_recompute
    description: "Rebuilds every FacultyRoster snapshot field, its blocking_reason_codes and its certification_readiness from the roster's included assignment set."
    trigger: "POST /faculty-rosters/{rosterId}/generate, POST /faculty-rosters/{rosterId}/certification, and every cascade hop that changes an included CourseAssignment (CASCADE-A HOP 3, CASCADE-B HOP 2, CASCADE-C HOP 3, findings remediation)"
    inputs: ["CourseAssignment rows joined to CourseSection", "FacultyMember.dossier_status", "Program.adequacy_basis and min_terminal_ratio"]
    algorithm: aggregation
    formula: |
      included = CourseAssignment rows where CourseSection.program_id == roster.program_id
                 and CourseSection.term_id == roster.term_id
                 and status NOT IN {SUPERSEDED, WITHDRAWN}
      total_assignment_count       = count(included)
      distinct_faculty_count       = count(distinct faculty_member_id over included)
      flagged_exception_count      = count(included with status IN {EXCEPTION_FLAGGED,
                                                                   REMEDIATION_IN_PROGRESS})
      terminal_qualified_headcount = count(distinct faculty_member_id over included with
                                       status == VERIFIED_QUALIFIED and
                                       qualification_basis == TERMINAL_DEGREE)
      credit_hours_total           = sum(CourseSection.credit_hours over included)
      credit_hours_terminal_qualified = sum(CourseSection.credit_hours over included with
                                       status == VERIFIED_QUALIFIED and
                                       qualification_basis == TERMINAL_DEGREE)
      adequacy_ratio_snapshot      = program_faculty_adequacy under Program.adequacy_basis
      blocking_reason_codes appended in exactly this order:
        EXCEPTIONS_OUTSTANDING   if any included with status IN {PENDING_VERIFICATION,
                                    EXCEPTION_FLAGGED, REMEDIATION_IN_PROGRESS}
        ADEQUACY_BELOW_MINIMUM   if adequacy_ratio_snapshot < Program.min_terminal_ratio
        DOSSIER_DEFICIENT        if any included faculty has dossier_status IN
                                    {INCOMPLETE, DEFICIENT}
      certification_readiness = READY if blocking_reason_codes == [] else BLOCKED
    constants: {}
    precision: "counts are integers; adequacy_ratio_snapshot at 4 decimal places, round_half_up"
    notes: |
      Recompute never advances generation_epoch — only POST /faculty-rosters/{rosterId}/generate
      does. An empty included set yields all-zero counts, adequacy_ratio_snapshot 0.0000 and
      blocking_reason_codes [ADEQUACY_BELOW_MINIMUM] (because 0.0000 < min_terminal_ratio),
      so an empty roster is BLOCKED rather than trivially READY.

  # ----------------------------------------- professional development window
  - name: professional_development_compliance
    description: "Rolling-cycle discipline-relevant PD hours for a faculty member, anchored on a deterministically selected Term so no wall-clock reads are needed."
    trigger: "POST /pd-records, POST /pd-records/{pdRecordId}/status, POST /_clock/set_current_utc (anchor term may change), and GET /faculty-members/{facultyMemberId}"
    inputs: ["ProfessionalDevelopmentRecord rows of the faculty", "Term rows", "FacultyMember.employment_class", "FacultyMember.home_program_id -> Program.discipline_id"]
    algorithm: aggregation
    formula: |
      anchor_term = the Term with status == OPEN and the greatest end_date
                    (tie-break: created_at ASC);
                    if no OPEN Term exists, the Term with the greatest end_date over all
                    Terms (tie-break: created_at ASC)
      if no Term exists: pd_hours_current_cycle = 0 and pd_compliant = false
      cycle_window = [anchor_term.end_date - CYCLE_DAYS days, anchor_term.end_date]
                     — FULLY CLOSED on both ends
      relevant = ProfessionalDevelopmentRecord rows with status == VERIFIED,
                 activity_date inside cycle_window, and
                 discipline_alignment_score(pd.discipline_id,
                     Program(faculty.home_program_id).discipline_id) >= 0.70
      pd_hours_current_cycle = sum(contact_hours over relevant)
      pd_compliant = pd_hours_current_cycle >= REQUIRED_HOURS[faculty.employment_class]
      discipline_relevant is written onto each ProfessionalDevelopmentRecord at creation
      and is NOT recomputed if the faculty's home_program_id later changes
    constants:
      CYCLE_DAYS: 1095
      REQUIRED_HOURS: { FULL_TIME: 40, ADJUNCT: 20, CLINICAL: 30, GRADUATE_ASSISTANT: 10 }
    precision: "contact_hours summed as a number with 1 decimal place, round_half_up"

  # ------------------------------- CONSERVED QUANTITY #1: teaching credit hours
  - name: faculty_assigned_credit_hours_ledger
    description: |
      FacultyMember.assigned_credit_hours is the conserved teaching-load ledger. Every
      assignment creation adds exactly CourseSection.credit_hours and every withdrawal,
      supersession or separation removes exactly the same amount, so the field always
      equals a fresh recomputation over the ledger set.
    trigger: "POST /course-assignments, POST /course-assignments/{assignmentId}/withdrawal, the *_ -> SUPERSEDED transitions, POST /faculty-members/{facultyMemberId}/separation, POST /terms/{termId}/status with to_status=CLOSED"
    inputs: ["CourseAssignment.status", "CourseSection.credit_hours", "CourseSection.term_id -> Term.status"]
    algorithm: aggregation
    formula: |
      ledger_set(f) = CourseAssignment rows with faculty_member_id == f
                      and status NOT IN {SUPERSEDED, WITHDRAWN}
                      and Term(CourseSection.term_id).status != CLOSED
      assigned_credit_hours(f) = sum(CourseSection.credit_hours over ledger_set(f))
      INVARIANT: after any sequence of assignment creations, withdrawals, supersessions,
      separations and term closures, assigned_credit_hours(f) equals this sum exactly.
      Per-term load check (ERR_TERM_LOAD_EXCEEDED):
        term_load(f, t) = sum(credit_hours over ledger_set(f) restricted to term t)
        reject when term_load(f, t) + new_section.credit_hours
                 > MAX_TERM_CREDIT_HOURS[f.employment_class]
    constants:
      MAX_TERM_CREDIT_HOURS: { FULL_TIME: 15, ADJUNCT: 9, CLINICAL: 12, GRADUATE_ASSISTANT: 6 }
    precision: "integer credit hours"
    notes: |
      EXCEPTION_FLAGGED and REMEDIATION_IN_PROGRESS assignments stay in the ledger set — an
      unqualified instructor still occupies the seat. Only SUPERSEDED / WITHDRAWN and CLOSED
      terms leave it.

  # ---------------------------------- CONSERVED QUANTITY #2: evaluation budget
  - name: program_credential_budget_ledger
    description: |
      Program.budget_reserved_cents and Program.budget_spent_cents form the conserved money
      ledger for foreign-credential evaluation. Ordering reserves, completion converts the
      reservation into allocated spend, voiding releases the reservation with no residue.
    trigger: "POST /credential-evaluations, POST /credential-evaluations/{evaluationId}/status"
    inputs: ["CredentialEvaluation.status", "CredentialEvaluation.fee_cents", "CredentialEvaluation.billed_program_id", "allocation_shares"]
    algorithm: aggregation
    formula: |
      budget_reserved_cents(p) = sum(fee_cents) over evaluations with billed_program_id == p
                                 and status IN {ORDERED, IN_REVIEW}
      budget_spent_cents(p)    = sum(share_cents assigned to p by evaluation_cost_allocation)
                                 over evaluations with status == COMPLETED
      committed(p) = budget_reserved_cents(p) + budget_spent_cents(p)
      Order check (ERR_CREDENTIAL_BUDGET_EXCEEDED):
        reject POST /credential-evaluations when
        committed(billed_program) + evaluation_fee_cents > credential_budget_cents
      INVARIANT A: order then void returns budget_reserved_cents to its exact prior value
                   and leaves budget_spent_cents untouched.
      INVARIANT B: for every COMPLETED evaluation, sum(share_cents over allocation_shares)
                   == fee_cents exactly — the residual pass guarantees it.
    constants: {}
    precision: "integer cents"
    notes: |
      The budget check is evaluated against the BILLED program only, while completion can
      spread share_cents onto OTHER programs whose budgets were never checked. That is
      intentional: budget_spent_cents may push a non-billed program's committed total above
      its own credential_budget_cents, and only its next order attempt is rejected.

# =============================================================================
# §1.4 Validation Rules Table — evaluated in strict priority order; the FIRST
# violated rule determines the response and no later rule is evaluated.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID header is present and non-empty on every request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Identity is carried entirely by X-User-ID; a missing or empty header is rejected before routing-level checks."

  - priority: 2
    category: auth
    check: "X-Role header is present and its value appears in the endpoint's authorized_roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
    description: "Role gate. A missing X-Role is treated as an unauthorized role, not as ERR_INVALID_REQUEST."

  - priority: 3
    category: auth
    check: "For an entity_backed role, X-User-ID equals the id of the entity that owns the addressed resource"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: ["POST /programs/{programId}/launch-review", "POST /course-assignments", "POST /course-assignments/{assignmentId}/remediation", "POST /course-assignments/{assignmentId}/withdrawal", "POST /course-sections", "POST /faculty-rosters", "POST /tested-experience-justifications", "POST /tested-experience-justifications/{justificationId}", "POST /tested-experience-justifications/{justificationId}/status", "POST /tested-experience-justifications/{justificationId}/revision", "POST /faculty-contracts", "POST /faculty-contracts/{contractId}/void", "POST /faculty-contracts/{contractId}/countersignature", "POST /pd-records", "GET /faculty-members/{facultyMemberId}", "GET /faculty-contracts/{contractId}"]
    description: "ProgramDean is backed by Program (X-User-ID must equal the owning Program.id); Instructor is backed by FacultyMember (X-User-ID must equal the FacultyMember.id). Opaque roles skip this rule."

  - priority: 4
    category: input
    check: "Request body and query parameters satisfy the declared shape: required fields present, types correct, enum values in range, numeric bounds respected, date/datetime strings well formed, arrays non-null"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    description: "Includes limit outside [1,100], offset < 0, negative credit_hours, page_count < 0, meeting_start_minute or meeting_end_minute outside [0,1440], min_terminal_ratio outside [0,1], unknown enum literals, and COMPLETED evaluation status changes that omit the equivalency triplet."

  - priority: 5
    category: existence
    check: "Every id in the request path resolves to an existing row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterised endpoints"
    description: "Maps to the per-entity 404 codes in §1.6 (ERR_DISCIPLINE_NOT_FOUND, ERR_PROGRAM_NOT_FOUND, ERR_TERM_NOT_FOUND, ERR_FACULTY_NOT_FOUND, ERR_CREDENTIAL_RECORD_NOT_FOUND, ERR_EVALUATION_NOT_FOUND, ERR_SECTION_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_JUSTIFICATION_NOT_FOUND, ERR_ROSTER_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_PD_RECORD_NOT_FOUND, ERR_REVIEW_NOT_FOUND)."

  - priority: 6
    category: existence
    check: "Every foreign-key id in the request body resolves to an existing row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying FK fields"
    description: "Body FKs are checked in field-declaration order, so a request with two bad FKs reports the first declared one."

  - priority: 7
    category: state
    check: "expected_section_version equals the current CourseSection.version"
    error_id: ERR_STALE_SECTION_VERSION
    http_status: 412
    applies_to: ["POST /course-assignments"]
    description: "OCC rule assignment-create-stale-section from §1.2.1."

  - priority: 8
    category: state
    check: "expected_faculty_version equals the current FacultyMember.version"
    error_id: ERR_STALE_FACULTY_VERSION
    http_status: 412
    applies_to: ["POST /faculty-contracts"]
    description: "OCC rule contract-issue-stale-faculty from §1.2.1."

  - priority: 9
    category: state
    check: "The requested transition (from_state -> to_state) appears in the §1.2 transition list for that entity and state field"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
    description: "Also covers terminal-state lockdown, repeated triggers (idempotency is NOT granted — the second call fails), CLOSED_SANCTION with response_round < 2, and launching a substantive-change program without a CLOSED_ACCEPTED SUBSTANTIVE_CHANGE review."

  - priority: 10
    category: state
    check: "Term.status of the affected section's term is IN {OPEN, ROSTER_LOCKED} for assignment mutations, and == PLANNING or OPEN for section creation"
    error_id: ERR_TERM_LOCKED
    http_status: 409
    applies_to: ["POST /course-sections", "POST /course-assignments", "POST /course-assignments/{assignmentId}/remediation", "POST /course-assignments/{assignmentId}/reverification", "POST /course-assignments/{assignmentId}/withdrawal", "POST /faculty-rosters/{rosterId}/generate", "POST /faculty-rosters/{rosterId}/certification"]
    description: "ROSTER_LOCKED still permits assignment remediation and roster work but forbids new sections; CLOSED forbids everything. PAIR-A HIGH SIDE — outranks ERR_TEACHING_BLOCK_CONFLICT at priority 24."

  - priority: 11
    category: state
    check: "The FacultyRoster covering (CourseSection.program_id, CourseSection.term_id) is not CERTIFIED"
    error_id: ERR_ROSTER_CERTIFIED
    http_status: 409
    applies_to: ["POST /course-assignments", "POST /course-assignments/{assignmentId}/remediation", "POST /course-assignments/{assignmentId}/reverification", "POST /course-assignments/{assignmentId}/withdrawal", "POST /faculty-members/{facultyMemberId}/separation", "POST /terms/{termId}/status"]
    description: "A certified roster freezes its assignment set. Creating a NEW roster for the same (program, term) supersedes the certified one and unfreezes them again."

  - priority: 12
    category: business_safety
    check: "The affected Program has no AccreditorReview with status IN {IN_PROGRESS, FINDINGS_ISSUED, REMEDIATION_REQUIRED} whose fully-closed [window_start_date, window_end_date] contains the current logical clock date"
    error_id: ERR_ACCREDITOR_REVIEW_LOCKOUT
    http_status: 403
    applies_to: ["POST /course-assignments", "POST /course-assignments/{assignmentId}/withdrawal", "POST /credential-evaluations"]
    description: "Evidence freeze during an on-site review window. PAIR-B HIGH SIDE — outranks ERR_CREDENTIAL_BUDGET_EXCEEDED at priority 35."

  - priority: 13
    category: business_safety
    check: "Segregation of duties on X-User-ID"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /tested-experience-justifications/{justificationId}/decision", "POST /faculty-rosters/{rosterId}/certification"]
    description: "The CredentialAnalyst who set verified_by_user_id on ANY CredentialRecord of the backed assignment's faculty may not decide that justification; the AccreditationLiaison certifying a roster may not be a user recorded in decided_by_user_id of any TestedExperienceJustification whose backed assignment is included in it."

  - priority: 14
    category: business_referential
    check: "The referenced FacultyMember.appointment_status != SEPARATED"
    error_id: ERR_FACULTY_SEPARATED
    http_status: 409
    applies_to: ["POST /course-assignments", "POST /faculty-contracts", "POST /faculty-contracts/{contractId}/countersignature", "POST /credential-records", "POST /pd-records"]
    description: "SEPARATED is terminal — nothing may be attached to a separated faculty member."

  - priority: 15
    category: business_referential
    check: "The referenced FacultyMember.appointment_status IN {CREDENTIALED_ELIGIBLE, CONTRACTED}"
    error_id: ERR_FACULTY_NOT_APPOINTABLE
    http_status: 409
    applies_to: ["POST /course-assignments"]
    description: "A PROSPECT (never-verified) faculty member cannot be put in front of students at all. A CREDENTIALED_ELIGIBLE faculty whose dossier LATER went DEFICIENT still passes this rule and gets an EXCEPTION_FLAGGED assignment instead — that asymmetry is the point of the two independent dimensions."

  - priority: 16
    category: business_referential
    check: "The referenced FacultyMember.dossier_status == VERIFIED"
    error_id: ERR_DOSSIER_NOT_VERIFIED
    http_status: 409
    applies_to: ["POST /faculty-contracts"]
    description: "Credentialing must precede contract issuance for adjunct and clinical faculty alike. PAIR-C HIGH SIDE — outranks ERR_CONTRACT_WINDOW_CLOSED at priority 28."

  - priority: 17
    category: business_referential
    check: "The referenced CredentialRecord.is_foreign_institution == true"
    error_id: ERR_NOT_FOREIGN_CREDENTIAL
    http_status: 422
    applies_to: ["POST /credential-evaluations"]
    description: "Only foreign credentials may be sent to an evaluation agency; a domestic record is rejected."

  - priority: 18
    category: business_referential
    check: "parent_discipline_id does not equal the row's own id and does not create a cycle in the DisciplineTaxonomy forest"
    error_id: ERR_DISCIPLINE_CYCLE
    http_status: 422
    applies_to: ["POST /disciplines", "POST /disciplines/{disciplineId}"]
    description: "The taxonomy must stay a forest even though alignment only reads one level up."

  - priority: 19
    category: business_constraint
    check: "DisciplineTaxonomy.code is unique"
    error_id: ERR_DUPLICATE_DISCIPLINE_CODE
    http_status: 409
    applies_to: ["POST /disciplines", "POST /disciplines/{disciplineId}"]
    description: "Case-sensitive exact-match uniqueness."

  - priority: 20
    category: business_constraint
    check: "Term.code is unique"
    error_id: ERR_DUPLICATE_TERM_CODE
    http_status: 409
    applies_to: ["POST /terms"]
    description: "Case-sensitive exact-match uniqueness."

  - priority: 21
    category: business_constraint
    check: "FacultyMember.email is unique"
    error_id: ERR_DUPLICATE_FACULTY_EMAIL
    http_status: 409
    applies_to: ["POST /faculty-members"]
    description: "Case-sensitive exact-match uniqueness."

  - priority: 22
    category: business_constraint
    check: "No existing CourseAssignment with the same (course_section_id, faculty_member_id) and status NOT IN {SUPERSEDED, WITHDRAWN}"
    error_id: ERR_DUPLICATE_ASSIGNMENT
    http_status: 409
    applies_to: ["POST /course-assignments"]
    description: "The same instructor cannot be attached to the same section twice. A DIFFERENT instructor taking the INSTRUCTOR_OF_RECORD role supersedes the incumbent instead of being rejected."

  - priority: 23
    category: business_constraint
    check: "No existing FacultyRoster for the same (program_id, term_id) with status IN {DRAFT, GENERATED}"
    error_id: ERR_DUPLICATE_ROSTER
    http_status: 409
    applies_to: ["POST /faculty-rosters"]
    description: "Scoped deliberately to {DRAFT, GENERATED}: a CERTIFIED roster is not a duplicate but is SUPERSEDED by the new one."

  - priority: 24
    category: business_constraint
    check: "The faculty member has no teaching-block conflict with the target CourseSection"
    error_id: ERR_TEACHING_BLOCK_CONFLICT
    http_status: 409
    applies_to: ["POST /course-assignments"]
    description: |
      Compared against the faculty's assignments with status NOT IN {SUPERSEDED, WITHDRAWN}
      in the SAME term. Meeting intervals are HALF-OPEN [meeting_start_minute,
      meeting_end_minute): two sections sharing at least one entry in meeting_days conflict
      when new.start < other.end + buffer AND other.start < new.end + buffer, where
      buffer = TRAVEL_BUFFER_MINUTES (15) when building_code differs and 0 when it matches.
      Sections with delivery_mode == ONLINE_ASYNC are exempt on either side and never
      conflict. Back-to-back sections in the SAME building (end == start) do NOT conflict.
      PAIR-A LOW SIDE — reported only when ERR_TERM_LOCKED at priority 10 is satisfied.

  - priority: 25
    category: business_constraint
    check: "The new AccreditorReview window does not overlap another non-terminal review of the same program"
    error_id: ERR_REVIEW_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /accreditor-reviews"]
    description: |
      Compared against reviews of the same program_id with status NOT IN {CLOSED_ACCEPTED,
      CLOSED_SANCTION}. Windows are FULLY CLOSED [window_start_date, window_end_date]:
      new.start <= other.end AND other.start <= new.end is a conflict, so two reviews that
      merely TOUCH at a single date DO collide. This is the opposite endpoint convention
      from the half-open teaching-block rule at priority 24.

  - priority: 26
    category: business_constraint
    check: "term_load(faculty, term) + CourseSection.credit_hours <= MAX_TERM_CREDIT_HOURS[employment_class]"
    error_id: ERR_TERM_LOAD_EXCEEDED
    http_status: 409
    applies_to: ["POST /course-assignments"]
    description: "Aggregate rule — each individual assignment is legal but the collective load is not. ADJUNCT 9, GRADUATE_ASSISTANT 6, CLINICAL 12, FULL_TIME 15 credit hours per term."

  - priority: 27
    category: business_temporal
    check: "Date-interval fields are ordered: Term.start_date <= census_date <= end_date; AccreditorReview.window_start_date <= window_end_date; CourseSection.meeting_start_minute < meeting_end_minute"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: ["POST /terms", "POST /course-sections", "POST /accreditor-reviews", "POST /accreditor-reviews/{reviewId}/status"]
    description: "Also fires when SCHEDULED -> IN_PROGRESS is attempted before window_start_date."

  - priority: 28
    category: business_temporal
    check: "The current logical clock date is strictly before Term.start_date"
    error_id: ERR_CONTRACT_WINDOW_CLOSED
    http_status: 422
    applies_to: ["POST /faculty-contracts"]
    description: "Contracts must be issued before the term begins. PAIR-C LOW SIDE — reported only when ERR_DOSSIER_NOT_VERIFIED at priority 16 is satisfied."

  - priority: 29
    category: business_temporal
    check: "The current logical clock date is on or before AccreditorReview.response_due_date"
    error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 422
    applies_to: ["POST /accreditor-reviews/{reviewId}/response"]
    description: "Inclusive — submitting exactly ON the due date is allowed."

  - priority: 30
    category: business_temporal
    check: "ProfessionalDevelopmentRecord.activity_date is on or before the current logical clock date"
    error_id: ERR_PD_DATE_IN_FUTURE
    http_status: 422
    applies_to: ["POST /pd-records"]
    description: "Professional development cannot be logged before it happens."

  - priority: 31
    category: business_constraint
    check: "TestedExperienceJustification.supervisor_attestation_on_file == true"
    error_id: ERR_ATTESTATION_MISSING
    http_status: 422
    applies_to: ["POST /tested-experience-justifications/{justificationId}/decision"]
    description: "Only checked on the APPROVE arm; a REJECT decision needs no attestation."

  - priority: 32
    category: business_constraint
    check: "documented_years_experience >= 3 AND tested_experience_score >= 0.70"
    error_id: ERR_TESTED_EXPERIENCE_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /tested-experience-justifications/{justificationId}/decision"]
    description: "Only checked on the APPROVE arm. The threshold is inclusive: a score of exactly 0.7000 is approvable."

  - priority: 33
    category: business_constraint
    check: "FacultyRoster.certification_readiness == READY"
    error_id: ERR_ROSTER_NOT_READY
    http_status: 409
    applies_to: ["POST /faculty-rosters/{rosterId}/certification", "POST /terms/{termId}/status"]
    description: "On the term endpoint the rule reads: every FacultyRoster of the term is already CERTIFIED or SUPERSEDED before the term may close."

  - priority: 34
    category: business_constraint
    check: "Program.adequacy_status == ADEQUATE AND Program.unqualified_assignment_count == 0"
    error_id: ERR_PROGRAM_ADEQUACY_INSUFFICIENT
    http_status: 409
    applies_to: ["POST /programs/{programId}/launch-decision", "POST /accreditor-reviews/{reviewId}/status"]
    description: "Cross-entity dependency — an AccreditorReview may only reach CLOSED_ACCEPTED, and a Program may only reach APPROVED_TO_LAUNCH, while the Program's derived adequacy fields are clean."

  - priority: 35
    category: business_fiscal
    check: "budget_reserved_cents + budget_spent_cents + evaluation_fee_cents <= credential_budget_cents on the BILLED program"
    error_id: ERR_CREDENTIAL_BUDGET_EXCEEDED
    http_status: 422
    applies_to: ["POST /credential-evaluations"]
    description: "The fee is computed first so the ceiling is checked against the exact frozen amount. PAIR-B LOW SIDE — reported only when ERR_ACCREDITOR_REVIEW_LOCKOUT at priority 12 is satisfied."

  # ---- Priority-conflict pairs deliberately built into this ladder ----
  # PAIR-A  10 ERR_TERM_LOCKED (state)              vs 24 ERR_TEACHING_BLOCK_CONFLICT (business_constraint)
  # PAIR-B  12 ERR_ACCREDITOR_REVIEW_LOCKOUT (business_safety) vs 35 ERR_CREDENTIAL_BUDGET_EXCEEDED (business_fiscal)
  # PAIR-C  16 ERR_DOSSIER_NOT_VERIFIED (business_referential) vs 28 ERR_CONTRACT_WINDOW_CLOSED (business_temporal)

# =============================================================================
# §1.5 API Endpoint Table
# 70 endpoints. `roles` lists every role allowed to call the endpoint.
# =============================================================================
endpoints:

  # ------------------------------------------------- logical clock (test-driving)
  - method: POST
    path: /_clock/set_current_utc
    description: "Test-driving endpoint. Sets the service's logical clock, which is the ONLY source of 'now' for every temporal rule (contract windows, accreditor lockout, response due dates, PD activity dates, professional-development cycles). The logical clock defaults to 2026-08-01T00:00:00Z when it has never been set."
    roles: [SystemAdmin]
    success_code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects: ["professional_development_compliance is re-evaluated lazily on the next read; no stored row is mutated"]

  - method: GET
    path: /_clock
    description: "Reads the current logical clock instant. Returns 2026-08-01T00:00:00Z when the clock has never been set."
    roles: &read_roles [SystemAdmin, RegistrarOfficer, CredentialAnalyst, ProgramDean, AccreditationLiaison, AccreditorReviewer]
    success_code: 200
    input: []
    output: "{ current_utc: datetime }"
    side_effects: []

  # ----------------------------------------------------------------- disciplines
  - method: POST
    path: /disciplines
    description: "Creates a DisciplineTaxonomy node. parent_discipline_id may point at an existing node to form one level of parenthood."
    roles: [SystemAdmin]
    success_code: 201
    input: [code, name, "parent_discipline_id?", "min_graduate_credit_hours?", required_terminal_degree_level]
    output: DisciplineTaxonomy
    side_effects: []

  - method: POST
    path: /disciplines/{disciplineId}
    description: "Updates a DisciplineTaxonomy node's mutable fields. code is immutable once set."
    roles: [SystemAdmin]
    success_code: 200
    input: ["name?", "parent_discipline_id?", "min_graduate_credit_hours?", "required_terminal_degree_level?"]
    output: DisciplineTaxonomy
    side_effects: ["Alignment scores computed AFTER this call use the new parent; already-persisted CourseAssignment.alignment_score values are not rewritten"]

  - method: GET
    path: /disciplines/{disciplineId}
    description: "Reads one DisciplineTaxonomy node."
    roles: *read_roles
    success_code: 200
    input: []
    output: DisciplineTaxonomy
    side_effects: []

  - method: GET
    path: /disciplines
    description: "Lists DisciplineTaxonomy nodes. parent_discipline_id makes the self-referential children of a node reachable."
    roles: *read_roles
    success_code: 200
    input: ["parent_discipline_id?", "code?", "required_terminal_degree_level?", "limit?", "offset?"]
    output: "DisciplineTaxonomy[]"
    side_effects: []

  # -------------------------------------------------------------------- programs
  - method: POST
    path: /programs
    description: "Creates a Program. qualification_policy and adequacy_basis are the two feature flags that select calculation variants for everything downstream."
    roles: [SystemAdmin]
    success_code: 201
    input: [name, discipline_id, degree_level, qualification_policy, adequacy_basis, "min_terminal_ratio?", "is_substantive_change?", credential_budget_cents]
    output: Program
    side_effects: ["launch_status = PLANNING, adequacy_ratio = 0.0, adequacy_status = INSUFFICIENT, both budget ledgers = 0"]

  - method: GET
    path: /programs/{programId}
    description: "Reads one Program with its live derived adequacy and budget fields."
    roles: *read_roles
    success_code: 200
    input: []
    output: Program
    side_effects: []

  - method: GET
    path: /programs
    description: "Lists Programs. discipline_id and adequacy_term_id make the programs of a discipline and of an adequacy anchor term reachable."
    roles: *read_roles
    success_code: 200
    input: ["discipline_id?", "adequacy_term_id?", "launch_status?", "adequacy_status?", "qualification_policy?", "adequacy_basis?", "limit?", "offset?"]
    output: "Program[]"
    side_effects: []

  - method: GET
    path: /programs/{programId}/adequacy
    description: "Computed read of program_faculty_adequacy against the program's anchor roster for a term. basis_override recomputes under the OTHER variant without persisting anything, which is how the HEADCOUNT vs CREDIT_HOUR_COVERAGE divergence is observed side by side."
    roles: *read_roles
    success_code: 200
    input: [term_id, "basis_override?"]
    output: "{ program_id: string, term_id: string, basis_applied: string, numerator: number, denominator: number, adequacy_ratio: number, adequacy_status: string, unqualified_assignment_count: integer, roster_id: string }"
    side_effects: []

  - method: POST
    path: /programs/{programId}/launch-review
    description: "Dean submits the program for faculty-adequacy review against a term's roster. PLANNING -> ADEQUACY_REVIEW and ADEQUACY_DENIED -> ADEQUACY_REVIEW."
    roles: [ProgramDean]
    success_code: 200
    input: [term_id]
    output: Program
    side_effects: ["program_faculty_adequacy recomputed and persisted onto adequacy_ratio / adequacy_status / adequacy_term_id / unqualified_assignment_count", "Program.version increments by 1"]

  - method: POST
    path: /programs/{programId}/launch-decision
    description: "Accreditation liaison approves or denies the launch. APPROVE requires ADEQUATE adequacy with zero unqualified assignments and, for a substantive change, a CLOSED_ACCEPTED SUBSTANTIVE_CHANGE review."
    roles: [AccreditationLiaison]
    success_code: 200
    input: [decision, "rationale?"]
    output: Program
    side_effects: ["launch_status moves to APPROVED_TO_LAUNCH or ADEQUACY_DENIED", "Program.version increments by 1"]

  # ----------------------------------------------------------------------- terms
  - method: POST
    path: /terms
    description: "Creates a Term in PLANNING. start_date, end_date and census_date are ISO dates and must satisfy start_date <= census_date <= end_date."
    roles: [SystemAdmin, RegistrarOfficer]
    success_code: 201
    input: [code, start_date, end_date, census_date]
    output: Term
    side_effects: ["status = PLANNING"]

  - method: GET
    path: /terms/{termId}
    description: "Reads one Term."
    roles: *read_roles
    success_code: 200
    input: []
    output: Term
    side_effects: []

  - method: GET
    path: /terms
    description: "Lists Terms."
    roles: *read_roles
    success_code: 200
    input: ["status?", "code?", "limit?", "offset?"]
    output: "Term[]"
    side_effects: []

  - method: POST
    path: /terms/{termId}/status
    description: "Drives the Term lifecycle PLANNING -> OPEN -> ROSTER_LOCKED -> CLOSED, with the ROSTER_LOCKED -> OPEN revision loop."
    roles: [RegistrarOfficer]
    success_code: 200
    input: [to_status]
    output: Term
    side_effects: ["Closing the term drops every assignment of that term out of faculty_assigned_credit_hours_ledger", "Term.version increments by 1"]

  # -------------------------------------------------------------- faculty members
  - method: POST
    path: /faculty-members
    description: "Creates a FacultyMember in dossier_status INCOMPLETE and appointment_status PROSPECT."
    roles: [RegistrarOfficer]
    success_code: 201
    input: [full_name, email, employment_class, home_program_id]
    output: FacultyMember
    side_effects: ["deficiency_codes = [], assigned_credit_hours = 0, pd_hours_current_cycle = 0, pd_compliant = false"]

  - method: POST
    path: /faculty-members/{facultyMemberId}
    description: "Updates a FacultyMember's mutable identity fields. Changing home_program_id does NOT retroactively rewrite discipline_relevant on existing PD records."
    roles: [RegistrarOfficer]
    success_code: 200
    input: ["full_name?", "email?", "employment_class?", "home_program_id?"]
    output: FacultyMember
    side_effects: ["professional_development_compliance re-runs (the required-hours threshold follows employment_class)", "FacultyMember.version increments by 1"]

  - method: GET
    path: /faculty-members/{facultyMemberId}
    description: "Reads one FacultyMember with both live state dimensions, the credit-hour ledger and the PD compliance fields. An Instructor may read only their own row."
    roles: [SystemAdmin, RegistrarOfficer, CredentialAnalyst, ProgramDean, AccreditationLiaison, AccreditorReviewer, Instructor]
    success_code: 200
    input: []
    output: FacultyMember
    side_effects: []

  - method: GET
    path: /faculty-members
    description: "Lists FacultyMembers. home_program_id makes the faculty of a program reachable."
    roles: *read_roles
    success_code: 200
    input: ["home_program_id?", "employment_class?", "dossier_status?", "appointment_status?", "pd_compliant?", "limit?", "offset?"]
    output: "FacultyMember[]"
    side_effects: []

  - method: POST
    path: /faculty-members/{facultyMemberId}/separation
    description: "Separates a faculty member. Terminal for appointment_status and the trigger for CASCADE-C."
    roles: [RegistrarOfficer]
    success_code: 200
    input: ["reason?"]
    output: FacultyMember
    side_effects:
      - "CASCADE-C: active assignments -> WITHDRAWN, assigned_credit_hours -> 0, instructor_of_record mirrors cleared, GENERATED rosters recomputed, Programs rewritten, ISSUED/COUNTERSIGNED contracts -> VOIDED"
      - "FacultyMember.version and every touched entity's version increment by 1"

  # ----------------------------------------------------------- credential records
  - method: POST
    path: /credential-records
    description: "Files a credential (degree or non-degree graduate coursework) for a faculty member. Created with verification_status PENDING and transcript_status NOT_REQUESTED."
    roles: [RegistrarOfficer]
    success_code: 201
    input: [faculty_member_id, degree_level, discipline_id, conferring_institution, "is_foreign_institution?", "graduate_credit_hours_in_discipline?"]
    output: CredentialRecord
    side_effects: ["faculty_dossier_recompute runs: dossier_status becomes UNDER_REVIEW and a DEFICIENT dossier can return to UNDER_REVIEW", "FacultyMember.version increments by 1"]

  - method: GET
    path: /credential-records/{credentialRecordId}
    description: "Reads one CredentialRecord including its effective (post-evaluation) level and discipline."
    roles: *read_roles
    success_code: 200
    input: []
    output: CredentialRecord
    side_effects: []

  - method: GET
    path: /credential-records
    description: "Lists CredentialRecords. faculty_member_id, discipline_id and effective_discipline_id make every referenced parent's children reachable."
    roles: *read_roles
    success_code: 200
    input: ["faculty_member_id?", "discipline_id?", "effective_discipline_id?", "verification_status?", "transcript_status?", "is_foreign_institution?", "limit?", "offset?"]
    output: "CredentialRecord[]"
    side_effects: []

  - method: GET
    path: /faculty-members/{facultyMemberId}/credential-records
    description: "Sub-resource listing of one faculty member's credential evidence set, ordered by created_at ASC."
    roles: [SystemAdmin, RegistrarOfficer, CredentialAnalyst, ProgramDean, AccreditationLiaison, AccreditorReviewer, Instructor]
    success_code: 200
    input: ["verification_status?", "limit?", "offset?"]
    output: "CredentialRecord[]"
    side_effects: []

  - method: POST
    path: /credential-records/{credentialRecordId}/transcript
    description: "Advances official transcript collection: NOT_REQUESTED -> REQUESTED -> OFFICIAL_RECEIVED, with UNOFFICIAL_ONLY as an intermediate. OFFICIAL_RECEIVED is terminal for this dimension."
    roles: [RegistrarOfficer]
    success_code: 200
    input: [transcript_status]
    output: CredentialRecord
    side_effects: ["faculty_dossier_recompute runs; TRANSCRIPT_NOT_OFFICIAL enters or leaves deficiency_codes", "CredentialRecord.version and FacultyMember.version increment by 1"]

  - method: POST
    path: /credential-records/{credentialRecordId}/verification
    description: "Analyst verifies, rejects or repudiates a credential. REPUDIATE is the trigger for the depth-5 CASCADE-A."
    roles: [CredentialAnalyst]
    success_code: 200
    input: [decision, "note?"]
    output: CredentialRecord
    side_effects:
      - "verified_by_user_id = X-User-ID (this is the value the segregation-of-duties rule later compares against)"
      - "faculty_dossier_recompute runs; a VERIFY that empties deficiency_codes also moves appointment_status PROSPECT -> CREDENTIALED_ELIGIBLE"
      - "REPUDIATE fires CASCADE-A hops 1-5 across FacultyMember, CourseAssignment, FacultyRoster, Program and AccreditorReview"
      - "CredentialRecord.version, FacultyMember.version and every touched entity's version increment by 1"

  # ------------------------------------------------------- credential evaluations
  - method: POST
    path: /credential-evaluations
    description: "Orders a foreign-credential evaluation. evaluation_fee_cents is computed and FROZEN onto fee_cents here, and the fee is reserved against the billed program's budget."
    roles: [CredentialAnalyst]
    success_code: 201
    input: [credential_record_id, billed_program_id, evaluator_agency, page_count, service_level]
    output: CredentialEvaluation
    side_effects:
      - "fee_cents = evaluation_fee_cents(page_count, service_level, record.is_foreign_institution)"
      - "billed Program.budget_reserved_cents increases by fee_cents and Program.version increments by 1"
      - "status = ORDERED"

  - method: GET
    path: /credential-evaluations/{evaluationId}
    description: "Reads one CredentialEvaluation including its frozen fee and, once COMPLETED, its allocation_shares."
    roles: *read_roles
    success_code: 200
    input: []
    output: CredentialEvaluation
    side_effects: []

  - method: GET
    path: /credential-evaluations
    description: "Lists CredentialEvaluations. credential_record_id, billed_program_id and equivalency_discipline_id make every referenced parent's children reachable."
    roles: *read_roles
    success_code: 200
    input: ["credential_record_id?", "billed_program_id?", "equivalency_discipline_id?", "status?", "service_level?", "limit?", "offset?"]
    output: "CredentialEvaluation[]"
    side_effects: []

  - method: POST
    path: /credential-evaluations/{evaluationId}/status
    description: "Drives ORDERED -> IN_REVIEW -> COMPLETED, or ORDERED/IN_REVIEW -> VOIDED. COMPLETED requires the full equivalency triplet and runs evaluation_cost_allocation."
    roles: [CredentialAnalyst]
    success_code: 200
    input: [to_status, "equivalency_degree_level?", "equivalency_discipline_id?", "equivalency_verdict?"]
    output: CredentialEvaluation
    side_effects:
      - "COMPLETED: reservation released, evaluation_cost_allocation writes allocation_shares, every receiving Program.budget_spent_cents increases by its share_cents"
      - "COMPLETED + EQUIVALENT: the CredentialRecord's effective_degree_level / effective_discipline_id are rewritten and faculty_dossier_recompute runs"
      - "VOIDED: reservation released with no spend — the compensating path"
      - "CredentialEvaluation.version and every touched entity's version increment by 1"

  # -------------------------------------------------------------- course sections
  - method: POST
    path: /course-sections
    description: "Dean creates a section of their own program in a term that is still PLANNING or OPEN. program_id must equal X-User-ID. course_level is LOWER_DIVISION | UPPER_DIVISION | GRADUATE | DOCTORAL, delivery_mode is IN_PERSON | ONLINE_SYNC | ONLINE_ASYNC, meeting_days is a subset of MO TU WE TH FR SA SU (may be empty for ONLINE_ASYNC), and building_code is ONLINE for online delivery — a differing building_code is what adds the 15-minute travel buffer. meeting_end_minute is the EXCLUSIVE upper bound of the meeting block and both minute fields lie in [0,1440]."
    roles: [ProgramDean]
    success_code: 201
    input: [course_code, title, program_id, term_id, discipline_id, course_level, credit_hours, delivery_mode, building_code, meeting_days, meeting_start_minute, meeting_end_minute]
    output: CourseSection
    side_effects: ["instructor_of_record_id = null"]

  - method: GET
    path: /course-sections/{sectionId}
    description: "Reads one CourseSection including its instructor_of_record_id mirror."
    roles: *read_roles
    success_code: 200
    input: []
    output: CourseSection
    side_effects: []

  - method: GET
    path: /course-sections
    description: "Lists CourseSections. program_id, term_id, discipline_id and instructor_of_record_id make every referenced parent's children reachable."
    roles: *read_roles
    success_code: 200
    input: ["program_id?", "term_id?", "discipline_id?", "instructor_of_record_id?", "course_level?", "delivery_mode?", "limit?", "offset?"]
    output: "CourseSection[]"
    side_effects: []

  # ----------------------------------------------------------- course assignments
  - method: POST
    path: /course-assignments
    description: "Assigns a faculty member to a section and immediately runs assignment_qualification_determination, so the response already carries status, qualification_basis, exception_code and alignment_score. assignment_role is INSTRUCTOR_OF_RECORD | CO_INSTRUCTOR. expected_section_version is the OCC guard and must equal the current CourseSection.version. The section's program_id must equal X-User-ID."
    roles: [ProgramDean]
    success_code: 201
    input: [course_section_id, faculty_member_id, assignment_role, expected_section_version]
    output: CourseAssignment
    side_effects:
      - "assignment_qualification_determination decides VERIFIED_QUALIFIED or EXCEPTION_FLAGGED immediately"
      - "FacultyMember.assigned_credit_hours increases by CourseSection.credit_hours"
      - "An INSTRUCTOR_OF_RECORD assignment supersedes the section's incumbent INSTRUCTOR_OF_RECORD assignment and re-points CourseSection.instructor_of_record_id"
      - "CourseSection.version increments by 1 (the OCC parent), plus FacultyMember.version and any superseded assignment's version"
      - "The covering GENERATED FacultyRoster and owning Program are recomputed"

  - method: GET
    path: /course-assignments/{assignmentId}
    description: "Reads one CourseAssignment with its qualification verdict."
    roles: *read_roles
    success_code: 200
    input: []
    output: CourseAssignment
    side_effects: []

  - method: GET
    path: /course-assignments
    description: "Lists CourseAssignments. course_section_id, faculty_member_id and superseded_by_assignment_id make every referenced parent's children reachable."
    roles: *read_roles
    success_code: 200
    input: ["course_section_id?", "faculty_member_id?", "superseded_by_assignment_id?", "status?", "exception_code?", "qualification_basis?", "limit?", "offset?"]
    output: "CourseAssignment[]"
    side_effects: []

  - method: GET
    path: /course-sections/{sectionId}/course-assignments
    description: "Sub-resource listing of one section's assignments, ordered by created_at ASC."
    roles: *read_roles
    success_code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CourseAssignment[]"
    side_effects: []

  - method: POST
    path: /course-assignments/{assignmentId}/remediation
    description: "Dean opens remediation on a flagged assignment: EXCEPTION_FLAGGED -> REMEDIATION_IN_PROGRESS."
    roles: [ProgramDean]
    success_code: 200
    input: [remediation_action, "note?"]
    output: CourseAssignment
    side_effects: ["The covering GENERATED roster recomputes (flagged_exception_count is unchanged; the row now counts in the risk index's exception_persistence term)", "CourseAssignment.version increments by 1"]

  - method: POST
    path: /course-assignments/{assignmentId}/reverification
    description: "Analyst re-runs assignment_qualification_determination on a remediating assignment: REMEDIATION_IN_PROGRESS -> VERIFIED_QUALIFIED or back to EXCEPTION_FLAGGED."
    roles: [CredentialAnalyst]
    success_code: 200
    input: []
    output: CourseAssignment
    side_effects: ["qualification_basis, exception_code, remediation_action and alignment_score are rewritten", "The covering GENERATED roster and owning Program are recomputed", "CourseAssignment.version increments by 1"]

  - method: POST
    path: /course-assignments/{assignmentId}/withdrawal
    description: "Dean withdraws an assignment. Terminal, and the compensating path for the credit-hour ledger."
    roles: [ProgramDean]
    success_code: 200
    input: ["reason?"]
    output: CourseAssignment
    side_effects:
      - "FacultyMember.assigned_credit_hours decreases by exactly CourseSection.credit_hours"
      - "CourseSection.instructor_of_record_id resets to null when this row held it"
      - "Any SUBMITTED or UNDER_REVIEW TestedExperienceJustification for this assignment moves to WITHDRAWN"
      - "The covering GENERATED roster and owning Program are recomputed"
      - "CourseAssignment.version and every touched entity's version increment by 1"

  # ------------------------------------------ tested experience justifications
  - method: POST
    path: /tested-experience-justifications
    description: "Dean drafts a tested-experience justification for a flagged assignment of their own program. alternative_credential_codes is the documented alternative-credential list whose COUNT feeds codes_factor, industry_certification_level is NONE | PRACTITIONER | ADVANCED | BOARD_CERTIFIED, and tested_experience_score is computed at creation."
    roles: [ProgramDean]
    success_code: 201
    input: [course_assignment_id, narrative, alternative_credential_codes, documented_years_experience, industry_certification_level, "supervisor_attestation_on_file?"]
    output: TestedExperienceJustification
    side_effects: ["status = DRAFT, tested_experience_score computed"]

  - method: POST
    path: /tested-experience-justifications/{justificationId}
    description: "Dean edits a DRAFT justification's evidence fields; tested_experience_score is recomputed."
    roles: [ProgramDean]
    success_code: 200
    input: ["narrative?", "alternative_credential_codes?", "documented_years_experience?", "industry_certification_level?", "supervisor_attestation_on_file?"]
    output: TestedExperienceJustification
    side_effects: ["tested_experience_score recomputed", "version increments by 1"]

  - method: GET
    path: /tested-experience-justifications/{justificationId}
    description: "Reads one TestedExperienceJustification with its score and decision trail."
    roles: *read_roles
    success_code: 200
    input: []
    output: TestedExperienceJustification
    side_effects: []

  - method: GET
    path: /tested-experience-justifications
    description: "Lists TestedExperienceJustifications. course_assignment_id makes an assignment's justifications reachable."
    roles: *read_roles
    success_code: 200
    input: ["course_assignment_id?", "status?", "industry_certification_level?", "limit?", "offset?"]
    output: "TestedExperienceJustification[]"
    side_effects: []

  - method: POST
    path: /tested-experience-justifications/{justificationId}/status
    description: "Dean submits or withdraws a justification: DRAFT -> SUBMITTED, or DRAFT/SUBMITTED -> WITHDRAWN."
    roles: [ProgramDean]
    success_code: 200
    input: [to_status]
    output: TestedExperienceJustification
    side_effects: ["SUBMITTED recomputes tested_experience_score from the current field values", "version increments by 1"]

  - method: POST
    path: /tested-experience-justifications/{justificationId}/review
    description: "Analyst takes the justification under review: SUBMITTED -> UNDER_REVIEW."
    roles: [CredentialAnalyst]
    success_code: 200
    input: []
    output: TestedExperienceJustification
    side_effects: ["version increments by 1"]

  - method: POST
    path: /tested-experience-justifications/{justificationId}/decision
    description: "Analyst approves or rejects: UNDER_REVIEW -> APPROVED or REJECTED. APPROVE fires the three-hop CASCADE-B; REJECT fires nothing. Segregation of duties applies."
    roles: [CredentialAnalyst]
    success_code: 200
    input: [decision, decision_rationale]
    output: TestedExperienceJustification
    side_effects:
      - "decided_by_user_id = X-User-ID"
      - "APPROVE: CASCADE-B hop 1 sets the assignment to VERIFIED_QUALIFIED / TESTED_EXPERIENCE, hop 2 recomputes the roster (flagged_exception_count falls, adequacy_ratio_snapshot does NOT rise), hop 3 rewrites the Program"
      - "REJECT: the assignment, roster and program are untouched"
      - "version increments by 1 on every entity the cascade touches"

  - method: POST
    path: /tested-experience-justifications/{justificationId}/revision
    description: "Dean re-opens a rejected justification: REJECTED -> DRAFT, clearing the decision trail."
    roles: [ProgramDean]
    success_code: 200
    input: []
    output: TestedExperienceJustification
    side_effects: ["decided_by_user_id and decision_rationale reset to null", "version increments by 1"]

  # ------------------------------------------------------------- faculty rosters
  - method: POST
    path: /faculty-rosters
    description: "Opens a DRAFT roster for a (program, term); program_id must equal X-User-ID when the caller is a ProgramDean. A CERTIFIED roster for the same pair is SUPERSEDED by this call; a DRAFT or GENERATED one is a duplicate and is rejected."
    roles: [AccreditationLiaison, ProgramDean]
    success_code: 201
    input: [program_id, term_id]
    output: FacultyRoster
    side_effects: ["status = DRAFT, generation_epoch = 0, all snapshot fields 0, certification_readiness = BLOCKED", "Any CERTIFIED roster for the same pair moves to SUPERSEDED and its assignments become mutable again"]

  - method: GET
    path: /faculty-rosters/{rosterId}
    description: "Reads one FacultyRoster with its snapshot, blocking_reason_codes and certification_readiness."
    roles: *read_roles
    success_code: 200
    input: []
    output: FacultyRoster
    side_effects: []

  - method: GET
    path: /faculty-rosters
    description: "Lists FacultyRosters. program_id and term_id make a program's and a term's rosters reachable."
    roles: *read_roles
    success_code: 200
    input: ["program_id?", "term_id?", "status?", "certification_readiness?", "limit?", "offset?"]
    output: "FacultyRoster[]"
    side_effects: []

  - method: GET
    path: /faculty-rosters/{rosterId}/entries
    description: "Computed read of the roster's included assignment set (CourseSection.program_id and term_id match the roster and status is not SUPERSEDED or WITHDRAWN), ordered by created_at ASC. Exceptions are visible through each row's exception_code; only_flagged=true restricts the result to EXCEPTION_FLAGGED and REMEDIATION_IN_PROGRESS rows."
    roles: *read_roles
    success_code: 200
    input: ["only_flagged?", "limit?", "offset?"]
    output: "CourseAssignment[]"
    side_effects: []

  - method: POST
    path: /faculty-rosters/{rosterId}/generate
    description: "Generates (or regenerates) the roster by term and course: every included assignment is re-decided, the snapshot is rebuilt and exceptions are flagged. DRAFT -> GENERATED and GENERATED -> GENERATED."
    roles: [AccreditationLiaison]
    success_code: 200
    input: []
    output: FacultyRoster
    side_effects:
      - "generation_epoch increases by 1 on every call"
      - "PENDING_VERIFICATION and EXCEPTION_FLAGGED assignments are re-decided by assignment_qualification_determination; REMEDIATION_IN_PROGRESS rows are left alone"
      - "roster_snapshot_recompute writes every snapshot field, blocking_reason_codes and certification_readiness"
      - "Program.adequacy_ratio / adequacy_status / adequacy_term_id / unqualified_assignment_count are rewritten"
      - "FacultyRoster.version, every re-decided CourseAssignment.version and Program.version increment by 1"

  - method: POST
    path: /faculty-rosters/{rosterId}/certification
    description: "Certifies a READY roster: GENERATED -> CERTIFIED. Freezes the included assignments. Segregation of duties applies against justification deciders."
    roles: [AccreditationLiaison]
    success_code: 200
    input: ["attestation_note?"]
    output: FacultyRoster
    side_effects: ["certified_at = logical clock instant, certified_by_user_id = X-User-ID", "Included assignments become immutable (ERR_ROSTER_CERTIFIED)", "FacultyRoster.version increments by 1"]

  # ------------------------------------------------------------ faculty contracts
  - method: POST
    path: /faculty-contracts
    description: "Dean issues a contract for a credentialed faculty member before the term starts. The faculty member's home_program_id must equal X-User-ID, the submitted employment_class must equal the faculty member's current employment_class, dossier_status must be VERIFIED, and expected_faculty_version is the OCC guard that must equal the current FacultyMember.version."
    roles: [ProgramDean]
    success_code: 201
    input: [faculty_member_id, term_id, employment_class, contract_credit_hours, expected_faculty_version]
    output: FacultyContract
    side_effects:
      - "status = ISSUED, issued_at = logical clock instant"
      - "dossier_snapshot_status and credential_snapshot_version pin the evidence the dean relied on"
      - "Any earlier ISSUED contract for the same (faculty_member_id, term_id) moves to SUPERSEDED"
      - "FacultyMember.version increments by 1 (the OCC parent)"

  - method: GET
    path: /faculty-contracts/{contractId}
    description: "Reads one FacultyContract with its pinned credential snapshot. An Instructor may read only their own contract."
    roles: [SystemAdmin, RegistrarOfficer, CredentialAnalyst, ProgramDean, AccreditationLiaison, AccreditorReviewer, Instructor]
    success_code: 200
    input: []
    output: FacultyContract
    side_effects: []

  - method: GET
    path: /faculty-contracts
    description: "Lists FacultyContracts. faculty_member_id and term_id make a faculty member's and a term's contracts reachable."
    roles: *read_roles
    success_code: 200
    input: ["faculty_member_id?", "term_id?", "status?", "employment_class?", "limit?", "offset?"]
    output: "FacultyContract[]"
    side_effects: []

  - method: POST
    path: /faculty-contracts/{contractId}/countersignature
    description: "Instructor countersigns their own ISSUED contract: appointment_status CREDENTIALED_ELIGIBLE -> CONTRACTED."
    roles: [Instructor]
    success_code: 200
    input: []
    output: FacultyContract
    side_effects: ["countersigned_at = logical clock instant", "FacultyMember.appointment_status becomes CONTRACTED", "FacultyContract.version and FacultyMember.version increment by 1"]

  - method: POST
    path: /faculty-contracts/{contractId}/void
    description: "Dean voids an ISSUED or COUNTERSIGNED contract. Compensating path for appointment_status."
    roles: [ProgramDean]
    success_code: 200
    input: ["reason?"]
    output: FacultyContract
    side_effects: ["When no other contract of that faculty remains in {ISSUED, COUNTERSIGNED}, appointment_status returns to CREDENTIALED_ELIGIBLE — never to PROSPECT", "FacultyContract.version and FacultyMember.version increment by 1"]

  # -------------------------------------------------- professional development
  - method: POST
    path: /pd-records
    description: "Logs a professional development activity. faculty_member_id must equal X-User-ID when the caller is an Instructor, activity_type is CONFERENCE | CERTIFICATION | COURSEWORK | INDUSTRY_PLACEMENT | PUBLICATION, and activity_date is an ISO date not after the logical clock date. discipline_relevant is computed at creation from the faculty's home program discipline and is never rewritten."
    roles: [Instructor, RegistrarOfficer]
    success_code: 201
    input: [faculty_member_id, discipline_id, activity_type, contact_hours, activity_date]
    output: ProfessionalDevelopmentRecord
    side_effects: ["status = SUBMITTED, discipline_relevant computed via discipline_alignment_score >= 0.70", "pd_hours_current_cycle is NOT changed yet — only VERIFIED records count"]

  - method: GET
    path: /pd-records/{pdRecordId}
    description: "Reads one ProfessionalDevelopmentRecord."
    roles: [SystemAdmin, RegistrarOfficer, CredentialAnalyst, ProgramDean, AccreditationLiaison, AccreditorReviewer, Instructor]
    success_code: 200
    input: []
    output: ProfessionalDevelopmentRecord
    side_effects: []

  - method: GET
    path: /pd-records
    description: "Lists ProfessionalDevelopmentRecords. faculty_member_id and discipline_id make a faculty member's and a discipline's PD activity reachable."
    roles: *read_roles
    success_code: 200
    input: ["faculty_member_id?", "discipline_id?", "status?", "activity_type?", "discipline_relevant?", "limit?", "offset?"]
    output: "ProfessionalDevelopmentRecord[]"
    side_effects: []

  - method: POST
    path: /pd-records/{pdRecordId}/status
    description: "Analyst verifies or rejects a PD record. Only VERIFIED records enter the compliance window."
    roles: [CredentialAnalyst]
    success_code: 200
    input: [to_status]
    output: ProfessionalDevelopmentRecord
    side_effects: ["professional_development_compliance re-runs: FacultyMember.pd_hours_current_cycle and pd_compliant are rewritten", "version increments by 1 on the record and the faculty member"]

  # ---------------------------------------------------------- accreditor reviews
  - method: POST
    path: /accreditor-reviews
    description: "Schedules an accreditor review over a FULLY CLOSED [window_start_date, window_end_date] date interval. Windows of non-terminal reviews of the same program may not overlap, and touching endpoints DO overlap."
    roles: [AccreditorReviewer]
    success_code: 201
    input: [program_id, review_type, window_start_date, window_end_date]
    output: AccreditorReview
    side_effects: ["status = SCHEDULED, finding_count = 0, response_round = 0, all risk fields 0"]

  - method: GET
    path: /accreditor-reviews/{reviewId}
    description: "Reads one AccreditorReview with its risk metrics, unqualified_assignment_ids and response state."
    roles: *read_roles
    success_code: 200
    input: []
    output: AccreditorReview
    side_effects: []

  - method: GET
    path: /accreditor-reviews
    description: "Lists AccreditorReviews. program_id makes a program's reviews reachable."
    roles: *read_roles
    success_code: 200
    input: ["program_id?", "status?", "review_type?", "risk_tier?", "limit?", "offset?"]
    output: "AccreditorReview[]"
    side_effects: []

  - method: POST
    path: /accreditor-reviews/{reviewId}/status
    description: "Drives the review lifecycle: SCHEDULED -> IN_PROGRESS (only inside the window), FINDINGS_ISSUED/RESPONSE_SUBMITTED -> CLOSED_ACCEPTED (only when the program is clean), RESPONSE_SUBMITTED -> REMEDIATION_REQUIRED (bounce back) or CLOSED_SANCTION (only from response_round >= 2)."
    roles: [AccreditorReviewer]
    success_code: 200
    input: [to_status, "note?"]
    output: AccreditorReview
    side_effects: ["IN_PROGRESS starts the assignment lockout for the program", "REMEDIATION_REQUIRED recomputes accreditor_review_risk_index and resets response_due_date from the clock; response_round is NOT reset", "Closing ends the lockout", "AccreditorReview.version increments by 1"]

  - method: POST
    path: /accreditor-reviews/{reviewId}/findings
    description: "Issues findings against the program's anchor roster. finding_count > 0 branches to REMEDIATION_REQUIRED and moves the listed flagged assignments into remediation; finding_count == 0 branches to FINDINGS_ISSUED with no cascade."
    roles: [AccreditorReviewer]
    success_code: 200
    input: [finding_count, "narrative?"]
    output: AccreditorReview
    side_effects:
      - "unqualified_assignment_ids = the anchor roster's PENDING_VERIFICATION / EXCEPTION_FLAGGED / REMEDIATION_IN_PROGRESS assignments ordered by created_at ASC"
      - "accreditor_review_risk_index writes preliminary_risk_index, risk_tier, risk_index and response_due_date from the state observed BEFORE the remediation cascade"
      - "finding_count > 0: every listed EXCEPTION_FLAGGED assignment moves to REMEDIATION_IN_PROGRESS with remediation_action = REASSIGN_PENDING, then the anchor roster and Program are recomputed"
      - "AccreditorReview.version and every touched entity's version increment by 1"

  - method: POST
    path: /accreditor-reviews/{reviewId}/response
    description: "Liaison files the remediation response: REMEDIATION_REQUIRED -> RESPONSE_SUBMITTED, allowed up to and including response_due_date."
    roles: [AccreditationLiaison]
    success_code: 200
    input: [response_narrative]
    output: AccreditorReview
    side_effects: ["response_round increases by 1", "AccreditorReview.version increments by 1"]

# =============================================================================
# §1.6 Error Code Catalog — 46 codes, every one triggerable
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http_status: 401, condition: "X-User-ID header missing or empty", applies_to: ["all"] }
  - { id: ERR_FORBIDDEN_ROLE, http_status: 403, condition: "X-Role is missing or is not in the endpoint's authorized roles", applies_to: ["all"] }
  - { id: ERR_NOT_RESOURCE_OWNER, http_status: 403, condition: "An entity_backed role addresses a resource it does not own (ProgramDean whose X-User-ID is not the owning Program.id; Instructor whose X-User-ID is not the FacultyMember.id)", applies_to: ["POST /programs/{programId}/launch-review", "POST /course-sections", "POST /course-assignments", "POST /course-assignments/{assignmentId}/remediation", "POST /course-assignments/{assignmentId}/withdrawal", "POST /tested-experience-justifications", "POST /tested-experience-justifications/{justificationId}", "POST /tested-experience-justifications/{justificationId}/status", "POST /tested-experience-justifications/{justificationId}/revision", "POST /faculty-rosters", "POST /faculty-contracts", "POST /faculty-contracts/{contractId}/void", "POST /faculty-contracts/{contractId}/countersignature", "POST /pd-records", "GET /faculty-members/{facultyMemberId}", "GET /faculty-contracts/{contractId}", "GET /pd-records/{pdRecordId}", "GET /faculty-members/{facultyMemberId}/credential-records"] }
  - { id: ERR_INVALID_REQUEST, http_status: 400, condition: "Missing required field, wrong type, unknown enum literal, out-of-range number, malformed date, limit outside [1,100] or negative offset", applies_to: ["all"] }

  # ---- per-entity 404s ----
  - { id: ERR_DISCIPLINE_NOT_FOUND, http_status: 404, condition: "disciplineId path parameter or a discipline FK in the body does not exist", applies_to: ["GET /disciplines/{disciplineId}", "POST /disciplines/{disciplineId}", "POST /disciplines", "POST /programs", "POST /credential-records", "POST /course-sections", "POST /pd-records", "POST /credential-evaluations/{evaluationId}/status"] }
  - { id: ERR_PROGRAM_NOT_FOUND, http_status: 404, condition: "programId path parameter or a program FK in the body does not exist", applies_to: ["GET /programs/{programId}", "GET /programs/{programId}/adequacy", "POST /programs/{programId}/launch-review", "POST /programs/{programId}/launch-decision", "POST /faculty-members", "POST /faculty-members/{facultyMemberId}", "POST /course-sections", "POST /credential-evaluations", "POST /faculty-rosters", "POST /accreditor-reviews"] }
  - { id: ERR_TERM_NOT_FOUND, http_status: 404, condition: "termId path parameter or a term FK in the body does not exist", applies_to: ["GET /terms/{termId}", "POST /terms/{termId}/status", "POST /course-sections", "POST /faculty-rosters", "POST /faculty-contracts", "GET /programs/{programId}/adequacy", "POST /programs/{programId}/launch-review"] }
  - { id: ERR_FACULTY_NOT_FOUND, http_status: 404, condition: "facultyMemberId path parameter or a faculty FK in the body does not exist", applies_to: ["GET /faculty-members/{facultyMemberId}", "POST /faculty-members/{facultyMemberId}", "POST /faculty-members/{facultyMemberId}/separation", "GET /faculty-members/{facultyMemberId}/credential-records", "POST /credential-records", "POST /course-assignments", "POST /faculty-contracts", "POST /pd-records"] }
  - { id: ERR_CREDENTIAL_RECORD_NOT_FOUND, http_status: 404, condition: "credentialRecordId path parameter or credential_record_id in the body does not exist", applies_to: ["GET /credential-records/{credentialRecordId}", "POST /credential-records/{credentialRecordId}/transcript", "POST /credential-records/{credentialRecordId}/verification", "POST /credential-evaluations"] }
  - { id: ERR_EVALUATION_NOT_FOUND, http_status: 404, condition: "evaluationId path parameter does not exist", applies_to: ["GET /credential-evaluations/{evaluationId}", "POST /credential-evaluations/{evaluationId}/status"] }
  - { id: ERR_SECTION_NOT_FOUND, http_status: 404, condition: "sectionId path parameter or course_section_id in the body does not exist", applies_to: ["GET /course-sections/{sectionId}", "GET /course-sections/{sectionId}/course-assignments", "POST /course-assignments"] }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http_status: 404, condition: "assignmentId path parameter or course_assignment_id in the body does not exist", applies_to: ["GET /course-assignments/{assignmentId}", "POST /course-assignments/{assignmentId}/remediation", "POST /course-assignments/{assignmentId}/reverification", "POST /course-assignments/{assignmentId}/withdrawal", "POST /tested-experience-justifications"] }
  - { id: ERR_JUSTIFICATION_NOT_FOUND, http_status: 404, condition: "justificationId path parameter does not exist", applies_to: ["GET /tested-experience-justifications/{justificationId}", "POST /tested-experience-justifications/{justificationId}", "POST /tested-experience-justifications/{justificationId}/status", "POST /tested-experience-justifications/{justificationId}/review", "POST /tested-experience-justifications/{justificationId}/decision", "POST /tested-experience-justifications/{justificationId}/revision"] }
  - { id: ERR_ROSTER_NOT_FOUND, http_status: 404, condition: "rosterId path parameter does not exist, or no anchor roster exists for a program that needs one", applies_to: ["GET /faculty-rosters/{rosterId}", "GET /faculty-rosters/{rosterId}/entries", "POST /faculty-rosters/{rosterId}/generate", "POST /faculty-rosters/{rosterId}/certification", "POST /programs/{programId}/launch-review", "GET /programs/{programId}/adequacy", "POST /accreditor-reviews/{reviewId}/findings"] }
  - { id: ERR_CONTRACT_NOT_FOUND, http_status: 404, condition: "contractId path parameter does not exist", applies_to: ["GET /faculty-contracts/{contractId}", "POST /faculty-contracts/{contractId}/countersignature", "POST /faculty-contracts/{contractId}/void"] }
  - { id: ERR_PD_RECORD_NOT_FOUND, http_status: 404, condition: "pdRecordId path parameter does not exist", applies_to: ["GET /pd-records/{pdRecordId}", "POST /pd-records/{pdRecordId}/status"] }
  - { id: ERR_REVIEW_NOT_FOUND, http_status: 404, condition: "reviewId path parameter does not exist", applies_to: ["GET /accreditor-reviews/{reviewId}", "POST /accreditor-reviews/{reviewId}/status", "POST /accreditor-reviews/{reviewId}/findings", "POST /accreditor-reviews/{reviewId}/response"] }

  # ---- OCC ----
  - { id: ERR_STALE_SECTION_VERSION, http_status: 412, condition: "expected_section_version does not equal the current CourseSection.version", applies_to: ["POST /course-assignments"] }
  - { id: ERR_STALE_FACULTY_VERSION, http_status: 412, condition: "expected_faculty_version does not equal the current FacultyMember.version", applies_to: ["POST /faculty-contracts"] }

  # ---- state ----
  - { id: ERR_INVALID_STATE, http_status: 409, condition: "The requested transition is not in the §1.2 transition list for the entity's current state, including terminal-state lockdown, a repeated trigger, CLOSED_SANCTION below response_round 2, launching a substantive change without a CLOSED_ACCEPTED SUBSTANTIVE_CHANGE review, VERIFY on a record whose transcript is still NOT_REQUESTED, and roster certification while an AccreditorReview is REMEDIATION_REQUIRED", applies_to: ["POST /terms/{termId}/status", "POST /programs/{programId}/launch-decision", "POST /credential-records/{credentialRecordId}/transcript", "POST /credential-records/{credentialRecordId}/verification", "POST /credential-evaluations/{evaluationId}/status", "POST /course-assignments/{assignmentId}/remediation", "POST /course-assignments/{assignmentId}/reverification", "POST /course-assignments/{assignmentId}/withdrawal", "POST /tested-experience-justifications/{justificationId}", "POST /tested-experience-justifications/{justificationId}/status", "POST /tested-experience-justifications/{justificationId}/review", "POST /tested-experience-justifications/{justificationId}/decision", "POST /tested-experience-justifications/{justificationId}/revision", "POST /faculty-rosters/{rosterId}/generate", "POST /faculty-rosters/{rosterId}/certification", "POST /faculty-contracts/{contractId}/countersignature", "POST /faculty-contracts/{contractId}/void", "POST /pd-records/{pdRecordId}/status", "POST /accreditor-reviews/{reviewId}/status", "POST /accreditor-reviews/{reviewId}/findings", "POST /accreditor-reviews/{reviewId}/response"] }
  - { id: ERR_TERM_LOCKED, http_status: 409, condition: "The affected term's status forbids the operation (CLOSED forbids everything; ROSTER_LOCKED forbids new sections; PLANNING forbids roster generation)", applies_to: ["POST /course-sections", "POST /course-assignments", "POST /course-assignments/{assignmentId}/remediation", "POST /course-assignments/{assignmentId}/reverification", "POST /course-assignments/{assignmentId}/withdrawal", "POST /faculty-rosters/{rosterId}/generate", "POST /faculty-rosters/{rosterId}/certification"] }
  - { id: ERR_ROSTER_CERTIFIED, http_status: 409, condition: "The covering FacultyRoster is CERTIFIED, freezing its assignment set", applies_to: ["POST /course-assignments", "POST /course-assignments/{assignmentId}/remediation", "POST /course-assignments/{assignmentId}/reverification", "POST /course-assignments/{assignmentId}/withdrawal", "POST /faculty-members/{facultyMemberId}/separation", "POST /terms/{termId}/status"] }

  # ---- business_safety ----
  - { id: ERR_ACCREDITOR_REVIEW_LOCKOUT, http_status: 403, condition: "An AccreditorReview of the affected program is IN_PROGRESS, FINDINGS_ISSUED or REMEDIATION_REQUIRED and the logical clock date falls inside its fully-closed window", applies_to: ["POST /course-assignments", "POST /course-assignments/{assignmentId}/withdrawal", "POST /credential-evaluations"] }
  - { id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, condition: "The acting X-User-ID already performed the incompatible upstream step (verified one of the faculty's credential records, or decided a justification counted in the roster)", applies_to: ["POST /tested-experience-justifications/{justificationId}/decision", "POST /faculty-rosters/{rosterId}/certification"] }

  # ---- business_referential ----
  - { id: ERR_FACULTY_SEPARATED, http_status: 409, condition: "The referenced FacultyMember.appointment_status is SEPARATED", applies_to: ["POST /course-assignments", "POST /faculty-contracts", "POST /faculty-contracts/{contractId}/countersignature", "POST /credential-records", "POST /pd-records"] }
  - { id: ERR_FACULTY_NOT_APPOINTABLE, http_status: 409, condition: "The referenced FacultyMember.appointment_status is PROSPECT — never credentialed", applies_to: ["POST /course-assignments"] }
  - { id: ERR_DOSSIER_NOT_VERIFIED, http_status: 409, condition: "The referenced FacultyMember.dossier_status is not VERIFIED at contract issuance", applies_to: ["POST /faculty-contracts"] }
  - { id: ERR_NOT_FOREIGN_CREDENTIAL, http_status: 422, condition: "An evaluation is ordered for a CredentialRecord with is_foreign_institution == false", applies_to: ["POST /credential-evaluations"] }
  - { id: ERR_DISCIPLINE_CYCLE, http_status: 422, condition: "parent_discipline_id equals the node's own id or would create a cycle", applies_to: ["POST /disciplines", "POST /disciplines/{disciplineId}"] }

  # ---- business_constraint ----
  - { id: ERR_DUPLICATE_DISCIPLINE_CODE, http_status: 409, condition: "Another DisciplineTaxonomy already uses this code", applies_to: ["POST /disciplines", "POST /disciplines/{disciplineId}"] }
  - { id: ERR_DUPLICATE_TERM_CODE, http_status: 409, condition: "Another Term already uses this code", applies_to: ["POST /terms"] }
  - { id: ERR_DUPLICATE_FACULTY_EMAIL, http_status: 409, condition: "Another FacultyMember already uses this email", applies_to: ["POST /faculty-members", "POST /faculty-members/{facultyMemberId}"] }
  - { id: ERR_DUPLICATE_ASSIGNMENT, http_status: 409, condition: "A CourseAssignment for the same (course_section_id, faculty_member_id) already exists with status NOT IN {SUPERSEDED, WITHDRAWN}", applies_to: ["POST /course-assignments"] }
  - { id: ERR_DUPLICATE_ROSTER, http_status: 409, condition: "A FacultyRoster for the same (program_id, term_id) already exists with status IN {DRAFT, GENERATED}", applies_to: ["POST /faculty-rosters"] }
  - { id: ERR_TEACHING_BLOCK_CONFLICT, http_status: 409, condition: "The faculty member's half-open meeting interval overlaps another of their sections in the same term on a shared meeting day, including the 15-minute travel buffer when building_code differs", applies_to: ["POST /course-assignments"] }
  - { id: ERR_REVIEW_WINDOW_OVERLAP, http_status: 409, condition: "The new review's fully-closed date window touches or overlaps a non-terminal review window of the same program", applies_to: ["POST /accreditor-reviews"] }
  - { id: ERR_TERM_LOAD_EXCEEDED, http_status: 409, condition: "The faculty member's credit hours in that term plus the new section's credit hours exceed MAX_TERM_CREDIT_HOURS for their employment_class", applies_to: ["POST /course-assignments"] }
  - { id: ERR_ATTESTATION_MISSING, http_status: 422, condition: "APPROVE was requested on a justification whose supervisor_attestation_on_file is false", applies_to: ["POST /tested-experience-justifications/{justificationId}/decision"] }
  - { id: ERR_TESTED_EXPERIENCE_INSUFFICIENT, http_status: 422, condition: "APPROVE was requested with documented_years_experience < 3 or tested_experience_score < 0.70", applies_to: ["POST /tested-experience-justifications/{justificationId}/decision"] }
  - { id: ERR_ROSTER_NOT_READY, http_status: 409, condition: "certification_readiness is BLOCKED, or a term close was attempted while a roster of the term is neither CERTIFIED nor SUPERSEDED", applies_to: ["POST /faculty-rosters/{rosterId}/certification", "POST /terms/{termId}/status"] }
  - { id: ERR_PROGRAM_ADEQUACY_INSUFFICIENT, http_status: 409, condition: "Program.adequacy_status is not ADEQUATE or Program.unqualified_assignment_count > 0 when a launch approval or a review closure was attempted", applies_to: ["POST /programs/{programId}/launch-decision", "POST /accreditor-reviews/{reviewId}/status"] }

  # ---- business_temporal ----
  - { id: ERR_INVALID_WINDOW, http_status: 422, condition: "start_date > end_date, census_date outside the term, meeting_start_minute >= meeting_end_minute, window_start_date > window_end_date, or IN_PROGRESS requested before window_start_date", applies_to: ["POST /terms", "POST /course-sections", "POST /accreditor-reviews", "POST /accreditor-reviews/{reviewId}/status"] }
  - { id: ERR_CONTRACT_WINDOW_CLOSED, http_status: 422, condition: "The logical clock date is on or after Term.start_date at contract issuance", applies_to: ["POST /faculty-contracts"] }
  - { id: ERR_RESPONSE_WINDOW_CLOSED, http_status: 422, condition: "The logical clock date is after AccreditorReview.response_due_date", applies_to: ["POST /accreditor-reviews/{reviewId}/response"] }
  - { id: ERR_PD_DATE_IN_FUTURE, http_status: 422, condition: "activity_date is after the logical clock date", applies_to: ["POST /pd-records"] }

  # ---- business_fiscal ----
  - { id: ERR_CREDENTIAL_BUDGET_EXCEEDED, http_status: 422, condition: "budget_reserved_cents + budget_spent_cents + the freshly computed fee exceeds credential_budget_cents on the billed program", applies_to: ["POST /credential-evaluations"] }

# =============================================================================
# §1.7 RBAC Permission Matrix — role_model: segregation_of_duties
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Institutional reference-data owner. Maintains the discipline taxonomy, programs and the logical clock. Never touches credential decisions, rosters or reviews."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /disciplines"
      - "POST /disciplines/{disciplineId}"
      - "POST /programs"
    shared_operations:
      - "POST /terms (shared with RegistrarOfficer)"
      - "all GET endpoints except the Instructor-owned reads"

  - name: RegistrarOfficer
    description: "Faculty roster office clerk. Owns faculty records, credential filing, official transcript collection and separation. Files evidence but never judges it."
    identity: opaque
    exclusive_operations:
      - "POST /faculty-members"
      - "POST /faculty-members/{facultyMemberId}"
      - "POST /faculty-members/{facultyMemberId}/separation"
      - "POST /credential-records"
      - "POST /credential-records/{credentialRecordId}/transcript"
      - "POST /terms/{termId}/status"
    shared_operations:
      - "POST /terms (shared with SystemAdmin)"
      - "POST /pd-records (shared with Instructor)"
      - "all GET endpoints except the Instructor-owned reads"

  - name: CredentialAnalyst
    description: "Credential evaluator. Verifies, rejects and repudiates credentials, orders and completes foreign credential evaluations, re-verifies remediating assignments and decides tested-experience justifications. Subject to segregation of duties against their own verifications."
    identity: opaque
    exclusive_operations:
      - "POST /credential-records/{credentialRecordId}/verification"
      - "POST /credential-evaluations"
      - "POST /credential-evaluations/{evaluationId}/status"
      - "POST /course-assignments/{assignmentId}/reverification"
      - "POST /tested-experience-justifications/{justificationId}/review"
      - "POST /tested-experience-justifications/{justificationId}/decision"
      - "POST /pd-records/{pdRecordId}/status"
    shared_operations:
      - "all GET endpoints except the Instructor-owned reads"

  - name: ProgramDean
    description: "Dean of one academic program. X-User-ID IS that Program's id, so every write is scoped to sections, assignments, justifications, rosters and contracts of that program."
    identity: entity_backed:Program
    exclusive_operations:
      - "POST /programs/{programId}/launch-review"
      - "POST /course-sections"
      - "POST /course-assignments"
      - "POST /course-assignments/{assignmentId}/remediation"
      - "POST /course-assignments/{assignmentId}/withdrawal"
      - "POST /tested-experience-justifications"
      - "POST /tested-experience-justifications/{justificationId}"
      - "POST /tested-experience-justifications/{justificationId}/status"
      - "POST /tested-experience-justifications/{justificationId}/revision"
      - "POST /faculty-contracts"
      - "POST /faculty-contracts/{contractId}/void"
    shared_operations:
      - "POST /faculty-rosters (shared with AccreditationLiaison)"
      - "all GET endpoints except the Instructor-owned reads"

  - name: Instructor
    description: "A faculty member acting for themselves. X-User-ID IS that FacultyMember's id. May countersign their own contract, log their own professional development and read only their own records."
    identity: entity_backed:FacultyMember
    exclusive_operations:
      - "POST /faculty-contracts/{contractId}/countersignature"
    shared_operations:
      - "POST /pd-records (shared with RegistrarOfficer, own faculty_member_id only)"
      - "GET /faculty-members/{facultyMemberId} (own row only)"
      - "GET /faculty-members/{facultyMemberId}/credential-records (own rows only)"
      - "GET /faculty-contracts/{contractId} (own contracts only)"
      - "GET /pd-records/{pdRecordId} (own records only)"

  - name: AccreditationLiaison
    description: "Accreditation office liaison. Generates and certifies rosters, decides program launches and files remediation responses to the accreditor. Subject to segregation of duties against justification deciders."
    identity: opaque
    exclusive_operations:
      - "POST /faculty-rosters/{rosterId}/generate"
      - "POST /faculty-rosters/{rosterId}/certification"
      - "POST /programs/{programId}/launch-decision"
      - "POST /accreditor-reviews/{reviewId}/response"
    shared_operations:
      - "POST /faculty-rosters (shared with ProgramDean)"
      - "all GET endpoints except the Instructor-owned reads"

  - name: AccreditorReviewer
    description: "External accreditor representative. Schedules reviews, drives review status, issues findings and closes or sanctions. Read-only over every other collection and never writes faculty, credential or roster data."
    identity: opaque
    exclusive_operations:
      - "POST /accreditor-reviews"
      - "POST /accreditor-reviews/{reviewId}/status"
      - "POST /accreditor-reviews/{reviewId}/findings"
    shared_operations:
      - "all GET endpoints except the Instructor-owned reads"
