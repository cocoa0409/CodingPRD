            - { call: "POST /service-zones", payload: { name: "ZE", max_concurrent_appointments: 5 }, as: ServiceAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /technicians/${tech_id}/status", payload: { to_status: "OFF_DUTY" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", appliance_id: "${app_id}", reported_issue: "quiet" }, as: ServiceAdmin, captures: { sr_id: "$.data.id" } }
          trigger:
