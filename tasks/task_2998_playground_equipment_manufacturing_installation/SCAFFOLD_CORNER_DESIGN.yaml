            - "PlaygroundStandard.${std2_id}.status == DRAFT and version == 1 (the rejected activation is inert)"
            - "PlaygroundStandard.${std1_id}.status == ACTIVE and superseded_by_standard_id == null"
            - "GET /playground/standards?status=ACTIVE returns meta.total_count == 1"

      - name: standard_activate_twice_second_call_returns_standard_not_draft
        claim_type: idempotency
        grounds:
          - validations[priority=40]
          - errors.ERR_STANDARD_NOT_DRAFT
          - endpoints[POST /playground/standards/{id}/activate]
        distinguishing_aspect: "Re-firing activate on the already-ACTIVE edition is an error (ERR_STANDARD_NOT_DRAFT, 409), not a no-op success, and it does not bump version a second time - version stays at 2."
        test_recipe:
