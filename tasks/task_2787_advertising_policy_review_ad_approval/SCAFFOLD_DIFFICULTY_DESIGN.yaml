            - call: "POST /ad-policy/ad-creatives/${cr_disc_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${pol_id}", confidence: 0.70, matched_snippet: "coalition message" }, { policy_rule_id: "${alc_id}", confidence: 0.60, matched_snippet: "spirits industry support" }], expected_ad_creative_version: "${crd_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
