      - name: calc_waitlist_queue_order_tie_break_chain
        claim_type: correct_result
        grounds:
          - calculations.waitlist_queue_order
          - entities.WaitlistEntry.fields.queue_position
        distinguishing_aspect: |
          Three entries whose priority_score is identically 1275 - two applicants who applied on
          2026-08-01 (30 residency points plus 5 tenure points) and one who applied on 2026-08-06
          (35 residency points plus 0 tenure points) - must be ordered by application_received_date
          ASC and then entry created_at ASC, giving positions 1, 2, 3 with `id` never consulted, and
          on a unit whose available_bed_count is 0 no offer is made at all.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome and one CERTIFIED NURSING unit with licensed_bed_count 1 and out_of_service_bed_count 1, so available_bed_count is 0 and the posture is RESTRICTED."
