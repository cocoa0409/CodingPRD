              as_user_id: "${m_id}"
              captures: { new_v: $.data.version }
          assert:
            - "response.http_status == 200"
            - "Member.${m_id}.plan_id == ${prem_id}"

      - name: derived_completed_uv_count_reconciled_on_complete
        claim_type: derived_field_reconciliation
        grounds: [entities.Member.fields.completed_uv_session_count, state_machines.Session.IN_PROGRESS_to_COMPLETED]
        distinguishing_aspect: "Member.completed_uv_session_count increments only on COMPLETED UV sessions; a CANCELLED reservation does not change it, so the derived count stays 0 after a cancel."
