  # =========================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: solvency_ratio_exactly_at_warning_threshold
        grounds:
          - calculations.solvency_ratio_calculation
          - entities.CaptiveEntity.fields.solvency_status
          - validations[priority=7]
        distinguishing_aspect: |
          Boundary on solvency_ratio metric: exactly 150.00 (>= 150 = ADEQUATE).
          Uses >= comparison, not >. At exactly 150.00, status is ADEQUATE.
          At 149.99, status is WARNING. Tested via solvency recalculation after
          collateral verification.
        test_recipe:
          setup:
            - "CaptiveEntity with capitalization such that solvency_ratio will be exactly at boundary"
            - "Program with fronting and collateral about to be verified"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive K", domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 150000 }
