scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: asr_compilation_provisional_vs_final
        grounds:
          - calculations.asr_statistics_compilation
          - entities.AnnualSecurityReport.fields.statistics_version
          - entities.StatisticLine.fields.compilation_variant
        distinguishing_aspect: |
          Two valid compilations of the SAME underlying incident set produce
          different statistic lines because the PROVISIONAL variant counts
          UNDER_RECLASSIFICATION incidents while FINAL counts only CLASSIFIED
          ones — a dual-variant calculation on the AnnualSecurityReport domain.
        test_recipe:
          setup:
            - "ON_CAMPUS geography g1; incident A (occurred 2026-03-10) CLASSIFIED with BURGLARY; incident B (occurred 2026-04-05) CLASSIFIED with ROBBERY then moved to UNDER_RECLASSIFICATION; ASR for 2026 exists in COLLECTING"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Main Quad", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g1: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-03-10T09:00:00Z", occurred_at: "2026-03-10T02:00:00Z", geography_id: "${g1}", source: "POLICE_DIRECT", narrative: "Dorm room entered, laptop taken" }, as: PoliceChief, captures: { ia: $.data.id } }
            - { call: "POST /incident-reports/${ia}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${ia}/begin-classification", payload: {}, as: CleryCoordinator, captures: { ia_v: $.data.version } }
            - { call: "POST /incident-reports/${ia}/classify", payload: { geography_id: "${g1}", offense_counts: [ { offense_type: "BURGLARY", victim_count: 1 } ], expected_incident_version: "${ia_v}" }, as: CleryCoordinator }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-05T11:00:00Z", occurred_at: "2026-04-05T01:00:00Z", geography_id: "${g1}", source: "POLICE_DIRECT", narrative: "Street robbery at north gate" }, as: PoliceChief, captures: { ib: $.data.id } }
            - { call: "POST /incident-reports/${ib}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${ib}/begin-classification", payload: {}, as: CleryCoordinator, captures: { ib_v: $.data.version } }
            - { call: "POST /incident-reports/${ib}/classify", payload: { geography_id: "${g1}", offense_counts: [ { offense_type: "ROBBERY", victim_count: 1 } ], expected_incident_version: "${ib_v}" }, as: CleryCoordinator }
            - { call: "POST /incident-reports/${ib}/begin-reclassification", payload: {}, as: CleryCoordinator }
            - { call: "POST /annual-security-reports", payload: { report_year: 2026 }, as: SystemAdmin, captures: { asr: $.data.id, asr_v: $.data.version } }
          trigger:
            - { call: "POST /annual-security-reports/${asr}/compile", payload: { variant: "PROVISIONAL", expected_report_version: "${asr_v}" }, as: CleryCoordinator, captures: { asr_v2: $.data.version } }
            - { call: "GET /annual-security-reports/${asr}/statistic-lines", payload: { compilation_variant: "PROVISIONAL", statistics_version: 1 }, as: CleryCoordinator }
            - { call: "POST /annual-security-reports/${asr}/compile", payload: { variant: "FINAL", expected_report_version: "${asr_v2}" }, as: CleryCoordinator }
            - { call: "GET /annual-security-reports/${asr}/statistic-lines", payload: { compilation_variant: "FINAL", statistics_version: 2 }, as: CleryCoordinator }
          assert:
            - "PROVISIONAL snapshot (statistics_version 1) contains a line (offense_type=BURGLARY, geography_column=ON_CAMPUS) with count == 1 AND a line (ROBBERY, ON_CAMPUS) with count == 1"
            - "FINAL snapshot (statistics_version 2) contains (BURGLARY, ON_CAMPUS) count == 1 but NO ROBBERY line at all"
            - "AnnualSecurityReport.${asr}.statistics_version == 2 and final_compile_done == true"

      - name: inspection_window_calendar_vs_elapsed
        grounds:
          - calculations.inspection_fulfillment_window
          - entities.LogInspectionRequest.fields.due_at
          - entities.LogInspectionRequest.fields.provisional_due_at
        distinguishing_aspect: |
          For an entry 60 days plus 30 minutes old, the authoritative
          CALENDAR_DATE variant grants immediate fulfillment while the
          ELAPSED_HOURS variant computes a 2-business-day provisional due date —
          a dual-variant calculation on the LogInspectionRequest domain,
          distinct from the ASR statistics domain.
        test_recipe:
          setup:
            - "ON_CAMPUS geography; one submitted incident with occurred_at 2026-06-02T00:30:00Z (log entry exists); logical clock at 2026-08-01T01:00:00Z (Saturday)"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "West Lot", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g2: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-06-02T00:30:00Z", occurred_at: "2026-06-02T00:30:00Z", geography_id: "${g2}", source: "POLICE_DIRECT", narrative: "Vehicle break-in" }, as: PoliceChief, captures: { i2: $.data.id } }
            - { call: "POST /incident-reports/${i2}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /daily-crime-log/inspection-requests", payload: { requester_name: "Pat Public", requester_contact: "pat@example.com", from_date: "2026-06-01", to_date: "2026-06-03" }, as: Anonymous, captures: { lir: $.data.id } }
          assert:
            - "LogInspectionRequest.${lir}.status == FULFILLED (calendar-date rule: entry date 2026-06-02 >= threshold 2026-08-01 - 60d = 2026-06-02)"
            - "LogInspectionRequest.${lir}.due_at == 2026-08-01T01:00:00Z (immediate)"
            - "LogInspectionRequest.${lir}.fulfilled_at == 2026-08-01T01:00:00Z"
            - "LogInspectionRequest.${lir}.provisional_due_at == 2026-08-04T01:00:00Z (elapsed 1440.5h > 1440h -> +2 business days over the weekend)"

  - rule_id: combinatorial_formula
    instances:
      - name: offense_hierarchy_with_exemptions_and_double_count
        grounds:
          - calculations.offense_hierarchy_resolution
          - calculations.geography_column_mapping
          - entities.OffenseCount.fields.is_exempt_from_hierarchy
        distinguishing_aspect: |
          Mode (a): a formula with >= 3 inputs (offense set, exemption flag,
          geography category) and non-linear interaction — rank selection among
          non-exempt offenses, unconditional counting of VAWA/referral
          exemptions, and the ON_CAMPUS_RESIDENTIAL double-count branch.
        test_recipe:
          setup:
            - "ON_CAMPUS_RESIDENTIAL geography gr; incident (occurred 2026-02-14) UNDER_CLASSIFICATION; ASR 2026 in COLLECTING"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Residence Hall A", category: "ON_CAMPUS_RESIDENTIAL", is_residential_facility: true }, as: SystemAdmin, captures: { gr: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-02-14T08:00:00Z", occurred_at: "2026-02-14T03:00:00Z", geography_id: "${gr}", source: "POLICE_DIRECT", narrative: "Multi-offense dorm incident" }, as: PoliceChief, captures: { i3: $.data.id } }
            - { call: "POST /incident-reports/${i3}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i3}/begin-classification", payload: {}, as: CleryCoordinator, captures: { i3_v: $.data.version } }
            - { call: "POST /annual-security-reports", payload: { report_year: 2026 }, as: SystemAdmin, captures: { asr3: $.data.id, asr3_v: $.data.version } }
          trigger:
            - { call: "POST /incident-reports/${i3}/classify", payload: { geography_id: "${gr}", offense_counts: [ { offense_type: "SEX_OFFENSE", victim_count: 1 }, { offense_type: "ROBBERY", victim_count: 1 }, { offense_type: "DATING_VIOLENCE", victim_count: 1 }, { offense_type: "DRUG_LAW_REFERRAL", referred_persons: 3 } ], expected_incident_version: "${i3_v}" }, as: CleryCoordinator }
            - { call: "GET /incident-reports/${i3}/offense-counts", payload: {}, as: CleryCoordinator }
            - { call: "POST /annual-security-reports/${asr3}/compile", payload: { variant: "FINAL", expected_report_version: "${asr3_v}" }, as: CleryCoordinator }
            - { call: "GET /annual-security-reports/${asr3}/statistic-lines", payload: { compilation_variant: "FINAL" }, as: CleryCoordinator }
          assert:
            - "OffenseCount for SEX_OFFENSE: status == COUNTED (rank 20 beats ROBBERY rank 30)"
            - "OffenseCount for ROBBERY: status == EXCLUDED_BY_HIERARCHY"
            - "OffenseCount for DATING_VIOLENCE: status == COUNTED (VAWA exemption)"
            - "OffenseCount for DRUG_LAW_REFERRAL: status == COUNTED (referral exemption)"
            - "StatisticLine (SEX_OFFENSE, ON_CAMPUS).count == 1 and (SEX_OFFENSE, ON_CAMPUS_RESIDENTIAL).count == 1 (residential double-count)"
            - "StatisticLine (DATING_VIOLENCE, ON_CAMPUS).count == 1 and (DATING_VIOLENCE, ON_CAMPUS_RESIDENTIAL).count == 1"
            - "StatisticLine (DRUG_LAW_REFERRAL, ON_CAMPUS).count == 1 with referred_persons_count == 3; same for ON_CAMPUS_RESIDENTIAL"
            - "No StatisticLine with offense_type == ROBBERY exists"

      - name: fire_damage_per_incident_round_then_sum
        grounds:
          - calculations.fire_damage_aggregation
          - entities.FireIncident.fields.final_damage_dollars
          - entities.FireSafetyReport.fields.total_damage_dollars
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-half-up PER INCIDENT before summation; two adjudicated values
          of 100.50 each yield 202, whereas round-of-sum would yield 201.
        test_recipe:
          setup:
            - "Residential geography gr2; fire safety report for 2026; two fire incidents in 2026, both finalized with adjudicated damage 100.50"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Residence Hall B", category: "ON_CAMPUS_RESIDENTIAL", is_residential_facility: true }, as: SystemAdmin, captures: { gr2: $.data.id } }
            - { call: "POST /fire-safety-reports", payload: { report_year: 2026 }, as: SystemAdmin, captures: { fsr4: $.data.id } }
            - { call: "POST /fire-incidents", payload: { geography_id: "${gr2}", occurred_at: "2026-05-01T02:00:00Z", cause_category: "COOKING", injuries: 0, deaths: 0, estimated_damage_dollars: 120.00 }, as: PoliceChief, captures: { f41: $.data.id } }
            - { call: "POST /fire-incidents", payload: { geography_id: "${gr2}", occurred_at: "2026-05-20T02:00:00Z", cause_category: "ELECTRICAL", injuries: 1, deaths: 0, estimated_damage_dollars: 80.25 }, as: PoliceChief, captures: { f42: $.data.id } }
            - { call: "POST /fire-incidents/${f41}/finalize", payload: { adjudicated_damage_dollars: 100.50 }, as: PoliceChief }
            - { call: "POST /fire-incidents/${f42}/finalize", payload: { adjudicated_damage_dollars: 100.50 }, as: PoliceChief }
          trigger:
            - { call: "POST /fire-safety-reports/${fsr4}/compile", payload: {}, as: CleryCoordinator }
          assert:
            - "FireIncident.${f41}.final_damage_dollars == 101 (round_half_up(100.50))"
            - "FireIncident.${f42}.final_damage_dollars == 101"
            - "FireSafetyReport.${fsr4}.total_damage_dollars == 202 (per-incident round then sum; round-of-sum would give 201)"
            - "FireSafetyReport.${fsr4}.total_fires == 2 and total_injuries == 1 and total_deaths == 0"
            - "FireSafetyReport.${fsr4}.provisional_total_damage_dollars == 0 (no REPORTED incidents remain)"

  - rule_id: non_linear_state_machine
    instances:
      - name: incident_reclassification_cycle
        grounds:
          - state_machines.IncidentReport.CLASSIFIED_to_UNDER_RECLASSIFICATION
          - state_machines.IncidentReport.UNDER_RECLASSIFICATION_to_CLASSIFIED
        distinguishing_aspect: |
          Cyclic machine on IncidentReport: CLASSIFIED -> UNDER_RECLASSIFICATION
          -> CLASSIFIED may repeat; the offense set is fully replaced on each
          pass and the log-entry nature follows the latest classification.
        test_recipe:
          setup:
            - "ON_CAMPUS geography; incident occurred 2026-03-15 already CLASSIFIED with BURGLARY"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Library", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g5: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-03-15T10:00:00Z", occurred_at: "2026-03-15T04:00:00Z", geography_id: "${g5}", source: "POLICE_DIRECT", narrative: "Break-in" }, as: PoliceChief, captures: { i5: $.data.id } }
            - { call: "POST /incident-reports/${i5}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i5}/begin-classification", payload: {}, as: CleryCoordinator, captures: { i5_v1: $.data.version } }
            - { call: "POST /incident-reports/${i5}/classify", payload: { geography_id: "${g5}", offense_counts: [ { offense_type: "BURGLARY", victim_count: 1 } ], expected_incident_version: "${i5_v1}" }, as: CleryCoordinator }
          trigger:
            - { call: "POST /incident-reports/${i5}/begin-reclassification", payload: {}, as: CleryCoordinator, captures: { i5_v2: $.data.version } }
            - { call: "POST /incident-reports/${i5}/classify", payload: { geography_id: "${g5}", offense_counts: [ { offense_type: "ARSON", victim_count: 1 } ], expected_incident_version: "${i5_v2}" }, as: CleryCoordinator }
            - { call: "GET /incident-reports/${i5}/offense-counts", payload: {}, as: CleryCoordinator }
            - { call: "GET /daily-crime-log", payload: { incident_id: "${i5}" }, as: CleryCoordinator }
          assert:
            - "IncidentReport.${i5}.status == CLASSIFIED after the cycle"
            - "IncidentReport.${i5}.version == 6 (create 1, submit 2, begin-classification 3, classify 4, begin-reclassification 5, classify 6)"
            - "Offense-counts list has exactly 1 row: offense_type == ARSON, status == COUNTED (BURGLARY row replaced, not accumulated)"
            - "DailyCrimeLogEntry nature == 'ARSON'"

      - name: safety_alert_branching_fork_with_reopen_cycle
        grounds:
          - state_machines.SafetyAlert.PENDING_REVIEW_to_DECIDED_NO_ISSUE
          - state_machines.SafetyAlert.PENDING_REVIEW_to_DECIDED_ISSUE
          - state_machines.SafetyAlert.CLOSED_to_PENDING_REVIEW
        distinguishing_aspect: |
          Branching fork plus cycle on SafetyAlert (a different entity than
          IncidentReport): PENDING_REVIEW forks to DECIDED_NO_ISSUE or
          DECIDED_ISSUE with divergent side-effect sets (no dissemination
          deadline vs authorize/disseminate chain), and CLOSED loops back to
          PENDING_REVIEW via reopen.
        test_recipe:
          setup:
            - "Submitted incident (occurred 2026-06-01, reported 2026-06-01T06:00:00Z) with one SafetyAlert in PENDING_REVIEW; clock at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Stadium", category: "PUBLIC_PROPERTY", is_residential_facility: false }, as: SystemAdmin, captures: { g6: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-06-01T06:00:00Z", occurred_at: "2026-06-01T05:00:00Z", geography_id: "${g6}", source: "POLICE_DIRECT", narrative: "Assault near stadium" }, as: PoliceChief, captures: { i6: $.data.id } }
            - { call: "POST /incident-reports/${i6}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i6}/safety-alerts", payload: { alert_type: "TIMELY_WARNING" }, as: CleryCoordinator, captures: { a6: $.data.id } }
          trigger:
            - { call: "POST /safety-alerts/${a6}/decide", payload: { decision: "NO_ISSUE", decision_rationale: "Not a continuing threat" }, as: CleryCoordinator }
            - { call: "POST /safety-alerts/${a6}/close", payload: {}, as: CleryCoordinator }
            - { call: "POST /safety-alerts/${a6}/reopen", payload: { reason: "New witness information" }, as: CleryCoordinator }
            - { call: "POST /safety-alerts/${a6}/decide", payload: { decision: "ISSUE", decision_rationale: "Continuing threat confirmed" }, as: CleryCoordinator }
            - { call: "POST /safety-alerts/${a6}/authorize", payload: {}, as: PoliceChief }
            - { call: "POST /safety-alerts/${a6}/disseminate", payload: { distribution_channels: ["EMAIL", "SMS"] }, as: PoliceChief, captures: { a6_final: $.data.status } }
          assert:
            - "After decide NO_ISSUE: status == DECIDED_NO_ISSUE (fork branch 1: no authorize/disseminate steps)"
            - "After close: status == CLOSED with closed_at set"
            - "After reopen: status == PENDING_REVIEW and decision/decided_at/closed_at reset to null"
            - "After decide ISSUE + authorize + disseminate: status == DISSEMINATED (fork branch 2: AUTHORIZED gate traversed)"
            - "SafetyAlert.${a6}.distribution_channels == [EMAIL, SMS] and disseminated_at != null"

  - rule_id: transitive_cascade
    instances:
      - name: unfound_cascade_depth3
        grounds:
          - state_machines.IncidentReport.CLASSIFIED_to_UNFOUNDED
          - entities.DailyCrimeLogEntry.fields.disposition
          - entities.AnnualSecurityReport.fields.statistics_stale
          - entities.StatisticLine.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from the unfound trigger: incident -> UNFOUNDED
          mutates DailyCrimeLogEntry (link 1); that log-entry mutation flips
          the year's AnnualSecurityReport.statistics_stale (link 2); the
          staleness flip supersedes all CURRENT StatisticLine rows (link 3) —
          each link caused by the previous link, not by the original call.
        test_recipe:
          setup:
            - "Incident occurred 2026-03-03 CLASSIFIED with AGGRAVATED_ASSAULT on ON_CAMPUS geo; ASR 2026 compiled FINAL once (one CURRENT statistic line)"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "North Hall", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g7: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-03-03T12:00:00Z", occurred_at: "2026-03-03T11:00:00Z", geography_id: "${g7}", source: "POLICE_DIRECT", narrative: "Bar fight reported" }, as: PoliceChief, captures: { i7: $.data.id } }
            - { call: "POST /incident-reports/${i7}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i7}/begin-classification", payload: {}, as: CleryCoordinator, captures: { i7_v: $.data.version } }
            - { call: "POST /incident-reports/${i7}/classify", payload: { geography_id: "${g7}", offense_counts: [ { offense_type: "AGGRAVATED_ASSAULT", victim_count: 1 } ], expected_incident_version: "${i7_v}" }, as: CleryCoordinator }
            - { call: "POST /annual-security-reports", payload: { report_year: 2026 }, as: SystemAdmin, captures: { asr7: $.data.id, asr7_v: $.data.version } }
            - { call: "POST /annual-security-reports/${asr7}/compile", payload: { variant: "FINAL", expected_report_version: "${asr7_v}" }, as: CleryCoordinator }
          trigger:
            - { call: "POST /incident-reports/${i7}/unfound", payload: { justification: "Sworn investigation found the report was fabricated" }, as: PoliceChief }
            - { call: "GET /daily-crime-log", payload: { incident_id: "${i7}" }, as: CleryCoordinator, captures: { le7: "$.data[0].disposition" } }
            - { call: "GET /annual-security-reports/${asr7}", payload: {}, as: CleryCoordinator }
            - { call: "GET /annual-security-reports/${asr7}/statistic-lines", payload: {}, as: CleryCoordinator }
          assert:
            - "IncidentReport.${i7}.status == UNFOUNDED"
            - "DailyCrimeLogEntry.disposition == UNFOUNDED and is_public == false (link 1)"
            - "AnnualSecurityReport.${asr7}.statistics_stale == true (link 2, caused by the log-entry disposition mutation)"
            - "Every StatisticLine of the report has status == SUPERSEDED (link 3, caused by the staleness flip)"

      - name: fire_finalize_cascade_depth2
        grounds:
          - state_machines.FireIncident.REPORTED_to_FINALIZED
          - entities.FireSafetyReport.fields.totals_stale
          - state_machines.FireSafetyReport.PUBLISHED_to_UNDER_AMENDMENT
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (fire finalize, not incident
          unfound): finalize mutates FireSafetyReport.totals_stale (link 1);
          the staleness flip on a PUBLISHED report auto-transitions it to
          UNDER_AMENDMENT (link 2).
        test_recipe:
          setup:
            - "Residential geography; fire safety report 2026 compiled (zero fires) and PUBLISHED; one REPORTED fire incident occurred 2026-06-10"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Residence Hall C", category: "ON_CAMPUS_RESIDENTIAL", is_residential_facility: true }, as: SystemAdmin, captures: { gr8: $.data.id } }
            - { call: "POST /fire-safety-reports", payload: { report_year: 2026 }, as: SystemAdmin, captures: { fsr8: $.data.id } }
            - { call: "POST /fire-safety-reports/${fsr8}/compile", payload: {}, as: CleryCoordinator }
            - { call: "POST /fire-safety-reports/${fsr8}/publish", payload: {}, as: PoliceChief }
            - { call: "POST /fire-incidents", payload: { geography_id: "${gr8}", occurred_at: "2026-06-10T03:00:00Z", cause_category: "SMOKING_MATERIALS", injuries: 0, deaths: 0, estimated_damage_dollars: 480.00 }, as: PoliceChief, captures: { f8: $.data.id } }
          trigger:
            - { call: "POST /fire-incidents/${f8}/finalize", payload: { adjudicated_damage_dollars: 500 }, as: PoliceChief }
            - { call: "GET /fire-safety-reports/${fsr8}", payload: {}, as: CleryCoordinator }
          assert:
            - "FireIncident.${f8}.status == FINALIZED and final_damage_dollars == 500"
            - "FireSafetyReport.${fsr8}.totals_stale == true (link 1)"
            - "FireSafetyReport.${fsr8}.status == UNDER_AMENDMENT (link 2: auto-transition out of PUBLISHED without any direct report endpoint call)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: classify_terminal_incident_with_retired_geography
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_INCIDENT_TERMINAL]
          - errors[ERR_GEOGRAPHY_RETIRED]
        distinguishing_aspect: |
          Error-category pair state vs business_referential: a classify call
          that violates BOTH the terminal-state rule (incident UNFOUNDED) and
          the referential rule (geography RETIRED) must surface
          ERR_INCIDENT_TERMINAL (priority 6 beats 10).
        test_recipe:
          setup:
            - "Active geography gA; geography gB created then RETIRED (no references); incident on gA classified then UNFOUNDED"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "East Quad", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g9a: $.data.id } }
            - { call: "POST /clery-geographies", payload: { name: "Old Annex", category: "NON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g9b: $.data.id } }
            - { call: "PATCH /clery-geographies/${g9b}", payload: { status: "RETIRED" }, as: SystemAdmin }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-02-01T09:00:00Z", occurred_at: "2026-02-01T08:00:00Z", geography_id: "${g9a}", source: "POLICE_DIRECT", narrative: "Vandalism claim" }, as: PoliceChief, captures: { i9: $.data.id } }
            - { call: "POST /incident-reports/${i9}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i9}/begin-classification", payload: {}, as: CleryCoordinator, captures: { i9_v1: $.data.version } }
            - { call: "POST /incident-reports/${i9}/classify", payload: { geography_id: "${g9a}", offense_counts: [ { offense_type: "BURGLARY", victim_count: 1 } ], expected_incident_version: "${i9_v1}" }, as: CleryCoordinator }
            - { call: "POST /incident-reports/${i9}/unfound", payload: { justification: "Fabricated report confirmed" }, as: PoliceChief, captures: { i9_v2: $.data.version } }
          trigger:
            - { call: "POST /incident-reports/${i9}/classify", payload: { geography_id: "${g9b}", offense_counts: [ { offense_type: "ROBBERY", victim_count: 1 } ], expected_incident_version: "${i9_v2}" }, as: CleryCoordinator, captures: { err9: $.data.error_id } }
          assert:
            - "error_id == ERR_INCIDENT_TERMINAL (state category, priority 6) — NOT ERR_GEOGRAPHY_RETIRED (business_referential, priority 10), even though the referenced geography is indeed RETIRED"
            - "HTTP status == 409"

      - name: classify_empty_offenses_with_retired_geography
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_CLASSIFICATION_INCOMPLETE]
          - errors[ERR_GEOGRAPHY_RETIRED]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_referential (a
          different pair than the first instance): a classify call with an
          empty offense set AND a retired geography must surface
          ERR_CLASSIFICATION_INCOMPLETE (priority 7 beats 10).
        test_recipe:
          setup:
            - "Geography gB2 RETIRED; incident on active geo moved to UNDER_CLASSIFICATION"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "South Field", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g10a: $.data.id } }
            - { call: "POST /clery-geographies", payload: { name: "Closed Lot", category: "PUBLIC_PROPERTY", is_residential_facility: false }, as: SystemAdmin, captures: { g10b: $.data.id } }
            - { call: "PATCH /clery-geographies/${g10b}", payload: { status: "RETIRED" }, as: SystemAdmin }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-11T09:00:00Z", occurred_at: "2026-04-11T08:00:00Z", geography_id: "${g10a}", source: "POLICE_DIRECT", narrative: "Theft report" }, as: PoliceChief, captures: { i10: $.data.id } }
            - { call: "POST /incident-reports/${i10}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i10}/begin-classification", payload: {}, as: CleryCoordinator, captures: { i10_v: $.data.version } }
          trigger:
            - { call: "POST /incident-reports/${i10}/classify", payload: { geography_id: "${g10b}", offense_counts: [], expected_incident_version: "${i10_v}" }, as: CleryCoordinator, captures: { err10: $.data.error_id } }
          assert:
            - "error_id == ERR_CLASSIFICATION_INCOMPLETE (business_safety, priority 7) — NOT ERR_GEOGRAPHY_RETIRED (business_referential, priority 10)"
            - "HTTP status == 422"

  - rule_id: boundary_precision_check
    instances:
      - name: decision_at_exactly_48h_not_overdue
        grounds:
          - calculations.timely_warning_deadline
          - entities.SafetyAlert.fields.decision_overdue
        distinguishing_aspect: |
          Metric: elapsed decision hours on POST /safety-alerts/{id}/decide.
          Boundary pinned as strict >: decided_at exactly equal to
          reported_at + 48h is NOT overdue.
        test_recipe:
          setup:
            - "Incident reported_at exactly 2026-08-01T00:00:00Z (the clock default), submitted; alert PENDING_REVIEW; clock advanced to exactly 2026-08-03T00:00:00Z (+48h)"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Central Green", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g11: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-08-01T00:00:00Z", occurred_at: "2026-07-31T20:00:00Z", geography_id: "${g11}", source: "POLICE_DIRECT", narrative: "Robbery at gunpoint" }, as: PoliceChief, captures: { i11: $.data.id } }
            - { call: "POST /incident-reports/${i11}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i11}/safety-alerts", payload: { alert_type: "TIMELY_WARNING" }, as: CleryCoordinator, captures: { a11: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /safety-alerts/${a11}/decide", payload: { decision: "ISSUE", decision_rationale: "Serious continuing threat" }, as: CleryCoordinator }
          assert:
            - "SafetyAlert.${a11}.decision_overdue == false (exactly at deadline: 48h00m00s; rule is strictly greater-than)"
            - "SafetyAlert.${a11}.decided_at == 2026-08-03T00:00:00Z and decision_deadline_at == 2026-08-03T00:00:00Z"

      - name: inspection_entry_exactly_60_calendar_days
        grounds:
          - calculations.inspection_fulfillment_window
          - entities.LogInspectionRequest.fields.status
        distinguishing_aspect: |
          Metric: log-entry age in calendar days on POST
          /daily-crime-log/inspection-requests (a different metric and a
          different endpoint than the 48-hour decision boundary). An entry
          dated exactly request_date - 60 days still qualifies for immediate
          fulfillment (inclusive >= on the threshold date).
        test_recipe:
          setup:
            - "Incident occurred/reported 2026-06-02T00:00:00Z, submitted (log entry exists); clock at 2026-08-01T12:00:00Z (Saturday)"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "South Quad", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g12: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-06-02T00:00:00Z", occurred_at: "2026-06-02T00:00:00Z", geography_id: "${g12}", source: "POLICE_DIRECT", narrative: "Bike theft" }, as: PoliceChief, captures: { i12: $.data.id } }
            - { call: "POST /incident-reports/${i12}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /daily-crime-log/inspection-requests", payload: { requester_name: "Sam Press", requester_contact: "sam@example.com", from_date: "2026-06-02", to_date: "2026-06-02" }, as: Anonymous, captures: { lir12: $.data.id } }
          assert:
            - "LogInspectionRequest.${lir12}.status == FULFILLED at creation (entry date 2026-06-02 == threshold date 2026-06-02, inclusive boundary)"
            - "LogInspectionRequest.${lir12}.due_at == 2026-08-01T12:00:00Z"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: alert_create_requires_incident_not_draft
        grounds:
          - state_machines.SafetyAlert
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair SafetyAlert -> IncidentReport: opening a timely-warning
          assessment requires the incident in SUBMITTED or later non-terminal
          state; a DRAFT incident rejects with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Incident created (DRAFT), not yet submitted"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "North Gate", category: "PUBLIC_PROPERTY", is_residential_facility: false }, as: SystemAdmin, captures: { g13: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-05-05T09:00:00Z", occurred_at: "2026-05-05T08:00:00Z", geography_id: "${g13}", source: "POLICE_DIRECT", narrative: "Fight reported" }, as: PoliceChief, captures: { i13: $.data.id } }
          trigger:
            - { call: "POST /incident-reports/${i13}/safety-alerts", payload: { alert_type: "EMERGENCY_NOTIFICATION" }, as: CleryCoordinator, captures: { err13: $.data.error_id } }
            - { call: "POST /incident-reports/${i13}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i13}/safety-alerts", payload: { alert_type: "EMERGENCY_NOTIFICATION" }, as: CleryCoordinator, captures: { a13: $.data.id } }
          assert:
            - "First create attempt: error_id == ERR_INVALID_STATE, HTTP 409 (incident DRAFT)"
            - "Second attempt after submit: 201, SafetyAlert.${a13}.status == PENDING_REVIEW"
            - "SafetyAlert.${a13}.decision_deadline_at == 2026-05-07T09:00:00Z (reported_at + 48h)"

      - name: reclassification_blocked_by_published_asr
        grounds:
          - state_machines.IncidentReport.CLASSIFIED_to_UNDER_RECLASSIFICATION
          - validations[priority=7]
          - errors[ERR_REPORT_LOCKED]
        distinguishing_aspect: |
          Entity pair IncidentReport -> AnnualSecurityReport (different pair
          than alert->incident): once the year's ASR is PUBLISHED, incident
          reclassification is locked with ERR_REPORT_LOCKED.
        test_recipe:
          setup:
            - "Incident occurred 2026-01-20 CLASSIFIED with BURGLARY; ASR 2026 compiled FINAL, submitted for review, and PUBLISHED"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "West Hall", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g14: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-01-20T10:00:00Z", occurred_at: "2026-01-20T09:00:00Z", geography_id: "${g14}", source: "POLICE_DIRECT", narrative: "Dorm burglary" }, as: PoliceChief, captures: { i14: $.data.id } }
            - { call: "POST /incident-reports/${i14}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i14}/begin-classification", payload: {}, as: CleryCoordinator, captures: { i14_v: $.data.version } }
            - { call: "POST /incident-reports/${i14}/classify", payload: { geography_id: "${g14}", offense_counts: [ { offense_type: "BURGLARY", victim_count: 1 } ], expected_incident_version: "${i14_v}" }, as: CleryCoordinator }
            - { call: "POST /annual-security-reports", payload: { report_year: 2026 }, as: SystemAdmin, captures: { asr14: $.data.id, asr14_v: $.data.version } }
            - { call: "POST /annual-security-reports/${asr14}/compile", payload: { variant: "FINAL", expected_report_version: "${asr14_v}" }, as: CleryCoordinator }
            - { call: "POST /annual-security-reports/${asr14}/submit-review", payload: {}, as: CleryCoordinator }
            - { call: "POST /annual-security-reports/${asr14}/publish", payload: {}, as: PoliceChief }
          trigger:
            - { call: "POST /incident-reports/${i14}/begin-reclassification", payload: {}, as: CleryCoordinator, captures: { err14: $.data.error_id } }
          assert:
            - "error_id == ERR_REPORT_LOCKED, HTTP 409"
            - "IncidentReport.${i14}.status remains CLASSIFIED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: program_review_closed_interval_overlap
        grounds:
          - validations[priority=9]
          - errors[ERR_REVIEW_SCOPE_OVERLAP]
          - entities.ProgramReview.fields.scope_year_end
        distinguishing_aspect: |
          Closed integer-year intervals on ProgramReview: [2025, 2026] collides
          with existing [2023, 2025] because the shared boundary year 2025
          counts as overlap; [2026, 2027] is accepted.
        test_recipe:
          setup:
            - "One non-CLOSED ProgramReview covering [2023, 2025]"
          setup_api_calls:
            - { call: "POST /program-reviews", payload: { scope_year_start: 2023, scope_year_end: 2025 }, as: FederalReviewer, captures: { pr15: $.data.id } }
          trigger:
            - { call: "POST /program-reviews", payload: { scope_year_start: 2025, scope_year_end: 2026 }, as: FederalReviewer, captures: { err15: $.data.error_id } }
            - { call: "POST /program-reviews", payload: { scope_year_start: 2026, scope_year_end: 2027 }, as: FederalReviewer, captures: { pr15b: $.data.id } }
          assert:
            - "First trigger: error_id == ERR_REVIEW_SCOPE_OVERLAP, HTTP 409 (shared boundary year 2025 under closed-interval semantics)"
            - "Second trigger: 201, ProgramReview.${pr15b}.status == OPENED (disjoint interval accepted)"

      - name: csa_training_half_open_window_overlap
        grounds:
          - calculations.csa_certification_window
          - errors[ERR_TRAINING_WINDOW_OVERLAP]
          - entities.CSATrainingRecord.fields.valid_to
        distinguishing_aspect: |
          Half-open datetime windows [valid_from, valid_to) on CSATrainingRecord
          — different interval semantics than the closed year-interval of
          ProgramReview, on a different resource: a record starting strictly
          inside the prior window is rejected, while a record starting after
          valid_to is accepted (adjacency permitted).
        test_recipe:
          setup:
            - "CSA registered; one passing training record completed 2026-01-15T10:00:00Z (valid_to 2027-09-30T23:59:59Z); CSA ACTIVE"
          setup_api_calls:
            - { call: "POST /campus-security-authorities", payload: { full_name: "Dana Dean", email: "dana@example.edu", department: "Student Affairs", csa_category: "DEAN" }, as: SystemAdmin, captures: { csa16: $.data.id } }
            - { call: "POST /campus-security-authorities/${csa16}/training-records", payload: { completed_at: "2026-01-15T10:00:00Z", score: 90 }, as: SystemAdmin, captures: { tr16: $.data.id } }
          trigger:
            - { call: "POST /campus-security-authorities/${csa16}/training-records", payload: { completed_at: "2027-06-01T09:00:00Z", score: 85 }, as: SystemAdmin, captures: { err16: $.data.error_id } }
            - { call: "POST /campus-security-authorities/${csa16}/training-records", payload: { completed_at: "2027-10-05T09:00:00Z", score: 85 }, as: SystemAdmin, captures: { tr16b: $.data.id } }
          assert:
            - "First trigger: error_id == ERR_TRAINING_WINDOW_OVERLAP, HTTP 409 (2027-06-01T09:00:00Z lies inside [2026-01-15T10:00:00Z, 2027-09-30T23:59:59Z))"
            - "Second trigger: 201, CSATrainingRecord.${tr16b}.valid_to == 2028-09-30T23:59:59Z"
            - "CampusSecurityAuthority.${csa16}.status == ACTIVE with certification_expires_at == 2028-09-30T23:59:59Z"

  - rule_id: compensating_invariant
    instances:
      - name: reclassification_count_conservation
        grounds:
          - calculations.asr_statistics_compilation
          - state_machines.IncidentReport.UNDER_RECLASSIFICATION_to_CLASSIFIED
        distinguishing_aspect: |
          Conserved quantity: total ASR offense count. A reclassify A->B
          followed by its compensation B->A, each with a recompile, must return
          SUM(StatisticLine.count) over CURRENT FINAL rows to exactly the
          original value — no drift through the amendment machinery.
        test_recipe:
          setup:
            - "Incident occurred 2026-03-22 CLASSIFIED with ROBBERY; ASR 2026 compiled FINAL once (baseline total == 1)"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "East Walk", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g17: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-03-22T10:00:00Z", occurred_at: "2026-03-22T09:00:00Z", geography_id: "${g17}", source: "POLICE_DIRECT", narrative: "Robbery" }, as: PoliceChief, captures: { i17: $.data.id } }
            - { call: "POST /incident-reports/${i17}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i17}/begin-classification", payload: {}, as: CleryCoordinator, captures: { i17_v1: $.data.version } }
            - { call: "POST /incident-reports/${i17}/classify", payload: { geography_id: "${g17}", offense_counts: [ { offense_type: "ROBBERY", victim_count: 1 } ], expected_incident_version: "${i17_v1}" }, as: CleryCoordinator }
            - { call: "POST /annual-security-reports", payload: { report_year: 2026 }, as: SystemAdmin, captures: { asr17: $.data.id, asr17_v1: $.data.version } }
            - { call: "POST /annual-security-reports/${asr17}/compile", payload: { variant: "FINAL", expected_report_version: "${asr17_v1}" }, as: CleryCoordinator, captures: { asr17_v2: $.data.version } }
          trigger:
            - { call: "POST /incident-reports/${i17}/begin-reclassification", payload: {}, as: CleryCoordinator, captures: { i17_v2: $.data.version } }
            - { call: "POST /incident-reports/${i17}/classify", payload: { geography_id: "${g17}", offense_counts: [ { offense_type: "BURGLARY", victim_count: 1 } ], expected_incident_version: "${i17_v2}" }, as: CleryCoordinator }
            - { call: "POST /annual-security-reports/${asr17}/compile", payload: { variant: "FINAL", expected_report_version: "${asr17_v2}" }, as: CleryCoordinator, captures: { asr17_v3: $.data.version } }
            - { call: "POST /incident-reports/${i17}/begin-reclassification", payload: {}, as: CleryCoordinator, captures: { i17_v3: $.data.version } }
            - { call: "POST /incident-reports/${i17}/classify", payload: { geography_id: "${g17}", offense_counts: [ { offense_type: "ROBBERY", victim_count: 1 } ], expected_incident_version: "${i17_v3}" }, as: CleryCoordinator }
            - { call: "POST /annual-security-reports/${asr17}/compile", payload: { variant: "FINAL", expected_report_version: "${asr17_v3}" }, as: CleryCoordinator, captures: { asr17_v4: $.data.version } }
            - { call: "GET /annual-security-reports/${asr17}/statistic-lines", payload: { compilation_variant: "FINAL" }, as: CleryCoordinator }
          assert:
            - "After forward reclassification + recompile: single CURRENT line (BURGLARY, ON_CAMPUS) count == 1; total across CURRENT lines == 1"
            - "After compensating reclassification + recompile: single CURRENT line (ROBBERY, ON_CAMPUS) count == 1; total == 1 == baseline"
            - "AnnualSecurityReport.${asr17}.statistics_version == 3 and statistics_stale == false after the final compile"

      - name: log_entry_cardinality_conservation
        grounds:
          - state_machines.DailyCrimeLogEntry.OPEN_to_INVESTIGATION_PENDING
          - state_machines.DailyCrimeLogEntry.CLEARED_BY_ARREST_to_OPEN
          - entities.DailyCrimeLogEntry.fields.entry_number
        distinguishing_aspect: |
          Conserved quantity: per-incident log-entry cardinality and entry
          identity. Disposition forward (OPEN -> INVESTIGATION_PENDING ->
          CLEARED_BY_ARREST) plus its compensation (reopen to OPEN) leaves
          COUNT(entries for the incident) == 1 and entry_number unchanged —
          dispositions mutate in place, never append or delete.
        test_recipe:
          setup:
            - "Incident submitted; exactly one log entry exists with disposition OPEN"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "North Walk", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g18: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-02T10:00:00Z", occurred_at: "2026-04-02T09:00:00Z", geography_id: "${g18}", source: "POLICE_DIRECT", narrative: "Theft" }, as: PoliceChief, captures: { i18: $.data.id } }
            - { call: "POST /incident-reports/${i18}/submit", payload: {}, as: PoliceChief }
            - { call: "GET /daily-crime-log", payload: { incident_id: "${i18}" }, as: PoliceChief, captures: { le18: "$.data[0].id", le18_no: "$.data[0].entry_number" } }
          trigger:
            - { call: "PATCH /daily-crime-log-entries/${le18}/disposition", payload: { disposition: "INVESTIGATION_PENDING" }, as: PoliceChief }
            - { call: "PATCH /daily-crime-log-entries/${le18}/disposition", payload: { disposition: "CLEARED_BY_ARREST" }, as: PoliceChief }
            - { call: "PATCH /daily-crime-log-entries/${le18}/disposition", payload: { disposition: "OPEN" }, as: PoliceChief }
            - { call: "GET /daily-crime-log", payload: { incident_id: "${i18}" }, as: PoliceChief }
          assert:
            - "GET /daily-crime-log?incident_id returns total_count == 1 (cardinality conserved through the forward + compensating disposition pair)"
            - "The single entry's entry_number == ${le18_no} (identity conserved)"
            - "The single entry's disposition == OPEN (state restored) while updated_at advanced"
