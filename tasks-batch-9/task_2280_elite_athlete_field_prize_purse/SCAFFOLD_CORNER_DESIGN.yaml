# =============================================================================
# task_2280 — Elite Athlete Field & Prize Purse Administration
# §1.9 Scaffold Corner Design — breadth coverage of every testable claim in
# §1.1–§1.7 that §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) does not already probe.
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; corners already asserted by a §1.8
# instance are emitted as excluded_because stubs citing that instance by name.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: corner_create_race_edition_returns_full_ledger_baseline
        claim_type: creation
        grounds:
          - entities.RaceEdition
          - state_machines.RaceEdition.initial_state
        distinguishing_aspect: >-
          A brand-new RaceEdition must come back with all six required inputs echoed AND every
          computed ledger field seeded from them, so purse_unallocated_cents equals
          total_purse_cents rather than 0.
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
          trigger:
            - call: POST /race-editions
              payload:
                name: "Corner Creation Marathon"
                city: "Metro City"
                race_date: "2026-11-01"
                appearance_budget_cents: 4000000
                total_purse_cents: 6000000
                bonus_pool_cap_cents: 500000
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: GET /race-editions/${ed_id}
              as: ElitesDirector
          assert:
            - "trigger call 1 returns HTTP 201 with name == \"Corner Creation Marathon\", city == \"Metro City\", race_date == \"2026-11-01\", appearance_budget_cents == 4000000, total_purse_cents == 6000000, bonus_pool_cap_cents == 500000"
            - "trigger call 1 returns status == PLANNING, appearance_committed_cents == 0, appearance_uncommitted_cents == 4000000, purse_allocated_cents == 0, purse_unallocated_cents == 6000000, bonus_pool_consumed_cents == 0, expired_offer_count == 0"
            - "trigger call 1 returns version == 1 with non-null id, created_at and updated_at"
            - "trigger call 2 returns exactly the same field values, so the row was persisted rather than echoed"

      - name: corner_read_athlete_returns_stored_representation
        claim_type: retrieval
        grounds:
          - entities.Athlete
        distinguishing_aspect: >-
          GET /athletes/{id} must return the stored athlete including the derived
          tax_residency_country default, not a blank profile.
        test_recipe:
          setup:
            - "One athlete registered with country_code KEN and no explicit tax_residency_country."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /athletes
              payload: { full_name: "Read Back Ruth", country_code: KEN, gender: FEMALE, birth_date: "1997-04-04" }
              as: ElitesDirector
              captures: { ath_id: "$.data.id" }
          trigger:
            - call: GET /athletes/${ath_id}
              as: ElitesDirector
          assert:
            - "trigger call 1 returns HTTP 200 with full_name == \"Read Back Ruth\", country_code == KEN, gender == FEMALE, birth_date == \"1997-04-04\""
            - "trigger call 1 returns tax_residency_country == KEN — it defaults to country_code at creation"
            - "trigger call 1 returns missed_test_count == 0 and version == 1"

      - name: corner_list_invitations_pagination_envelope_and_filter
        claim_type: listing
        grounds:
          - endpoints[GET /invitations]
          - response_envelope.pagination_fields
        distinguishing_aspect: >-
          The list envelope must carry total_count for the WHOLE filtered set (3) while data holds
          only the requested page (2), and has_more must flip to false on the second page.
        test_recipe:
          setup:
            - "One FIELD_OPEN edition with three DRAFT invitations for three athletes sharing one agent."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload: { name: "Pagination Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 9000000, total_purse_cents: 3000000, bonus_pool_cap_cents: 0 }
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Page Turner Sports", license_code: "AGT-PG-1" }
              as: ElitesDirector
              captures: { agt_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Page One", country_code: USA, gender: MALE, birth_date: "1996-01-01" }
              as: ElitesDirector
              captures: { athA_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Page Two", country_code: USA, gender: MALE, birth_date: "1996-02-02" }
              as: ElitesDirector
              captures: { athB_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Page Three", country_code: USA, gender: MALE, birth_date: "1996-03-03" }
              as: ElitesDirector
              captures: { athC_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${athA_id}", race_name: "Qual PA", performance_date: "2026-03-01", performance_seconds: 7900, division: ELITE, sanctioning_ref: "SB-P-A", chip_timed: true }
              as: ElitesDirector
              captures: { prA_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${athB_id}", race_name: "Qual PB", performance_date: "2026-03-02", performance_seconds: 7910, division: ELITE, sanctioning_ref: "SB-P-B", chip_timed: true }
              as: ElitesDirector
              captures: { prB_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${athC_id}", race_name: "Qual PC", performance_date: "2026-03-03", performance_seconds: 7920, division: ELITE, sanctioning_ref: "SB-P-C", chip_timed: true }
              as: ElitesDirector
              captures: { prC_id: "$.data.id" }
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${athA_id}", agent_id: "${agt_id}", qualifying_performance_id: "${prA_id}", division: ELITE }
              as: ElitesDirector
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${athB_id}", agent_id: "${agt_id}", qualifying_performance_id: "${prB_id}", division: ELITE }
              as: ElitesDirector
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${athC_id}", agent_id: "${agt_id}", qualifying_performance_id: "${prC_id}", division: ELITE }
              as: ElitesDirector
          trigger:
            - call: GET /invitations
              payload: { race_edition_id: "${ed_id}", limit: 2, offset: 0 }
              as: ElitesDirector
            - call: GET /invitations
              payload: { race_edition_id: "${ed_id}", limit: 2, offset: 2 }
              as: ElitesDirector
            - call: GET /invitations
              payload: { race_edition_id: "${ed_id}", status: ACCEPTED }
              as: ElitesDirector
            - call: GET /invitations
              payload: { race_edition_id: "${ed_id}", limit: 200 }
              as: ElitesDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger call 1 returns total_count == 3, has_more == true and exactly 2 rows in data"
            - "trigger call 2 returns total_count == 3, has_more == false and exactly 1 row in data"
            - "trigger call 3 returns total_count == 0 with an empty data array — the status filter narrows the count, not just the page"
            - "trigger call 4 returns HTTP 400 with error_id == ERR_INVALID_REQUEST because limit 200 exceeds the declared maximum of 100"

      - name: corner_get_unknown_race_edition_returns_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_RACE_EDITION_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: >-
          A syntactically valid but unknown UUID must produce the entity-specific 404
          ERR_RACE_EDITION_NOT_FOUND, not a generic 400 or an empty 200.
        test_recipe:
          setup:
            - "Empty database; no editions exist."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
          trigger:
            - call: GET /race-editions/00000000-0000-4000-8000-000000000000
              as: ElitesDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger call 1 returns HTTP 404 with error_id == ERR_RACE_EDITION_NOT_FOUND"
            - "the error body follows the §1.0 error envelope: response_type == \"error\" with data.error_id and data.message present"

      - name: corner_create_race_edition_missing_total_purse_rejected
        claim_type: required_fields
        grounds:
          - errors.ERR_INVALID_REQUEST
          - validations[priority=4]
        distinguishing_aspect: >-
          total_purse_cents has source input and no default, so omitting it must fail schema
          validation rather than defaulting the purse to zero.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
          trigger:
            - call: POST /race-editions
              payload: { name: "Missing Field Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 4000000, bonus_pool_cap_cents: 0 }
              as: ElitesDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger call 1 returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "no RaceEdition row is created — a subsequent GET /race-editions/{any id} could not resolve one"

      - name: corner_optional_fields_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.RaceEdition.fields.offer_response_days
          - entities.RaceEdition.fields.max_negotiation_rounds
          - entities.RaceEdition.fields.masters_min_age
          - entities.Athlete.fields.w8ben_on_file
          - entities.DivisionStandard.fields.window_months
        distinguishing_aspect: >-
          Every omitted optional must land on its declared default — 14 response days, 3 negotiation
          rounds, masters age 40, 24-month qualifying window, w8ben_on_file false, treaty 0 bps and
          requires_chip_timing true — rather than null.
        test_recipe:
          setup:
            - "Empty database; one edition, one standard and one athlete are created with only their required fields."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
          trigger:
            - call: POST /race-editions
              payload: { name: "Defaults Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 4000000, total_purse_cents: 6000000, bonus_pool_cap_cents: 0 }
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /athletes
              payload: { full_name: "Default Dana", country_code: USA, gender: MALE, birth_date: "1996-05-05" }
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Default Agency", license_code: "AGT-DF-1" }
              as: ElitesDirector
          assert:
            - "trigger call 1 returns offer_response_days == 14, max_negotiation_rounds == 3, masters_min_age == 40 and all four course_record_*_seconds == null"
            - "trigger call 2 returns window_months == 24 and requires_chip_timing == true"
            - "trigger call 3 returns w8ben_on_file == false, treaty_withholding_bps == 0, whereabouts_filed == false and missed_test_count == 0"
            - "trigger call 4 returns status == ACTIVE for the agent"

      - name: corner_invitation_computed_fields_seeded_then_derived_from_offer
        claim_type: computed_fields
        grounds:
          - entities.Invitation.fields.guaranteed_commitment_cents
          - entities.Invitation.fields.full_exposure_cents
          - entities.Invitation.fields.round_count
          - calculations.invitation_package_valuation
        distinguishing_aspect: >-
          The four computed Invitation fields are server-derived at every step: zero in DRAFT, then
          exactly the package valuation of the posted offer terms — never a client-supplied figure,
          since POST /invitations declares no money field at all.
        test_recipe:
          setup:
            - "One FIELD_OPEN edition with an ELITE MALE standard of 8100 and a single OVERALL MALE place-1 purse line of 1,000,000."
            - "One athlete with a VERIFIED 7900 performance and one ACTIVE agent."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload: { name: "Computed Fields Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 9000000, total_purse_cents: 3000000, bonus_pool_cap_cents: 0 }
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Derived Terms Reps", license_code: "AGT-DR-1" }
              as: ElitesDirector
              captures: { agt_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Derived Dee", country_code: USA, gender: MALE, birth_date: "1996-06-06" }
              as: ElitesDirector
              captures: { ath_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${ath_id}", race_name: "Qual CF", performance_date: "2026-03-01", performance_seconds: 7900, division: ELITE, sanctioning_ref: "SB-CF-1", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt_id}"
              captures: { pr_id: "$.data.id" }
            - call: POST /performance-records/${pr_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: TechnicalOfficial
          trigger:
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${ath_id}", agent_id: "${agt_id}", qualifying_performance_id: "${pr_id}", division: ELITE }
              as: ElitesDirector
              captures: { inv_id: "$.data.id" }
            - call: POST /invitations/${inv_id}/offer
              payload: { appearance_fee_cents: 1000000, air_class: PREMIUM_ECONOMY, hotel_nights: 4, ground_transport: true }
              as: ElitesDirector
            - call: GET /race-editions/${ed_id}
              as: ElitesDirector
          assert:
            - "trigger call 1 returns guaranteed_commitment_cents == 0, full_exposure_cents == 0, round_count == 0, bib_number == null and status == DRAFT"
            - "trigger call 2 returns guaranteed_commitment_cents == 1406000 (1,000,000 fee + 260,000 PREMIUM_ECONOMY + 128,000 for 4 nights at 32,000 + 18,000 ground transport)"
            - "trigger call 2 returns full_exposure_cents == 2406000 (the guaranteed package plus the single 1,000,000 OVERALL line, since no TIME_BONUS or RECORD_BONUS line exists)"
            - "trigger call 2 returns round_count == 1 and status == OFFERED"
            - "trigger call 3 returns appearance_committed_cents == 0 — an offer alone commits nothing; only acceptance debits the budget"

      - name: corner_system_fields_are_server_minted_on_athlete
        claim_type: system_fields
        grounds:
          - entities.Athlete.fields.missed_test_count
          - complexity_profile.entity_topology
        distinguishing_aspect: >-
          id, created_at, updated_at, version and missed_test_count are all system-sourced: the
          create endpoint declares none of them as input, and two athletes created one logical
          second apart must receive distinct created_at values reflecting the logical clock, not wall
          time.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z and then advanced one second."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
          trigger:
            - call: POST /athletes
              payload: { full_name: "System Sam", country_code: USA, gender: MALE, birth_date: "1996-07-07" }
              as: ElitesDirector
              captures: { athA_id: "$.data.id" }
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:01Z" }
              as: ElitesDirector
            - call: POST /athletes
              payload: { full_name: "System Sue", country_code: USA, gender: FEMALE, birth_date: "1996-08-08" }
              as: ElitesDirector
              captures: { athB_id: "$.data.id" }
            - call: GET /athletes/${athA_id}
              as: ElitesDirector
          assert:
            - "trigger call 1 returns created_at == \"2026-08-01T00:00:00.000Z\" and updated_at equal to created_at, with version == 1 and missed_test_count == 0"
            - "trigger call 3 returns created_at == \"2026-08-01T00:00:01.000Z\" — the logical clock, not wall time, stamps the row"
            - "trigger call 1 and trigger call 3 return different id values, both plain UUIDs with no type prefix"
            - "trigger call 4 shows the first athlete's created_at unchanged at \"2026-08-01T00:00:00.000Z\""

      - name: corner_type_constraints_rejected_on_purse_line_and_result
        claim_type: type_constraints
        grounds:
          - entities.PurseLine.fields.amount_cents
          - entities.PurseLine.fields.place
          - errors.ERR_INVALID_REQUEST
          - validations[priority=4]
        distinguishing_aspect: >-
          Numeric constraints and enum membership are enforced per field: amount_cents must be
          strictly positive, place must fall in 1..20, category must be a declared enum member, and
          bib_range_end must not precede bib_range_start.
        test_recipe:
          setup:
            - "One PLANNING edition with no purse lines yet."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload: { name: "Constraint Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 4000000, total_purse_cents: 6000000, bonus_pool_cap_cents: 0 }
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
          trigger:
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 0 }
              as: ElitesDirector
              captures: { err1: "$.data.error_id" }
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 21, amount_cents: 100000 }
              as: ElitesDirector
              captures: { err2: "$.data.error_id" }
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: PODIUM, gender: MALE, place: 1, amount_cents: 100000 }
              as: ElitesDirector
              captures: { err3: "$.data.error_id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 20, bib_range_end: 11 }
              as: ElitesDirector
              captures: { err4: "$.data.error_id" }
            - call: GET /race-editions/${ed_id}/purse-lines
              as: ElitesDirector
          assert:
            - "trigger call 1 returns HTTP 400 with error_id == ERR_INVALID_REQUEST — amount_cents must be > 0"
            - "trigger call 2 returns HTTP 400 with error_id == ERR_INVALID_REQUEST — place 21 is outside the 1..20 constraint"
            - "trigger call 3 returns HTTP 400 with error_id == ERR_INVALID_REQUEST — PODIUM is not a member of the category enum"
            - "trigger call 4 returns HTTP 400 with error_id == ERR_INVALID_REQUEST — bib_range_end 11 precedes bib_range_start 20"
            - "trigger call 5 returns total_count == 0 — none of the four rejected requests persisted anything"

      - name: corner_negotiation_round_is_immutable_and_versionless
        claim_type: immutability
        grounds:
          - entities.NegotiationRound
          - endpoints[GET /invitations/{id}/negotiation-rounds]
        distinguishing_aspect: >-
          NegotiationRound is declared common_fields false, so its rows carry id and created_at but
          NO version field and no update or delete endpoint exists — history is append-only, and a
          later round never rewrites an earlier one.
        test_recipe:
          setup:
            - "One FIELD_OPEN edition; one invitation OFFERED at 1,000,000 then countered by the agent at 1,500,000, so two rounds exist."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload: { name: "Immutable History Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 9000000, total_purse_cents: 3000000, bonus_pool_cap_cents: 0 }
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Append Only Reps", license_code: "AGT-AO-1" }
              as: ElitesDirector
              captures: { agt_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "History Hank", country_code: USA, gender: MALE, birth_date: "1996-09-09" }
              as: ElitesDirector
              captures: { ath_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${ath_id}", race_name: "Qual IM", performance_date: "2026-03-01", performance_seconds: 7900, division: ELITE, sanctioning_ref: "SB-IM-1", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt_id}"
              captures: { pr_id: "$.data.id" }
            - call: POST /performance-records/${pr_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: TechnicalOfficial
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${ath_id}", agent_id: "${agt_id}", qualifying_performance_id: "${pr_id}", division: ELITE }
              as: ElitesDirector
              captures: { inv_id: "$.data.id" }
            - call: POST /invitations/${inv_id}/offer
              payload: { appearance_fee_cents: 1000000, air_class: ECONOMY, hotel_nights: 2, ground_transport: false }
              as: ElitesDirector
              captures: { inv_v: "$.data.version" }
          trigger:
            - call: POST /invitations/${inv_id}/negotiation-rounds
              payload: { appearance_fee_cents: 1500000, air_class: BUSINESS, hotel_nights: 5, ground_transport: true, expected_invitation_version: "${inv_v}" }
              as: AthleteAgent
              as_user_id: "${agt_id}"
            - call: GET /invitations/${inv_id}/negotiation-rounds
              payload: { side: COMMITTEE }
              as: ElitesDirector
            - call: GET /invitations/${inv_id}/negotiation-rounds
              as: ElitesDirector
          assert:
            - "trigger call 1 returns HTTP 201 with id and created_at present and NO version field on the NegotiationRound body"
            - "trigger call 2 returns total_count == 1 with data[0].round_number == 1, data[0].appearance_fee_cents == 1000000 and data[0].air_class == ECONOMY — the original committee round is preserved verbatim after the counter"
            - "trigger call 3 returns total_count == 2 in ascending round_number, so history is append-only"
            - "no PATCH, PUT or DELETE endpoint for negotiation rounds exists anywhere in §1.5"

      - name: corner_purse_line_requires_existing_parent_edition
        claim_type: parent_relationships
        grounds:
          - entities.PurseLine.parent
          - errors.ERR_RACE_EDITION_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: >-
          PurseLine declares RaceEdition as its parent through a body FK, so an unknown
          race_edition_id must yield 404 ERR_RACE_EDITION_NOT_FOUND before any schema or state check
          on the line itself.
        test_recipe:
          setup:
            - "Empty database; no editions exist."
          setup_api_calls:
