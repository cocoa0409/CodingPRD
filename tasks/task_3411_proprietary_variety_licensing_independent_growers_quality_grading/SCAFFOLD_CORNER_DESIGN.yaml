            - "HarvestLot.${hb2_id}.grade == REJECT — brix 4.9 < 5.0 fails every band"
            - "after certification the REJECT lot has lot_status == REJECTED (never GRADED) and will be excluded from pooling"

      - name: pool_membership_half_open_window
        claim_type: Input Set Filtering
        grounds:
          - calculations.pool_rate
          - entities.HarvestLot.fields.pool_period_id
        distinguishing_aspect: "Pool membership uses the half-open [week_start, week_end): H1 received 2026-10-06 is included; HY received exactly at week_end 2026-10-12T00:00:00Z is excluded — it keeps pool_period_id null, stays GRADED (not SETTLED), and gets no provisional gross."
        test_recipe:
          setup: ["Corner pool scenario closed @500 (aliases the &c_ pool chain through close; no settle)."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
            - *c_w1
            - *c_p1
            - *c_clock_aug
            - *c_p1_conf
            - *c_clock_h1a
            - *c_h1
            - *c_clock_h1b
            - *c_h1_recv
            - *c_h1_grade
            - *c_h1_cert
            - *c_p1_get3
            - *c_clock_oct11
            - *c_hy
            - *c_clock_oct12
            - *c_hy_recv
            - *c_hy_grade
            - *c_hy_cert
            - *c_poolx
            - *c_closex
          trigger:
            - call: "GET /licensing/harvest-lots"
              payload: { pool_period_id: "${cx_pool}" }
              as: SettlementOfficer
            - call: "GET /licensing/harvest-lots/${hy_id}"
              payload: {}
              as: SettlementOfficer
            - call: "GET /licensing/harvest-lots/${h1_id}"
              payload: {}
              as: SettlementOfficer
          assert:
            - "GET /licensing/harvest-lots?pool_period_id=${cx_pool} returns exactly 1 row: ${h1_id}"
            - "HarvestLot.${h1_id}.pool_period_id == ${cx_pool} and lot_gross_provisional_cents == 540500"
            - "HarvestLot.${hy_id}: pool_period_id is null, lot_status stays GRADED, lot_gross_provisional_cents is null — received_at == week_end is outside the half-open window"
            - "HY being uncertified-or-not is irrelevant to the close gate because the gate scans only lots whose received_at falls inside [week_start, week_end)"

      - name: window_capacity_cap_boundary
        claim_type: Constants Applied
        grounds:
          - calculations.expected_yield_and_booking
          - errors.ERR_WINDOW_CAPACITY_EXCEEDED
        distinguishing_aspect: "The oversubscribe cap is inclusive: booking 480 strawberry plants yields exactly 1200.0 kg == 1000 x 1.20 and is accepted; a further 80 plants (1400.0 kg total) crosses the cap and is rejected 409."
        test_recipe:
