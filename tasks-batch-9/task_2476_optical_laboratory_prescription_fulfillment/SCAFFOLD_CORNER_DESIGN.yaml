              payload: { design_code: "SV-POLY", design_type: "SINGLE_VISION", material: "POLYCARBONATE", allowed_coatings: ["AR_STANDARD", "HARDCOAT"], retail_price_cents: 11995, min_fitting_height_mm: 14.0, min_blank_diameter_mm: 65.0, product_tier: "STANDARD", stock_sku_available: true, base_curve: 6.0 }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { design_sv_id: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat_id}", prescriber_id: "${presc_id}", prescriber_npi_claimed: "1234567893", prescriber_license_state_claimed: "CA", sphere_od: -2.00, cylinder_od: -1.00, axis_od: 90, sphere_os: -2.00, cylinder_os: -1.00, axis_os: 90, pd_distance_mm: 63.0, issued_on: "2026-03-01" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { rx_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/verify"
              payload: { verification_note: "NPI and license match the prescriber record" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
            - call: "POST /rx-orders"
              payload: { patient_id: "${pat_id}", prescription_id: "${rx_id}", lens_design_id: "${design_sv_id}", frame_sku: "FRM-S10", frame_retail_cents: 8995, requested_coatings: ["AR_STANDARD"], monocular_pd_od_mm: 31.5, monocular_pd_os_mm: 31.5, fitting_height_mm: 16.0 }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { order_id: $.data.id, order_v: $.data.version }
          trigger:
            - call: "POST /frame-layouts"
              payload: { rx_order_id: "${order_id}", expected_rx_order_version: "${order_v}", trace_source: "DIGITAL_TRACER", a_mm: 50.0, b_mm: 28.0, ed_mm: 52.0, dbl_mm: 17.0 }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { layout_id: $.data.id, needed: $.data.required_blank_diameter_mm, eff_fh: $.data.effective_fitting_height_mm, lstatus: $.data.layout_status }
            - call: "GET /rx-orders/${order_id}"
              as: LabTechnician
              as_user_id: "0b000000-0000-4000-8000-000000000001"
              captures: { order_status_now: $.data.fulfillment_status, order_v_now: $.data.version }
          assert:
            - "the create response itself carries ${needed} == 58.0, ${eff_fh} == 16.0 and ${lstatus} == COMPUTED"
            - "${order_status_now} == LAYOUT_READY and ${order_v_now} == 2 on the very next read, with no retry"
            - "GET /frame-layouts/${layout_id} returns decentration_h_od_mm 2.0, decentration_h_os_mm 2.0 and decentration_v_mm 2.0"
            - "GET /rx-orders/${order_id}/frame-layouts returns meta.total_count == 1 immediately"





