# =============================================================================
# Example: clinical-trial benchmark seed tables (v1)
# =============================================================================

scenario: |
  Clinical trial governance platform. Manages multi-trial research programs
  including investigator accountability, patient safety, ethical compliance
  budgeting, and portfolio-level risk containment. Covers trial lifecycle,
  protocol deviations, procedure executions, IRB approvals, enrollment
  blackout windows, cohort incompatibilities, and reputation-based spending
  authority scaling.

domain_name: clinical-trial
api_prefix: /research-programs

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: ResearchProgram
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: description, type: string, source: input, required: false, description: "Optional description" }
      - { name: current_period_index, type: integer, source: system, default: 0, description: "Deterministic clock, advances via admin action" }

  - name: TrialPortfolio
    parent: ResearchProgram
    common_fields: true
    fields:
      - { name: research_program_id, type: string, source: system, description: "Parent program ID" }
      - { name: name, type: string, source: input, description: "Portfolio name" }
      - { name: description, type: string, source: input, required: false, description: "Optional description" }
      - { name: max_total_ethical_budget, type: integer, source: input, description: "Maximum aggregate ethical budget cap" }
      - { name: is_risk_saturated, type: boolean, source: computed, description: "True when aggregate consumption >= 90% of max_total_ethical_budget" }

  - name: ClinicalTrial
    parent: ResearchProgram
    common_fields: true
    fields:
      - { name: research_program_id, type: string, source: system, description: "Parent program ID" }
      - { name: treatment_name, type: string, source: input, description: "Name of intervention under study" }
      - { name: total_ethical_compliance_budget, type: integer, source: input, description: "Nominal budget before reputation scaling (non-negative integer)" }
      - { name: effective_ethical_compliance_budget, type: number, source: computed, description: "= total_budget * (reputation_score / 100)" }
      - { name: ethical_compliance_balance, type: number, source: computed, description: "= effective_budget - provisional_debits - finalized_debits" }
      - { name: patient_safety_risk, type: number, source: computed, description: "Cumulative safety risk score" }
      - { name: investigator_id, type: string, source: system, description: "ID of the creating user (from X-User-ID)" }
      - { name: irb_id, type: string, source: input, description: "IRB overseeing this trial" }
      - { name: portfolio_id, type: string, source: input, required: false, description: "Optional portfolio grouping" }
      - { name: deviation_penalty_tier, type: integer, source: computed, default: 0, description: "Increments with each deviation cancellation" }
      - { name: is_under_contagion, type: boolean, source: computed, default: false, description: "True when portfolio peer triggered risk contagion" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → COMPLETED / ABANDONED / ETHICAL_REVIEW_LOCK" }

  - name: EthicalComplianceBudgetLedger
    parent: ClinicalTrial
    common_fields: true
    fields:
      - { name: trial_id, type: string, source: system, description: "Associated trial ID" }
      - { name: provisional_debits, type: number, source: computed, description: "Sum of provisional ethical review costs" }
      - { name: finalized_debits, type: number, source: computed, description: "Sum of finalized ethical review costs" }

  - name: PatientSafetyRiskLedger
    parent: ClinicalTrial
    common_fields: true
    fields:
      - { name: trial_id, type: string, source: system, description: "Associated trial ID" }
      - { name: risk_score, type: number, source: computed, description: "Cumulative risk score" }

  - name: InvestigatorReputation
    parent: ResearchProgram
    common_fields: true
    fields:
      - { name: research_program_id, type: string, source: system, description: "Parent program ID" }
      - { name: investigator_id, type: string, source: system, description: "Investigator user ID" }
      - { name: reputation_score, type: number, source: computed, default: 100, description: "Trust score 0-100, initialized at 100" }
      - { name: is_on_probation, type: boolean, source: computed, description: "True when reputation_score < 40" }

  - name: TrialPhase
    parent: ClinicalTrial
    common_fields: true
    fields:
      - { name: trial_id, type: string, source: system, description: "Associated trial ID" }
      - { name: research_program_id, type: string, source: system, description: "Parent program ID" }
      - { name: name, type: enum, source: input, description: "PHASE_I | PHASE_II | PHASE_III | PHASE_IV" }
      - { name: status, type: enum, source: system, description: "PENDING → READY_FOR_PROCEDURES → COMPLETED / CANCELLED / REVIEW_REQUIRED" }

  - name: ProtocolProcedure
    parent: TrialPhase
    common_fields: true
    fields:
      - { name: phase_id, type: string, source: system, description: "Associated phase ID" }
      - { name: trial_id, type: string, source: system, description: "Associated trial ID" }
      - { name: research_program_id, type: string, source: system, description: "Parent program ID" }
      - { name: procedure_type, type: string, source: input, description: "Descriptive identifier for intervention/test" }
      - { name: required_cohort_tag, type: enum, source: input, description: "HEALTHY_VOLUNTEERS | HIGH_RISK_PATIENTS | NONE" }
      - { name: base_risk_cost, type: integer, source: input, description: "Risk points for deviation calculations" }
      - { name: integrity_score_value, type: integer, source: input, description: "Credit applied when non-deviation executions pass" }
      - { name: status, type: enum, source: system, description: "PENDING → AWAITING_EXECUTION → PASSED / FAILED / CANCELLED" }

  - name: PatientCohort
    parent: ClinicalTrial
    common_fields: true
    fields:
      - { name: trial_id, type: string, source: system, description: "Associated trial ID" }
      - { name: research_program_id, type: string, source: system, description: "Parent program ID" }
      - { name: cohort_name, type: string, source: input, description: "Cohort name" }
      - { name: cohort_version, type: string, source: input, description: "Cohort version" }
      - { name: base_risk_points, type: integer, source: input, description: "Intrinsic risk for this population" }
      - { name: properties, type: array, source: input, description: "List of properties with property_id, name (HEALTHY_VOLUNTEERS|HIGH_RISK_PATIENTS|CONTAINS_PLACEBO), certified_period_index" }

  - name: ProcedureExecution
    parent: ClinicalTrial
    common_fields: true
    fields:
      - { name: trial_id, type: string, source: system, description: "Associated trial ID" }
      - { name: research_program_id, type: string, source: system, description: "Parent program ID" }
      - { name: procedure_id, type: string, source: input, description: "Associated procedure ID" }
      - { name: cohort_id, type: string, source: input, description: "Associated cohort ID" }
      - { name: protocol_deviation, type: boolean, source: input, description: "Whether this is a protocol deviation" }
      - { name: provisional_risk_debit, type: number, source: computed, description: "Provisional ethical debit for deviations" }
      - { name: final_risk_debit, type: number, source: computed, description: "Final ethical debit upon passing (deviations only)" }
      - { name: deviation_penalty_applied, type: boolean, source: computed, description: "True if ledger side-effects occurred" }
      - { name: is_expedited_review, type: boolean, source: computed, description: "True if execution triggered expedited threshold crossing" }
      - { name: status, type: enum, source: system, description: "PENDING_EXECUTION → EXECUTED → PASSED / REJECTED / CANCELLED" }

  - name: InstitutionalReviewBoard
    parent: ResearchProgram
    common_fields: true
    fields:
      - { name: research_program_id, type: string, source: system, description: "Parent program ID" }
      - { name: name, type: string, source: input, description: "IRB name" }
      - { name: description, type: string, source: input, required: false, description: "Optional description" }

  - name: IRBApproval
    parent: InstitutionalReviewBoard
    common_fields: true
    fields:
      - { name: irb_id, type: string, source: system, description: "Associated IRB ID" }
      - { name: trial_id, type: string, source: input, description: "Associated trial ID" }
      - { name: status, type: enum, source: system, description: "PENDING → APPROVED / REJECTED" }

  - name: TreatmentDependency
    parent: ClinicalTrial
    common_fields: true
    fields:
      - { name: trial_id, type: string, source: system, description: "Source trial (the dependent)" }
      - { name: dependency_trial_id, type: string, source: input, description: "Target trial (the dependency)" }
      - { name: reason, type: string, source: input, required: false, description: "Optional reason" }

  - name: IncompatibleCohortPhasePairing
    parent: ResearchProgram
    common_fields: true
    fields:
      - { name: research_program_id, type: string, source: system, description: "Parent program ID" }
      - { name: cohort_property, type: string, source: input, description: "Cohort property name (CONTAINS_PLACEBO, HIGH_RISK_PATIENTS, etc.)" }
      - { name: phase_name, type: enum, source: input, description: "PHASE_I | PHASE_II | PHASE_III | PHASE_IV" }
      - { name: reason, type: string, source: input, description: "Reason for incompatibility" }

  - name: EnrollmentBlackoutWindow
    parent: ResearchProgram
    common_fields: true
    fields:
      - { name: research_program_id, type: string, source: system, description: "Parent program ID" }
      - { name: treatment_name_pattern, type: string, source: input, description: "Wildcard pattern (* for any sequence, ? for single char), case-sensitive" }
      - { name: start_period_index, type: integer, source: input, description: "Inclusive start period" }
      - { name: end_period_index, type: integer, source: input, description: "Inclusive end period" }
      - { name: reason, type: string, source: input, description: "Reason for blackout" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ClinicalTrial
    initial_state: DRAFT
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST .../clinical-trials/{trialId}/activate
        actor: ResearchDirector
        preconditions:
          - "At least one IRB approval with APPROVED status (ERR_NO_APPROVED_IRB)"
          - "All dependencies must not be in ETHICAL_REVIEW_LOCK (ERR_DEPENDENCY_IN_ETHICAL_REVIEW_LOCK — checked first)"
          - "All dependencies must be in COMPLETED status (ERR_DEPENDENCIES_NOT_MET)"
          - "Trial must be in DRAFT state (ERR_TRIAL_NOT_IN_DRAFT)"
        side_effects: []

      - from: ACTIVE
        to: COMPLETED
        trigger: POST .../clinical-trials/{trialId}/complete
        actor: ResearchDirector
        preconditions:
          - "No executions in PENDING_EXECUTION or EXECUTED status (ERR_UNRESOLVED_EXECUTIONS_EXIST — checked first)"
          - "All phases must be COMPLETED (ERR_PHASES_NOT_COMPLETED)"
          - "All dependencies completed and not locked (ERR_DEPENDENCIES_NOT_MET / ERR_DEPENDENCY_IN_ETHICAL_REVIEW_LOCK)"
          - "No active blackout window matching treatment_name (ERR_ENROLLMENT_BLACKOUT_ACTIVE)"
          - "Trial not in ETHICAL_REVIEW_LOCK (ERR_TRIAL_IN_ETHICAL_REVIEW_LOCK)"
        side_effects:
          - "If patient_safety_risk > 75: each dependent trial's investigator gets -5 reputation"

      - from: DRAFT
        to: ABANDONED
        trigger: POST .../clinical-trials/{trialId}/abandon
        actor: ResearchDirector
        preconditions:
          - "Trial must be in DRAFT or ACTIVE (ERR_TRIAL_NOT_ABANDONABLE)"
        side_effects:
          - "Reverse provisional debits for PENDING_EXECUTION/EXECUTED deviation executions"
          - "Investigator reputation -= 10"

      - from: ACTIVE
        to: ABANDONED
        trigger: POST .../clinical-trials/{trialId}/abandon
        actor: ResearchDirector
        preconditions:
          - "Trial must be in DRAFT or ACTIVE (ERR_TRIAL_NOT_ABANDONABLE)"
        side_effects:
          - "Reverse provisional debits for PENDING_EXECUTION/EXECUTED deviation executions"
          - "Investigator reputation -= 10"

      - from: ACTIVE
        to: ETHICAL_REVIEW_LOCK
        trigger: "system (automatic when patient_safety_risk > 100)"
        actor: system
        preconditions:
          - "Trial is ACTIVE and patient_safety_risk exceeds 100"
        side_effects:
          - "Investigator reputation -= 25"
          - "All active portfolio peers get +10 patient_safety_risk (contagion)"
          - "Portfolio peers set is_under_contagion = true"
          - "Effective budgets recalculated for all investigator's trials"

      - from: ETHICAL_REVIEW_LOCK
        to: ACTIVE
        trigger: POST .../clinical-trials/{trialId}/clear-ethical-review-lock
        actor: ResearchDirector | EthicsAuditor
        preconditions:
          - "Trial must be in ETHICAL_REVIEW_LOCK (ERR_TRIAL_NOT_IN_ETHICAL_REVIEW_LOCK)"
        side_effects:
          - "If no other portfolio trials are locked, reset all is_under_contagion flags to false"

  - entity: TrialPhase
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: READY_FOR_PROCEDURES
        trigger: PUT .../trial-phases/{phaseId}
        actor: ResearchDirector
        preconditions:
          - "At least one protocol procedure defined (ERR_NO_PROCEDURES_DEFINED)"
        side_effects: []

      - from: READY_FOR_PROCEDURES
        to: COMPLETED
        trigger: PUT .../trial-phases/{phaseId}
        actor: ResearchDirector
        preconditions:
          - "All procedures in PASSED status (ERR_PROCEDURES_NOT_PASSED)"
          - "No active blackout window matching trial treatment_name (ERR_ENROLLMENT_BLACKOUT_ACTIVE)"
          - "Phase must not be in REVIEW_REQUIRED (ERR_PHASE_IN_REVIEW)"
        side_effects: []

      - from: PENDING
        to: CANCELLED
        trigger: PUT .../trial-phases/{phaseId}
        actor: ResearchDirector
        preconditions: []
        side_effects: []

      - from: READY_FOR_PROCEDURES
        to: CANCELLED
        trigger: PUT .../trial-phases/{phaseId}
        actor: ResearchDirector
        preconditions: []
        side_effects: []

      - from: READY_FOR_PROCEDURES
        to: REVIEW_REQUIRED
        trigger: "system (automatic when deviation_penalty_tier >= 3 and phase is READY_FOR_PROCEDURES)"
        actor: system
        preconditions: []
        side_effects: []

      - from: REVIEW_REQUIRED
        to: READY_FOR_PROCEDURES
        trigger: PUT .../trial-phases/{phaseId}
        actor: ResearchDirector
        preconditions: []
        side_effects: []
        note: "Explicit clearing of review status"

  - entity: ProtocolProcedure
    initial_state: PENDING
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: PENDING
        to: AWAITING_EXECUTION
        trigger: "system (automatic when execution is proposed)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AWAITING_EXECUTION
        to: PASSED
        trigger: "system (automatic when execution is marked passed)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AWAITING_EXECUTION
        to: FAILED
        trigger: "system (automatic when execution is rejected)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AWAITING_EXECUTION
        to: CANCELLED
        trigger: "system (automatic when execution is cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ProcedureExecution
    initial_state: PENDING_EXECUTION
    terminal_states: [PASSED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING_EXECUTION
        to: EXECUTED
        trigger: POST .../procedure-executions/{executionId}/execute
        actor: ResearchDirector
        preconditions:
          - "Execution must be in PENDING_EXECUTION (ERR_EXECUTION_NOT_PENDING)"
        side_effects: []

      - from: EXECUTED
        to: PASSED
        trigger: POST .../procedure-executions/{executionId}/mark-passed
        actor: ResearchDirector
        preconditions:
          - "Execution must be in EXECUTED (ERR_EXECUTION_NOT_EXECUTED)"
          - "Parent procedure must be in AWAITING_EXECUTION (ERR_PROCEDURE_NOT_AWAITING_EXECUTION)"
        side_effects:
          - "For deviations: provisional debit → finalized debit, final_risk_debit recorded"
          - "For non-deviations: patient_safety_risk -= procedure.integrity_score_value"
          - "Parent procedure → PASSED"

      - from: PENDING_EXECUTION
        to: REJECTED
        trigger: POST .../procedure-executions/{executionId}/reject
        actor: ResearchDirector
        preconditions:
          - "Execution must be in PENDING_EXECUTION or EXECUTED (ERR_EXECUTION_NOT_REJECTABLE)"
          - "Parent procedure must be in AWAITING_EXECUTION (ERR_PROCEDURE_NOT_AWAITING_EXECUTION)"
        side_effects:
          - "For deviations: reverse provisional debit"
          - "patient_safety_risk += 5"
          - "Parent procedure → FAILED"

      - from: EXECUTED
        to: REJECTED
        trigger: POST .../procedure-executions/{executionId}/reject
        actor: ResearchDirector
        preconditions:
          - "Execution must be in PENDING_EXECUTION or EXECUTED (ERR_EXECUTION_NOT_REJECTABLE)"
          - "Parent procedure must be in AWAITING_EXECUTION (ERR_PROCEDURE_NOT_AWAITING_EXECUTION)"
        side_effects:
          - "For deviations: reverse provisional debit"
          - "patient_safety_risk += 5"
          - "Parent procedure → FAILED"

      - from: PENDING_EXECUTION
        to: CANCELLED
        trigger: POST .../procedure-executions/{executionId}/cancel
        actor: ResearchDirector
        preconditions:
          - "Execution must be in PENDING_EXECUTION or EXECUTED (ERR_EXECUTION_NOT_CANCELLABLE)"
        side_effects:
          - "For deviations: reverse provisional debit"
          - "patient_safety_risk += cancellation penalty (based on deviation_penalty_tier)"
          - "deviation_penalty_tier += 1"
          - "If tier >= 3 and parent phase is READY_FOR_PROCEDURES: phase → REVIEW_REQUIRED"
          - "Parent procedure → CANCELLED"

      - from: EXECUTED
        to: CANCELLED
        trigger: POST .../procedure-executions/{executionId}/cancel
        actor: ResearchDirector
        preconditions:
          - "Execution must be in PENDING_EXECUTION or EXECUTED (ERR_EXECUTION_NOT_CANCELLABLE)"
        side_effects:
          - "For deviations: reverse provisional debit"
          - "patient_safety_risk += cancellation penalty (based on deviation_penalty_tier)"
          - "deviation_penalty_tier += 1"
          - "If tier >= 3 and parent phase is READY_FOR_PROCEDURES: phase → REVIEW_REQUIRED"
          - "Parent procedure → CANCELLED"

  - entity: IRBApproval
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: PUT .../irbs/{irbId}/approvals/{approvalId}
        actor: ResearchDirector
        preconditions: []
        side_effects: []

      - from: PENDING
        to: REJECTED
        trigger: PUT .../irbs/{irbId}/approvals/{approvalId}
        actor: ResearchDirector
        preconditions: []
        side_effects: []

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_ethical_compliance_budget
    trigger: "trial creation, reputation change"
    algorithm: multiplication
    formula: |
      effective_budget = total_ethical_compliance_budget * (reputation_score / 100)
      Recalculated immediately whenever reputation changes.
    note: "Reputation changes propagate instantly to all investigator's active trials"

  - name: ethical_compliance_balance
    trigger: "effective budget change, execution proposal, pass, reject, cancel, abandon"
    algorithm: aggregation
    formula: |
      ethical_compliance_balance = effective_budget - provisional_debits - finalized_debits

  - name: provisional_risk_debit (expedited tariff)
    trigger: "deviation execution proposal"
    algorithm: tiered_cost
    formula: |
      1. Calculate cumulative_base_risk = sum of base_risk_cost for all deviations
         in PENDING_EXECUTION, EXECUTED, or PASSED status for the same cohort+trial
      2. new_total = cumulative_base_risk + procedure.base_risk_cost
      3. Standard range: up to THRESHOLD (200 points) at 1:1 rate
      4. Expedited range: above THRESHOLD at 1.5x rate
      5. provisional_risk_debit = floor(standard_portion + expedited_portion)
      6. is_expedited_review = true if new_total > THRESHOLD
    constants:
      THRESHOLD: 200  # standard review threshold
      EXPEDITED_MULTIPLIER: 1.5
    precision: "floor (integer points)"

  - name: cancellation_penalty
    trigger: "execution cancellation"
    algorithm: tiered_penalty
    formula: |
      tier 0 (first cancellation): penalty = 10 points
      tier 1 (second cancellation): penalty = 20 points
      tier 2+ (third and subsequent): penalty = 40 points
    note: "First = abandonment-equivalent (10), second = doubled (20), third+ = quadrupled (40)"

  - name: portfolio_saturation
    trigger: "deviation proposal/pass/reject/cancel, portfolio budget change"
    algorithm: threshold
    formula: |
      aggregate_consumption = sum of (provisional_debits + finalized_debits)
                              across all member trials
      is_risk_saturated = (aggregate_consumption >= 0.9 * max_total_ethical_budget)
    constants:
      SATURATION_RATIO: 0.9  # 90%

  - name: reputation_penalty_on_lock
    trigger: "trial enters ETHICAL_REVIEW_LOCK"
    algorithm: fixed
    formula: |
      investigator.reputation_score -= 25
    constants:
      LOCK_PENALTY: 25

  - name: reputation_penalty_on_abandon
    trigger: "trial abandonment"
    algorithm: fixed
    formula: |
      investigator.reputation_score -= 10
    constants:
      ABANDON_PENALTY: 10

  - name: dependency_ripple_penalty
    trigger: "high-risk trial completion (patient_safety_risk > 75)"
    algorithm: fixed
    formula: |
      For each trial that declared dependency on the completing trial:
        dependent_trial.investigator.reputation_score -= 5
    constants:
      RIPPLE_PENALTY: 5
      HIGH_RISK_THRESHOLD: 75

  - name: contagion_risk_increment
    trigger: "trial enters ETHICAL_REVIEW_LOCK"
    algorithm: fixed
    formula: |
      For each active trial in the same portfolio (same portfolio_id and research_program_id):
        peer_trial.patient_safety_risk += 10
        peer_trial.is_under_contagion = true
      Single-hop propagation only: secondary locks do not propagate further.
    constants:
      CONTAGION_INCREMENT: 10

  - name: safety_risk_threshold
    trigger: "any patient_safety_risk change on ACTIVE trial"
    algorithm: threshold
    formula: |
      if trial.status == ACTIVE and patient_safety_risk > 100:
        trial → ETHICAL_REVIEW_LOCK
    constants:
      SAFETY_THRESHOLD: 100

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must have permission to perform this operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist"
    error_id: "ERR_NOT_FOUND / ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 3.5
    category: concurrency
    check: "Version check (when provided) must match current version"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: "All mutation endpoints when version is provided"
    note: "Version check is performed BEFORE any business logic validation"

  - priority: 4
    category: state
    check: "Trial must be in ACTIVE state for operational actions"
    error_id: ERR_TRIAL_NOT_ACTIVE
    http_status: 409
    applies_to: "Execution proposals, phase transitions on active trials"

  - priority: 5
    category: state
    check: "Trial must not be in ETHICAL_REVIEW_LOCK for proposals"
    error_id: ERR_TRIAL_IN_ETHICAL_REVIEW_LOCK
    http_status: 403
    applies_to: "Execution proposals"

  - priority: 6
    category: business_integrity
    check: "Procedure must be in PENDING state for proposals"
    error_id: ERR_PROCEDURE_NOT_PENDING
    http_status: 409
    applies_to: "POST procedure-executions"

  - priority: 7
    category: business_safety
    check: "Cohort must belong to the same trial as the procedure"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST procedure-executions"

  - priority: 8
    category: business_safety
    check: "Cohort tag must match procedure's required_cohort_tag"
    error_id: ERR_COHORT_TAG_MISMATCH
    http_status: 400
    applies_to: "POST procedure-executions"

  - priority: 9
    category: business_safety
    check: "Cohort-phase incompatibility check"
    error_id: ERR_INCOMPATIBLE_COHORT_PHASE_PAIRING
    http_status: 409
    applies_to: "POST procedure-executions"

  - priority: 10
    category: business_accountability
    check: "Investigator must not be on probation for deviation proposals"
    error_id: ERR_INVESTIGATOR_ON_PROBATION_DEVIATIONS_BLOCKED
    http_status: 403
    applies_to: "POST procedure-executions (protocol_deviation=true)"

  - priority: 11
    category: business_risk
    check: "Portfolio must not be risk-saturated for deviation proposals"
    error_id: ERR_PORTFOLIO_RISK_SATURATED
    http_status: 403
    applies_to: "POST procedure-executions (protocol_deviation=true)"

  - priority: 12
    category: business_concurrency
    check: "User must not exceed 3 active deviation proposals per program"
    error_id: ERR_MAX_ACTIVE_DEVIATIONS_PER_USER_VIOLATION
    http_status: 409
    applies_to: "POST procedure-executions (protocol_deviation=true)"

  - priority: 13
    category: business_fiscal
    check: "Ethical budget must be sufficient for deviation cost"
    error_id: ERR_INSUFFICIENT_ETHICAL_BUDGET
    http_status: 402
    applies_to: "POST procedure-executions (protocol_deviation=true)"

  - priority: 14
    category: business_probation
    check: "Probationary investigator cannot create trial with budget > 500"
    error_id: ERR_INVESTIGATOR_ON_PROBATION_BUDGET_EXCEEDED
    http_status: 403
    applies_to: "POST clinical-trials (when on probation)"

response_envelope:
  success: |
    { "meta": { "api_request_id": "<uuid>", "api_request_period_index": "<integer>" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { "api_request_id": "<uuid>", "api_request_period_index": "<integer>" },
      "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: []
  pagination_defaults: {}

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Research Programs ---
  - method: POST
    path: "/research-programs"
    description: "Create a new Research Program"
    roles: [ResearchDirector]
    code: 201
    input: [name, "description?"]
    output: ResearchProgram
    side_effects: ["current_period_index initialized to 0"]

  - method: GET
    path: "/research-programs"
    description: "List all Research Programs"
    roles: [Any]
    code: 200
    input: []
    output: "ResearchProgram[]"
    side_effects: []

  - method: GET
    path: "/research-programs/{programId}"
    description: "Get a specific Research Program"
    roles: [Any]
    code: 200
    input: []
    output: ResearchProgram
    side_effects: []

  - method: POST
    path: "/research-programs/{programId}/clock/advance"
    description: "Advance the program period"
    roles: [ResearchDirector]
    code: 200
    input: ["by_periods (1..10000)"]
    output: ResearchProgram
    side_effects: ["current_period_index += by_periods"]

  # --- Portfolios ---
  - method: POST
    path: "/research-programs/{programId}/trial-portfolios"
    description: "Create a Trial Portfolio"
    roles: [ResearchDirector]
    code: 201
    input: ["name, description?, max_total_ethical_budget"]
    output: TrialPortfolio
    side_effects: []

  - method: GET
    path: "/research-programs/{programId}/trial-portfolios"
    description: "List Trial Portfolios"
    roles: [Any]
    code: 200
    input: []
    output: "TrialPortfolio[]"
    side_effects: []

  - method: GET
    path: "/research-programs/{programId}/trial-portfolios/{portfolioId}"
    description: "Get a specific Trial Portfolio"
    roles: [Any]
    code: 200
    input: []
    output: TrialPortfolio
    side_effects: []

  - method: PUT
    path: "/research-programs/{programId}/trial-portfolios/{portfolioId}"
    description: "Update a Trial Portfolio"
    roles: [ResearchDirector]
    code: 200
    input: ["name?, description?, max_total_ethical_budget?"]
    output: TrialPortfolio
    side_effects: []

  # --- Clinical Trials ---
  - method: POST
    path: "/research-programs/{programId}/clinical-trials"
    description: "Create a new Clinical Trial"
    roles: [ResearchDirector]
    code: 201
    input: ["treatment_name, total_ethical_compliance_budget, portfolio_id?, irb_id"]
    output: ClinicalTrial
    side_effects:
      - "status = DRAFT"
      - "investigator_id set from X-User-ID"
      - "effective_budget calculated from reputation"
      - "Investigator reputation ledger initialized if first reference"

  - method: GET
    path: "/research-programs/{programId}/clinical-trials"
    description: "List Clinical Trials"
    roles: [Any]
    code: 200
    input: []
    output: "ClinicalTrial[]"
    side_effects: []

  - method: GET
    path: "/research-programs/{programId}/clinical-trials/{trialId}"
    description: "Get a specific Clinical Trial"
    roles: [Any]
    code: 200
    input: []
    output: ClinicalTrial
    side_effects: []

  - method: POST
    path: "/research-programs/{programId}/clinical-trials/{trialId}/activate"
    description: "Activate a trial"
    roles: [ResearchDirector]
    code: 200
    input: []
    output: ClinicalTrial
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/research-programs/{programId}/clinical-trials/{trialId}/complete"
    description: "Complete a trial"
    roles: [ResearchDirector]
    code: 200
    input: []
    output: ClinicalTrial
    side_effects:
      - "status → COMPLETED"
      - "If patient_safety_risk > 75: dependency ripple penalty"

  - method: POST
    path: "/research-programs/{programId}/clinical-trials/{trialId}/abandon"
    description: "Abandon a trial"
    roles: [ResearchDirector]
    code: 200
    input: []
    output: ClinicalTrial
    side_effects:
      - "status → ABANDONED"
      - "Reverse provisional debits for pending/executed deviations"
      - "Investigator reputation -= 10"

  - method: POST
    path: "/research-programs/{programId}/clinical-trials/{trialId}/clear-ethical-review-lock"
    description: "Clear ethical review lock"
    roles: [ResearchDirector, EthicsAuditor]
    code: 200
    input: []
    output: ClinicalTrial
    side_effects:
      - "status → ACTIVE"
      - "If no other portfolio trials locked: reset contagion flags"

  - method: POST
    path: "/research-programs/{programId}/clinical-trials/{trialId}/manual-risk-adjustment"
    description: "Apply manual risk adjustment"
    roles: [ResearchDirector, EthicsAuditor]
    code: 200
    input: ["adjustment (non-zero integer), justification (string, >= 10 chars)"]
    output: ClinicalTrial
    side_effects: ["patient_safety_risk += adjustment"]

  # --- Dependencies ---
  - method: POST
    path: "/research-programs/{programId}/clinical-trials/{trialId}/dependencies"
    description: "Create a treatment dependency"
    roles: [ResearchDirector]
    code: 201
    input: ["dependency_trial_id, reason?"]
    output: TreatmentDependency
    side_effects: []

  - method: GET
    path: "/research-programs/{programId}/clinical-trials/{trialId}/dependencies"
    description: "List dependencies for a trial"
    roles: [Any]
    code: 200
    input: []
    output: "TreatmentDependency[]"
    side_effects: []

  # --- IRBs ---
  - method: POST
    path: "/research-programs/{programId}/irbs"
    description: "Create an IRB"
    roles: [ResearchDirector]
    code: 201
    input: ["name, description?"]
    output: InstitutionalReviewBoard
    side_effects: []

  - method: POST
    path: "/research-programs/{programId}/irbs/{irbId}/approvals"
    description: "Create an IRB Approval"
    roles: [ResearchDirector]
    code: 201
    input: [trial_id]
    output: IRBApproval
    side_effects: ["status = PENDING"]

  - method: PUT
    path: "/research-programs/{programId}/irbs/{irbId}/approvals/{approvalId}"
    description: "Update an IRB Approval status"
    roles: [ResearchDirector]
    code: 200
    input: ["status (APPROVED | REJECTED)"]
    output: IRBApproval
    side_effects: []

  # --- Investigators ---
  - method: POST
    path: "/research-programs/{programId}/investigators/{investigatorId}/reputation/init"
    description: "Initialize investigator reputation"
    roles: [ResearchDirector, EthicsAuditor]
    code: 201
    input: []
    output: InvestigatorReputation
    side_effects: ["reputation_score initialized to 100; 200 if already initialized"]

  # --- Trial Phases ---
  - method: POST
    path: "/research-programs/{programId}/clinical-trials/{trialId}/trial-phases"
    description: "Create a Trial Phase"
    roles: [ClinicalCoordinator]
    code: 201
    input: ["name (PHASE_I | PHASE_II | PHASE_III | PHASE_IV)"]
    output: TrialPhase
    side_effects: ["status = PENDING"]

  - method: PUT
    path: "/research-programs/{programId}/clinical-trials/{trialId}/trial-phases/{phaseId}"
    description: "Update a Trial Phase status"
    roles: [ResearchDirector]
    code: 200
    input: [status]
    output: TrialPhase
    side_effects: ["State transition per phase state machine"]

  # --- Protocol Procedures ---
  - method: POST
    path: "/research-programs/{programId}/clinical-trials/{trialId}/trial-phases/{phaseId}/protocol-procedures"
    description: "Create a Protocol Procedure"
    roles: [ClinicalCoordinator]
    code: 201
    input: ["procedure_type, required_cohort_tag, base_risk_cost, integrity_score_value"]
    output: ProtocolProcedure
    side_effects: ["status = PENDING"]

  # --- Patient Cohorts ---
  - method: POST
    path: "/research-programs/{programId}/clinical-trials/{trialId}/patient-cohorts"
    description: "Create a Patient Cohort"
    roles: [ClinicalCoordinator]
    code: 201
    input: ["cohort_name, cohort_version, base_risk_points, properties"]
    output: PatientCohort
    side_effects: []

  # --- Procedure Executions ---
  - method: POST
    path: "/research-programs/{programId}/clinical-trials/{trialId}/procedure-executions"
    description: "Propose a Procedure Execution"
    roles: [ClinicalCoordinator]
    code: 201
    input: ["procedure_id, cohort_id, protocol_deviation"]
    output: ProcedureExecution
    side_effects:
      - "status = PENDING_EXECUTION"
      - "Procedure → AWAITING_EXECUTION"
      - "For deviations: calculate provisional_risk_debit, debit ethical budget"
      - "deviation_penalty_applied set accordingly"
      - "is_expedited_review set if threshold crossed"
      - "Idempotency-Key required"

  - method: POST
    path: "/research-programs/{programId}/clinical-trials/{trialId}/procedure-executions/{executionId}/execute"
    description: "Execute a procedure"
    roles: [ResearchDirector]
    code: 200
    input: []
    output: ProcedureExecution
    side_effects: ["status → EXECUTED"]

  - method: POST
    path: "/research-programs/{programId}/clinical-trials/{trialId}/procedure-executions/{executionId}/mark-passed"
    description: "Mark execution as passed"
    roles: [ResearchDirector]
    code: 200
    input: []
    output: ProcedureExecution
    side_effects:
      - "status → PASSED"
      - "For deviations: provisional → finalized"
      - "For non-deviations: patient_safety_risk -= integrity_score_value"
      - "Procedure → PASSED"

  - method: POST
    path: "/research-programs/{programId}/clinical-trials/{trialId}/procedure-executions/{executionId}/reject"
    description: "Reject an execution"
    roles: [ResearchDirector]
    code: 200
    input: []
    output: ProcedureExecution
    side_effects:
      - "status → REJECTED"
      - "For deviations: reverse provisional debit"
      - "patient_safety_risk += 5"
      - "Procedure → FAILED"

  - method: POST
    path: "/research-programs/{programId}/clinical-trials/{trialId}/procedure-executions/{executionId}/cancel"
    description: "Cancel an execution"
    roles: [ResearchDirector]
    code: 200
    input: []
    output: ProcedureExecution
    side_effects:
      - "status → CANCELLED"
      - "For deviations: reverse provisional debit"
      - "patient_safety_risk += cancellation penalty (tier-based)"
      - "deviation_penalty_tier += 1"
      - "If tier >= 3 and parent phase READY_FOR_PROCEDURES: phase → REVIEW_REQUIRED"
      - "Procedure → CANCELLED"

  # --- Incompatible Pairings ---
  - method: POST
    path: "/research-programs/{programId}/incompatible-cohort-phase-pairings"
    description: "Create an incompatible cohort-phase pairing"
    roles: [ResearchDirector]
    code: 201
    input: ["cohort_property, phase_name, reason"]
    output: IncompatibleCohortPhasePairing
    side_effects: []

  - method: GET
    path: "/research-programs/{programId}/incompatible-cohort-phase-pairings"
    description: "List incompatible pairings"
    roles: [Any]
    code: 200
    input: []
    output: "IncompatibleCohortPhasePairing[]"
    side_effects: []

  - method: DELETE
    path: "/research-programs/{programId}/incompatible-cohort-phase-pairings/{pairingId}"
    description: "Delete an incompatible pairing"
    roles: [ResearchDirector]
    code: 204
    input: []
    output: null
    side_effects: []

  # --- Enrollment Blackout Windows ---
  - method: POST
    path: "/research-programs/{programId}/enrollment-blackout-windows"
    description: "Create an enrollment blackout window"
    roles: [ResearchDirector]
    code: 201
    input: ["treatment_name_pattern, start_period_index, end_period_index, reason"]
    output: EnrollmentBlackoutWindow
    side_effects: []

  - method: GET
    path: "/research-programs/{programId}/enrollment-blackout-windows"
    description: "List enrollment blackout windows"
    roles: [Any]
    code: 200
    input: []
    output: "EnrollmentBlackoutWindow[]"
    side_effects: []

  - method: DELETE
    path: "/research-programs/{programId}/enrollment-blackout-windows/{windowId}"
    description: "Delete an enrollment blackout window"
    roles: [ResearchDirector]
    code: 204
    input: []
    output: null
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalogue
# =============================================================================
errors:
  # --- Authentication & Authorization ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or invalid"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Current role does not have permission for this operation"

  # --- Resource Not Found ---
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Generic resource not found"

  - id: ERR_TRIAL_NOT_FOUND
    http: 404
    condition: "Clinical trial not found"

  - id: ERR_PHASE_NOT_FOUND
    http: 404
    condition: "Trial phase not found"

  - id: ERR_PROCEDURE_NOT_FOUND
    http: 404
    condition: "Protocol procedure not found"

  - id: ERR_COHORT_NOT_FOUND
    http: 404
    condition: "Patient cohort not found"

  - id: ERR_DEPENDENCY_TRIAL_NOT_FOUND
    http: 404
    condition: "Dependency trial not found"

  - id: ERR_PORTFOLIO_NOT_FOUND
    http: 404
    condition: "Trial portfolio not found"

  - id: ERR_PAIRING_NOT_FOUND
    http: 404
    condition: "Incompatible cohort-phase pairing not found"

  - id: ERR_BLACKOUT_WINDOW_NOT_FOUND
    http: 404
    condition: "Enrollment blackout window not found"

  - id: ERR_IRB_NOT_FOUND
    http: 404
    condition: "IRB not found"

  - id: ERR_IRB_APPROVAL_NOT_FOUND
    http: 404
    condition: "IRB approval not found"

  - id: ERR_EXECUTION_NOT_FOUND
    http: 404
    condition: "Procedure execution not found"

  # --- Input Validation ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed request, missing required fields, type mismatch"

  - id: ERR_SELF_DEPENDENCY
    http: 400
    condition: "Trial cannot depend on itself"

  - id: ERR_CROSS_PROGRAM_DEPENDENCY
    http: 400
    condition: "Dependencies must reference trials in the same program"

  - id: ERR_COHORT_TAG_MISMATCH
    http: 400
    condition: "Cohort does not have required cohort tag property"

  - id: ERR_INVALID_PROPERTY_NAME
    http: 400
    condition: "Invalid cohort property name"

  - id: ERR_INVALID_PHASE_NAME
    http: 400
    condition: "Invalid phase name"

  - id: ERR_INVALID_IRB_STATUS
    http: 400
    condition: "Invalid IRB approval status"

  - id: ERR_INVALID_ADJUSTMENT_VALUE
    http: 400
    condition: "Manual risk adjustment value must be non-zero"

  - id: ERR_INSUFFICIENT_JUSTIFICATION
    http: 400
    condition: "Justification must be at least 10 characters"

  - id: ERR_IRB_PROGRAM_MISMATCH
    http: 400
    condition: "IRB does not belong to the same program"

  # --- Financial ---
  - id: ERR_INSUFFICIENT_ETHICAL_BUDGET
    http: 402
    condition: "Deviation cost exceeds available ethical compliance balance"

  # --- Safety & Compliance ---
  - id: ERR_TRIAL_IN_ETHICAL_REVIEW_LOCK
    http: 403
    condition: "Trial is in ETHICAL_REVIEW_LOCK and cannot accept new proposals or complete"

  - id: ERR_INVESTIGATOR_ON_PROBATION_BUDGET_EXCEEDED
    http: 403
    condition: "Probationary investigator cannot create trial with budget > 500"

  - id: ERR_INVESTIGATOR_ON_PROBATION_DEVIATIONS_BLOCKED
    http: 403
    condition: "Probationary investigator cannot propose protocol deviations"

  - id: ERR_PORTFOLIO_RISK_SATURATED
    http: 403
    condition: "Portfolio aggregate consumption >= 90% of max cap"

  - id: ERR_ENROLLMENT_BLACKOUT_ACTIVE
    http: 403
    condition: "Active blackout window matches trial treatment name"

  # --- State Constraints ---
  - id: ERR_VERSION_MISMATCH
    http: 409
    condition: "Provided version does not match current version"

  - id: ERR_TRIAL_NOT_ACTIVE
    http: 409
    condition: "Trial must be in ACTIVE state"

  - id: ERR_TRIAL_NOT_IN_ETHICAL_REVIEW_LOCK
    http: 409
    condition: "Trial must be in ETHICAL_REVIEW_LOCK to clear lock"

  - id: ERR_TRIAL_NOT_IN_DRAFT
    http: 409
    condition: "Trial must be in DRAFT to activate"

  - id: ERR_TRIAL_NOT_ABANDONABLE
    http: 409
    condition: "Trial must be in DRAFT or ACTIVE to abandon"

  - id: ERR_PROCEDURE_NOT_PENDING
    http: 409
    condition: "Procedure must be in PENDING state"

  - id: ERR_PROCEDURE_NOT_AWAITING_EXECUTION
    http: 409
    condition: "Procedure must be in AWAITING_EXECUTION for mark-passed or reject"

  - id: ERR_EXECUTION_NOT_PENDING
    http: 409
    condition: "Execution must be in PENDING_EXECUTION"

  - id: ERR_EXECUTION_NOT_EXECUTED
    http: 409
    condition: "Execution must be in EXECUTED for mark-passed"

  - id: ERR_EXECUTION_NOT_REJECTABLE
    http: 409
    condition: "Execution must be in PENDING_EXECUTION or EXECUTED to reject"

  - id: ERR_EXECUTION_NOT_CANCELLABLE
    http: 409
    condition: "Execution must be in PENDING_EXECUTION or EXECUTED to cancel"

  - id: ERR_ILLEGAL_PHASE_STATE_TRANSITION
    http: 409
    condition: "Invalid phase state transition"

  - id: ERR_NO_PROCEDURES_DEFINED
    http: 409
    condition: "Phase has no procedures defined when transitioning to READY_FOR_PROCEDURES"

  - id: ERR_PROCEDURES_NOT_PASSED
    http: 409
    condition: "Not all procedures are in PASSED status when completing phase"

  - id: ERR_UNRESOLVED_EXECUTIONS_EXIST
    http: 409
    condition: "Executions in PENDING_EXECUTION or EXECUTED exist when completing trial"

  - id: ERR_PHASES_NOT_COMPLETED
    http: 409
    condition: "Not all phases are COMPLETED when completing trial"

  - id: ERR_DEPENDENCIES_NOT_MET
    http: 409
    condition: "Not all dependencies are COMPLETED when activating trial"

  - id: ERR_DEPENDENCY_IN_ETHICAL_REVIEW_LOCK
    http: 409
    condition: "A dependency trial is in ETHICAL_REVIEW_LOCK"

  - id: ERR_INCOMPATIBLE_COHORT_PHASE_PAIRING
    http: 409
    condition: "Cohort property is incompatible with the procedure's phase"

  - id: ERR_MAX_ACTIVE_DEVIATIONS_PER_USER_VIOLATION
    http: 409
    condition: "User has reached 3 active deviation proposals in the program"

  - id: ERR_PHASE_IN_REVIEW
    http: 409
    condition: "Phase is in REVIEW_REQUIRED and cannot be completed"

  - id: ERR_PHASE_NOT_IN_REVIEW
    http: 409
    condition: "Phase is not in REVIEW_REQUIRED"

  - id: ERR_NO_APPROVED_IRB
    http: 409
    condition: "No IRB approval with APPROVED status exists for the trial"

  - id: ERR_STALE_PERIOD_INDEX
    http: 409
    condition: "Period index changed during operation"

  - id: ERR_IDEMPOTENCY_CONFLICT
    http: 409
    condition: "Idempotency key reused with different request body"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: ResearchDirector
    description: "Research director, responsible for program management, trial lifecycle, phase transitions, execution settlements, risk adjustments"
    exclusive_operations:
      - "POST /research-programs — Create program"
      - "POST .../clock/advance — Advance period"
      - "POST .../trial-portfolios — Create portfolio"
      - "PUT .../trial-portfolios/{id} — Update portfolio"
      - "POST .../clinical-trials — Create trial"
      - "POST .../clinical-trials/{id}/activate — Activate trial"
      - "POST .../clinical-trials/{id}/complete — Complete trial"
      - "POST .../clinical-trials/{id}/abandon — Abandon trial"
      - "POST .../clinical-trials/{id}/manual-risk-adjustment — Adjust risk"
      - "POST .../dependencies — Create dependency"
      - "POST .../irbs — Create IRB"
      - "POST .../irbs/{id}/approvals — Create IRB approval"
      - "PUT .../irbs/{id}/approvals/{id} — Update IRB approval"
      - "PUT .../trial-phases/{id} — Update phase status"
      - "POST .../procedure-executions/{id}/execute — Execute"
      - "POST .../procedure-executions/{id}/mark-passed — Mark passed"
      - "POST .../procedure-executions/{id}/reject — Reject"
      - "POST .../procedure-executions/{id}/cancel — Cancel execution"
      - "POST .../incompatible-cohort-phase-pairings — Create pairing"
      - "DELETE .../incompatible-cohort-phase-pairings/{id} — Delete pairing"
      - "POST .../enrollment-blackout-windows — Create blackout"
      - "DELETE .../enrollment-blackout-windows/{id} — Delete blackout"

  - name: ClinicalCoordinator
    description: "Clinical coordinator, responsible for trial phases, procedures, cohorts, and execution proposals"
    exclusive_operations:
      - "POST .../trial-phases — Create phase"
      - "POST .../protocol-procedures — Create procedure"
      - "POST .../patient-cohorts — Create cohort"
      - "POST .../procedure-executions — Propose execution"

  - name: EthicsAuditor
    description: "Ethics auditor, responsible for ethical oversight and risk monitoring"
    exclusive_operations: []
    shared_with_ResearchDirector:
      - "POST .../clinical-trials/{id}/clear-ethical-review-lock — Clear lock"
      - "POST .../clinical-trials/{id}/manual-risk-adjustment — Adjust risk"
      - "POST .../investigators/{id}/reputation/init — Init reputation"

  - name: Any
    description: "Shared across all roles"
    shared_operations:
      - "GET /research-programs — List programs"
      - "GET /research-programs/{id} — Get program"
      - "GET .../trial-portfolios — List portfolios"
      - "GET .../trial-portfolios/{id} — Get portfolio"
      - "GET .../clinical-trials — List trials"
      - "GET .../clinical-trials/{id} — Get trial"
      - "GET .../dependencies — List dependencies"
      - "GET .../incompatible-cohort-phase-pairings — List pairings"
      - "GET .../enrollment-blackout-windows — List blackouts"
