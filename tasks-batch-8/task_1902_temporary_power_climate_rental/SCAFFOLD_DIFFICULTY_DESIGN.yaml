              as: DepotManager
              captures: { u2: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${u1}", expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
            - call: "GET /power-rental/equipment-units"
              payload: { status: "AVAILABLE" }
              as: DepotManager
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_id}/cancel"
              payload: {}
              as: SalesEngineer
              captures: { k_status: $.data.status }
            - call: "GET /power-rental/equipment-units"
              payload: { status: "AVAILABLE" }
              as: DepotManager
            - call: "GET /power-rental/equipment-units/${u1}"
              payload: {}
              as: DepotManager
              captures: { u1_status: $.data.status }
          assert:
            - "after reserve: GET /power-rental/equipment-units?status=AVAILABLE total_count == 1 (only U2)"
            - "after cancel: total_count == 2 — invariant count(AVAILABLE) restored exactly"
            - "EquipmentUnit.${u1}.status == AVAILABLE"
            - "RentalContract.${con_id}.status == CANCELLED and its line is RELEASED"

      - name: fuel_delivery_then_pumpout_restores_tank_level
        grounds:
          - entities.Site.fields.tank_level_liters
          - entities.TelemetryEvent.fields.event_type
          - calculations.invoice_total
        distinguishing_aspect: |
          Conserved quantity = Site.tank_level_liters (a volume, not a count):
          a FUEL_DELIVERY of 2000 L followed by a FUEL_PUMP_OUT of 2000 L at
          demob returns the tank to exactly its pre-pair level (0).
        test_recipe:
          setup:
            - "Customer C1, Site S1 (TX-TCEQ, capacity 5000), Unit U1 on contract K1 ON_RENT (window 2026-09-01..2026-09-08); clock 2026-09-03; tank level 0"
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 200, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 3.0, day_rate_cents: 12000, week_rate_cents: 60000, month_rate_cents: 200000, demob_fee_cents: 35000, home_depot_code: "DAL-01" }
              as: DepotManager
              captures: { unit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_id}/quote"
              payload: {}
              as: SalesEngineer
              captures: { con_v4: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/confirm"
              payload: { expected_rental_contract_version: "${con_v4}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_id}/mobilize"
              payload: {}
              as: DepotManager
            - call: "POST /power-rental/rental-contracts/${con_id}/start-rental"
              payload: {}
              as: DepotManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /power-rental/telemetry-events"
              payload: { contract_id: "${con_id}", event_type: "FUEL_DELIVERY", value: 2000 }
              as: FieldTechnician
            - call: "GET /power-rental/sites/${site_id}"
              payload: {}
              as: DepotManager
              captures: { level_mid: $.data.tank_level_liters }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /power-rental/rental-contracts/${con_id}/off-hire"
              payload: {}
              as: SalesEngineer
            - call: "POST /power-rental/telemetry-events"
              payload: { contract_id: "${con_id}", event_type: "FUEL_PUMP_OUT", value: 2000 }
              as: FieldTechnician
            - call: "GET /power-rental/sites/${site_id}"
              payload: {}
              as: DepotManager
              captures: { level_end: $.data.tank_level_liters }
          assert:
            - "after FUEL_DELIVERY: Site.tank_level_liters == 2000"
            - "after equal FUEL_PUMP_OUT: Site.tank_level_liters == 0 — invariant restored exactly"
            - "off-hire succeeds between the pair (contract OFF_HIRE permits FUEL_PUMP_OUT)"
