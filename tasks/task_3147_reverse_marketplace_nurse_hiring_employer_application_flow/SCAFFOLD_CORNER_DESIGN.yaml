              payload: { current_utc: "2026-09-02T10:59:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/interviews/${iv_id}/complete"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err_early: $.data.error_id }
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/interviews/${iv_id}/complete"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          assert:
