            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { loop_u_v2: $.data.version }
          trigger:
            - call: "POST /clinical-image-reviews/${loop_sub_id}/resubmit"
              payload: { exam_ids: ["${loop_e1_id}", "${loop_e2_id}"], expected_unit_version: "${loop_u_v2}", reviewer_note: "Attempt 2 packet, positioning corrected" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "ClinicalImageReviewSubmission.${loop_sub_id}.status == SUBMITTED (the same state the row already occupied before the REVISION_REQUIRED detour)"
            - "ClinicalImageReviewSubmission.${loop_sub_id}.attempt_number == 2"
            - "ClinicalImageReviewSubmission.${loop_sub_id}.fee_held_cents == 250000"
            - "ClinicalImageReviewSubmission.${loop_sub_id}.submitted_at == \"2026-08-01T00:00:00Z\""
            - "MammographyUnit.${unit_id}.reaccreditation_attempts_remaining == 1"
            - "MammographyUnit.${unit_id}.accreditation_status == PROVISIONAL (a REVISION_REQUIRED decision only demotes ACCREDITED or REACCREDITATION_DUE units)"
            - "Facility.${fac_id}.prepaid_credit_cents == 500000"
            - "Facility.${fac_id}.fee_held_cents == 250000"
            - "Facility.${fac_id}.fee_consumed_cents == 250000"

      - name: personnel_ce_dimension_drops_to_grace_while_qualification_holds
        grounds:
