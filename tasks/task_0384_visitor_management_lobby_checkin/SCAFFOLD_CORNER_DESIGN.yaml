  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_floor_version_on_signin
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[signin-stale-floor]", "errors[ERR_STALE_FLOOR_VERSION]"]
        distinguishing_aspect: "Sign-in carrying a floor version one behind current (after another sign-in advanced it) → ERR_STALE_FLOOR_VERSION (412)."
        test_recipe:
          setup:
            - "A Site (badge_total 5), Floor (capacity 5), Host; two CLEARED visits A and B; clock set."
            - "A is signed in (advancing Floor.version); B is then signed in with the pre-advance floor version."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id, floor_v0: $.data.version }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-16T09:00:00Z" }
              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Visitor A", visitor_company: "ACo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { v_a_id: $.data.id }
            - call: "POST /visits/${v_a_id}/screen"
              payload: {}
              as: LobbyAttendant
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Visitor B", visitor_company: "BCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { v_b_id: $.data.id }
            - call: "POST /visits/${v_b_id}/screen"
              payload: {}
              as: LobbyAttendant
            - call: "POST /visits/${v_a_id}/sign-in"
              payload: { expected_floor_version: "${floor_v0}" }
              as: LobbyAttendant
