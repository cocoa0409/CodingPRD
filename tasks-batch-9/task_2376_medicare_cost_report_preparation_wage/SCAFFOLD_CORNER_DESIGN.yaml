          - entities.CostCenter.fields.stepdown_order
        distinguishing_aspect: "A ROUTINE cost center that supplies stepdown_order 2 returns ERR_STEPDOWN_ORDER_CONFLICT (422): the order/basis pair is required for GENERAL_SERVICE centers and forbidden for every other center_type."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with a DRAFT CostReport FY 2025-07-01..2026-06-30 and no cost centers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", stepdown_order: 2, statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${err_id} == \"ERR_STEPDOWN_ORDER_CONFLICT\""
            - "GET /cost-reports/${report_id}/cost-centers returns total_count == 0"

      - name: rotation_entirely_outside_the_fiscal_year_is_rejected
        claim_type: Triggerable
        grounds:
          - errors[ERR_ROTATION_OUTSIDE_FISCAL_YEAR]
          - validations[priority=12]
          - calculations.gme_fte_rolling_average
        distinguishing_aspect: "A rotation [2027-01-01, 2027-02-01) against a FY 2025-07-01..2026-06-30 report has overlap_days 0 and returns ERR_ROTATION_OUTSIDE_FISCAL_YEAR (409), leaving unweighted_fte_days_total at 0.0000."
