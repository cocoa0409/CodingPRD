# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Newsroom Assignment & Editorial Workflow
# (sections and claim_type values follow references/claim-extraction-guide.md)
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: staff_create_defaults_and_system_fields
        claim_type: defaults
        grounds: [entities.StaffMember.fields.max_concurrent_assignments, entities.StaffMember.fields.employment_status]
        distinguishing_aspect: "Omitting max_concurrent_assignments applies default 3; system fields id/created_at/version are server-minted (version starts at 1, active_assignment_count 0, employment_status ACTIVE)."
        test_recipe:
          setup: ["NewsDirector operator only (opaque role; no staff rows needed)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /newsroom/staff", payload: { full_name: "Base Staff", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { s_id: "$.data.id", s_ver: "$.data.version", s_cap: "$.data.max_concurrent_assignments", s_emp: "$.data.employment_status", s_cnt: "$.data.active_assignment_count" } }
          assert:
            - "s_cap == 3 (default applied)"
            - "s_emp == ACTIVE"
            - "s_cnt == 0 and s_ver == 1"
            - "s_id is a server-minted UUID and created_at is set"

      - name: staff_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.StaffMember.fields.hourly_rate_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "hourly_rate_cents has no default and is required; omitting it yields ERR_VALIDATION (400) before any business rule runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /newsroom/staff", payload: { full_name: "No Rate", role_capability: REPORTER, home_desk: METRO }, as: NewsDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_VALIDATION"

      - name: story_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_STORY_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "A well-formed but unknown storyId yields ERR_STORY_NOT_FOUND (404); other entities' NOT_FOUND ids are exercised by not_found_variants in the errors section."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /newsroom/stories/00000000-0000-0000-0000-000000000000", payload: {}, as: NewsDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_STORY_NOT_FOUND"

      - name: pitch_create_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.Pitch.fields.urgency, "errors[ERR_VALIDATION]", "validations[priority=3]"]
        distinguishing_aspect: "urgency outside {STANDARD, URGENT, BREAKING} is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["one reporter exists"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Enum", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
          trigger:
            - { call: "POST /newsroom/pitches", payload: { title: "Bad enum", summary: "x", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: MEGA }, as: Reporter, as_user_id: "${rep_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_VALIDATION"

      - name: pitch_greenlight_fk_reverse
        claim_type: parent_relationships
        grounds: [entities.Pitch.fields.greenlit_story_id, entities.Story.fields.pitch_id]
        distinguishing_aspect: "Greenlight wires both FK directions: pitch.greenlit_story_id resolves and both reverse-reachability GETs return the linked pair."
        test_recipe:
          setup: ["desk editor + reporter; pitch greenlit into a PRINT story"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk FR", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep FR", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "FK story", summary: "x", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { story_id: "$.data.greenlit_story_id" } }
          trigger:
            - { call: "GET /newsroom/pitches?greenlit_story_id=${story_id}", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { back_pitch: "$.data[0].id" } }
            - { call: "GET /newsroom/pitches/${p_id}/stories", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { back_story: "$.data[0].id", back_story_pitch: "$.data[0].pitch_id" } }
          assert:
            - "back_pitch == ${p_id} (filtered list reverse-reaches the pitch from the story id)"
            - "back_story == ${story_id} and back_story_pitch == ${p_id}"

      - name: review_record_immutable_no_version
        claim_type: immutability
        grounds: [entities.ReviewRecord]
        distinguishing_aspect: "ReviewRecord declares common_fields: false — records expose id and created_at but no version/updated_at, and are reachable via both story and staff reverse GETs."
        test_recipe:
          setup: ["story driven to FACT_CHECK (desk, reporter, copy editor, fact checker)"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk IM", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep IM", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Copy IM", role_capability: COPY_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { copy_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Fact IM", role_capability: FACT_CHECKER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { fact_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "Immutable reviews", summary: "x", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { story_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${story_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T09:00:00Z", planned_effort_minutes: 60 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { asg_id: "$.data.id" } }
            - { call: "POST /newsroom/assignments/${asg_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "POST /newsroom/stories/${story_id}/submit-edit", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "POST /newsroom/stories/${story_id}/complete-edit", payload: {}, as: CopyEditor, as_user_id: "${copy_id}", captures: { v4: "$.data.version" } }
            - { call: "POST /newsroom/stories/${story_id}/reviews", payload: { review_type: FACT_CHECK, verdict: FAIL, expected_story_version: "${v4}" }, as: FactChecker, as_user_id: "${fact_id}", captures: { rr_id: "$.data.id" } }
          trigger:
            - { call: "GET /newsroom/stories/${story_id}/reviews", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { first_id: "$.data[0].id" } }
            - { call: "GET /newsroom/staff/${fact_id}/reviews", payload: {}, as: NewsDirector, captures: { staff_first_id: "$.data[0].id" } }
          assert:
            - "first_id == ${rr_id} and staff_first_id == ${rr_id} (both FK reverse paths resolve the same record)"
            - "the review object has no version and no updated_at key (common_fields: false)"

      - name: stories_list_filter_by_author
        claim_type: listing
        grounds: [endpoints.GET_/newsroom/stories]
        distinguishing_aspect: "author_staff_id filter returns exactly the stories authored by that staff member."
        test_recipe:
          setup: ["two reporters each author one greenlit story"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk LF", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep One LF", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { r1_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Two LF", role_capability: REPORTER, home_desk: SPORTS, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { r2_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "S1", summary: "x", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${r1_id}", captures: { p1_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p1_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p1_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { s1_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "S2", summary: "y", desk: SPORTS, deadline_at: "2026-08-03T00:00:00Z", urgency: URGENT }, as: Reporter, as_user_id: "${r2_id}", captures: { p2_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p2_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p2_id}/greenlight", payload: { story_type: DIGITAL }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { s2_id: "$.data.greenlit_story_id" } }
          trigger:
            - { call: "GET /newsroom/stories?author_staff_id=${r2_id}", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { only_id: "$.data[0].id" } }
          assert:
            - "only_id == ${s2_id}"
            - "response total_count == 1 (the other author's story is excluded)"

      - name: pitches_list_pagination
        claim_type: listing
        grounds: [endpoints.GET_/newsroom/pitches, response_envelope.pagination_defaults]
        distinguishing_aspect: "limit/offset paginate deterministically by created_at ASC with total_count and has_more from the fixed envelope."
        test_recipe:
          setup: ["reporter with two pitches"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk PG", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep PG", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "Page one", summary: "x", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p1_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "Page two", summary: "y", desk: BUSINESS, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p2_id: "$.data.id" } }
          trigger:
            - { call: "GET /newsroom/pitches?limit=1&offset=0", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { page1: "$.data[0].id" } }
            - { call: "GET /newsroom/pitches?limit=1&offset=1", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { page2: "$.data[0].id" } }
          assert:
            - "page1 == ${p1_id} and page2 == ${p2_id} (created_at ASC order)"
            - "page 1 reports total_count == 2 and has_more == true; page 2 reports has_more == false"

  - section: state_machines
    instances:
      - name: pitch_withdraw_from_greenlit_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Pitch, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "GREENLIT is terminal for a pitch; even the owner cannot withdraw it afterward."
        test_recipe:
          setup: ["pitch greenlit (owner is the reporter)"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk WG", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep WG", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "WG", summary: "x", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}" }
          trigger:
            - { call: "POST /newsroom/pitches/${p_id}/withdraw", payload: {}, as: Reporter, as_user_id: "${rep_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE (GREENLIT is terminal; ownership is satisfied but the transition does not exist)"

      - name: pitch_start_review_from_rejected_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Pitch.DESK_REVIEW_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REJECTED pitch is terminally locked: start-review from REJECTED fails."
        test_recipe:
          setup: ["pitch moved SUBMITTED -> DESK_REVIEW -> REJECTED"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk TL", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep TL", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "TL", summary: "x", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/reject", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
          trigger:
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /newsroom/pitches/${p_id}", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { st: "$.data.status" } }
          assert:
            - "err == ERR_INVALID_STATE"
            - "st == REJECTED (no drift)"

      - name: story_complete_edit_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Story.IN_EDIT_to_FACT_CHECK, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete-edit requires IN_EDIT; invoking it on a DRAFT story fails even for a valid copy editor."
        test_recipe:
          setup: ["DRAFT story exists"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk CE", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep CE", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Copy CE", role_capability: COPY_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { copy_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "CE", summary: "x", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { story_id: "$.data.greenlit_story_id" } }
          trigger:
            - { call: "POST /newsroom/stories/${story_id}/complete-edit", payload: {}, as: CopyEditor, as_user_id: "${copy_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE (DRAFT is not a from-state of complete-edit)"

      - name: story_unschedule_from_cleared_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Story.SCHEDULED_to_CLEARED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "unschedule requires SCHEDULED; a CLEARED story cannot be unscheduled (no reservation exists to release)."
        test_recipe:
          setup: ["story driven to CLEARED (full pipeline, no slot)" ]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk US", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep US", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Copy US", role_capability: COPY_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { copy_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Fact US", role_capability: FACT_CHECKER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { fact_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Legal US", role_capability: LEGAL_REVIEWER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { legal_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "US", summary: "x", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { story_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${story_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T09:00:00Z", planned_effort_minutes: 60 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { asg_id: "$.data.id" } }
            - { call: "POST /newsroom/assignments/${asg_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "POST /newsroom/stories/${story_id}/submit-edit", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "POST /newsroom/stories/${story_id}/complete-edit", payload: {}, as: CopyEditor, as_user_id: "${copy_id}", captures: { v4: "$.data.version" } }
            - { call: "POST /newsroom/stories/${story_id}/reviews", payload: { review_type: FACT_CHECK, verdict: PASS, expected_story_version: "${v4}" }, as: FactChecker, as_user_id: "${fact_id}" }
            - { call: "GET /newsroom/stories/${story_id}", payload: {}, as: NewsDirector, captures: { v5: "$.data.version" } }
            - { call: "POST /newsroom/stories/${story_id}/reviews", payload: { review_type: LEGAL, verdict: PASS, expected_story_version: "${v5}" }, as: LegalReviewer, as_user_id: "${legal_id}" }
          trigger:
            - { call: "POST /newsroom/stories/${story_id}/unschedule", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE (CLEARED has no unschedule transition)"

      - name: story_kill_published_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Story.KILLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PUBLISHED stories cannot be killed — retraction is the only path; kill from PUBLISHED fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["story fully published via scheduler"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk KP", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep KP", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Copy KP", role_capability: COPY_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { copy_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Fact KP", role_capability: FACT_CHECKER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { fact_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Legal KP", role_capability: LEGAL_REVIEWER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { legal_id: "$.data.id" } }
