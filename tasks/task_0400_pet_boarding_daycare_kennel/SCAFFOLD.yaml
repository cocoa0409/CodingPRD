# =============================================================================
# Scaffold: pet-boarding-daycare-kennel (Expert tier)
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in their own sibling files.
# =============================================================================

scenario: |
  Pet Boarding & Daycare Facility (Kennel): reservation & run/suite assignment,
  vaccination requirement, daycare vs overnight & feeding/meds, capacity &
  temperament grouping, add-on (bath/playtime), belongings & incident log,
  deposit/cancellation, recurring package

domain_name: pet-boarding-daycare-kennel
api_prefix: ""

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation        # finite run/suite pool reserved (HELD), committed (OCCUPIED), released
  secondary_archetype: temporal_windowing    # overnight stays & daycare sessions are date intervals on shared runs
  complexity_layers:
    - optimistic_concurrency                 # OCC on Reservation.version for the true CREATE-with-supersede race on assignments
    - cascading_side_effects                 # confirm/cancel/no_show chains span Reservation -> RunAssignment -> Run, and Reservation -> PackageRedemption -> Package
    - dual_variant_calculation               # deposit estimate-vs-final, refund provisional-vs-final, grouping strict-vs-lenient
    - rate_threshold_triggers                # cancellation-refund tiers keyed on lead-time breakpoints; daycare capacity overload boundaries

  entity_topology: flat                      # peer top-level collections (/owners, /pets, /runs, /reservations, /packages) joined by FK references; no deep URL nesting
  state_machine_shape: branching             # Reservation forks CANCELLED/NO_SHOW; Package cycles EXPIRED->ACTIVE; Pet carries parallel dimensions
  relationship_patterns:
    - one_to_many                            # Owner->Pet, Pet->VaccinationRecord, Reservation->RunAssignment/AddOn
    - many_to_many                           # Reservation<->Run via RunAssignment (a daycare pen hosts many pets per date)
    - cross_aggregate                        # Reservation references Pet (Owner aggregate) and Run (facility pool); PackageRedemption ties Reservation to Package
  role_model: peer_roles                     # Owner owns own pets/reservations/packages; FacilityStaff & FacilityManager operate the kennel
  consistency_model: immediate               # all balance/capacity/derived-field changes are atomic within the triggering request

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Kennel facility name" }
      - { name: daycare_cutoff_time, type: string, source: input, default: "19:00", description: "HH:MM local close time; advisory cap for daycare check-outs" }
      - { name: deposit_policy, type: enum, source: input, default: "STANDARD", description: "STANDARD | STRICT | NONE — selects the policy_factor in deposit_amount", constraints: "one of STANDARD, STRICT, NONE" }
      - { name: overbook_grace, type: integer, source: input, default: 0, description: "Extra daycare slots allowed above a Run.daycare_capacity on a date; 0 disables overbooking" }
      - { name: current_date, type: string, source: system, default: "2026-01-01", description: "Facility business date (YYYY-MM-DD), advanced only via the clock endpoint; all lead-time and expiry math reads this, never wall-clock" }

  - name: Owner
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: full_name, type: string, source: input, description: "Pet parent full name" }
      - { name: email, type: string, source: input, description: "Contact email; unique per facility among Owners with status == ACTIVE" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | ARCHIVED", constraints: "one of ACTIVE, ARCHIVED" }
      - { name: wallet_credit_cents, type: integer, source: computed, default: 0, description: "Refund credits held on account; debited first when paying a deposit" }

  - name: Pet
    parent: Owner
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id" }
      - { name: facility_id, type: string, source: system, description: "Denormalized facility scope copied from the owner (not a checked FK; the defining parent is owner_id)" }
      - { name: name, type: string, source: input, description: "Pet name" }
      - { name: species, type: enum, source: input, description: "DOG | CAT", constraints: "one of DOG, CAT" }
      - { name: weight_kg, type: number, source: input, description: "Body weight in kg; must be > 0; drives size_class" }
      - { name: temperament, type: enum, source: input, default: "CALM", description: "CALM | PLAYFUL | REACTIVE — used by group compatibility scoring", constraints: "one of CALM, PLAYFUL, REACTIVE" }
      - { name: size_class, type: enum, source: computed, description: "TOY (<5kg) | SMALL (5–14.999kg) | MEDIUM (15–29.999kg) | LARGE (>=30kg)", constraints: "one of TOY, SMALL, MEDIUM, LARGE" }
      - { name: vaccination_status, type: enum, source: computed, default: "MISSING", description: "VALID | EXPIRED | MISSING — PARALLEL dimension, derived from the VaccinationRecord set vs Facility.current_date", constraints: "one of VALID, EXPIRED, MISSING" }
      - { name: temperament_clearance, type: enum, source: system, default: "UNREVIEWED", description: "UNREVIEWED | CLEARED | FLAGGED — PARALLEL dimension set by staff review, independent of vaccination_status", constraints: "one of UNREVIEWED, CLEARED, FLAGGED" }

  - name: VaccinationRecord
    parent: Pet
    common_fields: false
    fields:
      - { name: pet_id, type: string, source: system, description: "FK -> Pet.id" }
      - { name: vaccine, type: enum, source: input, description: "RABIES | DHPP | BORDETELLA | FVRCP", constraints: "one of RABIES, DHPP, BORDETELLA, FVRCP" }
      - { name: administered_on, type: string, source: input, description: "YYYY-MM-DD date administered" }
      - { name: expires_on, type: string, source: input, description: "YYYY-MM-DD expiry; record is current when Facility.current_date <= expires_on" }
      - { name: superseded, type: boolean, source: system, default: false, description: "true when a newer record for the same vaccine supersedes this one" }

  - name: Run
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: label, type: string, source: input, description: "Human run/suite label, e.g. 'Suite A1'; unique per facility among Runs" }
      - { name: kind, type: enum, source: input, description: "OVERNIGHT_SUITE | DAYCARE_PEN", constraints: "one of OVERNIGHT_SUITE, DAYCARE_PEN" }
      - { name: size_class, type: enum, source: input, description: "TOY | SMALL | MEDIUM | LARGE — max pet size the run accepts", constraints: "one of TOY, SMALL, MEDIUM, LARGE" }
      - { name: daycare_capacity, type: integer, source: input, default: 1, description: "Max simultaneous daycare pets for a DAYCARE_PEN on a given date; OVERNIGHT_SUITE is always single-occupancy (forced to 1)" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | RETIRED — set AVAILABLE at create; RETIRED at create marks it out of pool", constraints: "one of AVAILABLE, RETIRED" }

  - name: Reservation
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "Denormalized facility scope (not a checked FK; reservations are listed by pet_id/owner_id/package_id)" }
      - { name: pet_id, type: string, source: input, description: "FK -> Pet.id" }
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; copied from the pet at creation" }
      - { name: package_id, type: string, source: input, description: "FK -> Package.id; optional prepaid package to draw a daycare credit from at confirmation" }
      - { name: service_type, type: enum, source: input, description: "DAYCARE | OVERNIGHT", constraints: "one of DAYCARE, OVERNIGHT" }
      - { name: start_date, type: string, source: input, description: "YYYY-MM-DD first service date (inclusive)" }
      - { name: end_date, type: string, source: input, description: "OVERNIGHT: YYYY-MM-DD checkout date (exclusive of last night). DAYCARE: equals start_date" }
      - { name: nights, type: integer, source: computed, default: 0, description: "OVERNIGHT: end_date minus start_date in days; DAYCARE: 0" }
      - { name: care_plan, type: array, source: input, description: "Feeding/meds instructions: list of { kind: FEEDING|MEDICATION, schedule_time: HH:MM, detail, requires_signoff }; MEDICATION forces requires_signoff=true" }
      - { name: belongings, type: array, source: system, description: "Belonging log: list of { description, quantity, returned }; appended at creation and edited by belonging actions; all must be returned to close" }
      - { name: deposit_cents, type: integer, source: computed, default: 0, description: "Deposit owed; deposit_amount estimate at creation, latched to the final variant at confirmation" }
      - { name: deposit_paid_cents, type: integer, source: computed, default: 0, description: "Amount collected toward the deposit (wallet credit + cash)" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "Final billed total latched at check-out per reservation_total" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "Refund credited to the owner wallet on cancellation/no-show per cancellation_refund" }
      - { name: redeemed_credit, type: boolean, source: system, default: false, description: "true when a Package credit was consumed by this reservation at confirmation" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | CONFIRMED | CHECKED_IN | CHECKED_OUT | CLOSED | CANCELLED | NO_SHOW", constraints: "one of REQUESTED, CONFIRMED, CHECKED_IN, CHECKED_OUT, CLOSED, CANCELLED, NO_SHOW" }

  - name: RunAssignment
    parent: Reservation
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id" }
      - { name: run_id, type: string, source: input, description: "Target run reference (not a checked FK; assignments are discovered through their reservation)" }
      - { name: window_start_date, type: string, source: system, description: "YYYY-MM-DD inclusive start of the occupied interval, copied from reservation.start_date" }
      - { name: window_end_date, type: string, source: system, description: "YYYY-MM-DD exclusive end. OVERNIGHT: reservation.end_date. DAYCARE: start_date + 1 day" }
      - { name: status, type: enum, source: system, default: "HELD", description: "HELD | OCCUPIED | RELEASED", constraints: "one of HELD, OCCUPIED, RELEASED" }

  - name: AddOn
    parent: Reservation
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: system, description: "Owning reservation reference (not a checked FK; add-ons are embedded in the reservation and created under it)" }
      - { name: kind, type: enum, source: input, description: "BATH | PLAYTIME", constraints: "one of BATH, PLAYTIME" }
      - { name: scheduled_date, type: string, source: input, description: "YYYY-MM-DD the add-on is to be delivered; must lie within the reservation window" }
      - { name: price_cents, type: integer, source: computed, description: "Latched at creation from ADDON_PRICE by kind & pet size_class" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "BOOKED | DELIVERED | CANCELLED; BOOKED add-ons in-window are auto-DELIVERED at check-out and counted into reservation_total", constraints: "one of BOOKED, DELIVERED, CANCELLED" }

  - name: Package
    parent: Owner
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id" }
      - { name: facility_id, type: string, source: system, description: "Denormalized facility scope copied from the owner" }
      - { name: tier, type: enum, source: input, description: "DAYCARE_10 | DAYCARE_20 — number of daycare credits purchased", constraints: "one of DAYCARE_10, DAYCARE_20" }
      - { name: credits_total, type: integer, source: computed, description: "10 for DAYCARE_10, 20 for DAYCARE_20" }
      - { name: credits_remaining, type: integer, source: computed, description: "credits_total minus active (non-reversed) redemptions; floored at 0" }
      - { name: cycle_start_date, type: string, source: input, description: "YYYY-MM-DD start of the current 30-day validity cycle" }
      - { name: auto_renew, type: boolean, source: input, default: false, description: "When true, an EXPIRED package may be renewed into a fresh cycle; when false renew is rejected" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | EXPIRED — cycles ACTIVE->EXPIRED (clock) and EXPIRED->ACTIVE (renew)", constraints: "one of ACTIVE, EXPIRED" }

  - name: PackageRedemption
    parent: Package
    common_fields: false
    fields:
      - { name: package_id, type: string, source: system, description: "FK -> Package.id" }
      - { name: reservation_id, type: string, source: system, description: "Consuming reservation reference (discovered via the package's redemptions list)" }
      - { name: credits_used, type: integer, source: system, default: 1, description: "Credits consumed (always 1 per daycare reservation confirmation)" }
      - { name: redeemed_on, type: string, source: system, description: "YYYY-MM-DD = Facility.current_date at confirmation" }
      - { name: reversed, type: boolean, source: system, default: false, description: "true when the consuming reservation was cancelled/no-showed and the credit returned" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Reservation: BRANCHING lifecycle with CANCELLED / NO_SHOW forks -------
  - entity: Reservation
    initial_state: REQUESTED
    terminal_states: [CLOSED, CANCELLED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm"
        actor: FacilityStaff | FacilityManager
        preconditions:
          - "Reservation.status == REQUESTED (else ERR_INVALID_STATE)"
          - "Pet.vaccination_status == VALID at Facility.current_date (else ERR_VACCINATION_REQUIRED) — cross-entity dependency on Pet"
          - "Pet.temperament_clearance != FLAGGED (else ERR_TEMPERAMENT_NOT_CLEARED) — cross-entity dependency on Pet"
          - "At least one RunAssignment in HELD status exists for this reservation (else ERR_NO_RUN_ASSIGNED)"
          - "deposit_paid_cents >= latched deposit_cents (else ERR_DEPOSIT_UNPAID) unless Facility.deposit_policy == NONE"
          - "If package_id present: Package.status == ACTIVE and credits_remaining >= 1 and service_type == DAYCARE (else ERR_PACKAGE_NOT_REDEEMABLE) — cross-entity dependency on Package"
        side_effects:
          - "Latch deposit_cents = deposit_amount (final variant)"
          - "Every HELD RunAssignment of this reservation -> OCCUPIED (cascade hop 1: Reservation drives RunAssignment)"
          - "Each OCCUPIED RunAssignment marks its Run busy for the window in capacity accounting (cascade hop 2: RunAssignment drives Run)"
          - "If package_id present: create PackageRedemption(credits_used=1, reversed=false), set redeemed_credit=true, recompute Package.credits_remaining"
          - "increments Reservation.version by 1"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /reservations/{id}/check_in"
        actor: FacilityStaff | FacilityManager
        preconditions:
          - "Reservation.status == CONFIRMED (else ERR_INVALID_STATE)"
          - "Facility.current_date >= start_date (else ERR_CHECKIN_TOO_EARLY)"
          - "Pet.vaccination_status == VALID at Facility.current_date (else ERR_VACCINATION_REQUIRED) — re-checked because a record may have lapsed since confirmation"
        side_effects:
          - "increments Reservation.version by 1"

      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /reservations/{id}/check_out"
        actor: FacilityStaff | FacilityManager
        preconditions:
          - "Reservation.status == CHECKED_IN (else ERR_INVALID_STATE)"
        side_effects:
          - "Auto-deliver: every BOOKED AddOn whose scheduled_date is within the window -> DELIVERED"
          - "Compute and latch total_cents = reservation_total"
          - "Every OCCUPIED RunAssignment of this reservation -> RELEASED (cascade hop 1)"
          - "Each RELEASED RunAssignment frees its Run window for future assignments (cascade hop 2)"
          - "increments Reservation.version by 1"

      - from: CHECKED_OUT
        to: CLOSED
        trigger: "POST /reservations/{id}/close (folded: close happens automatically only when belongings settled). Reachable via check_out when all belongings.returned, else a follow-up belongings return then close path is required."
        actor: FacilityManager
        preconditions:
          - "Reservation.status == CHECKED_OUT (else ERR_INVALID_STATE)"
          - "Every belongings[] entry has returned == true (else ERR_BELONGINGS_OUTSTANDING)"
        side_effects:
          - "increments Reservation.version by 1"
        note: "CLOSE is exposed as POST /reservations/{id}/check_out a second time once CHECKED_OUT; see §1.5 check_out which advances CHECKED_OUT->CLOSED when belongings are settled."

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Owner | FacilityStaff | FacilityManager
        preconditions:
          - "Reservation.status in {REQUESTED, CONFIRMED} (else ERR_INVALID_STATE)"
          - "Acting Owner (if role Owner) must own this reservation (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Compute refund_cents = cancellation_refund (provisional variant: deposit_paid_cents may be 0)"
          - "Credit refund_cents to Owner.wallet_credit_cents"
          - "Every HELD RunAssignment of this reservation -> RELEASED"
          - "increments Reservation.version by 1"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Owner | FacilityStaff | FacilityManager
        preconditions:
          - "Reservation.status in {REQUESTED, CONFIRMED} (else ERR_INVALID_STATE)"
          - "Acting Owner (if role Owner) must own this reservation (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Compute refund_cents = cancellation_refund (final variant: deposit fully collected, lead-time tier from current_date)"
          - "Credit refund_cents to Owner.wallet_credit_cents"
          - "Every OCCUPIED RunAssignment of this reservation -> RELEASED"
          - "If redeemed_credit == true: set the linked PackageRedemption.reversed=true (cascade hop 1: Reservation drives PackageRedemption), then recompute Package.credits_remaining (cascade hop 2: PackageRedemption drives Package)"
          - "increments Reservation.version by 1"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /reservations/{id}/mark_no_show"
        actor: FacilityManager
        preconditions:
          - "Reservation.status == CONFIRMED (else ERR_INVALID_STATE)"
          - "Facility.current_date > start_date (else ERR_NO_SHOW_TOO_EARLY) — a no-show can only be declared after the service date has passed"
        side_effects:
          - "refund_cents = 0 (no-show forfeits the entire deposit; no wallet credit)"
          - "Every OCCUPIED RunAssignment of this reservation -> RELEASED"
          - "If redeemed_credit == true: set PackageRedemption.reversed=true, recompute Package.credits_remaining"
          - "increments Reservation.version by 1"

  # --- RunAssignment: lifecycle driven entirely by Reservation cascades ------
  - entity: RunAssignment
    initial_state: HELD
    terminal_states: [RELEASED]
    transitions:
      - from: HELD
        to: OCCUPIED
        trigger: "system (cascade from Reservation REQUESTED->CONFIRMED)"
        actor: system
        preconditions:
          - "Parent Reservation transitioned to CONFIRMED"
        side_effects:
          - "Run treated as occupied for the window in capacity accounting"
          - "increments RunAssignment.version by 1"

      - from: HELD
        to: RELEASED
        trigger: "system (cascade from Reservation REQUESTED->CANCELLED)"
        actor: system
        preconditions:
          - "Parent Reservation cancelled before confirmation"
        side_effects:
          - "Frees the held run window"
          - "increments RunAssignment.version by 1"

      - from: OCCUPIED
        to: RELEASED
        trigger: "system (cascade from Reservation -> CHECKED_OUT / CANCELLED / NO_SHOW)"
        actor: system
        preconditions:
          - "Parent Reservation left an active state"
        side_effects:
          - "Frees the run window for future assignments"
          - "increments RunAssignment.version by 1"

  # --- AddOn: linear with branch to CANCELLED -------------------------------
  - entity: AddOn
    initial_state: BOOKED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: BOOKED
        to: DELIVERED
        trigger: "system (cascade from Reservation CHECKED_IN->CHECKED_OUT for in-window add-ons)"
        actor: system
        preconditions:
          - "AddOn.status == BOOKED and scheduled_date within the reservation window"
        side_effects:
          - "AddOn.price_cents counted into reservation_total"
          - "increments AddOn.version by 1"

      - from: BOOKED
        to: CANCELLED
        trigger: "system (cascade from Reservation -> CANCELLED / NO_SHOW)"
        actor: system
        preconditions:
          - "Parent Reservation left the active path before check-out"
        side_effects:
          - "AddOn excluded from any total"
          - "increments AddOn.version by 1"

  # --- Package: CYCLIC renewal (ACTIVE -> EXPIRED -> ACTIVE) -----------------
  - entity: Package
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (during clock advance when Facility.current_date > cycle_start_date + 30 days)"
        actor: system
        preconditions:
          - "Package.status == ACTIVE and the 30-day cycle has lapsed"
        side_effects:
          - "credits_remaining frozen; no further redemptions until renewed"
          - "increments Package.version by 1"

      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /packages/{id}/renew"
        actor: Owner | FacilityManager
        preconditions:
          - "Package.status == EXPIRED (else ERR_INVALID_STATE)"
          - "auto_renew == true (else ERR_RENEWAL_NOT_ALLOWED)"
        side_effects:
          - "cycle_start_date := Facility.current_date; credits_remaining reset to credits_total"
          - "increments Package.version by 1"
        note: "Cyclic edge — EXPIRED->ACTIVE re-arms the package and resets the credit pool, so the same package row visits ACTIVE more than once."

  # --- Pet: PARALLEL dimensions (vaccination_status × temperament_clearance) --
  - entity: Pet
    initial_state: "vaccination_status=MISSING & temperament_clearance=UNREVIEWED"
    terminal_states: []
    transitions:
      - from: "vaccination_status=MISSING|EXPIRED"
        to: "vaccination_status=VALID"
        trigger: "system (on POST /pets/{id}/vaccinations creating a current record covering required vaccines)"
        actor: system
        preconditions:
          - "All species-required vaccines have a non-superseded record with expires_on >= Facility.current_date"
        side_effects:
          - "recompute vaccination_status; temperament_clearance is untouched (independent axis)"
          - "increments Pet.version by 1"

      - from: "vaccination_status=VALID"
        to: "vaccination_status=EXPIRED"
        trigger: "system (during clock advance when any required vaccine's expires_on < Facility.current_date)"
        actor: system
        preconditions:
          - "At least one required vaccine record lapsed at the new current_date"
        side_effects:
          - "recompute vaccination_status; does NOT change temperament_clearance (independent axis)"
          - "increments Pet.version by 1"

      - from: "temperament_clearance=UNREVIEWED"
        to: "temperament_clearance=CLEARED"
        trigger: "POST /pets/{id}/review with decision==CLEAR"
        actor: FacilityStaff | FacilityManager
        preconditions:
          - "decision field == CLEAR in request body"
        side_effects:
          - "set temperament_clearance=CLEARED; vaccination_status untouched (parallel axis)"
          - "increments Pet.version by 1"

      - from: "temperament_clearance=UNREVIEWED"
        to: "temperament_clearance=FLAGGED"
        trigger: "POST /pets/{id}/review with decision==FLAG"
        actor: FacilityStaff | FacilityManager
        preconditions:
          - "decision field == FLAG in request body"
        side_effects:
          - "set temperament_clearance=FLAGGED; blocks confirmation but leaves vaccination_status independent"
          - "increments Pet.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (true CREATE-with-supersede race, OCC-resolved)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: assignment-create-stale-reservation
    parent_entity: Reservation
    write_endpoint: "POST /reservations/{id}/assignments"
    occ_field: "expected_reservation_version"
    description: |
      Creating a RunAssignment against a Reservation whose version has advanced
      since the client last observed it is rejected on the stale-version check.
      A prior writer may have already created an assignment (which legitimately
      becomes the held slot the new writer wanted to add) so the current writer's
      view of the reservation is stale; the create is refused rather than
      silently stacking a second slot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: deposit_amount
    trigger: "Reservation creation (estimate variant, stored in deposit_cents); Reservation REQUESTED->CONFIRMED (final variant, latched into deposit_cents)"
    algorithm: tiered_pricing
    formula: |
      # Rule 2 mode (a): >=3 inputs with non-linear interaction (size x service x policy).
      base = BASE_BY_SERVICE[service_type]              # DAYCARE 1500, OVERNIGHT 4000
      size_mult = SIZE_MULT[pet.size_class]             # TOY .8, SMALL 1.0, MEDIUM 1.2, LARGE 1.5
      units = (service_type == OVERNIGHT) ? max(nights, 1) : 1
      raw = base * size_mult * units
      policy_factor = POLICY_FACTOR[facility.deposit_policy]   # STANDARD .30, STRICT .50, NONE 0
      deposit = round_half_up(raw * policy_factor)      # round ONCE, after all multiplications
    input_set: "single reservation; reads pet.size_class, service_type, nights, facility.deposit_policy"
    constants:
      BASE_BY_SERVICE: { DAYCARE: 1500, OVERNIGHT: 4000 }
      SIZE_MULT: { TOY: 0.8, SMALL: 1.0, MEDIUM: 1.2, LARGE: 1.5 }
      POLICY_FACTOR: { STANDARD: 0.30, STRICT: 0.50, NONE: 0.0 }
    precision: "integer cents, round_half_up applied once after all multiplications"
    variants:
      - name: estimate
        when: "at Reservation creation"
        difference: "computed from the size_class/nights known at creation; stored in deposit_cents but advisory until confirmation"
      - name: final
        when: "at REQUESTED->CONFIRMED"
        difference: "re-evaluated against the CURRENT facility.deposit_policy and current nights/size_class, then latched; this latched value is what deposit_paid_cents is checked against for ERR_DEPOSIT_UNPAID"

  - name: cancellation_refund
    trigger: "Reservation {REQUESTED,CONFIRMED}->CANCELLED and CONFIRMED->NO_SHOW"
    algorithm: threshold
    formula: |
      # Rule 6 boundary: lead-time threshold tiers on a numeric metric (days).
      lead_days = days_between(start_date, facility.current_date)   # start_date minus current_date
      if path == NO_SHOW:
        refund = 0
      elif lead_days >= 7:
        refund = deposit_paid_cents                                  # full refund
      elif lead_days >= 2:                                           # 2..6 days
        refund = round_half_up(deposit_paid_cents * 0.50)            # 50%
      else:                                                          # 0 or 1 day, or already started
        refund = 0                                                   # forfeit
    input_set: "single reservation; reads deposit_paid_cents, start_date, facility.current_date"
    constants:
      FULL_REFUND_LEAD_DAYS: 7
      PARTIAL_REFUND_LEAD_DAYS: 2
      PARTIAL_RATE: 0.50
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "cancel from REQUESTED (deposit may be unpaid)"
        difference: "refund computed on deposit_paid_cents which can be 0 when the deposit was never collected -> refund is 0 even at >=7 days lead"
      - name: final
        when: "cancel from CONFIRMED (deposit fully paid)"
        difference: "refund computed on the fully-collected deposit_paid_cents, so the same lead-time tier yields a non-zero refund the provisional path could not"

  - name: reservation_total
    trigger: "Reservation CHECKED_IN->CHECKED_OUT (latched into total_cents)"
    algorithm: aggregation
    formula: |
      # Rule 2 mode (c): circular-looking dependency pinned by explicit evaluation order.
      lodging = (service_type == OVERNIGHT) ? OVERNIGHT_NIGHTLY[pet.size_class] * max(nights,1)
                                            : DAYCARE_DAY[pet.size_class]
      addons_sum = sum(AddOn.price_cents for AddOn of this reservation with status == DELIVERED)
      subtotal = lodging + addons_sum
      # Loyalty discount tier is keyed on subtotal, and the discount feeds total.
      # Evaluation order is FIXED: (1) subtotal -> (2) tier from subtotal -> (3) discount -> (4) total.
      # Do NOT recompute the tier after applying the discount.
      tier_rate = (subtotal >= 30000) ? 0.10 : (subtotal >= 15000) ? 0.05 : 0.0
      discount = round_half_up(subtotal * tier_rate)     # round discount BEFORE subtracting
      package_offset = (reservation.redeemed_credit == true) ? DAYCARE_DAY[pet.size_class] : 0
      total = max(subtotal - discount - package_offset, 0)
    input_set: "single reservation; DELIVERED add-ons only; lodging by size_class; loyalty tier from subtotal"
    constants:
      OVERNIGHT_NIGHTLY: { TOY: 3500, SMALL: 4000, MEDIUM: 5000, LARGE: 6500 }
      DAYCARE_DAY: { TOY: 2500, SMALL: 3000, MEDIUM: 3500, LARGE: 4500 }
      ADDON_PRICE_BATH: { TOY: 1500, SMALL: 2000, MEDIUM: 2500, LARGE: 3500 }
      ADDON_PRICE_PLAYTIME: { TOY: 1000, SMALL: 1000, MEDIUM: 1500, LARGE: 2000 }
      TIER1_THRESHOLD: 15000
      TIER1_RATE: 0.05
      TIER2_THRESHOLD: 30000
      TIER2_RATE: 0.10
    precision: "integer cents, round_half_up; discount rounded BEFORE subtracting (rounding order pinned — Rule 2 mode (b) companion)"

  - name: group_compatibility_score
    trigger: "RunAssignment create on a DAYCARE_PEN run (admit/deny check)"
    algorithm: weighted_scoring
    formula: |
      # Different ENTITY DOMAIN than the cost calcs: operates on the Pet temperament/size set in a pen.
      # For the candidate pet vs each pet already HELD/OCCUPIED in the target DAYCARE_PEN on the same date:
      for each existing pet e in the run+date group:
        size_gap = abs(SIZE_RANK[candidate.size_class] - SIZE_RANK[e.size_class])
        temp_pair_penalty = TEMP_PENALTY[candidate.temperament][e.temperament]
        pair_score = W_SIZE * size_gap + W_TEMP * temp_pair_penalty
      group_score = sum(pair_score over all existing pets)            # 0 when the group is empty
    input_set: "candidate Pet + the set of Pets whose RunAssignment on the same run is HELD or OCCUPIED on the overlapping date"
    constants:
      W_SIZE: 2
      W_TEMP: 3
      SIZE_RANK: { TOY: 0, SMALL: 1, MEDIUM: 2, LARGE: 3 }
      TEMP_PENALTY: "REACTIVE×REACTIVE=5, REACTIVE×PLAYFUL=3, REACTIVE×CALM=1, PLAYFUL×PLAYFUL=1, PLAYFUL×CALM=0, CALM×CALM=0 (symmetric)"
      STRICT_MAX: 4
      LENIENT_MAX: 9
    precision: "integer score; any order-sensitive grouping decision tie-breaks on existing assignments' created_at ASC, never id"
    variants:
      - name: strict
        when: "candidate pet.temperament == REACTIVE"
        difference: "group_score must be <= STRICT_MAX (4) or the assignment is rejected with ERR_GROUP_INCOMPATIBLE"
      - name: lenient
        when: "candidate pet.temperament in {CALM, PLAYFUL}"
        difference: "group_score must be <= LENIENT_MAX (9); the same group set can pass lenient and fail strict, producing a different admit/deny for identical pets"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "All path-referenced resources exist, validated left-to-right (facility -> owner -> pet -> reservation -> child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_referential
    check: "Acting Owner may only read/mutate resources whose owner_id == X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Owner-role mutations on Pet/Reservation/Package"

  - priority: 6
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, weight_kg/quantity > 0, dates YYYY-MM-DD, date ordering (end_date > start_date for OVERNIGHT; end_date == start_date for DAYCARE)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 7
    category: business_referential
    check: "Body FKs reference existing in-facility resources (pet_id, run_id, package_id belong to the reservation's facility)"
    error_id: ERR_CROSS_FACILITY_REFERENCE
    http_status: 409
    applies_to: "reservation create, assignment create"

  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 9
    category: business_safety
    check: "Pet.vaccination_status must be VALID at Facility.current_date to confirm or check in a reservation"
    error_id: ERR_VACCINATION_REQUIRED
    http_status: 409
    applies_to: "reservation confirm, reservation check_in"

  - priority: 10
    category: business_safety
    check: "Pet.temperament_clearance must not be FLAGGED to confirm a reservation"
    error_id: ERR_TEMPERAMENT_NOT_CLEARED
    http_status: 409
    applies_to: "reservation confirm"

  - priority: 11
    category: business_constraint
    check: "Target Run.status must be AVAILABLE; Run.size_class must be >= Pet.size_class (TOY<SMALL<MEDIUM<LARGE); Run.kind must map to service_type (OVERNIGHT->OVERNIGHT_SUITE, DAYCARE->DAYCARE_PEN)"
    error_id: ERR_RUN_NOT_ELIGIBLE
    http_status: 409
    applies_to: "assignment create"

  - priority: 12
    category: business_temporal
    check: "A new RunAssignment is rejected if its [window_start_date, window_end_date) overlaps the window of any other non-RELEASED RunAssignment for the SAME pet (a pet cannot be in two places at once). Pet-level self-exclusion uses CLOSED/inclusive semantics: two daycare days on the same calendar date collide even though the half-open suite rule would treat touching endpoints as adjacent."
    error_id: ERR_PET_DOUBLE_BOOKED
    http_status: 409
    applies_to: "assignment create"

  - priority: 13
    category: business_temporal
    check: "OVERNIGHT_SUITE assignment interval [window_start_date, window_end_date) must not overlap any non-RELEASED assignment on the same suite (single-occupancy, half-open intervals; adjacent intervals sharing an endpoint do NOT conflict)"
    error_id: ERR_RUN_OVERLAP
    http_status: 409
    applies_to: "assignment create on OVERNIGHT_SUITE runs"

  - priority: 14
    category: business_temporal
    check: "DAYCARE_PEN assignment on a given date must not push the count of non-RELEASED assignments on that date above Run.daycare_capacity + Facility.overbook_grace (aggregate-capacity overlap; same calendar date collides, different dates do not)"
    error_id: ERR_RUN_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "assignment create on DAYCARE_PEN runs"

  - priority: 15
    category: business_safety
    check: "DAYCARE_PEN grouping: group_compatibility_score for the candidate against the date group must be within the applicable strict/lenient ceiling"
    error_id: ERR_GROUP_INCOMPATIBLE
    http_status: 409
    applies_to: "assignment create on DAYCARE_PEN runs"

  - priority: 16
    category: business_constraint
    check: "A reservation must have at least one HELD RunAssignment before it can be confirmed"
    error_id: ERR_NO_RUN_ASSIGNED
    http_status: 409
    applies_to: "reservation confirm"

  - priority: 17
    category: business_fiscal
    check: "deposit_paid_cents must be >= latched deposit_cents to confirm, unless Facility.deposit_policy == NONE"
    error_id: ERR_DEPOSIT_UNPAID
    http_status: 409
    applies_to: "reservation confirm"

  - priority: 18
    category: business_constraint
    check: "If package_id is present at confirm: Package.status == ACTIVE, credits_remaining >= 1, service_type == DAYCARE"
    error_id: ERR_PACKAGE_NOT_REDEEMABLE
    http_status: 409
    applies_to: "reservation confirm"

  - priority: 19
    category: business_temporal
    check: "check_in requires Facility.current_date >= start_date; mark_no_show requires Facility.current_date > start_date"
    error_id: ERR_CHECKIN_TOO_EARLY
    http_status: 409
    applies_to: "reservation check_in"

  - priority: 20
    category: business_temporal
    check: "mark_no_show before the service date has passed (current_date <= start_date) is rejected"
    error_id: ERR_NO_SHOW_TOO_EARLY
    http_status: 409
    applies_to: "reservation mark_no_show"

  - priority: 21
    category: business_constraint
    check: "Advancing CHECKED_OUT->CLOSED is blocked while any belongings[] entry has returned == false"
    error_id: ERR_BELONGINGS_OUTSTANDING
    http_status: 409
    applies_to: "reservation check_out (second call, CHECKED_OUT->CLOSED)"

  - priority: 22
    category: business_temporal
    check: "AddOn.scheduled_date must fall inside the reservation window for creation"
    error_id: ERR_ADDON_OUT_OF_WINDOW
    http_status: 409
    applies_to: "addon create"

  - priority: 23
    category: business_constraint
    check: "Package renew requires auto_renew == true"
    error_id: ERR_RENEWAL_NOT_ALLOWED
    http_status: 409
    applies_to: "package renew"

  - priority: 24
    category: business_fiscal
    check: "OCC: expected_reservation_version on assignment create must equal the live Reservation.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "assignment create"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Facility & clock ---
  - method: POST
    path: "/facilities"
    description: "Create a Facility"
    roles: [FacilityManager]
    code: 201
    input: ["name", "daycare_cutoff_time?", "deposit_policy?", "overbook_grace?"]
    output: Facility
    side_effects: ["current_date initialized to 2026-01-01"]

  - method: GET
    path: "/facilities/{id}"
    description: "Get a Facility"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/facilities/{id}/_clock/advance"
    description: "Test-driving clock: set Facility.current_date; runs vaccination-expiry and package-expiry cascades"
    roles: [FacilityManager]
    code: 200
    input: ["to_date"]
    output: Facility
    side_effects:
      - "current_date := to_date"
      - "Recompute Pet.vaccination_status for affected pets (VALID->EXPIRED)"
      - "Lapse ACTIVE Packages past their 30-day cycle to EXPIRED"

  # --- Owner ---
  - method: POST
    path: "/facilities/{id}/owners"
    description: "Create an Owner"
    roles: [FacilityManager, FacilityStaff]
    code: 201
    input: ["full_name", "email", "phone"]
    output: Owner
    side_effects: ["status=ACTIVE, wallet_credit_cents=0"]

  - method: GET
    path: "/owners/{id}"
    description: "Get an Owner"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 200
    input: []
    output: Owner
    side_effects: []

  - method: GET
    path: "/facilities/{id}/owners"
    description: "List Owners of a Facility (reverse-reachability for Owner.facility_id)"
    roles: [FacilityManager, FacilityStaff]
    code: 200
    input: ["email?", "status?", "limit?", "offset?"]
    output: "Owner[]"
    side_effects: []

  # --- Pet ---
  - method: POST
    path: "/owners/{id}/pets"
    description: "Create a Pet under an Owner"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 201
    input: ["name", "species", "weight_kg", "temperament?"]
    output: Pet
    side_effects: ["size_class computed from weight_kg", "vaccination_status=MISSING", "temperament_clearance=UNREVIEWED"]

  - method: GET
    path: "/pets/{id}"
    description: "Get a Pet"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 200
    input: []
    output: Pet
    side_effects: []

  - method: GET
    path: "/owners/{id}/pets"
    description: "List Pets of an Owner (reverse-reachability for Pet.owner_id)"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: "Pet[]"
    side_effects: []

  - method: POST
    path: "/pets/{id}/review"
    description: "Staff temperament review (decision CLEAR or FLAG)"
    roles: [FacilityManager, FacilityStaff]
    code: 200
    input: ["decision"]
    output: Pet
    side_effects: ["temperament_clearance := CLEARED|FLAGGED", "increments Pet.version by 1"]

  # --- VaccinationRecord (child of Pet) ---
  - method: POST
    path: "/pets/{id}/vaccinations"
    description: "Add a VaccinationRecord; supersedes the prior record for the same vaccine"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 201
    input: ["vaccine", "administered_on", "expires_on"]
    output: VaccinationRecord
    side_effects:
      - "Mark prior same-vaccine record superseded=true"
      - "Recompute Pet.vaccination_status (may flip MISSING/EXPIRED->VALID)"

  - method: GET
    path: "/pets/{id}/vaccinations"
    description: "List VaccinationRecords of a Pet (reverse-reachability for VaccinationRecord.pet_id)"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: "VaccinationRecord[]"
    side_effects: []

  # --- Run ---
  - method: POST
    path: "/facilities/{id}/runs"
    description: "Create a Run (suite or daycare pen); status set AVAILABLE or RETIRED at creation"
    roles: [FacilityManager]
    code: 201
    input: ["label", "kind", "size_class", "daycare_capacity?", "status?"]
    output: Run
    side_effects: ["OVERNIGHT_SUITE forced to daycare_capacity=1"]

  - method: GET
    path: "/facilities/{id}/runs"
    description: "List Runs of a Facility (reverse-reachability for Run.facility_id)"
    roles: [FacilityManager, FacilityStaff]
    code: 200
    input: ["kind?", "status?", "limit?", "offset?"]
    output: "Run[]"
    side_effects: []

  # --- Reservation ---
  - method: POST
    path: "/facilities/{id}/reservations"
    description: "Create a Reservation (REQUESTED)"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 201
    input: ["pet_id", "service_type", "start_date", "end_date", "package_id?", "care_plan?", "belongings?"]
    output: Reservation
    side_effects:
      - "owner_id copied from pet"
      - "nights computed; deposit_cents = deposit_amount (estimate variant)"
      - "MEDICATION care_plan entries forced requires_signoff=true; belongings recorded with returned=false"
      - "status=REQUESTED"

  - method: GET
    path: "/reservations/{id}"
    description: "Get a Reservation (embeds care_plan, belongings, and add-ons)"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/reservations"
    description: "List Reservations (reverse-reachability for Reservation.pet_id, .owner_id, .package_id)"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 200
    input: ["pet_id?", "owner_id?", "package_id?", "status?", "limit?", "offset?"]
    output: "Reservation[]"
    side_effects: []

  - method: POST
    path: "/reservations/{id}/pay_deposit"
    description: "Collect deposit toward a REQUESTED reservation (wallet credit first, then cash)"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 200
    input: ["cash_cents"]
    output: Reservation
    side_effects:
      - "Debit Owner.wallet_credit_cents up to remaining deposit, then apply cash_cents"
      - "deposit_paid_cents increased"

  - method: POST
    path: "/reservations/{id}/confirm"
    description: "Confirm a reservation (REQUESTED->CONFIRMED)"
    roles: [FacilityManager, FacilityStaff]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "Latch deposit_cents (final variant)"
      - "HELD RunAssignments -> OCCUPIED (-> Run capacity accounting)"
      - "If package_id: create PackageRedemption, set redeemed_credit, recompute Package.credits_remaining"
      - "increments Reservation.version by 1"

  - method: POST
    path: "/reservations/{id}/check_in"
    description: "Check in (CONFIRMED->CHECKED_IN)"
    roles: [FacilityManager, FacilityStaff]
    code: 200
    input: []
    output: Reservation
    side_effects: ["increments Reservation.version by 1"]

  - method: POST
    path: "/reservations/{id}/check_out"
    description: "Check out (CHECKED_IN->CHECKED_OUT); a second call advances CHECKED_OUT->CLOSED once all belongings are returned"
    roles: [FacilityManager, FacilityStaff]
    code: 200
    input: ["return_all_belongings?"]
    output: Reservation
    side_effects:
      - "From CHECKED_IN: auto-deliver in-window BOOKED add-ons, latch total_cents, release OCCUPIED RunAssignments"
      - "From CHECKED_OUT: if return_all_belongings==true mark every belongings entry returned, then advance to CLOSED if all returned (else ERR_BELONGINGS_OUTSTANDING)"
      - "increments Reservation.version by 1"

  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Cancel ({REQUESTED,CONFIRMED}->CANCELLED)"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "refund_cents = cancellation_refund; credited to Owner.wallet_credit_cents"
      - "RunAssignments -> RELEASED"
      - "If redeemed_credit: reverse PackageRedemption, recompute Package.credits_remaining"
      - "increments Reservation.version by 1"

  - method: POST
    path: "/reservations/{id}/mark_no_show"
    description: "Mark no-show (CONFIRMED->NO_SHOW)"
    roles: [FacilityManager]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "refund_cents=0 (deposit forfeit)"
      - "RunAssignments -> RELEASED"
      - "If redeemed_credit: reverse PackageRedemption, recompute Package.credits_remaining"
      - "increments Reservation.version by 1"

  - method: POST
    path: "/reservations/{id}/incidents"
    description: "Append an incident log entry to the reservation"
    roles: [FacilityManager, FacilityStaff]
    code: 201
    input: ["severity", "note"]
    output: Reservation
    side_effects: ["incident appended with logged_on = Facility.current_date; pet_id captured from the reservation"]

  # --- RunAssignment (child of Reservation; OCC-guarded create) ---
  - method: POST
    path: "/reservations/{id}/assignments"
    description: "Create a RunAssignment (HELD) — OCC-guarded on Reservation.version; runs eligibility, overlap/capacity, and grouping checks"
    roles: [FacilityManager, FacilityStaff]
    code: 201
    input: ["run_id", "expected_reservation_version"]
    output: RunAssignment
    side_effects:
      - "window dates derived from reservation"
      - "status=HELD"
      - "increments Reservation.version by 1"

  - method: GET
    path: "/reservations/{id}/assignments"
    description: "List RunAssignments of a Reservation (reverse-reachability for RunAssignment.reservation_id)"
    roles: [FacilityManager, FacilityStaff]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RunAssignment[]"
    side_effects: []

  # --- AddOn (child of Reservation; created under it, embedded in reservation reads) ---
  - method: POST
    path: "/reservations/{id}/addons"
    description: "Add an add-on (BATH/PLAYTIME) to a reservation"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 201
    input: ["kind", "scheduled_date"]
    output: AddOn
    side_effects: ["price_cents latched from ADDON_PRICE by kind & pet size_class", "status=BOOKED"]

  # --- Package (child of Owner; cyclic lifecycle) ---
  - method: POST
    path: "/owners/{id}/packages"
    description: "Buy a recurring daycare package (ACTIVE)"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 201
    input: ["tier", "cycle_start_date", "auto_renew?"]
    output: Package
    side_effects: ["credits_total & credits_remaining set from tier; status=ACTIVE"]

  - method: GET
    path: "/packages/{id}"
    description: "Get a Package"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 200
    input: []
    output: Package
    side_effects: []

  - method: GET
    path: "/owners/{id}/packages"
    description: "List Packages of an Owner (reverse-reachability for Package.owner_id)"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Package[]"
    side_effects: []

  - method: POST
    path: "/packages/{id}/renew"
    description: "Renew an expired package (EXPIRED->ACTIVE)"
    roles: [FacilityManager, Owner]
    code: 200
    input: []
    output: Package
    side_effects: ["cycle_start_date := current_date; credits_remaining reset to credits_total", "increments Package.version by 1"]

  - method: GET
    path: "/packages/{id}/redemptions"
    description: "List PackageRedemptions of a Package (reverse-reachability for PackageRedemption.package_id)"
    roles: [FacilityManager, FacilityStaff, Owner]
    code: 200
    input: ["reversed?", "limit?", "offset?"]
    output: "PackageRedemption[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth / existence
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing/malformed" }
  - { id: ERR_INVALID_ROLE, http: 401, condition: "X-User-Role not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Owner acts on a resource whose owner_id is not their own id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-referenced resource does not exist" }
  # request validation
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, non-positive weight/quantity, bad date format/order" }
  - { id: ERR_CROSS_FACILITY_REFERENCE, http: 409, condition: "A body FK (pet_id/run_id/package_id) belongs to a different facility than the reservation" }
  # state
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition is defined" }
  # vaccination / temperament safety
  - { id: ERR_VACCINATION_REQUIRED, http: 409, condition: "Pet.vaccination_status != VALID at confirm/check_in" }
  - { id: ERR_TEMPERAMENT_NOT_CLEARED, http: 409, condition: "Pet.temperament_clearance == FLAGGED at confirm" }
  # run / capacity / grouping
  - { id: ERR_RUN_NOT_ELIGIBLE, http: 409, condition: "Run not AVAILABLE, or size_class too small, or kind mismatched for the service_type" }
  - { id: ERR_RUN_OVERLAP, http: 409, condition: "OVERNIGHT_SUITE interval collides with an existing non-RELEASED assignment (half-open)" }
  - { id: ERR_RUN_CAPACITY_EXCEEDED, http: 409, condition: "DAYCARE_PEN date count would exceed daycare_capacity + overbook_grace" }
  - { id: ERR_GROUP_INCOMPATIBLE, http: 409, condition: "group_compatibility_score exceeds the applicable strict/lenient ceiling" }
  - { id: ERR_PET_DOUBLE_BOOKED, http: 409, condition: "A new assignment window overlaps another non-RELEASED assignment for the same pet (closed/inclusive interval semantics)" }
  - { id: ERR_NO_RUN_ASSIGNED, http: 409, condition: "Confirm attempted with no HELD RunAssignment" }
  # fiscal / package
  - { id: ERR_DEPOSIT_UNPAID, http: 409, condition: "deposit_paid_cents < deposit_cents at confirm (policy != NONE)" }
  - { id: ERR_PACKAGE_NOT_REDEEMABLE, http: 409, condition: "package_id present but package not ACTIVE / no credits / non-DAYCARE service" }
  - { id: ERR_RENEWAL_NOT_ALLOWED, http: 409, condition: "Renew an EXPIRED package whose auto_renew is false" }
  # lifecycle timing / blocking
  - { id: ERR_CHECKIN_TOO_EARLY, http: 409, condition: "check_in before start_date (current_date < start_date)" }
  - { id: ERR_NO_SHOW_TOO_EARLY, http: 409, condition: "mark_no_show before the service date has passed (current_date <= start_date)" }
  - { id: ERR_ADDON_OUT_OF_WINDOW, http: 409, condition: "AddOn.scheduled_date outside the reservation window" }
  - { id: ERR_BELONGINGS_OUTSTANDING, http: 409, condition: "Advance CHECKED_OUT->CLOSED while a belongings entry is not returned" }
  # concurrency
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_reservation_version != live Reservation.version on assignment create" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FacilityManager
    description: "Kennel manager: full operational authority — facility/run config, clock, no-show, all transitions and overrides"
    identity: "opaque"
    exclusive_operations:
      - "POST /facilities — Create facility"
      - "POST /facilities/{id}/_clock/advance — Advance business date"
      - "POST /facilities/{id}/runs — Create run"
      - "POST /reservations/{id}/mark_no_show — Mark no-show"
    shared_operations:
      - "All FacilityStaff operations (manager is a superset operator)"

  - name: FacilityStaff
    description: "Front-desk & kennel staff: create owners/pets/reservations/assignments, run the confirm->check_in->check_out flow, review temperament, log incidents, add add-ons"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /facilities/{id}/owners — Create owner (with FacilityManager)"
      - "POST /pets/{id}/review — Temperament review (with FacilityManager)"
      - "POST /reservations/{id}/confirm — Confirm (with FacilityManager)"
      - "POST /reservations/{id}/check_in — Check in (with FacilityManager)"
      - "POST /reservations/{id}/check_out — Check out / close (with FacilityManager)"
      - "POST /reservations/{id}/assignments — Create assignment (with FacilityManager)"
      - "POST /reservations/{id}/incidents — Log incident (with FacilityManager)"

  - name: Owner
    description: "Pet parent: manages own pets/vaccinations/packages, creates and cancels own reservations, pays own deposit, adds care/belongings/add-ons; identity equals the acting Owner.id"
    identity: "entity_backed:Owner"
    exclusive_operations: []
    shared_operations:
      - "POST /owners/{id}/pets — Create own pet (with staff)"
      - "POST /pets/{id}/vaccinations — Add own pet vaccination (with staff)"
      - "POST /facilities/{id}/reservations — Create own reservation (with staff)"
      - "POST /reservations/{id}/pay_deposit — Pay own deposit (with staff)"
      - "POST /reservations/{id}/cancel — Cancel own reservation (with staff)"
      - "POST /reservations/{id}/addons — Add an add-on to own reservation (with staff)"
      - "POST /owners/{id}/packages — Buy own package (with staff)"
      - "POST /packages/{id}/renew — Renew own package (with FacilityManager)"
      - "GET own owner/pet/reservation/package/redemption reads"
