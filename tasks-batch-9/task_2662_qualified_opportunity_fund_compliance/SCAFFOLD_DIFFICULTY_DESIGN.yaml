              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { b1_id: $.data.id }
            - call: "POST /qof/qoz-businesses"
              payload: { fund_id: "${fund_id}", legal_name: "Cash Heavy LLC", zone_tract_code: "12345678902", declared_nqfp_amount: 300000.00, total_asset_value: 1000000.00, total_tangible_property_basis: 900000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { b2_id: $.data.id }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZB_EQUITY", qoz_business_id: "${b1_id}", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 400000.00, afs_fair_value: 400000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { eq1_id: $.data.id }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZB_EQUITY", qoz_business_id: "${b2_id}", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 400000.00, afs_fair_value: 400000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { eq2_id: $.data.id }
            - call: "POST /qof/qoz-businesses/${b1_id}/business-tests"
              payload: { testing_date: "2026-06-30T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { bt1_id: $.data.id }
            - call: "POST /qof/qoz-businesses/${b2_id}/business-tests"
              payload: { testing_date: "2026-06-30T00:00:00Z" }
