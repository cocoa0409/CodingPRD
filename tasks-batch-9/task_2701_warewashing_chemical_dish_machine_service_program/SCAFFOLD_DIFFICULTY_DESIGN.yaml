  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_visit_windows_reject_inside_the_thirty_minute_travel_buffer
        grounds:
          - validations.technician_schedule_no_overlap
          - entities.ServiceVisit.fields.scheduled_start_at
          - entities.Technician
          - endpoints.POST_service_visits
        distinguishing_aspect: |
          The contended resource is a Technician's calendar and the interval semantics are BUFFERED:
          each existing window is padded by TRAVEL_BUFFER_MINUTES 30 on both sides, so two windows that
          do not intersect at all can still conflict. Against an existing 10:00-11:00 visit, a
          11:29-12:29 window is rejected even though it starts 29 minutes AFTER the other ended, while
          11:30-12:30 is accepted - the pad is closed on the far side (exactly 30 minutes is allowed).
          Only visits in {SCHEDULED, IN_PROGRESS, SUBMITTED, VERIFIED} contend; a CANCELLED window
          releases the slot.
        test_recipe:
          setup:
            - "Logical clock stays at its 2026-08-01T00:00:00Z default."
            - "One AVAILABLE NW technician and three INSTALLED placements, each with its own RACK_QUALITY ticket dispatched to that technician (open_ticket_count reaches 3, which is allowed because no fourth dispatch happens)."
            - "One existing SCHEDULED visit on ticket 1 covering 2026-08-01T10:00:00Z to 2026-08-01T11:00:00Z."
