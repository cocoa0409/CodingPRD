            - "after cure-default: LeaseAgreement.${lease}.status == ACTIVE (cycle closed)"
            - "after cure-default: LeaseAgreement.${lease}.arrears_cents == 0 and missed_payment_count == 0"
            - "second declare-default fails: captured err2 == ERR_LEASE_NOT_DEFAULT_ELIGIBLE (counter was reset by the cure)"

      - name: settlement_dispute_reissue_cycle
        grounds:
          - state_machines.SettlementStatement.ISSUED_to_DISPUTED
          - state_machines.SettlementStatement.DISPUTED_to_ISSUED
          - calculations.settlement_waterfall
        distinguishing_aspect: |
          SettlementStatement cycles ISSUED -> DISPUTED -> ISSUED (reissue with a
          maintenance override) before FINALIZED — a revision loop on a different
          entity than LeaseAgreement; the override (25000) drives the provisional
          view while finalize re-derives the final basis (0, no work orders).
