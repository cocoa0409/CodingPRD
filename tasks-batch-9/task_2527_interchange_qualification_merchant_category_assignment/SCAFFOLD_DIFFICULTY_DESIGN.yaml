  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_entity_enrollment_blocked_until_merchant_mcc_status_becomes_verified
        grounds:
          - validations[priority=15]
          - errors[ERR_MERCHANT_NOT_VERIFIED]
          - state_machines.Merchant.PENDING_VERIFICATION_to_VERIFIED
          - state_machines.IncentiveEnrollment.PENDING_to_ENROLLED
          - entities.MccDefinition.fields.requires_documentation
        distinguishing_aspect: |
          Writing IncentiveEnrollment is gated on the state of an entity it does not even reference
          directly in the failing check chain — Merchant.mcc_status. The merchant is auto-assigned
          MCC 4900, whose MccDefinition.requires_documentation is true, so it stops in
          PENDING_VERIFICATION and the enrollment is refused; nothing about the enrollment payload
          changes, only the OTHER entity's state, and the identical call then succeeds.
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform; one US/USD acquirer."
            - "MccDefinition 4900 (UTILITY_SERVICE) with requires_documentation true."
            - "Incentive program with eligible_mcc_codes [\"4900\"], total_capacity_cents 100000000, min_commitment_cents 5000000."
            - "One utility merchant whose assigned_mcc resolves to 4900 and whose mcc_status is therefore PENDING_VERIFICATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "4900", description: "Utilities", business_type_key: "UTILITY_SERVICE", program_eligibility: ["UTILITY"], requires_documentation: true, high_risk: false }
              as: NetworkAdmin
            - call: "POST /incentive-programs"
              payload: { program_name: "Utility Growth 2026", eligible_mcc_codes: ["4900"], total_capacity_cents: 100000000, min_commitment_cents: 5000000, reopen_threshold_cents: 5000000, performance_threshold_pct: 80.00 }
              as: NetworkAdmin
              captures: { ip_id: $.data.id, ip_v0: $.data.version }
            - call: "POST /merchants"
              payload: { legal_name: "Riverside Power", business_type_key: "UTILITY_SERVICE", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_id: $.data.id, mer_status_at_create: $.data.mcc_status, mer_mcc: $.data.assigned_mcc }
          trigger:
            - call: "POST /incentive-enrollments"
              payload: { incentive_program_id: "${ip_id}", merchant_id: "${mer_id}", committed_volume_cents: 5000000, waitlist_requested: false, expected_incentive_program_version: "${ip_v0}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
            - call: "POST /merchants/${mer_id}/verify-category"
              payload: { documentation_ref: "DOC-UTIL-2026-0001" }
              as: CategoryAnalyst
              as_user_id: "CAN-1"
            - call: "POST /incentive-enrollments"
              payload: { incentive_program_id: "${ip_id}", merchant_id: "${mer_id}", committed_volume_cents: 5000000, waitlist_requested: false, expected_incentive_program_version: "${ip_v0}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
          assert:
            - "${mer_mcc} == 4900"
            - "${mer_status_at_create} == PENDING_VERIFICATION"
            - "the first trigger call returns HTTP status 409 and data.error_id == ERR_MERCHANT_NOT_VERIFIED"
            - "the second trigger call returns HTTP status 200 and data.mcc_status == VERIFIED"
            - "Merchant.${mer_id}.documentation_ref == DOC-UTIL-2026-0001"
            - "Merchant.${mer_id}.verified_by_user_id == CAN-1"
            - "the third trigger call returns HTTP status 201 and data.status == ENROLLED"
            - "IncentiveProgram.${ip_id}.uncommitted_capacity_cents == 95000000"
            - "IncentiveProgram.${ip_id}.enrolled_count == 1"

      - name: cross_entity_batch_finalize_blocked_by_acquirer_compliance_status_from_missed_window
        grounds:
          - validations[priority=16]
          - errors[ERR_ACQUIRER_NON_COMPLIANT]
          - state_machines.AcquirerImplementationWindow.SCHEDULED_to_MISSED
          - state_machines.Acquirer.COMPLIANT_to_NON_COMPLIANT
          - state_machines.SettlementBatch.SUBMITTED_to_FINALIZED
        distinguishing_aspect: |
          A different direction and a different pair of entities from the enrollment gate: here the
          blocking state lives two entities away and is reached by a CLOCK SWEEP rather than by an
          operator call. A missed AcquirerImplementationWindow flips Acquirer.compliance_status to
          NON_COMPLIANT, which locks POST /settlement-batches/{id}/finalize for an unrelated batch;
          completing the window late restores COMPLIANT and unblocks the very same finalize.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T12:00:00Z; one platform (max_concurrent_windows 1, blackout_buffer_days 3); one US/USD acquirer, initially COMPLIANT."
            - "MCC 5411; CPS_RETAIL and STANDARD rate programs; one VERIFIED grocery merchant."
            - "A CPS_RETAIL RateProgramVersion for 2026Q4 published at 2026-09-01T12:00:00Z with implementation_deadline 2026-09-30T00:00:00Z."
            - "One SCHEDULED implementation window [2026-09-05, 2026-09-10] for that version."
            - "One SUBMITTED batch dated 2026-09-01 holding a single 100000-cent record with all four data elements and a 2-hour clearing delay."
            - "Clock then advanced to 2026-09-20T00:00:00Z so the sweep marks the window MISSED (the record's auth is only 456 h old, well inside AUTH_VALIDITY_HOURS)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5411", description: "Grocery Stores", business_type_key: "GROCERY", program_eligibility: ["SMALL_TICKET"], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "CPS_RETAIL_STD", name: "CPS Retail", category: "CPS_RETAIL", eligible_mcc_codes: ["5411"], base_rate_bps: 145, per_item_fee_cents: 10, requires_data_elements: ["AUTH_CODE", "TERMINAL_ID", "TRANSACTION_DATE", "CARDHOLDER_ZIP"], max_clearing_delay_hours: 24 }
              as: NetworkAdmin
              captures: { cps_id: $.data.id }
            - call: "POST /rate-programs"
              payload: { program_code: "STANDARD_FALLBACK", name: "Standard", category: "STANDARD", eligible_mcc_codes: ["5411", "4900", "7995", "8398", "9399"], base_rate_bps: 254, per_item_fee_cents: 10, requires_data_elements: [], max_clearing_delay_hours: 720 }
              as: NetworkAdmin
            - call: "POST /rate-programs/${cps_id}/versions"
              payload: { publication_quarter: "2026Q4", effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", base_rate_bps: 150, per_item_fee_cents: 10, implementation_deadline: "2026-09-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { rpv_id: $.data.id }
            - call: "POST /rate-program-versions/${rpv_id}/publish"
              payload: {}
              as: NetworkAdmin
              captures: { rpv_published_at: $.data.published_at }
            - call: "POST /implementation-windows"
              payload: { acquirer_id: "${acq_id}", rate_program_version_id: "${rpv_id}", platform_id: "${plat_id}", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-10T00:00:00Z" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { win_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "Corner Grocer", business_type_key: "GROCERY", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_id: $.data.id }
            - call: "POST /settlement-batches"
              payload: { acquirer_id: "${acq_id}", batch_date: "2026-09-01", currency_code: "USD" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { batch_id: $.data.id, batch_v0: $.data.version }
            - call: "POST /settlement-batches/${batch_id}/transaction-records"
              payload: { merchant_id: "${mer_id}", amount_cents: 100000, transaction_currency: "USD", auth_code: "A00090", auth_timestamp: "2026-09-01T00:00:00Z", clearing_timestamp: "2026-09-01T02:00:00Z", data_elements: ["AUTH_CODE", "TERMINAL_ID", "TRANSACTION_DATE", "CARDHOLDER_ZIP"], expected_batch_version: "${batch_v0}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /settlement-batches/${batch_id}/submit"
              payload: {}
              as: AcquirerOps
              as_user_id: "${acq_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /settlement-batches/${batch_id}/finalize"
              payload: {}
              as: NetworkAdmin
            - call: "POST /implementation-windows/${win_id}/complete"
              payload: { completion_note: "Certified late on 2026-09-20" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
            - call: "POST /settlement-batches/${batch_id}/finalize"
              payload: {}
              as: NetworkAdmin
          assert:
            - "${rpv_published_at} == 2026-09-01T12:00:00.000Z"
            - "AcquirerImplementationWindow.${win_id}.status == MISSED before the trigger"
            - "the first trigger call returns HTTP status 409 and data.error_id == ERR_ACQUIRER_NON_COMPLIANT"
            - "SettlementBatch.${batch_id}.status == SUBMITTED after the first trigger call"
            - "the second trigger call returns HTTP status 200 and data.status == COMPLETED_LATE"
            - "Acquirer.${acq_id}.missed_window_count == 0"
            - "Acquirer.${acq_id}.compliance_status == COMPLIANT"
            - "the third trigger call returns HTTP status 200 and data.status == FINALIZED"
            - "TransactionRecord.${rec_id}.qualification_status == QUALIFIED"
            - "TransactionRecord.${rec_id}.assessed_interchange_cents == 1460"
            - "SettlementBatch.${batch_id}.total_assessed_cents == 1460"

  - rule_id: resource_temporal_overlap
    instances:
      - name: temporal_overlap_rate_version_half_open_adjacency_legal_intrusion_rejected
        grounds:
          - calculations.rate_version_window_overlap_check
          - validations[priority=21]
          - errors[ERR_RATE_VERSION_WINDOW_OVERLAP]
          - state_machines.RateProgramVersion.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          INTERVAL SEMANTICS A: half-open [effective_from, effective_to), capacity of exactly one,
          zero buffer, checked at publish time and only against PUBLISHED rivals. Touching
          endpoints (2027-01-01 handing off to 2027-01-01) are legal, but a version that reaches
          back to 2026-12-15 intrudes and is rejected with 409.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T12:00:00Z; one platform; one US/USD acquirer; MCC 5411; CPS_RETAIL rate program."
            - "Three DRAFT versions of that program: 2026Q4 [2026-10-01, 2027-01-01), 2027Q1 [2027-01-01, 2027-04-01) and 2027Q2 [2026-12-15, 2027-03-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5411", description: "Grocery Stores", business_type_key: "GROCERY", program_eligibility: ["SMALL_TICKET"], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "CPS_RETAIL_STD", name: "CPS Retail", category: "CPS_RETAIL", eligible_mcc_codes: ["5411"], base_rate_bps: 145, per_item_fee_cents: 10, requires_data_elements: ["AUTH_CODE", "TERMINAL_ID", "TRANSACTION_DATE", "CARDHOLDER_ZIP"], max_clearing_delay_hours: 24 }
              as: NetworkAdmin
              captures: { cps_id: $.data.id }
            - call: "POST /rate-programs/${cps_id}/versions"
              payload: { publication_quarter: "2026Q4", effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", base_rate_bps: 150, per_item_fee_cents: 10, implementation_deadline: "2026-09-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /rate-programs/${cps_id}/versions"
              payload: { publication_quarter: "2027Q1", effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z", base_rate_bps: 155, per_item_fee_cents: 10, implementation_deadline: "2026-12-31T00:00:00Z" }
              as: NetworkAdmin
              captures: { v2_id: $.data.id }
            - call: "POST /rate-programs/${cps_id}/versions"
              payload: { publication_quarter: "2027Q2", effective_from: "2026-12-15T00:00:00Z", effective_to: "2027-03-01T00:00:00Z", base_rate_bps: 160, per_item_fee_cents: 10, implementation_deadline: "2026-12-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { v3_id: $.data.id }
          trigger:
            - call: "POST /rate-program-versions/${v1_id}/publish"
              payload: {}
              as: NetworkAdmin
            - call: "POST /rate-program-versions/${v2_id}/publish"
              payload: {}
              as: NetworkAdmin
            - call: "POST /rate-program-versions/${v3_id}/publish"
              payload: {}
              as: NetworkAdmin
          assert:
            - "the first trigger call returns HTTP status 200 and data.status == PUBLISHED"
            - "the second trigger call returns HTTP status 200 and data.status == PUBLISHED"
            - "the third trigger call returns HTTP status 409 and data.error_id == ERR_RATE_VERSION_WINDOW_OVERLAP"
            - "RateProgramVersion.${v2_id}.status == PUBLISHED"
            - "RateProgramVersion.${v3_id}.status == DRAFT"
            - "GET /rate-program-versions filtered by rate_program_id ${cps_id} and status PUBLISHED returns 2 rows"

      - name: temporal_overlap_platform_windows_closed_interval_with_symmetric_buffer_and_capacity
        grounds:
          - calculations.platform_window_overlap_check
          - calculations.implementation_window_bounds_check
          - validations[priority=20]
          - validations[priority=22]
          - errors[ERR_PLATFORM_WINDOW_CONFLICT]
          - errors[ERR_IMPLEMENTATION_WINDOW_OUT_OF_BOUNDS]
        distinguishing_aspect: |
          Deliberately the OPPOSITE arithmetic to the rate-version check: INTERVAL SEMANTICS B is a
          CLOSED interval with a symmetric 3-day blackout buffer inflated onto every existing
          window and an aggregate capacity of max_concurrent_windows, evaluated at create time.
          Geometrically disjoint windows still collide once buffered ([2026-09-12, 2026-09-15]
          against a buffered [2026-09-02, 2026-09-13]), a window just past the buffer is admitted,
          and a fourth window that both conflicts AND leaves the deadline envelope surfaces the
          higher-priority bounds error instead.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T12:00:00Z; one platform with max_concurrent_windows 1 and blackout_buffer_days 3; one US/USD acquirer."
            - "MCC 5411; CPS_RETAIL rate program; one 2026Q4 RateProgramVersion published at 2026-09-01T12:00:00Z with implementation_deadline 2026-09-30T00:00:00Z."
            - "No implementation windows exist yet on the platform."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5411", description: "Grocery Stores", business_type_key: "GROCERY", program_eligibility: ["SMALL_TICKET"], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "CPS_RETAIL_STD", name: "CPS Retail", category: "CPS_RETAIL", eligible_mcc_codes: ["5411"], base_rate_bps: 145, per_item_fee_cents: 10, requires_data_elements: ["AUTH_CODE", "TERMINAL_ID", "TRANSACTION_DATE", "CARDHOLDER_ZIP"], max_clearing_delay_hours: 24 }
              as: NetworkAdmin
              captures: { cps_id: $.data.id }
            - call: "POST /rate-programs/${cps_id}/versions"
              payload: { publication_quarter: "2026Q4", effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", base_rate_bps: 150, per_item_fee_cents: 10, implementation_deadline: "2026-09-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { rpv_id: $.data.id }
            - call: "POST /rate-program-versions/${rpv_id}/publish"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /implementation-windows"
              payload: { acquirer_id: "${acq_id}", rate_program_version_id: "${rpv_id}", platform_id: "${plat_id}", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-10T00:00:00Z" }
              as: NetworkAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /implementation-windows"
              payload: { acquirer_id: "${acq_id}", rate_program_version_id: "${rpv_id}", platform_id: "${plat_id}", window_start: "2026-09-12T00:00:00Z", window_end: "2026-09-15T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /implementation-windows"
              payload: { acquirer_id: "${acq_id}", rate_program_version_id: "${rpv_id}", platform_id: "${plat_id}", window_start: "2026-09-14T00:00:00Z", window_end: "2026-09-18T00:00:00Z" }
              as: NetworkAdmin
              captures: { w3_id: $.data.id }
            - call: "POST /implementation-windows"
              payload: { acquirer_id: "${acq_id}", rate_program_version_id: "${rpv_id}", platform_id: "${plat_id}", window_start: "2026-09-08T00:00:00Z", window_end: "2026-10-05T00:00:00Z" }
              as: NetworkAdmin
          assert:
            - "the first trigger call returns HTTP status 201 and data.status == SCHEDULED"
            - "the second trigger call returns HTTP status 409 and data.error_id == ERR_PLATFORM_WINDOW_CONFLICT"
            - "the third trigger call returns HTTP status 201 and data.status == SCHEDULED"
            - "the fourth trigger call returns HTTP status 422 and data.error_id == ERR_IMPLEMENTATION_WINDOW_OUT_OF_BOUNDS"
            - "the fourth trigger call does NOT return ERR_PLATFORM_WINDOW_CONFLICT even though it also collides with ${w1_id}"
            - "AcquirerImplementationWindow.${w1_id}.status == SCHEDULED"
            - "AcquirerImplementationWindow.${w3_id}.window_start == 2026-09-14T00:00:00.000Z"
            - "GET /implementation-windows filtered by platform_id ${plat_id} returns exactly 2 rows"

  - rule_id: compensating_invariant
    instances:
      - name: compensating_invariant_incentive_capacity_pool_conserved_across_withdraw
        grounds:
          - calculations.incentive_capacity_ledger_invariant
          - state_machines.IncentiveEnrollment.PENDING_to_ENROLLED
          - state_machines.IncentiveEnrollment.ENROLLED_to_WITHDRAWN
          - entities.IncentiveProgram.fields.uncommitted_capacity_cents
          - entities.IncentiveProgram.fields.enrolled_count
        distinguishing_aspect: |
          CONSERVED QUANTITY 1 of 2 — a RESERVATION pool, not money. total_capacity_cents must
          always equal uncommitted_capacity_cents plus the sum of committed_volume_cents over
          {ENROLLED, PROBATION} rows. Two debits followed by one compensating credit must land the
          pool exactly back on 80000000 with enrolled_count 1, and the WITHDRAWN row must stop
          contributing to the sum entirely.
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform; one US/USD acquirer; MCC 5411."
            - "Incentive program with total_capacity_cents 100000000, min_commitment_cents 5000000, reopen_threshold_cents 5000000, eligible_mcc_codes [\"5411\"]."
            - "Two VERIFIED grocery merchants A and B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5411", description: "Grocery Stores", business_type_key: "GROCERY", program_eligibility: ["SMALL_TICKET"], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /incentive-programs"
              payload: { program_name: "Pool Conservation 2026", eligible_mcc_codes: ["5411"], total_capacity_cents: 100000000, min_commitment_cents: 5000000, reopen_threshold_cents: 5000000, performance_threshold_pct: 80.00 }
              as: NetworkAdmin
              captures: { ip_id: $.data.id, ip_v0: $.data.version, ip_cap0: $.data.uncommitted_capacity_cents }
            - call: "POST /merchants"
              payload: { legal_name: "Grocer A", business_type_key: "GROCERY", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_a_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "Grocer B", business_type_key: "GROCERY", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_b_id: $.data.id }
          trigger:
            - call: "POST /incentive-enrollments"
              payload: { incentive_program_id: "${ip_id}", merchant_id: "${mer_a_id}", committed_volume_cents: 30000000, waitlist_requested: false, expected_incentive_program_version: "${ip_v0}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { enr_a_id: $.data.id }
            - call: "GET /incentive-programs/${ip_id}"
              payload: {}
              as: NetworkAdmin
              captures: { ip_v1: $.data.version, ip_cap1: $.data.uncommitted_capacity_cents }
            - call: "POST /incentive-enrollments"
              payload: { incentive_program_id: "${ip_id}", merchant_id: "${mer_b_id}", committed_volume_cents: 20000000, waitlist_requested: false, expected_incentive_program_version: "${ip_v1}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { enr_b_id: $.data.id }
            - call: "GET /incentive-programs/${ip_id}"
              payload: {}
              as: NetworkAdmin
              captures: { ip_cap2: $.data.uncommitted_capacity_cents }
            - call: "POST /incentive-enrollments/${enr_a_id}/withdraw"
              payload: { withdrawal_reason: "Merchant exited the program voluntarily" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
          assert:
            - "${ip_cap0} == 100000000"
            - "${ip_cap1} == 70000000"
            - "${ip_cap2} == 50000000"
            - "IncentiveEnrollment.${enr_a_id}.status == WITHDRAWN"
            - "IncentiveEnrollment.${enr_a_id}.withdrawal_reason == Merchant exited the program voluntarily"
            - "IncentiveEnrollment.${enr_a_id}.committed_volume_cents == 30000000"
            - "IncentiveEnrollment.${enr_b_id}.status == ENROLLED"
            - "IncentiveProgram.${ip_id}.uncommitted_capacity_cents == 80000000"
            - "IncentiveProgram.${ip_id}.enrolled_count == 1"
            - "IncentiveProgram.${ip_id}.enrollment_state == OPEN"
            - "IncentiveProgram.${ip_id}.total_capacity_cents == 100000000 and equals uncommitted_capacity_cents 80000000 plus the single ENROLLED commitment 20000000 (zero drift)"

      - name: compensating_invariant_assessment_ledger_zeroed_by_clearing_reversal
        grounds:
          - calculations.merchant_assessment_ledger_invariant
          - calculations.merchant_downgrade_counter
          - calculations.batch_assessment_total
          - state_machines.TransactionRecord.DOWNGRADED_to_REVERSED
          - entities.Merchant.fields.lifetime_net_assessed_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY 2 of 2 — MONEY, and it reconciles across TWO aggregates plus a COUNTER
          at once. A CLEARING_REVERSAL must zero the record's assessed_interchange_cents, drop the
          batch total from 80 to 40, drop Merchant.lifetime_net_assessed_cents from 80 to 40 and
          drop downgrade_count_current_quarter from 2 to 1 — the reversed row leaves the
          {QUALIFIED, DOWNGRADED} input set of all three derivations simultaneously. A cached
          decrement that forgets any one of the three breaks the equality.
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform; one COMPLIANT US/USD acquirer; MCC 5411."
            - "CPS_RETAIL, SMALL_TICKET and STANDARD rate programs."
            - "One VERIFIED grocery merchant."
            - "One FINALIZED batch dated 2026-09-02 (same quarter Q3 as the clock) holding two 1200-cent records that each carry only [\"AUTH_CODE\"], so each was downgraded to STANDARD for 40 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5411", description: "Grocery Stores", business_type_key: "GROCERY", program_eligibility: ["SMALL_TICKET"], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "CPS_RETAIL_STD", name: "CPS Retail", category: "CPS_RETAIL", eligible_mcc_codes: ["5411"], base_rate_bps: 145, per_item_fee_cents: 10, requires_data_elements: ["AUTH_CODE", "TERMINAL_ID", "TRANSACTION_DATE", "CARDHOLDER_ZIP"], max_clearing_delay_hours: 24 }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "SMALL_TICKET_STD", name: "Small Ticket", category: "SMALL_TICKET", eligible_mcc_codes: ["5411"], base_rate_bps: 165, per_item_fee_cents: 4, requires_data_elements: ["AUTH_CODE", "TERMINAL_ID"], max_clearing_delay_hours: 48 }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "STANDARD_FALLBACK", name: "Standard", category: "STANDARD", eligible_mcc_codes: ["5411", "4900", "7995", "8398", "9399"], base_rate_bps: 254, per_item_fee_cents: 10, requires_data_elements: [], max_clearing_delay_hours: 720 }
              as: NetworkAdmin
              captures: { std_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "Corner Grocer", business_type_key: "GROCERY", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_id: $.data.id }
            - call: "POST /settlement-batches"
              payload: { acquirer_id: "${acq_id}", batch_date: "2026-09-02", currency_code: "USD" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { batch_id: $.data.id, batch_v0: $.data.version }
            - call: "POST /settlement-batches/${batch_id}/transaction-records"
              payload: { merchant_id: "${mer_id}", amount_cents: 1200, transaction_currency: "USD", auth_code: "A00101", auth_timestamp: "2026-09-02T00:00:00Z", clearing_timestamp: "2026-09-02T01:00:00Z", data_elements: ["AUTH_CODE"], expected_batch_version: "${batch_v0}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { rec1_id: $.data.id }
            - call: "GET /settlement-batches/${batch_id}"
              payload: {}
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { batch_v1: $.data.version }
            - call: "POST /settlement-batches/${batch_id}/transaction-records"
              payload: { merchant_id: "${mer_id}", amount_cents: 1200, transaction_currency: "USD", auth_code: "A00102", auth_timestamp: "2026-09-02T00:00:00Z", clearing_timestamp: "2026-09-02T01:00:00Z", data_elements: ["AUTH_CODE"], expected_batch_version: "${batch_v1}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { rec2_id: $.data.id }
            - call: "POST /settlement-batches/${batch_id}/submit"
              payload: {}
              as: AcquirerOps
              as_user_id: "${acq_id}"
            - call: "POST /settlement-batches/${batch_id}/finalize"
              payload: {}
              as: NetworkAdmin
              captures: { batch_total_before: $.data.total_assessed_cents }
            - call: "GET /merchants/${mer_id}"
              payload: {}
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_lifetime_before: $.data.lifetime_net_assessed_cents, mer_dg_before: $.data.downgrade_count_current_quarter }
          trigger:
            - call: "POST /transaction-records/${rec2_id}/reverse"
              payload: { reversal_type: "CLEARING_REVERSAL", reversal_reason: "Cardholder dispute resolved in favour of the cardholder" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
          assert:
            - "${batch_total_before} == 80"
            - "${mer_lifetime_before} == 80"
            - "${mer_dg_before} == 2"
            - "TransactionRecord.${rec1_id}.qualified_rate_program_id == ${std_id}"
            - "TransactionRecord.${rec1_id}.assessed_interchange_cents == 40"
            - "TransactionRecord.${rec1_id}.qualification_status == DOWNGRADED"
            - "TransactionRecord.${rec2_id}.qualification_status == REVERSED"
            - "TransactionRecord.${rec2_id}.reversal_type == CLEARING_REVERSAL"
            - "TransactionRecord.${rec2_id}.assessed_interchange_cents == 0"
            - "SettlementBatch.${batch_id}.total_assessed_cents == 40"
            - "Merchant.${mer_id}.lifetime_net_assessed_cents == 40"
            - "Merchant.${mer_id}.downgrade_count_current_quarter == 1"
