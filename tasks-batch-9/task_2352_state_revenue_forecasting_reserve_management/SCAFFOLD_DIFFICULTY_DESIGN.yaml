  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # Two DIFFERENT entities, two different non-linear shapes: a re-entrant cycle
  # on ConsensusRound.status and a branching fork-join on WithdrawalRequest.status.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: consensus_round_reenters_disputed_from_compared_then_returns
        grounds:
          - state_machines.ConsensusRound.COMPARED_to_DISPUTED
          - state_machines.ConsensusRound.DISPUTED_to_COMPARED
          - state_machines.ConsensusRound.OPEN_to_COMPARED
          - calculations.consensus_variance
          - endpoints[POST /one-time-items/{id}/void]
        distinguishing_aspect: |
          The non-linearity on ConsensusRound.status is a genuine re-entrant cycle
          OPEN -> COMPARED -> DISPUTED -> COMPARED driven from outside the round: voiding the CGT
          one-time item shrinks the per-source midpoint denominator from 344909589 to 332909589, so
          the unchanged 5100000-cent gap crosses per_source_tolerance_bps 150 (148 -> 153) and the
          round falls back to DISPUTED, then documenting the single disagreement returns it to
          COMPARED with reconciled_total_cents 1587866273 — a state the round had already left once.
        test_recipe:
          setup:
            - "FY2027 cycle IN_CONSENSUS with round 1 COMPARED at variance_bps 82: PIT gap 8000000 (64 bps) and CGT gap 5100000 (148 bps), both inside the 150 bps per-source tolerance."
            - "The CGT estimates of both bodies include the ACTIVE one-time item of 12000000."
            - "No round has been ratified, so every SourceEstimate still has locked == false."
          setup_api_calls:
            - call: "POST /revenue-sources"
              payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }
