            # ---- Petition Q (CA-02): fully cleared, schedules the occupying hearing on courtroom X ----
            - { call: "POST /expungement/petitioners", payload: { full_name: "Quin Ro", date_of_birth: "1981-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { pq: "$.data.id" } }
