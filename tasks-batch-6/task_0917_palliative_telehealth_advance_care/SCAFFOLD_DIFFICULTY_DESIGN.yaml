scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 - dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: referral_triage_variant_diverges_by_referral_source
        grounds:
          - calculations.referral_triage_score
          - entities.Referral.fields.triage_variant
          - entities.Referral.fields.triage_score
          - endpoints["POST /palliative/referrals"]
        distinguishing_aspect: |
          This instance lives in the Referral intake domain: two referrals with
          identical prognosis_months and serious_illness_criteria_count score 90
          under the PAYER_SOURCED variant and 84 under the CLINICIAN_SOURCED
          variant, because the source weight is replaced by a doubled criteria
          multiplier and a halved per-month prognosis rate.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Patient in program_status REFERRED."
            - "Two Referral rows on that patient with prognosis_months 6 and serious_illness_criteria_count 3, differing only in source."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-1001", full_name: "Ada Kessler", date_of_birth: "1948-03-11", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_hd_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "ONCOLOGY", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_on_id: $.data.id }
          assert:
            - "Referral.${ref_hd_id}.triage_variant == PAYER_SOURCED"
            - "Referral.${ref_hd_id}.triage_score == 90"
            - "Referral.${ref_on_id}.triage_variant == CLINICIAN_SOURCED"
            - "Referral.${ref_on_id}.triage_score == 84"
            - "Referral.${ref_hd_id}.triage_score != Referral.${ref_on_id}.triage_score"

      - name: claim_allowed_amount_diverges_by_telehealth_modality
        grounds:
          - calculations.claim_allowed_amount_cents
          - calculations.acp_billable_units
          - entities.AcpBillingClaim.fields.allowed_amount_cents
          - entities.AcpBillingClaim.fields.modifier_code
          - endpoints["POST /palliative/claims"]
        distinguishing_aspect: |
          This instance lives in the AcpBillingClaim revenue-cycle domain, a
          different entity domain from the Referral triage instance: two claims
          with identical documented_minutes of 46 yield allowed_amount_cents
          13685 under the TELEHEALTH variant and 16100 under IN_PERSON, and only
          the TELEHEALTH row carries modifier_code "95".
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Patient in program_status ACTIVE with acp_paid_cents_ytd 0."
            - "No HospiceElection exists, so the concurrent-care rung cannot fire."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-1002", full_name: "Bo Ferraro", date_of_birth: "1951-07-04", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
          trigger:
            - call: "POST /palliative/claims"
              payload: { patient_id: "${p_id}", service_date: "2026-06-01T13:00:00Z", documented_minutes: 46, modality: "TELEHEALTH" }
              as: BillingSpecialist
              as_user_id: "u_billing_1"
              captures: { claim_th_id: $.data.id }
            - call: "POST /palliative/claims"
              payload: { patient_id: "${p_id}", service_date: "2026-06-01T15:00:00Z", documented_minutes: 46, modality: "IN_PERSON" }
              as: BillingSpecialist
              as_user_id: "u_billing_1"
              captures: { claim_ip_id: $.data.id }
          assert:
            - "AcpBillingClaim.${claim_th_id}.billable_units == 2"
            - "AcpBillingClaim.${claim_th_id}.allowed_amount_cents == 13685"
            - "AcpBillingClaim.${claim_th_id}.modifier_code == 95"
            - "AcpBillingClaim.${claim_ip_id}.billable_units == 2"
            - "AcpBillingClaim.${claim_ip_id}.allowed_amount_cents == 16100"
            - "AcpBillingClaim.${claim_ip_id}.modifier_code is null"

  # =========================================================================
  # Rule 2 - combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: breakthrough_dose_pins_round_per_order_then_sum
        grounds:
          - calculations.breakthrough_dose_mg
          - calculations.medication_daily_mme
          - entities.MedicationOrder.fields.breakthrough_dose_mg
          - entities.Patient.fields.active_daily_mme
          - endpoints["POST /palliative/medication-orders/{id}/attestations"]
        distinguishing_aspect: |
          MODE (b) - nested rounding where the order matters. The patient is
          OPIOID_NAIVE, so order A rounds 3.75 to 3.8 and order B rounds 61.875
          to 61.9. The pinned order (round per order, then sum, then take 15 per
          cent, then round once) gives 65.7 * 0.15 = 9.855 -> 9.9 mg, while the
          rejected order (sum the unrounded 65.625 first) gives 9.84375 -> 9.8
          mg. The two orders of operation produce different milligrams.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Patient in program_status ACTIVE with opioid_status OPIOID_NAIVE and active_daily_mme 0."
            - "Two MedicationOrder rows prescribed by u_physician_1 and verified by u_nurse_1, both ACTIVE, both with breakthrough_drug MORPHINE_PO."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-1003", full_name: "Cara Nwosu", date_of_birth: "1955-01-22", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_NAIVE" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/medication-orders"
              payload: { patient_id: "${p_id}", drug: "MORPHINE_PO", dose_amount: 5, days_supply: 30, breakthrough_drug: "MORPHINE_PO" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
              captures: { mo_a_id: $.data.id }
            - call: "POST /palliative/medication-orders/${mo_a_id}/attestations"
              payload: { attestation_type: "VERIFICATION", attestation_note: "dose and route checked" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/medication-orders"
              payload: { patient_id: "${p_id}", drug: "OXYCODONE_PO", dose_amount: 55, days_supply: 30, breakthrough_drug: "MORPHINE_PO" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
              captures: { mo_b_id: $.data.id }
          trigger:
            - call: "POST /palliative/medication-orders/${mo_b_id}/attestations"
              payload: { attestation_type: "VERIFICATION", attestation_note: "second clinician check" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
          assert:
            - "MedicationOrder.${mo_a_id}.mme_daily == 3.8"
            - "MedicationOrder.${mo_b_id}.mme_daily == 61.9"
            - "MedicationOrder.${mo_b_id}.mme_variant == NAIVE"
            - "Patient.${p_id}.active_daily_mme == 65.7"
            - "MedicationOrder.${mo_b_id}.breakthrough_dose_mg == 9.9"
            - "MedicationOrder.${mo_a_id}.breakthrough_dose_mg == 9.9"
            - "MedicationOrder.${mo_b_id}.breakthrough_dose_mg != 9.8"

      - name: claim_net_payable_pins_coinsurance_tier_after_annual_cap
        grounds:
          - calculations.claim_net_payable_cents
          - calculations.claim_allowed_amount_cents
          - entities.AcpBillingClaim.fields.coinsurance_pct
          - entities.AcpBillingClaim.fields.net_payable_cents
          - entities.Patient.fields.acp_paid_cents_ytd
        distinguishing_aspect: |
          MODE (c) - circular-looking dependency with a pinned evaluation order,
          a different mode from the breakthrough-dose rounding instance. The
          coinsurance tier is keyed on the very allowed amount the annual cap
          reduces. With acp_paid_cents_ytd at 32000 the rated 13685 is capped to
          8000, which drops the tier to COINSURANCE_PCT_LOW and yields
          net_payable_cents 7200; reading the tier off the uncapped 13685 would
          give COINSURANCE_PCT_HIGH and 6400 instead.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Patient in program_status ACTIVE."
            - "A first IN_PERSON claim of 106 documented minutes has been created, attested, submitted and PAID, driving Patient.acp_paid_cents_ytd to 24880."
            - "A second IN_PERSON claim of 16 documented minutes has been created, attested, submitted and PAID, driving Patient.acp_paid_cents_ytd to 32620."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-1004", full_name: "Dov Ramirez", date_of_birth: "1946-11-09", jurisdiction_code: "JUR_NOTARY", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/claims"
              payload: { patient_id: "${p_id}", service_date: "2026-06-01T09:00:00Z", documented_minutes: 106, modality: "IN_PERSON" }
              as: BillingSpecialist
              as_user_id: "u_billing_1"
              captures: { claim_1_id: $.data.id }
            - call: "POST /palliative/claims/${claim_1_id}/attest"
              payload: { attestation_statement: "time and content documented" }
              as: BillingSpecialist
              as_user_id: "u_billing_1"
            - call: "POST /palliative/claims/${claim_1_id}/submit"
              payload: {}
              as: BillingSpecialist
              as_user_id: "u_billing_1"
            - call: "POST /palliative/claims/${claim_1_id}/adjudicate"
              payload: { outcome: "PAID" }
              as: ProgramAdmin
            - call: "POST /palliative/claims"
              payload: { patient_id: "${p_id}", service_date: "2026-06-01T11:00:00Z", documented_minutes: 16, modality: "IN_PERSON" }
              as: BillingSpecialist
              as_user_id: "u_billing_1"
              captures: { claim_2_id: $.data.id }
            - call: "POST /palliative/claims/${claim_2_id}/attest"
              payload: { attestation_statement: "time and content documented" }
              as: BillingSpecialist
              as_user_id: "u_billing_1"
            - call: "POST /palliative/claims/${claim_2_id}/submit"
              payload: {}
              as: BillingSpecialist
              as_user_id: "u_billing_1"
            - call: "POST /palliative/claims/${claim_2_id}/adjudicate"
              payload: { outcome: "PAID" }
              as: ProgramAdmin
          trigger:
            - call: "POST /palliative/claims"
              payload: { patient_id: "${p_id}", service_date: "2026-06-01T14:00:00Z", documented_minutes: 46, modality: "TELEHEALTH" }
              as: BillingSpecialist
              as_user_id: "u_billing_1"
              captures: { claim_3_id: $.data.id }
          assert:
            - "AcpBillingClaim.${claim_1_id}.net_payable_cents == 24880"
            - "AcpBillingClaim.${claim_2_id}.net_payable_cents == 7740"
            - "Patient.${p_id}.acp_paid_cents_ytd == 32620"
            - "AcpBillingClaim.${claim_3_id}.billable_units == 2"
            - "AcpBillingClaim.${claim_3_id}.allowed_amount_cents == 7380"
            - "AcpBillingClaim.${claim_3_id}.coinsurance_pct == 0.1"
            - "AcpBillingClaim.${claim_3_id}.patient_responsibility_cents == 738"
            - "AcpBillingClaim.${claim_3_id}.net_payable_cents == 6642"

  # =========================================================================
  # Rule 3 - non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: symptom_assessment_triage_and_escalation_axes_advance_independently
        grounds:
          - state_machines.SymptomAssessment.OPEN_to_ACKNOWLEDGED
          - state_machines.SymptomAssessment.NONE_to_ESCALATED
          - state_machines.SymptomAssessment.ESCALATED_to_DISPOSITIONED
          - state_machines.SymptomAssessment.ACKNOWLEDGED_to_RESOLVED
          - entities.SymptomAssessment.fields.triage_status
          - entities.SymptomAssessment.fields.escalation_status
        distinguishing_aspect: |
          PARALLEL shape on the SymptomAssessment entity: triage_status and
          escalation_status are two axes on the same row that move
          independently. The row is observed at ACKNOWLEDGED/NONE, then
          ACKNOWLEDGED/ESCALATED, then ACKNOWLEDGED/DISPOSITIONED, then
          RESOLVED/DISPOSITIONED - four distinct combined states that a single
          linear machine could not express.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Patient in program_status ACTIVE with one ACTIVE CarePlan."
            - "One SymptomAssessment on that plan with triage_status OPEN and escalation_status NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-1005", full_name: "Elin Vasquez", date_of_birth: "1943-02-17", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/care-plans"
              payload: { patient_id: "${p_id}", plan_title: "Dyspnea and pain plan", problem_list: ["pain", "dyspnea"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { cp_id: $.data.id }
            - call: "POST /palliative/care-plans/${cp_id}/activate"
              payload: {}
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/symptom-assessments"
              payload: { patient_id: "${p_id}", care_plan_id: "${cp_id}", reporter_type: "SELF", item_pain: 6, item_dyspnea: 6, item_nausea: 6, item_anxiety: 6, item_fatigue: 6 }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /palliative/symptom-assessments/${sa_id}/triage-update"
              payload: { action: "ACKNOWLEDGE", triage_note: "nurse reviewed" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/escalations"
              payload: { patient_id: "${p_id}", symptom_assessment_id: "${sa_id}", contact_summary: "family called overnight about breathlessness" }
              as: OnCallClinician
              as_user_id: "u_oncall_1"
              captures: { esc_id: $.data.id }
            - call: "POST /palliative/escalations/${esc_id}/response"
              payload: { response_type: "ACKNOWLEDGE" }
              as: OnCallClinician
              as_user_id: "u_oncall_1"
            - call: "POST /palliative/escalations/${esc_id}/response"
              payload: { response_type: "DISPOSITION", disposition: "URGENT_TELEHEALTH_VISIT" }
              as: OnCallClinician
              as_user_id: "u_oncall_1"
            - call: "POST /palliative/symptom-assessments/${sa_id}/triage-update"
              payload: { action: "RESOLVE", triage_note: "symptom controlled after visit" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
          assert:
            - "SymptomAssessment.${sa_id}.distress_score == 60"
            - "SymptomAssessment.${sa_id}.severity_tier == MODERATE"
            - "SymptomAssessment.${sa_id}.triage_status == RESOLVED"
            - "SymptomAssessment.${sa_id}.escalation_status == DISPOSITIONED"
            - "SymptomAssessment.${sa_id}.resolution_reason == ESCALATION_DISPOSITIONED"
            - "OnCallEscalation.${esc_id}.status == CLOSED"
            - "OnCallEscalation.${esc_id}.disposition == URGENT_TELEHEALTH_VISIT"
            - "Patient.${p_id}.open_symptom_count == 0"

      - name: hospice_election_revoke_then_reelect_completes_the_cycle
        grounds:
          - state_machines.HospiceElection.ELECTED_to_REVOKED
          - state_machines.HospiceElection.REVOKED_to_PENDING_CERT
          - state_machines.HospiceElection.PENDING_CERT_to_CERTIFIED
          - state_machines.HospiceElection.ELECTED_to_ELECTED
          - calculations.hospice_benefit_period_schedule
          - entities.HospiceElection.fields.revocation_count
        distinguishing_aspect: |
          CYCLIC shape on the HospiceElection entity, a different entity from
          the parallel SymptomAssessment instance: the row walks
          PENDING_CERT -> CERTIFIED -> ELECTED -> REVOKED -> PENDING_CERT ->
          CERTIFIED -> ELECTED, and the benefit-period counter continues across
          the cycle so the post-revocation period is number 2 at 90 days rather
          than restarting at number 1.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-02T09:00:00Z."
            - "One Patient in program_status ACTIVE."
            - "One CareConference with conference_type IDT in status ATTESTED, held at 2026-06-02T09:00:00Z with all four disciplines attested, so IDT cadence is satisfied."
            - "One HospiceElection in status CERTIFIED with certification_count 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-1006", full_name: "Faye Okonkwo", date_of_birth: "1940-05-30", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/conferences"
              payload: { patient_id: "${p_id}", conference_type: "IDT", modality: "TELEHEALTH", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z" }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { conf_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/conferences/${conf_id}/hold"
              payload: { documented_minutes: 46, disciplines_present: ["PHYSICIAN", "NURSE", "SOCIAL_WORKER", "CHAPLAIN"] }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "POST /palliative/conferences/${conf_id}/attestations"
              payload: { discipline: "PHYSICIAN", note_text: "goals reviewed" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
            - call: "POST /palliative/conferences/${conf_id}/attestations"
              payload: { discipline: "NURSE", note_text: "symptom burden reviewed" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/conferences/${conf_id}/attestations"
              payload: { discipline: "SOCIAL_WORKER", note_text: "psychosocial needs reviewed" }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "POST /palliative/conferences/${conf_id}/attestations"
              payload: { discipline: "CHAPLAIN", note_text: "spiritual care reviewed" }
              as: Chaplain
              as_user_id: "u_chaplain_1"
            - call: "POST /palliative/hospice-elections"
              payload: { patient_id: "${p_id}", concurrent_care_carve_out: false }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
              captures: { he_id: $.data.id }
            - call: "POST /palliative/hospice-elections/${he_id}/certifications"
              payload: { terminal_diagnosis_code: "C34.90" }
              as: PalliativePhysician
