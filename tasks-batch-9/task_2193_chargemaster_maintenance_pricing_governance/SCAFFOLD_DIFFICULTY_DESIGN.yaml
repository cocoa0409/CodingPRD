      - call: POST /chargemaster/payer-contracts
        payload:
          facility_id: ${fac_id}
          payer_code: BCBS_STATE
          product_line: COMMERCIAL
          reimbursement_method: PERCENT_OF_CHARGE
          percent_of_charge_bp: 4500
          term_start_date: '2026-01-01T00:00:00Z'
          term_end_date: '2026-06-30T00:00:00Z'
          trailing_units: 40
          renegotiation_notice_days: 30
        as: ContractManager
        as_user_id: contract_mgr_1
        captures:
          c1_id: $.data.id
      trigger:
      - call: POST /chargemaster/payer-contracts
        payload:
          facility_id: ${fac_id}
          payer_code: BCBS_STATE
          product_line: COMMERCIAL
          reimbursement_method: PERCENT_OF_CHARGE
          percent_of_charge_bp: 4700
          term_start_date: '2026-06-30T00:00:00Z'
          term_end_date: '2026-12-31T00:00:00Z'
          renegotiation_notice_days: 30
        as: ContractManager
        as_user_id: contract_mgr_1
      - call: POST /chargemaster/payer-contracts
        payload:
          facility_id: ${fac_id}
          payer_code: BCBS_STATE
          product_line: COMMERCIAL
          reimbursement_method: PERCENT_OF_CHARGE
          percent_of_charge_bp: 4700
          term_start_date: '2026-07-30T00:00:00Z'
          term_end_date: '2026-12-31T00:00:00Z'
          renegotiation_notice_days: 30
        as: ContractManager
        as_user_id: contract_mgr_1
      - call: POST /chargemaster/payer-contracts
        payload:
          facility_id: ${fac_id}
          payer_code: BCBS_STATE
          product_line: COMMERCIAL
          reimbursement_method: PERCENT_OF_CHARGE
          percent_of_charge_bp: 4700
          term_start_date: '2026-07-31T00:00:00Z'
          term_end_date: '2026-12-31T00:00:00Z'
          renegotiation_notice_days: 30
        as: ContractManager
        as_user_id: contract_mgr_1
        captures:
          c2_id: $.data.id
      assert:
      - trigger step 1 response.http_status == 409
      - trigger step 1 response.error.error_id == ERR_CONTRACT_TERM_OVERLAP
      - trigger step 2 response.http_status == 409
      - trigger step 2 response.error.error_id == ERR_CONTRACT_TERM_BUFFER_VIOLATION
      - trigger step 3 response.http_status == 201 (gap of 31 days is STRICTLY greater than renegotiation_notice_days = 30)
      - PayerContract.${c2_id}.term_start_date == 2026-07-31T00:00:00Z
      - PayerContract.${c2_id}.status == ACTIVE
      - PayerContract.${c1_id}.status == ACTIVE
      - PayerContract.${c1_id}.term_end_date == 2026-06-30T00:00:00Z
      - GET /chargemaster/payer-contracts?facility_id=${fac_id}&payer_code=BCBS_STATE&product_line=COMMERCIAL returns exactly 2 rows
  - name: resource_temporal_overlap__batch_window_aggregate_capacity_third_cover_on_single_day
    grounds:
    - validations[priority=37]
    - entities.ChargeCaptureBatch.fields.window_start_date
    - entities.ChargeCaptureBatch.fields.window_end_date
    - entities.ChargeCaptureBatch.fields.status
    distinguishing_aspect: 'ChargeCaptureBatch occupation on the Department resource uses AGGREGATE-CAPACITY interval

      semantics with a per-calendar-day multiplicity limit of 2 rather than pairwise mutual

      exclusion, so a third non-CLOSED batch covering 2026-08-07 is rejected with

      ERR_BATCH_WINDOW_CAPACITY_EXCEEDED while a batch overlapping only a day at multiplicity 1

      (2026-08-08) is accepted — pairwise-overlap arithmetic would have rejected both.

      '
    test_recipe:
      setup:
      - Logical clock pinned at 2026-08-01T00:00:00Z.
      - One OPEN facility with one department (capture_hold false) managed by dept_mgr_1.
      - 'Two INGESTED ChargeCaptureBatch rows for that department: B1 covering closed [2026-08-03, 2026-08-07] and B2 covering closed [2026-08-05, 2026-08-10]; days 08-05..08-07 therefore sit at multiplicity
        2 and 08-08..08-10 at multiplicity 1.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemAdmin
        as_user_id: sysadmin_1
      - call: POST /chargemaster/facilities
        payload:
          name: St Vitus Medical Center
          cms_certification_number: CCN-2193-CAPACITY
          rounding_mode: NEAREST_DOLLAR
        as: SystemAdmin
        as_user_id: sysadmin_1
        captures:
