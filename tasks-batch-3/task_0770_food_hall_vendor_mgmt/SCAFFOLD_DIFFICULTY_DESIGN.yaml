            - call: "POST /leases"
              payload: { stall_id: "${st}", vendor_id: "${v}", start_date: "2026-06-01", end_date: "2026-12-31", base_rent_cents: 200000, percentage_rate: 0.08, natural_breakpoint_cents: 5000000, rent_cap_cents: 100000000, security_deposit_cents: 100000 }
              as: HallManager
              captures: { ls: $.data.id }
            - call: "POST /leases/${ls}/activate"
              payload: {}
              as: HallManager
            - call: "POST /orders"
              payload: { food_hall_id: "${fh}", stall_id: "${st}", gross_amount_cents: 1500, item_count: 1 }
              as: POSOperator
              captures: { o1: $.data.id }
            - call: "POST /seating-allocations"
              payload: { food_hall_id: "${fh}", order_id: "${o1}", seats: 4, start_time: "2026-06-15T18:00:00Z", end_time: "2026-06-15T20:00:00Z" }
              as: POSOperator
              captures: { sa1: $.data.id }
            - call: "POST /inspections"
              payload: { stall_id: "${st}", scheduled_for: "2026-06-15T19:00:00Z" }
              as: HealthInspector
              captures: { insp: $.data.id }
          trigger:
            - call: "POST /inspections/${insp}/conduct"
              payload: { score: 50 }
              as: HealthInspector
              captures: { insp_result: $.data.result }
          assert:
            - "Inspection.${insp}.result == FAIL"
            - "HealthPermit.${pm}.status == SUSPENDED"
            - "Stall.${st}.operational_posture == SUSPENDED"
            - "Order.${o1}.status == REJECTED"
            - "SeatingAllocation.${sa1}.status == RELEASED"

      - name: vendor_suspension_cascade
        grounds:
          - state_machines.Vendor.ACTIVE_to_SUSPENDED
          - state_machines.Order.ROUTED_to_REJECTED
          - state_machines.SeatingAllocation.RESERVED_to_RELEASED
        distinguishing_aspect: "Depth-3 chain from a Vendor suspend (a different trigger than the inspection cascade): vendor ACTIVE->SUSPENDED -> its stall posture SUSPENDED -> ROUTED order REJECTED -> linked seating RELEASED."
        test_recipe:
          setup:
            - "Open stall with active vendor, a ROUTED order o1 and a RESERVED seating sa1 linked to o1."
          setup_api_calls:
