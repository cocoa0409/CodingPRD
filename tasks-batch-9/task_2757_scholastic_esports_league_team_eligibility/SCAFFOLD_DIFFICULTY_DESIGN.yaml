              as: Coach
              as_user_id: "${c_a_id}"
              captures: { tm_a_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_b_id}", name: "Bravo" }
              as: Coach
              as_user_id: "${c_b_id}"
              captures: { tm_b_id: $.data.id }
            - call: "POST /matches"
              payload: { season_id: "${se_id}", home_team_id: "${tm_a_id}", away_team_id: "${tm_b_id}", scheduled_start_at: "2026-09-25T18:00:00.000Z" }
              as: LeagueAdmin
              captures: { m_id: $.data.id }
            - call: "POST /matches/${m_id}/forfeit"
              payload: { forfeiting_team_id: "${tm_b_id}", reason_note: "no show" }
              as: LeagueAdmin
            - call: "POST /matches/${m_id}/disputes"
              payload: { filing_team_id: "${tm_a_id}", dispute_reason_code: "SERVER_FAULT", dispute_note: "opponent claims a server outage" }
              as: Coach
