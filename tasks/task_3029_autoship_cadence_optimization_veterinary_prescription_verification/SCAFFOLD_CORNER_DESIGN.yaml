              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "ERR-01", product_name: "Invalid weight pack", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 900 }
              as: PlatformAdmin
              captures: { prod_err1: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Rook", species: "CAT", breed: "Savannah", weight_kg: 5.0, owner_state: "CA" }
