              captures: { dl_after_reverse: $.data.restore_download_gb, txn_after: $.data.transaction_count }
          assert:
            - "${dl_before_reverse} == 624.0 (the completed 600 GB restore was charged the metered egress, not the protected one)"
            - "RestoreRequest.${rr_r_id}.state == REVERSED"
            - "${dl_after_reverse} == 0.0 (the reversal subtracted exactly RestoreRequest.egress_gb)"
            - "${dl_before_reverse} - ${dl_after_reverse} == 624.0"
            - "${txn_after} == 0"

      - name: shipment_close_conserves_the_deposit_ledger
        grounds:
          - state_machines.DriveShipment.RETURNED_to_CLOSED
          - calculations.deposit_conservation
          - entities.Account.fields.deposit_held_cents
          - entities.DriveShipment.fields.was_delinquent
        distinguishing_aspect: "The deposit ledger is conserved in cents rather than GB: shipping adds drive_count * deposit_fee_cents, closing releases exactly that refundable amount while retaining any forfeited late penalty, so a shipment that went delinquent settles at 2500 cents of residual held value rather than zero."
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-09-04T00:00:00Z. BUSINESS account with a DRIVE_SHIPMENT restore whose shipment was shipped 2026-09-01 with a 14-day window, then returned one day late (clock 2026-09-16), so was_delinquent is true and deposit_held_cents is 5000."
          setup_api_calls:
            - call: "POST /backup-provider/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /backup-provider/accounts"
              payload: { name: "Harbor Business", account_type: "BUSINESS", region: "US_WEST", storage_tier: "BASIC", encryption_key_id: "aes-256-key-biz", usage_gb: 0 }
              as: SystemOperator
              captures: { acct_b_id: $.data.id, acct_b_v0: $.data.version }
            - call: "POST /backup-provider/backup-groups"
              payload: { account_id: "${acct_b_id}", name: "Office Fleet", tier: "STANDARD", retention_days_override: 60 }
              as: SystemOperator
              captures: { grp_b_id: $.data.id }
            - call: "POST /backup-provider/backup-groups/${grp_b_id}/policies"
              payload: { policy_kind: "RETENTION", min_retention_days: 30, max_extended_history_days: 800, min_restore_point_age_hours: 0, require_mfa_for_restore: false, effective_from_utc: "2026-09-01T00:00:00Z" }
              as: RetentionOfficer
            - call: "POST /backup-provider/agents"
              payload: { account_id: "${acct_b_id}", group_id: "${grp_b_id}", hostname: "hq-fileserver", os_type: "LINUX", license_type: "BUSINESS", throttle_month: 202609 }
              as: BackupOperator
              captures: { agt_b_id: $.data.id }
            - call: "POST /backup-provider/agents/${agt_b_id}/activate"
              payload: {}
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets"
              payload: { agent_id: "${agt_b_id}", account_id: "${acct_b_id}", durability_class: "STANDARD" }
              as: BackupOperator
              captures: { set_b_id: $.data.id }
            - call: "POST /backup-provider/backup-sets/${set_b_id}/file-versions"
              payload: { file_path: "/srv/data/d.bin", version_number: 1, operation: "CREATE", size_bytes: 10737418240, content_hash: "sha256-d-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_b_id}/complete-initial"
              payload: {}
              as: BackupOperator
            - call: "POST /backup-provider/restore-requests"
              payload: { account_id: "${acct_b_id}", subject_agent_id: "${agt_b_id}", restore_point_in_utc: "2026-09-03T00:00:00Z", restore_type: "DRIVE_SHIPMENT", requested_file_count: 1, requested_size_gb: 10.0, restore_transaction_count: 0, drive_capacity_gb: 50.0, drive_count: 1, deposit_fee_cents: 5000, expected_account_version: "${acct_b_v0}" }
              as: AccountOwner
              as_user_id: "${acct_b_id}"
              captures: { rr_d_id: $.data.id }
            - call: "POST /backup-provider/restore-requests/${rr_d_id}/validate"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_b_id}"
            - call: "POST /backup-provider/restore-requests/${rr_d_id}/begin"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_b_id}"
            - call: "GET /backup-provider/drive-shipments"
              payload: { restore_request_id: "${rr_d_id}" }
              as: AccountOwner
              as_user_id: "${acct_b_id}"
              captures: { ship_d_id: "$.data[0].id" }
            - call: "POST /backup-provider/drive-shipments/${ship_d_id}/ship"
              payload: {}
              as: SystemOperator
            - call: "POST /backup-provider/drive-shipments/${ship_d_id}/deliver"
              payload: {}
              as: SystemOperator
            - call: "POST /backup-provider/drive-shipments/${ship_d_id}/open-return-window"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_b_id}"
            - call: "POST /backup-provider/_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: SystemOperator
            - call: "POST /backup-provider/drive-shipments/${ship_d_id}/mark-delinquent"
              payload: {}
              as: SystemOperator
            - call: "POST /backup-provider/drive-shipments/${ship_d_id}/receive-return"
              payload: {}
              as: SystemOperator
              captures: { credit_after_return: $.data.return_credit_cents }
            - call: "GET /backup-provider/accounts/${acct_b_id}"
              payload: {}
              as: SystemOperator
              captures: { held_before_close: $.data.deposit_held_cents }
          trigger:
            - call: "POST /backup-provider/drive-shipments/${ship_d_id}/close"
              payload: {}
              as: SystemOperator
              captures: { ship_d_state: $.data.state }
            - call: "GET /backup-provider/accounts/${acct_b_id}"
              payload: {}
              as: SystemOperator
              captures: { held_after_close: $.data.deposit_held_cents }
          assert:
            - "${held_before_close} == 5000 (1 drive at 5000 cents, plus the 2500-cent late penalty held after the delinquent return)"
            - "DriveShipment.${ship_d_id}.was_delinquent == true and return_credit_cents == 2500"
            - "${ship_d_state} == CLOSED"
            - "${held_after_close} == 2500 (the refundable deposit is released, the forfeited penalty is retained)"
            - "${held_before_close} - ${held_after_close} == 2500"