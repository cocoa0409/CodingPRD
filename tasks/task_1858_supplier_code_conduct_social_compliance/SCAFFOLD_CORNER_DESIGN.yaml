            - { call: "POST /suppliers", payload: { legal_name: "November Goods", country_code: "US", sector: "FOOD" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "R Abe", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Site I", country_code: "US", worker_count: 10, processes: ["packing"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
