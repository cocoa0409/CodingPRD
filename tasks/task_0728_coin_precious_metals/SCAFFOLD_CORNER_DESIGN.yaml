scaffold_corner_design:
  # =====================================================================
  # Entities (Table 1)
  # =====================================================================
  - section: entities
    instances:
      - name: create_product_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Product]
        distinguishing_aspect: "POST /api/products with all required fields returns 201 and echoes sku, product_type, metal, and a server-minted id."
        test_recipe:
          setup: ["no prerequisites"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/products"
              payload: { sku: "AG-1OZ", product_type: "BULLION", metal: "SILVER", weight_troy_oz: 1.0, purity: 0.999, min_sell_spread_pct: 0.06, buy_spread_pct: 0.05 }
              as: Trader
              captures: { prod_id: $.data.id }
          assert:
            - "response status == 201"
            - "Product.${prod_id}.sku == \"AG-1OZ\""
            - "Product.${prod_id}.product_type == BULLION"

      - name: get_customer_returns_stored_data
        claim_type: Retrieval
        grounds: [entities.Customer]
        distinguishing_aspect: "GET /api/customers/{id} returns the created customer with matching full_name and counters at 0."
        test_recipe:
          setup: ["a customer exists"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "Read Me" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /api/customers/${cust_id}"
              payload: {}
              as: SalesAgent
          assert:
            - "Customer.${cust_id}.full_name == \"Read Me\""
            - "Customer.${cust_id}.lifetime_buy_payout_cents == 0"
            - "Customer.${cust_id}.store_credit_cents == 0"

      - name: list_inventory_lots_returns_paginated_envelope
        claim_type: Listing
        grounds: [entities.InventoryLot]
        distinguishing_aspect: "GET /api/inventory-lots returns an array envelope with total_count and has_more."
        test_recipe:
          setup: ["one product and one lot exist"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "PT-1OZ", product_type: "BULLION", metal: "PLATINUM", weight_troy_oz: 1.0, purity: 0.9995, min_sell_spread_pct: 0.07, buy_spread_pct: 0.06 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 4, acquisition_unit_cost_cents: 90000 }
              as: Trader
          trigger:
            - call: "GET /api/inventory-lots"
              payload: {}
              as: Trader
          assert:
            - "response envelope contains total_count >= 1"
            - "response envelope contains has_more (boolean)"

      - name: get_product_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/products/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["no product with the queried id exists"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/products/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Trader
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "the response error_id == ERR_NOT_FOUND"

      - name: create_sell_order_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=18]"]
        distinguishing_aspect: "POST /api/sell-orders omitting required quantity returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["a product and a customer exist"]
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-REQ", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "No Qty" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /api/sell-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}" }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_INVALID_REQUEST"

      - name: create_product_defaults_numismatic_premium_zero
        claim_type: Defaults
        grounds: [entities.Product.fields.numismatic_premium_cents]
        distinguishing_aspect: "Omitting numismatic_premium_cents on a BULLION product defaults it to 0; ira_eligible defaults false."
        test_recipe:
          setup: ["no prerequisites"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/products"
              payload: { sku: "AU-DEFAULT", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
          assert:
            - "Product.${prod_id}.numismatic_premium_cents == 0"
            - "Product.${prod_id}.ira_eligible == false"

      - name: inventory_lot_computed_fields_input_ignored
        claim_type: Computed Fields
        grounds: [entities.InventoryLot.fields.available_qty]
        distinguishing_aspect: "available_qty computed = total_qty at creation; reserved_qty/sold_qty = 0; status AVAILABLE."
        test_recipe:
          setup: ["a product exists"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "AU-COMP", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 7, acquisition_unit_cost_cents: 100000 }
              as: Trader
              captures: { lot_id: $.data.id }
          assert:
            - "InventoryLot.${lot_id}.available_qty == 7"
            - "InventoryLot.${lot_id}.reserved_qty == 0"
            - "InventoryLot.${lot_id}.status == AVAILABLE"

      - name: create_product_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=18]"]
        distinguishing_aspect: "POST /api/products with metal outside the enum domain returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["no prerequisites"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/products"
              payload: { sku: "BAD-METAL", product_type: "BULLION", metal: "COPPER", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_INVALID_REQUEST"

      - name: create_ira_account_bad_customer_fk_returns_not_found
        claim_type: Parent Relationships
        grounds: ["errors[ERR_NOT_FOUND]", entities.IRAAccount.fields.customer_id]
        distinguishing_aspect: "POST /api/ira-accounts with a non-existent customer_id FK returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["no customer with the referenced id exists"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/ira-accounts"
              payload: { customer_id: "00000000-0000-0000-0000-000000000000", custodian_name: "Ghost", custodian_account_ref: "G-1" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_NOT_FOUND"

  # =====================================================================
  # Endpoints (Table 5)
  # =====================================================================
  - section: endpoints
    instances:
      - name: system_fields_generated_on_customer_create
        claim_type: Computed read
        grounds: [entities.Customer]
        distinguishing_aspect: "version starts at 1 and created_at is server-stamped on create."
        test_recipe:
          setup: ["no prerequisites"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/customers"
              payload: { full_name: "System Fields" }
              as: SalesAgent
              captures: { cust_id: $.data.id, ver: $.data.version }
          assert:
            - "Customer.${cust_id}.version == 1"
            - "Customer.${cust_id}.created_at is a non-empty ISO 8601 string"

  # =====================================================================
  # State Machines (Table 2)
  # =====================================================================
  - section: state_machines
    instances:
      - name: cancel_sell_order_already_cancelled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SellOrder.PLACED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second cancel on an already-CANCELLED SellOrder returns ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["a placed sell order that has been cancelled once"]
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-SM1", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Cancel Twice" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/sell-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 1 }
              as: SalesAgent
              captures: { so_id: $.data.id }
            - call: "POST /api/sell-orders/${so_id}/cancel"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /api/sell-orders/${so_id}/cancel"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_INVALID_STATE"
            - "SellOrder.${so_id}.status == CANCELLED"

      - name: new_sell_order_starts_in_placed
        claim_type: Initial State
        grounds:
          - state_machines.SellOrder
          - entities.SellOrder.fields.status
        distinguishing_aspect: "A newly created SellOrder starts in the initial_state PLACED."
        test_recipe:
          setup: ["a product and customer exist"]
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-SM2", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Fresh Order" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /api/sell-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 1 }
              as: SalesAgent
              captures: { so_id: $.data.id }
          assert:
            - "SellOrder.${so_id}.status == PLACED"

      - name: close_auction_session_from_closed_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.AuctionSession.SCHEDULED_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Closing an already-CLOSED AuctionSession (terminal) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a scheduled session that has been closed"]
          setup_api_calls:
            - call: "POST /api/auction-sessions"
              payload: { room: "ROOM-SM", scheduled_start: "2026-04-10T10:00:00Z", scheduled_end: "2026-04-10T12:00:00Z" }
              as: SalesAgent
              captures: { sess_id: $.data.id }
            - call: "POST /api/auction-sessions/${sess_id}/close"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /api/auction-sessions/${sess_id}/close"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_INVALID_STATE"

      - name: approve_ira_account_moves_pending_to_active
        claim_type: Valid Transition
        grounds:
          - state_machines.IRAAccount.PENDING_to_ACTIVE
          - entities.IRAAccount.fields.status
        distinguishing_aspect: "Approving a PENDING IRAAccount whose customer has id on file moves it to ACTIVE."
        test_recipe:
          setup: ["a customer with id on file; a PENDING IRA account"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "IRA Approve", id_document_on_file: true }
              as: ComplianceOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /api/ira-accounts"
              payload: { customer_id: "${cust_id}", custodian_name: "Trust Co", custodian_account_ref: "TC-1" }
              as: ComplianceOfficer
              captures: { ira_id: $.data.id }
          trigger:
            - call: "POST /api/ira-accounts/${ira_id}/approve"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "IRAAccount.${ira_id}.status == ACTIVE"

      - name: approve_ira_account_without_id_on_file_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.IRAAccount.PENDING_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving a PENDING IRAAccount whose owner has no id_document_on_file is rejected (precondition on the owning Customer)."
        test_recipe:
          setup: ["a customer WITHOUT id on file; a PENDING IRA account"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "No ID", id_document_on_file: false }
              as: ComplianceOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /api/ira-accounts"
              payload: { customer_id: "${cust_id}", custodian_name: "Trust Co", custodian_account_ref: "TC-2" }
              as: ComplianceOfficer
              captures: { ira_id: $.data.id }
          trigger:
            - call: "POST /api/ira-accounts/${ira_id}/approve"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_INVALID_STATE"
            - "IRAAccount.${ira_id}.status == PENDING"

      - name: consignment_sold_side_effect_records_hammer_price
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Consignment.LISTED_to_SOLD
          - entities.Consignment.fields.hammer_price_cents
        distinguishing_aspect: "record-sale on a LISTED consignment with hammer at/above reserve sets hammer_price_cents and status SOLD."
        test_recipe:
          setup: ["a consignor; a scheduled session; a listed consignment reserve 50000"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "Sold Consignor" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/auction-sessions"
              payload: { room: "ROOM-SOLD", scheduled_start: "2026-04-11T10:00:00Z", scheduled_end: "2026-04-11T12:00:00Z" }
              as: SalesAgent
              captures: { sess_id: $.data.id }
            - call: "POST /api/consignments"
              payload: { customer_id: "${cust_id}", description: "Gold eagle", reserve_price_cents: 50000, commission_pct: 0.10, buyer_premium_pct: 0.05 }
              as: SalesAgent
              captures: { cons_id: $.data.id }
            - call: "POST /api/consignments/${cons_id}/list"
              payload: { auction_session_id: "${sess_id}" }
              as: SalesAgent
              captures: { cons_v: $.data.version }
          trigger:
            - call: "POST /api/consignments/${cons_id}/record-sale"
              payload: { hammer_price_cents: 80000, expected_consignment_version: "${cons_v}" }
              as: SalesAgent
          assert:
            - "Consignment.${cons_id}.status == SOLD"
            - "Consignment.${cons_id}.hammer_price_cents == 80000"

  # =====================================================================
  # Validations (Table 4)
  # =====================================================================
  - section: validations
    instances:
      - name: bullion_product_with_premium_returns_forbidden
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors[ERR_BULLION_PREMIUM_FORBIDDEN]
        distinguishing_aspect: "Creating a BULLION product with numismatic_premium_cents > 0 returns ERR_BULLION_PREMIUM_FORBIDDEN (422)."
        test_recipe:
          setup: ["no prerequisites"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/products"
              payload: { sku: "AU-BADPREM", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04, numismatic_premium_cents: 5000 }
              as: Trader
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_BULLION_PREMIUM_FORBIDDEN"

      - name: overpayment_deposit_returns_overpayment_error
        claim_type: Aggregate validation
        grounds:
          - validations[priority=16]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: "A layaway deposit that would push amount_paid_cents above total_price_cents returns ERR_OVERPAYMENT (422)."
        test_recipe:
          setup: ["a layaway total_price 420000 with no deposits yet (version 1)"]
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-OVP", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 5, acquisition_unit_cost_cents: 100000 }
              as: Trader
              captures: { lot_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Overpayer" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/layaways"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", inventory_lot_id: "${lot_id}", quantity: 2 }
              as: SalesAgent
              captures: { lay_id: $.data.id, lay_v0: $.data.version }
          trigger:
            - call: "POST /api/layaways/${lay_id}/deposit"
              payload: { amount_cents: 500000, expected_layaway_version: "${lay_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_OVERPAYMENT"
            - "Layaway.${lay_id}.amount_paid_cents == 0"

      - name: exact_remaining_deposit_succeeds_boundary
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=16]
          - entities.Layaway.fields.amount_paid_cents
        distinguishing_aspect: "Paying exactly the full total_price_cents (420000) in one deposit is allowed (boundary: equal is not overpayment)."
        test_recipe:
          setup: ["a layaway total_price 420000, version 1"]
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-EXACT", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 5, acquisition_unit_cost_cents: 100000 }
              as: Trader
              captures: { lot_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Exact Payer" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/layaways"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", inventory_lot_id: "${lot_id}", quantity: 2 }
              as: SalesAgent
              captures: { lay_id: $.data.id, lay_v0: $.data.version }
          trigger:
            - call: "POST /api/layaways/${lay_id}/deposit"
              payload: { amount_cents: 420000, expected_layaway_version: "${lay_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Layaway.${lay_id}.amount_paid_cents == 420000"
            - "Layaway.${lay_id}.status == ACTIVE"

      - name: reportable_buy_without_id_on_file_returns_error
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=6]
          - errors[ERR_ID_REQUIRED_FOR_REPORTABLE]
        distinguishing_aspect: "Settling a reportable BuyOrder whose customer lacks id_document_on_file returns ERR_ID_REQUIRED_FOR_REPORTABLE (422)."
        test_recipe:
          setup: ["GOLD spot 500000; bullion product buy_spread 0; customer WITHOUT id on file; a reportable buy order qty 2 (total_payout 1000000)"]
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 500000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-REP", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.0 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "No ID Seller", id_document_on_file: false }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/buy-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 2 }
              as: SalesAgent
              captures: { bo_id: $.data.id }
          trigger:
            - call: "POST /api/buy-orders/${bo_id}/settle"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_ID_REQUIRED_FOR_REPORTABLE"
            - "BuyOrder.${bo_id}.reportable == true"

  # =====================================================================
  # Errors (Table 6) — coverage of remaining error codes
  # =====================================================================
  - section: errors
    instances:
      - name: reserve_not_met_below_reserve_returns_error
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RESERVE_NOT_MET]
          - validations[priority=11]
        distinguishing_aspect: "record-sale with hammer strictly below reserve (49999 < 50000) returns ERR_RESERVE_NOT_MET (422)."
        test_recipe:
          setup: ["a listed consignment reserve 50000 (version captured at list)"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "Reserve Consignor" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/auction-sessions"
              payload: { room: "ROOM-RES", scheduled_start: "2026-04-12T10:00:00Z", scheduled_end: "2026-04-12T12:00:00Z" }
              as: SalesAgent
              captures: { sess_id: $.data.id }
            - call: "POST /api/consignments"
              payload: { customer_id: "${cust_id}", description: "Below reserve item", reserve_price_cents: 50000, commission_pct: 0.10, buyer_premium_pct: 0.05 }
              as: SalesAgent
              captures: { cons_id: $.data.id }
            - call: "POST /api/consignments/${cons_id}/list"
              payload: { auction_session_id: "${sess_id}" }
              as: SalesAgent
              captures: { cons_v: $.data.version }
          trigger:
            - call: "POST /api/consignments/${cons_id}/record-sale"
              payload: { hammer_price_cents: 49999, expected_consignment_version: "${cons_v}" }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_RESERVE_NOT_MET"
            - "Consignment.${cons_id}.status == LISTED"

      - name: product_not_ira_eligible_on_sell_returns_error
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PRODUCT_NOT_IRA_ELIGIBLE]
          - validations[priority=9]
        distinguishing_aspect: "Placing an IRA-allocation sell order on a product with ira_eligible false returns ERR_PRODUCT_NOT_IRA_ELIGIBLE (422)."
        test_recipe:
          setup: ["GOLD spot 200000; a NON-ira-eligible bullion product; a customer with an ACTIVE IRA account"]
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-NONIRA", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04, ira_eligible: false }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 5, acquisition_unit_cost_cents: 100000 }
              as: Trader
            - call: "POST /api/customers"
              payload: { full_name: "IRA NonEligible", id_document_on_file: true }
              as: ComplianceOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /api/ira-accounts"
              payload: { customer_id: "${cust_id}", custodian_name: "Trust", custodian_account_ref: "T-NE" }
              as: ComplianceOfficer
              captures: { ira_id: $.data.id }
            - call: "POST /api/ira-accounts/${ira_id}/approve"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /api/sell-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 1, ira_account_id: "${ira_id}" }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_PRODUCT_NOT_IRA_ELIGIBLE"

      - name: reportable_buy_not_approved_returns_error
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REPORTABLE_NOT_APPROVED]
          - validations[priority=7]
        distinguishing_aspect: "Settling a reportable BuyOrder (customer HAS id on file) without the compliance approval returns ERR_REPORTABLE_NOT_APPROVED (422)."
        test_recipe:
          setup: ["GOLD spot 500000; bullion product buy_spread 0; customer WITH id on file; reportable buy order qty 2 (total_payout 1000000), not yet approved"]
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 500000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-REP2", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.0 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "ID Seller", id_document_on_file: true }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/buy-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 2 }
              as: SalesAgent
              captures: { bo_id: $.data.id }
          trigger:
            - call: "POST /api/buy-orders/${bo_id}/settle"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_REPORTABLE_NOT_APPROVED"
            - "BuyOrder.${bo_id}.status == PLACED"

  # =====================================================================
  # RBAC (Table 7)
  # =====================================================================
  - section: rbac
    instances:
      - name: sales_agent_cannot_create_spot_rate_unauthorized
        claim_type: exclusive_denied
        grounds:
          - roles.SalesAgent
          - roles.Trader
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "A SalesAgent invoking POST /api/spot-rates (Trader-exclusive) is rejected with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["no prerequisites"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_UNAUTHORIZED"

      - name: customer_cannot_deposit_other_customers_layaway_not_owner
        claim_type: peer_isolation
        grounds:
          - roles.Customer
          - validations[priority=4]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "A Customer depositing on a layaway owned by a DIFFERENT customer is rejected with ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["GOLD spot 200000; a bullion product + lot; customer A owns a layaway; customer B acts on it"]
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-OWN", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 5, acquisition_unit_cost_cents: 100000 }
              as: Trader
              captures: { lot_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Owner A" }
              as: SalesAgent
              captures: { cust_a: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Intruder B" }
              as: SalesAgent
              captures: { cust_b: $.data.id }
            - call: "POST /api/layaways"
              payload: { customer_id: "${cust_a}", product_id: "${prod_id}", inventory_lot_id: "${lot_id}", quantity: 1 }
              as: SalesAgent
              captures: { lay_id: $.data.id, lay_v0: $.data.version }
          trigger:
            - call: "POST /api/layaways/${lay_id}/deposit"
              payload: { amount_cents: 1000, expected_layaway_version: "${lay_v0}" }
              as: Customer
              as_user_id: "${cust_b}"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_NOT_RESOURCE_OWNER"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: auth_required
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request missing X-User-ID / X-User-Role headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["no auth headers supplied"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/products"
              payload: { sku: "AU-NOAUTH", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_UNAUTHENTICATED"

  # =====================================================================
  # Cross-Cutting Complexity Layers — optimistic concurrency
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: layaway_deposit_stale_version_returns_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[layaway-deposit-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A second deposit still carrying the pre-first-deposit expected_layaway_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["a layaway total_price 420000; one deposit already applied (version advanced)"]
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-OCC", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 5, acquisition_unit_cost_cents: 100000 }
              as: Trader
              captures: { lot_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "OCC Payer" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/layaways"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", inventory_lot_id: "${lot_id}", quantity: 2 }
              as: SalesAgent
              captures: { lay_id: $.data.id, lay_v0: $.data.version }
            - call: "POST /api/layaways/${lay_id}/deposit"
              payload: { amount_cents: 50000, expected_layaway_version: "${lay_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /api/layaways/${lay_id}/deposit"
              payload: { amount_cents: 50000, expected_layaway_version: "${lay_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_STALE_VERSION"
            - "Layaway.${lay_id}.amount_paid_cents == 50000"

      - name: layaway_deposit_correct_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[layaway-deposit-stale-version]
          - entities.Layaway.fields.version
        distinguishing_aspect: "A deposit with the current expected_layaway_version succeeds and increments version by 1."
        test_recipe:
          setup: ["a fresh layaway at version 1"]
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-OCC2", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 5, acquisition_unit_cost_cents: 100000 }
              as: Trader
              captures: { lot_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "OCC OK" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/layaways"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", inventory_lot_id: "${lot_id}", quantity: 2 }
              as: SalesAgent
              captures: { lay_id: $.data.id, lay_v0: $.data.version }
          trigger:
            - call: "POST /api/layaways/${lay_id}/deposit"
              payload: { amount_cents: 30000, expected_layaway_version: "${lay_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { lay_v1: $.data.version }
          assert:
            - "Layaway.${lay_id}.amount_paid_cents == 30000"
            - "Layaway.${lay_id}.version == 2"

  # =====================================================================
  # Consistency Model — immediate
  # =====================================================================
  - section: consistency_model
    instances:
      - name: buy_settle_effects_visible_same_request
        claim_type: immediate
        grounds:
          - state_machines.BuyOrder.PLACED_to_SETTLED
          - entities.Customer.fields.lifetime_buy_payout_cents
        distinguishing_aspect: "After settling a buy order, the SETTLED status is present in the settle response envelope (immediate consistency)."
        test_recipe:
          setup: ["GOLD spot 200000; bullion product; customer id on file; a placed non-reportable buy order qty 1"]
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-IMM", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Immediate Seller", id_document_on_file: true }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/buy-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 1 }
              as: SalesAgent
              captures: { bo_id: $.data.id }
          trigger:
            - call: "POST /api/buy-orders/${bo_id}/settle"
              payload: {}
              as: SalesAgent
          assert:
            - "BuyOrder.${bo_id}.status == SETTLED"
            - "Customer.${cust_id}.lifetime_buy_payout_cents == 192000"
