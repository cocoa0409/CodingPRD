  # =========================================================================
  # SECTION - consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: each_write_returns_its_own_recomputed_derived_fields_with_no_second_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.tally_reconciliation
          - calculations.certification_timeline
          - entities.ElectionRound
          - endpoints.POST_election_rounds_id_post_tally
        distinguishing_aspect: |
          Under immediate consistency no derived value may lag behind the request that caused it. The
          post-tally response must already contain the summed provisional figures, the margin, the
          determinative flag and the objection deadline; each challenge resolution must already show the
          parent round's recounted buckets on the very next read in the same sequence; the revise-tally
          response must already carry valid_votes_cast and majority_threshold; and the certify response must
          already carry the whole bargaining timeline. Nothing here is allowed to require a retry or a delay,
          and the filtered collection reads must agree with the row reads at the same instant.
