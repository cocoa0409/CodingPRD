      - name: ballot_creation_on_a_draft_already_out_of_drafting_returns_invalid_draft_state
        claim_type: invalid_transitions
        grounds:
          - state_machines[Draft].DRAFTING_to_SUBCOMMITTEE_BALLOT
          - validations[priority=70]
          - errors[ERR_INVALID_DRAFT_STATE]
        distinguishing_aspect: "Opening a ballot on a draft that is already in SUBCOMMITTEE_BALLOT has no declared edge and must be ERR_INVALID_DRAFT_STATE."
        excluded_because:
          difficulty_instance: ballot_create_draft_state_error_precedes_capacity_constraint_error
          rationale: "That §1.8 priority_pair_validation_conflict instance already drives exactly this call — a second POST /sdo/ballots on a draft sitting in SUBCOMMITTEE_BALLOT — and asserts ERR_INVALID_DRAFT_STATE (409) with no Ballot row created, additionally proving the state check outranks the capacity check. A separate §1.9 probe would repeat its trigger verbatim with a weaker assertion."

      - name: closing_a_public_review_twice_returns_invalid_public_review_state
        claim_type: invalid_transitions
        grounds:
          - state_machines[PublicReview].OPEN_to_CLOSED
          - validations[priority=73]
          - errors[ERR_INVALID_PUBLIC_REVIEW_STATE]
        distinguishing_aspect: "Close is declared only from OPEN, so replaying it on a review that already reached DISPOSITION_APPROVED must be ERR_INVALID_PUBLIC_REVIEW_STATE."
        excluded_because:
          difficulty_instance: zero_comment_public_review_closes_at_full_disposition_completeness_not_zero
          rationale: "That §1.8 boundary_precision_check instance closes a zero-comment review — which reaches DISPOSITION_APPROVED inside that same request — and then replays the close, asserting ERR_INVALID_PUBLIC_REVIEW_STATE (409) with disposition_completeness_pct still 100.0. The state-lockdown claim is already covered there together with the empty-collection boundary that makes it interesting."

      - name: ballot_creation_while_the_sponsoring_committee_is_not_active_returns_committee_not_active
        claim_type: precondition_enforcement
        grounds:
          - state_machines[Draft].DRAFTING_to_SUBCOMMITTEE_BALLOT
          - validations[priority=78]
          - errors[ERR_COMMITTEE_NOT_ACTIVE]
        distinguishing_aspect: "The ballot-open edge carries a cross-entity precondition on the sponsoring committee's status, so a SUSPENDED committee must yield ERR_COMMITTEE_NOT_ACTIVE."
        excluded_because:
          difficulty_instance: ballot_creation_blocked_while_sponsoring_committee_is_suspended
          rationale: "That §1.8 cross_entity_state_dependency instance suspends a seat to cascade the committee ACTIVE -> SUSPENDED and then attempts POST /sdo/ballots, asserting ERR_COMMITTEE_NOT_ACTIVE (409) with the draft still DRAFTING and open_ballot_count still 0. It is the same trigger with a strictly larger setup."

