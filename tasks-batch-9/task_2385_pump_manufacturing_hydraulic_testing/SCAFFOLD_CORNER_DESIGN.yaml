            - "the second call returns exactly 1 element whose id == ${tp1_id}"
      - name: create_pattern_asset_with_unknown_pump_model_returns_referenced_resource_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_REFERENCED_RESOURCE_NOT_FOUND]
          - entities.PatternAsset.fields.pump_model_id
        distinguishing_aspect: |
          pump_model_id is a body foreign key, not a path segment, so an unresolvable value must yield 404
          ERR_REFERENCED_RESOURCE_NOT_FOUND and not the path-level ERR_NOT_FOUND.
        test_recipe:
          setup:
            - "Foundry FDY-NORTH exists; no PumpModel row exists."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
          trigger:
