              as: DealerAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", complaint: "x", labor_rate_cents: 13000, flat_rate_hours: 1.0 }
              as: PartsClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 403"
            - "response error_id == ERR_FORBIDDEN"

      - name: unauthenticated_unknown_role_rejected
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unknown X-User-Role is rejected with ERR_UNAUTHENTICATED (401) before any other check."
