# =============================================================================
# §1.9 Scaffold Corner Design — Parametric & Index-Based Insurance
# Breadth coverage of every §1.1-§1.7 testable claim not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Excluded stubs cite the covering §1.8
# instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: program_creation_defaults_and_computed_init
        claim_type: creation_defaults_computed
        grounds: [entities.InsuranceProgram]
        distinguishing_aspect: "POST /programs returns 201; computed aggregates initialize to 0, reporting_epoch 0, status DRAFT, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-E1", peril_type: "WINDSPEED", regulatory_classification: "SURPLUS_LINES", contract_wording_version: "CW-E1", exposure_limit_cents: 5000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id, st: $.data.status, gwp: $.data.gross_written_premium_cents, ep: $.data.reporting_epoch, ver: $.data.version }
          trigger:
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Actuary
          assert:
            - "status (${st}) == DRAFT at creation"
            - "gross_written_premium_cents (${gwp}) == 0, reporting_epoch (${ep}) == 0, version (${ver}) == 1"
            - "GET re-read shows incurred_claims_cents == 0, ceded_recovery_cents == 0, net_retained_exposure_cents == 0, fraud_alert_count == 0"

      - name: policyholder_creation_default_prospect_and_ack_autoflip
        claim_type: creation_defaults_computed
        grounds: [entities.Policyholder, state_machines.Policyholder]
        distinguishing_aspect: "Omitting basis_risk_disclosure_acknowledged yields default false and status PROSPECT; PATCH flipping it true auto-transitions PROSPECT -> ACTIVE."
        test_recipe:
          setup: ["program created (DRAFT is fine for holder registration)"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-E2", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-E2", exposure_limit_cents: 5000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/policyholders"
              payload: { legal_name: "H-E2", tax_id: "T-E2" }
              as: ServicingAgent
              captures: { holder_id: $.data.id, st0: $.data.status, ack0: $.data.basis_risk_disclosure_acknowledged }
            - call: "PATCH /programs/${prog_id}/policyholders/${holder_id}"
              payload: { basis_risk_disclosure_acknowledged: true }
              as: ServicingAgent
              captures: { st1: $.data.status }
          assert:
            - "default acknowledgment (${ack0}) == false and initial status (${st0}) == PROSPECT"
            - "after PATCH ack=true, status (${st1}) == ACTIVE (system auto-transition on the acknowledgment flip)"

      - name: policy_creation_computes_premium_and_creates_invoice
        claim_type: computed_field_and_cascade_child
        grounds: [entities.ParametricPolicy, entities.PremiumInvoice, calculations.premium_pricing]
        distinguishing_aspect: "Quoting a policy computes premium_cents/premium_tax_cents server-side and cascade-creates exactly one PremiumInvoice whose amount equals premium+tax; the invoice is discoverable only via the filtered list GET."
        test_recipe:
          setup: ["program ACTIVE, index ACTIVE (freq 0.20, elr 0.60), holder ACTIVE"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-E3", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-E3", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-E3", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
            - call: "POST /programs/${prog_id}/index-definitions"
              payload: { index_code: "IDX-E3", measurement_unit: "mm", aggregation_window_days: 30, data_source_agreement_ref: "DSA-E3", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 0.25 } ], strike_direction: "BELOW", historical_breach_frequency: 0.2, expected_loss_ratio: 0.6 }
              as: Actuary
              captures: { idx_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /programs/${prog_id}/policyholders"
              payload: { legal_name: "H-E3", tax_id: "T-E3", basis_risk_disclosure_acknowledged: true }
              as: ServicingAgent
              captures: { holder_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies"
              payload: { index_definition_id: "${idx_id}", sum_insured_cents: 2000000, policy_start_date: "2026-01-01", policy_end_date: "2026-12-31" }
              as: Underwriter
              captures: { pol_id: $.data.id, prem: $.data.premium_cents, tax: $.data.premium_tax_cents, lc: $.data.lifecycle_status, sp: $.data.settlement_posture }
            - call: "GET /programs/${prog_id}/invoices"
              payload: { policy_id: "${pol_id}" }
              as: ServicingAgent
              captures: { inv_amount: "$.data[0].invoice_amount_cents", inv_status: "$.data[0].status", inv_due: "$.data[0].due_date" }
          assert:
            - "premium_cents (${prem}) == 300000 and premium_tax_cents (${tax}) == 6000 (ADMITTED loading 25%, tax 2% on loaded)"
            - "lifecycle_status (${lc}) == QUOTED and settlement_posture (${sp}) == CLEAR (parallel dims initialized independently)"
            - "exactly one invoice exists for the policy; invoice_amount_cents (${inv_amount}) == 306000, status (${inv_status}) == ISSUED, due_date (${inv_due}) == 2026-01-01"

      - name: index_observation_immutability_common_fields_false
        claim_type: immutability
        grounds: [entities.IndexObservation]
        distinguishing_aspect: "IndexObservation is an append-only event log (common_fields false): it carries id and created_at but no updated_at/version fields, and no update endpoint exists in §1.5."
        test_recipe:
          setup: ["program ACTIVE, index ACTIVE, station COMMISSIONED"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-E4", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-E4", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-E4", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
              captures: { st_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions"
              payload: { index_code: "IDX-E4", measurement_unit: "mm", aggregation_window_days: 30, data_source_agreement_ref: "DSA-E4", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 0.25 } ], strike_direction: "BELOW", historical_breach_frequency: 0.2, expected_loss_ratio: 0.6 }
              as: Actuary
              captures: { idx_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/observations"
              payload: { station_id: "${st_id}", window_end_date: "2026-06-30", measured_value: 55 }
              as: DataOperations
              captures: { obs_id: $.data.id, seq: $.data.sequence_no, eff: $.data.is_effective }
          assert:
            - "observation created with sequence_no (${seq}) == 1 (first observation on the index) and is_effective (${eff}) == true"
            - "response has no version field (common_fields false entity)"
            - "value 55 breaches nothing under BELOW t1<=50? 55 > 50 so no TriggerEvent is created for the window (non-breaching ingestion)"

      - name: entity_not_found_errors_per_resource
        claim_type: not_found
        grounds:
          - "errors[ERR_PROGRAM_NOT_FOUND]"
          - "errors[ERR_INDEX_NOT_FOUND]"
          - "errors[ERR_CLAIM_NOT_FOUND]"
        distinguishing_aspect: "Existence validation (priority 3) returns the resource-specific 404 error; spot-check three levels of the nesting chain."
        test_recipe:
          setup: ["one program exists"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-E5", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-E5", exposure_limit_cents: 5000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Actuary
              captures: { e_prog: $.data.error_id }
            - call: "GET /programs/${prog_id}/index-definitions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Actuary
              captures: { e_idx: $.data.error_id }
            - call: "GET /programs/${prog_id}/claims/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Actuary
              captures: { e_claim: $.data.error_id }
          assert:
            - "missing program -> (${e_prog}) == ERR_PROGRAM_NOT_FOUND (404)"
            - "missing index inside existing program -> (${e_idx}) == ERR_INDEX_NOT_FOUND (404)"
            - "missing claim -> (${e_claim}) == ERR_CLAIM_NOT_FOUND (404)"

      - name: fk_reverse_reachability_lists
        claim_type: parent_relationship
        grounds: [entities.PayoutClaim.fields.trigger_event_id, entities.PremiumInvoice.fields.policy_id]
        distinguishing_aspect: "Every FK has a reverse GET: claims are reachable from policy (sub-resource), from trigger event (filtered list), and invoices from policy (filtered list)."
        test_recipe:
          setup: ["program ACTIVE, index ACTIVE, holder ACTIVE, policy BOUND (invoice exists)"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-E6", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-E6", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-E6", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
              captures: { st_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions"
              payload: { index_code: "IDX-E6", measurement_unit: "mm", aggregation_window_days: 30, data_source_agreement_ref: "DSA-E6", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 0.25 } ], strike_direction: "BELOW", historical_breach_frequency: 0.2, expected_loss_ratio: 0.6 }
              as: Actuary
              captures: { idx_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /programs/${prog_id}/policyholders"
              payload: { legal_name: "H-E6", tax_id: "T-E6", basis_risk_disclosure_acknowledged: true }
              as: ServicingAgent
              captures: { holder_id: $.data.id }
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies"
              payload: { index_definition_id: "${idx_id}", sum_insured_cents: 2000000, policy_start_date: "2026-01-01", policy_end_date: "2026-12-31" }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "GET /programs/${prog_id}/invoices"
              payload: { policy_id: "${pol_id}" }
              as: ServicingAgent
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/invoices/${inv_id}/payments"
              payload: { amount_cents: 306000 }
              as: ServicingAgent
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/observations"
              payload: { station_id: "${st_id}", window_end_date: "2026-06-30", measured_value: 40 }
              as: DataOperations
            - call: "GET /programs/${prog_id}/trigger-events"
              payload: { index_definition_id: "${idx_id}" }
              as: ClaimsAdjuster
              captures: { ev_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/trigger-events/${ev_id}/open-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/trigger-events/${ev_id}/verify"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "GET /programs/${prog_id}/policyholders/${holder_id}/policies/${pol_id}/claims"
              payload: {}
              as: ServicingAgent
              captures: { n_sub: "$.data[0].id" }
            - call: "GET /programs/${prog_id}/claims"
              payload: { trigger_event_id: "${ev_id}" }
              as: ClaimsAdjuster
              captures: { n_fk: "$.data[0].id" }
            - call: "GET /programs/${prog_id}/invoices"
              payload: { policy_id: "${pol_id}" }
              as: ServicingAgent
          assert:
            - "policy sub-resource claims list contains the generated claim (${n_sub} present)"
            - "trigger_event_id filtered claims list returns the same claim (${n_fk} == ${n_sub})"
            - "invoice filtered list by policy_id returns exactly 1 invoice"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: program_activate_requires_active_index
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.InsuranceProgram.DRAFT_to_ACTIVE"
          - "errors[ERR_PROGRAM_NO_ACTIVE_INDEX]"
        distinguishing_aspect: "Activating a program whose only index is still PENDING_AGREEMENT fails with ERR_PROGRAM_NO_ACTIVE_INDEX; after index activation the same call succeeds."
        test_recipe:
          setup: ["program DRAFT with one station and one PENDING_AGREEMENT index"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-S1", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-S1", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-S1", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
            - call: "POST /programs/${prog_id}/index-definitions"
              payload: { index_code: "IDX-S1", measurement_unit: "mm", aggregation_window_days: 30, data_source_agreement_ref: "DSA-S1", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 0.25 } ], strike_direction: "BELOW", historical_breach_frequency: 0.2, expected_loss_ratio: 0.6 }
              as: Actuary
              captures: { idx_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
              captures: { err1: $.data.error_id }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
              captures: { st_after: $.data.status }
          assert:
            - "first activate -> (${err1}) == ERR_PROGRAM_NO_ACTIVE_INDEX (409)"
            - "after index activation, program activate succeeds: status (${st_after}) == ACTIVE"

      - name: index_activate_requires_commissioned_station
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.IndexDefinition.PENDING_AGREEMENT_to_ACTIVE"
          - "errors[ERR_NO_COMMISSIONED_STATION]"
        distinguishing_aspect: "Index activation with zero COMMISSIONED stations in the program fails; commissioning any station unblocks it."
        test_recipe:
          setup: ["program DRAFT, one index PENDING_AGREEMENT, the only station taken OFFLINE"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-S2", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-S2", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-S2", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
              captures: { st_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions"
              payload: { index_code: "IDX-S2", measurement_unit: "mm", aggregation_window_days: 30, data_source_agreement_ref: "DSA-S2", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 0.25 } ], strike_direction: "BELOW", historical_breach_frequency: 0.2, expected_loss_ratio: 0.6 }
              as: Actuary
              captures: { idx_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations/${st_id}/take-offline"
              payload: {}
              as: DataOperations
          trigger:
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/activate"
              payload: {}
              as: Actuary
              captures: { err1: $.data.error_id }
            - call: "POST /programs/${prog_id}/stations/${st_id}/recommission"
              payload: {}
              as: DataOperations
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/activate"
              payload: {}
              as: Actuary
              captures: { st_after: $.data.status }
          assert:
            - "activate with all stations OFFLINE -> (${err1}) == ERR_NO_COMMISSIONED_STATION (409)"
            - "after recommission, activate succeeds: index status (${st_after}) == ACTIVE"

      - name: program_suspend_resume_cascades_index_states
        claim_type: cascade_down_and_compensation
        grounds: [state_machines.InsuranceProgram.ACTIVE_to_SUSPENDED, state_machines.InsuranceProgram.SUSPENDED_to_ACTIVE, state_machines.IndexDefinition.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Program suspension cascades ACTIVE indexes to SUSPENDED and resume cascades them back; observation ingestion on a SUSPENDED index is rejected with ERR_INDEX_SUSPENDED in between."
        test_recipe:
          setup: ["program ACTIVE with one ACTIVE index and one COMMISSIONED station"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-S3", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-S3", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-S3", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
              captures: { st_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions"
              payload: { index_code: "IDX-S3", measurement_unit: "mm", aggregation_window_days: 30, data_source_agreement_ref: "DSA-S3", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 0.25 } ], strike_direction: "BELOW", historical_breach_frequency: 0.2, expected_loss_ratio: 0.6 }
              as: Actuary
              captures: { idx_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /programs/${prog_id}/suspend"
              payload: {}
              as: ProgramManager
            - call: "GET /programs/${prog_id}/index-definitions/${idx_id}"
              payload: {}
              as: ProgramManager
              captures: { idx_st: $.data.status }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/observations"
              payload: { station_id: "${st_id}", window_end_date: "2026-06-30", measured_value: 40 }
              as: DataOperations
              captures: { obs_err: $.data.error_id }
            - call: "POST /programs/${prog_id}/resume"
              payload: {}
              as: ProgramManager
            - call: "GET /programs/${prog_id}/index-definitions/${idx_id}"
              payload: {}
              as: ProgramManager
              captures: { idx_st2: $.data.status }
          assert:
            - "after program suspend, index status (${idx_st}) == SUSPENDED (cascade down)"
            - "observation while suspended -> (${obs_err}) == ERR_INDEX_SUSPENDED (409)"
            - "after program resume, index status (${idx_st2}) == ACTIVE (compensating cascade restores)"

      - name: terminal_state_lockdown_paid_claim_rejects_adjust
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.PayoutClaim"
          - "errors[ERR_CLAIM_NOT_ADJUSTABLE]"
        distinguishing_aspect: "A PAID claim is terminal for adjustment: adjust and decline both fail with ERR_CLAIM_NOT_ADJUSTABLE and no fields change."
        test_recipe:
          setup: ["program ACTIVE, holder ACTIVE, policy BOUND si 2,000,000, event verified, claim PAID (no treaties)"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-S4", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-S4", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-S4", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
              captures: { st_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions"
              payload: { index_code: "IDX-S4", measurement_unit: "mm", aggregation_window_days: 30, data_source_agreement_ref: "DSA-S4", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 0.25 }, { tier: 2, threshold_value: 30, payout_fraction: 0.5 } ], strike_direction: "BELOW", historical_breach_frequency: 0.2, expected_loss_ratio: 0.6 }
              as: Actuary
              captures: { idx_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /programs/${prog_id}/policyholders"
              payload: { legal_name: "H-S4", tax_id: "T-S4", basis_risk_disclosure_acknowledged: true }
              as: ServicingAgent
              captures: { holder_id: $.data.id }
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies"
              payload: { index_definition_id: "${idx_id}", sum_insured_cents: 2000000, policy_start_date: "2026-01-01", policy_end_date: "2026-12-31" }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "GET /programs/${prog_id}/invoices"
              payload: { policy_id: "${pol_id}" }
              as: ServicingAgent
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/invoices/${inv_id}/payments"
              payload: { amount_cents: 306000 }
              as: ServicingAgent
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
