              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "GM-KMB-410", name: "Ginger Kombucha Minis", category: "BEVERAGE", requires_food_handling: true, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 260, samples_per_case: 48, weekly_sample_case_pool: 24 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Rosa Bittner", hourly_rate_cents: 2500 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { lead_dem_id: "$.data.id" }
            - call: "POST /demonstrators/${lead_dem_id}/certifications"
