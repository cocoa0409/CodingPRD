  - section: cross_cutting_layers
    instances:
      - name: occ_bid_revision_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[bid-revision-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Bid.version: revision with the fresh version succeeds and bumps the version; a follow-up revision carrying the pre-first-revision version is rejected 412 — two strictly sequential requests, no wall-clock dependence."
        test_recipe:
          setup: ["Package PUBLISHED; sub prequalified + BIDDING; bid SUBMITTED (version 1 captured)"]
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "OCC LLC", contact_email: "occ@x.com", license_number: "LIC-O-7001" }
              as: Anonymous
              captures: { sub_o: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_o}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_o}"
              captures: { app_o: $.data.id }
            - call: "POST /prequal-applications/${app_o}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "OCC Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_o}" }
              as: LeadEstimator
              captures: { inv_o: $.data.id }
            - call: "POST /invitations/${inv_o}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_o}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_o}"
              captures: { bid_o: $.data.id, bid_v1: $.data.version }
          trigger:
            - call: "POST /bids/${bid_o}/revisions"
              payload: { new_base_bid_cents: 990000, expected_bid_version: "${bid_v1}" }
              as: Subcontractor
              as_user_id: "${sub_o}"
              captures: { bid_v2: $.data.version }
            - call: "POST /bids/${bid_o}/revisions"
              payload: { new_base_bid_cents: 980000, expected_bid_version: "${bid_v1}" }
              as: Subcontractor
              as_user_id: "${sub_o}"
              captures: { err: $.data.error_id }
          assert:
            - "First revision: 200, base_bid_cents == 990000, version 1 -> 2 (${bid_v2} == ${bid_v1} + 1)"
            - "Second revision with stale ${bid_v1}: HTTP 412, err == ERR_STALE_VERSION"
            - "Bid.${bid_o}.base_bid_cents remains 990000; revisions list has exactly 2 rows"

      - name: occ_recommendation_create_stale_package_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[recommendation-create-stale-package]", "errors[ERR_STALE_PACKAGE_VERSION]"]
        distinguishing_aspect: "OCC on BidPackage.version at recommendation creation: a re-tabulation advances the package version, so a create carrying the pre-retabulation version is rejected 412; re-reading and retrying succeeds."
        test_recipe:
          setup: ["Package TABULATED with one compliant bid; version captured; then a re-tabulation (TABULATED -> TABULATED) advances it"]
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "OCC2 LLC", contact_email: "occ2@x.com", license_number: "LIC-O-7002" }
              as: Anonymous
              captures: { sub_o: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_o}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_o}"
              captures: { app_o: $.data.id }
            - call: "POST /prequal-applications/${app_o}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "OCC2 Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_o}" }
              as: LeadEstimator
              captures: { inv_o: $.data.id }
            - call: "POST /invitations/${inv_o}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_o}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_o}"
              captures: { bid_o: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T15:00:00Z" }
              as: LeadEstimator
            - call: "POST /bid-packages/${pkg}/close-bidding"
              as: LeadEstimator
            - call: "POST /bid-packages/${pkg}/tabulate"
              as: LeadEstimator
            - call: "GET /bid-packages/${pkg}"
              as: LeadEstimator
              captures: { pkg_v_stale: $.data.version }
            - call: "POST /bid-packages/${pkg}/tabulate"
              as: LeadEstimator
          trigger:
            - call: "POST /award-recommendations"
              payload: { bid_package_id: "${pkg}", recommended_bid_id: "${bid_o}", rationale: "stale basis", expected_bid_package_version: "${pkg_v_stale}" }
              as: LeadEstimator
              captures: { err: $.data.error_id }
            - call: "GET /bid-packages/${pkg}"
              as: LeadEstimator
              captures: { pkg_v_fresh: $.data.version }
            - call: "POST /award-recommendations"
              payload: { bid_package_id: "${pkg}", recommended_bid_id: "${bid_o}", rationale: "fresh basis", expected_bid_package_version: "${pkg_v_fresh}" }
              as: LeadEstimator
              captures: { rec: $.data.id }
          assert:
            - "Stale create: HTTP 412, err == ERR_STALE_PACKAGE_VERSION (re-tabulation bumped the version after the read)"
            - "Fresh create: 201, AwardRecommendation.${rec}.status == DRAFT"
            - "BidPackage.version advanced by exactly 1 across the successful create"

      - name: award_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.BidPackage.RECOMMENDATION_PENDING_to_AWARDED]
        excluded_because:
          difficulty_instance: award_approval_three_level_cascade
          rationale: "The 3-level cascade (decide -> package AWARDED -> bids -> feedback rows) is asserted link-by-link there."

      - name: addendum_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds: ["endpoints[POST /addendums]"]
        excluded_because:
          difficulty_instance: addendum_issue_two_level_cascade
          rationale: "The 2-level cascade (issue -> PENDING acks -> bid flag recompute) is asserted there."

      - name: default_clock_before_any_set
        claim_type: scheduled_deferred_actions
        grounds: ["endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "With no set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z: a package due 2026-08-10 accepts bids immediately (proving the deterministic default rather than wall-clock time)."
        test_recipe:
          setup: ["Sub prequalified + BIDDING; package PUBLISHED due 2026-08-10T14:00:00Z — no clock call ever made"]
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "Clock LLC", contact_email: "ck@x.com", license_number: "LIC-C-7003" }
              as: Anonymous
              captures: { sub_c: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_c}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_c}"
              captures: { app_c: $.data.id }
            - call: "POST /prequal-applications/${app_c}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "Clock Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_c}" }
              as: LeadEstimator
              captures: { inv_c: $.data.id }
            - call: "POST /invitations/${inv_c}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_c}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
          trigger:
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_c}"
              captures: { bid_c: $.data.id }
          assert:
            - "HTTP 201 (default clock 2026-08-01T00:00:00Z < due) and Bid.${bid_c}.submitted_at == 2026-08-01T00:00:00Z"
            - "PrequalApplication.${app_c}.approved_at == 2026-08-01T00:00:00Z (default clock stamped the decision)"

