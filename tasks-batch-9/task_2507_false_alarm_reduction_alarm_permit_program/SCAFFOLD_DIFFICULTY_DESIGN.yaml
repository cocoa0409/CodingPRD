            - "hop 2: FalseAlarmIncident.${inc3}.occurrence_index == 2 (was 3) and assessed_fee_cents == 10000 (was 20000) with fee_basis.tier_base_cents == 10000"
            - "hop 2: FalseAlarmIncident.${inc1}.occurrence_index == 1 (unchanged; the renumbering stays contiguous)"
