              as_user_id: "picker-1"
              captures: { tote_id: $.data.id }
            - call: "POST /pick-tasks/${task_flat}/assign-tote"
              payload: { tote_id: "${tote_id}" }
              as: PickOperator
              as_user_id: "picker-1"
            - call: "POST /pick-tasks/${task_flat}/start-retrieval"
              as: PickOperator
              as_user_id: "picker-1"
            - call: "POST /pick-tasks/${task_cw}/assign-tote"
              payload: { tote_id: "${tote_id}" }
              as: PickOperator
              as_user_id: "picker-1"
            - call: "POST /pick-tasks/${task_cw}/start-retrieval"
              as: PickOperator
              as_user_id: "picker-1"
          trigger:
            - call: "POST /pick-tasks/${task_flat}/complete"
              payload: { picked_units: 2, actual_weight_grams: 1200 }
              as: PickOperator
              as_user_id: "picker-1"
            - call: "POST /pick-tasks/${task_cw}/complete"
              payload: { picked_units: 2, actual_weight_grams: 1200 }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { err_weight: $.data.error_id }
            - call: "POST /pick-tasks/${task_cw}/complete"
              payload: { picked_units: 2, actual_weight_grams: 1000 }
              as: PickOperator
              as_user_id: "picker-1"
