        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: credit_assessment_lag_vs_chargeback_method_diverge
          rationale: "That §1.8 instance runs both LAG_WEIGHTED and CHARGEBACK_WEIGHTED against one application and asserts the full divergence (1350 vs 960 bps, 21000000 vs 1000000 exposure, 24300000 vs 2000000 cap, CAPPED vs ROLLING) plus the re-pinning of the application by the later assessment."
      - name: reserve_pct_clamped_at_the_upper_bound
        claim_type: threshold_boundary
        excluded_because:
          difficulty_instance: reserve_pct_upper_clamp_over_four_additive_uplifts
          rationale: "The RESERVE_BPS_MAX clamp over base + lag + thin-file + mcc uplifts (3250 raw clamped to 2500) is exactly that §1.8 instance, which also asserts the CAPPED type flip the clamp produces."
      - name: chargeback_ratio_variants_serve_different_consumers
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: chargeback_ratio_count_variant_gates_amount_variant_forecasts
          rationale: "That §1.8 instance builds activity where COUNT_BASED sits below EXCESSIVE_BPS while AMOUNT_BASED sits above it, then shows the account staying ACTIVE while the forecast picks the higher pd tier - the whole point of the variant split."
      - name: settlement_hold_rounding_order
        claim_type: precision
        excluded_because:
          difficulty_instance: settlement_hold_rounds_per_day_line_not_per_period
          rationale: "The pinned round-then-sum order (three 100050-cent lines at 500 bps giving 15009 rather than 15008) is the subject of that §1.8 instance, including the resulting net_payout_cents."
      - name: waterfall_overflow_and_uncovered_loss
        claim_type: waterfall_overflow
        excluded_because:
          difficulty_instance: reserve_ledger_conservation_survives_a_loss_offset_overflow
          rationale: "That §1.8 instance drives the three-bucket waterfall past its capacity (hold 5000, settlement offset 95000, reserve offset 5000, uncovered 20000, net 0) and asserts the conservation invariant afterwards."
      - name: count_ratio_at_the_excessive_boundary
        claim_type: threshold_boundary
        excluded_because:
          difficulty_instance: count_based_ratio_exactly_at_excessive_threshold_restricts
          rationale: "The 89-bps / 90-bps pair around EXCESSIVE_BPS, with severity 60 then 90 and the CB-BREACH cascade firing only on the second, is precisely that §1.8 instance."
      - name: hold_maturity_boundary_is_inclusive
