              as_user_id: "${ba}"
            - call: "GET /liquidation/sale-orders"
              payload: { listing_id: "${lstp1}" }
              as: MarketplaceOps
              as_user_id: "ops-close-1"
              captures: { so1: "$.data[0].id", bps1: "$.data[0].buyer_premium_bps", prem1: "$.data[0].buyer_premium_cents", tot1: "$.data[0].total_due_cents" }
            - call: "POST /liquidation/listings/${lstp2}/bids"
              payload: { buyer_id: "${ba}", amount_cents: 1000001 }
              as: Buyer
              as_user_id: "${ba}"
            - call: "GET /liquidation/sale-orders"
              payload: { listing_id: "${lstp2}" }
