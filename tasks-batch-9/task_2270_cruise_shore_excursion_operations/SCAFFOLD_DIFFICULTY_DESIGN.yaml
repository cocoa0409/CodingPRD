            - call: "POST /shore-excursions/guests"
              payload: { full_name: "Ben Ortiz", birth_date: "1979-11-20T00:00:00Z", voyage_code: "V2609", mobility_level: "FULL", language_pref: "EN", loyalty_tier: "GOLD" }
              as: ShoreExcursionDesk
