  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # Two different non-linear shapes on two different entities: an alternating
  # revision loop with a hard round cap (QualityComplaint), and a
  # settle/reverse/re-settle cycle whose amount changes on the second pass
  # (ServiceVisit.verification_status).
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: complaint_alternates_diagnosing_and_awaiting_parts_until_round_cap_then_reopens
        grounds:
          - state_machines.QualityComplaint.OPEN_to_DIAGNOSING
          - state_machines.QualityComplaint.DIAGNOSING_to_AWAITING_PARTS
          - state_machines.QualityComplaint.AWAITING_PARTS_to_DIAGNOSING
          - state_machines.QualityComplaint.DIAGNOSING_to_RESOLVED
          - state_machines.QualityComplaint.RESOLVED_to_OPEN
          - validations[priority=49]
          - errors[ERR_DIAGNOSTIC_ROUNDS_EXHAUSTED]
          - calculations.yield_loss_estimate
        distinguishing_aspect: |
          Alternating revision loop with a counting termination condition: the
          complaint visits DIAGNOSING twice via AWAITING_PARTS, diagnostic_round
          climbs 1 -> 2 -> 3, the 4th round is refused with
          ERR_DIAGNOSTIC_ROUNDS_EXHAUSTED (422) while the status stays DIAGNOSING,
          and the later RESOLVED -> OPEN reopen resets diagnostic_round to 0 and
          settled_yield_loss_cents to null while provisional_yield_loss_cents
          stays frozen at 8640 — the loop re-arms without re-snapshotting intake.
        test_recipe:
          setup:
            - "ServiceAccount ACTIVE, no glycol system; ServiceContract ACTIVE with cleaning_frequency_days 21, contracted_line_count 4."
            - "BeerLine #1 created at 2026-08-01T00:00:00Z, IN_SERVICE, last_cleaned_at null (never cleaned), average_daily_throughput_liters 12.0 — so yield_loss_estimate falls back to created_at as baseline_at."
            - "Clock advanced to 2026-08-11T00:00:00Z, giving days_at_risk 10 at intake."
            - "QualityComplaint OPEN with symptom SLOW_POUR, diagnostic_round 0, reopen_count 0."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Loop Lounge", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id }
            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 1, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.375, beer_style_group: "ALE", average_daily_throughput_liters: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { line1: $.data.id }
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/quality-complaints"
              payload: { account_id: "${acct}", line_id: "${line1}", symptom: "SLOW_POUR" }
              as: VenueManager
              as_user_id: "${acct}"
              captures: { cmp: $.data.id }
          trigger:
            - call: "POST /draft-service/quality-complaints/${cmp}/diagnostic-round"
              payload: { outcome: "ROOT_CAUSE_FOUND", finding_code: "LINE_SOIL" }
              as: QualityAuditor
              as_user_id: "auditor-1"
            - call: "POST /draft-service/quality-complaints/${cmp}/diagnostic-round"
              payload: { outcome: "PARTS_REQUIRED", finding_code: "FAUCET_WEAR" }
              as: QualityAuditor
              as_user_id: "auditor-1"
            - call: "POST /draft-service/quality-complaints/${cmp}/diagnostic-round"
              payload: { outcome: "ROOT_CAUSE_FOUND", finding_code: "FAUCET_WEAR" }
              as: QualityAuditor
              as_user_id: "auditor-1"
            - call: "POST /draft-service/quality-complaints/${cmp}/diagnostic-round"
              payload: { outcome: "ROOT_CAUSE_FOUND", finding_code: "GAS_IMBALANCE" }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { err_cap: $.data.error_id }
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/quality-complaints/${cmp}/closure"
              payload: { disposition: "RESOLVED", measured_waste_liters: 4.0 }
              as: QualityAuditor
              as_user_id: "auditor-2"
            - call: "POST /draft-service/quality-complaints/${cmp}/reopen"
              payload: { reopen_reason: "Foam returned within a day of the repair." }
              as: VenueManager
              as_user_id: "${acct}"
          assert:
            - "QualityComplaint.${cmp}.days_at_risk == 10"
            - "QualityComplaint.${cmp}.provisional_yield_loss_liters == 18.00"
            - "QualityComplaint.${cmp}.provisional_yield_loss_cents == 8640"
            - "The 4th diagnostic-round call returns HTTP 422 with error_id ERR_DIAGNOSTIC_ROUNDS_EXHAUSTED"
            - "${err_cap} == ERR_DIAGNOSTIC_ROUNDS_EXHAUSTED"
            - "After the 3rd round and the refused 4th, QualityComplaint.${cmp}.diagnostic_round == 3"
            - "After the 3rd round and the refused 4th, QualityComplaint.${cmp}.last_finding_code == FAUCET_WEAR"
            - "After closure, QualityComplaint.${cmp}.settled_yield_loss_liters == 5.00"
            - "After closure, QualityComplaint.${cmp}.settled_yield_loss_cents == 2400"
            - "After reopen, QualityComplaint.${cmp}.status == OPEN"
            - "After reopen, QualityComplaint.${cmp}.reopen_count == 1"
            - "After reopen, QualityComplaint.${cmp}.diagnostic_round == 0"
            - "After reopen, QualityComplaint.${cmp}.settled_yield_loss_liters == null"
            - "After reopen, QualityComplaint.${cmp}.settled_yield_loss_cents == null"
            - "After reopen, QualityComplaint.${cmp}.measured_waste_liters == null"
            - "After reopen, QualityComplaint.${cmp}.resolved_at == null"
            - "After reopen, QualityComplaint.${cmp}.provisional_yield_loss_cents == 8640"
            - "After reopen, ServiceAccount.${acct}.open_complaint_count == 1"

      - name: verification_signs_disputes_and_resigns_at_a_different_amount
        grounds:
          - state_machines.ServiceVisit.verification_status.UNVERIFIED_to_SIGNED
          - state_machines.ServiceVisit.verification_status.SIGNED_to_DISPUTED
          - state_machines.ServiceVisit.verification_status.DISPUTED_to_SIGNED
          - state_machines.CleaningCycle.POSTED_to_VOIDED
          - calculations.visit_charge_settlement
          - calculations.brewer_funding_waterfall
          - validations[priority=25]
          - validations[priority=46]
        distinguishing_aspect: |
          Cyclic verification dimension where re-entering SIGNED is NOT idempotent:
          the first signature settles at 19881 with 9904 brewer-funded, the dispute
          drives settlement_state to REVERSED and zeroes all four money fields, a
          cycle voided while REVERSED drops passed_line_count from 2 to 1, and the
          re-signature settles the SAME visit at 15288 with 6230 funded — the loop
          returns to the same state name carrying a different payload, and
          provisional_charge_cents stays frozen at 24474 across all three hops.
        test_recipe:
          setup:
            - "BrewerProgram 'Northside Brewing' ACTIVE, funded_scope CLEANING_AND_PARTS, co_pay_bps 2000, funding_cap_cents 50000, consumed_cents 0."
            - "ServiceAccount ACTIVE; ServiceContract ACTIVE naming that program, cleaning_frequency_days 21 (multiplier 1.10), per_line_rate_cents 4175, visit_base_fee_cents 7500, contracted_line_count 4, funding_status BREWER_FUNDED, account billing_mode PROGRAM_BILL."
            - "Three BeerLine rows; lines #1 and #2 graded PASS and line #3 graded FAIL_CONTACT_TIME on this visit."
            - "One ComponentInspection with action_taken REPLACED consuming brewer-eligible FAUCET-88 at 3195 cents."
            - "ServiceVisit work_status WORK_COMPLETE at 2026-08-05T09:00:00Z with provisional_charge_cents 24474, verification_status UNVERIFIED, settlement_state UNSETTLED."
