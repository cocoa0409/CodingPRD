              as: PlatformAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /orgs/${org_id}/projects"
              payload: { title: "Game B", editor_version_id: "${ev_id}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/ship"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /projects/${proj_id}/install-reports"
              payload: { period_month: "2026-01", new_device_installs: 1000000, reinstalls: 0, bundle_installs: 0, expected_project_version: "${proj_v}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { rep_id: $.data.id }
