            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings"
              payload: { scheduled_on: "2026-12-20" }
              as: TeamLead
              captures: { m2_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m2_id}/convene"
