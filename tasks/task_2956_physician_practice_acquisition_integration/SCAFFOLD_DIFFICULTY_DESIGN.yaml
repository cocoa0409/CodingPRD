            - "A POST /readiness-tasks/${rt_id}/status with target_status IN_PROGRESS as IntegrationManager clears failure_reason to null and returns readiness_posture to AT_RISK"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  #   pair 1 : state (14) vs business_fiscal (45)
  #   pair 2 : business_safety (19) vs business_temporal (30)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_reextending_offer_with_depleted_pool
        grounds:
          - validations[priority=14]
          - validations[priority=45]
          - state_machines.StaffTransitionOffer.status.EXTENDED_to_ACCEPTED
          - calculations.retention_pool_ledger
          - calculations.retention_bonus_award
        distinguishing_aspect: |
          One request violates BOTH the `state` rule at priority 14
          (ERR_INVALID_STATE_TRANSITION, because the offer is already ACCEPTED and
          has no EXTENDED edge out of that state) and the `business_fiscal` rule at
          priority 45 (ERR_RETENTION_POOL_EXCEEDED, because retention_pool_available_cents
          is 0 while the offer's retention_bonus_cents is 210000). The state error
          must win — this is the state/business_fiscal pairing, distinct from the
          business_safety/business_temporal pairing of the other instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Acquisition in deal_status DILIGENCE with retention_pool_total_cents 1710000 and required_staff_headcount 5."
            - "Offer Y (MA): status ACCEPTED, retention_bonus_cents 210000, still holding its pool commitment."
            - "Offer X (PRACTICE_MANAGER): status EXTENDED, retention_bonus_cents 1500000."
            - "retention_pool_committed_cents 1710000 and retention_pool_available_cents 0 — the pool is exactly exhausted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 1710000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
            - call: "POST /staff-transition-offers"
              payload: { acquisition_id: "${acq_id}", staff_member_name: "Nia Carter", role_code: "MA", legacy_annual_wage_cents: 3600000, legacy_pto_hours: 40, credited_service_months: 30, offer_expires_on: "2026-10-31" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { offer_y_id: "$.data.id" }
            - call: "POST /staff-transition-offers"
              payload: { acquisition_id: "${acq_id}", staff_member_name: "Grace Okonkwo", role_code: "PRACTICE_MANAGER", legacy_annual_wage_cents: 12000000, legacy_pto_hours: 160, credited_service_months: 200, offer_expires_on: "2026-10-31" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { offer_x_id: "$.data.id" }
            - call: "POST /staff-transition-offers/${offer_y_id}/status"
              payload: { target_status: "EXTENDED" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /staff-transition-offers/${offer_y_id}/status"
              payload: { target_status: "ACCEPTED" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /staff-transition-offers/${offer_x_id}/status"
              payload: { target_status: "EXTENDED" }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "POST /staff-transition-offers/${offer_y_id}/status"
              payload: { target_status: "EXTENDED", note: "Attempting to re-extend an already accepted offer." }
              as: IntegrationManager
              as_user_id: "im-1"
          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION with HTTP 409 (priority 14 beats priority 45)"
            - "response error_id != ERR_RETENTION_POOL_EXCEEDED"
            - "StaffTransitionOffer.${offer_y_id}.offered_annual_wage_cents == 4200000 and wage_floor_applied == true and retention_bonus_cents == 210000"
            - "StaffTransitionOffer.${offer_x_id}.retention_bonus_cents == 1500000"
            - "StaffTransitionOffer.${offer_y_id}.status == ACCEPTED (unchanged by the rejected request)"
            - "Acquisition.${acq_id}.retention_pool_committed_cents == 1710000 and retention_pool_available_cents == 0 (unchanged)"
            - "Acquisition.${acq_id}.retention_pool_total_cents == Acquisition.${acq_id}.retention_pool_committed_cents + Acquisition.${acq_id}.retention_pool_available_cents"
            - "Acquisition.${acq_id}.hr_staffing_coverage_pct == 40.00 (two of five seats held)"

      - name: safety_beats_temporal_on_approving_over_percentile_plan_with_expired_opinion
        grounds:
          - validations[priority=19]
          - validations[priority=30]
          - state_machines.CompensationPlan.status.SUBMITTED_to_APPROVED
          - calculations.compensation_benchmark_percentile
          - calculations.fmv_concluded_value
