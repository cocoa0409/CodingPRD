      - name: instructor_hours_conservation_on_confirm_release
        grounds:
          - calculations.instructor_committed_hours
          - state_machines.InstructorAssignment.PROPOSED_to_CONFIRMED
          - state_machines.InstructorAssignment.CONFIRMED_to_RELEASED
          - entities.Instructor.fields.committed_hours
        distinguishing_aspect: |
          Conserved quantity: instructor hours (not money). A confirm (+2.0h) followed by
          its compensating release (-2.0h) leaves committed_hours unchanged at its prior
          value; the field always equals SUM(hours) over CONFIRMED assignments on PLANNED
          sessions.
        test_recipe:
          setup:
            - "SIGNED agreement; cohort with sessions S1 (2h) and S2 (1.5h), instructor INS confirmed on both -> committed_hours == 3.5"
          setup_api_calls:
            - call: "POST /ct/employers"
              payload: { legal_name: "Psi Co", industry_code: "713110", contact_email: "hr@psi.example" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { emp: $.data.id }
            - call: "POST /ct/employers/${emp}/needs-assessments"
              payload: { title: "Rec", skill_gaps: ["rec"], target_roles: ["lead"], curriculum_modules: [{ code: "REC-1", hours: 3.5, required_credential_codes: [] }] }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { na: $.data.id }
            - call: "POST /ct/needs-assessments/${na}/submit"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/needs-assessments/${na}/approve"
              payload: {}
              as: CollegeAdmin
              as_user_id: "adm-01"
            - call: "POST /ct/employers/${emp}/training-agreements"
              payload: { needs_assessment_id: "${na}", pricing_model: "FLAT_COHORT", delivery_mode: "ON_SITE", est_participant_count: 2, est_delivery_hours: 3.5, target_start_date: "2026-06-15T00:00:00Z", max_cohorts: 2 }
