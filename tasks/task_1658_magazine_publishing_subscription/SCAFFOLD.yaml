scenario: |
  Magazine Publishing & Subscription Fulfillment (consumer magazine publisher): issue production calendar & ad close dates, subscriber file & label generation for print run, renewal series & gift subscription handling, controlled vs paid circulation qualification, back issue & single-copy sales, postal class & mailing compliance, digital edition entitlement, deferred revenue & liability accounting

domain_name: magazine-publishing-subscription
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Publication
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Publication title" }
      - { name: issn, type: string, source: input, description: "International Standard Serial Number, 8 chars" }
      - { name: frequency, type: enum, source: input, description: "WEEKLY | MONTHLY | QUARTERLY — determines issues_per_year" }
      - { name: circulation_model, type: enum, source: input, description: "PAID | CONTROLLED | MIXED — governs subscriber qualification" }
      - { name: issues_per_year, type: integer, source: computed, description: "Derived from frequency: WEEKLY=52, MONTHLY=12, QUARTERLY=4" }
      - { name: base_cover_price_cents, type: integer, source: input, description: "Default single-copy cover price in cents" }
      - { name: deferred_revenue_method, type: enum, source: input, default: "PRO_RATA_ISSUE", description: "PRO_RATA_ISSUE | STRAIGHT_LINE_MONTH — which recognition variant is authoritative for this publication" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CEASED" }

  - name: Issue
    parent: Publication
    common_fields: true
    fields:
      - { name: publication_id, type: string, source: system, description: "FK -> Publication.id" }
      - { name: issue_number, type: integer, source: input, description: "Sequential issue number within volume" }
      - { name: volume_number, type: integer, source: input, description: "Volume number" }
      - { name: cover_date, type: datetime, source: input, description: "Cover date displayed on masthead (ISO8601)" }
      - { name: editorial_close_date, type: datetime, source: input, description: "Editorial deadline (ISO8601)" }
      - { name: ad_close_date, type: datetime, source: input, description: "Advertising close deadline (ISO8601); must be >= editorial_close_date" }
      - { name: ship_to_printer_date, type: datetime, source: input, description: "Date files ship to printer (ISO8601)" }
      - { name: mail_date, type: datetime, source: input, description: "Scheduled USPS tender date (ISO8601)" }
      - { name: ad_pages_sold, type: integer, source: input, default: 0, description: "Total advertising pages sold for this issue" }
      - { name: print_run_override, type: integer, source: input, default: null, description: "Optional override; if null, print_run computed from qualified subscriber count + newsstand buffer" }
      - { name: print_run, type: integer, source: computed, description: "Final print quantity; = print_run_override if set, else qualified_subscriber_count + newsstand_buffer" }
      - { name: qualified_subscriber_count, type: integer, source: computed, description: "Count of subscriptions qualified for this issue at label-generation time (snapshot)" }
      - { name: newsstand_buffer_copies, type: integer, source: input, default: 0, description: "Newsstand / single-copy buffer included in print_run" }
      - { name: revenue_recognized_cents, type: integer, source: computed, description: "Sum of deferred revenue recognized against this issue across all SubscriptionTerms" }
      - { name: status, type: enum, source: system, description: "PLANNING → EDITORIAL_CLOSED → AD_CLOSED → AT_PRINTER → MAILED → FINALIZED; may revert AD_CLOSED → EDITORIAL_CLOSED" }

  - name: Subscriber
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Subscriber email, unique per publication" }
      - { name: full_name, type: string, source: input, description: "Subscriber full name" }
      - { name: address_line1, type: string, source: input, description: "Mailing address line 1" }
      - { name: address_line2, type: string, source: input, default: null, description: "Mailing address line 2" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: state_code, type: string, source: input, description: "US state code, 2 chars" }
      - { name: postal_code, type: string, source: input, description: "ZIP or ZIP+4" }
      - { name: country_code, type: string, source: input, default: "US", description: "ISO 3166-1 alpha-2; non-US triggers foreign surcharge" }
      - { name: is_deliverable, type: boolean, source: computed, description: "False if postal address invalid per USPS CASS or on NCOA suppression" }
      - { name: circulation_class, type: enum, source: computed, description: "PAID_QUALIFIED | CONTROLLED_QUALIFIED | NON_QUALIFIED — derived from active Subscription.qualification_tier" }

  - name: Subscription
    parent: Subscriber
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id" }
      - { name: publication_id, type: string, source: system, description: "FK -> Publication.id" }
      - { name: start_issue_id, type: string, source: input, description: "FK -> Issue.id; first issue to be served" }
      - { name: term_issues, type: integer, source: input, description: "Number of issues purchased in current term (e.g. 12 for 1-year monthly)" }
      - { name: price_paid_cents, type: integer, source: input, description: "Amount paid for the current term (0 for controlled)" }
      - { name: qualification_tier, type: enum, source: input, description: "PAID | CONTROLLED | COMPLIMENTARY — drives circulation_class on Subscriber" }
      - { name: payment_method, type: enum, source: input, default: "CARD", description: "CARD | CHECK | INVOICE | NONE — NONE only allowed when qualification_tier=CONTROLLED or COMPLIMENTARY" }
      - { name: is_gift, type: boolean, source: input, default: false, description: "True if purchased as gift; requires donor_subscriber_id" }
      - { name: donor_subscriber_id, type: string, source: input, default: null, description: "FK -> Subscriber.id; present iff is_gift=true" }
      - { name: renewal_series_code, type: string, source: system, description: "Code of the active RenewalSeries driving renewal efforts" }
      - { name: renewal_effort_number, type: integer, source: computed, description: "Index (1..N) of the next renewal effort to send; 0 = none sent yet" }
      - { name: issues_served, type: integer, source: computed, description: "Count of issues already MAILED to this subscription within current term" }
      - { name: issues_remaining, type: integer, source: computed, description: "term_issues - issues_served - issues_suspended_count; floor 0" }
      - { name: issues_suspended_count, type: integer, source: computed, description: "Number of issues skipped while SUSPENDED" }
      - { name: auto_renew, type: boolean, source: input, default: false, description: "Whether subscription auto-renews at expiry" }
      - { name: expire_action, type: enum, source: input, default: "EXPIRE", description: "EXPIRE | CONVERT_TO_CONTROLLED — behavior at natural term end" }
      - { name: status, type: enum, source: system, description: "PENDING_START → ACTIVE → SUSPENDED ⇄ ACTIVE → GRACE → EXPIRED | CANCELLED | RENEWED" }

  - name: SubscriptionTerm
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id" }
      - { name: term_index, type: integer, source: computed, description: "1-based index of this term within the subscription; increments on renewal" }
      - { name: term_start_issue_id, type: string, source: system, description: "FK -> Issue.id" }
      - { name: term_end_issue_id, type: string, source: computed, description: "FK -> Issue.id; computed as term_start + term_issues - 1 sequential issues" }
      - { name: issues_in_term, type: integer, source: system, description: "Number of issues in this term" }
      - { name: gross_amount_cents, type: integer, source: system, description: "Cash received for this term" }
      - { name: deferred_balance_cents, type: integer, source: computed, description: "Unrecognized revenue remaining; decremented on each issue MAILED" }
      - { name: recognized_balance_cents, type: integer, source: computed, description: "Cumulative revenue recognized against this term" }
      - { name: recognition_variant, type: enum, source: system, description: "PRO_RATA_ISSUE | STRAIGHT_LINE_MONTH — snapshot of Publication.deferred_revenue_method at term start; does not change mid-term" }
      - { name: status, type: enum, source: system, description: "OPEN → FULLY_RECOGNIZED | REFUNDED | PARTIALLY_REFUNDED" }

  - name: RenewalSeries
    parent: Publication
    common_fields: true
    fields:
      - { name: publication_id, type: string, source: system, description: "FK -> Publication.id" }
      - { name: series_code, type: string, source: input, description: "Unique series code (e.g. 'STD3', 'PREMIUM5')" }
      - { name: effort_offsets_days, type: array, source: input, description: "Ordered array of day offsets before expiry at which each effort fires, e.g. [-90, -60, -30, -7]" }
      - { name: effort_pricing_cents, type: array, source: input, description: "Parallel array: renewal price offered at each effort; must match length of effort_offsets_days" }
      - { name: max_efforts, type: integer, source: computed, description: "len(effort_offsets_days)" }
      - { name: is_default, type: boolean, source: input, default: false, description: "Only one default per publication" }

  - name: RenewalEvent
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id" }
      - { name: series_code, type: string, source: system, description: "FK -> RenewalSeries.series_code (denormalized for audit)" }
      - { name: effort_number, type: integer, source: system, description: "1-based effort index fired" }
      - { name: sent_at, type: datetime, source: system, description: "Timestamp effort was sent" }
      - { name: offered_price_cents, type: integer, source: system, description: "Price offered in this effort" }
      - { name: response, type: enum, source: system, description: "PENDING → ACCEPTED | DECLINED | EXPIRED" }
      - { name: responded_at, type: datetime, source: system, default: null, description: "Timestamp of subscriber response" }

  - name: MailingBatch
    parent: Issue
    common_fields: true
    fields:
      - { name: issue_id, type: string, source: system, description: "FK -> Issue.id" }
      - { name: batch_label, type: string, source: input, description: "Human label, e.g. 'DOMESTIC', 'FOREIGN', 'NEWSSTAND'" }
      - { name: postal_class, type: enum, source: input, description: "PERIODICAL | STANDARD | FIRST_CLASS — drives postage calc and compliance rules" }
      - { name: entry_point, type: enum, source: input, default: "ORIGIN", description: "ORIGIN | DDU | DSCF | SCF — drop-ship entry point affecting rate" }
      - { name: expected_piece_count, type: integer, source: computed, description: "Count of MailingLabel rows generated for this batch" }
      - { name: total_postage_cents, type: integer, source: computed, description: "Sum over labels of per-piece postage" }
      - { name: permit_number, type: string, source: input, description: "USPS permit imprint number" }
      - { name: is_controlled_copy_included, type: boolean, source: input, default: true, description: "Whether controlled (free) copies ride this batch; PERIODICAL class requires paid percentage >= 50%" }
      - { name: status, type: enum, source: system, description: "DRAFT → LABELS_GENERATED → POSTAL_VERIFIED → TENDERED → CONFIRMED" }

  - name: MailingLabel
    parent: MailingBatch
    common_fields: false
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> MailingBatch.id" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id" }
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id (denormalized for sortation)" }
      - { name: address_block, type: string, source: computed, description: "Formatted multi-line mailing address at generation time (snapshot)" }
      - { name: postal_code, type: string, source: computed, description: "ZIP+4 at generation time" }
      - { name: is_controlled_copy, type: boolean, source: computed, description: "True if Subscription.qualification_tier == CONTROLLED or COMPLIMENTARY at generation" }
      - { name: piece_weight_oz, type: number, source: input, description: "Piece weight in ounces" }
      - { name: postage_cents, type: integer, source: computed, description: "Computed per-piece postage via postal_rate calculation" }

  - name: PostalStatement
    parent: MailingBatch
    common_fields: false
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> MailingBatch.id" }
      - { name: form_number, type: enum, source: system, description: "PS_3541 | PS_3541_A | PS_3602_R — derived from postal_class" }
      - { name: paid_piece_count, type: integer, source: computed, description: "Count of labels with is_controlled_copy=false" }
      - { name: controlled_piece_count, type: integer, source: computed, description: "Count of labels with is_controlled_copy=true" }
      - { name: paid_percentage_bps, type: integer, source: computed, description: "paid_piece_count / (paid + controlled) * 10000, integer basis points, truncated" }
      - { name: advertising_percentage_bps, type: integer, source: computed, description: "ad_pages_sold / total_pages * 10000 — Periodical rate requires <= 75% ad content" }
      - { name: total_postage_cents, type: integer, source: computed, description: "Mirror of MailingBatch.total_postage_cents at filing time" }
      - { name: filed_at, type: datetime, source: system, description: "When statement was generated (immutable)" }

  - name: BackIssueOrder
    parent: Subscriber
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id" }
      - { name: issue_id, type: string, source: input, description: "FK -> Issue.id; issue being ordered" }
      - { name: quantity, type: integer, source: input, description: "Copies ordered; > 0" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Snapshot of Issue publication's base_cover_price_cents at order time, times back_issue_markup (1.5 if issue cover_date > 12 months in past, else 1.0)" }
      - { name: shipping_cents, type: integer, source: computed, description: "Flat shipping based on destination country_code" }
      - { name: total_charged_cents, type: integer, source: computed, description: "quantity * unit_price_cents + shipping_cents" }
      - { name: is_recognized_revenue, type: boolean, source: computed, description: "True once DELIVERED; back-issue revenue is recognized immediately, not deferred" }
      - { name: status, type: enum, source: system, description: "PENDING → FULFILLED → SHIPPED → DELIVERED | CANCELLED | REFUNDED" }

  - name: DigitalEntitlement
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id" }
      - { name: issue_id, type: string, source: system, description: "FK -> Issue.id" }
      - { name: access_level, type: enum, source: system, description: "FULL | PREVIEW | NONE — derived from subscription state at grant time" }
      - { name: granted_at, type: datetime, source: system, description: "When entitlement was granted" }
      - { name: revoked_at, type: datetime, source: system, default: null, description: "When entitlement was revoked (e.g. on REFUNDED)" }
      - { name: revocation_reason, type: enum, source: system, default: null, description: "REFUND | CHARGEBACK | MANUAL — null while active" }

  - name: DeferredRevenueEntry
    parent: SubscriptionTerm
    common_fields: false
    fields:
      - { name: subscription_term_id, type: string, source: system, description: "FK -> SubscriptionTerm.id" }
      - { name: issue_id, type: string, source: system, description: "FK -> Issue.id against which revenue is recognized" }
      - { name: recognized_at, type: datetime, source: system, description: "Timestamp of recognition (issue mail_date under PRO_RATA_ISSUE; month-end under STRAIGHT_LINE_MONTH)" }
      - { name: amount_cents, type: integer, source: computed, description: "Revenue recognized in this entry; sign positive for recognition, negative for reversal" }
      - { name: variant, type: enum, source: system, description: "PRO_RATA_ISSUE | STRAIGHT_LINE_MONTH — variant used" }
      - { name: entry_type, type: enum, source: system, description: "RECOGNITION | REVERSAL | REFUND_LIQUIDATION" }

  - name: CirculationAuditRecord
    parent: Publication
    common_fields: true
    fields:
      - { name: publication_id, type: string, source: system, description: "FK -> Publication.id" }
      - { name: audit_period_start, type: datetime, source: input, description: "Start of 6-month audit period" }
      - { name: audit_period_end, type: datetime, source: input, description: "End of 6-month audit period; must be > start" }
      - { name: total_distribution, type: integer, source: computed, description: "Sum of issues mailed during period" }
      - { name: paid_distribution, type: integer, source: computed, description: "Sum where Subscriber.circulation_class == PAID_QUALIFIED" }
      - { name: controlled_distribution, type: integer, source: computed, description: "Sum where Subscriber.circulation_class == CONTROLLED_QUALIFIED" }
      - { name: paid_percentage_bps, type: integer, source: computed, description: "paid_distribution / total_distribution * 10000, truncated" }
      - { name: qualification_result, type: enum, source: computed, description: "QUALIFIED | NON_QUALIFIED | PENDING — derived per AAM/BPA rules: PAID pubs require >= 70% paid, CONTROLLED pubs require <= 30% paid" }
      - { name: status, type: enum, source: system, description: "DRAFT → FILED → AUDIT_PASSED | AUDIT_FAILED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Publication
    initial_state: ACTIVE
    terminal_states: [CEASED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /publications/{publicationId}/suspend
        actor: PublishingDirector
        preconditions:
          - "All Issues must be in {FINALIZED} or {PLANNING, EDITORIAL_CLOSED} (i.e., no Issue in AD_CLOSED/AT_PRINTER/MAILED) — else ERR_ISSUE_PIPELINE_ACTIVE"
        side_effects:
          - "All ACTIVE Subscriptions on this Publication → SUSPENDED (cascade)"
          - "All PENDING RenewalEvents for those subscriptions → EXPIRED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /publications/{publicationId}/resume
        actor: PublishingDirector
        preconditions: []
        side_effects:
          - "All SUSPENDED Subscriptions on this Publication → ACTIVE"
          - "Recompute Subscription.issues_remaining (no credit for suspended period)"

      - from: ACTIVE
        to: CEASED
        trigger: POST /publications/{publicationId}/cease
        actor: PublishingDirector
        preconditions:
          - "All Issues FINALIZED — ERR_ISSUE_PIPELINE_ACTIVE"
          - "All Subscriptions in terminal state {EXPIRED, CANCELLED, RENEWED} — ERR_ACTIVE_SUBSCRIPTIONS_REMAIN"
          - "All SubscriptionTerms have deferred_balance_cents == 0 — ERR_UNRECOGNIZED_DEFERRED_REVENUE"
        side_effects:
          - "Publication becomes read-only"

  - entity: Issue
    initial_state: PLANNING
    terminal_states: [FINALIZED]
    transitions:
      - from: PLANNING
        to: EDITORIAL_CLOSED
        trigger: POST /publications/{publicationId}/issues/{issueId}/close-editorial
        actor: ProductionManager
        preconditions:
          - "current_utc >= editorial_close_date — ERR_EDITORIAL_NOT_CLOSED_YET"
          - "Publication.status == ACTIVE — ERR_PUBLICATION_NOT_ACTIVE"
        side_effects:
          - "Issue.updated_at refreshed"

      - from: EDITORIAL_CLOSED
        to: AD_CLOSED
        trigger: POST /publications/{publicationId}/issues/{issueId}/close-ads
        actor: ProductionManager
        preconditions:
          - "current_utc >= ad_close_date — ERR_AD_CLOSE_NOT_REACHED"
          - "Issue.ad_pages_sold > 0 OR Publication.circulation_model == CONTROLLED — ERR_NO_AD_PAGES"
        side_effects:
          - "Freeze ad_pages_sold (further edits rejected with ERR_AD_CLOSE_LOCKED)"

      - from: AD_CLOSED
        to: EDITORIAL_CLOSED
        trigger: POST /publications/{publicationId}/issues/{issueId}/reopen-ads
        actor: ProductionManager
        preconditions:
          - "No MailingBatch on this Issue has left DRAFT — ERR_BATCH_ALREADY_GENERATED"
        side_effects:
          - "Unfreeze ad_pages_sold"

      - from: AD_CLOSED
        to: AT_PRINTER
        trigger: POST /publications/{publicationId}/issues/{issueId}/ship-to-printer
        actor: ProductionManager
        preconditions:
          - "current_utc >= ship_to_printer_date — ERR_PRINTER_DATE_NOT_REACHED"
        side_effects:
          - "Compute Issue.qualified_subscriber_count = count of Subscriptions where status == ACTIVE AND start_issue_id <= issue_sequence AND issues_remaining > 0"
          - "Compute Issue.print_run = print_run_override OR (qualified_subscriber_count + newsstand_buffer_copies)"

      - from: AT_PRINTER
        to: MAILED
        trigger: POST /publications/{publicationId}/issues/{issueId}/mark-mailed
        actor: FulfillmentManager
        preconditions:
          - "All MailingBatches on this Issue in {CONFIRMED} — ERR_BATCH_NOT_CONFIRMED"
          - "current_utc >= mail_date — ERR_MAIL_DATE_NOT_REACHED"
        side_effects:
          - "For every served Subscription: issues_served += 1, issues_remaining -= 1"
          - "For every served Subscription's OPEN SubscriptionTerm: post DeferredRevenueEntry with entry_type=RECOGNITION, amount computed per recognition_variant"
          - "Issue.revenue_recognized_cents = sum of recognition entries posted for this issue"
          - "For every served Subscription: if issues_remaining == 0 → status := GRACE (unless auto_renew=true, in which case auto-create new SubscriptionTerm and status := RENEWED)"
          - "For every served Subscription with is_gift=true: create DigitalEntitlement for recipient with access_level=FULL"

      - from: MAILED
        to: FINALIZED
        trigger: POST /publications/{publicationId}/issues/{issueId}/finalize
        actor: ProductionManager
        preconditions:
          - "All served Subscriptions have had their DeferredRevenueEntries posted (reconciliation check)"
        side_effects:
          - "Lock issue from further state change"

  - entity: Subscription
    initial_state: PENDING_START
    terminal_states: [EXPIRED, CANCELLED, RENEWED]
    transitions:
      - from: PENDING_START
        to: ACTIVE
        trigger: POST /publications/{publicationId}/subscriptions/{subscriptionId}/activate
        actor: CirculationManager
        preconditions:
          - "Publication.status == ACTIVE — ERR_PUBLICATION_NOT_ACTIVE"
          - "If qualification_tier == PAID: price_paid_cents > 0 AND payment_method != NONE — ERR_PAID_REQUIRES_PAYMENT"
          - "If qualification_tier == CONTROLLED: price_paid_cents == 0 — ERR_CONTROLLED_MUST_BE_FREE"
          - "Subscriber.is_deliverable == true — ERR_UNDELIVERABLE_ADDRESS"
        side_effects:
          - "Create SubscriptionTerm with term_index=1, recognition_variant = Publication.deferred_revenue_method (snapshot), deferred_balance_cents = price_paid_cents"
          - "Update Subscriber.circulation_class: PAID → PAID_QUALIFIED; CONTROLLED/COMPLIMENTARY → CONTROLLED_QUALIFIED"
          - "Schedule first RenewalEvent if Publication has default RenewalSeries"

      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /publications/{publicationId}/subscriptions/{subscriptionId}/suspend
        actor: CirculationManager
        preconditions:
          - "Publication.status == ACTIVE — else it would already be suspended by cascade"
        side_effects:
          - "No issues are served while SUSPENDED (label generation skips)"
          - "Pending RenewalEvents stay PENDING but will not be acted on"

      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /publications/{publicationId}/subscriptions/{subscriptionId}/resume
        actor: CirculationManager
        preconditions:
          - "Publication.status == ACTIVE — ERR_PUBLICATION_NOT_ACTIVE"
          - "Subscriber.is_deliverable == true — ERR_UNDELIVERABLE_ADDRESS"
        side_effects:
          - "issues_suspended_count incremented by issues missed during suspension (computed at resume time)"
          - "issues_remaining recomputed"

      - from: ACTIVE
        to: GRACE
        trigger: "system (automatic when issues_remaining reaches 0 on issue MAILED)"
        actor: system
        preconditions: []
        side_effects:
          - "If auto_renew=true: skip GRACE, go directly to RENEWED via auto-renew path"

      - from: GRACE
        to: EXPIRED
        trigger: "system (automatic 30 days after entering GRACE, computed via current_utc)"
        actor: system
        preconditions:
          - "current_utc >= entered_grace_at + 30 days"
        side_effects:
          - "Final RenewalEvent (if any PENDING) → EXPIRED"
          - "If expire_action == CONVERT_TO_CONTROLLED: create new Subscription with qualification_tier=CONTROLLED, price_paid_cents=0, status=ACTIVE (cyclic regeneration)"

      - from: GRACE
        to: RENEWED
        trigger: POST /publications/{publicationId}/subscriptions/{subscriptionId}/renew
        actor: CirculationManager
        preconditions:
          - "Payment accepted for the renewal term (price > 0 recorded)"
        side_effects:
          - "Create new SubscriptionTerm with term_index += 1, recognition_variant re-snapshotted from Publication.deferred_revenue_method"
          - "issues_served := 0; issues_remaining := new term_issues"
          - "Most recent PENDING RenewalEvent → ACCEPTED"
          - "status := ACTIVE (immediately, not via GRACE) — treated as RENEWED terminal marker on old term; new term drives ACTIVE"

      - from: ACTIVE
        to: CANCELLED
        trigger: POST /publications/{publicationId}/subscriptions/{subscriptionId}/cancel
        actor: CirculationManager
        preconditions: []
        side_effects:
          - "Compute refund = floor(deferred_balance_cents * REFUND_RATE) (default REFUND_RATE = 1.0 unless within first issue served, then 0.9)"
          - "Post DeferredRevenueEntry with entry_type=REFUND_LIQUIDATION, amount_cents = -(deferred_balance_cents) (zero out liability)"
          - "SubscriptionTerm.status := REFUNDED if full, PARTIALLY_REFUNDED if partial"
          - "All PENDING RenewalEvents → EXPIRED"
          - "Revoke all DigitalEntitlements with revocation_reason=REFUND"
          - "Subscriber.circulation_class recomputed (if no other active subscriptions → NON_QUALIFIED)"

  - entity: MailingBatch
    initial_state: DRAFT
    terminal_states: [CONFIRMED]
    transitions:
      - from: DRAFT
        to: LABELS_GENERATED
        trigger: POST /publications/{publicationId}/issues/{issueId}/mailing-batches/{batchId}/generate-labels
        actor: FulfillmentManager
        preconditions:
          - "Issue.status == AT_PRINTER — ERR_ISSUE_NOT_AT_PRINTER"
          - "Batch has no labels yet — ERR_LABELS_ALREADY_GENERATED"
        side_effects:
          - "Create one MailingLabel per Subscription where status == ACTIVE AND publication matches AND issues_remaining > 0 AND Subscriber.is_deliverable == true, filtered by batch inclusion rules (batch_label=DOMESTIC → country_code == US; FOREIGN → != US; NEWSSTAND → no subscription)"
          - "Compute per-label postage_cents via postal_rate calculation"
          - "MailingBatch.expected_piece_count = count(labels); total_postage_cents = sum(postage_cents)"

      - from: LABELS_GENERATED
        to: POSTAL_VERIFIED
        trigger: POST /publications/{publicationId}/issues/{issueId}/mailing-batches/{batchId}/verify-postal
        actor: PostalComplianceOfficer
        preconditions:
          - "If postal_class == PERIODICAL: computed paid_percentage_bps >= 5000 (50%) — ERR_PAID_RATIO_BELOW_MINIMUM"
          - "If postal_class == PERIODICAL: advertising_percentage_bps <= 7500 (75%) — ERR_AD_CONTENT_EXCEEDS_LIMIT"
          - "If postal_class == STANDARD and is_controlled_copy_included == true: ERR_STANDARD_NO_CONTROLLED"
        side_effects:
          - "Create PostalStatement (immutable snapshot)"
          - "If Publication.circulation_model == PAID and paid_percentage < 70%: flag publication for audit"

      - from: POSTAL_VERIFIED
        to: TENDERED
        trigger: POST /publications/{publicationId}/issues/{issueId}/mailing-batches/{batchId}/tender
        actor: FulfillmentManager
        preconditions:
          - "current_utc >= Issue.mail_date - 1 day — ERR_TENDER_TOO_EARLY"
        side_effects: []

      - from: TENDERED
        to: CONFIRMED
        trigger: POST /publications/{publicationId}/issues/{issueId}/mailing-batches/{batchId}/confirm
        actor: PostalComplianceOfficer
        preconditions: []
        side_effects:
          - "Mark batch immutable"

  - entity: BackIssueOrder
    initial_state: PENDING
    terminal_states: [DELIVERED, CANCELLED, REFUNDED]
    transitions:
      - from: PENDING
        to: FULFILLED
        trigger: POST /publications/{publicationId}/back-issue-orders/{orderId}/fulfill
        actor: FulfillmentManager
        preconditions:
          - "Issue.status == FINALIZED — ERR_ISSUE_NOT_FINALIZED"
          - "Sufficient inventory (newsstand_buffer_copies - already-sold > quantity) — ERR_INSUFFICIENT_INVENTORY"
        side_effects:
          - "Decrement available newsstand inventory (computed field)"

      - from: FULFILLED
        to: SHIPPED
        trigger: POST /publications/{publicationId}/back-issue-orders/{orderId}/ship
        actor: FulfillmentManager
        preconditions: []
        side_effects: []

      - from: SHIPPED
        to: DELIVERED
        trigger: POST /publications/{publicationId}/back-issue-orders/{orderId}/deliver
        actor: FulfillmentManager
        preconditions: []
        side_effects:
          - "is_recognized_revenue := true (back-issue sales recognized immediately, NOT deferred)"

      - from: PENDING
        to: CANCELLED
        trigger: POST /publications/{publicationId}/back-issue-orders/{orderId}/cancel
        actor: CirculationManager
        preconditions: []
        side_effects: []

      - from: DELIVERED
        to: REFUNDED
        trigger: POST /publications/{publicationId}/back-issue-orders/{orderId}/refund
        actor: CirculationManager
        preconditions: []
        side_effects:
          - "Refund total_charged_cents"
          - "Increment newsstand inventory (return to stock)"

  - entity: RenewalEvent
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "system (on successful Subscription.renew matching this effort)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING
        to: DECLINED
        trigger: POST /publications/{publicationId}/subscriptions/{subscriptionId}/renewal-events/{eventId}/decline
        actor: CirculationManager
        preconditions: []
        side_effects:
          - "Subscription.renewal_effort_number incremented"

      - from: PENDING
        to: EXPIRED
        trigger: "system (when next effort fires OR subscription cancels OR expires)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CirculationAuditRecord
    initial_state: DRAFT
    terminal_states: [AUDIT_PASSED, AUDIT_FAILED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: POST /publications/{publicationId}/circulation-audits/{auditId}/file
        actor: CirculationManager
        preconditions:
          - "All Issues whose mail_date falls within [audit_period_start, audit_period_end] are FINALIZED — ERR_UNFILED_ISSUES_IN_PERIOD"
        side_effects:
          - "Compute total_distribution, paid_distribution, controlled_distribution, paid_percentage_bps, qualification_result"

      - from: FILED
        to: AUDIT_PASSED
        trigger: POST /publications/{publicationId}/circulation-audits/{auditId}/pass
        actor: PublishingDirector
        preconditions:
          - "qualification_result == QUALIFIED — ERR_AUDIT_NOT_QUALIFIED"
        side_effects: []

      - from: FILED
        to: AUDIT_FAILED
        trigger: POST /publications/{publicationId}/circulation-audits/{auditId}/fail
        actor: PublishingDirector
        preconditions:
          - "qualification_result == NON_QUALIFIED — ERR_AUDIT_NOT_FAILED"
        side_effects:
          - "If Publication.circulation_model == PAID and audit failed: Publication → SUSPENDED (cascade)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: sub-renew-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /publications/{publicationId}/subscriptions/{subscriptionId}/renew"
    occ_field: "expected_subscription_version"
    description: |
      Renewing a Subscription whose version has advanced since the client last
      observed it is rejected. This captures the case where a renewal effort
      (or an automatic GRACE transition) has mutated the subscription since
      the operator read it, so the operator's renewal payload is stale.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412

  - rule_id: issue-close-stale-issue
    parent_entity: Issue
    write_endpoint: "POST /publications/{publicationId}/issues/{issueId}/close-ads"
    occ_field: "expected_issue_version"
    description: |
      Closing ads on an Issue whose version has advanced since the client last
      observed it is rejected. This captures the case where a concurrent
      editorial update or ad_pages_sold adjustment has mutated the issue, so
      the close-ads request is operating on stale state.
    error_id: ERR_STALE_ISSUE_VERSION
    http_status: 412

  - rule_id: label-gen-stale-batch
    parent_entity: MailingBatch
    write_endpoint: "POST /publications/{publicationId}/issues/{issueId}/mailing-batches/{batchId}/generate-labels"
    occ_field: "expected_batch_version"
    description: |
      Generating labels against a MailingBatch whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another operator has modified batch attributes (e.g. postal_class or
      entry_point) since the client last read the batch.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: deferred_revenue_pro_rata_issue
    trigger: "Issue transitions AT_PRINTER → MAILED, for each served Subscription's OPEN SubscriptionTerm"
    algorithm: waterfall_allocation
    formula: |
      # Per-issue recognition under PRO_RATA_ISSUE variant.
      # Round per-issue THEN accumulate; the final issue's recognition absorbs rounding residual.
      issues_total = SubscriptionTerm.issues_in_term
      issues_recognized_so_far = count of DeferredRevenueEntry with entry_type=RECOGNITION on this term
      if issues_recognized_so_far < issues_total - 1:
        amount_cents = round_half_up(gross_amount_cents / issues_total)
      else:
        # final issue: absorb residual so that recognized_balance_cents + deferred_balance_cents == gross_amount_cents
        amount_cents = gross_amount_cents - recognized_balance_cents
      post DeferredRevenueEntry(amount_cents=amount_cents, entry_type=RECOGNITION, variant=PRO_RATA_ISSUE)
      SubscriptionTerm.recognized_balance_cents += amount_cents
      SubscriptionTerm.deferred_balance_cents -= amount_cents
    input_set: "All Subscriptions where status == ACTIVE AND issues_remaining > 0 AND a label was generated for this issue"
    precision: "integer cents, round_half_up at division step; residual absorbed by final issue"

  - name: deferred_revenue_straight_line_month
    trigger: "Month-end batch (system cron) OR Issue transitions AT_PRINTER → MAILED (whichever the publication configures); for each served SubscriptionTerm with variant == STRAIGHT_LINE_MONTH"
    algorithm: chronological
    formula: |
      # Recognize 1/N of gross_amount_cents per calendar month spanned by the term,
      # where N = ceil(issues_in_term / issues_per_month). issues_per_month derived
      # from Publication.frequency (MONTHLY=1, WEEKLY≈4.33 → use 4, QUARTERLY=1/3 → N computed differently).
      # For determinism: term spans N months where N = ceil(issues_in_term / issues_per_month_floor).
      # Recognize floor(gross / N) per month, with the final month absorbing the residual.
      # Compared to PRO_RATA_ISSUE: same total, different per-period timing — amounts differ per issue.
      issues_per_month = case Publication.frequency of
        WEEKLY -> 4
        MONTHLY -> 1
        QUARTERLY -> 1  # treated as 1 issue per 3-month span; N = issues_in_term * 3
      if Publication.frequency == QUARTERLY:
        N = issues_in_term * 3
      else:
        N = ceil(issues_in_term / issues_per_month)
      base_amount = floor(gross_amount_cents / N)
      residual = gross_amount_cents - base_amount * N
      # On recognition event for month M:
      if is_final_month:
        amount_cents = base_amount + residual
      else:
        amount_cents = base_amount
    input_set: "All OPEN SubscriptionTerms with recognition_variant == STRAIGHT_LINE_MONTH whose term covers the closing month"
    precision: "integer cents, floor division, residual in final month"

  - name: postal_rate_per_piece
    trigger: "MailingBatch LABELS_GENERATED, per MailingLabel"
    algorithm: tiered_pricing
    formula: |
      # Per-piece postage as function of postal_class, entry_point, piece_weight_oz, is_controlled_copy.
      # Tiered by weight; entry_point applies a discount multiplier; controlled copies pay a premium under PERIODICAL.
      base_cents = case postal_class of
        PERIODICAL ->
          if piece_weight_oz <= 3.3: 28
          elif piece_weight_oz <= 6.0: 41
          elif piece_weight_oz <= 10.0: 58
          else: 58 + 7 * ceil(piece_weight_oz - 10.0)
        STANDARD ->
          if piece_weight_oz <= 3.3: 52
          elif piece_weight_oz <= 6.0: 74
          else: 74 + 11 * ceil(piece_weight_oz - 6.0)
        FIRST_CLASS ->
          if piece_weight_oz <= 1.0: 68
          elif piece_weight_oz <= 2.0: 92
          elif piece_weight_oz <= 3.0: 116
          else: 116 + 24 * ceil(piece_weight_oz - 3.0)
      entry_discount_bps = case entry_point of
        ORIGIN -> 0
        DDU -> 2100     # 21% discount
        DSCF -> 1300    # 13%
        SCF -> 700      # 7%
      controlled_surcharge_bps = if is_controlled_copy and postal_class == PERIODICAL then 500 else 0
      postage_cents = round_half_up(base_cents * (10000 - entry_discount_bps + controlled_surcharge_bps) / 10000)
    input_set: "Each MailingLabel at generation time"
    constants:
      ROUND_MODE: round_half_up
    precision: "integer cents, round_half_up at final multiplication step (NOT at base_cents lookup)"

  - name: gift_subscription_credit_transfer
    trigger: "Subscription created with is_gift=true AND donor has an active PAID Subscription on same publication"
    algorithm: constraint_propagation
    formula: |
      # When a donor gifts a subscription, the donor's existing SubscriptionTerm receives a credit
      # equal to GIFT_CREDIT_BPS (basis points) of the gift's price_paid_cents, capped at donor's
      # remaining deferred_balance_cents. The credit is applied as a NEGATIVE DeferredRevenueEntry
      # of entry_type=RECOGNITION (accelerating donor's recognition) — this is the "credit" variant.
      # Alternative "liability" variant (GIFT_CREDIT_MODE=LIABILITY) would reduce donor's gross_amount_cents.
      # We pin CREDIT mode for this scaffold.
      credit_cents = min(
        round_half_up(gift.price_paid_cents * GIFT_CREDIT_BPS / 10000),
        donor_open_term.deferred_balance_cents
      )
      post DeferredRevenueEntry on donor's OPEN term:
        entry_type = RECOGNITION
        amount_cents = credit_cents
        variant = donor_term.recognition_variant
      donor_term.recognized_balance_cents += credit_cents
      donor_term.deferred_balance_cents -= credit_cents
    constants:
      GIFT_CREDIT_BPS: 1000   # 10% of gift price
      GIFT_CREDIT_MODE: CREDIT
    precision: "integer cents, round_half_up; capped by donor's deferred_balance"

  - name: paid_percentage_bps
    trigger: "PostalStatement creation AND CirculationAuditRecord filing"
    algorithm: aggregation
    formula: |
      # Integer basis points, truncated (floor), NOT rounded.
      # paid_percentage_bps = floor(paid_count * 10000 / total_count)
      # Edge case: total_count == 0 → 0 bps (and validation separately forbids filing an empty statement).
      if total_count == 0:
        paid_percentage_bps = 0
      else:
        paid_percentage_bps = floor(paid_count * 10000 / total_count)
    precision: "integer basis points, floor (truncate) — differs from round_half_up used elsewhere; pinned explicitly"

  - name: renewal_offer_price
    trigger: "RenewalEvent creation (per effort)"
    algorithm: threshold
    formula: |
      # effort_pricing_cents indexed by (effort_number - 1); beyond max_efforts, no further events fire.
      # Boundary: effort_number must satisfy 1 <= effort_number <= max_efforts, else no event.
      if 1 <= effort_number <= max_efforts:
        offered_price_cents = effort_pricing_cents[effort_number - 1]
      else:
        no event fires
    input_set: "Subscriptions entering the renewal window (current_utc >= expiry - effort_offsets_days[effort_number - 1])"
    precision: "integer cents; no rounding"

  - name: back_issue_unit_price
    trigger: "BackIssueOrder creation"
    algorithm: threshold
    formula: |
      # Cover price snapshot at order time, with markup for back issues > 12 months old.
      age_months = months_between(Issue.cover_date, current_utc)
      if age_months > 12:
        unit_price_cents = round_half_up(Publication.base_cover_price_cents * BACK_ISSUE_MARKUP_BPS / 10000)
      else:
        unit_price_cents = Publication.base_cover_price_cents
    constants:
      BACK_ISSUE_MARKUP_BPS: 15000  # 1.5x
    precision: "integer cents, round_half_up"

  - name: issue_print_run
    trigger: "Issue AD_CLOSED → AT_PRINTER"
    algorithm: aggregation
    formula: |
      # qualified_subscriber_count: count of Subscriptions on this Publication where
      #   status == ACTIVE AND Subscriber.is_deliverable == true AND issues_remaining > 0
      # print_run: if print_run_override is set (non-null), use it; else qualified_subscriber_count + newsstand_buffer_copies.
      # Boundary: print_run must be >= qualified_subscriber_count (a smaller override is rejected with ERR_PRINT_RUN_TOO_SMALL).
      if print_run_override is not null:
        if print_run_override < qualified_subscriber_count:
          reject ERR_PRINT_RUN_TOO_SMALL
        print_run = print_run_override
      else:
        print_run = qualified_subscriber_count + newsstand_buffer_copies
    precision: "integer copies"

  - name: refund_on_cancel
    trigger: "Subscription ACTIVE → CANCELLED"
    algorithm: threshold
    formula: |
      # REFUND_RATE depends on issues_served:
      #   issues_served == 0            → full refund of deferred_balance_cents (rate 1.0)
      #   1 <= issues_served <= 3       → 90% of deferred_balance_cents (rate 0.9)
      #   issues_served > 3             → 50% of deferred_balance_cents (rate 0.5)
      # Refund is rounded via floor (publisher-friendly); the unrefunded remainder is recognized immediately.
      rate_bps = case issues_served of
        0 -> 10000
        1 | 2 | 3 -> 9000
        _ -> 5000
      refund_cents = floor(deferred_balance_cents * rate_bps / 10000)
      recognized_top_up = deferred_balance_cents - refund_cents   # recognized immediately
      post DeferredRevenueEntry(amount_cents=recognized_top_up, entry_type=RECOGNITION)
      post DeferredRevenueEntry(amount_cents=-deferred_balance_cents, entry_type=REFUND_LIQUIDATION)
    precision: "integer cents, floor on refund multiplication"

  - name: circulation_audit_qualification
    trigger: "CirculationAuditRecord DRAFT → FILED"
    algorithm: threshold
    formula: |
      # AAM/BPA-style qualification:
      #   PAID publication: QUALIFIED iff paid_percentage_bps >= 7000 (70%)
      #   CONTROLLED publication: QUALIFIED iff paid_percentage_bps <= 3000 (30%)
      #   MIXED publication: QUALIFIED iff 3000 <= paid_percentage_bps <= 7000
      # Boundary: exactly 7000 is QUALIFIED for PAID; exactly 3000 is QUALIFIED for CONTROLLED.
      case Publication.circulation_model of
        PAID -> QUALIFIED iff paid_percentage_bps >= 7000 else NON_QUALIFIED
        CONTROLLED -> QUALIFIED iff paid_percentage_bps <= 3000 else NON_QUALIFIED
        MIXED -> QUALIFIED iff 3000 <= paid_percentage_bps <= 7000 else NON_QUALIFIED
    precision: "integer basis points"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must have permission to perform this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path IDs must exist, validated left-to-right (Publication → Issue → MailingBatch; Subscriber → Subscription; etc.)"
    error_id: "ERR_PUBLICATION_NOT_FOUND | ERR_ISSUE_NOT_FOUND | ERR_SUBSCRIBER_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_RENEWAL_EVENT_NOT_FOUND | ERR_SERIES_NOT_FOUND"
    http_status: 404
    applies_to: all nested endpoints

  - priority: 4
    category: state
    check: "Resource lifecycle state must permit the requested operation (e.g., Issue must be AD_CLOSED to ship-to-printer, Subscription must be ACTIVE to suspend)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version must match the parent's current version"
    error_id: "ERR_STALE_SUBSCRIPTION_VERSION | ERR_STALE_ISSUE_VERSION | ERR_STALE_BATCH_VERSION"
    http_status: 412
    applies_to: "POST .../renew, POST .../close-ads, POST .../generate-labels"

  - priority: 6
    category: business_temporal
    check: "Date-driven preconditions (current_utc >= deadline) for close-editorial, close-ads, ship-to-printer, mark-mailed, tender"
    error_id: "ERR_EDITORIAL_NOT_CLOSED_YET | ERR_AD_CLOSE_NOT_REACHED | ERR_PRINTER_DATE_NOT_REACHED | ERR_MAIL_DATE_NOT_REACHED | ERR_TENDER_TOO_EARLY"
    http_status: 409
    applies_to: Issue lifecycle action endpoints, MailingBatch.tender

  - priority: 7
    category: business_referential
    check: "Gift subscriptions must reference an existing donor_subscriber_id on the same Publication; start_issue_id must be a valid Issue on the same Publication"
    error_id: "ERR_DONOR_NOT_FOUND | ERR_INVALID_START_ISSUE"
    http_status: 422
    applies_to: "POST /publications/{pid}/subscribers/{sid}/subscriptions"

  - priority: 8
    category: business_constraint
    check: "Subscription.qualification_tier vs payment consistency: PAID requires price_paid_cents > 0 AND payment_method != NONE; CONTROLLED requires price_paid_cents == 0"
    error_id: "ERR_PAID_REQUIRES_PAYMENT | ERR_CONTROLLED_MUST_BE_FREE"
    http_status: 422
    applies_to: "POST /subscriptions, POST .../activate"

  - priority: 9
    category: business_safety
    check: "Postal compliance: PERIODICAL class requires paid_percentage_bps >= 5000 AND advertising_percentage_bps <= 7500; STANDARD class forbids controlled copies"
    error_id: "ERR_PAID_RATIO_BELOW_MINIMUM | ERR_AD_CONTENT_EXCEEDS_LIMIT | ERR_STANDARD_NO_CONTROLLED"
    http_status: 422
    applies_to: "POST .../verify-postal"

  - priority: 10
    category: business_constraint
    check: "Issue.ad_pages_sold must be > 0 for PAID/MIXED publications at close-ads (CONTROLLED pubs may close with 0 ads)"
    error_id: ERR_NO_AD_PAGES
    http_status: 422
    applies_to: "POST .../close-ads"

  - priority: 11
    category: business_constraint
    check: "print_run_override, if set, must be >= qualified_subscriber_count"
    error_id: ERR_PRINT_RUN_TOO_SMALL
    http_status: 422
    applies_to: "POST .../ship-to-printer"

  - priority: 12
    category: business_fiscal
    check: "BackIssueOrder: newsstand inventory (newsstand_buffer_copies - sold) must be >= quantity"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 422
    applies_to: "POST .../back-issue-orders, POST .../fulfill"

  - priority: 13
    category: business_fiscal
    check: "Publication cease: all SubscriptionTerms must have deferred_balance_cents == 0"
    error_id: ERR_UNRECOGNIZED_DEFERRED_REVENUE
    http_status: 409
    applies_to: "POST /publications/{id}/cease"

  - priority: 14
    category: business_constraint
    check: "Audit period end must be strictly greater than start; only one DRAFT audit per publication at a time"
    error_id: "ERR_INVALID_AUDIT_PERIOD | ERR_DRAFT_AUDIT_EXISTS"
    http_status: 422
    applies_to: "POST /publications/{id}/circulation-audits"

  - priority: 15
    category: business_temporal
    check: "RenewalEvent can only fire when current_utc crosses the effort's offset window; firing early rejected"
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST .../renewal-events (system-fired, but manual trigger via admin endpoint rejects early fire)"

  - priority: 16
    category: business_constraint
    check: "Pagination: 1 <= limit <= 100, offset >= 0"
    error_id: ERR_INVALID_PAGINATION_PARAMETERS
    http_status: 400
    applies_to: all list endpoints

  - priority: 17
    category: business_constraint
    check: "Required input fields present and well-typed (e.g. issn exactly 8 chars, state_code exactly 2 chars, quantity > 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all POST/PUT endpoints

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any set) is exactly 2026-08-01T00:00:00Z; never falls back to wall-clock."
    roles: [PublishingDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Update logical clock"
      - "Trigger any time-based system transitions whose preconditions are now satisfied (e.g., GRACE → EXPIRED when 30 days elapsed)"

  # --- Publication ---
  - method: POST
    path: "/publications"
    description: "Create a Publication"
    roles: [PublishingDirector]
    code: 201
    input: [title, issn, frequency, circulation_model, base_cover_price_cents, "deferred_revenue_method?"]
