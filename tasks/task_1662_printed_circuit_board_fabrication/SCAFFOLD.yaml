scenario: |
  Printed-Circuit-Board Fabrication (bare board): stackup & impedance control, panelization & array yield, drill program & aspect ratio limit, surface finish selection & cost, electrical test & coupon microsection, quick-turn lane & premium pricing, laminate lot & date-code traceability, scrap/AOI defect Pareto

domain_name: "pcb-fabrication"
api_prefix: "/pcb"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (16 entities)
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Legal company name" }
      - { name: contact_email, type: string, source: input, description: "Unique contact email", constraints: "unique across Customer" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum open credit in cents; release gate compares FabOrder.provisional_total_cents against it", constraints: ">= 0" }
      - { name: tax_exempt, type: boolean, source: input, description: "Tax exemption flag (pricing is pre-tax; carried for invoice display)", default: false }

  - name: QuickTurnLane
    parent: null
    common_fields: true
    fields:
      - { name: lane_code, type: string, source: input, description: "Unique lane code", constraints: "unique; e.g. QT3 / QT5" }
      - { name: turn_days, type: integer, source: input, description: "Promised business turn time in days", constraints: ">= 1" }
      - { name: capacity_boards_per_day, type: integer, source: input, description: "Aggregate board capacity committed per calendar ship-date", constraints: ">= 1" }
      - { name: premium_multiplier, type: number, source: input, description: "Price multiplier applied to the rounded subtotal (e.g. 1.50)", constraints: ">= 1.0" }
      - { name: active, type: boolean, source: input, description: "Inactive lanes reject new order references and releases", default: true }

  - name: LaminateLot
    parent: null
    common_fields: true
    fields:
      - { name: material_code, type: enum, source: input, description: "Laminate material family", constraints: "FR4_TG135 | FR4_TG170 | ROGERS_4350" }
      - { name: lot_code, type: string, source: input, description: "Supplier lot code", constraints: "unique across LaminateLot" }
      - { name: manufacture_date, type: datetime, source: input, description: "Laminate manufacture date (date-code basis)" }
      - { name: panels_total, type: integer, source: input, description: "Total panels received in this lot", constraints: ">= 1" }
      - { name: panels_reserved, type: integer, source: system, description: "Panels currently held by LaminateReservation rows in RESERVED status", default: 0 }
      - { name: panels_consumed, type: integer, source: system, description: "Panels permanently consumed by production starts", default: 0 }
      - { name: panels_available, type: integer, source: computed, description: "panels_total - panels_reserved - panels_consumed; conservation invariant" }
      - { name: expiry_date, type: datetime, source: computed, description: "manufacture_date + SHELF_LIFE_DAYS(365); lot usable only while logical clock < expiry_date" }
      - { name: status, type: enum, source: system, description: "Lot lifecycle", constraints: "RECEIVED | QUALIFIED | DEPLETED | EXPIRED | QUARANTINED" }
      - { name: qualified_at, type: datetime, source: system, description: "Clock timestamp when qualified", default: null }

  - name: FabOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: order_number, type: string, source: system, description: "Human order number PCB-000001, assigned sequentially by created_at order" }
      - { name: service_lane, type: enum, source: input, description: "Standard or quick-turn service", constraints: "STANDARD | QUICK_TURN" }
      - { name: quick_turn_lane_id, type: string, source: input, description: "FK -> QuickTurnLane.id; required iff service_lane == QUICK_TURN, must be null otherwise", default: null }
      - { name: board_x_mils, type: integer, source: input, description: "Single-board width in mils", constraints: "> 0" }
      - { name: board_y_mils, type: integer, source: input, description: "Single-board height in mils", constraints: "> 0" }
      - { name: layer_count, type: integer, source: input, description: "Copper layer count", constraints: "one of 2, 4, 6, 8" }
      - { name: surface_finish, type: enum, source: input, description: "Surface finish selection; drives finish cost line", constraints: "HASL | OSP | ENIG | IMMERSION_SILVER | HARD_GOLD" }
      - { name: quantity_boards, type: integer, source: input, description: "Ordered good boards", constraints: ">= 1" }
      - { name: requested_ship_date, type: datetime, source: input, description: "Requested ship date; must be strictly after the logical clock at creation; lane capacity keys on this date" }
      - { name: fab_status, type: enum, source: system, description: "Production pipeline dimension (state machine A)", constraints: "QUOTED | DFM_REVIEW | AWAITING_LAMINATE | RELEASED | IN_PRODUCTION | ON_HOLD | AWAITING_ETEST | COMPLETED | SHIPPED | CANCELLED" }
      - { name: quality_disposition, type: enum, source: system, description: "Quality dimension evolving independently of fab_status (state machine B)", constraints: "PENDING | PASSED | FAILED | CONDITIONAL" }
      - { name: boards_scrapped, type: integer, source: system, description: "Boards scrapped by final coupon failures", default: 0 }
      - { name: laminate_lot_codes, type: array, source: computed, description: "Sorted-ASC distinct lot_code list of this order's CONSUMED reservations (date-code traceability)" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "PROVISIONAL pricing variant; null until a PanelArray is RELEASED; recomputed on array release and on stackup lock", default: null }

  - name: Stackup
    parent: FabOrder
    common_fields: true
    fields:
      - { name: fab_order_id, type: string, source: input, description: "FK -> FabOrder.id; owning order" }
      - { name: revision, type: integer, source: input, description: "Stackup revision number", constraints: ">= 1" }
      - { name: total_thickness_mils, type: number, source: input, description: "Finished board thickness in mils; numerator of the aspect-ratio check", constraints: "> 0" }
      - { name: dielectric_material, type: enum, source: input, description: "Dielectric material", constraints: "FR4_TG135 | FR4_TG170 | ROGERS_4350" }
      - { name: copper_weight_oz, type: integer, source: input, description: "Copper weight; selects aspect-ratio ceiling (1oz -> 8.0, 2oz -> 6.0)", constraints: "1 | 2" }
      - { name: impedance_controlled, type: boolean, source: input, description: "When true, lock requires >= 1 ImpedanceSpecLine", default: false }
      - { name: status, type: enum, source: system, description: "DRAFT -> LOCKED; LOCKED superseded when a newer stackup locks", constraints: "DRAFT | LOCKED | SUPERSEDED" }

  - name: ImpedanceSpecLine
    parent: Stackup
    common_fields: true
    fields:
      - { name: stackup_id, type: string, source: input, description: "FK -> Stackup.id; owning stackup" }
      - { name: layer_name, type: string, source: input, description: "Copper layer label, e.g. L1" }
      - { name: target_ohms, type: number, source: input, description: "Target impedance", constraints: "> 0" }
      - { name: tolerance_plus_ohms, type: number, source: input, description: "Inclusive upper tolerance", constraints: ">= 0" }
      - { name: tolerance_minus_ohms, type: number, source: input, description: "Inclusive lower tolerance", constraints: ">= 0" }
      - { name: line_type, type: enum, source: input, description: "Selects coupon disposition variant: SINGLE_ENDED -> SINGLE, DIFFERENTIAL -> STATISTICAL", constraints: "SINGLE_ENDED | DIFFERENTIAL" }
      - { name: coupon_required, type: boolean, source: input, description: "When true, complete-fab requires a PASSED coupon for this line", default: true }

  - name: PanelArray
    parent: FabOrder
    common_fields: true
    fields:
      - { name: fab_order_id, type: string, source: input, description: "FK -> FabOrder.id; owning order" }
      - { name: array_x, type: integer, source: input, description: "Boards across per panel", constraints: ">= 1" }
      - { name: array_y, type: integer, source: input, description: "Boards down per panel", constraints: ">= 1" }
      - { name: panel_width_mils, type: integer, source: input, description: "Panel width including rails", constraints: "> 0" }
      - { name: panel_height_mils, type: integer, source: input, description: "Panel height including rails", constraints: "> 0" }
      - { name: boards_per_panel, type: integer, source: computed, description: "array_x * array_y" }
      - { name: array_yield, type: number, source: computed, description: "max(0.50, 1 - 0.01 * board_area_sqin); 4dp" }
      - { name: good_boards_per_panel, type: integer, source: computed, description: "floor(boards_per_panel * array_yield); 0 blocks release with ERR_ARRAY_YIELD_ZERO" }
      - { name: panels_required, type: integer, source: computed, description: "ceil(order.quantity_boards / good_boards_per_panel)" }
      - { name: utilization_pct, type: number, source: computed, description: "round_half_up(100 * boards_per_panel * board_area_sqin / panel_area_sqin, 2)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> RELEASED; SUPERSEDED by a newer create; CANCELLED with the order", constraints: "DRAFT | RELEASED | SUPERSEDED | CANCELLED" }

  - name: DrillProgram
    parent: FabOrder
    common_fields: true
    fields:
      - { name: fab_order_id, type: string, source: input, description: "FK -> FabOrder.id; owning order" }
      - { name: revision, type: integer, source: input, description: "Program revision; auto-incremented by revise", constraints: ">= 1" }
      - { name: min_hole_mils, type: number, source: input, description: "Smallest drilled hole in mils; process minimum 6 is enforced at approve time, not at create", constraints: "> 0" }
      - { name: hole_count, type: integer, source: input, description: "Total drilled holes", constraints: ">= 1" }
      - { name: plated_aspect_ratio, type: number, source: computed, description: "locked stackup total_thickness_mils / min_hole_mils; ceiling 8.0 (1oz) / 6.0 (2oz), inclusive" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating CAMOperator; segregation-of-duties anchor" }
      - { name: rejection_reason, type: string, source: system, description: "Reason captured on reject; cleared on revise", default: null }
      - { name: status, type: enum, source: system, description: "Cyclic review loop DRAFT -> UNDER_REVIEW -> {APPROVED, REJECTED -> DRAFT}; CANCELLED with the order", constraints: "DRAFT | UNDER_REVIEW | APPROVED | REJECTED | CANCELLED" }

  - name: LaminateReservation
    parent: null
    common_fields: true
    fields:
      - { name: fab_order_id, type: string, source: input, description: "FK -> FabOrder.id; reserving order" }
      - { name: panel_array_id, type: string, source: input, description: "FK -> PanelArray.id; array whose panels_required this reservation covers; must belong to fab_order_id" }
      - { name: laminate_lot_id, type: string, source: input, description: "FK -> LaminateLot.id; source lot" }
      - { name: panels_allocated, type: integer, source: input, description: "Panels drawn from the lot", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "RESERVED -> CONSUMED (production start) | RELEASED (cancel / expiry cascade / manual release)", constraints: "RESERVED | CONSUMED | RELEASED" }

  - name: LaneSlotCommitment
    parent: QuickTurnLane
    common_fields: true
    fields:
      - { name: lane_id, type: string, source: system, description: "FK -> QuickTurnLane.id; owning lane" }
      - { name: ship_date, type: datetime, source: system, description: "Calendar date (UTC midnight) the commitment keys on" }
      - { name: committed_boards, type: integer, source: system, description: "Sum of quantity_boards of lane orders with this ship_date in {RELEASED, IN_PRODUCTION, ON_HOLD, AWAITING_ETEST, COMPLETED}", default: 0 }

  - name: ImpedanceCoupon
    parent: FabOrder
    common_fields: true
    fields:
      - { name: fab_order_id, type: string, source: input, description: "FK -> FabOrder.id; owning order" }
      - { name: spec_line_id, type: string, source: input, description: "FK -> ImpedanceSpecLine.id; spec under test; at most one non-CANCELLED coupon per spec line" }
      - { name: panel_ref, type: string, source: input, description: "Panel reference label the coupon was cut from" }
      - { name: status, type: enum, source: system, description: "AWAITING_MEASURE -> {PASSED, FAILED}; FAILED with retest_count < MAX_RETESTS(2) may retest back to AWAITING_MEASURE; FAILED with retest_count == 2 is final; CANCELLED with the order", constraints: "AWAITING_MEASURE | PASSED | FAILED | CANCELLED" }
      - { name: retest_count, type: integer, source: system, description: "Retests consumed; each retest adds RETEST_FEE_CENTS(1500) to the FINAL invoice", default: 0 }
      - { name: latest_measured_ohms, type: number, source: system, description: "Most recent primary reading", default: null }
      - { name: disposition_basis, type: enum, source: system, description: "Variant used for the last evaluation: SINGLE (latest reading) or STATISTICAL (both legs + spread)", default: null }

  - name: CouponMeasurement
    parent: ImpedanceCoupon
    common_fields: false
    fields:
      - { name: coupon_id, type: string, source: input, description: "FK -> ImpedanceCoupon.id; measured coupon" }
      - { name: lab_slot_booking_id, type: string, source: input, description: "FK -> LabSlotBooking.id; booking that authorized the measurement (transitioned to COMPLETED)" }
      - { name: measured_ohms, type: number, source: input, description: "Primary reading (single leg for SINGLE_ENDED, leg A for DIFFERENTIAL)", constraints: "> 0" }
      - { name: measured_ohms_b, type: number, source: input, description: "Leg B reading; required iff the spec line is DIFFERENTIAL, ignored otherwise", default: null }
      - { name: measured_at, type: datetime, source: system, description: "Logical clock at record time" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL per the coupon's disposition variant at record time", constraints: "PASS | FAIL" }

  - name: LabSlotBooking
    parent: null
    common_fields: true
    fields:
      - { name: coupon_id, type: string, source: input, description: "FK -> ImpedanceCoupon.id; coupon the microsection session is booked for" }
      - { name: station, type: enum, source: input, description: "Lab station resource", constraints: "MICROSECTION_A" }
      - { name: starts_at, type: datetime, source: input, description: "Half-open window start; past-dated windows are allowed (sessions may be logged retroactively)" }
      - { name: ends_at, type: datetime, source: input, description: "Half-open window end; 0 < duration <= 120 minutes" }
      - { name: status, type: enum, source: system, description: "BOOKED -> COMPLETED (measurement) | CANCELLED (manual or cascade)", constraints: "BOOKED | COMPLETED | CANCELLED" }

  - name: ElecTestRun
    parent: FabOrder
    common_fields: true
    fields:
      - { name: fab_order_id, type: string, source: input, description: "FK -> FabOrder.id; tested order" }
      - { name: fixture_id, type: string, source: input, description: "Test fixture identifier" }
      - { name: test_voltage, type: number, source: input, description: "Applied test voltage", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> RUNNING -> {COMPLETED_PASS, COMPLETED_FAIL}; CANCELLED with the order", constraints: "SCHEDULED | RUNNING | COMPLETED_PASS | COMPLETED_FAIL | CANCELLED" }
      - { name: boards_tested, type: integer, source: system, description: "Boards through the fixture", default: 0 }
      - { name: boards_failed, type: integer, source: system, description: "Boards failing e-test", default: 0 }
      - { name: opens_found, type: integer, source: system, description: "Open nets found", default: 0 }
      - { name: shorts_found, type: integer, source: system, description: "Shorted nets found", default: 0 }

  - name: DefectRecord
    parent: null
    common_fields: false
    fields:
      - { name: fab_order_id, type: string, source: input, description: "FK -> FabOrder.id; order the defect was detected on" }
      - { name: panel_array_id, type: string, source: input, description: "FK -> PanelArray.id; array the defect was detected on; must belong to fab_order_id" }
      - { name: defect_code, type: enum, source: input, description: "AOI/manual defect taxonomy; IMPEDANCE is reserved for system-auto records from final coupon failures", constraints: "OPEN | SHORT | SPACING | DRILL_BREAKOUT | PLATING_VOID | SOLDERMASK | CONTAMINATION | OVERETCH | IMPEDANCE" }
      - { name: severity, type: enum, source: input, description: "Pareto includes only MAJOR and SCRAP", constraints: "COSMETIC | MINOR | MAJOR | SCRAP" }
      - { name: boards_affected, type: integer, source: input, description: "Boards impacted", constraints: ">= 1" }
      - { name: detected_at, type: datetime, source: input, description: "Detection timestamp; Pareto window membership key (half-open)" }
      - { name: source, type: enum, source: input, description: "Detection channel", constraints: "AOI | MANUAL | ETEST" }

  - name: Invoice
    parent: FabOrder
    common_fields: true
    fields:
      - { name: fab_order_id, type: string, source: input, description: "FK -> FabOrder.id; billed order; at most one Invoice per order" }
      - { name: actual_panels_run, type: integer, source: input, description: "Actual panels run through production (FINAL variant panel basis)", constraints: ">= 1" }
      - { name: line_items, type: array, source: computed, description: "Per-line rounded amounts: base, finish, impedance, retest fees" }
      - { name: retest_fees_cents, type: integer, source: computed, description: "1500 * sum of retest_count over the order's coupons" }
      - { name: total_cents, type: integer, source: computed, description: "FINAL pricing variant total" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED -> PAID", constraints: "DRAFT | ISSUED | PAID" }

# =============================================================================
# §1.2 State Machine Table (11 machines; FabOrder carries two parallel dimensions)
# =============================================================================
state_machines:
  - entity: FabOrder
    dimension: fab_status
    initial_state: QUOTED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: QUOTED
        to: DFM_REVIEW
        trigger: "POST /pcb/fab-orders/{id}/submit-dfm"
        actor: Customer | SalesEngineer
        preconditions: ["an order Stackup with status LOCKED exists (else ERR_STACKUP_NOT_LOCKED)"]
        side_effects: ["FabOrder.version += 1"]
      - from: DFM_REVIEW
        to: QUOTED
        trigger: "POST /pcb/fab-orders/{id}/dfm-reject"
        actor: ProcessEngineer
        preconditions: []
        side_effects: ["FabOrder.version += 1"]
      - from: DFM_REVIEW
        to: AWAITING_LAMINATE
        trigger: "POST /pcb/fab-orders/{id}/dfm-approve"
        actor: ProcessEngineer
        preconditions: []
        side_effects: ["FabOrder.version += 1"]
      - from: AWAITING_LAMINATE
        to: RELEASED
        trigger: "POST /pcb/fab-orders/{id}/release"
        actor: ProductionPlanner
        preconditions:
          - "latest DrillProgram (by revision) has status APPROVED (else ERR_DRILL_NOT_APPROVED)"
          - "a PanelArray with status RELEASED exists (else ERR_PANEL_NOT_RELEASED)"
          - "sum of panels_allocated over this order's RESERVED reservations >= panels_required of the RELEASED array (else ERR_INSUFFICIENT_LAMINATE)"
          - "every lot referenced by RESERVED reservations has status QUALIFIED (else ERR_LOT_NOT_QUALIFIED)"
          - "if service_lane == QUICK_TURN: lane active (else ERR_LANE_INACTIVE) and committed_boards(lane, requested_ship_date) + quantity_boards <= capacity_boards_per_day (else ERR_LANE_CAPACITY_EXCEEDED)"
          - "provisional_total_cents <= customer.credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "QUICK_TURN only: upsert LaneSlotCommitment(lane, requested_ship_date) and committed_boards += quantity_boards"
          - "FabOrder.version += 1"
      - from: RELEASED
        to: IN_PRODUCTION
        trigger: "POST /pcb/fab-orders/{id}/start-production"
        actor: ProductionPlanner
        preconditions: []
        side_effects:
          - "every RESERVED reservation of the order -> CONSUMED; for each: lot.panels_reserved -= panels_allocated, lot.panels_consumed += panels_allocated, lot.version += 1"
          - "any lot reaching panels_available == 0 transitions QUALIFIED -> DEPLETED"
          - "FabOrder.version += 1"
      - from: IN_PRODUCTION
        to: ON_HOLD
        trigger: "POST /pcb/fab-orders/{id}/hold"
        actor: ProductionPlanner
        preconditions: []
        side_effects: ["FabOrder.version += 1"]
      - from: ON_HOLD
        to: IN_PRODUCTION
        trigger: "POST /pcb/fab-orders/{id}/unhold (production hold: the order has CONSUMED reservations covering panels_required)"
        actor: ProductionPlanner
        preconditions: ["order has CONSUMED reservations"]
        side_effects: ["FabOrder.version += 1"]
      - from: ON_HOLD
        to: AWAITING_LAMINATE
        trigger: "POST /pcb/fab-orders/{id}/unhold (material hold: no CONSUMED reservations yet)"
        actor: ProductionPlanner
        preconditions: ["order has no CONSUMED reservations", "RESERVED coverage >= panels_required (else ERR_INSUFFICIENT_LAMINATE)"]
        side_effects: ["FabOrder.version += 1"]
      - from: AWAITING_LAMINATE
        to: ON_HOLD
        trigger: "system: a RESERVED reservation leaves RESERVED status and coverage drops below panels_required (lot-expiry cascade or manual release)"
        actor: system
        preconditions: []
        side_effects: ["FabOrder.version += 1"]
      - from: IN_PRODUCTION
        to: AWAITING_ETEST
        trigger: "POST /pcb/fab-orders/{id}/complete-fab"
        actor: ProductionPlanner
        preconditions:
          - "quality_disposition IN {PENDING, PASSED} (else ERR_DISPOSITION_FAILED)"
          - "every coupon_required spec line of the LOCKED stackup has a coupon with status PASSED (else ERR_COUPON_NOT_PASSED)"
        side_effects: ["quality_disposition := PASSED", "FabOrder.version += 1"]
      - from: AWAITING_ETEST
        to: COMPLETED
        trigger: "system: an ElecTestRun of this order reaches COMPLETED_PASS"
        actor: system
        preconditions: []
        side_effects: ["FabOrder.version += 1"]
      - from: COMPLETED
        to: SHIPPED
        trigger: "POST /pcb/fab-orders/{id}/ship"
        actor: ProductionPlanner
        preconditions:
          - "quality_disposition == PASSED (else ERR_DISPOSITION_FAILED)"
          - "the order's Invoice has status ISSUED or PAID (else ERR_INVOICE_NOT_ISSUED)"
        side_effects: ["FabOrder.version += 1"]
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /pcb/fab-orders/{id}/cancel"
        actor: Customer | ProductionPlanner | FabAdmin
        preconditions: ["fab_status IN {QUOTED, DFM_REVIEW, AWAITING_LAMINATE, RELEASED, ON_HOLD} (else ERR_ORDER_NOT_CANCELLABLE)"]
        side_effects:
          - "cascade link 1: every PanelArray of the order in {DRAFT, RELEASED} -> CANCELLED"
          - "cascade link 2 (caused by link 1): every LaminateReservation whose panel_array was just CANCELLED and whose status == RESERVED -> RELEASED"
          - "cascade link 3 (caused by link 2): for each released reservation, lot.panels_reserved -= panels_allocated, lot.version += 1; a DEPLETED lot with panels_available > 0 returns to QUALIFIED"
          - "every DrillProgram of the order not in CANCELLED -> CANCELLED; every ImpedanceCoupon not terminal -> CANCELLED; every BOOKED LabSlotBooking of those coupons -> CANCELLED; every ElecTestRun in {SCHEDULED, RUNNING} -> CANCELLED"
          - "QUICK_TURN only: if the order held a lane commitment, LaneSlotCommitment.committed_boards -= quantity_boards"
          - "FabOrder.version += 1"
      - from: DFM_REVIEW
        to: CANCELLED
        trigger: "POST /pcb/fab-orders/{id}/cancel"
        actor: Customer | ProductionPlanner | FabAdmin
        preconditions: ["same cancellable set"]
        side_effects: ["same cascade as QUOTED -> CANCELLED"]
      - from: AWAITING_LAMINATE
        to: CANCELLED
        trigger: "POST /pcb/fab-orders/{id}/cancel"
        actor: Customer | ProductionPlanner | FabAdmin
        preconditions: ["same cancellable set"]
        side_effects: ["same cascade as QUOTED -> CANCELLED"]
      - from: RELEASED
        to: CANCELLED
        trigger: "POST /pcb/fab-orders/{id}/cancel"
        actor: Customer | ProductionPlanner | FabAdmin
        preconditions: ["same cancellable set"]
        side_effects: ["same cascade as QUOTED -> CANCELLED (lane commitment released)"]
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /pcb/fab-orders/{id}/cancel"
        actor: Customer | ProductionPlanner | FabAdmin
        preconditions: ["same cancellable set"]
        side_effects: ["same cascade as QUOTED -> CANCELLED; CONSUMED reservations stay CONSUMED (laminate is scrapped)"]

  - entity: FabOrder
    dimension: quality_disposition
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: FAILED
        trigger: "system: a coupon measurement evaluates FAIL while the coupon's retest_count == MAX_RETESTS(2) (final failure)"
        actor: system
        preconditions: []
        side_effects:
          - "auto-create DefectRecord(fab_order_id, panel_array_id of the RELEASED array, defect_code=IMPEDANCE, severity=SCRAP, boards_affected = boards_per_panel of the RELEASED array, detected_at = logical clock, source=MANUAL)"
          - "FabOrder.boards_scrapped += boards_per_panel of the RELEASED array"
          - "FabOrder.version += 1"
      - from: PENDING
        to: PASSED
        trigger: "system: POST /pcb/fab-orders/{id}/complete-fab side effect"
        actor: system
        preconditions: []
        side_effects: ["FabOrder.version += 1 (counted in complete-fab)"]
      - from: FAILED
        to: CONDITIONAL
        trigger: "POST /pcb/fab-orders/{id}/concede"
        actor: FabAdmin
        preconditions: ["payload concession_note non-empty"]
        side_effects: ["FabOrder.version += 1"]
      - from: CONDITIONAL
        to: PASSED
        trigger: "POST /pcb/fab-orders/{id}/requalify"
        actor: QualityInspector
        preconditions: ["payload requalification_note non-empty"]
        side_effects: ["FabOrder.version += 1"]

  - entity: Stackup
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /pcb/stackups/{id}/lock"
        actor: ProcessEngineer
        preconditions: ["if impedance_controlled then >= 1 ImpedanceSpecLine exists (else ERR_IMPEDANCE_SPEC_MISSING)", "owning order fab_status IN {QUOTED, DFM_REVIEW} (else ERR_INVALID_STATE)"]
        side_effects:
          - "any other LOCKED Stackup of the same order -> SUPERSEDED"
          - "recompute order provisional_total_cents (spec-line count changed) if a RELEASED PanelArray exists"
          - "Stackup.version += 1"

  - entity: PanelArray
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /pcb/panel-arrays/{id}/release"
        actor: CAMOperator
        preconditions: ["good_boards_per_panel >= 1 (else ERR_ARRAY_YIELD_ZERO)", "owning order fab_status IN {QUOTED, DFM_REVIEW, AWAITING_LAMINATE} (else ERR_INVALID_STATE)"]
        side_effects:
          - "any other RELEASED PanelArray of the same order -> SUPERSEDED"
          - "recompute order provisional_total_cents (PROVISIONAL variant) and bump FabOrder.version"
          - "PanelArray.version += 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a newer PanelArray is created for the same order"
        actor: system
        preconditions: []
        side_effects: ["PanelArray.version += 1"]
      - from: RELEASED
        to: SUPERSEDED
        trigger: "system: a newer PanelArray is created for the same order"
        actor: system
        preconditions: []
        side_effects: ["PanelArray.version += 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "system: order cancel cascade"
        actor: system
        preconditions: []
        side_effects: ["triggers LaminateReservation release for its RESERVED reservations", "PanelArray.version += 1"]
      - from: RELEASED
        to: CANCELLED
        trigger: "system: order cancel cascade"
        actor: system
        preconditions: []
        side_effects: ["triggers LaminateReservation release for its RESERVED reservations", "PanelArray.version += 1"]

  - entity: DrillProgram
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /pcb/drill-programs/{id}/submit"
        actor: CAMOperator
        preconditions: []
        side_effects: ["DrillProgram.version += 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /pcb/drill-programs/{id}/approve"
        actor: ProcessEngineer
        preconditions:
          - "segregation of duties: approver X-User-ID != created_by_user_id (else ERR_SOD_VIOLATION)"
          - "min_hole_mils >= MIN_HOLE_MILS(6) (else ERR_HOLE_BELOW_MIN)"
          - "plated_aspect_ratio <= ceiling (1oz: 8.0, 2oz: 6.0), inclusive (else ERR_ASPECT_RATIO_EXCEEDED)"
        side_effects: ["DrillProgram.version += 1"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /pcb/drill-programs/{id}/reject"
        actor: ProcessEngineer
        preconditions: ["payload reason non-empty"]
        side_effects: ["rejection_reason := reason", "DrillProgram.version += 1"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /pcb/drill-programs/{id}/revise"
        actor: CAMOperator
        preconditions: []
        side_effects: ["revision += 1", "min_hole_mils / hole_count updated from payload when present", "rejection_reason := null", "DrillProgram.version += 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "system: order cancel cascade"
        actor: system
        preconditions: []
        side_effects: ["DrillProgram.version += 1"]
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "system: order cancel cascade"
        actor: system
        preconditions: []
        side_effects: ["DrillProgram.version += 1"]
      - from: APPROVED
        to: CANCELLED
        trigger: "system: order cancel cascade"
        actor: system
        preconditions: []
        side_effects: ["DrillProgram.version += 1"]
      - from: REJECTED
        to: CANCELLED
        trigger: "system: order cancel cascade"
        actor: system
        preconditions: []
        side_effects: ["DrillProgram.version += 1"]

  - entity: LaminateLot
    initial_state: RECEIVED
    terminal_states: [EXPIRED, QUARANTINED]
    transitions:
      - from: RECEIVED
        to: QUALIFIED
        trigger: "POST /pcb/laminate-lots/{id}/qualify"
        actor: QualityInspector
        preconditions: ["logical clock < expiry_date (else ERR_LOT_NOT_QUALIFIED)"]
        side_effects: ["qualified_at := clock", "LaminateLot.version += 1"]
      - from: QUALIFIED
        to: DEPLETED
        trigger: "system: panels_available reaches 0 via consumption or reservation"
        actor: system
        preconditions: []
        side_effects: ["LaminateLot.version += 1"]
      - from: DEPLETED
        to: QUALIFIED
        trigger: "system: panels_available rises above 0 via reservation release (cancel/expiry/manual cascade)"
        actor: system
        preconditions: []
        side_effects: ["LaminateLot.version += 1"]
      - from: RECEIVED
        to: EXPIRED
        trigger: "system: logical clock reaches expiry_date (evaluated on clock-set and on every lot access)"
        actor: system
        preconditions: []
        side_effects: ["LaminateLot.version += 1"]
      - from: QUALIFIED
        to: EXPIRED
        trigger: "system: logical clock reaches expiry_date"
        actor: system
        preconditions: []
        side_effects:
          - "cascade link 1: every RESERVED reservation of this lot -> RELEASED"
          - "cascade link 2 (caused by link 1): each affected order re-evaluates coverage; an AWAITING_LAMINATE order whose RESERVED coverage < panels_required -> ON_HOLD"
          - "LaminateLot.version += 1"
      - from: RECEIVED
        to: QUARANTINED
        trigger: "POST /pcb/laminate-lots/{id}/quarantine"
        actor: QualityInspector
        preconditions: []
        side_effects: ["LaminateLot.version += 1"]
      - from: QUALIFIED
        to: QUARANTINED
        trigger: "POST /pcb/laminate-lots/{id}/quarantine"
        actor: QualityInspector
        preconditions: ["no RESERVED reservations reference this lot (else ERR_INVALID_STATE)"]
        side_effects: ["LaminateLot.version += 1"]

  - entity: LaminateReservation
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "system: POST /pcb/fab-orders/{id}/start-production side effect"
        actor: system
        preconditions: []
        side_effects: ["lot.panels_reserved -= panels_allocated", "lot.panels_consumed += panels_allocated", "lot.version += 1", "LaminateReservation.version += 1"]
      - from: RESERVED
        to: RELEASED
        trigger: "POST /pcb/laminate-reservations/{id}/release OR system cascades (order cancel via PanelArray cancel, lot expiry)"
        actor: ProductionPlanner | system
        preconditions: []
        side_effects: ["lot.panels_reserved -= panels_allocated", "lot.version += 1", "owning order re-evaluates laminate coverage (AWAITING_LAMINATE -> ON_HOLD when coverage < panels_required)", "LaminateReservation.version += 1"]

  - entity: ImpedanceCoupon
    initial_state: AWAITING_MEASURE
    terminal_states: [PASSED, CANCELLED]
    transitions:
      - from: AWAITING_MEASURE
        to: PASSED
        trigger: "POST /pcb/coupons/{id}/measurements evaluating PASS"
        actor: QualityInspector
        preconditions:
          - "owning order fab_status IN {IN_PRODUCTION, AWAITING_ETEST} (else ERR_INVALID_STATE)"
          - "a BOOKED LabSlotBooking for this coupon covers the logical clock: starts_at <= clock < ends_at (else ERR_NO_ACTIVE_LAB_BOOKING)"
          - "spec line DIFFERENTIAL requires measured_ohms_b present (else ERR_VALIDATION)"
        side_effects: ["create CouponMeasurement(result=PASS)", "the referenced LabSlotBooking -> COMPLETED", "latest_measured_ohms := measured_ohms", "disposition_basis := SINGLE | STATISTICAL by line_type", "ImpedanceCoupon.version += 1"]
      - from: AWAITING_MEASURE
        to: FAILED
        trigger: "POST /pcb/coupons/{id}/measurements evaluating FAIL"
        actor: QualityInspector
        preconditions: ["same as PASS path"]
        side_effects:
          - "create CouponMeasurement(result=FAIL); booking -> COMPLETED; latest_measured_ohms updated"
          - "if retest_count == MAX_RETESTS(2): FINAL failure -> order quality_disposition PENDING -> FAILED, auto DefectRecord(IMPEDANCE/SCRAP/MANUAL), order.boards_scrapped += boards_per_panel"
          - "ImpedanceCoupon.version += 1"
      - from: FAILED
        to: AWAITING_MEASURE
        trigger: "POST /pcb/coupons/{id}/retest"
        actor: QualityInspector
        preconditions: ["retest_count < MAX_RETESTS(2) (else ERR_RETEST_LIMIT_REACHED)"]
        side_effects: ["retest_count += 1", "ImpedanceCoupon.version += 1"]
      - from: AWAITING_MEASURE
        to: CANCELLED
        trigger: "system: order cancel cascade"
        actor: system
        preconditions: []
        side_effects: ["BOOKED LabSlotBookings of this coupon -> CANCELLED", "ImpedanceCoupon.version += 1"]
      - from: FAILED
        to: CANCELLED
        trigger: "system: order cancel cascade"
        actor: system
        preconditions: []
        side_effects: ["ImpedanceCoupon.version += 1"]

  - entity: LabSlotBooking
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "system: a measurement recorded against this booking"
        actor: system
        preconditions: []
        side_effects: ["LabSlotBooking.version += 1"]
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /pcb/lab-slot-bookings/{id}/cancel OR system order-cancel cascade"
        actor: QualityInspector | system
        preconditions: []
        side_effects: ["LabSlotBooking.version += 1"]

  - entity: ElecTestRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED_PASS, COMPLETED_FAIL, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /pcb/etest-runs/{id}/start"
        actor: QualityInspector
        preconditions: []
        side_effects: ["ElecTestRun.version += 1"]
      - from: RUNNING
        to: COMPLETED_PASS
        trigger: "POST /pcb/etest-runs/{id}/complete with outcome=PASS"
        actor: QualityInspector
        preconditions: ["boards_failed == 0 and opens_found == 0 and shorts_found == 0 (else ERR_VALIDATION)"]
        side_effects: ["result counters recorded", "owning order AWAITING_ETEST -> COMPLETED", "ElecTestRun.version += 1"]
      - from: RUNNING
        to: COMPLETED_FAIL
        trigger: "POST /pcb/etest-runs/{id}/complete with outcome=FAIL"
        actor: QualityInspector
        preconditions: []
        side_effects: ["result counters recorded", "order stays AWAITING_ETEST (a new run may be scheduled)", "ElecTestRun.version += 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: order cancel cascade"
        actor: system
        preconditions: []
        side_effects: ["ElecTestRun.version += 1"]
      - from: RUNNING
        to: CANCELLED
        trigger: "system: order cancel cascade"
        actor: system
        preconditions: []
        side_effects: ["ElecTestRun.version += 1"]

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /pcb/invoices/{id}/issue"
        actor: SalesEngineer
        preconditions: []
        side_effects: ["Invoice.version += 1"]
      - from: ISSUED
        to: PAID
        trigger: "POST /pcb/invoices/{id}/pay"
        actor: Customer
        preconditions: ["acting Customer owns the billed order (else ERR_NOT_OWNER)"]
        side_effects: ["Invoice.version += 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: panel-array-create-stale-order
    parent_entity: FabOrder
    write_endpoint: "POST /pcb/fab-orders/{id}/panel-arrays"
    occ_field: "expected_fab_order_version"
    description: |
      Creating a PanelArray supersedes the order's existing arrays, so the
      create is rejected when FabOrder.version has advanced beyond the version
      the client last observed (e.g., another writer created an array, or a
      stackup lock recomputed pricing, after the client's read).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reservation-create-stale-lot
    parent_entity: LaminateLot
    write_endpoint: "POST /pcb/laminate-reservations"
    occ_field: "expected_laminate_lot_version"
    description: |
      Creating a LaminateReservation commits panels against a lot's
      panels_available, so the create is rejected when LaminateLot.version has
      advanced beyond the version the client last observed (another
      reservation, release, or qualify having bumped it since).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (8 rules)
# =============================================================================
calculations:
  - name: panel_array_yield
    trigger: "on POST /pcb/fab-orders/{id}/panel-arrays (create) — computes the array's derived fields"
    algorithm: aggregation
    formula: |
      board_area_sqin   = (order.board_x_mils * order.board_y_mils) / 1_000_000
      panel_area_sqin   = (panel_width_mils * panel_height_mils) / 1_000_000
      boards_per_panel  = array_x * array_y
      array_yield       = max(ARRAY_YIELD_FLOOR, 1 - DEFECT_DENSITY_PER_SQIN * board_area_sqin)   # 4dp
      good_boards_per_panel = floor(boards_per_panel * array_yield)
      panels_required   = ceil(order.quantity_boards / good_boards_per_panel)   # undefined (release blocked) when good_boards_per_panel == 0
      utilization_pct   = round_half_up(100 * boards_per_panel * board_area_sqin / panel_area_sqin, 2)
    input_set: "the FabOrder row plus the new PanelArray row"
    constants:
      DEFECT_DENSITY_PER_SQIN: 0.01
      ARRAY_YIELD_FLOOR: 0.50
    precision: "array_yield 4dp; utilization_pct 2dp round_half_up; floor/ceil exact integer ops"

  - name: order_pricing
    trigger: "PROVISIONAL variant: on PanelArray release and on Stackup lock (when a RELEASED array exists). FINAL variant: on POST /pcb/fab-orders/{id}/invoices/final."
    algorithm: tiered_pricing
    formula: |
      # Nested rounding order is PINNED: round each line to integer cents FIRST
      # (round_half_up), then sum to subtotal, then apply the lane multiplier and
      # round_half_up again, then apply the minimum-lot floor. Summing raw and
      # rounding once (or applying the multiplier per line) yields different cents.
      panel_area_sqin = (array.panel_width_mils * array.panel_height_mils) / 1_000_000
      panels          = array.panels_required            # PROVISIONAL
                      = invoice.actual_panels_run        # FINAL
      base_cents      = round_half_up(panel_area_sqin * panels * LAYER_RATE[order.layer_count])
      finish_cents    = round_half_up(panel_area_sqin * panels * FINISH_RATE[order.surface_finish])
      n_lines         = count(ImpedanceSpecLine of the order's LOCKED stackup)  # 0 when none locked
      impedance_cents = IMPEDANCE_LINE_FEE_CENTS * n_lines
      retest_cents    = 0                                                    # PROVISIONAL
                      = RETEST_FEE_CENTS * sum(coupon.retest_count)          # FINAL, over all coupons of the order
      subtotal_cents  = base_cents + finish_cents + impedance_cents + retest_cents
      multiplier      = QUICK_TURN ? lane.premium_multiplier : 1.0
      total_cents     = max(MIN_LOT_CHARGE_CENTS, round_half_up(subtotal_cents * multiplier))
    input_set: "the FabOrder, its latest RELEASED PanelArray, its LOCKED Stackup's spec lines, its QuickTurnLane when QUICK_TURN, and (FINAL) all ImpedanceCoupon rows of the order regardless of coupon status"
    constants:
      IMPEDANCE_LINE_FEE_CENTS: 2500
      RETEST_FEE_CENTS: 1500
      MIN_LOT_CHARGE_CENTS: 2000
    precision: "integer cents; round_half_up at each pinned step"
    variants:
      - name: PROVISIONAL
        when: "array release / stackup lock, before production"
        difference: "panel basis is panels_required; retest_cents = 0; result stored on FabOrder.provisional_total_cents"
      - name: FINAL
        when: "invoice creation after production"
        difference: "panel basis is actual_panels_run from the payload; adds retest fees; result stored on Invoice.total_cents — identical order data produces a different total whenever actual_panels_run != panels_required or any retest occurred"

  - name: impedance_disposition
    trigger: "on POST /pcb/coupons/{id}/measurements — evaluates the coupon's PASS/FAIL and CouponMeasurement.result"
    algorithm: threshold
    formula: |
      band = [spec.target_ohms - spec.tolerance_minus_ohms, spec.target_ohms + spec.tolerance_plus_ohms]   # inclusive both ends
      SINGLE:      PASS iff band.lo <= measured_ohms <= band.hi
      STATISTICAL: PASS iff band.lo <= measured_ohms   <= band.hi
                         AND band.lo <= measured_ohms_b <= band.hi
                         AND abs(measured_ohms - measured_ohms_b) <= MAX_SPREAD_OHMS
    input_set: "the measurement payload and the coupon's ImpedanceSpecLine"
    constants:
      MAX_SPREAD_OHMS: 6.0
    precision: "ohms compared exactly as given (2dp inputs); band comparisons inclusive"
    variants:
      - name: SINGLE
        when: "spec line line_type == SINGLE_ENDED"
        difference: "judges the single latest reading only"
      - name: STATISTICAL
        when: "spec line line_type == DIFFERENTIAL"
        difference: "judges both legs of the same measurement event plus their spread; identical in-band values can PASS under SINGLE yet FAIL under STATISTICAL when the legs diverge by more than MAX_SPREAD_OHMS"

  - name: aspect_ratio_check
    trigger: "on POST /pcb/drill-programs/{id}/approve"
    algorithm: threshold
    formula: |
      thickness = order's LOCKED stackup.total_thickness_mils
      plated_aspect_ratio = thickness / program.min_hole_mils
      ceiling = 8.0 if stackup.copper_weight_oz == 1 else 6.0
      PASS iff program.min_hole_mils >= MIN_HOLE_MILS AND plated_aspect_ratio <= ceiling   # boundary inclusive
    input_set: "the DrillProgram and the owning order's LOCKED Stackup"
    constants:
      MIN_HOLE_MILS: 6
      MAX_RATIO_1OZ: 8.0
      MAX_RATIO_2OZ: 6.0
    precision: "ratio compared at full float precision of the division; no rounding before comparison"

  - name: laminate_date_code_window
    trigger: "on every LaminateLot access (status recompute), on POST /pcb/laminate-reservations, and on POST /pcb/_clock/set_current_utc"
    algorithm: threshold
    formula: |
      expiry_date = lot.manufacture_date + SHELF_LIFE_DAYS days
      lot usable  iff logical_clock < expiry_date            # at the exact expiry instant the lot is EXPIRED
      reservation allowed iff expiry_date > order.requested_ship_date   # strictly after; equality rejects
    input_set: "the LaminateLot, the logical clock, and the FabOrder.requested_ship_date"
    constants:
      SHELF_LIFE_DAYS: 365
    precision: "UTC timestamps compared to the second"

  - name: lane_capacity_commitment
    trigger: "on POST /pcb/fab-orders/{id}/release (check + upsert) and on order cancel (decrement)"
    algorithm: aggregation
    formula: |
      committed(lane, date) = sum(quantity_boards of orders with quick_turn_lane_id == lane.id,
                                  requested_ship_date == date,
                                  fab_status IN {RELEASED, IN_PRODUCTION, ON_HOLD, AWAITING_ETEST, COMPLETED})
      release allowed iff committed + order.quantity_boards <= lane.capacity_boards_per_day   # equality allowed
      materialized as LaneSlotCommitment(lane_id, ship_date=UTC-midnight of requested_ship_date, committed_boards)
    input_set: "QUICK_TURN FabOrders of the lane keyed by requested_ship_date calendar day; CANCELLED and SHIPPED orders excluded"
    constants: {}
    precision: "integer boards; day granularity, UTC"

  - name: defect_pareto
    trigger: "on GET /pcb/defects/pareto"
    algorithm: aggregation
    formula: |
      window      = [from_iso, to_iso) half-open; defaults from_iso=2026-08-01T00:00:00Z, to_iso=logical clock
      population  = DefectRecord rows with detected_at IN window AND severity IN {MAJOR, SCRAP}
      per code    : boards = sum(boards_affected)
      ordering    : boards DESC, tie-break defect_code ASC (lexicographic); never by id
      total_boards = sum over all included codes
      pct_i        = round_half_up(100 * boards_i / total_boards, 2)
      cumulative_i = round_half_up(sum of pct over rows 1..i using UNROUNDED boards fractions, 2)
      vital_few_i  = (cumulative before row i) < PARETO_VITAL_THRESHOLD   # rows until 80% is first reached or crossed
      empty population -> rows = [], total_boards = 0
    input_set: "all DefectRecord rows regardless of parent order state"
    constants:
      PARETO_VITAL_THRESHOLD: 80.0
    precision: "percentages 2dp round_half_up; cumulative computed from unrounded fractions then rounded"

  - name: credit_authorization_check
    trigger: "on POST /pcb/fab-orders/{id}/release"
    algorithm: threshold
    formula: |
      PASS iff order.provisional_total_cents <= customer.credit_limit_cents   # equality passes
    input_set: "the FabOrder's current provisional_total_cents and the owning Customer.credit_limit_cents"
    constants: {}
    precision: "integer cents comparison"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins on dual failure)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is in the endpoint's role list", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "body-referenced FK targets exist (customer_id, quick_turn_lane_id, spec_line_id, laminate_lot_id, panel_array_id, coupon_id, lab_slot_booking_id)", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 422, applies_to: "endpoints with body FKs" }
  - { priority: 5, category: auth, check: "entity-backed Customer acting on a resource owns it (X-User-ID == resource.customer_id)", error_id: ERR_NOT_OWNER, http_status: 403, applies_to: "Customer-role endpoints on order-scoped resources" }
  - { priority: 6, category: auth, check: "segregation of duties: drill approver X-User-ID != DrillProgram.created_by_user_id", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /pcb/drill-programs/{id}/approve" }
  - { priority: 7, category: state, check: "target resource is in a state from which the requested transition exists", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "order cancel allowed only from {QUOTED, DFM_REVIEW, AWAITING_LAMINATE, RELEASED, ON_HOLD}", error_id: ERR_ORDER_NOT_CANCELLABLE, http_status: 409, applies_to: "POST /pcb/fab-orders/{id}/cancel" }
  - { priority: 9, category: state, check: "submit-dfm requires a LOCKED stackup on the order", error_id: ERR_STACKUP_NOT_LOCKED, http_status: 409, applies_to: "POST /pcb/fab-orders/{id}/submit-dfm" }
  - { priority: 10, category: state, check: "release requires latest DrillProgram APPROVED", error_id: ERR_DRILL_NOT_APPROVED, http_status: 409, applies_to: "POST /pcb/fab-orders/{id}/release" }
  - { priority: 11, category: state, check: "release requires a RELEASED PanelArray", error_id: ERR_PANEL_NOT_RELEASED, http_status: 409, applies_to: "POST /pcb/fab-orders/{id}/release" }
  - { priority: 12, category: state, check: "reservation requires lot status QUALIFIED (an EXPIRED/RECEIVED/QUARANTINED/DEPLETED lot fails here)", error_id: ERR_LOT_NOT_QUALIFIED, http_status: 409, applies_to: "POST /pcb/laminate-reservations" }
  - { priority: 13, category: state, check: "complete-fab requires every coupon_required spec line to have a PASSED coupon", error_id: ERR_COUPON_NOT_PASSED, http_status: 409, applies_to: "POST /pcb/fab-orders/{id}/complete-fab" }
  - { priority: 14, category: state, check: "ship and complete-fab require quality_disposition in the allowed set (PASSED for ship; {PENDING, PASSED} for complete-fab)", error_id: ERR_DISPOSITION_FAILED, http_status: 409, applies_to: "POST /pcb/fab-orders/{id}/ship, POST /pcb/fab-orders/{id}/complete-fab" }
  - { priority: 15, category: state, check: "ship requires the order's Invoice in {ISSUED, PAID}", error_id: ERR_INVOICE_NOT_ISSUED, http_status: 409, applies_to: "POST /pcb/fab-orders/{id}/ship" }
  - { priority: 16, category: state, check: "quick-turn release requires lane.active == true", error_id: ERR_LANE_INACTIVE, http_status: 409, applies_to: "POST /pcb/fab-orders/{id}/release, POST /pcb/fab-orders" }
  - { priority: 17, category: business_safety, check: "drill approve: min_hole_mils >= MIN_HOLE_MILS(6)", error_id: ERR_HOLE_BELOW_MIN, http_status: 422, applies_to: "POST /pcb/drill-programs/{id}/approve" }
  - { priority: 18, category: business_safety, check: "drill approve: plated_aspect_ratio <= ceiling (8.0 @ 1oz, 6.0 @ 2oz), inclusive boundary", error_id: ERR_ASPECT_RATIO_EXCEEDED, http_status: 422, applies_to: "POST /pcb/drill-programs/{id}/approve" }
  - { priority: 19, category: business_safety, check: "stackup lock with impedance_controlled=true requires >= 1 spec line", error_id: ERR_IMPEDANCE_SPEC_MISSING, http_status: 422, applies_to: "POST /pcb/stackups/{id}/lock" }
  - { priority: 20, category: business_safety, check: "surface_finish IMMERSION_SILVER is incompatible with 3-day lanes (turn_days <= 3)", error_id: ERR_FINISH_LANE_INCOMPATIBLE, http_status: 422, applies_to: "POST /pcb/fab-orders" }
  - { priority: 21, category: business_temporal, check: "requested_ship_date must be strictly after the logical clock", error_id: ERR_SHIP_DATE_IN_PAST, http_status: 422, applies_to: "POST /pcb/fab-orders" }
  - { priority: 22, category: business_temporal, check: "reservation requires lot expiry_date strictly after the order's requested_ship_date", error_id: ERR_LOT_EXPIRES_BEFORE_SHIP, http_status: 422, applies_to: "POST /pcb/laminate-reservations" }
  - { priority: 23, category: business_temporal, check: "lab booking window validity: ends_at > starts_at and duration <= 120 min", error_id: ERR_BOOKING_WINDOW_INVALID, http_status: 422, applies_to: "POST /pcb/lab-slot-bookings" }
  - { priority: 24, category: business_temporal, check: "lab booking overlap: same-station BOOKED windows are half-open [start,end) and must keep a >= 15 min gap to every other BOOKED window (gap == 15 passes, gap < 15 conflicts)", error_id: ERR_LAB_SLOT_CONFLICT, http_status: 409, applies_to: "POST /pcb/lab-slot-bookings" }
  - { priority: 25, category: business_temporal, check: "measurement requires a BOOKED booking for the coupon covering the logical clock", error_id: ERR_NO_ACTIVE_LAB_BOOKING, http_status: 409, applies_to: "POST /pcb/coupons/{id}/measurements" }
  - { priority: 26, category: business_constraint, check: "uniqueness: Customer.contact_email, LaminateLot.lot_code", error_id: ERR_DUPLICATE_EMAIL, http_status: 409, applies_to: "POST /pcb/customers" }
  - { priority: 27, category: business_constraint, check: "uniqueness: LaminateLot.lot_code", error_id: ERR_DUPLICATE_LOT_CODE, http_status: 409, applies_to: "POST /pcb/laminate-lots" }
  - { priority: 28, category: business_constraint, check: "at most one non-CANCELLED coupon per spec line", error_id: ERR_COUPON_EXISTS, http_status: 409, applies_to: "POST /pcb/fab-orders/{id}/coupons" }
  - { priority: 29, category: business_constraint, check: "at most one Invoice per FabOrder", error_id: ERR_INVOICE_EXISTS, http_status: 409, applies_to: "POST /pcb/fab-orders/{id}/invoices/final" }
  - { priority: 30, category: business_constraint, check: "panel array release requires good_boards_per_panel >= 1", error_id: ERR_ARRAY_YIELD_ZERO, http_status: 422, applies_to: "POST /pcb/panel-arrays/{id}/release" }
  - { priority: 31, category: business_constraint, check: "coupon retest requires retest_count < MAX_RETESTS(2)", error_id: ERR_RETEST_LIMIT_REACHED, http_status: 409, applies_to: "POST /pcb/coupons/{id}/retest" }
  - { priority: 32, category: business_fiscal, check: "reservation requires panels_allocated <= lot.panels_available; release requires RESERVED coverage >= panels_required", error_id: ERR_INSUFFICIENT_LAMINATE, http_status: 409, applies_to: "POST /pcb/laminate-reservations, POST /pcb/fab-orders/{id}/release" }
  - { priority: 33, category: business_fiscal, check: "quick-turn release requires committed_boards + quantity_boards <= capacity_boards_per_day", error_id: ERR_LANE_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /pcb/fab-orders/{id}/release" }
  - { priority: 34, category: business_fiscal, check: "release requires provisional_total_cents <= customer.credit_limit_cents", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /pcb/fab-orders/{id}/release" }
  - { priority: 35, category: state, check: "OCC: expected_*_version must equal the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /pcb/fab-orders/{id}/panel-arrays, POST /pcb/laminate-reservations" }
  - { priority: 36, category: business_constraint, check: "field-level shape: required fields present, enums in range, numeric bounds (dims > 0, quantity >= 1, layer_count in {2,4,6,8})", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving) ---
  - { method: POST, path: "/pcb/_clock/set_current_utc", description: "Sets the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; never falls back to wall-clock. Side effect: evaluates lot expirations and fires the expiry cascade.", roles: [FabAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["lot expiry evaluation + cascade (reservations RELEASED, orders ON_HOLD)"] }

  # --- customers ---
  - { method: POST, path: "/pcb/customers", description: "Register a customer", roles: [FabAdmin], code: 201, input: [company_name, contact_email, credit_limit_cents, "tax_exempt?"], output: Customer, side_effects: [] }
  - { method: GET, path: "/pcb/customers/{id}", description: "Read a customer; Customer role may read only its own id", roles: [FabAdmin, SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, Customer], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: GET, path: "/pcb/customers", description: "List customers (paginated)", roles: [FabAdmin, SalesEngineer], code: 200, input: ["limit?", "offset?"], output: "Customer[]", side_effects: [] }

  # --- fab orders ---
  - { method: POST, path: "/pcb/fab-orders", description: "Create an order in QUOTED. QUICK_TURN requires quick_turn_lane_id; STANDARD forbids it. Customer role creates only for itself.", roles: [Customer, SalesEngineer], code: 201, input: [customer_id, service_lane, "quick_turn_lane_id?", board_x_mils, board_y_mils, layer_count, surface_finish, quantity_boards, requested_ship_date], output: FabOrder, side_effects: ["order_number assigned"] }
  - { method: GET, path: "/pcb/fab-orders/{id}", description: "Read an order; Customer role limited to own orders", roles: [Customer, SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: [], output: FabOrder, side_effects: [] }
  - { method: GET, path: "/pcb/fab-orders", description: "List orders; Customer role sees only own", roles: [Customer, SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: ["customer_id?", "quick_turn_lane_id?", "fab_status?", "limit?", "offset?"], output: "FabOrder[]", side_effects: [] }
  - { method: POST, path: "/pcb/fab-orders/{id}/submit-dfm", description: "QUOTED -> DFM_REVIEW; requires a LOCKED stackup", roles: [Customer, SalesEngineer], code: 200, input: [], output: FabOrder, side_effects: ["fab_status transition", "FabOrder.version += 1"] }
  - { method: POST, path: "/pcb/fab-orders/{id}/dfm-approve", description: "DFM_REVIEW -> AWAITING_LAMINATE", roles: [ProcessEngineer], code: 200, input: [], output: FabOrder, side_effects: ["fab_status transition", "FabOrder.version += 1"] }
  - { method: POST, path: "/pcb/fab-orders/{id}/dfm-reject", description: "DFM_REVIEW -> QUOTED (revision cycle)", roles: [ProcessEngineer], code: 200, input: ["reason?"], output: FabOrder, side_effects: ["fab_status transition", "FabOrder.version += 1"] }
  - { method: POST, path: "/pcb/fab-orders/{id}/release", description: "AWAITING_LAMINATE -> RELEASED with the full guard chain (drill, array, laminate, lane, credit)", roles: [ProductionPlanner], code: 200, input: [], output: FabOrder, side_effects: ["lane commitment upsert for QUICK_TURN", "FabOrder.version += 1"] }
  - { method: POST, path: "/pcb/fab-orders/{id}/start-production", description: "RELEASED -> IN_PRODUCTION; consumes reservations", roles: [ProductionPlanner], code: 200, input: [], output: FabOrder, side_effects: ["reservations CONSUMED", "lot panels_reserved/panels_consumed updated", "lot DEPLETED recompute", "FabOrder.version += 1"] }
  - { method: POST, path: "/pcb/fab-orders/{id}/hold", description: "IN_PRODUCTION -> ON_HOLD", roles: [ProductionPlanner], code: 200, input: [], output: FabOrder, side_effects: ["FabOrder.version += 1"] }
  - { method: POST, path: "/pcb/fab-orders/{id}/unhold", description: "ON_HOLD -> IN_PRODUCTION when CONSUMED reservations exist, else ON_HOLD -> AWAITING_LAMINATE when RESERVED coverage restored", roles: [ProductionPlanner], code: 200, input: [], output: FabOrder, side_effects: ["FabOrder.version += 1"] }
  - { method: POST, path: "/pcb/fab-orders/{id}/complete-fab", description: "IN_PRODUCTION -> AWAITING_ETEST; requires coupons PASSED; sets disposition PASSED", roles: [ProductionPlanner], code: 200, input: [], output: FabOrder, side_effects: ["quality_disposition := PASSED", "FabOrder.version += 1"] }
  - { method: POST, path: "/pcb/fab-orders/{id}/ship", description: "COMPLETED -> SHIPPED; requires disposition PASSED and invoice ISSUED/PAID", roles: [ProductionPlanner], code: 200, input: [], output: FabOrder, side_effects: ["FabOrder.version += 1"] }
  - { method: POST, path: "/pcb/fab-orders/{id}/cancel", description: "Cancellable from {QUOTED, DFM_REVIEW, AWAITING_LAMINATE, RELEASED, ON_HOLD}; fires the depth-3 cancel cascade", roles: [Customer, ProductionPlanner, FabAdmin], code: 200, input: ["reason?"], output: FabOrder, side_effects: ["array cancel -> reservation release -> lot recompute", "drill/coupon/booking/etest cancel", "lane commitment release", "FabOrder.version += 1"] }
  - { method: POST, path: "/pcb/fab-orders/{id}/concede", description: "quality_disposition FAILED -> CONDITIONAL", roles: [FabAdmin], code: 200, input: [concession_note], output: FabOrder, side_effects: ["FabOrder.version += 1"] }
  - { method: POST, path: "/pcb/fab-orders/{id}/requalify", description: "quality_disposition CONDITIONAL -> PASSED", roles: [QualityInspector], code: 200, input: [requalification_note], output: FabOrder, side_effects: ["FabOrder.version += 1"] }

  # --- stackups & impedance spec lines ---
  - { method: POST, path: "/pcb/fab-orders/{id}/stackups", description: "Create a DRAFT stackup for an order", roles: [Customer, SalesEngineer, CAMOperator], code: 201, input: [revision, total_thickness_mils, dielectric_material, copper_weight_oz, "impedance_controlled?"], output: Stackup, side_effects: [] }
  - { method: GET, path: "/pcb/fab-orders/{id}/stackups", description: "List an order's stackups", roles: [Customer, SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: ["limit?", "offset?"], output: "Stackup[]", side_effects: [] }
  - { method: GET, path: "/pcb/stackups/{id}", description: "Read a stackup", roles: [Customer, SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: [], output: Stackup, side_effects: [] }
  - { method: POST, path: "/pcb/stackups/{id}/lock", description: "DRAFT -> LOCKED; supersedes any other LOCKED stackup; recomputes provisional price when a RELEASED array exists", roles: [ProcessEngineer], code: 200, input: [], output: Stackup, side_effects: ["supersede older LOCKED stackup", "recompute FabOrder.provisional_total_cents"] }
  - { method: POST, path: "/pcb/stackups/{id}/spec-lines", description: "Add an impedance spec line to a DRAFT stackup", roles: [CAMOperator], code: 201, input: [layer_name, target_ohms, tolerance_plus_ohms, tolerance_minus_ohms, line_type, "coupon_required?"], output: ImpedanceSpecLine, side_effects: [] }
  - { method: GET, path: "/pcb/stackups/{id}/spec-lines", description: "List a stackup's spec lines", roles: [Customer, SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: ["limit?", "offset?"], output: "ImpedanceSpecLine[]", side_effects: [] }

  # --- panel arrays ---
  - { method: POST, path: "/pcb/fab-orders/{id}/panel-arrays", description: "Create a PanelArray (OCC on FabOrder.version); supersedes the order's existing arrays; computes yield fields", roles: [CAMOperator], code: 201, input: [array_x, array_y, panel_width_mils, panel_height_mils, expected_fab_order_version], output: PanelArray, side_effects: ["older arrays -> SUPERSEDED", "panel_array_yield computation", "increments FabOrder.version by 1"] }
  - { method: GET, path: "/pcb/fab-orders/{id}/panel-arrays", description: "List an order's panel arrays", roles: [Customer, SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: ["limit?", "offset?"], output: "PanelArray[]", side_effects: [] }
  - { method: GET, path: "/pcb/panel-arrays/{id}", description: "Read a panel array", roles: [Customer, SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: [], output: PanelArray, side_effects: [] }
  - { method: POST, path: "/pcb/panel-arrays/{id}/release", description: "DRAFT -> RELEASED; recomputes the order's PROVISIONAL price", roles: [CAMOperator], code: 200, input: [], output: PanelArray, side_effects: ["recompute FabOrder.provisional_total_cents", "FabOrder.version += 1"] }

  # --- drill programs ---
  - { method: POST, path: "/pcb/fab-orders/{id}/drill-programs", description: "Create a DRAFT drill program; records created_by_user_id from X-User-ID", roles: [CAMOperator], code: 201, input: [revision, min_hole_mils, hole_count], output: DrillProgram, side_effects: ["created_by_user_id := X-User-ID"] }
  - { method: GET, path: "/pcb/fab-orders/{id}/drill-programs", description: "List an order's drill programs", roles: [Customer, SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: ["limit?", "offset?"], output: "DrillProgram[]", side_effects: [] }
  - { method: POST, path: "/pcb/drill-programs/{id}/submit", description: "DRAFT -> UNDER_REVIEW", roles: [CAMOperator], code: 200, input: [], output: DrillProgram, side_effects: ["DrillProgram.version += 1"] }
  - { method: POST, path: "/pcb/drill-programs/{id}/approve", description: "UNDER_REVIEW -> APPROVED; SoD + hole-min + aspect-ratio gates", roles: [ProcessEngineer], code: 200, input: [], output: DrillProgram, side_effects: ["aspect_ratio_check computation", "DrillProgram.version += 1"] }
  - { method: POST, path: "/pcb/drill-programs/{id}/reject", description: "UNDER_REVIEW -> REJECTED with reason", roles: [ProcessEngineer], code: 200, input: [reason], output: DrillProgram, side_effects: ["rejection_reason := reason"] }
  - { method: POST, path: "/pcb/drill-programs/{id}/revise", description: "REJECTED -> DRAFT; revision += 1; clears rejection_reason", roles: [CAMOperator], code: 200, input: ["min_hole_mils?", "hole_count?"], output: DrillProgram, side_effects: ["revision += 1", "rejection_reason := null"] }

  # --- laminate lots & reservations ---
  - { method: POST, path: "/pcb/laminate-lots", description: "Receive a laminate lot (RECEIVED)", roles: [ProcessEngineer], code: 201, input: [material_code, lot_code, manufacture_date, panels_total], output: LaminateLot, side_effects: [] }
  - { method: GET, path: "/pcb/laminate-lots/{id}", description: "Read a lot (recomputes EXPIRED against the logical clock)", roles: [SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: [], output: LaminateLot, side_effects: ["lazy EXPIRED transition"] }
  - { method: GET, path: "/pcb/laminate-lots", description: "List lots", roles: [SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: ["status?", "material_code?", "limit?", "offset?"], output: "LaminateLot[]", side_effects: [] }
  - { method: POST, path: "/pcb/laminate-lots/{id}/qualify", description: "RECEIVED -> QUALIFIED (requires clock < expiry_date)", roles: [QualityInspector], code: 200, input: [], output: LaminateLot, side_effects: ["qualified_at := clock", "LaminateLot.version += 1"] }
  - { method: POST, path: "/pcb/laminate-lots/{id}/quarantine", description: "RECEIVED/QUALIFIED -> QUARANTINED; blocked while RESERVED reservations exist", roles: [QualityInspector], code: 200, input: ["reason?"], output: LaminateLot, side_effects: ["LaminateLot.version += 1"] }
  - { method: POST, path: "/pcb/laminate-reservations", description: "Reserve panels (OCC on LaminateLot.version); order must be AWAITING_LAMINATE or RELEASED", roles: [ProductionPlanner], code: 201, input: [fab_order_id, panel_array_id, laminate_lot_id, panels_allocated, expected_laminate_lot_version], output: LaminateReservation, side_effects: ["lot.panels_reserved += panels_allocated", "lot DEPLETED recompute", "increments LaminateLot.version by 1", "order coverage re-evaluation (ON_HOLD -> AWAITING_LAMINATE when restored via unhold path)"] }
  - { method: GET, path: "/pcb/laminate-reservations", description: "List reservations filtered by any FK", roles: [SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: ["fab_order_id?", "panel_array_id?", "laminate_lot_id?", "status?", "limit?", "offset?"], output: "LaminateReservation[]", side_effects: [] }
  - { method: GET, path: "/pcb/laminate-reservations/{id}", description: "Read a reservation", roles: [SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: [], output: LaminateReservation, side_effects: [] }
  - { method: POST, path: "/pcb/laminate-reservations/{id}/release", description: "RESERVED -> RELEASED manually; lot panels_reserved decremented; order coverage re-evaluated", roles: [ProductionPlanner], code: 200, input: [], output: LaminateReservation, side_effects: ["lot.panels_reserved -= panels_allocated", "lot version += 1", "order coverage re-evaluation"] }

  # --- impedance coupons, measurements, lab bookings ---
  - { method: POST, path: "/pcb/fab-orders/{id}/coupons", description: "Create an ImpedanceCoupon for a spec line; order must be IN_PRODUCTION or AWAITING_ETEST", roles: [QualityInspector], code: 201, input: [spec_line_id, panel_ref], output: ImpedanceCoupon, side_effects: [] }
  - { method: GET, path: "/pcb/fab-orders/{id}/coupons", description: "List an order's coupons", roles: [Customer, SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: ["limit?", "offset?"], output: "ImpedanceCoupon[]", side_effects: [] }
  - { method: GET, path: "/pcb/coupons", description: "List coupons filtered by FK/status", roles: [SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: ["fab_order_id?", "spec_line_id?", "status?", "limit?", "offset?"], output: "ImpedanceCoupon[]", side_effects: [] }
  - { method: GET, path: "/pcb/coupons/{id}", description: "Read a coupon", roles: [SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: [], output: ImpedanceCoupon, side_effects: [] }
  - { method: POST, path: "/pcb/coupons/{id}/retest", description: "FAILED -> AWAITING_MEASURE when retest_count < 2", roles: [QualityInspector], code: 200, input: [], output: ImpedanceCoupon, side_effects: ["retest_count += 1"] }
  - { method: POST, path: "/pcb/coupons/{id}/measurements", description: "Record a microsection measurement; evaluates PASS/FAIL per the disposition variant; final FAIL cascades to the order", roles: [QualityInspector], code: 201, input: [measured_ohms, lab_slot_booking_id, "measured_ohms_b?"], output: CouponMeasurement, side_effects: ["coupon disposition transition", "booking -> COMPLETED", "final fail: order disposition FAILED + auto DefectRecord + boards_scrapped"] }
  - { method: GET, path: "/pcb/coupons/{id}/measurements", description: "List a coupon's measurements (append-only)", roles: [SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: ["limit?", "offset?"], output: "CouponMeasurement[]", side_effects: [] }
  - { method: POST, path: "/pcb/lab-slot-bookings", description: "Book a microsection lab window (half-open + 15 min buffer per station)", roles: [QualityInspector], code: 201, input: [coupon_id, station, starts_at, ends_at], output: LabSlotBooking, side_effects: [] }
  - { method: GET, path: "/pcb/lab-slot-bookings", description: "List bookings", roles: [QualityInspector, ProcessEngineer, FabAdmin], code: 200, input: ["coupon_id?", "station?", "status?", "limit?", "offset?"], output: "LabSlotBooking[]", side_effects: [] }
  - { method: GET, path: "/pcb/lab-slot-bookings/{id}", description: "Read a booking", roles: [QualityInspector, ProcessEngineer, FabAdmin], code: 200, input: [], output: LabSlotBooking, side_effects: [] }
  - { method: POST, path: "/pcb/lab-slot-bookings/{id}/cancel", description: "BOOKED -> CANCELLED", roles: [QualityInspector], code: 200, input: [], output: LabSlotBooking, side_effects: ["LabSlotBooking.version += 1"] }
  - { method: GET, path: "/pcb/lab-slot-bookings/{id}/measurements", description: "List measurements recorded against a booking (0 or 1)", roles: [QualityInspector, ProcessEngineer, FabAdmin], code: 200, input: ["limit?", "offset?"], output: "CouponMeasurement[]", side_effects: [] }

  # --- electrical test ---
  - { method: POST, path: "/pcb/fab-orders/{id}/etest-runs", description: "Schedule an e-test run; order must be AWAITING_ETEST", roles: [QualityInspector], code: 201, input: [fixture_id, test_voltage], output: ElecTestRun, side_effects: [] }
  - { method: GET, path: "/pcb/fab-orders/{id}/etest-runs", description: "List an order's e-test runs", roles: [Customer, SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: ["limit?", "offset?"], output: "ElecTestRun[]", side_effects: [] }
  - { method: POST, path: "/pcb/etest-runs/{id}/start", description: "SCHEDULED -> RUNNING", roles: [QualityInspector], code: 200, input: [], output: ElecTestRun, side_effects: ["ElecTestRun.version += 1"] }
  - { method: POST, path: "/pcb/etest-runs/{id}/complete", description: "RUNNING -> COMPLETED_PASS | COMPLETED_FAIL; PASS auto-completes the order", roles: [QualityInspector], code: 200, input: [outcome, boards_tested, boards_failed, opens_found, shorts_found], output: ElecTestRun, side_effects: ["PASS: order AWAITING_ETEST -> COMPLETED"] }

  # --- defects & pareto ---
  - { method: POST, path: "/pcb/fab-orders/{id}/defects", description: "Log an AOI/manual/e-test defect; order must be IN_PRODUCTION or AWAITING_ETEST; panel_array must belong to the order", roles: [QualityInspector], code: 201, input: [panel_array_id, defect_code, severity, boards_affected, detected_at, source], output: DefectRecord, side_effects: [] }
  - { method: GET, path: "/pcb/fab-orders/{id}/defects", description: "List an order's defect records", roles: [Customer, SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: ["limit?", "offset?"], output: "DefectRecord[]", side_effects: [] }
  - { method: GET, path: "/pcb/panel-arrays/{id}/defects", description: "List a panel array's defect records", roles: [Customer, SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: ["limit?", "offset?"], output: "DefectRecord[]", side_effects: [] }
  - { method: GET, path: "/pcb/defects/pareto", description: "Defect Pareto over [from_iso, to_iso) with MAJOR/SCRAP filter, boards DESC + defect_code ASC tie-break, cumulative %, vital-few flag", roles: [QualityInspector, ProcessEngineer, FabAdmin], code: 200, input: ["from_iso?", "to_iso?"], output: "{ window_start: string, window_end: string, total_boards: integer, rows: array }", side_effects: [] }

  # --- quick-turn lanes & slot commitments ---
  - { method: POST, path: "/pcb/quick-turn-lanes", description: "Configure a quick-turn lane", roles: [FabAdmin], code: 201, input: [lane_code, turn_days, capacity_boards_per_day, premium_multiplier, "active?"], output: QuickTurnLane, side_effects: [] }
  - { method: GET, path: "/pcb/quick-turn-lanes", description: "List lanes", roles: [Customer, SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: ["limit?", "offset?"], output: "QuickTurnLane[]", side_effects: [] }
  - { method: GET, path: "/pcb/quick-turn-lanes/{id}", description: "Read a lane", roles: [Customer, SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: [], output: QuickTurnLane, side_effects: [] }
  - { method: GET, path: "/pcb/quick-turn-lanes/{id}/slots", description: "List per-day lane commitments", roles: [SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: ["ship_date?", "limit?", "offset?"], output: "LaneSlotCommitment[]", side_effects: [] }

  # --- invoices ---
  - { method: POST, path: "/pcb/fab-orders/{id}/invoices/final", description: "Create the order's FINAL invoice (order in AWAITING_ETEST or COMPLETED); FINAL pricing variant", roles: [ProductionPlanner], code: 201, input: [actual_panels_run], output: Invoice, side_effects: ["order_pricing FINAL variant"] }
  - { method: GET, path: "/pcb/fab-orders/{id}/invoices", description: "List an order's invoices", roles: [Customer, SalesEngineer, CAMOperator, ProcessEngineer, QualityInspector, ProductionPlanner, FabAdmin], code: 200, input: ["limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/pcb/invoices/{id}", description: "Read an invoice; Customer role limited to own orders' invoices", roles: [Customer, SalesEngineer, ProductionPlanner, FabAdmin], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/pcb/invoices/{id}/issue", description: "DRAFT -> ISSUED", roles: [SalesEngineer], code: 200, input: [], output: Invoice, side_effects: ["Invoice.version += 1"] }
  - { method: POST, path: "/pcb/invoices/{id}/pay", description: "ISSUED -> PAID by the owning customer", roles: [Customer], code: 200, input: [], output: Invoice, side_effects: ["Invoice.version += 1"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not in the endpoint's role list" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "entity-backed Customer acting on a resource whose customer_id differs from X-User-ID" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "drill approver X-User-ID equals DrillProgram.created_by_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path resource does not exist (validated left-to-right)" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "body-referenced FK target does not exist or belongs to a different parent (e.g., panel_array of another order)" }
  - { id: ERR_VALIDATION, http: 400, condition: "malformed field, out-of-range enum, or violated numeric bound" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "requested transition not defined from the resource's current state" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel attempted from IN_PRODUCTION, AWAITING_ETEST, COMPLETED, SHIPPED, or CANCELLED" }
  - { id: ERR_STACKUP_NOT_LOCKED, http: 409, condition: "submit-dfm without a LOCKED stackup on the order" }
  - { id: ERR_DRILL_NOT_APPROVED, http: 409, condition: "release while the latest drill program is not APPROVED" }
  - { id: ERR_PANEL_NOT_RELEASED, http: 409, condition: "release without a RELEASED panel array" }
  - { id: ERR_LOT_NOT_QUALIFIED, http: 409, condition: "reservation or qualify against a lot not in the required status (incl. EXPIRED lots)" }
  - { id: ERR_COUPON_NOT_PASSED, http: 409, condition: "complete-fab while a coupon_required spec line lacks a PASSED coupon" }
  - { id: ERR_DISPOSITION_FAILED, http: 409, condition: "ship with disposition != PASSED, or complete-fab with disposition FAILED/CONDITIONAL" }
  - { id: ERR_INVOICE_NOT_ISSUED, http: 409, condition: "ship without an ISSUED or PAID final invoice" }
  - { id: ERR_LANE_INACTIVE, http: 409, condition: "order create or release referencing an inactive quick-turn lane" }
  - { id: ERR_COUPON_EXISTS, http: 409, condition: "a non-CANCELLED coupon already exists for the spec line" }
  - { id: ERR_RETEST_LIMIT_REACHED, http: 409, condition: "retest attempted with retest_count == MAX_RETESTS(2)" }
  - { id: ERR_NO_ACTIVE_LAB_BOOKING, http: 409, condition: "measurement without a BOOKED booking covering the logical clock for this coupon" }
  - { id: ERR_INVOICE_EXISTS, http: 409, condition: "the order already has an Invoice" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Customer.contact_email already registered" }
  - { id: ERR_DUPLICATE_LOT_CODE, http: 409, condition: "LaminateLot.lot_code already registered" }
  - { id: ERR_HOLE_BELOW_MIN, http: 422, condition: "drill approve with min_hole_mils < 6" }
  - { id: ERR_ASPECT_RATIO_EXCEEDED, http: 422, condition: "drill approve with plated_aspect_ratio > ceiling (8.0 @ 1oz, 6.0 @ 2oz)" }
  - { id: ERR_IMPEDANCE_SPEC_MISSING, http: 422, condition: "lock of an impedance_controlled stackup with zero spec lines" }
  - { id: ERR_FINISH_LANE_INCOMPATIBLE, http: 422, condition: "IMMERSION_SILVER on a lane with turn_days <= 3" }
  - { id: ERR_SHIP_DATE_IN_PAST, http: 422, condition: "requested_ship_date not strictly after the logical clock" }
  - { id: ERR_LOT_EXPIRES_BEFORE_SHIP, http: 422, condition: "lot expiry_date <= order.requested_ship_date at reservation time (equality rejects)" }
  - { id: ERR_BOOKING_WINDOW_INVALID, http: 422, condition: "booking ends_at <= starts_at or duration > 120 min" }
  - { id: ERR_LAB_SLOT_CONFLICT, http: 409, condition: "booking would leave < 15 min gap to another BOOKED window on the same station" }
  - { id: ERR_ARRAY_YIELD_ZERO, http: 422, condition: "array release with good_boards_per_panel == 0" }
  - { id: ERR_INSUFFICIENT_LAMINATE, http: 409, condition: "panels_allocated > lot.panels_available, or release coverage < panels_required" }
  - { id: ERR_LANE_CAPACITY_EXCEEDED, http: 409, condition: "committed_boards + quantity_boards > capacity_boards_per_day for the ship date" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "provisional_total_cents > customer.credit_limit_cents at release" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Fabrication buyer; owns its orders, pays invoices"
    identity: "entity_backed:Customer"
    exclusive_operations: ["POST /pcb/invoices/{id}/pay"]
    shared_operations: ["POST /pcb/fab-orders", "POST /pcb/fab-orders/{id}/submit-dfm", "POST /pcb/fab-orders/{id}/cancel", "read own orders/invoices/coupons/defects"]
  - name: SalesEngineer
    description: "Internal sales; quotes and invoicing"
    identity: "opaque"
    exclusive_operations: ["POST /pcb/invoices/{id}/issue"]
    shared_operations: ["POST /pcb/fab-orders", "POST /pcb/fab-orders/{id}/submit-dfm", "read orders/customers"]
  - name: CAMOperator
    description: "CAM tooling engineer; owns stackups, panel arrays, drill programs"
    identity: "opaque"
    exclusive_operations: ["POST /pcb/stackups/{id}/spec-lines", "POST /pcb/fab-orders/{id}/panel-arrays", "POST /pcb/panel-arrays/{id}/release", "POST /pcb/fab-orders/{id}/drill-programs", "POST /pcb/drill-programs/{id}/submit", "POST /pcb/drill-programs/{id}/revise"]
    shared_operations: ["POST /pcb/fab-orders/{id}/stackups", "read manufacturing resources"]
  - name: ProcessEngineer
    description: "Process owner; DFM approval, stackup lock, drill approval, laminate receipt"
    identity: "opaque"
    exclusive_operations: ["POST /pcb/fab-orders/{id}/dfm-approve", "POST /pcb/fab-orders/{id}/dfm-reject", "POST /pcb/stackups/{id}/lock", "POST /pcb/drill-programs/{id}/approve", "POST /pcb/drill-programs/{id}/reject", "POST /pcb/laminate-lots"]
    shared_operations: ["GET /pcb/defects/pareto", "read manufacturing resources"]
  - name: QualityInspector
    description: "Quality lab; lot qualification, coupons, microsection, e-test, defects"
    identity: "opaque"
    exclusive_operations: ["POST /pcb/laminate-lots/{id}/qualify", "POST /pcb/laminate-lots/{id}/quarantine", "POST /pcb/fab-orders/{id}/coupons", "POST /pcb/coupons/{id}/retest", "POST /pcb/coupons/{id}/measurements", "POST /pcb/lab-slot-bookings", "POST /pcb/lab-slot-bookings/{id}/cancel", "POST /pcb/fab-orders/{id}/etest-runs", "POST /pcb/etest-runs/{id}/start", "POST /pcb/etest-runs/{id}/complete", "POST /pcb/fab-orders/{id}/defects", "POST /pcb/fab-orders/{id}/requalify"]
    shared_operations: ["GET /pcb/defects/pareto", "read manufacturing resources"]
  - name: ProductionPlanner
    description: "Planner; releases, floor control, laminate reservations, final invoices"
    identity: "opaque"
    exclusive_operations: ["POST /pcb/fab-orders/{id}/release", "POST /pcb/fab-orders/{id}/start-production", "POST /pcb/fab-orders/{id}/hold", "POST /pcb/fab-orders/{id}/unhold", "POST /pcb/fab-orders/{id}/complete-fab", "POST /pcb/fab-orders/{id}/ship", "POST /pcb/laminate-reservations", "POST /pcb/laminate-reservations/{id}/release", "POST /pcb/fab-orders/{id}/invoices/final"]
    shared_operations: ["POST /pcb/fab-orders/{id}/cancel", "read manufacturing resources"]
  - name: FabAdmin
    description: "Site administrator; customers, lanes, concessions, logical clock"
    identity: "opaque"
    exclusive_operations: ["POST /pcb/customers", "POST /pcb/quick-turn-lanes", "POST /pcb/fab-orders/{id}/concede", "POST /pcb/_clock/set_current_utc"]
    shared_operations: ["POST /pcb/fab-orders/{id}/cancel", "GET /pcb/defects/pareto", "read all resources"]
