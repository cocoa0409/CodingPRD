        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: axle_load_as_designed_versus_as_measured_divergence
          rationale: |
            The §1.8 instance is exactly the guide's dual-variant claim on the scaffold's only
            variant-bearing calculation: one physical truck, both bases stamped, with the AS_DESIGNED
            book split (5009/4591/9600, payload 9900) and the AS_MEASURED scale split
            (5099/4721/9820, payload 9680) asserted together with the signed delta and the fact that
            the two certifications coexist rather than superseding one another. The second variant pair
            in §1.3 (provisional vs final warranty liability) is covered by
            warranty_split_provisional_versus_final_taint_shift, and the switch-time delta by
            warranty_cents_conservation_across_dispute_and_readjudication.

      - name: derived_ledger_fields_survive_create_update_and_source_removal
        claim_type: derived_field_reconciliation
        excluded_because:
          difficulty_instance: pto_flow_conservation_across_install_and_remove
          rationale: |
            The guide asks for the derived field to be right after create, after update and after the
            source row disappears. The §1.8 instance walks committed_pto_flow_gpm through exactly that
            arc — seeded from the configuration at order create, re-aggregated as installations are
            added and re-ranked, and floored back to the surviving demand after a removal — and its
            sibling warranty_cents_conservation_across_dispute_and_readjudication does the same for the
            two liability ledgers when a posted claim leaves the set. The aux-draw ledger's own
            fallback-to-baseline case is pinned by
            committed_aux_amp_draw_falls_back_to_the_body_baseline_after_a_removal in §1.9's
            calculations section, so no further instance is warranted here.

  # =========================================================================
  # 9. From Consistency Model — consistency_model: immediate
  # =========================================================================
  - section: consistency_model
    instances:

      - name: every_write_response_already_shows_the_derived_state_it_caused
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/upfit/equipment-installations
          - endpoints.POST_/upfit/weight-certifications/{weight_certification_id}/approve
        distinguishing_aspect: |
          Under an immediate model a mutation's own response body must already carry the fields the
          mutation derived — not merely the row as it looked before the recomputation — and a GET
          issued straight afterwards must agree field for field. The instance targets the two places
          where a write reaches sideways: an equipment installation that rewrites the parent order's
          hydraulic and electrical ledgers while returning the CHILD row, and a certification approval
          that advances the parent order's compliance dimension while returning the CERTIFICATION.
          A deferred or job-based recomputation would still pass a naive create-then-read test but
          fails the same-response assertions here.
        test_recipe:
          setup:
            - "An IN_BUILD F550 service order in a started BODY_MOUNT slot with the body physically mounted, so that an installation and an AS_MEASURED certification are both admissible."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/chassis-models"
              payload: { code: "F550-DRW-84CA", make: "FORD", gvwr_lb: 19500, front_gawr_lb: 7000, rear_gawr_lb: 14706, wheelbase_in: 200, cab_to_axle_in: 84, curb_front_axle_lb: 4820, curb_rear_axle_lb: 2680, max_aux_amp_draw: 60, electrical_bus: "J1939_CAN", pto_provision: "FULL", pto_max_flow_gpm: 18, body_builder_book_rev: "BBB-2026.1", incomplete_vehicle_document_rev: "IVD-2026.1" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cm_a: "$.data.id" }
            - call: "POST /upfit/body-specs"
              payload: { code: "SERVICE-11FT", body_type: "SERVICE", weight_lb: 2100, cg_from_body_front_in: 62, cargo_cg_from_body_front_in: 66, length_in: 132, required_min_ca_in: 84, required_min_wheelbase_in: 189, aux_amp_draw: 12, requires_hydraulics: false, list_price_cents: 1450000 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { bs_svc: "$.data.id" }
            - call: "POST /upfit/equipment-specs"
              payload: { code: "CRANE-6000", equipment_class: "CRANE", weight_lb: 1250, requires_pto: true, required_flow_gpm: 8, aux_amp_draw: 10, duty_priority: 1, mount_zone: "BEHIND_CAB", requires_can_gateway: false, list_price_cents: 780000 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { eq_crane: "$.data.id" }
            - call: "POST /upfit/work-bays"
              payload: { code: "BAY-1", concurrent_capacity: 1, supported_body_types: ["SERVICE", "FLATBED"] }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { bay1: "$.data.id" }
            - call: "POST /upfit/customers"
              payload: { name: "Metro Fleet Services", account_code: "MFS-001", fleet_contact_email: "fleet@metro.example" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cust: "$.data.id" }
            - call: "POST /upfit/build-configurations"
              payload: { config_code: "CFG-SVC-A", chassis_model_id: "${cm_a}", body_spec_id: "${bs_svc}", standardization_tier: "CUSTOM" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { cfg: "$.data.id" }
            - call: "POST /upfit/build-configurations/${cfg}/publish"
              payload: {}
              as: UpfitEngineer
              as_user_id: "eng-1"
            - call: "POST /upfit/chassis"
              payload: { vin: "1FDUF5HT0CC30031", chassis_model_id: "${cm_a}", ownership: "POOL_STOCK", availability_date: "2026-08-05" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { ch: "$.data.id" }
            - call: "POST /upfit/chassis/${ch}/inspect"
              payload: { measured_front_axle_weight_lb: 4905, measured_rear_axle_weight_lb: 2755 }
              as: InstallTechnician
              as_user_id: "tech-1"
              captures: { ch_v: "$.data.version" }
            - call: "POST /upfit/upfit-orders"
              payload: { order_number: "UO-5045", order_type: "CUSTOMER_SPECIFIC", customer_id: "${cust}", build_configuration_id: "${cfg}", body_mount_offset_from_front_axle_in: 120 }
              as: ProductionScheduler
              as_user_id: "ps-1"
              captures: { uo: "$.data.id" }
            - call: "POST /upfit/upfit-orders/${uo}/allocate-chassis"
              payload: { chassis_id: "${ch}", expected_chassis_version: "${ch_v}" }
              as: ProductionScheduler
              as_user_id: "ps-1"
            - call: "POST /upfit/upfit-orders/${uo}/submit-engineering"
              payload: {}
              as: UpfitEngineer
              as_user_id: "eng-1"
            - call: "POST /upfit/upfit-orders/${uo}/release"
              payload: {}
              as: ProductionScheduler
              as_user_id: "ps-2"
            - call: "POST /upfit/build-slots"
              payload: { upfit_order_id: "${uo}", work_bay_id: "${bay1}", slot_type: "BODY_MOUNT", start_date: "2026-08-20", end_date: "2026-08-28" }
              as: ProductionScheduler
              as_user_id: "ps-1"
              captures: { slot: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/build-slots/${slot}/start"
              payload: {}
              as: InstallTechnician
              as_user_id: "tech-1"
