              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", coa_document_ref: "COA-G100" }
              as: QualityAnalyst
              captures: { sia_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals/${sia_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "GA-001", product_name: "GA Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/formulas/${f_id}/ingredients"
