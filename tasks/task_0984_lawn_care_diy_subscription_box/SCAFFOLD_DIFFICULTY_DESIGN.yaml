              as: Agronomist
            - call: "POST /api/plans/${p_id}/activate"
              payload: { expected_lawn_version: "${l_v}" }
              as: Customer
              as_user_id: "${e_id}"
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${e_id}", plan_id: "${p_id}", billing_cycle: MONTHLY, auto_ship: false }
              as: Customer
              as_user_id: "${e_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/shipments"
              payload: { subscription_id: "${sub_id}", box_kind: SEASONAL, ship_date: "2026-06-10T00:00:00Z", delivery_window_start: "2026-06-10T00:00:00Z", delivery_window_end: "2026-06-17T00:00:00Z", lines: [ { product_sku: "FERT-01", qty_units: 3 } ] }
              as: FulfillmentOps
              captures: { box_id: $.data.id }
            - call: "POST /api/shipments/${box_id}/advance-fulfillment"
              payload: { to_status: PICKING }
              as: FulfillmentOps
            - call: "POST /api/shipments/${box_id}/advance-fulfillment"
              payload: { to_status: SHIPPED }
              as: FulfillmentOps
            - call: "GET /api/invoices"
              payload: { shipment_id: "${box_id}" }
              as: PlatformAdmin
              captures: { inv_id: "$.data[0].id"}
            - call: "POST /api/invoices/${inv_id}/record-payment"
              payload: { outcome: SUCCEEDED }
              as: PlatformAdmin
            - call: "GET /api/customers/${r_id}"
              as: PlatformAdmin
              captures: { bal_after_qualify: $.data.credit_balance_cents }
          trigger:
