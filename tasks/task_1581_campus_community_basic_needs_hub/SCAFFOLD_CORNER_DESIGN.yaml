  # ---------------------------------------------------------------------------
  # Section: rbac
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: pantry_staff_cannot_read_assessments
        claim_type: rbac_denial
        grounds: ["validations[priority=5]", "errors[ERR_CONFIDENTIAL]", "roles"]
        distinguishing_aspect: "The confidentiality wall is role-based, not ownership-based: PantryStaff holding a perfectly valid identity gets 403 ERR_CONFIDENTIAL on GET /assessments even for a client they serve daily at the pantry."
        test_recipe:
          setup: ["PantryStaff and IntakeCoordinator staff; client with one SUBMITTED assessment"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "P Pa", email: "pantry@hub.test", staff_role: "PANTRY_STAFF" }
              as: HubAdmin
              captures: { ps_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "cf", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 50000, housing_status: "STABLE", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 1, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "GET /assessments"
              payload: { client_id: "${c_id}" }
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { err: $.data.error_id }
          assert:
            - "403 ERR_CONFIDENTIAL"
            - "the same read as IntakeCoordinator returns 1 row (wall is role-scoped)"

      - name: client_cannot_read_other_clients_record
        claim_type: rbac_denial
        grounds: ["validations[priority=4]", "errors[ERR_FORBIDDEN_OWNERSHIP]", "roles"]
        distinguishing_aspect: "Client role is entity-backed: X-User-ID c1 reading /clients/{c2} yields 403 ERR_FORBIDDEN_OWNERSHIP while the same path with X-User-ID c2 returns 200."
        test_recipe:
          setup: ["two registered clients c1, c2"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { alias_name: "c1", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c1_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "c2", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c2_id: $.data.id }
          trigger:
            - call: "GET /clients/${c2_id}"
              as: Client
              as_user_id: "${c1_id}"
              captures: { err: $.data.error_id }
            - call: "GET /clients/${c2_id}"
              as: Client
              as_user_id: "${c2_id}"
              captures: { ok_alias: $.data.alias_name }
          assert:
            - "c1 -> c2: 403 ERR_FORBIDDEN_OWNERSHIP"
            - "c2 -> c2: 200, alias_name == 'c2'"

      - name: partner_rep_cannot_acknowledge_other_agencys_referral
        claim_type: rbac_denial
        grounds: ["validations[priority=4]", "errors[ERR_FORBIDDEN_OWNERSHIP]", "roles"]
        distinguishing_aspect: "PartnerAgencyRep identity equals the PartnerAgency.id: acknowledging a referral addressed to agency A while presenting agency B's id fails 403 ERR_FORBIDDEN_OWNERSHIP."
        test_recipe:
          setup: ["ACTIVE client; agencies A and B; referral to A in SENT"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "pr", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 40000, housing_status: "STABLE", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 1, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /partner-agencies"
              payload: { agency_name: "Agency A", service_categories: ["SNAP_APPLICATION"], weekly_capacity: 5 }
              as: HubAdmin
              captures: { ag_a: $.data.id }
            - call: "POST /partner-agencies"
              payload: { agency_name: "Agency B", service_categories: ["SNAP_APPLICATION"], weekly_capacity: 5 }
              as: HubAdmin
              captures: { ag_b: $.data.id }
            - call: "POST /clients/${c_id}/referrals"
              payload: { agency_id: "${ag_a}", service_category: "SNAP_APPLICATION" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { r_id: $.data.id }
            - call: "POST /referrals/${r_id}/send"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "POST /referrals/${r_id}/acknowledge"
              payload: {}
              as: PartnerAgencyRep
              as_user_id: "${ag_b}"
              captures: { err: $.data.error_id }
            - call: "POST /referrals/${r_id}/acknowledge"
              payload: {}
              as: PartnerAgencyRep
              as_user_id: "${ag_a}"
              captures: { st: $.data.status }
          assert:
            - "agency B rep -> 403 ERR_FORBIDDEN_OWNERSHIP"
            - "agency A rep -> 200, status ACKNOWLEDGED"

      - name: sod_reviewer_who_assisted_intake_cannot_review
        claim_type: rbac_denial
        grounds: ["validations[priority=9]", "errors[ERR_SOD_CONFLICT]", "roles"]
        distinguishing_aspect: "Segregation of duties in practice: a GrantReviewer who created the application (assisted intake) is barred from begin-review with ERR_SOD_CONFLICT; a second, uninvolved GrantReviewer reviews it successfully."
        test_recipe:
          setup:
            - "ACTIVE client with VERIFIED assessment; GrantReviewers R1 and R2; fund 500000"
            - "R1 created the application on the client's behalf (created_by_user_id == R1); application SUBMITTED"
