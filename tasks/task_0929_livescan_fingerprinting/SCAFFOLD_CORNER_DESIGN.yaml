      - name: second_invoice_with_pre_create_agency_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[invoice-create-stale-agency]
          - errors[ERR_STALE_VERSION]
          - entities.Agency.fields.version
        distinguishing_aspect: "Creating the first invoice increments Agency.version, so a second create still carrying the pre-create version is rejected with 412 even though its period_key is unique."
        test_recipe:
          setup:
            - "An AGENCY_BILLED agency with one NO_SHOW assessment so an invoice has something to bill"
