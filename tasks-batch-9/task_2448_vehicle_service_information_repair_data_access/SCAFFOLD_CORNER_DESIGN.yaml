      - name: parity_index_precision_rounded_value_is_what_is_compared
        claim_type: precision
        grounds:
          - calculations.parity_index.precision
          - calculations.parity_index.constants.PARITY_MAX_INDEX
          - state_machines.License.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          115004 / 100000 is 1.15004 raw, which is strictly above PARITY_MAX_INDEX, but the
          declared precision rounds to 4 decimals FIRST, so the stored index is 1.1500 and the
          verdict is COMPLIANT — and the License parity gate therefore lets activation through.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; SystemArea POWERTRAIN exists"
            - "Manufacturer ACME priced at independent 115004 and dealer 100000"
          setup_api_calls:
