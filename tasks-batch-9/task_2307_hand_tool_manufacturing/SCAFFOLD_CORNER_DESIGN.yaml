          assert:
            - "Re-adding br1 returns HTTP 409 with error_id == 'ERR_DUPLICATE_PACK_MEMBER'"
            - "Adding the PROFESSIONAL SKU returns HTTP 422 with error_id == 'ERR_CHANNEL_MIX_FORBIDDEN'"
            - "Adding the PRIVATE_LABEL SKU also returns HTTP 422 with error_id == 'ERR_CHANNEL_MIX_FORBIDDEN' — the rule is one-channel-per-pack, not merely PROFESSIONAL-isolation"
            - "Adding the second BRANDED SKU returns HTTP 201 with line_extended_cents == 4500 (1500 * 3 * 1.00)"
            - "PackConfiguration.${pack_id}.distinct_member_count == 2 and GET /toolworks/pack-configurations/${pack_id}/members returns total_count 2"

      - name: pack_approval_certification_gate_masks_the_shape_gate
        claim_type: cascading_validation
        grounds:
          - validations[priority=473]
          - validations[priority=922]
          - errors[ERR_MEMBER_SKU_NOT_CERTIFIED]
          - errors[ERR_PACK_CONFIG_INVALID]
        distinguishing_aspect: "Approving an empty MULTIPACK is a pure shape violation (ERR_PACK_CONFIG_INVALID at 922) because the member gate at 473 is vacuously satisfied; once a single uncertified member is appended the SAME shape violation persists but the reported error changes to ERR_MEMBER_SKU_NOT_CERTIFIED, proving 473 runs first."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU with no production lots at all, and one DRAFT MULTIPACK pack keyed on it with zero members."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/pack-configurations"
              payload: { pack_code: "PK-MP-1", pack_type: "MULTIPACK", primary_sku_id: "${sku_id}" }
              as: ChannelManager
              captures: { pack_id: $.data.id }
          trigger:
            - call: "POST /toolworks/pack-configurations/${pack_id}/approve"
              payload: {}
              as: ChannelManager
              captures: { e_shape: $.data.error_id }
            - call: "POST /toolworks/pack-configurations/${pack_id}/members"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: ChannelManager
              captures: { member_id: $.data.id }
            - call: "POST /toolworks/pack-configurations/${pack_id}/approve"
              payload: {}
              as: ChannelManager
              captures: { e_cert: $.data.error_id }
          assert:
            - "The empty-pack approval returns HTTP 422 with error_id == 'ERR_PACK_CONFIG_INVALID' (MULTIPACK requires >= 2 members and total quantity >= 3)"
            - "The one-member approval returns HTTP 409 with error_id == 'ERR_MEMBER_SKU_NOT_CERTIFIED' even though the shape is still invalid"
            - "PackConfiguration.${pack_id}.status is still 'DRAFT' after both attempts, with member_subtotal_cents == 0, security_surcharge_cents == 0 and pack_total_cents == 0"
            - "PackConfiguration.${pack_id}.approved_at is null"

      - name: certification_requires_every_mandatory_test_for_the_family
        claim_type: violation_to_error
        grounds:
          - validations[priority=511]
          - calculations.test_run_outcome.constants.MANDATORY_TESTS
          - errors[ERR_MANDATORY_TEST_MISSING]
        distinguishing_aspect: "The mandatory set is keyed on tool_family: a WRENCH lot with a comfortably PASSED HARDNESS run (pooled 52.50, well above the 51.0 certify floor) is still refused because PROOF_TORQUE, DIMENSIONAL and SALT_SPRAY have no PASSED run, and 511 is reported ahead of the hardness-margin rule at 513."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU on CR_MO, one CR_MO furnace, one lot at ASSEMBLED with a single PASSED HARDNESS run of readings [52.0, 53.0]."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "MACHINED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "PLATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "ASSEMBLED" }
              as: ProductionPlanner
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "HARDNESS", specimen_count: 2, window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }
              as: QualityEngineer
              captures: { run_id: $.data.id }
            - call: "POST /toolworks/test-runs/${run_id}/results"
              payload: { readings: [52.0, 53.0] }
              as: QualityEngineer
          trigger:
            - call: "POST /toolworks/production-lots/${lot_id}/certify"
              payload: {}
              as: QualityEngineer
              captures: { e_missing: $.data.error_id }
          assert:
            - "Certification returns HTTP 422 with error_id == 'ERR_MANDATORY_TEST_MISSING'"
            - "ProductionLot.${lot_id}.cert_status is still 'IN_TEST' and certified_at is null"
            - "The hardness index is comfortably above the floor (pooled 52.50 >= 50.0 + 1.0), so the refusal is attributable only to the missing test types"

      - name: claim_intake_gate_precedence_blocked_beats_tier_beats_duplicate
        claim_type: priority_ordering
        grounds:
          - validations[priority=300]
          - validations[priority=410]
          - validations[priority=515]
          - validations[priority=901]
          - errors[ERR_CLAIMANT_BLOCKED]
          - errors[ERR_WARRANTY_TIER_NOT_COVERED]
          - errors[ERR_DUPLICATE_OPEN_CLAIM]
        distinguishing_aspect: "Four intake gates are stacked on one request and reported in strict priority order: a malformed body beats the blocked claimant (300 < 410), the blocked claimant beats the uncovered warranty tier (410 < 515), and the uncovered tier beats the duplicate open claim (515 < 901) — a request violating all of the last three reports only ERR_CLAIMANT_BLOCKED."
        test_recipe:
          setup:
            - "Two SKUs: one BRANDED WRENCH with warranty_tier LIFETIME and one with warranty_tier NONE."
            - "One programme with fraud_score_threshold 60, one ACTIVE claimant and one BLOCKED claimant."
            - "The ACTIVE claimant already holds a SUBMITTED claim on (LIFETIME SKU, 'SN-1')."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_ok: $.data.id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-19-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 19, alloy_grade: "CR_MO", list_price_cents: 3600, warranty_tier: "NONE" }
              as: ChannelManager
              captures: { sku_none: $.data.id }
            - call: "POST /toolworks/warranty-programs"
              payload: { program_code: "LIFETIME-1", reserve_funded_cents: 5000000, fraud_score_threshold: 60 }
              as: WarrantyAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "active@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { c_active: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "blocked@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { c_blocked: $.data.id }
            - call: "POST /toolworks/claimants/${c_blocked}/block"
              payload: { block_reason: "Confirmed resale fraud" }
              as: WarrantyAdministrator
              captures: { blocked_status: $.data.status }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${c_active}", sku_id: "${sku_ok}", program_id: "${prog_id}", serial_code: "SN-1", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { claim1_id: $.data.id }
          trigger:
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${c_active}", sku_id: "${sku_none}", program_id: "${prog_id}", serial_code: "SN-9", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { e_tier: $.data.error_id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${c_blocked}", sku_id: "${sku_none}", program_id: "${prog_id}", serial_code: "SN-9", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { e_blocked: $.data.error_id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${c_blocked}", sku_id: "${sku_none}", program_id: "${prog_id}", serial_code: "SN-9" }
              as: WarrantyAdministrator
              captures: { e_shape: $.data.error_id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${c_active}", sku_id: "${sku_ok}", program_id: "${prog_id}", serial_code: "SN-1", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { e_dup: $.data.error_id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${c_active}", sku_id: "${sku_ok}", program_id: "${prog_id}", serial_code: "SN-2", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { claim2_id: $.data.id, intake_score: $.data.fraud_score_at_intake }
          assert:
            - "ACTIVE claimant on the NONE-tier SKU returns HTTP 422 with error_id == 'ERR_WARRANTY_TIER_NOT_COVERED'"
            - "BLOCKED claimant on the same NONE-tier SKU returns HTTP 409 with error_id == 'ERR_CLAIMANT_BLOCKED' — 410 outranks 515"
            - "The same request with claim_reason omitted returns HTTP 400 with error_id == 'ERR_INVALID_REQUEST' — 300 outranks 410"
            - "Re-filing (sku_ok, 'SN-1') for the ACTIVE claimant returns HTTP 409 with error_id == 'ERR_DUPLICATE_OPEN_CLAIM'"
            - "A different serial on the same SKU returns HTTP 201 with fraud_score_at_intake == 18 (two claims in the window, no repeated serial) and status 'SUBMITTED' because 18 < 60"
            - "GET /toolworks/warranty-claims returns total_count 2"

      - name: approval_requires_stock_and_at_least_one_line
        claim_type: violation_to_error
        grounds:
          - validations[priority=710]
          - validations[priority=900]
          - errors[ERR_REPLACEMENT_STOCK_INSUFFICIENT]
          - errors[ERR_CLAIM_HAS_NO_LINES]
        distinguishing_aspect: "A line-less claim reaches the very bottom of the approval ladder — its replacement_unit_count and reserve_charge_cents are both 0, so the stock gate at 710 and the reserve gate at 800 are vacuously satisfied and the reported error is ERR_CLAIM_HAS_NO_LINES at 900; a claim WITH lines is then refused for stock at 710 and approves once the receipt covers it."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU with warranty_tier LIFETIME and exactly 1 unit on hand from a stock receipt."
            - "One programme with reserve_funded_cents 5000000 and fraud_score_threshold 60."
            - "One CONSUMER claimant with two SUBMITTED claims: 'SN-1' with no lines and 'SN-2' with one line (HANDLE 1099 x2)."
