      - name: payroll_period_adjacency_allowed_but_overlap_rejected
        grounds:
          - validations.cycle-period-overlap
          - entities.PayrollCycle.fields.period_start_date
          - entities.PayrollCycle.fields.period_end_date
          - errors.ERR_PAY_PERIOD_OVERLAP
          - endpoints.POST_payroll_cycles
        distinguishing_aspect: |
          The contended resource is an Engagement's pay calendar rather than a bank account,
          and the interval semantics are half-open [start, end) rather than closed with a
          buffer: a period starting exactly on 2026-09-01, the day the 2026-08 period ends,
          is accepted because the bound is exclusive, while a period starting 2026-09-15
          inside the accepted 2026-09 period is rejected.
        test_recipe:
          setup:
            - "CountryProfile DE, Provider EuroPay GmbH, ACTIVE Engagement for DE with MONTHLY pay_frequency"
            - "PayrollCycle 2026-08 over the half-open period [2026-08-01, 2026-09-01) with pay_date 2026-08-31"
            - "PayrollCycle 2026-09 created over [2026-09-01, 2026-10-01), proving the touching bound is accepted rather than treated as an overlap"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING", "SOCIAL_INSURANCE"], local_holidays: ["2026-09-25"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_de: "$.data.id" }
            - call: "POST /payroll/providers"
              payload: { legal_name: "EuroPay GmbH", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING", "PAYMENT_DISBURSEMENT"], data_residency_regions: ["EU"], annual_fee_minor: 6000000, indemnity_cap_pct: 25.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p1: "$.data.id" }
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_de}", provider_id: "${prov_p1}", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], filing_responsibility: "PROVIDER", data_residency_region: "EU", pay_frequency: "MONTHLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { eng_de: "$.data.id" }
            - call: "POST /payroll/engagements/${eng_de}/residency-decision"
              payload: { decision: "APPROVE", residency_terms_ref: "DPA-DE-2026-01" }
              as: ComplianceAuditor
              as_user_id: "audit-01"
            - call: "POST /payroll/cycles"
              payload: { engagement_id: "${eng_de}", period_label: "2026-08", period_start_date: "2026-08-01", period_end_date: "2026-09-01", pay_date: "2026-08-31", cutoff_lead_working_days: 3 }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c1: "$.data.id" }
            - call: "POST /payroll/cycles"
              payload: { engagement_id: "${eng_de}", period_label: "2026-09", period_start_date: "2026-09-01", period_end_date: "2026-10-01", pay_date: "2026-09-30", cutoff_lead_working_days: 3, prior_cycle_id: "${c1}" }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c2: "$.data.id" }
          trigger:
            - call: "POST /payroll/cycles"
              payload: { engagement_id: "${eng_de}", period_label: "2026-09-MID", period_start_date: "2026-09-15", period_end_date: "2026-10-15", pay_date: "2026-10-14", cutoff_lead_working_days: 3 }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
          assert:
            - "the 2026-09 creation in setup returned HTTP 201 (adjacency at 2026-09-01 is not an overlap)"
            - "the trigger returns HTTP 409 with error_id ERR_PAY_PERIOD_OVERLAP"
            - "error_id is NOT ERR_PERIOD_FREQUENCY_MISMATCH (the 30-day period is inside the MONTHLY 28..31 band) and NOT ERR_PAY_DATE_OUT_OF_RANGE"
            - "GET /payroll/cycles?engagement_id=${eng_de} returns total_count 2"
            - "PayrollCycle.${c2}.period_start_date == 2026-09-01 and PayrollCycle.${c2}.status == DRAFT"

  - rule_id: compensating_invariant
    instances:
      - name: funding_recall_restores_engagement_treasury_commitment
        grounds:
          - entities.Engagement.fields.treasury_committed_minor
          - state_machines.FundingInstruction.RELEASED_to_RECALLED
          - calculations.treasury_commitment_reconciliation
          - entities.PayrollCycle.fields.funded_total_minor
          - endpoints.POST_payroll_funding_instructions_id_recall
        distinguishing_aspect: |
          The conserved quantity is Engagement.treasury_committed_minor (money committed to
          local accounts): the release adds exactly 9543206 and the recall must subtract
          exactly the same 9543206, returning the engagement to 0, the cycle's
          funded_total_minor to 0 and the cycle's status to RESULTS_APPROVED with no residue
          anywhere.
        test_recipe:
          setup:
            - "CountryProfile DE, Provider EuroPay GmbH, ACTIVE Engagement for DE with treasury_committed_minor 0"
            - "VERIFIED LocalBankAccount DE-ACC-1 in EUR"
            - "PayrollCycle 2026-08 driven to FUNDED by a RELEASED FundingInstruction of funded_source_minor 9543206 (approved by treas-01, released by treas-02)"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING", "SOCIAL_INSURANCE"], local_holidays: ["2026-09-25"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_de: "$.data.id" }
            - call: "POST /payroll/providers"
              payload: { legal_name: "EuroPay GmbH", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING", "PAYMENT_DISBURSEMENT"], data_residency_regions: ["EU"], annual_fee_minor: 6000000, indemnity_cap_pct: 25.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p1: "$.data.id" }
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_de}", provider_id: "${prov_p1}", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], filing_responsibility: "PROVIDER", data_residency_region: "EU", pay_frequency: "MONTHLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { eng_de: "$.data.id" }
            - call: "POST /payroll/engagements/${eng_de}/residency-decision"
              payload: { decision: "APPROVE", residency_terms_ref: "DPA-DE-2026-01" }
              as: ComplianceAuditor
              as_user_id: "audit-01"
            - call: "POST /payroll/bank-accounts"
              payload: { engagement_id: "${eng_de}", account_ref: "DE-ACC-1", account_currency: "EUR", residency_region: "EU", daily_cap_minor: 20000000, settlement_window_hours: 24, buffer_hours: 12 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { ba1: "$.data.id" }
            - call: "POST /payroll/bank-accounts/${ba1}/verify"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /payroll/cycles"
              payload: { engagement_id: "${eng_de}", period_label: "2026-08", period_start_date: "2026-08-01", period_end_date: "2026-09-01", pay_date: "2026-08-31", cutoff_lead_working_days: 3 }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c1: "$.data.id" }
            - call: "POST /payroll/input-files"
              payload: { cycle_id: "${c1}", source_system: "HRIS_CORE", record_count: 200, gross_declared_minor: 10000000, country_elements: { tax_id: "DE-TAX-100", social_insurance_no: "DE-SI-100", iban: "DE89370400440532013000" }, residency_region_of_transfer: "EU" }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { if1: "$.data.id" }
            - call: "POST /payroll/input-files/${if1}/validate"
              payload: {}
              as: GlobalPayrollOps
              as_user_id: "ops-01"
            - call: "POST /payroll/cycles/${c1}/lock-inputs"
              payload: {}
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c1_v: "$.data.version" }
            - call: "POST /payroll/gross-to-net-runs"
              payload: { cycle_id: "${c1}", input_file_id: "${if1}", gross_minor: 10000000, net_minor: 6500000, employer_cost_minor: 2000000, provider_fee_minor: 150000, employee_count: 200, expected_cycle_version: "${c1_v}" }
              as: ProviderUser
              as_user_id: "${prov_p1}"
              captures: { r1: "$.data.id" }
            - call: "POST /payroll/gross-to-net-runs/${r1}/review"
              payload: { decision: "APPROVE" }
              as: PayrollController
              as_user_id: "ctrl-01"
            - call: "POST /payroll/funding-instructions"
              payload: { cycle_id: "${c1}", bank_account_id: "${ba1}", value_date: "2026-08-10", funding_currency: "USD", fx_rate: 0.920000 }
              as: TreasuryOfficer
              as_user_id: "treas-01"
              captures: { fi1: "$.data.id" }
            - call: "POST /payroll/funding-instructions/${fi1}/approve"
              payload: {}
              as: TreasuryOfficer
              as_user_id: "treas-01"
            - call: "POST /payroll/funding-instructions/${fi1}/release"
              payload: {}
              as: TreasuryOfficer
              as_user_id: "treas-02"
          trigger:
            - call: "POST /payroll/funding-instructions/${fi1}/recall"
              payload: { recall_reason: "wrong local account named by treasury, funds returned same day" }
              as: TreasuryOfficer
              as_user_id: "treas-02"
          assert:
            - "FundingInstruction.${fi1}.status == RECALLED"
            - "FundingInstruction.${fi1}.funded_source_minor == 9543206 (the instruction keeps its amount)"
            - "Engagement.${eng_de}.treasury_committed_minor == 0 (exactly the released amount was reversed)"
            - "PayrollCycle.${c1}.funded_total_minor == 0"
            - "PayrollCycle.${c1}.status == RESULTS_APPROVED"
            - "GET /payroll/cycles/${c1}/audit-evidence?control_ref=CTRL_FUNDING_DUAL_AUTH still returns total_count 1 (evidence of what happened is not erased)"

      - name: cycle_cancellation_restores_country_open_filing_obligations
        grounds:
          - entities.CountryProfile.fields.open_filing_obligation_count
          - state_machines.PayrollCycle.INPUTS_LOCKED_to_CANCELLED
          - calculations.country_obligation_reconciliation
          - state_machines.StatutoryFiling.PENDING_to_VOIDED
          - endpoints.POST_payroll_cycles_id_cancel
        distinguishing_aspect: |
          The conserved quantity is CountryProfile.open_filing_obligation_count, a count of
          outstanding statutory obligations rather than a money balance: locking inputs
          mints two PENDING filings and lifts the count from 0 to 2, and cancelling the
          cycle must void exactly those two and return the count to 0, leaving no phantom
          obligation attached to a cancelled cycle.
        test_recipe:
          setup:
            - "CountryProfile DE with required_filing_types [INCOME_TAX_WITHHOLDING, SOCIAL_INSURANCE] and open_filing_obligation_count 0"
            - "Provider EuroPay GmbH and an ACTIVE Engagement for DE"
            - "PayrollCycle 2026-08 driven to INPUTS_LOCKED, which mints two PENDING StatutoryFiling rows and lifts open_filing_obligation_count to 2"
            - "no filing has been lodged and no FundingInstruction exists, so the cancellation preconditions hold"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING", "SOCIAL_INSURANCE"], local_holidays: ["2026-09-25"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_de: "$.data.id" }
            - call: "POST /payroll/providers"
              payload: { legal_name: "EuroPay GmbH", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING", "PAYMENT_DISBURSEMENT"], data_residency_regions: ["EU"], annual_fee_minor: 6000000, indemnity_cap_pct: 25.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p1: "$.data.id" }
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_de}", provider_id: "${prov_p1}", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], filing_responsibility: "PROVIDER", data_residency_region: "EU", pay_frequency: "MONTHLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { eng_de: "$.data.id" }
            - call: "POST /payroll/engagements/${eng_de}/residency-decision"
              payload: { decision: "APPROVE", residency_terms_ref: "DPA-DE-2026-01" }
              as: ComplianceAuditor
              as_user_id: "audit-01"
            - call: "POST /payroll/cycles"
              payload: { engagement_id: "${eng_de}", period_label: "2026-08", period_start_date: "2026-08-01", period_end_date: "2026-09-01", pay_date: "2026-08-31", cutoff_lead_working_days: 3 }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c1: "$.data.id" }
            - call: "POST /payroll/input-files"
              payload: { cycle_id: "${c1}", source_system: "HRIS_CORE", record_count: 200, gross_declared_minor: 10000000, country_elements: { tax_id: "DE-TAX-100", social_insurance_no: "DE-SI-100", iban: "DE89370400440532013000" }, residency_region_of_transfer: "EU" }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { if1: "$.data.id" }
            - call: "POST /payroll/input-files/${if1}/validate"
              payload: {}
              as: GlobalPayrollOps
              as_user_id: "ops-01"
            - call: "POST /payroll/cycles/${c1}/lock-inputs"
              payload: {}
              as: GlobalPayrollOps
              as_user_id: "ops-01"
            - call: "GET /payroll/filings"
              payload: { cycle_id: "${c1}" }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { f1: "$.data[0].id", f2: "$.data[1].id" }
          trigger:
            - call: "POST /payroll/cycles/${c1}/cancel"
              payload: { cancel_reason: "country payroll migrated to the successor provider mid-period" }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
          assert:
            - "PayrollCycle.${c1}.status == CANCELLED"
            - "CountryProfile.${cp_de}.open_filing_obligation_count == 0 (was 2 immediately before the cancel)"
            - "StatutoryFiling.${f1}.status == VOIDED and StatutoryFiling.${f1}.penalty_status == NONE"
            - "StatutoryFiling.${f2}.status == VOIDED and StatutoryFiling.${f2}.penalty_status == NONE"
            - "InputFile.${if1}.status == VALIDATED (the extract is not retro-actively invalidated)"
            - "Provider.${prov_p1}.open_penalty_minor == 0 and Provider.${prov_p1}.status == ACTIVE"
