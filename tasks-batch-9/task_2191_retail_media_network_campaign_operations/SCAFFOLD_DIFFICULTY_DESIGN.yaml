            - "Campaign.${camp_id}.delivered_spend_cents == 1250"
            - "AuctionEvent.${auc_id}.clearing_price_cents == 1250 and AuctionEvent.${auc_id}.settled_spend_cents == 1250  # single candidate, so raw = floor_cpc_cents = 1250"
            - "Invoice.${inv_id}.onsite_spend_cents == 1250 and Invoice.${inv_id}.offsite_spend_cents == 0"
            - "Invoice.${inv_id}.gross_spend_cents == 1250"
            - "Invoice.${inv_id}.managed_service_fee_cents == 63  # round_half_up(1250 * 0.05) = round_half_up(62.5) = 63"
            - "Invoice.${inv_id}.dispute_credit_cents == 0  # a WITHDRAWN dispute is not UPHELD, so STEP 5 contributes nothing"
            - "Invoice.${inv_id}.trade_fund_deduction_cents == 0  # STEP 8 min(round_half_up(1250*0.6)=750, round_half_up(1313*0.20)=263, available_cents=0, trade_fund_share_cents-0=0) = 0"
            - "Invoice.${inv_id}.net_cash_due_cents == 1313  # max(0, 1250 + 63 - 0) - 0"
            - "Invoice.${inv_id}.variance_pct == 0.00"
            - "Invoice.${inv_id}.issued_at == 2026-09-01T00:00:00.000Z and Invoice.${inv_id}.due_at == 2026-10-01T00:00:00.000Z  # issued_at + NET_TERMS_DAYS 30"
            - "Invoice.${inv_id}.invoice_status == ISSUED  # DRAFT -> ISSUED -> DISPUTED -> ISSUED, back to the state it held before the dispute"
            - "Invoice.${inv_id}.adjustment_round == 0  # the withdrawal path never adjusts the invoice"
            - "MeasurementDispute.${disp_id}.dispute_status == WITHDRAWN and MeasurementDispute.${disp_id}.approved_credit_cents == 0"
            - "BudgetPlan.${plan_id}.available_cents == 34998750  # 40000000 - 5000000 reserved (the campaign is still DELIVERING, so it keeps reserving) - 1250 consumed"
            - "BudgetPlan.${plan_id}.available_cents != 39998750 (the value if a billed campaign wrongly released its reservation)"
  - rule_id: transitive_cascade
    instances:
      - name: tc_catalog_out_of_stock_three_hop_pause_chain
        grounds:
          - state_machines.CatalogProduct.ELIGIBLE_to_OUT_OF_STOCK
          - state_machines.ProductAssignment.ACTIVE_to_PAUSED_OOS
          - state_machines.LineItem.SERVING_to_OOS_PAUSED
          - state_machines.Campaign.DELIVERING_to_PAUSED
          - calculations.line_item_reservation
          - calculations.slot_occupancy_overlap
          - entities.Campaign.fields.oos_paused_line_item_count
          - entities.LineItem.fields.eligible_product_count
          - entities.PlacementSlot.fields.occupancy_count
        distinguishing_aspect: |
          This cascade is triggered by CatalogProduct ELIGIBLE -> OUT_OF_STOCK and each hop is
          caused strictly by the previous hop: the stock movement flips the product, the flipped
          product flips its ProductAssignment to PAUSED_OOS, that assignment flip drives
          LineItem.eligible_product_count to 0 which flips the LineItem to OOS_PAUSED, and only
          that LineItem flip flips the Campaign to PAUSED — no hop is written directly by the
          stock-adjustment call.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-05T12:00:00Z."
            - "Advertiser BREWCO (SELF_SERVE, credit_limit_cents 100000000) onboarded to onboarding_status=ACTIVE."
            - "BudgetPlan 2026-Q3 with committed_total_cents=1000000 and trade_fund_share_cents=0 in plan_status=ACTIVE."
            - "ONSITE PlacementSlot with max_concurrent_line_items=2, floor_cpc_cents=250000, relevance_weight=1.0, no exclusivity category."
            - "CatalogProduct SKU-COFFEE-1 with in_stock_units=10, min_stock_units_for_serving=5, eligibility_status=ELIGIBLE."
            - "Campaign ONSITE_ONLY flight [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z), allocated_budget_cents=500000, daily_cap_cents=400000, delivery_status=DELIVERING, billing_status=ACCRUING."
