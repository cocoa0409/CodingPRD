  # ===========================================================================
  - section: errors
    instances:
      - name: c_appeal_after_30_days_expired
        claim_type: Violation → Error
        grounds:
          - errors.ERR_APPEAL_WINDOW_EXPIRED
          - state_machines.MisconductCase.SANCTIONED_to_APPEALED
        distinguishing_aspect: "The appeal window is inclusive at exactly sanctioned_at + 30 days: an appeal at 2027-04-20 (31 days after the 2027-03-20 sanction) is 422 ERR_APPEAL_WINDOW_EXPIRED, while the same appeal at 2027-04-19 succeeds."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A ENROLLED. External-report case opened by inv-1 and SANCTIONED (WARNING) by adj-1 at clock 2027-03-20T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_enroll_a
            - *c_pay_enr_a
            - call: "POST /charter/misconduct-cases"
              payload: { candidate_id: "${cand_a}", allegation: "Credential misrepresentation" }
              as: ConductInvestigator
              as_user_id: "inv-1"
              captures: { case_x: $.data.id, case_x_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /charter/misconduct-cases/${case_x}/adjudicate"
              payload: { outcome: "SANCTIONED", sanction_type: "WARNING", expected_case_version: "${case_x_v}" }
              as: ConductAdjudicator
              as_user_id: "adj-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /charter/misconduct-cases/${case_x}/appeal"
              payload: { appeal_reason: "Too late" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-19T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /charter/misconduct-cases/${case_x}/appeal"
              payload: { appeal_reason: "Just in time" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { case_x_st: $.data.status }
          assert:
            - "the 2027-04-20 appeal is 422 ERR_APPEAL_WINDOW_EXPIRED (31 days past sanction)"
            - "the 2027-04-19 appeal (exactly sanctioned_at + 30 days) succeeds and case_x_st == APPEALED"

      - name: c_second_case_on_flagged_appointment_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_CASE_ALREADY_OPEN_FOR_APPOINTMENT
        distinguishing_aspect: "One live case per appointment: a second case against an appointment whose first case is still OPENED is 409 ERR_CASE_ALREADY_OPEN_FOR_APPOINTMENT."
        test_recipe:
          setup:
            - "Clock 2027-01-05. A ENROLLED with a booked appointment; one appointment-linked case already OPENED."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_enroll_a
            - *c_pay_enr_a
            - *c_level1
            - *c_win1
            - *c_ctr2
            - *c_book_a
            - call: "POST /charter/misconduct-cases"
              payload: { candidate_id: "${cand_a}", appointment_id: "${appt_a}", allegation: "Notes incident" }
              as: Proctor
              as_user_id: "prt-7"
          trigger:
            - call: "POST /charter/misconduct-cases"
              payload: { candidate_id: "${cand_a}", appointment_id: "${appt_a}", allegation: "Second report" }
              as: ConductInvestigator
              as_user_id: "inv-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_CASE_ALREADY_OPEN_FOR_APPOINTMENT"
            - "GET /charter/misconduct-cases?appointment_id=${appt_a} still returns exactly 1 row"

      - name: c_duplicate_conduct_statement_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DUPLICATE_CONDUCT_STATEMENT
          - entities.Candidate.fields.conduct_statements
        distinguishing_aspect: "The (candidate, disclosure_year) uniqueness holds: a second 2027 statement from the same candidate is 409 ERR_DUPLICATE_CONDUCT_STATEMENT."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A with a filed 2027 statement."
          setup_api_calls:
