  - rule_id: transitive_cascade
    instances:
      - name: scale_violation_cascade_depth4
        grounds:
          - calculations.overweight_violation_and_fine
          - state_machines.Permit.GRANTED_to_REVOKED
          - state_machines.Load.IN_TRANSIT_to_ON_HOLD
          - state_machines.EscortBooking.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 transitive cascade from POST scale-tickets: ticket -> (1) OVERWEIGHT
          Fine created, (2) GRANTED OVERWEIGHT permit -> REVOKED, (3) Load IN_TRANSIT
          -> ON_HOLD, (4) CONFIRMED escort -> CANCELLED; each link is caused by the
          previous link's mutation, and the OVERSIZE permit on the same load is
          provably untouched (only OVERWEIGHT/SUPERLOAD permits revoke).
        test_recipe:
          setup:
            - "Load 96000 lbs, 150x100x400 in, states [CA], IN_TRANSIT; CA OVERSIZE GRANTED (11500), CA OVERWEIGHT GRANTED (31000); REAR escort CONFIRMED; cranes SCHEDULED"
