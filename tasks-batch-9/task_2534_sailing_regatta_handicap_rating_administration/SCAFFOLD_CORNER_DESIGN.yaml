      - name: hearing_and_decision_rejections_across_the_protest_lifecycle
        claim_type: error_triggerable
        grounds:
          - errors[ERR_HEARING_TIME_INVALID]
          - errors[ERR_HEARING_NOT_DUE]
          - errors[ERR_EVIDENCE_REQUIRED]
          - errors[ERR_DECISION_PAYLOAD_INVALID]
          - errors[ERR_REDRESS_NOT_COMPUTABLE]
          - validations[priority 16 ERR_HEARING_NOT_DUE]
          - validations[priority 40 ERR_EVIDENCE_REQUIRED]
          - validations[priority 42 ERR_DECISION_PAYLOAD_INVALID]
          - validations[priority 43 ERR_REDRESS_NOT_COMPUTABLE]
          - validations[priority 51 ERR_HEARING_TIME_INVALID]
          - state_machines[Protest]
          - calculations[redress_points_average]
        distinguishing_aspect: |
          Every gate of the hearing lifecycle fires in its own right: a hearing in the past is 422
          ERR_HEARING_TIME_INVALID, hearing early is 409 ERR_HEARING_NOT_DUE and beats the missing
          evidence at priority 40, hearing at the exact hearing instant with an empty log is 409
          ERR_EVIDENCE_REQUIRED, PENALTY_DSQ without a target and DISMISSED carrying a
          redress_race_number are both 422 ERR_DECISION_PAYLOAD_INVALID, and a well-formed
          REDRESS_GRANTED whose target has no other counted result is 422 ERR_REDRESS_NOT_COMPUTABLE.
        test_recipe:
          setup:
            - "A light RACING world with entries A and B ACCEPTED in CONFIRMED division A, panel P SEATED with chair Nils Brandt and one further seat, jury_quorum_required 2, planned_race_count 6."
            - "Race 1 (6.0 nm, scheduled 2026-08-05T14:00:00Z) started at 14:00; at clock 15:00:00Z entry A finished in 3900.0 s and entry B in 4300.0 s, and the race was scored FINAL (A place 1 / 1.0 points, B place 2 / 2.0 points)."
            - "Entry A then lodged a protest against entry B for an incident at 14:30:00Z, so the protest is FILED with an empty evidence log."
            - "No jury member is a helm, crew member or CONFIRMED PRO of this regatta, and the chair did not measure either pinned certificate."
