          setup:
            - "Carrier Dune with one GENERAL product."
            - "Employee Iyer, annual_salary_usd 600000.00, with a consent for 2026-08-01..2027-07-31 that is executed and then revoked, plus a second EXECUTED consent for the well-separated window 2027-09-01..2028-08-31."
