    path: "/state-profiles"
    description: "Create a StateRegulatoryProfile for a product+state"
    roles: [ComplianceOfficer]
    code: 201
    input: [product_id, state_code, filing_method, min_effective_lead_days, objection_response_sla_days, deemer_days, max_single_change_pct, renewal_notice_days, disapproval_window_days]
    output: StateRegulatoryProfile
    side_effects: ["status=ACTIVE; ERR_DUPLICATE_PROFILE if a profile already exists for (product_id, state_code)"]

  - method: GET
    path: "/state-profiles/{profileId}"
    description: "Get a StateRegulatoryProfile"
    roles: [ProductActuary, FilingAnalyst, ComplianceOfficer, StateRegulator, ImplementationLead, PlatformAdmin]
    code: 200
    input: []
    output: StateRegulatoryProfile
    side_effects: []

  - method: GET
    path: "/state-profiles"
