# =============================================================================
# Task 1201: Tank Cleaning & Terminal Services — scaffold seed tables
# =============================================================================

scenario: |
  1201. Tank Cleaning & Terminal Services (tank cleaning contractor): tank
  out-of-service scheduling & product heel, sludge removal & waste profiling,
  gas-free certification & entry permit, inspection (API 653) coordination &
  findings, product changeover compatibility & flush, wastewater treatment
  discharge, contractor safety qualification, return-to-service &
  recertification

domain_name: tank-cleaning-terminal-services
api_prefix: /ops

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all FKs canonical)
# =============================================================================
entities:
  - name: Terminal
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Terminal display name" }
      - { name: wastewater_daily_capacity_liters, type: integer, source: input, description: "Max authorized+discharged effluent liters per UTC day" }
      - { name: safety_score_threshold, type: number, source: input, default: 85.0, description: "Minimum contractor safety_score to qualify (inclusive)" }
      - { name: score_variant, type: enum, source: input, default: ROLLING_12MO, description: "ROLLING_12MO | LIFETIME — pins which contractor_safety_score variant this terminal evaluates" }
      - { name: mass_balance_tolerance_pct, type: number, source: input, default: 2.0, description: "Allowed |actual - expected| solids fraction at return-to-service (inclusive)" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique product code" }
      - { name: family, type: enum, source: input, description: "GASOLINE | DISTILLATE | JET | CRUDE | CHEMICAL | VEGOIL" }
      - { name: viscosity_class, type: enum, source: input, description: "LOW | MEDIUM | HIGH — drives flush base factor and sludge surface factor" }
      - { name: compatibility_group, type: string, source: input, description: "Free-form group key (e.g. GAS, DIST, JET, CRUDE, CHEM, VEG) used by the changeover matrix" }
      - { name: flash_point_c, type: number, source: input, description: "Flash point in Celsius" }

  - name: Tank
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; owning terminal" }
      - { name: tank_number, type: string, source: input, description: "Terminal-unique tank tag" }
      - { name: capacity_m3, type: integer, source: input, description: "Shell capacity in cubic meters" }
      - { name: current_product_id, type: string, source: input, description: "FK -> Product.id; product currently in service" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | OUT_OF_SERVICE" }

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Contractor company name" }
      - { name: status, type: enum, source: system, description: "APPLICANT | QUALIFIED | SUSPENDED | BARRED" }
      - { name: safety_score, type: number, source: computed, description: "Score per the evaluating terminal's score_variant; recomputed on every SafetyEvent write; 2 decimals" }

  - name: SafetyEvent
    parent: null
    common_fields: false
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; subject contractor" }
      - { name: kind, type: enum, source: input, description: "INCIDENT | VIOLATION | NEAR_MISS | TRAINING_CREDIT" }
      - { name: severity_weight, type: integer, source: input, description: "1..10 weight multiplied by the kind factor" }
      - { name: occurred_at, type: datetime, source: input, description: "When the event occurred (drives rolling-window inclusion)" }

  - name: CleaningJob
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; must equal the tank's terminal" }
      - { name: tank_id, type: string, source: input, description: "FK -> Tank.id; tank to be cleaned" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; cleaning contractor" }
      - { name: from_product_id, type: string, source: input, description: "FK -> Product.id; product being removed" }
      - { name: to_product_id, type: string, source: input, description: "FK -> Product.id; next product for the tank" }
      - { name: lines_included, type: boolean, source: input, default: false, description: "Whether transfer lines are flushed too (adds LINES_ALLOWANCE_L)" }
      - { name: heel_volume_liters_sounding, type: integer, source: input, description: "Provisional heel volume from sounding tape" }
      - { name: heel_volume_liters_metered, type: integer, source: input, description: "Final heel volume from pump-out meter; set by record-heel-removal" }
      - { name: residual_sludge_kg, type: integer, source: input, default: 0, description: "Unrecoverable solids left in tank; set by record-sludge-removal" }
      - { name: base_service_fee_cents, type: integer, source: input, description: "Fixed cleaning fee before waste/flush charges" }
      - { name: changeover_class, type: enum, source: computed, description: "COMPATIBLE_DIRECT | REQUIRES_FLUSH | REQUIRES_FULL_STRIP | FORBIDDEN — from product compatibility matrix" }
      - { name: sludge_estimate_provisional_kg, type: integer, source: computed, description: "Provisional solids estimate from sounding volume (variant A)" }
      - { name: expected_solids_kg, type: integer, source: computed, description: "Final-basis expected solids from metered heel (variant B); null until heel removal" }
      - { name: shipped_solids_kg, type: integer, source: computed, description: "Sum of manifested kg over WasteShipment in {DELIVERED, RECONCILED} for this job + residual_sludge_kg" }
      - { name: flush_volume_liters, type: integer, source: computed, description: "Required flush volume from flush_volume_liters calculation" }
      - { name: waste_cost_cents, type: integer, source: computed, description: "Sum of disposal costs over RECONCILED shipments" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "Final invoice per job_invoice_total_cents; computed at request-rts" }
      - { name: window_id, type: string, source: system, description: "FK -> ServiceWindow.id; linked out-of-service window; null until scheduled" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | TANK_OOS | HEEL_REMOVED | SLUDGE_REMOVED | GAS_FREE_PENDING | GAS_FREE_CERTIFIED | ENTRY_IN_PROGRESS | ENTRY_COMPLETE | INSPECTION_IN_PROGRESS | INSPECTION_ACCEPTED | REWORK_CLEANING | FLUSH_IN_PROGRESS | FLUSH_VERIFIED | RTS_PENDING | RETURNED_TO_SERVICE | PAUSED | CANCELLED" }
      - { name: paused_from, type: enum, source: system, description: "Status held when PAUSED was entered; null unless PAUSED" }
      - { name: pause_reason, type: enum, source: system, description: "CERT_REVOKED | CERT_EXPIRED | MANUAL; null unless PAUSED" }

  - name: ServiceWindow
    parent: null
    common_fields: true
    fields:
      - { name: tank_id, type: string, source: input, description: "FK -> Tank.id; tank taken out of service" }
      - { name: job_id, type: string, source: system, description: "FK -> CleaningJob.id; set when a job is scheduled against this window; null while unlinked" }
      - { name: planned_start, type: datetime, source: input, description: "Half-open interval start [planned_start, planned_end)" }
      - { name: planned_end, type: datetime, source: input, description: "Half-open interval end (exclusive)" }
      - { name: status, type: enum, source: system, description: "PLANNED | ACTIVE | COMPLETED | CANCELLED | OVERRUN" }

  - name: WasteProfile
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> CleaningJob.id; job whose waste is profiled" }
      - { name: waste_code, type: string, source: input, description: "Regulatory waste code (e.g. K051)" }
      - { name: hazard_class, type: enum, source: input, description: "NON_HAZARDOUS | HAZARDOUS" }
      - { name: lab_flash_point_c, type: number, source: input, description: "Lab-measured flash point of the waste" }
      - { name: lab_tph_mg_l, type: number, source: input, description: "Lab-measured total petroleum hydrocarbons mg/L" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED" }

  - name: WasteShipment
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> CleaningJob.id; job generating the waste" }
      - { name: profile_id, type: string, source: input, description: "FK -> WasteProfile.id; must be APPROVED and belong to the same job" }
      - { name: lines, type: array, source: input, description: "Items: { material: SLUDGE | WASH_WATER | SCALE, kg: integer, rate_cents_per_kg: number }" }
      - { name: manifested_kg, type: integer, source: computed, description: "Sum of lines[].kg" }
      - { name: disposal_cost_cents, type: integer, source: computed, description: "Per-line rounded cost sum per waste_disposal_cost_cents" }
      - { name: status, type: enum, source: system, description: "BOOKED | IN_TRANSIT | DELIVERED | RECONCILED | VOIDED" }

  - name: GasFreeCertificate
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> CleaningJob.id; job in GAS_FREE_PENDING" }
      - { name: lel_pct, type: number, source: input, description: "Lower-explosive-limit reading percent; must be < 10.0" }
      - { name: o2_pct, type: number, source: input, description: "Oxygen percent; must be within [19.5, 23.5] inclusive" }
      - { name: h2s_ppm, type: number, source: input, description: "Hydrogen sulfide ppm; must be <= 10.0 inclusive" }
      - { name: benzene_ppm, type: number, source: input, description: "Benzene ppm; must be < 1.0" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock time at issuance" }
      - { name: expires_at, type: datetime, source: computed, description: "issued_at + 12h; +6h more if revalidated once" }
      - { name: revalidated, type: boolean, source: system, default: false, description: "True after the single allowed revalidation" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the issuing MarineChemist (segregation-of-duties anchor)" }
      - { name: status, type: enum, source: system, description: "VALID | EXPIRED | REVOKED | SUPERSEDED" }

  - name: EntryPermit
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> CleaningJob.id; confined-space job" }
      - { name: cert_id, type: string, source: input, description: "FK -> GasFreeCertificate.id; must be VALID at issue/activate time" }
      - { name: max_entrants, type: integer, source: input, description: "Maximum entrants allowed inside the tank under this permit, >= 1" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the issuing EHSOfficer" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ISSUED | ACTIVE | SUSPENDED | CLOSED | VOIDED" }
      - { name: atmosphere, type: enum, source: system, description: "CLEAR | ALARM | RETEST_REQUIRED — independent parallel dimension" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Inspector name" }
      - { name: certification_level, type: enum, source: input, description: "API653 | API650 | BOTH" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> CleaningJob.id; job in ENTRY_IN_PROGRESS or ENTRY_COMPLETE" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id; assigned certified inspector" }
      - { name: scheduled_start, type: datetime, source: input, description: "Half-open interval start on the inspector calendar" }
      - { name: scheduled_end, type: datetime, source: input, description: "Half-open interval end (exclusive); adjacency allowed" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of the inspector who reported" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | REPORTED | ACCEPTED | REJECTED | CANCELLED" }

  - name: InspectionFinding
    parent: null
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; parent inspection (IN_PROGRESS only)" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | MAJOR | MINOR" }
      - { name: description, type: string, source: input, description: "Finding narrative" }
      - { name: requires_repair, type: boolean, source: input, description: "Whether a RepairOrder is required" }
      - { name: status, type: enum, source: system, description: "OPEN | REPAIR_ORDERED | RESOLVED | ACCEPTED_RISK" }

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - { name: finding_id, type: string, source: input, description: "FK -> InspectionFinding.id; finding being repaired" }
      - { name: job_id, type: string, source: system, description: "FK -> CleaningJob.id; denormalized from the finding's inspection" }
      - { name: description, type: string, source: input, description: "Repair scope" }
      - { name: completed_by_user_id, type: string, source: system, description: "X-User-ID of the ContractorSupervisor who completed the repair" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_PROGRESS | COMPLETED | VERIFIED" }

  - name: WastewaterBatch
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; treatment plant" }
      - { name: job_id, type: string, source: input, description: "FK -> CleaningJob.id; source job" }
      - { name: volume_liters, type: integer, source: input, description: "Batch volume in liters, > 0" }
      - { name: ph, type: number, source: input, description: "Lab pH; set by submit-lab; must be within [6.0, 9.0] inclusive to authorize" }
      - { name: tph_mg_l, type: number, source: input, description: "Lab TPH mg/L; must be <= 15.0 inclusive to authorize" }
      - { name: lab_user_id, type: string, source: system, description: "X-User-ID of the LabTechnician who submitted results" }
      - { name: discharge_day, type: string, source: system, description: "UTC calendar day (YYYY-MM-DD) assigned at authorization; capacity bucket key" }
      - { name: status, type: enum, source: system, description: "COLLECTED | LAB_TESTED | AUTHORIZED | DISCHARGED | REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CleaningJob
    initial_state: DRAFT
    terminal_states: [RETURNED_TO_SERVICE, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /ops/cleaning-jobs/{jobId}/schedule"
        actor: TerminalOperator
        preconditions:
          - "window_id names a PLANNED ServiceWindow with window.tank_id == job.tank_id and window.job_id null (ERR_WINDOW_UNAVAILABLE)"
          - "Contractor.status == QUALIFIED and contractor_safety_score(job terminal variant) >= terminal.safety_score_threshold (ERR_CONTRACTOR_NOT_QUALIFIED)"
          - "job.changeover_class != FORBIDDEN (ERR_INCOMPATIBLE_CHANGEOVER)"
        side_effects:
          - "window.job_id = job.id"
          - "increments CleaningJob.version by 1"
      - from: SCHEDULED
        to: TANK_OOS
        trigger: "POST /ops/cleaning-jobs/{jobId}/take-out-of-service"
        actor: TerminalOperator
        preconditions:
          - "linked ServiceWindow.status == ACTIVE (ERR_INVALID_STATE_TRANSITION)"
          - "Tank.status == IN_SERVICE (ERR_TANK_NOT_IN_SERVICE)"
        side_effects:
          - "Tank.status -> OUT_OF_SERVICE; increments Tank.version by 1"
      - from: TANK_OOS
        to: HEEL_REMOVED
        trigger: "POST /ops/cleaning-jobs/{jobId}/record-heel-removal"
        actor: ContractorSupervisor
        preconditions:
          - "acting ContractorSupervisor's X-User-ID == job.contractor_id (ERR_FORBIDDEN_FOR_ROLE)"
          - "metered_liters >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "heel_volume_liters_metered = metered_liters"
          - "recompute expected_solids_kg per sludge_mass_estimate variant FINAL_BASIS"
      - from: HEEL_REMOVED
        to: SLUDGE_REMOVED
        trigger: "POST /ops/cleaning-jobs/{jobId}/record-sludge-removal"
        actor: ContractorSupervisor
        preconditions:
          - "acting ContractorSupervisor owns job (ERR_FORBIDDEN_FOR_ROLE)"
          - "an APPROVED WasteProfile exists for the job (ERR_WASTE_PROFILE_NOT_APPROVED)"
          - "at least one WasteShipment for the job is in {DELIVERED, RECONCILED} (ERR_NO_DELIVERED_SHIPMENT)"
          - "residual_sludge_kg >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "residual_sludge_kg recorded; shipped_solids_kg recomputed"
      - from: REWORK_CLEANING
        to: SLUDGE_REMOVED
        trigger: "POST /ops/cleaning-jobs/{jobId}/record-sludge-removal"
        actor: ContractorSupervisor
        preconditions:
          - "acting ContractorSupervisor owns job (ERR_FORBIDDEN_FOR_ROLE)"
          - "an APPROVED WasteProfile exists for the job (ERR_WASTE_PROFILE_NOT_APPROVED)"
          - "at least one WasteShipment for the job is in {DELIVERED, RECONCILED} (ERR_NO_DELIVERED_SHIPMENT)"
        side_effects:
          - "residual_sludge_kg recorded (rework pass); shipped_solids_kg recomputed"
        note: "rework loop edge — second and later passes re-enter SLUDGE_REMOVED"
      - from: SLUDGE_REMOVED
        to: GAS_FREE_PENDING
        trigger: "POST /ops/cleaning-jobs/{jobId}/request-gas-free"
        actor: ContractorSupervisor
        preconditions:
          - "acting ContractorSupervisor owns job (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
      - from: PAUSED
        to: GAS_FREE_PENDING
        trigger: "POST /ops/cleaning-jobs/{jobId}/request-gas-free"
        actor: ContractorSupervisor
        preconditions:
          - "acting ContractorSupervisor owns job (ERR_FORBIDDEN_FOR_ROLE)"
          - "no GasFreeCertificate with status VALID exists for the job (recovery path)"
        side_effects:
          - "paused_from and pause_reason cleared"
        note: "recovery edge after cert revoke/expiry: re-enter the gas-free pipeline"
      - from: GAS_FREE_PENDING
        to: GAS_FREE_CERTIFIED
        trigger: "system (automatic when a GasFreeCertificate is issued for the job)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GAS_FREE_CERTIFIED
        to: ENTRY_IN_PROGRESS
        trigger: "POST /ops/cleaning-jobs/{jobId}/begin-entry"
        actor: ContractorSupervisor
        preconditions:
          - "at least one EntryPermit for the job has status == ACTIVE and atmosphere == CLEAR (ERR_NO_VALID_ENTRY_PERMIT)"
        side_effects: []
      - from: ENTRY_IN_PROGRESS
        to: ENTRY_COMPLETE
        trigger: "POST /ops/cleaning-jobs/{jobId}/complete-entry"
        actor: ContractorSupervisor
        preconditions:
          - "every EntryPermit for the job is in {CLOSED, VOIDED} (ERR_PERMITS_NOT_CLOSED)"
        side_effects: []
      - from: ENTRY_COMPLETE
        to: INSPECTION_IN_PROGRESS
        trigger: "system (automatic when an Inspection for the job transitions SCHEDULED -> IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INSPECTION_IN_PROGRESS
        to: INSPECTION_ACCEPTED
        trigger: "system (automatic when the job's IN_PROGRESS Inspection transitions REPORTED -> ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INSPECTION_ACCEPTED
        to: REWORK_CLEANING
        trigger: "POST /ops/cleaning-jobs/{jobId}/order-rework"
        actor: TerminalOperator
        preconditions:
          - "at least one InspectionFinding on the accepted inspection has status in {OPEN, REPAIR_ORDERED} (ERR_NO_REWORKABLE_FINDINGS)"
        side_effects:
          - "all GasFreeCertificates for the job in VALID -> SUPERSEDED (atmosphere invalidated by rework)"
          - "all EntryPermits for the job in {REQUESTED, ISSUED, SUSPENDED} -> VOIDED"
        note: "cycle edge — job loops back through gas-free + entry + inspection"
      - from: INSPECTION_ACCEPTED
        to: FLUSH_IN_PROGRESS
        trigger: "POST /ops/cleaning-jobs/{jobId}/begin-flush"
        actor: ContractorSupervisor
        preconditions:
          - "no InspectionFinding on the accepted inspection has severity CRITICAL and status in {OPEN, REPAIR_ORDERED} (ERR_CRITICAL_FINDINGS_OPEN)"
        side_effects: []
      - from: FLUSH_IN_PROGRESS
        to: FLUSH_VERIFIED
        trigger: "POST /ops/cleaning-jobs/{jobId}/verify-flush"
        actor: EHSOfficer
        preconditions:
          - "actual_flush_liters >= job.flush_volume_liters (ERR_FLUSH_VOLUME_INSUFFICIENT; inclusive boundary)"
        side_effects: []
      - from: FLUSH_VERIFIED
        to: RTS_PENDING
        trigger: "POST /ops/cleaning-jobs/{jobId}/request-rts"
        actor: TerminalOperator
        preconditions:
          - "mass_balance_check passes: |shipped_solids_kg - expected_solids_kg| <= expected_solids_kg * tolerance/100 (ERR_MASS_BALANCE_OUT_OF_TOLERANCE)"
        side_effects:
          - "recompute invoice_total_cents per job_invoice_total_cents"
      - from: RTS_PENDING
        to: FLUSH_VERIFIED
        trigger: "system (automatic when shipped_solids_kg recompute breaks mass balance, e.g. waste-profile reclassification voids a DELIVERED shipment)"
        actor: system
        preconditions: []
        side_effects: []
        note: "revert edge of the RTS gate"
      - from: RTS_PENDING
        to: RETURNED_TO_SERVICE
        trigger: "POST /ops/cleaning-jobs/{jobId}/return-to-service"
        actor: TerminalOperator
        preconditions:
          - "no InspectionFinding on the job's accepted inspection has severity CRITICAL and status in {OPEN, REPAIR_ORDERED} (ERR_CRITICAL_FINDINGS_OPEN)"
          - "mass_balance_check still passes at call time (ERR_MASS_BALANCE_OUT_OF_TOLERANCE)"
        side_effects:
          - "Tank.status -> IN_SERVICE; Tank.current_product_id = job.to_product_id; increments Tank.version by 1"
          - "linked ServiceWindow -> COMPLETED"
      - from: GAS_FREE_CERTIFIED
        to: PAUSED
        trigger: "system (cascade: linked GasFreeCertificate revoked/expired and job had ISSUED/ACTIVE permits which were all suspended)"
        actor: system
        preconditions: []
        side_effects:
          - "paused_from = GAS_FREE_CERTIFIED; pause_reason set"
          - "all Inspections for the job in SCHEDULED -> CANCELLED"
      - from: ENTRY_IN_PROGRESS
        to: PAUSED
        trigger: "system (cascade: last non-suspended EntryPermit -> SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "paused_from = ENTRY_IN_PROGRESS; pause_reason set"
          - "all Inspections for the job in SCHEDULED -> CANCELLED"
      - from: ENTRY_COMPLETE
        to: PAUSED
        trigger: "system (cascade: linked GasFreeCertificate revoked)"
        actor: system
        preconditions: []
        side_effects:
          - "paused_from = ENTRY_COMPLETE; pause_reason set"
          - "all Inspections for the job in SCHEDULED -> CANCELLED"
      - from: GAS_FREE_CERTIFIED
        to: GAS_FREE_PENDING
        trigger: "system (cascade: linked GasFreeCertificate revoked/expired and job had NO ISSUED/ACTIVE permits)"
        actor: system
        preconditions: []
        side_effects:
          - "REQUESTED EntryPermits referencing the dead cert remain REQUESTED but cannot issue against it"
        note: "revert edge — re-certification required"
      - from: PAUSED
        to: GAS_FREE_CERTIFIED
        trigger: "POST /ops/cleaning-jobs/{jobId}/resume"
        actor: TerminalOperator
        preconditions:
          - "job.paused_from == GAS_FREE_CERTIFIED"
          - "a GasFreeCertificate with status VALID exists for the job (ERR_NO_VALID_GAS_FREE_CERT)"
        side_effects: []
      - from: PAUSED
        to: ENTRY_IN_PROGRESS
        trigger: "POST /ops/cleaning-jobs/{jobId}/resume"
        actor: TerminalOperator
        preconditions:
          - "job.paused_from == ENTRY_IN_PROGRESS"
          - "a GasFreeCertificate with status VALID exists (ERR_NO_VALID_GAS_FREE_CERT)"
          - "at least one EntryPermit in {ACTIVE} with atmosphere CLEAR exists, or a SUSPENDED permit is first resumed (ERR_NO_VALID_ENTRY_PERMIT)"
        side_effects: []
      - from: PAUSED
        to: ENTRY_COMPLETE
        trigger: "POST /ops/cleaning-jobs/{jobId}/resume"
        actor: TerminalOperator
        preconditions:
          - "job.paused_from == ENTRY_COMPLETE"
          - "a GasFreeCertificate with status VALID exists (ERR_NO_VALID_GAS_FREE_CERT)"
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /ops/cleaning-jobs/{jobId}/cancel"
        actor: TerminalOperator
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /ops/cleaning-jobs/{jobId}/cancel"
        actor: TerminalOperator
        preconditions: []
        side_effects:
          - "linked ServiceWindow.job_id = null; window stays PLANNED"
      - from: TANK_OOS
        to: CANCELLED
        trigger: "POST /ops/cleaning-jobs/{jobId}/cancel"
        actor: TerminalOperator
        preconditions: []
        side_effects:
          - "Tank.status -> IN_SERVICE; increments Tank.version by 1"
          - "linked ServiceWindow -> CANCELLED"
      - from: HEEL_REMOVED
        to: CANCELLED
        trigger: "POST /ops/cleaning-jobs/{jobId}/cancel"
        actor: TerminalOperator
        preconditions: []
        side_effects:
          - "Tank.status -> IN_SERVICE; increments Tank.version by 1"
          - "linked ServiceWindow -> CANCELLED"
      - from: SLUDGE_REMOVED
        to: CANCELLED
        trigger: "POST /ops/cleaning-jobs/{jobId}/cancel"
        actor: TerminalOperator
        preconditions: []
        side_effects:
          - "Tank.status -> IN_SERVICE"
          - "linked ServiceWindow -> CANCELLED"
      - from: GAS_FREE_PENDING
        to: CANCELLED
        trigger: "POST /ops/cleaning-jobs/{jobId}/cancel"
        actor: TerminalOperator
        preconditions: []
        side_effects:
          - "Tank.status -> IN_SERVICE"
          - "linked ServiceWindow -> CANCELLED"
      - from: GAS_FREE_CERTIFIED
        to: CANCELLED
        trigger: "POST /ops/cleaning-jobs/{jobId}/cancel"
        actor: TerminalOperator
        preconditions:
          - "no EntryPermit for the job in ACTIVE (ERR_JOB_HAS_ACTIVE_PERMIT)"
        side_effects:
          - "EntryPermits in {REQUESTED, ISSUED, SUSPENDED} -> VOIDED"
          - "Tank.status -> IN_SERVICE"
          - "linked ServiceWindow -> CANCELLED"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /ops/cleaning-jobs/{jobId}/cancel"
        actor: TerminalOperator
        preconditions:
          - "no EntryPermit for the job in ACTIVE (ERR_JOB_HAS_ACTIVE_PERMIT)"
        side_effects:
          - "EntryPermits in {REQUESTED, ISSUED, SUSPENDED} -> VOIDED"
          - "Tank.status -> IN_SERVICE"
          - "linked ServiceWindow -> CANCELLED"

  - entity: Tank
    initial_state: IN_SERVICE
    terminal_states: []
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "system (CleaningJob take-out-of-service)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "system (CleaningJob return-to-service or cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ServiceWindow
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED, OVERRUN]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /ops/service-windows/{windowId}/activate"
        actor: TerminalOperator
        preconditions:
          - "planned_start <= clock.now < planned_end (ERR_WINDOW_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (linked CleaningJob RETURNED_TO_SERVICE) or POST /ops/service-windows/{windowId}/complete"
        actor: system | TerminalOperator
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /ops/service-windows/{windowId}/cancel"
        actor: TerminalOperator
        preconditions:
          - "window.job_id is null or linked job is CANCELLED (ERR_WINDOW_LINKED)"
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "system (linked CleaningJob cancelled from TANK_OOS or later)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: OVERRUN
        trigger: "system (on clock advance when clock.now >= planned_end and status still PLANNED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: OVERRUN
        trigger: "system (on clock advance when clock.now >= planned_end and linked job not RETURNED_TO_SERVICE)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WasteProfile
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ops/waste-profiles/{profileId}/submit"
        actor: ContractorSupervisor
        preconditions:
          - "acting ContractorSupervisor's X-User-ID == profile.job.contractor_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /ops/waste-profiles/{profileId}/submit"
        actor: ContractorSupervisor
        preconditions:
          - "acting ContractorSupervisor owns the job (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
        note: "rejection cycle edge"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /ops/waste-profiles/{profileId}/approve"
        actor: EHSOfficer
        preconditions:
          - "no other WasteProfile for the same job is APPROVED (ERR_PROFILE_ALREADY_APPROVED)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ops/waste-profiles/{profileId}/reject"
        actor: EHSOfficer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: DRAFT
        trigger: "POST /ops/waste-profiles/{profileId}/reclassify"
        actor: EHSOfficer
        preconditions:
          - "hazard_class in body differs from current hazard_class (ERR_INVALID_REQUEST)"
        side_effects:
          - "hazard_class updated to body value"
          - "all WasteShipments referencing this profile in {BOOKED, IN_TRANSIT} -> VOIDED"
          - "all WasteShipments referencing this profile in DELIVERED -> VOIDED (manifest invalidated)"
          - "each voided shipment recomputes its job's shipped_solids_kg; if that job was RTS_PENDING and mass balance now fails, job -> FLUSH_VERIFIED"
        note: "cascade trigger A->B->C (profile reclassify -> shipment void -> job RTS revert)"

  - entity: WasteShipment
    initial_state: BOOKED
    terminal_states: [RECONCILED, VOIDED]
    transitions:
      - from: BOOKED
        to: IN_TRANSIT
        trigger: "POST /ops/waste-shipments/{shipmentId}/dispatch"
        actor: ContractorSupervisor
        preconditions:
          - "acting ContractorSupervisor owns shipment.job (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /ops/waste-shipments/{shipmentId}/deliver"
        actor: ContractorSupervisor
        preconditions:
          - "acting ContractorSupervisor owns shipment.job (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "job.shipped_solids_kg recomputed"
      - from: DELIVERED
        to: RECONCILED
        trigger: "POST /ops/waste-shipments/{shipmentId}/reconcile"
        actor: EHSOfficer
        preconditions: []
        side_effects:
          - "job.waste_cost_cents recomputed (adds this shipment's disposal_cost_cents)"
      - from: BOOKED
        to: VOIDED
        trigger: "POST /ops/waste-shipments/{shipmentId}/void or system (profile reclassify cascade)"
        actor: TerminalOperator | system
        preconditions: []
        side_effects:
          - "job.shipped_solids_kg recomputed; job RTS revert check runs"
      - from: IN_TRANSIT
        to: VOIDED
        trigger: "POST /ops/waste-shipments/{shipmentId}/void or system (profile reclassify cascade)"
        actor: TerminalOperator | system
        preconditions: []
        side_effects:
          - "job.shipped_solids_kg recomputed; job RTS revert check runs"
      - from: DELIVERED
        to: VOIDED
        trigger: "system (profile reclassify cascade only)"
        actor: system
        preconditions: []
        side_effects:
          - "job.shipped_solids_kg recomputed; if job RTS_PENDING and balance fails -> job -> FLUSH_VERIFIED"

  - entity: GasFreeCertificate
    initial_state: VALID
    terminal_states: [EXPIRED, REVOKED, SUPERSEDED]
    transitions:
      - from: VALID
        to: VALID
        trigger: "POST /ops/gas-free-certificates/{certId}/revalidate"
        actor: MarineChemist
        preconditions:
          - "cert.revalidated == false (ERR_CERT_ALREADY_REVALIDATED)"
          - "clock.now < cert.expires_at (ERR_CERT_EXPIRED)"
        side_effects:
          - "expires_at += 6h; revalidated = true"
        note: "self-loop extension, once only"
      - from: VALID
        to: EXPIRED
        trigger: "system (on clock advance when clock.now >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "same downstream cascade as revoke: permits ISSUED/ACTIVE -> SUSPENDED; job PAUSED (permits existed) or -> GAS_FREE_PENDING (none); SCHEDULED inspections of a PAUSED job -> CANCELLED"
      - from: VALID
        to: REVOKED
        trigger: "POST /ops/gas-free-certificates/{certId}/revoke"
        actor: MarineChemist
        preconditions: []
        side_effects:
          - "all EntryPermits with cert_id == this cert in {ISSUED, ACTIVE} -> SUSPENDED (link A->B)"
          - "if job now has >=1 SUSPENDED permit and zero permits in {ISSUED, ACTIVE} and job.status in {GAS_FREE_CERTIFIED, ENTRY_IN_PROGRESS, ENTRY_COMPLETE}: job -> PAUSED with paused_from recorded (link B->C)"
          - "if job had no permits in {ISSUED, ACTIVE} and job.status == GAS_FREE_CERTIFIED: job -> GAS_FREE_PENDING (re-certification branch)"
          - "when job -> PAUSED: all Inspections for the job in SCHEDULED -> CANCELLED (link C->D)"
      - from: VALID
        to: SUPERSEDED
        trigger: "system (automatic when a new GasFreeCertificate is issued for the same job)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EntryPermit
    initial_state: REQUESTED
    terminal_states: [CLOSED, VOIDED]
    parallel_dimensions: [status, atmosphere]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /ops/entry-permits/{permitId}/issue"
        actor: EHSOfficer
        preconditions:
          - "job.status == GAS_FREE_CERTIFIED (ERR_INVALID_STATE_TRANSITION)"
          - "permit.cert.status == VALID (ERR_NO_VALID_GAS_FREE_CERT)"
          - "clock.now < cert.expires_at (ERR_CERT_EXPIRED)"
          - "issuing X-User-ID != cert.issued_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "issued_by_user_id = acting X-User-ID"
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /ops/entry-permits/{permitId}/activate"
        actor: ContractorSupervisor
        preconditions:
          - "acting ContractorSupervisor owns permit.job (ERR_FORBIDDEN_FOR_ROLE)"
          - "job.status == GAS_FREE_CERTIFIED (ERR_INVALID_STATE_TRANSITION)"
          - "permit.cert.status == VALID and clock.now < cert.expires_at (ERR_CERT_EXPIRED)"
          - "permit.atmosphere == CLEAR (ERR_ATMOSPHERE_NOT_CLEAR)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /ops/entry-permits/{permitId}/suspend or system (cert revoke/expiry cascade)"
        actor: EHSOfficer | system
        preconditions: []
        side_effects:
          - "if this was the job's last permit in {ISSUED, ACTIVE}: job -> PAUSED (paused_from recorded) and job's SCHEDULED Inspections -> CANCELLED"
      - from: ISSUED
        to: SUSPENDED
        trigger: "POST /ops/entry-permits/{permitId}/suspend or system (cert revoke/expiry cascade)"
        actor: EHSOfficer | system
        preconditions: []
        side_effects:
          - "if this was the job's last permit in {ISSUED, ACTIVE} and job.status == GAS_FREE_CERTIFIED: job -> PAUSED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /ops/entry-permits/{permitId}/resume"
        actor: EHSOfficer
        preconditions:
          - "permit.cert.status == VALID and clock.now < cert.expires_at (ERR_CERT_EXPIRED)"
          - "permit.atmosphere == CLEAR (ERR_ATMOSPHERE_NOT_CLEAR)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /ops/entry-permits/{permitId}/close"
        actor: ContractorSupervisor
        preconditions:
          - "acting ContractorSupervisor owns permit.job (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /ops/entry-permits/{permitId}/close"
        actor: ContractorSupervisor
        preconditions:
          - "acting ContractorSupervisor owns permit.job (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
      - from: REQUESTED
        to: VOIDED
        trigger: "POST /ops/entry-permits/{permitId}/void or system (job cancel / rework cascade)"
        actor: EHSOfficer | system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: VOIDED
        trigger: "POST /ops/entry-permits/{permitId}/void or system (job cancel / rework cascade)"
        actor: EHSOfficer | system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: VOIDED
        trigger: "POST /ops/entry-permits/{permitId}/void or system (job cancel / rework cascade)"
        actor: EHSOfficer | system
        preconditions: []
        side_effects: []
      - from: CLEAR
        to: ALARM
        trigger: "POST /ops/entry-permits/{permitId}/raise-alarm (atmosphere dimension)"
        actor: ContractorSupervisor | EHSOfficer
        preconditions:
          - "permit.status in {ISSUED, ACTIVE, SUSPENDED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
        note: "parallel dimension — status unchanged"
      - from: ALARM
        to: RETEST_REQUIRED
        trigger: "POST /ops/entry-permits/{permitId}/resolve-alarm (atmosphere dimension)"
        actor: EHSOfficer
        preconditions: []
        side_effects: []
      - from: RETEST_REQUIRED
        to: CLEAR
        trigger: "system (automatic when the permit's cert is revalidated or a superseding cert is issued for the job and permit.cert_id updated) or POST /ops/entry-permits/{permitId}/clear-atmosphere"
        actor: EHSOfficer | system
        preconditions:
          - "permit.cert.status == VALID (ERR_NO_VALID_GAS_FREE_CERT)"
        side_effects: []

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /ops/inspections/{inspectionId}/start"
        actor: API653Inspector
        preconditions:
          - "acting X-User-ID == inspection.inspector_id (ERR_FORBIDDEN_FOR_ROLE)"
          - "job.status == ENTRY_COMPLETE (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "job ENTRY_COMPLETE -> INSPECTION_IN_PROGRESS"
      - from: IN_PROGRESS
        to: REPORTED
        trigger: "POST /ops/inspections/{inspectionId}/report"
        actor: API653Inspector
        preconditions:
          - "acting X-User-ID == inspection.inspector_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "reported_by_user_id = acting X-User-ID"
      - from: REPORTED
        to: ACCEPTED
        trigger: "POST /ops/inspections/{inspectionId}/accept"
        actor: TerminalOperator
        preconditions:
          - "no InspectionFinding of this inspection has severity CRITICAL and status OPEN (ERR_CRITICAL_FINDINGS_OPEN)"
          - "accepting X-User-ID != inspection.reported_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "job INSPECTION_IN_PROGRESS -> INSPECTION_ACCEPTED"
      - from: REPORTED
        to: REJECTED
        trigger: "POST /ops/inspections/{inspectionId}/reject"
        actor: TerminalOperator
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: REPORTED
        trigger: "POST /ops/inspections/{inspectionId}/amend"
        actor: API653Inspector
        preconditions:
          - "acting X-User-ID == inspection.inspector_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
        note: "rejection cycle edge"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /ops/inspections/{inspectionId}/cancel or system (job PAUSED cascade)"
        actor: TerminalOperator | system
        preconditions: []
        side_effects: []

  - entity: InspectionFinding
    initial_state: OPEN
    terminal_states: [RESOLVED, ACCEPTED_RISK]
    transitions:
      - from: OPEN
        to: REPAIR_ORDERED
        trigger: "system (automatic when a RepairOrder is created for the finding)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: ACCEPTED_RISK
        trigger: "POST /ops/inspection-findings/{findingId}/accept-risk"
        actor: TerminalOperator
        preconditions:
          - "finding.severity in {MINOR, MAJOR} (ERR_FINDING_NOT_RISK_ACCEPTABLE)"
        side_effects: []
      - from: REPAIR_ORDERED
        to: RESOLVED
        trigger: "system (automatic when the finding's RepairOrder is VERIFIED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RepairOrder
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /ops/repair-orders/{repairId}/start"
        actor: ContractorSupervisor
        preconditions:
          - "acting ContractorSupervisor owns repair.job (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /ops/repair-orders/{repairId}/complete"
        actor: ContractorSupervisor
        preconditions:
          - "acting ContractorSupervisor owns repair.job (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "completed_by_user_id = acting X-User-ID"
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /ops/repair-orders/{repairId}/verify"
        actor: API653Inspector
        preconditions:
          - "acting X-User-ID == repair.finding.inspection.inspector_id (ERR_FORBIDDEN_FOR_ROLE)"
          - "verifying X-User-ID != repair.completed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "finding REPAIR_ORDERED -> RESOLVED"
      - from: COMPLETED
        to: IN_PROGRESS
        trigger: "POST /ops/repair-orders/{repairId}/reject"
        actor: API653Inspector
        preconditions:
          - "acting X-User-ID == repair.finding.inspection.inspector_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
        note: "rework cycle edge on the repair dimension"

  - entity: WastewaterBatch
    initial_state: COLLECTED
    terminal_states: [DISCHARGED]
    transitions:
      - from: COLLECTED
        to: LAB_TESTED
        trigger: "POST /ops/wastewater-batches/{batchId}/submit-lab"
        actor: LabTechnician
        preconditions:
          - "ph in [0, 14] and tph_mg_l >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "lab_user_id = acting X-User-ID"
      - from: LAB_TESTED
        to: AUTHORIZED
        trigger: "POST /ops/wastewater-batches/{batchId}/authorize"
        actor: TerminalOperator
        preconditions:
          - "6.0 <= ph <= 9.0 and tph_mg_l <= 15.0 (ERR_DISCHARGE_LIMITS_EXCEEDED)"
          - "sum(volume_liters of terminal batches AUTHORIZED or DISCHARGED with discharge_day == today) + volume_liters <= terminal.wastewater_daily_capacity_liters (ERR_DISCHARGE_CAPACITY_EXCEEDED)"
          - "authorizing X-User-ID != batch.lab_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "discharge_day = current UTC date from logical clock"
      - from: AUTHORIZED
        to: DISCHARGED
        trigger: "POST /ops/wastewater-batches/{batchId}/discharge"
        actor: TerminalOperator
        preconditions: []
        side_effects: []
      - from: AUTHORIZED
        to: COLLECTED
        trigger: "POST /ops/wastewater-batches/{batchId}/void-authorization"
        actor: TerminalOperator
        preconditions: []
        side_effects:
          - "discharge_day cleared; daily allocated liters released (compensating action)"
      - from: LAB_TESTED
        to: REJECTED
        trigger: "POST /ops/wastewater-batches/{batchId}/reject"
        actor: EHSOfficer
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: COLLECTED
        trigger: "POST /ops/wastewater-batches/{batchId}/return-to-storage"
        actor: TerminalOperator
        preconditions: []
        side_effects: []

  - entity: Contractor
    initial_state: APPLICANT
    terminal_states: [BARRED]
    transitions:
      - from: APPLICANT
        to: QUALIFIED
        trigger: "POST /ops/contractors/{contractorId}/qualify"
        actor: TerminalAdmin
        preconditions:
          - "contractor_safety_score(terminal variant of body terminal_id) >= terminal.safety_score_threshold (ERR_CONTRACTOR_NOT_QUALIFIED)"
        side_effects: []
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /ops/contractors/{contractorId}/reinstate"
        actor: TerminalAdmin
        preconditions:
          - "contractor_safety_score(terminal variant of body terminal_id) >= terminal.safety_score_threshold (ERR_CONTRACTOR_NOT_QUALIFIED)"
        side_effects: []
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /ops/contractors/{contractorId}/suspend"
        actor: TerminalAdmin
        preconditions: []
        side_effects: []
      - from: QUALIFIED
        to: BARRED
        trigger: "POST /ops/contractors/{contractorId}/bar"
        actor: TerminalAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: BARRED
        trigger: "POST /ops/contractors/{contractorId}/bar"
        actor: TerminalAdmin
        preconditions: []
        side_effects: []
      - from: APPLICANT
        to: BARRED
        trigger: "POST /ops/contractors/{contractorId}/bar"
        actor: TerminalAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: window-create-stale-tank
    parent_entity: Tank
    write_endpoint: "POST /ops/service-windows"
    occ_field: "expected_tank_version"
    description: |
      Creating a ServiceWindow against a Tank whose version has advanced since
      the client last observed it is rejected. Captures the case where another
      writer has just created a window (which legitimately extends the tank's
      booked calendar) and the current writer's view of the tank is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: job-patch-stale-job
    parent_entity: CleaningJob
    write_endpoint: "PATCH /ops/cleaning-jobs/{jobId}"
    occ_field: "expected_job_version"
    description: |
      Patching a CleaningJob whose version has advanced since the client last
      observed it is rejected; the client's edits were computed against a stale
      snapshot of the job.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: inspection-create-stale-inspector
    parent_entity: Inspector
    write_endpoint: "POST /ops/inspections"
    occ_field: "expected_inspector_version"
    description: |
      Creating an Inspection against an Inspector whose version has advanced
      since the client last observed it is rejected; the client's calendar
      view of the inspector is stale even when the new interval does not
      overlap any existing booking.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sludge_mass_estimate
    trigger: "CleaningJob creation (PROVISIONAL) and record-heel-removal (FINAL_BASIS)"
    algorithm: aggregation
    formula: |
      PROVISIONAL: sludge_estimate_provisional_kg =
        round_half_up(heel_volume_liters_sounding * SLUDGE_RATIO[from_product.family]
                      + tank.capacity_m3 * SURFACE_FACTOR[from_product.viscosity_class], 0)
      FINAL_BASIS: expected_solids_kg =
        round_half_up(heel_volume_liters_metered * SLUDGE_RATIO[from_product.family]
                      + tank.capacity_m3 * SURFACE_FACTOR[from_product.viscosity_class], 0)
    input_set: "the job's tank and from_product; sounding volume before heel removal, metered volume after"
    constants:
      SLUDGE_RATIO: { GASOLINE: 0.02, DISTILLATE: 0.03, JET: 0.015, CRUDE: 0.08, CHEMICAL: 0.05, VEGOIL: 0.04 }
      SURFACE_FACTOR: { LOW: 0.5, MEDIUM: 1.0, HIGH: 2.0 }
    precision: "0 decimal places (whole kg), round_half_up"
    variants:
      - name: PROVISIONAL
        when: "at job creation; drives waste booking before pump-out"
        difference: "uses heel_volume_liters_sounding (sounding tape)"
      - name: FINAL_BASIS
        when: "after record-heel-removal; drives mass_balance_check"
        difference: "uses heel_volume_liters_metered (pump-out meter) — identical data except volume source, different kg"
  - name: contractor_safety_score
    trigger: "SafetyEvent creation; qualification/reinstatement evaluation; job scheduling"
    algorithm: weighted_scoring
    formula: |
      score = 100.00
        - 2.00 * sum(severity_weight of INCIDENT events in scope)
        - 1.00 * sum(severity_weight of VIOLATION events in scope)
        - 0.25 * sum(severity_weight of NEAR_MISS events in scope)
        + 0.50 * sum(severity_weight of TRAINING_CREDIT events in scope)
      clamp score to [0.00, 100.00]
    input_set: "SafetyEvents of the contractor; scope depends on variant (occurred_at >= now - 365 days inclusive vs all events)"
    constants:
      BASE: 100.0
      INCIDENT_FACTOR: 2.0
      VIOLATION_FACTOR: 1.0
      NEAR_MISS_FACTOR: 0.25
      TRAINING_FACTOR: 0.5
      ROLLING_WINDOW_DAYS: 365
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ROLLING_12MO
        when: "terminal.score_variant == ROLLING_12MO"
        difference: "only events with occurred_at >= now - 365 days (inclusive boundary)"
      - name: LIFETIME
        when: "terminal.score_variant == LIFETIME"
        difference: "all events regardless of age — identical event data, different score"
  - name: flush_volume_liters
    trigger: "CleaningJob creation (recomputed if products patched)"
    algorithm: tiered_pricing
    formula: |
      class = changeover_class(from_product, to_product)
      if class == FORBIDDEN: no volume (job cannot schedule)
      raw = tank.capacity_m3 * 1000 * BASE_FACTOR[from_product.viscosity_class] * CLASS_MULTIPLIER[class]
      if job.lines_included: raw += LINES_ALLOWANCE_L
      flush_volume_liters = min(MAX_FLUSH_L, max(MIN_FLUSH_L, ceil(raw)))
    input_set: "job tank capacity, from/to products, lines_included flag"
    constants:
      BASE_FACTOR: { LOW: 0.02, MEDIUM: 0.035, HIGH: 0.05 }
      CLASS_MULTIPLIER: { COMPATIBLE_DIRECT: 0.5, REQUIRES_FLUSH: 1.0, REQUIRES_FULL_STRIP: 1.8 }
      LINES_ALLOWANCE_L: 5000
      MIN_FLUSH_L: 2000
      MAX_FLUSH_L: 200000
    precision: "0 decimal places (whole liters), ceil at final step only"
  - name: changeover_compatibility
    trigger: "CleaningJob creation (feeds changeover_class and flush_volume_liters)"
    algorithm: constraint_propagation
    formula: |
      if from_product.compatibility_group == to_product.compatibility_group:
        COMPATIBLE_DIRECT
      elif [from.family, to.family] in FORBIDDEN_PAIRS:
        FORBIDDEN
      elif from.compatibility_group in FULL_STRIP_GROUPS or to.compatibility_group in FULL_STRIP_GROUPS:
        REQUIRES_FULL_STRIP
      else:
        REQUIRES_FLUSH
    input_set: "job from_product and to_product"
    constants:
      FORBIDDEN_PAIRS: [["CRUDE", "JET"], ["JET", "CRUDE"]]
      FULL_STRIP_GROUPS: ["CHEM", "VEG"]
    precision: "n/a (enum classification)"
  - name: waste_disposal_cost_cents
    trigger: "WasteShipment creation"
    algorithm: tiered_pricing
    formula: |
      mult = HAZARD_MULTIPLIER[profile.hazard_class]
      for each line in shipment.lines:
        line_cost_cents = round_half_up(line.kg * line.rate_cents_per_kg * mult, 0)
      disposal_cost_cents = sum(line_cost_cents)
      # PINNED ROUNDING ORDER: round each line to whole cents FIRST, then sum.
      # (sum-then-round is a different number and is NOT the contract.)
    input_set: "shipment lines and the referenced profile's hazard_class"
    constants:
      HAZARD_MULTIPLIER: { NON_HAZARDOUS: 1.0, HAZARDOUS: 2.5 }
    precision: "0 decimal places per line, round_half_up per line, then integer sum"
  - name: job_invoice_total_cents
    trigger: "CleaningJob request-rts"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER (resolves the circular-looking dependency —
      # the discount tier is keyed on the PRE-discount total, so the value is
      # well-defined only in this order):
      1. waste = job.waste_cost_cents (sum over RECONCILED shipments)
      2. flush_charge = job.flush_volume_liters * FLUSH_RATE_CENTS_PER_LITER
      3. pre_total = job.base_service_fee_cents + waste + flush_charge
      4. tier_pct = 0.10 if pre_total >= 1000000 else 0.05 if pre_total >= 500000 else 0.0
      5. discount = round_half_up(job.base_service_fee_cents * tier_pct, 0)
      6. invoice_total_cents = pre_total - discount
    input_set: "job base fee, RECONCILED shipments' disposal costs, computed flush volume"
    constants:
      FLUSH_RATE_CENTS_PER_LITER: 2
      TIER1_MIN_CENTS: 1000000
      TIER1_PCT: 0.10
      TIER2_MIN_CENTS: 500000
      TIER2_PCT: 0.05
    precision: "0 decimal places, round_half_up at the discount step only"
  - name: mass_balance_check
    trigger: "CleaningJob request-rts and return-to-service; re-evaluated on any shipped_solids_kg recompute while RTS_PENDING"
    algorithm: threshold
    formula: |
      expected = job.expected_solids_kg
      actual = job.shipped_solids_kg   # sum(manifested_kg over shipments in {DELIVERED, RECONCILED}) + residual_sludge_kg
      passes iff abs(actual - expected) <= expected * terminal.mass_balance_tolerance_pct / 100
      # INCLUSIVE boundary: a delta exactly equal to the tolerance passes.
    input_set: "job's non-VOIDED shipments in {DELIVERED, RECONCILED}, residual_sludge_kg, expected_solids_kg, terminal tolerance"
    precision: "2 decimal places on the tolerance bound, round_half_up"
  - name: gas_free_limits_check
    trigger: "GasFreeCertificate issuance"
    algorithm: threshold
    formula: |
      issuable iff lel_pct < 10.0 AND 19.5 <= o2_pct <= 23.5 AND h2s_ppm <= 10.0 AND benzene_ppm < 1.0
      # LEL and benzene are STRICT upper bounds; O2 band is CLOSED; H2S is INCLUSIVE.
    input_set: "the four instrument readings on the request"
    constants:
      LEL_LIMIT_PCT: 10.0
      O2_MIN_PCT: 19.5
      O2_MAX_PCT: 23.5
      H2S_LIMIT_PPM: 10.0
      BENZENE_LIMIT_PPM: 1.0
      CERT_VALIDITY_HOURS: 12
      REVALIDATE_EXTENSION_HOURS: 6
    precision: "1 decimal place comparisons as given"
  - name: tank_window_conflict_check
    trigger: "ServiceWindow creation"
    algorithm: interval_merge
    formula: |
      new interval [planned_start, planned_end) is HALF-OPEN.
      for each existing ServiceWindow on the same tank with status in {PLANNED, ACTIVE}:
        if new.start < existing.end and existing.start < new.end: ERR_WINDOW_OVERLAP
        elif new.start < existing.end + BUFFER_HOURS and new.end > existing.end: ERR_WINDOW_BUFFER_VIOLATION
        elif existing.start < new.end + BUFFER_HOURS and existing.end > new.end: ERR_WINDOW_BUFFER_VIOLATION
      # Adjacency (new.start == existing.end) is NOT allowed on a tank: the 24h
      # gas-free buffer makes touching intervals a violation.
    input_set: "non-terminal windows of the same tank"
    constants:
      BUFFER_HOURS: 24
    precision: "second-precision datetime comparisons"
  - name: inspector_calendar_check
    trigger: "Inspection creation"
    algorithm: interval_merge
    formula: |
      new interval [scheduled_start, scheduled_end) is HALF-OPEN.
      for each existing Inspection of the same inspector with status in {SCHEDULED, IN_PROGRESS}:
        if new.start < existing.end and existing.start < new.end: ERR_INSPECTOR_UNAVAILABLE
      # Adjacency IS allowed: new.start == existing.end passes (back-to-back bookings).
    input_set: "non-terminal inspections of the same inspector"
    precision: "second-precision datetime comparisons"
  - name: discharge_capacity_check
    trigger: "WastewaterBatch authorize"
    algorithm: aggregation
    formula: |
      day = current UTC date (logical clock)
      allocated = sum(volume_liters of terminal's batches with status in {AUTHORIZED, DISCHARGED}
                      and discharge_day == day)
      authorize iff allocated + batch.volume_liters <= terminal.wastewater_daily_capacity_liters
      # INCLUSIVE boundary: landing exactly on capacity is allowed.
    input_set: "terminal batches AUTHORIZED/DISCHARGED for the same UTC day"
    precision: "integer liters"
  - name: certificate_validity_window
    trigger: "permit issue/activate/resume, begin-entry, clock advance"
    algorithm: decay_function
    formula: |
      cert is usable iff status == VALID and clock.now < expires_at (STRICT).
      expires_at = issued_at + 12h; one revalidation adds +6h.
      on clock advance: any VALID cert with clock.now >= expires_at -> EXPIRED (cascade per §1.2).
    input_set: "certificates in VALID"
    constants:
      CERT_VALIDITY_HOURS: 12
      REVALIDATE_EXTENSION_HOURS: 6
    precision: "second-precision"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles; entity-backed roles must own the target resource where the endpoint requires ownership"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids and body FK references exist (validated left-to-right: path first, then body)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /ops/service-windows; PATCH /ops/cleaning-jobs/{jobId}; POST /ops/inspections"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "Gas-free readings within limits per gas_free_limits_check"
    error_id: ERR_GAS_FREE_LIMITS_EXCEEDED
    http_status: 422
    applies_to: "POST /ops/gas-free-certificates"
  - priority: 7
    category: business_safety
    check: "A VALID, unexpired gas-free certificate anchors permit issue/activate/resume and begin-entry"
    error_id: ERR_CERT_EXPIRED
    http_status: 409
    applies_to: "POST /ops/entry-permits/{id}/issue, /activate, /resume; POST /ops/entry-permits/{id}/clear-atmosphere"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: permit issuer != cert issuer; inspection acceptor != reporting inspector; repair verifier != repair completer; discharge authorizer != lab technician"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "entry-permit issue; inspection accept; repair-order verify; wastewater authorize"
  - priority: 9
    category: business_safety
    check: "Contractor QUALIFIED and score >= terminal threshold at schedule/qualify/reinstate time"
    error_id: ERR_CONTRACTOR_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /ops/cleaning-jobs/{id}/schedule; POST /ops/contractors/{id}/qualify; POST /ops/contractors/{id}/reinstate"
  - priority: 10
    category: business_safety
    check: "Wastewater lab results within discharge limits (pH closed [6.0, 9.0], TPH <= 15.0 inclusive)"
    error_id: ERR_DISCHARGE_LIMITS_EXCEEDED
    http_status: 422
    applies_to: "POST /ops/wastewater-batches/{id}/authorize"
  - priority: 11
    category: business_temporal
    check: "ServiceWindow does not overlap and respects the 24h buffer against existing tank windows"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /ops/service-windows"
    note: "ERR_WINDOW_OVERLAP when intervals intersect; ERR_WINDOW_BUFFER_VIOLATION when only the buffer is breached — overlap is reported first"
  - priority: 12
    category: business_temporal
    check: "Buffer-only breach on tank windows (adjacency within 24h)"
    error_id: ERR_WINDOW_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /ops/service-windows"
  - priority: 13
    category: business_temporal
    check: "Inspector calendar overlap (half-open; adjacency allowed)"
    error_id: ERR_INSPECTOR_UNAVAILABLE
    http_status: 409
    applies_to: "POST /ops/inspections"
  - priority: 14
    category: business_temporal
    check: "Window activation only within its planned interval"
    error_id: ERR_WINDOW_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /ops/service-windows/{id}/activate"
  - priority: 15
    category: business_referential
    check: "Waste profile exists, belongs to the same job, and is APPROVED before shipments/sludge-removal"
    error_id: ERR_WASTE_PROFILE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /ops/waste-shipments; POST /ops/cleaning-jobs/{id}/record-sludge-removal"
  - priority: 16
    category: business_referential
    check: "Shipment's profile.job_id == shipment.job_id"
    error_id: ERR_SHIPMENT_PROFILE_MISMATCH
    http_status: 409
    applies_to: "POST /ops/waste-shipments"
  - priority: 17
    category: business_referential
    check: "Changeover compatibility class is not FORBIDDEN"
    error_id: ERR_INCOMPATIBLE_CHANGEOVER
    http_status: 422
    applies_to: "POST /ops/cleaning-jobs/{id}/schedule"
  - priority: 18
    category: business_constraint
    check: "At most one APPROVED waste profile per job"
    error_id: ERR_PROFILE_ALREADY_APPROVED
    http_status: 409
    applies_to: "POST /ops/waste-profiles/{id}/approve"
  - priority: 19
    category: business_constraint
    check: "Window linkable: PLANNED, same tank, not already linked to another job"
    error_id: ERR_WINDOW_UNAVAILABLE
    http_status: 409
    applies_to: "POST /ops/cleaning-jobs/{id}/schedule"
  - priority: 20
    category: business_constraint
    check: "Tank must be IN_SERVICE to create a job or take out of service"
    error_id: ERR_TANK_NOT_IN_SERVICE
    http_status: 409
    applies_to: "POST /ops/cleaning-jobs; POST /ops/cleaning-jobs/{id}/take-out-of-service"
  - priority: 21
    category: business_constraint
    check: "At least one DELIVERED/RECONCILED shipment before sludge removal is recorded"
    error_id: ERR_NO_DELIVERED_SHIPMENT
    http_status: 409
    applies_to: "POST /ops/cleaning-jobs/{id}/record-sludge-removal"
  - priority: 22
    category: business_constraint
    check: "Entry requires an ACTIVE permit with CLEAR atmosphere"
    error_id: ERR_NO_VALID_ENTRY_PERMIT
    http_status: 409
    applies_to: "POST /ops/cleaning-jobs/{id}/begin-entry; POST /ops/cleaning-jobs/{id}/resume"
  - priority: 23
    category: business_constraint
    check: "Permit activate/resume requires atmosphere == CLEAR"
    error_id: ERR_ATMOSPHERE_NOT_CLEAR
    http_status: 409
    applies_to: "POST /ops/entry-permits/{id}/activate; POST /ops/entry-permits/{id}/resume"
  - priority: 24
    category: business_constraint
    check: "All permits CLOSED/VOIDED before complete-entry; no ACTIVE permit blocks job cancel"
    error_id: ERR_PERMITS_NOT_CLOSED
    http_status: 409
    applies_to: "POST /ops/cleaning-jobs/{id}/complete-entry"
    note: "cancel uses ERR_JOB_HAS_ACTIVE_PERMIT"
  - priority: 25
    category: business_constraint
    check: "No ACTIVE EntryPermit when cancelling a job"
    error_id: ERR_JOB_HAS_ACTIVE_PERMIT
    http_status: 409
    applies_to: "POST /ops/cleaning-jobs/{id}/cancel"
  - priority: 26
    category: business_constraint
    check: "Rework requires at least one unresolved finding on the accepted inspection"
    error_id: ERR_NO_REWORKABLE_FINDINGS
    http_status: 409
    applies_to: "POST /ops/cleaning-jobs/{id}/order-rework"
  - priority: 27
    category: business_constraint
    check: "No CRITICAL finding in {OPEN, REPAIR_ORDERED} on the accepted inspection before flush/RTS; inspection accept blocks only status OPEN"
    error_id: ERR_CRITICAL_FINDINGS_OPEN
    http_status: 409
    applies_to: "POST /ops/cleaning-jobs/{id}/begin-flush; POST /ops/cleaning-jobs/{id}/return-to-service; POST /ops/inspections/{id}/accept"
  - priority: 28
    category: business_constraint
    check: "Only MINOR/MAJOR findings may be accepted as risk"
    error_id: ERR_FINDING_NOT_RISK_ACCEPTABLE
    http_status: 409
    applies_to: "POST /ops/inspection-findings/{id}/accept-risk"
  - priority: 29
    category: business_constraint
    check: "actual_flush_liters >= computed flush_volume_liters (inclusive)"
    error_id: ERR_FLUSH_VOLUME_INSUFFICIENT
    http_status: 409
    applies_to: "POST /ops/cleaning-jobs/{id}/verify-flush"
  - priority: 30
    category: business_constraint
    check: "Mass balance within terminal tolerance (inclusive boundary)"
    error_id: ERR_MASS_BALANCE_OUT_OF_TOLERANCE
    http_status: 409
    applies_to: "POST /ops/cleaning-jobs/{id}/request-rts; POST /ops/cleaning-jobs/{id}/return-to-service"
  - priority: 31
    category: business_constraint
    check: "Certificate may be revalidated at most once"
    error_id: ERR_CERT_ALREADY_REVALIDATED
    http_status: 409
    applies_to: "POST /ops/gas-free-certificates/{id}/revalidate"
  - priority: 32
    category: business_constraint
    check: "Window cancel blocked while linked to a non-cancelled job"
    error_id: ERR_WINDOW_LINKED
    http_status: 409
    applies_to: "POST /ops/service-windows/{id}/cancel"
  - priority: 33
    category: business_fiscal
    check: "Daily wastewater allocation would stay within terminal capacity (inclusive)"
    error_id: ERR_DISCHARGE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /ops/wastewater-batches/{id}/authorize"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Terminal ---
  - method: POST
    path: "/ops/terminals"
    description: "Create a terminal (config: capacity, thresholds, score variant)"
    roles: [TerminalAdmin]
    code: 201
    input: [name, wastewater_daily_capacity_liters, "safety_score_threshold?", "score_variant?", "mass_balance_tolerance_pct?"]
    output: Terminal
    side_effects: ["defaults applied: threshold 85.0, score_variant ROLLING_12MO, tolerance 2.0"]
  - method: GET
    path: "/ops/terminals/{terminalId}"
    description: "Get a terminal"
    roles: &all_roles [TerminalAdmin, TerminalOperator, ContractorSupervisor, MarineChemist, EHSOfficer, API653Inspector, LabTechnician]
    code: 200
    input: []
    output: Terminal
    side_effects: []
  - method: GET
    path: "/ops/terminals"
    description: "List terminals (paginated)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: Terminal[]
    side_effects: []

  # --- Product ---
  - method: POST
    path: "/ops/products"
    description: "Register a product grade"
    roles: [TerminalAdmin]
    code: 201
    input: [code, family, viscosity_class, compatibility_group, flash_point_c]
    output: Product
    side_effects: []
  - method: GET
    path: "/ops/products/{productId}"
    description: "Get a product"
    roles: *all_roles
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/ops/products"
    description: "List products (paginated)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: Product[]
    side_effects: []

  # --- Tank ---
  - method: POST
    path: "/ops/tanks"
    description: "Register a tank"
    roles: [TerminalAdmin]
    code: 201
    input: [terminal_id, tank_number, capacity_m3, current_product_id]
    output: Tank
    side_effects: ["status=IN_SERVICE"]
  - method: GET
    path: "/ops/tanks/{tankId}"
    description: "Get a tank"
    roles: *all_roles
    code: 200
    input: []
    output: Tank
    side_effects: []
  - method: GET
    path: "/ops/tanks"
    description: "List tanks, filterable by terminal/product/status (paginated)"
    roles: *all_roles
    code: 200
    input: ["terminal_id?", "current_product_id?", "status?", "limit?", "offset?"]
    output: Tank[]
    side_effects: []

  # --- Contractor ---
  - method: POST
    path: "/ops/contractors"
    description: "Register a contractor (APPLICANT)"
    roles: [TerminalAdmin]
    code: 201
    input: [company_name]
    output: Contractor
    side_effects: ["status=APPLICANT, safety_score=100.00"]
  - method: GET
    path: "/ops/contractors/{contractorId}"
    description: "Get a contractor"
    roles: *all_roles
    code: 200
    input: []
    output: Contractor
    side_effects: []
  - method: GET
    path: "/ops/contractors"
    description: "List contractors (paginated)"
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Contractor[]
    side_effects: []
  - method: POST
    path: "/ops/contractors/{contractorId}/qualify"
    description: "Qualify a contractor against a terminal's score variant and threshold"
    roles: [TerminalAdmin]
    code: 200
    input: [terminal_id]
    output: Contractor
    side_effects: ["status APPLICANT -> QUALIFIED if score >= threshold (inclusive)"]
  - method: POST
    path: "/ops/contractors/{contractorId}/suspend"
    description: "Suspend a contractor"
    roles: [TerminalAdmin]
    code: 200
    input: []
    output: Contractor
    side_effects: ["status QUALIFIED -> SUSPENDED"]
  - method: POST
    path: "/ops/contractors/{contractorId}/reinstate"
    description: "Reinstate a suspended contractor (score re-check)"
    roles: [TerminalAdmin]
    code: 200
    input: [terminal_id]
    output: Contractor
    side_effects: ["status SUSPENDED -> QUALIFIED if score >= threshold"]
  - method: POST
    path: "/ops/contractors/{contractorId}/bar"
    description: "Bar a contractor (terminal state)"
    roles: [TerminalAdmin]
    code: 200
    input: []
    output: Contractor
    side_effects: ["status -> BARRED"]

  # --- SafetyEvent ---
  - method: POST
    path: "/ops/safety-events"
    description: "Record a safety event (append-only); recomputes contractor safety_score"
    roles: [EHSOfficer]
    code: 201
    input: [contractor_id, kind, severity_weight, occurred_at]
    output: SafetyEvent
    side_effects: ["recompute contractor_safety_score for the contractor"]
  - method: GET
    path: "/ops/safety-events/{eventId}"
    description: "Get a safety event"
    roles: *all_roles
    code: 200
    input: []
    output: SafetyEvent
    side_effects: []
  - method: GET
    path: "/ops/safety-events"
    description: "List safety events, filterable by contractor (paginated)"
    roles: *all_roles
