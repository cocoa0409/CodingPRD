# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID / X-User-Role missing or role not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in endpoint roles, or Consumer acting on another consumer's resources" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id (left-to-right) or body-supplied FK id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version on an OCC-guarded write" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Trigger not valid from the resource's current lifecycle state (including terminal lockdown and repeat triggers)" }
  - { id: ERR_REQUEST_NOT_VERIFIED, http: 409, condition: "Route attempted while verification_status == UNVERIFIED" }
  - { id: ERR_ACTIVITY_RETIRED, http: 409, condition: "Purpose/assessment creation against a RETIRED activity" }
  - { id: ERR_TASKS_OUTSTANDING, http: 409, condition: "Respond attempted while fulfillment_status != READY_TO_RESPOND" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Reviewer X-User-ID equals the assessment's submitted_by_user_id" }
  - { id: ERR_MECHANISM_NOT_ADEQUATE, http: 422, condition: "EU/UK-source transfer to US without mechanism in {SCC_2021, BCR}" }
  - { id: ERR_PIA_NOT_APPROVED, http: 409, condition: "Activate/resume blocked: pia_required without APPROVED assessment, or open assessment exists on resume" }
  - { id: ERR_NO_PUBLISHED_NOTICE, http: 422, condition: "CONSENT purpose create/relink with no PUBLISHED notice in the activity's notice_scope" }
  - { id: ERR_ELEMENT_RETIRED, http: 422, condition: "Activity creation linking a RETIRED DataElement" }
  - { id: ERR_VENDOR_NOT_APPROVED, http: 422, condition: "Transfer creation with vendor status != APPROVED" }
  - { id: ERR_SYSTEM_DECOMMISSIONED, http: 422, condition: "Transfer creation with source system status != ACTIVE" }
  - { id: ERR_CONTRACT_NOT_EXECUTED, http: 422, condition: "Transfer approval with vendor_contract status != EXECUTED" }
  - { id: ERR_NO_EXECUTED_CONTRACT, http: 422, condition: "Vendor approval with no EXECUTED contract" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "effective_to present and <= effective_from" }
  - { id: ERR_NOTICE_WINDOW_OVERLAP, http: 409, condition: "Publish window overlaps a PUBLISHED same-scope notice that is not the declared supersede target; or supersede target not PUBLISHED / wrong scope / non-overlapping" }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "Unique key collision: policy_code, element_key, system_key, state_code (StateLawRule), email" }
  - { id: ERR_TRANSFER_WINDOW_CONFLICT, http: 409, condition: "Transfer window within the 30-day buffer of an APPROVED/SUSPENDED transfer for the same (source_system_id, vendor_id)" }
