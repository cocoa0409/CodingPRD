# =============================================================================
# Task 0501 — Kids' Allowance & Chore Debit Card
# §1.9 Scaffold Corner Design (breadth probe).
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# Corners already exercised by a §1.8 instance are emitted as excluded_because stubs
# (no test_recipe); the cited difficulty_instance exists by name in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Every active recipe uses only §1.5 endpoints and
# pre-computed literal asserts.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_child_account_auto_creates_jars_card_config
        claim_type: Creation
        grounds:
          - entities.ChildAccount
          - entities.Jar
          - entities.DebitCard
          - entities.InterestMatchConfig
        distinguishing_aspect: |
          POST /families/{id}/child-accounts with display_name+birthdate returns 201 and auto-creates exactly
          three Jars (SPEND/SAVE/GIVE), one DebitCard (UNLOCKED/DRAINED), one InterestMatchConfig.
        test_recipe:
          setup:
            - "An empty family exists."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "C1" }
              as: Parent
              as_user_id: "p-c1"
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Kid", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-c1"
              captures: { child_id: $.data.id }
          assert:
            - "ChildAccount.${child_id}.status == ACTIVE"
            - "GET /child-accounts/${child_id}/jars returns exactly 3 rows with jar_type set {SPEND,SAVE,GIVE}"
            - "GET /child-accounts/${child_id}/debit-cards returns 1 row with lock_state==UNLOCKED, funding_state==DRAINED"

      - name: create_chore_missing_reward_cents_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Chore.fields.reward_cents
          - validations[priority=5]
        distinguishing_aspect: "POST /child-accounts/{id}/chores without reward_cents → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A child account exists."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "C2" }
              as: Parent
              as_user_id: "p-c2"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Kid", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-c2"
              captures: { child_id: $.data.id }
          trigger:
            - call: "POST /child-accounts/${child_id}/chores"
              payload: { title: "NoReward" }
              as: Parent
              as_user_id: "p-c2"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: chore_reward_cents_zero_returns_validation
        claim_type: Type Constraints
        grounds:
          - entities.Chore.fields.reward_cents
          - validations[priority=6]
        distinguishing_aspect: "Well-formed body but reward_cents=0 violates the >0 bound → ERR_VALIDATION (422)."
        test_recipe:
          setup:
            - "A child account exists."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "C3" }
              as: Parent
              as_user_id: "p-c3"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Kid", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-c3"
              captures: { child_id: $.data.id }
          trigger:
            - call: "POST /child-accounts/${child_id}/chores"
              payload: { title: "Free", reward_cents: 0 }
              as: Parent
              as_user_id: "p-c3"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "HTTP status == 422"

      - name: is_teen_computed_true_at_exact_13_years
        claim_type: Computed Fields
        grounds:
          - entities.ChildAccount.fields.is_teen
          - entities.ChildAccount.fields.birthdate
        distinguishing_aspect: |
          At clock_now 2026-06-26, a child born 2013-06-26 is exactly 13 years old and reads is_teen==true;
          the input never sets is_teen — it is purely computed from birthdate vs the logical clock.
        test_recipe:
          setup:
            - "Clock set to 2026-06-26; child born exactly 13 years earlier."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-26T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /families"
              payload: { family_name: "C4" }
              as: Parent
              as_user_id: "p-c4"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Teen", birthdate: "2013-06-26" }
              as: Parent
              as_user_id: "p-c4"
              captures: { child_id: $.data.id }
          trigger:
            - call: "GET /child-accounts/${child_id}"
              payload: {}
              as: Parent
              as_user_id: "p-c4"
          assert:
            - "ChildAccount.${child_id}.is_teen == true"

      - name: get_child_account_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.ChildAccount
          - validations[priority=4]
        distinguishing_aspect: "GET /child-accounts/{id} with an unknown UUID → ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "No child with the queried id exists."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "C5" }
              as: Parent
              as_user_id: "p-c5"
              captures: { fam_id: $.data.id }
          trigger:
            - call: "GET /child-accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Parent
              as_user_id: "p-c5"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: spend_alert_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.SpendAlert
        distinguishing_aspect: |
          SpendAlert has common_fields:false — it carries only id and created_at, no version field, and has
          no mutating endpoint; an authorization at/above the family large_spend threshold emits one.
        test_recipe:
          setup:
            - "Family large_spend_threshold_cents=3000; child SPEND jar 10000; authorize 5000 (>= threshold)."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "C6" }
              as: Parent
              as_user_id: "p-c6"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 20000 }
              as: Parent
              as_user_id: "p-c6"
            - call: "POST /families/${fam_id}/alert-thresholds"
              payload: { large_spend_threshold_cents: 3000, low_balance_threshold_cents: 1000 }
              as: Parent
              as_user_id: "p-c6"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Al", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-c6"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/debit-cards"
              payload: {}
              as: Parent
              as_user_id: "p-c6"
              captures: { card_id: "$.data[0].id" }
            - call: "POST /child-accounts/${child_id}/fund-jar"
              payload: { jar_type: "SPEND", amount_cents: 10000 }
              as: Parent
              as_user_id: "p-c6"
          trigger:
            - call: "POST /debit-cards/${card_id}/authorizations"
              payload: { merchant_id: "MB", category: "FOOD", amount_cents: 5000 }
              as: Child
              as_user_id: "${child_id}"
              captures: { txn_id: $.data.id }
          assert:
            - "GET /transactions/${txn_id}/alerts returns at least 1 row with alert_kind==LARGE_SPEND and amount_cents==5000"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_already_paid_completion_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ChoreCompletion.PENDING_REVIEW_to_PAID
          - validations[priority=8]
        distinguishing_aspect: |
          A PAID ChoreCompletion is terminal; a second approve must fail ERR_INVALID_STATE (409) and move
          no money (funding unchanged from the post-first-approve value).
        test_recipe:
          setup:
            - "Family funded 10000; a completion already approved (PAID), funding now 9500."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "S1" }
              as: Parent
              as_user_id: "p-s1"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 10000 }
              as: Parent
              as_user_id: "p-s1"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Bo", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-s1"
              captures: { child_id: $.data.id }
            - call: "POST /child-accounts/${child_id}/chores"
              payload: { title: "Trash", reward_cents: 500 }
              as: Parent
              as_user_id: "p-s1"
              captures: { chore_id: $.data.id }
            - call: "POST /chores/${chore_id}/submit"
              payload: {}
              as: Child
              as_user_id: "${child_id}"
              captures: { comp_id: $.data.id }
            - call: "POST /chore-completions/${comp_id}/approve"
              payload: {}
              as: Parent
              as_user_id: "p-s1"
          trigger:
            - call: "POST /chore-completions/${comp_id}/approve"
              payload: {}
              as: Parent
              as_user_id: "p-s1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Family.${fam_id}.funding_balance_cents == 9500"

      - name: resubmit_from_pending_review_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ChoreCompletion.NEEDS_REVISION_to_PENDING_REVIEW
          - validations[priority=8]
        distinguishing_aspect: "resubmit is only valid from NEEDS_REVISION; calling it on a PENDING_REVIEW completion → ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Child has a freshly submitted completion in PENDING_REVIEW (never kicked back)."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "S2" }
              as: Parent
              as_user_id: "p-s2"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Cy", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-s2"
              captures: { child_id: $.data.id }
            - call: "POST /child-accounts/${child_id}/chores"
              payload: { title: "Bed", reward_cents: 300 }
              as: Parent
              as_user_id: "p-s2"
              captures: { chore_id: $.data.id }
            - call: "POST /chores/${chore_id}/submit"
              payload: {}
              as: Child
              as_user_id: "${child_id}"
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /chore-completions/${comp_id}/resubmit"
              payload: {}
              as: Child
              as_user_id: "${child_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "ChoreCompletion.${comp_id}.status == PENDING_REVIEW"
            - "ChoreCompletion.${comp_id}.revision_count == 0"

      - name: deny_compensation_sets_chore_rejected_no_money
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ChoreCompletion.PENDING_REVIEW_to_DENIED
          - state_machines.Chore.SUBMITTED_to_REJECTED
        distinguishing_aspect: "Denying a completion sets it DENIED, bubbles the parent Chore to REJECTED, and moves no money (funding unchanged)."
        test_recipe:
          setup:
            - "Family funded 10000; child has a PENDING_REVIEW completion worth 1500."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "S3" }
              as: Parent
              as_user_id: "p-s3"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 10000 }
              as: Parent
              as_user_id: "p-s3"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Di", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-s3"
              captures: { child_id: $.data.id }
            - call: "POST /child-accounts/${child_id}/chores"
              payload: { title: "Wash", reward_cents: 1500 }
              as: Parent
              as_user_id: "p-s3"
              captures: { chore_id: $.data.id }
            - call: "POST /chores/${chore_id}/submit"
              payload: {}
              as: Child
              as_user_id: "${child_id}"
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /chore-completions/${comp_id}/deny"
              payload: {}
              as: Parent
              as_user_id: "p-s3"
          assert:
            - "ChoreCompletion.${comp_id}.status == DENIED"
            - "Chore.${chore_id}.status == REJECTED"
            - "Family.${fam_id}.funding_balance_cents == 10000"

      - name: investment_close_terminal_lockdown_rejects_orders
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.InvestmentAccount.ACTIVE_to_CLOSED
          - validations[priority=10]
        distinguishing_aspect: "A CLOSED InvestmentAccount rejects new orders with ERR_ACCOUNT_CLOSED (409)."
        test_recipe:
          setup:
            - "Teen child has an ACTIVE investment account with no holdings and 5000 cash; account then closed (cash swept to SAVE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-26T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /families"
              payload: { family_name: "S4" }
              as: Parent
              as_user_id: "p-s4"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 20000 }
              as: Parent
              as_user_id: "p-s4"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Ev", birthdate: "2010-01-01" }
              as: Parent
              as_user_id: "p-s4"
              captures: { child_id: $.data.id }
            - call: "POST /child-accounts/${child_id}/fund-jar"
              payload: { jar_type: "SAVE", amount_cents: 8000 }
              as: Parent
              as_user_id: "p-s4"
            - call: "POST /child-accounts/${child_id}/investment-account"
              payload: {}
              as: Parent
              as_user_id: "p-s4"
              captures: { inv_id: $.data.id }
            - call: "POST /investment-accounts/${inv_id}/fund"
              payload: { amount_cents: 5000 }
              as: Parent
              as_user_id: "p-s4"
            - call: "POST /investment-accounts/${inv_id}/close"
              payload: {}
              as: Parent
              as_user_id: "p-s4"
          trigger:
            - call: "POST /investment-accounts/${inv_id}/orders"
              payload: { side: "BUY", symbol: "AAA", shares_milli: 1000, price_cents_per_share: 100 }
              as: Parent
              as_user_id: "p-s4"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ACCOUNT_CLOSED"
            - "HTTP status == 409"

      - name: allowance_resume_from_active_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.AllowanceSchedule.PAUSED_to_ACTIVE
          - validations[priority=8]
        distinguishing_aspect: "resume requires status==PAUSED; resuming an ACTIVE schedule → ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Child has one ACTIVE allowance schedule (never paused)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /families"
              payload: { family_name: "S5" }
              as: Parent
              as_user_id: "p-s5"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Fi", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-s5"
              captures: { child_id: $.data.id }
            - call: "POST /child-accounts/${child_id}/allowance-schedules"
              payload: { amount_cents: 1000, payout_jar_type: "SPEND", cadence_days: 30, next_run_at: "2026-04-01T00:00:00Z" }
              as: Parent
              as_user_id: "p-s5"
              captures: { sched_id: $.data.id }
          trigger:
            - call: "POST /allowance-schedules/${sched_id}/resume"
              payload: {}
              as: Parent
              as_user_id: "p-s5"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "AllowanceSchedule.${sched_id}.status == ACTIVE"

      - name: paused_schedule_skipped_by_run_sweep
        claim_type: Side Effect Execution
        grounds:
          - state_machines.AllowanceSchedule.ACTIVE_to_PAUSED
          - state_machines.AllowanceSchedule.ACTIVE_to_ACTIVE
        distinguishing_aspect: "A PAUSED schedule due now is skipped by POST /_scheduler/run-due-allowances: no AllowanceRun is created and funding is unchanged."
        test_recipe:
          setup:
            - "Family funded 10000; child has a due SPEND schedule (next_run_at 2026-03-01) that is then PAUSED; clock at 2026-03-02."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /families"
              payload: { family_name: "S6" }
              as: Parent
              as_user_id: "p-s6"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 10000 }
              as: Parent
              as_user_id: "p-s6"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Gi", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-s6"
              captures: { child_id: $.data.id }
            - call: "POST /child-accounts/${child_id}/allowance-schedules"
              payload: { amount_cents: 2500, payout_jar_type: "SPEND", cadence_days: 7, next_run_at: "2026-03-01T00:00:00Z" }
              as: Parent
              as_user_id: "p-s6"
              captures: { sched_id: $.data.id }
            - call: "POST /allowance-schedules/${sched_id}/pause"
              payload: {}
              as: Parent
              as_user_id: "p-s6"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_scheduler/run-due-allowances"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Family.${fam_id}.funding_balance_cents == 10000"
            - "GET /allowance-schedules/${sched_id}/runs returns 0 rows"

  # ===========================================================================
  - section: calculations
    instances:
      - name: allowance_run_skipped_insufficient_funds
        claim_type: Correct Result
        grounds:
          - calculations.allowance_funding_conservation
          - entities.AllowanceRun.fields.outcome
        distinguishing_aspect: |
          When Family.funding_balance_cents (1000) < schedule amount (2500), the run records
          outcome==SKIPPED_INSUFFICIENT_FUNDS, leaves funding at 1000 and the SPEND jar at 0, and still
          advances next_run_at by cadence_days.
        test_recipe:
          setup:
            - "Family funded only 1000; child has a due SPEND schedule amount 2500 (next_run_at 2026-03-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /families"
              payload: { family_name: "K1" }
              as: Parent
              as_user_id: "p-k1"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 1000 }
              as: Parent
              as_user_id: "p-k1"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Ha", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-k1"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/jars"
              payload: { jar_type: "SPEND" }
              as: Parent
              as_user_id: "p-k1"
              captures: { spend_jar_id: "$.data[0].id" }
            - call: "POST /child-accounts/${child_id}/allowance-schedules"
              payload: { amount_cents: 2500, payout_jar_type: "SPEND", cadence_days: 7, next_run_at: "2026-03-01T00:00:00Z" }
              as: Parent
              as_user_id: "p-k1"
              captures: { sched_id: $.data.id }
          trigger:
            - call: "POST /_scheduler/run-due-allowances"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Family.${fam_id}.funding_balance_cents == 1000"
            - "Jar.${spend_jar_id}.balance_cents == 0"
            - "GET /allowance-schedules/${sched_id}/runs returns 1 row with outcome==SKIPPED_INSUFFICIENT_FUNDS"

      - name: partial_settle_leaves_residual_jar_balance
        claim_type: Variant Reconciliation
        grounds:
          - calculations.spend_authorization_amount
          - state_machines.Transaction.PENDING_to_SETTLED
        distinguishing_aspect: |
          Authorize 4000 (hold 4000) then settle at partial 1500: hold fully released, SPEND jar debited only
          1500 (5000 -> 3500), available_cents back to 3500 — the (amount - settled)=2500 difference returns
          to spendable.
        test_recipe:
          setup:
            - "Child SPEND jar 5000; one PENDING authorization for 4000."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "K2" }
              as: Parent
              as_user_id: "p-k2"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 20000 }
              as: Parent
              as_user_id: "p-k2"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Ib", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-k2"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/debit-cards"
              payload: {}
              as: Parent
              as_user_id: "p-k2"
              captures: { card_id: "$.data[0].id" }
            - call: "GET /child-accounts/${child_id}/jars"
              payload: { jar_type: "SPEND" }
              as: Parent
              as_user_id: "p-k2"
              captures: { spend_jar_id: "$.data[0].id" }
            - call: "POST /child-accounts/${child_id}/fund-jar"
