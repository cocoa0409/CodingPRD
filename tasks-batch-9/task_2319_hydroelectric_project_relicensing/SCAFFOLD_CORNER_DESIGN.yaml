          assert:
            - "${e_proj} == ERR_PROJECT_NOT_FOUND, ${e_dam} == ERR_DAM_NOT_FOUND and ${e_site} == ERR_SITE_NOT_FOUND"
            - "${e_plan} == ERR_STUDY_PLAN_NOT_FOUND, ${e_study} == ERR_STUDY_NOT_FOUND and ${e_comment} == ERR_COMMENT_NOT_FOUND"
            - "${e_party} == ERR_PARTY_NOT_FOUND, ${e_stl} == ERR_SETTLEMENT_NOT_FOUND and ${e_wqc} == ERR_WQC_NOT_FOUND"
            - "${e_app} == ERR_APPLICATION_NOT_FOUND, ${e_order} == ERR_ORDER_NOT_FOUND and ${e_obl} == ERR_OBLIGATION_NOT_FOUND"
            - "all twelve responses carry HTTP 404 with response_type error and a message string"

