          - call: "POST /direct-selling/qualification-periods"
            payload: { compensation_plan_id: "${plan_id}", period_code: "2026-08", period_start: "2026-11-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z" }
            as: CommissionAnalyst
            captures: { e_period: "$.data.error_id" }
