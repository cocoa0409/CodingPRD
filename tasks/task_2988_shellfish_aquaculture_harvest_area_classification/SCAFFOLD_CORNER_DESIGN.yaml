              as: ShellfishControlAuthority
            - call: "POST /shellfish/growout-units"
              payload: { lease_id: "${lease}", seed_lot_id: "${seed}", plot_code: "P1", gear_type: "BOTTOM", gear_units: 40, seed_count_planted: 25000, deployed_on: "2026-05-05", planned_retrieval_on: "2026-05-05" }
              as: FarmOperator
              as_user_id: "op-1"
          assert:
