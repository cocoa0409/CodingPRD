  # ---------------------------------------------------------------------------
  # Table 6 (Errors) — claim-extraction-guide.md §6: "verify every error code is
  # triggerable". A census over the 39 §1.6 codes shows that 30 of them are
  # already triggered by a §1.8 instance or by an earlier section of this file.
  # The nine full instances below close the remaining gap — the nine path-level
  # NOT_FOUND codes, each of which needs the priority-5 left-to-right existence
  # sweep and nothing else. Eight stubs then name the §1.8 instance that owns
  # each of the codes reached only from the difficulty file, so the census is
  # explicit rather than implied. Note that §1.6 declares ERR_FORBIDDEN_ROLE,
  # not the guide's generic ERR_UNAUTHORIZED; the rbac section below uses the
  # scaffold's own code.
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: settling_an_unknown_gift_returns_gift_not_found_before_any_state_check
        claim_type: violation_to_error
        grounds:
          - errors[ERR_GIFT_NOT_FOUND]
          - validations[priority 5]
        distinguishing_aspect: |
          The settle endpoint also carries a §1.2 state gate (only PLEDGED may be
          settled), and priority 5 must fire ahead of priority 9 so an unknown id
          reports 404 rather than 409. The database is empty, so nothing but the
          existence sweep can produce a verdict.
        test_recipe:
          setup:
            - "Empty database at the default clock; no Gift rows exist."
          setup_api_calls: []
          trigger:
            - call: "POST /athletics/gifts/00000000-0000-4000-8000-000000000101/settle"
              payload: { new_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP 404 with error_id == \"ERR_GIFT_NOT_FOUND\""
            - "Not ERR_INVALID_STATE (409) — priority 5 existence precedes the priority 9 state gate"
            - "The response body carries no data key"

      - name: running_an_unknown_recalculation_returns_recalculation_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RECALCULATION_NOT_FOUND]
          - validations[priority 5]
        distinguishing_aspect: |
          Every recalculation action, every nested selection-event creation and
          the retention-analysis read hang off this one path segment, so the code
          must be reachable from the bare action endpoint with an empty database.
        test_recipe:
          setup:
            - "Empty database at the default clock; no PointRecalculation rows exist."
          setup_api_calls: []
          trigger:
            - call: "POST /athletics/point-recalculations/00000000-0000-4000-8000-000000000102/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP 404 with error_id == \"ERR_RECALCULATION_NOT_FOUND\""
            - "Not ERR_INVALID_STATE — the row does not exist, so it has no status to reject"

      - name: reading_an_unknown_ledger_entry_returns_ledger_entry_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LEDGER_ENTRY_NOT_FOUND]
          - endpoints[GET /athletics/point-ledger-entries/{id}]
        distinguishing_aspect: |
          PointLedgerEntry is the one immutable entity, so its only path-level id
          consumer is the singleton read; the code is unreachable from any
          mutation and must be proved from the GET. All six roles may call it, so
          no role gate can mask the 404.
        test_recipe:
          setup:
            - "Empty database at the default clock; no PointLedgerEntry rows exist."
          setup_api_calls: []
          trigger:
            - call: "GET /athletics/point-ledger-entries/00000000-0000-4000-8000-000000000103"
              payload: {}
              as: DisputeAnalyst
              as_user_id: "analyst-1"
          assert:
            - "HTTP 404 with error_id == \"ERR_LEDGER_ENTRY_NOT_FOUND\""
            - "Not ERR_FORBIDDEN_ROLE — DisputeAnalyst is among the six permitted roles for this read"

      - name: approving_an_unknown_transfer_returns_transfer_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TRANSFER_NOT_FOUND]
          - endpoints[POST /athletics/point-transfers/{id}/approve]
        distinguishing_aspect: |
          There is no GET /athletics/point-transfers/{id} anywhere in §1.5 — the
          only singleton view is the donor sub-collection — so this code is
          reachable ONLY through an action endpoint, and the action is exclusive
          to PointsCertifier. Calling it as any other role would return 403 at
          priority 2 and never reach the existence sweep, so the caller's role
          is load-bearing for the claim.
        test_recipe:
          setup:
            - "Empty database at the default clock; no PointTransfer rows exist."
          setup_api_calls: []
          trigger:
            - call: "POST /athletics/point-transfers/00000000-0000-4000-8000-000000000104/approve"
              payload: {}
              as: PointsCertifier
              as_user_id: "certifier-1"
          assert:
            - "HTTP 404 with error_id == \"ERR_TRANSFER_NOT_FOUND\""
            - "Not ERR_FORBIDDEN_ROLE — PointsCertifier owns this operation, so priority 2 passes and priority 5 decides"

      - name: reading_an_unknown_seat_returns_seat_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEAT_NOT_FOUND]
          - endpoints[GET /athletics/seats/{id}]
        distinguishing_aspect: |
          The seat singleton read is what a picker uses to obtain
          expected_seat_version, so an unknown seat must fail here rather than
          silently at pick time; the pick body's seat_id would instead raise the
          priority-7 ERR_REFERENCED_ENTITY_NOT_FOUND, which is a different code.
        test_recipe:
          setup:
            - "Empty database at the default clock; no Seat rows exist."
          setup_api_calls: []
          trigger:
            - call: "GET /athletics/seats/00000000-0000-4000-8000-000000000105"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP 404 with error_id == \"ERR_SEAT_NOT_FOUND\""
            - "Not ERR_REFERENCED_ENTITY_NOT_FOUND — the id is in the PATH, so priority 5 applies, not priority 7"

      - name: reading_an_unknown_seat_assignment_returns_seat_assignment_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEAT_ASSIGNMENT_NOT_FOUND]
          - endpoints[GET /athletics/seat-assignments/{id}]
        distinguishing_aspect: |
          A SeatAssignment is never created by a POST of its own, so this is the
          only id-addressed read of it; the same code guards both the occupancy
          and billing action endpoints, whose bodies would otherwise attempt an
          OCC comparison against a row that does not exist.
        test_recipe:
          setup:
            - "Empty database at the default clock; no SeatAssignment rows exist."
          setup_api_calls: []
          trigger:
            - call: "GET /athletics/seat-assignments/00000000-0000-4000-8000-000000000106"
              payload: {}
              as: PolicyCommittee
              as_user_id: "policy-1"
          assert:
            - "HTTP 404 with error_id == \"ERR_SEAT_ASSIGNMENT_NOT_FOUND\""
            - "Not ERR_STALE_VERSION — priority 5 existence precedes the priority 8 OCC check"

      - name: publishing_slots_for_an_unknown_event_returns_selection_event_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SELECTION_EVENT_NOT_FOUND]
          - validations[priority 5]
        distinguishing_aspect: |
          publish-slots is guarded by priority 10 (ERR_RECALCULATION_NOT_CERTIFIED)
          and priority 21 (ERR_SLOT_WINDOW_OVERFLOW) as well, both of which need a
          real event row to evaluate; the 404 proves the existence sweep runs
          before either of them can be attempted.
        test_recipe:
          setup:
            - "Empty database at the default clock; no SelectionEvent rows exist."
          setup_api_calls: []
          trigger:
            - call: "POST /athletics/selection-events/00000000-0000-4000-8000-000000000107/publish-slots"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP 404 with error_id == \"ERR_SELECTION_EVENT_NOT_FOUND\""
            - "Neither ERR_RECALCULATION_NOT_CERTIFIED nor ERR_SLOT_WINDOW_OVERFLOW is returned"

      - name: forfeiting_an_unknown_slot_as_an_officer_returns_selection_slot_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SELECTION_SLOT_NOT_FOUND]
          - validations[priority 3]
        distinguishing_aspect: |
          forfeit is shared between Donor and DevelopmentOfficer, and priority 3
          (ERR_NOT_RESOURCE_OWNER) is declared to constrain the Donor role only.
          Calling as DevelopmentOfficer therefore removes the only gate that sits
          above existence, so the 404 is attributable to priority 5 alone; the
          same call as a Donor could legitimately return 403 instead.
        test_recipe:
          setup:
            - "Empty database at the default clock; no SelectionSlot rows exist."
          setup_api_calls: []
          trigger:
            - call: "POST /athletics/selection-slots/00000000-0000-4000-8000-000000000108/forfeit"
              payload: { reason: "probe for a slot that does not exist" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP 404 with error_id == \"ERR_SELECTION_SLOT_NOT_FOUND\""
            - "Not ERR_NOT_RESOURCE_OWNER — priority 3 is declared for the Donor role only"

      - name: deciding_an_unknown_relocation_request_returns_relocation_request_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RELOCATION_REQUEST_NOT_FOUND]
          - endpoints[POST /athletics/relocation-requests/{id}/decide]
        distinguishing_aspect: |
          The decide body may name a target_seat_id, whose absence would raise the
          priority-7 ERR_REFERENCED_ENTITY_NOT_FOUND or the priority-23
          ERR_RELOCATION_TARGET_INVALID; omitting it and using DENY isolates the
          path-level 404 with no competing body-level check.
        test_recipe:
          setup:
            - "Empty database at the default clock; no RelocationRequest rows exist."
          setup_api_calls: []
          trigger:
            - call: "POST /athletics/relocation-requests/00000000-0000-4000-8000-000000000109/decide"
              payload: { decision: "DENY", decision_note: "probe for a request that does not exist" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP 404 with error_id == \"ERR_RELOCATION_REQUEST_NOT_FOUND\""
            - "Not ERR_INVALID_STATE and not ERR_RELOCATION_TARGET_INVALID"

      - name: error_no_eligible_donors_on_certify_and_publish
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_NO_ELIGIBLE_DONORS]"
        excluded_because:
          difficulty_instance: boundary_precision_check / eligible_pool_floor_inclusive_at_exact_points_match
          rationale: "The §1.8 instance drives the pool to empty by setting eligible_donor_min_points one hundredth above the only candidate's certified_points, which is the sole way to trigger this 422; a §1.9 restatement would be the same request."

      - name: error_seat_hold_conflict_on_pick
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SEAT_HOLD_CONFLICT]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / seat_hold_windows_closed_interval_touching_rejected
          rationale: "The §1.8 instance triggers the 409 at exactly hold_end, the only boundary at which the closed hold interval collides, and also asserts the success one millisecond later."

      - name: error_seat_not_available_on_pick
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SEAT_NOT_AVAILABLE]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / pick_temporal_beats_constraint
          rationale: "The §1.8 instance asserts the 409 in isolation and then, with the clock moved outside the slot window, shows priority 14 outranking it — both halves of this code's triggerability."

      - name: error_outside_slot_window_on_pick
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_OUTSIDE_SLOT_WINDOW]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / pick_temporal_beats_constraint
          rationale: "The same §1.8 instance triggers the 422 at both edges of the half-open slot window, so the code's boundary behaviour is already pinned."

      - name: error_selection_window_overlap_on_gate
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SELECTION_WINDOW_OVERLAP]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / selection_event_windows_half_open_adjacency_allowed_overlap_rejected
          rationale: "The §1.8 instance gates an adjacent event OPEN successfully and an interior-overlapping one to 409, which is the whole of this gate-only code."

      - name: error_event_not_open_for_requests_on_relocation_create
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_EVENT_NOT_OPEN_FOR_REQUESTS]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / relocation_create_state_beats_fiscal
          rationale: "The §1.8 instance returns this 409 from a DRAFT event while a fiscal violation is simultaneously outstanding, proving both the code and its priority-12 rank."

      - name: error_info_request_limit_reached_on_request_info
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_INFO_REQUEST_LIMIT_REACHED]"
        excluded_because:
          difficulty_instance: non_linear_state_machine / dispute_info_request_cycle_returns_to_under_review
          rationale: "The §1.8 instance exhausts info_request_rounds to 2 and asserts the third request-info returns this 422."

      - name: error_section_under_renovation_on_pick
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SECTION_UNDER_RENOVATION]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pick_blocked_when_section_under_renovation
          rationale: "The §1.8 instance asserts the 409 on a pick into a SURVEYED section and the success after ABANDON restores status OPEN."

  # ---------------------------------------------------------------------------
  # Table 7 (RBAC) — claim-extraction-guide.md §7, plus the role_model row
  # "Segregation of duties" for complexity_profile.role_model:
  # segregation_of_duties. §1.6 names the denial code ERR_FORBIDDEN_ROLE rather
  # than the guide's generic ERR_UNAUTHORIZED, so every assert below uses the
  # scaffold's own code at HTTP 403 (priority 2). Each denial is paired with the
  # SAME request issued by the owning role, so a blanket-403 implementation
  # cannot pass: the claim is that exactly one role is admitted, not that the
  # call fails. The two roles with a hand-enumerated GET list (DisputeAnalyst
  # and Donor) additionally get a read-surface claim, because "every GET" is NOT
  # what §1.7 grants them.
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: development_officer_cannot_certify_the_cycle_it_ran_but_the_certifier_can
        claim_type: cannot_perform_others_exclusive_operations
        grounds:
          - roles.PointsCertifier.exclusive_operations
          - roles.DevelopmentOfficer.exclusive_operations
          - validations[priority 2]
        distinguishing_aspect: |
          DevelopmentOfficer owns every step of the cycle up to
          send-communications, so it is the role most likely to be granted
          certify by an over-broad implementation. The pair of calls shares one
          captured version, so the second call's success proves the first
          rejection came from the role gate rather than from OCC or state.
        test_recipe:
          setup:
            - "One PointRecalculation for cycle 2026 initiated by officer-1, run and communicated, therefore in status COMMUNICATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { rbr_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${rbr_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations/${rbr_id}/send-communications"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/point-recalculations/${rbr_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { rbr_v: "$.data.version" }
          trigger:
            - call: "POST /athletics/point-recalculations/${rbr_id}/certify"
              payload: { expected_recalculation_version: "${rbr_v}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations/${rbr_id}/certify"
              payload: { expected_recalculation_version: "${rbr_v}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/point-recalculations/${rbr_id}/certify"
              payload: { expected_recalculation_version: "${rbr_v}" }
              as: PointsCertifier
              as_user_id: "certifier-1"
          assert:
            - "The DevelopmentOfficer attempt returns HTTP 403 with error_id == \"ERR_FORBIDDEN_ROLE\""
            - "The PlatformAdmin attempt also returns HTTP 403 with error_id == \"ERR_FORBIDDEN_ROLE\" — certify is absent from PlatformAdmin's shared_operations, so there is no admin override"
            - "PointRecalculation.${rbr_id}.status is still \"COMMUNICATED\" and version is still ${rbr_v} after both rejections"
            - "The PointsCertifier attempt with the SAME ${rbr_v} returns HTTP 200 with status == \"CERTIFIED\" and certified_by_user_id == \"certifier-1\""
            - "The success proves the two 403s were priority-2 role denials, not ERR_STALE_VERSION or ERR_INVALID_STATE"

      - name: points_certifier_cannot_run_or_communicate_a_recalculation
        claim_type: cannot_perform_others_exclusive_operations
        grounds:
          - roles.PointsCertifier.shared_operations
          - roles.DevelopmentOfficer.exclusive_operations
        distinguishing_aspect: |
          PointsCertifier's shared_operations are exactly "every GET" plus the
          clock, so it holds NO write permission outside its three exclusive
          operations. Both compute-side actions must be refused even though the
          certifier is the role that ultimately consumes their output.
        test_recipe:
          setup:
            - "One PointRecalculation for cycle 2026 in status DRAFT, initiated by officer-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { rbc_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/point-recalculations/${rbc_id}/run"
              payload: {}
              as: PointsCertifier
              as_user_id: "certifier-1"
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2027, cutoff_date: "2027-06-30T23:59:59.999Z", dispute_window_end: "2027-09-30T00:00:00.000Z" }
              as: PointsCertifier
              as_user_id: "certifier-1"
            - call: "GET /athletics/point-recalculations/${rbc_id}"
              payload: {}
              as: PointsCertifier
              as_user_id: "certifier-1"
            - call: "POST /athletics/point-recalculations/${rbc_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "The certifier's run attempt returns HTTP 403 with error_id == \"ERR_FORBIDDEN_ROLE\""
            - "The certifier's create attempt also returns HTTP 403 with error_id == \"ERR_FORBIDDEN_ROLE\" and no cycle-2027 row is created"
            - "The certifier's GET of the same row returns HTTP 200 — \"every GET\" is genuinely shared, so the denial is write-scoped, not row-scoped"
            - "PointRecalculation.${rbc_id}.status is still \"DRAFT\" after the rejected run"
            - "The officer's run then returns HTTP 200 with status == \"COMPUTED\""

      - name: dispute_analyst_cannot_decide_the_dispute_it_reviewed
        claim_type: cannot_perform_others_exclusive_operations
        grounds:
          - roles.PolicyCommittee.exclusive_operations
          - roles.DisputeAnalyst.exclusive_operations
        distinguishing_aspect: |
          The whole point of the DisputeAnalyst role is "works donor point
          disputes but never decides them", so review must succeed and decide
          must fail for the very same actor on the very same row. The decide is
          then issued by a PolicyCommittee user id that never reviewed, which
          clears priority 4 as well and returns 200.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00.000Z, strictly before the 2026-09-30 dispute window end."
            - "One donor with a 1000000-cent RECEIVED ATHLETICS_ANNUAL gift dated 2026-03-01, one COMMUNICATED cycle-2026 recalculation, and one dispute filed by that donor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Dot Dispute", email: "dot.dispute@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { dd_id: "$.data.id" }
            - call: "POST /athletics/donors/${dd_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 1000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { ddr_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${ddr_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations/${ddr_id}/send-communications"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-disputes"
              payload: { donor_id: "${dd_id}", recalculation_id: "${ddr_id}", claimed_points_delta: 4.00, basis_note: "a 2026 gift is missing from the scoring set" }
              as: Donor
              as_user_id: "${dd_id}"
              captures: { ddd_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/point-disputes/${ddd_id}/review"
              payload: {}
              as: DisputeAnalyst
              as_user_id: "analyst-1"
            - call: "POST /athletics/point-disputes/${ddd_id}/decide"
              payload: { decision: "UPHOLD", granted_points_delta: 4.00 }
              as: DisputeAnalyst
              as_user_id: "analyst-1"
            - call: "POST /athletics/point-disputes/${ddd_id}/decide"
              payload: { decision: "UPHOLD", granted_points_delta: 4.00 }
              as: PolicyCommittee
              as_user_id: "policy-1"
          assert:
            - "The review returns HTTP 200 with status == \"UNDER_REVIEW\" and reviewed_by_user_id == \"analyst-1\""
            - "The analyst's decide returns HTTP 403 with error_id == \"ERR_FORBIDDEN_ROLE\" (priority 2), NOT ERR_SEGREGATION_OF_DUTIES (priority 4) — the role gate is checked first even though the same actor also violates duty separation"
            - "PointDispute.${ddd_id}.status is still \"UNDER_REVIEW\" after the rejection"
            - "The PolicyCommittee decide by policy-1 returns HTTP 200 with status == \"UPHELD\" and granted_points_delta == 4.00"

      - name: policy_committee_cannot_review_or_request_information
        claim_type: cannot_perform_others_exclusive_operations
        grounds:
          - roles.DisputeAnalyst.exclusive_operations
          - roles.PolicyCommittee.exclusive_operations
        distinguishing_aspect: |
          The denial is symmetric to the analyst's: the committee that decides
          may not manufacture the reviewed state it decides on, so both
          DisputeAnalyst-exclusive intake actions must be refused while the
          dispute sits in SUBMITTED. Refusing review also means the committee
          cannot reach decide at all without the analyst, which is the
          segregation the role model exists to enforce.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00.000Z."
            - "One donor, one COMMUNICATED cycle-2026 recalculation and one dispute in status SUBMITTED with info_request_rounds 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Pat Policy", email: "pat.policy@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { pcd_id: "$.data.id" }
            - call: "POST /athletics/donors/${pcd_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 1000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { pcr_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${pcr_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations/${pcr_id}/send-communications"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-disputes"
              payload: { donor_id: "${pcd_id}", recalculation_id: "${pcr_id}", claimed_points_delta: 2.00, basis_note: "tenure years look short" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { pcdisp_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/point-disputes/${pcdisp_id}/review"
              payload: {}
              as: PolicyCommittee
              as_user_id: "policy-1"
            - call: "POST /athletics/point-disputes/${pcdisp_id}/request-info"
              payload: { info_note: "please attach the gift receipt" }
              as: PolicyCommittee
              as_user_id: "policy-1"
            - call: "POST /athletics/point-disputes/${pcdisp_id}/review"
              payload: {}
              as: DisputeAnalyst
              as_user_id: "analyst-1"
          assert:
            - "The committee's review returns HTTP 403 with error_id == \"ERR_FORBIDDEN_ROLE\""
            - "The committee's request-info returns HTTP 403 with error_id == \"ERR_FORBIDDEN_ROLE\", NOT ERR_INVALID_STATE — priority 2 precedes priority 9 even though SUBMITTED is not a legal from-state for request-info either"
            - "PointDispute.${pcdisp_id}.status is still \"SUBMITTED\", reviewed_by_user_id is still null and info_request_rounds is still 0"
            - "The analyst's review returns HTTP 200 with status == \"UNDER_REVIEW\""

      - name: donor_cannot_touch_the_platform_admin_inventory_surface
        claim_type: cannot_perform_others_exclusive_operations
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - roles.Donor.shared_operations
        distinguishing_aspect: |
          Donor's §1.7 grant includes reading sections and seats but none of the
          four PlatformAdmin-exclusive writes, so the read/write boundary runs
          straight through the same URL prefix: the donor may GET
          /athletics/sections/{id}/seats and must be refused POST on it. The
          reprice attempt carries a correctly captured expected_section_version,
          so the 403 cannot be confused with an OCC failure.
        test_recipe:
          setup:
            - "One section SEC-D with seat_capacity 4, per_seat_requirement_cents 200000, required_points_per_seat 10.00, holding one seat."
            - "One donor with no gifts, acting under its own id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/sections"
              payload: { section_code: "SEC-D", venue_code: "STADIUM-D", seat_capacity: 4, per_seat_requirement_cents: 200000, required_points_per_seat: 10.00 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { secd_id: "$.data.id", secd_v: "$.data.version" }
            - call: "POST /athletics/sections/${secd_id}/seats"
              payload: { row_label: "D", seat_number: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Ned Nopower", email: "ned.nopower@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { nn_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/sections"
              payload: { section_code: "SEC-X", venue_code: "STADIUM-X", seat_capacity: 1, per_seat_requirement_cents: 100000, required_points_per_seat: 0.00 }
              as: Donor
              as_user_id: "${nn_id}"
            - call: "POST /athletics/sections/${secd_id}/seats"
              payload: { row_label: "D", seat_number: 2 }
              as: Donor
              as_user_id: "${nn_id}"
            - call: "POST /athletics/sections/${secd_id}/reprice"
              payload: { per_seat_requirement_cents: 1, cycle_year: 2026, expected_section_version: "${secd_v}" }
              as: Donor
              as_user_id: "${nn_id}"
            - call: "GET /athletics/sections/${secd_id}/seats"
              payload: {}
              as: Donor
              as_user_id: "${nn_id}"
            - call: "GET /athletics/sections/${secd_id}"
              payload: {}
              as: PlatformAdmin
