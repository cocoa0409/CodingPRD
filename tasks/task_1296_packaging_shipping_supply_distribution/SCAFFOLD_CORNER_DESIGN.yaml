              as: Buyer
              as_user_id: "${acct}"
              captures: { st: $.data.status }
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/ship"
              payload: {}
              as: WarehouseOps
              captures: { st_ship: $.data.status }
            - call: "GET /packaging-distribution/order-lines/${line_a}"
              payload: {}
              as: PlatformAdmin
