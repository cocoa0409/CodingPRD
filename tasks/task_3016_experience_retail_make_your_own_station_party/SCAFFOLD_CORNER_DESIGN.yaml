              captures: { occ_v: $.data.version }
          trigger:
            - call: "POST /parties/${occparty}/reschedule"
              payload: { new_party_start: "2026-10-22T18:00:00Z", expected_party_version: "${occ_v}" }
              as: Customer
              as_user_id: "${occcust}"
            - call: "POST /parties/${occparty}/reschedule"
              payload: { new_party_start: "2026-10-24T18:00:00Z", expected_party_version: "${occ_v}" }
              as: Customer
              as_user_id: "${occcust}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION (second reschedule carries the pre-first-reschedule version)"
