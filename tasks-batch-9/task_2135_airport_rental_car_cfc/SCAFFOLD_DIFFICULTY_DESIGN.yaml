  - rule_id: combinatorial_formula
    instances:

      # ---- MODE (b): nested rounding where the ORDER changes the cents ------
      - name: shuttle_pool_floor_then_largest_remainder_beats_round_then_sum
        grounds:
          - calculations.shuttle_cost_allocation
          - entities.ShuttleCostAllocation.fields.floor_cents
          - entities.ShuttleCostAllocation.fields.remainder_rank
          - entities.ShuttleCostPeriod.fields.allocated_total_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order. Three equal 1,000-day shares of a
          100,000 cent pool each land on an exact 33,333.3333; rounding each line
          half-up and summing yields 99,999 cents (a lost cent), while the pinned
          floor-then-largest-remainder order yields 33,334 / 33,333 / 33,333 and
          reproduces the pool exactly, with the three-way fractional tie broken
          by ConcessionAgreement.created_at ASC.
        test_recipe:
          setup:
            - "One facility; three ACTIVE agreements AVX, BUD, CRZ created in that order."
            - "Each holds an ACCEPTED 2026-03 report with exactly 1,000 audited transaction days and 6,000,000 audited gross revenue cents."
            - "One OPEN ShuttleCostPeriod for 2026-03 with total_cost_cents 100,000 on the TRANSACTION_DAYS basis."
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100, overflow_daily_surcharge_cents: 400, remittance_grace_days: 20 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Rent A Car", brand_code: "AVX", contact_email: "ops@avex.example" }
              as: FacilityAdmin
              captures: { conc_a_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Budline Auto Rental", brand_code: "BUD", contact_email: "ops@budline.example" }
              as: FacilityAdmin
              captures: { conc_b_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Cruzo Cars", brand_code: "CRZ", contact_email: "ops@cruzo.example" }
              as: FacilityAdmin
