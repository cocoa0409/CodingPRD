# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_1989 Community Bike Shop & Earn-a-Bike Program
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: donor_receipt_flat_vs_fmv_diverge
        grounds: [calculations.donation_receipt_value, entities.Donor.fields.receipt_method, "endpoints[GET /donors/{id}/receipt]"]
        distinguishing_aspect: "Donor-domain dual variant: the same three graded bikes (ROAD/B, KIDS/A, BMX/D) yield flat_total_cents 25000 under FLAT_SCHEDULE but fmv_total_cents 8760 under FMV_COMPARABLE — method-selected divergence, structurally distinct from the Sale snapshot variant and the ToolMembership tier variant."
        test_recipe:
          setup:
            - "Donor (FLAT_SCHEDULE) with three bikes created and triaged at the default clock 2026-08-01: ROAD grade B, KIDS grade A, BMX grade D"
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D One", donor_type: "INDIVIDUAL", email: "d1@x.org", receipt_method: "FLAT_SCHEDULE" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-R1", bike_type: "ROAD", wheel_size_inches: 27 }, as: ShopCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /bikes/${b1}/triage", payload: { condition_grade: "B", frame_damage: false }, as: ShopCoordinator }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-K1", bike_type: "KIDS", wheel_size_inches: 20 }, as: ShopCoordinator, captures: { b2: $.data.id } }
            - { call: "POST /bikes/${b2}/triage", payload: { condition_grade: "A", frame_damage: false }, as: ShopCoordinator }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-X1", bike_type: "BMX", wheel_size_inches: 20 }, as: ShopCoordinator, captures: { b3: $.data.id } }
            - { call: "POST /bikes/${b3}/triage", payload: { condition_grade: "D", frame_damage: true }, as: ShopCoordinator }
          trigger:
            - { call: "GET /donors/${d_id}/receipt?year=2026", as: ShopCoordinator, captures: { flat: $.data.flat_total_cents, fmv: $.data.fmv_total_cents, eff: $.data.effective_total_cents, n: $.data.bike_count } }
          assert:
            - "receipt.bike_count == 3"
            - "receipt.flat_total_cents == 25000  (9000 + 15000 + 1000)"
            - "receipt.fmv_total_cents == 8760  (5760 + 2400 + 600)"
            - "receipt.receipt_method == FLAT_SCHEDULE"
            - "receipt.effective_total_cents == 25000"
            - "receipt.flat_total_cents != receipt.fmv_total_cents"

      - name: membership_billing_tier_variants_diverge
        grounds: [calculations.membership_billing, entities.ToolMembership.fields.tier, "endpoints[GET /memberships/{id}/billing]"]
        distinguishing_aspect: "ToolMembership-domain dual variant: 8 identical billable CLOSED sessions in 2026-08 bill 3000 cents to a BASIC (PER_SESSION, cap binds at 3200 > 3000) member but 2500 cents to a PRO (FLAT_MONTHLY) member — tier-selected divergence, distinct from the Donor and Sale variant pairs."
        test_recipe:
          setup:
            - "BASIC and PRO memberships each holding 8 CLOSED sessions on stand 1 on 2026-08-02..09 (BASIC 10:00-11:00, PRO 12:00-13:00); clock advanced to 2026-08-20"
          setup_api_calls:
            - { call: "POST /memberships", payload: { member_name: "M Basic", member_email: "mb@x.org", tier: "BASIC", end_date: "2026-12-31" }, as: ShopCoordinator, captures: { m_basic: $.data.id } }
            - { call: "POST /memberships", payload: { member_name: "M Pro", member_email: "mp@x.org", tier: "PRO", end_date: "2026-12-31" }, as: ShopCoordinator, captures: { m_pro: $.data.id } }
            - { call: "POST /memberships/${m_basic}/sessions", payload: { stand_number: 1, start_time: "2026-08-02T10:00:00Z", end_time: "2026-08-02T11:00:00Z" }, as: Member, as_user_id: "${m_basic}", captures: { sb1: $.data.id } }
            - { call: "POST /memberships/${m_basic}/sessions", payload: { stand_number: 1, start_time: "2026-08-03T10:00:00Z", end_time: "2026-08-03T11:00:00Z" }, as: Member, as_user_id: "${m_basic}", captures: { sb2: $.data.id } }
            - { call: "POST /memberships/${m_basic}/sessions", payload: { stand_number: 1, start_time: "2026-08-04T10:00:00Z", end_time: "2026-08-04T11:00:00Z" }, as: Member, as_user_id: "${m_basic}", captures: { sb3: $.data.id } }
            - { call: "POST /memberships/${m_basic}/sessions", payload: { stand_number: 1, start_time: "2026-08-05T10:00:00Z", end_time: "2026-08-05T11:00:00Z" }, as: Member, as_user_id: "${m_basic}", captures: { sb4: $.data.id } }
            - { call: "POST /memberships/${m_basic}/sessions", payload: { stand_number: 1, start_time: "2026-08-06T10:00:00Z", end_time: "2026-08-06T11:00:00Z" }, as: Member, as_user_id: "${m_basic}", captures: { sb5: $.data.id } }
            - { call: "POST /memberships/${m_basic}/sessions", payload: { stand_number: 1, start_time: "2026-08-07T10:00:00Z", end_time: "2026-08-07T11:00:00Z" }, as: Member, as_user_id: "${m_basic}", captures: { sb6: $.data.id } }
            - { call: "POST /memberships/${m_basic}/sessions", payload: { stand_number: 1, start_time: "2026-08-08T10:00:00Z", end_time: "2026-08-08T11:00:00Z" }, as: Member, as_user_id: "${m_basic}", captures: { sb7: $.data.id } }
            - { call: "POST /memberships/${m_basic}/sessions", payload: { stand_number: 1, start_time: "2026-08-09T10:00:00Z", end_time: "2026-08-09T11:00:00Z" }, as: Member, as_user_id: "${m_basic}", captures: { sb8: $.data.id } }
            - { call: "POST /memberships/${m_pro}/sessions", payload: { stand_number: 1, start_time: "2026-08-02T12:00:00Z", end_time: "2026-08-02T13:00:00Z" }, as: Member, as_user_id: "${m_pro}", captures: { sp1: $.data.id } }
            - { call: "POST /memberships/${m_pro}/sessions", payload: { stand_number: 1, start_time: "2026-08-03T12:00:00Z", end_time: "2026-08-03T13:00:00Z" }, as: Member, as_user_id: "${m_pro}", captures: { sp2: $.data.id } }
            - { call: "POST /memberships/${m_pro}/sessions", payload: { stand_number: 1, start_time: "2026-08-04T12:00:00Z", end_time: "2026-08-04T13:00:00Z" }, as: Member, as_user_id: "${m_pro}", captures: { sp3: $.data.id } }
            - { call: "POST /memberships/${m_pro}/sessions", payload: { stand_number: 1, start_time: "2026-08-05T12:00:00Z", end_time: "2026-08-05T13:00:00Z" }, as: Member, as_user_id: "${m_pro}", captures: { sp4: $.data.id } }
            - { call: "POST /memberships/${m_pro}/sessions", payload: { stand_number: 1, start_time: "2026-08-06T12:00:00Z", end_time: "2026-08-06T13:00:00Z" }, as: Member, as_user_id: "${m_pro}", captures: { sp5: $.data.id } }
            - { call: "POST /memberships/${m_pro}/sessions", payload: { stand_number: 1, start_time: "2026-08-07T12:00:00Z", end_time: "2026-08-07T13:00:00Z" }, as: Member, as_user_id: "${m_pro}", captures: { sp6: $.data.id } }
            - { call: "POST /memberships/${m_pro}/sessions", payload: { stand_number: 1, start_time: "2026-08-08T12:00:00Z", end_time: "2026-08-08T13:00:00Z" }, as: Member, as_user_id: "${m_pro}", captures: { sp7: $.data.id } }
            - { call: "POST /memberships/${m_pro}/sessions", payload: { stand_number: 1, start_time: "2026-08-09T12:00:00Z", end_time: "2026-08-09T13:00:00Z" }, as: Member, as_user_id: "${m_pro}", captures: { sp8: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: ShopCoordinator }
            - { call: "POST /sessions/${sb1}/start", as: Member, as_user_id: "${m_basic}" }
            - { call: "POST /sessions/${sb1}/close", as: Member, as_user_id: "${m_basic}" }
            - { call: "POST /sessions/${sb2}/start", as: Member, as_user_id: "${m_basic}" }
            - { call: "POST /sessions/${sb2}/close", as: Member, as_user_id: "${m_basic}" }
            - { call: "POST /sessions/${sb3}/start", as: Member, as_user_id: "${m_basic}" }
            - { call: "POST /sessions/${sb3}/close", as: Member, as_user_id: "${m_basic}" }
            - { call: "POST /sessions/${sb4}/start", as: Member, as_user_id: "${m_basic}" }
            - { call: "POST /sessions/${sb4}/close", as: Member, as_user_id: "${m_basic}" }
            - { call: "POST /sessions/${sb5}/start", as: Member, as_user_id: "${m_basic}" }
            - { call: "POST /sessions/${sb5}/close", as: Member, as_user_id: "${m_basic}" }
            - { call: "POST /sessions/${sb6}/start", as: Member, as_user_id: "${m_basic}" }
            - { call: "POST /sessions/${sb6}/close", as: Member, as_user_id: "${m_basic}" }
            - { call: "POST /sessions/${sb7}/start", as: Member, as_user_id: "${m_basic}" }
            - { call: "POST /sessions/${sb7}/close", as: Member, as_user_id: "${m_basic}" }
            - { call: "POST /sessions/${sb8}/start", as: Member, as_user_id: "${m_basic}" }
            - { call: "POST /sessions/${sb8}/close", as: Member, as_user_id: "${m_basic}" }
            - { call: "POST /sessions/${sp1}/start", as: Member, as_user_id: "${m_pro}" }
            - { call: "POST /sessions/${sp1}/close", as: Member, as_user_id: "${m_pro}" }
            - { call: "POST /sessions/${sp2}/start", as: Member, as_user_id: "${m_pro}" }
            - { call: "POST /sessions/${sp2}/close", as: Member, as_user_id: "${m_pro}" }
            - { call: "POST /sessions/${sp3}/start", as: Member, as_user_id: "${m_pro}" }
            - { call: "POST /sessions/${sp3}/close", as: Member, as_user_id: "${m_pro}" }
            - { call: "POST /sessions/${sp4}/start", as: Member, as_user_id: "${m_pro}" }
            - { call: "POST /sessions/${sp4}/close", as: Member, as_user_id: "${m_pro}" }
            - { call: "POST /sessions/${sp5}/start", as: Member, as_user_id: "${m_pro}" }
            - { call: "POST /sessions/${sp5}/close", as: Member, as_user_id: "${m_pro}" }
            - { call: "POST /sessions/${sp6}/start", as: Member, as_user_id: "${m_pro}" }
            - { call: "POST /sessions/${sp6}/close", as: Member, as_user_id: "${m_pro}" }
            - { call: "POST /sessions/${sp7}/start", as: Member, as_user_id: "${m_pro}" }
            - { call: "POST /sessions/${sp7}/close", as: Member, as_user_id: "${m_pro}" }
            - { call: "POST /sessions/${sp8}/start", as: Member, as_user_id: "${m_pro}" }
            - { call: "POST /sessions/${sp8}/close", as: Member, as_user_id: "${m_pro}" }
          trigger:
            - { call: "GET /memberships/${m_basic}/billing?month=2026-08", as: ProgramDirector, captures: { amt_b: $.data.amount_cents, cnt_b: $.data.session_count } }
            - { call: "GET /memberships/${m_pro}/billing?month=2026-08", as: ProgramDirector, captures: { amt_p: $.data.amount_cents, cnt_p: $.data.session_count } }
          assert:
            - "billing(BASIC).session_count == 8"
            - "billing(BASIC).tier == BASIC"
            - "billing(BASIC).amount_cents == 3000  (min(8*400, 3000): cap binds)"
            - "billing(PRO).session_count == 8"
            - "billing(PRO).tier == PRO"
            - "billing(PRO).amount_cents == 2500"
            - "billing(BASIC).amount_cents != billing(PRO).amount_cents for identical session data"

      - name: sale_price_quoted_vs_final_on_membership_suspension
        grounds: [calculations.sale_price, entities.Sale.fields.quoted_price_cents, entities.Sale.fields.final_price_cents, state_machines.Sale.PENDING_to_COMPLETED]
        distinguishing_aspect: "Sale-domain snapshot dual variant: QUOTED is frozen at creation (8325, with ACTIVE-member discount) while FINAL is re-evaluated at completion after the buyer's membership was suspended (9250, discount gone) — same formula, same bike, different evaluation instants; distinct from the Donor and ToolMembership variant pairs."
        test_recipe:
          setup:
            - "READY_FOR_DISPOSITION HYBRID grade A bike with parts_cost_cents 500; ACTIVE BASIC membership; PENDING sale referencing the membership (quoted 8325); membership then SUSPENDED; SALE_BUYER helmet distributed"
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D Q", donor_type: "INDIVIDUAL", email: "dq@x.org" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "V Lead", email: "vl@x.org" }, as: ShopCoordinator, captures: { v_lead: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "V Insp", email: "vi@x.org" }, as: ShopCoordinator, captures: { v_insp: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T1", level: "BASIC", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T2", level: "BASIC", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T3", level: "BASIC", scheduled_start: "2026-08-04T10:00:00Z", scheduled_end: "2026-08-04T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s3: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T4", level: "BASIC", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s4: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T5", level: "BASIC", scheduled_start: "2026-08-06T10:00:00Z", scheduled_end: "2026-08-06T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s5: $.data.id } }
            - { call: "POST /training-sessions/${s1}/enroll", payload: { volunteer_id: "${v_lead}" }, as: ShopCoordinator, captures: { la1: $.data.id } }
            - { call: "POST /training-sessions/${s2}/enroll", payload: { volunteer_id: "${v_lead}" }, as: ShopCoordinator, captures: { la2: $.data.id } }
            - { call: "POST /training-sessions/${s1}/enroll", payload: { volunteer_id: "${v_insp}" }, as: ShopCoordinator, captures: { ia1: $.data.id } }
            - { call: "POST /training-sessions/${s2}/enroll", payload: { volunteer_id: "${v_insp}" }, as: ShopCoordinator, captures: { ia2: $.data.id } }
            - { call: "POST /training-sessions/${s3}/enroll", payload: { volunteer_id: "${v_insp}" }, as: ShopCoordinator, captures: { ia3: $.data.id } }
            - { call: "POST /training-sessions/${s4}/enroll", payload: { volunteer_id: "${v_insp}" }, as: ShopCoordinator, captures: { ia4: $.data.id } }
            - { call: "POST /training-sessions/${s5}/enroll", payload: { volunteer_id: "${v_insp}" }, as: ShopCoordinator, captures: { ia5: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s1}/complete", payload: { marks: [ { attendance_id: "${la1}", outcome: "ATTENDED" }, { attendance_id: "${ia1}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s2}/complete", payload: { marks: [ { attendance_id: "${la2}", outcome: "ATTENDED" }, { attendance_id: "${ia2}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s3}/complete", payload: { marks: [ { attendance_id: "${ia3}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s4}/complete", payload: { marks: [ { attendance_id: "${ia4}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s5}/complete", payload: { marks: [ { attendance_id: "${ia5}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /volunteers/${v_lead}/promote", as: ProgramDirector }
            - { call: "POST /volunteers/${v_insp}/promote", as: ProgramDirector }
            - { call: "POST /volunteers/${v_insp}/promote", as: ProgramDirector }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-H1", bike_type: "HYBRID", wheel_size_inches: 28 }, as: ShopCoordinator, captures: { bk: $.data.id } }
            - { call: "POST /bikes/${bk}/triage", payload: { condition_grade: "A", frame_damage: false }, as: ShopCoordinator }
            - { call: "POST /bikes/${bk}/route", payload: { destination: "REFURBISH", refurb_lead_volunteer_id: "${v_lead}" }, as: ShopCoordinator }
            - { call: "POST /parts", payload: { name: "Brake cable", category: "BRAKES", unit_cost_cents: 500 }, as: ShopCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /parts/${pt}/restock", payload: { quantity: 10 }, as: ShopCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /bikes/${bk}/usage-logs", payload: { part_id: "${pt}", quantity: 1, expected_part_version: "${pt_v}" }, as: Volunteer, as_user_id: "${v_lead}" }
            - { call: "POST /bikes/${bk}/submit-safety", as: Volunteer, as_user_id: "${v_lead}" }
            - { call: "POST /bikes/${bk}/safety-inspections", payload: { result: "PASS", checklist: { brakes: true, steering: true, tires: true, drivetrain: true, reflectors: true } }, as: Volunteer, as_user_id: "${v_insp}" }
            - { call: "POST /memberships", payload: { member_name: "M Buyer", member_email: "mb2@x.org", tier: "BASIC", end_date: "2026-12-31" }, as: ShopCoordinator, captures: { m_id: $.data.id } }
            - { call: "POST /sales", payload: { bike_id: "${bk}", buyer_name: "B One", buyer_email: "b1@x.org", buyer_membership_id: "${m_id}" }, as: ShopCoordinator, captures: { sl: $.data.id, quoted: $.data.quoted_price_cents } }
            - { call: "POST /memberships/${m_id}/suspend", payload: { reason: "non-payment" }, as: ShopCoordinator }
            - { call: "POST /parts", payload: { name: "Helmet M", category: "HELMET", helmet_size: "M", unit_cost_cents: 1500 }, as: ShopCoordinator, captures: { hp: $.data.id } }
            - { call: "POST /parts/${hp}/restock", payload: { quantity: 3 }, as: ShopCoordinator }
            - { call: "POST /helmet-distributions", payload: { helmet_part_id: "${hp}", recipient_kind: "SALE_BUYER", sale_id: "${sl}" }, as: ShopCoordinator }
          trigger:
            - { call: "POST /sales/${sl}/complete", payload: { payment_method: "CASH" }, as: ShopCoordinator, captures: { fin: $.data.final_price_cents, gt: $.data.grand_total_cents, don: $.data.donation_cents } }
          assert:
            - "Sale.${sl}.quoted_price_cents == 8325  (9000 + min(round(500*0.5),3000)=250 -> 9250; member discount 925 -> 8325)"
            - "Sale.${sl}.final_price_cents == 9250  (membership SUSPENDED at completion: no discount)"
            - "Sale.${sl}.final_price_cents != Sale.${sl}.quoted_price_cents"
            - "Sale.${sl}.grand_total_cents == 9250"
            - "Sale.${sl}.donation_cents == 0"
            - "Sale.${sl}.status == COMPLETED"
            - "DonatedBike.${bk}.status == SOLD"
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: sale_price_tiered_engine_mode_a
        grounds: [calculations.sale_price, entities.DonatedBike.fields.parts_cost_cents, "endpoints[POST /sales]"]
        distinguishing_aspect: "Mode (a) combinatorial: 4 inputs (bike_type tier, condition multiplier, parts-cost surcharge with nested min/cap, floor via max) interact non-linearly — MTB/C with parts_cost 8000 quotes 7800 (surcharge cap 3000 binds over raw 4000), KIDS/C with parts_cost 100 quotes 2000 (floor binds over 1650)."
        test_recipe:
          setup:
            - "Two READY_FOR_DISPOSITION bikes at default clock: MTB grade C with parts_cost_cents 8000 (unit 2000 x 4), KIDS grade C with parts_cost_cents 100 (unit 100 x 1); APPRENTICE lead + JOURNEYMAN inspector"
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D P", donor_type: "INDIVIDUAL", email: "dp@x.org" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "V Lead", email: "vl@x.org" }, as: ShopCoordinator, captures: { v_lead: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "V Insp", email: "vi@x.org" }, as: ShopCoordinator, captures: { v_insp: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T1", level: "BASIC", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T2", level: "BASIC", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T3", level: "BASIC", scheduled_start: "2026-08-04T10:00:00Z", scheduled_end: "2026-08-04T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s3: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T4", level: "BASIC", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s4: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T5", level: "BASIC", scheduled_start: "2026-08-06T10:00:00Z", scheduled_end: "2026-08-06T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s5: $.data.id } }
            - { call: "POST /training-sessions/${s1}/enroll", payload: { volunteer_id: "${v_lead}" }, as: ShopCoordinator, captures: { la1: $.data.id } }
            - { call: "POST /training-sessions/${s2}/enroll", payload: { volunteer_id: "${v_lead}" }, as: ShopCoordinator, captures: { la2: $.data.id } }
