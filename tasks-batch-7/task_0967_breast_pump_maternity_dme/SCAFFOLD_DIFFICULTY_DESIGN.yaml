        distinguishing_aspect: |
          Cyclic shape on PriorAuthorization (different entity than PumpOrder): the machine
          loops SUBMITTED -> PENDED -> SUBMITTED (submission_count 2) and then
          DENIED -> APPEALED -> APPROVED, all reachable through declared endpoints.
