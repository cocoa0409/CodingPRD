              as: SafetyOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /safety/cases/${case_id}/classify"
              payload: { classification: "JOB_TRANSFER_RESTRICTION", expected_case_version: "${case_v}" }
              as: SafetyOfficer
            - call: "POST /safety/cases/${case_id}/day-entries"
              payload: { day_type: "RESTRICTED", start_date: "2026-08-10", end_date: "2026-08-30" }
              as: SafetyOfficer
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /safety/cases/${case_id}"
              payload: {}
              as: SafetyOfficer
              captures: { rec_restricted: $.data.restricted_days_count, proj_restricted: $.data.projected_restricted_days_count, day_closed: $.data.day_count_closed }
            - call: "GET /safety/cases/${case_id}/day-entries"
              payload: {}
              as: SafetyOfficer
              captures: { entry_span: "$.data[0].calendar_days" }
          assert:
            - "case.restricted_days_count == 21 (RECORDED variant: full span 2026-08-10..2026-08-30)"
            - "case.projected_restricted_days_count == 11 (PROJECTED_FINAL: 2026-08-10..2026-08-20 inclusive, clock-truncated)"
            - "CaseDayCountEntry[0].calendar_days == 21"
            - "case.day_count_closed == false"
            - "recorded 21 != projected 11 for identical stored entry — variant divergence on IncidentCase domain"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_weighted_multi_input_threshold
        grounds:
          - calculations.establishment_risk_score
          - entities.Establishment.fields.posture
          - state_machines.CorrectiveAction.OPEN_to_OVERDUE
        distinguishing_aspect: |
          Mode (a) — weighted formula with >=3 inputs and non-linear threshold
          interaction: risk_score = 2.0*live_trir + 3.0*live_dart +
          5.0*overdue_CA + 8.0*overdue_citation + 10.0*late_severe. With zero
          current-year hours the rate terms collapse to 0.0; 4 overdue
          corrective actions give 20.0 (posture CLEAR) and exactly 5 give 25.0,
          which trips WATCH at the INCLUSIVE >= boundary — this instance parks
          at 20.0/CLEAR while its sibling corner instance pins the 25.0/WATCH
          crossing.
        test_recipe:
          setup:
            - "Company C, Establishment E (non-exempt), Employee W"
            - "5 OPEN corrective actions on E due 2026-08-10 (created at clock 2026-08-05); ca_1 cancelled before sweep"
            - "No hour logs for 2026 -> live rates count as 0.0 in the risk formula"
            - "Clock advanced to 2026-08-11 -> 4 remaining sweep to OVERDUE"
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Gamma Inc", fein: "55-1212121" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Foundry", naics_code: "331511", state_code: "PA", size_class: "LARGE" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "Worker Three", job_title: "Caster", hire_date: "2023-06-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-08-04T10:00:00Z", description: "Burn", body_part: "forearm", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /safety/cases/${case_id}/classify"
              payload: { classification: "MEDICAL_TREATMENT", expected_case_version: "${case_v}" }
              as: SafetyOfficer
            - call: "POST /safety/corrective-actions"
              payload: { establishment_id: "${est_id}", case_id: "${case_id}", description: "Guard repair 1", assigned_to: "op-fix-1", due_date: "2026-08-10", priority: "HIGH" }
              as: SafetyOfficer
              captures: { ca_1: $.data.id }
            - call: "POST /safety/corrective-actions"
              payload: { establishment_id: "${est_id}", case_id: "${case_id}", description: "Guard repair 2", assigned_to: "op-fix-1", due_date: "2026-08-10", priority: "HIGH" }
              as: SafetyOfficer
              captures: { ca_2: $.data.id }
            - call: "POST /safety/corrective-actions"
              payload: { establishment_id: "${est_id}", case_id: "${case_id}", description: "Guard repair 3", assigned_to: "op-fix-1", due_date: "2026-08-10", priority: "HIGH" }
              as: SafetyOfficer
              captures: { ca_3: $.data.id }
            - call: "POST /safety/corrective-actions"
              payload: { establishment_id: "${est_id}", case_id: "${case_id}", description: "Guard repair 4", assigned_to: "op-fix-1", due_date: "2026-08-10", priority: "HIGH" }
              as: SafetyOfficer
              captures: { ca_4: $.data.id }
            - call: "POST /safety/corrective-actions"
              payload: { establishment_id: "${est_id}", case_id: "${case_id}", description: "Guard repair 5", assigned_to: "op-fix-1", due_date: "2026-08-10", priority: "HIGH" }
              as: SafetyOfficer
              captures: { ca_5: $.data.id }
            - call: "POST /safety/corrective-actions/${ca_1}/cancel"
              payload: {}
              as: SafetyOfficer
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /safety/establishments/${est_id}"
              payload: {}
              as: SafetyOfficer
              captures: { est_posture: $.data.posture, est_risk: $.data.risk_score }
          assert:
            - "exactly 4 corrective actions OVERDUE (ca_1 CANCELLED pre-sweep)"
            - "establishment.risk_score == 20.0 (5.0 x 4 overdue CAs; rate terms 0.0)"
            - "establishment.posture == CLEAR (20.0 < 25, inclusive >= boundary not yet met)"

      - name: summary_rollup_cap_then_sum_rounding_order
        grounds:
          - calculations.summary_rollup
          - calculations.day_count_rollup
          - entities.AnnualSummary.fields.total_days_away
        distinguishing_aspect: |
          Mode (b) — pinned aggregation order (distinct mode from the weighted
          formula): each case's combined day count is capped at 180 BEFORE
          summing into 300A totals, with days-away precedence inside the cap.
          Case A (5 away + 200 restricted) caps to (180, 0); case B (10 + 20)
          stays (10, 20). Summary totals: days_away == 190, restricted == 20.
          Sum-then-cap would give 180 total days — the pinned order forbids it.
        test_recipe:
          setup:
            - "Company C, Establishment E (non-exempt), Employee W"
            - "Case A: DAYS_AWAY with entries 5 away + 200 restricted (occurred 2026-02-10)"
            - "Case B: DAYS_AWAY with entries 10 away + 20 restricted (occurred 2026-06-01)"
            - "12 APPROVED hour logs (E, 2026, 5000h each; employment 10 x 5 months then 11 x 7 months)"
            - "Summary S prepared"
