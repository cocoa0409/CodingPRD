  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: withdrawn_application_acceptance_reports_state_error_over_funding_error
        grounds:
          - validations[priority=12]
          - validations[priority=27]
          - state_machines.Application.OFFER_ISSUED_to_WITHDRAWN
          - state_machines.FundingCommitment.RESERVED_to_RELEASED
          - endpoints[POST /applications/{id}/acceptance]
          - errors.ERR_INVALID_APPLICATION_STATE
          - errors.ERR_FUNDING_PLAN_INCOMPLETE
        distinguishing_aspect: |
          Both violations carry HTTP 409, so the pair cannot be told apart by status code —
          only by error_id. Withdrawing an application after its funding plan was assembled
          releases the commitments, and that single write breaks both the priority-12 state guard
          (status is WITHDRAWN, not OFFER_ISSUED or COUNTERED) and the priority-27 fiscal
          guard (funding_plan_status is RELEASED, not FUNDED). The ladder must surface
          priority 12's ERR_INVALID_APPLICATION_STATE; an implementation that validates money
          before lifecycle returns ERR_FUNDING_PLAN_INCOMPLETE and looks equally plausible.
        test_recipe:
          setup:
            - "Application AP1 is RANKED, offered at 175,550,000 BARGAIN_SALE, and its funding plan is assembled at clock 2026-10-05 (funding_plan_status FUNDED, three RESERVED commitments)."
            - "At clock 2026-10-12 the landowner withdraws AP1, so status becomes WITHDRAWN, funding_plan_status becomes RELEASED, all three commitments become RELEASED, and Parcel PA1 returns to ELIGIBLE."
          setup_api_calls:
            - *c_prog1
            - *c_src_local
            - *c_src_state
            - *c_src_fed
            - *c_round1
            - *c_round1_open
            - *c_lo_a
            - *c_clk_0810
            - *c_parcel_a
            - *c_app_a
            - *c_appraisal_a
            - *c_clk_0820
            - *c_appr_submit_a
            - *c_appr_certify_a
            - *c_clk_1001
            - *c_rank_receipt_r1
            - *c_clk_1005
            - *c_get_app_a_v1
            - *c_offer_a
            - *c_get_app_a_v2
            - *c_plan_a
            - *c_clk_1012
            - call: "POST /applications/${app_a_id}/withdrawal"
              payload: { withdrawal_reason: "landowner electing to defer to a later cycle" }
              as: Landowner
              as_user_id: "${lo_a_id}"
          trigger:
            - call: "POST /applications/${app_a_id}/acceptance"
              payload: {}
              as: Landowner
              as_user_id: "${lo_a_id}"
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_INVALID_APPLICATION_STATE"
            - "the trigger response error_id != ERR_FUNDING_PLAN_INCOMPLETE"
            - "Application.${app_a_id}.status == WITHDRAWN (unchanged by the rejected call)"
            - "Application.${app_a_id}.funding_plan_status == RELEASED"
            - "Application.${app_a_id}.withdrawal_reason == landowner electing to defer to a later cycle"
            - "GET /funding-commitments?application_id=${app_a_id} returns total_count == 3 and every row has status RELEASED"
            - "FundingSource.${src_local_id}.reserved_cents == 0 and FundingSource.${src_state_id}.reserved_cents == 0 and FundingSource.${src_fed_id}.reserved_cents == 0"
            - "Parcel.${parcel_a_id}.status == ELIGIBLE"
            - "priority 12 (state) precedes priority 27 (business_fiscal) and both conditions held at trigger time"

      - name: closing_requirement_review_reports_segregation_of_duties_over_title_exception_error
        grounds:
          - validations[priority=16]
          - validations[priority=23]
          - roles.ProgramAdmin.exclusive_operations
          - entities.ClosingRequirement.fields.submitted_by_user_id
          - entities.ClosingRequirement.fields.exception_count
          - endpoints[POST /closing-requirements/{id}/review]
          - errors.ERR_CLOSING_REVIEW_SOD
          - errors.ERR_TITLE_EXCEPTIONS_OUTSTANDING
        distinguishing_aspect: |
          A cross-category pair with DIFFERENT status codes, so the failure mode is a wrong
          403-vs-409 contract rather than a wrong string. The title commitment was submitted
          by officer-1 carrying exception_count 2; reviewing it while presenting X-User-ID
          officer-1 violates the priority-16 segregation-of-duties rule AND the priority-23
          clear-title rule at once. The correct answer is 403 ERR_CLOSING_REVIEW_SOD, and the
          second trigger call proves the priority-23 rule is genuinely armed: the identical
          review by admin-1 returns 409 ERR_TITLE_EXCEPTIONS_OUTSTANDING.
        test_recipe:
          setup:
            - "Application AP1 has been accepted at clock 2026-10-12, so three OUTSTANDING ClosingRequirement rows exist and requirement_total == 3."
            - "The TITLE_COMMITMENT requirement is submitted by officer-1 with exception_count 2, so it is SUBMITTED and carries submitted_by_user_id officer-1."
          setup_api_calls:
            - *c_prog1
            - *c_src_local
            - *c_src_state
            - *c_src_fed
            - *c_round1
            - *c_round1_open
            - *c_lo_a
            - *c_clk_0810
            - *c_parcel_a
            - *c_app_a
            - *c_appraisal_a
            - *c_clk_0820
            - *c_appr_submit_a
            - *c_appr_certify_a
            - *c_clk_1001
            - *c_rank_receipt_r1
            - *c_clk_1005
            - *c_get_app_a_v1
            - *c_offer_a
            - *c_get_app_a_v2
            - *c_plan_a
            - *c_clk_1012
            - *c_accept_a
            - *c_get_req_title
            - call: "POST /closing-requirements/${req_title_id}/submission"
              payload: { exception_count: 2 }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /closing-requirements/${req_title_id}/review"
              payload: { decision: "ACCEPT" }
              as: ProgramAdmin
              as_user_id: "officer-1"
            - call: "POST /closing-requirements/${req_title_id}/review"
              payload: { decision: "ACCEPT" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the first trigger call returns HTTP 403 with error_id ERR_CLOSING_REVIEW_SOD"
            - "the first trigger response error_id != ERR_TITLE_EXCEPTIONS_OUTSTANDING"
            - "the second trigger call returns HTTP 409 with error_id ERR_TITLE_EXCEPTIONS_OUTSTANDING"
            - "ClosingRequirement.${req_title_id}.status == SUBMITTED after both rejected calls"
            - "ClosingRequirement.${req_title_id}.submitted_by_user_id == officer-1 and reviewed_by_user_id is null"
            - "ClosingRequirement.${req_title_id}.exception_count == 2"
            - "Application.${app_a_id}.requirement_satisfied_count == 0 and requirement_total == 3"
            - "Application.${app_a_id}.closing_status == PENDING_REQUIREMENTS"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: composite_score_sixty_exact_ranks_while_fifty_nine_ninety_nine_is_not_selected
        grounds:
          - calculations.application_composite_score
          - calculations.parcel_soil_quality_score
          - calculations.parcel_development_pressure_score
          - entities.PreservationProgram.fields.min_composite_score
          - entities.Application.fields.composite_score
          - entities.Application.fields.rank_position
          - endpoints[POST /funding-rounds/{id}/rank]
        distinguishing_aspect: |
          Two parcels differ only in contiguous_preserved_acres, 90.00 versus 89.90 out of
          200.00 acres. That 0.10-acre gap moves the contiguity sub-score 45.00 -> 44.95 and
          the weighted composite 60.0000 -> 59.9875, which must round HALF-UP at two decimals
          to 59.99 and therefore fall strictly below min_composite_score 60.00. Rounding to
          one decimal (60.0), rounding half-up at the comparison instead of at storage, or
          using a >= tolerance all flip parcel PC from NOT_SELECTED to RANKED while leaving
          every other application in the round untouched.
        test_recipe:
          setup:
            - "Program P1 with min_composite_score 60.00 and weights soil 0.35, size 0.15, contiguity 0.25, pressure 0.25; round R1 OPEN with closes_on 2026-09-30."
            - "Landowner owns Parcel PA1 (composite 73.40), Parcel PB (200.00 acres, 160.00 prime, 0.00 statewide-important, 90.00 contiguous, 150 ft frontage, no sewer, 5.0-acre zoning) and Parcel PC (identical to PB except 89.90 contiguous)."
            - "Applications AP1, APB and APC are filed in that order at clock 2026-08-10. The clock is advanced to 2026-10-01, after the round closes."
          setup_api_calls:
            - *c_prog1
            - *c_src_local
            - *c_src_state
            - *c_src_fed
            - *c_round1
            - *c_round1_open
            - *c_lo_a
            - *c_clk_0810
            - *c_parcel_a
            - *c_app_a
            - call: "POST /parcels"
              payload: { landowner_id: "${lo_a_id}", county: "Lancaster", acres: 200.00, prime_soil_acres: 160.00, statewide_important_soil_acres: 0.00, contiguous_preserved_acres: 90.00, road_frontage_feet: 150, sewer_available: false, zoning_min_lot_acres: 5.0, baseline_dwelling_rights: 5, unrestricted_value_cents: 300000000, restricted_value_cents: 150000000 }
              as: Landowner
              as_user_id: "${lo_a_id}"
              captures: { parcel_b_id: $.data.id }
            - call: "POST /applications"
              payload: { funding_round_id: "${round1_id}", parcel_id: "${parcel_b_id}", landowner_id: "${lo_a_id}", requested_price_cents: 140000000 }
              as: Landowner
              as_user_id: "${lo_a_id}"
              captures: { app_b_id: $.data.id }
            - call: "POST /parcels"
              payload: { landowner_id: "${lo_a_id}", county: "Lancaster", acres: 200.00, prime_soil_acres: 160.00, statewide_important_soil_acres: 0.00, contiguous_preserved_acres: 89.90, road_frontage_feet: 150, sewer_available: false, zoning_min_lot_acres: 5.0, baseline_dwelling_rights: 5, unrestricted_value_cents: 300000000, restricted_value_cents: 150000000 }
              as: Landowner
              as_user_id: "${lo_a_id}"
              captures: { parcel_c_id: $.data.id }
            - call: "POST /applications"
              payload: { funding_round_id: "${round1_id}", parcel_id: "${parcel_c_id}", landowner_id: "${lo_a_id}", requested_price_cents: 140000000 }
              as: Landowner
              as_user_id: "${lo_a_id}"
              captures: { app_c_id: $.data.id }
            - *c_clk_1001
          trigger:
            - call: "POST /funding-rounds/${round1_id}/rank"
              payload: { score_basis: "RECEIPT_BASIS" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "Parcel.${parcel_b_id}.soil_quality_score == 80.00 and development_pressure_score == 23.00"
            - "Parcel.${parcel_c_id}.soil_quality_score == 80.00 and development_pressure_score == 23.00"
            - "Application.${app_b_id}.composite_score == 60.00"
            - "Application.${app_c_id}.composite_score == 59.99"
            - "Application.${app_b_id}.status == RANKED"
            - "Application.${app_c_id}.status == NOT_SELECTED"
            - "Application.${app_a_id}.composite_score == 73.40 and status == RANKED"
            - "Application.${app_a_id}.rank_position == 1, Application.${app_b_id}.rank_position == 2, Application.${app_c_id}.rank_position == 3"
            - "the trigger response ranked_count == 3, selected_count == 2, not_selected_count == 1"
            - "FundingRound.${round1_id}.status == SELECTED, application_count == 3, selected_count == 2, ranked_at == 2026-10-01T00:00:00Z"
            - "Application.${app_c_id}.composite_score != 60.00 (the value produced by rounding 59.9875 to one decimal or by a tolerance-based comparison)"

      - name: impervious_exceedance_at_allowance_exactly_passes_one_sqft_over_opens_violation
        grounds:
          - calculations.impervious_allowance_and_exceedance
          - calculations.violation_severity_and_cure_deadline
          - entities.Easement.fields.impervious_allowance_sqft
          - entities.MonitoringVisit.fields.finding
          - state_machines.Easement.compliance_status
          - endpoints[POST /monitoring-visits/{id}/completion]
        distinguishing_aspect: |
          The allowance is exactly 160.00 * 43,560 * 0.02 == 139,392 sqft with no rounding
          slack. An observation of 139,392 is AT the allowance and must record finding
          NO_ISSUE with the easement staying COMPLIANT; 139,393 is one square foot over and
          must open an IMPERVIOUS_EXCEEDANCE violation with excess_sqft 1, which is a MINOR
          severity because 1 <= 2,000, and therefore a 180-day cure window rather than 90.
          A `>=` comparison, or truncating the allowance to whole acres, or treating any
          nonzero excess as MAJOR each break exactly one of these three observations.
        test_recipe:
          setup:
            - "Easement EA1 exists from the 2026-12-15 closing of AP1 with protected_acres 160.00 and impervious_allowance_sqft 139,392, compliance_status COMPLIANT."
            - "Two non-overlapping monitoring visits are scheduled on EA1: V1 over the half-open window 2027-06-01 .. 2027-06-08 and V2 over 2027-06-08 .. 2027-06-15."
          setup_api_calls:
