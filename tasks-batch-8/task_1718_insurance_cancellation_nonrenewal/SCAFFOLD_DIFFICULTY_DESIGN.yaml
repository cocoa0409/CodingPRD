              as: ComplianceOfficer
              captures: { prof_ne: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_ne}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Ne Insured", mailing_address: "1 Ne St", email: "ne@x.com" }
              as: Underwriter
              captures: { ph_ne: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ne}", state_profile_id: "${prof_ne}", policy_number: "P-NE-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 30000 }
              as: Underwriter
              captures: { pol_ne: $.data.id, pol_ne_v: $.data.version }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_ne}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_ne_v}" }
              as: Underwriter
              captures: { case_ne1: $.data.id }
            - call: "GET /carrier/policies/${pol_ne}"
              payload: {}
              as: ComplianceOfficer
              captures: { pol_ne_v2: $.data.version }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_ne}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_ne_v2}" }
              as: Underwriter
              captures: { err_ne: $.data.error_id }
            - call: "POST /carrier/cancellation-cases/${case_ne1}/withdraw"
              payload: {}
              as: Underwriter
            - call: "GET /carrier/policies/${pol_ne}"
              payload: {}
              as: ComplianceOfficer
              captures: { pol_ne_v3: $.data.version }
          trigger:
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_ne}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_ne_v3}" }
              as: Underwriter
              captures: { case_ne2: $.data.id }
          assert:
            - "Second create while first open: error_id == ERR_CANCELLATION_ALREADY_OPEN with http 409"
            - "After withdraw (terminal), third create succeeds: CancellationCase.${case_ne2}.status == PENDING_APPROVAL"
            - "At most one non-terminal CancellationCase exists for policy ${pol_ne} at any time (list by policy_id ${pol_ne} status PENDING_APPROVAL has length 1)"

      - name: state_profile_activation_overlap_on_same_state_code
        grounds:
          - state_machines.StateFilingProfile.DRAFT_to_ACTIVE
          - errors[ERR_STATE_PROFILE_CONFLICT]
          - entities.StateFilingProfile.fields.state_code
        distinguishing_aspect: |
          Interval semantics = ACTIVE-status uniqueness over the state_code dimension on
          the StateFilingProfile resource (distinct entity and distinct semantics from
          case-occupation: here the 'interval' is the unbounded ACTIVE lifetime, and the
          collision test is equality on state_code, not set-membership on a policy):
          activating a second profile with the same state_code while the first is ACTIVE
          is rejected ERR_STATE_PROFILE_CONFLICT; after the first is RETIRED (its ACTIVE
          lifetime closed), the second activation succeeds.
        test_recipe:
          setup:
            - "IA profile #1 ACTIVE for state_code IA; IA profile #2 in DRAFT"
            - "No policies reference IA profile #1 (so it can be retired)"
          setup_api_calls:
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "IA", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_ia1: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_ia1}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "IA", permissible_grounds: ["NONPAYMENT", "LICENSE_SUSPENSION"], nonpayment_notice_days: 15, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 75, short_rate_penalty_pct: 0.0, reinstatement_window_days: 30, max_reinstatements: 1, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_ia2: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_ia2}/activate"
              payload: {}
              as: ComplianceOfficer
              captures: { err_ia: $.data.error_id }
            - call: "POST /carrier/state-profiles/${prof_ia1}/retire"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /carrier/state-profiles/${prof_ia2}/activate"
              payload: {}
              as: ComplianceOfficer
              captures: { prof_ia2_status: $.data.status }
          assert:
            - "First activation of #2 error_id == ERR_STATE_PROFILE_CONFLICT with http 409 (ACTIVE lifetime overlaps on state_code)"
            - "After #1 RETIRED, #2 activates: captured status == ACTIVE"
            - "GET /carrier/state-profiles?state_code=IA&status=ACTIVE returns exactly one row (${prof_ia2})"

  # ------------------------------------------------------------------
  # Rule 9 — compensating_invariant: two invariants over DIFFERENT conserved quantities
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: rescinded_cancellation_preserves_premium_ledger_sum
        grounds:
          - state_machines.CancellationCase.NOTICE_SENT_to_RESCINDED
          - entities.PremiumLedgerEntry.fields.amount_cents
          - calculations.return_premium
        distinguishing_aspect: |
          Conserved quantity = policy premium ledger sum. Forward action: approve +
          dispatch (no ledger mutation yet) — the invariant is that a cancellation
          rescinded BEFORE effectiveness posts zero RETURN_* entries: sum(amount_cents)
          over PremiumLedgerEntry equals total_premium_cents (only the WRITTEN entry);
          contrast with the EFFECTIVE path which posts -22300-style entries. Rescission
          before effectiveness is the compensating action that leaves the ledger untouched.
        test_recipe:
          setup:
            - "ACTIVE SC profile; ACTIVE SC policy premium 36500 term 2026-01-01..2027-01-01"
            - "NONPAYMENT case approved scheduled 2026-08-20, notices dispatched 2026-08-01; clock 2026-08-10 (before effectiveness)"
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "SC", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_sc: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_sc}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Sc Insured", mailing_address: "1 Sc St", email: "sc@x.com" }
              as: Underwriter
              captures: { ph_sc: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_sc}", state_profile_id: "${prof_sc}", policy_number: "P-SC-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 36500 }
              as: Underwriter
              captures: { pol_sc: $.data.id, pol_sc_v: $.data.version }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_sc}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_sc_v}" }
              as: Underwriter
              captures: { case_sc: $.data.id }
            - call: "POST /carrier/cancellation-cases/${case_sc}/approve"
              payload: { scheduled_effective_date: "2026-08-20" }
              as: ComplianceOfficer
            - call: "POST /carrier/cancellation-cases/${case_sc}/dispatch-notices"
              payload: { notices: [ { recipient_kind: "POLICYHOLDER", mailed_on_date: "2026-08-01", tracking_code: "T-SC-1" } ] }
              as: Underwriter
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /carrier/cancellation-cases/${case_sc}/rescind"
              payload: { reason: "Insured paid in full" }
              as: ComplianceOfficer
            - call: "GET /carrier/policies/${pol_sc}/ledger-entries"
              payload: {}
              as: ComplianceOfficer
              captures: { ledger_sc: $.data }
          assert:
            - "CancellationCase.${case_sc}.status == RESCINDED and Policy.${pol_sc}.status == ACTIVE"
            - "sum(amount_cents) over PremiumLedgerEntry for ${pol_sc} == 36500 (only WRITTEN entry; invariant: rescission-before-effectiveness posts no RETURN_* entries)"
            - "No ledger entry with entry_kind IN {RETURN_PRO_RATA, RETURN_SHORT_RATE} exists for ${pol_sc}"

      - name: overturned_appeal_restores_reinstatement_slot_count
        grounds:
          - state_machines.AppealCase.UNDER_REVIEW_to_OVERTURNED
          - entities.Policy.fields.reinstatements_used
          - calculations.nonrenewal_volume
        distinguishing_aspect: |
          Conserved quantity = reinstatement-slot budget (distinct conserved quantity from
          the premium ledger sum): forward action cancellation + reinstatement approval
          consumes a slot (reinstatements_used = 1); a subsequent cancellation followed by
          an OVERTURNED appeal restores coverage WITHOUT consuming another slot —
          reinstatements_used stays 1 and Policy returns ACTIVE, while the report's
          rescinded_count increments to balance cancellation_count.
        test_recipe:
          setup:
            - "ACTIVE VT profile (max_reinstatements 2, window 60, grounds [NONPAYMENT], nonpayment 10, other 30, mortgagee 45, nonrenewal 60, short_rate 0.0)"
            - "ACTIVE VT policy premium 36500 term 2026-01-01..2027-01-01"
            - "First cancellation effective 2026-08-15; reinstatement approved 2026-08-16 (used=1); second cancellation effective 2026-09-01; appeal UNDER_REVIEW at clock 2026-09-05"
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "VT", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 60, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_vt: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_vt}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Vt Insured", mailing_address: "1 Vt St", email: "vt@x.com" }
              as: Underwriter
              captures: { ph_vt: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_vt}", state_profile_id: "${prof_vt}", policy_number: "P-VT-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 36500 }
              as: Underwriter
              captures: { pol_vt: $.data.id, pol_vt_v: $.data.version }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_vt}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_vt_v}" }
              as: Underwriter
              captures: { case_vt1: $.data.id }
            - call: "POST /carrier/cancellation-cases/${case_vt1}/approve"
              payload: { scheduled_effective_date: "2026-08-15" }
              as: ComplianceOfficer
            - call: "POST /carrier/cancellation-cases/${case_vt1}/dispatch-notices"
              payload: { notices: [ { recipient_kind: "POLICYHOLDER", mailed_on_date: "2026-08-01", tracking_code: "T-VT-1" } ] }
              as: Underwriter
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /carrier/policies/${pol_vt}"
              payload: {}
              as: ComplianceOfficer
              captures: { pol_vt_v2: $.data.version }
            - call: "POST /carrier/reinstatement-requests"
              payload: { policy_id: "${pol_vt}", cancellation_case_id: "${case_vt1}", expected_policy_version: "${pol_vt_v2}" }
              as: Policyholder
              as_user_id: "${ph_vt}"
              captures: { rr_vt: $.data.id }
            - call: "POST /carrier/reinstatement-requests/${rr_vt}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /carrier/policies/${pol_vt}"
              payload: {}
              as: ComplianceOfficer
              captures: { pol_vt_v3: $.data.version, pol_vt_used_mid: $.data.reinstatements_used }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_vt}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_vt_v3}" }
              as: Underwriter
              captures: { case_vt2: $.data.id }
            - call: "POST /carrier/cancellation-cases/${case_vt2}/approve"
              payload: { scheduled_effective_date: "2026-09-01" }
              as: ComplianceOfficer
            - call: "POST /carrier/cancellation-cases/${case_vt2}/dispatch-notices"
              payload: { notices: [ { recipient_kind: "POLICYHOLDER", mailed_on_date: "2026-08-16", tracking_code: "T-VT-2" } ] }
              as: Underwriter
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/appeals"
              payload: { cancellation_case_id: "${case_vt2}", filed_by: "POLICYHOLDER", grounds_text: "Duplicate autopay charge" }
              as: Policyholder
              as_user_id: "${ph_vt}"
              captures: { appeal_vt: $.data.id }
            - call: "POST /carrier/appeals/${appeal_vt}/accept-for-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-vt-a"
          trigger:
            - call: "POST /carrier/appeals/${appeal_vt}/decide"
              payload: { decision: "OVERTURNED" }
              as: ComplianceOfficer
              as_user_id: "officer-vt-b"
            - call: "GET /carrier/policies/${pol_vt}"
              payload: {}
              as: ComplianceOfficer
              captures: { pol_vt_final_used: $.data.reinstatements_used, pol_vt_final_status: $.data.status }
            - call: "GET /carrier/regulatory-reports"
              payload: { state_profile_id: "${prof_vt}" }
              as: ComplianceOfficer
          assert:
            - "Mid-chain captured ${pol_vt_used_mid} == 1 (reinstatement consumed exactly one slot)"
            - "After OVERTURNED: Policy.${pol_vt}.status == ACTIVE and reinstatements_used == 1 (invariant: overturn restores coverage with zero additional slot consumption)"
            - "RegulatoryReport 2026-08 has cancellation_count == 1; RegulatoryReport 2026-09 has cancellation_count == 1 and rescinded_count == 1 (cancellation/rescission accounting balances)"
