            - "the Position of account ${acc_sh} still has shares == 2827.500"

      - name: duplicate_nav_valuation_date_returns_nav_date_duplicate
        claim_type: violation_to_error
        grounds:
          - "validations[priority=114]"
          - errors[ERR_NAV_DATE_DUPLICATE]
          - entities.NavRecord.fields.valuation_date
        distinguishing_aspect: "At most one NavRecord may exist per (share_class_id, valuation_date), so a second strike for 2026-08-03 on the same class returns 409 ERR_NAV_DATE_DUPLICATE while the same date on a different class is accepted."
