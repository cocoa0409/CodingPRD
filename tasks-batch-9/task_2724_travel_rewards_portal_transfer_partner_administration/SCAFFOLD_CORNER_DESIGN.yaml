          setup:
            - "One LEGACY_GOLD account, one MAPPED DINING category at base_multiplier 3.0, and one ACTIVE agency at markup 2000 bps / tolerance 1000 bps."
            - "One OPEN offer with net_rate_cents 40000, agency_public_price_cents 50000, agency_public_seats 3, portal_seats 2 and tax_cents 4000."
