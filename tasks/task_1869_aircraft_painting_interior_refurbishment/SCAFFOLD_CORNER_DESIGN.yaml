      - name: scheme_supersede_pins_and_locks
        claim_type: side_effect_execution
        grounds:
          - state_machines.PaintScheme.SUBMITTED_to_APPROVED
          - entities.PaintScheme.fields.superseded_by_id
        distinguishing_aspect: "Approving scheme B while scheme A is APPROVED flips A to SUPERSEDED with superseded_by_id == B and re-pins program.approved_scheme_id; the SUPERSEDED A then rejects further submit attempts with ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["program QUOTED; scheme A APPROVED; scheme B SUBMITTED"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
