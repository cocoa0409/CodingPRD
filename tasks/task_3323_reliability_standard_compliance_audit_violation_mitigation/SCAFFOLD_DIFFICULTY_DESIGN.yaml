# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Reliability Standard Compliance Audit & Violation Mitigation
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: penalty_proposed_vs_final_stale_violation
        grounds:
          - calculations.propose_penalty
          - calculations.propose_penalty.variants.final_penalty
          - state_machines.Violation.MITIGATION_COMPLETE_to_CLOSED
        distinguishing_aspect: |
          Same violation data yields proposed_penalty 10000.00 at OPEN but
          final_penalty 9000.00 at CLOSED because the violation interval ended
          more than 365 days before closure, activating the stale base discount
          (base 5000*0.9=4500.00, factor 2.0000) — entity domain: Violation.
        test_recipe:
          setup:
            - "Entity E1 registered with functions [GO]; clock at 2026-09-01"
            - "Audit engagement on E1 period 2025-01-01..2025-06-30, started and completed with no evidence (coverage 0.0000)"
            - "Violation V1: source AUDIT, vrf MODERATE, severity SEVERE, interval 2025-02-01..2025-03-01, source_engagement_id = completed audit"
            - "Mitigation plan created, approved, milestone completed, complete-mitigation called"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "GenCo One", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/engagements", payload: { entity_id: "${e1}", engagement_type: "AUDIT", standard_ids: ["STD-GO-001"], period_start: "2025-01-01T00:00:00Z", period_end: "2025-06-30T00:00:00Z" }, as: ComplianceAuditor, captures: { eng1: $.data.id } }
            - { call: "POST /compliance/engagements/${eng1}/start", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/engagements/${eng1}/complete", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "AUDIT", violation_start: "2025-02-01T00:00:00Z", violation_end: "2025-03-01T00:00:00Z", violation_risk_factor: "MODERATE", severity_level: "SEVERE", source_engagement_id: "${eng1}" }, as: ComplianceAuditor, captures: { v1: $.data.id, v1_ver: $.data.version, v1_proposed: $.data.proposed_penalty } }
            - { call: "POST /compliance/violations/${v1}/mitigation-plans", payload: { description: "Fix relay settings", expected_violation_version: "${v1_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /compliance/mitigation-plans/${p1}/approve", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/mitigation-plans/${p1}/milestones", payload: { title: "Install new relay", due_date: "2026-10-01T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { m1: $.data.id } }
            - { call: "POST /compliance/milestones/${m1}/complete", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
            - { call: "POST /compliance/violations/${v1}/complete-mitigation", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
          trigger:
            - { call: "POST /compliance/mitigation-plans/${p1}/verify", payload: {}, as: ComplianceAuditor }
          assert:
            - "Violation.${v1}.proposed_penalty == 10000.00"
            - "Violation.${v1}.final_penalty == 9000.00"
            - "Violation.${v1}.status == CLOSED"
      - name: coverage_fraction_union_vs_naive_sum
        grounds:
          - calculations.covered_period
          - calculations.coverage_fraction
        distinguishing_aspect: |
          Two ACCEPTED artifacts whose union covers 60 days of a 181-day period:
          union-merge gives covered_period 60 days and coverage_fraction 0.3315,
          while naive per-artifact summation would give 120 days and 0.6630 —
          entity domain: Engagement/EvidenceArtifact (different from Violation
          penalty).
        test_recipe:
          setup:
            - "Entity E1 registered [GO]; clock 2026-09-01"
            - "Engagement ENG on E1, standards [STD-GO-001], period 2026-01-01..2026-06-30 (180 days), IN_PROGRESS"
            - "Two artifacts A1 covering 2026-01-01..2026-03-01 and A2 covering 2026-01-15..2026-03-15, both ACCEPTED"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "GenCo Two", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/engagements", payload: { entity_id: "${e1}", engagement_type: "AUDIT", standard_ids: ["STD-GO-001"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }, as: ComplianceAuditor, captures: { eng1: $.data.id } }
            - { call: "POST /compliance/engagements/${eng1}/start", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/evidence", payload: { engagement_id: "${eng1}", standard_id: "STD-GO-001", artifact_kind: "OPERATING_RECORD", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-03-01T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { a1: $.data.id } }
            - { call: "POST /compliance/evidence", payload: { engagement_id: "${eng1}", standard_id: "STD-GO-001", artifact_kind: "OPERATING_RECORD", coverage_start: "2026-01-15T00:00:00Z", coverage_end: "2026-03-15T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { a2: $.data.id } }
            - { call: "POST /compliance/evidence/${a1}/accept", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/evidence/${a2}/accept", payload: {}, as: ComplianceAuditor }
          trigger:
            - { call: "GET /compliance/engagements/${eng1}", payload: {}, as: ComplianceAuditor }
          assert:
            - "Engagement.${eng1}.coverage_fraction == 0.3315"

  - rule_id: combinatorial_formula
    instances:
      - name: penalty_compound_factor_nonlinear_interaction
        grounds:
          - calculations.propose_penalty
          - validations[priority=15]
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — SERIOUS base 25000 with
          severity HIGH multiplier 1.5 compounded with gap aggravation 1.25
          (audit coverage 0.3 < 0.8) and zero recidivism yields factor 1.8750
          and amount 46875.00; omitting any one branch changes the result.
        test_recipe:
          setup:
            - "Entity E1 registered [TO]; clock 2026-09-01"
            - "Engagement ENG (AUDIT) on E1, period 2026-01-01..2026-03-31 (90 days), IN_PROGRESS"
            - "One artifact covering only 27 days (0.3 coverage) ACCEPTED; engagement completed"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "TransCo One", registration_functions: ["TO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/engagements", payload: { entity_id: "${e1}", engagement_type: "AUDIT", standard_ids: ["STD-TO-001"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: ComplianceAuditor, captures: { eng1: $.data.id } }
            - { call: "POST /compliance/engagements/${eng1}/start", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/evidence", payload: { engagement_id: "${eng1}", standard_id: "STD-TO-001", artifact_kind: "MAINTENANCE_RECORD", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-01-28T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { a1: $.data.id } }
            - { call: "POST /compliance/evidence/${a1}/accept", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/engagements/${eng1}/complete", payload: {}, as: ComplianceAuditor }
          trigger:
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-TO-001", source_type: "AUDIT", violation_start: "2026-02-01T00:00:00Z", violation_end: "2026-02-10T00:00:00Z", violation_risk_factor: "SERIOUS", severity_level: "HIGH", source_engagement_id: "${eng1}" }, as: ComplianceAuditor, captures: { v1: $.data.id } }
          assert:
            - "Violation.${v1}.proposed_penalty == 46875.00"
      - name: penalty_factor_precision_half_even_then_half_up
        grounds:
          - calculations.propose_penalty
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the compound factor is
          rounded to 4dp HALF_EVEN before multiplying by base and rounding the
          amount HALF_UP to 2dp; a SERIOUS/LOWER audit violation with 3 prior
          confirmed violations (factor exactly 1.3000, coverage 1.0 so no gap
          branch) yields 32500.00, and an implementation that rounds the amount
          first or skips the factor quantization diverges on edge inputs.
        test_recipe:
          setup:
            - "Entity E1 registered [TOP]; clock 2026-09-01"
            - "Three prior violations V0a..V0c (AUDIT, MODERATE, LOWER) each fully mitigated and closed"
            - "Engagement ENG2 completed with full coverage (artifact spanning entire period, ACCEPTED)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "TopOp One", registration_functions: ["TOP"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-TOP-001", source_type: "SPOT_CHECK", violation_start: "2026-01-05T00:00:00Z", violation_end: "2026-01-06T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { va: $.data.id, va_ver: $.data.version } }
            - { call: "POST /compliance/violations/${va}/mitigation-plans", payload: { description: "fix A", expected_violation_version: "${va_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { pa: $.data.id } }
            - { call: "POST /compliance/mitigation-plans/${pa}/approve", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/mitigation-plans/${pa}/milestones", payload: { title: "mA", due_date: "2026-10-01T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { ma: $.data.id } }
            - { call: "POST /compliance/milestones/${ma}/complete", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
            - { call: "POST /compliance/violations/${va}/complete-mitigation", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
            - { call: "POST /compliance/mitigation-plans/${pa}/verify", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-TOP-001", source_type: "SPOT_CHECK", violation_start: "2026-02-05T00:00:00Z", violation_end: "2026-02-06T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { vb: $.data.id, vb_ver: $.data.version } }
            - { call: "POST /compliance/violations/${vb}/mitigation-plans", payload: { description: "fix B", expected_violation_version: "${vb_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { pb: $.data.id } }
            - { call: "POST /compliance/mitigation-plans/${pb}/approve", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/mitigation-plans/${pb}/milestones", payload: { title: "mB", due_date: "2026-10-01T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { mb: $.data.id } }
            - { call: "POST /compliance/milestones/${mb}/complete", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
            - { call: "POST /compliance/violations/${vb}/complete-mitigation", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
            - { call: "POST /compliance/mitigation-plans/${pb}/verify", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-TOP-001", source_type: "SPOT_CHECK", violation_start: "2026-03-05T00:00:00Z", violation_end: "2026-03-06T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { vc: $.data.id, vc_ver: $.data.version } }
            - { call: "POST /compliance/violations/${vc}/mitigation-plans", payload: { description: "fix C", expected_violation_version: "${vc_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { pc: $.data.id } }
            - { call: "POST /compliance/mitigation-plans/${pc}/approve", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/mitigation-plans/${pc}/milestones", payload: { title: "mC", due_date: "2026-10-01T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { mc: $.data.id } }
            - { call: "POST /compliance/milestones/${mc}/complete", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
            - { call: "POST /compliance/violations/${vc}/complete-mitigation", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
            - { call: "POST /compliance/mitigation-plans/${pc}/verify", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/engagements", payload: { entity_id: "${e1}", engagement_type: "AUDIT", standard_ids: ["STD-TOP-001"], period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }, as: ComplianceAuditor, captures: { eng2: $.data.id } }
            - { call: "POST /compliance/engagements/${eng2}/start", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/evidence", payload: { engagement_id: "${eng2}", standard_id: "STD-TOP-001", artifact_kind: "OPERATING_RECORD", coverage_start: "2026-06-01T00:00:00Z", coverage_end: "2026-06-30T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { a1: $.data.id } }
            - { call: "POST /compliance/evidence/${a1}/accept", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/engagements/${eng2}/complete", payload: {}, as: ComplianceAuditor }
          trigger:
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-TOP-001", source_type: "AUDIT", violation_start: "2026-06-10T00:00:00Z", violation_end: "2026-06-12T00:00:00Z", violation_risk_factor: "SERIOUS", severity_level: "LOWER", source_engagement_id: "${eng2}" }, as: ComplianceAuditor, captures: { v1: $.data.id } }
          assert:
            - "Violation.${v1}.proposed_penalty == 32500.00"

  - rule_id: non_linear_state_machine
    instances:
      - name: mitigation_plan_resubmission_cycle
        grounds:
          - state_machines.MitigationPlan.SUBMITTED_to_REJECTED
          - state_machines.MitigationPlan.REJECTED_to_SUBMITTED
          - state_machines.MitigationPlan.APPROVED_to_REJECTED
        distinguishing_aspect: |
          Cyclic machine on MitigationPlan: SUBMITTED -> REJECTED -> SUBMITTED
          -> APPROVED -> REJECTED -> SUBMITTED -> APPROVED, exercising both
          cycle edges on the same plan while the parent Violation sits in
          MITIGATION_SUBMITTED/MITIGATION_IN_PROGRESS.
        test_recipe:
          setup:
            - "Entity E1 [GO]; clock 2026-09-01; violation V1 OPEN (SPOT_CHECK MINIMAL/LOWER)"
            - "Plan P1 created for V1"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "GenCo Cyc", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "SPOT_CHECK", violation_start: "2026-01-01T00:00:00Z", violation_end: "2026-01-02T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { v1: $.data.id, v1_ver: $.data.version } }
            - { call: "POST /compliance/violations/${v1}/mitigation-plans", payload: { description: "v1", expected_violation_version: "${v1_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /compliance/mitigation-plans/${p1}/reject", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/mitigation-plans/${p1}/resubmit", payload: { description: "v2" }, as: EntityComplianceOfficer, as_user_id: "${e1}" }
            - { call: "POST /compliance/mitigation-plans/${p1}/approve", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/mitigation-plans/${p1}/reject", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/mitigation-plans/${p1}/resubmit", payload: { description: "v3" }, as: EntityComplianceOfficer, as_user_id: "${e1}" }
            - { call: "POST /compliance/mitigation-plans/${p1}/approve", payload: {}, as: ComplianceAuditor }
            - { call: "GET /compliance/mitigation-plans/${p1}", payload: {}, as: ComplianceAuditor }
            - { call: "GET /compliance/violations/${v1}", payload: {}, as: ComplianceAuditor }
          assert:
            - "MitigationPlan.${p1}.status == APPROVED"
            - "Violation.${v1}.status == MITIGATION_IN_PROGRESS"
      - name: appeal_two_level_cycle
        grounds:
          - state_machines.Appeal.APPEAL_DENIED_to_FEDERAL_REVIEW_REQUESTED
          - state_machines.Appeal.FEDERAL_REVIEW_REQUESTED_to_APPEAL_GRANTED
          - state_machines.Violation.APPEALED_to_CLOSED
        distinguishing_aspect: |
          Cyclic/branching machine on Appeal (different entity from
          MitigationPlan): APPEAL_PENDING_REVIEW -> APPEAL_DENIED ->
          FEDERAL_REVIEW_REQUESTED -> APPEAL_GRANTED, with the Violation cycling
          OPEN -> APPEALED -> OPEN -> APPEALED -> CLOSED in response.
        test_recipe:
          setup:
            - "Entity E1 [GO]; clock 2026-09-01; violation V1 OPEN (AUDIT via completed engagement ENG1 with full coverage)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "GenCo App", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/engagements", payload: { entity_id: "${e1}", engagement_type: "AUDIT", standard_ids: ["STD-GO-001"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }, as: ComplianceAuditor, captures: { eng1: $.data.id } }
            - { call: "POST /compliance/engagements/${eng1}/start", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/evidence", payload: { engagement_id: "${eng1}", standard_id: "STD-GO-001", artifact_kind: "OPERATING_RECORD", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-01-31T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { a1: $.data.id } }
            - { call: "POST /compliance/evidence/${a1}/accept", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/engagements/${eng1}/complete", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "AUDIT", violation_start: "2026-01-10T00:00:00Z", violation_end: "2026-01-11T00:00:00Z", violation_risk_factor: "MODERATE", severity_level: "MODERATE", source_engagement_id: "${eng1}" }, as: ComplianceAuditor, captures: { v1: $.data.id, v1_ver: $.data.version } }
          trigger:
            - { call: "POST /compliance/violations/${v1}/appeals", payload: { grounds: "procedural error", expected_violation_version: "${v1_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { ap1: $.data.id } }
            - { call: "POST /compliance/appeals/${ap1}/grant", payload: {}, as: ComplianceAuditor, captures: { err_role: $.data.error_id } }
            - { call: "POST /compliance/appeals/${ap1}/deny", payload: {}, as: RegionalEntityReviewer }
            - { call: "GET /compliance/violations/${v1}", payload: {}, as: RegionalEntityReviewer, captures: { v1_state_mid: $.data.status } }
            - { call: "POST /compliance/appeals/${ap1}/request-federal-review", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
            - { call: "POST /compliance/appeals/${ap1}/grant", payload: {}, as: FederalReviewer }
            - { call: "GET /compliance/violations/${v1}", payload: {}, as: FederalReviewer, captures: { v1_final: $.data.status } }
          assert:
            - "captured err_role == ERR_UNAUTHORIZED"
            - "Appeal.${ap1}.status == APPEAL_GRANTED"
            - "captured v1_state_mid == OPEN"
            - "captured v1_final == CLOSED"
            - "Violation.${v1}.final_penalty != null"

  - rule_id: transitive_cascade
    instances:
      - name: verify_cascade_four_hops
        grounds:
          - state_machines.MitigationPlan.APPROVED_to_VERIFIED
          - state_machines.Violation.MITIGATION_COMPLETE_to_CLOSED
          - calculations.propose_penalty.variants.final_penalty
          - entities.RegisteredEntity.fields.open_violation_count
        distinguishing_aspect: |
          Depth-4 cascade triggered by plan verify: plan VERIFIED -> violation
          CLOSED (mutation 1 caused by verify) -> final_penalty recompute (2,
          caused by the CLOSED transition) -> entity.open_violation_count
          decrement (3, caused by the violation mutation) -> Penalty row upsert
          with amount == final_penalty (4, caused by the violation mutation).
        test_recipe:
          setup:
            - "Entity E1 [GO]; clock 2026-09-01; completed audit engagement ENG1 with zero coverage; violation V1 MODERATE/SEVERE AUDIT sourced from ENG1, plan approved, milestone completed, complete-mitigation done"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "GenCo Cascade", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/engagements", payload: { entity_id: "${e1}", engagement_type: "AUDIT", standard_ids: ["STD-GO-001"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }, as: ComplianceAuditor, captures: { eng1: $.data.id } }
            - { call: "POST /compliance/engagements/${eng1}/start", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/engagements/${eng1}/complete", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "AUDIT", violation_start: "2026-01-01T00:00:00Z", violation_end: "2026-01-02T00:00:00Z", violation_risk_factor: "MODERATE", severity_level: "SEVERE", source_engagement_id: "${eng1}" }, as: ComplianceAuditor, captures: { v1: $.data.id, v1_ver: $.data.version } }
            - { call: "POST /compliance/violations/${v1}/mitigation-plans", payload: { description: "plan", expected_violation_version: "${v1_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /compliance/mitigation-plans/${p1}/approve", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/mitigation-plans/${p1}/milestones", payload: { title: "m1", due_date: "2026-10-01T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { m1: $.data.id } }
            - { call: "POST /compliance/milestones/${m1}/complete", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
            - { call: "POST /compliance/violations/${v1}/complete-mitigation", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
          trigger:
            - { call: "POST /compliance/mitigation-plans/${p1}/verify", payload: {}, as: ComplianceAuditor }
            - { call: "GET /compliance/registrations/${e1}", payload: {}, as: ComplianceAuditor, captures: { e1_open: $.data.open_violation_count } }
            - { call: "GET /compliance/violations/${v1}", payload: {}, as: ComplianceAuditor, captures: { v1_final_pen: $.data.final_penalty } }
            - { call: "GET /compliance/penalties", payload: { violation_id: "${v1}" }, as: ComplianceAuditor, captures: { pen_amount: "$.data[0].amount" } }
          assert:
            - "Violation.${v1}.status == CLOSED"
            - "captured v1_final_pen == 11250.00"
            - "captured e1_open == 0"
            - "captured pen_amount == 11250.00"
      - name: engagement_cancel_cascade_rejects_evidence_and_recomputes
        grounds:
          - state_machines.Engagement.IN_PROGRESS_to_CANCELLED
          - state_machines.EvidenceArtifact.SUBMITTED_to_REJECTED
          - calculations.coverage_fraction
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (engagement cancel, not plan
          verify): cancel engagement (1) -> its SUBMITTED evidence artifact
          flips to REJECTED (2, caused by the cancel) -> coverage_fraction
          recomputed back to 0.0000 (3, caused by the artifact mutation).
        test_recipe:
          setup:
            - "Entity E1 [GO]; clock 2026-09-01; engagement ENG1 IN_PROGRESS; one artifact A1 SUBMITTED (not yet accepted)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "GenCo Cancel", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/engagements", payload: { entity_id: "${e1}", engagement_type: "SPOT_CHECK", standard_ids: ["STD-GO-001"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }, as: ComplianceAuditor, captures: { eng1: $.data.id } }
            - { call: "POST /compliance/engagements/${eng1}/start", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/evidence", payload: { engagement_id: "${eng1}", standard_id: "STD-GO-001", artifact_kind: "OPERATING_RECORD", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-01-31T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /compliance/engagements/${eng1}/cancel", payload: {}, as: ComplianceAuditor }
            - { call: "GET /compliance/evidence/${a1}", payload: {}, as: ComplianceAuditor, captures: { a1_status: $.data.status } }
            - { call: "GET /compliance/engagements/${eng1}", payload: {}, as: ComplianceAuditor, captures: { eng_cov: $.data.coverage_fraction } }
          assert:
            - "captured a1_status == REJECTED"
            - "captured eng_cov == 0.0000"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: entity_restricted_beats_state_on_appeal
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_ENTITY_RESTRICTED]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Category pair business_safety (p4) vs state (p5): entity is RESTRICTED
          AND the violation is already CLOSED — the appeal attempt must fail
          with ERR_ENTITY_RESTRICTED (409), not ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Entity E1 [GO]; clock 2026-09-01; violation V1 fully mitigated and CLOSED"
            - "Violation V2 OPEN with penalty confirmed; clock advanced 31 days past due_date so E1 becomes RESTRICTED"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "GenCo Prio", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "SPOT_CHECK", violation_start: "2026-01-01T00:00:00Z", violation_end: "2026-01-02T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { v1: $.data.id, v1_ver: $.data.version } }
            - { call: "POST /compliance/violations/${v1}/mitigation-plans", payload: { description: "p", expected_violation_version: "${v1_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /compliance/mitigation-plans/${p1}/approve", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/mitigation-plans/${p1}/milestones", payload: { title: "m", due_date: "2026-10-01T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { m1: $.data.id } }
            - { call: "POST /compliance/milestones/${m1}/complete", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
            - { call: "POST /compliance/violations/${v1}/complete-mitigation", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
            - { call: "POST /compliance/mitigation-plans/${p1}/verify", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "SPOT_CHECK", violation_start: "2026-02-01T00:00:00Z", violation_end: "2026-02-02T00:00:00Z", violation_risk_factor: "MODERATE", severity_level: "MODERATE" }, as: ComplianceAuditor, captures: { v2: $.data.id } }
            - { call: "POST /compliance/penalties", payload: { violation_id: "${v2}" }, as: ComplianceAuditor, captures: { pen2: $.data.id } }
            - { call: "POST /compliance/penalties/${pen2}/confirm", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/_clock/advance", payload: { seconds: 2678400 }, as: RegionalEntityReviewer }
          trigger:
            - { call: "GET /compliance/violations/${v1}", payload: {}, as: ComplianceAuditor, captures: { v1_ver_late: $.data.version } }
            - { call: "POST /compliance/violations/${v1}/appeals", payload: { grounds: "too late anyway", expected_violation_version: "${v1_ver_late} - 1" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_ENTITY_RESTRICTED"
      - name: enrollment_gate_beats_referential_on_self_log
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - errors[ERR_SELF_LOG_NOT_ENROLLED]
          - errors[ERR_STANDARD_NOT_APPLICABLE]
        distinguishing_aspect: |
          Category pair business_safety (p6) vs business_referential (p13) —
          different pair from instance 1: entity NOT enrolled in self-logging
          AND the standard_id is not in its applicable set; the self-log attempt
          must fail with ERR_SELF_LOG_NOT_ENROLLED (422), not
          ERR_STANDARD_NOT_APPLICABLE.
        test_recipe:
          setup:
            - "Entity E1 [GO] with enrollment_self_logging = false; clock 2026-09-01"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "GenCo NotEnrolled", registration_functions: ["GO"], enrollment_self_logging: false }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /compliance/self-log-entries", payload: { entity_id: "${e1}", standard_id: "STD-TO-001", exception_note: "not our standard and not enrolled" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_SELF_LOG_NOT_ENROLLED"

  - rule_id: boundary_precision_check
    instances:
      - name: coverage_gap_threshold_exact_equality
        grounds:
          - calculations.propose_penalty
          - calculations.coverage_fraction
        distinguishing_aspect: |
          Boundary on coverage_fraction (a ratio metric): at exactly 0.8000 the
          gap aggravation (strict <) does NOT fire, so a SERIOUS/HIGH audit
          violation yields 25000*1.5 = 37500.00 rather than 46875.00 — reachable
          via POST /compliance/violations.
        test_recipe:
          setup:
            - "Entity E1 [TO]; clock 2026-09-01; engagement ENG1 period 2026-01-01..2026-04-11 (100 days), evidence covering exactly 80 days (2026-01-01..2026-03-22) ACCEPTED, engagement completed (coverage 0.8000)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "TransCo Edge", registration_functions: ["TO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/engagements", payload: { entity_id: "${e1}", engagement_type: "AUDIT", standard_ids: ["STD-TO-001"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-11T00:00:00Z" }, as: ComplianceAuditor, captures: { eng1: $.data.id } }
            - { call: "POST /compliance/engagements/${eng1}/start", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/evidence", payload: { engagement_id: "${eng1}", standard_id: "STD-TO-001", artifact_kind: "MAINTENANCE_RECORD", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-03-22T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { a1: $.data.id } }
            - { call: "POST /compliance/evidence/${a1}/accept", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/engagements/${eng1}/complete", payload: {}, as: ComplianceAuditor, captures: { eng_cov: $.data.coverage_fraction } }
          trigger:
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-TO-001", source_type: "AUDIT", violation_start: "2026-02-01T00:00:00Z", violation_end: "2026-02-02T00:00:00Z", violation_risk_factor: "SERIOUS", severity_level: "HIGH", source_engagement_id: "${eng1}" }, as: ComplianceAuditor, captures: { v1: $.data.id } }
          assert:
            - "captured eng_cov == 0.8000"
            - "Violation.${v1}.proposed_penalty == 37500.00"
      - name: empty_review_period_zero_count
        grounds:
          - validations[priority=19]
          - state_machines.ReviewPeriod.OPEN_to_REVIEWING
        distinguishing_aspect: |
          Boundary on a zero-count metric (entry_count == 0), reachable via a
          different endpoint (POST /compliance/review-periods/{id}/start-review):
          a fresh period with no entries cannot start review.
        test_recipe:
          setup:
            - "Clock 2026-09-01; review period RP1 opened with no entries"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/review-periods", payload: {}, as: ComplianceAuditor, captures: { rp1: $.data.id } }
          trigger:
            - { call: "POST /compliance/review-periods/${rp1}/start-review", payload: {}, as: ComplianceAuditor, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_EMPTY_REVIEW_PERIOD"
            - "ReviewPeriod.${rp1}.status == OPEN"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: violation_create_depends_on_engagement_completed
        grounds:
          - validations[priority=15]
          - state_machines.Engagement
        distinguishing_aspect: |
          Entity pair Violation -> Engagement: creating a violation with
          source_type AUDIT referencing an IN_PROGRESS (not COMPLETED)
          engagement is rejected with ERR_VIOLATION_SOURCE_INVALID.
        test_recipe:
          setup:
            - "Entity E1 [GO]; clock 2026-09-01; engagement ENG1 IN_PROGRESS (not completed)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "GenCo XEnt", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/engagements", payload: { entity_id: "${e1}", engagement_type: "AUDIT", standard_ids: ["STD-GO-001"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }, as: ComplianceAuditor, captures: { eng1: $.data.id } }
            - { call: "POST /compliance/engagements/${eng1}/start", payload: {}, as: ComplianceAuditor }
          trigger:
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "AUDIT", violation_start: "2026-01-10T00:00:00Z", violation_end: "2026-01-11T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER", source_engagement_id: "${eng1}" }, as: ComplianceAuditor, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_VIOLATION_SOURCE_INVALID"
      - name: cip_decommission_depends_on_access_grant_state
        grounds:
          - validations[priority=20]
          - state_machines.AccessGrant
        distinguishing_aspect: |
          Different entity pair CIPAsset -> AccessGrant: decommissioning an
          asset with an ACTIVE grant fails; after revoking the grant, the same
          decommission succeeds.
        test_recipe:
          setup:
            - "Entity E1 [GO]; clock 2026-09-01; CIP asset CA1 (HIGH impact) with one ACTIVE access grant G1"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "GenCo CIP", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/cip-assets", payload: { entity_id: "${e1}", asset_name: "Substation Relay House", impact_rating: "HIGH" }, as: CIPAssetManager, as_user_id: "${e1}", captures: { ca1: $.data.id } }
            - { call: "POST /compliance/access-grants", payload: { asset_id: "${ca1}", grantee_badge: "B-100", scope: "PHYSICAL" }, as: CIPAssetManager, as_user_id: "${e1}", captures: { g1: $.data.id } }
          trigger:
            - { call: "POST /compliance/cip-assets/${ca1}/decommission", payload: {}, as: CIPAssetManager, as_user_id: "${e1}", captures: { err: $.data.error_id } }
            - { call: "POST /compliance/access-grants/${g1}/revoke", payload: {}, as: CIPAssetManager, as_user_id: "${e1}" }
            - { call: "POST /compliance/cip-assets/${ca1}/decommission", payload: {}, as: CIPAssetManager, as_user_id: "${e1}" }
          assert:
            - "captured err == ERR_ACTIVE_ACCESS_GRANTS"
            - "CIPAsset.${ca1}.status == DECOMMISSIONED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: evidence_gap_zero_adjacent_intervals_merge
        grounds:
          - calculations.covered_period
          - calculations.coverage_fraction
        distinguishing_aspect: |
          Interval semantics (a) on EvidenceArtifact: two ACCEPTED windows
          [01-01, 02-01) and [02-01, 03-01) are gap-zero ADJACENT — the merge
          treats them as continuous (no gap subtracted), covering 59 of 89 days
          => coverage_fraction 0.6629; semantics that demanded a buffer or
          counted the boundary twice diverge.
        test_recipe:
          setup:
            - "Entity E1 [GO]; clock 2026-09-01; engagement ENG1 period 2026-01-01..2026-03-31 (89 days) IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "GenCo Adj", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/engagements", payload: { entity_id: "${e1}", engagement_type: "AUDIT", standard_ids: ["STD-GO-001"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: ComplianceAuditor, captures: { eng1: $.data.id } }
            - { call: "POST /compliance/engagements/${eng1}/start", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/evidence", payload: { engagement_id: "${eng1}", standard_id: "STD-GO-001", artifact_kind: "OPERATING_RECORD", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-02-01T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { a1: $.data.id } }
            - { call: "POST /compliance/evidence", payload: { engagement_id: "${eng1}", standard_id: "STD-GO-001", artifact_kind: "OPERATING_RECORD", coverage_start: "2026-02-01T00:00:00Z", coverage_end: "2026-03-01T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { a2: $.data.id } }
            - { call: "POST /compliance/evidence/${a1}/accept", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/evidence/${a2}/accept", payload: {}, as: ComplianceAuditor }
          trigger:
            - { call: "GET /compliance/engagements/${eng1}", payload: {}, as: ComplianceAuditor, captures: { cov: $.data.coverage_fraction } }
          assert:
            - "captured cov == 0.6629"
      - name: penalty_due_date_aggregate_restriction
        grounds:
          - calculations.restriction_due
          - state_machines.Penalty.CONFIRMED_to_SETTLED
          - entities.RegisteredEntity.fields.compliance_status
        distinguishing_aspect: |
          Interval semantics (b) on Penalty (different resource from
          EvidenceArtifact): restriction is an AGGREGATE capacity rule over
          time — entity is RESTRICTED while ANY CONFIRMED penalty has
          due_date < now (strict); at now == due_date exactly no restriction
          fires, and two penalties keep the entity restricted until BOTH are
          resolved.
        test_recipe:
          setup:
            - "Entity E1 [GO]; clock 2026-09-01; violations V1,V2 OPEN; penalties P1,P2 issued and CONFIRMED at 2026-09-01 (due 2026-10-01)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "GenCo Due", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "SPOT_CHECK", violation_start: "2026-01-01T00:00:00Z", violation_end: "2026-01-02T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { v1: $.data.id } }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-002", source_type: "SPOT_CHECK", violation_start: "2026-01-03T00:00:00Z", violation_end: "2026-01-04T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { v2: $.data.id } }
            - { call: "POST /compliance/penalties", payload: { violation_id: "${v1}" }, as: ComplianceAuditor, captures: { pen1: $.data.id } }
            - { call: "POST /compliance/penalties", payload: { violation_id: "${v2}" }, as: ComplianceAuditor, captures: { pen2: $.data.id } }
            - { call: "POST /compliance/penalties/${pen1}/confirm", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/penalties/${pen2}/confirm", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/_clock/advance", payload: { seconds: 2592000 }, as: RegionalEntityReviewer }
            - { call: "GET /compliance/registrations/${e1}", payload: {}, as: ComplianceAuditor, captures: { st_at_due: $.data.compliance_status } }
            - { call: "POST /compliance/_clock/advance", payload: { seconds: 86400 }, as: RegionalEntityReviewer }
            - { call: "GET /compliance/registrations/${e1}", payload: {}, as: ComplianceAuditor, captures: { st_past_due: $.data.compliance_status } }
          trigger:
            - { call: "POST /compliance/penalties/${pen1}/settle", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
            - { call: "GET /compliance/registrations/${e1}", payload: {}, as: ComplianceAuditor, captures: { st_one_settled: $.data.compliance_status } }
            - { call: "POST /compliance/penalties/${pen2}/settle", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
            - { call: "GET /compliance/registrations/${e1}", payload: {}, as: ComplianceAuditor, captures: { st_both_settled: $.data.compliance_status } }
          assert:
            - "captured st_at_due == ACTIVE"
            - "captured st_past_due == RESTRICTED"
            - "captured st_one_settled == RESTRICTED"
            - "captured st_both_settled == ACTIVE"

  - rule_id: compensating_invariant
    instances:
      - name: open_violation_count_conservation
        grounds:
          - entities.RegisteredEntity.fields.open_violation_count
          - state_machines.Violation.MITIGATION_COMPLETE_to_CLOSED
          - state_machines.Violation.APPEALED_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity: RegisteredEntity.open_violation_count. Invariant:
          open_violation_count == (violations ever created in OPEN-family) -
          (closures) - (self-log-qualified auto-dismissals, which net zero).
          Closing V1 via mitigation (10000.00) and V2 via granted appeal must
          return the counter to 0 exactly.
        test_recipe:
          setup:
            - "Entity E1 [GO]; clock 2026-09-01; V1 (SPOT_CHECK MODERATE/SEVERE) and V2 (SPOT_CHECK MINIMAL/LOWER) OPEN"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "GenCo Inv", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "SPOT_CHECK", violation_start: "2026-01-01T00:00:00Z", violation_end: "2026-01-02T00:00:00Z", violation_risk_factor: "MODERATE", severity_level: "SEVERE" }, as: ComplianceAuditor, captures: { v1: $.data.id, v1_ver: $.data.version } }
