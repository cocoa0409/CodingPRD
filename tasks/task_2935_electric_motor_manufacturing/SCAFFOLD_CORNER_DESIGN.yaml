          Seven standards are registered in deliberately scrambled order around one nameplate. Four
          are ineligible for four DIFFERENT reasons (future effective date, wrong jurisdiction,
          wrong pole count, output band that excludes 7.5 kW) and two share the winning effective
          date so the created_at ASC tie-break decides. The winner is an IE2 row even though the
