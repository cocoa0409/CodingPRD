      - name: corner_calc_renovation_estimate_versus_final_variant_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.renovation_cost_allocation.variants
          - calculations.renovation_cost_allocation.constants.RENOVATION_SUBSIDY_PCT
        distinguishing_aspect: "renovation_cost_allocation carries two variants that charge the package different amounts for the same room work, so the same project yields one number at award and another at substantial completion."
        excluded_because:
          difficulty_instance: renovation_scope_estimate_vs_final_actual_divergence
          rationale: "The difficulty instance runs both variants over one MODERATE project and one COSMETIC project, asserting the estimate-variant encumbrance, the final-variant disbursement, the signed delta and the subsidy cap interaction with exact cent literals; a breadth corner would only re-derive the same two numbers."

      - name: corner_calc_renovation_variant_switch_reconciles_the_delta
        claim_type: Reconciliation
        grounds:
          - calculations.renovation_cost_allocation.variants
          - complexity_profile.complexity_layers.dual_variant_calculation
        distinguishing_aspect: "When the estimate variant is superseded by the final variant at substantial completion, the difference has to be reconciled against the already-open encumbrance rather than double-charged."
        excluded_because:
          difficulty_instance: renovation_scope_estimate_vs_final_actual_divergence
          rationale: "The difficulty instance asserts the reconciliation leg directly: the under-run project releases the unspent portion of its estimate-variant encumbrance while disbursing the final-variant charge, and each RELEASE share is the per-funder arithmetic remainder of the ENCUMBRANCE row it settles."

      - name: corner_calc_separation_settlement_variant_selected_by_departure_intent
        claim_type: Variant Selection
        grounds:
          - calculations.separation_settlement.variants
          - entities.Faculty.fields.departure_intent
        distinguishing_aspect: "separation_settlement picks its variant from Faculty.departure_intent, so the same unspent balance is recaptured outright for a DEPARTURE but partly follows the faculty member on an INTERNAL_TRANSFER."
        excluded_because:
          difficulty_instance: separation_departure_recapture_vs_internal_transfer_divergence
          rationale: "The difficulty instance settles two identical packages under the two intents and asserts recaptured_unspent_cents, transferred_balance_cents and college_holdback_cents (COLLEGE_HOLDBACK_PCT 15) for both, which is exactly the variant-selection claim plus its divergence."

      - name: corner_calc_staff_encumbrance_rounding_order_is_pinned
        claim_type: Precision
        grounds:
          - calculations.staff_encumbrance_rounding
        distinguishing_aspect: "The monthly-cost-times-months encumbrance can be rounded per month and then multiplied, or multiplied and then rounded once, and the two orders differ by up to a cent per month."
        excluded_because:
          difficulty_instance: staff_encumbrance_round_per_month_then_multiply
          rationale: "The difficulty instance pins the order with an fte-scaled monthly cost that does not divide evenly (449166 per month x 12 == 5389992) and asserts both the pinned total and the wrong total the other order would produce, together with the per-funder split of every resulting row."

      - name: corner_calc_waterfall_capacity_boundary_equal_then_over
        claim_type: Correct Result
        grounds:
          - calculations.encumbrance_waterfall
          - validations.priority_43_ERR_INSUFFICIENT_TRANCHE_BALANCE
        distinguishing_aspect: "The waterfall's all-or-nothing gate is a >= comparison, so capacity == required must be accepted while capacity == required - 1 must be refused."
        excluded_because:
          difficulty_instance: waterfall_capacity_exactly_equals_required_then_one_cent_over
          rationale: "The difficulty instance drives exactly that pair of adjacent cases on the same fixture - an order draining the candidate set to precisely 0 and then a one-cent-larger order rejected with ERR_INSUFFICIENT_TRANCHE_BALANCE and no partial encumbrance written."

      - name: corner_calc_year_end_rollover_processing_order
        claim_type: Correct Result
        grounds:
          - calculations.year_end_rollover
          - calculations.year_end_rollover.constants.MIN_SPENDDOWN_RATIO_FOR_CARRYFORWARD
        distinguishing_aspect: "year_end_rollover has to classify obligated tranches before computing carryforward, and the spend-down gate has to be evaluated on the pre-rollover state; a different processing order produces different carried_out and expired amounts."
        excluded_because:
          difficulty_instance: year_end_rollover_obligation_before_carryforward_order
          rationale: "The difficulty instance runs one rollover over a mixed cohort (an obligated tranche, a CAPPED tranche, a FULL tranche and a NONE tranche) and asserts the per-tranche carried_out / expired literals produced by the pinned order, plus the totals the wrong order would produce."

      - name: corner_calc_space_share_over_overlapping_windows
        claim_type: Input Set Filtering
        grounds:
          - calculations.space_share_utilization
          - entities.SpaceAssignment.fields.effective_to
        distinguishing_aspect: "space_share_utilization aggregates share_pct over PROPOSED and ACTIVE assignments whose half-open windows overlap the candidate's, which is a different filter from the clock-instant filter behind LabSpace.allocated_share_pct."
        excluded_because:
          difficulty_instance: lab_space_share_over_half_open_occupancy_windows
          rationale: "The difficulty instance builds abutting and overlapping windows on one room and asserts that a window ending exactly where the next begins does not overlap, that a genuine overlap trips ERR_SPACE_SHARE_EXCEEDED at 101%, and that allocated_share_pct reports only the share held at the clock instant."

      - name: corner_calc_renovation_phase_buffer_constant
        claim_type: Constants Applied
        grounds:
          - calculations.renovation_phase_sequencing
          - calculations.renovation_phase_sequencing.constants.PHASE_BUFFER_DAYS
        distinguishing_aspect: "Consecutive phases are closed intervals separated by at least PHASE_BUFFER_DAYS (2) calendar days, so a one-day changeover is a violation while a two-day changeover is legal."
        excluded_because:
          difficulty_instance: renovation_phase_windows_as_closed_intervals_with_changeover_buffer
          rationale: "The difficulty instance walks the exact boundary triple - a shared endpoint rejected as ERR_PHASE_WINDOW_OVERLAP because the intervals are closed, a one-day gap rejected as ERR_PHASE_BUFFER_VIOLATION, and a two-day gap accepted - which subsumes both the interval semantics and the constant."

  - section: validations
    instances:
      - name: corner_val_share_percentages_not_summing_to_100_are_rejected
        claim_type: Violation to Error
        grounds:
          - validations.priority_4_ERR_SHARE_PCT_SUM_INVALID
        distinguishing_aspect: "45 + 35 + 25 == 105 fails the exact-sum rule with 422 ERR_SHARE_PCT_SUM_INVALID; every individual percentage is a legal 1..100 value, so priority 3 is satisfied and priority 4 is the first failing rule."
        test_recipe:
          setup:
            - "MINI-UNITS plus one CANDIDATE faculty member."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { v1_col: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${v1_col}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { v1_dept: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${v1_col}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { v1_dean: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${v1_dept}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { v1_fac: $.data.id }
          trigger:
            - call: "POST /startup-packages"
              payload: { faculty_id: "${v1_fac}", package_kind: "INITIAL", dean_unit_id: "${v1_dean}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 25, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
          assert:
            - "response code is 422 with error_id ERR_SHARE_PCT_SUM_INVALID"
            - "no StartupPackage row exists"
            - "the same payload with dean_share_pct 20 returns 201 - the only defect is the sum"

      - name: corner_val_duplicate_building_and_room_returns_space_already_registered
        claim_type: Violation to Error
        grounds:
          - validations.priority_24_ERR_SPACE_ALREADY_REGISTERED
          - entities.LabSpace.fields.building_code
        distinguishing_aspect: "Uniqueness is on the pair (building_code, room_number), not on either alone: re-registering CHEM/101 returns 409 ERR_SPACE_ALREADY_REGISTERED while BIOL/101 and CHEM/102 both register cleanly."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z with CHEM/101 already registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /lab-spaces"
              payload: { building_code: "CHEM", room_number: "101", net_sq_ft: 900, space_class: "WET", power_kw_capacity: 120.00, chilled_water_available: true, fume_hood_count: 3, floor_load_psf: 300 }
              as: FacilitiesManager
              captures: { v2_first: $.data.id }
          trigger:
            - call: "POST /lab-spaces"
              payload: { building_code: "CHEM", room_number: "101", net_sq_ft: 640, space_class: "DRY", power_kw_capacity: 60.00, chilled_water_available: false, fume_hood_count: 0, floor_load_psf: 200 }
              as: FacilitiesManager
          assert:
            - "response code is 409 with error_id ERR_SPACE_ALREADY_REGISTERED - a different net_sq_ft and space_class do not make it a different room"
            - "exactly one LabSpace row exists and LabSpace.${v2_first}.net_sq_ft is still 900 with space_class WET"
            - "registering BIOL/101 and CHEM/102 afterwards both return 201, so the constraint is on the pair and not on either component"

      - name: corner_val_phase_sequence_gap_is_rejected
        claim_type: Violation to Error
        grounds:
          - validations.priority_28_ERR_PHASE_SEQUENCE_GAP
          - calculations.renovation_phase_sequencing
        distinguishing_aspect: "Phase sequence numbers must form the contiguous run 1..N, so adding sequence_no 3 straight after sequence_no 1 returns 422 ERR_PHASE_SEQUENCE_GAP even though the two windows neither overlap nor breach the changeover buffer."
        test_recipe:
          setup:
            - "MINI-UNITS plus one CANDIDATE faculty member, one DRAFT package of 20000000, one registered room, and a SCOPING renovation project on that room already carrying phase sequence_no 1 spanning 2026-09-01..2026-09-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { v3_col: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${v3_col}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { v3_dept: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${v3_col}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { v3_dean: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${v3_dept}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { v3_fac: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${v3_fac}", package_kind: "INITIAL", dean_unit_id: "${v3_dean}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { v3_pkg: $.data.id }
            - call: "POST /lab-spaces"
              payload: { building_code: "CHEM", room_number: "220", net_sq_ft: 900, space_class: "WET", power_kw_capacity: 120.00, chilled_water_available: true, fume_hood_count: 2, floor_load_psf: 300 }
              as: FacilitiesManager
              captures: { v3_space: $.data.id }
            - call: "POST /renovation-projects"
              payload: { package_id: "${v3_pkg}", space_id: "${v3_space}", scope_tier: "MODERATE", estimate_cents: 6000000 }
              as: FacilitiesManager
              captures: { v3_proj: $.data.id }
            - call: "POST /renovation-projects/${v3_proj}/phases"
              payload: { sequence_no: 1, name: "Demolition", planned_start: "2026-09-01T00:00:00Z", planned_end: "2026-09-10T00:00:00Z", budget_cents: 3000000 }
              as: FacilitiesManager
              captures: { v3_ph1: $.data.id }
          trigger:
            - call: "POST /renovation-projects/${v3_proj}/phases"
              payload: { sequence_no: 3, name: "Casework", planned_start: "2026-09-20T00:00:00Z", planned_end: "2026-09-30T00:00:00Z", budget_cents: 3000000 }
              as: FacilitiesManager
          assert:
            - "response code is 422 with error_id ERR_PHASE_SEQUENCE_GAP"
            - "the windows 2026-09-01..2026-09-10 and 2026-09-20..2026-09-30 are disjoint and 10 days apart, so neither priority 26 nor priority 27 is violated - the gap is purely in the sequence numbers"
            - "only RenovationPhase.${v3_ph1} exists on the project"
            - "the identical payload with sequence_no 2 returns 201"

      - name: corner_val_same_user_submitting_and_endorsing_breaches_segregation_of_duties
        claim_type: Violation to Error
        grounds:
          - validations.priority_14_ERR_SEGREGATION_OF_DUTIES
          - complexity_profile.role_model
        distinguishing_aspect: "The chair must endorse with X-User-ID == department_unit_id, so if the DeanOffice user who submitted also used that id the endorsement is by the same user and returns 403 ERR_SEGREGATION_OF_DUTIES - priority 12 is satisfied and priority 14 is the first failing rule."
        test_recipe:
          setup:
            - "MINI-UNITS plus one CANDIDATE faculty member and one package of 20000000 with a matching EQUIPMENT tranche, submitted with X-User-ID set to the DEPARTMENT unit id so proposed_by_user_id equals department_unit_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { v4_col: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${v4_col}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { v4_dept: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${v4_col}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { v4_dean: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${v4_dept}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { v4_fac: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${v4_fac}", package_kind: "INITIAL", dean_unit_id: "${v4_dean}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { v4_pkg: $.data.id }
            - call: "POST /startup-packages/${v4_pkg}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 20000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
            - call: "POST /startup-packages/${v4_pkg}/submit"
              payload: {}
              as: DeanOffice
              as_user_id: "${v4_dept}"
          trigger:
            - call: "POST /startup-packages/${v4_pkg}/endorse"
              payload: {}
              as: DepartmentChair
              as_user_id: "${v4_dept}"
          assert:
            - "response code is 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "StartupPackage.${v4_pkg}.negotiation_status is still SUBMITTED and endorsed_by_user_id == null"
            - "priority 12 is satisfied: the acting chair's X-User-ID does equal department_unit_id"
            - "the same endorsement succeeds when the package was submitted by a different user id such as U-DEANOFFICE-1"

      - name: corner_val_chair_endorsing_another_departments_package_returns_unit_scope_violation
        claim_type: Violation to Error
        grounds:
          - validations.priority_12_ERR_UNIT_SCOPE_VIOLATION
          - complexity_profile.role_model
        distinguishing_aspect: "A DepartmentChair is scoped to the package's department_unit_id; acting with a second DEPARTMENT unit's id returns 403 ERR_UNIT_SCOPE_VIOLATION at priority 12, before the segregation-of-duties check at priority 14 could ever run."
        test_recipe:
          setup:
            - "MINI-UNITS with a SECOND department (Department of Physics) under the same college, plus one CANDIDATE faculty member in Chemistry and one SUBMITTED package of 20000000 proposed by U-DEANOFFICE-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { v5_col: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${v5_col}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { v5_dept: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Physics", unit_type: "DEPARTMENT", parent_unit_id: "${v5_col}", cost_share_pool_cents: 250000000 }
              as: DeanOffice
              captures: { v5_other: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${v5_col}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { v5_dean: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${v5_dept}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { v5_fac: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${v5_fac}", package_kind: "INITIAL", dean_unit_id: "${v5_dean}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { v5_pkg: $.data.id }
            - call: "POST /startup-packages/${v5_pkg}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 20000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
            - call: "POST /startup-packages/${v5_pkg}/submit"
              payload: {}
              as: DeanOffice
              as_user_id: "U-DEANOFFICE-1"
          trigger:
            - call: "POST /startup-packages/${v5_pkg}/endorse"
              payload: {}
              as: DepartmentChair
              as_user_id: "${v5_other}"
          assert:
            - "response code is 403 with error_id ERR_UNIT_SCOPE_VIOLATION"
            - "StartupPackage.${v5_pkg}.negotiation_status is still SUBMITTED and endorsed_by_user_id == null"
            - "the acting user differs from proposed_by_user_id, so priority 14 would have passed - priority 12 is the rule under test"
            - "the same call with as_user_id ${v5_dept} returns 200 and moves the package to DEAN_REVIEW"

      - name: corner_val_faculty_reading_another_faculty_package_returns_faculty_scope_violation
        claim_type: Violation to Error
        grounds:
          - validations.priority_13_ERR_FACULTY_SCOPE_VIOLATION
          - complexity_profile.role_model
        distinguishing_aspect: "The Faculty role is a peer role scoped by X-User-ID == the package's faculty_id: reading one's own package succeeds while reading a colleague's identical package returns 403 ERR_FACULTY_SCOPE_VIOLATION, not 404."
        test_recipe:
          setup:
            - "MINI-UNITS plus TWO CANDIDATE faculty members in the same department, each with their own DRAFT package of 20000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { v6_col: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${v6_col}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { v6_dept: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${v6_col}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { v6_dean: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${v6_dept}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { v6_fac_a: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ben Okafor", rank: "ASSISTANT", funding_unit_id: "${v6_dept}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { v6_fac_b: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${v6_fac_a}", package_kind: "INITIAL", dean_unit_id: "${v6_dean}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { v6_pkg_a: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${v6_fac_b}", package_kind: "INITIAL", dean_unit_id: "${v6_dean}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { v6_pkg_b: $.data.id }
          trigger:
            - call: "GET /startup-packages/${v6_pkg_b}"
              payload: {}
              as: Faculty
              as_user_id: "${v6_fac_a}"
          assert:
            - "response code is 403 with error_id ERR_FACULTY_SCOPE_VIOLATION - the package exists, so 404 would be wrong"
            - "GET /startup-packages/${v6_pkg_a} as the same Faculty user returns 200 with data.faculty_id == ${v6_fac_a}"
            - "GET /startup-packages/${v6_pkg_b} as DeanOffice returns 200 - the scope rule is role-conditional and only bites the Faculty role"

      - name: corner_val_award_without_any_phase_returns_no_phases_defined
        claim_type: Violation to Error
        grounds:
          - validations.priority_29_ERR_NO_PHASES_DEFINED
          - endpoints.POST_renovation_projects_id_award
        distinguishing_aspect: "Awarding a project that has no RenovationPhase rows returns 422 ERR_NO_PHASES_DEFINED even though the package is SPENDING, the faculty member is ACTIVE, the project is in BID and the RENOVATION tranche could easily cover the award - a construction sequence must exist before money is encumbered."
        test_recipe:
          setup:
            - "MINI-ACTIVE except that the 20000000 schedule is EQUIPMENT 12000000 plus RENOVATION 8000000 (both available 2026-07-01, expiring 2027-07-01, so both OPEN), plus one registered room carrying a COSMETIC renovation project with estimate 6000000 that has been sent out to bid but has no phases."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { v7_col: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${v7_col}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { v7_dept: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${v7_col}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { v7_dean: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${v7_dept}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { v7_fac: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${v7_fac}", package_kind: "INITIAL", dean_unit_id: "${v7_dean}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { v7_pkg: $.data.id }
            - call: "POST /startup-packages/${v7_pkg}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 12000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
            - call: "POST /startup-packages/${v7_pkg}/tranches"
              payload: { category: "RENOVATION", fiscal_year: 2027, amount_cents: 8000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
              captures: { v7_renov_tr: $.data.id }
            - call: "POST /startup-packages/${v7_pkg}/submit"
              payload: {}
              as: DeanOffice
              as_user_id: "U-DEANOFFICE-1"
            - call: "POST /startup-packages/${v7_pkg}/endorse"
              payload: {}
              as: DepartmentChair
              as_user_id: "${v7_dept}"
            - call: "POST /startup-packages/${v7_pkg}/approve"
              payload: {}
              as: Dean
              as_user_id: "${v7_col}"
            - call: "POST /faculty/${v7_fac}/activate"
              payload: {}
              as: DeanOffice
            - call: "POST /startup-packages/${v7_pkg}/activate"
              payload: {}
              as: DeanOffice
            - call: "POST /lab-spaces"
              payload: { building_code: "CHEM", room_number: "230", net_sq_ft: 900, space_class: "WET", power_kw_capacity: 120.00, chilled_water_available: true, fume_hood_count: 2, floor_load_psf: 300 }
              as: FacilitiesManager
              captures: { v7_space: $.data.id }
            - call: "POST /renovation-projects"
              payload: { package_id: "${v7_pkg}", space_id: "${v7_space}", scope_tier: "COSMETIC", estimate_cents: 6000000 }
              as: FacilitiesManager
              captures: { v7_proj: $.data.id }
            - call: "POST /renovation-projects/${v7_proj}/solicit-bids"
              payload: {}
              as: FacilitiesManager
          trigger:
            - call: "POST /renovation-projects/${v7_proj}/award"
              payload: { awarded_cents: 6000000 }
              as: Dean
              as_user_id: "${v7_col}"
          assert:
            - "response code is 422 with error_id ERR_NO_PHASES_DEFINED"
            - "RenovationProject.${v7_proj}.status is still BID with awarded_cents == null and awarded_on == null"
            - "CommitmentTranche.${v7_renov_tr}.encumbered_cents == 0 and available_balance_cents == 8000000 - nothing is encumbered by a rejected award"
            - "LabSpace.${v7_space}.status is still AVAILABLE - the UNDER_RENOVATION side effect did not fire"
            - "priority 18 and priority 21 are both satisfied (spend_status SPENDING, faculty ACTIVE) and priority 43 would also have passed, so priority 29 is the rule under test"

      - name: corner_val_substantial_completion_with_an_active_phase_returns_phases_incomplete
        claim_type: Violation to Error
        grounds:
          - validations.priority_30_ERR_PHASES_INCOMPLETE
          - state_machines.RenovationPhase.transitions.PENDING_to_ACTIVE
        distinguishing_aspect: "Substantial completion requires every phase COMPLETE with a non-null actual_cost_cents; with phase 1 COMPLETE and phase 2 still ACTIVE the call returns 409 ERR_PHASES_INCOMPLETE and the FINAL_ACTUAL variant never runs, so no reconciliation row is written."
        test_recipe:
          setup:
            - "The ERR_NO_PHASES_DEFINED fixture, but with two phases (Demolition 2026-09-01..2026-09-10 budget 3000000 and Casework 2026-09-13..2026-09-20 budget 3000000, a 3-day changeover that clears PHASE_BUFFER_DAYS), awarded at 6000000 so the COSMETIC charge of 6000000 is encumbered against the RENOVATION tranche, then phase 1 started and completed at 3000000 and phase 2 started."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
