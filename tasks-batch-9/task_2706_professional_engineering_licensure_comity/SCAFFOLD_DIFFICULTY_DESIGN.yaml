              as: Applicant
              as_user_id: "${eng_tomas}"
              captures: { app_tomas: $.data.id }
            - call: "POST /applications/${app_tomas}/education-evaluation"
              payload: { degree_level: "BS", accreditation_finding: "EABET_ACCREDITED" }
