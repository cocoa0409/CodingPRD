            - "Second response: HTTP 200 with data.assigned_loan_application_id null, data.lien_position null and len(data.lien_history) == 1 pointing at ${app_a}"
            - "Second response: data.lending_value_cents == 225000000 — re-valued at first-lien factor now that it is free"
