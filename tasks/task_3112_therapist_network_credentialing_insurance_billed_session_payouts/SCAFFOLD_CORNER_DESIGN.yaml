  # ===========================================================================
  - section: consistency_model
    instances:

      - name: a_regression_recomputed_denial_corrects_the_previously_committed_line
        claim_type: saga
        grounds:
          - complexity_profile.consistency_model
          - calculations.denial_clawback_adjustment_cents
          - calculations.clinician_payout_line_amount_cents
          - state_machines.Claim.transitions.PAID_to_DENIED
          - endpoints.POST_/network/claims/{id}/adjudicate
        distinguishing_aspect: "A later denial against an already-locked line is compensated rather than silently tolerated: the original line's committed earning is reduced by an equal and opposite adjustment, leaving the net sum over the clinician's lines at zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z, then 2026-06-03T18:00:00Z; a completed, billed and paid session on a locked batch, followed by a second batch for a later period."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_rate
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - *c_enroll
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
            - *c_patient
            - *c_verification
            - *c_session
            - call: "POST /network/sessions/${session_id}/schedule"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { session_v1: $.data.version }
            - call: "POST /network/sessions/${session_id}/notes"
              payload: { diagnosis_code: "F41.1", duration_minutes: 60, cpt_code: "90837", narrative: "Note for the saga compensation corner.", expected_session_version: "${session_v1}" }
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { note_id: $.data.id }
            - call: "POST /network/sessions/${session_id}/notes/${note_id}/sign"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-06-03T18:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/sessions/${session_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/claims"
              payload: { session_id: "${session_id}" }
              as: OpsAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /network/claims/${claim_id}/adjudicate"
              payload: { outcome: "PAID" }
              as: OpsAdmin
            - call: "POST /network/payout-batches"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z", schedule: "WEEKLY" }
              as: OpsAdmin
              captures: { batch_id: $.data.id }
            - call: "POST /network/payout-batches/${batch_id}/lock"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "GET /network/payout-batches/${batch_id}/lines"
              payload: { limit: 10, offset: 0 }
              as: OpsAdmin
              captures: { line_status_before: $.data.0.line_status, line_net_before: $.data.0.net_cents, line_gross_before: $.data.0.gross_cents }
            - call: "POST /network/claims/${claim_id}/adjudicate"
              payload: { outcome: "DENIED", denial_code: "DUPLICATE" }
              as: OpsAdmin
            - call: "GET /network/payout-batches/${batch_id}/lines"
              payload: { limit: 10, offset: 0 }
              as: OpsAdmin
              captures: { line_status_after: $.data.0.line_status, line_net_after: $.data.0.net_cents, line_adj_after: $.data.0.adjustment_cents }
            - call: "GET /network/payout-batches/${batch_id}"
              payload: {}
              as: OpsAdmin
              captures: { batch_status: $.data.status, batch_total: $.data.total_net_cents }
          assert:
            - "the regression adjudication returns status 200 and Claim.${claim_id}.claim_status == DENIED with denial_code DUPLICATE"
            - "before the regression the line reads ${line_status_before} == PENDING with ${line_net_before} == 15000 and ${line_gross_before} == 15000"
            - "after the regression the same line reads ${line_status_after} == PENDING with ${line_net_after} == 0 and adjustment_cents == ${line_adj_after} == -15000"
            - "the compensation deflates the line rather than un-paying it: gross_cents is still 15000 and the reversal appears entirely in adjustment_cents"
            - "the floor is what keeps the status unchanged, since a PENDING line whose net is floored at zero stays PENDING rather than becoming CLAWED_BACK"
            - "Session.${session_id}.billing_state == DENIED after the regression, so the session axis followed the claim"
            - "PayoutBatch.${batch_id}.total_net_cents is still ${batch_total} == 15000 because totals were frozen as a snapshot at lock, while the live line net now reads 0"
            - "PayoutBatch.${batch_id}.status == ${batch_status} == LOCKED, so the reversal did not reopen or close the batch"

      - name: a_rejected_slice_leaves_the_period_open_with_no_partial_lines
        claim_type: saga
        grounds:
          - complexity_profile.consistency_model
          - state_machines.PayoutBatch.transitions.OPEN_to_LOCKED
          - errors.ERR_BATCH_NOT_LOCKABLE
          - endpoints.POST_/network/payout-batches/{id}/lock
        distinguishing_aspect: "The lock is atomic: when its guard fails, the batch keeps zero lines and zero totals rather than leaving a partially materialized set, so a subsequent attempt after the guard is satisfied produces the full line set in one step."
        test_recipe:
          setup:
