          trigger:
            - call: "POST /merge-requests/${mr_id}/transitions"
              payload: { action: "APPLY" }
              as: LmsAdmin
              as_user_id: "adm-2"
              captures: { mr_state_applied: $.data.merge_state, moved: $.data.moved_enrollment_count, ledger_before: $.data.seat_ledger_before, ledger_after: $.data.seat_ledger_after }
            - call: "GET /course-shells/${parent_id}"
              payload: {}
              as: LmsAdmin
              captures: { parent_active_merged: $.data.active_enrollment_count, parent_util_merged: $.data.seat_utilization_pct, parent_overflow_merged: $.data.overflow_flag, absorbed: $.data.absorbed_child_count }
            - call: "GET /course-shells/${child_id}"
              payload: {}
              as: LmsAdmin
              captures: { child_state_merged: $.data.provisioning_state, child_active_merged: $.data.active_enrollment_count, child_merged_into: $.data.merged_into_shell_id }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: Registrar
              captures: { headcount_merged: $.data.total_active_enrollments, overflow_shells: $.data.overflow_shell_count }
            - call: "POST /merge-requests/${mr_id}/transitions"
              payload: { action: "REVERSE" }
              as: LmsAdmin
              as_user_id: "adm-2"
              captures: { mr_state_reversed: $.data.merge_state, reversed_count: $.data.reversed_enrollment_count }
            - call: "GET /course-shells/${parent_id}"
              payload: {}
              as: LmsAdmin
              captures: { parent_active_after: $.data.active_enrollment_count, parent_util_after: $.data.seat_utilization_pct, parent_overflow_after: $.data.overflow_flag, absorbed_after: $.data.absorbed_child_count }
            - call: "GET /course-shells/${child_id}"
              payload: {}
              as: LmsAdmin
              captures: { child_state_after: $.data.provisioning_state, child_active_after: $.data.active_enrollment_count, child_merged_into_after: $.data.merged_into_shell_id }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: Registrar
              captures: { headcount_after: $.data.total_active_enrollments }
            - call: "GET /enrollments"
              payload: { merged_from_shell_id: "${child_id}" }
              as: Registrar
          assert:
            - "${adds} == 13, ${headcount_before} == 13, ${parent_active_before} == 8, ${child_active_before} == 5, ${parent_util_before} == 80.00"
            - "${submitter} == \"adm-1\", ${decider} == \"adm-2\" and ${mr_state_approved} == APPROVED (segregation of duties satisfied)"
            - "${mr_state_applied} == APPLIED, ${moved} == 5, ${ledger_before} == 13 and ${ledger_after} == 13 — the invariant is recorded on the row itself"
            - "${parent_active_merged} == 13, ${child_active_merged} == 0, ${child_state_merged} == MERGED, ${child_merged_into} == ${parent_id} and ${absorbed} == 1"
            - "${headcount_merged} == 13 — SUM(shell.active_enrollment_count) still equals the term total; double-counting the relocated rows would read 18"
            - "${parent_util_merged} == 130.00 with ${parent_overflow_merged} == true and ${overflow_shells} == 1 — APPLY deliberately overfills the parent and triggers NO waitlist promotion"
            - "${mr_state_reversed} == REVERSED and ${reversed_count} == ${moved} == 5 (exactly the rows the APPLY moved, no more)"
            - "${parent_active_after} == 8, ${child_active_after} == 5, ${headcount_after} == 13, ${parent_util_after} == 80.00, ${parent_overflow_after} == false and ${absorbed_after} == 0 — every field is byte-for-byte back to its pre-APPLY value"
            - "${child_state_after} == PROVISIONED and ${child_merged_into_after} is null; a shell that was PUBLISHED before a merge would come back as PROVISIONED, not PUBLISHED"
            - "the final GET /enrollments filtered by merged_from_shell_id returns ZERO rows — merged_from_shell_id is cleared on every returned row, leaving no trace of the relocation on the enrollments themselves"

      - name: rollover_compensation_returns_the_source_target_pair_to_five_hundred_seventy_stored_megabytes
        grounds:
          - state_machines.RolloverJob.job_state.COPYING_to_FAILED
          - state_machines.RolloverJob.job_state.FAILED_to_COMPENSATED
          - calculations.sandbox_storage_chargeback
          - calculations.term_rollover_completion_pct
          - endpoints.POST_/rollover-jobs/{id}/transitions
          - entities.CourseShell.fields.storage_mb
          - entities.ContentItem.fields.copy_state
        distinguishing_aspect: |
          The conserved quantity is a DECIMAL storage quantity summed across a
          shell PAIR — source 570.00 MB + target 0.00 MB — and it is restored by
          zeroing the copies' own storage_mb rather than by moving rows back, so
          the copy ContentItem rows SURVIVE the compensation as SKIPPED
          provenance records. A second, derived quantity (the owner's
          sandbox_storage_charge_usd) rides the same undo and must return to 0.00,
          and the term's rollover_completion_pct must never have advanced in the
          first place. The headcount instance conserves an integer across one
          entity's two children; the points instance conserves a ledger inside one
          entity.
        setup_note: "The 570.00 MB source is deliberately above the 500.00 MB SANDBOX quota, so EXECUTE is guaranteed to take the FAILED branch of its fork rather than COMPLETED."
        test_recipe:
          setup:
            - "Term 2026SP holds an OFFICIAL shell that has been CONCLUDED with three FILE content items of 250.00, 200.00 and 120.00 MB, so source_shell.storage_mb == 570.00."
            - "Term 2026FA holds an empty SANDBOX shell owned by the same instructor (PROVISIONED, storage_mb 0.00, sandbox_expires_at 2027-02-09) and one OFFICIAL shell that gives the term a non-empty rollover denominator."
            - "The logical clock is left at its 2026-08-01T00:00:00Z startup default, comfortably inside the sandbox shell's expiry."
            - "The owner's sandbox_storage_charge_usd is 0.00 before the copy: the only billable shell holds 0.00 MB, which is under the 100.00 MB free tier."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026SP", term_start_at: "2026-01-12T00:00:00Z", term_end_at: "2026-05-08T00:00:00Z" }
              as: Registrar
              captures: { sp_term: $.data.id }
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { fa_term: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-2001", full_name: "Grace Hopper", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${sp_term}", owner_person_id: "${prof_id}", sis_section_code: "CS600-01", shell_type: "OFFICIAL", base_seat_cap: 30 }
              as: LmsAdmin
              captures: { src_id: $.data.id }
            - call: "POST /course-shells/${src_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /content-items"
              payload: { shell_id: "${src_id}", item_type: "FILE", title: "Week 1 lecture capture", points_possible: 0, storage_mb: 250.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_a: $.data.id, item_a_copy_state: $.data.copy_state }
            - call: "POST /content-items"
              payload: { shell_id: "${src_id}", item_type: "FILE", title: "Week 2 lecture capture", points_possible: 0, storage_mb: 200.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_b: $.data.id }
            - call: "POST /content-items"
              payload: { shell_id: "${src_id}", item_type: "FILE", title: "Reading pack", points_possible: 0, storage_mb: 120.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_c: $.data.id }
            - call: "GET /course-shells/${src_id}"
              payload: {}
              as: LmsAdmin
              captures: { src_storage_before: $.data.storage_mb, src_items_before: $.data.content_item_count }
            - call: "POST /course-shells/${src_id}/lifecycle-transitions"
              payload: { target_state: "CONCLUDED" }
              as: Registrar
              captures: { src_state: $.data.provisioning_state }
            - call: "POST /course-shells"
              payload: { term_id: "${fa_term}", owner_person_id: "${prof_id}", sis_section_code: "SBX-CS600", shell_type: "SANDBOX", base_seat_cap: 1 }
              as: LmsAdmin
              captures: { tgt_id: $.data.id }
            - call: "POST /course-shells/${tgt_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              captures: { tgt_expiry: $.data.sandbox_expires_at }
            - call: "POST /course-shells"
              payload: { term_id: "${fa_term}", owner_person_id: "${prof_id}", sis_section_code: "CS600-01-FA", shell_type: "OFFICIAL", base_seat_cap: 30 }
              as: LmsAdmin
              captures: { fa_official: $.data.id }
            - call: "POST /course-shells/${fa_official}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "GET /people/${prof_id}"
              payload: {}
              as: Registrar
              captures: { charge_before: $.data.sandbox_storage_charge_usd }
            - call: "GET /academic-terms/${fa_term}"
              payload: {}
              as: Registrar
              captures: { pct_before: $.data.rollover_completion_pct }
            - call: "GET /course-shells/${tgt_id}"
              payload: {}
              as: LmsAdmin
              captures: { tgt_v: $.data.version, tgt_storage_before: $.data.storage_mb, tgt_items_before: $.data.content_item_count }
            - call: "POST /rollover-jobs"
              payload: { source_shell_id: "${src_id}", target_shell_id: "${tgt_id}", target_term_id: "${fa_term}", expected_target_shell_version: "${tgt_v}", strip_dates: true, strip_submissions: true, strip_grades: true }
              as: LmsAdmin
              captures: { job_id: $.data.id, job_state_draft: $.data.job_state }
            - call: "POST /rollover-jobs/${job_id}/transitions"
              payload: { action: "VALIDATE" }
              as: LmsAdmin
              captures: { job_state_validated: $.data.job_state, eligible: $.data.eligible_item_count }
          trigger:
            - call: "POST /rollover-jobs/${job_id}/transitions"
              payload: { action: "EXECUTE" }
              as: LmsAdmin
              captures: { job_state_failed: $.data.job_state, copied: $.data.copied_item_count, copied_mb: $.data.copied_storage_mb, failure_reason: $.data.failure_reason }
            - call: "GET /course-shells/${tgt_id}"
              payload: {}
              as: LmsAdmin
              captures: { tgt_storage_failed: $.data.storage_mb, tgt_items_failed: $.data.content_item_count }
            - call: "GET /people/${prof_id}"
              payload: {}
              as: Registrar
              captures: { charge_failed: $.data.sandbox_storage_charge_usd }
            - call: "GET /academic-terms/${fa_term}"
              payload: {}
              as: Registrar
              captures: { pct_failed: $.data.rollover_completion_pct }
            - call: "POST /rollover-jobs/${job_id}/transitions"
              payload: { action: "COMPENSATE", reason: "sandbox over quota; unwind the copy" }
              as: LmsAdmin
              captures: { job_state_comp: $.data.job_state, copied_after: $.data.copied_item_count, copied_mb_after: $.data.copied_storage_mb }
            - call: "GET /course-shells/${tgt_id}"
              payload: {}
              as: LmsAdmin
              captures: { tgt_storage_after: $.data.storage_mb, tgt_items_after: $.data.content_item_count, tgt_points_after: $.data.total_points_possible }
            - call: "GET /course-shells/${src_id}"
              payload: {}
              as: LmsAdmin
              captures: { src_storage_after: $.data.storage_mb, src_items_after: $.data.content_item_count }
            - call: "GET /people/${prof_id}"
              payload: {}
              as: Registrar
              captures: { charge_after: $.data.sandbox_storage_charge_usd }
            - call: "GET /content-items"
              payload: { shell_id: "${tgt_id}", copy_state: "SKIPPED" }
              as: LmsAdmin
            - call: "GET /content-items"
              payload: { source_item_id: "${item_a}" }
              as: LmsAdmin
            - call: "GET /content-items/${item_a}"
              payload: {}
              as: LmsAdmin
              captures: { src_item_a_state: $.data.copy_state, src_item_a_mb: $.data.storage_mb }
          assert:
            - "${item_a_copy_state} == SOURCE, ${src_storage_before} == 570.00, ${src_items_before} == 3, ${src_state} == CONCLUDED"
            - "${tgt_expiry} == \"2027-02-09T00:00:00Z\" (term_end_at 2026-12-11 + SANDBOX_GRACE_DAYS 60), so the 2026-08-01 clock is inside the window and ERR_SANDBOX_EXPIRED is not in play"
            - "${charge_before} == 0.00, ${tgt_storage_before} == 0.00, ${tgt_items_before} == 0, ${pct_before} == 0.00 (one eligible OFFICIAL FA shell, zero completed)"
            - "${job_state_draft} == DRAFT, ${job_state_validated} == VALIDATED and ${eligible} == 3"
            - "${job_state_failed} == FAILED — the EXECUTE fork takes the quota branch, NOT COMPLETED — with ${failure_reason} == \"sandbox storage quota exceeded\", ${copied} == 3 and ${copied_mb} == 570.00"
            - "${tgt_storage_failed} == 570.00 and ${tgt_items_failed} == 3 — the over-quota state is observable rather than rolled back inside the EXECUTE request"
            - "${charge_failed} == 7.05 — max(0.00, 570.00 - 100.00) * 0.0150 * 1.00 = 7.05; the rollover copy is a storage_mb change and therefore re-runs the chargeback"
            - "${pct_failed} == ${pct_before} == 0.00 — the FAILED branch must NOT advance term_rollover_completion_pct"
            - "${job_state_comp} == COMPENSATED, and ${copied_after} == 3 with ${copied_mb_after} == 570.00 — the audit tallies of what was undone are deliberately NOT zeroed"
            - "${tgt_storage_after} == 0.00, ${tgt_items_after} == 0 and ${tgt_points_after} == 0.00 — the target is exactly back to its pre-EXECUTE reading, not merely close to it"
            - "${src_storage_after} == 570.00 and ${src_items_after} == 3, and ${src_item_a_state} == SOURCE with ${src_item_a_mb} == 250.00 — compensation touches only the copies, so the pair's total returns from 1140.00 MB to 570.00 MB"
            - "${charge_after} == 0.00 — the derived money figure rides the undo back to its pre-EXECUTE value with no residue"
            - "GET /content-items filtered by shell_id + copy_state=SKIPPED returns 3 rows and GET /content-items filtered by source_item_id=${item_a} returns 1 row, each with storage_mb 0.00 — the copies survive as provenance and are NOT deleted"

      - name: upheld_grade_dispute_releases_the_escrow_with_a_zero_drift_two_hundred_fifty_point_ledger
        grounds:
          - calculations.passback_points_ledger
          - state_machines.GradeDispute.dispute_state.OPEN_to_RESOLVED_UPHELD
          - state_machines.GradePassback.passback_state.ACCEPTED_to_DISPUTED
          - endpoints.POST_/grade-disputes
          - endpoints.POST_/grade-disputes/{id}/resolve
          - entities.GradePassback.fields.accepted_points_total
          - entities.GradePassback.fields.disputed_points_held
        distinguishing_aspect: |
          The conserved quantity is a THREE-BUCKET DECIMAL LEDGER inside one
          entity, held together by the named identity accepted_points_total +
          disputed_points_held == submitted_points_total. The compensating pair is
          E4 (file) followed by E5 (uphold): the escrow leaves accepted, sits in
          disputed, and comes back, while submitted_points_total never moves at
          all — the discriminator against the sibling CHANGED branch, which
          legitimately moves submitted_points_total. A parent counter
          (AcademicTerm.open_amendment_count) must also come back to 0, which is
          what re-opens the term's route to CLOSED. Neither other instance has a
          conservation law written as an equation over three fields of one row.
        setup_note: "One 200.00-point ASSIGNMENT and two graded students give a clean 160.00 + 90.00 = 250.00 submission, and the disputing student holds the smaller of the two amounts so accepted_points_total lands on a distinct 160.00 mid-flight."
        test_recipe:
          setup:
            - "Term 2026FA is walked PLANNING -> REGISTRATION_OPEN -> IN_SESSION, an OFFICIAL shell is published, then the term is moved to FINALS so a passback can be staged."
            - "The shell holds one ASSIGNMENT worth 200.00 points; student s1 is graded 160.00 and student s2 is graded 90.00."
            - "The instructor stages and submits the passback; a distinct registrar user accepts it, satisfying segregation of duties."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
