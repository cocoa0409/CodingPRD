              as: PlatformAdmin
              captures: { sea_dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "DD-1001", description: "Pipe fitting elbow 1 inch", material_spec: "brass", long_tail: false, unit_price_cents: 3000, unit_weight_kg: 0.20, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 40, nominal_width_mm: 40, nominal_height_mm: 40, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_non_lt_id: $.data.id }
