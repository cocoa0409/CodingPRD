        excluded_because:
          difficulty_instance: resource_temporal_overlap / election_binding_years_closed_interval_overlap
          rationale: "The overlap rejection is the first trigger call of that difficulty instance."

      - name: vda_window_overlap_error_trigger
        claim_type: error_triggerable
        grounds:
          - errors[ERR_VDA_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / vda_lookback_window_half_open_with_cooling_buffer
          rationale: "The buffered-window rejection is the first trigger call of that difficulty instance."

      - name: factor_denominator_zero_error_trigger
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FACTOR_DENOMINATOR_ZERO]
        excluded_because:
          difficulty_instance: combinatorial_formula / factor_weight_renormalization_on_zero_denominator
          rationale: "That difficulty instance pins both the surviving-factor path and the condition under which no factor survives."

      - name: election_basis_mismatch_error_trigger
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ELECTION_BASIS_MISMATCH]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / file_gated_by_governing_election_status
          rationale: "The mismatch rejection and the successful retry after reinstatement are both asserted there."

