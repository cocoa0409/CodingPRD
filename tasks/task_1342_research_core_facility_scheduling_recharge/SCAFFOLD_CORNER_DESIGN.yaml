  # Section 3 — calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: external_booking_pins_external_rate
        claim_type: variant_selection
        grounds:
          - "calculations.usage_charge"
          - "entities.Booking.fields.applied_rate_cents_per_hour"
        distinguishing_aspect: "Approval pins the rate by affiliation: an EXTERNAL booker's 60-minute session estimates at 60 x 300 = 18000 cents with encumbered_cents == 0 (no grant debit), while INTERNAL would pin 12000/h."
        test_recipe:
          setup: ["canonical stack; u2 EXTERNAL with CERTIFIED training; b_ext by u2 2026-09-01 09:00-10:00 REQUESTED (no grant)"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Eve Ext", email: "eve@acme.com", affiliation: "EXTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u2: $.data.id } }
