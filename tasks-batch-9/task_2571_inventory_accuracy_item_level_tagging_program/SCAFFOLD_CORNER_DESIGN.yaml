              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/tag-batches"
              payload: { vendor_id: "${vendor1}", item_id: "${item_tee1}", destination_store_id: "${store_s100}", quantity_encoded: 1000 }
              as: VendorRep
              as_user_id: "${vendor1}"
              captures: { batch1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/tag-batches/${batch1}/verify"
              payload: { sampled_units: 50, readable_units: 50, duplicate_epc_count: 0, unencoded_units: 0 }
              as: StoreOps
              as_user_id: "${store_s100}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 409 and data.error_id == \"ERR_TAG_BATCH_INVALID_STATE\""
            - "GET /inventory-integrity/tag-batches/${batch1} still reads status \"DRAFT\", sampled_units 0, read_rate_bps 0 and verification_outcome null"
            - "GET /inventory-integrity/vendors/${vendor1} still reads tag_compliance_score_bps 10000 — a rejected verify moves no vendor score"

      - name: tag_batch_verified_pass_is_terminal_and_rejects_rework
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TagBatch.terminal_states
          - validations.priority_40_ERR_TAG_BATCH_INVALID_STATE
        distinguishing_aspect: "VERIFIED_PASS is a declared terminal state, so rework (declared only from VERIFICATION_FAILED) returns ERR_TAG_BATCH_INVALID_STATE (409) and rework_round stays 0."
        test_recipe:
          setup:
            - "A TagBatch for VEND1 / TEE-001 / S100 with quantity_encoded 1000, encoded (required_sample_units 50) and received."
            - "It is verified with sampled 50 / readable 50 / duplicates 0 / unencoded 0, i.e. read_rate_bps 10000 >= 9800, so it PASSES and lands in the terminal state."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750 }
