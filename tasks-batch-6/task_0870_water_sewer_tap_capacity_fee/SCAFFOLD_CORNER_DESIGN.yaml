              as: Developer
              as_user_id: "dev-1"
              captures: { pwv: "$.data.id" }
            - call: "POST /developer-agreements"
              payload: { main_extension_project_id: "${pwv}", developer_user_id: "dev-1" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { gwv: "$.data.id" }
            - call: "POST /developer-agreements/${gwv}/offer"
              payload: {}
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { gwv_v: "$.data.version" }
            - call: "POST /developer-agreements/${gwv}/escrow-transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 4000000, expected_developer_agreement_version: "${gwv_v}" }
              as: Developer
              as_user_id: "dev-1"
            - call: "POST /developer-agreements/${gwv}/execute"
              payload: {}
              as: Developer
              as_user_id: "dev-1"
            - call: "POST /main-extension-projects/${pwv}/start-construction"
              payload: {}
              as: Developer
              as_user_id: "dev-1"
            - call: "POST /inspectors"
              payload: { name: "Insp WV" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { insp_wv: "$.data.id" }
            - call: "POST /main-extension-projects/${pwv}/record-inspection"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_wv}"
            - call: "POST /main-extension-projects/${pwv}/accept"
              payload: { actual_construction_cost_cents: 5000000 }
              as: UtilityReviewer
              as_user_id: "rev-1"
              captures: { pwv_v: "$.data.version" }
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-WVB", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-2"
              captures: { bwv: "$.data.id" }
            - call: "POST /latecomer-reimbursements"
              payload: { main_extension_project_id: "${pwv}", benefiting_application_id: "${bwv}", method: "FRONT_FOOTAGE", parcel_front_ft: 50, parcel_area_sqft: 8000, expected_main_extension_project_version: "${pwv_v}" }
              as: UtilityAdmin
