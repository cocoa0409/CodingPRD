      - name: err_no_certified_contests_and_ballot_order_collision_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_NO_CERTIFIED_CONTESTS
          - errors.ERR_BALLOT_ORDER_COLLISION
          - validations.ballot-order-well-defined
          - validations.candidate-state-permits-operation
        distinguishing_aspect: "The two ordering errors sit on opposite sides of certification. ERR_NO_CERTIFIED_CONTESTS fires when the election-wide ordering pass is run with an empty input set, while ERR_BALLOT_ORDER_COLLISION fires earlier, at contest certification, and is symmetric: two DRAFT contests sharing (contest_type, district_code, title) each block the other, so neither can ever be certified. The same call also shows ERR_CANDIDATE_STATE_INVALID guarding a CANDIDATE contest that cannot fill its seats."
        test_recipe:
          setup:
            - "A SETUP election carrying four DRAFT contests: two twins that share the triple (CANDIDATE, D-12, \"County Sheriff\"), an under-filled two-seat contest, and one MEASURE contest with no candidates at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1 }
              as: BallotCoordinator
              captures: { ct_a: $.data.id }
            - call: "POST /contests/${ct_a}/candidates"
              payload: { full_name: "Ana Alvarez", ballot_name: "Alvarez", filing_received_at: "2026-06-01T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1 }
              as: BallotCoordinator
              captures: { ct_b: $.data.id }
            - call: "POST /contests/${ct_b}/candidates"
              payload: { full_name: "Ben Brooks", ballot_name: "Brooks", filing_received_at: "2026-06-02T09:00:00Z", party_code: "GRN" }
              as: BallotCoordinator
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Clerk", contest_type: "CANDIDATE", district_code: "D-19", seats_open: 2 }
              as: BallotCoordinator
              captures: { ct_d: $.data.id }
            - call: "POST /contests/${ct_d}/candidates"
              payload: { full_name: "Cara Chen", ballot_name: "Chen", filing_received_at: "2026-06-03T09:00:00Z", party_code: "NPP" }
              as: BallotCoordinator
            - call: "POST /elections/${el}/contests"
              payload: { title: "Bond Measure A", contest_type: "MEASURE", district_code: "D-07", seats_open: 1 }
              as: BallotCoordinator
              captures: { ct_c: $.data.id }
          trigger:
            - call: "POST /elections/${el}/certify-ballot-order"
              payload: {}
              as: ElectionsDirector
              captures: { e_none: $.data.error_id }
            - call: "POST /contests/${ct_a}/certify"
              payload: {}
              as: ElectionsDirector
              captures: { e_col_a: $.data.error_id }
            - call: "POST /contests/${ct_b}/certify"
              payload: {}
              as: ElectionsDirector
              captures: { e_col_b: $.data.error_id }
            - call: "POST /contests/${ct_d}/certify"
              payload: {}
              as: ElectionsDirector
              captures: { e_seats: $.data.error_id }
            - call: "POST /contests/${ct_c}/certify"
              payload: {}
              as: ElectionsDirector
              captures: { c_status: $.data.status, c_cands: $.data.certified_candidate_count }
            - call: "POST /elections/${el}/certify-ballot-order"
              payload: {}
              as: ElectionsDirector
              captures: { el_status: $.data.status, el_certified: $.data.certified_contest_count }
            - call: "GET /contests/${ct_c}"
              payload: {}
              as: ElectionsDirector
              captures: { c_idx: $.data.ballot_order_index }
            - call: "GET /contests/${ct_a}"
              payload: {}
              as: ElectionsDirector
              captures: { a_status: $.data.status, a_idx: $.data.ballot_order_index }
          assert:
            - "${e_none} == \"ERR_NO_CERTIFIED_CONTESTS\" (HTTP 409): the election is in SETUP, so the phase gate at priority 70 passes and the business check at priority 110 is what refuses an empty ordering pass; election.status is still SETUP after the call."
            - "${e_col_a} == \"ERR_BALLOT_ORDER_COLLISION\" and ${e_col_b} == \"ERR_BALLOT_ORDER_COLLISION\" (both HTTP 409): the guard is symmetric because the twin only has to be DRAFT or CERTIFIED, so neither twin can ever be certified and the ordering pass can never be handed an ambiguous input set."
            - "${e_seats} == \"ERR_CANDIDATE_STATE_INVALID\" (HTTP 409): ct_d is a CANDIDATE contest with one FILED candidate and seats_open 2, so 1 < 2 refuses certification even though its triple is unique."
            - "${c_status} == \"CERTIFIED\" with ${c_cands} == 0 (HTTP 200): a MEASURE contest is exempt from the seats check and certifies with no candidates at all."
            - "${el_status} == \"CONTESTS_CERTIFIED\" and ${el_certified} == 1 - only the measure made it through, and the second run of certify-ballot-order now has a non-empty input set."
            - "${c_idx} == 1: the sole certified contest takes the first printed position."
            - "${a_status} == \"DRAFT\" and ${a_idx} is null: the ordering pass assigns indices to CERTIFIED contests only and leaves the blocked twins untouched."

      - name: err_segregation_of_duties_id_covered_by_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - segregation_of_duties_constraints
        distinguishing_aspect: "ERR_SEGREGATION_OF_DUTIES is the one error id whose trigger is a relation between two actors rather than a state or a value, and its most demanding form - beating a lower-priority observer-minimum failure on the same call - is already built as a difficulty instance."
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / pp_segregation_beats_observer_constraint"
          rationale: >
            That instance drives POST /la-test-sessions/{id}/start with the proofing coordinator as the
            conductor while the session also has too few observers, and asserts the 80-priority
            ERR_SEGREGATION_OF_DUTIES is returned instead of the 110-priority
            ERR_INSUFFICIENT_OBSERVERS - which establishes both that the id is triggerable and that it
            outranks the observer check. Restating a plain single-fault version here would test strictly
            less than the difficulty instance already does.

