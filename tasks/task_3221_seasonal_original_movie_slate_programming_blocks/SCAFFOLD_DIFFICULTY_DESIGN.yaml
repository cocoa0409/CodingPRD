            - "the subsequent 1-day booking fails: err == ERR_PRODUCTION_QUOTA_EXCEEDED (31 > 30)"
            - "http status of the failing call == 409"

      - name: encore_cap_equality_boundary
        grounds:
          - calculations.encore_cap_check
