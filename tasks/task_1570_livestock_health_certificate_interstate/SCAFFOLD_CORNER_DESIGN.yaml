      - name: certificate_void_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Certificate.ISSUED_to_VOID
          - state_machines.Certificate
          - errors[ERR_CERTIFICATE_NOT_SUBMITTABLE]
          - errors[ERR_CERTIFICATE_NOT_PENDING_REVIEW]
          - errors[ERR_CERTIFICATE_NOT_TRANSMITTABLE]
          - errors[ERR_CERTIFICATE_NOT_VOIDABLE]
          - errors[ERR_CERTIFICATE_NOT_REVISABLE]
        distinguishing_aspect: |
          VOID is terminal: after voiding an ISSUED certificate every other
          action trigger (submit, issue, transmit, void, revise) is rejected
          with its state error, and void_reason records the request payload.
        test_recipe:
          setup:
            - "ISSUED certificate (NONE matrix) at clock 2026-08-10"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch S7", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 30, disease_status: "MONITORED" }
