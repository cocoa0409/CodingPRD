        distinguishing_aspect: "The pipeline refuses in three different ways and the ladder order decides which: ISSUE_LICENSE from STUDENT is refused at priority 52 as an illegal action (409) rather than at 84 for eligibility; a STUDENT short of the clock-hour requirement is refused at 84 with ERR_EXAM_ELIGIBILITY_REQUIRED (409); and a STUDENT who has the 16.0 hours but no DISINFECTION-discipline record is refused at 86 with ERR_TRAINING_HOURS_INSUFFICIENT (422)."
