# SCAFFOLD_DIFFICULTY_DESIGN.yaml
# Depth probe (SKILL.md §1.8) for task_2290_immigration_legal_services_program.
# Difficulty target: expert_plus ("harder than expert") -> every instance is a
# multi-hop, exactly-arithmetic probe derived only from rules that exist in
# SCAFFOLD.yaml (§1.1-§1.7).
#
# CONVENTIONS USED THROUGHOUT THIS FILE
#   * The logical clock starts at the SCAFFOLD-mandated default 2026-08-01T00:00:00Z;
#     every recipe re-pins it explicitly with POST /_clock/set_current_utc.
#   * `${var}` tokens are ONLY server-minted ids / versions / timestamps and are always
#     bound by an earlier `captures:` in the same recipe (placeholder closure holds).
#     Every author-computable value is written as a literal.
#   * All `expected_matter_version` / `expected_recognition_version` values are `${var}`
#     re-read from a GET immediately before the OCC-guarded call (never a bare literal).
#   * `as_user_id` is supplied for every entity_backed role (IntakeScreener,
#     SupervisingAttorney, CaseRepresentative, ClientPortalUser) and omitted for the
#     opaque roles (ProgramDirector, GrantAnalyst).
#   * assert strings name trigger steps as "step N" in trigger order, and cite exact
#     field names with pre-computed literal values (no formulas left unevaluated).

scaffold_difficulty_design:

  # =====================================================================
  # RULE 1 - dual_variant_calc
  # Two calculations that each carry an explicit variant selector, on two
  # DIFFERENT entity domains: intake_urgency_score (IntakeScreening) and
  # matter_readiness_index (CaseMatter).
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: urgency_calendar_inclusive_vs_strict_statutory_anchor_divergence
        grounds:
          - calculations.intake_urgency_score
          - calculations.legal_eligibility_verdict
          - entities.IntakeScreening.fields.urgency_variant_applied
          - entities.IntakeScreening.fields.urgency_anchor_date
          - state_machines.IntakeScreening.DRAFT_to_SCREENED
        distinguishing_aspect: |
          Two IntakeScreening rows for the SAME client carrying byte-identical case_type,
          statutory_deadline_date and risk flags select different urgency variants purely
          from `detained`: the detained row takes CALENDAR_INCLUSIVE and anchors on a
          MASTER_CALENDAR_HEARING sitting on a *different* open matter of that client
          (2026-09-15, horizon 14 days -> exactly 25.00 horizon points, score 90.00,
          tier EMERGENCY), while the non-detained row takes STRICT_STATUTORY, ignores that
          calendar row entirely, anchors on 2026-11-30 (horizon 90 > 84 -> clamped to
          0.00 points) and scores 40.00, tier ROUTINE - so a single-variant implementation
          that always reads the calendar cannot produce the 0.00-point row and one that
          never reads it cannot produce the 25.00-point row.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00.000Z."
            - "One OPEN capacity cycle with free general and detained pools."
            - "One OPEN detention facility in a SERVED jurisdiction (TX-ELP)."
            - "Client Alma Reyes: household_size 3, income 4000000 cents -> guideline 2572000, fpl_percent 155.52 (indigency eligible)."
            - "Client already holds one ACCEPTED intake -> open CaseMatter M1 in filing_status PRE_FILING carrying a SCHEDULED MASTER_CALENDAR_HEARING on 2026-09-15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY27-Q1", period_start_date: "2026-08-01", period_end_date: "2026-12-31", total_case_slots: 20, reserved_detained_slots: 4 }
              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
            - call: "POST /detention-facilities"
              payload: { name: "El Paso SPC", jurisdiction_code: "TX-ELP", visit_lead_time_hours: 48, max_daily_visit_slots: 2, expedited_filing_days: 21, access_credential_required: false }
              as: ProgramDirector
              captures: { fac_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Okonjo", rep_type: "STAFF_ATTORNEY", languages: ["en", "es"], max_case_load: 25, max_supervisees: 6, weekly_capacity_hours: 40, bar_number: "TX-100001" }
              as: ProgramDirector
              captures: { screener_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Dov Halberstam", rep_type: "STAFF_ATTORNEY", languages: ["en", "es"], max_case_load: 25, max_supervisees: 6, weekly_capacity_hours: 40, bar_number: "TX-100002" }
              as: ProgramDirector
              captures: { atty_a_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Alma Reyes", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1990-04-11", household_size: 3, annual_household_income_cents: 4000000, confidentiality_consent_scope: "PROGRAM_ONLY", interpreter_required: true }
              as: ProgramDirector
              captures: { client_id: "$.data.id" }
            - call: "PATCH /clients/${client_id}"
              payload: { status: "ACTIVE" }
              as: ProgramDirector
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "ADJUSTMENT_OF_STATUS", detained: false }
              as: ProgramDirector
              captures: { i1_id: "$.data.id" }
            - call: "POST /intake-screenings/${i1_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings/${i1_id}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ACCEPTED_ON_MERIT" }
              as: SupervisingAttorney
              as_user_id: "${atty_a_id}"
            - call: "GET /case-matters"
              payload: { intake_id: "${i1_id}" }
              as: ProgramDirector
              captures: { m1_id: "$.data[0].id" }
            - call: "POST /calendar-events"
              payload: { matter_id: "${m1_id}", event_type: "MASTER_CALENDAR_HEARING", starts_at_utc: "2026-09-15T14:00:00.000Z", ends_at_utc: "2026-09-15T16:00:00.000Z", location_code: "EOIRELP", assigned_representative_id: "${atty_a_id}" }
              as: ProgramDirector
              captures: { ce1_id: "$.data.id" }
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "ASYLUM_DEFENSIVE", detained: true, facility_id: "${fac_id}", statutory_deadline_date: "2026-11-30", one_year_bar_applies: false, prior_removal_order: false, unaccompanied_minor: false }
              as: ProgramDirector
              captures: { i2_id: "$.data.id" }
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "ASYLUM_DEFENSIVE", detained: false, statutory_deadline_date: "2026-11-30", one_year_bar_applies: false, prior_removal_order: false, unaccompanied_minor: false }
              as: ProgramDirector
              captures: { i3_id: "$.data.id" }
          trigger:
            - call: "POST /intake-screenings/${i2_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings/${i3_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
          assert:
            - "step 1 returns HTTP 200; IntakeScreening ${i2_id}.screening_status == 'SCREENED'."
            - "IntakeScreening ${i2_id}.urgency_variant_applied == 'CALENDAR_INCLUSIVE' (detained == true)."
            - "IntakeScreening ${i2_id}.urgency_anchor_date == '2026-09-15' (earliest of statutory 2026-11-30 and the sibling matter's SCHEDULED MASTER_CALENDAR_HEARING)."
            - "IntakeScreening ${i2_id}.urgency_score == 90.00 (ASYLUM_DEFENSIVE 40 + detained 25 + horizon 25.00 where 30*(1-14/84) == 25.00 exactly)."
            - "IntakeScreening ${i2_id}.urgency_tier == 'EMERGENCY' (90.00 >= 85.00)."
            - "IntakeScreening ${i2_id}.legal_eligibility_verdict == 'ELIGIBLE' (TX-ELP is in SERVED_JURISDICTIONS and fpl_percent 155.52 <= 200.00)."
            - "step 2 returns HTTP 200; IntakeScreening ${i3_id}.urgency_variant_applied == 'STRICT_STATUTORY' (detained == false)."
            - "IntakeScreening ${i3_id}.urgency_anchor_date == '2026-11-30'; the 2026-09-15 hearing on matter ${m1_id} is NOT consulted."
            - "IntakeScreening ${i3_id}.urgency_score == 40.00 (horizon_days 90 > 84 -> 30*(1-90/84) == -2.14 -> max(0, -2.14) == 0.00 points)."
            - "IntakeScreening ${i3_id}.urgency_tier == 'ROUTINE' (40.00 < 45.00)."
            - "Client ${client_id}.fpl_percent == 155.52 and Client ${client_id}.indigency_eligible == true (both rows read the same client snapshot)."
            - "The two rows differ by exactly 50.00 urgency points (90.00 vs 40.00): 25 detained points plus 25.00 horizon points that only the CALENDAR_INCLUSIVE variant can earn."

      - name: readiness_weighted_gate_passes_then_strict_gate_blocks_after_release
        grounds:
          - calculations.matter_readiness_index
          - state_machines.CaseMatter.EVIDENCE_GATHERING_to_READY_TO_FILE
          - state_machines.CaseMatter.READY_TO_FILE_to_EVIDENCE_GATHERING
          - state_machines.EvidenceItem.RECEIVED_to_VERIFIED
          - state_machines.Declaration.IN_REVIEW_to_CERTIFIED
          - validations[priority=18]
          - validations[priority=19]
        distinguishing_aspect: |
          A single CaseMatter whose evidence set sits exactly on the weighted floor
          (24 VERIFIED points of 32 counted points -> readiness_index_weighted == 0.7500,
          while required_open == 1 so readiness_ready_strict == false) is advanced to
          READY_TO_FILE successfully while detained (EVIDENCE_WEIGHTED_GATE, 0.7500 >=
          0.7500), then reverted, then released from detention via set-facility, after
          which the byte-identical transition is rejected with a DIFFERENT error id
          (ERR_BLOCKING_EVIDENCE_OUTSTANDING, not ERR_MATTER_NOT_READY) because the
          variant selector flipped to CHECKLIST_STRICT_GATE - no single-gate
          implementation can produce both outcomes from the same evidence set.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00.000Z."
            - "Detained CaseMatter (facility TX-ELP, case_type VAWA_SELF_PETITION -> forum USCIS) STAFFED by a STAFF_ATTORNEY LEAD plus a second STAFF_ATTORNEY CO_COUNSEL used as declaration reviewer."
            - "Client speaks 'en' with interpreter_required false, so no DECLARATION_READBACK session is required to CERTIFY."
            - "Evidence set: 1 REQUIRED 8-point item left in REQUESTED, 2 SUPPORTING items (10 + 14 points) driven to VERIFIED; counted denominator 32, verified numerator 24."
            - "One CERTIFIED Declaration exists; filing_status parked in EVIDENCE_GATHERING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY27-Q1", period_start_date: "2026-08-01", period_end_date: "2026-12-31", total_case_slots: 20, reserved_detained_slots: 4 }
              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
            - call: "POST /detention-facilities"
              payload: { name: "El Paso SPC", jurisdiction_code: "TX-ELP", visit_lead_time_hours: 48, max_daily_visit_slots: 2, expedited_filing_days: 21, access_credential_required: false }
              as: ProgramDirector
              captures: { fac_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Okonjo", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 25, max_supervisees: 6, weekly_capacity_hours: 40, bar_number: "TX-200001" }
              as: ProgramDirector
              captures: { screener_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Dov Halberstam", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 20, max_supervisees: 5, weekly_capacity_hours: 40, bar_number: "TX-200002" }
              as: ProgramDirector
              captures: { atty_a_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Rina Castellanos", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 20, max_supervisees: 5, weekly_capacity_hours: 40, bar_number: "TX-200003" }
              as: ProgramDirector
              captures: { atty_b_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Peter Nakamura", preferred_language_code: "en", country_of_birth_code: "PH", date_of_birth: "1988-02-03", household_size: 1, annual_household_income_cents: 2000000, confidentiality_consent_scope: "PROGRAM_ONLY", interpreter_required: false }
              as: ProgramDirector
              captures: { client_id: "$.data.id" }
            - call: "PATCH /clients/${client_id}"
              payload: { status: "ACTIVE" }
              as: ProgramDirector
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "VAWA_SELF_PETITION", detained: true, facility_id: "${fac_id}", statutory_deadline_date: "2026-12-15" }
              as: ProgramDirector
              captures: { i_id: "$.data.id" }
            - call: "POST /intake-screenings/${i_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings/${i_id}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ACCEPTED_ON_MERIT" }
              as: SupervisingAttorney
              as_user_id: "${atty_a_id}"
            - call: "GET /case-matters"
              payload: { intake_id: "${i_id}" }
              as: ProgramDirector
              captures: { m_id: "$.data[0].id", m_ver1: "$.data[0].version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${m_id}", representative_id: "${atty_a_id}", role_on_case: "LEAD", expected_matter_version: "${m_ver1}" }
              as: ProgramDirector
              captures: { asg_a_id: "$.data.id" }
            - call: "POST /case-assignments/${asg_a_id}/transition"
              payload: { action: "ACTIVATE" }
              as: ProgramDirector
            - call: "GET /case-matters/${m_id}"
              payload: {}
              as: ProgramDirector
              captures: { m_ver2: "$.data.version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${m_id}", representative_id: "${atty_b_id}", role_on_case: "CO_COUNSEL", expected_matter_version: "${m_ver2}" }
              as: ProgramDirector
              captures: { asg_b_id: "$.data.id" }
            - call: "POST /case-assignments/${asg_b_id}/transition"
              payload: { action: "ACTIVATE" }
              as: ProgramDirector
            - call: "POST /evidence-items"
              payload: { matter_id: "${m_id}", item_type: "IDENTITY_DOCUMENT", tier: "REQUIRED", weight_points: 8, source_language_code: "en", requires_translation: false, due_date: "2026-10-01" }
              as: ProgramDirector
              captures: { ev1_id: "$.data.id" }
            - call: "POST /evidence-items"
              payload: { matter_id: "${m_id}", item_type: "COUNTRY_CONDITIONS", tier: "SUPPORTING", weight_points: 10, source_language_code: "en", requires_translation: false, due_date: "2026-10-01" }
              as: ProgramDirector
              captures: { ev2_id: "$.data.id" }
            - call: "POST /evidence-items/${ev2_id}/transition"
              payload: { action: "RECEIVE" }
              as: ProgramDirector
            - call: "POST /evidence-items/${ev2_id}/transition"
              payload: { action: "VERIFY" }
              as: ProgramDirector
            - call: "POST /evidence-items"
              payload: { matter_id: "${m_id}", item_type: "WITNESS_STATEMENT", tier: "SUPPORTING", weight_points: 14, source_language_code: "en", requires_translation: false, due_date: "2026-10-01" }
              as: ProgramDirector
              captures: { ev3_id: "$.data.id" }
            - call: "POST /evidence-items/${ev3_id}/transition"
              payload: { action: "RECEIVE" }
              as: ProgramDirector
            - call: "POST /evidence-items/${ev3_id}/transition"
              payload: { action: "VERIFY" }
              as: ProgramDirector
            - call: "POST /declarations"
              payload: { matter_id: "${m_id}", preparer_assignment_id: "${asg_a_id}", language_code: "en", word_count: 1200 }
              as: ProgramDirector
              captures: { dec_id: "$.data.id" }
            - call: "POST /declarations/${dec_id}/transition"
              payload: { action: "SUBMIT_FOR_REVIEW", word_count: 1200 }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /declarations/${dec_id}/transition"
              payload: { action: "CERTIFY", reviewer_assignment_id: "${asg_b_id}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-matters/${m_id}/advance-filing"
              payload: { target_filing_status: "EVIDENCE_GATHERING" }
              as: ProgramDirector
          trigger:
            - call: "POST /case-matters/${m_id}/advance-filing"
              payload: { target_filing_status: "READY_TO_FILE" }
              as: ProgramDirector
            - call: "POST /case-matters/${m_id}/advance-filing"
              payload: { target_filing_status: "EVIDENCE_GATHERING" }
              as: ProgramDirector
            - call: "POST /case-matters/${m_id}/set-facility"
              payload: { detained: false }
              as: ProgramDirector
            - call: "POST /case-matters/${m_id}/advance-filing"
              payload: { target_filing_status: "READY_TO_FILE" }
              as: ProgramDirector
          assert:
            - "Before step 1: CaseMatter ${m_id}.readiness_index_weighted == 0.7500 (24 verified points / 32 counted points), readiness_ready_strict == false, evidence_blocking_count == 1."
            - "step 1 returns HTTP 200; CaseMatter ${m_id}.filing_status == 'READY_TO_FILE' and readiness_gate_applied == 'EVIDENCE_WEIGHTED_GATE' (detained == true)."
            - "step 2 returns HTTP 200; CaseMatter ${m_id}.filing_status == 'EVIDENCE_GATHERING' (declared revert edge, no evidence mutated)."
            - "step 3 returns HTTP 200; CaseMatter ${m_id}.detained == false and facility_id == null and expedited_deadline_date == null."
            - "step 4 returns HTTP 409 with error_id 'ERR_BLOCKING_EVIDENCE_OUTSTANDING' (NOT 'ERR_MATTER_NOT_READY'), because the CHECKLIST_STRICT_GATE variant reads readiness_ready_strict == false while required_open == 1."
            - "After step 4: CaseMatter ${m_id}.filing_status == 'EVIDENCE_GATHERING' and readiness_index_weighted is still exactly 0.7500 (the rejected transition mutated nothing)."
            - "EvidenceItem ${ev1_id}.status == 'REQUESTED', ${ev2_id}.status == 'VERIFIED', ${ev3_id}.status == 'VERIFIED' throughout; no item was WAIVED so the denominator stayed 32."
            - "Declaration ${dec_id}.status == 'CERTIFIED' and readback_completed == false (interpreter_required false), proving the gate flip came from `detained`, not from the declaration."

  # =====================================================================
  # RULE 2 - combinatorial_formula
  # Two formulas in DIFFERENT combinatorial modes: mode (b) nested rounding
  # order (interpretation_cost_rollup) and mode (c) circular-looking
  # tier-then-allocate order (grant_reimbursement_rollup).
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: interpretation_rollup_per_session_round_then_sum_off_by_one
        grounds:
          - calculations.interpretation_cost_rollup
          - state_machines.InterpretationSession.SCHEDULED_to_COMPLETED
          - state_machines.InterpretationSession.SCHEDULED_to_NO_SHOW
          - entities.InterpretationSession.fields.billable_cents
          - entities.CaseMatter.fields.interpretation_cost_cents
        distinguishing_aspect: |
          Mode (b): the pinned order is ceil-to-15-minute-block with a 30-minute floor,
          then rate x (billed/60) x (1 + rare-language surcharge), then round_half_up per
          session, and only then sum. Two CONTRACT 'ht' sessions of 22 actual minutes each
          bill 30 minutes and land on 9500 x 0.5 x 1.15 == 5462.5 -> 5463 each, so the
          matter rollup is 5463 + 5463 + 6200 == 17126; an implementation that sums the
          unrounded per-session amounts (10925.0 + 6200) reports 17125 and an
          implementation that rounds the surcharge separately or drops the 30-minute floor
          cannot reach 5463 at all.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00.000Z for setup, then advanced to 2026-09-03T00:00:00.000Z so the sessions may be closed out."
            - "One accepted, non-detained CaseMatter (case_type U_VISA -> forum USCIS); no staffing is needed because InterpretationSession rows only require a non-withdrawn matter."
            - "Four InterpretationSession rows: two CONTRACT 'ht' (rare language, surcharge 0.15), one TELEPHONIC 'es' (common language, surcharge 0.00), one CONTRACT 'ht' that will be marked NO_SHOW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY27-Q1", period_start_date: "2026-08-01", period_end_date: "2026-12-31", total_case_slots: 12, reserved_detained_slots: 2 }
              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Okonjo", rep_type: "STAFF_ATTORNEY", languages: ["en", "ht"], max_case_load: 25, max_supervisees: 6, weekly_capacity_hours: 40, bar_number: "TX-300001" }
              as: ProgramDirector
              captures: { screener_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Dov Halberstam", rep_type: "STAFF_ATTORNEY", languages: ["en", "ht"], max_case_load: 25, max_supervisees: 6, weekly_capacity_hours: 40, bar_number: "TX-300002" }
              as: ProgramDirector
              captures: { atty_a_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Marie Toussaint", preferred_language_code: "ht", country_of_birth_code: "HT", date_of_birth: "1993-07-19", household_size: 2, annual_household_income_cents: 1800000, confidentiality_consent_scope: "PROGRAM_ONLY", interpreter_required: true }
              as: ProgramDirector
              captures: { client_id: "$.data.id" }
            - call: "PATCH /clients/${client_id}"
              payload: { status: "ACTIVE" }
              as: ProgramDirector
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "U_VISA", detained: false, statutory_deadline_date: "2026-12-01" }
              as: ProgramDirector
              captures: { i_id: "$.data.id" }
            - call: "POST /intake-screenings/${i_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings/${i_id}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ACCEPTED_ON_MERIT" }
              as: SupervisingAttorney
              as_user_id: "${atty_a_id}"
            - call: "GET /case-matters"
              payload: { intake_id: "${i_id}" }
              as: ProgramDirector
              captures: { m_id: "$.data[0].id" }
            - call: "POST /interpretation-sessions"
              payload: { matter_id: "${m_id}", language_code: "ht", interpreter_source: "CONTRACT", purpose: "HEARING_PREP", scheduled_start_utc: "2026-09-02T09:00:00.000Z", scheduled_end_utc: "2026-09-02T10:00:00.000Z" }
              as: ProgramDirector
              captures: { s1_id: "$.data.id" }
            - call: "POST /interpretation-sessions"
              payload: { matter_id: "${m_id}", language_code: "ht", interpreter_source: "CONTRACT", purpose: "HEARING_PREP", scheduled_start_utc: "2026-09-02T11:00:00.000Z", scheduled_end_utc: "2026-09-02T12:00:00.000Z" }
              as: ProgramDirector
              captures: { s2_id: "$.data.id" }
            - call: "POST /interpretation-sessions"
