      - name: double_adjudication_priority_pair
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: claim_state_lock_precedes_liability_cap_on_double_adjudication
          rationale: |
            That instance is exactly a priority-ordering probe: it shows the priority-17 state lock
            answering ERR_CLAIM_NOT_ADJUDICABLE on a second adjudication that would ALSO have broken
            the priority-69 liability cap, and then proves the cap is reachable on a fresh claim.
      - name: hv_bay_capacity_is_an_aggregate_rule
        claim_type: aggregate_validation
        excluded_because:
          difficulty_instance: hv_bay_aggregate_capacity_with_half_open_adjacent_windows
          rationale: |
            The half-open overlap count against hv_bay_count, the adjacent-window boundary and the
            successful booking after the window frees up are all asserted there.

  - section: endpoints
    instances:
      - name: service_center_listing_filters_and_paginates_independently
        claim_type: standard_crud
        grounds:
          - endpoints[GET /battery-warranty/service-centers]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The two declared filters must AND together rather than replace one another, and total_count
          must report the size of the FILTERED set while has_more reflects limit/offset against that
          same filtered set. An implementation that paginates before filtering, or that reports the
          unfiltered total, fails on the limit=1&offset=1 page.
        test_recipe:
          setup:
            - "Four centers: A US-WEST/L3, B US-EAST/L3, C US-EAST/L1, D US-EAST/L3, created in that order."
          setup_api_calls:
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "Center A", region_code: "US-WEST", hv_certification_level: "L3" }
              as: ProgramAdmin
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "Center B", region_code: "US-EAST", hv_certification_level: "L3" }
              as: ProgramAdmin
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "Center C", region_code: "US-EAST", hv_certification_level: "L1" }
              as: ProgramAdmin
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "Center D", region_code: "US-EAST", hv_certification_level: "L3" }
              as: ProgramAdmin
          trigger:
            - call: "GET /battery-warranty/service-centers"
              payload: {}
              as: WarrantyAdjudicator
            - call: "GET /battery-warranty/service-centers"
              payload: { region_code: "US-EAST" }
              as: WarrantyAdjudicator
            - call: "GET /battery-warranty/service-centers"
              payload: { region_code: "US-EAST", hv_certification_level: "L3" }
              as: WarrantyAdjudicator
            - call: "GET /battery-warranty/service-centers"
              payload: { region_code: "US-EAST", hv_certification_level: "L3", limit: 1, offset: 1 }
              as: WarrantyAdjudicator
            - call: "GET /battery-warranty/service-centers"
              payload: { status: "SHIPPING_SUSPENDED" }
              as: WarrantyAdjudicator
          assert:
            - "the unfiltered listing has total_count 4, has_more false and every row carries status ACTIVE, compliance_score 100, open_hazmat_holds 0, rejected_shipment_count 0 and late_notification_count 0"
            - "region_code=US-EAST has total_count 3 (B, C, D)"
            - "region_code=US-EAST&hv_certification_level=L3 has total_count 2 (B and D) - the filters AND together"
            - "the limit=1&offset=1 page returns exactly one row, Center D, with total_count 2 and has_more false"
            - "status=SHIPPING_SUSPENDED returns an empty array with total_count 0 and has_more false, not a 404"

      - name: pack_and_module_reads_reflect_the_assessment_fault_and_degrade_writes
        claim_type: computed_read
        grounds:
          - entities.BatteryPack.fields.faulted_module_count
          - entities.BatteryModule.fields.status
          - endpoints[GET /battery-warranty/battery-packs/{id}/modules]
        distinguishing_aspect: |
          One assessment writes TWO disjoint position arrays, and the read side must show three
          distinct module states in one roster (FAULTED, DEGRADED, HEALTHY) while the parent pack's
          faulted_module_count counts ONLY the FAULTED ones - degraded modules must not inflate it.
          The module status filter must partition the roster exactly.
        test_recipe:
          setup:
            - "The canonical chain: program, center, technician, vehicle, installed 16-module pack, three valid snapshots."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "West HV Center" }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /battery-warranty/service-centers/${center_id}/technicians"
              payload: { full_name: "Tech A" }
              as: ProgramAdmin
              captures: { tech_a_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000491", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C291", installed_vehicle_id: "${veh_id}" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-20T00:00:00Z", odometer_miles: 71000, reported_capacity_kwh: 56.000 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-22T00:00:00Z", odometer_miles: 71200, reported_capacity_kwh: 56.000 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-24T00:00:00Z", odometer_miles: 71400, reported_capacity_kwh: 56.000 }
              as: TelematicsGateway
            - call: "GET /battery-warranty/vehicles/${veh_id}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
              captures: { veh_ver: $.data.version }
          trigger:
            - call: "POST /battery-warranty/soh-assessments"
              payload: { vehicle_id: "${veh_id}", pack_id: "${pack_id}", technician_id: "${tech_a_id}", variant: "TELEMATICS_FLEET", expected_vehicle_version: "${veh_ver}", module_fault_positions: [3, 7], module_degraded_positions: [1, 2, 16] }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
            - call: "GET /battery-warranty/battery-packs/${pack_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /battery-warranty/battery-packs/${pack_id}/modules"
              payload: { status: "DEGRADED" }
              as: ProgramAdmin
            - call: "GET /battery-warranty/battery-packs/${pack_id}/modules"
              payload: { limit: 3, offset: 2 }
              as: ProgramAdmin
          assert:
            - "the pack read has faulted_module_count 2 and module_replacements_to_date 0 - the three DEGRADED modules do not count as faulted"
            - "the DEGRADED filter has total_count 3 covering position_index 1, 2 and 16"
            - "the limit=3&offset=2 page returns position_index 3, 4 and 5 in ascending order with total_count 16 and has_more true; position 3 reads status FAULTED and positions 4 and 5 read HEALTHY"
            - "every module reads module_capacity_kwh 5.000 (80.000 / 16) and thermal_runaway_flag false"
            - "the assessment's retention_pct is 70.00 - a TELEMATICS_FLEET denominator ignores the two freshly faulted modules"

      - name: shipment_tender_checks_packaging_before_the_soc_boundary
        claim_type: conditional_action
        grounds:
          - validations[priority=51]
          - validations[priority=52]
          - calculations.hazmat_classification
        distinguishing_aspect: |
          Three shipments of three identically damaged packs differ only in packaging_spec and
          state_of_charge_pct, so they isolate the two tender gates and their order: the
          nonconformant packaging is reported even though its SOC is legal, the SP376 shipment at
          30.01 % fails the SOC ceiling, and 30.00 % exactly - the inclusive boundary of the UN3536
