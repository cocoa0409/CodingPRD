  - section: endpoints
    instances:
      - name: fk_reverse_filtered_lists
        claim_type: cross_reference_link
        grounds: ["entities.Site.fields.customer_id", "entities.WashOrder.fields.site_id", "endpoints: GET /fleet-wash/sites", "endpoints: GET /fleet-wash/wash-orders"]
        distinguishing_aspect: "Every FK is reverse-reachable via filtered lists: GET /sites?customer_id=A returns only A's sites and GET /wash-orders?site_id=S returns only orders at S."
        test_recipe:
          setup: ["customers A and B; site SA under A and SB under B; 1 SEDAN at SA; two DRAFT orders at SA, one at SB"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "PA", email: "pa@x.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /fleet-wash/customers", payload: { name: "PB", email: "pb@x.com" }, as: PlatformAdmin, captures: { cb: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${ca}", name: "SA", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { sa: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cb}", name: "SB", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { sb: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${ca}", site_id: "${sa}", plate: "PA1", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { va: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cb}", site_id: "${sb}", plate: "PB1", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { vb: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${ca}", site_id: "${sa}", vehicle_ids: ["${va}"], scheduled_window_start: "2026-08-06T13:00:00Z", scheduled_window_end: "2026-08-06T14:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${ca}", site_id: "${sa}", vehicle_ids: ["${va}"], scheduled_window_start: "2026-08-06T15:00:00Z", scheduled_window_end: "2026-08-06T16:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cb}", site_id: "${sb}", vehicle_ids: ["${vb}"], scheduled_window_start: "2026-08-06T13:00:00Z", scheduled_window_end: "2026-08-06T14:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /fleet-wash/sites?customer_id=${ca}", payload: {}, as: Dispatcher }
            - { call: "GET /fleet-wash/wash-orders?site_id=${sa}", payload: {}, as: Dispatcher }
            - { call: "GET /fleet-wash/vehicles?customer_id=${cb}&site_id=${sb}", payload: {}, as: Dispatcher }
          assert:
            - "GET /sites?customer_id=${ca}: total_count == 1 and the row id == ${sa} (SB excluded)"
            - "GET /wash-orders?site_id=${sa}: total_count == 2"
            - "GET /vehicles?customer_id=${cb}&site_id=${sb}: total_count == 1 (multi-FK filters combine)"

      - name: invoice_dispute_and_void_compensation
        claim_type: conditional_action
        grounds: ["state_machines.Invoice.ISSUED_to_DISPUTED", "state_machines.Invoice.DISPUTED_to_VOID", "state_machines.WashOrder.INVOICED_to_UNBILLED"]
        distinguishing_aspect: "The contract's Customer disputes an ISSUED invoice; the Dispatcher then VOIDs it and every included order's billing_status reverts INVOICED -> UNBILLED (compensating side effect)."
        test_recipe:
          setup: ["FLEET customer; ACTIVE contract (minimum 50000); 1-SEDAN order COMPLETED in 2026-08; FINAL invoice ISSUED (order INVOICED)"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "P2", email: "p2@x.com", customer_type: "FLEET" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "P2S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "P2", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/fleet-contracts", payload: { customer_id: "${cust_id}", start_date: "2026-01-01", end_date: "2026-12-31", monthly_minimum_cents: 50000, sedan_rate_cents: 3000, suv_pickup_rate_cents: 4000, van_boxtruck_rate_cents: 6000, heavy_fleet_rate_cents: 10000 }, as: PlatformAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /fleet-wash/fleet-contracts/${contract_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-03T13:00:00Z", scheduled_window_end: "2026-08-03T14:00:00Z" }, as: PlatformAdmin, captures: { order_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-P2", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van_id}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech P2" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-03", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { route_id: $.data.id, route_v: $.data.version } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${order_id}", expected_route_version: "${route_v}" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /fleet-wash/routes/${route_id}/events", payload: { event_type: "PUBLISH" }, as: Dispatcher }
            - { call: "POST /fleet-wash/routes/${route_id}/stops/${stop_id}/events", payload: { event_type: "ARRIVE" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "START" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "COMPLETE", vehicles_washed_ids: ["${v1}"] }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/invoices/generate", payload: { fleet_contract_id: "${contract_id}", period_month: "2026-08", variant: "FINAL" }, as: Dispatcher, captures: { inv_id: $.data.id } }
            - { call: "POST /fleet-wash/invoices/${inv_id}/events", payload: { event_type: "ISSUE" }, as: Dispatcher }
            - { call: "GET /fleet-wash/wash-orders/${order_id}", payload: {}, as: Dispatcher, captures: { bs1: $.data.billing_status } }
          trigger:
            - { call: "POST /fleet-wash/invoices/${inv_id}/events", payload: { event_type: "DISPUTE" }, as: Customer, as_user_id: "${cust_id}", captures: { inv_st1: $.data.status } }
            - { call: "POST /fleet-wash/invoices/${inv_id}/events", payload: { event_type: "VOID" }, as: Dispatcher, captures: { inv_st2: $.data.status } }
            - { call: "GET /fleet-wash/wash-orders/${order_id}", payload: {}, as: Dispatcher, captures: { bs2: $.data.billing_status } }
          assert:
            - "bs1 == INVOICED after ISSUE"
            - "inv_st1 == DISPUTED (contract customer may dispute) and inv_st2 == VOID"
            - "bs2 == UNBILLED after VOID (compensating revert; the period is open for regeneration)"

      - name: get_unknown_wash_order_returns_not_found
        claim_type: standard_crud
        grounds: ["endpoints: GET /fleet-wash/wash-orders/{id}", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a well-formed but non-existent wash order id returns 404 ERR_NOT_FOUND."
        test_recipe:
