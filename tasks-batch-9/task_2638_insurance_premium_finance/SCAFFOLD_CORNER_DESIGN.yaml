            - call: "POST /agreements/${tl_agr}/policies"
              payload: { insurer_id: "${tl_insurer}", policy_number: "MC-TL-1", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { tl_pol: "$.data.id" }
            - call: "POST /agreements/${tl_agr}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
          trigger:
            - call: "POST /agreements/${tl_agr}/void"
              payload: { reason: "insured withdrew the application" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { tl_status: "$.data.status", tl_ver: "$.data.version" }
            - call: "GET /policies/${tl_pol}"
