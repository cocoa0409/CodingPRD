  - section: state_machines
    instances:
      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: Initial State
        grounds:
          - state_machines.Operator.initial_state
          - state_machines.Well.initial_state
          - state_machines.OrphanDetermination.initial_state
          - state_machines.SiteAccess.initial_state
          - state_machines.WellTransfer.initial_state
          - state_machines.Solicitation.initial_state
          - state_machines.GrantReport.initial_state
        distinguishing_aspect: |
          Every one of the fifteen state machines names an initial_state, and a freshly created row
          must sit in it with its cycle counters at 0: Well is PRODUCING on the status dimension and
          NO_ACCESS_REQUESTED on the independent access_status dimension, OrphanDetermination is
          DRAFT with revision_round 0, Solicitation is DRAFT with reopen_round 0, GrantReport is DUE
          with revision_round 0 and zeroed figures.
