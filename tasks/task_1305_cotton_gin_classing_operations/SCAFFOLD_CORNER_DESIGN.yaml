            - "receipt_number is present and unique-looking; status == ACTIVE"

      - name: ship_order_decrements_count_and_posts_storage
        claim_type: side_effect_execution
        grounds: [state_machines.ShippingOrder.CONFIRMED_to_SHIPPED, calculations.storage_charge, entities.Warehouse.fields.stored_bale_count]
        distinguishing_aspect: "ship is a 4-hop cascade: order SHIPPED -> receipts SHIPPED + bales SHIPPED + count -2 -> one STORAGE_CHARGE per receipt (-60 each at 20 days) -> grower balance -11620."
        test_recipe:
          setup: ["grower; warehouse (2 docks); module with two 500-lb bales, both receipted at clock default; order of both bales confirmed; clock advanced to 2026-08-21 (20 days stored)"]
