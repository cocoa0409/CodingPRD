          assert:
            - "HTTP 412 with error_id == ERR_STALE_BOOKING_VERSION for expected_booking_version ${bk_ver_stale} == 1"
            - "Booking.${bk_id}.version == 3 (${bk_ver_fresh}) and is not incremented by the rejected create"
            - "GET /compliance/refund-obligations with booking_id = ${bk_id} returns total_count == 0"
            - "Resending the identical body with expected_booking_version = ${bk_ver_fresh} returns 201 with amount_cents == 90000 (round_half_up(90000/2) x 2) and Booking.${bk_id}.version == 4"

      - name: report_create_refuses_a_stale_policy_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules.report-create-stale-policy", "errors.ERR_STALE_POLICY_VERSION", "validations[priority 35]"]
        distinguishing_aspect: "Opening the June report advances PolicyProfile.report_count and version, so the July create replaying the pre-June version 1 is refused with ERR_STALE_POLICY_VERSION (412) even though the two periods do not overlap - the OCC guard is independent of the period-overlap rule."
        test_recipe:
          setup:
            - "One PolicyProfile read at version 1, then one DRAFT report for 2026-06-01T00:00:00Z..2026-06-30T23:59:59Z which takes the profile to version 2."
