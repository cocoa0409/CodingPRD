  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: fill_run_abort_restores_material_quantity_conservation_over_two_cycles
        grounds:
          - calculations.material_quantity_conservation
          - state_machines.ReagentLot.IN_PROCESS_to_PLANNED
          - state_machines.FillRun.RUNNING_to_ABORTED
          - entities.LotComponent.fields.status
        distinguishing_aspect: |
          The compensation is exercised TWICE over two different material lots, so the
          claim is not merely "the numbers came back" but "they came back to the same
          values with zero drift after a second consume/return cycle", and the RETURNED
          rows accumulate rather than being deleted: four LotComponent rows exist at
          the end for two materials, with only the CONSUMED subset counted. Two
          quantities with different scales (1000.00 and 500.00) are conserved
          independently.
        test_recipe:
          setup:
            - "Two MaterialSpecifications: AB-CI (ANTIBODY) with a QUALIFIED lot of 1000.00 units and BF-CI (BUFFER) with a QUALIFIED lot of 500.00 units."
            - "ProductSpecification IVD-CI-1 requiring both material codes, and one PLANNED ReagentLot CI-LOT-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "AB-CI", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_a_id: $.data.id }
            - call: "POST /material-specifications"
              payload: { material_code: "BF-CI", material_type: "BUFFER", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_b_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_a_id}", vendor_lot_code: "V-CI-A", received_quantity_units: 1000.0, expiry_date: "2027-12-31T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_a_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_b_id}", vendor_lot_code: "V-CI-B", received_quantity_units: 500.0, expiry_date: "2027-12-31T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_b_id: $.data.id }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_a_id}", test_code: "POTENCY", measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_b_id}", test_code: "POTENCY", measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /material-lots/${ml_a_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
            - call: "POST /material-lots/${ml_b_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-CI-1", reference_material_code: "REF-8", required_material_codes: ["AB-CI", "BF-CI"], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 90 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_id: $.data.id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "CI-LOT-1", planned_units: 300 }
              as: ProductionOperator
              captures: { rl_id: $.data.id, rl_v1: $.data.version }
            - call: "POST /reagent-lots/${rl_id}/components"
              payload: { material_lot_id: "${ml_a_id}", component_role: "ANTIBODY", quantity_used: 250.0, expected_reagent_lot_version: "${rl_v1}" }
              as: ProductionOperator
            - call: "GET /reagent-lots/${rl_id}"
              payload: {}
              as: ProductionOperator
              captures: { rl_v2: $.data.version }
            - call: "POST /reagent-lots/${rl_id}/components"
              payload: { material_lot_id: "${ml_b_id}", component_role: "BUFFER", quantity_used: 100.0, expected_reagent_lot_version: "${rl_v2}" }
              as: ProductionOperator
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "${rl_id}", line_code: "LINE-G", formulation_batch_code: "BULK-CI1", scheduled_start: "2026-08-10T06:00:00Z", scheduled_end: "2026-08-10T10:00:00Z", planned_fill_units: 300 }
              as: ProductionOperator
              captures: { fr_1_id: $.data.id }
            - call: "POST /fill-runs/${fr_1_id}/start"
              payload: {}
              as: ProductionOperator
          trigger:
            - call: "POST /fill-runs/${fr_1_id}/abort"
              payload: { abort_reason: "bulk homogeneity out of trend" }
              as: ProductionOperator
              captures: { run1_status: $.data.status }
            - call: "GET /reagent-lots/${rl_id}"
              payload: {}
              as: ProductionOperator
              captures: { rl_v3: $.data.version }
            - call: "POST /reagent-lots/${rl_id}/components"
              payload: { material_lot_id: "${ml_a_id}", component_role: "ANTIBODY", quantity_used: 250.0, expected_reagent_lot_version: "${rl_v3}" }
              as: ProductionOperator
            - call: "GET /reagent-lots/${rl_id}"
              payload: {}
              as: ProductionOperator
              captures: { rl_v4: $.data.version }
            - call: "POST /reagent-lots/${rl_id}/components"
              payload: { material_lot_id: "${ml_b_id}", component_role: "BUFFER", quantity_used: 100.0, expected_reagent_lot_version: "${rl_v4}" }
              as: ProductionOperator
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "${rl_id}", line_code: "LINE-G", formulation_batch_code: "BULK-CI2", scheduled_start: "2026-08-12T06:00:00Z", scheduled_end: "2026-08-12T10:00:00Z", planned_fill_units: 300 }
              as: ProductionOperator
              captures: { fr_2_id: $.data.id }
            - call: "POST /fill-runs/${fr_2_id}/start"
              payload: {}
              as: ProductionOperator
            - call: "POST /fill-runs/${fr_2_id}/abort"
              payload: { abort_reason: "filler needle blockage" }
              as: ProductionOperator
              captures: { run2_status: $.data.status }
            - call: "GET /reagent-lots/${rl_id}/components"
              payload: {}
              as: ProductionOperator
              captures: { first_component_status: "$.data[0].status" }
          assert:
            - "before the first abort the ledgers read AB-CI 750.00 available / 250.00 consumed and BF-CI 400.00 available / 100.00 consumed, with 1000.00 == 750.00 + 250.00 and 500.00 == 400.00 + 100.00"
            - "the first abort returns FillRun.status ABORTED with abort_reason stored, and cascade hop 2 reverts ReagentLot.disposition_status IN_PROCESS -> PLANNED"
            - "cascade hop 3 flips BOTH LotComponent rows from CONSUMED to RETURNED; neither row is deleted"
            - "cascade hop 4 restores AB-CI to 1000.00 available / 0.00 consumed and BF-CI to 500.00 available / 0.00 consumed — each material is compensated by exactly its own quantity_used, not by a shared figure"
            - "each touched MaterialLot.version is incremented by the compensation, so the restoration is a real write and not a read-time recomputation"
            - "re-adding both components reproduces exactly 750.00/250.00 and 400.00/100.00, proving zero drift after one full cycle"
            - "the second abort returns the ledgers to 1000.00/0.00 and 500.00/0.00 again — two cycles produce no accumulated error"
            - "GET /reagent-lots/${rl_id}/components then lists FOUR rows, all with status RETURNED, and consumed_quantity_units counts none of them because RETURNED rows are excluded from the sum"
            - "the lot's filled_units is still 0 and its disposition_status is PLANNED, so an aborted cycle leaves no finished-goods units behind"

      - name: allocation_cancel_restores_reagent_lot_unit_conservation_with_replay
        grounds:
          - calculations.reagent_lot_unit_conservation
          - state_machines.Allocation.RESERVED_to_CANCELLED
          - state_machines.DistributionOrder.ALLOCATED_to_PARTIALLY_ALLOCATED
          - calculations.fefo_allocation
        distinguishing_aspect: |
          A second conservation law with different semantics: four buckets on ONE row
          rather than two columns on a parent, and the compensation is proved by
          REPLAY — a fresh order allocated after the cancel must produce a
          byte-identical draw (same lot, same 200 units, sequence_index 1), which only
          holds if the cancel returned the units to available_units rather than merely
          zeroing a counter. The cancelled row is retained and contributes to no
          bucket, and a second cancel is rejected as a state error.
        test_recipe:
          setup:
            - "A CLEARED ProductSpecification IVD-CI-2 and one RELEASED + AVAILABLE ReagentLot CI-LOT-2 with filled_units 500 and available_units 500, filled at 2026-08-10T10:00:00Z and released by qa-01."
