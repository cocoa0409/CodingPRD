        as_user_id: vet-exam-opener
        captures: {vc1_id: $.data.id}
      - call: POST /aquarium/veterinary-cases/${vc1_id}/closure
        payload: {outcome: RESOLVED, findings_severity: NONE}
        as: VeterinaryOfficer
        as_user_id: vet-exam-closer
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-10T00:00:00Z'}
        as: VeterinaryOfficer
      - call: POST /aquarium/veterinary-cases
        payload: {specimen_id: '${spec_id}', case_type: PREVENTIVE_EXAM, opened_at: '2026-08-10T00:00:00Z'}
        as: VeterinaryOfficer
        as_user_id: vet-exam-opener
        captures: {vc2_id: $.data.id}
      - call: POST /aquarium/veterinary-cases/${vc2_id}/closure
        payload: {outcome: RESOLVED, findings_severity: NONE}
        as: VeterinaryOfficer
        as_user_id: vet-exam-closer
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-09-01T00:00:00Z'}
