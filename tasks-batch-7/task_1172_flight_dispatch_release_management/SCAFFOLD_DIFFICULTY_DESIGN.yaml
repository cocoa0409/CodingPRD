          assert:
            - "mel1_status == EXPIRED (safety rule is violated at trigger time)"
            - "sign_err == ERR_RELEASE_NOT_PENDING — the state-category violation (release is DRAFT) outranks the business_safety violation ERR_MEL_ITEM_EXPIRED"

      - name: manifest_conflict_referential_beats_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_PLAN_NOT_LOCKED]
          - errors[ERR_MTOW_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_referential (p9) vs business_fiscal (p10) —
          different pair than state-vs-safety: manifest create with a merely
