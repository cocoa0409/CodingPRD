scenario: "2250. Convention Center Booking & Event Services (public convention center): booking policy with priority windows for citywide conventions over local and consumer shows, license agreement with space, dates, rental rates and move-in/move-out periods, tentative hold hierarchy, challenge procedures and release deadlines, event services ordering across utilities, rigging, cleaning and security with exclusive and preferred vendor rules, labor coordination with union jurisdictions and show-floor work rules, food and beverage exclusivity with the in-house caterer and outside catering exceptions, event settlement with actual usage charges and dispute resolution, facility maintenance windows and capital project scheduling around the booking calendar"
domain_name: "convention-center-booking-event-services"
api_prefix: "/convention-center"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - ops_run_checkpoint
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered name of the licensee organization
      - name: contact_email
        type: string
        source: input
        description: primary billing contact address
      - name: organization_type
        type: enum
        source: input
        description: classification used to qualify an event_class at booking time
        constraints: "one of NATIONAL_ASSOCIATION, LOCAL_ORGANIZATION, PROMOTER"
      - name: total_deposits_paid_cents
        type: integer
        source: computed
        description: lifetime sum of every deposit payment accepted for this client
        default: 0
      - name: credit_balance_cents
        type: integer
        source: computed
        description: deposit money paid in but not yet held against any LicenseAgreement
        default: 0
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: sum of EventSettlement.grand_total_cents for this client's settlements whose status == FINAL
        default: 0
      - name: booking_standing
        type: enum
        source: computed
        description: derived posture gate; recomputed by calculations.client_booking_standing on every change to outstanding_balance_cents
        default: GOOD
        constraints: "one of GOOD, HOLD_RESTRICTED"

  - name: SpaceUnit
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: signage name of the rentable space
      - name: parent_space_id
        type: string
        source: input
        description: "FK -> SpaceUnit.id; null for a top-level space; a child occupies its ancestors when booked"
        default: null
      - name: space_class
        type: enum
        source: input
        description: physical category of the space
        constraints: "one of HALL, BALLROOM, MEETING_ROOM"
      - name: rentable_sqft
        type: integer
        source: input
        description: billable floor area used by the CLEANING service formula
      - name: daily_base_rate_cents
        type: integer
        source: input
        description: published rack rate per show day before any event_class discount
      - name: rigging_capable
        type: boolean
        source: input
        description: whether the ceiling grid supports a RIGGING ServiceOrder
        default: false
      - name: committed_space_days
        type: integer
        source: computed
        description: conserved counter; sum of EventBooking.space_days_committed over bookings on this space or any descendant whose status IN {TENTATIVE, DEFINITE, IN_HOUSE, CLOSED, SETTLED}
        default: 0
      - name: active_blackout_count
        type: integer
        source: computed
        description: count of MaintenanceBlackout rows on this space whose status == APPROVED
        default: 0

  - name: BookingPolicyWindow
    parent: null
    common_fields: true
    fields:
      - name: event_class
        type: enum
        source: input
        description: event category this window governs; at most one window row per event_class
        constraints: "one of CITYWIDE_CONVENTION, LOCAL_EVENT, CONSUMER_SHOW"
      - name: priority_rank
        type: integer
        source: input
        description: lower number outranks higher when a hold challenge is evaluated
      - name: open_months_before
        type: integer
        source: input
        description: booking may not be created earlier than this many whole months before show_start_date
      - name: close_months_before
        type: integer
        source: input
        description: booking may not be created later than this many whole months before show_start_date
      - name: max_holds_per_booking
        type: integer
        source: input
        description: ceiling on SpaceHold rows with status IN {ACTIVE, CHALLENGED, CONFIRMED} for one booking
      - name: challenge_response_hours
        type: integer
        source: input
        description: hours a challenged holder has to confirm before the hold-sweep releases it
      - name: rental_discount_pct
        type: number
        source: input
        description: fraction subtracted from gross rental for bookings in this event_class
        constraints: "0 <= value < 1"
      - name: max_challenge_rounds
        type: integer
        source: input
        description: ceiling on SpaceHold.challenge_round before further challenges are refused

  - name: EventBooking
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id"
      - name: space_id
        type: string
        source: input
        description: "FK -> SpaceUnit.id; the space the license will convey"
      - name: policy_window_id
        type: string
        source: computed
        description: "FK -> BookingPolicyWindow.id; resolved at creation from event_class"
      - name: event_name
        type: string
        source: input
        description: public name of the event
      - name: event_class
        type: enum
        source: input
        description: booking priority category
        constraints: "one of CITYWIDE_CONVENTION, LOCAL_EVENT, CONSUMER_SHOW"
      - name: move_in_start_date
        type: string
        source: input
        description: first move-in day
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: show_start_date
        type: string
        source: input
        description: first show day
        constraints: "ISO 8601 calendar date YYYY-MM-DD; >= move_in_start_date"
      - name: show_end_date
        type: string
        source: input
        description: last show day
        constraints: "ISO 8601 calendar date YYYY-MM-DD; >= show_start_date"
      - name: move_out_end_date
        type: string
        source: input
        description: last move-out day
        constraints: "ISO 8601 calendar date YYYY-MM-DD; >= show_end_date"
      - name: projected_room_nights
        type: integer
        source: input
        description: hotel room nights the client commits to for citywide qualification
        default: 0
      - name: status
        type: enum
        source: computed
        description: booking lifecycle state
        default: TENTATIVE
        constraints: "one of TENTATIVE, DEFINITE, IN_HOUSE, CLOSED, SETTLED, RELEASED, CANCELLED"
      - name: order_posture
        type: enum
        source: computed
        description: derived gate over child ServiceOrder / LaborCall / CateringArrangement writes; recomputed whenever status or Client.booking_standing changes
        default: OPEN
        constraints: "one of OPEN, RESTRICTED, LOCKED"
      - name: gross_rental_cents
        type: integer
        source: computed
        description: undiscounted rental from calculations.contracted_rental_charge
        default: 0
      - name: contracted_rental_cents
        type: integer
        source: computed
        description: discounted rental from calculations.contracted_rental_charge
        default: 0
      - name: deposit_required_cents
        type: integer
        source: computed
        description: deposit derived from contracted_rental_cents by calculations.contracted_rental_charge
        default: 0
      - name: space_days_committed
        type: integer
        source: computed
        description: inclusive day count from move_in_start_date to move_out_end_date from calculations.space_days_committed
        default: 0
      - name: hold_count
        type: integer
        source: computed
        description: count of SpaceHold rows for this booking whose status IN {ACTIVE, CHALLENGED, CONFIRMED}
        default: 0

  - name: SpaceHold
    parent: EventBooking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> EventBooking.id"
      - name: challenged_by_hold_id
        type: string
        source: computed
        description: "FK -> SpaceHold.id; the challenging hold while this hold is CHALLENGED, else null"
        default: null
      - name: hold_rank
        type: integer
        source: computed
        description: position in the tentative hold hierarchy on this space from calculations.hold_rank_assignment; 1 is first-option
      - name: status
        type: enum
        source: computed
        description: hold lifecycle state
        default: ACTIVE
        constraints: "one of ACTIVE, CHALLENGED, CONFIRMED, RELEASED"
      - name: challenge_round
        type: integer
        source: computed
        description: number of times this hold has been challenged; capped by BookingPolicyWindow.max_challenge_rounds
        default: 0
      - name: challenge_deadline_utc
        type: datetime
        source: computed
        description: logical-clock instant plus BookingPolicyWindow.challenge_response_hours, stamped when status becomes CHALLENGED; null otherwise
        default: null
      - name: release_deadline_utc
        type: datetime
        source: computed
        description: midnight UTC of show_start_date minus RELEASE_LEAD_MONTHS whole months, stamped at creation
      - name: interval_start_date
        type: string
        source: computed
        description: copy of EventBooking.move_in_start_date; left edge of the closed occupation interval
      - name: interval_end_date
        type: string
        source: computed
        description: copy of EventBooking.move_out_end_date; right edge of the closed occupation interval

  - name: LicenseAgreement
    parent: EventBooking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> EventBooking.id; at most one non-VOIDED license per booking"
      - name: status
        type: enum
        source: computed
        description: license lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, EXECUTED, AMENDMENT_PENDING, VOIDED, TERMINATED"
      - name: rental_rate_cents
        type: integer
        source: computed
        description: SpaceUnit.daily_base_rate_cents pinned at DRAFT creation
      - name: contracted_rental_cents
        type: integer
        source: computed
        description: EventBooking.contracted_rental_cents pinned at DRAFT creation
      - name: deposit_required_cents
        type: integer
        source: computed
        description: EventBooking.deposit_required_cents pinned at DRAFT creation
      - name: deposit_held_cents
        type: integer
        source: computed
        description: deposit money currently escrowed against this license; conserved by the monetary invariant
        default: 0
      - name: amendment_round
        type: integer
        source: computed
        description: count of accepted amendments; capped by MAX_AMENDMENT_ROUNDS
        default: 0
      - name: pending_amendment_note
        type: string
        source: computed
        description: text of the open amendment while status == AMENDMENT_PENDING, else null
        default: null
      - name: issued_at_utc
        type: datetime
        source: computed
        description: logical-clock instant when status became ISSUED; null before that
        default: null
      - name: executed_at_utc
        type: datetime
        source: computed
        description: logical-clock instant when status first became EXECUTED; null before that
        default: null

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered vendor name
      - name: service_category
        type: enum
        source: input
        description: the single category this vendor may be ordered for
        constraints: "one of UTILITIES, RIGGING, CLEANING, SECURITY, CATERING"
      - name: vendor_tier
        type: enum
        source: input
        description: contract standing that selects the vendor multiplier in calculations.service_order_charge
        constraints: "one of EXCLUSIVE, PREFERRED, OPEN"
      - name: coi_expiry_date
        type: string
        source: input
        description: certificate-of-insurance expiry; an order is refused when this date is at or before the logical clock date
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: is_in_house_caterer
        type: boolean
        source: input
        description: marks the single exclusive food and beverage provider
        default: false

  - name: UnionJurisdiction
    parent: null
    common_fields: true
    fields:
      - name: craft_name
        type: string
        source: input
        description: name of the craft local
      - name: covered_category
        type: enum
        source: input
        description: the service category whose show-floor work this local claims
        constraints: "one of UTILITIES, RIGGING, CLEANING, SECURITY"
      - name: straight_time_rate_cents
        type: integer
        source: input
        description: per crew-hour straight-time rate
      - name: overtime_multiplier
        type: number
        source: input
        description: factor applied to hours outside the straight-time window
        default: 1.5
      - name: min_call_hours
        type: number
        source: input
        description: minimum billable hours per crew member per call
        default: 4
      - name: st_window_start_hour
        type: integer
        source: input
        description: inclusive hour-of-day at which the straight-time window opens
        default: 8
      - name: st_window_end_hour
        type: integer
        source: input
        description: exclusive hour-of-day at which the straight-time window closes
        default: 17
      - name: max_crew_hours_per_day
        type: number
        source: input
        description: aggregate crew-hour capacity this local can supply on any one work_date
      - name: committed_crew_hours
        type: number
        source: computed
        description: conserved counter; sum of LaborCall.billed_hours for calls on this local whose status IN {SCHEDULED, DISPATCHED, ACTUALIZED}
        default: 0
      - name: lockout_active
        type: boolean
        source: input
        description: when true no new LaborCall may be scheduled against this local
        default: false

  - name: ServiceOrder
    parent: EventBooking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> EventBooking.id"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; Vendor.service_category must equal this order's service_category"
      - name: service_category
        type: enum
        source: input
        description: which event service is being ordered
        constraints: "one of UTILITIES, RIGGING, CLEANING, SECURITY"
      - name: ordered_quantity
        type: number
        source: input
        description: billable units - amps for UTILITIES, rigging points for RIGGING, square feet for CLEANING, guard hours for SECURITY
        constraints: "> 0"
      - name: order_timing
        type: enum
        source: computed
        description: ADVANCE when the logical clock date is more than ADVANCE_CUTOFF_DAYS before show_start_date, else LATE
        constraints: "one of ADVANCE, LATE"
      - name: approval_status
        type: enum
        source: computed
        description: first independent state dimension - operational clearance
        default: PENDING_APPROVAL
        constraints: "one of PENDING_APPROVAL, APPROVED, REJECTED, CANCELLED"
      - name: billing_status
        type: enum
        source: computed
        description: second independent state dimension - money treatment
        default: UNBILLED
        constraints: "one of UNBILLED, ESTIMATED, RECONCILED, VOID"
      - name: estimated_charge_cents
        type: integer
        source: computed
        description: calculations.service_order_charge over ordered_quantity
        default: 0
      - name: actual_quantity
        type: number
        source: input
        description: metered units recorded at reconciliation; null before then
        default: null
      - name: actual_charge_cents
        type: integer
        source: computed
        description: calculations.service_order_charge over actual_quantity; null before reconciliation
        default: null

  - name: LaborCall
    parent: EventBooking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> EventBooking.id"
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> UnionJurisdiction.id; covered_category must equal work_category"
      - name: work_category
        type: enum
        source: input
        description: show-floor work being called
        constraints: "one of UTILITIES, RIGGING, CLEANING, SECURITY"
      - name: work_date
        type: string
        source: input
        description: calendar day of the call; must fall inside the booking's move-in through move-out span
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: scheduled_start_hour
        type: number
        source: input
        description: hour-of-day the crew is called to start
        constraints: "0 <= value < 24"
      - name: scheduled_end_hour
        type: number
        source: input
        description: hour-of-day the crew is released
        constraints: "scheduled_start_hour < value <= 24"
      - name: crew_size
        type: integer
        source: input
        description: number of crew members called
        constraints: ">= 1"
      - name: actual_start_hour
        type: number
        source: input
        description: hour-of-day work actually began; null before actualization
        default: null
      - name: actual_end_hour
        type: number
        source: input
        description: hour-of-day work actually ended; null before actualization
        default: null
      - name: status
        type: enum
        source: computed
        description: labor call lifecycle state
        default: SCHEDULED
        constraints: "one of SCHEDULED, DISPATCHED, ACTUALIZED, CANCELLED"
      - name: billed_hours
        type: number
        source: computed
        description: crew-hours charged against UnionJurisdiction.committed_crew_hours from calculations.union_crew_hours_committed
        default: 0
      - name: estimated_charge_cents
        type: integer
        source: computed
        description: calculations.union_labor_charge variant SCHEDULED_ESTIMATE
        default: 0
      - name: actual_charge_cents
        type: integer
        source: computed
        description: calculations.union_labor_charge variant ACTUALIZED; null before actualization
        default: null

  - name: CateringArrangement
    parent: EventBooking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> EventBooking.id; at most one arrangement per booking whose status IN {PROPOSED, APPROVED, CLOSED}"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; Vendor.service_category must be CATERING"
      - name: arrangement_type
        type: enum
        source: input
        description: IN_HOUSE uses the exclusive caterer; OUTSIDE_EXCEPTION invokes a named exclusivity exception
        constraints: "one of IN_HOUSE, OUTSIDE_EXCEPTION"
      - name: exception_reason
        type: enum
        source: input
        description: required when arrangement_type == OUTSIDE_EXCEPTION, must be null otherwise
        default: null
        constraints: "one of ETHNIC_CUISINE, SPONSOR_PRODUCT_SAMPLING, RELIGIOUS_DIETARY"
      - name: estimated_fnb_cents
        type: integer
        source: input
        description: forecast food and beverage spend used by the ESTIMATED buyout variant
        constraints: ">= 0"
      - name: actual_fnb_cents
        type: integer
        source: input
        description: settled food and beverage spend used by the ACTUAL buyout variant; null before closing
        default: null
      - name: buyout_fee_cents
        type: integer
        source: computed
        description: calculations.fnb_buyout_fee; always 0 while arrangement_type == IN_HOUSE
        default: 0
      - name: status
        type: enum
        source: computed
        description: catering arrangement lifecycle state
        default: PROPOSED
        constraints: "one of PROPOSED, APPROVED, DENIED, CLOSED"

  - name: SpaceUsageRecord
    parent: EventBooking
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> EventBooking.id"
      - name: usage_date
        type: string
        source: input
        description: calendar day being attested; unique per booking
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: usage_kind
        type: enum
        source: input
        description: how the space was actually used on usage_date; drives the per-day factor in the ACTUAL_USAGE rental basis
        constraints: "one of MOVE_IN, SHOW, DARK, MOVE_OUT, HOLDOVER"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who attested the day

  - name: EventSettlement
    parent: EventBooking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> EventBooking.id; at most one settlement per booking"
      - name: basis
        type: enum
        source: input
        description: which rental basis variant the settlement uses
        constraints: "one of CONTRACTED, ACTUAL_USAGE"
      - name: status
        type: enum
        source: computed
        description: settlement lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, DISPUTED, ARBITRATION, FINAL"
      - name: line_subtotal_cents
        type: integer
        source: computed
        description: calculations.settlement_line_extension over this settlement's SettlementLineItem rows
        default: 0
      - name: facility_service_fee_cents
        type: integer
        source: computed
        description: calculations.facility_service_fee keyed on line_subtotal_cents
        default: 0
      - name: deposit_applied_cents
        type: integer
        source: computed
        description: deposit moved out of LicenseAgreement.deposit_held_cents at finalization
        default: 0
      - name: grand_total_cents
        type: integer
        source: computed
        description: line_subtotal_cents plus facility_service_fee_cents minus deposit_applied_cents
        default: 0
      - name: revision_round
        type: integer
        source: computed
        description: number of times this settlement has been re-issued after a dispute; capped by MAX_SETTLEMENT_REVISIONS
        default: 0
      - name: dispute_reason
        type: string
        source: computed
        description: text supplied with the open dispute while status == DISPUTED, else null
        default: null
      - name: issued_by_user_id
        type: string
        source: computed
        description: X-User-ID of the analyst who last issued this settlement; null while DRAFT
        default: null
      - name: issued_at_utc
        type: datetime
        source: computed
        description: logical-clock instant of the last issue; null while DRAFT
        default: null
      - name: dispute_deadline_utc
        type: datetime
        source: computed
        description: issued_at_utc plus DISPUTE_WINDOW_HOURS; null while DRAFT
        default: null
      - name: finalized_by_user_id
        type: string
        source: computed
        description: X-User-ID of the analyst who finalized; must differ from issued_by_user_id
        default: null

  - name: SettlementLineItem
    parent: EventSettlement
    common_fields: false
    fields:
      - name: settlement_id
        type: string
        source: input
        description: "FK -> EventSettlement.id"
      - name: line_kind
        type: enum
        source: input
        description: which charge family this line carries
        constraints: "one of RENTAL, SERVICE, LABOR, CATERING, ADJUSTMENT"
      - name: source_ref_id
        type: string
        source: input
        description: opaque identifier of the originating ServiceOrder, LaborCall or CateringArrangement copied for audit; polymorphic and deliberately not a declared foreign key, never dereferenced by any rule
        default: null
      - name: amount_cents
        type: integer
        source: input
        description: signed charge in cents; ADJUSTMENT lines may be negative, all other kinds must be positive
      - name: memo
        type: string
        source: input
        description: human-readable description of the line
        default: null

  - name: MaintenanceBlackout
    parent: SpaceUnit
    common_fields: true
    fields:
      - name: space_id
        type: string
        source: input
        description: "FK -> SpaceUnit.id"
      - name: window_start_date
        type: string
        source: input
        description: first day the space is unavailable
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: window_end_date
        type: string
        source: input
        description: last day the space is unavailable
        constraints: "ISO 8601 calendar date YYYY-MM-DD; >= window_start_date"
      - name: buffer_days
        type: integer
        source: input
        description: separation demanded on BOTH sides of the window; a booking interval must clear the window by more than this many days
        default: 2
      - name: project_kind
        type: enum
        source: input
        description: routine facility maintenance or a scheduled capital project
        constraints: "one of ROUTINE_MAINTENANCE, CAPITAL_PROJECT"
      - name: status
        type: enum
        source: computed
        description: blackout lifecycle state
        default: PROPOSED
        constraints: "one of PROPOSED, APPROVED, DEFERRED"

state_machines:
  - entity: EventBooking
    initial_state: TENTATIVE
    terminal_states: [SETTLED, RELEASED, CANCELLED]
    transitions:
      - from: TENTATIVE
        to: DEFINITE
        trigger: "POST /convention-center/bookings/{id}/confirm-definite"
        actor: SalesManager
        preconditions:
          - "at least one SpaceHold for this booking has status == CONFIRMED"
          - "the LicenseAgreement whose booking_id == this booking has status == EXECUTED"
          - "Client.booking_standing == GOOD for this booking's client_id"
        side_effects:
          - "order_posture recomputed to OPEN"
          - "updated_at refreshed and version incremented by 1"
        note: "cross-entity guard on both LicenseAgreement.status and Client.booking_standing"
      - from: TENTATIVE
        to: RELEASED
        trigger: "POST /convention-center/bookings/{id}/release"
        actor: SalesManager
        preconditions:
          - "no EventSettlement exists whose booking_id == this booking"
        side_effects:
          - "every SpaceHold for this booking whose status IN {ACTIVE, CHALLENGED, CONFIRMED} moves to RELEASED"
          - "each released hold triggers calculations.hold_rank_assignment re-ranking of the surviving holds on the same space"
          - "the LicenseAgreement whose booking_id == this booking and whose status IN {DRAFT, ISSUED} moves to VOIDED, returning its deposit_held_cents to Client.credit_balance_cents"
          - "every ServiceOrder for this booking whose approval_status IN {PENDING_APPROVAL, APPROVED} moves to CANCELLED and its billing_status moves to VOID"
          - "SpaceUnit.committed_space_days for this booking's space_id decreases by EventBooking.space_days_committed"
          - "order_posture recomputed to LOCKED"
      - from: TENTATIVE
        to: CANCELLED
        trigger: "POST /convention-center/bookings/{id}/cancel"
        actor: VenueAdmin
        preconditions:
          - "hold_count == 0"
        side_effects:
          - "SpaceUnit.committed_space_days for this booking's space_id decreases by EventBooking.space_days_committed"
          - "order_posture recomputed to LOCKED"
      - from: DEFINITE
        to: IN_HOUSE
        trigger: "POST /convention-center/bookings/{id}/open-show"
        actor: EventServicesManager
        preconditions:
          - "the logical clock date is >= move_in_start_date"
          - "the LicenseAgreement whose booking_id == this booking has status == EXECUTED"
        side_effects:
          - "order_posture recomputed to OPEN"
      - from: DEFINITE
        to: RELEASED
        trigger: "POST /convention-center/bookings/{id}/release"
        actor: VenueAdmin
        preconditions:
          - "no EventSettlement exists whose booking_id == this booking"
        side_effects:
          - "same cascade as the TENTATIVE to RELEASED transition"
      - from: DEFINITE
        to: CANCELLED
        trigger: "POST /convention-center/bookings/{id}/cancel"
        actor: VenueAdmin
        preconditions:
          - "hold_count == 0"
        side_effects:
          - "SpaceUnit.committed_space_days for this booking's space_id decreases by EventBooking.space_days_committed"
          - "order_posture recomputed to LOCKED"
      - from: IN_HOUSE
        to: CLOSED
        trigger: "POST /convention-center/bookings/{id}/close"
        actor: EventServicesManager
        preconditions:
          - "the logical clock date is > move_out_end_date"
          - "every ServiceOrder for this booking has billing_status IN {RECONCILED, VOID}"
          - "every LaborCall for this booking has status IN {ACTUALIZED, CANCELLED}"
        side_effects:
          - "order_posture recomputed to RESTRICTED"
          - "the CateringArrangement whose booking_id == this booking and whose status == APPROVED moves to CLOSED and its buyout_fee_cents is recomputed with calculations.fnb_buyout_fee variant ACTUAL"
      - from: CLOSED
        to: SETTLED
        trigger: "system: cascade from EventSettlement ISSUED to FINAL or ARBITRATION to FINAL"
        actor: system
        preconditions:
          - "the EventSettlement whose booking_id == this booking has status == FINAL"
        side_effects:
          - "Client.outstanding_balance_cents increases by EventSettlement.grand_total_cents"
          - "that change re-runs calculations.client_booking_standing, which may move Client.booking_standing from GOOD to HOLD_RESTRICTED"
          - "a HOLD_RESTRICTED standing in turn recomputes order_posture to LOCKED on every other EventBooking of the same client whose status IN {TENTATIVE, DEFINITE, IN_HOUSE, CLOSED}"
          - "order_posture on this booking recomputed to LOCKED"
        note: "depth-4 cascade: settlement -> booking -> client -> sibling bookings"

  - entity: SpaceHold
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: CHALLENGED
        trigger: "POST /convention-center/holds/{id}/challenge"
        actor: SalesManager
        preconditions:
          - "this hold status == ACTIVE"
          - "the challenger hold named by challenger_hold_id has status == ACTIVE and its interval [interval_start_date, interval_end_date] overlaps this hold's interval on the same space or an ancestor or descendant space"
          - "BookingPolicyWindow.priority_rank of the challenger's booking is strictly less than BookingPolicyWindow.priority_rank of this hold's booking"
          - "challenge_round < BookingPolicyWindow.max_challenge_rounds of this hold's booking"
        side_effects:
          - "challenged_by_hold_id set to challenger_hold_id"
          - "challenge_round incremented by 1"
          - "challenge_deadline_utc set to the logical clock instant plus BookingPolicyWindow.challenge_response_hours"
      - from: CHALLENGED
        to: ACTIVE
        trigger: "POST /convention-center/holds/{id}/answer-challenge"
        actor: SalesManager
        preconditions:
          - "this hold status == CHALLENGED"
          - "the logical clock instant is <= challenge_deadline_utc"
        side_effects:
          - "the challenger hold named by challenged_by_hold_id moves to RELEASED"
          - "that release decrements EventBooking.hold_count on the challenger's booking, and when the challenger's booking hold_count reaches 0 and its status == TENTATIVE the booking moves to RELEASED"
          - "calculations.hold_rank_assignment re-ranks the surviving holds on the space"
          - "challenged_by_hold_id and challenge_deadline_utc cleared"
        note: "the cycle: a hold may be challenged and survive repeatedly until max_challenge_rounds"
      - from: CHALLENGED
        to: RELEASED
        trigger: "POST /convention-center/_ops/hold-sweep"
        actor: system
        preconditions:
          - "the logical clock instant is > challenge_deadline_utc"
        side_effects:
          - "EventBooking.hold_count on this hold's booking decremented by 1"
          - "when the resulting hold_count == 0 and that booking status == TENTATIVE, the booking moves to RELEASED"
          - "that booking release moves its LicenseAgreement whose status IN {DRAFT, ISSUED} to VOIDED and returns deposit_held_cents to Client.credit_balance_cents"
          - "that license void cancels every ServiceOrder of the booking whose approval_status IN {PENDING_APPROVAL, APPROVED}, setting billing_status to VOID"
          - "the challenger hold named by challenged_by_hold_id is promoted by calculations.hold_rank_assignment and every lower hold on the space shifts up one rank"
        note: "depth-4 cascade: hold -> booking -> license -> service orders"
      - from: ACTIVE
        to: CONFIRMED
        trigger: "POST /convention-center/holds/{id}/confirm-first-option"
        actor: SalesManager
        preconditions:
          - "this hold status == ACTIVE"
          - "hold_rank == 1"
          - "the logical clock instant is <= release_deadline_utc"
        side_effects:
          - "status becomes CONFIRMED; the hold no longer participates in challenge evaluation"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /convention-center/holds/{id}/release"
        actor: SalesManager
        preconditions:
          - "this hold status == ACTIVE"
        side_effects:
          - "EventBooking.hold_count decremented by 1"
          - "calculations.hold_rank_assignment re-ranks the surviving holds on the space"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /convention-center/maintenance-blackouts/{id}/approve"
        actor: system
        preconditions:
          - "the approved blackout window plus buffer_days on both sides intersects this hold's [interval_start_date, interval_end_date] on the blackout's space or any descendant space"
        side_effects:
          - "EventBooking.hold_count decremented by 1"
          - "when the resulting hold_count == 0 and that booking status IN {TENTATIVE, DEFINITE}, the booking moves to RELEASED"
          - "that booking release moves its LicenseAgreement whose status IN {DRAFT, ISSUED} to VOIDED and returns deposit_held_cents to Client.credit_balance_cents"
        note: "depth-3 cascade originating from a MaintenanceBlackout approval"

  - entity: LicenseAgreement
    initial_state: DRAFT
    terminal_states: [VOIDED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /convention-center/licenses/{id}/issue"
        actor: SalesManager
        preconditions:
          - "the booking named by booking_id has status == TENTATIVE"
          - "Client.credit_balance_cents >= this license deposit_required_cents"
        side_effects:
          - "deposit_held_cents set to deposit_required_cents"
          - "Client.credit_balance_cents decreased by the same amount"
          - "issued_at_utc stamped with the logical clock instant"
      - from: ISSUED
        to: EXECUTED
        trigger: "POST /convention-center/licenses/{id}/countersign"
        actor: Licensee
        preconditions:
          - "the acting X-User-ID equals the client_id of the booking named by booking_id"
        side_effects:
          - "executed_at_utc stamped with the logical clock instant"
      - from: EXECUTED
        to: AMENDMENT_PENDING
        trigger: "POST /convention-center/licenses/{id}/amendments"
        actor: SalesManager
        preconditions:
          - "amendment_round < MAX_AMENDMENT_ROUNDS"
          - "expected_license_version equals the license current version"
          - "the booking named by booking_id has status IN {TENTATIVE, DEFINITE, IN_HOUSE}"
        side_effects:
          - "pending_amendment_note set to the submitted note"
          - "increments LicenseAgreement.version by 1"
      - from: AMENDMENT_PENDING
        to: EXECUTED
        trigger: "POST /convention-center/licenses/{id}/accept-amendment"
        actor: Licensee
        preconditions:
          - "the acting X-User-ID equals the client_id of the booking named by booking_id"
        side_effects:
          - "amendment_round incremented by 1"
          - "pending_amendment_note cleared"
        note: "the negotiation cycle EXECUTED -> AMENDMENT_PENDING -> EXECUTED, bounded by MAX_AMENDMENT_ROUNDS"
      - from: DRAFT
        to: VOIDED
        trigger: "system: cascade from EventBooking to RELEASED"
        actor: system
        preconditions:
          - "the booking named by booking_id has moved to RELEASED"
        side_effects:
          - "deposit_held_cents set to 0 and the prior amount returned to Client.credit_balance_cents"
      - from: ISSUED
        to: VOIDED
        trigger: "system: cascade from EventBooking to RELEASED"
        actor: system
        preconditions:
          - "the booking named by booking_id has moved to RELEASED"
        side_effects:
          - "deposit_held_cents set to 0 and the prior amount returned to Client.credit_balance_cents"
          - "every ServiceOrder of the booking whose approval_status IN {PENDING_APPROVAL, APPROVED} moves to CANCELLED with billing_status VOID"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /convention-center/licenses/{id}/terminate"
        actor: VenueAdmin
        preconditions:
          - "no EventSettlement exists whose booking_id == this license booking_id"
        side_effects:
          - "deposit_held_cents set to 0 and the prior amount returned to Client.credit_balance_cents, restoring the monetary invariant"
          - "the booking named by booking_id moves to RELEASED"
          - "that booking release decrements SpaceUnit.committed_space_days by EventBooking.space_days_committed, restoring the capacity invariant"
          - "that booking release moves every SpaceHold of the booking whose status IN {ACTIVE, CHALLENGED, CONFIRMED} to RELEASED"

  - entity: ServiceOrder
    state_field: approval_status
    initial_state: PENDING_APPROVAL
    terminal_states: [REJECTED, CANCELLED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /convention-center/service-orders/{id}/approve"
        actor: EventServicesManager
        preconditions:
          - "the booking named by booking_id has order_posture == OPEN"
          - "Vendor.coi_expiry_date of the named vendor is strictly after the logical clock date"
        side_effects:
          - "billing_status moves UNBILLED to ESTIMATED on the same row"
          - "estimated_charge_cents recomputed by calculations.service_order_charge"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /convention-center/service-orders/{id}/reject"
        actor: EventServicesManager
        preconditions:
          - "approval_status == PENDING_APPROVAL"
        side_effects:
          - "billing_status moves UNBILLED to VOID on the same row"
      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "POST /convention-center/service-orders/{id}/cancel"
        actor: EventServicesManager
        preconditions:
          - "approval_status == PENDING_APPROVAL"
        side_effects:
          - "billing_status moves UNBILLED to VOID on the same row"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /convention-center/service-orders/{id}/cancel"
        actor: EventServicesManager
        preconditions:
          - "billing_status != RECONCILED"
        side_effects:
          - "billing_status moves ESTIMATED to VOID on the same row"
        note: "guarded by the other state dimension on the same row"

  - entity: ServiceOrder
    state_field: billing_status
    initial_state: UNBILLED
    terminal_states: [RECONCILED, VOID]
    transitions:
      - from: UNBILLED
        to: ESTIMATED
        trigger: "system: cascade from ServiceOrder approval_status PENDING_APPROVAL to APPROVED"
        actor: system
        preconditions:
          - "approval_status == APPROVED"
        side_effects:
          - "estimated_charge_cents written by calculations.service_order_charge over ordered_quantity"
      - from: ESTIMATED
        to: RECONCILED
        trigger: "POST /convention-center/service-orders/{id}/reconcile"
        actor: EventServicesManager
        preconditions:
          - "approval_status == APPROVED"
          - "the booking named by booking_id has status == IN_HOUSE and order_posture IN {OPEN, RESTRICTED}"
        side_effects:
          - "actual_quantity stored and actual_charge_cents written by calculations.service_order_charge over actual_quantity"
      - from: UNBILLED
        to: VOID
        trigger: "system: cascade from ServiceOrder approval_status to REJECTED or CANCELLED"
        actor: system
        preconditions:
          - "approval_status IN {REJECTED, CANCELLED}"
        side_effects:
          - "estimated_charge_cents and actual_charge_cents left at 0 and null respectively"
      - from: ESTIMATED
        to: VOID
        trigger: "system: cascade from ServiceOrder approval_status APPROVED to CANCELLED"
        actor: system
        preconditions:
          - "approval_status == CANCELLED"
        side_effects:
          - "estimated_charge_cents reset to 0"
        note: "the two dimensions advance independently: approval_status may reach CANCELLED while billing_status is already RECONCILED, in which case the cancel is refused"

  - entity: EventSettlement
    initial_state: DRAFT
    terminal_states: [FINAL]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /convention-center/settlements/{id}/issue"
        actor: SettlementAnalyst
        preconditions:
          - "the booking named by booking_id has status == CLOSED"
          - "when basis == ACTUAL_USAGE, at least one SpaceUsageRecord exists whose booking_id == this booking"
          - "at least one SettlementLineItem exists whose settlement_id == this settlement"
        side_effects:
          - "line_subtotal_cents recomputed by calculations.settlement_line_extension"
          - "facility_service_fee_cents recomputed by calculations.facility_service_fee"
          - "grand_total_cents recomputed"
          - "issued_by_user_id set to the acting X-User-ID"
          - "issued_at_utc set to the logical clock instant and dispute_deadline_utc set to issued_at_utc plus DISPUTE_WINDOW_HOURS"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /convention-center/settlements/{id}/dispute"
        actor: Licensee
        preconditions:
          - "the acting X-User-ID equals the client_id of the booking named by booking_id"
          - "the logical clock instant is <= dispute_deadline_utc"
        side_effects:
          - "dispute_reason stored"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /convention-center/settlements/{id}/issue"
        actor: SettlementAnalyst
        preconditions:
          - "revision_round < MAX_SETTLEMENT_REVISIONS"
        side_effects:
          - "revision_round incremented by 1"
          - "dispute_reason cleared"
          - "line_subtotal_cents, facility_service_fee_cents and grand_total_cents recomputed over the current SettlementLineItem set, which may have changed while DISPUTED"
          - "issued_by_user_id set to the acting X-User-ID and issued_at_utc plus dispute_deadline_utc restamped"
        note: "the dispute cycle ISSUED -> DISPUTED -> ISSUED, bounded by MAX_SETTLEMENT_REVISIONS"
      - from: DISPUTED
        to: ARBITRATION
        trigger: "POST /convention-center/settlements/{id}/escalate"
        actor: SettlementAnalyst
        preconditions:
          - "revision_round >= MAX_SETTLEMENT_REVISIONS"
        side_effects:
          - "dispute_reason retained as the arbitration statement"
      - from: ISSUED
        to: FINAL
        trigger: "POST /convention-center/settlements/{id}/finalize"
        actor: SettlementAnalyst
        preconditions:
          - "the logical clock instant is > dispute_deadline_utc"
          - "the acting X-User-ID differs from issued_by_user_id"
        side_effects:
          - "deposit_applied_cents set to the LicenseAgreement.deposit_held_cents of this booking and that field set to 0, preserving the monetary invariant"
          - "grand_total_cents recomputed as line_subtotal_cents plus facility_service_fee_cents minus deposit_applied_cents"
          - "finalized_by_user_id set to the acting X-User-ID"
          - "the booking named by booking_id moves CLOSED to SETTLED, which increases Client.outstanding_balance_cents and may flip Client.booking_standing to HOLD_RESTRICTED, which in turn locks order_posture on the client's other bookings"
      - from: ARBITRATION
        to: FINAL
        trigger: "POST /convention-center/settlements/{id}/arbitrate-finalize"
        actor: VenueAdmin
        preconditions:
          - "status == ARBITRATION"
        side_effects:
          - "same deposit application, grand_total recomputation and booking cascade as the ISSUED to FINAL transition"

  - entity: LaborCall
    initial_state: SCHEDULED
    terminal_states: [ACTUALIZED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /convention-center/labor-calls/{id}/dispatch"
        actor: EventServicesManager
        preconditions:
          - "the booking named by booking_id has status == IN_HOUSE"
          - "UnionJurisdiction.lockout_active == false"
        side_effects:
          - "no monetary change; estimated_charge_cents already written at creation"
      - from: DISPATCHED
        to: ACTUALIZED
        trigger: "POST /convention-center/labor-calls/{id}/actualize"
        actor: EventServicesManager
        preconditions:
          - "actual_start_hour < actual_end_hour"
        side_effects:
          - "actual_charge_cents written by calculations.union_labor_charge variant ACTUALIZED"
          - "billed_hours recomputed by calculations.union_crew_hours_committed and UnionJurisdiction.committed_crew_hours adjusted by the difference"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /convention-center/labor-calls/{id}/cancel"
        actor: EventServicesManager
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "UnionJurisdiction.committed_crew_hours decreased by billed_hours and billed_hours set to 0, restoring the capacity invariant"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /convention-center/labor-calls/{id}/cancel"
        actor: EventServicesManager
        preconditions:
          - "status == DISPATCHED"
        side_effects:
          - "UnionJurisdiction.committed_crew_hours decreased by billed_hours and billed_hours set to 0"

  - entity: CateringArrangement
    initial_state: PROPOSED
    terminal_states: [DENIED, CLOSED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /convention-center/catering-arrangements/{id}/approve"
        actor: EventServicesManager
        preconditions:
          - "the booking named by booking_id has order_posture == OPEN"
          - "when arrangement_type == OUTSIDE_EXCEPTION, exception_reason is non-null and Vendor.is_in_house_caterer == false"
        side_effects:
          - "buyout_fee_cents written by calculations.fnb_buyout_fee variant ESTIMATED"
      - from: PROPOSED
        to: DENIED
        trigger: "POST /convention-center/catering-arrangements/{id}/deny"
        actor: EventServicesManager
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "buyout_fee_cents set to 0"
      - from: APPROVED
        to: CLOSED
        trigger: "system: cascade from EventBooking IN_HOUSE to CLOSED"
        actor: system
        preconditions:
          - "actual_fnb_cents is non-null"
        side_effects:
          - "buyout_fee_cents recomputed by calculations.fnb_buyout_fee variant ACTUAL"

  - entity: MaintenanceBlackout
    initial_state: PROPOSED
    terminal_states: [APPROVED, DEFERRED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /convention-center/maintenance-blackouts/{id}/approve"
        actor: FacilitiesPlanner
        preconditions:
          - "no EventBooking on the blackout space or any descendant space has status IN {DEFINITE, IN_HOUSE} with an interval that comes within buffer_days of the window"
        side_effects:
          - "SpaceUnit.active_blackout_count incremented by 1"
          - "every SpaceHold whose interval comes within buffer_days of the window on this space or a descendant moves to RELEASED"
          - "each such release decrements EventBooking.hold_count, and a booking reaching hold_count 0 with status IN {TENTATIVE, DEFINITE} moves to RELEASED"
          - "that booking release moves its LicenseAgreement whose status IN {DRAFT, ISSUED} to VOIDED and returns deposit_held_cents to Client.credit_balance_cents"
      - from: PROPOSED
        to: DEFERRED
        trigger: "POST /convention-center/maintenance-blackouts/{id}/defer"
        actor: FacilitiesPlanner
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "no space or booking state changes"

concurrency_rules:
  - rule_id: amendment-create-stale-license
    parent_entity: LicenseAgreement
    write_endpoint: "POST /convention-center/licenses/{id}/amendments"
    occ_field: "expected_license_version"
    description: |
      Opening an amendment on a LicenseAgreement whose version has advanced
      past the value the client last observed is rejected with a stale-version
      error. A new amendment legitimately supersedes the negotiation baseline,
      so a writer holding an outdated view of the license must re-read before
      it may open the next round.
    error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412
  - rule_id: hold-add-stale-booking
    parent_entity: EventBooking
    write_endpoint: "POST /convention-center/bookings/{id}/holds"
    occ_field: "expected_booking_version"
    description: |
      Adding a SpaceHold to an EventBooking whose version has advanced past the
      value the client last observed is rejected with a stale-version error.
      Each accepted hold re-derives hold_count and the hold hierarchy on the
      space, so a writer whose view of the booking predates that derivation is
      working from a superseded hold ladder.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

calculations:
  - name: contracted_rental_charge
    trigger: "on POST /convention-center/bookings (creation) and on any accepted license amendment that changes the booking dates"
    algorithm: threshold
    formula: |
      show_days      = date_diff_days(show_end_date, show_start_date) + 1
      move_in_days   = date_diff_days(show_start_date, move_in_start_date)
      move_out_days  = date_diff_days(move_out_end_date, show_end_date)
      billable_units = show_days + MOVE_PERIOD_FACTOR * (move_in_days + move_out_days)
      gross_rental_cents      = round_half_up(SpaceUnit.daily_base_rate_cents * billable_units)
      contracted_rental_cents = round_half_up(gross_rental_cents * (1 - BookingPolicyWindow.rental_discount_pct))
      deposit_required_cents  = round_half_up(contracted_rental_cents * DEPOSIT_PCT)
    input_set: "the single EventBooking being created, its SpaceUnit named by space_id, and the BookingPolicyWindow whose event_class equals the booking's event_class"
    constants:
      MOVE_PERIOD_FACTOR: 0.5
      DEPOSIT_PCT: 0.25
    precision: "integer cents, round_half_up applied at each of the three assignments in the order written"

  - name: space_days_committed
    trigger: "on POST /convention-center/bookings (creation); reversed on any EventBooking transition to RELEASED or CANCELLED"
    algorithm: aggregation
    formula: |
      EventBooking.space_days_committed = date_diff_days(move_out_end_date, move_in_start_date) + 1
      SpaceUnit.committed_space_days (for space_id) += EventBooking.space_days_committed on creation
      SpaceUnit.committed_space_days (for space_id) -= EventBooking.space_days_committed when the booking
        leaves the set {TENTATIVE, DEFINITE, IN_HOUSE, CLOSED, SETTLED}
    input_set: "EventBooking rows whose space_id == this SpaceUnit.id and whose status IN {TENTATIVE, DEFINITE, IN_HOUSE, CLOSED, SETTLED}; rows with status IN {RELEASED, CANCELLED} are excluded"
    constants: {}
    precision: "integer day counts, closed interval on both endpoints"

  - name: hold_rank_assignment
    trigger: "on POST /convention-center/bookings/{id}/holds and on every SpaceHold transition to RELEASED"
    algorithm: chronological
    formula: |
      candidate_set(H) = SpaceHold rows S such that
          S.status IN {ACTIVE, CHALLENGED, CONFIRMED}
        AND S.id != H.id
        AND space_of(S) is the same SpaceUnit as space_of(H), or an ancestor of it, or a descendant of it
        AND [S.interval_start_date, S.interval_end_date] intersects
            [H.interval_start_date, H.interval_end_date]   # closed on both ends: shared endpoint counts as intersecting
      on insert:  H.hold_rank = 1 + count(candidate_set(H))
      on release: order the surviving rows of candidate_set(released_hold)
                  by (hold_rank ASC, created_at ASC) and reassign hold_rank = 1..N
      empty candidate_set on insert -> H.hold_rank = 1
    input_set: "SpaceHold rows with status IN {ACTIVE, CHALLENGED, CONFIRMED} on the target space and on every ancestor and descendant space, whose closed date interval intersects the new hold's closed date interval"
    constants: {}
    precision: "integer rank starting at 1; ties in hold_rank broken by created_at ASC and never by id"

  - name: settlement_rental_basis
    trigger: "on POST /convention-center/settlements/{id}/issue, to produce the amount_cents the RENTAL SettlementLineItem must carry"
    algorithm: interval_merge
    formula: |
      variant CONTRACTED:
        rental_basis_cents = EventBooking.contracted_rental_cents
      variant ACTUAL_USAGE:
        # PINNED ROUNDING ORDER: round each usage day first, THEN sum, THEN apply the class discount.
        for each SpaceUsageRecord of the booking, ordered by usage_date ASC:
            day_amount_cents = round_half_up(SpaceUnit.daily_base_rate_cents * USAGE_FACTOR[usage_kind])
        raw_usage_cents    = sum(day_amount_cents)
        rental_basis_cents = round_half_up(raw_usage_cents * (1 - BookingPolicyWindow.rental_discount_pct))
    input_set: "for CONTRACTED, only the EventBooking row; for ACTUAL_USAGE, every SpaceUsageRecord whose booking_id == the settlement's booking_id, with no status filter because SpaceUsageRecord is immutable and append-only"
    constants:
      USAGE_FACTOR_MOVE_IN: 0.5
      USAGE_FACTOR_SHOW: 1.0
      USAGE_FACTOR_DARK: 0.125
      USAGE_FACTOR_MOVE_OUT: 0.5
      USAGE_FACTOR_HOLDOVER: 1.5
    precision: "integer cents; round_half_up per usage day and again after the discount. Summing the unrounded day products and rounding once is explicitly WRONG and yields a different total."
    variants:
      - name: CONTRACTED
        when: "EventSettlement.basis == CONTRACTED"
        difference: "ignores every SpaceUsageRecord and bills the licensed rental exactly as contracted"
      - name: ACTUAL_USAGE
        when: "EventSettlement.basis == ACTUAL_USAGE"
        difference: "re-prices each attested day at its own usage factor, so dark days bill at one eighth of the daily rate and holdover days at 150 percent"

  - name: settlement_line_extension
    trigger: "on POST /convention-center/settlements/{id}/issue"
    algorithm: aggregation
    formula: |
      line_subtotal_cents = sum(SettlementLineItem.amount_cents
                                for rows whose settlement_id == this settlement,
                                processed in created_at ASC order)
      the row whose line_kind == RENTAL MUST carry amount_cents equal to
        calculations.settlement_rental_basis for the settlement's basis
    input_set: "every SettlementLineItem whose settlement_id == this EventSettlement.id; SettlementLineItem is immutable and append-only so no status filter applies"
    constants: {}
    precision: "integer cents; ADJUSTMENT lines may be negative and are added with their sign"

  - name: facility_service_fee
    trigger: "on POST /convention-center/settlements/{id}/issue and again on POST /convention-center/settlements/{id}/finalize"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER. The fee is keyed on line_subtotal_cents, while grand_total_cents
      # includes the fee, so the dependency only looks circular; these five steps resolve it.
      step 1: line_subtotal_cents        = calculations.settlement_line_extension
      step 2: fee_pct                    = FEE_PCT_LOW    if line_subtotal_cents <  FEE_TIER_1_CENTS
                                           FEE_PCT_MID    if line_subtotal_cents <  FEE_TIER_2_CENTS
                                           FEE_PCT_HIGH   otherwise
      step 3: facility_service_fee_cents = round_half_up(line_subtotal_cents * fee_pct)
      step 4: deposit_applied_cents      = LicenseAgreement.deposit_held_cents at finalization, else 0
      step 5: grand_total_cents          = line_subtotal_cents + facility_service_fee_cents
                                           - deposit_applied_cents
      # fee_pct is NEVER keyed on grand_total_cents; recomputing the tier from the total is WRONG.
    input_set: "the single EventSettlement row and its SettlementLineItem set; the LicenseAgreement whose booking_id equals the settlement's booking_id supplies deposit_held_cents at step 4"
    constants:
      FEE_TIER_1_CENTS: 5000000
      FEE_TIER_2_CENTS: 20000000
      FEE_PCT_LOW: 0.09
      FEE_PCT_MID: 0.07
      FEE_PCT_HIGH: 0.055
    precision: "integer cents, round_half_up once at step 3. Tier selection is strict less-than at both breakpoints, so a subtotal of exactly 5000000 takes FEE_PCT_MID."

  - name: service_order_charge
    trigger: "on ServiceOrder approval_status PENDING_APPROVAL to APPROVED (over ordered_quantity) and on POST /convention-center/service-orders/{id}/reconcile (over actual_quantity)"
    algorithm: tiered_pricing
    formula: |
      q = ordered_quantity for the ESTIMATED write, actual_quantity for the RECONCILED write
      base_units_cents =
        UTILITIES -> marginal tiers: min(q,100)*UTIL_TIER1_CENTS
                     + max(0, min(q,400)-100)*UTIL_TIER2_CENTS
                     + max(0, q-400)*UTIL_TIER3_CENTS
        RIGGING   -> q * RIG_POINT_CENTS
        CLEANING  -> q * CLEAN_SQFT_CENTS
        SECURITY  -> q * GUARD_HOUR_CENTS
      timing_factor     = LATE_ORDER_FACTOR if ServiceOrder.order_timing == LATE else 1.00
      vendor_multiplier = 1.00 if Vendor.vendor_tier == EXCLUSIVE
                          VENDOR_PREFERRED_MULT if Vendor.vendor_tier == PREFERRED
                          VENDOR_OPEN_MULT      if Vendor.vendor_tier == OPEN
      combined_factor   = min(timing_factor * vendor_multiplier, SURCHARGE_CAP)
      charge_cents      = max(MIN_ORDER_CENTS, round_half_up(base_units_cents * combined_factor))
    input_set: "the single ServiceOrder row, the Vendor named by vendor_id, and the EventBooking named by booking_id whose show_start_date fixes order_timing"
    constants:
      UTIL_TIER1_CENTS: 1200
      UTIL_TIER2_CENTS: 900
      UTIL_TIER3_CENTS: 700
      RIG_POINT_CENTS: 25000
      CLEAN_SQFT_CENTS: 6
      GUARD_HOUR_CENTS: 4200
      LATE_ORDER_FACTOR: 1.35
      VENDOR_PREFERRED_MULT: 1.10
      VENDOR_OPEN_MULT: 1.25
      SURCHARGE_CAP: 1.40
      MIN_ORDER_CENTS: 15000
      ADVANCE_CUTOFF_DAYS: 30
    precision: "integer cents; round_half_up applied once inside the max(), after the combined factor is applied to the tiered base"

  - name: union_labor_charge
    trigger: "on POST /convention-center/bookings/{id}/labor-calls (variant SCHEDULED_ESTIMATE) and on POST /convention-center/labor-calls/{id}/actualize (variant ACTUALIZED)"
    algorithm: threshold
    formula: |
      variant SCHEDULED_ESTIMATE:
        hours_per_member       = max(UnionJurisdiction.min_call_hours,
                                     scheduled_end_hour - scheduled_start_hour)
        estimated_charge_cents = round_half_up(crew_size * hours_per_member
                                               * UnionJurisdiction.straight_time_rate_cents)
        # the estimate bills every hour at straight time and never applies the overtime multiplier
      variant ACTUALIZED:
        span_hours   = actual_end_hour - actual_start_hour
        st_hours     = max(0, min(actual_end_hour, st_window_end_hour)
                              - max(actual_start_hour, st_window_start_hour))
        ot_hours     = span_hours - st_hours
        uplift_hours = max(0, UnionJurisdiction.min_call_hours - span_hours)
        actual_charge_cents = round_half_up(crew_size * st_hours * straight_time_rate_cents)
                            + round_half_up(crew_size * ot_hours * straight_time_rate_cents
                                             * overtime_multiplier)
                            + round_half_up(crew_size * uplift_hours * straight_time_rate_cents)
        # PINNED: round each of the three bands separately, then add the three integers
    input_set: "the single LaborCall row and the UnionJurisdiction named by jurisdiction_id"
    constants: {}
    precision: "integer cents; round_half_up per band, then integer addition of the three bands"
    variants:
      - name: SCHEDULED_ESTIMATE
        when: "written at LaborCall creation from scheduled_start_hour and scheduled_end_hour"
        difference: "prices the whole call at straight time regardless of where the scheduled hours fall relative to the straight-time window"
      - name: ACTUALIZED
        when: "written on the DISPATCHED to ACTUALIZED transition from actual_start_hour and actual_end_hour"
        difference: "splits the span at the straight-time window edges and charges the outside-window hours at overtime_multiplier, so identical total hours cost more when they start before st_window_start_hour"

  - name: union_crew_hours_committed
    trigger: "on POST /convention-center/bookings/{id}/labor-calls, on POST /convention-center/labor-calls/{id}/actualize, and reversed on any LaborCall transition to CANCELLED"
    algorithm: aggregation
    formula: |
      LaborCall.billed_hours = crew_size * max(UnionJurisdiction.min_call_hours,
          (actual_end_hour - actual_start_hour) if status == ACTUALIZED
          else (scheduled_end_hour - scheduled_start_hour))
      UnionJurisdiction.committed_crew_hours = sum(LaborCall.billed_hours
          for calls whose jurisdiction_id == this local
          and whose status IN {SCHEDULED, DISPATCHED, ACTUALIZED})
      capacity gate: for any single work_date, the sum of billed_hours over that local's calls
          on that work_date with status IN {SCHEDULED, DISPATCHED, ACTUALIZED}
          MUST be <= UnionJurisdiction.max_crew_hours_per_day
    input_set: "LaborCall rows whose jurisdiction_id == this UnionJurisdiction.id and whose status IN {SCHEDULED, DISPATCHED, ACTUALIZED}; CANCELLED calls are excluded"
    constants: {}
    precision: "crew-hours to one decimal place; the aggregate gate compares with <= so an exactly-full day is still accepted"

  - name: fnb_buyout_fee
    trigger: "on POST /convention-center/catering-arrangements/{id}/approve (variant ESTIMATED) and on the EventBooking IN_HOUSE to CLOSED cascade (variant ACTUAL)"
    algorithm: threshold
    formula: |
      if arrangement_type == IN_HOUSE:
          buyout_fee_cents = 0
      else:
          basis_cents      = estimated_fnb_cents for variant ESTIMATED,
                             actual_fnb_cents    for variant ACTUAL
          buyout_fee_cents = max(MIN_BUYOUT_CENTS, round_half_up(basis_cents * BUYOUT_PCT))
    input_set: "the single CateringArrangement row and the Vendor named by vendor_id"
    constants:
      BUYOUT_PCT: 0.22
      MIN_BUYOUT_CENTS: 250000
    precision: "integer cents; round_half_up inside the max()"
    variants:
      - name: ESTIMATED
        when: "PROPOSED to APPROVED transition"
        difference: "keys the fee on estimated_fnb_cents supplied by the client at proposal time"
      - name: ACTUAL
        when: "APPROVED to CLOSED cascade from the booking close"
        difference: "keys the fee on actual_fnb_cents recorded after the event, so the floor may bind for one variant and not the other"

  - name: client_booking_standing
    trigger: "on every EventSettlement transition to FINAL (from ISSUED or from ARBITRATION)"
    algorithm: threshold
    formula: |
      Client.outstanding_balance_cents = sum(EventSettlement.grand_total_cents
          for settlements whose booking's client_id == this Client.id
          and whose status == FINAL)
      Client.booking_standing = HOLD_RESTRICTED
          if Client.outstanding_balance_cents > STANDING_THRESHOLD_CENTS
          else GOOD
      # strict greater-than: an outstanding balance of exactly STANDING_THRESHOLD_CENTS stays GOOD
    input_set: "EventSettlement rows reachable from this Client through EventBooking.client_id whose status == FINAL; settlements in DRAFT, ISSUED, DISPUTED or ARBITRATION are excluded"
    constants:
      STANDING_THRESHOLD_CENTS: 10000000
    precision: "integer cents; comparison is strict greater-than"

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 20
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 25
    category: auth
    check: "when the acting role is Licensee, X-User-ID equals the client_id of the EventBooking reached from the target resource"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /convention-center/licenses/{id}/countersign, POST /convention-center/licenses/{id}/accept-amendment, POST /convention-center/settlements/{id}/dispute, POST /convention-center/clients/{id}/deposits, GET /convention-center/bookings/{id}"
  - priority: 30
    category: existence
    check: "every id in the request path resolves, validated left to right"
    error_id: "one of ERR_CLIENT_NOT_FOUND, ERR_SPACE_NOT_FOUND, ERR_POLICY_WINDOW_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_HOLD_NOT_FOUND, ERR_LICENSE_NOT_FOUND, ERR_VENDOR_NOT_FOUND, ERR_JURISDICTION_NOT_FOUND, ERR_SERVICE_ORDER_NOT_FOUND, ERR_LABOR_CALL_NOT_FOUND, ERR_CATERING_NOT_FOUND, ERR_SETTLEMENT_NOT_FOUND, ERR_BLACKOUT_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a templated path segment"
  - priority: 32
    category: existence
    check: "every foreign-key id in the request body resolves, validated in the field order declared by the endpoint's input list"
    error_id: "one of ERR_CLIENT_NOT_FOUND, ERR_SPACE_NOT_FOUND, ERR_VENDOR_NOT_FOUND, ERR_JURISDICTION_NOT_FOUND, ERR_HOLD_NOT_FOUND, ERR_SETTLEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /convention-center/bookings, POST /convention-center/bookings/{id}/service-orders, POST /convention-center/bookings/{id}/labor-calls, POST /convention-center/bookings/{id}/catering-arrangements, POST /convention-center/holds/{id}/challenge, POST /convention-center/settlement-line-items, POST /convention-center/maintenance-blackouts"
  - priority: 34
    category: existence
    check: "a BookingPolicyWindow row exists whose event_class equals the submitted event_class"
    error_id: ERR_POLICY_WINDOW_MISSING
    http_status: 422
    applies_to: "POST /convention-center/bookings"
  - priority: 36
    category: business_constraint
    check: "request body types, enum membership, positive quantities, and date ordering move_in_start_date <= show_start_date <= show_end_date <= move_out_end_date are all satisfied"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 38
    category: business_safety
    check: "event_class == CITYWIDE_CONVENTION requires Client.organization_type == NATIONAL_ASSOCIATION and projected_room_nights >= CITYWIDE_MIN_ROOM_NIGHTS (2500)"
    error_id: ERR_CITYWIDE_QUALIFICATION_NOT_MET
    http_status: 422
    applies_to: "POST /convention-center/bookings"
  - priority: 40
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: "one of ERR_BOOKING_STATE_INVALID, ERR_HOLD_STATE_INVALID, ERR_LICENSE_STATE_INVALID, ERR_SERVICE_ORDER_STATE_INVALID, ERR_LABOR_CALL_STATE_INVALID, ERR_CATERING_STATE_INVALID, ERR_SETTLEMENT_STATE_INVALID, ERR_BLACKOUT_STATE_INVALID"
    http_status: 409
    applies_to: "every state-transition endpoint"
  - priority: 41
    category: state
    check: "the parent EventBooking.order_posture == OPEN for creation of a ServiceOrder, LaborCall or CateringArrangement and for the approve transitions of those children; RESTRICTED still permits POST /convention-center/service-orders/{id}/reconcile while LOCKED permits nothing"
    error_id: ERR_ORDER_POSTURE_NOT_OPEN
    http_status: 409
    applies_to: "POST /convention-center/bookings/{id}/service-orders, POST /convention-center/bookings/{id}/labor-calls, POST /convention-center/bookings/{id}/catering-arrangements, POST /convention-center/service-orders/{id}/approve, POST /convention-center/catering-arrangements/{id}/approve, POST /convention-center/service-orders/{id}/reconcile"
  - priority: 42
    category: state
    check: "expected_license_version equals LicenseAgreement.version"
    error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412
    applies_to: "POST /convention-center/licenses/{id}/amendments"
  - priority: 42
    category: state
    check: "expected_booking_version equals EventBooking.version"
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412
    applies_to: "POST /convention-center/bookings/{id}/holds"
  - priority: 44
    category: business_constraint
    check: "at most one BookingPolicyWindow row per event_class"
    error_id: ERR_POLICY_WINDOW_EXISTS
    http_status: 409
    applies_to: "POST /convention-center/policy-windows"
  - priority: 44
    category: business_constraint
    check: "no LicenseAgreement already exists for this booking whose status IN {DRAFT, ISSUED, EXECUTED, AMENDMENT_PENDING}"
    error_id: ERR_LICENSE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /convention-center/bookings/{id}/license"
  - priority: 44
    category: business_constraint
    check: "no EventSettlement already exists for this booking"
    error_id: ERR_SETTLEMENT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /convention-center/bookings/{id}/settlement"
  - priority: 44
    category: business_constraint
    check: "no CateringArrangement already exists for this booking whose status IN {PROPOSED, APPROVED, CLOSED}"
    error_id: ERR_CATERING_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /convention-center/bookings/{id}/catering-arrangements"
  - priority: 44
    category: business_constraint
    check: "no SpaceUsageRecord already exists for this booking on the submitted usage_date"
    error_id: ERR_USAGE_RECORD_DUPLICATE
    http_status: 409
    applies_to: "POST /convention-center/bookings/{id}/usage-records"
  - priority: 46
    category: auth
    check: "the acting X-User-ID differs from EventSettlement.issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /convention-center/settlements/{id}/finalize"
  - priority: 50
    category: business_safety
    check: "Vendor.coi_expiry_date is strictly after the logical clock date"
    error_id: ERR_VENDOR_COI_EXPIRED
    http_status: 422
    applies_to: "POST /convention-center/bookings/{id}/service-orders, POST /convention-center/service-orders/{id}/approve, POST /convention-center/bookings/{id}/catering-arrangements"
  - priority: 52
    category: business_safety
    check: "UnionJurisdiction.lockout_active == false"
    error_id: ERR_UNION_LOCKOUT
    http_status: 422
    applies_to: "POST /convention-center/bookings/{id}/labor-calls, POST /convention-center/labor-calls/{id}/dispatch"
  - priority: 54
    category: business_safety
    check: "service_category == RIGGING requires SpaceUnit.rigging_capable == true on the booking's space"
    error_id: ERR_SPACE_NOT_RIGGING_CAPABLE
    http_status: 422
    applies_to: "POST /convention-center/bookings/{id}/service-orders"
  - priority: 56
    category: business_safety
    check: "UnionJurisdiction.covered_category equals the submitted work_category"
    error_id: ERR_UNION_JURISDICTION_MISMATCH
    http_status: 422
    applies_to: "POST /convention-center/bookings/{id}/labor-calls"
  - priority: 60
    category: business_referential
    check: "Vendor.service_category equals the submitted service_category, and equals CATERING for a catering arrangement"
    error_id: ERR_VENDOR_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /convention-center/bookings/{id}/service-orders, POST /convention-center/bookings/{id}/catering-arrangements"
  - priority: 62
    category: business_referential
    check: "when at least one Vendor with vendor_tier == EXCLUSIVE exists for the submitted service_category, the named vendor must be that exclusive vendor"
    error_id: ERR_EXCLUSIVE_VENDOR_REQUIRED
    http_status: 422
    applies_to: "POST /convention-center/bookings/{id}/service-orders"
  - priority: 64
    category: business_referential
    check: "arrangement_type == IN_HOUSE requires Vendor.is_in_house_caterer == true; arrangement_type == OUTSIDE_EXCEPTION requires Vendor.is_in_house_caterer == false"
    error_id: ERR_CATERING_EXCLUSIVITY_VIOLATION
    http_status: 422
    applies_to: "POST /convention-center/bookings/{id}/catering-arrangements"
  - priority: 66
    category: business_referential
    check: "exception_reason is non-null when arrangement_type == OUTSIDE_EXCEPTION and null when arrangement_type == IN_HOUSE"
    error_id: ERR_OUTSIDE_CATERING_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /convention-center/bookings/{id}/catering-arrangements"
  - priority: 70
    category: business_temporal
    check: "whole months from the logical clock date to show_start_date is <= BookingPolicyWindow.open_months_before and >= BookingPolicyWindow.close_months_before"
    error_id: ERR_BOOKING_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /convention-center/bookings"
  - priority: 72
    category: business_temporal
    check: "the booking or hold closed interval clears every APPROVED MaintenanceBlackout on the space and on every ancestor and descendant space by strictly more than buffer_days on BOTH sides of the blackout window"
    error_id: ERR_MAINTENANCE_BLACKOUT_CONFLICT
    http_status: 409
    applies_to: "POST /convention-center/bookings, POST /convention-center/bookings/{id}/holds"
  - priority: 74
    category: business_temporal
    check: "no SpaceHold with status == CONFIRMED exists on the same space or any ancestor or descendant space whose closed interval intersects the new hold's closed interval; shared endpoints count as intersecting"
    error_id: ERR_SPACE_DATE_CONFLICT
    http_status: 409
    applies_to: "POST /convention-center/bookings/{id}/holds"
  - priority: 76
    category: business_temporal
    check: "the logical clock instant is <= SpaceHold.release_deadline_utc"
    error_id: ERR_RELEASE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /convention-center/holds/{id}/confirm-first-option"
  - priority: 78
    category: business_temporal
    check: "the logical clock instant is <= SpaceHold.challenge_deadline_utc"
    error_id: ERR_CHALLENGE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /convention-center/holds/{id}/answer-challenge"
  - priority: 79
    category: business_temporal
    check: "the logical clock date is >= EventBooking.move_in_start_date"
    error_id: ERR_MOVE_IN_NOT_REACHED
    http_status: 409
    applies_to: "POST /convention-center/bookings/{id}/open-show"
  - priority: 80
    category: business_temporal
    check: "the logical clock date is > EventBooking.move_out_end_date"
    error_id: ERR_EVENT_NOT_ENDED
    http_status: 409
    applies_to: "POST /convention-center/bookings/{id}/close"
  - priority: 81
    category: business_temporal
    check: "the logical clock instant is <= EventSettlement.dispute_deadline_utc"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /convention-center/settlements/{id}/dispute"
  - priority: 82
    category: business_temporal
    check: "the logical clock instant is > EventSettlement.dispute_deadline_utc"
    error_id: ERR_DISPUTE_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /convention-center/settlements/{id}/finalize"
  - priority: 83
    category: business_temporal
    check: "LaborCall.work_date falls inside the closed interval [move_in_start_date, move_out_end_date] of the booking"
    error_id: ERR_WORK_DATE_OUTSIDE_EVENT
    http_status: 422
    applies_to: "POST /convention-center/bookings/{id}/labor-calls"
  - priority: 84
    category: business_constraint
    check: "EventBooking.hold_count < BookingPolicyWindow.max_holds_per_booking"
    error_id: ERR_HOLD_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /convention-center/bookings/{id}/holds"
  - priority: 86
    category: business_constraint
    check: "the challenger hold's BookingPolicyWindow.priority_rank is strictly less than the challenged hold's BookingPolicyWindow.priority_rank and the two closed intervals intersect on the same, an ancestor, or a descendant space"
    error_id: ERR_CHALLENGE_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /convention-center/holds/{id}/challenge"
  - priority: 87
    category: business_constraint
    check: "SpaceHold.challenge_round < BookingPolicyWindow.max_challenge_rounds"
    error_id: ERR_CHALLENGE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /convention-center/holds/{id}/challenge"
  - priority: 88
    category: business_constraint
    check: "LicenseAgreement.amendment_round < MAX_AMENDMENT_ROUNDS (3)"
    error_id: ERR_AMENDMENT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /convention-center/licenses/{id}/amendments"
  - priority: 89
    category: business_constraint
    check: "EventSettlement.revision_round < MAX_SETTLEMENT_REVISIONS (2) for a re-issue, and >= MAX_SETTLEMENT_REVISIONS for an escalation"
    error_id: ERR_SETTLEMENT_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /convention-center/settlements/{id}/issue, POST /convention-center/settlements/{id}/escalate"
  - priority: 90
    category: business_constraint
    check: "SpaceHold.hold_rank == 1 for the confirming hold"
    error_id: ERR_HOLD_NOT_FIRST_OPTION
    http_status: 409
    applies_to: "POST /convention-center/holds/{id}/confirm-first-option"
  - priority: 91
    category: business_constraint
    check: "the sum of LaborCall.billed_hours on the target UnionJurisdiction for the submitted work_date, including the new call, is <= UnionJurisdiction.max_crew_hours_per_day"
    error_id: ERR_UNION_CREW_OVERCOMMITTED
    http_status: 409
    applies_to: "POST /convention-center/bookings/{id}/labor-calls, POST /convention-center/labor-calls/{id}/actualize"
  - priority: 92
    category: business_referential
    check: "basis == ACTUAL_USAGE requires at least one SpaceUsageRecord whose booking_id == the settlement's booking_id"
    error_id: ERR_NO_USAGE_RECORDS
    http_status: 422
    applies_to: "POST /convention-center/settlements/{id}/issue"
  - priority: 93
    category: business_referential
    check: "exactly one SettlementLineItem with line_kind == RENTAL exists and its amount_cents equals calculations.settlement_rental_basis for the settlement's basis"
    error_id: ERR_RENTAL_LINE_MISMATCH
    http_status: 422
    applies_to: "POST /convention-center/settlements/{id}/issue"
  - priority: 94
    category: business_referential
    check: "every ServiceOrder of the booking has billing_status IN {RECONCILED, VOID} and every LaborCall has status IN {ACTUALIZED, CANCELLED}"
    error_id: ERR_SERVICE_ORDERS_NOT_RECONCILED
    http_status: 409
    applies_to: "POST /convention-center/bookings/{id}/close"
  - priority: 95
    category: business_fiscal
    check: "Client.credit_balance_cents >= LicenseAgreement.deposit_required_cents"
    error_id: ERR_INSUFFICIENT_DEPOSIT_CREDIT
    http_status: 402
    applies_to: "POST /convention-center/licenses/{id}/issue"
  - priority: 96
    category: business_fiscal
    check: "Client.booking_standing == GOOD"
    error_id: ERR_CLIENT_HOLD_RESTRICTED
    http_status: 409
    applies_to: "POST /convention-center/bookings, POST /convention-center/bookings/{id}/holds, POST /convention-center/bookings/{id}/confirm-definite"
  - priority: 98
    category: business_fiscal
    check: "amount_cents > 0 for every line_kind other than ADJUSTMENT; ADJUSTMENT lines may be negative but line_subtotal_cents must remain > 0"
    error_id: ERR_LINE_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /convention-center/settlement-line-items"

endpoints:
  - method: POST
    path: "/convention-center/clients"
    description: "register a licensee organization"
    roles: [VenueAdmin, SalesManager]
    code: 201
    input: [legal_name, contact_email, organization_type]
    output: Client
    side_effects: ["credit_balance_cents, total_deposits_paid_cents and outstanding_balance_cents initialized to 0", "booking_standing initialized to GOOD"]
  - method: GET
    path: "/convention-center/clients"
    description: "list licensee organizations"
    roles: [VenueAdmin, SalesManager, SettlementAnalyst]
    code: 200
    input: ["limit?", "offset?", "organization_type?", "booking_standing?"]
    output: Client[]
    side_effects: []
  - method: GET
    path: "/convention-center/clients/{id}"
    description: "read one licensee organization"
    roles: [VenueAdmin, SalesManager, SettlementAnalyst, Licensee]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: "/convention-center/clients/{id}/deposits"
    description: "record a deposit payment received from the licensee"
    roles: [VenueAdmin, SettlementAnalyst, Licensee]
    code: 200
    input: [amount_cents]
    output: Client
    side_effects: ["total_deposits_paid_cents increased by amount_cents", "credit_balance_cents increased by amount_cents", "increments Client.version by 1"]

  - method: POST
    path: "/convention-center/spaces"
    description: "create a rentable space, optionally nested under a parent space"
    roles: [VenueAdmin, FacilitiesPlanner]
    code: 201
    input: [name, space_class, rentable_sqft, daily_base_rate_cents, "parent_space_id?", "rigging_capable?"]
    output: SpaceUnit
    side_effects: ["committed_space_days and active_blackout_count initialized to 0"]
  - method: GET
    path: "/convention-center/spaces"
    description: "list spaces, optionally filtered to the children of one parent space"
    roles: [VenueAdmin, FacilitiesPlanner, SalesManager, EventServicesManager]
    code: 200
    input: ["limit?", "offset?", "parent_space_id?", "space_class?"]
    output: SpaceUnit[]
    side_effects: []
  - method: GET
    path: "/convention-center/spaces/{id}"
    description: "read one space including its committed_space_days counter"
    roles: [VenueAdmin, FacilitiesPlanner, SalesManager, EventServicesManager]
    code: 200
    input: []
    output: SpaceUnit
    side_effects: []

  - method: POST
    path: "/convention-center/policy-windows"
    description: "publish the booking policy window for one event_class"
    roles: [VenueAdmin]
    code: 201
    input: [event_class, priority_rank, open_months_before, close_months_before, max_holds_per_booking, challenge_response_hours, rental_discount_pct, max_challenge_rounds]
    output: BookingPolicyWindow
    side_effects: []
  - method: GET
    path: "/convention-center/policy-windows"
    description: "list published booking policy windows"
    roles: [VenueAdmin, SalesManager, EventServicesManager, SettlementAnalyst]
    code: 200
    input: ["limit?", "offset?", "event_class?"]
    output: BookingPolicyWindow[]
    side_effects: []
  - method: GET
    path: "/convention-center/policy-windows/{id}"
    description: "read one booking policy window"
    roles: [VenueAdmin, SalesManager, EventServicesManager, SettlementAnalyst]
    code: 200
    input: []
    output: BookingPolicyWindow
    side_effects: []

  - method: POST
    path: "/convention-center/vendors"
    description: "register an event services or catering vendor"
    roles: [VenueAdmin, EventServicesManager]
    code: 201
    input: [legal_name, service_category, vendor_tier, coi_expiry_date, "is_in_house_caterer?"]
    output: Vendor
    side_effects: []
  - method: GET
    path: "/convention-center/vendors"
    description: "list vendors"
    roles: [VenueAdmin, EventServicesManager, SalesManager]
    code: 200
    input: ["limit?", "offset?", "service_category?", "vendor_tier?"]
    output: Vendor[]
    side_effects: []
  - method: GET
    path: "/convention-center/vendors/{id}"
    description: "read one vendor"
    roles: [VenueAdmin, EventServicesManager, SalesManager]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: POST
    path: "/convention-center/union-jurisdictions"
    description: "register a union local and its show-floor work rules"
    roles: [VenueAdmin]
    code: 201
    input: [craft_name, covered_category, straight_time_rate_cents, max_crew_hours_per_day, "overtime_multiplier?", "min_call_hours?", "st_window_start_hour?", "st_window_end_hour?", "lockout_active?"]
    output: UnionJurisdiction
    side_effects: ["committed_crew_hours initialized to 0"]
  - method: GET
    path: "/convention-center/union-jurisdictions"
    description: "list union locals"
    roles: [VenueAdmin, EventServicesManager]
    code: 200
    input: ["limit?", "offset?", "covered_category?"]
    output: UnionJurisdiction[]
    side_effects: []
  - method: GET
    path: "/convention-center/union-jurisdictions/{id}"
    description: "read one union local including committed_crew_hours"
    roles: [VenueAdmin, EventServicesManager]
    code: 200
    input: []
    output: UnionJurisdiction
    side_effects: []
  - method: PATCH
    path: "/convention-center/union-jurisdictions/{id}"
    description: "declare or lift a lockout, or adjust the daily crew-hour capacity"
    roles: [VenueAdmin]
    code: 200
    input: ["lockout_active?", "max_crew_hours_per_day?"]
    output: UnionJurisdiction
    side_effects: ["increments UnionJurisdiction.version by 1"]

  - method: POST
    path: "/convention-center/bookings"
    description: "create a tentative booking; resolves policy_window_id from event_class and runs calculations.contracted_rental_charge and calculations.space_days_committed"
    roles: [SalesManager, VenueAdmin]
    code: 201
    input: [client_id, space_id, event_name, event_class, move_in_start_date, show_start_date, show_end_date, move_out_end_date, "projected_room_nights?"]
    output: EventBooking
    side_effects: ["policy_window_id resolved", "gross_rental_cents, contracted_rental_cents and deposit_required_cents written by calculations.contracted_rental_charge", "space_days_committed written and SpaceUnit.committed_space_days increased by it", "status set to TENTATIVE and order_posture set to OPEN"]
  - method: GET
    path: "/convention-center/bookings"
    description: "list bookings filtered by client, space, policy window or status"
    roles: [VenueAdmin, SalesManager, EventServicesManager, SettlementAnalyst, FacilitiesPlanner]
    code: 200
    input: ["limit?", "offset?", "client_id?", "space_id?", "policy_window_id?", "status?"]
    output: EventBooking[]
    side_effects: []
  - method: GET
    path: "/convention-center/bookings/{id}"
    description: "read one booking including order_posture and the money fields"
    roles: [VenueAdmin, SalesManager, EventServicesManager, SettlementAnalyst, FacilitiesPlanner, Licensee]
    code: 200
    input: []
    output: EventBooking
    side_effects: []
  - method: POST
    path: "/convention-center/bookings/{id}/confirm-definite"
    description: "move a booking from TENTATIVE to DEFINITE once a hold is CONFIRMED and the license is EXECUTED"
    roles: [SalesManager]
    code: 200
    input: []
    output: EventBooking
    side_effects: ["status becomes DEFINITE", "order_posture recomputed"]
  - method: POST
    path: "/convention-center/bookings/{id}/open-show"
    description: "open the show floor once move-in has been reached"
    roles: [EventServicesManager]
    code: 200
    input: []
    output: EventBooking
    side_effects: ["status becomes IN_HOUSE"]
  - method: POST
    path: "/convention-center/bookings/{id}/close"
    description: "close the event after move-out, once all service orders and labor calls are settled"
    roles: [EventServicesManager]
    code: 200
    input: []
    output: EventBooking
    side_effects: ["status becomes CLOSED and order_posture becomes RESTRICTED", "the APPROVED CateringArrangement moves to CLOSED and its buyout_fee_cents is recomputed with variant ACTUAL"]
  - method: POST
    path: "/convention-center/bookings/{id}/release"
    description: "release a tentative or definite booking, cascading to holds, license and service orders"
    roles: [SalesManager, VenueAdmin]
    code: 200
    input: []
    output: EventBooking
    side_effects: ["status becomes RELEASED", "every non-terminal SpaceHold released and hold ranks re-derived", "the DRAFT or ISSUED LicenseAgreement moves to VOIDED and its deposit_held_cents returns to Client.credit_balance_cents", "every PENDING_APPROVAL or APPROVED ServiceOrder moves to CANCELLED with billing_status VOID", "SpaceUnit.committed_space_days decreased by space_days_committed"]
  - method: POST
    path: "/convention-center/bookings/{id}/cancel"
    description: "cancel a booking that holds no space"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: EventBooking
    side_effects: ["status becomes CANCELLED", "SpaceUnit.committed_space_days decreased by space_days_committed"]

  - method: POST
    path: "/convention-center/bookings/{id}/holds"
    description: "place a tentative hold on the booking's space; guarded by OCC on the booking version"
    roles: [SalesManager]
    code: 201
    input: [expected_booking_version]
    output: SpaceHold
    side_effects: ["hold_rank written by calculations.hold_rank_assignment", "interval_start_date and interval_end_date copied from the booking", "release_deadline_utc stamped at show_start_date minus RELEASE_LEAD_MONTHS (3) whole months", "EventBooking.hold_count incremented by 1", "increments EventBooking.version by 1"]
  - method: GET
    path: "/convention-center/holds"
    description: "list holds filtered by booking, by challenging hold, or by status"
    roles: [VenueAdmin, SalesManager, FacilitiesPlanner]
    code: 200
    input: ["limit?", "offset?", "booking_id?", "challenged_by_hold_id?", "status?"]
    output: SpaceHold[]
    side_effects: []
  - method: GET
    path: "/convention-center/holds/{id}"
    description: "read one hold including hold_rank and the two deadlines"
    roles: [VenueAdmin, SalesManager, FacilitiesPlanner]
    code: 200
    input: []
    output: SpaceHold
    side_effects: []
  - method: POST
    path: "/convention-center/holds/{id}/challenge"
    description: "challenge a lower-priority hold with a higher-priority hold on an overlapping interval"
    roles: [SalesManager]
    code: 200
    input: [challenger_hold_id]
    output: SpaceHold
    side_effects: ["status becomes CHALLENGED", "challenged_by_hold_id set", "challenge_round incremented by 1", "challenge_deadline_utc stamped at the clock instant plus BookingPolicyWindow.challenge_response_hours"]
  - method: POST
    path: "/convention-center/holds/{id}/answer-challenge"
    description: "answer a challenge before the deadline, releasing the challenger and returning to ACTIVE"
    roles: [SalesManager]
    code: 200
    input: []
    output: SpaceHold
    side_effects: ["status returns to ACTIVE", "the challenger hold moves to RELEASED and hold ranks are re-derived", "the challenger's booking may cascade to RELEASED when its hold_count reaches 0"]
  - method: POST
    path: "/convention-center/holds/{id}/confirm-first-option"
    description: "convert the first-option hold into a CONFIRMED hold"
    roles: [SalesManager]
    code: 200
    input: []
    output: SpaceHold
    side_effects: ["status becomes CONFIRMED"]
  - method: POST
    path: "/convention-center/holds/{id}/release"
    description: "release a hold and re-derive the ranks of the surviving holds"
    roles: [SalesManager, VenueAdmin]
    code: 200
    input: []
    output: SpaceHold
    side_effects: ["status becomes RELEASED", "EventBooking.hold_count decremented by 1", "surviving hold ranks re-derived by calculations.hold_rank_assignment"]

  - method: POST
    path: "/convention-center/bookings/{id}/license"
    description: "draft the license agreement for a booking, pinning space, dates, rate and deposit"
    roles: [SalesManager]
    code: 201
    input: []
    output: LicenseAgreement
    side_effects: ["rental_rate_cents, contracted_rental_cents and deposit_required_cents pinned from the booking and its space", "status set to DRAFT"]
  - method: GET
    path: "/convention-center/licenses"
    description: "list license agreements filtered by booking or status"
    roles: [VenueAdmin, SalesManager, SettlementAnalyst, Licensee]
    code: 200
    input: ["limit?", "offset?", "booking_id?", "status?"]
    output: LicenseAgreement[]
    side_effects: []
  - method: GET
    path: "/convention-center/licenses/{id}"
    description: "read one license agreement including deposit_held_cents and amendment_round"
    roles: [VenueAdmin, SalesManager, SettlementAnalyst, Licensee]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: []
  - method: POST
    path: "/convention-center/licenses/{id}/issue"
    description: "issue the license to the licensee and escrow the deposit"
    roles: [SalesManager]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: ["status becomes ISSUED", "deposit_held_cents set to deposit_required_cents and Client.credit_balance_cents decreased by the same amount", "issued_at_utc stamped"]
  - method: POST
    path: "/convention-center/licenses/{id}/countersign"
    description: "licensee countersigns the issued license"
    roles: [Licensee]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: ["status becomes EXECUTED", "executed_at_utc stamped"]
  - method: POST
    path: "/convention-center/licenses/{id}/amendments"
    description: "open an amendment round on an executed license; guarded by OCC on the license version"
    roles: [SalesManager]
    code: 200
    input: [expected_license_version, amendment_note]
    output: LicenseAgreement
    side_effects: ["status becomes AMENDMENT_PENDING", "pending_amendment_note stored", "increments LicenseAgreement.version by 1"]
  - method: POST
    path: "/convention-center/licenses/{id}/accept-amendment"
    description: "licensee accepts the open amendment, closing the round"
    roles: [Licensee]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: ["status returns to EXECUTED", "amendment_round incremented by 1", "pending_amendment_note cleared"]
  - method: POST
    path: "/convention-center/licenses/{id}/terminate"
    description: "terminate an executed license, refunding the escrowed deposit and releasing the booking"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: ["status becomes TERMINATED", "deposit_held_cents returned to Client.credit_balance_cents", "the booking moves to RELEASED, reversing SpaceUnit.committed_space_days and releasing every non-terminal SpaceHold"]

  - method: POST
    path: "/convention-center/bookings/{id}/service-orders"
    description: "order an event service against a vendor for this booking"
    roles: [EventServicesManager]
    code: 201
    input: [vendor_id, service_category, ordered_quantity]
    output: ServiceOrder
    side_effects: ["order_timing computed from the clock date against show_start_date minus ADVANCE_CUTOFF_DAYS", "approval_status set to PENDING_APPROVAL and billing_status set to UNBILLED"]
  - method: GET
    path: "/convention-center/service-orders"
    description: "list service orders filtered by booking, vendor, approval or billing dimension"
    roles: [VenueAdmin, EventServicesManager, SettlementAnalyst]
    code: 200
    input: ["limit?", "offset?", "booking_id?", "vendor_id?", "approval_status?", "billing_status?"]
    output: ServiceOrder[]
    side_effects: []
  - method: GET
    path: "/convention-center/service-orders/{id}"
    description: "read one service order including both state dimensions and both charge fields"
    roles: [VenueAdmin, EventServicesManager, SettlementAnalyst]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: []
  - method: POST
    path: "/convention-center/service-orders/{id}/approve"
    description: "approve a service order, which also advances the billing dimension to ESTIMATED"
    roles: [EventServicesManager]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["approval_status becomes APPROVED", "billing_status becomes ESTIMATED", "estimated_charge_cents written by calculations.service_order_charge over ordered_quantity"]
  - method: POST
    path: "/convention-center/service-orders/{id}/reject"
    description: "reject a pending service order"
    roles: [EventServicesManager]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["approval_status becomes REJECTED", "billing_status becomes VOID"]
  - method: POST
    path: "/convention-center/service-orders/{id}/cancel"
    description: "cancel a pending or approved service order that has not been reconciled"
    roles: [EventServicesManager]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["approval_status becomes CANCELLED", "billing_status becomes VOID and estimated_charge_cents reset to 0"]
  - method: POST
    path: "/convention-center/service-orders/{id}/reconcile"
    description: "record metered usage and price the actual charge"
    roles: [EventServicesManager]
    code: 200
    input: [actual_quantity]
    output: ServiceOrder
    side_effects: ["billing_status becomes RECONCILED", "actual_charge_cents written by calculations.service_order_charge over actual_quantity"]

  - method: POST
    path: "/convention-center/bookings/{id}/labor-calls"
    description: "call union crew for show-floor work on one date"
    roles: [EventServicesManager]
    code: 201
    input: [jurisdiction_id, work_category, work_date, scheduled_start_hour, scheduled_end_hour, crew_size]
    output: LaborCall
    side_effects: ["status set to SCHEDULED", "billed_hours written by calculations.union_crew_hours_committed and UnionJurisdiction.committed_crew_hours increased by it", "estimated_charge_cents written by calculations.union_labor_charge variant SCHEDULED_ESTIMATE"]
  - method: GET
    path: "/convention-center/labor-calls"
    description: "list labor calls filtered by booking, union local or status"
    roles: [VenueAdmin, EventServicesManager, SettlementAnalyst]
    code: 200
    input: ["limit?", "offset?", "booking_id?", "jurisdiction_id?", "status?"]
    output: LaborCall[]
    side_effects: []
  - method: GET
    path: "/convention-center/labor-calls/{id}"
    description: "read one labor call including billed_hours and both charge fields"
    roles: [VenueAdmin, EventServicesManager, SettlementAnalyst]
    code: 200
    input: []
    output: LaborCall
    side_effects: []
  - method: POST
    path: "/convention-center/labor-calls/{id}/dispatch"
    description: "dispatch the called crew on show day"
    roles: [EventServicesManager]
    code: 200
    input: []
    output: LaborCall
    side_effects: ["status becomes DISPATCHED"]
  - method: POST
    path: "/convention-center/labor-calls/{id}/actualize"
    description: "record the hours actually worked and price them against the straight-time window"
    roles: [EventServicesManager]
    code: 200
    input: [actual_start_hour, actual_end_hour]
    output: LaborCall
    side_effects: ["status becomes ACTUALIZED", "actual_charge_cents written by calculations.union_labor_charge variant ACTUALIZED", "billed_hours recomputed and UnionJurisdiction.committed_crew_hours adjusted by the difference"]
  - method: POST
    path: "/convention-center/labor-calls/{id}/cancel"
    description: "cancel a labor call and return its crew-hours to the local"
    roles: [EventServicesManager]
    code: 200
    input: []
    output: LaborCall
    side_effects: ["status becomes CANCELLED", "UnionJurisdiction.committed_crew_hours decreased by billed_hours and billed_hours set to 0"]

  - method: POST
    path: "/convention-center/bookings/{id}/catering-arrangements"
    description: "propose an in-house or outside-exception food and beverage arrangement"
    roles: [EventServicesManager]
    code: 201
    input: [vendor_id, arrangement_type, estimated_fnb_cents, "exception_reason?"]
    output: CateringArrangement
    side_effects: ["status set to PROPOSED and buyout_fee_cents set to 0"]
  - method: GET
    path: "/convention-center/catering-arrangements"
    description: "list catering arrangements filtered by booking, vendor or status"
    roles: [VenueAdmin, EventServicesManager, SettlementAnalyst]
    code: 200
    input: ["limit?", "offset?", "booking_id?", "vendor_id?", "status?"]
    output: CateringArrangement[]
    side_effects: []
  - method: GET
    path: "/convention-center/catering-arrangements/{id}"
    description: "read one catering arrangement including buyout_fee_cents"
    roles: [VenueAdmin, EventServicesManager, SettlementAnalyst]
    code: 200
    input: []
    output: CateringArrangement
    side_effects: []
  - method: POST
    path: "/convention-center/catering-arrangements/{id}/approve"
    description: "approve the arrangement and price the estimated buyout fee"
    roles: [EventServicesManager]
    code: 200
    input: []
    output: CateringArrangement
    side_effects: ["status becomes APPROVED", "buyout_fee_cents written by calculations.fnb_buyout_fee variant ESTIMATED"]
  - method: POST
    path: "/convention-center/catering-arrangements/{id}/deny"
    description: "deny a proposed arrangement"
    roles: [EventServicesManager]
    code: 200
    input: []
    output: CateringArrangement
    side_effects: ["status becomes DENIED and buyout_fee_cents set to 0"]
  - method: PATCH
    path: "/convention-center/catering-arrangements/{id}"
    description: "record the settled food and beverage spend before the booking closes"
    roles: [EventServicesManager]
    code: 200
    input: [actual_fnb_cents]
    output: CateringArrangement
    side_effects: ["actual_fnb_cents stored", "increments CateringArrangement.version by 1"]

  - method: POST
    path: "/convention-center/bookings/{id}/usage-records"
    description: "attest how the space was actually used on one calendar day"
    roles: [EventServicesManager]
    code: 201
    input: [usage_date, usage_kind]
    output: SpaceUsageRecord
    side_effects: ["recorded_by_user_id stamped from X-User-ID", "the record is immutable once written"]
  - method: GET
    path: "/convention-center/usage-records"
    description: "list attested usage days for a booking"
    roles: [VenueAdmin, EventServicesManager, SettlementAnalyst]
    code: 200
    input: ["limit?", "offset?", "booking_id?"]
    output: SpaceUsageRecord[]
    side_effects: []
  - method: GET
    path: "/convention-center/bookings/{id}/usage-records"
    description: "read the attested usage days belonging to one booking, in usage_date order"
    roles: [VenueAdmin, EventServicesManager, SettlementAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: SpaceUsageRecord[]
    side_effects: []

  - method: POST
    path: "/convention-center/bookings/{id}/settlement"
    description: "open the event settlement for a closed booking on the chosen rental basis"
    roles: [SettlementAnalyst]
    code: 201
    input: [basis]
    output: EventSettlement
    side_effects: ["status set to DRAFT with revision_round 0 and every money field 0"]
  - method: GET
    path: "/convention-center/settlements"
    description: "list settlements filtered by booking or status"
    roles: [VenueAdmin, SettlementAnalyst, Licensee]
    code: 200
    input: ["limit?", "offset?", "booking_id?", "status?"]
    output: EventSettlement[]
    side_effects: []
  - method: GET
    path: "/convention-center/settlements/{id}"
    description: "read one settlement including subtotal, fee, deposit applied and grand total"
    roles: [VenueAdmin, SettlementAnalyst, Licensee]
    code: 200
    input: []
    output: EventSettlement
    side_effects: []
  - method: POST
    path: "/convention-center/settlement-line-items"
    description: "append an immutable charge line to a settlement"
    roles: [SettlementAnalyst]
    code: 201
    input: [settlement_id, line_kind, amount_cents, "source_ref_id?", "memo?"]
    output: SettlementLineItem
    side_effects: ["the line is appended; settlement totals are not recomputed until the settlement is issued"]
  - method: GET
    path: "/convention-center/settlement-line-items"
    description: "list the charge lines of a settlement"
    roles: [VenueAdmin, SettlementAnalyst, Licensee]
    code: 200
    input: ["limit?", "offset?", "settlement_id?", "line_kind?"]
    output: SettlementLineItem[]
    side_effects: []
  - method: GET
    path: "/convention-center/settlements/{id}/line-items"
    description: "read the charge lines belonging to one settlement, in append order"
    roles: [VenueAdmin, SettlementAnalyst, Licensee]
    code: 200
    input: ["limit?", "offset?"]
    output: SettlementLineItem[]
    side_effects: []
  - method: POST
    path: "/convention-center/settlements/{id}/issue"
    description: "issue or re-issue the settlement to the licensee, recomputing subtotal, facility service fee and grand total"
    roles: [SettlementAnalyst]
    code: 200
    input: []
    output: EventSettlement
    side_effects: ["status becomes ISSUED", "line_subtotal_cents, facility_service_fee_cents and grand_total_cents recomputed", "issued_by_user_id set to X-User-ID, issued_at_utc stamped and dispute_deadline_utc set to issued_at_utc plus DISPUTE_WINDOW_HOURS (240)", "revision_round incremented by 1 when re-issued from DISPUTED"]
  - method: POST
    path: "/convention-center/settlements/{id}/dispute"
    description: "licensee disputes an issued settlement inside the dispute window"
    roles: [Licensee]
    code: 200
    input: [dispute_reason]
    output: EventSettlement
    side_effects: ["status becomes DISPUTED", "dispute_reason stored"]
  - method: POST
    path: "/convention-center/settlements/{id}/escalate"
    description: "escalate a settlement to arbitration once the revision limit is exhausted"
    roles: [SettlementAnalyst]
    code: 200
    input: []
    output: EventSettlement
    side_effects: ["status becomes ARBITRATION"]
  - method: POST
    path: "/convention-center/settlements/{id}/finalize"
    description: "finalize an issued settlement after the dispute window closes; the finalizing user must differ from the issuing user"
    roles: [SettlementAnalyst]
    code: 200
    input: []
    output: EventSettlement
    side_effects: ["status becomes FINAL and finalized_by_user_id set to X-User-ID", "deposit_applied_cents set from LicenseAgreement.deposit_held_cents which is then zeroed", "grand_total_cents recomputed", "the booking moves CLOSED to SETTLED, Client.outstanding_balance_cents increases and Client.booking_standing may flip to HOLD_RESTRICTED, locking order_posture on the client's other bookings"]
  - method: POST
    path: "/convention-center/settlements/{id}/arbitrate-finalize"
    description: "venue administrator finalizes a settlement out of arbitration"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: EventSettlement
    side_effects: ["same effects as the finalize endpoint, without the dispute-window and segregation-of-duties checks"]

  - method: POST
    path: "/convention-center/maintenance-blackouts"
    description: "propose a facility maintenance window or capital project on a space"
    roles: [FacilitiesPlanner]
    code: 201
    input: [space_id, window_start_date, window_end_date, project_kind, "buffer_days?"]
    output: MaintenanceBlackout
    side_effects: ["status set to PROPOSED"]
  - method: GET
    path: "/convention-center/maintenance-blackouts"
    description: "list maintenance windows filtered by space or status"
    roles: [VenueAdmin, FacilitiesPlanner, SalesManager]
    code: 200
    input: ["limit?", "offset?", "space_id?", "status?"]
    output: MaintenanceBlackout[]
    side_effects: []
  - method: GET
    path: "/convention-center/maintenance-blackouts/{id}"
    description: "read one maintenance window"
    roles: [VenueAdmin, FacilitiesPlanner, SalesManager]
    code: 200
    input: []
    output: MaintenanceBlackout
    side_effects: []
  - method: POST
    path: "/convention-center/maintenance-blackouts/{id}/approve"
    description: "approve the maintenance window, releasing every hold it collides with"
    roles: [FacilitiesPlanner]
    code: 200
    input: []
    output: MaintenanceBlackout
    side_effects: ["status becomes APPROVED", "SpaceUnit.active_blackout_count incremented by 1", "colliding SpaceHold rows move to RELEASED, which may cascade their bookings to RELEASED and their licenses to VOIDED"]
  - method: POST
    path: "/convention-center/maintenance-blackouts/{id}/defer"
    description: "defer a proposed maintenance window without touching the booking calendar"
    roles: [FacilitiesPlanner]
    code: 200
    input: []
    output: MaintenanceBlackout
    side_effects: ["status becomes DEFERRED"]

  - method: POST
    path: "/convention-center/_ops/hold-sweep"
    description: "advance the hold epoch: release every CHALLENGED hold whose challenge_deadline_utc has passed and every ACTIVE hold whose release_deadline_utc has passed, promote challengers, and cascade booking, license and service-order effects"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: { expired_challenge_count: integer, released_hold_count: integer, promoted_hold_count: integer, released_booking_count: integer }
    side_effects: ["CHALLENGED holds past challenge_deadline_utc move to RELEASED", "ACTIVE holds past release_deadline_utc move to RELEASED", "surviving hold ranks re-derived by calculations.hold_rank_assignment", "bookings reaching hold_count 0 while TENTATIVE move to RELEASED, voiding their DRAFT or ISSUED licenses and cancelling their service orders"]
  - method: POST
    path: "/convention-center/_clock/set_current_utc"
    description: "set the server logical clock used by every deadline, window and order-timing rule. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [VenueAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["the logical clock is set; no entity is mutated and no sweep is performed"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Licensee acts on a resource whose booking client_id differs from the acting X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals EventSettlement.issued_by_user_id on a finalize attempt"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "no Client matches the supplied client id"
  - id: ERR_SPACE_NOT_FOUND
    http: 404
    condition: "no SpaceUnit matches the supplied space id"
  - id: ERR_POLICY_WINDOW_NOT_FOUND
    http: 404
    condition: "no BookingPolicyWindow matches the supplied policy window id"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "no EventBooking matches the supplied booking id"
  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "no SpaceHold matches the supplied hold id or challenger_hold_id"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "no LicenseAgreement matches the supplied license id"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "no Vendor matches the supplied vendor_id"
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "no UnionJurisdiction matches the supplied jurisdiction_id"
  - id: ERR_SERVICE_ORDER_NOT_FOUND
    http: 404
    condition: "no ServiceOrder matches the supplied service order id"
  - id: ERR_LABOR_CALL_NOT_FOUND
    http: 404
    condition: "no LaborCall matches the supplied labor call id"
  - id: ERR_CATERING_NOT_FOUND
    http: 404
    condition: "no CateringArrangement matches the supplied catering arrangement id"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "no EventSettlement matches the supplied settlement id or settlement_id"
  - id: ERR_BLACKOUT_NOT_FOUND
    http: 404
    condition: "no MaintenanceBlackout matches the supplied blackout id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, unknown enum member, non-positive quantity, or booking dates out of the required non-decreasing order"
  - id: ERR_POLICY_WINDOW_MISSING
    http: 422
    condition: "no BookingPolicyWindow is published for the submitted event_class"
  - id: ERR_CITYWIDE_QUALIFICATION_NOT_MET
    http: 422
    condition: "event_class CITYWIDE_CONVENTION requested by a client whose organization_type is not NATIONAL_ASSOCIATION, or with projected_room_nights below 2500"
  - id: ERR_BOOKING_STATE_INVALID
    http: 409
    condition: "the EventBooking is not in a state from which the requested transition is declared"
  - id: ERR_HOLD_STATE_INVALID
    http: 409
    condition: "the SpaceHold is not in a state from which the requested transition is declared"
  - id: ERR_LICENSE_STATE_INVALID
    http: 409
    condition: "the LicenseAgreement is not in a state from which the requested transition is declared"
  - id: ERR_SERVICE_ORDER_STATE_INVALID
    http: 409
    condition: "the ServiceOrder approval_status or billing_status is not in a state from which the requested transition is declared"
  - id: ERR_LABOR_CALL_STATE_INVALID
    http: 409
    condition: "the LaborCall is not in a state from which the requested transition is declared"
  - id: ERR_CATERING_STATE_INVALID
    http: 409
    condition: "the CateringArrangement is not in a state from which the requested transition is declared"
  - id: ERR_SETTLEMENT_STATE_INVALID
    http: 409
    condition: "the EventSettlement is not in a state from which the requested transition is declared"
  - id: ERR_BLACKOUT_STATE_INVALID
    http: 409
    condition: "the MaintenanceBlackout is not PROPOSED when approve or defer is called"
  - id: ERR_ORDER_POSTURE_NOT_OPEN
    http: 409
    condition: "the parent EventBooking.order_posture is not OPEN for an operation that requires an open posture"
  - id: ERR_STALE_LICENSE_VERSION
    http: 412
    condition: "expected_license_version does not equal the current LicenseAgreement.version"
  - id: ERR_STALE_BOOKING_VERSION
    http: 412
    condition: "expected_booking_version does not equal the current EventBooking.version"
  - id: ERR_POLICY_WINDOW_EXISTS
    http: 409
    condition: "a BookingPolicyWindow already exists for the submitted event_class"
  - id: ERR_LICENSE_ALREADY_EXISTS
    http: 409
    condition: "the booking already has a LicenseAgreement whose status is DRAFT, ISSUED, EXECUTED or AMENDMENT_PENDING"
  - id: ERR_SETTLEMENT_ALREADY_EXISTS
    http: 409
    condition: "the booking already has an EventSettlement"
  - id: ERR_CATERING_ALREADY_EXISTS
    http: 409
    condition: "the booking already has a CateringArrangement whose status is PROPOSED, APPROVED or CLOSED"
  - id: ERR_USAGE_RECORD_DUPLICATE
    http: 409
    condition: "a SpaceUsageRecord already exists for this booking on the submitted usage_date"
  - id: ERR_VENDOR_COI_EXPIRED
    http: 422
    condition: "Vendor.coi_expiry_date is at or before the logical clock date"
  - id: ERR_UNION_LOCKOUT
    http: 422
    condition: "UnionJurisdiction.lockout_active is true"
  - id: ERR_SPACE_NOT_RIGGING_CAPABLE
    http: 422
    condition: "a RIGGING service order is placed on a space whose rigging_capable is false"
  - id: ERR_UNION_JURISDICTION_MISMATCH
    http: 422
    condition: "UnionJurisdiction.covered_category differs from the submitted work_category"
  - id: ERR_VENDOR_CATEGORY_MISMATCH
    http: 422
    condition: "Vendor.service_category differs from the submitted service_category, or is not CATERING for a catering arrangement"
  - id: ERR_EXCLUSIVE_VENDOR_REQUIRED
    http: 422
    condition: "an EXCLUSIVE vendor exists for the service_category but a different vendor was named"
  - id: ERR_CATERING_EXCLUSIVITY_VIOLATION
    http: 422
    condition: "arrangement_type IN_HOUSE names a vendor whose is_in_house_caterer is false, or OUTSIDE_EXCEPTION names the in-house caterer"
  - id: ERR_OUTSIDE_CATERING_REASON_REQUIRED
    http: 422
    condition: "exception_reason is null for an OUTSIDE_EXCEPTION arrangement, or non-null for an IN_HOUSE arrangement"
  - id: ERR_BOOKING_WINDOW_CLOSED
    http: 422
    condition: "whole months from the logical clock date to show_start_date falls outside the event_class window bounds"
  - id: ERR_MAINTENANCE_BLACKOUT_CONFLICT
    http: 409
    condition: "the requested interval fails to clear an APPROVED MaintenanceBlackout window by more than buffer_days on both sides, on the space or any ancestor or descendant space"
  - id: ERR_SPACE_DATE_CONFLICT
    http: 409
    condition: "a CONFIRMED SpaceHold with an intersecting closed interval already exists on the space or an ancestor or descendant space"
  - id: ERR_RELEASE_DEADLINE_PASSED
    http: 409
    condition: "the logical clock instant is past SpaceHold.release_deadline_utc"
  - id: ERR_CHALLENGE_DEADLINE_PASSED
    http: 409
    condition: "the logical clock instant is past SpaceHold.challenge_deadline_utc"
  - id: ERR_MOVE_IN_NOT_REACHED
    http: 409
    condition: "the logical clock date is before EventBooking.move_in_start_date on an open-show attempt"
  - id: ERR_EVENT_NOT_ENDED
    http: 409
    condition: "the logical clock date is at or before EventBooking.move_out_end_date on a close attempt"
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 409
    condition: "the logical clock instant is past EventSettlement.dispute_deadline_utc on a dispute attempt"
  - id: ERR_DISPUTE_WINDOW_OPEN
    http: 409
    condition: "the logical clock instant is at or before EventSettlement.dispute_deadline_utc on a finalize attempt"
  - id: ERR_WORK_DATE_OUTSIDE_EVENT
    http: 422
    condition: "LaborCall.work_date lies outside the closed interval from move_in_start_date to move_out_end_date"
  - id: ERR_HOLD_LIMIT_REACHED
    http: 409
    condition: "EventBooking.hold_count already equals BookingPolicyWindow.max_holds_per_booking"
  - id: ERR_CHALLENGE_NOT_PERMITTED
    http: 422
    condition: "the challenger's policy priority_rank is not strictly better than the challenged hold's, or the two intervals do not intersect on a related space"
  - id: ERR_CHALLENGE_LIMIT_REACHED
    http: 409
    condition: "SpaceHold.challenge_round already equals BookingPolicyWindow.max_challenge_rounds"
  - id: ERR_AMENDMENT_LIMIT_REACHED
    http: 409
    condition: "LicenseAgreement.amendment_round already equals 3"
  - id: ERR_SETTLEMENT_REVISION_LIMIT_REACHED
    http: 409
    condition: "a re-issue is attempted with revision_round already at 2, or an escalation is attempted with revision_round below 2"
  - id: ERR_HOLD_NOT_FIRST_OPTION
    http: 409
    condition: "confirm-first-option is called on a hold whose hold_rank is not 1"
  - id: ERR_UNION_CREW_OVERCOMMITTED
    http: 409
    condition: "the local's billed crew-hours for the work_date would exceed max_crew_hours_per_day"
  - id: ERR_NO_USAGE_RECORDS
    http: 422
    condition: "an ACTUAL_USAGE settlement is issued while no SpaceUsageRecord exists for the booking"
  - id: ERR_RENTAL_LINE_MISMATCH
    http: 422
    condition: "the settlement has no RENTAL line, more than one RENTAL line, or a RENTAL amount_cents that differs from the rental basis for the settlement's basis"
  - id: ERR_SERVICE_ORDERS_NOT_RECONCILED
    http: 409
    condition: "a close attempt finds a ServiceOrder whose billing_status is UNBILLED or ESTIMATED, or a LaborCall still SCHEDULED or DISPATCHED"
  - id: ERR_INSUFFICIENT_DEPOSIT_CREDIT
    http: 402
    condition: "Client.credit_balance_cents is below the license deposit_required_cents on an issue attempt"
  - id: ERR_CLIENT_HOLD_RESTRICTED
    http: 409
    condition: "Client.booking_standing is HOLD_RESTRICTED on a new booking, new hold, or confirm-definite attempt"
  - id: ERR_LINE_AMOUNT_INVALID
    http: 422
    condition: "a non-ADJUSTMENT line carries amount_cents <= 0, or an ADJUSTMENT would drive line_subtotal_cents to 0 or below"

roles:
  - name: Licensee
    description: "the licensee organization acting on its own bookings, licenses and settlements"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "countersign an issued LicenseAgreement"
      - "accept an open license amendment"
      - "dispute an issued EventSettlement inside the dispute window"
    shared_operations:
      - "record a deposit payment on its own Client record"
      - "read its own bookings, licenses, settlements and settlement line items"
  - name: SalesManager
    description: "books space, manages the tentative hold hierarchy and negotiates the license agreement"
    identity: "opaque"
    exclusive_operations:
      - "create an EventBooking"
      - "place a SpaceHold on a booking"
      - "challenge a hold and answer a challenge"
      - "confirm the first-option hold"
      - "draft and issue a LicenseAgreement"
      - "open a license amendment round"
      - "confirm a booking as DEFINITE"
    shared_operations:
      - "create a Client"
      - "release a booking"
      - "release a hold"
      - "read spaces, vendors, policy windows and bookings"
  - name: EventServicesManager
    description: "runs event services ordering, union labor coordination, catering and show-floor attestation"
    identity: "opaque"
    exclusive_operations:
      - "open and close the show floor"
      - "create, approve, reject, cancel and reconcile a ServiceOrder"
      - "create, dispatch, actualize and cancel a LaborCall"
      - "create, approve and deny a CateringArrangement and record its actual food and beverage spend"
      - "attest a SpaceUsageRecord"
    shared_operations:
      - "create a Vendor"
      - "read spaces, bookings, vendors and union locals"
  - name: SettlementAnalyst
    description: "assembles, issues, escalates and finalizes event settlements"
    identity: "opaque"
    exclusive_operations:
      - "open an EventSettlement on a closed booking"
      - "append SettlementLineItem rows"
      - "issue and re-issue a settlement"
      - "escalate a disputed settlement to arbitration"
      - "finalize an issued settlement"
    shared_operations:
      - "record a deposit payment on a Client"
      - "read clients, bookings, service orders, labor calls, catering and settlements"
  - name: FacilitiesPlanner
    description: "schedules facility maintenance windows and capital projects around the booking calendar"
    identity: "opaque"
    exclusive_operations:
      - "propose a MaintenanceBlackout"
      - "approve a MaintenanceBlackout"
      - "defer a MaintenanceBlackout"
    shared_operations:
      - "create a SpaceUnit"
      - "read spaces, holds, bookings and maintenance windows"
  - name: VenueAdmin
    description: "venue administrator holding the configuration, override and epoch-advance powers"
    identity: "opaque"
    exclusive_operations:
      - "publish a BookingPolicyWindow"
      - "register a UnionJurisdiction and declare or lift a lockout"
      - "cancel a booking"
      - "terminate an executed LicenseAgreement"
      - "finalize a settlement out of arbitration"
      - "run the hold sweep"
      - "set the logical clock"
    shared_operations:
      - "create clients, spaces and vendors"
      - "release a booking"
      - "release a hold"
      - "read every collection"
