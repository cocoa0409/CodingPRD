# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Benefits Administration & Open Enrollment — Expert
# 9 rule_ids × 2 instances = 18 instances.
# Every ${var} is bound by an earlier captures: block in the same instance.
# Every expected_employee_version references a ${var} (never a literal).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: retro_deduction_prospective_vs_retroactive
        grounds:
          - calculations.compute_retro_deduction_delta
          - state_machines.LifeEvent.SUBMITTED_to_APPROVED
          - entities.DeductionLine.line_type
        distinguishing_aspect: |
          Same approved life event inputs over the Enrollment/DeductionLine domain:
          PROSPECTIVE posts zero RETRO_ADJUSTMENT lines (total delta 0) while
          RETROACTIVE posts (new_pp - old_pp) per processed period (total 27000).
        test_recipe:
          setup:
            - "Employee FULL_TIME, SEMI_MONTHLY, hired 2026-01-01; waiting period elapsed -> ELIGIBLE."
            - "Active MEDICAL SILVER EMPLOYEE_ONLY enrollment (per_paycheck 4500); 3 pay periods run."
            - "Two life events submitted moving to MEDICAL GOLD EMPLOYEE_PLUS_SPOUSE (per_paycheck 13500), event_date 2026-02-01 (on/before all 3 processed periods): one PROSPECTIVE, one RETROACTIVE."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "Ann Lee", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Silver PPO" }
              as: BenefitsAdmin
              captures: { silver_off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${silver_off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 30000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { silver_tier_id: $.data.id }
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Gold PPO" }
              as: BenefitsAdmin
              captures: { gold_off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${gold_off_id}", coverage_level: "EMPLOYEE_PLUS_SPOUSE", monthly_premium_cents: 90000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { gold_tier_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-02-10T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${silver_tier_id}", coverage_start_date: "2026-02-01" }
              as: BenefitsAdmin
              captures: { enr_silver_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { ev1: $.data.version }
            - call: "POST /enrollments/${enr_silver_id}/activate"
              payload: { expected_employee_version: "${ev1}" }
              as: BenefitsAdmin
            - call: "POST /_payroll/run"
              payload: { employee_id: "${emp_id}" }
              as: PayrollOfficer
            - call: "POST /_payroll/run"
              payload: { employee_id: "${emp_id}" }
              as: PayrollOfficer
            - call: "POST /_payroll/run"
              payload: { employee_id: "${emp_id}" }
              as: PayrollOfficer
            - call: "POST /employees/${emp_id}/life-events"
              payload: { event_type: "MARRIAGE", event_date: "2026-02-01", requested_plan_tier_id: "${gold_tier_id}", adjustment_mode: "RETROACTIVE" }
              as: BenefitsAdmin
              as_user_id: "admin_submitter"
              captures: { le_retro_id: $.data.id }
          trigger:
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { ev2: $.data.version }
            - call: "POST /life-events/${le_retro_id}/approve"
              payload: { expected_employee_version: "${ev2}" }
              as: BenefitsAdmin
              as_user_id: "admin_approver"
            - call: "GET /deduction-lines?employee_id=${emp_id}&line_type=RETRO_ADJUSTMENT"
              payload: {}
              as: PayrollOfficer
          assert:
            - "RETROACTIVE: exactly 3 DeductionLine rows with line_type==RETRO_ADJUSTMENT for ${emp_id}"
            - "RETROACTIVE: each RETRO_ADJUSTMENT DeductionLine.amount_cents == 9000 (13500 - 4500)"
            - "RETROACTIVE: sum of RETRO_ADJUSTMENT DeductionLine.amount_cents == 27000"
            - "PROSPECTIVE variant (same setup, adjustment_mode PROSPECTIVE) yields 0 RETRO_ADJUSTMENT lines and total_retro_delta == 0"

      - name: carrier_premium_round_per_line_vs_sum_then_round
        grounds:
          - calculations.reconcile_carrier_premium
          - state_machines.Enrollment.DRAFT_to_ACTIVE
          - entities.CarrierFeedRecord.reconciled_monthly_premium_cents
        distinguishing_aspect: |
          On the CarrierFeedRecord domain, the same enrollment reconciles to 30967
          under the pinned round-per-component-line-then-sum (21677 + 9290) versus
          30968 under sum-then-round; the scaffold pins 30967.
        test_recipe:
          setup:
            - "Employee FULL_TIME, BIWEEKLY, ELIGIBLE."
            - "MEDICAL GOLD EMPLOYEE_ONLY tier (monthly 60000, employer 0.70)."
            - "Enrollment with coverage_start_date 2026-03-16 (day 16 of a 31-day month -> 16 days covered) activated."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "Bo Reed", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "BIWEEKLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Gold PPO" }
              as: BenefitsAdmin
              captures: { gold_off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${gold_off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 60000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { gold_tier_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-03-16T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${gold_tier_id}", coverage_start_date: "2026-03-16" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { ev1: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_id}/activate"
              payload: { expected_employee_version: "${ev1}" }
              as: BenefitsAdmin
            - call: "GET /carrier-feed-records?enrollment_id=${enr_id}&transaction_set=ADD"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "CarrierFeedRecord for ${enr_id} with transaction_set==ADD has reconciled_monthly_premium_cents == 30967"
            - "reconciled_monthly_premium_cents != 30968 (the sum-then-round result)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_paycheck_deduction_tier_and_schedule_branch
        grounds:
          - calculations.compute_per_paycheck_deduction
          - calculations.compute_monthly_employee_cost
          - entities.Enrollment.per_paycheck_deduction_cents
        distinguishing_aspect: |
          Mode (a): non-linear formula with >=3 inputs (monthly_premium_cents,
          employer_contribution_pct, payroll_schedule->periods_per_year) — same
          monthly cost 18000 yields 9000 per-paycheck at SEMI_MONTHLY (24) vs
          8308 at BIWEEKLY (26) via annualize-then-divide.
        test_recipe:
          setup:
            - "Employee FULL_TIME, BIWEEKLY, ELIGIBLE."
            - "MEDICAL GOLD EMPLOYEE_ONLY tier (monthly 60000, employer 0.70 -> emp monthly 18000)."
            - "Enrollment activated; coverage_start_date first of month (full month, no proration ambiguity)."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "Cy Park", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "BIWEEKLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Gold PPO" }
              as: BenefitsAdmin
              captures: { gold_off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${gold_off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 60000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { gold_tier_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${gold_tier_id}", coverage_start_date: "2026-02-01" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { ev1: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_id}/activate"
              payload: { expected_employee_version: "${ev1}" }
              as: BenefitsAdmin
              captures: { mec: $.data.monthly_employee_cost_cents, pp: $.data.per_paycheck_deduction_cents }
          assert:
            - "Enrollment.${enr_id}.monthly_employee_cost_cents == 18000"
            - "Enrollment.${enr_id}.per_paycheck_deduction_cents == 8308 (round_half_up(18000*12/26))"
            - "SEMI_MONTHLY variant of the same tier yields per_paycheck_deduction_cents == 9000 (18000*12/24)"

      - name: carrier_reconcile_rounding_order_pinned
        grounds:
          - calculations.reconcile_carrier_premium
          - entities.CarrierFeedRecord.reconciled_monthly_premium_cents
          - state_machines.Enrollment.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — round each prorated
          component line (21677, 9290) FIRST then sum to 30967, distinct from
          sum-then-round 30968. The scaffold pins round-per-line-then-sum.
        test_recipe:
          setup:
            - "Employee FULL_TIME, SEMI_MONTHLY, ELIGIBLE."
            - "MEDICAL GOLD EMPLOYEE_ONLY tier (monthly 60000, employer 0.70)."
            - "Enrollment coverage_start_date 2026-03-16 (16/31 days covered) activated."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "Di Cole", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Gold PPO" }
              as: BenefitsAdmin
              captures: { gold_off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${gold_off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 60000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { gold_tier_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-03-16T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${gold_tier_id}", coverage_start_date: "2026-03-16" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { ev1: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_id}/activate"
              payload: { expected_employee_version: "${ev1}" }
              as: BenefitsAdmin
            - call: "GET /carrier-feed-records?enrollment_id=${enr_id}&transaction_set=ADD"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "CarrierFeedRecord ADD for ${enr_id}: reconciled_monthly_premium_cents == 30967"
            - "prorated_employer (21677) + prorated_employee (9290) == 30967, not the sum-then-round 30968"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dependent_verification_cycle_pending_inforequested_pending
        grounds:
          - state_machines.Dependent.PENDING_to_INFO_REQUESTED
          - state_machines.Dependent.INFO_REQUESTED_to_PENDING
          - state_machines.Dependent.PENDING_to_VERIFIED
        distinguishing_aspect: |
          Dependent entity carries a cycle PENDING->INFO_REQUESTED->PENDING that can
          repeat before VERIFIED; this is a true cycle (revisits PENDING), not a
          linear pipeline.
        test_recipe:
          setup:
            - "Employee created; a CHILD dependent registered (PENDING)."
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Ev Shah", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/dependents"
              payload: { relationship: "CHILD", full_name: "Kid Shah", date_of_birth: "2020-05-05" }
              as: BenefitsAdmin
              captures: { dep_id: $.data.id }
          trigger:
            - call: "POST /dependents/${dep_id}/request-info"
              payload: {}
              as: DependentVerifier
            - call: "POST /dependents/${dep_id}/resubmit"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /dependents/${dep_id}/request-info"
              payload: {}
              as: DependentVerifier
            - call: "POST /dependents/${dep_id}/resubmit"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /dependents/${dep_id}/verify"
              payload: {}
              as: DependentVerifier
              as_user_id: "verifier_x"
              captures: { final_status: $.data.verification_status }
          assert:
            - "After two PENDING<->INFO_REQUESTED rounds the dependent re-enters PENDING each time"
            - "Dependent.${dep_id}.verification_status == VERIFIED after the final verify"
            - "Dependent.${dep_id}.verified_by_user_id == verifier_x"

      - name: enrollment_branching_eoi_approve_vs_deny_revert
        grounds:
          - state_machines.Enrollment.DRAFT_to_PENDING_EOI
          - state_machines.Enrollment.PENDING_EOI_to_ACTIVE
          - state_machines.Enrollment.PENDING_EOI_to_DRAFT
        distinguishing_aspect: |
          Enrollment entity branches from PENDING_EOI: EOI APPROVED -> ACTIVE (emits
          ADD feed) vs DENIED -> DRAFT (no feed); divergent side-effect sets per
          branch, distinct from the Dependent cycle.
        test_recipe:
          setup:
            - "Employee ELIGIBLE; VOLUNTARY_LIFE offering requires_eoi, GI 15000000."
            - "VOLUNTARY_LIFE tier rate 25 cents/$1000; DRAFT enrollment coverage 30000000 (> GI) submitted for EOI."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "Fi Watt", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
            - call: "POST /plan-offerings"
              payload: { benefit_type: "VOLUNTARY_LIFE", name: "Voluntary Life", requires_eoi: true, guaranteed_issue_amount_cents: 15000000 }
              as: BenefitsAdmin
              captures: { vl_off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${vl_off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 0, employer_contribution_pct: 0.0, rate_per_1000_monthly_cents: 25 }
              as: BenefitsAdmin
              captures: { vl_tier_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${vl_tier_id}", coverage_amount_cents: 30000000, coverage_start_date: "2026-02-01" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit-eoi"
              payload: {}
              as: BenefitsAdmin
            - call: "GET /eoi-requests?enrollment_id=${enr_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { eoi_id: $.data.0.id }
          trigger:
            - call: "POST /eoi-requests/${eoi_id}/decide"
              payload: { decision: "APPROVED" }
              as: ComplianceOfficer
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { st: $.data.status }
          assert:
            - "After EOI APPROVED branch: Enrollment.${enr_id}.status == ACTIVE and a CarrierFeedRecord ADD exists"
            - "EOI DENIED branch (parallel scenario): Enrollment.status reverts to DRAFT and no CarrierFeedRecord is emitted"
            - "Enrollment.${enr_id}.monthly_employee_cost_cents == 7500 (round_half_up(300 units * 25))"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: life_event_approve_supersede_term_feed_retro_chain
        grounds:
          - state_machines.LifeEvent.SUBMITTED_to_APPROVED
          - state_machines.Enrollment.ACTIVE_to_SUPERSEDED
          - calculations.compute_retro_deduction_delta
        distinguishing_aspect: |
          Depth-3 cascade from LifeEvent approve: approve -> new ACTIVE Enrollment
          created; that creation supersedes the prior ACTIVE Enrollment (hop 2);
          the supersede emits a TERM CarrierFeedRecord and posts RETRO_ADJUSTMENT
          DeductionLines (hop 3). Each link caused by the previous.
        test_recipe:
          setup:
            - "Employee ELIGIBLE, SEMI_MONTHLY; active SILVER EMPLOYEE_ONLY enrollment (pp 4500), 2 pay periods run."
            - "RETROACTIVE life event to GOLD EMPLOYEE_PLUS_SPOUSE (pp 13500), event_date within window."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "Gu Ono", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Silver PPO" }
              as: BenefitsAdmin
              captures: { silver_off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${silver_off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 30000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { silver_tier_id: $.data.id }
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Gold PPO" }
              as: BenefitsAdmin
              captures: { gold_off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${gold_off_id}", coverage_level: "EMPLOYEE_PLUS_SPOUSE", monthly_premium_cents: 90000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { gold_tier_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-02-10T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${silver_tier_id}", coverage_start_date: "2026-02-01" }
              as: BenefitsAdmin
              captures: { enr_silver_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { ev1: $.data.version }
            - call: "POST /enrollments/${enr_silver_id}/activate"
              payload: { expected_employee_version: "${ev1}" }
              as: BenefitsAdmin
            - call: "POST /_payroll/run"
              payload: { employee_id: "${emp_id}" }
              as: PayrollOfficer
            - call: "POST /_payroll/run"
              payload: { employee_id: "${emp_id}" }
              as: PayrollOfficer
            - call: "POST /employees/${emp_id}/life-events"
              payload: { event_type: "MARRIAGE", event_date: "2026-02-01", requested_plan_tier_id: "${gold_tier_id}", adjustment_mode: "RETROACTIVE" }
              as: BenefitsAdmin
              as_user_id: "submitter_a"
              captures: { le_id: $.data.id }
          trigger:
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { ev2: $.data.version }
            - call: "POST /life-events/${le_id}/approve"
              payload: { expected_employee_version: "${ev2}" }
              as: BenefitsAdmin
              as_user_id: "approver_b"
            - call: "GET /enrollments/${enr_silver_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { silver_status: $.data.status }
            - call: "GET /carrier-feed-records?enrollment_id=${enr_silver_id}&transaction_set=TERM"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "Enrollment.${enr_silver_id}.status == SUPERSEDED (hop 2)"
            - "Enrollment.${enr_silver_id}.superseded_by_enrollment_id == the new gold enrollment id (hop 2)"
            - "Exactly one CarrierFeedRecord with transaction_set==TERM exists for ${enr_silver_id} (hop 3)"
            - "2 RETRO_ADJUSTMENT DeductionLine rows exist for ${emp_id} each amount_cents == 9000 (hop 3)"

      - name: terminate_employee_supersede_term_feed_chain
        grounds:
          - state_machines.Employee.ELIGIBLE_to_TERMINATED
          - state_machines.Enrollment.ACTIVE_to_SUPERSEDED
          - entities.CarrierFeedRecord.transaction_set
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (employee terminate): terminate ->
          ACTIVE enrollments SUPERSEDED (hop 1) -> each superseded enrollment emits a
          TERM CarrierFeedRecord (hop 2). Distinct origin transition from the life-event cascade.
        test_recipe:
          setup:
            - "Employee ELIGIBLE with one ACTIVE MEDICAL enrollment."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "Ha Vega", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Gold PPO" }
              as: BenefitsAdmin
              captures: { gold_off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${gold_off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 60000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { gold_tier_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${gold_tier_id}", coverage_start_date: "2026-02-01" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { ev1: $.data.version }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: { expected_employee_version: "${ev1}" }
              as: BenefitsAdmin
          trigger:
            - call: "POST /employees/${emp_id}/terminate"
              payload: {}
              as: BenefitsAdmin
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { st: $.data.status }
            - call: "GET /carrier-feed-records?enrollment_id=${enr_id}&transaction_set=TERM"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "Employee.${emp_id}.eligibility_status == TERMINATED"
            - "Enrollment.${enr_id}.status == SUPERSEDED (hop 1)"
            - "Exactly one CarrierFeedRecord transaction_set==TERM exists for ${enr_id} (hop 2)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: not_eligible_beats_eoi_required
        grounds:
          - validations[priority=8]
          - validations[priority=7]
          - state_machines.Enrollment.DRAFT_to_ACTIVE
