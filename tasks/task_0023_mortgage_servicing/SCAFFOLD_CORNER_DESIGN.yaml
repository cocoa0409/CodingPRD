            - call: "POST /loans"
              payload: { borrower_id: "${c23_b_id}", origination_date: "2025-06-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
