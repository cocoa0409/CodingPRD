              payload: { model_id: "${model_id}", serial_number: "S-1" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "GET /bike-models/${model_id}"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { mv0: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${acct_id}", model_id: "${model_id}", rental_mode: "MONTHLY", return_due_clock: "2027-06-01T00:00:00Z", expected_model_version: "${mv0}" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { rent_id: $.data.id }
          trigger:
            - call: "POST /rentals/${rent_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { wallet: $.data.wallet_credit_cents }
          assert:
            - "Account.${acct_id}.wallet_credit_cents == 10000 after cancel (full deposit refunded, equals deposit_cents)"
            - "RentalAgreement.${rent_id}.billing_status == SETTLED (deposit released, money conserved)"
