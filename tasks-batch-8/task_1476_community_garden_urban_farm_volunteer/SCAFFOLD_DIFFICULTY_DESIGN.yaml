            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Tomato", plant_family: "Solanaceae", requested_sq_ft: 60, planned_start_date: "2026-08-01", planned_end_date: "2026-09-01" }, as: GardenAdmin, captures: { plan_a: $.data.id } }
            - { call: "POST /api/crop-plans/${plan_a}/transition", payload: { to_state: "APPROVED" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Beans", plant_family: "Fabaceae", requested_sq_ft: 40, planned_start_date: "2026-09-20", planned_end_date: "2026-10-01" }, as: GardenAdmin, captures: { plan_b: $.data.id } }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Kale", plant_family: "Brassicaceae", requested_sq_ft: 1, planned_start_date: "2026-10-16", planned_end_date: "2026-10-26" }, as: GardenAdmin, captures: { plan_c: $.data.id } }
          trigger:
            - { call: "POST /api/crop-plans/${plan_b}/transition", payload: { to_state: "APPROVED" }, as: GardenAdmin, captures: { b_status: $.data.status } }
            - { call: "GET /api/beds/${bed_id}", as: GardenAdmin, captures: { alloc: $.data.allocated_sq_ft } }
            - { call: "POST /api/crop-plans/${plan_c}/transition", payload: { to_state: "APPROVED" }, as: GardenAdmin, captures: { err_c: $.data.error_id } }
