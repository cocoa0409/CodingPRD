          - state_machines.ShareClass.ACTIVE_to_CLOSED_TO_NEW
          - endpoints[POST /share-classes/{share_class_id}/status]
        distinguishing_aspect: |
          Subscription validity depends on the state of the referenced ShareClass
          alone, so closing class I must reject new class I tickets with
          ERR_SHARE_CLASS_CLOSED while class T of the same offering keeps
          accepting them.
        test_recipe:
          setup:
            - "Offering 'Larkspur Growth REIT' at 1000 cents per share, EFFECTIVE, with two zero-load classes I and T."
            - "One documented investor and one ACTIVE selling agreement capped at 100 bps."
            - "The clock stays at 2026-08-01T00:00:00Z."
