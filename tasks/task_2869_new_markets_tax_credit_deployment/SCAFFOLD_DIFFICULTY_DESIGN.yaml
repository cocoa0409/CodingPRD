      - name: job_quality_certification_over_an_empty_report_set_yields_zero_not_a_division_error
        grounds:
          - calculations.job_quality_compliance
          - endpoints[POST /nmtc/community-benefits-agreements/{id}/annual-certifications]
          - state_machines.CommunityBenefitsAgreement.status
          - calculations.award_compliance_posture
        distinguishing_aspect: |
          A DIFFERENT metric on a DIFFERENT endpoint from the substantially-all boundary: the
          job-quality compliance percentage at the n = 0 collection boundary, on
          POST /nmtc/community-benefits-agreements/{id}/annual-certifications. With no JobReport
          rows in the window the achieved FTE numerator and the local-hire denominator are both
          empty, so the implementation must emit 0 / 0.00 and classify SHORTFALL rather than
          divide by zero, skip the certification, or vacuously classify the agreement compliant.
        test_recipe:
          setup:
            - "One ACTIVE award and one CERTIFIED QALICB in a SEVERE tract."
            - "One ACTIVE CommunityBenefitsAgreement with target_fte_count 25, wage_floor_cents_per_hour 1800, local_hire_pct_target 40.00 and measurement_basis HEADCOUNT."
            - "Zero JobReport rows have ever been filed against the agreement."
            - "Logical clock at 2027-09-01, the end of the certification window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
