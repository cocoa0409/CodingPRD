# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3426_shell_egg_production_market_index_pricing_flock
#
# Breadth probe. Every claim the sections 1.1-1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise; covered corners
# appear as excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: complex_create_returns_computed_defaults
        claim_type: Creation
        grounds:
          - entities.Complex
          - endpoints.POST_/api/complexes
          - response_envelope
        distinguishing_aspect: "A complex created with only the three input fields returns 201 with posture NORMAL, every inventory bucket 0, ops_run_index 0, version 1, and server-stamped id/created_at/updated_at — none of the computed fields are client-suppliable."
        test_recipe:
          setup: ["Empty database; logical clock at its default 2026-09-01T00:00:00Z (no clock call made)."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/complexes"
              payload: { name: "Heartland Layers", region_code: "MIDWEST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
          assert:
            - "the response status is 201, response_type is object, and meta.api_request_id plus meta.api_request_timestamp are present"
            - "Complex.${cx_id}.biosecurity_posture == NORMAL"
            - "all four feed pools and all three ungraded buckets are 0"
            - "ops_run_index == 0, version == 1, and last_ops_run_at == created_at == 2026-09-01T00:00:00Z (the logical default clock stamps the row)"

      - name: house_get_roundtrip_all_fields
        claim_type: Retrieval
        grounds:
          - entities.House
          - endpoints.GET_/api/houses/{id}
        distinguishing_aspect: "Every stored house field round-trips through GET unchanged, with hen_inventory 0 and downtime_until null computed fields present."
        test_recipe:
          setup: ["Complex 'Heartland Layers' with house H2 (CAGE_FREE, 80000)."]
          setup_api_calls:
            - &c_clock0901
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &c_cx
              call: "POST /api/complexes"
              payload: { name: "Heartland Layers", region_code: "MIDWEST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H2", housing_style: "CAGE_FREE", capacity_hens: 80000 }
              as: PlatformAdmin
              captures: { h2_id: $.data.id }
          trigger:
            - call: "GET /api/houses/${h2_id}"
              payload: {}
              as: ProductionPlanner
          assert:
            - "the response status is 200"
            - "House.${h2_id}.house_code == \"H2\", housing_style == CAGE_FREE, capacity_hens == 80000"
            - "House.${h2_id}.complex_id == ${cx_id}"
            - "House.${h2_id}.hen_inventory == 0 and downtime_until is null"

      - name: flocks_list_paginates_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/houses/{id}/flocks
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three planned flocks, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup: ["Complex with house H1 holding three PLANNED flocks (placements 2026-12-01, 2028-06-13, 2029-12-25 — exactly 560 days apart so the half-open occupancy windows abut without overlapping)."]
          setup_api_calls:
            - *c_clock0901
            - *c_cx
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 200000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F1", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-12-01T00:00:00Z", placed_hen_count: 40000 }
              as: ProductionPlanner
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F2", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2028-06-13T00:00:00Z", placed_hen_count: 40000 }
              as: ProductionPlanner
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F3", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2029-12-25T00:00:00Z", placed_hen_count: 40000 }
              as: ProductionPlanner
          trigger:
            - call: "GET /api/houses/${h1_id}/flocks"
              payload: { limit: 2, offset: 0 }
              as: ProductionPlanner
          assert:
            - "the response status is 200 and response_type is array"
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET with limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET with no parameters returns 3 rows (limit defaults to 10, offset to 0)"
            - "GET with status=PLANNED returns 3 rows; status=LAYING returns 0 rows"

      - name: flock_get_unknown_id_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET_/api/flocks/{id}
          - errors.ERR_FLOCK_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated flock id yields the entity-specific 404 ERR_FLOCK_NOT_FOUND inside the standard error envelope, not a generic 400 or 500."
        test_recipe:
          setup: ["Empty database; logical clock at default."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/flocks/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_FLOCK_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: flock_create_missing_program_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Flock.fields.program
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "program is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST before any state or business rule runs, and no flock row is created."
        test_recipe:
          setup: ["Complex with house H1."]
          setup_api_calls:
            - *c_clock0901
            - *c_cx
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 50000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F1", ownership: "OWNED", placement_date: "2026-09-01T00:00:00Z", placed_hen_count: 10000 }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /api/houses/${h1_id}/flocks returns 0 rows"

      - name: quotation_omitting_source_defaults_to_urner_barry
        claim_type: Defaults
        grounds:
          - entities.MarketQuotation.fields.source
          - endpoints.POST_/api/market-quotations
        distinguishing_aspect: "source declares default URNER_BARRY; omitting it stores URNER_BARRY rather than null, and a second quotation at the same (region, size, date) with explicit source USDA_AMS is a DIFFERENT key and is accepted."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *c_clock0901
          trigger:
            - call: "POST /api/market-quotations"
              payload: { region_code: "MIDWEST", size_class: "LARGE", price_cents_per_dozen: 150, effective_date: "2026-09-07T00:00:00Z" }
              as: PlatformAdmin
              captures: { q1: $.data.id }
            - call: "POST /api/market-quotations"
              payload: { region_code: "MIDWEST", size_class: "LARGE", price_cents_per_dozen: 152, effective_date: "2026-09-07T00:00:00Z", source: "USDA_AMS" }
              as: PlatformAdmin
              captures: { q2: $.data.id }
          assert:
            - "MarketQuotation.${q1}.source == URNER_BARRY (default applied)"
            - "the USDA_AMS quotation at the same slot is created 201 — uniqueness is per (region, size, date, source) quadruple"

      - name: complex_create_with_posture_field_returns_invalid_request
        claim_type: Computed Fields
        grounds:
          - entities.Complex.fields.biosecurity_posture
          - validations[priority=6]
        distinguishing_aspect: "biosecurity_posture is source: computed — supplying it in the create payload is not silently ignored but rejected as an undeclared field with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database; logical clock at default."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/complexes"
              payload: { name: "Sneaky Farm", region_code: "WEST", mill_receiving_tons_per_day: 100, biosecurity_posture: "NORMAL" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "the complex is not created"

      - name: market_quotation_has_no_version_or_updated_at
        claim_type: Immutability
        grounds:
          - entities.MarketQuotation
        distinguishing_aspect: "MarketQuotation is common_fields: false — its rows expose id and created_at only; version and updated_at are absent from the response, and no update or delete endpoint exists for the resource."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *c_clock0901
            - call: "POST /api/market-quotations"
              payload: { region_code: "WEST", size_class: "JUMBO", price_cents_per_dozen: 210, effective_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { q1: $.data.id }
          trigger:
            - call: "GET /api/market-quotations"
              payload: { region_code: "WEST", size_class: "JUMBO" }
              as: PlatformAdmin
          assert:
            - "the response row carries id, created_at, region_code, size_class, price_cents_per_dozen, effective_date, source"
            - "the response row has NO version field and NO updated_at field"
            - "created_at == 2026-09-01T00:00:00Z is stamped from the logical clock"

      - name: flock_create_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Flock.fields.program
          - validations[priority=6]
        distinguishing_aspect: "program must be one of CONVENTIONAL | CAGE_FREE | ORGANIC; the near-miss string 'CAGE-FREE' is a 400 ERR_INVALID_REQUEST, not a 422 business rejection."
        test_recipe:
          setup: ["Complex with house H1."]
          setup_api_calls:
            - *c_clock0901
            - *c_cx
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 50000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F1", program: "CAGE-FREE", ownership: "OWNED", placement_date: "2026-09-01T00:00:00Z", placed_hen_count: 10000 }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /api/houses/${h1_id}/flocks returns 0 rows"

      - name: house_create_under_unknown_complex_returns_404
        claim_type: Parent Relationships
        grounds:
          - entities.House.fields.complex_id
          - endpoints.POST_/api/complexes/{id}/houses
          - errors.ERR_COMPLEX_NOT_FOUND
        distinguishing_aspect: "The nested create resolves its parent path segment first: an unknown complex id yields 404 ERR_COMPLEX_NOT_FOUND and creates nothing."
        test_recipe:
          setup: ["Empty database; logical clock at default."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/complexes/00000000-0000-4000-8000-000000000000/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 50000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_COMPLEX_NOT_FOUND"

      - name: commitment_transition_fields_computed_with_no_projects
        claim_type: Computed Fields
        grounds:
          - entities.CustomerCommitment.fields.required_conversion_hens
          - entities.CustomerCommitment.fields.achieved_conversion_hens
          - calculations.commitment_transition_progress
        distinguishing_aspect: "With zero capital projects, a 50000-dozen commitment at required_cage_free_pct 1.0 reads required_conversion_hens 100000, achieved 0 — and transition_on_track is still true because the 2027-06-01 deadline has not passed."
        test_recipe:
          setup: ["Customer 'GreenShelf' with commitment carrying the cage-free transition targets; clock 2026-09-01."]
          setup_api_calls:
            - *c_clock0901
            - call: "POST /api/customers"
              payload: { name: "GreenShelf", segment: "RETAIL", credit_limit_cents: 500000000 }
              as: PlatformAdmin
              captures: { cu_id: $.data.id }
            - call: "POST /api/customers/${cu_id}/commitments"
              payload: { program: "CAGE_FREE", region_code: "WEST", weekly_dozen_committed: 50000, price_adjustment_cents_per_dozen: 20, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", cage_free_transition_deadline: "2027-06-01T00:00:00Z", required_cage_free_pct: 1.0 }
              as: SalesManager
              captures: { cm_id: $.data.id }
          trigger:
            - call: "GET /api/commitments/${cm_id}"
              payload: {}
              as: SalesManager
          assert:
            - "CustomerCommitment.${cm_id}.required_conversion_hens == 100000 (50000 * 1.0 * 2)"
            - "CustomerCommitment.${cm_id}.achieved_conversion_hens == 0 (no COMMISSIONED projects)"
            - "CustomerCommitment.${cm_id}.transition_on_track == true (deadline 2027-06-01 not yet reached)"
            - "CustomerCommitment.${cm_id}.status == PENDING and blocked_order_count == 0"

# __CONTINUE__

  # ===========================================================================
  - section: state_machines
    instances:

      - name: flock_place_valid_transition_to_growing
        claim_type: valid_transition
        grounds:
          - state_machines.Flock.PLANNED_to_GROWING
          - endpoints.POST_/api/flocks/{id}/place
        distinguishing_aspect: "Placing on the placement date computes age_weeks 0, lands in GROWING (not LAYING), sets current_hen_count = placed_hen_count and credits the house inventory in the same response."
        test_recipe:
          setup: ["Complex with house H1 (capacity 50000) and planned flock F1 of 10000 pullets with placement_date 2026-09-01."]
          setup_api_calls:
            - *c_clock0901
            - *c_cx
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 50000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F1", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-09-01T00:00:00Z", placed_hen_count: 10000 }
              as: ProductionPlanner
              captures: { f1_id: $.data.id, f1_v0: $.data.version }
          trigger:
            - call: "POST /api/flocks/${f1_id}/place"
              payload: {}
              as: ProductionPlanner
          assert:
            - "the response shows status GROWING, age_weeks 0, current_hen_count 10000"
            - "Flock.${f1_id}.version == ${f1_v0} + 1"
            - "House.${h1_id}.hen_inventory == 10000"

      - name: run_ops_growing_to_laying_at_week_18
        claim_type: side_effect_execution
        grounds:
          - state_machines.Flock.GROWING_to_LAYING
          - calculations.run_ops_week_advance
          - endpoints.POST_/api/complexes/{id}/run-ops
        distinguishing_aspect: "A 20-week run-ops auto-transitions the flock at the week-start when age reaches 18, accrues exactly two laying weeks (ages 18 and 19 at rate 0.85) into the conventional bucket, and applies 10 bps floored mortality per week."
        test_recipe:
          setup: ["Complex 'Accrual Farm' with LAYING-track flock of 90000 hens placed 2026-09-01 at age 0."]
          setup_api_calls:
            - *c_clock0901
            - call: "POST /api/complexes"
              payload: { name: "Accrual Farm", region_code: "MIDWEST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 100000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F1", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-09-01T00:00:00Z", placed_hen_count: 90000 }
              as: ProductionPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /api/flocks/${f1_id}/place"
              payload: {}
              as: ProductionPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-19T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/complexes/${cx_id}/run-ops"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Flock.${f1_id}.age_weeks == 20 and status == LAYING (auto-transition fired at week-start age 18)"
            - "Flock.${f1_id}.current_hen_count == 88227 (20 weeks of floored 10bps mortality)"
            - "Complex.${cx_id}.ungraded_conventional_dozen == 87622 (43833 at age 18 + 43789 at age 19)"
            - "Complex.${cx_id}.ops_run_index == 1 and last_ops_run_at == 2027-01-19T00:00:00Z"

      - name: molt_from_growing_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Flock.LAYING_to_MOLT
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Molt is defined only from LAYING; from GROWING the trigger is not in the transition list and fails with 409 ERR_INVALID_STATE — the molt-eligibility rule (ERR_MOLT_NOT_ALLOWED) never engages because the state check runs first."
        test_recipe:
          setup: ["Complex with house H1 and flock F1 of 10000 hens placed 2026-09-01 (GROWING, age 0)."]
          setup_api_calls:
            - *c_clock0901
            - *c_cx
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 50000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F1", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-09-01T00:00:00Z", placed_hen_count: 10000 }
              as: ProductionPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /api/flocks/${f1_id}/place"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /api/flocks/${f1_id}/molt"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_MOLT_NOT_ALLOWED (state legality at priority 7 precedes the constraint at priority 27)"
            - "Flock.${f1_id}.status stays GROWING"

      - name: confirm_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.DiseaseEvent.SUSPECTED_to_CONFIRMED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Re-sending the confirm trigger against an already-CONFIRMED event is rejected with 409 ERR_INVALID_STATE; the side effects (posture, cascades) do not fire a second time."
        test_recipe:
          setup: ["Complex with house H1 (no flocks) and one SUSPECTED disease event scoping H1."]
          setup_api_calls:
            - *c_clock0901
            - *c_cx
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 50000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/disease-events"
              payload: { pathogen: "HPAI", detection_date: "2026-09-01T00:00:00Z", scope_house_ids: ["${h1_id}"] }
              as: HealthOfficial
              captures: { ev_id: $.data.id }
            - call: "POST /api/disease-events/${ev_id}/confirm"
              payload: {}
              as: HealthOfficial
          trigger:
            - call: "POST /api/disease-events/${ev_id}/confirm"
              payload: {}
              as: HealthOfficial
              captures: { err: $.data.error_id }
          assert:
            - "the second confirm returns 409 ERR_INVALID_STATE"
            - "DiseaseEvent.${ev_id}.version reflects exactly one confirmation"

      - name: depopulated_flock_rejects_all_actions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Flock
        distinguishing_aspect: "DEPOPULATED is terminal: molt and place both fail with 409 ERR_INVALID_STATE and no fields change."
        test_recipe:
          setup: ["Complex with house H1; flock F1 of 10000 hens placed then DEPOPULATED via a confirmed event's completed depopulation order."]
          setup_api_calls:
            - *c_clock0901
            - *c_cx
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 50000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F1", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-04-28T00:00:00Z", placed_hen_count: 10000 }
              as: ProductionPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /api/flocks/${f1_id}/place"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/complexes/${cx_id}/disease-events"
              payload: { pathogen: "HPAI", detection_date: "2026-09-01T00:00:00Z", scope_house_ids: ["${h1_id}"] }
              as: HealthOfficial
              captures: { ev_id: $.data.id }
            - call: "POST /api/disease-events/${ev_id}/confirm"
              payload: {}
              as: HealthOfficial
            - call: "POST /api/disease-events/${ev_id}/depopulation-orders"
              payload: { house_id: "${h1_id}", disposal_method: "INCINERATION" }
              as: HealthOfficial
              captures: { dp_id: $.data.id }
            - call: "POST /api/depopulation-orders/${dp_id}/complete"
              payload: {}
              as: HealthOfficial
          trigger:
            - call: "POST /api/flocks/${f1_id}/molt"
              payload: {}
              as: ProductionPlanner
              captures: { err_molt: $.data.error_id }
            - call: "POST /api/flocks/${f1_id}/place"
              payload: {}
              as: ProductionPlanner
              captures: { err_place: $.data.error_id }
          assert:
            - "both triggers return 409 ERR_INVALID_STATE"
            - "Flock.${f1_id}.status == DEPOPULATED and current_hen_count == 0"

      - name: planned_flock_cancelled_on_quarantine
        claim_type: cascade_down
        grounds:
          - state_machines.Flock.PLANNED_to_CANCELLED
          - state_machines.DiseaseEvent.SUSPECTED_to_CONFIRMED
        excluded_because:
          difficulty_instance: transitive_cascade / disease_confirm_three_link_cascade
          rationale: "The PLANNED -> CANCELLED cascade is asserted there as LINK 2a of the confirmation chain."

      - name: order_create_on_expired_commitment_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CustomerCommitment.ACTIVE_to_EXPIRED
          - validations[priority=7]
