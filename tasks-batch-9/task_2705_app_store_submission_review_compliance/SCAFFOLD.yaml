    output: BehaviorFinding
    success_code: 201
    side_effects:
      - "status = OPEN; recomputes Submission.disclosure_accuracy_score_provisional and, when the submission is IN_REVIEW, disclosure_accuracy_score_final"
      - "A finding whose detected_at is later than pre_review_checked_at, or whose scanner_confidence is below PROVISIONAL_CONFIDENCE_FLOOR, moves only the FINAL score — this is how the two variants diverge"
      - "A CRITICAL finding recomputes AppRecord.compliance_posture (F3 CRITICAL_FINDING_OPEN -> FROZEN)"

  - method: GET
    path: /behavior-findings
    description: "List observed behaviors."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformReviewer, PlatformPolicyAdmin, Auditor]
