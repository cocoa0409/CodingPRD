            - { call: "POST /hotline/determinations/${ds1}/submit", as: Investigator, as_user_id: "${s_inv}" }
            # --- reviews on 2026-08-05 ---
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: EthicsPlatformAdmin }
