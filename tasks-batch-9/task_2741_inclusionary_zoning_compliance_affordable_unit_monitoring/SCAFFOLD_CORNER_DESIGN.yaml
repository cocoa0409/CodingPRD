            - { call: "POST /iz-compliance/resale-transactions", payload: { unit_id: "${u_id}", expected_unit_version: "${u_v}", proposed_price_cents: 32000000, appraised_value_cents: 41000000, capital_improvements_cents: 0, deferred_maintenance_cents: 0, broker_fee_cents: 1000000 }, as: Resident, as_user_id: "${h2_id}", captures: { e4: $.data.error_id } }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "00000000-0000-0000-0000-0000000000ff", agreement_id: "${a_id}", unit_number: "NO-998", bedrooms: 1, sqft: 700, market_comparable_sqft: 800, tenure: "OWNERSHIP", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-2", captures: { e5: $.data.error_id } }
            - { call: "GET /iz-compliance/projects/${p_id}", payload: {}, as: Developer, as_user_id: "dev-2" }
            - { call: "POST /iz-compliance/resale-transactions", payload: { unit_id: "${u_id}", expected_unit_version: "${u_v}", proposed_price_cents: 32000000, appraised_value_cents: 41000000, capital_improvements_cents: 0, deferred_maintenance_cents: 0, broker_fee_cents: 1000000 }, as: Resident, as_user_id: "${h1_id}" }
          assert:
            - "the rival developer's PATCH, elect-path and unit creation all return 403 ERR_NOT_RESOURCE_OWNER"
            - "the rival's elect-path yields ERR_NOT_RESOURCE_OWNER and NOT ERR_INVALID_PROJECT_STATE even though the project has already elected a path — priority 7 precedes priority 9"
            - "the rival naming a non-existent project_id returns 404 ERR_PROJECT_NOT_FOUND, not 403: the body-FK check at priority 6 precedes the ownership check at priority 7"
            - "the non-occupant Resident's resale submission returns 403 ERR_NOT_RESOURCE_OWNER — Resident authorisation compares X-User-ID against the unit's occupant_household_id, not merely the role name"
            - "reads are NOT ownership-scoped: dev-2's GET of dev-1's project returns 200 with state PATH_ELECTED, total_units 20 and compliance_path ONSITE, proving the refusals above were authorisation and not concealment"
            - "the true occupant ${h1_id} submitting the identical payload succeeds with 201 and state SUBMITTED, so the four refusals were caused by identity alone"

      - name: four_eyes_blocks_the_same_officer_from_closing_a_step_that_they_opened
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_21
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Segregation of duties is a same-role, different-person rule: hco-1 and hco-2 hold the
          identical HousingComplianceOfficer role, so the refusal cannot come from any role list
          and must be an X-User-ID comparison against the id already stored on the paired step.
          Its priority-21 position sits AFTER the state gates, which is observable because the
          refusal only becomes reachable once the review is in CURE_PENDING and the resale is in
          ROFR_WAIVED — before that the state error wins. Both pairs are checked: the officer who
          created a monitoring review may not clear its cure, and the officer who approved a resale
          price may not certify its buyer.
