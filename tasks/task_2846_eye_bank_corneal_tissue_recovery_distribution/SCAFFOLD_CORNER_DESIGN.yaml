      - name: the_cold_chain_sequence_triggers_seven_distinct_state_and_window_error_codes
        claim_type: every_code_triggerable
        grounds:
          - validations.priority_17
          - validations.priority_18
          - validations.priority_36
          - validations.priority_47
          - validations.priority_15
          - validations.priority_38
          - validations.priority_37
          - "errors[ERR_ALLOCATION_STATE_INVALID]"
          - "errors[ERR_SHIPMENT_STATE_INVALID]"
          - "errors[ERR_READING_OUTSIDE_SHIPMENT_WINDOW]"
          - "errors[ERR_NO_TEMPERATURE_BASELINE]"
          - "errors[ERR_TISSUE_CUSTODY_INVALID]"
          - "errors[ERR_REPORT_TISSUE_NOT_IMPLANTED_BY_SURGEON]"
          - "errors[ERR_INVALID_REISSUE_SOURCE]"
        distinguishing_aspect: |
          One allocation is walked from RESERVED to IN_TRANSIT, attempting the next step one beat too
          early at every stage. Shipping a RESERVED allocation gives ERR_ALLOCATION_STATE_INVALID;
          delivering a PREPARED shipment gives ERR_SHIPMENT_STATE_INVALID; a reading stamped one hour
          before the shipment existed gives ERR_READING_OUTSIDE_SHIPMENT_WINDOW; dispatching with an
          empty reading series gives ERR_NO_TEMPERATURE_BASELINE; implanting an IN_TRANSIT tissue
          gives ERR_TISSUE_CUSTODY_INVALID (dimension A is already the correct ISSUED, so this must
          not degrade into ERR_TISSUE_NOT_ELIGIBLE); reporting a reaction on a never-implanted tissue
          gives ERR_REPORT_TISSUE_NOT_IMPLANTED_BY_SURGEON; and re-issuing against an IN_TRANSIT
          rather than RETURNED shipment gives ERR_INVALID_REISSUE_SOURCE.
