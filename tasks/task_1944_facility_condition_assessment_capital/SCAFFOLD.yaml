    side_effects:
      - "run facility_condition_index calculation and persist all three derived fields"
      - "increments Facility.version by 1"

  - method: GET
    path: "/fca/facilities/{id}/asset-systems"
    description: "Reverse-reachability: list AssetSystem rows of a facility"
    roles: [Consultant, FacilityManager, CapitalPlanner, Approver]
    code: 200
    input: ["limit?", "offset?"]
    output: AssetSystem[]
    side_effects: []
  - method: GET
    path: "/fca/facilities/{id}/capital-plans"
    description: "Reverse-reachability: list CapitalPlan rows of a facility"
    roles: [Consultant, FacilityManager, CapitalPlanner, Approver]
    code: 200
    input: ["limit?", "offset?"]
    output: CapitalPlan[]
    side_effects: []
  - method: GET
    path: "/fca/facilities/{id}/refresh-cycles"
    description: "Reverse-reachability: list RefreshCycle rows of a facility"
    roles: [Consultant, FacilityManager, CapitalPlanner, Approver]
    code: 200
    input: ["limit?", "offset?"]
    output: RefreshCycle[]
    side_effects: []

  - method: POST
    path: "/fca/asset-systems"
    description: Register a system in a facility's inventory
    roles: [Consultant]
    code: 201
    input: [facility_id, system_category, name, install_year, design_life_years, replacement_cost_cents, condition_rating]
    output: AssetSystem
    side_effects:
      - "compute remaining_useful_life_years"
      - "recompute Facility.current_replacement_value_cents and facility_condition_index"
  - method: GET
    path: "/fca/asset-systems"
    description: List asset systems, optionally filtered by facility_id
    roles: [Consultant, FacilityManager, CapitalPlanner, Approver]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: AssetSystem[]
    side_effects: []
  - method: GET
    path: "/fca/asset-systems/{id}"
    description: Get one asset system
    roles: [Consultant, FacilityManager, CapitalPlanner, Approver]
    code: 200
    input: []
    output: AssetSystem
    side_effects: []
  - method: POST
    path: "/fca/asset-systems/{id}/assess"
    description: Consultant records a new condition rating during an open refresh cycle
    roles: [Consultant]
    code: 200
    input: [condition_rating, "note?"]
    output: AssetSystem
    side_effects:
      - "AssetSystem ACTIVE -> REASSESSED"
      - "recompute remaining_useful_life_years"
      - "append ConditionSnapshot (asset_system_id, condition_rating, remaining_useful_life_years, epoch, note)"
      - "set last_assessed_epoch to the facility's current epoch"
      - "increments AssetSystem.version by 1"
  - method: POST
    path: "/fca/asset-systems/{id}/accept-assessment"
    description: FacilityManager accepts the reassessment
    roles: [FacilityManager]
    code: 200
    input: []
    output: AssetSystem
    side_effects:
      - "AssetSystem REASSESSED -> ACTIVE"
      - "increments AssetSystem.version by 1"
  - method: POST
    path: "/fca/asset-systems/{id}/reject-assessment"
    description: FacilityManager rejects the reassessment; values revert to last snapshot
    roles: [FacilityManager]
    code: 200
    input: []
    output: AssetSystem
    side_effects:
      - "AssetSystem REASSESSED -> ACTIVE"
      - "revert condition_rating and remaining_useful_life_years to the most recent prior ConditionSnapshot values (compensation)"
      - "increments AssetSystem.version by 1"
  - method: POST
    path: "/fca/asset-systems/{id}/retire"
    description: Retire a system (no open deficiencies allowed)
    roles: [FacilityManager]
    code: 200
    input: []
    output: AssetSystem
    side_effects:
      - "AssetSystem ACTIVE -> RETIRED"
      - "recompute Facility.current_replacement_value_cents (exclude RETIRED) and facility_condition_index"
      - "PlanLineItem rows referencing deficiencies of this system with funding_status == FUNDED on DRAFT plans move to REMOVED; CapitalPlan.total_programmed_cents recomputed"
      - "increments AssetSystem.version by 1"
  - method: GET
    path: "/fca/asset-systems/{id}/deficiencies"
    description: "Reverse-reachability: list Deficiency rows of a system"
    roles: [Consultant, FacilityManager, CapitalPlanner, Approver]
    code: 200
    input: ["limit?", "offset?"]
    output: Deficiency[]
    side_effects: []
  - method: GET
    path: "/fca/asset-systems/{id}/condition-snapshots"
    description: "Reverse-reachability: list ConditionSnapshot rows of a system"
    roles: [Consultant, FacilityManager, CapitalPlanner, Approver]
    code: 200
    input: ["limit?", "offset?"]
    output: ConditionSnapshot[]
    side_effects: []

  - method: POST
    path: "/fca/deficiencies"
    description: Record a deficiency finding on a system
    roles: [Consultant]
    code: 201
    input: [asset_system_id, description, cost_estimate_cents, severity, urgency, "is_code_violation?", "is_accessibility_violation?", recommended_year]
    output: Deficiency
    side_effects:
      - "compute priority_score"
      - "recompute Facility.backlog_cost_cents and facility_condition_index"
  - method: GET
    path: "/fca/deficiencies"
    description: List deficiencies with filters
    roles: [Consultant, FacilityManager, CapitalPlanner, Approver]
    code: 200
    input: ["asset_system_id?", "remediation_status?", "is_code_violation?", "is_accessibility_violation?", "limit?", "offset?"]
    output: Deficiency[]
    side_effects: []
  - method: GET
    path: "/fca/deficiencies/{id}"
    description: Get one deficiency
    roles: [Consultant, FacilityManager, CapitalPlanner, Approver]
    code: 200
    input: []
    output: Deficiency
    side_effects: []
  - method: POST
    path: "/fca/deficiencies/{id}/start-remediation"
    description: Begin remediation (OPEN -> IN_PROGRESS)
    roles: [FacilityManager]
    code: 200
    input: []
    output: Deficiency
    side_effects:
      - "recompute Facility.backlog_cost_cents and facility_condition_index (IN_PROGRESS remains in backlog set)"
      - "increments Deficiency.version by 1"
  - method: POST
    path: "/fca/deficiencies/{id}/complete-remediation"
    description: Mark remediation complete (IN_PROGRESS -> CORRECTED)
    roles: [FacilityManager]
    code: 200
    input: []
    output: Deficiency
    side_effects:
      - "recompute Facility.backlog_cost_cents and facility_condition_index (CORRECTED leaves the backlog set)"
      - "increments Deficiency.version by 1"
  - method: POST
    path: "/fca/deficiencies/{id}/defer"
    description: Defer an open deficiency (OPEN -> DEFERRED)
    roles: [FacilityManager]
    code: 200
    input: []
    output: Deficiency
    side_effects:
      - "increments Deficiency.version by 1"
  - method: POST
    path: "/fca/deficiencies/{id}/reopen"
    description: Reopen a deferred deficiency (DEFERRED -> OPEN)
    roles: [FacilityManager]
    code: 200
    input: []
    output: Deficiency
    side_effects:
      - "increments Deficiency.version by 1"
  - method: POST
    path: "/fca/deficiencies/{id}/verify"
    description: Consultant verifies corrected work (verification UNVERIFIED -> VERIFIED)
    roles: [Consultant]
    code: 200
    input: []
    output: Deficiency
    side_effects:
      - "append ConditionSnapshot for the owning AssetSystem"
      - "increments Deficiency.version by 1"
  - method: POST
    path: "/fca/deficiencies/{id}/reject-verification"
    description: Consultant rejects corrected work; remediation reverts to IN_PROGRESS
    roles: [Consultant]
    code: 200
    input: []
    output: Deficiency
    side_effects:
      - "set remediation_status back to IN_PROGRESS (compensation)"
      - "recompute Facility.backlog_cost_cents and facility_condition_index"
      - "increments Deficiency.version by 1"

  - method: POST
    path: "/fca/capital-plans"
    description: Create a draft capital plan for a facility (OCC on facility version)
    roles: [CapitalPlanner]
    code: 201
    input: [facility_id, title, start_year, horizon_years, expected_facility_version]
    output: CapitalPlan
    side_effects:
      - "initialize status=DRAFT, total_programmed_cents=0"
      - "increments Facility.version by 1 (plan creation mutates the facility aggregate)"
  - method: GET
    path: "/fca/capital-plans"
    description: List capital plans with filters
    roles: [Consultant, FacilityManager, CapitalPlanner, Approver]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: CapitalPlan[]
    side_effects: []
  - method: GET
    path: "/fca/capital-plans/{id}"
    description: Get one capital plan
    roles: [Consultant, FacilityManager, CapitalPlanner, Approver]
    code: 200
    input: []
    output: CapitalPlan
    side_effects: []
  - method: POST
    path: "/fca/capital-plans/{id}/submit"
    description: Submit a draft plan for approval
    roles: [CapitalPlanner]
    code: 200
    input: []
    output: CapitalPlan
    side_effects:
      - "CapitalPlan DRAFT -> SUBMITTED"
      - "any other APPROVED CapitalPlan for the same facility_id moves to SUPERSEDED"
      - "increments CapitalPlan.version by 1"
  - method: POST
    path: "/fca/capital-plans/{id}/approve"
    description: Approve a submitted plan (Approver; not the submitter — segregation of duties)"
    roles: [Approver]
    code: 200
    input: []
    output: CapitalPlan
    side_effects:
      - "CapitalPlan SUBMITTED -> APPROVED"
      - "each FUNDED PlanLineItem's Deficiency moves remediation_status OPEN -> IN_PROGRESS (DEFERRED and IN_PROGRESS unchanged)"
      - "recompute Facility.backlog_cost_cents and facility_condition_index"
      - "increments CapitalPlan.version by 1"
  - method: POST
    path: "/fca/capital-plans/{id}/reject"
    description: Reject a submitted plan
    roles: [Approver]
    code: 200
    input: []
    output: CapitalPlan
    side_effects:
      - "CapitalPlan SUBMITTED -> REJECTED"
      - "increments CapitalPlan.version by 1"
  - method: POST
    path: "/fca/capital-plans/{id}/revise"
    description: Return a rejected plan to draft (revision loop)
    roles: [CapitalPlanner]
    code: 200
    input: []
    output: CapitalPlan
    side_effects:
      - "CapitalPlan REJECTED -> DRAFT"
      - "increments CapitalPlan.version by 1"
  - method: POST
    path: "/fca/capital-plans/{id}/archive"
    description: Archive an approved plan once all funded work is corrected or deferred
    roles: [CapitalPlanner]
    code: 200
    input: []
    output: CapitalPlan
    side_effects:
      - "CapitalPlan APPROVED -> ARCHIVED"
      - "increments CapitalPlan.version by 1"
  - method: GET
    path: "/fca/capital-plans/{id}/funding-scenarios"
    description: "Reverse-reachability: list FundingScenario rows of a plan"
    roles: [Consultant, FacilityManager, CapitalPlanner, Approver]
    code: 200
    input: ["limit?", "offset?"]
    output: FundingScenario[]
