            - { call: "POST /credit/term-sheets", payload: { loan_application_id: "${app}", amount_cents: 200000000, rate_bps: 650, term_months: 60, expires_at: "2026-08-20T00:00:00Z", expected_loan_application_version: "${app_v2}" }, as: RelationshipManager, as_user_id: "${rm}", captures: { sheet1: $.data.id } }
            - { call: "POST /credit/term-sheets", payload: { loan_application_id: "${app}", amount_cents: 200000000, rate_bps: 600, term_months: 60, expires_at: "2026-08-22T00:00:00Z", expected_loan_application_version: "${app_v2}" }, as: RelationshipManager, as_user_id: "${rm}", captures: { err: $.data.error_id } }
            - { call: "GET /credit/loan-applications/${app}/term-sheets", as: RelationshipManager, as_user_id: "${rm}" }
          assert:
            - "sheet1 create with the current version: 201 (and bumped LoanApplication.version by 1)"
            - "sheet2 create replaying ${app_v2}: status 412, error_id == ERR_STALE_VERSION"
            - "the term-sheet list shows exactly 1 row: TermSheet.${sheet1}.status == ISSUED (the rejected create superseded nothing)"

      - name: occ_committee_decision_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[committee-decision-open-stale-application]", "errors[ERR_STALE_VERSION]", "validations[priority=5]", "validations[priority=21]"]
        distinguishing_aspect: "The decision-open OCC rule: after D1's creation advances the application version, a second create replaying the pre-D1 version fails 412 ERR_STALE_VERSION — firing before the ERR_DECISION_ALREADY_OPEN constraint (priority 5 < 21) that the same request would also violate."
        test_recipe:
          setup: ["Application in COMMITTEE_REVIEW (clean 200,000,000 STANDARD deal); STANDARD session in window; decision D1 OPEN"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "April Appraisals" }, as: BankAdmin, captures: { apm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Cheryl Chair" }, as: BankAdmin, captures: { ch: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Meridian Industrial Parks", naics_code: "531120", relationship_since: "2010-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 200000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 200000000, ebitda_cents: 100000000, addbacks_cents: 0, distributions_cents: 0, maintenance_capex_cents: 0, existing_annual_debt_service_cents: 0, total_assets_cents: 500000000, total_liabilities_cents: 200000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt: $.data.id } }
            - { call: "POST /credit/loan-applications/${app}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "POST /credit/financial-statements/${stmt}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${stmt}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/loan-applications/${app}/finalize-spreads", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/appraisers", payload: { name: "AppraisalCo", license_number: "LIC-100" }, as: AppraisalManager, as_user_id: "${apm}", captures: { apr: $.data.id } }
            - { call: "POST /credit/appraisals", payload: { loan_application_id: "${app}", appraiser_id: "${apr}", collateral_class: REAL_ESTATE, engagement_start_date: "2026-08-03", engagement_end_date: "2026-08-07" }, as: AppraisalManager, as_user_id: "${apm}", captures: { aprl: $.data.id } }
            - { call: "POST /credit/appraisals/${aprl}/receive-report", payload: { appraised_value_cents: 400000000, orderly_liquidation_value_cents: 380000000 }, as: AppraisalManager, as_user_id: "${apm}" }
            - { call: "POST /credit/appraisals/${aprl}/review", payload: { outcome: ACCEPTED }, as: AppraisalManager, as_user_id: "${apm}" }
            - { call: "POST /credit/loan-applications/${app}/submit-to-committee", payload: {}, as: CreditAnalyst, as_user_id: "${an}", captures: { app_v1: $.data.version } }
            - { call: "POST /credit/committee-sessions", payload: { level: STANDARD, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T15:30:00Z" }, as: CommitteeChair, as_user_id: "${ch}", captures: { sess: $.data.id } }
            - { call: "POST /credit/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:30:00Z" }, as: BankAdmin }
            - { call: "POST /credit/committee-decisions", payload: { loan_application_id: "${app}", committee_session_id: "${sess}", expected_loan_application_version: "${app_v1}" }, as: CommitteeChair, as_user_id: "${ch}", captures: { dec1: $.data.id } }
          trigger:
            - { call: "POST /credit/committee-decisions", payload: { loan_application_id: "${app}", committee_session_id: "${sess}", expected_loan_application_version: "${app_v1}" }, as: CommitteeChair, as_user_id: "${ch}", captures: { err: $.data.error_id } }
          assert:
            - "status 412, error_id == ERR_STALE_VERSION (D1's creation bumped the application version, so ${app_v1} is now stale)"
            - "NOT 409 ERR_DECISION_ALREADY_OPEN though that constraint is equally violated — OCC priority 5 precedes constraint priority 21"
            - "GET /credit/loan-applications/${app}/committee-decisions still returns exactly 1 decision (${dec1}, OPEN)"

      - name: cascading_clock_expiry_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.CommitmentLetter.ISSUED_to_EXPIRED, state_machines.LoanApplication.COMMITMENT_to_EXPIRED]
        excluded_because:
          difficulty_instance: commitment_expiry_three_hop_cascade
          rationale: "The depth-3 clock-driven cascade (letter -> application -> items/participations) is asserted hop-by-hop in the named §1.8 instance."

      - name: cascading_committee_decline_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.CommitteeDecision.OPEN_to_DECLINED, state_machines.Appraisal.ENGAGED_to_CANCELLED]
        excluded_because:
          difficulty_instance: committee_decline_appraisal_cancellation_cascade
          rationale: "The vote-driven decline cascade into appraisal cancellation and window release is asserted in the named §1.8 instance."

      - name: dual_variant_dscr_layer
        claim_type: dual_variant_calculation
        grounds: [calculations.dscr_computation]
        excluded_because:
          difficulty_instance: dscr_standard_vs_stress_same_statement_diverge
          rationale: "BANK_STANDARD vs REGULATORY_STRESS divergence on identical inputs is the named §1.8 instance's subject."

      - name: dual_variant_collateral_layer
        claim_type: dual_variant_calculation
        grounds: [calculations.eligible_collateral_value]
        excluded_because:
          difficulty_instance: collateral_lending_vs_liquidation_basis_insider
          rationale: "LENDING_BASIS vs LIQUIDATION_BASIS divergence on identical appraised values is the named §1.8 instance's subject."

      - name: rate_threshold_dscr_floor_layer
        claim_type: rate_threshold_triggers
        grounds: [calculations.dscr_computation]
        excluded_because:
          difficulty_instance: dscr_policy_floor_inclusive_boundary
          rationale: "The inclusive 1.2500 DSCR floor (pass at exactly 1.2500, fail at 1.2499) is asserted in the named §1.8 instance."

      - name: rate_threshold_committee_tier_layer
        claim_type: rate_threshold_triggers
        grounds: [calculations.committee_quorum_rule]
        excluded_because:
          difficulty_instance: committee_tier_amount_inclusive_boundary
          rationale: "The inclusive 100,000,000-cent SMALL tier boundary (vs 100,000,001 -> STANDARD) is asserted in the named §1.8 instance."

