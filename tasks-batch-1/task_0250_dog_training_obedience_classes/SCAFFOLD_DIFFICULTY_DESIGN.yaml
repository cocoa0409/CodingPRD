# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Dog Training & Obedience Classes — EXPERT band
# 9 rule_ids x 2 instances = 18 instances total (meets the >= 18 minimum)
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: enrollment_refund_forward_vs_chronological_on_enrollment
        grounds:
          - calculations.enrollment_refund
          - entities.Enrollment.fields.refund_cents
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
        distinguishing_aspect: "On the Enrollment domain: forward_unused refund (per_session*remaining) = 5000 while list_price - chronological_consumed = 5001 for list_price_cents=10001, session_count=6, attended=3 — the two valuation algorithms diverge by one rounding cent."
        test_recipe:
          setup:
            - "BASIC GROUP series, list_price_cents=10001, session_count=6, capacity=5, credit_cost=2, OPEN with 6 sessions"
            - "Owner+Dog fully vaccinated; dog ACTIVE-enrolled via CASH; 3 of 6 sessions marked PRESENT and completed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AdminManager
            - call: "POST /owners"
              payload: { full_name: "Ada Owner", email: "ada@x.com", phone: "111" }
              as: FrontDesk
              captures: { owner_id: $.data.id }
            - call: "POST /dogs"
              payload: { owner_id: "${owner_id}", name: "Rex", breed: "Lab", birth_date: "2024-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { dog_id: $.data.id }
            - call: "POST /dogs/${dog_id}/vaccinations"
              payload: { vaccine_type: "RABIES", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /dogs/${dog_id}/vaccinations"
              payload: { vaccine_type: "DHPP", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /dogs/${dog_id}/vaccinations"
              payload: { vaccine_type: "BORDETELLA", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /trainers"
              payload: { full_name: "Tia Trainer", certified_levels: ["BASIC"], handles_private: true }
              as: AdminManager
              captures: { trainer_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Basic Obedience", level: "BASIC", modality: "GROUP", capacity: 5, session_count: 6, list_price_cents: 10001, credit_cost: 2 }
              as: AdminManager
              captures: { series_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { series_id: "${series_id}", trainer_id: "${trainer_id}", sequence_index: 1, starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T10:00:00Z" }
              as: AdminManager
              captures: { sess1_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { series_id: "${series_id}", trainer_id: "${trainer_id}", sequence_index: 2, starts_at: "2026-07-02T09:00:00Z", ends_at: "2026-07-02T10:00:00Z" }
              as: AdminManager
              captures: { sess2_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { series_id: "${series_id}", trainer_id: "${trainer_id}", sequence_index: 3, starts_at: "2026-07-03T09:00:00Z", ends_at: "2026-07-03T10:00:00Z" }
              as: AdminManager
              captures: { sess3_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { series_id: "${series_id}", trainer_id: "${trainer_id}", sequence_index: 4, starts_at: "2026-07-04T09:00:00Z", ends_at: "2026-07-04T10:00:00Z" }
              as: AdminManager
            - call: "POST /class-sessions"
              payload: { series_id: "${series_id}", trainer_id: "${trainer_id}", sequence_index: 5, starts_at: "2026-07-05T09:00:00Z", ends_at: "2026-07-05T10:00:00Z" }
              as: AdminManager
            - call: "POST /class-sessions"
              payload: { series_id: "${series_id}", trainer_id: "${trainer_id}", sequence_index: 6, starts_at: "2026-07-06T09:00:00Z", ends_at: "2026-07-06T10:00:00Z" }
              as: AdminManager
            - call: "POST /class-series/${series_id}/open"
              payload: {}
              as: AdminManager
              captures: { series_v_open: $.data.version }
            - call: "POST /enrollments"
              payload: { dog_id: "${dog_id}", series_id: "${series_id}", payment_method: "CASH", expected_series_version: "${series_v_open}" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { enr_id: $.data.id }
            # Mark 3 of the 6 sessions PRESENT (sessions_attended must reach 3 for the
            # refund divergence to appear). Each session's auto-created EXPECTED
            # AttendanceRecord id is fetched via the session_id-filtered list.
            - call: "POST /class-sessions/${sess1_id}/start"
              payload: {}
              as: Trainer
              as_user_id: "${trainer_id}"
            - call: "GET /attendance-records"
              payload: { session_id: "${sess1_id}" }
              as: Trainer
              as_user_id: "${trainer_id}"
              captures: { att1_id: "$.data[0].id" }
            - call: "POST /class-sessions/${sess1_id}/attendance"
              payload: { attendance_id: "${att1_id}", state: "PRESENT" }
              as: Trainer
              as_user_id: "${trainer_id}"
            - call: "POST /class-sessions/${sess1_id}/complete"
              payload: {}
              as: Trainer
              as_user_id: "${trainer_id}"
            - call: "POST /class-sessions/${sess2_id}/start"
              payload: {}
              as: Trainer
              as_user_id: "${trainer_id}"
            - call: "GET /attendance-records"
              payload: { session_id: "${sess2_id}" }
              as: Trainer
              as_user_id: "${trainer_id}"
              captures: { att2_id: "$.data[0].id" }
            - call: "POST /class-sessions/${sess2_id}/attendance"
              payload: { attendance_id: "${att2_id}", state: "PRESENT" }
              as: Trainer
              as_user_id: "${trainer_id}"
            - call: "POST /class-sessions/${sess2_id}/complete"
              payload: {}
              as: Trainer
              as_user_id: "${trainer_id}"
            - call: "POST /class-sessions/${sess3_id}/start"
              payload: {}
              as: Trainer
              as_user_id: "${trainer_id}"
            - call: "GET /attendance-records"
              payload: { session_id: "${sess3_id}" }
              as: Trainer
              as_user_id: "${trainer_id}"
              captures: { att3_id: "$.data[0].id" }
            - call: "POST /class-sessions/${sess3_id}/attendance"
              payload: { attendance_id: "${att3_id}", state: "PRESENT" }
              as: Trainer
              as_user_id: "${trainer_id}"
            - call: "POST /class-sessions/${sess3_id}/complete"
              payload: {}
              as: Trainer
              as_user_id: "${trainer_id}"
          trigger:
            - call: "POST /enrollments/${enr_id}/withdraw"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { refund_after: $.data.refund_cents }
          assert:
            - "Enrollment.${enr_id}.status == WITHDRAWN"
            - "Enrollment.${enr_id}.sessions_attended == 3"
            - "Enrollment.${enr_id}.refund_cents == 5000  # forward_unused: round_half_up(10001/6 * 3); NOT 5001 (list - consumed)"

      - name: package_credit_valuation_per_credit_vs_blended_on_package
        grounds:
          - calculations.package_credit_valuation
          - endpoints
          - entities.Package.fields.credits_remaining
        distinguishing_aspect: "On the Package domain (different entity than enrollment_refund): per_credit_list valuation = 33880 (round 57600/17 then *10) vs blended_pool = 33882 (round 57600*10/17) for a PRO package with 10 credits remaining — rounding-order divergence of 2 cents."
        test_recipe:
          setup:
            - "Owner holds a PRO package (credits_total=17, price_paid_cents=57600); 7 credits consumed leaving 10 remaining"
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Ben Owner", email: "ben@x.com", phone: "222" }
              as: FrontDesk
              captures: { owner_id: $.data.id }
            - call: "POST /packages"
              payload: { owner_id: "${owner_id}", tier: "PRO" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /dogs"
              payload: { owner_id: "${owner_id}", name: "Spot", breed: "Pug", birth_date: "2024-02-02" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { dog_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AdminManager
            - call: "POST /dogs/${dog_id}/vaccinations"
              payload: { vaccine_type: "RABIES", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /dogs/${dog_id}/vaccinations"
              payload: { vaccine_type: "DHPP", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /dogs/${dog_id}/vaccinations"
              payload: { vaccine_type: "BORDETELLA", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /trainers"
              payload: { full_name: "Tom T", certified_levels: ["BASIC"] }
              as: AdminManager
              captures: { trainer_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Basic G", level: "BASIC", modality: "GROUP", capacity: 5, session_count: 1, list_price_cents: 8000, credit_cost: 7 }
              as: AdminManager
              captures: { series_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { series_id: "${series_id}", trainer_id: "${trainer_id}", sequence_index: 1, starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T10:00:00Z" }
              as: AdminManager
            - call: "POST /class-series/${series_id}/open"
              payload: {}
              as: AdminManager
              captures: { series_v: $.data.version }
            - call: "POST /enrollments"
              payload: { dog_id: "${dog_id}", series_id: "${series_id}", payment_method: "PACKAGE", package_id: "${pkg_id}", expected_series_version: "${series_v}" }
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "GET /packages/${pkg_id}/valuation"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { per_credit: $.data.per_credit_valuation_cents, blended: $.data.blended_valuation_cents }
          assert:
            - "Package.${pkg_id}.credits_remaining == 10"
            - "valuation.per_credit_valuation_cents == 33880"
            - "valuation.blended_valuation_cents == 33882"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_package_pricing_bulk_discount_and_bonus_credit
        grounds:
          - calculations.tiered_package_pricing
          - entities.Package.fields.price_paid_cents
          - entities.Package.fields.credits_total
        distinguishing_aspect: "Mode (a): >=3 inputs (tier base_credits, base_price, BULK_THRESHOLD) with non-linear interaction — VALUE tier crosses BULK_THRESHOLD=8 so price = round(36000*0.90)=32400 AND credits_total = 8+1 bonus = 9; the discount and bonus both fire only above threshold."
        test_recipe:
          setup:
            - "An owner exists"
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Cara Owner", email: "cara@x.com", phone: "333" }
              as: FrontDesk
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /packages"
              payload: { owner_id: "${owner_id}", tier: "VALUE" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { pkg_id: $.data.id, total: $.data.credits_total, price: $.data.price_paid_cents }
          assert:
            - "Package.${pkg_id}.credits_total == 9   # 8 base + 1 BONUS_CREDITS (base_credits>=BULK_THRESHOLD)"
            - "Package.${pkg_id}.price_paid_cents == 32400   # round_half_up(36000 * (1 - 0.10))"

      - name: package_valuation_round_per_credit_then_sum_vs_sum_then_round
        grounds:
          - calculations.package_credit_valuation
          - endpoints
        distinguishing_aspect: "Mode (b): nested rounding where order matters — per_credit_list rounds 57600/17 to 3388 cents PER credit then *10 = 33880, blended_pool rounds 57600*10/17 once = 33882; the scaffold pins per-credit-then-sum for one variant and sum-then-round for the other, producing a 2-cent gap."
        test_recipe:
          setup:
            - "Owner holds a PRO package with 10 of 17 credits remaining (same state shape as package_credit_valuation_per_credit_vs_blended_on_package)"
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Dee Owner", email: "dee@x.com", phone: "444" }
              as: FrontDesk
              captures: { owner_id: $.data.id }
            - call: "POST /packages"
              payload: { owner_id: "${owner_id}", tier: "PRO" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /dogs"
              payload: { owner_id: "${owner_id}", name: "Coco", breed: "Beagle", birth_date: "2024-03-03" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { dog_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AdminManager
            - call: "POST /dogs/${dog_id}/vaccinations"
              payload: { vaccine_type: "RABIES", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /dogs/${dog_id}/vaccinations"
              payload: { vaccine_type: "DHPP", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /dogs/${dog_id}/vaccinations"
              payload: { vaccine_type: "BORDETELLA", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /trainers"
              payload: { full_name: "Tess T", certified_levels: ["BASIC"] }
              as: AdminManager
              captures: { trainer_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Basic G2", level: "BASIC", modality: "GROUP", capacity: 5, session_count: 1, list_price_cents: 8000, credit_cost: 7 }
              as: AdminManager
              captures: { series_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { series_id: "${series_id}", trainer_id: "${trainer_id}", sequence_index: 1, starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T10:00:00Z" }
              as: AdminManager
            - call: "POST /class-series/${series_id}/open"
              payload: {}
              as: AdminManager
              captures: { series_v: $.data.version }
            - call: "POST /enrollments"
              payload: { dog_id: "${dog_id}", series_id: "${series_id}", payment_method: "PACKAGE", package_id: "${pkg_id}", expected_series_version: "${series_v}" }
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "GET /packages/${pkg_id}/valuation"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { per_credit: $.data.per_credit_valuation_cents, blended: $.data.blended_valuation_cents }
          assert:
            - "valuation.per_credit_valuation_cents == 33880   # round(57600/17)=3388, *10"
            - "valuation.blended_valuation_cents == 33882   # round(57600*10/17)"
            - "valuation.blended_valuation_cents - valuation.per_credit_valuation_cents == 2"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_active_to_waitlisted_cycle
        grounds:
          - state_machines.Enrollment.WAITLISTED_to_ACTIVE
          - state_machines.Enrollment.ACTIVE_to_WAITLISTED
          - entities.Enrollment.fields.status
        distinguishing_aspect: "Enrollment is cyclic: a dog enters WAITLISTED (capacity full), is promoted to ACTIVE, and the Enrollment entity supports the reverse ACTIVE->WAITLISTED demotion edge — a true A<->B loop on the Enrollment entity, not a linear pipeline."
        test_recipe:
          setup:
            - "PRIVATE BASIC series capacity=1, OPEN, with one ACTIVE enrollment occupying the single seat"
            - "A second vaccinated dog enrolls and is WAITLISTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AdminManager
            - call: "POST /owners"
              payload: { full_name: "Eve Owner", email: "eve@x.com", phone: "555" }
              as: FrontDesk
              captures: { owner_id: $.data.id }
            - call: "POST /dogs"
              payload: { owner_id: "${owner_id}", name: "DogA", breed: "Lab", birth_date: "2024-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { dogA_id: $.data.id }
            - call: "POST /dogs"
              payload: { owner_id: "${owner_id}", name: "DogB", breed: "Lab", birth_date: "2024-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { dogB_id: $.data.id }
            - call: "POST /dogs/${dogA_id}/vaccinations"
              payload: { vaccine_type: "RABIES", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /dogs/${dogA_id}/vaccinations"
              payload: { vaccine_type: "DHPP", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /dogs/${dogA_id}/vaccinations"
              payload: { vaccine_type: "BORDETELLA", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /dogs/${dogB_id}/vaccinations"
              payload: { vaccine_type: "RABIES", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /dogs/${dogB_id}/vaccinations"
              payload: { vaccine_type: "DHPP", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /dogs/${dogB_id}/vaccinations"
              payload: { vaccine_type: "BORDETELLA", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /trainers"
              payload: { full_name: "Pri T", certified_levels: ["BASIC"], handles_private: true }
              as: AdminManager
              captures: { trainer_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Private Basic", level: "BASIC", modality: "PRIVATE", capacity: 1, session_count: 1, list_price_cents: 30000, credit_cost: 4 }
              as: AdminManager
              captures: { series_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { series_id: "${series_id}", trainer_id: "${trainer_id}", sequence_index: 1, starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T10:00:00Z" }
              as: AdminManager
            - call: "POST /class-series/${series_id}/open"
              payload: {}
              as: AdminManager
              captures: { series_v1: $.data.version }
            - call: "POST /enrollments"
              payload: { dog_id: "${dogA_id}", series_id: "${series_id}", payment_method: "CASH", expected_series_version: "${series_v1}" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { enrA_id: $.data.id }
            - call: "GET /class-series/${series_id}"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { series_v2: $.data.version }
            - call: "POST /enrollments"
              payload: { dog_id: "${dogB_id}", series_id: "${series_id}", payment_method: "CASH", expected_series_version: "${series_v2}" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { enrB_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enrA_id}/withdraw"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /enrollments/${enrB_id}/promote"
              payload: {}
              as: FrontDesk
              captures: { b_status: $.data.status }
          assert:
            - "Enrollment.${enrB_id}.status == ACTIVE   # was WAITLISTED, promoted after seat freed by A's withdrawal"
            - "Enrollment.${enrA_id}.status == WITHDRAWN"

      - name: makeup_booking_branching_confirm_vs_reject
        grounds:
          - state_machines.MakeupBooking.REQUESTED_to_CONFIRMED
          - state_machines.MakeupBooking.REQUESTED_to_REJECTED
          - entities.MakeupBooking.fields.status
        distinguishing_aspect: "MakeupBooking (a different entity than Enrollment) branches REQUESTED -> {CONFIRMED, REJECTED} with divergent side-effects: CONFIRM sets source AttendanceRecord to MAKEUP_PENDING, REJECT leaves it MISSED_PROVIDER."
        test_recipe:
          setup:
            - "A GROUP series with a cancelled session producing a MISSED_PROVIDER attendance for an ACTIVE enrollment, plus a makeup slot session SCHEDULED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AdminManager
            - call: "POST /owners"
              payload: { full_name: "Finn Owner", email: "finn@x.com", phone: "666" }
              as: FrontDesk
              captures: { owner_id: $.data.id }
            - call: "POST /dogs"
              payload: { owner_id: "${owner_id}", name: "Milo", breed: "Lab", birth_date: "2024-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { dog_id: $.data.id }
            - call: "POST /dogs/${dog_id}/vaccinations"
              payload: { vaccine_type: "RABIES", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /dogs/${dog_id}/vaccinations"
              payload: { vaccine_type: "DHPP", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /dogs/${dog_id}/vaccinations"
              payload: { vaccine_type: "BORDETELLA", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /trainers"
              payload: { full_name: "Gus T", certified_levels: ["BASIC"] }
              as: AdminManager
              captures: { trainer_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Basic G3", level: "BASIC", modality: "GROUP", capacity: 5, session_count: 2, list_price_cents: 12000, credit_cost: 2 }
