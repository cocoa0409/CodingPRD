        distinguishing_aspect: "Closing an un-presented case with withdrawn_reason must yield INACTIVE (not CLOSED), and casework endpoints must then refuse with 422 ERR_CASE_NOT_ASSESSABLE because INACTIVE is outside {INTAKE, ASSESSED, PRESENTED, ACTIVE_RECOVERY}. The survivor's open_case_count must also drop to 0."
