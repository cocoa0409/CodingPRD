              as: FOREMAN
              captures: { err: $.data.error_id }
          assert:
            - "issue of exactly 25 succeeds (201) and StockItem.${stock_id}.on_hand == 0"
            - "issue of 0.5 against empty stock fails with error_id == ERR_INSUFFICIENT_STOCK"
            - "boundary is inclusive: quantity_issued == on_hand is allowed"

      - name: quantity_cap_equality_boundary
        grounds:
          - validations[priority=9g]
          - calculations.quantity_cap_check
        distinguishing_aspect: |
          Boundary on PRODUCTION UNITS via POST
          /assignments/{id}/production-entries (different metric and endpoint
          than stock): with est=100 and cap 1.25, cumulative reported of exactly
          125 is allowed (<= comparison); one more unit (126) fails with
          ERR_QUANTITY_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Contract ACTIVE, bid item est=100 (default cap 1.25); work package IN_PROGRESS; ACTIVE assignment, clock 2026-08-03T12:00:00Z"
            - "Entry e1 of 100 units (SUBMITTED) already reported"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-701", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
