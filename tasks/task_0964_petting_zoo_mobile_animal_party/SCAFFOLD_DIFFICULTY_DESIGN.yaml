            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c13}", captures: { v13: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Gogo", species: "GOAT", weight_class: "SMALL", temperament_tier: 3, base_event_fee_cents: 8000 }, as: Operator, captures: { a_goat: $.data.id } }
            - { call: "POST /petting-zoo/animals/${a_goat}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v13}", start_time: "2026-06-17T14:00:00Z", end_time: "2026-06-17T16:00:00Z", guest_count: 20, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c13}", captures: { bk: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_goat}", role: "PETTING_ZOO" }, as: Coordinator, captures: { ba: $.data.id } }
