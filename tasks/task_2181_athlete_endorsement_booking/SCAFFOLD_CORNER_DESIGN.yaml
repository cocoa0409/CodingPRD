            - "RenewalOption.${ro_id}.bonus_cents == 360000"
            - "RenewalOption.${ro_id}.total_engagement_value_cents == 3360000"
            - "RenewalOption.${ro_id}.renewal_fee_cents == 1808000"
      - name: cascading_side_effects_end_to_end_on_terminate
        claim_type: cascading_side_effects
        grounds: ["state_machines.Engagement.ACTIVE_to_TERMINATED"]
        excluded_because:
          difficulty_instance: transitive_cascade / terminate_engagement_releases_grant_decrements_counter_rescores_athlete
          rationale: "The four-hop unwind is verified end-to-end there, including the slot and ledger hops."
      - name: dual_variant_calculation_layer_divergence
        claim_type: dual_variant_calculation
        grounds: ["calculations.appearance_fee_engine", "calculations.athlete_exposure_risk_score"]
        excluded_because:
          difficulty_instance: dual_variant_calc / roster_snapshot_vs_pipeline_projected_exposure_risk
          rationale: "Both variant pairs are asserted by the two dual_variant_calc instances."

  - section: consistency_model
    instances:
      - name: terminate_response_body_shows_the_whole_cascade_immediately
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "endpoints[POST /engagements/{id}/terminate]"]
        distinguishing_aspect: |
          consistency_model is immediate: the terminate response itself already carries contract_status TERMINATED AND settlement_status BILLABLE, and an immediately following read of the athlete shows active_exclusivity_count 0 with no second call needed to settle the cascade.
        test_recipe:
          setup:
            - "Engagement ACTIVE with an ACTIVE grant and one PENDING deliverable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
