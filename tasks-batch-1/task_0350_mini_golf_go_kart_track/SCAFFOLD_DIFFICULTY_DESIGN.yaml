              as_user_id: "ops-1"
          trigger:
            - call: "POST /heats/${heat_id}/open"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_VENUE_NOT_OPEN"
            - "Heat.${heat_id}.status == SCHEDULED   # unchanged"

      - name: booking_confirm_requires_tee_session_open
        grounds:
          - state_machines.Booking.HOLD_to_CONFIRMED
          - state_machines.TeeSession.SCHEDULED_to_OPEN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A Booking's HOLD->CONFIRMED depends on the owning TeeSession.status == OPEN: confirming against a still-SCHEDULED tee session fails ERR_INVALID_STATE. Entity pair Booking->TeeSession, distinct from the Heat->Venue pair above."
        test_recipe:
          setup:
            - "TeeSession created but NOT opened (SCHEDULED); a HOLD booking references it."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Track L" }
