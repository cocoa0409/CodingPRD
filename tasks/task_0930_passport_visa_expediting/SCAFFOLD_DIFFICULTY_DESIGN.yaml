            - "GET /expediting/applicants/${ap_id}/documents returns exactly 0 rows"

  # =======================================================================
  # Rule 7 — cross-entity state dependencies across DIFFERENT entity pairs
  # =======================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: prepared_form_creation_depends_on_agency_form_publication_state
        grounds:
          - validations[priority=24]
          - errors[ERR_FORM_REVISION_STALE]
          - entities.AgencyForm.fields.status
          - state_machines.AgencyForm.DRAFT_to_ACTIVE
          - entities.PreparedForm.fields.agency_form_id
        distinguishing_aspect: |
          Entity pair Applicant -> AgencyForm: preparing a form is refused while
          the referenced AgencyForm revision is still DRAFT and succeeds the
          moment that same revision is published to ACTIVE, with no change to
          the applicant itself between the two attempts.
        test_recipe:
          setup:
            - "DS-160 revision 1 registered but NOT published, so its status is DRAFT."
            - "One order with one applicant on a catalog item whose form_code is DS-160."
          setup_api_calls:
