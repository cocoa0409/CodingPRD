            - "One PASSED EQUIPMENT_TELEMETRY packet for 2026 (5000.00 acres, coverage 92.00, measured 0.3000); MODEL run R5 VERIFIED with net_removals_t 1416.800."
            - "CreditBatch CB5 issued from R5: gross_credits 1416, risk_tier MEDIUM, buffer_pct 14.00, buffer_credits 199, issued_credits 1217, serials 1..1217; the buffer pool therefore holds balance_credits 199 against required_reserve_credits 61 and is HEALTHY."
            - "CB5 has been LISTED on the registry by the RegistryOfficer."
            - "A PER_ACRE GrowerPayment for 2026 is ACCRUED: gross 4437500, holdback 20.00 pct = 887500, net 3550000; it has NOT been paid."
            - "ReversalEvent RE5 on CB5 is REPORTED by admin-reversal-01: reversal_type UNINTENTIONAL, affected_acres 2000.00, detected_crop_year 2026."
