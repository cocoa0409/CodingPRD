            - call: POST /race-results/${res_id}/certify
              as: TechnicalOfficial
            - call: POST /race-editions/${ed_id}/certify-results
              as: TechnicalOfficial
              captures: { ed_v: "$.data.version" }
            - call: POST /race-editions/${ed_id}/compute-awards
              payload: { expected_race_edition_version: "${ed_v}" }
              as: FinanceOfficer
            - call: GET /prize-awards
              payload: { race_edition_id: "${ed_id}", status: COMPUTED }
              as: FinanceOfficer
              captures: { aw_id: "$.data[0].id" }
            - call: POST /prize-awards/${aw_id}/pay
              payload: { payment_reference: "TRSY-SGD-EARLY" }
              as: FinanceOfficer
              as_user_id: "fin-pay-2"
              captures: { err4: "$.data.error_id" }
            - call: POST /prize-awards/${aw_id}/approve
              as: FinanceOfficer
              as_user_id: "fin-approve-1"
            - call: POST /prize-awards/${aw_id}/approve
              as: FinanceOfficer
              as_user_id: "fin-approve-3"
              captures: { err5: "$.data.error_id" }
            - call: POST /prize-awards/${aw_id}/pay
              payload: { payment_reference: "TRSY-SGD-1" }
              as: FinanceOfficer
              as_user_id: "fin-pay-2"
            - call: POST /prize-awards/${aw_id}/pay
              payload: { payment_reference: "TRSY-SGD-2" }
              as: FinanceOfficer
              as_user_id: "fin-pay-4"
              captures: { err6: "$.data.error_id" }
            - call: GET /prize-awards/${aw_id}
              as: FinanceOfficer
          assert:
            - "trigger call 1 returns HTTP 409 with error_id == ERR_INVALID_DOPING_TEST_STATE — adjudication requires COLLECTED, the test is still SCHEDULED"
            - "trigger call 3 returns HTTP 409 with error_id == ERR_INVALID_DOPING_TEST_STATE and the stored collected_sample_ref stays \"COC-SGD-1\""
            - "trigger call 5 returns HTTP 409 with error_id == ERR_INVALID_DOPING_TEST_STATE — CLEARED is terminal, so the ADVERSE re-adjudication cannot rewrite the outcome"
            - "trigger call 11 returns HTTP 409 with error_id == ERR_INVALID_AWARD_STATE — payment requires APPROVED, the award is only COMPUTED"
            - "trigger call 13 returns HTTP 409 with error_id == ERR_INVALID_AWARD_STATE and approved_by_user_id remains \"fin-approve-1\" from trigger call 12"
            - "trigger call 15 returns HTTP 409 with error_id == ERR_INVALID_AWARD_STATE — PAID is terminal, so the second payment reference is refused"
            - "trigger call 16 returns status == PAID, payment_reference == \"TRSY-SGD-1\", paid_by_user_id == \"fin-pay-2\" and exactly the version reached by the two successful writes"

      - name: corner_error_qualifying_standard_missing_and_performance_division_mismatch
        claim_type: violation_to_error
        grounds:
          - errors.ERR_QUALIFYING_STANDARD_MISSING
          - errors.ERR_PERFORMANCE_DIVISION_MISMATCH
          - validations[priority=14]
          - validations[priority=15]
        distinguishing_aspect: >-
          These are the two remaining offer-time referential refusals and they sit on opposite sides
          of the ladder: a missing DivisionStandard for the invited athlete's (division, gender) key is
          a priority 14 capacity/uniqueness failure with ERR_QUALIFYING_STANDARD_MISSING, whereas a
          pinned performance that belongs to another division or another athlete is a priority 15
          coherence failure with ERR_PERFORMANCE_DIVISION_MISMATCH — and the standard-met check is
          arranged to pass in the latter cases so the deeper rule is genuinely reached.
        test_recipe:
          setup:
            - "Edition with an ELITE MALE standard only (max 8100, bibs 11..20) — no FEMALE and no SUB_ELITE standard."
            - "Female athlete F with a VERIFIED ELITE 7900 performance; male athletes M1 and M2 each with a VERIFIED 7900 performance, plus a VERIFIED SUB_ELITE 7900 performance for M1."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
