        distinguishing_aspect: "Depth-2 chain from a different trigger (assessor transition, not score submission): suspending assessor R1 REASSIGNS each of his ASSIGNED live assignments (hop 1), and each REASSIGNED assignment re-opens its submission's read slot so the next assignment on that submission computes read_number 1 again (hop 2)."
