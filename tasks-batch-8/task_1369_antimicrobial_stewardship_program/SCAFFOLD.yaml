# =============================================================================
# Task 1369 — Antimicrobial Stewardship Program (hospital stewardship committee)
# Scaffold seed tables §1.0–§1.7
# =============================================================================

scenario: |
  Antimicrobial Stewardship Program (hospital stewardship committee): restricted-antibiotic approval workflow, prospective audit & feedback intervention documentation, de-escalation & IV-to-PO conversion opportunity detection, culture/susceptibility-driven recommendation, antibiogram production & empiric guideline update, days-of-therapy metric & benchmarking, allergy (penicillin) delabeling program, regulatory reporting of antimicrobial use

domain_name: antimicrobial-stewardship
api_prefix: /stewardship

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - selector_policy
    - scheduled_actions

  entity_topology: flat            # peer entities joined by foreign keys; no URL nesting
  state_machine_shape: cyclic      # audit negotiation loops, allergy rechallenge loops
  relationship_patterns:
    - one_to_many
    - self_referential             # EmpiricGuideline supersedes prior EmpiricGuideline
    - cross_aggregate              # AntibioticOrder references CultureReport; AuditIntervention references AntibioticOrder
    - polymorphic                  # ConversionOpportunity.opportunity_kind drives per-kind eligibility inputs

  role_model: segregation_of_duties  # prescriber cannot approve own restricted order; intervener cannot adjudicate own appeal

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: Hospital
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Hospital facility name" }
      - { name: nhsn_facility_id, type: string, source: input, description: "CDC NHSN facility identifier used on regulatory reports" }
      - { name: current_utc, type: datetime, source: system, description: "Logical clock for this hospital's stewardship program; starts at 2026-08-01T00:00:00Z and only advances via POST /stewardship/_clock/set_current_utc" }
      - { name: dot_review_threshold, type: integer, source: input, default: 7, constraints: ">= 1", description: "DOT length (whole days) at or above which an ACTIVE order is flagged for mandatory prospective audit" }
      - { name: iv_to_po_min_iv_hours, type: integer, source: input, default: 48, constraints: ">= 24", description: "Minimum cumulative IV hours before an IV-to-PO conversion opportunity may be raised" }
      - { name: antibiogram_min_isolates, type: integer, source: input, default: 30, constraints: ">= 1", description: "Minimum first-isolates-per-drug-bug-count for a susceptibility row to be reportable in an antibiogram" }
      - { name: restricted_auto_expire_hours, type: integer, source: input, default: 72, constraints: ">= 1", description: "Hours after which a SUBMITTED approval request with no decision auto-expires" }

  - name: Practitioner
    parent: null
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: input, description: "FK -> Hospital.id; practitioner practices at this hospital" }
      - { name: full_name, type: string, source: input, description: "Full legal name" }
      - { name: license_no, type: string, source: input, description: "Professional license number; unique per hospital" }
      - { name: discipline, type: enum, source: input, constraints: "PHYSICIAN | PHARMACIST | MICROBIOLOGIST | INFECTION_PREVENTIONIST", description: "Clinical discipline driving RBAC grants" }
      - { name: is_stewardship_member, type: boolean, source: input, default: false, description: "Whether the practitioner sits on the stewardship committee" }
      - { name: is_active, type: boolean, source: system, default: true, description: "Inactive practitioners may not act" }
      - { name: stewardship_standing, type: enum, source: computed, default: GOOD, constraints: "GOOD | WATCH | SUSPENDED", description: "Derived from resolved interventions: SUSPENDED when unresolved_noncompliance_count >= 3; WATCH when == 2; else GOOD" }
      - { name: unresolved_noncompliance_count, type: integer, source: computed, default: 0, description: "Count of AuditInterventions where this practitioner is the prescriber, recommendation_status == REJECTED_FINAL" }

  - name: PatientCase
    parent: null
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: input, description: "FK -> Hospital.id; admitting facility" }
      - { name: mrn, type: string, source: input, description: "Medical record number; unique per hospital" }
      - { name: admitted_at, type: datetime, source: input, description: "Admission timestamp (logical clock time at admission registration)" }
      - { name: ward, type: string, source: input, description: "Inpatient ward code" }
      - { name: is_immunocompromised, type: boolean, source: input, default: false, description: "Raises allergy-test and conversion thresholds" }
      - { name: weight_kg, type: number, source: input, constraints: "> 0", description: "Most recent measured weight; feeds eligibility scoring" }
      - { name: renal_function_crcl, type: integer, source: input, constraints: ">= 0", description: "Creatinine clearance mL/min; feeds IV-to-PO eligibility and dosing guardrails" }
      - { name: has_enteral_access, type: boolean, source: input, default: true, description: "Whether patient can take oral/enteral medication" }
      - { name: status, type: enum, source: system, constraints: "ADMITTED | DISCHARGED", default: ADMITTED, description: "Discharge locks all open orders/interventions" }

  - name: Antimicrobial
    parent: null
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: input, description: "FK -> Hospital.id; formulary scope" }
      - { name: drug_name, type: string, source: input, description: "Generic drug name; unique per hospital" }
      - { name: drug_class, type: string, source: input, description: "Pharmacologic class (e.g. CARBAPENEM, GLYCOPEPTIDE, FLUOROQUINOLONE, BETA_LACTAM)" }
      - { name: is_restricted, type: boolean, source: input, description: "Restricted drugs require stewardship approval before first dose" }
      - { name: has_po_form, type: boolean, source: input, description: "True when an oral formulation with equivalent bioavailability exists (drives IV-to-PO candidacy)" }
      - { name: is_penicillin_class, type: boolean, source: input, default: false, description: "True for penicillins and beta-lactams with cross-reactive side chains; gates allergy delabeling workflow" }
      - { name: formulary_status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | SUSPENDED", description: "SUSPENDED drugs cannot receive new orders" }

  - name: AllergyAssessment
    parent: null
    common_fields: true
    fields:
      - { name: patient_case_id, type: string, source: input, description: "FK -> PatientCase.id; patient whose penicillin allergy is under review" }
      - { name: reported_reaction, type: string, source: input, description: "Free-text reaction as recorded at intake" }
      - { name: reaction_severity, type: enum, source: input, constraints: "MILD | MODERATE | SEVERE", description: "Intake severity grading; SEVERE blocks direct challenge" }
      - { name: years_since_reaction, type: integer, source: input, constraints: ">= 0", description: "Years elapsed since index reaction" }
      - { name: risk_score, type: number, source: computed, description: "Computed by penicillin_allergy_risk_score calculation (0..100, 2dp)" }
      - { name: delabel_eligible, type: boolean, source: computed, description: "True when risk_score < LOW_RISK_THRESHOLD and severity != SEVERE" }
      - { name: status, type: enum, source: system, constraints: "SUSPECTED | TESTING_SCHEDULED | TESTED | DELABELED | CONFIRMED | WITHDRAWN", description: "Allergy delabeling workflow state" }
      - { name: test_result, type: enum, source: system, constraints: "NULL | NEGATIVE | POSITIVE | INDETERMINATE", default: "NULL", description: "Skin-test / challenge outcome recorded at TESTED transition" }

  - name: CultureReport
    parent: null
    common_fields: true
    fields:
      - { name: patient_case_id, type: string, source: input, description: "FK -> PatientCase.id; source patient" }
      - { name: specimen_source, type: string, source: input, description: "Anatomic specimen source (BLOOD, URINE, SPUTUM, WOUND, CSF)" }
      - { name: collected_at, type: datetime, source: input, description: "Collection timestamp; must be <= current hospital clock" }
      - { name: organism, type: string, source: input, description: "Identified organism (e.g. E_COLI, MRSA, PSEUDOMONAS)" }
      - { name: is_first_isolate, type: boolean, source: computed, description: "True when this is the patient's first isolate of (organism, specimen_source) within the rolling 365-day window ending at collected_at; antibiograms count first isolates only" }
      - { name: resulted_at, type: datetime, source: system, description: "Timestamp the report left PRELIMINARY state" }
      - { name: status, type: enum, source: system, constraints: "PRELIMINARY | FINAL | AMENDED", description: "PRELIMINARY reports cannot drive recommendations or antibiograms" }

  - name: SusceptibilityResult
    parent: null
    common_fields: true
    fields:
      - { name: culture_report_id, type: string, source: input, description: "FK -> CultureReport.id; parent culture" }
      - { name: antimicrobial_id, type: string, source: input, description: "FK -> Antimicrobial.id; tested drug" }
      - { name: interpretation, type: enum, source: input, constraints: "S | I | R", description: "Susceptible / Intermediate / Resistant per breakpoint standard" }
      - { name: mic_value, type: number, source: input, constraints: "> 0", description: "Minimum inhibitory concentration mg/L" }

  - name: AntibioticOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_case_id, type: string, source: input, description: "FK -> PatientCase.id; receiving patient" }
      - { name: antimicrobial_id, type: string, source: input, description: "FK -> Antimicrobial.id; ordered drug" }
      - { name: prescriber_id, type: string, source: input, description: "FK -> Practitioner.id; ordering prescriber" }
      - { name: route, type: enum, source: input, constraints: "IV | PO | IM", description: "Administration route" }
      - { name: dose_mg, type: integer, source: input, constraints: "> 0", description: "Per-dose amount in milligrams" }
      - { name: frequency_per_day, type: integer, source: input, constraints: "1..4", description: "Doses per calendar day" }
      - { name: started_at, type: datetime, source: system, description: "First-dose timestamp; set when order becomes ACTIVE" }
      - { name: stopped_at, type: datetime, source: system, description: "Final-stop timestamp; set on COMPLETED/DISCONTINUED" }
      - { name: cumulative_iv_hours, type: integer, source: computed, default: 0, description: "Whole hours of IV administration accrued; advanced by POST .../administrations when route == IV" }
      - { name: administered_doses, type: integer, source: computed, default: 0, description: "Count of administration events recorded" }
      - { name: dot_calendar, type: integer, source: computed, default: 0, description: "Calendar-day DOT accrual; incremented once per calendar day with >= 1 administered dose while ACTIVE" }
      - { name: dot_dose, type: number, source: computed, default: 0, description: "Dose-based DOT accrual: administered_doses / frequency_per_day, 2dp" }
      - { name: indication, type: enum, source: input, constraints: "EMPIRIC | CULTURE_DIRECTED | PROPHYLAXIS", description: "EMPIRIC orders are the target of culture-driven recommendations" }
      - { name: approval_status, type: enum, source: system, constraints: "NOT_REQUIRED | PENDING | APPROVED | DENIED | EXPIRED", default: NOT_REQUIRED, description: "Approval dimension (parallel to therapy_status); restricted drugs start PENDING" }
      - { name: therapy_status, type: enum, source: system, constraints: "AWAITING_APPROVAL | ACTIVE | REVIEW_REQUIRED | DEESCALATED | CONVERTED | COMPLETED | DISCONTINUED", default: ACTIVE, description: "Therapy lifecycle dimension (parallel to approval_status)" }

  - name: ApprovalRequest
    parent: null
    common_fields: true
    fields:
      - { name: antibiotic_order_id, type: string, source: input, description: "FK -> AntibioticOrder.id; restricted order under review" }
      - { name: requester_id, type: string, source: input, description: "FK -> Practitioner.id; prescriber who submitted" }
      - { name: justification, type: string, source: input, constraints: ">= 20 chars", description: "Clinical justification text" }
      - { name: submitted_at, type: datetime, source: system, description: "Submission timestamp from hospital clock" }
      - { name: decided_at, type: datetime, source: system, description: "Decision timestamp; null until decided" }
      - { name: decided_by_id, type: string, source: system, description: "FK -> Practitioner.id; deciding committee member (segregation: != requester_id)" }
      - { name: escalation_reason, type: string, source: system, description: "Recorded when escalated" }
      - { name: status, type: enum, source: system, constraints: "SUBMITTED | ESCALATED | APPROVED | DENIED | EXPIRED | WITHDRAWN", description: "Approval workflow state" }

  - name: AuditIntervention
    parent: null
    common_fields: true
    fields:
      - { name: antibiotic_order_id, type: string, source: input, description: "FK -> AntibioticOrder.id; audited order" }
      - { name: auditor_id, type: string, source: input, description: "FK -> Practitioner.id; stewardship pharmacist documenting the audit" }
      - { name: intervention_type, type: enum, source: input, constraints: "DOSE_OPTIMIZATION | DEESCALATION | IV_TO_PO | DURATION_REDUCTION | STOP", description: "Category of prospective-audit recommendation" }
      - { name: recommendation_text, type: string, source: input, constraints: ">= 20 chars", description: "Recommendation narrative" }
      - { name: recommendation_status, type: enum, source: system, constraints: "DOCUMENTED | RECOMMENDED | ACCEPTED | REJECTED | APPEALED | REJECTED_FINAL | SUPERSEDED", description: "Negotiation lifecycle state" }
      - { name: responded_by_id, type: string, source: system, description: "FK -> Practitioner.id; prescriber who accepted/rejected" }
      - { name: appeal_adjudicator_id, type: string, source: system, description: "FK -> Practitioner.id; committee member adjudicating an appeal (segregation: != auditor_id and != responded_by_id)" }
      - { name: due_at, type: datetime, source: system, description: "Response deadline = documented_at + 24h; auto-SUPERSEDED on breach via clock sweep" }

  - name: ConversionOpportunity
    parent: null
    common_fields: true
    fields:
      - { name: antibiotic_order_id, type: string, source: input, description: "FK -> AntibioticOrder.id; candidate order" }
      - { name: opportunity_kind, type: enum, source: input, constraints: "IV_TO_PO | DEESCALATION", description: "Polymorphic opportunity type; drives eligibility inputs" }
      - { name: eligibility_score, type: number, source: computed, description: "Computed by iv_to_po_eligibility_score (IV_TO_PO) or deescalation_priority_score (DEESCALATION); 2dp" }
      - { name: detected_at, type: datetime, source: system, description: "Detection timestamp from hospital clock" }
      - { name: suggested_antimicrobial_id, type: string, source: input, description: "FK -> Antimicrobial.id; suggested replacement (for DEESCALATION) or oral formulation (for IV_TO_PO)" }
      - { name: status, type: enum, source: system, constraints: "DETECTED | ACCEPTED | DECLINED | EXPIRED", description: "EXPIRED when not actioned within 48h of detected_at" }

  - name: Antibiogram
    parent: null
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: input, description: "FK -> Hospital.id; facility scope" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive period start (UTC)" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive period end (UTC); must be > period_start" }
      - { name: generated_at, type: datetime, source: system, description: "Generation timestamp" }
      - { name: row_count, type: integer, source: computed, default: 0, description: "Number of AntibiogramRow children meeting the min-isolates threshold" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | PUBLISHED | SUPERSEDED", description: "Only one PUBLISHED antibiogram per hospital at a time (compound posture over guideline updates)" }

  - name: AntibiogramRow
    parent: null
    common_fields: true
    fields:
      - { name: antibiogram_id, type: string, source: input, description: "FK -> Antibiogram.id; parent antibiogram" }
      - { name: organism, type: string, source: input, description: "Organism this row summarizes" }
      - { name: antimicrobial_id, type: string, source: input, description: "FK -> Antimicrobial.id; summarized drug" }
      - { name: isolate_count, type: integer, source: computed, description: "Count of first-isolate FINAL/AMENDED CultureReports in window with a SusceptibilityResult for this drug" }
      - { name: susceptible_count, type: integer, source: computed, description: "Of those, count with interpretation == S" }
      - { name: pct_susceptible, type: number, source: computed, description: "antibiogram susceptibility rate, 2dp, computed per antibiogram_susceptibility_rate calculation" }
      - { name: is_reportable, type: boolean, source: computed, description: "isolate_count >= hospital.antibiogram_min_isolates" }

  - name: EmpiricGuideline
    parent: null
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: input, description: "FK -> Hospital.id; facility scope" }
      - { name: syndrome, type: string, source: input, description: "Clinical syndrome (e.g. CAP, HAP, UTI, SEPSIS, SSTI)" }
      - { name: first_line_antimicrobial_id, type: string, source: input, description: "FK -> Antimicrobial.id; recommended empiric drug" }
      - { name: source_antibiogram_id, type: string, source: input, description: "FK -> Antibiogram.id; antibiogram this guideline version was derived from (version-pinning)" }
      - { name: supersedes_guideline_id, type: string, source: input, description: "FK -> EmpiricGuideline.id; previous guideline for this syndrome (self-referential chain)" }
      - { name: pct_susceptible_at_adoption, type: number, source: computed, description: "Snapshot of first-line drug's pct_susceptible for the syndrome-mapped organism at adoption; guideline is STALE when a newer PUBLISHED antibiogram drops this below the adoption value minus STALENESS_DROP_POINTS" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | ADOPTED | STALE | RETIRED", description: "ADOPTED guideline is the hospital's active empiric recommendation per syndrome" }

  - name: DOTMetricSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: input, description: "FK -> Hospital.id; facility scope" }
      - { name: period_label, type: string, source: input, description: "Calendar month label YYYY-MM; unique per hospital" }
      - { name: total_dot_calendar, type: integer, source: computed, description: "Sum of dot_calendar accrued to orders in the month, per days_of_therapy calculation" }
      - { name: total_dot_dose, type: number, source: computed, description: "Sum of dot_dose accrued to orders in the month, 2dp" }
      - { name: patient_days, type: integer, source: input, constraints: "> 0", description: "Denominator: inpatient days present in the month" }
      - { name: dot_per_1000_pd_calendar, type: number, source: computed, description: "total_dot_calendar / patient_days * 1000, 2dp, round-half-up" }
      - { name: dot_per_1000_pd_dose, type: number, source: computed, description: "total_dot_dose / patient_days * 1000, 2dp, round-half-up" }
      - { name: benchmark_percentile, type: integer, source: computed, description: "Percentile vs NHSN benchmark table by dot_per_1000_pd_calendar (benchmark_percentile calculation); 0..100" }
      - { name: status, type: enum, source: system, constraints: "OPEN | FINALIZED", description: "FINALIZED snapshots are immutable inputs to regulatory reports" }

  - name: RegulatoryReport
    parent: null
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: input, description: "FK -> Hospital.id; reporting facility" }
      - { name: report_type, type: enum, source: input, constraints: "NHSN_AUR | STATE_MANDATE", description: "Regulatory program" }
      - { name: period_label, type: string, source: input, description: "Calendar month YYYY-MM covered by the report" }
      - { name: dot_snapshot_id, type: string, source: input, description: "FK -> DOTMetricSnapshot.id; pinned FINALIZED snapshot (version-pinning on submission)" }
      - { name: payload_json, type: string, source: computed, description: "Deterministic JSON payload assembled at submission from the pinned snapshot" }
      - { name: checksum, type: string, source: computed, description: "FNV-1a 32-bit hex checksum of payload_json (tamper evidence)" }
      - { name: submitted_at, type: datetime, source: system, description: "Submission timestamp" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | SUBMITTED | ACCEPTED | REJECTED", description: "REJECTED reports may be corrected and resubmitted as a new report referencing the same snapshot" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: ApprovalRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, EXPIRED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /stewardship/approval-requests/{id}/decide with decision=APPROVED"
        actor: IDPharmacist | StewardshipDirector
        preconditions:
          - "Request status == SUBMITTED or ESCALATED (ERR_APPROVAL_NOT_PENDING)"
          - "decider_id != requester_id — segregation of duties (ERR_SELF_APPROVAL_FORBIDDEN)"
          - "Parent order approval_status == PENDING (ERR_ORDER_APPROVAL_NOT_PENDING)"
        side_effects:
          - "AntibioticOrder.approval_status := APPROVED"
          - "If AntibioticOrder.therapy_status == AWAITING_APPROVAL: therapy_status := ACTIVE, started_at := clock"
          - "ApprovalRequest.decided_at := clock; decided_by_id := acting practitioner id"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /stewardship/approval-requests/{id}/decide with decision=DENIED"
        actor: IDPharmacist | StewardshipDirector
        preconditions:
          - "Request status == SUBMITTED or ESCALATED (ERR_APPROVAL_NOT_PENDING)"
          - "decider_id != requester_id (ERR_SELF_APPROVAL_FORBIDDEN)"
          - "Parent order approval_status == PENDING (ERR_ORDER_APPROVAL_NOT_PENDING)"
        side_effects:
          - "AntibioticOrder.approval_status := DENIED"
          - "If AntibioticOrder.therapy_status == AWAITING_APPROVAL: therapy_status := DISCONTINUED, stopped_at := clock"
      - from: SUBMITTED
        to: ESCALATED
        trigger: "POST /stewardship/approval-requests/{id}/escalate"
        actor: IDPharmacist
        preconditions:
          - "Request status == SUBMITTED (ERR_APPROVAL_NOT_PENDING)"
          - "escalation_reason provided, >= 10 chars (ERR_INVALID_REQUEST)"
        side_effects:
          - "escalation_reason recorded"
      - from: ESCALATED
        to: APPROVED
        trigger: "POST /stewardship/approval-requests/{id}/decide with decision=APPROVED"
        actor: StewardshipDirector
        preconditions:
          - "Request status == SUBMITTED or ESCALATED (ERR_APPROVAL_NOT_PENDING)"
          - "Only StewardshipDirector may decide an ESCALATED request (ERR_ESCALATED_REQUIRES_DIRECTOR)"
          - "decider_id != requester_id (ERR_SELF_APPROVAL_FORBIDDEN)"
          - "Parent order approval_status == PENDING (ERR_ORDER_APPROVAL_NOT_PENDING)"
        side_effects:
          - "AntibioticOrder.approval_status := APPROVED"
          - "If AntibioticOrder.therapy_status == AWAITING_APPROVAL: therapy_status := ACTIVE, started_at := clock"
          - "ApprovalRequest.decided_at := clock; decided_by_id := acting practitioner id"
      - from: ESCALATED
        to: DENIED
        trigger: "POST /stewardship/approval-requests/{id}/decide with decision=DENIED"
        actor: StewardshipDirector
        preconditions:
          - "Request status == SUBMITTED or ESCALATED (ERR_APPROVAL_NOT_PENDING)"
          - "Only StewardshipDirector may decide an ESCALATED request (ERR_ESCALATED_REQUIRES_DIRECTOR)"
          - "decider_id != requester_id (ERR_SELF_APPROVAL_FORBIDDEN)"
          - "Parent order approval_status == PENDING (ERR_ORDER_APPROVAL_NOT_PENDING)"
        side_effects:
          - "AntibioticOrder.approval_status := DENIED"
          - "If AntibioticOrder.therapy_status == AWAITING_APPROVAL: therapy_status := DISCONTINUED, stopped_at := clock"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system clock sweep (POST /stewardship/_clock/set_current_utc) when clock >= submitted_at + hospital.restricted_auto_expire_hours"
        actor: system
        preconditions:
          - "Request status == SUBMITTED (an ESCALATED request does not auto-expire)"
        side_effects:
          - "AntibioticOrder.approval_status := EXPIRED"
          - "AntibioticOrder.therapy_status := DISCONTINUED (if AWAITING_APPROVAL), stopped_at := clock"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /stewardship/approval-requests/{id}/withdraw"
        actor: AttendingPhysician | IDPharmacist
        preconditions:
          - "Request status == SUBMITTED (ERR_APPROVAL_NOT_PENDING)"
          - "Withdrawer must be the requester (ERR_NOT_REQUEST_OWNER)"
        side_effects:
          - "AntibioticOrder.approval_status := NOT_REQUIRED"
          - "If AntibioticOrder.therapy_status == AWAITING_APPROVAL: therapy_status := DISCONTINUED, stopped_at := clock"

  - entity: AntibioticOrder
    initial_state: "approval_status: NOT_REQUIRED | PENDING (by drug); therapy_status: ACTIVE | AWAITING_APPROVAL"
    terminal_states: ["therapy_status in {COMPLETED, DISCONTINUED}"]
    transitions:
      - from: "therapy_status == ACTIVE"
        to: "therapy_status == REVIEW_REQUIRED"
        trigger: "system clock sweep when dot_calendar >= hospital.dot_review_threshold"
        actor: system
        preconditions:
          - "approval_status == APPROVED or NOT_REQUIRED"
          - "dot_calendar >= hospital.dot_review_threshold (boundary: >=, i.e. exactly at threshold fires)"
        side_effects:
          - "order becomes eligible as AuditIntervention target"
      - from: "therapy_status == REVIEW_REQUIRED"
        to: "therapy_status == ACTIVE"
        trigger: "POST /stewardship/audit-interventions/{id}/respond with response=ACCEPTED and intervention_type != STOP"
        actor: AttendingPhysician
        preconditions:
          - "Linked intervention recommendation_status == RECOMMENDED (ERR_INTERVENTION_NOT_PENDING)"
        side_effects:
          - "AuditIntervention.recommendation_status := ACCEPTED"
          - "If intervention_type == IV_TO_PO: therapy_status := CONVERTED, route := PO (overrides plain ACTIVE return)"
          - "If intervention_type == DEESCALATION: therapy_status := DEESCALATED, antimicrobial_id := intervention.suggested drug via ConversionOpportunity linkage"
      - from: "therapy_status == ACTIVE"
        to: "therapy_status == CONVERTED"
        trigger: "POST /stewardship/conversion-opportunities/{id}/accept with kind=IV_TO_PO"
        actor: AttendingPhysician
        preconditions:
          - "ConversionOpportunity.status == DETECTED (ERR_OPPORTUNITY_NOT_DETECTED)"
          - "Order route == IV (ERR_ORDER_NOT_IV)"
          - "Antimicrobial.has_po_form == true (ERR_NO_ORAL_FORM)"
        side_effects:
          - "Order.route := PO; ConversionOpportunity.status := ACCEPTED"
          - "dot_dose and dot_calendar continue accruing under new route"
      - from: "therapy_status == ACTIVE"
        to: "therapy_status == DEESCALATED"
        trigger: "POST /stewardship/conversion-opportunities/{id}/accept with kind=DEESCALATION"
        actor: AttendingPhysician
        preconditions:
          - "ConversionOpportunity.status == DETECTED (ERR_OPPORTUNITY_NOT_DETECTED)"
          - "A FINAL CultureReport for the same patient exists with interpretation == S for suggested_antimicrobial_id (ERR_NO_SUPPORTING_CULTURE)"
        side_effects:
          - "Order.antimicrobial_id := suggested_antimicrobial_id"
          - "ConversionOpportunity.status := ACCEPTED"
      - from: "therapy_status in {ACTIVE, REVIEW_REQUIRED, DEESCALATED, CONVERTED}"
        to: "therapy_status == COMPLETED"
        trigger: "POST /stewardship/antibiotic-orders/{id}/complete"
        actor: AttendingPhysician
        preconditions:
          - "No AuditIntervention for this order in RECOMMENDED or APPEALED status (ERR_OPEN_INTERVENTION_BLOCKS_CLOSE)"
          - "PatientCase.status == ADMITTED (ERR_PATIENT_DISCHARGED)"
        side_effects:
          - "stopped_at := clock; final DOT recomputed"
      - from: "therapy_status in {ACTIVE, REVIEW_REQUIRED, DEESCALATED, CONVERTED}"
        to: "therapy_status == DISCONTINUED"
        trigger: "POST /stewardship/antibiotic-orders/{id}/discontinue"
        actor: AttendingPhysician | IDPharmacist
        preconditions:
          - "PatientCase.status == ADMITTED (ERR_PATIENT_DISCHARGED)"
        side_effects:
          - "stopped_at := clock"
          - "Open ConversionOpportunities for this order (status DETECTED) := EXPIRED"
          - "Open AuditInterventions (DOCUMENTED or RECOMMENDED) := SUPERSEDED"
      - from: "therapy_status == REVIEW_REQUIRED"
        to: "therapy_status == DISCONTINUED"
        trigger: "POST /stewardship/audit-interventions/{id}/respond with response=ACCEPTED and intervention_type == STOP"
        actor: AttendingPhysician
        preconditions:
          - "Linked intervention recommendation_status == RECOMMENDED (ERR_INTERVENTION_NOT_PENDING)"
        side_effects:
          - "AuditIntervention.recommendation_status := ACCEPTED"
          - "stopped_at := clock"
        note: "Accepting a STOP intervention closes the therapy, unlike other acceptances which return the order to ACTIVE"
      - from: "therapy_status == AWAITING_APPROVAL"
        to: "therapy_status == ACTIVE"
        trigger: "system (approval request APPROVED cascade)"
        actor: system
        preconditions:
          - "approval_status == APPROVED"
        side_effects:
          - "started_at := clock"
      - from: "therapy_status == AWAITING_APPROVAL"
        to: "therapy_status == DISCONTINUED"
        trigger: "system (approval request DENIED / EXPIRED / WITHDRAWN cascade)"
        actor: system
        preconditions:
          - "approval_status in {DENIED, EXPIRED, NOT_REQUIRED-via-withdraw}"
        side_effects:
          - "stopped_at := clock"
          - "Open AuditInterventions (DOCUMENTED or RECOMMENDED) := SUPERSEDED"
          - "Open ConversionOpportunities (DETECTED) := EXPIRED"

  - entity: AuditIntervention
    initial_state: DOCUMENTED
    terminal_states: [ACCEPTED, REJECTED_FINAL, SUPERSEDED]
    transitions:
      - from: DOCUMENTED
        to: RECOMMENDED
        trigger: "POST /stewardship/audit-interventions/{id}/issue"
        actor: IDPharmacist
        preconditions:
          - "Intervention status == DOCUMENTED (ERR_INTERVENTION_NOT_DRAFT)"
          - "Target order therapy_status in {ACTIVE, REVIEW_REQUIRED} (ERR_ORDER_NOT_AUDITABLE)"
          - "due_at recomputed := clock + 24h at issue time"
        side_effects:
          - "Target order therapy_status := REVIEW_REQUIRED (if ACTIVE)"
      - from: RECOMMENDED
        to: ACCEPTED
        trigger: "POST /stewardship/audit-interventions/{id}/respond with response=ACCEPTED"
        actor: AttendingPhysician
        preconditions:
          - "Intervention status == RECOMMENDED (ERR_INTERVENTION_NOT_PENDING)"
          - "Responder is the order's prescriber (ERR_NOT_PRESCRIBER)"
          - "clock <= due_at (ERR_INTERVENTION_OVERDUE)"
        side_effects:
          - "responded_by_id := acting practitioner id"
          - "Order transition per intervention_type (see AntibioticOrder machine)"
      - from: RECOMMENDED
        to: REJECTED
        trigger: "POST /stewardship/audit-interventions/{id}/respond with response=REJECTED"
        actor: AttendingPhysician
        preconditions:
          - "Intervention status == RECOMMENDED (ERR_INTERVENTION_NOT_PENDING)"
          - "Responder is the order's prescriber (ERR_NOT_PRESCRIBER)"
          - "clock <= due_at (ERR_INTERVENTION_OVERDUE)"
        side_effects:
          - "responded_by_id := acting practitioner id"
          - "Order therapy_status returns REVIEW_REQUIRED → stays (order remains auditable)"
      - from: REJECTED
        to: APPEALED
        trigger: "POST /stewardship/audit-interventions/{id}/appeal"
        actor: IDPharmacist
        preconditions:
          - "Intervention status == REJECTED (ERR_INTERVENTION_NOT_APPEALABLE)"
          - "Appealer == auditor_id (ERR_NOT_AUDIT_OWNER)"
        side_effects: []
      - from: APPEALED
        to: RECOMMENDED
        trigger: "POST /stewardship/audit-interventions/{id}/adjudicate with verdict=UPHOLD"
        actor: StewardshipDirector
        preconditions:
          - "Intervention status == APPEALED (ERR_INTERVENTION_NOT_APPEALED)"
          - "adjudicator != auditor_id and != responded_by_id (ERR_ADJUDICATOR_CONFLICT)"
        side_effects:
          - "appeal_adjudicator_id := acting practitioner id"
          - "due_at := clock + 24h (fresh response window; cyclic loop)"
        note: "Committee upholds the original recommendation; the prescriber must respond again — negotiation cycle"
      - from: APPEALED
        to: REJECTED_FINAL
        trigger: "POST /stewardship/audit-interventions/{id}/adjudicate with verdict=OVERTURN"
        actor: StewardshipDirector
        preconditions:
          - "Intervention status == APPEALED (ERR_INTERVENTION_NOT_APPEALED)"
          - "adjudicator != auditor_id and != responded_by_id (ERR_ADJUDICATOR_CONFLICT)"
        side_effects:
          - "appeal_adjudicator_id := acting practitioner id"
          - "Prescriber.unresolved_noncompliance_count += 1; stewardship_standing recomputed"
      - from: RECOMMENDED
        to: SUPERSEDED
        trigger: "system clock sweep when clock > due_at, or parent order discontinued"
        actor: system
        preconditions: []
        side_effects:
          - "No standing change for prescriber (non-response is not counted as noncompliance)"
      - from: DOCUMENTED
        to: SUPERSEDED
        trigger: "parent order discontinued (including via approval-expiry cascade) or patient discharged"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AllergyAssessment
    initial_state: SUSPECTED
    terminal_states: [DELABELED, WITHDRAWN]
    transitions:
      - from: SUSPECTED
        to: TESTING_SCHEDULED
        trigger: "POST /stewardship/allergy-assessments/{id}/schedule-test"
        actor: IDPharmacist
        preconditions:
          - "Assessment status == SUSPECTED or CONFIRMED (ERR_ALLERGY_NOT_SCHEDULABLE)"
          - "If reaction_severity == SEVERE: blocked entirely (ERR_SEVERE_ALLERGY_BLOCKED)"
          - "delabel_eligible must be true (risk_score < LOW_RISK_THRESHOLD) for SUSPECTED origin (ERR_ALLERGY_HIGH_RISK)"
        side_effects: []
      - from: TESTING_SCHEDULED
        to: TESTED
        trigger: "POST /stewardship/allergy-assessments/{id}/record-result"
        actor: IDPharmacist
        preconditions:
          - "Assessment status == TESTING_SCHEDULED (ERR_ALLERGY_NOT_TESTING)"
          - "test_result in {NEGATIVE, POSITIVE, INDETERMINATE} (ERR_INVALID_REQUEST)"
        side_effects:
          - "test_result recorded"
      - from: TESTED
        to: DELABELED
        trigger: "system (automatic on record-result when test_result == NEGATIVE)"
        actor: system
        preconditions:
          - "test_result == NEGATIVE"
        side_effects:
          - "Patient penicillin allergy considered removed; orders gated on allergy (see validations) no longer blocked"
      - from: TESTED
        to: CONFIRMED
        trigger: "system (automatic on record-result when test_result == POSITIVE)"
        actor: system
        preconditions:
          - "test_result == POSITIVE"
        side_effects: []
      - from: TESTED
        to: TESTING_SCHEDULED
        trigger: "system (automatic on record-result when test_result == INDETERMINATE)"
        actor: system
        preconditions:
          - "test_result == INDETERMINATE"
        side_effects: []
        note: "Indeterminate results loop back to scheduling — cyclic shape"
      - from: CONFIRMED
        to: TESTING_SCHEDULED
        trigger: "POST /stewardship/allergy-assessments/{id}/schedule-test (rechallenge after >= 5 years since last test)"
        actor: StewardshipDirector
        preconditions:
          - "Assessment status == CONFIRMED (ERR_ALLERGY_NOT_SCHEDULABLE)"
          - "years_since_reaction >= 5 at scheduling time (ERR_RECHALLENGE_TOO_EARLY)"
        side_effects: []
      - from: "SUSPECTED | TESTING_SCHEDULED | CONFIRMED"
        to: WITHDRAWN
        trigger: "POST /stewardship/allergy-assessments/{id}/withdraw"
        actor: IDPharmacist | StewardshipDirector
        preconditions:
          - "Assessment not already DELABELED or WITHDRAWN (ERR_ALLERGY_TERMINAL)"
        side_effects: []

  - entity: Antibiogram
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /stewardship/antibiograms/{id}/publish"
        actor: Microbiologist | StewardshipDirector
        preconditions:
          - "Antibiogram status == DRAFT (ERR_ANTIBIOGRAM_NOT_DRAFT)"
          - "row_count > 0 (ERR_ANTIBIOGRAM_EMPTY)"
        side_effects:
          - "Any other PUBLISHED antibiogram for same hospital := SUPERSEDED (only one published posture at a time)"
          - "Every ADOPTED EmpiricGuideline of the hospital: re-evaluate staleness — if the guideline's first-line drug pct_susceptible for its syndrome organism in THIS antibiogram < pct_susceptible_at_adoption - STALENESS_DROP_POINTS (10), guideline := STALE"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (automatic when a newer antibiogram for the same hospital publishes)"
        actor: system
        preconditions: []
        side_effects:
          - "EmpiricGuideline.source_antibiogram_id references remain pinned (historical integrity)"

  - entity: EmpiricGuideline
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /stewardship/empiric-guidelines/{id}/adopt"
        actor: StewardshipDirector
        preconditions:
          - "Guideline status == DRAFT (ERR_GUIDELINE_NOT_DRAFT)"
          - "source_antibiogram.status == PUBLISHED (ERR_ANTIBIOGRAM_NOT_PUBLISHED)"
          - "first-line drug's AntibiogramRow for the syndrome-mapped organism in the source antibiogram has is_reportable == true and pct_susceptible >= ADOPTION_MIN_PCT (70) (ERR_FIRST_LINE_BELOW_THRESHOLD)"
          - "OCC: expected_hospital_version matches Hospital.version (ERR_STALE_VERSION) — adopting mutates hospital-scoped posture"
        side_effects:
          - "Previous ADOPTED guideline with same (hospital_id, syndrome) := RETIRED"
          - "pct_susceptible_at_adoption snapshot recorded"
          - "increments Hospital.version by 1"
      - from: ADOPTED
        to: STALE
        trigger: "system (automatic on antibiogram publish when susceptibility dropped >= 10 points below adoption snapshot)"
        actor: system
        preconditions: []
        side_effects:
          - "EMPIRIC AntibioticOrders created after staleness referencing this syndrome carry a non-blocking advisory note in their record (advisory only; no error is raised)"
      - from: ADOPTED
        to: RETIRED
        trigger: "system (automatic when a successor guideline for the same syndrome is ADOPTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: STALE
        to: RETIRED
        trigger: "POST /stewardship/empiric-guidelines/{id}/retire"
        actor: StewardshipDirector
        preconditions:
          - "Guideline status == STALE (ERR_GUIDELINE_NOT_STALE)"
        side_effects: []
      - from: DRAFT
        to: RETIRED
        trigger: "POST /stewardship/empiric-guidelines/{id}/retire"
        actor: StewardshipDirector
        preconditions:
          - "Guideline status == DRAFT (ERR_GUIDELINE_NOT_RETIRABLE)"
        side_effects: []

  - entity: DOTMetricSnapshot
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /stewardship/dot-snapshots/{id}/finalize"
        actor: InfectionPreventionist | StewardshipDirector
        preconditions:
          - "Snapshot status == OPEN (ERR_SNAPSHOT_NOT_OPEN)"
          - "period_label month is strictly before the month of the hospital clock (ERR_PERIOD_NOT_CLOSED)"
        side_effects:
          - "All DOT totals recomputed one final time and frozen"
      - from: FINALIZED
        to: OPEN
        trigger: "POST /stewardship/dot-snapshots/{id}/reopen"
        actor: StewardshipDirector
        preconditions:
          - "Snapshot status == FINALIZED (ERR_SNAPSHOT_NOT_FINALIZED)"
          - "No RegulatoryReport in SUBMITTED or ACCEPTED status pins this snapshot (ERR_SNAPSHOT_PINNED_BY_REPORT)"
        side_effects: []

  - entity: RegulatoryReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /stewardship/regulatory-reports/{id}/submit"
        actor: InfectionPreventionist
        preconditions:
          - "Report status == DRAFT (ERR_REPORT_NOT_DRAFT)"
          - "Pinned DOTMetricSnapshot.status == FINALIZED (ERR_SNAPSHOT_NOT_FINAL)"
          - "No other SUBMITTED/ACCEPTED report exists for same (hospital_id, report_type, period_label) (ERR_REPORT_ALREADY_SUBMITTED)"
        side_effects:
          - "payload_json assembled deterministically from pinned snapshot; checksum computed"
          - "submitted_at := clock"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /stewardship/regulatory-reports/{id}/acknowledge with ack=ACCEPTED"
        actor: StewardshipDirector
        preconditions:
          - "Report status == SUBMITTED (ERR_REPORT_NOT_SUBMITTED)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /stewardship/regulatory-reports/{id}/acknowledge with ack=REJECTED"
        actor: StewardshipDirector
        preconditions:
          - "Report status == SUBMITTED (ERR_REPORT_NOT_SUBMITTED)"
        side_effects: []
        note: "Correction path: create a NEW report referencing the same snapshot and resubmit — prior REJECTED report is retained for audit"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: guideline-adopt-stale-hospital
    parent_entity: Hospital
    write_endpoint: "POST /stewardship/empiric-guidelines/{id}/adopt"
    occ_field: "expected_hospital_version"
    description: |
      Adopting an EmpiricGuideline against a Hospital whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another committee member has just adopted a guideline
      (which legitimately retires the prior ADOPTED guideline for that
      syndrome) and the current writer's view of hospital posture is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: antibiogram-publish-stale-hospital
    parent_entity: Hospital
    write_endpoint: "POST /stewardship/antibiograms/{id}/publish"
    occ_field: "expected_hospital_version"
    description: |
      Publishing an Antibiogram against a Hospital whose version has
      advanced since the client last observed it is rejected. Publishing
      supersedes the hospital's currently PUBLISHED antibiogram and
      re-evaluates every ADOPTED guideline's staleness; a stale view of
      the hospital posture would publish against an obsolete baseline.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: days_of_therapy
    trigger: "POST .../administrations; order completion/discontinuation; snapshot finalize"
    algorithm: aggregation
    formula: |
      Per order:
        dot_calendar = count of DISTINCT calendar dates (UTC) with >= 1 administration
                       event between started_at and min(stopped_at, snapshot period end)
        dot_dose     = administered_doses / frequency_per_day   (2dp, round_half_up)
      Per snapshot:
        total_dot_calendar = sum of dot_calendar slices attributable to the snapshot month
        total_dot_dose     = sum of dot_dose slices attributable to the snapshot month (2dp)
      Slice attribution: a calendar date belongs to the month containing its UTC date.
      Administration events on the same calendar date for the same drug count once
      toward dot_calendar but count fully toward administered_doses.
    input_set: "AntibioticOrders with therapy_status in {ACTIVE, REVIEW_REQUIRED, DEESCALATED, CONVERTED, COMPLETED, DISCONTINUED} whose [started_at, stopped_at or clock) intersects the snapshot month; AWAITING_APPROVAL orders excluded (no doses possible)"
    precision: "dot_calendar integer; dot_dose 2 decimal places, round_half_up"
    variants:
      - name: calendar_day_basis
        when: "CDC-standard DOT: any dose on a calendar day = 1 DOT regardless of dose count"
        difference: "dot_per_1000_pd_calendar uses total_dot_calendar; two same-day doses on a 3-day course give 3 DOT"
      - name: administered_dose_basis
        when: "Dose-normalized DOT used for pediatric/renal-adjusted benchmarking"
        difference: "dot_per_1000_pd_dose uses total_dot_dose; two same-day doses on a 3-day BID course give 3.00 DOT only if frequency_per_day == 2 — a QID drug yields 1.50 DOT for the same events, so the variants diverge"

  - name: dot_benchmark_percentile
    trigger: "snapshot finalize; snapshot recompute"
    algorithm: threshold
    formula: |
      benchmark_percentile = largest P in BENCHMARK_TABLE such that
                             dot_per_1000_pd_calendar >= BENCHMARK_TABLE[P].floor
      where BENCHMARK_TABLE (per 1000 patient-days, calendar basis):
        P10 floor 0, P25 floor 350, P50 floor 480, P75 floor 620, P90 floor 780
      Boundary: floors are inclusive (>=). Exactly 780 -> P90, 779.99 -> P75.
    input_set: "the snapshot's own dot_per_1000_pd_calendar"
    constants:
      P25_FLOOR: 350
      P50_FLOOR: 480
      P75_FLOOR: 620
      P90_FLOOR: 780
    precision: "percentile is an integer from {10, 25, 50, 75, 90}; values below 350 -> 10"

  - name: iv_to_po_eligibility_score
    trigger: "POST /stewardship/conversion-opportunities/detect (kind=IV_TO_PO)"
    algorithm: weighted_scoring
    formula: |
      Eligible only if ALL hard gates pass:
        G1: order.route == IV
        G2: antimicrobial.has_po_form == true
        G3: order.cumulative_iv_hours >= hospital.iv_to_po_min_iv_hours   (inclusive)
        G4: patient.has_enteral_access == true
        G5: patient.is_immunocompromised == false OR cumulative_iv_hours >= 2 * min_iv_hours
      Score (only computed when all gates pass):
        score = W_STABILITY * hemodynamic_term
              + W_RENAL     * renal_term
              + W_DURATION  * duration_term
        hemodynamic_term = 40 (stable — proxy constant for this scaffold)
        renal_term     = min(patient.renal_function_crcl, 90)            (cap at 90)
        duration_term  = max(0, 30 - 5 * floor((cumulative_iv_hours - min_iv_hours) / 24))
                         (decays 5 points per 24h beyond the minimum; floor 0)
        score = round_half_up(score_raw, 2)
      Opportunity created when score >= CONVERSION_MIN_SCORE (60). Below -> ERR_CONVERSION_NOT_ELIGIBLE.
    input_set: "single candidate order + its patient + its antimicrobial + hospital config"
    constants:
      W_STABILITY: 1.0
      W_RENAL: 0.4
      W_DURATION: 1.0
      CONVERSION_MIN_SCORE: 60
      HEMODYNAMIC_STABLE_TERM: 40
    precision: "2 decimal places, round_half_up"
    note: "Mode (a) combinatorial: 5 hard gates + 3 non-linear terms (min cap, floor-decay, conditional immunocompromised gate)"

  - name: deescalation_priority_score
    trigger: "POST /stewardship/conversion-opportunities/detect (kind=DEESCALATION)"
    algorithm: weighted_scoring
    formula: |
      Hard gates:
        G1: a FINAL CultureReport exists for the same patient (same patient_case_id)
        G2: that culture has a SusceptibilityResult with interpretation == S for suggested_antimicrobial_id
        G3: suggested drug's drug_class breadth rank < current drug's breadth rank
            (narrower): rank table CLASS_BREADTH_RANK below
        G4: order.indication == EMPIRIC or CULTURE_DIRECTED
      Score:
        base = 50
        + 25 if culture is_first_isolate == true
        + 15 if order.dot_calendar >= hospital.dot_review_threshold
        - 20 if patient.is_immunocompromised == true
        + breadth_delta_term = 10 * (CLASS_BREADTH_RANK[current] - CLASS_BREADTH_RANK[suggested])
      Evaluation order (circular-looking dependency pinned):
        1. compute breadth ranks from CLASS_BREADTH_RANK table (static constants)
        2. compute dot_calendar as of clock (days_of_therapy, calendar basis)
        3. compute score; create opportunity when score >= DEESCALATION_MIN_SCORE (65)
      The order's REVIEW_REQUIRED flag depends on dot_calendar which itself can be
      changed by accepting the opportunity — so detection MUST snapshot dot_calendar
      at step 2 before any side effects; no recomputation during this request.
    input_set: "single candidate order + newest FINAL culture for the patient (selector: max resulted_at; tie-break: latest collected_at; then created_at) + susceptibility rows"
    constants:
      DEESCALATION_MIN_SCORE: 65
      CLASS_BREADTH_RANK: "{CARBAPENEM: 90, GLYCOPEPTIDE: 70, FLUOROQUINOLONE: 60, EXTENDED_SPECTRUM_PENICILLIN: 50, CEPHALOSPORIN: 40, NARROW_PENICILLIN: 20, MACROLIDE: 30, AMINOGLYCOSIDE: 45}"
    precision: "integer score"

  - name: penicillin_allergy_risk_score
    trigger: "AllergyAssessment create; recompute on PATCH of intake fields"
    algorithm: weighted_scoring
    formula: |
      risk = base_by_severity
           + reaction_term
           + recency_term
           + comorbidity_term
      base_by_severity: MILD -> 10, MODERATE -> 35, SEVERE -> 80
      reaction_term:  +20 if reported_reaction contains anaphylaxis keyword set
                      ({"anaphylaxis","angioedema","hives","wheeze"}; case-insensitive substring),
                      else 0
      recency_term:   max(0, 30 - 3 * years_since_reaction)   (decays 3/yr; 0 at >= 10 years)
      comorbidity_term: +10 if patient.is_immunocompromised else 0
      risk_score = round_half_up(min(risk, 100), 2)
      delabel_eligible = (risk_score < LOW_RISK_THRESHOLD) AND (reaction_severity != SEVERE)
    input_set: "assessment intake fields + patient flags"
    constants:
      LOW_RISK_THRESHOLD: 30
      ANAPHYLAXIS_KEYWORDS: "{anaphylaxis, angioedema, hives, wheeze}"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: intake_estimate
        when: "computed at creation from self-reported intake only"
        difference: "uses reported fields as-is; recency_term may shift by up to 3 points if intake years_since_reaction is later corrected"
      - name: verified_baseline
        when: "recomputed when schedule-test is invoked"
        difference: "same formula but recency_term uses effective_years = years_since_reaction + full elapsed years between assessment created_at and the logical clock at schedule time — an intake value that has aged produces a different score than the stored intake value"

  - name: antibiogram_susceptibility_rate
    trigger: "antibiogram generation (POST /stewardship/antibiograms); regenerate"
    algorithm: aggregation
    formula: |
      For each (organism, antimicrobial_id) pair observed in window:
        isolate_count      = count of qualifying cultures (below)
        susceptible_count  = count among those whose SusceptibilityResult for the
                             drug has interpretation == 'S'
      Qualifying cultures: CultureReports with hospital scope, status in {FINAL, AMENDED},
        is_first_isolate == true, collected_at in [period_start, period_end) (start
        inclusive, end exclusive — adjacent periods share no isolate).
      Rounding order (PINNED — round-per-row then aggregate, NOT aggregate-then-round):
        1. pct_susceptible[row] = round_half_up(100.0 * susceptible_count / isolate_count, 2)
        2. is_reportable[row]   = (isolate_count >= hospital.antibiogram_min_isolates)
        3. row_count = count of rows with is_reportable == true
      The reverse order (pool numerators/denominators across drugs then round) yields
      different 2dp values and is FORBIDDEN.
    input_set: "first-isolate FINAL/AMENDED culture reports in the half-open window"
    precision: "2 decimal places per row, round_half_up"

  - name: selector_culture_driven_recommendation
    trigger: "POST /stewardship/culture-reports/{id}/recommend"
    algorithm: selector_policy
    formula: |
      Recommend the empiric EMPIRIC order's replacement drug when culture finalizes:
      Candidate pool: SusceptibilityResults on THIS culture with interpretation == 'S'
        AND antimicrobial.formulary_status == 'ACTIVE'
        AND antimicrobial.has adequate spectrum for specimen_source (SPECIMEN_EXCLUSIONS:
        drugs with drug_class == 'MACROLIDE' excluded when specimen_source == 'CSF')
      Ranking: (1) lowest CLASS_BREADTH_RANK (narrowest first)
               (2) tie-break: has_po_form == true preferred
               (3) tie-break: lower mic_value
               (4) final tie-break: Antimicrobial.created_at ASC  (never id)
      Empty pool fallback: no recommendation; respond 200 with recommended_antimicrobial_id = null
        and empty-pool marker (NOT an error).
      If the patient has a penicillin AllergyAssessment in {SUSPECTED, TESTING_SCHEDULED,
      TESTED, CONFIRMED} and candidate drug is_penicillin_class: EXCLUDE the candidate
      unless assessment.status == DELABELED.
    input_set: "susceptibility rows of the culture + formulary + allergy posture"
    precision: "n/a (selection)"
    note: "Selector determinism: eligibility filter, ranking expression, three-level tie-break, empty-pool fallback all pinned"

  - name: regulatory_payload_assembly
    trigger: "regulatory report submit"
    algorithm: projection
    formula: |
      payload_json = canonical JSON (keys sorted, no whitespace) of:
        { nhsn_facility_id, report_type, period_label,
          dot_per_1000_pd_calendar, dot_per_1000_pd_dose,
          total_dot_calendar, total_dot_dose, patient_days,
          benchmark_percentile }
      All values taken from the PINNED DOTMetricSnapshot at submit time — later
      recomputation of the snapshot (after reopen) MUST NOT mutate a submitted payload.
      checksum = FNV-1a-32 of payload_json, 8-char lowercase hex.
      Determinism: same snapshot + same report header -> byte-identical payload_json.
    input_set: "pinned snapshot + report header fields"
    precision: "numeric fields serialized with exactly 2 decimal places for dot_per_1000 values, integers for totals"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority) (§1.4)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (hospital segment before child segment)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Referenced Practitioner (prescriber/auditor/decider) has is_active == true"
    error_id: ERR_PRACTITIONER_INACTIVE
    http_status: 409
    applies_to: "all endpoints with practitioner FK input"

  - priority: 5
    category: state
    check: "Referenced PatientCase.status == ADMITTED for any order/culture/assessment mutation"
    error_id: ERR_PATIENT_DISCHARGED
    http_status: 409
    applies_to: "order/culture/assessment mutation endpoints"

  - priority: 6
    category: state
    check: "Referenced Antimicrobial.formulary_status == ACTIVE for new orders and recommendations"
    error_id: ERR_DRUG_SUSPENDED
    http_status: 409
    applies_to: "POST /stewardship/antibiotic-orders, selector_culture_driven_recommendation"

  - priority: 7
    category: business_safety
    check: "Penicillin-class drug order blocked when patient has an allergy assessment in {SUSPECTED, TESTING_SCHEDULED, TESTED, CONFIRMED} (DELABELED clears; WITHDRAWN clears)"
    error_id: ERR_ALLERGY_BLOCKS_ORDER
    http_status: 422
    applies_to: "POST /stewardship/antibiotic-orders"

  - priority: 8
    category: business_safety
    check: "Renal guardrail: dose_mg * frequency_per_day <= 4000 when patient.renal_function_crcl < 30"
    error_id: ERR_RENAL_DOSE_EXCEEDED
    http_status: 422
    applies_to: "POST /stewardship/antibiotic-orders"

  - priority: 9
    category: business_safety
    check: "SEVERE allergy assessments may never schedule a test"
    error_id: ERR_SEVERE_ALLERGY_BLOCKED
    http_status: 422
    applies_to: "POST /stewardship/allergy-assessments/{id}/schedule-test"

  - priority: 10
    category: business_safety
    check: "Approval decider != requester (segregation of duties)"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 422
    applies_to: "POST /stewardship/approval-requests/{id}/decide"

  - priority: 11
    category: business_safety
    check: "Appeal adjudicator != auditor and != original responder (segregation of duties)"
    error_id: ERR_ADJUDICATOR_CONFLICT
    http_status: 422
    applies_to: "POST /stewardship/audit-interventions/{id}/adjudicate"

  - priority: 12
    category: business_temporal
    check: "Culture collected_at <= current hospital clock"
    error_id: ERR_FUTURE_SPECIMEN
    http_status: 422
    applies_to: "POST /stewardship/culture-reports"

  - priority: 13
    category: business_temporal
    check: "Audit intervention response before due_at"
    error_id: ERR_INTERVENTION_OVERDUE
    http_status: 422
    applies_to: "POST /stewardship/audit-interventions/{id}/respond"

  - priority: 14
    category: business_temporal
    check: "Antibiogram period_end > period_start"
    error_id: ERR_INVALID_PERIOD
    http_status: 422
    applies_to: "POST /stewardship/antibiograms"

  - priority: 15
    category: business_temporal
    check: "Antibiogram windows for the same hospital must not overlap: half-open [period_start, period_end) — touching endpoints are allowed"
    error_id: ERR_ANTIBIOGRAM_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /stewardship/antibiograms"

  - priority: 16
    category: business_temporal
    check: "Allergy rechallenge from CONFIRMED requires years_since_reaction >= 5"
    error_id: ERR_RECHALLENGE_TOO_EARLY
    http_status: 422
    applies_to: "POST /stewardship/allergy-assessments/{id}/schedule-test"

  - priority: 17
    category: business_temporal
    check: "Snapshot period_label month strictly before the month of the hospital clock on finalize"
    error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 422
    applies_to: "POST /stewardship/dot-snapshots/{id}/finalize"

  - priority: 18
    category: business_referential
    check: "SusceptibilityResult.antimicrobial_id must belong to same hospital as the parent culture's patient"
    error_id: ERR_CROSS_FACILITY_REFERENCE
    http_status: 422
    applies_to: "POST /stewardship/culture-reports/{id}/susceptibility-results"

  - priority: 19
    category: business_referential
    check: "Order antimicrobial/patient/prescriber must all belong to the same hospital"
    error_id: ERR_CROSS_FACILITY_REFERENCE
    http_status: 422
    applies_to: "POST /stewardship/antibiotic-orders"

  - priority: 20
    category: business_referential
    check: "ApprovalRequest.antibiotic_order_id must reference an order with approval_status == PENDING"
    error_id: ERR_ORDER_APPROVAL_NOT_PENDING
    http_status: 409
    applies_to: "POST /stewardship/approval-requests, POST /stewardship/approval-requests/{id}/decide"

  - priority: 21
    category: business_referential
    check: "Guideline.source_antibiogram must be PUBLISHED at adoption and belong to same hospital"
    error_id: ERR_ANTIBIOGRAM_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /stewardship/empiric-guidelines/{id}/adopt"

  - priority: 22
    category: business_referential
    check: "Guideline.supersedes_guideline_id, when provided, must reference an ADOPTED or STALE guideline of same hospital and syndrome; self-reference forbidden"
    error_id: ERR_INVALID_SUPERSESSION
    http_status: 422
    applies_to: "POST /stewardship/empiric-guidelines"

  - priority: 23
    category: business_referential
    check: "RegulatoryReport.dot_snapshot_id must reference a FINALIZED snapshot of the same hospital and matching period_label"
    error_id: ERR_SNAPSHOT_NOT_FINAL
    http_status: 409
    applies_to: "POST /stewardship/regulatory-reports, POST /stewardship/regulatory-reports/{id}/submit"

  - priority: 24
    category: business_constraint
    check: "Restricted antimicrobial order requires justification via an ApprovalRequest before first administration"
    error_id: ERR_RESTRICTED_REQUIRES_APPROVAL
    http_status: 422
    applies_to: "POST /stewardship/antibiotic-orders/{id}/administrations"

  - priority: 25
    category: business_constraint
    check: "Duplicate active order: same patient + same antimicrobial with therapy_status not in {COMPLETED, DISCONTINUED}"
    error_id: ERR_DUPLICATE_ACTIVE_ORDER
    http_status: 409
    applies_to: "POST /stewardship/antibiotic-orders"

  - priority: 26
    category: business_constraint
    check: "Per-patient concurrent restricted orders capped at 2 (orders with approval_status in {PENDING, APPROVED} and therapy_status not terminal)"
    error_id: ERR_RESTRICTED_ORDER_CAP
    http_status: 409
    applies_to: "POST /stewardship/antibiotic-orders"

  - priority: 27
    category: business_constraint
    check: "AntibiogramRow uniqueness per (antibiogram_id, organism, antimicrobial_id)"
    error_id: ERR_DUPLICATE_ROW
    http_status: 409
    applies_to: "antibiogram generation (system), POST /stewardship/antibiogram-rows"

  - priority: 28
    category: business_constraint
    check: "Only one SUBMITTED/ESCALATED approval request per order at a time"
    error_id: ERR_APPROVAL_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /stewardship/approval-requests"

  - priority: 29
    category: business_constraint
    check: "DOTMetricSnapshot period_label unique per hospital"
    error_id: ERR_DUPLICATE_SNAPSHOT_PERIOD
    http_status: 409
    applies_to: "POST /stewardship/dot-snapshots"

  - priority: 30
    category: business_constraint
    check: "RegulatoryReport uniqueness: one SUBMITTED/ACCEPTED per (hospital, report_type, period_label)"
    error_id: ERR_REPORT_ALREADY_SUBMITTED
    http_status: 409
    applies_to: "POST /stewardship/regulatory-reports/{id}/submit"

  - priority: 31
    category: business_fiscal
    check: "Guideline first-line drug susceptibility >= ADOPTION_MIN_PCT (70) and row reportable"
    error_id: ERR_FIRST_LINE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /stewardship/empiric-guidelines/{id}/adopt"

  - priority: 32
    category: business_fiscal
    check: "Stewardship suspension: prescriber with stewardship_standing == SUSPENDED may not create restricted-drug orders"
    error_id: ERR_PRESCRIBER_SUSPENDED
    http_status: 403
    applies_to: "POST /stewardship/antibiotic-orders (restricted drugs only)"

  - priority: 33
    category: business_constraint
    check: "De-escalation detection: all hard gates pass (FINAL culture with S for suggested drug, narrower breadth rank, eligible indication) and score >= DEESCALATION_MIN_SCORE"
    error_id: ERR_DEESCALATION_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /stewardship/conversion-opportunities/detect (kind=DEESCALATION)"

  - priority: 34
    category: business_constraint
    check: "IV-to-PO detection: all hard gates G1-G5 pass (IV route, oral form exists, cumulative IV hours >= minimum, enteral access, immunocompromised rule) and score >= CONVERSION_MIN_SCORE"
    error_id: ERR_CONVERSION_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /stewardship/conversion-opportunities/detect (kind=IV_TO_PO)"

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/stewardship/_clock/set_current_utc"
    description: "Advance the hospital logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Sweep fires: approval auto-expiry, intervention SUPERSEDED sweep, opportunity EXPIRED sweep, REVIEW_REQUIRED flagging."
    roles: [StewardshipDirector, StewardshipAdmin]
    code: 200
    input: [hospital_id, to_iso8601]
    output: Hospital
    side_effects:
      - "Hospital.current_utc := to_iso8601 (must be > current value; ERR_CLOCK_REGRESSION otherwise)"
      - "Sweep: SUBMITTED approval requests past auto-expire window -> EXPIRED (+ order cascade)"
      - "Sweep: RECOMMENDED interventions past due_at -> SUPERSEDED"
      - "Sweep: DETECTED opportunities older than 48h -> EXPIRED"
      - "Sweep: ACTIVE orders with dot_calendar >= dot_review_threshold -> REVIEW_REQUIRED"

  # --- Hospitals ---
  - method: POST
    path: "/stewardship/hospitals"
    description: "Create a hospital (stewardship program scope)"
    roles: [StewardshipAdmin]
    code: 201
    input: [name, nhsn_facility_id, "dot_review_threshold?", "iv_to_po_min_iv_hours?", "antibiogram_min_isolates?", "restricted_auto_expire_hours?"]
    output: Hospital
    side_effects: ["current_utc initialized to 2026-08-01T00:00:00Z"]

  - method: GET
    path: "/stewardship/hospitals/{id}"
    description: "Get a hospital"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: Hospital
    side_effects: []

  - method: GET
    path: "/stewardship/hospitals"
    description: "List hospitals"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: ["limit?", "offset?"]
    output: "Hospital[]"
    side_effects: []

  # --- Practitioners ---
  - method: POST
    path: "/stewardship/practitioners"
    description: "Register a practitioner"
    roles: [StewardshipAdmin]
    code: 201
    input: [hospital_id, full_name, license_no, discipline, "is_stewardship_member?"]
    output: Practitioner
    side_effects: ["stewardship_standing := GOOD; unresolved_noncompliance_count := 0"]

  - method: GET
    path: "/stewardship/practitioners/{id}"
    description: "Get a practitioner"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: Practitioner
    side_effects: []

  - method: GET
    path: "/stewardship/practitioners"
    description: "List practitioners (filterable by hospital_id, discipline)"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: ["hospital_id?", "discipline?", "limit?", "offset?"]
    output: "Practitioner[]"
    side_effects: []

  - method: PATCH
    path: "/stewardship/practitioners/{id}"
    description: "Update practitioner (deactivation, committee membership)"
    roles: [StewardshipAdmin]
    code: 200
    input: ["is_active?", "is_stewardship_member?"]
    output: Practitioner
    side_effects: ["increments version"]

  # --- Patient cases ---
  - method: POST
    path: "/stewardship/patient-cases"
    description: "Admit a patient case"
    roles: [AttendingPhysician, IDPharmacist, StewardshipAdmin]
    code: 201
    input: [hospital_id, mrn, admitted_at, ward, weight_kg, renal_function_crcl, "is_immunocompromised?", "has_enteral_access?"]
    output: PatientCase
    side_effects: []

  - method: GET
    path: "/stewardship/patient-cases/{id}"
    description: "Get a patient case"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: PatientCase
    side_effects: []

  - method: GET
    path: "/stewardship/patient-cases"
    description: "List patient cases (filterable by hospital_id, status)"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: ["hospital_id?", "status?", "limit?", "offset?"]
    output: "PatientCase[]"
    side_effects: []

  - method: POST
    path: "/stewardship/patient-cases/{id}/discharge"
    description: "Discharge a patient (locks open orders/interventions)"
    roles: [AttendingPhysician]
    code: 200
    input: []
    output: PatientCase
    side_effects:
      - "status := DISCHARGED"
      - "All non-terminal orders -> COMPLETED with stopped_at := clock"
      - "RECOMMENDED/DOCUMENTED interventions -> SUPERSEDED"

  # --- Antimicrobials (formulary) ---
  - method: POST
    path: "/stewardship/antimicrobials"
    description: "Add a drug to the formulary"
    roles: [StewardshipAdmin, IDPharmacist]
    code: 201
    input: [hospital_id, drug_name, drug_class, is_restricted, has_po_form, "is_penicillin_class?"]
    output: Antimicrobial
    side_effects: []

  - method: GET
    path: "/stewardship/antimicrobials/{id}"
    description: "Get a drug"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: Antimicrobial
    side_effects: []

  - method: GET
    path: "/stewardship/antimicrobials"
    description: "List formulary (filterable by hospital_id, is_restricted, drug_class)"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: ["hospital_id?", "is_restricted?", "drug_class?", "limit?", "offset?"]
    output: "Antimicrobial[]"
    side_effects: []

  - method: PATCH
    path: "/stewardship/antimicrobials/{id}"
    description: "Update formulary status (suspend/reactivate)"
    roles: [StewardshipAdmin, IDPharmacist]
    code: 200
    input: ["formulary_status?"]
    output: Antimicrobial
    side_effects: []

  # --- Allergy assessments ---
  - method: POST
    path: "/stewardship/allergy-assessments"
    description: "Open a penicillin allergy assessment"
    roles: [IDPharmacist, AttendingPhysician]
    code: 201
    input: [patient_case_id, reported_reaction, reaction_severity, years_since_reaction]
    output: AllergyAssessment
    side_effects: ["risk_score computed; delabel_eligible computed; status := SUSPECTED"]

  - method: GET
    path: "/stewardship/allergy-assessments/{id}"
    description: "Get an allergy assessment"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: AllergyAssessment
    side_effects: []

  - method: GET
    path: "/stewardship/allergy-assessments"
    description: "List allergy assessments (filterable by patient_case_id, status)"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: ["patient_case_id?", "status?", "limit?", "offset?"]
    output: "AllergyAssessment[]"
    side_effects: []

  - method: POST
    path: "/stewardship/allergy-assessments/{id}/schedule-test"
    description: "Schedule a penicillin skin test / challenge"
    roles: [IDPharmacist, StewardshipDirector]
    code: 200
    input: []
    output: AllergyAssessment
    side_effects: ["status := TESTING_SCHEDULED; verified_baseline risk recompute"]

  - method: POST
    path: "/stewardship/allergy-assessments/{id}/record-result"
    description: "Record test outcome (auto-transitions to DELABELED/CONFIRMED/TESTING_SCHEDULED)"
    roles: [IDPharmacist]
    code: 200
    input: [test_result]
    output: AllergyAssessment
    side_effects: ["status := per test_result (NEGATIVE -> DELABELED, POSITIVE -> CONFIRMED, INDETERMINATE -> TESTING_SCHEDULED)"]

  - method: POST
    path: "/stewardship/allergy-assessments/{id}/withdraw"
    description: "Withdraw an assessment"
    roles: [IDPharmacist, StewardshipDirector]
    code: 200
    input: []
    output: AllergyAssessment
    side_effects: ["status := WITHDRAWN"]

  # --- Culture reports & susceptibility ---
  - method: POST
    path: "/stewardship/culture-reports"
    description: "Register a culture report (starts PRELIMINARY)"
    roles: [Microbiologist]
    code: 201
    input: [patient_case_id, specimen_source, collected_at, organism]
    output: CultureReport
    side_effects: ["is_first_isolate computed against prior same-patient (organism, specimen_source) cultures in 365-day lookback"]

  - method: GET
    path: "/stewardship/culture-reports/{id}"
    description: "Get a culture report"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: CultureReport
    side_effects: []

  - method: GET
    path: "/stewardship/culture-reports"
    description: "List culture reports (filterable by patient_case_id, status, organism)"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: ["patient_case_id?", "status?", "organism?", "limit?", "offset?"]
    output: "CultureReport[]"
    side_effects: []

  - method: POST
    path: "/stewardship/culture-reports/{id}/finalize"
    description: "Finalize a culture report"
    roles: [Microbiologist]
    code: 200
    input: []
    output: CultureReport
    side_effects: ["status := FINAL; resulted_at := clock"]

  - method: POST
    path: "/stewardship/culture-reports/{id}/susceptibility-results"
    description: "Add a susceptibility row to a culture"
    roles: [Microbiologist]
    code: 201
    input: [antimicrobial_id, interpretation, mic_value]
    output: SusceptibilityResult
    side_effects: []

  - method: GET
    path: "/stewardship/culture-reports/{id}/susceptibility-results"
    description: "List susceptibility rows of a culture"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: "SusceptibilityResult[]"
    side_effects: []

  - method: GET
    path: "/stewardship/susceptibility-results"
    description: "List susceptibility results across cultures (filterable by culture_report_id, antimicrobial_id, interpretation)"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: ["culture_report_id?", "antimicrobial_id?", "interpretation?", "limit?", "offset?"]
    output: "SusceptibilityResult[]"
    side_effects: []

  - method: GET
    path: "/stewardship/susceptibility-results/{id}"
    description: "Get a single susceptibility result"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: SusceptibilityResult
    side_effects: []

  - method: POST
    path: "/stewardship/culture-reports/{id}/recommend"
    description: "Run culture-driven recommendation selector (selector_culture_driven_recommendation)"
    roles: [IDPharmacist, AttendingPhysician, StewardshipDirector]
    code: 200
    input: []
    output: "{ recommended_antimicrobial_id: string|null, pool_size: integer, reason: string }"
    side_effects: []

  # --- Antibiotic orders ---
  - method: POST
    path: "/stewardship/antibiotic-orders"
    description: "Place an antibiotic order"
    roles: [AttendingPhysician]
    code: 201
    input: [patient_case_id, antimicrobial_id, prescriber_id, route, dose_mg, frequency_per_day, indication]
    output: AntibioticOrder
    side_effects:
      - "Restricted drug: approval_status := PENDING, therapy_status := AWAITING_APPROVAL"
      - "Unrestricted drug: approval_status := NOT_REQUIRED, therapy_status := ACTIVE, started_at := clock"

  - method: GET
    path: "/stewardship/antibiotic-orders/{id}"
    description: "Get an order"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: AntibioticOrder
    side_effects: []

  - method: GET
    path: "/stewardship/antibiotic-orders"
    description: "List orders (filterable by patient_case_id, antimicrobial_id, prescriber_id, therapy_status, approval_status)"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: ["patient_case_id?", "antimicrobial_id?", "prescriber_id?", "therapy_status?", "approval_status?", "limit?", "offset?"]
    output: "AntibioticOrder[]"
    side_effects: []

  - method: POST
    path: "/stewardship/antibiotic-orders/{id}/administrations"
    description: "Record an administered dose (advances DOT and cumulative_iv_hours)"
    roles: [AttendingPhysician, IDPharmacist]
    code: 201
    input: [administered_at]
    output: "{ administered_doses: integer, cumulative_iv_hours: integer, dot_calendar: integer, dot_dose: number }"
    side_effects:
      - "administered_doses += 1"
      - "If route == IV: cumulative_iv_hours += hours-since-prior-administration bucket (per dose interval: 24 / frequency_per_day hours added per dose)"
      - "dot_calendar recomputed (distinct-date rule); dot_dose recomputed"
      - "May trigger REVIEW_REQUIRED sweep when dot_calendar crosses dot_review_threshold"

  - method: POST
    path: "/stewardship/antibiotic-orders/{id}/complete"
    description: "Complete therapy"
    roles: [AttendingPhysician]
    code: 200
    input: []
    output: AntibioticOrder
    side_effects: ["therapy_status := COMPLETED; stopped_at := clock"]

  - method: POST
    path: "/stewardship/antibiotic-orders/{id}/discontinue"
    description: "Discontinue therapy"
    roles: [AttendingPhysician, IDPharmacist]
    code: 200
    input: []
    output: AntibioticOrder
    side_effects: ["therapy_status := DISCONTINUED; open opportunities EXPIRED; open interventions SUPERSEDED"]

  # --- Approval requests ---
  - method: POST
    path: "/stewardship/approval-requests"
    description: "Submit a restricted-drug approval request"
    roles: [AttendingPhysician, IDPharmacist]
    code: 201
    input: [antibiotic_order_id, requester_id, justification]
    output: ApprovalRequest
    side_effects: ["status := SUBMITTED; submitted_at := clock"]

  - method: GET
    path: "/stewardship/approval-requests/{id}"
    description: "Get an approval request"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: ApprovalRequest
    side_effects: []

  - method: GET
    path: "/stewardship/approval-requests"
    description: "List approval requests (filterable by antibiotic_order_id, requester_id, decided_by_id, status)"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: ["antibiotic_order_id?", "requester_id?", "decided_by_id?", "status?", "limit?", "offset?"]
    output: "ApprovalRequest[]"
    side_effects: []

  - method: POST
    path: "/stewardship/approval-requests/{id}/decide"
    description: "Decide an approval request"
    roles: [IDPharmacist, StewardshipDirector]
    code: 200
    input: [decision, decider_id]
    output: ApprovalRequest
    side_effects: ["status := APPROVED|DENIED; order approval cascade per state machine"]

  - method: POST
    path: "/stewardship/approval-requests/{id}/escalate"
    description: "Escalate a request to the StewardshipDirector"
    roles: [IDPharmacist]
    code: 200
    input: [escalation_reason]
    output: ApprovalRequest
    side_effects: ["status := ESCALATED"]

  - method: POST
    path: "/stewardship/approval-requests/{id}/withdraw"
    description: "Withdraw an approval request (requester only)"
    roles: [AttendingPhysician, IDPharmacist]
    code: 200
    input: [withdrawer_id]
    output: ApprovalRequest
    side_effects: ["status := WITHDRAWN; order approval_status := NOT_REQUIRED; AWAITING_APPROVAL order -> DISCONTINUED"]

  # --- Audit interventions ---
  - method: POST
    path: "/stewardship/audit-interventions"
    description: "Document a prospective audit intervention (starts DOCUMENTED)"
    roles: [IDPharmacist]
    code: 201
    input: [antibiotic_order_id, auditor_id, intervention_type, recommendation_text]
    output: AuditIntervention
    side_effects: ["due_at := clock + 24h (placeholder until issue; recomputed at issue)"]

  - method: GET
    path: "/stewardship/audit-interventions/{id}"
    description: "Get an intervention"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: AuditIntervention
    side_effects: []

  - method: GET
    path: "/stewardship/audit-interventions"
    description: "List interventions (filterable by antibiotic_order_id, auditor_id, responded_by_id, appeal_adjudicator_id, recommendation_status)"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: ["antibiotic_order_id?", "auditor_id?", "responded_by_id?", "appeal_adjudicator_id?", "recommendation_status?", "limit?", "offset?"]
    output: "AuditIntervention[]"
    side_effects: []

  - method: POST
    path: "/stewardship/audit-interventions/{id}/issue"
    description: "Issue the recommendation to the prescriber"
    roles: [IDPharmacist]
    code: 200
    input: []
    output: AuditIntervention
    side_effects: ["recommendation_status := RECOMMENDED; due_at := clock + 24h; order -> REVIEW_REQUIRED"]

  - method: POST
    path: "/stewardship/audit-interventions/{id}/respond"
    description: "Prescriber responds ACCEPTED or REJECTED"
    roles: [AttendingPhysician]
    code: 200
    input: [response, responder_id]
    output: AuditIntervention
    side_effects: ["recommendation_status := ACCEPTED|REJECTED; order transition per intervention_type"]

  - method: POST
    path: "/stewardship/audit-interventions/{id}/appeal"
    description: "Auditor appeals a rejection"
    roles: [IDPharmacist]
    code: 200
    input: [appealer_id]
    output: AuditIntervention
    side_effects: ["recommendation_status := APPEALED"]

  - method: POST
    path: "/stewardship/audit-interventions/{id}/adjudicate"
    description: "Committee adjudicates an appeal (UPHOLD loops to RECOMMENDED; OVERTURN -> REJECTED_FINAL)"
    roles: [StewardshipDirector]
    code: 200
    input: [verdict, adjudicator_id]
    output: AuditIntervention
    side_effects: ["UPHOLD: status := RECOMMENDED, fresh due_at; OVERTURN: status := REJECTED_FINAL, prescriber standing recompute"]

  # --- Conversion opportunities ---
  - method: POST
    path: "/stewardship/conversion-opportunities/detect"
    description: "Run opportunity detection for a candidate order"
    roles: [IDPharmacist, StewardshipDirector]
    code: 201
    input: [antibiotic_order_id, opportunity_kind, "suggested_antimicrobial_id?"]
    output: ConversionOpportunity
    side_effects: ["eligibility_score computed per kind; status := DETECTED"]

  - method: GET
    path: "/stewardship/conversion-opportunities/{id}"
    description: "Get an opportunity"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: ConversionOpportunity
    side_effects: []

  - method: GET
    path: "/stewardship/conversion-opportunities"
    description: "List opportunities (filterable by antibiotic_order_id, opportunity_kind, suggested_antimicrobial_id, status)"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: ["antibiotic_order_id?", "opportunity_kind?", "suggested_antimicrobial_id?", "status?", "limit?", "offset?"]
    output: "ConversionOpportunity[]"
    side_effects: []

  - method: POST
    path: "/stewardship/conversion-opportunities/{id}/accept"
    description: "Accept an opportunity (applies route/drug change to the order)"
    roles: [AttendingPhysician]
    code: 200
    input: [accepter_id]
    output: ConversionOpportunity
    side_effects: ["status := ACCEPTED; order transitions per opportunity_kind"]

  - method: POST
    path: "/stewardship/conversion-opportunities/{id}/decline"
    description: "Decline an opportunity"
    roles: [AttendingPhysician]
    code: 200
    input: [decliner_id]
    output: ConversionOpportunity
    side_effects: ["status := DECLINED"]

  # --- Antibiograms ---
  - method: POST
    path: "/stewardship/antibiograms"
    description: "Create an antibiogram for a period (rows computed at creation)"
    roles: [Microbiologist]
    code: 201
    input: [hospital_id, period_start, period_end]
    output: Antibiogram
    side_effects: ["AntibiogramRow children computed per antibiogram_susceptibility_rate; row_count set"]

  - method: GET
    path: "/stewardship/antibiograms/{id}"
    description: "Get an antibiogram"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: Antibiogram
    side_effects: []

  - method: GET
    path: "/stewardship/antibiograms"
    description: "List antibiograms (filterable by hospital_id, status)"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: ["hospital_id?", "status?", "limit?", "offset?"]
    output: "Antibiogram[]"
    side_effects: []

  - method: GET
    path: "/stewardship/antibiograms/{id}/rows"
    description: "List antibiogram rows"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: "AntibiogramRow[]"
    side_effects: []

  - method: GET
    path: "/stewardship/antibiogram-rows"
    description: "List antibiogram rows across antibiograms (filterable by antibiogram_id, antimicrobial_id, organism)"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: ["antibiogram_id?", "antimicrobial_id?", "organism?", "limit?", "offset?"]
    output: "AntibiogramRow[]"
    side_effects: []

  - method: GET
    path: "/stewardship/antibiogram-rows/{id}"
    description: "Get a single antibiogram row"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: AntibiogramRow
    side_effects: []

  - method: POST
    path: "/stewardship/antibiograms/{id}/publish"
    description: "Publish an antibiogram (supersedes prior published; re-evaluates guideline staleness). OCC on hospital version."
    roles: [Microbiologist, StewardshipDirector]
    code: 200
    input: [expected_hospital_version]
    output: Antibiogram
    side_effects: ["status := PUBLISHED; prior PUBLISHED := SUPERSEDED; guideline staleness sweep; increments Hospital.version by 1"]

  # --- Empiric guidelines ---
  - method: POST
    path: "/stewardship/empiric-guidelines"
    description: "Draft an empiric guideline referencing a published antibiogram"
    roles: [StewardshipDirector, IDPharmacist]
    code: 201
    input: [hospital_id, syndrome, first_line_antimicrobial_id, source_antibiogram_id, "supersedes_guideline_id?"]
    output: EmpiricGuideline
    side_effects: ["status := DRAFT"]

  - method: GET
    path: "/stewardship/empiric-guidelines/{id}"
    description: "Get a guideline"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: EmpiricGuideline
    side_effects: []

  - method: GET
    path: "/stewardship/empiric-guidelines"
    description: "List guidelines (filterable by hospital_id, syndrome, status, first_line_antimicrobial_id, source_antibiogram_id, supersedes_guideline_id)"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: ["hospital_id?", "syndrome?", "status?", "first_line_antimicrobial_id?", "source_antibiogram_id?", "supersedes_guideline_id?", "limit?", "offset?"]
    output: "EmpiricGuideline[]"
    side_effects: []

  - method: POST
    path: "/stewardship/empiric-guidelines/{id}/adopt"
    description: "Adopt a guideline (retires prior ADOPTED for same syndrome). OCC on hospital version."
    roles: [StewardshipDirector]
    code: 200
    input: [expected_hospital_version]
    output: EmpiricGuideline
    side_effects: ["status := ADOPTED; pct_susceptible_at_adoption snapshot; prior ADOPTED for syndrome := RETIRED; increments Hospital.version by 1"]

  - method: POST
    path: "/stewardship/empiric-guidelines/{id}/retire"
    description: "Retire a DRAFT or STALE guideline"
    roles: [StewardshipDirector]
    code: 200
    input: []
    output: EmpiricGuideline
    side_effects: ["status := RETIRED"]

  # --- DOT metric snapshots ---
  - method: POST
    path: "/stewardship/dot-snapshots"
    description: "Open a monthly DOT metric snapshot (totals computed)"
    roles: [InfectionPreventionist]
    code: 201
    input: [hospital_id, period_label, patient_days]
    output: DOTMetricSnapshot
    side_effects: ["DOT totals and per-1000 metrics computed; benchmark_percentile computed"]

  - method: GET
    path: "/stewardship/dot-snapshots/{id}"
    description: "Get a snapshot"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: DOTMetricSnapshot
    side_effects: []

  - method: GET
    path: "/stewardship/dot-snapshots"
    description: "List snapshots (filterable by hospital_id, period_label, status)"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: ["hospital_id?", "period_label?", "status?", "limit?", "offset?"]
    output: "DOTMetricSnapshot[]"
    side_effects: []

  - method: POST
    path: "/stewardship/dot-snapshots/{id}/finalize"
    description: "Finalize a snapshot (period must be closed)"
    roles: [InfectionPreventionist, StewardshipDirector]
    code: 200
    input: []
    output: DOTMetricSnapshot
    side_effects: ["status := FINALIZED; totals frozen"]

  - method: POST
    path: "/stewardship/dot-snapshots/{id}/reopen"
    description: "Reopen a finalized snapshot (blocked when pinned by a submitted report)"
    roles: [StewardshipDirector]
    code: 200
    input: []
    output: DOTMetricSnapshot
    side_effects: ["status := OPEN"]

  # --- Regulatory reports ---
  - method: POST
    path: "/stewardship/regulatory-reports"
    description: "Draft a regulatory report pinning a snapshot"
    roles: [InfectionPreventionist]
    code: 201
    input: [hospital_id, report_type, period_label, dot_snapshot_id]
    output: RegulatoryReport
    side_effects: []

  - method: GET
    path: "/stewardship/regulatory-reports/{id}"
    description: "Get a report"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: []

  - method: GET
    path: "/stewardship/regulatory-reports"
    description: "List reports (filterable by hospital_id, report_type, dot_snapshot_id, status)"
    roles: [StewardshipAdmin, StewardshipDirector, IDPharmacist, AttendingPhysician, Microbiologist, InfectionPreventionist]
    code: 200
    input: ["hospital_id?", "report_type?", "dot_snapshot_id?", "status?", "limit?", "offset?"]
    output: "RegulatoryReport[]"
    side_effects: []

  - method: POST
    path: "/stewardship/regulatory-reports/{id}/submit"
    description: "Submit a report (assembles payload_json + checksum from pinned snapshot)"
    roles: [InfectionPreventionist]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: ["status := SUBMITTED; payload_json + checksum computed; submitted_at := clock"]

  - method: POST
    path: "/stewardship/regulatory-reports/{id}/acknowledge"
    description: "Record regulator acknowledgement (ACCEPTED / REJECTED)"
    roles: [StewardshipDirector]
    code: 200
    input: [ack]
    output: RegulatoryReport
    side_effects: ["status := ACCEPTED|REJECTED"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint per RBAC matrix" }

  # --- Existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist (left-to-right segment validation)" }

  # --- Input shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, enum out of range, or justification/reason below minimum length" }
  - { id: ERR_INVALID_PERIOD, http: 422, condition: "antibiogram period_end <= period_start" }
  - { id: ERR_INVALID_SUPERSESSION, http: 422, condition: "supersedes_guideline_id references missing/non-ADOPTED/non-STALE guideline, wrong syndrome, or self" }

  # --- State ---
  - { id: ERR_PRACTITIONER_INACTIVE, http: 409, condition: "Referenced practitioner is_active == false" }
  - { id: ERR_PATIENT_DISCHARGED, http: 409, condition: "PatientCase.status == DISCHARGED blocks order/culture/assessment mutation" }
  - { id: ERR_DRUG_SUSPENDED, http: 409, condition: "Antimicrobial.formulary_status == SUSPENDED blocks new orders/recommendations" }
  - { id: ERR_ORDER_NOT_AUDITABLE, http: 409, condition: "Target order therapy_status not in {ACTIVE, REVIEW_REQUIRED} for issuing an intervention" }
  - { id: ERR_ORDER_NOT_IV, http: 409, condition: "IV-to-PO acceptance requires order.route == IV" }
  - { id: ERR_NO_ORAL_FORM, http: 409, condition: "Antimicrobial.has_po_form == false blocks IV-to-PO acceptance" }
  - { id: ERR_ORDER_APPROVAL_NOT_PENDING, http: 409, condition: "Order approval_status != PENDING for request creation/decision" }
  - { id: ERR_APPROVAL_NOT_PENDING, http: 409, condition: "Approval request not in SUBMITTED/ESCALATED for decide/escalate/withdraw" }
  - { id: ERR_ESCALATED_REQUIRES_DIRECTOR, http: 403, condition: "Only StewardshipDirector may decide an ESCALATED approval request" }
  - { id: ERR_INTERVENTION_NOT_DRAFT, http: 409, condition: "Intervention not DOCUMENTED for issue" }
  - { id: ERR_INTERVENTION_NOT_PENDING, http: 409, condition: "Intervention not RECOMMENDED for respond" }
  - { id: ERR_INTERVENTION_NOT_APPEALABLE, http: 409, condition: "Intervention not REJECTED for appeal" }
  - { id: ERR_INTERVENTION_NOT_APPEALED, http: 409, condition: "Intervention not APPEALED for adjudicate" }
  - { id: ERR_OPPORTUNITY_NOT_DETECTED, http: 409, condition: "ConversionOpportunity not in DETECTED for accept/decline" }
  - { id: ERR_ALLERGY_NOT_SCHEDULABLE, http: 409, condition: "Allergy assessment not in SUSPECTED or CONFIRMED for scheduling" }
  - { id: ERR_ALLERGY_NOT_TESTING, http: 409, condition: "Allergy assessment not TESTING_SCHEDULED for record-result" }
  - { id: ERR_ALLERGY_TERMINAL, http: 409, condition: "Allergy assessment DELABELED/WITHDRAWN cannot transition" }
  - { id: ERR_ANTIBIOGRAM_NOT_DRAFT, http: 409, condition: "Antibiogram not DRAFT for publish" }
  - { id: ERR_ANTIBIOGRAM_EMPTY, http: 409, condition: "Antibiogram has zero reportable rows" }
  - { id: ERR_ANTIBIOGRAM_NOT_PUBLISHED, http: 409, condition: "Source antibiogram not PUBLISHED at guideline adoption" }
  - { id: ERR_GUIDELINE_NOT_DRAFT, http: 409, condition: "Guideline not DRAFT for adopt" }
  - { id: ERR_GUIDELINE_NOT_STALE, http: 409, condition: "Guideline not STALE for retire-from-stale" }
  - { id: ERR_GUIDELINE_NOT_RETIRABLE, http: 409, condition: "Guideline not DRAFT/STALE for retire" }
  - { id: ERR_SNAPSHOT_NOT_OPEN, http: 409, condition: "Snapshot not OPEN for finalize" }
  - { id: ERR_SNAPSHOT_NOT_FINALIZED, http: 409, condition: "Snapshot not FINALIZED for reopen" }
  - { id: ERR_SNAPSHOT_PINNED_BY_REPORT, http: 409, condition: "Snapshot pinned by SUBMITTED/ACCEPTED report cannot reopen" }
  - { id: ERR_SNAPSHOT_NOT_FINAL, http: 409, condition: "Pinned snapshot must be FINALIZED for report submit" }
  - { id: ERR_REPORT_NOT_DRAFT, http: 409, condition: "Report not DRAFT for submit" }
  - { id: ERR_REPORT_NOT_SUBMITTED, http: 409, condition: "Report not SUBMITTED for acknowledge" }

  # --- Business safety ---
  - { id: ERR_ALLERGY_BLOCKS_ORDER, http: 422, condition: "Penicillin-class order blocked by active allergy assessment not DELABELED/WITHDRAWN" }
  - { id: ERR_RENAL_DOSE_EXCEEDED, http: 422, condition: "dose_mg * frequency_per_day > 4000 with CrCl < 30" }
  - { id: ERR_SEVERE_ALLERGY_BLOCKED, http: 422, condition: "SEVERE allergy may never schedule a test" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 422, condition: "Approval decider equals requester (segregation of duties)" }
  - { id: ERR_ADJUDICATOR_CONFLICT, http: 422, condition: "Appeal adjudicator equals auditor or original responder (segregation of duties)" }

  # --- Business temporal ---
  - { id: ERR_FUTURE_SPECIMEN, http: 422, condition: "Culture collected_at is after the hospital logical clock" }
  - { id: ERR_INTERVENTION_OVERDUE, http: 422, condition: "Response after due_at" }
  - { id: ERR_ANTIBIOGRAM_WINDOW_OVERLAP, http: 409, condition: "Half-open antibiogram window overlaps an existing window for the hospital" }
  - { id: ERR_RECHALLENGE_TOO_EARLY, http: 422, condition: "Rechallenge from CONFIRMED requires years_since_reaction >= 5" }
  - { id: ERR_PERIOD_NOT_CLOSED, http: 422, condition: "Snapshot month not strictly before current clock month at finalize" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "set_current_utc to_iso8601 <= current hospital clock" }

  # --- Business referential ---
  - { id: ERR_CROSS_FACILITY_REFERENCE, http: 422, condition: "Referenced entity belongs to a different hospital" }
  - { id: ERR_NO_SUPPORTING_CULTURE, http: 422, condition: "De-escalation acceptance lacks a FINAL culture with S interpretation for the suggested drug" }

  # --- Business constraint ---
  - { id: ERR_RESTRICTED_REQUIRES_APPROVAL, http: 422, condition: "Administration recorded while approval_status != APPROVED for a restricted drug" }
  - { id: ERR_DUPLICATE_ACTIVE_ORDER, http: 409, condition: "Same patient + same antimicrobial with a non-terminal order already exists" }
  - { id: ERR_RESTRICTED_ORDER_CAP, http: 409, condition: "Patient already has 2 concurrent restricted orders" }
  - { id: ERR_DUPLICATE_ROW, http: 409, condition: "AntibiogramRow uniqueness per (antibiogram, organism, drug) violated" }
  - { id: ERR_APPROVAL_ALREADY_OPEN, http: 409, condition: "An open (SUBMITTED/ESCALATED) approval request already exists for the order" }
  - { id: ERR_DUPLICATE_SNAPSHOT_PERIOD, http: 409, condition: "Snapshot for the same hospital + period_label already exists" }
  - { id: ERR_REPORT_ALREADY_SUBMITTED, http: 409, condition: "A SUBMITTED/ACCEPTED report already exists for (hospital, report_type, period)" }
  - { id: ERR_NOT_REQUEST_OWNER, http: 403, condition: "Withdrawer is not the approval request's requester" }
  - { id: ERR_NOT_PRESCRIBER, http: 403, condition: "Responder is not the order's prescriber" }
  - { id: ERR_NOT_AUDIT_OWNER, http: 403, condition: "Appealer is not the intervention's auditor" }
  - { id: ERR_OPEN_INTERVENTION_BLOCKS_CLOSE, http: 409, condition: "Order has an intervention in RECOMMENDED or APPEALED status" }

  # --- Business fiscal / threshold ---
  - { id: ERR_FIRST_LINE_BELOW_THRESHOLD, http: 422, condition: "First-line drug pct_susceptible < 70 or row not reportable at adoption" }
  - { id: ERR_PRESCRIBER_SUSPENDED, http: 403, condition: "Prescriber stewardship_standing == SUSPENDED blocks restricted orders" }
  - { id: ERR_CONVERSION_NOT_ELIGIBLE, http: 422, condition: "IV-to-PO hard gate failed or score below threshold at detection" }
  - { id: ERR_DEESCALATION_NOT_ELIGIBLE, http: 422, condition: "De-escalation hard gate failed or score below threshold at detection" }
  - { id: ERR_ALLERGY_HIGH_RISK, http: 422, condition: "Allergy risk_score >= LOW_RISK_THRESHOLD blocks scheduling from SUSPECTED" }

  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_hospital_version does not match current Hospital.version (OCC)" }

