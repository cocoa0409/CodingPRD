  - rule_id: compensating_invariant
    instances:
      - name: seat_commit_release_conserves_the_two_sided_ledger
        grounds:
          - calculations.teach_out_seat_ledger
          - validations[priority=37]
          - endpoints["POST /provost/course-guarantees/{id}/seat-allocations"]
          - entities.CourseGuarantee.fields.seats_committed
          - entities.DisplacedStudent.fields.committed_seat_count
        distinguishing_aspect: |
          The seat ledger is written on two sides at once — the guarantee's
          seats_committed and the student's committed_seat_count — and the
          conserved quantity is that their sums stay equal after every write.
          The instance drives a refused COMMIT (which must leave BOTH sides
          untouched, the classic place a partial write leaks), then a RELEASE
          that compensates the first COMMIT, then a re-COMMIT of the same seats
          to the other student. The refusal is an aggregate check: 4 seats and
          3 seats are each far below the guarantee of 6, only their sum breaches
          it, so a per-request bound check passes where the aggregate must fail.
        test_recipe:
          setup:
            - "Program HIST-BA carried through the review to a RATIFIED DISCONTINUATION decision (Fixture A snapshots give composite 29.06, band NONVIABLE, so the outcome is supported)."
            - "A DRAFT TeachOutPlan on the program with exactly one course guarantee of 6 seats — seat allocation is not gated on the plan's state, so the ledger can be exercised while the plan is still DRAFT."
            - "Two displaced students: S-0001 with credits_remaining 12 (required_seat_count = ceil(12/3) = 4) and S-0002 with credits_remaining 9 (required_seat_count = ceil(9/3) = 3). Both are advised at max_credits_per_term 15 so neither is at_risk."
            - "One COMMIT of 4 seats to S-0001 is already applied, so the ledger reads 4 on both sides and the guarantee has 2 seats free."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "Self-study for the 2026 review of History BA", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
            - call: "POST /provost/external-reviewers"
              payload: { full_name: "Dr Alice Reyes", institution: "Northfield University", specialty_code: "HIST" }
              as: ReviewCoordinator
              captures: { rev_id: $.data.id }
            - call: "POST /provost/reviewer-visits"
              payload: { cycle_id: "${cycle_id}", reviewer_id: "${rev_id}", window_start_at: "2026-08-20T09:00:00Z", window_end_at: "2026-08-22T17:00:00Z" }
              as: ReviewCoordinator
              captures: { visit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-23T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/complete"
              payload: {}
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/reports"
              payload: { recommendation: "DISCONTINUE", finding_codes: ["F-ENROLL"], narrative: "Enrolment is unsustainable." }
              as: ExternalReviewer
              as_user_id: "${rev_id}"
            - call: "POST /provost/review-cycles/${cycle_id}/program-response"
              payload: { response_concurrence: "CONCUR", response_text: "The department concurs." }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { cyc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: Provost
            - call: "POST /provost/review-cycles/${cycle_id}/decision-records"
              payload: { outcome: "DISCONTINUATION", rationale: "Composite viability below the discontinuation band.", effective_term_index: 4, expected_cycle_version: "${cyc_v}" }
              as: Provost
              as_user_id: "provost-proposer"
              captures: { dec_id: $.data.id }
            - call: "POST /provost/decision-records/${dec_id}/transitions"
              payload: { action: "RATIFY", ratification_note: "Ratified at the September provost council." }
              as: Provost
              as_user_id: "provost-ratifier"
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { prog_v: $.data.version }
            - call: "POST /provost/academic-programs/${prog_id}/teach-out-plans"
              payload: { decision_id: "${dec_id}", last_admit_term_index: 3, first_teach_out_term_index: 4, final_award_term_index: 5, expected_program_version: "${prog_v}" }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /provost/teach-out-plans/${plan_id}/course-guarantees"
              payload: { course_code: "HIST-401", term_index: 4, seats_guaranteed: 6 }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { g1_id: $.data.id }
            - call: "POST /provost/teach-out-plans/${plan_id}/displaced-students"
              payload: { student_number: "S-0001", credits_remaining: 12, max_credits_per_term: 15 }
              as: Registrar
              captures: { s1_id: $.data.id }
            - call: "POST /provost/teach-out-plans/${plan_id}/displaced-students"
              payload: { student_number: "S-0002", credits_remaining: 9, max_credits_per_term: 15 }
              as: Registrar
              captures: { s2_id: $.data.id }
            - call: "POST /provost/course-guarantees/${g1_id}/seat-allocations"
              payload: { action: "COMMIT", displaced_student_id: "${s1_id}", seat_count: 4 }
              as: Registrar
          trigger:
            - call: "POST /provost/course-guarantees/${g1_id}/seat-allocations"
              payload: { action: "COMMIT", displaced_student_id: "${s2_id}", seat_count: 3 }
              as: Registrar
            - call: "POST /provost/course-guarantees/${g1_id}/seat-allocations"
              payload: { action: "RELEASE", displaced_student_id: "${s1_id}", seat_count: 2 }
              as: Registrar
            - call: "POST /provost/course-guarantees/${g1_id}/seat-allocations"
              payload: { action: "COMMIT", displaced_student_id: "${s2_id}", seat_count: 3 }
              as: Registrar
          assert:
            - "before the trigger: CourseGuarantee.${g1_id}.seats_committed == 4, seats_available == 2; DisplacedStudent.${s1_id}.committed_seat_count == 4; DisplacedStudent.${s2_id}.committed_seat_count == 0; TeachOutPlan.${plan_id}.committed_seat_total == 4 — the two sides agree at 4"
            - "the first trigger call returns 409 with error_id ERR_SEAT_CAPACITY_EXCEEDED: 4 + 3 = 7 exceeds seats_guaranteed 6, although 3 on its own is well inside the guarantee"
            - "after the refusal NOTHING moved: CourseGuarantee.${g1_id}.seats_committed == 4, seats_available == 2, DisplacedStudent.${s2_id}.committed_seat_count == 0, DisplacedStudent.${s1_id}.committed_seat_count == 4, TeachOutPlan.${plan_id}.committed_seat_total == 4"
            - "the second trigger call (RELEASE 2 from S-0001) returns 200 and compensates exactly: CourseGuarantee.${g1_id}.seats_committed == 2, seats_available == 4, DisplacedStudent.${s1_id}.committed_seat_count == 2, TeachOutPlan.${plan_id}.committed_seat_total == 2 — both sides still agree"
            - "the third trigger call (the identical COMMIT that was just refused) now returns 200: CourseGuarantee.${g1_id}.seats_committed == 5, seats_available == 1, DisplacedStudent.${s2_id}.committed_seat_count == 3, DisplacedStudent.${s1_id}.committed_seat_count == 2, TeachOutPlan.${plan_id}.committed_seat_total == 5 == 2 + 3"
            - "the conserved quantity holds at all four observation points: sum of CourseGuarantee.seats_committed over non-WAIVED guarantees == sum of DisplacedStudent.committed_seat_count over non-WITHDRAWN students (4, 4, 2, 5)"
            - "the plan's other aggregates are unaffected by seat movement: TeachOutPlan.${plan_id}.open_student_count == 2, guaranteed_seat_total == 6, required_seat_total == 7 (4 + 3), seat_shortfall == 1 throughout"
            - "CourseGuarantee.${g1_id}.status == PLANNED throughout and TeachOutPlan.${plan_id}.state == DRAFT throughout"

      - name: propose_then_withdraw_reassignment_conserves_fte_and_waterfall
        grounds:
          - state_machines.FacultyAppointment.ASSIGNED_to_REASSIGNMENT_PROPOSED
          - state_machines.FacultyAppointment.REASSIGNMENT_PROPOSED_to_ASSIGNED
          - calculations.staffing_reduction_waterfall
          - entities.AcademicProgram.fields.faculty_fte_baseline
          - entities.FacultyAppointment.fields.reassignment_withdraw_count
        distinguishing_aspect: |
          PROPOSE_REASSIGNMENT pulls an appointment's fte out of
          assigned_pool_fte without changing active_fte_total, and
          WITHDRAW_REASSIGNMENT is its compensating edge. The invariant under
          test is two-layered: the additive identity active + reassigned +
          separated == faculty_fte_baseline must hold at every point, AND the
          full waterfall must be re-derived back to byte-identical outputs after
          the withdraw — the same liability, the same deferred_fte and the same
          consecutive reduction_sequence_position numbering, with no gap left by
          the appointment that temporarily vacated position 2. Only the audit
          counter reassignment_withdraw_count is allowed to differ.
        test_recipe:
          setup:
            - "Program HIST-BA with the Fixture A snapshot history, so the rolling direct-cost window sums to 34000000 cents and the severance cap is floor(0.15 * 34000000) = 5100000."
            - "Three appointments and no course guarantees at all, so guaranteed_section_count is 0 and retained_teach_out_fte is 0.00: ADJUNCT 0.25 fte / 4000000 cents, NON_TENURE_TRACK 1.00 fte / 7200000 cents, TENURED 1.00 fte / 12000000 cents."
            - "faculty_fte_baseline is therefore 2.25 and the notice pays are 82192 (ADJUNCT, 30 days), 1775342 (NON_TENURE_TRACK, 90 days) and 12000000 (TENURED, 365 days)."
            - "The baseline waterfall funds the adjunct at position 1 and the non-tenure-track row at position 2 (82192 + 1775342 = 1857534, inside the cap) and then stops on the tenured row (1857534 + 12000000 = 13857534 exceeds the cap), leaving deferred_fte 1.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-ADJ-1", tenure_status: "ADJUNCT", fte: 0.25, annual_salary_cents: 4000000 }
              as: HRPartner
              captures: { adj_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-NTT-1", tenure_status: "NON_TENURE_TRACK", fte: 1.00, annual_salary_cents: 7200000 }
              as: HRPartner
              captures: { ntt_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-TEN-1", tenure_status: "TENURED", fte: 1.00, annual_salary_cents: 12000000 }
              as: HRPartner
              captures: { ten_id: $.data.id }
          trigger:
            - call: "POST /provost/faculty-appointments/${ntt_id}/transitions"
              payload: { action: "PROPOSE_REASSIGNMENT", reassigned_to_department_code: "CLAS" }
              as: HRPartner
            - call: "POST /provost/faculty-appointments/${ntt_id}/transitions"
              payload: { action: "WITHDRAW_REASSIGNMENT" }
              as: HRPartner
          assert:
            - "before the trigger: AcademicProgram.${prog_id}.faculty_fte_baseline == 2.25, assigned_pool_fte == 2.25, retained_teach_out_fte == 0.00, reducible_fte == 2.25, severance_budget_cap_cents == 5100000, staffing_liability_cents == 1857534, deferred_fte == 1.00"
            - "before the trigger: FacultyAppointment.${adj_id}.reduction_sequence_position == 1 and notice_pay_cents == 82192; FacultyAppointment.${ntt_id}.reduction_sequence_position == 2 and notice_pay_cents == 1775342; FacultyAppointment.${ten_id}.reduction_sequence_position is null and notice_pay_cents == 12000000"
            - "the first trigger call returns 200 and FacultyAppointment.${ntt_id}.state == REASSIGNMENT_PROPOSED with reassigned_to_department_code == CLAS"
            - "mid-state: AcademicProgram.${prog_id}.assigned_pool_fte == 1.25 (the proposed row left the pool), reducible_fte == 1.25, staffing_liability_cents == 82192, deferred_fte == 1.00"
            - "mid-state: FacultyAppointment.${adj_id}.reduction_sequence_position == 1, FacultyAppointment.${ntt_id}.reduction_sequence_position is null, FacultyAppointment.${ten_id}.reduction_sequence_position is null — the tenured row is still unfunded because 82192 + 12000000 exceeds the 5100000 cap"
            - "mid-state: active_fte_total == 2.25, reassigned_fte_total == 0.00, separated_fte_total == 0.00, faculty_fte_baseline == 2.25 — a proposal moves no fte out of active"
            - "the second trigger call returns 200 and FacultyAppointment.${ntt_id}.state == ASSIGNED with reassigned_to_department_code null and reassignment_withdraw_count == 1"
            - "after the withdraw every waterfall output is restored exactly: assigned_pool_fte == 2.25, retained_teach_out_fte == 0.00, reducible_fte == 2.25, staffing_liability_cents == 1857534, deferred_fte == 1.00"
            - "after the withdraw the sequence numbering is consecutive from 1 with no gap: FacultyAppointment.${adj_id}.reduction_sequence_position == 1, FacultyAppointment.${ntt_id}.reduction_sequence_position == 2, FacultyAppointment.${ten_id}.reduction_sequence_position is null"
            - "after the withdraw: active_fte_total == 2.25, reassigned_fte_total == 0.00, separated_fte_total == 0.00 and their sum equals faculty_fte_baseline 2.25"
            - "notice_pay_cents is unchanged by both edges on all three rows: 82192, 1775342, 12000000"
            - "FacultyAppointment.${adj_id}.reassignment_withdraw_count == 0 and FacultyAppointment.${ten_id}.reassignment_withdraw_count == 0 — only the compensated row's counter moved"
