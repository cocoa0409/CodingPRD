scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: request_fee_estimate_vs_final_diverge
        grounds:
          - calculations.request_fee_quote
          - state_machines.SigningRequest.DRAFT_to_QUOTED
          - state_machines.SigningRequest.IN_SESSION_to_COMPLETED
          - entities.SigningRequest.fields.estimate_fee_cents
          - entities.SigningRequest.fields.final_fee_cents
        distinguishing_aspect: "Same SigningRequest yields estimate_fee_cents=11000 (4 declared stamps, 10 declared miles) but final_fee_cents=8800 (2 COMPLETED journal acts, 18 actual miles): same formula, different inclusion set, different result."
        test_recipe:
          setup:
            - "Clock at default 2026-03-01. FeeSchedule CA (per_stamp=1500, travel_base=4000, per_mile=100, ron_surcharge=2500, cap=20000)."
            - "MOBILE GENERAL request with expected_stamp_count=4, estimated_travel_miles=10; ACTIVE notary; one document; QUOTED then ASSIGNED."
            - "PASS id-verification; SCHEDULED then LIVE session; 2 COMPLETED journal acts; actual_travel_miles=18 at completion."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
              as: CoordinatorOps
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme Notary", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/notaries"
              payload: { account_id: "${acct_id}", full_name: "Nora Public", commission_state: "CA", commission_expires_at: "2027-01-01T00:00:00Z", ron_authorized: true, nsa_certified: true }
              as: CoordinatorOps
              captures: { not_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam Signer", email: "sam@x.com", id_doc_type: "DRIVERS_LICENSE" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "GENERAL", delivery_mode: "MOBILE", expected_stamp_count: 4, estimated_travel_miles: 10 }
              as: CoordinatorOps
              captures: { req_id: $.data.id }
            - call: "POST /notary/documents"
              payload: { request_id: "${req_id}", title: "Affidavit A", doc_type: "AFFIDAVIT", signing_fee_cents: 3000 }
              as: CoordinatorOps
              captures: { doc_id: $.data.id }
            - call: "POST /notary/requests/${req_id}/quote"
              payload: {}
              as: CoordinatorOps
              captures: { req_v_quoted: $.data.version, est_fee: $.data.estimate_fee_cents }
            - call: "POST /notary/requests/${req_id}/assign"
              payload: { notary_id: "${not_id}", expected_request_version: "${req_v_quoted}" }
              as: CoordinatorOps
              captures: { req_v_assigned: $.data.version }
            - call: "POST /notary/id-verifications"
              payload: { request_id: "${req_id}", signer_id: "${signer_id}", kba_score: 80, credential_score: 90, biometric_score: 80 }
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/ron-sessions"
              payload: { request_id: "${req_id}", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: Notary
              as_user_id: "${not_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /notary/requests/${req_id}/start-session"
              payload: {}
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/journal-entries"
              payload: { request_id: "${req_id}", document_id: "${doc_id}", act_type: "JURAT" }
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/journal-entries"
              payload: { request_id: "${req_id}", document_id: "${doc_id}", act_type: "ACKNOWLEDGMENT" }
              as: Notary
              as_user_id: "${not_id}"
          trigger:
            - call: "POST /notary/requests/${req_id}/complete"
              payload: { actual_travel_miles: 18 }
              as: Notary
              as_user_id: "${not_id}"
              captures: { fin_fee: $.data.final_fee_cents }
          assert:
            - "SigningRequest.${req_id}.estimate_fee_cents == 11000"
            - "SigningRequest.${req_id}.final_fee_cents == 8800"
            - "SigningRequest.${req_id}.estimate_fee_cents != SigningRequest.${req_id}.final_fee_cents"
            - "SigningRequest.${req_id}.status == COMPLETED"

      - name: credential_trust_standard_vs_enhanced_diverge
        grounds:
          - calculations.credential_trust_score
          - entities.IdVerification.fields.trust_score
          - entities.IdVerification.fields.trust_variant
          - entities.IdVerification.fields.outcome
        distinguishing_aspect: "Identical sub-scores (kba=60, credential=95, biometric=75) yield trust_score=73.50/STANDARD on a GENERAL request but 78.50/ENHANCED on a LOAN_SIGNING request: the dual variant lives on the Signer credential domain, a different entity domain than the SigningRequest fee accounting."
        test_recipe:
          setup:
            - "FeeSchedule CA (enhanced_trust_required defaults false). Account, signer."
            - "Two requests: req_std GENERAL/MOBILE and req_loan LOAN_SIGNING/MOBILE, both DRAFT (verification needs only the request to exist)."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
              as: CoordinatorOps
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme Notary", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/notaries"
              payload: { account_id: "${acct_id}", full_name: "Nora Public", commission_state: "CA", commission_expires_at: "2027-01-01T00:00:00Z", ron_authorized: true, nsa_certified: true }
              as: CoordinatorOps
              captures: { not_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam Signer", email: "sam@x.com", id_doc_type: "PASSPORT" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "GENERAL", delivery_mode: "MOBILE", expected_stamp_count: 1 }
              as: CoordinatorOps
              captures: { req_std: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "LOAN_SIGNING", delivery_mode: "MOBILE", expected_stamp_count: 1 }
              as: CoordinatorOps
              captures: { req_loan: $.data.id }
            - call: "POST /notary/id-verifications"
              payload: { request_id: "${req_std}", signer_id: "${signer_id}", kba_score: 60, credential_score: 95, biometric_score: 75 }
              as: Notary
              as_user_id: "${not_id}"
              captures: { idv_std: $.data.id, std_score: $.data.trust_score, std_variant: $.data.trust_variant }
          trigger:
            - call: "POST /notary/id-verifications"
              payload: { request_id: "${req_loan}", signer_id: "${signer_id}", kba_score: 60, credential_score: 95, biometric_score: 75 }
              as: Notary
              as_user_id: "${not_id}"
              captures: { idv_loan: $.data.id, loan_score: $.data.trust_score, loan_variant: $.data.trust_variant }
          assert:
            - "IdVerification.${idv_std}.trust_variant == STANDARD"
            - "IdVerification.${idv_std}.trust_score == 73.50"
            - "IdVerification.${idv_std}.outcome == PASS"
            - "IdVerification.${idv_loan}.trust_variant == ENHANCED"
            - "IdVerification.${idv_loan}.trust_score == 78.50"
            - "IdVerification.${idv_loan}.outcome == PASS"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: request_fee_min_cap_nonlinear_mode_a
        grounds:
          - calculations.request_fee_quote
          - entities.FeeSchedule.fields.state_cap_cents
          - entities.SigningRequest.fields.estimate_fee_cents
        distinguishing_aspect: "Mode (a): fee = min(state_cap, stamps*per_stamp + travel_base + miles*per_mile + ron_surcharge) has 4 inputs whose linear sum is clamped by a non-linear min() against the cap; with 12 RON stamps the raw 24500 is clamped to 20000."
        test_recipe:
          setup:
            - "FeeSchedule CA cap=20000. RON request with expected_stamp_count=12 (raw base 18000+4000+2500=24500 exceeds cap)."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
              as: CoordinatorOps
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "STATE_ID" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "GENERAL", delivery_mode: "RON", expected_stamp_count: 12, estimated_travel_miles: 50 }
              as: CoordinatorOps
              captures: { req_id: $.data.id }
            - call: "POST /notary/documents"
              payload: { request_id: "${req_id}", title: "Big POA", doc_type: "POA", signing_fee_cents: 5000 }
              as: CoordinatorOps
          trigger:
            - call: "POST /notary/requests/${req_id}/quote"
              payload: {}
              as: CoordinatorOps
              captures: { est_fee: $.data.estimate_fee_cents }
          assert:
            - "SigningRequest.${req_id}.estimate_fee_cents == 20000"
            - "SigningRequest.${req_id}.status == QUOTED"

      - name: loan_package_round_per_doc_then_sum_mode_b
        grounds:
          - calculations.loan_package_fee
          - entities.RequestDocument.fields.signing_fee_cents
          - entities.LoanPackage.fields.package_fee_cents
          - state_machines.LoanPackage.DRAFT_to_SCRUBBED
        distinguishing_aspect: "Mode (b): three documents each 4005 cents at 10% discount give 3604.50 each; round-per-document-then-sum = 3605*3 = 10815, whereas sum-then-round = round(10813.50)=10814. The pinned order yields 10815."
        test_recipe:
          setup:
            - "LOAN_SIGNING request with three documents at signing_fee_cents=4005 each (one must be DEED/MORTGAGE). LoanPackage with package_discount_pct=0.10, DRAFT."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
              as: CoordinatorOps
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/notaries"
              payload: { account_id: "${acct_id}", full_name: "Nora", commission_state: "CA", commission_expires_at: "2027-01-01T00:00:00Z", ron_authorized: true, nsa_certified: true }
              as: CoordinatorOps
              captures: { not_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "DRIVERS_LICENSE" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "LOAN_SIGNING", delivery_mode: "MOBILE", expected_stamp_count: 3 }
              as: CoordinatorOps
              captures: { req_id: $.data.id }
            - call: "POST /notary/documents"
              payload: { request_id: "${req_id}", title: "Deed of Trust", doc_type: "DEED", signing_fee_cents: 4005 }
              as: CoordinatorOps
            - call: "POST /notary/documents"
              payload: { request_id: "${req_id}", title: "Note", doc_type: "MORTGAGE", signing_fee_cents: 4005 }
              as: CoordinatorOps
            - call: "POST /notary/documents"
              payload: { request_id: "${req_id}", title: "Disclosure", doc_type: "OTHER", signing_fee_cents: 4005 }
              as: CoordinatorOps
            - call: "POST /notary/loan-packages"
              payload: { request_id: "${req_id}", lender_ref: "LN-1", package_discount_pct: 0.10 }
              as: Notary
              as_user_id: "${not_id}"
              captures: { pkg_id: $.data.id }
          trigger:
            - call: "POST /notary/loan-packages/${pkg_id}/scrub"
              payload: {}
              as: Notary
              as_user_id: "${not_id}"
              captures: { pkg_fee: $.data.package_fee_cents }
          assert:
            - "LoanPackage.${pkg_id}.package_fee_cents == 10815"
            - "LoanPackage.${pkg_id}.scrub_passed == true"
            - "LoanPackage.${pkg_id}.status == SCRUBBED"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ron_session_parallel_axes_couple_on_golive
        grounds:
          - state_machines.RonSession.SCHEDULED_to_LIVE
          - entities.RonSession.fields.session_status
          - entities.RonSession.fields.recording_status
        distinguishing_aspect: "RonSession carries two independent axes; go-live moves session_status SCHEDULED->LIVE AND recording_status NOT_STARTED->RECORDING in one transition, demonstrating parallel-dimension state on a single entity (not a linear pipeline)."
        test_recipe:
          setup:
            - "ASSIGNED request with a PASS id-verification and a SCHEDULED RonSession (session_status=SCHEDULED, recording_status=NOT_STARTED)."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
              as: CoordinatorOps
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/notaries"
              payload: { account_id: "${acct_id}", full_name: "Nora", commission_state: "CA", commission_expires_at: "2027-01-01T00:00:00Z", ron_authorized: true, nsa_certified: true }
              as: CoordinatorOps
              captures: { not_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "DRIVERS_LICENSE" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "GENERAL", delivery_mode: "RON", expected_stamp_count: 1 }
              as: CoordinatorOps
              captures: { req_id: $.data.id }
            - call: "POST /notary/documents"
              payload: { request_id: "${req_id}", title: "Aff", doc_type: "AFFIDAVIT", signing_fee_cents: 1000 }
              as: CoordinatorOps
              captures: { doc_id: $.data.id }
            - call: "POST /notary/requests/${req_id}/quote"
              payload: {}
              as: CoordinatorOps
              captures: { req_v_q: $.data.version }
            - call: "POST /notary/requests/${req_id}/assign"
              payload: { notary_id: "${not_id}", expected_request_version: "${req_v_q}" }
              as: CoordinatorOps
            - call: "POST /notary/id-verifications"
              payload: { request_id: "${req_id}", signer_id: "${signer_id}", kba_score: 80, credential_score: 90, biometric_score: 80 }
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/ron-sessions"
              payload: { request_id: "${req_id}", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: Notary
              as_user_id: "${not_id}"
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /notary/requests/${req_id}/start-session"
              payload: {}
              as: Notary
              as_user_id: "${not_id}"
          assert:
            - "RonSession.${sess_id}.session_status == LIVE"
            - "RonSession.${sess_id}.recording_status == RECORDING"
            - "SigningRequest.${req_id}.status == IN_SESSION"

      - name: apostille_order_branch_and_resubmit_cycle
        grounds:
          - state_machines.ApostilleOrder.ROUTED_to_RETURNED
          - state_machines.ApostilleOrder.RETURNED_to_SUBMITTED
          - entities.ApostilleOrder.fields.resubmit_count
        distinguishing_aspect: "ApostilleOrder is non-linear on a different entity than RonSession: SUBMITTED branches to {ROUTED, REJECTED}, and ROUTED->RETURNED->SUBMITTED forms a cycle that increments resubmit_count from 0 to 1."
        test_recipe:
          setup:
            - "A COMPLETED request whose document requires_apostille=true; an ApostilleOrder SUBMITTED then ROUTED then RETURNED (resubmit_count=0)."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
              as: CoordinatorOps
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/notaries"
              payload: { account_id: "${acct_id}", full_name: "Nora", commission_state: "CA", commission_expires_at: "2027-01-01T00:00:00Z", ron_authorized: true, nsa_certified: true }
              as: CoordinatorOps
              captures: { not_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "PASSPORT" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "APOSTILLE_BOUND", delivery_mode: "RON", expected_stamp_count: 1 }
              as: CoordinatorOps
              captures: { req_id: $.data.id }
            - call: "POST /notary/documents"
              payload: { request_id: "${req_id}", title: "Birth Cert", doc_type: "BIRTH_CERT", requires_apostille: true, signing_fee_cents: 1000 }
              as: CoordinatorOps
              captures: { doc_id: $.data.id }
            - call: "POST /notary/requests/${req_id}/quote"
              payload: {}
              as: CoordinatorOps
              captures: { req_v_q: $.data.version }
            - call: "POST /notary/requests/${req_id}/assign"
              payload: { notary_id: "${not_id}", expected_request_version: "${req_v_q}" }
              as: CoordinatorOps
            - call: "POST /notary/id-verifications"
              payload: { request_id: "${req_id}", signer_id: "${signer_id}", kba_score: 80, credential_score: 90, biometric_score: 80 }
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/ron-sessions"
              payload: { request_id: "${req_id}", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/requests/${req_id}/start-session"
              payload: {}
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/journal-entries"
              payload: { request_id: "${req_id}", document_id: "${doc_id}", act_type: "ACKNOWLEDGMENT" }
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/requests/${req_id}/complete"
              payload: {}
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/apostille-orders"
              payload: { document_id: "${doc_id}", destination_country: "FR", sos_office_state: "CA" }
              as: ApostilleClerk
              captures: { ord_id: $.data.id }
            - call: "POST /notary/apostille-orders/${ord_id}/route"
              payload: {}
              as: ApostilleClerk
            - call: "POST /notary/apostille-orders/${ord_id}/return"
              payload: {}
              as: ApostilleClerk
          trigger:
            - call: "POST /notary/apostille-orders/${ord_id}/resubmit"
              payload: {}
              as: ApostilleClerk
              captures: { rc: $.data.resubmit_count }
          assert:
            - "ApostilleOrder.${ord_id}.status == SUBMITTED"
            - "ApostilleOrder.${ord_id}.resubmit_count == 1"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: notary_expire_cascade_depth3
        grounds:
          - state_machines.Notary.ACTIVE_to_EXPIRED
          - state_machines.Assignment
          - state_machines.SigningRequest.ASSIGNED_to_DRAFT
          - entities.SigningRequest.fields.assigned_notary_id
        distinguishing_aspect: "Depth-3 chain from POST /notaries/{id}/expire: (1) Notary->EXPIRED causes (2) its ACTIVE Assignment->RELEASED, which itself causes (3) the linked ASSIGNED SigningRequest to revert to DRAFT and clear assigned_notary_id. Each hop is caused by the prior hop, not the original action."
        test_recipe:
          setup:
            - "ACTIVE notary assigned to an ASSIGNED request (Assignment ACTIVE, request.assigned_notary_id set, status ASSIGNED). No LIVE session."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
              as: CoordinatorOps
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/notaries"
              payload: { account_id: "${acct_id}", full_name: "Nora", commission_state: "CA", commission_expires_at: "2027-01-01T00:00:00Z", ron_authorized: true, nsa_certified: true }
              as: CoordinatorOps
              captures: { not_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "DRIVERS_LICENSE" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "GENERAL", delivery_mode: "MOBILE", expected_stamp_count: 1 }
              as: CoordinatorOps
              captures: { req_id: $.data.id }
            - call: "POST /notary/documents"
