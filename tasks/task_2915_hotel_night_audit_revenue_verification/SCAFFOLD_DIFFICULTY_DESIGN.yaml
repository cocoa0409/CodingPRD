            - "GET /night-audit/outlet-tickets/${tk_below_id} returns taxable_base_amount == 471.99, one cent below the 472.00 threshold, so large_party_discount_amount == 0.00 and total_amount == 501.49 - a ticket one cent cheaper ends up 19.99 dearer."
