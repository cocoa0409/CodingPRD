            - { call: "POST /work-orders", payload: { customer_id: "${c8}", part_number: "PN-800W", alloy_code: "AL2024", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 1.0, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${c8}", captures: { wow8: $.data.id } }
