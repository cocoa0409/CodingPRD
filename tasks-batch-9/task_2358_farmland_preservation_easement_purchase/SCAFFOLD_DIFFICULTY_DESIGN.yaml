              captures: { src_t1_id: $.data.id }
            - call: "POST /funding-rounds"
              payload: { program_id: "${prog2_id}", round_label: "2026 Township Cycle", opens_on: "2026-08-05T00:00:00Z", closes_on: "2026-09-30T00:00:00Z", pool_cents: 500000000 }
              as: ProgramAdmin
