# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2599 — Mortgage Servicing Rights Valuation & Transfer
#
# Every instance grounds strictly in SCAFFOLD.yaml §1.1–§1.7. Deleting this file
# leaves the declared behaviour identical.
#
# Shared fixture vocabulary (all literals; no wall-clock dependence):
#   logical clock default          2026-08-01T00:00:00Z
#   AssumptionSet "desk-base"      cpr_pct 8.0, discount_rate_pct 10.0,
#                                  cost_to_service_annual_cents 9000,
#                                  float_earnings_rate_pct 4.0, projection_years 3
#   RateCurveSnapshot C1           as_of_date 2026-07-31, base_rate_bps 4000
#   RateCurveSnapshot C2           as_of_date 2026-08-20, base_rate_bps 4050
#   Fixture T (4 loans)            upb 10000050 each, fee 25 bps, escrow 100000,
#                                  suspense 25000, CURRENT / NONE, note_rate 6.5,
#                                  states CA / TX / FL / NY
#                                  -> total_upb 40000200, custodial 500000,
#                                     static value 171576, OAS value 170962
#   Fixture V (3 loans)            V1 20000000/300000/0/CURRENT/NONE/CA/6.5
#                                  V2 15000000/200000/50000/DQ_60_89/FORBEARANCE/TX/7.25
#                                  V3 10000000/150000/0/CURRENT/NONE/FL/5.75
#                                  -> total_upb 45000000, static 209186, OAS 208484
#   Fixture M (1 loan)             upb 10000050, escrow 100000, suspense 25000,
#                                  CURRENT / NONE, CA, 6.5 -> static 42894
#   Opaque actor ids               va-001, tm-001, ag-001, ag-002, co-001, co-002,
#                                  hd-001, admin-001
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: msr_fair_value_static_versus_oas_shock_weighted
        grounds:
          - calculations.msr_fair_value
          - entities.ValuationRun.fields.method
          - entities.ValuationRun.fields.scenario_values
          - entities.ValuationRun.fields.value_bps_of_upb
          - endpoints[POST /msr/portfolios/{id}/valuation-runs]
        distinguishing_aspect: |
          The two variants are selected by ValuationRun.method and differ in the SHAPE of the
          computation, not merely a constant: DETERMINISTIC_STATIC evaluates the decay curve once
          at the assumption CPR, while OAS_SHOCK_WEIGHTED evaluates it three times under
          (cpr_multiplier, rate_shift) shocks and weights the results 0.25/0.50/0.25. On the same
          Fixture V pool at the same 4000 bps curve the results are 209186 and 208484 — a 702-cent
          divergence caused entirely by the faster prepayment in the DOWN_50 leg shortening the
          fee strip.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default."
            - "Seller counterparty Alpha (SELLER, TIER_1, [FNMA, FHLMC], net worth 500000000)."
            - "AssumptionSet desk-base and RateCurveSnapshot C1 (4000 bps) exist."
            - "Portfolio Pool-V holds Fixture V's three loans and is TAPE_LOCKED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
            - call: "POST /msr/counterparties"
              payload: { legal_name: "Alpha Servicing LLC", role_type: SELLER, net_worth_cents: 500000000, servicer_rating: TIER_1, agency_approvals: [FNMA, FHLMC] }
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { seller_id: "$.data.id" }
            - call: "POST /msr/assumption-sets"
              payload: { assumption_name: "desk-base", cpr_pct: 8.0, discount_rate_pct: 10.0, cost_to_service_annual_cents: 9000, float_earnings_rate_pct: 4.0, projection_years: 3 }
              as: ValuationAnalyst
              as_user_id: va-001
              captures: { as_id: "$.data.id" }
            - call: "POST /msr/rate-curves"
              payload: { as_of_date: "2026-07-31", base_rate_bps: 4000, primary_secondary_spread_bps: 85 }
              as: HedgeDesk
              as_user_id: hd-001
              captures: { c1_id: "$.data.id" }
            - call: "POST /msr/portfolios"
              payload: { seller_id: "${seller_id}", portfolio_name: "Pool-V", agency_type: FNMA }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "V-0001", upb_cents: 20000000, note_rate_pct: 6.5, servicing_fee_bps: 25, escrow_balance_cents: 300000, suspense_balance_cents: 0, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "CA" }
              as: SellerServicer
              as_user_id: "${seller_id}"
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "V-0002", upb_cents: 15000000, note_rate_pct: 7.25, servicing_fee_bps: 25, escrow_balance_cents: 200000, suspense_balance_cents: 50000, delinquency_bucket: DQ_60_89, loss_mit_status: FORBEARANCE, state_code: "TX" }
              as: SellerServicer
              as_user_id: "${seller_id}"
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "V-0003", upb_cents: 10000000, note_rate_pct: 5.75, servicing_fee_bps: 25, escrow_balance_cents: 150000, suspense_balance_cents: 0, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "FL" }
              as: SellerServicer
              as_user_id: "${seller_id}"
            - call: "POST /msr/portfolios/${pf_id}/lock-tape"
              payload: {}
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { pf_v1: "$.data.version" }
            - call: "POST /msr/portfolios/${pf_id}/valuation-runs"
              payload: { assumption_set_id: "${as_id}", method: DETERMINISTIC_STATIC, expected_portfolio_version: "${pf_v1}" }
              as: ValuationAnalyst
              as_user_id: va-001
              captures: { static_value: "$.data.value_cents", static_bps: "$.data.value_bps_of_upb", static_run_id: "$.data.id" }
            - call: "GET /msr/portfolios/${pf_id}"
              as: ValuationAnalyst
              as_user_id: va-001
              captures: { pf_v2: "$.data.version" }
          trigger:
            - call: "POST /msr/portfolios/${pf_id}/valuation-runs"
              payload: { assumption_set_id: "${as_id}", method: OAS_SHOCK_WEIGHTED, expected_portfolio_version: "${pf_v2}" }
              as: ValuationAnalyst
              as_user_id: va-001
              captures: { oas_value: "$.data.value_cents", oas_bps: "$.data.value_bps_of_upb", oas_run_id: "$.data.id" }
          assert:
            - "${static_value} == 209186 and ${static_bps} == 46.49"
            - "${oas_value} == 208484 and ${oas_bps} == 46.33"
            - "${static_value} - ${oas_value} == 702 (the variants diverge on identical inputs)"
            - "GET /msr/valuation-runs/${static_run_id} shows scenario_values == {} and effective_discount_rate_pct == 10.0"
            - "GET /msr/valuation-runs/${oas_run_id} shows scenario_values == {DOWN_50: 188266, BASE: 209186, UP_50: 227299}"
            - "the OAS BASE scenario value 209186 equals the static value exactly, proving the divergence comes only from the shocked legs"
            - "GET /msr/valuation-runs/${static_run_id} shows status == SUPERSEDED after the second run (no BidPackage references it)"
            - "GET /msr/valuation-runs/${oas_run_id} shows included_loan_count == 3"

      - name: counterparty_risk_score_pre_award_versus_post_transfer
        grounds:
          - calculations.counterparty_transfer_risk_score
          - endpoints[GET /msr/counterparties/{id}/risk-score]
          - entities.ErrorResolutionCase.fields.ack_breached
          - entities.ServicingTransfer.fields.transferred_loan_count
          - validations[priority=22]
        distinguishing_aspect: |
          A different calculation from the msr_fair_value pair and a different entity domain:
          this one is anchored on Counterparty, not ValuationRun. Its two variants read DIFFERENT
          ENTITY SETS — PRE_AWARD reads only the counterparty row (balance sheet, rating, agency
          approvals), whereas POST_TRANSFER additionally traverses that counterparty's COMPLETED
          ServicingTransfers and their ErrorResolutionCase rows. Bravo therefore scores 92 / LOW
          before the trade and 62 / MEDIUM the moment one complaint lands on its four transferred
          loans, without a single field on Counterparty changing.
        test_recipe:
          setup:
            - "Fixture T is sold to buyer Bravo (BUYER, TIER_1, [FNMA], net worth 1200000000) and the servicing transfer is COMPLETED."
            - "Transfer terms: rep_warrant_days 30, indemnification_days 45, transfer_date 2026-09-01."
            - "Exactly one ErrorResolutionCase exists on the transfer's four transferred loans, acknowledged inside 5 days and resolved inside 30 days."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
            - call: "POST /msr/counterparties"
              payload: { legal_name: "Alpha Servicing LLC", role_type: SELLER, net_worth_cents: 500000000, servicer_rating: TIER_1, agency_approvals: [FNMA, FHLMC] }
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { seller_id: "$.data.id" }
            - call: "POST /msr/counterparties"
              payload: { legal_name: "Bravo Servicing Inc", role_type: BUYER, net_worth_cents: 1200000000, servicer_rating: TIER_1, agency_approvals: [FNMA] }
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { buyer_id: "$.data.id" }
            - call: "GET /msr/counterparties/${buyer_id}/risk-score"
              as: TransactionManager
              as_user_id: tm-001
              captures: { pre_score: "$.data.score", pre_tier: "$.data.tier", pre_complaint: "$.data.complaint_penalty" }
            - call: "POST /msr/assumption-sets"
              payload: { assumption_name: "desk-base", cpr_pct: 8.0, discount_rate_pct: 10.0, cost_to_service_annual_cents: 9000, float_earnings_rate_pct: 4.0, projection_years: 3 }
              as: ValuationAnalyst
              as_user_id: va-001
              captures: { as_id: "$.data.id" }
            - call: "POST /msr/rate-curves"
              payload: { as_of_date: "2026-07-31", base_rate_bps: 4000, primary_secondary_spread_bps: 85 }
              as: HedgeDesk
              as_user_id: hd-001
            - call: "POST /msr/portfolios"
              payload: { seller_id: "${seller_id}", portfolio_name: "Pool-T", agency_type: FNMA }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "T-0001", upb_cents: 10000050, note_rate_pct: 6.5, servicing_fee_bps: 25, escrow_balance_cents: 100000, suspense_balance_cents: 25000, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "CA" }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { loan1_id: "$.data.id" }
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "T-0002", upb_cents: 10000050, note_rate_pct: 6.5, servicing_fee_bps: 25, escrow_balance_cents: 100000, suspense_balance_cents: 25000, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "TX" }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { loan2_id: "$.data.id" }
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "T-0003", upb_cents: 10000050, note_rate_pct: 6.5, servicing_fee_bps: 25, escrow_balance_cents: 100000, suspense_balance_cents: 25000, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "FL" }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { loan3_id: "$.data.id" }
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "T-0004", upb_cents: 10000050, note_rate_pct: 6.5, servicing_fee_bps: 25, escrow_balance_cents: 100000, suspense_balance_cents: 25000, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "NY" }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { loan4_id: "$.data.id" }
            - call: "POST /msr/portfolios/${pf_id}/lock-tape"
              payload: {}
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { pf_v1: "$.data.version" }
            - call: "POST /msr/portfolios/${pf_id}/valuation-runs"
              payload: { assumption_set_id: "${as_id}", method: DETERMINISTIC_STATIC, expected_portfolio_version: "${pf_v1}" }
              as: ValuationAnalyst
              as_user_id: va-001
              captures: { vr_id: "$.data.id" }
            - call: "POST /msr/bid-packages"
              payload: { portfolio_id: "${pf_id}", valuation_run_id: "${vr_id}", stratification_scheme: BY_STATE, reserve_price_floor_pct: 95, marketing_start_at: "2026-08-01T00:00:00Z", bid_deadline_at: "2026-08-15T00:00:00Z" }
              as: TransactionManager
              as_user_id: tm-001
              captures: { bp_id: "$.data.id" }
            - call: "POST /msr/bid-packages/${bp_id}/stratify"
              payload: {}
              as: ValuationAnalyst
              as_user_id: va-001
            - call: "POST /msr/bid-packages/${bp_id}/publish"
              payload: {}
              as: TransactionManager
              as_user_id: tm-001
              captures: { bp_v: "$.data.version" }
            - call: "POST /msr/bid-packages/${bp_id}/bids"
              payload: { bidder_id: "${buyer_id}", price_bps: 118, holdback_pct: 6, expected_bid_package_version: "${bp_v}" }
              as: BuyerServicer
              as_user_id: "${buyer_id}"
              captures: { bid_id: "$.data.id" }
            - call: "POST /msr/bid-packages/${bp_id}/award"
              payload: { winning_bid_id: "${bid_id}", rep_warrant_days: 30, indemnification_days: 45 }
              as: TransactionManager
              as_user_id: tm-001
              captures: { pa_id: "$.data.id" }
            - call: "POST /msr/purchase-agreements/${pa_id}/approval-requests"
              payload: { approver_type: AGENCY, agency_type: FNMA }
              as: TransactionManager
              as_user_id: tm-001
              captures: { ar_id: "$.data.id" }
            - call: "POST /msr/purchase-agreements/${pa_id}/submit-for-approval"
              payload: {}
              as: TransactionManager
              as_user_id: tm-001
            - call: "POST /msr/approval-requests/${ar_id}/decide"
              payload: { decision: APPROVED }
              as: AgencyApprover
              as_user_id: ag-001
            - call: "POST /msr/purchase-agreements/${pa_id}/settle"
              payload: { sale_date: "2026-08-05", transfer_date: "2026-09-01" }
              as: TransactionManager
              as_user_id: tm-001
            - call: "GET /msr/servicing-transfers"
              payload: {}
              as: TransactionManager
              as_user_id: tm-001
              captures: { st_id: "$.data[0].id" }
            - call: "POST /msr/servicing-transfers/${st_id}/map-data"
              payload: { mapping_scheme: MSP_TO_MSP }
              as: BuyerServicer
              as_user_id: "${buyer_id}"
            - call: "POST /msr/servicing-transfers/${st_id}/map-escrow"
              payload: {}
              as: BuyerServicer
              as_user_id: "${buyer_id}"
            - call: "POST /msr/servicing-transfers/${st_id}/reconcile"
              payload: {}
              as: BuyerServicer
              as_user_id: "${buyer_id}"
            - call: "POST /msr/servicing-transfers/${st_id}/transfer-pipeline"
              payload: {}
              as: BuyerServicer
              as_user_id: "${buyer_id}"
            - call: "POST /msr/servicing-transfers/${st_id}/notices"
              payload: { notice_type: TRANSFEROR_15DAY, loan_id: "${loan1_id}", effective_date: "2026-09-01" }
              as: SellerServicer
              as_user_id: "${seller_id}"
            - call: "POST /msr/servicing-transfers/${st_id}/notices"
              payload: { notice_type: TRANSFEROR_15DAY, loan_id: "${loan2_id}", effective_date: "2026-09-01" }
              as: SellerServicer
              as_user_id: "${seller_id}"
            - call: "POST /msr/servicing-transfers/${st_id}/notices"
              payload: { notice_type: TRANSFEROR_15DAY, loan_id: "${loan3_id}", effective_date: "2026-09-01" }
              as: SellerServicer
              as_user_id: "${seller_id}"
            - call: "POST /msr/servicing-transfers/${st_id}/notices"
              payload: { notice_type: TRANSFEROR_15DAY, loan_id: "${loan4_id}", effective_date: "2026-09-01" }
              as: SellerServicer
              as_user_id: "${seller_id}"
            - call: "POST /msr/servicing-transfers/${st_id}/attest-notices"
              payload: {}
              as: ComplianceOfficer
              as_user_id: co-001
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
            - call: "POST /msr/servicing-transfers/${st_id}/complete"
              payload: {}
              as: TransactionManager
              as_user_id: tm-001
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
            - call: "POST /msr/servicing-transfers/${st_id}/error-cases"
              payload: { loan_id: "${loan1_id}", category: ESCROW, description: "escrow disbursement missed after transfer" }
              as: ComplianceOfficer
              as_user_id: co-001
              captures: { case_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
            - call: "POST /msr/error-cases/${case_id}/acknowledge"
              payload: {}
              as: BuyerServicer
              as_user_id: "${buyer_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
            - call: "POST /msr/error-cases/${case_id}/resolve"
              payload: { remediation_cents: 5000, resolution_note: "escrow disbursement reissued" }
              as: BuyerServicer
