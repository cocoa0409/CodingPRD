scenario: |
  Patent Licensing & Royalty Audit (technology licensing office): license agreement terms & royalty base/rate definitions, licensee royalty report intake & validation, underreporting detection & audit right exercise, audit findings, dispute & settlement, minimum/running royalty & milestone triggers, sublicense rights & pass-through obligations, most-favored-licensee clause administration, revenue recognition & inventor share distribution

domain_name: patent-licensing-royalty-audit
api_prefix: /licensing

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Licensee
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal entity name of the licensee" }
      - { name: tax_id, type: string, source: input, description: "Tax identifier; unique across all licensees", constraints: "unique" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | TERMINATED", constraints: "enum: ACTIVE, SUSPENDED, TERMINATED" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Receivables owed: accepted royalties + milestone fees + accepted shortfalls + ratified settlements + arbitration awards" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Credits owed to licensee (e.g., RETROACTIVE MFL credits)" }

  - name: LicenseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: licensee_id, type: string, source: input, description: "FK -> Licensee.id; contracting licensee" }
      - { name: patent_reference, type: string, source: input, description: "Patent publication reference, e.g. US-10123456-B2; MFL sweep scope key" }
      - { name: title, type: string, source: input, description: "Agreement title" }
      - { name: royalty_base_definition, type: enum, source: input, description: "NET_SALES = sum(gross - deductions) over non-sublicense lines; GROSS_SALES = sum(gross) over non-sublicense lines", constraints: "enum: NET_SALES, GROSS_SALES" }
      - { name: base_rate_bp, type: integer, source: input, description: "Running royalty rate in basis points applied to royalty base", constraints: "> 0, <= 10000" }
      - { name: minimum_period_royalty_cents, type: integer, source: input, default: 0, description: "Minimum royalty floor applied per accepted report; 0 = no minimum", constraints: ">= 0" }
      - { name: sublicense_allowed, type: boolean, source: input, default: false, description: "Whether licensee may grant sublicenses" }
      - { name: sublicense_passthrough_rate_bp, type: integer, source: input, default: 0, description: "Pass-through royalty rate in bp applied to sublicense revenue lines", constraints: ">= 0, <= 10000" }
      - { name: mfl_clause, type: boolean, source: input, default: false, description: "Most-favored-licensee clause present" }
      - { name: mfl_mode, type: enum, source: input, default: RETROACTIVE, description: "RETROACTIVE = credit for trailing lookback window + lower rate forward; PROSPECTIVE = lower rate forward only", constraints: "enum: RETROACTIVE, PROSPECTIVE" }
      - { name: mfl_lookback_quarters, type: integer, source: input, default: 4, description: "Quarters (x3 months) of accepted reports re-priced on a RETROACTIVE MFL adjustment", constraints: ">= 1" }
      - { name: audit_window_months, type: integer, source: input, default: 24, description: "Audits may only examine periods ending on/after today minus this many months", constraints: ">= 1" }
      - { name: underreport_tolerance_bp, type: integer, source: input, default: 500, description: "Screening tolerance in bp; report FLAGGED iff reported net sales < benchmark * (10000 - tolerance) / 10000", constraints: ">= 0, < 10000" }
      - { name: inventor_shares, type: array, source: input, description: "Array of {inventor_name, share_bp}; share_bp values must sum to exactly 10000; inventor_name unique per agreement" }
      - { name: effective_date, type: datetime, source: input, description: "Agreement effective date (ISO 8601 date)" }
      - { name: expiration_date, type: datetime, source: input, description: "Agreement expiration date; must be after effective_date" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUSPENDED | EXPIRED | TERMINATED", constraints: "enum: DRAFT, ACTIVE, SUSPENDED, EXPIRED, TERMINATED" }
      - { name: cumulative_accepted_base_cents, type: integer, source: computed, default: 0, description: "Sum of final royalty bases of non-VOIDED accepted reports" }
      - { name: cumulative_recognized_revenue_cents, type: integer, source: computed, default: 0, description: "Revenue recognized: accepted final royalties + accepted finding shortfalls + ratified settlements + arbitration awards" }
      - { name: undistributed_pool_cents, type: integer, source: computed, default: 0, description: "Recognized revenue not yet consumed by a POSTED distribution run" }
      - { name: mfl_adjusted_rate_bp, type: integer, source: computed, default: null, description: "Effective first-line rate after an MFL adjustment; null = base_rate_bp in effect" }
      - { name: last_mfl_credit_cents, type: integer, source: computed, default: 0, description: "Credit granted by the most recent RETROACTIVE MFL adjustment" }

  - name: Milestone
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id" }
      - { name: name, type: string, source: input, description: "Milestone name" }
      - { name: trigger_type, type: enum, source: input, description: "CUMULATIVE_SALES | DATE", constraints: "enum: CUMULATIVE_SALES, DATE" }
      - { name: threshold_cents, type: integer, source: input, default: null, description: "Required iff trigger_type=CUMULATIVE_SALES; achieved when cumulative_accepted_base_cents >= threshold_cents", constraints: "> 0 when present" }
      - { name: trigger_date, type: datetime, source: input, default: null, description: "Required iff trigger_type=DATE; achieved when logical clock reaches this date" }
      - { name: fee_cents, type: integer, source: input, description: "Fee accrued to licensee.outstanding_balance_cents on achievement", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | ACHIEVED", constraints: "enum: PENDING, ACHIEVED" }
      - { name: achieved_at, type: datetime, source: system, default: null, description: "Timestamp of achievement; cleared if reverted to PENDING" }

  - name: SublicenseGrant
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id; agreement must have sublicense_allowed=true" }
      - { name: sublicensee_name, type: string, source: input, description: "Name of the sublicensee organization" }
      - { name: territory, type: string, source: input, description: "Territory scope, e.g. EU, NA" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | APPROVED | REJECTED | REVOKED", constraints: "enum: PENDING, APPROVED, REJECTED, REVOKED" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "LicensingAnalyst X-User-ID that recorded the latest decision" }

  - name: RoyaltyReport
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id" }
      - { name: licensee_id, type: string, source: input, description: "FK -> Licensee.id; must equal agreement.licensee_id and the caller's X-User-ID when role=Licensee" }
      - { name: period_start, type: datetime, source: input, description: "Report period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Report period end (exclusive semantics vs other reports; must be > period_start and <= current logical time)" }
      - { name: lines, type: array, source: input, description: "Array of {product_label, units_sold>=0, gross_sales_cents>=0, deductions_cents>=0 and <= gross_sales_cents, is_sublicense_revenue bool default false}; must be non-empty" }
      - { name: reported_gross_sales_cents, type: integer, source: computed, description: "Sum of gross_sales_cents over all lines" }
      - { name: reported_net_sales_cents, type: integer, source: computed, description: "Sum of (gross_sales_cents - deductions_cents) over all lines" }
      - { name: royalty_base_cents, type: integer, source: computed, description: "Base per agreement.royalty_base_definition over NON-sublicense lines only" }
      - { name: sublicense_net_sales_cents, type: integer, source: computed, description: "Sum of (gross - deductions) over sublicense-revenue lines" }
      - { name: provisional_royalty_cents, type: integer, source: computed, description: "Royalty computed at intake (no minimum floor); see royalty_due_calculation PROVISIONAL" }
      - { name: benchmark_net_sales_cents, type: integer, source: system, default: null, description: "Analyst-supplied benchmark recorded at validation" }
      - { name: adjusted_base_cents, type: integer, source: system, default: null, description: "Analyst-adjusted royalty base; set only on the FLAGGED -> ACCEPTED_WITH_ADJUSTMENT path" }
      - { name: final_royalty_cents, type: integer, source: computed, default: null, description: "Royalty recognized at acceptance (minimum floor applied); see royalty_due_calculation FINAL" }
      - { name: accepted_at, type: datetime, source: system, default: null, description: "Logical timestamp of acceptance; used by MFL lookback window" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | VALIDATED | FLAGGED | ACCEPTED | ACCEPTED_WITH_ADJUSTMENT | AUDIT_REFERRED | VOIDED", constraints: "enum: SUBMITTED, VALIDATED, FLAGGED, ACCEPTED, ACCEPTED_WITH_ADJUSTMENT, AUDIT_REFERRED, VOIDED" }

  - name: RoyaltyAudit
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id" }
      - { name: scope_period_start, type: datetime, source: input, description: "Examination window start (closed interval)" }
      - { name: scope_period_end, type: datetime, source: input, description: "Examination window end (closed interval); must be >= scope_period_start and within the audit window" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the LicensingAnalyst who opened the audit; SoD anchor for settlement ratification" }
      - { name: status, type: enum, source: system, default: INITIATED, description: "INITIATED | FIELDWORK | FINDINGS_ISSUED | CLOSED", constraints: "enum: INITIATED, FIELDWORK, FINDINGS_ISSUED, CLOSED" }

  - name: AuditFinding
    parent: null
    common_fields: true
    fields:
      - { name: audit_id, type: string, source: input, description: "FK -> RoyaltyAudit.id; audit must be in FIELDWORK" }
      - { name: report_id, type: string, source: input, description: "FK -> RoyaltyReport.id; report must belong to the audit's agreement and its period must overlap the audit scope" }
      - { name: finding_type, type: enum, source: input, description: "UNDERREPORTED_BASE | RATE_MISAPPLICATION | DEDUCTION_ABUSE | MISSING_PASS_THROUGH", constraints: "enum: UNDERREPORTED_BASE, RATE_MISAPPLICATION, DEDUCTION_ABUSE, MISSING_PASS_THROUGH" }
      - { name: audited_base_cents, type: integer, source: input, description: "Auditor-determined royalty base for the report", constraints: ">= 0" }
      - { name: shortfall_cents, type: integer, source: computed, description: "max(0, FINAL royalty recomputed at audited_base_cents - amount already recognized for the report); see shortfall_calculation" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the LicensingAnalyst who recorded the finding" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | ACCEPTED | WAIVED | DISPUTED | RESOLVED", constraints: "enum: OPEN, ACCEPTED, WAIVED, DISPUTED, RESOLVED" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: finding_id, type: string, source: system, description: "FK -> AuditFinding.id; set at dispute creation" }
      - { name: agreement_id, type: string, source: system, description: "FK -> LicenseAgreement.id; derived from finding.audit.agreement_id" }
      - { name: licensee_id, type: string, source: system, description: "FK -> Licensee.id; derived from the agreement" }
      - { name: offers, type: array, source: system, description: "Append-only array of {amount_cents, offered_by_role, offered_by_user_id, status PENDING|SUPERSEDED|ACCEPTED, created_at}; at most one PENDING" }
      - { name: settlement_amount_cents, type: integer, source: system, default: null, description: "Accepted offer amount awaiting ratification / ratified" }
      - { name: awarded_amount_cents, type: integer, source: system, default: null, description: "Arbitration award" }
      - { name: ratified_by_user_id, type: string, source: system, default: null, description: "LegalCounsel X-User-ID that ratified the settlement" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | NEGOTIATION | COUNTERED | RATIFICATION_PENDING | SETTLED | ARBITRATED", constraints: "enum: OPEN, NEGOTIATION, COUNTERED, RATIFICATION_PENDING, SETTLED, ARBITRATED" }

  - name: DistributionRun
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id" }
      - { name: period_start, type: datetime, source: input, description: "Distribution period start" }
      - { name: period_end, type: datetime, source: input, description: "Distribution period end; must be > period_start and <= current logical time" }
      - { name: pool_cents, type: integer, source: input, description: "Revenue pool to distribute; 0 < pool_cents <= agreement.undistributed_pool_cents", constraints: "> 0" }
      - { name: lines, type: array, source: computed, description: "Frozen at approve: array of {inventor_name, share_bp, amount_cents}; sum(amount_cents) == pool_cents exactly" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceOfficer who created the run" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the approving FinanceOfficer; must differ from created_by_user_id" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | POSTED | VOIDED", constraints: "enum: DRAFT, POSTED, VOIDED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Licensee
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /licensing/licensees/{id}/lifecycle action=SUSPEND"
        actor: LicensingAnalyst
        preconditions: ["licensee.status == ACTIVE"]
        side_effects: ["increments Licensee.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /licensing/licensees/{id}/lifecycle action=REINSTATE"
        actor: LicensingAnalyst
        preconditions: ["licensee.status == SUSPENDED"]
        side_effects: ["increments Licensee.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /licensing/licensees/{id}/lifecycle action=TERMINATE"
        actor: LicensingAnalyst
        preconditions: ["licensee.status == ACTIVE"]
        side_effects: ["increments Licensee.version by 1"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /licensing/licensees/{id}/lifecycle action=TERMINATE"
        actor: LicensingAnalyst
        preconditions: ["licensee.status == SUSPENDED"]
        side_effects: ["increments Licensee.version by 1"]

  - entity: LicenseAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /licensing/license-agreements/{id}/lifecycle action=ACTIVATE"
        actor: LicensingAnalyst
        preconditions:
          - "agreement.status == DRAFT"
          - "agreement.licensee.status == ACTIVE"
          - "agreement.expiration_date > current logical time"
        side_effects:
          - "MFL sweep (mfl_adjustment_calculation): for every OTHER agreement M with M.patent_reference == this.patent_reference, M.status == ACTIVE, M.mfl_clause == true, M.effective_rate > this.base_rate_bp: set M.mfl_adjusted_rate_bp = this.base_rate_bp; if M.mfl_mode == RETROACTIVE also compute credit and set M.last_mfl_credit_cents (hop 1)"
          - "RETROACTIVE credit on M adds M.last_mfl_credit_cents to M.licensee.credit_balance_cents (hop 2, caused by hop 1)"
          - "increments LicenseAgreement.version by 1"
        note: "effective_rate == mfl_adjusted_rate_bp if set else base_rate_bp"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /licensing/license-agreements/{id}/lifecycle action=SUSPEND"
        actor: LicensingAnalyst
        preconditions: ["agreement.status == ACTIVE"]
        side_effects: ["increments LicenseAgreement.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /licensing/license-agreements/{id}/lifecycle action=REINSTATE"
        actor: LicensingAnalyst
        preconditions: ["agreement.status == SUSPENDED"]
        side_effects: ["increments LicenseAgreement.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /licensing/license-agreements/{id}/lifecycle action=TERMINATE"
        actor: LicensingAnalyst
        preconditions: ["agreement.status == ACTIVE"]
        side_effects: ["increments LicenseAgreement.version by 1"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /licensing/license-agreements/{id}/lifecycle action=TERMINATE"
        actor: LicensingAnalyst
        preconditions: ["agreement.status == SUSPENDED"]
        side_effects: ["increments LicenseAgreement.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /licensing/_clock/set_current_utc advances clock past expiration_date"
        actor: system
        preconditions: ["agreement.status == ACTIVE", "agreement.expiration_date < new logical time"]
        side_effects: ["increments LicenseAgreement.version by 1"]
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system: POST /licensing/_clock/set_current_utc advances clock past expiration_date"
        actor: system
        preconditions: ["agreement.status == SUSPENDED", "agreement.expiration_date < new logical time"]
        side_effects: ["increments LicenseAgreement.version by 1"]

  - entity: Milestone
    initial_state: PENDING
    terminal_states: [ACHIEVED]
    transitions:
      - from: PENDING
        to: ACHIEVED
        trigger: "system: royalty report acceptance (milestone_trigger_check) or POST /licensing/_clock/set_current_utc for DATE milestones"
        actor: system
        preconditions:
          - "trigger_type == CUMULATIVE_SALES and agreement.cumulative_accepted_base_cents (post-acceptance) >= threshold_cents; OR trigger_type == DATE and trigger_date <= new logical time"
        side_effects:
          - "sets achieved_at"
          - "Licensee.outstanding_balance_cents += fee_cents (fee accrual; hop 3 of the acceptance cascade)"
          - "increments Milestone.version by 1"
      - from: ACHIEVED
        to: PENDING
        trigger: "system: void-acceptance of a report drops agreement.cumulative_accepted_base_cents strictly below threshold_cents"
        actor: system
        preconditions: ["trigger_type == CUMULATIVE_SALES", "agreement.cumulative_accepted_base_cents (post-void) < threshold_cents"]
        side_effects:
          - "clears achieved_at"
          - "Licensee.outstanding_balance_cents -= fee_cents (fee reversal, compensation)"
          - "increments Milestone.version by 1"

  - entity: SublicenseGrant
    initial_state: PENDING
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /licensing/sublicense-grants/{id}/decision decision=APPROVED"
        actor: LicensingAnalyst
        preconditions: ["grant.status == PENDING"]
        side_effects: ["sets decided_by_user_id", "increments SublicenseGrant.version by 1"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /licensing/sublicense-grants/{id}/decision decision=REJECTED"
        actor: LicensingAnalyst
        preconditions: ["grant.status == PENDING"]
        side_effects: ["sets decided_by_user_id", "increments SublicenseGrant.version by 1"]
      - from: APPROVED
        to: REVOKED
        trigger: "POST /licensing/sublicense-grants/{id}/decision decision=REVOKED"
        actor: LicensingAnalyst
        preconditions: ["grant.status == APPROVED"]
        side_effects: ["sets decided_by_user_id", "increments SublicenseGrant.version by 1"]

  - entity: RoyaltyReport
    initial_state: SUBMITTED
    terminal_states: [AUDIT_REFERRED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /licensing/royalty-reports/{id}/validate"
        actor: LicensingAnalyst
        preconditions:
          - "report.status == SUBMITTED"
          - "underreport_screening passes: reported_net_sales_cents >= round_half_up(benchmark_net_sales_cents * (10000 - agreement.underreport_tolerance_bp) / 10000)"
        side_effects: ["records benchmark_net_sales_cents", "increments RoyaltyReport.version by 1"]
      - from: SUBMITTED
        to: FLAGGED
        trigger: "POST /licensing/royalty-reports/{id}/validate"
        actor: LicensingAnalyst
        preconditions:
          - "report.status == SUBMITTED"
          - "underreport_screening fails: reported_net_sales_cents < round_half_up(benchmark_net_sales_cents * (10000 - agreement.underreport_tolerance_bp) / 10000)"
        side_effects: ["records benchmark_net_sales_cents", "increments RoyaltyReport.version by 1"]
      - from: VALIDATED
        to: ACCEPTED
        trigger: "POST /licensing/royalty-reports/{id}/accept (no adjusted_base_cents)"
        actor: LicensingAnalyst
        preconditions: ["report.status == VALIDATED", "adjusted_base_cents absent from request"]
        side_effects:
          - "final_royalty_cents = FINAL variant of royalty_due_calculation (floor applied); sets accepted_at"
          - "hop 1: LicenseAgreement.cumulative_accepted_base_cents += royalty_base_cents; cumulative_recognized_revenue_cents += final_royalty_cents; undistributed_pool_cents += final_royalty_cents"
          - "hop 1b: Licensee.outstanding_balance_cents += final_royalty_cents"
          - "hop 2: milestone_trigger_check fires on the updated cumulative; PENDING CUMULATIVE_SALES milestones with threshold_cents <= new cumulative become ACHIEVED"
          - "hop 3: each newly ACHIEVED milestone accrues fee_cents to Licensee.outstanding_balance_cents"
          - "increments RoyaltyReport.version by 1"
      - from: FLAGGED
        to: ACCEPTED_WITH_ADJUSTMENT
        trigger: "POST /licensing/royalty-reports/{id}/accept with adjusted_base_cents"
        actor: LicensingAnalyst
        preconditions:
          - "report.status == FLAGGED"
          - "adjusted_base_cents present and > royalty_base_cents (adjustments are upward only)"
        side_effects:
          - "sets adjusted_base_cents; final_royalty_cents = FINAL variant recomputed on adjusted_base_cents (floor applied); sets accepted_at"
          - "hop 1: LicenseAgreement.cumulative_accepted_base_cents += adjusted_base_cents; cumulative_recognized_revenue_cents += final_royalty_cents; undistributed_pool_cents += final_royalty_cents"
          - "hop 1b: Licensee.outstanding_balance_cents += final_royalty_cents"
          - "hop 2: milestone_trigger_check on updated cumulative; hop 3: milestone fee accrual"
          - "increments RoyaltyReport.version by 1"
      - from: FLAGGED
        to: AUDIT_REFERRED
        trigger: "system: POST /licensing/audits whose scope overlaps this report's period (conditional cascade on audit creation)"
        actor: system
        preconditions: ["report.status == FLAGGED", "report.agreement_id == audit.agreement_id", "report period [period_start, period_end) intersects audit scope [scope_period_start, scope_period_end]"]
        side_effects: ["increments RoyaltyReport.version by 1"]
      - from: ACCEPTED
        to: VOIDED
        trigger: "POST /licensing/royalty-reports/{id}/void-acceptance"
        actor: LicensingAnalyst
        preconditions:
          - "report.status == ACCEPTED"
          - "no AuditFinding with report_id == report.id in status OPEN or DISPUTED"
        side_effects:
          - "compensation: LicenseAgreement.cumulative_accepted_base_cents -= royalty_base_cents; cumulative_recognized_revenue_cents -= final_royalty_cents; undistributed_pool_cents -= final_royalty_cents"
          - "compensation: Licensee.outstanding_balance_cents -= final_royalty_cents"
          - "compensation: CUMULATIVE_SALES milestones ACHIEVED whose threshold_cents > new cumulative revert to PENDING and un-accrue fee_cents from Licensee.outstanding_balance_cents"
          - "increments RoyaltyReport.version by 1"
      - from: ACCEPTED_WITH_ADJUSTMENT
        to: VOIDED
        trigger: "POST /licensing/royalty-reports/{id}/void-acceptance"
        actor: LicensingAnalyst
        preconditions:
          - "report.status == ACCEPTED_WITH_ADJUSTMENT"
          - "no AuditFinding with report_id == report.id in status OPEN or DISPUTED"
        side_effects:
          - "compensation: cumulative/balance/pool debited by adjusted base and final royalty exactly as the acceptance credited them (adjusted_base_cents as the base)"
          - "compensation: milestone revert + fee un-accrual as in ACCEPTED -> VOIDED"
          - "increments RoyaltyReport.version by 1"

  - entity: RoyaltyAudit
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: FIELDWORK
        trigger: "POST /licensing/audits/{id}/advance to_state=FIELDWORK"
        actor: LicensingAnalyst
        preconditions: ["audit.status == INITIATED"]
        side_effects: ["increments RoyaltyAudit.version by 1"]
      - from: FIELDWORK
        to: FINDINGS_ISSUED
        trigger: "POST /licensing/audits/{id}/advance to_state=FINDINGS_ISSUED"
        actor: LicensingAnalyst
        preconditions: ["audit.status == FIELDWORK"]
        side_effects: ["increments RoyaltyAudit.version by 1"]
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /licensing/audits/{id}/advance to_state=CLOSED"
        actor: LicensingAnalyst
        preconditions:
          - "audit.status == FINDINGS_ISSUED"
          - "every AuditFinding with audit_id == audit.id is in a terminal status {ACCEPTED, WAIVED, RESOLVED}"
        side_effects: ["increments RoyaltyAudit.version by 1"]

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [ACCEPTED, WAIVED, RESOLVED]
    transitions:
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /licensing/audit-findings/{id}/resolution resolution=ACCEPTED"
        actor: Licensee
        preconditions:
          - "finding.status == OPEN"
          - "caller X-User-ID == finding.report.licensee_id"
        side_effects:
          - "Licensee.outstanding_balance_cents += shortfall_cents"
          - "LicenseAgreement.cumulative_recognized_revenue_cents += shortfall_cents; undistributed_pool_cents += shortfall_cents"
          - "increments AuditFinding.version by 1"
      - from: OPEN
        to: WAIVED
        trigger: "POST /licensing/audit-findings/{id}/resolution resolution=WAIVED"
        actor: LicensingAnalyst
        preconditions: ["finding.status == OPEN"]
        side_effects: ["increments AuditFinding.version by 1"]
      - from: OPEN
        to: DISPUTED
        trigger: "POST /licensing/audit-findings/{id}/dispute"
        actor: Licensee
        preconditions:
          - "finding.status == OPEN"
          - "caller X-User-ID == finding.report.licensee_id"
        side_effects:
          - "creates Dispute (status OPEN, finding_id/agreement_id/licensee_id derived)"
          - "increments AuditFinding.version by 1"
      - from: DISPUTED
        to: RESOLVED
        trigger: "system: dispute ratification (SETTLED) or arbitration (ARBITRATED)"
        actor: system
        preconditions: ["finding.status == DISPUTED"]
        side_effects: ["increments AuditFinding.version by 1"]

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [SETTLED, ARBITRATED]
    transitions:
      - from: OPEN
        to: NEGOTIATION
        trigger: "POST /licensing/disputes/{id}/offers (first offer, by LegalCounsel)"
        actor: LegalCounsel
        preconditions: ["dispute.status == OPEN", "expected_dispute_version == dispute.version"]
        side_effects: ["appends offer (PENDING)", "increments Dispute.version by 1"]
      - from: OPEN
        to: COUNTERED
        trigger: "POST /licensing/disputes/{id}/offers (first offer, by Licensee)"
        actor: Licensee
        preconditions: ["dispute.status == OPEN", "expected_dispute_version == dispute.version", "caller X-User-ID == dispute.licensee_id"]
        side_effects: ["appends offer (PENDING)", "increments Dispute.version by 1"]
      - from: NEGOTIATION
        to: COUNTERED
        trigger: "POST /licensing/disputes/{id}/offers by Licensee (counter-offer)"
        actor: Licensee
        preconditions: ["dispute.status == NEGOTIATION", "expected_dispute_version == dispute.version", "caller X-User-ID == dispute.licensee_id"]
        side_effects: ["existing PENDING offer -> SUPERSEDED", "appends new PENDING offer", "increments Dispute.version by 1"]
      - from: COUNTERED
        to: NEGOTIATION
        trigger: "POST /licensing/disputes/{id}/offers by LegalCounsel (counter-offer)"
        actor: LegalCounsel
        preconditions: ["dispute.status == COUNTERED", "expected_dispute_version == dispute.version"]
        side_effects: ["existing PENDING offer -> SUPERSEDED", "appends new PENDING offer", "increments Dispute.version by 1"]
      - from: NEGOTIATION
        to: NEGOTIATION
        trigger: "POST /licensing/disputes/{id}/offers by LegalCounsel (revises own pending offer)"
        actor: LegalCounsel
        preconditions: ["dispute.status == NEGOTIATION", "expected_dispute_version == dispute.version"]
        side_effects: ["existing PENDING offer -> SUPERSEDED", "appends new PENDING offer", "increments Dispute.version by 1"]
      - from: COUNTERED
        to: COUNTERED
        trigger: "POST /licensing/disputes/{id}/offers by Licensee (revises own pending offer)"
        actor: Licensee
        preconditions: ["dispute.status == COUNTERED", "expected_dispute_version == dispute.version", "caller X-User-ID == dispute.licensee_id"]
        side_effects: ["existing PENDING offer -> SUPERSEDED", "appends new PENDING offer", "increments Dispute.version by 1"]
      - from: NEGOTIATION
        to: RATIFICATION_PENDING
        trigger: "POST /licensing/disputes/{id}/accept-offer by Licensee (accepts counsel's pending offer)"
        actor: Licensee
        preconditions:
          - "dispute.status == NEGOTIATION (pending offer is from LegalCounsel)"
          - "exactly one offer with status PENDING exists"
          - "caller X-User-ID == dispute.licensee_id"
        side_effects: ["PENDING offer -> ACCEPTED", "sets settlement_amount_cents = accepted offer amount_cents", "increments Dispute.version by 1"]
      - from: COUNTERED
        to: RATIFICATION_PENDING
        trigger: "POST /licensing/disputes/{id}/accept-offer by LegalCounsel (accepts licensee's pending offer)"
        actor: LegalCounsel
        preconditions:
          - "dispute.status == COUNTERED (pending offer is from Licensee)"
          - "exactly one offer with status PENDING exists"
        side_effects: ["PENDING offer -> ACCEPTED", "sets settlement_amount_cents", "increments Dispute.version by 1"]
      - from: RATIFICATION_PENDING
        to: SETTLED
        trigger: "POST /licensing/disputes/{id}/ratify"
        actor: LegalCounsel
        preconditions:
          - "dispute.status == RATIFICATION_PENDING"
          - "SoD: caller X-User-ID != dispute.finding.audit.opened_by_user_id"
        side_effects:
          - "sets ratified_by_user_id"
          - "finding DISPUTED -> RESOLVED"
          - "Licensee.outstanding_balance_cents += settlement_amount_cents"
          - "LicenseAgreement.cumulative_recognized_revenue_cents += settlement_amount_cents; undistributed_pool_cents += settlement_amount_cents"
          - "increments Dispute.version by 1"
      - from: NEGOTIATION
        to: ARBITRATED
        trigger: "POST /licensing/disputes/{id}/arbitrate"
        actor: LegalCounsel
        preconditions: ["dispute.status == NEGOTIATION", "awarded_amount_cents >= 0"]
        side_effects:
          - "sets awarded_amount_cents; any PENDING offer -> SUPERSEDED"
          - "finding DISPUTED -> RESOLVED"
          - "Licensee.outstanding_balance_cents += awarded_amount_cents"
          - "LicenseAgreement.cumulative_recognized_revenue_cents += awarded_amount_cents; undistributed_pool_cents += awarded_amount_cents"
          - "increments Dispute.version by 1"
      - from: COUNTERED
        to: ARBITRATED
        trigger: "POST /licensing/disputes/{id}/arbitrate"
        actor: LegalCounsel
        preconditions: ["dispute.status == COUNTERED", "awarded_amount_cents >= 0"]
        side_effects:
          - "sets awarded_amount_cents; any PENDING offer -> SUPERSEDED"
          - "finding DISPUTED -> RESOLVED"
          - "Licensee.outstanding_balance_cents += awarded_amount_cents"
          - "LicenseAgreement.cumulative_recognized_revenue_cents += awarded_amount_cents; undistributed_pool_cents += awarded_amount_cents"
          - "increments Dispute.version by 1"

  - entity: DistributionRun
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /licensing/distribution-runs/{id}/approve"
        actor: FinanceOfficer
        preconditions:
          - "run.status == DRAFT"
          - "SoD: caller X-User-ID != run.created_by_user_id"
          - "run.pool_cents <= agreement.undistributed_pool_cents (re-checked at approval)"
        side_effects:
          - "freezes lines via inventor_share_distribution (sum(lines.amount_cents) == pool_cents exactly)"
          - "sets approved_by_user_id"
          - "LicenseAgreement.undistributed_pool_cents -= pool_cents"
          - "increments DistributionRun.version by 1"
      - from: POSTED
        to: VOIDED
        trigger: "POST /licensing/distribution-runs/{id}/void"
        actor: FinanceOfficer
        preconditions: ["run.status == POSTED"]
        side_effects:
          - "compensation: LicenseAgreement.undistributed_pool_cents += pool_cents (pool restored)"
          - "increments DistributionRun.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-patch-stale-version
    parent_entity: LicenseAgreement
    write_endpoint: "PATCH /licensing/license-agreements/{id}"
    occ_field: expected_agreement_version
    description: |
      Amending a LicenseAgreement whose version has advanced since the client
      last observed it is rejected. The client's terms view is stale because a
      prior PATCH or lifecycle action legitimately rewrote the agreement.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: dispute-offer-stale-version
    parent_entity: Dispute
    write_endpoint: "POST /licensing/disputes/{id}/offers"
    occ_field: expected_dispute_version
    description: |
      Submitting a settlement offer against a Dispute whose version has
      advanced since the client last observed it is rejected. A prior offer
      legitimately superseded the pending round, so the client's view of the
      negotiation is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: royalty_base_derivation
    trigger: "on RoyaltyReport creation"
    algorithm: aggregation
    formula: |
      non_sub_lines = lines where is_sublicense_revenue == false
      sub_lines     = lines where is_sublicense_revenue == true
      royalty_base_cents =
        if agreement.royalty_base_definition == NET_SALES: sum(l.gross_sales_cents - l.deductions_cents for l in non_sub_lines)
        else (GROSS_SALES):                                sum(l.gross_sales_cents for l in non_sub_lines)
      sublicense_net_sales_cents = sum(l.gross_sales_cents - l.deductions_cents for l in sub_lines)
      reported_gross_sales_cents = sum(l.gross_sales_cents for l in lines)
      reported_net_sales_cents   = sum(l.gross_sales_cents - l.deductions_cents for l in lines)
    input_set: "all lines on the submitted report; sublicense-revenue lines are excluded from royalty_base_cents and feed only the pass-through component"
    precision: "integer cents; no rounding (pure sums)"

  - name: royalty_due_calculation
    trigger: "PROVISIONAL at RoyaltyReport creation; FINAL at acceptance (accept endpoint) and at finding shortfall recomputation"
    algorithm: tiered_pricing
    formula: |
      effective_rate_bp = agreement.mfl_adjusted_rate_bp if not null else agreement.base_rate_bp
      product_royalty_cents = round_half_up(base_cents * effective_rate_bp / 10000)
      passthrough_royalty_cents = round_half_up(sublicense_net_sales_cents * agreement.sublicense_passthrough_rate_bp / 10000)
      computed_cents = product_royalty_cents + passthrough_royalty_cents
      FINAL: final_royalty_cents = max(computed_cents, agreement.minimum_period_royalty_cents)
      where base_cents = adjusted_base_cents if the FLAGGED->ACCEPTED_WITH_ADJUSTMENT path else royalty_base_cents
    input_set: "the single report being accepted; non-sublicense base + sublicense lines; agreement rate/floor config"
    constants:
      BP_DENOMINATOR: 10000
    precision: "2 decimal places expressed as integer cents; round_half_up per component (product and passthrough rounded separately) THEN summed — rounding order pinned"
    variants:
      - name: PROVISIONAL
        when: "at report creation (intake)"
        difference: "no minimum floor: provisional_royalty_cents = computed_cents (no max with minimum_period_royalty_cents)"
      - name: FINAL
        when: "at acceptance / shortfall recomputation"
        difference: "floor applied: final = max(computed_cents, minimum_period_royalty_cents); differs from PROVISIONAL whenever computed < minimum"

  - name: underreport_screening
    trigger: "POST /licensing/royalty-reports/{id}/validate"
    algorithm: threshold
    formula: |
      threshold_cents = round_half_up(benchmark_net_sales_cents * (10000 - agreement.underreport_tolerance_bp) / 10000)
      if reported_net_sales_cents < threshold_cents: FLAGGED else VALIDATED
    input_set: "the report under validation; benchmark supplied in the request; agreement.underreport_tolerance_bp"
    constants:
      BP_DENOMINATOR: 10000
    precision: "integer cents, round_half_up for the threshold; boundary is INCLUSIVE-pass: reported == threshold -> VALIDATED"
    variants: []

  - name: milestone_trigger_check
    trigger: "after each royalty report acceptance (on updated cumulative) and on clock-set for DATE milestones"
    algorithm: threshold
    formula: |
      for each Milestone m of the agreement with m.status == PENDING, processed in m.created_at ASC order:
        if m.trigger_type == CUMULATIVE_SALES and agreement.cumulative_accepted_base_cents >= m.threshold_cents: ACHIEVE
        if m.trigger_type == DATE and m.trigger_date <= current logical time: ACHIEVE
      achievement accrues m.fee_cents to Licensee.outstanding_balance_cents
      boundary is INCLUSIVE: cumulative exactly == threshold_cents achieves
    input_set: "PENDING milestones of the report's agreement only"
    precision: "integer cents; threshold comparison >= (inclusive)"

  - name: shortfall_calculation
    trigger: "on AuditFinding creation"
    algorithm: aggregation
    formula: |
      recognized_cents = report.final_royalty_cents if report.status in {ACCEPTED, ACCEPTED_WITH_ADJUSTMENT} else 0
      recomputed = FINAL royalty_due_calculation with base_cents = audited_base_cents
        (sublicense passthrough component of the original report retained unchanged)
      shortfall_cents = max(0, recomputed - recognized_cents)
    input_set: "the finding's report and the agreement's rate/floor config"
    precision: "integer cents, round_half_up inside the recomputation"
    variants: []

  - name: mfl_adjustment_calculation
    trigger: "on LicenseAgreement activation when the newly activated agreement's base_rate_bp is below another ACTIVE mfl_clause agreement's effective rate for the same patent_reference"
    algorithm: aggregation
    formula: |
      for each affected agreement M (status ACTIVE, mfl_clause true, same patent_reference,
      M.effective_rate > new_agreement.base_rate_bp), processed in M.created_at ASC order:
        new_rate = new_agreement.base_rate_bp
        if M.mfl_mode == RETROACTIVE:
          window_start = add_months(current logical time, -3 * M.mfl_lookback_quarters)
          credit = sum over M's reports r with r.status in {ACCEPTED, ACCEPTED_WITH_ADJUSTMENT}
                   and r.accepted_at >= window_start of:
            max(0, r.final_royalty_cents - max(round_half_up(r_base * new_rate / 10000) + r_passthrough, M.minimum_period_royalty_cents))
            where r_base = r.adjusted_base_cents if not null else r.royalty_base_cents
                  r_passthrough = round_half_up(r.sublicense_net_sales_cents * M.sublicense_passthrough_rate_bp / 10000)
          M.last_mfl_credit_cents = credit
          M.licensee.credit_balance_cents += credit
        M.mfl_adjusted_rate_bp = new_rate   # both variants re-rate point-forward
    input_set: "other ACTIVE mfl_clause agreements on the same patent_reference; their accepted reports within the lookback window"
    precision: "integer cents, round_half_up per recomputed component"
    variants:
      - name: RETROACTIVE
        when: "M.mfl_mode == RETROACTIVE"
        difference: "grants last_mfl_credit_cents > 0 credit to the licensee for the lookback window"
      - name: PROSPECTIVE
        when: "M.mfl_mode == PROSPECTIVE"
        difference: "no credit (last_mfl_credit_cents stays 0); only the point-forward rate changes"

  - name: inventor_share_distribution
    trigger: "on DistributionRun approval (DRAFT -> POSTED); lines frozen at that moment"
    algorithm: waterfall_allocation
    formula: |
      # rounding order PINNED: per-line round_half_up first, then remainder fix-up
      for each share s in agreement.inventor_shares (order preserved):
        s.amount_cents = round_half_up(run.pool_cents * s.share_bp / 10000)
      remainder = run.pool_cents - sum(s.amount_cents)
      # remainder is a small integer (|remainder| <= len(shares)); distribute one cent at a time
      order = inventor_shares sorted by share_bp DESC, tie-break inventor_name ASC (lexicographic)
      if remainder > 0: add 1 cent to the first `remainder` entries in `order`
      if remainder < 0: subtract 1 cent from the first `|remainder|` entries in `order` (reverse order: smallest share first)
      INVARIANT: sum(lines.amount_cents) == run.pool_cents exactly
    input_set: "the run's pool_cents and the agreement's inventor_shares (sum(share_bp) == 10000 enforced at agreement write time)"
    constants:
      BP_DENOMINATOR: 10000
    precision: "integer cents; per-line round_half_up, then exact remainder allocation — sum is exact by construction"

  - name: audit_window_check
    trigger: "POST /licensing/audits"
    algorithm: threshold
    formula: |
      cutoff = add_months(current logical time, -agreement.audit_window_months)
      allowed iff scope_period_end >= cutoff   # boundary INCLUSIVE: scope ending exactly on cutoff is auditable
      else ERR_AUDIT_WINDOW_EXPIRED
    input_set: "the requested audit scope; agreement.audit_window_months; current logical time"
    precision: "date-granular comparison on ISO dates (inclusive >=)"

  - name: revenue_recognition_posting
    trigger: "report acceptance, finding acceptance, settlement ratification, arbitration, distribution approve/void"
    algorithm: aggregation
    formula: |
      recognized_delta(source) =
        report acceptance      -> +final_royalty_cents
        finding ACCEPTED       -> +shortfall_cents
        dispute SETTLED        -> +settlement_amount_cents
        dispute ARBITRATED     -> +awarded_amount_cents
        void-acceptance        -> -final_royalty_cents
      agreement.cumulative_recognized_revenue_cents += delta
      agreement.undistributed_pool_cents += delta
      distribution approve: undistributed_pool_cents -= pool_cents ; void: += pool_cents
    input_set: "the single posting event"
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role; X-User-ID present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role permitted for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path identifiers resolved left-to-right; body FK references exist", error_id: ERR_AGREEMENT_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a LicenseAgreement" }
  - { priority: 3, category: existence, check: "licensee id exists", error_id: ERR_LICENSEE_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a Licensee" }
  - { priority: 3, category: existence, check: "report id exists", error_id: ERR_REPORT_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a RoyaltyReport" }
  - { priority: 3, category: existence, check: "audit id exists", error_id: ERR_AUDIT_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a RoyaltyAudit" }
  - { priority: 3, category: existence, check: "finding id exists", error_id: ERR_FINDING_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing an AuditFinding" }
  - { priority: 3, category: existence, check: "dispute id exists", error_id: ERR_DISPUTE_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a Dispute" }
  - { priority: 3, category: existence, check: "sublicense grant id exists", error_id: ERR_SUBLICENSE_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a SublicenseGrant" }
  - { priority: 3, category: existence, check: "distribution run id exists", error_id: ERR_RUN_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a DistributionRun" }
  - { priority: 4, category: auth, check: "ownership: role=Licensee may only act on resources whose licensee_id == X-User-ID (report submit, sublicense request, finding ACCEPTED/dispute, dispute offers/accept, GET /licensees/{id})", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "Licensee-scoped endpoints" }
  - { priority: 5, category: business_constraint, check: "request body schema: required fields present, types valid, enum members valid, no undeclared fields, conditional-required fields (milestone threshold_cents iff CUMULATIVE_SALES, trigger_date iff DATE; adjusted_base_cents required iff report FLAGGED, forbidden iff report VALIDATED)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "Licensee status == ACTIVE for report submission and sublicense requests", error_id: ERR_LICENSEE_NOT_ACTIVE, http_status: 409, applies_to: ["POST /licensing/royalty-reports", "POST /licensing/sublicense-grants"] }
  - { priority: 7, category: state, check: "LicenseAgreement status == ACTIVE for report submission and sublicense requests; status in {DRAFT, ACTIVE} for milestone creation; status != DRAFT for audits and distribution runs", error_id: ERR_AGREEMENT_NOT_ACTIVE, http_status: 409, applies_to: ["POST /licensing/royalty-reports", "POST /licensing/sublicense-grants", "POST /licensing/milestones", "POST /licensing/audits", "POST /licensing/distribution-runs"] }
  - { priority: 8, category: state, check: "report in correct state for the action (validate: SUBMITTED; accept: VALIDATED|FLAGGED; void-acceptance: ACCEPTED|ACCEPTED_WITH_ADJUSTMENT with no OPEN/DISPUTED findings)", error_id: ERR_REPORT_INVALID_STATE, http_status: 409, applies_to: ["POST /licensing/royalty-reports/{id}/validate", "POST /licensing/royalty-reports/{id}/accept", "POST /licensing/royalty-reports/{id}/void-acceptance"] }
  - { priority: 8, category: state, check: "audit in correct state for advance (INITIATED->FIELDWORK->FINDINGS_ISSUED->CLOSED) and for finding creation (FIELDWORK); close requires all findings terminal", error_id: ERR_AUDIT_INVALID_STATE, http_status: 409, applies_to: ["POST /licensing/audits/{id}/advance", "POST /licensing/audit-findings"] }
  - { priority: 8, category: state, check: "finding status == OPEN for resolution and dispute", error_id: ERR_FINDING_NOT_OPEN, http_status: 409, applies_to: ["POST /licensing/audit-findings/{id}/resolution", "POST /licensing/audit-findings/{id}/dispute"] }
  - { priority: 8, category: state, check: "dispute in correct state for offers (OPEN|NEGOTIATION|COUNTERED), accept-offer (NEGOTIATION|COUNTERED with exactly one PENDING offer), ratify (RATIFICATION_PENDING), arbitrate (NEGOTIATION|COUNTERED)", error_id: ERR_DISPUTE_INVALID_STATE, http_status: 409, applies_to: ["POST /licensing/disputes/{id}/offers", "POST /licensing/disputes/{id}/accept-offer", "POST /licensing/disputes/{id}/ratify", "POST /licensing/disputes/{id}/arbitrate"] }
  - { priority: 8, category: state, check: "distribution run in correct state (approve: DRAFT; void: POSTED)", error_id: ERR_RUN_INVALID_STATE, http_status: 409, applies_to: ["POST /licensing/distribution-runs/{id}/approve", "POST /licensing/distribution-runs/{id}/void"] }
  - { priority: 8, category: state, check: "sublicense grant in correct state for decision (APPROVED|REJECTED from PENDING; REVOKED from APPROVED)", error_id: ERR_SUBLICENSE_INVALID_STATE, http_status: 409, applies_to: ["POST /licensing/sublicense-grants/{id}/decision"] }
  - { priority: 9, category: business_safety, check: "segregation of duties: ratify caller != audit.opened_by_user_id; distribution approve caller != run.created_by_user_id", error_id: ERR_SOD_CONFLICT, http_status: 409, applies_to: ["POST /licensing/disputes/{id}/ratify", "POST /licensing/distribution-runs/{id}/approve"] }
  - { priority: 10, category: business_constraint, check: "no period overlap: new report [period_start, period_end) must not half-open-overlap any report of the same agreement in {SUBMITTED, VALIDATED, FLAGGED, ACCEPTED, ACCEPTED_WITH_ADJUSTMENT, AUDIT_REFERRED}; adjacency (start == other end) allowed", error_id: ERR_REPORT_PERIOD_OVERLAP, http_status: 409, applies_to: ["POST /licensing/royalty-reports"] }
  - { priority: 10, category: business_constraint, check: "no audit scope overlap: new audit [scope_period_start, scope_period_end] (CLOSED interval) must not overlap any audit of the same agreement in {INITIATED, FIELDWORK, FINDINGS_ISSUED}; touching endpoints count as overlap", error_id: ERR_AUDIT_SCOPE_OVERLAP, http_status: 409, applies_to: ["POST /licensing/audits"] }
  - { priority: 10, category: business_constraint, check: "inventor_shares share_bp values sum to exactly 10000 and inventor_name unique per agreement", error_id: ERR_SHARE_SUM_INVALID, http_status: 422, applies_to: ["POST /licensing/license-agreements", "PATCH /licensing/license-agreements/{id}"] }
  - { priority: 10, category: business_constraint, check: "sublicense grant requires agreement.sublicense_allowed == true", error_id: ERR_SUBLICENSING_NOT_GRANTED, http_status: 422, applies_to: ["POST /licensing/sublicense-grants"] }
  - { priority: 10, category: business_constraint, check: "duplicate licensee tax_id rejected", error_id: ERR_DUPLICATE_TAX_ID, http_status: 409, applies_to: ["POST /licensing/licensees"] }
  - { priority: 10, category: business_constraint, check: "accept-offer actor must be the opposite role of the PENDING offer's offered_by_role", error_id: ERR_CANNOT_ACCEPT_OWN_OFFER, http_status: 422, applies_to: ["POST /licensing/disputes/{id}/accept-offer"] }
  - { priority: 11, category: business_temporal, check: "report period_end <= current logical time; distribution period_end <= current logical time", error_id: ERR_PERIOD_NOT_CLOSED, http_status: 422, applies_to: ["POST /licensing/royalty-reports", "POST /licensing/distribution-runs"] }
  - { priority: 11, category: business_temporal, check: "audit_window_check: scope_period_end >= add_months(now, -audit_window_months)", error_id: ERR_AUDIT_WINDOW_EXPIRED, http_status: 422, applies_to: ["POST /licensing/audits"] }
  - { priority: 12, category: business_referential, check: "finding.report_id must reference a report of the audit's agreement whose period overlaps the audit scope and whose status is in {FLAGGED, AUDIT_REFERRED, ACCEPTED, ACCEPTED_WITH_ADJUSTMENT}", error_id: ERR_REPORT_NOT_IN_AUDIT_SCOPE, http_status: 422, applies_to: ["POST /licensing/audit-findings"] }
  - { priority: 12, category: business_referential, check: "a report line with is_sublicense_revenue=true requires at least one SublicenseGrant of the agreement in APPROVED status", error_id: ERR_NO_APPROVED_SUBLICENSE, http_status: 422, applies_to: ["POST /licensing/royalty-reports"] }
  - { priority: 12, category: business_referential, check: "report.licensee_id must equal agreement.licensee_id", error_id: ERR_VALIDATION, http_status: 400, applies_to: ["POST /licensing/royalty-reports"] }
  - { priority: 13, category: business_fiscal, check: "adjusted_base_cents > royalty_base_cents on the FLAGGED accept path (upward only)", error_id: ERR_ADJUSTMENT_NOT_UPWARD, http_status: 422, applies_to: ["POST /licensing/royalty-reports/{id}/accept"] }
  - { priority: 13, category: business_fiscal, check: "run.pool_cents <= agreement.undistributed_pool_cents (checked at creation and re-checked at approval)", error_id: ERR_POOL_EXCEEDS_UNDISTRIBUTED, http_status: 422, applies_to: ["POST /licensing/distribution-runs", "POST /licensing/distribution-runs/{id}/approve"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/licensing/licensees", description: "Create a licensee", roles: [LicensingAnalyst], code: 201, input: [legal_name, tax_id, contact_email], output: Licensee, side_effects: ["status=ACTIVE; balances 0"] }
  - { method: GET, path: "/licensing/licensees", description: "List licensees", roles: [LicensingAnalyst, LegalCounsel, FinanceOfficer, IPAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "Licensee[]", side_effects: [] }
  - { method: GET, path: "/licensing/licensees/{id}", description: "Get a licensee; Licensee role restricted to own id", roles: [LicensingAnalyst, LegalCounsel, FinanceOfficer, Licensee], code: 200, input: [], output: Licensee, side_effects: [] }
  - { method: POST, path: "/licensing/licensees/{id}/lifecycle", description: "Licensee lifecycle action", roles: [LicensingAnalyst], code: 200, input: [action], output: Licensee, side_effects: ["Licensee status transition per action SUSPEND|REINSTATE|TERMINATE", "increments Licensee.version by 1"] }

  - { method: POST, path: "/licensing/license-agreements", description: "Create a license agreement (DRAFT)", roles: [LicensingAnalyst], code: 201, input: [licensee_id, patent_reference, title, royalty_base_definition, base_rate_bp, "minimum_period_royalty_cents?", "sublicense_allowed?", "sublicense_passthrough_rate_bp?", "mfl_clause?", "mfl_mode?", "mfl_lookback_quarters?", "audit_window_months?", "underreport_tolerance_bp?", inventor_shares, effective_date, expiration_date], output: LicenseAgreement, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/licensing/license-agreements", description: "List agreements with filters", roles: [LicensingAnalyst, LegalCounsel, FinanceOfficer, Licensee, IPAdmin], code: 200, input: ["licensee_id?", "status?", "patent_reference?", "limit?", "offset?"], output: "LicenseAgreement[]", side_effects: [] }
  - { method: GET, path: "/licensing/license-agreements/{id}", description: "Get one agreement; Licensee restricted to own agreements", roles: [LicensingAnalyst, LegalCounsel, FinanceOfficer, Licensee], code: 200, input: [], output: LicenseAgreement, side_effects: [] }
  - { method: PATCH, path: "/licensing/license-agreements/{id}", description: "Amend agreement terms; only while DRAFT or ACTIVE; OCC-guarded", roles: [LicensingAnalyst], code: 200, input: [expected_agreement_version, "royalty_base_definition?", "base_rate_bp?", "minimum_period_royalty_cents?", "sublicense_allowed?", "sublicense_passthrough_rate_bp?", "mfl_clause?", "mfl_mode?", "mfl_lookback_quarters?", "audit_window_months?", "underreport_tolerance_bp?", "inventor_shares?", "expiration_date?"], output: LicenseAgreement, side_effects: ["increments LicenseAgreement.version by 1"] }
  - { method: POST, path: "/licensing/license-agreements/{id}/lifecycle", description: "Agreement lifecycle action ACTIVATE|SUSPEND|REINSTATE|TERMINATE; ACTIVATE runs the MFL sweep", roles: [LicensingAnalyst], code: 200, input: [action], output: LicenseAgreement, side_effects: ["status transition per state machine", "MFL sweep side effects on ACTIVATE", "increments LicenseAgreement.version by 1"] }

  - { method: POST, path: "/licensing/milestones", description: "Create a milestone on an agreement (DRAFT or ACTIVE)", roles: [LicensingAnalyst], code: 201, input: [agreement_id, name, trigger_type, "threshold_cents?", "trigger_date?", fee_cents], output: Milestone, side_effects: ["status=PENDING"] }
  - { method: GET, path: "/licensing/milestones", description: "List milestones", roles: [LicensingAnalyst, LegalCounsel, FinanceOfficer, Licensee], code: 200, input: [agreement_id, "status?", "limit?", "offset?"], output: "Milestone[]", side_effects: [] }
  - { method: GET, path: "/licensing/milestones/{id}", description: "Get one milestone", roles: [LicensingAnalyst, LegalCounsel, FinanceOfficer, Licensee], code: 200, input: [], output: Milestone, side_effects: [] }

  - { method: POST, path: "/licensing/sublicense-grants", description: "Licensee requests a sublicense grant", roles: [Licensee], code: 201, input: [agreement_id, sublicensee_name, territory], output: SublicenseGrant, side_effects: ["status=PENDING"] }
  - { method: GET, path: "/licensing/sublicense-grants", description: "List sublicense grants", roles: [LicensingAnalyst, LegalCounsel, Licensee], code: 200, input: [agreement_id, "status?", "limit?", "offset?"], output: "SublicenseGrant[]", side_effects: [] }
  - { method: GET, path: "/licensing/sublicense-grants/{id}", description: "Get one sublicense grant; Licensee restricted to own agreements' grants", roles: [LicensingAnalyst, LegalCounsel, Licensee], code: 200, input: [], output: SublicenseGrant, side_effects: [] }
  - { method: POST, path: "/licensing/sublicense-grants/{id}/decision", description: "Analyst decides: APPROVED|REJECTED from PENDING; REVOKED from APPROVED", roles: [LicensingAnalyst], code: 200, input: [decision], output: SublicenseGrant, side_effects: ["status transition", "sets decided_by_user_id", "increments SublicenseGrant.version by 1"] }

  - { method: POST, path: "/licensing/royalty-reports", description: "Licensee submits a royalty report with lines; provisional royalty computed", roles: [Licensee], code: 201, input: [agreement_id, licensee_id, period_start, period_end, lines], output: RoyaltyReport, side_effects: ["royalty_base_derivation", "royalty_due_calculation PROVISIONAL", "status=SUBMITTED"] }
  - { method: GET, path: "/licensing/royalty-reports", description: "List royalty reports", roles: [LicensingAnalyst, LegalCounsel, FinanceOfficer, Licensee], code: 200, input: ["agreement_id?", "licensee_id?", "status?", "limit?", "offset?"], output: "RoyaltyReport[]", side_effects: [] }
  - { method: GET, path: "/licensing/royalty-reports/{id}", description: "Get one report; Licensee restricted to own reports", roles: [LicensingAnalyst, LegalCounsel, FinanceOfficer, Licensee], code: 200, input: [], output: RoyaltyReport, side_effects: [] }
  - { method: POST, path: "/licensing/royalty-reports/{id}/validate", description: "Analyst validates intake with an external benchmark; outcome VALIDATED or FLAGGED", roles: [LicensingAnalyst], code: 200, input: [benchmark_net_sales_cents], output: RoyaltyReport, side_effects: ["underreport_screening", "increments RoyaltyReport.version by 1"] }
  - { method: POST, path: "/licensing/royalty-reports/{id}/accept", description: "Accept a VALIDATED report (no adjusted_base_cents) or a FLAGGED report (adjusted_base_cents required, upward only)", roles: [LicensingAnalyst], code: 200, input: ["adjusted_base_cents?"], output: RoyaltyReport, side_effects: ["royalty_due_calculation FINAL", "cascade: agreement cumulative/pool/balance updates", "milestone_trigger_check + fee accrual", "increments RoyaltyReport.version by 1"] }
  - { method: POST, path: "/licensing/royalty-reports/{id}/void-acceptance", description: "Compensating reversal of an acceptance", roles: [LicensingAnalyst], code: 200, input: [reason], output: RoyaltyReport, side_effects: ["reverses cumulative/pool/balance postings", "reverts milestones below threshold and un-accrues fees", "increments RoyaltyReport.version by 1"] }

  - { method: POST, path: "/licensing/audits", description: "Open a royalty audit; FLAGGED reports of the agreement overlapping scope become AUDIT_REFERRED", roles: [LicensingAnalyst], code: 201, input: [agreement_id, scope_period_start, scope_period_end], output: RoyaltyAudit, side_effects: ["status=INITIATED", "opened_by_user_id set", "conditional cascade: FLAGGED reports in scope -> AUDIT_REFERRED"] }
  - { method: GET, path: "/licensing/audits", description: "List audits", roles: [LicensingAnalyst, LegalCounsel], code: 200, input: ["agreement_id?", "status?", "limit?", "offset?"], output: "RoyaltyAudit[]", side_effects: [] }
  - { method: GET, path: "/licensing/audits/{id}", description: "Get one audit", roles: [LicensingAnalyst, LegalCounsel], code: 200, input: [], output: RoyaltyAudit, side_effects: [] }
  - { method: POST, path: "/licensing/audits/{id}/advance", description: "Advance audit INITIATED->FIELDWORK->FINDINGS_ISSUED->CLOSED", roles: [LicensingAnalyst], code: 200, input: [to_state], output: RoyaltyAudit, side_effects: ["status transition", "increments RoyaltyAudit.version by 1"] }

  - { method: POST, path: "/licensing/audit-findings", description: "Record an audit finding during FIELDWORK; shortfall computed", roles: [LicensingAnalyst], code: 201, input: [audit_id, report_id, finding_type, audited_base_cents], output: AuditFinding, side_effects: ["shortfall_calculation", "status=OPEN", "recorded_by_user_id set"] }
  - { method: GET, path: "/licensing/audit-findings", description: "List findings", roles: [LicensingAnalyst, LegalCounsel, Licensee], code: 200, input: ["audit_id?", "report_id?", "status?", "limit?", "offset?"], output: "AuditFinding[]", side_effects: [] }
  - { method: GET, path: "/licensing/audit-findings/{id}", description: "Get one finding; Licensee restricted to own findings", roles: [LicensingAnalyst, LegalCounsel, Licensee], code: 200, input: [], output: AuditFinding, side_effects: [] }
  - { method: POST, path: "/licensing/audit-findings/{id}/resolution", description: "Resolve a finding: ACCEPTED (Licensee owner) or WAIVED (LicensingAnalyst)", roles: [LicensingAnalyst, Licensee], code: 200, input: [resolution], output: AuditFinding, side_effects: ["ACCEPTED: balance += shortfall, recognized += shortfall, pool += shortfall", "increments AuditFinding.version by 1"] }
  - { method: POST, path: "/licensing/audit-findings/{id}/dispute", description: "Licensee disputes a finding; creates the Dispute", roles: [Licensee], code: 201, input: [], output: Dispute, side_effects: ["finding OPEN -> DISPUTED", "creates Dispute OPEN with derived FKs"] }

  - { method: GET, path: "/licensing/disputes", description: "List disputes", roles: [LicensingAnalyst, LegalCounsel, Licensee], code: 200, input: ["finding_id?", "agreement_id?", "licensee_id?", "status?", "limit?", "offset?"], output: "Dispute[]", side_effects: [] }
  - { method: GET, path: "/licensing/disputes/{id}", description: "Get one dispute; Licensee restricted to own disputes", roles: [LicensingAnalyst, LegalCounsel, Licensee], code: 200, input: [], output: Dispute, side_effects: [] }
  - { method: POST, path: "/licensing/disputes/{id}/offers", description: "Submit a settlement offer; supersedes any PENDING offer; OCC-guarded; counsel offer -> NEGOTIATION, licensee offer -> COUNTERED", roles: [LegalCounsel, Licensee], code: 201, input: [amount_cents, expected_dispute_version], output: Dispute, side_effects: ["PENDING offer superseded", "offer appended", "status NEGOTIATION (counsel) or COUNTERED (licensee)", "increments Dispute.version by 1"] }
  - { method: POST, path: "/licensing/disputes/{id}/accept-offer", description: "Counterparty accepts the PENDING offer", roles: [LegalCounsel, Licensee], code: 200, input: [], output: Dispute, side_effects: ["offer ACCEPTED", "settlement_amount_cents set", "status RATIFICATION_PENDING", "increments Dispute.version by 1"] }
  - { method: POST, path: "/licensing/disputes/{id}/ratify", description: "Counsel ratifies the settlement; SoD vs audit opener", roles: [LegalCounsel], code: 200, input: [], output: Dispute, side_effects: ["status SETTLED", "finding RESOLVED", "balance/recognized/pool += settlement_amount_cents", "increments Dispute.version by 1"] }
  - { method: POST, path: "/licensing/disputes/{id}/arbitrate", description: "Binding arbitration award", roles: [LegalCounsel], code: 200, input: [awarded_amount_cents], output: Dispute, side_effects: ["status ARBITRATED", "finding RESOLVED", "balance/recognized/pool += awarded_amount_cents", "increments Dispute.version by 1"] }

  - { method: POST, path: "/licensing/distribution-runs", description: "Create an inventor distribution run (DRAFT)", roles: [FinanceOfficer], code: 201, input: [agreement_id, period_start, period_end, pool_cents], output: DistributionRun, side_effects: ["status=DRAFT", "created_by_user_id set"] }
  - { method: GET, path: "/licensing/distribution-runs", description: "List distribution runs", roles: [FinanceOfficer, LicensingAnalyst], code: 200, input: ["agreement_id?", "status?", "limit?", "offset?"], output: "DistributionRun[]", side_effects: [] }
  - { method: GET, path: "/licensing/distribution-runs/{id}", description: "Get one run", roles: [FinanceOfficer, LicensingAnalyst], code: 200, input: [], output: DistributionRun, side_effects: [] }
  - { method: POST, path: "/licensing/distribution-runs/{id}/approve", description: "Approve and post the run; SoD: approver != creator; freezes inventor lines", roles: [FinanceOfficer], code: 200, input: [], output: DistributionRun, side_effects: ["inventor_share_distribution", "status POSTED", "pool debited", "increments DistributionRun.version by 1"] }
  - { method: POST, path: "/licensing/distribution-runs/{id}/void", description: "Void a POSTED run; restores the undistributed pool", roles: [FinanceOfficer], code: 200, input: [reason], output: DistributionRun, side_effects: ["status VOIDED", "pool restored", "increments DistributionRun.version by 1"] }

  - { method: POST, path: "/licensing/_clock/set_current_utc", description: "Test-driving logical clock. Server default before any call: 2026-08-01T00:00:00Z (never wall-clock). Advancing expires agreements past expiration_date and achieves due DATE milestones (with fee accrual).", roles: [IPAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: datetime }", side_effects: ["agreement auto-EXPIRED sweep", "DATE milestone achievement + fee accrual"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "role not permitted for the endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Licensee role acting on a resource whose licensee_id != X-User-ID" }
  - { id: ERR_VALIDATION, http: 400, condition: "schema violation: missing/invalid/undeclared fields, bad enum, conditional-required violation" }
  - { id: ERR_LICENSEE_NOT_FOUND, http: 404, condition: "licensee id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "agreement id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "royalty report id does not exist" }
  - { id: ERR_AUDIT_NOT_FOUND, http: 404, condition: "audit id does not exist" }
  - { id: ERR_FINDING_NOT_FOUND, http: 404, condition: "audit finding id does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "dispute id does not exist" }
  - { id: ERR_SUBLICENSE_NOT_FOUND, http: 404, condition: "sublicense grant id does not exist" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "distribution run id does not exist" }
  - { id: ERR_LICENSEE_NOT_ACTIVE, http: 409, condition: "licensee not ACTIVE for report submission or sublicense request" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "agreement not in the required status for the operation (ACTIVE for reports/sublicenses; DRAFT|ACTIVE for milestones; non-DRAFT for audits/runs)" }
  - { id: ERR_REPORT_INVALID_STATE, http: 409, condition: "report not in the required state for validate/accept/void-acceptance" }
  - { id: ERR_AUDIT_INVALID_STATE, http: 409, condition: "audit not in the required state (advance path violation, finding creation outside FIELDWORK, close with non-terminal findings)" }
  - { id: ERR_FINDING_NOT_OPEN, http: 409, condition: "finding not OPEN for resolution/dispute" }
  - { id: ERR_DISPUTE_INVALID_STATE, http: 409, condition: "dispute not in the required state for offers/accept-offer/ratify/arbitrate" }
  - { id: ERR_RUN_INVALID_STATE, http: 409, condition: "distribution run not in required state (approve: DRAFT; void: POSTED)" }
  - { id: ERR_SUBLICENSE_INVALID_STATE, http: 409, condition: "sublicense grant not in required state for the decision" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_SOD_CONFLICT, http: 409, condition: "segregation of duties violated (ratifier == audit opener; distribution approver == creator)" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "report period half-open-overlaps an existing non-terminal report of the same agreement" }
  - { id: ERR_AUDIT_SCOPE_OVERLAP, http: 409, condition: "audit scope closed-interval-overlaps an existing open audit of the same agreement" }
  - { id: ERR_SHARE_SUM_INVALID, http: 422, condition: "inventor_shares share_bp sum != 10000 or duplicate inventor_name" }
  - { id: ERR_SUBLICENSING_NOT_GRANTED, http: 422, condition: "agreement.sublicense_allowed == false" }
  - { id: ERR_DUPLICATE_TAX_ID, http: 409, condition: "licensee tax_id already exists" }
  - { id: ERR_CANNOT_ACCEPT_OWN_OFFER, http: 422, condition: "accept-offer by the same role that made the PENDING offer" }
  - { id: ERR_PERIOD_NOT_CLOSED, http: 422, condition: "period_end is after the current logical time" }
  - { id: ERR_AUDIT_WINDOW_EXPIRED, http: 422, condition: "audit scope_period_end older than audit_window_months cutoff" }
  - { id: ERR_REPORT_NOT_IN_AUDIT_SCOPE, http: 422, condition: "finding's report not of the audit's agreement, period outside scope, or report in non-examinable status" }
  - { id: ERR_NO_APPROVED_SUBLICENSE, http: 422, condition: "sublicense-revenue line reported without an APPROVED sublicense grant" }
  - { id: ERR_ADJUSTMENT_NOT_UPWARD, http: 422, condition: "adjusted_base_cents <= royalty_base_cents on FLAGGED acceptance" }
  - { id: ERR_POOL_EXCEEDS_UNDISTRIBUTED, http: 422, condition: "distribution pool_cents exceeds agreement.undistributed_pool_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LicensingAnalyst
    description: "Technology licensing office analyst; manages agreements, milestones, sublicenses, report intake/acceptance, audits, and findings"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/licensees"
      - "POST /licensing/licensees/{id}/lifecycle"
      - "POST /licensing/license-agreements"
      - "PATCH /licensing/license-agreements/{id}"
      - "POST /licensing/license-agreements/{id}/lifecycle"
      - "POST /licensing/milestones"
      - "POST /licensing/sublicense-grants/{id}/decision"
      - "POST /licensing/royalty-reports/{id}/validate"
      - "POST /licensing/royalty-reports/{id}/accept"
      - "POST /licensing/royalty-reports/{id}/void-acceptance"
      - "POST /licensing/audits"
      - "POST /licensing/audits/{id}/advance"
      - "POST /licensing/audit-findings"
    shared_operations:
      - "GET reads on all resources"
      - "POST /licensing/audit-findings/{id}/resolution (resolution=WAIVED only)"
  - name: Licensee
    description: "The licensed company; submits royalty reports, requests sublicenses, accepts or disputes findings, negotiates settlements"
    identity: "entity_backed:Licensee"
    exclusive_operations:
      - "POST /licensing/royalty-reports"
      - "POST /licensing/sublicense-grants"
      - "POST /licensing/audit-findings/{id}/dispute"
    shared_operations:
      - "POST /licensing/audit-findings/{id}/resolution (resolution=ACCEPTED only, own findings)"
      - "POST /licensing/disputes/{id}/offers (own disputes)"
      - "POST /licensing/disputes/{id}/accept-offer (own disputes, counsel-offer rounds)"
      - "GET reads restricted to own resources"
  - name: LegalCounsel
    description: "Licensing office legal counsel; negotiates, ratifies settlements (SoD vs audit opener), and records arbitration awards"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/disputes/{id}/ratify"
      - "POST /licensing/disputes/{id}/arbitrate"
    shared_operations:
      - "POST /licensing/disputes/{id}/offers"
      - "POST /licensing/disputes/{id}/accept-offer (licensee-offer rounds)"
      - "GET reads on all resources"
  - name: FinanceOfficer
    description: "Finance officer; runs revenue distribution to inventors with maker-checker SoD"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/distribution-runs"
      - "POST /licensing/distribution-runs/{id}/approve (must not equal run creator)"
      - "POST /licensing/distribution-runs/{id}/void"
    shared_operations:
      - "GET reads on all resources"
  - name: IPAdmin
    description: "Platform administrator; operates the logical clock only"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/_clock/set_current_utc"
    shared_operations:
      - "GET /licensing/licensees"
      - "GET /licensing/license-agreements"
