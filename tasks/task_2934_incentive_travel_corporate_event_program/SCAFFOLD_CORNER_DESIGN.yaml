        not a declared edge), ERR_QUALIFIER_STATE_INVALID (award_status is REGISTERED, not PENDING_REVIEW),
        ERR_DESTINATION_STATE_INVALID (inspection_status is already INSPECTED), ERR_CONTRACT_STATE_INVALID
        (status is EXECUTED, a terminal state), ERR_MILESTONE_STATE_INVALID (status is PAID, not SCHEDULED),
        ERR_REGISTRATION_STATE_INVALID (attendance_status is CONFIRMED, so respond is no longer available),
        ERR_AIR_STATE_INVALID (air_status is NOT_REQUESTED, so TICKET has no declared edge) and ERR_SIGNUP_STATE_INVALID
        (status is already CANCELLED) — every one with HTTP 409.'
