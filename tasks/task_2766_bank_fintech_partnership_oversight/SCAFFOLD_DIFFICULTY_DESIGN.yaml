          - validations[priority=80]
        distinguishing_aspect: |
          §0.5 mode (c): the fee tier looks like it should key on the amount
          actually paid out, which is only knowable after the fee is deducted, so
          the scaffold pins steps 1..6 with the tier read off
          gross_settlement_cents BEFORE any deduction — a batch at gross exactly
