            - "${err_open} == ERR_INVALID_COOK_TRANSITION with HTTP 409: the precondition 'zero incidents in INTAKE or TRIAGED' fails while ${inc_id} is INTAKE"
            - "${inc_after} == DISMISSED, which empties the open-incident set without adjudication"
            - "${standing_2} == CLEAR, ${reason_2} == 'incident dismissed at triage', ${cook_v_clear} == ${cook_v_susp} + 1"
            - "${err_repeat} == ERR_INVALID_COOK_TRANSITION: REINSTATE is declared only from SUSPENDED"
            - "${mi_after} == DELISTED with ${mi_reason} == COOK_SUSPENDED: reinstatement does not un-delist the item"
            - "onboarding_status stayed ACTIVE throughout - the action endpoint writes only the compliance_standing dimension"

      - name: hub_consolidation_is_idempotent_and_waits_for_the_cutoff
        claim_type: bulk_action
        grounds:
          - endpoints.POST /pickup-hubs/{id}/consolidate
          - validations[priority=17].ERR_CUTOFF_NOT_REACHED
          - state_machines.PickupHub.OPEN_to_CLOSED
          - calculations.hub_selector
        distinguishing_aspect: >
          Consolidation is the one bulk endpoint whose response mixes two different counts: it returns
          every eligible order of the window (newly attached or already attached) while incrementing
          assigned_order_count by the newly attached ones only. Running it twice over orders the router
          had already parked on the same hub must therefore return the same body both times and leave
          the slot counter untouched - a skip rather than a re-charge - and the whole endpoint refuses to
          run at all while the window is still OPEN before its cutoff.
        test_recipe:
          setup:
            - "Identical to the setup_api_calls of window_and_order_advance_walk_the_happy_path_with_clock_gated_rejections through POST /production-windows, with the zone replaced: cook ${cook_id} ACTIVE in CA, APPROVED MenuItem ${mi_id} at 400 cents (not refrigerated, BATCH_COOK_AND_CHILL), window ${w_id} with cutoff 2026-08-05T00:00:00Z, handoff 2026-08-08T16:00:00Z..18:00:00Z and capacity_meals 20, StatePolicy ${sp_id}. Clock 2026-08-01T00:00:00Z."
            - "DeliveryZone OAK-HUB in CA with service_mode HUB_PICKUP and max_cold_chain_minutes 240."
            - "PickupHub HA in that zone with slot_capacity_orders 3 and a hub window 2026-08-08T15:00:00Z..19:00:00Z that contains the whole buffered handoff interval 15:15..18:45."
            - "Three single-meal orders from three different diners on that window and zone."
