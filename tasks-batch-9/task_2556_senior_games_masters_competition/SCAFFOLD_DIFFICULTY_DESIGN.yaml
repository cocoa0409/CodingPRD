  # ===================================================================
  # RULE 5 - Priority-pair validation conflicts: two rules violated by
  #          ONE request, only the higher-priority error is returned
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pay_fees_state_error_beats_fee_amount_mismatch
        grounds:
          - validations[priority=34]
          - validations[priority=98]
          - state_machines.Athlete.PENDING_PAYMENT_to_REGISTERED
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_FEE_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          ERROR-CATEGORY PAIR = state (priority 34, ERR_INVALID_STATE_TRANSITION, 409) versus
          business_fiscal (priority 98, ERR_FEE_AMOUNT_MISMATCH, 422) on
          POST /athletes/{athlete_id}/pay-fees: one request violates both because the athlete is
          already REGISTERED and the amount is wrong, and the response MUST be the 409 state error
          with the 422 fiscal error suppressed.
        test_recipe:
          setup:
            - "One GamesEdition in REGISTRATION_OPEN, one TRACK sport, one 60-64 event T100M with entry_fee_cents 6000."
            - "One athlete born 1966-03-02 with a single SUBMITTED entry has already paid 15500 cents, so registration_status == REGISTERED and fee_total_cents == 15500."
            - "The logical clock is at its 2026-08-01T00:00:00Z default, before the 2026-08-25T23:59:59Z deadline, so no deadline rule is in play."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Ada Frost", email: "ada.frost@example.com", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_id}", sport_event_id: "${ev_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
              captures: { en_id: $.data.id }
            - call: "POST /senior-games/athletes/${ath_id}/pay-fees"
              payload: { amount_cents: 15500 }
              as: GamesAdmin
          trigger:
            - call: "POST /senior-games/athletes/${ath_id}/pay-fees"
              payload: { amount_cents: 9999 }
              as: GamesAdmin
          assert:
            - "the trigger returns HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION"
            - "the trigger does NOT return ERR_FEE_AMOUNT_MISMATCH even though 9999 != 15500"
            - "Athlete.${ath_id}.registration_status == REGISTERED after the failed call"
            - "Athlete.${ath_id}.fee_paid_cents == 15500 and Athlete.${ath_id}.fee_total_cents == 15500 after the failed call"
            - "control: repeating the call with amount_cents 15500 still returns HTTP 409 ERR_INVALID_STATE_TRANSITION, proving the state rule is evaluated before the amount is looked at"

