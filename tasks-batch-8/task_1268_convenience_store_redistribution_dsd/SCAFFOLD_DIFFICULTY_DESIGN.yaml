          assert:
            - "captured err == ERR_INVALID_STATE (order ASSIGNED, not CLOSED, because manifest close never ran)"
      - name: memo_post_gated_by_invoice_state
        grounds:
          - state_machines.CreditMemo.DRAFT_to_POSTED
          - state_machines.Invoice.OPEN_to_PAID
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: |
          Entity pair CreditMemo -> Invoice (different pair from PurchaseOrder ->
          DeliveryManifest): a DRAFT memo may be created against an open invoice but cannot
          be POSTED once that invoice has transitioned to PAID.
        test_recipe:
          setup:
            - "Invoice of 60600 issued (no promo, 0% fuel tier); a DRAFT manual memo of 100 exists against it; the invoice is then fully paid"
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 50, split_units_qty: 0 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id, po_ver: $.data.version } }
            - { call: "POST /purchase-orders/${po_id}/submit", payload: { expected_order_version: "${po_ver}" }, as: StoreManager, as_user_id: "${ret_id}" }
            - { call: "POST /delivery-manifests", payload: { route_code: "R-1", delivery_date: "2026-05-25", capacity_lbs: 100000 }, as: WholesaleAdmin, captures: { m_id: $.data.id, m_ver: $.data.version } }
            - { call: "POST /fuel-surcharge-rates", payload: { week_start_date: "2026-05-25", doe_index_usd: 3.00 }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/assign-order", payload: { order_id: "${po_id}", expected_manifest_version: "${m_ver}" }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/begin-loading", payload: {}, as: WholesaleAdmin, captures: { m_ver2: $.data.version } }
            - { call: "POST /delivery-manifests/${m_id}/close", payload: { expected_manifest_version: "${m_ver2}" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders/${po_id}/confirm-delivery", payload: {}, as: RouteDriver, captures: { inv_id: $.data.id } }
            - { call: "POST /invoices/${inv_id}/credit-memos", payload: { origin: "MANUAL", amount_cents: 100 }, as: CreditManager, captures: { memo_id: $.data.id } }
            - { call: "POST /invoices/${inv_id}/payments", payload: { amount_cents: 60600, method: "ACH" }, as: CreditManager }
          trigger:
            - { call: "POST /credit-memos/${memo_id}/post", payload: {}, as: CreditManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE (invoice PAID is outside {OPEN, PARTIALLY_PAID, PAST_DUE})"

  - rule_id: resource_temporal_overlap
    instances:
      - name: route_window_half_open_plus_buffer
        grounds:
          - entities.DeliveryWindow.fields.turnaround_buffer_minutes
          - "errors[ERR_DELIVERY_WINDOW_OVERLAP]"
          - "validations[priority=6]"
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) PLUS a turnaround buffer on the route
          resource — a new window on route R-7 starting at 08:15 (inside 08:00 + 30 buffer)
          is rejected, while 08:30 (exactly end + buffer) is accepted.
        test_recipe:
          setup:
            - "Existing window on route R-7: 2026-06-01T06:00:00Z - 08:00:00Z with 30-minute buffer"
          setup_api_calls:
            - { call: "POST /delivery-windows", payload: { route_code: "R-7", window_start: "2026-06-01T06:00:00Z", window_end: "2026-06-01T08:00:00Z", turnaround_buffer_minutes: 30 }, as: WholesaleAdmin }
          trigger:
            - { call: "POST /delivery-windows", payload: { route_code: "R-7", window_start: "2026-06-01T08:15:00Z", window_end: "2026-06-01T09:00:00Z", turnaround_buffer_minutes: 30 }, as: WholesaleAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /delivery-windows", payload: { route_code: "R-7", window_start: "2026-06-01T08:30:00Z", window_end: "2026-06-01T09:30:00Z", turnaround_buffer_minutes: 30 }, as: WholesaleAdmin, captures: { ok_id: $.data.id } }
          assert:
            - "captured err == ERR_DELIVERY_WINDOW_OVERLAP (08:15 < 08:00 + 30min buffer)"
            - "captured ok_id is present (08:30 == end + buffer is allowed: half-open + exact buffer adjacency)"
      - name: promo_closed_interval_touch_overlap
        grounds:
          - entities.PromoEvent.fields.start_date
          - entities.PromoEvent.fields.end_date
          - "errors[ERR_PROMO_WINDOW_OVERLAP]"
          - "validations[priority=6]"
        distinguishing_aspect: |
          Different interval semantics on a different resource: promos on the same product
          use CLOSED inclusive date intervals with no buffer — a new promo starting
          2026-06-07 touches the existing promo's inclusive end 2026-06-07 and is rejected,
          while 2026-06-08 is accepted.
        test_recipe:
          setup:
            - "Product P4 with existing promo 2026-06-01 .. 2026-06-07 (inclusive)"
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P4", description: "p4", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p4: $.data.id } }
            - { call: "POST /promo-events", payload: { product_id: "${p4}", promo_type: "OFF_INVOICE", discount_pct_bps: 500, start_date: "2026-06-01", end_date: "2026-06-07" }, as: SalesRep }
          trigger:
            - { call: "POST /promo-events", payload: { product_id: "${p4}", promo_type: "SCAN_BACK", discount_pct_bps: 250, start_date: "2026-06-07", end_date: "2026-06-14" }, as: SalesRep, captures: { err: $.data.error_id } }
            - { call: "POST /promo-events", payload: { product_id: "${p4}", promo_type: "SCAN_BACK", discount_pct_bps: 250, start_date: "2026-06-08", end_date: "2026-06-14" }, as: SalesRep, captures: { ok_id: $.data.id } }
          assert:
            - "captured err == ERR_PROMO_WINDOW_OVERLAP (2026-06-07 is inside the inclusive closed interval)"
            - "captured ok_id is present (2026-06-08 is the first non-overlapping start)"

  - rule_id: compensating_invariant
    instances:
      - name: payment_reverse_restores_invoice_conservation
        grounds:
          - state_machines.Invoice.PAID_to_OPEN
          - entities.Invoice.fields.invoiced_total_cents
          - entities.Invoice.fields.balance_cents
          - entities.Payment.fields.status
        distinguishing_aspect: |
          Conserved quantity: invoice money. Invariant invoiced_total_cents == balance_cents
          + sum(APPLIED payments) + sum(POSTED non-void credit memos) holds across pay +
          reverse: 60600 == 60600 + 0 + 0 after the compensating reversal.
        test_recipe:
          setup:
            - "Invoice of 60600 issued (no promo, 0% fuel tier); payment of 20000 applied then reversed"
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 50, split_units_qty: 0 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id, po_ver: $.data.version } }
            - { call: "POST /purchase-orders/${po_id}/submit", payload: { expected_order_version: "${po_ver}" }, as: StoreManager, as_user_id: "${ret_id}" }
            - { call: "POST /delivery-manifests", payload: { route_code: "R-1", delivery_date: "2026-05-25", capacity_lbs: 100000 }, as: WholesaleAdmin, captures: { m_id: $.data.id, m_ver: $.data.version } }
            - { call: "POST /fuel-surcharge-rates", payload: { week_start_date: "2026-05-25", doe_index_usd: 3.00 }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/assign-order", payload: { order_id: "${po_id}", expected_manifest_version: "${m_ver}" }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/begin-loading", payload: {}, as: WholesaleAdmin, captures: { m_ver2: $.data.version } }
            - { call: "POST /delivery-manifests/${m_id}/close", payload: { expected_manifest_version: "${m_ver2}" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders/${po_id}/confirm-delivery", payload: {}, as: RouteDriver, captures: { inv_id: $.data.id } }
            - { call: "POST /invoices/${inv_id}/payments", payload: { amount_cents: 20000, method: "CHECK" }, as: CreditManager, captures: { pay_id: $.data.id } }
          trigger:
            - { call: "POST /payments/${pay_id}/reverse", payload: {}, as: CreditManager }
            - { call: "GET /invoices/${inv_id}", payload: {}, as: CreditManager, captures: { bal: $.data.balance_cents, tot: $.data.invoiced_total_cents } }
            - { call: "GET /invoices/${inv_id}/payments", payload: {}, as: CreditManager, captures: { pay_st: "$.data[0].status" } }
          assert:
            - "captured tot == 60600"
            - "captured bal == 60600 (reversal fully compensates the 20000 payment)"
            - "captured pay_st == REVERSED"
            - "invariant: tot == bal + sum(APPLIED payments) + sum(POSTED memos) == 60600 + 0 + 0"
      - name: submit_cancel_conserves_exposure
        grounds:
          - state_machines.PurchaseOrder.DRAFT_to_SUBMITTED
          - state_machines.PurchaseOrder.SUBMITTED_to_CANCELLED
          - entities.Retailer.fields.exposure_forward_cents
          - calculations.credit_exposure_calc
        distinguishing_aspect: |
          Conserved quantity: retailer forward credit exposure (a risk metric, not invoice
          money). Submit adds provisional_total (58500) and cancel removes exactly the same
          amount, returning exposure_forward_cents to its pre-submit value of 0.
        test_recipe:
          setup:
            - "Retailer R with no open invoices (exposure 0); promoted 50xP1 + 20xQ1 order submitted then cancelled"
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "Q1", description: "q1", case_pack_units: 24, case_cost_cents: 2400, unit_cost_cents: 150, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 8 }, as: WholesaleAdmin, captures: { q1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 }, { product_id: "${q1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /promo-events", payload: { product_id: "${p1}", promo_type: "OFF_INVOICE", discount_pct_bps: 1000, start_date: "2026-05-01", end_date: "2026-05-31" }, as: SalesRep }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 50, split_units_qty: 0 }, { product_id: "${q1}", cases_qty: 0, split_units_qty: 20 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id, po_ver: $.data.version } }
            - { call: "POST /purchase-orders/${po_id}/submit", payload: { expected_order_version: "${po_ver}" }, as: StoreManager, as_user_id: "${ret_id}" }
            - { call: "GET /retailers/${ret_id}/credit-summary", payload: {}, as: CreditManager, captures: { fwd_after_submit: $.data.exposure_forward_cents } }
          trigger:
            - { call: "POST /purchase-orders/${po_id}/cancel", payload: {}, as: StoreManager, as_user_id: "${ret_id}", captures: { st: $.data.status } }
            - { call: "GET /retailers/${ret_id}/credit-summary", payload: {}, as: CreditManager, captures: { fwd_after_cancel: $.data.exposure_forward_cents } }
          assert:
            - "captured fwd_after_submit == 58500"
            - "captured st == CANCELLED"
            - "captured fwd_after_cancel == 0 (submit + cancel conserve exposure_forward_cents)"
