      - name: cage_out_of_range_returns_422
        claim_type: Violation → Error
        grounds: ["validations[priority=8]", entities.Hospitalization.fields.cage_number]
        distinguishing_aspect: "Admitting to ICU cage_number 999 (outside 1..ICU_CAPACITY) returns ERR_CAGE_OUT_OF_RANGE 422."
        test_recipe:
          setup: ["A YELLOW Visit IN_TREATMENT with ACTIVE authorization ceiling 300000."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Rex", species: "CANINE", weight_kg: 30, owner_user_id: "owner-1" }
