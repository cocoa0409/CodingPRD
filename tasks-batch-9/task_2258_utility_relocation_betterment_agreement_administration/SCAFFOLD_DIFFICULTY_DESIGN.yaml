            - { call: "POST /uro/permits", payload: { conflict_id: "${ca}", permit_type: "ENCROACHMENT_PERMIT", expires_on: "2028-12-31T00:00:00Z" }, as: UtilityCoordinator, captures: { pma: $.data.id } }
