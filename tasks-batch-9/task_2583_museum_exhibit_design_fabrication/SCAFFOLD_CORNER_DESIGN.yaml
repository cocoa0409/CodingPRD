      - name: blocking_punch_items_gate_the_closeout_advance_without_ever_touching_the_posture
        claim_type: aggregation
        grounds:
          - calculations.project_readiness_posture.formula
          - validations.priority_82
          - validations.priority_42
          - errors.ERR_BLOCKING_PUNCH_ITEMS_OPEN
          - entities.ExhibitProject.fields.blocking_punch_count
        distinguishing_aspect: |
          project_readiness_posture computes FIVE counters but branches on only four
          of them: blocking_punch_count is defined, exported and used by the
          COMMISSIONING to CLOSEOUT precondition, yet it is deliberately NOT a
          posture input. The probe is decisive because the two gates carry different
          priorities: if an implementation folds the blocking count into RESTRICTED,
          the advance fails at priority 42 with ERR_PROJECT_POSTURE_RESTRICTED
          instead of at priority 82 with ERR_BLOCKING_PUNCH_ITEMS_OPEN, and the
          posture read in the very next call reports RESTRICTED instead of OPEN. The
          MAJOR item then pins the severity filter - it never moves the counter - and
          the final advance succeeds with that MAJOR defect still OPEN.
