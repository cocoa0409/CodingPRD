            - "the retried bench grant http_status == 201"
            - "${g72b_status} == PROVISIONED"
            - "${g72b_id} != ${g72a_id}"
            - "${g72_total_final} == 2"

      - name: the_four_link_cascade_from_one_write_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ExitRecord.IP_ASSIGNMENT_SIGNED_to_CLOSED
          - state_machines.VisaCase.SUBMITTED_to_APPROVED
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: "transitive_cascade / ip_assignment_closes_exit_completes_appointment_and_separates_scholar"
          rationale: "The transitive-cascade rule already owns this layer end to end: one POST /exit-records/{id}/ip-assignment is asserted through all four declared links - auto-close, appointment completion, the three ledger postings, and the scholar's separation - and its sibling instance repeats the exercise on the visa-approval chain including the auto-withdrawal that ends it. A corner test would restate the same chain with fewer links."

      - name: the_two_variant_calculations_diverge_on_identical_inputs
        claim_type: dual_variant_calculation
        grounds:
          - calculations.visa_processing_timeline
          - calculations.export_control_risk_score
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: "dual_variant_calc / visa_timeline_initial_filing_versus_post_rfe_refiling"
          rationale: "Both declared variant-bearing calculations are covered by the dual_variant_calc rule: one instance files the same petition twice to contrast INITIAL_FILING against POST_RFE_REFILING, and its sibling scores identical reviewer inputs under tier_1_standard and tier_2_enhanced to show 56.3 clearing with conditions against 68.8 denying. Nothing about the layer is left unasserted."

      - name: the_configured_breakpoints_are_probed_on_both_sides
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.months_in_rank_ledger
          - calculations.export_control_risk_score
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: "boundary_precision_check / total_months_in_rank_cap_accepts_exactly_sixty_and_rejects_sixty_one"
          rationale: "The boundary-precision rule already probes the two configured breakpoints from both sides: the 60-month rank cap at exactly 60 and at 61, and CONDITIONS_THRESHOLD at exactly 35.0 where the >= comparison must clear with conditions rather than clear outright. The corner calculations section adds the institutional-floor plateau and the fringe-band boundary, so no threshold is left one-sided."

  - section: consistency_model
    instances:

      - name: every_cascaded_change_is_already_visible_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Appointment.ACTIVE_to_NON_RENEWED
          - calculations.funding_encumbrance
        distinguishing_aspect: "The declared model is immediate, so no read-after-write delay is permitted anywhere: the finalize response itself already carries the recomputed notice fields, and a GET issued immediately afterwards on the appointment, the funding source, the mentor and the bench grant shows the extended term, the recomputed 84557.81 encumbrance and a mentor load that has already fallen to 0 because active_postdoc_count is computed over ACTIVE rows only - byte-identical to what the same reads return after the clock is nudged again with no further writes. Nothing about this scenario is allowed to lag behind its cause."
        test_recipe:
          setup:
            - "One mentor with valid training and max_concurrent_postdocs 3, one US-citizen scholar needing no sponsorship, one VERIFIED NIH_SCALE FEDERAL_GRANT (300000.00, 2026-09-01 to 2027-12-31) with no document requirements."
            - "One BSL1 laboratory with capacity 10 and buffer 0 holding one PROVISIONED grant of 1 seat for 2026-10-01 to 2027-09-30."
            - "One appointment 2026-10-01 to 2027-09-30 at 62000.00 driven to ACTIVE with a cleared first-cycle export screen; encumbrance 81220.00."
            - "The clock is moved to 2027-09-15T10:00:00Z, fifteen days past the notice deadline, before the review is opened and recommended NON_RENEW."
          setup_api_calls:
            - call: "POST /faculty-mentors"
              payload: { full_name: "F. Nakamura", department: "Cell Biology", mentor_training_valid_through: "2029-12-31" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_73"
              captures: { m73_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { sponsor_name: "NIGMS-7300", funding_type: "FEDERAL_GRANT", salary_floor_policy: "NIH_SCALE", award_start_date: "2026-09-01", award_end_date: "2027-12-31", annual_budget_usd: 300000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_73"
              captures: { f73_id: "$.data.id" }
            - call: "POST /funding-sources/${f73_id}/verification"
