        distinguishing_aspect: |
          CYCLIC shape: SUBMITTED -> IN_REVIEW -> REVISION_REQUESTED -> SUBMITTED is a
          loop that must be traversable more than once, and each REQUEST_REVISION must
          increment revision_round (0 -> 1 -> 2) while REPLACING defect_codes rather
          than appending. After the second loop the submission is APPROVED with
          revision_round frozen at 2, and the terminal-ish APPROVED state rejects a
          third `submit`. A linear implementation cannot re-enter SUBMITTED at all; a
          naive cyclic one either resets the counter on re-submit or accumulates
          defect codes across rounds.
