# =============================================================================
# task_0788 — §1.9 Scaffold Corner Design (breadth coverage of §1.1–§1.7)
# Taxonomy per references/claim-extraction-guide.md. §1.8 covers depth; here breadth.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: vaultitem_create_missing_required_title_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.VaultItem.fields.title, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /legacy/vault-items without the required title field -> ERR_VALIDATION (400); nothing persisted."
        test_recipe:
          setup: ["A plan exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /legacy/vault-items"
              payload: { plan_id: "${plan_id}", kind: "DOCUMENT", category: "will", secret_ref: "vault://will" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { err: $.data.error_id }
          assert: ["err == ERR_VALIDATION"]

      - name: plan_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: [entities.Plan, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /legacy/plans/{nonexistent uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /legacy/plans/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert: ["err == ERR_NOT_FOUND"]

      - name: vaultitem_asset_net_value_cents_computed
        claim_type: computed_fields
        grounds: [entities.VaultItem.fields.net_value_cents, calculations.beneficiary_allocation]
        distinguishing_aspect: "For an ASSET with gross 5000 and liability 200, net_value_cents is computed as 4800 (max(gross - liability, 0))."
        test_recipe:
          setup: ["A plan exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /legacy/vault-items"
              payload: { plan_id: "${plan_id}", kind: "ASSET", category: "estate", title: "Car", secret_ref: "vault://car", gross_value_cents: 5000, liability_cents: 200, distribution_basis: "NET" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { item_id: $.data.id }
          trigger:
            - call: "GET /legacy/vault-items/${item_id}"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
          assert: ["VaultItem.${item_id}.net_value_cents == 4800"]

      - name: vaultitem_default_sensitivity_medium
        claim_type: defaults
        grounds: [entities.VaultItem.fields.sensitivity]
        distinguishing_aspect: "Omitting sensitivity on create yields the default MEDIUM."
        test_recipe:
          setup: ["A plan exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /legacy/vault-items"
              payload: { plan_id: "${plan_id}", kind: "DOCUMENT", category: "will", title: "Will", secret_ref: "vault://will" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { item_id: $.data.id }
          trigger:
            - call: "GET /legacy/vault-items/${item_id}"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
          assert: ["VaultItem.${item_id}.sensitivity == MEDIUM"]

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: seal_already_sealed_item_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.VaultItem.DRAFT_to_SEALED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Sealing a SEALED item is not a defined transition -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A plan with one SEALED DOCUMENT item."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /legacy/vault-items"
              payload: { plan_id: "${plan_id}", kind: "DOCUMENT", category: "will", title: "Will", secret_ref: "vault://will" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { item_id: $.data.id }
            - call: "POST /legacy/vault-items/${item_id}/seal"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
          trigger:
            - call: "POST /legacy/vault-items/${item_id}/seal"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
              captures: { err: $.data.error_id }
          assert: ["err == ERR_INVALID_STATE"]

      - name: revise_revoked_directive_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Directive.DRAFT_to_REVOKED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REVOKED is terminal; revising a REVOKED directive -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A plan with one REVOKED directive."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /legacy/directives"
              payload: { plan_id: "${plan_id}", directive_type: "FUNERAL", content: "wishes" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { dir_id: $.data.id }
            - call: "POST /legacy/directives/${dir_id}/revoke"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
          trigger:
            - call: "POST /legacy/directives/${dir_id}/revise"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
              captures: { err: $.data.error_id }
          assert: ["err == ERR_INVALID_STATE"]

      - name: subscription_cancel_revokes_active_shares
        claim_type: cross_entity
        grounds: [state_machines.Subscription.ACTIVE_to_CANCELED, state_machines.Share.ACTIVE_to_REVOKED]
        distinguishing_aspect: "Canceling the subscription cascades every ACTIVE Share on the plan to REVOKED."
        test_recipe:
          setup: ["PLUS ACTIVE plan with one ACTIVE share."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /legacy/subscriptions"
              payload: { plan_id: "${plan_id}", tier: "PLUS" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /legacy/subscriptions/${sub_id}/record-payment"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /legacy/vault-items"
              payload: { plan_id: "${plan_id}", kind: "DOCUMENT", category: "photos", title: "Photos", secret_ref: "vault://photos" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { item_x: $.data.id }
            - call: "POST /legacy/shares"
              payload: { plan_id: "${plan_id}", vault_item_id: "${item_x}", shared_with_email: "bob@x.com", scope: "ITEM", effective_at: "2026-06-01T00:00:00Z", expires_at: "2026-07-01T00:00:00Z" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { share_id: $.data.id }
          trigger:
            - call: "POST /legacy/subscriptions/${sub_id}/cancel"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
          assert:
            - "Subscription.${sub_id}.status == CANCELED"
            - "Share.${share_id}.status == REVOKED"

      - name: plan_deceased_dismisses_scheduled_reminders
        claim_type: cross_entity
        grounds: [state_machines.Plan.ACTIVE_to_DECEASED, state_machines.ReviewReminder.SCHEDULED_to_DISMISSED]
        distinguishing_aspect: "Declaring death dismisses all SCHEDULED/DUE/OVERDUE reminders on the plan."
        test_recipe:
          setup: ["An ACTIVE plan with one SCHEDULED review reminder."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /legacy/review-reminders"
              payload: { plan_id: "${plan_id}", subject_kind: "VAULT", interval_days: 180, last_reviewed_at: "2026-06-01T00:00:00Z" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { rem_id: $.data.id }
          trigger:
            - call: "POST /legacy/plans/${plan_id}/life-status"
              payload: { new_status: "DECEASED", evidence_ref: "cert-001" }
              as: PlatformAdmin
          assert:
            - "Plan.${plan_id}.life_status == DECEASED"
            - "ReviewReminder.${rem_id}.status == DISMISSED"

      - name: integration_sync_cycle_sets_last_synced
        claim_type: valid_transition
        grounds: [state_machines.Integration.LINKED_to_SYNCING, state_machines.Integration.SYNCING_to_LINKED, entities.Integration.fields.last_synced_at]
        distinguishing_aspect: "Sync moves LINKED -> SYNCING -> LINKED within the request and stamps last_synced_at from the clock."
        test_recipe:
          setup: ["A plan with one LINKED WILL_REGISTRY integration; clock at 2026-06-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /legacy/integrations"
              payload: { plan_id: "${plan_id}", provider_type: "WILL_REGISTRY", provider_name: "StateReg", external_ref: "WR-1" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { int_id: $.data.id }
          trigger:
            - call: "POST /legacy/integrations/${int_id}/sync"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
          assert: ["Integration.${int_id}.sync_status == LINKED"]

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: subscription_refund_forfeit_variant_zero
        claim_type: variant_divergence
        grounds: [calculations.subscription_refund, entities.Subscription.fields.refund_policy]
        distinguishing_aspect: "With refund_policy=FORFEIT, cancel yields last_refund_cents 0 for the same period the PRORATA variant refunds 800."
        test_recipe:
          setup: ["PLUS subscription with refund_policy=FORFEIT; clock advanced to 2026-06-11 (20 days remain)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /legacy/subscriptions"
              payload: { plan_id: "${plan_id}", tier: "PLUS", refund_policy: "FORFEIT" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /legacy/subscriptions/${sub_id}/cancel"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
          assert: ["Subscription.${sub_id}.last_refund_cents == 0"]

      - name: beneficiary_allocation_gross_variant_ignores_liability
        claim_type: variant_selection
        grounds: [calculations.beneficiary_allocation, entities.VaultItem.fields.distribution_basis]
        distinguishing_aspect: "With distribution_basis=GROSS the 1-cent liability is ignored, so the sole 100% beneficiary receives 10000 (vs 9999 under NET)."
        test_recipe:
          setup: ["Deceased plan, SEALED ASSET (gross 10000, liability 1, distribution_basis=GROSS), one 100% beneficiary; approved ON_DEATH release for ASSET."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /legacy/subscriptions"
              payload: { plan_id: "${plan_id}", tier: "PLUS" }
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/deputies"
              payload: { plan_id: "${plan_id}", full_name: "Dee One", email: "d1@x.com", deputy_role: "EXECUTOR", access_scope: ["ASSET"], release_trigger: "ON_DEATH", authority_start_at: "2026-06-01T00:00:00Z", authority_end_at: "2027-06-01T00:00:00Z" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /legacy/deputies/${d1_id}/accept"
              payload: {}
              as: Deputy
              as_user_id: "${d1_id}"
            - call: "POST /legacy/vault-items"
              payload: { plan_id: "${plan_id}", kind: "ASSET", category: "estate", title: "House", secret_ref: "vault://house", gross_value_cents: 10000, liability_cents: 1, distribution_basis: "GROSS" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { item_id: $.data.id }
            - call: "POST /legacy/beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "Ben One", relationship: "child", allocation_pct: 100, asset_vault_item_id: "${item_id}" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /legacy/vault-items/${item_id}/seal"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/plans/${plan_id}/life-status"
              payload: { new_status: "DECEASED", evidence_ref: "cert-001" }
              as: PlatformAdmin
            - call: "POST /legacy/release-requests"
              payload: { plan_id: "${plan_id}", trigger_type: "ON_DEATH", scope_kinds: ["ASSET"] }
              as: Deputy
              as_user_id: "${d1_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /legacy/release-requests/${rr_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /legacy/release-requests/${rr_id}/approve"
              payload: { decision: "APPROVE" }
              as: Deputy
              as_user_id: "${d1_id}"
          trigger:
            - call: "POST /legacy/release-requests/${rr_id}/grant"
              payload: {}
              as: PlatformAdmin
          assert: ["Beneficiary.${b1_id}.allocated_value_cents == 10000"]

      - name: review_reminder_sweep_marks_overdue
        claim_type: threshold_boundary
        grounds: [calculations.next_review_due, state_machines.ReviewReminder.SCHEDULED_to_OVERDUE]
        distinguishing_aspect: "A reminder due 2026-11-28 (last_reviewed 2026-06-01 + 180d) is OVERDUE once the clock passes due_at + 30-day grace; sweep at 2027-01-01 sets OVERDUE."
        test_recipe:
          setup: ["A SCHEDULED reminder anchored at 2026-06-01 with interval 180 days; clock advanced past due_at + grace."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /legacy/review-reminders"
              payload: { plan_id: "${plan_id}", subject_kind: "DIRECTIVE", interval_days: 180, last_reviewed_at: "2026-06-01T00:00:00Z" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { rem_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_ops/run-review-sweep"
              payload: { plan_id: "${plan_id}" }
              as: PlatformAdmin
          assert: ["ReviewReminder.${rem_id}.status == OVERDUE"]

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: owner_cannot_create_item_on_other_plan_forbidden_scope
        claim_type: cross_entity_validation
        grounds: ["validations[priority=5]", "errors[ERR_FORBIDDEN_SCOPE]"]
        distinguishing_aspect: "An Owner (X-User-ID = plan A) creating a vault item with plan_id = plan B -> ERR_FORBIDDEN_SCOPE (403)."
        test_recipe:
          setup: ["Two plans A and B exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada A", owner_email: "a@x.com" }
              as: PlatformAdmin
              captures: { plan_a: $.data.id }
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Bee B", owner_email: "b@x.com" }
              as: PlatformAdmin
              captures: { plan_b: $.data.id }
          trigger:
            - call: "POST /legacy/vault-items"
              payload: { plan_id: "${plan_b}", kind: "DOCUMENT", category: "will", title: "Will", secret_ref: "vault://will" }
              as: Owner
              as_user_id: "${plan_a}"
              captures: { err: $.data.error_id }
          assert: ["err == ERR_FORBIDDEN_SCOPE"]

      - name: share_cross_plan_item_returns_cross_plan_reference
        claim_type: cross_entity_validation
        grounds: ["validations[priority=9]", "errors[ERR_CROSS_PLAN_REFERENCE]"]
        distinguishing_aspect: "A share on plan A whose vault_item_id belongs to plan B -> ERR_CROSS_PLAN_REFERENCE (422)."
        test_recipe:
          setup: ["Plan A with an ACTIVE PLUS subscription; plan B with a DOCUMENT item Y."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada A", owner_email: "a@x.com" }
              as: PlatformAdmin
              captures: { plan_a: $.data.id }
            - call: "POST /legacy/subscriptions"
              payload: { plan_id: "${plan_a}", tier: "PLUS" }
              as: Owner
              as_user_id: "${plan_a}"
              captures: { sub_a: $.data.id }
            - call: "POST /legacy/subscriptions/${sub_a}/record-payment"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Bee B", owner_email: "b@x.com" }
              as: PlatformAdmin
              captures: { plan_b: $.data.id }
            - call: "POST /legacy/vault-items"
              payload: { plan_id: "${plan_b}", kind: "DOCUMENT", category: "photos", title: "Photos", secret_ref: "vault://photos" }
              as: Owner
              as_user_id: "${plan_b}"
              captures: { item_y: $.data.id }
          trigger:
            - call: "POST /legacy/shares"
              payload: { plan_id: "${plan_a}", vault_item_id: "${item_y}", shared_with_email: "bob@x.com", scope: "ITEM", effective_at: "2026-06-01T00:00:00Z", expires_at: "2026-07-01T00:00:00Z" }
              as: Owner
              as_user_id: "${plan_a}"
              captures: { err: $.data.error_id }
          assert: ["err == ERR_CROSS_PLAN_REFERENCE"]

      - name: seal_asset_over_allocated_returns_allocation_exceeds_100
        claim_type: aggregate_validation
        grounds: ["validations[priority=11]", "errors[ERR_ALLOCATION_EXCEEDS_100]"]
        distinguishing_aspect: "Sealing an ASSET whose NOMINATED beneficiaries sum to 110% (60+50) -> ERR_ALLOCATION_EXCEEDS_100 (422)."
        test_recipe:
          setup: ["A plan with a DRAFT ASSET and two beneficiaries at 60% and 50% linked to it."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /legacy/vault-items"
              payload: { plan_id: "${plan_id}", kind: "ASSET", category: "estate", title: "House", secret_ref: "vault://house", gross_value_cents: 10000, liability_cents: 0, distribution_basis: "NET" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { item_id: $.data.id }
            - call: "POST /legacy/beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "Ben One", relationship: "child", allocation_pct: 60, asset_vault_item_id: "${item_id}" }
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "Ben Two", relationship: "child", allocation_pct: 50, asset_vault_item_id: "${item_id}" }
              as: Owner
              as_user_id: "${plan_id}"
          trigger:
            - call: "POST /legacy/vault-items/${item_id}/seal"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
              captures: { err: $.data.error_id }
          assert: ["err == ERR_ALLOCATION_EXCEEDS_100"]

      - name: duplicate_deputy_vote_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_APPROVAL]"]
        distinguishing_aspect: "With required_approvals 2 (three accepted deputies), the same deputy voting APPROVE twice on a still-VERIFIED request -> ERR_DUPLICATE_APPROVAL (409)."
