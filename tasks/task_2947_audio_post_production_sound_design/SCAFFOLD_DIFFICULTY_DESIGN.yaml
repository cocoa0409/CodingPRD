  - rule_id: transitive_cascade
    instances:

      - name: break_picture_lock_depth_four_stem_deliverable_booking_ledger
        grounds:
          - state_machines.Project.picture_status.LOCKED_to_LOCK_BROKEN
          - state_machines.StemPackage.CONFORMED_to_STALE
          - state_machines.Deliverable.PREPARED_to_INVALIDATED
          - state_machines.MixStageBooking.CONFIRMED_to_RELEASED
          - calculations.stage_hours_ledger
          - calculations.project_billing_total
        distinguishing_aspect: |
          One call rolls four hops that no single-hop reading produces: picture_status ->
          LOCK_BROKEN, the CONFORMED stem package -> STALE, the PREPARED deliverable that reads it
          -> INVALIDATED (invalidation_reason STEM_STALE) and, only BECAUSE of that, the deliverable's
          CONFIRMED PRINTMASTER booking -> RELEASED with release_reason DELIVERABLE_INVALIDATED,
          which returns 3.00 reserved hours and drops billing_total_cents 366000 -> 6000.
        test_recipe:
          setup:
            - "Stage at 120000 cents/hour; mixer certified THEATRICAL; STANDARD project, 40.00 authorized hours."
            - "Picture LOCKED; one CONFORMED stem package with two 120-second cues (conform_fee_cents 6000)."
            - "One CONFIRMED PRINTMASTER booking 2026-09-14T10:00:00Z -> 13:00:00Z (provisional 360000)."
            - "One PREPARED deliverable on the THEATRICAL spec reading that stem package and booking."
            - "Before the trigger: stage_hours_reserved 3.00, stage_hours_available 37.00, billing_total_cents 366000."
