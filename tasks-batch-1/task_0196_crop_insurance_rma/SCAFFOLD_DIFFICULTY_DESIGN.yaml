              as: Agent
              as_user_id: "${sa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ACREAGE_DEADLINE_PASSED"
            - "Unit.${unit_id}.status == PENDING"

      - name: temporal_late_planting_flag_after_final_planting_date
        grounds:
          - entities.AcreageReport.fields.late_planted
          - entities.CommodityProgram.fields.final_planting_date
          - state_machines.Unit.PENDING_to_REPORTED
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource (AcreageReport vs the
          program deadline window): late_planted is an OPEN lower-bound flag — a
          planting_date STRICTLY AFTER final_planting_date (2026-05-31) sets
          late_planted=true; a planting_date on the boundary date is NOT late. The report
          still ACCEPTS (unit REPORTED) but is flagged late.
        test_recipe:
          setup:
