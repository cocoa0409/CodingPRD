      - name: dispatcher_workload_capacity_boundary
        grounds:
          - calculations.dispatcher_workload
          - errors[ERR_DISPATCHER_OVERLOADED]
        distinguishing_aspect: |
          Boundary metric = assigned leg count vs max_active_legs, endpoint =
          POST /dispatch/legs (third distinct metric/endpoint): D3 with
          max_active_legs 1 accepts leg #1 (count becomes exactly 1 == max) and
