# =============================================================================
# SCAFFOLD — Electrical Supply Distributor (Graybar/Rexel style)
# §1.0–§1.7 (difficulty & corner designs live in sibling files)
# =============================================================================

scenario: |
  Electrical Supply Distributor (Graybar/Rexel style): project quote & job-account release, bill-of-material takeoff & substitution approval, price-in-effect vs escalation on long jobs, reel/cut-charge & minimum, contractor credit limit & lien-waiver linkage, backorder allocation on shortage, manufacturer rebate & claim-back, jobsite delivery scheduling

domain_name: electrical-supply-distributor
api_prefix: /distributor

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation      # FIRM_PRICE vs ESCALATION billing; provisional vs final rebate
    - derived_field_reconciliation  # Contractor invoiced/committed balances; item stock ledgers
    - rate_threshold_triggers       # credit limit headroom, rebate tiers, reel minimums
    - optimistic_concurrency        # OCC on Quote.version (revise) and JobAccount.version (release create)
  entity_topology: flat             # peer entities joined by foreign keys; no URL nesting
  state_machine_shape: cyclic       # Quote revise loop; JobAccount OPEN<->CREDIT_HOLD cycle
  relationship_patterns:
    - one_to_many                   # Contractor->JobAccount, Quote->QuoteLine, Release->ReleaseLine
    - cross_aggregate               # ReleaseLine -> CatalogItem stock; RebateClaim -> RebateProgram
  role_model: approval_chain        # SalesRep proposes; BranchManager/CreditManager approve
  consistency_model: immediate      # all mutations + cascades atomic in the request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Contractor company name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed credit exposure in cents; must be > 0" }
      - { name: invoiced_balance_cents, type: integer, source: computed, default: 0, description: "Sum of billed_total_cents over INVOICED releases minus sum of payments" }
      - { name: committed_balance_cents, type: integer, source: computed, default: 0, description: "Sum of estimated_total_cents over this contractor's releases in {CREDIT_APPROVED, PARTIALLY_ALLOCATED, ALLOCATED, SCHEDULED, DELIVERED}" }
      - { name: credit_used_cents, type: integer, source: computed, default: 0, description: "Read-only = invoiced_balance_cents + committed_balance_cents" }

  - name: CatalogItem
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock keeping unit; unique across all catalog items" }
      - { name: manufacturer_name, type: string, source: input, description: "Manufacturer name; rebate qualification keys on exact match" }
      - { name: sell_uom, type: enum, source: input, description: "EA | FOOT — unit of measure for qty and pricing" }
      - { name: list_price_cents, type: number, source: input, description: "Current list price per sell_uom in cents, up to 4 decimal places" }
      - { name: reel_length_ft, type: integer, source: input, description: "Full reel length in feet; required iff sell_uom == FOOT, forbidden otherwise" }
      - { name: min_cut_ft, type: integer, source: input, description: "Minimum cut length in feet; required iff sell_uom == FOOT, forbidden otherwise" }
      - { name: cut_charge_cents, type: integer, source: input, description: "Flat cut charge applied per billed line when shipped feet < reel_length_ft; required iff sell_uom == FOOT" }
      - { name: stock_on_hand, type: number, source: computed, default: 0, description: "Unallocated physical stock (units = EA count or feet)" }
      - { name: stock_allocated, type: number, source: computed, default: 0, description: "Stock reserved by non-terminal release lines (qty_allocated on releases in {PARTIALLY_ALLOCATED, ALLOCATED, SCHEDULED})" }

  - name: JobAccount
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; owning contractor" }
      - { name: job_name, type: string, source: input, description: "Project name" }
      - { name: jobsite_address, type: string, source: input, description: "Delivery site address" }
      - { name: pricing_mode, type: enum, source: input, description: "FIRM_PRICE | ESCALATION — billing variant for all releases on this job" }
      - { name: escalation_cap_pct, type: number, source: input, description: "Optional cap on escalation ratio as a fraction (e.g. 0.10 caps ratio at 1.10); null = uncapped; forbidden when pricing_mode == FIRM_PRICE", default: null }
      - { name: lien_waiver_required, type: boolean, source: input, default: false, description: "When true, credit-approve requires a current (unexpired) lien waiver on file" }
      - { name: lien_waiver_expires_on, type: string, source: system, default: null, description: "ISO date of latest filed lien waiver expiry; set by POST lien-waivers; null = none on file" }
      - { name: status, type: enum, source: system, description: "OPEN | CREDIT_HOLD | CLOSED" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: job_account_id, type: string, source: input, description: "FK -> JobAccount.id" }
      - { name: valid_until, type: string, source: input, description: "ISO date; quote expires when logical clock date passes this" }
      - { name: revision_no, type: integer, source: system, default: 1, description: "Starts at 1; +1 on every revise" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | AWARDED | EXPIRED" }
      - { name: award_month, type: string, source: system, default: null, description: "YYYY-MM of logical clock at award; escalation base month" }
      - { name: award_index_value, type: number, source: system, default: null, description: "Commodity index value effective at award_month; pinned at award" }

  - name: QuoteLine
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id" }
      - { name: catalog_item_id, type: string, source: input, description: "FK -> CatalogItem.id; swapped when a substitution is approved" }
      - { name: qty, type: number, source: input, description: "Quantity in the item's sell_uom; must be > 0" }
      - { name: unit_price_cents, type: number, source: input, description: "Negotiated price per sell_uom in cents, up to 4 decimal places" }

  - name: SubstitutionRequest
    parent: null
    common_fields: true
    fields:
      - { name: quote_line_id, type: string, source: input, description: "FK -> QuoteLine.id; the BOM line proposed for substitution" }
      - { name: proposed_item_id, type: string, source: input, description: "FK -> CatalogItem.id; the alternate item" }
      - { name: reason, type: string, source: input, description: "Free-text justification" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED" }

  - name: Release
    parent: null
    common_fields: true
    fields:
      - { name: job_account_id, type: string, source: input, description: "FK -> JobAccount.id" }
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; must be an AWARDED quote on the same job account" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CREDIT_APPROVED | PARTIALLY_ALLOCATED | ALLOCATED | SCHEDULED | DELIVERED | INVOICED | CANCELLED" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "Provisional extension at creation: billing formula with qty_requested and the clock at creation" }
      - { name: billed_total_cents, type: integer, source: computed, default: null, description: "Final extension computed at invoice; null until INVOICED" }
      - { name: truck_id, type: string, source: system, default: null, description: "Truck identifier set at schedule" }
      - { name: delivery_date, type: string, source: system, default: null, description: "ISO date set at schedule" }
      - { name: window_start_hour, type: integer, source: system, default: null, description: "Delivery window start hour [0-23] set at schedule" }
      - { name: window_end_hour, type: integer, source: system, default: null, description: "Delivery window end hour (exclusive) set at schedule" }
      - { name: invoiced_on, type: string, source: system, default: null, description: "ISO date of logical clock at invoice; rebate qualification window key" }

  - name: ReleaseLine
    parent: null
    common_fields: true
    fields:
      - { name: release_id, type: string, source: system, description: "FK -> Release.id; owning release" }
      - { name: catalog_item_id, type: string, source: input, description: "FK -> CatalogItem.id; must appear on the release's quote" }
      - { name: qty_requested, type: number, source: input, description: "Requested quantity in the item's sell_uom; > 0" }
      - { name: qty_allocated, type: number, source: computed, default: 0, description: "Stock currently reserved for this line" }
      - { name: qty_shipped, type: number, source: computed, default: 0, description: "Quantity shipped (set to qty_allocated at deliver)" }
      - { name: billed_amount_cents, type: integer, source: computed, default: null, description: "Per-line billed amount computed at invoice; null until INVOICED" }
      - { name: status, type: enum, source: system, description: "OPEN | ALLOCATED | SHIPPED | INVOICED | CANCELLED" }

  - name: BackorderAllocation
    parent: null
    common_fields: true
    fields:
      - { name: release_line_id, type: string, source: system, description: "FK -> ReleaseLine.id; the short line this backorder covers" }
      - { name: catalog_item_id, type: string, source: system, description: "FK -> CatalogItem.id; denormalized from the line for the waterfall" }
      - { name: qty_open, type: number, source: computed, description: "Remaining unfilled quantity; decreases on stock receipts" }
      - { name: status, type: enum, source: system, description: "OPEN | FILLED | CANCELLED" }

  - name: RebateProgram
    parent: null
    common_fields: true
    fields:
      - { name: manufacturer_name, type: string, source: input, description: "Manufacturer whose purchases qualify" }
      - { name: period_start, type: string, source: input, description: "ISO period start date (inclusive)" }
      - { name: period_end, type: string, source: input, description: "ISO period end date (inclusive); must be >= period_start" }
      - { name: tiers, type: array, source: input, description: "Array of {threshold_cents: integer, rebate_pct: number} sorted ascending by threshold; achieved tier = last tier with threshold_cents <= qualifying base" }

  - name: RebateClaim
    parent: null
    common_fields: true
    fields:
      - { name: rebate_program_id, type: string, source: input, description: "FK -> RebateProgram.id" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Estimate at claim creation: round_half_up(qualifying_base_cents x achieved tier pct), one rounding on the sum" }
      - { name: qualifying_base_cents, type: integer, source: computed, default: null, description: "Sum of billed_amount_cents over qualifying release lines; recomputed at submit" }
      - { name: tier_pct_applied, type: number, source: computed, default: null, description: "Tier percentage achieved at submit" }
      - { name: final_amount_cents, type: integer, source: computed, default: null, description: "Final claim: sum of per-line round_half_up(line billed_amount_cents x tier pct); computed at submit" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: JobAccount
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CREDIT_HOLD
        trigger: "system (after POST /distributor/releases/{id}/invoice when Contractor.invoiced_balance_cents > credit_limit_cents)"
        actor: system
        preconditions:
          - "Owning contractor's invoiced_balance_cents exceeds credit_limit_cents after the invoice posts"
        side_effects:
          - "All other OPEN JobAccounts of the same contractor also transition to CREDIT_HOLD"
      - from: CREDIT_HOLD
        to: OPEN
        trigger: "system (after POST /distributor/contractors/{id}/payments when Contractor.invoiced_balance_cents <= credit_limit_cents)"
        actor: system
        preconditions:
          - "Owning contractor's invoiced_balance_cents is back at or below credit_limit_cents"
        side_effects:
          - "All CREDIT_HOLD JobAccounts of the same contractor return to OPEN"
      - from: OPEN
        to: CLOSED
        trigger: "POST /distributor/job-accounts/{id}/close"
        actor: BranchManager
        preconditions:
          - "No quotes in {DRAFT, SUBMITTED} and no releases in {REQUESTED, CREDIT_APPROVED, PARTIALLY_ALLOCATED, ALLOCATED, SCHEDULED, DELIVERED} (ERR_JOB_HAS_OPEN_RELEASES)"
        side_effects: []

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [AWARDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /distributor/quotes/{id}/submit"
        actor: SalesRep
        preconditions:
          - "Quote has at least one QuoteLine (ERR_QUOTE_HAS_NO_LINES)"
          - "JobAccount.status == OPEN (ERR_JOB_NOT_OPEN)"
          - "Logical clock date <= valid_until (ERR_QUOTE_EXPIRED; quote becomes EXPIRED)"
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /distributor/quotes/{id}/revise"
        actor: SalesRep
        preconditions:
          - "expected_quote_version matches Quote.version (ERR_STALE_QUOTE_VERSION, 412)"
        side_effects:
          - "revision_no += 1"
          - "increments Quote.version by 1"
      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /distributor/quotes/{id}/award"
        actor: BranchManager
        preconditions:
          - "JobAccount.status == OPEN (ERR_JOB_NOT_OPEN)"
          - "Logical clock date <= valid_until (ERR_QUOTE_EXPIRED; quote becomes EXPIRED)"
        side_effects:
          - "award_month = logical clock YYYY-MM"
          - "award_index_value = latest index reading with month <= award_month (null if none)"
      - from: DRAFT
        to: EXPIRED
        trigger: "system (lazy: on any read or transition attempt when logical clock date > valid_until)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (lazy: on any read or transition attempt when logical clock date > valid_until)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SubstitutionRequest
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /distributor/substitution-requests/{id}/decide {decision: APPROVE}"
        actor: BranchManager
        preconditions:
          - "Owning Quote (via quote_line_id -> QuoteLine.quote_id) is in DRAFT (ERR_QUOTE_NOT_DRAFT)"
        side_effects:
          - "QuoteLine.catalog_item_id = proposed_item_id"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /distributor/substitution-requests/{id}/decide {decision: REJECT}"
        actor: BranchManager
        preconditions:
          - "Owning Quote is in DRAFT (ERR_QUOTE_NOT_DRAFT)"
        side_effects: []

  - entity: Release
    initial_state: REQUESTED
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CREDIT_APPROVED
        trigger: "POST /distributor/releases/{id}/credit-approve"
        actor: CreditManager
        preconditions:
          - "JobAccount.status == OPEN (ERR_JOB_ON_CREDIT_HOLD)"
          - "If job.lien_waiver_required: lien_waiver_expires_on is not null and >= logical clock date (ERR_LIEN_WAIVER_REQUIRED)"
          - "estimated_total_cents <= contractor.credit_limit_cents - contractor.invoiced_balance_cents - contractor.committed_balance_cents (ERR_CREDIT_LIMIT_EXCEEDED); equality passes"
        side_effects:
          - "Contractor.committed_balance_cents += estimated_total_cents"
      - from: CREDIT_APPROVED
        to: ALLOCATED
        trigger: "POST /distributor/releases/{id}/allocate (all lines fully covered by stock_on_hand)"
        actor: WarehouseManager
        preconditions: []
        side_effects:
          - "Per line in line.created_at ASC order: qty_allocated = min(qty_requested, item.stock_on_hand); item.stock_on_hand -= qty_allocated; item.stock_allocated += qty_allocated"
          - "Every line reaches qty_allocated == qty_requested, so each line -> ALLOCATED"
      - from: CREDIT_APPROVED
        to: PARTIALLY_ALLOCATED
        trigger: "POST /distributor/releases/{id}/allocate (any line short)"
        actor: WarehouseManager
        preconditions: []
        side_effects:
          - "Same per-line allocation as ALLOCATED path"
          - "For each line with qty_allocated < qty_requested: line stays OPEN and a BackorderAllocation(qty_open = qty_requested - qty_allocated, OPEN) is created"
      - from: PARTIALLY_ALLOCATED
        to: ALLOCATED
        trigger: "system (during stock-receipt waterfall when the release's last OPEN BackorderAllocation is filled)"
        actor: system
        preconditions: []
        side_effects:
          - "All lines are ALLOCATED"
      - from: ALLOCATED
        to: SCHEDULED
        trigger: "POST /distributor/releases/{id}/schedule"
        actor: Dispatcher
        preconditions:
          - "delivery_date >= logical clock date (ERR_DELIVERY_WINDOW_PAST)"
          - "No other release with same truck_id, same delivery_date, status in {SCHEDULED, DELIVERED}, and half-open window overlap: NOT (new_end <= existing_start OR new_start >= existing_end) (ERR_TRUCK_WINDOW_OVERLAP)"
          - "No other release on the same job_account_id with same delivery_date and status in {SCHEDULED, DELIVERED} (ERR_JOBSITE_DAY_CONFLICT)"
        side_effects:
          - "truck_id, delivery_date, window_start_hour, window_end_hour stamped on the release"
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /distributor/releases/{id}/deliver"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "Per line: qty_shipped = qty_allocated; line -> SHIPPED; item.stock_allocated -= qty_shipped"
      - from: DELIVERED
        to: INVOICED
        trigger: "POST /distributor/releases/{id}/invoice"
        actor: CreditManager
        preconditions: []
        side_effects:
          - "Compute billed_release_line_amount per line (see calculations); billed_total_cents = sum; line.billed_amount_cents set; lines -> INVOICED"
          - "invoiced_on = logical clock date"
          - "Contractor.committed_balance_cents -= estimated_total_cents; Contractor.invoiced_balance_cents += billed_total_cents"
          - "If Contractor.invoiced_balance_cents > credit_limit_cents: all OPEN JobAccounts of the contractor -> CREDIT_HOLD"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /distributor/releases/{id}/cancel"
        actor: "SalesRep | Contractor"
        preconditions:
          - "Contractor role callers must own the release's job account (ERR_FORBIDDEN)"
        side_effects: []
      - from: CREDIT_APPROVED
        to: CANCELLED
        trigger: "POST /distributor/releases/{id}/cancel"
        actor: "SalesRep | Contractor"
        preconditions:
          - "Contractor role callers must own the release's job account (ERR_FORBIDDEN)"
        side_effects:
          - "Contractor.committed_balance_cents -= estimated_total_cents"
      - from: PARTIALLY_ALLOCATED
        to: CANCELLED
        trigger: "POST /distributor/releases/{id}/cancel"
        actor: "SalesRep | Contractor"
        preconditions:
          - "Contractor role callers must own the release's job account (ERR_FORBIDDEN)"
        side_effects:
          - "Per line: item.stock_on_hand += qty_allocated; item.stock_allocated -= qty_allocated; line -> CANCELLED"
          - "OPEN BackorderAllocations of this release -> CANCELLED"
          - "Contractor.committed_balance_cents -= estimated_total_cents"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /distributor/releases/{id}/cancel"
        actor: "SalesRep | Contractor"
        preconditions:
          - "Contractor role callers must own the release's job account (ERR_FORBIDDEN)"
        side_effects:
          - "Per line: item.stock_on_hand += qty_allocated; item.stock_allocated -= qty_allocated; line -> CANCELLED"
          - "Contractor.committed_balance_cents -= estimated_total_cents"

  - entity: ReleaseLine
    initial_state: OPEN
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: OPEN
        to: ALLOCATED
        trigger: "system (allocate endpoint or stock-receipt waterfall brings qty_allocated == qty_requested)"
        actor: system
        preconditions: []
        side_effects:
          - "If all sibling lines of the release are ALLOCATED, the release -> ALLOCATED"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "system (POST /distributor/releases/{id}/deliver)"
        actor: system
        preconditions: []
        side_effects:
          - "qty_shipped = qty_allocated"
      - from: SHIPPED
        to: INVOICED
        trigger: "system (POST /distributor/releases/{id}/invoice)"
        actor: system
        preconditions: []
        side_effects:
          - "billed_amount_cents computed per billed_release_line_amount"
      - from: OPEN
        to: CANCELLED
        trigger: "system (release cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "qty_allocated returns to item.stock_on_hand"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "system (release cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "qty_allocated returns to item.stock_on_hand"

  - entity: BackorderAllocation
    initial_state: OPEN
    terminal_states: [FILLED, CANCELLED]
    transitions:
      - from: OPEN
        to: FILLED
        trigger: "system (stock-receipt waterfall brings qty_open to 0)"
        actor: system
        preconditions: []
        side_effects:
          - "ReleaseLine.qty_allocated topped up; line may become ALLOCATED"
      - from: OPEN
        to: CANCELLED
        trigger: "system (owning release cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RebateClaim
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /distributor/rebate-claims/{id}/submit"
        actor: RebateClerk
        preconditions:
          - "Logical clock date > program.period_end (ERR_REBATE_PERIOD_NOT_ENDED)"
        side_effects:
          - "Recompute qualifying_base_cents, tier_pct_applied, final_amount_cents (final variant)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /distributor/rebate-claims/{id}/decide {decision: APPROVE}"
        actor: BranchManager
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /distributor/rebate-claims/{id}/decide {decision: REJECT}"
        actor: BranchManager
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: quote-revise-stale-quote
    parent_entity: Quote
    write_endpoint: "POST /distributor/quotes/{id}/revise"
    occ_field: expected_quote_version
    description: |
      Revising a Quote whose version has advanced since the client last
      observed it is rejected. Each successful revise legitimately creates a
      new revision (revision_no + 1) that supersedes the prior one, so a
      writer holding a stale view of the quote must be refused with 412.
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412
  - rule_id: release-create-stale-job-account
    parent_entity: JobAccount
    write_endpoint: "POST /distributor/releases"
    occ_field: expected_job_account_version
    description: |
      Creating a Release against a JobAccount whose version has advanced
      since the client last observed it is rejected. Release creation
      legitimately mutates the account (version bump) and other account
      changes (credit hold placement, closure, another release) may have
      occurred, so a writer holding a stale view of the account must be
      refused with 412.
    error_id: ERR_STALE_JOB_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: billed_release_line_amount
    trigger: "POST /distributor/releases/{id}/invoice (final, qty_shipped, clock at invoice); POST /distributor/releases (provisional estimate, qty_requested, clock at creation)"
    algorithm: tiered_pricing
    formula: |
      Per ReleaseLine, base_unit = QuoteLine.unit_price_cents for
      (release.quote_id, line.catalog_item_id).
      Effective unit price:
        if job.pricing_mode == FIRM_PRICE: eff_unit = base_unit
        if job.pricing_mode == ESCALATION:
          base_idx = quote.award_index_value (if null, ratio = 1.0)
          cur_idx  = latest index reading with month <= YYYY-MM of logical clock;
                     if none, cur_idx = base_idx (ratio = 1.0)
          ratio = cur_idx / base_idx
          if job.escalation_cap_pct is not null: ratio = min(ratio, 1 + escalation_cap_pct)
          eff_unit = round_half_up(base_unit * ratio, 4 decimal places)
      Extension (integer cents):
        if item.sell_uom == EA:
          line_amount = round_half_up(bill_qty * eff_unit, 0 decimals)
        if item.sell_uom == FOOT:
          cut_charge = item.cut_charge_cents if bill_qty < item.reel_length_ft else 0
          line_amount = round_half_up(bill_qty * eff_unit, 0 decimals) + cut_charge
      billed_total_cents = sum of line_amount over the release's lines.
      bill_qty = qty_shipped at invoice; qty_requested for the provisional estimate.
    input_set: "Lines of the release; quote lines of release.quote_id; index readings with month <= clock month"
    constants: {}
    precision: "unit prices 4 decimal places; line amounts integer cents, round_half_up; per-line round then sum (rounding order pinned)"
    variants:
      - name: firm_price
        when: "JobAccount.pricing_mode == FIRM_PRICE"
        difference: "eff_unit equals the award-pinned quote price; index movement is ignored"
      - name: escalation
        when: "JobAccount.pricing_mode == ESCALATION"
        difference: "eff_unit scales with the commodity index ratio, clamped by escalation_cap_pct"

  - name: rebate_claim_amounts
    trigger: "POST /distributor/rebate-claims (provisional variant); POST /distributor/rebate-claims/{id}/submit (final variant)"
    algorithm: aggregation
    formula: |
      Qualifying base: billed_amount_cents of ReleaseLines whose release is
      INVOICED with invoiced_on inside [period_start, period_end] (both bounds
      inclusive) and whose catalog item's manufacturer_name exactly equals the
      program's manufacturer_name.
      Achieved tier: the last tier (ascending threshold order) with
      threshold_cents <= qualifying_base_cents; if none qualifies, pct = 0.
      PROVISIONAL (at create):
        provisional_amount_cents = round_half_up(qualifying_base_cents * achieved_pct, 0)
        -- exactly one rounding, applied to the SUM.
      FINAL (at submit):
        per qualifying line: line_rebate = round_half_up(line.billed_amount_cents * achieved_pct, 0)
        final_amount_cents = sum of line_rebate
        -- rounding applied PER LINE, then summed (rounding order pinned;
        -- differs from provisional for the same data).
    input_set: "Releases with status INVOICED and invoiced_on in the closed program period; lines whose item manufacturer matches"
    constants: {}
    precision: "integer cents, round_half_up; provisional rounds the sum once, final rounds each line then sums"
    variants:
      - name: provisional
        when: "claim creation (DRAFT)"
        difference: "rounds qualifying_base_cents x pct once at the total level"
      - name: final
        when: "claim submit"
        difference: "rounds each qualifying line then sums; also recomputes the base at submit time"

  - name: escalation_index_ratio
    trigger: "inside billed_release_line_amount when pricing_mode == ESCALATION"
    algorithm: chronological
    formula: |
      readings = all index readings (posted via POST /distributor/_index-readings/set)
      base_idx = quote.award_index_value
      target_month = YYYY-MM of the logical clock at billing time
      cur_idx = value of the reading with the greatest month <= target_month;
                if no such reading, cur_idx = base_idx
      if base_idx is null: ratio = 1.0
      else: ratio = cur_idx / base_idx
      if job.escalation_cap_pct is not null: ratio = min(ratio, 1 + escalation_cap_pct)
    input_set: "Index readings with month <= target month; latest wins; ties impossible (month is unique)"
    constants: {}

  - name: credit_headroom_check
    trigger: "POST /distributor/releases/{id}/credit-approve"
    algorithm: threshold
    formula: |
      headroom = contractor.credit_limit_cents
                 - contractor.invoiced_balance_cents
                 - contractor.committed_balance_cents
      approve iff release.estimated_total_cents <= headroom
      (boundary: estimated_total_cents == headroom PASSES; only strictly
      greater is rejected with ERR_CREDIT_LIMIT_EXCEEDED)
    input_set: "The release's contractor balances at evaluation time"
    constants: {}

  - name: backorder_waterfall
    trigger: "POST /distributor/catalog-items/{id}/stock-receipts"
    algorithm: waterfall_allocation
    formula: |
      item.stock_on_hand += qty
      candidates = BackorderAllocations with catalog_item_id == this item,
                   status == OPEN, whose release is in PARTIALLY_ALLOCATED
      processing order: owning release.created_at ASC, then release line
      created_at ASC (never id)
      for each candidate while item.stock_on_hand > 0:
        fill = min(candidate.qty_open, item.stock_on_hand)
        candidate.qty_open -= fill
        line.qty_allocated += fill
        item.stock_on_hand -= fill
        item.stock_allocated += fill
        if candidate.qty_open == 0: candidate -> FILLED
        if line.qty_allocated == line.qty_requested: line -> ALLOCATED
        if all lines of the release ALLOCATED: release -> ALLOCATED
    input_set: "OPEN BackorderAllocations of the received item on PARTIALLY_ALLOCATED releases only"
    constants: {}

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint; Contractor-role callers may only act on job accounts whose contractor_id equals X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Request shape: required fields present, enum members valid, qty > 0, window_end_hour > window_start_hour, reel_length_ft/min_cut_ft/cut_charge_cents present iff sell_uom == FOOT and absent iff EA"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all POST endpoints
  - priority: 4
    category: existence
    check: "Path ids and body foreign keys exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with resource ids
  - priority: 5
    category: state
    check: "expected_*_version matches the parent's current version (OCC)"
    error_id: "ERR_STALE_QUOTE_VERSION | ERR_STALE_JOB_ACCOUNT_VERSION"
    http_status: 412
    applies_to: "POST /distributor/quotes/{id}/revise; POST /distributor/releases"
  - priority: 6
    category: state
    check: "Target resource in the required state for this operation (per-transition domain errors)"
    error_id: "ERR_QUOTE_NOT_DRAFT | ERR_QUOTE_NOT_SUBMITTED | ERR_SUBSTITUTION_NOT_PROPOSED | ERR_JOB_ON_CREDIT_HOLD | ERR_JOB_NOT_OPEN | ERR_RELEASE_NOT_REQUESTED | ERR_RELEASE_NOT_CREDIT_APPROVED | ERR_RELEASE_NOT_ALLOCATED | ERR_RELEASE_NOT_SCHEDULED | ERR_RELEASE_NOT_DELIVERED | ERR_RELEASE_NOT_CANCELLABLE | ERR_REBATE_CLAIM_NOT_DRAFT | ERR_REBATE_CLAIM_NOT_SUBMITTED"
    http_status: 409
    applies_to: state transition endpoints
  - priority: 7
    category: business_temporal
    check: "Clock-relative rules: quote valid_until, delivery window not in the past, rebate period ended"
    error_id: "ERR_QUOTE_EXPIRED | ERR_DELIVERY_WINDOW_PAST | ERR_REBATE_PERIOD_NOT_ENDED"
    http_status: 409
    applies_to: "quote submit/award; release schedule; rebate-claim submit"
  - priority: 8
    category: business_safety
    check: "Lien-waiver linkage: job requiring a waiver must have lien_waiver_expires_on set and >= logical clock date"
    error_id: ERR_LIEN_WAIVER_REQUIRED
    http_status: 409
    applies_to: "POST /distributor/releases/{id}/credit-approve"
  - priority: 9
    category: business_constraint
    check: "Domain constraints: sku uniqueness, min-cut floor, item-on-quote membership, truck half-open window overlap, jobsite day bucket, rebate period closed-interval overlap, close with open children, submit with no lines"
    error_id: "ERR_DUPLICATE_SKU | ERR_BELOW_MIN_CUT | ERR_ITEM_NOT_ON_QUOTE | ERR_TRUCK_WINDOW_OVERLAP | ERR_JOBSITE_DAY_CONFLICT | ERR_REBATE_PERIOD_OVERLAP | ERR_JOB_HAS_OPEN_RELEASES | ERR_QUOTE_HAS_NO_LINES"
    http_status: 409
    applies_to: various creation/transition endpoints
  - priority: 10
    category: business_fiscal
    check: "Credit headroom: estimated_total_cents <= limit - invoiced_balance - committed_balance (equality passes)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /distributor/releases/{id}/credit-approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Contractor ---
  - method: POST
    path: "/distributor/contractors"
    description: "Create a contractor with a credit limit"
    roles: [CreditManager]
    code: 201
    input: [name, credit_limit_cents]
    output: Contractor
    side_effects: ["invoiced_balance_cents = 0", "committed_balance_cents = 0", "version = 1"]
  - method: GET
    path: "/distributor/contractors"
    description: "List contractors"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Contractor[]"
    side_effects: []
  - method: GET
    path: "/distributor/contractors/{id}"
    description: "Get a contractor"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: []
    output: Contractor
    side_effects: []
  - method: POST
    path: "/distributor/contractors/{id}/payments"
    description: "Record a payment against the invoiced balance"
    roles: [CreditManager]
    code: 201
    input: [amount_cents]
    output: Contractor
    side_effects:
      - "invoiced_balance_cents -= amount_cents"
      - "if invoiced_balance_cents <= credit_limit_cents: all CREDIT_HOLD JobAccounts of this contractor -> OPEN"
      - "increments Contractor.version by 1"

  # --- CatalogItem ---
  - method: POST
    path: "/distributor/catalog-items"
    description: "Create a catalog item (EA or FOOT)"
    roles: [WarehouseManager]
    code: 201
    input: [sku, manufacturer_name, sell_uom, list_price_cents, "reel_length_ft?", "min_cut_ft?", "cut_charge_cents?"]
    output: CatalogItem
    side_effects: ["stock_on_hand = 0", "stock_allocated = 0", "sku uniqueness enforced (ERR_DUPLICATE_SKU)"]
  - method: GET
    path: "/distributor/catalog-items"
    description: "List catalog items"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: ["manufacturer_name?", "limit?", "offset?"]
    output: "CatalogItem[]"
    side_effects: []
  - method: GET
    path: "/distributor/catalog-items/{id}"
    description: "Get a catalog item"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: []
    output: CatalogItem
    side_effects: []
  - method: POST
    path: "/distributor/catalog-items/{id}/stock-receipts"
    description: "Receive stock; then run the backorder waterfall for this item"
    roles: [WarehouseManager]
    code: 201
    input: [qty]
    output: CatalogItem
    side_effects:
      - "stock_on_hand += qty"
      - "run backorder_waterfall (fills OPEN BackorderAllocations oldest-release-first, then oldest-line-first)"
      - "increments CatalogItem.version by 1"

  # --- JobAccount ---
  - method: POST
    path: "/distributor/job-accounts"
    description: "Open a job account for a contractor"
    roles: [SalesRep]
    code: 201
    input: [contractor_id, job_name, jobsite_address, pricing_mode, "escalation_cap_pct?", "lien_waiver_required?"]
    output: JobAccount
    side_effects: ["status = OPEN"]
  - method: GET
    path: "/distributor/job-accounts"
    description: "List job accounts"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: ["contractor_id?", "status?", "limit?", "offset?"]
    output: "JobAccount[]"
    side_effects: []
  - method: GET
    path: "/distributor/job-accounts/{id}"
    description: "Get a job account"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: []
    output: JobAccount
    side_effects: []
  - method: POST
    path: "/distributor/job-accounts/{id}/close"
    description: "Close a job account (guarded by open children)"
    roles: [BranchManager]
    code: 200
    input: []
    output: JobAccount
    side_effects: ["status -> CLOSED"]
  - method: POST
    path: "/distributor/job-accounts/{id}/lien-waivers"
    description: "File a lien waiver on the job account (replaces any prior expiry)"
    roles: [CreditManager]
    code: 201
    input: [expires_on]
    output: JobAccount
    side_effects: ["lien_waiver_expires_on = expires_on", "increments JobAccount.version by 1"]

  # --- Quote ---
  - method: POST
    path: "/distributor/quotes"
    description: "Create a DRAFT quote for a job account"
    roles: [SalesRep]
    code: 201
    input: [job_account_id, valid_until]
    output: Quote
    side_effects: ["status = DRAFT", "revision_no = 1"]
  - method: GET
    path: "/distributor/quotes"
    description: "List quotes"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: ["job_account_id?", "status?", "limit?", "offset?"]
    output: "Quote[]"
    side_effects: []
  - method: GET
    path: "/distributor/quotes/{id}"
    description: "Get a quote (lazy expiry applies)"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: []
    output: Quote
    side_effects: ["if logical clock date > valid_until and status in {DRAFT, SUBMITTED}: status -> EXPIRED"]
  - method: POST
    path: "/distributor/quotes/{id}/submit"
    description: "Submit a DRAFT quote"
    roles: [SalesRep]
    code: 200
    input: []
    output: Quote
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/distributor/quotes/{id}/revise"
    description: "Return a SUBMITTED quote to DRAFT as a new revision (OCC-guarded)"
    roles: [SalesRep]
    code: 200
    input: [expected_quote_version]
    output: Quote
    side_effects: ["status -> DRAFT", "revision_no += 1", "increments Quote.version by 1"]
  - method: POST
    path: "/distributor/quotes/{id}/award"
    description: "Award a SUBMITTED quote; pins award_month and award_index_value"
    roles: [BranchManager]
    code: 200
    input: []
    output: Quote
    side_effects: ["status -> AWARDED", "award_month = clock YYYY-MM", "award_index_value = latest reading <= award_month (null if none)"]

  # --- QuoteLine (BOM takeoff) ---
  - method: POST
    path: "/distributor/quote-lines"
    description: "Add a BOM line to a DRAFT quote"
    roles: [SalesRep]
    code: 201
    input: [quote_id, catalog_item_id, qty, unit_price_cents]
    output: QuoteLine
    side_effects: ["FOOT items: qty >= min_cut_ft enforced (ERR_BELOW_MIN_CUT)", "quote must be DRAFT (ERR_QUOTE_NOT_DRAFT)"]
  - method: GET
    path: "/distributor/quote-lines"
    description: "List quote lines"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: ["quote_id?", "catalog_item_id?", "limit?", "offset?"]
    output: "QuoteLine[]"
    side_effects: []
  - method: GET
    path: "/distributor/quote-lines/{id}"
    description: "Get a quote line"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: []
    output: QuoteLine
    side_effects: []

  # --- SubstitutionRequest ---
  - method: POST
    path: "/distributor/substitution-requests"
    description: "Propose a substitute item for a quote line"
    roles: [SalesRep]
    code: 201
    input: [quote_line_id, proposed_item_id, reason]
    output: SubstitutionRequest
    side_effects: ["status = PROPOSED", "owning quote must be DRAFT (ERR_QUOTE_NOT_DRAFT)"]
  - method: GET
    path: "/distributor/substitution-requests"
    description: "List substitution requests"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: ["quote_line_id?", "proposed_item_id?", "status?", "limit?", "offset?"]
    output: "SubstitutionRequest[]"
    side_effects: []
  - method: GET
    path: "/distributor/substitution-requests/{id}"
    description: "Get a substitution request"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: []
  - method: POST
    path: "/distributor/substitution-requests/{id}/decide"
    description: "Approve or reject a proposed substitution"
    roles: [BranchManager]
    code: 200
    input: [decision]
    output: SubstitutionRequest
    side_effects: ["APPROVE: QuoteLine.catalog_item_id = proposed_item_id", "status -> APPROVED | REJECTED"]

  # --- Release (job-account release) ---
  - method: POST
    path: "/distributor/releases"
    description: "Create a release against an awarded quote (OCC-guarded on the job account)"
    roles: [SalesRep, Contractor]
    code: 201
    input: [job_account_id, quote_id, expected_job_account_version, lines]
    side_effects:
      - "status = REQUESTED"
      - "ReleaseLine rows created from `lines` (array of {catalog_item_id, qty}) with qty_allocated = 0"
      - "estimated_total_cents computed (provisional billing, qty_requested, clock at creation)"
      - "quote must be AWARDED on the same job account (state); every line item must appear on the quote (ERR_ITEM_NOT_ON_QUOTE); FOOT qty >= min_cut_ft (ERR_BELOW_MIN_CUT)"
      - "job account must be OPEN (ERR_JOB_NOT_OPEN)"
      - "increments JobAccount.version by 1"
    output: Release
  - method: GET
    path: "/distributor/releases"
    description: "List releases"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: ["job_account_id?", "quote_id?", "status?", "limit?", "offset?"]
    output: "Release[]"
    side_effects: []
  - method: GET
    path: "/distributor/releases/{id}"
    description: "Get a release"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: []
    output: Release
    side_effects: []
  - method: POST
    path: "/distributor/releases/{id}/credit-approve"
    description: "Credit-approve a REQUESTED release (lien waiver + headroom checks)"
    roles: [CreditManager]
    code: 200
    input: []
    output: Release
    side_effects: ["status -> CREDIT_APPROVED", "Contractor.committed_balance_cents += estimated_total_cents"]
  - method: POST
    path: "/distributor/releases/{id}/allocate"
    description: "Allocate stock to a CREDIT_APPROVED release"
    roles: [WarehouseManager]
    code: 200
    input: []
    output: Release
    side_effects:
      - "per line (created_at ASC): qty_allocated = min(qty_requested, stock_on_hand); stock_on_hand/stock_allocated updated"
      - "status -> ALLOCATED if all lines full else PARTIALLY_ALLOCATED"
      - "short lines get an OPEN BackorderAllocation (qty_open = shortfall)"
  - method: POST
    path: "/distributor/releases/{id}/schedule"
    description: "Schedule jobsite delivery for an ALLOCATED release"
    roles: [Dispatcher]
    code: 200
    input: [truck_id, delivery_date, window_start_hour, window_end_hour]
    output: Release
    side_effects: ["status -> SCHEDULED", "stamps truck_id/delivery_date/window hours"]
  - method: POST
    path: "/distributor/releases/{id}/deliver"
    description: "Mark a SCHEDULED release delivered"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Release
    side_effects: ["status -> DELIVERED", "lines: qty_shipped = qty_allocated, -> SHIPPED", "stock_allocated relieved"]
  - method: POST
    path: "/distributor/releases/{id}/invoice"
    description: "Invoice a DELIVERED release (final billing; credit contagion cascade)"
    roles: [CreditManager]
    code: 200
    input: []
    output: Release
    side_effects:
      - "billed_total_cents + per-line billed_amount_cents computed; lines -> INVOICED"
      - "invoiced_on = clock date"
      - "Contractor: committed_balance_cents -= estimated_total_cents; invoiced_balance_cents += billed_total_cents"
      - "if invoiced_balance_cents > credit_limit_cents: all OPEN JobAccounts of the contractor -> CREDIT_HOLD"
  - method: POST
    path: "/distributor/releases/{id}/cancel"
    description: "Cancel a release before scheduling"
    roles: [SalesRep, Contractor]
    code: 200
    input: []
    output: Release
    side_effects: ["status -> CANCELLED", "allocated stock returns to on_hand", "OPEN backorders -> CANCELLED", "committed balance released"]

  # --- ReleaseLine / BackorderAllocation reads ---
  - method: GET
    path: "/distributor/release-lines"
    description: "List release lines"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: ["release_id?", "catalog_item_id?", "status?", "limit?", "offset?"]
    output: "ReleaseLine[]"
    side_effects: []
  - method: GET
    path: "/distributor/release-lines/{id}"
    description: "Get a release line"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: []
    output: ReleaseLine
    side_effects: []
  - method: GET
    path: "/distributor/backorder-allocations"
    description: "List backorder allocations"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: ["release_line_id?", "catalog_item_id?", "status?", "limit?", "offset?"]
    output: "BackorderAllocation[]"
    side_effects: []
  - method: GET
    path: "/distributor/backorder-allocations/{id}"
    description: "Get a backorder allocation"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: []
    output: BackorderAllocation
    side_effects: []

  # --- RebateProgram / RebateClaim ---
  - method: POST
    path: "/distributor/rebate-programs"
    description: "Create a manufacturer rebate program (closed-interval period; overlap per manufacturer rejected)"
    roles: [RebateClerk]
    code: 201
    input: [manufacturer_name, period_start, period_end, tiers]
    output: RebateProgram
    side_effects: []
  - method: GET
    path: "/distributor/rebate-programs"
    description: "List rebate programs"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: ["manufacturer_name?", "limit?", "offset?"]
    output: "RebateProgram[]"
    side_effects: []
  - method: GET
    path: "/distributor/rebate-programs/{id}"
    description: "Get a rebate program"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: []
    output: RebateProgram
    side_effects: []
  - method: POST
    path: "/distributor/rebate-claims"
    description: "Open a rebate claim (provisional accrual computed at creation)"
    roles: [RebateClerk]
    code: 201
    input: [rebate_program_id]
    output: RebateClaim
    side_effects: ["status = DRAFT", "provisional_amount_cents computed (sum-then-round variant)"]
  - method: GET
    path: "/distributor/rebate-claims"
    description: "List rebate claims"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: ["rebate_program_id?", "status?", "limit?", "offset?"]
    output: "RebateClaim[]"
    side_effects: []
  - method: GET
    path: "/distributor/rebate-claims/{id}"
    description: "Get a rebate claim"
    roles: [SalesRep, BranchManager, CreditManager, WarehouseManager, Dispatcher, RebateClerk, Contractor]
    code: 200
    input: []
    output: RebateClaim
    side_effects: []
  - method: POST
    path: "/distributor/rebate-claims/{id}/submit"
    description: "Submit a DRAFT claim after the program period ends (final per-line computation)"
    roles: [RebateClerk]
    code: 200
    input: []
    output: RebateClaim
    side_effects: ["status -> SUBMITTED", "qualifying_base_cents / tier_pct_applied / final_amount_cents recomputed (round-per-line variant)"]
  - method: POST
    path: "/distributor/rebate-claims/{id}/decide"
    description: "Approve or reject a SUBMITTED claim"
    roles: [BranchManager]
    code: 200
    input: [decision]
    output: RebateClaim
    side_effects: ["status -> APPROVED | REJECTED"]

  # --- Test-driving endpoints ---
  - method: POST
    path: "/distributor/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [BranchManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []
  - method: POST
    path: "/distributor/_index-readings/set"
    description: "Publish a commodity index reading for a month (upsert: month is unique, a repeated month replaces the value)"
    roles: [BranchManager]
    code: 200
    input: [month, index_value]
    output: { month: string, index_value: number }
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not recognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint; or Contractor-role caller does not own the target job account" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, qty <= 0, window_end_hour <= window_start_hour, FOOT/EA reel-field mismatch" }
  - { id: ERR_CONTRACTOR_NOT_FOUND, http: 404, condition: "No contractor with the given id" }
  - { id: ERR_CATALOG_ITEM_NOT_FOUND, http: 404, condition: "No catalog item with the given id" }
  - { id: ERR_JOB_ACCOUNT_NOT_FOUND, http: 404, condition: "No job account with the given id" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "No quote with the given id" }
  - { id: ERR_QUOTE_LINE_NOT_FOUND, http: 404, condition: "No quote line with the given id" }
  - { id: ERR_SUBSTITUTION_REQUEST_NOT_FOUND, http: 404, condition: "No substitution request with the given id" }
  - { id: ERR_RELEASE_NOT_FOUND, http: 404, condition: "No release with the given id" }
  - { id: ERR_REBATE_PROGRAM_NOT_FOUND, http: 404, condition: "No rebate program with the given id" }
  - { id: ERR_REBATE_CLAIM_NOT_FOUND, http: 404, condition: "No rebate claim with the given id" }
  - { id: ERR_STALE_QUOTE_VERSION, http: 412, condition: "expected_quote_version does not match the quote's current version" }
  - { id: ERR_STALE_JOB_ACCOUNT_VERSION, http: 412, condition: "expected_job_account_version does not match the job account's current version" }
  - { id: ERR_QUOTE_NOT_DRAFT, http: 409, condition: "Quote line add / substitution propose or decide requires the quote in DRAFT" }
  - { id: ERR_QUOTE_NOT_SUBMITTED, http: 409, condition: "Revise or award requires the quote in SUBMITTED" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Logical clock date is past valid_until; quote transitions to EXPIRED" }
  - { id: ERR_QUOTE_HAS_NO_LINES, http: 409, condition: "Submit requires at least one quote line" }
  - { id: ERR_SUBSTITUTION_NOT_PROPOSED, http: 409, condition: "Decide requires the substitution request in PROPOSED" }
  - { id: ERR_JOB_NOT_OPEN, http: 409, condition: "Operation requires the job account in OPEN (quote submit/award, release create, close)" }
  - { id: ERR_JOB_ON_CREDIT_HOLD, http: 409, condition: "Credit-approve requires the job account not be in CREDIT_HOLD" }
  - { id: ERR_JOB_HAS_OPEN_RELEASES, http: 409, condition: "Close blocked: non-terminal quotes or releases exist on the job account" }
  - { id: ERR_RELEASE_NOT_REQUESTED, http: 409, condition: "Credit-approve requires the release in REQUESTED" }
  - { id: ERR_RELEASE_NOT_CREDIT_APPROVED, http: 409, condition: "Allocate requires the release in CREDIT_APPROVED" }
  - { id: ERR_RELEASE_NOT_ALLOCATED, http: 409, condition: "Schedule requires the release in ALLOCATED" }
  - { id: ERR_RELEASE_NOT_SCHEDULED, http: 409, condition: "Deliver requires the release in SCHEDULED" }
  - { id: ERR_RELEASE_NOT_DELIVERED, http: 409, condition: "Invoice requires the release in DELIVERED" }
  - { id: ERR_RELEASE_NOT_CANCELLABLE, http: 409, condition: "Cancel requires the release in REQUESTED, CREDIT_APPROVED, PARTIALLY_ALLOCATED, or ALLOCATED" }
  - { id: ERR_REBATE_CLAIM_NOT_DRAFT, http: 409, condition: "Submit requires the claim in DRAFT" }
  - { id: ERR_REBATE_CLAIM_NOT_SUBMITTED, http: 409, condition: "Decide requires the claim in SUBMITTED" }
  - { id: ERR_REBATE_PERIOD_NOT_ENDED, http: 409, condition: "Claim submit requires the logical clock date to be after the program period_end" }
  - { id: ERR_REBATE_PERIOD_OVERLAP, http: 409, condition: "Same-manufacturer program whose closed period interval intersects an existing program (shared boundary dates conflict)" }
  - { id: ERR_LIEN_WAIVER_REQUIRED, http: 409, condition: "Job requires a lien waiver and none is currently on file (missing or expired)" }
  - { id: ERR_DELIVERY_WINDOW_PAST, http: 409, condition: "delivery_date is before the logical clock date" }
  - { id: ERR_TRUCK_WINDOW_OVERLAP, http: 409, condition: "Same truck, same date, half-open window overlap with an existing SCHEDULED/DELIVERED release" }
  - { id: ERR_JOBSITE_DAY_CONFLICT, http: 409, condition: "Another release on the same job account already has a SCHEDULED/DELIVERED delivery on that date" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "estimated_total_cents strictly greater than credit headroom at approve time" }
  - { id: ERR_BELOW_MIN_CUT, http: 422, condition: "FOOT line qty below the item's min_cut_ft" }
  - { id: ERR_ITEM_NOT_ON_QUOTE, http: 422, condition: "Release line references a catalog item not present on the release's quote" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "Catalog item sku already exists" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SalesRep
    description: "Inside sales: builds job accounts, quotes, BOM takeoff, substitutions; requests releases"
    identity: opaque
    exclusive_operations:
      - "POST /distributor/job-accounts"
      - "POST /distributor/quotes + submit + revise"
      - "POST /distributor/quote-lines"
      - "POST /distributor/substitution-requests"
    shared_operations: ["POST /distributor/releases + cancel (with Contractor)", "all GET endpoints"]
  - name: BranchManager
    description: "Branch manager: awards quotes, decides substitutions and rebate claims, closes accounts; operates test-driving endpoints"
    identity: opaque
    exclusive_operations:
      - "POST /distributor/quotes/{id}/award"
      - "POST /distributor/substitution-requests/{id}/decide"
      - "POST /distributor/rebate-claims/{id}/decide"
      - "POST /distributor/job-accounts/{id}/close"
      - "POST /distributor/_clock/set_current_utc"
      - "POST /distributor/_index-readings/set"
    shared_operations: ["all GET endpoints"]
  - name: CreditManager
    description: "Credit desk: contractor onboarding, payments, lien waivers, credit approval, invoicing"
    identity: opaque
    exclusive_operations:
      - "POST /distributor/contractors + payments"
      - "POST /distributor/job-accounts/{id}/lien-waivers"
      - "POST /distributor/releases/{id}/credit-approve"
      - "POST /distributor/releases/{id}/invoice"
    shared_operations: ["all GET endpoints"]
  - name: WarehouseManager
    description: "Warehouse: catalog maintenance, stock receipts, allocation"
    identity: opaque
    exclusive_operations:
      - "POST /distributor/catalog-items + stock-receipts"
      - "POST /distributor/releases/{id}/allocate"
    shared_operations: ["all GET endpoints"]
  - name: Dispatcher
    description: "Dispatch: jobsite delivery scheduling and delivery confirmation"
    identity: opaque
    exclusive_operations:
      - "POST /distributor/releases/{id}/schedule"
      - "POST /distributor/releases/{id}/deliver"
    shared_operations: ["all GET endpoints"]
  - name: RebateClerk
    description: "Manufacturer programs: rebate program setup and claim submission"
    identity: opaque
    exclusive_operations:
      - "POST /distributor/rebate-programs"
      - "POST /distributor/rebate-claims + submit"
    shared_operations: ["all GET endpoints"]
  - name: Contractor
    description: "External contractor user: requests/releases against own job accounts only"
    identity: "entity_backed:Contractor"
    exclusive_operations: []
    shared_operations: ["POST /distributor/releases + cancel (own job accounts only; X-User-ID must equal JobAccount.contractor_id)", "all GET endpoints"]
