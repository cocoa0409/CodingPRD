  - rule_id: combinatorial_formula
    instances:
      - name: wage_settlement_pins_nested_rounding_order_sum_then_round
        grounds:
          - calculations.wage_settlement
          - entities.EmployerPartner.fields.wage_liability_cents
          - endpoints["POST /wbl/placements/{placementId}/settle-wages"]
          - validations[priority=52]
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: settling with mode FINAL freezes 12737
          cents (sum 9.99 hours, then one rounding) while the PROVISIONAL figure on the same rows is
          12738 cents (round each of three entries, then sum), and only the FINAL figure reaches
          EmployerPartner.wage_liability_cents.
        test_recipe:
          setup:
            - "logical clock at 2026-09-14T08:00:00Z"
            - "EXECUTED agreement on an APPROVED worksite with a trained supervisor"
            - "PAID placement at 1275 cents/hour with required_evaluation_cycles 1, ACTIVE and CLEARED"
