            - call: "POST /eeoc/investigation-cases/${inv_i1}/assign"
              payload: { investigator_user_id: "inv-007" }
              as: Director
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cp_19}", employer_id: "${emp_i}", basis_codes: ["SEX"], incident_date: "2026-06-01", harm_description: "demoted", employee_count_at_incident: 40 }
              as: IntakeOfficer
