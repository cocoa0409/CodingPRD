            - "ProgramYear.${py_id}.committed_cents == 0"
            - "ProgramYear.${py_id}.paid_cents == 10000"

      - name: reported_kwh_conservation_through_reject
        grounds:
          - state_machines.RebateApplication.VERIFIED_to_REJECTED
          - entities.ProgramYear.fields.reported_kwh
        distinguishing_aspect: |
          Conserved quantity: reported kwh. Invariant: ProgramYear.reported_kwh
          == sum of final_kwh over applications in {VERIFIED, APPROVED, PAID}.
          A VERIFIED → REJECTED transition decrements reported_kwh by exactly
          that application's final_kwh, restoring the invariant. Distinct
          conserved quantity (kwh, not cents) from instance 1.
        test_recipe:
          setup:
            - "OPEN ProgramYear; two applications VERIFIED, each with final_kwh=100"
            - "ProgramYear.reported_kwh == 200 before reject"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { program_code: "RES-HVAC-2026", program_year_label: "PY2026", budget_cap_cents: 20000000, savings_goal_kwh: 500000 }
              as: ProgramAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /measures"
              payload: { program_year_id: "${py_id}", measure_code: "M1", measure_name: "M1", base_rate_cents: 10000, deemed_kwh_per_unit: 100 }
              as: ProgramAdministrator
              captures: { m1: $.data.id }
            - call: "POST /program-years/${py_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /trade-allies"
              payload: { ally_name: "Acme", license_number: "LIC-001" }
              as: ProgramAdministrator
              captures: { ally_id: $.data.id }
            - call: "POST /trade-allies/${ally_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "C1", service_address: "1 A", invoice_number: "I-1", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { app_a: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${app_a}", measure_id: "${m1}", quantity: 1 }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { line_a: $.data.id }
            - call: "POST /savings-claims"
              payload: { line_item_id: "${line_a}", claim_method: "DEEMED" }
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${app_a}/submit"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${app_a}/verify"
              payload: {}
              as: VerificationInspector
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "C2", service_address: "2 B", invoice_number: "I-2", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { app_b: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${app_b}", measure_id: "${m1}", quantity: 1 }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { line_b: $.data.id }
            - call: "POST /savings-claims"
              payload: { line_item_id: "${line_b}", claim_method: "DEEMED" }
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${app_b}/submit"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${app_b}/verify"
              payload: {}
              as: VerificationInspector
          trigger:
            - call: "POST /applications/${app_b}/reject"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "RebateApplication.${app_b}.status == 'REJECTED'"
            - "ProgramYear.${py_id}.reported_kwh == 100 (only app_a's final_kwh remains)"
