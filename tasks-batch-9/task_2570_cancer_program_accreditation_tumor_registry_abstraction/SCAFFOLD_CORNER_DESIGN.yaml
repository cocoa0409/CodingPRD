      - name: deficiency_due_dates_use_severity_windows_and_extend_on_rejection
        claim_type: Constants Applied
        grounds:
          - calculations.deficiency_response_window
          - entities.Deficiency.fields.response_due_date
          - state_machines.Deficiency.deficiency_state
        distinguishing_aspect: |
          The three severity windows are distinct constants (30/45/60) and the rejection extension is
          additive on top of the ORIGINAL due date, so the MAJOR deficiency cited 2026-08-01 moves
          from 2026-09-15 to 2026-09-30 - not to clock + 15 days. The CRITICAL citation also freezes
          the registry posture in the same request.
        test_recipe:
          setup:
            - "One ACCREDITED program; the surveyor cites one deficiency of each severity on the clock date 2026-08-01."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/deficiencies"
              payload: { program_id: "${prog_id}", standard_code: "STD-4.4", severity: "CRITICAL", cited_on: "2026-08-01" }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
              captures: { def_c_id: $.data.id }
            - call: "POST /cancer-registry/deficiencies"
              payload: { program_id: "${prog_id}", standard_code: "STD-6.1", severity: "MAJOR", cited_on: "2026-08-01" }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
              captures: { def_m_id: $.data.id }
            - call: "POST /cancer-registry/deficiencies"
              payload: { program_id: "${prog_id}", standard_code: "STD-7.2", severity: "MINOR", cited_on: "2026-08-01" }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
              captures: { def_n_id: $.data.id }
            - call: "POST /cancer-registry/deficiencies/${def_m_id}/response"
              payload: { response_narrative: "Corrective action plan filed with monthly monitoring." }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
            - call: "POST /cancer-registry/deficiencies/${def_m_id}/response-review"
              payload: { outcome: "REJECTED", reviewer_notes: "Plan lacks measurable monitoring." }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
          assert:
            - "the CRITICAL deficiency has response_due_date == 2026-08-31 and deficiency_state CITED"
            - "the MINOR deficiency has response_due_date == 2026-09-30"
            - "the MAJOR deficiency had response_due_date == 2026-09-15 at citation"
            - "after the rejection the MAJOR deficiency has deficiency_state == RESPONSE_REJECTED, escalation_count == 1 and response_due_date == 2026-09-30 (2026-09-15 + 15, not 2026-08-16)"
            - "CancerProgram.${prog_id}.open_critical_deficiency_count == 1 and registry_posture == FROZEN, while accreditation_state is still ACCREDITED"

