  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: fraud_confirm_cascades_ride_review_settlement_reopen_statement_draft
        grounds:
          - state_machines.FraudFlag.OPEN_to_CONFIRMED
          - state_machines.Ride.COMPLETED_to_UNDER_REVIEW
          - state_machines.GuaranteeSettlement.FINALIZED_to_REOPENED
          - state_machines.EarningsStatement
        distinguishing_aspect: |
          Depth-3 cascade from trigger POST /fraud-flags/{id}/confirm: the confirm
          (link 1) forces the anchor ride COMPLETED -> UNDER_REVIEW (link 2),
          which reopens the driver's FINALIZED settlement (link 3) and flips its
          basis back to PROVISIONAL semantics, gating re-finalize until the ride
          resolves. Each link is caused by the previous link, not by the confirm.
