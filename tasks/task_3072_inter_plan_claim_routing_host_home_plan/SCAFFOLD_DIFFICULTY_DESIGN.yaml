        grounds:
          - state_machines.Adjustment.PROPAGATED_to_APPLIED
          - state_machines.Claim.ADJUSTMENT_PENDING_to_PAID
          - calculations.recovery_computation
          - calculations.plan_balance_reconciliation
        distinguishing_aspect: |
          Depth-3 cascade triggered by the adjustment-apply transition: apply
          mutates the Adjustment (status APPLIED); that mutation drives the
