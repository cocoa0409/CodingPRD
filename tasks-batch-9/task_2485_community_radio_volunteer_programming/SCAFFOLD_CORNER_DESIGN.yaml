scaffold_corner_design:

  # =========================================================================
  # SECTION 1 - ENTITIES  (claim types from claim-extraction-guide Table 1
  # plus the `flat` topology extra: "Foreign key references validated;
  # cross-reference integrity")
  # =========================================================================
  - section: entities
    instances:

      - name: volunteer_creation_returns_declared_fields_and_prospect_defaults
        claim_type: Creation
        grounds: [ entities.Volunteer, "endpoints[POST /volunteers]" ]
        distinguishing_aspect: >
          Pins the create-time contract of the root entity: every input field is
          echoed, every computed field lands on its declared default, and no
          §1.3 transition has run yet. Unlike volunteer_retrieval_echoes_the_stored_row
          this asserts on the 201 create response itself, not on a later read.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned so that continuous_service_months is deterministic."
          setup_api_calls:
            - &k_clock { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramDirector }
          trigger:
            - &k_ada
              call: "POST /volunteers"
              payload: { legal_name: "Ada Reyes", email: "ada@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2024-08-01" }
              as: TrainingCoordinator
              captures: { host_id: "$.data.id" }
          assert:
            - "the response status is 201 and response_type is \"object\""
            - "meta.api_request_id and meta.api_request_timestamp are present"
            - "data.legal_name == \"Ada Reyes\", data.email == \"ada@krcr.example\", data.role_track == \"PROGRAMMER\", data.seniority_start_date == \"2024-08-01\""
            - "data.status == \"PROSPECT\" (the §1.3 Volunteer initial state; status is never accepted as input)"
            - "data.committee_seat == false (declared default)"
            - "data.strike_count == 0, data.seniority_score == 0.00, data.needs_core_renewal == true"
            - "data.current_certification_count == 0"
            - "data.continuous_service_months == 24 (2024-08-01 to the 2026-08-01 clock, whole months only)"
            - "data.id is a non-empty string, data.version == 1, data.created_at == data.updated_at == \"2026-08-01T00:00:00Z\""

      - name: volunteer_retrieval_echoes_the_stored_row
        claim_type: Retrieval
        grounds: [ entities.Volunteer, "endpoints[GET /volunteers/{volunteerId}]" ]
        distinguishing_aspect: >
          Verifies the single-row read path returns the persisted row unchanged
          and does not recompute anything on read; the sibling Creation instance
          only proves the write response.
        test_recipe:
          setup:
            - "One volunteer exists, created at the pinned clock."
          setup_api_calls:
            - *k_clock
            - *k_ada
          trigger:
            - call: "GET /volunteers/${host_id}"
              as: ProgramDirector
              captures: { read_back_id: "$.data.id" }
          assert:
            - "the response status is 200 and response_type is \"object\""
            - "data.id equals the id returned by the create call"
            - "data.legal_name == \"Ada Reyes\" and data.status == \"PROSPECT\""
            - "data.version == 1 - a pure read does not bump the OCC version"

      - name: volunteer_listing_paginates_and_reports_total_count
        claim_type: Listing
        grounds: [ entities.Volunteer, "endpoints[GET /volunteers]", response_envelope.pagination_fields ]
        distinguishing_aspect: >
          Exercises the array envelope and the four declared pagination fields
          against a 3-row table with limit 2, so has_more must be true; the
          Retrieval instance covers the object envelope instead.
        test_recipe:
          setup:
            - "Exactly three volunteers exist."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - &k_bo
              call: "POST /volunteers"
              payload: { legal_name: "Bo Lin", email: "bo@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }
              as: TrainingCoordinator
              captures: { bo_id: "$.data.id" }
            - &k_cy
              call: "POST /volunteers"
              payload: { legal_name: "Cy Nakamura", email: "cy@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }
              as: TrainingCoordinator
              captures: { cy_id: "$.data.id" }
          trigger:
            - call: "GET /volunteers"
              payload: { limit: 2, offset: 0 }
              as: ProgramDirector
              captures: { first_page_id: "$.data[0].id" }
          assert:
            - "the response status is 200 and response_type is \"array\""
            - "data holds exactly 2 rows"
            - "the pagination block reports limit == 2, offset == 0, total_count == 3 and has_more == true"

      - name: volunteer_get_unknown_id_not_found
        claim_type: Not Found
        grounds: [ "endpoints[GET /volunteers/{volunteerId}]", "validations[priority=30 v_path_resource_exists]", "errors[ERR_VOLUNTEER_NOT_FOUND]" ]
        distinguishing_aspect: >
          Proves the path-resource existence check fires on a syntactically valid
          but absent id, returning the entity-specific 404 code rather than the
          generic ERR_VALIDATION used by the Type Constraints instance.
        test_recipe:
          setup:
            - "The volunteer table is empty."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /volunteers/11111111-1111-1111-1111-111111111111"
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 404 and response_type is \"error\""
            - "data.error_id == \"ERR_VOLUNTEER_NOT_FOUND\""

      - name: volunteer_create_missing_required_role_track_is_rejected
        claim_type: Required Fields
        grounds: [ "endpoints[POST /volunteers]", "validations[priority=20 v_required_fields]", "errors[ERR_VALIDATION]" ]
        distinguishing_aspect: >
          Omits a declared-required input entirely; the sibling Type Constraints
          instance supplies the field but with a value outside the enum domain,
          which is the priority-21 rule, not the priority-20 rule.
        test_recipe:
          setup:
            - "Clock pinned; no rows required."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /volunteers"
              payload: { legal_name: "No Track", email: "notrack@krcr.example", seniority_start_date: "2024-08-01" }
              as: TrainingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 400 and data.error_id == \"ERR_VALIDATION\""
            - "no Volunteer row is created: a subsequent GET /volunteers reports total_count == 0"

      - name: volunteer_create_invalid_enum_role_track_is_rejected
        claim_type: Type Constraints
        grounds: [ entities.Volunteer.fields.role_track, "validations[priority=21 v_enum_domain]", "errors[ERR_VALIDATION]" ]
        distinguishing_aspect: >
          The field is present but "PHONE_BANK" is not in the declared domain
          PROGRAMMER | ENGINEER | DEVELOPMENT, so the enum-domain rule rejects it
          rather than the required-field rule.
        test_recipe:
          setup:
            - "Clock pinned; no rows required."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /volunteers"
              payload: { legal_name: "Wrong Track", email: "wrong@krcr.example", role_track: "PHONE_BANK", seniority_start_date: "2024-08-01" }
              as: TrainingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 400 and data.error_id == \"ERR_VALIDATION\""

      - name: volunteer_patch_with_invalid_payload_cannot_set_status
        claim_type: Immutability
        grounds: [ entities.Volunteer.fields.status, "endpoints[PATCH /volunteers/{volunteerId}]", "errors[ERR_VALIDATION]" ]
        distinguishing_aspect: >
          status is source=computed and PATCH declares only legal_name, email and
          committee_seat, so a client attempt to drive the roster state machine
          through the update endpoint must be refused - the state may only move
          via the §1.3 triggers.
        test_recipe:
          setup:
            - "One PROSPECT volunteer exists."
          setup_api_calls:
            - *k_clock
            - *k_ada
          trigger:
            - call: "PATCH /volunteers/${host_id}"
              payload: { status: "CERTIFIED" }
              as: TrainingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 400 and data.error_id == \"ERR_VALIDATION\""
            - "GET /volunteers/${host_id} still reports status == \"PROSPECT\" and version == 1"

      - name: premium_item_creation_seeds_inventory_and_system_fields
        claim_type: Defaults
        grounds: [ entities.PremiumItem, "endpoints[POST /premium-items]" ]
        distinguishing_aspect: >
          on_hand_qty has no literal default - it is seeded from the supplied
          units_received_qty - which distinguishes it from reserved_qty and
          shipped_qty, whose defaults are constant zero.
        test_recipe:
          setup:
            - "Clock pinned; premium catalogue empty."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /premium-items"
              payload: { sku: "MUG-01", name: "Station mug", tier_threshold_cents: 5000, fair_market_value_cents: 1500, units_received_qty: 2 }
              as: DevelopmentCoordinator
              captures: { mug_id: "$.data.id" }
          assert:
            - "the response status is 201 and data.on_hand_qty == 2 (seeded from units_received_qty, not defaulted)"
            - "data.reserved_qty == 0 and data.shipped_qty == 0"
            - "data.status == \"AVAILABLE\" because on_hand_qty - reserved_qty == 2 > 0"
            - "data.id, data.created_at, data.updated_at are server-stamped and data.version == 1"
            - "the §1.4 invariant holds at creation: on_hand_qty + shipped_qty == units_received_qty == 2"

      - name: membership_drive_creation_defaults_to_planned_with_zero_totals
        claim_type: Defaults
        grounds: [ entities.MembershipDrive, "endpoints[POST /membership-drives]", "state_machines.MembershipDrive.initial" ]
        distinguishing_aspect: >
          Covers the aggregate-counter defaults on a second entity family: five
          money roll-ups and attainment_pct all start at zero while the status
          starts at the §1.3 initial state PLANNED, whereas the PremiumItem
          instance covers an input-seeded default.
        test_recipe:
          setup:
            - "Clock pinned; no drives exist."
          setup_api_calls:
            - *k_clock
          trigger:
            - &k_drive
              call: "POST /membership-drives"
              payload: { name: "Fall Drive 2026", goal_cents: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-10T00:00:00Z", phone_line_count: 2 }
              as: DevelopmentCoordinator
              captures: { drive_id: "$.data.id" }
          assert:
            - "the response status is 201 and data.status == \"PLANNED\""
            - "data.gross_pledged_cents == 0, data.pledged_total_cents == 0, data.fulfilled_total_cents == 0, data.refunded_total_cents == 0, data.lapsed_total_cents == 0"
            - "data.attainment_pct == 0.00 (2-decimal money share, not null)"
            - "data.version == 1"

      - name: certification_grading_computes_issue_and_expiry_dates
        claim_type: Computed Fields
        grounds: [ entities.CertificationRecord.fields.expires_on, "state_machines.CertificationRecord.PENDING_EXAM_to_PASSED", "endpoints[POST /volunteers/{volunteerId}/certifications]" ]
        distinguishing_aspect: >
          The inline-graded create path writes four computed fields at once
          (status, attempt_count, issued_on, expires_on) from a single input
          exam_score; the Defaults instances assert fields that are never
          derived from an input at all.
        test_recipe:
          setup:
            - "One PROSPECT volunteer exists; the clock reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_ada
          trigger:
            - &k_cert_board
              call: "POST /volunteers/${host_id}/certifications"
              payload: { cert_type: "BOARD_OPERATION", exam_score: 88 }
              as: TrainingCoordinator
              captures: { board_cert_id: "$.data.id" }
          assert:
            - "the response status is 201 and data.status == \"PASSED\" because 88 >= CERT_PASS_SCORE 80"
            - "data.attempt_count == 1 and data.last_attempt_at == \"2026-08-01T00:00:00Z\""
            - "data.issued_on == \"2026-08-01T00:00:00Z\""
            - "data.expires_on == \"2028-08-01T00:00:00Z\" (CERT_VALID_MONTHS 24 added to the issue date)"
            - "data.volunteer_id == ${host_id} and data.revocation_reason is null"

      - name: certification_create_under_unknown_volunteer_not_found
        claim_type: Parent Relationships
        grounds: [ "endpoints[POST /volunteers/{volunteerId}/certifications]", "validations[priority=30 v_path_resource_exists]", "errors[ERR_VOLUNTEER_NOT_FOUND]" ]
        distinguishing_aspect: >
          The parent id is carried in the path, so the priority-30 path-resource
          rule fires; the slot-assignment instance below carries the reference in
          the body and therefore trips the priority-32 body-FK rule instead.
        test_recipe:
          setup:
            - "No volunteers exist."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /volunteers/22222222-2222-2222-2222-222222222222/certifications"
              payload: { cert_type: "BOARD_OPERATION", exam_score: 88 }
              as: TrainingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 404 and data.error_id == \"ERR_VOLUNTEER_NOT_FOUND\""
            - "no CertificationRecord row is created"

      - name: certifications_reverse_lookup_lists_only_that_volunteers_rows
        claim_type: Listing
        grounds: [ "endpoints[GET /volunteers/{volunteerId}/certifications]", entities.CertificationRecord.fields.volunteer_id ]
        distinguishing_aspect: >
          Asserts the flat-topology reverse lookup is scoped by the path parent
          and additionally filtered by cert_type, so a volunteer holding three
          core records yields exactly one row; the Volunteer listing instance
          asserts pagination on an unscoped collection.
        test_recipe:
          setup:
            - "One volunteer holds all three core certifications, graded inline."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - &k_cert_policy
              call: "POST /volunteers/${host_id}/certifications"
              payload: { cert_type: "STATION_POLICY", exam_score: 90 }
              as: TrainingCoordinator
            - &k_cert_reg
              call: "POST /volunteers/${host_id}/certifications"
              payload: { cert_type: "BROADCAST_REGULATION", exam_score: 91 }
              as: TrainingCoordinator
          trigger:
            - call: "GET /volunteers/${host_id}/certifications"
              payload: { cert_type: "STATION_POLICY" }
              as: TrainingCoordinator
              captures: { policy_cert_id: "$.data[0].id" }
          assert:
            - "the response status is 200, response_type is \"array\" and data holds exactly 1 row"
            - "data[0].cert_type == \"STATION_POLICY\" and data[0].volunteer_id == ${host_id}"
            - "the pagination block reports total_count == 1"

      - name: slot_assignment_create_with_unknown_program_id_not_found
        claim_type: Foreign key references validated; cross-reference integrity
        grounds: [ "endpoints[POST /schedule-grids/{gridId}/slot-assignments]", "validations[priority=32 v_body_fk_exists]", "errors[ERR_PROGRAM_NOT_FOUND]" ]
        distinguishing_aspect: >
          Exercises the `flat` topology extra from the claim guide: the grid in
          the path exists, only the body FK is dangling, and the body-FK rule
          must be reached before any window-conflict arithmetic runs.
        test_recipe:
          setup:
            - "A DRAFT schedule grid exists; no programs exist."
          setup_api_calls:
            - *k_clock
            - &k_grid
              call: "POST /schedule-grids"
              payload: { season_code: "FALL-2026", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T23:59:00Z" }
              as: ProgramDirector
              captures: { grid_id: "$.data.id", grid_v0: "$.data.version" }
          trigger:
            - call: "POST /schedule-grids/${grid_id}/slot-assignments"
              payload: { expected_grid_version: "${grid_v0}", program_id: "33333333-3333-3333-3333-333333333333", day_of_week: 1, start_minute: 540, duration_minutes: 60 }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 404 and data.error_id == \"ERR_PROGRAM_NOT_FOUND\""
            - "GET /schedule-grids/${grid_id} still reports status == \"DRAFT\", total_assigned_minutes == 0 and the same version as the create response"

  # =========================================================================
  # SECTION 2 - STATE MACHINES  (claim types from Table 2, plus the `cyclic`
  # shape extras and the cascade-pattern rows)
  # =========================================================================
  - section: state_machines
    instances:

      - name: certification_pending_exam_to_passed_is_a_valid_transition
        claim_type: Valid Transition
        grounds: [ "state_machines.CertificationRecord.PENDING_EXAM_to_PASSED", "endpoints[POST /certifications/{certificationId}/exam-results]" ]
        distinguishing_aspect: >
          Takes the ungraded two-step route (create without exam_score, then grade)
          so PENDING_EXAM is actually observed as a resting state; the entities
          Computed Fields instance takes the inline-graded one-request route and
          therefore never observes PENDING_EXAM at all.
        test_recipe:
          setup:
            - "One PROSPECT volunteer; the clock reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - &k_cert_pending
              call: "POST /volunteers/${host_id}/certifications"
              payload: { cert_type: "BOARD_OPERATION" }
              as: TrainingCoordinator
              captures: { pending_cert_id: "$.data.id" }
          trigger:
            - call: "POST /certifications/${pending_cert_id}/exam-results"
              payload: { exam_score: 88 }
              as: TrainingCoordinator
              captures: { graded_status: "$.data.status" }
          assert:
            - "the create response reported status == \"PENDING_EXAM\", attempt_count == 0, issued_on == null and expires_on == null"
            - "the trigger response status is 200 and data.status == \"PASSED\""
            - "data.attempt_count == 1 and data.last_attempt_at == \"2026-08-01T00:00:00Z\""
            - "data.issued_on == \"2026-08-01T00:00:00Z\" and data.expires_on == \"2028-08-01T00:00:00Z\""
            - "GET /volunteers/${host_id} reports status == \"IN_TRAINING\" (only one of the three core types is held) and current_certification_count == 1"

      - name: certification_failed_to_pending_exam_reopens_the_cycle
        claim_type: Cyclic transition returns to an earlier state
        grounds: [ "state_machines.CertificationRecord.FAILED_to_PENDING_EXAM", complexity_profile.state_machine_shape, "endpoints[POST /certifications/{certificationId}/retake]" ]
        distinguishing_aspect: >
          Proves the declared cycle re-enters PENDING_EXAM while attempt_count is
          deliberately NOT reset - the counter is the only thing that survives the
          loop, which is what makes the attempt cap reachable at all.
        test_recipe:
          setup:
            - "A volunteer holds one FAILED BOARD_OPERATION record graded at 70 on 2026-08-01."
            - "The clock is then advanced to exactly last_attempt_at + 14 days."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - &k_cert_failed
              call: "POST /volunteers/${host_id}/certifications"
              payload: { cert_type: "BOARD_OPERATION", exam_score: 70 }
              as: TrainingCoordinator
              captures: { failed_cert_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /certifications/${failed_cert_id}/retake"
              as: TrainingCoordinator
              captures: { retaken_status: "$.data.status" }
          assert:
            - "the setup grading response reported status == \"FAILED\", attempt_count == 1, issued_on == null, expires_on == null"
            - "the trigger response status is 200 and data.status == \"PENDING_EXAM\""
            - "data.exam_score is null (cleared on re-entry) while data.attempt_count is still 1 (explicitly kept)"
            - "GET /certifications/${failed_cert_id} confirms status == \"PENDING_EXAM\", attempt_count == 1 and issued_on == null"

      - name: certification_retake_one_day_before_cooling_off_is_a_precondition_failure
        claim_type: Precondition Enforcement
        grounds: [ "state_machines.CertificationRecord.FAILED_to_PENDING_EXAM", "validations[priority=68 v_retake_cooling_off]", "errors[ERR_RETAKE_TOO_SOON]" ]
        distinguishing_aspect: >
          Same FAILED source state and same endpoint as the cycle instance, but
          the clock sits one day inside the 14-day cooling-off window, so the
          transition's temporal precondition - not its source-state check - is
          what rejects the call.
        test_recipe:
          setup:
            - "A volunteer holds one FAILED record with last_attempt_at 2026-08-01."
            - "The clock is advanced to 2026-08-14, one day short of the window."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_failed
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-14T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /certifications/${failed_cert_id}/retake"
              as: TrainingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 409 and data.error_id == \"ERR_RETAKE_TOO_SOON\""
            - "GET /certifications/${failed_cert_id} still reports status == \"FAILED\" and exam_score == 70"

      - name: certification_passed_rejects_further_exam_results
        claim_type: Terminal State Lockdown
        grounds: [ "state_machines.CertificationRecord", "validations[priority=50 v_invalid_state_transition]", "errors[ERR_INVALID_STATE]" ]
        distinguishing_aspect: >
          PASSED has no outgoing edge for exam-results (only the sweep expiry and
          the officer revoke leave it), so re-grading is a source-state violation;
          the cooling-off instance instead fails a precondition on a state that
          DOES declare the requested edge.
        test_recipe:
          setup:
            - "A volunteer holds one PASSED BOARD_OPERATION record."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
          trigger:
            - call: "POST /certifications/${board_cert_id}/exam-results"
              payload: { exam_score: 95 }
              as: TrainingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 409 and data.error_id == \"ERR_INVALID_STATE\""
            - "GET /certifications/${board_cert_id} still reports exam_score == 88 and attempt_count == 1"

      - name: certification_revoke_executes_the_full_side_effect_chain
        claim_type: Side Effect Execution
        grounds: [ "state_machines.CertificationRecord.PASSED_to_REVOKED", "endpoints[POST /certifications/{certificationId}/revoke]" ]
        distinguishing_aspect: >
          The revoke edge's side effects are exactly the four-link personnel
          cascade already pinned end-to-end at §1.8 depth 4, so re-testing it here
          would duplicate that instance's assertions rather than add breadth.
        excluded_because:
          difficulty_instance: certification_revocation_cascades_four_links_to_orphaned_episodes
          rationale: >
            That §1.8 transitive_cascade instance drives POST /certifications/{certificationId}/revoke
            and asserts every declared side effect of PASSED -> REVOKED: the volunteer's
            current_certification_count and needs_core_renewal, the move to SUSPENDED,
            the hosted programs falling to UNDER_REVIEW and the orphaned SCHEDULED
            episodes losing their board operator. Nothing about this edge is left unpinned.

      - name: proposal_initial_state_is_draft
        claim_type: Initial State
        grounds: [ "state_machines.ProgramProposal", entities.ProgramProposal.fields.status, "endpoints[POST /program-proposals]" ]
        distinguishing_aspect: >
          Asserts the resting state of a freshly authored proposal together with
          review_round 1 and a null composite_score, establishing that no tally
          has run; every other proposal instance starts from this baseline.
        test_recipe:
          setup:
            - "A CERTIFIED volunteer exists so the row is authorable by its own proposer."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
          trigger:
            - &k_prop
              call: "POST /program-proposals"
              payload: { proposer_volunteer_id: "${host_id}", title: "Delta Blues Hour", format_code: "MUSIC", language_code: "EN", requested_daypart: "MIDDAY", requested_duration_minutes: 60 }
              as: Volunteer
              as_user_id: "${host_id}"
              captures: { proposal_id: "$.data.id" }
          assert:
            - "the response status is 201 and data.status == \"DRAFT\""
            - "data.review_round == 1, data.composite_score is null, data.decline_majority == false, data.decided_at is null"
            - "data.proposer_volunteer_id == ${host_id} and data.version == 1"

      - name: proposal_withdrawn_rejects_a_later_submit
        claim_type: Terminal State Lockdown
        grounds: [ "state_machines.ProgramProposal.DRAFT_to_WITHDRAWN", "validations[priority=50 v_invalid_state_transition]", "errors[ERR_INVALID_STATE]" ]
        distinguishing_aspect: >
          WITHDRAWN is the only ProgramProposal sink with no outgoing edge at all,
          so a submit against it must fail on the state check even though the
          caller is the rightful owner and is CERTIFIED - both of the other submit
          preconditions are deliberately satisfied.
        test_recipe:
          setup:
            - "A CERTIFIED proposer holds one WITHDRAWN proposal."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_prop
            - call: "POST /program-proposals/${proposal_id}/withdraw"
              as: Volunteer
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /program-proposals/${proposal_id}/submit"
              as: Volunteer
              as_user_id: "${host_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the withdraw response reported status == \"WITHDRAWN\""
            - "the trigger response status is 409 and data.error_id == \"ERR_INVALID_STATE\""
            - "GET /program-proposals/${proposal_id} still reports status == \"WITHDRAWN\""

      - name: proposal_open_review_is_not_idempotent_and_rejects_the_second_call
        claim_type: Idempotency
        grounds: [ "state_machines.ProgramProposal.SUBMITTED_to_IN_COMMITTEE", "validations[priority=50 v_invalid_state_transition]", "errors[ERR_INVALID_STATE]" ]
        distinguishing_aspect: >
          The second open-review is a replay of a transition whose source state has
          already been consumed; the declared contract is rejection, not a silent
          no-op, and the proposal's version must not move on the failed replay.
        test_recipe:
          setup:
            - "A CERTIFIED proposer, three seated committee members and one proposal already IN_COMMITTEE."
          setup_api_calls: &k_chain_open_review
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_bo
            - *k_cy
            - &k_dee
              call: "POST /volunteers"
              payload: { legal_name: "Dee Okafor", email: "dee@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }
              as: TrainingCoordinator
              captures: { dee_id: "$.data.id" }
            - *k_prop
            - &k_submit
              call: "POST /program-proposals/${proposal_id}/submit"
              as: Volunteer
              as_user_id: "${host_id}"
            - &k_open
              call: "POST /program-proposals/${proposal_id}/open-review"
              as: ProgramDirector
              captures: { in_committee_v: "$.data.version" }
          trigger:
            - call: "POST /program-proposals/${proposal_id}/open-review"
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "the first open-review returned 200 with data.status == \"IN_COMMITTEE\""
            - "the replay returns 409 with data.error_id == \"ERR_INVALID_STATE\""
            - "GET /program-proposals/${proposal_id} reports version == ${in_committee_v} - the rejected replay performed no write"

      - name: drive_close_from_planned_is_an_invalid_transition
        claim_type: Invalid Transitions
        grounds: [ "state_machines.MembershipDrive", "validations[priority=50 v_invalid_state_transition]", "errors[ERR_INVALID_STATE]" ]
        distinguishing_aspect: >
          MembershipDrive declares only PLANNED -> ACTIVE -> CLOSED, so skipping
          the middle state must be refused; this covers the linear-machine case,
          whereas the proposal instances cover a cyclic machine's replay and sink.
        test_recipe:
          setup:
            - "One PLANNED drive exists; it has never been activated."
          setup_api_calls:
            - *k_clock
            - *k_drive
          trigger:
            - call: "POST /membership-drives/${drive_id}/close"
              as: DevelopmentCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 409 and data.error_id == \"ERR_INVALID_STATE\""
            - "GET /membership-drives/${drive_id} still reports status == \"PLANNED\" and version == 1"

      - name: incident_unfounded_finding_charges_nothing_but_still_stamps_the_officer
        claim_type: Side Effect Execution
        grounds: [ "state_machines.ComplianceIncident.OPEN_to_UNFOUNDED", "calculations.incident_penalty_points", "endpoints[POST /compliance-incidents/{incidentId}/adjudicate]" ]
        distinguishing_aspect: >
          Pins the negative half of the adjudication fork: penalty_points stay
          frozen on the incident row from creation, the sanction is not applied and
          no standing moves, yet adjudicated_by_user_id is still written. Contrast
          the SUBSTANTIATED path, which charges the same frozen number onward.
        test_recipe:
          setup:
            - "A volunteer is named as respondent on one OPEN VOLUNTEER_CONFLICT incident of severity MINOR."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - &k_conflict_incident
              call: "POST /compliance-incidents"
              payload: { category: "VOLUNTEER_CONFLICT", severity: "MINOR", occurred_at: "2026-07-30T14:00:00Z", complainant_note: "Two hosts booked the same production room.", respondent_volunteer_id: "${host_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { conflict_incident_id: "$.data.id" }
          trigger:
            - call: "POST /compliance-incidents/${conflict_incident_id}/adjudicate"
              payload: { finding: "UNFOUNDED" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { adjudicated_status: "$.data.status" }
          assert:
            - "the create response reported status == \"OPEN\", penalty_points == 1 (VOLUNTEER_CONFLICT MINOR, no safe-harbour doubling) and safe_harbor_violation == false"
            - "the trigger response status is 200 and data.status == \"UNFOUNDED\""
            - "data.penalty_points is still 1 - the frozen figure is never zeroed, it is simply never charged"
            - "data.adjudicated_by_user_id == \"officer-2\" and data.sanction == \"NONE\""
            - "GET /volunteers/${host_id} reports strike_count == 0 and status == \"PROSPECT\""

      - name: phone_bank_no_show_bubbles_a_strike_up_to_the_volunteer
        claim_type: Bubble up
        grounds: [ "state_machines.PhoneBankShift.SCHEDULED_to_NO_SHOW", entities.Volunteer.fields.strike_count, "calculations.volunteer_seniority_score" ]
        distinguishing_aspect: >
          A child-row close writes two fields on an unrelated parent aggregate (the
          Volunteer, not the owning MembershipDrive), and the seniority recompute
          must be visible in the same request cycle; the incident instance covers
          the case where no parent is touched at all.
        test_recipe:
          setup:
            - "An ACTIVE drive with two phone lines and one DEVELOPMENT-track volunteer whose service began 2023-01-01 (43 whole months at the clock)."
            - "One SCHEDULED shift inside the drive window."
          setup_api_calls:
            - *k_clock
            - &k_fern
              call: "POST /volunteers"
              payload: { legal_name: "Fern Duval", email: "fern@krcr.example", role_track: "DEVELOPMENT", seniority_start_date: "2023-01-01" }
              as: TrainingCoordinator
              captures: { fern_id: "$.data.id" }
            - *k_drive
            - &k_drive_active
              call: "POST /membership-drives/${drive_id}/activate"
              as: DevelopmentCoordinator
            - &k_fern_shift
              call: "POST /phone-bank-shifts"
              payload: { drive_id: "${drive_id}", volunteer_id: "${fern_id}", start_at: "2026-08-02T18:00:00Z", end_at: "2026-08-02T21:00:00Z" }
              as: DevelopmentCoordinator
              captures: { fern_shift_id: "$.data.id" }
          trigger:
            - call: "POST /phone-bank-shifts/${fern_shift_id}/close"
              payload: { outcome: "NO_SHOW" }
              as: DevelopmentCoordinator
              captures: { closed_status: "$.data.status" }
            - call: "GET /volunteers/${fern_id}"
              as: DevelopmentCoordinator
              captures: { fern_strikes: "$.data.strike_count" }
          assert:
            - "the close response status is 200 and data.status == \"NO_SHOW\""
            - "GET /volunteers/${fern_id} reports strike_count == 1"
            - "the same read reports seniority_score == 28.00 (service_term 43 + cert_term 0 - strike_term 15)"
            - "the same read reports status == \"PROSPECT\" - the demotion edge to PROBATION only leaves CERTIFIED, and only at the second strike"

      - name: sweep_marks_a_delinquent_log_and_cascades_onward
        claim_type: Cascade down
        grounds: [ "state_machines.Episode.PENDING_to_DELINQUENT", "endpoints[POST /operations/daily-sweep]" ]
        distinguishing_aspect: >
          The sweep's multi-link cascade, including the delinquency link and the
          program re-evaluation it feeds, is already pinned end-to-end at depth 4
          in §1.8; a second sweep test would re-assert the same chain.
        excluded_because:
          difficulty_instance: sweep_missing_public_file_cascades_four_links_to_cancelled_episodes
          rationale: >
            That §1.8 transitive_cascade instance calls POST /operations/daily-sweep once
            and asserts the returned delinquent_episode_ids and missing_public_file_spot_ids
            arrays plus every downstream link the sweep drives - incident creation,
            penalty charging, the standing flip and the cancelled episodes. The
            PENDING -> DELINQUENT edge is asserted inside that chain.

      - name: pledge_payment_and_premium_dimensions_advance_independently
        claim_type: Independent state dimensions change independently
        grounds: [ "state_machines.Pledge.PENDING_to_PAID (Dimension 1)", "state_machines.Pledge.RESERVED_to_SHIPPED (Dimension 2)", "endpoints[POST /pledges/{pledgeId}/payment]", "endpoints[POST /pledges/{pledgeId}/premium-fulfillment]" ]
        distinguishing_aspect: >
          Pledge carries payment_status and premium_status as two independent
          dimensions: settling the payment must leave premium_status untouched, and
          shipping must leave payment_status untouched. This is the Pledge-side
          parallel machine, distinct from the Program standing-versus-status pair
          pinned in §1.8.
        test_recipe:
          setup:
            - "A premium item MUG-01 (tier 5000, fair market value 1500, 2 units received) and an ACTIVE drive."
            - "One 6000-cent pledge created wanting a premium, so the waterfall reserves MUG-01."
          setup_api_calls:
            - *k_clock
            - &k_mug
              call: "POST /premium-items"
              payload: { sku: "MUG-01", name: "Station mug", tier_threshold_cents: 5000, fair_market_value_cents: 1500, units_received_qty: 2 }
              as: DevelopmentCoordinator
              captures: { mug_id: "$.data.id" }
            - *k_drive
            - *k_drive_active
            - &k_pledge_6000
              call: "POST /pledges"
              payload: { drive_id: "${drive_id}", donor_name: "Iris Vance", amount_cents: 6000, wants_premium: true }
              as: DevelopmentCoordinator
              captures: { pledge_id: "$.data.id" }
          trigger:
            - call: "POST /pledges/${pledge_id}/payment"
              payload: { outcome: "PAID" }
              as: DevelopmentCoordinator
              captures: { paid_premium_status: "$.data.premium_status" }
            - call: "POST /pledges/${pledge_id}/premium-fulfillment"
              payload: { action: "SHIP" }
              as: DevelopmentCoordinator
              captures: { shipped_payment_status: "$.data.payment_status" }
          assert:
            - "the pledge create response reported payment_status == \"PENDING\", premium_status == \"RESERVED\", premium_item_id == ${mug_id} and tax_deductible_cents == 4500"
            - "after the payment call data.payment_status == \"PAID\" while data.premium_status is still \"RESERVED\" - the premium dimension did not move"
            - "after the fulfilment call data.premium_status == \"SHIPPED\" while data.payment_status is still \"PAID\" - the payment dimension did not move"
            - "GET /premium-items/${mug_id} reports reserved_qty == 0, shipped_qty == 1, on_hand_qty == 1 and status == \"AVAILABLE\""

  # =========================================================================
  # SECTION 3 - CALCULATIONS  (claim types from Table 3 plus the
  # weighted_scoring / threshold algorithm-type extras and the variant rows)
  # =========================================================================
  - section: calculations
    instances:

      - name: seniority_score_weights_service_and_certifications_on_a_clean_record
        claim_type: Correct Result
        grounds: [ "calculations.volunteer_seniority_score", entities.Volunteer.fields.seniority_score ]
        distinguishing_aspect: >
          The happy-path arithmetic with every term in play except the ones that
          are provably zero (no strikes, no hosted program), landing on the exact
          published 54.00 figure; the sibling instance drives the same formula into
          its SERVICE_MONTHS_CAP branch instead.
        test_recipe:
          setup:
            - "A volunteer whose service began 2024-08-01 - exactly 24 whole months at the 2026-08-01 clock."
            - "All three core certifications graded PASSED, which is what triggers the recompute."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
          trigger:
            - call: "GET /volunteers/${host_id}"
              as: ProgramDirector
              captures: { ada_seniority: "$.data.seniority_score" }
          assert:
            - "data.continuous_service_months == 24 so service_term == 24"
            - "data.current_certification_count == 3 so cert_term == 30"
            - "data.strike_count == 0 and the volunteer hosts no scored program, so perf_term and strike_term are both 0"
            - "data.seniority_score == 54.00 exactly (24 + 30), two decimal places"
            - "data.status == \"CERTIFIED\" and data.needs_core_renewal == false"

      - name: seniority_score_service_term_stops_at_the_sixty_month_cap
        claim_type: Constants Applied
        grounds: [ "calculations.volunteer_seniority_score", "calculations.volunteer_seniority_score.constants.SERVICE_MONTHS_CAP" ]
        distinguishing_aspect: >
          A 91-month veteran with a single certification must score 70.00, not the
          101.00 an uncapped service term would give, so the cap is observable as a
          number rather than inferred; the clean-record instance never reaches it.
        test_recipe:
          setup:
            - "A volunteer whose service began 2019-01-01 - 91 whole months at the 2026-08-01 clock."
            - "Exactly one PASSED certification so the recompute fires with cert_term 10."
          setup_api_calls:
            - *k_clock
            - &k_gus
              call: "POST /volunteers"
              payload: { legal_name: "Gus Amado", email: "gus@krcr.example", role_track: "ENGINEER", seniority_start_date: "2019-01-01" }
              as: TrainingCoordinator
              captures: { gus_id: "$.data.id" }
            - call: "POST /volunteers/${gus_id}/certifications"
              payload: { cert_type: "BOARD_OPERATION", exam_score: 84 }
              as: TrainingCoordinator
          trigger:
            - call: "GET /volunteers/${gus_id}"
              as: ProgramDirector
              captures: { gus_seniority: "$.data.seniority_score" }
          assert:
            - "data.continuous_service_months == 91"
            - "data.seniority_score == 70.00 (min(60, 91) + 10 * 1), NOT 101.00"
            - "data.status == \"IN_TRAINING\" and data.needs_core_renewal == true - two core types are still missing"

      - name: underwriting_risk_score_sums_two_flag_weights_and_rejects_the_copy
        claim_type: Threshold crossed
        grounds: [ "calculations.underwriting_risk_score", "state_machines.UnderwritingSpot.UNDER_REVIEW_to_REJECTED", "endpoints[POST /underwriting-spots/{spotId}/review]" ]
        distinguishing_aspect: >
          Two distinct flags fire on one copy and their weights sum to 75, above the
          REJECT_THRESHOLD, so the review routes to REJECTED and approved_copy_text
          stays null; the sibling instance keeps a flag firing but lands below the
          EDIT_THRESHOLD, which approves.
        test_recipe:
          setup:
            - "One UNDER_REVIEW underwriting spot whose copy contains a call to action and a price, and does name its underwriter."
          setup_api_calls:
            - *k_clock
            - &k_spot_hot
              call: "POST /underwriting-spots"
              payload: { underwriter_name: "Ada's Autos", spot_class: "UNDERWRITING", copy_text: "Call now and visit Ada's Autos on Fifth Street, tires from $99.", flight_start: "2026-08-05T00:00:00Z", flight_end: "2026-09-05T00:00:00Z" }
              as: DevelopmentCoordinator
              captures: { hot_spot_id: "$.data.id" }
            - call: "POST /underwriting-spots/${hot_spot_id}/submit-for-review"
              as: DevelopmentCoordinator
          trigger:
            - call: "POST /underwriting-spots/${hot_spot_id}/review"
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { hot_score: "$.data.noncommercial_risk_score" }
          assert:
            - "the response status is 200 and data.noncommercial_risk_score == 75 (CALL_TO_ACTION 40 + PRICE_INFO 35)"
            - "data.compliance_flags == [\"CALL_TO_ACTION\", \"PRICE_INFO\"] - matched names sorted ascending, MISSING_SPONSOR_ID absent because the copy names the underwriter"
            - "data.status == \"REJECTED\" because 75 >= REJECT_THRESHOLD 60"
            - "data.approved_copy_text is null and data.public_file_status == \"NOT_REQUIRED\""
            - "data.reviewed_by_user_id == \"officer-1\""

      - name: underwriting_risk_score_below_the_edit_threshold_approves_a_flagged_copy
        claim_type: Constants Applied
        grounds: [ "calculations.underwriting_risk_score.constants.WEIGHT_MISSING_SPONSOR_ID", "state_machines.UnderwritingSpot.UNDER_REVIEW_to_APPROVED" ]
        distinguishing_aspect: >
          Proves a non-empty compliance_flags list does not by itself block
          approval: the lone 10-point sponsor-identification flag stays under
          EDIT_THRESHOLD 25, so the spot is APPROVED outright with no edited copy
          supplied - the opposite routing decision from the 75-point sibling.
        test_recipe:
          setup:
            - "One UNDER_REVIEW spot whose copy never repeats the underwriter's name and contains no commercial phrase."
          setup_api_calls:
            - *k_clock
            - &k_spot_cool
              call: "POST /underwriting-spots"
              payload: { underwriter_name: "Bluebird Bakery", spot_class: "UNDERWRITING", copy_text: "Fresh sourdough is baked daily on Fifth Street.", flight_start: "2026-08-05T00:00:00Z", flight_end: "2026-09-05T00:00:00Z" }
              as: DevelopmentCoordinator
              captures: { cool_spot_id: "$.data.id" }
            - call: "POST /underwriting-spots/${cool_spot_id}/submit-for-review"
              as: DevelopmentCoordinator
          trigger:
            - call: "POST /underwriting-spots/${cool_spot_id}/review"
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { cool_score: "$.data.noncommercial_risk_score" }
          assert:
            - "the response status is 200 and data.noncommercial_risk_score == 10 (MISSING_SPONSOR_ID only)"
            - "data.compliance_flags == [\"MISSING_SPONSOR_ID\"]"
            - "data.status == \"APPROVED\" because 10 < EDIT_THRESHOLD 25"
            - "data.approved_copy_text == data.copy_text and data.public_file_status == \"NOT_REQUIRED\" (spot_class UNDERWRITING carries no public-file obligation)"

      - name: incident_penalty_points_double_at_the_safe_harbour_start_hour
        claim_type: Constants Applied
        grounds: [ "calculations.incident_penalty_points.constants.SAFE_HARBOR_MULTIPLIER", "state_machines.Program.CLEAR_to_RESTRICTED", "endpoints[POST /compliance-incidents/{incidentId}/adjudicate]" ]
        distinguishing_aspect: >
          occurred_at sits exactly on 06:00, the INCLUSIVE start of the protected
          window, so an INDECENCY MAJOR is charged 10 rather than 5 and a single
          adjudication reaches RESTRICTED; the sibling instance sits on 22:00, the
          EXCLUSIVE end, and is charged the undoubled 5.
        test_recipe:
          setup:
            - "The canonical approved MUSIC show with a confirmed 09:00 Monday occupation and one SCHEDULED episode."
            - "One OPEN INDECENCY incident of severity MAJOR whose occurred_at hour is 06."
          setup_api_calls: &k_chain_episode
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_bo
            - *k_cy
            - *k_dee
            - *k_prop
            - *k_submit
            - *k_open
            - &k_vote_bo
              call: "POST /program-proposals/${proposal_id}/votes"
              payload: { member_volunteer_id: "${bo_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE" }
              as: CommitteeMember
              as_user_id: "${bo_id}"
              captures: { bo_vote_id: "$.data.id" }
            - &k_vote_cy
              call: "POST /program-proposals/${proposal_id}/votes"
              payload: { member_volunteer_id: "${cy_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE" }
              as: CommitteeMember
              as_user_id: "${cy_id}"
            - &k_vote_dee
              call: "POST /program-proposals/${proposal_id}/votes"
              payload: { member_volunteer_id: "${dee_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE" }
              as: CommitteeMember
              as_user_id: "${dee_id}"
            - &k_read_prop
              call: "GET /program-proposals/${proposal_id}"
              as: ProgramDirector
              captures: { proposal_v: "$.data.version" }
            - &k_decide
              call: "POST /program-proposals/${proposal_id}/decide"
              payload: { expected_proposal_version: "${proposal_v}" }
              as: ProgramDirector
              captures: { composite: "$.data.composite_score" }
            - &k_find_program
              call: "GET /programs"
              payload: { proposal_id: "${proposal_id}" }
              as: ProgramDirector
              captures: { program_id: "$.data[0].id" }
            - *k_grid
            - &k_slot
              call: "POST /schedule-grids/${grid_id}/slot-assignments"
              payload: { expected_grid_version: "${grid_v0}", program_id: "${program_id}", day_of_week: 1, start_minute: 540, duration_minutes: 60 }
              as: ProgramDirector
              captures: { slot_id: "$.data.id" }
            - &k_confirm
              call: "POST /slot-assignments/${slot_id}/confirm"
              as: ProgramDirector
            - &k_episode
              call: "POST /episodes"
              payload: { program_id: "${program_id}", slot_assignment_id: "${slot_id}", board_operator_volunteer_id: "${host_id}", scheduled_start_utc: "2026-08-03T09:00:00Z" }
              as: ProgramDirector
              captures: { episode_id: "$.data.id" }
          trigger:
            - call: "POST /compliance-incidents"
              payload: { category: "INDECENCY", severity: "MAJOR", occurred_at: "2026-07-30T06:00:00Z", complainant_note: "Unbleeped word during the 06:00 hour.", program_id: "${program_id}", episode_id: "${episode_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { hot_incident_id: "$.data.id", hot_points: "$.data.penalty_points" }
            - call: "POST /compliance-incidents/${hot_incident_id}/adjudicate"
              payload: { finding: "SUBSTANTIATED" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { hot_incident_status: "$.data.status" }
          assert:
            - "the incident create response reports safe_harbor_violation == true and penalty_points == 10 (base 5 doubled)"
            - "the adjudicate response status is 200 and data.status == \"SUBSTANTIATED\""
            - "GET /programs/${program_id} reports compliance_penalty_points == 10 and compliance_standing == \"RESTRICTED\" (10 >= RESTRICTED_THRESHOLD 6)"
            - "GET /slot-assignments/${slot_id} reports status == \"PREEMPTED\" with preempted_by_program_id null (the compliance path, not the seniority path)"
            - "GET /episodes/${episode_id} reports air_status == \"CANCELLED\""

      - name: incident_penalty_points_are_not_doubled_at_the_safe_harbour_end_hour
        claim_type: Constants Applied
        grounds: [ "calculations.incident_penalty_points.constants.SAFE_HARBOR_END_HOUR", "state_machines.Program.CLEAR_to_WATCH" ]
        distinguishing_aspect: >
          occurred_at 22:00:00 is one second past the protected window because the
          interval is half-open, so the identical INDECENCY MAJOR is charged 5 and
          the show only reaches WATCH - no slot is preempted and no episode is
          cancelled, which is exactly what separates it from the 06:00 sibling.
        test_recipe:
          setup:
            - "The same canonical show, occupation and SCHEDULED episode as the 06:00 instance."
          setup_api_calls: *k_chain_episode
          trigger:
            - call: "POST /compliance-incidents"
              payload: { category: "INDECENCY", severity: "MAJOR", occurred_at: "2026-07-30T22:00:00Z", complainant_note: "Unbleeped word at the top of the 22:00 hour.", program_id: "${program_id}", episode_id: "${episode_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { cold_incident_id: "$.data.id", cold_points: "$.data.penalty_points" }
            - call: "POST /compliance-incidents/${cold_incident_id}/adjudicate"
              payload: { finding: "SUBSTANTIATED" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { cold_incident_status: "$.data.status" }
          assert:
            - "the incident create response reports safe_harbor_violation == false and penalty_points == 5"
            - "GET /programs/${program_id} reports compliance_penalty_points == 5 and compliance_standing == \"WATCH\" (1 <= 5 <= 5)"
            - "GET /slot-assignments/${slot_id} still reports status == \"CONFIRMED\""
            - "GET /episodes/${episode_id} still reports air_status == \"SCHEDULED\""

      - name: composite_score_tallies_only_the_current_review_round
        claim_type: Input Set Filtering
        grounds: [ "calculations.proposal_composite_score", entities.CommitteeVote.fields.review_round ]
        excluded_because:
          difficulty_instance: proposal_revision_cycle_re_enters_committee_then_hits_the_round_cap
          rationale: >
            That §1.8 non_linear_state_machine instance runs two full review rounds with
            ballots on file from round 1 and asserts the round-2 composite is computed
            from the round-2 ballots alone. The input-set filter is the load-bearing
            assertion of that instance, so a separate filtering test adds no breadth.
        distinguishing_aspect: >
          Round-scoped ballot filtering is already the pinned observable of the
          §1.8 revision-cycle instance.

      - name: episode_royalty_rounds_at_the_declared_precision
        claim_type: Precision
        grounds: [ "calculations.episode_royalty_liability_cents" ]
        excluded_because:
          difficulty_instance: census_royalty_rounds_each_spin_before_summing
          rationale: >
            That §1.8 combinatorial_formula instance is built specifically around
            rounding placement: three identical 30-second spins yield 99 cents when each
            spin is rounded before summing and 98 when the sum is rounded once, and the
            instance pins 99. Precision is fully covered there.
        distinguishing_aspect: >
          Rounding placement is the entire subject of the cited §1.8 instance.

      - name: episode_royalty_variants_diverge_on_the_same_playlist
        claim_type: Variant Divergence
        grounds: [ "calculations.episode_royalty_liability_cents.variants" ]
        excluded_because:
          difficulty_instance: episode_royalty_survey_versus_census_diverge_on_identical_playlist
          rationale: >
            That §1.8 dual_variant_calc instance drives one playlist through both the
            SURVEY provisional figure and the CENSUS final figure and pins 529, 481 and
            the 48-cent delta, which is exactly the Variant Divergence claim.
        distinguishing_aspect: >
          Both variants and their delta are already pinned as literals in §1.8.

      - name: performance_score_variant_is_selected_by_the_review_window
        claim_type: Variant Selection
        grounds: [ "calculations.program_performance_score.variants", entities.Program.fields.performance_score_method ]
        excluded_because:
          difficulty_instance: program_performance_trailing_six_versus_quarter_to_date_diverge
          rationale: >
            That §1.8 dual_variant_calc instance posts both review_window values against
            one identical episode history, pins 100.00 versus 92.14 and asserts
            performance_score_method records which variant ran - the selection claim itself.
        distinguishing_aspect: >
          The selector field and both outcomes are pinned in the cited §1.8 instance.

      - name: premium_waterfall_ranks_candidates_before_checking_stock
        claim_type: Waterfall allocation order
        grounds: [ "calculations.pledge_premium_allocation" ]
        excluded_because:
          difficulty_instance: premium_waterfall_ranks_tier_threshold_before_fair_market_value
          rationale: >
            That §1.8 combinatorial_formula instance pins the full three-key ranking and
            the deductible each ranking would produce (10500 correct, 10800 under the
            wrong key order), so the evaluation-order claim is already falsifiable there.
        distinguishing_aspect: >
          Ranking order and its observable deductible consequence live in §1.8.

      - name: grid_public_affairs_share_meets_the_quota_exactly
        claim_type: Aggregation floor/ceiling honored
        grounds: [ "calculations.grid_public_affairs_share", "validations[priority=74 v_diversity_quota]" ]
        excluded_because:
          difficulty_instance: grid_public_affairs_share_of_exactly_eight_percent_publishes
          rationale: >
            That §1.8 boundary_precision_check instance pins both sides of the quota
            boundary - 60/780 = 7.69 rejected with ERR_DIVERSITY_QUOTA_UNMET and
            60/750 = 8.00 published - which is the whole threshold claim.
        distinguishing_aspect: >
          Both sides of the 8.00 percent boundary are already pinned in §1.8.

  # =========================================================================
  # SECTION 4 - VALIDATIONS  (claim types from Table 4 plus the pattern rows)
  # =========================================================================
  - section: validations
    instances:

      - name: pagination_limit_above_the_maximum_is_rejected
        claim_type: Violation → Error
        grounds: [ "validations[priority=23 v_pagination_bounds]", response_envelope.pagination_defaults, "errors[ERR_VALIDATION]" ]
        distinguishing_aspect: >
          A structural bound on a query parameter rather than on a body field, so it
          must fire on a GET where no entity is written at all.
        test_recipe:
          setup:
            - "Clock pinned; the roster may be empty."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /volunteers"
              payload: { limit: 101, offset: 0 }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 400 and data.error_id == \"ERR_VALIDATION\" (declared max is 100)"

      - name: drive_window_ending_before_it_starts_is_rejected
        claim_type: Temporal validation
        grounds: [ "validations[priority=24 v_interval_order]", "errors[ERR_INVALID_INTERVAL]" ]
        distinguishing_aspect: >
          The interval-order rule carries its own 422 code rather than the generic
          ERR_VALIDATION, which distinguishes a semantically invalid window from a
          structurally malformed field.
        test_recipe:
          setup:
            - "Clock pinned; no drives exist."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /membership-drives"
              payload: { name: "Backwards Drive", goal_cents: 500000, start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-01T00:00:00Z", phone_line_count: 2 }
              as: DevelopmentCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 422 and data.error_id == \"ERR_INVALID_INTERVAL\""
            - "no MembershipDrive row is created"

      - name: duplicate_premium_sku_is_rejected
        claim_type: Violation → Error
        grounds: [ "validations[priority=26 v_unique_natural_key]", entities.PremiumItem.fields.sku, "errors[ERR_DUPLICATE_KEY]" ]
        distinguishing_aspect: >
          Uniqueness is a whole-table predicate, not a per-row shape check, so it
          can only fail on the second write; the interval instance fails on the
          first write from its own payload alone.
        test_recipe:
          setup:
            - "One premium item with sku MUG-01 already exists."
          setup_api_calls:
            - *k_clock
            - *k_mug
          trigger:
            - call: "POST /premium-items"
              payload: { sku: "MUG-01", name: "Second mug", tier_threshold_cents: 9000, fair_market_value_cents: 2500, units_received_qty: 5 }
              as: DevelopmentCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 409 and data.error_id == \"ERR_DUPLICATE_KEY\""
            - "GET /premium-items reports total_count == 1 and the surviving row still has name \"Station mug\""

      - name: shift_inside_the_drive_window_is_accepted
        claim_type: Satisfaction → Pass
        grounds: [ "validations[priority=65 v_shift_inside_drive_window]", "endpoints[POST /phone-bank-shifts]" ]
        distinguishing_aspect: >
          The positive half of the window rule: a shift wholly inside an ACTIVE
          drive's window is created with the declared initial state, proving the
          rule is not simply rejecting everything.
        test_recipe:
          setup:
            - "An ACTIVE drive running 2026-08-01 to 2026-08-10 and one eligible volunteer."
          setup_api_calls:
            - *k_clock
            - *k_fern
            - *k_drive
            - *k_drive_active
          trigger:
            - call: "POST /phone-bank-shifts"
              payload: { drive_id: "${drive_id}", volunteer_id: "${fern_id}", start_at: "2026-08-02T18:00:00Z", end_at: "2026-08-02T21:00:00Z" }
              as: DevelopmentCoordinator
              captures: { ok_shift_id: "$.data.id" }
          assert:
            - "the response status is 201 and data.status == \"SCHEDULED\""
            - "data.pledges_taken_count == 0 and data.drive_id == ${drive_id}"

      - name: shift_starting_before_the_drive_window_is_rejected
        claim_type: Temporal validation
        grounds: [ "validations[priority=65 v_shift_inside_drive_window]", "errors[ERR_SHIFT_OUTSIDE_DRIVE_WINDOW]" ]
        distinguishing_aspect: >
          Same rule and same endpoint as the Satisfaction instance with only the
          start instant moved outside the drive window, so the pair isolates the
          window predicate from every other precondition on the call.
        test_recipe:
          setup:
            - "The same ACTIVE drive and volunteer as the passing instance."
          setup_api_calls:
            - *k_clock
            - *k_fern
            - *k_drive
            - *k_drive_active
          trigger:
            - call: "POST /phone-bank-shifts"
              payload: { drive_id: "${drive_id}", volunteer_id: "${fern_id}", start_at: "2026-07-31T18:00:00Z", end_at: "2026-07-31T21:00:00Z" }
              as: DevelopmentCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 422 and data.error_id == \"ERR_SHIFT_OUTSIDE_DRIVE_WINDOW\""
            - "GET /phone-bank-shifts reports total_count == 0"

      - name: phone_line_capacity_counts_concurrent_shifts_across_volunteers
        claim_type: Aggregate validation
        grounds: [ "validations[priority=70 v_phone_line_capacity]", entities.MembershipDrive.fields.phone_line_count, "errors[ERR_PHONE_LINE_CAPACITY]" ]
        distinguishing_aspect: >
          The predicate aggregates OTHER volunteers' shifts on the same drive - two
          lines are already occupied by two different people, so a third person is
          refused even though that person has no shift of their own. The §1.8
          phone-bank instance instead isolates the per-volunteer versus per-line
          boundary semantics of a single overlap.
        test_recipe:
          setup:
            - "An ACTIVE drive with phone_line_count 2 and three eligible volunteers."
            - "Two shifts already cover 18:00-21:00 on 2026-08-02, one per volunteer."
          setup_api_calls:
            - *k_clock
            - *k_fern
            - *k_gus
            - &k_hana
              call: "POST /volunteers"
              payload: { legal_name: "Hana Oyelaran", email: "hana@krcr.example", role_track: "DEVELOPMENT", seniority_start_date: "2025-01-01" }
              as: TrainingCoordinator
              captures: { hana_id: "$.data.id" }
            - *k_drive
            - *k_drive_active
            - *k_fern_shift
            - call: "POST /phone-bank-shifts"
              payload: { drive_id: "${drive_id}", volunteer_id: "${gus_id}", start_at: "2026-08-02T18:00:00Z", end_at: "2026-08-02T21:00:00Z" }
              as: DevelopmentCoordinator
              captures: { gus_shift_id: "$.data.id" }
          trigger:
            - call: "POST /phone-bank-shifts"
              payload: { drive_id: "${drive_id}", volunteer_id: "${hana_id}", start_at: "2026-08-02T19:00:00Z", end_at: "2026-08-02T20:00:00Z" }
              as: DevelopmentCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 409 and data.error_id == \"ERR_PHONE_LINE_CAPACITY\""
            - "GET /phone-bank-shifts reports total_count == 2 - the third shift was not created"
            - "a shift for Hana at 21:00-22:00 on the same day would be accepted, because the half-open windows only touch at 21:00 and touching does not consume a line"

      - name: quorum_is_enforced_before_any_composite_is_written
        claim_type: Cascading validation
        grounds: [ "validations[priority=71 v_quorum_met]", "calculations.proposal_composite_score", "errors[ERR_QUORUM_NOT_MET]" ]
        distinguishing_aspect: >
          Two ballots against three eligible seats fail max(3, ceil(3 * 0.60)) = 3,
          and the proposal must be left with composite_score still null - proving the
          quorum gate runs before the tally rather than alongside it.
        test_recipe:
          setup:
            - "A proposal IN_COMMITTEE with three seated members but only two ballots cast."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_bo
            - *k_cy
            - *k_dee
            - *k_prop
            - *k_submit
            - *k_open
            - *k_vote_bo
            - *k_vote_cy
            - *k_read_prop
          trigger:
            - call: "POST /program-proposals/${proposal_id}/decide"
              payload: { expected_proposal_version: "${proposal_v}" }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 422 and data.error_id == \"ERR_QUORUM_NOT_MET\""
            - "GET /program-proposals/${proposal_id} still reports status == \"IN_COMMITTEE\", composite_score null and decided_at null"
            - "GET /programs reports total_count == 0 - no Program was created"

      - name: public_file_posting_on_a_psa_is_rejected_as_not_required
        claim_type: Conditional validation
        grounds: [ "validations[priority=54 v_public_file_obligation_exists]", entities.UnderwritingSpot.fields.public_file_status, "errors[ERR_PUBLIC_FILE_NOT_REQUIRED]" ]
        distinguishing_aspect: >
          The obligation only attaches to POLITICAL_CANDIDATE and ISSUE_ADVOCACY
          classes, so an approved PSA has nothing to post against; the rule is
          conditional on the spot's class, not on its approval state.
        test_recipe:
          setup:
            - "One PSA spot approved with a clean copy that names its sponsor, so public_file_status stays NOT_REQUIRED."
          setup_api_calls:
            - *k_clock
            - &k_spot_psa
              call: "POST /underwriting-spots"
              payload: { underwriter_name: "County Health", spot_class: "PSA", copy_text: "County Health reminds listeners that flu shots are available.", flight_start: "2026-08-05T00:00:00Z", flight_end: "2026-09-05T00:00:00Z" }
              as: DevelopmentCoordinator
              captures: { psa_spot_id: "$.data.id" }
            - call: "POST /underwriting-spots/${psa_spot_id}/submit-for-review"
              as: DevelopmentCoordinator
            - call: "POST /underwriting-spots/${psa_spot_id}/review"
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { psa_status: "$.data.public_file_status" }
          trigger:
            - call: "POST /underwriting-spots/${psa_spot_id}/public-file-posting"
              payload: { public_file_reference: "PF-2026-0001" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the review response reported status == \"APPROVED\", noncommercial_risk_score == 0 and public_file_status == \"NOT_REQUIRED\""
            - "the trigger response status is 409 and data.error_id == \"ERR_PUBLIC_FILE_NOT_REQUIRED\""
            - "GET /underwriting-spots/${psa_spot_id} reports public_file_posted_at null and public_file_reference null"

      - name: music_show_cannot_submit_an_empty_playlist_log
        claim_type: Conditional validation
        grounds: [ "validations[priority=76 v_playlist_required_for_music]", entities.Program.fields.format_code, "errors[ERR_PLAYLIST_EMPTY]" ]
        distinguishing_aspect: >
          The rule is conditional on the parent Program's format_code, so it must be
          resolved two hops away from the episode being written; log_status is
          deliberately already PENDING so the priority-53 state rule cannot fire
          first and mask it.
        test_recipe:
          setup:
            - "The canonical MUSIC show with a confirmed occupation and one episode already AIRED, so log_status is PENDING."
            - "No PlaylistEntry rows exist on the episode."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_bo
            - *k_cy
            - *k_dee
            - *k_prop
            - *k_submit
            - *k_open
            - *k_vote_bo
            - *k_vote_cy
            - *k_vote_dee
            - *k_read_prop
            - *k_decide
            - *k_find_program
            - *k_grid
            - *k_slot
            - *k_confirm
            - *k_episode
            - &k_aired
              call: "POST /episodes/${episode_id}/air-result"
              payload: { air_status: "AIRED" }
              as: ProgramDirector
              captures: { aired_log_status: "$.data.log_status" }
          trigger:
            - call: "POST /episodes/${episode_id}/submit-log"
              as: Volunteer
              as_user_id: "${host_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the air-result response reported air_status == \"AIRED\", log_status == \"PENDING\" and log_due_at == \"2026-08-06T09:00:00Z\" (scheduled start + 72 hours)"
            - "the trigger response status is 422 and data.error_id == \"ERR_PLAYLIST_EMPTY\""
            - "GET /episodes/${episode_id} still reports log_status == \"PENDING\" and provisional_royalty_cents null"

      - name: published_grid_state_outranks_the_window_conflict
        claim_type: Priority conflict
        grounds: [ "validations[priority=50 v_grid_mutable]", "validations[priority=66 v_slot_window_conflict]" ]
        excluded_because:
          difficulty_instance: published_grid_outranks_the_slot_window_conflict
          rationale: >
            That §1.8 priority_pair_validation_conflict instance constructs a single call
            that violates both rules at once and pins ERR_GRID_NOT_MUTABLE, which is the
            entire Priority Ordering claim for this pair.
        distinguishing_aspect: >
          The doubly-violating call and its winning error code are pinned in §1.8.

      - name: segregation_of_duties_outranks_the_state_check
        claim_type: Priority Ordering
        grounds: [ "validations[priority=45 v_segregation_of_duties]", "validations[priority=50 v_invalid_state_transition]" ]
        excluded_because:
          difficulty_instance: segregation_of_duties_outranks_the_incident_state_check
          rationale: >
            That §1.8 instance has the same officer both clear a spot and adjudicate an
            already-adjudicated incident, so both the 403 duties rule and the 409 state
            rule are violated, and it pins ERR_SEGREGATION_OF_DUTIES as the winner.
        distinguishing_aspect: >
          The 403-before-409 ordering is pinned in §1.8.

      - name: board_operator_certification_is_checked_across_entities
        claim_type: Cross-entity validation
        grounds: [ "validations[priority=62 v_board_operator_certified]", "errors[ERR_OPERATOR_NOT_CERTIFIED]" ]
        excluded_because:
          difficulty_instance: episode_creation_depends_on_the_program_compliance_state
          rationale: >
            That §1.8 cross_entity_state_dependency instance already drives POST /episodes
            with the decisive precondition living on another aggregate and pins the
            resulting refusal, so the cross-entity read on this same endpoint is covered.
        distinguishing_aspect: >
          POST /episodes cross-aggregate preconditions are pinned in §1.8.

  # =========================================================================
  # SECTION 5 - ENDPOINTS  (claim types from Table 5)
  # =========================================================================
  - section: endpoints
    instances:

      - name: underwriting_spot_patch_updates_a_draft_copy
        claim_type: Standard CRUD
        grounds: [ "endpoints[PATCH /underwriting-spots/{spotId}]", "validations[priority=58 v_proposal_mutable]" ]
        distinguishing_aspect: >
          The only PATCH in the fundraising family: it must accept a partial body,
          leave unmentioned fields alone and bump the version, and it is legal only
          while the spot is still DRAFT.
        test_recipe:
          setup:
            - "One DRAFT underwriting spot exists."
          setup_api_calls:
            - *k_clock
            - *k_spot_cool
          trigger:
            - call: "PATCH /underwriting-spots/${cool_spot_id}"
              payload: { copy_text: "Bluebird Bakery bakes fresh sourdough daily on Fifth Street." }
              as: DevelopmentCoordinator
              captures: { patched_copy: "$.data.copy_text" }
          assert:
            - "the response status is 200 and data.copy_text is the new text"
            - "data.underwriter_name is still \"Bluebird Bakery\" and data.flight_start is unchanged - a partial update touches nothing else"
            - "data.status is still \"DRAFT\" and data.version == 2"
            - "data.noncommercial_risk_score == 0 and data.compliance_flags is null - screening happens only at review time"

      - name: membership_drive_activate_is_a_state_changing_action_endpoint
        claim_type: Action endpoint
        grounds: [ "endpoints[POST /membership-drives/{driveId}/activate]", "state_machines.MembershipDrive.PLANNED_to_ACTIVE" ]
        distinguishing_aspect: >
          A bodyless POST whose whole contract is one state transition plus the
          unlocking of two child-creation endpoints; the PATCH instance covers the
          field-mutation style of write instead.
        test_recipe:
          setup:
            - "One PLANNED drive exists."
          setup_api_calls:
            - *k_clock
            - *k_drive
          trigger:
            - call: "POST /membership-drives/${drive_id}/activate"
              as: DevelopmentCoordinator
              captures: { activated_status: "$.data.status" }
          assert:
            - "the response status is 200 and data.status == \"ACTIVE\""
            - "data.version == 2 while every money roll-up is still 0"
            - "POST /pledges and POST /phone-bank-shifts against this drive now pass the priority-52 drive-active rule"

      - name: daily_sweep_is_a_bulk_action_over_every_due_obligation
        claim_type: Bulk action
        grounds: [ "endpoints[POST /operations/daily-sweep]" ]
        excluded_because:
          difficulty_instance: sweep_missing_public_file_cascades_four_links_to_cancelled_episodes
          rationale: >
            That §1.8 instance is built on the sweep endpoint and pins the contents of its
            returned id arrays plus every row the batch mutated, which is exactly the
            bulk-action claim; a second sweep test would restate it.
        distinguishing_aspect: >
          The sweep's batch contract and its returned id arrays are pinned in §1.8.

      - name: slot_assignment_create_links_a_grid_to_a_program
        claim_type: Cross-reference link
        grounds: [ "endpoints[POST /schedule-grids/{gridId}/slot-assignments]", entities.SlotAssignment.fields.grid_id, entities.SlotAssignment.fields.program_id ]
        distinguishing_aspect: >
          One write joins two otherwise independent aggregates: the grid comes from
          the path, the program from the body, and the response must carry both FKs
          plus the grid-side derived recompute in the same request cycle.
        test_recipe:
          setup:
            - "The canonical APPROVED MUSIC show and one DRAFT grid."
          setup_api_calls: &k_chain_grid
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_bo
            - *k_cy
            - *k_dee
            - *k_prop
            - *k_submit
            - *k_open
            - *k_vote_bo
            - *k_vote_cy
            - *k_vote_dee
            - *k_read_prop
            - *k_decide
            - *k_find_program
            - *k_grid
          trigger:
            - *k_slot
          assert:
            - "the decide response reported composite_score == 4.00 and status == \"APPROVED\""
            - "the trigger response status is 201, data.grid_id == ${grid_id} and data.program_id == ${program_id}"
            - "data.status == \"TENTATIVE\", data.day_of_week == 1, data.start_minute == 540, data.duration_minutes == 60, data.preempted_by_program_id null"
            - "GET /schedule-grids/${grid_id} now reports status == \"IN_REVIEW\" (first assignment moved the grid off DRAFT) and total_assigned_minutes == 60"
            - "GET /programs/${program_id} still reports programming_status == \"APPROVED_UNSCHEDULED\" - only a confirmation moves the show"

      - name: grid_read_exposes_the_derived_minute_and_share_fields
        claim_type: Computed read
        grounds: [ "endpoints[GET /schedule-grids/{gridId}]", "calculations.grid_public_affairs_share", entities.ScheduleGrid.fields.total_assigned_minutes ]
        distinguishing_aspect: >
          A pure read that must serve server-derived aggregates rather than stored
          input: with a single 60-minute MUSIC occupation the share is 0.00 percent,
          which is also why this grid could not be published.
        test_recipe:
          setup:
            - "One grid holding a single CONFIRMED 60-minute MUSIC occupation."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_bo
            - *k_cy
            - *k_dee
            - *k_prop
            - *k_submit
            - *k_open
            - *k_vote_bo
            - *k_vote_cy
            - *k_vote_dee
            - *k_read_prop
            - *k_decide
            - *k_find_program
            - *k_grid
            - *k_slot
            - *k_confirm
          trigger:
            - call: "GET /schedule-grids/${grid_id}"
              as: CommitteeMember
              as_user_id: "${bo_id}"
              captures: { read_minutes: "$.data.total_assigned_minutes" }
          assert:
            - "the response status is 200, data.total_assigned_minutes == 60 and data.public_affairs_minutes_pct == 0.00"
            - "data.status == \"IN_REVIEW\" and data.published_at is null"
            - "GET /programs/${program_id} reports programming_status == \"SCHEDULED\" after the confirmation"

      - name: reinstate_is_a_conditional_action_and_refuses_a_confirmed_slot
        claim_type: Conditional action
        grounds: [ "endpoints[POST /slot-assignments/{assignmentId}/reinstate]", "state_machines.SlotAssignment.PREEMPTED_to_CONFIRMED", "errors[ERR_INVALID_STATE]" ]
        distinguishing_aspect: >
          reinstate is defined only from PREEMPTED, so calling it on a healthy
          CONFIRMED occupation must be refused; the action endpoint instance covers
          the case where the precondition IS satisfied.
        test_recipe:
          setup:
            - "One CONFIRMED occupation that was never preempted."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_bo
            - *k_cy
            - *k_dee
            - *k_prop
            - *k_submit
            - *k_open
            - *k_vote_bo
            - *k_vote_cy
            - *k_vote_dee
            - *k_read_prop
            - *k_decide
            - *k_find_program
            - *k_grid
            - *k_slot
            - *k_confirm
          trigger:
            - call: "POST /slot-assignments/${slot_id}/reinstate"
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 409 and data.error_id == \"ERR_INVALID_STATE\""
            - "GET /slot-assignments/${slot_id} still reports status == \"CONFIRMED\" and preempted_by_program_id null"
            - "GET /schedule-grids/${grid_id} reports total_assigned_minutes == 60 - the failed action recomputed nothing"

  # =========================================================================
  # SECTION 6 - ERRORS  ("verify every error code is triggerable"; the
  # instances below cover the codes no other section reaches)
  # =========================================================================
  - section: errors
    instances:

      - name: err_unauthorized_when_a_director_tries_to_enrol_a_volunteer
        claim_type: Violation → Error
        grounds: [ "errors[ERR_UNAUTHORIZED]", "validations[priority=10 v_role_authorized]", roles.TrainingCoordinator ]
        distinguishing_aspect: >
          Enrolment is exclusive to the TrainingCoordinator, so the highest-priority
          rule in the ladder must reject the ProgramDirector before any field of the
          body is inspected - the payload here is otherwise perfectly valid.
        test_recipe:
          setup:
            - "Clock pinned; roster empty."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /volunteers"
              payload: { legal_name: "Ada Reyes", email: "ada@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2024-08-01" }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 403 and data.error_id == \"ERR_UNAUTHORIZED\""
            - "GET /volunteers reports total_count == 0"

      - name: err_validation_when_a_ballot_score_leaves_the_one_to_five_domain
        claim_type: Violation → Error
        grounds: [ "errors[ERR_VALIDATION]", "validations[priority=22 v_numeric_domain]", entities.CommitteeVote.fields.format_fit_score ]
        distinguishing_aspect: >
          A numeric-domain breach on a scoring field, which must be caught before the
          composite arithmetic ever sees the value; the enum instance in the entities
          section covers the string-domain half of the same structural family.
        test_recipe:
          setup:
            - "A proposal is IN_COMMITTEE with three seated members."
          setup_api_calls: *k_chain_open_review
          trigger:
            - call: "POST /program-proposals/${proposal_id}/votes"
              payload: { member_volunteer_id: "${bo_id}", format_fit_score: 6, diversity_score: 4, quality_score: 4, recommendation: "APPROVE" }
              as: CommitteeMember
              as_user_id: "${bo_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 400 and data.error_id == \"ERR_VALIDATION\""
            - "GET /committee-votes reports total_count == 0"

      - name: err_duplicate_vote_on_a_second_ballot_in_the_same_round
        claim_type: Violation → Error
        grounds: [ "errors[ERR_DUPLICATE_VOTE]", "validations[priority=27 v_one_vote_per_round]" ]
        distinguishing_aspect: >
          Uniqueness is scoped to the (proposal, member, review_round) triple, so the
          second ballot from the same member in round 1 is refused while the same
          member will be free to vote again in round 2.
        test_recipe:
          setup:
            - "A proposal IN_COMMITTEE with one ballot already cast by Bo."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_bo
            - *k_cy
            - *k_dee
            - *k_prop
            - *k_submit
            - *k_open
            - *k_vote_bo
          trigger:
            - call: "POST /program-proposals/${proposal_id}/votes"
              payload: { member_volunteer_id: "${bo_id}", format_fit_score: 2, diversity_score: 2, quality_score: 2, recommendation: "DECLINE" }
              as: CommitteeMember
              as_user_id: "${bo_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 409 and data.error_id == \"ERR_DUPLICATE_VOTE\""
            - "GET /committee-votes reports total_count == 1 and the surviving ballot still has recommendation \"APPROVE\""

      - name: err_self_vote_forbidden_when_the_author_also_holds_a_seat
        claim_type: Violation → Error
        grounds: [ "errors[ERR_SELF_VOTE_FORBIDDEN]", "validations[priority=47 v_no_self_vote]", complexity_profile.role_model ]
        distinguishing_aspect: >
          The author is given a committee seat first, so the seat check passes and
          only the segregation rule can reject the ballot - which isolates
          ERR_SELF_VOTE_FORBIDDEN from ERR_NOT_COMMITTEE_MEMBER.
        test_recipe:
          setup:
            - "A proposal IN_COMMITTEE whose author is then seated on the committee."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_bo
            - *k_cy
            - *k_dee
            - *k_prop
            - *k_submit
            - *k_open
            - call: "PATCH /volunteers/${host_id}"
              payload: { committee_seat: true }
              as: TrainingCoordinator
          trigger:
            - call: "POST /program-proposals/${proposal_id}/votes"
              payload: { member_volunteer_id: "${host_id}", format_fit_score: 5, diversity_score: 5, quality_score: 5, recommendation: "APPROVE" }
              as: CommitteeMember
              as_user_id: "${host_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 403 and data.error_id == \"ERR_SELF_VOTE_FORBIDDEN\""
            - "GET /committee-votes reports total_count == 0"

      - name: err_incident_target_required_when_the_category_names_no_target
        claim_type: Violation → Error
        grounds: [ "errors[ERR_INCIDENT_TARGET_REQUIRED]", "validations[priority=38 v_incident_target_present]", complexity_profile.relationship_patterns ]
        distinguishing_aspect: >
          The polymorphic target requirement is category-dependent: VOLUNTEER_CONFLICT
          demands a respondent, and omitting it must fail even though every other
          declared field is present and valid.
        test_recipe:
          setup:
            - "Clock pinned; no incidents exist."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /compliance-incidents"
              payload: { category: "VOLUNTEER_CONFLICT", severity: "MINOR", occurred_at: "2026-07-30T14:00:00Z", complainant_note: "Dispute reported with no respondent named." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 422 and data.error_id == \"ERR_INCIDENT_TARGET_REQUIRED\""
            - "GET /compliance-incidents reports total_count == 0"

      - name: err_premium_not_reserved_when_shipping_a_waived_pledge
        claim_type: Violation → Error
        grounds: [ "errors[ERR_PREMIUM_NOT_RESERVED]", "validations[priority=56 v_premium_reserved]", "state_machines.Pledge.NOT_ELIGIBLE_to_WAIVED" ]
        distinguishing_aspect: >
          wants_premium false short-circuits the waterfall to WAIVED, so the
          fulfilment endpoint has no reserved unit to ship; the payment status is
          deliberately PAID so the priority-57 rule cannot fire first.
        test_recipe:
          setup:
            - "A premium item is in stock and an ACTIVE drive exists."
            - "One paid 6000-cent pledge created with wants_premium false."
          setup_api_calls:
            - *k_clock
            - *k_mug
            - *k_drive
            - *k_drive_active
            - call: "POST /pledges"
              payload: { drive_id: "${drive_id}", donor_name: "Jo Farrow", amount_cents: 6000, wants_premium: false }
              as: DevelopmentCoordinator
              captures: { waived_pledge_id: "$.data.id" }
            - call: "POST /pledges/${waived_pledge_id}/payment"
              payload: { outcome: "PAID" }
              as: DevelopmentCoordinator
          trigger:
            - call: "POST /pledges/${waived_pledge_id}/premium-fulfillment"
              payload: { action: "SHIP" }
              as: DevelopmentCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the pledge create response reported premium_status == \"WAIVED\", premium_item_id null and tax_deductible_cents == 6000"
            - "the trigger response status is 409 and data.error_id == \"ERR_PREMIUM_NOT_RESERVED\""
            - "GET /premium-items/${mug_id} still reports reserved_qty == 0, shipped_qty == 0 and on_hand_qty == 2"

      - name: err_max_attempts_reached_after_three_graded_failures
        claim_type: Violation → Error
        grounds: [ "errors[ERR_MAX_ATTEMPTS_REACHED]", "validations[priority=69 v_attempt_cap]", complexity_profile.complexity_layers ]
        distinguishing_aspect: >
          The cap is an instantaneous counter threshold, reached only by walking the
          FAILED to PENDING_EXAM cycle twice with the cooling-off window satisfied
          each time; the cooling-off instance stops the same endpoint for the other,
          temporal reason.
        test_recipe:
          setup:
            - "One certification failed three times, each retake taken exactly 14 days after the previous attempt."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_failed
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /certifications/${failed_cert_id}/retake"
              as: TrainingCoordinator
            - call: "POST /certifications/${failed_cert_id}/exam-results"
              payload: { exam_score: 72 }
              as: TrainingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-29T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /certifications/${failed_cert_id}/retake"
              as: TrainingCoordinator
            - call: "POST /certifications/${failed_cert_id}/exam-results"
              payload: { exam_score: 75 }
              as: TrainingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /certifications/${failed_cert_id}/retake"
              as: TrainingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the third grading response reported status == \"FAILED\" and attempt_count == 3"
            - "the trigger response status is 409 and data.error_id == \"ERR_MAX_ATTEMPTS_REACHED\""
            - "the cooling-off window is satisfied at the 2026-09-12 clock, so ERR_RETAKE_TOO_SOON is provably not the code returned"
            - "GET /certifications/${failed_cert_id} still reports status == \"FAILED\" and attempt_count == 3"

      - name: err_program_restricted_blocks_the_next_episode
        claim_type: Violation → Error
        grounds: [ "errors[ERR_PROGRAM_RESTRICTED]", "validations[priority=46 v_program_not_restricted]" ]
        excluded_because:
          difficulty_instance: episode_creation_depends_on_the_program_compliance_state
          rationale: >
            That §1.8 cross_entity_state_dependency instance drives a program into
            RESTRICTED and then pins the refusal of POST /episodes with this exact code,
            so the code is already proven triggerable.
        distinguishing_aspect: >
          The code's only trigger path is pinned in §1.8.

  # =========================================================================
  # SECTION 7 - RBAC  (per-role exclusive/shared operations, cross-role
  # refusals, plus the segregation_of_duties role-model extra)
  # =========================================================================
  - section: rbac
    instances:

      - name: training_coordinator_can_enrol_but_cannot_open_a_committee_review
        claim_type: Role can perform its exclusive operations
        grounds: [ roles.TrainingCoordinator, "endpoints[POST /volunteers]", "endpoints[POST /program-proposals/{proposalId}/open-review]", "errors[ERR_UNAUTHORIZED]" ]
        distinguishing_aspect: >
          Pairs one allowed exclusive write with one refusal drawn from the
          ProgramDirector's exclusive list, so the same caller identity produces both
          polarities inside a single recipe.
        test_recipe:
          setup:
            - "A CERTIFIED proposer holds one SUBMITTED proposal and three seated members exist, so the review is otherwise openable."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_bo
            - *k_cy
            - *k_dee
            - *k_prop
            - *k_submit
          trigger:
            - call: "POST /volunteers"
              payload: { legal_name: "Ivo Bergman", email: "ivo@krcr.example", role_track: "ENGINEER", seniority_start_date: "2025-06-01" }
              as: TrainingCoordinator
              captures: { ivo_id: "$.data.id" }
            - call: "POST /program-proposals/${proposal_id}/open-review"
              as: TrainingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the enrolment returns 201 with data.status == \"PROSPECT\""
            - "the open-review attempt returns 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "GET /program-proposals/${proposal_id} still reports status == \"SUBMITTED\""

      - name: program_director_can_open_a_review_but_cannot_cast_a_ballot
        claim_type: Role cannot perform another role's exclusive operations
        grounds: [ roles.ProgramDirector, roles.CommitteeMember, "endpoints[POST /program-proposals/{proposalId}/votes]", "errors[ERR_UNAUTHORIZED]" ]
        distinguishing_aspect: >
          The director chairs the committee yet is excluded from its ballot box; the
          refusal must be the role rule rather than the seat rule, so the payload
          names a genuinely seated member.
        test_recipe:
          setup:
            - "A CERTIFIED proposer, one SUBMITTED proposal and three seated members."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_bo
            - *k_cy
            - *k_dee
            - *k_prop
            - *k_submit
          trigger:
            - call: "POST /program-proposals/${proposal_id}/open-review"
              as: ProgramDirector
              captures: { opened_status: "$.data.status" }
            - call: "POST /program-proposals/${proposal_id}/votes"
              payload: { member_volunteer_id: "${bo_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE" }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "the open-review returns 200 with data.status == \"IN_COMMITTEE\""
            - "the ballot attempt returns 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "GET /committee-votes reports total_count == 0"

      - name: committee_member_can_vote_but_cannot_tally_the_decision
        claim_type: Role cannot perform another role's exclusive operations
        grounds: [ roles.CommitteeMember, "endpoints[POST /program-proposals/{proposalId}/decide]", "errors[ERR_UNAUTHORIZED]" ]
        distinguishing_aspect: >
          The seated member's own exclusive write succeeds while the chair-only tally
          is refused, and the OCC token is supplied correctly so the 403 cannot be
          confused with the 412 concurrency refusal.
        test_recipe:
          setup:
            - "A proposal IN_COMMITTEE with two ballots already on file and its current version read."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_bo
            - *k_cy
            - *k_dee
            - *k_prop
            - *k_submit
            - *k_open
            - *k_vote_bo
            - *k_vote_cy
            - *k_read_prop
          trigger:
            - *k_vote_dee
            - call: "POST /program-proposals/${proposal_id}/decide"
              payload: { expected_proposal_version: "${proposal_v}" }
              as: CommitteeMember
              as_user_id: "${dee_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the third ballot returns 201 with data.review_round == 1"
            - "the decide attempt returns 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "GET /program-proposals/${proposal_id} still reports status == \"IN_COMMITTEE\" and composite_score null"

      - name: volunteer_cannot_patch_another_authors_proposal
        claim_type: Same user cannot do step A and step B (if X-User-ID tracked)
        grounds: [ "validations[priority=12 v_proposal_owner_only]", roles.Volunteer, "errors[ERR_NOT_PROPOSAL_OWNER]" ]
        distinguishing_aspect: >
          The caller holds the right ROLE and the proposal is in a mutable state, so
          the only thing that can refuse the write is the row-level ownership check -
          which is why the code is ERR_NOT_PROPOSAL_OWNER, not ERR_UNAUTHORIZED.
        test_recipe:
          setup:
            - "Ada authors a DRAFT proposal; Bo is a different volunteer."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_bo
            - *k_prop
          trigger:
            - call: "PATCH /program-proposals/${proposal_id}"
              payload: { title: "Bo's Blues Hour" }
              as: Volunteer
              as_user_id: "${bo_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 403 and data.error_id == \"ERR_NOT_PROPOSAL_OWNER\""
            - "GET /program-proposals/${proposal_id} still reports title \"Delta Blues Hour\" and version == 1"

      - name: unseated_volunteer_cannot_cast_a_ballot
        claim_type: Role cannot perform another role's exclusive operations
        grounds: [ "validations[priority=14 v_committee_seat_required]", roles.CommitteeMember, "errors[ERR_NOT_COMMITTEE_MEMBER]" ]
        distinguishing_aspect: >
          The CommitteeMember role is entity_backed, so authorisation has two layers:
          the endpoint's role list and the backing row's committee_seat flag. Here the
          role layer passes and only the flag fails.
        test_recipe:
          setup:
            - "A proposal IN_COMMITTEE plus one volunteer who holds no committee seat."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_bo
            - *k_cy
            - *k_dee
            - *k_prop
            - *k_submit
            - *k_open
            - *k_fern
          trigger:
            - call: "POST /program-proposals/${proposal_id}/votes"
              payload: { member_volunteer_id: "${fern_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE" }
              as: CommitteeMember
              as_user_id: "${fern_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 403 and data.error_id == \"ERR_NOT_COMMITTEE_MEMBER\""
            - "GET /committee-votes reports total_count == 0"

      - name: compliance_officer_can_adjudicate_but_cannot_stock_a_premium
        claim_type: Role cannot perform another role's exclusive operations
        grounds: [ roles.ComplianceOfficer, roles.DevelopmentCoordinator, "endpoints[POST /premium-items]", "errors[ERR_UNAUTHORIZED]" ]
        distinguishing_aspect: >
          Separates the regulator-facing role from the fundraising role: the officer's
          own adjudication succeeds in the same recipe in which their attempt to touch
          inventory is refused.
        test_recipe:
          setup:
            - "One OPEN VOLUNTEER_CONFLICT incident naming a respondent."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_conflict_incident
          trigger:
            - call: "POST /compliance-incidents/${conflict_incident_id}/adjudicate"
              payload: { finding: "UNFOUNDED" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { adj_status: "$.data.status" }
            - call: "POST /premium-items"
              payload: { sku: "TOTE-03", name: "Canvas tote", tier_threshold_cents: 12000, fair_market_value_cents: 3000, units_received_qty: 4 }
              as: ComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "the adjudication returns 200 with data.status == \"UNFOUNDED\""
            - "the premium attempt returns 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "GET /premium-items reports total_count == 0"

      - name: development_coordinator_cannot_publish_a_schedule_grid
        claim_type: Role cannot perform another role's exclusive operations
        grounds: [ roles.DevelopmentCoordinator, "endpoints[POST /schedule-grids/{gridId}/publish]", "errors[ERR_UNAUTHORIZED]" ]
        distinguishing_aspect: >
          The fundraising role can read grids but must not write them; the OCC token
          is supplied from a fresh read so the refusal is provably the role rule and
          not a stale-version rejection.
        test_recipe:
          setup:
            - "One DRAFT grid exists and its version has been read."
          setup_api_calls:
            - *k_clock
            - *k_grid
          trigger:
            - call: "POST /membership-drives"
              payload: { name: "Spring Drive 2027", goal_cents: 400000, start_at: "2027-03-01T00:00:00Z", end_at: "2027-03-10T00:00:00Z", phone_line_count: 3 }
              as: DevelopmentCoordinator
              captures: { spring_drive_id: "$.data.id" }
            - call: "POST /schedule-grids/${grid_id}/publish"
              payload: { expected_grid_version: "${grid_v0}" }
              as: DevelopmentCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the drive creation returns 201 with data.status == \"PLANNED\""
            - "the publish attempt returns 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "GET /schedule-grids/${grid_id} still reports status == \"DRAFT\" and published_at null"

      - name: only_the_board_operator_can_submit_the_playlist_log
        claim_type: Same user cannot do step A and step B (if X-User-ID tracked)
        grounds: [ "validations[priority=13 v_board_operator_only]", "endpoints[POST /episodes/{episodeId}/submit-log]", "errors[ERR_NOT_BOARD_OPERATOR]" ]
        distinguishing_aspect: >
          Row-level identity again, but bound to a different entity: the caller holds
          the Volunteer role and the log is genuinely PENDING, so only the
          X-User-ID-versus-board_operator comparison can refuse the write. It fires at
          priority 13, ahead of the priority-76 empty-playlist rule that would
          otherwise reject the same call.
        test_recipe:
          setup:
            - "The canonical MUSIC episode has AIRED, so its log_status is PENDING and Ada is its board operator."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_bo
            - *k_cy
            - *k_dee
            - *k_prop
            - *k_submit
            - *k_open
            - *k_vote_bo
            - *k_vote_cy
            - *k_vote_dee
            - *k_read_prop
            - *k_decide
            - *k_find_program
            - *k_grid
            - *k_slot
            - *k_confirm
            - *k_episode
            - *k_aired
          trigger:
            - call: "POST /episodes/${episode_id}/submit-log"
              as: Volunteer
              as_user_id: "${bo_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 403 and data.error_id == \"ERR_NOT_BOARD_OPERATOR\" - not the 422 ERR_PLAYLIST_EMPTY the same call would earn from the rightful operator"
            - "GET /episodes/${episode_id} still reports log_status == \"PENDING\""

      - name: officer_who_cleared_the_copy_cannot_adjudicate_that_spot
        claim_type: Same user cannot do step A and step B (if X-User-ID tracked)
        grounds: [ "validations[priority=45 v_segregation_of_duties]", complexity_profile.role_model, "errors[ERR_SEGREGATION_OF_DUTIES]" ]
        excluded_because:
          difficulty_instance: segregation_of_duties_outranks_the_incident_state_check
          rationale: >
            That §1.8 instance already has one officer identity both clear a spot and then
            attempt to adjudicate the incident raised against it, pinning
            ERR_SEGREGATION_OF_DUTIES; the plain duties refusal is a strict subset of it.
        distinguishing_aspect: >
          The same-identity refusal is pinned in §1.8, in its harder priority-pair form.

  # =========================================================================
  # SECTION 8 - CROSS-CUTTING COMPLEXITY LAYERS
  # optimistic_concurrency / cascading_side_effects /
  # dual_variant_calculation / rate_threshold_triggers
  # =========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: occ_slot_create_rejects_a_grid_version_that_another_write_advanced
        claim_type: Stale expected_<parent>_version returns the rule's error_id
        grounds: [ "concurrency_rules[slot-assignment-create-stale-grid]", "validations[priority=40 v_occ_grid_version]", "errors[ERR_STALE_GRID_VERSION]" ]
        distinguishing_aspect: >
          The staleness is produced naturally: the first assignment's own declared side
          effect increments the grid version, so replaying the pre-write token models a
          second director whose picture of the free minutes is out of date. Maps
          concurrency_rules entry slot-assignment-create-stale-grid.
        test_recipe:
          setup:
            - "One DRAFT grid whose create-response version was captured; the first assignment is then created with that token, which consumes it."
          setup_api_calls: *k_chain_grid
          trigger:
            - *k_slot
            - call: "POST /schedule-grids/${grid_id}/slot-assignments"
              payload: { expected_grid_version: "${grid_v0}", program_id: "${program_id}", day_of_week: 2, start_minute: 540, duration_minutes: 60 }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "the first assignment returns 201 and bumps the grid: its response reports total_assigned_minutes == 60"
            - "the second assignment, replaying the now-consumed token, returns 412 with data.error_id == \"ERR_STALE_GRID_VERSION\""
            - "GET /slot-assignments reports total_count == 1 - the Tuesday window was never created"
            - "GET /schedule-grids/${grid_id} reports total_assigned_minutes == 60 (unchanged) and a version strictly greater than ${grid_v0}"
            - "re-reading the grid and resubmitting the same body with the fresh version succeeds with 201"

      - name: occ_grid_publish_rejects_a_stale_grid_version
        claim_type: Stale expected_<parent>_version returns the rule's error_id
        grounds: [ "concurrency_rules[grid-publish-stale-grid]", "endpoints[POST /schedule-grids/{gridId}/publish]", "errors[ERR_STALE_GRID_VERSION]" ]
        distinguishing_aspect: >
          Same parent and same error code as the slot-create rule but a different
          guarded write, and the OCC check must beat the publish-time quota rules: the
          grid here would ALSO fail the 8.00 percent diversity quota, yet the 412 is
          what comes back because priority 40 precedes priority 74. Maps
          concurrency_rules entry grid-publish-stale-grid.
        test_recipe:
          setup:
            - "One DRAFT grid and the canonical APPROVED show; the grid's create-response version is captured before anything occupies it."
          setup_api_calls: *k_chain_grid
          trigger:
            - *k_slot
            - *k_confirm
            - call: "POST /schedule-grids/${grid_id}/publish"
              payload: { expected_grid_version: "${grid_v0}" }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "the assignment create and its confirmation both succeed, so two writes have advanced the grid past the captured token"
            - "the publish attempt returns 412 with data.error_id == \"ERR_STALE_GRID_VERSION\", not the 422 ERR_DIVERSITY_QUOTA_UNMET the same grid would earn at the right version"
            - "GET /schedule-grids/${grid_id} still reports status == \"IN_REVIEW\" and published_at null"
            - "GET /programs/${program_id} still reports programming_status == \"SCHEDULED\" - no show was flipped on air"

      - name: occ_proposal_decide_rejects_a_stale_proposal_version
        claim_type: Stale expected_<parent>_version returns the rule's error_id
        grounds: [ "concurrency_rules[proposal-decide-stale-proposal]", "endpoints[POST /program-proposals/{proposalId}/decide]", "errors[ERR_STALE_PROPOSAL_VERSION]" ]
        distinguishing_aspect: >
          Quorum is fully satisfied and the composite would be a clean APPROVE, so the
          412 isolates the concurrency guard from every business precondition on the
          tally. Maps concurrency_rules entry proposal-decide-stale-proposal.
        test_recipe:
          setup:
            - "A proposal IN_COMMITTEE with all three ballots cast and its current version read."
          setup_api_calls: *k_chain_open_review
          trigger:
            - *k_vote_bo
            - *k_vote_cy
            - *k_vote_dee
            - *k_read_prop
            - call: "POST /program-proposals/${proposal_id}/decide"
              payload: { expected_proposal_version: "${proposal_v} - 1" }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 412 and data.error_id == \"ERR_STALE_PROPOSAL_VERSION\""
            - "GET /program-proposals/${proposal_id} still reports status == \"IN_COMMITTEE\", composite_score null and decided_at null"
            - "GET /programs reports total_count == 0 - the Program side effect did not run"
            - "resubmitting with ${proposal_v} returns 200 with status APPROVED and composite_score 4.00"

      - name: occ_program_cancel_rejects_a_stale_program_version
        claim_type: Stale expected_<parent>_version returns the rule's error_id
        grounds: [ "concurrency_rules[program-cancel-stale-program]", "endpoints[POST /programs/{programId}/cancel]", "errors[ERR_STALE_PROGRAM_VERSION]" ]
        distinguishing_aspect: >
          The program is APPROVED_UNSCHEDULED, a state from which cancellation is not
          even declared, so this instance additionally pins the ladder: the
          priority-40 concurrency guard answers before the priority-50 state rule.
          Maps concurrency_rules entry program-cancel-stale-program.
        test_recipe:
          setup:
            - "The canonical APPROVED show exists and its current version has been read."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_board
            - *k_cert_policy
            - *k_cert_reg
            - *k_bo
            - *k_cy
            - *k_dee
            - *k_prop
            - *k_submit
            - *k_open
            - *k_vote_bo
            - *k_vote_cy
            - *k_vote_dee
            - *k_read_prop
            - *k_decide
            - *k_find_program
            - call: "GET /programs/${program_id}"
              as: ProgramDirector
              captures: { program_v: "$.data.version" }
          trigger:
            - call: "POST /programs/${program_id}/cancel"
              payload: { expected_program_version: "${program_v} - 1", cancellation_reason: "Host withdrew" }
              as: ProgramDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 412 and data.error_id == \"ERR_STALE_PROGRAM_VERSION\", not the 409 ERR_INVALID_STATE this source state would otherwise earn"
            - "GET /programs/${program_id} still reports programming_status == \"APPROVED_UNSCHEDULED\" and cancellation_reason null"

      - name: occ_version_advances_on_every_successful_write
        claim_type: Version increments on every write
        grounds: [ complexity_profile.complexity_layers, entities.Volunteer, "endpoints[PATCH /volunteers/{volunteerId}]" ]
        distinguishing_aspect: >
          The monotonicity half of the OCC layer, verified on a row whose version is
          moved only by explicit client writes - no cascade contributes - so the
          sequence 1, 2, 3 is exact rather than merely increasing.
        test_recipe:
          setup:
            - "One freshly enrolled volunteer at version 1."
          setup_api_calls:
            - *k_clock
            - *k_ada
          trigger:
            - call: "PATCH /volunteers/${host_id}"
              payload: { legal_name: "Ada M. Reyes" }
              as: TrainingCoordinator
              captures: { v_after_first: "$.data.version" }
            - call: "PATCH /volunteers/${host_id}"
              payload: { committee_seat: true }
              as: ProgramDirector
              captures: { v_after_second: "$.data.version" }
          assert:
            - "the create response reported version == 1"
            - "the first PATCH returns 200 with data.version == 2 and data.legal_name == \"Ada M. Reyes\""
            - "the second PATCH returns 200 with data.version == 3 and data.committee_seat == true"
            - "data.status is still \"PROSPECT\" throughout - version movement is not state movement"

      - name: rate_threshold_penalty_points_flip_the_standing_at_exactly_six
        claim_type: Cumulative threshold tested at the boundary
        grounds: [ "calculations.incident_penalty_points.constants.RESTRICTED_THRESHOLD", "state_machines.Program.WATCH_to_RESTRICTED", entities.Program.fields.compliance_penalty_points ]
        distinguishing_aspect: >
          Two identical 3-point charges walk the running total 0 -> 3 -> 6, so the
          WATCH band's upper edge (5) and the RESTRICTED edge (6) are both observed on
          the same program. The safe-harbour instances instead vary the per-incident
          multiplier and reach the threshold in one charge.
        test_recipe:
          setup:
            - "The canonical MUSIC show with a CONFIRMED occupation and one SCHEDULED episode, standing CLEAR at 0 points."
          setup_api_calls: *k_chain_episode
          trigger:
            - call: "POST /compliance-incidents"
              payload: { category: "POLITICAL_CONTENT", severity: "MAJOR", occurred_at: "2026-07-28T20:00:00Z", complainant_note: "Candidate endorsement aired without balance.", program_id: "${program_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { inc_one_id: "$.data.id" }
            - call: "POST /compliance-incidents/${inc_one_id}/adjudicate"
              payload: { finding: "SUBSTANTIATED" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { inc_one_status: "$.data.status" }
            - call: "POST /compliance-incidents"
              payload: { category: "POLITICAL_CONTENT", severity: "MAJOR", occurred_at: "2026-07-29T20:00:00Z", complainant_note: "Second unbalanced endorsement.", program_id: "${program_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { inc_two_id: "$.data.id" }
            - call: "POST /compliance-incidents/${inc_two_id}/adjudicate"
              payload: { finding: "SUBSTANTIATED" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { inc_two_status: "$.data.status" }
          assert:
            - "each incident create response reports penalty_points == 3 and safe_harbor_violation == false (doubling is INDECENCY-only)"
            - "after the first adjudication GET /programs/${program_id} reports compliance_penalty_points == 3 and compliance_standing == \"WATCH\""
            - "after the first adjudication GET /slot-assignments/${slot_id} still reports status == \"CONFIRMED\" - WATCH preempts nothing"
            - "after the second adjudication the same read reports compliance_penalty_points == 6 and compliance_standing == \"RESTRICTED\""
            - "GET /slot-assignments/${slot_id} now reports status == \"PREEMPTED\" and GET /episodes/${episode_id} reports air_status == \"CANCELLED\""

      - name: rate_threshold_retake_window_resets_after_fourteen_days
        claim_type: Instantaneous threshold at the boundary and reset
        grounds: [ "validations[priority=68 v_retake_cooling_off]", "state_machines.CertificationRecord.FAILED_to_PENDING_EXAM", "errors[ERR_RETAKE_TOO_SOON]" ]
        distinguishing_aspect: >
          One recipe drives both sides of the same temporal gate and then its reset:
          day 13 is refused, day 14 is accepted, and after the retake the window is
          re-armed against the new last_attempt_at. The cumulative instance instead
          accumulates a total that never resets on its own.
        test_recipe:
          setup:
            - "One FAILED certification with last_attempt_at 2026-08-01; the clock is moved to 2026-08-14, one day short."
          setup_api_calls:
            - *k_clock
            - *k_ada
            - *k_cert_failed
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-14T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /certifications/${failed_cert_id}/retake"
              as: TrainingCoordinator
              captures: { err: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /certifications/${failed_cert_id}/retake"
              as: TrainingCoordinator
              captures: { reopened_status: "$.data.status" }
          assert:
            - "at the 2026-08-14 clock the retake returns 409 with data.error_id == \"ERR_RETAKE_TOO_SOON\""
            - "at the 2026-08-15 clock - exactly last_attempt_at + 14 days - the identical call returns 200 with data.status == \"PENDING_EXAM\""
            - "data.attempt_count is still 1 and data.exam_score is null"
            - "GET /volunteers/${host_id} reports status == \"IN_TRAINING\" and current_certification_count == 0 throughout"

      - name: cascading_side_effects_chain_verified_end_to_end
        claim_type: N-level chain verified end-to-end
        grounds: [ complexity_profile.complexity_layers, "endpoints[POST /certifications/{certificationId}/revoke]" ]
        excluded_because:
          difficulty_instance: certification_revocation_cascades_four_links_to_orphaned_episodes
          rationale: >
            That §1.8 transitive_cascade instance walks all four declared links from one
            revoke call - certification, volunteer, hosted programs, orphaned episodes -
            and asserts each link's observable, which is the end-to-end claim itself.
        distinguishing_aspect: >
          Depth-4 traversal from an explicit officer call is pinned in §1.8.

      - name: cascading_side_effects_ordering_and_partial_failure
        claim_type: Ordering sensitivity; partial failure
        grounds: [ complexity_profile.complexity_layers, "endpoints[POST /operations/daily-sweep]" ]
        excluded_because:
          difficulty_instance: sweep_missing_public_file_cascades_four_links_to_cancelled_episodes
          rationale: >
            That §1.8 instance pins the sweep's charge-versus-evaluate ordering by asserting
            only the observables that are order-independent and by pinning the ones that are
            not, so ordering sensitivity is already the subject of a named instance.
        distinguishing_aspect: >
          Ordering sensitivity inside the sweep is the explicit subject of the cited instance.

      - name: dual_variant_calculation_delta_on_switch
        claim_type: Both variants produce expected results; delta on switch is correct
        grounds: [ complexity_profile.complexity_layers, "calculations.program_performance_score.variants", "calculations.episode_royalty_liability_cents.variants" ]
        excluded_because:
          difficulty_instance: program_performance_trailing_six_versus_quarter_to_date_diverge
          rationale: >
            Both declared dual-variant calculations are pinned in §1.8 with author-computed
            literals on each side and an explicit delta - 100.00 versus 92.14 for the
            performance score and 529 versus 481 for the royalty - so the layer is covered.
        distinguishing_aspect: >
          Both variant pairs and their deltas are pinned in §1.8.

  # =========================================================================
  # SECTION 9 - CONSISTENCY MODEL  (declared `immediate`: all changes visible
  # in the same request's response)
  # =========================================================================
  - section: consistency model
    instances:

      - name: drive_roll_ups_reflect_the_settlement_in_the_same_request
        claim_type: All changes visible in same request's response
        grounds: [ complexity_profile.consistency_model, entities.MembershipDrive.fields.attainment_pct, "endpoints[POST /pledges/{pledgeId}/payment]" ]
        distinguishing_aspect: >
          The write targets a Pledge but the observable lives on its parent
          MembershipDrive, so an implementation that deferred the roll-up to a later
          batch would still pass a Pledge-only assertion and fail this one.
        test_recipe:
          setup:
            - "An ACTIVE drive with a 500000-cent goal, one in-stock premium and one PENDING 6000-cent pledge."
          setup_api_calls:
            - *k_clock
            - *k_mug
            - *k_drive
            - *k_drive_active
            - *k_pledge_6000
          trigger:
            - call: "POST /pledges/${pledge_id}/payment"
              payload: { outcome: "PAID" }
              as: DevelopmentCoordinator
              captures: { paid_status: "$.data.payment_status" }
            - call: "GET /membership-drives/${drive_id}"
              as: DevelopmentCoordinator
              captures: { drive_pledged: "$.data.pledged_total_cents" }
          assert:
            - "the payment response returns 200 with data.payment_status == \"PAID\""
            - "the immediately following drive read reports pledged_total_cents == 6000 and fulfilled_total_cents == 6000"
            - "the same read reports attainment_pct == 1.20 (6000 of the 500000-cent goal, 2 decimal places)"
            - "the same read reports lapsed_total_cents == 0 and refunded_total_cents == 0"
            - "GET /premium-items/${mug_id} still reports reserved_qty == 1 - settling the payment did not disturb the reservation"

      - name: released_occupation_restores_the_grid_totals_immediately
        claim_type: All changes visible in same request's response
        grounds: [ complexity_profile.consistency_model, entities.ScheduleGrid.fields.total_assigned_minutes ]
        excluded_because:
          difficulty_instance: grid_airtime_minutes_restored_by_preempt_then_reinstate
          rationale: >
            That §1.8 compensating_invariant instance reads the grid's derived minute and
            share fields after each of three writes and pins 150/20.00, 30/100.00 and
            150/20.00, which can only hold if every recompute is visible in the same
            request cycle.
        distinguishing_aspect: >
          Same-cycle visibility of the grid recompute is what makes the cited §1.8
          invariant observable at all.
