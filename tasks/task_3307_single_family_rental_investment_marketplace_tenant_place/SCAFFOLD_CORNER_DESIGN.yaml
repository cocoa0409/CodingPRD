  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_escrow_sign_stale_version
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[escrow-sign-stale-escrow, errors[ERR_STALE_ESCROW_VERSION]]
        distinguishing_aspect: "Signing with an escrow version one behind the current (e.g., after a prior observation) yields 412 ERR_STALE_ESCROW_VERSION; re-reading and signing with the fresh version succeeds."
        test_recipe:
          setup: ["Escrow E in DOCS_SENT for an accepted offer"]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "OCCE Seller", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/buyers"
              payload: { legal_name: "OCCE Buyer", buyer_state: "TX", entity_type: "LLC", proof_of_funds_cents: 100000000 }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /marketplace/certification-programs"
              payload: { name: "POE", min_inspection_score: 50, min_title_grade: "C", requires_lease_disclosure: false, guarantee_months_cap: 6 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "52 OCCE St", listing_state: "TX", asking_price_cents: 10000000, listing_kind: "SINGLE", certification_program_id: "${prog_id}", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id }
            - call: "POST /marketplace/listings/${l_id}/inspection-reports"
              payload: { inspector_name: "I", inspection_date: "2026-08-01T00:00:00Z", overall_score: 80, roof_score: 80, systems_score: 80, disclosed_defects: [], title_grade: "A" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ir: $.data.id }
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "VERIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "CERTIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "PUBLISH" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /marketplace/listings/${l_id}"
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_v: $.data.version }
            - call: "POST /marketplace/listings/${l_id}/offers"
              payload: { buyer_id: "${b_id}", amount_cents: 10000000, earnest_money_cents: 50000, financing_type: "CASH", expected_listing_version: "${l_v}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off: $.data.id }
            - call: "POST /marketplace/offers/${off}/transition"
              payload: { action: "SUBMIT" }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /marketplace/offers/${off}/transition"
              payload: { action: "ACCEPT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /marketplace/offers/${off}/escrow"
              as: Buyer
              as_user_id: "${b_id}"
              captures: { esc: $.data.0.id }
            - call: "POST /marketplace/escrows/${esc}/transition"
              payload: { action: "SEND_DOCS", escrow_officer_name: "EO" }
              as: EscrowOfficer
            - call: "GET /marketplace/offers/${off}/escrow"
              as: Buyer
              as_user_id: "${b_id}"
              captures: { esc_v: $.data.0.version }
          trigger:
            - call: "POST /marketplace/escrows/${esc}/sign"
              payload: { expected_escrow_version: "${esc_v} - 1" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { e: $.data.error_id }
            - call: "POST /marketplace/escrows/${esc}/sign"
              payload: { expected_escrow_version: "${esc_v}" }
              as: Buyer
              as_user_id: "${b_id}"
          assert:
            - "First sign: error_id == ERR_STALE_ESCROW_VERSION, HTTP 412"
            - "Second sign (fresh version) succeeds: Escrow.${esc}.status == SIGNED"

      - name: confidential_flag_switches_underwriting_variant
        claim_type: conditional_feature_flag
        grounds:
          - complexity_profile.complexity_layers
          - entities.Listing.fields.seller_asks_confidential
          - calculations.projected_noi
        distinguishing_aspect: "Toggling seller_asks_confidential at listing creation changes which projected_noi variant executes; this corner asserts the flag exists and drives disclosure_limited, depth probed in §1.8."
        excluded_because:
          difficulty_instance: dual_variant_calc / underwriting_noi_base_vs_redacted_variant
          rationale: "Both flag values and the resulting NOI divergence are asserted as the primary claim of the named §1.8 instance."

