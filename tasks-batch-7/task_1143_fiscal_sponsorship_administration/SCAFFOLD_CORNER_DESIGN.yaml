            - { call: "POST /fsa/donations/${d}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/projects/${p}/disbursement-requests", payload: { amount_cents: 1000000, purpose: "building", payee_type: "VENDOR", payee_name: "BuildCo", spend_date: "2026-06-01" }, as: ProjectLead, as_user_id: "${p}", captures: { dr: $.data.id, hv: $.data.high_value } }
          trigger:
            - { call: "POST /fsa/disbursement-requests/${dr}/submit", payload: {}, as: ProjectLead, as_user_id: "${p}" }
            - { call: "POST /fsa/disbursement-requests/${dr}/compliance-review", payload: { decision: "APPROVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { st1: $.data.status } }
            - { call: "POST /fsa/disbursement-requests/${dr}/pay", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { e: $.data.error_id } }
            - { call: "POST /fsa/disbursement-requests/${dr}/sponsor-approve", payload: { decision: "APPROVE" }, as: SponsorAdmin, as_user_id: user_sa_1, captures: { st2: $.data.status } }
            - { call: "POST /fsa/disbursement-requests/${dr}/pay", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { st3: $.data.status } }
          assert:
