# =============================================================================
# SCAFFOLD — Sheep & Goat Operation & Wool Clip Marketing (western sheep ranch)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Sheep & Goat Operation & Wool Clip Marketing (western sheep ranch): lambing/kidding
  season & flock records, shearing scheduling & wool grading, wool pool consignment &
  core testing, meat market channel & ethnic-holiday timing, predator loss & guardian
  program, grazing contract for vegetation management, parasite management & rotational
  grazing, breeding stock sales.

domain_name: sheep-goat-wool-marketing
api_prefix: /api

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine        # wool pool settlement + holiday-timed meat pricing
  secondary_archetype: temporal_windowing  # pasture rotations, shearing crew bookings, contract/holiday windows
  complexity_layers:
    - optimistic_concurrency     # OCC on WoolLot regrade and GrazingContract counter-offers
    - dual_variant_calculation   # provisional vs certified wool value; booked vs settled sale price
    - rate_threshold_triggers    # micron grade bands, pool-fee weight tiers, efficacy threshold
    - cascading_side_effects     # loss verification -> headcount -> contract breach -> move cancellation
  entity_topology: flat                    # peer entities joined by FK references; no URL nesting
  state_machine_shape: branching           # cyclic (WoolLot, GrazingContract) + parallel dims (LivestockSale) + long chains
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties        # core-test submitter may not lock the same test (X-User-ID tracked)
  consistency_model: immediate             # every mutation visible in its own response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all parent: null)
# =============================================================================
entities:
  - name: Flock
    parent: null
    common_fields: true
    fields:
      - { name: flock_name, type: string, source: input, description: "Display name; unique across all flocks" }
      - { name: species, type: enum, source: input, description: "SHEEP | GOAT", constraints: "enum {SHEEP, GOAT}; immutable after creation" }
      - { name: flock_status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE, constraints: "enum {ACTIVE, RETIRED}" }
      - { name: baseline_headcount, type: integer, source: input, description: "Head count when the flock record is opened; must be >= 1" }
      - { name: guardian_dog_count, type: integer, source: input, description: "Livestock guardian dogs currently assigned", default: 0, constraints: ">= 0" }
      - { name: current_headcount, type: integer, source: computed, description: "Derived by calculations.flock_headcount_reconciliation; never directly writable" }
      - { name: withdrawal_until, type: datetime, source: computed, description: "Latest withdrawal_until over this flock's ParasiteTreatments whose withdrawal_until is strictly after the logical clock; null when none; meat-sale gate" }

  - name: BreedingSeason
    parent: null
    common_fields: true
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id; season belongs to this flock" }
      - { name: season_label, type: string, source: input, description: "e.g. 2026-fall; unique within the flock" }
      - { name: ewes_bred, type: integer, source: input, description: "Females exposed to rams/bucks; must be >= 1" }
      - { name: breeding_start_date, type: datetime, source: input, description: "First day males are in; must be < breeding_end_date" }
      - { name: breeding_end_date, type: datetime, source: input, description: "Last day males are in" }
      - { name: expected_lambing_start, type: datetime, source: computed, description: "breeding_start_date + GESTATION_DAYS (SHEEP 147, GOAT 150)" }
      - { name: season_status, type: enum, source: system, description: "PLANNED | BREEDING | GESTATION | LAMBING | WEANING | CLOSED | CANCELLED", default: PLANNED }
      - { name: total_born, type: integer, source: computed, description: "Sum of births_reported over all BirthRecords of this season", default: 0 }
      - { name: total_born_alive, type: integer, source: computed, description: "Sum of born_alive over all BirthRecords of this season", default: 0 }
      - { name: lambing_rate_pct, type: number, source: computed, description: "round_half_up(total_born_alive / ewes_bred * 100, 1); recomputed on every BirthRecord" }

  - name: BirthRecord
    parent: null
    common_fields: false
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> BreedingSeason.id; births log against this season" }
      - { name: birth_date, type: datetime, source: input, description: "Date the lambs/kids dropped; must fall inside the season lambing window" }
      - { name: births_reported, type: integer, source: input, description: "Total lambs/kids born in this record; must equal born_alive + born_dead; >= 1" }
      - { name: born_alive, type: integer, source: input, description: "Live births in this record; >= 0" }
      - { name: born_dead, type: integer, source: input, description: "Stillborn in this record; >= 0" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recorder; audit only" }

  - name: Pasture
    parent: null
    common_fields: true
    fields:
      - { name: pasture_name, type: string, source: input, description: "Display name; unique" }
      - { name: acres, type: number, source: input, description: "Grazeable acres; must be > 0" }
      - { name: carrying_capacity_head, type: integer, source: input, description: "Maximum head allowed in a single GrazingMove on this pasture; must be >= 1" }
      - { name: rest_days, type: integer, source: input, description: "Parasite-break rest period applied after a move completes", default: 21, constraints: ">= 0" }
      - { name: occupied_head_count, type: integer, source: computed, description: "Sum of head_count over GrazingMoves on this pasture with move_status == ACTIVE" }
      - { name: pasture_status, type: enum, source: computed, description: "OCCUPIED if any ACTIVE move on this pasture; else RESTING if logical clock < (latest COMPLETED move's move_end + rest_days); else AVAILABLE" }

  - name: GrazingMove
    parent: null
    common_fields: true
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id; flock being rotated" }
      - { name: pasture_id, type: string, source: input, description: "FK -> Pasture.id; required (non-null) for own-ranch moves; must be null when contract_id is set" }
      - { name: contract_id, type: string, source: input, description: "FK -> GrazingContract.id; set for vegetation-management (contract) moves; must be null when pasture_id is set" }
      - { name: move_start, type: datetime, source: input, description: "Planned occupancy start; must be < move_end" }
      - { name: move_end, type: datetime, source: input, description: "Planned occupancy end; half-open interval [move_start, move_end)" }
      - { name: head_count, type: integer, source: input, description: "Head moved; >= 1; own-ranch moves also bounded by Pasture.carrying_capacity_head" }
      - { name: move_status, type: enum, source: system, description: "PLANNED | ACTIVE | COMPLETED | CANCELLED", default: PLANNED }

  - name: ParasiteTreatment
    parent: null
    common_fields: true
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id; treated flock" }
      - { name: product_name, type: string, source: input, description: "Dewormer product name" }
      - { name: treatment_date, type: datetime, source: input, description: "Date administered" }
      - { name: withdrawal_days, type: integer, source: input, description: "Label meat-withdrawal period in days; >= 0" }
      - { name: withdrawal_until, type: datetime, source: computed, description: "treatment_date + withdrawal_days (calendar days); meat sales with scheduled_date < withdrawal_until are rejected" }
      - { name: fecal_egg_count_before, type: integer, source: input, description: "Fecal egg count (EPG) at treatment; >= 0" }
      - { name: fecal_egg_count_after, type: integer, source: input, description: "EPG at 14-day follow-up; null until follow-up posted; >= 0", default: null }
      - { name: efficacy_pct, type: number, source: computed, description: "round_half_up((before - after) / before * 100, 1); null when after is null or before == 0" }
      - { name: resistance_flag, type: boolean, source: computed, description: "true when efficacy_pct is not null and efficacy_pct < 80.0; else false" }

  - name: ShearingCrew
    parent: null
    common_fields: true
    fields:
      - { name: crew_name, type: string, source: input, description: "Display name; unique" }
      - { name: crew_status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE }
      - { name: head_per_day_capacity, type: integer, source: input, description: "Head the crew can shear per calendar day; must be >= 1" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Crew day rate in cents; >= 0" }

  - name: ShearingEvent
    parent: null
    common_fields: true
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id; flock being shorn" }
      - { name: crew_id, type: string, source: input, description: "FK -> ShearingCrew.id; booked crew (crew bookings overlap-checked with a 24h buffer)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Booking window start; must be < scheduled_end" }
      - { name: scheduled_end, type: datetime, source: input, description: "Booking window end (exclusive bound used for feasibility and overlap math)" }
      - { name: expected_head, type: integer, source: input, description: "Head to shear; >= 1 and <= flock.current_headcount; feasibility: whole days in window * crew capacity >= expected_head" }
      - { name: shearing_status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED", default: SCHEDULED }
      - { name: shorn_head_count, type: integer, source: input, description: "Actual head shorn; recorded at completion; null until COMPLETED", default: null }

  - name: WoolClip
    parent: null
    common_fields: true
    fields:
      - { name: shearing_event_id, type: string, source: system, description: "FK -> ShearingEvent.id; the completed shearing that produced this clip; unique (1:1)" }
      - { name: flock_id, type: string, source: system, description: "FK -> Flock.id; copied from the shearing event" }
      - { name: greasy_weight_lbs, type: number, source: input, description: "Total greasy weight off the shearing floor; recorded via shearing complete; > 0" }
      - { name: skirtings_weight_lbs, type: number, source: input, description: "Skirted/belly wool removed before baling; >= 0 and < greasy_weight_lbs" }
      - { name: allocated_weight_lbs, type: number, source: computed, description: "Sum of weight_lbs over the clip's WoolLots" }
      - { name: unallocated_weight_lbs, type: number, source: computed, description: "greasy_weight_lbs - skirtings_weight_lbs - allocated_weight_lbs; weight-conservation invariant anchor" }
      - { name: clip_value_cents, type: integer, source: computed, description: "Sum of effective_value_cents over the clip's WoolLots" }
      - { name: marketing_posture, type: enum, source: computed, description: "UNGRADED (no lots) | GRADING (lots exist, none in {CONSIGNED,SOLD,SETTLED}) | MARKETING (>=1 lot in {CONSIGNED,SOLD}) | SETTLED_OUT (>=1 lot, all lots SETTLED, unallocated_weight_lbs == 0)" }

  - name: WoolLot
    parent: null
    common_fields: true
    fields:
      - { name: clip_id, type: string, source: input, description: "FK -> WoolClip.id; clip this lot was baled from" }
      - { name: lot_code, type: string, source: input, description: "Bale/lot code; unique within the clip" }
      - { name: weight_lbs, type: number, source: input, description: "Lot weight; > 0 and <= clip.unallocated_weight_lbs at creation" }
      - { name: estimated_micron, type: number, source: input, description: "Classer's visual micron estimate; set at grade / regrade; > 0" }
      - { name: certified_micron, type: number, source: system, description: "Core-test micron; null until a CoreTest is LOCKED", default: null }
      - { name: certified_yield_pct, type: number, source: system, description: "Core-test clean yield percent; null until a CoreTest is LOCKED", default: null }
      - { name: effective_micron, type: number, source: computed, description: "certified_micron when a LOCKED CoreTest exists, else estimated_micron" }
      - { name: grade_code, type: enum, source: computed, description: "SUPERFINE | FINE | MEDIUM | STRONG | COARSE — banded from effective_micron per calculations.wool_grade_classify" }
      - { name: lot_status, type: enum, source: system, description: "DRAFT | GRADED | REGRADING | CONSIGNED | SOLD | SETTLED | WITHDRAWN", default: DRAFT }
      - { name: provisional_value_cents, type: integer, source: computed, description: "weight_lbs * grade greasy-lb price (calculations.lot_value, provisional variant)" }
      - { name: certified_value_cents, type: integer, source: computed, description: "clean lbs * certified grade clean-lb price; null until a CoreTest is LOCKED", default: null }
      - { name: effective_value_cents, type: integer, source: computed, description: "certified_value_cents when not null, else provisional_value_cents" }

  - name: CoreTest
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> WoolLot.id; lot sampled" }
      - { name: lab_ref, type: string, source: input, description: "Core-lab certificate reference" }
      - { name: test_status, type: enum, source: system, description: "SUBMITTED | RESULTED | LOCKED | REJECTED", default: SUBMITTED }
      - { name: measured_micron, type: number, source: input, description: "Lab mean fibre diameter; null until RESULTED", default: null }
      - { name: clean_yield_pct, type: number, source: input, description: "Lab clean yield percent 0-100; null until RESULTED", default: null }
      - { name: vegetable_matter_pct, type: number, source: input, description: "Lab VM percent 0-100; null until RESULTED", default: null }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the operator who created the test; SoD anchor" }
      - { name: locked_by_user_id, type: string, source: system, description: "X-User-ID of the manager who locked; must differ from submitted_by_user_id", default: null }

  - name: Consignment
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> WoolLot.id; the consigned lot" }
      - { name: pool_ref, type: string, source: input, description: "Wool pool / sale-season identifier, e.g. WWPA-2026A" }
      - { name: consignment_status, type: enum, source: system, description: "TENDERED | ACCEPTED | REJECTED | ADVANCED | SOLD | SETTLED | WITHDRAWN", default: TENDERED }
      - { name: advance_cents, type: integer, source: system, description: "Pool advance posted at ACCEPTED->ADVANCED = round_half_up(0.70 * lot.effective_value_cents); 0 until then", default: 0 }
      - { name: sale_gross_cents, type: integer, source: input, description: "Gross pool sale proceeds for this lot; recorded via sell; null until SOLD", default: null }
      - { name: pool_fee_cents, type: integer, source: computed, description: "Tiered pool fee computed at settlement per calculations.pool_fee_tier; null until SETTLED", default: null }
      - { name: settlement_cents, type: integer, source: computed, description: "sale_gross_cents - pool_fee_cents - advance_cents at settlement; may be negative (grower repays); null until SETTLED", default: null }
      - { name: pending_clawback_cents, type: integer, source: system, description: "Set by core-test LOCK cascade when status == ADVANCED: max(0, advance_cents - round_half_up(0.70 * lot.certified_value_cents)); else 0", default: 0 }
      - { name: clawback_cents, type: integer, source: system, description: "Advance clawed back when WITHDRAWN from ADVANCED: equals advance_cents; 0 otherwise", default: 0 }

  - name: HolidayWindow
    parent: null
    common_fields: true
    fields:
      - { name: holiday_name, type: string, source: input, description: "e.g. EID_AL_ADHA, EASTER, ORTHODOX_EASTER, CHRISTMAS; unique" }
      - { name: window_start, type: datetime, source: input, description: "Premium window start (inclusive); must be < window_end" }
      - { name: window_end, type: datetime, source: input, description: "Premium window end (exclusive); half-open [window_start, window_end)" }
      - { name: premium_pct, type: number, source: input, description: "Premium percent applied to gross for ETHNIC_MARKET sales scheduled inside the window; 0-100" }
      - { name: min_head, type: integer, source: input, description: "Volume gate: sales with head_count >= min_head earn full premium, else half premium; >= 1" }

  - name: LivestockSale
    parent: null
    common_fields: true
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id; selling flock" }
      - { name: sale_type, type: enum, source: input, description: "MEAT | BREEDING", constraints: "enum {MEAT, BREEDING}" }
      - { name: channel, type: enum, source: input, description: "AUCTION | DIRECT | ETHNIC_MARKET", constraints: "enum {AUCTION, DIRECT, ETHNIC_MARKET}" }
      - { name: head_count, type: integer, source: input, description: "Head offered; >= 1 and <= flock.current_headcount at creation" }
      - { name: avg_weight_lbs, type: number, source: input, description: "Average live weight per head; required for MEAT, must be null for BREEDING; > 0", default: null }
      - { name: base_price_per_cwt_cents, type: integer, source: input, description: "Base price per hundredweight in cents; required for MEAT, must be null for BREEDING; > 0", default: null }
      - { name: per_head_price_cents, type: integer, source: input, description: "Per-head price; required for BREEDING, must be null for MEAT; > 0", default: null }
      - { name: shrink_pct, type: number, source: input, description: "Pencil shrink percent; applied only when channel == DIRECT; 0-100", default: 0 }
      - { name: scheduled_date, type: datetime, source: input, description: "Planned sale/delivery date; MEAT sales gated against flock.withdrawal_until" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | REFUNDED", default: UNPAID }
      - { name: delivery_status, type: enum, source: system, description: "PENDING | LOADED | DELIVERED | CANCELLED", default: PENDING }
      - { name: booked_price_cents, type: integer, source: computed, description: "Booked variant of calculations.sale_price, computed at creation" }
      - { name: applied_holiday_name, type: string, source: system, description: "holiday_name of the selected HolidayWindow for the premium; null when none applies", default: null }
      - { name: premium_pct_applied, type: number, source: computed, description: "Effective premium percent after the min_head volume gate; 0 when no window applies", default: 0 }
      - { name: actual_total_weight_lbs, type: number, source: input, description: "Scale weight at delivery; required for MEAT at deliver; null until then", default: null }
      - { name: actual_head_delivered, type: integer, source: input, description: "Head actually delivered; required for BREEDING at deliver; null until then", default: null }
      - { name: settled_price_cents, type: integer, source: computed, description: "Settled variant of calculations.sale_price, computed at DELIVERED; null until then", default: null }

  - name: LossReport
    parent: null
    common_fields: true
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id; flock that took the loss" }
      - { name: loss_date, type: datetime, source: input, description: "Date carcasses/kills found" }
      - { name: head_lost, type: integer, source: input, description: "Head lost to the predator event; >= 1 and <= flock.current_headcount" }
      - { name: predator_type, type: enum, source: input, description: "COYOTE | MOUNTAIN_LION | BEAR | DOG | EAGLE | UNKNOWN" }
      - { name: guardian_on_duty, type: boolean, source: input, description: "Whether a guardian animal was with the bunch" }
      - { name: report_status, type: enum, source: system, description: "REPORTED | UNDER_REVIEW | VERIFIED | DISMISSED", default: REPORTED }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the reviewing manager; set on UNDER_REVIEW", default: null }

  - name: GrazingContract
    parent: null
    common_fields: true
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id; flock performing the vegetation grazing" }
      - { name: client_org_name, type: string, source: input, description: "Vegetation-management customer organization" }
      - { name: parcel_name, type: string, source: input, description: "Customer land parcel description (customer land is not a Pasture)" }
      - { name: service_window_start, type: datetime, source: input, description: "Service window start (inclusive); must be < service_window_end" }
      - { name: service_window_end, type: datetime, source: input, description: "Service window end (exclusive); half-open [start, end)" }
      - { name: rate_per_head_day_cents, type: integer, source: input, description: "Contract rate per head-day in cents; > 0" }
      - { name: min_head, type: integer, source: input, description: "Minimum head per contract move; >= 1 and <= max_head" }
      - { name: max_head, type: integer, source: input, description: "Maximum head per contract move" }
      - { name: target_cover_reduction_pct, type: number, source: input, description: "Vegetation cover reduction target for the bonus; 0-100" }
      - { name: terms_version, type: integer, source: system, description: "Starts at 1; +1 on every counter-offer", default: 1 }
      - { name: contract_status, type: enum, source: system, description: "DRAFT | PROPOSED | COUNTERED | ACCEPTED | ACTIVE | COMPLETED | CANCELLED", default: DRAFT }
      - { name: breach_flag, type: boolean, source: system, description: "Set true by the loss-verification cascade when flock headcount drops below min_head while ACTIVE", default: false }
      - { name: achieved_cover_reduction_pct, type: number, source: input, description: "Measured cover reduction at completion; null until COMPLETED", default: null }
      - { name: head_days, type: integer, source: computed, description: "Window-clamped head-day total per calculations.grazing_invoice; null until COMPLETED", default: null }
      - { name: invoice_cents, type: integer, source: computed, description: "gross + bonus - penalty per calculations.grazing_invoice; null until COMPLETED", default: null }

# =============================================================================
# §1.2 State Machine Table
# Universal /transitions rule: if (from -> to) exists but the caller's role differs
# from the transition's actor, reject ERR_FORBIDDEN (403); if no such transition
# exists from the current state, reject ERR_<ENTITY>_INVALID_STATE (409).
# =============================================================================
state_machines:
  - entity: Flock
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/flocks/{id}/retire"
        actor: RanchManager
        preconditions:
          - "No BreedingSeason of this flock in {PLANNED, BREEDING, GESTATION, LAMBING, WEANING}"
          - "No GrazingMove of this flock in {PLANNED, ACTIVE}"
          - "No ShearingEvent of this flock in {SCHEDULED, IN_PROGRESS}"
          - "No LivestockSale of this flock with delivery_status in {PENDING, LOADED}"
          - "No GrazingContract of this flock in {DRAFT, PROPOSED, COUNTERED, ACCEPTED, ACTIVE}"
        side_effects:
          - "flock_status := RETIRED; increments Flock.version by 1"
        note: "Violation of any precondition -> ERR_FLOCK_BUSY (409)."

  - entity: BreedingSeason
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: BREEDING
        trigger: "POST /api/breeding-seasons/{id}/transitions {to: BREEDING}"
        actor: RanchManager
        preconditions: ["Flock.flock_status == ACTIVE"]
        side_effects: ["season_status := BREEDING; increments BreedingSeason.version by 1"]
      - from: BREEDING
        to: GESTATION
        trigger: "POST /api/breeding-seasons/{id}/transitions {to: GESTATION}"
        actor: RanchManager
        preconditions: ["logical clock >= breeding_end_date (else ERR_SEASON_TOO_EARLY)"]
        side_effects: ["season_status := GESTATION; increments BreedingSeason.version by 1"]
      - from: GESTATION
        to: LAMBING
        trigger: "POST /api/breeding-seasons/{id}/transitions {to: LAMBING}"
        actor: RanchManager
        preconditions: ["logical clock >= expected_lambing_start (else ERR_SEASON_TOO_EARLY)"]
        side_effects: ["season_status := LAMBING; increments BreedingSeason.version by 1"]
      - from: LAMBING
        to: WEANING
        trigger: "POST /api/breeding-seasons/{id}/transitions {to: WEANING}"
        actor: RanchManager
        preconditions: ["logical clock >= expected_lambing_start + 45 days (else ERR_SEASON_TOO_EARLY)"]
        side_effects: ["season_status := WEANING; increments BreedingSeason.version by 1"]
      - from: WEANING
        to: CLOSED
        trigger: "POST /api/breeding-seasons/{id}/transitions {to: CLOSED}"
        actor: RanchManager
        preconditions: []
        side_effects: ["season_status := CLOSED; increments BreedingSeason.version by 1"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/breeding-seasons/{id}/transitions {to: CANCELLED}"
        actor: RanchManager
        preconditions: []
        side_effects: ["season_status := CANCELLED; increments BreedingSeason.version by 1"]
      - from: BREEDING
        to: CANCELLED
        trigger: "POST /api/breeding-seasons/{id}/transitions {to: CANCELLED}"
        actor: RanchManager
        preconditions: []
        side_effects: ["season_status := CANCELLED; increments BreedingSeason.version by 1"]
        note: "GESTATION and later cannot be cancelled — lambs/kids are already on the way."

  - entity: GrazingMove
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /api/grazing-moves/{id}/transitions {to: ACTIVE}"
        actor: RanchManager | RangeHand
        preconditions:
          - "logical clock >= move_start AND logical clock < move_end"
          - "If contract_id is set: GrazingContract.contract_status == ACTIVE (else ERR_CONTRACT_INVALID_STATE)"
          - "If contract_id is set: contract.min_head <= head_count <= contract.max_head (else ERR_HEAD_OUT_OF_CONTRACT_RANGE)"
          - "head_count <= flock.current_headcount (else ERR_INSUFFICIENT_HEAD)"
        side_effects:
          - "move_status := ACTIVE; increments GrazingMove.version by 1"
          - "Own-ranch moves: recompute Pasture.occupied_head_count and Pasture.pasture_status (calculations.pasture_occupancy)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/grazing-moves/{id}/transitions {to: COMPLETED}"
        actor: RanchManager | RangeHand
        preconditions: []
        side_effects:
          - "move_status := COMPLETED; increments GrazingMove.version by 1"
          - "Own-ranch moves: recompute Pasture.occupied_head_count and Pasture.pasture_status (head removed; pasture may flip OCCUPIED -> RESTING)"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/grazing-moves/{id}/transitions {to: CANCELLED} OR grazing-contract completion cascade OR loss-verification breach cascade"
        actor: RanchManager | RangeHand | system
        preconditions: []
        side_effects:
          - "move_status := CANCELLED; increments GrazingMove.version by 1"

  - entity: ShearingCrew
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /api/shearing-crews/{id}/deactivate"
        actor: RanchManager
        preconditions: ["No ShearingEvent on this crew in {SCHEDULED, IN_PROGRESS} (else ERR_CREW_BUSY 409)"]
        side_effects: ["crew_status := INACTIVE; increments ShearingCrew.version by 1"]

  - entity: ShearingEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/shearing-events/{id}/transitions {to: IN_PROGRESS}"
        actor: RanchManager | RangeHand
        preconditions: ["logical clock >= scheduled_start"]
        side_effects: ["shearing_status := IN_PROGRESS; increments ShearingEvent.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/shearing-events/{id}/complete"
        actor: RanchManager | RangeHand
        preconditions: ["shorn_head_count >= 1", "greasy_weight_lbs > 0", "0 <= skirtings_weight_lbs < greasy_weight_lbs"]
        side_effects:
          - "shearing_status := COMPLETED; shorn_head_count stored; increments ShearingEvent.version by 1"
          - "Cascade create: one WoolClip row (shearing_event_id = this event, flock_id copied, greasy_weight_lbs / skirtings_weight_lbs copied); discoverable via GET /api/wool-clips?shearing_event_id={id}"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/shearing-events/{id}/transitions {to: CANCELLED}"
        actor: RanchManager | RangeHand
        preconditions: []
        side_effects: ["shearing_status := CANCELLED; increments ShearingEvent.version by 1"]

  - entity: WoolLot
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: GRADED
        trigger: "POST /api/wool-lots/{id}/grade"
        actor: RanchManager
        preconditions: ["estimated_micron > 0"]
        side_effects:
          - "lot_status := GRADED; grade_code recomputed (calculations.wool_grade_classify); provisional_value_cents recomputed (calculations.lot_value provisional); increments WoolLot.version by 1"
          - "Recompute parent WoolClip allocated/unallocated/value/posture (calculations.clip_weight_reconciliation)"
      - from: GRADED
        to: REGRADING
        trigger: "POST /api/wool-lots/{id}/transitions {to: REGRADING}"
        actor: RanchManager
        preconditions: ["No CoreTest of this lot in {SUBMITTED, RESULTED, LOCKED} (else ERR_DUPLICATE_ACTIVE_TEST)"]
        side_effects: ["lot_status := REGRADING; increments WoolLot.version by 1"]
      - from: REGRADING
        to: GRADED
        trigger: "POST /api/wool-lots/{id}/regrade"
        actor: RanchManager
        preconditions: ["OCC: expected_wool_lot_version == WoolLot.version (else ERR_STALE_LOT_VERSION 412)", "estimated_micron > 0"]
        side_effects:
          - "lot_status := GRADED; estimated_micron := new value; grade_code and provisional_value_cents recomputed; increments WoolLot.version by 1"
      - from: GRADED
        to: CONSIGNED
        trigger: "side effect of POST /api/consignments"
        actor: system
        preconditions: []
        side_effects: ["lot_status := CONSIGNED; increments WoolLot.version by 1"]
      - from: WITHDRAWN
        to: CONSIGNED
        trigger: "side effect of POST /api/consignments (re-consign a previously withdrawn lot)"
        actor: system
        preconditions: []
        side_effects: ["lot_status := CONSIGNED; increments WoolLot.version by 1"]
      - from: CONSIGNED
        to: SOLD
        trigger: "side effect of POST /api/consignments/{id}/sell"
        actor: system
        preconditions: []
        side_effects: ["lot_status := SOLD; increments WoolLot.version by 1"]
      - from: SOLD
        to: SETTLED
        trigger: "side effect of POST /api/consignments/{id}/transitions {to: SETTLED}"
        actor: system
        preconditions: []
        side_effects:
          - "lot_status := SETTLED; increments WoolLot.version by 1"
          - "Recompute parent WoolClip marketing_posture"
      - from: CONSIGNED
        to: WITHDRAWN
        trigger: "side effect of POST /api/consignments/{id}/transitions {to: WITHDRAWN}"
        actor: system
        preconditions: []
        side_effects: ["lot_status := WITHDRAWN; increments WoolLot.version by 1"]
    note: "DELETE /api/wool-lots/{id} removes the lot only while DRAFT (compensating action for the clip weight invariant)."

  - entity: CoreTest
    initial_state: SUBMITTED
    terminal_states: [LOCKED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: RESULTED
        trigger: "POST /api/core-tests/{id}/results"
        actor: WoolPoolOperator
        preconditions: ["0 < measured_micron", "0 <= clean_yield_pct <= 100", "0 <= vegetable_matter_pct <= 100"]
        side_effects: ["test_status := RESULTED; measured_micron/clean_yield_pct/vegetable_matter_pct stored; increments CoreTest.version by 1"]
      - from: RESULTED
        to: LOCKED
        trigger: "POST /api/core-tests/{id}/transitions {to: LOCKED}"
        actor: RanchManager
        preconditions: ["SoD: X-User-ID != submitted_by_user_id (else ERR_CORE_TEST_SOD 403)"]
        side_effects:
          - "test_status := LOCKED; locked_by_user_id := X-User-ID; increments CoreTest.version by 1"
          - "Cascade link 1 -> WoolLot: certified_micron := measured_micron; certified_yield_pct := clean_yield_pct; grade_code recomputed; certified_value_cents recomputed (calculations.lot_value certified); increments WoolLot.version by 1"
          - "Cascade link 2 -> Consignment: if this lot has a Consignment in ACCEPTED or ADVANCED: when ADVANCED set pending_clawback_cents := max(0, advance_cents - round_half_up(0.70 * certified_value_cents)); increments Consignment.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/core-tests/{id}/transitions {to: REJECTED}"
        actor: RanchManager
        preconditions: []
        side_effects: ["test_status := REJECTED; increments CoreTest.version by 1"]
      - from: RESULTED
        to: REJECTED
        trigger: "POST /api/core-tests/{id}/transitions {to: REJECTED}"
        actor: RanchManager
        preconditions: []
        side_effects: ["test_status := REJECTED; increments CoreTest.version by 1; a new CoreTest may then be created for the lot"]

  - entity: Consignment
    initial_state: TENDERED
    terminal_states: [SETTLED, REJECTED, WITHDRAWN]
    transitions:
      - from: TENDERED
        to: ACCEPTED
        trigger: "POST /api/consignments/{id}/transitions {to: ACCEPTED}"
        actor: WoolPoolOperator
        preconditions: []
        side_effects: ["consignment_status := ACCEPTED; increments Consignment.version by 1"]
      - from: TENDERED
        to: REJECTED
        trigger: "POST /api/consignments/{id}/transitions {to: REJECTED}"
        actor: WoolPoolOperator
        preconditions: []
        side_effects:
          - "consignment_status := REJECTED; increments Consignment.version by 1"
          - "Cross-entity: lot returns CONSIGNED -> GRADED; increments WoolLot.version by 1"
      - from: ACCEPTED
        to: ADVANCED
        trigger: "POST /api/consignments/{id}/transitions {to: ADVANCED}"
        actor: WoolPoolOperator
        preconditions: []
        side_effects:
          - "consignment_status := ADVANCED; advance_cents := round_half_up(0.70 * lot.effective_value_cents) (calculations.consignment_advance); increments Consignment.version by 1"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /api/consignments/{id}/transitions {to: WITHDRAWN}"
        actor: RanchManager
        preconditions: []
        side_effects:
          - "consignment_status := WITHDRAWN; increments Consignment.version by 1"
          - "Cross-entity: lot returns CONSIGNED -> WITHDRAWN; increments WoolLot.version by 1"
      - from: ADVANCED
        to: WITHDRAWN
        trigger: "POST /api/consignments/{id}/transitions {to: WITHDRAWN}"
        actor: RanchManager
        preconditions: []
        side_effects:
          - "consignment_status := WITHDRAWN; clawback_cents := advance_cents (full clawback; compensating action for the advance invariant); increments Consignment.version by 1"
          - "Cross-entity: lot returns CONSIGNED -> WITHDRAWN; increments WoolLot.version by 1"
      - from: ADVANCED
        to: SOLD
        trigger: "POST /api/consignments/{id}/sell"
        actor: WoolPoolOperator
        preconditions: ["sale_gross_cents >= 0"]
        side_effects:
          - "consignment_status := SOLD; sale_gross_cents stored; increments Consignment.version by 1"
          - "Cross-entity: lot CONSIGNED -> SOLD; increments WoolLot.version by 1"
      - from: SOLD
        to: SETTLED
        trigger: "POST /api/consignments/{id}/transitions {to: SETTLED}"
        actor: WoolPoolOperator
        preconditions: []
        side_effects:
          - "consignment_status := SETTLED; pool_fee_cents and settlement_cents computed (calculations.pool_fee_tier + calculations.pool_settlement); increments Consignment.version by 1"
          - "Cross-entity: lot SOLD -> SETTLED; increments WoolLot.version by 1; recompute WoolClip.marketing_posture"

  - entity: LivestockSale
    initial_state: "payment_status=UNPAID, delivery_status=PENDING (parallel dimensions evolve independently)"
    terminal_states: ["delivery_status=DELIVERED", "delivery_status=CANCELLED"]
    transitions:
      - from: "payment: UNPAID"
        to: "payment: PAID"
        trigger: "POST /api/livestock-sales/{id}/record-payment"
        actor: RanchManager
        preconditions: ["delivery_status in {PENDING, LOADED} (not CANCELLED/DELIVERED)", "amount_cents == booked_price_cents (else ERR_PAYMENT_AMOUNT_MISMATCH)"]
        side_effects: ["payment_status := PAID; increments LivestockSale.version by 1"]
      - from: "payment: PAID"
        to: "payment: REFUNDED"
        trigger: "side effect of POST /api/livestock-sales/{id}/cancel"
        actor: system
        preconditions: []
        side_effects: ["payment_status := REFUNDED; compensation for the cancelled paid sale; increments LivestockSale.version by 1"]
      - from: "delivery: PENDING"
        to: "delivery: LOADED"
        trigger: "POST /api/livestock-sales/{id}/load"
        actor: RanchManager | RangeHand
        preconditions: ["payment_status == PAID (else ERR_SALE_UNPAID 409)"]
        side_effects: ["delivery_status := LOADED; increments LivestockSale.version by 1"]
      - from: "delivery: LOADED"
        to: "delivery: DELIVERED"
        trigger: "POST /api/livestock-sales/{id}/deliver"
        actor: RanchManager | RangeHand
        preconditions: ["MEAT: actual_total_weight_lbs present; BREEDING: actual_head_delivered present"]
        side_effects:
          - "delivery_status := DELIVERED; settled_price_cents := settled variant of calculations.sale_price; increments LivestockSale.version by 1"
          - "Cross-entity: recompute Flock.current_headcount (MEAT: -= head_count; BREEDING: -= actual_head_delivered) per calculations.flock_headcount_reconciliation; increments Flock.version by 1"
      - from: "delivery: PENDING"
        to: "delivery: CANCELLED"
        trigger: "POST /api/livestock-sales/{id}/cancel"
        actor: RanchManager
        preconditions: []
        side_effects:
          - "delivery_status := CANCELLED; if payment_status == PAID then payment_status := REFUNDED; increments LivestockSale.version by 1"

  - entity: LossReport
    initial_state: REPORTED
    terminal_states: [VERIFIED, DISMISSED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /api/loss-reports/{id}/transitions {to: UNDER_REVIEW}"
        actor: RanchManager
        preconditions: []
        side_effects: ["report_status := UNDER_REVIEW; reviewed_by_user_id := X-User-ID; increments LossReport.version by 1"]
      - from: UNDER_REVIEW
        to: VERIFIED
        trigger: "POST /api/loss-reports/{id}/transitions {to: VERIFIED}"
        actor: RanchManager
        preconditions: []
        side_effects:
          - "report_status := VERIFIED; increments LossReport.version by 1"
          - "Cascade link 1 -> Flock: recompute current_headcount (-= head_lost) per calculations.flock_headcount_reconciliation; increments Flock.version by 1"
          - "Cascade link 2 -> GrazingContract: every contract with contract.flock_id == this flock AND contract_status == ACTIVE AND min_head > new headcount: breach_flag := true; increments GrazingContract.version by 1"
          - "Cascade link 3 -> GrazingMove: every move whose contract_id is a newly breached contract AND move_status == PLANNED: move_status := CANCELLED; increments GrazingMove.version by 1"
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /api/loss-reports/{id}/transitions {to: DISMISSED}"
        actor: RanchManager
        preconditions: []
        side_effects: ["report_status := DISMISSED; increments LossReport.version by 1"]
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /api/loss-reports/{id}/transitions {to: DISMISSED}"
        actor: RanchManager
        preconditions: []
        side_effects: ["report_status := DISMISSED; increments LossReport.version by 1"]

  - entity: GrazingContract
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /api/grazing-contracts/{id}/transitions {to: PROPOSED}"
        actor: RanchManager
        preconditions: ["Flock.current_headcount >= min_head (else ERR_INSUFFICIENT_HEAD)"]
        side_effects: ["contract_status := PROPOSED; increments GrazingContract.version by 1"]
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /api/grazing-contracts/{id}/counter"
        actor: GrazingClient
        preconditions: ["OCC: expected_grazing_contract_version == GrazingContract.version (else ERR_STALE_CONTRACT_VERSION 412)"]
        side_effects:
          - "contract_status := COUNTERED; any supplied term fields (rate_per_head_day_cents, min_head, max_head, service_window_start, service_window_end) overwrite current terms; terms_version += 1; increments GrazingContract.version by 1"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /api/grazing-contracts/{id}/transitions {to: PROPOSED}"
        actor: RanchManager
        preconditions: []
        side_effects: ["contract_status := PROPOSED (ranch adopts the countered terms as the standing proposal); increments GrazingContract.version by 1"]
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /api/grazing-contracts/{id}/transitions {to: ACCEPTED}"
        actor: GrazingClient
        preconditions: []
        side_effects: ["contract_status := ACCEPTED; increments GrazingContract.version by 1"]
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /api/grazing-contracts/{id}/transitions {to: ACCEPTED}"
        actor: RanchManager
        preconditions: []
        side_effects: ["contract_status := ACCEPTED (ranch accepts the client's counter); increments GrazingContract.version by 1"]
      - from: ACCEPTED
        to: ACTIVE
        trigger: "POST /api/grazing-contracts/{id}/transitions {to: ACTIVE}"
        actor: RanchManager
        preconditions: ["logical clock >= service_window_start AND logical clock < service_window_end (else ERR_CONTRACT_WINDOW_CLOSED)"]
        side_effects: ["contract_status := ACTIVE; increments GrazingContract.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/grazing-contracts/{id}/complete"
        actor: RanchManager
        preconditions: ["logical clock >= service_window_end (else ERR_CONTRACT_WINDOW_CLOSED)", "0 <= achieved_cover_reduction_pct <= 100"]
        side_effects:
          - "contract_status := COMPLETED; head_days and invoice_cents computed per calculations.grazing_invoice; increments GrazingContract.version by 1"
          - "Cascade: every GrazingMove with contract_id == this contract and move_status == PLANNED -> CANCELLED; move_status == ACTIVE -> COMPLETED; increments GrazingMove.version by 1 each"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/grazing-contracts/{id}/transitions {to: CANCELLED}"
        actor: RanchManager | GrazingClient
        preconditions: []
        side_effects: ["contract_status := CANCELLED; increments GrazingContract.version by 1"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /api/grazing-contracts/{id}/transitions {to: CANCELLED}"
        actor: RanchManager | GrazingClient
        preconditions: []
        side_effects: ["contract_status := CANCELLED; increments GrazingContract.version by 1"]
      - from: COUNTERED
        to: CANCELLED
        trigger: "POST /api/grazing-contracts/{id}/transitions {to: CANCELLED}"
        actor: RanchManager | GrazingClient
        preconditions: []
        side_effects: ["contract_status := CANCELLED; increments GrazingContract.version by 1"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /api/grazing-contracts/{id}/transitions {to: CANCELLED}"
        actor: RanchManager | GrazingClient
        preconditions: []
        side_effects: ["contract_status := CANCELLED; increments GrazingContract.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: lot-regrade-stale-version
    parent_entity: WoolLot
    write_endpoint: "POST /api/wool-lots/{id}/regrade"
    occ_field: expected_wool_lot_version
    description: |
      Recording a regrade against a WoolLot whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has already regraded the lot (superseding the grade the client based
      its estimate on); the current writer's view of the lot is therefore stale.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
  - rule_id: contract-counter-stale-version
    parent_entity: GrazingContract
    write_endpoint: "POST /api/grazing-contracts/{id}/counter"
    occ_field: expected_grazing_contract_version
    description: |
      Counter-offering a GrazingContract whose version has advanced since the
      client last observed it is rejected. This captures the case where the ranch
      re-proposed terms (COUNTERED -> PROPOSED) after the client read the contract;
      a counter based on the client's stale terms view is therefore refused even
      though the contract is again in PROPOSED.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: flock_headcount_reconciliation
    trigger: "On read of Flock and after every BirthRecord create, LossReport -> VERIFIED, LivestockSale -> DELIVERED"
    algorithm: chronological
    formula: |
      current_headcount = baseline_headcount
        + SUM(BirthRecord.born_alive) over all BirthRecords whose season's flock_id == this flock
        - SUM(LossReport.head_lost) over LossReports of this flock with report_status == VERIFIED
        - SUM(s.head_count) over LivestockSales of this flock with delivery_status == DELIVERED and sale_type == MEAT
        - SUM(s.actual_head_delivered) over LivestockSales of this flock with delivery_status == DELIVERED and sale_type == BREEDING
    input_set: "All BirthRecords of the flock's seasons regardless of season status; only VERIFIED LossReports; only DELIVERED LivestockSales"
    precision: "integer head"
    variants:
      - name: projected_headcount
        when: "not exposed as a stored field; documented for PRD completeness — reports may project by adding PENDING sales"
        difference: "projected subtracts sales in delivery_status {PENDING, LOADED} as well; never stored"

  - name: lambing_rate
    trigger: "After every BirthRecord creation under the season"
    algorithm: aggregation
    formula: |
      total_born       = SUM(BirthRecord.births_reported) over the season's records
      total_born_alive = SUM(BirthRecord.born_alive) over the season's records
      lambing_rate_pct = round_half_up(total_born_alive / ewes_bred * 100, 1)
    input_set: "All BirthRecords whose season_id == this season, in any order (sum is order-insensitive)"
    precision: "1 decimal place, round_half_up"

  - name: withdrawal_window
    trigger: "After every ParasiteTreatment creation; evaluated on MEAT LivestockSale creation"
    algorithm: threshold
    formula: |
      per treatment: withdrawal_until = treatment_date + withdrawal_days (calendar days)
      Flock.withdrawal_until = MAX(withdrawal_until) over the flock's treatments
        where withdrawal_until > logical clock; null when no such treatment
      MEAT sale gate: scheduled_date >= flock.withdrawal_until, else ERR_WITHDRAWAL_ACTIVE
      Boundary: scheduled_date == withdrawal_until is ALLOWED (>= comparison)
    input_set: "All ParasiteTreatments of the flock; treatments whose withdrawal has already passed do not extend the gate"
    precision: "datetime to the second"

  - name: treatment_efficacy
    trigger: "POST /api/parasite-treatments/{id}/follow-up"
    algorithm: aggregation
    formula: |
      efficacy_pct = round_half_up((fecal_egg_count_before - fecal_egg_count_after)
                                   / fecal_egg_count_before * 100, 1)
      when fecal_egg_count_before == 0 -> efficacy_pct := null
      resistance_flag = (efficacy_pct != null AND efficacy_pct < 80.0)
      Boundary: efficacy_pct == 80.0 exactly -> resistance_flag = false (strict <)
    input_set: "The single ParasiteTreatment row"
    constants: { RESISTANCE_THRESHOLD_PCT: 80.0 }
    precision: "1 decimal place, round_half_up"

  - name: wool_grade_classify
    trigger: "POST /api/wool-lots/{id}/grade, POST /api/wool-lots/{id}/regrade, CoreTest -> LOCKED"
    algorithm: threshold
    formula: |
      m = effective_micron
      m < 19.5            -> SUPERFINE
      19.5 <= m < 21.5    -> FINE
      21.5 <= m < 24.5    -> MEDIUM
      24.5 <= m < 27.5    -> STRONG
      m >= 27.5           -> COARSE
      Boundary: lower bounds are INCLUSIVE — m == 19.5 -> FINE, m == 27.5 -> COARSE
    input_set: "The single WoolLot's effective_micron (certified if a LOCKED CoreTest exists, else estimated)"
    constants:
      SUPERFINE_MAX_EXCL: 19.5
      FINE_MAX_EXCL: 21.5
      MEDIUM_MAX_EXCL: 24.5
      STRONG_MAX_EXCL: 27.5
    precision: "micron given to 2 decimals"

  - name: lot_value
    trigger: "grade / regrade (provisional recompute); CoreTest -> LOCKED (certified compute)"
    algorithm: tiered_pricing
    formula: |
      provisional variant:
        provisional_value_cents = round_half_up(weight_lbs * GREASY_PRICE_CENTS[grade_code])
        (grade from estimated_micron; price is per GREASY lb)
      certified variant:
        clean_lbs = weight_lbs * certified_yield_pct / 100          (full precision intermediate)
        certified_value_cents = round_half_up(clean_lbs * CLEAN_PRICE_CENTS[grade_code])
        (grade from certified_micron; price is per CLEAN lb)
      effective_value_cents = certified_value_cents if not null else provisional_value_cents
    input_set: "The single WoolLot"
    constants:
      GREASY_PRICE_CENTS: { SUPERFINE: 380, FINE: 330, MEDIUM: 260, STRONG: 190, COARSE: 120 }
      CLEAN_PRICE_CENTS:  { SUPERFINE: 720, FINE: 640, MEDIUM: 520, STRONG: 400, COARSE: 280 }
    precision: "integer cents, round_half_up; intermediate clean_lbs NOT rounded before multiplying"
    variants:
      - name: provisional
        when: "No LOCKED CoreTest for the lot"
        difference: "greasy-weight based price table; used for advances and pre-certification reads"
      - name: certified
        when: "A CoreTest is LOCKED for the lot"
        difference: "clean-weight based price table; supersedes provisional and re-prices open consignments"

  - name: consignment_advance
    trigger: "Consignment ACCEPTED -> ADVANCED"
    algorithm: threshold
    formula: |
      advance_cents = round_half_up(0.70 * lot.effective_value_cents)
      effective value is certified when a LOCKED CoreTest exists at advance time, else provisional
    input_set: "The Consignment and its WoolLot"
    constants: { ADVANCE_RATE: 0.70 }
    precision: "integer cents, round_half_up"

  - name: pool_fee_tier
    trigger: "Consignment SOLD -> SETTLED"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is PINNED (circular-looking because the lot's own weight feeds its tier):
      (1) total_consigned_lbs = SUM(lot.weight_lbs) over every Consignment with the same pool_ref
          whose consignment_status is in {ACCEPTED, ADVANCED, SOLD, SETTLED}, INCLUDING this lot
      (2) tier = 6.5% if total_consigned_lbs < 10000
                 5.0% if 10000 <= total_consigned_lbs < 25000
                 4.0% if total_consigned_lbs >= 25000
          Boundary: total == 10000 exactly -> 5.0% (lower bound inclusive)
      (3) pool_fee_cents = round_half_up(sale_gross_cents * tier / 100)
    input_set: "All Consignments with the same pool_ref in non-rejected, non-withdrawn statuses {ACCEPTED, ADVANCED, SOLD, SETTLED}"
    constants:
      TIER1_MAX_LBS_EXCL: 10000
      TIER2_MAX_LBS_EXCL: 25000
      TIER1_PCT: 6.5
      TIER2_PCT: 5.0
      TIER3_PCT: 4.0
    precision: "integer cents, round_half_up"

  - name: pool_settlement
    trigger: "Consignment SOLD -> SETTLED (per-lot); GET /api/pool-statements/{pool_ref} (aggregate)"
    algorithm: waterfall_allocation
    formula: |
      Rounding order is PINNED (round per lot, then sum — never sum-then-round):
      per lot at settlement:
        pool_fee_cents  = pool_fee_tier result (integer cents, already rounded)
        settlement_cents = sale_gross_cents - pool_fee_cents - advance_cents   (integer math; may be negative)
      pool statement (computed read over pool_ref):
        consignment_count       = count of Consignments with this pool_ref in status SETTLED
        total_sale_gross_cents  = SUM(sale_gross_cents) over those SETTLED consignments
        total_pool_fee_cents    = SUM(pool_fee_cents)    over those SETTLED consignments
        total_advance_cents     = SUM(advance_cents)     over those SETTLED consignments
        total_settlement_cents  = SUM(settlement_cents)  over those SETTLED consignments
      Unknown pool_ref (no consignments at all) -> ERR_NOT_FOUND
    input_set: "Per lot: the single Consignment. Statement: only SETTLED Consignments of the pool_ref"
    precision: "integer cents; per-lot values rounded first, then summed"

  - name: sale_price
    trigger: "LivestockSale creation (booked variant); deliver (settled variant)"
    algorithm: tiered_pricing
    formula: |
      MEAT:
        shrink_factor = (1 - shrink_pct / 100) when channel == DIRECT, else 1
        booked:  gross_cents = round_half_up(head_count * avg_weight_lbs * shrink_factor * base_price_per_cwt_cents / 100)
        settled: gross_cents = round_half_up(actual_total_weight_lbs * shrink_factor * base_price_per_cwt_cents / 100)
        premium (ETHNIC_MARKET only; else 0):
          window = calculations.holiday_premium_selection result for scheduled_date
          premium_pct_applied = window.premium_pct when head_count >= window.min_head, else window.premium_pct / 2
          premium_cents = round_half_up(gross_cents * premium_pct_applied / 100)
        commission (AUCTION only; else 0):
          commission_cents = MIN(round_half_up(gross_cents * 3.5 / 100), 15000)
        price_cents = gross_cents + premium_cents - commission_cents
      BREEDING:
        booked:  price_cents = head_count * per_head_price_cents
        settled: price_cents = actual_head_delivered * per_head_price_cents
        (no shrink, premium, or commission)
      Evaluation order is PINNED: gross -> premium (uses window selection) -> commission -> total
    input_set: "The LivestockSale plus HolidayWindows for premium selection"
    constants:
      AUCTION_COMMISSION_PCT: 3.5
      AUCTION_COMMISSION_CAP_CENTS: 15000
    precision: "integer cents, round_half_up"
    variants:
      - name: booked
        when: "Computed at creation from offered head_count and avg_weight_lbs"
        difference: "stored in booked_price_cents; payment must match this amount"
      - name: settled
        when: "Computed at DELIVERED from actual scale weight (MEAT) or actual head (BREEDING)"
        difference: "stored in settled_price_cents; diverges from booked whenever actuals differ"

  - name: holiday_premium_selection
    trigger: "sale_price premium step for channel == ETHNIC_MARKET"
    algorithm: forward_looking
    formula: |
      eligibility: HolidayWindows with window_start <= scheduled_date < window_end (half-open)
      ranking: highest premium_pct first
      tie-break: earliest window_start, then earliest created_at
      fallback: when the eligible set is empty, premium_pct_applied = 0 and applied_holiday_name = null
    input_set: "All HolidayWindows"
    precision: "premium_pct to 2 decimals"

  - name: grazing_invoice
    trigger: "POST /api/grazing-contracts/{id}/complete"
    algorithm: chronological
    formula: |
      (1) head_days = SUM over the contract's GrazingMoves with move_status == COMPLETED:
            head_count * overlap_days
          where overlap_days = whole calendar days in
            [MAX(move_start, service_window_start), MIN(move_end, service_window_end))
          (half-open; a move entirely outside the window contributes 0)
      (2) gross_cents = head_days * rate_per_head_day_cents
      (3) bonus_cents  = MIN(round_half_up(0.10 * gross_cents), 250000)
                         when achieved_cover_reduction_pct >= target_cover_reduction_pct, else 0
          Boundary: achieved == target exactly -> bonus applies (>= comparison)
      (4) penalty_cents = round_half_up(0.20 * gross_cents) when breach_flag, else 0
      (5) invoice_cents = gross_cents + bonus_cents - penalty_cents
      Evaluation order is PINNED as numbered.
    input_set: "The contract's GrazingMoves with move_status == COMPLETED only (PLANNED/CANCELLED excluded)"
    constants:
      BONUS_PCT: 0.10
      BONUS_CAP_CENTS: 250000
      BREACH_PENALTY_PCT: 0.20
    precision: "integer cents, round_half_up"

  - name: pasture_occupancy
    trigger: "GrazingMove PLANNED -> ACTIVE or ACTIVE -> COMPLETED on an own-ranch (pasture_id) move; computed on Pasture read"
    algorithm: aggregation
    formula: |
      occupied_head_count = SUM(GrazingMove.head_count) over moves with
        pasture_id == this pasture AND move_status == ACTIVE
      pasture_status:
        OCCUPIED  when occupied_head_count > 0
        RESTING   when occupied_head_count == 0 AND at least one COMPLETED move exists
                  AND logical clock < (that move's move_end + rest_days) using the
                  most recently completed move (latest move_end; ties broken by latest updated_at)
        AVAILABLE otherwise
      Compensating invariant: a start followed by its complete returns
      occupied_head_count to the pre-start value.
    input_set: "GrazingMoves of this pasture with move_status == ACTIVE (occupancy) or == COMPLETED (rest window)"
    precision: "integer head"

  - name: clip_weight_reconciliation
    trigger: "WoolLot create / grade / delete; shearing complete (initializes)"
    algorithm: aggregation
    formula: |
      allocated_weight_lbs   = SUM(WoolLot.weight_lbs) over the clip's lots
      unallocated_weight_lbs = greasy_weight_lbs - skirtings_weight_lbs - allocated_weight_lbs
      clip_value_cents       = SUM(WoolLot.effective_value_cents) over the clip's lots
      marketing_posture per the enum rules on WoolClip.marketing_posture
    input_set: "All WoolLots of the clip"
    precision: "weights to 2 decimals; value integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Request shape: required fields present, enum values valid, numeric ranges valid (weight_lbs > 0, acres > 0, head_count >= 1, ewes_bred >= 1, 0 <= pct <= 100), date ordering (start < end), conditional field shape (MEAT requires avg_weight_lbs + base_price_per_cwt_cents and forbids per_head_price_cents; BREEDING the inverse; GrazingMove carries exactly one of pasture_id / contract_id)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "Path ids resolve left-to-right; then body FK references (flock_id, season_id, clip_id, lot_id, pasture_id, contract_id, crew_id) resolve to existing rows"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "Flock is ACTIVE when creating child records (seasons, moves, treatments, shearing events, lots via clip, sales, loss reports, contracts) or recording births"
    error_id: ERR_FLOCK_RETIRED
    http_status: 409
    applies_to: "child-creation endpoints under a flock"
  - priority: 6
    category: state
    check: "Machine from-state permits the requested transition (per §1.2); also: crew ACTIVE when scheduling (ERR_CREW_INACTIVE); sale payment_status == PAID when loading (ERR_SALE_UNPAID); flock has no busy children when retiring (ERR_FLOCK_BUSY)"
    error_id: ERR_SEASON_INVALID_STATE | ERR_MOVE_INVALID_STATE | ERR_SHEARING_INVALID_STATE | ERR_LOT_INVALID_STATE | ERR_CORE_TEST_INVALID_STATE | ERR_CONSIGNMENT_INVALID_STATE | ERR_SALE_INVALID_STATE | ERR_REPORT_INVALID_STATE | ERR_CONTRACT_INVALID_STATE | ERR_CREW_INACTIVE | ERR_SALE_UNPAID | ERR_FLOCK_BUSY
    http_status: 409
    applies_to: "all transition / action endpoints"
  - priority: 7
    category: business_safety
    check: "MEAT LivestockSale: scheduled_date >= flock.withdrawal_until when withdrawal_until is not null"
    error_id: ERR_WITHDRAWAL_ACTIVE
    http_status: 422
    applies_to: "POST /api/livestock-sales"
  - priority: 8
    category: business_safety
    check: "CoreTest lock: X-User-ID != submitted_by_user_id (segregation of duties)"
    error_id: ERR_CORE_TEST_SOD
    http_status: 403
    applies_to: "POST /api/core-tests/{id}/transitions {to: LOCKED}"
  - priority: 9
    category: business_temporal
    check: "Season clock gates: GESTATION requires clock >= breeding_end_date; LAMBING requires clock >= expected_lambing_start; WEANING requires clock >= expected_lambing_start + 45 days"
    error_id: ERR_SEASON_TOO_EARLY
    http_status: 422
    applies_to: "POST /api/breeding-seasons/{id}/transitions"
  - priority: 10
    category: business_temporal
    check: "BirthRecord.birth_date inside [expected_lambing_start, expected_lambing_start + 45 days]"
    error_id: ERR_BIRTH_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /api/birth-records"
  - priority: 11
    category: business_temporal
    check: "Pasture overlap (half-open, adjacency allowed): new own-ranch GrazingMove rejected when another move on the same pasture with move_status in {PLANNED, ACTIVE} has move_start < new_end AND new_start < move_end"
    error_id: ERR_PASTURE_OVERLAP
    http_status: 409
    applies_to: "POST /api/grazing-moves"
  - priority: 12
    category: business_temporal
    check: "Crew overlap with 24h sanitation buffer (adjacency FORBIDDEN): new ShearingEvent rejected when another event on the same crew with shearing_status in {SCHEDULED, IN_PROGRESS} fails both gap tests: NOT(new_start >= other_end + 24h OR new_end + 24h <= other_start)"
    error_id: ERR_CREW_OVERLAP
    http_status: 409
    applies_to: "POST /api/shearing-events"
  - priority: 13
    category: business_temporal
    check: "Shearing window feasibility: whole calendar days in [scheduled_start, scheduled_end) * crew.head_per_day_capacity >= expected_head"
    error_id: ERR_SHEARING_WINDOW_INFEASIBLE
    http_status: 422
    applies_to: "POST /api/shearing-events"
  - priority: 14
    category: business_temporal
    check: "Contract window gates: ACTIVE requires clock inside [service_window_start, service_window_end); complete requires clock >= service_window_end"
    error_id: ERR_CONTRACT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /api/grazing-contracts/{id}/transitions {to: ACTIVE}, POST /api/grazing-contracts/{id}/complete"
  - priority: 15
    category: business_constraint
    check: "One open BreedingSeason per flock: creating a season while another of the same flock is in {PLANNED, BREEDING, GESTATION, LAMBING, WEANING}"
    error_id: ERR_OPEN_SEASON_EXISTS
    http_status: 409
    applies_to: "POST /api/breeding-seasons"
  - priority: 16
    category: business_constraint
    check: "One open CoreTest per lot: creating a test while another of the same lot is in {SUBMITTED, RESULTED, LOCKED}; also blocks create when lot_status not in {GRADED, CONSIGNED}"
    error_id: ERR_DUPLICATE_ACTIVE_TEST | ERR_LOT_INVALID_STATE
    http_status: 409
    applies_to: "POST /api/core-tests"
  - priority: 17
    category: business_constraint
    check: "One open Consignment per lot: creating a consignment while another of the same lot is in {TENDERED, ACCEPTED, ADVANCED, SOLD}"
    error_id: ERR_CONSIGNMENT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /api/consignments"
  - priority: 18
    category: business_constraint
    check: "WoolLot weight allocation: weight_lbs <= clip.unallocated_weight_lbs at creation (exact equality allowed — fully allocates the clip)"
    error_id: ERR_WEIGHT_OVER_ALLOCATED
    http_status: 422
    applies_to: "POST /api/wool-lots"
  - priority: 19
    category: business_constraint
    check: "Pasture capacity: own-ranch GrazingMove head_count <= pasture.carrying_capacity_head"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /api/grazing-moves"
  - priority: 20
    category: business_constraint
    check: "Contract move head range at activation: contract.min_head <= head_count <= contract.max_head"
    error_id: ERR_HEAD_OUT_OF_CONTRACT_RANGE
    http_status: 422
    applies_to: "POST /api/grazing-moves/{id}/transitions {to: ACTIVE}"
  - priority: 21
    category: business_constraint
    check: "BirthRecord arithmetic: births_reported == born_alive + born_dead"
    error_id: ERR_BIRTH_COUNT_MISMATCH
    http_status: 422
    applies_to: "POST /api/birth-records"
  - priority: 22
    category: business_fiscal
    check: "Head sufficiency: LivestockSale.head_count <= flock.current_headcount at creation; LossReport.head_lost <= flock.current_headcount; GrazingMove activation head_count <= flock.current_headcount; contract propose requires flock.current_headcount >= min_head"
    error_id: ERR_INSUFFICIENT_HEAD
    http_status: 422
    applies_to: "POST /api/livestock-sales, POST /api/loss-reports, POST /api/grazing-moves/{id}/transitions, POST /api/grazing-contracts/{id}/transitions {to: PROPOSED}"
  - priority: 23
    category: business_fiscal
    check: "record-payment amount_cents == booked_price_cents"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /api/livestock-sales/{id}/record-payment"
  - priority: 24
    category: state
    check: "OCC: expected_wool_lot_version == WoolLot.version; expected_grazing_contract_version == GrazingContract.version"
    error_id: ERR_STALE_LOT_VERSION | ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /api/wool-lots/{id}/regrade, POST /api/grazing-contracts/{id}/counter"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/api/flocks", description: "Create a flock with its baseline headcount", roles: [RanchManager], code: 201, input: [flock_name, species, baseline_headcount, "guardian_dog_count?"], output: Flock, side_effects: ["current_headcount initialized to baseline_headcount"] }
  - { method: GET, path: "/api/flocks", description: "List flocks with pagination and optional filters", roles: [RanchManager, RangeHand, WoolPoolOperator, GrazingClient], code: 200, input: ["limit?", "offset?", "species?", "flock_status?"], output: "Flock[]", side_effects: [] }
  - { method: GET, path: "/api/flocks/{id}", description: "Read one flock including computed current_headcount and withdrawal_until", roles: [RanchManager, RangeHand, WoolPoolOperator, GrazingClient], code: 200, input: [], output: Flock, side_effects: [] }
  - { method: POST, path: "/api/flocks/{id}/retire", description: "Retire a flock once it has no busy children (ERR_FLOCK_BUSY otherwise)", roles: [RanchManager], code: 200, input: [], output: Flock, side_effects: ["Flock ACTIVE -> RETIRED"] }

  - { method: POST, path: "/api/breeding-seasons", description: "Open a breeding/lambing season for a flock (one open season per flock)", roles: [RanchManager], code: 201, input: [flock_id, season_label, ewes_bred, breeding_start_date, breeding_end_date], output: BreedingSeason, side_effects: ["expected_lambing_start computed"] }
  - { method: GET, path: "/api/breeding-seasons", description: "List seasons; flock_id filter is the FK reverse-reachability channel", roles: [RanchManager, RangeHand], code: 200, input: ["limit?", "offset?", "flock_id?", "season_status?"], output: "BreedingSeason[]", side_effects: [] }
  - { method: GET, path: "/api/breeding-seasons/{id}", description: "Read one season including computed totals and lambing_rate_pct", roles: [RanchManager, RangeHand], code: 200, input: [], output: BreedingSeason, side_effects: [] }
  - { method: POST, path: "/api/breeding-seasons/{id}/transitions", description: "Advance/cancel the season: to in {BREEDING, GESTATION, LAMBING, WEANING, CLOSED, CANCELLED}", roles: [RanchManager], code: 200, input: [to], output: BreedingSeason, side_effects: ["season transition per §1.2; increments BreedingSeason.version by 1"] }

  - { method: POST, path: "/api/birth-records", description: "Log a lambing/kidding batch against a LAMBING season", roles: [RanchManager, RangeHand], code: 201, input: [season_id, birth_date, births_reported, born_alive, born_dead], output: BirthRecord, side_effects: ["recompute season totals + lambing_rate_pct", "recompute Flock.current_headcount"] }
  - { method: GET, path: "/api/birth-records", description: "List birth records; season_id filter is the FK reverse-reachability channel", roles: [RanchManager, RangeHand], code: 200, input: ["limit?", "offset?", "season_id?"], output: "BirthRecord[]", side_effects: [] }
  - { method: GET, path: "/api/birth-records/{id}", description: "Read one birth record", roles: [RanchManager, RangeHand], code: 200, input: [], output: BirthRecord, side_effects: [] }

  - { method: POST, path: "/api/pastures", description: "Create a pasture with carrying capacity", roles: [RanchManager], code: 201, input: [pasture_name, acres, carrying_capacity_head, "rest_days?"], output: Pasture, side_effects: [] }
  - { method: GET, path: "/api/pastures/{id}", description: "Read one pasture including occupied_head_count and pasture_status", roles: [RanchManager, RangeHand], code: 200, input: [], output: Pasture, side_effects: [] }

  - { method: POST, path: "/api/grazing-moves", description: "Plan a rotation move (own-ranch: pasture_id; contract grazing: contract_id)", roles: [RanchManager, RangeHand], code: 201, input: [flock_id, "pasture_id?", "contract_id?", move_start, move_end, head_count], output: GrazingMove, side_effects: ["pasture overlap check (own-ranch)", "capacity check (own-ranch)"] }
  - { method: GET, path: "/api/grazing-moves", description: "List moves; flock_id/pasture_id/contract_id filters are the FK reverse-reachability channels", roles: [RanchManager, RangeHand, GrazingClient], code: 200, input: ["limit?", "offset?", "flock_id?", "pasture_id?", "contract_id?", "move_status?"], output: "GrazingMove[]", side_effects: [] }
  - { method: GET, path: "/api/grazing-moves/{id}", description: "Read one move", roles: [RanchManager, RangeHand, GrazingClient], code: 200, input: [], output: GrazingMove, side_effects: [] }
  - { method: POST, path: "/api/grazing-moves/{id}/transitions", description: "Move lifecycle: to in {ACTIVE, COMPLETED, CANCELLED}", roles: [RanchManager, RangeHand], code: 200, input: [to], output: GrazingMove, side_effects: ["move transition per §1.2; recompute pasture occupancy; increments GrazingMove.version by 1"] }

  - { method: POST, path: "/api/parasite-treatments", description: "Record a deworming treatment with withdrawal days and pre-treatment EPG", roles: [RanchManager, RangeHand], code: 201, input: [flock_id, product_name, treatment_date, withdrawal_days, fecal_egg_count_before], output: ParasiteTreatment, side_effects: ["withdrawal_until computed", "Flock.withdrawal_until recomputed"] }
  - { method: GET, path: "/api/parasite-treatments", description: "List treatments; flock_id filter is the FK reverse-reachability channel", roles: [RanchManager, RangeHand], code: 200, input: ["limit?", "offset?", "flock_id?"], output: "ParasiteTreatment[]", side_effects: [] }
  - { method: GET, path: "/api/parasite-treatments/{id}", description: "Read one treatment including computed withdrawal_until, efficacy_pct, resistance_flag", roles: [RanchManager, RangeHand], code: 200, input: [], output: ParasiteTreatment, side_effects: [] }
  - { method: POST, path: "/api/parasite-treatments/{id}/follow-up", description: "Post the 14-day follow-up EPG; computes efficacy_pct and resistance_flag", roles: [RanchManager, RangeHand], code: 200, input: [fecal_egg_count_after], output: ParasiteTreatment, side_effects: ["treatment_efficacy computed; increments ParasiteTreatment.version by 1"] }

  - { method: POST, path: "/api/shearing-crews", description: "Register a shearing crew", roles: [RanchManager], code: 201, input: [crew_name, head_per_day_capacity, daily_rate_cents], output: ShearingCrew, side_effects: [] }
  - { method: GET, path: "/api/shearing-crews/{id}", description: "Read one crew", roles: [RanchManager, RangeHand], code: 200, input: [], output: ShearingCrew, side_effects: [] }
  - { method: POST, path: "/api/shearing-crews/{id}/deactivate", description: "Take a crew off the board (blocked while booked)", roles: [RanchManager], code: 200, input: [], output: ShearingCrew, side_effects: ["ShearingCrew ACTIVE -> INACTIVE"] }

  - { method: POST, path: "/api/shearing-events", description: "Book a shearing window for a flock with a crew (24h buffer overlap rule)", roles: [RanchManager], code: 201, input: [flock_id, crew_id, scheduled_start, scheduled_end, expected_head], output: ShearingEvent, side_effects: ["crew overlap + feasibility checks"] }
  - { method: GET, path: "/api/shearing-events", description: "List shearing events; flock_id/crew_id filters are the FK reverse-reachability channels", roles: [RanchManager, RangeHand], code: 200, input: ["limit?", "offset?", "flock_id?", "crew_id?", "shearing_status?"], output: "ShearingEvent[]", side_effects: [] }
  - { method: GET, path: "/api/shearing-events/{id}", description: "Read one shearing event", roles: [RanchManager, RangeHand], code: 200, input: [], output: ShearingEvent, side_effects: [] }
  - { method: POST, path: "/api/shearing-events/{id}/transitions", description: "Shearing lifecycle: to in {IN_PROGRESS, CANCELLED}", roles: [RanchManager, RangeHand], code: 200, input: [to], output: ShearingEvent, side_effects: ["shearing transition per §1.2; increments ShearingEvent.version by 1"] }
  - { method: POST, path: "/api/shearing-events/{id}/complete", description: "Complete the shearing with tallies; cascade-creates the WoolClip", roles: [RanchManager, RangeHand], code: 200, input: [shorn_head_count, greasy_weight_lbs, skirtings_weight_lbs], output: ShearingEvent, side_effects: ["ShearingEvent IN_PROGRESS -> COMPLETED", "creates WoolClip 1:1"] }

  - { method: GET, path: "/api/wool-clips", description: "List clips; flock_id/shearing_event_id filters are the FK reverse-reachability channels (1:1 clip by event returns an array of length 0 or 1)", roles: [RanchManager, RangeHand, WoolPoolOperator], code: 200, input: ["limit?", "offset?", "flock_id?", "shearing_event_id?"], output: "WoolClip[]", side_effects: [] }
  - { method: GET, path: "/api/wool-clips/{id}", description: "Read one clip including weight reconciliation and marketing_posture", roles: [RanchManager, RangeHand, WoolPoolOperator], code: 200, input: [], output: WoolClip, side_effects: [] }

  - { method: POST, path: "/api/wool-lots", description: "Bale a lot off a clip (weight allocation check)", roles: [RanchManager], code: 201, input: [clip_id, lot_code, weight_lbs], output: WoolLot, side_effects: ["recompute clip_weight_reconciliation"] }
  - { method: GET, path: "/api/wool-lots", description: "List lots; clip_id filter is the FK reverse-reachability channel", roles: [RanchManager, RangeHand, WoolPoolOperator], code: 200, input: ["limit?", "offset?", "clip_id?", "lot_status?"], output: "WoolLot[]", side_effects: [] }
  - { method: GET, path: "/api/wool-lots/{id}", description: "Read one lot including grade and value fields", roles: [RanchManager, RangeHand, WoolPoolOperator], code: 200, input: [], output: WoolLot, side_effects: [] }
  - { method: POST, path: "/api/wool-lots/{id}/grade", description: "Grade a DRAFT lot (DRAFT -> GRADED)", roles: [RanchManager], code: 200, input: [estimated_micron], output: WoolLot, side_effects: ["wool_grade_classify", "lot_value provisional", "increments WoolLot.version by 1"] }
  - { method: POST, path: "/api/wool-lots/{id}/transitions", description: "Lot lifecycle: to in {REGRADING}", roles: [RanchManager], code: 200, input: [to], output: WoolLot, side_effects: ["lot transition per §1.2; increments WoolLot.version by 1"] }
  - { method: POST, path: "/api/wool-lots/{id}/regrade", description: "Record the regrade (REGRADING -> GRADED); OCC-guarded", roles: [RanchManager], code: 200, input: [estimated_micron, expected_wool_lot_version], output: WoolLot, side_effects: ["wool_grade_classify", "lot_value provisional", "increments WoolLot.version by 1"] }
  - { method: DELETE, path: "/api/wool-lots/{id}", description: "Delete a DRAFT lot; releases its weight allocation (compensating action)", roles: [RanchManager], code: 204, input: [], output: null, side_effects: ["recompute clip_weight_reconciliation"] }

  - { method: POST, path: "/api/core-tests", description: "Submit a core-sample test for a GRADED or CONSIGNED lot", roles: [WoolPoolOperator], code: 201, input: [lot_id, lab_ref], output: CoreTest, side_effects: ["submitted_by_user_id := X-User-ID"] }
  - { method: GET, path: "/api/core-tests", description: "List core tests; lot_id filter is the FK reverse-reachability channel", roles: [RanchManager, WoolPoolOperator], code: 200, input: ["limit?", "offset?", "lot_id?", "test_status?"], output: "CoreTest[]", side_effects: [] }
  - { method: GET, path: "/api/core-tests/{id}", description: "Read one core test", roles: [RanchManager, WoolPoolOperator], code: 200, input: [], output: CoreTest, side_effects: [] }
  - { method: POST, path: "/api/core-tests/{id}/results", description: "Post lab results (SUBMITTED -> RESULTED)", roles: [WoolPoolOperator], code: 200, input: [measured_micron, clean_yield_pct, vegetable_matter_pct], output: CoreTest, side_effects: ["CoreTest SUBMITTED -> RESULTED"] }
  - { method: POST, path: "/api/core-tests/{id}/transitions", description: "Test disposition: to in {LOCKED, REJECTED}; LOCK enforces SoD and fires the repricing cascade", roles: [RanchManager], code: 200, input: [to], output: CoreTest, side_effects: ["CoreTest transition per §1.2; LOCK cascades to WoolLot and open Consignment; increments CoreTest.version by 1"] }

  - { method: POST, path: "/api/consignments", description: "Tender a GRADED or WITHDRAWN lot to a wool pool", roles: [RanchManager], code: 201, input: [lot_id, pool_ref], output: Consignment, side_effects: ["lot -> CONSIGNED"] }
  - { method: GET, path: "/api/consignments", description: "List consignments; lot_id/pool_ref filters are the FK reverse-reachability channels", roles: [RanchManager, WoolPoolOperator], code: 200, input: ["limit?", "offset?", "lot_id?", "pool_ref?", "consignment_status?"], output: "Consignment[]", side_effects: [] }
  - { method: GET, path: "/api/consignments/{id}", description: "Read one consignment", roles: [RanchManager, WoolPoolOperator], code: 200, input: [], output: Consignment, side_effects: [] }
  - { method: POST, path: "/api/consignments/{id}/transitions", description: "Consignment lifecycle: to in {ACCEPTED, REJECTED, ADVANCED, WITHDRAWN, SETTLED}; actor per §1.2", roles: [RanchManager, WoolPoolOperator], code: 200, input: [to], output: Consignment, side_effects: ["consignment transition per §1.2; advance/fee/settlement computations; increments Consignment.version by 1"] }
  - { method: POST, path: "/api/consignments/{id}/sell", description: "Record the pool sale gross for an ADVANCED consignment (-> SOLD)", roles: [WoolPoolOperator], code: 200, input: [sale_gross_cents], output: Consignment, side_effects: ["Consignment ADVANCED -> SOLD", "lot -> SOLD"] }
  - { method: GET, path: "/api/pool-statements/{pool_ref}", description: "Computed pool statement: per-lot rounded settlements summed (never sum-then-round)", roles: [RanchManager, WoolPoolOperator], code: 200, input: [], output: { pool_ref: string, consignment_count: integer, total_sale_gross_cents: integer, total_pool_fee_cents: integer, total_advance_cents: integer, total_settlement_cents: integer }, side_effects: [] }

  - { method: POST, path: "/api/holiday-windows", description: "Publish an ethnic-holiday premium window for the meat channel", roles: [RanchManager], code: 201, input: [holiday_name, window_start, window_end, premium_pct, min_head], output: HolidayWindow, side_effects: [] }

  - { method: POST, path: "/api/livestock-sales", description: "Book a meat or breeding-stock sale; computes booked_price_cents per sale_price", roles: [RanchManager], code: 201, input: [flock_id, sale_type, channel, head_count, "avg_weight_lbs?", "base_price_per_cwt_cents?", "per_head_price_cents?", "shrink_pct?", scheduled_date], output: LivestockSale, side_effects: ["sale_price booked variant", "holiday_premium_selection"] }
  - { method: GET, path: "/api/livestock-sales", description: "List sales; flock_id filter is the FK reverse-reachability channel", roles: [RanchManager, RangeHand], code: 200, input: ["limit?", "offset?", "flock_id?", "delivery_status?"], output: "LivestockSale[]", side_effects: [] }
  - { method: GET, path: "/api/livestock-sales/{id}", description: "Read one sale (both state dimensions and price fields)", roles: [RanchManager, RangeHand], code: 200, input: [], output: LivestockSale, side_effects: [] }
  - { method: POST, path: "/api/livestock-sales/{id}/record-payment", description: "Record full payment of booked_price_cents (payment UNPAID -> PAID)", roles: [RanchManager], code: 200, input: [amount_cents], output: LivestockSale, side_effects: ["payment transition per §1.2; increments LivestockSale.version by 1"] }
  - { method: POST, path: "/api/livestock-sales/{id}/load", description: "Load the truck (delivery PENDING -> LOADED); requires payment PAID", roles: [RanchManager, RangeHand], code: 200, input: [], output: LivestockSale, side_effects: ["delivery transition per §1.2; increments LivestockSale.version by 1"] }
  - { method: POST, path: "/api/livestock-sales/{id}/deliver", description: "Deliver with scale ticket / head count; computes settled_price_cents; decrements flock headcount", roles: [RanchManager, RangeHand], code: 200, input: ["actual_total_weight_lbs?", "actual_head_delivered?"], output: LivestockSale, side_effects: ["delivery transition per §1.2", "sale_price settled variant", "recompute Flock.current_headcount; increments Flock.version by 1"] }
  - { method: POST, path: "/api/livestock-sales/{id}/cancel", description: "Cancel a PENDING sale; refunds when already PAID (compensation)", roles: [RanchManager], code: 200, input: [], output: LivestockSale, side_effects: ["delivery -> CANCELLED; payment PAID -> REFUNDED when applicable; increments LivestockSale.version by 1"] }

  - { method: POST, path: "/api/loss-reports", description: "Report a predator loss", roles: [RanchManager, RangeHand], code: 201, input: [flock_id, loss_date, head_lost, predator_type, guardian_on_duty], output: LossReport, side_effects: [] }
  - { method: GET, path: "/api/loss-reports", description: "List loss reports; flock_id filter is the FK reverse-reachability channel", roles: [RanchManager, RangeHand], code: 200, input: ["limit?", "offset?", "flock_id?", "report_status?"], output: "LossReport[]", side_effects: [] }
  - { method: GET, path: "/api/loss-reports/{id}", description: "Read one loss report", roles: [RanchManager, RangeHand], code: 200, input: [], output: LossReport, side_effects: [] }
  - { method: POST, path: "/api/loss-reports/{id}/transitions", description: "Loss verification: to in {UNDER_REVIEW, VERIFIED, DISMISSED}; VERIFIED fires the headcount -> breach -> move cascade", roles: [RanchManager], code: 200, input: [to], output: LossReport, side_effects: ["loss transition per §1.2; verification cascade per §1.2 LossReport"] }

  - { method: POST, path: "/api/grazing-contracts", description: "Draft a vegetation-management grazing contract", roles: [RanchManager], code: 201, input: [flock_id, client_org_name, parcel_name, service_window_start, service_window_end, rate_per_head_day_cents, min_head, max_head, target_cover_reduction_pct], output: GrazingContract, side_effects: [] }
  - { method: GET, path: "/api/grazing-contracts", description: "List contracts; flock_id filter is the FK reverse-reachability channel", roles: [RanchManager, GrazingClient], code: 200, input: ["limit?", "offset?", "flock_id?", "contract_status?"], output: "GrazingContract[]", side_effects: [] }
  - { method: GET, path: "/api/grazing-contracts/{id}", description: "Read one contract", roles: [RanchManager, GrazingClient], code: 200, input: [], output: GrazingContract, side_effects: [] }
  - { method: POST, path: "/api/grazing-contracts/{id}/transitions", description: "Negotiation/lifecycle: to in {PROPOSED, ACCEPTED, ACTIVE, CANCELLED}; actor per §1.2", roles: [RanchManager, GrazingClient], code: 200, input: [to], output: GrazingContract, side_effects: ["contract transition per §1.2; increments GrazingContract.version by 1"] }
  - { method: POST, path: "/api/grazing-contracts/{id}/counter", description: "Client counter-offer (PROPOSED -> COUNTERED); OCC-guarded; bumps terms_version", roles: [GrazingClient], code: 200, input: [expected_grazing_contract_version, "rate_per_head_day_cents?", "min_head?", "max_head?", "service_window_start?", "service_window_end?"], output: GrazingContract, side_effects: ["contract PROPOSED -> COUNTERED; terms_version += 1; increments GrazingContract.version by 1"] }
  - { method: POST, path: "/api/grazing-contracts/{id}/complete", description: "Complete an ACTIVE contract after the window; computes head_days and invoice_cents", roles: [RanchManager], code: 200, input: [achieved_cover_reduction_pct], output: GrazingContract, side_effects: ["grazing_invoice", "cascade: PLANNED moves CANCELLED, ACTIVE moves COMPLETED"] }

  - { method: POST, path: "/api/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads that default and never wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or actor not permitted for this transition per §1.2" }
  - { id: ERR_VALIDATION, http: 400, condition: "Request shape violation: missing required field, invalid enum, non-positive weight/head/acres, start >= end, conditional-field mismatch (MEAT vs BREEDING fields; pasture_id XOR contract_id)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve; unknown pool_ref on pool statement" }
  - { id: ERR_FLOCK_RETIRED, http: 409, condition: "Operation targets a RETIRED flock" }
  - { id: ERR_FLOCK_BUSY, http: 409, condition: "Retire blocked: open season, move, shearing event, undelivered sale, or non-terminal contract exists" }
  - { id: ERR_SEASON_INVALID_STATE, http: 409, condition: "Season transition not allowed from current season_status (incl. terminal lockdown and births outside LAMBING)" }
  - { id: ERR_SEASON_TOO_EARLY, http: 422, condition: "Season clock gate not yet reached (breeding_end / expected lambing start / weaning date)" }
  - { id: ERR_OPEN_SEASON_EXISTS, http: 409, condition: "Flock already has a season in {PLANNED, BREEDING, GESTATION, LAMBING, WEANING}" }
  - { id: ERR_BIRTH_OUTSIDE_WINDOW, http: 422, condition: "birth_date outside [expected_lambing_start, expected_lambing_start + 45 days]" }
  - { id: ERR_BIRTH_COUNT_MISMATCH, http: 422, condition: "births_reported != born_alive + born_dead" }
  - { id: ERR_MOVE_INVALID_STATE, http: 409, condition: "Move transition not allowed from current move_status" }
  - { id: ERR_PASTURE_OVERLAP, http: 409, condition: "Own-ranch move interval [start, end) collides with another PLANNED/ACTIVE move on the same pasture (half-open; adjacency allowed)" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Own-ranch move head_count exceeds pasture.carrying_capacity_head" }
  - { id: ERR_HEAD_OUT_OF_CONTRACT_RANGE, http: 422, condition: "Contract move activation with head_count outside [min_head, max_head]" }
  - { id: ERR_SHEARING_INVALID_STATE, http: 409, condition: "Shearing transition not allowed from current shearing_status" }
  - { id: ERR_CREW_INACTIVE, http: 409, condition: "Scheduling with an INACTIVE crew" }
  - { id: ERR_CREW_BUSY, http: 409, condition: "Deactivating a crew that still has SCHEDULED or IN_PROGRESS events" }
  - { id: ERR_CREW_OVERLAP, http: 409, condition: "Crew booking collides with another SCHEDULED/IN_PROGRESS booking under the 24h buffer rule (adjacency forbidden)" }
  - { id: ERR_SHEARING_WINDOW_INFEASIBLE, http: 422, condition: "Window days * crew capacity < expected_head" }
  - { id: ERR_LOT_INVALID_STATE, http: 409, condition: "Lot operation not allowed from current lot_status (incl. core-test creation when lot not in {GRADED, CONSIGNED}, delete when not DRAFT)" }
  - { id: ERR_WEIGHT_OVER_ALLOCATED, http: 422, condition: "Lot weight_lbs exceeds clip.unallocated_weight_lbs" }
  - { id: ERR_CORE_TEST_INVALID_STATE, http: 409, condition: "Core-test transition not allowed from current test_status" }
  - { id: ERR_DUPLICATE_ACTIVE_TEST, http: 409, condition: "Lot already has a CoreTest in {SUBMITTED, RESULTED, LOCKED}" }
  - { id: ERR_CORE_TEST_SOD, http: 403, condition: "Segregation of duties: the user locking the test is the user who submitted it" }
  - { id: ERR_CONSIGNMENT_INVALID_STATE, http: 409, condition: "Consignment transition not allowed from current consignment_status" }
  - { id: ERR_CONSIGNMENT_ALREADY_OPEN, http: 409, condition: "Lot already has a Consignment in {TENDERED, ACCEPTED, ADVANCED, SOLD}" }
  - { id: ERR_SALE_INVALID_STATE, http: 409, condition: "Sale operation not allowed from current payment/delivery dimension state (incl. cancel after LOADED, payment on CANCELLED sale)" }
  - { id: ERR_SALE_UNPAID, http: 409, condition: "Load requires payment_status == PAID" }
  - { id: ERR_WITHDRAWAL_ACTIVE, http: 422, condition: "MEAT sale scheduled_date earlier than flock.withdrawal_until" }
  - { id: ERR_INSUFFICIENT_HEAD, http: 422, condition: "Requested head exceeds flock.current_headcount (sale / loss / move activation) or below contract min_head at proposal" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "record-payment amount_cents != booked_price_cents" }
  - { id: ERR_REPORT_INVALID_STATE, http: 409, condition: "Loss-report transition not allowed from current report_status" }
  - { id: ERR_CONTRACT_INVALID_STATE, http: 409, condition: "Contract transition not allowed from current contract_status; also contract move creation/activation while contract not ACTIVE" }
  - { id: ERR_CONTRACT_WINDOW_CLOSED, http: 422, condition: "Activation outside the service window, or completion before service_window_end" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "expected_wool_lot_version != WoolLot.version (OCC)" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_grazing_contract_version != GrazingContract.version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RanchManager
    description: "Ranch owner/operator; runs seasons, wool marketing, sales, contracts, and contract completion"
    identity: opaque
    exclusive_operations:
      - "POST /api/flocks, POST /api/flocks/{id}/retire"
      - "POST /api/breeding-seasons, POST /api/breeding-seasons/{id}/transitions"
      - "POST /api/pastures"
      - "POST /api/shearing-crews, POST /api/shearing-crews/{id}/deactivate, POST /api/shearing-events"
      - "POST /api/wool-lots, POST /api/wool-lots/{id}/grade, POST /api/wool-lots/{id}/transitions, POST /api/wool-lots/{id}/regrade, DELETE /api/wool-lots/{id}"
      - "POST /api/core-tests/{id}/transitions (lock/reject; SoD-checked)"
      - "POST /api/consignments, POST /api/consignments/{id}/transitions {to: WITHDRAWN}"
      - "POST /api/holiday-windows"
      - "POST /api/livestock-sales, POST /api/livestock-sales/{id}/record-payment, POST /api/livestock-sales/{id}/cancel"
      - "POST /api/loss-reports/{id}/transitions"
      - "POST /api/grazing-contracts, POST /api/grazing-contracts/{id}/transitions, POST /api/grazing-contracts/{id}/complete"
    shared_operations:
      - "field ops shared with RangeHand: birth-records, grazing-moves create/transitions, parasite-treatments create/follow-up, shearing transitions/complete, loss-reports create, sale load/deliver"
      - "reads per endpoint roles lists"
  - name: RangeHand
    description: "Field hand; records births, moves, treatments, shearing tallies, predator losses"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /api/birth-records, POST /api/grazing-moves, POST /api/grazing-moves/{id}/transitions"
      - "POST /api/parasite-treatments, POST /api/parasite-treatments/{id}/follow-up"
      - "POST /api/shearing-events/{id}/transitions, POST /api/shearing-events/{id}/complete"
      - "POST /api/loss-reports"
      - "POST /api/livestock-sales/{id}/load, POST /api/livestock-sales/{id}/deliver"
      - "reads per endpoint roles lists"
  - name: WoolPoolOperator
    description: "Wool pool staff; runs core testing and the consignment acceptance/advance/sale/settlement pipeline"
    identity: opaque
    exclusive_operations:
      - "POST /api/core-tests, POST /api/core-tests/{id}/results"
      - "POST /api/consignments/{id}/transitions {to: ACCEPTED, REJECTED, ADVANCED, SETTLED}"
      - "POST /api/consignments/{id}/sell"
    shared_operations:
      - "GET /api/wool-clips*, GET /api/wool-lots*, GET /api/core-tests*, GET /api/consignments*, GET /api/pool-statements/{pool_ref}"
  - name: GrazingClient
    description: "Vegetation-management customer; counters and accepts grazing contracts"
    identity: opaque
    exclusive_operations:
      - "POST /api/grazing-contracts/{id}/counter"
    shared_operations:
      - "POST /api/grazing-contracts/{id}/transitions {to: ACCEPTED from PROPOSED, CANCELLED}"
      - "GET /api/grazing-contracts*, GET /api/grazing-moves*"
  - name: PlatformAdmin
    description: "Test-harness operator; owns the logical clock only"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
    shared_operations: []
