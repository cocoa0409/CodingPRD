          - errors.ERR_REVIEW_APPOINTMENT_NOT_FOUND
          - errors.ERR_AMENDMENT_REQUEST_NOT_FOUND
          - errors.ERR_LEGAL_DEMAND_NOT_FOUND
          - errors.ERR_RETENTION_SCHEDULE_NOT_FOUND
        distinguishing_aspect: "Eight by-id reads with the same syntactically valid but unknown UUID return eight DIFFERENT error_ids, one per entity family, all at HTTP 404 — a shared ERR_NOT_FOUND or a 400 for any of them fails the claim."
        test_recipe:
          setup:
            - "An empty store: no withdrawal, incident, records request, inspection request, appointment, amendment, demand or retention schedule has ever been created."
          setup_api_calls: []
