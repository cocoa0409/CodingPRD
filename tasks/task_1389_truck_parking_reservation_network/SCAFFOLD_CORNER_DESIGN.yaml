      - name: incident_resolve_same_operator_segregation_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The operator who acknowledged an incident cannot resolve it; a different operator succeeds."
        test_recipe:
          setup: ["site; SECURITY/HIGH incident acknowledged and under investigation by op-alice"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-SD", full_name: "S Dee" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/incidents", payload: { category: "SECURITY", severity: "HIGH", description: "tailgating", reporter_driver_id: "${d1}" }, as: Driver, as_user_id: "${d1}", captures: { inc: $.data.id } }
            - { call: "POST /incidents/${inc}/transition", payload: { to: "ACKNOWLEDGED" }, as: SiteOperator, as_user_id: "op-alice" }
            - { call: "POST /incidents/${inc}/transition", payload: { to: "INVESTIGATING" }, as: SiteOperator, as_user_id: "op-alice" }
          trigger:
            - { call: "POST /incidents/${inc}/transition", payload: { to: "RESOLVED" }, as: SiteOperator, as_user_id: "op-alice", captures: { err: $.data.error_id } }
            - { call: "POST /incidents/${inc}/transition", payload: { to: "RESOLVED" }, as: SiteOperator, as_user_id: "op-bob", captures: { st: $.data.status } }
          assert:
            - "op-alice resolve -> error_id == ERR_SEGREGATION_OF_DUTIES (403)"
