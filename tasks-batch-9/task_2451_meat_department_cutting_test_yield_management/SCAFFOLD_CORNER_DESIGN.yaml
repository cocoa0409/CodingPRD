              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${ta_id}/transitions"
              payload: { action: "APPROVE" }
              as: MeatManager
              as_user_id: "mgr-01"
            - call: "POST /meat-ops/trim-lots"
              payload: { department_id: "${dept_id}", lot_code: "TL-1", received_lb: 10.0, pack_date: "2026-08-05", cutting_test_line_id: "${ctla_id}" }
              as: MeatCutter
