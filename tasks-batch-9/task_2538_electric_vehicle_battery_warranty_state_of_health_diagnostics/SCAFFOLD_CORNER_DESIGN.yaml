      - name: snapshot_correction_factor_at_every_temperature_band_edge
        claim_type: threshold
        grounds:
          - calculations.temperature_correction_factor
          - entities.TelematicsSnapshot.fields.corrected_capacity_kwh
        distinguishing_aspect: |
          All three band edges are probed with one identical reported capacity of 56.000 kWh, so the
          only variable is coolant_temp_c: -0.1 -> 59.360, exactly 0.0 -> 57.680 (the cold edge
          belongs to the 1.03 band, not 1.06), exactly 15.0 and exactly 35.0 -> 56.000, and 35.0001
          -> 54.320. A naive <= / < flip anywhere on the ladder changes one of the five numbers.
        test_recipe:
          setup:
            - "One program, one vehicle, one installed 80.000 kWh pack; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
