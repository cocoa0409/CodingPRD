# =============================================================================
# SCAFFOLD.yaml — Construction Submittal & RFI Management (GC project engineering)
# §1.0–§1.7 seed tables. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "Construction Submittal & RFI Management (GC project engineering team): submittal register from specification sections & required lead times, submittal review cycle with architect/engineer & resubmittal, deferred submittal & long-lead item expediting, RFI creation, routing & response deadline tracking, cost/schedule impact flag from RFI answers, distribution to affected subcontractors, closeout of open items before installation, log reporting to owner"

domain_name: construction-submittal-rfi
api_prefix: /v1

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration   # configurable multi-step review/answer pipelines with branching, compensation, idempotent-safe replays
  secondary_archetype: posture_driven_gating  # Project.posture gates nearly all child mutations
  complexity_layers:
    - optimistic_concurrency        # OCC on Project.version / Submittal.version for create-with-supersede writes
    - cascading_side_effects        # accept-impact and daily-scan cascades span 4+ entities
    - ops_run_checkpoint            # POST /projects/{id}/run-daily-scan advances overdue/escalation epoch
    - rate_threshold_triggers       # escalation tiers, reviewer capacity, standing thresholds (>= boundaries)
  entity_topology: flat             # peer entities with FK references; nested routes only for creation/listing convenience
  state_machine_shape: cyclic       # resubmittal loop + RFI reopen loop + dispute/reprice loop; Submittal additionally carries parallel dimensions (review_status x expediting_status)
  relationship_patterns:
    - one_to_many
    - cross_aggregate               # RFI -> Submittal, InstallationActivity -> Submittal/Subcontractor
    - polymorphic                   # DistributionRecord.source / EscalationEvent.source reference multiple entity types
  role_model: segregation_of_duties # priced_by != decided_by on ImpactAssessment; reviewer ownership on return/answer; sub ownership on revision submit / ack
  consistency_model: immediate      # all mutations + cascades atomic in the triggering request (daily scan is the only batch mover)

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: project_name, type: string, source: input, description: "Project display name" }
      - { name: contract_start_date, type: string, source: input, description: "YYYY-MM-DD contract start (informational)", default: null }
      - { name: rfi_response_days, type: integer, source: input, description: "Contractual RFI response window in business days", default: 10, constraints: ">= 1" }
      - { name: ack_required_days, type: integer, source: input, description: "Business days a subcontractor has to acknowledge a distribution", default: 5, constraints: ">= 1" }
      - { name: mobilization_buffer_days, type: integer, source: input, description: "Required calendar-day gap between two installation windows of the same subcontractor", default: 2, constraints: ">= 0" }
      - { name: long_lead_threshold_days, type: integer, source: input, description: "Spec-section lead_time_days >= this marks generated submittals long-lead", default: 30, constraints: ">= 1" }
      - { name: expedite_window_days, type: integer, source: input, description: "Auto-move submittal expediting_status MONITORING->EXPEDITING when days until required_on_site_date <= this", default: 10, constraints: ">= 0" }
      - { name: holiday_dates, type: array, source: input, description: "Array of YYYY-MM-DD non-working days excluded from business-day math", default: [] }
      - { name: initial_contingency_cents, type: integer, source: input, description: "Owner change-order contingency seed", default: 0, constraints: ">= 0" }
      - { name: contingency_reserved_cents, type: integer, source: computed, description: "Sum of final_delta_cents over ImpactAssessments in PRICED or DISPUTED; ledger per contingency_ledger_update", default: 0 }
      - { name: contingency_spent_cents, type: integer, source: computed, description: "Sum of final_delta_cents over ACCEPTED ImpactAssessments", default: 0 }
      - { name: contingency_available_cents, type: integer, source: computed, description: "= initial_contingency_cents - contingency_reserved_cents - contingency_spent_cents", default: 0 }
      - { name: gc_tier_threshold_cents, type: integer, source: input, description: "GC markup tier breakpoint on contingency_spent_cents (spent >= threshold -> tier 2)", default: 1000000, constraints: ">= 0" }
      - { name: ops_scan_index, type: integer, source: system, description: "Monotonic counter, starts 0, +1 per successful run-daily-scan", default: 0 }
      - { name: posture, type: enum, source: system, description: "SETUP | ACTIVE | SUSPENDED | CLOSEOUT | CLOSED" }

  - name: SpecSection
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: section_number, type: string, source: input, description: "MasterFormat section number, unique within project" }
      - { name: title, type: string, source: input, description: "Section title", default: "" }
      - { name: lead_time_days, type: integer, source: input, description: "Procurement lead time in business days", default: 14, constraints: ">= 0" }
      - { name: review_days, type: integer, source: input, description: "Design-team review window per revision in business days", default: 10, constraints: ">= 1" }
      - { name: required_discipline, type: enum, source: input, description: "ARCH | STRUCT | MEP | CIVIL — reviewer discipline required for routing", default: "ARCH" }
      - { name: default_need_date, type: string, source: input, description: "YYYY-MM-DD default required_on_site_date stamped onto generated submittals", default: null }
      - { name: responsible_subcontractor_id, type: string, source: input, description: "FK -> Subcontractor.id; nullable; the sub allowed to submit revisions", default: null }
      - { name: required_submittal_kinds, type: array, source: input, description: "Array of enum kinds PRODUCT_DATA | SHOP_DRAWINGS | SAMPLES | MOCKUP | CERTIFICATES | O_AND_M_MANUALS; one register item per kind; duplicates rejected", default: ["PRODUCT_DATA"] }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | LOCKED" }

  - name: Subcontractor
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: company_name, type: string, source: input, description: "Company name" }
      - { name: trade, type: string, source: input, description: "Trade label (free text)" }
      - { name: contact_email, type: string, source: input, description: "Contact email", default: "" }
      - { name: late_ack_count, type: integer, source: computed, description: "Number of distribution records that ever became overdue for this sub; monotone", default: 0 }
      - { name: standing, type: enum, source: system, description: "GOOD | WATCH | SUSPENDED — derived from late_ack_count thresholds 3 / 6" }

  - name: Reviewer
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: display_name, type: string, source: input, description: "Reviewer name" }
      - { name: discipline, type: enum, source: input, description: "ARCH | STRUCT | MEP | CIVIL" }
      - { name: review_capacity, type: integer, source: input, description: "Maximum number of revisions this reviewer may hold in UNDER_REVIEW at any moment", default: 3, constraints: ">= 1" }
      - { name: open_review_count, type: integer, source: computed, description: "Count of SubmittalRevisions currently UNDER_REVIEW with reviewer_id == this reviewer", default: 0 }
      - { name: reviewer_status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: Submittal
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: spec_section_id, type: string, source: system, description: "FK -> SpecSection.id" }
      - { name: submittal_kind, type: enum, source: system, description: "One of the section's required_submittal_kinds" }
      - { name: item_number, type: string, source: system, description: "Computed at register generation: <section_number>-<NN>, NN = 1-based kind index zero-padded to 2" }
      - { name: required_on_site_date, type: string, source: input, description: "YYYY-MM-DD; initialized from section default_need_date; PATCH-able while review_status NOT IN {CLOSED, VOID}" }
      - { name: required_approval_date, type: string, source: computed, description: "sub_business_days(required_on_site_date, section.lead_time_days) — see submittal_required_dates" }
      - { name: required_submission_date, type: string, source: computed, description: "sub_business_days(required_approval_date, section.review_days)" }
      - { name: is_long_lead, type: boolean, source: computed, description: "section.lead_time_days >= project.long_lead_threshold_days (>= is long-lead)" }
      - { name: review_status, type: enum, source: system, description: "REGISTERED | IN_REVIEW | RETURNED_NEEDS_RESUBMIT | APPROVED | RELEASED | DISTRIBUTED | CLOSED | VOID" }
      - { name: expediting_status, type: enum, source: system, description: "NOT_REQUIRED | MONITORING | EXPEDITING | ESCALATED | CLEAR — parallel dimension, independent of review_status" }
      - { name: deferral_status, type: enum, source: system, description: "NONE | DEFERRAL_REQUESTED | DEFERRED_APPROVED" }
      - { name: revision_count, type: integer, source: system, description: "Number of revisions created; next revision_number", default: 0 }

  - name: SubmittalRevision
    parent: null
    common_fields: true
    fields:
      - { name: submittal_id, type: string, source: system, description: "FK -> Submittal.id" }
      - { name: revision_number, type: integer, source: system, description: "0-based sequence within the submittal" }
      - { name: document_ref, type: string, source: input, description: "Document URI/reference for this revision" }
      - { name: notes, type: string, source: input, description: "Submitter notes", default: "" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | RETURNED | SUPERSEDED" }
      - { name: action_code, type: enum, source: system, description: "A | B | C | D — null until returned; A=approved, B=approved as noted, C=revise & resubmit, D=rejected", default: null }
      - { name: reviewer_id, type: string, source: system, description: "FK -> Reviewer.id; null until routed", default: null }
      - { name: submitted_date, type: string, source: system, description: "YYYY-MM-DD clock date at creation" }
      - { name: routed_date, type: string, source: system, description: "YYYY-MM-DD clock date at route; null until routed", default: null }
      - { name: review_due_date, type: string, source: computed, description: "add_business_days(routed_date, section.review_days); null until routed", default: null }
      - { name: returned_date, type: string, source: system, description: "YYYY-MM-DD clock date at return; null until returned", default: null }
      - { name: is_late_return, type: boolean, source: computed, description: "returned_date > review_due_date; false when either is null", default: false }
      - { name: return_comments, type: string, source: input, description: "Reviewer comments at return", default: "" }

  - name: LongLeadItem
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: submittal_id, type: string, source: system, description: "FK -> Submittal.id; 1:1, auto-created for long-lead submittals at register generation" }
      - { name: description, type: string, source: input, description: "Material/equipment description", default: "" }
      - { name: criticality, type: enum, source: input, description: "CRITICAL | HIGH | STANDARD — feeds expediting_priority_score", default: "STANDARD" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | QUOTED | PO_ISSUED | IN_PRODUCTION | SHIPPED | DELIVERED | CANCELLED" }
      - { name: required_on_site_date, type: string, source: computed, description: "Mirror of submittal.required_on_site_date; recomputed when the submittal date shifts" }
      - { name: days_late, type: integer, source: computed, description: "0 if status == DELIVERED or clock date <= required_on_site_date; else calendar days past required_on_site_date", default: 0 }
      - { name: escalation_level, type: integer, source: computed, description: "0 | 1 | 2 | 3 — tiered on days_late (see escalation_level calculation)", default: 0 }
      - { name: priority_score, type: integer, source: computed, description: "expediting_priority_score result, recomputed at scan and on LLI-affecting mutations", default: 0 }
      - { name: quoted_date, type: string, source: system, description: "YYYY-MM-DD actual date recorded at advance to QUOTED", default: null }
      - { name: po_issued_date, type: string, source: system, description: "actual at PO_ISSUED", default: null }
      - { name: shipped_date, type: string, source: system, description: "actual at SHIPPED", default: null }
      - { name: delivered_date, type: string, source: system, description: "actual at DELIVERED", default: null }

  - name: RFI
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: rfi_number, type: string, source: system, description: "Computed: RFI-<NNNN> 1-based per project, zero-padded to 4" }
      - { name: subject, type: string, source: input, description: "Short subject" }
      - { name: question_text, type: string, source: input, description: "Question body" }
      - { name: spec_section_id, type: string, source: input, description: "FK -> SpecSection.id; nullable", default: null }
      - { name: submittal_id, type: string, source: input, description: "FK -> Submittal.id; nullable", default: null }
      - { name: priority, type: enum, source: input, description: "LOW | NORMAL | HIGH | CRITICAL", default: "NORMAL" }
      - { name: required_discipline, type: enum, source: input, description: "ARCH | STRUCT | MEP | CIVIL — reviewer discipline for routing", default: "ARCH" }
      - { name: status, type: enum, source: system, description: "OPEN | ROUTED | ANSWERED | CLOSED | VOID" }
      - { name: cycle_count, type: integer, source: system, description: "Number of reopens", default: 0 }
      - { name: opened_date, type: string, source: system, description: "YYYY-MM-DD clock date at creation" }
      - { name: due_date, type: string, source: computed, description: "add_business_days(opened/reopen date, project.rfi_response_days) — see rfi_due_date" }
      - { name: is_overdue, type: boolean, source: computed, description: "set true by run-daily-scan when status IN {OPEN, ROUTED} and clock date > due_date; cleared on reopen", default: false }
      - { name: routed_reviewer_id, type: string, source: system, description: "FK -> Reviewer.id; null until routed", default: null }
      - { name: routed_date, type: string, source: system, description: "YYYY-MM-DD; null until routed", default: null }
      - { name: answer_text, type: string, source: system, description: "Answer body; null until answered; cleared on reopen", default: null }
      - { name: answered_date, type: string, source: system, description: "YYYY-MM-DD; cleared on reopen", default: null }
      - { name: answered_by_reviewer_id, type: string, source: system, description: "FK -> Reviewer.id; cleared on reopen", default: null }
      - { name: is_late_answer, type: boolean, source: computed, description: "answered_date > due_date at answer time (<= due is on time)", default: false }
      - { name: cost_impact_flag, type: boolean, source: system, description: "Set at answer; cleared on reopen", default: false }
      - { name: schedule_impact_flag, type: boolean, source: system, description: "Set at answer; cleared on reopen", default: false }
      - { name: estimated_schedule_days, type: integer, source: system, description: "Calendar days of schedule slip claimed at answer; required when schedule_impact_flag true", default: null }

  - name: ImpactAssessment
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: rfi_id, type: string, source: system, description: "FK -> RFI.id" }
      - { name: status, type: enum, source: system, description: "ESTIMATED | PRICED | ACCEPTED | DISPUTED | WAIVED" }
      - { name: estimated_cost_cents, type: integer, source: system, description: "Estimated cost carried from the RFI answer" }
      - { name: provisional_delta_cents, type: integer, source: computed, description: "impact_cost_delta PROVISIONAL variant over estimated_cost_cents" }
      - { name: sub_quote_cents, type: integer, source: input, description: "Firm subcontractor quote entered at price/reprice", default: null }
      - { name: gc_markup_tier, type: integer, source: computed, description: "1 | 2 — tier selected at pricing time from contingency_spent_cents vs project.gc_tier_threshold_cents (>= threshold -> 2)", default: null }
      - { name: final_delta_cents, type: integer, source: computed, description: "impact_cost_delta FINAL variant over sub_quote_cents at the selected tier; null until priced", default: null }
      - { name: priced_by_user_id, type: string, source: system, description: "X-User-ID recorded at most recent price/reprice", default: null }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID recorded at accept/waive/dispute", default: null }
      - { name: price_cycle, type: integer, source: system, description: "Number of times priced (reprice increments)", default: 0 }

  - name: DistributionRecord
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: subcontractor_id, type: string, source: system, description: "FK -> Subcontractor.id" }
      - { name: source_type, type: enum, source: system, description: "Polymorphic source discriminator: RFI | SUBMITTAL; pairs with source_id (not a constrained FK)" }
      - { name: source_id, type: string, source: system, description: "Polymorphic source id (RFI.id or Submittal.id per source_type)" }
      - { name: status, type: enum, source: system, description: "QUEUED | SENT | ACKNOWLEDGED" }
      - { name: sent_date, type: string, source: system, description: "YYYY-MM-DD; null until sent", default: null }
      - { name: ack_due_date, type: string, source: computed, description: "add_business_days(sent_date, project.ack_required_days); null until sent", default: null }
      - { name: acknowledged_date, type: string, source: system, description: "YYYY-MM-DD; null until acknowledged", default: null }
      - { name: is_overdue, type: boolean, source: computed, description: "set once by run-daily-scan when status == SENT and clock date > ack_due_date", default: false }

  - name: InstallationActivity
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: submittal_id, type: string, source: input, description: "FK -> Submittal.id — the governing submittal that must be released before work starts" }
      - { name: subcontractor_id, type: string, source: input, description: "FK -> Subcontractor.id — crew resource for window conflict checks" }
      - { name: description, type: string, source: input, description: "Activity description", default: "" }
      - { name: start_date, type: string, source: input, description: "YYYY-MM-DD window start (inclusive)" }
      - { name: end_date, type: string, source: input, description: "YYYY-MM-DD window end (exclusive); must be > start_date" }
      - { name: status, type: enum, source: system, description: "PLANNED | RELEASED | COMPLETED | CANCELLED" }
      - { name: shift_applied_days, type: integer, source: system, description: "Cumulative calendar days applied by accepted schedule impacts", default: 0 }

  - name: OwnerReport
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: period_start, type: string, source: input, description: "YYYY-MM-DD inclusive" }
      - { name: period_end, type: string, source: input, description: "YYYY-MM-DD inclusive; >= period_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED" }
      - { name: published_at, type: datetime, source: system, description: "ISO8601 timestamp at publish; null until published", default: null }
      - { name: snapshot_metrics, type: object, source: computed, description: "Frozen owner_report_metrics SNAPSHOT variant at publish; null until published", default: null }
      - { name: superseded_by_report_id, type: string, source: system, description: "Report that superseded this one; null unless SUPERSEDED", default: null }

  - name: EscalationEvent
    parent: null
    common_fields: false  # append-only log: id + created_at only
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: event_type, type: enum, source: system, description: "RFI_OVERDUE | LLI_ESCALATION_RAISED | LLI_ESCALATION_CLEARED | DIST_ACK_OVERDUE | SUBCONTRACTOR_WATCH | SUBCONTRACTOR_SUSPENDED" }
      - { name: source_type, type: enum, source: system, description: "Polymorphic source discriminator: RFI | LONG_LEAD_ITEM | DISTRIBUTION_RECORD | SUBCONTRACTOR" }
      - { name: source_id, type: string, source: system, description: "Polymorphic source id" }
      - { name: detail, type: string, source: system, description: "Human-readable detail (e.g., old/new escalation level)" }
      - { name: event_date, type: string, source: system, description: "YYYY-MM-DD clock date when the event fired" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    field: posture
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: ACTIVE
        trigger: "POST /v1/projects/{projectId}/activate"
        actor: ProjectManager
        preconditions: ["posture == SETUP (ERR_INVALID_PROJECT_STATE otherwise)"]
        side_effects: ["increments Project.version by 1"]

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/projects/{projectId}/suspend"
        actor: ProjectManager
        preconditions: ["posture == ACTIVE"]
        side_effects: ["increments Project.version by 1"]

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/projects/{projectId}/resume"
        actor: ProjectManager
        preconditions: ["posture == SUSPENDED"]
        side_effects: ["increments Project.version by 1"]

      - from: ACTIVE
        to: CLOSEOUT
        trigger: "POST /v1/projects/{projectId}/begin-closeout"
        actor: ProjectManager
        preconditions:
          - "every Submittal of the project has review_status IN {CLOSED, VOID} OR deferral_status == DEFERRED_APPROVED (ERR_CLOSEOUT_BLOCKED)"
          - "every RFI has status IN {CLOSED, VOID}"
          - "every ImpactAssessment has status IN {ACCEPTED, WAIVED}"
          - "every DistributionRecord has status == ACKNOWLEDGED"
          - "every InstallationActivity has status IN {COMPLETED, CANCELLED}"
          - "no OwnerReport in DRAFT"
        side_effects: ["increments Project.version by 1"]

      - from: CLOSEOUT
        to: CLOSED
        trigger: "POST /v1/projects/{projectId}/close"
        actor: ProjectManager
        preconditions: ["posture == CLOSEOUT (ERR_INVALID_PROJECT_STATE otherwise)"]
        side_effects: ["increments Project.version by 1"]

  - entity: SpecSection
    field: status
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /v1/spec-sections/{sectionId}/activate"
        actor: ProjectEngineer
        preconditions:
          - "status == DRAFT (ERR_SPEC_SECTION_NOT_DRAFT)"
          - "project.posture IN {SETUP, ACTIVE} (ERR_PROJECT_NOT_ACTIVE)"
        side_effects:
          - "register generation: for each kind in required_submittal_kinds (array order), create one Submittal with item_number '<section_number>-<NN>' (NN = 1-based index zero-padded to 2), review_status REGISTERED, required_on_site_date = section.default_need_date, required dates recomputed via submittal_required_dates, is_long_lead per threshold"
          - "for each generated Submittal with is_long_lead == true: create one LongLeadItem (status IDENTIFIED, required_on_site_date mirrored, escalation_level and priority_score computed against the current clock date) and set submittal.expediting_status = MONITORING"
          - "increments SpecSection.version by 1"

      - from: ACTIVE
        to: LOCKED
        trigger: "POST /v1/spec-sections/{sectionId}/lock"
        actor: ProjectEngineer
        preconditions: ["status == ACTIVE (ERR_SPEC_SECTION_NOT_ACTIVE)"]
        side_effects: ["increments SpecSection.version by 1"]
        note: "LOCKED freezes register generation only; existing submittals continue their lifecycle"

  - entity: Subcontractor
    field: standing
    initial_state: GOOD
    terminal_states: []
    transitions:
      - from: GOOD
        to: WATCH
        trigger: "system (run-daily-scan increments late_ack_count to exactly the WATCH threshold)"
        actor: system
        preconditions: ["late_ack_count >= 3"]
        side_effects: ["append EscalationEvent SUBCONTRACTOR_WATCH (source_type SUBCONTRACTOR)"]

      - from: WATCH
        to: SUSPENDED
        trigger: "system (run-daily-scan increments late_ack_count to the SUSPENDED threshold)"
        actor: system
        preconditions: ["late_ack_count >= 6"]
        side_effects:
          - "append EscalationEvent SUBCONTRACTOR_SUSPENDED"
          - "SUSPENDED subs are blocked from submitting new revisions (ERR_SUBCONTRACTOR_SUSPENDED)"
        note: "standing is recomputed on every late_ack_count increment; late_ack_count never decreases, so no downward transitions exist"

  - entity: Submittal
    field: review_status
    initial_state: REGISTERED
    terminal_states: [CLOSED, VOID]
    transitions:
      - from: REGISTERED
        to: IN_REVIEW
        trigger: "system (first SubmittalRevision created)"
        actor: system
        preconditions:
          - "revision creation is only accepted when review_status IN {REGISTERED, RETURNED_NEEDS_RESUBMIT} (ERR_SUBMITTAL_NOT_ACCEPTING_REVISIONS)"
        side_effects: []

      - from: RETURNED_NEEDS_RESUBMIT
        to: IN_REVIEW
        trigger: "system (new SubmittalRevision created after a C/D return) — resubmittal cycle"
        actor: system
        preconditions:
          - "revision creation is only accepted when review_status IN {REGISTERED, RETURNED_NEEDS_RESUBMIT} (ERR_SUBMITTAL_NOT_ACCEPTING_REVISIONS)"
        side_effects: []

      - from: IN_REVIEW
        to: RETURNED_NEEDS_RESUBMIT
        trigger: "system (latest revision RETURNED with action_code C or D)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_REVIEW
        to: APPROVED
        trigger: "system (latest revision RETURNED with action_code A or B)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: RELEASED
        trigger: "POST /v1/submittals/{submittalId}/release-for-construction"
        actor: ProjectEngineer
        preconditions:
          - "project.posture == ACTIVE (ERR_PROJECT_NOT_ACTIVE)"
          - "review_status == APPROVED (ERR_SUBMITTAL_NOT_APPROVED)"
        side_effects:
          - "affected-subcontractor selector: distinct set = (spec_section.responsible_subcontractor_id if non-null) UNION (subcontractor_id of every InstallationActivity with submittal_id == this submittal and status NOT IN {CANCELLED}); ordered by Subcontractor.created_at ASC"
          - "create one DistributionRecord (source_type SUBMITTAL, status QUEUED) per affected subcontractor; the set is fixed at release (later activities do not retro-add records)"
          - "if the affected set is empty: review_status -> DISTRIBUTED immediately (vacuous all-acknowledged)"
          - "increments Submittal.version by 1"

      - from: RELEASED
        to: DISTRIBUTED
        trigger: "system (every DistributionRecord with source_type SUBMITTAL and source_id == this submittal reaches ACKNOWLEDGED)"
        actor: system
        preconditions: []
        side_effects: ["increments Submittal.version by 1"]

      - from: DISTRIBUTED
        to: CLOSED
        trigger: "POST /v1/submittals/{submittalId}/close"
        actor: ProjectEngineer
        preconditions:
          - "review_status == DISTRIBUTED (ERR_SUBMITTAL_NOT_DISTRIBUTED)"
          - "no RFI with submittal_id == this submittal and status IN {OPEN, ROUTED} (ERR_OPEN_RFI_BLOCKS_CLOSE)"
        side_effects: ["increments Submittal.version by 1"]

      - from: [REGISTERED, IN_REVIEW, RETURNED_NEEDS_RESUBMIT]
        to: VOID
        trigger: "POST /v1/submittals/{submittalId}/void"
        actor: ProjectManager
        preconditions: ["review_status NOT IN {CLOSED, VOID, RELEASED, DISTRIBUTED} (ERR_SUBMITTAL_TERMINAL / ERR_SUBMITTAL_NOT_APPROVED-class state error)"]
        side_effects:
          - "any revision in SUBMITTED or UNDER_REVIEW -> SUPERSEDED; reviewer.open_review_count decremented for each UNDER_REVIEW revision voided"
          - "linked LongLeadItem (if any, non-terminal) -> CANCELLED"
          - "expediting_status -> NOT_REQUIRED"
          - "increments Submittal.version by 1"

  - entity: Submittal
    field: expediting_status
    initial_state: NOT_REQUIRED
    terminal_states: []
    transitions:
      - from: NOT_REQUIRED
        to: MONITORING
        trigger: "system (register generation when is_long_lead == true)"
        actor: system
        preconditions: []
        side_effects: []

      - from: MONITORING
        to: EXPEDITING
        trigger: "system (run-daily-scan: days until required_on_site_date <= project.expedite_window_days) OR POST /v1/long-lead-items/{itemId}/expedite"
        actor: "system or ProjectManager"
        preconditions: []
        side_effects: []

      - from: EXPEDITING
        to: ESCALATED
        trigger: "system (run-daily-scan or cascade recompute: linked LongLeadItem.escalation_level >= 2)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ESCALATED
        to: EXPEDITING
        trigger: "system (cascade recompute: escalation_level drops below 2, e.g. accepted schedule impact pushes required_on_site_date later)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [MONITORING, EXPEDITING, ESCALATED]
        to: CLEAR
        trigger: "system (linked LongLeadItem reaches DELIVERED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Submittal
    field: deferral_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: DEFERRAL_REQUESTED
        trigger: "POST /v1/submittals/{submittalId}/request-deferral"
        actor: ProjectEngineer
        preconditions:
          - "deferral_status == NONE (ERR_DEFERRAL_NOT_PENDING)"
          - "review_status IN {REGISTERED, RETURNED_NEEDS_RESUBMIT} (ERR_SUBMITTAL_NOT_APPROVED-class 409 otherwise)"
        side_effects: ["increments Submittal.version by 1"]

      - from: DEFERRAL_REQUESTED
        to: DEFERRED_APPROVED
        trigger: "POST /v1/submittals/{submittalId}/decide-deferral with decision == APPROVE"
        actor: ProjectManager
        preconditions: ["deferral_status == DEFERRAL_REQUESTED (ERR_DEFERRAL_NOT_PENDING)"]
        side_effects:
          - "DEFERRED_APPROVED submittals are exempt from begin-closeout blocking"
          - "expediting_priority_score of the linked LLI is halved (floor) while deferral is approved"
          - "increments Submittal.version by 1"

      - from: DEFERRAL_REQUESTED
        to: NONE
        trigger: "POST /v1/submittals/{submittalId}/decide-deferral with decision == REJECT"
        actor: ProjectManager
        preconditions: ["deferral_status == DEFERRAL_REQUESTED (ERR_DEFERRAL_NOT_PENDING)"]
        side_effects: ["increments Submittal.version by 1"]

  - entity: SubmittalRevision
    field: status
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /v1/revisions/{revisionId}/route"
        actor: ProjectEngineer
        preconditions:
          - "project.posture == ACTIVE (ERR_PROJECT_NOT_ACTIVE)"
          - "status == SUBMITTED (ERR_REVISION_NOT_SUBMITTED)"
          - "explicit reviewer_id: reviewer exists, reviewer_status == ACTIVE, discipline == section.required_discipline (ERR_DISCIPLINE_MISMATCH), open_review_count < review_capacity (ERR_REVIEWER_AT_CAPACITY)"
          - "omitted reviewer_id: reviewer_selector runs; empty candidate set -> ERR_NO_ELIGIBLE_REVIEWER"
        side_effects:
          - "reviewer_id set; routed_date = clock date; review_due_date = add_business_days(routed_date, section.review_days)"
          - "reviewer.open_review_count += 1"
          - "increments SubmittalRevision.version by 1"

      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /v1/revisions/{revisionId}/return"
        actor: Reviewer
        preconditions:
          - "status == UNDER_REVIEW (ERR_REVISION_NOT_UNDER_REVIEW)"
          - "acting X-User-ID == revision.reviewer_id (ERR_REVIEWER_NOT_ASSIGNED)"
        side_effects:
          - "action_code, return_comments stored; returned_date = clock date; is_late_return = returned_date > review_due_date"
          - "reviewer.open_review_count -= 1 (floor 0)"
          - "submittal.review_status -> APPROVED when action_code IN {A, B}; -> RETURNED_NEEDS_RESUBMIT when IN {C, D}; submittal.version += 1"
          - "increments SubmittalRevision.version by 1"

      - from: RETURNED
        to: SUPERSEDED
        trigger: "system (a newer revision is created on the same submittal; only C/D-returned revisions may be superseded)"
        actor: system
        preconditions: ["action_code IN {C, D}"]
        side_effects: []

  - entity: LongLeadItem
    field: status
    initial_state: IDENTIFIED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: IDENTIFIED
        to: QUOTED
        trigger: "POST /v1/long-lead-items/{itemId}/advance"
        actor: ProjectEngineer
        preconditions: ["status == IDENTIFIED (ERR_INVALID_REQUEST-class state error 409 ERR_LLI_INVALID_ADVANCE)", "to_status == QUOTED exactly one step forward"]
        side_effects: ["quoted_date = payload.actual_date", "recompute priority_score", "increments LongLeadItem.version by 1"]

      - from: QUOTED
        to: PO_ISSUED
        trigger: "POST /v1/long-lead-items/{itemId}/advance"
        actor: ProjectEngineer
        preconditions: ["status == QUOTED", "to_status == PO_ISSUED"]
        side_effects: ["po_issued_date = payload.actual_date", "recompute priority_score", "increments LongLeadItem.version by 1"]

      - from: PO_ISSUED
        to: IN_PRODUCTION
        trigger: "POST /v1/long-lead-items/{itemId}/advance"
        actor: ProjectEngineer
        preconditions: ["status == PO_ISSUED", "to_status == IN_PRODUCTION"]
        side_effects: ["recompute priority_score", "increments LongLeadItem.version by 1"]

      - from: IN_PRODUCTION
        to: SHIPPED
        trigger: "POST /v1/long-lead-items/{itemId}/advance"
        actor: ProjectEngineer
        preconditions: ["status == IN_PRODUCTION", "to_status == SHIPPED"]
        side_effects: ["shipped_date = payload.actual_date", "recompute priority_score", "increments LongLeadItem.version by 1"]

      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /v1/long-lead-items/{itemId}/advance"
        actor: ProjectEngineer
        preconditions: ["status == SHIPPED", "to_status == DELIVERED"]
        side_effects:
          - "delivered_date = payload.actual_date; days_late -> 0; escalation_level -> 0; priority_score recomputed"
          - "submittal.expediting_status -> CLEAR"
          - "increments LongLeadItem.version by 1"

      - from: [IDENTIFIED, QUOTED, PO_ISSUED, IN_PRODUCTION, SHIPPED]
        to: CANCELLED
        trigger: "system (parent submittal voided)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RFI
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED, VOID]
    transitions:
      - from: OPEN
        to: ROUTED
        trigger: "POST /v1/rfis/{rfiId}/route"
        actor: ProjectEngineer
        preconditions:
          - "project.posture == ACTIVE (ERR_PROJECT_NOT_ACTIVE)"
          - "status == OPEN (ERR_RFI_INVALID_STATE)"
          - "explicit reviewer_id: ACTIVE reviewer, discipline == rfi.required_discipline (ERR_DISCIPLINE_MISMATCH)"
          - "omitted reviewer_id: reviewer_selector (capacity-aware); empty set -> ERR_NO_ELIGIBLE_REVIEWER"
        side_effects: ["routed_reviewer_id set; routed_date = clock date", "increments RFI.version by 1"]

      - from: ROUTED
        to: ANSWERED
        trigger: "POST /v1/rfis/{rfiId}/answer"
        actor: Reviewer
        preconditions:
          - "project.posture == ACTIVE"
          - "status == ROUTED (ERR_RFI_INVALID_STATE)"
          - "acting X-User-ID == rfi.routed_reviewer_id (ERR_REVIEWER_NOT_ASSIGNED)"
          - "cost_impact_flag true requires estimated_cost_cents present (ERR_INVALID_REQUEST); schedule_impact_flag true requires estimated_schedule_days present (ERR_INVALID_REQUEST)"
        side_effects:
          - "answer_text/answered_date/answered_by_reviewer_id/flags stored; is_late_answer = answered_date > due_date"
          - "if cost_impact_flag: create ImpactAssessment (status ESTIMATED, estimated_cost_cents from answer, provisional_delta_cents via impact_cost_delta PROVISIONAL)"
          - "increments RFI.version by 1"

      - from: ANSWERED
        to: ROUTED
        trigger: "POST /v1/rfis/{rfiId}/reopen — clarification cycle (cyclic)"
        actor: ProjectEngineer
        preconditions:
          - "project.posture == ACTIVE"
          - "status == ANSWERED (ERR_RFI_INVALID_STATE)"
          - "no ImpactAssessment with rfi_id == this RFI and status IN {PRICED, DISPUTED} (ERR_REOPEN_BLOCKED_BY_PRICED_ASSESSMENT — a held reservation must be waived or accepted first)"
        side_effects:
          - "cycle_count += 1; answer fields cleared (answer_text, answered_date, answered_by_reviewer_id, flags, estimated_schedule_days -> null/false); is_overdue -> false"
          - "due_date = add_business_days(clock date, project.rfi_response_days)"
          - "an ImpactAssessment of this RFI still in ESTIMATED is auto-voided to WAIVED (no reservation exists at ESTIMATED, so the ledger is untouched); an RFI has at most one non-terminal assessment at any moment"
          - "increments RFI.version by 1"

      - from: ANSWERED
        to: CLOSED
        trigger: "POST /v1/rfis/{rfiId}/close"
        actor: ProjectEngineer
        preconditions:
          - "status == ANSWERED (ERR_RFI_INVALID_STATE)"
          - "no ImpactAssessment with rfi_id == this RFI and status IN {ESTIMATED, PRICED, DISPUTED} (ERR_ASSESSMENT_OPEN_ON_CLOSE)"
        side_effects: ["increments RFI.version by 1"]

      - from: [OPEN, ROUTED, ANSWERED]
        to: VOID
        trigger: "POST /v1/rfis/{rfiId}/void"
        actor: ProjectManager
        preconditions: ["status NOT IN {CLOSED, VOID} (ERR_RFI_INVALID_STATE)"]
        side_effects: ["increments RFI.version by 1"]

  - entity: ImpactAssessment
    field: status
    initial_state: ESTIMATED
    terminal_states: [ACCEPTED, WAIVED]
    transitions:
      - from: ESTIMATED
        to: PRICED
        trigger: "POST /v1/impact-assessments/{assessmentId}/price"
        actor: ProjectEngineer
        preconditions:
          - "status == ESTIMATED (ERR_ASSESSMENT_NOT_ESTIMATED)"
          - "contingency_available_cents >= final_delta_cents (ERR_CONTINGENCY_EXHAUSTED) — fiscal check AFTER state check"
        side_effects:
          - "gc_markup_tier selected per contingency_ledger_update evaluation order (spent BEFORE this reservation); final_delta_cents computed via impact_cost_delta FINAL"
          - "project.contingency_reserved_cents += final_delta_cents; contingency_available_cents recomputed; project.version += 1"
          - "priced_by_user_id = acting X-User-ID; price_cycle = 1"
          - "increments ImpactAssessment.version by 1"

      - from: DISPUTED
        to: PRICED
        trigger: "POST /v1/impact-assessments/{assessmentId}/reprice — negotiation loop"
        actor: ProjectEngineer
        preconditions:
          - "status == DISPUTED (ERR_ASSESSMENT_NOT_PRICED-class: reprice requires DISPUTED)"
          - "incremental reservation (new_final_delta - old_final_delta) <= contingency_available_cents when positive (ERR_CONTINGENCY_EXHAUSTED)"
        side_effects:
          - "contingency_reserved_cents adjusted by (new_final_delta - old_final_delta); available recomputed; project.version += 1"
          - "priced_by_user_id overwritten; price_cycle += 1"
          - "increments ImpactAssessment.version by 1"

      - from: PRICED
        to: ACCEPTED
        trigger: "POST /v1/impact-assessments/{assessmentId}/accept"
        actor: ProjectManager
        preconditions:
          - "status == PRICED (ERR_ASSESSMENT_NOT_PRICED)"
          - "acting X-User-ID != priced_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "ledger: contingency_reserved_cents -= final_delta_cents; contingency_spent_cents += final_delta_cents; available recomputed; project.version += 1"
          - "decided_by_user_id = acting X-User-ID"
          - "SCHEDULE CASCADE (when the source RFI has schedule_impact_flag true and estimated_schedule_days d > 0): every PLANNED InstallationActivity with submittal_id == rfi.submittal_id shifts +d calendar days (start/end, shift_applied_days += d); the linked Submittal.required_on_site_date shifts +d and required_approval_date/required_submission_date recompute via submittal_required_dates (submittal.version += 1); the linked LongLeadItem recomputes days_late/escalation_level/priority_score (version += 1) and appends EscalationEvent LLI_ESCALATION_RAISED or LLI_ESCALATION_CLEARED when the tier changes; submittal.expediting_status re-evaluates"
          - "increments ImpactAssessment.version by 1"

      - from: PRICED
        to: WAIVED
        trigger: "POST /v1/impact-assessments/{assessmentId}/waive"
        actor: ProjectManager
        preconditions: ["status == PRICED (ERR_ASSESSMENT_NOT_PRICED)"]
        side_effects:
          - "compensation: contingency_reserved_cents -= final_delta_cents (freed); available recomputed; project.version += 1"
          - "decided_by_user_id = acting X-User-ID"
          - "increments ImpactAssessment.version by 1"

      - from: PRICED
        to: DISPUTED
        trigger: "POST /v1/impact-assessments/{assessmentId}/dispute"
        actor: OwnerRep
        preconditions: ["status == PRICED (ERR_ASSESSMENT_NOT_PRICED)"]
        side_effects: ["decided_by_user_id = acting X-User-ID (reservation HELD while disputed)", "increments ImpactAssessment.version by 1"]

  - entity: DistributionRecord
    field: status
    initial_state: QUEUED
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /v1/distribution-records/{recordId}/send"
        actor: ProjectEngineer
        preconditions: ["status == QUEUED (ERR_DISTRIBUTION_NOT_QUEUED)"]
        side_effects: ["sent_date = clock date; ack_due_date = add_business_days(sent_date, project.ack_required_days)", "increments DistributionRecord.version by 1"]

      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /v1/distribution-records/{recordId}/acknowledge"
        actor: SubcontractorRep
        preconditions:
          - "status == SENT (ERR_DISTRIBUTION_NOT_SENT)"
          - "acting X-User-ID == record.subcontractor_id (ERR_WRONG_SUBCONTRACTOR)"
        side_effects:
          - "acknowledged_date = clock date"
          - "when this record's source is a SUBMITTAL and all sibling records are ACKNOWLEDGED: submittal.review_status RELEASED -> DISTRIBUTED"
          - "increments DistributionRecord.version by 1"

  - entity: InstallationActivity
    field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: RELEASED
        trigger: "POST /v1/installation-activities/{activityId}/release"
        actor: ProjectManager
        preconditions:
          - "project.posture == ACTIVE (ERR_PROJECT_NOT_ACTIVE)"
          - "status == PLANNED (ERR_ACTIVITY_NOT_PLANNED)"
          - "business_temporal: crew_window_conflict_check passes for the current window (ERR_CREW_WINDOW_CONFLICT)"
          - "business_referential: submittal.review_status IN {RELEASED, DISTRIBUTED, CLOSED} (ERR_SUBMITTAL_NOT_RELEASED)"
          - "business_referential: no RFI with submittal_id == activity.submittal_id and status IN {OPEN, ROUTED} (ERR_OPEN_RFI_BLOCKS_RELEASE)"
          - "business_referential: when submittal.is_long_lead, linked LongLeadItem.status == DELIVERED (ERR_LONG_LEAD_NOT_DELIVERED)"
        side_effects: ["increments InstallationActivity.version by 1"]

      - from: RELEASED
        to: COMPLETED
        trigger: "POST /v1/installation-activities/{activityId}/complete"
        actor: ProjectEngineer
        preconditions: ["status == RELEASED (ERR_ACTIVITY_NOT_RELEASED)"]
        side_effects: ["increments InstallationActivity.version by 1"]

      - from: [PLANNED, RELEASED]
        to: CANCELLED
        trigger: "POST /v1/installation-activities/{activityId}/cancel"
        actor: ProjectManager
        preconditions: ["status IN {PLANNED, RELEASED} (ERR_ACTIVITY_NOT_PLANNED-class 409)"]
        side_effects: ["cancelled windows no longer participate in crew_window_conflict_check", "increments InstallationActivity.version by 1"]

  - entity: OwnerReport
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /v1/owner-reports/{reportId}/publish"
        actor: ProjectEngineer
        preconditions: ["status == DRAFT (ERR_REPORT_NOT_DRAFT)"]
        side_effects:
          - "snapshot_metrics frozen via owner_report_metrics SNAPSHOT variant; published_at = clock timestamp"
          - "increments OwnerReport.version by 1"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (a new OwnerReport is created whose [period_start, period_end] inclusive interval overlaps this report's)"
        actor: system
        preconditions: []
        side_effects: ["superseded_by_report_id set to the new report id"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: rfi-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /v1/projects/{projectId}/rfis"
    occ_field: expected_project_version
    description: |
      Creating an RFI against a Project whose version has advanced since the
      client last observed it is rejected. Creating a second RFI legitimately
      mints the next rfi_number and advances the project; a create carrying a
      previously observed version is therefore stale and must be refused.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: revision-create-stale-submittal
    parent_entity: Submittal
    write_endpoint: "POST /v1/submittals/{submittalId}/revisions"
    occ_field: expected_submittal_version
    description: |
      Creating a revision against a Submittal whose version has advanced since
      the client last observed it is rejected. A new revision legitimately
      supersedes a C/D-returned predecessor and advances the submittal; a create
      carrying a previously observed version is stale and must be refused.
    error_id: ERR_STALE_SUBMITTAL_VERSION
    http_status: 412

  - rule_id: report-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /v1/projects/{projectId}/owner-reports"
    occ_field: expected_project_version
    description: |
      Creating an OwnerReport against a Project whose version has advanced
      since the client last observed it is rejected. A new report whose period
      overlaps a PUBLISHED report legitimately supersedes it; a create carrying
      a previously observed version is stale and must be refused.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: submittal_required_dates
    trigger: "register generation; PATCH /v1/submittals/{id} changing required_on_site_date; accepted-schedule-impact cascade"
    algorithm: chronological
    formula: |
      Backward business-day pass. Business day = Mon-Fri whose YYYY-MM-DD is not in project.holiday_dates.
      required_approval_date  = step back section.lead_time_days business days from required_on_site_date (required_on_site_date itself is not counted)
      required_submission_date = step back section.review_days business days from required_approval_date
      Evaluation order is pinned: approval first, submission second (submission depends on approval, never the reverse).
    input_set: "the Submittal, its SpecSection (lead_time_days, review_days), its Project (holiday_dates)"
    constants: {}
    precision: "date granularity (YYYY-MM-DD), no rounding"

  - name: rfi_due_date
    trigger: "RFI creation; RFI reopen"
    algorithm: chronological
    formula: |
      Forward business-day pass over the project calendar.
      due_date = advance project.rfi_response_days business days from the opened/reopen clock date (the opened day is day 0 and is not counted).
      On-time rule: answered_date <= due_date is ON TIME; answered_date > due_date is late (is_late_answer). Boundary is inclusive.
    input_set: "the RFI, its Project (rfi_response_days, holiday_dates)"
    constants: {}
    precision: "date granularity (YYYY-MM-DD)"

  - name: business_day_duration
    trigger: "owner_report_metrics (avg_rfi_response_days)"
    algorithm: chronological
    formula: |
      duration(opened_date, answered_date) = count of business days d with opened_date < d <= answered_date
      (open on the opened date, closed on the answered date). Same-day answer => 0.
    input_set: "RFI opened_date/answered_date, Project holiday_dates"
    constants: {}
    precision: "integer business days"

  - name: impact_cost_delta
    trigger: "RFI answer with cost_impact_flag (PROVISIONAL); price/reprice (FINAL)"
    algorithm: tiered_pricing
    formula: |
      Layered markup with pinned per-layer rounding (each layer rounds to whole cents, round_half_up, BEFORE the next layer):
        layer1 = round(sub_base * (1 + SUB_MARKUP_PCT))
        layer2 = round(layer1 * (1 + gc_markup))            # gc_markup = GC_MARKUP_TIER1 or GC_MARKUP_TIER2 by tier rule below
        (PROVISIONAL only) layer2a = round(layer2 * (1 + CONTINGENCY_ALLOWANCE_PCT)); FINAL skips this layer (layer2a := layer2)
        delta  = round(layer2a * (1 + BOND_PCT))
      Tier rule (FINAL only): gc_markup = GC_MARKUP_TIER2 when project.contingency_spent_cents >= project.gc_tier_threshold_cents
      evaluated BEFORE this pricing's reservation; else GC_MARKUP_TIER1. PROVISIONAL always uses GC_MARKUP_TIER1.
      PROVISIONAL base = estimated_cost_cents; FINAL base = sub_quote_cents.
    input_set: "the ImpactAssessment, its Project (contingency_spent_cents, gc_tier_threshold_cents)"
    constants:
      SUB_MARKUP_PCT: 0.10
      GC_MARKUP_TIER1: 0.05
      GC_MARKUP_TIER2: 0.07
      BOND_PCT: 0.02
      CONTINGENCY_ALLOWANCE_PCT: 0.15
    precision: "whole cents (integer), round_half_up after every layer"
    variants:
      - name: PROVISIONAL
        when: "auto-created at RFI answer time"
        difference: "uses estimated_cost_cents, always tier 1, and includes the contingency-allowance layer — produces a different value than FINAL for numerically identical bases (e.g. 100000 -> 135482 provisional vs 117810 final tier-1)"
      - name: FINAL
        when: "price / reprice"
        difference: "uses sub_quote_cents, tier selected from spent ledger, no allowance layer"

  - name: escalation_level
    trigger: "run-daily-scan; LongLeadItem advance; accepted-schedule-impact cascade; register generation"
    algorithm: threshold
    formula: |
      days_late = 0 when status == DELIVERED or clock_date <= required_on_site_date; else (clock_date - required_on_site_date) in calendar days.
      level = 0 when days_late == 0
            = 1 when 1 <= days_late <= 6
            = 2 when 7 <= days_late <= 13
            = 3 when days_late >= 14
      Boundaries are inclusive lower: exactly 7 -> 2, exactly 14 -> 3. Events fire only on level CHANGE.
    input_set: "the LongLeadItem and the clock"
    constants:
      L2_MIN_DAYS: 7
      L3_MIN_DAYS: 14
    precision: "integer calendar days"

  - name: expediting_priority_score
    trigger: "run-daily-scan; LongLeadItem advance/PATCH; deferral approval; required_on_site_date shifts"
    algorithm: weighted_scoring
    formula: |
      raw = W_LATE * min(days_late, LATE_CAP_DAYS) + W_CRIT * criticality_points + W_FLOAT * max(0, -remaining_float_days)
      where criticality_points = {CRITICAL: 40, HIGH: 20, STANDARD: 0}
      and remaining_float_days = (required_on_site_date - clock_date) in calendar days (negative when late).
      When the parent submittal.deferral_status == DEFERRED_APPROVED: score = floor(raw / 2).
      Otherwise score = raw. Final clamp: min(100, max(0, score)).
    input_set: "the LongLeadItem, its Submittal (deferral_status), the clock"
    constants:
      W_LATE: 3
      LATE_CAP_DAYS: 20
      W_CRIT: 1
      W_FLOAT: 2
      SCORE_CAP: 100
    precision: "integer; floor division for the deferred halving"

  - name: reviewer_selector
    trigger: "POST /v1/revisions/{id}/route or POST /v1/rfis/{id}/route with reviewer_id omitted"
    algorithm: constraint_propagation
    formula: |
      candidates = Reviewers of the project with reviewer_status == ACTIVE
                   AND discipline == required_discipline (section's for revisions; rfi's for RFIs)
                   AND open_review_count < review_capacity   (strictly less; == capacity is excluded)
      ranking = open_review_count ASC, then created_at ASC
      selected = first of ranking
      empty candidate set -> ERR_NO_ELIGIBLE_REVIEWER (no fallback assignment)
    input_set: "project Reviewers; required discipline"
    constants: {}
    precision: "deterministic selector; created_at is the only tie-break (never id)"

  - name: crew_window_conflict_check
    trigger: "POST /v1/installation-activities (create); POST /v1/installation-activities/{id}/release (re-check)"
    algorithm: interval_merge
    formula: |
      Windows are half-open [start_date, end_date). For the candidate window W and every other
      InstallationActivity X with X.subcontractor_id == W.subcontractor_id and X.status NOT IN {CANCELLED} and X.id != W.id:
        conflict iff W.start_date < X.end_date + project.mobilization_buffer_days
                 AND X.start_date < W.end_date + project.mobilization_buffer_days
      i.e. a calendar gap of exactly mobilization_buffer_days is ALLOWED (gap >= buffer passes; gap < buffer conflicts).
    input_set: "InstallationActivities of the same subcontractor (excluding CANCELLED), Project mobilization_buffer_days"
    constants: {}
    precision: "date granularity"

  - name: contingency_ledger_update
    trigger: "price, reprice, accept, waive on ImpactAssessment"
    algorithm: aggregation
    formula: |
      Conserved quantity: contingency_available_cents + contingency_reserved_cents + contingency_spent_cents == initial_contingency_cents at all times.
      Evaluation order pinned (circular-looking dependency resolved):
        1. spent_before = project.contingency_spent_cents (BEFORE this operation)
        2. gc tier = 2 when spent_before >= gc_tier_threshold_cents else 1
        3. final_delta = impact_cost_delta FINAL(sub_quote_cents, tier)
        4. price:   reserved += final_delta           (requires available >= final_delta else ERR_CONTINGENCY_EXHAUSTED)
           reprice: reserved += (new_final - old_final) (requires available >= positive increment)
           accept:  reserved -= final_delta; spent += final_delta   (available unchanged)
           waive:   reserved -= final_delta                          (available increases)
    input_set: "Project ledger fields, the ImpactAssessment"
    constants: {}
    precision: "whole cents"

  - name: owner_report_metrics
    trigger: "OwnerReport publish (SNAPSHOT); GET /v1/owner-reports/{id}/metrics?view=live (LIVE)"
    algorithm: aggregation
    formula: |
      metrics =
        open_submittals        = count Submittal of project with review_status NOT IN {CLOSED, VOID}
        overdue_rfis           = count RFI of project with is_overdue == true
        avg_rfi_response_days  = mean of business_day_duration(opened_date, answered_date) over RFIs with
                                 status IN {ANSWERED, CLOSED} AND answered_date within [period_start, period_end] inclusive;
                                 2 decimal places round_half_up; empty set -> 0.00
        first_pass_yield_pct   = over submittals whose revision_number 0 revision has returned_date within the period:
                                 100 * (count with action_code IN {A,B}) / (count returned); 1 decimal round_half_up; empty -> 0.0
        open_escalation_events = count EscalationEvent of project with event_date <= period_end
    input_set: "project's Submittals, RFIs, SubmittalRevisions, EscalationEvents"
    constants: {}
    precision: "counts integer; averages 2dp round_half_up; yield 1dp round_half_up"
    variants:
      - name: SNAPSHOT
        when: "frozen into snapshot_metrics at publish"
        difference: "never changes after publish — reflects the DB at publish time"
      - name: LIVE
        when: "GET metrics?view=live"
        difference: "recomputed from current data — diverges from SNAPSHOT once underlying entities mutate after publish"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Entity-backed ownership: SubcontractorRep X-User-ID must equal the responsible subcontractor (revision create) or record.subcontractor_id (acknowledge) -> ERR_WRONG_SUBCONTRACTOR; Reviewer X-User-ID must equal the assigned reviewer (revision return, RFI answer) -> ERR_REVIEWER_NOT_ASSIGNED"
    error_id: "ERR_WRONG_SUBCONTRACTOR | ERR_REVIEWER_NOT_ASSIGNED"
    http_status: 403
    applies_to: "POST /v1/submittals/{id}/revisions, POST /v1/distribution-records/{id}/acknowledge, POST /v1/revisions/{id}/return, POST /v1/rfis/{id}/answer"

  - priority: 4
    category: existence
    check: "Path ids validated left-to-right; then body FK ids (spec_section_id, submittal_id, reviewer_id, subcontractor_id) must exist within the same project"
    error_id: "ERR_PROJECT_NOT_FOUND | ERR_SPEC_SECTION_NOT_FOUND | ERR_SUBCONTRACTOR_NOT_FOUND | ERR_REVIEWER_NOT_FOUND | ERR_SUBMITTAL_NOT_FOUND | ERR_REVISION_NOT_FOUND | ERR_RFI_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_ACTIVITY_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_LONG_LEAD_ITEM_NOT_FOUND | ERR_DISTRIBUTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path/body resource references"

  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present, types correct, enum members valid, array members valid and non-duplicate (required_submittal_kinds)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_project_version / expected_submittal_version must equal the parent's current version"
    error_id: "ERR_STALE_PROJECT_VERSION | ERR_STALE_SUBMITTAL_VERSION"
    http_status: 412
    applies_to: "POST /v1/projects/{id}/rfis, POST /v1/projects/{id}/owner-reports, POST /v1/submittals/{id}/revisions"

  - priority: 7
    category: state
    check: "Project posture gate: child mutations require posture == ACTIVE (register generation also allows SETUP; owner-report create/publish also allows CLOSEOUT)"
    error_id: ERR_PROJECT_NOT_ACTIVE
    http_status: 409
    applies_to: "all child-creating/mutating endpoints (submittals, revisions, rfis, answers, impacts, distributions, activities, scans, reports)"

  - priority: 8
    category: state
    check: "Target entity must be in the transition's from-state (ERR_INVALID_PROJECT_STATE, ERR_SPEC_SECTION_NOT_DRAFT, ERR_SPEC_SECTION_NOT_ACTIVE, ERR_SUBMITTAL_NOT_ACCEPTING_REVISIONS, ERR_SUBMITTAL_NOT_APPROVED, ERR_SUBMITTAL_NOT_DISTRIBUTED, ERR_SUBMITTAL_TERMINAL, ERR_REVISION_NOT_SUBMITTED, ERR_REVISION_NOT_UNDER_REVIEW, ERR_RFI_INVALID_STATE, ERR_ASSESSMENT_NOT_ESTIMATED, ERR_ASSESSMENT_NOT_PRICED, ERR_DISTRIBUTION_NOT_QUEUED, ERR_DISTRIBUTION_NOT_SENT, ERR_ACTIVITY_NOT_PLANNED, ERR_ACTIVITY_NOT_RELEASED, ERR_REPORT_NOT_DRAFT, ERR_DEFERRAL_NOT_PENDING, ERR_LLI_INVALID_ADVANCE)"
    error_id: "state-specific (see check)"
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: accept requires acting X-User-ID != assessment.priced_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /v1/impact-assessments/{id}/accept"

  - priority: 10
    category: business_constraint
    check: "Discipline match (ERR_DISCIPLINE_MISMATCH), reviewer capacity (ERR_REVIEWER_AT_CAPACITY), selector empty pool (ERR_NO_ELIGIBLE_REVIEWER), subcontractor standing SUSPENDED blocks revision submit (ERR_SUBCONTRACTOR_SUSPENDED), duplicate distribution (ERR_ALREADY_DISTRIBUTED), empty affected set on RFI distribute (ERR_NO_DISTRIBUTION_TARGETS)"
    error_id: "see check"
    http_status: 409
    applies_to: "route endpoints, POST revisions, POST /v1/rfis/{id}/distribute"

  - priority: 11
    category: business_temporal
    check: "end_date > start_date (ERR_INVALID_DATE_RANGE, 400); crew_window_conflict_check (ERR_CREW_WINDOW_CONFLICT, 409)"
    error_id: "ERR_INVALID_DATE_RANGE | ERR_CREW_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /v1/projects/{id}/installation-activities, POST /v1/installation-activities/{id}/release, POST /v1/projects/{id}/owner-reports"

  - priority: 12
    category: business_referential
    check: "Release gates: submittal RELEASED-class (ERR_SUBMITTAL_NOT_RELEASED), no OPEN/ROUTED RFI on the submittal (ERR_OPEN_RFI_BLOCKS_RELEASE), long-lead delivered (ERR_LONG_LEAD_NOT_DELIVERED); close gates (ERR_OPEN_RFI_BLOCKS_CLOSE, ERR_ASSESSMENT_OPEN_ON_CLOSE); reopen guard (ERR_REOPEN_BLOCKED_BY_PRICED_ASSESSMENT); begin-closeout blockers (ERR_CLOSEOUT_BLOCKED)"
    error_id: "see check"
    http_status: 409
    applies_to: "release/close/begin-closeout endpoints"

  - priority: 13
    category: business_fiscal
    check: "Contingency: reservation must fit contingency_available_cents"
    error_id: ERR_CONTINGENCY_EXHAUSTED
    http_status: 402
    applies_to: "POST /v1/impact-assessments/{id}/price, POST /v1/impact-assessments/{id}/reprice"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Project ---
  - method: POST
    path: "/v1/projects"
    description: "Create a project (posture SETUP). Defaults per §1.1."
    roles: [PlatformAdmin]
    code: 201
    input: [project_name, "contract_start_date?", "rfi_response_days?", "ack_required_days?", "mobilization_buffer_days?", "long_lead_threshold_days?", "expedite_window_days?", "holiday_dates?", "initial_contingency_cents?", "gc_tier_threshold_cents?"]
    output: Project
    side_effects: ["ledger fields initialized to 0 / available = initial"]

  - method: GET
    path: "/v1/projects"
    description: "List projects (created_at ASC)"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "Project[]"
    side_effects: []

  - method: GET
    path: "/v1/projects/{projectId}"
    description: "Get one project"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: PATCH
    path: "/v1/projects/{projectId}"
    description: "Update calendar/threshold settings; only while posture == SETUP (ERR_INVALID_PROJECT_STATE)"
    roles: [PlatformAdmin]
    code: 200
    input: ["project_name?", "contract_start_date?", "rfi_response_days?", "ack_required_days?", "mobilization_buffer_days?", "long_lead_threshold_days?", "expedite_window_days?", "holiday_dates?", "initial_contingency_cents?", "gc_tier_threshold_cents?"]
    output: Project
    side_effects: ["increments Project.version by 1"]

  - method: POST
    path: "/v1/projects/{projectId}/activate"
    description: "SETUP -> ACTIVE"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["posture -> ACTIVE", "increments Project.version by 1"]

  - method: POST
    path: "/v1/projects/{projectId}/suspend"
    description: "ACTIVE -> SUSPENDED (blocks child mutations)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["posture -> SUSPENDED", "increments Project.version by 1"]

  - method: POST
    path: "/v1/projects/{projectId}/resume"
    description: "SUSPENDED -> ACTIVE"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["posture -> ACTIVE", "increments Project.version by 1"]

  - method: POST
    path: "/v1/projects/{projectId}/begin-closeout"
    description: "ACTIVE -> CLOSEOUT with full open-item gate (ERR_CLOSEOUT_BLOCKED)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["posture -> CLOSEOUT", "increments Project.version by 1"]

  - method: POST
    path: "/v1/projects/{projectId}/close"
    description: "CLOSEOUT -> CLOSED"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["posture -> CLOSED", "increments Project.version by 1"]

  - method: POST
    path: "/v1/projects/{projectId}/run-daily-scan"
    description: "Ops-run checkpoint. Requires posture == ACTIVE. Marks overdue RFIs (status IN {OPEN, ROUTED} and clock date > due_date -> is_overdue, RFI_OVERDUE event once per RFI per current answer cycle), recomputes LongLeadItems with status NOT IN {DELIVERED, CANCELLED} (days_late/escalation_level/priority_score; LLI_ESCALATION_RAISED/CLEARED events on tier change; submittal.expediting_status re-evaluated), flags overdue DistributionRecords (status == SENT and clock date > ack_due_date -> is_overdue latched once, DIST_ACK_OVERDUE event, subcontractor.late_ack_count += 1, standing recompute with SUBCONTRACTOR_WATCH/SUSPENDED events), auto-advances submittal expediting MONITORING->EXPEDITING when clock date is within expedite_window_days of required_on_site_date"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["ops_scan_index += 1", "increments Project.version by 1", "per-item effects listed in description"]

  # --- SpecSection ---
  - method: POST
    path: "/v1/projects/{projectId}/spec-sections"
    description: "Create a spec section (status DRAFT). Allowed in SETUP or ACTIVE."
    roles: [ProjectEngineer]
    code: 201
    input: [section_number, "title?", "lead_time_days?", "review_days?", "required_discipline?", "default_need_date?", "responsible_subcontractor_id?", "required_submittal_kinds?"]
    output: SpecSection
    side_effects: []

  - method: GET
    path: "/v1/projects/{projectId}/spec-sections"
    description: "List spec sections of a project"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "SpecSection[]"
    side_effects: []

  - method: GET
    path: "/v1/spec-sections"
    description: "Filtered list of spec sections"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: ["project_id?", "responsible_subcontractor_id?", "status?", "limit?", "offset?"]
    output: "SpecSection[]"
    side_effects: []

  - method: GET
    path: "/v1/spec-sections/{sectionId}"
    description: "Get one spec section"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: []
    output: SpecSection
    side_effects: []

  - method: PATCH
    path: "/v1/spec-sections/{sectionId}"
    description: "Edit section attributes; only while status == DRAFT (ERR_SPEC_SECTION_NOT_DRAFT)"
    roles: [ProjectEngineer]
    code: 200
    input: ["section_number?", "title?", "lead_time_days?", "review_days?", "required_discipline?", "default_need_date?", "responsible_subcontractor_id?", "required_submittal_kinds?"]
    output: SpecSection
    side_effects: ["increments SpecSection.version by 1"]

  - method: POST
    path: "/v1/spec-sections/{sectionId}/activate"
    description: "DRAFT -> ACTIVE; generates the submittal register (one Submittal per required kind) and LongLeadItems for long-lead items"
    roles: [ProjectEngineer]
    code: 200
    input: []
    output: SpecSection
    side_effects: ["register generation per state machine", "increments SpecSection.version by 1"]

  - method: POST
    path: "/v1/spec-sections/{sectionId}/lock"
    description: "ACTIVE -> LOCKED (freeze register generation)"
    roles: [ProjectEngineer]
    code: 200
    input: []
    output: SpecSection
    side_effects: ["increments SpecSection.version by 1"]

  # --- Subcontractor ---
  - method: POST
    path: "/v1/projects/{projectId}/subcontractors"
    description: "Create a subcontractor (standing GOOD, late_ack_count 0)"
    roles: [ProjectEngineer]
    code: 201
    input: [company_name, trade, "contact_email?"]
    output: Subcontractor
    side_effects: []

  - method: GET
    path: "/v1/projects/{projectId}/subcontractors"
    description: "List subcontractors of a project"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "Subcontractor[]"
    side_effects: []

  - method: GET
    path: "/v1/subcontractors"
    description: "Filtered list of subcontractors"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: ["project_id?", "standing?", "limit?", "offset?"]
    output: "Subcontractor[]"
    side_effects: []

  - method: GET
    path: "/v1/subcontractors/{subcontractorId}"
    description: "Get one subcontractor"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: []
    output: Subcontractor
    side_effects: []

  # --- Reviewer ---
  - method: POST
    path: "/v1/projects/{projectId}/reviewers"
    description: "Create a design-team reviewer (reviewer_status ACTIVE, open_review_count 0)"
    roles: [ProjectManager]
    code: 201
    input: [display_name, discipline, "review_capacity?"]
    output: Reviewer
    side_effects: []

  - method: GET
    path: "/v1/projects/{projectId}/reviewers"
    description: "List reviewers of a project"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "Reviewer[]"
    side_effects: []

  - method: GET
    path: "/v1/reviewers"
    description: "Filtered list of reviewers"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: ["project_id?", "discipline?", "reviewer_status?", "limit?", "offset?"]
    output: "Reviewer[]"
    side_effects: []

  - method: GET
    path: "/v1/reviewers/{reviewerId}"
    description: "Get one reviewer"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: []
    output: Reviewer
    side_effects: []

  - method: PATCH
    path: "/v1/reviewers/{reviewerId}"
    description: "Update reviewer_status / review_capacity. Deactivation keeps held reviews."
    roles: [ProjectManager]
    code: 200
    input: ["reviewer_status?", "review_capacity?"]
    output: Reviewer
    side_effects: ["increments Reviewer.version by 1"]

  # --- Submittal ---
  - method: GET
    path: "/v1/projects/{projectId}/submittals"
    description: "List submittals of a project (created_at ASC)"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "Submittal[]"
    side_effects: []

  - method: GET
    path: "/v1/submittals"
    description: "Filtered list of submittals"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: ["project_id?", "spec_section_id?", "review_status?", "is_long_lead?", "limit?", "offset?"]
    output: "Submittal[]"
    side_effects: []

  - method: GET
    path: "/v1/submittals/{submittalId}"
    description: "Get one submittal"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: []
    output: Submittal
    side_effects: []

  - method: PATCH
    path: "/v1/submittals/{submittalId}"
    description: "Change required_on_site_date while review_status NOT IN {CLOSED, VOID}; recomputes required dates and the linked LongLeadItem (dates/days_late/escalation/priority)"
    roles: [ProjectEngineer]
    code: 200
    input: ["required_on_site_date?"]
    output: Submittal
    side_effects: ["submittal_required_dates recompute", "LLI mirror recompute", "increments Submittal.version by 1"]

  - method: POST
    path: "/v1/submittals/{submittalId}/request-deferral"
    description: "deferral_status NONE -> DEFERRAL_REQUESTED"
    roles: [ProjectEngineer]
    code: 200
    input: [reason]
    output: Submittal
    side_effects: ["increments Submittal.version by 1"]

  - method: POST
    path: "/v1/submittals/{submittalId}/decide-deferral"
    description: "DEFERRAL_REQUESTED -> DEFERRED_APPROVED (decision=APPROVE) or -> NONE (decision=REJECT)"
    roles: [ProjectManager]
    code: 200
    input: [decision]
    output: Submittal
    side_effects: ["increments Submittal.version by 1", "on APPROVE: linked LLI priority_score halved on next recompute"]

  - method: POST
    path: "/v1/submittals/{submittalId}/release-for-construction"
    description: "APPROVED -> RELEASED; auto-creates QUEUED DistributionRecords for the affected-subcontractor set (fixed at release)"
    roles: [ProjectEngineer]
    code: 200
    input: []
    output: Submittal
    side_effects: ["distribution record creation per state machine", "increments Submittal.version by 1"]

  - method: POST
    path: "/v1/submittals/{submittalId}/void"
    description: "REGISTERED/IN_REVIEW/RETURNED_NEEDS_RESUBMIT -> VOID; supersedes open revisions, cancels the LLI"
    roles: [ProjectManager]
    code: 200
    input: ["reason?"]
    output: Submittal
    side_effects: ["revision supersede + reviewer count release", "LLI -> CANCELLED", "expediting_status -> NOT_REQUIRED", "increments Submittal.version by 1"]

  - method: POST
    path: "/v1/submittals/{submittalId}/close"
    description: "DISTRIBUTED -> CLOSED; blocked by OPEN/ROUTED RFIs on the submittal"
    roles: [ProjectEngineer]
    code: 200
    input: []
    output: Submittal
    side_effects: ["increments Submittal.version by 1"]

  # --- SubmittalRevision ---
  - method: POST
    path: "/v1/submittals/{submittalId}/revisions"
