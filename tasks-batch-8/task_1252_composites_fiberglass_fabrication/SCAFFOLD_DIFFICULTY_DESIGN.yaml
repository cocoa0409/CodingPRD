# =============================================================================
# Task 1252 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine Difficulty Rules x 2 instances. All chains replayable from empty DB
# using only SCAFFOLD.yaml §1.5 endpoints. Clock default: 2026-05-01T00:00:00Z.
# Shared fixture values used across instances:
#   T0 = 2026-06-01T10:00:00Z
#   PlyBook PN-100 rev A: area 2.0 m2, plies 200 + 300 g/m2, fv 0.5
#     -> fiber 1000 g -> target_part_weight_g 2000.0, tolerance 0.05
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: resin_pot_life_nominal_vs_temperature_adjusted
        grounds:
          - calculations.adjusted_pot_life_minutes
          - entities.ResinBatch.fields.expires_at
          - state_machines.ResinBatch.MIXED_to_EXPIRED
        distinguishing_aspect: |
          Two valid pot-life variants on the SAME resin domain inputs: a batch
          mixed without ambient reading uses the nominal 60-minute life, while an
          identical batch mixed at 30C uses the temperature-adjusted life
          (60 * 0.5**((30-20)/10) = 30 minutes); at T0+45min the first is
          consumable and the second is expired. Companion instance operates on a
          different entity domain (WorkOrder weight acceptance).
        test_recipe:
          setup:
            - "Clock at T0=2026-06-01T10:00:00Z; ACTIVE permit covering June; approved PN-100 ply book; PRODUCTION mold; work order WO1 in LAYUP_IN_PROGRESS"
            - "BATCH-N (no ambient_temp_c) and BATCH-H (ambient_temp_c=30) both mixed at T0 with nominal_pot_life_minutes=60"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer, captures: { per_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "MOLD-PL1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 }, { seq: 2, material_code: "CF-300", orientation_deg: 90, areal_weight_g_m2: 300 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-PL1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-N", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 60 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_n: $.data.id } }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-H", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 60, ambient_temp_c: 30.0 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_h: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:45:00Z" }, as: ShopManager }
          trigger:
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_n}", resin_used_g: 250 }, as: Laminator, as_user_id: "op-lam-1", captures: { sess_n: $.data.id } }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_h}", resin_used_g: 250 }, as: Laminator, as_user_id: "op-lam-1", captures: { err_h: $.data.error_id } }
            - { call: "GET /resin-batches/${batch_h}", payload: {}, as: Laminator, as_user_id: "op-lam-1", captures: { batch_h_status: $.data.status } }
          assert:
            - "LayupSession.${sess_n}.status == ACTIVE (nominal 60-min batch usable at T0+45)"
            - "LayupSession.${sess_n}.styrene_emitted_kg == 0.0088"
            - "err_h == ERR_RESIN_POT_LIFE_EXPIRED (adjusted 30-min batch expired at T0+30)"
            - "batch_h_status == EXPIRED (lazy transition fired on the failed consumption attempt)"

      - name: part_weight_acceptance_prototype_vs_production
        grounds:
          - calculations.weight_acceptance
          - entities.WorkOrder.fields.weight_deviation_pct
          - state_machines.WorkOrder.CURED_to_IN_INSPECTION
          - state_machines.WorkOrder.CURED_to_SCRAPPED
        distinguishing_aspect: |
          Same measured weight (2160.0 g, deviation exactly 0.0800) on identical
          ply books yields opposite outcomes depending on the mold's tooling
          phase: PROTOTYPE tolerance 0.08 passes (<=), PRODUCTION tolerance 0.05
          scraps. Companion instance operates on a different entity domain
          (ResinBatch pot life).
        test_recipe:
          setup:
            - "Clock T0; permit quota 50 kg; approved PN-100; one PROTOTYPE mold and one PRODUCTION mold; two fully cured work orders, one per mold, both at CURED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer, captures: { per_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "MOLD-PR1", maintenance_interval_cycles: 10, prototype_parts_required: 1 }, as: ToolingEngineer, captures: { mold_proto: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "MOLD-PD1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_prod: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 }, { seq: 2, material_code: "CF-300", orientation_deg: 90, areal_weight_g_m2: 300 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /cure-equipment", payload: { equipment_code: "OVEN-1", kind: "OVEN", max_parts_per_cycle: 10, turnaround_minutes: 0, max_temperature_c: 200, max_pressure_bar: 0 }, as: ShopManager, captures: { oven_id: $.data.id } }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-PROTO", part_number: "PN-100", mold_id: "${mold_proto}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_proto: $.data.id } }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-PROD", part_number: "PN-100", mold_id: "${mold_prod}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_prod: $.data.id } }
            - { call: "POST /work-orders/${wo_proto}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /work-orders/${wo_prod}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-W1", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_proto}", resin_batch_id: "${batch_id}", resin_used_g: 200 }, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_prod}", resin_batch_id: "${batch_id}", resin_used_g: 200 }, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /work-orders/${wo_proto}/complete-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /work-orders/${wo_prod}/complete-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /cure-cycles", payload: { work_order_id: "${wo_proto}", equipment_id: "${oven_id}", ramp_rate_c_per_min: 3.0, soak_temp_c: 180, soak_minutes: 120, scheduled_start: "2026-06-01T12:00:00Z", scheduled_end: "2026-06-01T14:00:00Z" }, as: CureTechnician, captures: { cc_proto: $.data.id } }
            - { call: "POST /cure-cycles", payload: { work_order_id: "${wo_prod}", equipment_id: "${oven_id}", ramp_rate_c_per_min: 3.0, soak_temp_c: 180, soak_minutes: 120, scheduled_start: "2026-06-01T14:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }, as: CureTechnician, captures: { cc_prod: $.data.id } }
            - { call: "POST /cure-cycles/${cc_proto}/start", payload: {}, as: CureTechnician }
            - { call: "POST /cure-cycles/${cc_proto}/complete", payload: { recorded_min_temp_c: 178, recorded_max_temp_c: 181, recorded_soak_minutes: 120, recorded_ramp_rate_c_per_min: 3.0 }, as: CureTechnician }
            - { call: "POST /cure-cycles/${cc_prod}/start", payload: {}, as: CureTechnician }
            - { call: "POST /cure-cycles/${cc_prod}/complete", payload: { recorded_min_temp_c: 178, recorded_max_temp_c: 181, recorded_soak_minutes: 120, recorded_ramp_rate_c_per_min: 3.0 }, as: CureTechnician }
          trigger:
            - { call: "POST /work-orders/${wo_proto}/demold", payload: { actual_part_weight_g: 2160.0 }, as: Laminator, as_user_id: "op-lam-1", captures: { proto_dev: $.data.weight_deviation_pct } }
            - { call: "POST /work-orders/${wo_prod}/demold", payload: { actual_part_weight_g: 2160.0 }, as: Laminator, as_user_id: "op-lam-1", captures: { prod_dev: $.data.weight_deviation_pct } }
            - { call: "GET /work-orders/${wo_proto}", payload: {}, as: ShopManager, captures: { proto_status: $.data.status } }
            - { call: "GET /work-orders/${wo_prod}", payload: {}, as: ShopManager, captures: { prod_status: $.data.status } }
          assert:
            - "proto_dev == 0.08 and prod_dev == 0.08 (identical measurement, identical deviation)"
            - "proto_status == IN_INSPECTION (prototype tolerance 0.08 admits deviation == 0.08)"
            - "prod_status == SCRAPPED (production tolerance 0.05 rejects the same deviation)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cure_deviation_score_multifactor_branching
        grounds:
          - calculations.cure_deviation_score
          - state_machines.CureCycle.RUNNING_to_COMPLETED
          - state_machines.WorkOrder.IN_CURE_to_AWAITING_CURE
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs with nested max() dead-zones and a
          conditional auto-reject branch; the chosen log (max 184, soak 116,
          ramp 4.2 vs program 180/120/3.0) scores 0 + 1.5*4 + 1.0*0.7 = 6.7,
          failing the <= 5.0 gate and looping the work order back to
          AWAITING_CURE. Companion instance is mode (b) nested rounding.
        test_recipe:
          setup:
            - "Clock T0; permit; approved PN-100; PRODUCTION mold interval 10; WO-C1 fully laid up; cycle running on OVEN-1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer }
            - { call: "POST /molds", payload: { mold_code: "MOLD-C1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 }, { seq: 2, material_code: "CF-300", orientation_deg: 90, areal_weight_g_m2: 300 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /cure-equipment", payload: { equipment_code: "OVEN-1", kind: "OVEN", max_parts_per_cycle: 10, turnaround_minutes: 0, max_temperature_c: 200, max_pressure_bar: 0 }, as: ShopManager, captures: { oven_id: $.data.id } }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-C1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-C1", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 200 }, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /work-orders/${wo_id}/complete-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /cure-cycles", payload: { work_order_id: "${wo_id}", equipment_id: "${oven_id}", ramp_rate_c_per_min: 3.0, soak_temp_c: 180, soak_minutes: 120, scheduled_start: "2026-06-01T12:00:00Z", scheduled_end: "2026-06-01T14:00:00Z" }, as: CureTechnician, captures: { cc_id: $.data.id } }
            - { call: "POST /cure-cycles/${cc_id}/start", payload: {}, as: CureTechnician }
          trigger:
            - { call: "POST /cure-cycles/${cc_id}/complete", payload: { recorded_min_temp_c: 178, recorded_max_temp_c: 184, recorded_soak_minutes: 116, recorded_ramp_rate_c_per_min: 4.2 }, as: CureTechnician, captures: { score: $.data.cure_deviation_score, log_ok: $.data.cure_log_ok, cc_status: $.data.status } }
            - { call: "GET /work-orders/${wo_id}", payload: {}, as: CureTechnician, captures: { wo_status: $.data.status } }
          assert:
            - "score == 6.7 (0 temp inside dead-zone + 1.5*4 soak deficit + 1.0*0.7 ramp excess)"
            - "log_ok == false and cc_status == COMPLETED"
            - "wo_status == AWAITING_CURE (failed cure loops the order back for re-cure)"

      - name: styrene_round_per_session_then_sum
        grounds:
          - calculations.styrene_emission_kg
          - entities.LayupSession.fields.styrene_emitted_kg
          - entities.EmissionPermit.fields.styrene_used_kg
        distinguishing_aspect: |
          Mode (b) nested rounding: each session rounds to 4 decimals BEFORE
          aggregation — two 250 g POLYESTER sessions each post
          round(250*0.35*0.10/1000, 4) = 0.0088 kg, so the permit reads 0.0176;
          the sum-then-round order would read round(0.0175, 4) = 0.0175. The
          scaffold pins per-session-then-sum. Companion instance is mode (a).
        test_recipe:
          setup:
            - "Clock T0; permit quota 50 kg; approved PN-100; PRODUCTION mold; WO-S1 in LAYUP_IN_PROGRESS; batch BATCH-S1 (1020 g total)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer, captures: { per_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "MOLD-S1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 }, { seq: 2, material_code: "CF-300", orientation_deg: 90, areal_weight_g_m2: 300 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-S1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 2, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-S1", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
          trigger:
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 250 }, as: Laminator, as_user_id: "op-lam-1", captures: { sess1: $.data.id, emit1: $.data.styrene_emitted_kg } }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 250 }, as: Laminator, as_user_id: "op-lam-1", captures: { sess2: $.data.id, emit2: $.data.styrene_emitted_kg } }
            - { call: "GET /emission-permits/${per_id}", payload: {}, as: EHSOfficer, captures: { used_kg: $.data.styrene_used_kg } }
          assert:
            - "emit1 == 0.0088 and emit2 == 0.0088 (each session rounded to 4 decimals first)"
            - "used_kg == 0.0176 (sum of rounded sessions), NOT 0.0175 (round-after-sum)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: workorder_repair_loop_cycle
        grounds:
          - state_machines.WorkOrder.IN_INSPECTION_to_REPAIR
          - state_machines.WorkOrder.REPAIR_to_CURE_SCHEDULED
          - state_machines.WorkOrder.IN_CURE_to_AWAITING_CURE
          - state_machines.Repair.OPEN_to_CLOSED
          - calculations.inspection_disposition
        distinguishing_aspect: |
          WorkOrder machine is cyclic: IN_INSPECTION -> REPAIR -> (new cure
          cycle) CURE_SCHEDULED -> IN_CURE -> CURED -> IN_INSPECTION, closing
          the loop with a passing re-inspection that moves the auto-created
          Repair OPEN -> CLOSED. Companion instance is on a different entity
          (Mold maintenance cycle).
        test_recipe:
          setup:
            - "Clock T0; permit; approved PN-100 (max_repair_attempts default 2); PRODUCTION mold interval 10; WO-R1 cured once and standing IN_INSPECTION"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer }
            - { call: "POST /molds", payload: { mold_code: "MOLD-R1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 }, { seq: 2, material_code: "CF-300", orientation_deg: 90, areal_weight_g_m2: 300 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /cure-equipment", payload: { equipment_code: "OVEN-1", kind: "OVEN", max_parts_per_cycle: 10, turnaround_minutes: 0, max_temperature_c: 200, max_pressure_bar: 0 }, as: ShopManager, captures: { oven_id: $.data.id } }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-R1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-R1", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 200 }, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /work-orders/${wo_id}/complete-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /cure-cycles", payload: { work_order_id: "${wo_id}", equipment_id: "${oven_id}", ramp_rate_c_per_min: 3.0, soak_temp_c: 180, soak_minutes: 120, scheduled_start: "2026-06-01T12:00:00Z", scheduled_end: "2026-06-01T14:00:00Z" }, as: CureTechnician, captures: { cc1: $.data.id } }
