              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind1_id: $.data.id }
          trigger:
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "PAID_PURE", earned_premium_cents: 9000000, incurred_loss_cents: 6000000, paid_loss_cents: 5500000, exposure_units: 400, trend_factor: 0.03, countrywide_change_pct: 0.05, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { err: $.data.error_id }
            - call: "GET /products/${prod_id}"
              as: ProductActuary
              captures: { prod_v2: $.data.version }
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "PAID_PURE", earned_premium_cents: 9000000, incurred_loss_cents: 6000000, paid_loss_cents: 5500000, exposure_units: 400, trend_factor: 0.03, countrywide_change_pct: 0.05, expected_product_version: "${prod_v2}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind2_id: $.data.id }
          assert:
            - "Stale replay of version ${prod_v}: HTTP 412 with error_id == ERR_STALE_VERSION"
            - "Product.${prod_id}.version == 2 after the first create (mutation bumped it)"
            - "Fresh create with the observed version succeeds: RateIndication.${ind2_id} exists with status DRAFT"

      - name: occ_response_draft_stale_then_fresh_supersedes
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[response-draft-stale-objection]", state_machines.ObjectionResponse.DRAFT_to_SUPERSEDED]
        distinguishing_aspect: "OCC on Objection.version: the first draft bumps the objection; a second draft carrying the stale version is 412, and a draft carrying the fresh version succeeds and SUPERSEDES the first response."
        test_recipe:
          setup: ["CA filing SUBMITTED; objection raised (version 1 captured); one DRAFT response already created (objection now version 2)"]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_id: $.data.id }
            - call: "POST /filings/${fil_id}/components"
              payload: { component_type: "RATE", name: "CA Base Rates", content_ref: "s3://fil/ca-rate.pdf" }
              as: FilingAnalyst
              captures: { comp_id: $.data.id }
            - call: "POST /components/${comp_id}/finalize"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/mark-ready"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/submit"
              as: ComplianceOfficer
            - call: "POST /objections"
              payload: { filing_id: "${fil_id}", question_text: "Trend support?" }
              as: StateRegulator
              captures: { obj_id: $.data.id, obj_v: $.data.version }
            - call: "POST /objections/${obj_id}/responses"
              payload: { response_text: "Draft one.", expected_objection_version: "${obj_v}" }
              as: FilingAnalyst
              captures: { resp1_id: $.data.id }
          trigger:
            - call: "POST /objections/${obj_id}/responses"
              payload: { response_text: "Draft two (stale).", expected_objection_version: "${obj_v}" }
              as: FilingAnalyst
              captures: { err: $.data.error_id }
            - call: "GET /objections/${obj_id}"
              as: FilingAnalyst
              captures: { obj_v2: $.data.version }
            - call: "POST /objections/${obj_id}/responses"
              payload: { response_text: "Draft two (fresh).", expected_objection_version: "${obj_v2}" }
              as: FilingAnalyst
              captures: { resp2_id: $.data.id, resp2_status: $.data.status }
            - call: "GET /responses/${resp1_id}"
              as: FilingAnalyst
              captures: { resp1_status: $.data.status }
          assert:
            - "Stale draft replay of version ${obj_v}: HTTP 412 with error_id == ERR_STALE_VERSION"
            - "Objection.${obj_id}.version == 2 after the first draft"
            - "Fresh draft ${resp2_id} created with status DRAFT; ObjectionResponse.${resp1_id}.status == SUPERSEDED"

      - name: derived_open_objection_count_reconciled
        claim_type: derived_field_reconciliation
        grounds: [entities.RateFiling.fields.open_objection_count]
        distinguishing_aspect: "The denormalized open_objection_count tracks the objection lifecycle: 0 at submit, 1 after raise, 2 after a second raise, back to 0 after both withdraw."
        test_recipe:
          setup: ["CA filing SUBMITTED"]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_id: $.data.id }
            - call: "POST /filings/${fil_id}/components"
              payload: { component_type: "RATE", name: "CA Base Rates", content_ref: "s3://fil/ca-rate.pdf" }
              as: FilingAnalyst
              captures: { comp_id: $.data.id }
            - call: "POST /components/${comp_id}/finalize"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/mark-ready"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/submit"
              as: ComplianceOfficer
              captures: { cnt0: $.data.open_objection_count }
          trigger:
            - call: "POST /objections"
              payload: { filing_id: "${fil_id}", question_text: "Q1" }
              as: StateRegulator
              captures: { obj1_id: $.data.id }
            - call: "POST /objections"
              payload: { filing_id: "${fil_id}", question_text: "Q2" }
              as: StateRegulator
              captures: { obj2_id: $.data.id }
            - call: "GET /filings/${fil_id}"
              as: StateRegulator
              captures: { cnt2: $.data.open_objection_count }
            - call: "POST /objections/${obj1_id}/withdraw"
              as: StateRegulator
            - call: "POST /objections/${obj2_id}/withdraw"
              as: StateRegulator
            - call: "GET /filings/${fil_id}"
              as: StateRegulator
              captures: { cnt_final: $.data.open_objection_count, fil_status: $.data.status }
          assert:
            - "open_objection_count == 0 at submit, == 2 after two raises, == 0 after both withdrawals"
            - "RateFiling.${fil_id}.status == SUBMITTED again (bubble-up) after the count drains to 0"

      - name: cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: post_effective_disapproval_rescission_cascade
          rationale: "The depth-4 disapproval cascade and the supersede chain are asserted end-to-end by §1.8 transitive_cascade instances."

      - name: rate_threshold_cap_boundary_covered
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: cap_boundary_raw_equals_cap_not_capped
          rationale: "The strict-> cap threshold at exactly 0.1500 vs 0.1510 is asserted by the named §1.8 instance."

      - name: scheduled_actions_covered
        claim_type: scheduled_actions
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: objection_response_deadline_inclusive
          rationale: "Clock-driven deemer/overdue/notice sweeps are exercised by corner instances deemed_approval_fires_at_deemer_date, deemed_approval_tolls_while_objection_open, late_notice_sweep_bounces_policy and by the named §1.8 deadline-boundary instance."

  # ============================================================ consistency_model
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_transition_effects
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        excluded_because:
          difficulty_instance: approve_with_zero_open_objections
          rationale: "Immediate consistency is asserted by every §1.8 trigger that reads mutation results from the same response (e.g., actual_effective_date on the approve response, balance_factor on the release response); corner instance submit_side_effects_visible_in_response adds the filing_number/deemer_date surface."
