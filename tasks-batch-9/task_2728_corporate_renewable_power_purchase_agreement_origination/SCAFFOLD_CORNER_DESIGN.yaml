      - name: every_termination_reason_is_conditional_so_an_unvested_right_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TERMINATION_RIGHT_NOT_VESTED]
          - validations.priority_35_ERR_TERMINATION_RIGHT_NOT_VESTED
          - state_machines.Deal.EXECUTED_to_TERMINATED
          - endpoints.POST_/ppa/deals/{id}/terminate
        distinguishing_aspect: |
          There is no unconditional termination right, so the same call is refused three
          times on three different unvested predicates before it is finally granted -
          and the grant is caused only by moving the clock, never by changing the deal.
          The sharpest limb is CP_FAILURE at a clock long past all three CP deadlines: a
          lapsed deadline does NOT self-fail a condition, so no ConditionPrecedent is
          FAILED and the right is still unvested even though every deadline is history.
          COD_DEADLINE_MISSED additionally carries a status side-condition (status !=
          EFFECTIVE) rather than a pure date test, so this same deal would lose the right
          the moment its conditions cleared it into EFFECTIVE.
