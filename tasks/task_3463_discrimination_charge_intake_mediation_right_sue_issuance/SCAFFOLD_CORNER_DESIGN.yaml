              as: ChargingParty
              as_user_id: "${cmp_f1}"
              captures: { chg_am2_v2: $.data.version, chg_am2_status: $.data.case_status }
          assert:
            - "version == 2 (exactly one increment); case_status still DOCKETED"
            - "basis_codes == [RACE] and employee_count_at_incident == 40 unchanged"
      - name: conclude_settled_cancels_scheduled_sessions
        claim_type: action_endpoint
        grounds: [state_machines.MediationCase.ACTIVE_to_SETTLED, state_machines.MediationSession.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "concluding SETTLED cascades to the session book: every still-SCHEDULED session of the mediation case flips to CANCELLED in the same transaction."
        test_recipe:
          setup: ["ACTIVE mediation with one future session (2026-10-01 10:00-11:00Z) at the 2026-09-01 default clock"]
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Cancel Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_cc: $.data.id }
