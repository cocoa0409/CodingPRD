  # =====================================================================
  # Rule 3 - non_linear_state_machine
  # Two instances on different entities: a re-entrant negotiation cycle with a
  # cross-entity revert (EngagementQualityReview) and a rating-driven fork whose
  # branches carry different side-effect sets (PeerReview).
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: eqr_concern_cycle_reverts_engagement_and_counts_rounds
        grounds:
          - state_machines.EngagementQualityReview.IN_PROGRESS_to_CONCERNS_RAISED
          - state_machines.EngagementQualityReview.CONCERNS_RAISED_to_IN_PROGRESS
          - state_machines.EngagementQualityReview.IN_PROGRESS_to_CONCURRED
          - state_machines.Engagement.EQR_PENDING_to_FIELDWORK
          - state_machines.Engagement.FIELDWORK_to_EQR_PENDING
          - entities.EngagementQualityReview.fields.concern_round_count
          - entities.EngagementQualityReview.fields.last_concern_summary
          - entities.Engagement.fields.eqr_concurred_at
          - entities.Partner.fields.open_eqr_count
        distinguishing_aspect: |
          The EQR lifecycle is re-entrant, not linear: IN_PROGRESS -> CONCERNS_RAISED -> IN_PROGRESS
          may repeat any number of times, each CONCERNS_RAISED drags the linked Engagement backwards
          from EQR_PENDING to FIELDWORK and nulls eqr_concurred_at, and CONCERNS_RAISED -> IN_PROGRESS
          is blocked until the engagement partner has pushed the engagement back to EQR_PENDING. After
          two full rounds concern_round_count reads exactly 2 (not 1 and not 4), the review still
          reaches CONCURRED, and the reviewer's open_eqr_count returns to 0.
        test_recipe:
          setup:
            - "Firm 'Ilkwood Bay LLP' with engagement partner Eli Parch, QC director Quinn Cade and EQ reviewer Sable Ord (designations ['EQ_REVIEWER'], cpe_hours_last_3y 200, no client history and no independence conflicts)."
            - "Engagement 'Cinder Utilities' is AUDIT, is_public_interest true so eqr_required is true, and has been advanced to workflow_state FIELDWORK."
            - "An EngagementQualityReview is ASSIGNED to Sable Ord and the engagement has then been moved to EQR_PENDING."
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Ilkwood Bay LLP", state_code: "CA", aa_hours_last_year: 400, peer_review_year_end: "2026-12-31" }
              as: SystemAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Eli Parch", cpa_license_state: "CA", designations: ["ENGAGEMENT_PARTNER"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_ep1_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Quinn Cade", cpa_license_state: "CA", designations: ["QC_DIRECTOR"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_qc_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Sable Ord", cpa_license_state: "CA", designations: ["EQ_REVIEWER"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_rev_id: $.data.id }
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Cinder Utilities", engagement_type: "AUDIT", period_end: "2026-06-30", engagement_partner_id: "${p_ep1_id}", is_public_interest: true }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { eng_v: $.data.version }
            - call: "POST /engagements/${e1_id}/quality-reviews"
              payload: { reviewer_partner_id: "${p_rev_id}", objectivity_attested: true, expected_engagement_version: "${eng_v}" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { eqr_id: $.data.id }
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "EQR_PENDING" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
          trigger:
            - call: "POST /quality-reviews/${eqr_id}/transitions"
              payload: { to_state: "IN_PROGRESS" }
              as: EngagementQualityReviewer
              as_user_id: "${p_rev_id}"
            - call: "POST /quality-reviews/${eqr_id}/transitions"
              payload: { to_state: "CONCERNS_RAISED", concern_summary: "Round one: impairment model inputs are not corroborated." }
              as: EngagementQualityReviewer
              as_user_id: "${p_rev_id}"
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "EQR_PENDING" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /quality-reviews/${eqr_id}/transitions"
              payload: { to_state: "IN_PROGRESS" }
              as: EngagementQualityReviewer
              as_user_id: "${p_rev_id}"
            - call: "POST /quality-reviews/${eqr_id}/transitions"
              payload: { to_state: "CONCERNS_RAISED", concern_summary: "Round two: revised disclosure still omits the sensitivity analysis." }
              as: EngagementQualityReviewer
              as_user_id: "${p_rev_id}"
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "EQR_PENDING" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /quality-reviews/${eqr_id}/transitions"
              payload: { to_state: "IN_PROGRESS" }
              as: EngagementQualityReviewer
              as_user_id: "${p_rev_id}"
            - call: "POST /quality-reviews/${eqr_id}/transitions"
              payload: { to_state: "CONCURRED" }
              as: EngagementQualityReviewer
              as_user_id: "${p_rev_id}"
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "EQR_CLEARED" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
          assert:
            - "EngagementQualityReview.${eqr_id}.state == CONCURRED"
            - "EngagementQualityReview.${eqr_id}.concern_round_count == 2"
            - "EngagementQualityReview.${eqr_id}.last_concern_summary == Round two: revised disclosure still omits the sensitivity analysis."
            - "EngagementQualityReview.${eqr_id}.concluded_at != null"
            - "Engagement.${e1_id}.workflow_state == EQR_CLEARED"
            - "Engagement.${e1_id}.eqr_required == true"
            - "Engagement.${e1_id}.eqr_concurred_at != null"
            - "Engagement.${e1_id}.reopened_count == 0"
            - "Partner.${p_rev_id}.open_eqr_count == 0"

      - name: peer_review_report_issued_fork_fail_branch_side_effect_set
        grounds:
          - state_machines.PeerReview.RATING_DRAFTED_to_REPORT_ISSUED
          - state_machines.PeerReview.REPORT_ISSUED_to_CORRECTIVE_ACTION_REQUIRED
          - state_machines.PeerReview.REPORT_ISSUED_to_ACCEPTED
          - calculations.peer_review_rating
          - entities.CorrectiveActionPlan.fields.action_code
          - entities.CorrectiveActionPlan.fields.due_date
          - errors[ERR_CORRECTIVE_ACTION_OUTSTANDING]
        distinguishing_aspect: |
          On a different entity from instance one, REPORT_ISSUED is a fork whose branches are not
          mirror images: the FAIL branch auto-advances to CORRECTIVE_ACTION_REQUIRED and synthesizes
          exactly one CorrectiveActionPlan with action_code PREISSUANCE_REVIEW and due_date = issue
          date + 45 days (not MONITORING_VISIT + 90, which is the PASS_WITH_DEFICIENCY branch, and not
          zero plans, which is the PASS branch), and the direct REPORT_ISSUED -> ACCEPTED leg is
          barred with ERR_CORRECTIVE_ACTION_OUTSTANDING while Firm.last_peer_review_rating is still
          untouched.
        test_recipe:
