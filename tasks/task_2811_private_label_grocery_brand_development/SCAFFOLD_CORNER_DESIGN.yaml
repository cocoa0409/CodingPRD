  # ===========================================================================
  # 8. CROSS-CUTTING COMPLEXITY LAYERS
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: spec_create_with_item_version_moved_by_a_shipment_feed_rejected
        claim_type: stale_version_rejected
        grounds:
          - concurrency_rules[spec-create-stale-item]
          - validations[priority=10]
          - errors[ERR_STALE_ITEM_VERSION]
        distinguishing_aspect: |
          The version the drafter read is invalidated by an unrelated write from another role: a shipment feed bumps
          ProductItem.version between the read and the specification create, so the create fails 412
          ERR_STALE_ITEM_VERSION even though every foreign key resolves, the item state admits the create and the
          pins are both approved. spec_revision_count must stay 0 - a handler that increments it before comparing
          versions leaves the next revision number wrong.
        test_recipe:
          setup:
            - "One PACKAGING_APPROVED NBE item with an ACCEPTED cost model and an APPROVED artwork round and no specification yet."
            - "The drafter read the item version, and a QualityAuditor then posted a shipment feed of 60000 units, moving the item version by one."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
            - call: "POST /private-label/category-gaps"
              payload: { program_id: "${prog_id}", category_code: "CRACKERS", national_brand_name: "Sunbite", nb_retail_price_cents: 360, category_annual_sales_cents: 250000000, pl_share_pct: 20.0, unit_velocity_per_week: 520, shelf_slots_quota: 2 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { gap_id: $.data.id }
            - call: "POST /private-label/category-gaps/${gap_id}/analyze"
              payload: {}
