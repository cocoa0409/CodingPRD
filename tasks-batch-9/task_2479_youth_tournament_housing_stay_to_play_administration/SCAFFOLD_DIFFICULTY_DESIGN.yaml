          - entities.Booking.fields.booking_status
          - entities.Booking.fields.rebate_status
          - entities.Booking.fields.rebate_accrued_cents
        distinguishing_aspect: |
          Non-linearity form is PARALLEL AXES on Booking — a different entity and a different
          shape from the HotelContract cycle. booking_status (DRAFT -> ROOMING_LIST_SUBMITTED ->
          CONFIRMED -> CHECKED_OUT) and rebate_status (NOT_DUE -> ACCRUED -> INVOICED ->
          COLLECTED) advance on independent triggers. The self-loop ACCRUED -> ACCRUED on a
          second actualization must re-derive rebate_accrued_cents from the LATEST report only
          (13500, not the 10800 of the first report, and not their 24300 sum), and the final
