# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Film Festival Submission & Programming. 9 rule_ids, 18 instances.
# Every chain replays against SCAFFOLD.yaml §1.2/§1.4/§1.5 from empty DB.
# Logical clock default 2026-08-01T00:00:00Z unless a set_current_utc call says otherwise.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: score_provisional_vs_weighted_official
        grounds:
          - calculations.composite_score
          - entities.Submission.fields.provisional_score
          - entities.Submission.fields.composite_score
        distinguishing_aspect: |
          Same three SCORED rows on the same Submission yield provisional_score
          8.0 (unweighted mean) and composite_score 7.889 (seniority-weighted
          mean) — two valid aggregations over identical inputs on the Submission
          domain, differing in the decimal result.
        test_recipe:
          setup:
            - "Edition 2027 (default pools) in SCREENING; NARRATIVE_FEATURE config screener_count_required 3"
            - "One paid, ELIGIBLE->IN_SCREENING submission 'Cold Harbor' (runtime 95, premiere WORLD)"
            - "Three programmers LEAD/SENIOR/STAFF each with a SCORED assignment: overall 8, 7, 9"
          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed: $.data.id } }
            - { call: "POST /festival/category-configs", payload: { edition_id: "${ed}", category: NARRATIVE_FEATURE, min_runtime_minutes: 70, max_runtime_minutes: 120, premiere_requirement: US_REQUIRED, completion_cutoff: "2025-01-01", early_fee_cents: 9000, regular_fee_cents: 12000, late_fee_cents: 15000, screener_count_required: 3 }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: INTAKE_OPEN }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submitters", payload: { legal_name: "Ava Duarte", email: "ava@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { subm: $.data.id } }
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: NARRATIVE_FEATURE, title: "Cold Harbor", runtime_minutes: 95, completion_date: "2025-06-01", premiere_status: WORLD, production_company: "Acme Films", format: DCP_2K }, as: FILMMAKER, as_user_id: "${subm}", captures: { film: $.data.id } }
            - { call: "POST /festival/submissions/${film}/checkout", payload: {}, as: FILMMAKER, as_user_id: "${subm}", captures: { pay: $.data.id } }
            - { call: "POST /festival/_payments/simulate", payload: { fee_payment_id: "${pay}", outcome: SUCCEEDED }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submissions/${film}/eligibility-decision", payload: { decision: ELIGIBLE }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: INTAKE_CLOSED }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: SCREENING }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/programmers", payload: { display_name: "Pat Lead", email: "pat@example.com", seniority: LEAD, categories_covered: [NARRATIVE_FEATURE] }, as: FESTIVAL_ADMIN, captures: { pLead: $.data.id } }
            - { call: "POST /festival/programmers", payload: { display_name: "Sam Senior", email: "sam@example.com", seniority: SENIOR, categories_covered: [NARRATIVE_FEATURE] }, as: FESTIVAL_ADMIN, captures: { pSenior: $.data.id } }
            - { call: "POST /festival/programmers", payload: { display_name: "Stu Staff", email: "stu@example.com", seniority: STAFF, categories_covered: [NARRATIVE_FEATURE] }, as: FESTIVAL_ADMIN, captures: { pStaff: $.data.id } }
            - { call: "POST /festival/screener-assignments", payload: { submission_id: "${film}", programmer_id: "${pLead}", due_at: "2026-11-01T00:00:00Z" }, as: PROGRAM_CHAIR, as_user_id: "chair-1", captures: { aLead: $.data.id } }
            - { call: "POST /festival/screener-assignments", payload: { submission_id: "${film}", programmer_id: "${pSenior}", due_at: "2026-11-01T00:00:00Z" }, as: PROGRAM_CHAIR, as_user_id: "chair-1", captures: { aSenior: $.data.id } }
            - { call: "POST /festival/screener-assignments", payload: { submission_id: "${film}", programmer_id: "${pStaff}", due_at: "2026-11-01T00:00:00Z" }, as: PROGRAM_CHAIR, as_user_id: "chair-1", captures: { aStaff: $.data.id } }
          trigger:
            - { call: "POST /festival/screener-assignments/${aLead}/scores", payload: { originality: 8, craft: 8, story: 8, overall: 8, recommendation: ADVOCATE }, as: PROGRAMMER, as_user_id: "${pLead}" }
            - { call: "POST /festival/screener-assignments/${aSenior}/scores", payload: { originality: 7, craft: 7, story: 7, overall: 7, recommendation: NEUTRAL }, as: PROGRAMMER, as_user_id: "${pSenior}" }
            - { call: "POST /festival/screener-assignments/${aStaff}/scores", payload: { originality: 9, craft: 9, story: 9, overall: 9, recommendation: STRONG_ADVOCATE }, as: PROGRAMMER, as_user_id: "${pStaff}" }
            - { call: "GET /festival/submissions/${film}", payload: {}, as: FESTIVAL_ADMIN }
          assert:
            - "Submission.${film}.provisional_score == 8.0  (mean of 8,7,9 = 24/3)"
            - "Submission.${film}.composite_score == 7.889  ((8*2.0 + 7*1.5 + 9*1.0)/4.5 = 35.5/4.5 = 7.8888.. round_half_up 3dp)"
            - "provisional_score != composite_score for identical input scores"

      - name: jury_first_preference_vs_irv_winner
        grounds:
          - calculations.jury_tally_irv
          - entities.Award.fields.winner_submission_id
          - "endpoints.\"GET /festival/awards/{id}/standings\""
        distinguishing_aspect: |
          Award-domain dual variant on identical ballots: provisional standings
          (raw first preferences) show a 2-2 tie between films A and B, while the
          official IRV tally eliminates C and transfers its ballot to crown B —
          different results from the same JuryVote rows on a different entity
          domain than score_provisional_vs_weighted_official.
        test_recipe:
          setup:
            - "Edition in FESTIVAL_LIVE (clock advanced to 2027-01-21); SHORT_FILM config screener_count_required 2"
            - "Three SHORTS films A/B/C all PROGRAMMED (paid, eligible, 2 STAFF scores 8+9, locked SHORTS slate capacity 3, invited, accepted, agreements SIGNED, PREMIERE slots CONFIRMED)"
            - "Award 'Shorts Grand Jury' section SHORTS prize 2500000 with 5 assigned jurors; voting open; 5 ballots: A>C, A>C, B>A, B>A, C>B"
          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 30, travel_budget_cents: 2000000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed: $.data.id } }
            - { call: "POST /festival/category-configs", payload: { edition_id: "${ed}", category: SHORT_FILM, min_runtime_minutes: 1, max_runtime_minutes: 40, premiere_requirement: NONE, completion_cutoff: "2025-01-01", early_fee_cents: 4000, regular_fee_cents: 5500, late_fee_cents: 7000, screener_count_required: 2 }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: INTAKE_OPEN }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submitters", payload: { legal_name: "Fay A", email: "fa@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { submA: $.data.id } }
            - { call: "POST /festival/submitters", payload: { legal_name: "Fay B", email: "fb@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { submB: $.data.id } }
            - { call: "POST /festival/submitters", payload: { legal_name: "Fay C", email: "fc@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { submC: $.data.id } }
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "Film A", runtime_minutes: 20, completion_date: "2025-06-01", premiere_status: WORLD, production_company: "CoA", format: DCP_2K }, as: FILMMAKER, as_user_id: "${submA}", captures: { filmA: $.data.id } }
            - { call: "POST /festival/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "Film B", runtime_minutes: 20, completion_date: "2025-06-01", premiere_status: WORLD, production_company: "CoB", format: DCP_2K }, as: FILMMAKER, as_user_id: "${submB}", captures: { filmB: $.data.id } }
            - { call: "POST /festival/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "Film C", runtime_minutes: 20, completion_date: "2025-06-01", premiere_status: WORLD, production_company: "CoC", format: DCP_2K }, as: FILMMAKER, as_user_id: "${submC}", captures: { filmC: $.data.id } }
            - { call: "POST /festival/submissions/${filmA}/checkout", payload: {}, as: FILMMAKER, as_user_id: "${submA}", captures: { payA: $.data.id } }
            - { call: "POST /festival/submissions/${filmB}/checkout", payload: {}, as: FILMMAKER, as_user_id: "${submB}", captures: { payB: $.data.id } }
            - { call: "POST /festival/submissions/${filmC}/checkout", payload: {}, as: FILMMAKER, as_user_id: "${submC}", captures: { payC: $.data.id } }
            - { call: "POST /festival/_payments/simulate", payload: { fee_payment_id: "${payA}", outcome: SUCCEEDED }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/_payments/simulate", payload: { fee_payment_id: "${payB}", outcome: SUCCEEDED }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/_payments/simulate", payload: { fee_payment_id: "${payC}", outcome: SUCCEEDED }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submissions/${filmA}/eligibility-decision", payload: { decision: ELIGIBLE }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submissions/${filmB}/eligibility-decision", payload: { decision: ELIGIBLE }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submissions/${filmC}/eligibility-decision", payload: { decision: ELIGIBLE }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: INTAKE_CLOSED }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: SCREENING }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/programmers", payload: { display_name: "Screener One", email: "s1@example.com", seniority: STAFF, categories_covered: [SHORT_FILM] }, as: FESTIVAL_ADMIN, captures: { p1: $.data.id } }
            - { call: "POST /festival/programmers", payload: { display_name: "Screener Two", email: "s2@example.com", seniority: STAFF, categories_covered: [SHORT_FILM] }, as: FESTIVAL_ADMIN, captures: { p2: $.data.id } }
            - { call: "POST /festival/screener-assignments", payload: { submission_id: "${filmA}", programmer_id: "${p1}", due_at: "2026-11-01T00:00:00Z" }, as: PROGRAM_CHAIR, as_user_id: "chair-1", captures: { aA1: $.data.id } }
            - { call: "POST /festival/screener-assignments", payload: { submission_id: "${filmA}", programmer_id: "${p2}", due_at: "2026-11-01T00:00:00Z" }, as: PROGRAM_CHAIR, as_user_id: "chair-1", captures: { aA2: $.data.id } }
            - { call: "POST /festival/screener-assignments", payload: { submission_id: "${filmB}", programmer_id: "${p1}", due_at: "2026-11-01T00:00:00Z" }, as: PROGRAM_CHAIR, as_user_id: "chair-1", captures: { aB1: $.data.id } }
            - { call: "POST /festival/screener-assignments", payload: { submission_id: "${filmB}", programmer_id: "${p2}", due_at: "2026-11-01T00:00:00Z" }, as: PROGRAM_CHAIR, as_user_id: "chair-1", captures: { aB2: $.data.id } }
            - { call: "POST /festival/screener-assignments", payload: { submission_id: "${filmC}", programmer_id: "${p1}", due_at: "2026-11-01T00:00:00Z" }, as: PROGRAM_CHAIR, as_user_id: "chair-1", captures: { aC1: $.data.id } }
            - { call: "POST /festival/screener-assignments", payload: { submission_id: "${filmC}", programmer_id: "${p2}", due_at: "2026-11-01T00:00:00Z" }, as: PROGRAM_CHAIR, as_user_id: "chair-1", captures: { aC2: $.data.id } }
            - { call: "POST /festival/screener-assignments/${aA1}/scores", payload: { originality: 8, craft: 8, story: 8, overall: 8, recommendation: ADVOCATE }, as: PROGRAMMER, as_user_id: "${p1}" }
            - { call: "POST /festival/screener-assignments/${aA2}/scores", payload: { originality: 9, craft: 9, story: 9, overall: 9, recommendation: ADVOCATE }, as: PROGRAMMER, as_user_id: "${p2}" }
            - { call: "POST /festival/screener-assignments/${aB1}/scores", payload: { originality: 8, craft: 8, story: 8, overall: 8, recommendation: ADVOCATE }, as: PROGRAMMER, as_user_id: "${p1}" }
            - { call: "POST /festival/screener-assignments/${aB2}/scores", payload: { originality: 9, craft: 9, story: 9, overall: 9, recommendation: ADVOCATE }, as: PROGRAMMER, as_user_id: "${p2}" }
            - { call: "POST /festival/screener-assignments/${aC1}/scores", payload: { originality: 8, craft: 8, story: 8, overall: 8, recommendation: ADVOCATE }, as: PROGRAMMER, as_user_id: "${p1}" }
            - { call: "POST /festival/screener-assignments/${aC2}/scores", payload: { originality: 9, craft: 9, story: 9, overall: 9, recommendation: ADVOCATE }, as: PROGRAMMER, as_user_id: "${p2}" }
