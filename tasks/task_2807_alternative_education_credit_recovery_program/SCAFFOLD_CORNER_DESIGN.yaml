            - "CreditAward.${award_id}.transcript_code == 'BIO1-OL-AE' (course code + ONLINE modality code OL + the -AE suffix)"
            - "CreditAward.${award_id}.transcript_grade_code == B (final_percent 84.00 lands in the >= 80 band) and alt_ed_flag == true"
            - "CreditAward.${award_id}.ncaa_acceptable == true and grade_replacement_mode == NONE (enrollment_type is NEW_CREDIT, so the plan's REPLACE_ON_RECOVERY policy is not consulted)"
            - "Student.${stu_id}.alt_ed_credits == 1.00, ncaa_acceptable_credits == 1.00 and gpa == 3.00"

      - name: variant_divergence_seat_time_versus_competency_credits
        claim_type: variant_divergence
        grounds:
          - calculations.credit_award_credits
          - entities.Placement.fields.credit_policy
        excluded_because:
          difficulty_instance: seat_time_vs_competency_award_same_progress_inputs
          rationale: "That §1.8 dual_variant_calc instance already drives two placements over byte-identical progress inputs (30.00 of 60.00 seat hours, 8 of 8 modules, mastery 81.60) and pins the divergent awards 0.50 vs 1.00, which is exactly the divergence claim plus the delta."

      - name: variant_selection_credit_policy_pinned_at_accept_offer
        claim_type: variant_selection
        grounds:
          - calculations.credit_award_credits
          - endpoints.POST_referrals_referral_id_accept_offer
        excluded_because:
          difficulty_instance: seat_time_vs_competency_award_same_progress_inputs
          rationale: "The same instance selects the variant purely through Placement.credit_policy fixed at accept-offer and asserts that neither award consults the other policy's inputs, which is the selection-in-context claim."

      - name: gpa_variant_reconciliation_on_recovery_posting
        claim_type: reconciliation
        grounds:
          - calculations.transcript_gpa
          - entities.GraduationPlan.fields.grade_replacement_policy
        excluded_because:
          difficulty_instance: gpa_replace_vs_average_policy_divergence
          rationale: "That §1.8 instance posts a CREDIT_RECOVERY award under both grade-replacement policies and asserts the GPA before and after the switch (the REPLACED row leaving the input set versus both rows counting), which is the reconciliation delta claim."

      - name: quarter_credit_tier_boundaries_per_award
        claim_type: tiered_pricing
        grounds:
          - calculations.credit_award_credits
        excluded_because:
          difficulty_instance: quarter_credit_floor_per_award_not_on_aggregate
          rationale: "That §1.8 combinatorial_formula instance walks the 0.25 granularity boundary on two awards and proves the floor is per award rather than on the aggregate, covering both the tier boundary and the cross-tier straddling claim."

      - name: readiness_weight_rounding_does_not_drift
        claim_type: weighted_scoring
        grounds:
          - calculations.re_entry_readiness
        excluded_because:
          difficulty_instance: readiness_bonus_tier_keyed_on_rounded_base
          rationale: "That §1.8 instance pins the 0.50 / 0.30 / 0.20 weighted sum, the rounding order (components -> rounded base -> tier lookup) and the resulting readiness at two attendance rates, which covers weight summation and rounding-accumulation drift."

  - section: validations
