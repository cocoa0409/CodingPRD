        grounds:
          - calculations.conformance_score.trigger
          - state_machines.ConformanceAssessment.DRAFT_to_UNDER_REVIEW
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_verified_conformance_score_on_router_assessment
          rationale: "That §1.8 instance asserts decided_overall_score stays null on submit for a THIRD_PARTY_TEST route and is written from the VERIFIED variant only by the lab report, which is exactly the selection rule."

      - name: reconciliation_verified_score_supersedes_provisional_on_report
        claim_type: Reconciliation
        grounds:
          - calculations.conformance_score.variants.VERIFIED
          - entities.ConformanceAssessment.fields.decided_overall_score
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_verified_conformance_score_on_router_assessment
          rationale: "The provisional -> verified switch and the resulting decided_overall_score / grade rewrite are asserted there; the reverse direction (clearing them on resubmit) is covered by side_effect_execution_resubmit_resets_lab_results_and_clears_verified_scores in this file."

