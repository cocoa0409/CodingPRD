      - name: operating_deficit_coverage_uses_floor_division_on_liquid_assets
        claim_type: Constants Applied
        grounds:
          - calculations.operating_deficit_coverage
          - constants.COVERAGE_MONTHS_MIN
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Coverage months use integer floor division of liquid assets by the monthly deficit, so 30000000 against a 1000000 monthly deficit gives exactly 30 months, above the 12-month floor, which is why the OPERATING_DEFICIT draw is refused even though the guarantee has full capacity."
