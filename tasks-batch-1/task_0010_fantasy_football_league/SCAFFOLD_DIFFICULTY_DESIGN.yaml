          `business_referential` (priority=9, ERR_TRADE_PLAYER_NOT_ON_ROSTER). A POST /trades that
          simultaneously offers a player not on the proposing team's roster AND that same player
          is IR_PLACED (would also fail starter rules if attempted): the lower-priority-number rule
          (business_safety check, priority=7) on the IR_PLACED→STARTER path fires earlier than
          the referential check (priority=9). However, since /trades doesn't directly trigger the
          starter validation, this conflict is realised through a sequenced two-endpoint setup —
          the test asserts that on set-lineup, the safety error (IR player as starter) takes
          precedence over the referential error (player not on roster, since IR slot was just
          vacated). Different error-category pair from instance A (state vs fiscal).
