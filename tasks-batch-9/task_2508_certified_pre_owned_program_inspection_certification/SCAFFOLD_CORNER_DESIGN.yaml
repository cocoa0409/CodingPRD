              as_user_id: "${t2}"
            - call: "POST /cpo/inspections/${i2}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/complaints/${cp1}"
              payload: {}
              as: CustomerAdvocate
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t2}", template_id: "${tpl}", started_at: "2026-07-31T20:00:00Z", odometer_at_inspection: 62000, complaint_id: "${cp1}" }
              as: DealerPrincipal
              as_user_id: "${d1}"
          assert:
            - "Complaint.${cp1} was created OPEN with filed_at == 2026-08-01T00:00:00Z, reinspection_deadline_at == 2026-08-06T00:00:00Z, reinspection_ordered_at == null, resolved_at == null"
            - "trigger call 1 returns 201 with Inspection.${i2}.purpose == RE_INSPECTION, complaint_id == ${cp1}, parent_inspection_id == null"
            - "trigger call 2 shows Complaint.${cp1}.status == REINSPECTION_ORDERED with reinspection_ordered_at == 2026-08-01T00:00:00Z"
            - "Vehicle.${v1}.cpo_state stays CERTIFIED during the re-inspection, because the certification is still ACTIVE"
            - "trigger call 4 returns 200 with Inspection.${i2}.status == PASSED and Technician.${t2}.completed_inspection_count == 1"
            - "trigger call 5 shows Complaint.${cp1}.status == RESOLVED_UPHELD with resolved_at == 2026-08-01T00:00:00Z"
            - "Certification.${c1}.status is still ACTIVE with fee_charged_cents 120400, warranty_end_date 2027-08-01 and warranty_end_miles 74000 untouched"
            - "trigger call 6 returns 409 ERR_COMPLAINT_NOT_OPEN: a resolved complaint cannot order a second re-inspection"

      - name: complaint_reinspection_failure_cascade_decertifies
        claim_type: side_effect_execution
        grounds:
          - state_machines[Complaint].transitions[REINSPECTION_ORDERED->RESOLVED_DECERTIFIED]
          - state_machines[Inspection].transitions[IN_PROGRESS->FAILED]
          - state_machines[Certification].transitions[ACTIVE->DECERTIFIED]
          - entities.Certification.fields.decertification_reason
        distinguishing_aspect: |
          The same submit endpoint that merely closes a complaint on PASS runs a four-hop cascade on
          FAIL: the inspection ends FAILED with CRITICAL_ITEM_FAIL, the complaint becomes
          RESOLVED_DECERTIFIED rather than DISMISSED, the certification is DECERTIFIED with reason
          COMPLAINT_REINSPECTION_FAIL and no fee credit, and the listing is withdrawn with a
          removal deadline while the vehicle drops to DECERTIFIED on the cpo axis but stays
          IN_INVENTORY on the inventory axis.
        test_recipe:
          setup:
            - "Canonical pipeline to ACTIVE certification C1 with a SYNDICATED OEM_SITE listing L1 and complaint CP1 already in REINSPECTION_ORDERED via re-inspection I2 by T2."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ada Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ben Tech", credential_id: "CR-2", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t2: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "S1", category: "SAFETY", severity: "CRITICAL", pass_criteria: "all airbag and restraint systems nominal", reconditioning_allowed: true, max_reconditioning_cost_cents: 200000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "B1", category: "BRAKES", severity: "MAJOR", pass_criteria: "pad thickness within 4.0..12.0 mm", min_measure: 4.0, max_measure: 12.0, reconditioning_allowed: true, max_reconditioning_cost_cents: 100000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000001", model_year: 2022, in_service_date: "2022-02-01", odometer_miles: 62000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 62000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i1: $.data.id }
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }, { item_code: "S1", outcome: "PASS" }, { item_code: "B1", outcome: "PASS", measured_value: 8.0 }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "POST /cpo/inspections/${i1}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/vehicles/${v1}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1_ver: $.data.version }
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${v1}", inspection_id: "${i1}", expected_vehicle_version: "${v1_ver}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-1" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-1" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-1" }] }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /cpo/certifications/${c1}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
              captures: { c1_ver_a: $.data.version }
            - call: "POST /cpo/listings"
              payload: { certification_id: "${c1}", channel: "OEM_SITE", price_cents: 2450000, disclosure_fields: ["CERTIFIED_BADGE", "WARRANTY_END_DATE", "INSPECTION_DATE", "CERTIFICATION_NUMBER"] }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { l1: $.data.id }
            - call: "POST /cpo/listings/${l1}/syndicate"
              payload: { expected_certification_version: "${c1_ver_a}" }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /cpo/complaints"
              payload: { certification_id: "${c1}", customer_reference: "CASE-2", category: "UNDISCLOSED_DAMAGE", description: "engine misfire and a repainted rear quarter panel" }
              as: CustomerAdvocate
              captures: { cp1: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t2}", template_id: "${tpl}", started_at: "2026-08-01T00:00:00Z", odometer_at_inspection: 62000, complaint_id: "${cp1}" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i2: $.data.id }
            - call: "PUT /cpo/inspections/${i2}/results"
              payload: { results: [{ item_code: "P1", outcome: "FAIL" }, { item_code: "S1", outcome: "PASS" }, { item_code: "B1", outcome: "PASS", measured_value: 8.0 }] }
              as: InspectionTechnician
              as_user_id: "${t2}"
          trigger:
            - call: "POST /cpo/inspections/${i2}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/complaints/${cp1}"
              payload: {}
              as: CustomerAdvocate
            - call: "GET /cpo/certifications/${c1}"
              payload: {}
              as: ProgramAuditor
            - call: "GET /cpo/certifications/${c1}/listings"
              payload: {}
              as: ProgramAuditor
            - call: "GET /cpo/vehicles/${v1}"
              payload: {}
              as: ProgramAuditor
          assert:
            - "trigger call 1 returns 200 with Inspection.${i2}.status == FAILED, failure_reason == CRITICAL_ITEM_FAIL, submitted_at == 2026-08-01T00:00:00Z"
            - "no ReconditioningItem row was generated: P1 declares reconditioning_allowed false, so the FAIL is unfixable and the inspection ends FAILED rather than RECONDITIONING_REQUIRED"
            - "trigger call 2 shows Complaint.${cp1}.status == RESOLVED_DECERTIFIED, not DISMISSED, with resolved_at == 2026-08-01T00:00:00Z"
            - "trigger call 3 shows Certification.${c1}.status == DECERTIFIED, decertification_reason == COMPLAINT_REINSPECTION_FAIL, fee_credited_cents == 0"
            - "trigger call 4 shows Listing.${l1}.status == WITHDRAWN, withdrawal_reason == CERTIFICATION_DECERTIFIED, removal_due_at == 2026-08-03T00:00:00Z"
            - "trigger call 5 shows Vehicle.${v1}.cpo_state == DECERTIFIED, certified_certification_id == null, inventory_state still IN_INVENTORY"
            - "Technician.${t2}.completed_inspection_count == 0: a FAILED submit does not count as a completed inspection"
            - "Dealer.${d1}.fee_balance_cents == 120400 and active_certification_count == 0"

      - name: vehicle_two_dimensions_advance_independently
        claim_type: valid_transition
        grounds:
          - state_machines[Vehicle:cpo_state]
          - state_machines[Vehicle:inventory_state]
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          The parallel shape: the cpo axis and the inventory axis advance on different triggers, and
          the only coupling is the IN_INVENTORY precondition on entering CERTIFICATION_PENDING.
        excluded_because:
          difficulty_instance: vehicle_parallel_cpo_and_inventory_dimensions
          rationale: |
            That instance walks both dimensions through their full cross-product on one vehicle,
            asserting each axis after every call and proving that a WHOLESALED vehicle can still be
            NOT_CERTIFIED and that a DECERTIFIED vehicle re-enters CERTIFICATION_PENDING only after
            a RETURNED_TO_INVENTORY event. A separate breadth instance would repeat it verbatim.

      - name: inspection_cycle_repeats_with_attempt_indexes
        claim_type: valid_transition
        grounds:
          - state_machines[Inspection].transitions[RECONDITIONING_REQUIRED->IN_PROGRESS]
          - entities.Inspection.fields.attempt_count
        distinguishing_aspect: |
          The cyclic shape: IN_PROGRESS -> RECONDITIONING_REQUIRED -> IN_PROGRESS may repeat, each
          loop bumping attempt_count and writing a fresh, non-colliding attempt of results.
        excluded_because:
          difficulty_instance: inspection_reconditioning_cycle_three_attempts
          rationale: |
            That instance drives three full loops, asserts attempt_count and the per-attempt
            recomputation of recorded_item_count, failed_critical_count and failed_recon_count after
            each one, and proves ReconditioningItem generation is idempotent on item_code across
            attempts. Any breadth version would be a strict subset of it.

      - name: certification_branch_and_audit_cycle_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines[Certification].transitions[SUBMITTED->ACTIVE]
          - state_machines[Certification].transitions[SUBMITTED->REJECTED]
          - state_machines[Certification].transitions[ACTIVE->UNDER_AUDIT]
          - state_machines[Certification].transitions[UNDER_AUDIT->ACTIVE]
        distinguishing_aspect: |
          The branching shape plus the audit cycle: the three forks out of SUBMITTED carry disjoint
          side-effect sets, and ACTIVE -> UNDER_AUDIT -> ACTIVE must return the row to ACTIVE with
          its fee, coverage and activated_at untouched.
        excluded_because:
          difficulty_instance: certification_audit_cycle_and_branch
          rationale: |
            That instance takes all three forks in one run — one certification approved, a sibling
            rejected with ADMIN_DECISION, a third superseded — then cycles the approved one through
            an audit that clears it, asserting after each hop that only the ACTIVE fork billed a fee
            and that the cleared certification is byte-identical on its financial fields.

      - name: retired_template_guard_blocks_new_inspection
        claim_type: precondition_enforcement
        grounds:
          - state_machines[ChecklistTemplate].transitions[PUBLISHED->RETIRED]
          - errors[ERR_TEMPLATE_NOT_PUBLISHED]
        distinguishing_aspect: |
          The guarded transition: an inspection may only name a template that is PUBLISHED at that
          instant, so retirement by a newer publication closes the door on new inspections while
          leaving existing ones pointing at the retired template.
        excluded_because:
          difficulty_instance: inspection_blocked_by_retired_template
          rationale: |
            That instance publishes a successor template mid-pipeline and shows both halves of the
            guard: the in-flight inspection keeps its retired template and still submits and
            certifies, while a brand-new inspection naming the same template is refused with
            ERR_TEMPLATE_NOT_PUBLISHED.

  # ===========================================================================
  # 3. From Table 1.3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:

      - name: certification_fee_zero_surcharge_zero_discount
        claim_type: correct_result
        grounds:
          - calculations.certification_fee
          - entities.ProgramConfig.fields.base_fee_cents
          - entities.ProgramConfig.fields.age_surcharge_free_years
          - entities.ProgramConfig.fields.mileage_surcharge_free_miles
        distinguishing_aspect: |
          The unsurcharged, undiscounted floor of the fee formula: a vehicle exactly inside both free
          allowances (age_years 3 with 3 free years, 30000 miles under the 40000-mile floor) is
          billed the bare base_fee_cents 89900 with fee_surcharge_cents 0 and fee_discount_cents 0.
          age_over uses max(0, age_years - free_years), so the third year must not leak one
          surcharge step.
        test_recipe:
          setup:
            - "Dealer D1 with technician T1, published MPI-172, and a young low-mileage vehicle: in_service_date 2023-05-10, odometer 30000."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ada Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "S1", category: "SAFETY", severity: "CRITICAL", pass_criteria: "all airbag and restraint systems nominal", reconditioning_allowed: true, max_reconditioning_cost_cents: 200000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "B1", category: "BRAKES", severity: "MAJOR", pass_criteria: "pad thickness within 4.0..12.0 mm", min_measure: 4.0, max_measure: 12.0, reconditioning_allowed: true, max_reconditioning_cost_cents: 100000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000010", model_year: 2023, in_service_date: "2023-05-10", odometer_miles: 30000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 30000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i1: $.data.id }
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }, { item_code: "S1", outcome: "PASS" }, { item_code: "B1", outcome: "PASS", measured_value: 8.0 }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "POST /cpo/inspections/${i1}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/vehicles/${v1}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1_ver: $.data.version }
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${v1}", inspection_id: "${i1}", expected_vehicle_version: "${v1_ver}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-1" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-1" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-1" }] }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /cpo/certifications/${c1}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
          assert:
            - "returns 200 with Certification.${c1}.fee_surcharge_cents == 0, fee_discount_cents == 0, fee_charged_cents == 89900"
            - "the arithmetic: age_days 1179 from 2023-05-10 to 2026-08-01, age_years floor(1179/365) == 3, age_over max(0, 3 - 3) == 0"
            - "miles_over max(0, 30000 - 40000) == 0 so blocks == 0 and raw_surcharge == 0, well under the cap floor(89900 * 0.35) == 31465"
            - "the tier is min_count 0 at pct 0.00 because Dealer.${d1}.lifetime_activated_count was 0 before this activation"
            - "Certification.${c1}.program_config_version == 1 and warranty_anchor_variant == CERTIFICATION_ANCHORED, since the 36-month factory term expired 2026-05-10"
            - "Dealer.${d1}.fee_billed_cents_total == 89900 and fee_balance_cents == 89900"

      - name: mileage_surcharge_block_constant_floors_partial_block
        claim_type: constants_applied
        grounds:
          - calculations.certification_fee.constants.MILEAGE_BLOCK_MILES
          - entities.ProgramConfig.fields.mileage_surcharge_cents_per_10k
        distinguishing_aspect: |
          The mileage surcharge is charged in whole 10000-mile blocks: 55000 miles is 15000 over the
          free floor, which floors to exactly one block and 9000 cents, so the leftover 5000 miles
          are free. An implementation that pro-rates the partial block bills 13500 instead, and one
          that ceils bills 18000.
        test_recipe:
          setup:
            - "Identical to certification_fee_zero_surcharge_zero_discount except the vehicle reads 55000 miles."
          setup_api_calls:
