# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1159: Farmland Leasing & Cash-Rent Management
# Nine Difficulty Rules x >=2 instances. Every setup chain replays against
# SCAFFOLD.yaml §1.5 only; all money/date asserts are precomputed literals.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: flex_settlement_provisional_vs_final_price
        grounds:
          - calculations.flex_rent_computation
          - entities.HarvestSettlement.fields.landlord_amount_cents
          - state_machines.HarvestSettlement.PROVISIONAL_to_VOID
        distinguishing_aspect: |
          Identical lease parameters and yield, with only price_source flipped
          ESTIMATED -> ACTUAL, produce two different landlord_amount_cents values
          (2000000 vs 2200000) on the SAME HarvestSettlement subject; the
          provisional row is superseded to VOID by the final one.
        test_recipe:
          setup:
            - "FLEX lease ACTIVE: 100 acres, flex base 20000 cents/acre, bonus 20%, cap 500000, trigger 9000000"
            - "Lease.version == 2 after activation"
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Flex", contact_email: "lf@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T Flex", years_experience: 12 }
              as: FarmManager
              captures:
                tn: "$.data.id"
            - call: "POST /tenants/${tn}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "F1", acres: 100, soil_csr2: 85 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "FLEX", flex_base_per_acre_cents: 20000, flex_bonus_pct: 0.2, flex_cap_cents: 500000, revenue_trigger_cents: 9000000, cash_equivalent_bid_cents_per_acre: 22000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                bid: "$.data.id"
            - call: "POST /bids/${bid}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${off}/close"
              as: FarmManager
            - call: "POST /offerings/${off}/award"
              payload: { bid_id: "${bid}" }
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /leases"
              payload: { bid_id: "${bid}", term_start_date: "2027-03-01T00:00:00Z", term_end_date: "2028-03-01T00:00:00Z", payment_pattern: "MAR_NOV_50_50", escalation_type: "NONE" }
              as: FarmManager
              captures:
                lse: "$.data.id"
            - call: "POST /leases/${lse}/activate"
              as: FarmManager
            - call: "GET /leases/${lse}"
              as: FarmManager
              captures:
                lv: "$.data.version"
          trigger:
            - call: "POST /settlements"
              payload: { lease_id: "${lse}", crop_year: 2027, price_source: "ESTIMATED", yield_bu_per_acre: 200, harvest_price_cents_per_bu: 450, expected_lease_version: "${lv}" }
              as: FarmManager
              captures:
                s_prov: "$.data.id"
                prov_amt: "$.data.landlord_amount_cents"
            - call: "GET /leases/${lse}"
              as: FarmManager
              captures:
                lv2: "$.data.version"
            - call: "POST /settlements"
              payload: { lease_id: "${lse}", crop_year: 2027, price_source: "ACTUAL", yield_bu_per_acre: 200, harvest_price_cents_per_bu: 500, expected_lease_version: "${lv2}" }
              as: FarmManager
              captures:
                s_fin: "$.data.id"
                fin_amt: "$.data.landlord_amount_cents"
            - call: "GET /settlements/${s_prov}"
              as: FarmManager
              captures:
                prov_status: "$.data.status"
          assert:
            - "provisional settlement ${s_prov}.landlord_amount_cents == 2000000 (gross 200*450*100 = 9000000 == trigger => bonus 0 => base 20000*100)"
            - "final settlement ${s_fin}.landlord_amount_cents == 2200000 (gross 10000000, bonus round_half_up(1000000*0.2)=200000)"
            - "${fin_amt} - ${prov_amt} == 200000 (variant divergence on identical lease parameters)"
            - "provisional settlement ${s_prov}.status == VOID (superseded by the ACTUAL create)"

      - name: improvement_reimbursement_straight_line_vs_agreed_value
        grounds:
          - calculations.early_termination_reimbursement
          - entities.ImprovementProject.fields.reimbursement_due_cents
          - state_machines.Lease.TERMINATION_PENDING_to_TERMINATED
        distinguishing_aspect: |
          Two improvement projects with identical cost (tenant_paid_cents
          1000000), identical completion and termination dates, differ only in
          reimbursement_method: STRAIGHT_LINE yields 799452 while AGREED_VALUE
          yields 750000 — a capital-improvement-domain dual variant, distinct
          from the settlement-domain variant of the sibling instance.
        test_recipe:
          setup:
            - "CASH lease ACTIVE, term [2027-03-01, 2028-03-01), notice_lead_days 180 (deadline 2027-09-03)"
            - "Two COMPLETED improvements linked to the lease, completed_at 2027-03-01, amortization 5 years, 50/50 cost split of 2000000"
            - "Notice served 2027-08-15 (on time) -> effective 2028-03-01; clock advanced to 2028-03-01 fires termination"
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Imp", contact_email: "li@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T Imp", years_experience: 8 }
              as: FarmManager
              captures:
                tn: "$.data.id"
            - call: "POST /tenants/${tn}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "F2", acres: 100, soil_csr2: 80 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "CASH", cash_bid_per_acre_cents: 25000, cash_equivalent_bid_cents_per_acre: 25000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                bid: "$.data.id"
            - call: "POST /bids/${bid}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${off}/close"
              as: FarmManager
            - call: "POST /offerings/${off}/award"
              payload: { bid_id: "${bid}" }
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /leases"
              payload: { bid_id: "${bid}", term_start_date: "2027-03-01T00:00:00Z", term_end_date: "2028-03-01T00:00:00Z", payment_pattern: "MAR_NOV_50_50", escalation_type: "NONE" }
              as: FarmManager
              captures:
                lse: "$.data.id"
            - call: "POST /leases/${lse}/activate"
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: FarmManager
            - call: "POST /improvements"
              payload: { field_id: "${fld}", lease_id: "${lse}", project_type: "TILE_DRAINAGE", total_cost_cents: 2000000, landlord_share_pct: 0.5, tenant_share_pct: 0.5, reimbursement_method: "STRAIGHT_LINE", amortization_years: 5 }
              as: FarmManager
              captures:
                imp1: "$.data.id"
                tp1: "$.data.tenant_paid_cents"
            - call: "POST /improvements"
              payload: { field_id: "${fld}", lease_id: "${lse}", project_type: "IRRIGATION", total_cost_cents: 2000000, landlord_share_pct: 0.5, tenant_share_pct: 0.5, reimbursement_method: "AGREED_VALUE", amortization_years: 5 }
              as: FarmManager
              captures:
                imp2: "$.data.id"
            - call: "POST /improvements/${imp1}/approve"
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /improvements/${imp2}/approve"
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /improvements/${imp1}/complete"
              as: FarmManager
            - call: "POST /improvements/${imp2}/complete"
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-15T00:00:00Z" }
              as: FarmManager
            - call: "POST /notices"
              payload: { lease_id: "${lse}", served_by: "LANDLORD" }
              as: Landlord
              as_user_id: "${ld}"
              captures:
                ntc: "$.data.id"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-03-01T00:00:00Z" }
              as: FarmManager
          trigger:
            - call: "GET /improvements/${imp1}"
              as: FarmManager
              captures:
                r1: "$.data.reimbursement_due_cents"
                rs1: "$.data.reimbursement_status"
            - call: "GET /improvements/${imp2}"
              as: FarmManager
              captures:
                r2: "$.data.reimbursement_due_cents"
                rs2: "$.data.reimbursement_status"
            - call: "GET /leases/${lse}"
              as: FarmManager
              captures:
                lst: "$.data.status"
          assert:
            - "improvement ${imp1}.tenant_paid_cents == 1000000 (round_half_up(2000000*0.5))"
            - "improvement ${imp1}.reimbursement_due_cents == 799452 (STRAIGHT_LINE: elapsed 366 days, total 1825, round_half_up(1000000*1459/1825))"
            - "improvement ${imp2}.reimbursement_due_cents == 750000 (AGREED_VALUE: bucket floor(366/365)=1 -> 75%)"
            - "${r1} != ${r2} (two valid methods, different cents for identical inputs)"
            - "both improvements have reimbursement_status == DUE"
            - "lease ${lse}.status == TERMINATED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes a / b / c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: flex_bonus_cap_and_trigger_nesting
        grounds:
          - calculations.flex_rent_computation
        distinguishing_aspect: |
          Mode (a): the formula combines >=3 inputs (yield, price, acres,
          trigger, pct, cap) with non-linear nested min/max: at gross 20000000
          the raw bonus 2200000 is clamped by min() to the 500000 cap, so
          landlord_amount_cents == 2500000 rather than the uncapped 4200000.
        test_recipe:
          setup:
            - "FLEX lease ACTIVE: 100 acres, base 20000/acre, bonus 20%, cap 500000, trigger 9000000; lease.version == 2"
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Cap", contact_email: "lc@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T Cap", years_experience: 5 }
              as: FarmManager
              captures:
                tn: "$.data.id"
            - call: "POST /tenants/${tn}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "F3", acres: 100, soil_csr2: 88 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "FLEX", flex_base_per_acre_cents: 20000, flex_bonus_pct: 0.2, flex_cap_cents: 500000, revenue_trigger_cents: 9000000, cash_equivalent_bid_cents_per_acre: 22000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                bid: "$.data.id"
            - call: "POST /bids/${bid}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${off}/close"
              as: FarmManager
            - call: "POST /offerings/${off}/award"
              payload: { bid_id: "${bid}" }
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /leases"
              payload: { bid_id: "${bid}", term_start_date: "2027-03-01T00:00:00Z", term_end_date: "2028-03-01T00:00:00Z", payment_pattern: "MAR_NOV_50_50", escalation_type: "NONE" }
              as: FarmManager
              captures:
                lse: "$.data.id"
            - call: "POST /leases/${lse}/activate"
              as: FarmManager
            - call: "GET /leases/${lse}"
              as: FarmManager
              captures:
                lv: "$.data.version"
          trigger:
            - call: "POST /settlements"
              payload: { lease_id: "${lse}", crop_year: 2027, price_source: "ACTUAL", yield_bu_per_acre: 400, harvest_price_cents_per_bu: 500, expected_lease_version: "${lv}" }
              as: FarmManager
              captures:
                s_id: "$.data.id"
          assert:
            - "settlement ${s_id}.gross_revenue_cents == 20000000 (400*500*100)"
            - "settlement ${s_id}.landlord_amount_cents == 2500000 (raw bonus min-capped: min(500000, 2200000) = 500000; base 2000000)"

      - name: share_settlement_per_line_rounding
        grounds:
          - calculations.share_settlement
          - entities.ExpenseRecord.fields.landlord_share_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — each expense line is rounded
          to cents BEFORE summing. Two lines of 100001 cents at 50% give
          50001 + 50001 = 100002; the forbidden sum-then-round order gives
          round_half_up(200002*0.5) = 100001. Asserts the 1-cent divergence.
        test_recipe:
          setup:
            - "SHARE lease ACTIVE: 100 acres, landlord_share_pct 0.4, input_share_pct 0.5, payment_pattern NONE"
            - "Two APPROVED expenses of 100001 cents each for crop_year 2027"
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Shr", contact_email: "ls@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T Shr", years_experience: 15 }
              as: FarmManager
              captures:
                tn: "$.data.id"
            - call: "POST /tenants/${tn}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "F4", acres: 100, soil_csr2: 90 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "SHARE", landlord_share_pct: 0.4, input_share_pct: 0.5, cash_equivalent_bid_cents_per_acre: 25000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                bid: "$.data.id"
            - call: "POST /bids/${bid}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${off}/close"
              as: FarmManager
            - call: "POST /offerings/${off}/award"
              payload: { bid_id: "${bid}" }
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /leases"
              payload: { bid_id: "${bid}", term_start_date: "2027-03-01T00:00:00Z", term_end_date: "2028-03-01T00:00:00Z", payment_pattern: "NONE", escalation_type: "NONE" }
              as: FarmManager
              captures:
                lse: "$.data.id"
            - call: "POST /leases/${lse}/activate"
              as: FarmManager
            - call: "POST /expenses"
              payload: { lease_id: "${lse}", category: "SEED", total_cost_cents: 100001, incurred_date: "2027-04-10T00:00:00Z", crop_year: 2027 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                exp1: "$.data.id"
                es1: "$.data.landlord_share_cents"
            - call: "POST /expenses"
              payload: { lease_id: "${lse}", category: "FERTILIZER", total_cost_cents: 100001, incurred_date: "2027-04-12T00:00:00Z", crop_year: 2027 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                exp2: "$.data.id"
                es2: "$.data.landlord_share_cents"
            - call: "POST /expenses/${exp1}/approve"
              as: FarmManager
            - call: "POST /expenses/${exp2}/approve"
              as: FarmManager
            - call: "GET /leases/${lse}"
              as: FarmManager
              captures:
                lv: "$.data.version"
          trigger:
            - call: "POST /settlements"
              payload: { lease_id: "${lse}", crop_year: 2027, price_source: "ACTUAL", yield_bu_per_acre: 200, harvest_price_cents_per_bu: 500, expected_lease_version: "${lv}" }
              as: FarmManager
              captures:
                s_id: "$.data.id"
          assert:
            - "expense ${exp1}.landlord_share_cents == 50001 (round_half_up(100001*0.5) per line)"
            - "expense ${exp2}.landlord_share_cents == 50001"
            - "settlement ${s_id}.input_share_total_cents == 100002 (sum of per-line rounded; sum-then-round would give 100001)"
            - "settlement ${s_id}.landlord_amount_cents == 4000000 (round_half_up(10000000*0.4))"
            - "settlement ${s_id}.net_settlement_cents == 3899998 (4000000 - 100002)"

      - name: settlement_true_up_excludes_own_adjustment
        grounds:
          - calculations.settlement_true_up
          - state_machines.HarvestSettlement.FINALIZED_to_COUNTERSIGNED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — true_up depends on billed,
          billed sums installments, and countersigning CREATES a new adjustment
          installment. The pinned evaluation order computes billed first,
          excluding this settlement's own adjustment, so billed_amount_cents
          stays 2000000 and true_up_cents == 200000 (not 0).
        test_recipe:
          setup:
            - "FLEX lease ACTIVE: base 20000/acre on 100 acres (annual 2000000), MAR_NOV_50_50 -> two installments of 1000000 each, crop_year 2027"
            - "Settlement ACTUAL yield 200 price 500 FINALIZED by mgr-1"
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L TU", contact_email: "lt@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T TU", years_experience: 9 }
              as: FarmManager
              captures:
                tn: "$.data.id"
            - call: "POST /tenants/${tn}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "F5", acres: 100, soil_csr2: 82 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "FLEX", flex_base_per_acre_cents: 20000, flex_bonus_pct: 0.2, flex_cap_cents: 500000, revenue_trigger_cents: 9000000, cash_equivalent_bid_cents_per_acre: 22000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                bid: "$.data.id"
            - call: "POST /bids/${bid}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${off}/close"
              as: FarmManager
            - call: "POST /offerings/${off}/award"
              payload: { bid_id: "${bid}" }
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /leases"
              payload: { bid_id: "${bid}", term_start_date: "2027-03-01T00:00:00Z", term_end_date: "2028-03-01T00:00:00Z", payment_pattern: "MAR_NOV_50_50", escalation_type: "NONE" }
              as: FarmManager
              captures:
                lse: "$.data.id"
            - call: "POST /leases/${lse}/activate"
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-11-15T00:00:00Z" }
              as: FarmManager
            - call: "GET /leases/${lse}"
              as: FarmManager
              captures:
                lv: "$.data.version"
            - call: "POST /settlements"
              payload: { lease_id: "${lse}", crop_year: 2027, price_source: "ACTUAL", yield_bu_per_acre: 200, harvest_price_cents_per_bu: 500, expected_lease_version: "${lv}" }
              as: FarmManager
              captures:
                s_id: "$.data.id"
            - call: "POST /settlements/${s_id}/finalize"
              as: FarmManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /settlements/${s_id}/countersign"
              as: FarmManager
              as_user_id: "mgr-2"
              captures:
                s_final: "$.data.id"
            - call: "GET /installments?lease_id=${lse}"
              as: FarmManager
              captures:
                adj_amt: "$.data[2].amount_cents"
                adj_status: "$.data[2].status"
                adj_due: "$.data[2].due_date"
          assert:
            - "settlement ${s_id}.billed_amount_cents == 2000000 (two base installments; the adjustment created by THIS countersign is excluded by the pinned evaluation order)"
            - "settlement ${s_id}.true_up_cents == 200000 (net 2200000 - billed 2000000)"
            - "adjustment installment amount_cents == 200000, status == SCHEDULED, due_date == 2027-12-15T00:00:00Z (clock 2027-11-15 + 30 days)"
            - "settlement ${s_id}.status == COUNTERSIGNED"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: lease_notice_serve_withdraw_cycle
        grounds:
          - state_machines.Lease.ACTIVE_to_TERMINATION_PENDING
          - state_machines.Lease.TERMINATION_PENDING_to_ACTIVE
          - calculations.statutory_notice_deadline
        distinguishing_aspect: |
          Cyclic shape on Lease: ACTIVE -> TERMINATION_PENDING -> ACTIVE via
          notice serve then withdraw (A->B->A), with deadline math pinned
          (deadline 2027-09-03, effective 2028-03-01 for term end 2028-03-01).
        test_recipe:
          setup:
            - "CASH lease ACTIVE, term [2027-03-01, 2028-03-01), notice_lead_days 180; clock at 2027-08-15"
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Cyc", contact_email: "ly@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T Cyc", years_experience: 6 }
              as: FarmManager
              captures:
