            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
            - call: "POST /vks/teachers"
              payload: { full_name: "Mr. Jones", certification_state_codes: ["TX"], caseload_cap: 5 }
              as: AcademicDirector
              captures: { teacher_id: $.data.id }
            - call: "POST /vks/teacher-assignments"
              payload: { teacher_id: "${teacher_id}", student_id: "${student_id}", subject: "MATH" }
              as: AcademicDirector
              captures: { ta_id: $.data.id }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vks/students/${student_id}/withdraw"
              payload: { withdrawal_reason: "HOMESCHOOL" }
              as: EnrollmentOfficer
          assert:
            - "TeacherAssignment.${ta_id}.assignment_status == ENDED"
            - "Teacher.${teacher_id}.current_caseload == 0"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_teacher_assignment
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_TEACHER_NOT_CERTIFIED_IN_STATE]
        distinguishing_aspect: |
          Pair (state vs business_safety): POST /vks/teacher-assignments
          where the student is not ENROLLED (state violation, priority 5)
          AND the teacher is not certified in the student's state
          (business_safety violation, priority 7). The state check fires
          first; the response MUST be ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "District D in state CA; Student S in APPLIED status (residency not verified)"
            - "Teacher T certified only in TX (not CA)"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-040", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 10 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Jack", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 7, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/teachers"
              payload: { full_name: "Ms. Lee", certification_state_codes: ["TX"], caseload_cap: 30 }
              as: AcademicDirector
              captures: { teacher_id: $.data.id }
          trigger:
            - call: "POST /vks/teacher-assignments"
              payload: { teacher_id: "${teacher_id}", student_id: "${student_id}", subject: "ELA" }
              as: AcademicDirector
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_INVALID_STATE"
      - name: business_constraint_vs_business_fiscal_on_stipend_issue
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors[ERR_DUPLICATE_ACTIVE_STIPEND]
          - errors[ERR_DISTRICT_CAP_REACHED]
        distinguishing_aspect: |
          Pair (business_constraint vs business_fiscal) on a different
          endpoint and a different error pair than instance 1: when a second
          DEVICE stipend issue is attempted for the same student while one
          is already ISSUED, the duplicate-stipend constraint (priority 13)
          fires; the fiscal cap (priority 14) is a different rule on a
          different endpoint. This instance demonstrates that the constraint
          category (13) and the fiscal category (14) are distinguishable —
          here we assert ERR_DUPLICATE_ACTIVE_STIPEND wins on the stipend
          endpoint.
        test_recipe:
          setup:
            - "Student S enrolled; DEVICE stipend already ISSUED to S"
            - "Second DEVICE stipend REQUESTED for S"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-041", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 10 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Karen", date_of_birth: "2011-01-01T00:00:00Z", grade_level: 8, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
            - call: "POST /vks/stipends"
              payload: { student_id: "${student_id}", stipend_type: "DEVICE", amount_cents: 40000 }
              as: FinanceOfficer
              captures: { stipend1_id: $.data.id }
            - call: "POST /vks/stipends/${stipend1_id}/issue"
              payload: {}
              as: FinanceOfficer
            - call: "POST /vks/stipends"
              payload: { student_id: "${student_id}", stipend_type: "DEVICE", amount_cents: 40000 }
              as: FinanceOfficer
              captures: { stipend2_id: $.data.id }
          trigger:
            - call: "POST /vks/stipends/${stipend2_id}/issue"
              payload: {}
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_DUPLICATE_ACTIVE_STIPEND"
            - "DeviceStipend.${stipend2_id}.issue_status == REQUESTED"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics / endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: truancy_threshold_exactly_at_boundary
        grounds:
          - calculations.truancy_determination
          - calculations.truancy_window_count
        distinguishing_aspect: |
          Metric: count of unexcused absences. The threshold is inclusive
          (>=3). At count=2 the flag is false; at count=3 the flag flips to
          true. Tested via POST /vks/attendance.
        test_recipe:
          setup:
            - "Student S enrolled 2026-08-03"
            - "Two ABSENT_UNEXCUSED records on 2026-08-03 and 2026-08-04 -> truancy_unexcused_count=2, flag=false"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-050", state_code: "AZ", funding_rate_cents: 400, enrollment_cap: 10 }
