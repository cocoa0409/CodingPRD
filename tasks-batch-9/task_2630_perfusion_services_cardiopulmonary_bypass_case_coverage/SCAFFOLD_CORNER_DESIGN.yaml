            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${p_ecmo}", slot_type: "ECMO_RELIEF", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: ContractAdmin
              captures: { slot_relief: $.data.id }
          assert:
