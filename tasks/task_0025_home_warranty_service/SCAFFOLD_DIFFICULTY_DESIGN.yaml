        test_recipe:
          setup:
            - "An ACTIVE Contract on PLUS package with one ClaimTicket in DISPATCHED whose Dispatch is COMPLETED; estimated and ready to /resolve with actual_repair_cost_cents=20000."
          setup_api_calls:
