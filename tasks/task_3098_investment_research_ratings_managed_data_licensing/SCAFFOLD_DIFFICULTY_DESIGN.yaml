          assert:
            - "link-license itself fails with error_id ERR_LICENSE_TIER_INSUFFICIENT because the agreement tier is DISPLAY (e_link == ERR_LICENSE_TIER_INSUFFICIENT)"
            - "launch therefore also fails (no licensed_agreement_id set) with error_id ERR_INDEX_NOT_LICENSABLE and http 409 (e_launch == ERR_INDEX_NOT_LICENSABLE)"
            - "IndexDefinition.${ix1_id}.index_status == DRAFT"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: methodology_window_overlap_rejected_but_abutment_allowed
        grounds:
          - validations[priority=9]
          - state_machines.Methodology.DRAFT_to_EFFECTIVE
          - errors[ERR_TEMPORAL_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [effective_from, effective_to) windows
          on same-code methodologies — overlap rejected, but exact abutment
          (prior effective_to == next effective_from) is LEGAL. Resource:
          Methodology version line.
        test_recipe:
          setup:
            - "Methodology line QV8: v1 EFFECTIVE with window [2026-01-01, 2026-07-01); v2 DRAFT with window [2026-06-01, null) (overlaps); v3 DRAFT with window [2026-07-01, null) (abuts)."
          setup_api_calls:
            - call: "POST /research/methodologies"
              payload: { methodology_code: "QV8", methodology_kind: "QUANTITATIVE", version_number: 1, effective_from: "2026-01-01", effective_to: "2026-07-01", weight_return_bp: 6000, weight_risk_bp: 4000, rating_ceilings: [7000, 5000, 3000, 1000] }
              as: ResearchOps
              captures: { m81_id: $.data.id }
            - call: "POST /research/methodologies/${m81_id}/activate"
              payload: {}
              as: ResearchOps
            - call: "POST /research/methodologies"
              payload: { methodology_code: "QV8", methodology_kind: "QUANTITATIVE", version_number: 2, effective_from: "2026-06-01", weight_return_bp: 6000, weight_risk_bp: 4000, rating_ceilings: [7000, 5000, 3000, 1000] }
              as: ResearchOps
              captures: { m82_id: $.data.id }
            - call: "POST /research/methodologies"
              payload: { methodology_code: "QV8", methodology_kind: "QUANTITATIVE", version_number: 3, effective_from: "2026-07-01", weight_return_bp: 6000, weight_risk_bp: 4000, rating_ceilings: [7000, 5000, 3000, 1000] }
              as: ResearchOps
              captures: { m83_id: $.data.id }
          trigger:
            - call: "POST /research/methodologies/${m82_id}/activate"
              payload: {}
              as: ResearchOps
              captures: { e_overlap: $.data.error_id }
            - call: "POST /research/methodologies/${m83_id}/activate"
              payload: {}
              as: ResearchOps
          assert:
            - "v2 activation fails with error_id ERR_TEMPORAL_OVERLAP and http 422 (e_overlap == ERR_TEMPORAL_OVERLAP); window [2026-06-01, open) intersects [2026-01-01, 2026-07-01)"
            - "v3 activation SUCCEEDS because effective_from == v1.effective_to (abutment, half-open semantics)"
            - "Methodology.${m81_id}.methodology_status == SUPERSEDED and effective_to == 2026-07-01"
            - "Methodology.${m83_id}.methodology_status == EFFECTIVE"

      - name: agreement_window_overlap_same_tier_but_not_cross_tier
        grounds:
          - validations[priority=9]
          - state_machines.LicenseAgreement.DRAFT_to_ACTIVE
          - errors[ERR_TEMPORAL_OVERLAP]
        distinguishing_aspect: |
          Different interval semantics on a different resource: overlap is
          detected per (licensee, tier) pair, NOT on the raw window — two
          same-tier agreements for one licensee with overlapping windows
          conflict, but a same-window agreement at a DIFFERENT tier is legal
          (keyed-overlap vs pure interval-overlap semantics).
        test_recipe:
          setup:
            - "Licensee LO ACTIVE; agreement O1 DISPLAY ACTIVE with window [2026-01-01, null); agreement O2 DISPLAY DRAFT window [2026-06-01, null); agreement O3 REDISTRIBUTION DRAFT window [2026-06-01, null)."
          setup_api_calls:
            - call: "POST /research/licensees"
              payload: { licensee_name: "Overlap Org" }
              as: LicenseAdmin
              captures: { lo_id: $.data.id }
            - call: "POST /research/license-agreements"
              payload: { licensee_id: "${lo_id}", tier: "DISPLAY", seat_limit: 5, effective_from: "2026-01-01", base_fee_cents: 100000 }
              as: LicenseAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /research/license-agreements/${o1_id}/activate"
              payload: {}
              as: LicenseAdmin
            - call: "POST /research/license-agreements"
              payload: { licensee_id: "${lo_id}", tier: "DISPLAY", seat_limit: 5, effective_from: "2026-06-01", base_fee_cents: 100000 }
              as: LicenseAdmin
              captures: { o2_id: $.data.id }
            - call: "POST /research/license-agreements"
              payload: { licensee_id: "${lo_id}", tier: "REDISTRIBUTION", seat_limit: 5, effective_from: "2026-06-01", base_fee_cents: 100000 }
              as: LicenseAdmin
              captures: { o3_id: $.data.id }
          trigger:
            - call: "POST /research/license-agreements/${o2_id}/activate"
              payload: {}
              as: LicenseAdmin
              captures: { e_ao: $.data.error_id }
            - call: "POST /research/license-agreements/${o3_id}/activate"
              payload: {}
              as: LicenseAdmin
          assert:
            - "O2 activation fails with error_id ERR_TEMPORAL_OVERLAP and http 422 (same licensee, same tier, overlapping windows) (e_ao == ERR_TEMPORAL_OVERLAP)"
            - "O3 activation SUCCEEDS despite the identical window, because the conflict key is (licensee, tier)"
            - "LicenseAgreement.${o3_id}.agreement_status == ACTIVE"
            - "LicenseAgreement.${o2_id}.agreement_status == DRAFT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_grant_revoke_conserves_seats_in_use
        grounds:
          - state_machines.SeatEntitlement.transitions
          - entities.LicenseAgreement.fields.seats_in_use
        distinguishing_aspect: |
          Conserved quantity: LicenseAgreement.seats_in_use. Forward action
          (grant) increments by 1; compensating action (revoke) decrements by
          1; grant+revoke leaves seats_in_use bit-identical to the pre-grant
          value — formula: seats_in_use == count(seats with seat_status ==
          ACTIVE) at every observable point.
        test_recipe:
          setup:
            - "Licensee LINV ACTIVE; agreement AINV (REDISTRIBUTION, seat_limit 3, ACTIVE); seats_in_use == 0."
          setup_api_calls:
            - call: "POST /research/licensees"
              payload: { licensee_name: "Invariant Inc" }
              as: LicenseAdmin
              captures: { linv_id: $.data.id }
            - call: "POST /research/license-agreements"
              payload: { licensee_id: "${linv_id}", tier: "REDISTRIBUTION", seat_limit: 3, effective_from: "2026-01-01", base_fee_cents: 100000 }
              as: LicenseAdmin
              captures: { ainv_id: $.data.id }
            - call: "POST /research/license-agreements/${ainv_id}/activate"
              payload: {}
              as: LicenseAdmin
            - call: "GET /research/license-agreements/${ainv_id}"
              payload: {}
              as: LicenseAdmin
              captures: { ainv_v: $.data.version }
            - call: "POST /research/license-agreements/${ainv_id}/seats"
              payload: { workstation_user_id: "inv-1", expected_agreement_version: "${ainv_v}" }
              as: LicenseAdmin
              captures: { sinv1_id: $.data.id }
          trigger:
            - call: "POST /research/seat-entitlements/${sinv1_id}/revoke"
              payload: {}
              as: LicenseAdmin
          assert:
            - "after grant, seats_in_use was 1; after the compensating revoke, LicenseAgreement.${ainv_id}.seats_in_use == 0 (conserved)"
            - "SeatEntitlement.${sinv1_id}.seat_status == REVOKED"
            - "count of ACTIVE seats on ${ainv_id} == seats_in_use == 0 (denormalized counter reconciles with source rows)"

      - name: dispute_open_close_cycle_conserves_open_dispute_count
        grounds:
          - state_machines.DataDispute.transitions
          - entities.FundCompany.fields.open_dispute_count
        distinguishing_aspect: |
          A DIFFERENT conserved quantity — FundCompany.open_dispute_count:
          investigate increments (+1), resolve(REJECTED) decrements (-1); the
          pair leaves open_dispute_count unchanged AND leaves the fund's
          trailing_return_3y_bp unchanged (REJECTED writes nothing), while
          resolve(ACCEPTED) conserves the count but mutates the field — two
          compensating paths over the same conserved counter.
        test_recipe:
          setup:
            - "FundCompany FINV ACTIVE (open_dispute_count 0); Fund FDINV ACTIVE with trailing_return_3y_bp 5000; two disputes D1 (will be rejected) and D2 (will be accepted with corrected_value 7000) raised by the issuer rep."
          setup_api_calls:
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Dispute Sponsor", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { finv_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${finv_id}", ticker: "DINV", inception_date: "2020-01-01", trailing_return_3y_bp: 5000, trailing_return_5y_bp: 5000, risk_score_bp: 3000 }
              as: ResearchOps
              captures: { fdinv_id: $.data.id }
            - call: "POST /research/funds/${fdinv_id}/disputes"
              payload: { raised_by_company_id: "${finv_id}", disputed_field: "TRAILING_RETURN_3Y", corrected_value: 6000 }
              as: FundCompanyRep
              as_user_id: "${finv_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /research/funds/${fdinv_id}/disputes"
              payload: { raised_by_company_id: "${finv_id}", disputed_field: "TRAILING_RETURN_3Y", corrected_value: 7000 }
              as: FundCompanyRep
              as_user_id: "${finv_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /research/data-disputes/${d1_id}/investigate"
              payload: {}
              as: ResearchOps
            - call: "POST /research/data-disputes/${d2_id}/investigate"
              payload: {}
              as: ResearchOps
            - call: "GET /research/data-disputes/${d1_id}"
              payload: {}
              as: ResearchOps
              captures: { d1_v: $.data.version }
            - call: "GET /research/data-disputes/${d2_id}"
              payload: {}
              as: ResearchOps
              captures: { d2_v: $.data.version }
          trigger:
            - call: "POST /research/data-disputes/${d1_id}/resolve"
              payload: { outcome: "REJECTED", resolution_note: "data verified", expected_dispute_version: "${d1_v}" }
              as: ResearchOps
            - call: "POST /research/data-disputes/${d2_id}/resolve"
              payload: { outcome: "ACCEPTED", resolution_note: "correction applied", expected_dispute_version: "${d2_v}" }
              as: ResearchOps
          assert:
            - "FundCompany.${finv_id}.open_dispute_count == 0 after both resolutions (two investigates +2, two resolves -2; the counter is conserved)"
            - "after the REJECTED resolution, Fund.${fdinv_id}.trailing_return_3y_bp was still 5000; after ACCEPTED it == 7000"
            - "DataDispute.${d1_id}.dispute_status == RESOLVED_REJECTED and DataDispute.${d2_id}.dispute_status == RESOLVED_ACCEPTED"
