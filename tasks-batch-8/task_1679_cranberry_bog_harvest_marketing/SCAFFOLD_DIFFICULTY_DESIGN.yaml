          instance is a barrel-quota boundary reached through the accept
          endpoint.
        test_recipe:
          setup:
            - "Member ACTIVE, ACTIVE bog, season OPEN, station capacity 5000"
            - "Delivery RECEIVED, net 100 (gross 150, tare 50)"
          setup_api_calls:
