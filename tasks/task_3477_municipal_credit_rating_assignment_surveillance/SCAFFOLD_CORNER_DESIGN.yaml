          - endpoints.POST_/muni/criteria-versions
        distinguishing_aspect: "Criteria weights summing to 0.990 (w_economy 0.19, the rest of the GO profile unchanged) are rejected 422 ERR_WEIGHT_SUM_INVALID at creation — the version is not even persisted as DRAFT."
