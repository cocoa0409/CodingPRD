# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2498_wire_cable_manufacturing
#
# Every instance grounds in elements already declared in SCAFFOLD.yaml §1.1-§1.7.
# All numeric asserts were computed with Decimal / ROUND_HALF_UP against the
# §1.3 formulas and their `constants:` before being written here as literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 - dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: metal_pass_through_lock_versus_float_invoice
        grounds:
          - calculations.shipment_invoice_amount
          - calculations.order_quoted_total
          - entities.CustomerOrder.fields.price_basis
          - entities.Shipment.fields.price_variant_applied
          - entities.Shipment.fields.metal_price_used_usd_per_lb
          - state_machines.Shipment.STAGED_to_INVOICED
        distinguishing_aspect: |
          This variant pair lives in the revenue-accounting domain on
          Shipment x CustomerOrder: ORDER_DATE_LOCK reprices nothing at invoice
          time and bills the 4.10 USD/lb pinned on the order, while
          SHIP_DATE_FLOAT bills the 4.3300 USD/lb mean of the inclusive
          five-day window ending on ship_date, so two otherwise identical
          5000 ft shipments invoice 544.58 versus 567.80.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Copper settlements: 2026-07-30 = 4.10, 2026-08-01 = 4.00, 2026-08-02 = 4.05, 2026-08-03 = 4.10, 2026-08-04 = 4.60, 2026-08-05 = 4.90."
            - "QUALIFIED insulation and jacket compounds, ACTIVE UL file E12345, RELEASED SKU THHN-12-CU (conductor_lbs_per_kft 19.8, base copper 3.00)."
            - "Customer ACME with pass_through_enabled true and credit_limit_usd 100000.00."
            - "Two orders on the same SKU, both conversion_price_usd_per_kft 85.00 and ordered_kft 5.000, order_date 2026-07-30: SO-LOCK on ORDER_DATE_LOCK and SO-FLOAT on SHIP_DATE_FLOAT."
            - "One rod lot of 20000 lbs; one packaged 5000 ft lot per order; one reel per order; both shipments STAGED with ship_date 2026-08-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-30", settlement_price_usd_per_lb: 4.10, source: "COMEX" }
              as: ProcurementBuyer
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-08-01", settlement_price_usd_per_lb: 4.00, source: "COMEX" }
              as: ProcurementBuyer
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-08-02", settlement_price_usd_per_lb: 4.05, source: "COMEX" }
              as: ProcurementBuyer
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-08-03", settlement_price_usd_per_lb: 4.10, source: "COMEX" }
              as: ProcurementBuyer
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-08-04", settlement_price_usd_per_lb: 4.60, source: "COMEX" }
              as: ProcurementBuyer
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-08-05", settlement_price_usd_per_lb: 4.90, source: "COMEX" }
              as: ProcurementBuyer
            - call: "POST /compounds"
              payload: { compound_code: "PVC-90-INS", layer_role: "INSULATION", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 12.5 }
              as: ProcessEngineer
              captures: { ins_id: $.data.id }
            - call: "POST /compounds/${ins_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /compounds"
              payload: { compound_code: "NYL-JKT", layer_role: "JACKET", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 5.0 }
              as: ProcessEngineer
              captures: { jkt_id: $.data.id }
            - call: "POST /compounds/${jkt_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "BLDG-WIRE", initial_listing_date: "2026-06-01", inspection_interval_days: 90 }
              as: CertificationOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-06-05", inspector_code: "INS-7", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
            - call: "POST /catalog-products"
              payload: { product_code: "THHN-12-CU", awg_size: "12", conductor_metal: "COPPER", conductor_construction: "STRANDED_7", application_rating: "THHN", voltage_class: "LV_600", temp_rating_c: 90, insulation_thickness_mils: 28, conductor_lbs_per_kft: 19.8, insulation_compound_id: "${ins_id}", jacket_compound_id: "${jkt_id}", listing_certification_id: "${cert_id}", base_target_kft: 100.0 }
              as: ProcessEngineer
              captures: { prod_id: $.data.id }
            - call: "POST /catalog-products/${prod_id}/release"
              payload: {}
              as: ProcessEngineer
            - call: "POST /customers"
              payload: { account_code: "ACME", name: "Acme Electric Supply", market_region: "MIDWEST", credit_limit_usd: 100000.00, pass_through_enabled: true, reel_program: "RETURNABLE" }
              as: BillingAnalyst
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", order_number: "SO-LOCK", ordered_kft: 5.000, price_basis: "ORDER_DATE_LOCK", conversion_price_usd_per_kft: 85.00, order_date: "2026-07-30" }
              as: BillingAnalyst
              captures: { ord_lock_id: $.data.id, ord_lock_v: $.data.version }
            - call: "POST /customer-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", order_number: "SO-FLOAT", ordered_kft: 5.000, price_basis: "SHIP_DATE_FLOAT", conversion_price_usd_per_kft: 85.00, order_date: "2026-07-30" }
              as: BillingAnalyst
              captures: { ord_float_id: $.data.id, ord_float_v: $.data.version }
            - call: "POST /rod-purchase-lots"
              payload: { metal: "COPPER", supplier_code: "SUP-1", rod_diameter_mm: 8.0, heat_number: "H-77Q", purchase_weight_lbs: 20000.00, purchase_price_usd_per_lb: 4.05, pricing_basis: "SPOT", received_date: "2026-07-25" }
              as: ProcurementBuyer
              captures: { rod_id: $.data.id, rod_v1: $.data.version }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", order_id: "${ord_lock_id}", lot_code: "LOT-A1", planned_length_ft: 5000, line_code: "EXT-1", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v1}" }
              as: ProcessEngineer
              captures: { lot_a_id: $.data.id }
            - call: "POST /production-lots/${lot_a_id}/process-steps"
              payload: { step: "DRAWING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_a_id}/process-steps"
              payload: { step: "STRANDING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_a_id}/process-steps"
              payload: { step: "EXTRUSION", measured_min_wall_mils: 25.5, measured_max_wall_mils: 30.0, measured_avg_od_mm: 4.10, surface_marking_text: "UL E12345 12AWG THHN 90C 600V" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_a_id}/tests"
              payload: { test_type: "SPARK", faults_detected: 0, duration_sec: 60 }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_a_id}/tests"
              payload: { test_type: "HIPOT", test_voltage_kv: 2.5, breakdown_detected: false, duration_sec: 300 }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_a_id}/release"
              payload: { packaged_length_ft: 5000 }
              as: QualityEngineer
              as_user_id: "qe-002"
            - call: "GET /rod-purchase-lots/${rod_id}"
              payload: {}
              as: ProcurementBuyer
              captures: { rod_v2: $.data.version }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", order_id: "${ord_float_id}", lot_code: "LOT-B1", planned_length_ft: 5000, line_code: "EXT-2", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v2}" }
              as: ProcessEngineer
              captures: { lot_b_id: $.data.id }
            - call: "POST /production-lots/${lot_b_id}/process-steps"
              payload: { step: "DRAWING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_b_id}/process-steps"
              payload: { step: "STRANDING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_b_id}/process-steps"
              payload: { step: "EXTRUSION", measured_min_wall_mils: 25.5, measured_max_wall_mils: 30.0, measured_avg_od_mm: 4.10, surface_marking_text: "UL E12345 12AWG THHN 90C 600V" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_b_id}/tests"
              payload: { test_type: "SPARK", faults_detected: 0, duration_sec: 60 }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_b_id}/tests"
              payload: { test_type: "HIPOT", test_voltage_kv: 2.5, breakdown_detected: false, duration_sec: 300 }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_b_id}/release"
              payload: { packaged_length_ft: 5000 }
              as: QualityEngineer
              as_user_id: "qe-002"
            - call: "POST /reels"
              payload: { reel_serial: "R-1001", reel_type: "WOOD_RETURNABLE", deposit_usd: 450.00, capacity_ft: 6000 }
              as: ShippingClerk
              captures: { reel_a_id: $.data.id }
            - call: "POST /reels/${reel_a_id}/load"
              payload: { lot_id: "${lot_a_id}", load_length_ft: 5000, occupancy_start_at: "2026-08-03T00:00:00Z" }
              as: ShippingClerk
            - call: "POST /reels"
              payload: { reel_serial: "R-1002", reel_type: "WOOD_RETURNABLE", deposit_usd: 450.00, capacity_ft: 6000 }
              as: ShippingClerk
              captures: { reel_b_id: $.data.id }
            - call: "POST /reels/${reel_b_id}/load"
              payload: { lot_id: "${lot_b_id}", load_length_ft: 5000, occupancy_start_at: "2026-08-03T00:00:00Z" }
              as: ShippingClerk
            - call: "POST /shipments"
              payload: { order_id: "${ord_lock_id}", lot_id: "${lot_a_id}", reel_id: "${reel_a_id}", shipped_length_ft: 5000, ship_date: "2026-08-05", expected_order_version: "${ord_lock_v}" }
              as: ShippingClerk
              captures: { ship_lock_id: $.data.id }
            - call: "POST /shipments"
              payload: { order_id: "${ord_float_id}", lot_id: "${lot_b_id}", reel_id: "${reel_b_id}", shipped_length_ft: 5000, ship_date: "2026-08-05", expected_order_version: "${ord_float_v}" }
              as: ShippingClerk
              captures: { ship_float_id: $.data.id }
          trigger:
            - call: "POST /shipments/${ship_lock_id}/invoice"
              payload: {}
              as: BillingAnalyst
            - call: "POST /shipments/${ship_float_id}/invoice"
              payload: {}
              as: BillingAnalyst
          assert:
            - "Shipment.${ship_lock_id}.price_variant_applied == ORDER_DATE_LOCK"
            - "Shipment.${ship_lock_id}.metal_price_used_usd_per_lb == 4.1000"
            - "Shipment.${ship_lock_id}.unit_price_usd_per_kft == 106.7800"
            - "Shipment.${ship_lock_id}.extended_amount_usd == 533.90"
            - "Shipment.${ship_lock_id}.volatility_surcharge_usd == 10.68"
            - "Shipment.${ship_lock_id}.invoice_amount_usd == 544.58"
            - "Shipment.${ship_float_id}.price_variant_applied == SHIP_DATE_FLOAT"
            - "Shipment.${ship_float_id}.metal_price_used_usd_per_lb == 4.3300"
            - "Shipment.${ship_float_id}.unit_price_usd_per_kft == 111.3340"
            - "Shipment.${ship_float_id}.extended_amount_usd == 556.67"
            - "Shipment.${ship_float_id}.volatility_surcharge_usd == 11.13"
            - "Shipment.${ship_float_id}.invoice_amount_usd == 567.80"
            - "Shipment.${ship_float_id}.invoice_amount_usd - Shipment.${ship_lock_id}.invoice_amount_usd == 23.22"
            - "CustomerOrder.${ord_lock_id}.quoted_metal_price_usd_per_lb == 4.1000 and CustomerOrder.${ord_float_id}.quoted_metal_price_usd_per_lb == 4.1000 (the quote records the same reference price for both bases)"

      - name: reel_deposit_flat_step_versus_daily_decay_refund
        grounds:
          - calculations.reel_deposit_refund
          - entities.Reel.fields.reel_type
          - entities.ReelReturn.fields.refund_variant_applied
          - entities.Customer.fields.credit_memo_balance_usd
          - state_machines.Reel.RETURN_PENDING_to_AVAILABLE
        distinguishing_aspect: |
          This variant pair lives in the container-deposit ledger domain on
          Reel x Customer, not in revenue accounting: at an identical 120 days
          out and an identical 450.00 deposit, WOOD_RETURNABLE settles on the
          FLAT_STEP 50-percent band for 225.00 while STEEL_RETURNABLE settles on
          the DAILY_DECAY curve max(0.30, 1 - 0.004*120) = 0.52 for 234.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one copper settlement on 2026-07-30 at 4.10."
            - "QUALIFIED compounds, ACTIVE UL file, RELEASED SKU THHN-12-CU, Customer ACME with credit_limit_usd 100000.00."
            - "Two orders of 5.000 kft each on ORDER_DATE_LOCK at conversion 85.00; two packaged 5000 ft lots from a 20000 lb rod lot."
            - "Reel R-W (WOOD_RETURNABLE, deposit 450.00) and reel R-S (STEEL_RETURNABLE, deposit 450.00), each loaded and shipped on 2026-08-05, so both reels are RETURN_PENDING with shipped_at 2026-08-05."
            - "Customer deposit_charged_total_usd 900.00 and reel_deposit_balance_usd 900.00 before the returns."
