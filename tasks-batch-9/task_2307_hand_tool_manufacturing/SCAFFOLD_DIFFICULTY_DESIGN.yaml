  - rule_id: resource_temporal_overlap
    instances:

      - name: furnace_campaign_ramp_buffer_exclusive_window
        grounds:
          - calculations.furnace_window_occupancy
          - validations[priority=600]
          - errors[ERR_FURNACE_WINDOW_CONFLICT]
          - entities.FurnaceCampaign.fields.buffered_end
        distinguishing_aspect: |
          HeatTreatFurnace is an EXCLUSIVE resource of capacity 1 whose occupied
          interval is extended by a trailing RAMP_BUFFER_MINUTES of 45. With a
          campaign at 06:00Z-10:00Z (buffered_end 10:45Z), a request starting
          10:44Z is refused and a request starting exactly 10:45Z is accepted, so
          the comparison is strict and the buffer is mandatory clearance.
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, 17 mm, CR_MO."
            - "One furnace FCE-1 qualified for CR_MO with max_charge_kg 900."
            - "One ProductionLot in FORGED / DRAFT with one SCHEDULED campaign occupying 2026-08-02T06:00Z-10:00Z, buffered_end 2026-08-02T10:45Z."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp1_id: $.data.id, camp1_buffered: $.data.buffered_end }
          trigger:
            - call: "POST /toolworks/furnace-campaigns"
