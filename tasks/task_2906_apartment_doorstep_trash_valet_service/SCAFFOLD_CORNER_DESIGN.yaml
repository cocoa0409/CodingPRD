          - errors[ERR_RESIDENT_NOT_FOUND]
        distinguishing_aspect: "The same ERR_RESIDENT_NOT_FOUND id serves the path-existence check here and the body-foreign-key check at priority 6 on scan creation, so both call sites must return 404 with that id."
        test_recipe:
