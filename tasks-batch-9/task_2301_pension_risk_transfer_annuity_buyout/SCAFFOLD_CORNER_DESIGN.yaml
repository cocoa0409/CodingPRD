# =============================================================================
# 1.9 Scaffold Corner Design — task 2301 Pension Risk Transfer & Annuity Buyout
#
# Breadth probe over SCAFFOLD.yaml 1.1-1.7. Every instance is reachable from an
# empty database by composing only the endpoints declared in 1.5, with the
# logical clock pinned by POST /_clock/set_current_utc. Corners already proved
# by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as excluded_because stubs that
# name the covering 1.8 instance.
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:
      - name: plan_creation_returns_every_declared_field_with_computed_funded_status
        claim_type: creation
        grounds:
          - entities.PensionPlan
          - endpoints.POST_/prt/plans
          - calculations.funded_status_measurement
        distinguishing_aspect: |
          A create must return the stored inputs AND the fields the system derives
          at creation in the same response: plan_status ONGOING, version 1,
          accounting_funded_status_bp 9200 from 92000000 / 100000000, and the
          settlement-basis figures at the 10700 bp uplift. An implementation that
          persists first and computes on read fails the funded-status assertions.
        test_recipe:
          setup:
            - "empty database, logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
          trigger:
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", plan_ein: "231004556", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id, plan_v: $.data.version, funded: $.data.accounting_funded_status_bp }
          assert:
            - "201 with response_type == object and meta.api_request_id present"
            - "PensionPlan.${plan_id}.sponsor_name == Ashcroft Machining, plan_name == Ashcroft Salaried Plan, plan_ein == 231004556"
            - "total_liability_cents == 100000000, plan_assets_cents == 92000000, service_cost_cents == 3000000, interest_cost_cents == 9000000, unrecognized_actuarial_loss_cents == 4000000, discount_rate_bps == 500"
            - "plan_status == ONGOING, version == 1, amendment_scope == null, amendment_adopted_at == null"
            - "accounting_funded_status_bp == 9200, cumulative_settlement_charge_cents == 0, deferred_settlement_charge_cents == 0, participant_liability_total_cents == 0"

      - name: plan_retrieval_returns_the_stored_values_unchanged
        claim_type: retrieval
        grounds:
          - endpoints.GET_/prt/plans/{id}
          - entities.PensionPlan
        distinguishing_aspect: |
          A read-back must be byte-identical to the create response and must not
          re-derive funded status from a mutated baseline. version must still be 1
          because a GET is not a write.
        test_recipe:
          setup:
            - "one PensionPlan created at clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", plan_ein: "231004556", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /prt/plans/${plan_id}"
              payload: {}
              as: Regulator
              as_user_id: "regulator-01"
              captures: { plan_v: $.data.version, funded: $.data.accounting_funded_status_bp }
          assert:
            - "200 with PensionPlan.${plan_id}.plan_ein == 231004556 and total_liability_cents == 100000000"
            - "version == 1 — a GET performs no write"
            - "accounting_funded_status_bp == 9200 on read-back"
            - "plan_status == ONGOING and residual_effective_at == null"

      - name: participants_listing_paginates_and_filters_by_data_status
        claim_type: listing
        grounds:
          - endpoints.GET_/prt/participants
          - response_envelope.pagination_fields
          - calculations.data_confidence_score
        distinguishing_aspect: |
          Filter and pagination must compose: three participants exist, exactly one
          has been cleansed to CLEAN, and a limit of 1 over the unfiltered set must
          report total_count 3 with has_more true while the filtered set reports
          total_count 1 with has_more false. An implementation that paginates before
          filtering, or that reports the page size as the total, fails.
        test_recipe:
          setup:
            - "one PensionPlan with three participants; only the first is cleansed to data_status CLEAN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", plan_ein: "231004556", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-0001", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 100000, final_average_monthly_earnings_cents: 250000, credited_service_months: 320, date_of_birth: "1968-04-04" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id }
            - call: "POST /prt/participants/${p1_id}/address-searches"
              payload: { search_result: "CONFIRMED_MATCH", confirmed_address_line1: "2 Ashcroft Way", confirmed_postal_code: "18042" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/participants/${p1_id}/mortality-checks"
              payload: { match_result: "NO_MATCH" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_v: $.data.version }
            - call: "POST /prt/participants/${p1_id}/benefit-audits"
              payload: { expected_participant_version: "${p1_v}" }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { a1_id: $.data.id }
            - call: "POST /prt/benefit-audits/${a1_id}/resolution"
              payload: { resolution: "ACCEPT_AS_IS" }
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-0002", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 90000, final_average_monthly_earnings_cents: 240000, credited_service_months: 300, date_of_birth: "1969-05-05" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p2_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-0003", cohort: "RETIREE_IN_PAY", stated_monthly_benefit_cents: 250000, final_average_monthly_earnings_cents: 500000, credited_service_months: 400, date_of_birth: "1956-06-06" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p3_id: $.data.id }
          trigger:
            - call: "GET /prt/participants"
              payload: { plan_id: "${plan_id}", limit: 1, offset: 0 }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { page1_first_ref: "$.data[0].participant_reference" }
            - call: "GET /prt/participants"
              payload: { plan_id: "${plan_id}", data_status: "CLEAN" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { clean_first_id: "$.data[0].id", clean_first_score: "$.data[0].data_confidence_score" }
            - call: "GET /prt/participants"
              payload: { plan_id: "${plan_id}", cohort: "RETIREE_IN_PAY" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { retiree_first_id: "$.data[0].id" }
          assert:
            - "the unfiltered page returns 1 row with total_count == 3 and has_more == true"
            - "the data_status == CLEAN filter returns exactly 1 row, id == ${p1_id}, with total_count == 1 and has_more == false"
            - "ParticipantRecord.${p1_id}.data_confidence_score == 100 and data_status == CLEAN"
            - "the cohort == RETIREE_IN_PAY filter returns exactly 1 row, id == ${p3_id}, with total_count == 1"
            - "ParticipantRecord.${p2_id}.data_confidence_score == 25 and data_status != CLEAN, so it is absent from the CLEAN page"

      - name: participant_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/prt/participants/{id}
          - errors.ERR_PARTICIPANT_NOT_FOUND
          - validations.priority_10
        distinguishing_aspect: |
          Path-existence resolution sits at priority 10, above every body check, so
          a syntactically valid but unknown UUID must return the entity's 404 and
          not a 422. The database is non-empty so a blanket 404 handler is not what
          is being observed.
        test_recipe:
          setup:
            - "one PensionPlan with one participant, so the collection is non-empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", plan_ein: "231004556", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-0001", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 100000, final_average_monthly_earnings_cents: 250000, credited_service_months: 320, date_of_birth: "1968-04-04" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "GET /prt/participants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
          assert:
            - "404 with response_type == error and data.error_id == ERR_PARTICIPANT_NOT_FOUND"
            - "the existing ParticipantRecord.${p1_id} is untouched with version == 1"

      - name: plan_creation_missing_plan_ein_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.PensionPlan.fields.plan_ein
          - validations.priority_20
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          plan_ein is source input with no default, so omitting it must fail at
          priority 20 before any numeric range check at priority 22 — the payload
          also carries a negative plan_assets_cents, and ERR_INVALID_REQUEST must
          still be the answer.
        test_recipe:
          setup:
            - "empty database, logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
          trigger:
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", total_liability_cents: 100000000, plan_assets_cents: -5, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
          assert:
            - "422 with data.error_id == ERR_INVALID_REQUEST, not ERR_INVALID_AMOUNT — priority 20 pre-empts priority 22"
            - "no PensionPlan row is created"

      - name: expert_conflict_disclosed_defaults_to_false_when_omitted
        claim_type: defaults
        grounds:
          - entities.IndependentExpert.fields.conflict_disclosed
          - entities.IndependentExpert.fields.expert_status
          - endpoints.POST_/prt/plans/{id}/independent-experts
        distinguishing_aspect: |
          Two defaults are asserted from one omission: conflict_disclosed false and
          expert_status INDEPENDENCE_REVIEW. The declared default matters because
          the independence review rejects a disclosed conflict — defaulting the
          field to true would make the engagement path unreachable.
        test_recipe:
          setup:
            - "one PensionPlan"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", plan_ein: "231004556", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /prt/plans/${plan_id}/independent-experts"
              payload: { expert_firm_name: "Wrenfield Fiduciary Counsel", engagement_scope: "SAFEST_AVAILABLE_ANNUITY_REVIEW" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { expert_id: $.data.id, conflict_flag: $.data.conflict_disclosed, expert_state: $.data.expert_status }
          assert:
            - "201 with IndependentExpert.${expert_id}.conflict_disclosed == false, applied from the declared default"
            - "expert_status == INDEPENDENCE_REVIEW and safest_available_opinion == null and opinion_issued_at == null"
            - "proposed_by_user_id == sponsor-treasury-01 and reviewed_by_user_id == null"
            - "version == 1"

      - name: participant_computed_fields_derive_from_inputs_and_recompute_on_cleansing
        claim_type: computed_fields
        grounds:
          - entities.ParticipantRecord.fields.accounting_liability_cents
          - entities.ParticipantRecord.fields.data_confidence_score
          - calculations.participant_liability
          - calculations.data_confidence_score
        distinguishing_aspect: |
          accounting_liability_cents, data_confidence_score and data_status are
          computed, never supplied: at creation the confidence is 100 minus 40 for
          an unconfirmed address, 20 for unverified mortality and 15 for a record
          never audited, i.e. 25, and it must be recomputed on every cleansing step
          — 65 once the address is confirmed, 85 once mortality is confirmed — while
          accounting_liability_cents stays pinned to the stated benefit at
          11460000 because cleansing changed no benefit input.
        test_recipe:
          setup:
            - "one PensionPlan"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", plan_ein: "231004556", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-0009", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 100000, final_average_monthly_earnings_cents: 250000, credited_service_months: 320, date_of_birth: "1968-04-04" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id, acct: $.data.accounting_liability_cents, score_at_create: $.data.data_confidence_score }
            - call: "POST /prt/participants/${p1_id}/address-searches"
              payload: { search_result: "CONFIRMED_MATCH", confirmed_address_line1: "9 Ashcroft Way", confirmed_postal_code: "18042" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { score_after_address: $.data.data_confidence_score }
            - call: "POST /prt/participants/${p1_id}/mortality-checks"
              payload: { match_result: "NO_MATCH" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { score_after_mortality: $.data.data_confidence_score, acct_after: $.data.accounting_liability_cents }
          assert:
            - "at creation ParticipantRecord.${p1_id}.data_confidence_score == 25 and data_status != CLEAN, with audited_monthly_benefit_cents == null because no audit has run"
            - "at creation accounting_liability_cents == 11460000 (annual 1200000 * 95500 / 10000) and address_search_attempts == 0 and tranche_id == null"
            - "after the confirmed address the score is recomputed to 65, not merely incremented, and data_status is still not CLEAN"
            - "after ALIVE_CONFIRMED the score is 85 — above DATA_CONFIDENCE_CLEAN_MIN but data_status is still not CLEAN because the audit deduction of 15 is what remains"
            - "accounting_liability_cents == 11460000 throughout — cleansing touches no benefit input, so the derived liability must not drift"

      - name: participant_system_fields_track_the_logical_clock_not_wall_time
        claim_type: system_fields
        grounds:
          - entities.ParticipantRecord
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          id, created_at, updated_at and version are system-generated. Two
          participants created either side of a clock advance must carry different
          created_at values equal to the clock at their creation, both starting at
          version 1 with updated_at == created_at; a later write to the first must
          move only its updated_at and version, leaving created_at frozen. An
          implementation that stamps rows from wall time cannot produce
          2026-08-01T00:00:00Z for the first row.
        test_recipe:
          setup:
            - "one PensionPlan created at clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", plan_ein: "231004556", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-0010", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 100000, final_average_monthly_earnings_cents: 250000, credited_service_months: 320, date_of_birth: "1968-04-04" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id, p1_created: $.data.created_at, p1_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-0011", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 90000, final_average_monthly_earnings_cents: 240000, credited_service_months: 300, date_of_birth: "1969-05-05" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p2_id: $.data.id, p2_created: $.data.created_at }
            - call: "POST /prt/participants/${p1_id}/address-searches"
              payload: { search_result: "CONFIRMED_MATCH", confirmed_address_line1: "10 Ashcroft Way", confirmed_postal_code: "18042" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_updated: $.data.updated_at, p1_v2: $.data.version }
          assert:
            - "ParticipantRecord.${p1_id}.created_at == 2026-08-01T00:00:00Z with version == 1 and updated_at == created_at at creation"
            - "ParticipantRecord.${p2_id}.created_at == 2026-08-05T00:00:00Z — the second row stamps the advanced clock, so created_at comes from the logical clock and not wall time"
            - "${p1_id} != ${p2_id}: ids are system-generated and unique"
            - "after the address search ParticipantRecord.${p1_id}.updated_at == 2026-08-05T00:00:00Z and version == 2 while created_at is still 2026-08-01T00:00:00Z"
            - "ParticipantRecord.${p2_id}.version == 1 — a write to a sibling never bumps another row's version"

      - name: participant_cohort_enum_rejects_a_value_outside_the_declared_set
        claim_type: type_constraints
        grounds:
          - entities.ParticipantRecord.fields.cohort
          - validations.priority_20
          - validations.priority_22
        distinguishing_aspect: |
          Two type constraints on one entity, each with its own error: an
          out-of-set cohort is ERR_INVALID_REQUEST at priority 20, while an
          in-range enum with credited_service_months 601 breaches the 0..600 bound
          and is ERR_INVALID_AMOUNT at priority 22. Collapsing both into one error
          code fails.
        test_recipe:
          setup:
            - "one PensionPlan"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", plan_ein: "231004556", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-0011", cohort: "SURVIVING_SPOUSE", stated_monthly_benefit_cents: 100000, final_average_monthly_earnings_cents: 250000, credited_service_months: 320, date_of_birth: "1968-04-04" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-0012", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 100000, final_average_monthly_earnings_cents: 250000, credited_service_months: 601, date_of_birth: "1968-04-04" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "GET /prt/participants"
              payload: { plan_id: "${plan_id}" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
          assert:
            - "the SURVIVING_SPOUSE cohort returns 422 ERR_INVALID_REQUEST — the declared set is RETIREE_IN_PAY | DEFERRED_VESTED"
            - "credited_service_months 601 returns 422 ERR_INVALID_AMOUNT — the declared bound is 0..600"
            - "GET /prt/participants?plan_id=${plan_id} returns total_count == 0 — neither rejected payload created a row"

      - name: settlement_entry_is_immutable_with_no_version_and_no_write_endpoint
        claim_type: immutability
        grounds:
          - entities.SettlementEntry
          - endpoints.GET_/prt/settlement-entries
          - state_machines.BuyoutTranche.ASSETS_TRANSFERRED_to_SETTLED
