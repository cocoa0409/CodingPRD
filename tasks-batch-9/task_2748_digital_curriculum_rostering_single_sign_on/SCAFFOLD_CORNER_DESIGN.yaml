              payload: { building_allocation_id: "${alloc_id}", subject_type: "STUDENT", student_id: "${s1_id}", expected_vendor_app_version: "${va_v2}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { a1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-12-18T09:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/terms/${term_id}/rollover"
              payload: {}
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
          trigger:
            - call: "GET /rostering/sections"
              payload: { term_id: "${term_id}" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "GET /rostering/sections"
              payload: { term_id: "${term_id}", status: "ACTIVE" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "GET /rostering/sections/${sec1_id}"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "GET /rostering/enrollments"
              payload: { section_id: "${sec1_id}" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "GET /rostering/app-accounts"
              payload: { building_allocation_id: "${alloc_id}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
            - call: "GET /rostering/vendor-apps/${va_id}/roster-feed"
              payload: {}
              as: VendorIntegrationManager
              as_user_id: "vim-001"
            - call: "GET /rostering/vendor-apps/${va_id}/roster-feed"
              payload: { include_archived: true }
              as: VendorIntegrationManager
              as_user_id: "vim-001"
          assert:
            - "the unfiltered section list returns total_count 1 with that row's status == ARCHIVED — archival does not hide the row from the district's own list"
            - "the status=ACTIVE list returns total_count 0"
            - "GET /rostering/sections/${sec1_id} returns HTTP 200 because clock 2026-12-18T09:00:00Z < archived_access_expires_at 2027-03-18T00:00:00.000Z"
            - "the enrollment list for the archived section returns total_count 1, roster_status DROPPED, section_id == ${sec1_id} — the child's FK to an archived parent still resolves"
            - "the account list for the allocation returns total_count 1 with seat_status RELEASED, identity_status SUSPENDED and building_allocation_id == ${alloc_id} still resolvable"
            - "the plain roster feed returns HTTP 200 with zero sections — the vendor-facing read excludes archived classes by default"
            - "the include_archived=true feed returns HTTP 200 and lists section SEC-3001 with an empty student list, since rollover put every enrollment in DROPPED and DROPPED rows are outside sync scope"

  # ===========================================================================
  # SECTION 9 — Consistency Model  (immediate)
  # ===========================================================================
  - section: Consistency Model
    instances:
      - name: immediate_consistency_withdrawal_cascade_visible_to_the_very_next_read
        claim_type: "immediate — all changes visible in the same request's response"
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Student[ENROLLED->WITHDRAWN]
          - entities.VendorApp.committed_charge_cents
          - entities.School.enrolled_student_count
        distinguishing_aspect: "One POST must leave five other aggregates already reconciled — no publish, no clock advance, no background pass. The trap is a lazy implementation that recomputes School.enrolled_student_count or VendorApp.committed_charge_cents only on the next write to those rows; under an immediate model the FIRST read after the withdrawal must already show enrolled_student_count 0 and committed_charge_cents 0, and the withdraw response itself must already carry the terminal Student state."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z (inside the add/drop window, cutoff 2026-09-15); ACTIVE Northside building; ACTIVE Term Fall 2026; teacher Dana Reed; section SEC-3001."
            - "Student STU-2001 ENROLLED with an ACTIVE enrollment effective 2026-08-20, holding a provisioned AppAccount on an ACTIVE PER_STUDENT licence (total_seats 4, price 1000, allocation 4, consumed 1, committed_charge_cents 1000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
            - call: "POST /rostering/terms/${term_id}/activate"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/teachers"
              payload: { school_id: "${sch_ne_id}", sis_staff_id: "STF-1001", full_name: "Dana Reed", email: "dana.reed@district.k12" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { t1_id: $.data.id }
            - call: "POST /rostering/sections"
              payload: { school_id: "${sch_ne_id}", term_id: "${term_id}", primary_teacher_id: "${t1_id}", sis_section_id: "SEC-3001", course_code: "MATH4", subject: "MATH", period_index: 3, meeting_days: ["MON", "WED", "FRI"], max_seats: 5 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sec1_id: $.data.id }
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2001", first_name: "Alex", last_name: "Nakamura", grade_level: 4, date_of_birth: "2016-05-04" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s1_id: $.data.id }
            - call: "POST /rostering/vendor-apps"
              payload: { name: "MathBlast", vendor_code: "MBX", term_id: "${term_id}", rostering_standard: "ONEROSTER_REST_1P2", identifier_strategy: "SIS_ID", username_domain: "apps.district.k12", grade_band_scope: ["ELEMENTARY"], seat_model: "PER_STUDENT", allocation_policy: "PROPORTIONAL_HEADCOUNT", overage_policy: "BLOCK", total_seats: 4, price_per_seat_cents: 1000 }
              as: VendorIntegrationManager
              as_user_id: "vim-001"
              captures: { va_id: $.data.id }
            - call: "POST /rostering/vendor-apps/${va_id}/activate-license"
              payload: {}
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
            - call: "GET /rostering/building-allocations"
              payload: { vendor_app_id: "${va_id}", school_id: "${sch_ne_id}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { alloc_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-20T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/enrollments"
              payload: { section_id: "${sec1_id}", student_id: "${s1_id}", requested_effective_date: "2026-08-20" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { e1_id: $.data.id }
            - call: "GET /rostering/vendor-apps/${va_id}"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { va_v2: $.data.version }
            - call: "POST /rostering/app-accounts"
              payload: { building_allocation_id: "${alloc_id}", subject_type: "STUDENT", student_id: "${s1_id}", expected_vendor_app_version: "${va_v2}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { a1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-09-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "POST /rostering/students/${s1_id}/withdraw"
              payload: { withdrawal_effective_date: "2026-09-01" }
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
            - call: "GET /rostering/enrollments/${e1_id}"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "GET /rostering/app-accounts/${a1_id}"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
            - call: "GET /rostering/building-allocations/${alloc_id}"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
            - call: "GET /rostering/vendor-apps/${va_id}"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
            - call: "GET /rostering/schools/${sch_ne_id}"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "GET /rostering/sections/${sec1_id}"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
          assert:
            - "the withdraw call itself returns HTTP 200 with enrollment_state == WITHDRAWN and withdrawal_effective_date == '2026-09-01' — the terminal state is in the write's own response, not merely in a later read"
            - "the first read of Enrollment ${e1_id} shows roster_status DROPPED with drop_effective_date == '2026-09-01'"
            - "the first read of AppAccount ${a1_id} shows seat_status RELEASED, refunded_charge_cents == 1000 (clock date 2026-09-01 <= cutoff 2026-09-15), identity_status DEPROVISIONED and deprovision_scheduled_date == '2026-09-01'"
            - "the first read of BuildingAllocation ${alloc_id} shows consumed_seats == 0 with allocated_seats still 4"
            - "the first read of VendorApp ${va_id} shows consumed_seats == 0, unallocated_seats == 0 (allocation untouched) and committed_charge_cents == 0 — 1000 charged minus 1000 refunded, already net"
            - "the first read of School ${sch_ne_id} shows enrolled_student_count == 0 and Section ${sec1_id}.active_enrollment_count == 0"
            - "no publish, no clock advance and no second write occurred between the withdrawal and any of these reads"

      - name: immediate_consistency_provisioning_charge_reaches_parent_before_next_read
        claim_type: "immediate — cross-aggregate derived fields do not lag"
        grounds:
          - complexity_profile.consistency_model
          - "endpoints[POST /rostering/app-accounts]"
          - entities.BuildingAllocation.consumed_seats
          - entities.VendorApp.consumed_seats
        distinguishing_aspect: "A single grandchild insert must land on two ancestors at once — the building's consumed_seats and the licence's consumed_seats/committed_charge_cents — while the allocation axis (allocated_seats, unallocated_seats) stays frozen. Reading the before-picture and the after-picture around one POST pins both the propagation and its boundary: consumption is not allocation."
        test_recipe:
          setup:
            - "Clock at 2026-08-20T00:00:00Z; ACTIVE Northside building; ACTIVE Term Fall 2026; student STU-2001 ENROLLED."
            - "One ACTIVE PER_STUDENT licence total_seats 4 price 1000 with its sole allocation of 4 seats on Northside, nothing consumed yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
            - call: "POST /rostering/terms/${term_id}/activate"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2001", first_name: "Alex", last_name: "Nakamura", grade_level: 4, date_of_birth: "2016-05-04" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s1_id: $.data.id }
            - call: "POST /rostering/vendor-apps"
              payload: { name: "MathBlast", vendor_code: "MBX", term_id: "${term_id}", rostering_standard: "ONEROSTER_REST_1P2", identifier_strategy: "SIS_ID", username_domain: "apps.district.k12", grade_band_scope: ["ELEMENTARY"], seat_model: "PER_STUDENT", allocation_policy: "PROPORTIONAL_HEADCOUNT", overage_policy: "BLOCK", total_seats: 4, price_per_seat_cents: 1000 }
              as: VendorIntegrationManager
              as_user_id: "vim-001"
              captures: { va_id: $.data.id }
            - call: "POST /rostering/vendor-apps/${va_id}/activate-license"
              payload: {}
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
            - call: "GET /rostering/building-allocations"
              payload: { vendor_app_id: "${va_id}", school_id: "${sch_ne_id}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { alloc_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-20T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "GET /rostering/vendor-apps/${va_id}"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { va_before: $.data.version }
            - call: "POST /rostering/app-accounts"
              payload: { building_allocation_id: "${alloc_id}", subject_type: "STUDENT", student_id: "${s1_id}", expected_vendor_app_version: "${va_before}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { a1_id: $.data.id }
            - call: "GET /rostering/vendor-apps/${va_id}"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
            - call: "GET /rostering/building-allocations/${alloc_id}"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
            - call: "GET /rostering/app-accounts"
              payload: { building_allocation_id: "${alloc_id}", seat_status: "RESERVED" }
              as: IdentityAdmin
              as_user_id: "ia-001"
          assert:
            - "the before-read shows consumed_seats == 0, committed_charge_cents == 0, unallocated_seats == 0 and version == 2"
            - "the provisioning returns HTTP 201 with seat_charge_cents == 1000 (clock date 2026-08-20 <= cutoff, so full rate) and seat_status RESERVED"
            - "the immediately following licence read shows consumed_seats == 1 and committed_charge_cents == 1000 — exactly the child's seat_charge_cents, visible with no intervening write"
            - "the same read still shows allocated capacity untouched: unallocated_seats == 0 and version == 3"
            - "the allocation read shows consumed_seats == 1 with allocated_seats still 4 and borrowed_seats 0"
            - "the filtered account list returns total_count 1 with that account's id == ${a1_id}"
